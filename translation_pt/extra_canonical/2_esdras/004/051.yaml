  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: pt
  text: 'Então orei e disse: “Achas que viverei até aqueles dias? Ou quem estará naqueles dias?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim traz aqui uma forma textual difícil, “quiserit”, provavelmente correspondente a “quis erit”, isto é, “quem estará”.
    reason: Informa com transparência a dificuldade do texto-fonte e a base da tradução, sem explicitar além do que a provável leitura latina permite.
lexical_decisions:
- source_word: oravi
  choice: orei
  rationale: Mantém diretamente o sentido religioso do latim e o encadeamento narrativo.
- source_word: putas vivo usque in diebus illis
  choice: Achas que viverei até aqueles dias?
  rationale: Expressa em português natural a pergunta sobre permanecer vivo até o tempo anunciado; “até aqueles dias” preserva a referência temporal do latim.
- source_word: vel quiserit in diebus illis
  choice: Ou quem viverá naqueles dias?
  rationale: O texto latino transmitido parece aglutinar ou corromper “qui erit”; no contexto, a pergunta diz respeito a quem estará vivo naquele tempo. “Viverá” torna explícito esse sentido sem alterar a ideia central.
theological_decisions:
- issue: Identidade das pessoas que presenciarão os dias anunciados
  choice: quem viverá naqueles dias
  alternative: quem estará naqueles dias
  rationale: A formulação escolhida mantém aberta a identidade dessas pessoas e apenas esclarece, pelo contexto da primeira pergunta, que se trata de estar vivo naquele período; não acrescenta uma doutrina sobre sobrevivência, ressurreição ou geração futura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Achas” conserva o tom direto da pergunta sem soar excessivamente coloquial. A resposta do interlocutor, embora comece no trecho latino fornecido, pertence à sequência seguinte e não foi incluída no texto deste versículo, em conformidade com a delimitação apresentada.
