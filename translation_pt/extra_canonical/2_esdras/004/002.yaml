  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: pt
  text: 'e me disse: “Seu coração foi muito além neste mundo, e você pensa que pode compreender o caminho do Altíssimo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excedens excessit cor tuum
  choice: Seu coração ficou completamente perplexo
  rationale: A construção intensiva excedens excessit reforça o verbo, e o provável semitismo descreve o coração, isto é, a mente, como desconcertado ou incapaz de compreender. A formulação evita sugerir que Esdras simplesmente ultrapassou um limite moral.
- source_word: in saeculo hoc
  choice: neste mundo
  rationale: Neste contexto, saeculum designa a ordem ou era presente. “Neste mundo” é natural em português e preserva o contraste implícito com as realidades superiores.
- source_word: comprehendere cogitas
  choice: você pensa que pode compreender
  rationale: Expressa a ideia de cogitar ou supor ser capaz de abarcar intelectualmente algo, em português corrente.
- source_word: uiam altissimi
  choice: o caminho do Altíssimo
  rationale: Mantém a metáfora de uia e o título divino Altissimi sem explicá-los indevidamente.
theological_decisions:
- issue: Sentido de excedens excessit cor tuum
  choice: Seu coração ficou completamente perplexo
  alternative: Seu coração foi muito além
  rationale: O argumento parece enfatizar a limitação cognitiva de Esdras diante do mundo presente, não uma transgressão moral. A construção verbal intensiva apoia “completamente”, enquanto “perplexo” comunica o provável idioma semítico sem eliminar a imagem do coração.
- issue: Alcance de uiam altissimi
  choice: o caminho do Altíssimo
  alternative: os caminhos do Altíssimo
  rationale: O latim traz o singular uiam; ele foi preservado para não ampliar ou sistematizar o sentido teológico.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla. A oração interrogativa preserva a repreensão retórica e a tensão entre a perplexidade humana e o caminho divino.
