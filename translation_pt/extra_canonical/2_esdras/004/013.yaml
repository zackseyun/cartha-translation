lexical_decisions:
- source_word: profectus sum
  choice: Saí rumo a
  rationale: Expressa o movimento deliberado de proficiscor no perfeito, sem acrescentar um advérbio temporal como “certa vez”.
- source_word: siluam lignorum campi
  choice: uma floresta de árvores da planície
  rationale: Mantém a construção concreta e algo incomum do latim, importante porque as árvores são personificadas na sequência.
- source_word: cogitauerunt cogitationem
  choice: conceberam um plano
  rationale: Traduz de modo natural o cognato latino, cujo sentido idiomático é elaborar ou formular um plano.
- source_word: uenite et eamus
  choice: Venham, vamos
  rationale: Preserva a passagem do convite dirigido ao grupo para a ação conjunta proposta.
- source_word: faciamus ad
  choice: façamos contra
  rationale: Conserva, tanto quanto possível em português, a formulação truncada no fim do versículo latino, sem antecipar o complemento presente no versículo seguinte.
