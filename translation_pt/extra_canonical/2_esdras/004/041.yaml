  rationale: Forma natural e digna de tratamento direto em contexto bíblico.
theological_decisions:
- issue: Sentido de inferno
  choice: mundo dos mortos
  alternative: inferno
  rationale: A tradução preserva a referência geral ao domínio dos mortos e não a identifica indevidamente com o lugar de punição final.
- issue: Final fragmentário do texto
  choice: Manter a oração incompleta com reticências
