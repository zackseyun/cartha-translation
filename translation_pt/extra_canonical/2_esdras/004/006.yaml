revisions:
- from: 'E respondi: “Quem, entre os que nasceram, seria capaz de fazer isso, para que me perguntes sobre estas coisas?”'
  to: 'E respondi e disse: “Quem, entre os que nasceram, poderá fazer isto, para que me perguntes sobre estas coisas?”'
  rationale: A revisão restaura a fórmula narrativa explícita e verte poterit por «poderá», conservando o futuro do indicativo. Mantêm-se «os que nasceram», «isto» e «estas coisas», bem como a construção retórica com «para que», para não resolver interpretativamente a relação sintática de ut.
