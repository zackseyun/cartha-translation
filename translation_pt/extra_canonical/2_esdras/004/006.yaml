source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi : quis natorum poterit hoc facere, ut me interroges de his ?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/006.yaml
  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: pt
  text: 'E respondi e disse: “Quem, entre os que nasceram, poderá fazer isto, para que me perguntes sobre estas coisas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: natorum
  choice: os que nasceram
  rationale: Reproduz o sentido literal e abrangente do genitivo plural latino, referindo-se aos seres humanos nascidos, sem acrescentar uma interpretação não expressa no texto.
- source_word: poterit hoc facere
  choice: seria capaz de fazer isso
  rationale: Expressa naturalmente em português a ideia de capacidade contida em poterit, preservando o caráter retórico da pergunta.
- source_word: de his
  choice: sobre estas coisas
  rationale: Mantém a referência demonstrativa próxima do latim, sem generalizá-la como “tais coisas”.
theological_decisions:
- issue: Alcance de “natorum”
  choice: os que nasceram
  alternative: os mortais / os seres humanos
  rationale: A formulação escolhida conserva a imagem do nascimento presente no latim e evita restringir ou interpretar teologicamente o referente.
translation_notes:
  register: Português moderno, digno e de leitura natural. A fórmula latina redundante “respondi e disse” foi vertida simplesmente por “respondi”, uso mais idiomático em português, sem perda de conteúdo. O subjuntivo “perguntes” preserva a relação retórica expressa por ut me interroges.
