id: 2ES.12.18
reference: 2 Esdras 12:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: pt
  text: 'Esta é a interpretação: depois de algum tempo daquele reino[a], surgirão conflitos nada pequenos, e ele correrá o risco de cair, mas não cairá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois do tempo daquele reino”.'
    reason: Preserva a ambiguidade de post tempus regni illius entre o transcurso de algum tempo durante o reino e um momento posterior ao tempo dele.
lexical_decisions:
- source_word: post tempus regni illius
  choice: depois de algum tempo daquele reino
  rationale: O latim pode indicar o transcurso de certo tempo dentro da existência do reino, não necessariamente o fim de sua era. A formulação portuguesa mantém essa leitura sem eliminar a alternativa mais estritamente literal, registrada em nota.
- source_word: contentiones non modicae
  choice: conflitos nada pequenos
  rationale: Preserva a litotes do latim e comunica que os conflitos serão consideráveis, sem especificar indevidamente se serão disputas políticas, guerras ou discórdias internas.
- source_word: periclitabitur ut cadat
  choice: correrá o risco de cair
  rationale: Expressa naturalmente a ideia de estar em perigo de queda, mantendo a personificação do reino e a tensão com a afirmação seguinte.
- source_word: et non cadet
  choice: mas não cairá
  rationale: A conjunção adversativa torna explícito em português o contraste já presente no encadeamento latino, sem acrescentar uma indicação temporal ausente da fonte.
theological_decisions:
- issue: Se os conflitos surgem depois do fim do reino ou após algum tempo de sua existência
  choice: depois de algum tempo daquele reino
  alternative: depois do tempo daquele reino
  rationale: A sequência afirma que o reino estará em risco de cair, mas não cairá, o que favorece entender post tempus como 'depois de algum tempo'. Como a construção latina admite leitura mais literal, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a litotes “nada pequenos” e evita-se definir além do latim a natureza dos conflitos.
