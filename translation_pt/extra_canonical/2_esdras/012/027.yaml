  text: a espada os devorará. Pois a espada de um devorará aquele que está com ele,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim da segunda frase é truncado; o antecedente de «ele» não é explicitado.
    reason: Preserva a incerteza textual real quanto ao referente de eo, sem apresentar como possível uma leitura de unius que a gramática latina não sustenta.
lexical_decisions:
- source_word: gladius eos comedet
  choice: a espada os devorará
  rationale: Reproduz diretamente a metáfora latina de a espada “comer” ou “devorar” pessoas, usando em português o verbo natural e vigoroso “devorar”.
- source_word: Vnius ... gladius
  choice: a espada de um
  rationale: Mantém o genitivo latino unius (“de um”), em vez de o transformar sem necessidade em “uma espada”.
- source_word: qui cum eo
  choice: aquele que está com ele
  rationale: Conserva a referência pessoal mais provável de qui e eo, embora a construção latina seja truncada e ambígua.
