  yaml_path: translation/extra_canonical/2_esdras/012/049.yaml
  text: And now go, each of you, to his own house, and I will come to you after these days.”
translation:
  language: pt
  text: E agora, vão, cada um para sua casa, e eu virei até vocês depois destes dias.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ite
  choice: vão
  rationale: Imperativo plural natural e direto em português moderno.
- source_word: unusquisque uestrum
  choice: cada um
  rationale: Reproduz distributivamente o latim sem a redundância pouco natural de «cada um de vocês», já que «vocês» aparece na oração seguinte.
- source_word: ueniam ad uos
  choice: irei até vocês
  rationale: Em português, do ponto de vista de quem fala e se encontra separado dos destinatários, «irei até vocês» expressa naturalmente o movimento indicado por ad uos; «virei até vocês» também seria possível em certos contextos.
- source_word: post dies istos
  choice: depois destes dias
  rationale: Mantém de perto a expressão temporal latina e sua possível referência aos dias imediatamente mencionados no contexto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência brasileira por «vocês». A coordenação e a sequência temporal do latim foram preservadas.
