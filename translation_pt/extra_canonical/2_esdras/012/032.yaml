source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: pt
  text: Este é o Ungido[a], a quem o Altíssimo reservou para o fim, contra eles e suas impiedades. Ele os repreenderá por suas injustiças e colocará diante deles os seus desprezos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim unctus significa literalmente “ungido”. Nesta visão, a figura atua como o libertador do fim dos tempos, que repreende o reino representado pela águia e resgata o remanescente; por isso, o título tem força messiânica.
    reason: messianic_passage
lexical_decisions:
- source_word: unctus
  choice: Ungido
  rationale: Preserva o sentido literal do latim e, como título, deixa perceptível sua força messiânica no contexto da visão.
- source_word: reservavit
  choice: reservou
  rationale: Expressa com precisão a ideia de alguém guardado e destinado pelo Altíssimo para uma ocasião futura.
- source_word: ad eos et impietates ipsorum
  choice: para enfrentar a eles e suas impiedades
  rationale: 'O valor contextual de ad é adversativo/final: o Ungido foi reservado para agir contra essas pessoas e sua impiedade. A formulação evita o pouco natural ''contra eles e suas impiedades'' sem eliminar a abrangência da expressão.'
- source_word: iniustitiis
  choice: injustiças
  rationale: Mantém o plural e a referência aos atos injustos pelos quais eles serão repreendidos.
- source_word: infulciet coram ipsis spretiones eorum
  choice: colocará diante deles seus atos de desprezo
  rationale: Reproduz a imagem de apresentar ou lançar diante deles aquilo em que seu desprezo se manifestou; 'atos de desprezo' torna natural o plural abstrato spretiones sem reduzir seu alcance.
theological_decisions:
- issue: Força messiânica de unctus
  choice: Ungido, com inicial maiúscula e nota explicativa
  alternative: Messias
  rationale: A tradução mantém o título literal do latim e, ao mesmo tempo, sinaliza a função messiânica da figura sem substituir o termo-fonte por uma interpretação plenamente explicitada.
- issue: Objeto da missão final do Ungido
  choice: para enfrentar a eles e suas impiedades
  alternative: contra eles e suas impiedades
  rationale: Preserva a ação escatológica adversativa do texto sem definir além do que o latim diz a natureza exata desse confronto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção foi levemente ajustada para fluência, preservando o paralelismo, a linguagem judicial e a tensão escatológica do latim.
