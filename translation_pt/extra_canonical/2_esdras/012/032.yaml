revisions:
- from: Este é o Ungido[a], a quem o Altíssimo reservou para o fim, para enfrentar a eles e suas impiedades. Ele os repreenderá por suas injustiças e colocará diante deles seus atos de desprezo.
  to: Este é o Ungido[a], a quem o Altíssimo reservou para o fim, contra eles e suas impiedades. Ele os repreenderá por suas injustiças e colocará diante deles os seus desprezos.
  rationale: A revisão substitui uma paráfrase menos precisa por «contra eles e suas impiedades», que reproduz o sentido adversativo de ad e é natural em português. Também remove «atos», acréscimo não exigido por spretiones, preservando a formulação mais aberta do original. A nota e a designação «Ungido» permanecem adequadas.
