  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/031.yaml
  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: pt
  text: como viste. E o leão que viste despertar da floresta, rugindo, falando à águia e repreendendo-a por suas injustiças e por todas as suas palavras, como ouviste—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: euigilantem
  choice: despertar
  rationale: Traduz diretamente a ideia de acordar ou despertar, mantendo a imagem do leão que se põe em ação na floresta.
- source_word: mugientem
  choice: rugindo
  rationale: Embora o verbo latino possa significar literalmente mugir ou bramir, “rugir” é a expressão natural em português para a voz ameaçadora de um leão.
- source_word: arguentem
  choice: repreendendo-a
  rationale: Expressa a censura acusatória dirigida pelo leão à águia sem acrescentar uma noção jurídica mais específica do que o latim exige.
- source_word: iniustitias
  choice: injustiças
  rationale: Preserva de modo formal o plural e o conteúdo moral do termo latino.
- source_word: sermones
  choice: palavras
  rationale: No contexto, refere-se ao que a águia disse; “palavras” é amplo e natural, sem restringir o sentido a discursos formais.
theological_decisions:
- issue: Identidade do leão
  choice: Não explicitar sua identidade neste versículo
  alternative: Incluir a frase seguinte “Este é o ungido...”
  rationale: A unidade fornecida e a revisão de divisão de versículos situam em 12:31 o texto somente até sicut audisti; a identificação iniciada por Hic est unctus, quem pertence à continuação e ficaria sintaticamente incompleta aqui.
- issue: Referente dos possessivos em “suas injustiças” e “suas palavras”
  choice: Manter o possessivo potencialmente ambíguo
  alternative: Explicitar “as injustiças da águia” e “todas as palavras dela”
  rationale: O latim refere gramaticalmente os possessivos à águia, mas a formulação com possessivos preserva a estrutura e continua clara no contexto sem excesso de explicitação.
translation_notes:
  register: Português atual, digno e fluente, com sintaxe próxima do latim. O travessão final sinaliza que a explicação continua no versículo seguinte. Não se reproduziu a nota inglesa ligada a “as you saw”, pois ela parece ser resíduo de uma versão anterior e não registra uma variante real do texto latino.
