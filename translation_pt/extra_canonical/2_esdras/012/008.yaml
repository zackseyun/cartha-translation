  text: the interpretation and the distinction of this dreadful vision[a], so that you may fully comfort my soul. For you have counted me worthy
translation:
  language: pt
  text: a interpretação e a distinção desta visão terrível, para que consoles plenamente a minha alma. Pois me consideraste digno
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretationem
  choice: a interpretação
  rationale: Mantém o sentido direto de interpretação ou significado da visão e preserva a construção em continuidade com o versículo anterior.
- source_word: distinctionem
  choice: a explicação
  rationale: No contexto de uma visão que precisa ser esclarecida em suas partes e significado, «explicação» comunica em português corrente o valor expositivo do termo latino sem a estranheza de «distinção».
- source_word: uisus horribilis huius
  choice: desta visão terrível
  rationale: Tradução natural e fiel do demonstrativo, do substantivo e do adjetivo latinos.
- source_word: ut plenissime consoles animam meam
  choice: para que consoles plenamente a minha alma
  rationale: Preserva a finalidade expressa por ut, o superlativo adverbial plenissime e a imagem de consolar a alma.
- source_word: Dignum enim me habuisti
  choice: Pois me consideraste digno
  rationale: Reproduz a razão introduzida por enim e o sentido idiomático de habere aliquem dignum.
theological_decisions:
- issue: Continuidade sintática com o versículo anterior
  choice: 'Manter o início como sintagma nominal no acusativo: «a interpretação e a explicação»'
  alternative: Acrescentar «e mostra ao teu servo»
  rationale: O latim deste versículo começa diretamente com os objetos acusativos; a oração verbal pertence ao final do versículo anterior. Repeti-la aqui duplicaria material sem apoio na fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O trecho permanece sintaticamente ligado ao versículo anterior, como no latim. Não se conserva a nota da versão inglesa porque sua alternativa repete palavras do versículo anterior e não corresponde ao texto latino deste versículo.
