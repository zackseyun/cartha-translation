  yaml_path: translation/extra_canonical/2_esdras/012/005.yaml
  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: pt
  text: e em meu espírito estou muito fraco, e não há em mim nem um pouco de força, por causa do grande medo que me aterrorizou nesta noite. Agora, portanto, orarei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritu meo
  choice: em meu espírito
  rationale: Preserva a referência explícita ao espírito e a construção locativa/instrumental do latim sem reduzi-la a mero estado emocional.
- source_word: inualidus sum ualde
  choice: estou muito fraco
  rationale: Expressa de modo natural a intensa debilidade indicada por ualde, sem acrescentar uma causa não declarada.
- source_word: nec modica est in me uirtus
  choice: não resta em mim nem um pouco de força
  rationale: Virtus aqui denota força ou vigor. “Não resta” torna idiomático o resultado da experiência, embora o latim diga literalmente “não há”.
- source_word: a multo timore
  choice: por causa do grande medo
  rationale: Representa o valor causal de a e a intensidade de multo.
- source_word: quem expaui
  choice: que me aterrorizou
  rationale: Mantém a força de expavesco, que indica ficar profundamente aterrorizado, e reproduz naturalmente em português a relação entre medo e terror.
- source_word: Nunc ergo orabo
  choice: Agora, portanto, orarei
  rationale: Preserva tanto a transição lógica de ergo quanto o futuro de orabo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo entre fraqueza espiritual e ausência de força, bem como a intensidade do terror noturno.
