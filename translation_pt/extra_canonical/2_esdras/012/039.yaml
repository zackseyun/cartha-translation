  yaml_path: translation/extra_canonical/2_esdras/012/039.yaml
  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: pt
  text: Mas você, permaneça aqui por mais sete dias, para que lhe seja mostrado tudo o que parecer bem ao Altíssimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sustine hic
  choice: permaneça aqui
  rationale: No contexto, o verbo latino expressa continuar ou ficar no lugar; esta formulação é natural e clara em português.
- source_word: alios dies septem
  choice: por mais sete dias
  rationale: Reproduz de modo idiomático a duração adicional indicada pelo latim.
- source_word: quicquid uisum fuerit altissimo
  choice: tudo o que o Altíssimo quiser
  rationale: A construção idiomática latina indica aquilo que parecer bem ou agradar ao Altíssimo; “quiser” comunica esse sentido sem impor conteúdo específico.
- source_word: ostendatur ... ostendatur
  choice: lhe seja mostrado ... mostrar a você
  rationale: Mantém a repetição verbal e a relação entre a revelação recebida e a vontade do Altíssimo.
theological_decisions:
- issue: Agência e vontade do Altíssimo
  choice: “tudo o que o Altíssimo quiser mostrar a você”
  alternative: “tudo o que parecer bem ao Altíssimo mostrar a você”
  rationale: A escolha preserva a soberania da decisão divina em linguagem corrente, sem especificar de antemão o conteúdo da revelação.
- issue: Frase final presente na camada inglesa
  choice: Omitir “E ele se afastou de mim”
  alternative: Incluí-la conforme o inglês POB
  rationale: Essa frase não consta no texto latino fornecido para 12:39; a tradução segue prioritariamente a evidência da fonte original apresentada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” segue o registro corrente, e a construção passiva preserva a forma da fonte sem soar excessivamente arcaica.
