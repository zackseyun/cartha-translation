base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: pt
  text: que eu olhei[a], e eis que a cabeça que havia restado não apareceu. E as duas asas que haviam passado para ela se levantaram e foram erguidas para reinar; o reinado delas foi breve e cheio de tumulto. Olhei, e eis que elas também não apareciam, e todo o corpo da águia estava em chamas[b], e a terra estava muito aterrorizada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase dá continuidade à oração iniciada no versículo anterior.
    reason: A abertura latina é sintaticamente fragmentária quando isolada, pois retoma o contexto precedente.
  - marker: b
    text: 'Ou: “estava sendo incendiado”.'
    reason: A forma latina é imperfeita e passiva, podendo enfatizar tanto o estado contínuo de combustão quanto a ação sofrida pelo corpo da águia.
lexical_decisions:
- source_word: superauerat
  choice: havia restado
  rationale: O mais-que-perfeito latino indica a cabeça que sobrevivera ou permanecera após as demais; “havia restado” é natural e preserva essa anterioridade.
- source_word: surrexerunt ... erectae sunt
  choice: se levantaram e foram erguidas
  rationale: Mantém as duas ações verbais distintas, uma ativa e outra passiva, sem fundi-las em um único movimento.
- source_word: regnum ... exile
  choice: o reinado ... foi breve
  rationale: Neste contexto, regnum designa o exercício do governo das asas; exile qualifica sua pouca duração ou extensão, e “breve” comunica naturalmente o sentido contextual.
- source_word: tumulti plenum
  choice: cheio de tumulto
  rationale: Reproduz de perto a expressão latina e conserva a ideia de agitação e desordem.
- source_word: non conparuit ... non apparesebant
  choice: não apareceu ... não apareciam
  rationale: Preserva a repetição lexical e evita interpretar explicitamente as formas como desaparecimento consumado.
- source_word: incendebatur
  choice: estava em chamas
  rationale: Expressa o aspecto durativo do imperfeito latino e a cena visionária em andamento, sem sugerir que a combustão já se completara.
- source_word: expauescebat ... ualde
  choice: ficou profundamente aterrorizada
  rationale: Comunica a intensidade de ualde em português atual e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A sequência narrativa foi mantida próxima do latim, sobretudo na duplicação dos verbos relativos à ascensão das asas e na repetição de “não apareceu/não apareciam”.
