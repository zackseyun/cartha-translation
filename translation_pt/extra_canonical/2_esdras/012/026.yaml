source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui perficient nouissima eius. Et quoniam uidisti caput maius non apparescens, quoniam unus ex eis super lectum suum morietur, et tamen cum tormentis. Nam duo qui superauerunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/026.yaml
  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: pt
  text: e completarão seus atos finais. E, porque você viu que a cabeça maior não aparecia, isso significa que um deles morrerá em sua cama, mas ainda assim em tormentos. Quanto aos dois que sobreviveram,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: perficient nouissima eius
  choice: completarão seus atos finais
  rationale: Expressa a conclusão das ações finais do poder representado, preservando a amplitude de nouissima sem tornar a frase excessivamente literal.
- source_word: caput maius
  choice: a cabeça maior
  rationale: Mantém diretamente a imagem simbólica do texto latino.
- source_word: non apparescens
  choice: desaparecer
  rationale: No contexto da visão, indica que a cabeça deixa de estar visível; esta formulação é natural em português.
- source_word: super lectum suum morietur
  choice: morrerá em sua cama
  rationale: Tradução direta e idiomática da expressão latina.
- source_word: cum tormentis
  choice: em meio a tormentos
  rationale: Preserva a ideia de que a morte, embora ocorra na cama, será acompanhada de sofrimento.
- source_word: duo qui superauerunt
  choice: os dois que sobreviveram
  rationale: Superauerunt indica aqui os dois restantes, que sobreviveram aos demais.
theological_decisions:
- issue: Natureza dos 'atos finais'
  choice: manter a referência aberta
  alternative: explicitar como feitos políticos, juízos ou últimos acontecimentos
  rationale: O latim não especifica a natureza desses atos, e a tradução não deve impor uma interpretação histórica ou teológica.
- issue: Relação entre morte na cama e tormentos
  choice: preservar a tensão com 'mas em meio a tormentos'
  alternative: interpretar os tormentos como anteriores à morte ou como punição posterior
  rationale: O texto afirma ambos sem explicar a relação temporal ou teológica entre eles.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O trecho final permanece sintaticamente aberto porque a fonte fornecida termina no início da frase seguinte.
