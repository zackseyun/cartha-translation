    issue: «desaparecer» para non apparescens
    rationale: O particípio latino negado descreve a cabeça como não aparecendo ou não sendo visível. «Desaparecer» acrescenta a noção de uma mudança de estado que o texto fornecido não exprime.
  - severity: low
    issue: Construção perifrástica «quanto ao fato de você ter visto»
    rationale: Embora compreensível, torna a frase mais pesada sem refletir uma distinção do latim; «porque você viu» traduz quoniam de forma direta.
