translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A ordem das orações segue de perto o latim sem conservar construções artificiais. Não se reteve a nota da camada inglesa, pois ela apenas oferecia como alternativa uma ordem de palavras já representada naturalmente no texto e seu marcador estava ligado a uma expressão sem relação com a nota.
