  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: pt
  text: Eu, porém, fiquei sentado no campo durante sete dias, conforme ele me ordenou, e comi somente as flores do campo; naqueles dias, meu alimento era feito de ervas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedi
  choice: fiquei sentado
  rationale: Expressa naturalmente o perfeito latino e a permanência no campo durante os sete dias, sem ampliar o sentido para uma atividade não indicada.
- source_word: flores solummodo agri
  choice: somente as flores do campo
  rationale: Preserva tanto a exclusividade marcada por “solummodo” quanto a imagem concreta de “flores”.
- source_word: de herbis facta est mihi esca
  choice: meu alimento era feito de ervas
  rationale: Reproduz de modo claro e natural a construção passiva e o sentido de que as ervas constituíam seu alimento nesses dias.
