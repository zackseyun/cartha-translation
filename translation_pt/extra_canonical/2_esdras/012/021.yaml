  yaml_path: translation/extra_canonical/2_esdras/012/021.yaml
  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: pt
  text: cujos tempos serão breves[a] e cujos anos passarão depressa. Dois deles perecerão quando o tempo intermediário se aproximar, mas quatro serão preservados para o tempo em que o seu fim começar a se aproximar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «leves». Neste contexto, a palavra latina provavelmente significa «breves» ou «fugazes».'
    reason: Preserva a possibilidade lexical formal de leuia e explica por que «breves» foi adotado no texto.
lexical_decisions:
- source_word: leuia
  choice: breves
  rationale: Com referência a períodos de tempo, o latim leuis pode significar breve, fugaz ou de pouca duração. «Breves» comunica naturalmente a curta duração desses tempos, sem recorrer ao literal pouco claro «leves».
- source_word: anni citati
  choice: anos passarão depressa
  rationale: Citati indica movimento rápido ou acelerado. A formulação verbal soa natural em português e preserva a ideia de anos que transcorrem rapidamente.
- source_word: tempore medio
  choice: tempo intermediário
  rationale: Mantém a referência a um período situado no meio sem identificar ou explicar além do que o texto latino permite.
- source_word: seruabuntur
  choice: serão preservados
  rationale: Reproduz o sentido passivo de ser guardado ou conservado e mantém o registro solene do texto.
theological_decisions:
- issue: Identidade e significado profético dos tempos e dos governantes
  choice: Manter as referências indefinidas do texto, sem identificar os personagens nem harmonizar a cronologia.
  alternative: Explicitar uma interpretação histórica ou escatológica específica.
  rationale: O versículo não fornece essas identificações, e acrescentá-las importaria uma leitura teológica externa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
