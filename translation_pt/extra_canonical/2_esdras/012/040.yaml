  text: And it happened, when all the people heard that seven days had passed and I had not returned to the city, that all of them gathered together, from the least to the greatest, and came to
translation:
  language: pt
  text: E aconteceu que, quando todo o povo soube que haviam passado sete dias e que eu não tinha voltado à cidade, todos se reuniram, do menor ao maior, e vieram até
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum audisset omnis populus
  choice: quando todo o povo soube
  rationale: O latim emprega literalmente ‘ouviu’, mas neste contexto a expressão comunica que a notícia chegou ao conhecimento de todo o povo; ‘soube’ é natural e fiel ao sentido.
- source_word: pertransierunt septem dies
  choice: haviam passado sete dias
  rationale: Mantém a relação temporal anterior ao ajuntamento do povo em português corrente.
- source_word: a minimo usque ad maximum
  choice: do menor ao maior
  rationale: Preserva a fórmula inclusiva e a ordem do texto latino sem especificar indevidamente idade, posição ou condição social.
- source_word: uenit ad
  choice: vieram até
  rationale: Conserva a frase incompleta do fragmento fornecido, que prossegue no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação narrativa ‘E aconteceu que’ preserva o estilo da fonte; a terminação aberta é mantida porque o texto-fonte termina em ‘uenit ad’.
