  text: finem suam, hoc erat regnum exile et turbationis plenum, Sicut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: pt
  text: '“E, quanto ao fato de você ter visto duas pequenas asas passarem para a cabeça do lado direito, esta é a interpretação: são aqueles que o Altíssimo preservou para o seu fim. Esse foi um reino breve e cheio de turbulência,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: finem suam
  choice: para o seu fim
  rationale: Mantém o possessivo reflexivo do latim e preserva a possível relação do fim com o reino ou com a figura representada, sem explicitar além do texto.
- source_word: regnum exile
  choice: reino breve
  rationale: No contexto interpretativo da visão, indica um governo de pouca duração; “breve” comunica isso de modo natural, enquanto “reino” conserva o termo político do latim e a formulação da camada inglesa auditada.
- source_word: turbationis plenum
  choice: cheio de perturbação
  rationale: Reproduz de perto a construção latina e mantém o sentido de agitação, instabilidade ou tumulto sem escolher apenas uma dessas nuances.
theological_decisions:
- issue: Referente do possessivo em “finem suam”
  choice: seu fim
  alternative: o fim
  rationale: O latim contém um possessivo, mas seu referente pode não ser inteiramente transparente. A formulação portuguesa conserva essa ambiguidade em vez de identificar dogmaticamente de quem ou do que é o fim.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura explicativa clara. Empregou-se “você” por legibilidade brasileira ampla e “Altíssimo” como título tradicional e transparente.
