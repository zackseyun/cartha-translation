  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/034.yaml
  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: pt
  text: ele libertará com misericórdia o meu povo[a], aqueles que foram preservados em meus domínios, e fará que se alegrem até que venha o fim, o dia do juízo, do qual lhe falei desde o princípio. Este é o sonho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma tradução anterior trazia: “E, quando os tiver repreendido, então os destruirá. Mas libertará com misericórdia o remanescente do meu povo, aqueles que foram preservados dentro das minhas fronteiras, e os encherá de alegria até que venha o fim, o dia do juízo, do qual lhe falei desde o princípio.” As palavras anteriores a “libertará” pertencem ao versículo precedente no texto latino aqui adotado.'
    reason: previous_rendering
lexical_decisions:
- source_word: liberabit cum misericordia
  choice: libertará com misericórdia
  rationale: Mantém tanto a ação futura de livrar quanto a misericórdia como modo ou acompanhamento dessa libertação.
- source_word: qui saluati sunt
  choice: aqueles que foram preservados
  rationale: O particípio passivo pode significar os que foram salvos ou mantidos a salvo; “preservados” comunica bem a ideia contextual de sobreviventes sem acrescentar “remanescente”, ausente neste recorte latino.
- source_word: super fines meos
  choice: dentro das minhas fronteiras
  rationale: Neste contexto territorial, fines indica limites ou território; a formulação segue a compreensão de permanência dentro das fronteiras, embora a preposição latina seja incomum.
- source_word: iocundabit eos
  choice: os encherá de alegria
  rationale: Expressa naturalmente o sentido causativo de fazer que eles se alegrem.
- source_word: dies iudicii
  choice: o dia do juízo
  rationale: Equivalente tradicional, claro e não sectário para a expressão judicial escatológica.
theological_decisions:
- issue: Identidade e extensão do povo libertado
  choice: “o meu povo, aqueles que foram preservados”
  alternative: “o meu povo que foi salvo”
  rationale: Conserva a aposição explicativa e o plural de qui saluati sunt, sem decidir além do texto se todos os integrantes do povo ou um grupo preservado estão em vista.
- issue: Material anteriormente associado ao versículo
  choice: Excluir as frases sobre repreender, destruir e o remanescente
  alternative: Incluí-las como parte do texto principal
  rationale: Essas palavras pertencem ao trecho latino anterior e não ao recorte fornecido para 12:34; o texto principal segue estritamente a extensão do versículo na fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o trecho prossegue no versículo seguinte. O marcador [a] aparece no texto principal e documenta a tradução anterior e o deslocamento de versificação.
