  rationale: Mantém o título divino tradicional e corresponde diretamente ao acusativo latino regido pelo verbo de oração recuperado do contexto.
- source_word: confortet
  choice: fortaleça
  rationale: Expressa de modo natural a ideia de dar força ou sustento, preservando o valor do subjuntivo na oração de finalidade.
- source_word: usque in finem
  choice: até o fim
  rationale: Tradução direta que conserva aberta a referência do “fim”, sem especificá-la como fim da vida, da provação ou da visão.
