  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your slave.”
translation:
  language: pt
  text: 'E eu disse: “Ó Soberano Senhor, se encontrei favor diante dos teus olhos, se fui considerado justo diante de ti mais do que muitos e se a minha súplica certamente subiu à tua presença, fortalece-me e mostra-me, teu escravo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O objeto de “mostra-me” não está expresso no texto latino. Pode-se subentender “a ti mesmo”, “isso” ou outro objeto indicado pelo contexto.
    reason: Preserva a ambiguidade sintática de ostende seruo tuo mihi, sem incluir no texto principal um objeto que o latim não declara.
lexical_decisions:
- source_word: dominator domine (preservado de forma fragmentária como nator domine)
  choice: Ó Soberano Senhor
  rationale: Reproduz o título solene com naturalidade em português e corresponde ao sentido de autoridade expresso por dominator, sem a rigidez de “Senhor, Dominador”.
- source_word: inueni gratiam ante oculos tuos
  choice: encontrei favor diante dos teus olhos
  rationale: Mantém a imagem semítica conservada no latim e usa uma formulação bíblica clara em português.
- source_word: iustificatus sum apud te prae multis
  choice: fui considerado justo diante de ti mais do que muitos
  rationale: Preserva a voz passiva e a comparação potencialmente difícil do texto, sem transformá-la em afirmação de superioridade moral absoluta.
- source_word: certum ascendit deprecatio mea ante faciem tuam
  choice: a minha súplica certamente subiu à tua presença
  rationale: “Certamente” comunica o valor adverbial de certum; “subiu à tua presença” conserva tanto o movimento ascendente quanto a linguagem relacional de ante faciem tuam.
- source_word: Conforta me
  choice: fortalece-me
  rationale: Expressa diretamente o pedido de receber força ou ânimo.
- source_word: seruo tuo
  choice: teu escravo
  rationale: Mantém o sentido social forte de seruus, em vez de suavizá-lo automaticamente para “servo”.
theological_decisions:
- issue: Sentido do verbo ostende sem objeto expresso
  choice: mostra-te a mim
  alternative: mostra a mim / mostra isso a mim
  rationale: O latim traz ostende sem objeto explícito. A leitura reflexiva completa o sentido de maneira coerente com o pedido por revelação, mas a nota registra a elipse e evita apresentar a interpretação como indiscutível.
- issue: Linguagem de justificação
  choice: fui considerado justo diante de ti
  alternative: fui justificado junto de ti
  rationale: A opção escolhida preserva a avaliação divina expressa pelo passivo latino sem impor ao verbo um sentido técnico desenvolvido por uma tradição teológica específica.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento por “tu” coerente com a oração. Conservam-se imagens bíblicas marcantes, enquanto construções latinas pouco naturais são ajustadas para fluência. A designação “escravo” é deliberadamente forte e fiel a seruus.
