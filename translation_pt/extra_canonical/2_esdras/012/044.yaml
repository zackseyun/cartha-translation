  text: nobis mala quae contigerunt? Si ergo tu nos dereliqueris, quanto erat nobis melius, si essemus succensi et nos in incendio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: pt
  text: Ou não bastam os males que nos sobrevieram? Se, pois, nos abandonares, quanto melhor teria sido para nós se também tivéssemos sido queimados no incêndio[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “queimados no fogo”.'
    reason: Registra uma tradução portuguesa igualmente natural de succensi ... in incendio, sem intensificar o sentido de «queimados».
lexical_decisions:
- source_word: mala quae contigerunt
  choice: os males que nos sobrevieram
  rationale: Expressa de modo natural e fiel os males que aconteceram ao povo.
- source_word: dereliqueris
  choice: nos abandonares
  rationale: Preserva o sentido direto de deixar ou desamparar, sem acrescentar interpretação teológica.
- source_word: succensi ... in incendio
  choice: queimados no incêndio
  rationale: Mantém a imagem concreta do latim e evita a formulação redundante ‘queimados na queima’.
theological_decisions:
- issue: A possibilidade de Deus abandonar o povo
  choice: Se, pois, nos abandonares
  alternative: Se, pois, nos desamparares
  rationale: A tradução conserva sem atenuação a tensão do apelo dirigido a Deus; ‘abandonares’ é claro e corresponde a dereliqueris.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construção retórica natural. O marcador da nota foi colocado junto à expressão a que ela se refere.
