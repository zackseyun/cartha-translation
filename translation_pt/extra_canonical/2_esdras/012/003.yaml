  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: pt
  text: 'Então despertei de grande perturbação mental[a] e de grande medo, e disse ao meu espírito: “Veja, você me proporcionou estas coisas, porque”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de um profundo transe”.'
    reason: A expressão latina excessus mentis pode indicar perturbação ou arrebatamento mental, êxtase ou transe; a nota preserva essa possibilidade sem a impor ao texto.
lexical_decisions:
- source_word: a multo excessu mentis
  choice: de uma grande perturbação da mente
  rationale: A expressão latina excessus mentis descreve um estado mental fora do comum, como êxtase, transe ou profundo atordoamento. No contexto de uma visão e do despertar, “grande perturbação da mente” preserva a dimensão psicológica sem impor que se tratava necessariamente de um transe.
- source_word: uigilaui
  choice: despertei
  rationale: O verbo latino indica que o narrador voltou ao estado de vigília após a experiência visionária.
- source_word: spiritui meo
  choice: ao meu espírito
  rationale: Tradução formal e natural que preserva a maneira incomum pela qual o narrador se dirige ao próprio espírito.
- source_word: mihi praestitisti haec
  choice: você me fez passar por estas coisas
  rationale: Expressa em português corrente a ideia de que o espírito lhe ocasionou ou proporcionou as experiências mencionadas, preservando o plural demonstrativo haec.
- source_word: in eo quod
  choice: porque
  rationale: A locução introduz a explicação que continua no versículo seguinte; a oração fica deliberadamente incompleta, como no texto latino fornecido.
theological_decisions:
- issue: Natureza do excessus mentis
  choice: grande perturbação da mente
  alternative: profundo transe; grande êxtase
  rationale: A tradução não define de modo excessivamente específico a experiência visionária e conserva a amplitude semântica da expressão latina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” na fala dirigida ao próprio espírito. A frase termina em “porque” para conservar a continuidade sintática do texto-fonte com o versículo seguinte.
