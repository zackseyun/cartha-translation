id: 2ES.12.48
reference: 2 Esdras 12:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: pt
  text: Pois eu não abandonei vocês nem me afastei de vocês; antes, vim a este lugar para suplicar por causa da desolação de Sião e buscar misericórdia para a humilhação do santuário de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: abandonei
  rationale: Expressa de modo natural e direto a ideia de deixar alguém desamparado.
- source_word: excessi a uobis
  choice: me afastei de vocês
  rationale: Mantém o paralelismo com “abandonei” e corresponde ao sentido de partir ou retirar-se da presença deles.
- source_word: deprecarer pro desolatione Sion
  choice: suplicar por causa da desolação de Sião
  rationale: “Por causa de” evita sugerir que Esdras desejava a desolação; a súplica é motivada pela ruína de Sião.
- source_word: quererem misericordiam
  choice: buscar misericórdia
  rationale: Reproduz a procura insistente por compaixão sem acrescentar um destinatário não expresso.
- source_word: sanctificationis uestrae
  choice: do santuário de vocês
  rationale: No contexto, o substantivo latino designa o lugar santo ou santuário da comunidade, e não o processo abstrato de santificação.
- source_word: humilitate
  choice: humilhação
  rationale: Preserva a imagem de rebaixamento, abatimento ou estado desonrado do santuário.
theological_decisions:
- issue: Sentido de “pro” nas duas expressões de intercessão
  choice: “por causa da desolação” e “para a humilhação”
  alternative: “pela desolação” e “pela humilhação”
  rationale: A formulação distingue com clareza a calamidade que motiva a súplica sem resolver além do necessário como a misericórdia se relaciona com o santuário humilhado.
- issue: Referente de “sanctificationis”
  choice: santuário
  alternative: santificação ou lugar santo
  rationale: O contexto da desolação de Sião favorece o espaço sagrado; “santuário” comunica essa referência de forma natural e sem impor uma leitura denominacional.
translation_notes:
  register: Português atual, digno e acessível, com “vocês” para o plural e estrutura próxima do latim sem sacrificar a naturalidade. O ponto e vírgula conserva a oposição entre a negativa inicial e o propósito da ida ao campo.
