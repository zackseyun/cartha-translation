- source_word: timoratio omnium regnorum
  choice: o terror de todos os reinos
  rationale: Trata «timoratio» como substantivo de temor ou terror, sem introduzir no texto principal um comparativo que não aparece na forma latina fornecida.
- source_word: quae fuerunt ante eam
  choice: que existiram antes dela
  rationale: Expressa naturalmente a existência anterior dos reinos e mantém o pronome feminino que retoma a entidade mencionada no contexto precedente.
