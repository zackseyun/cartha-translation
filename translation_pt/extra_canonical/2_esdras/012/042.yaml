  source_fidelity: A revisão é necessária porque «que resta» acrescenta a noção de remanescente, ausente de botrus de uindemia. «Você ficou sentado» também sugere permanência continuada, enquanto sedisti é simplesmente o perfeito de «sentar-se».
  naturalness: «Você se sentou neste lugar?» é uma forma moderna, clara e natural para o perfeito latino, preservando a pergunta direta. A sequência comparativa permanece fluente e solene.
  terminology: «Vindima» preserva a imagem agrícola do latim uindemia; «cacho» e «lâmpada» reproduzem adequadamente botrus e lucerna. «Você supera todos os profetas» mantém a comparação expressa por superasti, sem introduzir a interpretação de que só ele teria restado.
