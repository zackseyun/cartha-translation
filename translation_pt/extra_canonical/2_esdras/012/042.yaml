  yaml_path: translation/extra_canonical/2_esdras/012/042.yaml
  text: have sat in this place? For you surpass for us all the prophets, like a cluster from the vintage, and like a lamp in a dark place,"
translation:
  language: pt
  text: Você se sentou neste lugar? Pois, para nós, você supera todos os profetas, como um cacho da vindima e como uma lâmpada em um lugar escuro.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedisti
  choice: você ficou sentado
  rationale: Expressa naturalmente em português o perfeito latino e mantém a referência à permanência no lugar, dentro da pergunta iniciada no contexto anterior.
- source_word: nobis superasti ex omnibus prophetis
  choice: para nós, você supera todos os profetas
  rationale: Preserva a comparação explícita do latim, sem adotar a leitura interpretativa de que Esdras seria o único profeta restante.
- source_word: botrus de uindemia
  choice: um cacho que resta da vindima
  rationale: Mantém a imagem agrícola e explicita com moderação a relação idiomática do cacho com a colheita já realizada; a formulação sugere preciosidade e remanescência sem substituir a comparação principal.
- source_word: lucerna in loco obscuro
  choice: uma lâmpada em lugar escuro
  rationale: Reproduz de modo claro e digno a imagem latina, sem acréscimo interpretativo.
theological_decisions:
- issue: A relação de Esdras com os demais profetas
  choice: você supera todos os profetas
  alternative: você é o único de todos os profetas que nos restou
  rationale: O texto latino disponível traz superasti, que favorece superioridade ou superação; a alternativa depende de uma interpretação contextual não expressa diretamente nessa forma textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O fragmento começa no meio de uma pergunta; por isso, a inicial minúscula preserva a continuidade sintática do versículo anterior.
