  - severity: low
    issue: «Ficou sentado» introduz aspecto durativo
    rationale: Sedisti é perfeito de sedere e pergunta se o interlocutor se sentou; «ficou sentado» pode sugerir que ele permaneceu sentado, nuance não indicada pela forma latina.
