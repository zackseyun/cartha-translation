  yaml_path: translation/extra_canonical/2_esdras/012/029.yaml
  text: 'the two little wings crossing over to the head that is on the right side—this is the interpretation: these are the ones whom the Most High has preserved in[a]'
translation:
  language: pt
  text: 'as duas pequenas asas que passam por cima da cabeça que está à direita — esta é a interpretação: são aqueles que o Altíssimo preservou em[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino fornecido termina aqui, no meio da frase.
    reason: A nota explica por que o versículo termina com a preposição “em” sem complemento; a antiga nota inglesa pertence a um trecho desalinhado do versículo anterior e não deve ser perpetuada.
lexical_decisions:
- source_word: duas subalares
  choice: as duas pequenas asas
  rationale: “Subalares” designa as asas menores; a expressão natural “pequenas asas” preserva a distinção da imagem.
- source_word: treicentes super caput
  choice: passando para a cabeça
  rationale: O particípio descreve o movimento das duas asas em direção à cabeça; “passando para” comunica o sentido sem acrescentar uma relação não expressa.
- source_word: quod est a dextera parte
  choice: que fica do lado direito
  rationale: Tradução clara e direta da localização da cabeça.
- source_word: hii sunt quos conseruauit altissimus
  choice: são estes os que o Altíssimo preservou
  rationale: Mantém o demonstrativo enfático e traduz “Altissimus” pelo título bíblico corrente “Altíssimo”.
- source_word: in
  choice: em
  rationale: O texto latino fornecido termina na preposição “in”; a tradução conserva deliberadamente a frase incompleta, sem conjecturar seu complemento.
theological_decisions:
- issue: Frase interrompida após “in”
  choice: preservar a interrupção com “em” e nota textual
  alternative: completar a oração por conjectura ou por material de outro versículo
  rationale: A evidência-fonte apresentada está truncada nesse ponto; completar a frase resolveria indevidamente uma lacuna textual e poderia reproduzir o antigo desalinhamento de versículos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas a imagem apocalíptica e a incompletude da fonte foram preservadas.
