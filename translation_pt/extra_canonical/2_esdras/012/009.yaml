  text: to show me the end of the times and the last things of the times.” And he said to me[a], “This is the interpretation of this vision that
translation:
  language: pt
  text: 'para me mostrar o fim dos tempos e os últimos acontecimentos dos tempos”. E ele me disse[a]: “Esta é a interpretação desta visão que'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para me mostrar o fim dos tempos e os últimos acontecimentos dos tempos».'
    reason: Registra a delimitação alternativa da fala presente na tradução anterior, sem alterar a leitura principal favorecida pela sequência latina.
lexical_decisions:
- source_word: temporum finem
  choice: o fim dos tempos
  rationale: Reproduz de modo natural e direto a expressão latina, preservando seu sentido temporal e escatológico.
- source_word: temporum nouissima
  choice: os últimos acontecimentos dos tempos
  rationale: Traduz nouissima substantivado sem reduzir a expressão simplesmente ao mesmo sentido de «fim»; «acontecimentos» explicita em português o que está implícito no neutro plural latino.
- source_word: interpretatio
  choice: interpretação
  rationale: Equivalente formal e corrente no contexto da explicação de uma visão.
theological_decisions:
- issue: Relação entre «fim dos tempos» e «últimos acontecimentos dos tempos»
  choice: Manter as duas expressões distintas
  alternative: Fundir ambas como «o fim dos tempos»
  rationale: A repetição e a possível diferença de nuance estão presentes no latim e não devem ser harmonizadas ou resolvidas silenciosamente.
- issue: Delimitação do discurso no manuscrito latino sem pontuação original vinculante
  choice: Seguir a leitura principal, na qual «E ele me disse» introduz a interpretação
  alternative: Encerrar o versículo após a fala do vidente, conforme a divisão indicada na nota
  rationale: 'A sequência «et dixit ad me: Haec est interpretatio» favorece naturalmente que o novo discurso comece com a resposta do interlocutor, embora a tradição anterior reflita outra delimitação.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a estrutura fragmentária no final («que»), pois o texto-fonte fornecido termina no pronome relativo e continua no versículo seguinte.
