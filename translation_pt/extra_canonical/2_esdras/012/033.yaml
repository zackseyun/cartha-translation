  yaml_path: translation/extra_canonical/2_esdras/012/033.yaml
  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
translation:
  language: pt
  text: E acontecerá que, quando os tiver repreendido, então os destruirá. Pois o restante[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino fornecido termina aqui no meio da frase; «Pois o restante» continua no versículo seguinte.
    reason: fragment_boundary
lexical_decisions:
- source_word: arguerit
  choice: tiver repreendido
  rationale: O verbo latino pode significar repreender, censurar ou declarar culpado. «Tiver repreendido» preserva o sentido judicial e corretivo sem acrescentar uma condenação não explicitada.
- source_word: corrumpet
  choice: destruirá
  rationale: Neste contexto de juízo, corrumpere indica levar à ruína ou destruir, e não apenas corromper moralmente.
- source_word: residuum
  choice: o restante
  rationale: Tradução direta que preserva a frase incompleta e sua ligação com a continuação do texto.
theological_decisions:
- issue: Agente dos verbos no trecho
  choice: Manter o pronome «ele» implícito nas formas verbais portuguesas
  alternative: Identificar explicitamente o agente como o Ungido ou o Altíssimo
  rationale: O fragmento latino fornecido não nomeia o sujeito; identificá-lo aqui dependeria do contexto anterior e poderia resolver indevidamente uma referência pronominal.
translation_notes:
  register: Português moderno, claro e digno. A construção «quando os tiver repreendido» reproduz a relação temporal do latim, e «então» conserva a ênfase de tunc. Não se aproveitou a antiga redação inglesa indicada na nota b, pois ela pertence ao versículo anterior e resulta de desalinhamento textual.
