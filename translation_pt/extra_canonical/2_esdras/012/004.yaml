- issue: Sentido de animus
  choice: espírito
  alternative: alma; ânimo
  rationale: O contexto descreve desgaste interior. 'Espírito' preserva a amplitude antropológica do termo e acompanha a leitura auditada, sem impor uma distinção técnica entre alma e espírito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A conjunção final 'e' foi mantida porque o fragmento fornecido termina com uma oração incompleta que continua no versículo seguinte.
