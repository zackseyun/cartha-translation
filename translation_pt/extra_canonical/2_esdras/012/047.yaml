  verdict: revise
  source_fidelity: A cláusula traduzida corresponde a «Est enim memoria uestri coram altissimo». Contudo, «a lembrança de vocês» em português moderno tende a ser entendida como a lembrança que vocês têm, e não como a memória/recordação que se tem de vocês, enfraquecendo o genitivo objetivo latino. «tu domus Jacob» parece pertencer ao encerramento da unidade anterior, em conformidade com a delimitação da trilha inglesa, e não deve ser incorporado a este versículo.
  naturalness: «Pois a memória que se tem de vocês está diante do Altíssimo» conserva a construção nominal e a imagem do latim, ao mesmo tempo que torna explícita, de modo natural, a leitura objetiva necessária em português. O ponto final é apropriado, pois o segmento fornecido e a revisão inglesa encerram a cláusula neste ponto.
  terminology: «Altíssimo» é a equivalência estabelecida e reverente para «altissimo». «Memória» mantém o campo semântico de «memoria» melhor do que uma paráfrase que simplesmente afirmasse que Deus se lembra do povo.
