  text: For the memory of you is before the Most High[a][b],
translation:
  language: pt
  text: Pois a memória que se tem de vocês está diante do Altíssimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memoria uestri
  choice: a lembrança de vocês
  rationale: 'Mantém a imagem nominal do latim e expressa o genitivo objetivo: trata-se da lembrança que o Altíssimo tem deles, não do ato de eles se lembrarem.'
- source_word: coram altissimo
  choice: diante do Altíssimo
  rationale: Reproduz a expressão espacial e reverencial do latim sem reduzir seu sentido a uma simples paráfrase como “o Altíssimo se lembra”.
- source_word: enim
  choice: Pois
  rationale: Preserva a relação explicativa ou fundamentadora com o contexto anterior.
theological_decisions:
- issue: A memória do povo perante Deus
  choice: Conservar a metáfora “a lembrança de vocês está diante do Altíssimo”
  alternative: “O Altíssimo se lembra de vocês”
  rationale: A alternativa é mais idiomática, mas elimina a formulação imagética do texto latino; a tradução escolhida mantém a afirmação sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A vírgula final foi mantida porque o trecho fornecido termina como cláusula ligada à continuação do contexto. O segmento “tu domus Jacob.” não foi incorporado, pois aparenta ser o encerramento da unidade anterior, como também indica a camada inglesa auditada.
