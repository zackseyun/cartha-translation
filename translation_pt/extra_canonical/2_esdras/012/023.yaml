source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: pt
  text: 'E, visto que você viu três cabeças em repouso, esta é a interpretação: nos últimos dias dela, o Altíssimo suscitará três reinos, renovará muitas coisas nela[a], e eles dominarão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim diz literalmente «nela», no singular; o referente pode ser a águia ou a terra mencionada no contexto, não os três reinos.
    reason: Esclarece a concordância feminina singular de in ea e preserva a ambiguidade contextual sem adotar a leitura gramaticalmente improvável «neles».
lexical_decisions:
- source_word: quiescentia
  choice: em repouso
  rationale: Expressa de modo natural o estado de inatividade ou descanso indicado pelo particípio latino, em concordância com as três cabeças vistas.
- source_word: suscitabit
  choice: suscitará
  rationale: Preserva o sentido de fazer surgir ou levantar, com registro profético digno e corrente.
- source_word: regna
  choice: reinos
  rationale: Equivalente direto do neutro plural latino e referente mais provável do verbo plural final.
- source_word: renouabit
  choice: renovará
  rationale: Mantém o valor verbal do latim sem especificar indevidamente a natureza das mudanças.
- source_word: dominabunt
  choice: eles dominarão
  rationale: Conserva o plural do latim e torna explícita em português a retomada dos três reinos.
theological_decisions:
- issue: Referente dos pronomes femininos singulares eius/in ea
  choice: dela/nela, mantendo o referente implícito
  alternative: explicitar como «da águia/na águia» ou «da terra/na terra»
  rationale: O latim emprega formas singulares cujo antecedente não aparece no fragmento fornecido. A tradução preserva essa tensão referencial sem escolher silenciosamente entre a águia e a terra.
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade profética. A construção «quanto ao fato de» liga naturalmente o fragmento inicial ao conteúdo da visão, e os pronomes singulares preservam a ambiguidade do texto latino.
