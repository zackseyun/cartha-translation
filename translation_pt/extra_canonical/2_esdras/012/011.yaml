  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: pt
  text: o quarto reino que foi visto numa visão por Daniel, seu irmão. Mas não lhe foi explicado como agora explico a você,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: o quarto reino
  rationale: Correspondência direta e natural, preservando a referência à sequência dos reinos na visão de Daniel.
- source_word: fratri tuo
  choice: seu irmão
  rationale: Mantém o parentesco figurado ou comunitário expresso literalmente no latim, sem especificar sua natureza.
- source_word: interpretatum / interpretor
  choice: explicado / explico
  rationale: Neste contexto de revelação do sentido de uma visão, “explicar” comunica com clareza a ação interpretativa; a variação verbal evita uma construção portuguesa pesada sem alterar o contraste.
theological_decisions:
- issue: Sentido de “Daniel, seu irmão”
  choice: Preservar “seu irmão” sem explicação no corpo do texto
  alternative: Daniel, seu compatriota
  rationale: O latim diz literalmente “seu irmão”; substituir por “compatriota” resolveria uma relação que o texto deixa aberta.
- issue: Agente da forma passiva “non est illi interpretatum”
  choice: 'Manter a passiva impessoal: “não lhe foi explicado”'
  alternative: Deus não lhe explicou
  rationale: A fonte não identifica explicitamente o agente, portanto a tradução evita acrescentá-lo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a estrutura fragmentária do versículo e a vírgula final, pois a frase prossegue no contexto.
