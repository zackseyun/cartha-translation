  text: a terra e os que nela habitam, com grande opressão, mais do que todos os que vieram antes deles; por isso, eles são chamados de cabeças.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum labore multo
  choice: com grande opressão
  rationale: No contexto de domínio sobre a terra e seus habitantes, labor indica aflição ou sofrimento imposto; “grande opressão” comunica naturalmente essa força, em consonância com a camada inglesa auditada.
- source_word: capita
  choice: cabeças
  rationale: Preserva a imagem simbólica concreta do latim e sua ligação com as cabeças da águia na visão, sem substituí-la por uma interpretação como “governantes”.
- source_word: super omnes qui fuerunt ante hos
  choice: mais do que todos os que vieram antes deles
  rationale: Expressa a comparação do latim de modo idiomático e mantém como referente o grupo mencionado no contexto.
