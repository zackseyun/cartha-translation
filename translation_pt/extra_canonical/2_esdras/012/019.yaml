lexical_decisions:
- source_word: tunc
  choice: então
  rationale: Mantém o advérbio temporal do latim, embora ele provavelmente conclua a oração anterior no recorte fornecido.
- source_word: sed iterum constituetur
  choice: mas será novamente restabelecido
  rationale: “Restabelecido” expressa naturalmente a ideia de constituere de novo, preservando tanto o contraste de sed quanto a repetição indicada por iterum.
- source_word: in suum initium
  choice: em seu estado inicial
  rationale: Evita a formulação pouco natural “em seu início” e comunica o retorno à condição original sem especificar além do que o latim permite.
- source_word: Et quoniam
  choice: E, visto que
  rationale: Conserva o início causal da oração seguinte e seu caráter incompleto neste recorte.
