  text: Mas, ainda assim, este também cairá pela espada nos últimos dias. E, visto que você viu
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sed tamen
  choice: mas
  rationale: No contexto, a conjunção adversativa basta para expressar o contraste; acrescentar «contudo» tornaria a frase pesada ao lado de «também».
- source_word: et hic
  choice: também este
  rationale: Preserva tanto o valor aditivo de «et» quanto a referência demonstrativa de «hic».
- source_word: gladio
  choice: pela espada
  rationale: Mantém a imagem concreta e expressa naturalmente o instrumento ou meio da queda.
- source_word: in nouissimis
  choice: nos últimos dias
  rationale: Formulação escatológica natural em português, coerente com o sentido temporal de «nouissima» neste contexto.
- source_word: Et quoniam uidisti
  choice: E, visto que você viu
  rationale: Reproduz a oração causal que continua no versículo seguinte, sem completar artificialmente a ideia.
theological_decisions:
- issue: Sentido escatológico de «in nouissimis»
  choice: nos últimos dias
  alternative: no fim
  rationale: «Nos últimos dias» preserva a linguagem temporal e escatológica sem especificar uma cronologia doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A frase final permanece aberta porque o trecho latino termina no início de uma oração que prossegue adiante.
