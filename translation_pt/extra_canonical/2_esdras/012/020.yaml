  text: 'uidisti subalares octo coherentes alis eius, Haec est interpretatio : exsurgent enim in ipso octo reges, quorum erunt tempora'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: pt
  text: '“Quanto às oito pequenas asas que você viu ligadas às asas dela, esta é a interpretação: nela se levantarão oito reis, cujos tempos'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subalares octo
  choice: oito pequenas asas
  rationale: O substantivo latino designa asas menores ou secundárias; a formulação preserva a imagem de modo claro e natural.
- source_word: coherentes alis eius
  choice: ligadas às asas dela
  rationale: Traduz a ideia de estarem aderidas ou unidas às asas da águia, mantendo o referente feminino implícito no contexto.
- source_word: exsurgent enim in ipso octo reges
  choice: nela se levantarão oito reis
  rationale: Mantém a metáfora política de reis que surgem no interior do reino ou império representado pela águia, sem explicitar além do latim.
- source_word: quorum erunt tempora
  choice: cujos tempos
  rationale: Preserva a construção incompleta do versículo-fonte, que continua no versículo seguinte, e a relativa ambiguidade de tempora.
theological_decisions:
- issue: Referente de “in ipso”
  choice: nela
  alternative: nele
  rationale: O contexto imediato da visão aponta para a águia como referente conceitual, embora a forma latina seja masculina; a tradução evita inserir explicitamente “reino” ou “império”, que seriam interpretações.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. O final permanece aberto porque a frase latina fornecida termina em “quorum erunt tempora” e prossegue no versículo seguinte.
