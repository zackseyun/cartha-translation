lexical_decisions:
- source_word: expandebat alas suas
  choice: estendia as asas
  rationale: Preserva o aspecto contínuo do imperfeito latino e a imagem concreta de abrir ou estender as asas.
- source_word: in omnem terram
  choice: sobre toda a terra
  rationale: Expressa de modo natural a extensão das asas por toda a terra, sem enfraquecer o alcance universal de omnem.
- source_word: insufflabant ad eam
  choice: sopravam em direção a ela
  rationale: Mantém a força direcional de ad com acusativo; evita reduzir a expressão a simples contato ou localização ao redor.
- source_word: ad eam colligebantur
  choice: convergiam para ela
  rationale: Reúne com naturalidade em português as ideias de agrupamento (colligebantur) e movimento dirigido para ela (ad eam).
