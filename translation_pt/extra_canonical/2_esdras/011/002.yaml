  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: pt
  text: E vi, e eis que ela estendia as asas sobre toda a terra. Todos os ventos do céu sopravam em direção a ela,[a] e as nuvens convergiam para ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sopravam sobre ela”.
