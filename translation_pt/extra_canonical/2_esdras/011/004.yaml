source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: pt
  text: Pois as suas cabeças estavam em repouso, e a cabeça do meio era maior do que as outras cabeças; contudo, também ela repousava com elas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: Pois
  rationale: Conserva o valor explicativo ou causal do latim, ligando o versículo ao contexto anterior sem antecipar o contraste expresso depois por sed.
- source_word: quiescentia / quiescebat
  choice: estavam em repouso / repousava
  rationale: Reproduz o sentido de inatividade ou descanso com linguagem natural e mantém a repetição sem sugerir necessariamente sono.
- source_word: medium caput
  choice: a cabeça do meio
  rationale: Tradução direta e clara da posição relativa indicada pelo latim.
- source_word: maius aliorum capitum
  choice: maior do que as outras cabeças
  rationale: Expressa naturalmente em português a comparação pretendida, apesar da formulação latina condensada.
- source_word: sed et ipsa
  choice: contudo, também ela
  rationale: Mantém tanto o contraste de sed quanto a ênfase inclusiva de et ipsa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do latim. Não se acrescentou nota para Nam, pois o sentido explicativo é suficientemente claro no texto e a alternativa adversativa confundiria sua função com a de sed.
