  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: pt
  text: As doze asas e as duas asas menores desapareceram. E nada restou no corpo da águia, a não ser as três cabeças em repouso e seis asas menores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennae
  choice: asas
  rationale: No contexto da visão da águia, designa suas asas principais; esta é a forma natural e clara em português.
- source_word: pennacula
  choice: asas menores
  rationale: O diminutivo latino contrasta estes apêndices com as doze asas principais. “Asas menores” preserva a distinção sem recorrer ao pouco natural “asinhas”.
- source_word: conparuerunt
  choice: desapareceram
  rationale: Embora a forma isolada normalmente possa significar “apareceram”, a sequência afirma que nada restou além das cabeças e de seis asas menores. A tradução segue esse contraste contextual e a leitura auditada da POB.
- source_word: superauit
  choice: restou
  rationale: Neste contexto, o verbo expressa aquilo que permaneceu no corpo da águia.
- source_word: quiescentia
  choice: em repouso
  rationale: Reproduz o estado das três cabeças sem especificar se dormiam ou estavam apenas inativas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “asas menores” mantém de modo transparente a diferença entre pennae e pennacula e supre no final o substantivo elíptico no latim.
