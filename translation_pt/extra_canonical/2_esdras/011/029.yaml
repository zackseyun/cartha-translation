  text: the one that was in the middle awoke[a], for it was larger than the two heads. And I saw how it drew the two heads to itself,
translation:
  language: pt
  text: A que estava no meio despertou, pois era maior do que as duas cabeças. E vi como ela envolveu junto a si as duas cabeças,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod erat medium
  choice: a que estava no meio
  rationale: Retoma naturalmente, em português, a cabeça situada no meio, preservando a formulação relativa do latim.
- source_word: euigilabat
  choice: despertou
  rationale: Expressa diretamente o ato de acordar ou despertar indicado pelo verbo latino.
- source_word: maius
  choice: a maior
  rationale: Conserva o sentido comparativo de tamanho no contexto das cabeças; a construção portuguesa natural é 'a maior das duas cabeças'.
- source_word: conplexa est ... secum
  choice: envolveu consigo
  rationale: Preserva a imagem ampla de complector — envolver, abraçar ou reunir — sem reduzi-la a uma união técnica; 'consigo' representa secum.
