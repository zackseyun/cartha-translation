  text: And I looked, and behold, on the right side one wing rose up and reigned over all the earth.
translation:
  language: pt
  text: E vi, e eis que, do lado direito, uma asa se levantou e reinou sobre toda a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: E olhei, e eis que
  rationale: Preserva a sequência enfática da visão e o marcador de atenção do latim, em linguagem bíblica ainda compreensível.
- source_word: a dextera parte
  choice: do lado direito
  rationale: Tradução direta e natural, sem acrescentar uma referência espacial não expressa.
- source_word: surrexit una penna
  choice: uma asa se levantou
  rationale: Mantém o sujeito singular e a imagem simbólica do texto-fonte; «se levantou» comunica adequadamente o surgimento e a ascensão.
- source_word: regnauit super omnem terram
  choice: reinou sobre toda a terra
  rationale: Conserva o sentido régio de «regnauit» e a abrangência universal de «omnem terram».
