lexical_decisions:
- source_word: pennacula / pennaculis
  choice: pequenas penas
  rationale: O diminutivo latino indica penas ou pequenas plumas da asa; a expressão preserva a distinção em relação às penas maiores no contexto da visão e soa natural em português.
- source_word: diuisa sunt
  choice: se separaram
  rationale: Expressa diretamente a separação das duas pequenas penas em relação ao grupo de seis.
- source_word: sub capite
  choice: debaixo da cabeça
  rationale: Tradução espacial direta e clara da preposição latina sub.
- source_word: nam
  choice: pois
  rationale: Mantém o valor explicativo ou causal da conjunção e a ligação inacabada com o versículo seguinte.
