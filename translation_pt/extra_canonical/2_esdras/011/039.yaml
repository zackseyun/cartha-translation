base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: pt
  text: Não és tu aquele que restou[a] dos quatro animais que eu havia feito reinar em minha era, para que, por meio deles, chegasse o fim dos tempos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que sobreviveu dentre os quatro animais que eu havia feito reinar em minha era”.'
    reason: Registra a alternativa mais literal para a expressão partitiva subjacente, embora “aquele que restou dos” seja mais natural em português.
lexical_decisions:
- source_word: regnare
  choice: reinar
  rationale: Mantém diretamente o sentido de exercer domínio ou governo.
- source_word: in saeculo meo
  choice: na minha era
  rationale: “Era” comunica o sentido temporal de saeculum de modo natural, sem reduzi-lo a um século de cem anos.
- source_word: per ea
  choice: por meio deles
  rationale: 'Preserva a ideia instrumental: os quatro animais são o meio pelo qual se encaminha o fim.'
- source_word: finis temporum
  choice: o fim dos tempos
  rationale: Tradução direta e idiomática da expressão escatológica latina.
- source_word: superasti de (preservado pela tradição textual e pela camada inglesa auditada)
  choice: o que resta dos
  rationale: 'Expressa naturalmente o sentido partitivo: o último membro ainda existente dentre os quatro.'
theological_decisions:
- issue: Relação entre o domínio dos quatro animais e o fim
  choice: “para que, por meio deles, chegasse o fim dos tempos”
  alternative: “até que, por meio deles, chegasse o fim dos tempos”
  rationale: A construção ut per ea mantém uma relação de finalidade ou resultado; “para que” preserva essa tensão sem explicar o mecanismo teológico.
- issue: Alcance de saeculum
  choice: “minha era”
  alternative: “meu mundo”
  rationale: O contexto é primariamente temporal; “era” evita introduzir uma cosmologia não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe interrogativa natural. “Animais” conserva a terminologia apocalíptica tradicional sem intensificar o texto com uma conotação adicional de ferocidade.
