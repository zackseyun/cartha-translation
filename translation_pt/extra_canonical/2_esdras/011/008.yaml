  text: Do not all keep watch at once; sleep, each one in his own place, and keep watch for a time.
translation:
  language: pt
  text: Não fiquem todos de vigia ao mesmo tempo. Durma cada um no seu lugar e fique de vigia por algum tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nolite omnes simul uigilare
  choice: Não fiquem todos de vigia ao mesmo tempo
  rationale: Expressa naturalmente a proibição coletiva e preserva o sentido de simultaneidade de “simul”.
- source_word: dormite unusquisque in loco suo
  choice: Durma cada um no seu lugar
  rationale: Mantém a distribuição individual indicada por “unusquisque” e o sentido direto de “in loco suo”.
- source_word: per tempus uigilate
  choice: fique de vigia por algum tempo
  rationale: Traduz “per tempus” como duração limitada, sem introduzir a ideia não explícita de revezamento.
