base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: pt
  text: E aconteceu que, quando ela reinava, chegou o seu fim, e ela não apareceu, de modo que o seu lugar não apareceu; então a seguinte se levantou, reinou e ela deteve o poder por muito tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non apparuit ... non appareret locus eius
  choice: deixou de aparecer, de modo que nem o seu lugar aparecia
  rationale: Mantém a repetição de «aparecer» do latim e evita transformar a expressão em uma explicação interpretativa como «desapareceu sem deixar vestígios».
- source_word: sequens
  choice: a seguinte
  rationale: Representa de modo direto a próxima figura feminina da visão, preservando a referência gramatical sem explicitação indevida.
- source_word: multum tenuit tempus
  choice: permaneceu no poder por muito tempo
  rationale: Expressa idiomaticamente a ideia de duração prolongada do domínio, em consonância com o contexto de «reinou».
