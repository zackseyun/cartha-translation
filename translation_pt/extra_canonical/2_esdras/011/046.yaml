  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: pt
  text: e as tuas garras perversas e todo o teu corpo inútil, para que toda a terra seja revigorada[a] e aliviada, livre da tua violência, e ponha a esperança no juízo e na misericórdia daquele que a criou.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: seja refrescada; ou: recupere o alento.'
    reason: O latim “refrigeret” abrange as ideias de refrescar, reanimar e recuperar o alento; nenhuma opção portuguesa isolada reproduz todo o campo semântico.
lexical_decisions:
- source_word: ungues tui pessimi
  choice: as tuas garras perversas
  rationale: “Ungues” designa as garras da águia; “perversas” comunica o sentido moral de “pessimi” com naturalidade e dignidade.
- source_word: omne corpus tuum uanum
  choice: todo o teu corpo inútil
  rationale: “Vanum” pode indicar algo vão, sem valor ou inútil; “inútil” preserva aqui a declaração de nulidade e impotência do corpo da águia.
- source_word: refrigeret
  choice: seja revigorada
  rationale: O verbo latino pode significar refrescar, reanimar ou dar alívio. “Seja revigorada” expressa recuperação após a opressão sem reduzir o sentido a mero descanso.
- source_word: releuetur liberata de tua ui
  choice: aliviada, livre da tua violência
  rationale: Mantém distintos “relevetur” (ser aliviada) e “liberata” (liberta/livre), enquanto “vis” neste contexto é força opressora ou violência.
- source_word: speret iudicium et misericordiam
  choice: ponha a esperança no juízo e na misericórdia
  rationale: Traduz “speret” como esperança, e não simples expectativa, preservando a tensão entre o juízo e a misericórdia divinos.
- source_word: eius qui fecit eam
  choice: daquele que a criou
  rationale: “Criou” é a forma portuguesa natural para a ação do Criador; o pronome “a” retoma “toda a terra”.
theological_decisions:
- issue: A terra espera tanto o juízo quanto a misericórdia de seu Criador
  choice: ponha a esperança no juízo e na misericórdia
  alternative: espere o juízo e a misericórdia
  rationale: A formulação escolhida conserva ambos como objetos da esperança, sem apresentar juízo e misericórdia como opostos nem explicar como se relacionam.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. O início coordenado por “e” foi mantido porque o versículo continua a construção sintática do anterior. A pontuação conserva o fechamento da fala indicado no contexto editorial.
