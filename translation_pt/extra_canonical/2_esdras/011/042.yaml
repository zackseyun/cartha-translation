  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: pt
  text: Pois afligiste os mansos e feriste os pacíficos; odiaste os que diziam a verdade e amaste os mentirosos; destruíste as moradas dos que davam fruto e rebaixaste as suas muralhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mansuetos
  choice: os mansos
  rationale: Preserva o sentido de pessoas brandas e não violentas, em formulação bíblica clara e corrente.
- source_word: quiescentes
  choice: os pacíficos
  rationale: No contexto, designa os que vivem quietamente e em paz; “pacíficos” comunica esse valor pessoal com naturalidade.
- source_word: uerum dicentes
  choice: os que diziam a verdade
  rationale: Traduz diretamente a expressão e mantém a referência passada coerente com a sequência verbal.
- source_word: mendaces
  choice: os mentirosos
  rationale: Equivalente pessoal direto para aqueles que mentem.
- source_word: habitationes
  choice: as moradas
  rationale: Mantém o sentido de lugares de habitação com registro digno e compreensível.
- source_word: fructificabant
  choice: davam fruto
  rationale: Conserva a metáfora do latim sem determinar se o fruto é material, moral ou espiritual.
- source_word: humiliasti
  choice: rebaixaste
  rationale: Expressa literalmente a ideia de baixar ou humilhar aplicada às muralhas, sem ampliar para uma destruição total não explicitada.
- source_word: muros
  choice: muralhas
  rationale: No contexto de moradas e derrubada defensiva, “muralhas” é mais natural do que “muros” e preserva a imagem arquitetônica.
theological_decisions:
- issue: Sentido de “fructificabant”
  choice: davam fruto
  alternative: produziam frutos
  rationale: A formulação escolhida preserva a possível dimensão metafórica sem especificar indevidamente a natureza do fruto.
- issue: Força de “humiliasti muros eorum”
  choice: rebaixaste as suas muralhas
  alternative: derrubaste as suas muralhas
  rationale: “Rebaixaste” retém a expressão incomum e a tensão do original; “derrubaste” resolveria a imagem como destruição completa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas verbais na segunda pessoa do singular para refletir a interpelação direta do texto latino. A cadência paralela foi preservada por meio de orações coordenadas.
