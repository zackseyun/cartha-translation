  yaml_path: translation/extra_canonical/2_esdras/011/001.yaml
  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: pt
  text: 'E aconteceu que, na segunda noite, tive um sonho: eis que uma águia subia do mar; ela tinha doze asas cobertas de penas e três cabeças.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa latina em português natural e solene.
- source_word: uidi somnium
  choice: tive um sonho
  rationale: Embora literalmente seja «vi um sonho», «tive um sonho» é a expressão corrente em português e comunica o mesmo acontecimento visionário.
- source_word: ecce
  choice: eis que
  rationale: Mantém o marcador vívido de atenção e o registro digno da visão.
- source_word: ascendebat de mari
  choice: subia do mar
  rationale: Conserva o aspecto progressivo do imperfeito e a origem marítima da águia.
- source_word: duodecim alae pennarum
  choice: doze asas cobertas de penas
  rationale: Representa a construção incomum do latim sem reduzi-la simplesmente a «asas», preservando a ênfase nas penas.
- source_word: capita tria
  choice: três cabeças
  rationale: Equivalência direta e inequívoca.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe conserva a solenidade apocalíptica sem reproduzir de modo artificial todas as estruturas latinas.
