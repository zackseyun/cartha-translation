lexical_decisions:
- source_word: iudicasti
  choice: julgaste
  rationale: Preserva diretamente o sentido judicial do perfeito latino na segunda pessoa do singular.
- source_word: terram
  choice: a terra
  rationale: Mantém o objeto direto e o alcance amplo da expressão latina.
- source_word: non [cum veritate]
  choice: não... com verdade
  rationale: Segue a construção confirmada pela camada inglesa e preserva a formulação moral e judicial sem interpretá-la como mero erro ou injustiça.
theological_decisions:
- issue: Natureza da acusação contra o governante simbolizado
  choice: com verdade
  alternative: com justiça
  rationale: “Justiça” tornaria explícita uma interpretação possível, mas o texto transmitido e a consulta inglesa apontam para “verdade”; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene. A ordem “não julgaste... com verdade” é natural e mantém a ênfase negativa do latim.
