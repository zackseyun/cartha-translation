  yaml_path: translation/extra_canonical/2_esdras/011/045.yaml
  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: pt
  text: Portanto, que nunca mais apareças[a], ó águia — nem as tuas asas terríveis, nem as tuas penas perversíssimas, nem as tuas cabeças malignas, nem as tuas garras perversas, nem o teu corpo todo, sem valor —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção latina repetitiva é enfática; também pode ser traduzida por “desapareça completamente”.
    reason: Preserva a força enfática de non apparens non appareas sem interpretá-la como uma oração de finalidade.
lexical_decisions:
- source_word: Propterea
  choice: Portanto
  rationale: Expressa de modo natural a conclusão ou consequência indicada pelo conectivo latino.
- source_word: non apparens non appareas
  choice: nunca mais apareça
  rationale: Reproduz como desejo ou imprecação enfática a construção repetitiva sem tratá-la como oração de finalidade.
- source_word: aquila
  choice: águia
  rationale: Equivalente direto, mantendo a apóstrofe dirigida à figura simbólica.
- source_word: alae tuae horribiles
  choice: suas asas terríveis
  rationale: Tradução direta que preserva o tom ameaçador de horribiles.
- source_word: pennacula tua pessima
  choice: suas penas perversíssimas
  rationale: Pennacula designa penas ou pequenas penas das asas; perversíssimas comunica o superlativo moral pessima sem sugerir meramente baixa qualidade.
- source_word: capita tua maligna
  choice: suas cabeças malignas
  rationale: Mantém a imagem plural e a avaliação moral de maligna.
- source_word: ungues ... corpus vanum (continuação pressuposta pela camada inglesa; ausente do trecho latino fornecido após et)
  choice: garras perversas ... todo o seu corpo desprezível
  rationale: A redação completa da camada de consulta foi conservada, mas esses elementos não estão legíveis no excerto latino fornecido, que termina abruptamente em et.
theological_decisions:
- issue: Força de non apparens non appareas
  choice: 'Desejo ou imprecação enfática: “nunca mais apareça”'
  alternative: “desapareça completamente” ou “desapareça para não voltar a aparecer”
  rationale: A repetição provavelmente reflete uma construção semítica de ênfase. A forma escolhida preserva o valor volitivo de appareas e evita convertê-la numa oração explícita de finalidade.
- issue: Extensão final do versículo
  choice: Conservar as garras e o corpo presentes na camada inglesa auditada
  alternative: Encerrar a tradução em “cabeças malignas”, onde o excerto latino fornecido se interrompe
  rationale: O et final mostra que o texto latino citado está incompleto. A continuação foi mantida para não publicar um versículo truncado, mas a limitação da evidência fornecida deve ser registrada editorialmente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem retórica preservada pelo travessão. O excerto latino fornecido termina abruptamente em et; por isso, a parte sobre as garras e o corpo depende da camada inglesa de consulta e requer conferência com o testemunho latino completo antes da publicação definitiva.
