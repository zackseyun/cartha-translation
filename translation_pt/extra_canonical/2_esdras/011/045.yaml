    text: A construção latina repetitiva é enfática; também pode ser traduzida por “desapareça completamente”.
    reason: Preserva a força enfática de non apparens non appareas sem interpretá-la como uma oração de finalidade.
  revision_rationale: A revisão elimina o pronome não expresso pelo latim, torna a apóstrofe idiomática e mantém a enumeração sob a negação volitiva. Também ajusta «desprezível» para «sem valor», mais próximo de vanum. O travessão final é mantido, pois o versículo continua no contexto fornecido pela camada inglesa, embora o excerto latino citado termine de modo truncado.
