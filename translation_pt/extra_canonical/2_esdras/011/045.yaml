revisions:
- from: Portanto, nunca mais apareça[a] — você, ó águia, nem suas asas terríveis, nem suas penas perversíssimas, nem suas cabeças malignas, nem suas garras perversas, nem todo o seu corpo desprezível —
  to: Portanto, que nunca mais apareças[a], ó águia — nem as tuas asas terríveis, nem as tuas penas perversíssimas, nem as tuas cabeças malignas, nem as tuas garras perversas, nem o teu corpo todo, sem valor —
  rationale: A revisão elimina o pronome não expresso pelo latim, torna a apóstrofe idiomática e mantém a enumeração sob a negação volitiva. Também ajusta «desprezível» para «sem valor», mais próximo de vanum. O travessão final é mantido, pois o versículo continua no contexto fornecido pela camada inglesa, embora o excerto latino citado termine de modo truncado.
