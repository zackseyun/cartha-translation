review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a imprecação dirigida à águia e a enumeração das suas partes. «Nunca mais apareça» é uma forma defensável para a construção enfática latina non apparens non appareas, e a nota registra adequadamente a alternativa enfática. Contudo, o pronome explícito «você» não está no original e torna a apóstrofe menos natural; a coordenação também fica mais clara com a elipse verbal organizada sem ele.
  naturalness: «Você, ó águia» é pouco idiomático em uma invocação poética solene em português. «Ó águia» basta. A sequência negativa deve manter uma sintaxe uniforme, com «nem» introduzindo os membros coordenados.
  terminology: «Asas», «penas», «cabeças», «garras» e «corpo sem valor» refletem adequadamente alae, pennacula, capita, ungues e corpus vanum. «Penas perversíssimas» preserva tanto pennacula quanto o superlativo pessima sem introduzir um diminutivo não exigido. «Corpo sem valor» é mais próximo de vanum do que «corpo desprezível».
  issues:
  - severity: medium
    issue: «você, ó águia» acrescenta um pronome e soa pouco natural.
    rationale: O latim dirige-se diretamente à aquila, sem pronome pessoal. Em português, o vocativo «ó águia» expressa plenamente essa apóstrofe e preserva melhor o registro.
  - severity: low
    issue: «todo o seu corpo desprezível» é menos preciso para corpus vanum.
    rationale: Vanum denota vazio, fútil ou sem valor; «corpo sem valor» conserva essa ideia sem deslocá-la para mera repugnância ou desprezo.
  revised_text: Portanto, que nunca mais apareças[a], ó águia — nem as tuas asas terríveis, nem as tuas penas perversíssimas, nem as tuas cabeças malignas, nem as tuas garras perversas, nem o teu corpo todo, sem valor —
  revised_footnotes:
