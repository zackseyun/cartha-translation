source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et de pennis eius nascebantur contrariae pennae, et ipsae fiebant in pennaculis minutis et modicis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: pt
  text: E vi que de suas asas brotavam asas opostas[a], e elas se tornavam asinhas, diminutas e modestas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “asas rivais”.'
    reason: O latim contrariae pode indicar tanto asas situadas em oposição quanto asas antagonistas ou rivais.
lexical_decisions:
- source_word: pennis / pennae
  choice: asas
  rationale: As duas formas pertencem ao mesmo substantivo latino, penna. No contexto da visão da águia, “asas” mantém a coerência lexical e descreve com clareza as asas que surgem das asas principais.
- source_word: contrariae
  choice: opostas
  rationale: É a correspondência mais direta para contrariae e conserva a possibilidade de oposição espacial ou rivalidade, sem decidir entre elas no texto principal.
- source_word: pennaculis minutis et modicis
  choice: pequenas asas, miúdas e pouco desenvolvidas
  rationale: Pennaculum é diminutivo de penna. A formulação preserva a imagem de apêndices semelhantes a asas e o acúmulo enfático dos adjetivos latinos, evitando o termo técnico e pouco transparente “rêmiges”.
- source_word: nascebantur
  choice: nasciam
  rationale: Reproduz a imagem orgânica e o aspecto imperfeito do latim, segundo o qual essas asas estavam surgindo ou brotando.
- source_word: fiebant
  choice: se tornavam
  rationale: Mantém o valor processual do imperfeito latino e indica o desenvolvimento dessas asas em formas menores.
theological_decisions:
- issue: Sentido de contrariae na anatomia simbólica da águia
  choice: asas opostas
  alternative: asas rivais / asas que se opunham
  rationale: “Opostas” preserva a ambiguidade entre posição contrária e antagonismo dentro da visão, sem impor uma interpretação específica do símbolo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de “asas” é intencional, pois reflete a repetição de penna no latim e mantém coerência com o restante da visão.
