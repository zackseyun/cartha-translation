  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: pt
  text: E o quarto que veio venceu todos os animais que o haviam precedido[a], manteve a era sob seu poder, com grande tremor, e o mundo inteiro sob a mais cruel opressão[b], e por tanto tempo habitou o mundo com engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto latino deste versículo é irregular em alguns pontos, sobretudo na cláusula final. A tradução segue o sentido aparente: o quarto animal superou os anteriores e dominou a era e o mundo por seu poder, com grande tremor, opressão e engano.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “manteve a era sob seu poder, com grande tremor, e o mundo inteiro na mais penosa aflição”.'
    reason: previous_rendering
lexical_decisions:
- source_word: animalia
  choice: animais
  rationale: É o equivalente direto do latim e preserva a imagem das criaturas anteriores sem acrescentar uma identificação interpretativa.
- source_word: potentatu tenens saeculum
  choice: manteve a era sob seu poder
  rationale: Expressa tanto tenens quanto o substantivo potentatu, cuja ideia de poder ou domínio não deve ser omitida; “era” conserva a amplitude temporal de saeculum.
- source_word: cum tremore multo
  choice: com grande tremor
  rationale: Mantém a formulação concreta e a possível ambiguidade sobre quem experimenta o tremor.
- source_word: cum labore pessimo
  choice: sob a mais cruel opressão
  rationale: No contexto do domínio coercivo da quarta criatura, comunica o sofrimento extremo indicado por labor pessimus em português natural.
- source_word: deuicit
  choice: venceu
  rationale: Verbo simples e corrente que transmite a ideia de derrotar ou sobrepujar.
theological_decisions:
- issue: Identidade da quarta criatura e das anteriores
  choice: Não identificar historicamente ou teologicamente as criaturas
  alternative: Nomear um império ou poder específico
  rationale: O versículo não faz essa identificação, e inseri-la resolveria indevidamente uma questão interpretativa.
- issue: Agente e alcance de “grande tremor”
  choice: Preservar a construção “com grande tremor”
  alternative: Explicitar que o mundo foi mantido em terror
  rationale: A sintaxe latina permite tensão quanto à ligação exata da expressão; a tradução não deve eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura conserva o tom apocalíptico e parte da aspereza do latim, enquanto a nota sinaliza a condição textual problemática.
