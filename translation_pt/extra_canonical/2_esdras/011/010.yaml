base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/010.yaml
  text: And I looked, and behold, a voice did not come out from its heads, but from the middle of its body.
translation:
  language: pt
  text: E vi, e eis que uma voz não saía das cabeças da águia, mas do meio do seu corpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: Então olhei e vi que
  rationale: Reproduz a sequência narrativa e o destaque visual do latim em português natural, sem recorrer ao arcaizante «eis».
- source_word: uox
  choice: uma voz
  rationale: O latim não traz artigo; o indefinido apresenta naturalmente a voz neste ponto sem identificá-la além do que a fonte permite.
- source_word: de capitibus eius
  choice: das cabeças da águia
  rationale: Explicita o referente de «eius» para evitar que o possessivo português pareça referir-se à voz; «águia» vem do contexto imediato da visão.
- source_word: de medietate corporis eius
  choice: do meio do seu corpo
  rationale: Traduz diretamente «medietate» e mantém a imagem espacial, com referência possessiva agora inequívoca à águia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A explicitação de «águia» resolve apenas uma ambiguidade pronominal criada em português e não acrescenta interpretação teológica.
