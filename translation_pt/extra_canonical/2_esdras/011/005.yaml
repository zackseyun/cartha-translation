lexical_decisions:
- source_word: Et uidi et ecce
  choice: Então olhei, e eis que
  rationale: Mantém a sequência visionária e a fórmula de apresentação enfática do latim, em português natural e digno.
- source_word: aquila
  choice: a águia
  rationale: Equivalente direto do substantivo latino, preservando a imagem simbólica sem interpretação adicional.
- source_word: uolauit in pennis suis
  choice: voou com suas asas
  rationale: Reproduz de modo claro o sentido instrumental de «in pennis suis», sem eliminar a expressão aparentemente redundante do texto-fonte.
- source_word: ut regnaret
  choice: para reinar
  rationale: Preserva a finalidade expressa por «ut» com subjuntivo, sem explicitar se o domínio foi efetivamente alcançado.
- source_word: super terram et super eos qui habitant in ea
  choice: sobre a terra e sobre os que nela habitam
  rationale: Conserva a repetição de «sobre» e a distinção entre a terra e seus habitantes.
