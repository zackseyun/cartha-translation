source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et respexit Altissimus super sua tempora, et ecce finita sunt et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: pt
  text: E o Altíssimo olhou para os seus tempos; e eis que chegaram ao fim, e as suas eras se completaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respexit
  choice: olhou para
  rationale: Reproduz de modo natural o sentido de voltar a atenção ou contemplar, sem acrescentar a ideia de aprovação ou intervenção.
- source_word: tempora
  choice: tempos
  rationale: Mantém o termo amplo do latim e sua referência aos períodos determinados para a figura em questão.
- source_word: finita sunt
  choice: chegaram ao fim
  rationale: Expressa em português corrente o aspecto resultativo do perfeito latino.
- source_word: saecula
  choice: eras
  rationale: Distingue saecula de tempora e comunica períodos extensos ou épocas, em vez do sentido moderno mais restrito de 'séculos'.
- source_word: conpleta sunt
  choice: se completaram
  rationale: Preserva a formulação passiva/resultativa e o paralelismo com o término dos tempos.
theological_decisions:
- issue: Referente dos possessivos sua e eius
  choice: dele
  alternative: seus/suas
  rationale: O latim distingue o Altíssimo do referente masculino cujos tempos e eras terminaram. 'Dele' reduz a possibilidade de o leitor entender que os períodos pertencem ao Altíssimo, sem identificar além do texto quem é esse referente.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao latim. A repetição de 'dele' é intencional para preservar a referência do original e evitar a ambiguidade reflexiva que 'seus' poderia criar.
