lexical_decisions:
- source_word: manserunt
  choice: permaneceram
  rationale: Reproduz de modo natural o sentido de continuidade de maneō sem acrescentar ação não expressa.
- source_word: in loco suo
  choice: em seu lugar
  rationale: Mantém de perto a expressão locativa e a referência distributiva do singular latino.
- source_word: Et uidi et ecce
  choice: Então olhei, e eis que
  rationale: Conserva a fórmula visionária e sua vivacidade; “então” torna natural em português a progressão narrativa do primeiro et.
- source_word: subalares
  choice: subasas
  rationale: Emprega um termo português transparente e morfologicamente próximo para as estruturas secundárias sob as asas, sem substituí-lo interpretativamente por “penas” ou “asas menores”.
