  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: pt
  text: que não te fizeram mal. E a tua insolência subiu até o Altíssimo, e o teu orgulho, até o Poderoso. E o Altíssimo atentou para os seus próprios tempos, e eis que chegaram ao fim, e as suas eras se completaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contumelia
  choice: insolência
  rationale: Expressa a atitude afrontosa e desmedida dirigida contra Deus, sem restringir o termo a um insulto meramente verbal.
- source_word: fortem
  choice: o Poderoso
  rationale: Como título divino paralelo a 'o Altíssimo', transmite força e poder em português natural.
- source_word: tempora
  choice: tempos
  rationale: Mantém o sentido temporal amplo do latim e a ligação com o término determinado da soberania mencionada.
- source_word: saecula
  choice: eras
  rationale: Distingue o termo de 'tempora' e comunica períodos extensos ou épocas, evitando a acepção moderna de 'séculos' como unidades exatas de cem anos.
theological_decisions:
- issue: Referente dos possessivos em 'sua tempora' e 'saecula eius'
  choice: dele
  alternative: seus, com possível referência ao Altíssimo
  rationale: No contexto imediato, os períodos que chegam ao fim pertencem mais naturalmente ao poder opressor interpelado. O uso de 'dele' preserva a referência gramatical sem explicitar uma interpretação adicional no corpo do versículo.
- issue: Valor de 'respexit ... super'
  choice: contemplou
  alternative: olhou para / atentou para
  rationale: '''Contemplou'' mantém a imagem de Deus voltando sua atenção aos tempos determinados, sem acrescentar explicitamente a ideia de julgamento, embora ela esteja presente no contexto.'
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo preservado. A repetição de 'e' reflete a cadência coordenada do latim; 'eis que' conserva o marcador enfático ecce. O pronome inicial liga o fragmento ao versículo anterior.
