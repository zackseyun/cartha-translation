  yaml_path: translation/extra_canonical/2_esdras/011/026.yaml
  text: And I looked, and behold, one rose up, but immediately disappeared; then the second, and this one also
translation:
  language: pt
  text: E eu olhei, e eis que uma se ergueu, mas logo desapareceu; depois, a segunda, e esta também[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino preservado se interrompe aqui, deixando a frase incompleta.
    reason: Sinaliza ao leitor que o final abrupto decorre do estado da fonte, não de um erro de redação.
lexical_decisions:
- source_word: erecta est
  choice: se ergueu
  rationale: Mantém a imagem de levantar-se/erguer-se no contexto das figuras que pretendiam assumir o governo, sem explicitar além do latim.
- source_word: statim non conparuit
  choice: logo desapareceu
  rationale: Expressa naturalmente em português a ideia de que imediatamente deixou de ser vista.
- source_word: Et secunda
  choice: depois, a segunda
  rationale: Conserva a sequência abrupta do latim, acrescentando apenas um conector temporal natural.
theological_decisions:
- issue: Final fragmentário do versículo
  choice: e esta também
  alternative: e esta também desapareceu
  rationale: O texto latino fornecido termina em «Et secunda, et haec»; não se completa o sentido por conjectura, preservando a lacuna textual e evitando importar palavras sem apoio.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência visionária em «e eis que». O gênero gramatical feminino de «uma» e «a segunda» acompanha as figuras femininas pressupostas pelo contexto e pelo latim.
