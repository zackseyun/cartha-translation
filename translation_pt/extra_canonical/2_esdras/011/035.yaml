  rationale: Mantém a referência elíptica a outra cabeça e traduz o contraste espacial com clareza.
- source_word: conspice contra te
  choice: Olhe para diante de você
  rationale: Expressa a orientação espacial de contra te em português corrente, preservando a ordem dada pela voz.
