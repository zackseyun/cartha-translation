  yaml_path: translation/extra_canonical/2_esdras/011/037.yaml
  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: pt
  text: 'rugindo; e ouvi como emitiu uma voz humana à águia e disse[a], dizendo: “Ouve, e falarei contigo; o Altíssimo te diz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E olhei, e eis que algo semelhante a um leão se levantou da floresta, rugindo; e ouvi como emitiu uma voz humana à águia e disse”.'
    reason: Registra a tradução anterior, que incluía no versículo 37 o final do versículo 36 e omitia a parte final do texto latino deste versículo.
lexical_decisions:
- source_word: mugiens
  choice: rugindo
  rationale: Preserva o particípio que dá continuidade ao versículo anterior; no contexto da figura semelhante a um leão, «rugindo» é mais preciso do que o sentido genérico de «bramando».
- source_word: uocem hominis
  choice: uma voz humana
  rationale: Expressa naturalmente em português a ideia literal de «voz de homem», sem especificar sexo ou identidade além do que o contexto exige.
- source_word: dixit dicens
  choice: disse, dizendo
  rationale: Mantém o pleonasmo semítico refletido no latim, importante para o estilo tradutório de 4 Esdras, embora seja incomum no português corrente.
- source_word: Audi tu
  choice: Ouve
  rationale: Traduz o imperativo singular e conserva o tom solene; o pronome enfático latino não precisa ser explicitado, pois a forma verbal portuguesa já marca a pessoa.
- source_word: dicit altissimus tibi
  choice: o Altíssimo te diz
  rationale: Segue de perto a ordem e o tempo presente do latim, com formulação clara e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, solene e acessível. Conservou-se deliberadamente a construção formal «disse, dizendo» para refletir a sintaxe semítica subjacente ao latim. O início em minúscula e com particípio mantém a continuidade sintática com 11:36.
