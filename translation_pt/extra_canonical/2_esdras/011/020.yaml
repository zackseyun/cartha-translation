source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: pt
  text: E vi, e eis que, no devido tempo, as asas seguintes também se ergueram do lado direito[a], para exercer o domínio. Algumas delas o detinham, mas
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também estavam se erguendo do lado direito”.'
    reason: O imperfeito latino erigebantur pode destacar a ação em andamento, embora o contexto narrativo também permita apresentá-la como um acontecimento completo.
lexical_decisions:
- source_word: in tempore
  choice: no devido tempo
  rationale: Expressa o valor temporal da locução latina sem especificar um momento que o texto não define.
- source_word: sequentes pennae
  choice: as asas seguintes
  rationale: Preserva a referência às asas que vêm na sequência das anteriores.
- source_word: et ipsae
  choice: também
  rationale: 'Retém a nuance inclusiva e enfática: essas asas, por sua vez, fizeram o mesmo que as anteriores.'
- source_word: a dextera parte
  choice: do lado direito
  rationale: Tradução direta e natural da indicação espacial.
- source_word: tenerent principatum
  choice: exercer o domínio
  rationale: Comunica a ideia de deter e exercer autoridade governante, evitando uma formulação excessivamente técnica.
- source_word: ex his erant quae tenebant
  choice: Algumas delas chegaram a exercê-lo
  rationale: Mantém a distinção entre a finalidade de buscar o domínio e o fato de algumas efetivamente o deterem.
theological_decisions:
- issue: Natureza do domínio exercido pelas asas
  choice: domínio
  alternative: principado
  rationale: O contexto descreve autoridade governante. “Domínio” preserva essa amplitude sem introduzir a associação posterior de “principado” com uma categoria específica de seres espirituais.
- issue: Aspecto de erigebantur
  choice: se ergueram
  alternative: estavam se erguendo
  rationale: O imperfeito latino pode apresentar a ação em desenvolvimento, mas, na sequência narrativa, o português natural admite o pretérito perfeito. A alternativa é registrada em nota para preservar a nuance aspectual.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. “E eis que” conserva o tom visionário do original. A frase termina em “mas” porque o texto fornecido continua no versículo seguinte.
