lexical_decisions:
- source_word: medium caput
  choice: a cabeça do meio
  rationale: Traduz diretamente a expressão latina e mantém a referência espacial entre as cabeças.
- source_word: subito non conparuit
  choice: desapareceu de repente
  rationale: Embora a forma latina diga literalmente que a cabeça 'de repente não apareceu', no contexto ela indica que deixou de estar visível; 'desapareceu' expressa isso com naturalidade.
- source_word: et hoc sicut alae
  choice: assim como as asas
  rationale: 'Reproduz de modo conciso a comparação elíptica do latim: a cabeça desapareceu do mesmo modo que as asas.'
