  source_fidelity: A tradução reproduz a sequência e os tempos verbais do latim, bem como preserva corretamente o início e o término fragmentários do versículo. Contudo, «o seu tempo» torna ambígua a referência de tuum, que é explicitamente de segunda pessoa no texto latino. Além disso, «desapareceu» é uma interpretação possível no contexto, mas non apparuit diz mais literalmente «não apareceu» e convém preservar essa formulação menos interpretativa.
  naturalness: A redação é clara, fluente e mantém registro adequado. «Terá o teu tempo» é natural o bastante neste registro bíblico e torna explícita a interlocução presente no original. «Não apareceu» é igualmente natural em português.
  terminology: «A terceira», «se ergueu» e «exerceu o domínio» correspondem bem a tertia, leuauit se e tenuit principatum. Não há termos teológicos ou nomes próprios que exijam padronização neste trecho.
