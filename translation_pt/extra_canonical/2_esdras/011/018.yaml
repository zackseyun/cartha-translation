lexical_decisions:
- source_word: tenebit tempus tuum
  choice: terá o seu tempo
  rationale: Mantém a referência direta ao tempo atribuído ao interlocutor e reproduz de modo natural o sentido de tenere neste contexto.
- source_word: sed nec dimidium eius
  choice: mas nem sequer a metade dele
  rationale: Expressa tanto o contraste de sed quanto a ênfase negativa de nec, com eius retomando 'tempo'.
- source_word: leuauit se
  choice: se ergueu
  rationale: Equivalente corrente e digno para o movimento de levantar-se e assumir posição.
- source_word: tenuit principatum
  choice: exerceu o domínio
  rationale: Principatus designa aqui autoridade ou governo; 'exerceu o domínio' soa natural sem acrescentar uma forma política específica.
- source_word: non apparuit
  choice: desapareceu
  rationale: Verte idiomaticamente a ideia de que deixou de ser vista ou de aparecer.
