  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: pt
  text: '“Eu lhe anuncio isto antes que você comece a desaparecer: depois de você, ninguém o terá por tanto tempo, nem sequer por metade desse tempo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc annuntio
  choice: Eu lhe anuncio isto
  rationale: Reproduz diretamente o ato solene de anunciar, com objeto demonstrativo explícito.
- source_word: antequam incipias non parere
  choice: antes que você comece a desaparecer
  rationale: A construção latina significa literalmente começar a não aparecer; ‘comece a desaparecer’ expressa isso de modo natural sem sugerir necessariamente morte ou destruição.
- source_word: Nemo post te
  choice: depois de você, ninguém
  rationale: Mantém a sequência temporal e a ênfase do latim.
- source_word: hold it for as long
  choice: o manterá por tanto tempo
  rationale: Segue a camada inglesa auditada para a continuação não incluída no trecho latino fornecido; o pronome preserva a referência implícita, e a formulação comunica duração com naturalidade.
- source_word: not even half as long
  choice: nem sequer pela metade desse tempo
  rationale: Expressa idiomaticamente a comparação de duração, sem introduzir uma medida precisa ausente do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por ‘você’ para clareza. A ambiguidade do referente de ‘o’ foi preservada. O trecho latino fornecido termina em ‘Nemo post te’; a parte final da redação segue a camada inglesa auditada.
