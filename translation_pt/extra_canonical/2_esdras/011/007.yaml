  yaml_path: translation/extra_canonical/2_esdras/011/007.yaml
  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
translation:
  language: pt
  text: 'E vi, e eis que a águia se ergueu sobre as suas garras e dirigiu a voz[a] às suas asas, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fez ouvir a sua voz».'
    reason: O latim misit uocem é um idioma que pode significar «emitiu» ou «fez ouvir a voz»; pennis suis indica que a voz é dirigida às suas asas.
lexical_decisions:
- source_word: surrexit aquila super ungues suos
  choice: a águia se ergueu sobre as suas garras
  rationale: 'Mantém a imagem concreta do latim: a águia se levanta apoiada nas próprias garras. «Garras» é mais natural em português para uma ave de rapina do que a tradução genérica «unhas».'
- source_word: misit uocem pennis suis
  choice: dirigiu a voz às suas asas
  rationale: O verbo «dirigiu» comunica que a voz é destinada às asas, enquanto «a voz» preserva o idioma semítico refletido no latim e a personificação incomum da visão.
- source_word: dicens
  choice: dizendo
  rationale: Reproduz naturalmente o particípio latino e introduz a fala que vem em seguida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com «e eis que» para conservar o caráter visionário da narrativa. A formulação preserva a imagem singular de a águia falar às próprias asas sem explicá-la ou normalizá-la.
