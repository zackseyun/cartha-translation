lexical_decisions:
- source_word: auerunt
  choice: restaram
  rationale: O texto latino transmitido parece estar truncado ou corrompido no início da palavra; pelo contexto e pela versão de consulta, o sentido é que duas cabeças permaneceram. “Restaram” expressa isso com naturalidade.
- source_word: regnauerunt
  choice: reinaram
  rationale: Correspondência direta ao verbo latino, preservando a imagem régia.
- source_word: super terram et super eos qui inhabitant in ea
  choice: sobre a terra e sobre os que nela habitam
  rationale: Mantém a repetição de “sobre” e reproduz de perto a estrutura e a extensão do domínio no original.
- source_word: Et uidi et ecce
  choice: Então vi, e eis que
  rationale: “Eis que” conserva a fórmula visionária e a abertura sintática que prossegue no versículo seguinte; “Então” torna natural a progressão narrativa do primeiro et.
