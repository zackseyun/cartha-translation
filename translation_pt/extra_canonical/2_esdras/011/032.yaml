id: 2ES.11.32
reference: 2 Esdras 11:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: caput percontinuit omnem terram et dominauit qui inhabitant in ea cum labore multo et potentatum tenuit orbis terrarum super omnes alas quae fuerunt. Et uidi post haec et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: pt
  text: E esta cabeça dominou toda a terra e governou os seus habitantes com grande opressão; e exerceu domínio sobre o mundo inteiro mais do que todas as asas que a precederam. Depois disso, vi, e eis que...
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput
  choice: cabeça
  rationale: Mantém a imagem simbólica explícita do texto latino e a continuidade com a visão.
- source_word: percontinuit
  choice: dominou
  rationale: Expressa o exercício abrangente de poder indicado pelo verbo no contexto, sem introduzir uma interpretação adicional.
- source_word: cum labore multo
  choice: com grande opressão
  rationale: Embora labor possa significar trabalho, sofrimento ou aflição, aqui a construção descreve o modo penoso como os habitantes foram governados; 'opressão' comunica naturalmente esse efeito no contexto político.
- source_word: potentatum tenuit
  choice: exerceu domínio
  rationale: Reproduz de modo idiomático a ideia de deter e exercer autoridade soberana.
- source_word: orbis terrarum
  choice: mundo inteiro
  rationale: Formulação portuguesa natural para o mundo habitado em sua totalidade, distinguindo-a sem rigidez excessiva de 'omnem terram'.
- source_word: alas quae fuerunt
  choice: asas que a precederam
  rationale: Torna explícito o sentido temporal de 'foram antes', já claro no contexto, preservando a imagem das asas.
- source_word: ecce
  choice: eis que
  rationale: Conserva a fórmula visionária e solene de apresentação.
theological_decisions:
- issue: Identidade simbólica da cabeça e das asas
  choice: Preservar os símbolos sem identificar os poderes representados
  alternative: Substituir ou explicar os símbolos por uma identificação histórica específica
  rationale: O versículo não fornece por si só uma identificação inequívoca; explicitá-la importaria uma interpretação externa.
- issue: Sentido de cum labore multo
  choice: Traduzir como 'com grande opressão'
  alternative: Traduzir literalmente como 'com muito trabalho/sofrimento'
  rationale: No contexto do governo exercido sobre habitantes, a expressão aponta para aflição imposta; a escolha mantém a força negativa sem acrescentar uma doutrina.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária. A frase final permanece aberta por continuar no versículo seguinte; as reticências sinalizam essa suspensão sem criar conteúdo novo.
