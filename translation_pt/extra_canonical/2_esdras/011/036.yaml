  text: Então vi, e eis que algo semelhante a um leão que se erguia da floresta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: Então vi, e eis que
  rationale: Conserva a sequência narrativa e a fórmula visionária enfática do latim em linguagem bíblica clara e digna.
- source_word: sicut leo
  choice: algo semelhante a um leão
  rationale: Expressa o valor comparativo de «sicut» sem identificar de modo absoluto a figura vista com um leão.
- source_word: suscitatus de silua
  choice: despertado na floresta
  rationale: Traduz o particípio passivo «suscitatus» como «despertado» e entende «de silua» como o âmbito de onde a figura é despertada, evitando a impressão pouco natural de que ela já sai da floresta neste fragmento.
