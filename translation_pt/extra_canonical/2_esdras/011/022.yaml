  source_fidelity: A revisão é necessária porque «uidi» significa diretamente «vi», não «olhei». Além disso, «tenebant principatum» descreve a posse/exercício de autoridade; «não detinham o poder» preserva melhor esse valor do que «não mantiveram o domínio», que pode sugerir perda posterior ou duração não expressa pelo trecho.
  naturalness: «Mas não detinham o poder. E, depois disso, vi, e eis que não» é natural em português moderno, conserva o registro visionário e mantém de modo inteligível a suspensão sintática que continua no versículo seguinte.
  terminology: «Poder» comunica aqui, de forma ampla e não denominacional, o sentido político de principatum. «Eis que» é uma boa correspondência formal e estilisticamente apropriada para ecce.
