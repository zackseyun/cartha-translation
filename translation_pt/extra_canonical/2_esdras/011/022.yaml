  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tenebant principatum
  choice: mantiveram o domínio
  rationale: O imperfeito latino indica uma situação continuada ou uma tentativa que não perdurou; «mantiveram o domínio» comunica naturalmente que não conservaram o poder governante.
- source_word: Et uidi post haec
  choice: Depois disso, olhei
  rationale: Nesta fórmula visionária, «olhei» exprime melhor o ato deliberado de dirigir a atenção do que o simples «vi», enquanto «depois disso» preserva a sequência do latim.
- source_word: ecce
  choice: e eis que
  rationale: Mantém o marcador enfático e visionário tradicional em linguagem bíblica digna e amplamente compreensível.
- source_word: non
  choice: não
  rationale: Preserva a palavra final do fragmento latino, embora a construção só se complete no versículo seguinte.
