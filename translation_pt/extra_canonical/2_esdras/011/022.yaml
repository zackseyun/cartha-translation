    rationale: O perfeito latino uidi é «vi». Embora «olhei» possa por vezes funcionar em narrativa visionária, introduz um ato de dirigir o olhar que não está lexicalmente expresso no original.
  - severity: low
    issue: «Não mantiveram o domínio» enfraquece o aspecto de estado em tenebant.
    rationale: O imperfeito tenebant significa que não detinham/tinham a autoridade; «mantiveram» pode insinuar que a possuíram e depois a perderam, algo que esta cláusula não afirma.
