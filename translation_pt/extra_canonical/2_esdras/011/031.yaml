- source_word: quae cogitabant regnare
  choice: que pretendiam reinar
  rationale: «Pretendiam» comunica a intenção ou aspiração indicada por «cogitabant», sem sugerir que chegaram efetivamente a reinar.
- source_word: Hoc autem
  choice: Depois disso,
  rationale: Como o fragmento continua na frase seguinte, a expressão funciona aqui como transição narrativa; a vírgula sinaliza que o enunciado permanece incompleto neste versículo.
