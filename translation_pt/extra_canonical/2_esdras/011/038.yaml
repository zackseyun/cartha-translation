  text: Are you not the one who prevailed over the four beasts that I had made[a]
translation:
  language: pt
  text: Não é você quem sobreviveu dentre os quatro animais que eu havia feito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que prevaleceu sobre os quatro animais que eu havia feito?”. O verbo latino também pode ter o sentido de “prevaleceu”, mas a construção aqui favorece a ideia de ter sobrevivido dentre os quatro.'
    reason: Preserva a alternativa lexical de superasti, enquanto o texto principal reflete a leitura contextual de superasti de quattuor animalibus.
lexical_decisions:
- source_word: superasti de quattuor animalibus
  choice: restou dos quatro animais
  rationale: Aqui, superasti pode indicar que alguém sobreviveu ou permaneceu, e de quattuor animalibus indica o grupo do qual esse ser restou. Essa leitura preserva a construção latina melhor do que entender a expressão como uma vitória sobre os quatro animais.
- source_word: animalibus
  choice: animais
  rationale: “Animais” é a correspondência direta e natural para animalia no contexto das figuras apocalípticas; “feras” acrescentaria uma caracterização não expressa pelo termo latino.
- source_word: quae feceram
  choice: que eu havia feito
  rationale: Mantém o mais-que-perfeito latino e a relativa ligada aos quatro animais, sem completar a frase com conteúdo que não aparece no segmento fornecido.
theological_decisions:
- issue: Relação da figura interpelada com os quatro animais
  choice: Ela é apresentada como aquela que restou dentre os quatro.
  alternative: Ela prevaleceu sobre os quatro animais.
  rationale: O verbo superare admite a ideia de prevalecer, mas a construção com de e ablativo favorece, neste contexto, a noção de restar ou sobreviver dentre um grupo. A nota registra a amplitude lexical sem impor uma identificação teológica.
translation_notes:
  register: Português atual, claro e digno, com construção interrogativa natural. “Você” oferece ampla legibilidade brasileira sem alterar o tom direto da interpelação.
