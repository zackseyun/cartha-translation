lexical_decisions:
- source_word: superauerunt
  choice: as que restaram
  rationale: O perfeito latino indica as que sobreviveram ou permaneceram; a forma feminina retoma o referente feminino do contexto.
- source_word: apud semetipsas cogitabant
  choice: planejavam entre si
  rationale: Expressa uma deliberação interna e conjunta em português natural, sem tornar a intenção mais definida do que no latim.
- source_word: et ipsae regnare
  choice: também reinar
  rationale: Preserva a ênfase inclusiva de ipsae e o infinitivo regnare como objeto do planejamento.
- source_word: quiescentium capitum
  choice: cabeças que estavam em repouso
  rationale: Mantém o sentido de quiescere sem antecipar o despertar narrado no versículo seguinte.
