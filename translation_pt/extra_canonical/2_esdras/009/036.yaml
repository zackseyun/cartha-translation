base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: pt
  text: Pois nós, de fato,[a] que recebemos a Lei, pereceremos porque pecamos, e também o nosso coração, que a recebeu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino nesta parte é um tanto irregular. O sentido principal é que aqueles que receberam a Lei perecem, embora a própria Lei não pereça, mas permaneça honrada.
    reason: textual_variant
  - marker: b
    text: 'Ou: “Pois nós, que recebemos a Lei, pereceremos em pecado, e também o nosso coração, que a recebeu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: nos quidem
  choice: nós, de fato
  rationale: Preserva a ênfase de quidem sobre 'nós' sem convertê-la indevidamente em uma relação causal.
- source_word: legem
  choice: a Lei
  rationale: No contexto, refere-se à Lei recebida pelo povo; a inicial maiúscula torna clara essa referência específica.
- source_word: peccantes peribimus
  choice: pereceremos porque pecamos
  rationale: Expressa de modo natural a relação entre o particípio peccantes e o verbo peribimus, conforme o sentido contextual, sem a ambiguidade pouco idiomática de 'pereceremos pecando'.
- source_word: cor nostrum
  choice: o nosso coração
  rationale: Mantém explicitamente o possessivo nostrum e o singular coletivo do latim.
- source_word: quod suscepit eam
  choice: que a recebeu
  rationale: O pronome feminino 'a' retoma 'a Lei' e conserva a personificação ou formulação incomum do coração como receptor.
theological_decisions:
- issue: Destino dos que receberam a Lei em contraste com a permanência da Lei no contexto
  choice: Afirmar que 'nós' e 'o nosso coração' perecerão, sem acrescentar explicação doutrinária ao versículo
  alternative: Explicitar no corpo do texto que a Lei não perece
  rationale: A cláusula preservada neste versículo fala do povo e de seu coração; a relação com a permanência da Lei pertence ao contexto e à nota textual, não deve ser inserida no texto.
- issue: Força causal de peccantes
  choice: porque pecamos
  alternative: em pecado; pecando
  rationale: A formulação causal oferece português claro e acompanha a revisão auditada, embora a construção participial latina admita uma tradução mais compacta; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação destaca a ênfase de 'nós, de fato'; a construção deliberadamente incomum sobre o coração foi mantida por fidelidade ao latim.
