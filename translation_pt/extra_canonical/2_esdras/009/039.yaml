lexical_decisions:
- source_word: dimisi cogitatus
  choice: deixei de lado os pensamentos
  rationale: Expressa naturalmente a ideia de abandonar ou pôr de parte os pensamentos, sem tornar o verbo mais forte do que o latim exige.
- source_word: in quibus eram cogitans
  choice: em que estava pensando
  rationale: Preserva a repetição intencional entre cogitatus e cogitans e mantém correspondência próxima com a construção latina.
- source_word: conversus sum ad eam
  choice: voltei-me para ela
  rationale: Traduz o movimento ou redirecionamento da atenção indicado por conversus sum ad, em português corrente e digno.
- source_word: dixi ei
  choice: lhe disse
  rationale: Reproduz de forma idiomática o objeto indireto latino ei.
