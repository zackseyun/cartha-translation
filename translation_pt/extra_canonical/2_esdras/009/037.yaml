  text: For the law does not perish[a], but remains in its honor.”
translation:
  language: pt
  text: Pois a lei não perece, mas permanece em sua honra.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: Pois
  rationale: Introduz a explicação ou razão da afirmação anterior, preservando a função causal do latim.
- source_word: lex
  choice: a lei
  rationale: Equivalente direto e natural de lex neste contexto.
- source_word: non perit
  choice: não perece
  rationale: Mantém a força verbal e o aspecto presente do latim, sem reduzir o sentido a mera perda ou desaparecimento.
- source_word: sed permanet
  choice: mas permanece
  rationale: Preserva o contraste explícito marcado por sed entre não perecer e permanecer.
- source_word: in suo honore
  choice: em sua honra
  rationale: Tradução formalmente próxima que conserva a expressão latina e sua possível amplitude sem interpretá-la como validade, dignidade ou autoridade.
theological_decisions:
- issue: Natureza da permanência da lei
  choice: permanece em sua honra
  alternative: conserva a sua honra
  rationale: A formulação escolhida não especifica se a permanência diz respeito à validade, autoridade, dignidade ou condição da lei, preservando a amplitude do texto latino.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe simples. A conjunção “Pois” preserva Nam, e “mas” reproduz o contraste de sed. Mantém-se “em sua honra” por proximidade ao latim e para evitar interpretação teológica excessiva.
