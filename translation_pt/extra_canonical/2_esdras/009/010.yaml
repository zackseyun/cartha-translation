  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: pt
  text: Pois todos os que não me conheceram enquanto viviam, embora tivessem recebido benefícios,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot enim
  choice: Pois todos os que
  rationale: Reproduz o valor explicativo de enim e a abrangência distributiva de quotquot em português natural.
- source_word: non cognoverunt me
  choice: não me conheceram
  rationale: Mantém o sentido direto de cognoverunt sem especificar se se trata de conhecimento intelectual, relacional ou reconhecimento.
- source_word: viventes
  choice: enquanto viviam
  rationale: Expressa com clareza o particípio circunstancial latino e preserva a referência à vida terrena.
- source_word: beneficia consecuti
  choice: embora tivessem recebido benefícios
  rationale: Consecuti indica que os benefícios lhes haviam sido concedidos ou alcançados; a construção concessiva explicita a tensão já refletida pela sintaxe e pelo contexto, sem identificar a natureza dos benefícios.
theological_decisions:
- issue: Natureza de conhecer a Deus
  choice: não me conheceram
  alternative: não me reconheceram
  rationale: A tradução conserva a amplitude de cognoscere, evitando restringir o texto à mera identificação ou ao conhecimento exclusivamente relacional.
- issue: Natureza dos benefícios recebidos
  choice: benefícios
  alternative: bênçãos
  rationale: Beneficia é mais amplo e neutro que “bênçãos”; “benefícios” evita acrescentar uma qualificação religiosa não expressa no latim.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi preservada porque o versículo constitui uma oração incompleta que continua no contexto seguinte.
