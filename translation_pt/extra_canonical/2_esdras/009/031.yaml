source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: pt
  text: Pois eis que semeio em vocês a minha lei; ela dará fruto em vocês, e por meio dela vocês serão glorificados para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce enim
  choice: Pois eis que
  rationale: Preserva tanto a ligação explicativa de enim quanto a ênfase apresentativa de ecce, em linguagem bíblica ainda compreensível.
- source_word: semino in uobis legem meam
  choice: semeio em vocês a minha lei
  rationale: Mantém literalmente a metáfora agrícola e a preposição que situa a lei no interior da comunidade.
- source_word: faciet in uobis fructum
  choice: ela dará fruto em vocês
  rationale: Expressão natural em português que conserva a imagem do fruto produzido nos destinatários.
- source_word: glorificabimini in eo
  choice: por meio dela vocês serão glorificados
  rationale: O pronome latino eo retoma de modo mais provável lex, substantivo feminino em português; 'por meio dela' comunica o valor instrumental sem atribuir a glória diretamente aos próprios destinatários.
- source_word: per saeculum
  choice: para sempre
  rationale: Equivalente idiomático do sentido duradouro ou eterno da expressão latina neste contexto.
theological_decisions:
- issue: Agente e meio da glorificação
  choice: 'Forma passiva: ''vocês serão glorificados'', tendo a lei como meio'
  alternative: “ela os glorificará” ou “vocês se gloriarão nela”
  rationale: A forma latina é passiva e não identifica explicitamente o agente; a tradução preserva essa abertura teológica, enquanto in eo é vertido instrumentalmente de acordo com o contexto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com 'vocês' para o plural. A metáfora de semear, frutificar e ser glorificado foi preservada sem expansão interpretativa.
