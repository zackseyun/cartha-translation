source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: pt
  text: Pois, assim como tudo o que veio a existir nesta era tem um começo por meio de um fim[a], e o fim é manifesto,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto latino aqui é difícil: literalmente, “um começo por meio de uma consumação”. Uma leitura textual alternativa diz: “o começo é evidente e o fim é manifesto”.'
    reason: Registra a provável corrupção ou variante textual e permite ao leitor ver tanto a forma do latim fornecido quanto a emenda contextual apoiada por outras testemunhas.
lexical_decisions:
- source_word: omne quod factum est
  choice: tudo o que veio a existir
  rationale: Expressa naturalmente o sentido de tudo aquilo que foi feito ou passou a existir, sem restringir a referência a objetos materiais.
- source_word: in saeculo
  choice: nesta era
  rationale: Preserva o valor temporal de saeculum e evita substituí-lo por “mundo”, leitura possível, mas menos literal neste contexto.
- source_word: initium
  choice: começo
  rationale: Termo corrente e claro para o início de algo.
- source_word: per consummationem
  choice: por meio de um fim
  rationale: Mantém a construção difícil do texto latino fornecido, em vez de corrigi-la silenciosamente; a nota registra a provável dificuldade textual.
- source_word: consummatio manifesta
  choice: o fim é manifesto
  rationale: Conserva a repetição de consummatio e o sentido explícito de manifesta em linguagem dignificada e compreensível.
theological_decisions:
- issue: Relação entre o começo e o fim na construção latina difícil “initium per consummationem”
  choice: Preservar no texto a formulação “um começo por meio de um fim”
  alternative: Adotar a emenda “o começo é evidente e o fim é manifesto”
  rationale: O texto latino fornecido contém per consummationem, enquanto a emenda produz sentido mais claro e conta com apoio citado de outras testemunhas. Como a evidência apresentada é conflitante, a tradução não resolve silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Era” preserva a dimensão temporal de saeculum; “manifesto” mantém a força formal do latim. A construção incomum foi conservada no texto e esclarecida em nota, sem impor uma correção conjectural.
