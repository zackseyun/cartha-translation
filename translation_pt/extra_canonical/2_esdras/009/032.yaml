source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam patres nostri accipientes legem non servaverunt et legitima mea non custodierunt. et factum est fructumlegis non periens; nec enim poterat, quoniam tuus erat.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: pt
  text: Pois nossos pais, depois de receberem a Lei, não a guardaram nem observaram os meus estatutos. E o fruto da Lei não pereceu, pois não podia perecer, porque era teu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: nossos pais
  rationale: Mantém a expressão ancestral do latim em linguagem bíblica clara e corrente.
- source_word: legem
  choice: a Lei
  rationale: A inicial maiúscula sinaliza a referência à Lei divina recebida pelos antepassados.
- source_word: legitima mea
  choice: os meus estatutos
  rationale: Preserva tanto o sentido de determinações legais quanto o possessivo explícito mea.
- source_word: fructum legis
  choice: o fruto da Lei
  rationale: Conserva a metáfora do texto-fonte sem explicá-la ou restringir seu alcance.
- source_word: tuus erat
  choice: era teu
  rationale: Reproduz diretamente o possessivo de segunda pessoa e mantém a referência contextual a Deus.
theological_decisions:
- issue: O sentido de “fruto da Lei”
  choice: Manter a metáfora sem explicação interpretativa
  alternative: Traduzir como “o resultado da Lei” ou identificar o fruto com pessoas, obras ou promessa
  rationale: O latim não define o referente da metáfora; explicitá-lo resolveria indevidamente uma ambiguidade teológica genuína.
- issue: A impossibilidade de o fruto perecer
  choice: “não podia perecer”
  alternative: “não podia deixar de existir”
  rationale: A formulação preserva a força de nec enim poterat e a ligação lexical com non periens, sem acrescentar uma teoria sobre a preservação da Lei.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi levemente reorganizada para fluidez: a recepção da Lei é seguida pelo contraste “mas”, e a preservação de seu fruto por “Contudo”. Não há marcadores de nota, pois nenhuma nota foi necessária.'
