  source_fidelity: 'O texto preserva corretamente os elementos centrais: os antepassados receberam a Lei, não a guardaram nem observaram os estatutos divinos, e o fruto da Lei não pereceu por pertencer a Deus. Convém, porém, representar mais diretamente o particípio accipientes como anterioridade (“depois de receberem”) e evitar “Contudo”, que introduz uma oposição mais marcada do que o simples et latino.'
