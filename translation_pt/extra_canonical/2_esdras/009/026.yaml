base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: pt
  text: Assim, fui, conforme ele me havia dito, ao campo chamado Ardat e me sentei ali entre as flores. Comi as ervas do campo, e o alimento que delas vinha me deixou satisfeito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o alimento proveniente delas foi suficiente para me saciar”.'
    reason: Preserva uma tradução mais formal da construção latina facta est esca earum in saturitatem e explicita sua possível nuance de suficiência.
lexical_decisions:
- source_word: Ardat
  choice: Ardat
  rationale: Mantém o nome próprio do lugar por transliteração, em harmonia com a identificação contextual do campo.
- source_word: in floribus
  choice: entre as flores
  rationale: Expressa naturalmente a posição de quem se senta em meio às flores.
- source_word: de herbis agri manducaui
  choice: Comi as ervas do campo
  rationale: Reproduz de modo direto o sentido do latim, sem especificar indevidamente se eram ervas silvestres, plantas ou vegetais cultivados.
- source_word: esca earum
  choice: o alimento que delas vinha
  rationale: Entende o genitivo como origem ou matéria — alimento proveniente das ervas — e evita a leitura possessiva pouco natural de 'o alimento delas'.
- source_word: in saturitatem
  choice: me deixou satisfeito
  rationale: Comunica em português corrente o resultado de saciedade expresso pela construção latina.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário acessível. A abertura segue o sentido contextual preservado pela tradição consultada; a expressão final evita a ambiguidade possessiva que uma tradução literal de esca earum poderia criar.
