source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: pt
  text: E então[a], quando eu preparava para eles — para os que existem agora —, antes que fosse criada para eles a era em que habitariam, ninguém me contradisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradição antiga entende o trecho assim: “Quando eu preparava para os que existem agora, antes que fosse criada para eles a era em que habitariam, ninguém me contradisse então, pois não havia ninguém”. A frase final não consta do texto latino adotado.'
    reason: Registra a leitura alternativa preservada na tradição siríaca e na tradução anterior, deixando claro que sua explicação final não pertence ao texto-base latino.
lexical_decisions:
- source_word: et tunc
  choice: E então
  rationale: Reproduz explicitamente a ligação temporal e narrativa do latim, sem deslocá-la para o fim da frase.
- source_word: parans eis
  choice: preparava para eles
  rationale: Mantém o objeto não expresso de parans e preserva o dativo eis, evitando acrescentar “tudo” ou outra explicitação ausente do texto.
- source_word: his qui nunc
  choice: para os que existem agora
  rationale: Explicita em português o verbo elíptico após nunc, conforme exige o sentido, e conserva a retomada enfática de eis.
- source_word: saeculum
  choice: era
  rationale: Conserva o valor temporal-cósmico de saeculum e acompanha a ambiguidade da expressão, em vez de reduzi-la simplesmente a “mundo”.
- source_word: inhabitarent
  choice: habitariam
  rationale: Mantém o valor prospectivo do imperfeito do subjuntivo na oração relativa dependente de uma preparação anterior.
- source_word: nemo contradixit mihi
  choice: ninguém me contradisse
  rationale: Traduz diretamente o latim, sem acrescentar a explicação “pois não havia ninguém”, ausente do texto-base adotado.
theological_decisions:
- issue: A inexistência de oposição durante a criação
  choice: ninguém me contradisse
  alternative: ninguém me contradisse então, pois não havia ninguém
  rationale: O texto latino adotado afirma apenas que ninguém contradisse o falante. A explicação adicional pertence a outra tradição antiga e não deve ser incorporada silenciosamente ao texto principal.
translation_notes:
  register: Português moderno, claro e solene. Os travessões tornam legível a retomada explicativa “para os que existem agora” sem apagar a construção incomum do latim. “Era” preserva a dimensão temporal e cósmica de saeculum.
