  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: pt
  text: Eu vi e, com enorme dificuldade, os poupei; salvei para mim uma uva do cacho e uma plantação de uma grande floresta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim preservado diz literalmente «de uma grande tribo»; antigas versões em outras línguas trazem «de uma grande floresta».
    reason: Registra com transparência a variante textual, enquanto o texto principal segue a leitura que melhor explica o paralelismo e a evidência das versões antigas.
lexical_decisions:
- source_word: saluaui mihi
  choice: preservei para mim
  rationale: Expressa a ideia de salvar ou reservar algo para si, em português natural, sem repetir o verbo usado na oração anterior.
- source_word: acinum de botru
  choice: uma uva do cacho
  rationale: 'Traduz literalmente a imagem agrícola: um único bago de uva preservado dentre o cacho.'
- source_word: plantationem
  choice: uma planta
  rationale: Mantém o paralelismo entre um elemento individual e o conjunto do qual é retirado; aqui o substantivo designa aquilo que foi plantado.
- source_word: de tribu multa
  choice: de uma grande floresta
  rationale: Embora o latim preservado tenha literalmente 'de uma grande tribo', 'floresta' reflete a leitura subjacente apoiada pelas versões antigas e pelo paralelismo entre planta e floresta.
