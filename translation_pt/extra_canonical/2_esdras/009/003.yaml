  text: and confusion among peoples, thoughts among nations, instability among leaders, turmoil among rulers. Then you will understand that it was about these things that the Most High
translation:
  language: pt
  text: perturbação dos povos, pensamentos das nações, inconstância dos líderes, perturbação dos governantes. Então você entenderá que era a respeito dessas coisas que o Altíssimo
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populorum turbatio
  choice: confusão entre os povos
  rationale: Preserva o sentido de desordem ou confusão expresso por turbatio e a relação plural de populorum.
- source_word: gentium cogitationes
  choice: pensamentos entre as nações
  rationale: Traduz cogitationes sem acrescentar a conotação negativa de conspirações ou maquinações, que o latim não exige.
- source_word: ducum inconstantia
  choice: inconstância dos líderes
  rationale: Inconstantia indica instabilidade ou falta de firmeza; 'líderes' expressa duces de modo amplo e natural no contexto.
- source_word: principum turbatio
  choice: agitação dos governantes
  rationale: Distingue esta ocorrência de turbatio da primeira por uma formulação natural que comunica perturbação entre os detentores de autoridade.
- source_word: Tunc intelleges
  choice: Então você entenderá
  rationale: Reproduz diretamente a sequência temporal e a segunda pessoa do singular.
- source_word: Altissimus
  choice: o Altíssimo
  rationale: Emprega o título divino tradicional e claro em português.
theological_decisions:
- issue: Referente de 'Altíssimo' em uma oração incompleta
  choice: Manter 'o Altíssimo' e deixar a frase aberta
  alternative: Completar ou explicitar o que o Altíssimo teria dito ou feito
  rationale: O trecho-fonte termina de forma truncada em altis-, cuja restauração contextual é 'Altissimus'; não se deve suprir nesta unidade o restante da oração ausente.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura enumerativa próxima do latim. O fragmento começa e termina no meio da frase; por isso, inicia-se com minúscula e não se acrescenta pontuação final.
