  - severity: low
    issue: Variação semântica entre as duas ocorrências de turbatio
    rationale: «Confusão» e «agitação» são possíveis conforme o contexto, mas o original repete turbatio. Repetir «perturbação» mantém a coesão lexical e evita nuances adicionais.
