  source_fidelity: A enumeração e a cláusula final seguem o latim, e a frase truncada é corretamente preservada. Contudo, «entre os povos/entre as nações» enfraquece as relações genitivas de populorum e gentium; o latim apresenta a perturbação dos povos e os pensamentos das nações.
