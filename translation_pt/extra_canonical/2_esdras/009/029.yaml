    rationale: O advérbio tenta representar a ênfase da duplicação ostendens ostensus es, mas acrescenta uma nuance de clareza que o original não afirma. A ênfase pode permanecer implícita numa formulação portuguesa solene e direta.
  - severity: low
    issue: Pontuação final
    rationale: O texto-fonte fornecido termina com et, e o testemunho inglês também conserva uma vírgula, indicando que a oração continua. A tradução deve terminar com vírgula, não com ponto.
