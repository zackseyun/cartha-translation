source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dicere coram altissimo et dixi: O domine in nobis ostendens ostensus es patribus nostris in deserto quando erant exientes de Aegypto et quando ueniebant in deserto quod non calcatur et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: pt
  text: Ó Senhor[a], tu te mostraste a nossos pais entre nós, no deserto, quando saíam do Egito e entravam no deserto não trilhado e estéril,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tu te mostraste entre nós a nossos pais».'
    reason: A posição e o alcance de in nobis em relação a patribus nostris permitem uma ordem alternativa em português, sem resolver além do que o latim permite.
lexical_decisions:
- source_word: ostendens ostensus es
  choice: tu te manifestaste claramente
  rationale: A construção latina duplicada é enfática e provavelmente preserva um semitismo. A formulação comunica essa ênfase em português sem reproduzir uma sintaxe artificial.
- source_word: in nobis
  choice: em nosso meio
  rationale: Expressa naturalmente o sentido locativo de presença entre o povo, sem reduzir a frase a uma experiência meramente interior.
- source_word: patribus nostris
  choice: aos nossos pais
  rationale: Mantém a designação ancestral do texto e a relação sintática com a manifestação divina.
- source_word: quod non calcatur
  choice: não pisado
  rationale: Preserva a imagem concreta de um território não percorrido ou trilhado.
- source_word: infructuoso
  choice: estéril
  rationale: O inglês auditado conserva este elemento na conclusão do versículo; 'estéril' é a equivalência natural para um deserto improdutivo.
theological_decisions:
- issue: Natureza da manifestação divina
  choice: tu te manifestaste claramente
  alternative: foste mostrado / apareceste
  rationale: A escolha mantém a autorrevelação divina e a ênfase da construção latina, sem explicar o modo dessa manifestação nem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. Conserva a solenidade da invocação e a ênfase incomum de “ostendens ostensus es” por meio de “claramente”. O adjetivo final “estéril” segue a camada inglesa auditada, que testemunha a continuação latina “infructuoso”, embora o recorte latino fornecido termine em “et”.
