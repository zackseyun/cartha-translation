  source_fidelity: A tradução preserva os referentes principais, mas «claramente» introduz uma explicitação que não é exigida pelo latim. Embora «ostendens ostensus es» seja enfático, o texto latino não especifica que a manifestação tenha sido ‘clara’.
  naturalness: «Em nosso meio aos nossos pais» é compreensível, mas a sequência fica algo pesada. «A nossos pais entre nós» mantém as duas relações do latim em português mais fluente.
  terminology: «Senhor», «pais», «deserto», «Egito» e «estéril» são adequados ao registro. «Não trilhado» é uma formulação idiomática que conserva a imagem de quod non calcatur.
