source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae suscepta sunt, Exterminentur haec, susceptoria uero manent: apud nos enim non sic factum est. Nos quidem qui legem accepimus peccantes peribimus et cor nostrum quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: pt
  text: e, quando o que foi recebido for destruído[a], essas coisas forem destruídas, mas os receptáculos permanecerem. Pois conosco não aconteceu assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim também pode ser entendido como “aquilo que foi acolhido” ou “as coisas recebidas”.
    reason: O particípio suscepta é amplo, e sua relação gramatical com haec produz uma formulação incomum que não deve ser excessivamente esclarecida no texto principal.
lexical_decisions:
- source_word: suscepta
  choice: o que foi recebido
  rationale: Mantém o sentido básico do particípio latino de suscipere e a formulação deliberadamente geral, sem acrescentar as ideias não expressas de semear ou enviar.
- source_word: exterminentur
  choice: é destruído / são destruídas
  rationale: Neste contexto, o verbo indica eliminação ou destruição; a tradução conserva a repetição argumentativa do latim.
- source_word: susceptoria
  choice: receptáculos
  rationale: Reproduz a distinção entre aquilo que é recebido e aquilo que o recebe, usando um termo concreto e suficientemente amplo.
- source_word: apud nos enim non sic factum est
  choice: Pois conosco não aconteceu assim
  rationale: Preserva o valor explicativo de enim e a transição do argumento, sem convertê-la em contraste adversativo.
theological_decisions:
- issue: Relação entre o recebido e os receptáculos
  choice: Conservar a formulação abstrata e a tensão do contraste
  alternative: Explicitar os referentes como semente, terra ou seres humanos
  rationale: O trecho latino fornecido não nomeia esses referentes; explicitá-los resolveria uma ambiguidade que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. A repetição aparentemente tautológica foi mantida por corresponder à estrutura do latim e por sustentar o contraste com “os receptáculos”.
