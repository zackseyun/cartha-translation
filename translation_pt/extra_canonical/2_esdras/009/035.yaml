review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente o paralelismo e a ambiguidade de suscepta / haec / susceptoria, bem como o valor explicativo de enim. Contudo, o presente do indicativo em “é destruído” e “são destruídas” não representa bem o subjuntivo latino exterminentur no quadro temporal introduzido por quando; o português pede subjuntivo: “for destruído / forem destruídas”.'
  naturalness: A redação é clara e de registro apropriado. “Receptáculos” é fiel e compreensível, embora formal; é preferível a termos que explicitem indevidamente os referentes. A correção verbal também torna a frase mais natural após “quando”.
  terminology: “O que foi recebido” traduz com segurança suscepta; “receptáculos” mantém a oposição com susceptoria; “pois” reproduz bem enim. A nota preserva possibilidades legítimas sem inserir a interpretação de semear ou enviar.
  issues:
  - severity: medium
    issue: Modo verbal após “quando”
    rationale: O latim exterminentur é subjuntivo plural. Em português, na oração temporal prospectiva com “quando”, a correspondência idiomática e formal é “for destruído” e “forem destruídas”, não o presente indicativo “é/são destruído(s)”.
  revised_text: e, quando o que foi recebido for destruído[a], essas coisas forem destruídas, mas os receptáculos permanecerem. Pois conosco não aconteceu assim.
