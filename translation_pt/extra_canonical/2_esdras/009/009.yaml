source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc mirabuntur qui nunc abusi sunt vias meas, et in cruciamentis commorabuntur hii qui eos proiecerunt in contemptu.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: pt
  text: Então ficarão espantados os que agora fizeram mau uso dos meus caminhos, e permanecerão em tormentos os que os rejeitaram com desprezo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabuntur
  choice: ficarão espantados
  rationale: Expressa a reação futura de assombro ou consternação indicada pelo verbo latino, de modo natural em português.
- source_word: abusi sunt vias meas
  choice: fizeram mau uso dos meus caminhos
  rationale: Mantém o sentido básico de abuti, evitando que “abusaram dos meus caminhos” soe ambíguo ou pouco natural em português moderno.
- source_word: in cruciamentis commorabuntur
  choice: permanecerão em tormentos
  rationale: Conserva tanto a ideia de duração de commorabuntur quanto o sofrimento expresso por cruciamentis.
- source_word: proiecerunt in contemptu
  choice: rejeitaram com desprezo
  rationale: Traduz idiomaticamente a ação de lançar de lado ou tratar como desprezível, sem acrescentar uma explicação teológica.
theological_decisions:
- issue: Referente do pronome em “eos proiecerunt”
  choice: “os rejeitaram”, tendo “meus caminhos” como referente contextual
  alternative: Entender “eos” como referência a pessoas não explicitadas no trecho
  rationale: Embora o latim apresente eos, cuja forma masculina não concorda com vias, o contexto imediato e a antiga versão inglesa auditada entendem o pronome como referência aos caminhos. Em português, “caminhos” é masculino, de modo que “os” transmite essa leitura naturalmente sem ocultar o encadeamento do texto.
translation_notes:
  register: Português moderno, digno e claro, com sintaxe próxima do original. “Fizeram mau uso” evita uma formulação artificial, enquanto “permanecerão em tormentos” preserva o tom judicial e a duração indicada no latim.
