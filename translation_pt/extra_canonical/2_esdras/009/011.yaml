lexical_decisions:
- source_word: quotquot
  choice: todos os que
  rationale: Reproduz de modo natural o sentido distributivo e abrangente do latim.
- source_word: fastidierunt
  choice: rejeitaram com desprezo
  rationale: Expressa tanto a rejeição quanto a atitude de desdém ou aversão contida no verbo latino, sem reduzi-lo a mera desobediência.
- source_word: legem meam
  choice: a minha lei
  rationale: Correspondência direta, clara e tradicional para a expressão latina.
- source_word: libertatem
  choice: liberdade
  rationale: Mantém a formulação ampla do latim, sem especificar se se trata de liberdade de escolha, oportunidade ou ausência de coerção.
theological_decisions:
- issue: Natureza da liberdade mencionada
  choice: enquanto ainda tinham liberdade
  alternative: enquanto ainda eram livres para escolher
  rationale: A tradução preserva a ambiguidade de libertatem e evita acrescentar uma interpretação específica sobre livre-arbítrio.
