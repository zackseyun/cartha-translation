  yaml_path: translation/extra_canonical/2_esdras/009/028.yaml
  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: pt
  text: Eu estava perturbado, como antes. Então minha boca se abriu, e comecei...
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turbabatur
  choice: Eu estava perturbado
  rationale: O texto latino fornecido parece conservar uma forma verbal de terceira pessoa, mas o contexto imediato e a continuação em primeira pessoa («meum», «inchoaui») indicam o narrador; a tradução mantém o sentido sem reproduzir a provável irregularidade textual.
- source_word: sicut et ante
  choice: como antes
  rationale: Expressão natural e fiel à comparação temporal do latim.
- source_word: apertum est os meum
  choice: minha boca se abriu
  rationale: Preserva a imagem semítica transmitida literalmente pelo latim e soa compreensível em português atual.
- source_word: inchoaui
  choice: comecei
  rationale: Equivalente direto; o fragmento fornecido termina no verbo, sem explicitar aqui o que foi iniciado.
theological_decisions:
- issue: Conteúdo após «comecei»
  choice: Manter a frase em suspensão com reticências
  alternative: Acrescentar «a falar diante do Altíssimo, e eu disse», conforme a camada inglesa
  rationale: Essas palavras não constam no texto latino fornecido. Para traduzir primeiro a evidência original e não importar uma continuação sem apoio nesta unidade, preserva-se o término fragmentário.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima ao latim. A redação diverge da consulta inglesa porque o texto latino apresentado inclui a perturbação anterior e termina em «comecei».
