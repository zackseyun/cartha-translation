source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: metiens metire in temetipso, et erit cum uideris quoniam transiuit pars quaedam signorum quae praedicta sunt, Tunc intelleges quoniam ipsum est'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/001.yaml
  text: He answered me and said[a], “Measure carefully within yourself, and when you see that some part of the signs foretold has passed by,
translation:
  language: pt
  text: 'Ele me respondeu e disse: “Meça cuidadosamente dentro de si[a]. Quando você vir que uma parte dos sinais anunciados de antemão já passou, então entenderá que é justamente aquilo'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meça cuidadosamente por si”.'
    reason: A expressão latina in temetipso pode indicar medição interior ou discernimento feito pela própria pessoa.
lexical_decisions:
- source_word: metiens metire
  choice: Meça cuidadosamente
  rationale: A construção participial seguida de imperativo intensifica a ordem; “cuidadosamente” transmite essa ênfase em português natural sem duplicar artificialmente o verbo.
- source_word: in temetipso
  choice: dentro de si mesmo
  rationale: Mantém a dimensão reflexiva e interior da expressão latina, sem substituí-la por uma interpretação mais específica como “calcule por si mesmo”.
- source_word: pars quaedam signorum
  choice: uma parte dos sinais
  rationale: Reproduz a referência indefinida do latim e evita sugerir que todos os sinais já se cumpriram.
- source_word: quae praedicta sunt
  choice: anunciados de antemão
  rationale: Expressa diretamente o sentido de praedicere no contexto profético.
- source_word: ipsum est
  choice: é justamente aquilo
  rationale: Preserva a ênfase de ipsum e o caráter sintaticamente incompleto da frase no limite deste versículo, que continua no seguinte.
theological_decisions:
- issue: Natureza da ação ordenada por “metiens metire in temetipso”
  choice: Meça cuidadosamente dentro de si mesmo
  alternative: Calcule cuidadosamente por si mesmo
  rationale: A formulação escolhida conserva a imagem de medir e a referência ao âmbito interior, sem decidir se a ordem descreve discernimento, cálculo cronológico ou autoexame.
- issue: Antecipação do complemento de “ipsum est”
  choice: Não inserir “o tempo” nem outro substantivo
  alternative: entenderá que esse é o tempo
  rationale: O latim fornecido termina sem substantivo explícito; completar a ideia neste versículo resolveria uma elipse cuja continuação pertence ao texto seguinte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “você”. A ordem enfática do latim foi vertida de modo idiomático, e a frase final permanece aberta para respeitar o limite e a sintaxe do texto-fonte.
