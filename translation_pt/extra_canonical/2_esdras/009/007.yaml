  text: et erit, omnis qui salvus factus fuerit et qui poterit effugere per opera sua vel per fidem in qua credidit, is
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: pt
  text: E acontecerá que todo aquele que for salvo[a] e puder escapar por suas obras ou pela fé em que creu, esse
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E todo aquele que for salvo”.'
    reason: Registra a versão anterior mais concisa, que não explicita a fórmula inicial et erit.
lexical_decisions:
- source_word: et erit
  choice: E acontecerá que
  rationale: Preserva a fórmula declarativa e profética do latim, sem omiti-la nem reduzi-la a uma simples conjunção.
- source_word: omnis qui salvus factus fuerit
  choice: todo aquele que for salvo
  rationale: Reproduz naturalmente em português a construção passiva e futura/perfeita no contexto escatológico.
- source_word: qui poterit effugere
  choice: puder escapar
  rationale: Mantém a ideia de capacidade ou possibilidade expressa por poterit.
- source_word: per opera sua
  choice: por suas obras
  rationale: Tradução direta de per com opera sua, preservando a formulação teologicamente tensa do texto.
- source_word: per fidem in qua credidit
  choice: pela fé em que creu
  rationale: Conserva a expressão incomum e sua possível ambiguidade, em vez de normalizá-la como mera fidelidade ou confiança.
- source_word: is
  choice: esse
  rationale: Mantém o pronome resumitivo final, embora o período permaneça incompleto neste versículo e prossiga no contexto seguinte.
theological_decisions:
- issue: Relação entre obras e fé como meios de escape
  choice: por suas obras ou pela fé em que creu
  alternative: por causa de suas obras ou por causa da fé que professou
  rationale: A tradução retém a alternativa marcada por vel e não harmoniza a afirmação com sistemas doutrinários posteriores.
- issue: Valor de et erit
  choice: E acontecerá que
  alternative: E todo aquele que for salvo
  rationale: A fórmula explícita do texto latino deve ser representada por seu peso profético e apocalíptico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a tensão do latim são preservadas; a frase termina em “esse” porque o texto fornecido constitui o início de uma construção que continua no versículo seguinte.
