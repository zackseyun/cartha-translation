id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: pt
  text: E, enquanto ainda lhes estava aberta a oportunidade de arrependimento, eles não compreenderam, mas a desprezaram; esses terão de compreender isso depois da morte, em tormento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: paenitentiae locus
  choice: oportunidade de arrependimento
  rationale: Embora literalmente signifique «lugar de arrependimento», a expressão latina comunica naturalmente uma oportunidade ainda disponível para se arrepender.
- source_word: spreverunt
  choice: a desprezaram
  rationale: Mantém o sentido forte de rejeitar com desprezo e retoma gramaticalmente «a oportunidade».
- source_word: hos oportet
  choice: esses terão de
  rationale: Representa o acusativo «hos» como sujeito lógico do infinitivo e expressa a necessidade indicada por «oportet».
- source_word: cognoscere
  choice: compreender isso
  rationale: Expressa o ato de vir a saber ou reconhecer depois da morte, deixando «isso» com referência deliberadamente ampla ao que antes não compreenderam e desprezaram.
- source_word: in cruciamento
  choice: em tormento
  rationale: Tradução direta e digna, sem ampliar a natureza ou a duração do sofrimento.
theological_decisions:
- issue: Referente implícito de «cognoscere»
  choice: compreender isso
  alternative: reconhecê-la
  rationale: O latim não declara explicitamente o objeto de «cognoscere». «Isso» preserva a abertura referencial, em vez de restringi-la somente à oportunidade de arrependimento.
- issue: Natureza do tormento após a morte
  choice: depois da morte, em tormento
  alternative: depois da morte, no tormento
  rationale: A formulação mantém a afirmação do texto sem definir duração, localização ou caráter do tormento além do que o latim diz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção preserva a tensão entre a oportunidade de arrependimento em vida e o conhecimento adquirido após a morte.
