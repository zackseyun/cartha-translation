lexical_decisions:
- source_word: famula
  choice: escrava
  rationale: Preserva com maior precisão a condição feminina e servil expressa pelo latim, sem suavizá-la para “serva”.
- source_word: sterilis
  choice: estéril
  rationale: Equivalente direto, natural e digno para a incapacidade de gerar filhos no contexto.
- source_word: non peperi
  choice: não dei à luz
  rationale: Traduz diretamente o verbo parere, que se refere a dar à luz, sem acrescentar “filho”, ausente do texto latino.
- source_word: habens maritum annis triginta
  choice: embora tivesse marido durante trinta anos
  rationale: Expressa em português natural a circunstância concessiva implícita no particípio latino e mantém a duração de trinta anos.
