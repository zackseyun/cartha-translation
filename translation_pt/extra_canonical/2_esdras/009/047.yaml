lexical_decisions:
- source_word: venissem accipere illi uxorem
  choice: chegou o momento de eu lhe arranjar uma esposa
  rationale: A expressão latina indica que a narradora chegou à ocasião de tomar ou providenciar uma esposa para o filho. Esta formulação comunica naturalmente o sentido matrimonial em português sem sugerir que ela própria se casaria com a mulher.
- source_word: feci diem epuli
  choice: preparei um dia de festa
  rationale: Reproduz a ideia de dedicar ou realizar um dia de banquete, em linguagem portuguesa clara e digna.
