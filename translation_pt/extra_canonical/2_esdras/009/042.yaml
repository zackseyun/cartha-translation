  text: And I said to her[a], “What has happened to you? Tell me.” And she said to me,
translation:
  language: pt
  text: 'E eu lhe disse: “O que você sofreu? Diga-me.” E ela me disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid passa es
  choice: O que aconteceu com você?
  rationale: A expressão latina pergunta pelo que a mulher sofreu ou pelo que lhe ocorreu. Esta formulação é natural em português, mantém a referência feminina pelo contexto e não especifica uma causa que o texto não declara.
- source_word: et dixi ei
  choice: E eu lhe disse
  rationale: Preserva o et inicial e a construção paratática do texto latino, sem tornar a frase artificial em português.
- source_word: Et dixit ad me
  choice: E ela me disse
  rationale: Inclui a oração final presente no versículo e explicita naturalmente em português que o sujeito feminino é a mulher mencionada.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A repetição de “E” foi mantida para refletir a coordenação simples do original. O versículo termina com dois-pontos porque introduz a fala que vem em seguida.
