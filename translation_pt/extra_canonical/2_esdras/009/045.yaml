source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female slave, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: pt
  text: E aconteceu que, depois de trinta anos, Deus me ouviu, a tua escrava, viu a minha humilhação, atentou para a minha aflição e me deu um filho. Eu, meu marido e todos os meus concidadãos nos alegramos muito por causa dele, e honrávamos muito o Poderoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ancillae tuae
  choice: a tua serva
  rationale: Entendido como expressão em aposição a “me”, refletindo a construção subjacente preservada de modo irregular no latim; “serva” comunica a condição feminina sem a aspereza potencialmente excessiva de “escrava” neste contexto.
- source_word: pervidit humilitatem meam
  choice: viu a minha humilhação
  rationale: Mantém a imagem e a possível dimensão social de humilitas, sem restringi-la a humildade interior.
- source_word: adtendit tribulationi meae
  choice: atentou para a minha aflição
  rationale: Reproduz a ideia de atenção favorável à situação angustiante da mulher em português natural.
- source_word: cives mei
  choice: meus concidadãos
  rationale: Preserva a referência cívica explícita do latim, em vez de generalizar como vizinhos ou conhecidos.
- source_word: Fortem
  choice: o Poderoso
  rationale: Título divino substantivado que conserva a ênfase na força de Deus e o tom solene do original.
theological_decisions:
- issue: Relação sintática de “Deus ancillae tuae”
  choice: “Deus me ouviu, a tua serva”
  alternative: “o Deus da tua serva me ouviu”
  rationale: O acusativo latino “me” e a provável tradução literal de uma construção grega favorecem “a tua serva” como aposição à narradora; a alternativa é gramaticalmente possível na superfície latina, mas provavelmente resulta de interpretar como latim comum uma forma de tradução.
- issue: Título divino “Fortem”
  choice: “o Poderoso”
  alternative: “o Forte”
  rationale: “O Poderoso” funciona de maneira mais natural como título divino em português, sem acrescentar uma identificação teológica ausente do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi levemente ajustada na segunda frase para evitar a construção latina rígida “eu e meu marido”, preservando todos os participantes e a ação coletiva.
