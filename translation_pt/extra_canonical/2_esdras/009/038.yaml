review_pass:
  verdict: revise
  source_fidelity: O texto transmite corretamente a fala interior, a mulher à direita, o luto audível, a dor interior, as vestes rasgadas e as cinzas. Contudo, «ergui os olhos» introduz um movimento para cima que não está expresso no latim («respexi oculis meis»); basta «olhei e vi».
  naturalness: A redação é clara, moderna e de registro apropriado. «Eis que» preserva de modo natural a ênfase narrativa de «et ecce».
  terminology: «Em meu coração», «à direita», «em alta voz», «vestes rasgadas» e «cinzas sobre sua cabeça» são escolhas adequadas. «Profundamente aflita no íntimo» preserva a dor intensa de «animo dolebat valde» sem impor uma leitura técnica de animus.
  issues:
  - severity: low
    issue: «Ergui os olhos» acrescenta uma direção vertical.
    rationale: O latim diz apenas que o narrador olhou com os próprios olhos; não especifica que olhou para cima. Embora o audit trail inglês use “looked up”, a fonte latina deve ter prioridade.
