  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: pt
  text: então você entenderá que este é o tempo em que o Altíssimo começará a intervir no mundo que foi feito por ele[a]. E, quando se vir no mundo um abalo de lugares,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “visitar o mundo”.
    reason: Preserva o sentido lexical direto de uisitare e sua ressonância bíblica, enquanto o texto principal comunica sua força contextual em português atual.
lexical_decisions:
- source_word: uisitare
  choice: intervir
  rationale: No contexto apocalíptico, o verbo indica a atuação decisiva do Altíssimo, possivelmente em juízo; “intervir” comunica essa força melhor do que o uso corrente de “visitar”, enquanto a nota preserva a forma mais literal.
- source_word: saeculum
  choice: mundo
  rationale: Neste contexto, refere-se ao mundo ou ordem criada, não simplesmente a uma duração ou era.
- source_word: motio locorum
  choice: abalo de lugares
  rationale: Mantém a formulação ampla e algo incomum do latim, sem restringi-la explicitamente a terremotos nem acrescentar que se trata de muitos ou diversos lugares.
- source_word: qui ab eo factus est
  choice: que foi feito por ele
  rationale: Reproduz a construção passiva e a referência explícita ao Altíssimo, preservando a redação tradicional da cláusula.
theological_decisions:
- issue: Sentido da visitação divina
  choice: intervir no mundo
  alternative: visitar o mundo
  rationale: “Intervir” expressa a ação divina ativa e escatológica sugerida por uisitare, sem definir se a ação é exclusivamente juízo ou também inspeção e cuidado; a alternativa literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com “você” para a segunda pessoa singular. A vírgula final preserva o caráter incompleto da oração, que continua no versículo seguinte. A expressão deliberadamente incomum “abalo de lugares” conserva a ambiguidade do latim.
