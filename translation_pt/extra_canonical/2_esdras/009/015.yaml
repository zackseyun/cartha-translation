  text: olim locutus sum et nunc dico et postea dicam, quoniam plures suntqui pereunt quam qui salvabuntur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/015.yaml
  text: '“I have spoken before[a], and now I say, and I will say afterward: many more perish than will be saved,'
translation:
  language: pt
  text: '“Já falei antes, agora digo e depois direi: são mais numerosos os que perecem do que os que serão salvos,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: olim locutus sum
  choice: Já falei antes
  rationale: Preserva o aspecto perfeito de locutus sum e o sentido temporal de olim, em português natural.
- source_word: nunc dico et postea dicam
  choice: agora digo e depois direi
  rationale: Mantém a mudança lexical de loquor para dico e reproduz com clareza o contraste temporal entre o presente e o futuro.
- source_word: plures sunt qui pereunt
  choice: são mais numerosos os que perecem
  rationale: Expressa explicitamente a comparação quantitativa de plures sunt sem transformar o presente pereunt em futuro.
- source_word: qui salvabuntur
  choice: os que serão salvos
  rationale: Conserva o futuro passivo latino e evita especificar o agente da salvação, que não é nomeado no texto.
theological_decisions:
- issue: Contraste entre os que perecem e os que serão salvos
  choice: Manter a afirmação comparativa sem explicação adicional
  alternative: Atenuar a comparação ou explicar quem perece e quem é salvo
  rationale: O versículo faz uma afirmação quantitativa forte, mas não explicita aqui suas causas, seu alcance nem os grupos envolvidos; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a cadência solene da declaração e a distinção entre falar anteriormente, dizer agora e dizer depois.
