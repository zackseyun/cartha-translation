  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: pt
  text: será poupado dos perigos anunciados[a] e verá a minha salvação na minha terra e dentro das minhas fronteiras, que consagrei para mim desde tempos antigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobreviverá aos perigos anunciados”.'
    reason: Registra uma tradução contextual possível de relinquetur de, cujo sentido literal é permanecer ou ser deixado depois de um perigo.
lexical_decisions:
- source_word: relinquetur de praedictis periculis
  choice: será poupado dos perigos anunciados
  rationale: O passivo latino exprime a ideia de alguém ser deixado a salvo ou permanecer depois dos perigos preditos. A formulação escolhida conserva o valor passivo e soa natural em português.
- source_word: salutare meum
  choice: a minha salvação
  rationale: Equivalente direto que preserva a ação salvadora atribuída ao próprio Deus.
- source_word: in terra mea et in finibus meis
  choice: na minha terra e dentro das minhas fronteiras
  rationale: Mantém a distinção entre terra e limites territoriais, com sintaxe corrente em português.
- source_word: sanctificavi mihi
  choice: consagrei para mim
  rationale: “Consagrar” comunica aqui a separação da terra e das fronteiras para Deus, sem sugerir apenas purificação moral.
- source_word: a saeculo
  choice: desde tempos antigos
  rationale: Expressa a antiguidade indefinida do latim sem impor o sentido mais forte de eternidade absoluta.
theological_decisions:
- issue: Natureza do livramento expresso por relinquetur
  choice: será poupado
  alternative: sobreviverá
  rationale: A escolha conserva a forma passiva do latim e apresenta o livramento como algo recebido, enquanto a nota registra a leitura contextual de sobrevivência.
- issue: Alcance temporal de a saeculo
  choice: desde tempos antigos
  alternative: desde a eternidade
  rationale: O latim pode ter força ampla, mas neste contexto a formulação menos determinada preserva a ambiguidade e evita afirmar explicitamente eternidade absoluta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O fragmento começa no meio de uma frase; por isso, mantém-se a inicial minúscula, como no texto fornecido.
