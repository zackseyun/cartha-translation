  yaml_path: translation/extra_canonical/2_esdras/009/020.yaml
  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: pt
  text: Considerei o meu mundo, e eis que estava perdido; e a minha terra, e eis que corria perigo por causa dos desígnios que nela surgiram. Eu vi e, com dificuldade, poupei-os.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Eu vi e poupei-lhes com dificuldade”. O referente de “lhes” (latim eis) não está explícito no trecho latino preservado; pode referir-se aos habitantes da terra.'
    reason: Preserva no texto principal a indeterminação do pronome latino e informa, sem a impor, a identificação contextual provável.
lexical_decisions:
- source_word: orbem meum
  choice: a terra que me pertence
  rationale: Distingue este segundo objeto de “meu mundo” no primeiro membro, seguindo a estrutura refletida pelo texto latino e pela camada inglesa, sem recorrer ao pouco natural “meu orbe”.
- source_word: cogitationes
  choice: planos
  rationale: O latim pode indicar pensamentos, intenções ou maquinações. “Planos” conserva a ideia de projetos concebidos e funciona naturalmente como causa do perigo.
- source_word: peperci eis uix
  choice: com dificuldade, poupei seus habitantes
  rationale: “Com dificuldade” traduz uix neste contexto; “seus habitantes” explicita o referente humano do pronome latino eis, que ficaria pouco claro em português após substantivos singulares.
theological_decisions:
- issue: Referente de eis em “peperci eis”
  choice: seus habitantes, com nota sobre a forma literal
  alternative: poupei-os / poupei a ambos
  rationale: O verbo latino parco normalmente toma pessoas ou seres vivos como objeto. O referente explícito não aparece com clareza no trecho fornecido; a tradução torna inteligível a provável referência aos habitantes sem apresentá-la como textualmente incontestável.
- issue: Força de uix
  choice: com dificuldade
  alternative: mal / por pouco
  rationale: A expressão pode indicar dificuldade ou escassez. Aqui, junto de “poupei”, “com dificuldade” preserva a tensão de uma misericórdia concedida a custo, sem definir uma razão teológica não declarada.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. “E eis que” mantém o tom visionário e a repetição retórica do latim; o paralelismo entre as duas avaliações do mundo foi preservado. O início do texto latino fornecido parece estar truncado (“erat perditum”), por isso a primeira oração segue a estrutura atestada pela camada inglesa auditada, enquanto a cláusula final “Et uidi et peperci eis uix”, omitida nessa camada, foi restaurada.
