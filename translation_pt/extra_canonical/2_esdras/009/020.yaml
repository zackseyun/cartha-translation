  rationale: A revisão conserva a cláusula final atestada no latim e substitui uma explicitação interpretativa por um pronome plural, preservando a ambiguidade do original. Também simplifica o possessivo e usa «desígnios» para cogitationes, mantendo a amplitude semântica e o tom solene.
