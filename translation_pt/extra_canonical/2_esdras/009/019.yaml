source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hoc parato et mensa indeficienti et lege inuestigabili, corrupti sunt moribus eorum. Et consideraui saeculum meum et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: pt
  text: Mas os que foram criados neste mundo preparado, com uma mesa inesgotável e uma lei insondável[a], corromperam-se em seus costumes. Considerei a minha era, e eis que...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção latina referente a “uma mesa inesgotável e uma lei insondável” é difícil. O sentido parece ser que a humanidade já tinha diante de si plena provisão e instrução divina, mas ainda assim se corrompeu em seus costumes.
    reason: textual_variant
lexical_decisions:
- source_word: mensa indeficienti
  choice: uma mesa inesgotável
  rationale: Preserva a imagem concreta da mesa e traduz indeficiens como provisão que não se esgota, sem explicar a metáfora no corpo do texto.
- source_word: lege inuestigabili
  choice: uma lei insondável
  rationale: Mantém a ideia de uma lei que não pode ser plenamente perscrutada, evitando reduzi-la simplesmente a 'instrução'.
- source_word: corrupti sunt moribus eorum
  choice: corromperam-se em seus costumes
  rationale: Reproduz a dimensão moral de moribus e a formulação reflexiva natural em português, sem especificar além do latim como ocorreu a corrupção.
- source_word: saeculum meum
  choice: a minha era
  rationale: Neste contexto, saeculum designa a época ou geração contemplada pelo personagem, não necessariamente o mundo físico.
- source_word: ecce
  choice: e eis que
  rationale: Conserva a fórmula de apresentação e a expectativa deliberadamente deixada em aberto no fim do versículo.
theological_decisions:
- issue: Relação entre a provisão divina, a lei e a corrupção humana
  choice: Manter as três ideias lado a lado sem explicitar uma relação causal
  alternative: Traduzir de modo explicativo, dizendo que a humanidade se corrompeu apesar de receber provisão e instrução divinas
  rationale: O latim justapõe a mesa, a lei e a corrupção, mas não formula expressamente a concessão causal ou adversativa; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A imagem da “mesa” e a descrição da lei como “insondável” foram preservadas, enquanto a nota registra a dificuldade da construção latina. As reticências indicam que “e eis que” introduz uma continuação no versículo seguinte.
