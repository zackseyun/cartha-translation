  verdict: revise
  source_fidelity: 'A tradução transmite corretamente o contraste entre o destino dos ímpios e a salvação dos justos, bem como as perguntas sobre a era. Contudo, «quando virá» especifica uma vinda da era que o latim não exprime: quando permanece elíptico e seu referente verbal não é explicitado.'
  naturalness: O texto é claro e de registro apropriado. A formulação paralela «de quem é a era, em favor de quem é a era e quando» mantém a construção deliberadamente incompleta do original sem perder inteligibilidade em português.
  terminology: «Ímpios», «atormentados», «justos», «salvos» e «era» são escolhas adequadas. «Em favor de quem» exprime propter quos sem transformar a pergunta em uma afirmação sobre a existência da era.
  issues:
