id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: pt
  text: Portanto, não tenha mais curiosidade de saber como os ímpios serão atormentados, mas procure saber como os justos serão salvos, de quem é a era, em favor de quem é a era e quando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli curiosus esse
  choice: não continue querendo saber
  rationale: Expressa em português natural a proibição de uma curiosidade especulativa, sem introduzir conotação positiva de investigação cuidadosa.
- source_word: impii
  choice: ímpios
  rationale: Equivalente tradicional, claro e teologicamente não sectário para os que agem sem reverência ou justiça.
- source_word: cruciabuntur
  choice: serão atormentados
  rationale: Preserva o sentido passivo futuro de sofrimento ou tormento.
- source_word: inquire
  choice: procure saber
  rationale: Mantém o contraste com a curiosidade proibida e soa natural para uma investigação legítima.
- source_word: iusti
  choice: justos
  rationale: Conserva a categoria moral e teológica do latim sem explicá-la além do texto.
- source_word: saeculum
  choice: era
  rationale: Aqui designa a era ou ordem temporal em questão; evita restringir o termo a 'mundo' ou a um período literal de cem anos.
- source_word: quando
  choice: quando virá
  rationale: O verbo elíptico é suprido em português para tornar a sequência inteligível; o contexto aponta para a vinda da era.
theological_decisions:
- issue: Identidade e finalidade da era
  choice: de quem é a era, por causa de quem ela existe
  alternative: a quem pertence o mundo e para quem o mundo foi feito
  rationale: Preserva as duas perguntas distintas do latim — pertencimento e finalidade — sem identificar explicitamente seus referentes nem substituir saeculum por 'mundo'.
- issue: Modo de salvação dos justos
  choice: como os justos serão salvos
  alternative: como os justos se salvarão
  rationale: A forma passiva acompanha salvabuntur e não determina no texto quem realiza a salvação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe suavemente formal. A repetição de 'era' é parcialmente reduzida por 'ela', sem apagar a progressão das perguntas. Nenhum marcador de nota é necessário.
