    issue: «quando virá» acrescenta uma noção de vinda.
    rationale: O texto latino termina simplesmente com et quando (“e quando”), sem verbo expresso. Embora o contexto possa levar leitores a pensar na vinda de uma era, essa explicitação direcional não está presente no versículo e reduz sua elipse.
  - severity: low
    issue: «por causa de quem ela existe» torna explícita a existência da era.
    rationale: propter quos saeculum pergunta em favor de quem é a era; «ela existe» é uma paráfrase interpretativa e evita a repetição que estrutura as perguntas no latim.
  revised_text: Portanto, não tenha mais curiosidade de saber como os ímpios serão atormentados, mas procure saber como os justos serão salvos, de quem é a era, em favor de quem é a era e quando.
