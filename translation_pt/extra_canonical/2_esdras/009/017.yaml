id: 2ES.9.17
reference: 2 Esdras 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: pt
  text: “Tal como é o campo, assim são as sementes; tal como são as flores, assim são as cores; tal como é a obra, assim é a criação; e tal como é o agricultor, assim é a eira. Pois havia um tempo da era[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois era o tempo da era”.'
    reason: O latim tempus erat saeculi pode ser entendido de modo existencial (“havia um tempo”) ou definido (“era o tempo”); a continuação temporal no versículo seguinte deve permanecer aberta.
lexical_decisions:
- source_word: qualis ... talia / quales ... tales
  choice: tal como ... assim
  rationale: Reproduz de forma natural em português a correlação comparativa repetida do latim.
- source_word: tincturae
  choice: cores
  rationale: No paralelismo com flores, “cores” comunica o sentido contextual de tonalidades ou colorações sem restringi-lo a tinturas artificiais.
- source_word: opera
  choice: obra
  rationale: Mantém o singular e a relação direta com “criação”, sem especificar indevidamente agente ou processo.
- source_word: agricola
  choice: agricultor
  rationale: Equivalente corrente e digno para quem cultiva a terra.
- source_word: area
  choice: eira
  rationale: Designa precisamente o espaço em que os grãos eram debulhados, preservando a imagem agrícola.
- source_word: saeculi
  choice: da era
  rationale: Preserva o sentido temporal amplo de saeculum neste contexto apocalíptico, em vez de reduzi-lo a “mundo” ou “século” cronológico.
theological_decisions:
- issue: Relação entre o agricultor e a eira
  choice: tal como é o agricultor, assim é a eira
  alternative: como é o lavrador, assim é a colheita
  rationale: Mantém a imagem concreta e a tensão do texto latino, sem trocar “eira” por uma interpretação como “colheita”.
- issue: Construção tempus erat saeculi
  choice: havia um tempo da era
  alternative: era o tempo da era
  rationale: O latim sem artigo admite leitura existencial ou definida. A tradução principal segue a leitura existencial refletida pela revisão auditada, enquanto a nota registra a alternativa formalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com repetição deliberada para preservar a estrutura proverbial. Não se incluiu “Ele me respondeu e disse”, pois essas palavras não constam do texto latino fornecido. A vírgula final conserva a continuidade sintática com o versículo seguinte.
