  source_fidelity: A tradução preserva com precisão o paralelismo correlativo de qualis/quales ... talis/talia/tales, bem como os substantivos agrícolas e a formulação aberta de quoniam tempus erat saeculi. A ausência de “Ele me respondeu e disse” é correta, pois essa introdução não consta do trecho latino fornecido. A vírgula final e o fechamento das aspas mantêm adequadamente a ligação sintática com o versículo seguinte.
  naturalness: O português é moderno, claro e de registro proverbial apropriado. “Tal como ... assim ...” reproduz a repetição do original sem se tornar artificial. “Eira” é um termo preciso, compreensível no contexto e condizente com a imagem agrícola.
  terminology: “Cores” comunica adequadamente tincturae no paralelismo com “flores”; “obra” e “criação” preservam a distinção do latim; “agricultor” e “eira” mantêm a imagem concreta. “Era” para saeculi conserva o alcance temporal apocalíptico sem impor a opção interpretativa “mundo”. A nota registra de maneira útil, sem doutrinarismo, a alternativa sintática para tempus erat saeculi.
