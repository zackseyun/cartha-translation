  text: domus non est aedificata, et manduca solummodo de floribus campi, et carnem non gustabis et uinum non bibes, sed solummodo flores—Et deprecare altissimum sine intermissione, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: pt
  text: Vá para um campo onde nenhuma casa tenha sido construída e coma somente as flores do campo. Não prove carne nem beba vinho, mas apenas flores. Ore ao Altíssimo sem cessar, e
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: floribus campi / flores
  choice: flores do campo / flores
  rationale: Preserva a imagem incomum e concreta do latim, sem substituí-la por uma expressão interpretativa como “plantas” ou “alimentos do campo”.
- source_word: deprecare
  choice: ore
  rationale: Expressa em português corrente o ato de dirigir uma súplica a Deus; o complemento “ao Altíssimo” mantém o destinatário explícito.
- source_word: sine intermissione
  choice: sem cessar
  rationale: Formulação natural e digna que transmite a continuidade enfática do latim.
theological_decisions:
- issue: Sentido da abstinência prescrita
  choice: Manter literalmente a proibição de carne e vinho e a alimentação com flores
  alternative: Generalizar como jejum ou dieta ascética
  rationale: O texto especifica práticas concretas; generalizá-las introduziria uma interpretação teológica não expressa na fonte.
- issue: Título divino altissimum
  choice: Altíssimo
  alternative: Deus Altíssimo
  rationale: O latim usa o título substantivado sem acrescentar “Deus”; “o Altíssimo” é claro e tradicional em português.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos. A conjunção final “e” foi preservada porque o versículo termina no meio da frase e continua no contexto seguinte.
