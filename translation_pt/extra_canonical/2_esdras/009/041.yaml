  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: pt
  text: 'Ela me disse: “Deixa-me, meu senhor, para que eu chore por mim mesma e aumente a minha dor, pois estou com o espírito profundamente amargurado e muito humilhada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: Deixa-me
  rationale: Reproduz de modo direto o pedido para que o interlocutor a deixe, sem acrescentar “sozinha”, ausente do latim.
- source_word: ut defleam me
  choice: para que eu chore por mim mesma
  rationale: Mantém o sentido de lamentação pessoal de defleam e o pronome reflexivo me, em português natural.
- source_word: adiciam dolorem
  choice: aumente a minha dor
  rationale: Expressa literalmente a ideia de acrescentar ou intensificar a dor, com formulação idiomática em português.
- source_word: valde amara sum animo
  choice: estou com o espírito profundamente amargurado
  rationale: Animo indica o âmbito interior, e amara descreve intensa amargura; a construção escolhida preserva ambos com naturalidade.
- source_word: humiliata sum valde
  choice: muito humilhada
  rationale: Conserva a correspondência lexical com humiliata e a intensidade de valde, sem interpretar além do texto.
