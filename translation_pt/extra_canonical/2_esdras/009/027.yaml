  rationale: Neste contexto, fenum designa a vegetação ou grama sobre a qual Esdras se deita; «relva» mantém o sentido concreto em português corrente e digno.
- source_word: iterum
  choice: novamente
  rationale: Traduz diretamente o advérbio latino sem acrescentar o predicado ausente no fragmento.
theological_decisions:
- issue: Predicado ausente depois de «meu coração novamente»
  choice: Preservar a frase incompleta com reticências e nota
  alternative: Completar com «ficou perturbado, como antes»
  rationale: O texto latino fornecido termina em iterum e não contém verbo ou complemento que autorize essa explicitação; preservar a lacuna evita importar uma interpretação contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A abertura «Depois de sete dias» segue o sentido temporal refletido pela tradição textual consultada; a interrupção final é preservada por fidelidade ao fragmento latino.
