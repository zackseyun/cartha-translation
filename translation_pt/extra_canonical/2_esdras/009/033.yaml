base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: pt
  text: Pois os que a receberam pereceram[a], porque não guardaram o que havia sido semeado neles. E eis que é costume que, quando a terra tiver recebido semente,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas os que a receberam pereceram”.'
    reason: Registra a tradução adversativa anterior, embora o valor explicativo de «Nam» no contexto favoreça «Pois».
lexical_decisions:
- source_word: acceperunt
  choice: a receberam
  rationale: Mantém o pronome feminino implícito que retoma a lei no contexto anterior, sem repetir ou explicitar além do texto.
- source_word: perierunt
  choice: pereceram
  rationale: Reproduz de modo direto e digno a ideia de ruína ou morte expressa pelo latim.
- source_word: non custodientes
  choice: porque não guardaram
  rationale: Expressa o valor causal do particípio no contexto e conserva a imagem de guardar fielmente o que foi recebido.
- source_word: quod in eis seminatum fuerat
  choice: o que havia sido semeado neles
  rationale: Preserva tanto a metáfora da semeadura quanto a anterioridade indicada pelo mais-que-perfeito passivo.
- source_word: consuetudo est
  choice: é costume
  rationale: Equivalência natural e próxima do latim, introduzindo uma prática ou processo habitual.
- source_word: cum acceperit terra semen
  choice: quando a terra recebe a semente
  rationale: Em uma afirmação geral, o presente em português comunica naturalmente a situação habitual expressa por cum com o perfeito do subjuntivo latino.
theological_decisions:
- issue: Relação lógica com o versículo anterior
  choice: Pois
  alternative: Mas
  rationale: O contexto textual preserva o latim “Nam qui”, que apresenta a perdição dos receptores como explicação de por que o fruto da lei não pereceu; a nota registra a leitura adversativa anterior sem apagar a conexão principal.
- issue: Referente do pronome em “a receberam”
  choice: Manter o pronome sem explicitar o referente
  alternative: Explicitar “receberam a lei”
  rationale: O feminino é recuperável pelo contexto, e não explicitar “a lei” evita acrescentar ao versículo uma expressão que não aparece nesta cláusula latina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a frase incompleta no fim porque o versículo continua no seguinte; “e eis que” mantém o tom discursivo do latim sem excessiva arcaização.
