  register: Português atual, claro e digno. A tradução mantém a estrutura elíptica do trecho latino fornecido, que começa com uma alternativa (“ou”) e termina com outra alternativa incompleta (“ou”); as reticências sinalizam essa interrupção textual sem completar o sentido por conjectura. Não foi incorporado o material inicial da consulta inglesa que não aparece no texto latino apresentado.
