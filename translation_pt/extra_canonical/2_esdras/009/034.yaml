  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: pt
  text: ou um navio, o mar, ou qualquer outro recipiente, alimentos ou bebidas; e, quando acontecer que seja destruído o que foi semeado, ou o que foi lançado, ou…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas aliud
  choice: qualquer outro recipiente
  rationale: Preserva explicitamente aliud (“outro”) e verte uas pelo termo corrente “recipiente”, adequado a alimentos e bebidas.
- source_word: exterminetur
  choice: ser destruído
  rationale: No contexto, o verbo indica que aquilo que foi confiado a um receptáculo vem a perecer ou ser arruinado; “ser destruído” mantém a força do latim.
- source_word: missum est
  choice: foi lançado
  rationale: Pode aludir ao navio posto ou lançado ao mar. “Lançado” conserva essa imagem sem restringir o verbo a “enviado”.
