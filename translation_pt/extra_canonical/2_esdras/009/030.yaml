lexical_decisions:
- source_word: dicens dixisti
  choice: disseste, dizendo
  rationale: Preserva a expressão verbal duplicada do latim e o provável pleonasmo semítico, mas em ordem compreensível no português atual.
- source_word: Tu Israel audi me
  choice: Ouve-me, ó Israel
  rationale: Reproduz o imperativo e deixa claro que ‘Israel’ é vocativo; o pronome latino enfático não precisa ser expresso separadamente em português.
- source_word: semen
  choice: descendência
  rationale: Neste vocativo coletivo, ‘descendência’ comunica naturalmente o sentido de linhagem ou posteridade, sem a possível leitura biológica restrita de ‘semente’.
