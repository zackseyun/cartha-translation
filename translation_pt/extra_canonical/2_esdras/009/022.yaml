source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seruietur acinus meus et plantatio mea, quia cum multo labore perfeci haec. Tu autem si adhuc intermittas septem dies alios—
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: pt
  text: Que meu cacho de uvas e minha plantação sejam preservados, pois foi com muito trabalho que realizei estas coisas. Mas, se ainda esperares mais sete dias—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruietur
  choice: sejam preservados
  rationale: No contexto, a forma é entendida no sentido de serem conservados ou poupados; a concordância plural em português abrange “meu cacho de uvas e minha plantação”.
- source_word: acinus meus
  choice: meu cacho de uvas
  rationale: Embora acinus possa designar uma uva individual ou o fruto da videira, “cacho de uvas” comunica de modo natural a imagem agrícola em português sem recorrer ao pouco claro “minha uva”.
- source_word: plantatio mea
  choice: minha plantação
  rationale: Equivalente direto e natural, preservando a metáfora de cultivo.
- source_word: cum multo labore
  choice: com muito trabalho
  rationale: Mantém a ênfase explícita no grande esforço empregado.
- source_word: perfeci haec
  choice: realizei estas coisas
  rationale: Perfeci indica levar a cabo ou concluir; “realizei” evita a possível ideia de perfeição moral e preserva o objeto plural haec.
- source_word: intermittas
  choice: esperares
  rationale: Aqui indica deixar transcorrer ou conceder um intervalo adicional; “esperares” é natural no contexto temporal, embora “deixares passar” também seja possível.
