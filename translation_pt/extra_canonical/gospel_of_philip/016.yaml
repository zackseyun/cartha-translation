translation:
  language: pt
  text: 'O mundo é cultivado por meio de quatro coisas. A colheita é recolhida nos celeiros por meio da água, da terra, do vento e da luz. Do mesmo modo, Deus também cultiva por meio de quatro coisas: a fé, a esperança, o amor e o conhecimento. Nossa terra é a fé na qual estamos enraizados. [E] a [água] é a esperança pela qual [somos] nutridos. O vento é o amor pelo qual crescemos. E a luz [é] o conhecimento pelo qual [amadurecemos]. A graça existe em [quatro formas. Ela é] terrena, é [celestial, …] o céu do céu […] por meio de […]. Bem-aventurado aquele que não tem […] uma alma. Esse é Jesus Cristo. Ele foi por toda parte e não foi um peso para ninguém. Portanto, bem-aventurado quem é assim: é uma pessoa perfeita, pois a Palavra nos fala de como é difícil perseverar. Como poderemos alcançar algo tão grandioso? Como ele dará descanso a todos? Antes de tudo, não é certo causar tristeza a ninguém — seja grande ou pequeno, sem fé ou fiel — e depois dar descanso aos que já estão em descanso
    entre os que vivem bem. Há alguns que se beneficiam ao dar descanso a quem vive bem. Quem faz o bem não consegue dar-lhes descanso, pois não pode simplesmente fazer tudo o que quer; não pode causar tristeza, porque não pode causar aflição. Às vezes, porém, quem vive bem lhe causa tristeza. Essa pessoa não é assim; é a própria maldade deles que lhes causa tristeza. Quem possui a natureza [da pessoa perfeita][a] dá alegria a quem é bom, mas alguns ficam profundamente tristes por causa disso.


    Um chefe de família adquiriu de tudo: filhos, escravos, gado, cães, porcos, trigo [ou] cevada, palha, feno, […] carne e bolotas. [Mas ele é] sábio e sabe o que dar de comer a cada [um]. Aos filhos serviu pão […] mas [… aos] escravos serviu […]; ao gado [jogou cevada], palha e feno; aos cães jogou ossos [e] aos [porcos], bolotas e lavagem. Assim também acontece com o discípulo de Deus. Se for sábio, compreenderá o que significa ser discípulo. As formas corporais não o enganarão; antes, observará a condição da alma de cada um e falará com cada pessoa de acordo com ela. Há no mundo muitos animais feitos em forma humana. O discípulo os reconhece. Aos porcos jogará bolotas; ao gado, cevada com palha e feno; aos cães, ossos; aos escravos dará a entrada da refeição; e aos filhos, o alimento perfeito.[b]


    Há o Filho da Humanidade e há o filho do Filho da Humanidade.[c] O Senhor é o Filho da Humanidade, e o filho do Filho da Humanidade é aquele que cria por meio do Filho da Humanidade. O Filho da Humanidade recebeu de Deus a capacidade de criar. Ele também tem a capacidade de gerar. Quem recebeu a capacidade de criar é criatura; quem recebeu a capacidade de gerar é gerado. Quem cria não pode gerar; quem gera pode criar. Dizem: “Quem cria gera”. Mas aquilo que ele gera é criatura. [Portanto], os que ele gera não são seus filhos, mas são […]. Quem cria trabalha [publicamente] e ele mesmo é [revelado]. Quem gera, gera [em segredo], e ele está oculto […] a imagem. [Novamente], quem [cria, cria] publicamente, mas quem gera [gera] filhos em segredo.


    Ninguém [poderá] saber [quando o marido] e a esposa têm intimidade um com o outro, a não ser eles mesmos, pois o casamento deste mundo é um mistério para os que se casaram. Se o casamento impuro permanece oculto, quanto mais o casamento puro é um verdadeiro mistério! Ele não é carnal, mas puro. Não procede do desejo, mas da vontade. Não pertence às trevas nem à noite, mas ao dia e à luz. Se um casamento é exposto à nudez, torna-se obscenidade[d] — não somente se a noiva recebe a semente de outro homem, mas até se ela sai do aposento nupcial e é vista, comete adultério. Que ela se revele a seu pai, a sua mãe, ao amigo do noivo e aos filhos do noivo. A eles é permitido entrar todos os dias no aposento nupcial. Quanto aos outros, que desejem apenas ouvir a voz dela e desfrutar de seu perfume; e, como cães, que comam as migalhas que caem da mesa. Noivos e noivas pertencem ao aposento nupcial. Ninguém poderá ver o noivo e a noiva, a menos que [se torne] como eles.


    [a] O manuscrito apresenta uma formulação elíptica; as palavras entre colchetes explicitam o referente provável sem ocultar a incerteza.

    [b] “Alimento” é acrescentado para completar em português o adjetivo substantivado “perfeito”, mantendo a metáfora da distribuição de comida.

    [c] “Filho da Humanidade” preserva a formulação distintiva da testemunha, em vez de normalizá-la automaticamente como “Filho do Homem”.

    [d] Ou: “exibição indecente”. O termo da testemunha inglesa é forte e descreve a exposição pública da intimidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito apresenta uma formulação elíptica; as palavras entre colchetes explicitam o referente provável sem ocultar a incerteza.
    reason: Sinalizar uma explicitação editorial em passagem sintaticamente obscura.
  - marker: b
    text: “Alimento” é acrescentado para completar em português o adjetivo substantivado “perfeito”, mantendo a metáfora da distribuição de comida.
    reason: Explicar o complemento necessário à fluência portuguesa.
  - marker: c
    text: “Filho da Humanidade” preserva a formulação distintiva da testemunha, em vez de normalizá-la automaticamente como “Filho do Homem”.
    reason: Registrar uma decisão lexical e cristológica de alta relevância.
  - marker: d
    text: 'Ou: “exibição indecente”. O termo da testemunha inglesa é forte e descreve a exposição pública da intimidade.'
    reason: Preservar a força sem impor ao texto antigo o sentido moderno estreito de “pornografia”.
lexical_decisions:
- source_word: farmed
  choice: cultivado / cultiva
  rationale: Mantém a metáfora agrícola que estrutura a passagem e soa natural em português.
- source_word: knowledge
  choice: conhecimento
  rationale: Preserva o sentido cognitivo e potencialmente espiritual sem impor o termo técnico denominacional “gnose”.
- source_word: Son of Humanity
  choice: Filho da Humanidade
  rationale: Conserva a expressão incomum da testemunha e evita harmonização não justificada com a fórmula bíblica tradicional.
- source_word: beget / begotten
  choice: gerar / gerado
  rationale: Retém a oposição conceitual entre criar e gerar, central ao argumento.
- source_word: bridal chamber
  choice: aposento nupcial
  rationale: Expressão digna e compreensível que preserva o possível peso simbólico do motivo.
- source_word: pornography
  choice: obscenidade
  rationale: Evita o anacronismo estreito do sentido comercial moderno de “pornografia”, sem enfraquecer a condenação da exposição sexual.
theological_decisions:
- issue: Identidade do “Filho da Humanidade”
  choice: Manter “Filho da Humanidade” e as relações internas exatamente como apresentadas
  alternative: Normalizar como “Filho do Homem” ou explicar como título cristológico convencional
  rationale: A passagem estabelece distinções próprias e difíceis; normalizá-las resolveria indevidamente sua tensão teológica.
- issue: Natureza do casamento puro
  choice: Preservar a linguagem de mistério, pureza, vontade, dia e luz
  alternative: Interpretar explicitamente como sacramento, união espiritual ou rito gnóstico
  rationale: O texto permite peso simbólico, mas não autoriza aqui uma identificação doutrinária única.
- issue: Linguagem sobre pessoas como animais
  choice: Traduzir diretamente a analogia e conservar seu caráter incômodo
  alternative: Suavizar como diferentes níveis de maturidade
  rationale: A suavização apagaria a retórica e a antropologia difíceis da passagem.
- issue: Trecho “não tem […] uma alma”
  choice: Conservar a lacuna sem reconstrução teológica
  alternative: Suprir uma qualidade da alma ou reinterpretar a oração
  rationale: O dano textual impede uma restauração segura.
