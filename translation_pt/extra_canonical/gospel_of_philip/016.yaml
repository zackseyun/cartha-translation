review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a estrutura, as lacunas e a maior parte das oposições da testemunha inglesa provisória. Contudo, algumas explicitações editoriais ultrapassam o que a testemunha fornece: «não tem […] uma alma» determina indevidamente o verbo danificado; «[da pessoa perfeita]» converte um parêntese interpretativo da testemunha em restauração entre colchetes; e «obscenidade» enfraquece/substitui o termo forte «pornography».'
  naturalness: O português é geralmente claro, moderno e digno. Foram ajustadas algumas construções para reduzir ambiguidades pronominais e para manter um registro natural sem eliminar a aspereza deliberada do texto.
  terminology: Mantêm-se «Filho da Humanidade», «criar/gerar», «aposento nupcial» e «conhecimento». «Pornografia» é conservado, pois é o termo explícito da testemunha de base; não se deve substituí-lo por um eufemismo interpretativo. As notas a–d deixam de ser necessárias, pois explicavam intervenções que foram removidas ou não devem ser tratadas como notas.
  issues:
  - severity: medium
    issue: Verbo lacunar convertido em «não tem»
    rationale: A testemunha diz «hasn’t […] a soul», com uma lacuna entre o auxiliar e «a soul». «não tem» preenche a lacuna com um verbo específico e muda a apresentação do dano textual.
  - severity: medium
    issue: Parêntese interpretativo convertido em restauração entre colchetes
    rationale: A testemunha traz «the nature (of the perfect person)», não uma reconstrução manuscrita. «[da pessoa perfeita]» e a nota correspondente classificam indevidamente esse material como explicitação editorial.
  - severity: medium
    issue: «Pornografia» substituída por «obscenidade»
    rationale: Embora o termo da testemunha seja moderno, a base inglesa emprega deliberadamente «pornography». «Obscenidade» é mais amplo e atenua a formulação; a revisão deve manter a palavra da testemunha sem impor uma releitura.
  - severity: low
    issue: Notas explicativas redundantes ou imprecisas
    rationale: As notas a e b explicam mudanças que não precisam ser feitas; c repete uma decisão já clara no texto; d justifica uma substituição lexical que reduz a fidelidade à testemunha.
  revised_text: 'O mundo é cultivado por meio de quatro coisas. Eles são recolhidos em celeiros por meio da água, da terra, do vento e da luz. Do mesmo modo, Deus também cultiva por meio de quatro coisas: por meio da fé, da esperança, do amor e do conhecimento. Nossa terra é a fé na qual estamos enraizados. [E] a [água] é a esperança pela qual [somos] nutridos. O vento é o amor pelo qual crescemos. E a luz [é] o conhecimento pelo qual [amadurecemos]. A graça existe em [quatro formas. Ela é] terrena, é [celestial, …] o céu do céu […] por meio de […]. Bem-aventurado aquele que não […] uma alma. Esse é Jesus Cristo. Ele foi por toda parte e não foi um peso para ninguém. Portanto, bem-aventurado quem é assim: é uma pessoa perfeita, pois a Palavra nos fala de como é difícil acompanhar. Como poderemos alcançar algo tão grandioso? Como ele dará descanso a todos? Antes de tudo, não é certo causar tristeza a ninguém — seja grande ou pequeno, sem fé ou fiel — e depois dar descanso aos que já estão
    em descanso entre os que vivem bem. Há alguns que se beneficiam ao dar descanso a quem vive bem. Quem faz o bem não consegue dar-lhes descanso, pois não pode simplesmente fazer tudo o que quer; não pode causar tristeza, porque não pode causar aflição. Às vezes, porém, quem vive bem lhes causa tristeza. Esses não são assim; é a própria maldade deles que lhes causa tristeza. Quem possui a natureza (da pessoa perfeita) dá alegria a quem é bom, mas alguns ficam profundamente tristes por causa disso.



    Um chefe de família adquiriu de tudo: filhos, escravos, gado, cães, porcos, trigo [ou] cevada, palha, feno, […] carne e bolotas. [Mas ele é] sábio e sabe o que dar de comer a cada [um]. Aos filhos serviu pão […] mas [… aos] escravos serviu […]; ao gado [jogou cevada], palha e feno; aos cães jogou ossos [e] aos [porcos], bolotas e lavagem. Assim também acontece com o discípulo de Deus. Se for sábio, compreenderá o que significa ser discípulo. As formas corporais não o enganarão; antes, observará a condição da alma de cada um e falará com cada um. Há no mundo muitos animais feitos em forma humana. O discípulo os reconhece. Aos porcos jogará bolotas; ao gado, cevada com palha e feno; aos cães, ossos; aos escravos dará o aperitivo; e aos filhos, o (alimento) perfeito.



    Há o Filho da Humanidade e há o filho do Filho da Humanidade. O Senhor é o Filho da Humanidade, e o filho do Filho da Humanidade é aquele que cria por meio do Filho da Humanidade. O Filho da Humanidade recebeu de Deus a capacidade de criar. Ele também tem a capacidade de gerar. Quem recebeu a capacidade de criar é criatura; quem recebeu a capacidade de gerar é gerado. Quem cria não pode gerar; quem gera pode criar. Dizem: “Quem cria gera”. Mas aquilo que ele gera é criatura. [Portanto], os que ele gera não são seus filhos, mas são […]. Quem cria trabalha [publicamente] e ele mesmo é [revelado]. Quem gera, gera [em segredo], e ele está oculto […] a imagem. [Novamente], quem [cria, cria] publicamente, mas quem gera [gera] filhos em segredo.



    Ninguém [poderá] saber [quando o marido] e a esposa têm intimidade um com o outro, a não ser eles mesmos, pois o casamento deste mundo é um mistério para os que se casaram. Se o casamento impuro permanece oculto, quanto mais o casamento puro é um verdadeiro mistério! Ele não é carnal, mas puro. Não procede do desejo, mas da vontade. Não pertence às trevas nem à noite, mas ao dia e à luz. Se um casamento é exposto à nudez, torna-se pornografia — não somente se a noiva recebe a semente de outro homem, mas até se ela sai do aposento nupcial e é vista, comete adultério. Que ela se mostre a seu pai, a sua mãe, ao amigo do noivo e aos filhos do noivo. A eles é permitido entrar todos os dias no aposento nupcial. Quanto aos outros, que desejem apenas ouvir a voz dela e desfrutar de seu perfume; e, como cães, que comam as migalhas que caem da mesa. Noivos e noivas pertencem ao aposento nupcial. Ninguém poderá ver o noivo e a noiva, a menos que [se torne] como eles.'
