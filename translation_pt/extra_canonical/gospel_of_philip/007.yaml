  - severity: medium
    issue: A frase manuscritariamente fragmentária sobre os que se despem nus reorganiza a sinalização de reconstrução de modo pouco transparente.
    rationale: O testemunho traz reticências e “[are]”; a tradução deve manter explicitamente a lacuna e indicar que a formulação é fragmentária, sem pretender resolver a sintaxe danificada.
  - severity: low
