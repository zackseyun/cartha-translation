translation:
  language: pt
  text: 'Aqueles que dizem que o Senhor primeiro morreu e depois ressuscitou estão errados, pois ele primeiro ressuscitou e, então, morreu. Quem não adquirir primeiro a ressurreição não morrerá. Tão certo como Deus vive, essa pessoa /morreria\![a]


    Ninguém esconderá algo grande e valioso dentro de uma coisa grande; muitas vezes, porém, alguém colocou incontáveis milhares em algo que vale apenas um centavo. Assim também acontece com a alma: algo valioso veio a existir num corpo desprezível.


    Alguns temem ressuscitar nus. Por isso, querem ressuscitar na carne e não sabem que os que vestem a [carne] estão nus. Os que […] despir-se [não estão] nus.[b] “Carne [e sangue não] herdarão o reino [de Deus].” O que é que não herdará? Aquilo que está sobre nós. E o que, por sua vez, herdará? A carne e o sangue de Jesus. Por isso, ele disse: “Quem não come a minha carne e não bebe o meu sangue não tem vida em si.” O que é a carne dele? É a Palavra; e o sangue dele é o Espírito Santo. Quem recebeu essas coisas tem comida, bebida e roupa.


    Eu, portanto, discordo também dos outros que dizem: “Ela não ressuscitará.” Ambos os lados estão errados. Você que diz: “A carne não ressuscitará”, diga-me o que ressuscitará, para que possamos honrá-lo. Você diz: “O espírito na carne e essa outra luz na carne.” Mas essa afirmação também está na carne, pois, diga o que disser, você não pode falar sem a carne. É necessário ressuscitar nesta carne, visto que tudo existe nela. Neste mundo, as pessoas são melhores do que as roupas que vestem. No reino dos céus, as roupas são melhores do que as pessoas que as vestem.


    Tudo é purificado pela água e pelo fogo: o visível pelo visível, o oculto pelo oculto. Algumas coisas estão ocultas por meio de coisas visíveis. Há água na água e fogo no crisma.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma /morreria\ preserva a sinalização incomum do testemunho inglês fornecido. A leitura e a pontuação permanecem incertas até a revisão direta do copta.
    reason: Registrar uma leitura textual anômala sem ocultá-la nem corrigi-la conjecturalmente.
  - marker: b
    text: Os colchetes e as reticências indicam texto danificado ou restaurado no manuscrito; a frase é fragmentária.
    reason: Preservar de modo transparente as lacunas e reconstruções do testemunho.
  - marker: c
    text: “Crisma” designa aqui a substância ou unção ritual; o termo específico foi mantido.
    reason: Ajudar o leitor comum sem substituir o vocábulo técnico por uma interpretação.
lexical_decisions:
- source_word: arose / resurrection
  choice: ressuscitou / ressurreição
  rationale: Mantém a repetição conceitual do testemunho e a linguagem religiosa corrente, sem explicar a aparente inversão entre ressurreição e morte.
- source_word: flesh
  choice: carne
  rationale: Preserva a polissemia e a tensão do trecho entre corpo, revestimento e a carne de Jesus.
- source_word: Word
  choice: Palavra
  rationale: Conserva o título teológico e sua identificação explícita com a carne, sem acrescentar interpretação.
- source_word: Holy Spirit
  choice: Espírito Santo
  rationale: Equivalente tradicional, claro e amplamente compreensível.
- source_word: chrism
  choice: crisma
  rationale: Mantém o termo ritual específico, em vez de reduzi-lo a óleo ou unção e eliminar sua possível carga técnica.
- source_word: clothes / clothing
  choice: roupas / roupa
  rationale: Emprega vocabulário natural em português e preserva a metáfora recorrente do revestimento.
- source_word: acquire
  choice: adquirir
  rationale: Reproduz a ideia incomum de obter a ressurreição antes da morte, sem normalizá-la teologicamente.
theological_decisions:
- issue: A afirmação de que o Senhor ressuscitou antes de morrer
  choice: Preservada literalmente
  alternative: Reformular como referência à ressurreição espiritual anterior à morte física
  rationale: O texto apresenta deliberadamente uma inversão paradoxal; explicá-la no corpo da tradução resolveria uma tensão genuína.
- issue: O referente de “Ela não ressuscitará”
  choice: Pronome feminino retomando “a carne” pelo contexto imediato
  alternative: “Isso não ressuscitará” ou “não haverá ressurreição”
  rationale: Em português, o feminino torna explícita a retomada gramatical mais provável, enquanto a frase seguinte confirma o tema da carne.
- issue: Relação entre carne e sangue comuns e os de Jesus
  choice: Mantida a contraposição textual sem harmonização
  alternative: Interpretar os primeiros exclusivamente como natureza mortal e os segundos como elementos sacramentais
  rationale: A passagem oferece sua própria leitura simbólica — Palavra e Espírito Santo — mas conserva tensão entre corpo, carne e revestimento.
- issue: “É necessário ressuscitar nesta carne”
  choice: Traduzido sem especificar se se trata do corpo presente, de uma condição encarnada ou de linguagem simbólica
  alternative: “É necessário ressuscitar enquanto estamos nesta carne”
  rationale: A formulação testemunhada é teologicamente ambígua e não deve ser resolvida por paráfrase.
- issue: Crisma
  choice: Termo técnico preservado
  alternative: “óleo da unção”
  rationale: Evita impor uma identificação ritual mais estreita do que a permitida pelo testemunho fornecido.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. Esta é uma tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta do Códice II de Nag Hammadi ainda está pendente. Colchetes, reticências e barras invertidas preservam sinais editoriais relevantes do testemunho.
