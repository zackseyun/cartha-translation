  naturalness: O português é em geral moderno, claro e apropriado ao registro. Pequenos ajustes tornam mais natural a negação correlativa (“nem bebe”) e evitam atribuir um referente feminino não expresso no testemunho.
  terminology: “ressurreição”, “carne”, “Palavra”, “Espírito Santo” e “crisma” são escolhas adequadas e coerentes. “Crisma” deve permanecer, com nota breve. A expressão parentética “(carne)” ligada a Jesus deve ser mantida, pois registra uma incerteza/sinal editorial do testemunho.
  issues:
  - severity: high
    issue: Inversão da restauração na frase fragmentária sobre despir-se.
    rationale: O rascunho diz “Os que […] despir-se [não estão] nus”, mas o testemunho fornecido diz “Those […] to strip themselves naked [are] not naked”. A inversão altera diretamente o texto transmitido.
  - severity: medium
    issue: O parêntese editorial em “Jesus' (flesh) and blood” foi omitido.
    rationale: A tradução “A carne e o sangue de Jesus” apresenta “carne” como texto seguro, embora o testemunho a marque entre parênteses. O sinal deve ser preservado.
  - severity: medium
    issue: “Ela não ressuscitará” restringe o referente de “It won't arise”.
    rationale: O testemunho usa pronome neutro e a discussão subsequente permite que a carne seja o referente provável, mas não o torna gramaticalmente explícito naquele enunciado. “Isso” preserva melhor a indeterminação.
