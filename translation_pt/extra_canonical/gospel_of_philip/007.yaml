  naturalness: O português é moderno, claro e de registro apropriado. Pequenos ajustes deixam mais natural “Eu mesmo, porém, discordo...” e evitam que a lacuna manuscrita pareça uma declaração textual plenamente segura.
  terminology: “Ressurreição”, “carne”, “Palavra”, “Espírito Santo” e “crisma” são escolhas apropriadas e coerentes. Conserva-se “(carne)” na expressão referente a Jesus para não apagar a sinalização editorial do testemunho.
  issues:
