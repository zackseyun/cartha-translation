translation:
  language: pt
  text: 'Quando Eva estava [em] Adão, a morte não existia. Quando ela se separou dele, a morte passou a existir. Se ele [entrar] novamente e a receber para si, não haverá morte.


    “[Meu] Deus, meu Deus, por que, Senhor, [me] abandonaste?” Ele disse isso na cruz, porque foi separado naquele lugar. […] que ele foi gerado por meio daquilo que […] de Deus. O […] dentre os mortos […] existe, mas […] ele é perfeito […] de carne, mas isto […] é carne verdadeira […] não é verdadeiro, [mas …] imagem do verdadeiro.


    A câmara nupcial não é para os animais, nem para os escravos, nem para os impuros, mas para pessoas livres e virgens.


    Somos gerados novamente por meio do Espírito Santo, mas somos gerados por meio de Cristo mediante duas coisas. Somos ungidos por meio do Espírito. Quando fomos gerados, fomos unidos.


    Sem luz, ninguém pode ver a si mesmo na água ou num espelho; tampouco se pode ver na luz sem água ou espelho. Por isso, é necessário ser batizado em ambos: na luz e na água. Mas a luz é o crisma.[a]


    Havia três casas de oferta em Jerusalém. A que se abre para o oeste é chamada “o Santo”. A outra, que se abre para o sul, é chamada “o Santo do Santo”. A terceira, que se abre para o leste, é chamada “o Santo dos Santos”, o lugar onde somente o sumo sacerdote entra. O batismo é a casa chamada “o Santo”. A [redenção] é “o Santo do Santo”. “O [Santo] dos Santos” é a câmara nupcial. O [batismo] inclui a ressurreição [com] a redenção. A redenção está na câmara nupcial. Mas [a] câmara nupcial é melhor do que […] Você não encontrará seu […] os que oram […] Jerusalém. […] Jerusalém que [… Jerusalém], sendo vista […] estes que são chamados “[os Santos] dos Santos” [… o] véu rasgado […] câmara nupcial, exceto a imagem [… que] [está acima. Assim,] seu véu se rasgou de alto a baixo, porque era necessário que alguns dos que estão embaixo subissem ao alto.


    Os poderes[b] não podem ver os que se revestiram da luz perfeita, nem podem prendê-los. Mas a pessoa se revestirá dessa luz no mistério da união.


    Se a mulher não tivesse sido separada do homem, ela não teria morrido com o homem. A separação dele foi o começo da morte. Por isso, Cristo veio reparar a separação que existia desde o princípio, unindo novamente os dois. Ele dará vida aos que morreram em consequência da separação, unindo-os. Ora, a esposa se une ao marido na câmara nupcial, e os que se uniram na câmara nupcial já não serão separados. Por isso Eva se separou de Adão: porque não se uniu a ele na câmara nupcial.


    Foi por meio de um sopro que a alma de Adão passou a existir. Sua companheira era o espírito. Aquilo que lhe foi dado era sua mãe. Sua alma foi [tomada], e em seu lugar foi-lhe dada [vida] (Eva).[c] Quando ele foi unido […] palavras que eram superiores aos poderes, e eles o invejaram […] companheira espiritual […] oculto […] isto é, o […] a si mesmos […] câmara nupcial para que […] Jesus apareceu [… o] Jordão, a [plenitude do reino] dos céus. Aquele que [foi gerado] antes de tudo foi gerado novamente. Aquele que [foi ungido] primeiro foi ungido novamente. Aquele que foi redimido foi redimido novamente.


    Se é necessário falar de um mistério: o Pai de tudo se uniu à virgem que desceu, e um fogo o iluminou naquele dia. Ele revelou a grande câmara nupcial, e assim seu corpo passou a existir naquele dia. Ele saiu da câmara nupcial como aquele que passou a existir a partir do noivo e da noiva. Foi assim que Jesus estabeleceu tudo dentro de si mesmo. Também é necessário que cada discípulo entre em seu descanso por meio dessas coisas.


    Adão passou a existir a partir de duas virgens: do Espírito e da terra virgem. Assim, Cristo foi gerado de uma virgem para corrigir a queda que ocorreu no princípio.


    Há duas árvores crescendo no Paraíso. Uma gera [animais], e a outra gera seres humanos. Adão [comeu] da árvore que gerava animais, [e ele] se tornou um animal e gerou [animais]. Por isso, os filhos de Adão adoram os [animais]. A árvore […] é fruto […] isto eles […] comeram o […] fruto do […] gerar seres humanos […] do humano de […] Deus faz o ser humano, [… os seres humanos] fazem [Deus]. Assim é neste mundo: os seres humanos fazem deuses e adoram sua própria criação. Seria melhor que os deuses adorassem os seres humanos!


    A verdade é que a obra da humanidade procede de seu poder, por isso eles são chamados “os poderes”. Suas obras são seus filhos, que passam a existir por meio do descanso. Assim, seu poder existe em suas obras, mas o descanso se revela em seus filhos. E você verá que isso se estende à imagem. Assim é a pessoa na imagem: realiza suas obras por meio de seu poder, mas gera seus filhos por meio do descanso.


    Neste mundo, os escravos trabalham para os livres. No reino dos céus, os livres servirão aos escravos. Os filhos da câmara nupcial servirão aos filhos do [casamento. Os] filhos da câmara nupcial têm um [único] nome: “Descanso”. [Estando] juntos, não precisam assumir forma, [porque têm] contemplação […] eles são muitos […] com os que estão na […] as glórias dos […] não […] eles […] descem à [água …] eles se redimirão […] isto é, os que têm […] em seu nome, porque ele disse: “[É assim que] cumpriremos toda a justiça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Crisma” significa a unção ou o óleo de unção; aqui o texto o identifica com a luz.
    reason: Esclarece um termo técnico pouco comum sem resolver seu significado ritual ou simbólico.
  - marker: b
    text: “Poderes” pode designar potências ou autoridades espirituais; o texto também explora o sentido de poder ou capacidade.
    reason: Preserva e sinaliza a polissemia relevante para esta passagem.
  - marker: c
    text: O testemunho associa “vida” a Eva entre parênteses. A relação exata entre alma, vida, espírito e Eva permanece obscura no trecho danificado.
    reason: Evita apresentar como clara uma construção textual e conceitualmente incerta.
lexical_decisions:
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Mantém o termo técnico e imagético recorrente, sem reduzi-lo a casamento, quarto ou rito específico.
- source_word: chrism
  choice: crisma
  rationale: Preserva o substantivo técnico ligado à unção e sua identificação metafórica com a luz.
- source_word: powers
  choice: poderes
  rationale: Conserva a possível referência simultânea a potências espirituais e à capacidade ou poder, importante para o jogo conceitual posterior.
- source_word: rest
  choice: descanso
  rationale: Retém o termo teológico e sua repetição deliberada, sem interpretá-lo como repouso eterno, salvação ou contemplação.
- source_word: begotten
  choice: gerado
  rationale: Preserva a linguagem de geração e nascimento usada no texto, inclusive onde ela permanece conceitualmente obscura.
- source_word: free people
  choice: pessoas livres / os livres
  rationale: Usa linguagem natural e inclusiva quando o referente é geral, mantendo o contraste social com escravos.
- source_word: houses of offering
  choice: casas de oferta
  rationale: Tradução formal provisória que evita identificar essas estruturas com uma instituição cultual mais específica sem revisão copta.
theological_decisions:
- issue: Relação entre separação sexual, morte e restauração em Cristo
  choice: Preservar literalmente a sequência argumentativa e a imagem da união
  alternative: Explicar a passagem como doutrina sacramental, psicológica ou cosmológica definida
  rationale: O testemunho é ambíguo e não autoriza impor uma interpretação denominacional ou sistemática.
- issue: Identidade dos “poderes”
  choice: Manter “poderes” sem definir se são autoridades espirituais, forças cósmicas ou capacidades humanas
  alternative: Traduzir como “autoridades”, “potestades” ou “faculdades”
  rationale: A polissemia parece participar do raciocínio do texto e deve ser preservada.
- issue: Linguagem de geração, unção e redenção repetidas em Jesus
  choice: Conservar as formas passivas e a repetição
  alternative: Harmonizar com formulações cristológicas posteriores ou esclarecer a cronologia
  rationale: O texto apresenta tensão própria, que não deve ser silenciosamente resolvida.
- issue: “Recebe it para si” na abertura
  choice: Traduzir o pronome como “a”, com referente feminino gramatical e semanticamente incerto
  alternative: Explicitar “Eva”, “a mulher” ou “a união”
  rationale: O testemunho fornecido não estabelece com segurança o referente; a tradução preserva a ambiguidade.
- issue: Voz reflexiva em “redeem themselves”
  choice: Traduzir “eles se redimirão”
  alternative: Interpretar como passivo, “serão redimidos”
  rationale: Mantém a forma do testemunho disponível, embora a revisão do copta possa exigir alteração.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe clara. Colchetes e reticências foram preservados como sinais de restauração proposta e lacunas do manuscrito. A tradução é necessariamente provisória, pois foi elaborada a partir do testemunho inglês público fornecido; a revisão direta do copta do Códice II de Nag Hammadi continua necessária. Repetições, mudanças abruptas e tensões conceituais foram mantidas sempre que possível.
