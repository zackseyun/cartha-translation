lexical_decisions:
- source_word: submit / submissive
  choice: submeter-se / submisso
  rationale: Mantém a repetição conceitual do testemunho e a relação entre os animais e os poderes, sem trocar o termo por uma interpretação mais específica.
- source_word: perfect human
  choice: ser humano perfeito
  rationale: Preserva a expressão antropológica e sua possível carga técnica sem restringi-la a gênero masculino nem explicar sua teologia.
- source_word: powers
  choice: poderes
  rationale: Conserva a amplitude do termo, que pode designar forças ou entidades espirituais; 'potestades' seria menos acessível e mais interpretativo.
- source_word: the whole place stands
  choice: todo o lugar permanece de pé
  rationale: Retém a imagem espacial e a formulação difícil do testemunho, evitando substituí-la por 'mundo subsiste', que resolveria a metáfora.
- source_word: formed / begotten
  choice: formado / gerado
  rationale: Preserva o contraste central entre fabricação ou formação e geração.
- source_word: seed
  choice: descendência
  rationale: No contexto de filiação, comunica naturalmente o sentido coletivo de linhagem, embora 'semente' seja uma alternativa mais literal.
- source_word: partnership
  choice: união
  rationale: Expressa uma associação relacional no contexto da afirmação sobre adultério sem especificar indevidamente casamento ou relação sexual.
- source_word: wilderness
  choice: deserto
  rationale: É a opção bíblica corrente e legível para uma região erma, sem exigir que o ambiente seja literalmente arenoso.
theological_decisions:
- issue: Referência pronominal do ser humano perfeito
  choice: Uso de 'ele' como retomada gramatical de 'o ser humano perfeito'.
  alternative: Plural inclusivo ('eles aram') ou repetição de 'o ser humano perfeito'.
  rationale: O português exige uma retomada natural; o masculino gramatical não pretende definir o sexo da figura nem resolver sua identidade.
- issue: Gênero gramatical do Espírito Santo
  choice: Pronomes masculinos de acordo com 'o Espírito Santo'.
  alternative: Construção impessoal sem pronome ou pronome neutro baseado no inglês 'it'.
  rationale: Trata-se de concordância normal em português, não de uma decisão sobre a natureza ou o gênero do Espírito.
- issue: Bem e mal; direita e esquerda
  choice: Manter os pares lado a lado, sem explicar sua relação moral ou cosmológica.
  alternative: Interpretá-los como grupos salvos e condenados ou como poderes cósmicos.
  rationale: O texto preservado é teologicamente tenso e não identifica explicitamente os referentes.
- issue: Caim como filho da serpente
  choice: Traduzir a afirmação diretamente como alegação do próprio texto.
  alternative: Harmonizá-la com Gênesis ou apresentá-la como simples metáfora.
  rationale: A tradução não deve apagar nem resolver uma afirmação distintiva do Evangelho de Filipe.
- issue: União dos diferentes como adultério
  choice: Preservar a formulação abrangente e difícil.
  alternative: Restringi-la a casamento, relação sexual ou mistura espiritual específica.
  rationale: O testemunho não explicita aqui o alcance exato de 'diferentes'; especificá-lo importaria uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque se baseia no testemunho público em inglês fornecido; a revisão direta do copta do Códice de Nag Hammadi II,3 ainda está pendente. Colchetes e lacunas foram conservados, e a sintaxe foi suavizada apenas onde isso não elimina a dificuldade do texto.
