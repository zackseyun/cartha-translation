  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: pt
  text: 'Há animais que se submetem aos seres humanos, como o bezerro, o jumento e outros desse tipo. Outros não são submissos e vivem sozinhos no deserto. A humanidade ara o campo com os animais submissos e, assim, alimenta tanto a si mesma como aos animais, sejam submissos ou não. Assim também acontece com o ser humano perfeito: ele ara com os poderes submissos, preparando para todos os que virão a existir. É por isso que todo o lugar permanece de pé, tanto o bem como o mal, tanto a direita como a esquerda. O Espírito Santo pastoreia todos e governa todos os poderes — os submissos, os que [não são] e os que vivem sozinhos —, porque, na verdade, ele […] os mantém confinados, [de modo que, ainda que …] queiram, não poderão [sair].[a]


    [Aquele que foi] formado [é belo, mas] você veria que seus filhos são formas nobres. Se ele não tivesse sido formado, mas gerado, você veria que sua descendência era nobre. Mas ele foi formado e gerou. Que nobreza é essa? Primeiro houve adultério e depois assassinato; e ele, Caim, foi gerado em adultério, porque era filho da serpente. Por isso, também se tornou assassino como seu pai e matou seu irmão, Abel. Toda união entre os que são diferentes é adultério.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes indicam palavras restauradas ou conjecturadas, e as reticências entre colchetes indicam uma lacuna no manuscrito. A frase permanece incompleta e seu encadeamento exato é incerto.
