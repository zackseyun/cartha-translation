translation:
  language: pt
  text: 'Os governantes queriam enganar a humanidade, pois viram que ela tinha parentesco com os que são verdadeiramente bons. Tomaram o nome dos que são bons e o deram aos que não são bons, para enganar a humanidade por meio dos nomes e prendê-la aos que não são bons. E depois, que favor lhe fazem! Tiram-na do meio dos que não são bons e a colocam entre os que são bons. Os governantes sabiam o que estavam fazendo, pois queriam tomar os que eram livres e submetê-los à escravidão para sempre.


    Há poderes que existem […] a humanidade, não querendo que ela seja [salva], para que possam ser […] porque, se a humanidade [fosse salva], sacrifícios [não] aconteceriam […] e animais seriam oferecidos aos poderes, pois aqueles a quem as ofertas eram feitas eram animais. Eram oferecidos vivos, mas, quando eram oferecidos, morriam. Um ser humano foi oferecido morto a Deus, e viveu.[a]


    Antes de Cristo vir, não havia pão algum no mundo. Do mesmo modo, o Paraíso, onde Adão estava, tinha muitas árvores para alimentar os animais, mas não tinha trigo para alimentar a humanidade. A humanidade costumava comer como os animais; mas, quando Cristo, o ser humano perfeito, veio, trouxe pão do céu, para que a humanidade fosse alimentada com o alimento próprio dos seres humanos.


    Os governantes pensavam que faziam o que fizeram por seu próprio poder e sua própria vontade, mas o Espírito Santo realizava secretamente, por meio deles, tudo o que queria. A verdade, que existe desde o princípio, é semeada por toda parte. Muitos a veem sendo semeada, mas poucos a veem sendo colhida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O contraste é intencional: os animais eram oferecidos vivos e morriam; um ser humano foi oferecido morto a Deus e viveu. O texto não identifica explicitamente esse ser humano neste ponto.'
    reason: Preservar e esclarecer o paradoxo sem impor uma identificação teológica não expressa.
lexical_decisions:
- source_word: rulers
  choice: governantes
  rationale: Equivalente natural e suficientemente amplo para as autoridades ou potências cósmicas mencionadas no texto, sem impor uma identificação doutrinária específica.
- source_word: humanity
  choice: humanidade
  rationale: Preserva o sentido coletivo e evita restringir a referência aos homens do sexo masculino.
- source_word: kinship
  choice: parentesco
  rationale: Mantém a ideia forte de afinidade por origem ou natureza, sem explicá-la além do testemunho disponível.
- source_word: powers
  choice: poderes
  rationale: Conserva a distinção lexical em relação a “governantes” e a possível referência a entidades sobrenaturais.
- source_word: perfect human
  choice: ser humano perfeito
  rationale: Expressa de modo inclusivo e literal a humanidade perfeita atribuída a Cristo, sem substituir a expressão por um título teológico posterior.
- source_word: food of humanity
  choice: alimento próprio dos seres humanos
  rationale: Torna idiomática a construção repetitiva, preservando o contraste entre alimentação humana e animal.
- source_word: is sown / being reaped
  choice: é semeada / sendo colhida
  rationale: Mantém a metáfora agrícola e a alternância entre semeadura e colheita.
theological_decisions:
- issue: A identidade dos “governantes” e dos “poderes”
  choice: Manter os termos genéricos e distintos
  alternative: Interpretá-los explicitamente como arcontes, demônios ou autoridades políticas
  rationale: O trecho permite uma leitura cosmológica, mas o testemunho fornecido não justifica resolver a identidade das entidades dentro da tradução.
- issue: A passagem de ser oferecido morto a Deus e viver
  choice: Preservar a formulação paradoxal sem identificar explicitamente a pessoa com Cristo
  alternative: Traduzir “Cristo foi oferecido morto a Deus e reviveu”
  rationale: Embora o contexto possa sugerir Cristo, o texto fornecido diz apenas “um ser humano”; explicitar a identificação eliminaria uma ambiguidade genuína.
- issue: A atuação do Espírito Santo por meio dos governantes
  choice: Conservar que o Espírito realizava sua vontade secretamente por meio deles
  alternative: Atenuar para mera permissão providencial
  rationale: A formulação forte pertence ao texto e sua tensão teológica não deve ser harmonizada ou reduzida.
- issue: O pão anterior à vinda de Cristo
  choice: Manter a afirmação absoluta e metafórica de que não havia pão no mundo
  alternative: Explicá-la como ausência de pão espiritual ou celestial
  rationale: A interpretação espiritual é provável no contexto, mas acrescentá-la ao corpo do texto resolveria a imagem em vez de preservá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente. Reticências e colchetes foram preservados como sinais de lacunas manuscritas e restaurações editoriais. Repetições-chave foram mantidas quando estruturam o argumento, com ajustes mínimos para fluência.
