review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a estrutura argumentativa, as repetições e os sinais de lacuna/restauração do testemunho inglês provisório. A principal revisão é ajustar a articulação da comparação sobre o Paraíso e o aspecto verbal na frase final, sem resolver ambiguidades do texto.
  naturalness: O português é geralmente claro e de registro adequado. “Do mesmo modo” enfraquece a comparação introduzida por “just as”, e “pensavam que faziam o que fizeram” produz uma combinação temporal menos natural do que “pensavam que agiam...”.
  terminology: “Governantes”, “poderes”, “humanidade”, “parentesco”, “ser humano perfeito” e “Espírito Santo” são escolhas apropriadas e mantêm as distinções e a indeterminação do testemunho. A nota sobre o ser humano oferecido morto é prudente e não impõe identificação teológica.
  issues:
  - severity: low
    issue: Conector comparativo na seção do pão
    rationale: O inglês liga diretamente a ausência de pão à imagem do Paraíso (“just as”). “Do mesmo modo” após ponto pode sugerir uma equivalência mais genérica; o travessão seguido de “assim como” reproduz melhor a construção.
  - severity: low
    issue: Construção verbal na frase sobre os governantes e o Espírito Santo
    rationale: “Pensavam que faziam o que fizeram” é compreensível, mas mistura de modo pouco fluente o imperfeito com o perfeito. “Pensavam que agiam...” exprime naturalmente a pretensão de agir por poder e vontade próprios.
  revised_text: 'Os governantes queriam enganar a humanidade, pois viram que ela tinha parentesco com os que são verdadeiramente bons. Tomaram o nome dos que são bons e o deram aos que não são bons, para enganar a humanidade por meio dos nomes e prendê-la aos que não são bons. E depois, que favor lhe fazem! Tiram-na dos que não são bons e a colocam entre os que são bons. Os governantes sabiam o que estavam fazendo, pois queriam tomar os que eram livres e submetê-los à escravidão para sempre.



    Há poderes que existem […] a humanidade, não querendo que ela seja [salva], para que possam ser […] porque, se a humanidade [fosse salva], sacrifícios [não] aconteceriam […] e animais seriam oferecidos aos poderes, pois aqueles a quem as ofertas eram feitas eram animais. Eram oferecidos vivos, mas, quando eram oferecidos, morriam. Um ser humano foi oferecido morto a Deus, e viveu.[a]



    Antes de Cristo vir, não havia pão algum no mundo — assim como o Paraíso, onde Adão estava, tinha muitas árvores para alimentar os animais, mas não tinha trigo para alimentar a humanidade. A humanidade costumava comer como os animais; mas, quando Cristo, o ser humano perfeito, veio, trouxe pão do céu, para que a humanidade fosse alimentada com o alimento próprio dos seres humanos.



    Os governantes pensavam que agiam por seu próprio poder e sua própria vontade, mas o Espírito Santo realizava secretamente, por meio deles, tudo o que queria. A verdade, que existe desde o princípio, é semeada por toda parte. Muitos a veem sendo semeada, mas poucos a veem sendo colhida.'
