  revised_text: 'Os que dizem que primeiro morrerão e só depois ressuscitarão estão enganados. Se não receberem primeiro a ressurreição enquanto vivem, nada receberão quando morrerem. O mesmo acontece quando falam do batismo e dizem: “O batismo é algo grandioso”, pois os que o recebem viverão.



    O apóstolo Filipe disse: “José, o carpinteiro, plantou um jardim porque precisava de madeira para o seu ofício. Foi ele quem fez a cruz com as árvores que havia plantado, e seu descendente foi pendurado naquilo que ele plantou. Seu descendente era Jesus, e a planta era a cruz”. Mas a Árvore da Vida está no meio do Paraíso; da oliveira veio o crisma[a], e do crisma, a ressurreição.



    Este mundo devora cadáveres. Tudo o que é devorado nele também morre. A Verdade se alimenta de vida; por isso, ninguém que seja alimentado pela [Verdade] morrerá. Jesus veio daquele lugar e trouxe alimento de lá; aos que quiseram, deu-lhes [de comer, para que] não morressem.



    [Deus…] um Paraíso, [ser humano…] Paraíso, há […] e […] de Deus […] os que estão [nele…] Desejo que [Paraíso…] me digam: “[… coma] isto”, ou: “Não coma [aquilo…] desejo”. A árvore do conhecimento é o lugar onde comerei de tudo. Ela matou Adão, mas aqui faz a humanidade viver. A Lei era a árvore. Ela tem o poder de dar o conhecimento do bem e do mal. Não os afastou do mal nem os estabeleceu no bem, mas produziu a morte para os que comeram dela, pois, quando disse: “Coma isto; não coma aquilo”, tornou-se o princípio da morte.



    O crisma é superior ao batismo, pois somos chamados “cristãos” por causa do crisma, e não por causa do batismo. E foi por causa do crisma que Cristo recebeu esse nome, pois o Pai ungiu o Filho, o Filho ungiu os apóstolos, e os apóstolos nos ungiram. Quem é ungido possui tudo: a ressurreição, a luz, a cruz e o Espírito Santo. O Pai lhe deu isso na câmara nupcial[b], e ele o recebeu. O Pai estava no Filho, e o Filho, no Pai. Este é [o Reino] dos céus.



    O Senhor disse [isso] muito bem: “Alguns foram ao Reino dos céus rindo e saíram […] um cristão […] e assim que [… desceu] à água, ele […] tudo a respeito de […] é [uma] brincadeira, [mas… desprezar] isto […] ao Reino dos [céus…] se desprezarem […] e se zombarem disso como de uma brincadeira, […] rindo”. O mesmo acontece com o pão, o cálice e o óleo, embora haja um que é superior a estes.



    O mundo veio a existir por meio de uma transgressão, porque aquele que o criou queria criá-lo imperecível e imortal. Ele caiu e não conseguiu o que desejava, pois nem o mundo era imperecível, nem aquele que o criou era imperecível. Isso porque não são as coisas que são imperecíveis, mas os filhos. Nada poderá receber a incorruptibilidade sem se tornar filho. E aquele que não consegue receber, quanto menos conseguirá dar!



    O cálice da oração contém vinho e água, pois é apresentado como figura do sangue sobre o qual se dão graças. Ele se enche do Espírito Santo e pertence ao ser humano inteiramente perfeito. Sempre que bebermos dele, receberemos o ser humano perfeito. A água viva é um corpo. É necessário que nos revistamos do ser humano vivo. Por isso, ao descerem à água, despem-se para se revestirem daquele.



    Um cavalo gera um cavalo, um ser humano gera um ser humano, e um deus gera deus. O mesmo acontece com [o noivo] e [as noivas]. Eles [vêm a existir] a partir do […] Nenhum judeu […] de […] existe, e […] dos judeus […] os cristãos […] chamaram estes […] “a raça escolhida de […]”, “o verdadeiro ser humano”, “o Filho do Ser Humano” e “a descendência do Filho do Ser Humano”. Essa verdadeira raça é conhecida no mundo. Estes são os lugares onde existem os filhos da câmara nupcial.



    Neste mundo, a união ocorre entre macho e fêmea, o lugar da força e da fraqueza. Na era (eterna)[c], a união é de outra espécie, embora nos refiramos a ambas pelos mesmos nomes. Há, porém, outros nomes, superiores a todo nome que se possa nomear, e eles são superiores aos fortes, pois, onde há força, existem os que são ainda mais poderosos. Não são duas coisas diferentes; ambas são a mesma coisa. Isso é o que não poderá descer sobre o coração carnal.



    Não é necessário que todo aquele que possui tudo conheça plenamente a si mesmo? Alguns que não conhecem a si mesmos não poderão desfrutar do que possuem, mas os que chegaram a compreender a si mesmos desfrutarão dessas coisas.



    Não somente serão incapazes de prender o ser humano perfeito, mas também serão incapazes de vê-lo, pois, se o virem, irão prendê-lo. Não há outra maneira de alguém adquirir para si essa graça [senão] revestindo-se da luz perfeita [e] tornando-se a [luz] perfeita. [Quem dela se revestiu] seguirá […] este é o perfeito […] para nos tornarmos […] antes de chegarmos a […] quem recebe tudo […] estes lugares, poderá […] aquele lugar, mas […] [o meio] como incompleto. Somente Jesus conhece o fim deste.



    O homem santo — o sacerdote[d] — é inteiramente santo, até mesmo em seu corpo. Pois, se recebe o pão, ele o santifica; do mesmo modo o cálice ou qualquer outra coisa que tome e purifique. Por que não purificaria também o corpo?



    Assim como Jesus tornou perfeita a água do batismo, também derramou a morte. Por isso, descemos à água, mas não descemos à morte, para não sermos derramados no espírito do mundo. Quando ele sopra, chega o inverno; quando o Espírito Santo sopra, chega o verão.



    Quem conhece a verdade é livre, e a pessoa livre não peca, pois “quem peca é escravo do pecado”. A Verdade é a Mãe, mas o conhecimento é a união. Aqueles que não estão entregues ao pecado são chamados “livres” pelo mundo. O conhecimento da verdade enche de orgulho esses que não estão entregues ao pecado. É isso que os torna livres e os eleva acima de tudo. Mas “o amor edifica”. Aquele que foi libertado por meio do conhecimento torna-se, por amor, escravo dos que ainda não conseguem alcançar [a] liberdade do conhecimento; [mas] o conhecimento os capacita [a] se tornarem livres. O amor […] coisa alguma como sua […] ele […] sua própria. Nunca [diz: “…"] ou “Isto é meu”, [mas: “…] são de vocês”. O amor espiritual é vinho perfumado. Todos os que se ungem com ele desfrutam de seu perfume. Enquanto os ungidos permanecem por perto, os que estão ao redor também o desfrutam. Se os ungidos com o bálsamo os deixam e vão embora, os que não foram ungidos, mas apenas estavam por perto, permanecem em
    seu mau cheiro.



    O samaritano não deu ao homem ferido nada além de vinho com óleo. Isso nada mais era que o bálsamo, e curou as feridas, porque “o amor cobre uma multidão de pecados”.



    Os filhos que uma mulher dá à luz se parecerão com o homem que ela ama. Se for o marido, parecerão com o marido; se for um adúltero, parecerão com o adúltero. Muitas vezes, se uma mulher se deita com o marido por obrigação, mas seu coração está com o adúltero com quem mantém intimidade, e ela dá à luz um filho, o filho que nasce se parece com o adúltero. Vocês, porém, que existem com o Filho de Deus, não amem o mundo; antes, amem o Senhor, para que aqueles que vocês gerarem não venham a se parecer com o mundo, mas com o Senhor.



    O ser humano se une ao ser humano, o cavalo se une ao cavalo, e o jumento se une ao jumento. As espécies se unem [a] espécies semelhantes. Assim também o espírito se une ao espírito, a [Palavra] tem intimidade com a Palavra, e [a luz] tem intimidade [com a luz]. [Se você] se tornar humano, [o humano] amará você. Se você se tornar [espírito], o Espírito se unirá a você. [Se] você se tornar Palavra, a Palavra se unirá a você. Se [você] se tornar luz, a luz terá intimidade com você. Se você se tornar um dos que são do alto, os que são do alto repousarão sobre você. Mas, se você se tornar cavalo, jumento, bezerro, cão, ovelha ou qualquer outro dos animais que estão fora ou embaixo, nem o ser humano, nem o espírito, nem a Palavra, nem a luz, nem os que são do alto, nem os que estão dentro poderão amar você. Não poderão repousar em você, e você não terá parte neles.



    Quem é escravo contra a vontade poderá ser libertado. Mas quem foi libertado pela graça de seu senhor e vendeu a si mesmo novamente à escravidão já não poderá ser libertado.'
