id: GPHIL.017
reference: Gospel of Philip — Uprooting Evil
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it''s necessary to destroy the flesh.


    [Most (things)] of [the] world can stand up and live as long as their [insides are hidden. If they''re revealed], they die, as [illustrated] by the visible human. [As long as] the human''s guts are hidden, the human is alive. If their guts are exposed and come out of them, the human will die. It''s the same way with the tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. That''s what it''s like with everything that''s born in the world, not only the revealed, but also the hidden; because as long as the root of evil is hidden, it''s strong. But if it''s recognized, it dissolves, and if it''s revealed, it dies. So the Word says, "Already the axe is laid at the root of the trees." It won''t (just) cut, (because) that which will be cut blossoms again. Rather, the axe digs down into the ground until it brings up the root. Jesus plucked out the root completely, but others did so partially. As for us, let every one of us dig down to the root of
    the evil within and pluck it out from its root in us. It''ll be uprooted if we recognize it. But if we don''t recognize it, it takes root within us and bears its fruit in us. It masters us, and we''re forced to serve it. It captures us so that we do what we do [not] want to; and we do [not] do what we want to. [It''s] powerful because we haven''t recognized it. It''s active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] neither did exist nor [does exist], nor will they come into being […] they''ll be perfected when the whole truth is revealed, because the truth is like ignorance. When it''s hidden, it rests within itself, but if it''s revealed and recognized, it''s glorified inasmuch as it''s stronger than ignorance and error. It gives freedom. The Word says, "If you''ll know the truth, the truth will make you free." Ignorance is slavery; knowledge is freedom. If we know the truth, we''ll find the fruits
    of truth within us. If we unite with it, it''ll receive our fullness.


    Now we have what''s revealed of creation. We say, "Those who are strong are honorable, but those who are hidden are weak and scorned." That''s what it''s like with those who are revealed of the truth; they''re weak and scorned, but the hidden are strong and honorable. But the mysteries of the truth are revealed in types and images.


    The chamber is hidden, however; it''s the Holy in the Holy. At first, the veil concealed how God managed the creation, but when the veil is torn and what''s inside is revealed, then this house will be left behind [like] a desert, or rather, will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it won''t be able to unite with the pure [light] and the [flawless] fullness, [but] it''ll come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the flood of water surges over them. If some belong to the priesthood, they''ll be able to enter inside the veil with the high priest. So the veil wasn''t torn only at the top, since it would''ve been open only to those at the top; nor was it torn only at the bottom, since it would''ve been revealed only to those at the bottom; but it was torn from the top to the bottom. Those at the top opened to us the bottom, so that we''ll enter the secret
    of the truth. This truly is what''s honorable, what''s strong, but we''ll enter there through scorned types and weaknesses. They''re humbled in the presence of the perfect glory. There''s glory that''s better than glory; there''s power that''s better than power. So the perfect was opened to us with the secrets of the truth, and the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it''s hidden, evil is inactive, but it hasn''t been removed from among the Holy Spirit''s seed. They''re slaves of evil. But whenever it''s revealed, then the perfect light will flow out upon everyone, and all of them who are in it will [receive the chrism]. Then the slaves will be made free and the captives will be redeemed. "[Every] plant [which] my Father who''s in heaven [hasn''t] planted [will be] uprooted." Those who are separated will unite […] will be filled.'
