  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are slaves of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the slaves will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: pt
  text: 'Quando Abraão […] para ver o que haveria de ver, [ele] circuncidou a carne do prepúcio, [ensinando-nos] que é necessário destruir a carne.


    [A maioria (das coisas)] do mundo pode manter-se de pé e viver enquanto seu [interior permanece oculto. Se ele for revelado], elas morrem, como [mostra] o ser humano visível. [Enquanto] as entranhas de uma pessoa permanecem ocultas, ela vive. Se suas entranhas ficam expostas e saem do corpo, ela morre. O mesmo acontece com a árvore. Enquanto sua raiz está oculta, ela floresce e cresce. Se a raiz fica exposta, a árvore seca. Assim acontece com tudo o que nasce no mundo, não somente com o que é manifesto, mas também com o que é oculto. Pois, enquanto a raiz do mal está oculta, ela é forte; mas, se é reconhecida, dissolve-se, e, se é revelada, morre. Por isso, a Palavra diz: “O machado já está posto à raiz das árvores.”[a] Ele não cortará apenas, pois aquilo que é cortado volta a brotar. Em vez disso, o machado cava fundo na terra até arrancar a raiz. Jesus arrancou completamente a raiz, mas outros só a arrancaram em parte. Quanto a nós, que cada um cave até chegar à raiz do mal que está
    dentro de si e o arranque pela raiz de dentro de nós. Ele será desenraizado se o reconhecermos. Mas, se não o reconhecermos, criará raízes dentro de nós e produzirá em nós o seu fruto. Ele nos domina, e somos forçados a servi-lo. Ele nos aprisiona, para que façamos o que [não] queremos e [não] façamos o que queremos.[b] [Ele é] poderoso porque não o reconhecemos. Continua ativo enquanto [existe]. A [ignorância] é a mãe de [todo mal]. A ignorância causará a [morte, porque] aquilo que existe a partir da [ignorância] não existiu, nem [existe], nem virá a existir […] eles serão aperfeiçoados quando toda a verdade for revelada, pois a verdade é semelhante à ignorância: quando está oculta, repousa em si mesma; mas, se é revelada e reconhecida, é glorificada, porque é mais forte do que a ignorância e o erro. Ela dá liberdade. A Palavra diz: “Se vocês conhecerem a verdade, a verdade os libertará.”[c] A ignorância é escravidão; o conhecimento é liberdade. Se conhecermos a verdade, encontraremos
    dentro de nós os frutos da verdade. Se nos unirmos a ela, ela receberá nossa plenitude.


    Agora temos aquilo que está manifesto na criação. Dizemos: “Os fortes são honrados, mas os ocultos são fracos e desprezados.” Assim acontece com as coisas manifestas da verdade: são fracas e desprezadas, mas as ocultas são fortes e honradas. Contudo, os mistérios da verdade são revelados por meio de figuras e imagens.


    A câmara, porém, está oculta; ela é o Santo dentro do Santo.[d] No princípio, o véu ocultava como Deus administrava a criação. Mas, quando o véu for rasgado e aquilo que está dentro for revelado, esta casa será deixada para trás [como] um deserto — ou melhor, será [destruída]. E toda divindade fugirá [destes] lugares, não para o Santo [dos] Santos, pois não poderá unir-se à [luz] pura e à plenitude [sem defeito]; [mas] ficará debaixo das asas da cruz e [debaixo] de seus braços. Esta arca [se tornará a salvação deles] quando as águas do dilúvio se erguerem sobre eles. Se alguns pertencem ao sacerdócio, poderão entrar para além do véu com o sumo sacerdote. Portanto, o véu não foi rasgado somente na parte de cima, pois assim teria sido aberto apenas para os que estão em cima; nem foi rasgado somente na parte de baixo, pois assim teria sido revelado apenas aos que estão embaixo. Pelo contrário, foi rasgado de alto a baixo.[e] Os que estão em cima abriram para nós a parte de baixo, para que
    entremos no segredo da verdade. Isso é verdadeiramente o que é honrado e forte; contudo, entraremos ali por meio de figuras desprezadas e fraquezas. Elas se humilham diante da glória perfeita. Há glória superior à glória e poder superior ao poder. Assim, o perfeito foi aberto para nós juntamente com os segredos da verdade; o Santo dos Santos foi revelado, e a câmara nos convidou a entrar.


    Enquanto está oculto, o mal permanece inativo, mas ainda não foi retirado do meio da descendência do Espírito Santo. Eles são escravos do mal. Quando, porém, ele for revelado, a luz perfeita se derramará sobre todos, e todos os que estiverem nela [receberão a unção].[f] Então os escravos serão libertados e os cativos serão resgatados. “[Toda] planta [que] meu Pai, que está no céu, [não] plantou [será] arrancada pela raiz.”[g] Os que estão separados se unirão […] serão preenchidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Mateus 3.10 e Lucas 3.9.
    reason: Identifica a citação introduzida como palavra autorizada.
  - marker: b
    text: A formulação lembra Romanos 7.15–20. Os colchetes indicam palavras restauradas no texto danificado.
    reason: Registra a intertextualidade e a incerteza material sem harmonizar os textos.
  - marker: c
    text: João 8.32, citado com pequena variação de forma.
    reason: Identifica a fonte provável da citação.
  - marker: d
    text: “Câmara” pode ter sentido ritual e simbólico neste escrito. O trecho não acrescenta aqui o qualificativo “nupcial”.
    reason: Evita que uma associação conhecida em outras partes do escrito seja inserida silenciosamente.
  - marker: e
    text: Alusão ao rasgar do véu do santuário na morte de Jesus; veja Mateus 27.51 e Marcos 15.38.
    reason: Esclarece o pano de fundo narrativo da imagem.
  - marker: f
    text: Literalmente, “receberão o crisma”, isto é, a substância ou o rito de unção.
    reason: Preserva em nota o termo específico por trás da tradução mais natural.
  - marker: g
    text: Mateus 15.13.
    reason: Identifica a citação.
lexical_decisions:
- source_word: flesh
  choice: carne
  rationale: Mantém o termo concreto e sua possível carga antropológica sem interpretá-lo como mero corpo físico ou natureza pecaminosa.
- source_word: Word
  choice: Palavra
  rationale: Preserva a possível personificação e a função de introduzir citações autorizadas.
- source_word: knowledge
  choice: conhecimento
  rationale: Conserva o contraste explícito com ignorância sem impor o termo técnico “gnose” ao leitor.
- source_word: types
  choice: figuras
  rationale: Expressa formas representativas ou simbólicas em português corrente, mantendo a relação com “imagens”.
- source_word: chamber
  choice: câmara
  rationale: Mantém a designação espacial e ritual ambígua do texto, sem acrescentar “nupcial” onde o trecho não o explicita.
- source_word: fullness
  choice: plenitude
  rationale: Preserva o vocabulário conceitual do escrito sem substituir por uma interpretação cosmológica específica.
- source_word: divinity
  choice: divindade
  rationale: Mantém o substantivo abstrato/coletivo e a estranheza da afirmação, sem convertê-lo em “Deus” ou “seres divinos”.
- source_word: chrism
  choice: unção
  rationale: Emprega termo português inteligível para o rito ou substância de ungir; a nota registra a especificidade lexical.
- source_word: seed
  choice: descendência
  rationale: Produz leitura natural para um grupo oriundo do Espírito Santo, preservando a possibilidade coletiva de “semente”.
theological_decisions:
- issue: “Destruir a carne” na abertura
  choice: Manter literalmente “destruir a carne”
  alternative: Interpretar como mortificação de desejos, eliminação da corrupção ou destruição do corpo
  rationale: O texto oferece uma formulação teologicamente tensa; a tradução não deve resolver sua antropologia de modo denominacional.
- issue: A identidade da “Palavra”
  choice: Usar maiúscula e não explicar sua identidade no corpo do texto
  alternative: Traduzir por “a Escritura”, “o Logos” ou identificar diretamente com Jesus
  rationale: A expressão pode funcionar como autoridade escriturística e como termo personificado; a ambiguidade deve permanecer.
- issue: Ecos de Romanos 7
  choice: Preservar os colchetes em “[não]”
  alternative: Harmonizar plenamente a frase com Romanos 7.15-20
  rationale: Os colchetes indicam restauração editorial em área danificada, e não se deve ocultar a incerteza textual.
- issue: Câmara e linguagem do santuário
  choice: Traduzir “câmara” e “Santo dentro do Santo” sem denominá-la câmara nupcial
  alternative: Explicitar “câmara nupcial” ou equipará-la diretamente ao Santo dos Santos
  rationale: O contexto sugere simbolismo ritual, mas a formulação local deve conservar suas distinções e ambiguidades.
- issue: “Toda divindade fugirá”
  choice: Manter a expressão difícil e seu referente indeterminado
  alternative: Reformular como presença divina, poderes divinos ou deuses
  rationale: A passagem é obscura e possivelmente depende da cosmologia do escrito; uma solução explícita excederia a evidência fornecida.
- issue: Semente do Espírito Santo e escravidão
  choice: Manter a mudança para o plural “eles”
  alternative: Regularizar tudo no singular ou identificar precisamente quem são os escravos
  rationale: O testemunho passa de uma imagem coletiva ao grupo representado por ela; regularizar eliminaria uma tensão real.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções claras e vocabulário religioso não denominacional. Colchetes e reticências foram preservados como sinais de lacunas ou restaurações editoriais do testemunho. Como a revisão direta do copta está pendente e o material fornecido é uma testemunha inglesa pública, esta redação é necessariamente provisória; formulações especialmente obscuras foram conservadas em vez de emendadas por conjectura.
