review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a sequência argumentativa, as lacunas e restaurações assinaladas por colchetes, bem como a linguagem deliberadamente difícil do testemunho inglês. São necessários ajustes pontuais para maior precisão: “crisma” deve ser mantido no corpo do texto, e algumas formulações devem conservar mais claramente os referentes e a modalidade do testemunho.'
  naturalness: O português é em geral fluente e apropriado a um registro religioso-literário moderno. Foram ajustadas construções que soavam truncadas ou introduziam uma ambiguidade sintática desnecessária, sem esclarecer obscuridades reais do texto.
  terminology: “Carne”, “Palavra”, “conhecimento”, “plenitude”, “divindade” e “câmara” são escolhas adequadas. “Crisma”, e não apenas “unção”, é necessário como equivalente do termo específico preservado pelo testemunho; a nota pode explicar seu sentido.
  issues:
  - severity: medium
    issue: “[receberão a unção]” traduz “chrism” por um termo mais genérico.
    rationale: O testemunho distingue o termo específico “chrism”. “Crisma” é termo português estabelecido e preserva melhor o vocabulário técnico; a nota pode explicá-lo como unção ritual ou substância de unção.
  - severity: low
    issue: “as coisas manifestas da verdade” altera o referente pessoal de “those who are revealed of the truth”.
    rationale: O testemunho fala de “os que” são manifestos/revelados da verdade. A versão revista preserva esse referente, embora a formulação permaneça intencionalmente estranha.
  - severity: low
    issue: “o arranque pela raiz de dentro de nós” mistura o singular reflexivo “dentro de si” com o plural “de nós” de modo pouco claro.
    rationale: “Arranque-o pela raiz que está em nós” conserva o mal como objeto e a raiz interior como imagem, com sintaxe mais clara.
  revised_text: 'Quando Abraão […] para ver o que haveria de ver, [ele] circuncidou a carne do prepúcio, [dizendo-nos] que é necessário destruir a carne.



    [A maioria (das coisas)] do mundo pode manter-se de pé e viver enquanto seu [interior permanece oculto. Se ele for revelado], elas morrem, como [mostra] o ser humano visível. [Enquanto] as entranhas de uma pessoa permanecem ocultas, ela vive. Se suas entranhas ficam expostas e saem do corpo, ela morre. O mesmo acontece com a árvore. Enquanto sua raiz está oculta, ela floresce e cresce. Se a raiz fica exposta, a árvore seca. Assim acontece com tudo o que nasce no mundo, não somente com o que é manifesto, mas também com o que é oculto. Pois, enquanto a raiz do mal está oculta, ela é forte; mas, se é reconhecida, dissolve-se e, se é revelada, morre. Por isso, a Palavra diz: “O machado já está posto à raiz das árvores.”[a] Ele não cortará apenas, pois aquilo que é cortado volta a brotar. Em vez disso, o machado cava fundo na terra até arrancar a raiz. Jesus arrancou completamente a raiz, mas outros só a arrancaram em parte. Quanto a nós, que cada um cave até chegar à raiz do mal que está
    dentro de si e o arranque pela raiz que está em nós. Ele será desenraizado se o reconhecermos. Mas, se não o reconhecermos, criará raízes dentro de nós e produzirá em nós o seu fruto. Ele nos domina, e somos forçados a servi-lo. Ele nos aprisiona, para que façamos o que [não] queremos e [não] façamos o que queremos.[b] [Ele é] poderoso porque não o reconhecemos. Continua ativo enquanto [existe]. A [ignorância] é a mãe de [todo mal]. A ignorância causará a [morte, porque] aquilo que existe a partir da [ignorância] não existiu, nem [existe], nem virá a existir […] eles serão aperfeiçoados quando toda a verdade for revelada, pois a verdade é semelhante à ignorância: quando está oculta, repousa em si mesma; mas, se é revelada e reconhecida, é glorificada, porque é mais forte do que a ignorância e o erro. Ela dá liberdade. A Palavra diz: “Se vocês conhecerem a verdade, a verdade os libertará.”[c] A ignorância é escravidão; o conhecimento é liberdade. Se conhecermos a verdade, encontraremos
    dentro de nós os frutos da verdade. Se nos unirmos a ela, ela receberá nossa plenitude.



    Agora temos aquilo que está manifesto na criação. Dizemos: “Os fortes são honrados, mas os ocultos são fracos e desprezados.” Assim acontece com os que são manifestos da verdade: são fracos e desprezados, mas os ocultos são fortes e honrados. Contudo, os mistérios da verdade são revelados por meio de figuras e imagens.



    A câmara, porém, está oculta; ela é o Santo dentro do Santo.[d] No princípio, o véu ocultava como Deus administrava a criação. Mas, quando o véu for rasgado e aquilo que está dentro for revelado, esta casa será deixada para trás [como] um deserto — ou melhor, será [destruída]. E toda divindade fugirá [destes] lugares, não para o Santo [dos] Santos, pois não poderá unir-se à [luz] pura e à plenitude [sem defeito]; [mas] virá a estar debaixo das asas da cruz e [debaixo] de seus braços. Esta arca [se tornará a salvação deles] quando as águas do dilúvio se erguerem sobre eles. Se alguns pertencem ao sacerdócio, poderão entrar para além do véu com o sumo sacerdote. Portanto, o véu não foi rasgado somente na parte de cima, pois assim teria sido aberto apenas para os que estão em cima; nem foi rasgado somente na parte de baixo, pois assim teria sido revelado apenas aos que estão embaixo. Pelo contrário, foi rasgado de alto a baixo.[e] Os que estão em cima abriram para nós a parte de baixo,
    para que entremos no segredo da verdade. Isso é verdadeiramente o que é honrado e forte; contudo, entraremos ali por meio de figuras desprezadas e fraquezas. Elas se humilham diante da glória perfeita. Há glória superior à glória e poder superior ao poder. Assim, o perfeito foi aberto para nós juntamente com os segredos da verdade; o Santo dos Santos foi revelado, e a câmara nos convidou a entrar.



    Enquanto está oculto, o mal permanece inativo, mas ainda não foi retirado do meio da descendência do Espírito Santo. Eles são escravos do mal. Quando, porém, ele for revelado, a luz perfeita se derramará sobre todos, e todos os que estiverem nela [receberão o crisma].[f] Então os escravos serão libertados e os cativos serão resgatados. “[Toda] planta [que] meu Pai, que está no céu, [não] plantou [será] arrancada pela raiz.”[g] Os que estão separados se unirão […] serão preenchidos.'
