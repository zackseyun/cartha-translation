translation:
  language: pt
  text: 'Os nomes dados aos que são do mundo são muito enganosos, pois desviam o coração do que é certo para o que não é certo. Quem ouve “Deus” não pensa no que é certo, mas no que não é certo. O mesmo acontece com “o Pai”, “o Filho”, “o Espírito Santo”, “a vida”, “a luz”, “a ressurreição”, “a igreja” e todos os demais: eles não pensam [no que é certo], mas no que [não] é certo, [a menos que] tenham aprendido o que é certo. Os [nomes que foram ouvidos] existem no mundo […] [enganam. Se existissem] na era eterna,[a] não teriam sido usados como nomes no mundo, nem teriam sido colocados entre as coisas do mundo. Eles têm seu fim na era eterna.


    Há um nome que não é pronunciado no mundo: o nome que o Pai deu ao Filho. Ele está acima de tudo; é o nome do Pai, pois o Filho não teria se tornado pai se não tivesse recebido o nome do Pai. Os que têm esse nome o conhecem, mas não o dizem; e os que não o têm não o conhecem. Mas a Verdade trouxe nomes ao mundo para nós, porque nos é impossível aprendê-la[b] sem esses nomes. Há uma só Verdade, mas, para nós, ela é muitas coisas, a fim de nos ensinar esta única coisa, em amor, por meio de muitas coisas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. ou possivelmente “no éon”. A expressão designa uma era ou ordem eterna em contraste com o mundo presente.
    reason: Esclarece uma expressão cosmológica difícil sem inserir “éon” no corpo do texto.
  - marker: b
    text: Isto é, aprender a Verdade. O pronome retoma “a Verdade”.
    reason: Explicita o referente gramatical do pronome feminino em português.
lexical_decisions:
- source_word: world / worldly
  choice: mundo / do mundo
  rationale: Mantém a oposição conceitual recorrente sem tornar o texto excessivamente técnico; “os que são do mundo” é natural e preserva o sentido de pertencimento.
- source_word: what's right / what's not right
  choice: o que é certo / o que não é certo
  rationale: Conserva a repetição e o contraste deliberados do testemunho, sem substituir a ambiguidade por categorias como “verdadeiro/falso” ou “divino/material”.
- source_word: (eternal) age
  choice: era eterna
  rationale: Expressa o contraste escatológico indicado pelo testemunho e evita “eternidade”, que poderia apagar o sentido de era ou éon.
- source_word: Truth
  choice: Verdade
  rationale: A inicial maiúscula sinaliza seu uso personificado no segundo parágrafo, sem impor uma identificação teológica adicional.
- source_word: church
  choice: igreja
  rationale: É a correspondência portuguesa comum e inteligível, preservando o termo da enumeração.
- source_word: have / taken the name
  choice: têm / recebido o nome
  rationale: Mantém a linguagem de posse do nome; “recebido” harmoniza naturalmente com o Pai que o deu, sem explicar além do texto.
theological_decisions:
- issue: Sentido de “o que é certo”
  choice: Preservar literalmente o contraste “certo/não certo”
  alternative: Interpretar como “real/irreal”, “verdadeiro/falso” ou “divino/mundano”
  rationale: O testemunho fornecido não resolve o referente; explicá-lo eliminaria uma ambiguidade teológica genuína.
- issue: O Filho tornar-se “pai”
  choice: Manter “o Filho não teria se tornado pai” com “pai” em minúscula
  alternative: Emendar, harmonizar ou identificar explicitamente o Filho com o Pai
  rationale: A formulação difícil é preservada como está no testemunho; a minúscula acompanha a distinção entre tornar-se pai e o título “o Pai”, sem impor uma solução doutrinária.
- issue: Unidade e multiplicidade da Verdade
  choice: “Há uma só Verdade, mas, para nós, ela é muitas coisas”
  alternative: Reformular como muitos nomes, manifestações ou símbolos da Verdade
  rationale: Mantém a tensão metafísica do texto e não especifica em que sentido a Verdade é múltipla para nós.
- issue: Fim dos nomes na era eterna
  choice: “Eles têm seu fim na era eterna”
  alternative: “Eles deixam de existir quando chega a era eterna”
  rationale: A redação escolhida preserva a concisão e a possível ambiguidade acerca de quando e como os nomes chegam ao fim.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Foram mantidos os colchetes e a elipse que assinalam restaurações ou lacuna manuscrita. A redação é necessariamente provisória, pois o material fornecido declara que a revisão direta do copta ainda está pendente; por isso, evitam-se reconstruções além do testemunho inglês disponibilizado.
