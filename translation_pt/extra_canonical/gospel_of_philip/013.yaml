  terminology: A terminologia técnica é apropriada e não confessionalmente reducionista. “Potências” conserva a possível referência a agentes espirituais; “crisma”, “Eucaristia”, “redenção” e “câmara nupcial” preservam o vocabulário ritual; e “plenitude” mantém o termo teológico-cosmológico sem paráfrase doutrinal. “Figuras e imagens” traduz adequadamente a dupla “types and images”.
