lexical_decisions:
- source_word: world
  choice: mundo
  rationale: Mantém o termo cosmológico recorrente sem explicar se indica a ordem material, social ou espiritual.
- source_word: powers
  choice: potências
  rationale: Preserva a possível referência a poderes espirituais e evita reduzi-la a autoridades humanas.
- source_word: middle / middle places
  choice: o meio / lugares intermediários
  rationale: Conserva a terminologia espacial e escatológica do testemunho, sem identificar o lugar com uma doutrina posterior.
- source_word: rest
  choice: descanso
  rationale: Mantém o sentido de repouso escatológico sem acrescentar uma identificação explícita com céu ou salvação.
- source_word: chrism
  choice: crisma
  rationale: Emprega o termo técnico tradicional para a unção, preservando a distinção em relação ao batismo.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Tradução formal que mantém a imagem ritual e simbólica própria do texto.
- source_word: types
  choice: figuras
  rationale: Comunica formas representativas ou prefigurativas em português corrente, sem impor a terminologia teológica posterior de “tipos”.
- source_word: fullness
  choice: plenitude
  rationale: Preserva o termo cosmológico e teológico sem substituí-lo por uma interpretação como “totalidade divina”.
- source_word: redemption
  choice: redenção
  rationale: Mantém a designação ritual ou soteriológica ampla, sem especificar seu mecanismo.
theological_decisions:
- issue: Identidade e função das “potências”
  choice: Manter “potências” e o pronome explicativo no feminino plural
  alternative: Traduzir como “poderes” ou identificar como demônios
  rationale: O texto sugere agentes espirituais, mas não permite uma identificação mais estreita.
- issue: Natureza do “meio” após o mundo
  choice: Preservar “o meio” e “lugares intermediários”
  alternative: Interpretar como purgatório, inferno ou estado intermediário
  rationale: A passagem o associa à morte e ao perigo, mas sua cosmologia permanece própria e ambígua.
- issue: “Adquirir a ressurreição” durante a vida
  choice: Conservar a formulação incomum
  alternative: Parafrasear como receber a salvação ou garantir a vida eterna
  rationale: A expressão contém tensão entre experiência presente e destino futuro e não deve ser harmonizada.
- issue: “Não é a vontade, e não é o ato”
  choice: Manter literalmente a antítese fragmentária
  alternative: Explicar qual deles determina culpa ou justiça
  rationale: O encadeamento é obscuro e possivelmente depende de contexto perdido; explicá-lo resolveria indevidamente a tensão.
- issue: “Já não é um cristão, mas um Cristo”
  choice: Preservar a distinção e a restauração entre colchetes
  alternative: Suavizar para “semelhante a Cristo” ou “ungido”
  rationale: A afirmação forte pertence à teologia do texto; uma paráfrase reduziria seu impacto e alteraria seu conteúdo.
- issue: Interioridade do Pai e plenitude
  choice: Traduzir sem identificar a plenitude com uma formulação trinitária ou panteísta
  alternative: Explicitar uma ontologia divina específica
  rationale: O testemunho relaciona o Pai oculto, o interior e a plenitude, mas não autoriza uma sistematização denominacional.
- issue: Entrada e saída antes e depois de Cristo
  choice: Conservar os movimentos paradoxais
  alternative: Explicar como descida ao Hades, encarnação ou libertação de patriarcas
  rationale: Os referentes espaciais e os grupos envolvidos não estão suficientemente definidos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se colchetes e reticências para assinalar lacunas, danos ou restaurações editoriais do testemunho. Como a revisão direta do copta ainda está pendente, a redação é provisória e baseada prioritariamente no testemunho inglês público fornecido, consultando a camada POB apenas como controle. As mudanças de número e gênero foram feitas apenas quando exigidas pela fluência do português, sem eliminar ambiguidades substanciais.
