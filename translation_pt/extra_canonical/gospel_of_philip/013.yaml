translation:
  language: pt
  text: 'Quem sai do mundo já não pode ser preso, porque esteve no mundo. Revela-se que essa pessoa está acima do desejo do [… e] do medo. Ela domina sobre […]; é superior à inveja. Se […] vierem, elas — as potências — [a] prendem e sufocam. Como [poderá] escapar das [grandes potências …]? Como poderá […]? Alguns [dizem]: “Somos fiéis”, para que […] [espírito impuro] e demônio, pois, se tivessem o Espírito Santo, nenhum espírito impuro se apegaria a eles. Não tema a carne nem a ame. Se você a temer, ela o dominará; se a amar, ela o engolirá e sufocará.


    Uma pessoa existe ou neste mundo, ou na ressurreição, ou nos lugares intermediários. Que eu jamais seja encontrado ali! Neste mundo há tanto o bem como o mal. Suas coisas boas não são boas, e suas coisas más não são más. Mas, depois deste mundo, há um mal que é verdadeiramente mal: aquilo que se chama “o meio”. É a morte. Enquanto estamos neste mundo, convém adquirirmos para nós mesmos a ressurreição, para que, quando formos despidos da carne, sejamos encontrados no descanso e não atravessemos o meio, pois muitos se desviam pelo caminho.


    É bom sair do mundo antes de pecar. Alguns nem querem nem podem; outros, mesmo que quisessem, não se beneficiariam, porque não agiram. O querer faz deles pecadores. Mas, mesmo que não queiram, a justiça ainda lhes ficará oculta. Não é a vontade, e não é o ato.


    Um apóstolo viu [em uma] visão algumas pessoas confinadas numa casa em chamas e amarradas com […] ardentes, lançadas […] do ardente […] a elas em […]; e lhes disseram [… capazes] de ser salvas […] elas não quiseram, e receberam […] castigo, que se chama “as trevas [exteriores]”, porque ele […].


    A alma e o espírito vieram a existir da água e do fogo. O descendente da câmara nupcial veio da água, do fogo e da luz. O fogo é o crisma; a luz é o fogo. Não estou falando daquele fogo sem forma, mas do outro, cuja forma é branca, que é brilhante e belo e confere beleza.


    A verdade não veio nua ao mundo, mas veio em figuras e imagens. O mundo não a receberá de nenhuma outra maneira. Há um novo nascimento e uma imagem do novo nascimento. É verdadeiramente necessário ser gerado de novo por meio da imagem. O que são a ressurreição e a imagem? Por meio da imagem, é necessário que ela se levante. E a câmara nupcial e a imagem? Por meio da imagem, é necessário que entrem na verdade, que é a restauração. Isso não é necessário apenas para os que adquirem o nome do Pai, do Filho e do Espírito Santo; eles também foram adquiridos para vocês. Se alguém não os adquirir, o nome também lhe será tirado. Mas eles são recebidos no crisma do […] do poder da cruz. Os apóstolos chamaram isso de “[a] direita e a esquerda”, porque essa pessoa já não é um [cristão], mas um Cristo.


    O Senhor [fez] tudo em mistério: um batismo, um crisma, uma Eucaristia, uma redenção, uma câmara nupcial […]. Ele [disse]: “Vim tornar [o que está embaixo] semelhante ao [que está em cima, e o que está fora] semelhante ao [que está dentro, e uni-los] no lugar”. […] aqui por meio de [figuras …] Os que dizem: “[…] há um acima […”, estão errados, porque] o que se revela é que […], aquilo [que] se chama “o que está embaixo”; e o que está oculto é, em relação a ele, o que está acima dele, porque é bom. E dizem: “o interior, o que está fora e o que está fora do exterior”. Por isso, o Senhor chamou a destruição de “as trevas exteriores”. Nada existe fora delas.


    Ele disse: “Meu Pai, que está oculto”. Disse também: “Entre no seu aposento, feche a porta atrás de você e ore ao seu Pai, que está oculto”, isto é, aquele que está dentro de todos eles. Mas aquele que está dentro de todos eles é a plenitude. Para além disso, não há nada mais no interior. É isso que se chama “aquilo que está acima deles”.


    Antes de Cristo, alguns vieram de onde já não podiam entrar e foram para onde já não podiam sair. Então Cristo veio. Tirou para fora os que haviam entrado e fez entrar os que haviam saído.'
