base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: pt
  text: 'Os filhos do ser humano celestial são mais numerosos que os filhos do ser humano terreno. Se Adão tem tantos filhos, embora eles morram, quantos filhos tem o ser humano perfeito — os que não morrem, mas são gerados continuamente?


    O pai gera um filho, mas um filho não pode gerar um filho, pois quem foi gerado não pode gerar filhos; o filho gera irmãos, não filhos. Todos os que são gerados no mundo são gerados fisicamente, e os outros em […] são gerados por ele […] lá fora, para o ser humano […] no […] lugar celestial […] isso da boca […] a Palavra saiu de lá. Eles seriam alimentados pela boca [e] se tornariam perfeitos. Os perfeitos são concebidos e gerados por meio de um beijo. Por isso também nos beijamos uns aos outros, concebendo da graça que há uns nos outros.


    Havia três que acompanhavam o Senhor o tempo todo: Maria, sua mãe, a irmã dela e Madalena, chamada sua companheira; pois Maria é sua irmã, sua mãe e sua parceira.[a]


    “O Pai” e “o Filho” são nomes simples; “o Espírito Santo” é um nome duplo, porque estão em toda parte. Estão no céu e embaixo; estão ocultos e revelados. O Espírito Santo é revelado embaixo e oculto no céu.[b]


    Os santos são servidos pelos poderes malignos, porque o Espírito Santo cegou esses poderes, de modo que pensam estar servindo a um ser humano comum, quando na verdade trabalham para os santos. Assim, certo dia, um discípulo perguntou ao Senhor sobre um assunto mundano. Ele lhe disse: “Pergunte à sua Mãe, e ela lhe dará da parte de outro.”[c]


    Os apóstolos disseram aos discípulos: “Que toda a nossa oferta receba sal.” Chamavam […] de “sal”. Sem ele, a oferta não [se torna] aceitável. Mas a Sabedoria [não tem] filhos; por isso [ela é] chamada […], isto do sal, o lugar em que eles […] à sua própria maneira. O Espírito Santo […] […] muitos filhos.


    O que pertence ao pai pertence ao filho. Mas, enquanto o filho é pequeno, não lhe é confiado aquilo que é seu. Quando se torna adulto, seu pai lhe dá tudo o que lhe pertence.


    Os que foram gerados pelo Espírito e se desviam também se desviam por meio dele. Por isso, por meio desse único Espírito, ele arde — isto é, o fogo — e se apaga.[d]


    Ecamote é uma coisa, e Ecmote é outra. Ecamote é simplesmente Sabedoria, mas Ecmote é a Sabedoria da Morte, que conhece a morte. Esta é chamada “a pequena Sabedoria”.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não esclarece se “companheira” e “parceira” indicam parentesco, associação espiritual, ritual, conjugal ou outra relação. A formulação foi mantida sem harmonização.
    reason: Preservar ambiguidade relacional e tensão interna.
  - marker: b
    text: O plural “estão” segue o testemunho disponível. Seu referente exato, bem como o sentido de “nome duplo”, permanece incerto.
    reason: Sinalizar ambiguidade gramatical e conceitual sem corrigi-la por conjectura.
  - marker: c
    text: “Mãe” pode funcionar aqui como título, mas o trecho não identifica inequivocamente essa figura nem esclarece “da parte de outro”.
    reason: Evitar identificação teológica não demonstrada.
  - marker: d
    text: A referência de “ele”, a relação entre o Espírito e o fogo e o modo pelo qual alguém se desvia “por meio” do Espírito são obscuros no testemunho.
    reason: Marcar obscuridade textual e teológica genuína.
  - marker: e
    text: “Ecamote” e “Ecmote” transliteram duas formas distintas preservadas no testemunho. A semelhança entre os nomes é intencional no texto disponível.
    reason: Explicar transliteração e distinção lexical incomum.
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: ser humano celestial / ser humano terreno / ser humano perfeito
  rationale: Mantém o substantivo genérico e a repetição conceitual sem restringir o referente a um homem do sexo masculino.
- source_word: beget / begotten
  choice: gerar / gerado
  rationale: Preserva a linguagem de filiação e origem, além da repetição retórica do testemunho, com português natural.
- source_word: physically
  choice: fisicamente
  rationale: Evita ampliar o texto para formulações como “segundo a carne”, não atestadas no testemunho fornecido.
- source_word: Word
  choice: Palavra
  rationale: Conserva a possível força personificada ou teológica do termo por meio da inicial maiúscula, sem identificá-lo explicitamente com uma doutrina posterior.
- source_word: companion / partner
  choice: companheira / parceira
  rationale: Mantém dois termos distintos no trecho e não especifica a natureza das relações, que o texto não esclarece.
- source_word: single names / double name
  choice: nomes simples / nome duplo
  rationale: “Simples” expressa a oposição a “duplo” de modo idiomático, sem explicar em que sentido os nomes são contados.
- source_word: Wisdom
  choice: Sabedoria
  rationale: A inicial maiúscula preserva a provável referência personificada sem resolver sua identidade no sistema teológico do escrito.
- source_word: Echamoth / Echmoth
  choice: Ecamote / Ecmote
  rationale: Transliteração adaptada à ortografia portuguesa, mantendo distintos os dois nomes quase idênticos.
theological_decisions:
- issue: Identidade das três Marias e relações de parentesco ou parceria
  choice: Preservar literalmente a sequência “irmã, mãe e parceira” e a ambiguidade de “companheira”
  alternative: Harmonizar as personagens, entender “parceira” como esposa ou explicar as relações simbolicamente
  rationale: O trecho é internamente tenso e não oferece base suficiente para harmonização histórica ou definição matrimonial, ritual ou espiritual.
- issue: Número e referência pronominal em “porque estão em toda parte”
  choice: Manter o plural “estão”, conforme o testemunho, sem identificar com precisão seu antecedente
  alternative: Alterar para o singular e aplicar a frase somente ao Espírito Santo
  rationale: A aparente oscilação entre o nome duplo e o pronome plural é significativa e deve permanecer aberta até revisão direta do copta.
- issue: Mãe mencionada na fala do Senhor
  choice: Grafar “Mãe” com inicial maiúscula, preservando a possível função titular
  alternative: Traduzir simplesmente “mãe” ou identificar a figura como Maria ou o Espírito Santo
  rationale: O contexto pode sugerir uma figura teológica, mas não autoriza uma identificação inequívoca.
- issue: Agência do Espírito no desvio, fogo e extinção
  choice: Conservar a afirmação difícil e a referência pronominal ambígua
  alternative: Reformular para dizer que o Espírito corrige, purifica ou impede o desvio
  rationale: A sintaxe e a teologia do trecho são tensas; explicá-las introduziria interpretação não demonstrada pelo testemunho.
- issue: Sabedoria e Sabedoria da Morte
  choice: Manter como duas figuras ou conceitos nomeados, sem vinculá-los a um esquema gnóstico específico
  alternative: Inserir explicações valentinianas ou equivalências cosmológicas
  rationale: A tradução deve transmitir a distinção textual sem importar a reconstrução de uma escola teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução é provisória e se baseia no testemunho inglês de domínio público fornecido; ainda requer revisão direta do copta do Códice II de Nag Hammadi. Colchetes e reticências foram preservados para indicar lacunas, danos ou restaurações propostas. Evitaram-se harmonizações denominacionais e explicações sistemáticas não exigidas pelo texto.
