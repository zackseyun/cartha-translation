base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: pt
  text: '**Evangelho de Filipe — Vida, morte, luz e trevas**


    Os que semeiam no inverno colhem no verão. O inverno é o mundo; o verão é a outra era. Semeemos no mundo para colhermos no verão. Por isso, não é certo orarmos no inverno. O verão vem depois do inverno. Mas, se alguém colher no inverno, não colherá; arrancará pela raiz, pois esse tipo não produzirá fruto […] não apenas sai […] mas, no outro sábado […] não dá fruto.[a]


    Cristo veio comprar alguns, salvar outros e ainda redimir outros. Comprou os que eram estrangeiros, tornou-os seus e os separou como penhor, conforme quis. Não foi somente quando apareceu que entregou a vida quando quis; desde o dia em que o mundo veio a existir, ele entregou a vida quando quis. Então veio primeiro para retomá-la, pois ela havia sido dada como penhor. Ela estava sob o domínio dos ladrões que a tinham capturado, mas ele a salvou. E redimiu tanto os que são bons no mundo como os que são maus.[b]


    A luz e as trevas, a direita e a esquerda, são irmãs entre si. São inseparáveis. Portanto, os que são bons não são bons; os que são maus não são maus; a vida não é realmente vida, nem a morte é realmente morte. Por isso, cada um será dissolvido em sua origem, desde o princípio. Mas os que foram elevados acima do mundo são indissolúveis e eternos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As reticências entre colchetes assinalam lacunas ou texto incerto na testemunha manuscrita; a conexão entre as frases é, portanto, fragmentária.
    reason: Sinalizar ao leitor que a descontinuidade decorre da preservação do texto, e não de uma omissão editorial comum.
  - marker: b
    text: Os referentes de “a vida”, “retomá-la” e “ela” são difíceis de determinar com segurança neste trecho; a tradução conserva a sequência pronominal da testemunha disponível.
    reason: Preservar uma ambiguidade real do texto sem identificar silenciosamente o penhor ou aquilo que foi capturado.
lexical_decisions:
- source_word: winter / summer
  choice: inverno / verão
  rationale: Mantém a metáfora agrícola e sua identificação explícita com o mundo e a outra era.
- source_word: the other age
  choice: a outra era
  rationale: “Era” comunica uma ordem ou período escatológico sem impor a ideia mais específica de “mundo vindouro”.
- source_word: pray
  choice: orarmos
  rationale: Preserva a leitura incomum da testemunha fornecida, sem corrigi-la para outra atividade religiosa ou agrícola.
- source_word: redeem
  choice: redimir
  rationale: Distingue o verbo de “comprar” e “salvar”, preservando a sequência tripla do texto.
- source_word: pledge
  choice: penhor
  rationale: Expressa algo entregue ou separado como garantia, sem resolver a referência obscura do trecho.
- source_word: right and left
  choice: a direita e a esquerda
  rationale: Conserva o par simbólico e espacial, sem acrescentar uma interpretação moral.
- source_word: indissoluble
  choice: indissolúveis
  rationale: Mantém o contraste verbal direto com “será dissolvido”.
theological_decisions:
- issue: A afirmação de que bons não são bons, maus não são maus, vida não é vida e morte não é morte
  choice: Tradução direta, mantendo as negações e a tensão paradoxal
  alternative: Explicitar que essas realidades são apenas relativas ou aparentes
  rationale: O texto não oferece aqui uma explicação inequívoca; acrescentá-la resolveria indevidamente sua tensão teológica.
- issue: O momento em que Cristo entrega a vida
  choice: Manter tanto “quando apareceu” como “desde o dia em que o mundo veio a existir”
  alternative: Harmonizar a declaração exclusivamente com a morte histórica de Cristo
  rationale: A formulação parece deliberadamente ampliar a entrega da vida para além da manifestação histórica e deve permanecer intacta.
- issue: A redenção dos bons e dos maus
  choice: Preservar explicitamente ambos os grupos
  alternative: Restringir a redenção aos bons ou interpretar “maus” de modo qualificativo
  rationale: A testemunha inclui os dois grupos sem indicar aqui o alcance ou o resultado final dessa redenção.
- issue: O gênero figurado dos pares luz/trevas e direita/esquerda
  choice: “irmãs entre si”
  alternative: “irmãos entre si”
  rationale: Em português, todos os quatro substantivos são femininos; a concordância natural preserva a metáfora de parentesco sem masculinização artificial.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A redação mantém as metáforas, repetições e paradoxos do testemunho fornecido. Trata-se de versão provisória baseada na tradução inglesa pública indicada; a revisão direta do copta ainda está pendente.
