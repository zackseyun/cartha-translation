review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente as imagens centrais, os sinais de restauração entre colchetes, as lacunas marcadas por reticências, a oposição entre noite e dia/luz e a formulação deliberadamente difícil sobre as eras. Contudo, «pois a era (eterna) é a plenitude para ela» altera o referente plural do testemunho inglês («for them»). A formulação deve referir-se às pessoas a quem a realidade é revelada, sem resolver a dificuldade conceitual.
  naturalness: O registro é em geral claro e digno. A frase danificada sobre o fogo precisa de uma ligação mínima mais legível, sem preencher a lacuna manuscrita. «Permanece oculto» torna mais natural a repetição final, preservando o paradoxo textual de que algo está oculto em dia perfeito e luz santa.
  terminology: «Câmara nupcial», «mistérios», «Verdade», «imagens» e «plenitude» são escolhas apropriadas e não impõem interpretação confessional. «Eras (eternas)» conserva a oscilação plural/singular e o parêntese do testemunho de base.
  issues:
  - severity: medium
    issue: Pronome singular em «a plenitude para ela»
    rationale: O testemunho fornecido diz «the fullness for them», e o singular português desloca indevidamente o referente para «a era». «Para eles» preserva o plural e a referência pessoal sem explicar quem são.
  - severity: low
    issue: Articulação truncada na oração danificada sobre o fogo
    rationale: A lacuna deve permanecer, mas inserir «e» antes de «o fogo» permite ler a coordenação sem suprir conteúdo perdido. «É apagado» corresponde mais diretamente a «is put out».
  revised_text: 'Todos os que [entrarem] na câmara acenderão sua [lâmpada], porque [isso] é como os casamentos que [...] acontecem à noite, e o fogo [...] à noite e é apagado. Mas os mistérios desse casamento se cumprem no dia e na luz. Nem aquele dia nem sua luz jamais se põem.


    Se alguém se tornar filho da câmara nupcial, receberá a luz. Se alguém não a receber enquanto estiver aqui, não poderá recebê-la no outro lugar. Quem receber essa luz não será visto nem aprisionado, e ninguém poderá perturbar uma pessoa assim, mesmo enquanto ela habita no mundo. Além disso, quando deixa o mundo, ela já recebeu a Verdade nas imagens. O mundo tornou-se as eras (eternas), pois a era (eterna) é a plenitude para eles.[a] E é assim: isso é revelado somente a essas pessoas. Não está oculto na escuridão e na noite, mas permanece oculto num dia perfeito e numa luz santa.


    O Evangelho


    Segundo Filipe'
  revised_footnotes:
