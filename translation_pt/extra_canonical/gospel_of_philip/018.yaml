    text: “Era” também pode representar a ideia de uma idade, um domínio ou uma realidade duradoura. A redação entre parênteses e a alternância entre plural e singular seguem o testemunho inglês fornecido; a leitura permanece provisória até a revisão direta do copta.
    reason: Sinaliza a ambiguidade lexical e a condição provisória da base de tradução sem escolher silenciosamente uma interpretação cosmológica.
  revision_rationale: A revisão corrige o referente de «para eles», que deve permanecer plural conforme o testemunho, e melhora a legibilidade da frase lacunosa sobre o fogo sem reconstruir o texto perdido. Também preserva a repetição paradoxal de «oculto», com leve ajuste estilístico. As demais escolhas são mantidas por fidelidade à formulação provisória do testemunho inglês e à sua ambiguidade teológica.
