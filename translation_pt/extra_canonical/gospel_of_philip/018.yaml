review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura, os sinais de lacuna ([…]) e restauração ([…]), a imagem da câmara nupcial, os mistérios, a luz, a Verdade e o paradoxo final. Contudo, «filho» restringe indevidamente o inglês child, e os pronomes singulares em «para ela» e «a essas pessoas» desfazem a referência plural explícita do testemunho («for them» / «to them alone»).
  naturalness: O português é em geral claro e de registro apropriado. «Criança da câmara nupcial» evita a marcação masculina não exigida pela fonte. «Não será visto nem preso» é mais idiomático e mantém a amplitude de bound sem especificar o meio de sujeição.
  terminology: «Câmara nupcial», «mistérios», «Verdade», «imagens», «eras (eternas)» e «plenitude» são escolhas defensáveis e conservam a indeterminação conceitual do testemunho provisório. A manutenção da repetição paradoxal «está oculto ... mas está oculto» é necessária.
  issues:
  - severity: medium
    issue: «filho da câmara nupcial» traduz child com restrição de gênero.
    rationale: O testemunho inglês diz child, não son. «Criança» preserva o sentido sem introduzir uma especificação ausente.
  - severity: high
    issue: «a era (eterna) é a plenitude para ela» altera o referente plural de «for them».
    rationale: No testemunho, a plenitude é «para eles», isto é, para as pessoas em foco, e não para a era ou para uma pessoa singular.
  - severity: medium
    issue: «isso é revelado somente a essas pessoas» enfraquece a ligação pronominal com «them alone».
    rationale: «Revelado somente a eles» mantém a referência direta e o contraste enfático do texto, sem acrescentar «pessoas».
  - severity: low
    issue: «aprisionado» torna bound mais especificamente carcerário.
    rationale: «Preso» conserva em português tanto a possibilidade de detenção quanto a de sujeição, sem determinar o modo.
  revised_text: 'Todos os que [entrarem] na câmara acenderão sua [lâmpada], porque [isso] é como os casamentos que [...] acontecem à noite: o fogo [...] à noite e se apaga. Mas os mistérios desse casamento se cumprem no dia e na luz. Nem aquele dia nem sua luz jamais se põem.


    Se alguém se tornar criança da câmara nupcial, receberá a luz. Se alguém não a receber enquanto estiver aqui, não poderá recebê-la no outro lugar. Quem receber essa luz não será visto nem preso, e ninguém poderá perturbar uma pessoa assim, mesmo enquanto ela habita no mundo. Além disso, quando deixa o mundo, ela já recebeu a Verdade nas imagens. O mundo tornou-se as eras (eternas), pois a era (eterna) é a plenitude para eles.[a] E é assim: isso é revelado somente a eles. Não está oculto na escuridão e na noite, mas está oculto num dia perfeito e numa luz santa.


    O Evangelho


    Segundo Filipe'
  revised_footnotes:
  - marker: a
    text: “Era” também pode representar a ideia de uma idade, um domínio ou uma realidade duradoura. A redação entre parênteses e a alternância entre plural e singular seguem o testemunho inglês fornecido; a leitura permanece provisória até a revisão direta do copta.
    reason: Sinaliza a ambiguidade lexical e a condição provisória da base de tradução, sem escolher silenciosamente uma interpretação cosmológica.
  revision_rationale: A revisão corrige referências de número e a restrição indevida de gênero, além de tornar «bound» menos específico em português. Mantêm-se as lacunas, as restaurações, a sintaxe difícil e os aparentes paradoxos do testemunho inglês, inclusive a repetição de «oculto», pois não é seguro harmonizá-los sem revisão direta do copta.
