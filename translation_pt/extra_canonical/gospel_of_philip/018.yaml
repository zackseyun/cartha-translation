translation:
  language: pt
  text: 'Todos os que [entrarem] na câmara acenderão sua [lâmpada], porque [isso] é como os casamentos que [...] acontecem à noite: o fogo [...] à noite e se apaga. Mas os mistérios desse casamento se cumprem no dia e na luz. Nem aquele dia nem sua luz jamais se põem.


    Se alguém se tornar filho da câmara nupcial, receberá a luz. Se alguém não a receber enquanto estiver aqui, não poderá recebê-la no outro lugar. Quem receber essa luz não será visto nem aprisionado, e ninguém poderá perturbar uma pessoa assim, mesmo enquanto ela habita no mundo. Além disso, quando deixa o mundo, ela já recebeu a Verdade nas imagens. O mundo tornou-se as eras (eternas), pois a era (eterna) é a plenitude para ela.[a] E é assim: isso é revelado somente a essas pessoas. Não está oculto na escuridão e na noite, mas está oculto num dia perfeito e numa luz santa.


    O Evangelho


    Segundo Filipe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Era” também pode representar a ideia de uma idade, um domínio ou uma realidade duradoura. A redação entre parênteses e a alternância entre plural e singular seguem o testemunho inglês fornecido; a leitura permanece provisória até a revisão direta do copta.
    reason: Sinalizar uma ambiguidade lexical e a condição provisória da base de tradução sem escolher silenciosamente uma interpretação cosmológica.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: câmara / câmara nupcial
  rationale: Mantém a ligação lexical entre a primeira referência abreviada e a expressão posterior, sem substituir a imagem central por uma explicação interpretativa.
- source_word: kindle their [lamp]
  choice: acenderão sua [lâmpada]
  rationale: Expressão natural em português; os colchetes preservam a indicação de restauração textual do testemunho fornecido.
- source_word: mysteries
  choice: mistérios
  rationale: Conserva o termo religioso amplo e sua possível dimensão ritual, sem o reduzir a 'segredos'.
- source_word: bound
  choice: aprisionado
  rationale: Preserva a ideia de sujeição ou detenção com linguagem corrente, evitando restringi-la ao ato físico de amarrar.
- source_word: the (eternal) ages / the (eternal) age
  choice: as eras (eternas) / a era (eterna)
  rationale: Reproduz a oscilação entre plural e singular e mantém entre parênteses o qualificativo apresentado assim no testemunho; 'eras' é compreensível sem impor terminologia técnica.
- source_word: fullness
  choice: plenitude
  rationale: Mantém o peso conceitual do termo e evita paráfrase doutrinária.
- source_word: Truth
  choice: Verdade
  rationale: A inicial maiúscula acompanha o testemunho e permite a possível função conceitual ou personificada sem a definir.
theological_decisions:
- issue: Sentido da câmara nupcial
  choice: Manter a imagem sem explicá-la como rito, estado espiritual ou união específica
  alternative: Identificá-la explicitamente com um sacramento, iniciação ou união celestial
  rationale: O trecho não resolve por si só a natureza exata da câmara nupcial; explicitá-la importaria uma interpretação teológica.
- issue: Receber a luz nesta vida e no 'outro lugar'
  choice: Preservar a afirmação categórica do texto
  alternative: Atenuá-la ou harmonizá-la com uma doutrina posterior sobre conversão, juízo ou pós-vida
  rationale: A tensão escatológica pertence ao texto e não deve ser silenciosamente resolvida.
- issue: Verdade recebida 'nas imagens'
  choice: Traduzir literalmente a relação entre Verdade e imagens
  alternative: Explicar 'imagens' como símbolos, sacramentos ou formas celestiais
  rationale: O referente permanece ambíguo no trecho e comporta mais de uma leitura.
- issue: O mundo tornar-se as eras eternas
  choice: Conservar a formulação paradoxal e a alternância plural/singular
  alternative: Normalizar como 'o mundo tornou-se eternidade' ou 'o mundo vindouro'
  rationale: A construção difícil pode ser conceitualmente deliberada e também depende de revisão direta do copta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. Colchetes e reticências foram preservados como sinais de restauração e dano manuscrito. A formulação continua provisória porque o material fornecido declara pendente a revisão direta da fonte copta.
