base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: pt
  text: “Jesus” é um nome oculto; “Cristo” é um nome revelado. Por isso, “Jesus” não é traduzido, mas ele é chamado pelo seu nome, “Jesus”. Já o nome “Cristo”, em siríaco, é “Messias”; em grego, “Cristo”; e todos os outros o têm conforme a sua própria língua. “O Nazareno” revela o que está oculto. Cristo tem tudo dentro de si, seja ser humano, anjo, mistério ou o Pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público fornecida; a revisão direta do texto copta ainda está pendente.
    reason: A fonte indicada declara explicitamente que a análise na língua antiga ainda não foi realizada; a nota torna transparente a base documental limitada.
lexical_decisions:
- source_word: Jesus
  choice: Jesus
  rationale: Mantém o nome próprio sem tradução, em correspondência direta com o argumento do trecho.
- source_word: Christ
  choice: Cristo
  rationale: Emprega a forma portuguesa tradicional derivada do grego, preservando a distinção entre o nome oculto e o nome revelado.
- source_word: Messiah
  choice: Messias
  rationale: Usa a forma portuguesa corrente para o equivalente siríaco mencionado pela testemunha.
- source_word: The Nazarene
  choice: O Nazareno
  rationale: Conserva o título substantivado e sua função no jogo entre revelação e ocultamento.
- source_word: mystery
  choice: mistério
  rationale: Mantém a amplitude religiosa e conceitual do termo sem explicá-lo ou restringi-lo.
theological_decisions:
- issue: Alcance da afirmação de que Cristo contém tudo
  choice: Preservar a enumeração “ser humano, anjo, mistério ou o Pai” sem harmonização explicativa.
  alternative: Interpretar os itens como naturezas, categorias de seres ou títulos específicos.
  rationale: A testemunha é teologicamente densa e sintaticamente aberta; explicitar a relação importaria uma interpretação não assegurada pelo material fornecido.
- issue: Sentido de “O Nazareno revela o que está oculto”
  choice: Manter a formulação paradoxal sem explicar o mecanismo da revelação.
  alternative: Parafrasear “Nazareno” como designação que torna conhecido o nome oculto.
  rationale: O texto não esclarece de modo inequívoco o jogo etimológico ou simbólico pretendido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição deliberada dos nomes foi preservada por ser essencial ao argumento. Usou-se “siríaco”, conforme a testemunha fornecida, e evitou-se acrescentar explicações etimológicas não confirmadas pelo copta.
