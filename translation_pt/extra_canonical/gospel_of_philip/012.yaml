review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura fragmentária, os colchetes, as reticências e a maior parte das ambiguidades do testemunho inglês. Contudo, «profanado/profanam/profanação» tende a deslocar o sentido de defiled/defilement para uma violação especificamente sacra; «maculado/maculem/mácula» mantém melhor a linguagem de impureza sem pressupor profanação cultual. «Ser preso por eles» também é menos fiel à ideia de ser ligado ou ficar preso a eles.
  naturalness: O registro é em geral claro e digno. Ajustei «Pensem» para o imperativo singular impessoal mais próximo do inglês, «Pense», e «escapar de ficar preso a eles» para uma formulação portuguesa mais idiomática. Mantive «entrar no/na» apesar de sua aspereza deliberada, pois ela reproduz a metáfora espacial ambígua do texto.
  terminology: «Mistério», «casamento», «espíritos impuros», «poder masculino e feminino», «noivo e noiva» e «câmara nupcial» são escolhas adequadas. «Macular/mácula» preserva a repetição conceitual de defile/defilement sem impor uma interpretação ritual-sacral específica.
  issues:
  - severity: medium
    issue: «Profanado/profanam/profanação» para defiled/defilement
    rationale: Em português, «profanar» normalmente pressupõe que algo sagrado foi violado. O testemunho fala mais amplamente em impureza ou mancha; «macular/mácula» conserva essa abertura e a repetição lexical.
  - severity: low
    issue: «Ser preso por eles» para being bound by them
    rationale: A formulação pode sugerir captura física. «Ficar preso a eles» comunica de modo mais natural o vínculo ou aprisionamento expresso no testemunho.
  - severity: low
    issue: Imperativo plural «Pensem»
    rationale: O inglês «Think about» não marca plural. O singular «Pense» é uma exortação genérica natural e evita acrescentar número ao texto.
  revised_text: '[O] mistério do casamento [é] grande, pois [sem] ele o mundo [não existiria]; porque [a] estrutura do [mundo …], mas a estrutura [… o casamento]. Pense no [íntimo …] maculado, pois ele tem […] poder. Sua imagem existe numa [mácula].[a]



    Os espíritos impuros assumem [formas] masculinas e femininas. Os masculinos são os que têm intimidade com as almas que habitam numa forma feminina; e os femininos são os que se unem aos que estão numa forma masculina, por meio da desobediência. Ninguém poderá escapar de ficar preso a eles sem receber um poder masculino e um feminino — o noivo e a noiva — à imagem da câmara nupcial.[b] Quando as mulheres insensatas veem um homem sentado sozinho, lançam-se sobre ele, brincam com ele e o maculam. Do mesmo modo, quando os homens insensatos veem uma bela mulher sentada sozinha, seduzem-na e a constrangem, querendo maculá-la. Mas, se veem o marido e a esposa sentados juntos, as mulheres não podem entrar no marido, nem os homens na esposa. Assim acontece quando a imagem se une ao anjo: ninguém poderá ousar entrar no [masculino] ou no feminino.[c]'
