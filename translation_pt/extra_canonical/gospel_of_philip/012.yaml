translation:
  language: pt
  text: '[O] mistério do casamento [é] grande, pois [sem] ele o mundo [não existiria]; porque [a] estrutura do [mundo…], mas a estrutura [… o casamento]. Pensem no [íntimo…] profanado, pois ele tem […] poder. Sua imagem existe numa [profanação].[a]


    Os espíritos impuros assumem [formas] masculinas e femininas. Os masculinos são os que têm intimidade com as almas que habitam numa forma feminina; e os femininos são os que se unem aos que estão numa forma masculina, por meio da desobediência. Ninguém poderá escapar de ser preso por eles sem receber um poder masculino e um feminino — o noivo e a noiva — à imagem da câmara nupcial.[b] Quando as mulheres insensatas veem um homem sentado sozinho, lançam-se sobre ele, brincam com ele e o profanam. Do mesmo modo, quando os homens insensatos veem uma bela mulher sentada sozinha, seduzem-na e a constrangem, querendo profaná-la. Mas, se veem o marido e a esposa sentados juntos, as mulheres não podem entrar no marido, nem os homens na esposa. Assim acontece quando a imagem se une ao anjo: ninguém poderá ousar entrar no [masculino] ou no feminino.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes e as reticências neste parágrafo indicam restaurações ou lacunas do manuscrito. A sintaxe e o encadeamento do argumento são incertos.
    reason: O testemunho está extensamente danificado, e uma tradução fluente poderia ocultar o caráter fragmentário do texto.
  - marker: b
    text: «Câmara nupcial» pode designar aqui mais do que um aposento matrimonial, mas o trecho não define com precisão seu sentido ritual ou simbólico.
    reason: Preserva a tensão teológica sem impor uma leitura sacramental ou esotérica específica.
  - marker: c
    text: «Entrar» conserva a metáfora do texto, que pode envolver invasão espiritual e conotação sexual. O masculino aparece entre colchetes porque é uma restauração no testemunho fornecido.
    reason: A nota registra a ambiguidade sem resolvê-la e explica a marca editorial.
lexical_decisions:
- source_word: mystery of marriage
  choice: mistério do casamento
  rationale: Mantém o termo religioso «mistério» e traduz marriage de modo corrente, sem identificar antecipadamente o conceito com um sacramento ou com a câmara nupcial.
- source_word: structure
  choice: estrutura
  rationale: Conserva a formulação abstrata e repetida do testemunho, embora o contexto lacunar impeça determinar o sentido exato.
- source_word: defiled / defilement
  choice: profanado / profanação
  rationale: Preserva a dimensão de violação da pureza e a repetição lexical; «profanar» funciona tanto no campo ritual quanto no moral, sem reduzir o sentido a sujeira física.
- source_word: impure spirits
  choice: espíritos impuros
  rationale: Equivalência tradicional e clara, sem interpretar a natureza desses seres.
- source_word: are intimate with
  choice: têm intimidade com
  rationale: Mantém a possível conotação sexual sem torná-la mais explícita do que o testemunho fornecido.
- source_word: mingle with
  choice: se unem a
  rationale: Expressa associação íntima em português natural e preserva certa amplitude semântica.
- source_word: male power and a female one
  choice: um poder masculino e um feminino
  rationale: Mantém a linguagem simbólica de poderes complementares e evita substituir «poder» por essência, princípio ou energia.
- source_word: groom and bride
  choice: noivo e noiva
  rationale: Preserva a imagética nupcial e sua ligação imediata com a câmara nupcial.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Opção formal e consagrada em estudos desse escrito, preservando o caráter ritual e simbólico da expressão.
- source_word: foolish
  choice: insensatas / insensatos
  rationale: Português digno e compreensível, menos coloquial que «tolos», mantendo o juízo negativo.
- source_word: coerce
  choice: constrangem
  rationale: Comunica pressão ou coerção sem especificar um mecanismo não presente no testemunho.
- source_word: go inside
  choice: entrar em / no / na
  rationale: Retém a metáfora espacial e sua ambiguidade potencialmente sexual ou espiritual, sem explicá-la no corpo do texto.
- source_word: angel
  choice: anjo
  rationale: Transliteração conceitual direta; não se define a função ou identidade da figura.
theological_decisions:
- issue: Natureza do «mistério do casamento»
  choice: Manter a expressão sem explicá-la como matrimônio comum, rito sacramental ou união celestial.
  alternative: Traduzir ou glosar como «sacramento do matrimônio» ou «mistério da câmara nupcial».
  rationale: O trecho é fragmentário e associa casamento, imagem e câmara nupcial, mas não autoriza resolver a relação entre esses conceitos.
- issue: Sentido do par masculino-feminino
  choice: Preservar a linguagem simbólica de formas e poderes masculinos e femininos.
  alternative: Reformular como gêneros humanos, componentes psíquicos ou entidades cósmicas.
  rationale: Qualquer dessas identificações importaria uma interpretação teológica não estabelecida pelo testemunho.
- issue: Referência da imagem unida ao anjo
  choice: Conservar literalmente «a imagem se une ao anjo».
  alternative: Explicar «imagem» como pessoa, alma, contraparte celeste ou eu verdadeiro.
  rationale: A referência permanece teologicamente ambígua no excerto e deve continuar aberta.
- issue: Desobediência
  choice: Manter «por meio da desobediência» ligado ao ato de união dos espíritos femininos.
  alternative: Explicitar a quem ou a quê se desobedece.
  rationale: O objeto da desobediência não é indicado no testemunho fornecido.
- issue: Proteção do marido e da esposa
  choice: Preservar a afirmação metafórica de que os espíritos não podem «entrar» neles quando estão juntos.
  alternative: Interpretar como imunidade espiritual conferida pelo casamento ou pelo rito da câmara nupcial.
  rationale: O texto estabelece uma analogia, mas sua mecânica e alcance teológicos não são suficientemente claros.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com registro digno. A tradução é necessariamente provisória porque se baseia no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente. Colchetes e reticências foram preservados como sinais editoriais de restauração e dano manuscrito. Evitaram-se paráfrases doutrinárias, sobretudo quanto ao casamento, à câmara nupcial, aos poderes masculino e feminino e ao anjo.
