translation:
  language: pt
  text: 'Jesus tomou a todos de modo oculto, pois não apareceu como era, mas apareceu como [eles] seriam capazes de vê-lo. Apareceu-lhes (de) [todas estas] (maneiras): [apareceu] aos grandes como grande; [apareceu] aos pequenos como pequeno; [apareceu] aos anjos como anjo e aos seres humanos como ser humano. Assim, sua Palavra se ocultou de todos. Alguns de fato o viram, pensando que viam a si mesmos. Mas, quando apareceu em glória aos seus discípulos no monte, não era pequeno. Tornou-se grande, mas também tornou grandes os discípulos, para que fossem capazes de vê-lo como grande.


    Naquele dia, na Eucaristia, ele disse: “Tu que uniste a luz perfeita ao Espírito Santo, une também os anjos a nós, com as imagens!”


    Não despreze o cordeiro, pois sem ele é impossível ver a porta. Ninguém poderá aproximar-se do rei estando nu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público fornecida. Os colchetes e parênteses no corpo do texto preservam os sinais editoriais de restauração, lacuna ou incerteza dessa testemunha; a revisão direta do copta ainda está pendente.
    reason: Informa com transparência a base textual indireta e explica os sinais editoriais sem ocultar o estado provisório da tradução.
lexical_decisions:
- source_word: by stealth
  choice: de modo oculto
  rationale: Mantém a ideia de uma ação encoberta ou não percebida sem especificar engano, surpresa ou captura, sentidos que a testemunha inglesa não permite decidir com segurança.
- source_word: his Word
  choice: sua Palavra
  rationale: Conserva a possível dimensão personificada e teológica do termo, sem explicá-lo como mera fala ou mensagem.
- source_word: Eucharist
  choice: Eucaristia
  rationale: Emprega o termo litúrgico corrente correspondente à testemunha, sem ampliar sua função no contexto.
- source_word: images
  choice: imagens
  rationale: Preserva o termo concreto e sua relação sintática ambígua com “nós” e “anjos”, sem identificar quem ou o que seriam as imagens.
- source_word: lamb
  choice: cordeiro
  rationale: Traduz literalmente a imagem, sem decidir se sua função é cristológica, ritual, simbólica ou ligada a vestimenta.
- source_word: naked
  choice: estando nu
  rationale: Mantém tanto a leitura corporal quanto possíveis sentidos rituais ou simbólicos, sem os resolver no texto.
theological_decisions:
- issue: Aparições de Jesus segundo a capacidade dos observadores
  choice: Preservar a linguagem de mudança de aparência e de grandeza dos discípulos
  alternative: Explicar o trecho como mera acomodação perceptiva ou visão espiritual
  rationale: A passagem mantém tensão entre a forma de Jesus, a percepção dos observadores e a transformação dos discípulos; a tradução não deve impor uma teoria cristológica.
- issue: A Palavra de Jesus oculta de todos
  choice: Usar “sua Palavra se ocultou”
  alternative: Traduzir como “ele ocultou sua mensagem” ou identificar explicitamente a Palavra com uma pessoa divina
  rationale: A formulação reflexiva conserva a personificação e a ambiguidade da testemunha.
- issue: União da luz, do Espírito, dos anjos e das imagens
  choice: Manter a estrutura invocativa e a ligação ambígua de “com as imagens”
  alternative: Reorganizar a frase para definir se as imagens pertencem aos anjos ou aos participantes
  rationale: A sintaxe e a teologia da frase são incertas; uma explicitação resolveria indevidamente a relação entre seus elementos.
- issue: Cordeiro, porta, rei e nudez
  choice: Conservar as imagens sem interpretação adicional
  alternative: Identificar o cordeiro, a porta ou a veste com Cristo, batismo, Eucaristia ou vestidura espiritual
  rationale: O trecho pode admitir associações simbólicas diversas, mas a testemunha fornecida não autoriza escolher uma delas no corpo do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de “apareceu” e “grande/pequeno” foi mantida por sua função retórica. Evitaram-se paráfrases doutrinárias, e a sintaxe incomum da fala eucarística foi conservada tanto quanto possível para não eliminar ambiguidades genuínas.
