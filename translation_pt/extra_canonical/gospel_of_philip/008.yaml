source:
  text: 'Jesus took all of them by stealth, because he didn''t appear as he was, but he appeared as [they''d] be able to see him. He appeared to them (in) [all these] (ways): he [appeared] to [the] great as great. He [appeared] to the small as small. He [appeared] [to the] angels as an angel, and to humans as a human. So his Word hid itself from everyone. Some did see him, thinking they were seeing themselves. But when he appeared to his disciples in glory on the mountain, he wasn''t small. He became great, but he made the disciples great (too) so that they would be able to see him as great.


    He said on that day in the Eucharist, "You who''ve united the perfect light with the Holy Spirit, unite the angels with us too, with the images!"


    Don''t despise the lamb, because without him it''s impossible to see the door. No one will be able to approach the king naked.'
