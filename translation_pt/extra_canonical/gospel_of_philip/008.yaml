review_pass:
  verdict: revise
  source_fidelity: A tradução preserva de modo geral a estrutura, as repetições e as ambiguidades teológicas da testemunha inglesa provisória, inclusive os colchetes, os parênteses e as imagens finais. «Sua Palavra» e «imagens» são escolhas adequadamente não interpretativas. Contudo, «tomou a todos de modo oculto» é pouco idiomático em português e enfraquece a concisão enigmática de “took all of them by stealth”.
  naturalness: 'O registro é claro e digno. Há apenas uma melhoria segura de fluência: «Jesus tomou todos às ocultas» é mais natural e compacto que «Jesus tomou a todos de modo oculto», sem resolver o sentido obscuro da ação. O restante pode permanecer, inclusive a sintaxe deliberadamente incomum da fala eucarística.'
  terminology: «Palavra», «Eucaristia», «Espírito Santo», «anjos», «imagens», «cordeiro», «porta» e «rei» são terminologicamente adequados. «Estando nu» mantém corretamente a imagem sem impor uma leitura ritual ou simbólica.
  issues:
  - severity: low
    issue: Formulação pouco natural na abertura
    rationale: «Tomou a todos de modo oculto» soa calcada e excessivamente pesada. «Tomou todos às ocultas» conserva a noção de ação furtiva/oculta, bem como a ambiguidade da testemunha, em português mais corrente.
  revised_text: 'Jesus tomou todos às ocultas, pois não apareceu como era, mas apareceu como [eles] seriam capazes de vê-lo. Apareceu-lhes (de) [todas estas] (maneiras): [apareceu] aos grandes como grande; [apareceu] aos pequenos como pequeno; [apareceu] aos anjos como anjo e aos seres humanos como ser humano. Assim, sua Palavra se ocultou de todos. Alguns de fato o viram, pensando que viam a si mesmos. Mas, quando apareceu em glória aos seus discípulos no monte, não era pequeno. Tornou-se grande, mas também tornou grandes os discípulos, para que fossem capazes de vê-lo como grande.



    Naquele dia, na Eucaristia, ele disse: “Tu que uniste a luz perfeita ao Espírito Santo, une também os anjos a nós, com as imagens!”



    Não despreze o cordeiro, pois sem ele é impossível ver a porta. Ninguém poderá aproximar-se do rei estando nu.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público fornecida. Os colchetes e parênteses no corpo do texto preservam os sinais editoriais de restauração, lacuna ou incerteza dessa testemunha; a revisão direta do copta ainda está pendente.
