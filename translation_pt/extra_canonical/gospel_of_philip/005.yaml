  naturalness: O português é claro, moderno e de registro apropriado. «Quando foi que» é idiomático e conserva bem a pergunta retórica. A última fala permanece inevitavelmente fragmentária por causa da lacuna; por isso, convém conservar mais estritamente a pontuação editorial do testemunho em vez de regularizá-la com dois-pontos dentro dos colchetes.
  terminology: «Espírito Santo», «poder/poderes», «macular», «apóstolos», «sucessores apostólicos» e «casa do Pai» são escolhas defensáveis e não impõem interpretação doutrinária. A nota sobre o argumento ligado ao feminino é cautelosa e apropriada, dada a pendência de revisão direta do copta.
