    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: pt
  text: 'Alguns dizem: “Maria concebeu pelo Espírito Santo”. Estão enganados; não sabem o que estão dizendo. Quando foi que uma mulher concebeu por meio de uma mulher?[a] “Maria é a virgem que nenhum poder maculou” é o grande testemunho daqueles hebreus que se tornaram (os primeiros) apóstolos e (os) sucessores apostólicos. A virgem que nenhum poder maculou […] os poderes macularam a si mesmos.[b]


    E o Senhor [não teria] dito: “meu [Pai que está no] céu”, se [ele] não tivesse outro pai. Em vez disso, teria dito simplesmente: [“meu Pai”.] O Senhor disse aos [discípulos: “…] [de] cada [casa] e tragam para a casa do Pai, mas não roubem (coisa alguma) da casa do Pai nem a levem embora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O argumento trata o Espírito como feminino. Isso provavelmente reflete o gênero e as associações do termo em um ambiente linguístico semítico; a revisão direta do copta ainda está pendente.
    reason: A lógica da pergunta não é evidente em português, onde “Espírito” é masculino, mas a nota evita transformar uma provável explicação em certeza.
  - marker: b
    text: Os colchetes e as reticências assinalam texto perdido, incerto ou restaurado no testemunho disponível.
    reason: Informa o leitor de que a interrupção não é uma omissão livre da tradução.
lexical_decisions:
- source_word: conceived by
  choice: concebeu pelo / concebeu por meio de
  rationale: Mantém a relação expressa no testemunho sem introduzir a formulação interpretativa “por obra de”; na pergunta seguinte, “por meio de” torna explícito o valor instrumental necessário ao argumento.
- source_word: power / powers
  choice: poder / poderes
  rationale: Preserva a ambiguidade entre poder abstrato e entidades cósmicas personificadas, sem impor “potestades” como categoria técnica.
- source_word: defiled
  choice: maculou / macularam
  rationale: Conserva tanto a possível conotação sexual quanto a ideia mais ampla de contaminação ou desonra, além de repetir a mesma raiz nos dois membros da frase.
- source_word: apostolic successors
  choice: sucessores apostólicos
  rationale: É uma tradução direta e legível, mantendo os parênteses do testemunho fornecido para assinalar a condição editorial da expressão.
- source_word: Father’s house
  choice: casa do Pai
  rationale: Mantém a repetição e a possível dimensão simbólica sem explicá-la no corpo do texto.
theological_decisions:
- issue: Contestação da afirmação de que Maria concebeu pelo Espírito Santo
  choice: Traduzir a contestação de modo direto, sem harmonização com relatos canônicos
  alternative: Reformular ou explicar a passagem à luz de doutrinas cristãs posteriores
  rationale: O trecho apresenta deliberadamente uma tensão teológica que deve permanecer visível.
- issue: O argumento “uma mulher por meio de uma mulher”
  choice: Preservar literalmente o gênero feminino do argumento e acrescentar nota explicativa cautelosa
  alternative: Substituir “mulher” por “ser feminino” ou eliminar a repetição
  rationale: A forma desconcertante pertence ao raciocínio do texto e não deve ser corrigida silenciosamente.
- issue: Referência do Senhor a “outro pai”
  choice: Manter “outro pai” sem identificar esse pai
  alternative: Interpretá-lo explicitamente como pai terreno, pai adotivo ou entidade cosmológica
  rationale: O testemunho não resolve a referência; a tradução preserva essa ambiguidade.
- issue: Poderes que maculam a si mesmos
  choice: Manter a formulação reflexiva e a possível personificação
  alternative: Explicar os poderes como autoridades humanas ou seres cósmicos
  rationale: A identidade dos “poderes” permanece aberta no trecho.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A redação é provisória porque a base fornecida é um testemunho inglês de domínio público e a revisão direta do copta está pendente. Mantiveram-se colchetes, reticências e parênteses como sinais textuais/editoriais do testemunho, sem reconstruir lacunas nem suavizar tensões teológicas.
