review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva em geral a sequência, as lacunas assinaladas e as formulações teologicamente incomuns da testemunha inglesa. Contudo, há uma ambiguidade referencial relevante no primeiro parágrafo: «eles se tornam imortais» pode referir-se aos corantes, enquanto a testemunha refere-se às pessoas tingidas. Também foi necessário corrigir «neles» para a relação expressa pela testemunha («por eles») e restituir «escravo», em lugar de qualquer possível atenuação para «servo». A revisão direta do copta permanece pendente.'
  naturalness: O registro é moderno, legível e adequadamente sóbrio. Foram feitos pequenos ajustes de coesão, sobretudo na alternância indevida entre «vocês» e «você», na formulação da imagem do jumento e na redação final sobre o dom recebido.
  terminology: «Tintureiro», «corantes», «sopro», «mistério», «companheira», «Eucaristia» e «Filho da Humanidade» são escolhas defensáveis para esta base. Mantêm-se «comedor de seres humanos» e «escravo», pois suavizá-los reduziria a força ou a precisão da testemunha. As etimologias internas continuam tratadas como jogos antigos, não como linguística moderna.
  issues:
  - severity: medium
    issue: Referente ambíguo de «eles se tornam imortais»
    rationale: Após «os corantes dele são imortais», o pronome português pode retomar imediatamente «corantes», mas a testemunha afirma que os que foram tingidos se tornam imortais por meio das cores divinas.
  - severity: medium
    issue: «aquilo que foi tingido neles» não representa adequadamente a relação da imagem
    rationale: A testemunha diz que os corantes morrem com aquilo que foi tingido neles; em português, «tingido neles» sugere que o objeto foi tingido dentro dos corantes. «Aquilo que tingiram» preserva melhor a relação sem explicar a metáfora.
  - severity: low
    issue: Oscilação não motivada entre «vocês» e «você»
    rationale: O parágrafo da visão inicia no plural e passa ao singular. A uniformização no singular produz leitura mais natural sem alterar a afirmação.
  - severity: low
    issue: «percebeu que ainda estava» acrescenta um ato mental ao jumento
    rationale: A testemunha apenas diz que ele se encontrou no mesmo lugar. «Ainda se encontrava» é mais próximo e mais neutro.
  revised_text: 'Deus é tintureiro. Assim como os bons corantes — chamados de verdadeiros — morrem com aquilo que tingiram, assim também acontece com os que foram tingidos por Deus. Como os corantes dele são imortais, os que foram tingidos por ele tornam-se imortais por meio de suas cores. Mas Deus batiza em água.


    É impossível alguém ver qualquer coisa que realmente existe sem se tornar semelhante a ela. Não é como acontece com a pessoa que está no mundo: ela vê o sol sem se tornar sol e vê o céu, a terra e tudo o mais sem se tornar essas coisas. É assim que acontece. Mas você viu algo daquele lugar e se tornou como isso. Você viu o Espírito e se tornou espírito; viu Cristo e se tornou Cristo; viu [o Pai e] se tornará pai. Por isso, [aqui] você vê tudo, mas não [vê a si mesmo]; lá, porém, vê a si mesmo, pois [se tornará] aquilo que vê.


    A fé recebe; o amor dá. [Ninguém poderá] [receber] sem fé, e ninguém poderá dar sem amor. Por isso cremos, a fim de receber; mas damos, a fim de amar, pois quem não dá com amor não tira proveito algum disso. Quem ainda não recebeu o Senhor continua sendo hebreu.


    Os apóstolos que vieram antes de nós o chamavam de “Jesus, o Nazareno Messias”, isto é, “Jesus, o Nazareno Cristo”. O último nome é “Cristo”; o primeiro, “Jesus”; e o do meio, “o Nazareno”. “Messias” tem dois sentidos: “Cristo” e “o medido”. “Jesus”, em hebraico, é “a redenção”. “Nazara” é “a verdade”. Portanto, “o Nazareno” é “a verdade”. “Cristo” é aquele que foi medido. “O Nazareno” e “Jesus” são os que foram medidos.[a]


    Uma pérola não perde valor se for lançada na lama, nem ganha mais valor se for ungida com bálsamo; ela é sempre valiosa para seu dono. Assim também acontece com os filhos de Deus: onde quer que estejam, continuam valiosos para seu Pai.


    Se você disser: “Sou judeu”, ninguém se comoverá. Se disser: “Sou romano”, ninguém ficará perturbado. Se disser: “Sou grego”, “bárbaro”, “escravo”, [“uma pessoa livre”], ninguém ficará inquieto. [Se] você [disser]: “Sou cristão”, o […] estremecerá. Se ao menos [… desse] tipo, este [que …] não será capaz de suportar [ouvir] o nome dele.


    Deus é comedor de seres humanos. Por isso, o ser humano é [sacrificado] a ele. Antes que o ser humano fosse sacrificado, sacrificavam-se animais, pois aqueles a quem eram oferecidos os sacrifícios não eram deuses.[b]


    Recipientes de vidro e de cerâmica vêm a existir por meio do fogo. Mas, se os recipientes de vidro se quebram, são refeitos, pois vieram a existir por meio de um sopro; se os de cerâmica se quebram, são destruídos, pois vieram a existir sem sopro.


    Um jumento que fazia girar uma pedra de moinho percorreu cem milhas. Quando foi solto, ainda se encontrava no mesmo lugar. Muitas pessoas viajam, mas não chegam a lugar algum. Ao cair da tarde, não viram cidade nem aldeia, nem coisa criada ou natural, nem poder nem anjo. Os infelizes trabalharam em vão.


    A Eucaristia é Jesus, pois em siríaco ele é chamado “Pharisatha”, isto é, “aquele que está estendido”, porque Jesus veio crucificar o mundo.[c]


    O Senhor entrou na tinturaria de Levi. Pegou setenta e duas cores e as lançou na tina. Tirou todas elas brancas e disse: “Foi assim que o Filho da Humanidade veio [como] tintureiro.”[d]


    A Sabedoria chamada “a estéril” é a Mãe [dos anjos] e [a] companheira de [… Maria] Madalena [… amava-a] mais do que aos discípulos [… ele] beijava-a em seu [… muitas] vezes. Os demais […] […] disseram-lhe: “Por que você a ama mais do que a todos nós?” O Salvador lhes respondeu: “Por que não amo vocês como a ela? Quando uma pessoa cega e outra que enxerga estão ambas no escuro, não há diferença entre elas. Quando a luz chega, a que enxerga verá a luz, mas a cega permanecerá no escuro.”


    O Senhor disse: “Feliz aquele que existe antes de existir, pois os que existem existiram e existirão.”[e]


    A superioridade da humanidade não se manifesta, mas existe no que está oculto. Por isso, ela domina animais que são mais fortes e maiores, tanto no que se manifesta como no que está oculto. Isso lhes permite sobreviver; mas, se a humanidade se separa deles, eles se matam, mordem e devoram uns aos outros, pois não encontraram alimento. Agora, porém, encontraram alimento, porque a humanidade cultivou a terra.[f]


    Se alguém desce à água, sobe sem ter recebido coisa alguma e diz: “Sou cristão”, tomou o nome emprestado a juros. Mas, se recebe o Espírito Santo, possui o nome como dom. Quem recebeu um dom não o perde; mas quem o tomou emprestado a juros precisa devolvê-lo. É assim que acontece quando alguém vem a existir em um mistério.'
