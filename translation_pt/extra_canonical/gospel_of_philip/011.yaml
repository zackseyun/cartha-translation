translation:
  language: pt
  text: 'Deus é tintureiro. Assim como os bons corantes — chamados de verdadeiros — morrem com aquilo que foi tingido neles, assim também acontece com os que foram tingidos por Deus. Como os corantes dele são imortais, eles se tornam imortais por meio de suas cores. Mas Deus batiza em água.


    É impossível alguém ver qualquer coisa que realmente existe sem se tornar semelhante a ela. Não é como acontece com a pessoa que está no mundo: ela vê o sol sem se tornar sol e vê o céu, a terra e tudo o mais sem se tornar essas coisas. É assim que acontece. Mas vocês viram algo daquele lugar e se tornaram essas coisas. Você viu o Espírito e se tornou espírito; viu Cristo e se tornou Cristo; viu [o Pai e] se tornará pai. Por isso, [aqui] você vê tudo, mas não [vê a si mesmo]; lá, porém, vê a si mesmo, pois [se tornará] aquilo que vê.


    A fé recebe; o amor dá. [Ninguém poderá] [receber] sem fé, e ninguém poderá dar sem amor. Por isso cremos, a fim de receber; mas damos, a fim de amar, pois quem não dá com amor não tira proveito algum disso. Quem ainda não recebeu o Senhor continua sendo hebreu.


    Os apóstolos que vieram antes de nós o chamavam de “Jesus, o Nazareno Messias”, isto é, “Jesus, o Nazareno Cristo”. O último nome é “Cristo”; o primeiro, “Jesus”; e o do meio, “o Nazareno”. “Messias” tem dois sentidos: “Cristo” e “o medido”. “Jesus”, em hebraico, é “a redenção”. “Nazara” é “a verdade”. Portanto, “o Nazareno” é “a verdade”. “Cristo” é aquele que foi medido. “O Nazareno” e “Jesus” são os que foram medidos.[a]


    Uma pérola não perde valor se for lançada na lama, nem ganha mais valor se for ungida com bálsamo; ela é sempre valiosa para seu dono. Assim também acontece com os filhos de Deus: onde quer que estejam, continuam valiosos para seu Pai.


    Se você disser: “Sou judeu”, ninguém se comoverá. Se disser: “Sou romano”, ninguém ficará perturbado. Se disser: “Sou grego”, “bárbaro”, “escravo”, [“uma pessoa livre”], ninguém ficará inquieto. [Se] você [disser]: “Sou cristão”, o […] estremecerá. Quem dera [… desse] tipo, este que […] não será capaz de suportar [ouvir] o nome dele.


    Deus é comedor de seres humanos. Por isso, o ser humano é [sacrificado] a ele. Antes que o ser humano fosse sacrificado, sacrificavam-se animais, pois aqueles a quem eram oferecidos os sacrifícios não eram deuses.[b]


    Recipientes de vidro e de cerâmica vêm a existir por meio do fogo. Mas, se os recipientes de vidro se quebram, são refeitos, pois vieram a existir por meio de um sopro; se os de cerâmica se quebram, são destruídos, pois vieram a existir sem sopro.


    Um jumento que fazia girar uma pedra de moinho percorreu cem milhas. Quando foi solto, percebeu que ainda estava no mesmo lugar. Muitas pessoas viajam, mas não chegam a lugar algum. Ao cair da tarde, não viram cidade nem aldeia, nem coisa criada ou natural, nem poder nem anjo. Os infelizes trabalharam em vão.


    A Eucaristia é Jesus, pois em siríaco ele é chamado “Pharisatha”, isto é, “aquele que está estendido”, porque Jesus veio crucificar o mundo.[c]


    O Senhor entrou na tinturaria de Levi. Pegou setenta e duas cores e as lançou na tina. Tirou todas elas brancas e disse: “Foi assim que o Filho da Humanidade veio [como] tintureiro.”[d]


    A Sabedoria chamada “a estéril” é a Mãe [dos anjos] e [a] companheira de [… Maria] Madalena. [… amava-a] mais do que aos discípulos [… ele] a beijava em seu [… muitas] vezes. Os demais […] […] disseram-lhe: “Por que você a ama mais do que a todos nós?” O Salvador lhes respondeu: “Por que não amo vocês como a ela? Quando uma pessoa cega e outra que enxerga estão ambas no escuro, não há diferença entre elas. Quando a luz chega, a que enxerga verá a luz, mas a cega permanecerá no escuro.”


    O Senhor disse: “Feliz aquele que existe antes de existir, pois os que existem existiram e existirão.”[e]


    A superioridade da humanidade não se manifesta, mas existe no que está oculto. Por isso, ela domina animais que são mais fortes e maiores, tanto no que se manifesta como no que está oculto. Isso lhes permite sobreviver; mas, se a humanidade se separa deles, eles se matam, mordem e devoram uns aos outros, pois não encontraram alimento. Agora, porém, encontraram alimento, porque a humanidade cultivou a terra.[f]


    Se alguém desce à água, sobe sem ter recebido coisa alguma e diz: “Sou cristão”, tomou o nome emprestado a juros. Mas, se recebe o Espírito Santo, possui o nome como dom. De quem recebeu um dom, ele não é tomado; mas quem o tomou emprestado a juros precisa devolvê-lo. É assim que acontece quando alguém vem a existir em um mistério.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As etimologias e os jogos de palavras deste parágrafo refletem associações antigas transmitidas pelo texto e não correspondem necessariamente à linguística histórica moderna.
    reason: Evita que o leitor tome as explicações etimológicas do autor como equivalências filológicas consensuais.
  - marker: b
    text: A expressão “comedor de seres humanos” é intencionalmente abrupta. O trecho não explica de maneira inequívoca se fala de sacrifício, martírio, Eucaristia ou de outra imagem ritual.
    reason: Preserva o choque e a ambiguidade teológica sem impor uma interpretação.
  - marker: c
    text: “Pharisatha” é a forma transmitida pela testemunha consultada; a explicação “aquele que está estendido” pertence ao próprio texto. “Crucificar o mundo” também pode evocar uma inversão na qual o mundo é posto na cruz.
    reason: Sinaliza um termo siríaco e um jogo interpretativo difíceis sem reescrever o texto principal.
  - marker: d
    text: “Filho da Humanidade” conserva a formulação peculiar da testemunha consultada; pode corresponder ao título tradicionalmente traduzido como “Filho do Homem”.
    reason: Registra a alternativa conhecida sem apagar a particularidade da base disponível.
  - marker: e
    text: A frase paradoxal foi mantida sem explicar se “existir antes de existir” se refere a preexistência, conhecimento, geração espiritual ou outra ideia.
    reason: Preserva a tensão metafísica do texto.
  - marker: f
    text: Os referentes de alguns pronomes neste parágrafo são incertos. A tradução entende que os animais sobrevivem sob o domínio humano e encontram alimento por causa do cultivo da terra.
    reason: Torna transparente uma decisão necessária em uma passagem de referência gramatical obscura.
lexical_decisions:
- source_word: dyer / dyes / dyed
  choice: tintureiro / corantes / tingidos
  rationale: Mantém a metáfora artesanal e distingue de modo natural em português o agente, a substância e o resultado.
- source_word: 'true'
  choice: verdadeiros
  rationale: Preserva a qualificação incomum dos bons corantes sem interpretá-la como apenas duráveis ou autênticos.
- source_word: Son of Humanity
  choice: Filho da Humanidade
  rationale: Conserva a forma peculiar da testemunha fornecida, sem normalizá-la automaticamente para o título bíblico tradicional “Filho do Homem”.
- source_word: human-eater
  choice: comedor de seres humanos
  rationale: Retém deliberadamente a formulação chocante e não a suaviza por paráfrase teológica.
- source_word: breath
  choice: sopro
  rationale: Preserva a possível ressonância entre sopro, fôlego e espírito sem decidir por “Espírito”.
- source_word: power
  choice: poder
  rationale: Mantém a possível referência a uma entidade celeste sem explicitar uma hierarquia angelical.
- source_word: mystery
  choice: mistério
  rationale: Evita substituir por “sacramento”, termo que introduziria uma tradição eclesial específica.
- source_word: companion
  choice: companheira
  rationale: Traduz de forma direta sem especificar a natureza da relação.
- source_word: Pharisatha
  choice: Pharisatha
  rationale: Mantém a transliteração apresentada pela testemunha, acompanhada da glosa do próprio texto.
theological_decisions:
- issue: Transformação daquele que contempla realidades celestes
  choice: Preservar literalmente “tornou-se espírito/Cristo” e “se tornará pai”
  alternative: Explicar como semelhança moral, participação sacramental ou união mística
  rationale: O texto afirma transformação ou assimilação de modo forte; especificar sua mecânica resolveria indevidamente a tensão.
- issue: “Quem ainda não recebeu o Senhor continua sendo hebreu”
  choice: Manter a afirmação sem harmonização
  alternative: Reformular como contraste entre antiga e nova aliança
  rationale: A frase é polêmica e obscura; uma explicação confessional importaria uma leitura não expressa.
- issue: Deus como “comedor de seres humanos”
  choice: Conservar a expressão e a sequência sacrificial
  alternative: Interpretar explicitamente como metáfora da Eucaristia ou do martírio
  rationale: A relação pretendida não é explicada com segurança na testemunha.
- issue: A Eucaristia “é Jesus”
  choice: Traduzir a predicação direta
  alternative: Atenuar para “representa Jesus” ou desenvolver uma doutrina de presença real
  rationale: A formulação deve permanecer forte, mas sem ser convertida em definição denominacional.
- issue: Maria Madalena como “companheira”
  choice: Usar “companheira” sem qualificação
  alternative: Traduzir como esposa, consorte, discípula íntima ou parceira ministerial
  rationale: A natureza da relação permanece ambígua e o manuscrito está danificado no entorno.
- issue: Batismo e recepção do Espírito Santo
  choice: Manter a distinção entre entrar na água, receber e possuir o nome como dom
  alternative: Identificar automaticamente o recebimento com um rito ou ordem sacramental específicos
  rationale: O trecho sugere uma teologia iniciática, mas não autoriza a imposição de uma sistematização posterior.
translation_notes:
  register: Português moderno, corrente e digno, com leitura natural no Brasil e compreensão internacional ampla. Mantiveram-se colchetes e reticências para indicar restaurações e lacunas da testemunha. O texto é um rascunho de publicação baseado na testemunha inglesa pública fornecida; a revisão direta do copta do Códice de Nag Hammadi II,3 continua necessária. Formulações incomuns foram preservadas, sem harmonização confessional.
