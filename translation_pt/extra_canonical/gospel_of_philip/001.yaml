review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a sequência argumentativa e as ambiguidades teológicas do testemunho inglês. Contudo, ela omite alguns sinais editoriais relevantes do texto-base: os colchetes em “[those]”, os parênteses em “(another)” e “(only)”. Também “passou a viver” interpreta o perfeito “has lived” como início de uma nova condição, em vez de conservar a formulação mais aberta “viveu”.'
  naturalness: O português é claro, moderno e de registro adequado. A repetição de “mortos”, “vivos” e “herdam” foi corretamente mantida. Pequenos ajustes tornam a primeira frase mais natural sem apagar a restauração editorial, e evitam que “pelo contrário” acrescente uma relação argumentativa mais forte do que o simples “mas” da testemunha.
  terminology: “Hebreu”, “prosélito”, “escravo”, “Verdade”, “gentio”, “herança”, “mortos” e “vivos” são escolhas adequadas. “Órfãos de pai” comunica corretamente “fatherless”. “Embelezadas” permanece uma solução provisória aceitável para o termo inglês incerto “gentrified”, com nota apropriada.
  issues:
  - severity: medium
    issue: Sinais de restauração e de suplementação foram parcialmente omitidos.
    rationale: O rascunho elimina os colchetes de “[those]” e os parênteses de “(another)” e “(only)”. Como o projeto declara preservar os sinais de dano e restauração do manuscrito, eles devem permanecer visíveis também nesses pontos.
  - severity: medium
    issue: “Quem creu na Verdade passou a viver” intensifica o aspecto verbal.
    rationale: A testemunha diz “Whoever has believed in the Truth has lived”. “Passou a viver” sugere explicitamente a entrada em uma vida nova; “viveu” conserva melhor a concisão e a ambiguidade do original intermediário.
  - severity: low
    issue: “Pelo contrário” acrescenta uma oposição explicativa.
    rationale: A testemunha emprega apenas “but”. “Mas” mantém a justaposição paradoxal sem reforçar interpretativamente a relação lógica.
  revised_text: 'Um hebreu gera um hebreu, e [os] desse tipo são chamados “prosélitos”. Mas um [prosélito] não gera (outro) prosélito. Eles são como […] e geram outros […]; basta-lhes vir à existência.[a]



    O escravo busca apenas a liberdade; não busca os bens de seu senhor. O filho, porém, não é apenas filho: ele reivindica para si a herança do pai. Os que herdam os mortos estão eles mesmos mortos e herdam os mortos. Os que herdam os vivos estão eles mesmos vivos e herdam tanto os vivos como os mortos. Os mortos não podem herdar coisa alguma, pois como poderiam os mortos herdar? Se aquele que está morto herdar o que está vivo, não morrerá; mas o morto viverá ainda mais! Um gentio não morre, porque nunca viveu para que pudesse morrer. Quem creu na Verdade viveu e corre o risco de morrer, porque está vivo desde o dia em que Cristo veio. O mundo é criado, as cidades são embelezadas, e os mortos são levados para fora.[b]



    Quando éramos hebreus, éramos órfãos de pai — tínhamos (somente) nossa mãe. Mas, quando nos tornamos cristãos, passamos a ter pai e mãe.'
