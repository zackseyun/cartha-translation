translation:
  language: pt
  text: 'Um hebreu gera um hebreu, e alguém desse tipo é chamado “prosélito”. Mas um [prosélito] não gera outro prosélito. Eles são como […] e geram outros […]; basta-lhes vir à existência.[a]


    O escravo busca apenas a liberdade; não busca os bens de seu senhor. O filho, porém, não é apenas filho: ele reivindica para si a herança do pai. Os que herdam os mortos estão eles mesmos mortos e herdam os mortos. Os que herdam os vivos estão eles mesmos vivos e herdam tanto os vivos como os mortos. Os mortos não podem herdar coisa alguma, pois como poderiam os mortos herdar? Se aquele que está morto herdar o que está vivo, não morrerá; pelo contrário, o morto viverá ainda mais! Um gentio não morre, porque nunca viveu para que pudesse morrer. Quem creu na Verdade passou a viver e corre o risco de morrer, porque está vivo desde o dia em que Cristo veio. O mundo é criado, as cidades são embelezadas, e os mortos são levados para fora.[b]


    Quando éramos hebreus, éramos órfãos de pai — tínhamos somente nossa mãe. Mas, quando nos tornamos cristãos, passamos a ter pai e mãe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes e as reticências assinalam palavras restauradas e lacunas ou danos na testemunha manuscrita; por isso, a ligação exata entre estas frases permanece incerta.
    reason: Preservar visivelmente a condição fragmentária do texto e evitar uma reconstrução silenciosa.
  - marker: b
    text: A expressão traduzida por “as cidades são embelezadas” é incerta nesta etapa. Também pode ter o sentido de cidades adornadas ou melhoradas. A revisão direta do copta ainda está pendente.
    reason: Registrar uma dificuldade lexical relevante e a natureza provisória da base de tradução.
lexical_decisions:
- source_word: creates
  choice: gera
  rationale: No contraste entre hebreu e prosélito, “gera” preserva a metáfora de produzir alguém da mesma condição e soa mais natural em português do que “cria”.
- source_word: proselyte
  choice: prosélito
  rationale: Mantém o termo religioso histórico sem acrescentar uma explicação interpretativa como “convertido”.
- source_word: master’s property
  choice: os bens de seu senhor
  rationale: “Bens” expressa propriedade passível de herança e mantém a ligação com o desenvolvimento seguinte.
- source_word: claims ... inheritance
  choice: reivindica para si a herança
  rationale: Preserva a força de uma pretensão ativa, sem decidir se ela é jurídica, espiritual ou metafórica.
- source_word: Truth
  choice: Verdade
  rationale: A inicial maiúscula conserva a possível personificação ou condição transcendente sinalizada pela testemunha inglesa.
- source_word: gentrified
  choice: embelezadas
  rationale: No paralelismo proverbial, o sentido provável é o de cidades adornadas ou melhoradas; “gentrificadas” imporia uma acepção socioeconômica moderna e anacrônica.
- source_word: fatherless
  choice: órfãos de pai
  rationale: Expressa com clareza a ausência específica do pai e preserva o contraste posterior entre pai e mãe.
theological_decisions:
- issue: Sentido de “mortos”, “vivos” e “herdar”
  choice: Manter literalmente a cadeia paradoxal de mortos, vivos e herança
  alternative: Explicitar essas categorias como estados espirituais ou grupos religiosos
  rationale: O trecho não define de modo inequívoco os referentes; a tradução não deve resolver sua tensão teológica.
- issue: A afirmação de que o gentio nunca viveu
  choice: Preservar a formulação categórica
  alternative: Abrandar para “não viveu verdadeiramente” ou “não teve vida espiritual”
  rationale: Qualificações desse tipo seriam interpretações teológicas ausentes da testemunha fornecida.
- issue: Risco de morrer após crer na Verdade
  choice: “corre o risco de morrer”
  alternative: “pode morrer” ou uma interpretação iniciática da morte
  rationale: Mantém a aparente tensão entre ter passado a viver e estar sujeito à morte.
- issue: Pai e mãe dos cristãos
  choice: Conservar “pai e mãe” sem identificar os referentes
  alternative: Identificá-los como Deus, Espírito, Igreja ou outras entidades
  rationale: O excerto não fornece identificação explícita, e fazê-lo importaria uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A repetição deliberada de “mortos”, “vivos” e “herdam” foi mantida por sua função retórica. Esta é uma versão provisória baseada na testemunha inglesa pública fornecida; a conferência direta com o copta do Códice de Nag Hammadi II,3 ainda está pendente.
