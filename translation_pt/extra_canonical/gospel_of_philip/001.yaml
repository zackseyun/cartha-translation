review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a sequência paradoxal sobre vivos, mortos e herança, a terminologia principal e a ausência de explicações doutrinárias. Contudo, a primeira frase não preserva o colchete editorial de “[those]”, e “outro” deixa de conservar os parênteses de “(another)”. Em “Quem creu na Verdade passou a viver”, “passou a viver” explicita uma mudança de estado que não está expressa de modo equivalente na testemunha; “viveu” mantém melhor a formulação recebida.
  naturalness: O português é claro, moderno e de registro adequado. “Basta-lhes que venham a existir” é ligeiramente mais natural que “basta-lhes vir à existência”, sem reduzir a estranheza intencional do fragmento.
  terminology: “Hebreu”, “prosélito”, “Verdade”, “gentio”, “senhor”, “herança”, “mortos” e “vivos” são escolhas adequadas. “Embelezadas” continua uma solução prudente e não anacrônica para o inglês provisório “gentrified”, desde que permaneça assinalada como incerta.
  issues:
  - severity: medium
    issue: Sinais editoriais da testemunha não foram preservados integralmente no primeiro parágrafo.
    rationale: A testemunha traz “[those]” e “(another)”; o rascunho suprimiu o colchete no primeiro caso e os parênteses no segundo. Como a política declarada é preservar restaurações, lacunas e demais sinais editoriais relevantes, eles devem aparecer na tradução.
  - severity: low
    issue: “Passou a viver” acrescenta uma nuance aspectual a “has lived”.
    rationale: A formulação sugere explicitamente o início de uma nova condição. “Viveu” conserva melhor a construção da testemunha e sua tensão retórica com o risco de morrer.
  - severity: low
    issue: A nota sobre os sinais textuais não menciona o parêntese editorial preservado.
    rationale: Uma vez restaurado “(outro)”, convém explicar que o parêntese reproduz uma explicitação editorial da testemunha inglesa, sem apresentá-lo como lacuna manuscrita.
  revised_text: 'Um hebreu gera um hebreu, e [os] desse tipo são chamados “prosélitos”. Mas um [prosélito] não gera (outro) prosélito. Eles são como […] e geram outros […]; basta-lhes que venham a existir.[a]



    O escravo busca apenas a liberdade; não busca os bens de seu senhor. O filho, porém, não é apenas filho: ele reivindica para si a herança do pai. Os que herdam os mortos estão eles mesmos mortos e herdam os mortos. Os que herdam os vivos estão eles mesmos vivos e herdam tanto os vivos como os mortos. Os mortos não podem herdar coisa alguma, pois como poderiam os mortos herdar? Se aquele que está morto herdar o que está vivo, não morrerá; pelo contrário, o morto viverá ainda mais! Um gentio não morre, porque nunca viveu para que pudesse morrer. Quem creu na Verdade viveu e está em risco de morrer, porque está vivo desde o dia em que Cristo veio. O mundo é criado, as cidades são embelezadas, e os mortos são levados para fora.[b]



    Quando éramos hebreus, éramos órfãos de pai — tínhamos somente nossa mãe. Mas, quando nos tornamos cristãos, passamos a ter pai e mãe.'
