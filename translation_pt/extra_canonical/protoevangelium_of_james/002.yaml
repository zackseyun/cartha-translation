translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 2: A aflição de Ana**


    (1) Ana, sua esposa, chorava e se lamentava por duas razões. Dizia: “Lamento por estar viúva e por não ter filhos.”


    (2) Aproximava-se o grande dia do Senhor, e Jutine, sua serva, lhe disse: “Até quando você vai humilhar a sua alma? Veja, o grande dia do Senhor está próximo, e não é certo que você continue triste. Pegue esta faixa para a cabeça, que a chefe da oficina me deu. Não é certo que eu a use, pois sou sua serva, e ela traz uma marca real.”


    (3) Ana respondeu: “Afaste-se de mim! Não farei isso. O Senhor Deus me humilhou profundamente. Talvez algum enganador tenha dado isso a você, e agora você veio me fazer participar do seu pecado.”


    Então Jutine, a serva, disse: “Por que eu haveria de amaldiçoar você, se você não deu ouvidos à minha voz? O Senhor Deus tornou o seu ventre estéril, para que você não dê fruto em Israel.”


    (4) Ana ficou profundamente entristecida. Tirou a roupa de luto, lavou a cabeça e vestiu sua roupa de casamento. Por volta da hora nona[a], desceu ao jardim para caminhar. Viu um loureiro e sentou-se debaixo dele. Depois de descansar, suplicou ao Senhor: “Deus dos meus antepassados, abençoa-me e ouve a minha oração, assim como abençoaste nossa mãe Sara e lhe deste um filho, Isaque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A hora nona correspondia aproximadamente às três horas da tarde.
    reason: Esclarece para leitores modernos um sistema antigo de contagem das horas sem alterar o texto principal.
lexical_decisions:
- source_word: humiliate your soul
  choice: humilhar a sua alma
  rationale: Mantém a expressão concreta e incomum da testemunha, provavelmente ligada à linguagem de aflição ou jejum, sem reduzi-la simplesmente a ‘ficar triste’.
- source_word: headband
  choice: faixa para a cabeça
  rationale: Expressão clara e não excessivamente específica para o adorno mencionado; evita pressupor um tipo exato de diadema antes da revisão direta do grego.
- source_word: leader of the workplace
  choice: chefe da oficina
  rationale: Reproduz de modo natural a ideia de uma mulher em posição de autoridade no local de trabalho, sem introduzir uma relação social não confirmada.
- source_word: royal mark
  choice: marca real
  rationale: Preserva a possível referência a um sinal, emblema ou característica régia, sem decidir entre essas possibilidades.
- source_word: wedding garment
  choice: roupa de casamento
  rationale: Mantém a referência nupcial da testemunha em vez de generalizá-la como roupa festiva.
- source_word: petitioned the Lord
  choice: suplicou ao Senhor
  rationale: Verbo natural em português para uma oração insistente, preservando o tom solene.
- source_word: fruit in Israel
  choice: fruto em Israel
  rationale: Conserva a metáfora de fecundidade e pertencimento ao povo, em vez de explicitá-la apenas como ‘filho’.
theological_decisions:
- issue: Atribuição da esterilidade à ação de Deus
  choice: “O Senhor Deus tornou o seu ventre estéril”
  alternative: “O Senhor Deus permitiu que o seu ventre fosse estéril”
  rationale: A testemunha atribui diretamente a condição ao Senhor; inserir ‘permitiu’ suavizaria e interpretaria a tensão teológica.
- issue: Descrição de Ana como viúva enquanto Joaquim está ausente
  choice: “por estar viúva”
  alternative: “por estar como viúva”
  rationale: Preserva a formulação surpreendente da fonte testemunhal, sem explicar se é lamento figurado, sensação de abandono ou estado literal.
- issue: ‘Nossa mãe Sara’
  choice: “nossa mãe Sara”
  alternative: “a nossa antepassada Sara”
  rationale: Mantém a linguagem familiar e identitária da tradição bíblica, sem substituir a metáfora por uma explicação genealógica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A tradução é provisória porque o material fornecido informa que a revisão direta da tradição manuscrita grega ainda está pendente. O nome ‘Jutine’ foi mantido conforme a testemunha disponibilizada; sua forma deverá ser conferida no grego.
