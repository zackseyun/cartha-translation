review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto a testemunha inglesa e preserva adequadamente elementos potencialmente ambíguos, como a viuvez de Ana, a atribuição direta da esterilidade a Deus, a metáfora de «fruto em Israel» e a «marca real». Contudo, «humilhar a sua alma» não comunica bem em português o sentido aflitivo da expressão subjacente e pode sugerir degradação ou vergonha; «afligir a sua alma» conserva a construção e o sentido semântico. A revisão direta integral do grego permanece pendente conforme os dados do projeto.
  naturalness: O português é claro, solene e amplamente legível. Pequenos ajustes tornam mais natural a fala de Jutine e evitam atribuir sem necessidade gênero masculino à pessoa descrita como possível enganadora.
  terminology: «Faixa para a cabeça», «chefe da oficina», «marca real», «roupa de casamento», «hora nona» e «fruto em Israel» são escolhas cautelosas e adequadas ao caráter provisório da base textual. «Afligir a sua alma» é preferível a «humilhar a sua alma» neste contexto.
  issues:
  - severity: medium
    issue: «Até quando você vai humilhar a sua alma?»
    rationale: Em português moderno, «humilhar a alma» tende a significar rebaixar ou envergonhar-se, não perseverar em aflição, luto ou autocastigo. «Afligir a sua alma» preserva a formulação concreta e comunica o sentido contextual de modo mais fiel.
  - severity: low
    issue: «Talvez algum enganador tenha dado isso a você»
    rationale: A formulação introduz um referente masculino onde a fonte não exige essa especificação. «Alguma pessoa enganadora» preserva a indeterminação.
  revised_text: '**Protoevangelho de Tiago — Capítulo 2: A aflição de Ana**


    (1) Ana, sua esposa, chorava e se lamentava por duas razões. Dizia: “Lamento por estar viúva e por não ter filhos.”


