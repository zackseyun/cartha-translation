review_pass:
  verdict: revise
  source_fidelity: A versão é, em geral, fiel à testemunha inglesa fornecida e preserva adequadamente expressões difíceis, como «humilhar a sua alma» e a atribuição direta da esterilidade a Deus. Contudo, «não ter filhos» pluraliza indevidamente o singular «não have a child», e «para que você não dê fruto em Israel» altera a construção da fala de Jutine, na qual Deus é o agente que não dá fruto a Ana.
  naturalness: O português é claro, moderno e de registro apropriado. «Faixa para a cabeça», «marca real», «roupa de casamento» e a nota sobre a hora nona são compreensíveis e não introduzem especificações excessivas. A formulação «para não lhe dar fruto em Israel» restaura a relação sintática da fonte sem perder naturalidade.
  terminology: Os nomes Ana, Jutine, Sara e Isaque seguem a forma adotada pelo material fornecido. «Senhor Deus», «ventre estéril», «fruto em Israel» e «nossa mãe Sara» preservam o tom e a terminologia da testemunha, sem harmonização teológica. A forma de Jutine continua provisória, pois não foi fornecido o texto grego para conferência direta.
  issues:
  - severity: medium
    issue: Pluralização de «child» em 2.1
    rationale: A fonte diz que Ana não tem «a child», no singular. «Não ter filhos» amplia o enunciado; «não ter um filho» preserva a formulação da testemunha.
  - severity: medium
    issue: Mudança de agente em «para que você não dê fruto em Israel»
    rationale: 'A fonte apresenta Deus como aquele que não concede fruto: «to give you no fruit in Israel». A redação do rascunho faz de Ana o sujeito que não dá fruto. «Para não lhe dar fruto em Israel» conserva a construção e a tensão da fala.'
  revised_text: '**Protoevangelho de Tiago — Capítulo 2: A aflição de Ana**


    (1) Ana, sua esposa, chorava e se lamentava por duas razões. Dizia: “Lamento por estar viúva e por não ter um filho.”


    (2) Aproximava-se o grande dia do Senhor, e Jutine, sua serva, lhe disse: “Até quando você vai humilhar a sua alma? Veja, o grande dia do Senhor está próximo, e não é certo que você continue triste. Pegue esta faixa para a cabeça, que a chefe da oficina me deu. Não é certo que eu a use, pois sou sua serva, e ela traz uma marca real.”


    (3) Ana respondeu: “Afaste-se de mim! Não farei isso. O Senhor Deus me humilhou profundamente. Talvez algum enganador tenha dado isso a você, e agora você veio me fazer participar do seu pecado.”


