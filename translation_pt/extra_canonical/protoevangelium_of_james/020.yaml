translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 20: O exame de Salomé**


    (1) A parteira entrou e disse: “Maria, coloque-se em posição, pois uma prova nada pequena está para ser feita a seu respeito.”


    Então Salomé a examinou. E Salomé gritou: “Ai de mim por causa da minha transgressão e da minha incredulidade! Pois pus à prova o Deus vivo, e vejam! Minha mão está em chamas e se desprendendo de mim!”


    (2) Ela se ajoelhou diante do Senhor e disse: “Deus dos meus antepassados, lembra-te de mim, pois descendo de Abraão, Isaque e Jacó. Não faças de mim um exemplo para o povo de Israel, mas devolve-me aos pobres[a], pois tu sabes, Senhor, que em teu nome tenho curado pessoas e de ti tenho recebido o meu salário.”


    (3) E vejam! Um anjo do Senhor apareceu e lhe disse: “Salomé, Salomé, o Senhor de tudo ouviu a sua oração. Estenda a mão para a criança e tome-a nos braços; assim você receberá salvação e alegria.”


    (4) E vejam! Salomé, cheia de alegria, aproximou-se da criança e a tomou nos braços, dizendo: “Eu a adoro, porque um grande rei nasceu para Israel.”[b] Imediatamente Salomé foi curada e saiu da caverna justificada.


    E vejam! Uma voz dizia: “Salomé, Salomé, não conte as maravilhas que você viu até que a criança entre em Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “devolve-me aos pobres” é difícil e foi preservada sem interpretação adicional. Pode aludir ao serviço que Salomé prestava aos pobres, mas a revisão direta do grego ainda é necessária.
    reason: Sinaliza uma construção obscura sem encobrir sua ambiguidade.
  - marker: b
    text: Em “Eu a adoro”, o pronome “a” concorda gramaticalmente com “a criança”; refere-se ao menino.
    reason: Evita que a concordância gramatical portuguesa seja entendida como indicação de sexo feminino.
lexical_decisions:
- source_word: position yourself
  choice: coloque-se em posição
  rationale: Mantém a instrução concreta e deliberadamente pouco explícita do testemunho, sem acrescentar uma descrição do exame.
- source_word: lawlessness
  choice: transgressão
  rationale: Expressa violação da ordem ou lei divina em português corrente e digno, sem restringir o sentido a criminalidade.
- source_word: look!
  choice: vejam!
  rationale: Conserva o chamado narrativo enfático à atenção; o plural impessoal soa mais natural em português do que o singular literal.
- source_word: Lord of All
  choice: Senhor de tudo
  rationale: Reproduz o alcance universal do título sem importar uma fórmula denominacional mais técnica.
- source_word: child
  choice: criança
  rationale: Preserva a referência neutra do termo fornecido; os pronomes femininos em português concordam gramaticalmente com “criança”, não indicam sexo feminino.
- source_word: justified
  choice: justificada
  rationale: Mantém a linguagem teológica e forense do testemunho, sem reduzi-la a “perdoada” ou “curada”.
theological_decisions:
- issue: A adoração prestada à criança
  choice: “Eu a adoro”
  alternative: “Eu lhe presto homenagem”
  rationale: O testemunho diz “I worship him”; “adoro” conserva a força religiosa da declaração sem decidir por paráfrase se o gesto é culto divino ou homenagem régia.
- issue: “salvation and joy” após tomar a criança nos braços
  choice: “salvação e alegria”
  alternative: “cura e alegria”
  rationale: Preserva a amplitude teológica de “salvação”, ainda que o contexto inclua cura física, evitando resolver a tensão em favor de apenas um sentido.
- issue: Saída da caverna “justificada”
  choice: “saiu da caverna justificada”
  alternative: “saiu da caverna perdoada”
  rationale: Mantém a formulação distintiva e sua possível dimensão judicial, moral e religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se as repetições, exclamações e a sequência narrativa enfática do testemunho. Esta versão é provisória, pois se baseia no testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega continua pendente.
