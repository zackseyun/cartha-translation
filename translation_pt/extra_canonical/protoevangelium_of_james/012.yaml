base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: pt
  text: '(1) Maria fez a púrpura e o escarlate e os levou ao sacerdote. Ao recebê-los, o sacerdote a abençoou e disse: “Maria, o Senhor Deus engrandeceu o seu nome, e você será bendita entre todas as gerações da terra.”


    (2) Maria se alegrou e foi visitar sua parenta Isabel.[a] Ela bateu à porta. Quando Isabel ouviu, largou o escarlate e correu até a porta. Abriu-a, abençoou Maria e disse: “Como me é concedido que a mãe do meu Senhor venha até mim? Pois veja: aquele que está dentro de mim saltou e abençoou você!”


    Maria, porém, havia se esquecido dos mistérios que o anjo Gabriel lhe havia dito. Olhou fixamente para o céu e disse: “Senhor, quem sou eu, para que todas as mulheres da terra me chamem bendita?”


    (3) Maria permaneceu três meses com Isabel. Dia após dia, seu ventre crescia, e Maria ficou com medo. Foi para sua casa e se escondeu do povo de Israel. Ela tinha dezesseis anos quando esses mistérios lhe aconteceram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua prima Isabel”. O testemunho inglês traz “cousin”, mas o parentesco exato pode ser entendido de modo mais amplo.'
    reason: Preserva a incerteza quanto ao grau de parentesco e registra a alternativa tradicional sem a impor ao texto.
lexical_decisions:
- source_word: purple and scarlet
  choice: a púrpura e o escarlate
  rationale: Mantém os dois materiais ou fios de cor como substantivos, em continuidade com o contexto narrativo anterior, sem especificar além da evidência disponível.
- source_word: cousin
  choice: parenta
  rationale: O parentesco exato não é seguro; “parenta” preserva a relação familiar sem impor o grau específico sugerido pelo testemunho inglês.
- source_word: magnified your name
  choice: engrandeceu o seu nome
  rationale: Preserva a imagem semítica de exaltação do nome em linguagem portuguesa clara e digna.
- source_word: mysteries
  choice: mistérios
  rationale: Retém o termo deliberadamente enigmático, sem reduzi-lo a “segredos”, “revelações” ou “acontecimentos”.
- source_word: the one in me
  choice: aquele que está dentro de mim
  rationale: Conserva a referência pessoal e a formulação incomum, sem substituir por “o bebê” ou identificar explicitamente João.
- source_word: bless me
  choice: me chamem bendita
  rationale: Em português, expressa naturalmente o reconhecimento público da condição bendita de Maria e evita a possível leitura de que as mulheres lhe concederiam uma bênção.
theological_decisions:
- issue: Natureza dos “mistérios” anunciados por Gabriel
  choice: Manter “mistérios” sem explicação
  alternative: Traduzir como “segredos”, “revelações” ou “coisas”
  rationale: A narrativa deixa o conteúdo e o alcance do termo parcialmente abertos; explicá-lo resolveria uma tensão que o texto preserva.
- issue: Identidade daquele que salta no ventre de Isabel
  choice: Manter “aquele que está dentro de mim”
  alternative: Explicitar “meu filho”, “o bebê” ou “João”
  rationale: A tradução não deve acrescentar uma identificação ausente desta formulação textual.
- issue: Forma da saudação de Isabel
  choice: “Como me é concedido que...”
  alternative: “Por que...” ou “Como é que...”
  rationale: A formulação escolhida conserva o tom de admiração e indignidade da pergunta, sem introduzir explicação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O encadeamento narrativo simples foi preservado sem reproduzir mecanicamente todos os “e” do testemunho. “Bendita” mantém a ressonância bíblica; “ventre” e “engrandeceu” sustentam um registro digno sem arcaísmo excessivo. Como a revisão direta do grego ainda está pendente, decisões potencialmente dependentes da língua-fonte foram tratadas com cautela.
