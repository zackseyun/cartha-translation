  text: '(1) Look! An angel of the Lord stood nearby and said to her, “Anna, Anna, the Lord has heard your prayer. You will conceive and give birth, and your offspring will be spoken of throughout the whole world.”


    Anna said, “As the Lord God lives, whether I give birth to a boy or a girl, I will bring the child as a gift to the Lord my God, and the child will minister to him all the days of its life.”


    (2) Look! Two angels came and said to her, “Look, your husband Joachim is coming with his flocks.” For an angel of the Lord had gone down to Joachim and said, “Joachim, Joachim, the Lord God has heard your prayer. Go down from here. Look, your wife Anna has conceived in her womb.”


    (3) Joachim immediately went down and called the shepherds. He said to them, “Bring me ten lambs without spot or blemish, and the ten lambs will be for the Lord God. Bring me twelve tender calves for the priests and the elders, and one hundred male goats for all the people.”


    (4) Look! Joachim came with his flocks, and Anna stood at the gate. When she saw Joachim coming with his flocks, she immediately ran and threw her arms around his neck, saying, “Now I know that the Lord God has greatly blessed me. For look! The widow is no longer a widow, and look! The one without a child in her womb has conceived.”


    Joachim rested in his house for the first day.'
translation:
  language: pt
  text: '(1) Vejam! Um anjo do Senhor pôs-se perto dela e disse: “Ana, Ana, o Senhor ouviu a sua oração. Você conceberá e dará à luz, e em todo o mundo se falará da sua descendência.”


    Ana disse: “Tão certo como vive o Senhor Deus, quer eu dê à luz um menino, quer uma menina, levarei a criança como oferta ao Senhor, meu Deus, e ela o servirá todos os dias da sua vida.”


    (2) Vejam! Dois anjos vieram e lhe disseram: “Veja! Joaquim, seu marido, vem vindo com os rebanhos.” Pois um anjo do Senhor havia descido até Joaquim e lhe dito: “Joaquim, Joaquim, o Senhor Deus ouviu a sua oração. Desça daqui. Veja! Ana, sua mulher, concebeu em seu ventre.”


    (3) Joaquim desceu imediatamente e chamou os pastores. Disse-lhes: “Tragam-me dez cordeiros sem mancha nem defeito; os dez cordeiros serão para o Senhor Deus. Tragam-me também doze bezerros tenros para os sacerdotes e os anciãos, e cem bodes para todo o povo.”


    (4) Vejam! Joaquim chegou com os rebanhos, e Ana estava junto ao portão. Ao vê-lo chegar com os rebanhos, ela correu imediatamente, lançou os braços ao redor do pescoço dele e disse: “Agora sei que o Senhor Deus me abençoou grandemente. Pois vejam! A viúva já não é viúva, e vejam! Aquela que não tinha um filho no ventre concebeu.”


    E Joaquim descansou em sua casa no primeiro dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: look / Greek source review pending
  choice: Vejam! / Veja!
  rationale: Preserva a fórmula enfática e repetida do testemunho, usando singular quando o anjo se dirige diretamente a Ana ou Joaquim e plural no fluxo narrativo e na exclamação pública de Ana.
- source_word: offspring
  choice: descendência
  rationale: Mantém a amplitude semântica do termo, sem restringi-lo prematuramente apenas à criança imediata.
- source_word: bring it as a gift
  choice: levarei a criança como oferta
  rationale: Explicita em português o referente humano do pronome neutro inglês e conserva a ideia de dedicação a Deus.
- source_word: minister
  choice: servirá
  rationale: Forma natural e digna em português, adequada ao serviço religioso sem impor uma função sacerdotal específica.
- source_word: without spot or blemish
  choice: sem mancha nem defeito
  rationale: Preserva a linguagem sacrificial tradicional com clareza para leitores modernos.
- source_word: tender calves
  choice: bezerros tenros
  rationale: Mantém o detalhe descritivo do testemunho sem substituir por uma qualificação interpretativa como idade ou qualidade.
- source_word: male goats
  choice: bodes
  rationale: Termo português comum que indica naturalmente caprinos machos adultos.
- source_word: the one without a child in her womb
  choice: aquela que não tinha um filho no ventre
  rationale: Conserva a formulação concreta e incomum do testemunho em vez de reduzi-la simplesmente a “a estéril”.
- source_word: rested for the first day in his house
  choice: descansou em sua casa no primeiro dia
  rationale: Mantém a expressão temporal algo incomum e sua possível ambiguidade, sem tentar harmonizá-la ou explicá-la.
theological_decisions:
- issue: Natureza da dedicação da criança
  choice: “como oferta ao Senhor” e “ela o servirá”
  alternative: “consagrá-la-ei ao Senhor” ou “ministrará diante dele”
  rationale: A redação conserva as duas imagens do testemunho — dádiva e serviço — sem acrescentar uma categoria ritual ou ofício específico.
- issue: Alcance da promessa sobre a descendência
  choice: “em todo o mundo se falará da sua descendência”
  alternative: “seu filho será famoso no mundo inteiro”
  rationale: Preserva tanto o alcance universal quanto a amplitude de “descendência”, sem identificar de antemão sexo, número ou modo exato de cumprimento.
- issue: Declaração de que Ana concebeu
  choice: 'afirmação direta no perfeito narrativo: “concebeu em seu ventre”'
  alternative: “conceberá” ou “está grávida”
  rationale: Segue o paradoxo temporal presente no testemunho, em que a promessa a Ana e a notícia dada a Joaquim aparecem em formulações diferentes, sem harmonização silenciosa.
- issue: Imagem da viuvez
  choice: “A viúva já não é viúva”
  alternative: “a mulher que parecia viúva já não está só”
  rationale: Mantém a linguagem retórica e teologicamente carregada do texto, embora Joaquim esteja vivo, em vez de explicar a metáfora dentro da tradução.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil, com tom narrativo digno. Os nomes foram vertidos como Ana e Joaquim. A repetição enfática de “Vejam!/Veja!” foi preservada por ser característica do relato. Como a revisão direta do grego ainda está pendente, a redação permanece provisória e fundamentada no testemunho inglês público fornecido, consultando a POB inglesa apenas como camada de controle.
