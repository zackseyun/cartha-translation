  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: pt
  text: '(1) Ela estava no sexto mês. E eis que José voltou da construção onde trabalhava, entrou em casa e a encontrou grávida. Então bateu no próprio rosto, lançou-se ao chão sobre um pano de saco e chorou amargamente, dizendo: “Como poderei me apresentar diante do Senhor Deus? Que oração poderei fazer a respeito desta jovem, visto que a recebi virgem do Templo do Senhor Deus e não a protegi? Quem armou esta cilada contra mim? Quem praticou este mal em minha casa? Quem desonrou a virgem? Não estou eu revivendo a história de Adão? Pois, enquanto Adão glorificava a Deus na hora da oração, a serpente veio, encontrou Eva sozinha e a enganou. E agora isso aconteceu comigo!”


    (2) José se levantou de sobre o pano de saco, chamou-a e lhe disse: “Deus cuidou de você. Por que você fez isso? Você se esqueceu do Senhor, seu Deus. Por que humilhou a sua alma? Você foi alimentada no Santo dos Santos e recebeu alimento da mão de um anjo!”


    (3) Ela chorou amargamente e disse: “Sou pura e não conheci homem algum!”


    José lhe perguntou: “Então, de onde veio o que está em seu ventre?”


    Ela respondeu: “Tão certo como vive o Senhor, meu Deus, não sei de onde veio!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: look / behold (Greek review pending)
  choice: e eis que
  rationale: Mantém o realce narrativo solene do testemunho, em linguagem bíblica ainda amplamente compreensível.
- source_word: his building
  choice: da construção onde trabalhava
  rationale: Evita a leitura pouco natural de que o edifício pertencia a José e expressa o sentido provável de seu trabalho de construção, sem especificar além do testemunho.
- source_word: struck his face
  choice: bateu no próprio rosto
  rationale: Preserva o gesto concreto de aflição, em vez de substituí-lo por uma interpretação emocional.
- source_word: sackcloth
  choice: pano de saco
  rationale: Conserva a imagem antiga de luto e penitência com uma expressão portuguesa inteligível.
- source_word: known a man
  choice: conheci homem algum
  rationale: Preserva o eufemismo semítico tradicional para relações sexuais, adequado ao registro e à declaração de Maria.
- source_word: this thing in your womb
  choice: o que está em seu ventre
  rationale: Reproduz a formulação distanciada de José sem acrescentar uma identificação que o texto não fornece.
- source_word: as the Lord my God lives
  choice: Tão certo como vive o Senhor, meu Deus
  rationale: Expressa naturalmente em português a fórmula solene de juramento, mantendo sua força.
theological_decisions:
- issue: Referência à pureza de Maria
  choice: “Sou pura e não conheci homem algum”
  alternative: “Sou inocente e não tive relações com homem algum”
  rationale: Mantém tanto a afirmação de pureza quanto o idioma bíblico de “conhecer”, sem reduzir a fala a uma paráfrase jurídica ou explicitamente sexual.
- issue: Ação de Adão na hora da oração
  choice: “glorificava a Deus”
  alternative: “era glorificado” ou “dava glória”
  rationale: Segue o testemunho inglês fornecido, mas torna explícito o objeto implícito para fluência. A formulação permanece provisória até a revisão direta do grego.
- issue: Alimento recebido de um anjo
  choice: Declaração mantida literalmente
  alternative: Interpretá-la como metáfora de cuidado divino
  rationale: O texto apresenta o alimento angelical como acontecimento narrativo; a tradução não deve explicá-lo nem atenuá-lo.
- issue: Paralelo entre Maria/Eva e José/Adão
  choice: Paralelo preservado na fala de José
  alternative: Corrigir ou harmonizar a comparação teologicamente
  rationale: A comparação pertence à perspectiva angustiada de José e deve permanecer com sua tensão narrativa, sem endosso ou correção editorial.
translation_notes:
  register: Português moderno, digno e narrativamente claro, com legibilidade brasileira e alcance internacional. Mantiveram-se alguns traços bíblicos reconhecíveis, como “e eis que”, “ventre” e “não conheci homem algum”. Como a revisão direta da tradição manuscrita grega ainda está pendente, esta é uma tradução provisória fundamentada no testemunho inglês público fornecido e consultada à luz da camada POB inglesa.
