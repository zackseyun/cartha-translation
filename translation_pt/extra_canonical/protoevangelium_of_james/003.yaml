  revision_rationale: A revisão corrige dois deslocamentos semânticos seguros — a pergunta de semelhança e a fecundidade de aves e animais — e aprimora a fórmula de lamento. Mantém-se a indeterminação relativa à exclusão do Templo e a tensão da imagem das águas, assinalada por nota. Como a base de trabalho fornecida é um testemunho inglês e a revisão direta dos manuscritos gregos ainda está pendente, não foram introduzidas harmonizações ou precisões históricas não exigidas pelo texto.
