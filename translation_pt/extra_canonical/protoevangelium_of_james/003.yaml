translation:
  language: pt
  text: '(1) Ana ergueu atentamente os olhos para o céu e viu um ninho de pardais no loureiro. Então Ana se lamentou, dizendo consigo mesma:


    “Ah de mim! Quem me deu à luz? Que ventre me gerou? Nasci como maldição diante do povo de Israel e fui desprezada. Zombaram de mim e me expulsaram do Templo do Senhor, meu Deus.


    (2) “Ah de mim! Com que me compararei? Não sou como as aves do céu, pois até as aves do céu dão fruto diante de ti, Senhor.


    “Ah de mim! Com que me compararei? Não sou como os animais, pois até os animais dão fruto diante de ti, Senhor.


    “Ah de mim! Com que me compararei? Não sou como os animais selvagens da terra, pois até os animais selvagens da terra dão fruto diante de ti, Senhor.


    (3) “Ah de mim! Com que me compararei? Não sou como estas águas, pois até estas águas, embora serenas, agitam-se, e seus peixes te bendizem, Senhor.[a]


    “Ah de mim! Com que me compararei? Não sou como esta terra, pois a terra produz seus frutos no tempo devido e te bendiz, Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação sobre as águas é incomum: elas são descritas como serenas e, ao mesmo tempo, agitadas. A tradução preserva essa tensão do testemunho disponível.'
    reason: Sinalizar uma dificuldade textual ou imagética sem harmonizá-la nem corrigi-la silenciosamente.
lexical_decisions:
- source_word: looked intently to heaven
  choice: ergueu atentamente os olhos para o céu
  rationale: Expressa em português natural tanto a direção do olhar quanto sua intensidade, sem reduzir a ação a uma observação casual.
- source_word: laurel tree
  choice: loureiro
  rationale: Equivalente português corrente para a árvore de louro.
- source_word: Woe is me!
  choice: Ah de mim!
  rationale: Mantém a fórmula enfática de lamento em registro digno e compreensível.
- source_word: What am I like?
  choice: Com que me compararei?
  rationale: No contexto, a pergunta introduz sucessivas comparações; esta formulação torna essa função clara sem eliminar o caráter interrogativo.
- source_word: fruitful
  choice: dão fruto
  rationale: Preserva a metáfora recorrente de fecundidade e sua ligação com a terra que produz frutos, evitando restringi-la explicitamente à reprodução.
- source_word: Temple
  choice: Templo
  rationale: A inicial maiúscula identifica o Templo do Senhor referido no relato.
- source_word: bless you
  choice: te bendizem
  rationale: ‘Bendizer’ conserva a linguagem religiosa de louvor dirigida a Deus e soa digna em português contemporâneo.
theological_decisions:
- issue: A condição de Ana descrita mediante a linguagem de fruto
  choice: Manter ‘dar fruto’ em todas as comparações
  alternative: Traduzir como ‘ser fecundo’ ou ‘ter descendência’
  rationale: A metáfora liga aves, animais, águas e terra e sustenta a tensão poética entre fecundidade biológica e produtividade da criação; uma explicitação estreitaria o sentido.
- issue: A expressão ‘nasci como maldição diante do povo de Israel’
  choice: Preservar a linguagem de maldição como percepção lamentosa de Ana
  alternative: Atenuar para ‘tornei-me motivo de vergonha’
  rationale: A redação não deve resolver nem suavizar a tensão teológica e social da fala, que apresenta a experiência de Ana sem necessariamente endossar um juízo divino sobre ela.
- issue: Expulsão do Templo
  choice: Traduzir diretamente como ‘me expulsaram do Templo’
  alternative: Interpretar como exclusão de uma área, rito ou oferta específicos
  rationale: O testemunho fornecido não especifica a natureza precisa da exclusão; a tradução conserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição estrutural do lamento foi preservada por seu efeito poético e retórico. Este rascunho é provisório, pois foi preparado a partir do testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega continua pendente.
