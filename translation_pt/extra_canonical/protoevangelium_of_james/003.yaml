review_pass:
  verdict: revise
  source_fidelity: A estrutura, a repetição do lamento, a referência ao Templo e a imagem paradoxal das águas acompanham bem o testemunho fornecido e são compatíveis com a formulação conhecida da tradição grega. Contudo, «Com que me compararei?» desloca a pergunta de identidade/semelhança para uma deliberação futura, e «dão fruto» aplicado a aves e animais torna excessivamente literal uma expressão de fecundidade. «São fecundos» preserva melhor o sentido sem apagar o contraste final com a terra, que produz frutos.
  naturalness: O texto é geralmente fluente e de registro apropriado. «Ai de mim!» é uma fórmula de lamento mais corrente e natural que «Ah de mim!». «Com o que me pareço?» mantém a pergunta repetida em português direto e poético.
  terminology: «Ana», «loureiro», «Templo do Senhor, meu Deus» e «te bendizem» são escolhas adequadas. «Fecundos» é preferível para aves, animais e feras; «produz seus frutos» deve ser mantido para a terra.
  issues:
  - severity: medium
    issue: A pergunta repetida foi vertida como «Com que me compararei?»
    rationale: O testemunho diz «What am I like?», e a construção grega subjacente é uma pergunta de semelhança, não uma decisão futura de comparar-se. «Com o que me pareço?» conserva melhor o valor interrogativo e a ambiguidade.
  - severity: medium
    issue: «Fruitful» foi traduzido uniformemente por «dão fruto» para aves e animais.
    rationale: No contexto de aves, animais e feras, o sentido é fecundidade. «Dão fruto» é possível como metáfora, mas em português soa mais como produtividade vegetal e enfraquece a distinção imagética com a terra, que de fato produz frutos.
  - severity: low
    issue: «Ah de mim!»
    rationale: «Ai de mim!» é a fórmula lamentosa mais idiomática no português moderno e conserva o registro elevado.
  revised_text: '(1) Ana olhou atentamente para o céu e viu um ninho de pardais no loureiro. Ana lamentou-se, dizendo consigo mesma:


    “Ai de mim! Quem me deu à luz? Que ventre me gerou? Nasci como uma maldição diante do povo de Israel e fui desprezada. Zombaram de mim e me expulsaram do Templo do Senhor, meu Deus.


    (2) “Ai de mim! Com o que me pareço? Não sou como as aves do céu, pois até as aves do céu são fecundas diante de ti, Senhor.


