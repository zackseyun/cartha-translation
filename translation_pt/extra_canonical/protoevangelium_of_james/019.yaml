translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 19: O nascimento de Jesus**


    **(1)** E eis que uma mulher descia da montanha e me perguntou:


    — Homem, aonde você vai?


    Eu respondi:


    — Estou procurando uma parteira hebreia.


    Ela perguntou:


    — Você é de Israel?


    Eu lhe respondi:


    — Sim.


    Então ela perguntou:


    — E quem é que está dando à luz na caverna?


    Eu respondi:


    — Minha noiva.


    Ela me perguntou:


    — Ela não é sua esposa?


    Eu lhe respondi:


    — Maria foi criada no Templo do Senhor, e coube a mim por sorteio recebê-la como esposa. Contudo, ela não é minha esposa; ela concebeu do Espírito Santo.


    A parteira perguntou:


    — É verdade?


    José lhe disse:


    — Venha e veja.


    E a parteira foi com ele.


    **(2)** Eles pararam diante da caverna, e uma nuvem luminosa cobriu a caverna com sua sombra. A parteira disse:


    — Hoje minha alma foi engrandecida, porque meus olhos viram algo maravilhoso: a salvação nasceu para Israel!


    Imediatamente, a nuvem se retirou da caverna, e uma grande luz apareceu lá dentro, de modo que os olhos deles não conseguiam suportá-la. Pouco depois, a luz foi diminuindo, até que apareceu um recém-nascido. Ele se aproximou e tomou o peito de sua mãe, Maria.


    A parteira exclamou:


    — Que grande dia é hoje para mim, pois vi este novo milagre!


    **(3)** A parteira saiu da caverna, e Salomé veio ao encontro dela.


    A parteira lhe disse:


    — Salomé, Salomé, preciso lhe contar sobre uma visão nunca vista: uma virgem deu à luz, contrariando sua natureza!


    Salomé respondeu:


    — Tão certo como vive o Senhor, meu Deus, se eu não examinar sua condição[a], não acreditarei que a virgem deu à luz.


    [a] Isto é, examinar fisicamente Maria para verificar sua virgindade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, examinar fisicamente Maria para verificar sua virgindade.
    reason: A expressão “sua condição” é discreta e pode não comunicar com clareza ao leitor moderno a intenção corporal de Salomé; a nota esclarece a ação sem inserir detalhes ausentes.
lexical_decisions:
- source_word: Hebrew midwife (Greek review pending)
  choice: parteira hebreia
  rationale: Mantém a identificação étnica do testemunho sem substituí-la por “israelita”, termo usado separadamente no diálogo.
- source_word: betrothed (Greek review pending)
  choice: minha noiva
  rationale: Expressa em português corrente o vínculo de compromisso matrimonial, preservando a tensão subsequente de que Maria ainda não é esposa de José.
- source_word: overshadowed (Greek review pending)
  choice: cobriu ... com sua sombra
  rationale: Conserva a imagem concreta da nuvem que sombreia ou envolve a caverna, sem reduzir a cena a simples iluminação.
- source_word: my soul is magnified (Greek review pending)
  choice: minha alma foi engrandecida
  rationale: Preserva a formulação elevada e sua provável ressonância bíblica, em vez de a converter apenas em uma afirmação de alegria.
- source_word: salvation
  choice: a salvação
  rationale: Mantém o substantivo teologicamente carregado e não o identifica explicitamente com o recém-nascido além do que a própria frase declara.
- source_word: condition (Greek review pending)
  choice: sua condição
  rationale: Retém no texto a formulação discreta do testemunho, com nota explicando que se trata de verificação física da virgindade.
- source_word: against her nature (Greek review pending)
  choice: contrariando sua natureza
  rationale: Preserva a expressão difícil e a tensão do relato, sem suavizá-la para “de modo sobrenatural” nem lhe impor uma explicação doutrinária.
theological_decisions:
- issue: Relação entre José e Maria
  choice: “minha noiva” e “ela não é minha esposa”
  alternative: Harmonizar as duas expressões chamando Maria simplesmente de esposa de José
  rationale: O testemunho insiste na distinção e ela deve permanecer, mesmo parecendo tensa em português.
- issue: Origem da concepção
  choice: “ela concebeu do Espírito Santo”
  alternative: “ela está grávida pelo poder do Espírito Santo”
  rationale: A forma escolhida conserva a afirmação direta e sua possível ambiguidade quanto à nuance exata da preposição, a ser conferida no grego.
- issue: Nascimento da salvação
  choice: “a salvação nasceu para Israel”
  alternative: “o Salvador nasceu para Israel”
  rationale: Mantém o substantivo abstrato presente no testemunho e evita resolver a personificação mediante alteração cristológica do texto.
- issue: Virgindade e exame de Maria
  choice: Preservar a intenção explícita de Salomé de verificar fisicamente a alegação
  alternative: Suavizar a fala como mera busca de confirmação verbal
  rationale: O exame corporal é essencial à progressão narrativa, embora seja expresso com discrição.
- issue: Manifestação luminosa e aparecimento do recém-nascido
  choice: Narrar a retirada gradual da luz até o aparecimento da criança sem explicação adicional
  alternative: Interpretar a cena como descrição técnica do instante ou do modo do parto
  rationale: O texto apresenta uma sequência miraculosa, mas não explica seu mecanismo; a tradução não deve fazê-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com diálogo natural e legibilidade brasileira. “E eis que” preserva o sinal narrativo enfático; “Templo” recebe maiúscula por designar o santuário específico. O título fornecido foi mantido. Esta é uma redação provisória baseada no testemunho inglês público fornecido, pois o texto grego e suas variantes não foram disponibilizados para revisão direta; escolhas marcadas como pendentes devem ser auditadas contra a tradição manuscrita grega antes da publicação definitiva.
