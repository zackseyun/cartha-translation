source:
  text: '(1) And the next day, he was offering his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” And Joachim offered his gifts and paid attention to the priest’s plate as he went up to the altar of the Lord. And he didn’t see sin in it. And Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” And he went down from the Temple of the Lord justified and went into his house.


    (2) And about six months were completed, and in the seventh month she gave birth. And Anna said to her midwife, “What is it?”


    And the midwife said, “It’s a girl!”


    And Anna said, “My soul is magnified this day!” And she laid down her child.


    And when her days were completed, Anna cleansed her flow of blood. And she gave her breast to the child, and gave her the name Mary.'
