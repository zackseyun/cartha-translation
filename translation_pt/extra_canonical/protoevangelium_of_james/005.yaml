  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


