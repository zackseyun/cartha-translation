    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: pt
  text: '(1) No dia seguinte, Joaquim apresentou suas ofertas, dizendo consigo mesmo: “Se o Senhor Deus se reconciliou comigo, a lâmina usada pelo sacerdote deixará isso claro para mim.” Joaquim apresentou suas ofertas e observou atentamente a lâmina do sacerdote enquanto este subia ao altar do Senhor. E não viu nela pecado algum. Então Joaquim disse: “Agora sei que o Senhor Deus se reconciliou comigo e afastou de mim todos os meus pecados.” E desceu do Templo do Senhor justificado e voltou para casa.


    (2) Completaram-se cerca de seis meses, e no sétimo mês Ana deu à luz. Ela perguntou à parteira:


    “O que é?”


    A parteira respondeu:


    “É uma menina!”


    Então Ana disse:


    “Minha alma é engrandecida neste dia!”


    E deitou a criança.


    Quando se completaram os dias de sua purificação, Ana se purificou do fluxo de sangue. Depois, amamentou a criança e deu-lhe o nome de Maria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plate worn by the priest
  choice: a lâmina usada pelo sacerdote
  rationale: “Lâmina” preserva a referência concreta a uma peça sacerdotal, sem especificar além da evidência fornecida sua forma, material ou função.
- source_word: reconciled
  choice: se reconciliou
  rationale: Mantém a formulação relacional e teológica do testemunho, sem substituí-la por conceitos próximos como perdão ou aceitação.
- source_word: sent all my sins away from me
  choice: afastou de mim todos os meus pecados
  rationale: Conserva a imagem espacial do afastamento dos pecados em português natural.
- source_word: justified
  choice: justificado
  rationale: Preserva o termo teologicamente carregado e sua possível ressonância jurídica ou cultual, sem explicá-lo no corpo do texto.
- source_word: My soul is magnified
  choice: Minha alma é engrandecida
  rationale: Mantém a construção incomum e sua provável ressonância bíblica, sem normalizá-la como mera alegria ou exaltação.
- source_word: gave her breast to the child
  choice: amamentou a criança
  rationale: Expressa de modo natural em português a ação descrita pelo idiomatismo do testemunho inglês.
theological_decisions:
- issue: O sinal na lâmina sacerdotal e a ausência de pecado nela
  choice: “não viu nela pecado algum”
  alternative: Explicar que Joaquim interpretou a lâmina como sinal de que sua oferta fora aceita
  rationale: O trecho é obscuro e a revisão direta do grego ainda está pendente; a tradução preserva a ambiguidade em vez de fornecer uma interpretação conjectural.
- issue: Estado de Joaquim ao sair do Templo
  choice: “justificado”
  alternative: “declarado justo” ou “perdoado”
  rationale: “Justificado” retém a tensão semântica e teológica do testemunho sem limitar o sentido a uma única formulação doutrinária.
- issue: Purificação pós-parto de Ana
  choice: “se purificou do fluxo de sangue”
  alternative: “ficou ritualmente pura”
  rationale: A formulação concreta preserva a linguagem do testemunho e evita explicitar uma teoria ritual além do texto fornecido.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A cadência narrativa e as repetições semíticas foram parcialmente preservadas. Como a revisão direta da tradição manuscrita grega está pendente, não se acrescentaram notas textuais nem esclarecimentos conjecturais.
