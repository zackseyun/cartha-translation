  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 18: O tempo para**


    (1) José encontrou ali uma gruta, levou Maria para dentro, deixou seus filhos com ela e saiu à procura de uma parteira hebreia na região de Belém.


    (2) Eu, José, caminhava, mas não caminhava.[a] Ergui os olhos para a abóbada do céu e vi que estava parada. Olhei para o ar e, admirado, vi que até as aves do céu estavam imóveis. Olhei para o chão e vi ali uma tigela, com trabalhadores reclinados ao redor dela. Suas mãos estavam na tigela, mas eles não as moviam; mastigavam, mas não mastigavam; pegavam o alimento, mas não o retiravam; levavam-no à boca, mas não o levavam. Em vez disso, todos mantinham o rosto voltado para cima.


    Vi ovelhas sendo conduzidas, mas elas estavam paradas. O pastor levantou a mão para lhes bater, mas sua mão permaneceu erguida. Olhei para a correnteza do rio e vi cabritos com a boca na água, mas eles não bebiam.


    Então, de repente, tudo retomou seu curso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão paradoxal reproduz o sentido do testemunho disponível: José avançava e, ao mesmo tempo, parecia não avançar, em harmonia com a imobilidade descrita a seguir.'
    reason: Preserva uma dificuldade deliberada do texto sem a resolver silenciosamente.
lexical_decisions:
- source_word: cave
  choice: gruta
  rationale: “Gruta” é natural em português, preserva o cenário rochoso do relato e evita a possível conotação estritamente arqueológica de “caverna”.
- source_word: Hebrew midwife
  choice: parteira hebreia
  rationale: Mantém a identificação étnico-cultural explícita sem substituí-la por “judia”, que não é a forma apresentada no testemunho fornecido.
- source_word: dome of heaven
  choice: abóbada do céu
  rationale: Conserva a imagem cosmológica concreta do testemunho, em linguagem digna e inteligível.
- source_word: sky
  choice: ar
  rationale: Distingue este segundo campo de visão da “abóbada do céu” e corresponde ao espaço em que as aves aparecem, sem repetir simplesmente “céu”.
- source_word: torrent of the river
  choice: correnteza do rio
  rationale: Expressa água fluvial em movimento e preserva o contraste com a imobilidade dos cabritos.
- source_word: resumed its course
  choice: retomou seu curso
  rationale: Mantém a metáfora de movimento interrompido e reiniciado, adequada ao quadro cósmico da passagem.
theological_decisions:
- issue: A paralisação de toda a criação no momento do parto
  choice: Apresentar a cena diretamente, sem explicar sua causa nem definir sua natureza metafísica
  alternative: Interpretá-la explicitamente como suspensão literal do tempo ou como visão subjetiva de José
  rationale: O relato descreve uma imobilidade extraordinária, mas o testemunho fornecido não formula uma doutrina do tempo nem decide se a experiência é exterior ou visionária.
- issue: O paradoxo “caminhava, mas não caminhava”
  choice: Preservar a formulação paradoxal e acrescentar nota de esclarecimento limitado
  alternative: Normalizar como “eu caminhava sem sair do lugar”
  rationale: A repetição negativa faz parte da tensão literária e pode indicar tanto a experiência de José quanto a suspensão geral do movimento; resolvê-la eliminaria uma ambiguidade genuína.
- issue: Identificação de “ela” e “seus filhos”
  choice: Usar os nomes José e Maria para clareza narrativa, sem ampliar a informação sobre os filhos
  alternative: Conservar apenas os pronomes “ele” e “ela”
  rationale: O contexto imediato identifica os participantes; explicitar os nomes melhora a leitura em português sem introduzir uma interpretação sobre a filiação dos filhos de José.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva as repetições e os contrastes paradoxais que estruturam a cena, mas ajusta a sintaxe para fluência. Trata-se de versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente.
