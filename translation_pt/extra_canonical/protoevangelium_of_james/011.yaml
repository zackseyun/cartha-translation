translation:
  language: pt
  text: '**11. A anunciação**


    (1) Maria pegou o cântaro e foi enchê-lo de água. E eis que uma voz lhe dizia: “Alegra-te, favorecida! O Senhor está contigo. Bendita és tu entre as mulheres.”


    Maria olhou para a direita e para a esquerda, procurando saber de onde vinha a voz. Tomada de medo, entrou em casa. Depois de pôr o cântaro no chão, pegou a púrpura, sentou-se em seu trono e fiou a púrpura.


    (2) E eis que um anjo do Senhor se apresentou diante dela e disse: “Não tenhas medo, Maria, pois encontraste graça diante do Senhor de todos. Conceberás por sua palavra.”


    Ao ouvir isso, Maria perguntou a si mesma: “Conceberei do Senhor, o Deus vivo, e darei à luz como todas as mulheres dão à luz?”


    (3) O anjo do Senhor lhe respondeu: “Não será assim, Maria, pois o poder do Senhor te cobrirá com a sua sombra. Por isso, o santo que nascer de ti será chamado Filho do Altíssimo. Tu lhe darás o nome de Jesus, pois ele salvará o seu povo dos pecados deles.”


    Maria disse: “Eis aqui a serva do Senhor. Que aconteça comigo conforme a tua palavra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “blessed one” (provavelmente grego κεχαριτωμένη, sujeito a conferência direta)
  choice: “favorecida”
  rationale: Distingue a saudação que indica favor ou graça da declaração seguinte, traduzida por “bendita”, e evita repetir dois termos que provavelmente representam vocábulos gregos diferentes.
- source_word: “the purple”
  choice: “a púrpura”
  rationale: Preserva a referência concreta e tradicional ao material púrpura que Maria fiava, sem acrescentar “fio” ou “tecido” onde o testemunho fornecido permanece elíptico.
- source_word: “throne”
  choice: “trono”
  rationale: Mantém a imagem incomum do testemunho, em vez de normalizá-la silenciosamente como “cadeira” ou “assento”.
- source_word: “Lord of All”
  choice: “Senhor de todos”
  rationale: Reproduz o título de forma clara e natural, mantendo seu alcance universal.
- source_word: “You’ll conceive from God’s word”
  choice: “Conceberás pela palavra de Deus”
  rationale: Mantém a palavra divina como origem ou meio da concepção, sem identificar explicitamente “Palavra” como título pessoal nem reduzir a expressão a uma simples promessa verbal.
- source_word: “overshadow”
  choice: “cobrirá com a sua sombra”
  rationale: Conserva a metáfora religiosa e narrativa, em vez de substituí-la por uma explicação interpretativa.
- source_word: “call his name Jesus”
  choice: “lhe darás o nome de Jesus”
  rationale: Expressa em português natural o idiomatismo sem alterar seu sentido de atribuição do nome.
theological_decisions:
- issue: Relação entre a palavra de Deus e a concepção
  choice: “Conceberás pela palavra de Deus”
  alternative: “Conceberás a Palavra de Deus”
  rationale: A construção do testemunho indica origem ou instrumentalidade, não afirma inequivocamente que o objeto concebido seja aqui denominado “a Palavra”. A tradução preserva essa distinção.
- issue: Modo da concepção
  choice: Manter “Não será assim” seguido da ação do poder de Deus
  alternative: Explicitar “não por união sexual” ou “de modo virginal”
  rationale: O texto contrasta o parto/concepção comum com a ação divina, mas não convém inserir uma explicação fisiológica ou doutrinária ausente da fala transmitida.
- issue: Título do nascituro
  choice: “Filho do Altíssimo”
  alternative: “Filho do Deus Altíssimo”
  rationale: Mantém o título tal como aparece no testemunho e evita acrescentar um substantivo explicativo.
- issue: Objeto da salvação
  choice: “salvará o seu povo dos pecados deles”
  alternative: “libertará o seu povo dos seus pecados”
  rationale: “Salvar” preserva o verbo teologicamente carregado do testemunho; “deles” esclarece em português que os pecados pertencem ao povo, sem mudar o conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se a segunda pessoa singular nas falas dirigidas a Maria para conservar o tom solene sem recorrer a construções arcaicas excessivas. “E eis que” foi mantido como recurso narrativo bíblico reconhecível. O texto é uma versão provisória baseada no testemunho inglês público fornecido e em correspondências gregas amplamente reconhecíveis; a tradição manuscrita grega ainda requer conferência direta antes da publicação definitiva.
