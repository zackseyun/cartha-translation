translation:
  language: pt
  text: '(1) Herodes, porém, procurava João e enviou oficiais a Zacarias para lhe perguntar: “Onde você está escondendo seu filho?”


    Ele lhes respondeu: “Sou ministro de Deus e permaneço no Templo de Deus. Como poderia saber onde está meu filho?”


    (2) Os oficiais voltaram e relataram tudo isso a Herodes. Herodes ficou furioso e disse: “O filho dele está prestes a tornar-se rei de Israel!”


    Então enviou novamente os oficiais para lhe dizer: “Diga-me a verdade: onde está seu filho? Você sabe que sua vida está em minhas mãos.”


    Os oficiais voltaram e lhe relataram essas palavras.


    (3) Zacarias disse: “Serei mártir de Deus se vocês derramarem meu sangue, pois o Senhor receberá meu espírito, porque vocês estarão derramando sangue inocente à entrada do Templo do Senhor.”


    Ao romper do dia, Zacarias foi assassinado, e o povo de Israel não soube que ele havia sido morto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: asked for John
  choice: procurava João
  rationale: No contexto, a expressão indica que Herodes buscava localizar João, não apenas que perguntava por ele. A formulação portuguesa transmite esse propósito sem acrescentar que João já tivesse sido capturado.
- source_word: officers
  choice: oficiais
  rationale: Mantém o termo amplo do testemunho disponível, sem especificar indevidamente soldados, guardas ou servos.
- source_word: minister of God
  choice: ministro de Deus
  rationale: Preserva a designação cultual ampla, evitando importar um título sacerdotal mais específico que não aparece no testemunho fornecido.
- source_word: sit in God’s Temple
  choice: permaneço no Templo de Deus
  rationale: Em português, uma tradução rigidamente literal como “sento-me” poderia sugerir apenas postura física; “permaneço” comunica presença e serviço habitual, embora a revisão direta do grego ainda seja necessária.
- source_word: martyr of God
  choice: mártir de Deus
  rationale: Conserva a linguagem de testemunho selado pela morte, importante para o sentido teológico e narrativo do texto.
- source_word: around daybreak
  choice: ao romper do dia
  rationale: Expressão natural e digna que mantém a referência temporal aproximada ao amanhecer.
- source_word: murdered
  choice: assassinado
  rationale: Expressa morte intencional e injusta, coerente com a menção explícita ao derramamento de sangue inocente.
theological_decisions:
- issue: A condição expressa em “I’m a martyr of God if you shed my blood”
  choice: “Serei mártir de Deus se vocês derramarem meu sangue”
  alternative: “Sou mártir de Deus se vocês derramarem meu sangue”
  rationale: O futuro em português torna inteligível que a condição se realizará com sua morte, sem eliminar a tensão da autodeclaração profética.
- issue: O destino do espírito de Zacarias
  choice: “o Senhor receberá meu espírito”
  alternative: “o Senhor acolherá meu espírito”
  rationale: “Receberá” preserva de perto a formulação do testemunho e evita ampliar a frase com conotações não explicitadas.
- issue: A declaração de Herodes sobre o filho de Zacarias
  choice: “está prestes a tornar-se rei de Israel”
  alternative: “há de ser rei de Israel”
  rationale: Mantém a iminência sugerida pelo testemunho e não resolve se a fala expressa profecia, medo político ou inferência de Herodes.
- issue: Responsabilidade pelo derramamento de sangue
  choice: plural “vocês”
  alternative: singular dirigido a Herodes
  rationale: No fluxo narrativo, Zacarias fala aos oficiais presentes; o plural preserva essa referência imediata sem excluir a responsabilidade de Herodes como mandante.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Mantiveram-se a numeração das seções e as repetições narrativas características do texto antigo. Trata-se de versão provisória fundamentada no testemunho inglês de domínio público fornecido; a tradição manuscrita grega ainda requer revisão direta. Não foram inseridas notas no texto, pois nenhuma variante grega específica foi disponibilizada para sustentar uma nota crítica.
