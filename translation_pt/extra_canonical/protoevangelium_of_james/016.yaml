translation:
  language: pt
  text: '**Capítulo 16 — A prova**


    **(1)** Então o sacerdote disse:


    — Devolva a virgem que você recebeu do Templo do Senhor.


    José começou a chorar.


    E o sumo sacerdote disse:


    — Eu lhe darei de beber a água da prova do Senhor,[a] e ela revelará diante dos seus olhos o seu pecado.


    **(2)** O sacerdote pegou a água, deu-a a José e o enviou ao deserto. José voltou ileso.


    Depois, deu-a a Maria e a enviou ao deserto. Ela também voltou ilesa.


    Todo o povo ficou admirado porque o pecado deles não havia sido revelado.


    **(3)** Então o sacerdote disse:


    — Se o Senhor Deus não revelou o pecado de vocês, eu também não os julgo.


    E os deixou partir.


    José levou Maria para sua casa, cheio de alegria e glorificando o Deus de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “água da repreensão do Senhor”. A expressão designa aqui a água usada numa prova destinada a revelar culpa.'
    reason: Preserva a amplitude da expressão transmitida pelo testemunho inglês enquanto a revisão direta da tradição manuscrita grega permanece pendente.
lexical_decisions:
- source_word: “the virgin you took from the Temple of the Lord” (English witness)
  choice: “a virgem que você recebeu do Templo do Senhor”
  rationale: “Recebeu” evita sugerir rapto ou apropriação e se ajusta ao contexto narrativo anterior, no qual Maria foi confiada a José, sem tornar explícito além do testemunho o caráter jurídico dessa entrega.
- source_word: “water of the Lord’s rebuke” (English witness; provável campo semântico grego de prova/repreensão/convencimento)
  choice: “água da prova do Senhor”
  rationale: O contexto descreve uma prova ritual destinada a revelar culpa. “Prova” é clara em português atual e preserva a função narrativa; uma nota registra a alternativa mais formal “repreensão”.
- source_word: “sent him/her into the wilderness” (English witness)
  choice: “enviou ao deserto”
  rationale: Mantém a imagem espacial do testemunho sem acrescentar explicações sobre o rito ou seu possível pano de fundo bíblico.
- source_word: “returned unharmed” (English witness)
  choice: “voltou ileso/ilesa”
  rationale: Expressa de modo natural que nenhum dano resultou da prova, conservando a correspondência verbal entre José e Maria.
- source_word: “set them free” (English witness)
  choice: “os deixou partir”
  rationale: Formulação idiomática que comunica liberação sem pressupor que estivessem formalmente presos.
theological_decisions:
- issue: Natureza da água administrada pelo sacerdote
  choice: Descrevê-la como “água da prova do Senhor”
  alternative: “água da repreensão do Senhor” ou identificação explícita com o rito de Números 5
  rationale: A narrativa apresenta uma prova de culpa, mas o testemunho fornecido não autoriza identificar todos os seus detalhes com outro rito nem resolver de forma definitiva a amplitude do termo subjacente.
- issue: Resultado da prova para José e Maria
  choice: Manter que ambos voltaram ilesos e que o pecado deles não foi revelado
  alternative: Declarar diretamente que ambos eram inocentes ou sem pecado
  rationale: O texto relata o resultado da prova e o juízo do sacerdote; a tradução não transforma essa conclusão narrativa numa afirmação teológica mais ampla.
- issue: Declaração judicial do sacerdote
  choice: “eu também não os julgo”
  alternative: “eu também não os condeno”
  rationale: “Julgo” conserva a formulação mais ampla do testemunho e evita estreitá-la necessariamente a uma sentença condenatória.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com diálogo natural de legibilidade brasileira. A repetição paralela aplicada a José e Maria foi preservada. Este rascunho é provisório: foi elaborado a partir do testemunho inglês de domínio público fornecido, pois a revisão direta da tradição manuscrita grega ainda está pendente.'
