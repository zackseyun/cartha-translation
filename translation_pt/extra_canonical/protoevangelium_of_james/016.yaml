  revision_rationale: A revisão restaura no texto principal as formulações mais diretamente sustentadas pelo testemunho inglês, sobretudo “tirou” e “repreensão”, sem extrapolar para uma identificação ritual específica. Também preserva a formulação narrativa de José estar em lágrimas e mantém a ambiguidade quanto ao pecado não revelado e ao alcance do juízo sacerdotal.
