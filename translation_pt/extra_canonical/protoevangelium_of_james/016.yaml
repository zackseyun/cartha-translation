review_pass:
  verdict: revise
  source_fidelity: A redação acompanha a sequência narrativa e preserva corretamente a prova, o retorno sem dano e a suspensão do juízo. Contudo, “recebeu” atenua indevidamente o verbo do testemunho (“took”), e “água da prova” substitui no texto principal “water of the Lord’s rebuke”; a função probatória pode ser explicada em nota, mas não deve deslocar a designação transmitida.
  naturalness: O português é claro e de registro apropriado. “José começou a chorar” é mais pontual do que “was tearful”; “José estava em lágrimas” conserva melhor o estado descrito. Pequenos ajustes tornam a repetição narrativa e a fala judicial mais próximas do testemunho sem perder fluência.
  terminology: “Repreensão” é a correspondente mais direta de “rebuke” no testemunho inglês. “Prova” permanece uma alternativa interpretativa justificável em nota, pois descreve a função do rito, mas não deve ser a leitura principal enquanto falta revisão direta do grego. “Templo do Senhor”, “Senhor Deus” e “Deus de Israel” foram preservados.
  issues:
  - severity: medium
    issue: “recebeu” traduz “you took” como entrega neutra.
    rationale: Embora o contexto anterior possa envolver Maria confiada a José, o testemunho fornecido emprega “took”. A tradução deve manter essa acusação ou formulação potencialmente censuradora, sem a neutralizar por harmonização contextual.
  - severity: medium
    issue: “água da prova do Senhor” substitui “water of the Lord’s rebuke” no corpo do texto.
    rationale: A nota reconhece “repreensão”, mas o texto principal deve refletir a designação do testemunho. O caráter de prova pode ser explicitado na nota sem resolver antecipadamente o termo subjacente.
  - severity: low
    issue: “José começou a chorar” acrescenta um início de ação não expresso.
    rationale: “Was tearful” descreve José em lágrimas, não necessariamente o momento em que começou a chorar.
  revised_text: '**Capítulo 16 — A prova**


    **(1)** Então o sacerdote disse:


    — Devolva a virgem que você tirou do Templo do Senhor.


    José estava em lágrimas.


    E o sumo sacerdote disse:


    — Eu lhe darei de beber a água da repreensão do Senhor,[a] e ela revelará diante dos seus olhos o seu pecado.


    **(2)** Então, tomando a água, o sacerdote a deu a José e o enviou ao deserto. José voltou sem sofrer dano.


    Depois, deu-a a Maria e a enviou ao deserto. Ela voltou sem sofrer dano.


    E todo o povo se admirou de que o pecado deles não tivesse sido revelado.


    **(3)** Então o sacerdote disse:


    — Se o Senhor Deus não lhes revelou o pecado, eu também não os julgo.


    E os deixou partir.


    José levou Maria consigo para sua casa, alegrando-se e glorificando o Deus de Israel.'
  revised_footnotes:
