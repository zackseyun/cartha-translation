    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: pt
  text: '(1) Dia após dia, a criança se fortalecia. Quando completou seis meses, sua mãe a pôs de pé no chão para ver se ela conseguia ficar em pé. Ela deu sete passos e chegou ao colo da mãe. Sua mãe a tomou nos braços e disse: “Tão certo como vive o Senhor, meu Deus, você não voltará a andar neste chão até que eu a leve ao Templo do Senhor.”


    Então ela fez do quarto um santuário e não permitiu que nada profano ou impuro passasse por ali. Chamou as filhas puras dos hebreus, e elas brincavam com a criança.


    (2) Quando a criança completou um ano, Joaquim ofereceu um grande banquete e convidou os chefes dos sacerdotes, os sacerdotes, os escribas, os anciãos e todo o povo de Israel. Joaquim levou a criança aos sacerdotes, e eles a abençoaram, dizendo: “Deus de nossos antepassados, abençoa esta criança e dá-lhe um nome que será proclamado para sempre, por todas as gerações.”


    E todo o povo disse: “Assim seja. Amém!”


    Depois, levaram-na aos chefes dos sacerdotes, e eles a abençoaram, dizendo: “Deus Altíssimo, olha para esta criança e abençoa-a com uma bênção suprema, que não possa ser superada.”[a]


    (3) Sua mãe a levou para o santuário do quarto e amamentou a criança. Então Ana entoou um cântico ao Senhor Deus:


    “Cantarei um cântico santo ao Senhor, meu Deus, porque Deus me visitou e retirou de mim a censura dos meus inimigos.


    “O Senhor Deus me deu o fruto de sua justiça, único e, ao mesmo tempo, múltiplo diante dele.[b]


    “Quem anunciará ao povo de Reubel que Ana amamenta uma criança? ‘Escutem, escutem, doze tribos de Israel: Ana amamenta uma criança!’”[c]


    Ana repousou no santuário do quarto. Depois saiu e serviu os convidados. Terminado o banquete, eles desceram cheios de alegria, glorificando o Deus de Israel.


    [a] Ou: “com a bênção final, que não possa ser superada”.

    [b] A formulação “único e, ao mesmo tempo, múltiplo” é difícil e foi preservada sem tentar resolver seu sentido.

    [c] “Reubel” segue a forma do testemunho disponível; a identificação e a forma do nome dependem de revisão direta do grego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com a bênção final, que não possa ser superada”.'
    reason: Conserva a possibilidade de uma tradução mais literal de 'final blessing'.
  - marker: b
    text: A formulação “único e, ao mesmo tempo, múltiplo” é difícil e foi preservada sem tentar resolver seu sentido.
    reason: Sinaliza uma ambiguidade real do testemunho e evita interpretação teológica indevida.
  - marker: c
    text: “Reubel” segue a forma do testemunho disponível; a identificação e a forma do nome dependem de revisão direta do grego.
    reason: Avisa sobre a incerteza nominal decorrente da ausência de revisão direta da fonte grega.
lexical_decisions:
- source_word: sanctuary
  choice: santuário
  rationale: Preserva a linguagem de espaço consagrado dentro do quarto, sem reduzi-la a mero lugar reservado.
- source_word: sacrilegious or impure
  choice: profano ou impuro
  rationale: Distingue a violação do sagrado da impureza, mantendo os dois conceitos do testemunho.
- source_word: chief priests
  choice: chefes dos sacerdotes
  rationale: Forma clara em português internacional; evita impor ao texto uma estrutura institucional posterior.
- source_word: visited me
  choice: me visitou
  rationale: Mantém a expressão religiosa tradicional de intervenção favorável de Deus sem explicá-la além do texto.
- source_word: criticism
  choice: censura
  rationale: No contexto de vergonha pública e hostilidade, 'censura' é mais digna e natural que 'crítica', embora a revisão grega ainda seja necessária.
- source_word: ministered to them
  choice: serviu os convidados
  rationale: O referente provável são os participantes do banquete; a explicitação mínima produz português natural sem atribuir função litúrgica a Ana.
- source_word: went down
  choice: desceram
  rationale: Preserva o detalhe espacial do testemunho, mesmo sem explicitar o ponto de partida.
theological_decisions:
- issue: Separação ritual da criança
  choice: Manter 'santuário', 'profano' e 'impuro' sem explicação doutrinária
  alternative: Parafrasear como simples proteção doméstica
  rationale: O texto apresenta deliberadamente a infância de Maria em categorias de consagração e pureza; neutralizá-las apagaria sua ênfase narrativa.
- issue: Bênção dos chefes dos sacerdotes
  choice: Traduzir 'final blessing' no corpo como 'bênção suprema', registrando a alternativa literal em nota
  alternative: '''bênção final'' apenas'
  rationale: '''Final'' pode indicar culminância ou caráter insuperável, não necessariamente última em sequência. A nota conserva a ambiguidade do testemunho.'
- issue: Fruto da justiça divina, singular e múltiplo
  choice: Preservar a tensão como 'único e, ao mesmo tempo, múltiplo'
  alternative: Interpretar como descendência única que traz muitas bênçãos
  rationale: O testemunho é obscuro, e não convém resolver sua possível significação teológica sem revisão do grego.
- issue: Nome 'Reubel'
  choice: Reter 'Reubel' com nota de cautela textual
  alternative: Normalizar para 'Rúben'
  rationale: A base fornecida conserva 'Reubel'; normalizar sem exame direto da tradição grega poderia ocultar uma variante ou corrupção textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Empregaram-se 'você' na fala materna e construções litúrgicas naturais nas bênçãos. O rascunho é necessariamente provisório porque a revisão direta da tradição manuscrita grega está pendente; por isso, ambiguidades relevantes foram mantidas ou anotadas.
