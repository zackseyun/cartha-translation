translation:
  language: pt
  text: '(1) José encontrou a parteira e a trouxe enquanto ela descia da montanha.[a] Então lhe disse: “Maria é minha prometida, mas concebeu do Espírito Santo, depois de ter sido criada no Templo do Senhor.”


    A parteira foi com ele. (2) Quando chegaram diante da caverna, uma nuvem escura a cobriu com sua sombra. A parteira disse: “Hoje minha alma é engrandecida, porque meus olhos viram algo maravilhoso: a salvação nasceu para Israel!”


    Imediatamente, a nuvem se retirou da caverna, e uma grande luz apareceu lá dentro, de modo que seus olhos não conseguiam suportá-la. Pouco depois, a luz foi diminuindo, até que apareceu uma criança. Ela se aproximou e tomou o seio de sua mãe, Maria.[b]


    A parteira exclamou: “Como este dia é grandioso, pois vi este novo milagre!”


    (3) A parteira saiu da caverna, e Salomé veio ao seu encontro.


    Ela lhe disse: “Salomé, Salomé, preciso lhe contar uma visão extraordinária: uma virgem deu à luz, o que contraria sua natureza!”[c]


    Salomé respondeu: “Tão certo como vive o Senhor, meu Deus, se eu não introduzir o dedo e examinar sua condição, não acreditarei que a virgem deu à luz.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A abertura é textualmente difícil no testemunho fornecido: literalmente, algo como “ele a encontrou e a trouxe, vindo ela da montanha”. A tradução explicita José como sujeito a partir do contexto.'
    reason: Sinalizar a sintaxe incerta e a explicitação contextual, sobretudo porque a revisão direta do grego ainda está pendente.
  - marker: b
    text: O testemunho diz que a criança “veio” ou “se aproximou” e tomou o seio de Maria; a descrição incomum foi preservada.
    reason: Evitar normalizar silenciosamente a cena como se Maria simplesmente tivesse começado a amamentar.
  - marker: c
    text: 'Também se pode entender: “uma virgem deu à luz, algo contrário à natureza”.'
    reason: Registrar a ambiguidade do pronome em “sua natureza”, que pode apontar para a natureza da virgem ou para a ordem natural em geral.
  - marker: d
    text: “Condição” é um eufemismo do testemunho para o estado físico de Maria após o parto.
    reason: Esclarecer o referente sem inserir no texto principal uma especificação anatômica não confirmada pela base fornecida.
lexical_decisions:
- source_word: betrothed
  choice: prometida
  rationale: Expressa o vínculo matrimonial assumido, mas ainda não consumado, em linguagem natural e amplamente compreensível; evita reduzir a relação ao sentido moderno e informal de “noiva”.
- source_word: overshadowed
  choice: cobriu com sua sombra
  rationale: Preserva a imagem concreta da nuvem que projeta sua sombra sobre a caverna, sem interpretar além do testemunho fornecido.
- source_word: Salvation
  choice: a salvação
  rationale: Mantém a formulação abstrata e teologicamente carregada do testemunho, sem substituí-la explicitamente por “o Salvador”.
- source_word: infant
  choice: uma criança
  rationale: Forma corrente e digna; no contexto, designa claramente o recém-nascido sem impor precisão lexical não confirmada pelo grego.
- source_word: condition
  choice: condição
  rationale: Conserva o eufemismo e a relativa indeterminação do testemunho inglês quanto àquilo que Salomé pretende examinar.
theological_decisions:
- issue: Concepção pelo Espírito Santo
  choice: “concebeu do Espírito Santo”
  alternative: “ficou grávida por ação do Espírito Santo”
  rationale: Mantém concisão e proximidade com a formulação tradicional, sem desenvolver uma explicação doutrinária adicional.
- issue: Personificação da salvação
  choice: “a salvação nasceu para Israel”
  alternative: “o Salvador nasceu para Israel”
  rationale: Preserva a tensão e a forma do testemunho recebido, que fala de “salvação”, em vez de resolver a expressão como um título pessoal.
- issue: Natureza do parto virginal
  choice: “o que contraria sua natureza”
  alternative: “algo que a natureza não permite”
  rationale: Mantém a afirmação difícil e ambígua do texto, sem harmonizá-la com formulações confessionais posteriores.
- issue: Exame pretendido por Salomé
  choice: linguagem eufemística, porém explícita quanto ao gesto
  alternative: explicitar anatomicamente o exame
  rationale: O testemunho fala em introduzir o dedo e examinar a “condição”; a tradução preserva esse nível de detalhe sem acrescentar anatomia não expressa na base disponível.
translation_notes:
  register: Português moderno, digno e narrativamente fluido, com legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque foi preparada a partir do testemunho inglês de domínio público; a tradição manuscrita grega ainda requer revisão direta. Mantiveram-se as repetições enfáticas, as imagens sobrenaturais e as tensões do relato, com notas apenas onde a sintaxe ou o referente são genuinamente incertos.
