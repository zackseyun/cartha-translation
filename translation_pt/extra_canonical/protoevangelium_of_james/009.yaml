    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: pt
  text: '(1) José largou o machado e foi ao encontro deles. Quando todos estavam reunidos, foram até o sacerdote levando seus bastões. O sacerdote pegou todos os bastões, entrou no Templo e orou. Depois de terminar a oração, pegou os bastões, saiu e os devolveu. Mas não havia sinal algum entre eles. José pegou seu bastão por último e, eis que, uma pomba saiu do bastão e voou sobre a cabeça de José. Então o sacerdote lhe disse: “Você foi escolhido para receber sob seus cuidados a virgem do Senhor.”


    (2) José, porém, recusou, dizendo: “Tenho filhos e sou velho, enquanto ela é jovem. Não quero ser motivo de zombaria entre o povo de Israel.”


    O sacerdote lhe disse: “José, tema o Senhor, seu Deus, e lembre-se do que Deus fez a Datã, Abirão e Corá: a terra se abriu e engoliu todos eles por causa da rebelião deles. Portanto, tema agora, José, para que essas coisas não aconteçam em sua casa.”


    (3) Com medo, José a recebeu sob seus cuidados e lhe disse: “Maria, eu a tirei do Templo do Senhor e agora a deixo em minha casa. Vou partir para construir casas, mas voltarei para junto de você. O Senhor protegerá você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: axe
  choice: machado
  rationale: Equivalente direto e natural, preservando a referência ao ofício manual de José.
- source_word: staffs
  choice: bastões
  rationale: Termo amplo e natural para os objetos levados como instrumentos do sinal; evita especificar sem apoio se eram varas, cajados ou bordões.
- source_word: Temple
  choice: Templo
  rationale: A inicial maiúscula identifica o Templo do Senhor em Jerusalém, conforme o contexto religioso da narrativa.
- source_word: look!
  choice: de repente
  rationale: Expressa em português narrativo a irrupção enfática do sinal sem recorrer ao pouco natural 'eis que'.
- source_word: welcome ... into your own care
  choice: receber sob seus cuidados
  rationale: Comunica tutela e responsabilidade sem introduzir linguagem explícita de casamento ou adoção.
- source_word: laughingstock
  choice: motivo de zombaria
  rationale: Formulação corrente e digna que preserva o temor de ridicularização pública.
- source_word: rebellion
  choice: rebelião
  rationale: Mantém a ligação explícita com a revolta de Datã, Abirão e Corá.
- source_word: build houses
  choice: construir casas
  rationale: Preserva o plural e a atividade declarada no testemunho, sem harmonizá-la com tradições posteriores sobre José.
theological_decisions:
- issue: Natureza da relação de José com Maria
  choice: “receber sob seus cuidados”
  alternative: “tomar por esposa” ou “acolher como noiva”
  rationale: O testemunho fornecido descreve custódia ou cuidado, sem declarar casamento neste ponto; a tradução não deve resolver essa questão por importação doutrinária.
- issue: Filhos anteriores de José
  choice: “Tenho filhos”
  alternative: reinterpretar como parentes, dependentes ou filhos futuros
  rationale: A declaração foi mantida literalmente, sem harmonização com diferentes entendimentos confessionais sobre os irmãos de Jesus.
- issue: Origem e movimento da pomba
  choice: “uma pomba saiu do bastão e voou sobre a cabeça de José”
  alternative: “pousou na cabeça de José”
  rationale: O testemunho diz que ela voou sobre a cabeça; não se acrescenta que tenha pousado.
- issue: Ameaça associada à casa de José
  choice: “para que essas coisas não aconteçam em sua casa”
  alternative: explicitar que a casa ou família seria engolida pela terra
  rationale: Preserva-se a formulação aberta e ameaçadora do texto, sem definir exatamente como o precedente seria aplicado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a cadência narrativa antiga sem arcaísmos desnecessários. Como o material fornecido é um testemunho inglês de domínio público e a revisão direta do grego ainda está pendente, escolhas potencialmente sensíveis foram formuladas com cautela e sem falsa precisão.
