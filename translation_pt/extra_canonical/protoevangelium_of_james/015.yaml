translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 15: O sumo sacerdote interroga Maria e José**


    **(1)** Anás, o escriba, foi até José e lhe perguntou:


    — José, por que você não apareceu entre os que viajavam conosco?


    Ele respondeu:


    — Porque fiquei cansado da viagem e descansei no primeiro dia depois de voltar.


    Então Anás se virou e viu que Maria estava grávida.


    **(2)** Ele foi depressa até o sacerdote e lhe disse:


    — José, por quem você deu testemunho, agiu de maneira extremamente contrária à Lei.


    O sacerdote perguntou:


    — O que aconteceu?


    Anás respondeu:


    — José profanou a virgem que recebeu do Templo do Senhor, roubou-lhe o casamento[a] e não revelou isso ao povo de Israel.


    O sacerdote perguntou:


    — José fez isso?


    Anás, o escriba, respondeu:


    — Mande os guardas, e você encontrará a virgem grávida.


    Os guardas foram e a encontraram como ele havia dito. Então conduziram Maria e José ao tribunal.


    **(3)** O sumo sacerdote perguntou a ela:


    — Maria, por que você fez isso? Por que humilhou a sua alma e se esqueceu do Senhor, seu Deus? Você foi criada no Santo dos Santos, recebeu alimento da mão de um anjo, ouviu os hinos dele e dançou diante dele.[b] O que foi isso que você fez?


    Ela chorou amargamente e disse:


    — Tão certo como vive o Senhor Deus, sou pura diante de Deus e não conheci homem algum!


    **(4)** O sacerdote perguntou:


    — José, o que foi isso que você fez?


    José respondeu:


    — Tão certo como vive o Senhor, meu Deus, e como é verdadeiro o testemunho de Deus,[c] sou puro em relação a ela.[d]


    O sacerdote disse:


    — Não dê falso testemunho; diga a verdade. Você lhe roubou o casamento e não revelou isso ao povo de Israel. Também não inclinou a cabeça sob a mão poderosa que deveria abençoar a sua descendência.[e]


    José permaneceu calado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «roubou o casamento dela». A expressão incomum pode acusar José de ter tomado para si ou ocultado a união que deveria ter sido publicamente reconhecida.
    reason: A expressão do testemunho é obscura e não deve ser silenciosamente normalizada como simples casamento clandestino.
  - marker: b
    text: O referente dos pronomes nesta frase não é inteiramente claro no testemunho fornecido; eles podem remeter ao anjo ou, conforme a forma do texto grego a ser confirmada, a seres angelicais no plural.
    reason: Preserva uma ambiguidade pronominal relevante enquanto a revisão direta da tradição manuscrita grega permanece pendente.
  - marker: c
    text: A construção correspondente a «o testemunho da verdade de Deus» é incomum. A tradução a apresenta como uma segunda fórmula de confirmação sem eliminar sua dificuldade.
    reason: Evita oferecer como certa uma interpretação sintática ainda não confirmada por revisão direta do grego.
  - marker: d
    text: Isto é, José declara sua pureza no modo como se relacionou com Maria; o texto não explicita aqui uma ação específica.
    reason: Impede que a tradução resolva a declaração como uma negação sexual mais estreita do que a formulação transmitida.
  - marker: e
    text: A frase liga a submissão à «mão poderosa» à bênção da descendência, mas sua relação exata é incomum e foi mantida sem harmonização.
    reason: Preserva a tensão teológica e sintática do testemunho em vez de acrescentar uma explicação ritual ou matrimonial.
lexical_decisions:
- source_word: traveling group
  choice: os que viajavam conosco
  rationale: Expressa em português corrente a ideia da comitiva ou grupo de viagem sem especificar uma estrutura que o testemunho fornecido não define.
- source_word: acted very lawlessly
  choice: agiu de maneira extremamente contrária à Lei
  rationale: Preserva a gravidade da acusação e o provável contexto religioso-jurídico, evitando a formulação menos natural «agiu muito ilegalmente».
- source_word: Holy of Holies
  choice: Santo dos Santos
  rationale: Emprega a designação bíblica consagrada e inteligível em português para o recinto mais sagrado do Templo.
- source_word: known a man
  choice: conheci homem algum
  rationale: Conserva o eufemismo bíblico para relações sexuais, em registro digno e claro pelo contexto.
- source_word: pure toward her
  choice: puro em relação a ela
  rationale: Mantém a expressão relacional incomum do testemunho em vez de explicá-la como uma negação sexual mais específica.
- source_word: offspring
  choice: descendência
  rationale: Preserva o sentido coletivo e evita decidir entre um único filho e vários descendentes.
theological_decisions:
- issue: Natureza da transgressão atribuída a José
  choice: «contrária à Lei»
  alternative: «criminosa» ou «ímpia»
  rationale: A tradução mantém o caráter jurídico-religioso da acusação sem definir se se trata especificamente de crime civil ou impiedade cultual.
- issue: Declaração de pureza de Maria
  choice: «sou pura diante de Deus»
  alternative: «sou inocente perante Deus»
  rationale: «Pura» conserva a linguagem moral e ritual do testemunho, sem reduzir a declaração apenas a uma absolvição jurídica.
- issue: Declaração de José a respeito de Maria
  choice: «sou puro em relação a ela»
  alternative: «não a toquei»
  rationale: A formulação preserva a amplitude e a estranheza do testemunho, sem inserir uma explicitação sexual ausente da base fornecida.
- issue: Bênção da descendência
  choice: «a mão poderosa que deveria abençoar a sua descendência»
  alternative: «a poderosa mão de Deus, para que sua descendência fosse abençoada»
  rationale: Não se acrescenta explicitamente «de Deus» nem se redefine a relação sintática, preservando a tensão da expressão recebida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. Os diálogos usam «você» para legibilidade contemporânea, enquanto fórmulas solenes como «Tão certo como vive o Senhor» conservam a elevação do relato. A tradução é necessariamente provisória porque o material fornecido identifica apenas um testemunho inglês público e informa que a revisão direta da tradição manuscrita grega ainda está pendente. Por isso, expressões incomuns foram conservadas ou anotadas, sem harmonização denominacional.
