review_pass:
  verdict: revise
  source_fidelity: 'É necessária uma correção segura em (4): a tradição grega do Protoevangelho traz uma ordem negativa a Salomé, equivalente a “não conte/divulgue ... até que a criança entre em Jerusalém”. A testemunha inglesa fornecida aparentemente omite a negação; mantê-la como ordem positiva inverteria o sentido. Em (1), “examinou-a” é mais próximo e menos interpretativo do que “examinou o estado dela”, sem explicitar a natureza corporal do exame.'
  naturalness: O texto é em geral claro e de registro apropriado. “Examinou-a” melhora a fluidez e evita o abstrato pouco natural “o estado dela”. “A criança” preserva a referência não marcada de “child”, onde “o menino” acrescentava marcação de gênero desnecessária.
  terminology: “Deus vivo”, “Senhor Deus” e “salvação” são adequados e mantêm o teor religioso sem estreitar o sentido de salvação a mera cura. “Parteira” preserva a designação do relato e a oscilação referencial entre Salomé e a parteira.
  issues:
  - severity: high
    issue: 'A fala final foi vertida como ordem positiva: “conte ... até que”.'
    rationale: A leitura grega conhecida contém negação nessa ordem. A ausência de “não” na testemunha inglesa provisória muda materialmente a instrução angélica; deve ser corrigida e documentada.
  - severity: medium
    issue: “Examinou o estado dela” acrescenta uma abstração que não é necessária.
    rationale: A formulação de base descreve Salomé examinando a mulher. “Examinou-a” conserva a indeterminação do objeto e soa mais natural em português.
  - severity: low
    issue: “O menino” especifica gênero onde a testemunha inglesa diz apenas “the child”.
    rationale: “A criança” é mais estritamente equivalente e evita acrescentar uma marca gramatical que não é exigida pela formulação de base.
  revised_text: '**Protoevangelho de Tiago — Capítulo 20: O exame de Salomé**


    (1) Ela entrou e a colocou em posição; então Salomé a examinou.[a] E Salomé gritou: “Pus o Deus vivo à prova e, vejam! Minha mão está em chamas e se desprendendo de mim!”


    (2) Ela orou ao Senhor, e a parteira foi curada naquela mesma hora.[b]


    (3) E eis que um anjo do Senhor se pôs diante de Salomé e disse: “Sua oração foi ouvida diante do Senhor Deus. Vá, toque na criança, e você receberá salvação.”


    (4) Ela fez isso, e Salomé foi curada. Enquanto adorava e saía da caverna, eis que a voz de um anjo do Senhor disse: “Salomé, Salomé, não conte as coisas maravilhosas que você viu até que a criança entre em Jerusalém.”[c]'
  revised_footnotes:
  - marker: a
    text: A redação conserva a referência pouco específica à mulher que é colocada em posição e examinada. Não explicita a natureza corporal do exame nem identifica o antecedente dos pronomes além do que o contexto permite.
    reason: Preservar a indeterminação referencial e evitar acrescentar detalhes anatômicos.
  - marker: b
    text: O relato alterna entre “ela”, “Salomé” e “a parteira”; a tradução mantém essas designações sem identificá-las de modo explícito como a mesma pessoa.
    reason: Preservar a ambiguidade referencial do relato.
  - marker: c
    text: 'A ordem é negativa: Salomé não deve divulgar o que viu antes da entrada da criança em Jerusalém. A testemunha inglesa provisória fornecida omite a negação, mas a leitura grega conhecida a contém.'
    reason: Documentar uma correção necessária para que a tradução não inverta o sentido da ordem.
  revision_rationale: 'A revisão corrige a inversão de sentido no mandamento final, alinhando-o à leitura grega, e faz ajustes limitados de equivalência e naturalidade: “a examinou” evita uma abstração interpretativa, e “a criança” conserva a falta de marcação de gênero da formulação de base. As ambiguidades de referentes, o alcance de “salvação” e a descrição não explícita do exame permanecem preservados.'
