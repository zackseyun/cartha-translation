translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 20: O exame de Salomé**


    (1) Ela entrou e a acomodou; então Salomé examinou sua condição.[a] E Salomé gritou: “Pus o Deus vivo à prova e, eis que minha mão está em chamas e se desprende de mim!”


    (2) Ela orou ao Senhor, e a parteira foi curada imediatamente.[b]


    (3) E eis que um anjo do Senhor se pôs diante de Salomé e disse: “Sua oração foi ouvida diante do Senhor Deus. Vá, toque na criança, e você receberá salvação.”


    (4) Ela fez isso, e Salomé foi curada. Depois de adorar, ela saiu da caverna. E eis que uma voz de anjo disse: “Salomé, Salomé, não conte as coisas maravilhosas que você viu até que a criança entre em Jerusalém.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é eufemística e, no contexto, refere-se à condição física examinada. A tradução evita acrescentar uma descrição anatômica que o texto não explicita.
    reason: Preserva a reserva expressiva do original, sem reduzir o sentido a um estado genérico.
  - marker: b
    text: O texto alterna entre “ela”, “Salomé” e “a parteira”. A tradução mantém essa alternância e não identifica explicitamente todos os referentes.
    reason: Preservar a forma referencial do texto e não harmonizar personagens além do que a redação declara.
  - marker: c
    text: 'A ordem é negativa: Salomé não deve relatar o que viu antes de a criança entrar em Jerusalém. A proibição temporal está expressa no texto grego (μὴ ... ἕως ἄν).'
    reason: Esclarecer a negação que é essencial para o sentido da fala angélica.
lexical_decisions:
- source_word: positioned her
  choice: a colocou em posição
  rationale: Mantém a formulação física, mas pouco específica, da testemunha disponível, sem determinar quem é a mulher nem explicitar um procedimento não declarado nela.
- source_word: examined her condition
  choice: examinou o estado dela
  rationale: Preserva o eufemismo e a ambiguidade da testemunha inglesa provisória, evitando acrescentar detalhes anatômicos antes da revisão direta do grego.
- source_word: tested the living God
  choice: Pus o Deus vivo à prova
  rationale: “Pôr à prova” expressa com naturalidade a ideia de testar ou desafiar e conserva o peso religioso da declaração.
- source_word: on fire and falling away from me
  choice: está em chamas e se desprendendo de mim
  rationale: Retém as duas imagens severas — ardor e perda física — sem reduzir a segunda a mero enfraquecimento.
- source_word: in that hour
  choice: naquela mesma hora
  rationale: Expressão portuguesa idiomática que preserva a cura imediata narrada.
- source_word: stood towards Salome
  choice: se pôs diante de Salomé
  rationale: Reproduz a posição do anjo em relação a Salomé com português natural, sem interpretar além da aparição diante dela.
- source_word: you’ll receive salvation
  choice: você receberá salvação
  rationale: Mantém “salvação” em sentido aberto, sem restringi-la antecipadamente a cura física ou salvação espiritual.
- source_word: report the wonderful things
  choice: conte as coisas maravilhosas
  rationale: Formulação atual e digna, compreensível em português amplo, que comunica a ordem de tornar conhecido o que foi visto.
theological_decisions:
- issue: Sentido de “salvação” na promessa do anjo
  choice: Manter “salvação” sem complemento explicativo
  alternative: Traduzir como “cura” ou “você será salva”
  rationale: O contexto associa a promessa à cura da mão, mas o termo também pode ter alcance mais amplo. A tradução não resolve essa tensão.
- issue: Identidade da mulher que ora e da “parteira” curada
  choice: Preservar os referentes pronominais e manter “a parteira” como designação distinta
  alternative: Identificar explicitamente Salomé como a mulher que ora e como a parteira
  rationale: A testemunha fornecida alterna entre pronome, Salomé e “a parteira”. Explicitar a identidade eliminaria uma ambiguidade genuína do material de base.
- issue: Ação de Salomé diante do Deus vivo
  choice: “Pus o Deus vivo à prova”
  alternative: “Tentei o Deus vivo” ou “duvidei do Deus vivo”
  rationale: A escolha mantém a ideia de teste presunçoso sem impor que a falta tenha sido especificamente tentação ou incredulidade.
- issue: Ordem final sobre a divulgação
  choice: 'Traduzir positivamente: “conte ... até que”'
  alternative: 'Entender como proibição: “não conte ... até que”'
  rationale: A testemunha fornecida não contém negação. Embora a formulação final seja incomum, não se introduziu uma proibição ausente antes da revisão direta da tradição grega.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. Emprega “você” nas falas para boa legibilidade brasileira, sem coloquialismo excessivo. “E eis que” conserva o ritmo narrativo antigo sem tornar todo o período arcaizante. Esta é uma versão provisória baseada na testemunha inglesa de domínio público fornecida; a revisão direta do grego continua pendente.
