base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: pt
  text: '(1) Eu, Tiago, escrevi este relato em Jerusalém, quando houve agitação por causa da morte de Herodes. Fui para o deserto até que a agitação em Jerusalém tivesse passado. Eu glorificava o Senhor Deus, que me deu sabedoria para escrever este relato.


    (2) E a graça estará com todos os que temem o Senhor. Amém.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account (Greek review pending)
  choice: relato
  rationale: “Relato” é natural em português e não impõe ao texto a noção moderna de historiografia; acompanha a formulação da testemunha inglesa enquanto a revisão direta do grego permanece pendente.
- source_word: commotion / unrest (Greek review pending)
  choice: agitação
  rationale: Preserva a ideia ampla de perturbação pública sem especificar, além da evidência disponível, se houve tumulto, revolta ou simples inquietação.
- source_word: wilderness (Greek review pending)
  choice: deserto
  rationale: É a correspondência bíblica corrente e inteligível para uma região erma, sem acrescentar detalhes geográficos.
- source_word: fear the Lord (Greek review pending)
  choice: temem o Senhor
  rationale: Mantém a expressão religiosa tradicional e sua amplitude sem reduzi-la a reverência ou medo.
theological_decisions:
- issue: Aspecto verbal de “was glorifying”
  choice: “Eu glorificava o Senhor Deus”
  alternative: “Eu glorifiquei o Senhor Deus”
  rationale: A forma imperfeita preserva o aspecto contínuo da testemunha fornecida, em vez de convertê-lo num ato pontual como faz a camada inglesa POB.
- issue: Valor temporal de “grace will be with”
  choice: “a graça estará com”
  alternative: “a graça esteja com”
  rationale: Mantém a afirmação no futuro da testemunha disponível, sem transformá-la silenciosamente em bênção optativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A redação é necessariamente provisória, pois foi elaborada a partir da testemunha inglesa pública fornecida; a revisão direta da tradição manuscrita grega ainda está pendente.
