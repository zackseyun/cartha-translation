source:
  text: '(1) Now I, James, wrote this history in Jerusalem when there was a commotion over Herod’s death. I went into the wilderness until the commotion in Jerusalem had died down. I was glorifying the Lord God, who gave me the wisdom to write this history.


    (2) And grace will be with all who fear the Lord. Amen.'
