base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: pt
  text: '(1) E eis que José se preparava para partir para a Judeia quando houve grande agitação em Belém da Judeia. Pois chegaram magos[a], dizendo: “Onde está o rei dos judeus? Vimos a sua estrela no Oriente[b] e viemos adorá-lo[c]”.


    (2) Quando Herodes ouviu isso, ficou perturbado. Enviou oficiais e mandou chamar os magos, e eles lhe falaram sobre a estrela.


    (3) E eis que eles viram estrelas no Oriente. As estrelas conduziram os magos até chegarem à caverna; então a estrela parou sobre a cabeça da criança. Quando os magos viram a criança com Maria, sua mãe, tiraram presentes de suas bolsas: ouro, incenso e mirra.


    Depois de serem avisados pelo anjo, voltaram para a sua terra por outro caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Magos” designava especialistas associados a saberes religiosos, interpretação de sonhos e observação dos astros; o texto não diz que eram reis.
    reason: Evitar que a tradição posterior restrinja o sentido do termo.
  - marker: b
    text: 'Ou: “quando ela surgiu”. A expressão pode referir-se ao Oriente ou ao aparecimento da estrela.'
    reason: Registrar uma ambiguidade tradicional da expressão subjacente, cuja revisão direta do grego ainda está pendente.
  - marker: c
    text: O verbo também pode significar prestar homenagem ou prostrar-se diante de alguém, especialmente de um rei.
    reason: Preservar a tensão entre homenagem régia e adoração religiosa.
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Preserva o termo antigo e sua amplitude, sem convertê-los indevidamente em reis ou reduzir sua função a astrólogos.
- source_word: worship
  choice: adorá-lo
  rationale: Expressa de modo natural o ato de reverência profunda dirigido ao rei menino, mantendo a possível força religiosa do verbo.
- source_word: East
  choice: Oriente
  rationale: Mantém a ambiguidade do testemunho entre o lugar onde a estrela foi vista e a região de onde vieram os magos.
- source_word: cave
  choice: caverna
  rationale: Conserva o cenário próprio desta narrativa, sem harmonizá-lo com outras tradições do nascimento.
- source_word: child
  choice: criança
  rationale: Termo corrente e não excessivamente interpretativo; evita especificar uma idade que o texto não fornece.
theological_decisions:
- issue: Natureza dos magos
  choice: magos
  alternative: sábios / astrólogos / reis magos
  rationale: O texto não os chama de reis e o termo pode abranger especialistas religiosos, intérpretes de sonhos e observadores dos astros; por isso, a transliteração tradicional preserva melhor a abertura semântica.
- issue: Ato prestado à criança
  choice: adorá-lo
  alternative: prestar-lhe homenagem
  rationale: “Adorar” preserva a intensidade e a possível dimensão cultual, embora o verbo também possa descrever homenagem a um soberano; a nota registra essa amplitude.
- issue: Alternância entre plural e singular
  choice: “estrelas” e depois “a estrela”
  alternative: uniformizar tudo no singular
  rationale: A mudança está presente no testemunho fornecido e pode refletir uma característica textual significativa; não deve ser corrigida silenciosamente.
- issue: Agente do aviso final
  choice: “pelo anjo”
  alternative: “em sonho” ou “por revelação divina”
  rationale: Segue o testemunho desta obra sem harmonização com Mateus 2.12.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantiveram-se “E vejam!” como recurso narrativo enfático, “Judeia” e “Belém” nas formas correntes, e a repetição deliberada de “estrela/estrelas”. Como a revisão direta da tradição manuscrita grega está pendente, o texto é um rascunho fundamentado no testemunho inglês público fornecido; as notas evitam afirmar além da evidência disponível.
