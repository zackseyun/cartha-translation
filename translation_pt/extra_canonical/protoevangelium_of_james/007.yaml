translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 7: Maria vai ao Templo**


    (1) À medida que os meses passavam, Ana cuidava da criança. Quando ela completou dois anos, Joaquim disse:


    — Vamos levá-la ao Templo do Senhor, para cumprirmos a promessa que fizemos, a fim de que o Senhor não se ire contra nós nem rejeite a nossa oferta.


    Ana, porém, respondeu:


    — Vamos esperar até que ela complete três anos, para que não procure pelo pai nem pela mãe.


    E Joaquim disse:


    — Vamos esperar.


    (2) Quando a criança completou três anos, Joaquim disse:


    — Vamos chamar as filhas puras dos hebreus. Que elas peguem suas lâmpadas e as mantenham acesas, para que a criança não volte atrás e seu coração não seja atraído para longe do Templo do Senhor.


    E assim fizeram, até subirem ao Templo do Senhor.


    O sacerdote a recebeu, beijou-a e disse:


    — O Senhor Deus engrandeceu o seu nome entre todas as gerações. Por meio de você, nos últimos dias, o Senhor revelará a redenção do povo de Israel.[a]


    (3) Então ele a colocou sentada no terceiro degrau do altar, e o Senhor Deus derramou graça sobre ela. Ela dançou, e toda a casa de Israel amou-a.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Redenção” também pode ter o sentido de “libertação” ou “resgate”. A revisão direta do texto grego ainda poderá precisar essa escolha.
    reason: Preserva a amplitude semântica teológica indicada pelo testemunho e informa com transparência a limitação da base de trabalho.
lexical_decisions:
- source_word: Temple of the Lord
  choice: Templo do Senhor
  rationale: Mantém a referência cultual específica e a repetição enfática do testemunho fornecido.
- source_word: promise
  choice: promessa
  rationale: Expressa de modo natural o compromisso solene assumido pelos pais sem acrescentar a ideia técnica de voto, que dependeria de confirmação no grego.
- source_word: gift
  choice: oferta
  rationale: No contexto de apresentação no Templo, “oferta” comunica melhor a dimensão religiosa do que “presente”, sem identificar a criança explicitamente como sacrifício.
- source_word: pure daughters of the Hebrews
  choice: filhas puras dos hebreus
  rationale: Preserva de modo relativamente formal a expressão do testemunho, sem substituí-la por “virgens” antes da revisão direta do grego.
- source_word: lamps
  choice: lâmpadas
  rationale: Equivalente amplo e historicamente apropriado; evita a imagem moderna específica de lanternas.
- source_word: redemption
  choice: redenção
  rationale: Conserva a linguagem teológica do testemunho e sua possível amplitude entre libertação e resgate.
- source_word: house of Israel
  choice: casa de Israel
  rationale: Preserva a expressão coletiva tradicional, em vez de reduzi-la a uma referência apenas geográfica ou étnica.
theological_decisions:
- issue: Função de Maria na redenção de Israel
  choice: “Por meio de você... o Senhor revelará a redenção”
  alternative: “Em você... o Senhor manifestará a libertação”
  rationale: Mantém Deus como agente da revelação e preserva a mediação expressa no testemunho, sem definir além do texto a natureza exata do papel de Maria.
- issue: Graça derramada sobre Maria
  choice: “o Senhor Deus derramou graça sobre ela”
  alternative: “o Senhor Deus lhe concedeu favor”
  rationale: “Graça” conserva a formulação teológica do testemunho; a tradução não desenvolve implicações doutrinárias que o trecho não explicita.
- issue: “Últimos dias”
  choice: “nos últimos dias”
  alternative: “no fim dos dias”
  rationale: Mantém a tensão escatológica da expressão sem determinar cronologia ou sistema interpretativo.
- issue: Pureza das filhas dos hebreus
  choice: “filhas puras dos hebreus”
  alternative: “virgens hebreias”
  rationale: Evita definir a pureza exclusivamente como virgindade enquanto a leitura direta da tradição manuscrita grega estiver pendente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os diálogos usam travessões e formas naturais como “vamos”, sem perder o tom antigo da narrativa. A tradução foi elaborada a partir do testemunho inglês público fornecido e consultada como ponte provisória; a revisão direta da tradição manuscrita grega continua pendente. Por isso, escolhas potencialmente dependentes do grego — sobretudo “filhas puras”, “oferta” e “redenção” — foram mantidas com cautela, sem harmonização doutrinária.
