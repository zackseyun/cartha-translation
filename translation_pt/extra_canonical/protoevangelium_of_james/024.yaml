translation:
  language: pt
  text: '(1) À hora da saudação, os sacerdotes chegaram, mas Zacarias não veio ao encontro deles para abençoá-los, como era costume. Então os sacerdotes ficaram esperando por Zacarias, para saudá-lo e glorificar o Deus Altíssimo.


    (2) Como ele demorava, todos ficaram com medo. Um deles, porém, criou coragem para entrar no santuário e viu sangue coagulado junto ao altar do Senhor. E uma voz dizia: “Zacarias foi assassinado, e seu sangue não será apagado até que venha aquele que o vingará!”


    Ao ouvir essas palavras, ele ficou com medo, saiu e contou aos sacerdotes o que tinha visto e ouvido.


    (3) Então eles criaram coragem, entraram e viram o que havia acontecido. As tábuas do Templo clamaram, e os sacerdotes rasgaram as próprias vestes de alto a baixo. Não encontraram o corpo de Zacarias, mas viram que seu sangue havia se transformado em pedra. Tomados de medo, saíram e anunciaram a todo o povo que Zacarias tinha sido assassinado. Quando todas as tribos do povo souberam disso, ficaram de luto por ele e choraram durante três dias e três noites.


    (4) Depois de três dias, os sacerdotes se reuniram em conselho para decidir quem ocuparia o lugar de Zacarias. A sorte caiu sobre Simeão, pois o Espírito Santo lhe havia revelado que ele não veria a morte antes de ver o Cristo em carne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hour of greeting
  choice: hora da saudação
  rationale: Mantém a designação temporal e ritual do testemunho sem especificar uma cerimônia não explicitada.
- source_word: sanctuary
  choice: santuário
  rationale: Distingue a área sagrada interna do Templo mencionado posteriormente.
- source_word: blood clotted
  choice: sangue coagulado
  rationale: Preserva a imagem física incomum do testemunho.
- source_word: avenger
  choice: aquele que o vingará
  rationale: Expressa a função pessoal do vingador com naturalidade, sem identificar quem seria.
- source_word: panels of the Temple
  choice: painéis do Templo
  rationale: Tradução cautelosa diante da falta de revisão direta do termo grego; evita trocar a imagem por portas, paredes ou tábuas.
- source_word: the lot fell to Simeon
  choice: a sorte caiu sobre Simeão
  rationale: Conserva a linguagem tradicional de escolha por sorteio e não a reduz a uma simples eleição.
- source_word: the Christ in the flesh
  choice: o Cristo em carne
  rationale: Preserva a formulação cristológica concreta e sua possível tensão, sem expandi-la para uma interpretação doutrinária.
theological_decisions:
- issue: Persistência do sangue até a chegada do vingador
  choice: não será apagado até que venha aquele que o vingará
  alternative: não será removido até que venha seu defensor
  rationale: Mantém o sentido judicial e retributivo de “avenger”, sem identificar o agente nem suavizar a afirmação.
- issue: Revelação do Espírito Santo a Simeão
  choice: o Espírito Santo lhe havia revelado
  alternative: ele havia recebido um oráculo do Espírito Santo
  rationale: Comunica de modo natural que Simeão recebeu a mensagem, sem determinar o meio da revelação.
- issue: Ver o Cristo em carne
  choice: ver o Cristo em carne
  alternative: ver o Messias encarnado
  rationale: Evita transformar a expressão em terminologia teológica posterior e preserva sua forma concreta.
translation_notes:
  register: Português moderno, digno e narrativamente claro, com boa legibilidade brasileira e compreensão internacional. A repetição excessiva de conectivos foi moderada sem alterar a sequência dos acontecimentos. O texto é necessariamente provisório, pois o material fornecido declara pendente a revisão direta da tradição manuscrita grega.
