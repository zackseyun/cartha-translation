source:
  text: '(1) And Joseph was very afraid and kept quiet about her, considering what to do about her. And Joseph said, “If I hide her sin, I’ll be found resisting the law of the Lord, but if I reveal her to the people of Israel, I’m afraid that what’s inside her might be angelic, and I’ll be found handing over innocent blood to the judgment of death. So what will I do about her? I’ll secretly set her free from me.”


    And night overtook him. (2) And look! An angel of the Lord appeared to him in a dream, saying, “Don’t fear this child, for the one in her is from the Holy Spirit. And she’ll give birth to a son, and you’ll call his name ‘Jesus,’ because he’ll save his people from their sins.”


    And Joseph arose from his sleep and glorified the God of Israel, who had given grace to him. And he protected her.'
