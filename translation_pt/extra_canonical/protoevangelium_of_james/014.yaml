base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: pt
  text: '(1) José ficou com muito medo e guardou silêncio a respeito dela, pensando no que faria. José disse: “Se eu encobrir o pecado dela, serei considerado contrário à lei do Senhor. Mas, se eu a denunciar ao povo de Israel, temo que aquilo que está dentro dela seja de origem angélica, e acabarei entregando sangue inocente à sentença de morte. Então, o que farei com ela? Em segredo, vou liberá-la do compromisso comigo.”


    A noite o alcançou. (2) E eis que um anjo do Senhor lhe apareceu em sonho e disse: “Não tenha medo por causa desta criança, pois aquele que está nela vem do Espírito Santo. Ela dará à luz um filho, e você lhe dará o nome de Jesus[a], porque ele salvará o seu povo dos pecados deles.”


    José despertou do sono e glorificou o Deus de Israel, que lhe havia concedido graça. E passou a protegê-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jesus: forma portuguesa do nome associado ao hebraico Yeshua/Josué, relacionado à ideia de que o Senhor salva; o próprio texto explica o nome pela frase seguinte.'
    reason: A nota esclarece o jogo etimológico entre o nome e a missão de salvar, que não fica plenamente visível em português.
lexical_decisions:
- source_word: kept quiet about her
  choice: guardou silêncio a respeito dela
  rationale: Preserva a ideia de não tornar pública a situação de Maria sem sugerir, além do testemunho fornecido, uma ação jurídica específica.
- source_word: what’s inside her might be angelic
  choice: aquilo que está dentro dela seja de origem angélica
  rationale: Mantém a formulação incomum e a incerteza de José, evitando identificar diretamente o concebido como anjo.
- source_word: release her from me
  choice: liberá-la do compromisso comigo
  rationale: Expressa em português natural o afastamento secreto pretendido por José, sem impor terminologia matrimonial ou jurídica mais específica do que a evidência fornecida permite.
- source_word: Do not fear this child
  choice: Não tenha medo por causa desta criança
  rationale: A formulação deixa claro que a criança é a causa ou o objeto do temor, sem sugerir que José deva temer pela segurança dela.
- source_word: the one in her is from the Holy Spirit
  choice: aquele que está nela vem do Espírito Santo
  rationale: Conserva tanto a referência pessoal ao concebido quanto a afirmação de sua origem no Espírito Santo.
- source_word: protected her
  choice: passou a protegê-la
  rationale: Reproduz o sentido amplo do testemunho sem restringi-lo a acolher, guardar ou manter sob custódia.
theological_decisions:
- issue: Natureza do que estava no ventre de Maria na reflexão de José
  choice: “seja de origem angélica”
  alternative: “seja um anjo”
  rationale: Preserva a ambiguidade do adjetivo “angelic” no testemunho disponível e não transforma a suspeita de José em identificação ontológica definida.
- issue: Relação do concebido com o Espírito Santo
  choice: “vem do Espírito Santo”
  alternative: “foi concebido pelo Espírito Santo”
  rationale: Mantém a forma de procedência apresentada no testemunho e evita explicitar um mecanismo de concepção não formulado nesta frase.
- issue: Objeto de “seu povo”
  choice: “o seu povo”
  alternative: “o povo de Israel”
  rationale: Retém o pronome do texto, permitindo que sua referência permaneça aberta no contexto imediato em vez de resolvê-la editorialmente.
- issue: Graça concedida a José
  choice: “lhe havia concedido graça”
  alternative: “lhe havia mostrado favor”
  rationale: Preserva o vocabulário teológico tradicional e compreensível de “graça”, sem definir em que consistiu a dádiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira sem regionalismos marcados. A estrutura narrativa e as repetições de “José” foram mantidas quando relevantes ao estilo antigo. Como a revisão direta do grego ainda está pendente, escolhas potencialmente sensíveis foram formuladas com cautela e baseadas no testemunho inglês público fornecido.
