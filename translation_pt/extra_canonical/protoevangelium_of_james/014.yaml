review_pass:
  verdict: revise
  source_fidelity: 'A revisão permanece condicionada ao testemunho inglês fornecido, pois não foi disponibilizado texto grego para cotejo direto. O rascunho preserva bem a sequência e os elementos centrais, mas algumas expansões interpretativas restringem ou alteram a formulação do testemunho: “do compromisso comigo” introduz uma especificação relacional ausente em “release her from me”; “por causa desta criança” resolve desnecessariamente a construção “Do not fear this child”; e “passou a protegê-la” acrescenta aspecto ingressivo não expresso. A revisão proposta conserva a ambiguidade de “might be angelic” e a força judicial das ponderações de José.'
  naturalness: 'O texto é claro e de registro apropriado. Foram feitos pequenos ajustes para maior naturalidade semântica e precisão: “serei considerado em transgressão da lei” comunica melhor a consequência jurídica; “torná-lo conhecido” evita a conotação acusatória específica de “denunciar”; e “deixá-la ir” reproduz de modo idiomático a liberação secreta sem definir o estatuto da relação.'
  terminology: “Espírito Santo”, “graça”, “Deus de Israel” e “Jesus” são adequados. A nota sobre Jesus deve evitar apresentar “Yeshua/Josué” como se fossem uma única forma. A forma portuguesa procede do grego Iēsous e corresponde, no contexto semítico, a Yeshua; Josué representa uma forma hebraica relacionada, mas distinta.
  issues:
  - severity: medium
    issue: “liberá-la do compromisso comigo” especifica um compromisso que o testemunho não nomeia.
    rationale: “Release her from me” expressa separação/liberação, mas não define explicitamente a natureza jurídica ou matrimonial do vínculo. “Deixá-la ir em segredo” mantém a abertura do texto.
  - severity: medium
    issue: “Não tenha medo por causa desta criança” interpreta a relação entre o temor e a criança.
    rationale: O testemunho diz literalmente “Do not fear this child”. A formulação revista, “Não tenha medo desta criança”, preserva a construção incomum sem explicar por que ou de que modo José temia.
  - severity: low
    issue: “Passou a protegê-la” acrescenta início ou continuidade de uma ação.
    rationale: O verbo do testemunho simplesmente afirma que José a protegeu. “Protegeu-a” evita esse acréscimo aspectual.
  - severity: low
    issue: A nota etimológica une de modo impreciso Yeshua e Josué.
    rationale: É mais exato distinguir o grego Iēsous, a forma semítica Yeshua e a forma relacionada traduzida por “Josué”.
  revised_text: '(1) José ficou com muito medo e guardou silêncio a respeito dela, enquanto considerava o que fazer. José disse: “Se eu encobrir o pecado dela, serei considerado em transgressão da lei do Senhor. Mas, se eu o tornar conhecido ao povo de Israel, temo que aquilo que está dentro dela possa ser angélico, e serei considerado alguém que entrega sangue inocente ao juízo de morte. Então, o que farei com ela? Vou deixá-la ir em segredo.”



    A noite o alcançou. (2) E eis que um anjo do Senhor lhe apareceu em sonho e disse: “Não tenha medo desta criança, pois aquele que está nela vem do Espírito Santo. Ela dará à luz um filho, e você lhe dará o nome de Jesus[a], porque ele salvará o seu povo dos pecados deles.”



    José despertou do sono e glorificou o Deus de Israel, que lhe havia concedido graça. E protegeu-a.'
  revised_footnotes:
  - marker: a
    text: 'Jesus: forma portuguesa do grego Iēsous, correspondente ao nome semítico Yeshua; o nome está relacionado à ideia de que o Senhor salva. O próprio texto explica o nome pela frase seguinte.'
    reason: Esclarece o jogo etimológico entre o nome e “salvará”, sem identificar indevidamente Yeshua e a forma relacionada tradicionalmente vertida por “Josué”.
  revision_rationale: A revisão elimina especificações não expressas pelo testemunho, preserva construções deliberadamente incomuns e a incerteza da reflexão de José, e ajusta a nota etimológica. Mantêm-se a linguagem teológica tradicional e a leitura moderna em português internacional com boa fluidez brasileira.
