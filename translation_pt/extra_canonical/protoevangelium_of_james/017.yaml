review_pass:
  verdict: revise
  source_fidelity: É necessária revisão para corrigir «dois povos», que altera o referente explícito da testemunha («two people»). «Esta jovem» também interpreta e restringe «this child»; «esta criança» preserva melhor a designação narrativa. A formulação indireta para quem está no ventre, «dia do Senhor» e o título «rei Augusto» foram mantidos.
  naturalness: A redação revista mantém português moderno e fluente, com repetição narrativa suficiente para refletir o texto. «Dizia consigo» torna natural a fala interior de José, e «a levou/ela a conduzia» esclarece o antecedente de «it» sem acrescentar informação.
  terminology: «Pessoas» restitui o termo coletivo humano sem transformá-lo em grupos étnicos ou religiosos. «Situação constrangedora» conserva prudentemente a expressão difícil relativa à condição de Maria; a nota indica a incerteza sem interpretação doutrinária.
  issues:
  - severity: high
    issue: «dois povos» traduz «two people»
    rationale: «Povos» substitui duas pessoas por coletividades e favorece leituras alegóricas que a passagem não identifica. O texto deve dizer «duas pessoas».
  - severity: medium
    issue: «esta jovem» restringe «this child»
    rationale: A testemunha chama Maria de «child» neste ponto. «Esta criança» preserva a formulação e evita determinar sua faixa etária.
  - severity: low
    issue: A nota [a] repete a alteração interpretativa «dois povos»
    rationale: A nota deve referir-se a «duas pessoas» e descrever a obscuridade da imagem sem introduzir um sentido coletivo.
