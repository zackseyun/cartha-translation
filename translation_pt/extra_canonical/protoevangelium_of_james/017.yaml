translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 17: O recenseamento**


    **(1)** Então saiu uma ordem do rei Augusto para registrar quantas pessoas havia em Belém da Judeia.


    E José disse: “Registrarei meus filhos. Mas o que farei com esta jovem? Como a registrarei? Como minha esposa? Tenho vergonha. Como minha filha? Mas o povo de Israel sabe que ela não é minha filha. Este é o dia do Senhor; farei o que o Senhor quiser.”


    **(2)** Então ele pôs a sela no jumento, fez Maria montar nele, e seu filho o conduzia, enquanto Samuel os seguia.


    Quando se aproximavam da terceira milha, José se virou e viu que ela estava triste. E pensou: “Provavelmente aquele que está dentro dela a está afligindo.”


    José se virou outra vez e a viu sorrindo. Então lhe disse: “Maria, por que você está assim? Em um momento vejo seu rosto sorrindo e, em outro, triste.”


    Ela lhe respondeu: “É porque vejo dois povos em meus olhos[a]: um chora e se lamenta, e o outro se alegra e exulta.”


    **(3)** Quando chegaram ao meio do caminho, Maria lhe disse: “José, ajude-me a descer do jumento, porque aquele que está dentro de mim está forçando para sair.”


    Ele a ajudou a descer do jumento e lhe disse: “Aonde vou levar você e abrigá-la nesta sua situação constrangedora[b]? Este lugar é deserto.”


    [a] Expressão incomum, mantida sem explicar de que modo Maria vê os dois povos.


    [b] Ou: “nesta sua condição embaraçosa”. O sentido exato da expressão transmitida pela testemunha inglesa é incerto neste contexto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão incomum, mantida sem explicar de que modo Maria vê os dois povos.
    reason: Preserva uma imagem obscura e evita impor uma interpretação alegórica ou psicológica.
  - marker: b
    text: 'Ou: “nesta sua condição embaraçosa”. O sentido exato da expressão transmitida pela testemunha inglesa é incerto neste contexto.'
    reason: A redação inglesa “awkwardness” é semanticamente incomum; a nota registra a incerteza enquanto a revisão direta do grego permanece pendente.
lexical_decisions:
- source_word: Augustus the king
  choice: rei Augusto
  rationale: Mantém o título apresentado pela testemunha fornecida, sem substituí-lo pelo historicamente mais habitual “imperador”.
- source_word: this child
  choice: esta jovem
  rationale: No contexto, refere-se a Maria; “jovem” é natural em português e evita sugerir, sem necessidade, uma criança pequena.
- source_word: two people
  choice: dois povos
  rationale: A cena contrasta dois grupos coletivos que choram e se alegram; “povos” preserva melhor essa dimensão sem identificar alegoricamente os grupos.
- source_word: the one inside her / me
  choice: aquele que está dentro dela / de mim
  rationale: Conserva a formulação indireta e a tensão narrativa, sem acrescentar uma identificação explícita.
- source_word: wilderness
  choice: lugar deserto
  rationale: Expressa um local ermo e sem abrigo, mais naturalmente do que o substantivo abstrato “deserto” isolado.
theological_decisions:
- issue: Identidade dos dois povos vistos por Maria
  choice: Não identificar os grupos no texto nem na nota
  alternative: Interpretá-los como Israel e os gentios, ou como crentes e descrentes
  rationale: A passagem não os identifica expressamente; explicitar uma leitura tradicional eliminaria a ambiguidade do texto.
- issue: Identidade daquele que está dentro de Maria
  choice: Preservar a referência indireta
  alternative: Substituir por “o menino”, “o bebê” ou “Jesus”
  rationale: A formulação indireta pertence à narrativa e não deve ser teologicamente explicitada na tradução.
- issue: “Dia do Senhor”
  choice: Manter a expressão sem explicação doutrinária
  alternative: Interpretá-la como uma festa, um momento providencial específico ou o dia escatológico
  rationale: O contexto fornecido não determina com segurança qual nuance da expressão está em vista.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque o material fornecido declara pendente a revisão direta da tradição manuscrita grega. A repetição narrativa foi moderadamente preservada, enquanto construções inglesas pouco naturais foram vertidas em português corrente.
