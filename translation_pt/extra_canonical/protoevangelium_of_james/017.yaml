    Quando se aproximavam da terceira milha, José se virou e viu que ela estava triste. E dizia consigo: “Provavelmente aquele que está dentro dela a está afligindo.”


    José se virou outra vez e a viu sorrindo. Então lhe disse: “Maria, por que você está assim? Em um momento vejo seu rosto sorrindo e, em outro, triste.”


