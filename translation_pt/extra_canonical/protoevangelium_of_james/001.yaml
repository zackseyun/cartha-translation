translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 1: A aflição de Joaquim**


    (1) Nas histórias[a] das doze tribos de Israel, Joaquim era um homem muito rico. Ele duplicava as dádivas que oferecia ao Senhor, dizendo consigo mesmo: “Uma parte, tirada do que me sobra, será para todo o povo; a outra será para o Senhor Deus, como expiação por mim.”


    (2) Aproximava-se o grande dia do Senhor, e os israelitas apresentavam suas dádivas. Rubel, porém, pôs-se diante de Joaquim e lhe disse: “Não é permitido que você apresente primeiro as suas dádivas, pois não gerou descendência em Israel.”


    (3) Joaquim ficou profundamente entristecido e foi consultar as histórias[a] das doze tribos do povo, dizendo consigo mesmo: “Examinarei as histórias[a] das doze tribos de Israel para saber se sou o único que não gerou descendência em Israel.” Depois de pesquisar, descobriu que todos os justos de Israel haviam gerado descendência. Lembrou-se também de que, nos últimos dias do patriarca Abraão, o Senhor Deus lhe dera um filho, Isaque.


    (4) Joaquim ficou profundamente entristecido e não voltou para sua esposa. Retirou-se para o deserto e ali armou sua tenda. Jejuou durante quarenta dias e quarenta noites, dizendo consigo mesmo: “Não descerei para comer nem beber até que o Senhor, meu Deus, me visite[b]. A oração será meu alimento e minha bebida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “registros”, “crônicas” ou, possivelmente, “genealogias”. O termo grego tradicionalmente lido aqui é ambíguo no contexto; o testemunho inglês fornecido conserva a incerteza como “(history)”.
    reason: Preserva, nas três ocorrências relacionadas, a incerteza semântica e textual sem escolher como certa uma única identificação do material consultado.
  - marker: b
    text: A expressão indica que Deus volte sua atenção para Joaquim e intervenha em sua situação; ela não especifica antecipadamente qual será a resposta divina.
    reason: Esclarece o uso idiomático de “visitar” sem antecipar o desenrolar narrativo.
lexical_decisions:
- source_word: histories (English witness; underlying Greek review pending)
  choice: registros
  rationale: No contexto, Joaquim consulta documentos relativos às doze tribos. “Registros” comunica essa função sem excluir inteiramente os sentidos de histórias, crônicas ou genealogias; a incerteza é explicitada em nota.
- source_word: gifts
  choice: dádivas
  rationale: Preserva o sentido amplo de ofertas apresentadas ao Senhor sem especificar uma categoria sacrificial que o testemunho fornecido não define.
- source_word: Reubel
  choice: Rubel
  rationale: Adota uma transliteração portuguesa próxima da forma nominal apresentada pelo testemunho, sem identificá-la silenciosamente com a forma bíblica portuguesa “Rúben”.
- source_word: had a child / raised children
  choice: gerou descendência / haviam tido filhos
  rationale: “Gerar descendência” reproduz a ênfase pública e genealógica da censura, enquanto “ter filhos” evita sugerir apenas o ato de criá-los.
- source_word: considers me
  choice: me visite
  rationale: Mantém a expressão bíblica de uma visita divina que implica atenção e possível intervenção, sem explicitar qual resposta Deus dará.
theological_decisions:
- issue: Função expiatória da segunda dádiva de Joaquim
  choice: “em busca de perdão, a fim de fazer expiação por mim”
  alternative: “para que eu seja perdoado”
  rationale: Conserva a justaposição do testemunho entre perdão e expiação, sem reduzir uma formulação à outra nem impor uma teoria posterior da expiação.
- issue: Ausência de filhos como fundamento para impedir precedência na oferta
  choice: A censura de Rubel é traduzida diretamente, sem comentário moral ou validação narrativa.
  alternative: Explicar a esterilidade como culpa, impureza ou castigo divino.
  rationale: O texto relata a alegação de Rubel, mas não determina aqui que Deus a aprove nem explica teologicamente a ausência de filhos.
- issue: Visita de Deus a Joaquim
  choice: “até que o Senhor, meu Deus, me visite”
  alternative: “até que o Senhor, meu Deus, me conceda um filho”
  rationale: Preserva a abertura do pedido de Joaquim e não antecipa o resultado da narrativa.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. Mantiveram-se as repetições narrativas características do texto, com ajustes moderados de fluência. Este é um rascunho provisório baseado no testemunho inglês público fornecido e auditado à luz das indicações disponíveis; a revisão direta do grego permanece pendente.
