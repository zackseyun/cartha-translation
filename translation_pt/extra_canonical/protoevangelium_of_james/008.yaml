review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente imagens e termos marcados, como “não tinha voltado atrás”, “como uma pomba”, “Santo dos Santos” e “trombeta do Senhor”. Contudo, “nós a faremos” altera o referente de “we’ll do it”, pois em português “a” retoma Maria, não a ação/revelação. A reformulação da última fala do anjo também pode reproduzir diretamente a ordem sintática e relacional do testemunho, sem inversão interpretativa.
  naturalness: 'O registro é claro, digno e legível. Foram ajustadas duas construções: “Você permanece diante do altar” acrescentava uma nuance durativa ausente de “You stand at the altar”, e “nós a faremos” era pouco natural e semanticamente incorreto no contexto. “Ela será esposa dele” é natural e mantém a formulação do testemunho.'
  terminology: “Senhor Deus”, “Templo”, “sumo sacerdote”, “Santo dos Santos”, “vara”, “arautos” e “trombeta do Senhor” são escolhas adequadas. “Torne impuro o santuário” comunica bem a preocupação de impureza cultual sem endossar ou especificar uma explicação extratextual.
  issues:
  - severity: high
    issue: “nós a faremos” em 8.2
    rationale: O pronome feminino “a” retoma “Maria”, produzindo o sentido incorreto de que os sacerdotes ‘a farão’. O testemunho diz que նրանք farão aquilo que Deus revelar; “nós o faremos” preserva esse referente.
  - severity: medium
    issue: “Você permanece diante do altar” em 8.2
    rationale: “Permanece” introduz a ideia de continuidade/permanência que não está expressa no testemunho. “O senhor está diante do altar” traduz o enunciado sem esse acréscimo.
  - severity: low
    issue: Inversão da formulação matrimonial em 8.3 e nota explicativa
    rationale: O texto principal dizia “será o marido dela”, enquanto o testemunho diz “ela será esposa dele”. A inversão pode ser compreensível, mas não é necessária; a formulação direta é natural em português e elimina a necessidade da nota.
  revised_text: '(1) Os pais dela desceram, maravilhados, louvando e glorificando o Senhor Deus, porque a menina não tinha voltado atrás. Maria permanecia no Templo do Senhor. Era criada como uma pomba e recebia alimento da mão de um anjo.


    (2) Quando completou doze anos, os sacerdotes se reuniram em conselho e disseram: “Vejam, Maria está no Templo do Senhor há doze anos. O que faremos com ela, para que não torne impuro o santuário do Senhor, nosso Deus?” Disseram então ao sumo sacerdote: “O senhor está diante do altar do Senhor. Entre e ore a respeito dela; e, se o Senhor Deus lhe revelar alguma coisa, nós o faremos.”


    (3) O sumo sacerdote entrou, levando a veste com doze sinos até o Santo dos Santos, e orou a respeito dela. E eis que um anjo do Senhor se pôs perto dele e disse: “Zacarias, Zacarias, saia e reúna os viúvos do povo; que cada um leve uma vara. Aquele que o Senhor Deus indicar por meio de um sinal, ela será esposa dele.”


    Os arautos percorreram toda a região ao redor da Judeia e tocaram a trombeta do Senhor. E eis que todos os homens vieram correndo.'
  revised_footnotes: []
  revision_rationale: A revisão corrige um erro pronominal que muda o sentido em 8.2 e remove uma nuance não atestada em “permanece”. Em 8.3, restaura-se no texto principal a relação matrimonial na ordem expressa pelo testemunho, sem recorrer a uma nota que extrapola o conteúdo do trecho. Não foram introduzidas explicações sobre tradições posteriores, tutela, noivado ou causas específicas de impureza ritual.
