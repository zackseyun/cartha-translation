base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: pt
  text: '(1) Os pais dela desceram, maravilhados, louvando e glorificando o Senhor Deus, porque a menina não tinha voltado atrás. Maria permanecia no Templo do Senhor. Era criada como uma pomba e recebia alimento da mão de um anjo.


    (2) Quando completou doze anos, os sacerdotes se reuniram em conselho e disseram: “Vejam, Maria está no Templo do Senhor há doze anos. O que faremos com ela, para que não torne impuro o santuário do Senhor, nosso Deus?” Disseram então ao sumo sacerdote: “Você permanece diante do altar do Senhor. Entre e ore a respeito dela; e, se o Senhor Deus lhe revelar alguma coisa, nós a faremos.”


    (3) O sumo sacerdote entrou, levando a veste com doze sinos, até o Santo dos Santos, e orou a respeito dela. E eis que um anjo do Senhor se pôs perto dele e disse: “Zacarias, Zacarias, saia e reúna os viúvos do povo; que cada um leve uma vara. Aquele que o Senhor Deus indicar por meio de um sinal será o marido dela.”[a]


    Os arautos percorreram toda a região ao redor da Judeia e tocaram a trombeta do Senhor. E eis que todos os homens vieram correndo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, conforme o testemunho usado para esta versão: “ela será esposa dele”. A formulação apresenta uma relação matrimonial; outros detalhes sobre a natureza dessa relação não são especificados aqui.'
    reason: Preserva a forma e a tensão da declaração sem importar tradições posteriores; registra a inversão sintática adotada no texto principal para naturalidade em português.
lexical_decisions:
- source_word: went down
  choice: desceram
  rationale: Preserva a linguagem espacial do testemunho, provavelmente ligada à saída do recinto elevado do Templo, sem explicá-la além da evidência disponível.
- source_word: hadn’t turned back
  choice: não tinha voltado atrás
  rationale: Mantém a imagem e a possível nuance de não recuar ou não retornar aos pais, sem reduzir a expressão a uma interpretação única.
- source_word: nurtured like a dove
  choice: criada como uma pomba
  rationale: Conserva a comparação incomum e simbólica do texto; “criada” é natural em português e não especifica indevidamente o modo de sustento.
- source_word: pollute/defile
  choice: torne impuro
  rationale: Expressa impureza cultual de modo compreensível e evita a conotação predominantemente ambiental de “poluir” no português atual.
- source_word: chief priest
  choice: sumo sacerdote
  rationale: É a designação portuguesa convencional e historicamente adequada para a função sacerdotal principal.
- source_word: robe with twelve bells
  choice: veste com doze sinos
  rationale: Mantém os detalhes do testemunho sem identificar de forma conjectural uma peça sacerdotal específica.
- source_word: Holy of Holies
  choice: Santo dos Santos
  rationale: Emprega a forma bíblica tradicional e amplamente inteligível para o recinto mais sagrado.
- source_word: staff
  choice: vara
  rationale: “Vara” preserva a possibilidade de bastão, cajado ou ramo usado como objeto do sinal; “cajado” seria mais específico.
- source_word: heralds
  choice: arautos
  rationale: Reflete mensageiros de proclamação pública em registro narrativo digno.
- source_word: look!
  choice: e eis que
  rationale: Reproduz a função enfática e deíctica da fórmula narrativa em português bíblico corrente, sem excesso de coloquialidade.
theological_decisions:
- issue: Impureza de Maria aos doze anos
  choice: “para que não torne impuro o santuário”
  alternative: “para que não profane/contamine o santuário”
  rationale: Mantém a preocupação cultual atribuída aos sacerdotes sem endossá-la nem explicitar menstruação, aspecto apenas implícito no contexto antigo.
- issue: Relação designada pelo sinal
  choice: “será o marido dela” com nota
  alternative: “ela será esposa dele”
  rationale: A tradução principal comunica naturalmente o resultado matrimonial, enquanto a nota registra a formulação do testemunho e evita harmonização com tradições posteriores sobre tutela ou noivado.
- issue: Alimento vindo de um anjo
  choice: “recebia alimento da mão de um anjo”
  alternative: “era alimentada por um anjo”
  rationale: Preserva a imagem concreta e a afirmação sobrenatural do texto sem reinterpretá-la metaforicamente.
- issue: Trombeta do Senhor
  choice: “a trombeta do Senhor”
  alternative: “uma trombeta em nome do Senhor”
  rationale: Conserva a construção teológica marcada do testemunho, sem explicar se a expressão indica instrumento sagrado, convocação autorizada ou fórmula narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se algumas fórmulas narrativas antigas (“e eis que”, “desceram”) quando carregam função literária ou possível valor espacial. O rascunho é necessariamente provisório, pois foi elaborado a partir do testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega continua pendente.
