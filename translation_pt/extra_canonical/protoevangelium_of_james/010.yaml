base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: pt
  text: '(1) Os sacerdotes se reuniram em conselho e disseram: “Façamos um véu para o Templo do Senhor.”


    O sacerdote disse: “Chamem as virgens puras da tribo de Davi e tragam-nas a mim.” Os oficiais saíram, procuraram e encontraram sete. Então o sacerdote se lembrou de que a menina Maria era da tribo de Davi e pura diante de Deus. Por isso, os oficiais saíram e a trouxeram.


    (2) Eles as levaram ao Templo do Senhor, e o sacerdote disse: “Lancem sortes, para que eu determine quem fiará o ouro, o branco, o linho, a seda, o violeta, o escarlate e a púrpura genuína[a].”


    A sorte da púrpura genuína e do escarlate caiu sobre Maria, e ela os levou para sua casa. Foi nessa época que Zacarias emudeceu, e Samuel ocupou o lugar dele até que Zacarias pudesse voltar a falar. Maria pegou o escarlate e o estava fiando.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “púrpura verdadeira”. A expressão distingue este material ou tom de púrpura dos demais itens da lista; sua identificação técnica exata é incerta enquanto se aguarda a revisão direta do texto grego.'
    reason: Preserva a expressão incomum do testemunho e assinala, sem apagá-la, a incerteza lexical.
lexical_decisions:
- source_word: council
  choice: se reuniram em conselho
  rationale: Expressa de modo natural a deliberação coletiva dos sacerdotes sem introduzir uma instituição formal não exigida pelo testemunho.
- source_word: veil
  choice: véu
  rationale: Mantém o termo tradicional para a cortina ou véu do Templo e preserva sua ressonância cultual.
- source_word: officers
  choice: oficiais
  rationale: Conserva a designação ampla do testemunho disponível, pois a função exata desses agentes depende de revisão direta do grego.
- source_word: pure virgins
  choice: virgens puras
  rationale: Preserva os dois elementos do texto, sem reduzir pureza a uma simples repetição de virgindade.
- source_word: spin
  choice: fiar
  rationale: Designa com precisão a atividade têxtil descrita e mantém a imagem recorrente de Maria trabalhando o material.
- source_word: true purple
  choice: púrpura genuína
  rationale: Mantém a distinção explícita do testemunho entre essa púrpura e os demais materiais ou cores, sem normalizá-la apenas como 'púrpura'.
- source_word: fell silent
  choice: emudeceu
  rationale: É uma formulação portuguesa natural que não especifica aqui a causa do silêncio de Zacarias.
- source_word: took his place
  choice: ocupou o lugar dele
  rationale: Preserva a relação de substituição sem definir uma função sacerdotal específica que o texto fornecido não explicita.
theological_decisions:
- issue: Pureza de Maria diante de Deus
  choice: pura diante de Deus
  alternative: considerada pura por Deus
  rationale: A redação escolhida preserva a afirmação direta e sua possível amplitude, sem transformá-la numa declaração técnica sobre reconhecimento, impecabilidade ou algum estado doutrinário posterior.
- issue: Silêncio de Zacarias
  choice: Zacarias emudeceu
  alternative: Zacarias foi castigado com a mudez
  rationale: O trecho apenas situa o acontecimento no tempo; a tradução não acrescenta uma interpretação causal ou punitiva.
- issue: Substituição por Samuel
  choice: Samuel ocupou o lugar dele
  alternative: Samuel exerceu o sacerdócio em seu lugar
  rationale: A função exata não é explicitada no testemunho fornecido, por isso a formulação evita uma precisão institucional não demonstrada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A cadência narrativa e as repetições foram mantidas onde contribuem para o estilo antigo, mas a sintaxe foi suavemente naturalizada. Como a revisão direta da tradição manuscrita grega ainda está pendente, esta minuta segue com cautela o testemunho inglês público fornecido, sobretudo na lista de materiais e cores e nas designações “oficiais” e “Samuel”.
