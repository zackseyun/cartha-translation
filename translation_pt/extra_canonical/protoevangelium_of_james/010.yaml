    issue: «Lancem sortes diante de mim» acrescenta uma noção locativa.
    rationale: O testemunho diz «Cast lots for me to determine», não que as sortes fossem lançadas fisicamente diante do sacerdote. «Lancem sortes, para que eu determine» preserva a função do sacerdote sem inserir o detalhe.
  - severity: medium
    issue: «começou a fiá-lo» acrescenta início da ação.
    rationale: O texto-base afirma que Maria estava fiando o escarlate; não declara que ela tenha começado a fazê-lo naquele momento. Convém manter o aspecto progressivo/durativo.
