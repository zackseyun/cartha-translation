base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: pt
  text: '**Protoevangelho de Tiago — Capítulo 22: A matança das crianças**


    **(1)** Quando Herodes viu que havia sido enganado pelos magos, ficou furioso. Enviou seus assassinos, ordenando-lhes que matassem todas as crianças de dois anos para baixo.


    **(2)** Quando Maria soube que as crianças estavam sendo mortas, ficou com medo. Pegou seu filho, envolveu-o em panos e o colocou numa manjedoura de bois.


    **(3)** Quando Isabel soube que estavam procurando João, levou-o para as colinas e procurou um lugar onde escondê-lo, mas não havia esconderijo. Então Isabel gemeu e disse: “Montanha de Deus, acolhe uma mãe com seu filho”, pois ela não conseguia subir mais. Imediatamente, a montanha se abriu e a acolheu, e uma luz brilhou através da montanha para ela. Pois um anjo do Senhor estava com eles e os protegia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega ainda está pendente, especialmente quanto aos referentes dos pronomes na frase final.
    reason: A documentação do projeto declara que a revisão na língua original está pendente; a nota evita apresentar como definitivamente resolvida uma possível variação ou ambiguidade do grego.
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Mantém o termo tradicional e semanticamente amplo, sem especificar reis, astrólogos ou sábios além do que o testemunho fornece.
- source_word: killers
  choice: assassinos
  rationale: Reproduz de modo direto e natural a função violenta dos enviados de Herodes; evita o termo técnico «carrascos», que poderia sugerir execução judicial formal.
- source_word: infants
  choice: crianças
  rationale: Em português corrente, «crianças» combina melhor com a faixa etária explícita de até dois anos; «bebês» poderia ser estreito demais e «infantes» seria pouco natural.
- source_word: feeding trough for cows / manger for cows
  choice: manjedoura de bois
  rationale: Preserva a imagem concreta e a ressonância narrativa tradicional, em linguagem compreensível; «de bois» expressa que se trata do comedouro destinado ao gado.
- source_word: take in / receive
  choice: acolhe / acolheu
  rationale: O mesmo campo lexical liga o pedido de Isabel à resposta imediata da montanha, transmitindo abrigo e recepção sem tornar a cena mais técnica.
- source_word: hills
  choice: colinas
  rationale: Segue o testemunho fornecido sem elevar indevidamente o terreno a «montanhas» antes da invocação à «Montanha de Deus».
theological_decisions:
- issue: Identidade e função dos magos
  choice: «magos» sem explicação interpretativa no corpo do texto
  alternative: «sábios», «astrólogos» ou «reis magos»
  rationale: O texto não os chama de reis, e a designação tradicional «magos» preserva a amplitude do termo.
- issue: Caráter miraculoso da abertura da montanha
  choice: Narrar diretamente que a montanha se abriu e acolheu Isabel
  alternative: Reformular como visão, metáfora ou fenômeno natural
  rationale: A narrativa apresenta o acontecimento como ação imediata e protetora; a tradução não deve racionalizá-lo nem acrescentar uma interpretação.
- issue: Referentes dos pronomes finais
  choice: «uma luz brilhou ... para ela» e «estava com eles e os protegia»
  alternative: Uniformizar todos os pronomes no singular ou no plural
  rationale: 'Mantém a alternância do testemunho fornecido: Isabel é a beneficiária explícita da luz, enquanto o anjo acompanha e protege mãe e filho.'
translation_notes:
  register: Português moderno, digno e narrativamente claro, com ampla legibilidade brasileira. Preferiram-se frases diretas e vocabulário corrente, preservando-se «magos», «manjedoura» e «anjo do Senhor» por sua precisão e reconhecimento. A formulação é provisória porque o material disponibilizado é um testemunho inglês, não o texto grego; nenhuma decisão aqui deve substituir a futura colação da tradição manuscrita.
