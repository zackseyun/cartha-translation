translation:
  language: pt
  text: (1) E encontrou ali uma caverna, levou-a para dentro e deixou seus filhos com ela. Depois, foi procurar uma parteira hebreia na região de Belém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cave
  choice: caverna
  rationale: Equivalente natural e preciso em português para o local encontrado por José.
- source_word: stationed his sons with her
  choice: deixou seus filhos com ela
  rationale: Expressa de modo natural que José os pôs junto dela para permanecerem ali, sem acrescentar uma finalidade não declarada.
- source_word: Hebrew midwife
  choice: parteira hebreia
  rationale: Mantém a designação étnica do testemunho fornecido, sem substituí-la por uma formulação interpretativa.
- source_word: region of Bethlehem
  choice: região de Belém
  rationale: Conserva a referência geográfica ampla do texto, sem restringi-la à cidade propriamente dita.
theological_decisions:
- issue: Identidade do pronome feminino
  choice: levou-a para dentro
  alternative: levou Maria para dentro
  rationale: Mantém a referência pronominal do testemunho e evita explicitar no versículo um nome não presente nesta unidade textual.
- issue: Papel dos filhos de José
  choice: deixou seus filhos com ela
  alternative: encarregou seus filhos de guardá-la
  rationale: Evita acrescentar a ideia específica de proteção ou vigilância, que não é explicitada no testemunho fornecido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação é provisória, pois se baseia no testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente.
