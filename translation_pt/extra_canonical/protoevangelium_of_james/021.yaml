base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: pt
  text: '(1) Vejam! José se preparava para partir para a Judeia quando houve grande agitação em Belém da Judeia. Chegaram magos[a], perguntando: “Onde está o rei dos judeus? Pois vimos a estrela dele no Oriente[b] e viemos adorá-lo[c]”.


    (2) Ao ouvir isso, Herodes ficou perturbado. Enviou oficiais aos magos, convocou os chefes dos sacerdotes e os interrogou em seu palácio, dizendo: “O que está escrito a respeito do Cristo[d]? Onde ele nascerá?”


    Eles lhe responderam: “Em Belém da Judeia, pois é isso que está escrito”. Então Herodes os dispensou — isto é, os chefes dos sacerdotes.


    Depois interrogou os magos: “Que sinal vocês viram a respeito daquele que nasceu rei?”


    Os magos responderam: “Vimos uma estrela imensa brilhando entre as demais estrelas e ofuscando-as tanto que elas já nem eram visíveis. Assim, soubemos que havia nascido um rei para Israel e viemos adorá-lo[c]”.


    Herodes lhes disse: “Vão e procurem. Se o encontrarem, avisem-me, para que eu também vá adorá-lo[c]”.


    (3) Os magos partiram, e vejam! A estrela que tinham visto no Oriente[b] os guiou até chegarem à caverna e parou sobre a entrada[e] dela. Quando o viram com Maria, sua mãe, os magos tiraram de suas bolsas os presentes: ouro, incenso e mirra.


    Depois de serem advertidos por um anjo a não irem para a Judeia[f], voltaram para sua terra por outro caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Magos” designa aqui especialistas orientais associados ao estudo dos astros e a práticas religiosas ou sapienciais; o texto não diz que eram reis.
    reason: Evita tanto o sentido moderno de mágico/ilusionista quanto a tradição adicional de que eram reis.
  - marker: b
    text: 'Ou: “quando ela surgiu”. A expressão também pode indicar o lugar onde a estrela foi vista, “no Oriente”.'
    reason: Preserva a ambiguidade tradicional da expressão relacionada ao aparecimento ou à localização oriental da estrela.
  - marker: c
    text: O verbo também pode significar “prestar homenagem” ou “prostrar-se diante de”.
    reason: Mantém aberta a extensão régia ou cultual do gesto sem resolver a tensão teológica.
  - marker: d
    text: “Cristo” significa “Ungido” e corresponde ao título “Messias”.
    reason: Torna inteligível o título sem substituí-lo no corpo do texto.
  - marker: e
    text: 'Literalmente, conforme o testemunho inglês fornecido: “sobre a cabeça da caverna”. O sentido provável é a parte superior ou a entrada da caverna.'
    reason: Registra a expressão incomum e a interpretação adotada, necessária enquanto a revisão direta do grego está pendente.
  - marker: f
    text: O testemunho diz “não irem para a Judeia”. Essa formulação foi mantida, embora seja incomum no contexto.
    reason: Evita harmonização silenciosa e sinaliza uma possível questão textual ou tradutória a ser revista no grego.
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Preserva o termo tradicional e semanticamente amplo, sem reduzi-los a reis nem ao sentido moderno de ilusionistas.
- source_word: worship
  choice: adorar
  rationale: Mantém a força cultual e a possível tensão teológica do verbo no testemunho, sem enfraquecê-lo para simples homenagem.
- source_word: Christ
  choice: Cristo
  rationale: Conserva o título cristológico tradicional; a nota esclarece o sentido de Messias.
- source_word: frankincense
  choice: incenso
  rationale: É a designação portuguesa corrente da resina aromática oferecida, natural para leitores modernos.
- source_word: country
  choice: terra
  rationale: Expressa de modo natural o lugar de origem dos magos sem introduzir a ideia moderna de Estado-nação.
- source_word: head of the cave
  choice: entrada da caverna
  rationale: Leitura contextualmente natural, mas assinalada em nota porque o testemunho inglês traz literalmente 'cabeça da caverna'.
theological_decisions:
- issue: Natureza da reverência prestada pelos magos
  choice: adorá-lo
  alternative: prestar-lhe homenagem / prostrar-se diante dele
  rationale: O testemunho usa 'worship', permitindo leitura cultual; a tradução preserva essa força em vez de decidir que se trata apenas de homenagem régia.
- issue: Identidade e status dos magos
  choice: magos
  alternative: sábios / reis magos
  rationale: Não se acrescenta que eram reis, e 'sábios' estreitaria a gama histórica do termo.
- issue: Destino que os magos devem evitar
  choice: não irem para a Judeia
  alternative: não voltarem a Herodes
  rationale: Preserva-se a formulação peculiar do testemunho fornecido, sem harmonizá-la silenciosamente com Mateus 2:12.
- issue: Rei nascido para Israel
  choice: um rei para Israel
  alternative: o rei de Israel
  rationale: Mantém a formulação e a indefinição do testemunho, sem elevar o artigo ou reformular o título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” no diálogo e evitaram-se arcaísmos. A tradução é provisória porque o material fornecido identifica o testemunho inglês de domínio público como base e informa que a revisão direta da tradição manuscrita grega ainda está pendente. “Vejam!” preserva o marcador narrativo enfático; “caverna” mantém o cenário próprio desta obra.
