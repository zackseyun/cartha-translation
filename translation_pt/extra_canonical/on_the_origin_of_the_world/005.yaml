base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: pt
  text: 'Quando os céus se estabeleceram, juntamente com seus exércitos e toda a sua estrutura de governo, o Progenitor primordial[a] tornou-se arrogante. Todo o exército de anjos o adorava, e todos os deuses e seus anjos lhe ofereciam louvor e adoração. Ele ficou exultante e se gabava repetidamente diante deles: “Eu basto a mim mesmo”.


    Ele disse: “Eu é que sou Deus, e além de mim nada mais existe”. Ao dizer isso, transgrediu contra todos os imortais dotados de fala, e eles o acusaram por causa disso.


    Quando Pistis[b] viu a impiedade do arconte principal[c], ficou enfurecida. Embora invisível, ela disse: “Estás enganado, Samael” — isto é, “Deus Cego”[d]. “Existe um homem imortal de luz que já existia antes de ti, e ele se manifestará entre as formas que moldaste. Ele te pisará com desprezo, como se pisa um vaso de oleiro, e tu despencarás até tua mãe, o Abismo, junto com os que te pertencem. Pois, quando todas as tuas obras estiverem completas, toda a deficiência que a verdade trouxe à luz será eliminada. Sua existência chegará ao fim, e será como se nunca tivesse existido”.


    Depois de dizer isso, Pistis manifestou nas águas a imagem de sua grandeza. Feito isso, retirou-se novamente para o alto, para sua luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Progenitor primordial” traduz provisoriamente o título apresentado pelo testemunho inglês como “Primal Parent”. A revisão direta do copta ainda está pendente.
    reason: Registra a incerteza lexical decorrente da base de tradução indireta e evita apresentar uma escolha de gênero como definitiva.
  - marker: b
    text: Pistis é uma palavra grega que pode significar “fé”, “confiança” ou “fidelidade”; aqui funciona como nome de uma personagem.
    reason: Ajuda o leitor a reconhecer o sentido do nome sem substituir a personagem por uma abstração.
  - marker: c
    text: “Arconte” significa “governante” ou “autoridade” e, neste tratado, designa um dos poderes que governam o mundo inferior.
    reason: Esclarece um termo técnico importante para leitores não especializados, sem impor uma identificação confessional.
  - marker: d
    text: O próprio texto interpreta “Samael” como “Deus Cego”.
    reason: Distingue a glosa fornecida pelo tratado de uma etimologia editorial moderna.
lexical_decisions:
- source_word: Primal Parent
  choice: Progenitor primordial
  rationale: Evita fixar desnecessariamente o termo como “Pai” e conserva a ideia de origem e precedência expressa no testemunho inglês.
- source_word: hosts
  choice: exércitos
  rationale: “Exércitos” comunica o sentido de hostes celestes em português corrente, sem o tom arcaico de “hostes”.
- source_word: government
  choice: estrutura de governo
  rationale: Mantém a dimensão de organização e domínio sem decidir se o termo designa apenas governantes pessoais.
- source_word: self-sufficient
  choice: basto a mim mesmo
  rationale: Formulação natural e solene que expressa autossuficiência sem inserir uma explicação teológica.
- source_word: deathless ones who use verbal articulation
  choice: imortais dotados de fala
  rationale: Preserva tanto a imortalidade quanto a capacidade de expressão verbal, de modo inteligível.
- source_word: chief archon
  choice: arconte principal
  rationale: Retém o termo técnico “arconte”, esclarecendo sua posição superior com “principal”.
- source_word: forms you have shaped
  choice: formas que moldaste
  rationale: Conserva a metáfora de modelagem, que prepara a referência posterior ao vaso do oleiro.
- source_word: deficiency
  choice: deficiência
  rationale: Mantém o vocábulo conceitualmente carregado e sua possível função técnica no tratado, sem o interpretar como pecado, mal ou ignorância.
- source_word: likeness of her greatness
  choice: imagem de sua grandeza
  rationale: “Imagem” reproduz de modo natural a ideia de uma semelhança ou manifestação visível, sem afirmar identidade plena.
theological_decisions:
- issue: A afirmação exclusiva de divindade do Progenitor primordial
  choice: “Eu é que sou Deus, e além de mim nada mais existe”
  alternative: “Eu sou Deus, e não existe nenhum outro além de mim”
  rationale: A construção escolhida preserva o tom enfático e arrogante no contexto, sem harmonizá-la com fórmulas bíblicas nem acrescentar uma refutação editorial.
- issue: Natureza do “homem imortal de luz”
  choice: homem imortal de luz
  alternative: ser humano imortal de luz
  rationale: Mantém a figura masculina e a formulação do testemunho sem identificar esse personagem com uma entidade teológica específica.
- issue: Destino da deficiência
  choice: “será eliminada... será como se nunca tivesse existido”
  alternative: “será anulada... será como se jamais tivesse sido”
  rationale: Preserva a forte linguagem de cessação do texto sem explicar se ela implica destruição ontológica, restauração ou outra concepção cosmológica.
- issue: Pistis como nome ou conceito
  choice: Pistis
  alternative: Fé
  rationale: O nome foi transliterado no corpo do texto para não reduzir a personagem à abstração “fé”; a nota informa o sentido lexical possível.
- issue: O Abismo personificado como mãe
  choice: “tua mãe, o Abismo”
  alternative: “tua mãe, o abismo”
  rationale: A inicial maiúscula sinaliza seu papel cosmológico nomeado, mas a frase mantém a relação materna exatamente como apresentada, sem desenvolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com legibilidade brasileira. Mantiveram-se termos cosmológicos relevantes, como “Pistis”, “arconte”, “deficiência” e “Abismo”, acompanhados de notas quando necessário. O uso de “tu” nas falas preserva a interpelação direta e elevada sem recorrer a construções excessivamente arcaicas. Trata-se de uma versão provisória fundamentada no testemunho inglês de domínio público fornecido; a revisão direta dos testemunhos coptas permanece pendente.
