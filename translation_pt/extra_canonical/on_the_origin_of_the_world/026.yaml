review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a progressão e as ambiguidades do testemunho inglês disponível, inclusive o plural sem referente definido em “estes foram enviados” e em “foram condenados”. “Superior a tudo”, “autoridades”, “Caos”, “arcontes” e “perfeitos” são escolhas adequadas. Há, porém, dois pontos lexicais em que a redação pode refletir mais diretamente o testemunho: “a censure” é mais precisamente “uma censura” do que “uma condenação”; e “forethought” não requer necessariamente o sentido técnico de conhecimento antecipado expresso por “presciência”, sendo “previsão” uma opção mais neutra e fiel à ponte inglesa provisória.'
  naturalness: O português é fluente, moderno e de registro apropriado. A construção “Nada do que está oculto deixa de ser revelado” transmite naturalmente a formulação negativa enfática do testemunho. A manutenção de “estes” é um pouco marcada, mas é justificável para não resolver uma referência obscura.
  terminology: “Logos” e “arcontes” foram corretamente preservados como termos técnicos. “Censura” conserva a distinção em relação à sentença de morte, e “previsão” evita introduzir em “presciência” uma especificação teológica ou filosófica que o testemunho inglês não fixa.
  issues:
  - severity: medium
    issue: “O destino deles mostrou-se uma condenação” para “their fate was found to be a censure”.
    rationale: “Condenação” aproxima indevidamente esta frase da sentença de morte anterior e torna menos visível o sentido de reprovação ou censura do termo do testemunho. “Seu destino foi considerado uma censura” é mais próximo e natural.
  - severity: medium
    issue: “Presciência” para “forethought”.
    rationale: “Presciência” normalmente designa conhecimento prévio/antecipado e pode carregar sentido técnico. O inglês “forethought” admite mais amplamente previsão ou deliberação antecipada; “previsão” mantém a formulação aberta enquanto não há revisão direta do copta.
  revised_text: 'O Logos, superior a tudo, foi enviado unicamente por esta razão: para anunciar o que era desconhecido. Ele disse: “Nada do que está oculto deixa de ser revelado, e o que é desconhecido será conhecido”. E estes foram enviados para tornar conhecido o que está oculto, inclusive as sete autoridades do Caos e sua impiedade. Desse modo, foram condenados à morte.[a]



    Quando todos os perfeitos apareceram nas formas moldadas pelos arcontes e revelaram a verdade incomparável, humilharam toda a sabedoria dos deuses. Seu destino foi considerado uma censura, e seu exército definhou. Seu domínio se desfez. Sua previsão reduziu-se a nada, juntamente com sua glória.'
  revised_footnotes:
  - marker: a
    text: Os referentes de “estes” e de “foram condenados” não são plenamente claros no testemunho disponível. Pelo contexto, a condenação provavelmente recai sobre as sete autoridades do Caos, mas a formulação foi mantida ambígua.
    reason: Registra uma ambiguidade real do testemunho inglês enquanto aguarda revisão direta do copta.
  revision_rationale: 'A revisão é limitada a duas escolhas lexicais: “censura” reproduz melhor a distinção do testemunho entre reprovação e condenação à morte; “previsão” mantém “forethought” em registro neutro, sem antecipar uma decisão que dependeria do copta. A ambiguidade dos plurais, os nomes e a terminologia cosmológica foram preservados.'
