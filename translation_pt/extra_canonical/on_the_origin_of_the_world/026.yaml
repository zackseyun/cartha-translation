    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: pt
  text: 'O Logos, superior a tudo, foi enviado unicamente por esta razão: para anunciar o que era desconhecido. Ele disse: “Nada do que está oculto deixa de ser revelado, e o que é desconhecido será conhecido”. E estes foram enviados para tornar conhecido o que está oculto, inclusive as sete autoridades do Caos e sua impiedade. Desse modo, foram condenados à morte.[a]


    Quando todos os perfeitos apareceram nas formas moldadas pelos arcontes e revelaram a verdade incomparável, humilharam toda a sabedoria dos deuses. O destino deles mostrou-se uma condenação, e seu exército definhou. Seu domínio se desfez. Sua presciência reduziu-se a nada, juntamente com sua glória.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os referentes de “estes” e de “foram condenados” não são plenamente claros no testemunho disponível. Pelo contexto, a condenação provavelmente recai sobre as sete autoridades do Caos, mas a formulação foi mantida ambígua.
    reason: Registra uma ambiguidade real do testemunho inglês enquanto aguarda revisão direta do copta.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Mantém o termo técnico do testemunho, cuja amplitude pode incluir palavra, razão e princípio personificado; traduzi-lo apenas como “Palavra” reduziria essa polissemia.
- source_word: all-superior
  choice: superior a tudo
  rationale: Expressa em português natural a supremacia abrangente atribuída ao Logos, sem sugerir apenas comparação de grau.
- source_word: authorities
  choice: autoridades
  rationale: Preserva a designação hierárquica do testemunho e evita identificá-las automaticamente com outro grupo de seres.
- source_word: Chaos
  choice: Caos
  rationale: A inicial maiúscula sinaliza que se trata do domínio ou realidade cosmológica personificada, não de mera desordem.
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico corrente para os governantes cósmicos deste texto, sem fundi-lo com “autoridades”.
- source_word: perfect ones
  choice: perfeitos
  rationale: Conserva a designação substantivada do grupo e sua possível carga iniciática ou soteriológica.
- source_word: host
  choice: exército
  rationale: No contexto do domínio dos deuses e arcontes, comunica com clareza a ideia de hoste organizada.
- source_word: forethought
  choice: presciência
  rationale: Representa uma faculdade ou poder de conhecimento antecipado; a revisão direta do copta poderá determinar se “providência” ou “previsão” é preferível.
theological_decisions:
- issue: Referente do plural em “estes foram enviados”
  choice: Preservar “estes”, sem explicitar a identidade
  alternative: Identificar o referente como o Logos, os perfeitos ou mensageiros específicos
  rationale: O testemunho fornecido apresenta uma mudança obscura do singular para o plural; esclarecê-la importaria uma interpretação não assegurada.
- issue: Referente de “foram condenados à morte”
  choice: Manter o sujeito implícito e acrescentar nota sobre a provável referência
  alternative: Escrever explicitamente “as sete autoridades foram condenadas à morte”
  rationale: A proximidade favorece as autoridades e sua impiedade como alvo do juízo, mas a construção do testemunho não elimina toda ambiguidade.
- issue: Natureza do Logos
  choice: Não acrescentar títulos cristológicos ou explicações ontológicas
  alternative: Identificar expressamente o Logos com Cristo ou com uma emanação específica
  rationale: O trecho, isoladamente, não fornece base suficiente para resolver a identidade do Logos segundo uma tradição doutrinária posterior.
- issue: “deuses” e “arcontes”
  choice: Conservar ambas as designações distintas
  alternative: Uniformizar todos como demônios, poderes ou governantes
  rationale: A tradução deve preservar o vocabulário cosmológico e a tensão interna do texto sem impor uma classificação teológica externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “Logos” e “arcontes” como termos técnicos. Este rascunho é necessariamente provisório, pois foi elaborado a partir do testemunho inglês de domínio público; a revisão direta do copta ainda está pendente.
