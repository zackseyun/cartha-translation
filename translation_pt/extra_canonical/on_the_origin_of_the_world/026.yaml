source:
  text: 'The all-superior Logos was dispatched solely for this reason: that he could announce the unknown. He said, “Nothing that is hidden is not revealed, and what is unknown will be known,” and these were dispatched to make known what is hidden, even the seven authorities of Chaos as well as their impiety, and in this way they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
