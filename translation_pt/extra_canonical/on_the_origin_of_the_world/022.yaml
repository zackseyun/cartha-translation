  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/022.yaml
  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: pt
  text: 'Quando os arcontes perceberam que Adão e Eva haviam transgredido os mandamentos que lhes tinham imposto, entraram no Paraíso e se aproximaram deles em meio a um terremoto e grandes ameaças, para ver o resultado da ajuda que haviam recebido.[a] Adão e Eva estremeceram violentamente e se esconderam debaixo das árvores do Paraíso. Os arcontes não sabiam onde eles estavam e disseram:


    — Adão, onde você está?


    Ele respondeu:


    — Aqui estou. Escondi-me porque tive medo de vocês e fiquei envergonhado.


    Em sua ignorância, eles lhe disseram:


    — Quem lhe deu conhecimento da vergonha com que você se revestiu? Acaso você comeu daquela árvore?


    Ele respondeu:


    — A mulher que vocês me deram foi quem me deu do fruto, e eu comi.


    Então disseram à mulher: [b]


    — O que você fez?


    Ela respondeu:


    — O instrutor me incitou, e eu comi.[c]


    Então os arcontes se aproximaram do instrutor. Por causa dele, os olhos deles ficaram turvos, e não puderam fazer nada contra ele. Como eram impotentes, amaldiçoaram-no.


    Depois disso, aproximaram-se da mulher e amaldiçoaram tanto a ela como a seus descendentes.


    Depois da mulher, amaldiçoaram Adão e, por causa dele, também a terra e as plantações. Amaldiçoaram tudo o que haviam criado. Eles não possuem bênção alguma. O bem não pode resultar do mal.


    Desde aquele dia, as autoridades realmente reconheceram que havia algo mais poderoso do que elas.


    Sabiam apenas que seus mandamentos não tinham sido obedecidos. Uma enorme inveja entrou no mundo unicamente por causa do homem imortal.[d]


    Quando os arcontes perceberam que o Adão deles havia adquirido uma espécie diferente de conhecimento, quiseram pô-lo à prova. Reuniram todos os animais domésticos, os animais selvagens da terra e as aves do céu e os levaram diante de Adão, para saber que nomes ele lhes daria. Quando os viu, Adão deu nomes às criaturas deles.


    Eles ficaram perturbados porque Adão se saía bem em todas as provas.[e] Reuniram-se, tramaram planos e disseram:


    — Vejam Adão! Ele se tornou como um de nós, pois conhece a diferença entre a luz e as trevas. Talvez agora ele seja enganado, como aconteceu com a árvore do conhecimento, e até se aproxime da árvore da vida, coma dela, torne-se imortal e se faça senhor. Então sentirá aversão por nós e desprezará tanto a nós como toda a nossa glória. Ele nos condenará juntamente com o nosso universo. Venham, vamos expulsá-lo [b] do Paraíso para a terra da qual foi tirado, para que, de agora em diante, não possa conhecer nada superior ao que somos capazes de conhecer.[f]


    Desse modo, expulsaram Adão do Paraíso junto com sua mulher. Mas o ato que cometeram não lhes bastou; ao contrário, ficaram com medo.


    Entraram no Paraíso, aproximaram-se da árvore da vida e a cercaram com seres grandes e temíveis — criaturas vivas de fogo chamadas “querubins”. Entre eles puseram uma espada em chamas, que girava sem cessar de modo aterrador, para impedir que qualquer ser terreno jamais entrasse naquele lugar.


    Como os arcontes tiveram inveja de Adão, quiseram encurtar a duração da vida deles.[g] Não puderam fazer isso por causa do destino estabelecido desde o princípio, pois a cada um havia sido atribuída uma vida de mil anos, de acordo com a órbita dos corpos luminosos. Contudo, embora os arcontes não pudessem realizar isso, cada um dos agentes do mal subtraiu dez anos, e a duração total da vida chegou a novecentos e trinta anos. Esses anos transcorrem em sofrimento, fraqueza e perturbação maligna. Assim tem sido a vida desde aquele dia até a consumação desta era.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “ajuda” também pode significar “apoio”. O referente exato não é explicitado neste trecho.
    reason: Preservar a incerteza semântica e narrativa do testemunho disponível.
  - marker: b
    text: O manuscrito apresenta uma lacuna neste ponto.
    reason: Representar os dois sinais de lacuna indicados por colchetes vazios no testemunho fornecido.
  - marker: c
    text: “Instrutor” traduz literalmente a designação apresentada no testemunho; o texto não o chama aqui de “serpente”.
    reason: Evitar uma identificação interpretativa silenciosa.
  - marker: d
    text: “Imortal” também pode ser traduzido por “aquele que não morre”.
    reason: Registrar o valor literal de 'deathless'.
  - marker: e
    text: O testemunho inglês diz literalmente que Adão “se recuperava de todas as provas”; o sentido provável no contexto é que ele as superava ou se saía bem nelas.
    reason: Sinalizar uma formulação de base incerta, já que a revisão direta do copta está pendente.
  - marker: f
    text: 'Outra tradução possível: “nada além daquilo de que somos capazes”.'
    reason: Preservar a ambiguidade entre superioridade do conhecimento e limite de capacidade.
  - marker: g
    text: O pronome plural pode referir-se a Adão e aos seus descendentes; o testemunho disponível não torna o referente inteiramente explícito.
    reason: Evitar fixar uma referência que exige revisão no copta.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para as potências governantes deste escrito, evitando identificá-las simplesmente com governantes humanos.
- source_word: Paradise
  choice: Paraíso
  rationale: Forma portuguesa corrente, com inicial maiúscula por designar o lugar específico da narrativa.
- source_word: teacher
  choice: instrutor
  rationale: Preserva a função de quem ensina ou orienta sem impor a identificação interpretativa com a serpente.
- source_word: deathless
  choice: imortal
  rationale: Expressa naturalmente em português a ausência de morte, tanto para o homem quanto para a condição pretendida após comer da árvore da vida.
- source_word: authorities
  choice: autoridades
  rationale: Distingue esta designação do termo técnico 'arcontes', conforme o testemunho inglês, sem eliminar a provável referência ao mesmo grupo.
- source_word: Cherubin
  choice: querubins
  rationale: Emprega a forma portuguesa consagrada para os seres guardiões, preservando o plural.
- source_word: consummation of the age
  choice: consumação desta era
  rationale: Mantém a linguagem escatológica e evita converter 'era' em 'mundo' ou explicar teologicamente a expressão.
theological_decisions:
- issue: Identidade do instrutor
  choice: instrutor
  alternative: serpente
  rationale: O testemunho fornecido chama a figura de 'teacher'; identificá-la diretamente como serpente resolveria uma ambiguidade que o texto mantém.
- issue: Natureza moral dos criadores
  choice: “Eles não possuem bênção alguma. O bem não pode resultar do mal.”
  alternative: Suavizar a afirmação ou harmonizá-la com Gênesis
  rationale: A afirmação polêmica faz parte da teologia própria do tratado e deve permanecer sem harmonização denominacional.
- issue: Conhecimento de luz e trevas
  choice: diferença entre a luz e as trevas
  alternative: diferença entre o bem e o mal
  rationale: Preserva as categorias efetivamente apresentadas pelo testemunho, sem substituí-las pela formulação mais conhecida de Gênesis.
- issue: Destino e duração da vida
  choice: destino estabelecido desde o princípio
  alternative: decreto divino
  rationale: Mantém a agência abstrata e a tensão cosmológica do texto, sem atribuí-la a Deus de maneira não expressa.
- issue: Referente plural em “their lifespans”
  choice: duração da vida deles
  alternative: duração da vida de Adão
  rationale: Conserva a ambiguidade referencial do testemunho inglês, que usa o plural, em vez de corrigi-lo silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. O diálogo foi disposto com travessões para fluidez. A tradução é necessariamente provisória porque a base fornecida é um testemunho público em inglês e a revisão direta do copta do Códice de Nag Hammadi II,5 ainda está pendente. As lacunas do manuscrito foram indicadas por nota, e ambiguidades relevantes foram mantidas.
