lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico do ambiente cosmológico gnóstico, já estabelecido em português, sem reduzi-lo genericamente a “governantes”.
- source_word: deathless man
  choice: homem imortal
  rationale: Expressa de modo natural a condição de não estar sujeito à morte, sem identificar ou explicar além do testemunho.
- source_word: Beast
  choice: Fera
  rationale: Preserva o uso titular e a caracterização da criatura; a inicial maiúscula indica que funciona como designação própria.
- source_word: reasoning
  choice: entendimento
  rationale: “Entendimento” comunica a faculdade de discernimento que desperta, evitando o tecnicismo pouco natural de “raciocínio tornar-se sóbrio”.
- source_word: became sober / sobered up
  choice: despertaram
  rationale: Reproduz idiomaticamente a imagem de sair de um estado de torpor e adquirir lucidez, em paralelo com o despertar do entendimento.
- source_word: shaped
  choice: moldado
  rationale: Conserva a imagem artesanal da formação dos seres humanos e evita o termo teologicamente mais carregado “criado”.
theological_decisions:
- issue: Identidade do “verdadeiro homem” e do ser feminino transformado em árvore
  choice: Preservar os referentes pronominais e a formulação enigmática do testemunho
  alternative: Explicitar as personagens ou harmonizar a passagem com outra narrativa da obra
  rationale: O trecho é cosmologicamente denso e ambíguo; explicações no corpo do texto imporiam uma interpretação não demonstrada pela base fornecida.
- issue: Afirmação da Fera sobre a morte
  choice: “De modo nenhum vocês morrerão” com nota sobre a forma enfática
  alternative: “Com morte vocês não morrerão”
  rationale: A tradução principal comunica em português corrente a negação enfática sem apagar a peculiaridade do original mediado, registrada em nota.
- issue: Resultado do conhecimento
  choice: Apresentar a luz do conhecimento como algo que efetivamente ilumina os humanos na lógica do relato
  alternative: Enfraquecer a afirmação para aproximá-la de uma leitura canônica de Gênesis
  rationale: A cosmologia própria do tratado deve ser traduzida sem harmonização denominacional ou canônica.
- issue: “Sem conhecimento” ligado à nudez
  choice: Manter a frase paradoxal e acrescentar nota
  alternative: Corrigir para “perceberam com conhecimento que estavam nus” ou omitir a expressão
  rationale: A redação difícil pode refletir tensão textual ou conceitual genuína e não deve ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. Empregou-se “vocês” para o plural e construções sem regionalismos marcados. O texto é provisório porque a base fornecida é um testemunho inglês de domínio público; a revisão direta do copta e dos testemunhos relacionados ainda está pendente.
