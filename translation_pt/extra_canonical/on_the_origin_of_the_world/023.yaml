base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: pt
  text: 'Assim, quando Sofia Zoe viu os arcontes das trevas lançando uma maldição sobre seus companheiros, ficou furiosa. Saindo do primeiro céu com pleno poder, perseguiu aqueles arcontes, expulsou-os dos [seus] céus e lançou-os no mundo da transgressão, para que ali habitassem como demônios perversos sobre a terra.


    [Ela enviou uma ave], [a] que, no mundo deles, passaria seus mil anos no Paraíso — uma criatura viva dotada de alma, chamada “fênix”. Ela tira a própria vida e torna a viver, a fim de dar testemunho do juízo decretado contra eles, porque maltrataram Adão e sua descendência, até a consumação da era.


    Há três tipos de seres humanos, bem como seus descendentes, até a consumação do mundo: os dotados de espírito, os dotados de alma e os terrenos. Do mesmo modo, há três fênix <dentro> do Paraíso: a primeira não morre; a segunda vive mil anos. Quanto à terceira, está escrito na Sagrada Escritura que ela é consumida. Do mesmo modo, há também três batismos: o primeiro é espiritual; o segundo, com fogo; e o terceiro, com água.


    Assim como a fênix simboliza os anjos, também a hidri aquática do Egito[b] simboliza os que descem ao batismo de um homem verdadeiro.


    Os dois touros do Egito têm um significado simbólico,[c] a saber, o sol e a lua. Isso é um símbolo de Sabaoth, porque Sofia obteve o universo desde o dia em que formou o sol e a lua e pôs um selo sobre o seu céu, até que a era termine.


    O verme que nasce da fênix também simboliza um ser humano, a respeito de quem está escrito: “O justo florescerá como a fênix”.[d] A fênix aparece primeiro viva, depois morre e torna a levantar-se, servindo de símbolo do que acontecerá na consumação da era.


    Esses poderosos símbolos apareceram somente no Egito, e em nenhum outro lugar, para indicar [e] que ele se assemelha ao Paraíso de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito depois de “[Ela enviou uma ave]”.
    reason: Representa o segundo sinal de texto ausente indicado por colchetes vazios no testemunho.
  - marker: b
    text: “Hidri” translitera um termo obscuro; a identificação exata da criatura ou símbolo aquático é incerta.
    reason: Evita transformar uma leitura incerta em uma espécie ou objeto definido.
  - marker: c
    text: O testemunho assinala aqui a nota 14, mas o conteúdo correspondente não foi fornecido no material de origem.
    reason: Conserva a referência de nota existente sem inventar seu conteúdo.
  - marker: d
    text: O testemunho assinala aqui a nota 15; a citação associa o justo à fênix.
    reason: Registra a nota do testemunho e a formulação particular da citação sem atribuição não comprovada.
  - marker: e
    text: Há uma lacuna no manuscrito depois de “para indicar”.
    reason: Representa os colchetes vazios finais do testemunho.
lexical_decisions:
- source_word: Sophia Zoe
  choice: Sofia Zoe
  rationale: Translitera os nomes/títulos gregos em forma natural em português sem interpretar Zoe como simples substantivo comum.
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico do universo conceitual do tratado, já estabelecido em português acadêmico e religioso.
- source_word: race
  choice: descendência
  rationale: No contexto de Adão, expressa linhagem ou posteridade com maior naturalidade e menor ambiguidade moderna que “raça”.
- source_word: three men
  choice: três tipos de seres humanos
  rationale: O contexto enumera três classes antropológicas; a formulação inclusiva evita que “homens” seja entendido apenas como sexo masculino, embora explicite a classificação implícita.
- source_word: imbued with spirit / imbued with soul / earthly
  choice: dotados de espírito / dotados de alma / terrenos
  rationale: Preserva a distinção tripla do texto sem impor equivalentes teológicos denominacionais.
- source_word: water hydri
  choice: hidri aquática
  rationale: Retém transliterado o termo obscuro do testemunho, sem identificação especulativa; a nota registra a incerteza.
- source_word: true man
  choice: homem verdadeiro
  rationale: Tradução formal que conserva a possível força técnica da expressão e sua ambiguidade.
- source_word: consummation of the age
  choice: consumação da era
  rationale: Preserva a linguagem escatológica e distingue “era” de “mundo”, ambos presentes no trecho.
- source_word: revivifies itself / rises again
  choice: torna a viver / torna a levantar-se
  rationale: Conserva a variação verbal do testemunho e evita uniformizar indevidamente as duas descrições.
theological_decisions:
- issue: Classificação tripla da humanidade
  choice: Preservar “espírito”, “alma” e “terrenos” como categorias paralelas
  alternative: Interpretá-las por categorias gnósticas técnicas posteriores ou denominacionais
  rationale: O próprio texto fornece a tríade; explicações sistemáticas externas resolveriam uma tensão que deve permanecer no texto.
- issue: Agência da fênix em sua morte
  choice: “tira a própria vida”
  alternative: “morre por si mesma” ou simplesmente “morre”
  rationale: Reflete o explícito “dies by suicide” do testemunho, embora em formulação portuguesa digna, sem suavizar a afirmação incomum.
- issue: Juízo contra os arcontes
  choice: “juízo decretado contra eles”
  alternative: “julgamento deles”
  rationale: Mantém tanto a orientação adversativa quanto a indicação parentética de que o juízo foi decretado.
- issue: Relação entre Sofia, Sabaoth e o universo
  choice: Traduzir de perto a sintaxe causal sem harmonização
  alternative: Reformular para esclarecer a quem pertence o universo ou o céu
  rationale: A relação referencial é teologicamente e sintaticamente difícil no testemunho; uma paráfrase poderia introduzir doutrina ausente.
- issue: “homem verdadeiro” no batismo
  choice: Manter a expressão literalmente
  alternative: Identificá-lo com Cristo, Adão espiritual ou uma classe iniciática
  rationale: O trecho não identifica inequivocamente a figura, portanto a tradução não deve fazê-lo.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os sinais editoriais relevantes: colchetes para restaurações, notas para lacunas e sinais angulares em <dentro>. Termos técnicos ou obscuros foram transliterados em vez de interpretados. Como a revisão direta do copta ainda está pendente, o texto permanece explicitamente baseado no testemunho inglês público fornecido.'
