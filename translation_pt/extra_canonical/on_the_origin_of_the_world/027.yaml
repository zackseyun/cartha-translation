id: ORIGW.027
reference: On the Origin of the World — The Consummation of the Age
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'Before the consummation of the age, the entire place will tremble with loud thunder. The archons will then grow sorrowful over [fear of] their (impending) [] death. The angels will lament for their humanity, and the demons will weep over their seasons, and their humanity will moan and shriek at their (impending) death.


    The age will then begin, and they will become troubled. Their kings will become inebriated with the fiery sword, and they will wage war against each other, causing the earth to be drunk with bloodshed, and the seas will be troubled by those wars. The sun will then grow dark, and the moon will eclipse its light. The stars of the sky will stop following their circuits, and a loud thunder blast will emerge from out of a great host that is over every host of Chaos, where the firmament of the woman is located.


    After having produced the first creation, she will lay aside the wise fire of reasoning and clothe herself with unreasoning wrath.


    She will next hound the gods of Chaos, whom she created together with the Primal Parent. She will thrust them down into the Abyss. They will be annihilated for their evil, because they will become like volcanoes, and devour each other until they are destroyed by the power [17] of the Primal Parent.


    After destroying them, he will turn against himself, even destroying himself until he no longer exists, and their heavens will fall on each other, and their hosts will be devoured by fire. Their aeons will be overthrown as well, and his heaven will plummet and shatter in two. His [stars . . .] will plummet onto the earth, [and the earth will be unable] to endure them. They will plummet into the Abyss, and the Abyss will be overthrown. The light will [conquer] the darkness and annihilate it. It will become like [] something that never existed, and the origin of darkness will dissipate, and the deficiency will be uprooted, thrown down into the darkness, and the light will retreat upwards to its root, and the glory of the unbegotten one will appear, and it will fill every aeon when the prophecies and the writings of kings are revealed and fulfilled by those who are called perfect.


    Those, however, who have not become perfect in the unbegotten Father will obtain their glory in their aeons and in the kingdoms of the deathless ones, but they will never enter the kingless aeon, because each must go to the place from which he came. By his deeds and his knowledge, each will reveal his (respective) nature.'
