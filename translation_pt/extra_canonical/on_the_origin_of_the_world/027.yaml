  source_fidelity: 'A tradução acompanha de perto a testemunha inglesa fornecida e preserva adequadamente os principais termos cosmológicos. Contudo, a primeira ocorrência de dano/restauração manuscrital foi deslocada e parcialmente normalizada: a testemunha traz "[fear of] their (impending) [] death", enquanto o rascunho suprimiu os parênteses de "(impending)" e transferiu a lacuna vazia para depois de "morte". A revisão restaura esses sinais exatamente em sua posição relativa. A avaliação direta do copta permanece pendente, portanto as ambiguidades da testemunha inglesa são mantidas.'
  naturalness: O português é moderno, legível e de registro apropriado. Foram feitos pequenos ajustes de precisão e fluência, como "Então começará o éon", "espada ígnea", "eclipsará sua luz" e "recuará para o alto". A construção deliberadamente incompleta com "[]" permanece incomum por refletir dano textual assinalado.
  terminology: '"Arcontes", "éon", "Caos", "Abismo", "Progenitor Primordial", "não gerado" e "éon sem rei" são escolhas adequadas e coerentes com o caráter técnico da cosmologia do tratado. "Imortais" traduz de forma natural "deathless ones" sem impor interpretação doutrinária.'
  issues:
