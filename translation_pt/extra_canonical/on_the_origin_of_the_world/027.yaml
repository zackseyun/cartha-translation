    Depois de destruí-los, ele se voltará contra si mesmo e destruirá até a si próprio, até deixar de existir.[b] Os céus deles cairão uns sobre os outros, e suas hostes serão devoradas pelo fogo. Seus éons também serão derrubados, e o céu dele despencará e se partirá em dois. Suas [estrelas . . .] cairão sobre a terra, [e a terra não será capaz] de suportá-las.[c] Elas cairão no Abismo, e o Abismo será derrubado. A luz [vencerá] as trevas e as aniquilará. Elas se tornarão como [] algo que nunca existiu; a origem das trevas se dissipará, e a deficiência será arrancada pela raiz e lançada nas trevas. A luz recuará para o alto, até sua raiz, e a glória daquele que não foi gerado aparecerá e encherá cada éon, quando as profecias e os escritos dos reis forem revelados e cumpridos por aqueles que são chamados perfeitos.


