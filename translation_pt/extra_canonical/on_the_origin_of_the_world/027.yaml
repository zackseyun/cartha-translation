    issue: Sinalização manuscrital inicial deslocada e parcialmente eliminada.
    rationale: O original da testemunha preserva tanto o parêntese em "(impending)" quanto uma lacuna vazia imediatamente antes de "death". O rascunho converteu isso em "morte iminente […]", alterando a localização e a forma dos sinais de incerteza.
  - severity: low
    issue: Algumas escolhas podem ser mais literais sem perder naturalidade.
    rationale: '"Eclipsará sua luz" reproduz melhor "eclipse its light" do que "ocultará sua luz"; "recuará para o alto" preserva melhor "retreat upwards" do que "retornará para o alto".'
