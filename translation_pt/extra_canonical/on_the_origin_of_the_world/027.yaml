    Então começará o éon, e eles ficarão perturbados. Seus reis ficarão embriagados com a espada ígnea e guerrearão uns contra os outros, fazendo a terra embriagar-se de sangue derramado; e os mares serão agitados por essas guerras. Então o sol escurecerá, e a lua eclipsará sua luz. As estrelas do céu deixarão de seguir seus cursos, e um forte estrondo de trovão sairá de uma grande hoste que está acima de toda hoste do Caos, onde se encontra o firmamento da mulher.


