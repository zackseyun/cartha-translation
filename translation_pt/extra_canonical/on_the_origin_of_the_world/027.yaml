translation:
  language: pt
  text: 'Antes da consumação do éon, todo o lugar estremecerá ao som de fortes trovões. Então os arcontes ficarão angustiados por [medo de] sua morte iminente […].[a] Os anjos lamentarão por sua humanidade, os demônios chorarão por seus períodos, e sua humanidade gemerá e gritará diante da morte iminente.


    Então o éon começará, e eles ficarão perturbados. Seus reis ficarão embriagados com a espada de fogo e guerrearão uns contra os outros, fazendo a terra embriagar-se de sangue derramado; e os mares serão agitados por essas guerras. Então o sol escurecerá, e a lua ocultará sua luz. As estrelas do céu deixarão de seguir seus cursos, e um forte estrondo de trovão sairá de uma grande hoste que está acima de todas as hostes do Caos, onde se encontra o firmamento da mulher.


    Depois de produzir a primeira criação, ela deixará de lado o fogo sábio do raciocínio e se revestirá de ira irracional.


    Em seguida, ela perseguirá os deuses do Caos, que criou junto com o Progenitor Primordial. Ela os lançará no Abismo. Eles serão aniquilados por causa de sua maldade, pois se tornarão semelhantes a vulcões e devorarão uns aos outros, até serem destruídos pelo poder do Progenitor Primordial.


    Depois de destruí-los, ele se voltará contra si mesmo e destruirá até a si próprio, até deixar de existir.[b] Os céus deles cairão uns sobre os outros, e suas hostes serão devoradas pelo fogo. Seus éons também serão derrubados, e o céu dele despencará e se partirá em dois. Suas [estrelas…] cairão sobre a terra, [e a terra não será capaz] de suportá-las.[c] Elas cairão no Abismo, e o Abismo será derrubado. A luz [vencerá] as trevas e as aniquilará. Elas se tornarão como […] algo que nunca existiu; a origem das trevas se dissipará, e a deficiência será arrancada pela raiz e lançada nas trevas. A luz retornará para o alto, à sua raiz, e a glória daquele que não foi gerado aparecerá e encherá todos os éons, quando as profecias e os escritos dos reis forem revelados e cumpridos por aqueles que são chamados perfeitos.


    Contudo, os que não se tornaram perfeitos no Pai não gerado receberão sua glória em seus éons e nos reinos dos imortais, mas jamais entrarão no éon sem rei, pois cada um deve ir para o lugar de onde veio. Por seus atos e por seu conhecimento, cada um revelará sua própria natureza.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes e as reticências indicam restauração proposta ou trecho danificado no manuscrito. A construção em torno do “medo” e da morte está incompleta.
    reason: Preservar de modo visível a incerteza textual.
  - marker: b
    text: O referente de “ele” não é inteiramente claro na testemunha fornecida; pode retomar o Progenitor Primordial ou outra figura do contexto imediato.
    reason: Não resolver silenciosamente uma ambiguidade de referente.
  - marker: c
    text: Há lacunas no texto em torno de “estrelas” e da incapacidade da terra de suportá-las; as palavras entre colchetes são restaurações.
    reason: Sinalizar dano manuscrito e conteúdo reconstruído.
  - marker: d
    text: Esta versão é provisória e foi preparada a partir da testemunha inglesa pública fornecida; a revisão direta do copta do Códice de Nag Hammadi II,5 ainda está pendente.
    reason: Declarar com precisão a base documental e a limitação filológica do rascunho.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico do universo cosmológico do tratado, já estabelecido em português, sem o reduzir genericamente a governantes.
- source_word: age / aeons
  choice: éon / éons
  rationale: Preserva o sentido cosmológico e técnico do termo, sobretudo porque a passagem fala de múltiplos éons e de um 'éon sem rei'; 'era' apagaria parte dessa dimensão.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Expressa prioridade e função parental sem especificar sexo nem identificar a figura com uma formulação doutrinária posterior.
- source_word: Abyss
  choice: Abismo
  rationale: A inicial maiúscula indica que se trata de uma região ou realidade cosmológica específica.
- source_word: unbegotten
  choice: não gerado
  rationale: Tradução transparente que conserva a afirmação de não ter sido gerado, sem recorrer a jargão confessional menos acessível.
- source_word: kingless aeon
  choice: éon sem rei
  rationale: Conserva a imagem incomum e sua possível tensão teológica, sem interpretá-la como um reino político ou como transcendência absoluta.
- source_word: deficiency
  choice: deficiência
  rationale: Mantém o conceito cosmológico abstrato da testemunha, evitando explicá-lo como pecado, matéria ou mal.
theological_decisions:
- issue: Identidade do sujeito masculino após a destruição dos deuses do Caos
  choice: Manter o pronome 'ele'
  alternative: Substituir por 'o Progenitor Primordial' ou por outro nome interpretativo
  rationale: A mudança de referente é abrupta e a testemunha fornecida não permite resolver com segurança a identidade; o pronome preserva essa ambiguidade.
- issue: Destino dos que não se tornam perfeitos
  choice: Traduzir literalmente a distinção entre glória nos próprios éons e impossibilidade de entrar no éon sem rei
  alternative: Harmonizar a passagem com esquemas posteriores de salvação ou condenação
  rationale: O texto apresenta uma cosmologia própria e não deve ser enquadrado silenciosamente em doutrina denominacional.
- issue: Relação entre atos, conhecimento e natureza
  choice: Conservar os três elementos sem explicação causal adicional
  alternative: Interpretar 'conhecimento' como fé salvífica ou 'natureza' como destino moral fixo
  rationale: A formulação admite mais de uma leitura e deve permanecer teologicamente aberta.
- issue: Referente de 'sua humanidade'
  choice: Conservar a expressão possessiva incomum
  alternative: Interpretar como 'os seres humanos sob seu domínio'
  rationale: A testemunha inglesa é sintaticamente ambígua, e a revisão direta do copta ainda está pendente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Termos cosmológicos técnicos foram mantidos quando sua simplificação apagaria distinções do tratado. Repetições e imagens fortes, como a terra embriagada de sangue, foram preservadas. O número de página intrusivo “[17]” foi omitido, enquanto lacunas e restaurações textuais foram conservadas.
