  naturalness: O português é em geral claro, moderno e adequado ao registro do texto. Ajustam-se algumas formulações para maior precisão e fluidez, especialmente “maior que toda autoridade”, “cada um deles” e a designação da última filha.
  terminology: “Pai Primordial do Caos”, “autoridades”, “andrógino”, “Zoé”, “Pistis” e “Estruturas do Destino” são escolhas defensáveis. “Contenciosidade” traduz a disposição para discutir sem acrescentar a categoria de “espírito”. O título final continua assinalado como incerto em nota.
