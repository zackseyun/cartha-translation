  - severity: low
    issue: “o maior entre todas as autoridades” é menos preciso do que a comparação singular do testemunho.
    rationale: “Maior que toda autoridade do Caos” reproduz melhor “greatest of every authority of Chaos”.
  - severity: low
    issue: “cada um gerou” pode deixar impreciso o antecedente após “uns com os outros”.
    rationale: “Cada um deles gerou” torna explícito que se trata dos seres recém-listados, sem alterar o sentido.
