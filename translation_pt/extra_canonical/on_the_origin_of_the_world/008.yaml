lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: Pai Primordial do Caos
  rationale: Mantém a imagem parental e a precedência primordial com linguagem digna e inteligível; o testemunho emprega pronomes masculinos para a personagem.
- source_word: authorities
  choice: autoridades
  rationale: Preserva o termo cosmológico sem substituí-lo por uma hierarquia denominacional ou por 'poderes', usado depois em outro contexto.
- source_word: androgynous
  choice: andrógino/andróginas
  rationale: Conserva a caracterização explícita de entidades que reúnem aspectos masculinos e femininos.
- source_word: mixed himself together with his (own) nature
  choice: uniu-se à sua própria natureza
  rationale: Reproduz com naturalidade a expressão reflexiva e deliberadamente obscura, sem explicar a modalidade da união.
- source_word: Lust
  choice: Desejo
  rationale: Evita restringir o termo necessariamente à luxúria, embora o contexto permita conotação sexual; preserva maior amplitude semântica.
- source_word: Argumentativeness
  choice: Espírito de Contenda
  rationale: Expressa a disposição personificada para discussões e conflitos de modo natural em português.
- source_word: impacts
  choice: influências
  rationale: Em contexto de poderes e demônios, comunica efeitos exercidos sem a estranheza do literal 'impactos'.
- source_word: Zoe
  choice: Zoé
  rationale: Translitera o nome grego com acentuação natural em português, sem traduzi-lo por 'Vida' e assim perder seu caráter nominal.
- source_word: Pistis
  choice: Pistis
  rationale: Mantém a forma nominal grega, distinguindo a personagem ou força chamada Pistis do substantivo comum 'fé'.
- source_word: Structures of the Fate
  choice: Estruturas do Destino
  rationale: Tradução formal do título transmitido, preservando sua terminologia cosmológica incomum.
theological_decisions:
- issue: Origem da Morte
  choice: “gerou a Morte de sua própria morte”
  alternative: “produziu a Morte a partir da morte que havia nele”
  rationale: Preserva a formulação paradoxal e a ambiguidade do testemunho, sem construir uma explicação ontológica ausente.
- issue: Referente do pronome estabelecido sobre o sexto céu
  choice: “A Morte foi estabelecida”
  alternative: “ele foi estabelecido”
  rationale: Explicita apenas o referente gramatical mais provável no contexto, evitando em português uma ambiguidade pronominal artificial entre o Pai e a Morte.
- issue: Relação de Zoé com as forças
  choice: “criou sete boas forças andróginas”
  alternative: “gerou sete boas forças andróginas”
  rationale: Mantém a distinção lexical do testemunho entre a criação realizada por Zoé e a geração atribuída à Morte.
- issue: Identidade de Pistis
  choice: manter “Pistis” como nome
  alternative: traduzir como “Fé”
  rationale: A lista já contém qualidades personificadas, mas a forma transliterada do testemunho pode apontar para uma figura nomeada; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O texto é um rascunho provisório baseado no testemunho inglês de domínio público fornecido, pois a revisão direta do copta ainda está pendente. Removeu-se o número de página manuscrita “[6]”, conforme a camada inglesa auditada. Mantiveram-se nomes técnicos e a tensão cosmológica do texto, sem harmonização doutrinária.
