translation:
  language: pt
  text: 'Desse modo, quando o Pai Primordial do Caos viu seu filho Sabaoth e a glória na qual ele habitava, e percebeu que ele era o maior entre todas as autoridades do Caos, ficou com inveja dele. Enfurecido, gerou a Morte de sua própria morte. A Morte foi estabelecida sobre o sexto céu, porque Sabaoth havia sido elevado daquele lugar. Assim se completou o número das seis autoridades do Caos.


    Então a Morte, um ser andrógino, uniu-se à sua própria natureza e gerou sete filhos andróginos. Estes são os nomes dos filhos masculinos:


    Ciúme,


    Fúria,


    Lágrimas,


    Gemido,


    Sofrimento,


    Choro,


    Lamentação Amarga.


    E estes são os nomes das filhas:


    Fúria,


    Dor,


    Desejo,


    Gemido,


    Maldição,


    Amargura,


    Espírito de Contenda.


    Eles se uniram sexualmente uns com os outros, e cada um gerou sete filhos, totalizando [a] quarenta e nove demônios andróginos.


    Você encontrará seus nomes e suas influências no Livro de Salomão.


    Diante deles, Zoé, que habitava com Sabaoth, criou sete boas forças andróginas. Estes são os nomes das masculinas: Aquele que Não Tem Ciúme, o Bem-aventurado, o Alegre, o Verdadeiro, Aquele que Não Tem Inveja, o Amado e o Fiel. Quanto às femininas, estes são seus nomes: Paz, Alegria, Júbilo, Bem-aventurança, Verdade, Amor e Pistis.[b] Dessas forças procedem muitos espíritos bons e puros.


    Você encontrará suas influências e seus efeitos no Livro das Estruturas do Destino do Céu sob os Doze.[c]'
  philosophy: optimal-equivalence
