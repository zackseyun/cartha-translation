base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: pt
  text: 'Então foi comunicado às autoridades que a forma que haviam moldado estava viva e se pusera de pé, e elas ficaram profundamente perturbadas. Enviaram sete arcanjos para saber o que havia acontecido.


    Eles se aproximaram de Adão. Quando viram Eva falando com ele, disseram uns aos outros: “Que espécie de ser é esta mulher radiante? Ela é semelhante àquela imagem que se manifestou a nós dentro da luz. Venham, vamos agarrá-la e lançar nela a nossa semente, para que, depois de ser profanada, não consiga subir para a sua luz. Em vez disso, aqueles que ela der à luz ficarão sob o nosso domínio. Mas não contemos isso a Adão, pois ele não é um de nós. Em vez disso, façamos cair sobre ele um sono profundo e, enquanto estiver dormindo, ensinemos-lhe que ela se originou de sua costela, para que sua mulher lhe obedeça e ele seja senhor sobre ela.”


    Por ser uma força, Eva riu da decisão deles. Fez uma névoa entrar nos olhos deles e, às escondidas, deixou sua imagem com Adão.


    Ela entrou na árvore do conhecimento e permaneceu ali. Eles a perseguiram, e ela lhes revelou que havia entrado na árvore e se tornado árvore. Então, tomados de grande medo, os seres cegos fugiram.


    Mais tarde, depois de se livrarem do torpor, aproximaram-se de Adão. Ao verem com ele a imagem daquela mulher [a], ficaram profundamente perturbados, pois acreditavam que ela fosse a própria Eva, e agiram impetuosamente. Aproximaram-se dela, agarraram-na e lançaram sobre ela a sua semente.


    Fizeram isso com maldade, profanando-a por meios naturais e obscenos. Primeiro profanaram o selo da voz dela,[b] que lhes havia falado, dizendo: “O que existia antes de vocês?” Desse modo, pretendiam profanar, na consumação da era,[c] aqueles que talvez declarassem, mediante a expressão verbal, que haviam nascido do homem verdadeiro. Eles se desviaram, sem saber que haviam profanado o próprio corpo, pois era a imagem que as autoridades e seus anjos profanaram de todas as maneiras.'
  philosophy: optimal-equivalence
