  - marker: c
    text: Literalmente, “na consumação (da era)”; a formulação se refere a um momento final, mas sua relação sintática com a profanação permanece difícil.
    reason: Registrar a formulação e a dificuldade do testemunho subjacente.
lexical_decisions:
- source_word: authorities
  choice: autoridades
  rationale: Preserva o título cosmológico do testemunho sem interpretá-lo como governantes humanos nem substituir pelo termo técnico “arcontes”.
- source_word: shaped form
  choice: a forma que haviam moldado
  rationale: Mantém a distinção entre a forma produzida pelas autoridades e a vida que posteriormente se manifesta nela.
- source_word: likeness
  choice: imagem
  rationale: “Imagem” é natural e inteligível em português, preservando a ideia de uma contraparte ou aparência substituta sem afirmar identidade.
- source_word: force
  choice: força
  rationale: Conserva a formulação cosmológica incomum e evita reduzi-la a mera força física ou capacidade psicológica.
- source_word: cast our seed into her / upon her
  choice: lançar nela / sobre ela a nossa semente
  rationale: Retém a linguagem deliberadamente crua e a distinção preposicional do testemunho nos dois contextos.
- source_word: seal of her voice
  choice: selo da voz dela
  rationale: Preserva a expressão simbólica e sua ambiguidade, sem explicá-la no corpo do texto.
- source_word: consummation (of the age)
  choice: consumação da era
  rationale: Expressa o horizonte escatológico sem importar a expressão bíblica mais interpretativa “fim dos tempos”.
- source_word: true man
  choice: homem verdadeiro
  rationale: Mantém o provável título antropológico/cosmológico e sua tensão interpretativa.
theological_decisions:
- issue: A origem de Eva a partir da costela de Adão
  choice: Apresentada como ensinamento que as autoridades pretendem inculcar em Adão durante o sono
  alternative: Narrá-la como afirmação factual do próprio texto
  rationale: O discurso atribui explicitamente essa explicação ao plano enganoso das autoridades; a tradução não deve harmonizá-la silenciosamente com outra tradição.
- issue: Identidade entre Eva e a imagem deixada com Adão
  choice: Distinguir Eva de sua “imagem” substituta
  alternative: Tratar a figura apreendida como a própria Eva
  rationale: A distinção é essencial ao enredo e explica por que as autoridades profanam, sem perceber, algo ligado a elas mesmas.
- issue: A frase “o próprio corpo”
  choice: Preservar sem definir de quem é o corpo em termos metafísicos
  alternative: Explicitar que seria o corpo das autoridades, de Eva ou da imagem
  rationale: O testemunho mantém tensão entre corpo, imagem e agentes; uma explicitação resolveria indevidamente a ambiguidade.
- issue: “Nascidos do homem verdadeiro”
  choice: Manter como declaração atribuída a pessoas no fim da era
  alternative: Interpretar “homem verdadeiro” como Adão, Cristo ou um ser celestial específico
  rationale: O trecho fornecido não identifica inequivocamente o referente, portanto a tradução conserva o título aberto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação conserva a aspereza do episódio e seus termos cosmológicos sem eufemismo nem ampliação doutrinária. Este rascunho permanece provisório porque a revisão direta do copta está pendente; baseia-se no testemunho inglês público fornecido e usa notas para marcar dano textual e obscuridades reais.
