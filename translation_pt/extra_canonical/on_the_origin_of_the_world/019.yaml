  naturalness: O português é moderno, claro e mantém um registro apropriado ao texto. A alteração para “como ela se originou da costela dele” é simultaneamente mais precisa e natural no contexto.
  terminology: “Autoridades”, “imagem”, “força”, “semente”, “selo da voz”, “consumação da era” e “homem verdadeiro” preservam adequadamente a terminologia e as ambiguidades do testemunho, sem impor leitura doutrinária.
