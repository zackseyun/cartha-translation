translation:
  language: pt
  text: 'Em seguida, a Justiça criou o Paraíso. Ele era belo e ficava além da órbita da lua e da órbita do sol, dentro da Terra do Deleite, a leste, entre as pedras. O desejo habita entre as árvores belas e agradáveis. E a árvore da vida eterna apareceu, segundo a vontade de Deus, ao norte do Paraíso, para que se tornassem imortais as almas dos santos que sairão das formas humildemente moldadas na consumação da era.


    A cor da árvore da vida se assemelha ao sol, e seus ramos são belos. Suas folhas se parecem com as do cipreste. Seu fruto se parece com um cacho de uvas brancas. Sua altura chega até o céu. Ao lado dela está a árvore do conhecimento, que possui o poder de Deus. Seu esplendor se assemelha à lua quando está em plena luz, e seus ramos são belos. Suas folhas se parecem com folhas de figueira. Seu fruto se parece com uma tâmara boa e agradável. Essa árvore fica ao norte do Paraíso, para que pudesse despertar as almas da letargia dos demônios, a fim de que elas se aproximassem da árvore da vida, comessem de seu fruto e, desse modo, denunciassem as autoridades e seus anjos.


    O efeito dessa árvore é exposto em detalhes na santa Escritura:[a] “Você é a árvore do conhecimento que está no Paraíso, da qual o primeiro ser humano comeu, que lhe abriu a mente; ele amou sua companheira e denunciou [...] as outras formas estranhas, chegando até a desprezá-las.”[b]


    Depois disso, brotou a oliveira, para santificar os reis e os sumos sacerdotes da justiça que haveriam de aparecer nos últimos dias, pois a oliveira surgiu da luz do primeiro Adão para fornecer a unção que eles haveriam de receber.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A obra chama esta passagem de “santa Escritura”, mas a citação não corresponde literalmente a um texto preservado no cânon bíblico conhecido; pode refletir uma tradição ou obra hoje desconhecida.
    reason: Esclarece a natureza incerta da referência sem negar a classificação dada pelo próprio autor.
  - marker: b
    text: Há uma lacuna textual depois de “denunciou”; a extensão e o conteúdo das palavras perdidas são incertos.
    reason: Representa de modo transparente os colchetes vazios do testemunho e impede que a tradução complete conjecturalmente o sentido.
lexical_decisions:
- source_word: Justice
  choice: a Justiça
  rationale: Mantém a personificação presente no testemunho e evita reduzi-la a uma qualidade abstrata sem agência.
- source_word: Paradise
  choice: Paraíso
  rationale: Equivalente tradicional e claro, com inicial maiúscula por designar um lugar específico na cosmologia do texto.
- source_word: Land of Delight
  choice: Terra do Deleite
  rationale: Preserva o caráter titular e a ideia de prazer ou deleite sem identificar silenciosamente o lugar com outro topônimo.
- source_word: satisfying
  choice: agradáveis
  rationale: Em relação a árvores e frutos, comunica de modo natural aquilo que dá prazer ou satisfação, sem limitar o sentido a saciedade física.
- source_word: lowly shaped forms
  choice: formas humildemente moldadas
  rationale: Conserva a estranheza e a ambiguidade da expressão provisória, sem decidir se 'lowly' descreve inferioridade material, condição ou modo de formação.
- source_word: consummation of the age
  choice: consumação da era
  rationale: Mantém a formulação escatológica e sua tensão própria, sem substituí-la por uma interpretação como 'fim do mundo'.
- source_word: strength of God
  choice: poder de Deus
  rationale: Em português corrente, 'poder' expressa com naturalidade força ou potência divina, sem acrescentar uma leitura denominacional.
- source_word: authorities
  choice: autoridades
  rationale: Preserva o termo cosmológico sem interpretá-lo como governantes humanos nem transliterá-lo como nome técnico.
- source_word: female companion
  choice: companheira
  rationale: Mantém a relação descrita no texto sem inserir 'esposa' ou identificar explicitamente a personagem como Eva.
- source_word: high priests of righteousness
  choice: sumos sacerdotes da justiça
  rationale: Conserva a construção genitiva e sua possível carga teológica sem transformá-la em mero adjetivo moral.
- source_word: anointing
  choice: unção
  rationale: Retém a associação ritual e régia da oliveira e do óleo.
theological_decisions:
- issue: Função da árvore do conhecimento
  choice: Mantê-la como instrumento que desperta as almas e conduz à árvore da vida
  alternative: Harmonizá-la com uma leitura exclusivamente negativa da árvore em Gênesis
  rationale: O texto atribui explicitamente à árvore uma função positiva; essa tensão teológica deve permanecer visível.
- issue: Imortalidade das almas dos santos
  choice: Traduzir 'para que se tornassem imortais'
  alternative: Reformular como revelação de uma imortalidade já possuída
  rationale: O testemunho apresenta a imortalidade como resultado ou finalidade, e não autoriza resolver a questão em favor de uma doutrina posterior.
- issue: Identidade das autoridades e de seus anjos
  choice: Não especificar sua natureza além dos termos do texto
  alternative: Cham á-los de arcontes malignos ou poderes demoníacos
  rationale: Embora o contexto cosmológico possa sugerir essa identificação, o trecho fornecido não exige que ela seja explicitada na tradução.
- issue: O primeiro ser humano e sua companheira
  choice: Usar 'primeiro ser humano' e 'companheira'
  alternative: Usar 'Adão' e 'Eva' na citação
  rationale: Evita introduzir nomes não presentes na formulação citada, ao mesmo tempo que preserva a referência humana inclusiva de 'man'.
- issue: Primeiro Adão
  choice: Manter 'primeiro Adão' no parágrafo final
  alternative: Normalizar para 'Adão' ou 'ser humano primordial'
  rationale: A qualificação pode distinguir essa figura de outras figuras adâmicas na obra e, portanto, é teologicamente significativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi moderadamente reorganizada para evitar o encadeamento excessivo do testemunho inglês, mas a ordem das imagens e as relações teológicas foram preservadas. O rascunho é necessariamente provisório porque a revisão direta do copta ainda está pendente; os números de página manuscrita [11] e [12] não foram incorporados como notas textuais.
