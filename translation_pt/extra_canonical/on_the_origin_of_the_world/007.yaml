    reason: Preservar o sinal editorial indicado por colchetes angulares na fonte.
lexical_decisions:
- source_word: assembly
  choice: assembleia
  rationale: Mantém o sentido de reunião organizada e a repetição deliberada do testemunho, sem impor a conotação eclesiástica mais específica de “igreja”.
- source_word: myriads
  choice: miríades
  rationale: Preserva a expressão antiga para quantidades imensas, distinta de “milhares”, e continua compreensível em português moderno.
- source_word: eighth heaven
  choice: oitavo céu
  rationale: Tradução direta da localização cosmológica, sem reinterpretá-la como uma ordem angélica ou plano abstrato.
- source_word: entity / being
  choice: ser
  rationale: “Ser” é natural em português e suficientemente amplo para não definir a natureza ontológica das figuras mencionadas.
- source_word: hosts
  choice: hostes
  rationale: Conserva o registro cosmológico e coletivo do texto; “exércitos” acrescentaria uma ênfase militar não exigida aqui.
- source_word: likenesses
  choice: imagens
  rationale: Expressa entidades feitas à semelhança dos modelos celestes; evita sugerir meras comparações verbais.
- source_word: consummation
  choice: consumação
  rationale: Mantém o termo escatológico e sua possível tensão entre conclusão, cumprimento e término.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Preserva a ideia de origem parental sem especificar “pai” ou “mãe” e mantém o caráter titular da expressão.
- source_word: aeon
  choice: éon
  rationale: Retém o termo técnico da cosmologia do escrito, cuja extensão semântica pode abranger era, domínio ou realidade supramundana.
- source_word: stands over
  choice: está sobre
  rationale: Reprodução deliberadamente não interpretativa, que conserva a possível ideia de posição, supervisão ou domínio.
theological_decisions:
- issue: Referentes dos pronomes masculinos na cena dos tronos
  choice: Manter “dele” e “ele” onde o testemunho permite mais de um encadeamento de referentes
  alternative: Substituir os pronomes por “Sabaoth”, “Jesus Cristo” ou “o salvador”
  rationale: A explicitação resolveria uma ambiguidade real do testemunho fornecido e poderia alterar a disposição hierárquica das figuras.
- issue: Identidade entre o Jesus Cristo criado e o salvador do oitavo céu
  choice: Traduzir que Jesus Cristo é “semelhante ao salvador”
  alternative: Identificá-lo diretamente como o próprio salvador
  rationale: O texto distingue o ser criado de seu modelo superior por linguagem de semelhança; a tradução preserva essa distinção cosmológica.
- issue: Pistis Sophia e Sofia, filha de Pistis
  choice: Conservar as formas nominais “Pistis Sofia”, “Sofia” e “Pistis” conforme aparecem em cada passagem
  alternative: Uniformizar todas as ocorrências como uma única figura ou traduzir os nomes por “Fé” e “Sabedoria”
  rationale: A variação pode ser significativa e não deve ser harmonizada sem revisão direta do copta.
- issue: Direita como justiça e esquerda como mal
  choice: Reproduzir a associação declarada pelo texto sem comentário corretivo
  alternative: Atenuar “mal” para “erro” ou explicar a imagem simbolicamente no corpo do texto
  rationale: A formulação pertence à cosmologia e à etiologia do escrito; uma paráfrase poderia neutralizar sua tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário cosmológico preservado. A tradução é provisória porque se baseia no testemunho público em inglês fornecido; a revisão direta do copta ainda está pendente. Foram mantidos os sinais de lacuna e de complementação editorial, agora acompanhados de notas. O número de página manuscrita “[5]” não foi inserido no corpo por não integrar a frase.
