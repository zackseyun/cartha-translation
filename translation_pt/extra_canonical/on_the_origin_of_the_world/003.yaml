base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: pt
  text: 'Quando o arconte contemplou seu tamanho — embora não visse ninguém além de si mesmo, pois nada enxergava para além da água e das trevas —, imaginou que era o único que existia. Seu [...] foi completado por meio da articulação verbal, que [] se manifestou como um espírito movendo-se de um lado para outro sobre as águas. Quando esse espírito se manifestou, o arconte separou a substância aquosa, e a parte seca foi posta à parte em outro lugar. Da matéria, formou para si uma morada e a chamou de “Céu”. Da matéria, o arconte também formou um estrado para os pés e o chamou de “Terra”.


    Então ocorreu ao arconte um pensamento de acordo com sua natureza e, por meio da articulação verbal, ele criou um ser andrógino. Abriu a boca e emitiu para ele um som semelhante a um arrulho. Quando seus olhos se abriram, ele contemplou seu pai e lhe dirigiu o som: “eee!”. Seu pai então lhe deu o nome de “Eee-a-o”.[a]


    Depois criou o segundo filho, emitindo para ele um som semelhante a um arrulho. Quando o filho abriu os olhos, dirigiu ao pai o som: “eh!”. Seu pai lhe deu o nome de “Eloai”.


    Depois criou o terceiro filho, emitindo para ele um som semelhante a um arrulho. Quando o filho abriu os olhos, dirigiu ao pai o som: “asss!”. Seu pai lhe deu o nome de “Astaphaios”.


    Esses três são os filhos de seu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho fornecido traz aqui o marcador “[1]”, mas não inclui o conteúdo correspondente da nota. As formas vocais e os nomes foram transliterados conforme esse testemunho; a leitura deve ser revista à luz do copta e dos manuscritos.
    reason: Registra com transparência a nota ausente e o caráter provisório das transliterações, sem inventar conteúdo.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Mantém o termo técnico tradicional para a entidade governante deste texto, sem reduzi-lo a “governante” ou importar uma interpretação denominacional.
- source_word: verbal articulation
  choice: articulação verbal
  rationale: Preserva a formulação incomum e possivelmente técnica da testemunha, em vez de resolver a expressão como simples “fala” ou “palavra”.
- source_word: aqueous substance
  choice: substância aquosa
  rationale: Conserva a linguagem cosmológica material do testemunho e sua distinção em relação à parte seca.
- source_word: footstool
  choice: estrado para os pés
  rationale: Expressa a imagem concreta com clareza em português atual, sem apagar a relação figurativa entre céu e terra.
- source_word: androgyne
  choice: ser andrógino
  rationale: Torna o substantivo compreensível em português corrente e preserva a caracterização sexual dupla sem explicá-la além do texto.
- source_word: cooing sound
  choice: som semelhante a um arrulho
  rationale: Reproduz a natureza vocal e não lexical do som, evitando a conotação exclusivamente infantil que “balbucio” poderia introduzir.
- source_word: Heaven / Earth
  choice: Céu / Terra
  rationale: As iniciais maiúsculas refletem o uso como nomes dados pelo arconte neste contexto.
theological_decisions:
- issue: Identidade e pretensão do arconte
  choice: Manter que ele “imaginou” ser o único existente
  alternative: Dizer que ele “pensou” ou “declarou” ser o único deus
  rationale: “Imaginou” preserva a ironia e a limitação cognitiva do relato sem acrescentar o título “deus”, ausente neste trecho.
- issue: Espírito sobre as águas
  choice: Traduzir literalmente como “um espírito movendo-se... sobre as águas”
  alternative: Identificá-lo com o Espírito Santo ou com o vento
  rationale: O texto não resolve aqui a identidade nem a natureza desse espírito; a tradução deve preservar a possível alusão e a ambiguidade.
- issue: Criação por articulação verbal
  choice: Preservar “por meio da articulação verbal”
  alternative: Normalizar como “por sua palavra”
  rationale: A normalização poderia aproximar indevidamente o trecho de uma fórmula bíblica específica e apagar a peculiaridade conceitual da testemunha.
- issue: Natureza do primeiro ser criado
  choice: “um ser andrógino”
  alternative: “um homem andrógino” ou “um andrógino”
  rationale: A escolha mantém o gênero ontológico aberto e não pressupõe humanidade onde o testemunho apenas indica androginia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação permanece deliberadamente próxima do testemunho público em inglês porque a revisão direta do copta ainda está pendente. As lacunas “[...]” e “[]” foram preservadas exatamente como sinais de texto faltante ou incerto. Os nomes Eee-a-o, Eloai e Astaphaios não foram aportuguesados, para evitar decisões prematuras antes da conferência do original.
