base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: pt
  text: 'A Psique primordial amou Eros, que vivia com ela, e derramou seu sangue sobre ele e sobre a terra. Desse sangue, a primeira rosa brotou da terra, surgindo da sarça espinhosa como fonte de alegria para a luz que haveria de aparecer de dentro da sarça.


    Além disso, depois disso, belas flores de agradável perfume brotaram da terra, de diversas espécies, provenientes de cada uma das filhas virgens de Pronoia. Quando elas se apaixonaram por Eros, derramaram seu sangue sobre ele e sobre a terra.


    Depois delas, todas as plantas brotaram da terra, de diversas espécies, trazendo dentro de si a semente das autoridades e de seus anjos.


    Depois delas, as autoridades criaram das águas diversas espécies de animais, entre elas répteis e aves, que traziam dentro de si a semente das autoridades e de seus anjos.


    No entanto, antes de tudo isso, quando ele apareceu no primeiro dia, permaneceu na terra por cerca de dois dias. Então partiu da Pronoia inferior, no céu, e subiu em direção à sua luz. Imediatamente, a escuridão encobriu todo o cosmos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta do texto copta ainda está pendente; no último parágrafo, o referente de «ele» permanece incerto.
    reason: Informa a limitação da base documental e registra uma ambiguidade relevante sem alterá-la no texto.
lexical_decisions:
- source_word: Psyche
  choice: Psique
  rationale: Mantém o nome personificado, em sua forma portuguesa corrente, sem reduzi-lo ao substantivo comum «alma».
- source_word: Eros
  choice: Eros
  rationale: Conserva o nome próprio tradicional e a personificação presente no testemunho.
- source_word: Pronoia
  choice: Pronoia
  rationale: Retém o termo técnico e nome personificado, evitando resolver seu sentido como «Providência» sem revisão direta do copta.
- source_word: authorities
  choice: autoridades
  rationale: Equivalente formal que preserva o caráter cosmológico do grupo sem introduzir terminologia denominacional.
- source_word: cosmos
  choice: cosmos
  rationale: Preserva a amplitude cosmológica do termo e o registro do escrito.
- source_word: thorn bush
  choice: sarça espinhosa
  rationale: Expressa a imagem de um arbusto dotado de espinhos e permite repetir naturalmente «sarça» na oração seguinte.
theological_decisions:
- issue: Identidade do pronome masculino no último parágrafo
  choice: Preservar «ele» sem explicitar o referente
  alternative: Substituir o pronome por Eros ou por outra figura nomeada
  rationale: O testemunho fornecido deixa o referente ambíguo; explicitá-lo resolveria indevidamente uma tensão textual.
- issue: Natureza da semente das autoridades e de seus anjos
  choice: Traduzir literalmente como «semente»
  alternative: Interpretar como essência, descendência ou princípio espiritual
  rationale: A formulação metafórica e cosmológica deve permanecer aberta, sem impor uma explicação doutrinária.
- issue: Pronoia como nome ou conceito traduzido
  choice: Manter «Pronoia»
  alternative: Traduzir por «Providência» ou «Presciência»
  rationale: A transliteração preserva a personagem e evita escolher prematuramente entre nuances conceituais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Os nomes personificados foram conservados; a sintaxe foi suavemente reorganizada para clareza, sem eliminar repetições estruturais nem ambiguidades genuínas.
