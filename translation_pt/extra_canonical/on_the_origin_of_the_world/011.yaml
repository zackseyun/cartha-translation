base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: pt
  text: 'Como ser andrógino, Eros surgiu daquele sangue primordial. Seu elemento masculino é Himireris[a], que é fogo proveniente da luz. Seu elemento feminino, que habita com ele, é uma alma constituída de sangue e tem origem na substância de Pronoia[b]. Sua beleza é extraordinariamente encantadora, e seu fascínio supera o de todos os seres criados do Caos.


    Então, quando todos os deuses e seus anjos contemplaram Eros, apaixonaram-se por ele. Manifestando-se dentro de todos eles, Eros os inflamou. Assim como várias lâmpadas são acesas a partir de uma só lâmpada, e nelas está a mesma e única luz sem que a primeira lâmpada diminua, também Eros se difundiu dentro de todos os seres criados do Caos sem diminuir. Assim como Eros apareceu no meio da luz e das trevas, e assim como a união sexual de Eros se consumou no meio dos anjos e da humanidade, também o prazer primordial floresceu da terra. À Terra seguiu-se a Mulher; à Mulher, o casamento; ao casamento, o nascimento; ao nascimento, o declínio.


    Depois de Eros, a videira brotou daquele sangue derramado sobre a terra. Por isso, os que bebem de seu fruto passam a sentir desejo de união sexual.


    Depois da videira, brotaram da terra uma figueira e uma romãzeira, juntamente com todas as demais árvores, cada espécie possuindo sua semente proveniente da [—][c] semente das autoridades e de seus anjos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Himireris: nome conservado conforme o testemunho disponível; sua forma e possível relação com termos gregos ligados ao desejo exigem revisão direta do copta.'
