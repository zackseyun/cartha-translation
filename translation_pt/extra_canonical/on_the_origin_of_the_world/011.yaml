    reason: Preserva a personificação e a amplitude semântica do termo.
  - marker: c
    text: Há uma lacuna no testemunho neste ponto; não é possível determinar com segurança o que precedia “semente”.
    reason: Preserva explicitamente a falha textual indicada por colchetes na fonte fornecida.
lexical_decisions:
- source_word: Eros
  choice: Eros
  rationale: Mantém o nome personificado, em vez de o reduzir ao substantivo comum “amor” ou “desejo”.
- source_word: androgynous entity
  choice: ser andrógino
  rationale: Expressão natural em português que preserva a coexistência dos elementos masculino e feminino descrita no texto.
- source_word: Himireris
  choice: Himireris
  rationale: Conserva a forma do testemunho fornecido, pois a revisão direta do copta ainda está pendente e uma emenda conjectural seria indevida.
- source_word: Pronoia
  choice: Pronoia
  rationale: Mantém como nome próprio a figura ou realidade personificada, sem resolver antecipadamente se deve ser entendida simplesmente como “Providência”.
- source_word: set them ablaze
  choice: os inflamou
  rationale: Preserva simultaneamente a imagem do fogo e sua associação contextual com o desejo.
- source_word: authorities
  choice: autoridades
  rationale: Equivalente amplo e não denominacional que mantém o termo técnico cosmológico sem substituí-lo por uma hierarquia interpretativa específica.
- source_word: decline
  choice: declínio
  rationale: Preserva a formulação e sua abertura sem especificar “morte”, “corrupção” ou “dissolução” além da evidência disponível.
theological_decisions:
- issue: Natureza de Eros
  choice: Eros é apresentado como ser personificado e andrógino
  alternative: Traduzir Eros como a abstração “Amor” ou “Desejo”
  rationale: A passagem atribui a Eros elementos masculino e feminino, beleza, manifestação e ação pessoal; conservar o nome evita impor uma identificação conceitual única.
- issue: Pronoia
  choice: Manter a transliteração como nome próprio
  alternative: Traduzir por “Providência” ou “Previsão”
  rationale: A transliteração preserva a função cosmológica personificada e a ambiguidade terminológica até que haja revisão direta da fonte copta.
- issue: Sequência nascimento–declínio
  choice: Manter “declínio”
  alternative: Interpretar como morte, corrupção física ou decadência moral
  rationale: A escolha não fecha uma tensão antropológica ou cosmológica que o testemunho inglês não permite resolver com segurança.
- issue: Autoridades e seus anjos
  choice: Usar “autoridades” sem qualificação
  alternative: Empregar “potestades”, “arcontes” ou “governantes”
  rationale: O testemunho fornecido usa um termo genérico; uma designação mais técnica poderia importar uma identificação cosmológica não confirmada pela revisão da língua-fonte.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A sintaxe repetitiva da sequência “Terra–Mulher–casamento–nascimento–declínio” foi preservada por seu efeito retórico. Os números de página inseridos no testemunho inglês foram omitidos por não pertencerem ao fluxo do texto. Como a revisão direta do copta está pendente, a redação permanece deliberadamente cautelosa nos nomes e termos cosmológicos.
