review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência narrativa, os nomes, a condição de Adão como alguém que «não tinha alma», a função de Eva como mestra e o título «Mãe dos Viventes». Contudo, o testemunho inglês assinala tanto «[When]» quanto uma lacuna adicional «[]»; o rascunho reteve apenas o primeiro sinal. A frase final do segundo parágrafo também pode refletir de modo mais explícito a sequência «depois de se levantar».
  naturalness: O registro é claro, moderno e adequado. Ajustes leves tornam mais natural a construção «para fazer Adão ... levantar-se» e evitam que «pois Adão se levantou» pareça introduzir uma relação causal mais forte do que a do testemunho.
  terminology: «Sofia», «Zoé», «Eva», «alma», «vasos de luz» e «Mãe dos Viventes» são escolhas adequadas e consistentes. «Mestra» é legítimo no registro do texto e preserva o feminino de «teacher».
  issues:
  - severity: medium
    issue: A segunda marca de lacuna «[]» do testemunho não foi preservada.
    rationale: O inglês-base e a POB inglesa exibem «[When] [] Eve». Para manter os sinais de dano/restauração e não apresentar como completo um trecho lacunoso, a marca vazia deve constar também em português, com nota explicativa.
  - severity: low
    issue: A cláusula sobre Adão abrir os olhos simplifica a ordem sintática do testemunho.
    rationale: O sentido geral foi mantido, mas «depois de se levantar, Adão abriu rapidamente os olhos» reproduz de forma mais transparente «Adam, after standing up, speedily opened his eyes».
  revised_text: 'Depois do dia de descanso, Sofia enviou sua filha Zoé, chamada Eva, como mestra, para fazer Adão, que não tinha alma, levantar-se, a fim de que aqueles que ele geraria pudessem tornar-se vasos de luz.



    [Quando] [][a] Eva viu seu companheiro caído por terra, teve compaixão dele e disse: “Adão, viva! Levante-se sobre a terra!”



    Sua palavra se cumpriu imediatamente em ação, pois, depois de se levantar, Adão abriu rapidamente os olhos. Quando a viu, disse: “Você será chamada ‘Mãe dos Viventes’, porque foi você quem me deu vida.”'
  revised_footnotes:
  - marker: a
    text: O início da frase é textual ou editorialmente incerto no testemunho utilizado. Os colchetes em «[Quando] []» assinalam uma restauração e uma lacuna adicional; a revisão direta do copta ainda está pendente.
    reason: Preserva as duas marcações de incerteza («[When] []») do testemunho inglês fornecido e esclarece a limitação da base textual.
  revision_rationale: A revisão preserva integralmente o sentido do rascunho, mas repõe a lacuna adicional indicada no testemunho e torna mais explícita a sequência pela qual Adão se levanta e então abre os olhos. Não foram introduzidas interpretações teológicas nem preenchimentos para o material lacunoso.
