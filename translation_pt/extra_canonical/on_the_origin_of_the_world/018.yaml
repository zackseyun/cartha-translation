base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: pt
  text: 'Depois do dia de descanso, Sofia enviou sua filha Zoé, chamada Eva, como mestra, para que fizesse levantar-se Adão, que não tinha alma, a fim de que aqueles que ele geraria pudessem tornar-se vasos de luz.


    [Quando][a] Eva viu seu companheiro caído por terra, teve compaixão dele e disse: “Adão, viva! Levante-se sobre a terra!”


    Sua palavra imediatamente se cumpriu em ação, pois Adão se levantou e logo abriu os olhos. Quando a viu, disse: “Você será chamada ‘Mãe dos Viventes’, porque foi você quem me deu vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início da frase é textual ou editorialmente incerto no testemunho utilizado; os colchetes indicam uma restauração. A revisão direta do copta ainda está pendente.
    reason: Preservar o sinal de lacuna ou restauração apresentado na fonte e esclarecer a limitação da base textual.
lexical_decisions:
- source_word: Sophia
  choice: Sofia
  rationale: Translitera o nome grego e conserva sua associação transparente com a Sabedoria, sem substituí-lo por uma interpretação.
- source_word: Zoe
  choice: Zoé
  rationale: Transliteração corrente do nome grego, preservando o jogo conceitual com ‘vida’ que reaparece no trecho.
- source_word: Eve
  choice: Eva
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: soulless Adam
  choice: Adão, que não tinha alma
  rationale: Mantém a afirmação explícita e teologicamente tensa do testemunho, sem suavizá-la como ‘sem vida’.
- source_word: vessels of light
  choice: vasos de luz
  rationale: Preserva a metáfora religiosa concreta e sua possível carga técnica.
- source_word: lying prostrate
  choice: caído por terra
  rationale: Expressa a postura de abatimento sem especificar ‘de bruços’, detalhe não necessariamente exigido por ‘prostrate’.
- source_word: live
  choice: viva
  rationale: Imperativo natural em português e distinto da ordem seguinte, ‘Levante-se’.
- source_word: Mother of the Living
  choice: Mãe dos Viventes
  rationale: Conserva o título solene e o vínculo lexical com vida, evitando restringi-lo apenas aos que estão vivos no momento.
theological_decisions:
- issue: Condição de Adão antes da intervenção de Eva
  choice: “que não tinha alma”
  alternative: “sem vida” ou “inanimado”
  rationale: O testemunho fornecido diz ‘soulless’; a tradução mantém essa formulação incomum e sua tensão antropológica, em vez de harmonizá-la com outras narrativas.
- issue: Papel de Eva
  choice: “como mestra” e agente que dá vida a Adão
  alternative: Atenuar ‘teacher’ ou reformular Eva apenas como auxiliadora
  rationale: Mantém a caracterização própria do texto, sem importação de leituras confessionais de outros escritos.
- issue: Cumprimento performativo da fala
  choice: “Sua palavra imediatamente se cumpriu em ação”
  alternative: “Suas palavras tiveram efeito imediato”
  rationale: Preserva a relação enfática entre enunciação e ato presente no testemunho.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. Mantiveram-se os nomes Sofia e Zoé e as metáforas ‘vasos de luz’ e ‘Mãe dos Viventes’. Esta versão é provisória, pois foi preparada a partir do testemunho inglês público fornecido; a conferência direta do copta permanece pendente.
