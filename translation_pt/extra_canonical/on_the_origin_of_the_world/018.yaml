source:
  text: 'After the day of rest, Sophia dispatched her daughter Zoe, called Eve, as a teacher, so that she could make the soulless Adam stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying prostrate, she had compassion on him, and she said: “Adam, live! Stand up on the earth!”


    Her utterance straightaway was fulfilled in act, because Adam, after standing up, speedily opened his eyes. When he beheld her, he said: “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
