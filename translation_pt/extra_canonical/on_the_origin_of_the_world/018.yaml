review_pass:
  verdict: revise
  source_fidelity: A versão transmite com precisão o enredo, os nomes e os termos teologicamente marcantes do testemunho inglês provisório. Contudo, a sequência explícita de «after standing up» deve ser preservada, e os dois sinais de incerteza/lacuna em «[When] []» devem aparecer visivelmente no texto português, sem que o segundo seja absorvido pelo marcador de nota.
  naturalness: O português é claro, moderno e de registro apropriado. «Jazia prostrado» representa melhor «lying prostrate» do que «caído por terra», sem introduzir a especificação «de bruços».
  terminology: «Sofia», «Zoé», «Eva», «sem alma», «vasos de luz» e «Mãe dos Viventes» são escolhas adequadas e preservam tanto a terminologia quanto os jogos conceituais do testemunho. «Seu companheiro, o homem» torna explícito o qualificativo «male» de modo mais idiomático que uma formulação clínica.
  issues:
  - severity: medium
    issue: A sequência temporal de Adão levantar-se antes de abrir os olhos foi condensada.
    rationale: O testemunho diz que Adão, depois de se levantar, rapidamente abriu os olhos. «Adão se levantou e logo abriu os olhos» é possível, mas a redação revista conserva mais diretamente a construção e a ênfase da fonte.
  - severity: medium
    issue: O segundo conjunto de colchetes vazio da fonte não está visível no texto traduzido.
    rationale: A fonte apresenta «[When] []». Para preservar os sinais editoriais de restauração e lacuna, ambos devem permanecer no texto; a nota pode explicar sua função.
  - severity: low
    issue: «Caído por terra» enfraquece a indicação postural de «lying prostrate».
    rationale: «Jazia prostrado» é natural em português e mantém a postura indicada, sem resolver indevidamente sua orientação corporal.
  revised_text: 'Depois do dia de descanso, Sofia enviou sua filha Zoé, chamada Eva, como mestra, para que fizesse Adão, que não tinha alma, levantar-se, a fim de que aqueles que ele geraria pudessem tornar-se vasos de luz.


    [Quando] [][a] Eva viu seu companheiro, o homem, jazer prostrado, teve compaixão dele e disse: “Adão, viva! Levante-se sobre a terra!”


    Sua palavra imediatamente se cumpriu em ação, pois, depois de se levantar, Adão rapidamente abriu os olhos. Quando a viu, disse: “Você será chamada ‘Mãe dos Viventes’, porque foi você quem me deu vida.”'
