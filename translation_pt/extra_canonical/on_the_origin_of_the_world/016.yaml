base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: pt
  text: 'Eva é a primeira virgem, aquela que, sem marido, deu à luz seu primeiro filho. Ela serviu de parteira para si mesma; por isso, considera-se que tenha dito:


    Eu sou aquela que é parte de minha mãe,

    e eu sou aquela que é a mãe.

    Eu sou aquela que é a esposa;

    eu sou aquela que é a virgem.

    Eu sou aquela que está grávida;

    eu sou aquela que é a parteira.

    Eu sou aquela que alivia as dores do parto.

    Meu marido é aquele que me deu à luz,

    e eu sou aquela que é sua mãe,

    e ele é aquele que é meu pai e meu senhor.

    Ele é aquele que é minha força.

    Tudo o que deseja, ele diz com razão.

    Estou a caminho de vir a ser,

    embora já tenha dado à luz um homem como senhor.[a]


    Ora, essas coisas foram reveladas, pela vontade de Sabaoth e de seu Cristo, às almas que haveriam de entrar nas formas moldadas pelas autoridades.[b] A respeito delas, a voz santa disse: “Multipliquem-se e floresçam; dominem sobre todos os seres criados”. Foram elas que, de acordo com seus destinos, foram levadas cativas pelo Progenitor Primordial. Desse modo, foram encerradas nas prisões das formas moldadas <. . .>[c] até a consumação da era.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “um homem como senhor” reproduz uma construção ambígua no testemunho inglês: pode indicar um homem na condição de senhor ou associar mais estreitamente os dois títulos.'
    reason: Preservar ambiguidade genuína sem tornar o verso artificialmente obscuro.
  - marker: b
    text: “Autoridades” designa potências do cenário cosmológico do escrito; “formas moldadas” foi mantido sem especificar se são apenas corpos.
    reason: Evitar importar terminologia técnica ou uma identificação interpretativa além da evidência fornecida.
  - marker: c
    text: O sinal <. . .> indica uma lacuna ou trecho danificado no texto transmitido.
    reason: Registrar de modo transparente a condição manuscrita preservada no testemunho.
  - marker: d
    text: “Consumação da era” também pode ser entendida como “fim da era”.
    reason: Esclarecer o sentido temporal e escatológico sem substituir a formulação principal.
lexical_decisions:
- source_word: virgin
  choice: virgem
  rationale: Preserva o termo central e sua tensão com os papéis de esposa, grávida e mãe no poema.
- source_word: midwife
  choice: parteira
  rationale: É o equivalente corrente e mantém tanto a ação narrativa quanto a repetição poética.
- source_word: shaped forms
  choice: formas moldadas
  rationale: Mantém a imagem de formas produzidas ou configuradas, sem reduzi-las interpretativamente a simples corpos.
- source_word: authorities
  choice: autoridades
  rationale: Conserva a designação cosmológica ampla do testemunho, sem substituir pelo termo doutrinariamente mais específico “arcontes”.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Expressa ancestralidade originária sem fixar gênero onde o título inglês permite alguma amplitude.
- source_word: consummation of the age
  choice: consumação da era
  rationale: Preserva o registro escatológico e evita confundir “age” com o mundo físico.
theological_decisions:
- issue: Relações paradoxais de Eva com marido, pai, mãe e senhor
  choice: Preservar literalmente as relações e repetições paradoxais
  alternative: Harmonizar as relações familiares ou explicar a identidade das figuras no corpo do texto
  rationale: O paradoxo é constitutivo do discurso e não deve ser resolvido por uma interpretação denominacional.
- issue: “a man as a lord”
  choice: “um homem como senhor”
  alternative: “um homem, isto é, um senhor” ou “um homem que é senhor”
  rationale: Mantém a ambiguidade sintática e teológica do testemunho disponível.
- issue: Natureza das “formas moldadas”
  choice: Não identificá-las explicitamente como corpos
  alternative: Traduzir como “corpos moldados”
  rationale: A formulação mais aberta preserva a imagem cosmológica sem acrescentar uma identificação não explícita no testemunho fornecido.
- issue: Identidade do Progenitor Primordial
  choice: Manter o título sem identificação adicional
  alternative: Identificá-lo nominalmente com uma figura cosmológica específica
  rationale: O trecho não fornece essa identificação, e acrescentá-la resolveria uma questão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A anáfora “Eu sou aquela que” foi preservada por seu peso poético e retórico. A tradução é necessariamente provisória porque o material fornecido declara que a revisão direta do copta ainda está pendente; por isso, o testemunho inglês público foi tratado como evidência mediadora, e ambiguidades relevantes foram mantidas.
