  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário internacional. A sintaxe foi suavizada onde necessário, mas nomes técnicos e imagens cosmológicas foram preservados. Trata-se de versão provisória baseada no testemunho inglês de domínio público; a revisão direta do copta ainda está pendente.
