    rationale: O testemunho diz apenas “its light”, após mencionar a semelhança humana, mas a relação referencial pode permanecer ambígua. “Dessa figura” interpreta e estabiliza uma referência que o texto-base não explicita.
  - severity: medium
    issue: Sujeito feminino introduzido em “Ela apareceu por meio das águas”.
    rationale: O testemunho apresenta “(it appeared) through the waters”, com o verbo entre parênteses e sem sujeito lexical explícito. O pronome feminino “Ela” resolve uma incerteza textual e referencial; deve-se preservar a elipse editorial em português.
  - severity: low
