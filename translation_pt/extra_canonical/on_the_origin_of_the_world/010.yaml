base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: pt
  text: 'Quando o Progenitor Primordial viu como a luz resplandecia belamente, ficou maravilhado e sentiu profunda vergonha. Enquanto aquela luz surgia, manifestou-se dentro dela uma semelhança humana verdadeiramente maravilhosa. Ninguém a viu, a não ser o Progenitor Primordial e Pronoia, que habitava com ele. Contudo, a luz dessa figura manifestou-se a todas as hostes dos céus, e por isso todas ficaram perturbadas.


    Quando Pronoia viu aquele mensageiro, apaixonou-se por ele. Ele, porém, sentiu aversão por ela, porque ela habitava nas trevas. Pronoia quis abraçá-lo, mas não conseguiu. Como não podia extinguir seu amor, derramou sua luz sobre a terra. Desde aquele dia, esse mensageiro é chamado “Adão de Luz”, nome que, traduzido, significa “o homem radiante de sangue”.[a] E, acima dele, estendeu-se a terra: o santo Adaman, nome que, traduzido, significa “a Terra Santa do Adamantino”.[b]


    Desde aquele dia, toda autoridade tem honrado o sangue da virgem, e a terra foi purificada por causa do sangue da virgem. Além disso, a água foi purificada por meio da semelhança de Pistis Sophia, que havia aparecido ao Progenitor Primordial dentro das águas. Por isso, foi dito com razão: “Ela apareceu por meio das águas”.[c] Visto que dá vida a tudo, […] a água santa purifica tudo.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A explicação do nome “Adão de Luz” como “o homem radiante de sangue” reproduz o jogo etimológico oferecido pelo próprio tratado; não corresponde à etimologia hebraica comum de “Adão”.
    reason: Evita que uma etimologia interna e incomum seja tomada como explicação linguística consensual.
  - marker: b
    text: “Adaman” e “Adamantino” reproduzem um jogo de palavras do texto. O testemunho inglês traz neste ponto o número de página manuscrita “[7]”, omitido do corpo da tradução por não fazer parte da frase.
    reason: Esclarece o nome raro e documenta a retirada do número de página que interrompia a sentença.
  - marker: c
    text: No testemunho utilizado, as palavras correspondentes a “Ela apareceu” estão indicadas como uma complementação editorial; o texto e o referente exatos permanecem incertos até a revisão direta do copta.
    reason: Sinaliza uma restauração editorial e preserva a incerteza do testemunho.
  - marker: d
    text: Há uma lacuna ou restauração não preenchida no testemunho antes de “a água santa”.
    reason: Preserva no texto traduzido o sinal de dano ou omissão manuscrita representado por colchetes vazios no testemunho.
lexical_decisions:
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Preserva a ideia de uma figura originária e parental, bem como o gênero masculino indicado pelos pronomes do testemunho, sem introduzir o título teologicamente mais carregado “Pai”.
- source_word: Pronoia
  choice: Pronoia
  rationale: Mantém transliterado o nome técnico grego, em vez de o reduzir simplesmente a “Providência”, pois aqui ele funciona como nome próprio de uma personagem.
- source_word: human likeness
  choice: semelhança humana
  rationale: Conserva a linguagem de aparência ou imagem, sem afirmar que a figura fosse simplesmente um ser humano.
- source_word: hosts of the heavens
  choice: hostes dos céus
  rationale: Expressão digna e compreensível que preserva o plural “céus” e a noção coletiva de hostes.
- source_word: authority
  choice: autoridade
  rationale: Mantém o termo cosmológico sem identificá-lo interpretativamente com “governante”, “arconte” ou “potestade” na ausência de revisão direta do copta.
- source_word: Adam of Light
  choice: Adão de Luz
  rationale: Emprega a forma portuguesa consagrada “Adão” e conserva a construção titular do testemunho.
- source_word: Adaman
  choice: Adaman
  rationale: Preserva o nome técnico e seu jogo etimológico subsequente, evitando confundi-lo silenciosamente com “Adão”.
- source_word: Pistis Sophia
  choice: Pistis Sophia
  rationale: Mantém o nome composto tradicional, cuja tradução literal poderia apagar seu caráter de nome próprio no tratado.
- source_word: holy water
  choice: água santa
  rationale: Tradução direta e natural, sem substituir pelo termo mais especificamente ritual “água benta”.
theological_decisions:
- issue: Identidade da figura luminosa
  choice: “semelhança humana” e “mensageiro” permanecem distintos
  alternative: Identificar explicitamente a figura com Adão ou com outra entidade celestial
  rationale: O trecho passa da semelhança dentro da luz ao mensageiro sem explicar plenamente a relação; a tradução não resolve essa tensão.
- issue: Sentido cosmológico de “autoridade”
  choice: toda autoridade
  alternative: todo arconte ou toda potestade
  rationale: A opção mais neutra evita importar uma classificação cosmológica específica antes da revisão do texto copta.
- issue: Purificação pelo sangue da virgem
  choice: Formulação preservada literalmente
  alternative: Explicar sacramental, cristológica ou mitologicamente o sangue
  rationale: O testemunho não identifica aqui a virgem nem explicita o mecanismo; a tradução conserva a afirmação sem comentário doutrinário.
- issue: Referente em “Ela apareceu por meio das águas”
  choice: “Ela” em referência provável à semelhança de Pistis Sophia
  alternative: “Isso apareceu” ou omitir o sujeito suprido
  rationale: O testemunho assinala que o verbo estava suprido entre parênteses. O feminino português torna legível a referência contextual mais próxima, enquanto a nota registra a incerteza textual.
- issue: Relação sintática entre terra e Adaman
  choice: '“a terra: o santo Adaman”'
  alternative: Tratar “o santo Adaman” como aposto do mensageiro
  rationale: A tradução acompanha a pontuação e a explicação etimológica do testemunho, mas usa dois-pontos para deixar visível a identificação sem ampliá-la.
