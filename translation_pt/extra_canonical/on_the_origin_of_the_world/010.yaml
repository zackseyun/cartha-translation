  naturalness: O português é claro, moderno e de registro apropriado. “Sentiu profunda vergonha” é natural; “hostes dos céus” mantém o tom cosmológico. A reformulação de “a luz dessa figura” deve ser evitada por fidelidade, não por falta de fluência.
  terminology: “Progenitor Primordial”, “Pronoia”, “semelhança humana”, “autoridade”, “Adão de Luz”, “Adaman” e “Pistis Sophia” são escolhas defensáveis. “Adamantino” preserva o termo interpretativo do testemunho. “Água santa” é preferível a terminologia ritual mais estreita.
