translation:
  language: pt
  text: 'Então o Pai Primordial apresentou aos que habitavam com ele uma opinião a respeito do homem. Em seguida, cada um deles lançou seu sêmen no centro do umbigo da terra.


    A partir daquele dia, os sete arcontes moldaram o homem juntamente com seu corpo, para que se assemelhasse ao corpo deles; sua aparência, porém, se assemelhava à do homem que lhes havia aparecido. Ele foi moldado parte por parte, e o líder deles formou o cérebro e também o sistema nervoso.


    Depois disso, ele apareceu semelhante àquele que existira antes dele. Tornou-se [] um homem dotado de alma e foi chamado Adão, isto é, “Pai”, de acordo com o nome daquele que existira antes dele.[a] Quando terminaram Adão, ele o abandonou como um recipiente sem vida, pois havia tomado forma como um feto abortado, sem espírito dentro de si.


    Quando o arconte principal se lembrou das palavras de Pistis, temeu que o verdadeiro homem entrasse na forma que ele havia moldado e se tornasse senhor dela. Por isso, afastou-se durante quarenta dias da forma que havia moldado; ela então permanecia sem alma. Ele se retirou e a abandonou.


    No quadragésimo dia, Sophia Zoe enviou seu sopro a Adão, que estava sem alma.[b] Ele começou a se mover pelo chão, mas não conseguia ficar em pé.


    Depois, quando os sete arcontes chegaram, viram-no e ficaram profundamente perturbados. Aproximaram-se dele e o agarraram, e ele disse ao sopro que estava dentro dele: “Quem é você? E de onde você veio para cá?”


    O sopro respondeu: “Vim da força do homem para arruinar a obra de vocês.” Ao ouvir isso, eles o glorificaram, porque ele lhes dera alívio do medo e da apreensão em que se encontravam.[c]


    Então chamaram aquele dia de “Descanso”, porque haviam descansado de seu trabalho. Quando viram que Adão conseguia ficar em pé, alegraram-se, pegaram-no e o colocaram dentro do Paraíso; depois, retiraram-se para os seus céus.'
