    reason: Registrar uma ambiguidade relevante sem resolvê-la silenciosamente.
lexical_decisions:
- source_word: Primal Parent
  choice: Pai Primordial
  rationale: Mantém a linguagem parental e a primazia temporal; o contexto posterior associa o nome Adão a “Pai”, favorecendo o masculino sem tornar o título excessivamente técnico.
- source_word: archons
  choice: arcontes
  rationale: Transliteração já estabelecida em português para os governantes cósmicos deste escrito, evitando reduzir o termo a governantes humanos comuns.
- source_word: fashioned / shaping / shaped form
  choice: moldaram / moldado / forma que havia moldado
  rationale: Preserva o motivo artesanal e a repetição lexical do relato.
- source_word: soul
  choice: alma
  rationale: Equivalente tradicional e inteligível, mantido em distinção de “espírito” e “sopro” no texto.
- source_word: spirit
  choice: espírito
  rationale: Preserva a distinção expressa entre a condição de possuir alma e a ausência de espírito.
- source_word: breath
  choice: sopro
  rationale: Mantém a imagem concreta de respiração vital e evita identificá-la automaticamente com “espírito”.
- source_word: Paradise
  choice: Paraíso
  rationale: Equivalente corrente e digno, com inicial maiúscula por funcionar aqui como lugar nomeado.
- source_word: Rest
  choice: Descanso
  rationale: Preserva a explicação etiológica baseada no verbo descansar, sem importar diretamente o termo “sábado”.
theological_decisions:
- issue: Distinção antropológica entre alma, espírito e sopro
  choice: Manter “alma”, “espírito” e “sopro” como termos distintos
  alternative: Harmonizar “sopro” e “espírito” sob um único termo
  rationale: O trecho emprega essas categorias de modo tenso e possivelmente técnico; harmonizá-las eliminaria uma distinção presente na testemunha.
- issue: Identidade do “homem” verdadeiro ou anterior
  choice: Conservar “o homem” sem explicação interpretativa no corpo do texto
  alternative: Identificá-lo como homem celestial, arquétipo ou entidade específica
  rationale: O trecho pressupõe essa figura, mas não a define aqui; a tradução não deve resolver a referência.
- issue: Referente de “eles o glorificaram”
  choice: Preservar o pronome masculino ambíguo
  alternative: Explicitar que glorificaram Adão, o sopro ou o homem
  rationale: A testemunha fornecida não elimina com segurança a ambiguidade do referente.
- issue: Relação entre “Descanso” e tradições sabáticas
  choice: Traduzir literalmente como “Descanso”
  alternative: Traduzir como “Sábado”
  rationale: O texto explica o nome pelo repouso do trabalho; “Sábado” acrescentaria uma identificação religiosa não explicitada nesta passagem.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário internacional. A redação conserva repetições estruturais importantes e termos técnicos indispensáveis, mas evita sintaxe excessivamente calcada no inglês. Como a revisão direta do copta ainda está pendente, decisões finas permanecem provisórias e baseadas na testemunha inglesa pública fornecida.
