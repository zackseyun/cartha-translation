  terminology: «Seres andróginos», «Caos», «Pistis», «Sophia» e «Tártaro» são escolhas apropriadas. «Grandes potestades» é substituído por «grandes autoridades», pois o testemunho não exige a leitura de autoridades como seres celestes. «Filhos» evita a atenuação genealógica de «descendentes».
