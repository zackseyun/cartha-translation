- source_word: androgynous entities
  choice: seres andróginos
  rationale: “Seres” é natural em português e não define além do testemunho a natureza dessas entidades; “andróginos” preserva a combinação de designações masculinas e femininas.
- source_word: Rulership
  choice: Domínio
  rationale: Expressa autoridade governante sem identificar o termo necessariamente com um reino territorial.
- source_word: Kingship
  choice: Realeza
  rationale: Preserva a qualidade ou condição régia, distinguindo-a de “Domínio”.
- source_word: deathless structure
  choice: estrutura imortal
  rationale: Mantém a imagem cosmológica e evita explicar “estrutura” como uma hierarquia específica.
- source_word: great authorities
  choice: grandes potestades
  rationale: “Potestades” conserva o possível sentido de poderes ou autoridades personificados, em vez de reduzi-los a mera autoridade abstrata.
- source_word: by means of verbal articulation
  choice: por meio da palavra
  rationale: Comunica de modo natural a criação realizada pelo ato de falar, sem acrescentar uma fórmula ausente.
- source_word: mischief-maker
  choice: causador de males
  rationale: Reproduz a função nociva da figura sem importar uma identificação teológica não expressa no texto.
- source_word: Tartaros
  choice: Tártaro
  rationale: Emprega a forma portuguesa corrente do nome cosmológico grego.
theological_decisions:
- issue: Relação entre os seres do Caos e a estrutura anterior
  choice: “em conformidade com a estrutura imortal que existia antes delas”
  alternative: “como cópias da ordem imortal anterior”
  rationale: A redação escolhida preserva a noção de correspondência sem transformar explicitamente os seres em cópias nem definir “estrutura” como “ordem”.
- issue: Desejo de Pistis e governo da semelhança
  choice: Manter que “a semelhança [...] governasse até o fim”
  alternative: Explicar que Pistis desejava perpetuar uma imitação inferior
  rationale: O texto afirma governo e semelhança, mas não explicita nessa passagem a avaliação teológica proposta pela alternativa.
- issue: Agente do estabelecimento final
  choice: “estabelecido por meio de Sophia”
  alternative: “firmado pelo poder de Sophia”
  rationale: “Por meio de” conserva a mediação ambígua do testemunho e não acrescenta uma referência explícita ao poder dela.
