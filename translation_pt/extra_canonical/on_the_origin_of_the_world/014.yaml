lexical_decisions:
- source_word: Sophia
  choice: Sofia
  rationale: Emprega a forma portuguesa tradicional do nome grego, preservando sua função como personagem sem reduzi-la ao substantivo abstrato “sabedoria”.
- source_word: Pistis
  choice: Pístis
  rationale: Translitera o nome e acrescenta acento para orientar a pronúncia em português, sem interpretá-lo simplesmente como “fé”.
- source_word: aeon
  choice: éon
  rationale: Mantém o termo cosmológico técnico, que neste contexto designa uma realidade ou domínio, e não apenas um período de tempo.
- source_word: poverty
  choice: pobreza
  rationale: Preserva a formulação e a possível tensão entre qualidade abstrata e potência cosmológica, sem impor personificação por meio de maiúscula.
- source_word: Chaos
  choice: Caos
  rationale: A maiúscula assinala o domínio cosmológico nomeado no texto, e não mera desordem.
- source_word: adornments
  choice: adornos
  rationale: Conserva a repetição cosmológica do testemunho e evita substituir o termo por uma explicação especulativa como “seres” ou “estruturas”.
- source_word: infinity
  choice: infinidade
  rationale: Reproduz a noção espacial indeterminada do testemunho sem transformá-la no nome técnico “Infinito”.
theological_decisions:
- issue: Identidade de Sofia e Pístis
  choice: Manter ambos como nomes próprios transliterados
  alternative: Traduzir como “Sabedoria” e “Fé”
  rationale: A tradução por conceitos portugueses poderia apagar o papel dessas figuras na cosmologia do tratado e sugerir abstrações comuns.
- issue: Natureza da “pobreza”
  choice: Manter “pobreza” em minúscula
  alternative: Usar “Pobreza” como nome de uma entidade ou “deficiência” como interpretação
  rationale: O testemunho fornecido não resolve de modo inequívoco se se trata de uma entidade personificada, condição ou princípio cosmológico.
- issue: Comparação dos seis éons e seus adornos
  choice: Traduzir “os quais eram sete vezes superiores” preservando o referente coletivo potencialmente ambíguo
  alternative: Limitar explicitamente a comparação apenas aos adornos ou apenas aos éons
  rationale: A sintaxe do testemunho permite alguma incerteza quanto ao alcance exato da comparação; a versão não a resolve artificialmente.
- issue: “Sua luz” e o oitavo céu
  choice: Conservar a identificação explicativa “sua luz, isto é, no oitavo céu”
  alternative: Reformular o oitavo céu apenas como destino distinto da luz
  rationale: Mantém a aposição do testemunho e sua tensão cosmológica sem harmonização.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e vocabulário cosmológico preservado. “Conforme desejava” mantém a conexão com o contexto anterior; “subsistem” foi mantido por expressar existência continuada no esquema cosmológico. A tradução é provisória porque se baseia no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente.
