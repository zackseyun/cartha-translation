  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque a revisão direta do copta ainda está pendente; baseia-se no testemunho inglês público fornecido. Mantiveram-se os nomes e termos cosmológicos necessários, com notas breves, bem como as lacunas e ambiguidades reais do testemunho.
