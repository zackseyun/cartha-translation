    text: Os referentes de “seu filho”, “entidade criada”, “senhor”, “Besta” e “Mestre” são difíceis de determinar com segurança neste parágrafo. A tradução conserva essa ambiguidade.
    reason: Evitar uma identificação teológica ou narrativa não assegurada pelo testemunho.
lexical_decisions:
- source_word: authorities
  choice: autoridades
  rationale: Mantém o termo técnico recorrente da literatura gnóstica sem impor a interpretação mais específica “arcontes” onde o testemunho fornecido diz “authorities”.
- source_word: Primal Parent
  choice: Pai Primordial
  rationale: Conserva a relação parental e o caráter originário; o masculino acompanha o pronome subsequente no testemunho.
- source_word: man / human
  choice: ser humano
  rationale: Traduz o sentido genérico com naturalidade moderna; evita restringi-lo indevidamente a um adulto masculino, embora “um homem” também seja possível.
- source_word: aeon
  choice: éon
  rationale: Preserva o termo cosmológico técnico, acompanhado de nota explicativa, em vez de reduzi-lo simplesmente a “era”.
- source_word: forethought
  choice: presciência
  rationale: Expressa a ideia de concepção ou previsão anterior no contexto; “providência” acrescentaria uma conotação teológica não exigida.
- source_word: Pistis / Sophia Zoe
  choice: Pistis / Sofia Zoé
  rationale: Mantém Pistis como nome técnico e translitera Sophia Zoe em forma legível em português, sem apagar o possível sentido de “Fé” e “Sabedoria-Vida”.
- source_word: teacher
  choice: mestre / mestra
  rationale: Usa o termo natural para quem instrui, ajustando o gênero gramatical aos referentes imediatos sem resolver a androginia da figura.
- source_word: androgynous human
  choice: ser humano andrógino
  rationale: Reproduz diretamente a caracterização do texto, sem paráfrase biológica ou doutrinária.
- source_word: cleverest
  choice: mais perspicaz
  rationale: Comunica inteligência aguda sem a carga necessariamente negativa de “astuto”, embora a identidade narrativa permaneça ambígua.
theological_decisions:
- issue: Identidade e fala do Pai Primordial
  choice: Conservar a acusação narrativa de que ele mentiu e a autoproclamação divina
  alternative: Harmonizar a figura com o Deus supremo ou suavizar “mentiu”
  rationale: O texto apresenta deliberadamente uma cosmologia e uma polêmica próprias; a tradução não deve reconciliá-las com outra tradição.
- issue: Antecipação de Sofia Zoé
  choice: Manter que ela fez primeiro “seu próprio ser humano”
  alternative: Identificá-lo explicitamente com Adão, Eva, Cristo ou a serpente
  rationale: O trecho fornecido não explicita de modo inequívoco nenhuma dessas identificações.
- issue: Referentes pronominais no último parágrafo
  choice: Preservar a formulação ambígua com “entidade” e uma nota
  alternative: Determinar dogmaticamente quem é a Besta, o Mestre, o filho ou o senhor
  rationale: O testemunho inglês assinala que a redação final é ambígua e não deve ser harmonizada.
- issue: “Besta” como “Mestre”
  choice: Traduzir a interpretação tal como transmitida
  alternative: Corrigir para uma etimologia ou identificação mais familiar
  rationale: A associação paradoxal pertence ao texto e deve permanecer, mesmo sem explicação filológica segura.
- issue: Forma moldada como receptáculo da luz
  choice: Manter “um lugar que encerrava a luz”
  alternative: Interpretar explicitamente como corpo, prisão ou templo
  rationale: A metáfora permite mais de uma leitura e não deve ser fechada pela tradução.
