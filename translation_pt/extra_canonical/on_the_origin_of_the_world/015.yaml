  naturalness: O português é moderno, claro e de registro apropriado. A revisão proposta elimina a ambiguidade sintática que produzia inversão de sentido, sem resolver ambiguidades intencionais do texto.
  terminology: “Autoridades”, “Pai Primordial”, “éon”, “Pistis”, “Sofia Zoé”, “Sabaoth” e “Besta” são escolhas adequadas. “Previsão de Pistis” traduz “forethought” de modo mais neutro do que “presciência”, que sugere especificamente conhecimento antecipado.
  issues:
  - severity: high
    issue: Inversão do agente em “as entidades criadas que haviam moldado”.
    rationale: O inglês diz “the created entities that [the authorities] had shaped”. A redação portuguesa faz as próprias entidades parecerem o sujeito de “haviam moldado”. Deve-se explicitar que foram moldadas pelas autoridades.
  - severity: low
    issue: “Presciência” restringe “forethought”.
    rationale: “Forethought” pode abranger pensamento, intenção ou planejamento prévio; “presciência” privilegia conhecimento antecipado. “Previsão” conserva melhor a formulação provisória do testemunho.
