translation:
  language: pt
  text: 'Antes que Adão de Luz se recolhesse para dentro do Caos, as autoridades o viram e zombaram do Pai Primordial, porque ele lhes havia mentido ao dizer: “Eu é que sou Deus. Ninguém existiu antes de mim.”


    Quando se aproximaram dele, perguntaram: “Não é este o deus que arruinou nossa obra?”


    Ele respondeu: “Sim. Se vocês querem impedir que ele arruíne nossa obra, venham, façamos da terra um ser humano que nos sirva, segundo a imagem do nosso corpo e segundo a semelhança [a] deste ser. Assim, quando ele contemplar sua própria semelhança, ficará enamorado dela e não arruinará mais nossa obra. Em vez disso, faremos servos para nós dentre os que nascem da luz, por toda a duração deste éon.”[b]


    Tudo isso aconteceu de acordo com a presciência de Pistis,[c] para que o ser humano aparecesse segundo a semelhança dele e os denunciasse por causa da forma que haviam moldado; e a forma moldada por eles tornou-se um lugar que encerrava a luz.


    Então as autoridades obtiveram o conhecimento necessário para criar o ser humano. Sofia Zoé,[d] aquela que habita com Sabaoth, havia previsto o que fariam e zombou da decisão deles, pois são cegos. Agindo contra os próprios interesses, criaram-no em ignorância e não compreenderam o que estavam prestes a realizar.


    Ela se antecipou a eles e fez primeiro seu próprio ser humano, para que ele pudesse ensinar à forma que eles haviam moldado a odiá-los e, assim, escapar deles.


    O mestre veio a existir da seguinte maneira: quando Sofia deixou descer uma gotícula de luz, ela fluiu sobre a água, e imediatamente apareceu um ser humano andrógino. Primeiro, ela moldou aquela gotícula como um corpo feminino. Depois, servindo-se desse corpo, moldou-a à semelhança da mãe que havia aparecido anteriormente e a completou no decorrer de doze meses.


    Havia sido produzido um ser humano andrógino, a quem os gregos chamam Hermafrodita, e cuja mãe os hebreus chamam Eva de Zoé, isto é, a mestra da vida. Seu filho é a entidade criada que é senhor. Mais tarde, as autoridades [e] chamaram essa entidade de “a Besta”, para que ela pudesse desencaminhar as entidades criadas que haviam moldado. A interpretação de “a Besta” é “o Mestre”, pois se constatou que era o mais perspicaz de todos os seres.[f]'
