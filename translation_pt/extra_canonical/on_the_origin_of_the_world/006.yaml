lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: Pistis / Pistis Sophia
  rationale: Mantém os nomes técnicos do tratado, sem reduzir Pistis a “Fé” nem Sophia a “Sabedoria”, o que poderia transformar personagens cosmológicas em abstrações.
- source_word: deathless man
  choice: homem imortal
  rationale: Expressão natural em português que conserva a referência antropológica e a ausência de morte; “imperecível” seria possível, mas menos direto.
- source_word: hosts of Chaos / Lord of Hosts
  choice: exércitos do Caos / Senhor dos Exércitos
  rationale: Preserva a repetição semântica e a provável alusão titulária. “Hostes” seria mais formal, porém menos corrente para leitores modernos.
- source_word: authorities
  choice: autoridades
  rationale: Conserva o termo cosmológico sem o substituir interpretativamente por “potestades” ou “governantes”.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Mantém a ideia de origem parental sem impor gênero ao referente; “Pai Primordial” resolveria uma ambiguidade não resolvida pelo testemunho.
- source_word: dwelling-place of rest
  choice: lugar de repouso
  rationale: Tradução clara que preserva o sentido espacial e soteriológico sem acrescentar “eterno” ou outra qualificação ausente.
- source_word: repentance
  choice: arrependimento
  rationale: Equivalente português direto, mantendo a tensão entre mudança de lealdade e recompensa sem explicação doutrinária adicional.
- source_word: Zoe
  choice: Zoe
  rationale: Conserva o nome da personagem; traduzi-lo no corpo como “Vida” poderia apagar seu caráter nominal.
- source_word: Cherubin / Seraphin
  choice: Cherubin / Seraphin
  rationale: Preserva as formas nominais específicas do testemunho, em vez de normalizá-las silenciosamente como os plurais bíblicos portugueses “querubins” e “serafins”.
theological_decisions:
- issue: A condenação dos pais de Sabaoth
  choice: “condenou seu pai [e sua mãe]” com sinal de lacuna
  alternative: “rejeitou seu pai e sua mãe” sem colchetes
  rationale: Mantém tanto a força do testemunho quanto a incerteza textual, sem decidir se a mãe constava integralmente no texto.
- issue: Relação hierárquica do reino de Sabaoth
  choice: “o reino que está acima de todos” e “acima dos doze deuses”
  alternative: “reino sobre todos” e “governasse os doze deuses”
  rationale: Preserva a imagem espacial da cosmologia e não transforma automaticamente superioridade espacial em uma formulação política mais definida.
- issue: Identidade do pensamento do Progenitor Primordial
  choice: mantida como “sua irmã, o pensamento do Progenitor Primordial”
  alternative: explicitar que a irmã é uma entidade feminina ou identificar seu nome
  rationale: O testemunho associa os termos, mas não oferece neste trecho base suficiente para uma identificação doutrinária adicional.
- issue: Contagem de setenta e dois
  choice: “Ao todo, são setenta e dois”, com nota explicativa
  alternative: “Todas as figuras somam setenta e dois”
  rationale: A redação recebida passa de sessenta e quatro figuras a sete arcanjos e Sabaoth como oitavo. A tradução evita dizer que as próprias figuras mudam de sessenta e quatro para setenta e duas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi moderadamente descompactada, mas as relações cosmológicas, as repetições relevantes e as ambiguidades foram preservadas. Nomes técnicos greco-coptas foram mantidos. Este rascunho se baseia no testemunho público em inglês fornecido; a revisão direta do copta ainda está pendente.
