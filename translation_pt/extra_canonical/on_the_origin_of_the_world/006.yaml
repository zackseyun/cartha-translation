review_pass:
  verdict: revise
  source_fidelity: O rascunho acompanha de perto o testemunho inglês fornecido e preserva adequadamente a cosmologia, os nomes técnicos e as dificuldades numéricas. Contudo, a expressão inglesa “All the forms have the sum of seventy-two” foi substituída por “Ao todo, são setenta e dois”, o que elimina o referente expresso (“as figuras/formas”) e resolve indevidamente uma dificuldade do texto. A redação deve conservar a formulação difícil e explicá-la em nota.
  naturalness: 'O português é claro, moderno e de registro adequado. Ajustes pontuais tornam a passagem mais natural sem reduzir sua estranheza textual: “assentado sobre” pode ser “que se erguia sobre”, e “permanecem diante” pode ser “estão diante”, mais próximo do sentido descritivo do testemunho.'
  terminology: A manutenção de Pistis, Pistis Sophia, Sabaoth, Yaldabaoth e Zoe é apropriada. “Cherubin” e “Seraphin” podem ser mantidos como formas técnicas do testemunho, com as notas explicativas. “Autoridades”, “Caos”, “Abismo” e “Progenitor Primordial” são escolhas defensáveis e não impõem interpretação confessional.
  issues:
  - severity: medium
    issue: A frase sobre o total de setenta e dois não preserva o sujeito textual.
    rationale: O testemunho diz literalmente que “todas as formas” totalizam setenta e duas, embora tenha acabado de indicar sessenta e quatro e de mencionar sete arcanjos e Sabaoth. “Ao todo, são setenta e dois” harmoniza a passagem por paráfrase e encobre a tensão textual; deve-se manter “Todas as figuras, ao todo, somam setenta e duas”, com nota.
  - severity: low
    issue: A nota sobre a primeira lacuna usa “há uma lacuna” após uma restauração entre colchetes, mas pode distinguir melhor os dois sinais.
    rationale: 'O testemunho apresenta “[and mother] []”: uma restauração e, depois, uma lacuna separada. A nota revisada explicita essa sequência sem inferir a extensão do material perdido.'
  revised_text: 'Quando Sabaoth, filho de Yaldabaoth, ouviu a voz de Pistis, cantou louvores a ela. Por ordem de Pistis, condenou seu pai [e sua mãe] [...][a] e a louvou porque ela lhes havia ensinado a respeito do homem imortal e de sua luz. Então Pistis Sophia apontou o dedo e derramou sobre ele um pouco da luz de sua própria luz, como condenação de seu pai. Quando Sabaoth foi iluminado, recebeu grande autoridade sobre todos os exércitos do Caos. Desde aquele dia, ele é chamado “Senhor dos Exércitos”.


    Ele desprezou seu pai, a Escuridão, e sua mãe, o Abismo. Odiou sua irmã, o pensamento do Progenitor Primordial, que se movera de um lado para outro sobre as águas. Por causa da luz de Sabaoth, todas as autoridades do Caos ficaram com ciúme dele e, tomadas de inquietação, travaram uma grande guerra nos sete céus.


    Quando Pistis Sophia viu a guerra, enviou de sua luz sete arcanjos a Sabaoth. Eles o levaram ao sétimo céu e estavam diante dele como servidores. Ela também lhe enviou mais três arcanjos e estabeleceu para ele o reino que está acima de todos, para que habitasse acima dos doze deuses do Caos.


    Quando Sabaoth recebeu o lugar de repouso como recompensa por seu arrependimento, Pistis também lhe deu sua filha Zoe, juntamente com grande autoridade, para que ela o ensinasse a respeito de tudo o que existe no oitavo céu. Como possuía autoridade, antes de qualquer outra coisa ele construiu para si um palácio. O palácio é imenso e magnífico, sete vezes maior que todos os que existem nos sete céus. Diante de [...] seu palácio[b], ele criou um trono imenso, que se erguia sobre um carro de quatro faces chamado “Cherubin”.[c]


    Os Cherubin têm oito figuras em cada um dos quatro cantos: figuras de leões, de bezerros, de seres humanos e de águias, de modo que todas as figuras somam sessenta e quatro. Sete arcanjos estão diante dele. Sabaoth é o oitavo e possui autoridade. Todas as figuras, ao todo, somam setenta e duas.[d] Além disso, foi desse carro que os setenta e dois deuses receberam sua forma, para que governassem as setenta e duas línguas das nações. Junto àquele trono, Sabaoth também criou anjos semelhantes a serpentes, chamados “Seraphin”,[e] que o glorificam continuamente.'
