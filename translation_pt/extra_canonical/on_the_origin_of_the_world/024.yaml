base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: pt
  text: 'Voltemos aos arcontes de que falamos anteriormente, para que possamos explicá-los.


    Quando os sete arcontes foram lançados de seus céus para a terra, criaram para si muitos anjos demoníacos, a fim de servi-los. Esses anjos ensinaram à humanidade várias formas de erro, magia, poções, culto aos ídolos, derramamento de sangue, altares, templos, sacrifícios e libações a todos os demônios terrenos. Eles cooperavam com o Destino, que veio a existir mediante o acordo entre os deuses da injustiça e da justiça. Assim, depois que o mundo veio a existir, desviou-se e permaneceu em contínua confusão, pois todos os seres humanos sobre a terra adoravam demônios, desde a criação até a consumação da era — tanto os anjos da justiça como os seres humanos da injustiça.[a]


    Desse modo, o mundo veio a existir em confusão, ignorância e torpor. Todos haviam se desviado, até o aparecimento do homem verdadeiro.


    Que isso seja suficiente quanto ao assunto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A relação gramatical da expressão “tanto os anjos da justiça como os seres humanos da injustiça” com o restante da frase é incerta no testemunho disponível.
    reason: Preserva uma ambiguidade reconhecida na fonte de consulta e evita determinar indevidamente quem adora ou quem é adorado.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para as potências governantes deste escrito, sem reduzi-lo ao sentido genérico de governantes.
- source_word: demonic angels
  choice: anjos demoníacos
  rationale: Preserva a combinação incomum do testemunho e distingue esses seres tanto dos arcontes quanto dos demônios terrenos.
- source_word: potions
  choice: poções
  rationale: Reproduz a categoria do testemunho sem especificar indevidamente se eram medicamentos, venenos ou preparados mágicos.
- source_word: drink offerings
  choice: libações
  rationale: Termo corrente e preciso para ofertas rituais de líquidos.
- source_word: fate
  choice: o Destino
  rationale: A inicial maiúscula sinaliza que o texto trata o Destino como uma realidade personificada que veio a existir e cooperava com outros agentes.
- source_word: stupor
  choice: torpor
  rationale: Expressa um estado de insensibilidade ou entorpecimento sem introduzir a ideia moderna de simples surpresa.
- source_word: true man
  choice: homem verdadeiro
  rationale: Mantém a expressão antropológica e potencialmente titular do texto sem interpretá-la como referência denominacional específica.
theological_decisions:
- issue: Relação sintática da frase final sobre os anjos da justiça e os seres humanos da injustiça
  choice: Manter as duas categorias após um travessão e acrescentar nota de ambiguidade
  alternative: Fazer das duas categorias, de maneira inequívoca, os adoradores ou os demônios adorados
  rationale: O testemunho fornecido declara que a cláusula é gramaticalmente ambígua; a tradução não deve resolver silenciosamente se essas categorias são sujeito, complemento ou explicação da afirmação anterior.
- issue: Personificação do Destino
  choice: Traduzir como “o Destino”
  alternative: Usar “o destino” como conceito impessoal
  rationale: O texto atribui ao Destino origem e cooperação, favorecendo a leitura personificada, sem afirmar além disso uma identidade teológica específica.
- issue: Identidade do “homem verdadeiro”
  choice: Conservar a designação sem identificar seu referente
  alternative: Explicitar uma identificação cristológica ou mitológica
  rationale: O trecho isolado não explicita a identidade, e a tradução deve preservar essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se termos técnicos necessários, como “arcontes” e “libações”. A redação é provisoriamente baseada no testemunho inglês de domínio público fornecido, pois a revisão direta do copta ainda está pendente.
