review_pass:
  verdict: revise
  source_fidelity: 'Revisão baseada no testemunho inglês fornecido, pois a revisão direta do copta continua pendente. A principal correção necessária é preservar sem acréscimo a sequência textual incerta “[following] []”: o rascunho introduzia “do” e um “[a]” que não correspondem ao testemunho. Também se ajusta “presciência”, que tende a significar previsão, para “pensamento prévio”, e “condenaria” para “censuraria”, mais próximo de “censure”.'
  naturalness: O texto revisto mantém registro moderno e legível, mas conserva a estranheza cosmológica e sintática relevante do escrito. “Habilidades técnicas” soa mais natural e corresponde ao plural do inglês.
  terminology: “Arconte”, “autoridades”, “Progenitor Primordial”, “Mãe Primordial”, “formas moldadas”, “espírito”, “alma” e “homem da Lei” são preservados. “Pensamento prévio” traduz provisoriamente “forethought” sem a especificidade indevida de “presciência”.
  issues:
  - severity: medium
    issue: A sequência de colchetes relativa ao Dia de Descanso foi alterada.
    rationale: O testemunho lê “[following] [] the lowly Rest-Day”. “[depois do] [a] humilde” acrescenta conteúdo gramatical e converte indevidamente o segundo sinal textual em âncora de nota. A incerteza deve permanecer visível.
  - severity: medium
    issue: “Presciência” para “forethought”.
    rationale: Em português, “presciência” normalmente denota conhecimento antecipado; “forethought” no testemunho é mais amplamente pensamento, deliberação ou desígnio anterior. “Pensamento prévio” é mais neutro.
  - severity: low
    issue: “Condenaria” intensifica “censure”.
    rationale: “Censurar” preserva o verbo do testemunho sem introduzir o sentido judicial mais forte de “condenar”.
  revised_text: 'Ela primeiro ficou grávida de Abel, por obra do primeiro arconte. Pelas sete autoridades e seus anjos, ela teve os outros filhos. Tudo aconteceu de acordo com o pensamento prévio do Progenitor Primordial, para que a Mãe Primordial pudesse trazer dentro de si toda semente, misturada e unida ao destino do universo e às suas estruturas. Um plano previamente concebido pela Justiça foi posto em ação a respeito de Eva: as formas moldadas das autoridades se tornariam lugares para encerrar a luz, nos quais ela as censuraria por meio de suas formas moldadas.



    O Adão Primordial, que é da Luz, é dotado de espírito e apareceu no primeiro dia. O segundo Adão é dotado de alma e apareceu no sexto dia, chamado “Afrodite”. O terceiro Adão é um ser criado da terra, isto é, o homem da Lei. Ele apareceu no oitavo dia, chamado “Dia do Sol”, [seguindo] [] o humilde Dia de Descanso. Os descendentes do Adão terreno se multiplicaram e encheram a terra; e, de dentro de si mesmos, produziram toda espécie de habilidades técnicas possuídas pelo Adão dotado de alma. Contudo, todos viviam na ignorância.'
  revised_footnotes: []
  revision_rationale: 'A revisão elimina a âncora espúria e preserva literalmente os dois níveis de incerteza indicados pelos colchetes no testemunho de base. Ajusta ainda dois termos que poderiam deslocar o sentido: “forethought” não exige “presciência”, e “censure” não exige “condenar”. Nenhuma identificação doutrinária ou harmonização cosmológica foi introduzida.'
