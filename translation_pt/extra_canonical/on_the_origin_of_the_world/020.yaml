base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: pt
  text: 'Ela primeiro ficou grávida de Abel, por obra do primeiro arconte. Pelas sete autoridades e seus anjos, teve os outros filhos. Tudo aconteceu de acordo com a presciência do Progenitor Primordial, para que a Mãe Primordial pudesse levar dentro de si toda semente, misturada e unida ao destino do universo e às suas estruturas. Então foi posto em ação, a respeito de Eva, um plano previamente concebido pela Justiça: as formas moldadas das autoridades se tornariam lugares que encerrariam a luz, e, por meio dessas formas, a luz as condenaria.


    O Adão Primordial, que é da Luz, é dotado de espírito e apareceu no primeiro dia. O segundo Adão é dotado de alma e apareceu no sexto dia, chamado “Afrodite”. O terceiro Adão é um ser criado da terra, isto é, o homem da Lei. Ele apareceu no oitavo dia, chamado “Dia do Sol”, [depois do] [a] humilde Dia de Descanso. Os descendentes do Adão terreno se multiplicaram e encheram a terra; e, de dentro de si mesmos, produziram toda espécie de habilidade técnica que o Adão dotado de alma possuía. Contudo, todos viviam na ignorância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho inglês assinala aqui uma restauração (“depois do”) seguida de uma lacuna ou sinal textual vazio. A redação e a pontuação devem ser revistas diretamente no copta.
    reason: Preservar a incerteza textual indicada pelos colchetes do testemunho de base.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Mantém o termo técnico tradicional para as potências governantes deste escrito, sem reduzi-lo simplesmente a “governante” ou “chefe”.
- source_word: forethought
  choice: presciência
  rationale: Expressa a concepção de pensamento ou desígnio anterior; a tradução permanece provisória porque falta revisão direta do copta.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Preserva a anterioridade e evita impor gênero onde a designação inglesa permite maior amplitude.
- source_word: shaped forms
  choice: formas moldadas
  rationale: Conserva a ideia de formas produzidas ou configuradas, relevante para sua função como receptáculos da luz.
- source_word: imbued with spirit / soul
  choice: dotado de espírito / dotado de alma
  rationale: Mantém o paralelismo e distingue claramente os dois tipos de Adão sem explicar além do texto.
- source_word: Sun-Day / Rest-Day
  choice: Dia do Sol / Dia de Descanso
  rationale: Traduz os nomes de modo transparente e preserva o contraste calendárico do testemunho.
- source_word: technological skills
  choice: habilidade técnica
  rationale: Usa expressão moderna compreensível sem sugerir necessariamente tecnologia industrial contemporânea.
theological_decisions:
- issue: Agente da condenação das autoridades
  choice: “a luz as condenaria”
  alternative: “ele/isso as censuraria” ou “ela os condenaria”
  rationale: O antecedente mais provável no testemunho é “a luz”; a formulação explicita essa leitura, mas continua condicionada à futura conferência do copta.
- issue: Relação entre Eva e as autoridades
  choice: Preservar que os filhos vieram “pelas” autoridades e seus anjos
  alternative: Explicitar uma relação sexual ou causal mais específica
  rationale: O testemunho não fornece detalhe suficiente para resolver a natureza exata dessa agência.
- issue: Três figuras de Adão
  choice: Manter as categorias espírito, alma e terra como distinções textuais
  alternative: Harmonizá-las com uma antropologia confessional posterior
  rationale: A tradução conserva a cosmologia própria do documento sem importar doutrina denominacional.
- issue: Expressão “homem da Lei”
  choice: Tradução literal e não interpretativa
  alternative: Identificá-lo com uma figura religiosa ou tradição específica
  rationale: A identificação permanece aberta no trecho e não deve ser resolvida silenciosamente.
translation_notes:
  register: Português atual, digno e acessível, com terminologia técnica preservada onde ela é importante para a cosmologia do escrito. Rascunho provisório baseado no testemunho inglês de domínio público; a revisão direta do copta e dos manuscritos relacionados continua pendente.
