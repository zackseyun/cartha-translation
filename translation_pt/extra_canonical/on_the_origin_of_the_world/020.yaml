review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha adequadamente o testemunho inglês provisório e preserva a cosmologia e as distinções entre os três Adões. Contudo, «presciência» estreita «forethought» para conhecimento antecipado, enquanto o contexto também requer a noção de desígnio ou deliberação prévia. A representação dos colchetes após «Dia do Sol» deve conservar de modo mais exato a restauração e a lacuna do testemunho.
  naturalness: 'O texto é em geral claro e de registro apropriado. Ajustes pontuais melhoram a fluência: «concebeu Abel» é mais natural do que «ficou grávida de Abel», e «todo tipo de habilidade técnica» reproduz melhor o plural abrangente de «all kinds of technological skills».'
  terminology: «Arconte», «Mãe/Progenitor Primordial», «formas moldadas», «espírito», «alma» e «homem da Lei» são escolhas adequadas e não impõem interpretações confessionais. «Previsão» é preferível a «presciência» para «forethought», pois mantém o valor de intenção/desígnio antecipado sem o reduzir a mera onisciência.
  issues:
  - severity: medium
    issue: «presciência» para «forethought»
    rationale: «Presciência» normalmente denota conhecimento prévio. O testemunho fala de uma deliberação, previsão ou desígnio anterior; «previsão» preserva melhor essa amplitude.
  - severity: medium
    issue: Representação da restauração e da lacuna textual
    rationale: O rascunho introduz «[a]», que não corresponde ao segundo conjunto vazio de colchetes do testemunho. Deve manter «[depois] []» e ligar a nota ao sinal de lacuna.
  - severity: low
    issue: Formulação de «all kinds of technological skills»
    rationale: «Toda espécie de habilidade técnica» é gramaticalmente possível, mas «todo tipo de habilidades técnicas» representa mais naturalmente a pluralidade do testemunho.
  revised_text: 'Ela primeiro concebeu Abel, pelo primeiro arconte. Pelas sete autoridades e seus anjos, ela teve os outros filhos. Tudo aconteceu de acordo com a previsão do Progenitor Primordial, para que a Mãe Primordial pudesse trazer dentro de si cada semente, misturada e unida ao destino do universo e às suas estruturas. E foi posto em ação, a respeito de Eva, um plano previamente concebido pela Justiça: as formas moldadas das autoridades se tornariam lugares para encerrar a luz, e, por meio de suas formas moldadas, a luz as condenaria.



    O Adão Primordial, que é da Luz, é dotado de espírito e apareceu no primeiro dia. O segundo Adão é dotado de alma e apareceu no sexto dia, chamado «Afrodite». O terceiro Adão é um ser criado da terra, isto é, o homem da Lei. Ele apareceu no oitavo dia, chamado «Dia do Sol», [depois] []ᵃ o humilde Dia de Descanso. Os descendentes do Adão terreno se multiplicaram e encheram a terra e, de dentro de si mesmos, produziram todo tipo de habilidades técnicas que o Adão dotado de alma possuía. Contudo, todos viviam na ignorância.'
  revised_footnotes:
  - marker: a
    text: O testemunho inglês preserva uma restauração, «[depois]», seguida de uma lacuna ou sinal textual não preenchido, «[]». A relação sintática exata com «o humilde Dia de Descanso» requer verificação direta no copta e nos manuscritos relacionados.
    reason: Preserva tanto a restauração quanto a lacuna indicadas no testemunho de base, sem acrescentar palavras não atestadas.
  revision_rationale: A revisão substitui um termo excessivamente específico para «forethought», aperfeiçoa algumas formulações idiomáticas e, sobretudo, corrige a apresentação dos sinais editoriais após «Dia do Sol». Mantém-se a ambiguidade quanto à agência das autoridades, a função das formas moldadas e a cosmologia do escrito, pendentes de revisão direta do copta.
