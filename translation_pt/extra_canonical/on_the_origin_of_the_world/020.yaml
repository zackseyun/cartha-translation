source:
  text: 'She first became pregnant with Abel, by the first archon, and by the seven authorities and their angels she had the other children, and everything transpired in agreement with the forethought of the Primal Parent, in order that the Primal Mother could bear every seed inside her, being mixed and joined to the destiny of the universe and its structures, and a plan designed beforehand by Justice was set in motion regarding Eve, namely, that the shaped forms of the authorities would become places to enclose the light, at which it would censure them through their shaped forms.


    The Primal Adam, of Light, is imbued with spirit, and he appeared on the first day. The second Adam is imbued with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created entity of the earth, namely, the man of the Law, and he appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day, and the descendants of the earthly Adam multiplied and filled the earth, and from inside them they made all kinds of technological skills possessed by the Adam imbued with soul. However, all of them dwelt in ignorance.'
