    reason: Preserva o sinal textual do testemunho fornecido sem inserir uma letra ou palavra não atestada.
  revision_rationale: 'É necessária uma correção segura para preservar fielmente a lacuna do testemunho: a letra «a» não deve figurar dentro dos colchetes. Foram feitos apenas ajustes estilísticos e semânticos de baixo impacto que tornam o português mais natural e refletem melhor o texto inglês de controle, sem resolver ambiguidades nem impor leitura doutrinária. Como o material de partida é um testemunho inglês e a revisão direta do copta está pendente, a avaliação de fidelidade é necessariamente provisória.'
