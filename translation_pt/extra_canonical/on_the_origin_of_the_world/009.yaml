base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: pt
  text: 'Depois de ver nas águas a imagem de Pístis, o Pai Primordial ficou profundamente entristecido, sobretudo ao ouvir a voz dela, que se parecia com a primeira voz que o havia chamado do meio das águas. Ele gemeu ao perceber que era ela quem lhe havia dado um nome. Envergonhou-se de seu pecado e, quando soube com certeza que um homem de luz, imortal, existia antes dele, ficou profundamente perturbado. Isso porque antes havia declarado a todos os deuses e aos anjos deles: “Eu sou aquele que é Deus. Além de mim, nada mais existe.” Ele temia que descobrissem que outro existia antes dele e o denunciassem.


    Ele, porém, sem discernimento, riu da possibilidade de ser denunciado e agiu de modo precipitado. Disse: “Se [a] algo existia antes de mim, que venha à frente, para que vejamos sua luz.” E imediatamente, vejam! Uma luz saiu do oitavo céu, acima, e atravessou todos os céus da terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O espaço entre colchetes representa uma lacuna ou um ponto de restauração incerta no testemunho manuscrito.
    reason: Sinalizar de modo transparente o dano ou a incerteza textual preservados no texto-fonte fornecido.
lexical_decisions:
- source_word: Pistis
  choice: Pístis
  rationale: Mantém como nome próprio a figura personificada, com acento que favorece a pronúncia em português, em vez de traduzir automaticamente por “Fé”.
- source_word: Primal Parent
  choice: Pai Primordial
  rationale: Expressa a função parental masculina indicada pelo contexto e conserva a ideia de primazia/origem sem recorrer a terminologia denominacional.
- source_word: deathless man of light
  choice: um homem de luz, imortal
  rationale: Preserva os dois elementos semânticos — homem luminoso e ausência de morte — em formulação natural e digna.
- source_word: denounce
  choice: denunciar
  rationale: Mantém a possibilidade de acusação ou exposição pública presente no testemunho, sem especificar uma autoridade não mencionada.
- source_word: eighth heaven
  choice: oitavo céu
  rationale: Conserva literalmente a cosmologia própria do escrito.
- source_word: heavens of the earth
  choice: céus da terra
  rationale: Retém a expressão incomum e potencialmente significativa do testemunho em vez de normalizá-la como “céus” ou “firmamentos”.
theological_decisions:
- issue: A alegação de divindade exclusiva do Pai Primordial
  choice: “Eu sou aquele que é Deus. Além de mim, nada mais existe.”
  alternative: “Eu sou Deus, e não existe nenhum outro além de mim.”
  rationale: A formulação escolhida conserva a ênfase e a estranheza do testemunho, sem harmonizá-la com fórmulas bíblicas mais conhecidas.
- issue: A preexistência do homem de luz
  choice: “um homem de luz, imortal, existia antes dele”
  alternative: “o Homem imortal de luz já existia antes dele”
  rationale: O artigo indefinido preserva a apresentação do testemunho fornecido e evita transformar a expressão, sem apoio suficiente, em título técnico.
- issue: Referente de “she”
  choice: Pístis é tratada no feminino
  alternative: Evitar pronomes marcados por gênero
  rationale: O testemunho identifica explicitamente a figura por pronome feminino; a tradução conserva essa personificação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é narrativo e digno, com períodos moderadamente simplificados para clareza. Mantiveram-se a cosmologia, as tensões teológicas e a lacuna textual do testemunho. Como a revisão direta do copta ainda está pendente, as decisões são provisórias e se baseiam no testemunho inglês público fornecido.
