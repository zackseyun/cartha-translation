  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: pt
  text: 'Depois que a forma natural dos seres imortais terminou de se desenvolver a partir do infinito, emanou de Pistis uma imagem chamada Sophia. Ela exerceu sua vontade e tornou-se um ser criado semelhante à luz primordial. Imediatamente, sua vontade manifestou-se à semelhança do céu, com uma dimensão incompreensível, situada entre os seres imortais e os seres que vieram à existência depois, assemelhando-se a [. . .].[a] Ela agia como um véu que separava a humanidade dos seres de cima.


    Ora, o éon da Verdade não tem sombra exterior, porque a luz infinita habita em toda parte dentro dele. Seu exterior, porém, é uma sombra chamada “Trevas”. Dela surgiu uma hoste que governava sobre as trevas, e as hostes que vieram à existência depois chamaram essa sombra de “Caos Infinito”. Dela, todo tipo de divindade irrompeu para o alto [. . .] juntamente com todo o lugar, de modo que a sombra veio depois do primeiro [] ser criado.[b] Ela apareceu <dentro> do Abismo, originando-se da Pistis mencionada anteriormente.[c]


    Então a sombra percebeu que existia algo mais poderoso do que ela e tornou-se invejosa. Quando ficou grávida por sua própria vontade, deu imediatamente à luz o ciúme. Desde aquele dia, tornou-se evidente a lei do ciúme que prevalece entre todos os éons e seus mundos. Esse ciúme, porém, mostrou ser um feto abortado, sem espírito algum dentro de si. Veio à existência como uma sombra dentro de uma imensa substância aquosa. Em seguida, a bílis que havia surgido da sombra foi lançada numa região do Caos.


    Desde aquele dia, uma substância aquosa tornou-se evidente, e aquilo que afundou dentro dela jorrou para longe, embora permanecesse visível no Caos. Assim como acontece com uma mulher que dá à luz uma criança, quando toda a matéria acumulada nela jorra para fora, assim também a matéria veio à existência a partir de uma sombra e foi impelida para longe dela, mas não saiu do Caos.


    A manifestação de Yaldabaoth


    Em vez disso, a matéria permaneceu no Caos, habitando numa de suas regiões. Depois que essas coisas aconteceram, Pistis chegou e manifestou-se acima da matéria do Caos, que havia sido expelida como um feto abortado, pois nenhum espírito habitava nela; ela era inteiramente trevas infinitas e água sem fundo. Quando Pistis viu o que havia resultado de sua deficiência, ficou perturbada. Sua perturbação manifestou-se como um ser criado e assustador, que correu em sua direção no Caos. Ela voltou-se para ele e soprou em seu rosto dentro do Abismo, que se encontra abaixo de [] todos os céus.[d] Quando Pistis Sophia quis que o ser sem espírito fosse formado segundo uma imagem e governasse sobre a matéria e sobre todas as hostes dela, manifestou-se pela primeira vez, saindo das águas, um arconte andrógino semelhante a um leão. Ele possuía grande autoridade em si mesmo e não sabia de onde havia vindo.


    Enquanto Pistis Sophia o observava mover-se nas profundezas aquosas, disse-lhe: “Filho, passa para cá”, o que equivale a yalda-baoth.[e] Desde aquele dia, manifestou-se a lei da fala articulada, que se estendeu aos deuses, aos anjos e à humanidade. E aquilo que veio à existência por meio da fala articulada foi levado à plenitude pelos deuses, pelos anjos e pela humanidade.


    Ora, o arconte Yaltabaoth não conhecia o poder de Pistis. Ele não via o rosto dela, mas via na água a imagem que falava com ele. Por causa daquela voz, chamou a si mesmo de “Yald<ab>aoth”.[f] Os perfeitos, porém, o chamam de “Ariael”, porque ele se assemelhava a um leão.[g]


    Depois que ele obteve autoridade sobre a matéria, Pistis Sophia retirou-se para o alto, para dentro de sua luz.'
