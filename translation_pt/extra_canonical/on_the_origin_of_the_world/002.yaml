    reason: Evitar que a sintaxe portuguesa oculte a incerteza manuscrita.
  - marker: e
    text: A forma “yalda-baoth” é apresentada pelo próprio texto como equivalente à frase anterior. Sua forma segmentada foi preservada.
    reason: Manter a explicação etimológica interna e a grafia específica do testemunho.
  - marker: f
    text: Os sinais angulares em “Yald<ab>aoth” marcam letras restauradas editorialmente. O trecho também emprega as variantes “Yaldabaoth”, “Yaltabaoth” e “yalda-baoth”.
    reason: Preservar e explicar as variantes e a restauração textual.
  - marker: g
    text: “Ariael” é mantido conforme o testemunho; o texto relaciona esse nome à aparência leonina do arconte.
    reason: Evitar normalização para outra forma nominal ou etimologia não demonstrada.
lexical_decisions:
- source_word: Sophia / Pistis
  choice: Sophia / Pistis
  rationale: Os nomes gregos personificados foram transliterados, preservando a terminologia própria da obra e evitando substituí-los interpretativamente por “Sabedoria” e “Fé” no corpo do texto.
- source_word: aeon
  choice: éon
  rationale: Mantém o termo cosmológico técnico, mais preciso aqui do que “era” ou “eternidade”.
- source_word: host
  choice: hoste
  rationale: Expressa um conjunto organizado de poderes ou seres e conserva a ambiguidade quanto à sua natureza exata.
- source_word: archon
  choice: arconte
  rationale: Preserva o título técnico de governante cósmico sem assimilá-lo a categorias teológicas posteriores.
- source_word: likeness
  choice: imagem / semelhança
  rationale: 'A tradução varia conforme a sintaxe portuguesa: “imagem” quando a entidade ou reflexo é focalizado, e “semelhança” na construção comparativa; não se impõe uma distinção técnica ausente no testemunho fornecido.'
- source_word: verbal articulation / articulate speech
  choice: fala articulada
  rationale: Comunica a produção de linguagem verbal inteligível sem restringir o sentido a mera pronúncia.
- source_word: defect
  choice: deficiência
  rationale: Retém o juízo cosmológico do texto sem ampliá-lo para “pecado”, “erro moral” ou outra interpretação doutrinária.
- source_word: androgynous
  choice: andrógino
  rationale: Reproduz diretamente a caracterização do arconte sem suavização.
theological_decisions:
- issue: Identidade e significado de Pistis Sophia
  choice: Manter “Pistis Sophia” como nome/título sem explicação dogmática no texto
  alternative: Traduzir como “Fé-Sabedoria” ou identificar as duas figuras como uma única entidade em todas as ocorrências
  rationale: O trecho alterna “Pistis”, “Sophia” e “Pistis Sophia”; preservar as formas mantém a tensão e evita resolver sua relação além do testemunho.
- issue: Natureza dos seres celestes
  choice: Usar termos genéricos como “seres”, “hostes” e “divindade”
  alternative: Classificá-los como anjos, demônios ou deuses falsos
  rationale: O texto só especifica “deuses” e “anjos” em determinado ponto; categorias confessionais adicionais seriam importadas.
- issue: Ausência de espírito na matéria e no feto abortado
  choice: Traduzir literalmente “sem espírito”
  alternative: Interpretar como inerentemente mau, sem alma ou sem Espírito Santo
  rationale: A formulação conserva a antropologia e cosmologia próprias do documento sem harmonização externa.
- issue: A deficiência de Pistis
  choice: Preservar “o que havia resultado de sua deficiência”
  alternative: Explicar como queda, pecado ou criação involuntária
  rationale: O testemunho não define plenamente a natureza da deficiência; a ambiguidade deve permanecer.
- issue: Origem da autoridade de Yaldabaoth
  choice: Dizer que ele possuía autoridade e depois a obteve sobre a matéria
  alternative: Afirmar que Pistis lhe concedeu formalmente toda autoridade
  rationale: A redação mantém a sequência narrativa e a possível tensão entre a vontade de Pistis, a manifestação do arconte e a aquisição de domínio.
