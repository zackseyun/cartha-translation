  register: Português moderno, digno e legível, com preferência por sintaxe clara e vocabulário cosmológico técnico quando necessário. A tradução é provisória porque a revisão direta do copta ainda está pendente; baseia-se no testemunho inglês público fornecido. Lacunas, elipses e restaurações editoriais foram preservadas, e todos os marcadores de nota aparecem no texto principal.
