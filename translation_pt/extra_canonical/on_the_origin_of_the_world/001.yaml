translation:
  language: pt
  text: '[] Visto que todos — tanto os deuses cósmicos como os seres humanos — dizem que nada existia antes do Caos, demonstrarei, contra eles, que todos estão enganados, pois desconhecem tanto a origem do Caos como a sua raiz. A prova é esta:


    Quanto ao Caos, agrada a [] todos afirmar que ele é uma espécie de escuridão. Na realidade, porém, ele se origina de uma sombra chamada “Escuridão”, e essa sombra se origina de uma entidade criada que existe desde o princípio. Além disso, é evidente que essa entidade existia antes de o Caos surgir, e que este veio a existir depois daquela primeira entidade criada.


    Portanto, ocupemo-nos dos fatos em questão e também da primeira entidade criada, da qual o Caos foi lançado para fora. Assim, a verdade ficará claramente demonstrada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Chaos
  choice: Caos
  rationale: Preserva o termo cosmológico personificado do testemunho, com inicial maiúscula.
- source_word: cosmic gods
  choice: deuses cósmicos
  rationale: Tradução direta e inteligível, sem identificar essas figuras com uma categoria teológica posterior.
- source_word: root
  choice: raiz
  rationale: Mantém a metáfora de origem ou fundamento sem explicá-la além do testemunho.
- source_word: Darkness
  choice: Escuridão
  rationale: A inicial maiúscula preserva seu uso como nome atribuído à sombra.
- source_word: created entity
  choice: entidade criada
  rationale: Conserva a generalidade do referente, que o trecho não identifica com maior precisão.
- source_word: propelled
  choice: lançado para fora
  rationale: Retém a imagem dinâmica e direcional do testemunho inglês, evitando reduzi-la simplesmente a 'originou-se'.
theological_decisions:
- issue: Relação temporal entre a primeira entidade criada, a sombra e o Caos
  choice: Manter explicitamente que a entidade criada precede o Caos e que o Caos surge depois dela
  alternative: Reformular como uma cadeia metafísica mais definida de emanação
  rationale: O testemunho estabelece anterioridade e derivação, mas não oferece aqui uma descrição técnica suficiente para impor um sistema metafísico específico.
- issue: Estatuto da Escuridão
  choice: Apresentar “Escuridão” como o nome da sombra
  alternative: Tratá-la como um ser pessoal ou princípio independente
  rationale: A formulação preserva exatamente a identificação oferecida no testemunho sem acrescentar personificação.
- issue: Afirmação sobre o que existia antes do Caos
  choice: Conservar a polêmica do autor contra deuses cósmicos e humanos
  alternative: Harmonizar a declaração com uma doutrina posterior da criação
  rationale: A tensão cosmológica pertence ao texto e não deve ser resolvida por pressupostos confessionais externos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe moderadamente formal adequada a uma introdução argumentativa. Os colchetes vazios foram preservados exatamente como sinais de lacuna, dano ou restauração incerta no testemunho fornecido. Como a revisão direta do copta ainda está pendente, esta redação é provisória e se baseia no testemunho inglês público indicado.
