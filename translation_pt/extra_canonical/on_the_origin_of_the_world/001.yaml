    When it comes to the topic of Chaos, how it pleases [] all people to claim that it is a type of darkness, when it actually originates from a shadow called by the name “Darkness,” and the shadow originates from a created entity that has existed from the beginning. Furthermore, it clearly existed before Chaos came to be, and the latter came to exist subsequent to the former created entity.


