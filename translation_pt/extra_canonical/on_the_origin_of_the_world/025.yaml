  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: pt
  text: 'Agora passaremos a considerar o nosso mundo, para completar com precisão a descrição de sua estrutura e governo. Então ficará claro como se encontrou a fidelidade ao éon invisível, manifestada desde a criação até a consumação da era.


    Chego, portanto, aos temas principais acerca do homem imortal. Tratarei dos seres que lhe pertencem, mostrando como vieram a estar aqui.


    Quando uma multidão de seres humanos passou a existir pela descendência de [o Adão que] [a] havia sido feito, até mesmo a partir da matéria, e quando o mundo já estava inteiramente povoado, os arcontes eram seus senhores; isto é, mantinham-no escravizado por meio da ignorância. E por quê? Pela seguinte razão: o Pai imortal sabe que surgiu uma deficiência na verdade entre os éons e seu universo. Quando quis reduzir a nada os arcontes da perdição por meio das criaturas que eles haviam moldado, enviou as vossas semelhanças ao mundo da perdição — isto é, os pequenos espíritos benditos da inocência. Eles não são alheios ao conhecimento, pois todo o conhecimento reside em um único anjo que lhes apareceu. Ele não carece de poder na presença do Pai, nem mesmo para que <ele>[b] lhes dê conhecimento. Quando aparecem no mundo da perdição, revelam imediatamente a estrutura da incorruptibilidade, para censura dos arcontes e de suas hostes.


    Assim, quando os seres benditos apareceram em formas moldadas pelas autoridades, foram alvo de inveja. Por inveja, as autoridades uniram sua semente à deles, desejando contaminá-los. Mas não foram capazes disso.


    Então, quando os seres benditos apareceram em forma radiante, manifestaram-se de diversas maneiras. Procediam de diferentes éons e revelavam seu conhecimento à igreja tornada visível por meio das formas moldadas da perdição. Nela se encontrou toda espécie de semente, porque a semente das autoridades havia sido unida [a ela].[c]


    O Salvador, então, fez de todos eles [(como) um],[d] e seus espíritos são claramente superiores, sendo benditos [e] e escolhidos de diversas maneiras. Há também vários outros seres que não têm rei e são superiores a todos os que existiram antes deles.


    Existem, portanto, quatro raças. Três pertencem aos reis do oitavo céu, mas a quarta raça não tem rei e é perfeita, sendo a mais elevada de todas. Pois são estes que entrarão no Lugar Santo de seu Pai e obterão descanso e repouso, glória eterna e inefável e alegria infinita.


    Além disso, são reis dentro do domínio da morte, visto que são imortais. Eles censurarão os deuses do Caos e suas hostes.


    [a] Há uma lacuna no manuscrito depois de “[o Adão que]”.

    [b] “<ele>” é uma restauração editorial; o referente do pronome permanece incerto.

    [c] O manuscrito preserva uma formulação parcialmente restaurada neste ponto; “a ela” retoma provavelmente a igreja.

    [d] A expressão “[(como) um]” é uma restauração editorial incerta.

    [e] Há uma lacuna no manuscrito depois de “benditos”.'
