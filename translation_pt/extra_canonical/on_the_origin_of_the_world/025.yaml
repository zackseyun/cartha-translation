lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo técnico cosmológico do texto, evitando reduzi-lo apenas a “era”; na expressão final temporal, “age” foi vertido por “era”.
- source_word: deathless
  choice: imortal
  rationale: Forma natural e digna em português, aplicada ao homem, ao Pai e aos seres que não estão sujeitos à morte.
- source_word: archons
  choice: arcontes
  rationale: Transliteração consagrada para os governantes cósmicos deste corpus, preservando seu valor técnico.
- source_word: indestructibility
  choice: incorruptibilidade
  rationale: Termo corrente na linguagem religiosa e filosófica, que comunica uma condição imperecível, não apenas resistência física à destruição.
- source_word: church
  choice: igreja
  rationale: Preserva a imagem coletiva do testemunho sem substituí-la por uma interpretação como “comunidade” ou “assembleia”.
- source_word: races
  choice: raças
  rationale: Mantém a classificação cosmológica do testemunho; aqui o termo designa ordens ou linhagens de seres, não categorias raciais modernas.
- source_word: censure
  choice: censura / censurarão
  rationale: Preserva o sentido de repreensão e exposição acusatória, sem intensificá-lo uniformemente para condenação judicial.
- source_word: hosts
  choice: hostes
  rationale: Mantém o registro cosmológico-militar do original em português bíblico ainda compreensível.
theological_decisions:
- issue: Fidelidade ao éon invisível
  choice: “como se encontrou a fidelidade ao éon invisível”
  alternative: “como foi descoberta a fé no éon invisível”
  rationale: Conserva a construção difícil e a ambiguidade entre fidelidade e fé, sem converter explicitamente o objeto em crença religiosa.
- issue: Agente que concede o conhecimento
  choice: Preservar “<ele>” e registrar a incerteza em nota
  alternative: Identificar o anjo ou o Pai como agente
  rationale: O testemunho contém restauração editorial e referente ambíguo; a tradução não deve decidir silenciosamente a identidade.
- issue: União das sementes
  choice: Linguagem literal de “semente” e “uniram”
  alternative: Explicar como mistura sexual, genealógica ou espiritual
  rationale: Mantém a ambiguidade mítica e antropológica do texto sem impor uma leitura específica.
- issue: Quarta raça sem rei
  choice: “não tem rei e é perfeita”
  alternative: “é autônoma e perfeita”
  rationale: Preserva a oposição explícita entre as raças ligadas aos reis e a raça sem rei.
- issue: Juízo contra os deuses do Caos
  choice: “censurarão”
  alternative: “condenarão”
  rationale: Evita resolver o ato como sentença judicial quando o testemunho também admite repreensão ou desmascaramento.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, em registro digno. Termos cosmológicos técnicos como “éon” e “arcontes” foram preservados. A tradução é necessariamente provisória, pois a revisão direta do copta está pendente e a base fornecida é um testemunho inglês de domínio público. O número de página manuscrita [16] foi omitido por não integrar o conteúdo, enquanto lacunas e restaurações relevantes foram convertidas em marcadores de nota explícitos.
