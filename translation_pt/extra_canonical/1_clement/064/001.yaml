  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: pt
  text: Por fim, que o Deus que tudo vê, Soberano dos espíritos e Senhor de toda carne, aquele que escolheu o Senhor Jesus Cristo e, por meio dele, também nos escolheu para sermos um povo de sua propriedade exclusiva, conceda a toda pessoa sobre a qual foi invocado o seu nome magnífico e santo[a] fé, temor, paz, perseverança e paciência, domínio próprio, pureza e sensatez, para agradar ao seu nome, por meio de Jesus Cristo, nosso sumo sacerdote e protetor. Por meio dele sejam dadas a Deus glória e majestade, poder e honra, agora e por todos os séculos dos séculos. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a toda pessoa chamada pelo seu nome magnífico e santo». O grego pode indicar que o nome de Deus foi invocado sobre a pessoa ou que ela foi chamada por esse nome.'
    reason: Preserva a ambiguidade de ἐπικεκλημένῃ ... τὸ ... ὄνομα, cuja construção admite tanto a invocação do nome sobre alguém quanto a ideia de ser chamado por esse nome.
lexical_decisions:
- source_word: παντεπόπτης
  choice: que tudo vê
  rationale: Expressa de modo natural e claro a ideia de visão universal contida no composto grego, sem recorrer ao menos corrente «onividente».
- source_word: δεσπότης τῶν πνευμάτων
  choice: Soberano dos espíritos
  rationale: «Soberano» preserva a autoridade absoluta de δεσπότης com dignidade, evitando em português moderno as associações negativas de «déspota».
- source_word: λαὸν περιούσιον
  choice: um povo de sua propriedade exclusiva
  rationale: Reproduz a ideia bíblica de um povo especialmente pertencente a Deus, sem reduzir περιούσιος apenas a «especial» ou «peculiar».
- source_word: ὑπομονὴν καὶ μακροθυμίαν
  choice: perseverança e paciência
  rationale: Distingue a constância sob provação de ὑπομονή da disposição paciente e longânima de μακροθυμία em linguagem corrente.
- source_word: σωφροσύνην
  choice: sensatez
  rationale: Abrange juízo equilibrado e sobriedade mental; evita limitar o termo à mera moderação.
- source_word: προστάτου
  choice: protetor
  rationale: Conserva o sentido amplo de quem ampara, defende ou patrocina, sem impor uma função técnica não explicitada no texto.
theological_decisions:
- issue: A afirmação de que Deus escolheu Jesus Cristo
  choice: aquele que escolheu o Senhor Jesus Cristo
  alternative: aquele que designou o Senhor Jesus Cristo
  rationale: Mantém o sentido direto de ἐκλεξάμενος («escolheu») e a tensão cristológica do texto, sem substituí-lo por uma interpretação explicativa.
- issue: A relação de δι’ αὐτοῦ com a escolha do povo
  choice: e, por meio dele, também nos escolheu
  alternative: e a nós, por meio dele, para sermos
  rationale: A explicitação verbal torna a coordenação inteligível em português, mas preserva que nossa eleição ocorre por meio de Cristo.
- issue: A fórmula de louvor final
  choice: Por meio dele sejam dadas a Deus glória e majestade
  alternative: por meio de quem a ele pertencem glória e majestade
  rationale: Conserva Cristo como mediador da doxologia e Deus como seu destinatário; a forma verbal implícita no grego é suprida naturalmente.
translation_notes:
  register: Português atual, solene e acessível, com sintaxe ajustada para leitura pública. «Toda pessoa» traduz ψυχή idiomaticamente, enquanto «Senhor de toda carne», «sumo sacerdote» e «séculos dos séculos» preservam a ressonância bíblica do original.
