  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: pt
  text: “Um sacrifício de louvor me glorificará, e ali está o caminho pelo qual lhe mostrarei a salvação de Deus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: um sacrifício de louvor
  rationale: Reproduz de modo natural e formal a expressão grega, mantendo a linguagem cultual.
- source_word: δοξάσει με
  choice: me glorificará
  rationale: Preserva o sentido futuro e o objeto explícito do verbo grego.
- source_word: κἀκεῖ ὁδός
  choice: e ali está o caminho
  rationale: Entende καὶ ἐκεῖ como indicação de lugar e supre apenas a cópula implícita exigida pelo português.
- source_word: δείξω αὐτῷ
  choice: lhe mostrarei
  rationale: Mantém o futuro e o referente masculino singular sem o explicitar além do grego.
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: a salvação de Deus
  rationale: Expressão idiomática e dignificada que conserva a referência de origem ou posse no genitivo.
theological_decisions:
- issue: Relação entre o sacrifício de louvor e o caminho
  choice: 'Manter duas afirmações coordenadas: o sacrifício glorifica Deus, e ali está o caminho'
  alternative: Interpretar o oferecimento de louvor como o próprio caminho preparado ou ordenado
  rationale: O texto grego transmitido é sintaticamente incomum e permite tensão interpretativa; a tradução evita fundir silenciosamente as duas imagens.
translation_notes:
  register: Português moderno, claro e reverente, com estrutura próxima do grego. As aspas finais refletem que o trecho é uma citação nas unidades editoriais, embora o excerto fornecido não inclua o início da fala.
