  source_fidelity: A tradução preserva adequadamente as duas cláusulas do grego, o futuro em «glorificará» e «mostrarei», o dativo em «lhe» e a imagem algo elíptica de «ali está o caminho». «Pelo qual» explicita de modo aceitável a relação do relativo com «caminho», em conformidade com o audit trail inglês, sem resolver além do necessário a construção sintaticamente incomum.
