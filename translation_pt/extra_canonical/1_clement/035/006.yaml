source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: pt
  text: Pois os que praticam essas coisas são odiosos a Deus; e não somente os que as praticam, mas também os que os aprovam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγητοὶ τῷ θεῷ
  choice: detestáveis para Deus
  rationale: Preserva a força de στυγητός e reproduz naturalmente em português a relação expressa pelo dativo τῷ θεῷ, sem suavizá-la para mera desaprovação.
- source_word: οἱ συνευδοκοῦντες αὐτοῖς
  choice: os que lhes dão aprovação
  rationale: Expressa o sentido de consentir ou aprovar junto com os praticantes, mantendo o pronome αὐτοῖς e evitando sugerir que se trata apenas de aprovar abstratamente as ações.
theological_decisions:
- issue: Alcance da condenação
  choice: Manter distinta a culpa dos que praticam e a dos que dão aprovação a eles
  alternative: Interpretar a segunda categoria apenas como pessoas que aprovam as ações
  rationale: O grego usa αὐτοῖς, cujo referente gramatical mais direto são os praticantes; a tradução preserva essa construção sem desenvolver implicações doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima ao grego. “Detestáveis” mantém a intensidade do original; “dão aprovação” é corrente e mais preciso neste contexto do que uma formulação excessivamente coloquial.
