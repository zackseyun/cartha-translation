    reason: A formação grega admite discussão entre o sentido de ódio dirigido a Deus e o de algo odiado por Deus.
  revision_rationale: A revisão torna mais explícito o valor resultante do perfeito passivo, melhora a fluência da oração relativa a «agradável e aceitável» e substitui «murmurações» por «sussurros», que corresponde mais diretamente ao termo grego. A ambiguidade de θεοστυγίαν é preservada em nota.
