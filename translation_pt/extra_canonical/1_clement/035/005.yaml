  to: Mas como isso acontecerá, amados? Isso acontecerá se a nossa mente estiver firmemente fixada em Deus, com fidelidade[a]; se buscarmos o que lhe é agradável e aceitável; se fizermos o que é próprio de sua vontade irrepreensível e seguirmos o caminho da verdade, tendo afastado de nós toda injustiça e maldade, ganância, discórdias, malícia e engano, sussurros e calúnias, ódio a Deus[b], orgulho e arrogância, vanglória e falta de hospitalidade.
