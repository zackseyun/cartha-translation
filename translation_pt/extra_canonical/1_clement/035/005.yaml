  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: pt
  text: Mas como isso acontecerá, amados? Isso acontecerá se a nossa mente estiver firmemente fixada em Deus, com fidelidade[a]; se buscarmos o que lhe é agradável e aceitável; se fizermos o que é próprio de sua vontade irrepreensível e seguirmos o caminho da verdade, tendo afastado de nós toda injustiça e maldade, ganância, discórdias, malícia e engano, sussurros e calúnias, ódio a Deus[b], orgulho e arrogância, vanglória e falta de hospitalidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se a nossa mente tiver sido firmemente fixada em Deus pela fé”.'
    reason: A forma verbal expressa um estado resultante; πιστῶς pode ser entendido como “fielmente”, “com fidelidade” ou “pela fé”.
  - marker: b
    text: A expressão também pode ser entendida como “aquilo que é odioso a Deus”.
    reason: A formação grega admite discussão entre o sentido de ódio dirigido a Deus e o de algo odiado por Deus.
lexical_decisions:
- source_word: ἐστηργιμένῃ ᾖ
  choice: estiver firmemente voltada
  rationale: O perfeito passivo de στηρίζω/στεργίζω conforme a forma transmitida descreve um estado estabelecido; a expressão portuguesa comunica firmeza e orientação para Deus sem sugerir apenas uma ação momentânea.
- source_word: πιστῶς
  choice: com fidelidade
  rationale: O advérbio pode indicar uma relação fiel ou marcada pela fé; “com fidelidade” mantém o valor adverbial e evita reduzir o sentido a mera certeza intelectual.
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  choice: o que é próprio de sua vontade irrepreensível
  rationale: ἀνήκοντα significa aquilo que é apropriado ou condizente, e βούλησις, neste contexto ético, é bem representado por “vontade”.
- source_word: κακοηθείας τε καὶ δόλους
  choice: malícia e engano
  rationale: κακοήθεια denota mau caráter ou malignidade, aqui vertido pelo abstrato natural “malícia”; δόλος é fraude ou engano deliberado.
- source_word: ψιθυρισμούς τε καὶ καταλαλιάς
  choice: murmurações e calúnias
  rationale: ψιθυρισμός designa fala murmurada ou difamatória às escondidas; καταλαλιά é fala contra alguém, especialmente difamação ou calúnia.
- source_word: κενοδοξίαν
  choice: vanglória
  rationale: O termo significa glória vazia, presunção ou desejo vão de reconhecimento; “vanglória” é corrente e preciso em português.
- source_word: ἀφιλοξενίαν
  choice: falta de hospitalidade
  rationale: A formação privativa indica ausência de disposição hospitaleira; a locução é mais clara e natural que “inospitalidade” para leitores comuns.
theological_decisions:
- issue: Sentido de θεοστυγίαν
  choice: ódio a Deus
  alternative: aquilo que é odioso a Deus
  rationale: O substantivo pode ser entendido objetivamente como hostilidade contra Deus, sentido mais direto na lista de vícios. A família lexical também pode evocar aquilo que Deus odeia ou que é odioso a ele, por isso a alternativa é registrada sem resolver silenciosamente a tensão.
- issue: Relação entre fidelidade e orientação da mente
  choice: mente firmemente voltada para Deus com fidelidade
  alternative: mente firmemente ligada a Deus pela fé
  rationale: A construção combina o estado firme expresso pelo perfeito com πιστῶς. A tradução principal mantém “fidelidade”, mas não exclui a nuance de fé presente no advérbio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe brasileira natural. A repetição de “se” preserva a estrutura condicional do grego; “Acontecerá” foi acrescentado na resposta para evitar uma sequência fragmentária em português. A enumeração mantém o peso retórico e ético do original sem vocabulário denominacional.
