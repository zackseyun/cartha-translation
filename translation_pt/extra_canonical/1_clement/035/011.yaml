  text: σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ, μήποτε ἁρπάσῃ ὡς λέων, καὶ μὴ ᾖ ὁ ῥυόμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: pt
  text: Entendam, pois, estas coisas, vocês que se esquecem de Deus, para que ele não os arrebate como um leão, sem que haja quem os livre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνετε
  choice: Entendam
  rationale: Imperativo plural de συνίημι; comunica de modo natural a ordem de compreender ou perceber.
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: vocês que se esquecem de Deus
  rationale: Preserva o particípio presente e seu valor de caracterização dos destinatários, em português corrente.
- source_word: ἁρπάσῃ
  choice: os arrebate
  rationale: Expressa a ideia forte de agarrar e levar à força; o objeto 'os' está implícito no grego e é exigido para fluidez e clareza em português.
- source_word: ὁ ῥυόμενος
  choice: quem os livre
  rationale: O particípio substantivado designa alguém que resgata ou livra; a formulação é idiomática e conserva o sentido.
theological_decisions:
- issue: Sujeito implícito de ἁρπάσῃ
  choice: ele, referindo-se a Deus
  alternative: sujeito indeterminado ou não explicitado
  rationale: A referência mais natural no contexto imediato é τοῦ θεοῦ; o pronome explicita em português o sujeito recuperável do grego, sem acrescentar identificação além do contexto.
- issue: Objeto implícito de ἁρπάσῃ e ῥυόμενος
  choice: os destinatários ('os')
  alternative: manter o objeto não expresso
  rationale: Os destinatários são o objeto entendido pelo contexto; explicitá-lo produz português natural sem resolver qualquer tensão teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativo plural brasileiro ('Entendam') e tratamento por 'vocês'. A construção final mantém o tom solene de advertência.
