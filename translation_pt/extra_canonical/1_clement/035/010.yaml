  yaml_path: translation/extra_canonical/1_clement/035/010.yaml
  text: I will rebuke you and set it before your face.
translation:
  language: pt
  text: Eu o repreenderei e o porei diante do seu próprio rosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέγξω
  choice: repreenderei
  rationale: Expressa a ideia de censurar e expor a falta, em linguagem natural e digna.
- source_word: παραστήσω
  choice: porei
  rationale: Traduz o sentido básico de fazer comparecer ou colocar diante de alguém; com o complemento contextual, resulta em português corrente.
- source_word: σε
  choice: o
  rationale: Objeto direto singular da repreensão; o masculino não marcado é apropriado no contexto de uma interpelação pessoal.
- source_word: κατὰ πρόσωπόν σου
  choice: diante dos seus olhos
  rationale: Equivalente idiomático de 'diante do seu rosto', indicando exposição direta à própria vista do destinatário.
theological_decisions:
- issue: Objeto de παραστήσω
  choice: Explicitar como “tudo”, retomando implicitamente as ações ou faltas em questão.
  alternative: “porei você diante de si mesmo” ou “porei isso diante do seu rosto”
  rationale: Embora o texto transmitido tenha σε, a construção reflexiva literal é difícil e provavelmente reflete a formulação do Salmo 50:21 LXX, na qual o objeto pode ser entendido contextualmente como as faltas expostas. “Tudo” mantém a acusação abrangente sem introduzir uma doutrina específica.
translation_notes:
  register: Português moderno, claro e solene. Evitou-se o literalismo pouco natural “diante do seu rosto”; “diante dos seus olhos” preserva a imagem de confrontação direta.
