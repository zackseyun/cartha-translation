review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o grego, incluindo os imperfeitos com valor habitual/continuado e o singular de μοιχοῦ («o adúltero»). Contudo, «diante do filho de tua mãe» desloca κατὰ («contra») para uma mera posição espacial; o grego acusa a ação dirigida contra ele.
  naturalness: O português é claro e de registro apropriado. «Fazias causa comum com o adúltero» comunica mais idiomaticamente a imagem de pôr a própria parte com ele, sem perder a ideia de cumplicidade.
  terminology: «Correção» traduz adequadamente παιδεία neste contexto. «Pedra de tropeço» preserva a metáfora de σκάνδαλον. «Difamavas» explicita de modo natural o sentido de κατελάλεις, falar mal/caluniar.
