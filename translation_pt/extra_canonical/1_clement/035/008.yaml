source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: pt
  text: Tu, porém, odiaste a correção e lançaste para trás de ti as minhas palavras. Quando vias um ladrão, corrias com ele e fazias causa comum com o adúltero. A tua boca multiplicava a maldade, e a tua língua entrelaçava engano. Sentado, difamavas o teu irmão e colocavas uma pedra de tropeço contra o filho de tua mãe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείαν
  choice: correção
  rationale: No contexto de uma repreensão divina, o termo denota instrução disciplinadora ou correção; «correção» é natural e preserva esse sentido sem restringi-lo a castigo.
- source_word: συνέτρεχες αὐτῷ
  choice: corrias com ele
  rationale: Mantém a imagem verbal do grego e comunica participação ou associação ativa com o ladrão.
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: tomavas parte com o adúltero
  rationale: Expressa naturalmente a ideia idiomática de colocar a própria porção com alguém, preservando o singular genérico μοιχοῦ.
- source_word: περιέπλεκεν δολιότητα
  choice: entrelaçava engano
  rationale: Conserva a metáfora de tecer ou entrelaçar presente no verbo, sem reduzir a expressão simplesmente a «dizer mentiras».
- source_word: κατελάλεις
  choice: falavas contra
  rationale: Traduz de modo amplo e direto o ato de falar contra ou difamar, sem impor uma especificação maior que a do contexto.
- source_word: σκάνδαλον
  choice: pedra de tropeço
  rationale: 'Preserva a imagem concreta tradicional do termo: algo posto no caminho para fazer alguém cair, também com sentido figurado.'
theological_decisions:
- issue: Força de παιδεία
  choice: correção
  alternative: disciplina; instrução
  rationale: A escolha retém tanto a dimensão educativa quanto a repreensiva, sem introduzir uma doutrina específica de punição.
- issue: Número de μοιχοῦ
  choice: o adúltero
  alternative: os adúlteros
  rationale: O grego está no singular. O artigo em português permite entendê-lo genericamente sem alterar o número gramatical da fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o tom direto da citação. Os imperfeitos gregos foram vertidos por imperfeitos portugueses para conservar a ação habitual ou continuada. Não foram mantidas as notas inglesas recebidas, pois não correspondem a variantes ou ambiguidades reais do texto grego apresentado.
