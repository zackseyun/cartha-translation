    issue: Direção de κατὰ na cláusula final
    rationale: «Colocavas uma pedra de tropeço diante do filho de tua mãe» sugere apenas que o obstáculo estava à frente dele. κατὰ τοῦ υἱοῦ τῆς μητρός σου significa que a ação era contra ele; «contra o filho de tua mãe» preserva essa relação.
  - severity: low
    issue: Formulação de μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
    rationale: «Tomavas parte com o adúltero» é compreensível, mas pode soar pouco idiomático. «Fazias causa comum com o adúltero» transmite naturalmente a associação culpável implicada por ‘pôr a tua parte com’.
