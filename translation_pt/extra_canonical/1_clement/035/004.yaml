  verdict: approve
  source_fidelity: A tradução transmite adequadamente a exortação inclusiva de ἀγωνιζώμεθα, o passivo de εὑρεθῆναι e a finalidade de ὅπως. «Os que esperam por ele» corresponde bem a τῶν ὑπομενόντων αὐτόν neste contexto, em conformidade com a decisão lexical registrada no histórico inglês, sem introduzir a ideia imprópria de Deus ser alguém a ser suportado. «Participarmos dos dons prometidos» preserva μεταλάβωμεν e τῶν ἐπηγγελμένων δωρεῶν.
  naturalness: O texto é claro, fluente e apropriado ao português moderno de ampla compreensão, com boa legibilidade brasileira. «Portanto», «esforcemo-nos», «a fim de» e «dons prometidos» mantêm um registro exortativo digno sem arcaísmo.
  terminology: «Dons prometidos» representa com precisão δωρεῶν e o particípio perfeito ἐπηγγελμένων. A nota explica de modo sóbrio a dimensão perseverante de ὑπομένω e está corretamente ancorada após «ele».
