source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: pt
  text: Portanto, esforcemo-nos para ser encontrados entre os que esperam por ele[a], a fim de participarmos dos dons prometidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aguardam por ele com perseverança».'
    reason: Preserva a nuance de constância e perseverança de ὑπομένω sem sugerir que Deus seja alguém a ser suportado.
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: esforcemo-nos
  rationale: Expressa a ideia de empenho e esforço contínuo de modo natural e digno em português, sem introduzir a imagem mais específica de combate.
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: ser encontrados entre
  rationale: Reproduz o passivo e comunica naturalmente a ideia de pertencer ao grupo ou número mencionado.
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: os que esperam por ele
  rationale: Com objeto pessoal no acusativo, ὑπομένω pode ter o sentido de aguardar ou esperar por alguém. Aqui, essa leitura evita a noção inadequada de que Deus seria alguém a ser suportado.
- source_word: μεταλάβωμεν
  choice: participarmos
  rationale: Mantém o sentido de tomar parte ou receber uma porção dos dons prometidos.
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: dos dons prometidos
  rationale: Tradução concisa que preserva tanto o caráter de dádiva de δωρεῶν quanto a promessa expressa pelo particípio perfeito.
theological_decisions:
- issue: Sentido de ὑπομένω com αὐτόν
  choice: esperam por ele
  alternative: perseveram por causa dele / suportam-no pacientemente
  rationale: O contexto e o uso com objeto pessoal favorecem a expectativa perseverante dirigida a Deus. A alternativa literal ligada a 'suportar' poderia sugerir indevidamente que ele é uma aflição; a nota conserva a nuance de perseverança presente no verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção exortativa mantém o tom comunitário do grego; «a fim de» conserva com clareza a relação de propósito expressa por ὅπως.
