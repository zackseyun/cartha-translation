  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: pt
  text: Fizeste essas coisas, e eu me calei; pensaste, ó transgressor da lei, que eu seria igual a ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσίγησα
  choice: eu me calei
  rationale: Expressa de modo natural e fiel o silêncio mantido pelo falante.
- source_word: ὑπέλαβες
  choice: pensaste
  rationale: Preserva o sentido de supor ou imaginar, sem acrescentar certeza indevida.
- source_word: ἄνομε
  choice: ó transgressor da lei
  rationale: O vocativo ἄνομε caracteriza alguém que viola ou despreza a lei; esta formulação conserva a referência explícita à lei e soa clara em português.
- source_word: ὅμοιος σοι
  choice: igual a ti
  rationale: Reproduz diretamente a comparação expressa no grego.
theological_decisions:
- issue: Natureza da semelhança suposta entre Deus e o transgressor
  choice: que eu seria igual a ti
  alternative: que eu seria como tu
  rationale: Mantém a formulação aberta do grego, sem especificar em que sentido a semelhança teria sido presumida.
translation_notes:
  register: Português moderno, claro e digno, com tratamento verbal na segunda pessoa do singular para preservar a força direta do discurso. O vocativo solene é mantido com “ó”.
