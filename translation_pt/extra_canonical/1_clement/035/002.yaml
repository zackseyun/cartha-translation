source:
  edition: Funk 1901 (normalized OCR)
  text: ζωὴ ἐν ἀθανασίᾳ, λαμπρότης ἐν δικαιοσύνῃ, ἀλήθεια ἐν παρρησίᾳ, πίστις ἐν πεποιθήσει, ἐγκράτεια ἐν ἁγιασμῷ· καὶ ταῦτα ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: pt
  text: vida em imortalidade, esplendor em justiça, verdade em franqueza, fé em confiança, domínio próprio em santidade; e todas essas coisas se apresentavam à nossa mente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e todas essas coisas estavam ao alcance da nossa compreensão». Literalmente, o grego diz que elas «caíam sob» o nosso entendimento.'
    reason: Registra a imagem incomum de ὑποπίπτω e o imperfeito do verbo, enquanto o texto principal emprega uma formulação portuguesa natural para a apreensão mental.
lexical_decisions:
- source_word: ζωὴ ἐν ἀθανασίᾳ
  choice: vida em imortalidade
  rationale: Mantém a construção compacta e paralela do grego, sem explicitar uma relação que a preposição ἐν deixa aberta.
- source_word: λαμπρότης ἐν δικαιοσύνῃ
  choice: esplendor em justiça
  rationale: “Esplendor” reproduz a ideia de brilho ou glória de λαμπρότης; “em justiça” preserva o paralelismo preposicional.
- source_word: ἀλήθεια ἐν παρρησίᾳ
  choice: verdade em franqueza
  rationale: παρρησία pode indicar franqueza, liberdade de fala ou ousadia; “franqueza” é natural aqui e evita transformar o termo apenas em coragem.
- source_word: πίστις ἐν πεποιθήσει
  choice: fé em plena confiança
  rationale: πεποίθησις denota confiança ou convicção firme. “Plena confiança” distingue o segundo termo de πίστις e comunica sua força.
- source_word: ἐγκράτεια ἐν ἁγιασμῷ
  choice: domínio próprio em santidade
  rationale: “Domínio próprio” expressa de modo corrente o controle de si indicado por ἐγκράτεια; “santidade” é uma tradução adequada de ἁγιασμός neste contexto.
- source_word: ὑπέπεπτεν ... τῇ διανοίᾳ ἡμῶν
  choice: já estavam ao alcance da nossa compreensão
  rationale: A expressão grega significa literalmente que essas coisas haviam “caído sob” a mente ou entendimento, isto é, encontravam-se no campo da apreensão mental. A formulação portuguesa comunica esse sentido sem reproduzir um decalque obscuro.
theological_decisions:
- issue: Relação expressa por ἐν em cada par da lista
  choice: Manter “em”
  alternative: Interpretar como “com”, “na esfera de” ou “unida a”
  rationale: O grego apresenta uma série deliberadamente concisa e não define de modo inequívoco a relação entre cada substantivo; conservar “em” evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com paralelismo nominal preservado. A sequência foi mantida em minúscula por ser um fragmento contínuo do período maior. O advérbio “já” sinaliza o valor anterior do mais-que-perfeito grego sem tornar a frase pesada.
