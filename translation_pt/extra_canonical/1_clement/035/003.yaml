id: 1CLEM.35.3
reference: 1 Clement 35:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: pt
  text: Quais são, então, as coisas preparadas para os que perseveram? O Criador e Pai das eras, o Santíssimo, ele próprio conhece a medida e a beleza delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: os que perseveram
  rationale: Expressa a perseverança ou resistência paciente indicada pelo particípio, sem acrescentar um objeto ausente do texto grego.
- source_word: τῶν αἰώνων
  choice: das eras
  rationale: Preserva o sentido amplo de períodos ou eras associado a αἰών, evitando restringi-lo a séculos cronológicos.
- source_word: ποσότητα
  choice: medida
  rationale: Neste contexto, comunica a magnitude ou extensão das coisas preparadas de modo mais natural do que o literalismo 'quantidade'.
- source_word: καλλονὴν
  choice: beleza
  rationale: Equivalente direto e natural para a qualidade de beleza ou formosura.
theological_decisions:
- issue: Objeto da perseverança
  choice: 'Sem complemento: ''os que perseveram'''
  alternative: '''os que perseveram por ele'' ou ''nele'''
  rationale: O grego τοῖς ὑπομένουσιν é absoluto neste versículo; não há pronome que justifique explicitar 'por ele' ou 'nele'.
- issue: Ênfase de αὐτός
  choice: '''ele próprio conhece'''
  alternative: '''só ele conhece'''
  rationale: Mantém a ênfase no próprio Deus sem transformar a construção enfática numa afirmação explícita de exclusividade, embora esta possa ser sugerida pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível. A ordem mantém a pergunta retórica e os títulos divinos do grego; 'ele próprio' preserva a ênfase de αὐτός, e 'Pai das eras' conserva a amplitude temporal de αἰώνων.
