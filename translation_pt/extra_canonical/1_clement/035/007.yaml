  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: pt
  text: 'Pois a Escritura diz: “Mas ao ímpio Deus diz: ‘Por que você recita os meus estatutos e traz a minha aliança nos lábios?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Mantém a fórmula de citação no singular e seu sentido reconhecível em português.
- source_word: τὰ δικαιώματά μου
  choice: os meus estatutos
  rationale: No contexto da citação do Salmo, designa determinações ou preceitos estabelecidos por Deus; “estatutos” preserva esse caráter jurídico sem ampliar para uma explicação interpretativa.
- source_word: ἀναλαμβάνεις
  choice: toma
  rationale: Reproduz a imagem de assumir ou trazer a aliança à boca, evitando substituir a metáfora por uma paráfrase como “professa”.
- source_word: ἐπὶ στόματός σου
  choice: nos lábios
  rationale: Expressão idiomática natural em português que preserva a imagem de proferir verbalmente a aliança.
theological_decisions:
- issue: Identificação do destinatário na forma inicial da citação
  choice: ao ímpio
  alternative: ao pecador
  rationale: Embora o OCR grego fornecido esteja corrompido nesse ponto, a fórmula citada corresponde ao texto conhecido do Salmo 49:16 na LXX, τῷ δὲ ἁμαρτωλῷ. “Ímpio” comunica aqui a pessoa cuja conduta contradiz sua recitação da aliança, sem sugerir que todo aquele que peca seja indistintamente o alvo específico da censura.
- issue: Tempo verbal da fala divina
  choice: Deus diz
  alternative: Deus disse
  rationale: O presente mantém a força atual da fórmula de citação introduzida por λέγει e evita limitar a palavra divina ao passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção conserva o paralelismo da pergunta e a tensão entre recitar os estatutos de Deus e trazer sua aliança aos lábios.
