  language: pt
  text: O ciúme e a discórdia destruíram grandes cidades e arrancaram pela raiz grandes nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto imediato, o termo designa o ciúme ou a inveja que provoca perseguição e ruptura; “ciúme” preserva a repetição temática do capítulo.
- source_word: ἔρις
  choice: discórdia
  rationale: Expressa conflito e rivalidade de modo natural e digno em português.
- source_word: κατέστρεψεν
  choice: destruíram
  rationale: O verbo está na voz ativa e, coordenado com o sujeito composto, indica a ruína de grandes cidades.
- source_word: ἐξερίζωσεν
  choice: arrancaram pela raiz
  rationale: Mantém a imagem forte e concreta de extirpar ou desenraizar aplicada a nações.
