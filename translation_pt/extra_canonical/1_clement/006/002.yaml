revisions:
- from: Por causa do ciúme, mulheres foram perseguidas como Danaides e Dirces[a]. Depois de sofrerem torturas terríveis e brutais[b], chegaram à meta na firme corrida da fé e receberam uma nobre recompensa, embora fossem fracas no corpo.
  to: Por causa do ciúme, mulheres foram perseguidas como Danaides e Dirces[a]. Depois de sofrerem maus-tratos terríveis e ímpios[b], alcançaram o firme caminho da fé e receberam uma nobre recompensa, embora fossem fracas no corpo.
  rationale: A revisão substitui o qualificativo inespecífico «brutais» por «ímpios», conforme a emenda crítica usual e o audit trail inglês, com nota explicitando a forma problemática do texto fornecido. Também ajusta a imagem de δρόμος para «firme caminho», evitando introduzir uma meta explícita e melhorando a naturalidade em português.
