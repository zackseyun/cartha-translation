base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: pt
  text: Por causa do ciúme, mulheres foram perseguidas como Danaides e Dirces[a]. Depois de sofrerem maus-tratos terríveis e ímpios[b], alcançaram o firme caminho da fé e receberam uma nobre recompensa, embora fossem fracas no corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Danaides” e “Dirces” aludem a figuras da mitologia grega. A alusão provavelmente se refere a mulheres submetidas a papéis ou suplícios de espetáculo durante a perseguição, mas os pormenores históricos são incertos.
    reason: Os nomes mitológicos não são transparentes ao leitor moderno, e a natureza exata da alusão é debatida.
  - marker: b
    text: O texto grego fornecido traz ἀνδρία, forma difícil neste contexto. A leitura crítica usualmente adotada é ἀνόσια, “ímpios” ou “profanos”; por isso a tradução segue essa reconstrução, sem ocultar a incerteza textual.
    reason: A nota ancora a opção por “ímpios” na dificuldade da forma transmitida e preserva a incerteza textual.
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: por causa do ciúme
  rationale: Mantém o motivo recorrente do contexto; a forma ζῆλος pode expressar zelo ou ciúme, mas aqui o sentido destrutivo favorece “ciúme”.
- source_word: γυναῖκες Δαναΐδες καὶ Δίρκαι
  choice: mulheres ... como Danaides e Dirces
  rationale: Entende os nomes como papéis ou formas de suplício encenados na perseguição, sem identificar as mulheres literalmente com personagens mitológicas.
- source_word: αἰκίσματα
  choice: torturas
  rationale: Expressa maus-tratos violentos e degradantes, de modo mais preciso no contexto de perseguição do que o genérico “abusos”.
- source_word: ἐπὶ τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: chegaram à meta na firme corrida da fé
  rationale: Conserva a metáfora atlética de δρόμος e representa κατήντησαν como chegada, em português natural, sem fazer de βέβαιος uma afirmação teológica mais específica.
- source_word: γέρας γενναῖον
  choice: nobre recompensa
  rationale: Preserva a linguagem honorífica de prêmio ou distinção concedida após a perseverança.
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: embora fossem fracas no corpo
  rationale: Reproduz o contraste retórico entre fragilidade física e perseverança, sem generalizar a afirmação para todas as mulheres.
theological_decisions:
- issue: Natureza da chegada no δρόμος da fé
  choice: “chegaram à meta na firme corrida da fé”
  alternative: “percorreram com segurança o caminho da fé”
  rationale: A formulação escolhida mantém tanto a imagem de corrida quanto a ideia de chegada, sem introduzir explicitamente uma doutrina de segurança eterna.
- issue: Referência mitológica de Danaides e Dirces
  choice: manter os nomes com nota explicativa
  alternative: substituir por uma descrição dos suplícios
  rationale: Os referentes pertencem ao texto e provavelmente evocam espetáculos persecutórios; explicá-los em nota evita apagar a alusão ou impor uma reconstrução histórica como certeza.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “corrida da fé” para conservar a metáfora atlética. Os nomes mitológicos foram aportuguesados como “Danaides” e “Dirces”. A sintaxe foi dividida em duas frases para clareza, sem reduzir a tensão entre fraqueza corporal e perseverança.
