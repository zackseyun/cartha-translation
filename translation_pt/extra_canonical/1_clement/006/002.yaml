    issue: O segundo termo de αἰκίσματα δεινὰ καὶ ἀνδρία é vertido por «brutais».
    rationale: «Brutais» apenas intensifica «terríveis» e não corresponde à forma transmitida, que é problemática, nem à emenda crítica usual ἀνόσια, «ímpios/profanos», refletida no audit trail inglês. A tradução deve adotar a leitura crítica de modo transparente e conservar a incerteza em nota.
  - severity: low
