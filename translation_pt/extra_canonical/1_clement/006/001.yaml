id: 1CLEM.6.1
reference: 1 Clement 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: pt
  text: A esses homens, que viveram de modo santo, juntou-se uma grande multidão de eleitos, os quais, tendo sofrido muitos ultrajes e torturas por causa da inveja, tornaram-se entre nós um belíssimo exemplo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  choice: que viveram de modo santo
  rationale: Expressa naturalmente a conduta ou modo de vida caracterizado pela santidade, sem restringir πολιτεύομαι à esfera política.
- source_word: συνηθροίσθη
  choice: juntou-se
  rationale: Reproduz o sentido passivo/intransitivo de reunir-se a um grupo já mencionado.
- source_word: πολὺ πλῆθος ἐκλεκτῶν
  choice: uma grande multidão de eleitos
  rationale: Mantém a formulação quantitativa e o termo ἐκλεκτῶν sem acrescentar uma identificação não explícita.
- source_word: αἰκίαις
  choice: maus-tratos
  rationale: Abrange ultrajes, abusos e tratamentos cruéis, distinguindo-os de βασάνοις.
- source_word: βασάνοις
  choice: torturas
  rationale: Equivalente direto e claro para sofrimentos infligidos como tormento.
- source_word: διὰ ζῆλος
  choice: por causa da inveja
  rationale: O contexto precedente de 1 Clemente favorece o sentido negativo de zelo como inveja ou ciúme; 'inveja' é natural em português.
- source_word: ὑπόδειγμα κάλλιστον
  choice: um belíssimo exemplo
  rationale: Preserva o superlativo enfático e o sentido de modelo exemplar.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Mantém a referência comunitária sem decidir se significa estritamente 'em nosso meio' ou, de modo mais amplo, 'para nós'.
theological_decisions:
- issue: Identidade dos ἐκλεκτῶν
  choice: eleitos
  alternative: escolhidos
  rationale: Conserva o termo tradicional e a possível densidade teológica do grego, sem especificar além do texto quem os elegeu ou em que sentido.
- issue: Referência de οἵτινες e mudança para o plural
  choice: eles se tornaram
  alternative: a multidão se tornou
  rationale: O pronome relativo plural retoma os eleitos individualmente; o plural português preserva essa concordância conceitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A divisão em duas frases evita um período excessivamente pesado sem alterar as relações sintáticas do grego.
