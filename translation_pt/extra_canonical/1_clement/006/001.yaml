revisions:
- from: A esses homens, que viveram de modo santo, juntou-se uma grande multidão de eleitos. Depois de sofrerem muitos maus-tratos e torturas por causa da inveja, eles se tornaram entre nós um belíssimo exemplo.
  to: A esses homens, que viveram de modo santo, juntou-se uma grande multidão de eleitos, os quais, tendo sofrido muitos ultrajes e torturas por causa da inveja, tornaram-se entre nós um belíssimo exemplo.
  rationale: A revisão substitui uma formulação temporalmente mais marcada por uma construção participial que acompanha melhor o grego e ajusta «maus-tratos» para «ultrajes». Mantêm-se a ambiguidade teológica de «eleitos», o superlativo de κάλλιστον e a referência comunitária de ἐν ἡμῖν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os termos principais são bem representados: a multidão dos eleitos é reunida aos homens que viveram santamente, e os eleitos sofrem por causa da inveja. Contudo, «Depois de sofrerem» torna a relação do particípio aoristo mais estritamente temporal do que o grego exige; «tendo sofrido» conserva melhor a ligação descritiva e causal com o fato de se terem tornado exemplo.'
  naturalness: O português é claro, atual e de registro apropriado. A construção com relativo («os quais, tendo sofrido...») produz uma conexão mais fluida e mais próxima da sintaxe do original, sem exigir uma divisão temporal entre os acontecimentos.
  terminology: «Eleitos», «torturas», «inveja» e «entre nós» são escolhas adequadas. «Ultrajes» corresponde mais precisamente a αἰκίαι, que designa maus-tratos ultrajantes ou abusos, e preserva a distinção em relação a βασάνοις, «torturas».
  issues:
  - severity: low
    issue: «Depois de sofrerem» explicita uma sucessão temporal.
    rationale: O particípio παθόντες significa «tendo sofrido»; embora possa sugerir anterioridade, o contexto o apresenta sobretudo como caracterização dos eleitos e base de seu valor exemplar.
  - severity: low
    issue: «Maus-tratos» é um pouco mais amplo que αἰκίαι.
    rationale: «Ultrajes» reflete de modo mais direto o aspecto de afronta e tratamento cruel presente no termo grego e no audit trail inglês («outrages»).
  revised_text: A esses homens, que viveram de modo santo, juntou-se uma grande multidão de eleitos, os quais, tendo sofrido muitos ultrajes e torturas por causa da inveja, tornaram-se entre nós um belíssimo exemplo.
  revised_footnotes:
  - marker: a
    text: 'Ou: «os quais, por causa da inveja, tendo sofrido muitos ultrajes e torturas».'
    reason: A posição de διὰ ζῆλος pode ser entendida como ligada diretamente a «tendo sofrido»; a tradução principal mantém a ordem mais natural em português sem eliminar essa possibilidade.
  revision_rationale: A revisão substitui uma formulação temporalmente mais marcada por uma construção participial que acompanha melhor o grego e ajusta «maus-tratos» para «ultrajes». Mantêm-se a ambiguidade teológica de «eleitos», o superlativo de κάλλιστον e a referência comunitária de ἐν ἡμῖν.
