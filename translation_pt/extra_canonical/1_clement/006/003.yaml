base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: pt
  text: 'O ciúme afastou as mulheres de seus maridos e alterou o que foi dito por nosso pai Adão: “Esta, agora, é osso dos meus ossos e carne da minha carne.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ciúme
  rationale: Neste contexto, o termo designa uma paixão destrutiva que rompe relações conjugais; “ciúme” preserva melhor essa força do que “zelo”.
- source_word: ἀπηλλοτρίωσεν
  choice: afastou
  rationale: Expressa a alienação ou separação entre as mulheres e seus maridos em português natural, sem especificar indevidamente o modo da ruptura.
- source_word: ἠλλοίωσεν
  choice: alterou
  rationale: Mantém a afirmação forte e algo enigmática de que o ciúme modificou ou desfigurou, na prática, a palavra de Adão.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Reproduz a construção passiva grega sem acrescentar uma identificação explicativa além da referência explícita a Adão.
- source_word: Τοῦτο νῦν
  choice: Esta, agora
  rationale: O demonstrativo neutro grego retoma a mulher apresentada em Gênesis; o feminino é exigido pelo português, e “agora” preserva νῦν.
theological_decisions:
- issue: Sentido de ἠλλοίωσεν aplicado à declaração de Adão
  choice: alterou
  alternative: contradisse
  rationale: “Alterou” conserva a formulação e a tensão do grego, sem explicar antecipadamente se a mudança ocorreu nas palavras, no vínculo conjugal ou na realidade vivida.
- issue: Forma da citação de Gênesis 2:23
  choice: osso dos meus ossos e carne da minha carne
  alternative: osso dos meus ossos e carne da minha carne, conforme uma versão bíblica específica
  rationale: A tradução segue diretamente a forma citada no texto grego de 1 Clemente, evitando harmonização com uma tradição portuguesa particular.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. A tradução conserva a concisão e a ambiguidade retórica do original.
