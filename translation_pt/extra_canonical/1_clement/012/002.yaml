review_pass:
  verdict: revise
  source_fidelity: A redação transmite adequadamente a missão de espionagem, a ordem de captura e a finalidade de morte. Contudo, o grego abre com uma construção passiva («tendo sido enviados espiões por Josué»), enquanto o rascunho torna Josué sujeito ativo. Além disso, «a terra do seu povo» explicita «povo», termo que não está no original, e resolve de modo mais forte do que necessário a referência de αὐτῶν.
  naturalness: A tradução é clara e tem registro apropriado. A forma passiva inicial também é natural em português e reproduz melhor a ênfase da construção grega.
  terminology: «Josué, filho de Num», «espiões/espionar», «prendê-los» e «fossem mortos» são escolhas adequadas. «O rei da terra» corresponde diretamente a ὁ βασιλεὺς τῆς γῆς; não é necessário o demonstrativo «daquela».
  issues:
  - severity: medium
    issue: A voz passiva inicial foi alterada para uma oração ativa.
    rationale: 'ἐκπεμφθέντων ... κατασκόπων é literalmente uma construção passiva: os espiões foram enviados por Josué. A mudança não altera substancialmente o sentido, mas reduz a correspondência formal sem ganho necessário.'
  - severity: medium
    issue: «a terra do seu povo» acrescenta «povo» e estreita a referência do pronome.
    rationale: τὴν χώραν αὐτῶν significa literalmente «a terra deles». Embora o contexto favoreça os habitantes sob o rei, o substantivo «povo» não está expresso e não deve ser acrescentado para eliminar uma ambiguidade pronominal do original.
  - severity: low
    issue: «daquela terra» introduz um demonstrativo ausente do grego.
    rationale: O artigo definido em τῆς γῆς é suficientemente reproduzido por «da terra».
  revised_text: Pois, quando espiões foram enviados por Josué, filho de Num, a Jericó, o rei da terra soube que eles tinham vindo para espionar a terra deles e enviou homens para prendê-los, a fim de que, depois de capturados, fossem mortos.
  revised_footnotes: []
