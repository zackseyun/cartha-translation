source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: pt
  text: Pois, quando espiões foram enviados por Josué, filho de Num, a Jericó, o rei da terra soube que eles tinham vindo para espionar a terra deles e enviou homens para prendê-los, a fim de que, depois de capturados, fossem mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: Josué, filho de Num
  rationale: Neste contexto, Ἰησοῦ designa Josué; a expressão semítica indica sua filiação a Num. A forma portuguesa tradicional torna a identificação imediatamente clara.
- source_word: κατασκόπων / κατασκοπεῦσαι
  choice: espiões / espionar
  rationale: Preserva a repetição lexical do grego com termos naturais no português atual.
- source_word: ὁ βασιλεὺς τῆς γῆς
  choice: o rei daquela terra
  rationale: O demonstrativo contextual soa natural em português e indica o território de Jericó sem acrescentar uma identificação ausente no texto.
- source_word: τὴν χώραν αὐτῶν
  choice: a terra do seu povo
  rationale: O pronome plural αὐτῶν retoma o grupo representado pelo rei, não os espiões. Esta formulação evita a ambiguidade enganosa que 'a terra deles' teria em português.
- source_word: τοὺς συλλημψομένους αὐτούς
  choice: para prendê-los
  rationale: Expressa naturalmente a construção participial de finalidade, mantendo a ação pretendida.
- source_word: ὅπως συλληφθέντες θανατωθῶσιν
  choice: a fim de que, depois de capturados, fossem mortos
  rationale: Conserva tanto a finalidade quanto a sequência explícita entre captura e execução.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi levemente reorganizada para fluidez, sem eliminar a repetição deliberada ligada à espionagem nem a sequência captura–morte.
