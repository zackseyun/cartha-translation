revisions:
- from: Pois, quando Josué, filho de Num, enviou espiões a Jericó, o rei daquela terra soube que eles tinham vindo espionar a terra do seu povo e mandou homens para prendê-los, a fim de que, depois de capturados, fossem mortos.
  to: Pois, quando espiões foram enviados por Josué, filho de Num, a Jericó, o rei da terra soube que eles tinham vindo para espionar a terra deles e enviou homens para prendê-los, a fim de que, depois de capturados, fossem mortos.
  rationale: A revisão restaura a voz passiva da abertura, evita acrescentar «povo» à referência de αὐτῶν e traduz diretamente a expressão «o rei da terra». Mantém-se «a terra deles» para não impor uma resolução interpretativa além da que o texto grego expressa.
