id: 1CLEM.12.6
reference: 1 Clement 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: pt
  text: 'E disseram a ela: “Será como você nos falou. Mas, quando souber que estamos chegando, reúna todos os seus debaixo do seu teto, e eles serão salvos; pois todos os que forem encontrados fora da casa perecerão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται οὕτως
  choice: Será como
  rationale: Expressa de modo natural a confirmação do acordo, sem perder a formulação futura do grego.
- source_word: ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς
  choice: Mas, quando souber que estamos chegando
  rationale: Mantém o valor temporal e eventual da construção e traduz παραγινομένους como aproximação/chegada em curso.
- source_word: πάντας τοὺς σοὺς
  choice: todos os seus
  rationale: Preserva a expressão substantivada deliberadamente ampla, que pode abranger familiares e demais pessoas ligadas a ela.
- source_word: ὑπὸ τὸ στέγος σου
  choice: debaixo do seu teto
  rationale: Conserva a imagem concreta do original e soa idiomático em português.
- source_word: διασωθήσονται
  choice: serão salvos
  rationale: O verbo indica serem conduzidos em segurança ou preservados do perigo; 'serão salvos' mantém sua força sem explicitação adicional.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Reproduz o contraste forte com διασωθήσονται e o sentido de destruição ou morte.
theological_decisions:
- issue: Alcance de πάντας τοὺς σοὺς
  choice: todos os seus
  alternative: todos os seus familiares
  rationale: A expressão grega não especifica parentesco; a tradução mantém a abrangência e a ambiguidade do texto.
- issue: Sentido de διασωθήσονται
  choice: serão salvos
  alternative: serão preservados
  rationale: No contexto, trata-se de livramento físico, mas a escolha retém o vocabulário amplo do grego sem impor uma distinção teológica ausente do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O discurso direto conserva a solenidade simples do original.
