source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: pt
  text: 'E ela disse aos homens: “Sei com toda a certeza que o Senhor Deus está entregando esta terra a vocês, pois o medo e o pavor que vocês causam caíram sobre os que habitam nela. Portanto, quando vocês a tomarem, salvem a mim e à casa de meu pai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω ἐγώ
  choice: Sei com toda a certeza
  rationale: A construção intensiva com particípio e verbo cognatos reforça a certeza do conhecimento; a formulação portuguesa preserva a ênfase sem reproduzir uma repetição pouco natural.
- source_word: παραδίδωσιν
  choice: está entregando
  rationale: O presente grego retrata a ação divina como já em curso; “entregando” conserva esse aspecto melhor que um futuro simples.
- source_word: ὁ φόβος καὶ ὁ τρόμος ὑμῶν
  choice: o medo e o pavor que vocês causam
  rationale: O genitivo ὑμῶν indica, no contexto, medo e pavor provocados pelos homens; a explicitação evita a leitura pouco natural de que eles próprios sentiam medo.
- source_word: τοῖς κατοικοῦσιν αὐτήν
  choice: sobre os seus habitantes
  rationale: Expressa de modo natural e conciso “sobre os que habitam nela”.
- source_word: διασώσατέ
  choice: salvem
  rationale: O verbo pede preservação ou resgate completo do perigo; “salvem” é corrente, claro e adequado ao pedido pela vida e pela família.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: à casa de meu pai
  rationale: “Casa” preserva a amplitude do grego οἶκος, que pode abranger família e unidade doméstica, sem restringi-lo apenas ao edifício.
theological_decisions:
- issue: Título divino κύριος ὁ θεός
  choice: o Senhor Deus
  alternative: o Senhor, o Deus
  rationale: “O Senhor Deus” é a forma portuguesa natural e preserva os dois termos do título sem introduzir uma distinção teológica não exigida pelo contexto.
- issue: Ação divina na entrega da terra
  choice: está entregando esta terra a vocês
  alternative: entregará esta terra a vocês
  rationale: Mantém o presente de παραδίδωσιν e a tensão entre uma ação divina já em curso e a tomada humana ainda futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” para leitura brasileira e internacional. A sintaxe foi tornada natural sem apagar a ênfase do grego nem a distinção temporal entre Deus estar entregando a terra e os homens virem a tomá-la.
