- source_word: Ῥαὰβ ἡ πόρνη
  choice: Raabe, a prostituta
  rationale: Conserva a identificação direta de Raabe pelo substantivo πόρνη, em formulação clara e atual.
theological_decisions:
- issue: Relação entre fé, hospitalidade e salvação
  choice: Preservar ambas como causas expressas, sem hierarquizá-las
  alternative: Interpretar a hospitalidade apenas como prova ou fruto da fé
  rationale: O texto coordena πίστιν e φιλοξενίαν com καί sob a mesma preposição causal; não cabe à tradução resolver além disso a relação teológica entre ambas.
