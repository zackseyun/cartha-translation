source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: pt
  text: Vejam[a], amados, que nessa mulher houve não apenas fé, mas também profecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Vocês veem».'
    reason: A forma grega ὁρᾶτε pode ser lida morfologicamente como imperativo ou como indicativo.
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Vejam
  rationale: O contexto exortativo e o vocativo «amados» favorecem a leitura imperativa; a nota registra a possível leitura indicativa.
- source_word: γέγονεν
  choice: houve
  rationale: O perfeito de γίνομαι expressa aqui a presença ou existência de fé e profecia na mulher. «Houve» comunica isso naturalmente em português, sem acrescentar a ideia de que tais qualidades foram meramente descobertas.
- source_word: ἐν τῇ γυναικί
  choice: nessa mulher
  rationale: Retoma de modo natural, em português, a mulher já mencionada no contexto, preservando a localização metafórica das qualidades nela.
- source_word: οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία
  choice: não apenas fé, mas também profecia
  rationale: Mantém o paralelismo enfático e os dois substantivos sem explicação interpretativa adicional.
theological_decisions:
- issue: Atribuição de fé e profecia à mulher
  choice: Manter ambas como realidades presentes nela
  alternative: Interpretar «profecia» apenas como cumprimento objetivo de suas palavras
  rationale: O grego afirma diretamente que nela houve não só fé, mas também profecia; não especifica uma teoria sobre a natureza ou o modo dessa profecia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. «Amados» preserva o tom pastoral; «houve» evita o artificial «veio a existir» sem apagar o valor existencial do verbo grego.
