revisions:
- from: 'Mas, quando os enviados do rei se apresentaram e disseram: “Os espiões da nossa terra entraram na sua casa. Faça-os sair, pois assim ordena o rei”, ela respondeu: “Os homens que vocês procuram de fato vieram à minha casa, mas partiram imediatamente e estão seguindo pela estrada”, enquanto lhes indicava outra direção.'
  to: 'Mas, quando os homens do rei se apresentaram e disseram: “Os espiões da nossa terra vieram até você; faça-os sair, pois assim ordena o rei”, ela respondeu: “Os homens que vocês procuram de fato vieram até mim, mas partiram imediatamente e seguem pela estrada”, enquanto lhes indicava outra direção.'
  rationale: A revisão remove duas explicitações sem apoio direto — a função de «enviados» e a referência à «casa» — e conserva o sentido narrativo, o registro e a ambiguidade do trecho final afetado por provável corrupção textual no testemunho fornecido.
  reviewer_model: gpt-5.6-terra
