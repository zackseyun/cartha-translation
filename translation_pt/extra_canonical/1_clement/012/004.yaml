base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: pt
  text: 'Mas, quando os homens do rei se apresentaram e disseram: “Os espiões da nossa terra vieram até você; faça-os sair, pois assim ordena o rei”, ela respondeu: “Os homens que vocês procuram de fato vieram até mim, mas partiram imediatamente e seguem pela estrada”, enquanto lhes indicava outra direção.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: se apresentaram
  rationale: Expressa o ato de aproximar-se e postar-se diante de alguém, com mais naturalidade em português do que uma reprodução literal como “ficaram de pé ao lado”.
- source_word: τῶν περὶ τοῦ βασιλέως
  choice: os enviados do rei
  rationale: A expressão designa os que pertenciam ao círculo ou serviço do rei; “enviados” comunica naturalmente sua função no contexto sem especificar um cargo não declarado.
- source_word: κατάσκοποι
  choice: espiões
  rationale: Equivalente corrente para pessoas enviadas secretamente a observar uma terra.
- source_word: πρὸς σὲ / πρὸς με
  choice: na sua casa / à minha casa
  rationale: O grego diz literalmente “a você/mim”, mas o contexto é a entrada no local onde Raabe os recebeu; a explicitação locativa torna a fala natural e clara em português.
- source_word: ὑποδεικνύουσα αὐτοῖς
  choice: lhes indicava
  rationale: Preserva a ação simultânea expressa pelo particípio presente e o sentido de mostrar uma direção.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com discurso direto natural. A formulação preserva a tensão narrativa da resposta enganosa de Raabe sem acrescentar avaliação moral ou explicação teológica. O trecho final do texto grego fornecido apresenta uma forma aparentemente corrompida por OCR (“ἐνλλάξις”); a tradução segue o sentido contextual atestado pela camada inglesa auditada: ela indicava aos oficiais uma direção diferente.'
