review_pass:
  verdict: revise
  source_fidelity: A tradução capta adequadamente a ação concluída de προσέθεντο ... δοῦναι como “deram-lhe”, o futuro de ἔσται e a dupla qualificação “creem e esperam em Deus”. Contudo, ὅπως com o subjuntivo ἐκκρεμάσῃ expressa mais diretamente finalidade (“para que ... pendurasse”) do que a formulação modal “ela deveria pendurar”.
  naturalness: O texto é claro e de registro apropriado. “Para que ela pendurasse” torna a relação sintática explícita e natural. “Do lado de fora de sua casa” comunica de modo idiomático a ideia de suspensão para fora expressa por ἐκ ... οἴκου.
  terminology: “Sinal”, “escarlate”, “sangue do Senhor” e “redenção” são escolhas adequadas. “Algo escarlate” preserva corretamente a indeterminação do adjetivo substantivado κόκκινον, sem acrescentar “cordão”.
  issues:
  - severity: low
    issue: A oração “ela deveria pendurar” enfraquece a construção de finalidade ὅπως ... ἐκκρεμάσῃ.
    rationale: O grego apresenta o sinal dado com o propósito de que ela pendurasse o objeto escarlate; “para que ela pendurasse” reflete essa relação sem introduzir desnecessariamente uma nuance de dever.
  - severity: low
    issue: A nota alternativa “prosseguiram, dando-lhe um sinal” não representa bem o infinitivo aoristo δοῦναι.
    rationale: A construção semitizante pode ter a nuance de ação adicional ou continuada, mas a alternativa proposta em português fica aspectualmente imprecisa. Uma nota com “ainda lhe deram” é mais clara e não sugere uma ação incompleta.
  revised_text: E deram-lhe um sinal[a], para que ela pendurasse algo escarlate do lado de fora de sua casa, deixando claro que, pelo sangue do Senhor, haverá redenção para todos os que creem e esperam em Deus.
