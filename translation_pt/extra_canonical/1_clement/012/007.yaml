reference: 1 Clement 12:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ προσέθεντο αὐτῇ δοῦναι σημεῖον, ὅπως ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς κόκκινον, πρόδηλον ποιοῦντες, ὅτι διὰ τοῦ αἵματος τοῦ κυρίου λύτρωσις ἔσται πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: pt
  text: E deram-lhe um sinal[a], para que ela pendurasse algo escarlate do lado de fora de sua casa, deixando claro que, pelo sangue do Senhor, haverá redenção para todos os que creem e esperam em Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ainda lhe deram um sinal”.'
    reason: A construção grega προσέθεντο ... δοῦναι, de sabor semítico, pode realçar que a ação foi acrescentada ou prosseguiu; a tradução principal direta é a mais natural em português.
lexical_decisions:
- source_word: προσέθεντο αὐτῇ δοῦναι
  choice: deram-lhe
  rationale: A construção de sabor semítico pode significar que eles passaram a fazer ou fizeram ainda algo. Em português, a forma direta comunica naturalmente a ação concluída, sem introduzir uma ideia futura ausente do infinitivo aoristo.
- source_word: σημεῖον
  choice: sinal
  rationale: Equivalente direto que preserva tanto a função de marca identificadora como seu valor simbólico.
- source_word: ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς
  choice: pendurar ... para fora de sua casa
  rationale: Expressa com clareza o movimento de deixar o objeto suspenso do lado de fora da casa.
- source_word: κόκκινον
  choice: algo escarlate
  rationale: O adjetivo substantivado designa algo de cor escarlate, mas o grego não explicita se era cordão, fio ou tecido; 'algo' preserva essa indeterminação.
- source_word: πρόδηλον ποιοῦντες
  choice: Assim deixaram claro
  rationale: Reproduz o sentido explicativo do particípio sem criar uma oração excessivamente pesada em português.
- source_word: λύτρωσις
  choice: redenção
  rationale: Mantém o termo teológico tradicional e o sentido de libertação mediante resgate.
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: creem e esperam em Deus
  rationale: Preserva os dois verbos coordenados e Deus como objeto tanto da fé quanto da esperança.
theological_decisions:
- issue: Relação tipológica entre o escarlate e o sangue do Senhor
  choice: 'Manter explicitamente a afirmação interpretativa do autor: ''pelo sangue do Senhor'''
  alternative: Atenuar a frase como mera comparação ou símbolo possível
  rationale: O texto grego apresenta essa relação como algo tornado claro pelos homens, não como hipótese; a tradução deve preservar a leitura tipológica do autor sem ampliá-la.
- issue: Tempo e alcance de ἔσται πᾶσι
  choice: “haverá redenção para todos”
  alternative: “há redenção para todos”
  rationale: O futuro ἔσται deve ser preservado, assim como o alcance universal qualificado pela oração 'os que creem e esperam em Deus'.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. Evitou-se acrescentar 'cordão', pois o objeto não é especificado no grego; 'algo escarlate' torna explícita apenas a substantivação necessária em português.
