base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/003.yaml
  text: So the hospitable Rahab welcomed them and hid them in the upper room under the stalks of flax[a].
translation:
  language: pt
  text: Assim, a hospitaleira Raabe os recebeu e os escondeu no aposento superior, debaixo dos talos de linho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, Raabe, sendo hospitaleira, recebeu-os e os escondeu no aposento superior, debaixo dos talos de linho”.'
    reason: Registra a possibilidade de entender φιλόξενος com valor circunstancial, embora a construção grega favoreça o adjetivo atributivo “a hospitaleira Raabe”.
lexical_decisions:
- source_word: φιλόξενος
  choice: hospitaleira
  rationale: Preserva o adjetivo atributivo e seu valor quase epitético em ἡ φιλόξενος Ῥαὰβ, além do sentido de acolher estrangeiros ou hóspedes.
- source_word: εἰσδεξαμένη
  choice: recebeu
  rationale: Expressa naturalmente em português o acolhimento dos homens por Raabe; a coordenação verbal evita uma construção participial pesada.
- source_word: ὑπερῷον
  choice: quarto de cima
  rationale: Designa o cômodo situado na parte superior da casa sem impor a ideia moderna e mais específica de um segundo andar.
- source_word: λινοκαλάμην
  choice: talos de linho
  rationale: Refere-se aos caules ou talos da planta do linho sob os quais os homens foram escondidos.
