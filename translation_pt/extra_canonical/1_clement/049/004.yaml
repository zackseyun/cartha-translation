  yaml_path: translation/extra_canonical/1_clement/049/004.yaml
  text: The height to which love leads is beyond telling.
translation:
  language: pt
  text: A altura à qual o amor conduz é indescritível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: A altura
  rationale: Reproduz diretamente a imagem espacial do grego, mantendo seu sentido elevado sem explicá-lo além do texto.
- source_word: εἰς ὃ ἀνάγει
  choice: à qual [...] conduz
  rationale: Preserva o movimento para um destino expresso por εἰς e traduz ἀνάγει naturalmente, sem acrescentar um objeto como “nos”, ausente no grego.
- source_word: ἡ ἀγάπη
  choice: o amor
  rationale: Equivalente corrente e digno para ἀγάπη neste contexto.
- source_word: ἀνεκδιήγητόν
  choice: indescritível
  rationale: Expressa aquilo que não pode ser plenamente relatado ou exposto em palavras; é conciso e natural em português.
theological_decisions:
- issue: Objeto não expresso de ἀνάγει
  choice: Não acrescentar “nos”
  alternative: “A altura à qual o amor nos eleva...”
  rationale: O verbo grego não explicita o objeto. O português permite conservar essa abertura com “conduz”, evitando identificar silenciosamente quem ou o que é conduzido.
- issue: Valor de ἀνάγει
  choice: “conduz”
  alternative: “eleva”
  rationale: “Conduz” mantém a ideia de levar a um destino e evita tornar exclusivamente vertical uma forma verbal que, embora possa sugerir subida, funciona aqui com εἰς ὃ como movimento para um ponto alcançado.
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve próxima à formulação grega. Nenhuma nota de rodapé é necessária.
