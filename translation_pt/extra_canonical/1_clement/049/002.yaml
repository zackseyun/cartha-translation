theological_decisions:
- issue: Sentido do genitivo τοῦ θεοῦ em τῆς ἀγάπης τοῦ θεοῦ
  choice: amor de Deus
  alternative: amor por Deus
  rationale: A construção grega admite formalmente mais de uma relação, e a tradução tradicional e contextual mais provável entende Deus como fonte ou possuidor do amor. A formulação portuguesa conserva alguma abertura sem acrescentar uma interpretação denominacional.
