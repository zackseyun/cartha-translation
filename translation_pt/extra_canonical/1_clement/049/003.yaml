  text: Quem é capaz de expressar a majestade da sua beleza?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem é suficiente para declarar a grandeza da beleza dele?”'
    reason: Registra alternativas mais formais e literais para τίς ἀρκετός, ἐξειπεῖν e μεγαλεῖον, além de tornar explícito o gênero masculino de αὐτοῦ.
lexical_decisions:
- source_word: τὸ μεγαλεῖον
  choice: a majestade
  rationale: O substantivo designa grandeza, magnificência ou majestade; neste contexto retórico elevado, “majestade” comunica melhor sua força do que o termo genérico “grandeza”.
- source_word: τῆς καλλονῆς
  choice: da sua beleza
  rationale: καλλονή denota beleza, especialmente em seu esplendor; a formulação mantém a relação genitiva e o tom elevado.
- source_word: τίς ἀρκετὸς
  choice: Quem é capaz
  rationale: Expressa naturalmente em português a ideia de ser suficiente ou estar à altura da tarefa.
- source_word: ἐξειπεῖν
  choice: expressar
  rationale: O infinitivo pode significar expor plenamente, declarar ou descrever; “expressar” preserva a ideia de pôr em palavras, sem sugerir necessariamente proclamação pública.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: sua
  alternative: dele
  rationale: O pronome grego é masculino singular e, no contexto, retoma o amor personificado. “Sua” mantém a referência sem acrescentar uma identificação teológica não explicitada neste versículo; a possível ambiguidade possessiva do português é esclarecida pela nota.
translation_notes:
  register: Português moderno, digno e retórico, com leitura natural no Brasil e compreensão internacional. A pergunta conserva o caráter admirativo do grego.
