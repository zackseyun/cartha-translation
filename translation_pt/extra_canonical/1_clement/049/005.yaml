  source_fidelity: 'A tradução acompanha de perto o grego: mantém a repetição enfática de «amor», as imagens de «cobrir» pecados, a dupla ideia de suportar e ser paciente, e a afirmação passiva de que os eleitos foram aperfeiçoados. «Não admite divisão», porém, desloca levemente «ἀγάπη σχίσμα οὐκ ἔχει» (“o amor não tem divisão/cisma”) para uma ideia de permissão ou tolerância.'
