  terminology: «Eleitos», «aperfeiçoados», «facções», «harmonia» e «agradável a Deus» são escolhas apropriadas e não impõem interpretações teológicas adicionais. «Divisão» evita corretamente a conotação técnica exclusiva que «cisma» pode ter.
