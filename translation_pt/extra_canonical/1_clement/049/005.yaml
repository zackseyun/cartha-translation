id: 1CLEM.49.5
reference: 1 Clement 49:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: pt
  text: O amor nos une a Deus; o amor cobre uma multidão de pecados; o amor tudo suporta, em tudo é paciente. No amor não há nada grosseiro, nada arrogante. O amor não tem divisão; o amor não provoca facções; o amor faz tudo em harmonia. No amor, todos os eleitos de Deus foram aperfeiçoados; sem amor, nada é agradável a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾷ
  choice: une
  rationale: Expressa de modo natural a ideia de ligar estreitamente ou fazer aderir, sem a estranheza de uma tradução literal como “cola”.
- source_word: καλύπτει
  choice: cobre
  rationale: Preserva a metáfora tradicional e a provável ressonância de Provérbios 10:12 e 1 Pedro 4:8.
- source_word: ἀνέχεται
  choice: suporta
  rationale: Mantém o sentido de aguentar, tolerar ou perseverar diante de todas as coisas.
- source_word: μακροθυμεῖ
  choice: é paciente
  rationale: Comunica em português corrente a ideia de longanimidade e paciência prolongada.
- source_word: βάναυσον
  choice: grosseiro
  rationale: O adjetivo pode indicar o que é vulgar, vil ou indigno; “grosseiro” preserva a amplitude moral e social sem especificação excessiva.
- source_word: σχίσμα
  choice: divisão
  rationale: Transmite claramente o sentido de ruptura ou cisão, evitando que “cisma” seja entendido apenas como termo técnico eclesiástico.
- source_word: στασιάζει
  choice: provoca facções
  rationale: Representa a ação de criar dissensão partidária ou rebelde, distinguindo-a da simples divisão mencionada antes.
- source_word: ὁμονοίᾳ
  choice: harmonia
  rationale: Expressa a concordância de mente e propósito em linguagem natural e digna.
- source_word: ἐτελειώθησαν
  choice: foram aperfeiçoados
  rationale: Preserva o aspecto passivo e a ideia de serem levados à plenitude ou maturidade, sem reduzir o termo a mera conclusão temporal.
- source_word: ἐκλεκτοὶ
  choice: eleitos
  rationale: Equivalente tradicional e direto para os escolhidos de Deus.
- source_word: εὐάρεστόν
  choice: agradável
  rationale: Reproduz de maneira direta aquilo que encontra aprovação ou agrado diante de Deus.
theological_decisions:
- issue: Sentido de ἐτελειώθησαν no amor
  choice: foram aperfeiçoados
  alternative: alcançaram a plenitude
  rationale: A forma passiva foi mantida e não se definiu se a perfeição é moral, espiritual, escatológica ou martirial; assim se preserva a amplitude teológica do grego.
- issue: Relação entre amor e pecados em καλύπτει
  choice: cobre uma multidão de pecados
  alternative: perdoa muitos pecados
  rationale: A metáfora do texto foi preservada sem identificar explicitamente “cobrir” com perdão divino, ocultação ou restauração comunitária.
- issue: Identidade dos eleitos de Deus
  choice: todos os eleitos de Deus
  alternative: todos os escolhidos por Deus
  rationale: Mantém a formulação do autor sem restringir o grupo a uma categoria denominacional ou a uma doutrina posterior específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição enfática de “o amor” e a estrutura sentenciosa do grego foram preservadas. Preferiu-se clareza corrente sem apagar metáforas, paralelismos ou tensões teológicas.
