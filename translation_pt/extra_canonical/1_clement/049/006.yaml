source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: pt
  text: O Soberano nos acolheu em amor; por causa do amor que tinha por nós, Jesus, o Messias, nosso Senhor, deu seu sangue por nós segundo a vontade de Deus, sua carne por nossa carne e sua alma por nossas almas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua vida por nossas vidas”.
    reason: ψυχή pode designar tanto a alma quanto a vida; o texto principal preserva o paralelismo com “carne”, e a nota registra a alternativa contextual.
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente corrente e digno, repetido para preservar a ligação retórica entre as duas orações.
- source_word: προσελάβετο
  choice: acolheu
  rationale: Expressa receber alguém favoravelmente ou para junto de si, com naturalidade em português.
- source_word: δεσπότης
  choice: Soberano
  rationale: Preserva a ideia de autoridade e domínio própria de δεσπότης, distinguindo-a de κύριος no mesmo versículo.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, tornando explícito seu sentido messiânico sem tratá-lo apenas como sobrenome.
- source_word: ἐν θελήματι θεοῦ
  choice: segundo a vontade de Deus
  rationale: Formulação portuguesa natural que comunica conformidade com a vontade divina sem acrescentar uma teoria causal.
- source_word: σάρξ
  choice: carne
  rationale: Mantém o termo antropológico concreto e a simetria deliberada com 'nossa carne'.
- source_word: ψυχή
  choice: alma
  rationale: Preserva o paralelismo antropológico explícito 'carne por carne, alma por almas'; a possibilidade contextual de 'vida' é registrada em nota.
theological_decisions:
- issue: Sentido de ὑπέρ na entrega do sangue, da carne e da alma
  choice: por
  alternative: em lugar de
  rationale: A preposição portuguesa 'por' mantém aberta a amplitude do grego, que pode indicar benefício, representação ou substituição, sem impor uma formulação expiatória mais estreita.
- issue: Valor de ψυχή no paralelismo final
  choice: alma por nossas almas
  alternative: vida por nossas vidas
  rationale: O paralelismo com σάρξ favorece a conservação de 'alma', embora ψυχή também possa significar 'vida'; essa ambiguidade legítima é preservada por nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “amor”, “carne” e “alma” conserva a estrutura retórica do grego; “Soberano” e “Senhor” distinguem δεσπότης de κύριος.
