source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἔχων ἀγάπην ἐν Χριστῷ ποιησάτω τὰ τοῦ Χριστοῦ παραγγέλματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/001.yaml
  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: pt
  text: Quem tem amor em Cristo cumpra os mandamentos de Cristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἔχων
  choice: Quem tem
  rationale: Reproduz de modo natural em português a construção substantivada grega, com sentido geral.
- source_word: ἀγάπην ἐν Χριστῷ
  choice: amor em Cristo
  rationale: Mantém a formulação e a possível amplitude da relação expressa por ἐν, sem reduzi-la a uma interpretação mais específica.
- source_word: ποιησάτω
  choice: cumpra
  rationale: O imperativo aoristo de ποιέω, aplicado a mandamentos, pede que a pessoa os ponha em prática; “cumpra” é idiomático e preserva a força exortativa.
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  choice: os mandamentos de Cristo
  rationale: Traduz diretamente a relação genitiva e usa o termo português corrente para instruções dotadas de autoridade.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: “Cristo” preserva a forma tradicional e natural em português neste escrito cristão, sem negar o sentido titular de “Messias”.
- issue: Sentido de ἐν Χριστῷ
  choice: em Cristo
  alternative: por Cristo / no âmbito de Cristo
  rationale: A tradução formal conserva a ambiguidade genuína da expressão grega quanto à esfera, união ou referência cristológica.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa e exortativa. Não há marcadores de nota, pois nenhuma nota é necessária.
