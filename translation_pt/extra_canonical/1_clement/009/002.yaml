  text: ἀτενίσωμεν εἰς τοὺς τελείως λειτουργήσαντας τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/002.yaml
  text: Let us fix our gaze on those who served perfectly in his majestic glory.
translation:
  language: pt
  text: Fixemos o olhar naqueles que serviram de modo perfeito à sua glória majestosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Fixemos o olhar
  rationale: Expressa a atenção intensa e deliberada do verbo grego em português natural e digno.
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: naqueles que serviram de modo perfeito
  rationale: “Serviram” comunica o sentido amplo de λειτουργέω sem restringi-lo indevidamente a um ministério formal; “de modo perfeito” preserva o valor adverbial de τελείως.
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: à sua glória majestosa
  rationale: O dativo pode indicar o objeto ou âmbito do serviço. Neste contexto, “servir à sua glória majestosa” é idiomático e mantém a estreita relação sintática sem acrescentar uma preposição locativa ausente no grego.
theological_decisions:
- issue: Relação do serviço com a glória divina no dativo
  choice: à sua glória majestosa
  alternative: em sua glória majestosa
  rationale: O grego admite alguma flexibilidade na função do dativo. A tradução escolhida entende a glória como aquilo a que o serviço é prestado, sem desenvolver uma interpretação teológica além do texto; a leitura de âmbito permanece possível, mas é menos natural nesta formulação portuguesa.
translation_notes:
  register: Português moderno, claro e solene, com forma exortativa inclusiva. Evitou-se “ministraram”, que poderia sugerir um ofício eclesiástico técnico não exigido pelo contexto.
