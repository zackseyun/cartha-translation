source:
  edition: Funk 1901 (normalized OCR)
  text: Νῶε πιστὸς εὑρεθεὶς διὰ τῆς λειτουργίας αὐτοῦ παλιγγενεσίαν κόσμῳ ἐκήρυξεν, καὶ διέσωσεν δι’ αὐτοῦ ὁ δεσπότης τὰ εἰσελθόντα ἐν ὁμοίᾳ ζῷα εἰς τὴν κιβωτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: pt
  text: Noé, tendo sido reconhecido fiel, por meio de seu serviço proclamou ao mundo a regeneração; e, por meio dele, o Soberano preservou os animais que entraram na arca em concórdia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em harmonia”.
    reason: ἐν ὁμονοίᾳ expressa concórdia ou harmonia; não acrescenta a noção de entrada “aos pares”.
lexical_decisions:
- source_word: λειτουργίας
  choice: serviço
  rationale: No contexto, designa a atuação ou serviço de Noé; “ministério” seria possível, mas pode sugerir uma função eclesiástica mais específica do que o grego exige.
- source_word: παλιγγενεσίαν
  choice: regeneração
  rationale: Preserva o sentido forte de renovação ou novo começo do mundo após o dilúvio, sem reduzir o termo a mera sobrevivência.
- source_word: ὁ δεσπότης
  choice: o Soberano
  rationale: Expressa autoridade e domínio, mantendo o título reverente sem a conotação moderna negativa que “déspota” costuma ter.
- source_word: διέσωσεν
  choice: preservou
  rationale: No contexto do dilúvio, indica que os animais foram conduzidos em segurança e conservados vivos; “salvou” também seria possível.
- source_word: ζῷα
  choice: animais
  rationale: É a forma natural em português para os seres vivos que entraram na arca.
- source_word: ἐν ὁμονοίᾳ
  choice: em harmonia
  rationale: A leitura grega reconhecida significa concórdia ou harmonia e não contém expressão explícita equivalente a “aos pares”.
theological_decisions:
- issue: Sentido de παλιγγενεσία aplicado ao mundo
  choice: regeneração
  alternative: renovação
  rationale: Mantém a linguagem teologicamente carregada do original e sua possível referência a um novo começo da criação, sem explicar além do que Clemente afirma.
- issue: Agente da preservação
  choice: “por meio dele, o Soberano preservou”
  alternative: “ele preservou, por meio do Soberano”
  rationale: A sintaxe grega faz de “o Soberano” o sujeito e de Noé o agente intermediário.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego sem rigidez excessiva. “Tendo sido considerado fiel” conserva a forma participial e passiva; o ponto e vírgula separa as duas afirmações principais.
