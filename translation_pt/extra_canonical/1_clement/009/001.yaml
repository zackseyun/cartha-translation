id: 1CLEM.9.1
reference: 1 Clement 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: pt
  text: Portanto, obedeçamos à sua majestosa e gloriosa vontade e, tornando-nos suplicantes de sua misericórdia e bondade,[a] prostremo-nos diante dele e voltemo-nos para as suas misericórdias, abandonando o esforço inútil, a discórdia e o ciúme que conduz à morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suplicantes por sua misericórdia e bondade”.'
    reason: 'Explicita em português o sentido objetivo provável dos genitivos gregos: a misericórdia e a bondade são aquilo que os suplicantes buscam.'
lexical_decisions:
- source_word: βουλήσει
  choice: vontade
  rationale: O dativo designa aquilo a que se deve obedecer; “vontade” preserva o sentido de intenção ou desígnio sem tornar a frase excessivamente abstrata.
- source_word: ἱκέται
  choice: suplicantes
  rationale: Expressa pessoas que se aproximam humildemente para pedir favor ou proteção, mantendo a imagem cultual e retórica do grego.
- source_word: χρηστότητος
  choice: bondade
  rationale: Termo corrente e digno que comunica benevolência e benignidade no contexto.
- source_word: οἰκτιρμούς
  choice: compaixão
  rationale: O plural grego pode ter valor intensivo; o singular coletivo é mais natural em português e preserva o sentido de ternas misericórdias.
- source_word: ματαιοπονίαν
  choice: esforço inútil
  rationale: Reproduz a composição semântica de trabalho ou empenho vão, em linguagem clara e atual.
- source_word: ἔριν
  choice: discórdia
  rationale: Comunica disputa e contenda de modo natural no contexto comunitário.
- source_word: ζῆλος
  choice: ciúme
  rationale: Neste contexto negativo, o termo indica rivalidade invejosa ou ciúme, não zelo positivo.
theological_decisions:
- issue: Sentido dos genitivos τοῦ ἐλέους καὶ τῆς χρηστότητος após ἱκέται
  choice: suplicantes por sua misericórdia e bondade
  alternative: suplicantes de sua misericórdia e bondade
  rationale: A leitura objetiva — aquilo que os suplicantes buscam — é idiomática e contextualmente provável; a nota registra a construção formal alternativa.
- issue: βουλήσει como vontade ou propósito
  choice: vontade
  alternative: propósito
  rationale: “Vontade” mantém aberta a amplitude do termo grego entre querer, decisão e desígnio, sem impor uma formulação teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a sequência exortativa do grego e evita vocabulário confessional específico.
