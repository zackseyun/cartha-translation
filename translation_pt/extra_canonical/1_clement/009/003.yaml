  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: pt
  text: Tomemos Enoque, que, tendo sido achado justo em obediência, foi levado[a], e não se encontrou a sua morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foi trasladado».
    reason: Registra uma alternativa formal para μετετέθη, verbo que denota mudança de lugar ou transferência e, na tradição de Enoque, sua remoção extraordinária.
lexical_decisions:
- source_word: λάβωμεν
  choice: Tomemos
  rationale: Mantém a exortação deliberativa e apresenta Enoque como exemplo a ser considerado.
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθείς
  choice: tendo sido achado justo em obediência
  rationale: Preserva a construção passiva e a ligação explícita entre justiça e obediência, sem especificar além do grego se a obediência é esfera, modo ou fundamento da avaliação.
- source_word: μετετέθη
  choice: foi levado
  rationale: No contexto da tradição de Enoque, comunica sua remoção extraordinária e evita a conotação burocrática moderna de «foi transferido»; a alternativa mais formal é registrada em nota.
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: sua morte não foi encontrada
  rationale: Reproduz a formulação incomum do grego e sua provável ressonância tradicional, sem substituí-la por uma explicação interpretativa como «ele não morreu».
theological_decisions:
- issue: Natureza do destino de Enoque em μετετέθη
  choice: foi levado
  alternative: foi trasladado
  rationale: A tradução indica remoção sem acrescentar explicitamente «ao céu», informação que não aparece nesta frase, preservando a concisão e a abertura do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leve solenidade adequada ao texto cristão antigo. A expressão deliberadamente incomum «sua morte não foi encontrada» foi mantida por fidelidade à forma e à alusão do original.
