review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: a fênix, única de sua espécie, vive quinhentos anos, prepara para si um ninho de incenso, mirra e outros materiais aromáticos e nele morre quando chega seu tempo. Convém, porém, manter a fênix como sujeito da aproximação da morte, como no grego, em vez de fazer «o momento» aproximar-se. A nota deve registrar de modo sóbrio a possível formulação alternativa, sem introduzir uma paráfrase interpretativa de «liberação pela morte».'
  naturalness: O texto é claro e de registro apropriado. «Quando ela já está perto de morrer» é mais idiomático em português e reproduz melhor a construção grega do que «Quando já se aproxima o momento de sua morte». «Outras substâncias aromáticas» é mais preciso que «outras especiarias», pois ἀρώματα não se limita a especiarias culinárias.
  terminology: «Ave», «fênix», «única de sua espécie», «incenso», «mirra» e «ninho» são escolhas adequadas. A nota alternativa «o fim de sua vida» acompanha o trilho de auditoria em inglês e preserva a possível atenuação de ἀπόλυσις, enquanto o texto principal retém a referência explícita a morrer.
  issues:
  - severity: low
    issue: O sujeito da aproximação foi deslocado para «o momento de sua morte».
    rationale: O grego apresenta a ave como aquela que chega/perto está de sua morte; a revisão conserva essa relação de modo natural.
  - severity: low
    issue: A nota propõe «liberação pela morte», formulação interpretativa e potencialmente ambígua.
    rationale: ἀπόλυσις pode evocar partida ou liberação, mas, nesta construção, uma nota concisa com «o fim de sua vida» é suficiente e não sobrecarrega o texto.
  - severity: low
    issue: «Outras especiarias» pode restringir indevidamente ἀρώματα.
    rationale: «Outras substâncias aromáticas» abrange adequadamente os materiais perfumados pretendidos.
