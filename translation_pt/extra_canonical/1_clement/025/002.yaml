reference: 1 Clement 25:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: pt
  text: Pois existe uma ave chamada fênix. Sendo a única de sua espécie, ela vive quinhentos anos. Quando ela já está perto de morrer[a], faz para si um ninho de incenso, mirra e outras substâncias aromáticas. Cumprido o tempo, entra nele e morre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do fim de sua vida”.'
    reason: Registra de forma concisa a possibilidade expressa por ἀπόλυσις, sem eliminar do texto principal a referência explícita ao morrer.
lexical_decisions:
- source_word: ὄρνεον
  choice: ave
  rationale: Termo português natural e abrangente para o grego, mantendo o tom digno.
- source_word: μονογενές
  choice: a única de sua espécie
  rationale: No contexto da tradição da fênix, comunica de modo claro que ela é o único exemplar de sua espécie, sem sugerir filiação ou nascimento biológico como foco da frase.
- source_word: πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  choice: se aproxima o momento de sua morte
  rationale: Preserva a referência explícita ao morrer e produz português natural; a nuance de ἀπόλυσις como partida ou liberação é registrada em nota.
- source_word: σηκόν
  choice: ninho
  rationale: Embora possa designar recinto ou abrigo, 'ninho' é a expressão contextual mais clara para a estrutura que a ave prepara e na qual entra.
- source_word: λίβανος
  choice: incenso
  rationale: Equivalente português corrente para a resina aromática, também conhecida de modo mais específico como olíbano.
- source_word: τῶν λοιπῶν ἀρωμάτων
  choice: outras especiarias
  rationale: Abrange as demais substâncias aromáticas da lista e acompanha o sentido contextual de materiais perfumados.
theological_decisions:
- issue: Nuance de ἀπόλυσις junto ao infinitivo 'morrer'
  choice: Texto principal com 'momento de sua morte' e nota sobre 'partida/liberação'
  alternative: quando já está perto de sua partida ao morrer
  rationale: Evita uma formulação artificial ou a leitura equivocada de libertação da morte, mas não elimina a imagem de partida ou liberação presente no substantivo grego.
translation_notes:
  register: Português moderno, claro e digno, com períodos moderadamente curtos. A construção mítica é apresentada sem endossá-la nem racionalizá-la. O marcador [a] aparece no ponto exato ao qual a nota se refere.
