lexical_decisions:
- source_word: ἐπισκέπτονται
  choice: consultam
  rationale: No contexto de registros escritos, expressa naturalmente a ideia de examiná-los ou verificá-los.
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  choice: os registros dos tempos
  rationale: Preserva a formulação histórica do grego, referindo-se a registros cronológicos.
- source_word: αὐτόν
  choice: ele
  rationale: Mantém o pronome masculino do grego, cujo referente é a ave mencionada no contexto anterior.
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: quando se completou o quingentésimo ano
  rationale: Reproduz com clareza a construção temporal do genitivo absoluto e a ideia de o ano chegar ao seu término.
