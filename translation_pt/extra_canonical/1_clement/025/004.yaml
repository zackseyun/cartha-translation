base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: pt
  text: E, de dia, à vista de todos, voa até o altar do sol, ali os deposita e assim parte de volta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας
  choice: durante o dia
  rationale: O genitivo temporal indica que a ação acontece de dia; esta formulação é natural e clara em português.
- source_word: βλεπόντων πάντων
  choice: à vista de todos
  rationale: Reproduz de modo idiomático a ideia de que todos presenciam a ação.
- source_word: ἐπιπτὰς ἐπὶ
  choice: voa até
  rationale: No contexto do voo da ave, expressa o movimento até o altar sem a conotação involuntária que “cai sobre” poderia sugerir em português.
- source_word: τίθησιν αὐτὰ
  choice: deposita-os ali
  rationale: Mantém a referência anafórica aos objetos mencionados no contexto anterior e traduz τίθησιν com um verbo adequado à colocação deliberada.
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: parte de volta
  rationale: Expressa naturalmente o início da viagem de retorno, preservando o sentido direcional da locução grega.
