source:
  edition: Funk 1901 (normalized OCR)
  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: pt
  text: Mas, enquanto sua carne se decompõe, nasce certo verme, o qual, alimentando-se da umidade da criatura morta, desenvolve asas. Depois, quando se torna forte, ergue aquele ninho em que estão os ossos daquele que o precedeu e, carregando-os, viaja da terra da Arábia até o Egito, para a chamada Heliópolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σηπομένης
  choice: enquanto ... se decompõe
  rationale: Expressa naturalmente o particípio presente em genitivo absoluto, indicando um processo simultâneo.
- source_word: σκώληξ τις
  choice: certo verme
  rationale: Preserva tanto o sentido de σκώληξ quanto a indefinição introduzida por τις.
- source_word: ἰκμάδος
  choice: umidade
  rationale: Equivalente direto no contexto da matéria úmida do animal morto, sem acrescentar a ideia mais específica de fluidos corporais.
- source_word: πτεροφυεῖ
  choice: cria asas
  rationale: Reproduz de modo claro o verbo que descreve o desenvolvimento ou surgimento de asas.
- source_word: γενναῖος γενόμενος
  choice: quando se torna forte
  rationale: Neste contexto, γενναῖος indica vigor ou força adquirida, não nobreza moral.
- source_word: σηκόν
  choice: ninho
  rationale: No relato da fênix, designa o receptáculo ou ninho em que permanecem os ossos; acompanha o contexto sem impor uma descrição mais específica.
- source_word: τοῦ προγεγονότος
  choice: do que existiu antes
  rationale: Mantém a referência deliberadamente indireta ao ser anterior, sem explicitar além do grego que seria a ave precedente.
- source_word: διανύει
  choice: percorre o caminho
  rationale: Comunica a ideia de completar ou atravessar uma distância, ligando naturalmente os pontos de origem e destino.
- source_word: Ἡλιούπολιν
  choice: Heliópolis
  rationale: Forma portuguesa estabelecida do nome da cidade egípcia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura sintática suficientemente próxima do grego. A oração relativa introduzida por ὃς foi preservada por meio de “o qual”, evitando transformá-la em oração coordenada. Não foi mantida a nota inglesa, pois ela registra uma formulação anterior, não uma ambiguidade real do texto grego.
