revisions:
- from: Mas, enquanto sua carne se decompõe, nasce certo verme, o qual, alimentando-se da umidade da criatura morta, cria asas. Depois, quando se torna forte, ele ergue aquele ninho onde estão os ossos do que existiu antes e, carregando-os, percorre o caminho desde a região da Arábia até o Egito, chegando à cidade chamada Heliópolis.
  to: Mas, enquanto sua carne se decompõe, nasce certo verme, o qual, alimentando-se da umidade da criatura morta, desenvolve asas. Depois, quando se torna forte, ergue aquele ninho em que estão os ossos daquele que o precedeu e, carregando-os, viaja da terra da Arábia até o Egito, para a chamada Heliópolis.
  rationale: 'A revisão mantém a sintaxe relativa e o conteúdo do original, ao mesmo tempo que torna mais exatos πτεροφυεῖ e τοῦ προγεγονότος e elimina expansões desnecessárias no trecho final. Não é necessária nota: a nota inglesa registra uma alternativa de formulação anterior, não uma ambiguidade que exija ancoragem em português.'
