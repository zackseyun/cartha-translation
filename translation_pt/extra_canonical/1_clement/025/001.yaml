source:
  edition: Funk 1901 (normalized OCR)
  text: Ἴδωμεν τὸ παράδοξον σημεῖον τὸ γινόμενον ἐν τοῖς ἀνατολικοῖς τόποις, τουτέστιν τοῖς περὶ τὴν Ἀραβίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/001.yaml
  text: Let us consider the remarkable sign that takes place in the eastern regions, that is, in the areas around Arabia.
translation:
  language: pt
  text: Consideremos o sinal extraordinário que acontece nas regiões do Oriente, isto é, nas proximidades da Arábia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδωμεν
  choice: Consideremos
  rationale: O subjuntivo exortativo convida os leitores a observar e refletir; “consideremos” exprime naturalmente essa força em português.
- source_word: παράδοξον σημεῖον
  choice: sinal extraordinário
  rationale: “Extraordinário” preserva a ideia de algo surpreendente e fora do comum, enquanto “sinal” corresponde diretamente a σημεῖον.
- source_word: γινόμενον
  choice: acontece
  rationale: O particípio presente indica algo que ocorre ou se dá; a forma verbal torna a frase fluente sem perder o aspecto presente.
- source_word: ἐν τοῖς ἀνατολικοῖς τόποις
  choice: nas regiões do Oriente
  rationale: A expressão designa lugares orientais; “regiões do Oriente” é natural, digna e evita uma formulação excessivamente literal.
- source_word: τοῖς περὶ τὴν Ἀραβίαν
  choice: nas proximidades da Arábia
  rationale: A construção περί com acusativo indica a área ao redor da Arábia; “nas proximidades” conserva essa referência geográfica sem afirmar que o fenômeno ocorre dentro dela.
