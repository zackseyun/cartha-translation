base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: pt
  text: “Para onde irei e onde me esconderei da tua presença? Se eu subir ao céu, tu estás lá; se eu for aos confins da terra, ali está a tua mão direita; se eu me deitar nos abismos, ali está o teu Espírito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: da tua presença
  rationale: Embora πρόσωπον signifique literalmente “rosto”, a expressão indica a presença da pessoa; “da tua presença” comunica naturalmente esse sentido em português.
- source_word: εἰς τὰ ἔσχατα τῆς γῆς
  choice: aos confins da terra
  rationale: Traduz a ideia espacial das partes mais remotas ou extremas da terra em linguagem corrente e digna.
- source_word: ἡ δεξιά σου
  choice: a tua mão direita
  rationale: Explicita o substantivo implícito em δεξιά e preserva a imagem bíblica, sem interpretá-la apenas como poder.
- source_word: ἐὰν καταστρωθῶ
  choice: se eu me deitar
  rationale: Mantém o sentido de deitar-se ou estender-se, sem acrescentar o objeto “cama”, ausente do texto grego.
- source_word: εἰς τὰς ἀβύσσους
  choice: nos abismos
  rationale: Preserva o plural e a imagem das profundezas insondáveis.
- source_word: τὸ πνεῦμά σου
  choice: o teu Espírito
  rationale: Mantém o termo teologicamente aberto no contexto da presença divina; a inicial maiúscula é apropriada por se referir ao Espírito de Deus.
theological_decisions:
- issue: Sentido de πρόσωπον na pergunta sobre ocultar-se de Deus
  choice: presença
  alternative: rosto
  rationale: “Presença” expressa o valor idiomático da frase sem sugerir uma definição antropomórfica da forma de Deus.
- issue: Referência de πνεῦμα
  choice: Espírito
  alternative: espírito
  rationale: O possessivo dirigido a Deus e o paralelismo com sua presença favorecem a referência ao Espírito divino, sem desenvolver além disso sua identidade ou função.
- issue: Valor da mão direita divina
  choice: preservar a imagem “mão direita”
  alternative: traduzir interpretativamente como “poder” ou “proteção”
  rationale: A imagem pode envolver alcance, poder e presença; mantê-la evita resolver indevidamente essa amplitude.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém o tom poético e solene da citação, com paralelismo claro e tratamento por “tu”, adequado ao discurso dirigido a Deus.
