id: 1CLEM.28.1
reference: 1 Clement 28:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: pt
  text: Portanto, visto que todas as coisas são vistas e ouvidas, temamos a Deus e abandonemos os desejos impuros de praticar obras más,[a] para que, por sua misericórdia, sejamos protegidos dos juízos que estão por vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os desejos impuros próprios das obras más”.'
    reason: O genitivo φαύλων ἔργων é mais naturalmente objetivo (“desejos de praticar obras más”), mas também pode ser entendido como atributivo ou relacional.
lexical_decisions:
- source_word: φοβηθῶμεν αὐτόν
  choice: temamos a Deus
  rationale: O pronome grego remete a Deus no contexto; explicitar o referente evita ambiguidade artificial em português e preserva o sentido exortativo de φοβηθῶμεν.
- source_word: ἀπολίπωμεν
  choice: abandonemos
  rationale: Expressa de modo natural a ideia de deixar para trás ou renunciar.
- source_word: μιαρὰς ἐπιθυμίας
  choice: desejos impuros
  rationale: μιαρός indica algo contaminado, impuro ou moralmente repugnante; “impuros” conserva o teor moral e cultual sem soar excessivamente coloquial.
- source_word: φαύλων ἔργων
  choice: de praticar obras más
  rationale: 'O genitivo é entendido principalmente como objetivo ou de conteúdo: desejos voltados para a realização de obras más.'
- source_word: σκεπασθῶμεν
  choice: sejamos protegidos
  rationale: O verbo significa literalmente ser coberto, mas aqui a imagem comunica abrigo e proteção; a formulação é natural em português.
- source_word: τῶν μελλόντων κριμάτων
  choice: dos juízos que estão por vir
  rationale: Preserva o plural κρίματα e o caráter futuro expresso pelo particípio μέλλοντα.
theological_decisions:
- issue: Referente de αὐτόν
  choice: Deus
  alternative: ele
  rationale: Embora o versículo isolado use um pronome, seu referente contextual é Deus. A explicitação produz português claro sem introduzir uma identificação teológica controversa.
- issue: Relação entre misericórdia e proteção
  choice: por sua misericórdia, sejamos protegidos
  alternative: sejamos cobertos com sua misericórdia
  rationale: Mantém a misericórdia divina como meio ou fundamento da proteção, conforme o dativo τῷ ἐλέει αὐτοῦ, sem definir mais precisamente a relação causal ou instrumental.
- issue: Natureza dos juízos futuros
  choice: juízos que estão por vir
  alternative: castigos futuros
  rationale: “Juízos” conserva a amplitude de κρίματα e não restringe o termo exclusivamente a punições.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A exortação na primeira pessoa do plural e a estrutura final com “para que” foram preservadas.
