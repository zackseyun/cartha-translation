  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: pt
  text: Para onde, então, alguém poderia ir, ou para onde poderia fugir daquele que abrange todas as coisas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ … ἀπέλθῃ
  choice: para onde … poderia ir
  rationale: Expressa de modo natural em português a pergunta deliberativa, preservando a ideia de destino e a nuance de possibilidade.
- source_word: ποῦ ἀποδράσῃ
  choice: para onde poderia fugir
  rationale: Mantém o paralelismo da pergunta e traduz ἀποδράσῃ pelo sentido direto de fugir ou escapar.
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: daquele que abrange todas as coisas
  rationale: Reproduz o particípio substantivado sem explicitar uma identidade além do que o grego declara; “abrange” conserva a ideia de envolver ou conter tudo.
theological_decisions:
- issue: Identidade daquele que abrange todas as coisas
  choice: daquele que abrange todas as coisas
  alternative: de Deus, que abrange todas as coisas
  rationale: O contexto aponta para Deus, mas o versículo usa uma expressão participial, não o nome θεός; a tradução preserva essa forma e evita explicitação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com construção interrogativa natural e paralelismo próximo ao grego.
