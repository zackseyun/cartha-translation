base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: pt
  text: 'Pois onde poderá qualquer um de nós fugir da sua mão poderosa? Ou que mundo acolherá algum dos que desertam dele? Pois a Escritura diz em certo lugar:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιᾶς χειρὸς
  choice: mão poderosa
  rationale: Reproduz de modo natural a imagem bíblica da mão forte ou poderosa, preservando a ideia de poder irresistível.
- source_word: κόσμος
  choice: mundo
  rationale: Mantém o sentido amplo e a formulação retórica do grego, sem restringi-lo a lugar, região ou ordem criada.
- source_word: αὐτομολούντων
  choice: que desertar
  rationale: O verbo é usado para quem abandona um lado e passa ao outro; “desertar” conserva a força de deslealdade e fuga presente no termo.
- source_word: τὸ γραφεῖον
  choice: a Escritura
  rationale: No contexto introdutório de uma citação bíblica, refere-se ao texto escrito de autoridade; “a Escritura” é claro e idiomático em português.
- source_word: λέγει γάρ που
  choice: Pois em certo lugar ... diz
  rationale: Preserva tanto a conexão explicativa de γάρ quanto a referência indefinida de που, sem tentar identificar antecipadamente a passagem.
theological_decisions:
- issue: Referente dos pronomes masculinos αὐτοῦ
  choice: dele / sua, com referente implícito em Deus
  alternative: explicitar “de Deus”
  rationale: O contexto torna o referente suficientemente claro, e a manutenção dos pronomes evita acrescentar uma explicitação ausente no grego.
- issue: Força moral de αὐτομολούντων
  choice: “desertar dele”
  alternative: “fugir dele” ou “abandoná-lo”
  rationale: “Desertar” preserva a metáfora de mudança desleal de lealdade sem desenvolver uma doutrina específica sobre apostasia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de perguntas retóricas e os conectivos do grego foram preservados; os dois-pontos introduzem a citação que vem no versículo seguinte.
