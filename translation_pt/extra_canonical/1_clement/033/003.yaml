source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: pt
  text: Pois, por seu poder imensamente grande, ele firmou os céus e, por sua incompreensível sabedoria, os ordenou. Separou também a terra da água que a circunda e a assentou sobre o seguro fundamento de seu próprio propósito. Aos seres vivos que se movem nela, ordenou que existissem segundo sua própria ordenação. Depois de preparar o mar e os seres vivos que nele há, confinou o mar por seu próprio poder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “confinou-o”; o objeto não é repetido no grego e se refere mais naturalmente ao mar.
    reason: Registra a elipse do objeto no grego sem estender artificialmente a ação aos seres vivos.
lexical_decisions:
- source_word: παμμεγεθεστάτῳ ... κράτει
  choice: poder imensuravelmente grande
  rationale: Expressa o superlativo intensivo de παμμεγεθέστατος e a força soberana de κράτος em português natural e solene.
- source_word: ἐστήριξεν
  choice: firmou
  rationale: Conserva a ideia de estabelecer com firmeza, sem acrescentar a noção de criação do nada.
- source_word: διεκύβευσεν
  choice: governou
  rationale: O verbo evoca dirigir ou pilotar; “governou” preserva essa imagem de administração sábia melhor que uma simples referência à organização.
- source_word: βουλήματος
  choice: propósito
  rationale: Representa a ideia de desígnio ou intenção deliberada sem impor uma formulação doutrinária específica.
- source_word: διατάξει
  choice: determinação
  rationale: Comunica uma disposição ou ordem estabelecida pela autoridade divina.
- source_word: ἐνέκλεισεν
  choice: encerrou-os
  rationale: Mantém o sentido básico de fechar ou confinar e permite que o objeto retome, como no grego, o conjunto recém-mencionado do mar e dos seres vivos.
theological_decisions:
- issue: O fundamento da terra como βούλημα divino
  choice: fundamento seguro de seu próprio propósito
  alternative: fundamento seguro de sua própria vontade
  rationale: “Propósito” mantém a linguagem figurada e ressalta o desígnio divino sem transformar a frase em uma afirmação técnica sobre a vontade de Deus.
- issue: Objeto implícito de ἐνέκλεισεν
  choice: encerrou-os, retomando o mar e os seres vivos nele
  alternative: confinou o mar
  rationale: O grego não repete um objeto expresso depois do particípio que rege “o mar e os seres vivos”; a tradução conserva essa amplitude sintática, enquanto a nota registra a leitura contextual mais restrita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência literária moderada. Emprega “firmou”, “governou” e “assentou” para conservar as imagens concretas do grego sem soar arcaico.
