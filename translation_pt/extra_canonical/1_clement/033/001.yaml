id: 1CLEM.33.1
reference: 1 Clement 33:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: pt
  text: Que faremos, então, irmãos? Deixaremos de fazer o bem e abandonaremos o amor? Que o Senhor de modo nenhum permita que isso aconteça entre nós! Pelo contrário, apressemo-nos, com dedicação e prontidão, a realizar toda boa obra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: Deixaremos de fazer o bem
  rationale: Com ἀπό, ἀργέω indica cessar ou deixar uma atividade, e não apenas realizá-la com indolência.
- source_word: ὁ δεσπότης
  choice: o Senhor
  rationale: No contexto religioso, expressa a autoridade soberana do grego de forma natural e digna em português; evita a conotação social moderna de “mestre” ou “dono”.
- source_word: σπεύσωμεν
  choice: empenhemo-nos
  rationale: Comunica a exortação a agir com zelo e diligência, sem sugerir apenas velocidade física.
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: com dedicação e prontidão
  rationale: ἐκτένεια denota aplicação intensa ou dedicação, enquanto προθυμία expressa disposição pronta e zelosa.
- source_word: ἐπιτελεῖν
  choice: realizar
  rationale: Representa a ideia de levar a efeito ou cumprir plenamente cada boa obra em português corrente.
theological_decisions:
- issue: Designação divina δεσπότης
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva a referência divina e a autoridade do termo sem impor uma formulação teológica mais específica; “Soberano” seria possível, mas menos natural nesta súplica.
- issue: Força de μηδαμῶς... ἐάσει
  choice: De modo nenhum permita o Senhor
  alternative: Que o Senhor jamais permita
  rationale: Mantém a forte negação e o caráter de desejo ou súplica do enunciado, sem convertê-lo numa afirmação categórica sobre o que Deus fará.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência de perguntas retóricas e a exortação comunitária foram preservadas.
