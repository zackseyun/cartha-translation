source:
  edition: Funk 1901 (normalized OCR)
  text: ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν ἀόκνως προσέλθωμεν τῷ θελήματι αὐτοῦ· ἐξ ὅλης τῆς ἰσχύος ἡμῶν ἐργασώμεθα ἔργον δικαιοσύνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: pt
  text: Tendo, pois, este modelo, aproximemo-nos da vontade dele sem hesitação. Com toda a nossa força, realizemos a obra da justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπογραμμός
  choice: modelo
  rationale: Designa um padrão ou exemplo a ser seguido; “modelo” é natural e preserva a função exemplar do termo.
- source_word: ἀόκνως
  choice: sem hesitação
  rationale: Expressa ausência de relutância, demora ou recuo, mais precisamente do que “ansiosamente” ou “com entusiasmo”.
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: aproximemo-nos ... da vontade dele
  rationale: Mantém a imagem de movimento de προσέρχομαι e a relação com o dativo, sem reduzir a expressão simplesmente a “cumpramos”.
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: pratiquemos a obra da justiça
  rationale: Evita a repetição pouco natural “realizemos a obra”, preservando tanto a ação verbal quanto o substantivo ἔργον e o genitivo δικαιοσύνης.
theological_decisions:
- issue: Sentido de “obra da justiça”
  choice: obra da justiça
  alternative: obras justas
  rationale: O singular grego ἔργον δικαιοσύνης foi preservado, sem interpretar se se trata de uma ação coletiva, de uma conduta geral ou de obras específicas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência exortativa. “Pois” conserva a ligação argumentativa de οὖν; “dele” evita uma maiúscula interpretativa não presente no grego.
