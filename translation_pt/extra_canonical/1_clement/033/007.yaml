source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: pt
  text: Vejamos que todos os justos foram adornados com boas obras e que também o próprio Senhor, tendo se adornado com boas obras, alegrou-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Vejamos
  rationale: Preserva a exortação na primeira pessoa do plural e, no contexto, comunica o sentido de considerar ou reconhecer o fato apresentado.
- source_word: ἐν ἔργοις ἀγαθοῖς
  choice: com boas obras
  rationale: Expressa de modo natural em português o meio ou âmbito figurado pelo qual os justos e o Senhor são adornados.
- source_word: ἐκοσμήθησαν / κοσμήσας
  choice: foram adornados / tendo se adornado
  rationale: Mantém a imagem repetida do verbo κοσμέω e distingue a forma passiva aplicada aos justos da ação reflexiva atribuída ao Senhor.
- source_word: ἐχάρη
  choice: alegrou-se
  rationale: Reproduz o aoristo de χαίρω com uma forma portuguesa clara e digna.
theological_decisions:
- issue: A afirmação de que o próprio Senhor se adornou com boas obras
  choice: Manter literalmente a linguagem reflexiva e a imagem do adorno
  alternative: Atenuar para “demonstrou suas boas obras” ou identificar de modo explícito quem é “o Senhor”
  rationale: O grego atribui diretamente a ação reflexiva ao Senhor; a tradução preserva essa formulação e não impõe uma identificação ou explicação doutrinária ausente do texto.
- issue: Força de καὶ αὐτὸς δὲ ὁ κύριος
  choice: “também o próprio Senhor”
  alternative: “até o próprio Senhor”
  rationale: A opção escolhida conserva a força aditiva e a ênfase em αὐτός sem tornar necessariamente ascendente uma construção que pode ser entendida de modo simplesmente aditivo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “boas obras” e da imagem de adornar foi preservada por ser estrutural e retoricamente significativa no grego. “Tendo se adornado” mantém a anterioridade natural do particípio aoristo em relação a “alegrou-se”.
