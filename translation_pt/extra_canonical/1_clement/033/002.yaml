  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: pt
  text: Pois o próprio Criador e Senhor de todas as coisas se alegra com suas obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς
  choice: Criador
  rationale: No contexto, designa Deus como aquele que fez todas as coisas; “Criador” é natural, exato e amplamente compreensível.
- source_word: δεσπότης
  choice: Senhor
  rationale: Expressa soberania e autoridade. “Senhor” mantém o registro bíblico e digno sem a conotação moderna negativa que “déspota” teria.
- source_word: τῶν ἁπάντων
  choice: de todas as coisas
  rationale: Reproduz o alcance total da expressão grega de maneira idiomática em português.
- source_word: ἀγάλλεται
  choice: se alegra
  rationale: Comunica alegria intensa de modo natural e preserva o sentido verbal do original.
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  choice: com suas obras
  rationale: A preposição ἐπί com dativo indica aqui o motivo ou a base da alegria; “com suas obras” é uma formulação clara e natural.
theological_decisions:
- issue: Ênfase no próprio Deus como sujeito
  choice: o próprio Criador e Senhor
  alternative: o Criador e Senhor de todas as coisas em pessoa
  rationale: “O próprio” representa αὐτός de forma concisa e preserva a ênfase do grego sem tornar a frase artificial.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima ao grego e fluência natural para leitores brasileiros e internacionais.
