source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: pt
  text: 'Pois assim diz Deus: “Façamos o ser humano segundo a nossa imagem e segundo a nossa semelhança”. E Deus fez o ser humano; homem e mulher os fez.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπον
  choice: o ser humano
  rationale: Expressa o sentido genérico de humanidade no singular, evitando que o leitor moderno entenda apenas o sexo masculino.
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν
  choice: segundo a nossa imagem e segundo a nossa semelhança
  rationale: Preserva o paralelismo e a repetição das preposições do grego, sem fundir os dois termos.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homem e mulher
  rationale: Formulação natural e dignificada em português para a distinção sexual humana indicada pelo grego.
theological_decisions:
- issue: Plural deliberativo em Ποιήσωμεν e ἡμετέραν
  choice: “Façamos” e “nossa”
  alternative: Reformular no singular ou explicar o referente do plural
  rationale: Mantém a forma e a ambiguidade do texto citado, sem impor uma interpretação teológica específica.
- issue: Relação entre “imagem” e “semelhança”
  choice: Conservar ambos como termos coordenados e distintos
  alternative: Fundir em “à nossa imagem e semelhança”
  rationale: A repetição de κατά no grego favorece a preservação explícita do paralelismo, sem afirmar se há ou não uma distinção teológica entre os conceitos.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno. A pontuação distingue claramente a citação divina da continuação narrativa; o ponto e vírgula conserva a relação estreita entre a criação do ser humano e a especificação “homem e mulher”.
