id: 1CLEM.33.4
reference: 1 Clement 33:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: pt
  text: Acima de todas as coisas,[a] com suas mãos santas e puras, ele formou o ser humano — a obra mais excelente e imensamente grandiosa, segundo o seu pensamento — como a impressão de sua própria imagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o ser mais excelente e imensamente grande em entendimento».'
    reason: A expressão grega κατὰ διάνοιαν pode ser ligada alternativamente à caracterização do ser humano; a tradução principal a relaciona ao pensamento ou desígnio criador de Deus, em consonância com o contexto.
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: Acima de tudo
  rationale: Preserva o valor superlativo e a ligação com o ponto culminante da criação.
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: a obra mais excelente e imensamente grandiosa
  rationale: Os adjetivos neutros substantivados caracterizam o ser humano como o ápice ou obra culminante; “imensamente” comunica a força intensiva de παμ-.
- source_word: κατὰ διάνοιαν
  choice: segundo seu pensamento
  rationale: Tradução formalmente próxima que liga a formação humana ao pensamento ou desígnio de Deus, sem atribuir inequivocamente a διάνοια ao ser humano.
- source_word: ἄνθρωπον
  choice: o ser humano
  rationale: Expressa o sentido genérico de ἄνθρωπος em português atual sem restringi-lo ao sexo masculino.
- source_word: ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν
  choice: com suas mãos santas e imaculadas
  rationale: Mantém a imagem antropomórfica e os dois qualificativos do grego.
- source_word: ἔπλασεν
  choice: formou
  rationale: Reproduz a linguagem de modelar ou plasmar, com provável eco da narrativa da criação.
- source_word: χαρακτῆρα
  choice: marca
  rationale: Conserva a ideia de impressão ou sinal distintivo, evitando confundi-la diretamente com εἰκών, traduzido por “imagem”.
- source_word: τῆς ἑαυτοῦ εἰκόνος
  choice: de sua própria imagem
  rationale: Mantém a reflexividade enfática de ἑαυτοῦ e a formulação genitiva do original.
theological_decisions:
- issue: Referente e função de κατὰ διάνοιαν
  choice: “segundo seu pensamento”, relacionado ao agir criador de Deus e à obra formada
  alternative: “o ser mais excelente e imensamente grandioso em entendimento”, atribuindo διάνοια ao ser humano
  rationale: O neutro τὸ ἐξοχώτατον καὶ παμμέγεθες favorece a caracterização do ser humano como obra culminante, e o contexto imediato destaca a sabedoria, o desígnio e o poder de Deus na criação. A redação escolhida preserva alguma abertura sintática sem fazer da capacidade intelectual humana a leitura principal.
- issue: Sentido de χαρακτήρ em relação à imagem divina
  choice: “marca de sua própria imagem”
  alternative: “impressão de sua própria imagem” ou “expressão de sua própria imagem”
  rationale: “Marca” mantém a metáfora de uma impressão derivada sem definir em termos dogmáticos como o ser humano participa da imagem de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O travessão organiza a aposição longa e torna clara a identificação do ser humano como a obra culminante, sem apagar a densidade sintática do grego.
