  text: ταῦτα οὖν πάντα τελειώσας ἐπῄνεσεν αὐτὰ καὶ ηὐλόγησεν καὶ εἶπεν· Αὐξάνεσθε καὶ πληθύνεσθε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: pt
  text: 'Assim, tendo completado todas essas coisas, ele as elogiou, abençoou e disse: “Cresçam e multipliquem-se.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: depois de completar
  rationale: Expressa naturalmente o particípio aoristo e preserva a ideia de levar a obra à conclusão.
- source_word: ἐπῄνεσεν
  choice: elogiou
  rationale: Equivalente direto e corrente de ‘louvar, aprovar, elogiar’ neste contexto.
- source_word: ηὐλόγησεν
  choice: abençoou
  rationale: Mantém o sentido religioso comum de εὐλογέω e a ligação com a linguagem da criação.
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: Sejam fecundos e multipliquem-se
  rationale: Reproduz de modo natural e reconhecível em português a fórmula da bênção criacional citada, sem reduzir αὐξάνεσθε ao simples crescimento numérico.
theological_decisions:
- issue: Referente de αὐτά e objeto dos verbos
  choice: “as”, retomando “todas essas coisas”
  alternative: Explicitar as criaturas ou obras criadas
  rationale: O grego usa pronome neutro plural; preservar a retomada pronominal evita inserir um referente mais específico do que o texto fornece.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para o particípio grego e formulação consagrada da bênção da criação.
