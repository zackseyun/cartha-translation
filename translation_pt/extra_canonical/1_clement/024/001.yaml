id: 1CLEM.24.1
reference: 1 Clement 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: pt
  text: Consideremos, amados, como o Soberano nos mostra continuamente que a futura ressurreição acontecerá. Dessa ressurreição, ele fez do Senhor Jesus Cristo as primícias, ao ressuscitá-lo dentre os mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: Consideremos
  rationale: Exortação deliberativa natural em português, preservando o sentido de observar e refletir atentamente.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Forma vocativa tradicional, digna e amplamente compreensível.
- source_word: ὁ δεσπότης
  choice: o Soberano
  rationale: Expressa autoridade e domínio; evita confundir δεσπότης com κύριος, que aparece depois como «Senhor».
- source_word: διηνεκῶς
  choice: continuamente
  rationale: Reproduz o caráter constante da demonstração.
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  choice: que a futura ressurreição acontecerá
  rationale: Verte naturalmente a construção grega e preserva sua referência futura sem redundância artificial.
- source_word: τὴν ἀπαρχὴν
  choice: as primícias
  rationale: Mantém a metáfora cultual e agrícola de ἀπαρχή e seu sentido de primeiro exemplar de uma colheita futura.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: o Senhor Jesus Cristo
  rationale: Tradução natural do título e nome; «Cristo» preserva o título grego já estabelecido no uso português.
- source_word: ἐκ νεκρῶν ἀναστήσας
  choice: ao ressuscitá-lo dentre os mortos
  rationale: Preserva a ação causal/instrumental expressa pelo particípio e a formulação grega «dentre os mortos».
theological_decisions:
- issue: Relação de Jesus Cristo com a ressurreição futura
  choice: «fez do Senhor Jesus Cristo as primícias»
  alternative: «fez o Senhor Jesus Cristo a primícia»
  rationale: Mantém a metáfora paulina e escatológica sem explicar além do texto; o plural lexical «primícias» é idiomático em português mesmo com referente singular.
- issue: Agente da ressurreição de Jesus
  choice: «ele [...] ao ressuscitá-lo»
  alternative: «quando o ressuscitou»
  rationale: Conserva explicitamente o Soberano como agente e representa a relação participial sem impor uma nuance temporal exclusiva.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e alcance internacional. A divisão em duas frases reduz a sobrecarga sintática do período grego sem alterar suas relações lógicas. «Soberano» distingue δεσπότης de κύριος; «primícias» preserva a imagem teológica tradicional.
