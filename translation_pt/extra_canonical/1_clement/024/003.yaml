  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: pt
  text: 'O dia e a noite nos mostram uma ressurreição: a noite adormece, o dia se levanta; o dia se vai, a noite chega.'
