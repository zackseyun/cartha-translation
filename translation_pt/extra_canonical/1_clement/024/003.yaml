lexical_decisions:
- source_word: δηλοῦσιν
  choice: nos mostram
  rationale: Expressa de modo direto e natural a ideia de tornar evidente ou demonstrar.
- source_word: ἀνάστασιν
  choice: uma ressurreição
  rationale: O substantivo está sem artigo e designa aqui, por analogia, uma manifestação de ressurgimento no ciclo diário, sem perder a ligação temática com a ressurreição.
- source_word: κοιμᾶται
  choice: adormece
  rationale: Preserva a personificação da noite e o contraste com o levantar-se do dia.
- source_word: ἀνίσταται
  choice: se levanta
  rationale: Mantém a imagem concreta e a relação lexical e conceitual com ἀνάστασιν.
- source_word: ἄπεισιν
  choice: se vai
  rationale: Tradução idiomática e concisa da partida do dia.
- source_word: ἐπέρχεται
  choice: chega
  rationale: Reproduz com naturalidade a aproximação ou vinda da noite.
theological_decisions:
- issue: Caráter definido ou ilustrativo de ἀνάστασιν
  choice: uma ressurreição
  alternative: a ressurreição
  rationale: O grego não traz artigo, e o contexto apresenta o ciclo do dia e da noite como exemplo ou sinal de ressurgimento. A formulação indefinida preserva essa nuance sem negar a referência temática à ressurreição futura.
