id: 1CLEM.24.5
reference: 1 Clement 24:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: pt
  text: O semeador saiu e lançou na terra cada uma das sementes. Estas, depois de caírem na terra secas e nuas, decompõem-se. Então, dessa decomposição, a grandeza da providência do Soberano as faz ressurgir; e, de uma só, muitas crescem e produzem fruto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, de uma só, ela faz crescer muitas e produz fruto”, entendendo-se “a grandeza da providência” como sujeito.'
    reason: O grego permite discutir se πλείονα é o sujeito neutro plural dos verbos no singular ou se funciona como objeto, tendo “a grandeza da providência” por sujeito.
lexical_decisions:
- source_word: ὁ σπείρων
  choice: o semeador
  rationale: Mantém a imagem agrícola e a forma substantivada do particípio grego.
- source_word: διαλύεται
  choice: decompõem-se
  rationale: Expressa a desintegração das sementes no solo sem restringir o sentido ao apodrecimento.
- source_word: ἡ μεγαλειότης τῆς προνοίας
  choice: a grandeza da providência
  rationale: Preserva a formulação abstrata e enfática do grego.
- source_word: τοῦ δεσπότου
  choice: do Soberano
  rationale: Comunica autoridade e domínio, evitando reduzir δεσπότης ao sentido moderno de patrão.
- source_word: ἀνίστησιν αὐτά
  choice: as faz ressurgir
  rationale: Conserva a linguagem de levantar/fazer surgir, importante no contexto da ressurreição, e mantém as sementes como objeto.
- source_word: ἐκ τοῦ ἑνὸς πλείονα
  choice: de uma só, muitas
  rationale: Preserva o contraste explícito entre uma unidade e a multiplicidade; o feminino retoma naturalmente 'sementes' em português.
theological_decisions:
- issue: Ressonância de ressurreição em ἀνίστησιν
  choice: as faz ressurgir
  alternative: as levanta
  rationale: O contexto usa o ciclo da semente como testemunho da ressurreição. 'Faz ressurgir' mantém essa ressonância sem abandonar a metáfora agrícola.
- issue: Sujeito de αὔξει e ἐκφέρει
  choice: muitas crescem e produzem fruto
  alternative: ela faz crescer muitas e produz fruto
  rationale: πλείονα pode funcionar como sujeito neutro plural com verbos no singular, retomando sementes ou plantas. A alternativa entende 'a grandeza da providência' como sujeito; a nota preserva essa possibilidade sintática.
translation_notes:
  register: 'Português atual, digno e de leitura ampla, com construção clara e imagens concretas. ''Soberano'' preserva a força de δεσπότης; ''secas e nuas'' mantém a expressividade do original. A pontuação separa as etapas da imagem: semeadura, decomposição e renovação.'
