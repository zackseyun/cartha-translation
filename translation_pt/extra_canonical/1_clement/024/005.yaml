  source_fidelity: 'O texto acompanha de perto a sequência e a sintaxe grega: a semeadura individual, a condição das sementes ao caírem, sua decomposição, a ação da providência do Soberano e o contraste entre «uma só» e «muitas». «As faz ressurgir» comunica adequadamente ἀνίστησιν no contexto argumentativo sobre a ressurreição. A tradução principal de ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν como «de uma só, muitas crescem e produzem fruto» é gramaticalmente defensável, pois um sujeito neutro plural pode reger verbo no singular em grego.'
  naturalness: O português é atual, claro e digno. «Secas e nuas», «decompõem-se» e «produzem fruto» soam naturais no registro literário e preservam a imagem concreta do original. A pontuação organiza bem as etapas do raciocínio.
  terminology: «Semeador», «providência», «Soberano» e «fruto» são escolhas estáveis e apropriadas. «Soberano» conserva a força de δεσπότης sem o sentido ocupacional mais restrito que «senhor» ou «patrão» pode ter em português contemporâneo.
