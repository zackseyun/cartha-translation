  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: pt
  text: 'Seis vezes ele livrará você das aflições,

    e, na sétima, mal algum tocará em você.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑξάκις
  choice: Seis vezes
  rationale: Reproduz diretamente a expressão numérica grega e preserva o paralelismo com «na sétima».
- source_word: ἐξ ἀναγκῶν
  choice: das aflições
  rationale: ἀνάγκη no plural pode indicar apertos, adversidades ou situações angustiantes; «aflições» é natural, abrangente e adequado ao registro sapiencial.
- source_word: ἐξελεῖταί σε
  choice: ele livrará você
  rationale: Expressa o sentido futuro de resgatar ou libertar alguém de uma situação adversa, mantendo o sujeito masculino implícito do grego.
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: e, na sétima
  rationale: Mantém a formulação elíptica do original, em que se subentende a sétima ocasião ou aflição.
- source_word: οὐχ ἅψεταί σου κακόν
  choice: mal algum tocará em você
  rationale: Preserva a imagem concreta de ἅπτομαι e a negação enfática em português corrente.
theological_decisions:
- issue: Identidade do sujeito de ἐξελεῖταί
  choice: Manter «ele» sem explicitar o referente
  alternative: Traduzir «Deus livrará você» ou omitir o pronome
  rationale: O trecho fornecido contém apenas um sujeito masculino implícito; nomeá-lo como Deus resolveria pelo contexto uma referência que não está expressa neste versículo.
- issue: Caráter proverbial dos números seis e sete
  choice: Conservar literalmente «seis vezes» e «na sétima»
  alternative: Parafrasear como «repetidas vezes» e «sempre»
  rationale: A sequência numérica é parte da forma poética e pode sugerir plenitude, mas a tradução não deve substituir a imagem por sua possível interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. Emprega-se «você» para o singular de segunda pessoa, favorecendo ampla legibilidade brasileira sem alterar o sentido.
