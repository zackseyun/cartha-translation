source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: pt
  text: Aceitemos a disciplina, da qual ninguém deve se ressentir, amados. A admoestação que fazemos uns aos outros é boa e extremamente proveitosa, pois nos liga à vontade de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάβωμεν παιδείαν
  choice: Aceitemos a disciplina
  rationale: O verbo ἀναλαμβάνω sugere assumir ou acolher, enquanto παιδεία, neste contexto, denota formação corretiva ou disciplina. A formulação preserva o sentido exortativo de maneira natural.
- source_word: ἀγανακτεῖν
  choice: se indignar
  rationale: Expressa ressentimento, irritação ou forte desagrado diante da disciplina; “se indignar” mantém a força do verbo sem acrescentar uma causa não explicitada.
- source_word: νουθέτησις
  choice: admoestação
  rationale: Designa instrução corretiva ou advertência dirigida à mente. “Admoestação” conserva tanto o aspecto instrutivo quanto o corretivo.
- source_word: ὑπεράγαν ὠφέλιμος
  choice: extremamente proveitosa
  rationale: Reproduz a intensificação enfática de ὑπεράγαν e o benefício expresso por ὠφέλιμος em português corrente e digno.
- source_word: κολλᾷ
  choice: une
  rationale: O verbo significa literalmente colar ou ligar estreitamente. “Une” comunica a ligação íntima sem soar artificial em português.
theological_decisions:
- issue: Natureza da παιδεία
  choice: disciplina
  alternative: instrução / correção
  rationale: “Disciplina” preserva a abrangência do termo grego, que pode envolver educação, formação e correção, sem restringi-lo apenas ao ensino ou ao castigo.
- issue: Relação expressa por κολλᾷ com a vontade de Deus
  choice: nos une à vontade de Deus
  alternative: nos mantém ligados à vontade de Deus
  rationale: O texto afirma ligação estreita, mas não especifica se ela é inicial ou contínua. “Une” conserva essa abertura e evita desenvolver uma doutrina adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem vocativa foi ajustada para maior naturalidade, sem alterar o conteúdo. Não há necessidade de notas de rodapé neste versículo.
