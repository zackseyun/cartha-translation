base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: pt
  text: 'Então você saberá que sua casa estará em paz,


    e a morada de sua tenda de modo algum falhará.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma interpretativa: “você examinará sua morada e não sentirá falta de nada”. O grego recebido, porém, formula a oração com “a morada de sua tenda” como sujeito.'
    reason: A construção grega é semanticamente difícil e admite uma interpretação contextual de inspeção e de ausência de perdas. A nota preserva essa possibilidade sem introduzir na tradução principal um verbo ausente do texto fornecido.
lexical_decisions:
- source_word: εἶτα γνώσῃ
  choice: Então você saberá
  rationale: Reproduz de modo direto e natural a sequência temporal e o futuro de γινώσκω.
- source_word: εἰρηνεύσει σου ὁ οἶκος
  choice: a sua casa estará em paz
  rationale: Expressa o sentido de εἰρηνεύω e mantém οἶκος como “casa”, incluindo por extensão a família ou o lar sem explicitar uma única leitura.
- source_word: ἡ δίαιτα τῆς σκηνῆς σου
  choice: a morada da sua tenda
  rationale: δίαιτα designa aqui morada ou habitação e forma paralelo espacial com οἶκος; “morada da sua tenda” conserva a construção grega e sua imagem.
- source_word: οὐ μὴ ἁμάρτῃ
  choice: sem dar por falta de nada
  rationale: No contexto da inspeção da morada, ἁμαρτάνω tem o sentido de errar, deixar de encontrar ou constatar uma falta; a formulação portuguesa comunica esse uso idiomático.
theological_decisions:
- issue: Sujeito e sentido da segunda oração
  choice: e examinará a morada da sua tenda sem dar por falta de nada
  alternative: e a morada da sua tenda certamente não falhará
  rationale: A sintaxe superficial grega permite tomar “a morada da sua tenda” como sujeito de ἁμάρτῃ, mas o contexto proverbial de Jó 5:24 e o sentido de “não sentir falta de nada” favorecem uma formulação idiomática com inspeção implícita. A nota preserva a leitura formalmente possível sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para clareza contemporânea. O paralelismo entre “casa” e “morada da sua tenda” foi mantido; a nota registra a ambiguidade sintática e lexical do grego.
