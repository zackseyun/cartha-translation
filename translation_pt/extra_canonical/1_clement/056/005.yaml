  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: pt
  text: “Pois”, diz [a Escritura], “uma pessoa justa me disciplinará com misericórdia e me repreenderá; mas que o óleo dos pecadores não unja a minha cabeça.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: uma pessoa justa
  rationale: O adjetivo substantivado está sem artigo no grego e, no contexto, tem sentido naturalmente genérico; a formulação também evita o masculino desnecessariamente marcado de “um homem justo”.
- source_word: παιδεύσει
  choice: me disciplinará
  rationale: Preserva a ideia de disciplina formativa e corretiva, sem reduzi-la apenas a ensino ou castigo.
- source_word: ἐν ἐλέει
  choice: com misericórdia
  rationale: Expressa de modo natural o caráter misericordioso da disciplina; “em misericórdia” seria menos idiomático em português atual.
- source_word: ἐλέγξει
  choice: me repreenderá
  rationale: No paralelismo, indica censura ou correção explícita e complementa “me disciplinará” sem duplicá-lo.
- source_word: μὴ λιπανάτω
  choice: não unja
  rationale: Embora o verbo possa significar literalmente “tornar gorduroso”, em associação com óleo e cabeça a expressão idiomática se refere a ungir.
theological_decisions:
- issue: Identidade de δίκαιος
  choice: uma pessoa justa
  alternative: o justo
  rationale: A ausência de artigo e o contexto de correção mútua favorecem uma referência genérica. A alternativa definida permanece possível e é registrada em nota, sem identificar silenciosamente a figura com Deus ou com o Messias.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe de citação preservada. A locução volitiva “mas que... não unja” representa o imperativo grego sem soar excessivamente arcaica.
