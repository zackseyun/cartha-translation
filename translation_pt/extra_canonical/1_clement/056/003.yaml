source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: pt
  text: 'Pois assim diz a palavra santa:


    “O Senhor me disciplinou severamente,


    e não me entregou à morte.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Senhor de fato me disciplinou”.'
    reason: Registra a possibilidade de representar a construção enfática por uma expressão de certeza, embora «severamente» comunique melhor sua força no contexto.
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: a palavra santa
  rationale: Mantém de perto a expressão grega e seu registro solene, sem identificar de modo mais específico a fonte citada.
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: me disciplinou severamente
  rationale: A repetição cognata, de fundo semítico, intensifica a ação; «severamente» comunica essa força de maneira natural em português.
- source_word: οὐ παρέδωκέν με
  choice: não me entregou
  rationale: Reproduz o sentido de παραδίδωμι e preserva o contraste entre disciplina severa e entrega à morte.
theological_decisions:
- issue: Natureza e intensidade da ação disciplinadora divina
  choice: me disciplinou severamente
  alternative: certamente me disciplinou
  rationale: A construção intensiva indica melhor o grau da disciplina do que uma certeza epistêmica, sem transformar a disciplina em destruição, pois a segunda linha nega a entrega à morte.
- issue: Relação entre as duas orações
  choice: mas
  alternative: e
  rationale: 'Embora καί seja literalmente «e», o contexto expressa contraste: houve disciplina severa, porém não entrega à morte. «Mas» torna explícita essa relação natural em português sem alterar o conteúdo.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com paralelismo poético preservado. A formulação segue prioritariamente o grego e mantém a nota de alternativa para a construção enfática.
