lexical_decisions:
- source_word: ἔπαισεν
  choice: feriu
  rationale: O aoristo de παίω indica golpear ou ferir; «feriu» preserva a concisão e o paralelismo da frase.
- source_word: αἱ χεῖρες αὐτοῦ
  choice: suas mãos
  rationale: Tradução direta da expressão grega, mantendo as mãos como sujeito explícito da segunda oração.
- source_word: ἰάσαντο
  choice: curaram
  rationale: O aoristo de ἰάομαι aqui tem sentido ativo, «curar». Como o grego não expressa o objeto, a tradução também o deixa implícito, sem acrescentar «o».
theological_decisions:
- issue: Objeto implícito de «curaram»
  choice: Não explicitar o objeto
  alternative: «suas mãos o curaram»
  rationale: Embora o contexto possa indicar a pessoa ferida como objeto, o texto grego não traz pronome. A formulação escolhida preserva a concisão e a abertura sintática do original.
translation_notes:
  register: Português moderno, conciso e digno. A construção «suas mãos curaram» é incomum, mas inteligível e reproduz deliberadamente o contraste paradoxal do grego entre ferir e curar.
