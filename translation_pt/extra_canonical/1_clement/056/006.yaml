source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: pt
  text: 'E diz ainda:


    “Bem-aventurado o homem a quem o Senhor repreende[a];


    não rejeite a admoestação do Todo-Poderoso.


    Pois ele causa dor e depois restaura.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem o Senhor repreendeu”.'
    reason: Preserva a possibilidade de traduzir literalmente o aoristo ἤλεγξεν como passado, embora o valor gnômico seja mais provável no contexto.
lexical_decisions:
- source_word: Μακάριος
  choice: Bem-aventurado
  rationale: Preserva a forma tradicional de uma declaração de felicidade ou favor divino, em registro digno e amplamente compreensível.
- source_word: ἤλεγξεν
  choice: repreende
  rationale: Embora seja aoristo, nesta máxima o verbo tem valor gnômico e expressa uma verdade geral; o presente soa natural em português e se harmoniza com os verbos seguintes.
- source_word: νουθέτημα
  choice: correção
  rationale: Comunica disciplina instrutiva, não mero castigo, em linguagem natural e sem restringir o sentido a uma advertência verbal.
- source_word: παντοκράτορος
  choice: Todo-Poderoso
  rationale: Equivalente consagrado que expressa domínio e poder universais.
- source_word: ἀλγεῖν ποιεῖ
  choice: causa dor
  rationale: Reproduz diretamente a construção causativa sem especificar uma forma de sofrimento que o grego não define.
- source_word: πάλιν ἀποκαθίστησιν
  choice: depois restaura
  rationale: Expressa a sequência e a reversão indicadas por πάλιν sem a redundância pouco natural de 'restaura novamente'.
theological_decisions:
- issue: Agência divina na dor e na restauração
  choice: Pois ele causa dor e depois restaura
  alternative: Pois ele permite a dor e depois restaura
  rationale: O grego atribui explicitamente a ação causativa a Deus; traduzi-la como mera permissão atenuaria e resolveria uma tensão teológica presente no texto.
- issue: Valor temporal do aoristo ἤλεγξεν
  choice: a quem o Senhor repreende
  alternative: a quem o Senhor repreendeu
  rationale: O contexto proverbial favorece o aoristo gnômico, mas a possibilidade formal do passado é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético. Conserva a tensão da agência divina e evita tanto arcaísmos desnecessários quanto explicitações não presentes no grego.
