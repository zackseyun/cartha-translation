  naturalness: O português é claro, solene e legível. «E diz ainda» é uma formulação um pouco mais idiomática para Καὶ πάλιν λέγει. A oração citada deve ser fechada com aspas.
  terminology: «Bem-aventurado», «Senhor» e «Todo-Poderoso» são escolhas estabelecidas e adequadas ao registro. «Admoestação» preserva o caráter de exortação corretiva de νουθέτημα, sem reduzi-lo a punição.
