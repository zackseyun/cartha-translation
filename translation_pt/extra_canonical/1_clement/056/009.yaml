  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: pt
  text: 'Na fome, ele livrará você da morte,

    e, na guerra, libertará você do poder da espada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λιμῷ
  choice: Na fome
  rationale: Reproduz de modo natural a circunstância expressa pelo grego, sem ampliar para uma formulação explicativa.
- source_word: ῥύσεταί σε ἐκ θανάτου
  choice: ele livrará você da morte
  rationale: Mantém o valor de resgate ou livramento de ῥύομαι e o futuro do original.
- source_word: ἐν πολέμῳ
  choice: na guerra
  rationale: Equivalência direta e corrente para a circunstância indicada no texto.
- source_word: ἐκ χειρὸς σιδήρου
  choice: do poder da espada
  rationale: A expressão é um semitismo em que 'mão' denota poder, enquanto 'ferro' funciona por metonímia para arma ou espada; a formulação evita em português a imagem pouco natural 'mão da espada' sem perder o sentido.
- source_word: λύσει σε
  choice: libertará você
  rationale: Preserva a distinção lexical em relação a ῥύσεται e expressa o sentido de soltar ou libertar de um poder ameaçador.
