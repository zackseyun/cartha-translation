  text: καὶ ἀπὸ μάστιγος γλώσσης σε κρύψει, καὶ οὐ μὴ φοβηθήσῃ κακῶν ἐπερχομένων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: pt
  text: E ele esconderá você do açoite da língua, e você de modo algum temerá os males quando vierem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάστιγος γλώσσης
  choice: açoite da língua
  rationale: Preserva a imagem forte e concreta do grego para a agressão ou dano causado por palavras, sem reduzi-la a uma interpretação específica como “calúnia”.
- source_word: κρύψει
  choice: esconderá
  rationale: Reproduz diretamente o futuro do verbo κρύπτω e a ideia de proteção mediante ocultação.
- source_word: οὐ μὴ φοβηθήσῃ
  choice: de modo algum temerá
  rationale: Expressa em português a negação enfática οὐ μή com o subjuntivo aoristo, evitando o menos natural “certamente não temerá”.
- source_word: κακῶν ἐπερχομένων
  choice: os males quando vierem
  rationale: Transmite de modo natural o particípio presente ἐπερχομένων como males que sobrevêm ou chegam, sem sugerir apenas que já estejam próximos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantiveram-se as duas conjunções καί para preservar o encadeamento poético. O pronome “você” torna explícito o objeto e o sujeito de segunda pessoa singular de maneira natural no português brasileiro, sem alterar o sentido.
