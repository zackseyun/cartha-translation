id: 1CLEM.56.16
reference: 1 Clement 56:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: βλέπετε, ἀγαπητοί, πόσος ὑπερασπισμός ἐστιν τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου· πατὴρ γὰρ ἀγαθὸς ὢν παιδεύει εἰς τὸ ἐλεηθῆναι ἡμᾶς διὰ τῆς ὁσίας παιδείας αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: pt
  text: Vejam, amados, quão grande defesa há para os que são disciplinados pelo Senhor. Pois, sendo um bom Pai, ele nos disciplina para que recebamos misericórdia por meio de sua santa disciplina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε
  choice: Vejam
  rationale: Imperativo plural direto e natural em português moderno.
- source_word: ὑπερασπισμός
  choice: defesa
  rationale: Expressa a ideia de defesa ou amparo em favor de alguém, preservando mais de perto a força do termo grego do que simplesmente “proteção”.
- source_word: παιδευομένοις / παιδεύει / παιδείας
  choice: disciplinados / disciplina / disciplina
  rationale: Mantém a repetição lexical do grego e abrange correção e formação, sem reduzir o sentido a mero castigo.
- source_word: δεσπότου
  choice: Senhor
  rationale: É a forma portuguesa digna e corrente para o título de autoridade absoluta neste contexto; “Mestre” poderia sugerir sobretudo ensino e enfraquecer o valor de δεσπότης.
- source_word: ἐλεηθῆναι
  choice: recebamos misericórdia
  rationale: Reproduz naturalmente o infinitivo passivo e conserva a misericórdia como algo recebido.
- source_word: ὁσίας
  choice: santa
  rationale: Equivalente contextual natural para aquilo que é santo, piedoso ou consagrado.
theological_decisions:
- issue: Finalidade da disciplina divina
  choice: “para que recebamos misericórdia”
  alternative: “para se compadecer de nós”
  rationale: Preserva a construção passiva εἰς τὸ ἐλεηθῆναι ἡμᾶς e não explicita além do texto como a disciplina se relaciona com a misericórdia.
- issue: Referente de δεσπότης
  choice: “Senhor”
  alternative: “Soberano” ou “Mestre”
  rationale: Mantém um título divino tradicional e inteligível sem introduzir uma identificação mais específica do que o contexto oferece.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “disciplina” é intencional para refletir a cadeia lexical grega.
source_grounding:
  english_pob_role: consult_only
