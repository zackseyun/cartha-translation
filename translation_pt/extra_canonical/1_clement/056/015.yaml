  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: pt
  text: 'Chegarás ao túmulo como o trigo maduro, colhido em sua estação,

    ou como um monte de cereal da eira, recolhido no devido tempo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ
  choice: você chegará
  rationale: Expressa naturalmente o movimento futuro de chegar ao túmulo, sem acrescentar a ideia específica de morrer.
- source_word: τάφῳ
  choice: túmulo
  rationale: Equivalente direto e corrente para o lugar de sepultamento.
- source_word: σῖτος ὥριμος
  choice: trigo maduro
  rationale: Mantém a imagem agrícola concreta; σῖτος pode designar cereal, especialmente trigo, e 'trigo maduro' é idiomático em português.
- source_word: κατὰ καιρὸν
  choice: em sua estação
  rationale: Preserva a noção de tempo apropriado ou determinado no ciclo agrícola.
- source_word: θημωνιὰ ἅλωνος
  choice: um monte de cereal da eira
  rationale: θημωνιά indica um monte ou pilha de produto colhido; explicitar 'cereal' torna a imagem compreensível sem sobrecarregá-la, enquanto 'eira' representa ἅλωνος.
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: recolhido no tempo certo
  rationale: Comunica tanto a ação de juntar/recolher quanto a oportunidade adequada indicada por καθ’ ὥραν.
