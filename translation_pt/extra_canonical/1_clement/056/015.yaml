  source_fidelity: A tradução reproduz fielmente as duas comparações agrícolas e o sentido temporal de κατὰ καιρόν / καθ’ ὥραν. «Túmulo», «trigo maduro», «eira» e «recolhido» são correspondências adequadas. A revisão proposta apenas ajusta a forma de tratamento para um registro mais condizente com a dicção elevada e proverbial do grego, sem alterar o sentido.
