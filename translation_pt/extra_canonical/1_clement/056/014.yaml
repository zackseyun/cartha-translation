lexical_decisions:
- source_word: σπέρμα
  choice: descendência
  rationale: No contexto, designa os descendentes coletivamente; «descendência» é natural em português e evita a leitura primária de «semente».
- source_word: πολύ
  choice: numerosa
  rationale: Concorda idiomaticamente com o substantivo coletivo «descendência» e expressa grande quantidade.
- source_word: παμβότανον
  choice: vegetação abundante
  rationale: O termo composto comunica a ideia da profusão de plantas ou ervas do campo; «vegetação abundante» preserva essa amplitude sem restringi-la a «grama».
- source_word: ἀγροῦ
  choice: campo
  rationale: Equivalente direto e natural para terreno campestre ou cultivado.
