id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: pt
  text: Portanto, intercedamos também pelos que estão em alguma transgressão[a], para que lhes sejam dadas brandura e humildade, a fim de que cedam, não a nós, mas à vontade de Deus. Pois, desse modo, a lembrança compassiva em favor deles, diante de Deus e dos santos[b], será frutífera e completa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os que se encontram em alguma transgressão; o grego não diz que foram “apanhados” nela.
    reason: Esclarece o valor simples de ὑπαρχόντων e evita uma nuance não presente no original.
  - marker: b
    text: 'Ou: “a lembrança compassiva deles perante Deus e os santos”.'
    reason: O dativo αὐτοῖς e a construção com μνεία permitem alguma ambiguidade entre uma lembrança em favor deles e uma lembrança associada a eles.
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: intercedamos
  rationale: No contexto, o verbo indica dirigir uma petição em favor de outras pessoas; “intercedamos” comunica essa força com naturalidade e dignidade.
- source_word: ἐν τινι παραπτώματι ὑπαρχόντων
  choice: dos que estão em alguma transgressão
  rationale: Preserva o sentido de estado expresso por ὑπαρχόντων, sem acrescentar a ideia de terem sido surpreendidos ou apanhados no ato.
- source_word: ἐπιείκεια
  choice: brandura
  rationale: Expressa a disposição gentil, moderada e não severa indicada pelo termo, em paralelo natural com “humildade”.
- source_word: εἶξαι
  choice: cedam
  rationale: Traduz a ideia de ceder ou submeter-se, mantendo o contraste explícito entre “a nós” e “à vontade de Deus”.
- source_word: ἔγκαρπος καὶ τελεία
  choice: frutífera e completa
  rationale: Reproduz de modo direto os dois predicativos, sem fundi-los nem interpretar em excesso sua relação.
- source_word: μετ’ οἰκτιρμῶν μνεία
  choice: lembrança compassiva
  rationale: Liga a compaixão à própria lembrança, conforme a estrutura grega, em vez de fazê-la modificar o modo como a lembrança se torna frutífera e completa.
theological_decisions:
- issue: Objeto da submissão
  choice: “não a nós, mas à vontade de Deus”
  alternative: Explicitar “à nossa autoridade” ou “a Deus”
  rationale: Mantém o contraste preciso do texto e não introduz uma concepção específica de autoridade eclesiástica.
- issue: Referência a Deus e aos santos
  choice: “diante de Deus e dos santos”
  alternative: “dirigida a Deus e aos santos”
  rationale: “Diante de” preserva melhor a amplitude de πρὸς e evita definir de maneira indevida a natureza da lembrança ou intercessão relacionada aos santos.
- issue: Valor do dativo αὐτοῖς na oração final
  choice: “em favor deles”
  alternative: “a lembrança deles”
  rationale: O contexto de intercessão favorece a leitura benefativa, mas a nota registra a possibilidade de entender a expressão como “a lembrança deles”, preservando a tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o movimento exortativo do grego sem conservar construções artificiais; “brandura”, “cedam” e “frutífera” mantêm um registro solene, mas corrente.
