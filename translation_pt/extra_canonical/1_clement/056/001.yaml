  source_fidelity: 'A tradução acompanha com precisão o grego: ἐντύχωμεν é bem vertido por “intercedamos”; ὑπαρχόντων conserva o sentido simples de pessoas que “estão” em uma transgressão; εἰς τὸ εἶξαι expressa adequadamente finalidade em “a fim de que cedam”; e o contraste é preservado em “não a nós, mas à vontade de Deus”. A oração final corretamente vincula “com compaixão” à lembrança, não ao modo de ela ser frutífera e completa. “Em favor deles” é uma leitura contextual e sintaticamente defensável de αὐτοῖς, enquanto a nota registra a alternativa sem a apresentar como certa.'
