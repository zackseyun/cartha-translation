  terminology: A terminologia é consistente e não introduz leituras confessionais. “Santos” reproduz ἅγιοι de forma tradicional e ampla; “diante de Deus e dos santos” preserva sem sobredefinir o alcance de πρὸς. As notas são pertinentes, ancoradas nos lugares adequados e explicam ambiguidades ou escolhas sem alterar o texto.
