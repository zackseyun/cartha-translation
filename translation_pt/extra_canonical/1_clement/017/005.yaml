reference: 1 Clement 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: pt
  text: 'Moisés foi chamado fiel em toda a sua casa[a] e, por meio do serviço dele, Deus julgou o Egito por meio de suas pragas e tormentos. No entanto, nem mesmo ele, embora tivesse sido grandemente glorificado, se tornou arrogante. Pelo contrário, quando recebeu uma mensagem divina junto à sarça, disse: “Quem sou eu para que me envies? Pois tenho a voz fraca e a língua lenta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, em toda a casa de Deus; o grego diz literalmente «em toda a sua casa».
    reason: O pronome é preservado no texto e pode parecer referir-se à casa de Moisés, embora a alusão tradicional e o contexto apontem para a casa de Deus.
lexical_decisions:
- source_word: ὑπηρεσίας
  choice: serviço
  rationale: Expressa a atuação subordinada de Moisés como instrumento de Deus, sem impor um sentido eclesiástico posterior como “ministério”.
- source_word: ἐκρίνεν
  choice: julgou
  rationale: Mantém o sentido judicial do verbo e a afirmação de que Deus executou juízo contra o Egito.
- source_word: μαστίγων καὶ αἰκισμάτων
  choice: pragas e tormentos
  rationale: “Pragas” se ajusta ao contexto do Egito, enquanto “tormentos” conserva a força dos maus-tratos ou sofrimentos severos indicados por αἰκισμάτων.
- source_word: ἐμεγαλοφρόνησεν
  choice: se tornou arrogante
  rationale: Comunica em português atual a ideia negativa de ensoberbecer-se ou tornar-se altivo, evitando uma formulação que pudesse sugerir nobreza moral.
- source_word: χρηματισμοῦ
  choice: mensagem divina
  rationale: No contexto, designa uma comunicação recebida de Deus; esta forma é natural e não restringe indevidamente o termo a um “oráculo” formal.
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: tenho a voz fraca e a língua lenta
  rationale: Preserva as duas imagens do grego em linguagem clara, sem reinterpretá-las como um diagnóstico específico de fala.
theological_decisions:
- issue: Referente de αὐτοῦ em “toda a sua casa”
  choice: Manter “sua casa” no texto e explicar a referência provável em nota
  alternative: Explicitar “toda a casa de Deus”
  rationale: O contexto tradicional aponta para a casa de Deus, mas o pronome grego não nomeia expressamente o possuidor; a tradução preserva a forma do original sem ocultar a leitura contextual.
- issue: Agência no juízo sobre o Egito
  choice: Deus julgou; Moisés serviu como instrumento
  alternative: Moisés julgou o Egito em nome de Deus
  rationale: A sintaxe faz de Deus o sujeito de ἐκρίνεν e apresenta o serviço de Moisés como o meio pelo qual o juízo foi realizado.
translation_notes:
  register: 'Português moderno, digno e acessível, com construções naturais para leitores brasileiros e compreensão internacional. A repetição de “por meio” foi suavizada sem alterar a agência: o serviço de Moisés é o instrumento, e as pragas e os tormentos são os meios do juízo. A metáfora “língua lenta” foi mantida por seu valor bíblico e por não exigir uma interpretação médica.'
