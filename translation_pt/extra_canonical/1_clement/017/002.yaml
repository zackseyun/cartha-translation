source:
  edition: Funk 1901 (normalized OCR)
  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: pt
  text: 'Abraão recebeu grande testemunho e foi chamado amigo de Deus; e, contemplando atentamente a glória de Deus, disse com humildade: “Eu, porém, sou terra e cinza.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: recebeu um testemunho grandioso
  rationale: Preserva a construção passiva e a ideia de um testemunho altamente honroso, sem explicitar indevidamente quem o deu.
- source_word: φίλος προσηγορεύθη τοῦ θεοῦ
  choice: foi chamado amigo de Deus
  rationale: Tradução natural e próxima da construção grega, mantendo o título tradicional.
- source_word: ἀτενίζων
  choice: contemplando atentamente
  rationale: Expressa o olhar fixo e atento indicado pelo particípio, com linguagem digna e corrente.
- source_word: ταπεινοφρονῶν
  choice: com humildade
  rationale: Comunica a atitude humilde sem a formulação pouco natural 'com humildade de mente'.
- source_word: γῆ καὶ σποδός
  choice: terra e cinza
  rationale: Mantém os substantivos concretos do grego; 'terra' reproduz γῆ mais diretamente do que 'pó', enquanto 'cinza' é natural em português.
theological_decisions:
- issue: Agente do testemunho recebido por Abraão
  choice: Não explicitar o agente
  alternative: “Deus deu um testemunho grandioso a Abraão”
  rationale: O passivo grego não nomeia o agente; a tradução preserva essa abertura sem acrescentar uma identificação teológica.
- issue: Relação entre contemplar a glória e falar humildemente
  choice: Manter as duas ações coordenadas sem explicar causalidade
  alternative: “Por contemplar a glória de Deus, disse...”
  rationale: O texto apresenta particípios, mas não declara explicitamente uma relação causal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A divisão em duas frases reduz a extensão do período sem alterar sua progressão. Preserva-se “Eu, porém” para refletir a ênfase de ἐγώ e o contraste de δέ.
