  source_fidelity: A tradução preserva adequadamente a citação e o sentido de καθαρὸς ἀπὸ ῥύπου e da concessão sobre uma vida de um dia. Contudo, «ele acusa a si mesmo» não reproduz plenamente a ênfase de αὐτὸς («ele próprio»).
  naturalness: «Ele próprio se acusa» é mais fluente em português moderno do que «ele acusa a si mesmo», ao mesmo tempo que mantém a ênfase reflexiva. «Ninguém é puro de impureza» evita o valor algo circunstancial de «está puro» e conserva a formulação concisa e solene da citação.
  terminology: «Impureza» mantém, sem interpretação doutrinária, a imagem de contaminação em ῥύπος. «Acusa» é a equivalência direta apropriada para κατηγορεῖ.
