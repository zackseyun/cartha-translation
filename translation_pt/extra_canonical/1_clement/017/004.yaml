source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλ’ αὐτὸς ἑαυτοῦ κατηγορεῖ λέγων· Οὐδεὶς καθαρὸς ἀπὸ ῥύπου, οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/004.yaml
  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: pt
  text: 'Mas ele próprio se acusa[a], dizendo: “Ninguém é puro de impureza, ainda que sua vida tenha apenas um dia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresenta acusação contra si mesmo”.'
    reason: Registra uma tradução mais formal da expressão reflexiva ἑαυτοῦ κατηγορεῖ.
lexical_decisions:
- source_word: κατηγορεῖ
  choice: acusa
  rationale: Expressa diretamente o sentido forense e comum de κατηγορέω, mantendo a construção reflexiva com ἑαυτοῦ.
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: puro de impureza
  rationale: Preserva o contraste lexical entre καθαρός e ῥύπος e a formulação semítica da citação, sem substituir a imagem por uma explicação interpretativa.
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: ainda que sua vida seja de um só dia
  rationale: Reproduz a concessão enfática e torna explícita, em português natural, a duração mínima indicada por μιᾶς ἡμέρας.
theological_decisions:
- issue: Alcance da afirmação sobre a impureza humana
  choice: Ninguém está puro de impureza
  alternative: Ninguém está livre de pecado
  rationale: Mantém a linguagem ampla de pureza e contaminação do grego, sem restringi-la interpretativamente ao conceito teológico de pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve solenidade apropriada a uma citação escriturística. A repetição em “ele acusa a si mesmo” conserva a ênfase de αὐτὸς ἑαυτοῦ.
