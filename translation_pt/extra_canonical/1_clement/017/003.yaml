  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: pt
  text: 'Também a respeito de Jó está escrito: “Jó era justo e irrepreensível, verdadeiro, temente a Deus e se abstinha de todo mal[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantinha-se afastado de todo mal”.'
    reason: Registra uma alternativa válida para ἀπεχόμενος ἀπὸ παντὸς κακοῦ, preservando a ideia de manter-se afastado do mal.
lexical_decisions:
- source_word: δίκαιος
  choice: justo
  rationale: Equivalente direto e natural para a qualidade moral expressa pelo adjetivo grego.
- source_word: ἄμεμπτος
  choice: irrepreensível
  rationale: Expressa a ideia de alguém contra quem não se pode levantar censura legítima, sem sugerir necessariamente perfeição absoluta.
- source_word: ἀληθινός
  choice: verdadeiro
  rationale: Preserva a formulação grega e sua possível abrangência entre veracidade e autenticidade, sem restringi-la a uma interpretação específica.
- source_word: θεοσεβής
  choice: temente a Deus
  rationale: Formulação portuguesa corrente e digna para quem reverencia a Deus.
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: se abstinha de todo mal
  rationale: ἀπέχομαι com ἀπό indica manter-se afastado ou abster-se; esta tradução preserva com precisão o valor lexical e soa natural em português.
theological_decisions:
- issue: Alcance de ἄμεμπτος
  choice: irrepreensível
  alternative: perfeito
  rationale: “Irrepreensível” mantém a afirmação ética do texto sem introduzir a noção teológica mais forte de impecabilidade ou perfeição absoluta.
- issue: Sentido de θεοσεβής
  choice: temente a Deus
  alternative: piedoso
  rationale: A opção escolhida conserva explicitamente a referência a Deus e o sentido de reverência presente no composto grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A enumeração mantém de perto a estrutura do grego, enquanto a forma verbal “se abstinha” evita um particípio pesado em português.
