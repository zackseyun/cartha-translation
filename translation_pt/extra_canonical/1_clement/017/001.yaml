revisions:
- from: Tornemo-nos também imitadores daqueles que andaram vestidos de peles de cabra e de ovelha, proclamando a vinda do Cristo.[a] Referimo-nos a Elias, Eliseu e também Ezequiel, os profetas; além deles, também aos que foram elogiados.[b]
  to: Tornemo-nos também imitadores daqueles que andaram vestidos de peles de cabra e de ovelha, proclamando a vinda do Cristo.[a] Referimo-nos a Elias, Eliseu e também Ezequiel, os profetas; além deles, também àqueles de quem se deu bom testemunho.[b]
  rationale: A única revisão necessária substitui “os que foram elogiados” por “àqueles de quem se deu bom testemunho”. Isso representa melhor o perfeito passivo de μαρτυρέω em seu contexto positivo, evita estreitar o sentido a elogio e mantém a indeterminação do agente. As demais escolhas são fiéis ao grego e naturais em português contemporâneo.
