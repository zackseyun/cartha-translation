source:
  edition: Funk 1901 (normalized OCR)
  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: pt
  text: Tornemo-nos também imitadores daqueles que andaram vestidos de peles de cabra e de ovelha, proclamando a vinda do Cristo.[a] Referimo-nos a Elias, Eliseu e também Ezequiel, os profetas; além deles, também àqueles de quem se deu bom testemunho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Messias”.'
    reason: Preserva a equivalência titular possível de Χριστός sem substituir a tradução direta no texto principal.
  - marker: b
    text: 'Ou: “os que foram elogiados”.'
    reason: Indica uma formulação que salienta a avaliação positiva de μεμαρτυρημένους, enquanto o texto principal mantém o campo de “testemunho” e não especifica o agente.
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: Tornemo-nos imitadores
  rationale: Reproduz a exortação deliberativa do aoristo subjuntivo com linguagem natural e digna.
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν
  choice: andaram vestidos de peles de cabra e de ovelha
  rationale: Explicita de modo natural o valor circunstancial de ἐν e entende μηλωταῖς como peles de ovelha, preservando o contraste entre os dois tipos de vestimenta.
- source_word: κηρύσσοντες
  choice: proclamando
  rationale: Mantém a força pública e anunciadora do particípio.
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: a vinda do Cristo
  rationale: Traduz diretamente ἔλευσις e Χριστός sem substituir o título grego por uma interpretação etimológica no corpo do texto.
- source_word: τοὺς μεμαρτυρημένους
  choice: os que foram elogiados
  rationale: 'Comunica a força positiva do perfeito passivo de μαρτυρέω neste contexto: pessoas de quem se deu bom testemunho, isto é, que foram aprovadas ou recomendadas.'
theological_decisions:
- issue: Sentido titular de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: O texto grego traz Χριστός; “Cristo” preserva a forma estabelecida do título, enquanto “Messias” permanece uma equivalência legítima indicada em nota.
- issue: Agente e natureza do elogio em μεμαρτυρημένους
  choice: Não especificar quem os elogiou
  alternative: os aprovados por Deus
  rationale: A forma passiva não nomeia explicitamente o agente; a tradução evita inserir uma identificação teológica que o versículo deixa implícita.
translation_notes:
  register: Português contemporâneo, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A construção foi levemente reorganizada para fluidez, sem eliminar a repetição enfática de “também” presente no grego.
