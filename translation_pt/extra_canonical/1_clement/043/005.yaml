source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: pt
  text: Quando amanheceu, ele reuniu todo o Israel — os seiscentos mil homens —, mostrou os selos aos chefes das tribos, abriu a tenda do testemunho e retirou as varas. E verificou-se que a vara de Arão não apenas havia brotado, mas também tinha fruto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: Quando amanheceu
  rationale: Expressa de modo natural e fiel a circunstância temporal do grego.
- source_word: συνεκάλεσεν
  choice: reuniu
  rationale: Comunica a ideia de convocar e juntar o povo, sem tornar a frase pesada.
- source_word: φυλάρχοις
  choice: chefes das tribos
  rationale: Equivalente claro para os líderes de cada tribo.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: tenda do testemunho
  rationale: Preserva a formulação cultual do original e sua ligação com o testemunho divino.
- source_word: ῥάβδους
  choice: varas
  rationale: No contexto de Números 17, 'varas' é a designação tradicional e concreta dos objetos representativos das tribos.
- source_word: καρπὸν ἔχουσα
  choice: tinha fruto
  rationale: Mantém a afirmação ampla do grego, que diz literalmente que a vara possuía fruto, sem especificá-lo.
theological_decisions:
- issue: Caráter milagroso do sinal da vara de Arão
  choice: não apenas havia brotado, mas também tinha fruto
  alternative: não apenas tinha brotado, mas até produzia fruto
  rationale: A tradução conserva a progressão enfática do grego sem acrescentar uma interpretação sobre o estágio ou processo de frutificação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. Os travessões tratam 'os seiscentos mil homens' como aposição explicativa de 'todo o Israel', acompanhando a sintaxe grega sem sugerir um segundo grupo.
