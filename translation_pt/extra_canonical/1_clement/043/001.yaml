id: 1CLEM.43.1
reference: 1 Clement 43:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: pt
  text: E que há de extraordinário se aqueles a quem Deus, em Cristo, confiou uma obra como essa designaram as pessoas já mencionadas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: que há de extraordinário
  rationale: Expressa de modo natural a pergunta retórica grega, preservando a ideia de algo surpreendente ou admirável.
- source_word: οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ
  choice: aqueles a quem Deus, em Cristo, confiou
  rationale: Mantém a voz passiva de πιστευθέντες em construção portuguesa natural e conserva ἐν Χριστῷ junto ao ato de confiar, sem explicitar além do que o grego permite.
- source_word: ἔργον τοιοῦτο
  choice: uma obra como essa
  rationale: 'Trata corretamente ἔργον como objeto de πιστευθέντες: essas pessoas receberam de Deus a incumbência dessa obra.'
- source_word: κατέστησαν
  choice: designaram
  rationale: No contexto de nomeação para uma função, 'designaram' comunica o sentido institucional do verbo sem acrescentar um cargo não expresso neste versículo.
- source_word: τοὺς προειρημένους
  choice: as pessoas já mencionadas
  rationale: O adjetivo substantivado masculino plural refere-se aos indivíduos mencionados anteriormente; 'pessoas' evita inserir uma identificação não repetida no texto grego.
theological_decisions:
- issue: Relação de ἐν Χριστῷ com πιστευθέντες
  choice: “a quem Deus, em Cristo, confiou”
  alternative: “os que, em Cristo, receberam de Deus essa incumbência”
  rationale: A formulação escolhida preserva a mediação ou esfera cristológica indicada por ἐν Χριστῷ, sem determinar de modo indevido seu alcance teológico.
- issue: Ligação sintática de ἔργον τοιοῦτο
  choice: A obra é aquilo que Deus confiou aos agentes da designação.
  alternative: Entender a obra como a função para a qual as pessoas mencionadas foram designadas.
  rationale: O acusativo ἔργον τοιοῦτο funciona como complemento de πιστευθέντες; ligá-lo a κατέστησαν exigiria uma relação não expressa no grego e alteraria o foco da frase.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural sem eliminar a concisão nem a tensão sintática do original.
