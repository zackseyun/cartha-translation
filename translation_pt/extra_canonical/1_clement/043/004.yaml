id: 1CLEM.43.4
reference: 1 Clement 43:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κλείσας τὴν σκηνὴν ἐσφράγισεν τὰς κλεῖδας ὡσαύτως καὶ τὰς ῥάβδους, καὶ εἶπεν αὐτοῖς· Ἄνδρες ἀδελφοί, ἧς ἂν φυλῆς ἡ ῥάβδος βλαστήσῃ, ταύτην ἐκλέλεκται ὁ θεὸς εἰς τὸ ἱερατεύειν καὶ λειτουργεῖν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: pt
  text: 'E, depois de fechar a tenda, selou as chaves e, do mesmo modo, também as varas. Então lhes disse: “Irmãos, a tribo cuja vara brotar é aquela que Deus escolheu para exercer o sacerdócio e prestar-lhe serviço.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνή
  choice: tenda
  rationale: Mantém o sentido concreto de σκηνή e a ligação com a tenda sagrada do relato subjacente.
- source_word: κλεῖδας
  choice: as chaves
  rationale: Traduz diretamente o substantivo grego, preservado no texto de Funk, embora a camada inglesa o tenha omitido por dificuldade contextual.
- source_word: ῥάβδους / ῥάβδος
  choice: varas / vara
  rationale: “Vara” é natural no relato da vara que brota e mantém a correspondência entre o plural e o singular do grego.
- source_word: ἱερατεύειν
  choice: exercer o sacerdócio
  rationale: Expressa a função verbal de atuar como sacerdote sem acrescentar uma formulação denominacional.
- source_word: λειτουργεῖν αὐτῷ
  choice: prestar-lhe serviço
  rationale: Conserva o sentido de serviço religioso prestado a Deus sem restringir λειτουργεῖν ao uso moderno de “liturgia”.
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: É a forma idiomática, respeitosa e inclusiva no contexto de uma alocução a membros da comunidade; a reprodução literal “homens irmãos” seria artificial em português.
theological_decisions:
- issue: Relação entre escolha divina, sacerdócio e serviço
  choice: “Deus escolheu para exercer o sacerdócio e prestar-lhe serviço”
  alternative: “Deus escolheu para ser sacerdote e ministrar diante dele”
  rationale: A redação escolhida mantém os dois infinitivos coordenados do grego e evita fundi-los numa única função ou introduzir “diante dele”, expressão ausente do texto.
translation_notes:
  register: Português atual, digno e de leitura ampla. A tradução segue o texto grego mesmo onde a camada inglesa revisada omite κλεῖδας (“as chaves”). A construção enfática ἧς ἂν φυλῆς... ταύτην foi vertida naturalmente como “a tribo cuja... é aquela que...”.
