id: 1CLEM.43.6
reference: 1 Clement 43:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: O que vocês acham, amados? Moisés não sabia de antemão que isso haveria de acontecer? Sem dúvida, sabia. Mas, para que não surgisse desordem em Israel, agiu dessa maneira, a fim de que fosse glorificado o nome do Deus verdadeiro e único, a quem seja a glória para todo o sempre. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: amados
  rationale: Forma vocativa tradicional, digna e natural no discurso cristão em português.
- source_word: προῄδει
  choice: sabia de antemão
  rationale: Expressa claramente o sentido temporal do verbo grego sem recorrer ao termo teológico mais carregado «presciência».
- source_word: ἀκαταστασία
  choice: desordem
  rationale: Preserva o sentido de desorganização ou tumulto no contexto comunitário, sem especificar além do grego.
- source_word: μάλιστα ᾔδει
  choice: Sem dúvida, sabia
  rationale: Reproduz a resposta enfática do grego em português natural.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente idiomático consagrado para a fórmula enfática de duração indefinida.
theological_decisions:
- issue: Finalidade da ação de Moisés
  choice: «para que não surgisse desordem em Israel [...] a fim de que fosse glorificado o nome»
  alternative: Interpretar a prevenção da desordem apenas como resultado, e não como finalidade
  rationale: As duas construções finais gregas, ἵνα μή e εἰς τό com infinitivo, apresentam propósitos; a tradução mantém essa estrutura sem acrescentar uma explicação teológica.
- issue: Doxologia dirigida a Deus
  choice: «a quem seja a glória»
  alternative: «a ele pertence a glória»
  rationale: Mantém o caráter de desejo ou aclamação da fórmula grega ᾧ ἡ δόξα, sem transformá-la numa simples declaração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» torna a pergunta plural explícita e natural; «amados» preserva o tom pastoral. Não são necessárias notas de rodapé.
