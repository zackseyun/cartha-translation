id: 1CLEM.43.3
reference: 1 Clement 43:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: pt
  text: Pois ele, quando surgiu ciúme a respeito do sacerdócio e as tribos entraram em conflito sobre qual delas seria adornada com o nome glorioso[a], ordenou aos doze chefes tribais que lhe trouxessem varas, cada uma inscrita com o nome da respectiva tribo. Depois de recebê-las, amarrou-as, selou-as com os anéis dos chefes tribais e as colocou na tenda do testemunho, sobre a mesa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o título glorioso”.'
    reason: O grego ὄνομα pode significar “nome” e, neste contexto honorífico, também “designação” ou “título”.
lexical_decisions:
- source_word: ζήλου
  choice: ciúme
  rationale: No contexto da disputa pelo sacerdócio, expressa rivalidade invejosa; “ciúme” é natural e mantém o tom moral do termo.
- source_word: στασιαζουσῶν
  choice: entraram em conflito
  rationale: Preserva a força ativa de envolvimento em disputa facciosa, sem a formulação pouco natural “estavam em facção”.
- source_word: ἱερωσύνης
  choice: sacerdócio
  rationale: Equivalente corrente e preciso para o ofício sacerdotal em disputa.
- source_word: φυλάρχους
  choice: chefes tribais
  rationale: Designa com clareza os líderes das doze tribos.
- source_word: ῥάβδους
  choice: varas
  rationale: Termo tradicional e concreto para as varas representativas das tribos no episódio aludido.
- source_word: δακτυλίοις
  choice: anéis
  rationale: Refere-se aos anéis usados para imprimir os selos; a tradução conserva o objeto explicitamente mencionado.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: tenda do testemunho
  rationale: Reproduz a expressão cultual grega sem substituir “testemunho” por uma interpretação mais específica.
- source_word: τράπεζαν τοῦ θεοῦ
  choice: mesa de Deus
  rationale: Tradução direta que mantém a formulação cultual do texto.
theological_decisions:
- issue: Sentido de τῷ ἐνδόξῳ ὀνόματι
  choice: com o nome glorioso
  alternative: com o título glorioso
  rationale: “Nome” conserva o sentido lexical direto e a possível ressonância honorífica, enquanto a nota registra que o contexto também permite entendê-lo como designação ou título.
- issue: Identidade implícita de ἐκεῖνος
  choice: ele
  alternative: Moisés
  rationale: O grego usa pronome demonstrativo e depende do contexto anterior; não se explicita “Moisés” no corpo do texto para evitar acrescentar um nome ausente deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para fluidez, preservando a sequência narrativa, o vocabulário cultual e a tensão da disputa entre as tribos.
