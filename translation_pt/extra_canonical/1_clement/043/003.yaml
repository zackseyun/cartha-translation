  source_fidelity: 'A tradução acompanha com precisão a construção temporal e a sequência narrativa do grego: o ciúme em torno do sacerdócio, o conflito entre as tribos, a pergunta indireta sobre qual delas receberia a honra, a apresentação das varas, o ato de amarrá-las e selá-las, e sua deposição na tenda do testemunho. “Seria adornada” representa adequadamente o optativo εἴη em pergunta indireta dependente de uma narração no passado.'
  naturalness: O português é moderno, claro e de registro apropriado. “Chefes tribais”, “tenda do testemunho” e “mesa de Deus” soam naturais em contexto religioso e preservam o caráter formal do original. “Entraram em conflito” é uma formulação idiomática, ainda que um pouco menos específica que o matiz faccioso de στασιαζουσῶν; não compromete o sentido central.
  terminology: “Sacerdócio” para ἱερωσύνη, “varas” para ῥάβδους, “anéis” para δακτύλιοι e “tenda do testemunho” para σκηνὴ τοῦ μαρτυρίου são escolhas fiéis e consistentes. A nota sobre “nome glorioso” registra de modo legítimo a extensão honorífica possível de ὄνομα sem substituir o sentido básico no texto.
