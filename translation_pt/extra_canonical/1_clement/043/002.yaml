source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: pt
  text: Pois ali também o bem-aventurado e fiel servo Moisés, em toda a sua casa, registrou nos livros sagrados tudo o que lhe havia sido ordenado, e os demais profetas também o seguiram, dando testemunho das ordenanças promulgadas por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: ali também
  rationale: Mantém a referência locativa e o valor aditivo da expressão grega, sem substituí-la por uma relação lógica não expressa.
- source_word: μακάριος
  choice: bem-aventurado
  rationale: Termo digno e corrente no registro bíblico, que preserva o sentido de alguém abençoado ou honrado.
- source_word: πιστὸς θεράπων
  choice: servo fiel
  rationale: Reproduz a caracterização bíblica de Moisés; «servo» expressa serviço dedicado sem sugerir mero assistente.
- source_word: ἐσημειώσατο
  choice: registrou
  rationale: Comunica o ato de consignar por escrito nos livros sagrados de modo natural em português.
- source_word: τὰ διατεταγμένα αὐτῷ πάντα
  choice: tudo o que lhe havia sido ordenado
  rationale: Preserva a totalidade e a ideia de determinações recebidas por Moisés.
- source_word: ἐπηκολούθησαν
  choice: o seguiram
  rationale: Mantém a formulação e a possível amplitude do grego, sem restringi-la a mera imitação literária.
- source_word: συνεπιμαρτυροῦντες
  choice: atestando juntamente
  rationale: Preserva tanto a ideia de confirmar ou dar testemunho quanto o elemento associativo expresso pelo prefixo συν-.
- source_word: τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  choice: as ordenanças estabelecidas por ele
  rationale: Trata corretamente o dativo como complemento de «atestar» e traduz a noção de disposições instituídas como lei.
theological_decisions:
- issue: Relação entre os profetas e as ordenanças de Moisés
  choice: Os profetas atestam as ordenanças estabelecidas por Moisés.
  alternative: Os profetas dão testemunho junto com as ordenanças.
  rationale: A construção no dativo é mais naturalmente o objeto de συνεπιμαρτυροῦντες; as ordenanças são aquilo que os profetas confirmam, não co-testemunhas.
- issue: Sentido de «casa» na descrição de Moisés
  choice: Manter «em toda a sua casa».
  alternative: Explicitar «em toda a casa de Deus».
  rationale: O possessivo no grego não identifica expressamente o referente dentro deste versículo; a formulação preserva a alusão bíblica e sua concisão.
translation_notes:
  register: Português moderno, digno e legível, com leve ressonância bíblica em «bem-aventurado», «servo fiel» e «em toda a sua casa». A pontuação divide o período extenso sem romper sua progressão.
