source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: pt
  text: Portanto, vocês que lançaram as bases da rebelião[a], submetam-se aos presbíteros e deixem-se disciplinar para o arrependimento, dobrando os joelhos do coração de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sedição” ou “conflito faccioso”.
    reason: O grego στάσις pode designar rebelião, sedição, facção ou conflito interno; a nota preserva essa amplitude sem enfraquecer o sentido negativo no contexto.
lexical_decisions:
- source_word: καταβολὴν ... ποιήσαντες
  choice: lançaram as bases
  rationale: Reproduz de modo natural em português a metáfora de estabelecer o fundamento ou dar início a algo.
- source_word: στάσεως
  choice: rebelião
  rationale: No contexto, designa uma ruptura facciosa e ilegítima da ordem comunitária; “rebelião” preserva sua força negativa, enquanto a nota registra outras nuances possíveis.
- source_word: πρεσβυτέροις
  choice: presbíteros
  rationale: O termo se refere aos líderes da comunidade mencionados no contexto de 1 Clemente; “presbíteros” mantém a designação reconhecível sem especificar além do grego a estrutura do ofício.
- source_word: παιδεύθητε
  choice: deixem-se disciplinar
  rationale: O imperativo passivo envolve aceitar correção, instrução ou disciplina; a formulação preserva tanto a voz passiva quanto o caráter exortativo.
- source_word: εἰς μετάνοιαν
  choice: para o arrependimento
  rationale: Mantém a orientação ou finalidade expressa por εἰς sem decidir se a disciplina conduz ao arrependimento ou se ocorre em vista dele.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  choice: dobrando os joelhos do coração
  rationale: Conserva a imagem vívida e deliberada do grego, que descreve humildade e submissão interiores.
theological_decisions:
- issue: Natureza da disciplina e sua relação com o arrependimento
  choice: deixem-se disciplinar para o arrependimento
  alternative: aceitem a correção que conduz ao arrependimento
  rationale: A escolha evita tornar explícita uma relação causal que εἰς não exige e preserva a tensão entre correção, formação e arrependimento.
- issue: Identidade dos πρεσβύτεροι
  choice: presbíteros
  alternative: anciãos
  rationale: “Presbíteros” se ajusta ao contexto de liderança comunitária, mas não define uma forma denominacional específica de governo eclesiástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de “vocês” para legibilidade brasileira. A metáfora final foi preservada literalmente por sua clareza e força retórica.
