source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτω γὰρ λέγει ἡ πανάρετος σοφία· Ἰδοὺ, προΐομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν, διδάξω δὲ ὑμᾶς τὸν ἐμὸν λόγον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: pt
  text: 'Pois assim diz a Sabedoria, plena de toda virtude: “Eis que derramarei sobre vocês uma declaração do meu sopro[a] e lhes ensinarei a minha palavra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma fala proveniente do meu sopro”.'
    reason: A construção grega liga «declaração/fala» a «meu sopro» de modo poético, permitindo exprimir a relação como origem sem eliminar a imagem literal.
lexical_decisions:
- source_word: πανάρετος
  choice: plena de toda virtude
  rationale: Expressa o sentido intensivo de alguém que reúne toda virtude, evitando o pouco natural «toda virtuosa» e preservando o tom elevado aplicado à Sabedoria personificada.
- source_word: προΐομαι
  choice: derramarei
  rationale: No contexto da citação sapiencial, comunica a ideia de fazer sair ou verter algo para os ouvintes e preserva a imagem dinâmica do grego.
- source_word: ῥῆσιν
  choice: declaração
  rationale: Distingue ῥῆσις, uma fala ou enunciação, de λόγος, traduzido como «palavra», mantendo o paralelismo lexical.
- source_word: πνοῆς
  choice: sopro
  rationale: Mantém a imagem concreta de respiração ou sopro sem interpretá-la explicitamente como «espírito» ou «inspiração».
- source_word: λόγον
  choice: palavra
  rationale: É a correspondência natural neste paralelismo e conserva sua distinção em relação a ῥῆσις.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Sabedoria com inicial maiúscula
  alternative: sabedoria com inicial minúscula
  rationale: A Sabedoria aparece como sujeito pessoal que fala; a maiúscula torna clara a personificação literária sem decidir que ela seja uma pessoa divina específica.
- issue: Sentido de πνοή
  choice: sopro
  alternative: Espírito
  rationale: «Sopro» preserva a ambiguidade e a imagem do texto grego, sem introduzir uma identificação pneumatológica que o trecho não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Eis que» conserva o tom solene da introdução da fala, enquanto «para vocês» evita regionalismo excessivo. O paralelismo entre «declaração» e «palavra» foi mantido.
