source:
  edition: Funk 1901 (normalized OCR)
  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: pt
  text: Pois acontecerá que, quando vocês me invocarem, eu não os ouvirei; pessoas más me buscarão, mas não me encontrarão. Pois odiaram a sabedoria e não escolheram o temor do Senhor; tampouco quiseram dar atenção aos meus conselhos, mas zombaram das minhas repreensões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ
  choice: invocarem
  rationale: Expressa o ato de chamar por alguém em busca de auxílio, preservando o tom solene do contexto.
- source_word: οὐκ εἰσακούσομαι ὑμῶν
  choice: não os ouvirei
  rationale: Em português natural, comunica aqui não apenas a percepção auditiva, mas a recusa de atender ao apelo.
- source_word: κακοὶ
  choice: pessoas más
  rationale: Mantém o valor substantivado do adjetivo grego sem restringir desnecessariamente a referência a homens do sexo masculino.
- source_word: φόβον τοῦ κυρίου
  choice: temor do Senhor
  rationale: Preserva a expressão sapiencial tradicional e sua reverência religiosa, sem reduzi-la a mero medo.
- source_word: βουλαῖς
  choice: conselhos
  rationale: Equivalente natural para orientações ou deliberações oferecidas pela Sabedoria.
- source_word: ἐλέγχους
  choice: repreensões
  rationale: Conserva a ideia de censura corretiva, mais precisa aqui do que simples instrução.
theological_decisions:
- issue: A recusa divina de ouvir
  choice: não os ouvirei
  alternative: não lhes responderei
  rationale: Mantém de perto a formulação grega e sua tensão retórica, sem explicar se a recusa significa não atender ou não responder.
- issue: Sentido de 'temor do Senhor'
  choice: temor do Senhor
  alternative: reverência ao Senhor
  rationale: A expressão literal conserva a linguagem própria da tradição sapiencial e não elimina sua amplitude semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “vocês”. A sintaxe foi levemente naturalizada, preservando o paralelismo e a progressão judicial do grego.
