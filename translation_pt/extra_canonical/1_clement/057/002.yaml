id: 1CLEM.57.2
reference: 1 Clement 57:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: pt
  text: Aprendam a se submeter, abandonando a presunção arrogante e orgulhosa da fala de vocês. Pois é melhor que vocês sejam encontrados pequenos e contados[a] no rebanho de Cristo do que, parecendo superiores, sejam expulsos da esperança dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reconhecidos” ou “estimados”. O termo grego pode indicar ser contado ou levado em consideração e, em outros contextos, ser estimado.'
    reason: Preserva a amplitude lexical de ἐλλογίμους, enquanto o texto principal mantém o contraste contextual entre pertencer ao rebanho e ser expulso.
  - marker: b
    text: Literalmente, “da esperança dele”. O grego não especifica a relação expressa pelo genitivo, que pode referir-se à esperança que lhe pertence ou que ele concede.
    reason: Conserva a ambiguidade genitiva real sem apresentar “esperança nele” como tradução igualmente imediata.
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: se submeter
  rationale: Expressa diretamente a ideia de colocar-se sob autoridade ou ordem, sem especificar um objeto que o grego deixa implícito.
- source_word: αὐθάδειαν
  choice: insolência
  rationale: No contexto, denota uma atitude obstinada, presunçosa e arrogante que se manifesta na fala; “insolência” produz uma formulação natural com os qualificativos “arrogante e orgulhosa”.
- source_word: ἐλλογίμους
  choice: contados
  rationale: Preserva o sentido de ser levado em conta ou contado dentro do rebanho, reforçado pelo contraste com ser expulso. Evita “estimados”, que poderia sugerir prestígio e entrar em tensão indevida com “pequenos”.
- source_word: καθ' ὑπεροχὴν δοκοῦντας
  choice: parecendo superiores
  rationale: Reproduz tanto a aparência indicada por δοκοῦντας quanto a ideia de proeminência ou superioridade de καθ’ ὑπεροχήν.
- source_word: ἐκβληθῆναι
  choice: sejam expulsos
  rationale: Mantém a imagem forte de ser lançado para fora, em contraste espacial e comunitário com estar contado no rebanho.
theological_decisions:
- issue: Valor de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: Neste contexto cristão do fim do primeiro século, Χριστός funciona como designação estabelecida de Jesus; “Cristo” corresponde ao uso discursivo sem introduzir uma ênfase sociolinguística diferente.
- issue: Sentido de ἐλλογίμους no rebanho
  choice: contados no rebanho
  alternative: estimados no rebanho
  rationale: 'A antítese do período favorece pertencimento reconhecido: ser pequeno, mas contado dentro do rebanho, em vez de parecer superior e ser expulso. Uma nota registra a alternativa lexical real.'
- issue: Genitivo em τῆς ἐλπίδος αὐτοῦ
  choice: da esperança dele
  alternative: da esperança nele / da esperança que ele oferece
  rationale: A formulação mantém a relação genitiva e sua tensão sem decidir se Cristo é o possuidor, fundamento ou conteúdo da esperança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário plural presente no grego. A construção mantém a exortação incisiva, o contraste entre pequenez e superioridade aparente e a imagem comunitária do rebanho.
