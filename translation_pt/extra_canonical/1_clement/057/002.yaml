  terminology: '“Cristo”, “rebanho” e “esperança” são escolhas corretas e estáveis. “Contados no rebanho” é preferível a “estimados” no texto principal, pois sustenta a oposição entre estar no rebanho e ser dele expulso. A nota sobre τῆς ἐλπίδος αὐτοῦ deve evitar apresentar “esperança nele” como alternativa igualmente direta: o grego diz literalmente “sua esperança” e não determina com precisão a relação do genitivo.'
