source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: pt
  text: Pois, porque faziam mal aos inexperientes[a], serão mortos, e a investigação destruirá os ímpios; mas quem me ouve habitará confiando na esperança e descansará sem medo de mal algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os ingênuos”; literalmente, o termo também pode referir-se a crianças pequenas.'
    reason: Preserva a amplitude de νηπίους e esclarece seu provável sentido sapiencial.
lexical_decisions:
- source_word: νηπίους
  choice: os inexperientes
  rationale: No contexto da literatura de sabedoria, designa pessoas simples, ingênuas ou sem discernimento, não necessariamente moralmente inocentes. “Os inexperientes” conserva essa categoria sapiencial em português claro.
- source_word: ἐξέτασμος
  choice: a investigação
  rationale: Expressa averiguação ou exame minucioso. “Investigação” é natural em português e preserva o caráter judicial ou perscrutador do termo.
- source_word: κατασκηνώσει
  choice: habitará
  rationale: Mantém a imagem concreta de estabelecer morada, sem reduzi-la antecipadamente à ideia interpretativa de viver em segurança.
- source_word: ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ
  choice: descansará sem medo de mal algum
  rationale: Reproduz de modo natural a combinação de repouso ou tranquilidade com ausência de temor diante de todo mal.
theological_decisions:
- issue: Sentido de νηπίους
  choice: os inexperientes
  alternative: os inocentes
  rationale: O termo pode denotar crianças ou pessoas vulneráveis, mas nesta citação sapiencial funciona mais provavelmente como categoria dos simples ou ingênuos. A nota preserva a amplitude lexical sem atribuir-lhes impecabilidade moral.
- issue: Natureza da esperança em ἐπ’ ἐλπίδι πεποιθώς
  choice: confiando na esperança
  alternative: seguro por causa da esperança
  rationale: A formulação mantém a esperança como base ou objeto da confiança sem especificar além do que o grego declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima do grego sem sacrificar a naturalidade. A redação conserva o contraste entre a destruição dos ímpios e a segurança de quem ouve.
