    issue: «Estendia minhas palavras» é um calque pouco natural de ἐξέτεινον λόγους.
    rationale: Embora o grego empregue uma expressão imagética incomum, «dirigia-lhes palavras» comunica em português moderno o ato de lhes falar de modo persistente, sem introduzir a noção diferente de simplesmente prolongar palavras.
  - severity: low
    issue: Posição de «de repente» em «quando de repente lhes chegar o tumulto».
    rationale: «Quando lhes chegar de repente o tumulto» preserva a mesma ênfase de ἄφνω e é mais fluente.
