source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: pt
  text: Pois eu chamava, e vocês não obedeciam; dirigia-lhes palavras, e vocês não prestavam atenção. Pelo contrário, anulavam os meus conselhos e desobedeciam às minhas repreensões. Por isso, eu também rirei da ruína de vocês; exultarei quando lhes sobrevier a destruição, quando lhes chegar de repente o tumulto e a derrocada vier como uma tempestade, ou quando lhes sobrevierem aflição e cerco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηκούσατε
  choice: obedeciam
  rationale: O verbo significa obedecer ou atender ao chamado; “obedeciam” preserva a força da resposta recusada, em contraste com o simples ato de ouvir.
- source_word: ἐξέτεινον λόγους
  choice: estendia minhas palavras
  rationale: Mantém a imagem incomum do grego sem substituí-la pela variante conhecida de “estender a mão”; o imperfeito indica ação reiterada ou prolongada.
- source_word: ἀκύρους ἐποιεῖτε
  choice: anulavam
  rationale: Expressa tornar sem validade ou efeito, em português corrente e conciso.
- source_word: ἐλέγχοις
  choice: repreensões
  rationale: Abrange correção e censura, adequando-se ao paralelismo com “conselhos”.
- source_word: καταχαροῦμαι
  choice: exultarei
  rationale: Preserva a intensidade de alegrar-se triunfantemente, sem suavizar a linguagem judicial do texto.
- source_word: θόρυβος
  choice: tumulto
  rationale: Retém o sentido de perturbação súbita e alarmante, sem restringi-lo indevidamente a “pânico”.
- source_word: πολιορκία
  choice: cerco
  rationale: Equivalente direto e natural do termo militar para assédio ou sítio de uma cidade.
theological_decisions:
- issue: A voz da Sabedoria descreve riso e exultação diante da calamidade dos desobedientes.
  choice: Preservar literalmente “rirei” e “exultarei”.
  alternative: Suavizar para uma fórmula impessoal de juízo ou dizer apenas que não haverá socorro.
  rationale: A tensão teológica pertence ao texto e não deve ser resolvida por paráfrase; o contexto apresenta a consequência judicial da recusa persistente.
- issue: Relação entre chamado e resposta em ὑπακούω.
  choice: Traduzir como desobediência, não apenas falta de audição.
  alternative: “Vocês não escutavam.”
  rationale: O verbo grego envolve atender ou obedecer, e a sequência volta explicitamente à desobediência diante das repreensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. Mantiveram-se as imagens e a severidade do grego. Os imperfeitos iniciais foram vertidos como ações repetidas ou persistentes; os eventos futuros foram formulados com “sobrevir” e “chegar” para conservar o tom solene sem arcaísmo excessivo.
