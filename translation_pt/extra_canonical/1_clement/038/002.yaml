source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: pt
  text: Que o forte cuide do fraco, e que o fraco respeite o forte. Que o rico supra as necessidades do pobre, e que o pobre dê graças a Deus, porque lhe deu alguém por meio de quem sua necessidade seja suprida. Que o sábio demonstre sua sabedoria não em palavras, mas em boas obras. Quem é humilde não dê testemunho de si mesmo, mas deixe que outro dê testemunho dele. Quem é puro na carne não se vanglorie, sabendo que é outro quem lhe provê domínio próprio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: cuide de
  rationale: Expressa de modo natural a ideia de dedicar atenção e cuidado responsável a alguém.
- source_word: ἐντρεπέσϑω
  choice: respeite
  rationale: No contexto de relações comunitárias, comunica a deferência devida ao forte sem sugerir medo.
- source_word: ἐπιχορηγείτω
  choice: ajude
  rationale: Aqui indica prover recursos para o necessitado; “ajude” é claro e natural, enquanto a oração seguinte explicita o suprimento da necessidade.
- source_word: ὑστέρημα
  choice: necessidade
  rationale: Refere-se ao que falta ao pobre, isto é, à sua carência ou necessidade concreta.
- source_word: ἐνδεικνύσθω
  choice: demonstre
  rationale: Preserva a ideia de tornar a sabedoria visível por meio da conduta.
- source_word: ταπεινοφρονῶν
  choice: quem é humilde
  rationale: Formulação corrente e digna para aquele que pensa com humildade.
- source_word: ἁγνὸς ἐν τῇ σαρκί
  choice: puro no corpo
  rationale: Mantém a referência corporal do grego e evita restringi-la, sem base textual, a uma formulação doutrinária específica.
- source_word: ἐγκράτειαν
  choice: domínio próprio
  rationale: Abrange autocontrole ou continência; “domínio próprio” é inteligível e preserva o alcance amplo do termo.
theological_decisions:
- issue: Referente de ἕτερός em “outro quem lhe concede”
  choice: Manter “outro” sem identificar explicitamente
  alternative: Traduzir “Deus é quem lhe concede”
  rationale: Embora o contexto possa apontar para Deus, o texto grego diz literalmente “outro”; preservar essa forma evita tornar explícito o que permanece implícito.
- issue: Sentido de pureza “na carne”
  choice: “puro no corpo”
  alternative: “casto” ou “sexualmente puro”
  rationale: O grego admite uma referência à castidade, mas sua expressão é mais ampla; a tradução conserva essa tensão sem limitar indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com construções exortativas paralelas. Emprega “dê graças” e “boas obras” por sua naturalidade e ressonância histórica, sem arcaísmo excessivo. A alternância entre “que o...” e “quem...” evita repetição pesada e mantém o fluxo em português.
