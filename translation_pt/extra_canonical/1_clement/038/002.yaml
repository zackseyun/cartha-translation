  - severity: low
    issue: “Puro no corpo” para ὁ ἁγνὸς ἐν τῇ σαρκί
    rationale: “Na carne” é a correspondência mais direta da expressão grega e preserva sua amplitude sem antecipar uma delimitação interpretativa.
  - severity: low
    issue: “Não por palavras” para μὴ ἐν λόγοις
    rationale: “Não em palavras” reflete mais de perto a construção locativa grega e mantém o paralelismo com “em boas obras”.
