revisions:
- from: Que o forte cuide do fraco, e que o fraco respeite o forte. Que o rico ajude o pobre, e que o pobre dê graças a Deus, porque lhe deu alguém por meio de quem sua necessidade seja suprida. Que o sábio demonstre sua sabedoria não por palavras, mas por boas obras. Quem é humilde não dê testemunho de si mesmo, mas deixe que outro dê testemunho dele. Quem é puro no corpo não se vanglorie, sabendo que é outro quem lhe concede o domínio próprio.
  to: Que o forte cuide do fraco, e que o fraco respeite o forte. Que o rico supra as necessidades do pobre, e que o pobre dê graças a Deus, porque lhe deu alguém por meio de quem sua necessidade seja suprida. Que o sábio demonstre sua sabedoria não em palavras, mas em boas obras. Quem é humilde não dê testemunho de si mesmo, mas deixe que outro dê testemunho dele. Quem é puro na carne não se vanglorie, sabendo que é outro quem lhe provê domínio próprio.
  rationale: A revisão reforça o sentido de provisão material em ἐπιχορηγέω, traduz literalmente a expressão ἐν τῇ σαρκί sem impor uma leitura confessional, e ajusta a locução “em palavras” à construção grega. A formulação difícil sobre alguém por meio de quem a necessidade é suprida permanece deliberadamente próxima do texto, sem identificar além do que o original identifica esse “alguém” ou “outro”.
