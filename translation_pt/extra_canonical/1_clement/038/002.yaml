  source_fidelity: A tradução preserva bem a sequência exortativa e os contrastes do grego. Contudo, “ajude o pobre” enfraquece ἐπιχορηγείτω, que neste paralelismo diz respeito a prover/suprir recursos. “Puro na carne” reproduz melhor ἐν τῇ σαρκί do que “puro no corpo”, sem reduzir a expressão a uma interpretação específica.
  naturalness: O português é claro, moderno e adequado ao registro parenético. “Supra as necessidades do pobre”, “não em palavras” e “puro na carne” soam naturais e tornam a formulação mais próxima do original.
  terminology: “Domínio próprio” representa bem ἐγκράτεια. Mantém-se “outro” sem explicitar seu referente, conforme a indeterminação formal do grego. “Prover” conserva melhor o valor de ἐπιχορηγέω do que “conceder”.
