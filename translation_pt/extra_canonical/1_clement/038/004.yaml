base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: Portanto, visto que temos dele todas estas coisas, devemos, em tudo, dar-lhe graças; a ele seja a glória pelos séculos dos séculos. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες
  choice: Portanto, tendo recebido dele todas essas coisas
  rationale: Expressa com naturalidade a relação de procedência indicada por ἐξ αὐτοῦ e mantém o valor conclusivo de οὖν. “Tendo recebido” comunica em português corrente que tudo quanto possuem procede dele.
- source_word: κατὰ πάντα εὐχαριστεῖν αὐτῷ
  choice: dar-lhe graças em tudo
  rationale: Preserva a abrangência de κατὰ πάντα sem restringi-la a uma única forma de agradecimento; a expressão é clara, digna e idiomática.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pelos séculos dos séculos
  rationale: Mantém a forma intensiva tradicional da expressão grega, compreensível em português e apropriada ao registro doxológico.
theological_decisions:
- issue: Forma da doxologia relativa ᾧ ἡ δόξα
  choice: A ele seja a glória
  alternative: a quem pertence a glória
  rationale: A formulação preserva o caráter de aclamação ou desejo do original, sem transformar implicitamente a expressão em mera declaração de posse.
translation_notes:
  register: Português moderno, claro e solene, com cadência adequada a uma doxologia. A divisão em duas frases evita um período excessivamente longo sem alterar a relação lógica do grego.
