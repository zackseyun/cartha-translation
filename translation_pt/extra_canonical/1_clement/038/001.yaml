source:
  edition: Funk 1901 (normalized OCR)
  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: pt
  text: Assim, todo o nosso corpo seja preservado[a] em Cristo Jesus, e cada um se sujeite ao seu próximo, conforme foi designado em seu dom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja salvo”.'
    reason: O verbo grego pode indicar tanto preservação quanto salvação.
  - marker: b
    text: 'Mais literalmente: “conforme foi colocado em seu dom”.'
    reason: O verbo pode ser expresso como “foi colocado” ou “foi designado”; a construção grega é concisa e não especifica além disso a relação entre a designação e o dom.
lexical_decisions:
- source_word: σωζέσθω (refletido de forma corrompida como Συνξέσϑω no OCR)
  choice: seja preservado
  rationale: O texto transmitido é entendido como σωζέσθω, que pode significar ser salvo, conservado ou preservado. “Seja preservado” se ajusta ao corpo comunitário sem excluir a ressonância de salvação.
- source_word: ὅλον τὸ σῶμα
  choice: todo o nosso corpo
  rationale: Mantém a metáfora corporativa e a inclusão expressa pelo genitivo ἡμῶν.
- source_word: ὑποτασσέσθω
  choice: se sujeite
  rationale: Expressa submissão voluntária ou ordenada em linguagem portuguesa corrente e digna.
- source_word: τῷ πλησίον αὐτοῦ
  choice: ao seu próximo
  rationale: Tradução direta da expressão, preservando a referência ao outro membro da comunidade.
- source_word: ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ
  choice: a posição que lhe foi dada no dom que recebeu
  rationale: Torna inteligível a construção grega “foi colocado/designado em seu dom” sem apagar a ideia de uma posição atribuída em relação ao dom.
theological_decisions:
- issue: Sentido de σωζέσθω aplicado ao corpo inteiro
  choice: seja preservado
  alternative: seja salvo
  rationale: “Preservado” comunica adequadamente o imperativo passivo no contexto da integridade comunitária, enquanto a nota registra a possibilidade soteriológica mais explícita.
- issue: Relação entre designação e χάρισμα
  choice: conforme a posição que lhe foi dada no dom que recebeu
  alternative: conforme foi designado em seu dom
  rationale: A formulação principal conserva tanto a atribuição de uma posição quanto o dom, sem definir de modo denominacional a natureza de funções ou ministérios.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora do corpo, a reciprocidade da submissão e a relação algo ambígua entre posição e dom foram preservadas.
