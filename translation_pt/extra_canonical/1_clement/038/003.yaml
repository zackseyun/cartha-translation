id: 1CLEM.38.3
reference: 1 Clement 38:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: pt
  text: Consideremos, portanto, irmãos, de que matéria viemos a existir, que tipo de seres e quem éramos quando entramos no mundo[a], de que sepultura e escuridão aquele que nos moldou e criou nos trouxe para o seu mundo, tendo previamente preparado os seus benefícios[b], antes de nascermos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega distingue a condição ou qualidade (“que tipo de seres”) da identidade (“quem”).
    reason: Preservar a nuance da combinação ποῖοι καὶ τίνες, difícil de reproduzir de modo plenamente natural em português.
  - marker: b
    text: 'Ou: “atos de benevolência”. O termo pode designar benefícios ou atos de bondade concedidos por um benfeitor.'
    reason: Registrar a nuance cívica e relacional de εὐεργεσία sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: Consideremos
  rationale: Expressa a exortação reflexiva do aoristo subjuntivo sem acrescentar uma ideia ausente do texto.
- source_word: ἐκ ποίας ὕλης ἐγενήθημεν
  choice: de que matéria viemos a existir
  rationale: Preserva tanto a referência à matéria de origem quanto o sentido de vir a ser, evitando antecipar os verbos posteriores referentes a moldar e criar.
- source_word: ποῖοι καὶ τίνες
  choice: que tipo de seres e quem
  rationale: 'Mantém a dupla interrogação grega: ποῖοι trata da qualidade ou condição, enquanto τίνες trata da identidade.'
- source_word: τάφου καὶ σκότους
  choice: sepultura e escuridão
  rationale: Conserva a imagem forte e coordenada do grego sem explicar de modo especulativo a que ela se refere.
- source_word: ὁ πλάσας ἡμᾶς καὶ δημιουργήσας
  choice: aquele que nos moldou e criou
  rationale: 'Distingue os dois verbos: πλάσσω sugere dar forma ou moldar, e δημιουργέω, criar ou produzir.'
- source_word: εὐεργεσίας
  choice: benefícios
  rationale: Reflete o sentido de benefícios ou benfeitorias, incluindo a possível ressonância da linguagem greco-romana de benfeitoria, sem reduzi-la à noção genérica de presentes.
theological_decisions:
- issue: Referência de “sepultura e escuridão”
  choice: A imagem foi mantida sem identificação explícita.
  alternative: Explicá-la como o ventre materno, a condição humana anterior ao nascimento ou a morte espiritual.
  rationale: O texto não identifica diretamente o referente; explicitá-lo resolveria uma tensão metafórica que o grego deixa aberta.
- issue: Relação entre moldar e criar
  choice: Os dois atos foram preservados como verbos distintos.
  alternative: Fundir ambos em “criou”.
  rationale: A repetição expressiva do original caracteriza Deus com dois termos de ação criadora e não deve ser achatada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe levemente solene adequada a uma exortação eclesial antiga. “Irmãos” acompanha o vocativo masculino plural do grego e pode funcionar de modo coletivo no contexto. A longa estrutura periódica do original foi preservada, mas com escolhas lexicais naturais para leitores modernos.
