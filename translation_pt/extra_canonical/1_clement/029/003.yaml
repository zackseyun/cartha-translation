base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: pt
  text: 'E em outro lugar ele diz:


    “Eis que o Senhor toma para si uma nação do meio das nações,


    como um homem toma as primícias da sua eira;


    e daquela nação sairá aquilo que é santíssimo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva a fórmula enfática e introdutória do grego em registro bíblico claro e digno.
- source_word: λαμβάνει ἑαυτῷ
  choice: toma para si
  rationale: Reproduz tanto o ato de tomar quanto a ideia reflexiva de apropriação expressa por ἑαυτῷ.
- source_word: ἔθνος ἐκ μέσου ἐθνῶν
  choice: uma nação do meio das nações
  rationale: Mantém a repetição lexical e o contraste entre a nação escolhida e as demais nações.
- source_word: ἀπαρχὴν
  choice: primícias
  rationale: Conserva o sentido cultual e agrícola de primeira porção separada ou oferecida.
- source_word: ἅλω
  choice: eira
  rationale: Designa com precisão o espaço agrícola em que os grãos eram debulhados e joeirados.
- source_word: ἅγια ἁγίων
  choice: o Santo dos Santos
  rationale: Traduz literalmente o superlativo semítico preservado no grego; a forma masculina e singular acompanha a leitura tradicional de uma realidade ou figura santíssima que sai da nação.
theological_decisions:
- issue: Referente de ἅγια ἁγίων
  choice: o Santo dos Santos
  alternative: as coisas santíssimas / o lugar santíssimo
  rationale: A expressão é formalmente neutra plural em grego, embora funcione como fórmula superlativa e possa admitir mais de um referente. O contexto diz que ela 'sairá' da nação, favorecendo a tradução tradicional pessoal ou titular, sem explicitar além do texto quem é o referente.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. Mantêm-se as imagens bíblicas de 'primícias' e 'eira', bem como a ambiguidade reverente da expressão final, sem inserir identificação cristológica explícita ausente do enunciado.
