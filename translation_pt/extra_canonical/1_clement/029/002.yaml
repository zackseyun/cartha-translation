base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: pt
  text: 'Pois assim está escrito:


    “Quando o Altíssimo repartiu as nações,

    quando dispersou os filhos de Adão,

    fixou as fronteiras das nações

    segundo o número dos anjos de Deus.


    E Jacó, seu povo, tornou-se a porção do Senhor;

    Israel, o cordel da herança do Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεμέριζεν
  choice: repartiu
  rationale: Expressa a distribuição das nações pelo Altíssimo de modo natural, preservando o sentido do verbo grego.
- source_word: διέσπειρεν
  choice: dispersou
  rationale: Mantém a imagem de espalhar os descendentes de Adão entre as nações.
- source_word: υἱοὺς Ἀδάμ
  choice: filhos de Adão
  rationale: Tradução formal que conserva a expressão antropológica e a ligação explícita com Adão.
- source_word: ἀγγέλων θεοῦ
  choice: anjos de Deus
  rationale: Segue diretamente o texto grego citado por Clemente, sem substituí-lo por outra variante textual de Deuteronômio 32:8.
- source_word: μερὶς κυρίου
  choice: porção do Senhor
  rationale: Preserva a metáfora de pertencimento e herança do texto grego.
- source_word: σχοίνισμα κληρονομίας
  choice: linha de medir da sua herança
  rationale: Conserva a imagem concreta do cordel usado para medir ou demarcar uma propriedade, em vez de reduzi-la apenas a 'herança' ou 'lote'.
theological_decisions:
- issue: Leitura de Deuteronômio 32:8 na citação da Septuaginta
  choice: anjos de Deus
  alternative: filhos de Israel / filhos de Deus
  rationale: A tradução representa o texto grego de 1 Clemente fornecido, que lê ἀγγέλων θεοῦ, sem harmonização com outras formas textuais de Deuteronômio.
- issue: Referente do pronome em 'sua herança'
  choice: manter o pronome sem explicitação adicional
  alternative: a herança do Senhor
  rationale: O grego emprega pronome, e o contexto torna o Senhor o referente natural; preservar essa forma evita expansão interpretativa desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética para a citação. A coordenação por “E” foi preservada no início do quinto verso, refletindo καί. “Linha de medir” mantém a metáfora antiga em linguagem compreensível.
