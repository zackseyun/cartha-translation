id: 1CLEM.29.1
reference: 1 Clement 29:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: pt
  text: Portanto, aproximemo-nos dele com santidade de alma, erguendo para ele mãos puras e sem mancha, amando o nosso Pai bondoso e compassivo, que fez de nós uma porção escolhida para si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέλθωμεν
  choice: aproximemo-nos
  rationale: Preserva o sentido exortativo e relacional de προσέρχομαι, com português natural e digno.
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: com santidade de alma
  rationale: Traduz de modo direto a esfera ou disposição interior expressa por ἐν e mantém a dimensão religiosa de ὁσιότης.
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: mãos puras e sem mancha
  rationale: Mantém a construção atributiva grega e distingue naturalmente os sentidos complementares de pureza e ausência de contaminação.
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: bondoso e compassivo
  rationale: Neste contexto, ἐπιεικής descreve uma bondade branda e benevolente, enquanto εὔσπλαγχνος ressalta a compaixão profunda.
- source_word: ἐκλογῆς μέρος
  choice: uma porção escolhida
  rationale: Conserva a imagem de μέρος e o sentido eletivo de ἐκλογή sem expandi-lo para uma formulação doutrinária mais específica.
theological_decisions:
- issue: Sentido de ἐκλογῆς μέρος
  choice: uma porção escolhida
  alternative: parte de sua eleição
  rationale: A opção escolhida reproduz a ideia de um grupo separado por escolha e combina naturalmente com ἑαυτῷ, sem decidir além do texto questões sobre a natureza da eleição.
- issue: Referente e direção de πρὸς αὐτόν
  choice: para ele
  alternative: a ele
  rationale: A formulação mantém explícita a orientação das mãos erguidas a Deus, preservando a imagem cultual sem acrescentar uma referência específica à oração.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira; tom exortativo, reverente e digno. A ordem das ideias e a imagem cultual das mãos erguidas foram preservadas sem rigidez sintática.
