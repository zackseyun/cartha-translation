source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: pt
  text: Pois vocês conhecem as Sagradas Escrituras — e as conhecem muito bem, amados — e têm se debruçado sobre os oráculos de Deus.[a] Por isso, escrevemos estas coisas como lembrança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm examinado atentamente os pronunciamentos de Deus”.'
    reason: Registra o sentido figurado contextual de ἐγκεκύφατε e uma alternativa mais explicativa para λόγια, enquanto o texto principal preserva a imagem grega e o peso de “oráculos”.
lexical_decisions:
- source_word: Ἐπίστασθε ... καὶ καλῶς ἐπίστασθε
  choice: vocês conhecem ... e as conhecem muito bem
  rationale: Reproduz a repetição enfática do grego em português natural e claro.
- source_word: τὰς ἱερὰς γραφάς
  choice: as Sagradas Escrituras
  rationale: Expressão consagrada e fiel para o conjunto de escritos sagrados referido no contexto.
- source_word: ἐγκεκύφατε
  choice: têm se debruçado
  rationale: Conserva a imagem literal de inclinar-se sobre algo e comunica, no contexto textual, exame cuidadoso e contínuo.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: os oráculos de Deus
  rationale: Mantém o peso de pronunciamentos divinos autorizados associado a λόγια, sem reduzi-los a meros ditos.
- source_word: πρὸς ἀνάμνησιν
  choice: para relembrá-los
  rationale: 'Expressa idiomaticamente a finalidade da escrita: trazer novamente à memória dos destinatários aquilo que já conhecem.'
theological_decisions:
- issue: Relação entre as Sagradas Escrituras e os λόγια de Deus
  choice: Preservar as duas expressões, traduzindo λόγια por “oráculos de Deus”
  alternative: Fundir ambas como simples referências às Escrituras ou traduzir λόγια por “palavras”/“ditos”
  rationale: O grego emprega formulações distintas e atribui autoridade divina ao conteúdo examinado; a tradução não deve apagar nem definir além do texto a relação exata entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita rigidez arcaizante; “amados” preserva o vocativo pastoral. A colocação do marcador após a oração inteira permite que a nota abranja tanto o verbo quanto o substantivo.
