  text: And Moses said, "If you will forgive their sin, forgive; but if not, blot me also out of the book of the living."
translation:
  language: pt
  text: 'E Moisés disse: “De modo nenhum, Senhor! Perdoa o pecado deste povo ou, ao menos, apaga-me do livro dos vivos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς, κύριε
  choice: De modo nenhum, Senhor!
  rationale: Preserva a enfática recusa inicial do grego, ausente na redação inglesa revisada, e a liga naturalmente à proposta divina descrita no contexto anterior.
- source_word: ἄφες τὴν ἁμαρτίαν τῷ λαῷ τούτῳ
  choice: Perdoa o pecado deste povo
  rationale: ἄφες, neste contexto, significa remitir ou perdoar; a construção portuguesa mantém o singular coletivo “pecado” do texto grego.
- source_word: ἢ κἂν
  choice: caso contrário
  rationale: 'Expressa em português corrente a alternativa extrema introduzida pelo grego: se o perdão não for concedido, Moisés pede para compartilhar o destino do povo. O valor intensivo de καί é representado por “também” junto de “a mim”.'
- source_word: ἐξάλειψόν με
  choice: apaga também a mim
  rationale: Mantém a metáfora de apagar um nome ou uma pessoa de um registro, sem explicá-la além do que o texto diz.
- source_word: ἐκ βίβλου ζώντων
  choice: do livro dos vivos
  rationale: Tradução direta e idiomática da expressão, preservando a imagem do registro dos que vivem.
theological_decisions:
- issue: Forma do apelo de Moisés
  choice: Conservar a recusa enfática “De modo nenhum, Senhor!” seguida do pedido de perdão e da alternativa de ser apagado com o povo.
  alternative: Adotar a formulação condicional “Se perdoares... mas, se não...” da camada inglesa.
  rationale: O texto grego fornecido contém explicitamente Μηδαμῶς, κύριε e não apresenta uma oração condicional equivalente a “se perdoares”. A tradução segue prioritariamente a evidência grega e preserva a tensão da intercessão de Moisés.
- issue: Sentido de “livro dos vivos”
  choice: Manter a expressão sem identificar ou explicar que livro é esse.
  alternative: Interpretá-lo explicitamente como livro da vida, registro celestial ou salvação eterna.
  rationale: A passagem emprega uma imagem que admite mais de uma compreensão; especificar sua natureza importaria uma interpretação teológica não declarada no texto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação evidencia a recusa enfática e o apelo intercessório sem acrescentar uma explicação doutrinária.
