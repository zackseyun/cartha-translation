base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: pt
  text: 'E o Senhor lhe disse: “Já lhe falei uma e duas vezes, dizendo: ‘Vi este povo, e eis que é obstinado. Deixe-me destruí-los, e apagarei o nome deles de debaixo do céu; e farei de você uma nação grande, admirável e muito maior do que este.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκληροτράχηλος
  choice: obstinado
  rationale: O sentido literal é “de dura cerviz”, metáfora bíblica para resistência teimosa. “Obstinado” comunica esse sentido em português corrente e digno sem exigir uma expressão pouco usual.
- source_word: ἔασόν με
  choice: Deixe-me
  rationale: Preserva a forma direta do imperativo e a tensão retórica do pedido divino a Moisés.
- source_word: ἐξολεθρεῦσαι
  choice: destruí-los
  rationale: Traduz o verbo de destruição completa sem acrescentar um intensificador ausente do texto grego.
- source_word: ἐξαλείψω
  choice: apagarei
  rationale: Mantém a imagem de eliminar ou apagar um nome de um registro ou da memória.
- source_word: θαυμαστὸν
  choice: admirável
  rationale: Expressa aquilo que causa admiração, evitando restringir o termo ao sentido moderno de “milagroso”.
theological_decisions:
- issue: A ordem divina “Deixe-me”
  choice: Manter a formulação direta e antropomórfica
  alternative: Parafrasear como uma simples declaração de intenção divina
  rationale: O grego apresenta uma ordem dirigida a Moisés; preservar essa forma mantém a tensão narrativa e teológica sem explicá-la segundo um sistema doutrinário.
- issue: Comparação da nova nação com o povo existente
  choice: “maior do que esta”
  alternative: “muito maior do que esta”
  rationale: Embora πολὺ μᾶλλον possa reforçar a comparação, a formulação concisa evita sobrecarregar o português e acompanha a leitura auditada, preservando a comparação explícita.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O discurso conserva solenidade bíblica sem arcaísmos como “eis-me” ou “dura cerviz”. A repetição “uma e duas vezes” foi mantida por corresponder à formulação enfática do grego.
