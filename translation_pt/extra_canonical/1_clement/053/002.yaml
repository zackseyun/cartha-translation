base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: pt
  text: 'Pois, quando Moisés subiu ao monte e passou quarenta dias e quarenta noites em jejum e humilhação, Deus lhe disse: “Moisés, Moisés, desça depressa daqui, porque o seu povo, que você tirou da terra do Egito, agiu contra a lei. Logo se desviaram do caminho que lhes ordenei; fizeram para si imagens fundidas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσαντος τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας
  choice: passou quarenta dias e quarenta noites
  rationale: Expressa de modo natural o idiomatismo grego de passar determinado período, sem perder sua duração.
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: em jejum e humilhação
  rationale: Mantém os dois substantivos e preserva o sentido de rebaixamento ou humilhação voluntária, sem especificar além do grego.
- source_word: ἠνόμησεν
  choice: agiu contra a lei
  rationale: Reproduz a referência explícita à transgressão da lei presente no verbo, em linguagem clara e atual.
- source_word: χωνευτά
  choice: imagens de metal fundido
  rationale: O adjetivo substantivado designa objetos ou imagens produzidos por fundição; “imagens” é adequado ao contexto da idolatria e evita limitar o plural a uma única figura.
- source_word: κατάβηθι τὸ τάχος ἐντεῦθεν
  choice: desça depressa daqui
  rationale: Conserva o imperativo, a urgência e o ponto de partida indicados no grego.
theological_decisions:
- issue: Natureza dos objetos fundidos
  choice: imagens de metal fundido
  alternative: ídolos de metal fundido
  rationale: “Ídolos” explicitaria a função religiosa, mas o grego diz literalmente “coisas fundidas”; “imagens de metal fundido” transmite o contexto sem inserir uma classificação interpretativa desnecessária.
- issue: Sentido de ταπείνωσις
  choice: humilhação
  alternative: humildade / mortificação
  rationale: “Humilhação” preserva a ideia de rebaixamento e disciplina pessoal. “Humildade” poderia sugerir apenas uma disposição interior, e “mortificação” acrescentaria terminologia ascética posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Emprega “você” porque Deus se dirige diretamente a Moisés no singular; mantém “lhes” ao mudar a referência para o povo no plural. A estrutura narrativa e a repetição enfática “Moisés, Moisés” foram preservadas.
