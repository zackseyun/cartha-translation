  naturalness: O português é claro, moderno e adequado ao registro. «Depressa se desviaram» é compreensível, mas «logo se desviaram» soa mais idiomático nesse sentido temporal de rápida apostasia.
  terminology: «Jejum e humilhação» reproduz adequadamente ἐν νηστείᾳ καὶ ταπεινώσει, sem impor leitura ascética específica. «Agiu contra a lei» transmite bem ἠνόμησεν. «Imagens fundidas» preserva o sentido contextual de χωνευτά sem acrescentar que fossem especificamente de metal.
