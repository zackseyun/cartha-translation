base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/005.yaml
  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: pt
  text: Ó grande amor! Ó perfeição insuperável! Um servo fala com ousadia ao Senhor, pede perdão para a multidão ou até pede que ele próprio seja apagado com eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ μεγάλης ἀγάπης
  choice: Ó grande amor!
  rationale: Reproduz a exclamação admirativa grega em português natural e dignificado.
- source_word: τελειότητος ἀνυπερβλήτου
  choice: perfeição insuperável
  rationale: Mantém o sentido de uma perfeição que não pode ser excedida.
- source_word: παρρησιάζεται
  choice: fala com ousadia
  rationale: Expressa a ideia de falar franca e confiantemente perante alguém de posição superior.
- source_word: θεράπων
  choice: servo
  rationale: No contexto, designa alguém que serve ao Senhor; «servo» preserva o contraste retórico sem sugerir necessariamente escravidão.
- source_word: τῷ πλήθει
  choice: para a multidão
  rationale: Conserva a referência coletiva e abrangente do substantivo grego.
- source_word: ἀξιοῖ
  choice: chega a pedir
  rationale: Comunica a força contextual de solicitar ou requerer algo para si, sem o tom potencialmente jurídico de «reivindica».
- source_word: ἐξαλειφθῆναι
  choice: ser apagado
  rationale: Preserva a imagem de apagar um nome do livro, retomando diretamente o contexto do versículo anterior.
theological_decisions:
- issue: Relação entre o servo e o Senhor
  choice: diante do Senhor
  alternative: ao seu Senhor
  rationale: «Diante do Senhor» mantém a assimetria e a ousadia do discurso, sem inserir o possessivo «seu», ausente no grego.
- issue: Alcance da intercessão de Moisés
  choice: pede perdão para a multidão
  alternative: pede a libertação da multidão
  rationale: No contexto imediato, ἄφεσις retoma o pedido de perdão pelo pecado em 53:4; «perdão» é, portanto, a leitura contextual mais precisa.
- issue: Pedido de ser apagado com o povo
  choice: que ele próprio seja apagado junto com eles
  alternative: que também ele fosse eliminado com eles
  rationale: «Apagado» preserva a metáfora textual do livro dos vivos, enquanto «junto com eles» mantém aberta a natureza exata do destino solicitado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom exclamativo e solene do original foi preservado, com sintaxe clara e sem arcaísmos desnecessários.
