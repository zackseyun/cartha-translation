source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ τοῦτο οὐ καινῶς· ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο περὶ ἐπισκόπων καὶ διακόνων. οὕτως γάρ που λέγει ἡ γραφή· Καταστήσω τοὺς ἐπισκόπους αὐτῶν ἐν δικαιοσύνῃ καὶ τοὺς διακόνους αὐτῶν ἐν πίστει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: pt
  text: 'E isso não era novidade, pois, de fato, já havia sido escrito havia muito tempo a respeito de supervisores[a] e diáconos. Pois assim diz a Escritura em certo lugar: “Estabelecerei os supervisores deles em justiça e os diáconos deles em fé[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bispos”. O termo grego também tem o sentido básico de “supervisores”.
    reason: Preserva a possibilidade de entender ἐπίσκοποι como título comunitário tradicional ou como designação funcional.
  - marker: b
    text: Ou “fidelidade”.
    reason: πίστις pode indicar tanto fé quanto fidelidade neste contexto.
lexical_decisions:
- source_word: ἐπισκόπων / ἐπισκόπους
  choice: supervisores
  rationale: Expressa o sentido básico de pessoas encarregadas de supervisionar e preserva a repetição lexical entre a exposição e a citação; a nota registra a tradução eclesiástica tradicional “bispos”.
- source_word: διακόνων / διακόνους
  choice: diáconos
  rationale: O contexto trata de funções comunitárias, e “diáconos” é natural em português, além de manter a correspondência entre a exposição e a citação.
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο
  choice: pois, de fato, já havia muito tempo estava escrito
  rationale: Reproduz o valor enfático de γὰρ δὴ, a anterioridade de ἐγέγραπτο e a ideia temporal de ἐκ πολλῶν χρόνων em português natural.
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: Pois assim diz a Escritura em certo lugar
  rationale: Mantém tanto οὕτως (“assim”) quanto που (“em certo lugar”), sem omitir nenhum elemento da fórmula de citação.
- source_word: πίστει
  choice: fé
  rationale: Preserva a tradução direta e tradicional de πίστις, enquanto a nota reconhece que, neste contexto, o termo também pode designar fidelidade.
theological_decisions:
- issue: Caráter técnico ou descritivo de ἐπίσκοποι
  choice: supervisores
  alternative: bispos
  rationale: “Supervisores” evita projetar sobre o século I uma estrutura episcopal posterior, sem negar que o termo já possa designar uma função comunitária reconhecida; a alternativa tradicional consta em nota.
- issue: Sentido de πίστις na citação
  choice: fé
  alternative: fidelidade
  rationale: O grego permite ambos os sentidos. O texto principal conserva “fé”, e a nota explicita a alternativa ética de “fidelidade”, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formulação natural para leitores brasileiros. A repetição de “supervisores” e “diáconos” foi mantida de propósito para refletir o argumento baseado na citação das Escrituras.
