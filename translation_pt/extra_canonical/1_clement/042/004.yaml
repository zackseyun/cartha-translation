source:
  edition: Funk 1901 (normalized OCR)
  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: pt
  text: Assim, pregando por regiões e cidades, designavam como supervisores e diáconos dos que viriam a crer os seus primeiros convertidos, depois de os examinarem pelo Espírito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ χώρας οὖν καὶ πόλεις
  choice: Assim, ... por regiões e cidades
  rationale: Mantém a progressão inferencial de οὖν e expressa naturalmente a distribuição geográfica indicada por κατά.
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: os primeiros convertidos dentre eles
  rationale: ἀπαρχαί significa literalmente 'primícias', mas aqui designa provavelmente os primeiros frutos humanos da pregação, isto é, os primeiros convertidos. 'Dentre eles' preserva a referência pronominal sem sugerir que eram primícias pertencentes aos apóstolos.
- source_word: δοκιμάσαντες
  choice: depois de os terem provado
  rationale: Comunica exame e aprovação após verificação, sem reduzir o termo a uma simples experiência ou teste informal.
- source_word: τῷ πνεύματι
  choice: pelo Espírito
  rationale: Preserva o dativo como meio ou agência e a provável referência ao Espírito divino, sem acrescentar 'Santo', ausente no texto.
- source_word: ἐπισκόπους
  choice: supervisores
  rationale: Traduz a função básica do termo grego de modo inteligível e evita importar automaticamente um título eclesiástico posterior específico.
- source_word: διακόνους
  choice: diáconos
  rationale: O empréstimo já é corrente em português e representa adequadamente a função comunitária indicada pelo termo.
- source_word: τῶν μελλόντων πιστεύειν
  choice: dos que viriam a crer
  rationale: Conserva a orientação futura da construção com μέλλω e o sentido verbal de passar a crer.
theological_decisions:
- issue: Agente ou esfera da avaliação dos primeiros convertidos
  choice: pelo Espírito
  alternative: espiritualmente / em espírito
  rationale: A construção τῷ πνεύματι admite discussão, mas o contexto cristão favorece o Espírito como meio ou agente da avaliação. A tradução mantém a formulação breve do grego e não explicita um mecanismo.
- issue: Natureza do cargo designado por ἐπίσκοποι
  choice: supervisores
  alternative: bispos
  rationale: O sentido funcional é seguro, enquanto 'bispos' pode evocar estruturas eclesiásticas posteriores não necessariamente definidas neste estágio do texto.
- issue: Sentido de ἀπαρχαί aplicado a pessoas
  choice: primeiros convertidos
  alternative: primícias
  rationale: A metáfora cultual é genuína, mas em português corrente 'primícias' pode obscurecer que se trata de pessoas inicialmente alcançadas pela missão. A escolha torna o referente claro sem definir além disso sua condição teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente. A formulação preserva a sequência entre pregação, avaliação e designação, bem como a referência prospectiva aos futuros crentes.
