  to: Assim, pregando por regiões e cidades, designavam como supervisores e diáconos dos que viriam a crer os seus primeiros convertidos, depois de os examinarem pelo Espírito.
  rationale: A revisão substitui a relação imprecisa sugerida por «dentre eles» pela posse expressa em αὐτῶν e ajusta a ordem dos constituintes para que «dos que viriam a crer» se leia naturalmente como complemento de «supervisores e diáconos». «Examinarem» representa de modo idiomático δοκιμάσαντες, mantendo a avaliação prévia e a formulação instrumental «pelo Espírito».
