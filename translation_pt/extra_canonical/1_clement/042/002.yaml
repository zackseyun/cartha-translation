source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: pt
  text: Portanto, o Messias vem de Deus, e os apóstolos vêm do Messias; assim, as duas coisas aconteceram de forma ordenada, pela vontade de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Traduz o título grego pelo seu sentido, em linguagem corrente, sem tratá-lo como nome próprio.
- source_word: ἀπό
  choice: vem de / vêm do
  rationale: Preserva a ideia ampla de origem ou procedência sem especificar além do que o grego declara.
- source_word: ἀμφότερα
  choice: as duas coisas
  rationale: 'O neutro plural retoma os dois fatos paralelos: o Messias vir de Deus e os apóstolos virem do Messias.'
- source_word: εὐτάκτως
  choice: de forma ordenada
  rationale: Expressa a ideia de ordem apropriada e bem estabelecida em português natural.
- source_word: ἐκ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: É a formulação idiomática em português para indicar que os dois acontecimentos se deram por determinação ou iniciativa da vontade divina.
theological_decisions:
- issue: Sentido da procedência do Messias e dos apóstolos
  choice: vem de Deus / vêm do Messias
  alternative: foi enviado por Deus / foram enviados pelo Messias
  rationale: O contexto pode envolver envio e comissão, mas ἀπό exprime diretamente procedência; a tradução mantém essa amplitude em vez de explicitar apenas o envio.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre as duas orações. A repetição de «Messias» foi mantida para refletir a estrutura enfática do grego.
