id: 1CLEM.42.3
reference: 1 Clement 42:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: pt
  text: Portanto, depois de receberem instruções, de receberem plena certeza por meio da ressurreição de nosso Senhor Jesus Messias e de serem confirmados na palavra de Deus, eles saíram com a plena certeza do Espírito Santo, anunciando a boa notícia de que o reino de Deus estava para vir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está para vir”.
    reason: O grego preserva na oração infinitiva a perspectiva da proclamação original, permitindo em português tanto o recuo temporal natural do discurso indireto (“estava”) quanto a apresentação mais imediata (“está”).
lexical_decisions:
- source_word: παραγγελίας
  choice: instruções
  rationale: O substantivo pode indicar ordens, instruções ou uma incumbência. “Instruções” conserva a amplitude do termo e se ajusta ao contexto do envio dos apóstolos.
- source_word: πληροφορηθέντες / πληροφορίας
  choice: alcançarem plena certeza / plena certeza
  rationale: A repetição da raiz grega foi mantida em português. O campo semântico envolve plenitude de convicção ou certeza, e não apenas recebimento de informação.
- source_word: διὰ τῆς ἀναστάσεως
  choice: por meio da ressurreição
  rationale: 'Expressa o valor instrumental de διά com genitivo: a ressurreição é o meio pelo qual eles alcançam plena certeza.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Messias
  rationale: Χριστός conserva aqui seu valor titular, correspondente a “Messias”, em vez de ser tratado apenas como nome próprio tradicional.
- source_word: πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ
  choice: serem confirmados na palavra de Deus
  rationale: Mantém a formulação preposicional e a ideia de terem sido tornados firmes ou seguros, sem especificar além do grego se a palavra é esfera ou instrumento.
- source_word: εὐαγγελιζόμενοι
  choice: anunciando a boa notícia
  rationale: Traduz o sentido verbal concreto de proclamar boas novas, em linguagem clara e não excessivamente técnica.
- source_word: μέλλειν ἔρχεσθαι
  choice: estava para vir
  rationale: A construção indica iminência ou expectativa futura; o imperfeito português acompanha naturalmente o ponto de vista passado do verbo principal.
theological_decisions:
- issue: Relação do Espírito Santo com a plena certeza
  choice: com a plena certeza do Espírito Santo
  alternative: com a plena certeza dada pelo Espírito Santo
  rationale: O genitivo πνεύματος ἁγίου não explicita sozinho se é fonte, origem ou caracterização. A redação principal preserva essa abertura, enquanto a alternativa resolveria o genitivo como fonte.
- issue: Perspectiva temporal da vinda do reino
  choice: estava para vir
  alternative: está para vir
  rationale: A escolha representa a proclamação a partir do ponto de vista narrativo passado. Como o infinitivo grego não exige retrocesso temporal do mesmo modo que o português, a alternativa em discurso indireto mais vívido continua possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de “plena certeza” reflete a repetição lexical grega. O marcador [a] foi colocado junto à expressão temporal a que a nota efetivamente se refere.
