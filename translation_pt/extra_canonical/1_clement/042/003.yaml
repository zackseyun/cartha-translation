  to: Portanto, depois de receberem instruções, de receberem plena certeza por meio da ressurreição de nosso Senhor Jesus Messias e de serem confirmados na palavra de Deus, eles saíram com a plena certeza do Espírito Santo, anunciando a boa notícia de que o reino de Deus estava para vir.[a]
  rationale: A única alteração necessária substitui a construção ativa “alcançarem plena certeza” por “receberem plena certeza”, que preserva o sentido passivo de πληροφορηθέντες sem sacrificar a repetição de “plena certeza” correspondente à raiz πληροφορ-. A nota permanece corretamente ancorada na expressão temporal e conserva a ambiguidade de perspectiva do infinitivo grego.
