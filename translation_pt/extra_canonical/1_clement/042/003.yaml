review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha adequadamente a sequência sintática e os principais termos do grego, inclusive a repetição de πληροφορ- (“plena certeza”), o valor instrumental de διὰ τῆς ἀναστάσεως e a iminência em μέλλειν ἔρχεσθαι. Contudo, “de alcançarem plena certeza” torna ativo o particípio passivo πληροφορηθέντες; a formulação deve indicar que essa certeza lhes foi dada ou que eles foram assegurados.
  naturalness: O texto é claro, moderno e de registro apropriado. “Receberem plena certeza” é mais natural e preserva melhor a voz passiva do que “alcançarem plena certeza”. A repetição de “plena certeza” é justificável, pois reflete a repetição lexical deliberada do original.
  terminology: “Jesus Messias”, “palavra de Deus”, “Espírito Santo”, “reino de Deus” e “boa notícia” são escolhas adequadas. “Estava para vir” reproduz de modo natural a perspectiva narrativa passada; a nota registra apropriadamente a possibilidade de uma apresentação temporal mais imediata.
  issues:
