source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: pt
  text: Os apóstolos receberam, para nós, a boa-nova da parte do Senhor Jesus Cristo; Jesus, o Cristo, foi enviado por Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐηγγελίσθησαν
  choice: receberam ... as boas-novas
  rationale: O aoristo passivo indica que os apóstolos foram destinatários do anúncio. A formulação preserva esse sentido passivo de modo natural em português, sem sugerir aqui que eles anunciaram as boas-novas.
- source_word: ἡμῖν
  choice: para nós
  rationale: Mantém o dativo em sua relação com as boas-novas recebidas pelos apóstolos em benefício da comunidade, preservando a formulação algo incomum do grego.
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: da parte do Senhor Jesus Cristo
  rationale: Expressa a origem ou procedência indicada por ἀπό com linguagem portuguesa natural.
- source_word: ἐξεπέμφθη
  choice: foi enviado
  rationale: Traduz o aoristo passivo de ἐκπέμπω. Em português, 'enviado' comunica adequadamente o envio comissionado sem exigir o pouco natural 'enviado para fora'.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: Com o verbo passivo, ἀπό assinala a fonte ou agente do envio; 'por Deus' é claro e idiomático.
theological_decisions:
- issue: Tradução das duas ocorrências de Χριστός
  choice: Na primeira, integrar ao nome como 'Jesus Cristo'; na segunda, tornar o título explícito como 'Jesus, o Cristo'.
  alternative: Traduzir ambas como 'Jesus Cristo' ou ambas como 'Jesus, o Messias'.
  rationale: O grego distingue Ἰησοῦ Χριστοῦ, sem artigo, de Ἰησοῦς ὁ Χριστός, com artigo. A tradução conserva essa diferença, fazendo sobressair na segunda oração o caráter titular de 'o Cristo', sem impor uma interpretação adicional.
- issue: Relação paralela entre os apóstolos, Cristo e Deus
  choice: Preservar as duas declarações coordenadas e a repetição de Jesus Cristo.
  alternative: Fundir as orações ou explicitar uma cadeia de autoridade.
  rationale: A estrutura concisa do original apresenta uma correspondência entre a missão dos apóstolos e o envio de Cristo. Mantê-la evita desenvolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O ponto e vírgula conserva o paralelismo enfático das duas orações. Não foram necessárias notas de rodapé.
