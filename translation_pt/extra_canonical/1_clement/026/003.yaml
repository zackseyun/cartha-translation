  yaml_path: translation/extra_canonical/1_clement/026/003.yaml
  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
translation:
  language: pt
  text: 'E, novamente, Jó diz: “E tu levantarás esta minha carne, que suportou todas estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεις
  choice: levantarás
  rationale: Preserva o sentido futuro e transitivo de fazer levantar, adequado ao contexto de ressurreição, sem explicitar mais do que o grego.
- source_word: σάρκα
  choice: carne
  rationale: Equivalente direto de σάρξ, preservando a linguagem corporal concreta da citação.
- source_word: ἀναντλήσασαν
  choice: suportou
  rationale: Expressa a ideia de ter aguentado ou passado por todos esses sofrimentos, em português natural e próximo do valor contextual do particípio.
theological_decisions:
- issue: Agente e natureza do levantamento da carne
  choice: “tu levantarás esta minha carne”
  alternative: “tu ressuscitarás o meu corpo”
  rationale: A tradução mantém a segunda pessoa e a imagem literal de levantar a carne, deixando que o contexto comunique a ressurreição sem substituir σάρξ por “corpo” nem tornar o verbo mais específico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego. O nome Ἰὼβ é vertido pela forma portuguesa consagrada, “Jó”.
