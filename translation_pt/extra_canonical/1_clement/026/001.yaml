source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: pt
  text: Portanto, consideramos grande e maravilhoso que o Criador de todas as coisas venha a realizar a ressurreição daqueles que o serviram em santidade, com a confiança de uma fé boa, visto que até por meio de uma ave ele nos mostra a grandeza de sua promessa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: Criador de todas as coisas
  rationale: Expressa naturalmente a ideia do autor e preserva a abrangência de ἁπάντων.
- source_word: ἀνάστασιν ποιήσεται
  choice: realizará a ressurreição
  rationale: Mantém a construção causativa do grego sem recorrer a uma formulação pesada.
- source_word: ὁσίως αὐτῷ δουλευσάντων
  choice: daqueles que o serviram em santidade
  rationale: Preserva tanto o serviço prestado a Deus quanto o caráter santo ou piedoso desse serviço.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: com a confiança que vem de uma fé boa
  rationale: Torna clara a relação entre confiança e fé sem eliminar a possível força qualitativa de ἀγαθῆς.
- source_word: δι᾿ ὀρνέου
  choice: por meio de uma ave
  rationale: Mantém a referência genérica do grego; o contexto subsequente identifica a ave.
- source_word: τὸ μεγαλεῖον
  choice: a grandeza
  rationale: Equivalente corrente e digno para a majestade ou magnitude da promessa.
theological_decisions:
- issue: Forma da pergunta retórica sobre a ressurreição
  choice: Manter a pergunta retórica, afirmando que o Criador realizará a ressurreição
  alternative: 'Traduzir como uma declaração direta ou usar uma construção condicional mais literal: “se o Criador vier a realizar”'
  rationale: A partícula εἰ introduz o conteúdo considerado grande e maravilhoso, não necessariamente dúvida quanto à ressurreição; a pergunta retórica preserva a força argumentativa do texto.
- issue: Sentido de πίστεως ἀγαθῆς
  choice: “fé boa”
  alternative: “boa-fé” ou “fé genuína”
  rationale: “Boa-fé” em português tende a indicar honestidade civil ou sinceridade, enquanto “genuína” resolve uma nuance que o grego não explicita. A formulação escolhida conserva a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe retórica natural. Evitou-se “Fabricante” para δημιουργός por soar mecânico; “Criador” é corrente neste contexto. A frase longa do original foi preservada sem perder legibilidade.
