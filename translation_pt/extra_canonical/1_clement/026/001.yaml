revisions:
- from: Portanto, consideramos algo grande e maravilhoso que o Criador de todas as coisas realizará a ressurreição daqueles que o serviram em santidade, com a confiança que vem de uma fé boa, quando até por meio de uma ave ele nos mostra a grandeza de sua promessa?
  to: Portanto, consideramos grande e maravilhoso que o Criador de todas as coisas venha a realizar a ressurreição daqueles que o serviram em santidade, com a confiança de uma fé boa, visto que até por meio de uma ave ele nos mostra a grandeza de sua promessa?
  rationale: A revisão preserva a pergunta retórica e o futuro contemplado no grego, empregando uma condição prospectiva idiomática em português. Remove a inferência causal entre fé e confiança e explicita a função probatória da referência à ave, sem identificá-la antecipadamente nem acrescentar interpretação doutrinária.
