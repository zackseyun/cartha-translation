  text: λέγει γάρ που· Καὶ ἐξαναστήσεις με, καὶ ἐξομολογήσομαί σοι· καί· Ἐκοιμήθην καὶ ὕπνωσα, ἐξηγέρθην, ὅτι σὺ μετ᾿ ἐμοῦ εἶ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: pt
  text: 'Pois em certo lugar ele diz: “Tu me levantarás, e eu te darei graças”; e também: “Deitei-me e dormi; despertei, porque tu estás comigo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: levantarás
  rationale: O verbo significa fazer levantar ou erguer; no contexto de 1 Clemente 26, conserva a possível alusão à ressurreição sem torná-la mais explícita do que o grego.
- source_word: ἐξομολογήσομαί
  choice: darei graças
  rationale: Neste contexto de fala dirigida a Deus, o verbo tem sentido de louvar ou agradecer, não de confessar pecados.
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: Deitei-me e dormi
  rationale: Reproduz naturalmente a sequência grega, preservando a imagem do sono que, no contexto, pode evocar a morte.
- source_word: ἐξηγέρθην
  choice: despertei
  rationale: Corresponde ao despertar do sono e mantém a ressonância possível de ser levantado ou ressuscitado.
- source_word: μετ᾿ ἐμοῦ
  choice: comigo
  rationale: Tradução direta e idiomática da expressão de companhia ou presença.
theological_decisions:
- issue: Ressonância de ressurreição na linguagem de levantar e despertar
  choice: Preservar as imagens de levantar e despertar sem inserir explicitamente “ressuscitar”.
  alternative: Traduzir ἐξαναστήσεις ou ἐξηγέρθην por “ressuscitarás” ou “ressuscitei”.
  rationale: O contexto do capítulo aplica essas citações à ressurreição, mas as próprias frases mantêm imagens que também podem ser lidas literalmente como levantar-se e despertar; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leve cadência escritural. “Em certo lugar” preserva a fórmula indefinida λέγει γάρ που; “e também” torna idiomática a introdução da segunda citação.
