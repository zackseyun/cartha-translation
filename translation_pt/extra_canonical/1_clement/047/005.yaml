  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
translation:
  language: pt
  text: Mas agora considerem quais pessoas os desviaram e diminuíram a dignidade do renomado amor fraternal de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quais pessoas os perverteram e reduziram o caráter venerável do tão comentado amor fraternal de vocês».'
    reason: Preserva alternativas mais literais para διέστρεψαν, τὸ σεμνόν e περιβοήτου, mantendo o plural expresso de τίνες e dos verbos gregos.
lexical_decisions:
- source_word: κατανοήσατε
  choice: considerem
  rationale: Expressa o imperativo de examinar ou refletir atentamente, em linguagem portuguesa natural e digna.
- source_word: τίνες
  choice: quem
  rationale: O português usa naturalmente o pronome invariável «quem»; a concordância plural dos verbos gregos indica que se trata de pessoas, sem necessidade de explicitação artificial.
- source_word: διέστρεψαν
  choice: desviou
  rationale: No contexto, comunica que certas pessoas fizeram os destinatários se afastarem do caminho correto, evitando o sentido moderno potencialmente sexual ou moralizante de «perverteu».
- source_word: τὸ σεμνὸν
  choice: a dignidade
  rationale: O adjetivo substantivado denota a qualidade venerável, nobre ou digna atribuída ao amor fraternal.
- source_word: περιβοήτου
  choice: renomado
  rationale: Reproduz o sentido contextual de algo célebre ou muito conhecido, com registro elevado e natural.
- source_word: φιλαδελφίας
  choice: amor fraternal
  rationale: Traduz o amor próprio da relação entre irmãos, aqui aplicado à comunidade cristã, sem acrescentar uma interpretação denominacional.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil. O plural dirigido à comunidade é expresso por «considerem» e «vocês»; com «quem», os verbos aparecem naturalmente no singular em português, embora o grego τίνες e os verbos no plural apontem para mais de um agente.
