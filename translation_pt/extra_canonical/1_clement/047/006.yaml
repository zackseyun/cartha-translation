  rationale: A revisão elimina uma adição verbal não exigida pelo grego e melhora a naturalidade de βεβαιοτάτην em português, preservando o sentido, a ênfase retórica, os termos-chave e a ambiguidade da expressão ἐν Χριστῷ.
