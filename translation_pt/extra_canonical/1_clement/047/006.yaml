source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: pt
  text: É vergonhoso, amados — muito vergonhoso e indigno do modo de viver em Cristo[a] — que se ouça que a tão sólida e antiga igreja dos coríntios está em revolta contra os presbíteros por causa de uma ou duas pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Messias”.'
    reason: Registra a origem e a possível força titular de Χριστός sem substituir a leitura contextual mais natural, “Cristo”.
lexical_decisions:
- source_word: αἰσχρά
  choice: É vergonhoso
  rationale: O neutro plural funciona predicativamente para caracterizar como vergonhosa a situação relatada; a construção impessoal é natural em português e preserva a força da censura.
- source_word: ἀγωγῆς
  choice: modo de viver
  rationale: O termo designa conduta ou maneira de vida. “Modo de viver” comunica de forma clara que a revolta é incompatível com a vida vivida em Cristo.
- source_word: βεβαιοτάτην
  choice: firmíssima
  rationale: Preserva a forma superlativa e a ideia de uma comunidade solidamente estabelecida.
- source_word: στασιάζειν
  choice: está em revolta
  rationale: 'Expressa mais do que simples discordância: indica facção, insubordinação ou revolta contra os presbíteros.'
- source_word: πρεσβυτέρους
  choice: presbíteros
  rationale: Mantém o termo cristão antigo sem o restringir indevidamente a uma estrutura denominacional moderna.
theological_decisions:
- issue: Sentido de ἐν Χριστῷ
  choice: em Cristo
  alternative: no Messias
  rationale: No contexto cristão do fim do primeiro século, a expressão retoma o idioma paulino já estabelecido e é mais naturalmente entendida como “em Cristo”, embora Χριστός conserve sua origem titular.
translation_notes:
  register: Português moderno, claro e digno, com vocativo afetivo (“amados”) e repetição enfática preservada. A ordem foi ajustada para fluência sem reduzir a severidade da repreensão.
