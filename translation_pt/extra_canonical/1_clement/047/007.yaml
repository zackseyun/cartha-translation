id: 1CLEM.47.7
reference: 1 Clement 47:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: pt
  text: E a notícia chegou não somente até nós, mas também aos que estão afastados de nós[a], de modo que até blasfêmias são lançadas contra o nome do Senhor por causa da insensatez de vocês, enquanto vocês mesmos se põem em perigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos que são alheios a nós” ou “aos que se opõem a nós”.
    reason: A expressão grega pode indicar pessoas afastadas, alheias ou contrárias à comunidade.
lexical_decisions:
- source_word: ἀκοή
  choice: notícia
  rationale: No contexto, designa aquilo que foi ouvido, isto é, a notícia ou relato que se difundiu; “notícia” é natural e mantém o sentido.
- source_word: ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: os que estão afastados de nós
  rationale: A expressão descreve pessoas alheias ou contrárias à comunidade, não apenas membros com opinião diferente. “Afastados de nós” preserva alguma amplitude sem impor uma identidade específica.
- source_word: βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου
  choice: blasfêmias são lançadas contra o nome do Senhor
  rationale: Mantém a construção passiva e a ideia de injúrias dirigidas ao nome do Senhor, sem explicitar um agente ausente no grego.
- source_word: ἀφροσύνην
  choice: insensatez
  rationale: Expressa falta culpável de bom senso ou juízo, em registro digno e corrente.
- source_word: κίνδυνον ἐξεργάζεσθαι
  choice: se põem em perigo
  rationale: Equivalência idiomática portuguesa para a ideia de produzir ou ocasionar perigo para si mesmos.
theological_decisions:
- issue: Identidade dos ἑτεροκλινεῖς
  choice: os que estão afastados de nós
  alternative: os que são alheios ou contrários a nós
  rationale: O contexto favorece pessoas de fora ou hostis à comunidade, mas o texto não as identifica expressamente como pagãos ou não cristãos; a tradução evita resolver além da evidência.
- issue: Agente das blasfêmias
  choice: construção passiva sem agente expresso
  alternative: eles blasfemam o nome do Senhor
  rationale: O infinitivo passivo grego não nomeia diretamente quem profere as blasfêmias; preservar a passiva mantém essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva a progressão do grego (“não somente... mas também... de modo que até...”), e “vocês” comunica naturalmente o plural de segunda pessoa.
