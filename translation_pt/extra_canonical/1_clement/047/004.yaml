  terminology: Os termos centrais estão bem escolhidos. “Reconhecido testemunho” mantém a amplitude de μεμαρτυρημένοις, sem o reduzir indevidamente a um ato formal de aprovação; a nota alternativa “bem atestados” é pertinente. “Aprovado” para δεδοκιμασμένῳ representa apropriadamente o estado resultante de exame e aprovação.
