  source_fidelity: A tradução acompanha com precisão a estrutura e o sentido do grego. “Aquela inclinação” preserva πρόσκλισις e sua ligação deliberada com “se inclinaram” (προσεκλίθητε). “Trouxe sobre vocês um pecado menor” expressa adequadamente ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν, incluindo o comparativo sem eliminar a culpabilidade. “Apóstolos de reconhecido testemunho” comunica bem μεμαρτυρημένοις, enquanto “um homem aprovado por eles” distingue corretamente δεδοκιμασμένῳ de μεμαρτυρημένοις e preserva παρ’ αὐτοῖς.
