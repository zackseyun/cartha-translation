  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: pt
  text: Mas aquela inclinação trouxe sobre vocês um pecado menor, pois vocês se inclinaram para apóstolos de reconhecido testemunho[a] e para um homem aprovado por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para apóstolos bem atestados”.'
    reason: Registra uma tradução mais direta de μεμαρτυρημένοις, cujo sentido pode abranger pessoas que receberam testemunho favorável ou cuja reputação era reconhecida.
lexical_decisions:
- source_word: πρόσκλισις
  choice: inclinação
  rationale: Preserva a ideia de pender ou tomar partido e mantém a ligação verbal com προσεκλίθητε, sem tornar explícita uma noção mais forte de facção que o termo, isoladamente, não exige.
- source_word: ἧσσον ἁμαρτίαν
  choice: um pecado menor
  rationale: 'Reproduz a comparação do grego: a conduta anterior trouxe culpa menos grave, não ausência de pecado.'
- source_word: προσεκλίθητε
  choice: vocês se inclinaram para
  rationale: Expressa o aoristo como ação passada e conserva o jogo lexical com πρόσκλισις.
- source_word: μεμαρτυρημένοις
  choice: de reconhecido testemunho
  rationale: Indica que os apóstolos eram bem atestados ou reconhecidos, evitando confundir este particípio com δεδοκιμασμένῳ.
- source_word: δεδοκιμασμένῳ
  choice: aprovado
  rationale: Traduz o estado resultante de ter sido examinado e considerado idôneo.
theological_decisions:
- issue: Grau comparativo da culpa
  choice: um pecado menor
  alternative: menos pecado
  rationale: A formulação escolhida comunica naturalmente que a parcialidade anterior era menos culpável, sem sugerir que fosse inocente.
- issue: Natureza da inclinação anterior
  choice: inclinação
  alternative: partidarismo
  rationale: Mantém a relativa abertura semântica do grego e preserva a relação com o verbo seguinte; “partidarismo” explicitaria mais fortemente o caráter faccioso.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A repetição “inclinação / se inclinaram” é intencional e reflete a ligação lexical do grego.
