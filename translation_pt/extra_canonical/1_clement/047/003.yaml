  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: pt
  text: Na verdade, ele lhes escreveu espiritualmente acerca de si mesmo, de Cefas e de Apolo, pois já então vocês haviam criado preferências partidárias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: Na verdade
  rationale: Expressa naturalmente a força adverbial da locução grega sem tornar a frase excessivamente literal.
- source_word: πνευματικῶς
  choice: de maneira espiritual
  rationale: Mantém o valor adverbial e a possível amplitude do termo, sem especificar indevidamente «no Espírito».
- source_word: Κηφᾶ
  choice: Cefas
  rationale: Preserva a forma tradicional portuguesa do nome aramaico representado no texto grego.
- source_word: Ἀπολλώ
  choice: Apolo
  rationale: Emprega a forma bíblica portuguesa corrente do nome.
- source_word: προσκλίσεις
  choice: preferências partidárias
  rationale: O substantivo indica inclinações ou tomadas de partido; esta formulação comunica tanto a parcialidade quanto o contexto de grupos ligados a líderes, sem afirmar formalmente a existência de facções completas.
theological_decisions:
- issue: Sentido de πνευματικῶς
  choice: de maneira espiritual
  alternative: no Espírito
  rationale: O advérbio descreve o modo ou caráter da escrita, mas não exige que se identifique explicitamente o referente como o Espírito Santo.
- issue: Natureza das προσκλίσεις
  choice: preferências partidárias
  alternative: facções
  rationale: A escolha preserva a ideia de inclinação parcial por determinados líderes e evita intensificar o termo até uma divisão institucional já consolidada.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural de segunda pessoa. A construção conserva a sequência dos três líderes e a tensão entre preferência e facciosismo presente no grego.
