id: 1CLEM.62.2
reference: 1 Clement 62:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: pt
  text: Pois, quanto à fé, ao arrependimento, ao amor genuíno, ao domínio próprio, à sensatez e à perseverança, examinamos todos os aspectos, lembrando-lhes que vocês devem agradar devotamente ao Deus Todo-Poderoso em justiça, verdade e paciência, vivendo em harmonia, sem guardar rancor, em amor e paz, com grande brandura, assim como também nossos antepassados, mencionados anteriormente, lhe agradaram, sendo humildes no que diz respeito ao Pai, a Deus, ao Criador e a todas as pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας
  choice: arrependimento
  rationale: Expressa a mudança interior e moral indicada pelo termo grego, em linguagem bíblica corrente.
- source_word: γνησίας ἀγάπης
  choice: amor genuíno
  rationale: Preserva a ênfase de γνησίας em um amor autêntico, verdadeiro.
- source_word: ἐγκρατείας
  choice: domínio próprio
  rationale: Equivalente natural e claro para autocontrole moral.
- source_word: σωφροσύνης
  choice: sensatez
  rationale: Comunica equilíbrio e bom juízo sem reduzir o termo apenas a sobriedade ou castidade.
- source_word: ὑπομονῆς
  choice: perseverança
  rationale: Destaca a constância sob provação inerente ao termo.
- source_word: ἐψηλαφήσαμεν
  choice: abordamos
  rationale: No contexto discursivo, o verbo figurado significa percorrer ou tratar os diversos pontos; 'abordamos' é natural em português.
- source_word: μακροθυμίᾳ
  choice: paciência
  rationale: Termo amplamente compreensível que transmite a disposição paciente e longânime.
- source_word: ἀμνησικάκως
  choice: sem guardar ressentimento
  rationale: Explicita de modo idiomático a ideia de não conservar na memória o mal sofrido.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: profunda gentileza
  rationale: Representa a intensidade de ἐκτενοῦς e a brandura, consideração e moderação de ἐπιείκεια.
- source_word: ταπεινοφρονοῦντες
  choice: mostrando-se humildes
  rationale: Reproduz a atitude contínua de humildade de forma natural.
theological_decisions:
- issue: Relação de ὁσίως com εὐαρεστεῖν
  choice: agradar devotamente ao Deus Todo-Poderoso
  alternative: agradar ao Deus Todo-Poderoso em santidade
  rationale: O advérbio ὁσίως modifica mais diretamente o infinitivo εὐαρεστεῖν; a tradução mantém essa relação sintática sem transformar o advérbio em outro item da série preposicional.
- issue: Referente de αὐτῷ subentendido em εὐηρέστησαν
  choice: agradaram a ele
  alternative: foram agradáveis diante dele
  rationale: O referente natural é Deus Todo-Poderoso, mencionado anteriormente; mantém-se o pronome sem acrescentar identificação doutrinária.
- issue: Sentido de τὰ πρὸς no encerramento
  choice: diante do Pai, Deus e Criador, e diante de todas as pessoas
  alternative: no que diz respeito ao Pai, Deus e Criador, e a todas as pessoas
  rationale: A construção é compacta e admite nuance relacional. 'Diante de' comunica humildade para com Deus e os seres humanos sem impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A longa frase grega foi pontuada em períodos e orações mais manejáveis. O particípio ὁμονοοῦντας foi vertido como exortação, 'vivam em plena concórdia', para evitar uma sequência pesada de gerúndios sem alterar sua função de descrever como os destinatários devem agradar a Deus.
