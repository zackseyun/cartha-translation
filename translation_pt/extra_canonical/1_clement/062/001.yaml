source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: pt
  text: Quanto aos assuntos relacionados à nossa religião e aos que são mais proveitosos para uma vida virtuosa, para os que desejam conduzir a vida com piedade e justiça, escrevemos-lhes o bastante, irmãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκείᾳ
  choice: religião
  rationale: Conserva o sentido de prática ou expressão religiosa sem restringi-lo indevidamente a “culto”.
- source_word: ἐνάρετον βίον
  choice: uma vida virtuosa
  rationale: Representa diretamente a ideia de uma vida caracterizada pela virtude, em linguagem portuguesa natural e digna.
- source_word: διευθύνειν
  choice: conduzir a vida
  rationale: Expressa a ideia de dirigir ou ordenar o próprio viver; a explicitação de “a vida” decorre do contexto.
- source_word: εὐσεβῶς καὶ δικαίως
  choice: com piedade e justiça
  rationale: 'Mantém distintos os dois campos semânticos: devoção reverente e conduta justa.'
- source_word: ἄνδρες ἀδελφοί
  choice: irmãos
  rationale: É a forma vocativa natural em português para a expressão grega dirigida aos membros da comunidade.
theological_decisions:
- issue: Sentido de θρησκεία
  choice: religião
  alternative: culto / prática religiosa
  rationale: “Religião” preserva a amplitude do termo no contexto e coincide com o sentido geral da frase, sem impor uma referência exclusiva a ritos.
- issue: Relação sintática de τοῖς θέλουσιν
  choice: “para os que desejam” modifica o caráter proveitoso das questões
  alternative: tratar a expressão como destinatários diretos de toda a carta
  rationale: O dativo se liga naturalmente a ὠφελιμωτάτων, indicando para quem essas questões são sumamente proveitosas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período longo do grego foi preservado, mas com pontuação que favorece a clareza. “Já” comunica o valor contextual do perfeito ἐπεστείλαμεν sem introduzir um marcador discursivo inexistente.
