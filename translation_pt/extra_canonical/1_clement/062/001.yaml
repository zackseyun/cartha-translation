  - severity: low
    issue: Ligação sintática de «para uma vida virtuosa, para os que desejam conduzir a vida»
    rationale: A formulação atual é fiel em substância, mas pode ser reorganizada para indicar mais naturalmente que os assuntos são proveitosos para uma vida virtuosa aos que querem orientar seu viver com piedade e justiça.
