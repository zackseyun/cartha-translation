reference: 1 Clement 62:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: pt
  text: E tanto mais lhes lembramos estas coisas, porque sabíamos claramente que escrevíamos a homens fiéis e muito estimados, profundamente versados nas palavras da instrução de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπενήγκαμεν
  choice: lhes lembramos
  rationale: Embora o OCR normalizado traga ὑπενήγκαμεν, a leitura reconhecida da edição é ὑπεμνήσαμεν, “lembramos”, que também retoma o verbo de “lembrar” no versículo anterior.
- source_word: τοσούτῳ μᾶλλον
  choice: com ainda mais insistência
  rationale: Expressa o grau intensificado do ato de lembrar sem sugerir mera repetição quantitativa.
- source_word: ἐλλογιμωτάτοις
  choice: muito estimados
  rationale: Transmite o superlativo e o sentido de elevada consideração ou reputação em português natural.
- source_word: ἐγκεχυφόσιν
  choice: profundamente instruídos
  rationale: A forma textual é incomum ou corrompida, mas o contexto aponta para pessoas plenamente imbuídas ou versadas no conteúdo mencionado.
- source_word: τὰ λόγια
  choice: os ensinamentos
  rationale: No contexto, refere-se às palavras, máximas ou declarações que comunicam a formação dada por Deus; “ensinamentos” é claro sem restringir indevidamente o referente.
- source_word: παιδείας τοῦ θεοῦ
  choice: da instrução de Deus
  rationale: Preserva o campo semântico de παιδεία — instrução, formação e disciplina — e mantém a relação genitiva sem decidir se Deus é exclusivamente fonte ou conteúdo.
theological_decisions:
- issue: Sentido de παιδεία
  choice: instrução
  alternative: disciplina / formação
  rationale: “Instrução” preserva a dimensão educativa e admite a ideia de formação moral, sem reduzir o termo a punição disciplinar.
- issue: Relação do genitivo τοῦ θεοῦ
  choice: de Deus
  alternative: dada por Deus
  rationale: O genitivo português conserva a ambiguidade do grego entre origem, pertença e referência, em vez de explicitar apenas uma leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção formal moderada. O pronome “lhes” explicita o objeto inerente a “lembrar” com base na leitura textual reconhecida, sem acrescentar conteúdo teológico.
