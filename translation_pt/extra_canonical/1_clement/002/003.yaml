id: 1CLEM.2.3
reference: 1 Clement 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: pt
  text: E, cheios de santo propósito, com bom zelo e piedosa confiança, vocês estenderam as mãos ao Deus Todo-Poderoso, suplicando-lhe que fosse misericordioso, caso tivessem pecado sem intenção[a] em alguma coisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “involuntariamente”.'
    reason: Registra a alternativa formal para ἄκοντες e preserva sua possível nuance de ação não voluntária.
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: santo propósito
  rationale: βουλή pode indicar conselho, intenção, resolução ou propósito; no contexto, “propósito” expressa naturalmente a disposição moral da comunidade sem reduzir a frase a mero conselho.
- source_word: ἐν ἀγαθῇ προθυμίᾳ
  choice: com bom zelo
  rationale: προθυμία comunica prontidão, ardor e disposição voluntária. “Bom zelo” preserva a avaliação positiva de ἀγαθῇ e mantém um registro natural e digno.
- source_word: μετ’ εὐσεβοῦς πεποιθήσεως
  choice: e piedosa confiança
  rationale: πεποίθησις denota confiança ou segurança, enquanto εὐσεβής qualifica essa confiança como reverente e devota; “piedosa confiança” reproduz ambos os elementos de modo conciso.
- source_word: τὸν παντοκράτορα θεόν
  choice: ao Deus Todo-Poderoso
  rationale: Mantém o título παντοκράτωρ de forma consagrada e amplamente compreensível em português.
- source_word: ἱκετεύοντες αὐτὸν ἵλεων γενέσθαι
  choice: suplicando-lhe que fosse misericordioso
  rationale: A construção expressa súplica para que Deus se mostre favorável ou misericordioso. A formulação portuguesa é idiomática e preserva a força reverente de ἱκετεύοντες.
- source_word: εἴ τι ἀκόντες ἡμάρτετε
  choice: caso tivessem pecado sem intenção em alguma coisa
  rationale: ἄκοντες caracteriza o pecado como involuntário ou não intencional, não necessariamente cometido sob coerção. “Sem intenção” comunica com clareza a inadvertência no contexto.
theological_decisions:
- issue: Natureza do pecado indicado por ἄκοντες
  choice: pecado cometido sem intenção
  alternative: pecado cometido contra a própria vontade ou sob coerção
  rationale: No contexto de ἁμαρτάνω, ἄκων normalmente aponta para falta involuntária ou inadvertida. A tradução evita sugerir, sem apoio necessário no texto, que a pessoa foi externamente compelida a pecar.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. O pronome “vocês” torna explícita a segunda pessoa do plural do grego sem recorrer ao regionalismo “vós”.
