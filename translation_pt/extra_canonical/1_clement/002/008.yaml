source:
  edition: Funk 1901 (normalized OCR)
  text: σεβασμίῳ πολιτείᾳ κεκοσμημένοι πάντες ἐν φόβῳ αὐτοῦ ἐτελελεῖτε· τὰ προστάγματα καὶ τὰ δικαιώματα τοῦ κυρίου ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν ἐγέγραπτο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: pt
  text: Adornados por uma conduta digna de respeito, vocês cumpriam tudo no temor dele; os mandamentos e os preceitos justos do Senhor estavam escritos nas tábuas dos corações de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  choice: com uma conduta digna de respeito
  rationale: πολιτεία pode designar modo de vida ou conduta; neste contexto, a expressão descreve a vida comunitária de maneira reverente e honrosa. A formulação evita o sentido político estreito de “cidadania”.
- source_word: κεκοσμημένοι
  choice: adornados
  rationale: Preserva a metáfora de κοσμέω e o tom elevado da exortação.
- source_word: πάντα ἐτελεῖτε
  choice: cumpriam tudo
  rationale: Segue a leitura textual reconhecida por trás do OCR defeituoso πάντες ἐτελελεῖτε. τελέω indica realizar, cumprir ou levar a cabo; “cumpriam tudo” é natural e mantém a abrangência de πάντα.
- source_word: ἐν φόβῳ αὐτοῦ
  choice: no temor dele
  rationale: Mantém a linguagem religiosa tradicional de φόβος sem reduzi-la apenas a respeito nem intensificá-la como terror.
- source_word: τὰ δικαιώματα
  choice: os preceitos justos
  rationale: δικαίωμα pode indicar decreto, ordenança ou exigência justa. “Preceitos justos” preserva tanto o caráter normativo quanto a associação com a justiça.
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν
  choice: nas tábuas do coração de vocês
  rationale: Traduz a imagem bíblica de algo inscrito no coração em linguagem portuguesa reconhecível; “tábuas” comunica a superfície de escrita evocada no contexto, em vez do literal pouco inteligível “larguras”.
theological_decisions:
- issue: Sentido de “temor” diante de Deus
  choice: temor
  alternative: reverência
  rationale: “Temor” preserva a amplitude semântica e a tensão religiosa do grego φόβος, sem decidir que se trata apenas de reverência.
- issue: Relação entre mandamentos e δικαιώματα
  choice: mandamentos e preceitos justos
  alternative: mandamentos e decretos
  rationale: A escolha conserva duas categorias coordenadas e não as funde, ao mesmo tempo que deixa visível o componente de justiça presente em δικαιώματα.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A sintaxe mantém o paralelismo retórico do grego e evita tanto arcaísmos desnecessários quanto coloquialismo excessivo.
