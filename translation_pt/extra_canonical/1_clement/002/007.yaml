base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: pt
  text: Vocês lamentavam as transgressões dos seus próximos e consideravam as faltas deles como se fossem suas. Eram praticantes do bem, prontos para toda boa obra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: transgressões
  rationale: Expressa atos de falha ou violação moral, preservando o peso ético do termo grego sem restringi-lo a uma formulação jurídica.
- source_word: τῶν πλησίον
  choice: do próximo
  rationale: O genitivo plural substantivado refere-se às pessoas próximas; a expressão portuguesa tradicional e natural «do próximo» mantém o sentido coletivo.
- source_word: ὑστερήματα
  choice: deficiências
  rationale: Abrange faltas, carências ou insuficiências. «Deficiências» conserva essa amplitude sem pressupor apenas pecados deliberados.
- source_word: ἴδια ἐκρίνετε
  choice: consideravam ... como suas próprias
  rationale: Neste contexto, κρίνω indica avaliação ou consideração; a construção comunica que as insuficiências alheias eram assumidas como próprias.
- source_word: ἀγαθοποιοί
  choice: praticantes do bem
  rationale: 'Adjetivo nominativo plural com valor substantivado/predicativo: pessoas que fazem o bem. A formulação evita o latinismo «beneficentes» e explicita a ação habitual.'
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: prontos para toda boa obra
  rationale: Reprodução direta e idiomática da disposição para qualquer obra boa.
theological_decisions:
- issue: Relação ética com as faltas alheias
  choice: consideravam as deficiências deles como suas próprias
  alternative: julgavam as faltas deles como se fossem suas
  rationale: A escolha mantém a solidariedade moral expressa no texto sem transformar κρίνω em condenação judicial nem definir precisamente como as faltas eram assumidas.
- issue: Forma da oração nominal final
  choice: Eram praticantes do bem
  alternative: Praticantes do bem, prontos para toda boa obra
  rationale: O grego apresenta uma oração sem cópula explícita. Em português, a cópula no imperfeito produz uma frase completa e liga naturalmente a descrição ao comportamento passado do grupo, sem alterar a predicação.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no espaço lusófono e boa legibilidade brasileira. Emprega-se «vocês» para tornar explícita a segunda pessoa do plural indicada pelos verbos gregos; não há marcadores de nota porque nenhuma variante precisa ser assinalada na redação proposta.
