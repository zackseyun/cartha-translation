  source_fidelity: A redação transmite corretamente o lamento pelas transgressões alheias, a apropriação solidária de suas faltas e a prontidão para boas obras. Contudo, τῶν πλησίον é plural, e «do próximo» pode soar singular em português; «dos seus próximos» torna explícito o referente plural. «Deficiências» é lexicalmente possível para ὑστερήματα, mas em português moderno tende a evocar deficiência física ou funcional e enfraquece a referência contextual a faltas/carenças morais.
  naturalness: A frase é clara e de registro adequado. A substituição de «deficiências deles» por «faltas dos seus próximos» evita uma associação moderna indevida e elimina a formulação algo pesada «deles como suas próprias».
  terminology: «Transgressões», «faltas», «praticantes do bem» e «toda boa obra» são escolhas fiéis, naturais e teologicamente não tendenciosas. A cópula no imperfeito em «Eram praticantes» é uma explicitação portuguesa legítima da oração nominal grega no contexto descritivo passado.
