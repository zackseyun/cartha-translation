id: 1CLEM.2.1
reference: 1 Clement 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: pt
  text: E todos vocês eram humildes, sem se vangloriar de coisa alguma; preferiam se submeter a submeter os outros e sentiam mais prazer em dar do que em receber. Contentavam-se com as provisões de Cristo e prestavam muita atenção às palavras dele; vocês as haviam acolhido cuidadosamente no coração[a], e os sofrimentos dele estavam diante dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nas entranhas” ou “nas partes interiores”; no uso figurado, refere-se ao íntimo da pessoa.
    reason: Registra a imagem corporal de σπλάγχνα, enquanto o texto principal usa o equivalente idiomático 'coração'.
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: eram humildes
  rationale: Expressa em português natural o estado habitual indicado pelo imperfeito, preservando a ideia de humildade de mente.
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: preferiam se submeter a submeter os outros
  rationale: 'Mantém o contraste entre a voz média/passiva e a ativa: sujeitar-se em vez de sujeitar outras pessoas.'
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: com as provisões de Cristo
  rationale: Ἐφόδια designa recursos ou suprimentos; a formulação preserva a relação genitiva com Cristo sem especificar além do texto se são dados por ele ou pertencentes a ele.
- source_word: ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  choice: as haviam acolhido cuidadosamente no coração
  rationale: O idioma grego retrata uma interiorização profunda; 'no coração' comunica de modo natural a função metafórica de σπλάγχνα em português moderno.
- source_word: παθήματα
  choice: sofrimentos
  rationale: Equivalente direto e contextual para as aflições padecidas por Cristo.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: O texto emprega o título grego Χριστός; 'Cristo' é sua forma direta e corrente em português, sem eliminar sua função titular.
- issue: Agente ou posse nas 'provisões de Cristo'
  choice: preservar o genitivo como 'de Cristo'
  alternative: provisões dadas por Cristo
  rationale: O genitivo grego não explicita por si só a relação exata; a tradução evita resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O período foi dividido em duas frases para facilitar a leitura sem alterar a progressão do original.
