- from: Dia e noite, havia entre vocês uma luta[a] por toda a irmandade, para que o número dos eleitos dele fosse salvo com misericórdia e consciência.
  to: Dia e noite, vocês travavam uma luta[a] por toda a irmandade, para que o número dos eleitos dele fosse salvo com misericórdia e consciência.
  rationale: A revisão substitui apenas a construção potencialmente ambígua «havia entre vocês uma luta» por «vocês travavam uma luta». Assim, preserva-se a intensidade de ἀγών e a relação dos destinatários com esse esforço, sem insinuar conflito entre eles. Os demais termos, inclusive a formulação deliberadamente incomum «com misericórdia e consciência», são mantidos por fidelidade ao grego.
