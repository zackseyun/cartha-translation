    rationale: A expressão portuguesa «entre vocês» pode ser lida como luta uns contra os outros. O grego descreve a luta/esforço que os destinatários travavam em favor de toda a irmandade, não uma disputa interna.
  revised_text: Dia e noite, vocês travavam uma luta[a] por toda a irmandade, para que o número dos eleitos dele fosse salvo com misericórdia e consciência.
