source:
  edition: Funk 1901 (normalized OCR)
  text: ἦν ὑμῖν ἡμέρας τε καὶ νυκτὸς ὑπὲρ πάσης τῆς ἀδελφότητος, εἰς τὸ σώζεσϑαι μετ’ ἐλέους καὶ συνειδήσεως τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: pt
  text: Dia e noite, vocês travavam uma luta[a] por toda a irmandade, para que o número dos eleitos dele fosse salvo com misericórdia e consciência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo grego traduzido por «uma luta» consta no texto da edição de Funk, mas foi omitido no OCR normalizado fornecido.
    reason: Esclarece a restauração textual necessária para que a oração tenha sujeito e registra com transparência a discrepância da fonte apresentada.
lexical_decisions:
- source_word: ἀγών (restaurado conforme o texto grego da edição; ausente no OCR fornecido)
  choice: uma luta
  rationale: O substantivo denota luta, esforço intenso ou combate. A formulação existencial preserva ἀγὼν ἦν ὑμῖν sem enfraquecê-lo para mera preocupação.
- source_word: ἀδελφότης
  choice: irmandade
  rationale: Refere-se coletivamente à comunidade de irmãos e irmãs, não apenas a uma disposição fraterna.
- source_word: ἐκλεκτῶν
  choice: eleitos
  rationale: Mantém o sentido de pessoas escolhidas sem explicar de modo denominacional a natureza dessa eleição.
- source_word: συνείδησις
  choice: consciência
  rationale: É o equivalente lexical direto e preserva a formulação incomum do grego; 'boa consciência' acrescentaria um qualificativo ausente.
theological_decisions:
- issue: Identidade e alcance dos 'eleitos dele'
  choice: os eleitos dele
  alternative: os escolhidos por ele
  rationale: A tradução conserva a linguagem teológica do original e sua possível tensão, sem definir antecipadamente o alcance ou o mecanismo da eleição.
- issue: Relação entre o esforço comunitário e a salvação
  choice: para que o número dos eleitos dele fosse salvo
  alternative: visando à salvação do número dos escolhidos por ele
  rationale: Mantém a construção final do grego e não resolve como a luta da comunidade se relaciona com a salvação mencionada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, enquanto a expressão incomum “com misericórdia e consciência” foi mantida para não eliminar a tensão semântica do grego.
