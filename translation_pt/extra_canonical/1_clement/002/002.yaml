  text: οὕτως εἰρήνη βαϑεῖα καὶ λιπαρὰ ἐδέδοτο πᾶσιν καὶ ἀκόρεστος πόϑος εἰς ἀγαϑοποιΐαν, καὶ πλήρης πνεύματος ἁγίου ἐπέχυσις ἐπὶ πάντας ἐγίνετο·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
translation:
  language: pt
  text: Assim, uma paz profunda e abundante tinha sido concedida a todos[a], bem como um desejo insaciável de fazer o bem, e um pleno derramamento do Espírito Santo ocorria sobre todos;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fora concedida».'
    reason: Alternativa concisa para expressar o mais-que-perfeito grego ἐδέδοτο.
lexical_decisions:
- source_word: λιπαρά
  choice: abundante
  rationale: Em sentido figurado, o termo descreve algo rico, farto ou próspero; «abundante» comunica esse valor de modo natural em português quando aplicado à paz.
- source_word: ἀκόρεστος πόθος
  choice: desejo insaciável
  rationale: Preserva a intensidade de ἀκόρεστος e traduz diretamente πόθος sem acrescentar conotação denominacional.
- source_word: ἀγαθοποιΐαν
  choice: fazer o bem
  rationale: Expressão corrente e clara para a prática de boas ações.
- source_word: ἐπέχυσις
  choice: derramamento
  rationale: Mantém a imagem concreta de verter ou derramar associada ao Espírito Santo.
- source_word: ἐγίνετο
  choice: vinha
  rationale: O imperfeito indica uma ação ou realidade em curso no período recordado, e «vinha sobre todos» reproduz naturalmente essa duração.
theological_decisions:
- issue: πνεύματος ἁγίου
  choice: Espírito Santo
  alternative: espírito santo
  rationale: O contexto de «derramamento» favorece a referência ao Espírito Santo; a capitalização segue o uso cristão corrente sem ampliar o conteúdo do grego.
- issue: Relação sintática de «desejo insaciável» com ἐδέδοτο
  choice: bem como um desejo insaciável
  alternative: e havia um desejo insaciável
  rationale: A formulação mantém a coordenação elíptica do grego, em que o desejo acompanha a paz como algo concedido, sem inserir um verbo independente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O mais-que-perfeito composto «tinha sido concedida» expressa naturalmente o valor retrospectivo de ἐδέδοτο; a alternativa literária aparece em nota.
