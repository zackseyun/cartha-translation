id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: pt
  text: Portanto, também nós, chamados pela sua vontade em Cristo Jesus, não somos justificados por nós mesmos, nem por nossa própria sabedoria, compreensão ou piedade, nem pelas obras que realizamos em santidade de coração, mas pela fé, por meio da qual o Deus Todo-Poderoso justificou todos os que existiram desde o princípio.[a] A ele seja a glória pelos séculos dos séculos. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde tempos antigos”.'
    reason: A locução grega ἀπ’ αἰῶνος pode ser entendida como uma referência a tempos remotos; «desde o princípio» exprime de modo mais natural no contexto sua amplitude temporal.
lexical_decisions:
- source_word: δικαιούμεθα / ἐδικαίωσεν
  choice: somos justificados / justificou
  rationale: Mantém a repetição do verbo grego e sua linguagem declarativa, sem substituí-la por uma paráfrase teológica.
- source_word: σύνεσις
  choice: compreensão
  rationale: Termo corrente e digno para a capacidade de entender ou discernir, distinto de σοφία, traduzido como “sabedoria”.
- source_word: εὐσέβεια
  choice: piedade
  rationale: Preserva o sentido religioso de devoção e conduta reverente sem restringi-lo a uma denominação.
- source_word: ἔργων ὧν κατειργασάμεθα
  choice: obras que realizamos
  rationale: Reproduz a ideia de obras efetuadas ou levadas a cabo, em português natural.
- source_word: ἐν ὁσιότητι καρδίας
  choice: em santidade de coração
  rationale: Tradução formal e inteligível que conserva a referência à disposição interior consagrada.
- source_word: ἀπ’ αἰῶνος
  choice: desde os tempos antigos
  rationale: Expressa a extensão retrospectiva da locução sem impor o sentido metafísico de “desde a eternidade”.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pelos séculos dos séculos
  rationale: Mantém a fórmula doxológica enfática tradicional, ainda compreensível no registro bíblico português.
theological_decisions:
- issue: Meio da justificação
  choice: “mas pela fé, por meio da qual”
  alternative: “mas por causa da fidelidade, mediante a qual”
  rationale: Neste contraste explícito com sabedoria, piedade e obras humanas, πίστις é naturalmente “fé”. A relativa feminina ἧς retoma πίστεως, por isso a formulação mantém a fé como o meio indicado pelo texto.
- issue: Alcance de πάντας τοὺς ἀπ’ αἰῶνος
  choice: “todos os que existiram desde os tempos antigos”
  alternative: “todos, desde o princípio”
  rationale: Conserva a afirmação abrangente do autor sem acrescentar uma limitação de grupo que não aparece no grego; a nota registra a alternativa temporal mais tradicional.
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: “em Cristo Jesus”
  alternative: “no Messias Jesus”
  rationale: “Cristo Jesus” corresponde ao uso cristão grego consolidado desta fórmula e evita destacar um valor lexical que pode não estar em primeiro plano aqui.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cristão amplamente reconhecido. A sintaxe paralela do grego foi preservada, mas organizada com pontuação natural. A doxologia conserva deliberadamente seu tom bíblico solene.
