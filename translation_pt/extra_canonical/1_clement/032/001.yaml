source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἐὰν τις καθ’ ἓν ἕκαστον εἰλικρινῶς κατανοήσῃ, ἐπιγνώσεται μεγαλεῖα τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/001.yaml
  text: If anyone sincerely considers this point by point, he will recognize the greatness of the gifts given by him.
translation:
  language: pt
  text: Se alguém considerar isso sinceramente, ponto por ponto, reconhecerá a grandeza dos dons concedidos por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃ
  choice: isso
  rationale: Pronome relativo neutro usado como objeto de κατανοήσῃ; em português, «isso» retoma com naturalidade o assunto anterior sem transformar καθ’ ἓν ἕκαστον em objeto.
- source_word: καθ’ ἓν ἕκαστον
  choice: ponto por ponto
  rationale: Expressa a consideração individual e minuciosa de cada aspecto, funcionando adverbialmente.
- source_word: εἰλικρινῶς
  choice: sinceramente
  rationale: Preserva o sentido de franqueza ou pureza de intenção do advérbio grego.
- source_word: ἐπιγνώσεται
  choice: reconhecerá
  rationale: Comunica percepção ou reconhecimento resultante de uma consideração cuidadosa.
- source_word: μεγαλεῖα
  choice: a grandeza
  rationale: O plural substantivado pode designar a magnitude ou magnificência coletiva dos dons; esta formulação é natural em português.
- source_word: δωρεῶν
  choice: dons
  rationale: Termo corrente e digno para dádivas concedidas gratuitamente.
- source_word: ὑπ’ αὐτοῦ δεδομένων
  choice: concedidos por ele
  rationale: Mantém a voz passiva e a referência pronominal ambígua do original, sem identificar explicitamente o agente.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: por ele
  alternative: por Deus
  rationale: O grego usa apenas o pronome; explicitar «Deus» resolveria uma referência que o versículo mantém implícita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe condicional natural. A formulação preserva a função objetiva de Ὃ e o valor adverbial de καθ’ ἓν ἕκαστον.
