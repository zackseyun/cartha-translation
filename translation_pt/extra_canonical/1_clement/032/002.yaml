reference: 1 Clement 32:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: pt
  text: 'Pois dele procedem os sacerdotes e os levitas, todos os que servem junto ao altar de Deus; dele procede o Senhor Jesus segundo a carne; dele procedem reis, governantes e líderes, na linhagem de Judá; e os seus demais cetros não têm pouca glória, conforme Deus prometeu: “A sua descendência será como as estrelas do céu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: dele procedem / dele procede
  rationale: Mantém a referência pronominal do grego e expressa com naturalidade a ideia de origem ou descendência.
- source_word: λειτουργοῦντες
  choice: servem
  rationale: No contexto do altar, designa o exercício do serviço cultual; “servem junto ao altar” é claro e não introduz terminologia denominacional.
- source_word: τὸ κατὰ σάρκα
  choice: segundo a carne
  rationale: Preserva a formulação cristológica tradicional e a tensão do original, indicando a ascendência humana de Jesus sem paráfrase explicativa.
- source_word: κατὰ τὸν Ἰούδαν
  choice: na linhagem de Judá
  rationale: Comunica idiomaticamente a relação genealógica ou tribal indicada pela expressão grega.
- source_word: σκῆπτρα
  choice: cetros
  rationale: Traduz diretamente o termo grego e evita substituí-lo silenciosamente por “tribos”; uma nota registra a possível força metonímica.
- source_word: σπέρμα
  choice: descendência
  rationale: O singular coletivo refere-se aos descendentes; “descendência” conserva esse valor e soa natural em português.
- source_word: οὐκ ἐν μικρᾷ δόξῃ
  choice: não têm pouca glória
  rationale: Reproduz a litotes grega de modo inteligível, sem apagar sua forma retórica.
theological_decisions:
- issue: A expressão cristológica κατὰ σάρκα
  choice: segundo a carne
  alternative: quanto à sua humanidade
  rationale: A opção escolhida preserva a linguagem e a possível tensão teológica do original, sem impor uma interpretação explicativa.
- issue: Sentido de σκῆπτρα no contexto das linhagens de Jacó
  choice: cetros, com nota sobre o possível sentido metonímico de tribos
  alternative: tribos
  rationale: O texto grego diz literalmente “cetros”; a tradução mantém o termo atestado e deixa ao leitor, por meio da nota, a leitura contextual alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “dele procedem” conserva o paralelismo enfático do grego; a litotes “não têm pouca glória” foi mantida.
