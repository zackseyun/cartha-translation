source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: pt
  text: Portanto, todos foram glorificados e engrandecidos, não por si mesmos, nem por suas obras, nem pela prática da justiça que realizaram, mas pela vontade dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: foram glorificados
  rationale: Preserva o sentido passivo e a correspondência direta com o verbo grego.
- source_word: ἐμεγαλύνθησαν
  choice: foram engrandecidos
  rationale: Expressa com naturalidade em português o passivo de μεγαλύνω, sem sugerir apenas louvor verbal.
- source_word: δικαιοπραγίας
  choice: prática da justiça
  rationale: O substantivo indica conduta ou ação justa; esta formulação mantém o caráter abstrato e evita restringi-lo a atos isolados.
- source_word: κατειργάσαντο
  choice: realizaram
  rationale: Comunica a ideia de efetuar ou levar a cabo, com registro atual e digno.
- source_word: θελήματος
  choice: vontade
  rationale: Equivalente usual e semanticamente adequado para θέλημα neste contexto.
theological_decisions:
- issue: Meio ou fundamento da glorificação e do engrandecimento
  choice: pela vontade dele
  alternative: por causa da vontade dele
  rationale: A repetição de διά com genitivo favorece a ideia de mediação ou agência; a tradução conserva a formulação do grego sem definir além do texto a relação causal exata.
- issue: Negação do mérito próprio
  choice: não por si mesmos, nem por suas obras, nem pela prática da justiça
  alternative: não mediante eles mesmos, suas obras ou seus atos justos
  rationale: Mantém a sequência enfática do original e sua tensão entre ações justas reais e a vontade divina como base decisiva, sem acrescentar uma formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação repetida com “nem” reproduz a ênfase retórica do grego.
