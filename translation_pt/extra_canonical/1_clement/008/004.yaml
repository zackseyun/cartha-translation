source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
translation:
  language: pt
  text: 'E em outro lugar ele diz assim: “Lavem-se e tornem-se puros; tirem as suas maldades de diante dos meus olhos, removendo-as de suas almas; parem de praticar o mal, aprendam a fazer o bem, busquem a justiça, livrem quem sofre injustiça, façam justiça ao órfão e defendam a causa da viúva. Venham, e debatamos”, diz o Senhor. “Ainda que os seus pecados sejam como o carmesim, eu os tornarei brancos como a neve; ainda que sejam vermelhos como a escarlata, eu os tornarei brancos como a lã. Se vocês quiserem e me ouvirem, comerão as coisas boas da terra; mas, se não quiserem nem me ouvirem, a espada os devorará, pois a boca do Senhor falou estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλεσθε τὰς πονηρίας
  choice: tirem as suas maldades
  rationale: Mantém o imperativo e o sentido amplo de atos ou práticas más, sem restringi-lo apenas a ações externas.
- source_word: ἐκζητήσατε κρίσιν
  choice: busquem a justiça
  rationale: Neste contexto profético, κρίσις indica justiça ou julgamento justo, e não mera decisão judicial.
- source_word: ῥύσασθε ἀδικούμενον
  choice: livrem quem sofre injustiça
  rationale: Reproduz a ideia do particípio passivo, isto é, a pessoa que está sendo injustiçada.
- source_word: κρίνατε ὀρφανῷ
  choice: façam justiça ao órfão
  rationale: Expressa naturalmente o dativo de benefício e o sentido de julgar em favor da causa justa do órfão.
- source_word: δικαιώσατε χήραν
  choice: defendam a causa da viúva
  rationale: Comunica o sentido forense de obter reconhecimento ou justiça para a viúva, evitando sugerir que ela deva ser moralmente declarada justa.
- source_word: διελεγχθῶμεν
  choice: discutamos a questão
  rationale: Preserva o tom de confronto e exame mútuo do verbo, com linguagem portuguesa natural.
- source_word: φοινικοῦν / κόκκινον
  choice: carmesim / escarlata
  rationale: Mantém duas designações de vermelho intenso distintas, como no texto grego.
theological_decisions:
- issue: Relação sintática entre ‘diante dos meus olhos’ e ‘de suas almas’
  choice: tirem as suas maldades de diante dos meus olhos, removendo-as de suas almas
  alternative: tirem de suas almas as suas maldades diante dos meus olhos
  rationale: A formulação segue a ordem grega e conserva as duas expressões, ao mesmo tempo que esclarece em português que ambas se ligam à remoção das maldades, sem omitir ‘de suas almas’.
- issue: Convite divino em διελεγχθῶμεν
  choice: discutamos a questão
  alternative: arrazoemos juntos
  rationale: Evita transformar o convite em simples raciocínio cooperativo; o verbo admite exame, contestação ou resolução de uma causa.
- issue: Promessa e ameaça condicionais
  choice: Se vocês quiserem e me ouvirem... se não quiserem nem me ouvirem
  alternative: Se forem obedientes... se forem rebeldes
  rationale: Mantém explicitamente os verbos gregos de querer e ouvir, sem fundi-los interpretativamente em categorias teológicas mais amplas.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento no plural (‘vocês’) de ampla legibilidade brasileira. A estrutura de citação profética foi mantida, com pontuação ajustada à fluência contemporânea.
