    issue: A conjunção adversativa “mas” não corresponde à coordenação grega.
    rationale: Depois das duas cláusulas com ἐάν, o texto traz καί (“e”) antes de ἐπιστραφῆτε. “Mas” torna explícito um contraste inferido, mas não lexicalmente marcado no original.
  - severity: low
    issue: “Tecido de saco” é menos natural que “pano de saco”.
    rationale: σάκκος designa o pano grosseiro associado a luto e penitência; “pano de saco” conserva isso em formulação portuguesa mais corrente.
