source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: pt
  text: '“Arrependam-se, ó casa de Israel, da sua desobediência à lei. Eu disse aos filhos do meu povo: ‘Se os seus pecados forem da terra até o céu, e se forem mais vermelhos que a escarlate e mais negros que o pano de saco, e vocês se voltarem para mim de todo o coração e disserem: “Pai”, eu os ouvirei como a um povo santo.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Arrependam-se
  rationale: Expressa diretamente o imperativo de mudança de mente e conduta, em linguagem corrente e digna.
- source_word: ἀνομίας
  choice: desobediência à lei
  rationale: Torna perceptível o sentido de ἀνομία como rejeição ou violação da lei, evitando o termo menos transparente “iniquidade”.
- source_word: εἶπον
  choice: Eu disse
  rationale: Preserva o aoristo indicativo em primeira pessoa, sem emendá-lo para um imperativo.
- source_word: πυρρότεραι κόκκου
  choice: mais vermelhos que a escarlate
  rationale: κόκκος, neste contexto cromático, designa a escarlate; a formulação mantém a comparação intensiva.
- source_word: μελανώτεραι σάκκου
  choice: mais negros que o tecido de saco
  rationale: Comunica a referência ao tecido áspero de luto e penitência, e não a uma sacola moderna.
- source_word: ἐπιστραφῆτε πρὸς με
  choice: vocês se voltarem para mim
  rationale: Mantém o sentido relacional e direcional do verbo, sem reduzi-lo a mero movimento físico.
- source_word: ἐπακούσομαι ὑμῶν
  choice: eu os ouvirei
  rationale: Reproduz a promessa de dar ouvidos ao povo sem acrescentar uma explicação como “atenderei”.
theological_decisions:
- issue: Estrutura condicional da promessa
  choice: Se... e se..., mas...
  alternative: Ainda que... e ainda que..., se...
  rationale: Mantém os dois ἐὰν gregos como condições e usa “mas” para tornar inteligível em português o contraste introduzido por καί antes do retorno a Deus, sem transformar explicitamente as primeiras condições em concessivas.
- issue: Invocação de Deus como Pai
  choice: 'disserem: “Pai”'
  alternative: me chamarem de “Pai”
  rationale: Conserva a forma sucinta e teologicamente aberta do grego, sem explicar além do que o texto afirma.
- issue: Povo santo
  choice: como a um povo santo
  alternative: por serem um povo santo
  rationale: Preserva ὡς e evita afirmar que a santidade seja a causa explícita de Deus ouvi-los.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conservou-se a solenidade da exortação e a forma incomum “da terra até o céu”, que reflete de perto o grego sem inserir o verbo interpretativo “alcançar” ou “estender-se”.
