  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: pt
  text: Portanto, desejando que todos os seus amados participem do arrependimento, ele confirmou isso por sua vontade onipotente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας μετασχεῖν
  choice: participassem do arrependimento
  rationale: Preserva a ideia de tomar parte ou ter participação no arrependimento, sem reduzi-la simplesmente ao ato de arrepender-se.
- source_word: ἐστήριξεν
  choice: confirmou
  rationale: O verbo significa tornar firme, firmar ou confirmar; no contexto, aponta naturalmente para a confirmação da realidade ou promessa do arrependimento mencionada antes.
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: por sua vontade onipotente
  rationale: Expressa tanto o desígnio ou vontade divina quanto a qualidade de poder soberano contida em παντοκρατορικός, em linguagem portuguesa natural e digna.
theological_decisions:
- issue: Referente do pronome implícito em ἐστήριξεν
  choice: ele o confirmou
  alternative: ele confirmou isso / ele o estabeleceu
  rationale: O pronome masculino retoma de modo natural 'o arrependimento' em português, mas a formulação mantém a concisão e não especifica além do que o contexto permite.
- issue: Alcance de πάντας τοὺς ἀγαπητοὺς αὐτοῦ
  choice: todos os seus amados
  alternative: todos aqueles a quem ama
  rationale: A forma substantivada 'seus amados' preserva de perto a expressão grega, sem decidir questões teológicas sobre a extensão do grupo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada apenas o necessário para soar natural, mantendo a relação participial do grego.
