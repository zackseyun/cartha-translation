  source_fidelity: 'A tradução reproduz bem a estrutura central: o particípio βουλόμενος é adequadamente expresso por “desejando”, μετανοίας μετασχεῖν por “participem do arrependimento”, e τῷ παντοκρατορικῷ βουλήματι αὐτοῦ por “por sua vontade onipotente”. “Confirmou” é uma boa opção contextual para ἐστήριξεν. Contudo, o pronome masculino “o” fixa o referente como “o arrependimento”, enquanto o objeto de ἐστήριξεν permanece elíptico e é mais provavelmente ligado à declaração/promessa precedente no contexto. “Isso” conserva essa elipse sem impor referente.'
