  terminology: '“Arrependimento”, “amados”, “confirmou” e “vontade onipotente” são apropriados, claros e de registro digno. Não é necessária nota de rodapé: a nota inglesa sobre “established it” não corresponde a uma variante ou ambiguidade que exija âncora na tradução portuguesa adotada.'
