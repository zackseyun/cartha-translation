source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: pt
  text: 'E o próprio Soberano de todas as coisas também falou a respeito do arrependimento com juramento: “Tão certo como eu vivo”, diz o Senhor, “não quero tanto a morte do pecador quanto o seu arrependimento”, acrescentando ainda uma boa declaração[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um bom pronunciamento” ou “um bom juízo”.'
    reason: γνώμη pode designar opinião, juízo, máxima ou declaração; aqui introduz palavras adicionais citadas na sequência.
lexical_decisions:
- source_word: δεσπότης τῶν ἁπάντων
  choice: Soberano de todas as coisas
  rationale: Expressa a autoridade abrangente de δεσπότης e conserva o genitivo universal τῶν ἁπάντων em português natural e digno.
- source_word: μετάνοια
  choice: arrependimento
  rationale: É o equivalente corrente que abrange a mudança de mente e de conduta sugerida pelo contexto.
- source_word: μετὰ ὅρκου
  choice: com juramento
  rationale: Mantém explicitamente a caracterização da fórmula “Tão certo como eu vivo” como juramento.
- source_word: οὐ βούλομαι ... ὡς
  choice: não quero ... e sim
  rationale: A construção comparativa expressa preferência ou contraste no contexto da citação profética; “e sim” comunica esse contraste com clareza sem sugerir que o Senhor deseje em algum grau a morte do pecador.
- source_word: γνώμην ἀγαθήν
  choice: uma boa declaração
  rationale: No contexto, γνώμη introduz outra formulação verbal no versículo seguinte; “declaração” preserva essa função melhor que “intenção”, enquanto a nota registra a amplitude lexical.
theological_decisions:
- issue: Relação entre a morte do pecador e seu arrependimento
  choice: “não quero a morte do pecador, e sim o seu arrependimento”
  alternative: “não desejo tanto a morte do pecador quanto o seu arrependimento”
  rationale: A alternativa reproduz mais mecanicamente ὡς, mas em português pode insinuar que Deus deseja ambas as coisas em graus diferentes. A formulação escolhida transmite o contraste pretendido pela citação profética sem acrescentar uma doutrina alheia ao texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Tão certo como eu vivo” verte a fórmula solene Ζῶ γὰρ ἐγώ de modo idiomático; a ordem “o próprio Soberano de todas as coisas” preserva a ênfase de αὐτός sem tornar a frase artificial.
