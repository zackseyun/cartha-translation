  source_fidelity: 'A tradução reproduz adequadamente δεσπότης τῶν ἁπάντων, μετάνοια, a fórmula solene Ζῶ γὰρ ἐγώ e o particípio προστιθείς. Contudo, «não quero ... e sim» transforma a comparação introduzida por ὡς em uma oposição absoluta. A construção grega deve permanecer explicitamente comparativa: o Senhor não quer a morte do pecador tanto quanto o seu arrependimento.'
