  text: ἤτω τις πιστός, ἤτω δυνατὸς γνῶσιν ἐξεπεῖν, ἤτω σοφὸς ἐν διακρίσει λόγων, ἤτω ἁγνὸς ἐν ἔργοις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: pt
  text: Que alguém seja fiel; seja capaz de expor o conhecimento; seja sábio no discernimento das palavras; seja puro em obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤτω τις
  choice: Seja alguém
  rationale: Preserva o valor indefinido e inclusivo de τις, bem como a forma exortativa de ἤτω, sem introduzir marcação masculina ausente do grego.
- source_word: δυνατὸς γνῶσιν ἐξεπεῖν
  choice: capaz de expor o conhecimento
  rationale: Traduz δυνατός como capacidade e ἐξεπεῖν como exposição articulada ou explicação, mantendo γνῶσις como «conhecimento».
- source_word: σοφὸς ἐν διακρίσει λόγων
  choice: sábio no discernimento das palavras
  rationale: Mantém a relação entre sabedoria e avaliação criteriosa; «palavras» preserva a amplitude de λόγων, que também pode abranger discursos ou enunciados.
- source_word: ἁγνὸς ἐν ἔργοις
  choice: puro em suas obras
  rationale: «Puro» representa diretamente ἁγνός, enquanto «obras» conserva o sentido ético concreto de ἔργοις.
theological_decisions:
- issue: Alcance do sujeito indefinido τις
  choice: alguém
  alternative: um homem
  rationale: O grego é indefinido e não especifica sexo; «alguém» evita acrescentar uma restrição masculina.
- issue: Sentido de λόγων
  choice: palavras
  alternative: discursos
  rationale: «Palavras» conserva a formulação ampla e tradicional sem decidir se o autor se refere especificamente a discursos, argumentos ou enunciados.
translation_notes:
  register: Português moderno, digno e claro, com paralelismo exortativo preservado pela repetição de «seja». A redação acompanha de perto a estrutura grega sem soar excessivamente arcaica.
