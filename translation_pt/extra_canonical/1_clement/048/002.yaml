source:
  edition: Funk 1901 (normalized OCR)
  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: pt
  text: 'Pois esta é a porta da justiça, aberta para a própria vida[a], conforme está escrito: “Abram para mim as portas da justiça; entrando por elas, darei graças ao Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois uma porta da justiça foi aberta — esta mesma porta para a vida”.'
    reason: A forma e a construção gregas permitem uma leitura alternativa mais appositiva; a nota preserva essa ambiguidade textual e sintática.
lexical_decisions:
- source_word: πύλη / πύλας
  choice: porta / portas
  rationale: Mantém a correspondência singular-plural do grego e soa natural na imagem de acesso.
- source_word: δικαιοσύνης
  choice: da justiça
  rationale: Preserva o sentido amplo de justiça ou retidão sem impor uma interpretação doutrinária mais estreita.
- source_word: ἀνεῳγυῖα εἰς ζωήν
  choice: aberta para a vida
  rationale: Expressa de modo natural a direção ou acesso indicado por εἰς, sem tornar explícita uma relação que o grego deixa concisa.
- source_word: ἐξομολογήσομαι
  choice: darei graças
  rationale: No contexto da citação do Salmo, o verbo denota reconhecimento agradecido ou louvor dirigido ao Senhor; 'darei graças' reproduz bem esse uso.
theological_decisions:
- issue: Identificação da porta da justiça
  choice: esta é a porta da justiça
  alternative: uma porta da justiça foi aberta — esta mesma porta para a vida
  rationale: A leitura contextual mais provável entende αὕτη, ou o αὐτή transmitido/normalizado com valor enfático, como identificação da porta. A nota conserva a construção alternativa sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo plural foi vertido por “Abram”, evitando o tom arcaico de “Abri”. A citação mantém o paralelismo e a formulação bíblica sem excessivo rebuscamento.
