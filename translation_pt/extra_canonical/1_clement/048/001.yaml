source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: pt
  text: Removamos, portanto, isto sem demora. Prostremo-nos diante do Soberano e choremos, suplicando-lhe que, tornando-se propício, se reconcilie conosco e nos restaure à conduta digna e pura do nosso amor fraternal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: Afastemos
  rationale: Expressa a ideia de remover ou eliminar aquilo que vinha sendo censurado, sem recorrer ao pouco natural «levantemos para fora».
- source_word: ἐν τάχει
  choice: sem demora
  rationale: Equivalente idiomático que preserva a urgência do grego.
- source_word: τῷ δεσπότῃ
  choice: diante do Senhor
  rationale: «Senhor» é uma forma digna e corrente de traduzir δεσπότης neste contexto de submissão e súplica.
- source_word: προσπέσωμεν
  choice: Prostremo-nos diante de
  rationale: Comunica o gesto corporal de lançar-se ou cair diante de alguém em humilde súplica.
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: se reconcilie conosco
  rationale: Mantém a voz e a direção relacional da expressão grega, sem reformulá-la como se apenas os suplicantes fossem reconciliados.
- source_word: σεμνὴν ... ἁγνὴν ἀγωγὴν
  choice: conduta digna e pura
  rationale: Os dois adjetivos acusativos qualificam ἀγωγήν, «conduta»; a tradução preserva essa relação sintática.
- source_word: φιλαδελφίας ἡμῶν
  choice: do nosso amor fraternal
  rationale: Reproduz o genitivo grego e o sentido comunitário de φιλαδελφία.
theological_decisions:
- issue: Sentido de ἵλεως γενόμενος
  choice: mostrando-se misericordioso
  alternative: tornando-se propício
  rationale: A formulação principal soa natural em português e expressa a disposição favorável e compassiva pedida ao Senhor; a nota conserva a alternativa mais formal e cultual sem impor uma teoria específica de propiciação.
translation_notes:
  register: Português moderno, claro e reverente, com cadência exortativa. «Conduta digna e pura» segue diretamente a sintaxe grega, na qual ambos os adjetivos modificam «conduta».
