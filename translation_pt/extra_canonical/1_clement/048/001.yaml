revisions:
- from: Afastemos, portanto, isso sem demora. Prostremo-nos diante do Senhor e choremos, suplicando-lhe que, mostrando-se misericordioso[a], se reconcilie conosco e nos restaure à conduta digna e pura do nosso amor fraternal.
  to: Removamos, portanto, isto sem demora. Prostremo-nos diante do Soberano e choremos, suplicando-lhe que, tornando-se propício, se reconcilie conosco e nos restaure à conduta digna e pura do nosso amor fraternal.
  rationale: A revisão torna δεσπότης mais específico como «Soberano» e substitui a marca de gênero indevida por uma tradução direta de ἵλεως γενόμενος. Mantêm-se a urgência, a súplica, a reconciliação do Soberano com os suplicantes e a sintaxe em que «digna» e «pura» qualificam «conduta».
  reviewer_model: gpt-5.6-terra
