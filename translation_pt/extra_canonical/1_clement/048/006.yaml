source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: pt
  text: Pois ele deve ser tanto mais humilde[a] quanto maior parece ser, e buscar o que é proveitoso para todos, e não o que é seu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, quanto maior ele parece ser, tanto mais humilde deve ser”.'
    reason: Registra uma forma alternativa de representar a construção proporcional grega τοσούτῳ… ὅσῳ, preservando o sentido disposicional de ταπεινοφρονεῖν.
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: ser humilde
  rationale: Expressa em português natural a atitude de humildade ou modéstia indicada pelo infinitivo grego.
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: o que é proveitoso para todos
  rationale: Preserva a ideia de benefício comum, com formulação clara e digna.
- source_word: τὸ ἑαυτοῦ
  choice: o que é seu próprio interesse
  rationale: Explicita a elipse substantiva grega no sentido do interesse ou benefício particular, em contraste com o bem de todos.
theological_decisions:
- issue: Relação entre posição aparente e dever de humildade
  choice: quanto maior parece ser
  alternative: quanto maior é
  rationale: Mantém δοκεῖ, que qualifica a grandeza como aquilo que a pessoa parece ser, sem afirmar objetivamente sua superioridade.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proporcional natural. “Pois” conserva o valor explicativo de γάρ; evitou-se linguagem arcaica e manteve-se a tensão de “parece ser”.
