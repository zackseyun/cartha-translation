id: 1CLEM.48.4
reference: 1 Clement 48:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: pt
  text: Portanto, embora muitas portas estejam abertas, esta porta na justiça é a porta em Cristo, na qual são felizes todos os que entraram e conduzem sua caminhada em santidade e justiça, realizando tudo sem perturbação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem agitação” ou “sem desordem”.'
    reason: O advérbio grego pode indicar ausência de perturbação, agitação ou tumulto, sem determinar com precisão qual nuance predomina.
lexical_decisions:
- source_word: πυλῶν
  choice: portas
  rationale: O termo designa portões ou portas de entrada; “portas” é natural em português e mantém a imagem do acesso.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Preserva o sentido ético e teológico amplo de δικαιοσύνη sem reduzi-lo a uma virtude mais específica.
- source_word: Χριστῷ
  choice: Cristo
  rationale: No sintagma estabelecido ἐν Χριστῷ, “em Cristo” é a formulação natural e evita substituir o título já usado como nome por uma explicação etimológica.
- source_word: κατευθύνοντες τὴν πορείαν αὐτῶν
  choice: orientam seu caminho
  rationale: Expressa a ação contínua de dirigir o próprio percurso, preservando a metáfora de movimento.
- source_word: ἀταράχως
  choice: sem perturbação
  rationale: Mantém a ideia de agir sem tumulto, agitação ou desordem, sem especificar indevidamente se a ausência de perturbação é interior ou comunitária.
theological_decisions:
- issue: Relação entre a porta na justiça e Cristo
  choice: “esta porta na justiça é a que está em Cristo”
  alternative: “esta é a porta na justiça — a que está em Cristo”
  rationale: A formulação preserva a repetição elíptica dos artigos femininos no grego e identifica a porta relacionada à justiça com a porta em Cristo, sem ampliar a afirmação.
- issue: Sentido de μακάριοι
  choice: “felizes”
  alternative: “bem-aventurados”
  rationale: “Felizes” comunica de modo atual o estado favorecido expresso por μακάριοι e evita sugerir, por “abençoados”, uma voz passiva ausente no grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe levemente formal para conservar a estrutura argumentativa e as metáforas do grego. A primeira oração foi vertida concessivamente (“embora”), valor natural do genitivo absoluto no contexto; a segunda frase evita um período excessivamente pesado sem alterar as relações do original.
