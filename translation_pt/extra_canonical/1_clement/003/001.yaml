id: 1CLEM.3.1
reference: 1 Clement 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: pt
  text: 'Toda glória e abundância[a] foram dadas a vocês, e cumpriu-se o que está escrito: “Comeu e bebeu, alargou-se e engordou, e o amado escoiceou”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amplidão” ou “expansão”.
    reason: Esclarece a imagem lexical de πλατυσμός, vertida contextualmente como abundância.
  - marker: b
    text: Isto é, deu coices; a imagem também expressa rebeldia.
    reason: Explicita a força metafórica de ἀπελάκτισεν sem removê-la do texto principal.
lexical_decisions:
- source_word: πλατυσμός
  choice: abundância
  rationale: O substantivo indica amplidão ou expansão e, neste contexto, a condição próspera e abundante concedida aos destinatários; “abundância” comunica isso naturalmente sem apagar a imagem de alargamento, registrada em nota.
- source_word: ἐπλατύνθη καὶ ἐπαχύνθη
  choice: alargou-se e engordou
  rationale: Mantém os dois verbos e a imagem física progressiva do ser bem alimentado, em vez de fundi-los numa única ideia.
- source_word: ἀπελάκτισεν
  choice: escoiceou
  rationale: Preserva a metáfora de um animal cevado que dá coices e evita uma expressão que possa sugerir descanso; no contexto, o gesto também evoca insubordinação.
- source_word: ὁ ἠγαπημένος
  choice: o amado
  rationale: Reproduz o particípio substantivado com artigo sem identificar ou explicar além do que o texto grego declara.
theological_decisions:
- issue: Sentido metafórico de ἀπελάκτισεν
  choice: Manter no texto a ação concreta “escoiceou” e indicar em nota sua implicação de rebeldia.
  alternative: Traduzir diretamente por “rebelou-se”.
  rationale: A tradução concreta conserva a imagem da citação e sua tensão retórica, enquanto a nota torna acessível o sentido figurado sem substituí-lo.
translation_notes:
  register: Português atual, digno e acessível, com “a vocês” para o plural explícito ὑμῖν. A formulação da citação mantém o paralelismo e a imagem corporal e animal do grego.
