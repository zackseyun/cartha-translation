  to: Por isso, a justiça e a paz se afastaram para longe, pois cada um abandonou o temor de Deus, tornando-se míope na fé nele[a], sem andar nas prescrições de seus mandamentos nem viver como convém a Cristo; mas cada um andava conforme os desejos de seu coração perverso, tendo abraçado uma inveja injusta e ímpia[b], por meio da qual também a morte entrou no mundo.
