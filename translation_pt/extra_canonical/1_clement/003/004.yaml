id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: pt
  text: Por isso, a justiça e a paz se afastaram para longe, pois cada um abandonou o temor de Deus, tornando-se míope na fé nele[a], sem andar nas prescrições de seus mandamentos nem viver como convém a Cristo; mas cada um andava conforme os desejos de seu coração perverso, tendo abraçado uma inveja injusta e ímpia[b], por meio da qual também a morte entrou no mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua fé” ou “em sua fidelidade”.'
    reason: O genitivo αὐτοῦ pode ser entendido como objetivo («fé nele») ou possessivo («sua fé/fidelidade»).
  - marker: b
    text: O termo grego também pode significar “ciúme” ou “zelo”.
    reason: ζῆλος tem amplitude semântica; «inveja» é favorecido pelo contexto, mas não esgota as possibilidades lexicais.
lexical_decisions:
- source_word: πόρρω ἀπέστη
  choice: se afastaram para longe
  rationale: Reproduz o movimento e a distância enfática da expressão grega, com concordância natural com o sujeito composto “a justiça e a paz”.
- source_word: ἀμβλυωπῆσαι
  choice: perdeu a clareza quanto a
  rationale: O verbo descreve visão embotada ou pouca acuidade; a formulação conserva a metáfora visual de modo compreensível em português sem sugerir cegueira completa.
- source_word: νομίμοις
  choice: ordenanças
  rationale: O substantivo plural designa normas ou disposições estabelecidas, em harmonia com o registro formal da passagem.
- source_word: πολιτεύεσθαι
  choice: conduziam a vida
  rationale: Aqui o verbo se refere ao modo de viver ou de se comportar; a opção transmite esse sentido sem importar a acepção política moderna.
- source_word: τὸ καλῆκον τῷ Χριστῷ
  choice: de maneira digna de Cristo
  rationale: O texto normalizado parece refletir καθῆκον, “o que convém/cabe”; a expressão portuguesa comunica uma conduta apropriada a Cristo.
- source_word: ζῆλον
  choice: inveja
  rationale: No contexto da entrada da morte no mundo, o termo alude à tradição da morte que entra por inveja; a nota preserva a amplitude lexical de “zelo/ciúme”.
- source_word: ἀνειληφότας
  choice: abraçando
  rationale: Expressa a ideia de tomar para si, assumir ou acolher ativamente essa disposição.
theological_decisions:
- issue: Sentido de πίστει αὐτοῦ
  choice: fé nele
  alternative: sua fé / sua fidelidade
  rationale: O genitivo pode ser entendido objetivamente, como fé em Deus, ou possessivamente. O paralelismo com “temor de Deus” favorece “fé nele”, mas a ambiguidade é registrada em nota.
- issue: Referente de δι’ οὗ
  choice: por meio da qual [a inveja]
  alternative: por causa da qual
  rationale: O pronome relativo masculino singular retoma naturalmente ζῆλον. A tradução mantém a relação instrumental/causal sem explicar além do texto.
- issue: Χριστός como título ou designação estabelecida
  choice: Cristo
  alternative: Messias
  rationale: No contexto epistolar de 1 Clemente, Χριστός funciona como a designação cristã estabelecida; “Cristo” preserva o registro do autor sem explicitação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla compreensão. O período grego longo foi dividido em três frases para melhorar a legibilidade, preservando sua progressão causal e seus paralelos. Empregou-se “cada um” para manter a responsabilidade distributiva enfatizada pelo original.
