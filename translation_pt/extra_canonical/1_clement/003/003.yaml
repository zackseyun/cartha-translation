  text: οὕτως ἐπηγέρθησαν οἱ ἄτιμοι ἐπὶ τοὺς ἐντίμους, οἱ ἄδοξοι ἐπὶ τοὺς ἐνδόξους, οἱ ἄφρονες ἐπὶ τοὺς φρονίμους, οἱ νέοι ἐπὶ τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: pt
  text: Assim, os desonrados se levantaram contra os honrados, os sem glória contra os gloriosos, os insensatos contra os sensatos, os jovens contra os mais velhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηγέρθησαν ... ἐπὶ
  choice: se levantaram contra
  rationale: Reproduz de modo natural o sentido hostil do verbo com ἐπί, preservando o paralelismo da frase.
- source_word: ἄτιμοι / ἐντίμους
  choice: desonrados / honrados
  rationale: Mantém o contraste lexical ligado à honra e ao reconhecimento social.
- source_word: ἄδοξοι / ἐνδόξους
  choice: sem glória / gloriosos
  rationale: Preserva a distinção em relação ao par anterior e o jogo antitético formado pela raiz δόξα.
- source_word: ἄφρονες / φρονίμους
  choice: insensatos / sensatos
  rationale: Expressa o contraste entre falta de discernimento e bom senso, sem acrescentar conotação técnica.
- source_word: νέοι / πρεσβυτέρους
  choice: jovens / mais velhos
  rationale: Aqui πρεσβύτεροι contrasta diretamente com os jovens e pode indicar pessoas de maior idade; 'mais velhos' preserva essa leitura sem impor o sentido de cargo eclesiástico.
theological_decisions:
- issue: Sentido de πρεσβυτέρους
  choice: mais velhos
  alternative: presbíteros ou anciãos
  rationale: O paralelismo etário com οἱ νέοι favorece a referência aos mais velhos, embora o termo possa ter outros usos em contextos distintos.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela preservada. Evitou-se 'inglórios', pouco corrente, preferindo-se 'sem glória' para manter o contraste com 'gloriosos'.
