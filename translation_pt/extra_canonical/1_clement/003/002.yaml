base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/002.yaml
  text: From this came jealousy and envy, strife and faction, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became shortsighted in faith in him, neither walking in the lawful ways of his commandments nor conducting himself in a manner fitting for the Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy, through which death also entered into the world.
translation:
  language: pt
  text: Daí vieram o ciúme e a inveja, a contenda e a dissensão, a perseguição e a desordem, a guerra e o cativeiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ciúme
  rationale: Neste contexto negativo e em paralelo com φθόνος, indica rivalidade ciumenta, não zelo virtuoso.
- source_word: φθόνος
  choice: inveja
  rationale: Equivalente direto e natural para o desejo ressentido diante do bem ou da honra alheia.
- source_word: ἔρις
  choice: contenda
  rationale: Preserva a ideia de conflito e disputa aberta em registro digno e corrente.
- source_word: στάσις
  choice: rebelião
  rationale: Expressa a ruptura coletiva e o levante interno sugeridos pelo termo, com mais força do que simples desacordo.
- source_word: ἀκαταστασία
  choice: desordem
  rationale: Comunica instabilidade e confusão social sem restringir indevidamente o sentido.
- source_word: αἰχμαλωσία
  choice: cativeiro
  rationale: 'Mantém a consequência concreta da guerra indicada pelo grego: aprisionamento ou condição de cativo.'
