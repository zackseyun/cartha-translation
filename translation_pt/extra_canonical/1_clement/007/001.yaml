  rationale: A revisão ajusta o verbo de admoestação à força de νουθετοῦντες e torna o reflexivo idiomático. Mantêm-se o plural de «estas coisas», a inclusão dos autores na exortação e a dupla metáfora atlética de «arena» e «luta».
