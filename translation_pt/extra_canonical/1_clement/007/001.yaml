review_pass:
  verdict: revise
  source_fidelity: O texto transmite corretamente a estrutura e a metáfora atlética do grego. Contudo, «adverti-los» tende em português a significar sobretudo alertar/prevenir, enquanto νουθετοῦντες expressa admoestação ou exortação instrutiva; «exortá-los» é mais fiel neste contexto.
  naturalness: A redação é clara e digna. «Para nos lembrar» é mais idiomático e fluente do que «para lembrar a nós mesmos», sem perda de sentido. A omissão de «nós» antes de «escrevemos» melhora a naturalidade sem alterar a ênfase relevante.
  terminology: «Amados», «arena» e «luta» preservam adequadamente o registro e as imagens de ἀγαπητοί, σκάμμα e ἀγών. «Exortar» representa melhor νουθετέω do que «advertir» nesta ocorrência.
  issues:
  - severity: medium
    issue: «adverti-los» para νουθετοῦντες
    rationale: Em uso moderno, «advertir» frequentemente denota aviso ou prevenção; o verbo grego indica admoestar/exortar com propósito moral e instrutivo. «Exortá-los» mantém melhor essa força sem introduzir interpretação doutrinária.
  - severity: low
    issue: «lembrar a nós mesmos»
    rationale: É compreensível, mas «nos lembrar» é a formulação mais natural em português contemporâneo e conserva o reflexivo ἑαυτούς.
  revised_text: Estas coisas, amados, escrevemos não apenas para exortá-los, mas também para nos lembrar; pois estamos na mesma arena, e a mesma luta está diante de nós.
