source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: pt
  text: Por isso, deixemos de lado as preocupações vazias e inúteis e voltemo-nos para a gloriosa e venerável[a] norma da nossa tradição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «solene».'
    reason: Preserva a nota lexical do trilho de auditoria para a alternativa de tradução de σεμνός, sem substituir a opção contextual preferível, «venerável».
lexical_decisions:
- source_word: ἀπολίπωμεν
  choice: deixemos de lado
  rationale: Expressa de modo natural a exortação a abandonar aquilo que ocupa a atenção.
- source_word: κενὰς καὶ ματαίας φροντίδας
  choice: as preocupações vazias e inúteis
  rationale: Preserva os dois qualificativos gregos e o sentido de cuidados ou preocupações sem conteúdo nem proveito.
- source_word: ἔλθωμεν ἐπί
  choice: voltemo-nos para
  rationale: Transmite idiomaticamente o movimento figurado de passar das preocupações fúteis para a norma recebida.
- source_word: εὐκλεῆ καὶ σεμνὸν
  choice: gloriosa e venerável
  rationale: εὐκλεής indica boa fama ou glória; σεμνός descreve o que é digno de reverência e respeito, mais do que apenas solene.
- source_word: κανόνα
  choice: norma
  rationale: No contexto, designa um padrão ou regra orientadora; “norma” é clara e digna em português moderno.
- source_word: τῆς παραδόσεως ἡμῶν
  choice: da nossa tradição
  rationale: Reproduz diretamente a relação genitiva e mantém a referência coletiva da expressão grega.
theological_decisions:
- issue: Sentido de παράδοσις
  choice: tradição
  alternative: ensinamento transmitido
  rationale: O grego permite a ideia de conteúdo transmitido, mas “tradição” preserva a formulação ampla sem identificar indevidamente uma tradição denominacional específica.
translation_notes:
  register: Português moderno, claro e digno, com cadência exortativa. Evitou-se “solene” para σεμνός porque “venerável” comunica melhor a ideia de algo digno de reverência.
