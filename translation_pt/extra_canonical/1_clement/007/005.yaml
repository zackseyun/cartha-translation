review_pass:
  verdict: revise
  source_fidelity: A exortação plural e a progressão histórica estão bem representadas. «Geração após geração», «concedeu oportunidade de arrependimento» e «voltar-se para ele» transmitem adequadamente ἐν γενεᾷ καὶ γενεᾷ, μετανοίας τόπον e ἐπιστρέψαι ἐπ᾽ αὐτόν. Contudo, βουλομένοις é particípio presente e descreve os que estão dispostos/desejam voltar-se; «desejavam» introduz desnecessariamente um valor passado.
  naturalness: O texto é fluente, moderno e de registro apropriado. A substituição por «desejam» preserva essa fluência e deixa a formulação mais diretamente genérica, como no grego.
  terminology: «Senhor» é uma tradução contextual e natural de ὁ δεσπότης neste emprego teológico, sem importar a conotação pejorativa moderna de «déspota». «Arrependimento» e «voltar-se para ele» são adequados e não acrescentam a noção de retorno a uma condição anterior.
  issues:
  - severity: low
    issue: Tempo/aspecto de «desejavam»
    rationale: O particípio presente βουλομένοις é melhor refletido por «os que desejam», ou por uma construção equivalente de disposição presente/genérica. O imperfeito português pode restringir indevidamente os destinatários a um grupo situado no passado.
  revised_text: Percorramos todas as gerações e aprendamos com atenção que, geração após geração, o Senhor concedeu oportunidade de arrependimento aos que desejam voltar-se para ele.
