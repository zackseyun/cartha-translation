id: 1CLEM.7.5
reference: 1 Clement 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: pt
  text: Percorramos todas as gerações e aprendamos com atenção que, geração após geração, o Senhor concedeu oportunidade de arrependimento aos que desejam voltar-se para ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν
  choice: Percorramos
  rationale: Expressa naturalmente a ideia de passar em revista as gerações ao longo da história.
- source_word: καταμάθωμεν
  choice: aprendamos com atenção
  rationale: Preserva a força intensiva do verbo, que indica observar ou aprender cuidadosamente.
- source_word: ὁ δεσπότης
  choice: o Senhor
  rationale: Em português religioso corrente, “Senhor” comunica autoridade soberana com dignidade; “Déspota” teria conotação moderna indevidamente negativa.
- source_word: μετανοίας τόπον
  choice: oportunidade de arrependimento
  rationale: Traduz idiomaticamente a expressão literal “lugar para arrependimento”, entendida como espaço ou ocasião concedida para arrepender-se.
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: aos que desejavam voltar-se para ele
  rationale: Mantém tanto a disposição voluntária quanto o movimento de conversão em direção a ele, sem acrescentar explicitamente a noção de “voltar de novo”.
theological_decisions:
- issue: Sentido de ἐπιστρέψαι
  choice: voltar-se para ele
  alternative: voltar para ele
  rationale: “Voltar-se para” conserva a ideia de mudança de orientação sem pressupor, além do texto, que todos já mantinham anteriormente uma relação com ele.
- issue: Valor temporal de ἔδωκεν e βουλομένοις
  choice: concedeu ... aos que desejavam
  alternative: tem concedido ... aos que desejam
  rationale: O aoristo grego é representado pelo pretérito perfeito, mantendo a declaração histórica do autor, embora a máxima possa ter aplicação contínua.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe exortativa natural. “Geração após geração” reproduz o caráter distributivo de ἐν γενεᾷ καὶ γενεᾷ sem rigidez literal.
