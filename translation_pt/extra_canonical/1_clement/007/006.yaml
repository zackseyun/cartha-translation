  text: Noah proclaimed repentance, and those who obeyed were saved.
translation:
  language: pt
  text: Noé proclamou o arrependimento, e os que obedeceram foram salvos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυξεν
  choice: proclamou
  rationale: Expressa o anúncio público indicado pelo verbo grego, em linguagem natural e digna.
- source_word: μετάνοιαν
  choice: o arrependimento
  rationale: Preserva o sentido religioso de mudança de mente e de rumo, sem acrescentar uma explicação ausente do texto.
- source_word: οἱ ὑπακούσαντες
  choice: os que obedeceram
  rationale: Reproduz diretamente o particípio substantivado e mantém em aberto se a obediência se dirige a Noé, à proclamação ou a Deus.
- source_word: ἐσώθησαν
  choice: foram salvos
  rationale: Mantém a voz passiva e sua possível implicação de ação divina sem explicitar um agente não nomeado.
theological_decisions:
- issue: Objeto da obediência
  choice: Não explicitar a quem ou a que obedeceram
  alternative: os que deram ouvidos à sua mensagem
  rationale: O grego usa ὑπακούω sem objeto expresso; a tradução preserva essa concisão e ambiguidade.
- issue: Agente da salvação
  choice: Manter a construção passiva “foram salvos”
  alternative: Deus os salvou
  rationale: O texto não nomeia o agente, embora a forma passiva possa sugerir ação divina.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A estrutura breve e paralela do grego foi preservada.
