review_pass:
  verdict: revise
  source_fidelity: O sentido geral é fiel ao grego. Contudo, ἐξιλάσαντο τὸν θεόν apresenta «Deus» como objeto direto; em português, «aplacar» rege normalmente objeto direto, de modo que «aplacaram a Deus» enfraquece desnecessariamente a correspondência sintática. A expressão instrumental «por meio de súplicas» também torna mais explícita a relação do particípio ἱκετεύσαντες com o verbo principal, sem acrescentar conteúdo.
  naturalness: «Proclamou aos ninivitas a destruição» é mais idiomático e claro do que «proclamou destruição aos ninivitas». «Tendo-se arrependido» mantém registro digno e leitura fluida em português internacional.
  terminology: «Jonas», «ninivitas», «destruição», «salvação» e «alheios a Deus» são escolhas adequadas. «Aplacaram Deus» preserva a ação direta expressa pelo grego, sem impor uma explicação doutrinária do mecanismo propiciatório.
  issues:
  - severity: medium
    issue: Regência de «aplacar»
    rationale: O grego traz τὸν θεόν como objeto direto de ἐξιλάσαντο. Em português padrão, «aplacar» também se constrói com objeto direto; portanto, «aplacaram Deus» é a forma mais fiel e idiomática.
  - severity: low
    issue: Ordem de «proclamou destruição aos ninivitas»
    rationale: A construção é compreensível, mas «proclamou aos ninivitas a destruição» soa mais natural e conserva sem ambiguidade os destinatários e o conteúdo da proclamação.
  revised_text: Jonas proclamou aos ninivitas a destruição; mas eles, tendo-se arrependido dos seus pecados, aplacaram Deus por meio de súplicas e receberam salvação, embora fossem alheios a Deus.
