- from: Jonas proclamou destruição aos ninivitas; mas eles, tendo se arrependido de seus pecados, aplacaram a Deus com suas súplicas e receberam salvação, embora fossem alheios a Deus.
  to: Jonas proclamou aos ninivitas a destruição; mas eles, tendo-se arrependido dos seus pecados, aplacaram Deus por meio de súplicas e receberam salvação, embora fossem alheios a Deus.
  rationale: A revisão ajusta a regência portuguesa para refletir o objeto direto de ἐξιλάσαντο τὸν θεόν e melhora levemente a ordem verbal. Mantém-se «salvação» para σωτηρίαν e «alheios a Deus» para ἀλλότριοι τοῦ θεοῦ, preservando a amplitude e a tensão relacional do original.
