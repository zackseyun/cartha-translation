source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: pt
  text: Jonas proclamou aos ninivitas a destruição; mas eles, tendo-se arrependido dos seus pecados, aplacaram Deus por meio de súplicas e receberam salvação, embora fossem alheios a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστροφὴν
  choice: destruição
  rationale: Expressa diretamente a ruína anunciada por Jonas, sem acrescentar detalhes não presentes no grego.
- source_word: μετανοήσαντες
  choice: tendo se arrependido
  rationale: Preserva o valor circunstancial e anterior do particípio aoristo, em português natural.
- source_word: ἐξιλάσαντο τὸν θεὸν
  choice: aplacaram a Deus
  rationale: O verbo tem Deus como objeto direto e, neste contexto, indica que os ninivitas o aplacaram; evita alterar a sintaxe para 'fizeram expiação diante de Deus'.
- source_word: ἱκετεύσαντες
  choice: com suas súplicas
  rationale: Comunica o caráter suplicante do ato e sua relação instrumental com ἐξιλάσαντο.
- source_word: σωτηρίαν
  choice: salvação
  rationale: Mantém o substantivo amplo do original, que neste contexto inclui o livramento da destruição anunciada.
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: alheios a Deus
  rationale: Reproduz a ideia de quem não pertencia ao povo de Deus ou não mantinha relação com ele, sem explicitar uma interpretação além do texto.
theological_decisions:
- issue: Sentido de ἐξιλάσαντο com Deus como objeto direto
  choice: aplacaram a Deus
  alternative: fizeram expiação para Deus / reconciliaram-se com Deus
  rationale: A construção grega apresenta τὸν θεόν como objeto direto. 'Aplacaram a Deus' conserva essa relação e a força propiciatória do verbo, sem introduzir uma teoria específica da expiação.
- issue: Alcance de σωτηρίαν
  choice: salvação
  alternative: livramento
  rationale: '''Salvação'' preserva a formulação ampla e teologicamente carregada do autor; o contexto imediato permite entendê-la como livramento do juízo, mas não exige reduzir o termo a isso.'
- issue: Condição dos ninivitas como ἀλλότριοι τοῦ θεοῦ
  choice: alheios a Deus
  alternative: estranhos para Deus / estrangeiros ao povo de Deus
  rationale: A opção mantém a tensão do genitivo e não resolve indevidamente se a alienação é relacional, religiosa ou ligada ao povo da aliança.
translation_notes:
  register: Português atual, digno e acessível, com ordem sintática próxima do grego sem rigidez excessiva. 'Ninivitas' e 'Jonas' seguem as formas bíblicas correntes. A repetição de 'Deus' preserva a clareza e a ênfase do original.
