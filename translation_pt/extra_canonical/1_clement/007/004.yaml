id: 1CLEM.7.4
reference: 1 Clement 7:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: pt
  text: Fixemos o olhar no sangue do Messias e reconheçamos quanto ele é precioso para seu Deus e Pai[a], pois, derramado para a nossa salvação, trouxe ao mundo inteiro a graça do arrependimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Deus, seu Pai”.'
    reason: Registra uma forma alternativa de relacionar θεῷ, πατρὶ e αὐτοῦ, embora o texto principal reflita mais diretamente a coordenação grega.
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Fixemos o olhar
  rationale: Expressa de modo natural a ideia de olhar fixa e atentamente.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Traduz o título grego Χριστός por seu sentido, em conformidade com a política indicada nas revisões.
- source_word: γνῶμεν
  choice: reconheçamos
  rationale: Neste contexto exortativo, comunica conhecer e compreender o valor do sangue.
- source_word: τίμιον
  choice: precioso
  rationale: Preserva o sentido de grande valor e honra diante de Deus.
- source_word: μετανοίας
  choice: do arrependimento
  rationale: Equivalente corrente e teologicamente não restritivo para mudança de mente e conduta.
- source_word: διήνεγκεν
  choice: trouxe
  rationale: Representa o sentido contextual de proporcionar ou levar a graça ao mundo inteiro sem tornar a frase artificial.
theological_decisions:
- issue: Relação expressa em τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: para seu Deus e Pai
  alternative: para Deus, seu Pai
  rationale: O artigo único rege os dois substantivos coordenados, e αὐτοῦ naturalmente se relaciona com a expressão inteira; a tradução preserva a afirmação relacional sem a enfraquecer.
- issue: Alcance de παντὶ τῷ κόσμῳ
  choice: ao mundo inteiro
  alternative: a todo o mundo
  rationale: Mantém o alcance universal explícito do grego sem explicar além do texto.
- issue: Agência de ἐκχυθὲν e διήνεγκεν
  choice: o sangue, derramado, trouxe
  alternative: Cristo, ao derramar seu sangue, trouxe
  rationale: Preserva a construção gramatical grega, na qual αἷμα é o referente do particípio e o sujeito implícito de διήνεγκεν.
translation_notes:
  register: Português moderno, digno e acessível, com construção exortativa inclusiva. A ordem foi levemente ajustada para fluência, sem eliminar a relação explícita entre o Messias e “seu Deus e Pai”.
