source:
  edition: Funk 1901 (normalized OCR)
  text: ὠκεανὸς ἀπέραντος ἀνθρώποις καὶ οἱ μετ᾽ αὐτὸν κόσμοι ταγαῖς τοῦ δεσπότου διευθύνονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/008.yaml
  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: pt
  text: O oceano, intransponível para os seres humanos, e os mundos além dele são regidos pelas ordenações do Soberano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέραντος
  choice: intransponível
  rationale: No contexto, descreve o oceano como impossível de atravessar para os seres humanos, e não meramente como ilimitado em extensão.
- source_word: κόσμοι
  choice: mundos
  rationale: Mantém o plural e a abertura conceitual do grego, sem especificar a natureza dos mundos situados além do oceano.
- source_word: ταγαῖς
  choice: ordenações
  rationale: Reflete disposições ou arranjos estabelecidos, preservando o registro solene e evitando reduzir o termo a simples decretos verbais.
- source_word: δεσπότου
  choice: Soberano
  rationale: Expressa autoridade e domínio, com dignidade, sem a conotação moderna negativa que 'déspota' normalmente teria.
- source_word: διευθύνονται
  choice: são regidos
  rationale: Comunica que esses domínios são conduzidos ou mantidos em ordem segundo as ordenações do Soberano.
theological_decisions:
- issue: Identidade do δεσπότης
  choice: Soberano, com inicial maiúscula
  alternative: senhor ou mestre
  rationale: O contexto atribui governo cósmico a Deus; 'Soberano' preserva a ênfase na autoridade sem introduzir uma identificação mais específica.
- issue: Natureza dos κόσμoι além do oceano
  choice: manter 'mundos' sem explicação
  alternative: regiões, terras ou universos
  rationale: O grego é aberto quanto à natureza desses mundos; especificá-los resolveria indevidamente uma ambiguidade antiga.
translation_notes:
  register: Português moderno, solene e claro, com sintaxe próxima do grego sem rigidez artificial. 'Seres humanos' representa o valor genérico de ἀνθρώποις com leitura internacional e inclusiva.
