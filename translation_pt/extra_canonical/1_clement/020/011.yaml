  to: Todas essas coisas o grande Criador e Soberano de tudo ordenou que estivessem em paz e harmonia, fazendo o bem a todas elas, mas, de modo superabundante, a nós, que nos refugiamos em suas misericórdias por meio de nosso Senhor Jesus, o Messias.
