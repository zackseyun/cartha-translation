id: 1CLEM.20.11
reference: 1 Clement 20:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: pt
  text: Todas essas coisas o grande Criador e Soberano de tudo ordenou que estivessem em paz e harmonia, fazendo o bem a todas elas, mas, de modo superabundante, a nós, que nos refugiamos em suas misericórdias por meio de nosso Senhor Jesus, o Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διμιουργὸς
  choice: Criador
  rationale: No contexto cosmológico, designa aquele que fez e ordena todas as coisas; “Criador” é natural, digno e semanticamente adequado.
- source_word: δεσπότης
  choice: Soberano
  rationale: Expressa autoridade absoluta sobre tudo sem as conotações modernas negativas que “déspota” teria em português.
- source_word: ὁμονοίᾳ
  choice: harmonia
  rationale: Comunica concordância e unidade de disposição no funcionamento ordenado da criação.
- source_word: προσέταξεν εἶναι
  choice: ordenou que permanecessem
  rationale: Reproduz a determinação divina de que as realidades mencionadas estejam e continuem na condição de paz e harmonia; o plural retoma naturalmente “todas essas coisas”.
- source_word: ὑπερεκπερισσῶς
  choice: de modo superabundante
  rationale: Preserva a forte intensificação do advérbio grego e mantém a comparação implícita com o benefício concedido a todas as coisas.
- source_word: προσπεφευγότας
  choice: que buscamos refúgio
  rationale: Mantém a imagem de recorrer a alguém em busca de proteção, expressa pelo perfeito grego, em português corrente.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz o título grego pelo seu sentido, distinguindo-o do nome pessoal e tornando sua função perceptível ao leitor moderno.
theological_decisions:
- issue: Relação entre a beneficência divina universal e a dirigida aos fiéis
  choice: “fazendo o bem a todas elas, mas de modo superabundante a nós”
  alternative: “beneficiando todas as coisas, porém muito mais a nós”
  rationale: Conserva tanto a abrangência universal de εὐεργετῶν τὰ πάντα quanto a intensificação particular referente aos que buscam a misericórdia divina, sem definir em que consiste essa diferença.
- issue: Plural de οἰκτιρμοῖς
  choice: “misericórdias”
  alternative: “misericórdia”
  rationale: Mantém o plural do texto grego e sua possível ênfase nas múltiplas expressões da compaixão divina.
- issue: Mediação de Jesus
  choice: “por meio de nosso Senhor Jesus, o Messias”
  alternative: “por nosso Senhor Jesus Cristo”
  rationale: Preserva διά como indicação de mediação e traduz Χριστός como título messiânico, sem acrescentar uma explicação doutrinária sobre a natureza dessa mediação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção conserva o fluxo de uma única frase e a tensão entre o cuidado divino por toda a criação e seu benefício superabundante aos que recorrem às suas misericórdias.
