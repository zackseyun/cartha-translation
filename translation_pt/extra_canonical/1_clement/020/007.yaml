  yaml_path: translation/extra_canonical/1_clement/020/007.yaml
  text: For he said, “Thus far you shall come, and your waves shall be broken within you.”
translation:
  language: pt
  text: 'Pois ele disse: “Até aqui você chegará, e suas ondas serão quebradas dentro de você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως ὧδε
  choice: Até aqui
  rationale: Expressa de modo natural e direto o limite espacial indicado pela locução grega.
- source_word: ἥξεις
  choice: você chegará
  rationale: Preserva o futuro do verbo ἥκω e a interpelação direta ao mar personificado.
- source_word: τὰ κύματά σου
  choice: as suas ondas
  rationale: Equivalência direta e corrente para o sintagma possessivo grego.
- source_word: ἐν σοὶ συντριβήσεται
  choice: se quebrarão dentro de você
  rationale: Mantém a imagem incomum do texto grego, inclusive ἐν σοὶ, sem substituí-la por uma formulação bíblica harmonizada de outra tradição textual.
theological_decisions:
- issue: Personificação do mar na citação
  choice: 'Manter a segunda pessoa singular: “você” e “suas”.'
  alternative: Empregar “tu” e “tuas” ou explicitar “mar”.
  rationale: O grego dirige a fala diretamente ao mar sem nomeá-lo neste versículo; “você” conserva essa personificação com ampla legibilidade no português moderno.
translation_notes:
  register: Português moderno, claro e digno, com construção formal sem arcaísmo. A formulação “dentro de você” foi preservada por fidelidade à leitura específica do grego de 1 Clemente, embora soe menos idiomática do que possíveis harmonizações.
