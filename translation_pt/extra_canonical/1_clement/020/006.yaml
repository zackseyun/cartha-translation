reference: 1 Clement 20:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: pt
  text: A massa do mar sem limites, reunida em suas bacias conforme a criação de Deus, não ultrapassa os limites estabelecidos ao seu redor; mas, como Deus lhe ordenou, assim faz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ χύτος
  choice: A massa
  rationale: Refere-se à massa ou ao volume das águas, não ao recipiente que as contém.
- source_word: τῆς ἀπείρου θαλάσσης
  choice: do mar sem limites
  rationale: Preserva a ideia de vastidão ou ausência de limites expressa por ἄπειρος em linguagem natural.
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: conforme a criação de Deus
  rationale: Mantém o sentido de δημιουργία como criação ou obra criadora; explicita Deus como referente contextual de αὐτοῦ para evitar ambiguidade pronominal artificial em português.
- source_word: εἰς τὰς συναγωγάς
  choice: em seus reservatórios
  rationale: Aqui συναγωγαί designa lugares ou depósitos em que as águas são reunidas; 'reservatórios' comunica esse sentido sem confundi-lo com a massa de água.
- source_word: χείλη
  choice: margens
  rationale: Embora o sentido literal seja 'lábios', no contexto marítimo indica as bordas ou margens que contêm as águas.
- source_word: διετάξεν
  choice: ordenou
  rationale: Expressa uma determinação ou ordem estabelecida por Deus.
theological_decisions:
- issue: Referente dos pronomes masculinos αὐτοῦ e do sujeito implícito de διετάξεν
  choice: Deus
  alternative: dele / ele
  rationale: O contexto do capítulo apresenta a ordem da criação como estabelecida por Deus. A explicitação torna o português claro sem acrescentar uma identificação teológica alheia ao contexto.
- issue: Descrição da obediência do mar à ordem divina
  choice: faz exatamente como Deus lhe ordenou
  alternative: assim faz
  rationale: Preserva a personificação retórica e a ênfase na ordem cósmica, sem converter a linguagem em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. Emprega 'mar sem limites' em vez de uma formulação excessivamente erudita e mantém o paralelismo enfático da frase grega.
