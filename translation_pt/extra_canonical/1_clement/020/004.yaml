id: 1CLEM.20.4
reference: 1 Clement 20:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: pt
  text: A terra, gerando segundo a vontade dele, faz brotar, nos tempos apropriados, alimento em abundância para os seres humanos, os animais e todos os seres vivos que vivem sobre ela, sem hesitar nem alterar coisa alguma do que foi determinado por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: gerando
  rationale: Preserva a imagem da terra que carrega e produz vida, sem acrescentar explicitamente «fruto», ausente do grego.
- source_word: τοῖς ἰδίοις καιροῖς
  choice: nas estações próprias
  rationale: Expressa os períodos apropriados e recorrentes da produção da terra; «estações» é natural no contexto agrícola.
- source_word: τὴν πανπληθῆ ... τροφήν
  choice: alimento em abundância
  rationale: Comunica de modo corrente a ideia de provisão muito abundante, evitando uma formulação artificial.
- source_word: ἀνατέλλει
  choice: faz brotar
  rationale: Mantém a imagem concreta de a terra fazer surgir sua produção, mais precisamente do que o genérico «produz».
- source_word: μήτε διστατάσουσα
  choice: sem hesitar
  rationale: Conserva a personificação e o sentido de não vacilar diante da ordem divina.
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: do que foi determinado por ele
  rationale: Reflete decisões ou determinações estabelecidas por Deus sem introduzir terminologia confessional.
theological_decisions:
- issue: Referente dos pronomes masculinos αὐτοῦ / ὑπ᾽ αὐτοῦ
  choice: dele / por ele
  alternative: de Deus / por Deus
  rationale: O versículo grego emprega pronomes e depende do contexto para identificar Deus; a tradução preserva essa coesão sem explicitar além do texto.
- issue: Obediência da criação à ordem divina
  choice: sem hesitar nem alterar coisa alguma do que foi determinado
  alternative: sem falhar nem mudar nenhum dos seus decretos
  rationale: Mantém a personificação e a força normativa do grego, mas evita sugerir tecnicamente uma doutrina particular dos decretos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A ordem foi levemente ajustada para fluência, mantendo a imagem da gestação, os tempos próprios, a abundância e a obediência invariável da terra.
