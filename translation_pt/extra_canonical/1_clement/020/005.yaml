  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: pt
  text: As profundezas insondáveis dos abismos e os juízos indescritíveis das regiões inferiores[a] são mantidos sob controle pelas mesmas ordens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as determinações indescritíveis do mundo inferior”.'
    reason: κρίματα pode denotar juízos, decisões ou determinações; o genitivo νερτέρων refere-se às regiões inferiores ou ao mundo inferior.
  - marker: b
    text: 'Ou: “são mantidos unidos pelas mesmas ordens”.'
    reason: συνέχεται pode expressar tanto contenção e controle quanto a ideia de manter unido.
lexical_decisions:
- source_word: ἀβύσσων ... ἀνεξιχνίαστα
  choice: as profundezas insondáveis dos abismos
  rationale: O adjetivo neutro substantivado ἀνεξιχνίαστα designa aquilo que não pode ser sondado nos abismos; “profundezas insondáveis” expressa naturalmente a imagem e a elipse grega.
- source_word: νερτέρων
  choice: das regiões inferiores
  rationale: O genitivo substantivado refere-se ao mundo ou às regiões de baixo, sem especificar aqui uma doutrina detalhada do além.
- source_word: ἀνεκδιήγητα κρίματα
  choice: os juízos indescritíveis
  rationale: Preserva o sentido lexical normal de κρίματα, “juízos” ou “decisões”, em vez de substituí-lo silenciosamente por “regiões”; ἀνεκδιήγητα indica o que não pode ser plenamente narrado ou descrito.
- source_word: συνέχεται
  choice: são mantidos sob controle
  rationale: Com o dativo προστάξεσιν e no contexto da ordem cósmica, o verbo comunica contenção ou controle exercido pelas ordens, sem reduzir o sentido à mera coesão interna.
- source_word: ταῖς αὐταῖς ... προστάξεσιν
  choice: pelas mesmas ordens
  rationale: προστάξεις são ordens ou determinações dotadas de autoridade; “as mesmas” relaciona esses domínios à ordem divina descrita no contexto.
theological_decisions:
- issue: Natureza dos κρίματα das regiões inferiores
  choice: juízos
  alternative: domínios ou regiões
  rationale: A tradução mantém a linguagem judicial do substantivo grego e, portanto, a possível tensão entre a ordem cósmica e o juízo no mundo inferior, sem impor uma cosmologia mais definida.
- issue: Força de συνέχεται sob as ordens divinas
  choice: mantidos sob controle
  alternative: mantidos unidos
  rationale: A regência com “pelas mesmas ordens” e o contexto de limites cósmicos favorecem a ideia de contenção ou sujeição, embora a possibilidade de coesão seja digna de nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva a imagética cosmológica e sinaliza em notas as ambiguidades lexicais relevantes, sem introduzir terminologia denominacional.
