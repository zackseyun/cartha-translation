id: 1CLEM.20.10
reference: 1 Clement 20:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: pt
  text: Os percursos dos ventos[a], cada qual em seu devido tempo, cumprem seu serviço sem impedimento; as fontes perenes, criadas para deleite e saúde, oferecem sem falta seus seios para a vida dos seres humanos; e os menores seres vivos realizam seus encontros em harmonia e paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os lugares determinados dos ventos”.'
    reason: O substantivo grego σταθμοί pode designar percursos ou posições/lugares estabelecidos; a referência exata no contexto admite mais de uma formulação.
lexical_decisions:
- source_word: σταθμοὶ
  choice: percursos
  rationale: No contexto dos ventos, indica seus cursos ou movimentos determinados; “percursos” soa natural em português e mantém a ideia de ordem regular.
- source_word: ἀπροσκόπως
  choice: sem impedimento
  rationale: Expressa ação desimpedida ou sem obstáculos; evita o literalismo pouco natural “sem tropeçar” aplicado aos ventos.
- source_word: ἀέναοί
  choice: perenes
  rationale: Comunica fontes de fluxo contínuo ou duradouro em registro corrente e digno.
- source_word: μαζούς
  choice: seios
  rationale: Preserva a metáfora corporal explícita das fontes que nutrem e sustentam a vida.
- source_word: ὁμονοίᾳ
  choice: harmonia
  rationale: Transmite acordo e união de propósito sem introduzir conotação denominacional.
theological_decisions:
- issue: Personificação da ordem criada
  choice: Preservar “serviço”, “seios” e “encontros”
  alternative: Substituir as imagens por descrições naturalistas, como “função”, “águas” e “ajuntamentos”
  rationale: O texto apresenta poeticamente a criação como obediente, nutridora e pacífica; conservar essas imagens mantém a força retórica sem acrescentar uma doutrina específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se um tom digno e poético, com coordenação fluida dos três exemplos da ordem criada.
