- source_word: τῇ διοικήσει αὐτοῦ
  choice: sob o seu governo
  rationale: Expressa de modo natural a direção ou administração divina sob a qual os céus se movem.
- source_word: ὑποτάσσονται
  choice: submetem-se
  rationale: Reproduz diretamente a ideia de sujeição voluntária ou ordenada presente no verbo grego.
