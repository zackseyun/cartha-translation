id: 1CLEM.20.3
reference: 1 Clement 20:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: pt
  text: O sol, a lua e os coros de estrelas, conforme a sua determinação, percorrem em concórdia, sem desvio algum, as trajetórias que lhes foram designadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprem, em concórdia e sem desvio algum, os limites que lhes foram estabelecidos”.'
    reason: Registra o sentido mais literal de ἐξελίσσουσιν ... ὁρισμούς, cuja imagem pode apontar tanto para percursos celestes quanto para limites determinados.
lexical_decisions:
- source_word: χοροὶ
  choice: coros
  rationale: Preserva a imagem grega de conjuntos ordenados de estrelas, sem reduzi-la simplesmente a “grupos”.
- source_word: διαταγήν
  choice: determinação
  rationale: Expressa uma ordem ou disposição estabelecida, mantendo o tom solene sem recorrer a vocabulário jurídico excessivamente técnico.
- source_word: ἐν ὁμονοίᾳ
  choice: em concórdia
  rationale: Mantém o importante vocabulário de concórdia de 1 Clemente, em contraste retórico com divisão e conflito; “em harmonia” seria possível, mas menos preciso nesse contexto.
- source_word: ἐξελίσσουσιν ... ὁρισμούς
  choice: percorrem ... as trajetórias
  rationale: Oferece uma expressão portuguesa natural para o movimento ordenado dos corpos celestes. ὁρισμούς denota literalmente limites ou demarcações, mas, neste contexto cosmológico, pode referir-se aos percursos delimitados que lhes foram atribuídos.
- source_word: δίχα πάσης παρεκβάσεως
  choice: sem desvio algum
  rationale: Reproduz de modo claro e enfático a ideia de não se afastarem em absoluto da ordem estabelecida.
theological_decisions:
- issue: Referente de αὐτοῦ em “conforme a sua determinação”
  choice: Manter o pronome possessivo sem explicitar “Deus”
  alternative: “conforme a determinação de Deus”
  rationale: Embora o contexto identifique o referente, o grego emprega um pronome; preservá-lo evita inserir no versículo uma explicitação ausente da formulação original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Concórdia” foi preservado por sua importância retórica em 1 Clemente; “coros de estrelas” conserva a imagem poética do original.
