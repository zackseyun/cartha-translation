source:
  edition: Funk 1901 (normalized OCR)
  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: pt
  text: Todas as coisas estão diante dele, e nada escapou à sua deliberação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nada passou despercebido à sua deliberação».'
    reason: Explicita a nuance cognitiva de λέληθεν sem transformar βουλή em «desígnio» numa construção semanticamente inadequada.
lexical_decisions:
- source_word: πάντα
  choice: Todas as coisas
  rationale: Reproduz de modo natural e abrangente o neutro plural grego.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Equivalente direto e idiomático, preservando a ideia de que tudo está perante sua presença e percepção.
- source_word: λέληθεν
  choice: escapou
  rationale: O perfeito de λανθάνω indica que nada passou despercebido ou permaneceu oculto; «escapou» conserva essa força quando ligado à deliberação.
- source_word: βουλὴν
  choice: deliberação
  rationale: Expressa o aspecto de conselho, reflexão ou determinação de βουλή sem reduzir o termo apenas a «propósito» nem usar o pouco natural «conselho» neste contexto.
theological_decisions:
- issue: Alcance de βουλή como deliberação, conselho ou desígnio divino
  choice: deliberação
  alternative: desígnio
  rationale: '«Deliberação» preserva melhor a relação cognitiva com λανθάνω: nada escapa à consideração divina. A nota registra «desígnio», possível quando βουλή enfatiza propósito ou decisão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A formulação mantém o paralelismo conciso do grego e evita sugerir que o propósito divino tenha sido frustrado.
