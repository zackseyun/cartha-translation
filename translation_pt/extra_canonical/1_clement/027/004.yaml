  text: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ συνεστήσατο τὰ πάντα καὶ ἐν λόγῳ δύναται αὐτὰ καταστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/004.yaml
  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: pt
  text: Pela palavra da sua majestade, ele estabeleceu todas as coisas; e, por uma palavra, pode destruí-las.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: Pela palavra / por uma palavra
  rationale: A preposição ἐν pode indicar o meio pelo qual Deus age. O primeiro sintagma é definido pela expressão genitiva, enquanto o segundo permite naturalmente a formulação indefinida “por uma palavra”.
- source_word: μεγαλωσύνης
  choice: majestade
  rationale: Preserva o sentido de grandeza e dignidade soberana, em linguagem corrente e solene.
- source_word: συνεστήσατο
  choice: estabeleceu
  rationale: Expressa que Deus fez todas as coisas subsistirem ou ficarem constituídas, sem restringir indevidamente o verbo a uma única nuance possível.
- source_word: καταστρέψαι
  choice: destruí-las
  rationale: No contraste com estabelecer todas as coisas, o infinitivo comunica sua derrubada ou destruição. “Destruir” é claro e idiomático em português.
theological_decisions:
- issue: A eficácia soberana da palavra divina
  choice: Manter o paralelismo entre estabelecer e destruir por meio da palavra
  alternative: Explicitar criação e aniquilação
  rationale: O grego fala em estabelecer e destruir, sem desenvolver uma doutrina específica da criação do nada ou da aniquilação; a tradução preserva essa tensão sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com pontuação que realça o paralelismo da frase grega.
