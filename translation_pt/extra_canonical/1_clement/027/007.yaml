id: 1CLEM.27.7
reference: 1 Clement 27:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: pt
  text: Os céus proclamam a glória de Deus[a], e o firmamento anuncia a obra de suas mãos; um dia derrama uma mensagem ao outro dia, e uma noite transmite conhecimento à outra noite. Não há palavras nem falas cujas vozes não sejam ouvidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O OCR da edição traz εἰ, «se», mas a leitura esperada é Οἱ, «os», de acordo com a citação de Salmo 19:1–3 (LXX 18:2–4). Se εἰ fosse mantido, seria possível traduzir: «Se os céus proclamam a glória de Deus...»'
    reason: Registra a variante aparente produzida pelo OCR e preserva transparência quanto à forma fornecida da fonte.
lexical_decisions:
- source_word: διηγοῦνται
  choice: proclamam
  rationale: Expressa a ideia de narrar ou declarar publicamente, com fluência no contexto poético.
- source_word: στερέωμα
  choice: firmamento
  rationale: Preserva o termo cosmológico tradicional e corresponde diretamente ao grego.
- source_word: ποίησιν χειρῶν αὐτοῦ
  choice: a obra de suas mãos
  rationale: Mantém a imagem concreta do grego sem explicá-la ou modernizá-la.
- source_word: ἐρεύγεται ῥῆμα
  choice: derrama palavras
  rationale: Conserva a imagem vigorosa de algo que irrompe ou jorra, em português poético inteligível.
- source_word: ἀναγγέλλει γνῶσιν
  choice: transmite conhecimento
  rationale: Reproduz o sentido de comunicar ou anunciar conhecimento, evitando repetição excessiva de «anuncia».
- source_word: λόγοι οὐδὲ λαλιαί
  choice: palavras nem falas
  rationale: Mantém a distinção aproximada entre palavras e manifestações de fala sem impor uma diferença técnica.
- source_word: φωναὶ αὐτῶν
  choice: suas vozes
  rationale: Preserva a personificação e a formulação incomum do grego.
theological_decisions:
- issue: Leitura da palavra inicial εἰ
  choice: Os céus
  alternative: Se os céus / Visto que os céus
  rationale: Neste contexto de citação do Salmo 19:1–3 (LXX 18:2–4), εἰ no OCR representa muito provavelmente uma leitura equivocada de Οἱ; tratá-lo como conjunção deixaria a construção sintaticamente defeituosa ou alteraria sua relação lógica.
- issue: Alcance universal das vozes
  choice: Não existem palavras nem falas cujas vozes não sejam ouvidas
  alternative: Não há fala nem palavras; a voz deles não é ouvida
  rationale: Segue a sintaxe afirmativa do texto grego apresentado, sem harmonizá-la com outras formas textuais ou traduções do salmo.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A estrutura paralela foi preservada, assim como as imagens de «firmamento», «obra de suas mãos» e palavras que são derramadas.
