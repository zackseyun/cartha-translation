reference: 1 Clement 27:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: pt
  text: Aquele que deu a ordem de não mentir, com muito mais razão ele próprio não mentirá; pois nada é impossível para Deus, a não ser mentir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραγγείλας
  choice: Aquele que ordenou
  rationale: Reproduz naturalmente o particípio substantivado e o sentido de dar uma ordem.
- source_word: μὴ ψεύδεσθαι
  choice: não mentir
  rationale: Mantém o infinitivo sem acrescentar um objeto como “nós”, ausente do grego.
- source_word: πολλῷ μᾶλλον
  choice: com muito mais razão
  rationale: Expressa a força da inferência enfática em português corrente e digno.
- source_word: αὐτὸς οὐ ψεύσεται
  choice: ele próprio não mentirá
  rationale: Conserva a ênfase de αὐτός e o valor futuro de ψεύσεται.
- source_word: οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ
  choice: pois nada é impossível para Deus
  rationale: Formulação portuguesa natural para a construção παρὰ com dativo, preservando a afirmação geral.
- source_word: εἰ μὴ τὸ ψεύσασθαι
  choice: a não ser mentir
  rationale: Mantém a exceção paradoxal e o infinitivo substantivado sem tentar resolver sua tensão teológica.
theological_decisions:
- issue: A declaração de que nada é impossível para Deus, exceto mentir
  choice: 'Preservar literalmente a exceção: “a não ser mentir”'
  alternative: Reformular como “Deus não pode mentir” ou “exceto aquilo que contraria sua natureza”
  rationale: O texto grego apresenta deliberadamente a incapacidade de mentir como exceção; uma explicação doutrinária resolveria indevidamente a tensão retórica.
- issue: Objeto implícito da ordem de não mentir
  choice: Não acrescentar “nós”
  alternative: “Aquele que nos ordenou não mentir”
  rationale: O grego não explicita o destinatário, e a tradução pode conservar essa abertura com naturalidade.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e boa legibilidade brasileira. A ordem grega foi ajustada apenas o necessário para fluência, mantendo a ênfase em “ele próprio” e a tensão da frase final.
