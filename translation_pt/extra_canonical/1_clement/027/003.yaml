  text: ἀναζωπυρησάτω οὖν ἡ πίστις αὐτοῦ ἐν ἡμῖν, καὶ νοήσωμεν, ὅτι πάντα ἐγγὺς αὐτῷ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: pt
  text: Portanto, reacenda-se em nós a fé nele, e compreendamos que todas as coisas estão perto dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: reacenda-se
  rationale: Preserva a imagem verbal de fazer o fogo tornar a arder, com uma formulação natural e digna em português.
- source_word: ἡ πίστις αὐτοῦ
  choice: a fé nele
  rationale: O genitivo com pronome pode ser formalmente ambíguo, mas neste contexto é entendido de modo natural como fé dirigida a Deus; a escolha também coincide com a leitura da camada inglesa auditada.
- source_word: νοήσωμεν
  choice: compreendamos
  rationale: Expressa percepção e entendimento consciente, mantendo a força exortativa do subjuntivo grego.
- source_word: πάντα ἐγγὺς αὐτῷ ἐστιν
  choice: todas as coisas estão perto dele
  rationale: Reproduz diretamente a afirmação grega sem explicitar ou restringir em que sentido tudo está próximo de Deus.
theological_decisions:
- issue: Sentido de αὐτοῦ em ἡ πίστις αὐτοῦ
  choice: fé nele
  alternative: sua fé / a fé dele
  rationale: Embora o genitivo isoladamente comporte mais de uma relação, o contexto exortativo favorece a fé humana dirigida a Deus. Evita-se a formulação 'sua fé', que em português sugeriria mais prontamente a fé exercida por ele.
- issue: Alcance da proximidade divina
  choice: todas as coisas estão perto dele
  alternative: tudo está ao seu alcance
  rationale: A tradução literal preserva a amplitude e a possível tensão metafísica, cognitiva ou operativa de ἐγγύς, sem reduzi-la apenas a poder ou conhecimento.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e sintaxe exortativa próxima do grego. Não há marcadores de nota, pois nenhuma nota foi julgada necessária.
