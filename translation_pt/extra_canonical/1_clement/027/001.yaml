id: 1CLEM.27.1
reference: 1 Clement 27:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: pt
  text: Nesta esperança, portanto,[a] que as nossas almas permaneçam ligadas àquele que é fiel em suas promessas e justo em seus julgamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma construção menos provável: “Portanto, que as nossas almas permaneçam ligadas a esta esperança naquele que é fiel”.'
    reason: Registra a tradução anterior e a ambiguidade tradicional, embora a sintaxe grega favoreça o texto principal.
lexical_decisions:
- source_word: προσδεδέσθωσαν
  choice: permaneçam ligadas
  rationale: O perfeito passivo imperativo expressa tanto a ordem quanto o estado resultante de estar ligado; “permaneçam ligadas” comunica isso com naturalidade.
- source_word: τῷ πιστῷ
  choice: àquele que é fiel
  rationale: O artigo com o adjetivo substantivado designa uma pessoa, e o dativo completa προσδέω como aquilo ou aquele a quem as almas estão ligadas.
- source_word: ἐν ταῖς ἐπαγγελίαις
  choice: em suas promessas
  rationale: A construção caracteriza a fidelidade de Deus no âmbito de suas promessas; o possessivo torna explícita em português uma relação implícita e natural no grego.
- source_word: τῷ δικαίῳ ἐν τοῖς κρίμασιν
  choice: justo em seus julgamentos
  rationale: Mantém o paralelismo com “fiel em suas promessas” e traduz κρίματα sem restringi-lo indevidamente a sentenças condenatórias.
theological_decisions:
- issue: Identidade de “o fiel” e “o justo”
  choice: àquele que é fiel... e justo
  alternative: a Deus, que é fiel... e justo
  rationale: O contexto aponta para Deus, mas o texto grego não o nomeia neste versículo; a formulação preserva a expressão substantivada e evita acrescentar uma identificação explícita.
- issue: Função de Ταύτῃ... τῇ ἐλπίδι
  choice: Nesta esperança, portanto
  alternative: ligadas a esta esperança naquele que é fiel
  rationale: A sintaxe favorece o dativo de esfera ou meio para “nesta esperança”, enquanto τῷ πιστῷ é o complemento de προσδέω. A alternativa é registrada apenas por sua história de tradução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Permaneçam ligadas” preserva a força aspectual do perfeito sem produzir uma formulação excessivamente literal.
