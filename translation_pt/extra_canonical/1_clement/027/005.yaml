  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: pt
  text: 'Quem lhe dirá: “O que fizeste?” Ou quem resistirá à força do seu poder? Quando quiser e como quiser, ele fará todas as coisas, e nada do que foi decretado por ele passará.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: resistirá
  rationale: Expressa de modo direto a ideia de se opor ou fazer frente, preservando a pergunta retórica.
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: ao poder da sua força
  rationale: Mantém a combinação enfática de κράτος e ἰσχύς sem reduzi-la a um único conceito.
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: do que foi decretado por ele
  rationale: Preserva o sentido de decisões ou determinações estabelecidas por Deus, sem especificar além do grego.
- source_word: παρελθῇ
  choice: deixará de se cumprir
  rationale: No contexto de decretos divinos, comunica naturalmente que nenhum deles falhará ou ficará sem realização; a nota registra a formulação mais literal.
theological_decisions:
- issue: Sentido de παρελθῇ aplicado aos decretos divinos
  choice: deixará de se cumprir
  alternative: passará
  rationale: A escolha explicita o valor contextual de não falhar nem ficar sem efeito, enquanto a alternativa literal poderia sugerir apenas passagem temporal ou desaparecimento.
- issue: Referente dos pronomes masculinos
  choice: Uso de minúsculas para os pronomes referentes a Deus
  alternative: Uso reverencial de maiúsculas
  rationale: O grego não marca capitalização reverencial; a redação portuguesa mantém clareza sem acrescentar uma convenção confessional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “fizeste” para conservar a solenidade da pergunta direta. A sintaxe acompanha de perto o grego, mas a oração final foi formulada de maneira idiomática em português.
