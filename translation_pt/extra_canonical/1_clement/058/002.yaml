revisions:
- from: Aceitem o nosso conselho, e não terão motivo para se arrepender disso. Pois, tão certo como vivem Deus, o Senhor Jesus Messias, o Espírito Santo e a fé e a esperança dos eleitos,[a] aquele que, com humildade e constante brandura, cumprir sem voltar atrás os preceitos justos e os mandamentos dados por Deus será incluído e contado entre os que estão sendo salvos por meio de Jesus Messias. Por meio dele seja dada a Deus[b] a glória para todo o sempre. Amém.
  to: Aceitem o nosso conselho, e não terão de que se arrepender. Pois, tão certo como vivem Deus, o Senhor Jesus Messias, o Espírito Santo e a fé e a esperança dos eleitos,[a] aquele que, com humildade e profunda brandura, cumprir sem arrependimento os preceitos e mandamentos justos dados por Deus será incluído e contado entre os que estão sendo salvos por meio de Jesus Messias. Por meio dele, seja dada a ele a glória para todo o sempre. Amém.
  rationale: A revisão não altera o sentido central. Remove a explicitação de «Deus» na doxologia e conserva, por meio de «dele» e «a ele», a ambiguidade do pronome grego αὐτῷ. Também substitui uma paráfrase potencialmente estreita de ἀμεταμελήτως por «sem arrependimento», preservando o eco vocabular com a frase inicial.
