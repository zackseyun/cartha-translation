reference: 1 Clement 58:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: pt
  text: Aceitem o nosso conselho, e não terão de que se arrepender. Pois, tão certo como vivem Deus, o Senhor Jesus Messias, o Espírito Santo e a fé e a esperança dos eleitos,[a] aquele que, com humildade e profunda brandura, cumprir sem arrependimento os preceitos e mandamentos justos dados por Deus será incluído e contado entre os que estão sendo salvos por meio de Jesus Messias. Por meio dele, seja dada a ele a glória para todo o sempre. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego apresenta o Espírito Santo, a fé e a esperança dos eleitos como continuação da fórmula “vive/vivem”, personificando de modo marcante a fé e a esperança.
    reason: Esclarece uma construção elíptica e retoricamente incomum do original sem apagá-la no texto.
lexical_decisions:
- source_word: συμβουλή
  choice: conselho
  rationale: Equivalente direto e natural para a exortação oferecida pela comunidade remetente.
- source_word: ἀμεταμέλητα / ἀμεταμελήτως
  choice: não terão motivo para se arrepender disso / sem voltar atrás
  rationale: Preserva a repetição sem forçar em português a mesma formulação nos dois contextos; a segunda ocorrência expressa constância no cumprimento.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: constante brandura
  rationale: ἐκτενής comunica intensidade ou perseverança, enquanto ἐπιείκεια denota gentileza, moderação e consideração; a expressão evita reduzir o sentido a mera passividade.
- source_word: δικαιώματα καὶ προστάγματα
  choice: preceitos justos e mandamentos
  rationale: Distingue os requisitos ou estatutos conformes à justiça das ordens explicitamente dadas.
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: incluído e contado
  rationale: 'Mantém os dois aspectos coordenados: ser inscrito ou colocado no grupo e ser computado entre seus membros.'
- source_word: τῶν σῳζομένων
  choice: os que estão sendo salvos
  rationale: Preserva o particípio presente grego e não o converte silenciosamente em estado exclusivamente passado ou futuro.
- source_word: Χριστός
  choice: Messias
  rationale: Representa o título grego em português de modo semanticamente transparente e consistente nas duas ocorrências.
theological_decisions:
- issue: A fé e a esperança dos eleitos na fórmula de juramento
  choice: Tratadas, com o Espírito Santo, como sujeitos do verbo implícito “vivem”
  alternative: Ler ἥ como pronome relativo e traduzir “que são a fé e a esperança”
  rationale: ἥ τε é o artigo feminino ἡ seguido da partícula τε, não um pronome relativo. A construção elíptica acrescenta a fé e a esperança aos elementos invocados, embora a personificação seja incomum.
- issue: Referente de αὐτῷ na doxologia
  choice: Explicitar “a Deus”, com nota sobre a ambiguidade gramatical
  alternative: Manter apenas “a ele” ou entender a referência como Jesus Messias
  rationale: O antecedente discursivo mais provável é Deus, e a fórmula atribui glória a Deus por meio de Jesus Messias; contudo, o pronome grego isolado permite formalmente mais de um referente.
- issue: Caráter da salvação em σῳζομένων
  choice: 'Preservar o aspecto em curso: “estão sendo salvos”'
  alternative: “serão salvos” ou “os salvos”
  rationale: O particípio presente sustenta a formulação processual sem exigir uma sistematização doutrinária da ordem da salvação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e internacionais. A fórmula solene do juramento e a doxologia foram mantidas, assim como a personificação incomum da fé e da esperança. Evitaram-se termos excessivamente técnicos e conclusões confessionais não exigidas pelo grego.
