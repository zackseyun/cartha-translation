review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a exortação, a fórmula solene que inclui a fé e a esperança dos eleitos e o particípio presente em «os que estão sendo salvos». Contudo, explicitar «a Deus» na doxologia resolve indevidamente uma referência pronominal que o grego deixa formalmente aberta. «Sem voltar atrás» também é mais interpretativo que ἀμεταμελήτως; «sem arrependimento» preserva melhor o léxico e a repetição do versículo.
  naturalness: O português é claro, solene e amplamente compreensível. A pequena revisão mantém essa fluência, usando «não terão de que se arrepender» e uma formulação doxológica natural sem nomear o referente de «lhe».
  terminology: «Jesus Messias», «Espírito Santo», «fé», «esperança», «brandura», «mandamentos» e «os que estão sendo salvos» são escolhas adequadas. «Preceitos justos» é aceitável para δικαιώματα, embora «preceitos e mandamentos justos dados por Deus» reflita mais claramente que ambos pertencem ao que foi dado por Deus.
  issues:
  - severity: medium
    issue: O texto explicita «a Deus» como destinatário da glória.
    rationale: Em δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα, αὐτῷ pode ser ligado discursivamente a Deus ou, formalmente, a Jesus Messias. A nota reconhece essa possibilidade, mas o texto principal já eliminou a ambiguidade.
  - severity: low
    issue: «Sem voltar atrás» para ἀμεταμελήτως.
    rationale: A expressão pode sugerir sobretudo perseverança ou não recuo. O advérbio grego significa mais diretamente «sem arrependimento/sem pesar» e ecoa ἀμεταμέλητα na primeira frase.
