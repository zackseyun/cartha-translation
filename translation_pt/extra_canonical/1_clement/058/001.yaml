- from: Submetamo-nos, portanto, ao seu nome santíssimo e glorioso, fugindo das ameaças anteriormente proferidas pela Sabedoria contra os desobedientes, para que habitemos confiando no santíssimo nome da sua majestade.[a]
  to: Submetamo-nos, portanto, ao seu nome santíssimo e glorioso, fugindo das ameaças anteriormente proferidas por meio da sabedoria aos desobedientes, para que habitemos confiando no santíssimo nome da sua majestade.[a]
  rationale: A revisão elimina uma personificação não exigida de σοφία e torna explícita em português a função dativa de τοῖς ἀπειθοῦσιν. Mantêm-se a repetição de «nome», a intensidade de πανάγιος e a confiança regida por ἐπί. A nota foi apenas ajustada para uma expressão portuguesa idiomática do perfeito, sem reintroduzir a leitura redundante de «em segurança».
