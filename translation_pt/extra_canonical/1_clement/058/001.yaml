id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: pt
  text: Submetamo-nos, portanto, ao seu nome santíssimo e glorioso, fugindo das ameaças anteriormente proferidas por meio da sabedoria aos desobedientes, para que habitemos confiando no santíssimo nome da sua majestade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que nos estabeleçamos, tendo depositado nossa confiança no santíssimo nome da sua majestade”.'
    reason: Registra os sentidos possíveis de κατασκηνόω («habitar» ou «estabelecer-se») e a força resultativa do perfeito πεποιθότες, sem duplicá-los no texto principal.
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: Submetamo-nos
  rationale: O aoristo subjuntivo passivo, usado como exortação, pede uma formulação volitiva inclusiva; o reflexivo em português comunica naturalmente a submissão voluntária.
- source_word: πανάγιος
  choice: santíssimo
  rationale: Expressa o valor intensivo de παν- com linguagem portuguesa corrente e digna.
- source_word: φυγόντες
  choice: fugindo
  rationale: Preserva a imagem forte de afastar-se das ameaças, em vez de enfraquecê-la para simples esquiva ou prevenção.
- source_word: διὰ τῆς σοφίας
  choice: pela Sabedoria
  rationale: Mantém a Sabedoria personificada como meio ou agente pelo qual as ameaças foram proferidas, em continuidade com o contexto anterior.
- source_word: κατασκηνώσωμεν
  choice: habitemos
  rationale: O verbo pode significar acampar, estabelecer-se ou habitar; 'habitemos' reproduz bem a ideia duradoura sem impor uma imagem de tenda que talvez não seja central.
- source_word: πεποιθότες ἐπί
  choice: confiando no
  rationale: O particípio perfeito governa a expressão preposicional e indica confiança firmada no nome; esta tradução evita duplicar o sentido com 'em segurança'.
- source_word: μεγαλωσύνη
  choice: majestade
  rationale: Equivalente tradicional e claro para a grandeza exaltada ou majestosa de Deus.
theological_decisions:
- issue: O 'nome' como objeto de submissão e confiança
  choice: Preservar literalmente 'ao seu nome' e 'no ... nome'
  alternative: Explicitar o nome como metonímia de Deus ou de sua autoridade
  rationale: O grego emprega deliberadamente ὄνομα nas duas construções; explicá-lo no corpo do texto reduziria a força e a possível amplitude teológica da expressão.
- issue: Personificação da Sabedoria
  choice: Usar inicial maiúscula em 'Sabedoria'
  alternative: Usar 'sabedoria' como qualidade abstrata
  rationale: O contexto e a construção favorecem a referência à Sabedoria que fala, sem que a tradução identifique dogmaticamente essa figura com uma pessoa específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada à sintaxe natural do português, mantendo as relações do grego e a repetição enfática de 'nome'.
