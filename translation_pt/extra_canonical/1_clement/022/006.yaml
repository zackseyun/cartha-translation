source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: pt
  text: Os olhos do Senhor estão sobre os justos, e seus ouvidos, atentos à súplica deles; mas o rosto do Senhor está contra os que praticam o mal, para apagar da terra a memória deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίους
  choice: os justos
  rationale: Equivalente direto e tradicional, preservando o sentido moral e relacional do termo grego.
- source_word: δέησιν
  choice: súplica
  rationale: Expressa um pedido insistente dirigido a Deus, com mais precisão do que o termo genérico “pedido”.
- source_word: πρόσωπον ... ἐπὶ
  choice: o rosto ... está contra
  rationale: Mantém a imagem antropomórfica e comunica a oposição divina indicada pelo contexto.
- source_word: ποιοῦντας κακά
  choice: os que praticam o mal
  rationale: Reproduz o aspecto ativo e habitual da expressão sem restringi-la a atos específicos.
- source_word: ἐξολεθρεῦσαι
  choice: apagar
  rationale: Transmite a ideia de eliminar por completo, em combinação natural com “memória”.
- source_word: μνημόσυνον
  choice: memória
  rationale: Conserva a referência à lembrança ou memorial deixado pelos malfeitores.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus
  choice: Preservar “olhos”, “ouvidos” e “rosto” literalmente
  alternative: Explicitar como atenção, escuta e oposição do Senhor
  rationale: As imagens pertencem à forma poética da fonte e comunicam teologia sem exigir resolução interpretativa.
- issue: Alcance de “apagar da terra a memória deles”
  choice: Manter a formulação sem explicar o modo ou alcance da eliminação
  alternative: Interpretar como morte, perda de legado ou juízo escatológico
  rationale: O texto não especifica qual dessas dimensões está em vista; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura paralela da frase e suas imagens poéticas foram preservadas; a pontuação foi ajustada para fluência.
