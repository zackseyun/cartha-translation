source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: pt
  text: 'Muitas são as aflições do justo, e de todas elas o Senhor o livrará. Em seguida: “Muitos são os açoites do pecador, mas a misericórdia cercará os que esperam no Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: aflições
  rationale: Expressa de modo natural a ideia de sofrimentos, angústias e adversidades, preservando o tom da citação do salmo.
- source_word: δικαίου
  choice: justo
  rationale: Mantém o sentido moral e religioso do adjetivo substantivado grego no singular.
- source_word: ῥύσεται
  choice: livrará
  rationale: Preserva o sentido de resgatar ou libertar de perigos e aflições.
- source_word: μάστιγες
  choice: açoites
  rationale: Conserva a imagem concreta de golpes ou castigos presente no termo grego, sem reduzi-la a uma abstração.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente tradicional, claro e teologicamente não restritivo para compaixão e favor misericordioso.
- source_word: κυκλώσει
  choice: cercará
  rationale: Reproduz diretamente a metáfora espacial de envolver ou rodear.
- source_word: ἐλπίζοντας ἐπὶ κύριον
  choice: os que esperam no Senhor
  rationale: Construção idiomática corrente em português bíblico que comunica confiança dirigida ao Senhor.
theological_decisions:
- issue: Relação entre as duas orações do primeiro dito
  choice: usar “mas” entre a aflição do justo e o livramento do Senhor
  alternative: usar “e”
  rationale: 'Embora καί seja normalmente aditivo, aqui a relação semântica é contrastiva: o justo sofre muitas aflições, porém o Senhor o livra de todas. “Mas” torna essa relação natural em português sem alterar a proposição.'
- issue: Força de ἐλπίζω ἐπί
  choice: “esperam no Senhor”
  alternative: “confiam no Senhor”
  rationale: “Esperam” conserva mais de perto o campo lexical da esperança, enquanto a preposição e o contexto deixam perceptível a dimensão de confiança.
- issue: Referente singular em “o livrará”
  choice: manter o pronome singular retomando “o justo”
  alternative: pluralizar como formulação genérica
  rationale: O grego emprega δικαίου e αὐτόν no singular; a tradução preserva essa forma representativa sem explicitação adicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Mantém o paralelismo sapiencial e as imagens concretas do grego. “Em seguida” traduz εἶτα como indicação editorial de uma nova citação.
