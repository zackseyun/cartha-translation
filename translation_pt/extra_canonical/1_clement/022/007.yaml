- source_word: εἰσήκουσεν αὐτοῦ
  choice: o ouviu
  rationale: Construção idiomática em português que preserva o sentido de o Senhor atender ao clamor do justo.
- source_word: ἐῤῥύσατο αὐτόν
  choice: o livrou
  rationale: Verbo claro e corrente que comunica resgate ou libertação de perigos e sofrimentos.
- source_word: θλίψεων
  choice: aflições
  rationale: Preserva a amplitude semântica de angústias, tribulações e apertos, em registro digno e acessível.
