  yaml_path: translation/extra_canonical/1_clement/022/003.yaml
  text: Keep your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: pt
  text: Guarde a sua língua do mal[a] e os seus lábios de falar com engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: Refreie a sua língua.'
    reason: παῦσον pode ser expresso mais diretamente como uma ordem para deter ou refrear a língua.
lexical_decisions:
- source_word: παῦσον
  choice: Guarde
  rationale: O imperativo de παύω pede que a língua seja detida ou refreada. “Guarde ... do mal” comunica essa restrição em português natural e preserva a construção concisa do grego.
- source_word: κακοῦ
  choice: mal
  rationale: Mantém a amplitude do substantivo grego, que no contexto pode abranger especialmente a fala má sem se limitar a uma forma específica dela.
- source_word: δόλον
  choice: com engano
  rationale: δόλος designa engano, fraude ou dolo. A locução “falar com engano” é clara e natural, sem restringir o termo apenas à mentira explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura paralela próxima do grego. O possessivo foi mantido nas duas partes para clareza, e “com engano” evita o tom excessivamente jurídico que “dolo” pode ter no uso corrente.
