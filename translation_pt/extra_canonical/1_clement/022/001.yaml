  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: pt
  text: 'Ora, a fé em Cristo[a] confirma todas essas coisas. Pois ele mesmo, por meio do Espírito Santo, nos chama assim: “Venham, filhos, escutem-me; eu lhes ensinarei o temor do Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fé que está em Cristo”.'
    reason: Preserva a nuança possível da construção grega ἐν Χριστῷ, embora “fé em Cristo” seja mais natural em português.
lexical_decisions:
- source_word: βεβαιοῖ
  choice: confirma
  rationale: Expressa o sentido de tornar firme, validar ou corroborar, preservando a afirmação de que a fé dá confirmação ao que foi dito antes.
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: a fé em Cristo
  rationale: É a formulação portuguesa mais natural para a construção grega, sem excluir a nuança de uma fé situada ou vivida em Cristo.
- source_word: προσκαλεῖται ἡμᾶς
  choice: nos chama
  rationale: O verbo no médio indica chamar ou convocar alguém para junto de si; “nos chama” comunica isso de modo natural e direto.
- source_word: φόβον κυρίου
  choice: o temor do Senhor
  rationale: “Temor” conserva a amplitude religiosa do grego, que pode envolver reverência, respeito e medo, sem reduzir a expressão a apenas uma dessas ideias.
theological_decisions:
- issue: Sentido de ἡ ἐν Χριστῷ πίστις
  choice: a fé em Cristo
  alternative: a fé que está em Cristo
  rationale: A tradução principal segue o uso idiomático mais provável, enquanto a nota preserva a possibilidade de entender ἐν Χριστῷ como caracterização da fé que existe ou se encontra em Cristo.
- issue: Cristo falando por meio do Espírito Santo nas Escrituras
  choice: “ele mesmo” permanece sem explicitação adicional
  alternative: “o próprio Cristo”
  rationale: O referente é Cristo no contexto imediato, mas explicitar o nome dentro da segunda frase iria além da forma do grego; o pronome preserva a estrutura e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de ampla compreensão. A citação mantém o tom de convite e ensino do Salmo 34:11 na tradição grega.
