lexical_decisions:
- source_word: προτρέπεται
  choice: exorta
  rationale: Expressa naturalmente o sentido de incentivar ou instar alguém a agir, preservando o tom de apelo moral.
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: a nós que cremos nele de todo o coração
  rationale: Mantém o particípio ligado a ἡμᾶς e traduz a confiança dirigida a ele em português corrente.
- source_word: ἀργοὺς μηδὲ παρειμένους
  choice: ociosos nem negligentes
  rationale: ἀργός indica inatividade; παρειμένος, neste contexto, sugere frouxidão, desleixo ou falta de empenho. A dupla escolhida é clara e digna.
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: em toda boa obra
  rationale: Preserva o valor distributivo de πᾶν e a formulação tradicional e compreensível de ἔργον ἀγαθόν.
