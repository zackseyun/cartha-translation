source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: pt
  text: 'Pois ele diz: “Olho nenhum viu, ouvido nenhum ouviu, nem chegou ao coração humano[a] aquilo que ele preparou para os que esperam por ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nem subiu ao coração de um ser humano”.
    reason: Registra a forma concreta do idioma semítico representado pelo grego ἀνέβη ἐπὶ καρδίαν, cuja tradução idiomática no texto é ‘chegou ao coração humano’.
lexical_decisions:
- source_word: Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν
  choice: Olho nenhum viu, ouvido nenhum ouviu
  rationale: Reproduz o paralelismo enfático do grego em português natural, mantendo os substantivos genéricos no singular.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: nem chegou ao coração humano
  rationale: Expressa naturalmente o idioma semítico ‘subir ao coração’, isto é, chegar ao íntimo ou ao pensamento, sem restringi-lo apenas à atividade intelectual.
- source_word: ὅσα ἡτοίμασεν
  choice: aquilo que ele preparou
  rationale: O pronome neutro plural ὅσα abrange coletivamente todas as coisas preparadas; ‘aquilo que’ conserva esse sentido de modo idiomático.
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: para os que esperam por ele
  rationale: Neste eco de Isaías, ὑπομένω comunica espera perseverante; ‘esperam por ele’ preserva tanto a expectativa quanto a constância sem acrescentar uma explicação interpretativa.
theological_decisions:
- issue: Sujeito de λέγει e ἡτοίμασεν
  choice: ele diz / ele preparou
  alternative: diz / preparou
  rationale: O contexto anterior fornece como sujeito o Criador e Pai; o pronome masculino mantém a continuidade do discurso sem inserir um nome divino ausente no grego.
- issue: Sentido de ὑπομένουσιν
  choice: os que esperam por ele
  alternative: os que perseveram por causa dele
  rationale: A construção com objeto pessoal e o pano de fundo de Isaías favorecem a espera confiante e perseverante, enquanto a alternativa poderia sugerir sofrimento por causa dele, ideia não explicitada aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo solene da citação foi preservado sem recorrer a formulações arcaicas.
