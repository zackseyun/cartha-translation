  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: pt
  text: 'Pois ele nos diz de antemão: “Eis o Senhor, e a sua recompensa está diante dele, para retribuir a cada um conforme a sua obra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  choice: diz de antemão
  rationale: Preserva o sentido básico de falar antecipadamente, sem acrescentar necessariamente a nuance de advertência.
- source_word: μισθὸς
  choice: recompensa
  rationale: Neste contexto de retribuição segundo a obra de cada um, expressa de modo natural o pagamento ou galardão devido.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: diante dele
  rationale: Equivalente português natural para a expressão literalmente ligada à presença ou face do Senhor.
- source_word: ἀποδοῦναι
  choice: retribuir
  rationale: Comunica devolver ou dar a cada pessoa o que corresponde às suas ações.
- source_word: κατὰ τὸ ἔργον αὐτοῦ
  choice: conforme a sua obra
  rationale: Mantém o singular do grego e a formulação solene da declaração citada.
theological_decisions:
- issue: Caráter da retribuição
  choice: recompensa ... retribuir
  alternative: salário ... pagar
  rationale: A tradução conserva a amplitude do grego, que pode abranger retribuição favorável ou judicial, sem restringir o texto a remuneração material.
translation_notes:
  register: Português moderno, claro e solene, com estrutura próxima do grego. Evitou-se “adverte” para não tornar explícita uma nuance apenas possível em προλέγει.
