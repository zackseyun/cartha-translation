revisions:
- from: Que o nosso orgulho e a nossa confiança estejam nele. Sujeitemo-nos à sua vontade. Consideremos toda a multidão dos seus anjos e como, estando diante dele, servem à sua vontade.
  to: Que a nossa glória e a nossa ousadia estejam nele. Sujeitemo-nos à sua vontade. Consideremos toda a multidão dos seus anjos e como, estando diante dele, servem à sua vontade.
  rationale: 'A revisão corrige duas escolhas lexicais que podem deslocar o sentido do grego: καύχημα é vertido por «glória», em vez de um termo que costumeiramente denota soberba, e παρρησία por «ousadia», preservando a força de boldness. O restante do texto mantém fielmente as exortações, a submissão à vontade divina e a imagem dos anjos presentes diante dele enquanto servem à sua vontade.'
