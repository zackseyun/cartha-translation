id: 1CLEM.34.5
reference: 1 Clement 34:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: pt
  text: Que a nossa glória e a nossa ousadia estejam nele. Sujeitemo-nos à sua vontade. Consideremos toda a multidão dos seus anjos e como, estando diante dele, servem à sua vontade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχημα
  choice: orgulho
  rationale: Expressa aquilo de que alguém se gloria, aqui qualificado por estar “nele”; a formulação natural preserva a força positiva contextual do termo.
- source_word: παρρησία
  choice: confiança
  rationale: Neste contexto, indica segurança ou ousadia franca; “confiança” é clara em português e combina naturalmente com “estar nele”.
- source_word: ὑποτασσώμεθα
  choice: Sujeitemo-nos
  rationale: Mantém a força exortativa e o sentido de colocar-se voluntariamente sob a vontade de Deus.
- source_word: κατανοήσωμεν
  choice: Consideremos
  rationale: Transmite o chamado a observar e refletir atentamente.
- source_word: λειτουργοῦσιν
  choice: servem
  rationale: O verbo denota serviço ou ministério realizado pelos anjos; “servem” é natural e não impõe uma conotação litúrgica excessivamente específica.
- source_word: παρεστῶτες
  choice: estando diante dele
  rationale: O particípio indica que os anjos estão presentes ou postados diante de Deus enquanto servem; o complemento “dele” fica implícito no grego pelo contexto.
theological_decisions:
- issue: Sentido positivo de καύχημα em relação a Deus
  choice: “o nosso orgulho ... esteja nele”
  alternative: “a nossa glória ... esteja nele”
  rationale: “Orgulho” preserva mais diretamente a ideia de gloriar-se, mas sua qualificação explícita — “nele” — evita entendê-lo como arrogância autônoma.
- issue: Relação dos anjos com a vontade divina
  choice: “servem à sua vontade”
  alternative: “cumprem a sua vontade”
  rationale: A construção grega liga λειτουργοῦσιν ao dativo τῷ θελήματι; a tradução mantém essa formulação incomum e a tensão do original, em vez de substituí-la pela ideia interpretativa de simplesmente cumprir ordens.
translation_notes:
  register: Português moderno, digno e acessível, com exortações na primeira pessoa do plural. A sintaxe foi levemente reorganizada no último período para soar natural sem perder o particípio circunstancial grego.
