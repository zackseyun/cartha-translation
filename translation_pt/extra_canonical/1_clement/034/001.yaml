source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἀγαθὸς ἐργάτης μετὰ παρρησίας λαμβάνει τὸν ἄρτον τοῦ ἔργου αὐτοῦ, ὁ νωθρὸς καὶ παρειμένος οὐκ ἀντοφθαλμεῖ τῷ ἐργοδότῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: pt
  text: O bom trabalhador recebe com confiança o pão do seu trabalho, mas o preguiçoso e negligente não consegue encarar o seu empregador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἐργάτης
  choice: bom trabalhador
  rationale: Reproduz diretamente a expressão grega em linguagem natural e digna.
- source_word: μετὰ παρρησίας
  choice: com confiança
  rationale: Neste contexto, παρρησία indica segurança ou franqueza diante de quem remunera; «com confiança» preserva o sentido sem sugerir insolência.
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: o pão do seu trabalho
  rationale: Mantém a imagem concreta do grego, em vez de substituí-la por «salário» ou «sustento».
- source_word: νωθρὸς καὶ παρειμένος
  choice: preguiçoso e negligente
  rationale: Expressa tanto a indolência de νωθρός quanto a falta de empenho ou o relaxamento de παρειμένος.
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: não consegue encarar
  rationale: Traduz de modo idiomático a ideia literal de olhar alguém diretamente nos olhos, preservando a vergonha ou falta de segurança implícita.
- source_word: ἐργοδότῃ
  choice: empregador
  rationale: É o equivalente moderno mais claro para aquele que fornece ou atribui o trabalho.
theological_decisions: []
