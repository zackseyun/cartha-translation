id: 1CLEM.34.7
reference: 1 Clement 34:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: pt
  text: Portanto, também nós, todos reunidos em concórdia e com uma só consciência, clamemos a ele fervorosamente, como de uma só boca, para que nos tornemos participantes de suas grandes e gloriosas promessas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁμονοίᾳ
  choice: em concórdia
  rationale: Preserva a ideia de harmonia e unanimidade comunitária em linguagem digna e corrente.
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: reunidos
  rationale: A expressão indica reunião conjunta; a forma concisa evita a redundância de 'reunidos juntos' e não acrescenta indevidamente uma localização.
- source_word: τῇ συνειδήσει
  choice: com um só pensamento
  rationale: Neste contexto coletivo, συνείδησις aponta para uma disposição ou consciência compartilhada; esta formulação é natural em português e mantém o sentido de unidade interior.
- source_word: βοήσωμεν ... ἐκτενῶς
  choice: clamemos ... fervorosamente
  rationale: βοάω pede uma expressão vocal forte, enquanto ἐκτενῶς comunica intensidade e empenho persistente.
- source_word: μετόχους
  choice: participantes
  rationale: Expressa participação efetiva nas promessas sem introduzir uma formulação confessional específica.
theological_decisions:
- issue: Força da oração final εἰς τὸ ... γενέσθαι
  choice: para que nos tornemos participantes
  alternative: a fim de nos tornarmos participantes
  rationale: Mantém a finalidade expressa pelo grego e também deixa intacta a relação teológica entre o clamor comunitário e a participação nas promessas, sem explicar seu mecanismo.
- issue: Referente de αὐτόν e αὐτοῦ
  choice: a ele / suas
  alternative: a Deus / de Deus
  rationale: O grego emprega pronomes, e a tradução os preserva para não explicitar além do texto imediato fornecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a imagem enfática de uma comunidade que clama 'como de uma só boca'.
