source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: pt
  text: 'Pois a Escritura diz: “Miríades de miríades estavam diante dele, e milhares de milhares o serviam”, e clamavam: “Santo, santo, santo é o Senhor dos Exércitos; toda a criação está cheia da sua glória.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μύριαι μυριάδες
  choice: Miríades de miríades
  rationale: Reproduz diretamente a expressão grega de multidão incontável e preserva seu paralelismo solene.
- source_word: παρειστήκεισαν αὐτῷ
  choice: estavam diante dele
  rationale: Expressa a posição de comparecer ou permanecer perante alguém, adequada à cena da corte celestial.
- source_word: ἐλειτούργουν αὐτῷ
  choice: o serviam
  rationale: Comunica em português corrente o serviço prestado a Deus, sem restringir indevidamente o termo a um sentido ritual técnico.
- source_word: κύριος σαβαώθ
  choice: Senhor dos Exércitos
  rationale: Traduz o título semítico transliterado pelo grego em sua forma bíblica portuguesa amplamente reconhecida.
- source_word: πᾶσα ἡ κτίσις
  choice: toda a criação
  rationale: Mantém o alcance abrangente de κτίσις e a formulação distinta da versão de Isaías que fala da terra.
theological_decisions:
- issue: Sentido do título σαβαώθ
  choice: Senhor dos Exércitos
  alternative: Senhor Sabaote
  rationale: A tradução comunica o significado do título ao leitor moderno, sem introduzir uma interpretação denominacional.
- issue: Natureza do serviço celestial em ἐλειτούργουν
  choice: o serviam
  alternative: ministravam diante dele
  rationale: A formulação ampla preserva a referência ao serviço celestial sem decidir se o autor pretende um sentido especificamente litúrgico.
translation_notes:
  register: Português moderno, solene e acessível, com cadência apropriada a uma citação escriturística. Mantém as repetições enfáticas do grego.
