  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: pt
  text: Portanto, devemos estar dispostos a praticar o bem, pois todas as coisas vêm dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθύμους
  choice: dispostos
  rationale: Expressa prontidão e boa vontade de modo natural em português, sem reduzir o termo apenas a entusiasmo emocional.
- source_word: ἀγαθοποιΐαν
  choice: praticar o bem
  rationale: Verbaliza naturalmente o substantivo grego que indica a prática de boas ações.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: Preserva a referência pronominal do grego e a ideia de origem expressa por ἐξ.
theological_decisions:
- issue: Origem de todas as coisas
  choice: todas as coisas vêm dele
  alternative: todas as coisas são dele
  rationale: A preposição ἐξ indica mais diretamente procedência ou origem; a tradução evita substituir essa afirmação por uma formulação de posse.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe direta. A formulação preserva a relação causal entre a disposição para fazer o bem e a afirmação de que tudo procede de Deus.
