  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: pt
  text: 'Pois está escrito: “Apeguem-se aos santos, porque os que se apegam a eles serão santificados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾶσθε / κολλώμενοι
  choice: apeguem-se / os que se apegam
  rationale: Expressa de modo natural e digno a ideia de ligação estreita e perseverante, preservando a repetição do verbo grego.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Mantém o substantivo plural masculino do grego, que aqui se refere a pessoas santas, sem explicitar uma identidade que o texto não especifica.
- source_word: ἁγιασθήσονται
  choice: serão santificados
  rationale: Preserva a voz passiva e a relação lexical com ἁγίοις, sem identificar expressamente o agente.
theological_decisions:
- issue: Identidade de οἱ ἅγιοι e natureza da santificação prometida
  choice: “os santos” e “serão santificados”
  alternative: “as pessoas santas” e “se tornarão santas”
  rationale: A tradução escolhida conserva a formulação religiosa tradicional, a ligação verbal entre “santos” e “santificados” e a passividade teológica do original, sem resolver quem são os santos nem como ocorre a santificação.
translation_notes:
  register: Português moderno, claro e solene, com imperativo plural inclusivo e repetição deliberada de “apegar-se” para refletir o paralelismo grego.
