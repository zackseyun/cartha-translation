base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: pt
  text: A divisão entre vocês desviou muitos, lançou muitos no desânimo, muitos na dúvida e a todos nós na tristeza; e a discórdia entre vocês persiste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: divisão
  rationale: Expressa uma ruptura no corpo comunitário em português claro e atual, sem limitar o sentido a um cisma formal ou institucional.
- source_word: διέστρεψεν
  choice: desviou
  rationale: Preserva a ideia de fazer pessoas se afastarem ou tomarem um rumo errado, adequada ao contexto moral e comunitário.
- source_word: ἀθυμίαν
  choice: desânimo
  rationale: Comunica a perda de ânimo ou coragem indicada pelo termo grego.
- source_word: δισταγμόν
  choice: dúvida
  rationale: Reproduz de modo natural a hesitação ou incerteza do original.
- source_word: στάσις
  choice: discórdia
  rationale: Neste contexto, designa conflito faccioso ou contenda interna; “discórdia” é natural e mantém o caráter comunitário do conflito.
- source_word: ἐπίμονος
  choice: persiste
  rationale: Vertido em conjunto com ἐστίν como predicado verbal natural, preservando a continuidade obstinada da discórdia.
theological_decisions:
- issue: Natureza do σχίσμα e da στάσις
  choice: “divisão” e “discórdia”
  alternative: “cisma” e “luta facciosa”
  rationale: A escolha evita impor uma noção técnica posterior de cisma e comunica claramente tanto a ruptura quanto o conflito interno, sem suavizar a censura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com repetição de “muitos” preservada para manter a força retórica do grego. “Entre vocês” esclarece o valor do genitivo ὑμῶν de maneira natural.
