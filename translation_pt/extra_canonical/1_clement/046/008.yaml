base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: pt
  text: 'Pois ele disse[a]: “Ai daquele homem! Seria bom para ele não ter nascido, em vez de fazer tropeçar um dos meus escolhidos. Seria melhor para ele que lhe pusessem uma pedra de moinho em volta e que fosse afundado no mar, do que desviar um dos meus escolhidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vez de que ele fizesse tropeçar um dos meus escolhidos. Seria melhor para ele que lhe pusessem uma pedra de moinho em volta e que fosse afundado no mar, do que que ele desviasse um dos meus escolhidos.”'
    reason: Preserva, em português, a nota do audit trail inglês sobre uma forma mais explícita de expressar a relação dos infinitivos gregos com a comparação.
lexical_decisions:
- source_word: σκανδαλίσαι
  choice: fazer tropeçar
  rationale: Preserva a imagem metafórica do verbo grego e seu sentido de levar alguém à queda ou ao pecado, em linguagem bíblica compreensível.
- source_word: ἐκλεκτῶν
  choice: escolhidos
  rationale: Equivalente direto e natural para os que foram escolhidos, sem acrescentar uma interpretação denominacional.
- source_word: μύλον
  choice: pedra de moinho
  rationale: O substantivo pode designar a pedra de moinho; esta formulação comunica claramente o objeto pesado pressuposto pelo contexto.
- source_word: καταποντισθῆναι
  choice: fosse afundado no mar
  rationale: Expressa o sentido passivo de ser submerso ou lançado às profundezas do mar.
- source_word: διαστρέψαι
  choice: desviar
  rationale: Reproduz o sentido de fazer alguém sair do caminho ou desencaminhá-lo, sem igualá-lo completamente ao verbo anterior.
theological_decisions:
- issue: Identidade dos “escolhidos”
  choice: meus escolhidos
  alternative: meus eleitos
  rationale: “Escolhidos” traduz ἐκλεκτῶν de modo claro e menos marcado por terminologia teológica sistemática, preservando a fala em primeira pessoa.
- issue: Relação sintática de ἢ com a declaração precedente
  choice: “em vez de fazer tropeçar”
  alternative: “do que fazer tropeçar” ou leitura que liga a expressão diretamente a “não ter nascido”
  rationale: A sequência grega é comprimida e algo irregular; a redação mantém a comparação do texto sem tentar reconstruir ou harmonizar sua forma com um paralelo canônico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo entre σκανδαλίσαι e διαστρέψαι por meio de verbos distintos (“fazer tropeçar” e “desviar”) e evita explicitar quem coloca a pedra ou executa o afogamento, acompanhando os passivos gregos.
