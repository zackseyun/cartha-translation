reference: 1 Clement 46:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: pt
  text: 'Por que puxamos para lados opostos e dilaceramos[a] os membros do Messias, nos rebelamos contra o nosso próprio corpo e chegamos a tal loucura que nos esquecemos de que somos membros uns dos outros?


    Lembrem-se das palavras de Jesus, nosso Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «separamos à força e despedaçamos».'
    reason: Registra uma formulação alternativa para a sequência enfática dos verbos gregos διέλκωμεν e διασπῶμεν.
lexical_decisions:
- source_word: διέλκωμεν καὶ διασπῶμεν
  choice: separamos à força e dilaceramos
  rationale: 'Preserva a progressão dos dois verbos: διέλκω sugere puxar ou separar, enquanto διασπάω intensifica a imagem com a ideia violenta de rasgar ou dilacerar.'
- source_word: τὰ μέλη τοῦ Χριστοῦ
  choice: os membros do Messias
  rationale: Mantém a metáfora corporal de μέλη e verte Χριστός pelo título «Messias», sem transformar o título em nome próprio.
- source_word: στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον
  choice: nos rebelamos contra o nosso próprio corpo
  rationale: στασιάζω expressa sedição, revolta ou facção; «nos rebelamos» comunica essa força com naturalidade.
- source_word: εἰς τοσαύτην ἀπόνοιαν
  choice: a tal loucura
  rationale: ἀπόνοια denota insensatez extrema ou desvario; «loucura» é clara e conserva a censura enfática.
- source_word: μνήσθητε
  choice: Lembrem-se
  rationale: Reproduz o imperativo aoristo plural de modo corrente e direto em português brasileiro legível internacionalmente.
theological_decisions:
- issue: Sentido corporativo de «membros do Messias» e «membros uns dos outros»
  choice: Manter literalmente ambas as imagens corporais
  alternative: Explicitar «membros da comunidade/igreja»
  rationale: O grego sustenta deliberadamente a tensão entre o corpo do Messias, o «nosso próprio corpo» e a pertença recíproca; uma explicação denominacional estreitaria a metáfora.
- issue: Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: «Messias» torna explícito o valor titular de Χριστός e segue a política indicada pela camada auditada, sem alterar a referência.
translation_notes:
  register: Português atual, digno e direto, com legibilidade brasileira. A longa pergunta retórica foi preservada, bem como a passagem abrupta para o imperativo final.
