  text: κολληθῶμεν οὖν τοῖς ἀθῴοις καὶ δικαίοις· εἰσὶν δὲ οὗτοι ἐκλεκτοὶ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
translation:
  language: pt
  text: Portanto, unamo-nos aos inocentes e justos, pois estes são os escolhidos de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: unamo-nos
  rationale: O aoristo subjuntivo exortativo pede uma convocação coletiva. “Unamo-nos” comunica adesão estreita e solidariedade de modo natural em português.
- source_word: ἀθῴοις
  choice: irrepreensíveis
  rationale: Neste contexto, designa pessoas inocentes, sem culpa ou censura. “Irrepreensíveis” preserva o sentido moral e combina naturalmente com “justos”.
- source_word: δικαίοις
  choice: justos
  rationale: Equivalente direto e corrente para o adjetivo substantivado, com seu sentido ético-religioso.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: os escolhidos de Deus
  rationale: Preserva a construção genitiva e a linguagem de eleição sem acrescentar uma definição denominacional.
theological_decisions:
- issue: Relação entre os irrepreensíveis e justos e os escolhidos de Deus
  choice: “pois estes são”
  alternative: “e estes são”
  rationale: A partícula δέ pode ser continuativa ou levemente explicativa. “Pois estes são” apresenta a segunda oração como identificação ou fundamento da exortação, conforme o fluxo do texto, sem alterar quem é referido.
translation_notes:
  register: Português moderno, digno e acessível. A colocação pronominal em “unamo-nos” preserva o tom exortativo formal sem soar arcaica. Não há marcadores de nota porque nenhuma nota foi julgada necessária para a edição portuguesa.
