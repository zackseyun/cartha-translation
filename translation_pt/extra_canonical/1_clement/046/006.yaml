id: 1CLEM.46.6
reference: 1 Clement 46:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: pt
  text: Ou não temos um só Deus, um só Messias, um só Espírito da graça derramado sobre nós e uma só vocação no Messias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego, “uma só vocação” aparece no nominativo, numa mudança de construção após os termos regidos por “temos”. Também se pode entender: “e não há uma só vocação no Messias?”'
    reason: Preservar a irregularidade sintática e a possibilidade de ler a última afirmação como uma cláusula correlata, sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: Χριστόν / Χριστῷ
  choice: Messias / no Messias
  rationale: Traduz o título grego Χριστός pelo seu sentido, “Messias”, mantendo a mesma designação nas duas ocorrências.
- source_word: πνεῦμα τῆς χάριτος
  choice: Espírito da graça
  rationale: Preserva a construção genitiva e sua abertura sem definir se a graça caracteriza, procede ou é comunicada pelo Espírito.
- source_word: κλῆσις
  choice: vocação
  rationale: Expressa o chamado divino com linguagem corrente e digna; “chamado” também seria possível, mas “vocação” funciona melhor nesta série nominal.
- source_word: ἐκχυθὲν ἐφ’ ἡμᾶς
  choice: derramado sobre nós
  rationale: Mantém a imagem concreta de derramamento e faz o particípio concordar naturalmente com “Espírito”.
theological_decisions:
- issue: Relação entre o Espírito, a graça e o derramamento
  choice: “um só Espírito da graça derramado sobre nós”
  alternative: “um só espírito da graça, derramado sobre nós”
  rationale: A capitalização indica a referência provável ao Espírito divino no contexto da tríade, sem acrescentar uma identificação doutrinária além do texto; a ausência de vírgula mantém o particípio estreitamente ligado ao Espírito.
- issue: Quebra sintática na expressão final
  choice: Integrar “uma só vocação no Messias” à pergunta, com nota
  alternative: “e não há uma só vocação no Messias?”
  rationale: O grego muda dos acusativos regidos por “temos” para o nominativo μία κλῆσις. A tradução principal conserva a série retórica com naturalidade, enquanto a nota registra a construção irregular sem inserir no texto um novo verbo não expresso.
translation_notes:
  register: Português moderno, claro e solene, com repetição de “um só/uma só” para reproduzir a ênfase retórica na unidade. “Messias” é empregado como título em ambas as ocorrências de Χριστός.
