  yaml_path: translation/extra_canonical/1_clement/046/003.yaml
  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: pt
  text: 'E novamente, em outro lugar, ele diz: “Com um homem inocente, você será inocente; com um eleito, será eleito; e com um perverso, você se perverterá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῴου / ἀθῷος
  choice: inocente / inocente
  rationale: Preserva a repetição deliberada do grego e o sentido de alguém sem culpa ou irrepreensível.
- source_word: ἐκλεκτοῦ / ἐκλεκτός
  choice: eleito / eleito
  rationale: Mantém a correspondência lexical e a repetição do original; o artigo indefinido evita transformar a expressão genérica em título específico.
- source_word: στρεβλοῦ / διαστρέψεις
  choice: perverso / você se perverterá
  rationale: Reproduz, de modo natural em português, o jogo entre a pessoa moralmente tortuosa e o efeito correspondente sobre quem se associa a ela.
- source_word: λέγει
  choice: ele diz
  rationale: O sujeito implícito é mantido sem identificação adicional, preservando a formulação da fonte.
theological_decisions:
- issue: Possível leitura titular ou messiânica de ἐκλεκτός
  choice: um eleito
  alternative: o Eleito
  rationale: Os termos são anartros e formam uma série proverbial genérica; a tradução indefinida não introduz uma referência cristológica não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. Empregou-se “você” para a segunda pessoa singular genérica, favorecendo ampla legibilidade brasileira sem alterar o sentido.
