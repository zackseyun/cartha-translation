  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: pt
  text: para que nos comuniquem quanto antes a paz e a concórdia pelas quais temos orado e que tanto desejamos[a], a fim de que nós também possamos nos alegrar mais depressa com a boa ordem de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a paz e a concórdia que pedimos em oração e desejamos ardentemente”.'
    reason: Preserva uma construção adjetival mais compacta para εὐκταίαν καὶ ἐπιπόθητον, mantendo o sentido de algo pedido em oração e intensamente desejado.
lexical_decisions:
- source_word: θᾶττον / τάχιον
  choice: quanto antes / mais depressa
  rationale: Preserva as duas expressões comparativas de rapidez sem produzir repetição excessivamente rígida em português.
- source_word: εὐκταίαν καὶ ἐπιπόθητον
  choice: pelas quais temos orado e que tanto desejamos
  rationale: 'Expressa os dois qualificativos da paz e da concórdia: aquilo que é objeto de oração e aquilo que é intensamente desejado.'
- source_word: εἰρήνην καὶ ὁμόνοιαν
  choice: paz e concórdia
  rationale: Equivalentes naturais e tradicionais que mantêm a distinção entre paz e harmonia de propósito.
- source_word: ἀπαγγέλλωσιν
  choice: tragam ... a notícia
  rationale: Verte o sentido de comunicar ou dar notícia, adequado aos mensageiros mencionados no contexto.
- source_word: εὐσταθείας
  choice: boa ordem
  rationale: No contexto comunitário, designa uma condição estável, ordeira e saudável; evita reduzir o termo apenas a 'estabilidade' abstrata.
theological_decisions:
- issue: Relação de εὐκταίαν καὶ ἐπιπόθητον com a paz e a concórdia
  choice: pelas quais temos orado e que tanto desejamos
  alternative: a paz e a concórdia tão esperadas e desejadas por nós
  rationale: A formulação principal explicita naturalmente em português que ambas são objeto de oração e desejo, sem acrescentar conteúdo doutrinário; a nota preserva a possível leitura adjetival mais compacta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Entre vocês” torna explícito o âmbito comunitário de “boa ordem” sem impor uma interpretação denominacional.
