  text: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα σὺν καὶ Φορτουνάτῳ ἐν εἰρήνῃ μετὰ χαρᾶς ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: pt
  text: Mandem-nos de volta, sem demora, em paz e com alegria, os enviados por nós — Cláudio Efebo e Valério Bitão, juntamente com Fortunato —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπέμψατε
  choice: Mandem de volta
  rationale: O imperativo plural indica o envio de retorno à comunidade de origem; a formulação é natural e preserva a força do mandamento.
- source_word: ἐν τάχει
  choice: sem demora
  rationale: Expressa urgência em português corrente, sem sugerir necessariamente velocidade física.
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: em paz e com alegria
  rationale: Mantém a coordenação e as imagens do grego com formulação direta e digna.
- source_word: τοὺς ... ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: os que enviamos
  rationale: Transmite de modo natural a ideia dos homens enviados pela comunidade remetente, sem acrescentar uma identificação ausente do grego.
- source_word: σὺν καὶ Φορτουνάτῳ
  choice: juntamente com Fortunato
  rationale: Preserva a inclusão destacada de Fortunato ao lado dos dois nomes anteriores.
