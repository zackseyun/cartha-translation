source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: pt
  text: 'E Deus disse a Caim: “Por que você ficou triste, e por que o seu rosto se abateu? Se você oferecer corretamente, mas não dividir corretamente, não pecou?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase “mas não dividir corretamente” segue a redação grega citada aqui. Seu sentido exato é incerto; também pode ser entendida como “não repartir corretamente” ou “não distinguir corretamente”.
    reason: A expressão ὀρθῶς δὲ μὴ διέλῃς é incomum e admite mais de uma interpretação; a nota preserva essa ambiguidade sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: περίλυπος
  choice: triste
  rationale: Expressa de modo natural e sóbrio o estado de pesar, sem acrescentar uma intensidade que o contexto não exige.
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: o seu rosto se abateu
  rationale: Conserva a imagem idiomática do rosto caído, em português claro e digno.
- source_word: προσενέγκῃς
  choice: oferece
  rationale: Mantém o sentido cultual de apresentar uma oferta, evidente no contexto de Caim.
- source_word: διέλῃς
  choice: reparte
  rationale: Preserva o sentido básico de dividir ou repartir, sem substituir a formulação peculiar da tradição grega por uma interpretação específica.
- source_word: ἥμαρτες
  choice: pecou
  rationale: Traduz diretamente o aoristo de ἁμαρτάνω dentro da pergunta retórica.
theological_decisions:
- issue: Sentido de ὀρθῶς δὲ μὴ διέλῃς
  choice: mas não reparte corretamente
  alternative: mas não distingue corretamente / mas não distribui corretamente
  rationale: A redação mantém a tensão e a ambiguidade da forma grega, tradicionalmente ligada à versão grega de Gênesis 4:7, sem decidir se se trata de repartir a oferta, distribuí-la ou fazer uma distinção ritual adequada.
- issue: Forma interrogativa de οὐκ ... ἥμαρτες;
  choice: não pecou?
  alternative: você pecou
  rationale: Preserva a pergunta retórica do texto grego, em vez de convertê-la numa afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “você” por naturalidade ampla no português do Brasil, sem coloquialismo excessivo. A estrutura paralela e a imagem do rosto abatido foram preservadas.
