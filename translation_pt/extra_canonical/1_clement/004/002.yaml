base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: pt
  text: E Deus voltou seu olhar para Abel e para as suas ofertas, mas não deu atenção a Caim nem aos seus sacrifícios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν ... ἐπί
  choice: voltou seu olhar para
  rationale: Expressa de modo natural e digno o sentido contextual de olhar com consideração ou favor, sem reduzir o verbo a uma simples percepção visual.
- source_word: δῶρα
  choice: ofertas
  rationale: No contexto cultual, traduz naturalmente os presentes levados a Deus e mantém a distinção lexical em relação a θυσίαις.
- source_word: θυσίαις
  choice: sacrifícios
  rationale: Equivalente direto do termo cultual grego.
- source_word: οὐ προσέσχεν
  choice: não deu atenção
  rationale: Reproduz a ideia de não atentar, não considerar ou não acolher favoravelmente, em português atual e claro.
theological_decisions:
- issue: A natureza do olhar de Deus para Abel
  choice: voltou seu olhar para
  alternative: olhou para
  rationale: A formulação sugere consideração favorável, como exige o contraste, sem explicitar além do grego conceitos como aceitação ou aprovação.
- issue: Paralelismo das preposições com Caim e seus sacrifícios
  choice: não deu atenção a Caim nem aos seus sacrifícios
  alternative: mas, para Caim e para os seus sacrifícios, não voltou seu olhar
  rationale: A escolha preserva ambos como objetos da falta de consideração divina e produz português natural, sem eliminar o contraste entre os dois verbos gregos.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. A distinção entre ofertas e sacrifícios segue a variação lexical do grego; não se acrescenta uma explicação para a diferença de tratamento.
