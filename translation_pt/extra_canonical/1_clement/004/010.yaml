source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: pt
  text: 'A inveja obrigou Moisés a fugir da presença do faraó, rei do Egito, quando ouviu um homem de seu próprio povo dizer: “Quem constituiu você juiz ou magistrado sobre nós? Será que você quer me matar, assim como matou ontem o egípcio?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: inveja
  rationale: No contexto da enumeração de exemplos em 1 Clemente, o termo designa inveja ou ciúme hostil; “inveja” é a forma mais natural e clara em português.
- source_word: ἀπὸ προσώπου
  choice: da presença
  rationale: Conserva o sentido idiomático de afastar-se de diante de uma autoridade, sem o literalismo pouco natural “da face”.
- source_word: ὁμοφύλου
  choice: um homem de seu próprio povo
  rationale: Expressa a ideia de alguém da mesma comunidade étnica sem recorrer ao menos corrente “da mesma tribo”.
- source_word: κριτὴν ἢ δικαστὴν
  choice: juiz ou magistrado
  rationale: Mantém os dois termos jurídicos distintos empregados por Clemente, sem harmonizar a citação com a redação conhecida de Êxodo 2:14.
- source_word: μὴ ἀνελεῖν με σὺ θέλεις
  choice: Será que você quer me matar
  rationale: Reproduz de modo natural a pergunta grega, cuja partícula sugere expectativa de resposta negativa, sem tornar essa expectativa excessivamente explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” na fala direta e sintaxe natural. A redação segue a forma específica da citação em Clemente, em vez de harmonizá-la com a Septuaginta.
