  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/009.yaml
  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
translation:
  language: pt
  text: A inveja fez com que José fosse perseguido a ponto de morrer e entrasse na escravidão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: inveja
  rationale: No contexto de 1 Clemente 4, o termo designa a inveja ou rivalidade hostil que motivou o tratamento dado a José; “inveja” é a forma mais natural e precisa em português.
- source_word: μέχρι θανάτου
  choice: até ficar à beira da morte
  rationale: μέχρι indica o limite ou grau alcançado. A formulação preserva a gravidade da perseguição sem afirmar que José de fato morreu, o que não ocorreu na narrativa evocada.
- source_word: διωχθῆναι
  choice: fosse perseguido
  rationale: Mantém o sentido passivo do infinitivo aoristo e expressa a hostilidade sofrida por José.
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: entrasse na escravidão
  rationale: Traduz naturalmente o movimento para a condição de escravo. Repetir “até” diante de “escravidão” seria pouco idiomático em português, embora a construção grega repita μέχρι.
theological_decisions:
- issue: Se μέχρι θανάτου afirma a morte efetiva de José
  choice: até ficar à beira da morte
  alternative: até a morte
  rationale: O grego pode soar literalmente como “até a morte”, mas aqui descreve a extensão extrema do perigo e da perseguição no conhecido relato de José, não sua morte efetiva. A tradução evita criar uma contradição narrativa sem enfraquecer a expressão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A construção “fez com que” reproduz de modo idiomático a relação causativa de ἐποίησεν com os infinitivos.
