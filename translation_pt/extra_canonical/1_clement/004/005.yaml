  yaml_path: translation/extra_canonical/1_clement/004/005.yaml
  text: Be still; his turning is toward you, and you shall rule over him.’
translation:
  language: pt
  text: Aquieta-te; o voltar-se dele é para ti, e tu o dominarás.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασον
  choice: Aquieta-te
  rationale: Imperativo que expressa cessar ou ficar quieto, preservando o tom direto do grego.
- source_word: ἡ ἀποστροφὴ αὐτοῦ
  choice: o voltar-se dele
  rationale: Mantém a formulação concreta e a ambiguidade do substantivo ἀποστροφή e do pronome masculino, sem identificar explicitamente o referente.
- source_word: ἄρξεις αὐτοῦ
  choice: o dominarás
  rationale: Traduz ἄρχω com genitivo como exercer domínio sobre alguém; a próclise do pronome soa natural no português moderno.
theological_decisions:
- issue: Identidade do referente dos pronomes masculinos αὐτοῦ
  choice: dele / o
  alternative: do pecado / sobre ele
  rationale: O trecho isolado não nomeia o referente; a tradução conserva essa indeterminação em vez de inserir uma interpretação.
translation_notes:
  register: Português atual, digno e conciso, com forma imperativa inteligível em contexto literário. A construção deliberadamente próxima do grego preserva a tensão e a ambiguidade da frase.
