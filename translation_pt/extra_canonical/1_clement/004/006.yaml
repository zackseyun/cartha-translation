source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν Κάϊν πρὸς Ἄβελ τὸν ἀδελφὸν αὐτοῦ· Διέλθωμεν εἰς τὸ πεδίον. καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς ἐν τῷ πεδίῳ, ἀνέστη Κάϊν ἐπʼ Ἄβελ τὸν ἀδελφὸν αὐτοῦ καὶ ἀπέκτεινεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: pt
  text: 'E Caim disse a seu irmão Abel: “Vamos ao campo.”[a] E aconteceu que, enquanto estavam no campo, Caim se levantou contra seu irmão Abel e o matou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vamos para o campo.”'
    reason: A construção grega indica movimento em direção ao campo; as duas formulações são possíveis em português.
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: Vamos ao campo
  rationale: Expressa de modo natural em português o movimento para o campo. Neste contexto, διέρχομαι indica ir de um lugar a outro, e não necessariamente atravessar o campo.
- source_word: ἀνέστη ... ἐπʼ
  choice: se levantou contra
  rationale: Preserva a construção narrativa e hostil do grego, em vez de explicitar além do texto como “atacou”.
- source_word: ἀπέκτεινεν
  choice: matou
  rationale: Equivalente direto, claro e corrente do verbo grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa próxima do grego. A repetição de “seu irmão Abel” foi preservada por sua ênfase literária.
