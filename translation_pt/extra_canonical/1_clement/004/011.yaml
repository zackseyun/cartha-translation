  text: Por causa do ciúme, Arão e Miriã alojaram-se fora do acampamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: Por causa do ciúme
  rationale: Expressa a relação causal do grego e conserva o sentido negativo de ζῆλος neste contexto.
- source_word: Ἀαρὼν καὶ Μαριὰμ
  choice: Arão e Miriã
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes bíblicos.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: fora do acampamento
  rationale: Equivalente natural e preciso para a localização fora do arraial ou acampamento de Israel.
- source_word: ηὐλίσθησαν
  choice: acamparam
  rationale: O verbo indica que permaneceram ou se alojaram em um lugar, possivelmente passando ali a noite; “acamparam” se ajusta ao cenário sem acrescentar duração específica.
theological_decisions:
- issue: Atribuição conjunta do episódio a Arão e Miriã
  choice: Manter ambos como sujeitos que acamparam fora do acampamento
  alternative: Harmonizar explicitamente com Números 12, onde apenas Miriã é declarada excluída do acampamento
  rationale: A tradução preserva a afirmação própria do texto de 1 Clemente, sem corrigi-la por harmonização com outra passagem.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. A repetição “acamparam fora do acampamento” reflete termos gregos distintos e permanece compreensível, embora estilisticamente próxima.
