lexical_decisions:
- source_word: διὰ ζῆλος
  choice: Por causa do ciúme
  rationale: Expressa a causa indicada por διά e preserva o sentido negativo de ζῆλος no contexto. A forma ζῆλος, em vez do esperado ζῆλον após διά, parece ser uma irregularidade textual ou gramatical e não altera o sentido básico.
- source_word: ἀπέδρα
  choice: fugiu
  rationale: Verbo que comunica de modo natural a ideia de escapar ou fugir de alguém.
- source_word: ἀπὸ προσώπου
  choice: da presença de
  rationale: Equivalente idiomático português para a expressão semítica, evitando o pouco natural «da face de».
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: seu irmão
  rationale: Mantém claramente a relação de parentesco e segue a ordem natural do português.
