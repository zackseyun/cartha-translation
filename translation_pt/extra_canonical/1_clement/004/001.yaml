  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: pt
  text: 'Pois assim está escrito: “E aconteceu, depois de alguns dias, que Caim trouxe dos frutos da terra uma oferta a Deus; e Abel também trouxe dos primogênitos das ovelhas e das partes gordas deles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γέγραπται γὰρ οὕτως
  choice: Pois assim está escrito
  rationale: Mantém a fórmula introdutória de citação e o valor explicativo de γάρ em português natural e digno.
- source_word: μεθ' ἡμέρας
  choice: depois de alguns dias
  rationale: Expressa o sentido temporal idiomático da locução grega sem sugerir um número específico de dias.
- source_word: θυσίαν
  choice: uma oferta
  rationale: No contexto de Gênesis 4, designa aquilo que é apresentado a Deus; “oferta” é claro e não restringe indevidamente o termo a um sacrifício animal.
- source_word: τῶν πρωτοτόκων τῶν προβάτων
  choice: dos primogênitos das ovelhas
  rationale: Preserva de perto a formulação grega e a referência aos primeiros nascidos do rebanho.
- source_word: τῶν στεάτων αὐτῶν
  choice: das partes gordas deles
  rationale: Indica as porções de gordura dos animais, evitando a leitura moderna de “gordura” como mera condição corporal.
