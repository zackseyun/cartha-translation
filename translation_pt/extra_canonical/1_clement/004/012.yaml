source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: pt
  text: O ciúme fez Datã e Abirão descerem vivos ao Hades, porque se rebelaram contra Moisés, o servo de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto da sequência de exemplos de 1 Clemente 4, designa o ciúme ou a inveja que provoca conflito; “ciúme” preserva a ligação temática e soa natural em português.
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  choice: fez ... descerem vivos ao Hades
  rationale: Mantém a construção causativa, a ênfase em terem descido vivos e o nome do domínio dos mortos, sem o identificar interpretativamente com o inferno.
- source_word: στασιάσαι
  choice: se rebelaram
  rationale: Expressa a ação de insurgir-se ou promover sedição contra Moisés, adequada ao episódio de Datã e Abirão.
- source_word: θεράποντα τοῦ θεοῦ
  choice: servo de Deus
  rationale: No uso bíblico referente a Moisés, θεράπων é um título honroso de serviço a Deus; “servo” preserva melhor essa ressonância do que “assistente”.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: mundo dos mortos / inferno
  rationale: “Hades” conserva o referente grego e evita resolver a natureza ou o destino final desse domínio por meio de um termo teologicamente mais específico.
- issue: Título de Moisés em θεράπων
  choice: servo de Deus
  alternative: assistente de Deus
  rationale: A escolha reflete o uso bíblico honorífico ligado a Moisés, sem acrescentar uma função ou doutrina ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais correntes em português (“Datã”, “Abirão”, “Moisés”). A ordem “Moisés, o servo de Deus” é natural e preserva a aposição grega. Não são necessárias notas de rodapé.
