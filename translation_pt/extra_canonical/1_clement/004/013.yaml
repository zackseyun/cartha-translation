  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: pt
  text: Por causa do ciúme, Davi foi alvo da inveja não só dos estrangeiros, mas também foi perseguido por Saul, rei de Israel.
