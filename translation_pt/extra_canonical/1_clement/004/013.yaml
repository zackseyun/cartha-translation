lexical_decisions:
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto da série de exemplos motivados por rivalidade, indica o ciúme que leva à hostilidade; a escolha também o distingue de φθόνος na mesma frase.
- source_word: φθόνον ἔσχεν ὑπὸ
  choice: foi alvo da inveja de
  rationale: 'Reproduz de modo natural o sentido passivo do idioma grego: Davi recebeu ou sofreu a inveja proveniente de outras pessoas.'
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: Equivalente claro e corrente para os povos que não pertenciam a Israel, sem restringir indevidamente a referência aos filisteus.
- source_word: ἐδιώχθη
  choice: foi perseguido
  rationale: Mantém a voz passiva e o sentido direto do verbo grego.
