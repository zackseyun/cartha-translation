  text: 'Vejam, irmãos: o ciúme e a inveja causaram o assassinato de um irmão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fratricídio”.
    reason: Registra a alternativa portuguesa concisa e tecnicamente correspondente ao substantivo composto grego.
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Vejam
  rationale: Preserva o imperativo plural e a força exortativa direta do verbo.
- source_word: ζῆλος καὶ φθόνος
  choice: o ciúme e a inveja
  rationale: Distingue os dois termos gregos em linguagem corrente, sem eliminar sua proximidade semântica.
- source_word: ἀδελφοκτονίαν
  choice: o assassinato de um irmão
  rationale: Expressa naturalmente o sentido do composto grego e preserva a repetição retórica de ἀδελφοί, 'irmãos'.
- source_word: κατειργάσατο
  choice: causaram
  rationale: Comunica que o ciúme e a inveja produziram esse resultado; o plural é natural em português com o sujeito composto.
