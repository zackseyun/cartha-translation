id: 1CLEM.51.3
reference: 1 Clement 51:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: pt
  text: Pois é bom que a pessoa confesse suas transgressões[a], em vez de endurecer o coração, assim como o coração dos que se rebelaram contra Moisés, servo de Deus, foi endurecido; o juízo deles se tornou evidente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «confesse a respeito de suas transgressões».'
    reason: Registra a construção mais literal de περὶ τῶν παραπτωμάτων, embora menos natural em português.
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: confesse suas transgressões
  rationale: Expressa naturalmente em português a admissão das próprias transgressões; embora περὶ possa ser vertido por «a respeito de», essa construção seria menos idiomática com «confessar».
- source_word: σκληρῦναι τὴν καρδίαν αὐτοῦ
  choice: endurecer o coração
  rationale: Mantém a metáfora bíblica do grego em linguagem corrente e digna.
- source_word: στασιασάντων
  choice: dos que se rebelaram
  rationale: Comunica a ideia de insurreição ou oposição ativa presente no particípio.
- source_word: θεράποντα τοῦ θεοῦ
  choice: servo de Deus
  rationale: «Servo» é natural no registro bíblico português e representa adequadamente a função de θεράπων neste contexto.
- source_word: κρίμα
  choice: condenação
  rationale: No contexto do castigo manifesto dos rebeldes, «condenação» comunica melhor o juízo adverso do que o termo português potencialmente ambíguo «julgamento».
- source_word: πρόδηλον ἐγενήθη
  choice: se tornou evidente
  rationale: Reproduz diretamente a ideia de algo que veio a ficar manifesto.
theological_decisions:
- issue: Sentido de κρίμα
  choice: condenação
  alternative: julgamento
  rationale: O referente narrativo é o resultado adverso sofrido pelos rebeldes; «condenação» preserva esse valor sem acrescentar detalhes sobre a forma do castigo.
- issue: Agente do endurecimento em ἐσκληρύνθη
  choice: foi endurecido
  alternative: se endureceu
  rationale: A voz passiva do grego não identifica o agente. A tradução mantém essa abertura, sem atribuir explicitamente o endurecimento a Deus nem apenas aos próprios rebeldes.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil; tom digno e bíblico, com sintaxe natural. O marcador [a] aparece imediatamente após a expressão a que se refere.
