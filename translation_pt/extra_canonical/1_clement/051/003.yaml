revisions:
- from: Pois é bom que a pessoa confesse suas transgressões, em vez de endurecer o coração[a], assim como foi endurecido o coração dos que se rebelaram contra Moisés, servo de Deus, e cuja condenação se tornou evidente.
  to: Pois é bom que a pessoa confesse suas transgressões[a], em vez de endurecer o coração, assim como o coração dos que se rebelaram contra Moisés, servo de Deus, foi endurecido; o juízo deles se tornou evidente.
  rationale: A revisão desloca a nota para a expressão que ela esclarece, substitui «condenação» por «juízo» para preservar a amplitude de κρίμα e reformula a última oração para que «deles» designe sem ambiguidade os rebeldes. A passiva de «foi endurecido» continua sem identificar um agente.
