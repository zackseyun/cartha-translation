source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: pt
  text: Portanto, todas as faltas em que incorremos e os atos que cometemos por alguma artimanha do Adversário, peçamos que nos sejam perdoados. E também aqueles que se tornaram líderes de revolta e divisão devem ter em vista a esperança comum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπέσαμεν
  choice: as faltas em que caímos
  rationale: O verbo indica incorrer em falta ou transgredir; a formulação preserva a imagem de 'cair em' uma falta e soa natural em português.
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: por alguma influência do Adversário
  rationale: 'A expressão grega é elíptica: literalmente, ''por alguma [coisa] das [coisas] do adversário''. ''Influência'' mantém a indeterminação melhor do que especificar ''planos'' ou ''artimanhas'', enquanto ''Adversário'' comunica o provável referente pessoal sem apagar totalmente o sentido lexical.'
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  choice: peçamos que nos sejam perdoados
  rationale: Neste contexto, ἀξιόω tem o sentido de pedir ou suplicar; a voz passiva de ἀφίημι é preservada.
- source_word: στάσεως καὶ διχοστασίας
  choice: revolta e divisão
  rationale: στάσις denota sedição, conflito ou revolta, e διχοστασία, divisão ou dissensão. A dupla mantém a intensidade e a distinção dos termos.
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  choice: a esperança que compartilhamos
  rationale: A expressão idiomática aponta para 'a esperança comum'. A forma escolhida é clara e natural, sem introduzir a ideia diferente de 'bem comum'.
- source_word: σκοπεῖν
  choice: ter em vista
  rationale: Expressa considerar atentamente, prestar atenção ou manter algo diante dos olhos; 'ter em vista' conserva esse alcance deliberativo.
theological_decisions:
- issue: Identidade de ὁ ἀντικείμενος
  choice: o Adversário
  alternative: o adversário
  rationale: O contexto admite a leitura de um oponente pessoal, provavelmente Satanás, mas não o nomeia. A inicial maiúscula sinaliza o provável uso titular sem substituir o termo grego por um nome explícito.
- issue: Sentido de τὸ κοινὸν τῆς ἐλπίδος
  choice: a esperança que compartilhamos
  alternative: o bem comum da esperança
  rationale: A construção é melhor entendida idiomaticamente como a esperança comum, evitando atribuir-lhe um 'bem comum' que o grego não exige. A variante é registrada em nota por causa da ambiguidade formal da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o movimento exortativo do grego, mas evita literalismos obscuros. O marcador [a] aparece no texto principal.
