revisions:
- from: Portanto, quaisquer que sejam as faltas em que caímos e os atos que cometemos por alguma influência do Adversário, peçamos que nos sejam perdoados. E também aqueles que se tornaram líderes de revolta e divisão devem ter em vista a esperança que compartilhamos.[a]
  to: Portanto, todas as faltas em que incorremos e os atos que cometemos por alguma artimanha do Adversário, peçamos que nos sejam perdoados. E também aqueles que se tornaram líderes de revolta e divisão devem ter em vista a esperança comum.
  rationale: A revisão torna a primeira oração mais natural, evita que “influência” especifique indevidamente o meio elíptico ligado ao Adversário e traduz τὸ κοινὸν τῆς ἐλπίδος pela expressão idiomática “a esperança comum”, conforme o sentido sustentado pelo texto grego e pela trilha de auditoria inglesa. A nota é removida porque sua alternativa não representa uma ambiguidade útil ou provável do original.
