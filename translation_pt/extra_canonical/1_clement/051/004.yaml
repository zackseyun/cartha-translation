lexical_decisions:
- source_word: ᾅδου
  choice: Hades
  rationale: Mantém o termo grego como designação do mundo dos mortos, sem o identificar automaticamente com o inferno de punição final.
- source_word: ποιμανεῖ
  choice: pastoreará
  rationale: Preserva a metáfora pastoral marcante e paradoxal do verbo grego, em vez de a reduzir a “governará” ou “dominará”.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: mundo dos mortos; inferno
  rationale: “Hades” conserva a referência ao domínio dos mortos e evita importar uma identificação teológica mais específica do que o grego exige.
- issue: Metáfora de a morte como pastor
  choice: a morte os pastoreará
  alternative: a morte os governará
  rationale: A tradução mantém a imagem explícita do original e sua tensão teológica, sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, conciso e digno, com sintaxe natural e preservação deliberada da linguagem imagética do grego.
