source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: pt
  text: 'O faraó, seu exército e todos os líderes do Egito — tanto os carros como os que neles iam — foram submersos no mar Vermelho e pereceram por nenhuma outra razão senão esta: seus corações insensatos foram endurecidos depois que os sinais e prodígios se realizaram na terra do Egito por meio de Moisés, servo de Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: os líderes
  rationale: Expressa naturalmente os dirigentes do Egito sem restringir o termo a um cargo político específico.
- source_word: οἱ ἀναβάται αὐτῶν
  choice: os que neles iam
  rationale: No contexto dos carros, comunica os ocupantes ou condutores sem acrescentar uma especificação ausente do grego.
- source_word: ἐβυθίσθησαν
  choice: foram submersos
  rationale: Preserva o sentido passivo de serem afundados nas águas.
- source_word: τὰς ἀσυνέτους καρδίας
  choice: o coração insensato deles
  rationale: Mantém a imagem bíblica do coração como centro da percepção moral; o singular coletivo é mais natural em português e não altera o referente plural.
- source_word: θεράποντος τοῦ θεοῦ
  choice: servo de Deus
  rationale: Equivalente corrente e digno para θεράπων neste contexto, indicando alguém a serviço de Deus.
theological_decisions:
- issue: Agente do endurecimento
  choice: foi endurecido
  alternative: eles endureceram o próprio coração
  rationale: O infinitivo passivo σκληρυνθῆναι não explicita o agente. A formulação passiva conserva essa ambiguidade teológica em vez de atribuir expressamente a ação a Deus ou aos egípcios.
- issue: Mediação de Moisés nos sinais e prodígios
  choice: por meio de Moisés
  alternative: por Moisés
  rationale: διὰ com genitivo apresenta Moisés como mediador ou instrumento, sem fazê-lo a fonte última dos prodígios.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi levemente reorganizada com travessões para tornar natural a enumeração grega, preservando sua abrangência e a tensão do passivo no endurecimento.
