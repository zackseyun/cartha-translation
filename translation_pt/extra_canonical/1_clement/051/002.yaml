source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: pt
  text: Pois os que se conduzem com temor e amor preferem que eles próprios sofram maus-tratos, em vez de seus próximos os sofrerem; mais ainda, pronunciam condenação contra si mesmos, em vez de contra a concórdia que nos foi bem e justamente transmitida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιτευόμενοι
  choice: os que se conduzem
  rationale: O verbo pode evocar a maneira de viver ou de exercer a cidadania; neste contexto, «se conduzem» comunica naturalmente a conduta sem acrescentar uma referência política explícita.
- source_word: αἰκίαις περιπίπτειν
  choice: sofram maus-tratos
  rationale: A expressão indica cair em abusos ou maus-tratos. A construção portuguesa mantém os próprios sujeitos como vítimas, sem introduzir a ideia ausente de que eles causariam o sofrimento dos próximos.
- source_word: κατάγνωσιν φέρουσιν
  choice: pronunciam condenação contra
  rationale: A expressão idiomática significa dirigir ou proferir condenação contra alguém, e não suportar uma condenação já imposta.
- source_word: ὁμοφωνίας
  choice: concórdia
  rationale: Expressa acordo e harmonia compartilhados; «concórdia» preserva o sentido comunitário em registro digno e corrente.
theological_decisions:
- issue: Objeto da condenação na comparação final
  choice: «contra si mesmos, em vez de condenar a concórdia»
  alternative: «suportam a condenação de si mesmos, em vez da condenação da concórdia»
  rationale: O grego apresenta «si mesmos» e «a concórdia» como alvos alternativos da condenação. A tradução explicita a elipse verbal sem transformar φέρουσιν em mera aceitação passiva da condenação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «condenação/condenar» torna explícito o paralelismo elíptico do grego, enquanto «mais ainda» reproduz a intensificação de μᾶλλον δέ.
