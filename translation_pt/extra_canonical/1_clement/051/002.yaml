revisions:
- from: Pois os que se conduzem com temor e amor preferem que eles próprios sofram maus-tratos, e não os seus próximos; mais ainda, pronunciam condenação contra si mesmos, em vez de condenar a concórdia que nos foi transmitida de modo bom e justo.
  to: Pois os que se conduzem com temor e amor preferem que eles próprios sofram maus-tratos, em vez de seus próximos os sofrerem; mais ainda, pronunciam condenação contra si mesmos, em vez de contra a concórdia que nos foi bem e justamente transmitida.
  rationale: A revisão torna explícita a comparação em que os próprios fiéis, e não os próximos, recebem os maus-tratos. Conserva-se a compreensão ativa de «pronunciam condenação contra» e o paralelismo elíptico entre «si mesmos» e «a concórdia». A locução final foi ajustada para português mais idiomático e para refletir os dois advérbios gregos.
