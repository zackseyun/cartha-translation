id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: pt
  text: Pois quem, depois de permanecer entre vocês, não aprovou a fé de vocês, dotada de todas as virtudes e firme? Quem não admirou a piedade sensata e gentil de vocês no Messias? Quem não proclamou o caráter magnífico da hospitalidade de vocês? E quem não considerou bem-aventurado o conhecimento completo e seguro de vocês?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας
  choice: depois de permanecer entre vocês
  rationale: Expressa a estadia temporária de alguém vindo de fora, sem recorrer a uma formulação excessivamente técnica.
- source_word: πανάρετον
  choice: cheia de toda virtude
  rationale: Preserva a força abrangente do composto grego e evita o pouco natural «todo-virtuosa».
- source_word: ἐδοκίμασεν
  choice: reconheceu
  rationale: No contexto, indica constatar e aprovar o valor comprovado da fé; «reconheceu» comunica isso com naturalidade.
- source_word: σώφρονα καὶ ἐπιεικῆ
  choice: sensata e gentil
  rationale: Mantém os sentidos de autocontrole/bom senso e de brandura/equidade em linguagem corrente.
- source_word: εὐσέβειαν
  choice: devoção
  rationale: Comunica a conduta reverente e piedosa sem restringir o termo a atos rituais.
- source_word: ἐμακάρισεν
  choice: considerou feliz
  rationale: Conserva a linguagem de declarar ou considerar alguém bem-aventurado, ajustada ao objeto expresso na frase portuguesa.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: «Messias» explicita o valor titular do grego Χριστός e evita tratar o título apenas como nome próprio, sem acrescentar interpretação denominacional.
- issue: Sentido de γνῶσις
  choice: conhecimento
  alternative: compreensão
  rationale: Mantém o termo amplo do grego, sem especificar indevidamente o conteúdo ou atribuir-lhe um sentido técnico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por «vocês». As perguntas retóricas paralelas foram preservadas; pequenas explicitações pronominais evitam ambiguidade pouco natural em português.
