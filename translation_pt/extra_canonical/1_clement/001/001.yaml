revisions:
- from: Por causa das calamidades e dificuldades repentinas e sucessivas que nos sobrevieram, irmãos, reconhecemos que demoramos um pouco a voltar nossa atenção para as questões que estão sendo discutidas entre vocês[a], amados. Referimo-nos à revolta abominável e profana, alheia e estranha aos escolhidos de Deus, que umas poucas pessoas impetuosas e obstinadas atiçaram a tal ponto de loucura que o nome honrado e célebre de vocês, digno do amor de todos, foi gravemente difamado.
  to: Por causa das calamidades e crises repentinas e sucessivas que nos sobrevieram, irmãos, reconhecemos que demoramos um pouco a voltar nossa atenção para as questões que estão sendo discutidas entre vocês[a], amados; isto é, para a revolta abominável e profana, alheia e estranha aos escolhidos de Deus, que umas poucas pessoas impetuosas e obstinadas atiçaram a tal ponto de loucura que o nome honrado e célebre de vocês, digno do amor de todos, foi gravemente difamado.
