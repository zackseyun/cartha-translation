id: 1CLEM.1.1
reference: 1 Clement 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
translation:
  language: pt
  text: Por causa das calamidades e crises repentinas e sucessivas que nos sobrevieram, irmãos, reconhecemos que demoramos um pouco a voltar nossa atenção para as questões que estão sendo discutidas entre vocês[a], amados; isto é, para a revolta abominável e profana, alheia e estranha aos escolhidos de Deus, que umas poucas pessoas impetuosas e obstinadas atiçaram a tal ponto de loucura que o nome honrado e célebre de vocês, digno do amor de todos, foi gravemente difamado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as questões levantadas entre vocês”. O grego também pode indicar questões procuradas ou investigadas, mas não diz explicitamente “solicitadas de nós”.'
    reason: Preserva a amplitude de ἐπιζητουμένων e evita introduzir um complemento ausente do texto grego.
lexical_decisions:
- source_word: συμφορὰς καὶ περιστάσεις
  choice: calamidades e dificuldades
  rationale: Distingue as desgraças sofridas das circunstâncias críticas, sem recorrer a uma duplicação artificial em português.
- source_word: βράδιον
  choice: demoramos um pouco
  rationale: Expressa o sentido comparativo/adverbial de atraso de modo natural, sem sugerir uma demora extrema.
- source_word: ἐπιστροφὴν πεποιῆσθαι
  choice: voltar nossa atenção
  rationale: No contexto epistolar, indica ocupar-se ou dar atenção ao assunto, mais naturalmente do que o literalismo «fazer um retorno».
- source_word: ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων
  choice: questões que estão sendo discutidas entre vocês
  rationale: Lê ἐπιζητουμένων como questões debatidas ou controvertidas e παρʼ ὑμῖν como «entre vocês», sem inserir «por nós» ou «de nós», ausentes do grego.
- source_word: στάσεως
  choice: revolta
  rationale: Conserva a força de στάσις como levante ou conflito faccioso, mais intensa que simples «desavença».
- source_word: μιαρᾶς καὶ ἀνοσίου
  choice: abominável e profana
  rationale: Reproduz a condenação moral e religiosa dos dois adjetivos sem linguagem excessivamente arcaica.
- source_word: προπετῆ καὶ αὐθάδη
  choice: impetuosas e obstinadas
  rationale: Comunica respectivamente a precipitação temerária e a atitude voluntariosa ou arrogante.
- source_word: ἐξέκαυσαν
  choice: atiçaram
  rationale: Mantém a metáfora de acender ou inflamar a revolta em português idiomático.
- source_word: τὸ ... ὄνομα ὑμῶν ... βλασφημηθῆναι
  choice: o nome ... de vocês ... foi gravemente difamado
  rationale: «Nome» representa a reputação coletiva; «difamado» transmite aqui o sentido passivo de ser alvo de fala injuriosa, sem restringir βλασφημέω ao uso técnico religioso.
theological_decisions:
- issue: Identidade dos «escolhidos de Deus»
  choice: aos escolhidos de Deus
  alternative: ao povo eleito de Deus
  rationale: Mantém o plural substantivado do grego e sua linguagem teológica sem definir além do texto a identidade ou o alcance da eleição.
- issue: Força religiosa de βλασφημηθῆναι
  choice: foi gravemente difamado
  alternative: foi gravemente blasfemado
  rationale: Como o objeto é o bom nome da comunidade, o verbo denota falar injuriosamente ou desacreditar; «difamado» evita impor ao contexto o sentido português mais estreito de ofensa direta a Deus.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A longa frase grega foi dividida em duas para facilitar a compreensão, mantendo a relação explicativa por meio de «Referimo-nos».
