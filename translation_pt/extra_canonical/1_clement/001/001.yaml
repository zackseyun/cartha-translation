review_pass:
  verdict: revise
  source_fidelity: A tradução capta bem a sintaxe geral e, sobretudo, interpreta ἐπιζητουμένων παρʼ ὑμῖν como questões em debate entre os destinatários, sem acrescentar que teriam sido solicitadas à igreja de Roma. No entanto, «dificuldades» enfraquece περιστάσεις, que neste contexto denota crises, adversidades ou circunstâncias aflitivas. A relação apositiva entre «questões» e στάσις fica mais diretamente expressa por «isto é» do que por uma nova oração com «Referimo-nos».
  naturalness: O português é claro, moderno e de registro adequadamente solene. A revisão preserva a legibilidade, torna mais natural a ligação explicativa da segunda frase e substitui «dificuldades» por «crises», termo igualmente corrente e mais preciso.
  terminology: «Escolhidos de Deus», «revolta», «profana», «impetuosas e obstinadas» e «difamado» são escolhas defensáveis no contexto. «Difamado» comunica adequadamente a injúria pública dirigida ao bom nome da comunidade, sem restringir indevidamente βλασφημηθῆναι a uma ofensa dirigida diretamente a Deus.
