source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: pt
  text: Pois vocês faziam tudo sem favoritismo e andavam nos preceitos de Deus, submetendo-se aos seus líderes e dando aos mais velhos entre vocês a honra que lhes era devida.[a] Orientavam os jovens a cultivar pensamentos moderados e dignos.[b] Também instruíam as mulheres a fazer tudo com consciência irrepreensível, digna e pura, amando seus próprios maridos como convém; e lhes ensinavam que, sob a norma da submissão, administrassem dignamente os assuntos do lar, demonstrando pleno domínio próprio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos presbíteros entre vocês”.
    reason: O grego πρεσβυτέροις pode designar tanto os mais velhos quanto presbíteros da comunidade.
  - marker: b
    text: A edição grega fornecida lê literalmente “medidas”; o sentido esperado da expressão é geralmente associado a “moderados”.
    reason: A edição fornecida traz μέτρα, enquanto a expressão é normalmente entendida como correspondente a μέτρια. A nota deixa a dificuldade textual explícita sem tratar a emenda como certa.
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: sem favoritismo
  rationale: Expressa de modo natural a ausência de parcialidade ou acepção de pessoas.
- source_word: νομίμοις
  choice: preceitos
  rationale: No plural substantivado, refere-se às determinações ou ordenanças de Deus; “preceitos” é claro e evita a redundância de “ordenanças legais”.
- source_word: ἡγουμένοις
  choice: líderes
  rationale: Termo amplo para aqueles que dirigem a comunidade, sem impor um cargo eclesiástico específico.
- source_word: πρεσβυτέροις
  choice: mais velhos
  rationale: Mantém o sentido lexical primário e a possível referência a pessoas de maior idade; a alternativa institucional é registrada em nota.
- source_word: μέτρα
  choice: moderados
  rationale: O texto transmitido na edição parece refletir uma forma/OCR por μέτρια, leitura coerente com a expressão grega conhecida e com o paralelo σωφρονούσας; em português, “pensamentos moderados” comunica o sentido provável sem artificialidade.
- source_word: οἰκουρεῖν
  choice: cuidar dignamente dos assuntos do lar
  rationale: Abrange a administração e o cuidado da casa, sem reduzir o verbo apenas a permanecer em casa.
- source_word: σωφρονούσας
  choice: demonstrando pleno domínio próprio
  rationale: Preserva a ideia ética de sensatez, moderação e autocontrole; “domínio próprio” é claro no contexto.
theological_decisions:
- issue: Sentido de πρεσβυτέροις
  choice: mais velhos
  alternative: presbíteros
  rationale: O termo pode indicar idade ou função comunitária. O contexto distingue os líderes e os πρεσβύτεροι, favorecendo a tradução não institucional, sem excluir a outra possibilidade.
- issue: Força de κανών em κανόνι τῆς ὑποταγῆς
  choice: norma da submissão
  alternative: regra da submissão
  rationale: “Norma” preserva a imagem de padrão regulador e soa menos rígido ou técnico que “regra”, sem apagar a linguagem de subordinação presente no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para boa legibilidade brasileira. Os imperfeitos gregos foram mantidos como ações habituais no passado. A estrutura retórica dirigida sucessivamente à comunidade, aos jovens e às mulheres foi preservada, inclusive o verbo independente “ensinavam” (ἐδιδάσκετε) na cláusula final.
