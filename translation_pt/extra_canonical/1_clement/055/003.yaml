lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: fortalecidas
  rationale: Expressa naturalmente o particípio passivo, preservando Deus como fonte implícita do fortalecimento por meio da graça.
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  choice: pela graça de Deus
  rationale: A preposição διά com genitivo indica meio; «pela» comunica isso de modo claro e corrente.
- source_word: ἐπετέλεσαν
  choice: realizaram
  rationale: Reproduz o sentido de levar a cabo ou cumprir, sem acrescentar uma nuance ausente no contexto.
- source_word: πολλὰ ἀνδρεῖα
  choice: muitos feitos corajosos
  rationale: O adjetivo substantivado ἀνδρεῖα denota ações valentes ou corajosas; «feitos corajosos» preserva a força sem sugerir que a coragem seja exclusivamente masculina.
