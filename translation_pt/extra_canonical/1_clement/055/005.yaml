source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: pt
  text: Assim, entregando-se ao perigo, ela saiu por amor à sua pátria e ao povo que estava sitiado, e o Senhor entregou Holofernes na mão de uma mulher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: entregando-se … entregou
  rationale: 'Preserva a repetição deliberada do mesmo verbo grego: primeiro a entrega voluntária da mulher ao perigo, depois a entrega de Holofernes pelo Senhor.'
- source_word: δι’ ἀγάπην
  choice: por amor
  rationale: Expressa de modo natural a motivação indicada pelo grego.
- source_word: πατρίδος
  choice: pátria
  rationale: Equivalente direto e digno, adequado ao sentido de terra natal ou país.
- source_word: ἐν συγκλεισμῷ
  choice: estava sitiado
  rationale: O substantivo descreve confinamento ou cerco; no contexto, 'sitiado' comunica com clareza a situação coletiva do povo.
- source_word: ἐν χειρὶ θηλείας
  choice: nas mãos de uma mulher
  rationale: Reproduz a expressão idiomática de poder ou domínio em português natural, sem o tom pouco natural de 'na mão de uma fêmea'.
theological_decisions:
- issue: Agência divina na derrota de Holofernes
  choice: o Senhor entregou Holofernes
  alternative: o Senhor fez Holofernes cair
  rationale: Mantém a afirmação explícita de que o Senhor agiu e conserva o paralelismo lexical de παραδίδωμι, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O ponto e vírgula destaca o paralelo retórico entre a entrega voluntária dela e a entrega de Holofernes pelo Senhor.
