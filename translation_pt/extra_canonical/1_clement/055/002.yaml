review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva a estrutura, o paralelismo e o sentido central do grego: pessoas se entregam às cadeias ou à escravidão para prover a libertação ou o alimento de outros. «Correntes», «resgatar» e «alimentaram» são escolhas fiéis e adequadas. Contudo, «o próprio preço» é semanticamente ambíguo em português e pode sugerir preço inerente ou valor pessoal, em vez da quantia recebida em troca de sua própria entrega, expressa por τὰς τιμὰς αὐτῶν.'
  naturalness: O texto é claro e de registro apropriado. A troca de «recebendo o próprio preço» por «recebendo o preço por si mesmos» torna a segunda frase mais idiomática e inteligível sem explicitar quem pagou.
  terminology: «Resgatar» traduz bem λυτρώσωνται sem impor leitura teológica técnica. «Escravidão» e «alimentaram» são diretos e historicamente adequados. «Preço por si mesmos» conserva a referência aos próprios indivíduos sem acrescentar «pago» ou identificar o comprador.
  issues:
  - severity: medium
    issue: «recebendo o próprio preço»
    rationale: Em português moderno, a expressão pode ser entendida como o valor próprio/intrínseco das pessoas. O grego τὰς τιμὰς αὐτῶν refere-se mais naturalmente aos valores recebidos por elas, isto é, em troca de si mesmas. «Recebendo o preço por si mesmos» mantém a ambiguidade legítima sobre o agente pagador e esclarece a relação.
  revised_text: Sabemos de muitos entre nós que se entregaram às correntes para resgatar outros. Muitos se entregaram à escravidão e, recebendo o preço por si mesmos, alimentaram outros.
  revised_footnotes: []
  revision_rationale: A única revisão elimina uma ambiguidade portuguesa desnecessária em «o próprio preço», preservando a concisão e a indeterminação do original quanto a quem pagou o preço. Não são necessárias notas.
