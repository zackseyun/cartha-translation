revisions:
- from: Sabemos de muitos entre nós que se entregaram às correntes para resgatar outros. Muitos se entregaram à escravidão e, recebendo o próprio preço, alimentaram outros.
  to: Sabemos de muitos entre nós que se entregaram às correntes para resgatar outros. Muitos se entregaram à escravidão e, recebendo o preço por si mesmos, alimentaram outros.
  rationale: A única revisão elimina uma ambiguidade portuguesa desnecessária em «o próprio preço», preservando a concisão e a indeterminação do original quanto a quem pagou o preço. Não são necessárias notas.
