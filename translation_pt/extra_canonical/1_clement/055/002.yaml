base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: pt
  text: Sabemos de muitos entre nós que se entregaram às correntes para resgatar outros. Muitos se entregaram à escravidão e, recebendo o preço por si mesmos, alimentaram outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστάμεθα
  choice: Sabemos de
  rationale: Expressa conhecimento efetivo e introduz naturalmente, em português, as pessoas conhecidas pelo autor.
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: que se entregaram às correntes
  rationale: Preserva a imagem concreta de δεσμά e o caráter voluntário da entrega reflexiva.
- source_word: ὅπως ἑτέρους λυτρώσωνται
  choice: para resgatar outros
  rationale: Mantém a finalidade e o sentido de libertação mediante resgate, sem explicitar além do grego o mecanismo ou o preço.
- source_word: παρέδωκαν εἰς δουλείαν
  choice: se entregaram à escravidão
  rationale: Tradução direta e natural, conservando o paralelismo com a entrega às correntes.
- source_word: λαβόντες τὰς τιμὰς αὐτῶν
  choice: recebendo o próprio preço
  rationale: Reflete de modo conciso o plural idiomático grego, entendido como os valores correspondentes às próprias pessoas, sem acrescentar que o preço foi pago por terceiros.
- source_word: ἐψώμισαν
  choice: alimentaram
  rationale: O verbo indica dar alimento ou sustento; 'alimentaram' preserva a ação concreta sem ampliar para uma noção genérica de ajuda.
