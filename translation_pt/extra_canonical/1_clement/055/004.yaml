base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: pt
  text: A bem-aventurada Judite, quando a cidade estava sob cerco, pediu aos presbíteros que lhe permitissem sair e ir ao acampamento dos estrangeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μακαρία
  choice: a bem-aventurada
  rationale: Preserva o sentido honorífico e religioso de μακαρία em linguagem digna e corrente.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: quando a cidade estava cercada
  rationale: Expressa naturalmente a situação de cerco indicada por συγκλεισμός, sem acrescentar pormenores.
- source_word: πρεσβυτέρων
  choice: presbíteros
  rationale: Mantém o termo referente aos anciãos que exerciam autoridade comunitária, evitando reduzir sua possível função institucional.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: É o sentido contextual adequado para o campo militar fora da cidade.
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: Reproduz o sentido literal de pessoas de outro povo, sem identificar no texto um grupo não explicitado.
