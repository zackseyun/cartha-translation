source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: pt
  text: E também Ester, perfeita quanto à fé[a], expôs-se, não menos, ao perigo para salvar as doze tribos de Israel[b], que estavam prestes a perecer. Pois, por meio do jejum e do ato de se humilhar[c], ela suplicou ao Soberano que tudo vê, o Deus dos séculos. E ele, vendo a humildade da alma dela, salvou o povo pelo qual ela havia enfrentado o perigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perfeita segundo a fé”.'
    reason: A construção κατὰ πίστιν pode ser reproduzida mais formalmente dessa maneira.
  - marker: b
    text: Literalmente, “o conjunto das doze tribos de Israel”; trata-se de uma expressão coletiva.
    reason: A nota esclarece o substantivo coletivo singular δωδεκάφυλον e a concordância singular do original.
  - marker: c
    text: 'Ou: “da auto-humilhação”.'
    reason: A alternativa destaca o caráter voluntário de ταπείνωσις no contexto de jejum e súplica.
lexical_decisions:
- source_word: οὐχ ἧττον καὶ
  choice: Do mesmo modo
  rationale: A expressão introduz Ester como exemplo não inferior aos anteriores. A formulação evita o pleonasmo pouco natural de uma reprodução palavra por palavra, como “não menos também”.
- source_word: τελεία κατὰ πίστιν
  choice: perfeita quanto à fé
  rationale: Preserva a relação expressa por κατά sem transformar a frase numa afirmação de perfeição absoluta. A nota registra a formulação mais literal possível.
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  choice: as doze tribos de Israel
  rationale: δωδεκάφυλον é um substantivo coletivo que designa Israel em sua totalidade tribal. Esta é a expressão portuguesa corrente e evita o artificial “povo de doze tribos”.
- source_word: τῆς νηστείας καὶ τῆς ταπεινώσεως
  choice: do jejum e do ato de se humilhar
  rationale: No contexto devocional, ταπείνωσις indica rebaixamento voluntário diante de Deus, não constrangimento imposto por terceiros; a formulação torna clara essa intencionalidade.
- source_word: ἠξίωσεν
  choice: suplicou
  rationale: Neste contexto, o verbo tem o sentido de dirigir um pedido insistente ou apelo a Deus.
- source_word: τὸν παντεπόπτην δεσπότην
  choice: ao Soberano que tudo vê
  rationale: Comunica tanto a autoridade de δεσπότης quanto o alcance universal da visão expresso por παντεπόπτης, em português claro e digno.
- source_word: θεὸν τῶν αἰώνων
  choice: o Deus dos séculos
  rationale: Mantém a expressão temporal solene e aberta do grego, sem reduzi-la interpretativamente a “Deus eterno”.
- source_word: τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς
  choice: a humildade da alma dela
  rationale: Traduz a qualidade humilde ou abatida da pessoa interior de Ester e preserva o vínculo lexical com seu ato anterior de se humilhar.
theological_decisions:
- issue: O sentido de κατὰ πίστιν na caracterização de Ester
  choice: perfeita quanto à fé
  alternative: perfeita segundo a fé
  rationale: O grego admite uma relação normativa ou referencial entre perfeição e fé. A tradução principal soa natural sem decidir além do texto; a alternativa formal é preservada em nota.
- issue: A identidade coletiva expressa por δωδεκάφυλον
  choice: as doze tribos de Israel
  alternative: o povo das doze tribos de Israel
  rationale: A escolha mantém o conceito tradicional da totalidade de Israel sem introduzir uma distinção teológica entre “tribos” e “povo”; o próprio texto retoma o coletivo com τὸν λαόν, “o povo”.
- issue: A natureza de ταπείνωσις
  choice: ato de se humilhar
  alternative: humilhação
  rationale: Ao lado do jejum, a palavra aponta para uma prática voluntária de auto-humilhação diante de Deus. “Humilhação” poderia sugerir em português moderno uma vergonha involuntária ou imposta.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira e compreensão internacional. “Soberano” evita a possível leitura servil excessivamente concreta de “Dono”, enquanto “Deus dos séculos” conserva o tom antigo e a amplitude do original. A repetição entre “se humilhar” e “humildade” é intencional e reflete a ligação lexical do grego.
