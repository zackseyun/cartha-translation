id: 1CLEM.55.1
reference: 1 Clement 55:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: pt
  text: 'E, para apresentarmos também exemplos das nações: muitos reis e governantes, quando sobreveio alguma calamidade pestilenta, instruídos por oráculos, entregaram-se à morte, a fim de, por meio do próprio sangue, livrar os seus concidadãos. Muitos se retiraram de suas próprias cidades, para que não continuassem a envolver-se em conflitos facciosos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείγματα ἐθνῶν
  choice: exemplos das nações
  rationale: Preserva a referência a exemplos oriundos de povos não judeus, sem acrescentar uma interpretação religiosa mais específica como “pagãos”.
- source_word: βασιλεῖς καὶ ἡγούμενοι
  choice: reis e governantes
  rationale: Distingue a realeza de outras formas de liderança política em linguagem natural e abrangente.
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: quando sobreveio alguma calamidade pestilenta
  rationale: Mantém tanto a ideia de uma circunstância crítica quanto sua associação com peste ou epidemia; “alguma” reflete τινος.
- source_word: χρησμοδοτηθέντες
  choice: instruídos por oráculos
  rationale: Expressa a recepção de uma resposta ou orientação oracular sem sugerir que o texto endosse sua veracidade.
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: entregaram-se à morte
  rationale: Reproduz de perto a construção reflexiva e sacrificial do grego.
- source_word: τοὺς πολίτας
  choice: seus concidadãos
  rationale: Indica os membros da mesma comunidade cívica, sentido mais preciso que o genérico “cidadãos”.
- source_word: ἐξεχώρησαν ἰδίων πόλεων
  choice: deixaram suas próprias cidades
  rationale: Verte de modo claro a retirada voluntária ou partida das cidades de origem, sem especificar exílio além do que o grego afirma.
- source_word: ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον
  choice: para que as facções não continuassem em conflito
  rationale: Entende o verbo como conflito faccioso; preserva o sujeito implícito no plural sem atribuí-lo indevidamente aos líderes que partiram.
theological_decisions:
- issue: Possível paralelo sacrificial na expressão “por meio do próprio sangue”
  choice: Preservar literalmente a linguagem de sangue e livramento
  alternative: Parafrasear como “sacrificando a própria vida para salvar”
  rationale: O texto apresenta exemplos das nações e pode criar uma ressonância sacrificial, mas não identifica explicitamente essas mortes com a obra de Cristo; a tradução mantém a tensão sem desenvolvê-la doutrinariamente.
- issue: Avaliação dos oráculos pagãos
  choice: Traduzir de forma descritiva e neutra
  alternative: Usar linguagem que desacredite ou valide os oráculos
  rationale: O particípio apenas informa que os governantes receberam instrução oracular; o autor não faz aqui uma avaliação explícita de sua origem ou verdade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe retém a progressão retórica do grego, mas evita rigidez excessiva. “Nações” conserva o vocabulário histórico-religioso, enquanto “calamidade pestilenta” comunica uma crise ligada à peste sem limitar necessariamente o referente a uma epidemia tecnicamente definida.
