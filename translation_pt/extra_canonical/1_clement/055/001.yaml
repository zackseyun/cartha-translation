review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração traduz com precisão os principais elementos do grego: exemplos provenientes das nações, reis e líderes, uma crise pestilenta, orientação por oráculos, entrega à morte e livramento dos concidadãos mediante o próprio sangue. Na oração final, porém, o rascunho torna «as facções» o sujeito de «não continuassem em conflito». O sujeito implícito de στασιάζωσιν é mais naturalmente «muitos», isto é, os que se retiraram; o verbo descreve seu envolvimento em conflito faccioso.'
  naturalness: O português é claro, moderno e de registro apropriado. «Se retiraram» exprime um pouco melhor ἐξεχώρησαν do que «deixaram», sem introduzir a ideia mais forte de exílio.
  terminology: «Nações», «reis e governantes», «oráculos», «concidadãos» e «por meio do próprio sangue» são escolhas adequadas e não impõem leitura doutrinária. «Conflitos facciosos» comunica naturalmente o sentido político-social de στασιάζω.
  issues:
  - severity: medium
    issue: O sujeito da oração final foi deslocado de «muitos» para «as facções».
    rationale: Em ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον, o plural verbal retoma mais naturalmente πολλοὶ, os que saíram das cidades. A redação proposta atribui às facções uma ação que o grego atribui às pessoas e altera levemente o sentido.
  revised_text: 'E, para apresentarmos também exemplos das nações: muitos reis e governantes, quando sobreveio alguma calamidade pestilenta, instruídos por oráculos, entregaram-se à morte, a fim de, por meio do próprio sangue, livrar os seus concidadãos. Muitos se retiraram de suas próprias cidades, para que não continuassem a envolver-se em conflitos facciosos.'
