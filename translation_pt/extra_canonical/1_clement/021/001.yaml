- from: Cuidem, amados, para que os muitos benefícios que ele nos concede não se tornem motivo de juízo contra todos nós, caso não vivamos de modo digno dele e não façamos, em concórdia, o que é bom e agradável diante dele.
  to: Cuidem, amados, para que os muitos benefícios que ele nos concede não se tornem juízo contra todos nós, se não nos conduzirmos de modo digno dele e não fizermos, em concórdia, o que é bom e agradável diante dele.
