source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: pt
  text: Cuidem, amados, para que os muitos benefícios que ele nos concede não se tornem juízo contra todos nós, se não nos conduzirmos de modo digno dele e não fizermos, em concórdia, o que é bom e agradável diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Cuidem
  rationale: O imperativo pede atenção vigilante e responsável; «cuidem para que» soa natural em português e preserva a força da advertência.
- source_word: εὐεργεσίαι
  choice: benefícios que ele nos concede
  rationale: O termo designa benefícios ou benfeitorias concedidos por um benfeitor, não apenas dons genéricos. A expansão torna clara a relação implícita sem alterar o referente.
- source_word: εἰς κρίμα
  choice: motivo de juízo contra
  rationale: Expressa que os benefícios podem resultar em juízo desfavorável para os destinatários; «juízo» preserva a linguagem judicial e teológica do grego.
- source_word: πολιτευόμενοι
  choice: vivamos
  rationale: O particípio pode significar conduzir-se ou viver como membro de uma comunidade. «Vivamos» comunica com naturalidade a conduta integral, embora o matiz cívico não possa ser reproduzido plenamente sem tornar a frase pesada.
- source_word: μεθ’ ὁμονοίας
  choice: em concórdia
  rationale: «Concórdia» preserva o vocabulário político-comunitário central da carta e seu contraste com divisão e facção.
theological_decisions:
- issue: Relação entre benefícios divinos, conduta e juízo
  choice: 'Preservar a condição explícita: os benefícios podem tornar-se motivo de juízo se a comunidade não viver dignamente e não praticar o bem em concórdia.'
  alternative: Suavizar a frase como simples exortação à gratidão ou interpretá-la como afirmação sobre mérito salvífico.
  rationale: O texto formula uma advertência moral e judicial sem explicar o mecanismo teológico; a tradução mantém essa tensão e não acrescenta uma doutrina de mérito nem a elimina.
- issue: Referente do pronome αὐτοῦ
  choice: Manter «ele/dele» sem identificar explicitamente Deus ou Cristo.
  alternative: Substituir o pronome por «Deus» ou «Cristo».
  rationale: O versículo grego emprega apenas o pronome, e a tradução deve preservar o referente contextual sem resolver além do que esta unidade textual declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se «concórdia» por sua importância temática e cívica em 1 Clemente; a ordem da frase foi levemente ajustada para fluidez.
