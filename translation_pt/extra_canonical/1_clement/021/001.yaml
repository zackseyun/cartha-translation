    issue: «motivo de juízo» atenua a predicação direta εἰς κρίμα
    rationale: O grego diz que os benefícios podem «tornar-se em juízo» para todos, não apenas fornecer um motivo para um juízo. «Tornem juízo contra todos nós» é mais direto e mantém a advertência.
  - severity: low
    issue: «vivamos» perde parcialmente o matiz de conduta de πολιτευόμενοι
    rationale: Embora seja possível, «nos conduzirmos» expressa mais precisamente a maneira de proceder, inclusive em dimensão comunitária, sem tornar a tradução pesada.
