id: 1CLEM.21.8
reference: 1 Clement 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: pt
  text: Que nossos filhos participem da instrução que há no Messias. Que aprendam quanto vale a humildade diante de Deus[a], o que o amor puro é capaz de fazer diante de Deus e como o temor a ele é bom e grandioso e salva todos os que vivem piedosamente nele[b], com a mente pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanta força a humildade tem diante de Deus”.'
    reason: Preserva uma tradução mais formal de τί ... ἰσχύει, que pode enfatizar a força ou eficácia da humildade.
  - marker: b
    text: “Nele” pode referir-se a Deus; outra tradução possível é “nesse temor”.
    reason: O pronome grego αὐτῷ admite como referente tanto Deus quanto o temor mencionado imediatamente antes.
lexical_decisions:
- source_word: παιδείας
  choice: instrução
  rationale: O termo abrange ensino, formação e disciplina. “Instrução” é natural em português e mantém o sentido formativo sem sugerir apenas castigo.
- source_word: Χριστῷ
  choice: Messias
  rationale: Representa o título grego Χριστός e conserva seu valor messiânico neste contexto.
- source_word: τί ... ἰσχύει
  choice: quanto vale
  rationale: Expressa de modo idiomático a força ou eficácia da humildade perante Deus, sem tratar τί como modificador de “humildade”.
- source_word: ἀγάπη ἁγνή
  choice: amor puro
  rationale: Tradução direta e corrente, preservando a qualificação moral de ἁγνή.
- source_word: ὁ φόβος αὐτοῦ
  choice: o temor a ele
  rationale: No contexto, designa reverência ou temor dirigido a Deus; esta formulação é mais clara em português do que “seu temor”.
- source_word: ὁσίως ἀναστρεφομένους
  choice: vivem piedosamente
  rationale: ἀναστρέφομαι descreve a maneira de viver ou conduzir-se, e ὁσίως indica devoção ou piedade.
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: com a mente pura
  rationale: Mantém o sentido de disposição interior, pensamento ou intenção sem limitar indevidamente o alcance do substantivo.
theological_decisions:
- issue: Referente de ἐν αὐτῷ
  choice: nele, referindo-se primariamente a Deus
  alternative: nesse temor
  rationale: Tanto Deus quanto “temor” são antecedentes gramaticalmente possíveis. O texto principal segue a leitura pessoal e teologicamente natural, enquanto a nota preserva a ambiguidade genuína.
- issue: Sentido de φόβος
  choice: temor a Deus
  alternative: medo de Deus
  rationale: “Temor” preserva a combinação contextual de reverência, grandeza e poder salvador sem reduzir o termo a mero pavor.
- issue: Força de ἰσχύει aplicada à humildade
  choice: quanto vale a humildade
  alternative: quanta força a humildade tem
  rationale: A opção principal comunica eficácia ou valor diante de Deus de forma natural, sem especificar exatamente o tipo de resultado produzido.
translation_notes:
  register: Português moderno, claro e digno, com construção exortativa natural. “Messias” mantém o valor titular de Χριστός. As repetições de “diante de Deus” foram preservadas por seu efeito retórico, e as ambiguidades relevantes foram registradas em notas.
