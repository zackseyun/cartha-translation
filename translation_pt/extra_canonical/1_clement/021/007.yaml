id: 1CLEM.21.7
reference: 1 Clement 21:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: pt
  text: Que mostrem o caráter digno de amor da pureza; que demonstrem a disposição íntegra da sua mansidão; que tornem evidente, por meio do silêncio, o comedimento da sua língua; que ofereçam o seu amor não com favoritismo, mas, de modo piedoso, igualmente a todos os que temem a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιαγάπητον
  choice: amável
  rationale: Expressa aquilo que é digno de amor ou estima, qualificando de modo natural o caráter da pureza.
- source_word: ἁγνείας
  choice: pureza
  rationale: Preserva o sentido moral de ἁγνεία sem restringi-lo indevidamente apenas à castidade sexual.
- source_word: ἀκέραιον
  choice: íntegra
  rationale: Comunica inteireza, sinceridade e ausência de mistura ou duplicidade.
- source_word: βούλημα
  choice: intenção
  rationale: Neste contexto, designa a orientação da vontade ou propósito interior manifestado na mansidão.
- source_word: πραΰτητος
  choice: mansidão
  rationale: Termo corrente no registro bíblico português para brandura e ausência de agressividade.
- source_word: ἐπιεικὲς
  choice: moderação
  rationale: No contexto da língua controlada pelo silêncio, indica comedimento, brandura e domínio próprio.
- source_word: προσκλίσεις
  choice: favoritismo
  rationale: O plural grego indica inclinações parciais ou preferências por certas pessoas; 'favoritismo' transmite isso de modo claro e idiomático.
- source_word: ὁσίως
  choice: de modo santo
  rationale: Mantém o valor adverbial e o sentido de conduta piedosa ou santa diante de Deus.
theological_decisions:
- issue: Âmbito de ἁγνεία
  choice: pureza
  alternative: castidade
  rationale: O contexto exorta à conduta comunitária em sentido amplo; 'pureza' preserva essa extensão e não impõe uma leitura exclusivamente sexual.
- issue: Relação sintática de ὁσίως
  choice: Ligado à maneira de oferecer amor igual a todos
  alternative: Ligado aos que temem a Deus ('os que santamente temem a Deus')
  rationale: 'A posição permite alguma tensão, mas a leitura adverbial com παρεχέτωσαν produz uma exortação natural: oferecer o amor de maneira santa e igual. A formulação evita transformar ὁσίως em adjetivo.'
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo exortativo preservado. Emprega 'que' com subjuntivo para reproduzir os imperativos de terceira pessoa e mantém a sequência retórica do grego.
