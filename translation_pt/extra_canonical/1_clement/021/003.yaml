id: 1CLEM.21.3
reference: 1 Clement 21:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: pt
  text: Vejamos quão perto ele está e que nenhum dos nossos pensamentos nem dos raciocínios que formulamos lhe tenha escapado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Vejamos
  rationale: Mantém a exortação deliberativa do subjuntivo aoristo e soa natural em português.
- source_word: ἐγγύς
  choice: perto
  rationale: Equivalente direto e corrente para a proximidade expressa no grego, sem especificar se é espacial, temporal ou relacional.
- source_word: ἐννοιῶν
  choice: pensamentos
  rationale: Expressa de modo amplo e natural os conteúdos da mente; a possível nuance de 'intenções' é registrada em nota.
- source_word: διαλογισμῶν ὧν ποιούμεθα
  choice: raciocínios que formulamos
  rationale: Reproduz a atividade mental indicada por διαλογισμοί e o sentido produtivo de ποιούμεθα, evitando uma formulação excessivamente coloquial.
- source_word: οὐδὲν λέληθεν αὐτόν
  choice: nada ... lhe passa despercebido
  rationale: Comunica idiomaticamente que nada permanece fora do conhecimento dele; o presente português expressa o estado resultante sugerido pelo perfeito grego.
theological_decisions:
- issue: Natureza da proximidade indicada por ἐγγύς
  choice: quão perto ele está
  alternative: como está próximo
  rationale: A formulação preserva a indefinição do texto quanto a uma proximidade espacial, temporal ou relacional, sem inserir interpretação teológica.
- issue: Objeto do conhecimento divino
  choice: nada dos nossos pensamentos, nem dos raciocínios que formulamos
  alternative: nenhum dos nossos pensamentos ou raciocínios
  rationale: Mantém a distinção entre ἐννοίαι e διαλογισμοί e a abrangência de οὐδὲν, sem fundir os dois termos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão grega, mas usa a expressão idiomática 'passar despercebido' para evitar rigidez.
