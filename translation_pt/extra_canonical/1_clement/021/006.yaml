id: 1CLEM.21.6
reference: 1 Clement 21:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: pt
  text: Tenhamos reverência pelo Senhor Jesus Cristo[a], cujo sangue foi dado por nós; respeitemos os que vão à nossa frente; honremos os presbíteros[b]; eduquemos os jovens na disciplina do temor de Deus; orientemos nossas esposas[c] para o que é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Senhor Jesus, o Messias”.
    reason: Explicita o sentido titular de Χριστός como alternativa legítima a “Cristo”.
  - marker: b
    text: Ou “os mais velhos”.
    reason: πρεσβυτέρους pode designar presbíteros ou, em sentido mais geral, pessoas mais velhas.
  - marker: c
    text: Ou “nossas mulheres”.
    reason: γυναῖκας pode significar tanto “esposas” como “mulheres”, embora o contexto favoreça “esposas”.
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: tenhamos reverência
  rationale: O verbo pode expressar respeito reverente ou consideração que leva alguém a conter-se; a formulação portuguesa preserva a solenidade sem introduzir a ideia mais forte de adoração.
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: os que vão à nossa frente
  rationale: Reproduz o sentido básico de προηγέομαι sem decidir se se trata necessariamente de líderes formalmente instituídos.
- source_word: τοὺς πρεσβυτέρους
  choice: os presbíteros
  rationale: No contexto eclesial de 1 Clemente, o termo provavelmente designa os presbíteros, embora também possa ser entendido de modo mais geral como pessoas mais velhas; a nota preserva essa possibilidade.
- source_word: τοὺς νέους
  choice: os jovens
  rationale: νέους é a forma positiva, 'jovens', e não o comparativo 'mais jovens'.
- source_word: παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ
  choice: eduquemos ... na disciplina do temor de Deus
  rationale: Mantém a relação entre o verbo de educar e o substantivo παιδεία, em português natural, sem restringir o genitivo a uma única relação lógica.
- source_word: τὰς γυναῖκας ἡμῶν
  choice: nossas esposas
  rationale: γυναῖκας pode significar mulheres ou esposas; o possessivo e o contexto doméstico favorecem 'esposas'.
- source_word: ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα
  choice: orientemos ... para o que é bom
  rationale: Expressa direção e formação moral construtiva, evitando que 'corrijamos' sugira necessariamente uma falta já cometida.
theological_decisions:
- issue: Sentido de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: '''Cristo'' é a forma portuguesa tradicional e natural do título grego; a nota registra seu valor messiânico sem transformar o título em nome próprio opaco.'
- issue: Identidade dos προηγούμενοι
  choice: os que vão à nossa frente
  alternative: os que nos lideram
  rationale: A tradução conserva a possibilidade de liderança, mas não impõe que o termo designe um cargo eclesiástico formal.
- issue: Valor do genitivo em παιδεία τοῦ φόβου τοῦ θεοῦ
  choice: disciplina do temor de Deus
  alternative: disciplina que procede do temor de Deus
  rationale: A construção grega permite mais de uma relação entre disciplina e temor; a versão principal preserva essa tensão em vez de escolher uma explicação causal.
translation_notes:
  register: Português moderno, digno e acessível, com sequência de exortações na primeira pessoa do plural. O paralelismo do grego foi preservado por verbos no subjuntivo exortativo. A pontuação com ponto e vírgula mantém a cadência da enumeração.
