id: 1CLEM.21.5
reference: 1 Clement 21:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: pt
  text: Antes, ofendamos homens insensatos e sem entendimento, que se exaltam e se gabam na arrogância de sua fala, em vez de ofendermos a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκόψωμεν
  choice: tropecemos em
  rationale: Preserva a imagem verbal de tropeçar ou chocar-se contra alguém, bem como a regência repetida com ἐν/πρός implícita na comparação, sem reduzir o sentido apenas a ‘ofender’.
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: insensatos e sem entendimento
  rationale: 'Mantém os dois qualificativos gregos distintos: falta de sensatez e falta de compreensão.'
- source_word: ἐπαιρομένοις
  choice: se exaltam
  rationale: Expressa o sentido de elevar-se com orgulho; é natural em português e evita uma metáfora corporal pouco clara.
- source_word: ἐγκαυχωμένοις
  choice: se gabam
  rationale: Comunica a ideia de vangloriar-se, com tom negativo adequado ao contexto.
- source_word: ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: na arrogância de suas palavras
  rationale: λόγος pode indicar fala, discurso ou palavra; o plural idiomático em português transmite aqui a maneira arrogante de falar sem restringir indevidamente a um discurso formal.
theological_decisions:
- issue: Objeto preferível do tropeço ou confronto
  choice: do que em Deus
  alternative: em vez de ofendermos a Deus
  rationale: Conserva a comparação concisa do grego e sua metáfora de προσκόπτω, sem acrescentar uma segunda forma verbal nem transformar explicitamente o sentido em mera ofensa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção exortativa inclusiva. A ordem e a tensão da comparação grega foram preservadas, embora a frase seja marcada e enfática em português.
