  text: ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: pt
  text: Pois ele examina os pensamentos e as intenções; seu sopro está em nós e, quando quiser, ele o tirará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: examina
  rationale: O substantivo designa aquele que perscruta ou sonda. A formulação verbal é mais natural em português moderno e preserva a ideia de investigação profunda.
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  choice: os pensamentos e as intenções
  rationale: A dupla se refere ao conteúdo interior da mente e às ponderações ou propósitos. Esta tradução mantém dois termos distintos sem impor uma diferenciação excessivamente técnica.
- source_word: πνοή
  choice: sopro
  rationale: Mantém a imagem concreta de respiração ou fôlego vital, em vez de explicitar interpretativamente como 'vida' ou 'espírito'.
- source_word: ἀνελεῖ
  choice: tirará
  rationale: No contexto, o verbo significa retirar ou tomar o sopro. 'Tirará' é claro e preserva a referência pronominal ao sopro.
theological_decisions:
- issue: Identidade do referente divino
  choice: Manter o pronome 'ele' sem acrescentar 'Deus'
  alternative: Explicitar 'Deus'
  rationale: O grego usa referência pronominal implícita pelo contexto; explicitar o nome resolveria algo que este versículo não declara diretamente.
- issue: Sentido de πνοή
  choice: Traduzir como 'sopro'
  alternative: Traduzir como 'vida', 'fôlego de vida' ou 'espírito'
  rationale: A opção preserva a metáfora e evita decidir se o termo deve ser entendido estritamente como respiração, vida ou espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O ponto e vírgula conserva a unidade e a progressão da frase grega.
