  language: pt
  text: É justo, portanto, que não desertemos da vontade dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é um termo militar que pode significar “abandonar o posto” ou “ser desertor”.
    reason: Preserva para o leitor a força da metáfora militar de λειποτακτεῖν, que a tradução concisa “desertemos” pode não comunicar por completo.
lexical_decisions:
- source_word: λειποτακτεῖν
  choice: desertemos
  rationale: O verbo tem sentido militar de abandonar o posto ou desertar. “Desertemos da” preserva essa imagem e a construção com ἀπό, sem tornar a frase artificial em português.
- source_word: θελήματος
  choice: vontade
  rationale: Equivalente direto e natural de θέλημα neste contexto, mantendo a referência à vontade de Deus sem explicitação interpretativa adicional.
