source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ που· Πνεῦμα κυρίου λύχνος ἐρευνῶν τὰ ταμιεῖα τῆς γαστρός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/002.yaml
  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
translation:
  language: pt
  text: 'Pois em algum lugar se diz: “O Espírito do Senhor é uma lâmpada que sonda as câmaras interiores[a] do ventre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depósitos”.
    reason: ταμιεῖα admite tanto o sentido de aposentos interiores ou reservados quanto o de locais de armazenamento.
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Pois em algum lugar se diz
  rationale: Reproduz a fórmula indefinida de citação e mantém a ligação explicativa expressa por γάρ.
- source_word: Πνεῦμα κυρίου
  choice: O Espírito do Senhor
  rationale: Tradução direta do sintagma grego, sem alterar a identificação textual do espírito como pertencente ao Senhor.
- source_word: λύχνος
  choice: uma lâmpada
  rationale: Equivalente corrente para a pequena fonte de luz designada por λύχνος; o artigo indefinido é natural em português no predicativo.
- source_word: ἐρευνῶν
  choice: que sonda
  rationale: O particípio masculino concorda gramaticalmente com λύχνος; a oração relativa preserva a imagem de uma lâmpada que examina profundamente.
- source_word: τὰ ταμιεῖα τῆς γαστρός
  choice: as câmaras interiores do ventre
  rationale: ταμιεῖα pode designar depósitos ou aposentos reservados; no contexto, 'câmaras interiores' comunica os recônditos ocultos da pessoa, enquanto 'ventre' preserva a metáfora corporal de γαστήρ.
theological_decisions:
- issue: Agente da sondagem em ἐρευνῶν
  choice: A oração relativa modifica “lâmpada”
  alternative: Entender “o Espírito do Senhor” diretamente como aquele que sonda
  rationale: A concordância masculina singular de ἐρευνῶν aponta formalmente para λύχνος, também masculino, e não para πνεῦμα, que é neutro; a formulação evita apagar essa estrutura, embora a lâmpada continue sendo predicada do Espírito do Senhor.
- issue: Imagem antropológica de γαστήρ
  choice: Preservar “ventre”
  alternative: Explicitar como “íntimo do ser humano” ou “coração”
  rationale: A equivalência literal conserva a antiga imagem corporal do interior oculto da pessoa e evita substituir o termo por uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conserva-se a metáfora corporal incomum do original, e a alternativa lexical de ταμιεῖα é registrada em nota.
