source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰακὼβ μετὰ ταπεινοφροσύνης ἐξεχώρησεν τῆς γῆς αὐτοῦ δι’ ἀδελφὸν καὶ ἐπορεύθη πρὸς Λαβὰν καὶ ἐδούλευσεν, καὶ ἐδόθη αὐτῷ τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: pt
  text: Jacó, com humildade, partiu de sua terra por causa de seu irmão, foi até Labão e o serviu; e a ele foram dadas as doze tribos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa uma expressão incomum, algo como “o [povo] dos doze cetros de Israel”. No uso bíblico, “cetro” também pode evocar “tribo”.
    reason: Preserva na nota a imagem peculiar de δωδεκάσκηπτρον, sem alegar uma literalidade que introduza elementos não expressos e sem sacrificar a naturalidade do texto principal.
lexical_decisions:
- source_word: ταπεινοφροσύνης
  choice: humildade
  rationale: Expressa diretamente a atitude de modéstia ou humildade indicada pelo substantivo grego, em registro natural e digno.
- source_word: δι’ ἀδελφὸν
  choice: por causa de seu irmão
  rationale: Preserva a relação causal do grego sem especificar além do texto a natureza do conflito com o irmão.
- source_word: ἐδούλευσεν
  choice: o serviu
  rationale: Mantém o sentido de prestar serviço a Labão e explicita o objeto naturalmente inferido do contexto imediato.
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: as doze tribos de Israel
  rationale: O composto raro significa literalmente algo como 'o conjunto dos doze cetros'; porém, no uso bíblico grego, 'cetro' reproduz a associação semítica entre cetro e tribo. 'As doze tribos de Israel' comunica o referente reconhecível, enquanto a nota preserva a forma incomum do original.
theological_decisions:
- issue: Se a concessão das doze tribos a Jacó deve ser entendida como descendência, povo ou autoridade régia
  choice: Manter a formulação concisa 'a ele foram dadas as doze tribos de Israel'
  alternative: Explicitar 'foi-lhe dada a descendência que formou as doze tribos' ou 'o povo dos doze cetros'
  rationale: O grego não explica o mecanismo nem desenvolve uma doutrina específica de descendência ou realeza; a tradução conserva a afirmação sem acrescentar interpretação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A coordenação foi levemente ajustada com ponto e vírgula para clareza, sem alterar a sequência narrativa do grego.
