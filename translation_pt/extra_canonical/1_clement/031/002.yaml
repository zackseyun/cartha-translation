  text: τίνος χάριν ηὐλογήθη ὁ πατὴρ ἡμῶν Ἀβραάμ, οὐχὶ δικαιοσύνην καὶ ἀλήθειαν διὰ πίστεως ποιήσας;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/002.yaml
  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: pt
  text: Por que razão foi abençoado nosso pai Abraão? Não foi por ter praticado a justiça e a verdade por meio da fé?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: Por que razão
  rationale: Expressa de modo natural a pergunta causal do grego, mantendo o tom retórico.
- source_word: ηὐλογήθη
  choice: foi abençoado
  rationale: Preserva a voz passiva e o sentido religioso corrente de εὐλογέω.
- source_word: ὁ πατὴρ ἡμῶν Ἀβραάμ
  choice: nosso pai Abraão
  rationale: Mantém a formulação relacional do original em ordem natural no português.
- source_word: δικαιοσύνην καὶ ἀλήθειαν ... ποιήσας
  choice: ter praticado a justiça e a verdade
  rationale: Embora ποιέω seja literalmente 'fazer', 'praticar a justiça e a verdade' comunica em português corrente a realização concreta dessas virtudes sem tornar a frase artificial.
- source_word: διὰ πίστεως
  choice: por meio da fé
  rationale: Preserva o valor instrumental ou mediador de διά com genitivo, sem definir além do que o texto afirma a relação entre fé e conduta.
theological_decisions:
- issue: Relação entre fé, justiça e verdade na bênção de Abraão
  choice: por ter praticado a justiça e a verdade por meio da fé
  alternative: porque fez justiça e verdade pela fé
  rationale: A tradução conserva a afirmação de que as ações foram realizadas mediante a fé, sem converter o verso numa formulação sistemática sobre mérito, causa da justificação ou ordem da salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura retórica clara. 'Praticado' evita o pouco idiomático 'feito a justiça e a verdade', ao mesmo tempo que mantém a dimensão ativa do particípio ποιήσας.
