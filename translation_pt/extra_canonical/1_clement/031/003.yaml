  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: pt
  text: Isaque, sabendo com confiança o que estava por vir, apresentou-se de bom grado para o sacrifício.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: com confiança
  rationale: Expressa de modo direto a segurança ou convicção que acompanha o saber, mantendo sua ligação natural com γινώσκων.
- source_word: γινώσκων τὸ μέλλον
  choice: sabendo ... o que estava por vir
  rationale: Reproduz o particípio e preserva a referência aberta ao futuro, sem especificar acontecimentos que o grego não explicita.
- source_word: ἡδέως
  choice: de bom grado
  rationale: Comunica disposição voluntária e favorável em registro digno e corrente.
- source_word: προσήγετο θυσία
  choice: apresentou-se ... como sacrifício
  rationale: Reflete a forma média/passiva de προσάγω e a ideia cultual de ser apresentado ou aproximar-se como oferta, sem tornar explícito um objeto reflexivo ausente do grego.
theological_decisions:
- issue: Agência de Isaque ao ser levado ou apresentado para o sacrifício
  choice: apresentou-se de bom grado como sacrifício
  alternative: foi levado de bom grado para o sacrifício
  rationale: A forma προσήγετο admite nuance média ou passiva. A redação escolhida preserva a disposição voluntária indicada por ἡδέως e a agência sugerida pelo contexto, sem afirmar simplesmente que Isaque realizou o ato sacrificial sobre si mesmo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem de «com confiança» evita que a expressão pareça modificar «o que estava por vir».
