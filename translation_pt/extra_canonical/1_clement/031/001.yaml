source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: pt
  text: Apeguemo-nos, portanto, à bênção dele e vejamos quais são os caminhos da bênção. Desenrolemos o que aconteceu desde o princípio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: Apeguemo-nos
  rationale: Expressa a ideia de aderir ou manter-se firmemente ligado, de modo natural e digno em português.
- source_word: τῇ εὐλογίᾳ αὐτοῦ
  choice: à bênção dele
  rationale: Preserva o singular e o pronome do grego sem explicitar um referente que o versículo apenas pressupõe.
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  choice: os caminhos da bênção
  rationale: Mantém a metáfora plural de ὁδοί e a repetição lexical de εὐλογία.
- source_word: ἀνατυλίξωμεν
  choice: Desenrolemos o relato
  rationale: Conserva a imagem de desenrolar, provavelmente associada à abertura de um rolo para examinar uma narrativa, acrescentando “o relato” para produzir português inteligível.
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: dos acontecimentos desde o princípio
  rationale: Traduz substantivamente o particípio γενόμενα e preserva a referência temporal abrangente de ἀπ’ ἀρχῆς.
theological_decisions:
- issue: Referente de αὐτοῦ (“dele”)
  choice: Manter “dele”
  alternative: Explicitar “de Deus”
  rationale: O grego emprega um pronome; manter a forma pronominal evita inserir no versículo uma explicitação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência exortativa. A repetição de “bênção” e a metáfora dos “caminhos” foram preservadas; “desenrolemos o relato” mantém a imagem antiga sem soar ininteligível.
