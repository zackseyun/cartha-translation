id: 1CLEM.16.11
reference: 1 Clement 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐὰν δῶτε περὶ ἁμαρτίας, ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/011.yaml
  text: 'If you give for sin,

    your soul will see long-lived offspring[a].'
translation:
  language: pt
  text: 'Se vocês derem uma oferta pelo pecado,[a]

    a sua alma verá uma descendência de longa vida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «derem pelo pecado»; no uso sacrificial da Septuaginta, a expressão normalmente se refere a uma oferta pelo pecado.
    reason: Explica o substantivo implícito acrescentado no texto e preserva acesso à forma concisa e potencialmente ambígua do grego.
lexical_decisions:
- source_word: δῶτε περὶ ἁμαρτίας
  choice: derem uma oferta pelo pecado
  rationale: A expressão περὶ ἁμαρτίας é uma fórmula sacrificial bem estabelecida na Septuaginta. Embora o substantivo «oferta» esteja implícito, explicitá-lo evita que «derem pelo pecado» soe obscuro ou seja entendido como dar em favor do pecado.
- source_word: ἡ ψυχὴ ὑμῶν
  choice: a sua alma
  rationale: Mantém o singular de ψυχή e o possessivo referente ao grupo («de vocês»), preservando a forma incomum do grego sem tornar a frase ininteligível.
- source_word: σπέρμα μακρόβιον
  choice: uma descendência de longa vida
  rationale: σπέρμα pode significar «semente» ou, neste contexto, «descendência»; μακρόβιον indica vida longa ou duradoura. A formulação mantém a referência coletiva e evita reduzir o termo a um único descendente.
theological_decisions:
- issue: Natureza daquilo que é dado em relação ao pecado
  choice: uma oferta pelo pecado
  alternative: pelo pecado
  rationale: O contexto e o uso idiomático da Septuaginta favorecem uma oferta sacrificial, mas a nota registra que «oferta» não aparece como substantivo expresso no grego.
- issue: Sentido de σπέρμα
  choice: descendência
  alternative: semente
  rationale: «Descendência» comunica o sentido humano coletivo mais provável sem decidir se a expressão tem uma aplicação individual, corporativa ou messiânica.
translation_notes:
  register: Português moderno, claro e digno, com formas de ampla legibilidade no Brasil. A construção mantém a alternância do plural «vocês» com o singular coletivo «alma», presente no original.
