  text: πάντες ὡς πρόβατα ἐπλανήθημεν, ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
translation:
  language: pt
  text: 'Todos nós nos desviamos como ovelhas[a];

    cada um se desviou pelo seu próprio caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como ovelhas, todos nós nos desviamos”.'
    reason: Registra a ordem alternativa das palavras já reconhecida na camada de consulta inglesa, sem alterar o sentido.
lexical_decisions:
- source_word: ἐπλανήθημεν / ἐπλανήθη
  choice: nos desviamos / se desviou
  rationale: Expressa naturalmente o sentido de afastar-se do caminho certo e preserva a repetição verbal do grego.
- source_word: ἄνθρωπος
  choice: cada um
  rationale: Embora esteja no singular, o termo tem aqui sentido distributivo após πάντες; “cada um” comunica isso com clareza em português sem restringir a referência ao sexo masculino.
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: pelo seu próprio caminho
  rationale: Mantém a imagem do caminho e explicita de modo idiomático o valor possessivo e individualizador da expressão grega.
theological_decisions:
- issue: Universalidade e responsabilidade individual
  choice: Preservar tanto “todos nós” quanto “cada um”
  alternative: Uniformizar as duas orações no plural
  rationale: O texto combina a condição coletiva de desvio com sua expressão individual; a tradução mantém essa tensão sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A estrutura poética em duas linhas e a repetição de “desviamos/desviou” refletem o paralelismo do grego.
