id: 1CLEM.16.17
reference: 1 Clement 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: pt
  text: Vejam[a], queridos amigos, qual é o modelo que nos foi dado. Pois, se o Senhor assim se humilhou, o que devemos fazer nós, que, por meio dele, chegamos a estar sob o jugo de sua graça?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês veem, queridos amigos, qual é o modelo que nos foi dado”.'
    reason: A forma grega ὁρᾶτε pode ser lida formalmente como imperativo ou indicativo; o contexto retórico favorece o imperativo.
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Vejam
  rationale: Preserva o valor imperativo presente e plural, pelo qual Clemente dirige a atenção dos leitores ao exemplo apresentado.
- source_word: ἄνδρες ἀγαπητοί
  choice: amados
  rationale: Em português, o vocativo simples é natural e inclusivo no contexto comunitário; traduzir literalmente por “homens amados” soaria marcado e menos idiomático.
- source_word: ὑπογραμμός
  choice: modelo
  rationale: Expressa um padrão ou exemplo oferecido para imitação, sem restringir a imagem ao sentido literal de traçado ou cópia.
- source_word: ἐταπεινοφρόνησεν
  choice: se humilhou
  rationale: Comunica a atitude de humildade assumida pelo Senhor no contexto, mantendo a forma reflexiva natural em português.
- source_word: ζυγὸν τῆς χάριτος
  choice: jugo de sua graça
  rationale: Mantém a metáfora concreta do jugo e sua tensão com a graça, sem explicá-la ou suavizá-la.
theological_decisions:
- issue: A relação expressa por δι’ αὐτοῦ
  choice: por meio dele
  alternative: por ele
  rationale: Torna explícito o sentido instrumental ou mediador da preposição sem acrescentar uma interpretação doutrinária.
- issue: A metáfora de estar sob o jugo da graça
  choice: viemos para debaixo do jugo de sua graça
  alternative: passamos a estar sob o jugo de sua graça
  rationale: Conserva tanto o movimento indicado por ἐλθόντες quanto a metáfora paradoxal do jugo ligado à graça.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formas naturais de ampla compreensão e boa legibilidade brasileira. O imperativo “Vejam” preserva a exortação retórica; “jugo” mantém a imagem bíblica e a tensão teológica do original.
