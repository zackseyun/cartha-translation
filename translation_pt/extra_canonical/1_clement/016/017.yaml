revisions:
- from: Vejam[a], amados, qual é o modelo que nos foi dado. Pois, se o Senhor assim se humilhou, que faremos nós, que por meio dele viemos para debaixo do jugo de sua graça?
  to: Vejam[a], queridos amigos, qual é o modelo que nos foi dado. Pois, se o Senhor assim se humilhou, o que devemos fazer nós, que, por meio dele, chegamos a estar sob o jugo de sua graça?
  rationale: A revisão torna mais idiomática a expressão da chegada a uma condição de sujeição («chegamos a estar sob»), explicita melhor a pergunta deliberativa e melhora o vocativo em português moderno. Conserva a exortação imperativa, a metáfora do jugo e a ambiguidade formal assinalada pela nota.
