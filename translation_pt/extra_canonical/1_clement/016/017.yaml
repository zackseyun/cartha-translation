review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o imperativo exortativo de ὁρᾶτε, o sentido de ὑπογραμμός como padrão para imitação, a auto-humilhação do Senhor e a metáfora do jugo da graça. Contudo, «por meio dele viemos para debaixo» é uma reprodução demasiado literal e pouco idiomática de δι’ αὐτοῦ ... ἐλθόντες ὑπὸ, e «que faremos nós?» é menos preciso como pergunta deliberativa do que «o que devemos fazer?»
  naturalness: «Vejam» e «modelo» são naturais. «Amados» é possível como vocativo, mas «queridos amigos» comunica de modo mais corrente a saudação ἄνδρες ἀγαπητοί sem introduzir a categoria eclesial de «irmãos». «Chegamos a estar sob» preserva o movimento de ἐλθόντες e soa natural em português contemporâneo.
  terminology: «Senhor», «se humilhou», «jugo» e «graça» são escolhas apropriadas e mantêm os termos e a imagem do original. A nota alternativa deve conservar a possibilidade formal de leitura indicativa de ὁρᾶτε, embora o contexto favoreça claramente o imperativo.
  issues:
  - severity: medium
    issue: Construção pouco idiomática para δι’ αὐτοῦ ... ἐλθόντες ὑπὸ τὸν ζυγόν
    rationale: «Viemos para debaixo do jugo» decalca a sequência grega e é inteligível, mas não é a formulação portuguesa mais natural. «Por meio dele chegamos a estar sob o jugo» conserva tanto a mediação quanto a mudança de condição.
  - severity: low
    issue: Pergunta deliberativa vertida como futuro simples
    rationale: ποίήσωμεν é subjuntivo aoristo deliberativo. «O que devemos fazer?» representa mais diretamente a força exortativa e deliberativa que «que faremos nós?».
  - severity: low
    issue: Vocativo «amados» não explicita o elemento ἄνδρες
    rationale: Embora «amados» seja possível, «queridos amigos» é uma saudação portuguesa mais natural e comunica o tratamento afetuoso dirigido aos homens presentes sem a rigidez pouco idiomática de «homens amados».
