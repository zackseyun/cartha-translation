  yaml_path: translation/extra_canonical/1_clement/016/001.yaml
  text: For the Messiah belongs to the humble-minded, not to those who exalt themselves over his flock.
translation:
  language: pt
  text: Pois Cristo pertence aos humildes, não aos que se exaltam sobre o seu rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
