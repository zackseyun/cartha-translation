lexical_decisions:
- source_word: ταπεινοφρονούντων
  choice: aos humildes
  rationale: Expressa de modo natural o genitivo de pertencimento e a ideia de quem tem uma atitude humilde, sem o peso artificial de «humildes de pensamento».
- source_word: ὁ Χριστός
  choice: Cristo
  rationale: No contexto cristão de 1 Clemente, «Cristo» é a forma portuguesa corrente e adequada para o título grego.
- source_word: ἐπαιρομένων
  choice: dos que se exaltam
  rationale: Conserva o sentido de elevar-se com orgulho ou arrogância.
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: o seu rebanho
  rationale: Mantém a metáfora pastoral do texto grego estabelecido, referindo-se à comunidade de Cristo.
theological_decisions:
- issue: Relação expressa pelo genitivo em «ταπεινοφρονούντων ... ὁ Χριστός»
  choice: Cristo pertence aos humildes
  alternative: Cristo é dos que têm uma atitude humilde
  rationale: A formulação preserva a afirmação forte de pertencimento sem explicar além do que o grego diz.
- issue: Referente de «seu» em «seu rebanho»
  choice: Manter «seu», com referência natural a Cristo
  alternative: o rebanho de Cristo
  rationale: Preserva a forma pronominal do original e não altera a relação teológica apresentada.
