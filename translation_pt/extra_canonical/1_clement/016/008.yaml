source:
  edition: Funk 1901 (normalized OCR)
  text: τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ . ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤκει εἰς θάνατον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: pt
  text: 'Quem contará a sua geração?


    Pois a sua vida é tirada da terra.


    Por causa das transgressões do meu povo, ele veio à morte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰν
  choice: geração
  rationale: Preserva a amplitude do grego, que pode se referir à geração, linhagem ou contemporâneos, sem resolver a ambiguidade.
- source_word: διηγήσεται
  choice: contará
  rationale: Verbo natural em português que mantém o sentido de relatar ou expor.
- source_word: αἴρεται
  choice: é tirada
  rationale: Reproduz a forma passiva e o sentido de remoção da vida da terra.
- source_word: ἀνομιῶν
  choice: transgressões
  rationale: Expressa atos contrários à lei sem restringir o termo a uma formulação jurídica moderna.
- source_word: ἤκει εἰς θάνατον
  choice: chegou à morte
  rationale: Mantém a construção incomum do texto grego de Clemente, em vez de harmonizá-la com outras formas textuais de Isaías 53:8.
theological_decisions:
- issue: Referente de «sua geração»
  choice: Manter «sua geração» sem explicação interpretativa no corpo do texto
  alternative: Traduzir como «sua descendência», «sua linhagem» ou «seus contemporâneos»
  rationale: O grego é genuinamente ambíguo, e uma especificação resolveria indevidamente uma questão interpretativa.
- issue: Relação causal na morte
  choice: «Por causa das transgressões do meu povo»
  alternative: «Pelas transgressões do meu povo» ou uma formulação que indique substituição penal de modo explícito
  rationale: A tradução conserva a causalidade expressa por ἀπό sem acrescentar uma teoria específica da expiação.
translation_notes:
  register: Português moderno, claro e digno, com disposição poética correspondente à citação. A formulação «chegou à morte» é deliberadamente literal para preservar a leitura particular atestada no texto grego fornecido.
