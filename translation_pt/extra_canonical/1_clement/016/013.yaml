source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: pt
  text: 'Por isso, ele herdará muitos,

    e repartirá os despojos dos fortes,

    porque a sua alma foi entregue à morte,

    e ele foi contado entre os que não têm lei;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλούς
  choice: herdará muitos
  rationale: Mantém a imagem jurídica e bíblica de receber pessoas como herança, sem substituir o verbo por uma interpretação como “receberá”.
- source_word: τῶν ἰσχυρῶν μεριεῖ σκῦλα
  choice: repartirá os despojos dos fortes
  rationale: Conserva a imagem de vitória e distribuição de espólios; o genitivo pode indicar os fortes a quem pertenciam os despojos.
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: a sua alma
  rationale: Traduz diretamente ψυχή e preserva a formulação tradicional da citação, embora no contexto possa significar a própria vida ou pessoa.
- source_word: τοῖς ἀνόμοις
  choice: os que não têm lei
  rationale: Reproduz o sentido de ἄνομος de modo transparente, sem restringi-lo antecipadamente a “criminosos” ou “transgressores”.
theological_decisions:
- issue: Sentido de κληρονομήσει πολλούς
  choice: herdará muitos
  alternative: receberá muitos como sua porção
  rationale: A tradução escolhida preserva a metáfora de herança e a possível tensão teológica do texto, em vez de explicá-la no corpo da tradução.
- issue: Sentido de ψυχή em relação à morte
  choice: a sua alma foi entregue à morte
  alternative: a sua vida foi entregue à morte
  rationale: Mantém a correspondência lexical e a linguagem da citação; não decide se ψυχή deve ser entendida ontologicamente como “alma” ou idiomaticamente como “vida”.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com cadência poética correspondente às quatro unidades gregas. A pontuação final em ponto e vírgula preserva a continuidade formal da citação no contexto.
