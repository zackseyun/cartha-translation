source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: pt
  text: 'E o Senhor o entregou por nossos pecados,


    e ele, por ter sido maltratado,


    não abre a boca.


    Como ovelha, foi levado ao matadouro;


    e, como cordeiro mudo diante de quem o tosquia,


    assim não abre a boca.


    Na sua humilhação, o seu julgamento foi retirado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν
  choice: entregou
  rationale: Preserva o sentido de entregar alguém ao sofrimento ou à morte, sem especificar além do texto o agente humano ou o mecanismo dessa entrega.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: por causa dos nossos pecados
  rationale: Expressa aqui a relação causal entre os pecados e a entrega, de modo natural em português, sem excluir as implicações representativas do contexto.
- source_word: διὰ τὸ κεκακῶσθαι
  choice: por ter sido maltratado
  rationale: O infinitivo perfeito passivo indica que ele sofreu maus-tratos; a formulação mantém a relação causal e evita o português menos corrente 'por ter sido afligido'.
- source_word: τοῦ κείραντος
  choice: de quem o tosquia
  rationale: Traduz naturalmente o particípio substantivado e explicita o objeto implícito da tosquia sem acrescentar uma identidade ao tosquiador.
- source_word: ἡ κρίσις αὐτοῦ ἤρθη
  choice: o seu julgamento foi retirado
  rationale: Mantém a formulação passiva e a ambiguidade de κρίσις, que pode envolver julgamento, justiça ou decisão judicial, sem resolver interpretativamente a expressão.
theological_decisions:
- issue: Sentido de ὑπέρ na entrega pelos pecados
  choice: por causa dos nossos pecados
  alternative: em favor dos nossos pecados / pelos nossos pecados
  rationale: Em português, 'em favor dos pecados' seria enganoso, enquanto 'por causa de' comunica com clareza que os pecados motivam a entrega sem definir uma teoria específica de expiação.
- issue: Interpretação de κρίσις na humilhação
  choice: julgamento
  alternative: justiça / condenação
  rationale: A escolha preserva a amplitude semântica e a tensão da citação, evitando decidir se o texto fala de justiça negada, processo judicial removido ou sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com disposição em linhas para refletir o caráter poético da citação. Empregou-se 'ovelha' para πρόβατον e 'cordeiro' para ἀμνός, preservando a distinção lexical. Não foram necessárias notas de rodapé.
