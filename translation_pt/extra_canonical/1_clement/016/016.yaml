source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: pt
  text: 'Todos os que me viram zombaram de mim;


    falaram com os lábios,


    balançaram a cabeça:


    “Ele confiou no Senhor; que o Senhor o livre;


    que o salve, pois se agrada dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωροῦντές
  choice: viam
  rationale: O particípio presente, ligado ao aoristo ἐξεμυκτήρισάν, descreve os que contemplavam o personagem; o imperfeito em português evita uma colisão temporal pouco natural e preserva o aspecto circunstancial.
- source_word: ἐξεμυκτήρισάν
  choice: zombavam de
  rationale: Expressa escárnio ou ridicularização; o imperfeito harmoniza naturalmente com “viam” no relato poético.
- source_word: ἐκίνησαν κεφαλήν
  choice: balançavam a cabeça
  rationale: O singular grego é distributivo. Em português, “a cabeça” também funciona naturalmente com sujeito plural e preserva a imagem idiomática.
- source_word: ἤλπισεν ἐπὶ κύριον
  choice: confiou no Senhor
  rationale: Ἐλπίζω ἐπί, neste contexto, denota depositar esperança ou confiança em alguém; “confiou no Senhor” é claro e idiomático.
- source_word: ῥυσάσθω αὐτόν
  choice: que o Senhor o livre
  rationale: O imperativo aoristo médio pede que o Senhor o resgate ou livre. Repetir “o Senhor” elimina uma ambiguidade pronominal artificial em português.
- source_word: ὅτι θέλει αὐτόν
  choice: pois se agrada dele
  rationale: Θέλω pode significar querer, desejar ou ter prazer em alguém. Aqui, no paralelismo da citação do salmo, “agradar-se dele” comunica adequadamente a relação pretendida sem acrescentar uma leitura denominacional.
theological_decisions:
- issue: Referente do sujeito em θέλει
  choice: “se agrada dele”, tendo o Senhor como sujeito
  alternative: “porque o quer” ou “porque ele o deseja”
  rationale: O contexto faz do Senhor o agente esperado do livramento e da salvação; a formulação escolhida preserva o sentido relacional da expressão grega e evita a obscuridade dos pronomes em português.
- issue: Força dos imperativos ῥυσάσθω e σωσάτω
  choice: 'Exortações irônicas: “que ... o livre; que o salve”'
  alternative: 'Futuro declarativo: “ele o livrará; ele o salvará”'
  rationale: As formas gregas são imperativos de terceira pessoa, empregados pelos zombadores como desafio sarcástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. Os tempos verbais foram ajustados ao uso natural do português sem alterar a relação aspectual do grego. Não se inclui nota de variante, pois o material fornecido registra apenas uma redação inglesa anterior, não uma variante do texto grego.
