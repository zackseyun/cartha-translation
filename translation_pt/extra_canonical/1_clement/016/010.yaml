id: 1CLEM.16.10
reference: 1 Clement 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: pt
  text: 'E darei os perversos em lugar da sua sepultura,


    e os ricos em lugar da sua morte;


    porque ele não cometeu nenhuma iniquidade,


    nem se achou engano em sua boca.


    E o Senhor quer purificá-lo da aflição.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega desta citação diz literalmente «purificá-lo da ferida/golpe». Outras formas textuais de Isaías 53:10 apresentam uma redação diferente.
    reason: Sinaliza uma importante variante textual e a amplitude semântica de πληγή sem substituir o texto-base fornecido.
lexical_decisions:
- source_word: πονηρούς
  choice: perversos
  rationale: Expressa maldade moral e preserva o valor substantivado do adjetivo grego no plural.
- source_word: ἀνομίαν
  choice: injustiça alguma
  rationale: Neste contexto, comunica de modo natural a ausência de conduta contrária à ordem justa, sem limitar a frase a uma infração legal específica.
- source_word: δόλος
  choice: engano
  rationale: Termo corrente e digno que abrange falsidade, fraude ou dolo na fala.
- source_word: βούλεται
  choice: quer
  rationale: Reproduz diretamente a vontade ou intenção do Senhor em português natural.
- source_word: καθαρίσαι
  choice: purificá-lo
  rationale: Mantém o sentido explícito de tornar limpo ou puro, sem substituí-lo interpretativamente por curar.
- source_word: πληγῆς
  choice: aflição
  rationale: Escolha ampla e natural para a condição dolorosa ou golpe sofrido, preservando a leitura adotada pelo texto de consulta.
theological_decisions:
- issue: Sentido da declaração final sobre o servo
  choice: «o Senhor quer purificá-lo da aflição»
  alternative: «o Senhor quis esmagá-lo com sofrimento»
  rationale: Segue a forma grega fornecida, καθαρίσαι αὐτὸν τῆς πληγῆς, sem harmonizá-la com uma forma textual diferente de Isaías 53:10.
- issue: Construção «os perversos/os ricos em lugar de»
  choice: Preservar literalmente a relação substitutiva e sua ambiguidade
  alternative: Explicitar que lhe designaram sepultura com perversos e ricos
  rationale: O grego de 1 Clemente apresenta ἀντί, e a tradução não deve resolver silenciosamente a relação difícil entre as pessoas mencionadas, a sepultura e a morte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. A sintaxe incomum de «em lugar de» foi mantida por refletir a formulação grega e sua ambiguidade genuína.
