source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται, καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: pt
  text: Este leva os nossos pecados e sofre por nós, e nós o consideramos em dor, ferido e em aflição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Este
  rationale: Preserva a força demonstrativa do grego, que aponta para a pessoa descrita, sem acrescentar identificação ausente nesta frase.
- source_word: φέρει
  choice: leva
  rationale: Expressa naturalmente a ideia de carregar ou tomar sobre si; no contexto da citação de Isaías 53, «leva os nossos pecados» é claro e idiomático.
- source_word: περὶ ἡμῶν ὀδυνᾶται
  choice: sofre por nós
  rationale: ὀδυνᾶται denota dor ou sofrimento, e περὶ ἡμῶν indica que isso ocorre por nossa causa ou em nosso favor. A formulação concisa evita repetir «dor» antes de ἐν πόνῳ.
- source_word: ἐν πόνῳ
  choice: em dor
  rationale: Neste contexto, πόνος significa dor ou sofrimento, não trabalho árduo.
- source_word: ἐν πληγῇ
  choice: ferido
  rationale: πληγή designa golpe, ferida ou aquilo que atinge alguém. «Ferido» comunica a imagem de modo natural em português, sem a associação moderna de «praga» a uma epidemia.
- source_word: ἐν κακώσει
  choice: em aflição
  rationale: κακώσις indica maus-tratos, opressão ou aflição; «em aflição» mantém o paralelismo e não especifica uma causa que o texto não explicita.
theological_decisions:
- issue: Sentido de περὶ ἡμῶν
  choice: por nós
  alternative: por nossa causa / em nosso favor
  rationale: «Por nós» preserva de modo conciso a amplitude da preposição, sem definir além do texto se o sofrimento é apenas causado por nós ou vicário em sentido técnico.
- issue: Natureza da πληγή
  choice: ferido
  alternative: sob um golpe
  rationale: A tradução não identifica o golpe como castigo divino nem lhe atribui uma teoria expiatória específica; conserva apenas a condição de alguém atingido.
translation_notes:
  register: Português moderno, claro e digno, com cadência adequada a uma citação solene. A repetição de «em» em «em dor» e «em aflição» reflete o paralelismo grego, enquanto «ferido» evita a expressão pouco natural «em um golpe».
