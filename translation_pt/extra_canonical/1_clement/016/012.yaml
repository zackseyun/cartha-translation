id: 1CLEM.16.12
reference: 1 Clement 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: pt
  text: 'E o Senhor quer livrá-lo do sofrimento de sua alma,

    mostrar-lhe a luz e formá-lo com entendimento,

    justificar o justo que serve bem a muitos;

    e ele mesmo levará sobre si os pecados deles[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suportará os pecados deles”.'
    reason: ἀνοίσει pode destacar tanto o ato de carregar quanto o de suportar um peso.
lexical_decisions:
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  choice: livrá-lo do sofrimento de sua alma
  rationale: A construção grega omite o objeto direto de ἀφελεῖν, mas o contexto permite entendê-lo como a pessoa mencionada; “livrá-lo do sofrimento” reproduz com naturalidade a ideia de retirada ou libertação sem transformar explicitamente o sofrimento no objeto.
- source_word: δεῖξαι αὐτῷ φῶς
  choice: mostrar-lhe a luz
  rationale: Mantém a imagem concreta de φῶς e reproduz de modo direto a construção com pronome dativo.
- source_word: πλάσαι τῇ συνέσει
  choice: formá-lo com entendimento
  rationale: πλάσαι comunica formar ou moldar; o dativo τῇ συνέσει é mantido de modo relativamente formal como meio ou qualidade, sem resolver além do necessário a construção incomum.
- source_word: δικαιῶσαι δίκαιον
  choice: justificar o justo
  rationale: Preserva deliberadamente a repetição da raiz semântica entre δικαιῶσαι e δίκαιον e o possível valor titular ou genérico do singular.
- source_word: εὖ δουλεύοντα πολλοῖς
  choice: que serve bem a muitos
  rationale: Expressa o particípio presente, o advérbio εὖ e o dativo plural πολλοῖς em ordem natural no português.
- source_word: ἀνοίσει
  choice: levará sobre si
  rationale: O verbo significa carregar ou suportar; “levará sobre si” torna explícito o peso vicário sugerido pela expressão sem acrescentar uma formulação doutrinária.
theological_decisions:
- issue: Identidade e função do “justo”
  choice: o justo que serve bem a muitos
  alternative: um justo que serve bem a muitos
  rationale: O grego não traz artigo, mas o contexto apresenta uma figura específica; o artigo definido em português funciona naturalmente sem impor uma identificação confessional adicional.
- issue: Relação do justo com os pecados alheios
  choice: ele mesmo levará sobre si os pecados deles
  alternative: ele mesmo suportará os pecados deles
  rationale: A redação conserva a afirmação forte do texto de que a própria figura justa carrega os pecados de outros, sem explicar o mecanismo teológico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética correspondente às linhas do texto. Mantiveram-se a repetição “justificar o justo” e a construção pouco comum “formá-lo com entendimento” para preservar as tensões lexicais do grego.
