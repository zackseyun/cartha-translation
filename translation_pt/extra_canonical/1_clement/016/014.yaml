source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς ἁμαρτίας πολλῶν ἀνήνεγκε καὶ διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/014.yaml
  text: 'And he bore the sins of many,

    and was given over because of their sins.'
translation:
  language: pt
  text: 'E ele mesmo levou os pecados de muitos,

    e foi entregue por causa dos pecados deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτός
  choice: E ele mesmo
  rationale: Preserva a conjunção e a ênfase explícita do pronome grego.
- source_word: ἁμαρτίας πολλῶν ἀνήνεγκε
  choice: levou os pecados de muitos
  rationale: «Levou» reproduz de modo natural a ideia de carregar/levar expressa por ἀνήνεγκε, sem explicitar além do texto o caráter sacrificial possível da formulação.
- source_word: παρεδόθη
  choice: foi entregue
  rationale: Mantém a voz passiva e a amplitude semântica do verbo, sem identificar no texto quem o entregou.
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: por causa dos pecados deles
  rationale: Expressa o valor causal de διά com acusativo e conserva a referência plural de αὐτῶν.
theological_decisions:
- issue: Sentido sacrificial de ἀνήνεγκε
  choice: levou
  alternative: ofereceu
  rationale: A escolha preserva a possível alusão sacrificial, mas não resolve a ambiguidade lexical em favor do ato de oferecer.
- issue: Agente implícito de παρεδόθη
  choice: não especificado
  alternative: foi entregue por Deus / foi traído
  rationale: O passivo grego não nomeia o agente; acrescentá-lo importaria uma interpretação não explicitada nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre as duas linhas. «Ele mesmo» retém a ênfase do original; «pecados deles» evita a possível ambiguidade de «seus pecados».
