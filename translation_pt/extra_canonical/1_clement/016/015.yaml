id: 1CLEM.16.15
reference: 1 Clement 16:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: pt
  text: 'E novamente ele mesmo diz:


    “Eu, porém, sou verme e não homem,


    desonra entre os homens e objeto de desprezo do povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκώληξ
  choice: verme
  rationale: Equivalente direto e natural, preservando a imagem de humilhação extrema.
- source_word: ὄνειδος ἀνθρώπων
  choice: motivo de vergonha para os homens
  rationale: Expressa o substantivo predicativo ὄνειδος e evita a leitura menos clara de que o eu lírico seria simplesmente 'a vergonha' pertencente aos homens.
- source_word: ἐξουθένημα λαοῦ
  choice: objeto de desprezo para o povo
  rationale: Mantém o valor nominal de ἐξουθένημα e o paralelismo com ὄνειδος, indicando alguém tratado como objeto de desprezo.
- source_word: δὲ
  choice: porém
  rationale: Preserva o contraste introduzido pela partícula no início da citação.
theological_decisions:
- issue: Identidade do falante citado
  choice: Manter apenas o pronome 'ele', como no grego de 1 Clemente
  alternative: Explicitar que o falante é Cristo ou o salmista
  rationale: O contexto pode orientar a identificação, mas este versículo não a explicita; a tradução não deve resolver a referência além do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com disposição poética para a citação. A formulação nominal nas duas linhas finais preserva o paralelismo retórico do grego sem recorrer a linguagem excessivamente arcaica.
