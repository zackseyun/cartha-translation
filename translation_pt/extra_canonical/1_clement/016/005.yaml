source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: pt
  text: 'Mas ele foi ferido por causa dos nossos pecados

    e foi afligido por causa das nossas transgressões.


    O castigo que nos traz paz estava sobre ele;

    por sua ferida fomos curados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: foi ferido
  rationale: Reproduz diretamente a ideia de sofrer ferimentos e mantém o paralelismo passivo do texto.
- source_word: μεμαλάκισται
  choice: foi afligido
  rationale: No contexto de sofrimento, expressa debilitação e maus-tratos de modo natural, sem limitar o sentido a fraqueza física.
- source_word: ἀνομίας
  choice: transgressões
  rationale: Comunica atos que violam a lei ou a ordem justa, distinguindo o termo do mais geral 'pecados' na linha anterior.
- source_word: παιδεία
  choice: castigo
  rationale: Neste contexto, designa disciplina punitiva ou correção sofrida, não mera instrução.
- source_word: μώλωπι
  choice: ferida
  rationale: Termo claro e corrente para a marca ou lesão produzida por um golpe; evita o pouco natural 'por seu hematoma'.
theological_decisions:
- issue: Relação entre o castigo sofrido e a paz recebida
  choice: O castigo que nos trouxe paz caiu sobre ele
  alternative: O castigo da nossa paz estava sobre ele
  rationale: O grego é condensado e literalmente aproxima 'castigo', 'nossa paz' e 'sobre ele'. A formulação escolhida torna inteligível a relação de resultado sem especificar além do texto uma teoria da expiação.
- issue: Valor de cura em ἰάθημεν
  choice: fomos curados
  alternative: recebemos cura
  rationale: Mantém a metáfora de ferida e cura e preserva a voz passiva do original, sem definir se a cura deve ser entendida em sentido físico, moral ou espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética em quatro linhas. A redação preserva o contraste entre o sofrimento dele e o benefício recebido por nós, evitando vocabulário confessional especializado.
