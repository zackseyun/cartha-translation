  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: pt
  text: 'O cetro da majestade de Deus, o Senhor Jesus Messias, não veio com a ostentação da arrogância nem do orgulho, embora fosse capaz, mas com humildade, assim como o Espírito Santo falou a respeito dele. Pois diz:


    “Senhor, quem creu em nossa mensagem?


    E a quem foi revelado o braço do Senhor?


    Anunciamos diante dele,


    como uma criança,


    como uma raiz em terra sedenta.


    Ele não tem aparência nem glória;


    nós o vimos,


    e ele não tinha aparência nem beleza.


    Mas sua aparência era desonrada,


    inferior à aparência dos seres humanos;[a]


    um homem em sofrimento e fadiga,


    que sabia suportar a fraqueza,


    porque seu rosto foi desviado;[b]


    ele foi desonrado e não foi estimado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficando aquém da aparência dos seres humanos”. A expressão grega é incomum e pode indicar que sua aparência estava aquém da aparência humana.'
    reason: Preserva a construção difícil de ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων sem impor uma descrição física específica.
  - marker: b
    text: 'Ou: “porque desviaram o rosto dele” ou “porque o seu rosto está desviado”.'
    reason: A voz passiva de ἀπέστραπται e a referência de «seu rosto» permitem mais de uma formulação; a tradução principal conserva o sentido básico de desviar/voltar para longe.
lexical_decisions:
- source_word: σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  choice: o cetro da majestade de Deus
  rationale: Preserva a metáfora régia e a construção genitiva do grego.
- source_word: κύριος Ἰησοῦς Χριστός
  choice: o Senhor Jesus Messias
  rationale: Traduz Χριστός por seu sentido titular, “Messias”, em vez de apenas transliterá-lo.
- source_word: ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  choice: com ostentação, arrogância ou orgulho
  rationale: κόμπος indica exibição ou ostentação; ἀλαζονεία e ὑπερηφανία são representados separadamente, embora próximos semanticamente.
- source_word: καίπερ δυνάμενος
  choice: embora pudesse fazê-lo
  rationale: Expressa naturalmente a concessão participial sem especificar além do contexto aquilo que ele tinha poder para fazer.
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: Anunciamos diante dele
  rationale: Mantém a primeira pessoa plural e não acrescenta um objeto direto ausente no grego; ἐναντίον αὐτοῦ é vertido como “diante dele”.
- source_word: γῇ διψώσῃ
  choice: terra sedenta
  rationale: Conserva a personificação e a imagem literal de uma terra que tem sede.
- source_word: ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων
  choice: desprezada, mais abatida que a dos seres humanos
  rationale: ἄτιμον comunica desonra ou desprezo; “mais abatida” oferece uma leitura contextual de ἐκλεῖπον παρὰ sem apagar a dificuldade comparativa da expressão.
- source_word: ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ
  choice: era um homem em sofrimento e fadiga
  rationale: No contexto do Servo sofredor, πληγή indica golpe, aflição ou sofrimento, não necessariamente peste; πόνος é trabalho penoso, dor ou fadiga.
- source_word: εἰδὼς φέρειν μαλακίαν
  choice: que sabia suportar a fraqueza
  rationale: Mantém o sentido de conhecimento ou experiência em carregar/suportar debilidade, sem converter μαλακία em doença específica.
- source_word: ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ
  choice: Seu rosto foi rejeitado
  rationale: Representa a voz passiva de ἀπέστραπται e preserva a referência ambígua ao rosto dele, em vez de transformar a frase em ação explícita do próprio sujeito.
theological_decisions:
- issue: Identificação de Jesus como Χριστός
  choice: Messias
  alternative: Cristo
  rationale: “Messias” torna explícito o valor do título grego sem introduzir interpretação denominacional.
- issue: Agência na citação profética
  choice: “o Espírito Santo falou a respeito dele”
  alternative: “o Espírito Santo disse por meio do profeta”
  rationale: Segue exatamente a formulação de Clemente, que nomeia o Espírito Santo, mas não explicita aqui um profeta humano.
- issue: Ambiguidade de ἀνηγγείλαμεν
  choice: “Anunciamos diante dele” sem objeto direto
  alternative: “Nós o anunciamos diante dele”
  rationale: O grego não contém objeto direto expresso; acrescentar “o” resolveria indevidamente uma construção textual difícil.
- issue: Sentido da humilhação física/social do Servo
  choice: linguagem de aparência desprezada e abatida
  alternative: linguagem que afirme deformidade específica
  rationale: O texto enfatiza desonra e redução comparativa, mas não exige uma descrição médica ou anatômica precisa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética na citação. A sintaxe foi suavizada onde necessário para legibilidade brasileira e internacional, mas foram mantidas as repetições de “aparência” e as construções difíceis que carregam a textura da versão grega de Isaías citada por Clemente.
