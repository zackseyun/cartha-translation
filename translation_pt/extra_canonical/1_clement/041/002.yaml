source:
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι. 2. οὐ πανταχοῦ, ἀδελφοί, προσφέρονται αἱ θυσίαι ἐνδελεχισμοῦ ἢ εὐχῶν ἢ περὶ ἁμαρτίας καὶ πλημμελείας, ἀλλʼ ἢ ἐν Ἱερουσαλὴμ μόνῃ· κἀκεῖ δὲ οὐκ ἐν παντὶ τόπῳ προσφέρεται, ἀλλʼ ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον, μυωροσκοπηθὲν τὸ προσφερόμενον ὑπὸ
  text_scope: parent_chapter_source
  edition: Funk 1901 (normalized OCR)
  language: Greek
  pages:
  - 313
  verse: 2
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: pt
  text: Pois os sacrifícios da oferta contínua, das orações, pelo pecado e pela transgressão não são oferecidos em toda parte, irmãos, mas somente em Jerusalém. E mesmo ali não são oferecidos em qualquer lugar, mas diante do templo, junto ao altar, depois que a oferta é examinada pelo sumo sacerdote e pelos ministros já mencionados para verificar se há algum defeito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: sacrifícios da oferta contínua
  rationale: Mantém a referência cultual a uma oferta regular ou contínua, em consonância com o contexto sacrificial.
- source_word: εὐχῶν
  choice: orações
  rationale: Reproduz o sentido comum do termo sem transformar a expressão cultual em uma categoria teológica mais específica.
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: pelo pecado e pela transgressão
  rationale: Preserva a distinção entre os dois termos gregos e a relação sacrificial expressa por περί.
- source_word: ἔμπροσθεν τοῦ ναοῦ
  choice: diante do santuário
  rationale: No contexto do culto de Jerusalém, 'santuário' comunica o espaço sagrado visado por ναός com mais precisão do que o sentido amplo que 'templo' pode ter.
- source_word: πρὸς τὸ θυσιαστήριον
  choice: junto ao altar
  rationale: Expressa proximidade ou direção em relação ao altar de modo natural em português, sem confundi-lo com o santuário.
- source_word: μωμοσκοπηθέν
  choice: é examinada ... para verificar se há algum defeito
  rationale: Torna explícita em português a inspeção cultual destinada a detectar defeitos na oferta.
- source_word: λειτουργῶν
  choice: ministros
  rationale: Conserva a designação funcional dos oficiantes no contexto litúrgico, sem especificar uma classe além do que o texto afirma.
theological_decisions:
- issue: Relação entre orações e sacrifícios
  choice: sacrifícios ... das orações
  alternative: ofertas de oração
  rationale: A formulação conserva a construção difícil e a tensão cultual do grego, em vez de reinterpretá-la como categoria devocional distinta.
- issue: Categorias de pecado e transgressão
  choice: pelo pecado e pela transgressão
  alternative: pelos pecados e pelas faltas
  rationale: Mantém duas categorias distintas e evita harmonizá-las com uma terminologia sacrificial confessional específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A repetição de 'não são oferecidos' foi preservada por sua força retórica. O singular coletivo 'a oferta' corresponde ao particípio grego e evita peso desnecessário.
