id: 1CLEM.41.1
reference: 1 Clement 41:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: pt
  text: Cada um de nós, irmãos, agrade a Deus na posição que lhe é própria, mantendo uma boa consciência, sem ultrapassar a regra estabelecida para o seu serviço, com dignidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάγματι
  choice: posição
  rationale: Expressa o lugar ou ordem própria de cada pessoa sem acrescentar a ideia de que essa posição foi explicitamente designada, ausente de ἰδίῳ.
- source_word: εὐαρεστείτω
  choice: agrade a Deus
  rationale: Verte naturalmente o imperativo ativo de ‘ser agradável/agradar’.
- source_word: λειτουργίας
  choice: serviço
  rationale: No contexto, designa um serviço ou função exercida segundo uma ordem estabelecida; ‘serviço’ preserva a amplitude sem impor um sentido litúrgico posterior.
- source_word: κανόνα
  choice: regra
  rationale: Mantém a imagem de uma norma ou limite regulador definido.
- source_word: σεμνότητι
  choice: dignidade
  rationale: Comunica conduta respeitável, séria e honrada de modo natural em português.
theological_decisions:
- issue: Natureza da ‘posição’ e do ‘serviço’
  choice: Usar termos gerais, ‘posição’ e ‘serviço’
  alternative: ‘ordem designada’ e ‘ministério’
  rationale: O grego descreve a ordem ou lugar próprio e a λειτουργία correspondente, mas este versículo isolado não exige terminologia eclesiástica técnica nem afirma explicitamente que ἴδιος significa ‘designado’.
- issue: Relação de ἐν σεμνότητι com a frase
  choice: Manter ‘com dignidade’ no fim
  alternative: 'Ligá-lo diretamente ao serviço: ‘prestando-o com dignidade’'
  rationale: A posição final do sintagma permite alguma amplitude de referência; a tradução conserva essa abrangência em vez de restringi-lo apenas ao serviço.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura acompanha de perto o grego, mas evita construções artificiais como ‘existindo em boa consciência’.
