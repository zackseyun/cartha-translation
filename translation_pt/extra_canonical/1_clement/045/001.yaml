lexical_decisions:
- source_word: Φιλόνεικοί
  choice: gostam de discussões
  rationale: Expressa de modo natural a inclinação para contendas ou disputas, preservando a censura do termo grego sem recorrer ao pouco comum «contenciosos».
- source_word: ζηλωταὶ
  choice: zelosos
  rationale: Mantém a ideia de dedicação intensa ou ardor, bem como a possível tensão entre o zelo positivo e o contexto de censura.
- source_word: περὶ τῶν ἀνηκόντων εἰς σωτηρίαν
  choice: pelas coisas que dizem respeito à salvação
  rationale: Reproduz de perto a relação ampla indicada pelo grego, sem especificar indevidamente quais assuntos ou meios de salvação estão em vista.
theological_decisions:
- issue: Alcance de «salvação»
  choice: Manter a formulação geral «as coisas que dizem respeito à salvação».
  alternative: Explicitar como «doutrinas necessárias para a salvação» ou «meios de salvação».
  rationale: O texto grego não limita a expressão a doutrinas, práticas ou meios específicos; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Vocês» favorece a legibilidade brasileira; «irmãos» preserva a forma direta de tratamento do original.
