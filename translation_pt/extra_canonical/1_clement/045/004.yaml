  source_fidelity: A sequência de passivas e a repetição de "mas por" refletem bem a estrutura acusatória do grego. Contudo, "quem vivia sem lei" é uma paráfrase verbal desnecessária de ἀνόμων e enfraquece o paralelismo com os demais grupos. "Ciúme" pode ser compreendido em português sobretudo no âmbito afetivo; neste contexto, ζῆλος designa mais naturalmente inveja ou rivalidade hostil.
  naturalness: O texto é claro e de registro adequado. "Pessoas vis e injustas, movidas por" é compreensível, mas "gente vil e injusta, por causa de" mantém melhor o paralelismo conciso e evita atribuir um gênero gramatical feminino aos agentes.
  terminology: '"Justos", "ímpios", "transgressores" e "vil e injusta" representam adequadamente δίκαιοι, ἀνόσιοι, παράνομοι e μιαροί καὶ ἄδικοι. "Pessoas sem lei" traduz ἄνομοι de modo direto, sem o erro de sugerir que fossem legalmente proscritos. "Inveja" é a escolha contextual mais idiomática para ζῆλος, enquanto a nota preserva "zelo" como possibilidade lexical.'
