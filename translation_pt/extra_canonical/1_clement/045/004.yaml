  - severity: medium
    issue: '"ciúme" para ζῆλος'
    rationale: Embora possível, "ciúme" em português moderno tende a evocar relação afetiva ou posse. No contexto de oposição aos justos, "inveja" comunica mais claramente a rivalidade hostil implicada pelo termo.
  - severity: low
