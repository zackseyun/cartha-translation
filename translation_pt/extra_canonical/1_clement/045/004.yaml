base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: pt
  text: Os justos foram perseguidos, mas por pessoas sem lei; foram presos, mas por ímpios; foram apedrejados por transgressores; foram mortos por gente vil e injusta, por causa de uma inveja[a] intolerável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zelo”. O grego ζῆλος pode designar zelo, mas, neste contexto, também inveja ou rivalidade hostil.
    reason: Preserva a amplitude lexical de ζῆλος, enquanto o contexto justifica a tradução principal como “inveja”.
lexical_decisions:
- source_word: δίκαιοι
  choice: os justos
  rationale: Equivalente português direto e tradicional, preservando o sentido moral do adjetivo substantivado.
- source_word: ἄνομοι
  choice: quem vivia sem lei
  rationale: Expressa pessoas caracterizadas pelo desprezo à lei, sem sugerir que tivessem sido oficialmente proscritas.
- source_word: ἀνόσιοι
  choice: ímpios
  rationale: Termo corrente e digno para os que violam o que é santo ou moralmente devido.
- source_word: παράνομοι
  choice: transgressores
  rationale: Destaca a violação ativa da lei e evita o sentido inadequado de pessoas postas fora da proteção legal.
- source_word: μιαροί
  choice: pessoas vis
  rationale: Comunica a repugnância moral do termo grego com naturalidade em português, sem limitar o sentido à impureza ritual.
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto de hostilidade contra os justos, indica rivalidade ressentida; uma nota preserva a possibilidade lexical de 'zelo'.
- source_word: ἀνεκτρίστῳ
  choice: insuportável
  rationale: Segue o valor contextual de algo intolerável ou que não se pode suportar, qualificando a motivação hostil.
theological_decisions:
- issue: Agência dos perseguidores e inocência dos justos
  choice: Manter em cada oração o contraste entre os justos que sofrem e os agentes moralmente culpados
  alternative: Suavizar ou omitir os qualificativos dos perseguidores
  rationale: A repetição e os contrastes são parte essencial do argumento retórico do texto grego.
- issue: Amplitude semântica de ζῆλος
  choice: Traduzir no texto como 'ciúme' e registrar 'zelo' em nota
  alternative: Escolher apenas 'inveja' ou 'zelo' sem nota
  rationale: O contexto favorece ciúme hostil, mas o termo grego também pode significar zelo; a nota evita eliminar essa ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A estrutura paralela e o contraste repetido com “mas” foram preservados. O terceiro verbo foi vertido passivamente conforme a sintaxe contextual e o paralelismo, apesar da forma ativa aparente no OCR fornecido.
