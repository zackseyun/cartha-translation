revisions:
- from: Ou será que Ananias, Azarias e Misael foram encerrados numa fornalha de fogo por aqueles que praticavam o majestoso e glorioso culto do Altíssimo? De modo nenhum! Quem, então, fez essas coisas? Os detestáveis, cheios de toda espécie de maldade, deixaram-se levar a tamanho furor que submeteram a maus-tratos os que serviam a Deus com propósito santo e irrepreensível. Não sabiam que o Altíssimo é o defensor e protetor dos que, com consciência pura, prestam culto ao seu nome pleno de toda virtude. A ele seja a glória pelos séculos dos séculos. Amém.
  to: Ou será que Ananias, Azarias e Misael foram encerrados numa fornalha de fogo por aqueles que praticavam o majestoso e glorioso culto do Altíssimo? De modo nenhum! Quem, então, fez essas coisas? Os detestáveis, cheios de toda espécie de maldade, foram levados a tal extremo de ira que submeteram a maus-tratos os que serviam a Deus com intenção santa e irrepreensível, sem saber que o Altíssimo é o defensor e protetor dos que, com consciência pura, prestam culto ao seu nome pleno de toda virtude. A ele seja a glória pelos séculos dos séculos. Amém.
  rationale: A revisão conserva o sentido de confinamento de κατείρχθησαν, a pergunta retórica e a doxologia. Ajusta apenas a expressão da intensificação da ira e a tradução de προθέσει para maior proximidade ao grego e fluência em português, sem introduzir interpretação doutrinária.
