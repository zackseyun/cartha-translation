source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: Ou será que Ananias, Azarias e Misael foram encerrados numa fornalha de fogo por aqueles que praticavam o majestoso e glorioso culto do Altíssimo? De modo nenhum! Quem, então, fez essas coisas? Os detestáveis, cheios de toda espécie de maldade, foram levados a tal extremo de ira que submeteram a maus-tratos os que serviam a Deus com intenção santa e irrepreensível, sem saber que o Altíssimo é o defensor e protetor dos que, com consciência pura, prestam culto ao seu nome pleno de toda virtude. A ele seja a glória pelos séculos dos séculos. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν
  choice: foram encerrados
  rationale: O verbo κατείργω significa encerrar, confinar ou manter preso; esta tradução evita confundi-lo com um verbo que significaria lançar ou fazer descer.
- source_word: θρησκείαν
  choice: culto
  rationale: No contexto, refere-se à prática religiosa dirigida ao Altíssimo; “culto” é natural em português e se harmoniza com o particípio θρησκευόντων.
- source_word: στυγητοὶ
  choice: detestáveis
  rationale: Expressa a forte reprovação do adjetivo grego sem recorrer a uma formulação artificial.
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: submeteram a maus-tratos
  rationale: A expressão indica sujeitar alguém a tratamento ultrajante, abusivo ou violento.
- source_word: προθέσει
  choice: propósito
  rationale: Preserva o sentido de intenção ou disposição consciente com que essas pessoas serviam a Deus.
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  choice: defensor e protetor
  rationale: Reproduz os dois títulos próximos, mantendo sua ênfase cumulativa em defesa e proteção.
- source_word: παναρέτῳ
  choice: pleno de toda virtude
  rationale: Torna inteligível o composto grego, que atribui ao nome divino a plenitude de toda excelência ou virtude.
theological_decisions:
- issue: Referente da doxologia ᾧ ἡ δόξα
  choice: A ele seja a glória
  alternative: Ao seu nome seja a glória
  rationale: O antecedente discursivo mais natural é o Altíssimo, embora a proximidade de “nome” permita alguma tensão sintática; a formulação portuguesa mantém a referência pronominal sem acrescentar identificação doutrinária.
- issue: Relação entre culto e perseguição
  choice: Mantida como pergunta retórica seguida de negação enfática
  alternative: Reformular como afirmação de que os perseguidores não praticavam o culto verdadeiro
  rationale: O grego formula deliberadamente uma pergunta absurda e depois a rejeita; explicitar sua conclusão eliminaria a força retórica do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a pergunta retórica, a progressão enfática e a doxologia, evitando tanto arcaísmos desnecessários quanto explicações confessionais.
