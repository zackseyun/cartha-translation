source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: pt
  text: Mas os que perseveraram[a] com confiança herdaram glória e honra, foram exaltados e inscritos por Deus no memorial deles[b] para todo o sempre. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que perseveram”.'
    reason: O particípio grego está no presente, embora o contexto e os verbos principais apontem para referência passada.
  - marker: b
    text: 'Ou: “no registro em que Deus se lembra deles”.'
    reason: A expressão grega pode referir-se ao memorial deles ou ao registro da lembrança que Deus conserva deles.
lexical_decisions:
- source_word: ὑπομένοντες
  choice: os que perseveraram
  rationale: O particípio presente substantivado expressa perseverança contínua, mas recebe referência temporal passada dos verbos principais no aoristo e do contexto narrativo anterior.
- source_word: ἐν πεποιθήσει
  choice: com confiança
  rationale: Expressa a atitude ou disposição em que perseveraram; esta formulação é natural em português e preserva o sentido de confiança firme.
- source_word: ἐκληρονόμησαν
  choice: herdaram
  rationale: Mantém a imagem de receber algo como herança, sem reduzir o verbo a simplesmente 'receberam'.
- source_word: ἔγγραφοι ἐγένοντο
  choice: foram inscritos
  rationale: Reproduz de modo idiomático a construção que indica passar a constar de um registro.
- source_word: μνημόσυνον
  choice: memorial
  rationale: Preserva a imagem grega de memória ou registro comemorativo, deixando a relação exata com αὐτῶν para a nota.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente português corrente e solene para a fórmula enfática de duração perpétua.
theological_decisions:
- issue: Referência temporal de οἱ ὑπομένοντες
  choice: os que perseveraram
  alternative: os que perseveram
  rationale: Embora o particípio esteja no presente, os aoristos coordenados e o contexto dos exemplos antigos favorecem referência passada; a alternativa mais formal é preservada em nota.
- issue: Sentido de ἐν τῷ μνημοσύνῳ αὐτῶν
  choice: no memorial deles
  alternative: no registro em que Deus se lembra deles
  rationale: A tradução principal acompanha de perto a estrutura grega e não decide além do necessário se se trata de memorial, lembrança ou registro; a alternativa explicita a possível leitura de αὐτῶν como genitivo objetivo.
translation_notes:
  register: Português moderno, claro e solene, com coordenação fluida. “Para todo o sempre” conserva o tom litúrgico da fórmula final, e as notas preservam as ambiguidades gramaticais e semânticas relevantes.
