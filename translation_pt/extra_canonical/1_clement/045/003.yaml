  text: ἐπίστασθε, ὅτι οὐδὲν ἄδικον οὐδὲ παρεπεποιημένον γέγραπται ἐν αὐταῖς· οὐχ εὑρήσετε δικαίους ἀποβεβλημένους ἀπὸ ὁσίων ἀνδρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/003.yaml
  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: pt
  text: Vocês sabem que nada injusto nem falsificado foi escrito nelas; não encontrarão justos rejeitados por homens santos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: Vocês sabem
  rationale: Expressa conhecimento seguro e mantém uma forma natural e amplamente compreensível em português.
- source_word: παρεπεποιημένον
  choice: falsificado
  rationale: O particípio indica algo adulterado ou fraudulentamente fabricado; “falsificado” preserva essa força sem explicação excessiva.
- source_word: ἀποβεβλημένους
  choice: que tenham sido rejeitados
  rationale: Reproduz o sentido passivo de serem expulsos, repudiados ou postos de lado, sem especificar um modo não indicado pelo texto.
- source_word: ὁσίων ἀνδρῶν
  choice: homens santos
  rationale: Mantém a distinção lexical de ὅσιος, referente à santidade ou piedade, e conserva o referente masculino explícito de ἀνδρῶν.
theological_decisions:
- issue: Referente de ἐν αὐταῖς (“nelas”)
  choice: Manter o pronome feminino plural “nelas”
  alternative: Explicitar “nas Escrituras”
  rationale: O referente está no contexto anterior, não neste versículo; manter o pronome evita inserir uma identificação que o trecho isolado não declara.
- issue: Relação entre os justos e os homens santos
  choice: “justos que tenham sido rejeitados por homens santos”
  alternative: “justos expulsos da companhia de homens santos”
  rationale: A construção ἀπό com o agente ou fonte admite certa tensão; a formulação escolhida segue o sentido mais direto sem acrescentar “companhia”.
translation_notes:
  register: Português moderno, digno e claro, com “vocês” para o plural e sintaxe próxima do grego sem rigidez artificial.
