  text: ἐνεκύψατε εἰς τὰς ἱερὰς γραφάς, τὰς ἀληθεῖς, τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/002.yaml
  text: You have looked closely into the holy Scriptures[a], the true ones, those given through the Holy Spirit.
translation:
  language: pt
  text: Vocês examinaram atentamente as Sagradas Escrituras[a], as verdadeiras, as dadas por meio do Espírito Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês se inclinaram para olhar atentamente as Sagradas Escrituras”.'
    reason: Registra a imagem literal possível de ἐγκύπτω, embora, no contexto, o verbo tenha o sentido idiomático de examinar cuidadosamente.
lexical_decisions:
- source_word: ἐνεκύψατε
  choice: examinaram atentamente
  rationale: No contexto de escritos, o verbo expressa a ideia de olhar de perto, investigar ou estudar cuidadosamente; evita uma reprodução excessivamente literal da imagem de se inclinar.
- source_word: ἱερὰς γραφάς
  choice: Sagradas Escrituras
  rationale: Equivalente português natural e reconhecível para a expressão grega, preservando seu caráter religioso e textual.
- source_word: τὰς ἀληθεῖς
  choice: as verdadeiras
  rationale: Mantém o adjetivo substantivado em aposição, sem repetir desnecessariamente “Escrituras” nem especificar além do grego.
- source_word: τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: as que vêm por meio do Espírito Santo
  rationale: Preserva a construção instrumental διὰ com genitivo e evita definir de modo mais específico que o original como as Escrituras foram mediadas.
theological_decisions:
- issue: Relação das Escrituras com o Espírito Santo
  choice: as que vêm por meio do Espírito Santo
  alternative: as que foram dadas por meio do Espírito Santo
  rationale: O grego apresenta uma frase elíptica, sem verbo explícito. “Vêm” conserva a afirmação de mediação pelo Espírito sem acrescentar de maneira categórica o verbo “dar”.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês” para refletir a segunda pessoa do plural. A formulação mantém a sequência enfática das aposições gregas e conserva a elipse relativa à atuação do Espírito Santo.
