  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: pt
  text: Mas clame, para ver se alguém lhe responderá ou se verá algum dos santos anjos; pois a ira mata o insensato, e o ciúme leva à morte o extraviado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: clame
  rationale: Imperativo que expressa chamar ou apelar em voz alta; «clame» é natural, digno e mantém a força do grego.
- source_word: ὑπακούσεται
  choice: lhe responderá
  rationale: Embora o verbo possa significar «ouvir/obedecer», neste contexto de clamar por alguém, a ideia contextual é atender ou responder ao chamado.
- source_word: ἁγίων ἀγγέλων
  choice: santos anjos
  rationale: Correspondência direta e tradicional, sem acrescentar identificação ou função não expressa no texto.
- source_word: ὀργή
  choice: ira
  rationale: Preserva o sentido forte de cólera e o registro sapiencial da frase.
- source_word: ἄφρονα
  choice: insensato
  rationale: Termo corrente em literatura sapiencial para quem carece de bom senso, sem implicar necessariamente deficiência intelectual.
- source_word: ζῆλος
  choice: ciúme
  rationale: Neste contexto destrutivo, designa zelo invejoso ou ciúme; «ciúme» reproduz de modo claro a força negativa.
- source_word: πεπλανημένον
  choice: quem anda perdido
  rationale: O particípio perfeito passivo indica alguém que se desviou e permanece em estado de extravio; a formulação portuguesa comunica esse estado sem o tornar apenas um erro momentâneo.
- source_word: θανατοῖ
  choice: leva à morte
  rationale: Expressa naturalmente o causativo «faz morrer/mata», evitando repetição rígida com o verbo anterior e preservando o paralelismo semântico.
theological_decisions:
- issue: Identidade ou acessibilidade dos «santos anjos»
  choice: Manter a referência sem explicação adicional
  alternative: Interpretar como invocação efetiva dos anjos ou como negação retórica de sua disponibilidade
  rationale: A frase é retórica e não define uma doutrina sobre invocação angelical; a tradução preserva a tensão sem resolver além do grego.
- issue: Valor de πεπλανημένον
  choice: «quem anda perdido»
  alternative: «o desviado» ou «o que foi enganado»
  rationale: O grego permite a noção de desvio ou engano. A escolha mantém a condição de extravio sem especificar sua causa.
translation_notes:
  register: Português moderno, amplamente compreensível e com cadência sapiencial. A construção «para ver se» torna idiomática a sequência grega de imperativo seguido por duas condições, sem alterar seu caráter desafiador. Não há marcadores de nota porque nenhuma nota textual ou interpretativa é necessária nesta redação.
