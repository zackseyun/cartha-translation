id: 1CLEM.39.5
reference: 1 Clement 39:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: pt
  text: Nem mesmo os céus são puros diante dele; quanto menos os que habitam em casas de barro[a], pois nós mesmos também somos feitos desse mesmo barro. Ele os feriu como a traça, e da manhã até a tarde já não existem; por não poderem ajudar a si mesmos, pereceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «casas feitas de barro».
    reason: Esclarece que o adjetivo grego descreve as casas como feitas de barro, preservando a metáfora.
lexical_decisions:
- source_word: καθαρὴς
  choice: puros
  rationale: O sentido é de pureza ou inocência diante de Deus; «puros» preserva a imagem e soa natural em português.
- source_word: οἰκίας πηλίνας
  choice: casas de barro
  rationale: Mantém a metáfora corporal do texto-fonte em linguagem clara e corrente.
- source_word: ἔπαισεν
  choice: feriu
  rationale: Expressa o ato de golpear sem especificar além do que o verbo grego exige.
- source_word: σητὸς τρόπον
  choice: como a traça
  rationale: Reproduz diretamente a comparação do grego, apesar de sua concisão e possível estranheza.
- source_word: οὐκ ἔτι εἰσίν
  choice: já não existem
  rationale: Preserva a formulação existencial do original, em vez de antecipar «pereceram».
theological_decisions:
- issue: Impureza dos céus diante de Deus
  choice: Nem mesmo os céus são puros diante dele
  alternative: Os céus não são inocentes diante dele
  rationale: «Puros» conserva a amplitude de καθαρός sem converter a afirmação em uma formulação doutrinária mais específica.
- issue: Causa final da perdição
  choice: por não poderem ajudar a si mesmos, pereceram
  alternative: pereceram sem que ninguém pudesse ajudá-los
  rationale: O pronome reflexivo ἑαυτοῖς indica que eles próprios não podiam socorrer-se; a tradução evita introduzir um agente externo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva o fluxo da comparação. A construção grega redundante sobre o mesmo barro foi naturalizada sem perder a ideia de origem material comum.
