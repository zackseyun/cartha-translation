revisions:
- from: Que os filhos deles fiquem longe da salvação; que sejam esmagados às portas pelos humildes, e não haverá quem os livre. Pois os justos comerão o que eles prepararam[a], mas eles mesmos não escaparão dos males.
  to: Que seus filhos fiquem longe da segurança; que sejam espancados junto às portas, pelos mais humildes, e não haverá quem os livre. Pois os justos comerão o que eles prepararam[a], mas eles mesmos não escaparão dos males.
  rationale: A revisão conserva a reconstrução contextual já explicitada pela nota, mas torna mais preciso o sentido imediato de σωτηρία e melhora a expressão portuguesa da agressão junto às portas. A nota continua essencial, porque a redação normalizada fornecida diverge da leitura contextual da citação de Jó.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:35:34Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reconhece corretamente que a sequência fornecida «ἐκείνοις ἡτοίμασας» é problemática no contexto e preserva isso em nota. A adoção de «o que eles prepararam» corresponde ao sentido da citação de Jó e evita atribuir abruptamente a Deus uma preparação em favor dos ímpios. Ajustei «salvação» para «segurança», pois neste contexto de calamidade e resgate σωτηρία designa mais diretamente segurança/livramento, sem impor um sentido soteriológico posterior. Também ajustei a expressão relativa às portas e aos “mais humildes” para uma formulação portuguesa mais clara, mantendo a ambiguidade social do grego.
  naturalness: «Junto às portas» é mais idiomático do que «às portas» neste contexto público/judicial, e «os mais humildes» evita que «humildes» seja entendido principalmente como uma virtude religiosa. «Sejam espancados» transmite de modo natural a violência do verbo da tradição textual subjacente, sem a imagem excessivamente específica de «esmagados».
  terminology: «Segurança», «livre» e «males» mantêm o campo semântico de perigo, resgate e calamidade. «Mais humildes» é uma solução prudente para ἡσσόνων, que pode referir-se a pessoas de posição inferior, mais fracas ou menos importantes; não deve ser rigidamente doutrinalizada nem explicada no texto principal.
  issues:
  - severity: medium
    issue: «salvação» em «longe da salvação» pode sugerir predominantemente salvação espiritual.
    rationale: No paralelismo imediato, o texto fala de ausência de segurança e de quem livre de males. «Segurança» comunica o referente contextual com maior precisão, sem negar a amplitude possível de σωτηρία.
  - severity: low
    issue: «às portas pelos humildes» é sintaticamente compreensível, mas pouco fluente e «humildes» pode carregar conotação moral indevida.
    rationale: «Junto às portas, pelos mais humildes» melhora a leitura e conserva a referência social comparativa de ἡσσόνων.
  - severity: low
    issue: «esmagados» é mais intenso e menos diretamente ligado ao verbo de agressão corporal da citação.
    rationale: «Espancados» representa de forma mais direta o sentido transmitido pela tradição de Jó 5:4, sem alterar a força judicial do enunciado.
  revised_text: Que seus filhos fiquem longe da segurança; que sejam espancados junto às portas, pelos mais humildes, e não haverá quem os livre. Pois os justos comerão o que eles prepararam[a], mas eles mesmos não escaparão dos males.
  revised_footnotes:
