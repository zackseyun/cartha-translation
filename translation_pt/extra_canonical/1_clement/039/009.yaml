    reason: Registra de modo transparente uma leitura textual problemática que altera o sujeito da oração, sem ocultar a redação da fonte fornecida.
  revision_rationale: A revisão conserva a reconstrução contextual já explicitada pela nota, mas torna mais preciso o sentido imediato de σωτηρία e melhora a expressão portuguesa da agressão junto às portas. A nota continua essencial, porque a redação normalizada fornecida diverge da leitura contextual da citação de Jó.
