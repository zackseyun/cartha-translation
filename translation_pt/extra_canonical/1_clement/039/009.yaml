id: 1CLEM.39.9
reference: 1 Clement 39:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: pt
  text: Que seus filhos fiquem longe da segurança; que sejam espancados junto às portas, pelos mais humildes, e não haverá quem os livre. Pois os justos comerão o que eles prepararam[a], mas eles mesmos não escaparão dos males.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido parece conter uma falha de transmissão ou de OCR. A leitura adotada, de acordo com o contexto da citação de Jó, é “o que eles prepararam”; a forma reproduzida na fonte normalizada poderia ser traduzida literalmente como “o que preparaste para eles”.
    reason: Registra de modo transparente uma leitura textual problemática que altera o sujeito da oração, sem ocultar a redação da fonte fornecida.
lexical_decisions:
- source_word: ἀπὸ σωτηρίας
  choice: longe da salvação
  rationale: Mantém a formulação espacial do grego e não restringe σωτηρία a uma ideia apenas espiritual; no contexto, também pode significar segurança ou livramento.
- source_word: κολαβρισθείησαν
  choice: sejam esmagados
  rationale: Expressa o tratamento violento indicado pelo verbo no contexto, em linguagem portuguesa clara e vigorosa.
- source_word: ἐπὶ θύραις ἡσσόνων
  choice: às portas pelos humildes
  rationale: Preserva tanto a referência às portas, provavelmente lugar de julgamento público, quanto a ideia de pessoas de condição inferior ou humilde; a construção grega é difícil, por isso se evita uma explicação excessiva no texto.
- source_word: ὁ ἐξαιρούμενος
  choice: quem os livre
  rationale: O particípio indica alguém que resgata ou arranca do perigo; 'livre' é natural e mantém o sentido.
- source_word: ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται
  choice: não escaparão dos males
  rationale: Reproduz a negação enfática do livramento, usando 'males' para conservar a amplitude de κακά.
theological_decisions:
- issue: Sentido de σωτηρία
  choice: salvação
  alternative: segurança; livramento
  rationale: O termo português preserva a amplitude e a ressonância teológica do grego, enquanto o contexto imediato permite entendê-lo também como segurança ou resgate.
- issue: Sujeito de 'prepararam' em uma fonte com provável corrupção textual
  choice: o que eles prepararam
  alternative: o que preparaste para eles
  rationale: A leitura contextual e a forma textual crítica subjacente à citação de Jó favorecem os próprios ímpios como sujeito; a leitura literal do OCR fornecido produz uma mudança abrupta para a segunda pessoa e prejudica o paralelismo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Conserva a linguagem forte e judicial do trecho sem acrescentar uma interpretação denominacional. O marcador [a] aparece no texto principal.
