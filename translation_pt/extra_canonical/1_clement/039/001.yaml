base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: pt
  text: Insensatos, sem entendimento, tolos e ignorantes zombam de nós e nos ridicularizam, querendo exaltar-se em seus próprios pensamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: insensatos
  rationale: Expressa falta de bom senso e conserva a primeira qualificação da sequência grega.
- source_word: ἀσύνετοι
  choice: sem entendimento
  rationale: Distingue o termo de ἄφρονες e traduz de modo claro a ideia de incapacidade de compreender.
- source_word: μωροί
  choice: tolos
  rationale: Equivalente corrente e direto, sem recorrer a um termo moderno de sentido clínico ou excessivamente ofensivo.
- source_word: ἀπαίδευτοι
  choice: ignorantes
  rationale: No contexto, indica pessoas sem instrução ou formação; “ignorantes” é natural e conciso em português.
- source_word: χλευάζουσιν ... καὶ μυκτηρίζουσιν
  choice: zombam ... e ... ridicularizam
  rationale: Mantém os dois verbos coordenados e sua intensificação retórica.
- source_word: ἐπαίρεσθαι
  choice: exaltar-se
  rationale: Preserva a imagem de elevar a si mesmo e o tom moral do original.
- source_word: ταῖς διανοίαις αὐτῶν
  choice: em seus próprios pensamentos
  rationale: Conserva o âmbito interior ou mental expresso pelo grego, sem resolver a frase como mera opinião ou imaginação.
