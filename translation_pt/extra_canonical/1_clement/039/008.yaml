  yaml_path: translation/extra_canonical/1_clement/039/008.yaml
  text: But I have seen fools taking root, yet immediately their dwelling was consumed.
translation:
  language: pt
  text: Eu, porém, vi insensatos criando raízes, mas logo a morada deles foi consumida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονας
  choice: insensatos
  rationale: Expressa falta de juízo ou sabedoria de modo natural e digno, sem restringir o termo a deficiência intelectual.
- source_word: ῥίζας βάλλοντας
  choice: criando raízes
  rationale: Preserva a metáfora grega de lançar ou firmar raízes em português corrente.
- source_word: δίαιτα
  choice: morada
  rationale: Neste contexto, o termo se refere ao lugar ou modo estabelecido de habitação; “morada” preserva a imagem sem acrescentar uma interpretação específica.
- source_word: ἐβρώθη
  choice: foi consumida
  rationale: Mantém a voz passiva e o sentido literal de ser devorada ou consumida, preservando a força da imagem.
theological_decisions:
- issue: Destino imediato da morada dos insensatos
  choice: “logo a morada deles foi consumida”
  alternative: “logo o seu modo de vida foi destruído”
  rationale: A tradução mantém a ambiguidade lexical de δίαιτα e evita transformar a imagem em uma afirmação moral ou doutrinária mais explícita do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação das metáforas do original. “Eu, porém” representa o contraste de δὲ, enquanto “mas” reproduz ἀλλά.
