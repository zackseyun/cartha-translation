lexical_decisions:
- source_word: θνητός
  choice: um mortal
  rationale: Mantém de modo natural a condição humana e perecível expressa pelo substantivo grego.
- source_word: ἰσχύς
  choice: força
  rationale: Equivalente direto e corrente para capacidade ou vigor, preservando a pergunta retórica.
- source_word: γηγενοῦς
  choice: alguém nascido da terra
  rationale: Reproduz a imagem etimológica do grego, que caracteriza o ser humano por sua origem terrena, sem explicá-la além do texto.
theological_decisions:
- issue: Limitação da humanidade terrena
  choice: Preservar as duas perguntas retóricas sem acrescentar uma resposta explícita
  alternative: Explicitar que o mortal nada pode e não possui força
  rationale: O grego formula a ideia interrogativamente; manter essa forma conserva sua força retórica e evita resolver além do que está expresso.
translation_notes:
  register: Português moderno, claro e digno. A construção “alguém nascido da terra” mantém a imagem solene do original sem soar excessivamente arcaica.
