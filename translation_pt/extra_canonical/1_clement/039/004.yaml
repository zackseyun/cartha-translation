reference: 1 Clement 39:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: pt
  text: Que dizer, então? Será um mortal puro diante do Senhor? Ou será um homem irrepreensível por causa de suas obras, se o Senhor não confia em seus servos e concebeu algo tortuoso contra seus anjos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego παίδων também pode significar «filhos» ou «crianças». Neste contexto, em paralelo com «anjos» e em alusão a Jó 4:18, «servos» é o sentido mais provável.
    reason: Esclarece a polissemia de παίδων sem tornar «filhos» a tradução principal nem alterar o sujeito implícito da citação.
lexical_decisions:
- source_word: βροτός
  choice: mortal
  rationale: Mantém o contraste entre a fragilidade humana e o Senhor, em linguagem natural e solene.
- source_word: καθαρός
  choice: puro
  rationale: Expressa a ideia de pureza diante de Deus sem restringi-la indevidamente à inocência jurídica.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: por causa de suas obras
  rationale: Reproduz o valor causal ou fundamentador de ἀπό neste contexto, sem afirmar além do grego como as obras poderiam tornar o homem irrepreensível.
- source_word: παίδων
  choice: servos
  rationale: Embora παῖς também possa significar “filho” ou “criança”, o paralelismo com “anjos” na citação de Jó 4:18 favorece “servos”, isto é, os servos celestiais do Senhor.
- source_word: σκολιόν τι
  choice: algo tortuoso
  rationale: Conserva a imagem aberta de algo desviado, defeituoso ou perverso, sem especificar uma culpa não explicitada pelo texto.
- source_word: ἐπενόησεν
  choice: concebeu
  rationale: Representa o sentido de formar ou ter em mente; evita substituir o verbo por uma interpretação mais específica como “percebeu” ou “imputou”.
theological_decisions:
- issue: Sujeito de πιστεύει e ἐπενόησεν
  choice: Mantido como pronome (“ele”), com “seus anjos” apontando contextualmente para o Senhor
  alternative: 'Explicitar: “se o Senhor não confia...”'
  rationale: O argumento e a alusão a Jó 4:18 indicam o Senhor como sujeito, mas o grego emprega formas verbais sem repetir o substantivo. A tradução preserva essa estrutura e sua leve ambiguidade sintática, sem fazer do homem alguém que possui anjos.
- issue: Relação de κατὰ com os anjos
  choice: “contra seus anjos”
  alternative: “em seus anjos” ou “a respeito de seus anjos”
  rationale: “Contra” conserva de modo formal a força adversativa possível de κατά, embora a construção também possa comunicar que o Senhor encontrou ou percebeu algo defeituoso neles; essa possibilidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas retóricas e a tensão do argumento foram preservadas. “Pois quê?” mantém a transição breve de Τί γάρ sem soar coloquial demais.
