  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: pt
  text: 'Está escrito: “Não havia forma diante dos meus olhos, mas eu ouvia apenas uma brisa e uma voz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: Está escrito
  rationale: Reproduz a fórmula introdutória grega sem acrescentar uma conjunção causal ausente no texto.
- source_word: μορφὴ
  choice: forma alguma
  rationale: “Forma” mantém o sentido visual e indeterminado do substantivo; “alguma” expressa naturalmente a negação em português.
- source_word: πρὸ ὀφθαλμῶν μου
  choice: diante dos meus olhos
  rationale: Equivalência direta e idiomática da expressão espacial grega.
- source_word: ἀλλʼ ἢ
  choice: apenas
  rationale: Após a negação, a construção tem valor restritivo, “senão/somente”, e não meramente adversativo.
- source_word: αὔραν
  choice: uma brisa
  rationale: Preserva o sentido usual de movimento suave do ar; “sopro” é possível, mas poderia sugerir uma interpretação mais específica.
- source_word: ἤκουον
  choice: ouvia
  rationale: O imperfeito grego é conservado de modo natural, apresentando a percepção auditiva em curso em contraste com a ausência de percepção visual.
