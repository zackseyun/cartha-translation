  text: καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: pt
  text: 'Cria em mim um coração puro, ó Deus,

    e renova um espírito reto no íntimo do meu ser.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν
  choice: um coração puro
  rationale: Expressão natural e tradicional em português que preserva diretamente a imagem grega de pureza interior.
- source_word: κτίσον
  choice: Cria
  rationale: Mantém o sentido forte de produzir ou trazer à existência, em vez de suavizá-lo para ‘forma’ ou ‘faz’.
- source_word: πνεῦμα εὐθὲς
  choice: um espírito reto
  rationale: Preserva a formulação moral e espiritual do grego; ‘reto’ comunica firmeza e correção sem restringir indevidamente o sentido.
- source_word: ἐγκαίνισον
  choice: renova
  rationale: Equivalente corrente que expressa tornar novo outra vez ou restaurar.
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: no íntimo do meu ser
  rationale: Traduz idiomaticamente a referência às partes mais interiores da pessoa, evitando o pouco natural ‘nas minhas entranhas’ sem reduzi-la apenas a localização física.
theological_decisions:
- issue: Sentido de πνεῦμα
  choice: espírito
  alternative: disposição
  rationale: O grego permite referência ao espírito interior ou à disposição da pessoa. ‘Espírito’ preserva a ambiguidade e a linguagem da fonte, sem impor uma interpretação psicológica.
- issue: Força de εὐθὲς
  choice: reto
  alternative: firme
  rationale: ‘Reto’ conserva mais diretamente a ideia de retidão; ‘firme’ destacaria estabilidade, um matiz possível, mas não exclusivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético. A invocação ‘ó Deus’ preserva o tom solene sem arcaísmo excessivo.
