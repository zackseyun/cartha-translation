  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. κύριε, τὸ στόμα μου ἀνοίξεις, καὶ τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: pt
  text: 'Minha língua exultará em tua justiça.


    Senhor, abrirás a minha boca,


    e os meus lábios anunciarão o teu louvor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: exultará
  rationale: Expressa a alegria intensa do verbo grego e preserva o futuro.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Equivalente direto e teologicamente não restritivo de δικαιοσύνη.
- source_word: ἀναγγελεῖ
  choice: anunciarão
  rationale: Conserva o sentido de proclamar ou dar a conhecer, bem como a concordância singular do sujeito neutro plural no grego, vertida naturalmente pelo plural em português.
- source_word: αἴνεσίν
  choice: louvor
  rationale: Termo corrente e digno para a expressão de elogio dirigido a Deus.
theological_decisions:
- issue: Sentido de «tua justiça»
  choice: Mantida a formulação ampla «tua justiça»
  alternative: «teus atos de justiça» ou «tua retidão»
  rationale: O grego não especifica se se trata do caráter justo de Deus ou de seus atos salvadores; a tradução preserva essa amplitude.
- issue: Modalidade dos verbos futuros
  choice: 'Futuros declarativos: «abrirás» e «anunciarão»'
  alternative: 'Pedido ou jussivo: «abre» e «anunciem»'
  rationale: As formas gregas transmitidas são futuros do indicativo, por isso não foram convertidas silenciosamente em imperativos.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. Emprega «tua/teu» de modo coerente e amplamente compreensível.
