  text: ῥαντιεῖς με ὑσσώπῳ, καὶ καθαρισθήσομαι· πλυνεῖς με, καὶ ὑπὲρ χιόνα λευκανθήσομαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: pt
  text: 'Tu me aspergirás com hissopo, e ficarei purificado;

    tu me lavarás, e ficarei mais branco do que a neve.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: aspergirás
  rationale: Mantém a imagem ritual de borrifar ou espargir líquido, com formulação digna e reconhecível em português bíblico.
- source_word: ὑσσώπῳ
  choice: com hissopo
  rationale: Reproduz diretamente a planta ou instrumento ritual mencionado no texto grego.
- source_word: καθαρισθήσομαι
  choice: ficarei purificado
  rationale: Preserva a voz passiva e a dimensão de purificação, sem reduzi-la apenas à limpeza física.
- source_word: πλυνεῖς
  choice: lavarás
  rationale: Equivalente direto e natural do verbo grego.
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: ficarei mais branco do que a neve
  rationale: Conserva a comparação intensiva e a voz passiva do original em português claro.
theological_decisions:
- issue: Agência divina e resposta do suplicante
  choice: Manter a segunda pessoa como agente das ações e a primeira pessoa em construções passivas
  alternative: Traduzir de modo mais idiomático como “tu me purificarás” e “me tornarás mais branco”
  rationale: 'A forma escolhida preserva a estrutura grega: o interlocutor asperge e lava, enquanto o falante é purificado e embranquecido.'
translation_notes:
  register: Português moderno, claro e solene, com formas verbais na segunda pessoa singular para refletir diretamente o grego. “Aspergir” e “hissopo” são termos menos cotidianos, mas necessários para conservar a imagem ritual específica.
