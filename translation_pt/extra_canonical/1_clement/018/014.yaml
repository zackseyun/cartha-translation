lexical_decisions:
- source_word: ῥῦσαί με
  choice: Livra-me
  rationale: Expressa de modo natural e direto o imperativo aoristo médio com o sentido de resgatar ou libertar.
- source_word: ἐξ αἱμάτων
  choice: da culpa de sangue
  rationale: O plural grego literal, “sangues”, é uma expressão idiomática que neste contexto aponta para a culpa decorrente de derramamento de sangue; a tradução explicita o sentido sem perder sua gravidade.
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: Deus da minha salvação
  rationale: Mantém a construção genitiva e a formulação teológica do grego em português claro e solene.
theological_decisions:
- issue: Sentido de ἐξ αἱμάτων
  choice: da culpa de sangue
  alternative: dos sangues / do derramamento de sangue
  rationale: “Culpa de sangue” preserva o foco provável na responsabilidade moral por sangue derramado, em vez de indicar apenas livramento de violência ou morte.
translation_notes:
  register: Português moderno, claro e digno, com invocação preservada por “ó Deus” e paralelismo próximo ao original.
