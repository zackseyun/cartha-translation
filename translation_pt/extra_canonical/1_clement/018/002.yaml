reference: 1 Clement 18:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: pt
  text: 'Mas ele próprio também diz a Deus:


    Tem misericórdia de mim, ó Deus, segundo a tua grande misericórdia;

    e, segundo a abundância das tuas compaixões, apaga a minha transgressão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ αὐτός
  choice: Mas ele próprio também
  rationale: Preserva tanto o contraste introduzido por ἀλλά como a força conjunta de καί e do pronome enfático αὐτός, ressaltando que ele, por sua vez, também fala a Deus.
- source_word: Ἐλέησόν με
  choice: Tem misericórdia de mim
  rationale: Expressão portuguesa corrente e digna que corresponde diretamente ao pedido verbal de misericórdia.
- source_word: τὸ πλῆθος τῶν οἰκτιρμῶν σου
  choice: a abundância das tuas compaixões
  rationale: Mantém a ideia de grande quantidade em πλῆθος e o plural concreto de οἰκτιρμοί, sem reduzir a expressão simplesmente a um singular abstrato.
- source_word: ἐξάλειψον
  choice: apaga
  rationale: Reproduz a imagem de eliminar ou apagar completamente um registro.
- source_word: τὸ ἀνόμημά μου
  choice: a minha transgressão
  rationale: Traduz o substantivo singular como uma violação da lei, evitando tanto uma paráfrase excessiva quanto o abstrato menos natural 'ilegalidade'.
theological_decisions:
- issue: Ênfase recíproca de καὶ αὐτός
  choice: ele próprio também
  alternative: ele também
  rationale: 'A opção adotada retém a ênfase explícita de αὐτός no contexto: depois de Deus falar a Davi, o próprio Davi também fala a Deus.'
- issue: Natureza de ἀνόμημα
  choice: transgressão
  alternative: iniquidade
  rationale: “Transgressão” mantém a relação lexical com a violação da lei e não especifica além do singular grego se se trata de um ato isolado ou da culpa resultante.
translation_notes:
  register: Português moderno, claro e reverente, com cadência poética moderada. Mantiveram-se a segunda pessoa do singular e o paralelismo da citação, sem aspas por causa da apresentação em bloco.
