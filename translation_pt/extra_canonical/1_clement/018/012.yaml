id: 1CLEM.18.12
reference: 1 Clement 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: pt
  text: 'Devolve-me a alegria[a] da tua salvação,

    e sustenta-me com um espírito disposto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a exultação».
    reason: ἀγαλλίασις pode indicar alegria intensa, júbilo ou exultação.
  - marker: b
    text: Ou «um espírito que guia»; também pode ser entendido como «um espírito governante».
    reason: ἡγεμονικός tem associação lexical com conduzir, liderar e governar, embora no contexto também seja tradicionalmente entendido como disposição voluntária.
lexical_decisions:
- source_word: ἀπόδος
  choice: Devolve-me
  rationale: Expressa a ideia de restituir ao suplicante algo que ele antes possuía; é corrente e natural em português.
- source_word: ἀγαλλίασιν
  choice: alegria
  rationale: Comunica de modo claro a alegria intensa ou exultação indicada pelo substantivo grego, sem soar artificial.
- source_word: τοῦ σωτηρίου σου
  choice: da tua salvação
  rationale: Preserva a construção genitiva e a referência à salvação que procede de Deus ou lhe pertence.
- source_word: στήριξόν με
  choice: sustenta-me
  rationale: No contexto, indica manter firme, amparar ou dar estabilidade, não apenas fortalecer de modo genérico.
- source_word: πνεύματι ἡγεμονικῷ
  choice: com um espírito disposto
  rationale: Oferece uma formulação natural do sentido contextual de um espírito pronto e voluntarioso, enquanto a nota registra o sentido mais diretamente ligado à ideia grega de conduzir ou governar.
theological_decisions:
- issue: Identidade de πνεῦμα
  choice: Mantida indefinida como «um espírito»
  alternative: «o teu Espírito» ou «meu espírito»
  rationale: O grego não traz possessivo nem identifica explicitamente se se trata do espírito humano ou do Espírito divino; a tradução preserva essa abertura.
- issue: Sentido de ἡγεμονικός
  choice: «disposto» no texto, com alternativa em nota
  alternative: «que guia» ou «governante»
  rationale: O termo pode descrever o que lidera, dirige ou governa; no contexto tradicional do salmo também admite o valor de voluntariedade. A nota evita encerrar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. Empregou-se «tua» para conservar o tom direto da oração e «sustenta-me» para reproduzir a ideia de firmeza contínua.
