source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: pt
  text: 'Pois eis que em iniquidades fui concebido,

    e em pecados minha mãe me concebeu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: ficou grávida de mim.'
    reason: O raro verbo grego ἐκίσσησέν pode evocar mais diretamente a concepção ou o estado de gravidez; a nota preserva essa nuance lexical.
lexical_decisions:
- source_word: ἀνομίαις
  choice: iniquidades
  rationale: Preserva o plural e a ideia de atos contrários à lei, mantendo o tom solene e poético da citação.
- source_word: συνελήμφθην
  choice: fui concebido
  rationale: O aoristo passivo de συλλαμβάνω refere-se claramente à concepção.
- source_word: ἐκίσσησέν
  choice: me gerou
  rationale: No uso da Septuaginta, o verbo se relaciona à concepção ou gestação. “Gerou” soa natural em português, abrange esse campo sem confundi-lo com amamentação e evita uma repetição rígida de “conceber”.
theological_decisions:
- issue: Relação entre o nascimento humano e o pecado
  choice: Manter literalmente os plurais “em iniquidades” e “em pecados”, sem explicar a natureza dessa relação.
  alternative: Interpretar explicitamente a frase como afirmação de culpa herdada ou, no sentido oposto, apenas do ambiente pecaminoso.
  rationale: O texto poético não resolve por si só essas questões teológicas; a tradução preserva sua tensão sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de fácil leitura, com paralelismo poético. “Pois eis que” representa ἰδοὺ γάρ; “iniquidades” conserva o registro bíblico sem recorrer a uma paráfrase excessivamente técnica.
