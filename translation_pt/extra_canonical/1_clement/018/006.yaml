source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας· τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: pt
  text: 'Pois eis que amaste a verdade;

    fizeste-me conhecer as coisas ocultas e secretas da tua sabedoria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γάρ
  choice: Pois eis que
  rationale: Preserva tanto a conexão explicativa de γάρ quanto a força apresentativa de ἰδού, em linguagem bíblica ainda compreensível.
- source_word: ἀλήθειαν ἠγάπησας
  choice: amaste a verdade
  rationale: Mantém de perto o sentido e a ordem enfática do grego, com o perfeito simples natural para o contexto citado.
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  choice: as coisas ocultas e secretas
  rationale: Conserva os dois termos coordenados, sem reduzi-los a um único conceito; 'ocultas' expressa o que não é manifesto, e 'secretas', o que está escondido.
- source_word: ἐδήλωσάς μοι
  choice: fizeste-me conhecer
  rationale: Traduz o ato causativo de tornar algo manifesto ou conhecido, evitando a formulação menos natural 'declaraste-me'.
theological_decisions:
- issue: Referente de σοφίας σου
  choice: da tua sabedoria
  alternative: sobre a tua sabedoria
  rationale: O genitivo grego liga as coisas ocultas e secretas à sabedoria divina; a tradução preserva essa relação sem explicar se são conteúdos pertencentes à sabedoria ou produzidos por ela.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica. O paralelismo e a segunda pessoa do singular foram preservados por se tratar de discurso dirigido a Deus.
