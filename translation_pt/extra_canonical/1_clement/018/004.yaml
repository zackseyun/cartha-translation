  source_fidelity: 'A cláusula final cita a formulação grega da LXX de Salmo 50(51):6. Embora κρίνεσθαι seja formalmente médio-passivo e possa receber leitura passiva, o contexto da citação e o paralelo hebraico favorecem aqui o valor médio: Deus entra em juízo/contenda e prevalece. A redação principal «quando fores julgado» dá preferência à leitura passiva e inverte esse quadro. «Sejas reconhecido como justo» é possível, mas «sejas justificado» reproduz mais diretamente δικαιωθῇς e é uso bíblico português estabelecido, sem implicar que Deus passe a ser justo.'
