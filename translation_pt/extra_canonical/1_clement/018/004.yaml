  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: pt
  text: 'Somente contra ti pequei,

    e fiz o que é mau diante de ti,

    para que sejas justificado em tuas palavras

    e prevaleças quando entrares em juízo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando fores julgado”. A forma grega pode ser entendida como passiva; no contexto da citação do Salmo, também admite o sentido médio “quando entrares em juízo”.'
    reason: Preserva a ambiguidade formal de κρίνεσθαι, ao mesmo tempo que a tradução principal segue o sentido médio favorecido pelo contexto da citação.
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: Somente contra ti
  rationale: Expressa com naturalidade em português o objeto enfático e exclusivo do pecado.
- source_word: τὸ πονηρὸν ἐνώπιόν σου
  choice: o que é mau diante de ti
  rationale: Mantém o caráter moral de πονηρόν e a imagem relacional de algo praticado perante Deus.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: sejas reconhecido como justo em tuas palavras
  rationale: O verbo passivo δικαιωθῇς pode indicar ser declarado ou reconhecido como justo; esta formulação evita sugerir que Deus se torna justo e preserva a referência às suas palavras.
- source_word: νικήσῃς
  choice: prevaleças
  rationale: No contexto de julgamento ou controvérsia, transmite a ideia de sair vitorioso ou ter razão.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: quando fores julgado
  rationale: Representa diretamente a leitura passiva possível da forma médio-passiva grega, sem ocultar em nota a alternativa média contextual.
theological_decisions:
- issue: A voz e o sentido de κρίνεσθαι aplicados a Deus
  choice: quando fores julgado
  alternative: quando julgares; quando entrares em juízo
  rationale: A morfologia grega admite leitura passiva ou média. A tradução principal conserva a leitura passiva tradicional e formalmente direta, enquanto a nota registra a leitura média, apoiada pelo contexto judicial e pelo texto hebraico do salmo citado, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com paralelismo poético preservado. Emprega segunda pessoa singular por se tratar de oração dirigida diretamente a Deus.
