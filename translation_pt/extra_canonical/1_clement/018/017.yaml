  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: pt
  text: 'Um sacrifício para Deus é um espírito quebrantado;


    um coração quebrantado e humilhado Deus não desprezará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία τῷ θεῷ
  choice: O sacrifício para Deus
  rationale: Reproduz a construção nominal grega e mantém a ideia de uma oferta dirigida a Deus.
- source_word: πνεῦμα συντετριμμένον
  choice: um espírito quebrantado
  rationale: “Quebrantado” expressa a imagem de algo esmagado ou partido e é natural no registro bíblico em português.
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  choice: um coração quebrantado e humilhado
  rationale: 'Preserva os dois particípios e sua distinção: o coração foi quebrantado e rebaixado/humilhado.'
- source_word: οὐκ ἐξουδενώσει
  choice: não desprezará
  rationale: Equivalente direto e corrente para a ideia de tratar como nada, rejeitar com desprezo.
theological_decisions:
- issue: Relação entre sacrifício ritual e disposição interior
  choice: Manter a afirmação metafórica sem explicação adicional
  alternative: Explicitar que o espírito quebrantado substitui ou supera o sacrifício ritual
  rationale: O grego identifica o espírito quebrantado como sacrifício para Deus, mas não desenvolve aqui uma doutrina sobre a abolição ou hierarquia dos sacrifícios.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve registro bíblico em “quebrantado”. A ordem final “Deus não desprezará” acompanha a ênfase e o ritmo do grego.
