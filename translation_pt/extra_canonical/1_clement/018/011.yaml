  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: pt
  text: 'Não me rejeites da tua presença,

    e não tires de mim o teu Espírito Santo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με
  choice: Não me expulses
  rationale: Expressa com naturalidade a ideia de lançar ou rejeitar alguém para longe, preservando a força do pedido negativo.
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: da tua presença
  rationale: Embora προσώπου signifique literalmente “rosto”, a expressão idiomática indica estar diante de Deus, isto é, em sua presença.
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: não tires de mim
  rationale: Traduz o sentido de retirar ou remover, sem acrescentar a noção não explícita de “tomar de volta”.
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: o teu Espírito Santo
  rationale: Reproduz a referência ao Espírito santo de Deus em formulação consagrada e clara no português moderno.
theological_decisions:
- issue: Natureza da retirada do Espírito Santo
  choice: Mantida a formulação direta “não tires de mim”, sem explicar a natureza ou duração dessa possível retirada.
  alternative: Interpretar como perda definitiva, perda temporária de capacitação ou mera sensação de abandono.
  rationale: O texto não define o sentido teológico preciso da retirada; a tradução preserva essa tensão sem impor uma doutrina posterior.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. Emprega a segunda pessoa do singular, adequada ao discurso direto dirigido a Deus e amplamente inteligível em português internacional.
