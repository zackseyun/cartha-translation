base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: pt
  text: 'Pois, se tivesses desejado sacrifício, eu o teria oferecido;

    mas não terás prazer em holocaustos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  choice: sacrifício
  rationale: Equivalente direto e natural, mantendo o termo cultual abrangente do grego.
- source_word: ἔδωκα ἄν
  choice: eu o teria oferecido
  rationale: Expressa a construção potencial/contrafactual de modo idiomático em português; no contexto cultual, 'oferecido' comunica melhor do que o literal 'dado'.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Termo bíblico tradicional para ofertas inteiramente queimadas, compreensível no registro religioso e fiel ao sentido cultual.
- source_word: οὐκ εὐδοκήσεις
  choice: não te agradarás
  rationale: Preserva o futuro do texto grego e a ideia de não ter prazer ou satisfação nessas ofertas.
theological_decisions:
- issue: Contraste entre sacrifício e holocaustos
  choice: Manter a afirmação sem explicação doutrinária adicional
  alternative: Parafrasear como rejeição absoluta de todo sacrifício ritual
  rationale: O verso contrasta o sacrifício desejado com a ausência de agrado em holocaustos; não se deve resolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem foi levemente ajustada para fluidez, com 'mas' explicitando o contraste já presente entre as orações.
