  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: pt
  text: 'Lava-me cada vez mais da minha transgressão

    e purifica-me do meu pecado.

    Pois eu conheço a minha transgressão,

    e o meu pecado está continuamente diante de mim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον
  choice: cada vez mais
  rationale: Expressa o aumento ou a intensificação pedidos pela locução grega, com naturalidade em português.
- source_word: ἀνομία
  choice: transgressão
  rationale: No contexto desta citação penitencial, comunica a violação da vontade ou lei divina sem recorrer ao menos idiomático “ilegalidade”.
- source_word: πλῦνόν με
  choice: Lava-me
  rationale: Preserva a imagem concreta de lavagem presente no verbo grego.
- source_word: καθάρισόν με
  choice: purifica-me
  rationale: Mantém a distinção entre lavar e tornar puro, em linguagem religiosa clara e corrente.
- source_word: διαπαντός
  choice: continuamente
  rationale: Reproduz o sentido temporal de algo que permanece sempre presente.
theological_decisions:
- issue: Sentido de ἀνομία no paralelismo com ἁμαρτία
  choice: transgressão
  alternative: iniquidade
  rationale: “Transgressão” preserva a ideia de violação moral e distingue o termo de “pecado”, sem acrescentar uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. A colocação pronominal mantém um tom literário apropriado sem soar arcaica.
