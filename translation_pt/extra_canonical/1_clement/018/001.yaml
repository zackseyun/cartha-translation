  source_fidelity: A tradução representa fielmente o grego. “Que recebeu testemunho” expressa de modo claro e natural o particípio perfeito passivo μεμαρτυρημένῳ, sem transformar indevidamente a noção de testemunho em uma interpretação mais restrita, como “aprovado”. “Segundo o meu coração”, “filho de Jessé”, “com misericórdia eterna” e “eu o ungi” correspondem adequadamente ao texto-fonte.
  naturalness: O português é moderno, fluente e mantém registro bíblico sóbrio. A construção “E que diremos a respeito de Davi” reproduz bem a pergunta retórica grega, e a citação soa natural sem perder sua cadência.
  terminology: “Davi”, “Jessé”, “coração”, “misericórdia” e “ungi” são escolhas estabelecidas e apropriadas no vocabulário bíblico em português. “Com misericórdia eterna” conserva a abertura semântica de ἐν ἐλέει αἰωνίῳ; não é necessário restringi-la a meio, modo ou esfera.
