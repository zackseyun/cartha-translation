source:
  edition: Funk 1901 (normalized OCR)
  text: Τί δὲ εἴπωμεν ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ; πρὸς ὃν εἶπεν ὁ θεός· Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου, Δαυὶδ τὸν τοῦ Ἰεσσαί, ἐν ἐλέει αἰωνίῳ ἔχρισα αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: pt
  text: 'E que diremos a respeito de Davi, que recebeu testemunho?[a] A ele Deus disse: “Encontrei um homem segundo o meu coração, Davi, filho de Jessé; com misericórdia eterna eu o ungi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito de Davi, de quem se deu testemunho?”.'
    reason: O particípio grego pode ser expresso como testemunho recebido ou como testemunho dado a respeito de Davi.
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  choice: que recebeu testemunho
  rationale: O particípio perfeito passivo indica que Davi foi objeto de testemunho ou aprovação. A formulação preserva essa ideia sem recorrer a um decalque pouco natural.
- source_word: κατὰ τὴν καρδίαν μου
  choice: segundo o meu coração
  rationale: Mantém a expressão idiomática e teologicamente significativa do grego, também familiar em linguagem bíblica portuguesa.
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: com misericórdia eterna
  rationale: Reproduz tanto o valor instrumental ou circunstancial de ἐν quanto o sentido duradouro de αἰωνίῳ, sem especificar além do texto.
- source_word: ἔχρισα
  choice: ungi
  rationale: Corresponde diretamente ao verbo χρίω e conserva sua associação bíblica com a escolha e investidura régia.
theological_decisions:
- issue: Natureza do testemunho dado a Davi
  choice: que recebeu testemunho
  alternative: de quem se deu testemunho; que foi aprovado
  rationale: O grego permite a noção de testemunho favorável ou aprovação. A tradução escolhida preserva a linguagem de testemunho sem reduzir explicitamente o sentido a uma avaliação divina.
- issue: Relação entre misericórdia e unção
  choice: com misericórdia eterna eu o ungi
  alternative: em misericórdia eterna eu o ungi
  rationale: A preposição ἐν admite mais de uma nuance. “Com” é natural em português e mantém aberta a relação como meio, modo ou esfera.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência bíblica moderada. Conserva-se “segundo o meu coração” por sua força intertextual e evita-se uma formulação excessivamente arcaica para o particípio passivo.
