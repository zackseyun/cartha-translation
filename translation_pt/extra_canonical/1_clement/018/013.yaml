  text: διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπιστρέψουσιν ἐπὶ σέ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: pt
  text: 'Ensinarei aos que vivem sem lei os teus caminhos,

    e os ímpios se voltarão para ti.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόμους
  choice: os que vivem sem lei
  rationale: Expressa de modo natural o sentido de pessoas caracterizadas pelo desrespeito à lei, sem reduzir o termo apenas a criminosos.
- source_word: τὰς ὁδούς σου
  choice: os teus caminhos
  rationale: Preserva a metáfora bíblica de conduta e vontade divina presente no grego.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: Equivalente corrente e digno para aqueles que vivem sem reverência a Deus.
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: se voltarão para ti
  rationale: Mantém a ideia de voltar-se ou converter-se em direção a Deus, sem acrescentar explicitamente o sentido de retorno contido em 'voltarão para ti' no contexto.
theological_decisions:
- issue: Possível sentido de retorno em ἐπιστρέψουσιν
  choice: se voltarão para ti
  alternative: voltarão para ti / retornarão a ti
  rationale: A construção indica mudança de direção para Deus, mas não exige que essas pessoas anteriormente estivessem voltadas para ele; a forma reflexiva evita impor a noção de 'voltar de novo'.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A formulação tem boa legibilidade brasileira e permanece compreensível internacionalmente.
