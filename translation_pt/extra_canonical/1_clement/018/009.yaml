- source_word: ἀνομίας
  choice: transgressões
  rationale: Expressa violações da vontade ou lei divina sem a possível conotação moderna de ausência social de leis em “ilegalidades”.
- source_word: ἐξάλειψον
  choice: apaga
  rationale: Mantém a metáfora de eliminar um registro escrito, comum no uso bíblico do verbo.
