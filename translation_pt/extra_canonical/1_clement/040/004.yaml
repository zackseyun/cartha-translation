source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: pt
  text: Portanto, os que fazem suas ofertas nos tempos determinados[a] são aceitos e felizes; pois, ao seguirem as ordenanças do Senhor, não erram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos tempos prescritos”.'
    reason: O particípio grego indica tempos previamente fixados ou designados; tanto “determinados” como “prescritos” são traduções possíveis.
lexical_decisions:
- source_word: προσφορὰς
  choice: ofertas
  rationale: No contexto do culto, designa aquilo que é apresentado ou oferecido; “ofertas” é natural e preserva a amplitude do termo.
- source_word: τοῖς προστεταγμένοις καιροῖς
  choice: nos tempos determinados
  rationale: O particípio perfeito passivo indica tempos previamente fixados ou designados. “Determinados” expressa isso sem redundância.
- source_word: εὐπρόσδεκτοί
  choice: aceitos
  rationale: Expressa que essas pessoas são acolhidas favoravelmente; em português corrente, “aceitos” é mais natural que “aceitáveis” neste contexto.
- source_word: μακάριοί
  choice: felizes
  rationale: Mantém o sentido de pessoas favorecidas ou ditosas sem acrescentar uma formulação confessional específica.
- source_word: τοῖς νομίμοις
  choice: as normas
  rationale: O substantivo plural refere-se ao que foi legitimamente estabelecido, isto é, normas ou ordenanças; “normas” é claro e não excessivamente técnico.
- source_word: τοῦ δεσπότου
  choice: do Senhor
  rationale: Embora δεσπότης possa significar “senhor” ou “mestre” em sentido de autoridade soberana, “Senhor” é natural no contexto religioso e preserva essa autoridade.
- source_word: οὐ διαμαρτάνουσιν
  choice: não cometem falta
  rationale: O verbo comunica falhar, errar ou transgredir. “Não cometem falta” preserva o aspecto normativo sem ampliar para uma ideia genérica de desorientação.
theological_decisions:
- issue: Natureza das “normas do Senhor”
  choice: as normas do Senhor
  alternative: as ordenanças legais do Senhor
  rationale: A tradução mantém a referência ampla do grego sem identificar essas normas exclusivamente com a Lei mosaica, regras litúrgicas posteriores ou uma estrutura eclesiástica específica.
- issue: Sentido de εὐπρόσδεκτοι
  choice: são aceitos
  alternative: são aceitáveis
  rationale: O grego permite a ideia de recepção favorável. A forma escolhida soa mais natural em português, sem explicitar por quem são aceitos, assim como o original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e vocabulário religioso amplamente compreensível. Conserva o tom normativo da passagem sem importar terminologia denominacional.
