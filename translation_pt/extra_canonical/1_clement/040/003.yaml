reference: 1 Clement 40:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: pt
  text: E onde e por meio de quem ele quer que sejam realizadas, ele próprio o determinou por sua vontade suprema, para que todas as coisas, feitas de modo santo, fossem aceitáveis à sua vontade, conforme o seu beneplácito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que todas as coisas, feitas de modo santo e conforme o seu beneplácito, fossem aceitáveis à sua vontade”.'
    reason: Preserva a possível ligação de ἐν εὐδοκήσει com γινόμενα, em paralelo com ὁσίως, em vez de com εὐπρόσδεκτα εἴη.
lexical_decisions:
- source_word: ἐπιτελεῖσθαι
  choice: sejam realizadas
  rationale: Expressa a realização das ações ou observâncias subentendidas pelo contexto, preservando a voz passiva do grego.
- source_word: τῇ ὑπερτάτῃ αὐτοῦ βουλήσει
  choice: por sua vontade suprema
  rationale: Traduz diretamente a ideia de determinação pela vontade soberana ou suprema de Deus, em linguagem digna e corrente.
- source_word: ὁσίως
  choice: com santidade
  rationale: Reproduz o valor adverbial de agir de maneira santa ou piedosa sem restringi-lo a uma acepção ritual.
- source_word: εὐπρόσδεκτα
  choice: aceitáveis
  rationale: Conserva o sentido de algo favoravelmente recebido ou aceito.
- source_word: ἐν εὐδοκήσει
  choice: conforme o seu beneplácito
  rationale: Mantém a noção de agrado, aprovação ou boa vontade e permite sua ligação principal com a aceitabilidade, conforme a ordem e a sintaxe possíveis do grego.
theological_decisions:
- issue: Relação de ἐν εὐδοκήσει com γινόμενα ou εὐπρόσδεκτα εἴη
  choice: 'Ligação principal com ''fossem aceitáveis'': ''fossem aceitáveis à sua vontade conforme o seu beneplácito'''
  alternative: 'Ligação com ''feitas'': ''feitas com santidade e conforme o seu beneplácito'''
  rationale: A construção grega admite alguma incerteza de ligação. O texto principal acompanha a leitura em que ἐν εὐδοκήσει qualifica a aceitação; a nota preserva a alternativa plausível sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Ele próprio” dá ênfase natural a αὐτός; “beneplácito” foi mantido por sua precisão teológica e por ainda ser compreensível no registro bíblico, enquanto a nota esclarece a ambiguidade sintática.
