revisions:
- from: Pois ao sumo sacerdote foram confiadas funções próprias, aos sacerdotes foi designado um lugar próprio, e aos levitas cabem serviços próprios; a pessoa leiga está sujeita às determinações próprias dos leigos.
  to: Pois ao sumo sacerdote foram confiadas funções próprias, aos sacerdotes foi designado um lugar próprio, e aos levitas incumbem serviços próprios; a pessoa leiga está sujeita às prescrições aplicáveis aos leigos.
  rationale: A revisão preserva o paralelismo e a ênfase nas atribuições distintas de cada grupo. Ajusta o último membro para refletir o valor adjetival de λαϊκοῖς sem acrescentar uma ideia possessiva, e torna mais explícita a força obrigatória de ἐπίκεινται.
