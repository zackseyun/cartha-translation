id: 1CLEM.40.5
reference: 1 Clement 40:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: pt
  text: Pois ao sumo sacerdote foram confiadas funções próprias, aos sacerdotes foi designado um lugar próprio, e aos levitas incumbem serviços próprios; a pessoa leiga está sujeita às prescrições aplicáveis aos leigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργίαι
  choice: funções
  rationale: No contexto das atribuições sacerdotais, indica deveres ou funções de serviço; “funções” preserva a amplitude do termo sem restringi-lo ao sentido moderno de liturgia.
- source_word: διακονίαι
  choice: serviços
  rationale: Expressa as tarefas atribuídas aos levitas e mantém distinção lexical em relação a λειτουργίαι.
- source_word: λαϊκὸς ἄνθρωπος
  choice: a pessoa leiga
  rationale: Reproduz o contraste entre os ministros do culto e quem pertence ao povo, com linguagem inclusiva e natural em português atual.
- source_word: προστάγμασιν
  choice: determinações
  rationale: Comunica normas ou prescrições vinculantes sem importar terminologia jurídica ou eclesiástica excessivamente específica.
theological_decisions:
- issue: Caráter próprio e distinto das atribuições cultuais
  choice: Repetir “próprio/próprias” em cada grupo
  alternative: Suprimir parte da repetição para maior fluidez
  rationale: A repetição de ἴδιος/ἴδιαι é enfática e sustenta o argumento do texto sobre atribuições delimitadas; por isso foi preservada.
- issue: Sentido de λαϊκός
  choice: “leigo”
  alternative: “membro do povo”
  rationale: “Leigo” conserva o contraste técnico presente no grego, sem ampliar o texto para uma formulação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do grego. Emprega “cabem” para ἐπίκεινται e “está sujeita” para δέδεται, evitando literalismos pouco naturais como “estão postos sobre” e “está amarrada”.
