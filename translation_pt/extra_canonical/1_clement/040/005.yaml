review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e as distinções lexicais do grego são em geral bem preservadas: λειτουργίαι como “funções”, διακονίαι como “serviços”, e a repetição de ἴδιος/ἴδιαι nos três primeiros membros. Contudo, “determinações próprias dos leigos” torna o último sintagma mais possessivo e reflexivo do que o grego λαϊκοῖς προστάγμασιν, que designa preceitos aplicáveis ao leigo, em contraste com as obrigações cultuais dos demais grupos.'
  naturalness: O período é claro e de registro apropriado. “Incumbem aos levitas” reproduz de modo mais próximo e natural a ideia de serviços que lhes são impostos/atribuídos do que “aos levitas cabem”. “Prescrições aplicáveis aos leigos” é mais idiomático do que “determinações próprias dos leigos” e evita ambiguidade.
  terminology: “Sumo sacerdote”, “sacerdotes”, “levitas” e “pessoa leiga” mantêm adequadamente o contraste institucional do texto. “Prescrições” exprime bem προστάγματα como normas vinculantes, sem impor leitura denominacional.
  issues:
  - severity: medium
    issue: O sintagma final “determinações próprias dos leigos” pode sugerir determinações emanadas dos leigos ou uma ênfase em “próprias” que não está explicitamente presente nesse membro.
    rationale: λαϊκοῖς qualifica προστάγμασιν (“preceitos leigos”, isto é, preceitos pertinentes aos leigos), enquanto ἴδιος/ἴδιαι ocorre somente nos três membros anteriores.
  - severity: low
    issue: “Aos levitas cabem serviços próprios” atenua a construção passiva de obrigação em ἐπίκεινται.
    rationale: “Incumbem aos levitas” conserva melhor a noção de deveres que recaem sobre eles, sem recorrer a um literalismo pesado.
  revised_text: Pois ao sumo sacerdote foram confiadas funções próprias, aos sacerdotes foi designado um lugar próprio, e aos levitas incumbem serviços próprios; a pessoa leiga está sujeita às prescrições aplicáveis aos leigos.
