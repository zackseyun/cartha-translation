source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: pt
  text: Portanto, visto que essas coisas nos são evidentes e que nos debruçamos sobre as profundezas do conhecimento divino, devemos fazer de modo ordenado tudo o que o Soberano mandou realizar nas ocasiões determinadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: evidentes
  rationale: Expressa aquilo que é manifesto ou claro, em português corrente e digno.
- source_word: ἐγκεχυφότες
  choice: nos debruçamos sobre
  rationale: Preserva a imagem de inclinar-se para examinar atentamente, sem sugerir domínio completo das profundezas divinas.
- source_word: τάξει
  choice: de modo ordenado
  rationale: Trata o dativo como expressão de maneira, evitando a leitura equivocada de uma oração de finalidade.
- source_word: δεσπότης
  choice: Soberano
  rationale: Conserva a força de autoridade de δεσπότης e, no contexto, funciona como título divino natural.
- source_word: κατὰ καιροὺς τεταγμένους
  choice: nas ocasiões determinadas
  rationale: Comunica períodos ou ocasiões fixados, mantendo o valor de καιρός em vez de reduzi-lo ao tempo cronológico em geral.
theological_decisions:
- issue: Título divino δεσπότης
  choice: Soberano
  alternative: Senhor
  rationale: “Soberano” preserva mais explicitamente a autoridade absoluta do termo grego; “Senhor” seria natural, mas menos específico.
- issue: Alcance humano do conhecimento divino
  choice: nos debruçamos sobre as profundezas
  alternative: sondamos as profundezas
  rationale: A formulação escolhida preserva a imagem de exame atento sem afirmar que os seres humanos tenham perscrutado ou compreendido plenamente o conhecimento divino.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe fluente. A ordem lógica e os dois fundamentos introduzidos pelos particípios gregos são preservados; “de modo ordenado” explicita naturalmente a função adverbial de τάξει.
