source:
  edition: Funk 1901 (normalized OCR)
  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: pt
  text: Ele ordenou que tanto as ofertas como os serviços fossem realizados não ao acaso nem de maneira desordenada, mas em tempos e horas determinados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφορὰς
  choice: ofertas
  rationale: Equivalente direto e natural para as ofertas apresentadas no contexto do culto.
- source_word: λειτουργίας
  choice: serviços
  rationale: Preserva o sentido de atos ou serviços cultuais sem impor o sentido técnico mais tardio de “liturgias”.
- source_word: εἰκῇ
  choice: de modo aleatório
  rationale: Expressa a ideia de algo feito ao acaso, sem planejamento, em contraste com tempos determinados.
- source_word: ἀτάκτως
  choice: desordenado
  rationale: Comunica a ausência de ordem prescrita e mantém a distinção em relação a εἰκῇ.
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: em tempos e horas determinados
  rationale: Reproduz os dois termos temporais e a noção de períodos previamente definidos.
theological_decisions:
- issue: Natureza de λειτουργίας
  choice: serviços
  alternative: liturgias; ministérios
  rationale: “Serviços” é amplo o bastante para o contexto cultual e evita tanto uma institucionalização litúrgica posterior quanto a possível leitura de cargos ministeriais.
- issue: Sujeito implícito de ἐκέλευσεν
  choice: Ele
  alternative: Deus
  rationale: Mantém o sujeito pronominal implícito conforme o contexto, sem explicitar no versículo um nome ausente desta frase grega.
translation_notes:
  register: 'Português moderno, digno e claro, com estrutura formal moderada. A coordenação grega foi simplificada de modo natural, sem perder a dupla oposição: ao acaso/sem ordem versus tempos fixados.'
