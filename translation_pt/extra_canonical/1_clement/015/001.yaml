  source_fidelity: A tradução preserva bem a exortação inclusiva de κολληθῶμεν (“apeguemo-nos”) e o contraste do grego entre os que εἰρηνεύουσιν, isto é, vivem/agem pacificamente, com εὐσέβεια, e os que apenas desejam a paz com ὑπόκρισις. “Com devoção” e “com hipocrisia” expressam adequadamente o valor modal/comitativo das preposições, sem transformar devoção ou hipocrisia no objeto da paz.
