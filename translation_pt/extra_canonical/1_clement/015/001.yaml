source:
  edition: Funk 1901 (normalized OCR)
  text: Τοίνυν κολληθῶμεν τοῖς μετ᾽ εὐσεβείας εἰρηνεύουσιν, καὶ μὴ τοῖς μεθ᾽ ὑποκρίσεως βουλομένοις εἰρήνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/001.yaml
  text: Therefore let us join ourselves to those who Therefore let us join ourselves to those who live in peace with godliness, and not to those who desire peace with hypocrisy..
translation:
  language: pt
  text: Portanto, apeguemo-nos aos que vivem em paz com devoção[a], e não aos que desejam a paz com hipocrisia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “promovem a paz com piedade”.'
    reason: O verbo grego pode significar viver em paz ou agir para promovê-la; além disso, “piedade” é uma tradução mais tradicional de εὐσέβεια.
lexical_decisions:
- source_word: κολληθῶμεν
  choice: apeguemo-nos
  rationale: Preserva a força exortativa do subjuntivo e a ideia de vincular-se estreitamente a determinadas pessoas.
- source_word: εἰρηνεύουσιν
  choice: vivem em paz
  rationale: Expressa o sentido de viver ou agir pacificamente sem transformar a piedade no objeto com o qual se faz a paz.
- source_word: εὐσεβείας
  choice: devoção
  rationale: Comunica em português atual a piedade ou reverência religiosa indicada pelo termo grego, com boa clareza para leitores comuns.
- source_word: βουλομένοις εἰρήνην
  choice: desejam a paz
  rationale: 'Mantém a diferença verbal do original: o primeiro grupo vive em paz, enquanto o segundo apenas deseja a paz.'
- source_word: ὑποκρίσεως
  choice: hipocrisia
  rationale: Equivalente direto e natural, preservando o contraste moral com a devoção.
theological_decisions:
- issue: Relação de μετ᾽ εὐσεβείας com εἰρηνεύουσιν
  choice: “vivem em paz com devoção” como indicação da maneira ou qualidade de sua vida pacífica
  alternative: “fazem/promovem a paz com devoção”
  rationale: O verbo pode referir-se a estar ou viver em paz e também admitir uma nuance ativa. A redação principal segue a leitura contextual mais natural sem fazer da devoção o objeto da reconciliação; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva o contraste intencional entre viver em paz com devoção e apenas desejar a paz com hipocrisia.
