id: 1CLEM.15.5
reference: 1 Clement 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: pt
  text: 'Por isso, emudeçam os lábios enganadores, que proferem injustiça contra o justo. E novamente: “Que o Senhor extermine todos os lábios enganadores, a língua arrogante e os que dizem: ‘Engrandeceremos a nossa língua; nossos lábios nos pertencem. Quem é senhor sobre nós?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: emudeçam
  rationale: Expressa de modo natural e conciso o desejo ou ordem de que os lábios se tornem incapazes de falar.
- source_word: ἀνομίαν
  choice: injustiça
  rationale: No contexto da citação do salmo, designa fala injusta ou perversa contra o justo; evita a formulação pouco natural “proferir ilegalidade”.
- source_word: μεγαλοῤῥήμονα
  choice: arrogante
  rationale: Caracteriza a língua que profere palavras grandiosas e presunçosas; “arrogante” comunica o sentido em português corrente.
- source_word: μεγαλυνοῦμεν
  choice: Engrandeceremos
  rationale: Mantém a imagem verbal de tornar grande ou exaltar a própria língua e preserva o futuro do grego.
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: nossos lábios estão sob o nosso próprio domínio
  rationale: Torna explícita a ideia idiomática de controle ou posse sem reduzi-la à mera localização “conosco”.
theological_decisions:
- issue: Força verbal de Ἐξολεθρευθῆσαν
  choice: Que o Senhor extermine
  alternative: O Senhor exterminou / exterminará
  rationale: A forma transmite uma imprecação ou desejo, não uma simples declaração histórica ou previsão.
- issue: Referente de τοῦ δικαίου
  choice: o justo
  alternative: o homem justo / os justos
  rationale: Preserva o singular substantivado e sua possível aplicação geral, sem identificar uma pessoa específica.
- issue: Sentido de κύριος na pergunta final
  choice: senhor
  alternative: Senhor
  rationale: A pergunta desafia qualquer autoridade ou domínio sobre os falantes; a minúscula preserva essa amplitude e não força uma referência exclusivamente titular a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência apropriada a uma citação das Escrituras. Mantiveram-se o paralelismo, a força imprecatória e a repetição de “lábios” e “língua” do grego.
