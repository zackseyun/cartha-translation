  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: pt
  text: 'Pois em algum lugar se diz: “Este povo me honra com os lábios, mas o coração deles está longe de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Pois em certo lugar está escrito
  rationale: Expressa naturalmente a fórmula de introdução de uma citação. Embora λέγει signifique literalmente “diz”, o sujeito implícito é a Escritura ou o texto citado; “está escrito” torna isso claro sem identificar uma passagem específica.
- source_word: τοῖς χείλεσιν με τιμᾷ
  choice: me honra com os lábios
  rationale: Preserva de modo direto a imagem do grego e sua ideia de honra meramente verbal.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mas o coração deles
  rationale: Mantém o singular coletivo καρδία ligado ao plural αὐτῶν, sem normalizá-lo para “seus corações”.
- source_word: πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: está longe de mim
  rationale: Reproduz com naturalidade a distância relacional expressa pela construção grega, sem acrescentar intensidade.
theological_decisions:
- issue: Identidade do agente em λέγει
  choice: “está escrito”, sem nomear Deus, o profeta ou a Escritura
  alternative: “ele diz” ou “a Escritura diz”
  rationale: O grego deixa o sujeito implícito. A formulação escolhida preserva a função escriturística da citação sem impor uma identificação que o verso não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural e preservação da imagem bíblica dos lábios e do coração. O singular coletivo “o coração deles” foi mantido por fidelidade ao grego.
