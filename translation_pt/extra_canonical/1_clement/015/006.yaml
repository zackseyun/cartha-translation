source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: pt
  text: “Por causa da aflição dos pobres e do gemido dos necessitados, agora me levantarei”, diz o Senhor. “Eu porei em segurança.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara expressamente quem será posto em segurança; a tradução mantém o complemento implícito.
    reason: Preserva a indeterminação do objeto presente no texto grego, sem introduzir um pronome singular.
lexical_decisions:
- source_word: ταλαιπωρίας
  choice: aflição
  rationale: Expressa sofrimento e condição penosa de modo natural e digno, sem restringir o sentido à pobreza material.
- source_word: πτωχῶν
  choice: pobres
  rationale: Equivalente direto e corrente para os que vivem em pobreza ou desamparo.
- source_word: στεναγμοῦ
  choice: gemido
  rationale: Preserva a imagem audível de sofrimento presente no termo grego.
- source_word: πενήτων
  choice: necessitados
  rationale: Distingue o termo de πτωχῶν e comunica a ideia de pessoas carentes ou em necessidade.
- source_word: ἀναστήσομαι
  choice: me levantarei
  rationale: Mantém a metáfora de Deus se erguer para agir, em vez de a substituir por uma explicação.
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: o porei em segurança
  rationale: Reproduz a ação de colocar alguém numa condição ou lugar seguro; o pronome torna a frase natural em português, embora o objeto esteja implícito no grego.
theological_decisions:
- issue: Identidade do objeto de θήσομαι
  choice: Empregar o pronome singular genérico “o”, entendido como referência ao pobre ou necessitado oprimido.
  alternative: Omitir o objeto (“porei em segurança”) ou usar o plural “os”.
  rationale: O texto grego não traz objeto expresso. O singular acompanha a leitura contextual refletida na camada inglesa, sem converter os dois plurais anteriores num objeto plural explícito; a nota preserva a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Me levantarei” é natural para leitores brasileiros e continua amplamente compreensível em outras variedades do português.
