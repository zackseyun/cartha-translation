source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν καὶ τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν, ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ, οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: pt
  text: 'E diz novamente: “Eles o amaram com a boca e, com a língua, mentiram para ele; mas o coração deles não era reto para com ele, nem foram fiéis à sua aliança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  choice: Eles o amaram com a boca
  rationale: Mantém a imagem concreta e a formulação do grego, que contrasta a profissão verbal de amor com a falta de retidão interior.
- source_word: ἐψεύσαντο αὐτόν
  choice: mentiram para ele
  rationale: Expressa naturalmente em português o sentido de dirigir falsidade a alguém, sem suavizar a acusação.
- source_word: οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  choice: não era reto para com ele
  rationale: Preserva a metáfora moral de εὐθεῖα e a relação indicada por μετ᾽ αὐτοῦ, em linguagem digna e inteligível.
- source_word: οὐδὲ ἐπιστώθησαν
  choice: nem foram fiéis
  rationale: Traduz diretamente a ideia de fidelidade sem acrescentar 'foram considerados' ou 'mostraram-se', nuances não exigidas pelo texto.
- source_word: ἐν τῇ διαθήκῃ αὐτοῦ
  choice: à sua aliança
  rationale: Em português, 'ser fiel à aliança' comunica de modo natural a relação expressa pelo grego ἐν; 'aliança' é o equivalente contextual apropriado de διαθήκη.
theological_decisions:
- issue: Natureza da infidelidade à aliança
  choice: nem foram fiéis à sua aliança
  alternative: nem se mantiveram firmes em sua aliança
  rationale: A opção escolhida conserva a linguagem de fidelidade de ἐπιστώθησαν sem definir se o texto enfatiza crença, lealdade ou perseverança, preservando sua amplitude.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo próximo ao grego. Conservou-se a oposição entre boca/língua e coração, sem explicitar além do texto a diferença entre profissão exterior e disposição interior.
