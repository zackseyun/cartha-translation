reference: 1 Clement 60:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: pt
  text: Não leves em conta pecado algum dos teus servos e servas, mas purifica-nos com a purificação da tua verdade e dirige os nossos passos, para que andemos em santidade de coração e façamos o que é bom e agradável diante de ti e dos nossos governantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: Não leves em conta pecado algum
  rationale: A combinação negativa μὴ ... πᾶσαν, em grego influenciado pela Septuaginta, exprime naturalmente a petição de que nenhum pecado seja computado. Em português, “não leves em conta pecado algum” evita a leitura inadequada de que apenas nem todos, mas alguns pecados, seriam levados em conta.
- source_word: δούλων σου καὶ παιδισκῶν
  choice: dos teus servos e servas
  rationale: Mantém o par masculino e feminino e o registro de oração, sem a rigidez desnecessária de “escravos e escravas”; no contexto, os termos designam os suplicantes como pessoas a serviço de Deus.
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: purifica-nos com a purificação da tua verdade
  rationale: Preserva deliberadamente a figura etimológica entre καθάρισον e καθαρισμόν e a construção densa do original, entendendo o acusativo como indicação do meio ou conteúdo da purificação.
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: dirige os nossos passos
  rationale: Expressão portuguesa natural que conserva a imagem bíblica de Deus endireitar ou orientar o caminhar.
- source_word: ἐν ὁσιότητι καρδίας
  choice: em santidade de coração
  rationale: ὁσιότης denota piedade ou santidade conforme o que é devido a Deus; “santidade” mantém o teor religioso e “de coração” preserva o genitivo.
- source_word: τὰ καλὰ καὶ εὐάρεστα
  choice: o que é bom e agradável
  rationale: Converte o neutro plural idiomático em formulação coletiva natural, preservando as duas qualidades.
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: dos nossos governantes
  rationale: No contexto político da oração, ἄρχοντες refere-se às autoridades que governam; “governantes” é claro e não especifica uma estrutura estatal particular.
theological_decisions:
- issue: Alcance da negação em μὴ ... πᾶσαν ἁμαρτίαν
  choice: pecado algum
  alternative: todo pecado / cada pecado
  rationale: Embora πᾶσαν isoladamente signifique “todo/cada”, sob negação a expressão pode significar “nenhum pecado”. Essa leitura se ajusta ao uso semitizante e ao sentido da súplica, sem sugerir que se peça a Deus apenas que não considere a totalidade dos pecados.
- issue: Relação entre a conduta e Deus e os governantes
  choice: bom e agradável diante de ti e dos nossos governantes
  alternative: bom diante de ti e agradável diante dos nossos governantes
  rationale: A coordenação grega aplica conjuntamente καλὰ καὶ εὐάρεστα aos dois complementos introduzidos por ἐνώπιον; a tradução preserva essa estrutura sem repartir artificialmente os adjetivos.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de oração comunitária. Conserva a repetição enfática “purifica-nos com a purificação”, por ser uma característica expressiva do grego, e usa “tu” de modo coerente com a invocação.
