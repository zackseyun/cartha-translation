id: 1CLEM.60.1
reference: 1 Clement 60:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: pt
  text: Pois tu manifestaste a ordem eterna do mundo por meio de tuas obras. Tu, Senhor, criaste a terra habitada; és fiel em todas as gerações, justo em teus julgamentos, maravilhoso em poder e majestade, sábio ao criar e prudente ao firmar as coisas que vieram a existir, bom nas coisas visíveis e fiel para com os que confiam em ti.[a] Ó misericordioso e compassivo, perdoa-nos nossas transgressões da lei, nossas injustiças, nossos delitos e nossas faltas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiam em ti, misericordioso e compassivo. Perdoa-nos”.'
    reason: A pontuação pode ligar “misericordioso e compassivo” ao que precede, embora a leitura no texto principal os entenda como invocação antes do pedido de perdão.
lexical_decisions:
- source_word: ἀέναον ... σύστασιν
  choice: ordem eterna
  rationale: Expressa a ideia de uma ordem ou constituição duradoura do mundo em português natural, sem reduzir σύστασις à mera existência.
- source_word: διὰ τῶν ἐνεργουμένων
  choice: por meio de tuas obras
  rationale: Traduz o sentido das coisas realizadas ou operadas por Deus de modo claro e digno; evita a formulação pouco natural “por meio das coisas que são operadas”.
- source_word: οἰκουμένην
  choice: terra habitada
  rationale: Preserva o sentido específico de οἰκουμένη como o mundo ou a terra habitada.
- source_word: ἑδράσαι
  choice: firmar
  rationale: Comunica o ato de estabelecer com solidez aquilo que veio a existir.
- source_word: ἀνομίας
  choice: transgressões da lei
  rationale: Mantém o componente de violação da lei presente em ἀνομία e o distingue dos demais termos da série.
- source_word: παραπτώματα
  choice: delitos
  rationale: Representa atos de transgressão ou tropeço moral, mantendo-o distinto de injustiças e faltas.
- source_word: πλημμελείας
  choice: faltas
  rationale: Comunica falhas e ações indevidas em linguagem corrente, sem impor uma categoria doutrinária técnica.
theological_decisions:
- issue: Relação de ἐλεῆμον καὶ οἰκτίρμον com a petição
  choice: “Ó misericordioso e compassivo” como invocação que introduz “perdoa-nos”
  alternative: 'Ligar os adjetivos à frase anterior: “os que confiam em ti, misericordioso e compassivo. Perdoa-nos”'
  rationale: A leitura adotada acompanha a mudança para a invocação direta e a associação natural dos adjetivos com o imperativo ἄφες, ao mesmo tempo que a nota registra a alternativa de pontuação.
- issue: Bondade de Deus ἐν τοῖς ὁρωμένοις
  choice: “bom nas coisas visíveis”
  alternative: “bondoso no que se vê” ou “bom por meio das coisas visíveis”
  rationale: A formulação preserva a construção ampla e algo ambígua do grego, sem explicitar se as coisas visíveis exibem, recebem ou constituem o âmbito da bondade divina.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A longa sequência de atributos foi preservada, mas organizada com pontuação natural. O pronome “tu” mantém a forma de oração direta e digna.
