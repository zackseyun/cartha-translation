source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: pt
  text: Sim, Soberano, faz resplandecer o teu rosto sobre nós para o nosso bem, em paz, a fim de que sejamos protegidos por tua mão poderosa e libertos de todo pecado por teu braço elevado, e livra-nos dos que nos odeiam injustamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade absoluta e funciona naturalmente como invocação reverente, sem a conotação moderna negativa que «mestre» pode assumir neste contexto.
- source_word: ἐπίφανον τὸ πρόσωπών σου
  choice: faze resplandecer o teu rosto
  rationale: Preserva a imagem bíblica da manifestação favorável do rosto divino e o valor causativo do imperativo.
- source_word: εἰς ἀγαθὰ ἐν εἰρήνῃ
  choice: para o nosso bem, em paz
  rationale: Mantém tanto a finalidade benéfica quanto a ideia de paz, sem forçar uma relação sintática mais específica do que o grego permite.
- source_word: σκεπασθῆναι
  choice: sejamos protegidos
  rationale: Comunica com naturalidade a ideia de ser coberto ou abrigado sob a mão divina.
- source_word: τῇ χειρί σου τῇ κραταιᾷ
  choice: por tua mão poderosa
  rationale: Conserva a metáfora antropomórfica e traduz κραταιᾷ pelo sentido de força e poder.
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: por teu braço elevado
  rationale: Reproduz de modo direto ὑψηλῷ e preserva a linguagem elevada e imagética do texto, sem substituir a imagem por uma interpretação.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de todo pecado
  rationale: Mantém o singular coletivo de ἁμαρτία e o alcance abrangente de πάσης.
- source_word: τῶν μισούντων ἡμᾶς ἀδίκως
  choice: dos que nos odeiam injustamente
  rationale: Tradução direta que conserva a qualificação moral expressa pelo advérbio ἀδίκως.
theological_decisions:
- issue: Sentido de ἁμαρτία na petição de livramento
  choice: pecado
  alternative: mal / desgraça
  rationale: O sentido lexical normal é «pecado»; embora o contexto de livramento permita considerar consequências ou males, não há razão textual suficiente para diluir o termo.
- issue: Imagem do braço ὑψηλός
  choice: braço elevado
  alternative: braço excelso / braço exaltado
  rationale: «Elevado» preserva a imagem espacial e sua possível ressonância de majestade sem decidir se o adjetivo descreve posição, poder ou exaltação.
translation_notes:
  register: Português moderno, reverente e amplamente inteligível, com legibilidade brasileira. A sintaxe conserva o movimento de oração do grego, mas usa pontuação contemporânea para evitar um período excessivamente pesado. Emprega-se «tu» de modo coerente na invocação.
