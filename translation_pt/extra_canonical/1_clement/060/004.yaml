id: 1CLEM.60.4
reference: 1 Clement 60:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: pt
  text: Concede concórdia e paz a nós e a todos os que habitam a terra, assim como as concedeste aos nossos pais quando eles te invocavam com santidade, fé e verdade; e faze que sejamos obedientes[a] ao teu nome todo-poderoso e pleno de toda virtude, bem como aos nossos governantes e líderes na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “tornando-nos obedientes” e muda de construção de modo abrupto. O particípio se refere aos que fazem a oração, não aos “nossos pais”.
    reason: Esclarecer a sintaxe irregular e preservar a identificação gramatical do referente, questão que afeta diretamente o sentido.
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: concórdia
  rationale: No contexto de 1 Clemente, designa união cívica e comunitária em oposição a facções e conflitos; “concórdia” preserva melhor essa dimensão do que o mais amplo “harmonia”.
- source_word: ὁσίως
  choice: com santidade
  rationale: Expressa a maneira reverente e piedosa de invocar Deus, mantendo a ligação com ὅσιος sem recorrer a linguagem arcaica.
- source_word: πανάρετῳ
  choice: pleno de toda virtude
  rationale: Reproduz o sentido intensivo e abrangente de “dotado de toda excelência/virtude”, aplicado ao nome divino, em português claro e digno.
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: governantes e líderes
  rationale: Preserva os dois termos sobrepostos de autoridade política e direção sem fundi-los numa única categoria.
theological_decisions:
- issue: Referente de ὑπηκόους γινομένους
  choice: “faze que sejamos obedientes”, referindo o particípio aos suplicantes atuais
  alternative: Entender que os “nossos pais” se tornavam obedientes
  rationale: O particípio está no acusativo plural, não no genitivo exigido para concordar com αὐτῶν; além disso, “nossos governantes e líderes” aponta naturalmente para a comunidade que faz a oração. A formulação portuguesa explicita o referente sem atribuir aos antepassados obediência aos governantes atuais.
- issue: Obediência ao nome divino e às autoridades terrenas
  choice: Manter ambos os complementos coordenados
  alternative: Subordinar ou separar a obediência civil da obediência ao nome de Deus
  rationale: O grego coordena τῷ ... ὀνόματί σου e τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν; a tradução conserva essa tensão sem acrescentar qualificações doutrinárias ausentes do texto.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. “Concórdia” mantém o vocabulário cívico característico da obra; a reformulação verbal em “faze que sejamos” evita uma sequência participial ambígua em português.
