revisions:
- from: 'E diz novamente: “Vi o ímpio muito exaltado, erguendo-se como os cedros do Líbano. Passei, e eis que já não existia; procurei o seu lugar, mas não o encontrei. Conserva a integridade e contempla a retidão, pois há futuro para quem promove a paz.”'
  to: 'E novamente diz: “Vi o ímpio altamente exaltado e elevando-se como os cedros do Líbano. Passei, e eis que não estava lá; procurei o seu lugar e não o encontrei. Guarda a inocência e observa a retidão, pois há um remanescente para a pessoa pacífica.”'
