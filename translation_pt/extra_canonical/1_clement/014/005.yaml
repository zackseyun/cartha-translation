source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: pt
  text: 'E novamente diz: “Vi o ímpio altamente exaltado e elevando-se como os cedros do Líbano. Passei, e eis que não estava lá; procurei o seu lugar e não o encontrei. Guarda a inocência e observa a retidão, pois há um remanescente para a pessoa pacífica.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβῆ
  choice: o ímpio
  rationale: Expressa de modo natural a pessoa que vive sem reverência a Deus, preservando o sentido moral e religioso do grego.
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: muito exaltado, erguendo-se
  rationale: Mantém os dois particípios e sua imagem de elevação arrogante, sem tornar a frase artificial em português.
- source_word: φύλασσε ἀκακίαν
  choice: Conserva a integridade
  rationale: ἀκακία pode indicar inocência, ausência de maldade ou integridade. Neste contexto sapiencial, “integridade” comunica melhor uma qualidade moral a ser preservada.
- source_word: ἴδε εὐθύτητα
  choice: contempla a retidão
  rationale: Preserva o imperativo visual ἴδε e traduz εὐθύτητα como conduta moral reta.
- source_word: ἐγκατάλειμμα
  choice: futuro
  rationale: No contexto da citação do Salmo 37:37, o termo aponta para aquilo que permanece ou está reservado ao justo; “futuro” oferece em português uma leitura clara sem impor a ideia específica de descendência.
- source_word: ἀνθρώπῳ εἰρηνικῷ
  choice: para quem promove a paz
  rationale: Traduz o caráter pacífico de modo idiomático e ativo, adequado ao contexto de Clemente sobre concórdia, sem restringir a referência ao sexo masculino.
theological_decisions:
- issue: Sentido de ἐγκατάλειμμα na promessa final
  choice: há futuro
  alternative: há um remanescente / há posteridade
  rationale: O substantivo é semanticamente difícil e a tradição textual do Salmo admite nuances de sobrevivência, posteridade ou destino futuro. “Futuro” preserva a promessa sem decidir de modo excessivamente específico entre essas possibilidades.
- issue: Caracterização de ἀνὴρ/ἄνθρωπος εἰρηνικός no contexto citado
  choice: quem promove a paz
  alternative: homem pacífico
  rationale: A formulação inclusiva comunica a aplicação humana geral e ressalta o caráter de quem vive em paz, sem acrescentar uma identidade confessional.
translation_notes:
  register: Português moderno, digno e fluente, com sintaxe bíblica moderada. “Eis que” foi mantido por sua força retórica reconhecível; a redação evita arcaísmos mais pesados. A tradução segue prioritariamente o texto grego fornecido e consulta a redação inglesa apenas como camada auxiliar.
