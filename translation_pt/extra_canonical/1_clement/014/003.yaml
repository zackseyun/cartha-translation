lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: Sejamos bondosos
  rationale: Expressa de modo natural a exortação do aoristo subjuntivo e preserva o sentido direto de agir com bondade.
- source_word: ἑαυτοῖς
  choice: uns com os outros
  rationale: Embora formalmente reflexivo, o pronome plural pode ter força recíproca no grego helenístico; o contexto comunitário favorece a bondade mútua.
- source_word: εὐσπλαγχνίαν
  choice: compaixão
  rationale: Reproduz o sentido de misericórdia ou compaixão profunda sem acrescentar conotação denominacional.
- source_word: γλυκύτητα
  choice: ternura
  rationale: Neste contexto moral, comunica a suavidade e afabilidade do termo grego de maneira corrente e digna em português.
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: daquele que nos fez
  rationale: Mantém a formulação simples e abrangente do grego, sem explicitar além do texto o conceito de criação.
theological_decisions:
- issue: Força reflexiva ou recíproca de ἑαυτοῖς
  choice: uns com os outros
  alternative: a nós mesmos
  rationale: O uso recíproco do pronome reflexivo plural é bem atestado, e a exortação à concórdia comunitária torna essa leitura mais provável; a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção exortativa “Sejamos” conserva o tom comunitário do original.
