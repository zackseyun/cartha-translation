id: 1CLEM.14.1
reference: 1 Clement 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: pt
  text: Portanto, é justo e santo, irmãos, que nos tornemos obedientes a Deus, em vez de seguirmos os que, em sua arrogância e desordem, são os instigadores[a] de uma inveja odiosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “líderes de uma inveja odiosa”.'
    reason: ἀρχηγοῖς pode designar tanto originadores ou instigadores quanto líderes; a nota preserva essa possibilidade lexical, embora “instigadores” se ajuste melhor à construção com o genitivo.
lexical_decisions:
- source_word: Δίκαιον ... καὶ ὅσιον
  choice: justo e santo
  rationale: Preserva a dupla qualificação ética e religiosa do grego em linguagem portuguesa natural e digna.
- source_word: ἄνδρες ἀδελφοί
  choice: irmãos
  rationale: A expressão grega é uma forma direta de tratamento; “irmãos” comunica naturalmente sua função sem a rigidez de “homens irmãos”.
- source_word: ὑπηκόους ... γενέσθαι
  choice: que nos tornemos obedientes
  rationale: Reproduz tanto a ideia de obediência quanto o aspecto ingressivo de γενέσθαι, isto é, passar a ser obediente.
- source_word: ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: em sua arrogância e desordem
  rationale: “Arrogância” expressa a pretensão insolente de ἀλαζονεία, e “desordem” mantém a amplitude de ἀκαταστασία, que pode envolver instabilidade, confusão ou perturbação.
- source_word: μυσεροῦ ζήλους ἀρχηγοῖς
  choice: instigadores de uma inveja odiosa
  rationale: ἀρχηγός com o genitivo pode designar o originador ou instigador de algo; ζῆλος, neste contexto negativo, é melhor expresso por “inveja”, e μυσερός por “odiosa”.
- source_word: ἐξακολουθεῖν
  choice: seguirmos
  rationale: Transmite de modo direto a ideia de acompanhar ou seguir a conduta e liderança dessas pessoas.
theological_decisions:
- issue: Contraste entre obediência a Deus e adesão aos causadores da dissensão
  choice: manter o contraste direto sem explicar a natureza da obediência
  alternative: interpretar a obediência como submissão a uma autoridade eclesiástica específica
  rationale: O texto nomeia Deus como objeto da obediência, mas não explicita aqui uma estrutura denominacional ou eclesiológica; a tradução evita acrescentá-la.
- issue: Valor de ζῆλος
  choice: inveja
  alternative: ciúme ou zelo
  rationale: O contexto é inequivocamente negativo, reforçado por μυσερός, arrogância e desordem. “Inveja” preserva melhor esse sentido sem importar uma leitura positiva de “zelo”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem da frase foi levemente ajustada para fluidez, sem eliminar o contraste ou a força moral do original.
