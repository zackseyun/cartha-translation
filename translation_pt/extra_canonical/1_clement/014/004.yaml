review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura proverbial e o contraste ético do grego. «Íntegros», «inocentes», «habitarão a terra» e «permanecerão nela» são escolhas defensáveis para χρηστοί, ἄκακοι, οἰκήτορες γῆς e ὑπολειφθήσονται. Contudo, «vivem contra a lei» é mais perifrástico do que o particípio παρανομοῦντες; «transgridem a lei» o exprime de modo mais direto. A construção «serão exterminados dela» soa pouco idiomática e não mantém com clareza o antecedente de αὐτῆς.
  naturalness: O registro é claro e apropriado. A substituição de «dela» por «da terra» melhora a fluência e evita uma combinação pouco natural com «exterminados».
  terminology: «Transgridem a lei» conserva explicitamente a noção de νόμος sem impor qual lei está em vista. «Exterminados da terra» comunica adequadamente a força de ἐξολεθρευθήσονται e a remoção indicada por ἀπ᾽ αὐτῆς.
  issues:
  - severity: low
    issue: «os que vivem contra a lei» é uma paráfrase de παρανομοῦντες.
    rationale: O grego descreve os que agem/transgridem contra a lei; «os que transgridem a lei» é mais direto, natural e preserva o caráter verbal do particípio.
  - severity: medium
    issue: «serão exterminados dela» é uma construção pouco idiomática e de referência pronominal menos nítida.
    rationale: Com ἀπ᾽ αὐτῆς, «serão exterminados da terra» exprime claramente a remoção da terra e soa mais natural em português.
  revised_text: 'Pois está escrito: “Os íntegros habitarão a terra, e os inocentes permanecerão nela; mas os que transgridem a lei serão exterminados da terra.”'
