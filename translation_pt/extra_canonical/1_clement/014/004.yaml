source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: pt
  text: 'Pois está escrito: “Os íntegros habitarão a terra, e os inocentes permanecerão nela; mas os que transgridem a lei serão exterminados da terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστοί
  choice: os íntegros
  rationale: No contexto proverbial, designa pessoas moralmente boas ou retas; “íntegros” é natural e preserva o contraste ético com os que vivem contra a lei.
- source_word: οἰκήτορες γῆς
  choice: habitarão a terra
  rationale: Reproduz de modo claro a ideia de residir na terra, sem decidir se γῆς se refere à terra em geral ou a uma terra/território específico.
- source_word: ἄκακοι
  choice: os inocentes
  rationale: Expressa a ausência de maldade ou dolo e corresponde ao sentido moral do termo neste paralelismo.
- source_word: ὑπολειφθήσονται
  choice: permanecerão
  rationale: Transmite naturalmente a ideia passiva de serem deixados ou restarem sobre a terra.
- source_word: παρανομοῦντες
  choice: os que vivem contra a lei
  rationale: 'Mantém o caráter verbal e contínuo do particípio: pessoas que agem em violação da lei, sem reduzi-lo apenas a um rótulo.'
- source_word: ἐξολεθρευθήσονται
  choice: serão exterminados
  rationale: Verbo forte que comunica destruição completa ou remoção definitiva; com “dela”, a formulação permanece idiomática em português.
theological_decisions:
- issue: Sentido de γῆ
  choice: a terra
  alternative: o país / a terra prometida
  rationale: O grego permite uma referência ampla ou territorial. A tradução conserva a expressão sem acrescentar uma identificação teológica específica.
- issue: Relação com a lei em παρανομοῦντες
  choice: os que vivem contra a lei
  alternative: os transgressores
  rationale: A opção escolhida preserva explicitamente νόμος, “lei”, e o aspecto ativo do particípio, sem especificar qual código legal está em vista.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A estrutura antitética do grego foi preservada, bem como a fórmula introdutória “Pois está escrito”.
