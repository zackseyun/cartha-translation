source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: pt
  text: Pois sofreremos um dano nada pequeno — antes, um grande perigo — se, de maneira temerária, nos entregarmos às vontades de pessoas que caem[a] em contendas e facções, com o propósito de nos afastar daquilo que é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido apresenta uma construção irregular neste ponto; a tradução segue πίπτουσιν, «caem». Outra forma textual conhecida pode ser traduzida por «se lançam».
    reason: textual_variant
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: um dano nada pequeno
  rationale: A expressão idiomática nega que o dano seja comum, insignificante ou casual; «nada pequeno» transmite naturalmente a ênfase no contexto.
- source_word: ὑποίσομεν
  choice: sofreremos
  rationale: O verbo significa literalmente «suportaremos» ou «teremos de arcar com»; «sofreremos» é idiomático em português com «dano» e «perigo».
- source_word: ῥιψοκινδύνως
  choice: de maneira temerária
  rationale: Expressa ação imprudente, com desprezo pelo risco, sem sugerir apenas rapidez ou descuido leve.
- source_word: ἐπιδῶμεν ἑαυτοὺς
  choice: nos entregarmos
  rationale: Reproduz o sentido de entregar ou sujeitar a si mesmo, em português natural.
- source_word: τοῖς θελήμασιν
  choice: às vontades
  rationale: Mantém o valor plural de θέλημα como desejos, intentos ou vontades, sem reduzir a expressão a planos formais.
- source_word: εἰς ἔριν καὶ στάσεις
  choice: em contendas e facções
  rationale: ἔρις indica conflito ou disputa; στάσεις, no plural, aponta para divisões partidárias ou facções.
- source_word: τοῦ καλοῦ ἔχοντος
  choice: daquilo que é bom
  rationale: Segue a forma fornecida e preserva a referência ampla ao que é bom, sem especificar uma doutrina ou conduta não expressa.
theological_decisions:
- issue: Valor de εἰς τὸ ἀπαλλοτριῶσαι
  choice: com o propósito de nos afastar
  alternative: de modo que nos afastem
  rationale: A construção pode indicar propósito ou resultado. A tradução mantém o valor final mais direto, enquanto a formulação evita determinar além do necessário se o afastamento é intenção consciente ou consequência visada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem retórica «antes, um grande perigo» preserva o contraste enfático do grego. O marcador [a] foi colocado exatamente no ponto de incerteza textual.
