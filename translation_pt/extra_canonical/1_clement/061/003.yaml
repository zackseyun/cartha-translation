id: 1CLEM.61.3
reference: 1 Clement 61:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: pt
  text: A ti, o único capaz de realizar entre nós[a] estas coisas e outras ainda melhores, damos graças por meio do sumo sacerdote e protetor das nossas almas, Jesus Cristo. Por meio dele, sejam dadas a ti a glória e a majestade, agora, de geração em geração e pelos séculos dos séculos. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conosco”.
    reason: A expressão grega μεθ’ ἡμῶν pode indicar atuação “entre nós” ou “conosco”; a tradução principal privilegia o sentido comunitário sem eliminar a alternativa.
lexical_decisions:
- source_word: ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ
  choice: realizar estas coisas e outras ainda melhores
  rationale: Expressa em português natural tanto ταῦτα quanto a ideia comparativa de περισσότερα ἀγαθὰ, sem a formulação pouco idiomática “coisas boas maiores”.
- source_word: μεθ’ ἡμῶν
  choice: entre nós
  rationale: Mantém o sentido comunitário mais provável da preposição μετά com genitivo neste contexto, sem transformá-la em benefício explícito (“por nós”).
- source_word: ἐξομολογούμεθα
  choice: damos graças
  rationale: No contexto de oração e doxologia, o verbo indica reconhecimento agradecido dirigido a Deus; “confessamos” seria enganoso no português corrente.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: Equivalente convencional e preciso do título cultual ἀρχιερεύς.
- source_word: προστάτου
  choice: protetor
  rationale: Comunica a função de quem defende, ampara ou vela pelas almas, com linguagem clara e digna.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  rationale: Preserva a forma nominal e litúrgica da expressão grega, sem expandir Χριστός para “Messias” neste contexto doxológico.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pelos séculos dos séculos
  rationale: Conserva a fórmula doxológica intensiva e sua ressonância tradicional, ainda compreensível em português.
theological_decisions:
- issue: Mediação de Jesus Cristo na ação de graças e na doxologia
  choice: “por meio do sumo sacerdote e protetor das nossas almas, Jesus Cristo... Por meio dele”
  alternative: Reformular Jesus como destinatário direto da ação de graças ou da glória
  rationale: A sintaxe grega apresenta Deus como destinatário (σοί) e Jesus Cristo como mediador introduzido por διά; a tradução preserva essa relação sem acrescentar uma formulação doutrinária externa.
- issue: Força de Χριστός
  choice: “Cristo”
  alternative: “Messias”
  rationale: Na fórmula solene Ἰησοῦ Χριστοῦ, sem artigo, “Jesus Cristo” reproduz melhor o uso consolidado como nome-título e o registro litúrgico.
- issue: Elipse verbal da doxologia
  choice: “sejam dadas a ti a glória e a majestade”
  alternative: “a ti pertencem a glória e a majestade”
  rationale: O grego omite o verbo. A opção adotada torna a frase natural em português e mantém o caráter optativo/doxológico, sem definir a elipse como simples afirmação de posse.
translation_notes:
  register: Português moderno, claro e solene, com cadência de oração. A longa construção grega foi dividida em duas frases para legibilidade, preservando a continuidade lógica por meio da repetição de “Por meio dele”. Mantiveram-se as fórmulas tradicionais “sumo sacerdote” e “séculos dos séculos” por sua precisão e adequação doxológica.
