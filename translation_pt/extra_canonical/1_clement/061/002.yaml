review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem a oração: δέσποτα é adequadamente vertido por «Soberano»; διεύθυνον é corretamente entendido como imperativo; e a cláusula final é traduzida segundo a leitura contextual e amplamente atestada ἵλεώς σου τυγχάνωσιν («obtenham teu favor/benevolência»). Contudo, a nota descreve de modo impreciso a forma do texto OCR: θεοῦ σου seria literalmente «de teu Deus», não «teu Deus».'
  naturalness: A redação é clara e mantém registro orante. A pequena revisão de «com paz» para «em paz» e de «exercendo com ... a autoridade» para uma construção mais fluida melhora a leitura sem alterar o sentido.
  terminology: «Soberano», «Rei celestial dos séculos», «mansidão», «piedade» e «favor» são escolhas apropriadas. «Decisões» é uma contextualização aceitável de βουλή; a nota textual deve distinguir explicitamente a leitura OCR da leitura adotada.
  issues:
  - severity: medium
    issue: A nota afirma que θεοῦ σου significa literalmente «teu Deus».
    rationale: θεοῦ está no genitivo; a sequência seria literalmente «de teu Deus» (ou «do teu Deus»). Além disso, a tradução «teu favor» não provém dessa sequência, mas da leitura contextual ἵλεώς σου.
  - severity: low
    issue: A expressão «exercendo com paz, mansidão e piedade a autoridade» é um pouco pesada em português.
    rationale: A revisão preserva o particípio διέποντες e os modificadores ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς, mas torna a relação sintática mais natural.
  revised_text: Pois tu, Soberano, Rei celestial dos séculos, dás aos filhos dos seres humanos glória, honra e autoridade sobre os que estão na terra. Senhor, orienta as decisões deles segundo o que é bom e agradável diante de ti, para que, ao exercerem em paz, com mansidão e piedade, a autoridade que lhes deste, alcancem o teu favor.[a]
  revised_footnotes:
  - marker: a
    text: O texto grego fornecido traz θεοῦ σου, literalmente «de teu Deus», uma leitura que não produz uma construção coerente neste contexto. A leitura conhecida desta passagem é ἵλεώς σου, «teu favor» ou «tua benevolência».
    reason: Assinala a provável corrupção ou falha de OCR no texto-fonte e identifica a leitura que fundamenta a tradução adotada.
  revision_rationale: A revisão corrige a explicação gramatical da nota textual e suaviza a expressão portuguesa do exercício da autoridade. Mantém-se a tradução contextual da cláusula final, pois a forma OCR fornecida é sintaticamente incoerente e a leitura ἵλεώς σου explica diretamente «alcancem o teu favor».
