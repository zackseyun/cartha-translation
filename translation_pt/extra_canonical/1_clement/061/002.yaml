reference: 1 Clement 61:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: pt
  text: Pois tu, Soberano, Rei celestial dos séculos, dás aos filhos dos seres humanos glória, honra e autoridade sobre os que estão na terra. Senhor, orienta as decisões deles segundo o que é bom e agradável diante de ti, para que, ao exercerem em paz, com mansidão e piedade, a autoridade que lhes deste, alcancem o teu favor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido traz θεοῦ σου, literalmente «de teu Deus», uma leitura que não produz uma construção coerente neste contexto. A leitura conhecida desta passagem é ἵλεώς σου, «teu favor» ou «tua benevolência».
    reason: Assinala a provável corrupção ou falha de OCR no texto-fonte e identifica a leitura que fundamenta a tradução adotada.
lexical_decisions:
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade suprema em linguagem digna e atual; evita que «Mestre» seja entendido apenas como professor.
- source_word: βασιλεῦ τῶν αἰώνων
  choice: Rei ... dos séculos
  rationale: Mantém a expressão temporal abrangente do grego e seu registro litúrgico.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aos filhos dos seres humanos
  rationale: Preserva o semitismo do original sem restringir ἄνθρωποι ao sexo masculino.
- source_word: τῶν ἐπὶ τῆς γῆς ὑπαρχόντων
  choice: sobre os que vivem na terra
  rationale: O genitivo depende de ἐξουσία e indica aqueles sobre quem a autoridade é exercida; a forma grega pode ser morfologicamente masculina ou neutra, mas o contexto de governo favorece referência a pessoas.
- source_word: διεύθυνον τὴν βουλὴν αὐτῶν
  choice: orienta as decisões deles
  rationale: O imperativo διεύθυνον é uma súplica. «Decisões» comunica naturalmente βουλή no contexto da atuação dos governantes, embora «conselho» ou «deliberação» também sejam possíveis.
- source_word: διέποντες
  choice: exercendo
  rationale: Em combinação com ἐξουσία, descreve a administração ou exercício da autoridade; esta construção é mais natural em português do que «governando a autoridade».
- source_word: ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς
  choice: com paz, mansidão e piedade
  rationale: Reproduz as três qualidades do exercício do poder em português claro e solene.
theological_decisions:
- issue: Natureza da autoridade civil
  choice: A autoridade é apresentada como dada por Deus, sem especificar uma teoria denominacional de governo.
  alternative: Explicitar que cada governante ou regime foi diretamente instituído ou aprovado por Deus.
  rationale: O texto afirma que Deus concede autoridade, mas não desenvolve as distinções teológicas que uma formulação mais específica imporia.
- issue: Objeto da autoridade
  choice: «sobre os que vivem na terra»
  alternative: «sobre as coisas que existem na terra»
  rationale: A forma τῶν ... ὑπαρχόντων admite formalmente leitura pessoal ou neutra; o contexto imediato de governantes exercendo autoridade favorece a leitura pessoal, sem ampliar o texto para domínio sobre todas as coisas terrenas.
- issue: Cláusula final textualmente problemática
  choice: «alcancem o teu favor»
  alternative: Traduzir literalmente o texto OCR fornecido, θεοῦ σου, como referência a «teu Deus», o que não produz construção coerente neste contexto.
  rationale: A leitura conhecida da passagem é ἵλεώ σου τυγχάνωσιν, expressão que significa obter benevolência ou favor. A forma θεοῦ do testemunho fornecido parece resultar de corrupção ou OCR e é assinalada em nota, não ocultada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom de oração é solene sem arcaísmos excessivos. Empregou-se «tu» para manter a interpelação direta e reverente do singular grego; o imperativo «orienta» deixa inequívoco que se trata de petição, não de afirmação.
