review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a estrutura oracional e reconhece corretamente o imperativo διεύθυνον. Contudo, alguns ajustes tornam mais exatos βουλή, o advérbio εὐσεβῶς e a construção com διέποντες. A cláusula final do texto grego fornecido contém «θεοῦ σου», que é incoerente nessa sintaxe; «teu favor» depende da leitura atestada ἵλεώ σου e deve permanecer explicitamente assinalado.
  naturalness: «Filhos dos seres humanos» é pouco idiomático em português atual, e «com paz, mansidão e piedade» soa menos natural e pode tornar «piedade» ambíguo. A revisão conserva o registro solene, mas emprega formulações mais correntes e claras.
  terminology: «Soberano», «Rei celestial dos séculos» e «autoridade» são adequados. «Dirige os seus planos» comunica βουλή sem sugerir necessariamente um órgão consultivo, e «de modo piedoso» representa εὐσεβῶς com maior precisão do que a simples enumeração «com ... piedade».
  issues:
  - severity: low
    issue: Formulação pouco natural para τοῖς υἱοῖς τῶν ἀνθρώπων
    rationale: «Aos filhos dos seres humanos» é excessivamente pesada em português. Neste semitismo, «aos seres humanos» transmite de modo natural a referência coletiva sem afirmar uma restrição masculina.
  - severity: medium
    issue: Representação de εὐσεβῶς
    rationale: εὐσεβῶς é um advérbio que qualifica o exercício da autoridade. «De modo piedoso» preserva melhor essa função do que «com ... piedade», que também pode ser entendido como compaixão.
  - severity: medium
    issue: Leitura textual na cláusula final
    rationale: O texto-fonte apresentado traz θεοῦ σου, mas essa sequência não produz sentido sintático após τυγχάνωσιν. A tradução «teu favor» corresponde à leitura ἵλεώ σου, conhecida para a passagem; a nota é necessária para não ocultar a divergência.
  revised_text: Pois tu, Soberano, Rei celestial dos séculos, dás aos seres humanos glória, honra e autoridade sobre os que estão na terra. Senhor, dirige os seus planos segundo o que é bom e agradável diante de ti, para que, ao exercerem em paz e mansidão, de modo piedoso, a autoridade que lhes deste, alcancem o teu favor.[a]
  revised_footnotes:
  - marker: a
    text: O texto grego fornecido traz θεοῦ σου, literalmente «teu Deus», leitura que não forma uma expressão coerente aqui. A leitura conhecida desta passagem é ἵλεώ σου, «teu favor» ou «tua benevolência».
    reason: Assinala a provável corrupção ou falha de OCR no texto-fonte e esclarece que «teu favor» traduz a leitura ἵλεώ σου.
  revision_rationale: 'A revisão melhora a fluência sem alterar o sentido: substitui uma expressão antropológica pouco idiomática, explicita o caráter adverbial de εὐσεβῶς e usa «planos» para βουλή. Mantém a tradução da cláusula final baseada na leitura coerente e documenta de forma transparente a discrepância do texto fornecido.'
