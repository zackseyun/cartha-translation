  to: Tu, Soberano, lhes deste a autoridade para governar por meio do teu poder majestoso e indescritível, a fim de que nós, reconhecendo a glória e a honra que lhes foram dadas por ti, nos sujeitemos a eles, sem nos opormos em nada à tua vontade. Concede-lhes, Senhor, saúde, paz, concórdia e estabilidade, para que administrem sem impedimento o governo que lhes deste.[a]
