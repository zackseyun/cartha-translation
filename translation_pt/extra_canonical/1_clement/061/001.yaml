id: 1CLEM.61.1
reference: 1 Clement 61:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: pt
  text: Tu, Soberano, lhes deste a autoridade para governar por meio do teu poder majestoso e indescritível, a fim de que nós, reconhecendo a glória e a honra que lhes foram dadas por ti, nos sujeitemos a eles, sem nos opormos em nada à tua vontade. Concede-lhes, Senhor, saúde, paz, concórdia e estabilidade, para que administrem sem impedimento o governo que lhes deste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que exerçam sem censura a liderança que lhes deste”.'
    reason: O advérbio ἀπροσκόπως pode indicar agir sem impedimento, sem dar ocasião de tropeço ou sem censura; ἡγεμονία pode ser traduzido por “governo”, “liderança” ou “autoridade governante”.
lexical_decisions:
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade suprema com dignidade em português atual, evitando o sentido moderno mais estreito e negativo de “déspota”.
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: a autoridade para governar
  rationale: Comunica naturalmente a autoridade ligada ao governo; “realeza” poderia sugerir apenas monarquia, enquanto o contexto trata dos governantes.
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: poder majestoso e indescritível
  rationale: Preserva tanto a grandeza solene de μεγαλοπρεπής quanto a impossibilidade de exprimir plenamente indicada por ἀνεκδιήγητος.
- source_word: ὁμόνοιαν
  choice: concórdia
  rationale: Mantém a ideia de harmonia e acordo social ou político, em registro digno e compreensível.
- source_word: εὐστάθειαν
  choice: estabilidade
  rationale: Representa a firmeza e a boa ordem solicitadas para o exercício do governo.
- source_word: ἡγεμονίαν
  choice: liderança
  rationale: Termo amplo que conserva a referência à função governante sem restringi-la a uma forma política específica.
- source_word: ἀπροσκόπως
  choice: sem causar tropeço
  rationale: Conserva a imagem ética de πρόσκομμα e a ambiguidade entre exercer o governo sem dar ocasião de tropeço e fazê-lo irrepreensivelmente.
theological_decisions:
- issue: Relação entre submissão aos governantes e vontade divina
  choice: “nos sujeitemos a eles, sem nos opormos em nada à tua vontade”
  alternative: “nos sujeitemos a eles, não contrariando em nada a tua vontade”
  rationale: 'Mantém a sintaxe e a tensão do grego: a submissão é afirmada no âmbito da vontade de Deus, sem acrescentar uma teoria explícita de obediência absoluta nem uma limitação não declarada.'
- issue: Origem da autoridade governamental
  choice: “que lhes foram dadas por ti” e “que lhes deste”
  alternative: Formulação impessoal sobre autoridade política
  rationale: Preserva a afirmação explícita do texto de que glória, honra e liderança foram concedidas por Deus, sem desenvolver implicações confessionais posteriores.
translation_notes:
  register: Português moderno, solene e acessível, com uso coerente de “tu” na oração. A formulação evita arcaísmos desnecessários e preserva a linguagem política ampla do original.
