  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: pt
  text: Fizemos isso para que vocês saibam que toda a nossa preocupação tem sido, e continua sendo, que vocês vivam em paz o quanto antes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίς
  choice: preocupação
  rationale: Expressa cuidado atento e interesse solícito de modo natural no português atual, sem transformar o termo em mero esforço ou ansiedade.
- source_word: εἰρηνεῦσαι
  choice: vivam em paz
  rationale: 'Reproduz o sentido intransitivo e ativo do infinitivo grego: estar ou viver em paz. Evita a formulação passiva «sejam restaurados à paz», que alteraria a voz e acrescentaria uma ideia não expressa diretamente pelo verbo.'
- source_word: ἐν τάχει
  choice: o quanto antes
  rationale: Comunica de maneira idiomática a urgência de «rapidamente» ou «sem demora».
theological_decisions:
- issue: Agência na restauração da paz
  choice: vivam em paz
  alternative: sejam reconduzidos à paz
  rationale: O infinitivo εἰρηνεῦσαι é ativo e intransitivo neste contexto. A tradução mantém essa forma sem atribuir explicitamente a restauração a uma agência externa.
- issue: Continuidade da preocupação dos autores
  choice: tem sido, e continua sendo
  alternative: foi e é
  rationale: Representa καὶ γέγονεν καὶ ἔστιν em português natural, preservando tanto o estado resultante do perfeito quanto sua continuidade no presente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural ὑμᾶς. A ordem foi levemente ajustada para fluência, sem eliminar a ênfase temporal de «tem sido, e continua sendo».
