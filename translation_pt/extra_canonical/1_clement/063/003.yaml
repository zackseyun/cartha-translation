source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: pt
  text: E enviamos homens fiéis e sensatos que, desde a juventude até a velhice, se conduziram de modo irrepreensível entre nós; eles também serão testemunhas entre vocês e nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: fiéis
  rationale: Preserva o sentido de pessoas dignas de confiança e constantes, sem excluir a conotação religiosa possível.
- source_word: σώφρονας
  choice: sensatos
  rationale: Expressa prudência, bom senso e domínio próprio em português corrente e digno.
- source_word: ἀναστραφέντας
  choice: têm vivido
  rationale: O verbo se refere à conduta ou maneira de viver; esta formulação é natural e mantém o foco na vida demonstrada ao longo do tempo.
- source_word: ἀμέμπτως
  choice: de modo irrepreensível
  rationale: Reproduz o juízo de conduta sem censura ou motivo legítimo de acusação.
- source_word: μάρτυρες
  choice: testemunhas
  rationale: Mantém o sentido jurídico e relacional de pessoas que podem atestar o que ocorrer entre as duas comunidades.
theological_decisions:
- issue: Possível valor religioso ou apenas pessoal de πιστούς
  choice: fiéis
  alternative: dignos de confiança
  rationale: “Fiéis” preserva a amplitude do grego, que pode indicar confiabilidade pessoal e fidelidade religiosa, sem resolver indevidamente a ambiguidade.
- issue: Relação expressa por μεταξὺ ὑμῶν καὶ ἡμῶν
  choice: entre vocês e nós
  alternative: perante vocês e nós
  rationale: A tradução formal preserva a função mediadora ou bilateral das testemunhas sem especificar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva o contraste temporal “desde a juventude até a velhice” e a relação entre as duas comunidades.
