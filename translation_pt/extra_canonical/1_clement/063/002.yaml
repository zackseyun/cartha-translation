source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: pt
  text: Pois vocês nos darão alegria e exultação se, obedecendo ao que escrevemos por meio do Espírito Santo, eliminarem a ira ilegítima causada pelo ciúme de vocês, conforme o apelo que fizemos nesta carta a respeito da paz e da concórdia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλίασιν
  choice: grande júbilo
  rationale: Expressa a alegria intensa indicada pelo termo grego e mantém a dupla 'alegria e júbilo' em português natural.
- source_word: ἐκκόψητε
  choice: eliminarem
  rationale: Conserva a força da imagem de cortar e remover completamente, sem produzir em português uma formulação excessivamente literal.
- source_word: ἄθεμον
  choice: injusta
  rationale: Traduz a ideia de algo contrário ao que é legítimo ou devido; 'injusta' é clara e digna no contexto moral.
- source_word: ζήλους
  choice: ciúme
  rationale: Mantém o sentido de zelo hostil ou ciúme no contexto da discórdia; a relação sintática com 'ira' é expressa por 'causada pelo'.
- source_word: ἔντευξιν
  choice: apelo
  rationale: No contexto epistolar, refere-se à súplica ou exortação feita pelos autores; 'apelo' é natural e preciso.
- source_word: ὁμονοίας
  choice: concórdia
  rationale: Preserva a noção de acordo de mente e propósito e forma um par idiomático com 'paz'.
theological_decisions:
- issue: A autoria mediada pelo Espírito Santo
  choice: ao que escrevemos por meio do Espírito Santo
  alternative: ao que lhes escrevemos sob a inspiração do Espírito Santo
  rationale: A formulação mantém a afirmação direta do grego διὰ τοῦ ἁγίου πνεύματος sem acrescentar uma teoria técnica de inspiração nem enfraquecer a mediação atribuída ao Espírito.
- issue: Relação entre ira e ciúme
  choice: a ira injusta causada pelo ciúme de vocês
  alternative: a ira injusta do ciúme de vocês
  rationale: O genitivo grego pode ser entendido como origem ou caracterização. A tradução explicita a leitura causal mais natural em português, sem introduzir conteúdo denominacional.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'vocês' para ampla legibilidade brasileira. A sintaxe foi suavemente reorganizada para fluência, preservando a condição, a exortação moral e a referência ao Espírito Santo.
