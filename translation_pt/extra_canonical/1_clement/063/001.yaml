  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Θεμιτὸν οὖν ἐστὶν τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας ὑποθεῖναι τὸν τράχηλον καὶ τὸν τῆς ὑπακατὰ τὸν προκείμενον ἡμῖν ἐν ἀληθείᾳ σκοπὸν δίχα παντὸς μώμου καταντήσωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: pt
  text: Portanto, é justo que, tendo-nos aproximado de tais e tantos exemplos, dobremos a cerviz e, cumprindo o que cabe à obediência[a], nos aquietemos, para que, pondo fim à vã sedição, alcancemos, sem qualquer censura, o alvo que em verdade está posto diante de nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “preenchendo o lugar da obediência”.
    reason: Registra a imagem incomum do grego, vertida de modo mais natural no texto principal.
lexical_decisions:
- source_word: Θεμιτόν
  choice: é justo
  rationale: Expressa aquilo que é correto e apropriado, com dignidade natural em português.
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: dobremos a cerviz
  rationale: Preserva a imagem concreta de submissão voluntária; “cerviz” mantém o tom solene sem perder inteligibilidade.
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: cumprindo o que cabe à obediência
  rationale: Traduz o sentido de preencher ou cumprir o lugar/função da obediência, evitando a formulação pouco natural “preencher o lugar”.
- source_word: ἡσυχάσαι
  choice: nos aquietemos
  rationale: Mantém tanto a ideia de ficar em paz quanto a de cessar a agitação facciosa.
- source_word: τῆς ματαίας στάσεως
  choice: à vã rebelião
  rationale: No contexto de 1 Clemente, στάσις designa a revolta ou sedição que dividiu a comunidade, e não mera discordância.
- source_word: σκοπόν
  choice: alvo
  rationale: Conserva a metáfora de um objetivo para o qual se avança.
- source_word: δίχα παντὸς μώμου
  choice: sem qualquer censura
  rationale: Μῶμος indica censura, reprovação ou falta atribuível; “censura” preserva essa dimensão moral sem transformar o termo em “pecado”.
theological_decisions:
- issue: Relação entre obediência, quietude e cessação da rebelião
  choice: 'Manter as três ideias como uma sequência: cumprir a obediência, aquietar-se e pôr fim à rebelião.'
  alternative: Condensar tudo em uma exortação geral à submissão.
  rationale: A redação crítica preserva etapas retoricamente distintas, importantes para o apelo de Clemente à restauração da paz comunitária.
- issue: Objeto da obediência
  choice: Não explicitar a quem a obediência é devida.
  alternative: Acrescentar “a Deus” ou “aos presbíteros”.
  rationale: O grego não fornece aqui um complemento explícito; acrescentá-lo resolveria indevidamente uma abertura do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve solenidade adequada à exortação. A tradução segue a forma crítica restaurada da passagem, pois o texto grego fornecido apresenta uma lacuna evidente de OCR após ὑπα-, omitindo a cláusula sobre aquietar-se e cessar a rebelião.
