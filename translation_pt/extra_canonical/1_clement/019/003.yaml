base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: pt
  text: Contemplemos Deus com a mente e, com os olhos da alma, fixemos o olhar em seu desígnio paciente. Compreendamos como ele é isento de ira para com toda a sua criação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν αὐτὸν κατὰ διάνοιαν
  choice: Contemplemos Deus em nossa mente
  rationale: Expressa a contemplação interior indicada por διάνοια e explicita em português o referente masculino, Deus, identificado no contexto imediato como Pai e Criador.
- source_word: ἐμβλέψωμεν τοῖς ὄμμασιν τῆς ψυχῆς
  choice: com os olhos da alma, fixemos o olhar
  rationale: Conserva a imagem antropológica do grego e a força de atenção concentrada do verbo ἐμβλέπω.
- source_word: τὸ μακρόθυμον αὐτοῦ βούλημα
  choice: seu propósito paciente
  rationale: Mantém βούλημα como intenção ou propósito e traduz μακρόθυμον pela paciência prolongada, sem reduzir a expressão apenas a tolerância.
- source_word: ἀόργητος
  choice: não se ira
  rationale: Formulação natural que preserva o sentido de estar livre de ira ou não inclinado à ira.
- source_word: πρὸς πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: contra nenhuma de suas criaturas
  rationale: A construção negativa em português comunica naturalmente que a ausência de ira se estende a toda a criação; 'criaturas' evita a possível leitura abstrata de criação como ato.
theological_decisions:
- issue: Referente de αὐτόν e αὐτοῦ
  choice: Deus
  alternative: ele
  rationale: O antecedente contextual é 'o Pai e Criador de todo o universo' em 19:2; a explicitação evita ambiguidade pouco natural na abertura isolada do versículo sem acrescentar uma identificação teológica externa.
- issue: Alcance de ἀόργητος em relação à criação
  choice: não se ira contra nenhuma de suas criaturas
  alternative: está livre de ira para com toda a sua criação
  rationale: Preserva a afirmação abrangente e sua tensão teológica, sem qualificá-la ou harmonizá-la com outras concepções de juízo divino.
translation_notes:
  register: Português moderno, claro e digno, com cadência exortativa marcada pelos três subjuntivos hortativos. A metáfora 'olhos da alma' foi mantida por ser inteligível e central à retórica do original.
