base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: pt
  text: Assim, tendo participado de muitos feitos grandes e gloriosos, avancemos em direção à meta da paz que nos foi transmitida desde o princípio. Fixemos o olhar no Pai e Criador do universo e apeguemo-nos às suas dádivas majestosas e extraordinárias e aos benefícios da paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχόντες
  choice: tendo participado
  rationale: Traduz diretamente o particípio de μετέχω, “participar, tomar parte”. O texto grego fornecido não contém ἠξιώθημεν (“fomos considerados dignos”), leitura pressuposta pela revisão inglesa.
- source_word: πράξεων
  choice: obras
  rationale: Aqui designa feitos ou ações; “obras” é natural e dignificado, sem atribuir necessariamente todas essas realizações aos leitores.
- source_word: ἐκτελέσωμεν ἐπὶ ... σκοπόν
  choice: prossigamos rumo à meta
  rationale: Expressa movimento resoluto em direção a um alvo; evita o sentido moderno mais estreito de “executar”.
- source_word: παραδεδομένον
  choice: transmitida
  rationale: Conserva a ideia de algo recebido por tradição e entregue às gerações seguintes.
- source_word: τοῦ σύμπαντος κόσμου
  choice: do universo
  rationale: Equivalente português natural para “do mundo inteiro”, abrangendo a totalidade da criação.
- source_word: κολληθῶμεν
  choice: apeguemo-nos
  rationale: Mantém a imagem forte de aderir ou ligar-se estreitamente a algo.
- source_word: μεγαλοπρεπέσι καὶ ὑπερβαλλούσαις
  choice: majestosas e extraordinárias
  rationale: Reproduz o caráter grandioso e superlativo dos adjetivos em português corrente e elevado.
- source_word: δωρεαῖς ... εὐεργεσίαις
  choice: dádivas ... benefícios
  rationale: 'Preserva os dois substantivos distintos: presentes concedidos e atos ou efeitos benéficos.'
theological_decisions:
- issue: Agência nas “muitas, grandes e gloriosas obras”
  choice: “tendo participado de ... obras”
  alternative: “tendo sido considerados dignos de ... coisas”
  rationale: A tradução segue a evidência grega apresentada, μετασχόντες πράξεων, e não a formulação da camada inglesa, baseada em uma leitura diferente. “Participado” também preserva a possibilidade de tomar parte nessas obras sem afirmar que os leitores sejam seus únicos agentes.
- issue: Relação da paz com “dádivas” e “benefícios”
  choice: “dádivas ... e ... benefícios da paz”
  alternative: “dádivas e benefícios ... da paz”
  rationale: A ordem grega permite alguma tensão sintática. A redação adotada associa explicitamente “da paz” aos benefícios, sem excluir semanticamente sua relação com as dádivas.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e vocabulário amplamente internacional. A pontuação divide o longo período grego em duas frases para facilitar a leitura sem alterar sua progressão exortativa.
