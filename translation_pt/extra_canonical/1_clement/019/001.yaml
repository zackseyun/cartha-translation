revisions:
- from: Portanto, a humildade e a submissão de tantas e tão notáveis pessoas, tão bem atestadas, por meio da obediência tornaram melhores não somente a nós, mas também as gerações anteriores a nós — aqueles que acolheram os oráculos dele em santidade e verdade.
  to: Portanto, a humildade e a submissão de tantas e tão grandes pessoas, tão bem atestadas, por meio da obediência tornaram melhores não somente a nós, mas também as gerações que nos precederam — isto é, os que acolheram os oráculos dele em santidade e verdade.
  rationale: A revisão corrige a relação da aposição final com «gerações», preservando o masculino pessoal de τούς, e ajusta «notáveis» para «grandes», formulação mais próxima do elogio amplo de τοιούτων. Não altera a ambiguidade do pronome «dele» nem a construção que apresenta a obediência como meio.
