id: 1CLEM.19.1
reference: 1 Clement 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: pt
  text: Portanto, a humildade e a submissão de tantas e tão grandes pessoas, tão bem atestadas, por meio da obediência tornaram melhores não somente a nós, mas também as gerações que nos precederam — isto é, os que acolheram os oráculos dele em santidade e verdade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων
  choice: humildade
  rationale: O contexto e a construção apontam para a qualidade demonstrada pelas pessoas mencionadas; “humildade” exprime naturalmente a ideia de disposição humilde.
- source_word: τὸ ὑποδεές
  choice: submissão
  rationale: Designa uma postura de sujeição ou deferência; “submissão” preserva a ligação imediata com a obediência sem acrescentar conotação denominacional.
- source_word: μεμαρτυρημένων
  choice: atestadas
  rationale: Mantém o sentido de pessoas cujo caráter recebeu testemunho ou comprovação.
- source_word: καταδεξαμένους
  choice: acolheram
  rationale: Expressa uma recepção deliberada e favorável, mais forte que o simples ato de ouvir.
- source_word: τὰ λόγια αὐτοῦ
  choice: os oráculos dele
  rationale: “Oráculos” conserva o caráter de pronunciamentos divinos de λόγια, enquanto “dele” preserva a referência pronominal sem explicitar além do grego.
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: em santidade e verdade
  rationale: Tradução formal e inteligível que mantém as duas qualidades coordenadas sem interpretar sua relação de modo mais específico.
theological_decisions:
- issue: Referente de αὐτοῦ em “τὰ λόγια αὐτοῦ”
  choice: dele
  alternative: de Deus
  rationale: Embora o contexto provavelmente aponte para Deus, o pronome grego não nomeia explicitamente o referente; a tradução preserva essa forma pronominal.
- issue: Agência da obediência na transformação moral
  choice: “por meio da obediência tornaram melhores”
  alternative: “cuja obediência tornou melhores”
  rationale: A formulação mantém a obediência como meio, conforme διὰ τῆς ὑπακοῆς, e evita transformar indevidamente a obediência no único sujeito gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura longa do grego foi preservada, mas organizada com travessão para tornar clara a aposição final. “Notáveis” comunica τοιούτων no contexto elogioso sem importar uma categoria técnica.
