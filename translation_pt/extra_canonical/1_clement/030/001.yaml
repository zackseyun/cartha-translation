  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: pt
  text: Portanto, visto que somos uma porção santa, pratiquemos tudo o que pertence à santificação, fugindo de difamações, de uniões sórdidas e impuras, de bebedeiras e sedições, de desejos detestáveis, de adultério repugnante, de orgulho detestável.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅγια ... μερίς
  choice: uma porção santa
  rationale: Preserva a metáfora do grupo como porção consagrada, sem a substituir por uma interpretação mais específica como «povo santo».
- source_word: τὰ τοῦ ἁγιασμοῦ πάντα
  choice: tudo o que pertence à santificação
  rationale: Mantém o sentido abrangente e o substantivo teológico ἁγιασμός em português claro.
- source_word: καταλαλιάς
  choice: difamações
  rationale: O plural grego designa falas prejudiciais contra outras pessoas; «difamações» conserva tanto o sentido quanto o número.
- source_word: μιαράς τε καὶ ἀνάγνους συμπλοκάς
  choice: uniões vergonhosas e impuras
  rationale: συμπλοκή pode indicar envolvimentos ou uniões, provavelmente de caráter sexual neste contexto; «uniões» é natural sem explicitar além do texto, e os dois qualificativos são preservados.
- source_word: μέθας τε καὶ νεωτεροποιΐας
  choice: bebedeiras e sedições
  rationale: μέθαι refere-se a episódios ou práticas de embriaguez; νεωτεροποιΐαι, neste contexto moral e comunitário, indica ações subversivas ou sediciosas.
- source_word: βδελυκτάς ... βδελυκτήν
  choice: detestáveis ... detestável
  rationale: Repete deliberadamente a mesma raiz portuguesa para reproduzir a repetição retórica do adjetivo grego.
- source_word: μυσεράν
  choice: repugnante
  rationale: Expressa a forte aversão moral do termo sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Sentido de «porção santa»
  choice: Conservar a metáfora literalmente inteligível
  alternative: Interpretar como «povo santo» ou «parte santa de Deus»
  rationale: O texto não explicita de quem ou de que os leitores são uma porção; a tradução preserva essa abertura.
- issue: Relação entre santidade e conduta
  choice: «pratiquemos tudo o que pertence à santificação»
  alternative: «façamos todas as obras da santidade»
  rationale: A formulação mantém a exortação à conduta coerente com a condição de porção santa, sem definir de modo denominacional o processo de santificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva as conjunções internas do grego e a sequência assindética dos itens finais; a repetição de «detestável» é intencional.
