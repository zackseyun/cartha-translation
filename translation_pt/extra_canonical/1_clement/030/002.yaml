  text: θεὸς γάρ, φησίν, ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: pt
  text: 'Pois diz[a]: “Deus se opõe aos orgulhosos, mas concede graça aos humildes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois Deus, diz ele, se opõe aos orgulhosos, mas concede graça aos humildes.”'
    reason: Registra a possibilidade de entender φησίν como parentético pessoal («diz ele»). No contexto, porém, ele funciona naturalmente como fórmula impessoal que introduz uma citação.
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: aos orgulhosos
  rationale: Equivalente natural e direto para os que são soberbos ou arrogantes, preservando o contraste ético com os humildes.
- source_word: ἀντιτάσσεται
  choice: se opõe
  rationale: Expressa a ideia de colocar-se contra ou resistir, com clareza e dignidade em português atual.
- source_word: ταπεινοῖς
  choice: aos humildes
  rationale: Mantém o contraste lexical e moral com “orgulhosos” sem acrescentar interpretação.
- source_word: δίδωσιν χάριν
  choice: concede graça
  rationale: Preserva o termo teologicamente significativo χάρις e usa um verbo natural para a ação divina.
theological_decisions:
- issue: Função de φησίν como fórmula de citação
  choice: está escrito
  alternative: diz / ele diz
  rationale: No contexto, φησίν introduz impessoalmente uma citação das Escrituras. “Está escrito” torna essa função clara e idiomática, sem sugerir que Deus seja o sujeito de um comentário parentético.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. As aspas identificam a citação de Provérbios 3:34.
