  text: εὐλογημένος γεννητὸς γυναικὸς ὀλιγόβιος. μὴ πολὺς ἐν ῥήμασιν γίνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/005.yaml
  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
translation:
  language: pt
  text: Bendito é o nascido de mulher, de vida breve. Não sejas de muitas palavras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: Bendito
  rationale: Reproduz diretamente o particípio com valor adjetival, sem atenuar a afirmação incomum do texto grego.
- source_word: γεννητὸς γυναικός
  choice: o nascido de mulher
  rationale: Mantém a expressão semítica preservada no grego e soa digna e compreensível em português.
- source_word: ὀλιγόβιος
  choice: de vida breve
  rationale: Expressa com naturalidade a ideia de alguém que vive pouco, evitando a forma menos idiomática «breve de vida».
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  choice: Não sejas de muitas palavras
  rationale: Conserva a imagem do original e comunica a exortação a não ser excessivamente verboso; aqui γίνου admite naturalmente o valor de «sejas».
theological_decisions:
- issue: A aparente tensão entre «bendito» e «de vida breve»
  choice: Preservar as duas afirmações lado a lado
  alternative: Reformular a primeira palavra ou ligar a brevidade da vida à frase seguinte
  rationale: O texto fornecido lê εὐλογημένος, e a tradução não deve corrigir nem resolver silenciosamente sua formulação incomum.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leve cadência proverbial. Emprega-se «sejas» por adequação ao tom exortativo do texto antigo, sem vocabulário arcaizante adicional.
