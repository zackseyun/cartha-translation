source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἔπαινος ἡμῶν ἔστω ἐν θεῷ καὶ μὴ ἐξ αὐτῶν· αὐτεπανέτους γὰρ μισεῖ ὁ θεός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: pt
  text: Que o nosso louvor esteja em Deus, e não venha de nós mesmos, pois Deus odeia os que louvam a si mesmos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: o nosso louvor
  rationale: Mantém o sentido direto de ἔπαινος como louvor ou elogio, preservando a formulação do grego.
- source_word: ἐν θεῷ
  choice: em Deus
  rationale: 'Conserva a expressão preposicional e sua possível amplitude: Deus é o âmbito, fundamento ou objeto do louvor.'
- source_word: μὴ ἐξ αὐτῶν
  choice: não venha de nós mesmos
  rationale: Explicita de modo natural em português a ideia de origem expressa por ἐξ, sem confundi-la com a expressão anterior ἐν θεῷ.
- source_word: αὐτεπανέτους
  choice: os que louvam a si mesmos
  rationale: Traduz de maneira clara o adjetivo substantivado que designa pessoas que fazem o próprio elogio.
- source_word: μισεῖ
  choice: odeia
  rationale: Reproduz a força normal do verbo μισέω sem atenuação interpretativa.
theological_decisions:
- issue: Relação entre o louvor e Deus
  choice: Que o nosso louvor esteja em Deus
  alternative: Que o nosso motivo de glória esteja em Deus
  rationale: A tradução mantém ἔπαινος como “louvor” e preserva a concisão e a abertura semântica da frase, sem substituir o termo por uma interpretação teológica mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A repetição de “louvor/louvam” reflete deliberadamente a ligação lexical do grego entre ἔπαινος e αὐτεπανέτους.
