source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: pt
  text: Que o testemunho de nossa boa conduta[a] seja dado por outros, assim como foi dado a nossos justos antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “boa ação”.'
    reason: O singular πράξεως pode referir-se tanto à conduta em geral quanto a uma ação específica.
lexical_decisions:
- source_word: ἀγαθῆς πράξεως
  choice: boa conduta
  rationale: Embora a expressão possa designar uma “boa ação”, o singular πράξεως neste contexto pode indicar a maneira de agir ou o comportamento ético como um todo; “boa conduta” comunica esse sentido com naturalidade em português.
- source_word: τοῖς πατράσιν ἡμῶν τοῖς δικαίοις
  choice: nossos justos antepassados
  rationale: πατέρες pode referir-se aos pais ancestrais. “Antepassados” evita que o leitor moderno entenda apenas os pais imediatos, e “justos” preserva o qualificativo δικαίοις.
theological_decisions:
- issue: O testemunho sobre a própria conduta deve vir de terceiros
  choice: seja dado por outros
  alternative: venha de outros
  rationale: A forma passiva preserva de perto διδόσθω ὑπ’ ἄλλων e mantém a ênfase ética do texto sem acrescentar uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem soar artificial. “Antepassados” esclarece o referente histórico de “pais” para leitores atuais.
