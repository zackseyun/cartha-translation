  text: λέγει γάρ· Ὁ ἰὰ πολλὰ λέγων καὶ ἀντακουσεται· ἢ ὁ εὐλάλος οἴεται εἶναι δίκαιος;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
translation:
  language: pt
  text: 'Pois ele diz: “Quem fala muitas coisas também ouvirá em resposta; ou será que o homem eloquente se considera justo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ
  choice: Pois ele diz
  rationale: Mantém a ligação explicativa de γάρ e introduz naturalmente a citação em português.
- source_word: ὁ ... πολλὰ λέγων
  choice: quem fala muitas coisas
  rationale: Reproduz de modo claro e corrente a ideia de falar muito, sem restringi-la indevidamente a mera loquacidade.
- source_word: ἀντακούσεται
  choice: ouvirá em resposta
  rationale: Conserva o sentido de receber uma resposta ou réplica, bem como a forma futura do grego.
- source_word: ὁ εὐλάλος
  choice: o homem eloquente
  rationale: Expressa a pessoa hábil ou fluente no falar; o substantivo masculino é explicitado de maneira natural.
- source_word: οἴεται εἶναι δίκαιος
  choice: se considera justo
  rationale: Formulação idiomática que preserva o sentido de julgar ou imaginar que se é justo.
theological_decisions:
- issue: Extensão da citação introduzida por λέγει γάρ
  choice: Toda a frase, inclusive a pergunta final, permanece dentro das aspas.
  alternative: Encerrar a citação antes de “ou será que...”, atribuindo a pergunta a Clemente.
  rationale: A sequência grega apresenta as duas orações como conteúdo contínuo da mesma citação, sem indicação gramatical de mudança de voz.
- issue: Sentido de δίκαιος
  choice: justo
  alternative: correto ou inocente
  rationale: “Justo” preserva o peso ético e potencialmente teológico do termo sem resolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção interrogativa “ou será que” comunica com naturalidade a força retórica de ἢ ... οἴεται, sem acrescentar uma conclusão interpretativa.
