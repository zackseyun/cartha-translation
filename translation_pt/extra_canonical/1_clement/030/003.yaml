revisions:
- from: Portanto, apeguemo-nos àqueles a quem foi dada a graça da parte de Deus. Revistamo-nos de concórdia, com humildade e domínio próprio, mantendo-nos longe de toda murmuração e difamação, sendo justificados por obras, e não por palavras.
  to: Portanto, apeguemo-nos àqueles a quem a graça foi dada da parte de Deus. Revistamo-nos de concórdia, sendo humildes e exercendo domínio próprio, mantendo-nos longe de todo falar mal em segredo e de toda difamação, sendo justificados por obras, e não por palavras.
  rationale: A revisão conserva o sentido passivo de «foi dada» e «sendo justificados», a procedência da graça «da parte de Deus» e a oposição entre obras e palavras. Substitui «murmuração» por uma expressão que comunica o caráter encoberto e malicioso de ψιθυρισμός, sem identificar indevidamente o termo com mera reclamação, e explicita as duas disposições expressas por particípios.
