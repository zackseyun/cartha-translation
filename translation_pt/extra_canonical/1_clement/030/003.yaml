source:
  edition: Funk 1901 (normalized OCR)
  text: κολληθῶμεν οὖν ἐκείνοις, οἷς ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται· ἐνδυσώμεθα τὴν ὁμόνοιαν ταπεινοφρονοῦντες, ἐγκρατευόμενοι, ἀπὸ παντὸς ψιθυρισμοῦ καὶ καταλαλιᾶς πόρρω ἑαυτοὺς ποιοῦντες, ἔργοις δικαιούμενοι καὶ μὴ λόγοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: pt
  text: Portanto, apeguemo-nos àqueles a quem a graça foi dada da parte de Deus. Revistamo-nos de concórdia, sendo humildes e exercendo domínio próprio, mantendo-nos longe de todo falar mal em segredo e de toda difamação, sendo justificados por obras, e não por palavras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: apeguemo-nos
  rationale: Expressa adesão firme e pessoal, preservando a força exortativa do aoristo subjuntivo.
- source_word: ὁμόνοιαν
  choice: concórdia
  rationale: Termo digno e corrente que comunica harmonia e unidade de disposição.
- source_word: ταπεινοφρονοῦντες
  choice: com humildade
  rationale: Traduz naturalmente a atitude de pensar e agir com humildade, sem formulação artificial.
- source_word: ἐγκρατευόμενοι
  choice: domínio próprio
  rationale: Abrange autocontrole e moderação, sentido central do particípio grego.
- source_word: ψιθυρισμοῦ
  choice: murmuração
  rationale: No contexto ético, indica fala murmurada, queixosa ou maliciosa; 'murmuração' é mais natural do que 'sussurro' em português.
- source_word: καταλαλιᾶς
  choice: difamação
  rationale: Comunica fala prejudicial contra outra pessoa, distinguindo-a da murmuração.
- source_word: δικαιούμενοι
  choice: sendo justificados
  rationale: Mantém a formulação passiva e a tensão teológica do grego, sem reinterpretá-la como simples demonstração de justiça.
theological_decisions:
- issue: Relação entre obras, palavras e justificação
  choice: sendo justificados por obras, e não por palavras
  alternative: mostrando-nos justos por obras, e não por palavras
  rationale: A tradução formal preserva o passivo δικαιούμενοι e a possível tensão teológica, em vez de resolver o sentido como mera comprovação moral.
- issue: Origem da graça
  choice: a graça da parte de Deus
  alternative: a graça de Deus
  rationale: A expressão explicita a proveniência indicada por ἀπὸ τοῦ θεοῦ, sem impor uma nuance possessiva exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura exortativa coletiva foi preservada, assim como a sequência de virtudes e afastamentos éticos.
