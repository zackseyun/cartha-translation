  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: pt
  text: A insolência[a], a arrogância e a temeridade são próprias dos amaldiçoados por Deus; a brandura, a humildade e a mansidão encontram-se entre os abençoados por Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “audácia”.'
    reason: θράσος pode ser vertido por “audácia”, mas, neste contexto, tem sentido claramente negativo; a nota preserva a alternativa lexical sem sugerir uma virtude.
lexical_decisions:
- source_word: θράσος
  choice: insolência
  rationale: No contexto desta lista de vícios, indica audácia desmedida ou presunçosa, não coragem digna de elogio.
- source_word: αὐθάδεια
  choice: arrogância
  rationale: Expressa uma atitude presunçosa e obstinadamente centrada na própria vontade; “arrogância” comunica bem o caráter vicioso no português corrente.
- source_word: τόλμα
  choice: temeridade
  rationale: Aqui denota ousadia imprudente ou atrevida, sentido negativo adequadamente expresso por “temeridade”.
- source_word: ἐπιείκεια
  choice: brandura
  rationale: Neste contraste ético, refere-se a uma disposição gentil, moderada e indulgente; “brandura” mantém a distinção possível em relação à mansidão.
- source_word: ταπεινοφροσύνη
  choice: humildade
  rationale: Equivalente natural e direto para a atitude de mente humilde.
- source_word: πραΰτης
  choice: mansidão
  rationale: Termo português tradicional e ainda compreensível para suavidade de caráter e ausência de agressividade.
theological_decisions:
- issue: Agente da maldição e da bênção
  choice: “amaldiçoados por Deus” e “abençoados por Deus”
  alternative: “aqueles que Deus amaldiçoou” e “aqueles que Deus abençoou”
  rationale: Preserva as construções passivas gregas e mantém Deus explicitamente como agente, sem acrescentar explicação sobre a natureza ou o alcance da maldição e da bênção.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo entre as duas metades. A expressão “são próprias de” supre naturalmente a elipse verbal do grego e comunica a associação indicada pelos dativos e por παρά.
