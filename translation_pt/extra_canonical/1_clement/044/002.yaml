source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: pt
  text: Por essa razão, então,[a] tendo recebido plena presciência, eles designaram os homens já mencionados e, posteriormente, estabeleceram uma providência adicional, para que, caso adormecessem, outros homens aprovados os sucedessem no ministério deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Portanto, por essa razão”.'
    reason: O grego combina a expressão causal διὰ ταύτην τὴν αἰτίαν com a partícula conclusiva οὖν; a alternativa reproduz mais formalmente ambos os elementos, embora soe repetitiva em português.
lexical_decisions:
- source_word: πρόγνωσιν ... τελείαν
  choice: pleno conhecimento antecipado
  rationale: Expressa literalmente a ideia de conhecimento prévio completo, em linguagem atual, sem acrescentar uma explicação teológica sobre sua origem ou seu conteúdo.
- source_word: κατέστησαν
  choice: designaram
  rationale: No contexto de pessoas colocadas numa função, “designaram” comunica com naturalidade o ato de constituir ou nomear.
- source_word: μεταξὺ ἐπινομὴν δεδώκασιν
  choice: depois, estabeleceram uma disposição adicional
  rationale: Preserva a sequência temporal e o sentido de uma providência ou determinação suplementar, evitando transformar a frase em uma estrutura eclesiástica mais específica do que o grego afirma.
- source_word: κοιμηθῶσιν
  choice: adormecessem
  rationale: Mantém a metáfora antiga e cristã do sono para a morte, sem substituí-la diretamente por “morressem”.
- source_word: δεδοκιμασμένοι ἄνδρες
  choice: homens aprovados
  rationale: Reflete o sentido de pessoas que foram provadas e consideradas aptas.
- source_word: λειτουργίαν
  choice: ministério
  rationale: Neste contexto, refere-se ao serviço ou encargo exercido pelos designados; “ministério” é claro e preserva a dimensão de serviço oficial sem especificar um cargo denominacional.
theological_decisions:
- issue: Natureza da sucessão no ministério
  choice: “outros homens aprovados os sucederiam em seu ministério”
  alternative: “outros homens aprovados assumiriam seu cargo”
  rationale: A formulação escolhida mantém a ideia explícita de sucessão e de serviço ministerial, mas não define a forma institucional, sacramental ou denominacional dessa sucessão.
- issue: Sentido metafórico de κοιμηθῶσιν
  choice: “adormecessem”
  alternative: “morressem”
  rationale: O grego emprega deliberadamente a metáfora do sono; preservá-la conserva sua ressonância teológica sem explicá-la ou resolvê-la no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo o particípio e a sequência lógica do grego. A metáfora “adormecessem” e a relativa generalidade de “ministério” foram preservadas.
