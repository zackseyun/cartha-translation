  naturalness: «Pleno conhecimento antecipado» é compreensível, mas algo pesado em português. «Plena presciência» é conciso, corrente em registro religioso e corresponde diretamente a πρόγνωσις, sem definir doutrinariamente sua natureza. A construção final com «para que, caso...» deixa mais clara a sintaxe do período grego.
