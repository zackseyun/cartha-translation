  to: Por essa razão, então,[a] tendo recebido plena presciência, eles designaram os homens já mencionados e, posteriormente, estabeleceram uma providência adicional, para que, caso adormecessem, outros homens aprovados os sucedessem no ministério deles.
  rationale: A revisão conserva o sentido e o registro do rascunho, mas melhora a correspondência sintática com ὅπως («para que») e a fluência de πρόγνωσις («plena presciência»). «Providência adicional» mantém a generalidade de μεταξὺ ἐπινομὴν, sem impor uma estrutura eclesiástica específica. A sucessão permanece vinculada ao ministério dos nomeados.
