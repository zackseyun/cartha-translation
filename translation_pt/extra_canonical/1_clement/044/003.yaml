  to: Portanto, aqueles que foram designados por eles ou, posteriormente, por outros homens de boa reputação, com a aprovação de toda a igreja, e que serviram irrepreensivelmente ao rebanho de Cristo, com humildade, tranquilamente e sem pretensão, e que, por muitos anos, receberam o bom testemunho de todos — não consideramos justo que sejam afastados do ministério.[a]
  rationale: A revisão preserva a progressão retórica e o juízo final do grego, mas torna explícita a referência a muitos anos e expressa de forma mais adequada o testemunho já recebido por essas pessoas. A nota mantém a alternativa sintática registrada no histórico de auditoria.
