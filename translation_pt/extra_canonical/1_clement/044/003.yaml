id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: pt
  text: Portanto, aqueles que foram designados por eles ou, posteriormente, por outros homens de boa reputação, com a aprovação de toda a igreja, e que serviram irrepreensivelmente ao rebanho de Cristo, com humildade, tranquilamente e sem pretensão, e que, por muitos anos, receberam o bom testemunho de todos — não consideramos justo que sejam afastados do ministério.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consideramos que estes são injustamente afastados do ministério”.'
    reason: A construção grega antecipa o objeto e o retoma por “estes”; assim, “não justamente” pode ser formulado em português como qualificação direta do afastamento, sem alteração de sentido.
lexical_decisions:
- source_word: κατασταθέντας
  choice: designados
  rationale: Expressa a nomeação ou instituição para uma função sem especificar um rito ou cargo além do que o contexto afirma.
- source_word: μεταξὺ
  choice: posteriormente
  rationale: No contexto, indica o período subsequente à atuação dos primeiros nomeadores; esta é uma formulação natural em português.
- source_word: ἐλλογίμων ἀνδρῶν
  choice: homens de boa reputação
  rationale: Traduz a ideia de pessoas estimadas e respeitáveis, evitando o sentido moderno mais estreito de 'notáveis'.
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: com a aprovação de toda a igreja
  rationale: Comunica o consentimento favorável e conjunto da comunidade inteira.
- source_word: λειτουργήσαντας
  choice: serviram
  rationale: Aqui o verbo descreve o serviço prestado ao rebanho; 'serviram' é claro e não impõe uma noção litúrgica posterior.
- source_word: ἀβαναύσως
  choice: sem pretensão
  rationale: O termo raro contrasta com conduta vulgar, interesseira ou arrogante; 'sem pretensão' preserva o elogio à maneira digna e desinteressada de servir.
- source_word: λειτουργίας
  choice: ministério
  rationale: No fecho, refere-se ao serviço ou função eclesial da qual essas pessoas poderiam ser removidas; 'ministério' mantém essa amplitude funcional.
theological_decisions:
- issue: Referência ao ποιμνίῳ τοῦ Χριστοῦ
  choice: rebanho de Cristo
  alternative: rebanho do Messias
  rationale: Χριστοῦ funciona aqui como a designação consagrada de Jesus; 'Cristo' é a correspondência portuguesa direta e não altera a cristologia do texto.
- issue: Alcance de οὐ δικαίως na oração final
  choice: não consideramos justo que sejam afastados
  alternative: consideramos que são afastados injustamente
  rationale: A ordem grega admite diferença de foco entre a avaliação de justiça e o modo do afastamento, sem diferença substancial na conclusão. A tradução principal reproduz naturalmente a avaliação dos autores, e a nota registra a alternativa sintática.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A longa construção participial e sua retomada conclusiva foram preservadas por meio do travessão, refletindo a progressão retórica do grego sem produzir uma frase artificial.
