source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: pt
  text: Pois vemos que vocês afastaram alguns que se conduziam bem do ministério que eles haviam honrado de modo irrepreensível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “do ministério que havia sido irrepreensivelmente honrado por eles”.'
    reason: Registra a forma passiva e a estrutura sintática do grego, que foram convertidas em voz ativa no texto principal para maior naturalidade em português.
lexical_decisions:
- source_word: μετηγάγετε
  choice: afastaram
  rationale: Expressa a remoção de pessoas de uma função ou ministério, de modo direto e natural em português, sem sugerir mera mudança geográfica.
- source_word: καλῶς πολιτευομένους
  choice: que se conduziam bem
  rationale: Preserva o sentido ético e comportamental do particípio, sem restringi-lo indevidamente à administração do cargo.
- source_word: λειτουργίας
  choice: ministério
  rationale: No contexto eclesial, designa o serviço ou função exercida pela pessoa; “ministério” é claro, digno e corrente.
- source_word: ἀμέμπτως αὐτοῖς τετιμημένης
  choice: que eles haviam honrado de modo irrepreensível
  rationale: Reformula naturalmente em voz ativa a construção passiva grega com provável dativo de agente, preservando tanto τιμάω, “honrar”, quanto o advérbio ἀμέμπτως, “de modo irrepreensível”.
theological_decisions:
- issue: Natureza do afastamento do ministério
  choice: afastaram alguns ... do ministério
  alternative: transferiram alguns do ministério
  rationale: O contexto indica remoção da função; “afastaram” comunica isso sem acrescentar uma teoria específica sobre ordenação, deposição ou estrutura eclesiástica.
- issue: Relação entre os ministros e o ministério honrado
  choice: o ministério que eles haviam honrado
  alternative: o ministério que lhes havia sido honrosamente confiado
  rationale: O perfeito passivo τετιμημένης com αὐτοῖς favorece “honrado por eles”; a alternativa com “confiado” introduziria um sentido que o verbo τιμάω não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” torna explícito o plural de ὑμεῖς; “se conduziam bem” conserva o teor moral de πολιτεύομαι. A colocação da nota após o período mantém o marcador junto à oração que ela esclarece.
