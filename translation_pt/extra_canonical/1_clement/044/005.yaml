id: 1CLEM.44.5
reference: 1 Clement 44:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: pt
  text: Bem-aventurados os presbíteros que partiram antes[a], os quais tiveram uma partida oportuna e plena; pois não temem que alguém os remova do lugar que lhes foi dado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seguiram adiante antes”; no contexto, morreram antes.
    reason: Esclarece a construção incomum e preserva a metáfora e a precedência expressas por προοδοιπορήσαντες.
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: partiram antes
  rationale: O particípio descreve os presbíteros que seguiram adiante antes dos demais, aludindo, no contexto, à morte deles. A formulação portuguesa conserva tanto a ideia de precedência quanto a metáfora da partida.
- source_word: πρεσβύτεροι
  choice: presbíteros
  rationale: No contexto imediato, refere-se aos responsáveis da comunidade, e não apenas a homens idosos; “presbíteros” preserva a função indicada no texto.
- source_word: ἔγκαιρον καὶ τελείαν ... ἀνάλυσιν
  choice: uma partida oportuna e plena
  rationale: ἀνάλυσις pode designar partida, soltura ou morte. “Partida” mantém a imagem sem explicitar além do grego; “oportuna e plena” reproduz os dois qualificativos sem reduzir τελείαν apenas a uma morte pacífica.
- source_word: τοῦ δεδομένου αὐτοῖς τόπου
  choice: do lugar que lhes foi dado
  rationale: δεδομένου deriva de δίδωμι, “dar”. A tradução preserva a mudança lexical em relação aos verbos de nomeação empregados nos versículos anteriores e evita importar aqui o sentido específico de “designado”.
theological_decisions:
- issue: Natureza do “lugar” concedido aos presbíteros
  choice: lugar que lhes foi dado
  alternative: cargo para o qual foram designados
  rationale: O texto não identifica expressamente se o “lugar” é um posto eclesial, uma posição reconhecida ou outra condição concedida. A tradução mantém essa abertura e segue o verbo grego “dar”.
- issue: Sentido de ἀνάλυσις
  choice: partida
  alternative: morte
  rationale: Embora o contexto indique a morte, a escolha mantém a metáfora do original e evita tornar explícito o que o grego expressa de modo figurado.
translation_notes:
  register: Português moderno, claro e digno, com “presbíteros” como termo funcional reconhecível. A repetição de “partiram/partida” reflete a rede metafórica do grego e mantém a associação com a morte sem a explicitar no corpo do texto.
