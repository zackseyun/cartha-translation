source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ οἱ ἀπόστολοι ἡμῶν ἔγνωσαν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι ἔρις ἔσται ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/001.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: pt
  text: E os nossos apóstolos souberam, por meio de nosso Senhor Jesus Cristo, que haveria conflito por causa do nome do ofício de supervisão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haveria conflito a respeito do título de supervisor” ou “por causa do cargo de supervisão”. O grego diz literalmente “por causa do nome da supervisão”.'
    reason: A expressão ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς é incomum e admite mais de uma compreensão quanto à relação entre o nome, o título e o ofício.
lexical_decisions:
- source_word: ἔγνωσαν
  choice: souberam
  rationale: Expressa de modo natural o aoristo de γινώσκω, indicando que os apóstolos chegaram a saber disso.
- source_word: ἔρις
  choice: conflito
  rationale: Preserva a ideia de contenda ou disputa sem restringi-la a uma discussão meramente verbal.
- source_word: ἐπὶ τοῦ ὀνόματος
  choice: por causa do nome
  rationale: Mantém a formulação incomum e a ambiguidade do grego, em vez de substituí-la diretamente por uma disputa sobre o cargo.
- source_word: τῆς ἐπισκοπῆς
  choice: do ofício de supervisão
  rationale: No contexto, designa uma função ou encargo de supervisão; evita importar prematuramente um título eclesiástico posterior.
theological_decisions:
- issue: Sentido institucional de ἐπισκοπή
  choice: ofício de supervisão
  alternative: episcopado / cargo de bispo
  rationale: A escolha comunica a dimensão institucional do termo, mas não pressupõe uma estrutura episcopal posterior nem resolve além do texto a forma exata desse ofício.
- issue: Agente intermediário em διὰ τοῦ κυρίου
  choice: por meio de nosso Senhor Jesus Cristo
  alternative: da parte de nosso Senhor Jesus Cristo
  rationale: A tradução mais formal preserva a mediação expressa por διά com genitivo sem especificar de que modo o conhecimento foi comunicado.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Cristo” foi mantido como forma tradicional e semanticamente adequada de Χριστός. A nota conserva a ambiguidade lexical e institucional do original.
