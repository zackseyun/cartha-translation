  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: pt
  text: Pois não será pequeno o nosso pecado se excluirmos aqueles que apresentaram, de modo irrepreensível e devoto, as ofertas do ministério de supervisão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se afastarmos do ministério de supervisão aqueles que apresentaram as ofertas de modo irrepreensível e devoto”.'
    reason: A construção grega permite entender “do ministério de supervisão” com “as ofertas” ou, pelo contexto, com o ato de afastar essas pessoas de sua função.
lexical_decisions:
- source_word: ἁμαρτία ... οὐ μικρά
  choice: não será pequeno o nosso pecado
  rationale: Mantém a ênfase litótica do grego e produz uma formulação clara e digna em português.
- source_word: ἀποβάλωμεν
  choice: excluirmos
  rationale: Expressa a ideia de afastar ou expulsar pessoas da função ou da comunidade sem decidir, no texto principal, precisamente qual dessas duas relações sintáticas está em vista.
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: de modo irrepreensível e devoto
  rationale: Distingue a conduta isenta de censura da atitude piedosa ou reverente indicada pelos dois advérbios.
- source_word: προσενέγκοντας τὰ δῶρα
  choice: apresentaram ... as ofertas
  rationale: Preserva o sentido de apresentar ou oferecer dádivas, inclusive sua possível ressonância cultual, em vez de parafraseá-lo como simples desempenho de deveres.
- source_word: τῆς ἐπισκοπῆς
  choice: do ministério de supervisão
  rationale: ἐπισκοπή pode designar supervisão ou o encargo correspondente; 'ministério de supervisão' é compreensível e evita pressupor um único supervisor.
theological_decisions:
- issue: Relação de τῆς ἐπισκοπῆς com τὰ δῶρα ou com ἀποβάλωμεν
  choice: 'No texto principal, o genitivo qualifica ''as ofertas'': ''as ofertas do ministério de supervisão''.'
  alternative: 'Entender que as pessoas são excluídas do ministério de supervisão: ''se afastarmos do ministério de supervisão aqueles que apresentaram as ofertas...'''
  rationale: A ordem imediata das palavras favorece ligar o genitivo a 'as ofertas', mas o contexto e a tradição de interpretação permitem relacioná-lo funcionalmente à remoção do cargo; a nota conserva essa ambiguidade real.
- issue: Natureza de τὰ δῶρα
  choice: Traduzir como 'as ofertas', preservando possível referência litúrgica.
  alternative: Entender metaforicamente como funções, deveres ou dons do ministério.
  rationale: O substantivo pode ter sentido cultual concreto, e o texto não autoriza reduzir explicitamente as ofertas a deveres administrativos.
translation_notes:
  register: Português atual, claro e solene, com leitura natural no Brasil. Evitou-se o termo denominacional 'episcopado' no texto principal, preferindo-se 'ministério de supervisão'. A formulação mantém a imagem das ofertas e registra em nota a ambiguidade sintática e ministerial.
