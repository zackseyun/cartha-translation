  yaml_path: translation/extra_canonical/1_clement/036/005.yaml
  text: 'And again he says to him:

    “Sit at my right hand,

    until I make your enemies a footstool for your feet.”'
translation:
  language: pt
  text: 'E novamente ele lhe diz:


    “Senta-te à minha direita,

    até que eu ponha os teus inimigos

    como apoio para os teus pés.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κάϑου
  choice: Senta-te
  rationale: Imperativo natural e digno em português, preservando o sentido direto do grego.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressão idiomática corrente que mantém a posição de honra indicada pelo grego.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: como apoio para os teus pés
  rationale: Comunica com clareza a imagem de algo colocado sob os pés, sem depender do termo menos comum “escabelo”.
theological_decisions:
- issue: Identidade do falante e do destinatário
  choice: ele lhe diz
  alternative: Deus lhe diz
  rationale: O grego usa pronomes sem explicitar os referentes; a tradução preserva essa referência contextual e não acrescenta uma identificação interpretativa.
- issue: Valor de ἕως ἂν
  choice: até que
  alternative: até eu colocar
  rationale: Mantém a formulação temporal da citação sem inferir o que ocorre depois do limite mencionado.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A segunda pessoa singular foi mantida na citação por seu tom bíblico e por refletir os pronomes singulares do grego.
