id: 1CLEM.36.2
reference: 1 Clement 36:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: pt
  text: Por meio dele, fixamos o olhar nas alturas dos céus; por meio dele, contemplamos como num espelho seu semblante imaculado e supremo; por meio dele, foram abertos os olhos do nosso coração; por meio dele, nossa mente insensata e obscurecida volta a florescer para a luz; por meio dele, o Soberano quis que provássemos do conhecimento imortal — ele que, sendo o resplendor de sua majestade, é tanto maior que os anjos quanto mais excelente é o nome que herdou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τούτου
  choice: por meio dele
  rationale: Preserva a repetição enfática e a mediação expressa pelo grego.
- source_word: ἐνοπτριζόμεθα
  choice: contemplamos como num espelho
  rationale: Retém explicitamente a imagem especular do verbo, sem reduzi-lo a uma visão direta.
- source_word: ὄψιν
  choice: semblante
  rationale: Expressa a aparência ou face contemplada, em linguagem digna e natural.
- source_word: ἀναθάλλει
  choice: volta a florescer
  rationale: Conserva a metáfora de brotar ou florescer novamente em direção à luz.
- source_word: δεσπότης
  choice: Soberano
  rationale: Comunica autoridade senhorial absoluta sem as associações modernas indesejáveis de 'déspota'.
- source_word: ἀπαύγασμα
  choice: resplendor
  rationale: Equivalente tradicional e preciso para o brilho irradiado, também reconhecível na alusão a Hebreus 1:3.
- source_word: μεγαλοσύνης
  choice: majestade
  rationale: Reproduz o sentido de grandeza majestosa e mantém a ressonância bíblica.
theological_decisions:
- issue: Referentes dos pronomes αὐτοῦ
  choice: Explicitar 'de Deus' em 'semblante' e 'majestade'
  alternative: Manter 'seu semblante' e 'sua majestade'
  rationale: No contexto, os pronomes referem-se ao Soberano/Deus, enquanto 'por meio dele' e o sujeito da oração relativa se referem a Cristo. A explicitação evita ambiguidade pronominal artificial em português sem acrescentar uma identificação alheia ao texto.
- issue: Relação do Filho com os anjos
  choice: Manter a construção comparativa ligada ao nome herdado
  alternative: Parafrasear como superioridade ontológica absoluta sem preservar a forma argumentativa
  rationale: A tradução conserva a formulação e a tensão da alusão a Hebreus 1:3-4, sem desenvolver uma interpretação dogmática além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A cadência anafórica de 'por meio dele' e a sequência de ponto e vírgula foram preservadas; o registro é solene, mas acessível.
