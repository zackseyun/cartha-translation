  text: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ οὕτως· εἶπεν ὁ δεσπότης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· αἴτησαι παρ’ ἐμοῦ, καὶ δώσω σοι ἔϑνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: pt
  text: 'Mas, a respeito de seu Filho, o Soberano disse o seguinte:


    “Tu és meu Filho;


    hoje eu te gerei.


    Pede-me, e te darei as nações como tua herança


    e os confins da terra como tua possessão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: o Soberano
  rationale: Preserva o título explícito atribuído a Deus e comunica autoridade absoluta, distinguindo-o do termo grego comum para “Senhor”.
- source_word: γεγέννηκά
  choice: gerei
  rationale: Reproduz diretamente a linguagem de geração do perfeito grego em português natural, sem explicar ou restringir sua interpretação teológica.
- source_word: ἔθνη
  choice: nações
  rationale: Equivalente corrente que se ajusta ao alcance coletivo e internacional do termo no salmo citado.
- source_word: κατάσχεσιν
  choice: possessão
  rationale: Expressa a ideia de território possuído ou domínio recebido, em paralelo com “herança”.
- source_word: τὰ πέρατα τῆς γῆς
  choice: os confins da terra
  rationale: Mantém a imagem geográfica e poética dos limites mais distantes da terra.
theological_decisions:
- issue: Sentido de “hoje eu te gerei” aplicado ao Filho
  choice: Manter literalmente a linguagem de geração e o referente temporal “hoje”
  alternative: Parafrasear como entronização, manifestação pública ou geração eterna
  rationale: O texto citado preserva uma tensão interpretativa real; a tradução não deve decidir qual evento ou relação teológica a frase descreve.
- issue: Título divino δεσπότης
  choice: Soberano
  alternative: Senhor ou Mestre
  rationale: “Soberano” comunica domínio e autoridade absoluta em português atual, evitando confusão com κύριος e sem introduzir uma formulação confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa (“tu”, “te”, “tua”) mantidas de modo coerente para conservar o tom poético da citação. A introdução integra οὕτως e εἶπεν ὁ δεσπότης numa frase portuguesa natural, sem omitir a atribuição explícita ao Soberano.
