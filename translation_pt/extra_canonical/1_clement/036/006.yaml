  text: τίνες οὖν οἱ ἐχϑροί; οἱ φαῦλοι καὶ ἀντιτασσόμενοι τῷ ϑελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/006.yaml
  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: pt
  text: Quem são, então, os inimigos? Os maus e os que se opõem à vontade dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: maus
  rationale: No contexto moral, o adjetivo designa pessoas más ou perversas. “Maus” é direto, natural e menos carregado que “vis”, sem atenuar o sentido.
- source_word: ἀντιτασσόμενοι
  choice: os que se opõem
  rationale: Expressa resistência ativa ou posicionamento contrário, preservando a força do particípio grego em português natural.
- source_word: τῷ θελήματι αὐτοῦ
  choice: à vontade dele
  rationale: Reproduz com clareza a referência pronominal do grego, sem explicitar além do que o texto diz.
theological_decisions:
- issue: Identidade dos inimigos
  choice: 'Manter os dois qualificativos sob um único grupo: “Os maus e os que se opõem...”'
  alternative: Tratá-los como dois grupos distintos de inimigos
  rationale: Um único artigo grego governa os dois elementos coordenados, favorecendo a descrição conjunta de uma mesma classe, embora a coordenação permaneça visível.
translation_notes:
  register: Português moderno, claro e digno, com ordem interrogativa natural. “Então” preserva a progressão argumentativa de οὖν.
