id: 1CLEM.36.1
reference: 1 Clement 36:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: pt
  text: 'Este é o caminho, amados, no qual encontramos a nossa salvação: Jesus Cristo[a], o sumo sacerdote das nossas ofertas, o protetor e auxiliador da nossa fraqueza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus, o Messias”.
    reason: Registra o sentido titular de Χριστός como alternativa possível, embora “Jesus Cristo” seja a forma mais adequada ao uso contextual.
lexical_decisions:
- source_word: τὸ σωτήριον ἡμῶν
  choice: a nossa salvação
  rationale: O substantivo neutro σωτήριον pode designar a salvação ou o meio pelo qual ela vem; aqui está em aposição a Jesus Cristo. A formulação preserva essa identificação sem acrescentar uma explicação ausente do grego.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus Cristo
  rationale: No uso cristão de Clemente, Χριστός funciona como título fixo ou nome associado a Jesus. A tradução corrente é natural em português e evita impor aqui uma ênfase explicativa não exigida pelo contexto.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É o equivalente português estabelecido para o principal sacerdote e preserva a linguagem cultual da passagem.
- source_word: προσφορῶν
  choice: ofertas
  rationale: O termo designa aquilo que é apresentado ou oferecido, especialmente em contexto cultual. “Ofertas” mantém esse sentido sem especificar indevidamente sacrifícios.
- source_word: προστάτην καὶ βοηθὸν
  choice: protetor e auxiliador
  rationale: Προστάτης inclui a ideia de quem se põe à frente para defender ou proteger, enquanto βοηθός é quem presta auxílio. Os dois termos foram mantidos separadamente.
- source_word: ἀσθενείας
  choice: fraqueza
  rationale: Preserva o sentido amplo de debilidade ou incapacidade humana, sem restringi-lo a doença física.
theological_decisions:
- issue: Relação entre Jesus Cristo e “a nossa salvação”
  choice: 'Manter a aposição direta: “a nossa salvação: Jesus Cristo”'
  alternative: Explicitar “aquele que nos traz a salvação”
  rationale: O grego identifica Jesus Cristo diretamente com τὸ σωτήριον ἡμῶν. A explicitação alternativa resolveria a construção teológica em termos apenas instrumentais.
- issue: Valor de Χριστός
  choice: “Cristo” no texto principal
  alternative: “o Messias”
  rationale: A ausência de artigo e o uso cristão consolidado favorecem “Jesus Cristo”; a alternativa etimológica legítima é registrada em nota sem dominar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura retórica e a terminologia sacerdotal do grego foram preservadas; “auxiliador” foi escolhido para manter o paralelismo substantivo, apesar de ser ligeiramente mais formal.
