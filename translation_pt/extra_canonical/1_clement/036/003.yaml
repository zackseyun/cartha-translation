  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: pt
  text: 'Pois está escrito assim:


    “Ele faz dos seus anjos ventos[a]

    e dos seus ministros uma chama de fogo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espíritos”. A palavra grega pode significar “ventos” ou “espíritos”.'
    reason: Preserva a ambiguidade lexical genuína de πνεύματα sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: γέγραπται γὰρ οὕτως
  choice: Pois está escrito assim
  rationale: Mantém a fórmula introdutória e o valor explicativo de γάρ em português natural e digno.
- source_word: ἀγγέλους
  choice: anjos
  rationale: Preserva o sentido lexical usual e a linguagem tradicional da citação, embora o termo grego também possa significar mensageiros.
- source_word: πνεύματα
  choice: ventos
  rationale: No contexto da citação do Salmo 104:4, o paralelismo com a chama de fogo favorece a referência a forças naturais; a ambiguidade lexical é registrada em nota.
- source_word: λειτουργοὺς
  choice: ministros
  rationale: Expressa servidores que desempenham um serviço, conservando a formulação cultual e solene sem especificar uma função denominacional.
- source_word: πυρὸς φλόγα
  choice: uma chama de fogo
  rationale: Reproduz diretamente a imagem grega com expressão portuguesa clara.
theological_decisions:
- issue: Relação entre anjos e ventos em ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα
  choice: Ele faz dos seus anjos ventos
  alternative: Ele faz dos ventos seus mensageiros
  rationale: A sintaxe grega admite discussão sobre a relação predicativa, e a tradição textual citada costuma ser entendida como transformação ou designação dos anjos como ventos. A tradução segue a ordem e a leitura imediata do grego de 1 Clemente, sem ocultar a ambiguidade de πνεύματα.
translation_notes:
  register: Português moderno, amplamente compreensível e de leitura natural no Brasil, com cadência digna de citação bíblica. A disposição em versos preserva o paralelismo poético.
