source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: pt
  text: 'E novamente, quando ele se separou de Ló[a], Deus lhe disse: “Erga os olhos e, do lugar onde você está agora, olhe para o norte, o sul, o leste e o mar[b], pois toda a terra que você vê eu darei a você e à sua descendência para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele foi separado de Ló”.'
    reason: A forma grega é passiva, mas pode ter sentido intransitivo ou quase médio neste contexto.
  - marker: b
    text: Isto é, o oeste.
    reason: Na geografia da passagem, o mar Mediterrâneo marca a direção oeste.
lexical_decisions:
- source_word: διαχωρισθῆναι
  choice: se separou
  rationale: 'Embora a forma seja passiva, o verbo pode ter aqui sentido intransitivo ou quase médio: Abraão e Ló tomaram rumos distintos. A nota preserva a possibilidade de uma leitura passiva mais formal.'
- source_word: Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε
  choice: Erga os olhos e olhe
  rationale: Reproduz de modo natural a sequência de levantar os olhos e dirigir o olhar às direções indicadas.
- source_word: λίβα
  choice: sul
  rationale: No contexto da enumeração dos quatro pontos cardeais da citação de Gênesis, designa a direção sul, embora o termo possa ser mais especificamente associado ao sudoeste.
- source_word: θάλασσαν
  choice: mar
  rationale: Mantém a imagem geográfica literal do grego; nesse contexto, o mar indica a direção oeste.
- source_word: σπέρματί
  choice: descendência
  rationale: Expressa o substantivo coletivo 'semente' em português corrente sem impor singularidade ou pluralidade aos descendentes.
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: Equivalente idiomático e digno para a duração indefinida ou perpétua expressa pela locução grega.
theological_decisions:
- issue: Agente da separação entre Abraão e Ló
  choice: quando ele se separou de Ló
  alternative: quando ele foi separado de Ló
  rationale: O contexto narrativo favorece o sentido intransitivo/quase médio, sem sugerir que um agente externo separou Abraão de Ló; a alternativa formalmente passiva é registrada em nota.
- issue: Sentido coletivo de σπέρμα
  choice: descendência
  alternative: semente
  rationale: ‘Descendência’ conserva o valor coletivo normal no contexto da promessa, evitando resolver questões teológicas posteriores sobre o alcance do termo.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A citação preserva ‘mar’ no texto e esclarece seu valor direcional em nota.
