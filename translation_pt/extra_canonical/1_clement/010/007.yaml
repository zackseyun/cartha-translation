id: 1CLEM.10.7
reference: 1 Clement 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ πίστιν καὶ φιλοξενίαν ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ, καὶ διʼ ὑπακοῆς προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ πρὸς ἓν τῶν ὀρέων ὧν ἔδειξεν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: pt
  text: Por causa da fé e da hospitalidade, foi-lhe dado um filho na velhice; e, por obediência, ele o ofereceu como sacrifício a Deus em um dos montes que lhe havia mostrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que lhe mostrou”. O grego não explicita o sujeito do verbo.
    reason: Registra tanto a possibilidade de verter o aoristo de modo simples quanto a ambiguidade gramatical do sujeito implícito.
lexical_decisions:
- source_word: πίστιν
  choice: fé
  rationale: Equivalente direto e natural, preservando o sentido religioso amplo do termo grego.
- source_word: φιλοξενίαν
  choice: hospitalidade
  rationale: Traduz o acolhimento de estrangeiros ou hóspedes sem restringir indevidamente o sentido.
- source_word: ἐν γήρᾳ
  choice: na velhice
  rationale: Expressão portuguesa natural que corresponde ao estado temporal indicado pelo grego.
- source_word: διʼ ὑπακοῆς
  choice: por obediência
  rationale: Mantém o paralelismo causal ou instrumental de διά com a primeira oração.
- source_word: προσήνεγκεν ... θυσίαν
  choice: ofereceu ... como sacrifício
  rationale: Reproduz de modo claro a construção sacrificial grega sem sugerir que o sacrifício tenha sido consumado.
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: em um dos montes
  rationale: No contexto de movimento e oferta, o português idiomático pede 'em'; 'um dos montes' conserva a referência indefinida.
- source_word: ἔδειξεν
  choice: havia mostrado
  rationale: O mais-que-perfeito composto esclarece que a indicação do monte precedeu a oferta, sem inserir no texto um sujeito que o grego deixa implícito.
theological_decisions:
- issue: A oferta do filho como sacrifício
  choice: ele o ofereceu como sacrifício a Deus
  alternative: ele o sacrificou a Deus
  rationale: O verbo προσφέρω descreve a apresentação ou oferta; 'sacrificou' poderia sugerir indevidamente que a morte ocorreu.
- issue: Sujeito implícito de ἔδειξεν
  choice: que lhe havia mostrado
  alternative: que Deus lhe havia mostrado
  rationale: Embora o contexto favoreça Deus como sujeito, o grego não o explicita; a tradução preserva essa forma e a nota registra a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva “foi-lhe dado” conserva a forma do grego, e o ponto e vírgula mantém o paralelismo entre fé/hospitalidade e obediência.
