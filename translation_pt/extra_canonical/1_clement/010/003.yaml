  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: pt
  text: “Parta[a] da sua terra, do meio dos seus parentes e da casa de seu pai, e vá para a terra que eu lhe mostrarei. Farei de você uma grande nação, eu o abençoarei e engrandecerei o seu nome, e você será abençoado. Abençoarei os que o abençoarem e amaldiçoarei os que o amaldiçoarem; e em você[b] serão abençoadas todas as tribos da terra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá embora”.'
    reason: Registra uma alternativa mais explícita para Ἄπελθε, cujo sentido é partir ou afastar-se, não especificamente sair de dentro de algo.
  - marker: b
    text: 'Ou: “por meio de você”.'
    reason: Preserva a possível nuance instrumental de ἐν σοὶ sem eliminar a formulação mais literal “em você” do texto principal.
lexical_decisions:
- source_word: Ἄπελθε
  choice: Parta
  rationale: Traduz o imperativo de ἀπέρχομαι como afastamento ou partida, respeitando a variante lexical de Clemente em relação ao Ἔξελθε da Septuaginta, sem recorrer à formulação tradicional “saia”.
- source_word: συγγενείας
  choice: parentes
  rationale: Expressa em linguagem atual o grupo de parentesco, evitando o termo mais antigo “parentela”.
- source_word: μεγαλυνῶ τὸ ὄνομά σου
  choice: engrandecerei o seu nome
  rationale: Mantém a imagem semítica e o sentido de tornar o nome grande ou célebre, em formulação portuguesa natural e digna.
- source_word: φυλαὶ
  choice: tribos
  rationale: Conserva a referência a grupos de descendência ou povos organizados por linhagens, sem generalizá-la para “nações” ou “famílias”.
theological_decisions:
- issue: Sentido de ἐν σοὶ na promessa final
  choice: em você
  alternative: por meio de você
  rationale: A tradução principal preserva a forma e a possível amplitude do grego, enquanto a nota registra a leitura instrumental natural sem decidir silenciosamente entre as nuances.
- issue: Predicado εὐλογημένος
  choice: você será abençoado
  alternative: você será uma bênção
  rationale: O texto de Clemente traz explicitamente o particípio/adjetivo “abençoado”, e não o substantivo “bênção”; por isso a tradução segue sua redação específica.
translation_notes:
  register: Português moderno, claro e solene, com pronomes de terceira pessoa para ampla legibilidade brasileira e internacional. A repetição coordenada do grego foi parcialmente mantida para conservar a cadência da promessa, com pontuação ajustada à leitura natural em português.
