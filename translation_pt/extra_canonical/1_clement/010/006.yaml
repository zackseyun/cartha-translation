id: 1CLEM.10.6
reference: 1 Clement 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: pt
  text: 'E diz novamente: “Deus levou Abraão para fora e lhe disse: ‘Olhe para o céu e conte as estrelas, se é que consegue contá-las. Assim será a sua descendência.’ Abraão creu em Deus, e isso lhe foi atribuído como justiça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: levou ... para fora
  rationale: Reproduz de modo natural o sentido de conduzir Abraão para fora, conforme a cena de Gênesis 15.
- source_word: Ἀνάβλεψον
  choice: Olhe para o céu
  rationale: No contexto, indica erguer o olhar; a formulação é corrente e liga naturalmente o verbo ao complemento εἰς τὸν οὐρανόν.
- source_word: σπέρμα
  choice: descendência
  rationale: Preserva o sentido coletivo de linhagem ou descendentes sem o estranhamento que 'semente' teria neste contexto em português moderno.
- source_word: ἐλογίσθη
  choice: foi atribuído
  rationale: Expressa o ato de considerar ou creditar algo a Abraão, mantendo a construção passiva do grego.
- source_word: εἰς δικαιοσύνην
  choice: como justiça
  rationale: Tradução idiomática que preserva a relação predicativa sem explicitar além do texto a natureza teológica dessa atribuição.
theological_decisions:
- issue: Referente implícito em ἐλογίσθη αὐτῷ
  choice: isso lhe foi atribuído
  alternative: a fé lhe foi atribuída
  rationale: O grego não nomeia explicitamente 'fé' como sujeito; 'isso' mantém a referência ao ato de crer sem acrescentar um substantivo ausente.
- issue: Extensão da citação das Escrituras
  choice: Toda a frase, incluindo a fé de Abraão e sua atribuição como justiça, permanece dentro das aspas externas
  alternative: Encerrar a citação depois de 'descendência'
  rationale: A sintaxe apresenta uma citação contínua introduzida por 'diz novamente', abrangendo Gênesis 15:5–6.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a citação contínua e usa formas amplamente compreensíveis, sem terminologia confessional acrescentada.
