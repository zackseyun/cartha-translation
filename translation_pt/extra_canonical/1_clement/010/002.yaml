base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: pt
  text: 'E, em obediência, ele saiu de sua terra, de sua parentela e da casa de seu pai, para que, deixando para trás pouca terra, uma parentela sem força e uma casa pequena, herdasse as promessas de Deus. Pois Deus lhe diz:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: em obediência
  rationale: Preserva o valor modal da expressão e o destaque dado à obediência de Abraão.
- source_word: συγγένεια
  choice: parentes / parentela
  rationale: No primeiro uso, a expressão natural «do meio de seus parentes» comunica o grupo familiar; no segundo, «parentela» permite qualificá-lo coletivamente como «sem força».
- source_word: ἀσθενῆ
  choice: sem força
  rationale: Mantém a noção ampla de fraqueza ou pouca influência sem especificar indevidamente se era numérica, social ou política.
- source_word: οἶκον μικρόν
  choice: uma casa modesta
  rationale: Aqui «casa» pode abranger a unidade doméstica ou linhagem, não apenas o edifício; «modesta» expressa sua pequena condição sem fechar a ambiguidade.
- source_word: κληρονομήσῃ
  choice: herdasse
  rationale: Conserva a linguagem de herança presente no verbo grego e sua relação com as promessas divinas.
theological_decisions:
- issue: Sujeito de λέγει
  choice: «Deus lhe diz»
  alternative: «ele lhe diz»
  rationale: Embora o grego tenha sujeito implícito, o referente contextual de «as promessas de Deus» e a introdução da fala divina tornam «Deus» a identificação natural; a formulação evita uma referência pronominal pouco clara em português.
- issue: Relação entre obediência e herança das promessas
  choice: Manter a construção final «para que ... herdasse»
  alternative: Reformular como simples resultado cronológico
  rationale: A redação conserva a tensão do texto entre o ato obediente de partir e a finalidade de herdar as promessas, sem elaborar uma doutrina sobre mérito ou causalidade salvífica.
translation_notes:
  register: Português moderno, digno e acessível, com cadência adequada a uma leitura eclesial. A repetição estrutural de terra, parentela e casa foi preservada, mas com variação idiomática mínima para soar natural.
