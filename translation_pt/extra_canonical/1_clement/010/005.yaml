source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ποιήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς γῆς· εἰ δύναταί τις ἐξαριθμῆσαι τὴν ἄμμον τῆς γῆς, καὶ τὸ σπέρμα σου ἐξαριθμηθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: pt
  text: E farei a sua descendência como a areia da terra; se alguém puder contar a areia da terra, também a sua descendência será contada.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα
  choice: descendência
  rationale: Neste contexto de promessa patriarcal, o singular coletivo grego designa os descendentes de Abraão; “descendência” preserva o valor coletivo e soa natural em português.
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: contar / será contada
  rationale: Traduz diretamente a ideia de enumerar, mantendo a repetição e a correspondência retórica do original.
- source_word: ἄμμον τῆς γῆς
  choice: areia da terra
  rationale: Mantém a formulação específica da citação grega, sem substituí-la pela expressão mais habitual “areia do mar”.
theological_decisions:
- issue: Sentido coletivo de σπέρμα
  choice: descendência
  alternative: semente
  rationale: “Descendência” comunica aqui o referente humano coletivo sem introduzir uma leitura cristológica singular que o contexto imediato não exige.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. O futuro passivo “será contada” foi preservado para manter o paralelismo da promessa.
