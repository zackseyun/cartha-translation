source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: pt
  text: Abraão, que foi chamado de amigo, foi considerado fiel por se tornar obediente às palavras de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao se tornar obediente”.'
    reason: Preserva a possível nuance circunstancial da construção grega ἐν τῷ com infinitivo.
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  choice: chamado amigo
  rationale: Reproduz de modo natural o título atribuído a Abraão, sem acrescentar o artigo definido que poderia tornar a expressão artificial em português.
- source_word: πιστὸς εὑρέθη
  choice: foi considerado fiel
  rationale: O idiomatismo grego significa que Abraão foi reconhecido ou demonstrado fiel; esta formulação evita o pouco natural «foi encontrado fiel».
- source_word: ὑπήκοον γενέσθαι
  choice: ter se tornado obediente
  rationale: Preserva o valor ingressivo de γενέσθαι e a relação de obediência expressa por ὑπήκοον.
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: às palavras de Deus
  rationale: Correspondência direta e clara para o plural ῥήμασιν, entendido como as palavras ou declarações divinas.
theological_decisions:
- issue: Relação entre a fidelidade de Abraão e sua obediência
  choice: por ter se tornado obediente
  alternative: ao se tornar obediente
  rationale: A construção ἐν τῷ com infinitivo pode indicar meio, fundamento ou circunstância concomitante. O texto principal expressa o valor causal/instrumental provável, enquanto a nota conserva a leitura circunstancial.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação mantém a concisão do grego e não explicita além do texto em que sentido Abraão foi chamado «amigo».
