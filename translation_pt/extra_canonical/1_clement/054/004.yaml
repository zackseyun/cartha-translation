source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: pt
  text: Essas coisas fizeram e farão os que vivem segundo o modo de vida de Deus, do qual não há por que se arrepender[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que vivem como cidadãos na cidadania de Deus, da qual não há por que se arrepender”.'
    reason: Preserva o possível colorido político da construção cognata πολιτευόμενοι ... πολιτείαν, embora, no contexto, o sentido mais provável seja o de conduta ou modo de vida.
lexical_decisions:
- source_word: πολιτευόμενοι ... πολιτείαν
  choice: seguem o modo de vida
  rationale: O verbo e o substantivo cognatos descrevem aqui a maneira de conduzir a vida. A formulação portuguesa evita uma repetição artificial, enquanto a nota preserva a imagem possível de cidadania.
- source_word: ἀμεταμέλητον
  choice: que não dá motivo para arrependimento
  rationale: O adjetivo significa algo de que não é preciso arrepender-se ou que não causa pesar. Esta tradução evita sugerir, incorretamente, um modo de vida pecaminoso ainda não abandonado.
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: fizeram e farão
  rationale: Preserva diretamente o contraste temporal entre o aoristo e o futuro.
theological_decisions:
- issue: Sentido do genitivo τοῦ θεοῦ
  choice: de Deus
  alternative: estabelecido por Deus
  rationale: O genitivo grego admite mais de uma relação possível. A tradução mantém a formulação ampla, sem especificar se o modo de vida pertence a Deus, procede dele ou foi por ele estabelecido.
translation_notes:
  register: Português atual, digno e acessível. A ordem foi ajustada para fluência, sem eliminar a ênfase em “essas coisas”. A expressão sobre arrependimento foi formulada de modo a impedir a leitura invertida de um comportamento ainda não confessado.
