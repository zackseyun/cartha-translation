  source_fidelity: A tradução acompanha bem a estrutura e o sentido geral do grego. Contudo, τὸ πλήθος é mais diretamente “a multidão/o conjunto reunido” do que “a comunidade”; embora o contexto seja eclesial, “comunidade” especifica o referente de modo interpretativo e se afasta tanto do termo grego quanto da trilha inglesa. Também “contenda” é um equivalente mais preciso para ἔρις do que o mais amplo “conflito”.
  naturalness: A redação é clara, digna e natural em português contemporâneo. “Parto para onde vocês quiserem” torna mais diretamente o par verbal ἐκχωρῶ, ἄπειμι e soa idiomático. A nota é compreensível; o marcador é mais naturalmente colocado após a pontuação final da fala.
  terminology: “Messias” traduz adequadamente Χριστός conforme a política fornecida. “Presbíteros designados” é conciso, natural e fiel a τῶν καθεσταμένων πρεσβυτέρων, sem pressupor um modelo denominacional de nomeação.
