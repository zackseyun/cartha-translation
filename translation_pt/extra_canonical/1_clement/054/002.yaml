source:
  edition: Funk 1901 (normalized OCR)
  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: pt
  text: 'Que ele diga: “Se por minha causa há facção, contenda e divisões, retiro-me, parto para onde vocês quiserem e farei o que a multidão ordenar. Somente que o rebanho do Messias viva em paz com os presbíteros designados.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os presbíteros que foram designados”.'
    reason: Registra a formulação mais explícita do particípio perfeito passivo καθεσταμένων; a diferença é de construção, não de conteúdo.
lexical_decisions:
- source_word: στάσις
  choice: facção
  rationale: Preserva a ideia de formação de partido ou dissensão interna, distinta de ἔρις e σχίσματα.
- source_word: ἔρις
  choice: conflito
  rationale: Expressa contenda ou rivalidade de modo natural e mantém a distinção da facção e das divisões.
- source_word: σχίσματα
  choice: divisões
  rationale: Equivalente claro e corrente para rupturas dentro da comunidade.
- source_word: τὸ πλήθος
  choice: a comunidade
  rationale: Neste contexto eclesial, designa o corpo reunido ou conjunto dos membros; evita a conotação impessoal de “multidão” sem transformar o termo em “maioria”.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Traduz o título grego Χριστός por seu sentido, em linguagem compreensível e coerente com a camada de consulta fornecida.
- source_word: τῶν καθεσταμένων πρεσβυτέρων
  choice: os presbíteros designados
  rationale: Reproduz de forma concisa o particípio perfeito passivo, indicando pessoas estabelecidas ou nomeadas para essa função.
theological_decisions:
- issue: Natureza da autoridade de τὸ πλήθος
  choice: “o que a comunidade ordenar”
  alternative: “o que a multidão ordenar” ou “o que a maioria ordenar”
  rationale: “Comunidade” conserva a referência coletiva sem afirmar que a decisão decorre necessariamente de votação majoritária nem sugerir uma massa desorganizada.
- issue: Sentido de καθεσταμένων aplicado aos presbíteros
  choice: “presbíteros designados”
  alternative: “presbíteros estabelecidos”
  rationale: Indica que eles foram colocados na função, sem especificar um procedimento denominacional de ordenação ou eleição.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Vocês” torna natural o plural de βούλησθε; “presbíteros” preserva o termo institucional sem importar uma estrutura denominacional específica.
