  text: Τίς οὖν ἐν ὑμῖν γενναῖος, τίς εὔσπλαγχνος, τίς πεπληροφορημένος ἀγάπης;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/001.yaml
  text: Who then among you is noble? Who is compassionate? Who is filled with love?
translation:
  language: pt
  text: Quem, então, entre vocês é nobre? Quem é compassivo? Quem está cheio de amor?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  choice: nobre
  rationale: Expressa caráter elevado e coragem moral em português natural, sem restringir o termo à condição social.
- source_word: εὔσπλαγχνος
  choice: compassivo
  rationale: Comunica de modo claro e atual a ideia de profunda misericórdia e ternura para com outros.
- source_word: πεπληροφορημένος ἀγάπης
  choice: está cheio de amor
  rationale: O particípio perfeito passivo com genitivo de conteúdo indica estar plenamente cheio de amor; evita o sentido menos adequado de estar plenamente convicto 'no amor'.
theological_decisions:
- issue: Sentido de πεπληροφορημένος com o genitivo ἀγάπης
  choice: está cheio de amor
  alternative: está plenamente seguro no amor
  rationale: Nesta construção, ἀγάπης funciona como genitivo de conteúdo. A tradução preserva o enfoque na plenitude de amor da pessoa, em vez de introduzir a ideia de certeza ou convicção.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo interrogativo preservado. “Vocês” favorece ampla legibilidade brasileira sem tornar a frase coloquial.
