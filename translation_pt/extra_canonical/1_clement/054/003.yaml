id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: pt
  text: Aquele que fizer isso[a] conquistará para si grande renome no Messias, e todo lugar o acolherá. Pois do Senhor é a terra e tudo o que ela contém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que fez isso”.'
    reason: O particípio aoristo grego pode ser entendido como ato realizado, embora o contexto e o futuro do verbo principal favoreçam em português a formulação prospectiva “fizer”.
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: Aquele que fizer
  rationale: O particípio aoristo substantivado identifica a pessoa que realiza o ato mencionado. A construção com futuro do subjuntivo é natural em português e se harmoniza com o verbo principal no futuro, sem restringir o referente ao sexo masculino.
- source_word: μέγα κλέος
  choice: grande renome
  rationale: κλέος indica fama, renome ou reputação gloriosa; “grande renome” preserva o sentido público do termo melhor que o mais genérico “grande honra”.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός é o título grego correspondente a “Messias”. A formulação mantém seu valor titular e traduz naturalmente a preposição ἐν.
- source_word: πᾶς τόπος δέξεται αὐτόν
  choice: será acolhido em qualquer lugar
  rationale: A forma passiva idiomática em português comunica com clareza que todos os lugares estarão dispostos a recebê-lo, evitando a personificação rígida de “todo lugar”.
- source_word: τὸ πλήρωμα αὐτῆς
  choice: tudo o que ela contém
  rationale: Expressa em português corrente a ideia de toda a plenitude ou totalidade do que enche a terra.
theological_decisions:
- issue: Valor de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo é conservado como título messiânico, sem introduzir interpretação denominacional adicional.
- issue: Referente de κύριος na citação do Salmo 24:1
  choice: Senhor
  alternative: SENHOR
  rationale: O grego apresenta κύριος, e “Senhor” preserva a forma recebida no texto sem explicitar além dele o nome divino subjacente à citação hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Será acolhido em qualquer lugar” evita uma construção excessivamente literal, enquanto a frase final mantém o caráter proverbial e escritural da citação.
