source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: pt
  text: Felizes somos, amados, se cumprimos os mandamentos de Deus na concórdia do amor, para que, por meio do amor, nossos pecados nos sejam perdoados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa o estado de bem-aventurança declarado pelo adjetivo grego de modo natural e compreensível em português.
- source_word: προστάγματα
  choice: mandamentos
  rationale: Designa ordens ou preceitos divinos; “mandamentos” é claro, digno e adequado ao contexto.
- source_word: ἐποιοῦμεν
  choice: cumprimos
  rationale: O verbo ποιέω, aplicado a mandamentos, significa pô-los em prática; “cumprimos” é mais idiomático do que “fazemos”.
- source_word: ὁμονοίᾳ
  choice: concórdia
  rationale: Preserva a ideia de acordo e união de ânimo, importante no contexto comunitário de 1 Clemente, e a distingue de mera harmonia estética.
- source_word: δι’ ἀγάπης
  choice: por meio do amor
  rationale: Mantém o valor mediador ou instrumental de διά com o genitivo sem especificar além do que o grego afirma.
theological_decisions:
- issue: Relação entre amor e perdão dos pecados
  choice: “para que, por meio do amor, nossos pecados nos sejam perdoados”
  alternative: “resultando em que, por meio do amor, nossos pecados nos sejam perdoados”
  rationale: A construção εἰς τὸ com infinitivo pode expressar finalidade ou resultado. “Para que” conserva a leitura final mais direta, enquanto a forma passiva mantém sem identificar explicitamente o agente do perdão e evita definir de maneira denominacional como o amor se relaciona com ele.
- issue: Condição expressa por εἰ
  choice: “se cumprimos”
  alternative: “quando cumprimos”
  rationale: Mantém a condição explícita do grego e não a transforma numa afirmação temporal ou numa garantia independente da condição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Amados” preserva o vocativo pastoral; “concórdia do amor” retém a densidade comunitária de ὁμόνοια sem perder naturalidade. A repetição de “amor” reproduz deliberadamente a repetição grega de ἀγάπη.
