source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: pt
  text: 'Pois está escrito: “Felizes aqueles cujas transgressões são perdoadas e cujos pecados são encobertos[a]; feliz o homem a quem o Senhor jamais atribuirá pecado e em cuja boca não há engano.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujas transgressões foram perdoadas e cujos pecados foram encobertos”.'
    reason: Os verbos gregos estão no aoristo e podem ser vertidos formalmente no passado, embora aqui tenham valor geral e resultativo.
lexical_decisions:
- source_word: ἀνομίαι
  choice: transgressões
  rationale: Expressa atos contrários à lei de forma natural e digna, sem restringir o termo a uma formulação jurídica técnica.
- source_word: ἀφέθησαν
  choice: são perdoadas
  rationale: Embora seja aoristo passivo, ocorre numa bem-aventurança de valor geral; o presente comunica em português o estado vigente dos que recebem perdão.
- source_word: ἐπεκαλύφθησαν
  choice: são encobertos
  rationale: Preserva a metáfora de cobrir os pecados e, como no verbo paralelo, comunica o valor geral e resultativo da bem-aventurança.
- source_word: οὐ μὴ λογίσηται
  choice: jamais atribuirá
  rationale: A combinação οὐ μή dá forte negação ao verbo de contabilizar ou imputar; “jamais atribuirá” preserva a ênfase e soa natural em português.
- source_word: δόλος
  choice: engano
  rationale: Abrange fraude, falsidade e intenção enganosa sem estreitar indevidamente o sentido.
theological_decisions:
- issue: Sentido de λογίζομαι na relação do Senhor com o pecado
  choice: atribuirá pecado
  alternative: levará o pecado em conta
  rationale: “Atribuir” mantém a imagem de lançar algo à conta de alguém, mas não explicita uma teoria denominacional específica sobre imputação.
- issue: Valor temporal dos aoristos ἀφέθησαν e ἐπεκαλύφθησαν
  choice: 'presente geral: “são perdoadas… são encobertos”'
  alternative: 'passado: “foram perdoadas… foram encobertos”'
  rationale: No contexto proverbial da bem-aventurança, o presente representa melhor a classe geral e seu estado, enquanto a nota conserva a leitura formalmente passada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Felizes” evita arcaísmo desnecessário; a estrutura paralela e a metáfora bíblica de pecados encobertos foram preservadas.
