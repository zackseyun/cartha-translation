  text: Ὁρᾶτε, ἀγαπητοί, πῶς μέγα καὶ θαυμαστόν ἐστιν ἡ ἀγάπη, καὶ τῆς τελειότητος αὐτῆς οὐκ ἔστιν ἐξήγησις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/001.yaml
  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: pt
  text: Vejam, amados, como é grande e maravilhoso o amor, e não há como descrever sua perfeição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há descrição de sua perfeição”.'
    reason: Registra a nuance mais formal de ἐξήγησις como descrição, relato ou exposição em palavras, sem acrescentar uma qualificação ausente do grego.
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Vejam
  rationale: Imperativo plural direto e natural em português moderno, preservando o apelo aos leitores.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Vocativo tradicional, digno e claro, que conserva a linguagem afetiva do grego.
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente corrente e abrangente, sem acrescentar qualificação teológica ausente do texto.
- source_word: ἐξήγησις
  choice: descrever
  rationale: Neste contexto, indica pôr em palavras, relatar ou expor; “descrever” comunica melhor a ideia do que “explicar” no sentido moderno de apresentar causas.
- source_word: τελειότητος
  choice: perfeição
  rationale: Correspondência formal e natural para a qualidade de ser completo ou perfeito.
theological_decisions:
- issue: Caráter inexprimível da perfeição do amor
  choice: não há como descrever sua perfeição
  alternative: não há explicação para sua perfeição
  rationale: A formulação preserva a afirmação elevada do autor sem sugerir que o amor careça de razão ou causa; o foco é a impossibilidade de expressá-lo adequadamente em palavras.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A inversão nominal do grego foi convertida em uma construção idiomática sem eliminar a ênfase na grandeza, no caráter maravilhoso e na perfeição do amor.
