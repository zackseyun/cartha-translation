id: 1CLEM.50.2
reference: 1 Clement 50:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: pt
  text: Quem é capaz de ser encontrado nela, a não ser aqueles que Deus considerar dignos? Portanto, oremos e peçamos de sua misericórdia que sejamos encontrados no amor, sem parcialidade humana, irrepreensíveis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: capaz
  rationale: Expressa suficiência ou capacidade de modo natural, preservando a pergunta retórica do grego.
- source_word: καταξιώσῃ
  choice: considerar dignos
  rationale: Mantém a ideia de Deus julgar ou ter alguém por digno, sem transformar o verbo em uma afirmação sobre mérito intrínseco.
- source_word: δεηθῶμεν
  choice: oremos
  rationale: No contexto de um pedido dirigido a Deus, traduz naturalmente o sentido de suplicar ou rogar em oração.
- source_word: ἀγάπῃ
  choice: amor
  rationale: É o equivalente português direto e apropriado para o contexto ético e comunitário.
- source_word: προσκλίσεως ἀνθρωπίνης
  choice: parcialidade humana
  rationale: Comunica a inclinação tendenciosa ou favoritismo humano indicado pela expressão grega.
- source_word: ἄμωμοι
  choice: irrepreensíveis
  rationale: Preserva o sentido de estar sem culpa ou defeito censurável e concorda com o sujeito implícito plural.
theological_decisions:
- issue: A relação entre a dignidade humana e a ação de Deus
  choice: aqueles que Deus considerar dignos
  alternative: aqueles que Deus tornar dignos
  rationale: O verbo καταξιόω pode envolver reputar ou julgar digno; a tradução escolhida preserva essa formulação sem resolver a tensão teológica em favor de mérito humano ou transformação divina.
- issue: Referente de ἄμωμοι
  choice: irrepreensíveis, como predicativo dos que são encontrados no amor
  alternative: amor irrepreensível
  rationale: A forma plural ἄμωμοι concorda gramaticalmente com o sujeito plural implícito, não com ἀγάπῃ, que está no singular dativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura retórica e a sequência de pedidos do grego foram preservadas sem rigidez excessiva.
