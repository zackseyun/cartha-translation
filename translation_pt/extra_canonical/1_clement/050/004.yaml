  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: pt
  text: 'Pois está escrito: “Entrem em seus aposentos por um brevíssimo tempo, até que passem a minha ira e o meu furor; e me lembrarei de um dia favorável e os levantarei de seus túmulos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: aposentos
  rationale: Designa cômodos ou recintos reservados; “aposentos” é natural e não acrescenta explicitamente a ideia de “interiores”.
- source_word: μικρὸν ὅσον ὅσον
  choice: por um brevíssimo tempo
  rationale: A expressão repetida intensifica a brevidade; esta formulação comunica o sentido com clareza em português atual.
- source_word: ὀργὴ καὶ ὁ θυμός
  choice: ira e furor
  rationale: Preserva os dois termos coordenados e sua intensidade, sem reduzi-los a uma única emoção.
- source_word: ἡμέρας ἀγαθῆς
  choice: um dia favorável
  rationale: “Favorável” expressa aqui o valor positivo de ἀγαθῆς sem especificar além do que o grego afirma.
- source_word: θηκῶν
  choice: túmulos
  rationale: No contexto de levantar os destinatários, θῆκαι refere-se a sepulturas ou túmulos; a escolha mantém a imagem de ressurreição.
theological_decisions:
- issue: Relação temporal e lógica de καί antes de μνησθήσομαι
  choice: então me lembrarei
  alternative: e me lembrarei
  rationale: O encadeamento após “até que” favorece uma sequência temporal, mas sem acrescentar uma causalidade teológica.
- issue: Sentido de ἀναστήσω
  choice: os levantarei
  alternative: os ressuscitarei
  rationale: “Levantarei” preserva o verbo e a imagem do grego, permitindo que a menção aos túmulos comunique a ressurreição sem explicitação interpretativa adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A citação mantém o paralelismo e a tensão escatológica do original.
