source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: Essa bem-aventurança veio sobre os escolhidos por Deus por meio de Jesus, o Messias, nosso Senhor, a quem seja a glória para todo o sempre. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: bem-aventurança
  rationale: Expressa o estado ou a condição de ser considerado feliz e abençoado, preservando o substantivo abstrato do grego com linguagem bíblica reconhecível em português.
- source_word: ἐγένετο ἐπί
  choice: veio sobre
  rationale: Mantém a imagem e a construção relacional do grego sem acrescentar um conector lógico ausente no texto.
- source_word: ἐκλελεγμένους
  choice: escolhidos
  rationale: Traduz naturalmente o particípio perfeito passivo e conserva a ação de Deus explicitada pelo agente ὑπὸ τοῦ θεοῦ.
- source_word: διά
  choice: por meio de
  rationale: Conserva o sentido instrumental ou mediador da preposição com genitivo.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Representa o título grego Χριστός pelo seu sentido em português, evitando tratá-lo apenas como nome próprio.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente idiomático, solene e corrente da fórmula grega de duração eterna.
theological_decisions:
- issue: Referente de ᾧ na doxologia
  choice: ao qual
  alternative: a quem
  rationale: O pronome relativo grego pode remeter naturalmente a Jesus, o Messias, o antecedente mais próximo, embora Deus também esteja presente na frase. A formulação conserva o relativo sem substituir seu referente por um nome e sem resolver além da gramática a possível tensão referencial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência litúrgica moderada. Não se acrescentou “então” ou outro conector, pois não há partícula correspondente no grego. A expressão “bem-aventurança” foi mantida por sua precisão, apesar de ser mais elevada que “bênção”.
