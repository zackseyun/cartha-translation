    rationale: ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ conserva uma relação genitiva cuja nuance exata não precisa ser resolvida como uma ação pela qual o Reino vem visitar. A nota pode explicar o alcance de ἐπισκοπή sem fixar essa paráfrase.
