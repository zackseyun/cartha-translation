revisions:
- from: Todas as gerações, desde Adão até o dia de hoje, passaram; mas os que foram aperfeiçoados no amor, segundo a graça de Deus, têm lugar entre os piedosos, os quais serão manifestados na visitação[a] do Reino do Messias.
  to: Todas as gerações, desde Adão até o presente dia, passaram; mas os que foram aperfeiçoados no amor, segundo a graça de Deus, têm lugar entre os piedosos, os quais serão manifestados na visitação[a] do Reino do Messias.
  rationale: A única revisão necessária é a nota, para preservar a ambiguidade da construção grega e evitar a sugestão adicional de que o Reino «vem para visitar». «Até o presente dia» também aproxima discretamente a formulação portuguesa do demonstrativo enfático do original, sem prejudicar a fluência.
