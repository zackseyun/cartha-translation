id: 1CLEM.50.3
reference: 1 Clement 50:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: pt
  text: Todas as gerações, desde Adão até o presente dia, passaram; mas os que foram aperfeiçoados no amor, segundo a graça de Deus, têm lugar entre os piedosos, os quais serão manifestados na visitação[a] do Reino do Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode envolver as ideias de inspeção, cuidado ou juízo.
    reason: Explica a amplitude semântica de ἐπισκοπή sem impor uma paráfrase interpretativa à relação entre a visitação e o Reino.
lexical_decisions:
- source_word: παρῆλθον
  choice: passaram
  rationale: Expressa de modo natural e direto que as gerações anteriores chegaram ao fim, sem acrescentar uma explicação sobre a morte.
- source_word: ἐν ἀγάπῃ τελειωθέντες
  choice: aperfeiçoados no amor
  rationale: Mantém a forma passiva e a ideia de terem alcançado maturidade ou plenitude no âmbito do amor.
- source_word: χῶρον εὐσεβῶν
  choice: lugar entre os piedosos
  rationale: Traduz a construção de modo idiomático, preservando a noção de participação no lugar destinado aos que vivem em reverência a Deus.
- source_word: ἐπισκοπῇ
  choice: visitação
  rationale: Preserva o sentido tradicional de uma intervenção ou vinda para inspeção, cuidado ou juízo, sem limitar antecipadamente sua nuance.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Representa o título grego Christos por seu sentido, 'Ungido/Messias', em conformidade com a terminologia adotada, sem tratá-lo automaticamente como nome próprio.
theological_decisions:
- issue: Referente de οἳ ('os quais')
  choice: 'Mantida a oração relativa: ''os quais serão manifestados'''
  alternative: “e eles serão manifestados” ou “e os piedosos serão manifestados”
  rationale: A forma relativa conserva a estrutura grega e não força uma distinção entre os aperfeiçoados no amor e os piedosos; no contexto, os grupos se sobrepõem, mas a sintaxe não deve ser explicitada além do necessário.
- issue: Sentido escatológico de ἐπισκοπή
  choice: “na visitação do Reino do Messias”
  alternative: “quando vier o Reino do Messias” ou “na inspeção do Reino do Messias”
  rationale: A tradução mantém a tensão entre visita, supervisão e intervenção escatológica, sem converter a expressão em uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e solene. A pontuação facilita a leitura sem alterar a longa estrutura argumentativa do grego; “piedosos” preserva o tom religioso sem recorrer a vocabulário denominacional.
