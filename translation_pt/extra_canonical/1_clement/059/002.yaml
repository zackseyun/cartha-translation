id: 1CLEM.59.2
reference: 1 Clement 59:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: pt
  text: Nós, porém, estaremos livres desta culpa e pediremos, fazendo fervorosa oração e súplica, que o Criador de todas as coisas preserve intacto o número já contado dos seus eleitos em todo o mundo, por meio do seu amado servo[a], Jesus Cristo. Por meio dele, Deus nos chamou das trevas para a luz, da ignorância para o conhecimento da glória do seu nome,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filho amado”.'
    reason: O grego παῖς pode significar tanto “servo” quanto “filho/criança”; neste contexto, “servo” provavelmente evoca o Servo do Senhor.
lexical_decisions:
- source_word: ἀθῷοι ... ἀπὸ ταύτης τῆς ἁμαρτίας
  choice: livres desta culpa
  rationale: Expressa a ideia de não ser responsabilizado por este pecado, de modo natural em português, sem enfraquecer a linguagem moral do original.
- source_word: ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν
  choice: fervorosa oração e súplica
  rationale: Preserva a intensidade de ἐκτενής e a duplicação retórica de dois termos próximos para petição religiosa.
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: o número já contado
  rationale: Mantém a formulação marcada do grego, evitando interpretar o número como predeterminado, completo ou fixado.
- source_word: ἄθραυστον
  choice: intacto
  rationale: Comunica a ideia de algo não rompido, não diminuído ou preservado em sua integridade.
- source_word: παιδὸς
  choice: servo
  rationale: No contexto litúrgico e bíblico, remete naturalmente ao Servo do Senhor; a ambiguidade lexical com 'filho/criança' é preservada em nota.
- source_word: ἐπίγνωσιν
  choice: conhecimento
  rationale: Evita intensificar o termo como 'pleno conhecimento' e mantém a contraposição direta com 'ignorância'.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo
  alternative: filho
  rationale: A leitura 'servo' preserva a ressonância das tradições do Servo do Senhor e o registro litúrgico cristão primitivo, enquanto a nota registra a ambiguidade real do vocábulo.
- issue: Agente de ἐκάλεσεν
  choice: Deus nos chamou
  alternative: ele nos chamou
  rationale: O pronome grego retoma naturalmente Deus, referido como Criador; explicitar 'Deus' evita em português a leitura equivocada de que Jesus seja o antecedente imediato, sem alterar o referente.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de oração. Conservou-se a formulação incomum “o número já contado” para não substituir a imagem do original por uma conclusão teológica mais específica. A frase termina com vírgula porque o trecho fornecido continua no versículo/contexto subsequente.
