source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: pt
  text: Mas, se alguns desobedecerem ao que ele disse por meio de nós, saibam que se enredarão em transgressão e em perigo não pequeno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: desobedecerem
  rationale: Expressa diretamente a recusa em acatar o que foi dito, preservando o sentido do verbo grego.
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: ao que foi dito por ele por meio de nós
  rationale: Mantém claramente tanto a agência última de 'ele' quanto a mediação de 'nós', sem explicitar uma identidade que o texto não nomeia neste versículo.
- source_word: παραπτώσει
  choice: transgressão
  rationale: Conserva o caráter moral da falta indicado pelo substantivo grego, com linguagem digna e corrente.
- source_word: ἐνδήσουσιν
  choice: se prenderão
  rationale: Preserva a imagem de envolver ou atar a si mesmos, bem como a responsabilidade reflexiva indicada por ἑαυτούς.
- source_word: κινδύνῳ οὐ μικρῷ
  choice: em perigo nada pequeno
  rationale: Reproduz a litotes grega em vez de convertê-la simplesmente em 'grande perigo', preservando a ênfase retórica do original.
theological_decisions:
- issue: Identidade do agente em ὑπ᾽ αὐτοῦ ('por ele')
  choice: Manter o pronome 'ele' sem identificação adicional
  alternative: Explicitar 'Deus' ou outra referência inferida do contexto
  rationale: O versículo emprega apenas o pronome; explicitar seu referente resolveria uma referência contextual que o texto imediato deixa implícita.
- issue: Natureza da consequência anunciada
  choice: Traduzir como autorenvolvimento em 'transgressão' e 'perigo'
  alternative: Interpretar como condenação ou castigo divino explícito
  rationale: O grego afirma que os desobedientes prenderão a si mesmos nessa condição, sem nomear aqui uma forma específica de juízo.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do grego sem artificialidade excessiva. A formulação 'perigo nada pequeno' preserva deliberadamente a litotes do original.
