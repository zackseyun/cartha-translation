language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: pt
  text: Pedimos-te, Soberano, que sejas nosso auxílio e protetor. Livra os que, entre nós, estão em aflição; tem misericórdia dos humildes; levanta os caídos; manifesta-te aos necessitados; cura os fracos; faz voltar os que, em teu povo, andam desviados. Alimenta os famintos; resgata os nossos prisioneiros; reergue os enfermos; anima os desalentados. Que todas as nações saibam que só tu és Deus, que Jesus Messias é teu servo[a] e que nós somos teu povo e as ovelhas do teu pasto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega também pode significar «filho» ou «criança».
    reason: Preserva a amplitude semântica de παῖς, que neste contexto pode ser entendido como «servo» e também admite sentido filial.
lexical_decisions:
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade suprema no contexto de oração sem a possível conotação moderna e negativa de «déspota».
- source_word: βοηθὸν ... καὶ ἀντιλήμπτορα
  choice: auxílio e protetor
  rationale: 'Reproduz os dois papéis complementares: aquele que socorre e aquele que sustém ou protege.'
- source_word: ἐπιφάνηθι
  choice: manifesta-te
  rationale: Conserva a ideia de tornar-se visivelmente presente em favor dos necessitados, em linguagem natural de oração.
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου
  choice: os que, em teu povo, andam desviados
  rationale: Trata o particípio como referência a pessoas, não a uma abstração, e relaciona essas pessoas ao povo de Deus sem sugerir categoricamente que já deixaram de pertencer a ele.
- source_word: λύτρωσαι
  choice: resgata
  rationale: Comunica libertação mediante resgate e se ajusta ao objeto «prisioneiros».
- source_word: τοὺς ὀλιγοψυχούντας
  choice: os desalentados
  rationale: Expressa os que perderam o ânimo ou estão abatidos, de modo claro e corrente.
- source_word: νομῆς
  choice: pasto
  rationale: Mantém a metáfora pastoral tradicional e inteligível do lugar onde o rebanho é alimentado.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo, com nota sobre a amplitude semântica
  alternative: filho
  rationale: No contexto antigo e na linguagem bíblica, παῖς pode designar o servo escolhido de Deus, mas também admite o sentido de filho/criança. O texto principal segue a provável alusão ao Servo de Deus sem eliminar a ambiguidade lexical.
- issue: Forma de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Traduz o título grego pelo seu valor semântico, o Ungido, evitando tratá-lo apenas como nome próprio.
translation_notes:
  register: O texto usa português moderno, digno e amplamente compreensível, com cadência de oração coletiva. Emprega formas de segunda pessoa do singular coerentes com a invocação direta a Deus e pontuação que evidencia a sequência de súplicas.
