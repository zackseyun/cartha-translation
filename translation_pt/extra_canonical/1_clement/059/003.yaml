source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: pt
  text: 'esperar em teu nome, a fonte de toda a criação[a], pois abriste os olhos do nosso coração para que te conhecêssemos: tu, o único Altíssimo entre os mais altos, o Santo que repousa entre os santos[b]; tu, que humilhas a insolência dos orgulhosos, frustras os planos das nações, elevas os humildes e humilhas os exaltados, enriqueces e empobreces, matas, vivificas e fazes viver; o único benfeitor dos espíritos e Deus de toda carne; tu, que contemplas as profundezas, observas as obras humanas, socorres os que estão em perigo, salvas os que perderam a esperança e és o Criador e Guardião de todo espírito; tu, que multiplicas as nações sobre a terra e, dentre todas elas, escolhes os que te amam por meio de Jesus Messias, teu Servo amado[c], por meio de quem nos instruíste, santificaste e honraste.


    [a] Ou: “em teu nome, do qual toda a criação primeiro procedeu”.


    [b] Ou: “nas coisas santas”. O grego permite entender a expressão como referência a pessoas santas ou a realidades santas.


    [c] A palavra grega também pode significar “Filho” ou “criança”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em teu nome, do qual toda a criação primeiro procedeu”.'
    reason: Preserva a construção incomum de ἀρχέγονον com ὄνομα e a possibilidade de entender o nome como origem primordial da criação.
  - marker: b
    text: 'Ou: “nas coisas santas”. O grego permite entender a expressão como referência a pessoas santas ou a realidades santas.'
    reason: ἁγίοις pode ser dativo plural masculino ou neutro.
  - marker: c
    text: A palavra grega também pode significar “Filho” ou “criança”.
    reason: παῖς abrange os sentidos de servo e filho/criança, com relevância particular em sua aplicação a Jesus.
lexical_decisions:
- source_word: ἀρχέγονον πάσης κτίσεως ὄνομά σου
  choice: teu nome, a fonte de toda a criação
  rationale: Expressa em português corrente a ideia de origem ou primazia contida em ἀρχέγονον, mantendo em nota uma leitura mais próxima da construção grega e sua ambiguidade.
- source_word: ὕψιστον ἐν ὑψίστοις
  choice: o único Altíssimo entre os mais altos
  rationale: Preserva a construção comparativa e incomum do grego sem reduzi-la simplesmente a “nas alturas”.
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  choice: o Santo que repousa entre os santos
  rationale: Trata ἅγιον como título substantivado e ἁγίοις como referência pessoal; a possível leitura neutra é registrada em nota.
- source_word: ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: vivificas e fazes viver
  rationale: Mantém os dois membros coordenados do texto grego, apesar da aparente redundância, em vez de omitir um deles.
- source_word: ἐπίσκοπον
  choice: Guardião
  rationale: No contexto da atuação divina, comunica supervisão e cuidado sem importar o título eclesiástico moderno “bispo”.
- source_word: παιδός
  choice: Servo
  rationale: “Servo” se ajusta ao uso cristológico de παῖς e ao registro da oração, enquanto a polissemia do termo é indicada em nota.
- source_word: ἐπαίδευσας
  choice: instruíste
  rationale: Representa a ideia de formação e ensino sem sugerir necessariamente punição ou disciplina corretiva.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: Servo
  alternative: Filho ou criança
  rationale: O substantivo grego é genuinamente polissêmico. A tradução principal mantém a leitura de servo, comum em linguagem bíblica sobre o enviado de Deus, e a nota evita excluir a leitura filial.
- issue: Identidade dos ἅγιοι entre os quais Deus repousa
  choice: os santos
  alternative: as coisas santas ou os lugares santos
  rationale: A forma dativa plural pode ser masculina ou neutra. A tradução principal segue a leitura pessoal mais imediata, mas a nota preserva a ambiguidade gramatical.
- issue: Título Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Traduz o valor titular de Χριστός em vez de tratá-lo apenas como nome próprio, sem acrescentar uma definição denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “tu” coerente com a oração e formas verbais transparentes ao leitor brasileiro. A longa sequência de qualificações divinas foi preservada, mas pontuada com dois-pontos e pontos e vírgulas para clareza. Mantiveram-se a repetição enfática de “tu, que” e a tríade “matas, vivificas e fazes viver” por refletirem a estrutura retórica do grego.
