    issue: «dentre todos» para ἐκ πάντων
    rationale: O antecedente imediato e natural é ἔθνη («nações»), que é neutro plural em grego. «Dentre todas elas» preserva a referência às nações e elimina a alteração de gênero e a ambiguidade introduzida por «todos».
  - severity: low
    issue: «supervisionas as obras humanas» para ἐπόπτην ἀνθρωπίνων ἔργων
    rationale: ἐπόπτης designa sobretudo quem observa, vigia ou inspeciona. «Supervisionas» é possível, mas sugere gestão administrativa; «observas» é mais direto e fiel.
