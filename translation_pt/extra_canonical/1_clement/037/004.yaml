id: 1CLEM.37.4
reference: 1 Clement 37:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: pt
  text: Os grandes não podem existir sem os pequenos, nem os pequenos sem os grandes. Há, em todas as coisas, certa combinação, e nelas há utilidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «e nestes há utilidade». O pronome plural pode apontar para «todas as coisas» ou para os grandes e os pequenos.
    reason: Preserva a forma plural e a possível ambiguidade do referente em ἐν τούτοις.
lexical_decisions:
- source_word: σύγκρασίς
  choice: combinação
  rationale: Expressa a ideia de elementos distintos reunidos e ajustados entre si, sem sugerir que percam sua identidade, como poderia ocorrer com «mistura».
- source_word: χρῆσις
  choice: utilidade
  rationale: Neste contexto, indica o proveito ou a função resultante dessa combinação; «utilidade» reproduz de modo claro o sentido do substantivo grego.
- source_word: εἶναι
  choice: existir
  rationale: Mantém a formulação ampla do grego e comunica naturalmente que grandes e pequenos não podem existir de maneira independente uns dos outros.
theological_decisions:
- issue: Relação entre os grandes e os pequenos
  choice: Manter a afirmação de interdependência sem especificar grupos ou funções eclesiásticas
  alternative: Identificar os «grandes» e os «pequenos» com líderes e membros subordinados
  rationale: O versículo usa categorias gerais e não explicita aqui uma identificação institucional; especificá-la importaria uma interpretação para o texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela na primeira frase. «Certa combinação» preserva a relativa indeterminação de σύγκρασίς τις; a nota registra a ambiguidade referencial da expressão final.
