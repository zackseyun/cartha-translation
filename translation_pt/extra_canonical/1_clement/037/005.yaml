id: 1CLEM.37.5
reference: 1 Clement 37:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: pt
  text: 'Tomemos o nosso corpo como exemplo: a cabeça nada é sem os pés, e também os pés nada são sem a cabeça. Até os menores membros do nosso corpo são necessários e úteis ao corpo inteiro. Mas todos respiram juntos[a] e praticam uma mesma submissão[b], para que o corpo inteiro seja preservado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cooperam em harmonia”. O grego diz literalmente “respiram juntos”.'
    reason: A forma verbal preserva uma imagem corporal concreta, mas pode também ter sentido figurado de agir em consonância.
  - marker: b
    text: Isto é, todos exercem uma submissão comum.
    reason: A construção grega emprega o verbo “usar” com o substantivo abstrato “submissão”, idiomaticamente no sentido de praticá-la ou exercê-la.
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: Tomemos o nosso corpo como exemplo
  rationale: O imperativo exortativo pede que o corpo seja tomado para consideração; “como exemplo” explicita naturalmente a função da expressão sem alterar o argumento.
- source_word: δίχα
  choice: sem
  rationale: 'Expressa de modo corrente a ideia de separação ou independência: a cabeça não tem valor isolada dos pés, nem estes da cabeça.'
- source_word: ἐλάχιστα μέλη
  choice: os menores membros
  rationale: Preserva o superlativo e a metáfora corporal; “membros” é claro e mantém a terminologia do texto.
- source_word: συνεπνεῖ
  choice: respiram juntos
  rationale: Mantém a imagem concreta e incomum de “respirar conjuntamente”, sem substituí-la silenciosamente pela interpretação figurada de cooperação harmoniosa.
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: praticam uma mesma submissão
  rationale: χράομαι com substantivo abstrato pode indicar exercer ou praticar uma qualidade. “Uma mesma” comunica a unidade indicada por μιᾷ sem sugerir necessariamente apenas uma ocorrência.
- source_word: εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα
  choice: para que o corpo inteiro seja preservado
  rationale: Reproduz a finalidade e o sentido passivo de σώζεσθαι no contexto da conservação do corpo como um todo.
theological_decisions:
- issue: Natureza da submissão comum dos membros
  choice: praticam uma mesma submissão
  alternative: submetem-se a uma única autoridade
  rationale: O grego menciona ὑποταγή, mas não identifica explicitamente a quem ou a quê se presta a submissão. A tradução evita introduzir uma autoridade não nomeada e conserva a tensão da formulação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela entre cabeça e pés foi preservada, assim como a metáfora corporal de respirar em conjunto. As notas registram as principais possibilidades sem sobrecarregar o texto.
