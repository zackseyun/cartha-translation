lexical_decisions:
- source_word: Στρατευώμεθα
  choice: sirvamos como soldados
  rationale: Preserva a metáfora militar e a força exortativa do subjuntivo, em português natural.
- source_word: ἄνδρες ἀδελφοί
  choice: irmãos
  rationale: Forma vocativa natural e inclusiva no contexto comunitário; a tradução literal «homens irmãos» seria pouco idiomática.
- source_word: μετὰ πάσης ἐκτενείας
  choice: com toda a dedicação
  rationale: Expressa empenho intenso e constante sem recorrer ao menos claro «fervor».
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: sob as ordens irrepreensíveis dele
  rationale: No contexto militar, «sob as ordens» comunica naturalmente a esfera de serviço; «irrepreensíveis» preserva o sentido de ἀμώμοις.
