id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: pt
  text: Nem todos são prefeitos, nem tribunos, nem centuriões, nem comandantes de cinquenta, nem os demais, em sequência; mas cada um, em sua própria posição, cumpre as ordens dadas pelo rei e pelos líderes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  choice: prefeitos
  rationale: Equivalente formal adequado para oficiais de alta patente, preservando a terminologia militar e administrativa antiga.
- source_word: χιλίαρχοι
  choice: tribunos
  rationale: No contexto militar greco-romano, designa oficiais associados ao comando de uma unidade numerosa; «tribunos» é uma forma histórica natural em português.
- source_word: ἑκατόνταρχοι
  choice: centuriões
  rationale: Termo português estabelecido para comandantes de uma centúria.
- source_word: πεντηκόνταρχοι
  choice: comandantes de cinquenta
  rationale: Tradução transparente da composição grega, sem introduzir um título técnico português pouco conhecido.
- source_word: τὸ καθεξῆς
  choice: ocupam os postos seguintes na hierarquia
  rationale: Expressa substantivamente aquilo que segue em ordem na sequência descendente de patentes, evitando o pouco natural «e assim por diante em ordem».
- source_word: τάγματι
  choice: posição
  rationale: No contexto da organização militar, indica o lugar ou posto atribuído a cada pessoa. «Posição» é natural e não restringe indevidamente o sentido a uma patente oficial.
- source_word: ἐπιτασσόμενα
  choice: as ordens dadas
  rationale: Verte com clareza aquilo que é ordenado ou determinado por superiores.
- source_word: βασιλέως
  choice: rei
  rationale: Correspondência direta e não interpretativa do termo grego.
- source_word: ἡγουμένων
  choice: líderes
  rationale: Preserva o sentido amplo de pessoas que dirigem ou comandam, sem impor um título militar que o grego não explicita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com terminologia histórica reconhecível. A estrutura contrastiva foi preservada; «cada um, porém» torna natural em português a oposição marcada por ἀλλά. Não há necessidade de nota textual ou explicativa.
