source:
  edition: Funk 1901 (normalized OCR)
  text: κατανοήσωμεν τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν, πῶς εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως ἐπιτελοῦσιν τὰ διατασσόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: pt
  text: 'Consideremos os que servem como soldados sob nossos comandantes: com quanta ordem, com quanta obediência[a] e com quanta submissão cumprem o que lhes é ordenado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com quanta disposição para ceder”.
    reason: εἰκτικῶς pode destacar aquiescência ou disposição para ceder, além da obediência no sentido geral.
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: Consideremos
  rationale: Expressa a exortação deliberativa do aoristo subjuntivo e o sentido de observar com atenção.
- source_word: τοὺς στρατευομένους
  choice: os que servem como soldados
  rationale: Preserva o sentido verbal do particípio, sem reduzi-lo simplesmente ao substantivo “soldados”.
- source_word: τοῖς ἡγουμένοις ἡμῶν
  choice: sob nossos comandantes
  rationale: No contexto militar, ἡγούμενοι designa os que exercem comando; “sob” torna natural em português a relação de subordinação.
- source_word: εὐτάκτως
  choice: com quanta ordem
  rationale: Comunica atuação ordenada e disciplinada, mantendo o paralelismo retórico com os dois advérbios seguintes.
- source_word: εἰκτικῶς
  choice: com quanta obediência
  rationale: No contexto, indica uma atitude dócil, aquiescente e pronta a ceder à autoridade; “obediência” é a formulação portuguesa mais clara.
- source_word: ὑποτεταγμένως
  choice: com quanta submissão
  rationale: Conserva a ideia explícita de sujeição hierárquica e distingue este termo da obediência expressa pelo anterior.
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: cumprem o que lhes é ordenado
  rationale: Reproduz de modo natural tanto a execução completa quanto o caráter passivo das determinações recebidas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “com quanta” preserva a tríade enfática do grego sem recorrer aos advérbios pouco naturais “ordeiramente, obedientemente, submissamente”.
