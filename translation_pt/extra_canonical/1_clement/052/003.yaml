source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: pt
  text: 'E novamente ele diz: “Ofereça a Deus um sacrifício de louvor e cumpra os seus votos ao Altíssimo; invoque-me no dia da sua aflição, e eu o livrarei, e você me glorificará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον ... θυσίαν αἰνέσεως
  choice: Ofereça ... um sacrifício de louvor
  rationale: Preserva a linguagem sacrificial e a repetição etimológica do grego de modo natural em português.
- source_word: ἀπόδος ... τὰς εὐχάς σου
  choice: cumpra os seus votos
  rationale: No contexto cultual, εὐχαί designa votos feitos a Deus, e ἀποδίδω expressa o ato de cumpri-los, não simplesmente fazer orações.
- source_word: ἐπικαλέσαι με
  choice: invoque-me
  rationale: Transmite o apelo dirigido a Deus em situação de aflição, mantendo o registro solene.
- source_word: ἐξελοῦμαί σε
  choice: eu o livrarei
  rationale: Expressa libertação ou resgate; a construção com “o” conserva o objeto singular sem acrescentar a natureza do perigo.
theological_decisions:
- issue: Identidade do sujeito divino dentro da citação
  choice: Manter a primeira pessoa em “invoque-me”, “eu o livrarei” e “você me glorificará”
  alternative: Substituir os pronomes por referências explícitas a Deus
  rationale: O grego apresenta a fala divina diretamente e deixa que o contexto identifique o referente; explicitar o nome alteraria a forma da citação.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento de ampla legibilidade brasileira. O paralelismo da citação foi preservado, e o ponto e vírgula organiza suas duas partes sem enfraquecer a sequência dos imperativos e promessas.
