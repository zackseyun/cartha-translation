source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀπροσδεής, ἀδελφοί, ὁ δεσπότης ὑπάρχει τῶν ἁπάντων· οὐδενὸς οὐδὲν χρῄζει εἰ μὴ τὸ ἐξομολογεῖσθαι αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: pt
  text: O Soberano de todos, irmãos, não tem necessidade alguma; não precisa de nada de ninguém, a não ser que lhe prestem reconhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe façam confissão”; o termo grego também pode indicar ação de graças ou louvor.
    reason: O verbo ἐξομολογεῖσθαι possui amplitude contextual e não especifica aqui, por si só, se a confissão é reconhecimento, agradecimento ou louvor.
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: não tem necessidade alguma
  rationale: Reproduz de modo natural a ideia de não carecer de coisa alguma, sem ampliar o termo para uma formulação filosófica como “autossuficiente”.
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: O Soberano de todos
  rationale: “Soberano” comunica a autoridade de δεσπότης com dignidade e naturalidade; “de todos” conserva o alcance pessoal e universal do grego.
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: não precisa de nada de ninguém
  rationale: 'Mantém os dois indefinidos negativos do grego: nenhuma coisa é necessária, proveniente de nenhuma pessoa.'
- source_word: τὸ ἐξομολογεῖσθαι αὐτῷ
  choice: que lhe prestem reconhecimento
  rationale: Expressa o ato dirigido a Deus de reconhecê-lo abertamente, preservando no rodapé a amplitude semântica que inclui confissão, ação de graças e louvor.
theological_decisions:
- issue: Sentido de ἐξομολογεῖσθαι no ato dirigido a Deus
  choice: lhe prestem reconhecimento
  alternative: lhe façam confissão; lhe rendam graças ou louvor
  rationale: O verbo pode designar confissão ou reconhecimento público e, em contextos de oração, ação de graças ou louvor. A tradução principal evita limitar indevidamente o sentido à confissão de pecados, enquanto a nota registra as possibilidades legítimas.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo enfático para representar as duas declarações gregas de que o Soberano nada necessita. “Irmãos” foi mantido como vocativo explícito.
