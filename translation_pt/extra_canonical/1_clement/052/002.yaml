id: 1CLEM.52.2
reference: 1 Clement 52:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: pt
  text: 'Pois Davi, o escolhido, diz: “Darei graças ao Senhor, e isso lhe agradará mais do que um novilho com chifres e cascos.[a] Que os pobres vejam e se alegrem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um novilho que está desenvolvendo chifres e cascos”.'
    reason: O particípio ἐκφέροντα significa literalmente “fazendo despontar”, “produzindo” ou “desenvolvendo”; a tradução principal usa uma formulação portuguesa mais natural.
lexical_decisions:
- source_word: ὁ ἐκλεκτὸς Δαυίδ
  choice: Davi, o escolhido
  rationale: Mantém o título aplicado a Davi e soa natural em português, sem transformar ἐκλεκτός em uma afirmação teológica mais específica.
- source_word: Ἐξομολογήσομαι
  choice: Darei graças
  rationale: Neste contexto de louvor, e no texto do salmo citado, o verbo expressa agradecimento ou louvor público, não confissão de pecado.
- source_word: ὑπὲρ μόσχον νέον
  choice: mais do que um novilho
  rationale: 'ὑπέρ introduz a comparação de superioridade: a ação de graças agrada mais ao Senhor do que o sacrifício do animal jovem.'
- source_word: κέρατα ἐκφέροντα καὶ ὁπλάς
  choice: com chifres e cascos
  rationale: Expressa naturalmente a imagem de um novilho já provido das partes que indicam maturidade, enquanto a nota registra de modo mais explícito a força do particípio.
- source_word: πτωχοὶ
  choice: os pobres
  rationale: Equivalente direto que preserva a possível dimensão tanto material quanto social do termo, sem restringi-lo a uma interpretação espiritual.
- source_word: εὐφρανθήτωσαν
  choice: se alegrem
  rationale: Reproduz o imperativo de alegria em português corrente e digno.
theological_decisions:
- issue: Sentido de Ἐξομολογήσομαι na citação do salmo
  choice: Darei graças
  alternative: Confessarei / Louvarei
  rationale: O paralelismo com uma oferta agradável a Deus favorece agradecimento ou louvor. “Confessarei” seria formalmente possível, mas em português moderno sugeriria sobretudo confissão de pecado, sentido não exigido aqui.
- issue: Relação entre ação de graças e sacrifício
  choice: lhe agradará mais do que
  alternative: lhe agradará acima de
  rationale: A comparação é preservada sem sugerir que o texto rejeite todo sacrifício; afirma-se apenas a superioridade da ação de graças neste enunciado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para “Davi, o escolhido”, e a citação conserva o tom bíblico sem arcaísmos desnecessários.
