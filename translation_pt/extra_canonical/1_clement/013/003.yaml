  revision_rationale: A revisão substitui a paráfrase pesada por «suas palavras santas», expressão portuguesa natural que permanece dentro do campo semântico de ἁγιοπρεπής. Também torna mais explícita a relação entre «andar» e «ser obediente» e evita a adição interpretativa de «coração».
