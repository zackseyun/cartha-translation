source:
  edition: Funk 1901 (normalized OCR)
  text: ταύτῃ τῇ ἐντολῇ καὶ τοῖς παραγγέλμασι τούτοις στηρίξωμεν ἑαυτοὺς εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας τοῖς ἁγιοπρεπέσι λόγοις αὐτοῦ, ταπεινοφρονοῦντες· φησὶν γὰρ ὁ ἅγιος λόγος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: pt
  text: 'Por este mandamento e estas instruções, fortaleçamo-nos para andarmos obedientes às suas palavras santas[a], sendo humildes. Pois a palavra santa diz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «às suas palavras próprias da santidade».'
    reason: Indica uma tradução mais explícita de ἁγιοπρεπέσι, «condizente com a santidade», sem dividir o adjetivo composto em dois atributos.
lexical_decisions:
- source_word: παραγγέλμασι
  choice: instruções
  rationale: Expressa orientações dadas com autoridade, em paralelo com «mandamento», sem recorrer ao menos natural «injunções».
- source_word: στηρίξωμεν ἑαυτούς
  choice: fortaleçamo-nos
  rationale: Preserva a exortação reflexiva e o sentido de firmar ou fortalecer a si mesmos.
- source_word: εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας
  choice: para caminhar em obediência
  rationale: Reproduz de modo natural tanto a ideia de conduta figurada em πορεύεσθαι quanto o estado de ser obediente em ὑπηκόους ὄντας.
- source_word: ἁγιοπρεπέσι λόγοις
  choice: palavras dele que condizem com a santidade
  rationale: Mantém o valor do composto ἁγιοπρεπής, isto é, apropriado ou condizente com a santidade, em vez de dividi-lo em dois atributos independentes.
- source_word: ταπεινοφρονοῦντες
  choice: com humildade de coração
  rationale: Comunica a disposição interior de pensar e portar-se humildemente em português corrente e digno.
- source_word: ὁ ἅγιος λόγος
  choice: a palavra santa
  rationale: Mantém a formulação singular e solene que introduz a citação seguinte.
theological_decisions:
- issue: Sentido de ἁγιοπρεπής
  choice: que condizem com a santidade
  alternative: santas
  rationale: A tradução explícita preserva a nuance de algo apropriado à santidade; a alternativa é natural, mas semanticamente mais geral.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira; tom exortativo, comunitário e digno. A sintaxe foi levemente descompactada para soar natural sem apagar as relações do grego.
