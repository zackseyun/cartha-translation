  text: Ἐπὶ τίνα ἐπιβλέψω, ἀλλ’ ἢ ἐπὶ τὸν πρᾶον καὶ ἡσύχιον καὶ τρέμοντά μου τὰ λόγια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: pt
  text: “Para quem olharei[a], senão para aquele que é manso e tranquilo e treme diante das minhas palavras?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Para quem voltarei o olhar”.'
    reason: A nota preserva a nuance direcional de ἐπιβλέψω, que pode significar olhar para ou voltar o olhar para alguém.
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: olharei
  rationale: Reproduz de modo natural a ideia de dirigir o olhar para alguém, podendo também sugerir consideração favorável no contexto.
- source_word: πρᾶον
  choice: manso
  rationale: Equivalente corrente e digno para a disposição gentil, humilde e não agressiva indicada pelo termo.
- source_word: ἡσύχιον
  choice: tranquilo
  rationale: Expressa a qualidade serena e sossegada do adjetivo sem sugerir necessariamente silêncio absoluto.
- source_word: τρέμοντά μου τὰ λόγια
  choice: treme diante das minhas palavras
  rationale: A construção portuguesa com “diante de” comunica naturalmente temor reverente em reação às palavras, sem tornar explícita uma interpretação teológica além do grego.
theological_decisions:
- issue: Se os três qualificativos descrevem uma ou mais pessoas
  choice: 'uma só pessoa: “aquele que é manso e tranquilo e treme”'
  alternative: “o manso e tranquilo, e aquele que treme”
  rationale: Um único artigo, τὸν, rege os três elementos coordenados πρᾶον, ἡσύχιον e τρέμοντα, favorecendo claramente a referência a uma única pessoa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. “Manso”, “tranquilo” e “treme diante” mantêm o tom reverente e a unidade gramatical dos três qualificativos.
