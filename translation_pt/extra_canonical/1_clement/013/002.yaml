id: 1CLEM.13.2
reference: 1 Clement 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: pt
  text: 'Pois assim ele disse: “Sejam misericordiosos, para que recebam misericórdia. Perdoem, para que sejam perdoados. Assim como vocês fazem, assim também lhes será feito. Assim como dão, assim também lhes será dado. Assim como julgam, assim também serão julgados. Assim como tratam os outros com bondade, assim também serão tratados com bondade. Com a medida com que medem, com essa mesma medida lhes será medido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε
  choice: Sejam misericordiosos
  rationale: Expressa de modo natural o imperativo de exercer misericórdia, preservando a relação verbal com ἐλεηθῆτε.
- source_word: ἀφίετε
  choice: Perdoem
  rationale: No contexto de reciprocidade moral, o verbo significa conceder perdão; a forma imperativa plural é preservada.
- source_word: χρηστεύεσθε
  choice: tratam os outros com bondade
  rationale: O verbo raro indica agir com bondade ou benevolência. A formulação explicita naturalmente em português o caráter relacional da ação sem acrescentar uma doutrina específica.
- source_word: μέτρῳ
  choice: medida
  rationale: Mantém a imagem concreta do instrumento ou padrão de medição presente no grego e na tradição proverbial.
theological_decisions:
- issue: Reciprocidade entre a conduta humana e o tratamento recebido
  choice: Preservar todas as construções correlativas sem explicar quem executa as ações passivas
  alternative: 'Explicitar Deus como agente: “Deus fará a vocês”'
  rationale: O grego emprega passivos sem nomear o agente. Embora possam funcionar como passivos divinos, explicitar Deus resolveria uma ambiguidade que o texto mantém.
- issue: Sentido de ἀφεθῇ ὑμῖν
  choice: “para que sejam perdoados”
  alternative: “para que isso lhes seja perdoado”
  rationale: A construção passiva impessoal permite a formulação pessoal natural em português, sem especificar pecados, dívidas ou ofensas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A repetição retórica de “assim” foi preservada, mas com ordem sintática natural. Os passivos mantêm indeterminado o agente, como no grego.
