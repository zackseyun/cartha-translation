source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: pt
  text: 'Portanto, sejamos humildes, irmãos, deixando de lado toda arrogância, presunção, insensatez e acessos de ira. Façamos o que está escrito, pois o Espírito Santo diz: “Que o sábio não se glorie em sua sabedoria, nem o forte em sua força, nem o rico em sua riqueza; mas aquele que se gloria, glorie-se no Senhor, buscando-o e praticando o juízo e a justiça”. Especialmente, lembremo-nos das palavras do Senhor Jesus, proferidas quando ele ensinava a mansidão e a paciência.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: sejamos humildes
  rationale: Expressa de modo natural a exortação à humildade de pensamento e atitude, sem recorrer ao pouco corrente “pensemos humildemente”.
- source_word: τύφος
  choice: presunção
  rationale: Neste contexto, indica vaidade ou orgulho inflado; “presunção” distingue o termo de ἀλαζονεία, traduzido como “arrogância”.
- source_word: ὀργάς
  choice: acessos de ira
  rationale: O plural sugere manifestações ou explosões de ira, não apenas a emoção em abstrato.
- source_word: ποιεῖν κρίμα καὶ δικαιοσύνην
  choice: praticando o juízo e a justiça
  rationale: Mantém os dois substantivos coordenados e o caráter ético da expressão; “praticar” soa mais natural em português do que “fazer” neste contexto.
- source_word: ἐπιείκειαν καὶ μακροθυμίαν
  choice: mansidão e paciência
  rationale: Vocabulário atual e inteligível que comunica, respectivamente, brandura moderada e perseverança paciente diante de provocações.
theological_decisions:
- issue: Extensão das palavras atribuídas ao Espírito Santo
  choice: Incluir “buscando-o e praticando o juízo e a justiça” dentro da citação
  alternative: Encerrar a citação após “glorie-se no Senhor” e tratar a frase seguinte como comentário de Clemente
  rationale: A construção grega mantém toda a sequência como conteúdo dependente de “o Espírito Santo diz”; essa leitura também evita romper artificialmente a adaptação clementina da passagem bíblica.
- issue: Referente de αὐτόν em “buscando-o”
  choice: Preservar o pronome masculino singular com referência natural ao Senhor
  alternative: Explicitar “buscando o Senhor”
  rationale: A tradução conserva a forma pronominal e a coesão do grego sem acrescentar uma repetição interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe foi moderadamente simplificada em períodos claros, sem eliminar a solenidade exortativa nem a estrutura da citação.
