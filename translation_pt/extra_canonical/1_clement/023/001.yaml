id: 1CLEM.23.1
reference: 1 Clement 23:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: pt
  text: O Pai, compassivo em todos os aspectos e benfeitor, tem profunda ternura pelos que o temem e, com brandura e afabilidade, concede os seus favores aos que se aproximam dele com mente singela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτίρμων κατὰ πάντα
  choice: compassivo em tudo
  rationale: Preserva a abrangência de κατὰ πάντα e expressa οἰκτίρμων em linguagem natural e digna.
- source_word: εὐεργετικός
  choice: bondoso
  rationale: Comunica a disposição ativa de fazer o bem sem recorrer ao pouco natural «beneficente».
- source_word: ἔχει σπλάγχνα ἐπί
  choice: tem profunda ternura por
  rationale: O idioma visceral grego denota afeição compassiva; a formulação portuguesa mantém sua intensidade afetiva.
- source_word: φοβουμένους αὐτόν
  choice: os que o temem
  rationale: Mantém a linguagem tradicional e a amplitude semântica do temor reverente.
- source_word: ἠπίως τε καὶ προσηνῶς
  choice: com mansidão e bondade
  rationale: 'Distingue os dois advérbios: trato suave e disposição afável.'
- source_word: τὰς χάριτας αὐτοῦ
  choice: suas dádivas
  rationale: O plural indica favores ou dons concedidos; «dádivas» é claro e evita reduzir o termo a uma formulação doutrinária específica.
- source_word: ἀποδίδοι
  choice: concede
  rationale: No contexto, expressa a outorga dos favores do Pai; evita a ideia inadequada de pagamento merecido que «retribui» poderia sugerir.
- source_word: ἁπλῇ διανοίᾳ
  choice: com sinceridade de coração
  rationale: Traduz a ideia de disposição interior simples, íntegra e sem duplicidade em português corrente; «coração» torna natural a referência à interioridade de διάνοια.
theological_decisions:
- issue: Sentido de φοβεῖσθαι em relação a Deus
  choice: temem
  alternative: reverenciam
  rationale: «Temem» preserva a tensão e a linguagem religiosa do grego, sem limitar o conceito apenas a reverência.
- issue: Natureza das χάριτες concedidas
  choice: dádivas
  alternative: graças
  rationale: O plural pode designar favores ou dons; «dádivas» mantém o sentido amplo e não impõe uma leitura sacramental ou técnica.
- issue: Condição interior dos que se aproximam
  choice: sinceridade de coração
  alternative: mente sem duplicidade
  rationale: A escolha comunica integridade interior sem transformar a frase em uma condição doutrinária mais específica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue uma equivalência ótima: conserva os elementos teológicos e afetivos do grego, mas verte os idiomatismos em expressão portuguesa natural.'
