  to: 'Longe de nós esteja esta Escritura[a], onde se diz: “Infelizes são os que têm o ânimo dividido[b], os que duvidam no íntimo e dizem: ‘Ouvimos essas coisas já nos dias de nossos pais; e eis que estamos envelhecendo, e nada disso nos aconteceu.’”'
  rationale: Substituí “passagem da Escritura” por “esta Escritura”, sem a especificação interpretativa de “passagem”, e ajustei a nota correspondente. Também usei “onde se diz”, formulação direta para ὅπου λέγει, e “nos dias de nossos pais”, que traduz mais de perto ἐπὶ τῶν πατέρων ἡμῶν. O restante mantém o sentido e o registro do rascunho.
