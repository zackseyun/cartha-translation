id: 1CLEM.23.3
reference: 1 Clement 23:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: pt
  text: 'Longe de nós esteja esta Escritura[a], onde se diz: “Infelizes são os que têm o ânimo dividido[b], os que duvidam no íntimo e dizem: ‘Ouvimos essas coisas já nos dias de nossos pais; e eis que estamos envelhecendo, e nada disso nos aconteceu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que esta Escritura fique longe de nós”.'
    reason: Registra uma ordem mais natural em português corrente, mantendo o imperativo de terceira pessoa e o sentido do grego.
  - marker: b
    text: Literalmente, “os de alma dupla”.
    reason: Preserva para consulta a imagem lexical de δίψυχοι.
lexical_decisions:
- source_word: πόρρω γενέσθω ἀφ’ ἡμῶν
  choice: Que ... fique longe de nós
  rationale: Reproduz a força do imperativo grego de terceira pessoa em ordem natural no português.
- source_word: ἡ γραφὴ αὕτη
  choice: esta passagem da Escritura
  rationale: No contexto, γραφή introduz uma citação específica; “passagem da Escritura” comunica isso com naturalidade sem negar o sentido mais literal indicado em nota.
- source_word: ταλαίπωροι
  choice: infelizes
  rationale: Expressa a condição lamentável denunciada pelo termo, em registro digno e corrente; “desgraçados” poderia soar como insulto moderno.
- source_word: δίψυχοι
  choice: os que têm o ânimo dividido
  rationale: Conserva a imagem de duplicidade interior sem recorrer ao pouco natural “de alma dupla”; a tradução literal é registrada em nota.
- source_word: διατάζοντες τῇ ψυχῇ
  choice: os que duvidam em seu íntimo
  rationale: A forma fornecida parece refletir erro de OCR por διστάζοντες, leitura conhecida do texto e coerente com δίψυχοι; a camada inglesa auditada também confirma “doubt”. “Em seu íntimo” verte idiomaticamente τῇ ψυχῇ.
- source_word: γηράσκομεν
  choice: estamos envelhecendo
  rationale: Mantém o aspecto presente da forma grega fornecida, em vez de convertê-la em perfeito.
- source_word: οὐδὲν ἡμῖν τούτων συνέβηκεν
  choice: nada disso nos aconteceu
  rationale: Tradução direta e natural que conserva a alegação dos que não viram cumprir-se o que ouviram.
theological_decisions:
- issue: Afastamento da Escritura
  choice: “Que esta passagem da Escritura fique longe de nós”
  alternative: Entender como rejeição da autoridade da Escritura
  rationale: O contexto apresenta uma advertência contra assumir a postura condenada pela citação, não uma rejeição do texto sagrado; a formulação preserva a expressão grega sem explicitar além dela.
- issue: Demora aparente do cumprimento
  choice: Manter a queixa sem explicar ou harmonizar
  alternative: Acrescentar que o cumprimento ainda virá
  rationale: O versículo apenas cita a objeção dos que duvidam; qualquer resposta teológica pertence ao contexto posterior, não a esta frase.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe natural para leitores brasileiros. “Eis que” foi mantido por corresponder ao tom solene da citação, enquanto “em seu íntimo” evita uma construção artificial com “alma”.
