source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: pt
  text: Por isso, não sejamos de ânimo dividido[a], nem a nossa alma duvide quanto às suas dádivas extraordinárias e gloriosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não sejamos de alma dupla”.
    reason: Preserva a metáfora de διψυχῶμεν; “de ânimo dividido” expressa em português corrente a divisão interior implicada pelo termo.
lexical_decisions:
- source_word: διψυχῶμεν
  choice: não sejamos vacilantes
  rationale: O verbo descreve alguém dividido em sua disposição e, por consequência, hesitante ou inconstante. “Vacilantes” comunica o sentido idiomático em português, enquanto a nota preserva a imagem grega.
- source_word: ἐνδυλλιεσθω
  choice: fique ... em dúvida
  rationale: A forma transmitida parece ortograficamente instável ou corrompida, mas, no contexto, corresponde ao sentido de duvidar ou hesitar. A tradução evita repeti-la como mera divisão interior e mantém seu objeto introduzido por ἐπί.
- source_word: ὑπερβαλλούσαις
  choice: extraordinárias
  rationale: Expressa dádivas que excedem o comum ou se destacam grandemente, em linguagem natural e digna.
- source_word: δωρεαῖς
  choice: dádivas
  rationale: “Dádivas” conserva a ideia de presentes concedidos gratuitamente e se ajusta ao registro elevado da passagem.
theological_decisions:
- issue: A dúvida em relação às dádivas divinas
  choice: Manter a exortação sem especificar quais são as dádivas nem explicar a natureza da dúvida
  alternative: Identificar as dádivas com promessas específicas ou interpretar a dúvida segundo uma tradição doutrinária
  rationale: O versículo não define essas dádivas; explicitar seu conteúdo importaria uma interpretação não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e solene, com construção exortativa natural. “Nossa alma” foi mantido para representar ψυχή e preservar a personificação do original; “quanto às” traduz de modo fluente a relação com as dádivas.
