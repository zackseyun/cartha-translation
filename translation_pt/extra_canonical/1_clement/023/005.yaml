reference: 1 Clement 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: pt
  text: 'Na verdade, a vontade dele se cumprirá rapidamente e de repente, como também testemunha a Escritura: “Ele virá depressa e não demorará” e “Repentinamente, o Senhor virá ao seu templo, o Santo que vocês esperam”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: Na verdade
  rationale: Expressa a ênfase asseverativa do grego em português natural e digno.
- source_word: τελειωθήσεται τὸ θέλημα αὐτοῦ
  choice: a vontade dele se cumprirá
  rationale: O passivo de τελειόω indica que a vontade será levada à realização plena; “se cumprirá” preserva esse sentido com fluidez.
- source_word: ταχὺ καὶ ἐξαίφνης
  choice: rápida e repentinamente
  rationale: 'Mantém os dois aspectos distintos: rapidez e caráter súbito.'
- source_word: συνεπιμαρτυρούσης
  choice: como também testemunha
  rationale: Reproduz a ideia de testemunho confirmatório da Escritura sem tornar a frase pesada.
- source_word: ὁ ἅγιος
  choice: o Santo
  rationale: Conserva o substantivo titular do grego, sem explicitar uma identificação além do texto.
- source_word: προσδοκᾶτε
  choice: esperam
  rationale: Verbo corrente que comunica expectativa pela chegada de alguém.
theological_decisions:
- issue: Relação entre “o Senhor” e “o Santo” na segunda citação
  choice: “o Senhor virá ao seu templo, o Santo que vocês esperam”
  alternative: “o Senhor virá ao seu templo, e o Santo que vocês esperam”
  rationale: A tradução mantém a aposição provável entre os títulos e segue a leitura contextual, sem inserir “isto é” nem desenvolver uma identificação teológica não explicitada.
- issue: Referente do pronome em “a vontade dele”
  choice: Manter o pronome, sem nomear seu referente
  alternative: “a vontade de Deus”
  rationale: O grego traz αὐτοῦ; explicitar “Deus” resolveria uma referência que o versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. As citações permanecem integradas numa única frase, como no grego. Não há marcadores de nota porque nenhuma nota foi necessária.
