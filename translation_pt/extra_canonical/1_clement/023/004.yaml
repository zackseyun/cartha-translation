source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: pt
  text: 'Ó insensatos, comparem-se a uma árvore: tomem como exemplo uma videira. Primeiro, ela perde as folhas; depois surge um broto, depois uma folha, depois uma flor; depois disso aparecem a uva ainda verde e, em seguida, o cacho de uvas. Vejam que, em pouco tempo, o fruto da árvore chega à maturidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: insensatos
  rationale: Reproduz o vocativo de censura sem recorrer a uma expressão excessivamente coloquial ou ofensiva.
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  choice: comparem-se a uma árvore
  rationale: Mantém a ideia explícita de comparação; neste contexto, ξύλον designa uma planta lenhosa viva, não madeira como material.
- source_word: λάβετε ἄμπελον
  choice: tomem como exemplo uma videira
  rationale: Explicita de modo natural em português o uso ilustrativo de 'tomar' uma videira.
- source_word: φυλλορροεῖ
  choice: perde as folhas
  rationale: Expressa o sentido de queda ou desprendimento das folhas em linguagem corrente.
- source_word: βλαστός
  choice: broto
  rationale: Termo botânico comum e compreensível para o novo rebento da videira.
- source_word: ὄμφαξ
  choice: uva ainda verde
  rationale: Indica a uva não madura, preservando a progressão do desenvolvimento do fruto.
- source_word: σταφυλή
  choice: cacho de uvas
  rationale: Distingue o cacho da uva individual ainda verde mencionada anteriormente.
- source_word: εἰς πέπειρον καταντᾷ
  choice: chega à maturidade
  rationale: Reproduz diretamente a ideia de o fruto atingir o estado maduro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de ampla legibilidade brasileira. A sequência temporal do grego foi preservada, assim como o verbo plural que rege conjuntamente 'a uva ainda verde' e 'o cacho de uvas'. A nota inglesa herdada não foi mantida, pois registra uma formulação anterior, não uma variante textual ou ambiguidade relevante do grego.
