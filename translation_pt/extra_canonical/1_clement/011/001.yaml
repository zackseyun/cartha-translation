id: 1CLEM.11.1
reference: 1 Clement 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: pt
  text: Por causa da hospitalidade e da piedade, Ló foi salvo de Sodoma, quando toda a região ao redor foi julgada com fogo e enxofre. Com isso, o Soberano deixou claro que não abandona os que esperam nele, mas destina ao castigo e ao tormento os que se desviam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: hospitalidade
  rationale: Equivalente direto e natural, preservando a virtude destacada pelo autor.
- source_word: εὐσέβειαν
  choice: piedade
  rationale: Expressa devoção reverente e conduta religiosa, sem restringir o termo a mera moralidade.
- source_word: τῆς περιχώρου πάσης
  choice: toda a região ao redor
  rationale: Reproduz de modo claro o sentido espacial de toda a área circundante.
- source_word: ὁ δεσπότης
  choice: o Senhor
  rationale: No contexto, designa Deus como soberano; 'Senhor' é digno e natural em português, embora 'Soberano' também seja possível.
- source_word: τοὺς ἐλπίζοντας ἐπʼ αὐτὸν
  choice: os que esperam nele
  rationale: Preserva a ideia bíblica de confiança esperançosa dirigida a Deus.
- source_word: ἑτεροκλινεῖς
  choice: os que se desviam
  rationale: Comunica a ideia de inclinação ou afastamento para outro rumo sem acrescentar uma identificação doutrinária específica.
- source_word: κόλασιν καὶ αἰκισμὸν
  choice: castigo e tormento
  rationale: Mantém os dois substantivos e sua intensificação, distinguindo punição de sofrimento aflitivo.
theological_decisions:
- issue: Identidade e tradução de δεσπότης
  choice: o Senhor
  alternative: o Soberano
  rationale: O referente é Deus, apresentado como aquele que julga e preserva. 'Senhor' mantém a referência teológica e soa mais natural, sem eliminar a noção de autoridade soberana.
- issue: Força de τίθησιν em relação ao castigo
  choice: destina ao castigo e ao tormento
  alternative: coloca sob castigo e tormento
  rationale: O verbo indica pôr ou colocar; 'destina' comunica o resultado judicial sem especificar duração, mecanismo ou uma doutrina adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A tradução conserva o contraste entre os que esperam em Deus e os que se desviam, sem explicar além do texto.
