id: 1CLEM.11.2
reference: 1 Clement 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: pt
  text: Pois, quando a mulher dele saiu junto com ele, sendo de opinião diferente e não estando em concórdia, foi posta como sinal para isso[a], de modo que se tornou uma coluna de sal até o dia de hoje, para que todos saibam que os de ânimo dividido[b] e os que duvidam do poder de Deus se tornam juízo e advertência para todas as gerações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi estabelecida como sinal para este fim”.'
    reason: A expressão εἰς τοῦτο pode indicar tanto referência ao ocorrido quanto finalidade.
  - marker: b
    text: 'Literalmente: “os de alma dupla”.'
    reason: A nota preserva a imagem lexical de δίψυχοι, traduzida no texto por uma expressão portuguesa mais natural.
  - marker: c
    text: O grego também pode ser entendido como “se tornam condenação e sinal de advertência para todas as gerações”.
    reason: κρίμα pode indicar juízo ou condenação, e σημείωσις pode ressaltar a condição de sinal ou exemplo advertidor.
lexical_decisions:
- source_word: ἑτερογνώμονος
  choice: tendo uma disposição diferente
  rationale: Expressa literalmente a ideia de ter outra opinião ou disposição, preservando o contraste com a concórdia sem acrescentar um motivo específico.
- source_word: ὁμονοίᾳ
  choice: concórdia
  rationale: Mantém o valor cívico e comunitário de ὁμόνοια, termo importante em 1 Clemente, com linguagem digna e compreensível em português.
- source_word: δίψυχοι
  choice: os de ânimo dividido
  rationale: Preserva a imagem de duplicidade interior do grego, em vez de reduzi-la apenas a inconstância ou indecisão.
- source_word: διστάζοντες
  choice: os que duvidam
  rationale: No contexto, indica hesitação ou dúvida quanto ao poder de Deus; 'duvidam' é natural e semanticamente direto.
- source_word: σημείωσιν
  choice: advertência
  rationale: O substantivo designa algo assinalado como aviso ou exemplo; 'advertência' comunica essa função às gerações posteriores.
theological_decisions:
- issue: Função exemplar do destino da mulher de Ló
  choice: se tornam juízo e advertência
  alternative: incorrem em juízo e se tornam advertência
  rationale: Um único verbo grego, γίγονται, rege os dois complementos paralelos; a tradução preserva a afirmação tensa de que essas pessoas se tornam tanto juízo quanto advertência, sem explicá-la teologicamente.
- issue: Dúvida acerca do poder divino
  choice: duvidam do poder de Deus
  alternative: hesitam quanto ao poder de Deus
  rationale: A formulação conserva o objeto explícito da dúvida e não especifica se a falha é intelectual, moral ou volitiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se “concórdia” por seu peso temático em 1 Clemente; a sintaxe foi levemente reorganizada para fluência sem eliminar as ambiguidades do grego.
