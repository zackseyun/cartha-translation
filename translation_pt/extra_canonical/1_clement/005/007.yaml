id: 1CLEM.5.7
reference: 1 Clement 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: pt
  text: Tendo ensinado a justiça ao mundo inteiro, chegado ao limite extremo do Ocidente e dado testemunho diante dos governantes, assim ele partiu deste mundo e foi para o lugar santo, tornando-se o maior exemplo de perseverança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: Mantém o sentido moral e religioso amplo do termo grego sem restringi-lo a uma doutrina específica.
- source_word: τὸ τέρμα τῆς δύσεως
  choice: o limite extremo do Ocidente
  rationale: Traduz diretamente a expressão geográfica, preservando sua possível referência ao ponto mais ocidental alcançado sem identificar um lugar concreto.
- source_word: μαρτυρήσας
  choice: dado testemunho
  rationale: Preserva a amplitude de μαρτυρέω, que pode indicar testemunhar e, no contexto, sugerir o testemunho levado até a morte, sem tornar explícito o martírio além do que a forma verbal exige.
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: partiu deste mundo
  rationale: Reproduz o idioma grego para deixar a vida ou morrer, evitando a nuance indevida de libertação que uma tradução estritamente passiva poderia introduzir.
- source_word: ὑπομονῆς ... ὑπογραμμός
  choice: exemplo de perseverança
  rationale: Emprega linguagem portuguesa natural para a ideia de um modelo a ser seguido e traduz ὑπομονή como constância resistente diante do sofrimento.
theological_decisions:
- issue: Possível sentido martirial de μαρτυρήσας
  choice: dado testemunho
  alternative: sofrido o martírio
  rationale: O contexto da morte de Paulo permite a leitura martirial, mas o verbo também significa prestar testemunho. A formulação escolhida preserva essa tensão.
- issue: Sentido de ἀπηλλάγη τοῦ κόσμου
  choice: partiu deste mundo
  alternative: foi libertado deste mundo
  rationale: A expressão funciona como modo de dizer que ele morreu ou deixou o mundo; “foi libertado” acrescentaria uma interpretação teológica não exigida pelo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sequência dos três particípios gregos foi preservada antes do verbo principal, sem quebrar artificialmente a progressão da frase.
