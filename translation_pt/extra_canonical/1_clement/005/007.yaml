  source_fidelity: A tradução preserva a sequência dos três particípios aoristos (ensinar, chegar, dar testemunho), seguida do verbo principal, e transmite adequadamente ἀπηλλάγη τοῦ κόσμου como partida deste mundo. “Limite extremo do Ocidente” mantém a imprecisão geográfica de τὸ τέρμα τῆς δύσεως, sem identificar um destino específico.
  naturalness: O período é claro, formal e natural em português contemporâneo. A construção “Tendo ensinado ..., chegado ... e dado testemunho” reproduz de modo compacto e aceitável a progressão participial grega.
  terminology: “Justiça”, “dar testemunho”, “lugar santo” e “exemplo de perseverança” são escolhas fiéis, compreensíveis e teologicamente não impositivas. “Governantes” é uma boa equivalência ampla para ἡγουμένων.
