source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλον καὶ φθόνον οἱ μέγιστοι καὶ δικαιότατοι στῦλοι ἐδιώχθησαν καὶ ἕως θανάτου ἤθλησαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/002.yaml
  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: pt
  text: Por causa do ciúme e da inveja, as maiores e mais justas colunas foram perseguidas e lutaram até a morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: ciúme e inveja
  rationale: Mantém os dois termos coordenados e sua distinção possível, sem fundi-los numa única ideia.
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  choice: as maiores e mais justas colunas
  rationale: Preserva a metáfora de στῦλοι e os superlativos gregos em português natural.
- source_word: ἐδιώχθησαν
  choice: foram perseguidas
  rationale: Equivalente direto da forma passiva, conservando os agentes não expressos.
- source_word: ἤθλησαν
  choice: lutaram
  rationale: Expressa o esforço intenso sugerido pelo verbo de fundo atlético sem tornar a metáfora artificial em português.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: Reproduz de modo claro a extensão extrema da luta, sem especificar além do que o grego declara.
theological_decisions:
- issue: Identidade das “colunas”
  choice: Manter a referência genérica nesta frase
  alternative: Identificá-las explicitamente como apóstolos ou mártires
  rationale: O versículo usa apenas a metáfora e não nomeia aqui as pessoas; explicitá-las importaria contexto ou interpretação para o texto.
- issue: Sentido de ἕως θανάτου
  choice: até a morte
  alternative: até morrerem / em luta mortal
  rationale: A formulação conserva a possível ideia tanto de perseverança que chegou à morte quanto de luta diante da morte, sem resolver a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância feminina em “perseguidas” por referência a “colunas”. Mantém o paralelismo e a metáfora do original.
