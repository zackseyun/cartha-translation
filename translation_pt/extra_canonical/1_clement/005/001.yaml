source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: pt
  text: Mas, deixando de lado os exemplos antigos, voltemo-nos para os atletas que viveram em tempos mais próximos de nós. Tomemos os nobres exemplos de nossa própria geração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παυσώμεθα
  choice: deixando de lado
  rationale: Expressa naturalmente em português a ideia de cessar a consideração dos exemplos antigos e passar aos mais recentes, sem sugerir que os antigos sejam rejeitados.
- source_word: ἀθλητάς
  choice: atletas
  rationale: Preserva a metáfora grega de pessoas que enfrentam uma competição ou luta com esforço e perseverança.
- source_word: ἔγγιστα γενομένους
  choice: que viveram em tempos mais próximos de nós
  rationale: Torna explícito o sentido temporal indicado pelo contexto, sem identificar indevidamente essas figuras como contemporâneas exatas.
- source_word: γενναῖα ὑποδείγματα
  choice: nobres exemplos
  rationale: Mantém tanto o valor moral de γενναῖα quanto a função exemplar de ὑποδείγματα.
- source_word: τῆς γενεᾶς ἡμῶν
  choice: de nossa própria geração
  rationale: Reproduz a referência à geração do autor e dá em português a ênfase contextual do possessivo.
