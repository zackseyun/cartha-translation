  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: pt
  text: tendo carregado correntes sete vezes, sido exilado, apedrejado e se tornado arauto tanto no Oriente como no Ocidente, recebeu a nobre fama de sua fé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: depois de carregar correntes sete vezes
  rationale: Preserva o número explícito e a imagem concreta de portar correntes, em português natural.
- source_word: φυγαδευθείς
  choice: de ser expulso para o exílio
  rationale: Expressa o sentido passivo de ser banido ou forçado a deixar sua terra, sem sugerir uma partida voluntária.
- source_word: λιθασθείς
  choice: de ser apedrejado
  rationale: Equivalente direto e corrente do particípio grego.
- source_word: κῆρυξ γενόμενος
  choice: de se tornar arauto
  rationale: Mantém a metáfora pública de κῆρυξ, alguém que proclama uma mensagem, em registro digno.
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: tanto no Oriente como no Ocidente
  rationale: Reproduz o paralelismo geográfico e usa maiúsculas por se tratar das grandes regiões do mundo conhecido.
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν
  choice: alcançou a nobre fama que sua fé lhe trouxe
  rationale: Comunica com clareza que a fama está ligada à sua fé, preservando γενναῖον como 'nobre' e κλέος como 'fama'.
theological_decisions:
- issue: Relação expressa pelo genitivo em τῆς πίστεως αὐτοῦ
  choice: a nobre fama que sua fé lhe trouxe
  alternative: a nobre fama de sua fé
  rationale: A formulação escolhida torna a frase natural em português e entende a fé como fundamento da fama, sem introduzir uma afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com cadência apropriada a uma enumeração narrativa. A vírgula final foi preservada porque o trecho fornecido continua sintaticamente no versículo seguinte.
