reference: 1 Clement 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: pt
  text: Pedro, que, por causa de um ciúme injusto, suportou não um nem dois, mas muitos sofrimentos e, assim, depois de dar testemunho, foi para o lugar de glória que lhe era devido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον ἄδικον
  choice: um ciúme injusto
  rationale: Mantém o sentido negativo de ζῆλος qualificado por ἄδικος sem especificar indevidamente quem sentiu esse ciúme.
- source_word: πλείονας ... πόνους
  choice: muitos sofrimentos
  rationale: Em contexto, πόνοι são aflições ou padecimentos suportados; “sofrimentos” é natural e preserva a força da expressão.
- source_word: μαρτυρήσας
  choice: depois de dar testemunho
  rationale: Preserva a possível tensão entre dar testemunho e sofrer martírio, sem impor exclusivamente o sentido técnico posterior de “ser martirizado”.
- source_word: τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: o lugar de glória que lhe era devido
  rationale: Reproduz a relação sintática do grego e mantém a noção de um lugar devido ou destinado, sem transformar explicitamente o genitivo em mero adjetivo.
theological_decisions:
- issue: Sentido de μαρτυρήσας
  choice: depois de dar testemunho
  alternative: depois de sofrer o martírio
  rationale: O particípio pode evocar a morte como mártir no contexto, mas seu valor lexical básico é testemunhar; a tradução conserva essa ambiguidade teologicamente relevante.
- issue: Sentido de ὀφειλόμενον
  choice: que lhe era devido
  alternative: que lhe estava destinado
  rationale: “Devido” representa mais diretamente ὀφειλόμενον. Não se explicita se isso indica recompensa, destino apropriado ou obrigação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção próxima do grego sem rigidez excessiva. O nome Πέτρον é vertido pela forma portuguesa consagrada, “Pedro”.
