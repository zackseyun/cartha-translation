base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: pt
  text: 'Então o procônsul disse: “Tenho feras aqui e mandarei que você seja lançado a elas, se não se arrepender.” Mas ele respondeu: “Mande trazê-las, pois não nos é permitido mudar do melhor para o pior; mas é nobre mudar da injustiça para a justiça.”


    Então ele lhe disse novamente: “Farei com que você seja consumido pelo fogo, se desprezar as feras e não se arrepender.” Mas Policarpo respondeu: “Você me ameaça com um fogo que arde por algum tempo e pouco depois se apaga, pois desconhece o fogo do juízo futuro e do castigo eterno, reservado para os ímpios. Mas por que demora? Venha, faça o que quiser.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repent
  choice: arrepender-se
  rationale: 'Preserva a repetição e a tensão retórica do diálogo: o procônsul exige que Policarpo volte atrás, enquanto Policarpo redefine a mudança moral legítima.'
- source_word: untowardness / wrongdoing
  choice: injustiça
  rationale: Forma natural e digna em português, em contraste direto com “justiça”, sem restringir o sentido a um delito específico.
- source_word: wild beasts
  choice: feras
  rationale: Termo corrente no contexto de execução em arena e mais natural que a expressão mais longa “animais selvagens”.
- source_word: ungodly
  choice: ímpios
  rationale: Vocábulo tradicional e ainda compreensível que comunica oposição moral e religiosa a Deus sem acrescentar uma identidade sectária.
theological_decisions:
- issue: A dupla acepção de arrependimento/mudança
  choice: Manter “se arrepender” nas ameaças e “mudar” na explicação de Policarpo
  alternative: Usar “arrepender-se” em todas as ocorrências
  rationale: 'Conserva o jogo conceitual do testemunho: a exigência de retratação é recusada como mudança do melhor para o pior, ao passo que se afirma a legitimidade da conversão da injustiça para a justiça.'
- issue: Duração do castigo futuro
  choice: “castigo eterno”
  alternative: “castigo da era futura”
  rationale: Segue explicitamente o testemunho fornecido, que traz “eternal punishment”; a revisão direta do grego está pendente, por isso não se introduz aqui uma releitura lexical não sustentada pelos dados apresentados.
- issue: Natureza do fogo do juízo
  choice: Preservar a afirmação como “fogo do juízo futuro”
  alternative: Interpretá-lo figurada ou literalmente na tradução
  rationale: A tradução mantém a linguagem do texto sem decidir sua modalidade teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” evita o arcaísmo de “tu” em grande parte do uso brasileiro, mantendo dignidade por meio da sintaxe e do vocabulário. Rascunho provisório baseado no testemunho inglês de domínio público fornecido; a conferência direta com a tradição manuscrita grega continua pendente.
