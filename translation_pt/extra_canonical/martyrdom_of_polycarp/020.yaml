review_pass:
  verdict: revise
  source_fidelity: A minuta segue de perto o testemunho inglês fornecido e preserva adequadamente as imagens centrais (combate, coroa, timoneiro e pastor). Contudo, acrescenta «irmãos», informação que não consta do testemunho e que não deve ser inferida no texto. A formulação da primeira frase também pode preservar com mais clareza que Policarpo sofreu juntamente com o grupo procedente de Filadélfia, sendo doze o total.
  naturalness: O português é claro, moderno e de registro apropriado. Pequenos ajustes de ordem e de ligação sintática tornam o primeiro período mais fluente e evitam uma pausa excessiva entre a identificação do mártir e a referência aos demais.
  terminology: «Bem-aventurado», «mártir», «coroa da imortalidade» e «timoneiro» são escolhas adequadas. «Igreja universal» comunica o alcance de καθολική sem impor uma identificação denominacional posterior; «que está em todo o mundo» reproduz mais diretamente a qualificação final do testemunho.
  issues:
  - severity: medium
    issue: Acréscimo de «irmãos» em «os irmãos vindos da Filadélfia».
    rationale: O testemunho fornecido diz somente «those from Philadelphia». Embora «irmãos» possa ser contextualmente plausível, é uma especificação não atestada e reduz a fidelidade da tradução.
  - severity: low
    issue: A primeira frase separa de modo menos explícito a ação conjunta de Policarpo e dos provenientes de Filadélfia.
    rationale: A construção revista mantém «juntamente com os que vieram de Filadélfia» ligado diretamente a «sofreu martírio» e conserva «doze ao todo» como total do grupo.
  - severity: low
    issue: «Espalhada pelo mundo inteiro» é interpretativa para a qualificação da Igreja.
    rationale: «Que está em todo o mundo» permanece natural e se aproxima mais diretamente do testemunho, sem alterar o sentido.
  revised_text: 'Assim aconteceu com o bem-aventurado Policarpo, o qual, juntamente com os que vieram de Filadélfia, sofreu martírio em Esmirna — doze ao todo. Ele é lembrado por todos mais do que os outros, de modo que até os pagãos falam dele em toda parte. Pois mostrou-se não apenas um mestre notável, mas também um mártir ilustre, cujo martírio todos desejam imitar, visto que seguiu o modelo do evangelho de Cristo.


    Por sua perseverança, venceu o governante injusto no combate e, assim, recebeu a coroa da imortalidade. Ele se alegra na companhia dos apóstolos e de todos os justos, glorifica o Deus Todo-Poderoso e Pai e bendiz nosso Senhor Jesus Cristo, o Salvador de nossas almas, o timoneiro de nossos corpos e o pastor da Igreja universal que está em todo o mundo.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega.
    reason: O material de entrada informa que a revisão direta da língua original ainda está pendente; a nota torna explícita essa limitação textual.
  revision_rationale: A revisão remove a inferência não atestada «irmãos», ajusta a sintaxe inicial para refletir a ação conjunta e aproxima a cláusula final sobre a Igreja do testemunho fornecido. Mantêm-se as escolhas teológicas não confessionalizantes e as metáforas do texto.
