    Having by his endurance overcome the unrighteous ruler in the conflict and so received the crown of immortality, he rejoiceth in company with the Apostles and all righteous men, and glorifieth the Almighty God and Father, and blesseth our Lord Jesus Christ, the savior of our souls and helmsman of our bodies and shepherd of the universal Church which is throughout the world.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: pt
  text: 'Assim aconteceu com o bem-aventurado Policarpo, que sofreu o martírio em Esmirna junto com os irmãos vindos da Filadélfia — doze ao todo. Mais do que os outros, ele é lembrado por todos, a ponto de até os pagãos falarem dele em toda parte. Pois mostrou ser não apenas um mestre notável, mas também um mártir ilustre. Todos desejam imitar seu martírio, visto que ele seguiu o modelo do evangelho de Cristo.


    Por sua perseverança, venceu no combate o governante injusto e, assim, recebeu a coroa da imortalidade. Ele se alegra na companhia dos apóstolos e de todos os justos, glorifica o Deus e Pai Todo-Poderoso e bendiz nosso Senhor Jesus Cristo, o Salvador de nossas almas, o timoneiro de nossos corpos e o pastor da Igreja universal espalhada pelo mundo inteiro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega.
    reason: O material de entrada informa que a revisão na língua original ainda está pendente; a nota torna transparente a limitação textual da presente minuta.
lexical_decisions:
- source_word: blessed
  choice: bem-aventurado
  rationale: Preserva o tom honorífico e religioso do testemunho antigo, com linguagem bíblica reconhecível em português.
- source_word: those from Philadelphia
  choice: os irmãos vindos da Filadélfia
  rationale: Explicita naturalmente que se trata de pessoas da comunidade, sem confundir a antiga cidade com a moderna; 'irmãos' é inferência contextual e não parentesco literal.
- source_word: heathen
  choice: pagãos
  rationale: Equivalente moderno, claro e historicamente apropriado, sem a carga pejorativa de alternativas mais antigas.
- source_word: after the pattern
  choice: seguiu o modelo
  rationale: Comunica imitação ou conformidade ao padrão do evangelho sem sugerir mera sequência cronológica.
- source_word: endurance
  choice: perseverança
  rationale: Expressa constância sob sofrimento e é natural no registro cristão antigo.
- source_word: conflict
  choice: combate
  rationale: Mantém a metáfora agonística presente no contexto do martírio.
- source_word: crown of immortality
  choice: coroa da imortalidade
  rationale: Preserva a imagem tradicional da recompensa do vencedor sem explicá-la no corpo do texto.
- source_word: helmsman
  choice: timoneiro
  rationale: Conserva a metáfora náutica rara e teologicamente expressiva em vez de substituí-la por uma paráfrase.
- source_word: universal Church
  choice: Igreja universal
  rationale: Traduz o sentido abrangente do termo sem importar uma identificação confessional posterior.
theological_decisions:
- issue: Estado presente de Policarpo após o martírio
  choice: Ele se alegra... glorifica... e bendiz
  alternative: Ele se alegrará... glorificará... e bendirá
  rationale: Mantém os presentes do testemunho fornecido e a afirmação do autor sem convertê-la em formulação escatológica futura.
- issue: Relação do martírio com o evangelho de Cristo
  choice: seguiu o modelo do evangelho de Cristo
  alternative: aconteceu segundo o evangelho de Cristo
  rationale: Preserva a noção de conformidade exemplar sem afirmar que o evangelho ordena o martírio ou sem restringir a expressão a uma alusão específica à paixão de Jesus.
- issue: Título e alcance da Igreja
  choice: pastor da Igreja universal espalhada pelo mundo inteiro
  alternative: pastor da Igreja católica em todo o mundo
  rationale: Evita que o leitor moderno entenda 'católica' primariamente como denominação, preservando o sentido de universalidade explicitado pela frase seguinte.
- issue: Salvador das almas e timoneiro dos corpos
  choice: mantida a dupla formulação literal
  alternative: Salvador e guia de toda a nossa pessoa
  rationale: Preserva a tensão antropológica e as metáforas distintas do texto, sem harmonizá-las em uma doutrina posterior.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se imagens antigas como 'coroa da imortalidade' e 'timoneiro de nossos corpos'. Evitou-se 'católica' no corpo do texto para prevenir leitura denominacional anacrônica. A inclusão de 'irmãos' antes de 'vindos da Filadélfia' melhora a naturalidade, mas deve ser revista contra o grego.
