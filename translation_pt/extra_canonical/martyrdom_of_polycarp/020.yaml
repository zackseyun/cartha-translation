review_pass:
  verdict: revise
  source_fidelity: A minuta acompanha de perto o testemunho inglês fornecido. Contudo, «irmãos» acrescenta uma identificação comunitária que não está expressa em «those from Philadelphia» e deve ser retirado. Também convém ajustar «Deus e Pai Todo-Poderoso», cuja sintaxe em português pode qualificar apenas «Pai», enquanto o testemunho qualifica Deus como Todo-Poderoso.
  naturalness: O português é moderno, fluente e mantém um registro solene apropriado. «Pessoas da Filadélfia» é claro e não introduz conteúdo adicional; «Deus Todo-Poderoso e Pai» é uma formulação natural e sintaticamente inequívoca.
  terminology: «Bem-aventurado», «martírio», «perseverança», «coroa da imortalidade», «timoneiro» e «Igreja universal» preservam adequadamente o registro e as imagens do texto. «Igreja universal» evita a associação denominacional moderna de «católica», sem perder o sentido abrangente indicado pela frase final.
  issues:
  - severity: medium
    issue: «os irmãos vindos da Filadélfia» acrescenta «irmãos».
    rationale: O testemunho fornecido diz somente «those from Philadelphia». Embora possam ser membros da comunidade cristã, essa especificação não deve ser inserida no texto sem confirmação direta do grego.
  - severity: low
    issue: «glorifica o Deus e Pai Todo-Poderoso» tem escopo adjetival potencialmente ambíguo.
    rationale: 'Em português, «Todo-Poderoso» após «Pai» pode ser lido como qualificando apenas «Pai». «Glorifica o Deus Todo-Poderoso e Pai» comunica com mais clareza a construção do testemunho: «the Almighty God and Father».'
  revised_text: 'Assim aconteceu com o bem-aventurado Policarpo, que sofreu o martírio em Esmirna junto com os da Filadélfia — doze ao todo. Mais do que os outros, ele é lembrado por todos, a ponto de até os pagãos falarem dele em toda parte. Pois mostrou ser não apenas um mestre notável, mas também um mártir ilustre. Todos desejam imitar seu martírio, visto que ele seguiu o modelo do evangelho de Cristo.


    Por sua perseverança, venceu no combate o governante injusto e, assim, recebeu a coroa da imortalidade. Ele se alegra na companhia dos apóstolos e de todos os justos, glorifica o Deus Todo-Poderoso e Pai e bendiz nosso Senhor Jesus Cristo, o Salvador de nossas almas, o timoneiro de nossos corpos e o pastor da Igreja universal espalhada pelo mundo inteiro.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega.
    reason: O material de entrada informa que a revisão na língua original ainda está pendente; a nota torna transparente a limitação textual da presente minuta.
  revision_rationale: 'Foram feitas apenas correções seguras: suprimiu-se a inferência «irmãos» e esclareceu-se a relação sintática de «Todo-Poderoso» com Deus. Mantêm-se a ambiguidade potencial de «os da Filadélfia» quanto à designação exata do grupo e a formulação não denominacional «Igreja universal».'
