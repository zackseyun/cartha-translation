base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: pt
  text: O bem-aventurado Policarpo foi martirizado no segundo dia da primeira parte do mês de Xântico, no sétimo dia antes das calendas de março,[a] em um grande sábado,[b] à oitava hora.[c] Ele foi preso por Herodes, quando Filipe de Trales era sumo sacerdote, durante o proconsulado de Estácio Quadrato, mas sob o reinado do Rei eterno, Jesus Cristo. A ele sejam a glória, a honra, a grandeza e o trono eterno, de geração em geração. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xântico” é o nome de um mês de um calendário antigo. “O sétimo dia antes das calendas de março” é uma forma romana de indicar a data; as calendas eram o primeiro dia do mês.
    reason: Os dois sistemas antigos de datação podem não ser claros para leitores modernos, e o texto os conserva sem convertê-los.
  - marker: b
    text: Literalmente, “um grande sábado”. A referência exata da expressão não é esclarecida pelo testemunho fornecido.
    reason: Preserva a ambiguidade histórica e litúrgica, evitando identificar a expressão com uma celebração específica.
  - marker: c
    text: A “oitava hora” pertence ao modo antigo de contar as horas do dia; sua correspondência moderna depende do sistema de contagem pressuposto.
    reason: Evita uma conversão moderna excessivamente precisa com base apenas no testemunho inglês disponível.
lexical_decisions:
- source_word: blessed
  choice: bem-aventurado
  rationale: Mantém o tom honorífico e religioso do testemunho, em linguagem bíblica ainda amplamente compreensível.
- source_word: martyred
  choice: foi martirizado
  rationale: Preserva o sentido técnico de sofrer a morte como mártir, sem o reduzir simplesmente a “foi morto”.
- source_word: Kalends
  choice: calendas
  rationale: Retém o termo técnico do calendário romano, pois a conversão para uma data moderna poderia apagar a forma antiga de datação e sugerir precisão indevida.
- source_word: great Sabbath
  choice: grande sábado
  rationale: Conserva literalmente a expressão antiga e sua possível ambiguidade, sem harmonizá-la com uma festa ou calendário específico.
- source_word: high priest
  choice: sumo sacerdote
  rationale: É a equivalência portuguesa tradicional e direta do título preservado no testemunho.
- source_word: proconsulship
  choice: proconsulado
  rationale: Emprega o termo histórico preciso para o período de exercício do procônsul.
- source_word: reign
  choice: reinado
  rationale: Mantém o contraste deliberado entre o governo imperial datável e a soberania eterna de Cristo.
theological_decisions:
- issue: Contraste entre o proconsulado de Estácio Quadrato e o reinado de Jesus Cristo
  choice: “durante o proconsulado... mas sob o reinado do Rei eterno”
  alternative: “quando Estácio Quadrato era procônsul, porém no reino do Rei eterno”
  rationale: Preserva o contraste teológico e político do texto, usando formulação portuguesa natural sem explicá-lo ou enfraquecê-lo.
- issue: Doxologia dirigida a Jesus Cristo
  choice: “A ele sejam a glória, a honra, a grandeza e o trono eterno”
  alternative: “A quem pertencem a glória...”
  rationale: Mantém o referente imediato em Cristo e a forma optativa da doxologia, sem introduzir uma interpretação trinitária adicional nem alterar sua força.
- issue: Expressão “grande sábado”
  choice: retida sem identificação específica
  alternative: interpretá-la como Páscoa, sábado festivo ou domingo
  rationale: O testemunho fornecido não resolve a referência; a tradução conserva a tensão histórica e litúrgica em vez de impor uma harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com termos históricos preservados quando relevantes. A redação segue provisoriamente o testemunho inglês de domínio público e a camada inglesa auditada; a revisão direta do grego permanece pendente. Foram evitadas conversões calendáricas e harmonizações litúrgicas não sustentadas pelos dados fornecidos.
