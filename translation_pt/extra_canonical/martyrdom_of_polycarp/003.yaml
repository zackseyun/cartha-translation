revisions:
- from: 'Portanto, benditos e nobres são todos os martírios que aconteceram segundo a vontade de Deus — pois devemos agir com grande reverência e reconhecer que Deus tem poder sobre todas as coisas.


    Quem deixaria de admirar sua nobreza, sua perseverança e sua fidelidade ao Senhor? Foram tão dilacerados pelos açoites que se podia ver a estrutura de sua carne, até as veias e artérias mais profundas. Mesmo assim, perseveraram, a ponto de os próprios espectadores se compadecerem e chorarem. Eles, porém, alcançaram tamanha coragem que nenhum deles soltou um grito nem um gemido. Assim mostraram a todos nós que, naquela hora, enquanto eram torturados, os mártires de Cristo estavam como que ausentes do corpo — ou, melhor, que o Senhor estava ao lado deles e conversava com eles.


    Atentos à graça de Cristo, desprezaram as torturas deste mundo, obtendo, ao preço de uma só hora, a libertação do castigo eterno. Para eles, o fogo de seus cruéis torturadores era frio, pois mantinham diante dos olhos a libertação do fogo eterno que nunca se apaga. Com os olhos do coração, contemplavam as coisas boas reservadas aos que perseveram: coisas que o ouvido não ouviu, o olho não viu e que não chegaram ao coração humano, mas que o Senhor lhes mostrou, pois já não eram seres humanos, mas anjos.


    Do mesmo modo, os que foram condenados às feras suportaram castigos terríveis: foram obrigados a deitar-se sobre conchas pontiagudas e sofreram muitas outras formas de tortura. Desse modo, o diabo procurava, se possível, levá-los à negação pela duração do sofrimento, pois empregou contra eles muitas artimanhas.'
