base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: pt
  text: 'Portanto, benditos e nobres são todos os martírios que ocorreram segundo a vontade de Deus — pois devemos ser muito escrupulosos e atribuir a Deus o poder sobre todas as coisas.



    Pois quem deixaria de admirar sua nobreza, sua perseverança e sua fidelidade ao Mestre? Quando foram tão dilacerados pelos açoites que a estrutura de sua carne ficava visível até as veias e artérias mais profundas, perseveraram pacientemente, de modo que até os espectadores se compadeceram e choraram. Eles, porém, alcançaram tamanha coragem que nenhum deles soltou um grito nem um gemido, mostrando assim a todos nós que, naquela hora, os mártires de Cristo, enquanto eram torturados, estavam ausentes da carne — ou melhor, que o Senhor estava ao lado deles e conversava com eles.



    Atentos à graça de Cristo, desprezaram as torturas deste mundo, obtendo, ao preço de uma só hora, a libertação do castigo eterno. E acharam frio o fogo de seus torturadores desumanos, pois mantinham diante dos olhos a fuga do fogo eterno que nunca se apaga. Com os olhos do coração, contemplavam as coisas boas reservadas aos que perseveram pacientemente: coisas que o ouvido não ouviu, o olho não viu e que não chegaram ao coração humano, mas que o Senhor lhes mostrou, pois já não eram seres humanos, mas já eram anjos.



    Do mesmo modo, os que foram condenados às feras suportaram castigos terríveis, sendo obrigados a deitar-se sobre conchas[a] pontiagudas e submetidos a muitas outras formas de tortura, para que o diabo pudesse, se possível, pela persistência do sofrimento, levá-los à negação; pois empregou contra eles muitas artimanhas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fragmentos cortantes de cerâmica”. O termo grego pode referir-se a conchas ou a cacos/fragmentos duros e cortantes.
    reason: Preserva a ambiguidade lexical de ὄστρακα sem alterar a imagem do texto.
lexical_decisions:
- source_word: μαρτύρια (presumido pela tradição grega; revisão direta pendente)
  choice: martírios
  rationale: Preserva o sentido técnico de morte ou sofrimento como testemunho de Cristo, apropriado ao contexto cristão antigo.
- source_word: δεσπότης / Master (testemunho inglês)
  choice: Senhor
  rationale: Em português corrente, “Senhor” expressa lealdade e autoridade pessoal com mais naturalidade que “Mestre” neste contexto; a identificação cristológica permanece contextual.
- source_word: ὑπομονή / patient endurance (testemunho inglês)
  choice: perseverança / perseveraram
  rationale: Comunica resistência paciente e constante em linguagem natural, sem reduzir o termo a mera passividade.
- source_word: οἰκονομία τῆς σαρκός / mechanism of their flesh (provável expressão grega)
  choice: estrutura de sua carne
  rationale: Evita o anacrônico e mecânico “mecanismo”, conservando a imagem anatômica da carne exposta.
- source_word: ἀρνησις / denial (testemunho inglês)
  choice: negação
  rationale: Mantém aberta a referência contextual à negação da fé ou de Cristo, sem acrescentar um objeto não explicitado no trecho.
- source_word: ὄστρακα / sharp shells (provável termo grego)
  choice: conchas pontiagudas
  rationale: Segue o sentido concreto transmitido pelo testemunho, embora o termo também possa designar fragmentos cortantes de cerâmica.
theological_decisions:
- issue: Vontade e soberania de Deus nos martírios
  choice: “segundo a vontade de Deus” e “Deus tem poder sobre todas as coisas”
  alternative: Explicitar que Deus causou diretamente cada tortura
  rationale: O texto atribui os acontecimentos à vontade e ao poder divinos, mas não define aqui a relação causal; a tradução preserva essa tensão sem formular uma teodiceia.
- issue: Experiência dos mártires durante a tortura
  choice: “estavam como que ausentes do corpo — ou, melhor, que o Senhor estava ao lado deles”
  alternative: Afirmar uma separação literal da alma e do corpo
  rationale: “Como que” conserva o caráter experiencial ou retórico da primeira afirmação, e “ou, melhor” mantém a autocorreção do autor em favor da presença do Senhor.
- issue: “Já não eram seres humanos, mas anjos”
  choice: Manter a formulação enfática sem explicação doutrinária
  alternative: Parafrasear como “pareciam anjos” ou ensinar transformação ontológica
  rationale: A frase pode ser retórica ou antecipatória; suavizá-la ou dogmatizá-la resolveria indevidamente sua tensão.
- issue: Libertação do castigo eterno ao preço de uma hora
  choice: “obtendo, ao preço de uma só hora, a libertação do castigo eterno”
  alternative: Acrescentar uma explicação sobre mérito, salvação por obras ou justificação
  rationale: Preserva a metáfora econômica do testemunho sem impor um sistema soteriológico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação evita arcaísmos como “apraz”, “cumpre-nos” e “artérias interiores”, mas conserva o tom solene e as imagens fortes. Como a revisão direta do grego está indicada como pendente, decisões lexicais mais específicas foram tratadas com cautela, tomando o testemunho público inglês como camada de consulta.
