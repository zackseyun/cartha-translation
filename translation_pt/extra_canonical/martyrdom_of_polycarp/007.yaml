review_pass:
  verdict: revise
  source_fidelity: O rascunho acompanha de perto o testemunho inglês fornecido e preserva adequadamente os elementos narrativos e teológicos. Contudo, “ali” acrescenta uma localização de modo desnecessariamente explícito, e o subjuntivo em “sofressem” enfraquece a afirmação narrativa de que os traidores efetivamente recebiam/sofriam o castigo de Judas.
  naturalness: O português é geralmente claro e digno. “Estava ansioso por levá-lo” soa menos idiomático do que “estava ansioso para levá-lo”, e a construção final fica mais natural com o imperfeito do indicativo em contraste com a finalidade atribuída a Policarpo.
  terminology: “Propriedade rural”, “rapazes escravizados”, “casa”, “chefe da polícia”, “estádio” e “participante com Cristo” são escolhas defensáveis no escopo provisório baseado no testemunho inglês. “Chamava-se Herodes” comunica de maneira natural que o oficial portava precisamente esse nome, sem acrescentar identificação com Herodes bíblico algum.
  issues:
  - severity: low
    issue: Acréscimo de “ali” após a chegada dos perseguidores.
    rationale: O testemunho diz apenas que eles chegaram; embora o contexto sugira a propriedade rural, a tradução pode evitar explicitar esse referente.
  - severity: medium
    issue: “Enquanto eles ... sofressem” usa subjuntivo sob a oração final.
    rationale: O original inglês contrapõe a realização do destino de Policarpo com o fato narrado de que os traidores “underwent” o castigo de Judas. O indicativo (“sofriam”) preserva melhor essa asserção.
  - severity: low
    issue: Formulação pouco idiomática em “ansioso por levá-lo”.
    rationale: “Ansioso para levá-lo” é a regência mais natural no português contemporâneo, sem mudança de sentido.
  revised_text: 'Como os que o procuravam persistiam, ele partiu para outra propriedade rural. Imediatamente, os que o procuravam chegaram. Como não o encontraram, prenderam dois rapazes escravizados, um dos quais confessou sob tortura.


    De fato, era impossível que ele continuasse escondido, pois os próprios que o traíram eram de sua casa. O chefe da polícia, que por acaso se chamava justamente Herodes, estava ansioso para levá-lo ao estádio, para que ele cumprisse o destino que lhe estava reservado, tornando-se participante com Cristo, enquanto eles — os que o traíram — sofriam o castigo do próprio Judas.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego ainda está pendente.
    reason: A fonte submetida informa que a consulta direta à tradição manuscrita grega ainda não foi realizada; a nota torna transparente o grau de segurança do rascunho.
  revision_rationale: A revisão elimina uma explicitação não necessária, ajusta uma regência e restaura, no contraste final, o caráter assertivo da consequência atribuída aos traidores. Mantêm-se a ambiguidade de “castigo do próprio Judas”, a linguagem de participação com Cristo e a transparência quanto à dependência provisória do testemunho inglês.
