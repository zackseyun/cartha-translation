base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young slaves, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: pt
  text: 'Os que o procuravam persistiram, e por isso ele partiu para outra propriedade rural. Imediatamente, os que o procuravam chegaram ali. Como não o encontraram, prenderam dois jovens escravizados, um dos quais confessou sob tortura.


    De fato, era impossível que ele continuasse escondido, pois os próprios que o traíram eram de sua casa. O chefe da polícia, que por acaso tinha justamente o nome de Herodes, estava ansioso por levá-lo ao estádio, para que ele cumprisse o destino que lhe estava reservado, tornando-se participante com Cristo, enquanto eles — os que o traíram — sofressem o castigo do próprio Judas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego ainda está pendente.
    reason: A fonte submetida informa que a consulta direta à tradição manuscrita grega ainda não foi realizada; a nota torna transparente o grau de segurança do rascunho.
lexical_decisions:
- source_word: farm
  choice: propriedade rural
  rationale: Expressa naturalmente o local rural sem restringi-lo necessariamente a uma fazenda no sentido brasileiro moderno.
- source_word: slave lads
  choice: jovens escravizados
  rationale: Mantém a juventude e a condição servil das duas pessoas, em linguagem moderna e clara.
- source_word: people of his own household
  choice: eram de sua casa
  rationale: Preserva a amplitude do grupo doméstico antigo, que podia incluir dependentes e escravizados, sem reduzi-lo à família consanguínea.
- source_word: captain of the police
  choice: chefe da polícia
  rationale: Equivalente funcional claro para o oficial encarregado da força que efetuava a captura.
- source_word: appointed lot
  choice: o destino que lhe estava reservado
  rationale: Comunica a ideia de porção ou sorte designada sem sugerir mero acaso.
- source_word: partaker with Christ
  choice: participante com Cristo
  rationale: Conserva a formulação de participação conjunta e sua densidade cristológica, sem explicá-la além do texto.
theological_decisions:
- issue: A participação de Policarpo com Cristo por meio do martírio
  choice: tornando-se participante com Cristo
  alternative: compartilhando o destino de Cristo
  rationale: A opção escolhida preserva a linguagem teológica de participação sem limitar seu sentido à simples semelhança de destino.
- issue: O castigo atribuído aos traidores
  choice: o castigo do próprio Judas
  alternative: o mesmo castigo de Judas
  rationale: Mantém a possível ambiguidade entre um castigo característico de Judas e o castigo recebido por ele, sem especificar sua natureza.
- issue: Destino reservado a Policarpo
  choice: o destino que lhe estava reservado
  alternative: a sorte que lhe fora designada
  rationale: Evita que “sorte” seja entendida como casualidade, preservando a noção de uma porção determinada.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. Preferiu-se “propriedade rural” a regionalismos; “estádio” conserva o cenário público romano. A pontuação separa a narrativa da reflexão explicativa. Rascunho necessariamente provisório até a revisão direta do grego.
