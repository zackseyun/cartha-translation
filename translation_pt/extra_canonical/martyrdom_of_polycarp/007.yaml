review_pass:
  verdict: revise
  source_fidelity: O rascunho segue de perto o testemunho inglês fornecido. Contudo, «persistiram» não exprime com clareza que os perseguidores continuaram a procurá-lo; e o pronome em «para que ele cumprisse» fica ambiguamente ligado ao chefe da polícia, quando o referente é Policarpo. «Enquanto ... sofressem» também altera desnecessariamente a afirmação narrativa para uma construção dependente no subjuntivo.
  naturalness: O texto é geralmente claro e de registro adequado. «As próprias pessoas que o traíram» é mais idiomático do que «os próprios que o traíram», e «ansioso para levá-lo» é a regência mais natural nesta construção.
  terminology: «Propriedade rural», «jovens escravizados», «chefe da polícia», «estádio» e «participante com Cristo» são escolhas defensáveis no escopo provisório do testemunho inglês. «Sorte que lhe estava destinada» conserva melhor a imagem de uma porção designada (appointed lot) do que uma formulação que pode soar como determinismo abstrato.
  issues:
  - severity: medium
    issue: «Os que o procuravam persistiram»
    rationale: A formulação portuguesa é elíptica e pode sugerir apenas que perseveraram em sentido genérico. O sentido narrativo é que continuaram a busca.
  - severity: medium
    issue: Ambiguidade de «para que ele cumprisse»
    rationale: Após «O chefe da polícia ... estava ansioso», «ele» pode ser lido como o próprio chefe. Convém nomear Policarpo sem acrescentar interpretação.
  - severity: low
    issue: «enquanto eles ... sofressem»
    rationale: O subjuntivo imperfeito fica sintaticamente atraído pela oração final anterior, embora o texto afirme que os traidores incorriam no castigo. O indicativo torna o paralelismo narrativo claro.
  - severity: low
    issue: «os próprios que o traíram»
    rationale: «As próprias pessoas que o traíram» é mais natural e preserva explicitamente o contraste retórico do testemunho.
  revised_text: 'Os que o procuravam continuaram a procurá-lo, e por isso ele partiu para outra propriedade rural. Imediatamente, os que o procuravam chegaram ali. Como não o encontraram, prenderam dois jovens escravizados, um dos quais confessou sob tortura.


    De fato, era impossível que ele permanecesse escondido, pois as próprias pessoas que o traíram eram de sua casa. O chefe da polícia, que por acaso tinha justamente o nome de Herodes, estava ansioso para levá-lo ao estádio, para que Policarpo cumprisse a sorte que lhe estava destinada, tornando-se participante com Cristo, enquanto eles — os que o traíram — sofriam o castigo do próprio Judas.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego ainda está pendente.
    reason: A fonte submetida informa que a consulta direta à tradição manuscrita grega ainda não foi realizada; a nota torna transparente o grau de segurança do rascunho.
  revision_rationale: A revisão explicita a continuidade da busca, elimina a ambiguidade pronominal quanto a quem cumpre sua porção designada e ajusta a sintaxe narrativa. Mantêm-se as escolhas terminológicas centrais e a ambiguidade do «castigo do próprio Judas».
