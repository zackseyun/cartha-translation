    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: pt
  text: 'Vocês pediram que os acontecimentos lhes fossem relatados mais detalhadamente. Por enquanto, porém, nós os comunicamos de forma resumida por meio de nosso irmão Marciano. Depois de tomarem conhecimento dessas coisas, façam a carta circular também entre os irmãos que estão mais distantes, para que eles também glorifiquem o Senhor, que escolhe dentre os seus próprios servos.


    Àquele que, por sua graça e generosidade, é capaz de conduzir todos nós ao seu reino eterno, por meio de seu Filho unigênito, Jesus Cristo, sejam a glória, a honra, o poder e a grandeza para sempre. Saúdem todos os santos. Os que estão conosco enviam saudações a vocês, assim como Evaristo, que escreveu a carta, e toda a sua casa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. Ainda é necessária a revisão direta da tradição manuscrita grega, inclusive para confirmar nomes próprios e pormenores da formulação.
    reason: A própria ficha da fonte informa que a revisão na língua original está pendente; a nota torna transparente essa limitação textual.
lexical_decisions:
- source_word: certified / informed
  choice: comunicamos
  rationale: Expressa de modo natural a ideia de dar conhecimento ou prestar relato, sem acrescentar a conotação moderna de certificação formal.
- source_word: send the letter about
  choice: façam a carta circular
  rationale: Reproduz claramente a instrução de encaminhar a carta às comunidades mais distantes.
- source_word: maketh election from His own servants
  choice: escolhe dentre os seus próprios servos
  rationale: Mantém a formulação eletiva e a relação partitiva do testemunho, sem desenvolver uma doutrina específica.
- source_word: bounty
  choice: generosidade
  rationale: Termo corrente e digno que comunica liberalidade ou bondade abundante ao lado de 'graça'.
- source_word: only-begotten Son
  choice: Filho unigênito
  rationale: Preserva a linguagem cristológica tradicional e a distinção lexical presente no testemunho.
- source_word: saints
  choice: santos
  rationale: Mantém o vocabulário comunitário cristão antigo sem paráfrase denominacional.
- source_word: house
  choice: casa
  rationale: Preserva a possível referência tanto à família quanto ao conjunto doméstico, em vez de restringi-la a 'família'.
theological_decisions:
- issue: A escolha feita pelo Senhor dentre seus servos
  choice: que escolhe dentre os seus próprios servos
  alternative: que escolhe os seus próprios servos
  rationale: A opção adotada preserva a ideia de seleção 'dentre' um grupo e evita resolver a tensão teológica do enunciado.
- issue: Agência divina e meios da entrada no reino eterno
  choice: por sua graça e generosidade ... por meio de seu Filho unigênito
  alternative: pela graça de seu Filho unigênito
  rationale: Mantém separadas, como no testemunho fornecido, a ação graciosa daquele que conduz e a mediação do Filho.
- issue: Sentido de 'casa' no encerramento
  choice: toda a sua casa
  alternative: toda a sua família
  rationale: A tradução mais formal preserva a amplitude antiga do termo, que pode abranger familiares e demais integrantes do domicílio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural e conserva termos históricos como 'unigênito', 'santos' e 'servos'. O texto evita arcaísmos sintáticos, expansão interpretativa e terminologia confessional específica.
