review_pass:
  verdict: revise
  source_fidelity: 'O texto acompanha de perto o testemunho fornecido: conserva o pedido por um relato mais extenso, o envio por Marciano, a circulação da carta, a eleição dentre os servos, a doxologia e as saudações finais. A formulação sobre a «casa» de Evaristo preserva adequadamente a amplitude de household.'
  naturalness: A redação é clara e de registro apropriado. Contudo, em português moderno de ampla circulação, «Vocês pediram ... lhes fossem relatados» mistura tratamentos na mesma frase, e «nós os comunicamos» é menos idiomático e pode tornar impreciso quem é informado. A revisão uniformiza o tratamento e torna explícito o objeto comunicado.
  terminology: «Senhor», «servos», «Filho unigênito», «santos», «graça», «generosidade» e «casa» são escolhas adequadas, fiéis e não confessionais. «Evaristo» é uma forma portuguesa estabelecida para o nome transmitido no testemunho inglês como Euarestus; a nota provisória adequadamente assinala a necessidade de confirmação na tradição grega.
  issues:
  - severity: low
    issue: Inconsistência de tratamento e construção pouco natural no início.
    rationale: «Vocês» pede normalmente «a vocês», não «lhes», neste registro. Além disso, «comunicamos os acontecimentos» é menos natural do que comunicar os acontecimentos a alguém; «comunicamos esses acontecimentos a vocês» preserva com nitidez o sentido de «have certified/informed you».
  revised_text: 'Vocês pediram que os acontecimentos fossem relatados a vocês mais detalhadamente. Por enquanto, porém, nós comunicamos esses acontecimentos a vocês de forma resumida, por meio de nosso irmão Marciano. Depois de tomarem conhecimento dessas coisas, façam a carta circular também entre os irmãos que estão mais distantes, para que eles também glorifiquem o Senhor, que escolhe dentre os seus próprios servos.


    Àquele que, por sua graça e generosidade, é capaz de conduzir todos nós ao seu reino eterno, por meio de seu Filho unigênito, Jesus Cristo, sejam a glória, a honra, o poder e a grandeza para sempre. Saúdem todos os santos. Os que estão conosco enviam saudações a vocês, assim como Evaristo, que escreveu a carta, e toda a sua casa.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. Ainda é necessária a revisão direta da tradição manuscrita grega, inclusive para confirmar nomes próprios e pormenores da formulação.
    reason: A própria ficha da fonte informa que a revisão na língua original está pendente; a nota torna transparente essa limitação textual.
  revision_rationale: Foi feita apenas uma correção estilística e sintática segura no primeiro período, uniformizando «vocês» e explicitando que os destinatários recebem a comunicação. Não houve alteração de sentido, de termos teológicos, de nomes nem da ambiguidade de «casa».
