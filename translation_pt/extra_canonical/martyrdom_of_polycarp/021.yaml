review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva o conteúdo e a sequência do testemunho: o relato resumido por Marciano, a circulação da carta, a eleição dentre os servos, a doxologia e as saudações finais. «Por meio de seu Filho unigênito» conserva adequadamente a mediação expressa no texto. «Casa» mantém a amplitude de οἶκος. O nome final, porém, deve refletir mais de perto o Euarestus do testemunho e o provável Εὐάρεστος grego, em vez de «Evaristo».'
  naturalness: Há uma inconsistência de tratamento em «Vocês pediram ... lhes fossem relatados», pois «lhes» é de terceira pessoa, enquanto o destinatário é tratado por «vocês». «Informamos vocês ... de modo resumido» é também mais idiomático e direto do que «nós os comunicamos».
  terminology: «Senhor», «graça», «Filho unigênito», «santos», «servos» e «reino eterno» são escolhas adequadas, dignas e não sectárias. «Evaresto» é uma forma portuguesa mais próxima do nome grego/transmitido que «Evaristo»; a nota de provisoriedade continua apropriada enquanto falta a revisão direta da tradição grega.
  issues:
  - severity: medium
    issue: Inconsistência pronominal no primeiro período
    rationale: «Vocês» exige «a vocês» (ou uma reformulação equivalente), não «lhes», que introduz mudança indevida para terceira pessoa.
  - severity: low
    issue: Forma do nome próprio final
    rationale: O testemunho inglês traz «Euarestus», correspondente ao grego provavelmente Εὐάρεστος. «Evaristo» é uma adaptação que não reproduz tão de perto essa forma; «Evaresto» é preferível, com a ressalva da nota textual.
  - severity: low
    issue: Construção pouco natural em «nós os comunicamos»
    rationale: Embora compreensível, a construção é menos fluente e desloca o foco sintático do destinatário que o texto apresenta como informado. «Informamos vocês ...» conserva melhor o sentido.
  revised_text: 'Vocês pediram que os acontecimentos fossem relatados a vocês mais detalhadamente. Por enquanto, porém, por meio de nosso irmão Marciano, informamos vocês dessas coisas de modo resumido. Depois de tomarem conhecimento delas, façam a carta circular também entre os irmãos que estão mais distantes, para que eles também glorifiquem o Senhor, que escolhe dentre os seus próprios servos.


    Àquele que, por sua graça e generosidade, é capaz de conduzir todos nós ao seu reino eterno, por meio de seu Filho unigênito, Jesus Cristo, sejam a glória, a honra, o poder e a grandeza para sempre. Saúdem todos os santos. Os que estão conosco enviam saudações a vocês, assim como Evaresto, que escreveu a carta, e toda a sua casa.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. Ainda é necessária a revisão direta da tradição manuscrita grega, inclusive para confirmar nomes próprios e pormenores da formulação.
    reason: A ficha da fonte informa que a revisão direta da tradição grega permanece pendente; a nota torna essa limitação textual transparente, inclusive quanto à forma dos nomes.
  revision_rationale: A revisão corrige a alternância indevida entre segunda e terceira pessoa, torna mais natural a formulação do relato resumido e aproxima a forma do nome final do testemunho disponível e da provável forma grega, sem alterar o sentido nem resolver questões textuais pendentes. A nota é mantida para registrar explicitamente a limitação da base disponível.
