review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a sequência narrativa, a referência à Igreja universal e a ambiguidade de «grande sábado». Contudo, «com passo firme» atenua o elemento de coragem/resolução expresso por ἀνδρείως; convém explicitá-lo. A formulação da exigência feita a Policarpo pode também conservar mais diretamente a unidade entre a aclamação a César, o ato cultual e a salvação da própria vida.
  naturalness: O português é claro, moderno e de registro apropriado. Pequenos ajustes deixam o diálogo e a marcha final mais próximos do sentido antigo sem perder fluidez.
  terminology: «Igreja universal», «grande sábado», «César é Senhor» e «oferecer sacrifício» são escolhas defensáveis. «Chefe de polícia» funciona como equivalência funcional, desde que a nota mantenha o título administrativo grego e evite identificá-lo sem ressalvas com uma instituição moderna.
  issues:
  - severity: medium
    issue: A expressão «com passo firme e rápido» não traduz plenamente ἀνδρείως.
    rationale: O advérbio transmite coragem, bravura ou resolução, além da rapidez indicada por ταχέως. «Com coragem e rapidez» preserva os dois elementos sem especificar um tipo de passo.
  - severity: low
    issue: A fala dos oficiais separa em excesso elementos que, no texto, formam uma única tentativa de persuasão.
    rationale: 'Ajustar para «dizer: ‘César é Senhor’, oferecer sacrifício e assim salvar a própria vida» torna explícita a relação entre a confissão exigida, o rito e o escape, sem decidir se o sacrifício era especificamente incenso.'
