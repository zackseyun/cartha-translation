review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a sequência narrativa e preserva adequadamente «Igreja universal», «César é Senhor», o sacrifício exigido e a designação não harmonizada de «grande sábado». Contudo, «gente simples» estreita e altera o contraste social de ἐνδόξων τε καὶ ἀδόξων, que contrasta pessoas ilustres/distintas com pessoas sem destaque ou obscuras. O diálogo também pode refletir mais diretamente a coordenação da fala citada, sem introduzir a relação causal de «assim».
  naturalness: O português é claro, moderno e de registro apropriado. A revisão torna o contraste «ilustres e desconhecidas» mais preciso e idiomático, e ajusta a pontuação e a construção do discurso para maior fluidez.
  terminology: «Igreja universal» evita anacronismo denominacional; «grande sábado» conserva a expressão difícil com nota; «chefe da polícia» é uma equivalência funcional aceitável, explicada pela nota; e «oferecer sacrifício» preserva a amplitude de ἐπιθῦσαι.
  issues:
  - severity: medium
    issue: «pessoas de destaque e gente simples» para ἐνδόξων τε καὶ ἀδόξων
    rationale: «Gente simples» pode sugerir humildade, baixa condição econômica ou simplicidade moral. O termo ἀδόξων refere-se mais diretamente à falta de fama, prestígio ou reconhecimento; «pessoas ilustres e desconhecidas» mantém melhor o contraste.
  - severity: low
    issue: Formulação do apelo de Herodes e Nicetes
    rationale: «e assim salvar a própria vida» explicita uma consequência que o texto apresenta coordenadamente. «e em salvar a si mesmo» conserva melhor a estrutura e o tom da pergunta.
  revised_text: 'Quando, por fim, terminou sua oração, depois de se lembrar de todos os que alguma vez haviam cruzado seu caminho — pequenos e grandes, pessoas ilustres e desconhecidas — e de toda a Igreja universal espalhada pelo mundo, chegou a hora de partir. Então o puseram sobre um jumento e o levaram à cidade, pois era um grande sábado.[a]


    Herodes, o chefe da polícia,[b] e seu pai, Nicetes, foram ao encontro dele. Fizeram-no passar para a carruagem deles, sentaram-se ao seu lado e tentaram persuadi-lo, dizendo:


    — Que mal há em dizer: “César é Senhor”, em oferecer sacrifício e em salvar a si mesmo?


    E acrescentaram outras coisas semelhantes. A princípio, ele não lhes deu resposta. Mas, como insistiam, declarou:


    — Não farei o que vocês me aconselham.


    Como não conseguiram persuadi-lo, passaram a ameaçá-lo e o fizeram descer às pressas. Ao sair da carruagem, ele machucou a canela. Sem sequer olhar para trás, seguiu adiante com firmeza e rapidez, como se nada lhe tivesse acontecido, enquanto o conduziam ao estádio. Havia tamanho tumulto no estádio que não se conseguia ouvir a voz de ninguém.'
  revised_footnotes:
  - marker: a
    text: 'Ou: “um sábado importante”. A expressão antiga “grande sábado” é mantida porque sua referência exata é incerta.'
    reason: Preserva a ambiguidade cronológica e litúrgica da expressão.
  - marker: b
    text: O título grego designava um magistrado responsável pela ordem pública, por vezes chamado “eirenarca”.
    reason: Explica a equivalência funcional moderna sem sobrecarregar o texto principal.
  revision_rationale: A revisão corrige o contraste social de «ilustres e desconhecidas», evita uma inferência causal desnecessária no apelo para salvar-se e conserva todas as ambiguidades históricas relevantes, inclusive «grande sábado» e o caráter do ato cultual exigido. As âncoras de notas permanecem corretamente posicionadas e as notas continuam correspondendo aos termos anotados.
