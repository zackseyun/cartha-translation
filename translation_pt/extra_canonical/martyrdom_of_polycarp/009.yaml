base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: pt
  text: 'Quando, por fim, terminou sua oração, depois de se lembrar de todos os que alguma vez haviam cruzado seu caminho — pequenos e grandes, pessoas de destaque e gente simples — e de toda a Igreja universal espalhada pelo mundo, chegou a hora de partir. Então o puseram sobre um jumento e o levaram à cidade, pois era um grande sábado.[a]


    Herodes, o chefe da polícia,[b] e seu pai, Nicetes, foram ao encontro dele. Fizeram-no passar para a carruagem deles, sentaram-se ao seu lado e tentaram persuadi-lo, dizendo:


    — Que mal há em dizer: “César é Senhor”, oferecer sacrifício e assim salvar a própria vida?


    E acrescentaram outras coisas semelhantes. A princípio, ele não lhes deu resposta. Mas, como insistiam, declarou:


    — Não farei o que vocês me aconselham.


    Como não conseguiram persuadi-lo, passaram a ameaçá-lo e o fizeram descer às pressas. Ao sair da carruagem, ele machucou a canela. Sem sequer olhar para trás, seguiu adiante com passo firme e rápido, como se nada lhe tivesse acontecido, enquanto o conduziam ao estádio. Havia ali tamanho tumulto que não se conseguia ouvir a voz de ninguém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sábado importante”. A expressão antiga “grande sábado” é mantida porque sua referência exata é incerta.'
    reason: Preservar a ambiguidade cronológica e litúrgica da expressão.
  - marker: b
    text: O título grego designava um magistrado responsável pela ordem pública, por vezes chamado “eirenarca”.
    reason: Explicar a equivalência funcional moderna sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: καθολικῆς ἐκκλησίας
  choice: Igreja universal
  rationale: Expressa o sentido antigo de totalidade e abrangência mundial sem sugerir, de modo anacrônico, uma denominação posterior.
- source_word: σαββάτου μεγάλου
  choice: grande sábado
  rationale: Mantém a expressão incomum e sua ambiguidade histórica, em vez de identificá-la silenciosamente com uma data litúrgica específica.
- source_word: εἰρήναρχος
  choice: chefe da polícia
  rationale: Usa uma equivalência funcional clara no texto corrente; a nota registra o título administrativo antigo.
- source_word: ἐπιθῦσαι
  choice: oferecer sacrifício
  rationale: Evita limitar o ato a incenso quando o verbo pode designar mais amplamente uma oferta sacrificial no culto imperial.
- source_word: ἐνδόξων τε καὶ ἀδόξων
  choice: pessoas de destaque e gente simples
  rationale: Reproduz o contraste de condição ou reconhecimento social em português natural, sem depreciar o segundo grupo.
- source_word: ἀνδρείως καὶ ταχέως
  choice: com passo firme e rápido
  rationale: Comunica tanto a coragem ou resolução quanto a rapidez da marcha sem recorrer a uma formulação artificial.
theological_decisions:
- issue: Sentido de “César é Senhor”
  choice: César é Senhor
  alternative: O César é senhor
  rationale: Preserva a forma confessional e a tensão com a lealdade cristã, sem acrescentar uma explicação teológica ao corpo do texto.
- issue: Designação da Igreja
  choice: Igreja universal
  alternative: Igreja católica
  rationale: No contexto do século II, o adjetivo aponta para a Igreja inteira espalhada pelo mundo; “universal” reduz o risco de leitura denominacional anacrônica.
- issue: Natureza da oferta exigida
  choice: oferecer sacrifício
  alternative: oferecer incenso
  rationale: Mantém o alcance mais amplo do termo grego e não resolve além da evidência disponível o rito específico exigido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. O diálogo foi disposto em discurso direto para fluidez. A tradução procura refletir a tradição grega conhecida, mas, como o material fornecido informa que a revisão direta do grego ainda está pendente, decisões textuais muito específicas devem ser reavaliadas na auditoria final.
