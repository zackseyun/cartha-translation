revisions:
- from: 'Quando o glorioso Policarpo soube disso, a princípio não ficou de modo algum assustado, mas desejava permanecer na cidade. A maioria, porém, convenceu-o a retirar-se. Então ele se retirou para uma propriedade rural não muito distante da cidade e ali permaneceu com alguns companheiros, sem fazer outra coisa, noite e dia, senão orar por todas as pessoas e pelas igrejas do mundo inteiro, pois esse era seu costume habitual.


