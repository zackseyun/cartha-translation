  to: 'Quando o glorioso Policarpo ouviu isso pela primeira vez, não ficou de modo algum abalado, mas desejava permanecer na cidade. A maior parte das pessoas, porém, convenceu-o a retirar-se. Então ele se retirou para uma propriedade rural não muito distante da cidade e ali permaneceu com alguns companheiros, sem fazer outra coisa, noite e dia, senão orar por todas as pessoas e pelas igrejas do mundo inteiro, pois esse era seu costume habitual.


