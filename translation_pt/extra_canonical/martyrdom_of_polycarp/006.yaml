base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: pt
  text: 'Quando o glorioso Policarpo ouviu isso pela primeira vez, não ficou de modo algum abalado, mas desejava permanecer na cidade. A maior parte das pessoas, porém, convenceu-o a retirar-se. Então ele se retirou para uma propriedade rural não muito distante da cidade e ali permaneceu com alguns companheiros, sem fazer outra coisa, noite e dia, senão orar por todas as pessoas e pelas igrejas do mundo inteiro, pois esse era seu costume habitual.


    Enquanto orava, três dias antes de ser preso, entrou em transe e viu seu travesseiro ardendo em chamas. Então se voltou para os que estavam com ele e disse: “É necessário que eu seja queimado vivo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: glorious
  choice: glorioso
  rationale: Preserva o qualificativo honorífico do testemunho, em registro digno e natural.
- source_word: farm
  choice: propriedade rural
  rationale: Evita restringir o sentido a uma fazenda de grande porte e expressa naturalmente um lugar rural fora da cidade.
- source_word: all men
  choice: todas as pessoas
  rationale: Comunica o sentido humano abrangente em português atual.
- source_word: trance
  choice: transe
  rationale: Mantém a natureza extraordinária da experiência sem defini-la mais precisamente do que o testemunho permite.
- source_word: It must needs be
  choice: É necessário
  rationale: Conserva a linguagem de necessidade, sem explicitar se se trata de necessidade divina, profética ou circunstancial.
theological_decisions:
- issue: Caráter da experiência de Policarpo
  choice: entrou em transe
  alternative: teve uma visão
  rationale: O testemunho distingue o estado extraordinário daquilo que ele viu; a tradução não o reduz nem o amplia a uma revelação formal.
- issue: Necessidade de ser queimado vivo
  choice: É necessário que eu seja queimado vivo
  alternative: Serei queimado vivo
  rationale: Preserva a tensão do enunciado de necessidade e sua possível dimensão profética, sem interpretá-lo apenas como previsão.
