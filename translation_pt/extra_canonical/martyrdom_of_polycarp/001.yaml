base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: pt
  text: 'A igreja de Deus que vive como estrangeira em Esmirna, à igreja de Deus que vive como estrangeira em Filomélio e a todas as comunidades de irmãos e irmãs da santa e universal Igreja, que vive como estrangeira em todos os lugares: que a misericórdia, a paz e o amor da parte de Deus Pai e de nosso Senhor Jesus Cristo lhes sejam multiplicados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega.
    reason: A revisão da língua-fonte ainda está pendente, conforme os metadados fornecidos.
lexical_decisions:
- source_word: sojourneth / sojourning (Greek review pending)
  choice: vive como estrangeira
  rationale: Preserva a imagem de residência temporária e de identidade peregrina presente no testemunho consultado, em linguagem moderna e compreensível.
- source_word: brotherhoods (Greek review pending)
  choice: comunidades de irmãos e irmãs
  rationale: Expressa naturalmente grupos ou comunidades cristãs e torna explícito o sentido coletivo inclusivo de uma designação familiar antiga.
- source_word: holy and universal Church
  choice: santa e universal Igreja
  rationale: Mantém o sentido histórico de universalidade sem empregar uma forma que, no português atual, possa ser entendida apenas como denominação específica.
- source_word: be multiplied
  choice: sejam multiplicados
  rationale: Conserva a fórmula epistolar intensiva e sua cadência solene.
theological_decisions:
- issue: A condição da Igreja como estrangeira
  choice: Repetir a imagem na saudação e na descrição da Igreja universal
  alternative: Traduzir simplesmente por “situada” ou “residente”
  rationale: A repetição preserva a ênfase teológica e retórica do testemunho, sem reduzir a expressão a uma mera indicação geográfica.
- issue: Referência inclusiva de “brotherhoods”
  choice: “comunidades de irmãos e irmãs”
  alternative: “irmandades” ou apenas “irmãos”
  rationale: A formulação comunica o caráter familiar de toda a comunidade cristã sem sugerir uma associação exclusivamente masculina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção preserva o tom formal de uma saudação eclesial antiga sem arcaísmos desnecessários.
