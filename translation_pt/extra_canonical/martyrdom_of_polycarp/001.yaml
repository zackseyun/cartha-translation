  source_fidelity: 'A tradução preserva adequadamente, à luz do testemunho inglês fornecido, a estrutura de saudação: remetente em Esmirna, destinatária em Filomélio, as comunidades ligadas à Igreja santa e universal em toda parte e a bênção final. “Vive como estrangeira” comunica de modo fiel a imagem de sojourning/paroikia sem a reduzir a mera localização. A nota provisória informa corretamente que a conferência direta com o grego ainda está pendente.'
  naturalness: O texto é fluente, solene sem arcaísmo excessivo e compreensível no português internacional com boa legibilidade brasileira. A repetição de “vive como estrangeira” é deliberada e reproduz a ênfase da fórmula de origem. A sintaxe da oração relativa após “Igreja” permite entender naturalmente que a Igreja santa e universal é a que vive como estrangeira em todos os lugares.
  terminology: “Igreja de Deus”, “Deus Pai”, “nosso Senhor Jesus Cristo”, “misericórdia, paz e amor” e “santa e universal Igreja” mantêm os termos e o registro eclesial do testemunho. “Comunidades de irmãos e irmãs” é uma explicitação contemporânea aceitável de “brotherhoods” e não altera a referência coletiva.
