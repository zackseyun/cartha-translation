review_pass:
  verdict: revise
  source_fidelity: A estrutura da saudação, a metáfora de residência estrangeira e a bênção final correspondem ao testemunho inglês fornecido. Contudo, “irmãos e irmãs” explicita um referente que o testemunho fornecido não traz; dado que a revisão direta do grego ainda está pendente, essa expansão não é suficientemente segura. “Comunidades” preserva o sentido coletivo sem acrescentar esse elemento.
  naturalness: A redação é clara e de registro adequadamente solene. A revisão simplifica a oração relativa final e torna uniforme o emprego de “igreja”, evitando que a maiúscula em “Igreja” pareça transformar a expressão descritiva em título denominacional.
  terminology: “vive como estrangeira” é uma solução moderna defensável para a imagem de sojourneth. “Santa e universal igreja” conserva a universalidade/catolicidade histórica sem impor uma leitura denominacional. “Deus Pai” e “nosso Senhor Jesus Cristo” são formulações portuguesas estabelecidas.
  issues:
  - severity: medium
    issue: Expansão de “brotherhoods” para “comunidades de irmãos e irmãs”
    rationale: A inclusão de “e irmãs” pode ser interpretativamente plausível no contexto comunitário, mas não está expressa no testemunho inglês de base. Sem confirmação da tradição grega, a tradução deve evitar explicitá-la como se estivesse no texto.
  - severity: low
    issue: Capitalização inconsistente de “igreja/Igreja”
    rationale: A mudança para maiúscula apenas na expressão “santa e universal Igreja” pode sugerir um nome institucional ou denominacional que não é necessário para o sentido do testemunho.
  revised_text: 'A igreja de Deus que vive como estrangeira em Esmirna, à igreja de Deus que vive como estrangeira em Filomélio e a todas as comunidades da santa e universal igreja, que vive como estrangeira em todo lugar: que a misericórdia, a paz e o amor da parte de Deus Pai e de nosso Senhor Jesus Cristo lhes sejam multiplicados.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega.
    reason: A revisão da língua-fonte ainda está pendente, conforme os metadados fornecidos.
  revision_rationale: A revisão remove uma explicitação inclusiva não atestada pelo texto de base fornecido, mantém a imagem repetida de condição estrangeira e preserva a forma solene da saudação. Também uniformiza a capitalização de “igreja”, sem alterar o sentido eclesial ou a ambiguidade que requer conferência direta do grego.
