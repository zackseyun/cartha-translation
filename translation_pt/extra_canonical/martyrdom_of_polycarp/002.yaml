review_pass:
  verdict: revise
  source_fidelity: O rascunho acompanha de perto o testemunho inglês fornecido. «Pôs fim à perseguição» é uma interpretação aceitável de «stayed the persecution», e a metáfora de «selado-a com seu martírio» é bem preservada. Contudo, «olhando ... para os nossos próprios interesses» estreita «that which concerns ourselves» a interesses; uma formulação mais literal mantém o campo semântico aberto. A revisão direta do grego permanece pendente, conforme informado pela fonte.
  naturalness: O português é claro, moderno e de registro apropriadamente solene. A reformulação da última frase elimina uma construção algo pesada («desejar que não somente a própria pessoa seja salva») e torna explícito, de modo natural, que o amor deseja a salvação tanto própria quanto dos irmãos.
  terminology: «Irmãos», «martírio», «bem-aventurado Policarpo», «ser entregue», «próximo» e «amor verdadeiro e firme» são escolhas adequadas. «Evangelho» é mantido como termo técnico cristão, sem explicitação doutrinária adicional.
  issues:
  - severity: medium
    issue: «os nossos próprios interesses» restringe o referente de «that which concerns ourselves».
    rationale: A expressão da testemunha abrange «aquilo que diz respeito a nós», sem limitar-se a interesses. A revisão preserva essa amplitude.
  - severity: low
    issue: A formulação final torna menos direta a dupla extensão do desejo de salvação.
    rationale: «Desejar não somente a própria salvação, mas também a de todos os irmãos» reproduz de forma mais fluente e nítida a estrutura do original disponível.
  revised_text: 'Irmãos, escrevemos a vocês um relato do que aconteceu aos que sofreram o martírio, especialmente ao bem-aventurado Policarpo, que pôs fim à perseguição, tendo, por assim dizer, selado-a com seu martírio. Pois quase todos os acontecimentos anteriores se deram para que o Senhor nos mostrasse mais uma vez um exemplo de martírio em conformidade com o Evangelho.


    Ele esperou para ser entregue, assim como o Senhor, a fim de que nós também o imitássemos, atentando não somente para o que diz respeito a nós, mas também para o que diz respeito ao próximo. Pois é próprio do amor verdadeiro e firme desejar não somente a própria salvação, mas também a de todos os irmãos.[a]'
  revised_footnotes:
  - marker: a
    text: Esta tradução é provisória e se baseia no testemunho inglês de domínio público fornecido; é necessária uma revisão direta do texto grego da tradição manuscrita.
    reason: A fonte apresentada informa explicitamente que a revisão na língua original ainda está pendente; a nota torna transparente essa limitação textual.
  revision_rationale: 'Foram feitas somente correções seguras de precisão e fluência: substituiu-se a leitura interpretativa «interesses» por uma formulação que conserva a abrangência do referente e reestruturou-se a frase final para refletir claramente o desejo da salvação própria e da dos irmãos. Não se resolveu nenhuma ambiguidade que dependa da futura conferência com o grego.'
