review_pass:
  verdict: revise
  source_fidelity: 'O rascunho transmite com fidelidade o testemunho inglês fornecido e preserva adequadamente as relações centrais: Policarpo detém a perseguição por meio de seu martírio, seu comportamento corresponde ao do Senhor e o amor busca a salvação de todos os irmãos. Contudo, “olhando ... para os nossos próprios interesses” especifica “o que diz respeito a nós” como interesses; essa restrição não está expressa no testemunho e deve ser evitada. A revisão direta contra o grego permanece pendente, como a nota informa.'
  naturalness: O português é claro, moderno e apropriado ao registro epistolar solene. “A vocês” é legível no Brasil e amplamente compreensível. A formulação revista “atentando não somente para o que diz respeito a nós mesmos” é natural e mais próxima do escopo aberto do texto-base.
  terminology: “Irmãos”, “martírio”, “bem-aventurado Policarpo”, “Evangelho”, “ser entregue” e “amor verdadeiro e firme” são escolhas adequadas. “Próximo” preserva bem a linguagem ética tradicional sem impor interpretação confessional.
  issues:
  - severity: medium
    issue: “Para os nossos próprios interesses” restringe o sentido de “that which concerneth ourselves”.
    rationale: O testemunho fala de tudo o que diz respeito a nós e ao próximo, não especificamente de interesses. A tradução deve manter essa amplitude ética e prática.
  revised_text: 'Irmãos, escrevemos a vocês um relato do que aconteceu aos que sofreram o martírio, especialmente ao bem-aventurado Policarpo, que pôs fim à perseguição, tendo, por assim dizer, selado-a com seu martírio. Pois quase todos os acontecimentos anteriores se deram para que o Senhor nos mostrasse mais uma vez um exemplo de martírio em conformidade com o Evangelho.


    Ele esperou para ser entregue, assim como o Senhor, a fim de que nós também o imitássemos, atentando não somente para o que diz respeito a nós mesmos, mas também para o que diz respeito ao próximo. Pois é próprio do amor verdadeiro e firme desejar que não somente a própria pessoa seja salva, mas também todos os irmãos.[a]'
  revised_footnotes:
  - marker: a
    text: Esta tradução é provisória e se baseia no testemunho inglês de domínio público fornecido; é necessária uma revisão direta do texto grego da tradição manuscrita.
    reason: A fonte apresentada informa explicitamente que a revisão na língua original ainda está pendente; a nota torna transparente a limitação textual do rascunho.
  revision_rationale: Foi feita uma correção pontual para não reduzir “o que diz respeito a nós mesmos” a “nossos próprios interesses”. Mantiveram-se as demais escolhas, inclusive a ambiguidade de “ser entregue” e a referência pronominal a Policarpo em “o imitássemos”, coerente com a sequência apresentada pelo testemunho inglês. A capitalização de “Evangelho” acompanha o uso cristão corrente em português.
