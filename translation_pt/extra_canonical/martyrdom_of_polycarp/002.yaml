base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: pt
  text: 'Irmãos, escrevemos a vocês um relato do que aconteceu aos que sofreram o martírio, especialmente ao bem-aventurado Policarpo, que pôs fim à perseguição, tendo, por assim dizer, selado-a com seu martírio. Pois quase todos os acontecimentos anteriores se deram para que o Senhor nos mostrasse mais uma vez um exemplo de martírio em conformidade com o evangelho.


    Ele esperou para ser entregue, assim como o Senhor, a fim de que nós também o imitássemos, olhando não somente para os nossos próprios interesses, mas também para os do próximo. Pois é próprio do amor verdadeiro e firme desejar que não somente a própria pessoa seja salva, mas também todos os irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta tradução é provisória e se baseia no testemunho inglês de domínio público fornecido; é necessária uma revisão direta do texto grego da tradição manuscrita.
    reason: A fonte apresentada informa explicitamente que a revisão na língua original ainda está pendente; a nota torna transparente a limitação textual do rascunho.
lexical_decisions:
- source_word: brethren
  choice: irmãos
  rationale: Forma natural e digna para a saudação comunitária; preserva a linguagem de parentesco espiritual do testemunho disponível.
- source_word: suffered martyrdom
  choice: sofreram o martírio
  rationale: Mantém o sentido técnico cristão de morte testemunhal sem reduzir a expressão simplesmente a “morreram”.
- source_word: blessed Polycarp
  choice: bem-aventurado Policarpo
  rationale: Preserva a qualificação honorífica antiga sem recorrer a uma designação eclesiástica denominacional.
- source_word: stayed the persecution
  choice: pôs fim à perseguição
  rationale: Expressa em português corrente o sentido provável de fazer cessar ou deter a perseguição, embora a revisão grega ainda seja necessária.
- source_word: set his seal upon it
  choice: selado-a
  rationale: Conserva a metáfora do selo e sua relação com o martírio de Policarpo.
- source_word: conformable to the Gospel
  choice: em conformidade com o evangelho
  rationale: Preserva a relação normativa entre o exemplo de martírio e o evangelho, sem explicá-la além do testemunho.
- source_word: linger​ed
  choice: esperou
  rationale: Português natural que comunica a demora deliberada; evita “tardou”, que poderia sugerir atraso involuntário.
- source_word: delivered up
  choice: ser entregue
  rationale: Mantém a correspondência verbal com a entrega do Senhor e evita especificar um agente não expresso.
- source_word: neighbors
  choice: próximo
  rationale: Termo bíblico e corrente que conserva a dimensão ética da referência aos outros.
- source_word: true and steadfast love
  choice: amor verdadeiro e firme
  rationale: Reproduz as duas qualidades do amor em linguagem clara e digna.
theological_decisions:
- issue: Imitação de Policarpo e do Senhor
  choice: “a fim de que nós também o imitássemos”
  alternative: “a fim de que também imitássemos o Senhor”
  rationale: O antecedente gramatical imediato no testemunho inglês é Policarpo, cuja conduta imita a do Senhor. A tradução mantém essa cadeia sem identificar Policarpo com o Senhor.
- issue: Sentido de salvação na frase final
  choice: “seja salva”
  alternative: “seja preservada”
  rationale: Mantém a linguagem soteriológica aberta do testemunho, sem definir se a referência principal é à salvação final, ao livramento no martírio ou a ambas.
- issue: A ação do Senhor nos acontecimentos
  choice: “para que o Senhor nos mostrasse”
  alternative: “de modo que o Senhor nos mostrou”
  rationale: Preserva a formulação teleológica do testemunho, sem resolver questões de providência e causalidade.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento “a vocês” evita regionalismo excessivo; o texto conserva tom epistolar e solene sem arcaísmos. A pontuação e a divisão em dois parágrafos acompanham o fluxo argumentativo do testemunho fornecido.
