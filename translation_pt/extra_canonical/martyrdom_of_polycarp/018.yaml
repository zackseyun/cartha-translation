base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: pt
  text: 'Mas o Maligno, ciumento e invejoso, o adversário da família dos justos, viu a grandeza do martírio de Policarpo, sua vida irrepreensível desde o princípio, como ele havia sido coroado com a coroa da imortalidade e como havia conquistado uma recompensa que ninguém podia contestar. Por isso, providenciou que nem sequer seu pobre corpo nos fosse entregue, embora muitos desejassem recolhê-lo e tocar sua santa carne.


    Então ele incitou Nicetes, pai de Herodes e irmão de Alce, a pedir ao magistrado que não entregasse o corpo, «para que», segundo diziam, «eles não abandonem o crucificado e comecem a adorar esse homem». Isso aconteceu por instigação e insistente súplica dos judeus, que também ficaram de vigia quando estávamos prestes a retirar o corpo do fogo. Eles não sabiam que jamais poderemos abandonar Cristo, que sofreu pela salvação do mundo inteiro dos que são salvos — ele, o irrepreensível, sofreu pelos pecadores —, nem adorar qualquer outro.


    Pois a ele adoramos, por ser o Filho de Deus; mas aos mártires estimamos, como discípulos e imitadores do Senhor, conforme merecem por sua incomparável devoção ao próprio Rei e Mestre. Que também nós sejamos achados participantes e condiscípulos com eles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Evil One
  choice: Maligno
  rationale: Conserva a personificação e o sentido moral do título, em linguagem bíblica corrente.
- source_word: family of the righteous
  choice: família dos justos
  rationale: Mantém a metáfora coletiva sem restringi-la a uma instituição ou linhagem específica.
- source_word: martyrdom
  choice: martírio
  rationale: Termo histórico e teológico já natural em português, incluindo tanto o testemunho quanto a morte sofrida.
- source_word: poor body
  choice: pobre corpo
  rationale: Preserva o tom compassivo do testemunho, sem introduzir uma avaliação depreciativa.
- source_word: holy flesh
  choice: santa carne
  rationale: Mantém a linguagem corporal e reverencial do texto, sem suavizá-la para 'restos mortais'.
- source_word: adore / worship
  choice: adorar
  rationale: Usa o mesmo campo lexical nas duas ocorrências para deixar claro o contraste entre Cristo e os mártires.
- source_word: cherish
  choice: estimamos
  rationale: Expressa honra e afeição sem sugerir que aos mártires se presta a adoração reservada ao Filho de Deus.
- source_word: partakers and fellow-disciples
  choice: participantes e condiscípulos
  rationale: 'Preserva os dois conceitos do testemunho: compartilhar da condição deles e aprender junto com eles.'
theological_decisions:
- issue: Contraste entre a adoração de Cristo e a honra aos mártires
  choice: «a ele adoramos... mas aos mártires estimamos»
  alternative: «a ele veneramos... e aos mártires amamos»
  rationale: A redação conserva a distinção explícita do texto entre o culto dirigido ao Filho de Deus e a estima concedida aos mártires.
- issue: Formulação da extensão da salvação
  choice: «pela salvação do mundo inteiro dos que são salvos»
  alternative: «pela salvação de todo o mundo»
  rationale: A formulação incomum do testemunho foi mantida para não apagar a tensão entre a referência universal ao mundo e a qualificação relativa aos salvos.
- issue: Impecabilidade ou inocência de Cristo
  choice: «ele, o irrepreensível, sofreu pelos pecadores»
  alternative: «embora sem culpa, sofreu pelos pecadores»
  rationale: «Irrepreensível» acompanha o contraste do testemunho sem ampliar a frase para uma formulação dogmática mais técnica.
- issue: Identificação do crucificado
  choice: «o crucificado» na acusação e «Cristo» na resposta
  alternative: substituir ambos por «Jesus Cristo»
  rationale: Mantém a progressão retórica e os títulos tal como aparecem no testemunho, sem explicitação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Mantiveram-se os nomes na forma tradicional portuguesa (Nicetes, Herodes, Alce) e a sintaxe teologicamente tensa da frase sobre «o mundo inteiro dos que são salvos». Como o material fornecido informa que a revisão direta do grego ainda está pendente, este é um rascunho provisório baseado no testemunho inglês público e na camada consultiva da POB.
