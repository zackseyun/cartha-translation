review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva o sentido central e a distinção explícita entre a adoração prestada ao Filho de Deus e a afeição pelos mártires. Ajustes pontuais melhoram a equivalência verbal: a impossibilidade futura de abandonar Cristo, o valor de «amamos» para os mártires e a formulação da inocência de Cristo.'
  naturalness: O registro é moderno, digno e amplamente legível. A revisão suaviza uma construção algo artificial («jamais poderemos») sem perder a força retórica e torna mais natural a oração final sobre os mártires.
  terminology: «Maligno», «martírio», «Cristo», «Filho de Deus», «adoramos» e «condiscípulos» são adequados. «Amamos» representa melhor o verbo afetivo dirigido aos mártires, sem confundi-lo com a adoração reservada a Cristo.
  issues:
  - severity: medium
    issue: «jamais poderemos abandonar Cristo»
    rationale: A construção pode sugerir incapacidade pessoal; o testemunho afirma que nunca será possível que os cristãos abandonem Cristo. A revisão conserva essa impossibilidade enfática.
  - severity: medium
    issue: «aos mártires estimamos»
    rationale: «Estimamos» é possível, mas atenua o verbo de afeição do testemunho. «Amamos» preserva melhor o sentido, enquanto o contraste sintático com «adoramos» impede equiparação cultual.
  - severity: low
    issue: «ele, o irrepreensível»
    rationale: Embora compreensível, «embora sem culpa» traduz de modo mais direto a qualificação concessiva de Cristo que sofreu pelos pecadores.
  revised_text: 'Mas o Maligno, ciumento e invejoso, o adversário da família dos justos, viu a grandeza do martírio de Policarpo, sua vida irrepreensível desde o princípio, como ele havia sido coroado com a coroa da imortalidade e como havia conquistado uma recompensa que ninguém podia contestar. Por isso, providenciou que nem sequer seu pobre corpo fosse levado por nós, embora muitos desejassem fazê-lo e tocar sua santa carne.


    Então ele apresentou Nicetes, pai de Herodes e irmão de Alce, para pedir ao magistrado que não entregasse o corpo, «para que», segundo diziam, «eles não abandonem o crucificado e comecem a adorar esse homem». Isso aconteceu por instigação e insistente súplica dos judeus, que também ficaram de vigia quando estávamos prestes a retirá-lo do fogo. Eles não sabiam que jamais será possível que abandonemos Cristo, que sofreu para a salvação de todo o mundo dos que são salvos — embora sem culpa, sofreu pelos pecadores —, nem que adoremos qualquer outro.


    Pois nós o adoramos, por ser o Filho de Deus; mas amamos os mártires, como discípulos e imitadores do Senhor, como merecem por sua incomparável afeição por seu próprio Rei e Mestre. Que também nós sejamos achados participantes e condiscípulos com eles.'
  revised_footnotes: []
  revision_rationale: Foram feitas apenas correções seguras de sentido e idiomaticidade. «Apresentou» evita atribuir a Nicetes uma incitação que o testemunho não explicita; «fosse levado por nós» mantém a ideia de o corpo não ser retirado pelos cristãos. A fórmula sobre «todo o mundo dos que são salvos» foi preservada, por ser deliberadamente tensa no testemunho e não dever ser harmonizada. Não foram acrescentadas interpretações confessionais nem notas especulativas; a revisão direta da tradição grega continua desejável, conforme o contexto fornecido.
