review_pass:
  verdict: revise
  source_fidelity: 'O texto preserva bem a progressão e o contraste central: o Maligno tenta impedir a recuperação do corpo; a acusação atribui aos cristãos uma suposta troca de culto; e a resposta distingue a adoração do Filho de Deus da afeição e honra pelos mártires. Contudo, «nos fosse entregue» desloca «taken away by us» para uma entrega por terceiros, e «incitou Nicetes» é mais forte e menos preciso que a apresentação/envio de Nicetes para interceder.'
  naturalness: O português é em geral claro e de registro apropriado. A revisão torna a primeira ação mais fiel sem perder fluência e ajusta a construção sobre Nicetes. Mantém-se deliberadamente a formulação tensa sobre «o mundo inteiro dos que são salvos», pois ela reflete a expressão incomum do testemunho.
  terminology: «Maligno», «martírio», «coroa da imortalidade», «Cristo», «Filho de Deus», «adoramos» e «mártires» são adequados. «Estimamos» conserva, sem confundir com adoração, o apreço devido aos mártires. Os nomes Nicetes, Herodes e Alce foram preservados.
  issues:
  - severity: medium
    issue: «nem sequer seu pobre corpo nos fosse entregue»
    rationale: O testemunho diz que o corpo não fosse levado/retirado por «nós», não primariamente que fosse entregue a nós. A redação atual introduz uma relação de entrega que não está explicitada nessa primeira frase.
  - severity: medium
    issue: «ele incitou Nicetes»
    rationale: «Put forward Nicetes ... to plead» descreve Nicetes como aquele apresentado ou enviado para interceder perante o magistrado. «Incitou» sugere sobretudo instigação a uma ação e torna menos explícita sua função de intercessor.
  revised_text: 'Mas o Maligno, ciumento e invejoso, o adversário da família dos justos, viu a grandeza do martírio de Policarpo, sua vida irrepreensível desde o princípio, como ele havia sido coroado com a coroa da imortalidade e como havia conquistado uma recompensa que ninguém podia contestar. Por isso, providenciou para que nem sequer seu pobre corpo fosse retirado por nós, embora muitos desejassem fazê-lo e tocar sua santa carne.


    Então ele apresentou Nicetes, pai de Herodes e irmão de Alce, para interceder junto ao magistrado, a fim de que não entregasse o corpo, «para que», segundo diziam, «eles não abandonem o crucificado e comecem a adorar esse homem». Isso aconteceu por instigação e insistente súplica dos judeus, que também ficaram de vigia quando estávamos prestes a retirar o corpo do fogo. Eles não sabiam que jamais poderemos abandonar Cristo, que sofreu pela salvação do mundo inteiro dos que são salvos — ele, o irrepreensível, sofreu pelos pecadores —, nem adorar qualquer outro.


    Pois a ele adoramos, por ser o Filho de Deus; mas aos mártires estimamos, como discípulos e imitadores do Senhor, conforme merecem por sua incomparável devoção ao próprio Rei e Mestre. Que também nós sejamos achados participantes e condiscípulos com eles.'
  revised_footnotes: []
  revision_rationale: Foram feitas somente correções seguras de relação sintática e de matiz verbal. A formulação escatológica e soteriológica incomum foi mantida, bem como o contraste textual entre adorar Cristo e estimar os mártires. Não são necessárias notas para os pontos revistos, e não há âncoras de nota no rascunho.
