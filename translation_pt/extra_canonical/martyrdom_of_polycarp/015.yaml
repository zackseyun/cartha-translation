review_pass:
  verdict: revise
  source_fidelity: Revisão provisória contra o testemunho inglês fornecido, com atenção à formulação grega subjacente indicada. O rascunho conserva adequadamente a imagem sacrificial, o cálice de Cristo, a ressurreição da alma e do corpo e os sinais editoriais. Contudo, «Por isso» traduz inadequadamente o conectivo narrativo inicial («So»), «agora» foi acrescentado à cláusula sobre o cumprimento, e a doxologia perde o destinatário («a ti») que a construção da oração requer.
  naturalness: 'O registro é digno, moderno e coerente no tratamento por «tu». Foram ajustadas algumas expressões para maior idiomaticidade: «com as mãos postas para trás» passa a «pondo as mãos atrás das costas», e «tenha parte entre o número» passa a «eu receba uma parte entre os mártires».'
  terminology: «Poste», «holocausto», «poderes», «incorruptibilidade» e «Sumo Sacerdote» são escolhas defensáveis. «Sacrifício rico» é mantido por refletir a imagem sacrificial de uma oferta seletiva/valiosa, embora seja uma formulação marcada em português. Os colchetes do testemunho são preservados por meio das notas ancoradas.
  issues:
  - severity: medium
    issue: Conectivo inicial «Por isso»
    rationale: O inglês «So» neste contexto é narrativo-consecutivo («Então»), não causal ou inferencial («Por isso»).
  - severity: medium
    issue: Adição de «agora» em «e agora realizaste»
    rationale: O testemunho diz que Deus preparou, revelou de antemão e realizou; «agora» não está expresso e restringe desnecessariamente a formulação.
  - severity: high
    issue: Doxologia final sem destinatário explícito
    rationale: A oração é dirigida ao Pai, e a fórmula subjacente atribui-lhe glória por meio do Filho, com ele e com o Espírito Santo. «Seja dada glória» sem «a ti» deixa a relação sintática e teológica incompleta.
  revised_text: 'Então não o pregaram, mas o amarraram. Ele, pondo as mãos atrás das costas e sendo amarrado ao poste, como um carneiro nobre tirado de um grande rebanho para uma oferta — um holocausto preparado e aceitável a Deus —, levantou os olhos ao céu e disse:


    “Ó Senhor Deus Todo-Poderoso, Pai do teu amado e bendito Filho, Jesus Cristo, por meio de quem recebemos o conhecimento de ti; Deus dos anjos, dos poderes, de toda a criação e de toda a linhagem dos justos que vivem em tua presença: eu te bendigo porque me concedeste este dia e esta hora, para que eu receba uma parte entre os mártires, no cálice do teu Cristo[a], para a ressurreição da vida eterna, tanto da alma como do corpo, na incorruptibilidade do Espírito Santo.


    Que eu seja recebido hoje entre eles, em tua presença, como sacrifício rico e aceitável, conforme preparaste e revelaste de antemão e realizaste, tu que és o Deus fiel e verdadeiro. Por essa razão, e também por todas as coisas, eu te louvo, te bendigo e te glorifico por meio do eterno e celestial Sumo Sacerdote, Jesus Cristo, teu amado Filho. Por meio dele, com ele e com o Espírito Santo, seja dada glória a ti, agora e para sempre[b], pelos séculos vindouros. Amém.”'
  revised_footnotes:
  - marker: a
    text: «Teu» aparece entre colchetes no testemunho inglês fornecido, indicando uma restauração ou incerteza textual.
    reason: Registra o sinal editorial do testemunho sem inserir colchetes ambíguos no fluxo da oração.
  - marker: b
