base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: pt
  text: 'Por isso, não o pregaram, mas o amarraram. Então ele, com as mãos postas para trás e preso ao poste, semelhante a um carneiro nobre, tirado de um grande rebanho para ser oferecido — um holocausto preparado e aceitável a Deus —, ergueu os olhos ao céu e disse:


    “Ó Senhor Deus Todo-Poderoso, Pai do teu amado e bendito Filho, Jesus Cristo, por meio de quem recebemos o conhecimento de ti; Deus dos anjos, dos poderes e de toda a criação, e de toda a linhagem dos justos que vivem em tua presença: eu te bendigo porque me concedeste este dia e esta hora, para que eu tenha parte entre o número dos mártires, no cálice do teu Cristo[a], para a ressurreição da vida eterna, tanto da alma como do corpo, na incorruptibilidade do Espírito Santo.


    Que eu seja recebido hoje entre eles em tua presença como sacrifício rico e aceitável, conforme preparaste e revelaste de antemão e agora realizaste, tu que és o Deus fiel e verdadeiro. Por essa razão, e também por todas as coisas, eu te louvo, te bendigo e te glorifico por meio do eterno e celestial Sumo Sacerdote, Jesus Cristo, teu amado Filho. Por meio dele, com ele e com o Espírito Santo, seja dada glória, agora e para sempre[b], pelos séculos vindouros. Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Teu” aparece entre colchetes no testemunho inglês fornecido, indicando uma restauração ou incerteza textual.
    reason: Registra o sinal editorial do testemunho sem inserir colchetes ambíguos no fluxo da oração.
  - marker: b
    text: “Para sempre” aparece entre colchetes no testemunho inglês fornecido, indicando uma restauração ou incerteza textual.
    reason: Preserva a informação textual associada às palavras suplementares da doxologia.
lexical_decisions:
- source_word: tied / bound to the stake
  choice: amarraram / preso ao poste
  rationale: Distingue o ato inicial de amarrar da condição de Policarpo junto ao poste, em português corrente e claro.
- source_word: noble ram
  choice: carneiro nobre
  rationale: Preserva a imagem sacrificial explícita sem substituí-la por uma formulação interpretativa.
- source_word: burnt sacrifice
  choice: holocausto
  rationale: Emprega o termo sacrificial tradicional para uma oferta inteiramente queimada; o contexto impede o sentido histórico moderno de dominar a leitura.
- source_word: powers
  choice: poderes
  rationale: Mantém o termo amplo do testemunho, sem determinar de forma indevida uma ordem angelical específica.
- source_word: whole race of the righteous
  choice: toda a linhagem dos justos
  rationale: Preserva o sentido coletivo e genealógico de “race” evitando a conotação biológica moderna de “raça”.
- source_word: incorruptibility
  choice: incorruptibilidade
  rationale: Conserva o vocabulário escatológico e a ligação direta com a ressurreição da alma e do corpo.
- source_word: High-priest
  choice: Sumo Sacerdote
  rationale: Equivalente português consagrado e imediatamente reconhecível para o título cristológico.
theological_decisions:
- issue: Participação no cálice de Cristo
  choice: “tenha parte entre o número dos mártires, no cálice do teu Cristo”
  alternative: “seja contado entre os mártires ao participar do cálice do teu Cristo”
  rationale: Mantém a construção e sua tensão sacramental e martirial sem explicar de que modo se dá essa participação.
- issue: Ressurreição da alma e do corpo
  choice: “para a ressurreição da vida eterna, tanto da alma como do corpo”
  alternative: “para a vida eterna na ressurreição da alma e do corpo”
  rationale: Segue de perto o testemunho fornecido e não harmoniza a formulação com um esquema antropológico posterior.
- issue: Doxologia final e relações entre os referentes
  choice: “Por meio dele, com ele e com o Espírito Santo, seja dada glória”
  alternative: “por meio de quem, com ele e com o Espírito Santo, seja glória”
  rationale: Torna a frase compreensível em português, mas preserva a coordenação do Filho e do Espírito na doxologia sem acrescentar um destinatário ausente no testemunho fornecido.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com tratamento por “tu” coerente ao longo da oração. A cadência litúrgica foi preservada sem arcaísmos verbais. Este rascunho é necessariamente provisório: foi elaborado a partir do testemunho inglês público fornecido, pois a revisão direta da tradição manuscrita grega ainda está pendente.'
