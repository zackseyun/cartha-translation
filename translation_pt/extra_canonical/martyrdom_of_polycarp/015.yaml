base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: pt
  text: 'Por isso, não o pregaram, mas o amarraram. Então ele, com as mãos postas para trás e preso ao poste, semelhante a um carneiro nobre, tirado de um grande rebanho para ser oferecido — um holocausto preparado e aceitável a Deus —, ergueu os olhos ao céu e disse:


    “Ó Senhor Deus Todo-Poderoso, Pai do teu amado e bendito Filho, Jesus Cristo, por meio de quem recebemos o conhecimento de ti; Deus dos anjos, dos poderes e de toda a criação, e de toda a linhagem dos justos que vivem em tua presença: eu te bendigo porque me concedeste este dia e esta hora, para que eu tenha parte entre o número dos mártires, no cálice do teu Cristo[a], para a ressurreição da vida eterna, tanto da alma como do corpo, na incorruptibilidade do Espírito Santo.


    Que eu seja recebido hoje entre eles em tua presença como sacrifício rico e aceitável, conforme preparaste e revelaste de antemão e agora realizaste, tu que és o Deus fiel e verdadeiro. Por essa razão, e também por todas as coisas, eu te louvo, te bendigo e te glorifico por meio do eterno e celestial Sumo Sacerdote, Jesus Cristo, teu amado Filho. Por meio dele, com ele e com o Espírito Santo, seja dada glória, agora e para sempre[b], pelos séculos vindouros. Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Teu” aparece entre colchetes no testemunho inglês fornecido, indicando uma restauração ou incerteza textual.
    reason: Registra o sinal editorial do testemunho sem inserir colchetes ambíguos no fluxo da oração.
  - marker: b
