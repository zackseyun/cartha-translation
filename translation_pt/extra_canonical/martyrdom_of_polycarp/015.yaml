review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a imagética sacrificial, a referência ao cálice de Cristo, a ressurreição da alma e do corpo e a doxologia. Há, porém, dois pequenos acréscimos/nuances não apoiados pelo testemunho: «Por isso» sugere causalidade, onde «So» é melhor reproduzido por «Assim»; e «agora realizaste» acrescenta «agora», ausente do texto-base.'
  naturalness: O registro é digno, claro e apropriado a uma oração martirial. «Sacrifício rico» é compreensível, mas pouco idiomático em português contemporâneo nesse contexto; «sacrifício precioso e aceitável» mantém o valor positivo e sacrificial com maior naturalidade. A sintaxe da doxologia fica mais direta com «seja a glória».
  terminology: «Poste», «holocausto», «poderes», «incorruptibilidade» e «Sumo Sacerdote» são escolhas defensáveis e fiéis ao testemunho. «Te bendigo» é apropriado ao registro devocional. As notas preservam corretamente os dois sinais editoriais de colchetes transmitidos pelo testemunho inglês.
  issues:
  - severity: low
    issue: «Por isso» para «So they did not nail him»
    rationale: «Por isso» introduz uma relação causal que o testemunho não explicita. «Assim» conserva melhor a ligação narrativa sem acrescentar causalidade.
  - severity: low
    issue: «e agora realizaste»
    rationale: O advérbio «agora» não consta do testemunho fornecido e especifica indevidamente o tempo do cumprimento.
  - severity: low
    issue: «sacrifício rico»
    rationale: Embora formalmente próximo de «rich sacrifice», a expressão soa pouco natural em português atual. «Sacrifício precioso» transmite melhor o valor de algo digno e valioso oferecido a Deus, sem alteração doutrinária.
  revised_text: 'Assim, não o pregaram, mas o amarraram. Então ele, colocando as mãos atrás das costas e preso ao poste, como um carneiro nobre tirado de um grande rebanho para ser oferecido — um holocausto preparado e aceitável a Deus —, ergueu os olhos ao céu e disse:


    “Ó Senhor Deus Todo-Poderoso, Pai do teu amado e bendito Filho, Jesus Cristo, por meio de quem recebemos o conhecimento de ti; Deus dos anjos, dos poderes, de toda a criação e de toda a linhagem dos justos que vivem em tua presença: eu te bendigo porque me concedeste este dia e esta hora, para que eu tenha parte entre o número dos mártires, no cálice do teu Cristo[a], para a ressurreição da vida eterna, tanto da alma como do corpo, na incorruptibilidade do Espírito Santo.


    Que eu seja recebido hoje entre eles, em tua presença, como sacrifício precioso e aceitável, conforme preparaste e revelaste de antemão e realizaste, tu que és o Deus fiel e verdadeiro. Por essa razão, e também por todas as coisas, eu te louvo, te bendigo e te glorifico por meio do eterno e celestial Sumo Sacerdote, Jesus Cristo, teu amado Filho. Por meio dele, com ele e com o Espírito Santo, seja a glória, agora e para sempre[b], pelos séculos vindouros. Amém.”'
