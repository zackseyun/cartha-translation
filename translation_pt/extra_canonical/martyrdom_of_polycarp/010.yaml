base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: pt
  text: 'Quando Policarpo entrou no estádio, veio-lhe do céu uma voz: “Seja forte, Policarpo, e tenha coragem.” Ninguém viu quem falava, mas os nossos que estavam presentes ouviram a voz. Por fim, quando ele foi levado adiante, houve um grande tumulto, pois tinham ouvido que Policarpo havia sido preso.


    Quando o levaram à sua presença, o procônsul perguntou se era mesmo ele. Ao confessar que sim, o procônsul tentou convencê-lo a negar, dizendo: “Tenha consideração pela sua idade”, e outras coisas semelhantes, como costumam dizer: “Jure pela fortuna de César[a]; arrependa-se e diga: ‘Fora com os ateus!’” Então Policarpo, com expressão solene, olhou para toda a multidão de pagãos sem lei que estava no estádio e fez um gesto com a mão em direção a eles. Depois, gemendo e erguendo os olhos ao céu, disse: “Fora com os ateus!”


    Mas o magistrado insistiu com veemência: “Faça o juramento, e eu o libertarei. Insulte o Cristo.” Policarpo respondeu: “Há oitenta e seis anos que o sirvo, e ele nunca me fez mal algum. Como, então, poderia blasfemar contra o meu Rei, que me salvou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Týche de César”. A expressão refere-se à Fortuna, ou potência tutelar, associada ao imperador no contexto religioso e político romano; jurar por ela era um ato de lealdade cultual a César.
    reason: Καίσαρος τύχην emprega o termo grego para Fortuna/Týche. A nota esclarece o referente histórico sem identificar de modo impreciso o termo com “gênio”.
lexical_decisions:
- source_word: ἀνδρίζου
  choice: tenha coragem
  rationale: O imperativo significa literalmente portar-se como homem, mas no uso antigo comunica sobretudo coragem e firmeza; a formulação escolhida preserva o sentido sem reproduzir um idiomatismo de gênero pouco natural no português atual.
- source_word: Καίσαρος τύχην
  choice: espírito protetor de César
  rationale: A expressão remete à Týche ou potência tutelar do imperador, objeto de lealdade cultual. “Gênio de César” seria tecnicamente possível, mas em português moderno poderia ser entendido como inteligência extraordinária.
- source_word: ἄθεοι
  choice: ateus
  rationale: Mantém a acusação antiga dirigida aos cristãos por rejeitarem os deuses cívicos e também a inversão irônica de Policarpo contra a multidão pagã.
- source_word: λοιδόρησον τὸν Χριστόν
  choice: Amaldiçoe o Cristo
  rationale: Expressa o ato público de insultar ou ultrajar Cristo exigido pelo magistrado; “amaldiçoar” é natural no contexto de renúncia religiosa, embora o verbo também possa ser traduzido por “injuriar”.
- source_word: δεδουλεύω αὐτῷ
  choice: eu o tenho servido
  rationale: O verbo contém a imagem de servir como escravo, mas aqui designa a fidelidade contínua de Policarpo a Cristo. A construção verbal preserva a duração até o presente.
theological_decisions:
- issue: Objeto da negação pretendida pelo procônsul
  choice: “tentou convencê-lo a negar”, sem complemento explícito
  alternative: “tentou convencê-lo a negar Cristo”
  rationale: A testemunha inglesa torna o objeto implícito, embora o contexto indique Cristo. Mantê-lo implícito evita explicitar no texto principal algo que depende da reconstrução contextual.
- issue: Sentido dos oitenta e seis anos
  choice: “Durante oitenta e seis anos eu o tenho servido”
  alternative: “Há oitenta e seis anos sou seu servo” ou entender a frase como referência à idade de Policarpo
  rationale: A tradução preserva a declaração de duração sem decidir se os oitenta e seis anos contam desde o nascimento ou desde a conversão/batismo.
- issue: Título “o Cristo”
  choice: “o Cristo”
  alternative: “Cristo”
  rationale: O artigo preserva o caráter titular da expressão e acompanha a formulação da exigência judicial, sem transformar “Cristo” apenas em nome próprio.
- issue: Afirmação de salvação
  choice: “meu Rei, que me salvou”
  alternative: “meu Rei e Salvador”
  rationale: Mantém a oração relativa e não converte a afirmação verbal em título teológico composto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “procônsul”, “magistrado”, “pagãos” e “blasfemar” por serem termos históricos ou religiosos ainda correntes. Como a revisão direta do grego foi indicada como pendente no material fornecido, o texto foi elaborado com apoio da testemunha inglesa e conferência lexical cautelosa da tradição grega normalmente atestada para MartPol. 9; pontos de possível ambiguidade foram preservados ou registrados.
