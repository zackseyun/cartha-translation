review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a testemunha inglesa e preserva adequadamente a referência a Policarpo, a atribuição da oposição «pelos judeus», a ambiguidade de «conforme o costume deles» e a linguagem elevada sobre os ossos. «Mais puros do que ouro refinado» é defensável para a comparação de excelência/pureza subjacente a «finer than refined gold». Contudo, a formulação de alegria deve refletir melhor a dupla expressão intensiva «gladness and joy». A revisão direta do grego continua necessária, pois o material fornecido é uma testemunha inglesa.
  naturalness: O texto é claro e de registro apropriado. «Onde o Senhor nos permitirá» reproduz mais naturalmente a relação com «um lugar apropriado» do que a construção independente «Ali o Senhor nos permitirá». «Júbilo e alegria» é mais idiomático e mais intenso que «contentamento e alegria» neste contexto celebrativo.
  terminology: «Centurião», «martírio», «aniversário», «luta», «treinamento» e «preparação» são escolhas adequadas. «Conforme o costume deles» deve permanecer, pois não se deve resolver o antecedente do pronome sem confirmação do grego e de seu contexto textual.
  issues:
  - severity: low
    issue: «contentamento e alegria» atenua a primeira expressão de alegria.
    rationale: A testemunha diz «in gladness and joy», com duas expressões coordenadas de celebração jubilosa. «Com júbilo e alegria» conserva melhor a intensidade e a distinção.
  - severity: low
    issue: «Ali o Senhor nos permitirá» torna menos explícita a ligação relativa com o lugar mencionado.
    rationale: A testemunha introduz o local como «where the Lord will permit us». «Onde o Senhor nos permitirá» preserva diretamente essa função.
  revised_text: 'Por isso, quando o centurião viu a oposição levantada pelos judeus, colocou Policarpo no meio e o queimou conforme o costume deles.


    Depois, recolhemos os ossos dele, mais valiosos do que pedras preciosas e mais puros do que ouro refinado, e os depositamos num lugar apropriado,


    onde o Senhor nos permitirá reunir-nos, conforme nos for possível, com júbilo e alegria, e celebrar o aniversário de seu martírio, em memória dos que já combateram na luta e para o treinamento e a preparação dos que ainda haverão de fazê-lo.'
  revised_footnotes: []
  revision_rationale: 'Foram feitas apenas duas correções estilístico-semânticas seguras: a oração relativa ligada ao lugar foi restaurada com «onde», e «contentamento» foi substituído por «júbilo» para representar melhor a celebração intensa expressa pela testemunha. Permanecem a ambiguidade de «deles», a referência direta aos judeus presente no texto-base e a formulação não doutrinariamente ampliada sobre o aniversário do martírio.'
