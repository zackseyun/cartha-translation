review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a testemunha inglesa e preserva adequadamente a ambiguidade de «conforme o costume deles». Contudo, «mais puros do que ouro refinado» estreita «finer» a uma qualidade específica (pureza) que não é exigida pela formulação recebida; «mais nobres» mantém melhor a comparação elevada sem essa especificação.
  naturalness: O texto é claro, moderno e de registro apropriado. «Seus ossos» é ligeiramente mais fluente e digno que «os ossos dele» neste contexto. «Mais nobres que ouro refinado» é natural em português e conserva o paralelismo encomiástico.
  terminology: «Centurião», «Policarpo», «martírio» e «luta» são escolhas adequadas. «Aniversário de seu martírio» transmite o sentido do aniversário comemorativo sem acrescentar uma explicação doutrinal. A referência coletiva aos judeus é mantida como no testemunho, sem ampliação interpretativa.
  issues:
  - severity: low
    issue: «mais puros do que ouro refinado»
    rationale: «Finer than refined gold» expressa excelência ou qualidade superior; «puros» explicita pureza e pode soar redundante com «ouro refinado». «Mais nobres que ouro refinado» preserva melhor o elogio comparativo sem restringir seu sentido.
  - severity: low
    issue: «os ossos dele»
    rationale: Não é incorreto, mas «seus ossos» é mais natural no registro narrativo solene e evita uma nuance coloquial desnecessária.
  revised_text: 'Por isso, quando o centurião viu a oposição levantada pelos judeus, colocou Policarpo no meio e o queimou conforme o costume deles.


    Depois, recolhemos seus ossos, mais valiosos que pedras preciosas e mais nobres que ouro refinado, e os depositamos num lugar apropriado.


    Ali o Senhor nos permitirá reunir-nos, conforme nos for possível, com contentamento e alegria, e celebrar o aniversário de seu martírio, em memória dos que já combateram na luta e para o treinamento e a preparação dos que ainda haverão de fazê-lo.'
  revised_footnotes: []
  revision_rationale: 'Foram feitas apenas duas correções estilístico-semânticas seguras: a comparação com o ouro deixa de especificar «pureza», e o possessivo foi tornado mais natural. Permanecem a ordem narrativa, o nome suprido pela camada inglesa POB, a referência coletiva presente na testemunha e a ambiguidade de «conforme o costume deles». A revisão direta do grego continua desejável, pois o material de partida fornecido é uma testemunha inglesa.'
