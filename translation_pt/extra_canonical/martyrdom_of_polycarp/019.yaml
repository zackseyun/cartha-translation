base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: pt
  text: 'Por isso, quando o centurião viu a oposição levantada pelos judeus, colocou Policarpo no meio e o queimou conforme o costume deles.


    Depois, recolhemos os ossos dele, mais valiosos do que pedras preciosas e mais puros do que ouro refinado, e os depositamos num lugar apropriado.


    Ali o Senhor nos permitirá reunir-nos, conforme nos for possível, com contentamento e alegria, e celebrar o aniversário de seu martírio, em memória dos que já combateram na luta e para o treinamento e a preparação dos que ainda haverão de fazê-lo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: centurion
  choice: centurião
  rationale: Termo histórico corrente e imediatamente compreensível em português.
- source_word: opposition raised on the part of the Jews
  choice: a oposição levantada pelos judeus
  rationale: Mantém a atribuição coletiva presente na testemunha fornecida sem intensificá-la nem explicar além do texto.
- source_word: after their custom
  choice: conforme o costume deles
  rationale: Preserva a ambiguidade do referente de “deles”, sem decidir se se refere aos judeus, aos romanos ou a outro costume de tratamento do corpo.
- source_word: finer than refined gold
  choice: mais puros do que ouro refinado
  rationale: Expressa a comparação de excelência e pureza em português natural.
- source_word: birth-day of his martyrdom
  choice: aniversário de seu martírio
  rationale: Conserva o sentido antigo de aniversário da morte martirial sem introduzir explicitamente a interpretação teológica de nascimento para a vida eterna.
- source_word: contest
  choice: luta
  rationale: Mantém a metáfora atlética ou agonística em linguagem corrente, sem reduzir o martírio a uma competição esportiva literal.
theological_decisions:
- issue: Referente de “conforme o costume deles”
  choice: 'Manter o pronome ambíguo: “deles”'
  alternative: Explicitar “conforme o costume dos judeus” ou “conforme o costume romano”
  rationale: A evidência fornecida não permite resolver com segurança o referente, e a tradução não deve eliminar uma ambiguidade genuína.
- issue: Sentido de “aniversário” aplicado ao martírio
  choice: “aniversário de seu martírio”
  alternative: “dia de seu nascimento para a vida eterna”
  rationale: A alternativa explicita uma interpretação teológica tradicional que não aparece de modo completo na formulação testemunhada.
- issue: Valor atribuído às relíquias
  choice: Traduzir diretamente a comparação dos ossos com pedras preciosas e ouro
  alternative: Atenuar como simples expressão de estima
  rationale: A linguagem elevada faz parte do testemunho e deve ser preservada sem acrescentar uma doutrina posterior sobre relíquias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação é provisória porque o material fornecido é uma testemunha inglesa de domínio público e a revisão direta do grego ainda está pendente. O nome “Policarpo”, suprido pela camada inglesa POB para clareza, foi mantido no primeiro parágrafo; no restante, conservaram-se os pronomes da testemunha.
