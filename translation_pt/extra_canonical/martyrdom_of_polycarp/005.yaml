review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha com precisão o testemunho inglês fornecido: Quinto recua ao ver as feras; ele havia impelido a si mesmo e outros a comparecer voluntariamente; o procônsul o persuade a jurar e a oferecer incenso; e a comunidade não louva a autoentrega voluntária. A ressalva sobre a pendência de revisão direta do grego deve permanecer.'
  naturalness: «Havia pressionado a si» não é formulação natural em português e enfraquece o sentido forte de «forced himself». «Havia forçado a si mesmo» é idiomático e preserva a construção deliberadamente incomum, segundo a qual ele constrangeu a si próprio juntamente com outros.
  terminology: «Procônsul», «prestar o juramento», «oferecer incenso» e «evangelho» são adequados. «Se entregam espontaneamente» comunica a autoentrega sem transformar a afirmação em condenação absoluta.
  issues:
  - severity: medium
    issue: Formulação não natural de «forced himself»
    rationale: «Ele mesmo havia pressionado a si» soa calcado e pouco idiomático. «Ele mesmo havia forçado a si mesmo e alguns outros» conserva tanto a força verbal quanto a referência expressa a ele próprio.
  revised_text: Mas um homem chamado Quinto, frígio que havia chegado recentemente da Frígia, perdeu a coragem ao ver as feras. Ele mesmo havia forçado a si mesmo e alguns outros a se apresentarem por vontade própria. Depois de muita insistência, o procônsul o convenceu a prestar o juramento e a oferecer incenso. Por isso, irmãos, não elogiamos os que se entregam espontaneamente, pois o evangelho não nos ensina a agir assim.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada em uma antiga versão inglesa de domínio público; a revisão direta do texto grego ainda está pendente.
    reason: A fonte fornecida informa que a consulta à tradição manuscrita grega ainda não foi concluída; a nota torna transparente a base documental limitada.
  revision_rationale: 'Foi feita uma única correção segura de naturalidade e fidelidade semântica: substituiu-se a expressão pouco idiomática «pressionado a si» por «forçado a si mesmo». Mantiveram-se a ambiguidade quanto ao teor do juramento, a formulação cultual «oferecer incenso», o singular «evangelho» e a nota de transparência sobre a base inglesa provisória.'
