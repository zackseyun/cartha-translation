base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: pt
  text: Mas um homem chamado Quinto, frígio que havia chegado recentemente da Frígia, perdeu a coragem ao ver as feras. Ele mesmo havia pressionado a si e a alguns outros a se apresentarem por vontade própria. Depois de muita insistência, o procônsul o convenceu a prestar o juramento e a oferecer incenso. Por isso, irmãos, não elogiamos os que se entregam espontaneamente, pois o evangelho não nos ensina a agir assim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada em uma antiga versão inglesa de domínio público; a revisão direta do texto grego ainda está pendente.
    reason: A fonte fornecida informa que a consulta à tradição manuscrita grega ainda não foi concluída; a nota torna transparente a base documental limitada.
lexical_decisions:
- source_word: turned coward
  choice: perdeu a coragem
  rationale: Expressa de modo natural e digno o colapso da coragem diante das feras, sem recorrer a um rótulo excessivamente pejorativo.
- source_word: forced himself
  choice: havia pressionado a si
  rationale: Preserva a ideia incomum de que Quinto impeliu a si mesmo, além de outros, a comparecer voluntariamente.
- source_word: come forward of their own free will
  choice: se apresentarem por vontade própria
  rationale: Indica comparecimento voluntário perante as autoridades, sem sugerir que tenham sido presos.
- source_word: swear the oath
  choice: prestar o juramento
  rationale: Mantém a referência ao juramento exigido pelas autoridades, sem especificar seu teor além da evidência disponível.
- source_word: offer incense
  choice: oferecer incenso
  rationale: Conserva a linguagem cultual e a ação concreta mencionada no testemunho.
- source_word: deliver themselves up
  choice: se entregam espontaneamente
  rationale: Torna explícito que se trata de autoentrega voluntária, em contraste com a prisão sofrida sem provocação.
- source_word: Gospel
  choice: evangelho
  rationale: Emprega o termo cristão corrente sem decidir se a referência é a uma narrativa escrita específica ou ao ensino evangélico em sentido amplo.
theological_decisions:
- issue: Avaliação da apresentação voluntária ao martírio
  choice: não elogiamos os que se entregam espontaneamente
  alternative: condenamos os que se entregam espontaneamente
  rationale: O testemunho diz que tais pessoas não são elogiadas; evita-se intensificar isso para uma condenação absoluta.
- issue: Sentido de «evangelho»
  choice: o evangelho não nos ensina a agir assim
  alternative: os Evangelhos não nos ensinam a agir assim
  rationale: Mantém o singular e preserva a possível amplitude entre a mensagem evangélica e um texto evangélico, sem impor uma identificação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário cristão amplamente reconhecível. Preservou-se a repetição Frígia/frígio e a tensão entre iniciativa voluntária, recuo diante das feras e ausência de elogio evangélico.
