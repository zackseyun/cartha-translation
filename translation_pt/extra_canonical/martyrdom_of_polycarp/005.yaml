review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha com precisão o testemunho inglês fornecido: Quinto, frígio recém-chegado da Frígia, perde a coragem ao ver as feras; ele havia compelido a si mesmo e a outros a apresentar-se voluntariamente; o procônsul o persuade a jurar e oferecer incenso; e o narrador declara não louvar os que se entregam. A revisão direta do grego permanece pendente, como a nota informa.'
  naturalness: O texto é claro e mantém registro sóbrio e moderno. Contudo, «havia pressionado a si» não é construção idiomática em português e enfraquece o sentido de compulsão presente no testemunho. «Havia forçado a si mesmo e a alguns outros» é natural e preserva a formulação incomum sem alterar o significado.
  terminology: «Procônsul», «prestar o juramento», «oferecer incenso» e «evangelho» são adequados. «Feras» comunica bem «wild beasts» no contexto de arena. «Se entregam espontaneamente» preserva a autoentrega voluntária sem transformar a não aprovação em condenação absoluta.
  issues:
  - severity: medium
    issue: Construção não idiomática em «Ele mesmo havia pressionado a si e a alguns outros».
    rationale: Em português moderno, «pressionar a si» soa artificial e é menos preciso que «forçar a si mesmo». A troca preserva a tensão do texto — Quinto constrangera a si próprio e outros a comparecer voluntariamente — sem diluir a força verbal.
  revised_text: Mas um homem chamado Quinto, frígio que havia chegado recentemente da Frígia, perdeu a coragem ao ver as feras. Ele havia forçado a si mesmo e a alguns outros a se apresentarem por vontade própria. Depois de muita insistência, o procônsul o convenceu a prestar o juramento e a oferecer incenso. Por isso, irmãos, não elogiamos os que se entregam espontaneamente, pois o evangelho não nos ensina a agir assim.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada em uma antiga versão inglesa de domínio público; a revisão direta do texto grego ainda está pendente.
    reason: A fonte fornecida informa que a consulta à tradição manuscrita grega ainda não foi concluída; a nota torna transparente a base documental limitada.
  revision_rationale: A única alteração necessária substitui uma expressão pouco natural por uma formulação portuguesa clara que conserva o sentido de «forced himself and some others». O restante do texto e a nota de transparência documental são mantidos.
