source:
  text: 'But thanks be to God; for He verily prevailed against all. For the right noble Germanicus encouraged their timorousness through the constancy which was in him; and he fought with the wild beasts in a signal way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used violence and dragged the wild beast towards him, desiring the more speedily to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry, ''Away with the atheists; let search be made for Polycarp.'''
