base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: pt
  text: 'Mas graças sejam dadas a Deus, pois ele de fato prevaleceu contra todos. O nobilíssimo Germânico fortaleceu os que estavam temerosos por meio da firmeza que havia nele e enfrentou as feras de maneira extraordinária. Quando o procônsul tentou persuadi-lo e ordenou que tivesse compaixão de sua própria juventude, ele avançou com ímpeto e puxou a fera para si, desejando obter mais depressa a libertação desta vida injusta e sem lei.


    Depois disso, toda a multidão, admirada com a coragem do povo dos cristãos, amado por Deus e temente a Deus, começou a gritar: “Fora com os ateus! Procurem Policarpo!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “ateus” era uma acusação dirigida aos cristãos por rejeitarem os deuses reconhecidos pelo culto público. O grito da multidão é, portanto, hostil e não uma descrição da fé cristã.
    reason: Esclarece um uso histórico que pode parecer contraditório ou ser mal interpretado pelo leitor moderno.
lexical_decisions:
- source_word: ἐνδοξότατος / right noble
  choice: nobilíssimo
  rationale: Mantém o tom honorífico elevado aplicado a Germânico sem recorrer a uma formulação excessivamente arcaica.
- source_word: δειλία / timorousness
  choice: os que estavam temerosos
  rationale: Expressa naturalmente em português o temor do grupo que foi fortalecido pelo exemplo de Germânico, evitando o tom depreciativo de “covardia”.
- source_word: ὑπομονή / constancy
  choice: firmeza
  rationale: Comunica constância corajosa e perseverante no contexto do martírio.
- source_word: ἐβιάσατο / used violence
  choice: avançou com ímpeto
  rationale: Representa a ação vigorosa de Germânico sem sugerir, de modo impreciso, violência contra outra pessoa.
- source_word: ἀπαλλαγῆναι / obtain a release
  choice: obter ... a libertação
  rationale: Preserva a imagem de ser liberto da vida presente, sem explicitar além do texto se isso significa morte, salvação ou ambas.
- source_word: ἄθεοι / atheists
  choice: ateus
  rationale: Conserva a acusação antiga e a ironia contextual de a multidão aplicar aos cristãos a designação de impiedade ou ateísmo.
theological_decisions:
- issue: Referente de “ele prevaleceu contra todos”
  choice: Manter o pronome “ele” sem identificar explicitamente o referente
  alternative: Explicitar “Deus prevaleceu contra todos” ou atribuir a vitória a Germânico
  rationale: A redação fornecida apresenta possível tensão referencial; a tradução não deve resolver silenciosamente a ambiguidade antes da revisão direta do grego.
- issue: Avaliação cristã da morte como libertação
  choice: “libertação desta vida injusta e sem lei”
  alternative: “livrar-se deste mundo injusto e sem lei”
  rationale: Mantém a perspectiva do mártir sem acrescentar uma doutrina específica sobre o mundo material ou o estado após a morte.
- issue: “Povo dos cristãos” amado e temente a Deus
  choice: Preservar os dois qualificativos
  alternative: Simplificar para “os cristãos devotos”
  rationale: Os qualificativos têm densidade teológica própria e caracterizam a relação dos cristãos com Deus em ambas as direções.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A redação é provisória porque o material fornecido declara que a revisão direta da tradição manuscrita grega ainda está pendente; por isso, ambiguidades potencialmente dependentes do grego foram preservadas sempre que possível.
