lexical_decisions:
- source_word: God speed
  choice: Desejamos que tudo lhes vá bem em Deus
  rationale: Reproduz a saudação e o desejo de bem-estar sob o cuidado divino sem recorrer ao arcaísmo português “Deus vos acompanhe”.
- source_word: walk by the word
  choice: andam segundo a palavra
  rationale: Conserva a metáfora antiga de conduta (“andar”) e expressa a palavra como norma orientadora.
- source_word: suffered martyrdom / is martyred
  choice: sofreu o martírio
  rationale: Formulação natural e dignificada que preserva o sentido técnico do testemunho mediante a morte.
- source_word: papers
  choice: escritos
  rationale: Evita sugerir folhas modernas e abrange adequadamente os documentos ou registros atribuídos a Irineu.
- source_word: gathering it together
  choice: Reuni o texto
  rationale: Comunica o trabalho de recomposição ou reunião do exemplar deteriorado sem afirmar uma reconstrução editorial mais específica do que o testemunho permite.
- source_word: catholic rule of the Church
  choice: regra católica da Igreja
  rationale: Mantém o vocabulário histórico, acrescentando nota para esclarecer o sentido antigo de universalidade sem apagar a formulação recebida.
- source_word: city of the Romans
  choice: cidade dos romanos
  rationale: Preserva a expressão indireta do testemunho em vez de normalizá-la simplesmente como “Roma”.
theological_decisions:
- issue: Doxologia inicial e referente de “with whom”
  choice: “Por meio dele, seja dada glória a Deus”
  alternative: “Com ele, seja dada glória a Deus” ou “a quem seja a glória”
  rationale: O testemunho inglês apresenta uma construção sintaticamente difícil. A tradução preserva a distinção entre Cristo e Deus sem transformar silenciosamente a frase em uma doxologia dirigida exclusivamente a Cristo.
- issue: Sentido de “católica”
  choice: Manter “regra católica da Igreja” com esclarecimento em nota
  alternative: Traduzir diretamente como “regra universal da Igreja”
  rationale: A manutenção do termo conserva a linguagem histórica, enquanto a nota impede uma leitura denominacional anacrônica.
- issue: Revelação de Policarpo a Piônio
  choice: “Policarpo apareceu a mim numa revelação” / “em obediência a uma revelação”
  alternative: Parafrasear como sonho, visão ou inspiração
  rationale: Preserva a afirmação do copista e a diferença existente entre as duas formas textuais, sem definir a natureza da experiência.
- issue: Eleitos e reino celestial
  choice: Manter “seus eleitos” e “seu reino celestial”
  alternative: Generalizar como “seu povo” e “o céu”
  rationale: Conserva a terminologia teológica e a oração do testemunho sem resolver questões de eleição ou escatologia.
- issue: Doxologias divergentes
  choice: Preservar “com o Pai e o Espírito Santo” na primeira forma e “com o Pai, o Filho e o Espírito Santo” na forma de Moscou
  alternative: Harmonizar ambas em fórmula trinitária idêntica
  rationale: As diferenças entre as formas manuscritas são textualmente e teologicamente relevantes e não devem ser apagadas.
translation_notes:
  register: Português moderno, amplamente internacional, com legibilidade brasileira e tom histórico digno. Mantiveram-se nomes tradicionais em português (Gaio, Irineu, Sócrates, Piônio, Isócrates, Marcião, Policarpo e Esmirna). O texto é necessariamente provisório porque o material fornecido identifica o testemunho inglês de domínio público como base e informa que a revisão direta do grego ainda está pendente. A forma alternativa do manuscrito de Moscou foi preservada integralmente, inclusive em suas diferenças de nomes, formulação da revelação e doxologia.
