translation:
  language: pt
  text: 'Desejamos que tudo lhes vá bem em Deus, irmãos, enquanto vocês andam segundo a palavra de Jesus Cristo, que está de acordo com o evangelho. Por meio dele, seja dada glória a Deus pela salvação dos seus santos eleitos, assim como o bem-aventurado Policarpo sofreu o martírio. Que também a nós seja concedido ser encontrados seguindo os seus passos no reino de Jesus Cristo.


    Gaio copiou este relato dos escritos de Irineu, discípulo de Policarpo. Gaio também conviveu com Irineu.


    E eu, Sócrates, transcrevi-o em Corinto a partir da cópia de Gaio. A graça esteja com todos.


    E eu, Piônio, tornei a transcrevê-lo a partir da cópia mencionada, depois de procurá-la — pois o bem-aventurado Policarpo apareceu a mim numa revelação, como relatarei mais adiante. Reuni o texto quando o manuscrito já estava quase inteiramente desgastado pelo tempo, para que o Senhor Jesus Cristo também me reúna com os seus eleitos em seu reino celestial. A ele seja a glória, com o Pai e o Espírito Santo, para todo o sempre. Amém.


    Os três parágrafos anteriores, conforme aparecem no manuscrito de Moscou:[a]


    Gaio copiou este relato dos escritos de Irineu. Gaio conviveu com Irineu, que havia sido discípulo do santo Policarpo. Esse Irineu estava em Roma na época do martírio do bispo Policarpo e instruiu muitas pessoas. Circulam também muitos tratados seus, excelentes e ortodoxos. Neles, menciona Policarpo e diz que foi instruído por ele. Irineu refutou habilmente toda heresia e transmitiu a regra católica da Igreja[b] tal como a havia recebido do santo. Ele também relata que, certa vez, Marcião — de quem os marcionitas receberam o nome — encontrou o santo Policarpo e lhe disse: “Reconheça-nos, Policarpo”. Policarpo respondeu a Marcião: “Sim, reconheço o primogênito de Satanás”. Nos escritos de Irineu encontra-se ainda a afirmação de que, no mesmo dia e na mesma hora em que Policarpo sofreu o martírio em Esmirna, Irineu, estando na cidade dos romanos, ouviu uma voz semelhante ao som de uma trombeta, que dizia: “Policarpo sofreu o martírio”.


    Portanto, como já foi dito, Gaio fez uma cópia desses escritos de Irineu; e Isócrates fez outra em Corinto a partir da cópia de Gaio.


    E eu, Piônio, tornei a transcrevê-lo a partir da cópia de Isócrates, depois de procurá-la em obediência a uma revelação do santo Policarpo. Reuni o texto quando o manuscrito já estava quase inteiramente desgastado pelo tempo, para que o Senhor Jesus Cristo também me reúna com os seus eleitos em seu reino celestial. A ele seja a glória, com o Pai, o Filho e o Espírito Santo, para todo o sempre. Amém.


    [a] O manuscrito de Moscou traz uma forma alternativa dos três parágrafos anteriores; essa forma é reproduzida a seguir.


    [b] Aqui, “católica” significa “universal” e descreve a regra de fé da Igreja em seu conjunto; não funciona, neste contexto antigo, como nome de uma denominação moderna específica.'
