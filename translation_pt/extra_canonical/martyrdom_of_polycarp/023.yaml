source:
  text: 'We bid you God speed, brethren, while ye walk by the word of Jesus Christ which is according to the Gospel; with whom be glory to God for the salvation of His holy elect; even as the blessed Polycarp suffered martyrdom, in whose footsteps may it be our lot to be found in the kingdom of Jesus Christ.


    This account Gaius copied from the papers of Irenaeus, a disciple of Polycarp. The same also lived with Irenaeus.


    And I Socrates wrote it down in Corinth from the copy of Gaius. Grace be with all men.


    And I Pionius again wrote it down from the aforementioned copy, having searched it out (for the blessed Polycarp showed me in a revelation, as I will declare in the sequel), gathering it together when it was now well nigh worn out by age, that the Lord Jesus Christ may gather me also with His elect into His heavenly kingdom; to whom be the glory with the Father and the Holy Spirit for ever and ever. Amen.


    The three proceeding paragraphs as read in the Moscow ms. This account Gaius copied from the papers of Irenaeus. The same lived with Irenaeus who had been a disciple of the holy Polycarp. For this Irenaeus, being in Rome at the time of the martyrdom of the bishop Polycarp, instructed many; and many most excellent and orthodox treatises by him are in circulation. In these he makes mention of Polycarp, saying that he was taught by him. And he ably refuted every heresy, and handed down the catholic rule of the Church just as he had received it from the saint. He mentions this fact also, that when Marcion, after whom the Marcionites are called, met the holy Polycarp on one occasion, and said ''Recognize us, Polycarp,'' he said in reply to Marcion, ''Yes indeed, I recognize the firstborn of Satan.'' The following statement also is made in the writings of Irenaeus, that on the very day and hour when Polycarp was martyred in Smyrna Irenaeus being in the city of the Romans heard a voice as of
    a trumpet saying, '' Polycarp is martyred.''


    From these papers of Irenaeus then, as has been stated already, Gaius made a copy, and from the copy of Gaius Isocrates made another in Corinth.


    And I Pionius again wrote it down from the copy of Isocrates, having searched for it in obedience to a revelation of the holy Polycarp, gathering it together, when it was well nigh worn out by age, that the Lord Jesus Christ may gather me also with His elect into His heavenly kingdom; to whom be the glory with the Father and the Son and the Holy Spirit for ever and ever. Amen.'
