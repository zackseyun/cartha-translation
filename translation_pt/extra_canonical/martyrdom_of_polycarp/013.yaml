base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: pt
  text: 'Ao dizer essas coisas e muitas outras, ele se encheu de coragem e alegria, e seu rosto ficou cheio de graça. Longe de se abater diante do que lhe diziam, ele deixou o procônsul admirado. Então o procônsul mandou seu próprio arauto proclamar três vezes no meio do estádio: “Policarpo confessou que é cristão.”


    Quando o arauto fez essa proclamação, toda a multidão de gentios e judeus que moravam em Esmirna gritou com fúria incontrolável e em alta voz: “Este é o mestre da Ásia, o pai dos cristãos, o destruidor dos nossos deuses, aquele que ensina muitos a não oferecer sacrifícios nem prestar culto.” Enquanto diziam essas coisas, gritavam bem alto e pediam a Filipe, o asiarca[a], que soltasse um leão contra Policarpo. Ele, porém, respondeu que isso não lhe era permitido, pois já havia encerrado os jogos.


    Então todos, em uníssono, gritaram que Policarpo fosse queimado vivo. Pois era necessário que se cumprisse a visão que ele tivera a respeito de seu travesseiro: enquanto orava, ele o viu em chamas e, voltando-se, disse profeticamente aos fiéis que estavam com ele: “É necessário que eu seja queimado vivo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Asiarca: título dado a um importante oficial provincial ligado à organização e ao patrocínio de festivais e jogos públicos na província romana da Ásia.'
    reason: O título histórico não possui equivalente português exato e pode ser desconhecido para leitores modernos.
lexical_decisions:
- source_word: countenance ... filled with grace
  choice: seu rosto ficou cheio de graça
  rationale: Preserva a formulação teologicamente evocativa e a referência concreta ao semblante, sem reduzir 'graça' a mera serenidade.
- source_word: herald
  choice: arauto
  rationale: Termo histórico compreensível para o oficial encarregado da proclamação pública.
- source_word: Gentiles
  choice: gentios
  rationale: Mantém a distinção histórica entre os grupos mencionados no relato, em linguagem bíblica amplamente reconhecível.
- source_word: father of the Christians
  choice: pai dos cristãos
  rationale: Conserva a linguagem honorífica e acusatória da multidão sem reinterpretar sua função eclesiástica.
- source_word: Asiarch
  choice: asiarca
  rationale: Retém o título cívico-religioso histórico, acompanhado de nota explicativa.
- source_word: must needs
  choice: era necessário / é necessário
  rationale: Preserva a linguagem de necessidade narrativa e profética, sem definir explicitamente se se trata de determinação divina, cumprimento providencial ou convicção do mártir.
theological_decisions:
- issue: A graça visível no rosto de Policarpo
  choice: cheio de graça
  alternative: sereno; cheio de encanto
  rationale: Mantém a possível ressonância teológica do termo e também seu sentido de presença graciosa, sem escolher apenas uma nuance.
- issue: Necessidade do cumprimento da visão
  choice: era necessário que se cumprisse
  alternative: tinha de acontecer; estava destinado a cumprir-se
  rationale: Preserva a tensão do relato entre profecia, providência e necessidade narrativa sem acrescentar uma explicação doutrinária.
- issue: Declaração final de Policarpo
  choice: É necessário que eu seja queimado vivo
  alternative: Serei queimado vivo
  rationale: Mantém a modalidade de necessidade presente no testemunho, em vez de convertê-la numa simples previsão.
translation_notes:
  register: Português moderno, digno e narrativamente claro, com ampla legibilidade brasileira. A tradução segue provisoriamente o testemunho inglês de domínio público fornecido, pois a revisão direta do grego ainda está pendente. Mantêm-se os termos históricos e a linguagem profética sem modernização excessiva.
