review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto a testemunha inglesa, mas introduz o nome «Policarpo» onde a passagem diz apenas «o homem»/«ele», e explicita «prender» em duas ocorrências nas quais a testemunha fala mais amplamente de agir «contra» um ladrão e de ter vindo «contra» o ancião. A revisão remove essas explicitações e conserva a referência anafórica do texto. A consulta direta à tradição grega continua pendente conforme os dados fornecidos.
  naturalness: 'O texto é geralmente claro e digno. Foram ajustadas formulações menos naturais ou menos exatas: «servissem uma mesa» passa a «preparassem uma mesa», «firmeza» a «constância», e «chegando todos juntos» a «chegando em grupo».'
  terminology: «Rapaz», «guardas e cavaleiros», «ladrão», «graça de Deus» e «ancião venerável» são escolhas aceitáveis no registro solicitado. «Constância» reproduz melhor o termo da testemunha do que «firmeza».
  issues:
  - severity: medium
    issue: Inserção do nome «Policarpo»
    rationale: A testemunha fornecida usa «the man himself» e depois pronomes; embora o contexto identifique a personagem, inserir o nome no corpo da tradução acrescenta informação não expressa nesta unidade textual.
  - severity: medium
    issue: Explicitação de «prender»
    rationale: «As though against a robber» e «they had come against» não dizem explicitamente «prender». «Como se fossem atrás de um ladrão» e «tinham vindo contra» preservam a formulação mais ampla.
  - severity: low
    issue: «Servissem uma mesa»
    rationale: Em português moderno, serve-se uma refeição; para a ordem de preparar a mesa, «preparassem uma mesa» é mais idiomático e fiel a «a table should be spread».
  - severity: low
    issue: «Firmeza» para «constancy»
    rationale: «Constância» preserva diretamente a ideia de perseverança/estabilidade admirada pelos presentes.
  revised_text: 'Assim, levando o rapaz consigo, na sexta-feira, por volta da hora da ceia, os guardas e os cavaleiros saíram com suas armas de costume, apressando-se como se fossem atrás de um ladrão. Chegando em grupo já tarde da noite, encontraram o próprio homem deitado numa cama, num quarto no andar de cima de uma pequena casa. Embora pudesse ter saído dali para outro lugar, não quis, dizendo: “Seja feita a vontade de Deus”.


    Quando soube que eles tinham chegado, desceu e conversou com eles. Os que estavam presentes admiravam-se de sua idade e de sua constância, perguntando-se por que havia tanto empenho em capturar um homem idoso como ele. Então, imediatamente, ordenou que preparassem uma mesa para que comessem e bebessem, naquela hora, quanto quisessem. E os persuadiu a lhe conceder uma hora para orar sem ser perturbado.


    Quando consentiram, ele se pôs de pé e orou, tão cheio da graça de Deus que, durante duas horas, não conseguiu se calar. Os que o ouviam ficaram admirados, e muitos se arrependeram de terem vindo contra um ancião tão venerável.'
