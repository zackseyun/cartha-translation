base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: pt
  text: 'Assim, levaram o rapaz consigo e, na sexta-feira, por volta da hora da ceia, os guardas e os cavaleiros saíram com suas armas de costume, apressando-se como se fossem prender um ladrão. Chegando todos juntos já tarde da noite, encontraram o próprio Policarpo deitado num quarto no andar de cima de uma pequena casa. Embora pudesse ter saído dali para outro lugar, não quis, dizendo: “Seja feita a vontade de Deus”.


    Quando soube que haviam chegado, desceu e conversou com eles. Os que estavam presentes admiravam-se de sua idade e firmeza, perguntando-se por que havia tanto empenho em prender um homem tão idoso. Então Policarpo ordenou imediatamente que lhes servissem uma mesa, para que comessem e bebessem àquela hora quanto quisessem. E os convenceu a lhe conceder uma hora para orar sem ser perturbado.


    Quando consentiram, ele se pôs de pé e orou, tão cheio da graça de Deus que, por duas horas, não conseguiu se calar. Os que o ouviam ficaram admirados, e muitos se arrependeram de ter vindo prender um ancião tão venerável.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: rapaz
  rationale: Mantém a referência genérica a um jovem sem especificar uma idade não indicada pela testemunha disponível.
- source_word: gendarmes and horsemen
  choice: guardas e cavaleiros
  rationale: Expressa de modo natural os agentes armados e a tropa montada, evitando o tom moderno e institucional de “gendarmes” em português.
- source_word: robber
  choice: ladrão
  rationale: Preserva o sentido e a possível ressonância narrativa da testemunha, sem intensificá-lo para “bandido” ou “salteador”.
- source_word: constancy
  choice: firmeza
  rationale: Comunica perseverança e estabilidade de caráter em linguagem atual e digna.
- source_word: unmolested
  choice: sem ser perturbado
  rationale: Forma idiomática que mantém o pedido de poder orar sem interrupção ou interferência.
- source_word: could not hold his peace
  choice: não conseguiu se calar
  rationale: Preserva a expressão enfática de oração prolongada, sem sugerir incapacidade física literal.
- source_word: venerable old man
  choice: ancião tão venerável
  rationale: Mantém tanto a idade avançada quanto o respeito despertado por Policarpo.
theological_decisions:
- issue: A frase “Seja feita a vontade de Deus” pode ser lida como resignação, obediência ou confiança providencial.
  choice: Seja feita a vontade de Deus.
  alternative: Que se cumpra a vontade de Deus.
  rationale: A formulação escolhida preserva a tensão e a conhecida cadência bíblica sem explicar a intenção interior de Policarpo.
- issue: “Cheio da graça de Deus” pode ser interpretado de diferentes modos teológicos.
  choice: tão cheio da graça de Deus
  alternative: tomado pela graça de Deus
  rationale: Segue de perto a testemunha e evita definir como a graça atuava ou importar uma doutrina confessional específica.
- issue: Identificação do referente por nome.
  choice: Policarpo
  alternative: o homem / ele
  rationale: O nome esclarece naturalmente o referente em português em dois pontos, sem alterar o conteúdo narrativo; o título e o contexto identificam a personagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução é provisória porque o material fornecido declara pendente a revisão direta do grego; por isso, evita reconstruções lexicais gregas não verificadas e se ancora na testemunha inglesa pública, consultando a POB inglesa apenas como camada auxiliar. Não foram usadas notas de rodapé, portanto não há marcadores no texto.
