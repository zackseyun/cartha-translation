    Quando soube que haviam chegado, desceu e conversou com eles. Os que estavam presentes admiravam-se de sua idade e firmeza, perguntando-se por que havia tanto empenho em prender um homem tão idoso. Então Policarpo ordenou imediatamente que lhes pusessem a mesa, para que comessem e bebessem àquela hora quanto quisessem. E os convenceu a lhe conceder uma hora para orar sem ser perturbado.


    Quando consentiram, ele se pôs de pé e orou, tão cheio da graça de Deus que, por duas horas, não conseguiu se calar. Os que o ouviam ficaram admirados, e muitos se arrependeram de terem vindo contra um ancião tão venerável.'
