base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: pt
  text: 'Mas ele insistiu e voltou a dizer: “Jure pelo gênio de César.” Policarpo respondeu: “Se você supõe em vão que jurarei pelo gênio de César, como você afirma, e finge não saber quem sou, ouça com clareza: sou cristão. Mas, se deseja conhecer o ensino do cristianismo, marque uma data e conceda-me uma audiência.”


    O procônsul disse: “Convença o povo.” Policarpo, porém, respondeu: “Eu o considerei digno de uma conversa, pois fomos ensinados a prestar aos governantes e às autoridades constituídas por Deus a honra devida, desde que ela não nos cause dano. Quanto a estes, porém, não os considero dignos de que eu apresente minha defesa diante deles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: genius of Caesar
  choice: gênio de César
  rationale: Mantém o termo histórico-religioso referente ao espírito tutelar divinizado de César; evita substituí-lo por 'espírito', que poderia perder a referência cultual específica.
- source_word: doctrine of Christianity
  choice: ensino do cristianismo
  rationale: Em português atual, 'ensino' comunica naturalmente o conteúdo da fé sem a possível rigidez técnica de 'doutrina'.
- source_word: assign a day and give me a hearing
  choice: marque um dia e conceda-me uma audiência
  rationale: Reproduz a solicitação formal por uma ocasião determinada para ser ouvido.
- source_word: Prevail upon the people
  choice: Convença o povo
  rationale: Preserva a ordem breve do procônsul e o sentido de persuadir a multidão.
- source_word: princes and authorities appointed by God
  choice: governantes e autoridades constituídas por Deus
  rationale: Usa linguagem política ampla e contemporânea, mantendo a afirmação de que tais autoridades foram estabelecidas por Deus.
- source_word: defend myself before them
  choice: apresente minha defesa diante deles
  rationale: Conserva a nuance forense e pública da fala, sem sugerir defesa física.
theological_decisions:
- issue: Honra devida às autoridades e limite dessa honra
  choice: “a devida honra, desde que isso não nos cause dano”
  alternative: “a honra apropriada, contanto que não nos prejudique”
  rationale: 'Mantém a tensão do testemunho: as autoridades constituídas por Deus recebem honra adequada, mas essa obrigação não é apresentada como ilimitada quando envolve dano ou comprometimento.'
- issue: Identidade cristã confessada publicamente
  choice: “sou cristão”
  alternative: “eu sou cristão”
  rationale: A forma concisa preserva a clareza e a força confessional do original testemunhado.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para refletir a interpelação direta sem arcaísmo. “Gênio de César” foi preservado como expressão histórica específica; uma edição anotada poderá explicá-la como referência ao espírito tutelar de César. O texto é provisório, pois a revisão direta do grego ainda está pendente e a redação se apoia no testemunho inglês de domínio público fornecido.
