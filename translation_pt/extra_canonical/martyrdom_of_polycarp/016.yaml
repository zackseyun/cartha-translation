base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: pt
  text: 'Depois que ele pronunciou o amém e terminou sua oração, os encarregados do fogo acenderam a fogueira. Uma chama poderosa irrompeu, e nós, a quem foi concedido ver, contemplamos algo maravilhoso. Sim, fomos preservados para contar aos demais o que aconteceu.


    O fogo tomou a forma de uma abóbada, como a vela de um navio enfunada pelo vento, e formou uma parede ao redor do corpo do mártir. E ele estava ali no meio, não como carne queimada, mas como [um pão no forno ou como] ouro e prata refinados numa fornalha. Percebemos um aroma tão agradável como se fosse o perfume de incenso ou de alguma outra especiaria preciosa trazido pelo vento.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: offered up the Amen
  choice: pronunciou o amém
  rationale: Expressa de modo natural o encerramento solene da oração sem acrescentar uma ideia sacrificial que não pode ser confirmada enquanto a revisão direta do grego estiver pendente.
- source_word: firemen / those tending the fire
  choice: os encarregados do fogo
  rationale: Evita o sentido moderno de bombeiros e designa claramente os responsáveis por acender a fogueira.
- source_word: vault
  choice: abóbada
  rationale: Preserva a imagem arquitetônica de uma estrutura curva formada pelas chamas.
- source_word: sail ... filled by the wind
  choice: vela de um navio enfunada pelo vento
  rationale: Usa a expressão portuguesa natural para uma vela inflada pelo vento.
- source_word: martyr
  choice: mártir
  rationale: Mantém o termo histórico e religioso consagrado, sem ampliação interpretativa.
- source_word: frankincense
  choice: incenso
  rationale: É a designação corrente e amplamente compreensível da resina aromática mencionada.
theological_decisions:
- issue: Caráter miraculoso do acontecimento
  choice: Preservar o relato testemunhal como afirmação do narrador
  alternative: Atenuar o episódio como mera impressão ou comparação subjetiva
  rationale: O texto apresenta o fenômeno como maravilha vista por testemunhas; a tradução não deve confirmar nem racionalizar além do relato.
- issue: Linguagem de preservação providencial
  choice: “fomos preservados para contar”
  alternative: “sobrevivemos e assim pudemos contar”
  rationale: Mantém a possível dimensão providencial e a finalidade expressa no testemunho, sem identificar explicitamente o agente.
- issue: Estado do corpo em meio ao fogo
  choice: Manter as comparações do pão e dos metais refinados
  alternative: Explicar a cena como proteção sobrenatural do corpo
  rationale: A redação conserva as imagens e a tensão do texto sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e narrativo, com ampla legibilidade brasileira. Mantiveram-se os colchetes do testemunho fornecido como sinal de restauração textual ou dano manuscrito. Esta versão é provisória, pois foi elaborada a partir do testemunho inglês de domínio público e a revisão direta da tradição manuscrita grega ainda está pendente.
