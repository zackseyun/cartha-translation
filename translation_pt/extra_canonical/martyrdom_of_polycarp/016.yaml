review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência narrativa, a imagem da chama em forma de abóbada, a comparação com uma vela enfunada e a finalidade de as testemunhas relatarem o ocorrido. Contudo, “carne queimada” pode sugerir carne já consumida ou previamente queimada, enquanto a comparação descreve carne ardendo no fogo. A explicitação do referente de “ele” também torna mais claro que se trata do corpo do mártir, sem acrescentar interpretação.
  naturalness: O português é fluente, moderno e de registro narrativo apropriado. “Encarregados do fogo” evita corretamente o anacronismo de “bombeiros”. “O corpo do mártir estava ali no meio” é mais claro e natural do que o pronome potencialmente ambíguo.
  terminology: “Mártir”, “abóbada”, “vela ... enfunada”, “fornalha” e “incenso” são escolhas adequadas. Mantêm-se os colchetes, pois o trecho entre eles é assinalado como textual ou restaurado no testemunho de base. “Amém” é grafado com inicial maiúscula por tratar-se da fórmula litúrgica mencionada como expressão específica.
  issues:
  - severity: medium
    issue: “carne queimada” para “flesh burning”
    rationale: A formulação portuguesa tende a designar carne já queimada; “carne ardendo” conserva melhor a ação em curso e o contraste narrativo.
  - severity: low
    issue: Pronome “ele” após “o corpo do mártir”
    rationale: Embora recuperável pelo contexto, o pronome pode ter referente menos imediato; repetir “o corpo do mártir” preserva a ênfase da cena e elimina ambiguidade.
  - severity: low
    issue: Grafia de “Amém”
    rationale: A maiúscula reproduz mais de perto o tratamento da fórmula litúrgica como expressão determinada no testemunho inglês, sem alterar o sentido.
  revised_text: 'Depois que ele pronunciou o Amém e terminou sua oração, os encarregados do fogo acenderam a fogueira. Uma chama poderosa irrompeu, e nós, a quem foi concedido ver, contemplamos algo maravilhoso. Sim, fomos preservados para contar aos demais o que aconteceu.


    O fogo tomou a forma de uma abóbada, como a vela de um navio enfunada pelo vento, e formou uma parede ao redor do corpo do mártir. O corpo do mártir estava ali no meio, não como carne ardendo, mas como [um pão no forno ou como] ouro e prata refinados numa fornalha. Percebemos um aroma tão agradável como se fosse o perfume de incenso ou de alguma outra especiaria preciosa trazido pelo vento.'
  revised_footnotes: []
  revision_rationale: 'Foram feitas apenas correções seguras de precisão e clareza: “carne ardendo” traduz o processo expresso por “flesh burning”, e a repetição de “o corpo do mártir” evita ambiguidade pronominal. A capitalização de “Amém” marca a fórmula litúrgica. As imagens, o caráter testemunhal do prodígio, a linguagem de preservação e os colchetes foram preservados, sem harmonização doutrinária nem reconstrução além do testemunho fornecido.'
