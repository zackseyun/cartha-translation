translation:
  language: pt
  text: '13


    Tudo isso aconteceu com tamanha rapidez, mais depressa do que se pode contar. Imediatamente, as multidões recolheram madeira e gravetos das oficinas e dos banhos públicos; sobretudo os judeus colaboraram nisso com grande empenho, como lhes era costume.[a]


    Quando a pira ficou pronta, Policarpo tirou todas as vestes exteriores e soltou o cinto. Tentou também descalçar-se, algo que antes não costumava fazer, pois os fiéis sempre disputavam entre si para ver quem primeiro tocaria seu corpo. De fato, por causa de sua vida virtuosa, ele já era tratado com toda honra mesmo antes de seus cabelos embranquecerem.


    Logo puseram ao redor dele os instrumentos preparados para a pira. Quando estavam também prestes a pregá-lo ao poste, ele disse:


    — Deixem-me assim. Aquele que me concede suportar o fogo também me concederá permanecer imóvel sobre a pira, mesmo sem a segurança que vocês procuram obter com os pregos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “como lhes era costume” reproduz uma generalização polêmica feita pelo narrador antigo neste episódio. Ela não deve ser entendida como uma afirmação sobre todos os judeus, em qualquer tempo ou lugar, nem como justificativa para hostilidade contra judeus.
    reason: Contextualiza responsavelmente a generalização anti-judaica do documento, sem apagar a evidência textual nem transformar sua retórica em juízo atemporal.
lexical_decisions:
- source_word: ξύλα καὶ φρύγανα
  choice: madeira e gravetos
  rationale: Distingue a madeira maior do combustível leve e seco usado para acender e alimentar a fogueira.
- source_word: βαλανείων
  choice: banhos públicos
  rationale: Explicita a instituição urbana antiga em português corrente, evitando a possível leitura de banheiros domésticos.
- source_word: ὑπολύειν ἑαυτόν
  choice: tirar as próprias sandálias
  rationale: 'Expressa o ato de descalçar-se e deixa clara a ênfase reflexiva do contexto: Policarpo tentou fazê-lo sem a ajuda habitual dos fiéis.'
- source_word: ἀγαθῆς ... πολιτείας
  choice: vida virtuosa
  rationale: Aqui politeia se refere à conduta ou modo de vida, não a cidadania ou governo.
- source_word: τὸν ἧλον / stake (witness context)
  choice: poste
  rationale: No contexto da fogueira, designa o suporte vertical ao qual pretendiam fixá-lo; 'poste' evita identificar indevidamente o objeto como uma cruz.
- source_word: ὄργανα τῆς πυρᾶς
  choice: materiais preparados para a fogueira
  rationale: O termo pode abranger apetrechos ou elementos do arranjo da execução; 'materiais' é natural sem especificar além da evidência.
theological_decisions:
- issue: Identidade daquele que concede perseverança
  choice: Aquele que me concede
  alternative: Deus, que me concede
  rationale: Mantém a referência reverente, mas não explicita como 'Deus' aquilo que a fala deixa implícito.
- issue: Afirmação coletiva sobre os judeus
  choice: preservar no texto com nota histórica e literária
  alternative: omitir ou reformular como ação de alguns indivíduos sem conservar a generalização
  rationale: A frase pertence ao testemunho antigo e deve ser traduzida sem apagamento; a nota impede que a retórica do narrador seja convertida em juízo atemporal contra judeus como povo.
translation_notes:
  register: Português moderno, digno e narrativamente claro, com legibilidade brasileira e vocabulário amplamente internacional. A redação foi conferida com base na formulação grega tradicionalmente atestada para o capítulo, embora o pacote fornecido identifique como pendente a revisão formal da tradição manuscrita grega. Evitaram-se arcaísmos como 'hath'/'ye' e esclareceu-se apenas o necessário para a fluidez, sem eliminar a tensão da fala final nem a retórica problemática do narrador.
