base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: pt
  text: 'Jesus disse: “Ai da carne que depende[a] da alma[b][c]; ai da alma que depende da carne.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo ⲉⲓϣⲉ também pode ser traduzido por “se apoia em” ou “pende de”, preservando uma imagem mais concreta.
    reason: lexical_alternative
  - marker: b
    text: ⲯⲩⲭⲏ (psychē) também pode significar “vida” ou “ser”; “alma” preserva aqui a forte oposição entre carne e alma.
    reason: lexical_alternative
  - marker: c
    text: O manuscrito traz ⲧⲁⲉⲓ, demonstrativo feminino, nas duas orações; Dilley normaliza a forma como ⲡⲁⲓ. Aqui o demonstrativo funciona com a oração relativa (“a que”), de modo que a diferença de gênero não altera o sentido.
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: Ai de
  rationale: Preserva a força de lamento e advertência solene da interjeição, além de ser a formulação idiomática em português.
- source_word: ⲥⲁⲣⲝ
  choice: carne
  rationale: Mantém o sentido do empréstimo grego e o contraste deliberadamente incisivo entre carne e alma; “corpo” atenuaria essa oposição.
- source_word: ⲯⲩⲭⲏ
  choice: alma
  rationale: Conserva a polaridade explícita com “carne”, sem eliminar os sentidos possíveis de “vida” ou “ser”, registrados em nota.
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: depende de
  rationale: Expressa em português corrente a ideia de dependência ou apoio, enquanto a nota preserva as alternativas mais concretas “se apoia em” e “pende de”.
- source_word: ⲡⲁⲓ / manuscrito ⲧⲁⲉⲓ
  choice: que
  rationale: O demonstrativo ligado à oração relativa é vertido naturalmente pelo pronome relativo “que”; sua variação de gênero no manuscrito não altera o sentido.
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Tradução direta e natural da fórmula introdutória.
