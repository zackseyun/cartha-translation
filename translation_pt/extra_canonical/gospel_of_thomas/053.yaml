base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: pt
  text: 'Seus discípulos lhe disseram: “A circuncisão é proveitosa ou não?” Ele lhes respondeu: “Se fosse proveitosa, o pai deles os geraria de sua mãe, já circuncidados.[a] Mas a circuncisão da verdade no espírito[b] tornou-se inteiramente proveitosa.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pai deles os geraria de sua mãe, estando eles circuncidados”.
    reason: Preserva a construção incomum, na qual o pai é o sujeito de “gerar”, a mãe indica a origem, e a circuncisão é o estado dos gerados.
  - marker: b
    text: “Circuncisão da verdade” também pode ser entendida como “verdadeira circuncisão”; “espírito” também poderia ser grafado “Espírito”.
    reason: O genitivo pode ter valor adjetival, e o texto não determina inequivocamente a identidade do espírito.
  - marker: c
    text: O copta diz, de modo elíptico, algo como “tornou-se inteiramente [proveitosa]”; a ideia de proveito é retomada da pergunta e da resposta anteriores. Compare Romanos 2:29 e Filipenses 3:3.
    reason: Explica o complemento contextual inserido e registra paralelos conceituais sem afirmar dependência literária.
lexical_decisions:
- source_word: ⲡⲥⲃⲃⲉ
  choice: a circuncisão
  rationale: É o termo copta usual para a circuncisão ritual, prática claramente em vista no contexto.
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: traz algum benefício / trouxesse benefício
  rationale: O empréstimo do grego ὠφελεῖν expressa vantagem ou proveito; esta formulação é natural em português e mantém a repetição conceitual.
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: Se trouxesse benefício
  rationale: O imperfeito copta nesta construção tem valor irreal ou contrafactual, adequadamente expresso pelo imperfeito do subjuntivo.
- source_word: ϫⲡⲟⲛ
  choice: geraria
  rationale: Preserva a ação geradora atribuída explicitamente ao pai, sem recorrer ao pouco corrente português “engendraria”.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: desde o ventre da mãe
  rationale: Explicita de modo idiomático a origem materna indicada pela construção copta; “ventre” é inferido pelo contexto de nascimento e recebe nota.
- source_word: ⲉⲣⲉⲛⲧⲟⲟⲩ ⲥⲃⲃⲉ
  choice: circuncidados
  rationale: Reproduz concisamente o estado predicativo contemporâneo ao nascimento.
- source_word: ⲁⲗⲗⲁ
  choice: Mas
  rationale: Marca a oposição corretiva de maneira natural e digna em português.
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: a circuncisão da verdade
  rationale: Mantém o genitivo estranho e potencialmente significativo do copta, sem decidir entre uma circuncisão caracterizada pela verdade e “a verdadeira circuncisão”.
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: no espírito
  rationale: A minúscula preserva a ambiguidade entre o espírito humano e uma referência divina, não explicitada no texto.
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  choice: tornou-se inteiramente proveitosa
  rationale: Torna explícito, a partir do contraste anterior, o proveito elíptico no idioma copta e conserva a ideia de totalidade.
theological_decisions:
- issue: Identidade de ⲡⲛⲉⲩⲙⲁ, “espírito”
  choice: espírito, com inicial minúscula
  alternative: Espírito, entendido como o Espírito Santo
  rationale: O dito não identifica expressamente o referente como o Espírito Santo; a minúscula evita impor uma leitura trinitária e conserva a ambiguidade.
- issue: Relação entre “circuncisão da verdade” e a circuncisão física
  choice: preservar a oposição formulada pelo dito sem explicá-la doutrinariamente
  alternative: parafrasear como circuncisão interior, espiritual ou do coração
  rationale: Essas paráfrases poderiam harmonizar o texto com uma tradição teológica específica e apagar sua formulação própria.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe contrafactual foi naturalizada, enquanto as expressões teologicamente ambíguas “circuncisão da verdade” e “no espírito” foram preservadas. Evitou-se “engendrar”, pouco corrente, e também uma paráfrase confessional como “circuncisão do coração”.
