base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: pt
  text: 'Jesus disse: “Eu darei a vocês aquilo que nenhum olho viu, nenhum ouvido ouviu e nenhuma mão tocou[a] — e que não surgiu sobre o coração humano.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No manuscrito, os verbos de percepção levam formas pronominais com o sentido de “vê-lo, ouvi-lo, tocá-lo”; a tradução portuguesa reúne esse referente em “aquilo que”.
    reason: textual_variant
  - marker: b
    text: Literalmente, “sobre o coração”, e não a formulação mais idiomática “no coração”.
    reason: lexical_alternative
  - marker: c
    text: Compare Isaías 64:4 e 1 Coríntios 2:9, que apresentam uma sequência relacionada (“olho não viu…”). Aqui, porém, a redação foi traduzida diretamente do copta.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲛⲁϯ
  choice: Eu darei
  rationale: O manuscrito traz a forma comum da primeira pessoa do singular do futuro, sem pronome independente enfático; por isso, não se acrescenta ‘eu mesmo’.
- source_word: ⲛⲏⲧⲛ̄
  choice: a vocês
  rationale: O objeto indireto está na segunda pessoa do plural. ‘A vocês’ explicita naturalmente essa pluralidade em português internacional com boa legibilidade brasileira.
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ
  choice: aquilo que nenhum olho viu
  rationale: A construção negativa perfeita tem sentido genérico. ‘Nenhum olho viu’ é natural em português e conserva a imagem singular.
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙ
  choice: nenhum ouvido ouviu
  rationale: Mantém o paralelismo sensorial e a repetição expressiva do substantivo e do verbo cognato.
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙ
  choice: nenhuma mão tocou
  rationale: ϭⲙϭⲱⲙ neste contexto indica contato ou apreensão tátil; ‘tocou’ é conciso e adequado à tríade.
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈
  choice: não surgiu
  rationale: Preserva a ideia direcional de vir para cima ou surgir, sem substituir a expressão pela leitura mais interpretativa ‘entrou’.
- source_word: ϩⲓ ⲫⲏⲧ ⲣ̄ⲣⲱⲙⲉ
  choice: sobre o coração humano
  rationale: ‘Sobre’ conserva o valor espacial de ϩⲓ; ‘humano’ expressa o referente genérico sem linguagem marcada por gênero.
theological_decisions:
- issue: Relação com Isaías 64:4 e 1 Coríntios 2:9
  choice: Traduzir diretamente o copta e indicar apenas a relação literária em nota
  alternative: Ajustar a redação à formulação bíblica tradicional
  rationale: A semelhança não autoriza harmonizar o texto de Tomé nem resolver sua formulação própria por meio dos paralelos canônicos.
- issue: Imagem final do coração
  choice: Manter ‘surgiu sobre o coração’
  alternative: Interpretar como ‘entrou no coração’ ou ‘foi concebido pelo coração’
  rationale: A formulação copta é incomum e teologicamente aberta; a tradução conserva essa tensão em vez de explicar o tipo de conhecimento ou revelação em vista.
translation_notes:
  register: Português moderno, digno e acessível, com ‘a vocês’ para marcar o plural. A coordenação foi levemente condensada em uma tríade natural, sem eliminar o referente comum. Preservou-se deliberadamente a expressão incomum ‘surgiu sobre o coração humano’.
