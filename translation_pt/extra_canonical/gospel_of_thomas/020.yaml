base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: pt
  text: 'Os discípulos disseram a Jesus: “Diga-nos com que se parece o Reino dos céus[a].” Ele lhes respondeu: “É semelhante a um grão de mostarda[b], o menor de todas as sementes. Mas, quando cai em terra cultivada[c], produz um grande ramo e se torna abrigo[d] para as aves do céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito diz literalmente “Reino dos céus”, não “Reino de Deus”.
    reason: textual_wording
  - marker: b
    text: Literalmente, “um grão de mostarda”. O termo copta pode designar um grão ou uma semente.
    reason: lexical_note
  - marker: c
    text: Literalmente, “a terra em que trabalham”, isto é, solo trabalhado ou cultivado.
    reason: cultural_note
  - marker: d
    text: O termo traduzido por “abrigo” também pode significar “sombra” ou “cobertura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Dize-nos
  rationale: O imperativo significa literalmente “dize a nós”; “Dize-nos” conserva a forma direta e solene sem soar antiquada em excesso.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: Reino dos céus
  rationale: ⲙⲛⲧⲣⲣⲟ pode designar reino, reinado ou domínio; “Reino” mantém a imagem substantiva tradicional, e o manuscrito traz o plural “céus”.
- source_word: ⲉⲛⲓⲙ / ⲧⲛ̄ⲧⲱⲛ
  choice: com que se parece / É semelhante a
  rationale: A pergunta solicita uma comparação, e a resposta usa linguagem de semelhança; a formulação portuguesa reproduz claramente essa relação.
- source_word: ⲟⲩⲃⲗⲃⲓⲗⲉ ⲛ̄ϣⲗⲧⲁⲙ
  choice: um grão de mostarda
  rationale: ⲃⲗⲃⲓⲗⲉ é grão ou semente; “grão de mostarda” preserva de perto a expressão copta e é natural em português.
- source_word: ⲥⲥⲟⲃⲕ ⲡⲁⲣⲁ ⲛ̄ϭⲣⲟϭ ⲧⲏⲣⲟⲩ
  choice: o menor de todas as sementes
  rationale: A construção comparativa produz sentido superlativo no contexto; esta é a forma idiomática correspondente em português.
- source_word: ⲉϫⲙ̄ⲡⲕⲁϩ ⲉⲧⲟⲩⲣ̄ϩⲱⲃ ⲉⲣⲟϥ
  choice: em terra cultivada
  rationale: A expressão literal é “sobre a terra em que trabalham”; no contexto agrícola, refere-se a solo trabalhado ou cultivado.
- source_word: ϣⲁϥⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛ̄ⲛⲟⲩⲛⲟϭ ⲛ̄ⲧⲁⲣ
  choice: produz um grande ramo
  rationale: ⲧⲁⲣ significa “ramo” ou “galho”, e o verbo expressa fazer surgir ou lançar para fora.
- source_word: ⲥⲕⲉⲡⲏ
  choice: abrigo
  rationale: O termo pode indicar abrigo, cobertura ou sombra; “abrigo” combina naturalmente com a função oferecida às aves.
- source_word: ϩⲁⲗⲁⲧⲉ ⲛ̄ⲧⲡⲉ
  choice: aves do céu
  rationale: Tradução direta e natural da expressão copta, mantendo a imagem aérea.
theological_decisions:
- issue: Sentido de ⲙⲛⲧⲣⲣⲟ
  choice: Reino
  alternative: reinado/domínio
  rationale: O termo admite tanto a esfera quanto o exercício do governo. “Reino” preserva essa amplitude tradicional sem excluir a ideia dinâmica de reinado.
- issue: Identificação do Reino
  choice: Reino dos céus
  alternative: Reino de Deus
  rationale: A tradução segue a leitura efetiva do manuscrito e não a harmoniza com formulações de outros evangelhos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Dize-nos” preserva a solenidade do discurso direto; o restante evita arcaísmos. A pontuação separa a descrição inicial da semente do contraste introduzido por “Mas”.
