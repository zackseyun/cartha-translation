base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: pt
  text: 'Jesus disse: “Quem não odiar seu pai e sua mãe não pode ser meu discípulo; e quem não odiar seus irmãos e suas irmãs, e não carregar sua cruz como eu, não será digno de mim”.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito traz “seus irmãos [...] e suas irmãs” (ⲥⲛⲏⲩ [...] ⲥⲱⲛⲉ). A lematização normalizada de Dilley registra “seu filho [...] sua filha”. Esta tradução segue a leitura do manuscrito.
    reason: textual_variant
  - marker: b
    text: O copta ⲛⲡⲁϩⲉ pode significar “à minha maneira” ou, mais literalmente, “no meu caminho”. O dito não emprega o verbo explícito “seguir”.
    reason: dialect_note
  - marker: c
    text: Compare Lucas 14.26–27 e Mateus 10.37–38, que apresentam temas relacionados, embora a formulação de Tomé seja distinta.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: odiar
  rationale: O verbo copta é forte; preserva-se a formulação incisiva, sem atenuá-la para “amar menos”.
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: pode ser meu discípulo
  rationale: A construção potencial com ϣ expressa capacidade ou possibilidade, distinguindo-se do futuro simples da cláusula final.
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: pai / mãe
  rationale: Termos comuns de parentesco, traduzidos literalmente.
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: irmãos / irmãs
  rationale: Segue a leitura do manuscrito impresso e mantém o paralelismo entre parentes masculinos e femininos.
- source_word: ϥⲓ
  choice: carregar
  rationale: No contexto da cruz, expressa levá-la ou suportá-la, sem harmonizar o texto com a expressão sinótica “tomar a cruz”.
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: cruz
  rationale: Empréstimo grego com o sentido convencional de “cruz”.
- source_word: ⲛⲡⲁϩⲉ
  choice: como eu
  rationale: Transmite de modo natural a ideia de agir à maneira de Jesus, evitando que “no meu caminho” seja entendido como obstrução espacial.
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: ser digno
  rationale: A expressão copta denota estado ou qualidade; “ser digno” preserva sua força avaliativa.
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: quem
  rationale: Introduz uma condição geral e proverbial de maneira natural em português.
theological_decisions:
- issue: Força do verbo relativo aos familiares
  choice: odiar
  alternative: amar menos / rejeitar
  rationale: A tradução mantém a tensão do verbo copta, sem resolver interpretativamente sua relação com os paralelos sinóticos.
- issue: Relação entre Jesus e o carregar da cruz
  choice: como eu
  alternative: à minha maneira / no meu caminho
  rationale: Preserva a ideia de conformidade ao modo de Jesus sem inserir o verbo “seguir”, ausente no texto.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. A sintaxe proverbial foi mantida, assim como o contraste entre “não pode ser” na primeira condição e “não será” na conclusão. Os marcadores de notas aparecem no texto principal.
