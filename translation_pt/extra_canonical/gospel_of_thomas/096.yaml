base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: pt
  text: 'Jesus disse: “O reino do Pai é como uma mulher. Ela pegou um pouco de fermento[a], escondeu-o na massa e fez grandes pães[b][c]. Quem tem ouvidos, ouça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fermento” (ⲥⲓⲣ) se refere ao fermento natural tradicional, não ao fermento biológico comercial moderno.
    reason: cultural_note
  - marker: b
    text: A expressão ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ também pode ser entendida como “uma grande quantidade de pão” ou “muitos pães”. Traduzimos “grandes pães” para conservar a imagem concreta de tamanho.
    reason: lexical_alternative
  - marker: c
    text: Várias letras estão danificadas ou foram restauradas em NHAM02.49, mas a leitura “uma mulher… escondeu-o na massa… fez grandes pães” é segura.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: reino
  rationale: Abrange o domínio ou reinado real e mantém a formulação tradicional e concreta do dito sem explicá-la além do texto.
- source_word: ⲡⲉⲓⲱⲧ
  choice: o Pai
  rationale: Reproduz a designação masculina explícita usada para Deus no texto copta.
- source_word: ⲥϩⲓⲙⲉ
  choice: mulher
  rationale: É o sentido básico do termo; o contexto não exige “esposa”.
- source_word: ⲟⲩⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: um pouco de fermento
  rationale: A construção indica pequena quantidade; “fermento” é claro em português e adequado ao contexto antigo de panificação.
- source_word: ϩⲱⲡ
  choice: escondeu
  rationale: Preserva o sentido concreto de ocultar e a concisão narrativa do copta.
- source_word: ϣⲱⲧⲉ
  choice: massa
  rationale: No contexto de panificação, indica a mistura preparada, e não apenas farinha.
- source_word: ⲉⲓⲣⲉⲛⲧⲟϥ ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: fez disso grandes pães
  rationale: Mantém a ideia de resultado expressa pela construção copta e evita identificar de modo excessivamente rígido o referente pronominal.
- source_word: ⲛⲟϭ
  choice: grandes
  rationale: Conserva a imagem concreta de magnitude, embora a expressão também possa sugerir grande quantidade.
- source_word: ⲛⲟⲉⲓⲕ
  choice: pães
  rationale: Reproduz a forma plural explícita em vez de generalizá-la como “pão”.
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: ouvidos … ouça
  rationale: Preserva a fórmula breve de exortação à escuta recorrente no Evangelho de Tomé.
theological_decisions:
- issue: Sentido de ⲙⲛⲧⲣⲣⲟ na expressão “reino do Pai”
  choice: reino
  alternative: reinado; domínio real
  rationale: “Reino” mantém tanto a possibilidade de esfera quanto a de governo ativo, sem resolver a tensão semântica em favor de uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com formulação concisa. “É como” conserva a simplicidade oral da comparação; “fez disso” mantém o referente pronominal relativamente aberto e evita uma construção pouco natural em português.
