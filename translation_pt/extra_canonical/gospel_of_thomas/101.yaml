base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: pt
  text: Quem não odeia seu pai e sua mãe como eu não pode tornar-se meu discípulo[a]; e quem não ama seu pai e sua mãe como eu não pode tornar-se meu discípulo. Pois minha mãe [...][c], mas minha verdadeira[b] [mãe] me deu a vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “à minha maneira” ou “como eu” (ⲛ̄ⲧⲁϩⲉ).
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da verdade” (ⲙ̄ⲙⲉ).
    reason: lexical_alternative
  - marker: c
    text: O manuscrito está danificado neste ponto. Frequentemente se propõem reconstruções como “deu-me à luz para a morte” ou “deu-me falsidade”, em contraste com a verdadeira mãe, que deu a vida; nenhuma delas, porém, é segura.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  choice: odiar
  rationale: É o verbo copta comum para “odiar”; a formulação forte é preservada, sem suavização interpretativa.
- source_word: ⲙⲣ̄ⲣⲉ
  choice: amar
  rationale: Forma construta do verbo copta “amar”, em contraste deliberado com “odiar”.
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: como eu
  rationale: A expressão significa literalmente “à minha maneira” ou “como eu”. “Como eu” preserva a ambiguidade entre agir como Jesus e relacionar-se com os pais do mesmo modo que ele.
- source_word: ϣ ... ⲁⲛ
  choice: não poderá
  rationale: 'A construção com o auxiliar de capacidade e a negação expressa incapacidade: “não pode/não poderá”.'
- source_word: ⲙ̄ⲙⲉ
  choice: verdadeira
  rationale: Literalmente “de verdade”; funciona como qualificador de “mãe”, restaurado pelo contexto.
- source_word: ⲱⲛϩ
  choice: vida
  rationale: Substantivo copta comum para “vida”.
theological_decisions:
- issue: Contraste entre a mãe biológica e a “verdadeira mãe”
  choice: Pois minha mãe [...], mas minha verdadeira [mãe] me deu a vida.
  alternative: Completar a lacuna como “deu-me à luz para a morte” ou “deu-me falsidade”.
  rationale: O manuscrito preserva o contraste, mas não conserva o predicado referente à primeira mãe. A tradução não identifica a “verdadeira mãe” nem reconstrói conteúdo incerto, evitando impor uma leitura teológica específica.
- issue: Sentido de “como eu” nas duas exigências opostas
  choice: Preservar “como eu” nas duas orações.
  alternative: Explicitar “assim como eu odeio/amo os meus”.
  rationale: O copta admite a comparação com a maneira ou o exemplo de Jesus, mas não explica a tensão entre odiar e amar. A tradução mantém essa tensão sem harmonizá-la.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservam-se a força de “odiar”, a repetição paralela e a tensão entre “odiar” e “amar”. Os colchetes distinguem tanto a lacuna material quanto a palavra “mãe” suprida pelo contexto.
