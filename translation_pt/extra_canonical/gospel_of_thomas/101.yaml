revisions:
- from: Quem não odiar seu pai e sua mãe como eu não poderá tornar-se meu discípulo[a]; e quem não amar seu pai e sua mãe como eu não poderá tornar-se meu discípulo. Pois minha mãe [...] [c], mas minha verdadeira[b] [mãe] me deu a vida.
  to: Quem não odeia seu pai e sua mãe como eu não pode tornar-se meu discípulo[a]; e quem não ama seu pai e sua mãe como eu não pode tornar-se meu discípulo. Pois minha mãe [...][c], mas minha verdadeira[b] [mãe] me deu a vida.
  rationale: A revisão limita-se a substituir a construção prospectiva “não odiar/amar ... não poderá” pela relativa genérica “não odeia/ama ... não pode”, mais fiel à sintaxe e ao aspecto do copta. Mantêm-se a ambiguidade de “como eu”, a repetição deliberada, a lacuna e os colchetes que assinalam a palavra restaurada.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:51:40Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o paralelismo antitético entre “odiar” e “amar”, a exigência de discipulado e a lacuna manuscrita. Contudo, “Quem não odiar/amar ... não poderá” desloca a formulação copta para uma construção prospectiva/condicional; o copta exprime mais diretamente “quem não odeia/ama ... não pode”.
  naturalness: O português é claro e de registro apropriado. “Quem não odeia ... não pode tornar-se meu discípulo” é igualmente natural e reproduz melhor a forma sentenciosa do dito.
  terminology: “Discípulo”, “odiar”, “amar” e “vida” são escolhas adequadas. “Verdadeira [mãe]” representa de modo compreensível o qualificativo “da verdade”, sem identificar interpretativamente essa mãe. A nota deve manter explícito que as propostas para a lacuna são conjecturais.
  issues:
  - severity: medium
    issue: Tempo/modo de “não odiar/amar ... não poderá”
    rationale: O original tem uma relativa genérica seguida de incapacidade negada, não uma condição futura. “Não odeia/ama ... não pode” conserva melhor a estrutura e evita acrescentar nuance prospectiva.
  - severity: low
    issue: Nota sobre ⲙ̄ⲙⲉ
    rationale: “De verdade” é possível em português, mas “da verdade” é a formulação literal mais precisa para o genitivo copta; “verdadeira” permanece uma boa realização idiomática no texto.
