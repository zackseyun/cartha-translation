base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his slave so that the farmers would give him the fruit of the vineyard. They seized his slave and beat him; they almost killed him. The slave went and told his master. His master said, 'Perhaps he did not know them.' He sent another slave[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
translation:
  language: pt
  text: 'Ele disse: “Um homem bom[a] tinha uma vinha. Ele a entregou a alguns lavradores para que a cultivassem e recebesse deles o fruto dela. Enviou seu escravo para que os lavradores lhe dessem o fruto da vinha. Eles agarraram seu escravo e o espancaram; quase o mataram[b]. O escravo foi e contou ao seu senhor. Seu senhor disse: ‘Talvez ele não os tenha conhecido[c].’ Enviou outro escravo. Os lavradores espancaram também o outro. Então o senhor enviou seu filho. Ele disse: ‘Talvez respeitem meu filho.’ Como aqueles lavradores sabiam que ele era o herdeiro da vinha, agarraram-no e o mataram. Quem tem ouvidos, ouça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito traz ⲛⲭⲣ̣ⲏ̣[ⲥⲧⲟ]ⲥ̣, restaurado como o empréstimo grego χρηστός (chrēstós), “bom” ou “bondoso”. Alguns estudiosos propõem que a grafia possa representar χρήστης (chrḗstēs), “credor” ou “usurário”, sentido compatível com um proprietário ausente.
    reason: textual_variant
  - marker: b
    text: Literalmente, a expressão copta diz algo como “faltou outro pouco e eles o matariam”, uma construção idiomática que significa “quase”.
    reason: lexical_alternative
  - marker: c
    text: O copta diz literalmente “ele não os conheceu”. Muitos tradutores emendam a frase para “eles não o conheceram”, acompanhando a lógica mais esperada da parábola. A leitura do manuscrito, porém, pode indicar que o senhor supôs que o escravo tivesse procurado os lavradores errados.
    reason: textual_variant
lexical_decisions:
- source_word: ⲭⲣⲏⲥⲧⲟⲥ
  choice: bom
  rationale: Representa diretamente o empréstimo grego χρηστός, “bom” ou “bondoso”, sem adotar no texto principal a possível leitura alternativa “credor”.
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: lavradores
  rationale: Termo corrente e digno para trabalhadores agrícolas ou arrendatários encarregados de cultivar a vinha.
- source_word: ϩⲙϩⲁⲗ
  choice: escravo
  rationale: Preserva a condição social expressa pelo copta, evitando suavizá-la como “servo”.
- source_word: ⲕⲉⲕⲟⲩⲉⲓ
  choice: quase
  rationale: A construção copta idiomática significa que faltou pouco para a ação acontecer.
- source_word: ⲥⲟⲩⲱⲛ
  choice: conhecer
  rationale: Mantém literalmente o sujeito e o objeto do manuscrito em “ele não os conhecesse”, sem emenda para “eles não o conhecessem”.
- source_word: ϣⲓⲡⲉ ϩⲏⲧ-
  choice: respeitar
  rationale: Expressa naturalmente a ideia de sentir vergonha ou reverência diante de alguém.
- source_word: ϭⲱⲡⲉ
  choice: agarrar
  rationale: Comunica de modo claro a ação hostil de prender ou apoderar-se de alguém.
theological_decisions:
- issue: Harmonização com os paralelos sinóticos
  choice: Seguir estritamente a forma copta do Evangelho de Tomé.
  alternative: Acrescentar ou ajustar elementos segundo as versões dos Evangelhos Sinóticos.
  rationale: A versão de Tomé não contém detalhes como lagar ou torre e possui uma lógica narrativa própria; a tradução não importa elementos externos.
- issue: Declaração do senhor sobre o primeiro escravo
  choice: “Talvez ele não os conhecesse.”
  alternative: “Talvez eles não o conhecessem.”
  rationale: A opção escolhida preserva a leitura efetiva do manuscrito e sua ambiguidade, em vez de emendá-la para corresponder à lógica esperada da parábola.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A narrativa emprega frases diretas e preserva o singular “fruto”, a condição de “escravo” e as ambiguidades textuais do manuscrito. Os marcadores de nota foram colocados junto às expressões específicas a que se referem.
