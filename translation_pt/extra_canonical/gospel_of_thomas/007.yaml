base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: pt
  text: 'Jesus disse: “Bem-aventurado[a] é este leão que o ser humano comerá, de modo que o leão se torne um ser humano[b]; e maldito[c] é este ser humano que o leão comerá, e o leão se tornará um ser humano.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “feliz” ou “afortunado”. “Bem-aventurado” preserva o tom solene do termo grego incorporado ao copta.
    reason: lexical_alternative
  - marker: b
    text: 'A construção copta pode indicar consequência ou uma continuação estreita: “de modo que o leão se torne um ser humano” ou “e o leão se torne um ser humano”. Aqui ela difere do futuro independente usado no fim do dito.'
    reason: grammar_note
  - marker: c
    text: O copta também admite o sentido “detestável” ou “abominável”; “maldito” conserva o contraste com “bem-aventurado” e é apoiado pelo testemunho grego deste dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: bem-aventurado
  rationale: Preserva o tom solene de uma bem-aventurança e corresponde ao empréstimo grego μακάριος, sem reduzir a expressão a mera felicidade subjetiva.
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: leão
  rationale: É o sentido comum do substantivo; a variação gráfica do manuscrito não altera o significado.
- source_word: ⲡⲁⲓ
  choice: este
  rationale: Mantém a força dêitica do demonstrativo posposto, em vez de generalizar a frase com um simples artigo.
- source_word: ⲡⲣⲱⲙⲉ
  choice: ser humano
  rationale: Expressa naturalmente em português o sentido genérico de pessoa humana, sem restringi-lo ao sexo masculino.
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: comerá
  rationale: Reproduz o futuro com ⲛⲁ-; o objeto pronominal é recuperado naturalmente pelo antecedente da oração relativa em português.
- source_word: ⲛⲧⲉⲡⲙⲟⲩⲓ ϣⲱⲡⲉ ⲛⲣⲱⲙⲉ
  choice: de modo que o leão se torne humano
  rationale: Distingue a primeira construção conjuntiva, que apresenta continuação estreita ou consequência, do futuro independente empregado na ocorrência final.
- source_word: ⲃⲱⲧⲉ
  choice: maldito
  rationale: Mantém o contraste incisivo com “bem-aventurado”; o testemunho grego sobreposto sustenta a ideia de alguém sujeito a maldição, embora o copta também possa sugerir algo detestável ou abominável.
- source_word: ⲡⲙⲟⲩⲓ ⲛⲁϣⲱⲡⲉ ⲛⲣⲱⲙⲉ
  choice: o leão se tornará humano
  rationale: Representa como futuro independente a segunda ocorrência, preservando a diferença sintática em relação à primeira.
theological_decisions:
- issue: Sentido simbólico do leão, do ato de comer e da transformação
  choice: Não interpretar na tradução
  alternative: Identificar o leão com paixões, natureza animal, poder espiritual ou alguma figura específica
  rationale: O dito é deliberadamente enigmático, e o texto não fornece uma chave interpretativa suficiente para escolher uma leitura teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem marcada “Bem-aventurado é...” e “maldito é...” conserva o paralelismo sentencioso. “Ser humano” evita a leitura exclusivamente masculina, e a formulação não explica o simbolismo enigmático do dito.
