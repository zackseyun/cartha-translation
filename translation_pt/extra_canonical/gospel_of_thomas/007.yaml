  naturalness: O registro é natural e digno. Contudo, «o leão se torne humano» e «o leão se tornará humano» podem significar em português que o leão se torna compassivo ou humanitário, e não que se torna um ser humano. A explicitação mínima com «um ser humano» remove essa ambiguidade portuguesa sem acrescentar interpretação.
  terminology: «Bem-aventurado», «leão», «ser humano» e «maldito» são escolhas adequadas. «Um ser humano» como predicativo final preserva com clareza o valor de ⲣⲱⲙⲉ.
