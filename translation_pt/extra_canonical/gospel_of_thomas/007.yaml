  to: 'Jesus disse: “Bem-aventurado[a] é este leão que o ser humano comerá, de modo que o leão se torne um ser humano[b]; e maldito[c] é este ser humano que o leão comerá, e o leão se tornará um ser humano.”'
  rationale: A única revisão substitui «humano» por «um ser humano» nas duas predicações finais. Ela evita uma ambiguidade idiomática do português e representa diretamente o substantivo copta ⲣⲱⲙⲉ, mantendo o paralelismo, a estrutura sintática contrastante e a indeterminação simbólica do original.
