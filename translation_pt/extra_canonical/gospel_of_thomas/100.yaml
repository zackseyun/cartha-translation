base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: pt
  text: '**Evangelho de Tomé — Dito 100**


    Mostraram a Jesus uma moeda de ouro[a] e lhe disseram: “Os que pertencem a César exigem de nós o imposto.”[b] Ele lhes disse: “Deem a César as coisas de César; deem a Deus as coisas de Deus;[c] e o que é meu, deem a mim.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta diz literalmente “um ouro”; neste contexto, a expressão se refere a uma moeda de ouro, não apenas ao metal bruto.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “Os que servem a César exigem de nós o imposto”. O verbo pode significar “procurar” ou “pedir”; no contexto fiscal, “exigir” é uma tradução natural.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Deem a César o que é de César; deem a Deus o que é de Deus”. O copta, porém, emprega formas plurais: “as coisas de César” e “as coisas de Deus”.'
    reason: previous_rendering
  - marker: d
    text: Tomé acrescenta esta terceira ordem — “e o que é meu, deem a mim” — que não aparece nas versões dos Evangelhos Sinóticos.
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲥⲉⲃⲉⲓⲥ ... ⲏⲥⲟⲩⲥ
  choice: Mostraram a Jesus
  rationale: O verbo copta significa ‘mostrar, exibir’. A construção portuguesa conserva de modo natural tanto a ação quanto o destinatário.
- source_word: ⲟⲩⲛⲟⲩⲃ
  choice: uma moeda de ouro
  rationale: Embora ⲛⲟⲩⲃ signifique literalmente ‘ouro’, o objeto mostrado no contexto tributário é naturalmente uma moeda; a tradução evita especificar uma denominação não presente no texto.
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: os que servem a César
  rationale: A expressão identifica pessoas vinculadas a César, provavelmente seus agentes. ‘Servem a César’ transmite essa relação sem restringi-la formalmente a cobradores de impostos.
- source_word: ⲥⲉϣⲓⲧⲉ
  choice: exigem
  rationale: O verbo pode significar ‘procurar, pedir’. No contexto da cobrança tributária, ‘exigem’ expressa de modo idiomático a solicitação revestida de autoridade, enquanto a alternativa mais literal é registrada em nota.
- source_word: ⲡϣⲱⲙ
  choice: o imposto
  rationale: O termo designa tributo ou imposto. ‘Imposto’ é claro e atual em português.
- source_word: ⲕⲁⲓⲥⲁⲣ
  choice: César
  rationale: Mantém o nome-título histórico representado pelo empréstimo grego no copta.
- source_word: ϯ
  choice: Deem
  rationale: Traduz diretamente o imperativo ‘dar’ e evita harmonização desnecessária com formulações canônicas tradicionais como ‘dai’ ou ‘tributai’.
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: as coisas de César / as coisas de Deus
  rationale: As formas possessivas plurais são representadas explicitamente, preservando o paralelismo e o contraste gramatical com o singular da cláusula final.
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ ⲡⲉ
  choice: o que é meu
  rationale: A construção relativa designa aquilo que pertence ao falante. A formulação conserva a concisão e a força da adição característica de Tomé.
theological_decisions:
- issue: Relação dos cobradores com César
  choice: os que servem a César
  alternative: os que pertencem a César
  rationale: ‘Servem’ comunica uma relação funcional provável no contexto fiscal, mas não identifica essas pessoas mais especificamente do que o texto permite; a ambiguidade lexical é indicada em nota.
- issue: Distinção entre o que é de César, de Deus e de Jesus
  choice: Preservar as três ordens separadas e a mudança do plural para o singular
  alternative: Harmonizar com a forma sinótica de duas ordens
  rationale: O texto de Tomé inclui uma terceira ordem própria. Mantê-la sem explicação doutrinária conserva a tensão teológica e a particularidade do testemunho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “deem” em vez do arcaizante “dai”. A tradução mantém a repetição deliberada e o paralelismo do copta, sem tornar a frase excessivamente coloquial nem impor uma interpretação teológica à terceira ordem.
