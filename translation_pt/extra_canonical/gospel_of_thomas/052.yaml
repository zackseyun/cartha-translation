base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: pt
  text: 'Seus discípulos lhe disseram: “Vinte e quatro profetas[c] falaram em Israel, e todos eles falaram a respeito de você.[a]” Ele lhes disse: “Vocês deixaram de lado[b] aquele que está vivo na presença de vocês e falaram a respeito dos mortos.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na transcrição impressa, a expressão pode ser lida como “a respeito do seu coração” (ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ); o lema normalizado de Dilley traz “a respeito de você” (ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ). Adotamos esta última leitura, mas a leitura “coração” é possível.
    reason: textual_variant
  - marker: b
    text: “Deixaram de lado” também pode ser traduzido por “omitiram” ou “não levaram em conta” (Crum, verbete ⲕⲱ).
    reason: lexical_alternative
  - marker: c
    text: “Vinte e quatro profetas” pode refletir uma contagem tradicional de autoridades proféticas ou um número simbólico. Compare-se a contagem dos 24 livros das Escrituras hebraicas em algumas tradições antigas, embora o dito não esclareça a referência.
    reason: cultural_note
  - marker: d
    text: Compare o contraste entre “vivos” e “mortos” em Marcos 12.27 e paralelos. Tomé, porém, formula a questão como deixar de lado aquele que está vivo “na presença de vocês”.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: vinte e quatro
  rationale: É a forma corrente do numeral em português e preserva a concisão do copta sem arcaísmo.
- source_word: ⲁⲛⲧⲟⲟⲩϣⲁϫⲉ / ϣⲁϫⲉ
  choice: falaram
  rationale: O passado simples corresponde ao valor narrativo no contexto e conserva a repetição enfática do verbo.
- source_word: ϩⲣⲁⲓ
  choice: a respeito de
  rationale: Expressa com naturalidade a referência a uma pessoa ou tema, sem impor o sentido direcional de “para”.
- source_word: ⲛ̄ϩⲏⲧⲕ / ϩⲛⲛⲧⲟⲕ
  choice: você
  rationale: Segue a lematização normalizada de Dilley, entendida como “a respeito de você”; a leitura paleográfica “seu coração” permanece registrada em nota.
- source_word: ⲕⲱ
  choice: deixaram de lado
  rationale: Mantém a acusação ativa dirigida aos discípulos e permite os sentidos próximos de omitir ou não levar em conta.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: aquele que está vivo
  rationale: Preserva a construção substantivada singular sem transformar necessariamente a expressão em título teológico.
- source_word: ⲛⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: na presença de vocês
  rationale: Reproduz o idioma copta “diante de vocês” com registro digno e compreensível.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ / ⲡⲉⲧⲉⲣⲉⲙⲟⲩ
  choice: os mortos
  rationale: A forma diplomática do manuscrito favorece o plural “os que estão mortos”; “os mortos” também conserva naturalmente o contraste com aquele que está vivo.
theological_decisions:
- issue: Se “aquele que está vivo” deve ser apresentado como título cristológico
  choice: 'Usar minúsculas e uma oração descritiva: “aquele que está vivo”'
  alternative: “o Vivente” ou “o Vivo” como título
  rationale: O contexto pode apontar para Jesus, mas a forma copta não exige que a expressão seja grafada ou interpretada como título técnico.
- issue: Natureza dos vinte e quatro profetas
  choice: Manter apenas o número e a designação presentes no texto
  alternative: Identificá-los explicitamente com um cânon profético ou com os 24 livros das Escrituras hebraicas
  rationale: O dito não explica a contagem; uma identificação específica resolveria indevidamente uma alusão possível, mas incerta.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento naturais para leitores brasileiros. A repetição de “falaram” foi mantida por corresponder à estrutura enfática do copta. Evitou-se converter “aquele que está vivo” em título confessional e preservou-se a possível tensão entre a presença viva e as autoridades proféticas do passado.
