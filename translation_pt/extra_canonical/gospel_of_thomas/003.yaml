review_pass:
  verdict: approve
  source_fidelity: A tradução preserva adequadamente o paralelismo condicional (céu/mar), a repetição de “lhes disserem” nas duas cláusulas, o contraste espacial “dentro... e fora”, a terceira pessoa plural impessoal em “serão conhecidos” e a repetição enfática de “pobreza”. “Os filhos” segue corretamente a leitura plural do manuscrito diplomático (ⲛ̄ϣⲏⲣⲉ), apesar da inconsistência no ტექsto normalizado fornecido.
  naturalness: O português é moderno, claro e de leitura ampla. “Conduzem vocês”, “chegarão antes de vocês” e “conhecerem a si mesmos” são formulações naturais e mantêm o tom sentencioso sem arcaização.
  terminology: “Reino”, “Pai vivo”, “pobreza”, “dentro de vocês” e “fora de vocês” são escolhas fiéis e não impõem interpretação doutrinária. As notas explicam as alternativas pertinentes e os marcadores estão todos ancorados no texto.
  issues: []
  revised_text: 'Jesus disse: “Se aqueles que conduzem vocês[a] lhes disserem: ‘Vejam, o Reino está no céu[b]’, então os pássaros do céu chegarão antes de vocês. Se lhes disserem: ‘Está no mar’, então os peixes chegarão antes de vocês. Mas o Reino está dentro de vocês e fora de vocês[e]. Quando vocês conhecerem a si mesmos, então serão conhecidos[c] e compreenderão que são os filhos do Pai vivo[d]. Mas, se não conhecerem a si mesmos, estarão na pobreza — e vocês são a pobreza.”[f][g]'
  revised_footnotes:
  - marker: a
    text: O verbo copta pode significar “puxar”, “levar” ou “conduzir”. O texto não diz explicitamente “conduzir para o erro” ou “desviar”.
    reason: lexical_alternative
  - marker: b
    text: “Céu” também pode ser entendido como “firmamento”. A expressão “pássaros do céu” ressalta aqui a imagem concreta.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, a construção copta diz “eles conhecerão vocês”, com sujeito não identificado; essa é uma maneira comum de expressar a voz passiva.
    reason: dialect_note
  - marker: d
    text: O manuscrito lê “os filhos” no plural. O termo copta também pode ser traduzido, conforme o contexto, por “as crianças” ou “os filhos e filhas”.
    reason: textual_variant
  - marker: e
    text: O copta diz somente “o Reino”; não traz as palavras “de Deus”.
    reason: textual_variant
  - marker: f
    text: Uma reconstrução comum do fragmento grego POxy 654 inclui uma frase adicional, “Quem conhece a si mesmo o encontrará”, ausente deste manuscrito copta.
    reason: textual_variant
  - marker: g
    text: Todas as formas de segunda pessoa neste dito são plurais; por isso, a tradução usa “vocês”.
    reason: dialect_note
  revision_rationale: Nenhuma correção segura é necessária. A redação já incorpora a leitura plural do manuscrito para “os filhos” e conserva, na segunda condição, o destinatário expresso por “lhes disserem”.
