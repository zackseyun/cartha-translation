base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: pt
  text: 'Jesus disse: “Se aqueles que conduzem vocês[a] lhes disserem: ‘Vejam, o Reino está no céu[b]’, então os pássaros do céu chegarão antes de vocês. Se lhes disserem: ‘Está no mar’, então os peixes chegarão antes de vocês. Mas o Reino está dentro de vocês e fora de vocês[e]. Quando vocês conhecerem a si mesmos, então serão conhecidos[c] e compreenderão que são os filhos do Pai vivo[d]. Mas, se não conhecerem a si mesmos, estarão na pobreza — e vocês são a pobreza.”[f][g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo copta pode significar “puxar”, “levar” ou “conduzir”. O texto não diz explicitamente “conduzir para o erro” ou “desviar”.
    reason: lexical_alternative
  - marker: b
    text: “Céu” também pode ser entendido como “firmamento”. A expressão “pássaros do céu” ressalta aqui a imagem concreta.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, a construção copta diz “eles conhecerão vocês”, com sujeito não identificado; essa é uma maneira comum de expressar a voz passiva.
    reason: dialect_note
  - marker: d
    text: O manuscrito lê “os filhos” no plural. O termo copta também pode ser traduzido, conforme o contexto, por “as crianças” ou “os filhos e filhas”.
    reason: textual_variant
  - marker: e
    text: O copta diz somente “o Reino”; não traz as palavras “de Deus”.
    reason: textual_variant
  - marker: f
    text: Uma reconstrução comum do fragmento grego POxy 654 inclui uma frase adicional, “Quem conhece a si mesmo o encontrará”, ausente deste manuscrito copta.
    reason: textual_variant
  - marker: g
    text: Todas as formas de segunda pessoa neste dito são plurais; por isso, a tradução usa “vocês”.
    reason: dialect_note
lexical_decisions:
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲱⲧⲛ
  choice: conduzem vocês
  rationale: ⲥⲱⲕ pode significar puxar, levar ou conduzir. A formulação permanece neutra e não acrescenta a ideia de desvio, ausente do copta.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Reino
  rationale: “Reino” é a forma portuguesa mais natural para o domínio ou reinado em vista e conserva a abertura semântica do substantivo abstrato copta.
- source_word: ⲡⲉ / ⲛⲧⲉⲡⲡⲉ
  choice: céu / do céu
  rationale: Em português, “céu” abrange tanto o firmamento concreto quanto o céu em sentido religioso; a referência aos pássaros favorece aqui a imagem concreta.
- source_word: ⲡϩⲁⲗⲏⲧ
  choice: os pássaros
  rationale: Expressa naturalmente o valor coletivo/plural do termo no contexto.
- source_word: ⲑⲁⲗⲁⲥⲥⲁ
  choice: mar
  rationale: Equivalente direto e corrente do empréstimo grego presente no copta.
- source_word: ⲧⲃⲧ
  choice: os peixes
  rationale: O plural português torna explícito o sentido coletivo exigido pelo paralelo com os pássaros.
- source_word: ⲛⲡⲉⲧⲛϩⲟⲩⲛ / ⲛⲡⲉⲧⲛⲃⲟⲗ
  choice: dentro de vocês / fora de vocês
  rationale: Mantém o contraste espacial direto do copta sem espiritualizá-lo nem explicar sua relação teológica.
- source_word: ⲥⲟⲟⲩⲛ ⲛⲧⲱⲧⲛ
  choice: conhecerem a si mesmos
  rationale: Preserva o conhecimento reflexivo expresso no texto e usa uma construção compreensível no português moderno.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲥⲟⲟⲩⲛ ⲛⲧⲱⲧⲛ
  choice: serão conhecidos
  rationale: A terceira pessoa do plural sem agente definido funciona idiomaticamente como passiva em copta; a passiva portuguesa conserva a ausência de um agente nomeado.
- source_word: ⲉⲓⲙⲉ
  choice: compreenderão
  rationale: No complemento introduzido por “que”, o verbo indica percepção ou entendimento da identidade declarada.
- source_word: ⲛ̄ϣⲏⲣⲉ
  choice: os filhos
  rationale: A leitura do manuscrito traz artigo plural e concorda com o destinatário plural. “Filhos” preserva o termo de parentesco sem reduzir o grupo a um único filho.
- source_word: ⲙⲛⲧϩⲏⲕⲉ
  choice: pobreza
  rationale: 'Mantém a repetição enfática do mesmo substantivo: estar na pobreza e ser a própria pobreza.'
theological_decisions:
- issue: Localização do Reino
  choice: “dentro de vocês e fora de vocês”
  alternative: Explicar como presença interior, comunitária ou universal
  rationale: O texto emprega duas expressões espaciais em tensão. A tradução conserva ambas sem impor uma interpretação teológica.
- issue: Agente de “serão conhecidos”
  choice: Não identificar o agente
  alternative: “Deus os conhecerá” ou “eles conhecerão vocês”
  rationale: O copta usa terceira pessoa plural impessoal e não nomeia Deus nem outro agente.
- issue: Relação com o Pai vivo
  choice: “filhos do Pai vivo”
  alternative: “filhos de Deus”
  rationale: A tradução segue o título efetivamente presente e não acrescenta “Deus”.
- issue: Complemento de “Reino”
  choice: Manter apenas “o Reino”
  alternative: “o Reino de Deus”
  rationale: O manuscrito copta não contém “de Deus”; acrescentá-lo resolveria indevidamente uma formulação aberta.
translation_notes:
  register: Português moderno, digno e direto, com “vocês” para tornar visível o plural constante do original e assegurar boa legibilidade brasileira. A sintaxe conserva os paralelos céu/mar, dentro/fora e pobreza/ser pobreza. Evitaram-se tanto arcaísmos quanto explicações confessionais inseridas no corpo do texto.
source_grounding:
