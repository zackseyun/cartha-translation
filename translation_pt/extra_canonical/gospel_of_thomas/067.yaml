base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: pt
  text: 'Jesus disse: “Quem conhece o Todo[a], mas carece de si mesmo[b], carece[d] em todos os aspectos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Todo” traduz ⲡⲧⲏⲣϥ. Também pode ser traduzido por “o todo” ou “tudo”; em Tomé, a expressão pode ter alcance cósmico.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “carece em si mesmo”. A construção copta admite uma nuance reflexiva e conserva uma formulação deliberadamente paradoxal.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “carece inteiramente” ou “é totalmente carente”. A expressão copta funciona como uma indicação adverbial de totalidade.'
    reason: lexical_alternative
  - marker: d
    text: No manuscrito, o pronome sujeito da última oração foi omitido e é suprido pelos editores; a restauração é exigida pela sintaxe e não altera o sentido do dito.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (em ⲡⲉⲧⲥⲟⲟⲩⲛ)
  choice: conhece
  rationale: A construção é um presente relativo, literalmente ‘aquele que conhece’. O presente preserva tanto a gramática copta quanto o caráter geral e proverbial da sentença.
- source_word: ⲡⲧⲏⲣϥ
  choice: o Todo
  rationale: O termo pode significar ‘o todo’ ou ‘tudo’, mas em Tomé pode ter alcance cósmico. ‘O Todo’ conserva essa possibilidade e a estranheza deliberada sem torná-la obrigatória.
- source_word: ⲣϭⲣⲱϩ
  choice: carece
  rationale: O verbo exprime falta, necessidade ou deficiência. ‘Carece’ funciona de modo intransitivo com complemento e mantém a repetição do verbo nas duas orações.
- source_word: ⲟⲩⲁⲁϥ / ⲟⲩⲁⲁ ⲛⲧⲟϥ
  choice: de si mesmo
  rationale: A construção de ‘só’ com o pronome admite valor reflexivo. ‘De si mesmo’ preserva o paradoxo central, embora ‘em si mesmo’ também seja possível.
- source_word: ⲙ̄ⲡⲙⲁ ⲧⲏⲣϥ / ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ
  choice: em todos os aspectos
  rationale: A expressão de totalidade tem função adverbial; esta formulação é clara em português e evita restringir a carência a um objeto específico.
theological_decisions:
- issue: Alcance de ⲡⲧⲏⲣϥ
  choice: o Todo
  alternative: tudo; o todo
  rationale: A tradução mantém aberta uma leitura cósmica ou filosófica, sem afirmar que o termo seja necessariamente um título técnico.
- issue: Sentido reflexivo de ⲟⲩⲁⲁϥ
  choice: carece de si mesmo
  alternative: carece em si mesmo; carece estando só
  rationale: O valor reflexivo é bem sustentado e mantém a tensão entre conhecer a totalidade e não possuir ou conhecer adequadamente a si próprio, sem explicar qual dessas ideias o dito pretende.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A repetição de “carece” reproduz a ligação lexical do copta. “O Todo” recebe maiúscula para sinalizar a possível dimensão cósmica, explicada em nota, sem impor uma interpretação técnica.
