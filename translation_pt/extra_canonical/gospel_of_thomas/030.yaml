base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: pt
  text: 'Jesus diz: “Onde há três deuses, eles são deuses.[a] Onde há dois ou um,[b] eu estou com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito lê ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ, uma formulação difícil, literalmente algo como “eles estão em um deus”. O texto normalizado citado apresenta a forma singular ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ, “é um deus”. A tradução adota a predicação plural “eles são deuses”, também apoiada pelo testemunho grego POxy 1.
    reason: textual_variant
  - marker: b
    text: POxy 1 omite “dois” e diz apenas “onde há um sozinho”. Nesse testemunho grego, seguem-se ainda as palavras sobre levantar a pedra e rachar a madeira, preservadas no copta em separado, no Dito 77.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus diz
  rationale: Mantém o presente narrativo característico da coleção e sua abertura concisa.
- source_word: ⲡⲙⲁ ⲉⲣⲉⲟⲩⲛ-
  choice: onde há
  rationale: Traduz naturalmente a construção existencial e relativa, literalmente “o lugar onde há”.
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: três deuses
  rationale: Preserva o numeral e o plural provocativo do texto, sem substituir “deuses” por um termo interpretativo.
- source_word: ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ
  choice: eles são deuses
  rationale: Segue a leitura do manuscrito, em que ϩⲛ̄ funciona como artigo indefinido plural e ⲛⲉ como cópula plural; o testemunho grego também apoia essa predicação.
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: dois ou um
  rationale: Reproduz diretamente os numerais e a disjunção do copta, sem explicitar pessoas onde o original não o faz.
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ ⲛⲙⲙⲁϥ
  choice: eu estou com ele
  rationale: O pronome independente seguido da forma verbal de primeira pessoa dá ênfase ao sujeito, mas não constitui uma duplicação literal de “eu”; “estou com ele” expressa a presença indicada pela construção.
theological_decisions:
- issue: A expressão “três deuses” e sua predicação
  choice: Preservar literalmente “três deuses, eles são deuses”
  alternative: Reformular como “três, eles estão sem Deus” ou harmonizar com uma leitura teológica específica
  rationale: O manuscrito copta e o paralelo grego sustentam a formulação com “deuses”. A tradução conserva sua tensão sem impor explicação doutrinária.
- issue: Referente masculino singular na conclusão
  choice: “com ele”
  alternative: “com essa pessoa”
  rationale: O copta emprega pronome masculino singular. A forma “ele” conserva esse dado gramatical e a ambiguidade de seu referente.
translation_notes:
  register: Português atual, digno e direto, com leitura natural no Brasil e compreensão internacional. A concisão e a estranheza deliberada do dito foram preservadas; evitou-se reproduzir “eu—eu”, pois a construção copta marca ênfase do sujeito, não uma repetição lexical independente.
