base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: pt
  text: 'Jesus disse: “Ai dos fariseus! Pois eles são como um cão deitado sobre o cocho[a] do gado[b][c]: ele não come nem deixa o gado comer[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cocho” traduz ⲡⲟⲩⲟⲙϥ, também entendido como “manjedoura” ou “recipiente de alimentação”.
    reason: lexical_alternative
  - marker: b
    text: ⲉϩⲉ designa genericamente animais domésticos ou gado. Muitas traduções trazem “bois”, mas o copta não especifica essa espécie.
    reason: cultural_note
  - marker: c
    text: Nesta linha, algumas letras do códice estão danificadas e podem parecer formar ⲛⲛⲉϩⲟⲟⲩ (“dias”). A normalização de Dilley lê ⲛϩⲉⲛⲉϩⲉ (“do gado”), leitura confirmada pela ocorrência seguinte de ⲛⲡⲉϩⲉ (“o gado”).
    reason: lacuna_or_restoration
  - marker: d
    text: 'Com um infinitivo, ⲕⲱ tem aqui o sentido de “permitir/deixar”; na forma negativa: “não deixa o gado comer”.'
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: Ai de
  rationale: Interjeição idiomática de denúncia e lamento; preserva a força incisiva e a concisão do copta.
- source_word: ⲉⲓⲛⲉ
  choice: são como
  rationale: Expressa de modo natural o sentido de semelhança, sem ampliar a imagem.
- source_word: ⲟⲩϩⲟⲣ
  choice: cão
  rationale: Equivalente básico e direto, mantendo o tom contundente da comparação.
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: deitado
  rationale: Indica a postura do animal; evita especificar que esteja dormindo.
- source_word: ϩⲓϫⲛ
  choice: sobre
  rationale: Conserva a relação espacial e deixa claro que o cão ocupa e bloqueia o cocho.
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: cocho
  rationale: Termo corrente para o recipiente em que animais comem; é concreto e mais preciso no contexto do que uma formulação explicativa.
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: gado
  rationale: O termo copta é genérico para animais domésticos; “gado” preserva essa generalidade, ao contrário de “bois”.
- source_word: ⲟⲩⲱⲙ
  choice: comer
  rationale: Verbo simples e direto que corresponde ao sentido primário do copta.
- source_word: ⲕⲱ (ⲛⲡⲉϩⲉ ⲉⲟⲩⲱⲙ)
  choice: deixa o gado comer
  rationale: Na construção com infinitivo, ⲕⲱ tem o sentido de permitir ou deixar; sob negação, resulta naturalmente em “não deixa”.
- source_word: ϫⲉ (causal)
  choice: pois
  rationale: Introduz de maneira concisa a razão da denúncia, preservando o encadeamento causal do dito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a concisão proverbial, a denúncia inicial e a imagem concreta do animal que ocupa o cocho sem comer nem permitir que o gado coma.
