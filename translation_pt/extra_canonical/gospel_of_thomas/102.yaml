  source_fidelity: 'A tradução representa com precisão o dito copta: ⲟⲩⲟⲓ é bem vertido por “Ai”, a comparação dos fariseus com o cão é preservada, e “não come nem deixa o gado comer” reproduz adequadamente as duas negações e o valor permissivo de ⲕⲱ com infinitivo. “Gado” mantém a generalidade de ⲉϩⲉ/ⲡⲉϩⲉ, sem introduzir a especificação tradicional de “bois”.'
