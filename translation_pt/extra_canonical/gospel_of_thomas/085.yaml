base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: pt
  text: 'Jesus disse: “Adão veio à existência a partir de um grande poder e de uma grande riqueza, e não se tornou digno de vocês.[a] Pois, se tivesse sido digno,[b] não teria provado a morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito apresenta lacunas nas expressões traduzidas por “digno” e “teria provado”. As restaurações são amplamente aceitas por se ajustarem ao contexto e ao espaço disponível.
    reason: textual_variant
  - marker: b
    text: 'A construção copta introduz aqui uma condição irreal: “se tivesse sido digno”, seguida pelo resultado “não teria provado a morte”.'
    reason: register_note
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: veio à existência
  rationale: Expressa o sentido de passar a existir ou ter origem, sem restringi-lo a nascimento biológico.
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: um grande poder
  rationale: O artigo indefinido ⲟⲩ é singular; portanto, a expressão designa “um grande poder”, não “grandes poderes”.
- source_word: ⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: riqueza
  rationale: O substantivo abstrato denota riqueza ou abundância de bens; “riqueza” preserva o singular e soa natural em português.
- source_word: ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ
  choice: digno
  rationale: Ambos os termos, um copta e outro de origem grega, expressam a ideia de ser digno; repetir “digno” preserva a ligação argumentativa.
- source_word: ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ
  choice: provado a morte
  rationale: A expressão idiomática significa “provar a morte”; não contém referência a um lugar.
theological_decisions:
- issue: Relação de Adão com o grande poder e a grande riqueza
  choice: a partir de um grande poder e de uma grande riqueza
  alternative: por meio de um grande poder e de uma grande riqueza
  rationale: “A partir de” preserva a noção ampla de origem sem definir se o poder e a riqueza são causa, matéria ou agência.
- issue: Sentido de ⲙⲡⲉϥϣⲱⲡⲉ ⲉϥⲙⲡϣⲁ
  choice: não se tornou digno
  alternative: não aconteceu de ele ser digno
  rationale: A formulação conserva o componente de mudança ou resultado de ϣⲱⲡⲉ e evita explicar por que Adão não foi digno.
- issue: Estrutura contrafactual final
  choice: se tivesse sido digno, não teria provado a morte
  alternative: se fosse digno, não provaria a morte
  rationale: A construção copta apresenta uma condição irreal referente ao ocorrido; o mais-que-perfeito do subjuntivo e o futuro do pretérito composto reproduzem esse valor sem resolver a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” traduz o plural de segunda pessoa sem identificar um grupo além dos ouvintes do dito. A adversativa “mas” explicita em português o contraste marcado no encadeamento copta, sem acrescentar interpretação doutrinária.
