base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: pt
  text: 'Jesus disse: “Os fariseus e os escribas receberam as chaves do conhecimento e as esconderam. Eles não entraram e não deixaram entrar os que queriam entrar.[a] Quanto a vocês, tornem-se prudentes como as serpentes e inocentes como as pombas.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Compare Lucas 11:52, sobre a chave do conhecimento, e Mateus 23:13, sobre impedir a entrada.
    reason: cross_reference
  - marker: b
    text: 'O manuscrito copta traz formas plurais: “as serpentes” e “as pombas”. Compare Mateus 10:16.'
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ ⲙⲛ ⲡⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: os fariseus e os escribas
  rationale: Os substantivos coletivos do copta são expressos naturalmente pelo plural em português; “escribas” preserva a referência histórico-religiosa sem especificação excessiva.
- source_word: ⲁⲩϫⲓ ⲛ̄ϣⲁϣⲧ
  choice: receberam as chaves
  rationale: ϫⲓ pode significar “tomar” ou “receber”; “receberam” preserva a ideia de posse confiada sem acusar explicitamente apropriação indevida. O manuscrito marca o plural “chaves”.
- source_word: ⲧⲅⲛⲱⲥⲓⲥ
  choice: o conhecimento
  rationale: Traduz o empréstimo grego em seu sentido comum e evita impor ao texto o uso técnico posterior de “gnose”.
- source_word: ⲁⲩϩⲟⲡⲟⲩ
  choice: as esconderam
  rationale: O pronome plural retoma as chaves; “esconderam” reproduz diretamente o sentido de ocultar.
- source_word: ⲙ̄ⲡⲟⲩⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: não entraram
  rationale: A construção negativa perfeita e o movimento para dentro são traduzidos de modo conciso.
- source_word: ⲛⲉⲧⲟⲩⲱϣ ⲉⲃⲱⲕ ⲉϩⲟⲩⲛ ⲙ̄ⲡⲟⲩⲕⲁⲁⲩ
  choice: não deixaram entrar os que queriam entrar
  rationale: Mantém tanto o desejo dos que pretendiam entrar quanto o impedimento causado pelos líderes.
- source_word: ϣⲱⲡⲉ
  choice: tornem-se
  rationale: Preserva o valor dinâmico e exortativo de “vir a ser”, em vez de reduzi-lo a simples “sejam”.
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: prudentes
  rationale: Expressa sensatez prática sem restringir o termo a “sábios” nem carregar a conotação negativa possível de “astutos”.
- source_word: ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: inocentes
  rationale: Comunica com clareza o campo semântico de pureza, integridade e ausência de malícia.
- source_word: ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ … ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙⲡⲉ
  choice: como as serpentes … como as pombas
  rationale: Segue a forma plural efetivamente preservada no manuscrito copta, apesar da normalização fornecida apresentar formas genéricas no singular.
theological_decisions:
- issue: Natureza do “conhecimento”
  choice: conhecimento
  alternative: gnose
  rationale: O contexto não exige um conceito técnico ou um sistema teológico posterior; a tradução comum mantém aberta a natureza exata desse conhecimento.
- issue: Relação com os paralelos sinóticos
  choice: Traduzir a redação própria de Tomé
  alternative: Harmonizar com Lucas 11:52 e Mateus 23:13; 10:16
  rationale: Embora os paralelos esclareçam temas e fórmulas semelhantes, a redação copta tem “chaves” no plural, “esconderam” e o imperativo “tornem-se”; esses traços foram preservados.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A colocação pronominal foi evitada quando poderia soar excessivamente regional ou arcaica. “Quanto a vocês” marca claramente o contraste expresso por ⲇⲉ sem tornar a frase pesada.
