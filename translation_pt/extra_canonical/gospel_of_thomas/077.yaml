base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: pt
  text: 'Jesus disse: “Eu sou a luz que está sobre todos eles. Eu sou o Todo. Foi de mim que o Todo veio, e foi até mim que o Todo chegou.[a] Rache um pedaço de madeira;[b] eu estou ali. Levante a pedra, e vocês me encontrarão ali.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No copta, a mesma forma verbal (ⲡⲱϩ, pōh) significa “chegou” nesta frase e “rache” na frase seguinte, criando um jogo de palavras que não pode ser reproduzido naturalmente em português.
    reason: register_note
  - marker: b
    text: No fragmento grego P.Oxy. 1, as ordens de levantar a pedra e rachar a madeira aparecem na ordem inversa e são anexadas ao fim do Dito 30.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: a luz
  rationale: Equivalente direto e natural para o substantivo copta “luz”, preservando a afirmação metafórica.
- source_word: ⲡⲧⲏⲣϥ
  choice: o Todo
  rationale: O substantivo absoluto designa a totalidade. “O Todo” conserva sua forma substantivada e a repetição do copta, sem reduzi-lo simplesmente a “tudo”.
- source_word: ⲉⲓ ⲉⲃⲟⲗ ⲛϩⲏⲧ
  choice: foi de mim que ... veio
  rationale: A construção clivada reproduz em português a ênfase do segundo perfeito copta sobre a expressão de origem “de mim”.
- source_word: ⲡⲱϩ
  choice: chegou
  rationale: Na primeira ocorrência, o verbo significa “alcançar/chegar”. “Chegou” combina naturalmente com “até mim” e mantém aberta a relação descrita.
- source_word: ⲡⲱϩ
  choice: Rache
  rationale: Na segunda ocorrência, a mesma forma copta significa “rachar/partir”. “Rache” comunica de modo concreto a abertura da madeira, embora o jogo homonímico copta não possa ser reproduzido naturalmente em português.
- source_word: ϣⲉ
  choice: um pedaço de madeira
  rationale: O termo pode designar madeira ou uma peça de madeira. Esta formulação torna natural em português a ordem de rachá-la sem especificar indevidamente “lenha” ou “tronco”.
- source_word: ϥⲓ ... ⲉϩⲣⲁⲓ
  choice: Levante
  rationale: O verbo com o advérbio direcional exprime levantar ou erguer; “Levante a pedra” é claro e idiomático.
- source_word: ϩⲉ ⲉ-
  choice: encontrarão
  rationale: A construção significa “encontrar/deparar com”, não apenas “ver”.
theological_decisions:
- issue: Identificação de Jesus com ⲡⲧⲏⲣϥ
  choice: Eu sou o Todo
  alternative: Eu sou tudo
  rationale: “O Todo” mantém a expressão como substantivo absoluto e preserva a força e a possível tensão cosmológica da afirmação, sem acrescentar uma explicação doutrinária.
- issue: Referente de “todos eles”
  choice: a luz que está sobre todos eles
  alternative: a luz que está acima de tudo
  rationale: O copta apresenta pronome plural (“eles”) sem antecedente explícito neste dito. A tradução conserva essa indeterminação em vez de identificar os referentes com todas as coisas.
- issue: Presença de Jesus na madeira e junto à pedra
  choice: eu estou ali ... vocês me encontrarão ali
  alternative: eu estou dentro dela ... vocês me encontrarão debaixo dela
  rationale: Os advérbios significam “ali/lá”; o texto não diz explicitamente “dentro” da madeira nem “debaixo” da pedra. A formulação evita impor uma localização ou interpretação metafísica mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural explícito no copta. A repetição de “o Todo” e “ali” foi mantida por sua função retórica. A pontuação divide as declarações sem suavizar a transição abrupta entre a afirmação cosmológica e as imagens da madeira e da pedra.
