base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: pt
  text: 'Jesus disse: “Eu me coloquei de pé no meio do mundo e me manifestei a eles em carne.[a] Encontrei todos embriagados; não encontrei entre eles ninguém com sede.[b] E minha alma se afligiu por causa dos filhos da humanidade,[c] porque são cegos no coração e não veem que vieram ao mundo vazios, buscando também sair do mundo vazios. Mas agora estão embriagados. Quando se livrarem do seu vinho,[d] então se arrependerão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta também pode ser traduzida como “apareci” ou, com outra nuance, “resplendeci”. “Manifestei-me” preserva a ideia de tornar-se visível ou manifesto.
    reason: lexical_alternative
  - marker: b
    text: 'A construção copta é compacta. O fragmento grego de Oxirrinco diz explicitamente: “não encontrei entre eles ninguém com sede”, apoiando a leitura negativa adotada aqui.'
    reason: textual_variant
  - marker: c
    text: Literalmente, “filhos dos seres humanos” ou “filhos dos homens”; “filhos da humanidade” expressa o sentido coletivo e inclusivo.
    reason: cross_reference
  - marker: d
    text: A expressão também pode ser entendida como “quando o vinho os deixar” ou, de modo mais interpretativo, “quando ficarem sóbrios”. A tradução mantém a imagem de eles se livrarem do vinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ
  choice: me coloquei de pé
  rationale: Expressa o perfeito do verbo ‘pôr-se de pé, tomar posição’, mantendo a imagem concreta sem recorrer a uma formulação arcaica.
- source_word: ϩⲛⲡⲙⲏⲧⲉ ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: no meio do mundo
  rationale: Tradução direta e natural da locução espacial, com ⲕⲟⲥⲙⲟⲥ no sentido usual de ‘mundo’.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: me manifestei
  rationale: Preserva o sentido de tornar-se visível ou manifesto; a nota registra a possível nuance de ‘aparecer’ ou ‘resplandecer’.
- source_word: ϩⲛⲥⲁⲣⲝ
  choice: em carne
  rationale: Mantém a formulação deliberadamente concreta do empréstimo grego σάρξ, sem interpretá-la como mera referência a um corpo.
- source_word: ⲧⲁϩⲟ / ⲧⲟϩⲉ
  choice: embriagados
  rationale: Conserva a metáfora da intoxicação e sua ligação explícita com o vinho, em registro digno e corrente.
- source_word: ⲟⲃⲉ
  choice: com sede
  rationale: Mantém a imagem literal da sede e evita transformá-la interpretativamente em desejo espiritual.
- source_word: ⲯⲩⲭⲏ ϯⲧⲕⲁⲥ
  choice: minha alma se afligiu
  rationale: Reproduz a referência à alma e expressa de modo natural a dor ou aflição indicada pela construção copta.
- source_word: ⲛ̄ϣⲏⲣⲉ ⲛ̄ⲣ̄ⲣⲱⲙⲉ
  choice: filhos da humanidade
  rationale: Representa inclusivamente a expressão literalmente equivalente a ‘filhos dos seres humanos’, sem restringi-la ao sexo masculino.
- source_word: ϣⲟⲩⲉⲓⲧ
  choice: vazios
  rationale: Preserva a repetição enfática do adjetivo nas frases sobre entrar no mundo e sair dele.
- source_word: ⲛⲟⲩϩⲉⲡⲉⲩⲏⲣⲡ
  choice: se livrarem do seu vinho
  rationale: Mantém o vinho como objeto da expressão e comunica em português natural a ideia de afastá-lo ou libertar-se dele, sem reduzir a imagem a ‘ficar sóbrios’.
- source_word: ⲣ̄ⲙⲉⲧⲁⲛⲟⲉⲓ
  choice: se arrependerão
  rationale: É a equivalência portuguesa corrente para o verbo de mudança de mente ou arrependimento, preservando sua força moral sem explicitação doutrinária.
theological_decisions:
- issue: Natureza da manifestação ‘em carne’
  choice: me manifestei a eles em carne
  alternative: apareci a eles num corpo
  rationale: A tradução conserva tanto a linguagem de manifestação quanto o termo concreto ‘carne’, sem decidir se a frase pretende uma afirmação ontológica específica.
- issue: Sentido da sede
  choice: ninguém com sede
  alternative: ninguém que desejasse a verdade
  rationale: A metáfora permanece aberta; não se identifica explicitamente o objeto da sede.
- issue: Alcance de metanoia
  choice: se arrependerão
  alternative: mudarão sua maneira de pensar
  rationale: ‘Arrepender-se’ é natural e tradicional em português, mas a formulação não acrescenta objeto, rito ou sistema teológico ao verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens concretas de carne, embriaguez, sede, vazio e vinho, além da repetição de “vazios”. A sintaxe “buscando também sair” trata ⲉⲩϣⲓⲛⲉ como oração circunstancial concomitante, sem criar uma segunda oração completiva.
