base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: pt
  text: 'Jesus disse: “Ame seu irmão como a sua alma[a] e proteja-o[b] como a pupila do seu olho[c].”[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Alma” traduz ⲯⲩⲭⲏ (do grego ψυχή), palavra que também pode significar “vida” ou “ser”.
    reason: lexical_alternative
  - marker: b
    text: A linha do manuscrito traz ⲙ̄ⲙⲟϥ, com “ele” como objeto direto; a forma normalizada traz ⲛⲛⲧⲟϥ. Em ambos os casos, o sentido no contexto é guardar ou proteger o irmão.
    reason: textual_variant
  - marker: c
    text: “Pupila do seu olho” traduz literalmente a expressão. O idiomatismo tradicional “menina dos olhos” não é exigido pelo termo copta ⲡⲉⲗⲟⲩ.
    reason: lexical_alternative
  - marker: d
    text: 'Compare o mesmo motivo na Bíblia Hebraica: Deuteronômio 32:10; Salmo 17:8; Provérbios 7:2 (LXX).'
    reason: cross_reference
  - marker: e
    text: A partícula comparativa aparece no manuscrito como ⲛ̄ⲑⲉ e na forma normalizada como ⲛⲡϩⲉ; ambas significam “como” em uso saídico/licopolitano.
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Reproduz de modo direto e natural a fórmula narrativa copta ⲡⲉϫⲉ seguida do nome próprio.
- source_word: ⲙⲉ
  choice: ame
  rationale: Com objeto pessoal, o verbo expressa naturalmente amor; o imperativo português preserva a força ética do dito.
- source_word: ⲡⲉⲕⲥⲟⲛ
  choice: seu irmão
  rationale: Mantém o sentido básico e a linguagem fraterna do substantivo ⲥⲟⲛ, sem substituí-lo por 'próximo' ou 'semelhante'.
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: como
  rationale: Ambas as formas funcionam como partícula comparativa; 'como' é idiomático nas duas comparações em português.
- source_word: ⲯⲩⲭⲏ
  choice: alma
  rationale: Preserva o empréstimo grego ψυχή e a dicção marcante do texto, enquanto a nota registra os sentidos alternativos 'vida' e 'ser'.
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: proteja
  rationale: A construção perifrástica comunica guardar ou proteger uma pessoa; 'proteja' é mais natural em português contemporâneo nesse contexto.
- source_word: ⲡⲉⲗⲟⲩ
  choice: pupila
  rationale: Traduz literalmente a parte central do olho, sem importar o idiomatismo tradicional 'menina dos olhos'.
- source_word: ⲃⲁⲗ
  choice: olhos
  rationale: O português idiomático diz 'a pupila dos seus olhos'; o plural natural não altera o referente anatômico do singular copta.
