base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: pt
  text: 'Jesus disse: “Quem está perto de mim[a] está perto do fogo[b], e quem está longe de mim está longe do reino[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito traz formas pronominais equivalentes a “perto de mim” e “longe de mim”; a edição normalizada explicita os pronomes independentes. Também há variação na forma do artigo antes de “reino”.
    reason: textual_variant
  - marker: b
    text: Compare a imagem do fogo em Lucas 12:49, por afinidade temática, embora este dito seja distinto.
    reason: cross_reference
  - marker: c
    text: “Reino” traduz o copta ⲙⲛⲧⲣⲣⲟ, que também pode significar “realeza”, “domínio régio” ou “reinado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲏⲛ
  choice: está perto
  rationale: O uso estativo indica proximidade, não movimento; “está perto” preserva o paralelismo conciso do dito.
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: de mim
  rationale: No português corrente, “perto de mim” e “longe de mim” expressam com naturalidade as relações opostas de proximidade e afastamento marcadas no copta.
- source_word: ⲥⲁⲧⲉ
  choice: fogo
  rationale: É o sentido básico do substantivo e mantém a imagem forte sem especificá-la como “chama”.
- source_word: ⲟⲩⲏⲩ
  choice: está longe
  rationale: Mantém a oposição direta e simétrica com “está perto”.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: reino
  rationale: É a forma mais clara e tradicional em português, embora o termo também possa indicar realeza ou domínio régio; a inicial minúscula evita acrescentar uma especificação ausente do texto.
- source_word: ⲡⲉⲧ-
  choice: quem
  rationale: A relativa genérica singular é expressa de modo natural e conciso por “quem”, sem perder o caráter aforístico.
theological_decisions:
- issue: Relação entre Jesus, o fogo e o reino
  choice: Preservar sem explicação interpretativa a afirmação de que estar perto de Jesus é estar perto do fogo, enquanto estar longe dele é estar longe do reino.
  alternative: Identificar explicitamente o fogo como juízo, purificação, revelação ou presença divina.
  rationale: O dito não define o valor simbólico do fogo; explicá-lo no texto resolveria indevidamente uma ambiguidade teológica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção paralela e breve do copta foi mantida; evitou-se interpretar o sentido simbólico de “fogo” ou ampliar “reino” com qualificações teológicas.
