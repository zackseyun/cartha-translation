base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: pt
  text: 'Jesus disse: “Se dois fizerem as pazes entre si[a] nesta única casa[b], dirão à montanha: ‘Afaste-se’[c], e ela se moverá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Entre si” traduz uma expressão que, literalmente, pode referir-se a estar “com seus companheiros”; aqui ela tem sentido recíproco.
    reason: cultural_note
  - marker: b
    text: “Nesta única casa” também pode ser traduzido por “numa só casa” ou “nesta mesma casa”; o termo copta ⲟⲩⲱⲧ pode significar “uma”, “única” ou “mesma”.
    reason: lexical_alternative
  - marker: c
    text: “Afaste-se” também pode ser traduzido por “mova-se para longe”, “saia” ou simplesmente “mova-se”; ⲉⲃⲟⲗ acrescenta a ideia de movimento para fora ou para longe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: se
  rationale: Marca uma prótase prospectiva/condicional; “se” preserva a força condicional da máxima.
- source_word: ⲥⲛⲁⲩ
  choice: dois
  rationale: Tradução direta do numeral cardinal.
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: fizerem as pazes
  rationale: A expressão portuguesa natural comunica o estabelecimento recíproco da paz, sem reduzir o sentido a um estado meramente interior.
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: entre si
  rationale: A locução copta, literalmente relacionada a estar “com seus companheiros”, tem aqui força recíproca; “entre si” é claro e natural em português.
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: nesta única casa
  rationale: Mantém o demonstrativo “esta” e o valor marcado de ⲟⲩⲱⲧ, que pode significar “uma/única/mesma”.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁϫⲱ ⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: dirão à montanha
  rationale: Reproduz o futuro e o ato de dirigir a fala à montanha, sem conservar o pronome dativo pleonástico do copta, que seria artificial em português.
- source_word: ϫⲉ ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: Mova-se daqui
  rationale: O imperativo traduz o verbo de mover-se, enquanto “daqui” expressa o valor de afastamento de ⲉⲃⲟⲗ.
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: e ela se moverá
  rationale: Mantém o futuro simples e repete o mesmo verbo básico empregado na ordem anterior.
theological_decisions:
- issue: Natureza da paz entre os dois
  choice: “fizerem as pazes entre si”
  alternative: “estiverem em paz um com o outro”
  rationale: O texto admite uma nuance de estado ou ação, mas a construção favorece a ideia ativa de estabelecer paz; não se acrescenta uma interpretação eclesiológica, doméstica ou mística.
- issue: Sentido de “casa” e de sua unidade
  choice: “nesta única casa”
  alternative: “nesta mesma casa”
  rationale: Preserva-se a formulação concreta e sua possível nuance de unidade sem definir se “casa” deve ser entendida literalmente ou como símbolo de uma comunidade ou pessoa.
- issue: A ordem dada à montanha
  choice: linguagem concreta, sem explicação metafórica
  alternative: explicitar a montanha como obstáculo ou símbolo
  rationale: O dito apresenta a montanha diretamente; a tradução evita resolver se a imagem é literal, proverbial ou simbólica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Fazer as pazes” e “entre si” soam naturais sem perder a reciprocidade do copta. A expressão deliberadamente marcada “nesta única casa” conserva a estranheza e a possível ênfase na unidade presentes no texto-fonte.
