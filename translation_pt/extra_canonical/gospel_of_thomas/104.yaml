base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: pt
  text: 'Eles disseram a Jesus: “Venha, vamos orar hoje e jejuar”. Jesus disse: “Que pecado cometi, ou em que fui vencido?[a] Mas, quando o noivo sair da câmara nupcial, então que jejuem e orem”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em que fui sobrepujado?”. O verbo também pode ter sentidos como “dominar” ou “vencer”; aqui não se declara por quem ou por que Jesus teria sido vencido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: Venha
  rationale: Imperativo de convite, seguido naturalmente pela forma coletiva “vamos”; conserva o tom breve e direto.
- source_word: ϣⲗⲏⲗ
  choice: orar
  rationale: Equivalente corrente e direto do verbo copta para a prática da oração.
- source_word: ⲛⲡϩⲟⲟⲩ
  choice: hoje
  rationale: Embora literalmente relacionado a “o dia”, a expressão tem valor temporal idiomático de “hoje”.
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: jejuar
  rationale: Equivalente estabelecido do empréstimo grego, claro no português atual.
- source_word: ⲡⲛⲟⲃⲉ
  choice: pecado
  rationale: Preserva o sentido moral e religioso central do substantivo.
- source_word: ⲟⲩ ⲅⲁⲣ ⲡⲉ ⲡⲛⲟⲃⲉ
  choice: Que pecado
  rationale: A construção é interrogativa; em português, “Que pecado cometi?” comunica de modo natural “Qual é o pecado que cometi?” sem convertê-la em afirmação.
- source_word: ⲉⲧⲉⲣⲉⲁⲁⲛⲟⲕ ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: cometi
  rationale: “Cometer” forma a colocação portuguesa natural com “pecado” e representa a ação concluída atribuída ao falante.
- source_word: ϫⲣⲟ (com ⲉⲣⲟⲓ / ⲉⲁⲛⲟⲕ)
  choice: fui vencido
  rationale: Sem complemento infinitivo, o verbo exprime ser vencido, dominado ou sobrepujado; “fui vencido” preserva a força passiva e a abertura quanto ao agente.
- source_word: ϩⲛ ⲟⲩ
  choice: em que
  rationale: Mantém a formulação elíptica e aberta do copta, sem especificar por que ou por quem Jesus teria sido vencido.
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: noivo
  rationale: Equivalente natural e amplamente compreensível do empréstimo grego para o homem que se casa, preservando a imagem nupcial.
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: câmara nupcial
  rationale: Conserva a imagem concreta do recinto nupcial e a relação lexical com “noivo”.
- source_word: ⲙⲁⲣⲟⲩ-
  choice: que jejuem e orem
  rationale: A forma é jussiva de terceira pessoa do plural, não simples futuro; “que...” reproduz essa força volitiva.
theological_decisions:
- issue: Sentido da pergunta sobre ter sido vencido
  choice: “em que fui vencido?”
  alternative: “em que fui forçado?”
  rationale: O contexto não identifica agente, pecado ou tentação, e o verbo sem infinitivo complementar favorece “vencer/sobrepujar”. A tradução não acrescenta uma explicação teológica ausente do texto.
- issue: Relação entre a saída do noivo e o jejum
  choice: Preservar a imagem e a sequência sem explicação interpretativa
  alternative: Explicitar a saída como ausência, morte ou retirada de Jesus
  rationale: O dito apresenta a imagem nupcial sem identificar expressamente o noivo nem definir o acontecimento simbolizado; explicá-lo no corpo do texto eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. “Venha, vamos” traduz o convite singular seguido da ação coletiva. A ordem final “que jejuem e orem” conserva o jussivo; “câmara nupcial” mantém a imagem antiga sem paráfrase doutrinária.
