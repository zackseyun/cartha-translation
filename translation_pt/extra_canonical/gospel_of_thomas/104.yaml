  terminology: “Pecado”, “orar”, “jejuar”, “noivo” e “câmara nupcial” são escolhas precisas e de registro apropriado. “Câmara nupcial” preserva a imagem concreta do empréstimo grego sem interpretação doutrinária. A nota em [a] apresenta alternativa lexical legítima e ressalta corretamente a indeterminação do agente ou âmbito.
