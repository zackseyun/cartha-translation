  text: Jesus said[a], Become passers-by.
translation:
  language: pt
  text: 'Jesus disse: “Tornem-se pessoas de passagem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tornem-se os que passam”; “sejam transitórios”; “tornem-se viajantes”. O verbo subjacente é um empréstimo do grego que significa “passar por”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: 'Jesus disse:'
  rationale: Reproduz de modo natural e direto a fórmula copta de introdução da fala.
- source_word: ϣⲱⲡⲉ
  choice: Tornem-se
  rationale: Expressa o sentido de ‘tornar-se, vir a ser’ e a força imperativa do enunciado, preservando também que os destinatários estão no plural.
- source_word: ⲣⲡⲁⲣⲁⲅⲉ
  choice: pessoas de passagem
  rationale: O empréstimo verbal grego significa ‘passar, passar adiante’. A expressão escolhida conserva o caráter nominal e sentencioso, sem restringir o sentido a viajantes literais.
theological_decisions:
- issue: Sentido figurado ou literal de ‘passar’
  choice: Manter a expressão aberta em ‘pessoas de passagem’
  alternative: ‘viajantes’ ou ‘sejam transitórios’
  rationale: O texto breve não explica se a passagem é espacial, existencial ou espiritual; a tradução não deve resolver essa tensão interpretativa.
translation_notes:
  register: Português atual, digno e conciso. ‘Pessoas de passagem’ tem ampla inteligibilidade, preserva a forma aforística e evita o masculino genérico substantivado ‘passantes’, menos natural em parte do mundo lusófono.
