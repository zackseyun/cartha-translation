base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: pt
  text: 'Jesus disse: “Um homem tinha alguns convidados. Quando preparou o jantar, enviou seu servo para convidá-los. O servo foi ao primeiro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Tenho uma quantia em dinheiro com alguns comerciantes; eles virão a mim esta noite. Irei dar-lhes ordens. Peço dispensa do jantar.’


    O servo foi a outro e lhe disse: ‘Meu senhor convidou você.[a]’ Ele respondeu: ‘Comprei uma casa, e estão me requisitando por um dia. Não terei tempo.’


    O servo foi a outro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Meu amigo vai se casar, e sou eu quem preparará o jantar. Não irei. Peço dispensa do jantar.’


    O servo foi a outro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Comprei uma aldeia e vou receber o aluguel. Não irei. Peço dispensa.’


    O servo voltou e disse ao seu senhor: ‘Aqueles que o senhor convidou para o jantar pediram dispensa.’ O senhor disse ao servo: ‘Saia para as estradas. Traga todos os que encontrar, para que jantem. Compradores e comerciantes não entrarão[b] nos lugares de meu Pai.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui o copta usa uma forma de passado: “Meu senhor convidou você”; nas demais ocorrências, usa o presente: “Meu senhor convida você”.'
    reason: textual_variant
  - marker: b
    text: O manuscrito apresenta uma lacuna neste ponto. A restauração “não entrarão” corresponde aos traços preservados e ao espaço disponível.
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: convidados
  rationale: Embora o termo possa significar “estrangeiro” ou “forasteiro”, o contexto do jantar e do convite exige naturalmente “convidados”.
- source_word: ϩⲟⲙⲧ
  choice: dinheiro
  rationale: O sentido concreto é “cobre” e, por extensão, “dinheiro”; a tradução preserva o detalhe econômico, em vez de generalizá-lo como “negócios”.
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: dar-lhes instruções
  rationale: O verbo composto significa ordenar ou dar instruções; esta formulação é clara no contexto da relação com os comerciantes.
- source_word: ⲥⲣϥⲉ
  choice: ter tempo
  rationale: O verbo exprime ter tempo ou lazer; “não terei tempo” é idiomático e fiel ao contexto.
- source_word: ϣⲓ
  choice: ir
  rationale: É forma dialetal ou variante de ϣⲉ, “ir”, e não o verbo “poder”, que exigiria um infinitivo em seguida.
- source_word: ϫⲓ ⲛϣⲱⲙ
  choice: receber o aluguel
  rationale: A expressão idiomática se refere ao recebimento ou à cobrança de renda; “receber o aluguel” é natural e mantém o sentido comercial.
- source_word: ⲣⲉϥⲧⲟⲟⲩ
  choice: compradores
  rationale: É um nome de agente derivado do verbo “comprar”.
- source_word: ϣⲟⲧⲉ
  choice: comerciantes
  rationale: Designa mercadores ou negociantes; “comerciantes” é corrente e adequado ao registro.
- source_word: ⲧⲟⲡⲟⲥ
  choice: lugares
  rationale: O empréstimo grego é mantido em seu sentido amplo de “lugares”, sem interpretá-lo como “Reino” ou outra realidade teológica específica.
theological_decisions:
- issue: A declaração final contra compradores e comerciantes
  choice: “Compradores e comerciantes não entrarão nos lugares de meu Pai.”
  alternative: Harmonizar o encerramento com as parábolas do banquete em Mateus ou Lucas, ou substituir “lugares” por “Reino”.
  rationale: O encerramento peculiar de Tomé deve permanecer explícito e incisivo. A tradução não o harmoniza com paralelos canônicos nem determina além do texto o significado teológico de “lugares de meu Pai”.
- issue: A série de recusas ao convite
  choice: Preservar as justificativas econômicas e sociais específicas de cada convidado.
  alternative: Resumi-las como simples desculpas ou explicá-las como condenação geral do comércio.
  rationale: O texto cria sua tensão por meio dos detalhes concretos; traduzi-los diretamente permite que o leitor avalie a relação entre eles e a sentença final sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo mantém a repetição narrativa do copta, mas usa pronomes e construções naturais em português. “Servo” preserva a relação social indicada por ϩⲙϩⲁⲗ sem confundi-la com os “convidados” da abertura. As fórmulas de recusa foram vertidas de modo cortês, sem apagar seu caráter reiterativo.
