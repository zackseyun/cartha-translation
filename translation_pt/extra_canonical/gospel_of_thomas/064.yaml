  verdict: revise
  source_fidelity: 'A tradução acompanha bem a sequência narrativa, as recusas e a conclusão do copta. Há, porém, acréscimos interpretativos em duas justificativas: os comerciantes vêm ao homem, não especificamente à casa dele; e o segundo homem é requisitado por um dia, sem que o texto diga que será na casa comprada. A formulação «Preciso ir» também torna mais forte que o futuro simples do original.'
  naturalness: O português é claro, moderno e adequado ao registro narrativo. As pequenas revisões propostas deixam o texto mais direto e mais próximo do copta sem prejudicar a fluência.
  terminology: «Convidados», «servo», «jantar», «compradores» e «comerciantes» são escolhas adequadas. «Os lugares de meu Pai» preserva corretamente o sentido amplo de ⲧⲟⲡⲟⲥ, sem harmonização teológica.
