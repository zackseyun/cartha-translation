  revised_text: 'Jesus disse: “Um homem tinha alguns convidados. Quando preparou o jantar, enviou seu servo para convidá-los. O servo foi ao primeiro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Tenho uma quantia em dinheiro com alguns comerciantes; eles virão a mim esta noite. Irei dar-lhes ordens. Peço dispensa do jantar.’


    O servo foi a outro e lhe disse: ‘Meu senhor convidou você.[a]’ Ele respondeu: ‘Comprei uma casa, e estão me requisitando por um dia. Não terei tempo.’


    O servo foi a outro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Meu amigo vai se casar, e sou eu quem preparará o jantar. Não irei. Peço dispensa do jantar.’


    O servo foi a outro e lhe disse: ‘Meu senhor convida você.’ Ele respondeu: ‘Comprei uma aldeia e vou receber o aluguel. Não irei. Peço dispensa.’


    O servo voltou e disse ao seu senhor: ‘Aqueles que o senhor convidou para o jantar pediram dispensa.’ O senhor disse ao servo: ‘Saia para as estradas. Traga todos os que encontrar, para que jantem. Compradores e comerciantes não entrarão[b] nos lugares de meu Pai.’”'
  revised_footnotes:
  - marker: a
