base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: pt
  text: 'Jesus disse: “O Reino do Pai é semelhante a um homem que tinha boa semente. Seu inimigo veio de noite e semeou uma planta de joio[a] sobre a boa semente. O homem não permitiu que a arrancassem. Disse-lhes: ‘Para que vocês não digam: “Vamos arrancar[b] o joio”, e arranquem com ele também o trigo. Pois, no dia da colheita, as plantas de joio aparecerão; serão arrancadas e queimadas[c]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta traz primeiro o singular indefinido (“uma planta de joio”), depois o singular definido (“o joio”) e, no final, o plural (“as plantas de joio”). O termo é um empréstimo do grego ζιζάνιον, que designa o joio, uma erva daninha semelhante ao trigo.
    reason: Preservar a mudança de número gramatical e esclarecer o termo botânico.
  - marker: b
    text: A forma copta traduzida por “vamos arrancar” apresenta uma variante dialetal licopolitana do prefixo futuro da primeira pessoa do plural usado no copta saídico padrão.
    reason: Registrar uma característica dialetal do manuscrito sem alterar o sentido da tradução.
  - marker: c
    text: Literalmente, “arrancam-nas e queimam-nas”. Os verbos ativos têm sujeito indefinido e funcionam aqui como uma construção passiva.
    reason: Explicar a passagem da forma ativa copta para a formulação passiva natural em português.
lexical_decisions:
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: planta de joio / joio / plantas de joio
  rationale: O empréstimo grego ζιζάνιον designa o joio, erva daninha semelhante ao trigo. A formulação preserva a passagem do singular indefinido para o singular definido e, no fim, para o plural, sem recorrer ao pouco natural “um joio”.
- source_word: ⲕⲟⲟⲩ
  choice: não permitiu que a arrancassem
  rationale: A forma de ⲕⲱ, seguida do infinitivo ⲉϩⲱⲗⲉ, tem aqui o sentido de deixar ou permitir que outros arranquem; o pronome singular retoma a planta de joio.
- source_word: ⲉⲛⲁϩⲱⲗⲉ
  choice: vamos arrancar
  rationale: A construção expressa a primeira pessoa do plural no futuro; em português corrente, “vamos arrancar” reproduz naturalmente a fala direta.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: aparecerão
  rationale: A expressão significa tornar-se manifesto ou aparecer, indicando que as plantas de joio se tornarão reconhecíveis na colheita.
- source_word: ⲡⲱϩⲥ
  choice: colheita
  rationale: O substantivo significa colheita ou ceifa; a expressão inteira é “no dia da colheita”.
theological_decisions:
- issue: Identificação de ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: joio
  alternative: erva daninha
  rationale: “Joio” é botanicamente e literariamente adequado ao empréstimo grego e é amplamente compreensível no contexto da parábola. A tradução não acrescenta uma identificação alegórica.
- issue: Forma do título ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: o Reino do Pai
  alternative: o reinado do Pai
  rationale: “Reino do Pai” preserva a forma nominal tradicional e a ambiguidade entre domínio, reinado e realidade régia, sem desenvolver uma interpretação teológica particular.
- issue: Voz dos verbos finais
  choice: serão arrancadas e queimadas
  alternative: irão arrancá-las e queimá-las
  rationale: O copta emprega verbos ativos com sujeito indefinido, funcionando de modo equivalente ao passivo. O passivo em português mantém o foco nas plantas de joio e evita introduzir agentes não identificados.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Reino do Pai”, “joio”, “trigo” e “dia da colheita” preservam o registro proverbial da parábola. O tratamento por “vocês” evita regionalismo excessivo, e a sintaxe foi levemente ajustada para naturalidade sem eliminar a progressão singular-plural do texto copta.
