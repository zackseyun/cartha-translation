base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: pt
  text: 'Jesus disse: “Miserável é o corpo que depende de um corpo[a], e miserável é a alma que depende desses dois[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Depende de”: o verbo copta também pode ter o sentido de “repousa sobre” ou “se apoia em”.'
    reason: lexical_alternative
  - marker: b
    text: '“Desses dois” retoma o par implicado na primeira parte: o corpo que depende e o corpo do qual ele depende, não o corpo e a alma.'
    reason: referent_clarification
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: miserável
  rationale: O empréstimo grego ταλαίπωρος exprime alguém ou algo em condição miserável, desgraçada. “Miserável” conserva o tom forte e avaliativo e funciona naturalmente tanto com “corpo” como com “alma”.
- source_word: ⲥⲱⲙⲁ
  choice: corpo
  rationale: Equivalente direto e corrente do empréstimo grego σῶμα.
- source_word: ⲉⲓϣⲉ (ⲁϣⲉ) + ⲛ
  choice: depende de
  rationale: A construção pode indicar estar apoiado ou repousar sobre algo e, por extensão, depender disso. “Depende de” comunica a relação contínua sem impor a ideia de origem.
- source_word: ⲯⲩⲭⲏ
  choice: alma
  rationale: O empréstimo grego ψυχή é aqui melhor vertido por “alma”, preservando o contraste explícito com “corpo”.
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: desses dois
  rationale: O demonstrativo com a expressão dual retoma o par de corpos da primeira oração. “Desses dois” mantém a referência precisa e a formulação incomum do copta.
theological_decisions:
- issue: Referente de “desses dois”
  choice: O corpo dependente e o outro corpo do qual ele depende
  alternative: O corpo e a alma
  rationale: A expressão retoma o par já implícito na primeira oração, antes da menção da alma como entidade que depende deles; lê-la como “corpo e alma” criaria uma autorreferência não exigida pela sintaxe.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Outro corpo” explicita de modo mínimo que a primeira oração envolve dois corpos, sem eliminar a estranheza deliberada do dito. As notas preservam a amplitude lexical e esclarecem o referente sintático debatido.
