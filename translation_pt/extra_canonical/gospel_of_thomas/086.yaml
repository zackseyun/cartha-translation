base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: pt
  text: 'Jesus disse: “As raposas têm suas tocas[a], e as aves têm seu ninho[b], mas o Filho do Homem[c] não tem onde inclinar a cabeça e descansar[d]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito preserva uma leitura parcialmente reconstruída que pode ser entendida como “uma toca”; o texto normalizado lê “suas tocas”, em paralelo com “seu ninho” na oração seguinte.
    reason: textual_variant
  - marker: b
    text: Literalmente, “seu ninho”, no singular. Ao contrário de Mateus 8:20 e Lucas 9:58, Tomé não acrescenta “do céu” às aves.
    reason: source_detail_and_cross_reference
  - marker: c
    text: O copta diz literalmente “o filho do homem”. Como a escrita copta não distingue maiúsculas de minúsculas, a expressão pode ser entendida como título ou em sentido mais geral; a capitalização é editorial.
    reason: theological_ambiguity
  - marker: d
    text: Tomé acrescenta “e descansar”, expressão ausente dos paralelos em Mateus 8:20 e Lucas 9:58.
    reason: cross_reference
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: raposas
  rationale: O substantivo está no plural; “raposas” traduz diretamente o referente animal e mantém a forma proverbial.
- source_word: ⲃⲏⲃ
  choice: tocas
  rationale: O termo pode indicar cova, buraco ou covil. “Tocas” é natural em português para a morada de raposas e preserva a imagem concreta.
- source_word: ϩⲁⲗⲏⲧ
  choice: aves
  rationale: A forma é plural e não traz no copta o complemento “do céu” presente em paralelos sinóticos.
- source_word: ⲙⲁϩ
  choice: ninho
  rationale: O copta emprega o substantivo no singular com possuidor plural, literalmente “seu ninho” ou “o ninho delas”.
- source_word: ⲣⲓⲕⲉ
  choice: inclinar
  rationale: O verbo significa dobrar ou inclinar. “Inclinar a cabeça” reproduz a imagem sem substituir antecipadamente a ação pelo seu propósito.
- source_word: ⲙⲧⲟⲛ
  choice: descansar
  rationale: O verbo reflexivo expressa repousar ou descansar; aqui é uma ação adicional depois de inclinar a cabeça.
theological_decisions:
- issue: Sentido e capitalização de ⲡϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: o Filho do Homem
  alternative: o filho do homem / o ser humano
  rationale: A forma tradicional “Filho do Homem” mantém a expressão reconhecível e sua possível função titular, enquanto a nota registra que o copta, sem distinção de maiúsculas, também permite uma leitura mais genérica.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. Mantiveram-se o singular “ninho”, a ausência de “do céu” e a ação adicional “descansar”. A formulação “não tem onde” comunica naturalmente a ausência de um lugar sem perder o sentido do copta.
