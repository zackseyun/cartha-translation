base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: pt
  text: 'Os discípulos dele disseram: “Quando[a] te revelarás a nós, e quando te veremos?” Jesus disse: “Quando vocês se despirem sem sentir vergonha,[b] pegarem suas roupas, as colocarem sob seus pés, à maneira das criancinhas,[c] e as pisotearem, então[d] verão o Filho do Vivente,[e] e não terão medo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em que dia”, nas duas perguntas.
    reason: Registra a forma temporal concreta do copta, vertida idiomaticamente por “quando”.
  - marker: b
    text: 'Ou: “se despirem e não sentirem vergonha”.'
    reason: A relação sintática entre despir-se e não ter vergonha pode ser expressa de mais de uma maneira em português.
  - marker: c
    text: 'Isto é, crianças pequenas; o texto traz uma expressão definida: “as criancinhas”.'
    reason: Preserva a referência a crianças pequenas e o caráter definido da expressão copta.
  - marker: d
    text: As letras correspondentes a “então vocês” estão parcialmente restauradas no manuscrito; a leitura é segura pelo contexto.
    reason: Informa de modo transparente a pequena restauração material no testemunho copta.
  - marker: e
    text: Literalmente, “o Filho do Vivente”. A expressão também pode ser parafraseada como “o Filho daquele que vive”.
    reason: Mantém a construção substantivada do copta e não determina se “o Vivente” funciona como título nem a identidade de seu referente.
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: quando
  rationale: A expressão significa literalmente “em que dia”, mas funciona naturalmente como pergunta temporal; “quando” comunica seu sentido corrente em português.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: te revelarás
  rationale: O verbo pode indicar manifestar-se, aparecer ou tornar-se visível. A forma reflexiva preserva a ideia de uma manifestação pessoal sem reduzir a frase a mero aparecimento físico.
- source_word: ⲕⲉⲕⲧⲏⲩⲧⲛ ⲉϩⲏⲩ
  choice: vocês se despirem
  rationale: A expressão indica tirar a roupa e ficar nu. “Despirem-se” é natural e suficientemente explícito no contexto.
- source_word: ϥⲓ ⲛⲛⲉⲧⲛϣⲧⲏⲛ
  choice: pegarem suas roupas
  rationale: Mantém o verbo explícito “tomar/pegar”, presente no copta, em vez de fundi-lo com o ato seguinte de colocar as roupas no chão.
- source_word: ⲛⲓⲕⲟⲩⲉⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ
  choice: as criancinhas
  rationale: Reproduz tanto o caráter definido da expressão quanto sua referência a crianças pequenas.
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: o Filho daquele que vive
  rationale: Traduz a construção genitiva sem identificar silenciosamente “aquele que vive” com um referente teológico específico.
theological_decisions:
- issue: Identidade de “aquele que vive”
  choice: Filho daquele que vive
  alternative: Filho do Vivente
  rationale: A tradução escolhida conserva o sentido do copta e sua possível função titular, mas evita transformar obrigatoriamente “Vivente” em um nome divino técnico.
- issue: Sentido simbólico de despir-se e pisotear as roupas
  choice: Manter as ações concretas sem explicação interpretativa no corpo do texto
  alternative: Parafrasear como abandono do corpo, da vergonha ou da identidade exterior
  rationale: O dito admite diferentes leituras simbólicas; explicitar uma delas na tradução importaria uma interpretação doutrinária não exigida pelo texto.
- issue: Manifestação de Jesus
  choice: te revelarás
  alternative: aparecerás
  rationale: “Revelar-se” abrange manifestação e visibilidade, preservando a tensão entre a revelação pessoal e o ato de ser visto na oração paralela.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com tratamento por “vocês” adequado à fala dirigida ao grupo. A ordem das ações foi mantida: despir-se, pegar as roupas, colocá-las sob os pés e pisoteá-las. A linguagem concreta e a ambiguidade simbólica do dito foram preservadas.'
