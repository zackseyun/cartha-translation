base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: pt
  text: 'Jesus disse: “Bem-aventurada[a] é a pessoa[b] que labutou[c]; encontrou a vida[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo também pode ser traduzido como “feliz” ou “afortunada”.
    reason: lexical_alternative
  - marker: b
    text: O copta se refere genericamente a um ser humano; “homem” também é uma tradução possível em certos contextos.
    reason: lexical_alternative
  - marker: c
    text: 'O verbo pode significar “labutar”, “penar”, “sofrer” ou “ficar aflito”. Outra tradução possível é: “Bem-aventurada é a pessoa que sofreu”.'
    reason: lexical_alternative
  - marker: d
    text: 'O manuscrito traz ⲁⲡⲱⲛϩ; nessa construção, a expressão é entendida como o objeto de “encontrou”: “a vida”.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓ︤ⲥ︥
  choice: Jesus disse
  rationale: É a fórmula narrativa simples e recorrente que introduz os ditos no Evangelho de Tomé.
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: bem-aventurada
  rationale: Preserva o tom solene de uma declaração de felicidade ou condição favorecida, sem reduzi-la apenas a uma emoção subjetiva.
- source_word: ⲡⲣⲱⲙⲉ
  choice: pessoa
  rationale: O termo designa genericamente um ser humano; “pessoa” evita uma referência desnecessariamente restrita ao sexo masculino.
- source_word: ϩⲓⲥⲉ
  choice: labutou
  rationale: O verbo abrange trabalho penoso, fadiga e sofrimento. “Labutou” conserva a ideia de esforço árduo, enquanto a nota registra a leitura igualmente possível “sofreu”.
- source_word: ⲁϥϩⲉ
  choice: ela encontrou
  rationale: O perfeito copta expressa a ação concluída. O pronome feminino retoma naturalmente “a pessoa” em português, sem atribuir sexo feminino ao referente.
- source_word: ⲡⲱⲛϩ
  choice: a vida
  rationale: O substantivo vem com artigo definido no copta, e “encontrou a vida” é natural em português e mantém aberta a possível força existencial ou escatológica da expressão.
theological_decisions:
- issue: Natureza da labuta ou do sofrimento
  choice: Não especificar se a experiência é física, emocional, ascética ou persecutória
  alternative: Explicitar uma provação religiosa ou perseguição
  rationale: O verbo ϩⲓⲥⲉ é semanticamente amplo, e o dito não identifica a causa nem a natureza da dificuldade.
- issue: Sentido de “vida”
  choice: Manter simplesmente “a vida”
  alternative: Interpretar como “vida eterna” ou “salvação”
  rationale: O texto não contém qualificativo; acrescentá-lo resolveria indevidamente uma possível tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Bem-aventurada” mantém o caráter sentencioso do dito; “labutou” é deliberadamente mais literário, mas ainda corrente, e sua amplitude é complementada pela nota. O manuscrito tem formas verbais comuns de terceira pessoa masculina; não há pronome independente enfático. Em português, “ela” apenas concorda gramaticalmente com “pessoa”.
