  terminology: «Descanso» traduz adequadamente anapausis sem impor uma leitura teológica; «mundo novo» traduz diretamente kosmos bbrre. A nota sobre o demonstrativo feminino e a nota sobre a ênfase pronominal são corretas e bem ancoradas.
