base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: pt
  text: '**Evangelho de Tomé — Dito 51**


    Seus discípulos lhe disseram: “Em que dia acontecerá o descanso dos mortos, e em que dia virá o mundo novo?”


    Ele lhes disse: “Aquilo[a] que vocês aguardam[b] veio, mas vocês mesmos[c] não sabem disso.”


    [a] O copta usa aqui um pronome demonstrativo feminino, que retoma gramaticalmente “descanso”, palavra feminina no copta. Em português, essa correspondência de gênero não pode ser preservada com naturalidade, pois “descanso” é masculino.


    [b] A expressão copta significa literalmente “olhar para a frente” e, neste contexto, “aguardar” ou “esperar”.


    [c] O pronome independente “vocês” aparece antes do verbo para dar ênfase: “vocês mesmos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta usa aqui um pronome demonstrativo feminino, que retoma gramaticalmente “descanso”, palavra feminina no copta. Em português, essa correspondência de gênero não pode ser preservada com naturalidade, pois “descanso” é masculino.
    reason: Preservar a referência gramatical do demonstrativo sem produzir português artificial.
  - marker: b
    text: A expressão copta significa literalmente “olhar para a frente” e, neste contexto, “aguardar” ou “esperar”.
    reason: Registrar o valor idiomático e sua imagem lexical subjacente.
  - marker: c
    text: 'O pronome independente “vocês” aparece antes do verbo para dar ênfase: “vocês mesmos”.'
    reason: Explicar a ênfase marcada na sintaxe copta.
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: Em que dia
  rationale: Reproduz diretamente a pergunta por um dia ou momento determinado, sem reduzi-la ao mais geral “quando”.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: descanso
  rationale: Mantém o sentido básico do empréstimo grego ἀνάπαυσις e sua possível carga escatológica, sem explicá-la doutrinariamente.
- source_word: ϣⲱⲡⲉ
  choice: acontecerá
  rationale: Com “descanso” como sujeito de um evento esperado, o verbo significa naturalmente “acontecer” ou “ter lugar”.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: o mundo novo
  rationale: ⲕⲟⲥⲙⲟⲥ é “mundo” e ⲃⲃⲣⲣⲉ é o adjetivo “novo”; a ordem foi ajustada ao português natural.
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: aguardam
  rationale: A expressão idiomática, literalmente relacionada a “olhar para a frente”, denota esperar ou aguardar algo.
- source_word: ⲧⲏ
  choice: Aquilo
  rationale: O demonstrativo feminino retoma gramaticalmente o substantivo feminino copta para “descanso”. “Aquilo” preserva uma referência aberta no texto principal, enquanto a nota informa a ligação gramatical.
- source_word: ⲁⲥⲉⲓ
  choice: veio
  rationale: O perfeito copta afirma que a realidade aguardada veio. Evita-se acrescentar “já”, pois o texto não contém um advérbio equivalente.
- source_word: ⲧⲉⲧⲛⲥⲟⲟⲩⲛ ⲁⲛ ⲙⲙⲟⲥ
  choice: não sabem disso
  rationale: Formulação portuguesa natural para “não a conhecem/não sabem dela”, com referência à realidade mencionada, sem transformar “saber/conhecer” em “reconhecer”.
theological_decisions:
- issue: Escatologia realizada e expectativa futura
  choice: “Aquilo que vocês aguardam veio”
  alternative: “Aquilo que vocês aguardam virá” ou “já veio”
  rationale: O perfeito ⲁⲥⲉⲓ apresenta a realidade esperada como vinda, em contraste deliberado com a pergunta futura dos discípulos. A tradução conserva essa tensão sem convertê-la em futuro e sem acrescentar o advérbio “já”.
- issue: Referente de “Aquilo”
  choice: Manter no texto principal a referência relativamente aberta e explicar em nota a retomada gramatical de “descanso”
  alternative: “O descanso que vocês aguardam veio”
  rationale: O gênero feminino do demonstrativo aponta para “descanso” em copta, mas uma explicitação completa no corpo do texto eliminaria parte da abertura retórica da resposta e poderia excluir indevidamente qualquer eco da segunda expectativa, o “mundo novo”.
- issue: Natureza do desconhecimento dos discípulos
  choice: “não sabem disso”
  alternative: “não o reconhecem”
  rationale: O verbo copta é “saber/conhecer”. “Reconhecer” poderia importar a interpretação de que os discípulos perceberam a realidade sem identificá-la; o texto afirma apenas que não a conhecem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” adequado à legibilidade brasileira e internacional. A sintaxe conserva a repetição “em que dia” e o contraste entre a expectativa futura dos discípulos e a resposta no perfeito. Evitaram-se tanto arcaísmos como “repouso” quanto expansões interpretativas como “salvação”, “reino” ou “já”.
