base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: pt
  text: 'Jesus disse: “O reinado do Pai[a] é como um homem que queria matar um magnata[b]. Em sua casa, ele sacou a espada e a cravou na parede, para saber se sua mão teria força suficiente[c]. Então matou o magnata.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Reinado” traduz o substantivo abstrato ⲡⲙⲛⲧⲣⲣⲟ, que se refere ao governo ou à condição de reinar, não necessariamente a um território. “Reino” também é possível.
    reason: lexical_alternative
  - marker: b
    text: O termo copta, tomado do grego, designa um homem de posição elevada ou grande influência. Também poderia ser traduzido por “homem poderoso”, “homem importante” ou “nobre”.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão copta associa força ou capacidade à ideia de entrar ou penetrar. Mais literalmente: “se sua mão seria forte para entrar”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: reinado
  rationale: O substantivo abstrato formado com ⲙⲛⲧ- indica a condição ou exercício de governar. “Reinado” preserva melhor essa ideia do que um território, sem excluir a alternativa tradicional “reino”.
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: é como
  rationale: Expressão copta usual para introduzir uma comparação ou parábola; a forma portuguesa é clara e direta.
- source_word: ⲟⲩⲱϣ
  choice: queria
  rationale: Expressa desejo ou intenção sem acrescentar motivação moral ou jurídica.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: magnata
  rationale: O empréstimo grego designa um homem de posição elevada ou grande influência. “Magnata” conserva tanto a nuance social quanto o caráter incomum do termo.
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: sacou a espada
  rationale: O verbo indica tirar ou puxar para fora; “sacou a espada” é uma expressão portuguesa natural e não exige explicitar uma bainha.
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: a cravou na parede
  rationale: Reproduz a ação vigorosa de impelir a espada contra ou para dentro da parede.
- source_word: ⲉⲓⲙⲉ
  choice: saber
  rationale: No contexto da prova, indica chegar a conhecer ou verificar o resultado.
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: teria força suficiente
  rationale: ⲧⲱⲕ destaca força ou capacidade, enquanto ⲉϩⲟⲩⲛ acrescenta a noção de penetrar ou entrar. O texto principal comunica o sentido contextual sem introduzir um complemento ausente no copta.
- source_word: ϩⲱⲧⲙ
  choice: matou
  rationale: Verbo comum para matar; a tradução simples preserva a conclusão abrupta da narrativa.
theological_decisions:
- issue: A natureza da expressão “reinado do Pai”
  choice: Manter a imagem como “reinado”, sem explicar seu significado espiritual ou territorial.
  alternative: Traduzir “reino do Pai” ou interpretar a parábola como ensino explícito sobre preparação, força ou violência.
  rationale: O copta apresenta uma comparação enigmática e não fornece interpretação. A tradução preserva a abstração do termo e a tensão da parábola sem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. “Magnata” conserva deliberadamente a nuance social e o sabor estrangeiro do empréstimo grego. A sequência narrativa permanece breve e abrupta, como no copta.
