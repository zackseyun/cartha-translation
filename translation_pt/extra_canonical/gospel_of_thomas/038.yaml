  verdict: approve
  source_fidelity: 'A tradução transmite com precisão a progressão do copta: o desejo repetido de ouvir, o dito/palavras que Jesus está enunciando, a ausência de outra pessoa de quem ouvi-las e a futura busca frustrada. «Virão dias» reproduz de modo idiomático a construção existencial futura, e «me procurarão ... não me encontrarão» preserva o sentido direto do desfecho.'
  naturalness: O português é moderno, claro e adequado a um registro sentencioso. O uso de «vocês», «a vocês» e «outra pessoa de quem ouvi-las» é natural e acessível, especialmente para leitores brasileiros, sem limitar indevidamente a compreensão internacional.
  terminology: «Desejaram», «ouvir», «procurarão» e «encontrarão» são escolhas sóbrias e semanticamente proporcionais. «Estas palavras» é uma harmonização fluente da alternância copta entre singular («este dito») e retomada plural; a nota explica adequadamente essa opção.
