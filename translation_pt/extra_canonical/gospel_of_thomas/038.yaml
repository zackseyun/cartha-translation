base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: pt
  text: 'Jesus disse: “Muitas vezes vocês desejaram ouvir estas palavras[a] que estou dizendo a vocês, e não têm outra pessoa de quem ouvi-las[b]. Virão dias[c] em que vocês me procurarão[d], mas não me encontrarão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta traz literalmente “esta palavra” ou “este dito” no singular e, na oração seguinte, passa a um pronome plural, “as/elas”. “Estas palavras” harmoniza o número em português sem alterar o conteúdo.
    reason: lexical_alternative
  - marker: b
    text: A expressão copta diz, de modo mais literal, “vocês não têm outro de quem ouvi-las”; “outra pessoa” deixa explícito o referente pessoal exigido pelo contexto.
    reason: dialect_note
  - marker: c
    text: Literalmente, “há alguns dias que virão a existir”, uma construção copta existencial de futuro.
    reason: cultural_note
  - marker: d
    text: Compare João 7:34; 8:21; 13:33, onde aparece um motivo semelhante. A redação de Tomé foi mantida sem ser ajustada à forma dos textos canônicos.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: muitas vezes
  rationale: Expressão copta idiomática com o sentido de ‘muitas vezes’; mantém a cadência direta do dito.
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: desejaram
  rationale: O empréstimo grego ἐπιθυμεῖν significa ‘desejar’ ou ‘ansiar por’; ‘desejaram’ é claro, sóbrio e não intensifica indevidamente o texto.
- source_word: ⲉⲥⲱⲧⲙ
  choice: ouvir
  rationale: Conserva o sentido auditivo básico sem introduzir as ideias interpretativas de obedecer ou dar ouvidos.
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ (com o subsequente ⲛⲛⲧⲟⲟⲩ)
  choice: estas palavras
  rationale: O copta começa no singular, ‘esta palavra/este dito’, e depois retoma o conteúdo no plural. A formulação portuguesa harmoniza o número para manter fluidez, e a nota registra a oscilação textual.
- source_word: ⲉⲧⲉⲣⲉ … ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: que estou dizendo a vocês
  rationale: O valor durativo da construção favorece o presente progressivo e preserva a imediatez da fala.
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ
  choice: não têm outra pessoa
  rationale: A construção expressa que os ouvintes não dispõem de nenhum outro de quem receber essas palavras. ‘Pessoa’ torna natural em português o indefinido pessoal ‘outro’.
- source_word: ⲛ̄ⲧⲟϥ (depois de ⲕⲉⲟⲩⲁ)
  choice: de quem
  rationale: O pronome depois de ‘outra pessoa’ tem aqui valor relativo; ‘de quem’ reproduz a relação de origem sem rigidez artificial.
- source_word: ⲟⲩⲛ ϩⲉⲛϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: Virão dias
  rationale: É uma expressão existencial de futuro, literalmente próxima de ‘haverá dias que virão a existir’. ‘Virão dias’ é natural e mantém o movimento temporal.
- source_word: ⲛⲧⲉ … ϣⲓⲛⲉ ⲛⲥⲁⲁⲛⲟⲕ
  choice: em que vocês me procurarão
  rationale: A oração é temporal e futura; ‘procurar’ traduz a busca sem acrescentar a ideia de investigação ou consulta.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ ⲁⲛ ⲉⲁⲛⲟⲕ
  choice: mas não me encontrarão
  rationale: Traduz diretamente o verbo ‘encontrar’ e a negação futura. ‘Mas’ explicita em português o contraste já inerente à sequência.
theological_decisions:
- issue: Relação com passagens canônicas sobre procurar Jesus e não encontrá-lo
  choice: Manter a formulação própria de Tomé sem assimilá-la aos paralelos canônicos
  alternative: Reformular o dito segundo João 7:34; 8:21 ou 13:33
  rationale: A semelhança temática não autoriza importar para este texto palavras, contexto ou conclusões teológicas dos paralelos joaninos.
translation_notes:
  register: Português moderno, digno e acessível, com ‘vocês’ para leitura ampla e boa naturalidade brasileira. A sintaxe permanece concisa e sentenciosa. Evitou-se interpretar ‘ouvir’ como obedecer e evitou-se harmonizar teologicamente o encerramento com o Evangelho de João.
