  naturalness: 'Há uma pequena, mas segura, melhoria de idiomaticidade: numa oração temporal de valor eventual, «quando eles os odeiam e perseguem» soa menos natural do que o futuro do subjuntivo. «Quando eles odiarem e perseguirem vocês» é claro para leitores brasileiros e internacionais e evita a oscilação entre o clítico «os» e «vocês».'
  terminology: «Felizes», «odiar», «perseguir», «encontrar» e «lugar» são escolhas adequadas. «Felizes» comunica naturalmente o caráter de bem-aventurança de μακάριος; a nota evita reduzir ⲧⲟⲡⲟⲥ a um sentido espiritual determinado.
