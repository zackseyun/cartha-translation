base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: pt
  text: 'Jesus disse: “Felizes são vocês quando eles odiarem e perseguirem vocês; e eles não encontrarão lugar[a] no lugar onde perseguiram vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O copta emprega dois termos diferentes, ambos traduzidos por “lugar”: ⲧⲟⲡⲟⲥ (empréstimo do grego τόπος), que em Tomé pode ter ressonância figurada ou teológica, e ⲙⲁ, termo copta comum para um local. A construção também pode ser entendida de modo impessoal: “Felizes são vocês quando forem odiados e perseguidos; e nenhum lugar será encontrado no lugar onde vocês foram perseguidos.”'
    reason: Preservar o jogo lexical e registrar a ambiguidade gramatical entre leitura ativa e passiva impessoal.
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: felizes
  rationale: O empréstimo grego μακάριος introduz uma bem-aventurança. “Felizes” é natural e inteligível em português, sem reduzir a expressão a uma emoção passageira.
- source_word: ⲙⲉⲥⲧⲉ-
  choice: odiar
  rationale: É o verbo copta comum para “odiar”; o presente em português corresponde ao valor eventual da oração com “quando”.
- source_word: ⲇⲓⲱⲕⲉ
  choice: perseguir
  rationale: O empréstimo do grego διώκω, neste contexto de hostilidade, significa “perseguir”.
- source_word: ϩⲉ ⲉ-
  choice: encontrar
  rationale: A construção significa “achar/encontrar”; “encontrar” conserva o sentido direto e corrente.
- source_word: ⲧⲟⲡⲟⲥ
  choice: lugar
  rationale: O empréstimo grego τόπος significa “lugar” e pode admitir ressonância figurada ou teológica, sem que esta precise ser explicitada no texto.
- source_word: ⲙⲁ
  choice: lugar
  rationale: O substantivo copta nativo designa local ou lugar. Repetir “lugar” preserva o jogo deliberado entre dois termos diferentes no original, explicado em nota.
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟϥ
  choice: onde
  rationale: A expressão é resumptiva e local (“nele”), integrada naturalmente à oração relativa portuguesa como “onde”; não significa “para entrar nele”.
theological_decisions:
- issue: 'Construção copta na terceira pessoa do plural: ativa ou passiva impessoal'
  choice: 'Leitura ativa: “eles os odeiam e perseguem... eles não encontrarão”'
  alternative: “quando vocês forem odiados e perseguidos; e nenhum lugar será encontrado...”
  rationale: A terceira pessoa do plural pode funcionar impessoalmente em copta, mas a leitura ativa mantém o mesmo sujeito ao longo da sequência e preserva o contraste entre a perseguição praticada por eles e sua incapacidade de encontrar lugar. A alternativa passiva permanece possível e é registrada em nota.
- issue: Possível peso teológico de ⲧⲟⲡⲟⲥ
  choice: Manter simplesmente “lugar” no texto
  alternative: Explicitar “lugar espiritual”, “repouso” ou “posição”
  rationale: O termo pode ter ressonâncias teológicas no Evangelho de Tomé, mas o dito não define aqui seu sentido. Acrescentar “espiritual” ou equivalente resolveria indevidamente uma ambiguidade genuína.
- issue: Motivo da perseguição
  choice: Não acrescentar motivo cristológico
  alternative: Acrescentar “por minha causa” ou formulação semelhante com base nos paralelos sinóticos
  rationale: Ao contrário de Mateus 5:11 e Lucas 6:22, este texto não apresenta tal motivo; importá-lo alteraria o testemunho próprio de Tomé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” reproduz claramente a segunda pessoa plural. A formulação mantém a repetição paradoxal de “lugar” e evita tanto arcaísmos quanto explicações teológicas inseridas no corpo do dito.
