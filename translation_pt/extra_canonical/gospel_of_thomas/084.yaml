base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: pt
  text: 'Disse Jesus: “No dia em que vocês veem a sua semelhança, vocês se alegram. Mas, quando veem as suas imagens[a], que vieram a existir antes de vocês[b] e que nem morrem nem se manifestam[c], quanto suportarão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta emprega palavras diferentes para “semelhança” (ⲉⲓⲛⲉ) e “imagens” (ϩⲓⲕⲱⲛ, empréstimo do grego εἰκών). O texto estabelece um contraste entre elas, mas não explica plenamente a natureza dessas “imagens”.
    reason: nota lexical e teológica
  - marker: b
    text: Na forma copta correspondente a “vieram a existir”, o manuscrito usa ϩ como variante regional do pronome plural ⲩ.
    reason: nota dialetal
  - marker: c
    text: Nas expressões correspondentes a “nem morrem nem se manifestam”, o manuscrito usa ⲙⲁ- como variante regional do prefixo habitual negativo ⲙⲉⲣⲉ-.
    reason: nota dialetal
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: semelhança
  rationale: Mantém o sentido de semelhança ou aparência e preserva a distinção lexical em relação a ϩⲓⲕⲱⲛ.
- source_word: ϩⲓⲕⲱⲛ
  choice: imagens
  rationale: Reproduz de modo direto o empréstimo grego εἰκών e evita definir, além do que o texto diz, a natureza dessas imagens.
- source_word: ϣⲱⲡⲉ
  choice: vieram a existir
  rationale: Expressa origem ou passagem à existência sem especificar se foram criadas, feitas ou apenas passaram a existir.
- source_word: ϩⲓⲧⲉⲧⲛⲉϩⲏ
  choice: antes de vocês
  rationale: Comunica aqui a precedência temporal indicada pela construção copta.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: se manifestam
  rationale: Preserva o sentido de tornar-se manifesto, aparecer ou ser revelado, sem escolher entre todas essas nuances.
- source_word: ϥⲓ ϩⲁ
  choice: suportarão
  rationale: Traduz o idioma de carregar ou suportar algo e conserva a forma futura e a força retórica da frase final.
theological_decisions:
- issue: Contraste entre ⲉⲓⲛⲉ e ϩⲓⲕⲱⲛ
  choice: semelhança / imagens
  alternative: aparência / formas
  rationale: O texto emprega dois termos diferentes, mas não explica plenamente a natureza das “imagens”. A tradução preserva o contraste sem identificá-las explicitamente como contrapartes divinas, eternas ou celestiais.
- issue: Sentido de “nem morrem nem se manifestam”
  choice: manter a tensão literal
  alternative: interpretar como imagens imortais e ocultas
  rationale: A oração descreve as imagens por duas negações, mas não esclarece como algo que não morre também não se manifesta. A tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural da segunda pessoa. A construção “No dia em que vocês veem” conserva a referência explícita ao dia e o valor geral ou habitual do copta. A frase final mantém a concisão e a abertura retórica do original, sem acrescentar uma ideia explícita de obrigação.
