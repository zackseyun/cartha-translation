  source_fidelity: 'A tradução acompanha adequadamente o copta: “No dia em que” reproduz a moldura temporal; o presente habitual em “veem ... se alegram” é preservado; “quando veem” comunica de forma natural a construção condicional; e “quanto suportarão!” mantém a pergunta retórica final e seu futuro. “Vieram a existir antes de vocês” representa ϣⲱⲡⲉ e a precedência de ϩⲓⲧⲉⲧⲛⲉϩⲏ sem introduzir uma teoria sobre a origem das imagens.'
