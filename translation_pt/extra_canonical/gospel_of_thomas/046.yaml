base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: pt
  text: 'Jesus disse: “Desde Adão até João Batista, entre os nascidos de mulher, ninguém é mais elevado do que João Batista, de modo que seus olhos não serão baixados.[a] Mas eu disse: quem entre vocês se tornar pequeno[b] conhecerá o Reino e se tornará mais elevado do que João.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus olhos não serão quebrados”. A expressão parece indicar baixar os olhos, provavelmente em sinal de deferência. O pronome se refere a João Batista.
    reason: Nota idiomática e cultural necessária para explicar uma imagem copta pouco transparente.
  - marker: b
    text: O copta também pode ser entendido como “uma criança”, “um pequenino” ou “menor”.
    reason: Preserva a ambiguidade lexical e teológica de ⲕⲟⲩⲉⲓ.
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: nascidos
  rationale: No sintagma ‘entre os nascidos de mulher’, expressa descendência ou nascimento e produz em português uma formulação natural, próxima do sentido do copta.
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: mais elevado
  rationale: Preserva a imagem vertical repetida nas duas comparações, sem substituí-la pelo sentido mais genérico de ‘maior’.
- source_word: ⲟⲩⲱϭⲡ (com ⲃⲁⲗ)
  choice: olhos não serão baixados
  rationale: O verbo significa literalmente quebrar ou esmagar, mas com ‘olhos’ forma uma imagem de baixar o olhar, aqui ligada à deferência perante alguém superior.
- source_word: ⲕⲟⲩⲉⲓ
  choice: pequeno
  rationale: O termo pode significar ‘pequeno’, ‘menor’, ‘pequenino’ ou, substantivado, ‘criança’. ‘Pequeno’ preserva a ambiguidade sem impor a interpretação temática de infância.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: Reino
  rationale: Designa reinado, realeza ou reino; ‘Reino’ é claro e corrente, mas mantém aberta a questão do domínio régio, sem complemento ausente no texto.
theological_decisions:
- issue: Sentido de ⲕⲟⲩⲉⲓ
  choice: pequeno
  alternative: criança; pequenino; menor
  rationale: Embora ‘criança’ seja possível e possa ecoar outros ditos de Tomé, o copta não exige essa leitura. A tradução evita resolver a tensão interpretativa no corpo do texto.
- issue: Comparação com João Batista
  choice: mais elevado
  alternative: maior; mais exaltado
  rationale: A mesma raiz de altura aparece nas duas partes. A repetição em português conserva a estrutura e não define se a elevação é posição, dignidade ou grandeza espiritual.
- issue: Sentido de ⲙⲛⲧⲉⲣⲟ
  choice: Reino
  alternative: reinado; soberania real
  rationale: ‘Reino’ é a forma bíblica mais inteligível e não acrescenta ‘de Deus’ ou ‘dos céus’, complementos inexistentes no copta.
- issue: Valor da oração sobre os olhos de João
  choice: de modo que seus olhos não serão baixados
  alternative: para que seus olhos não sejam baixados; de modo que ele não baixe os olhos
  rationale: Mantém a formulação passiva/futura e a ligação lógica do manuscrito, sem explicar no texto se o gesto indica deferência ou vergonha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém as repetições e ambiguidades relevantes do copta. ‘Vocês’ favorece clareza internacional com leitura natural no Brasil; ‘Reino’ recebe inicial maiúscula por convenção editorial religiosa, sem acrescentar um complemento teológico.
