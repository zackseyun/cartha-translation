base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: pt
  text: 'Jesus disse[a]: “A colheita é abundante, mas os trabalhadores são poucos. Roguem ao senhor[b] que envie trabalhadores para a colheita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diferentemente dos paralelos em Mateus 9:38 e Lucas 10:2, o Evangelho de Tomé não traz “da colheita” depois de “senhor”, nem “sua” antes da última ocorrência de “colheita”.
    reason: textual_variant
  - marker: b
    text: O copta ⲡϫⲟⲉⲓⲥ pode significar “o senhor”, “o dono” ou, como título, “o Senhor”. O contexto agrícola permite entendê-lo como o responsável pela propriedade, mas não elimina a possível ressonância teológica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: colheita
  rationale: É o equivalente português natural para a colheita ou o ato de ceifar, preservando a imagem agrícola.
- source_word: ⲛⲁϣⲱϥ / ⲛⲁϣⲉⲛⲧⲟϥ
  choice: é abundante
  rationale: Expressa que a colheita é grande ou copiosa; “abundante” é claro e idiomático em português.
- source_word: ⲥⲟⲃⲕ
  choice: são poucos
  rationale: Mantém o contraste quantitativo direto entre a colheita abundante e o pequeno número de trabalhadores.
- source_word: ⲥⲟⲡⲥ
  choice: roguem
  rationale: O verbo significa suplicar, rogar ou pedir com insistência. “Roguem” conserva sua força sem recorrer ao arcaísmo “suplicai”.
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: o senhor
  rationale: “Senhor” pode designar o dono ou responsável pela propriedade e também preserva a possível ressonância teológica do termo copta.
- source_word: ⲛⲟⲩϫⲉ ... ⲉⲃⲟⲗ
  choice: envie
  rationale: A expressão significa literalmente lançar para fora, mas, neste contexto, “enviar” comunica de modo natural o ato de despachar trabalhadores à colheita.
theological_decisions:
- issue: Sentido de ⲡϫⲟⲉⲓⲥ
  choice: senhor
  alternative: dono; Senhor
  rationale: A forma “senhor”, em minúscula, funciona naturalmente para o responsável por uma propriedade agrícola, enquanto a nota preserva a possibilidade de leitura como título “Senhor”, sem decidir a ambiguidade de modo dogmático.
- issue: Relação da colheita final com o senhor
  choice: para a colheita
  alternative: para a sua colheita
  rationale: O copta não apresenta possessivo antes da ocorrência final de “colheita”; por isso, não se acrescenta “sua”, embora essa forma apareça em paralelos canônicos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Roguem” retém a intensidade do verbo copta sem soar excessivamente arcaico. A pontuação e o encadeamento foram ajustados à fluidez do português, sem acrescentar os possessivos presentes nos paralelos canônicos.
