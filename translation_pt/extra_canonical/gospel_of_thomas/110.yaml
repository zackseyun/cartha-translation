base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: pt
  text: 'Jesus disse: “Quem encontrou o mundo[b] e se tornou rico[a], renuncie ao mundo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se tornou grande/importante”; o verbo copta ⲣⲣⲙⲙⲁⲟ pode indicar tornar-se rico ou grande/importante.
    reason: lexical_alternative
  - marker: b
    text: Dilley restaura a preposição copta antes da primeira ocorrência de “mundo”, em razão de uma pequena lacuna no manuscrito.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Fórmula direta que introduz a fala e preserva a concisão do copta.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: Quem encontrou
  rationale: A construção relativa genérica com aspecto perfeito indica alguém que já encontrou.
- source_word: ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: o mundo
  rationale: Tradução natural do empréstimo copta do grego κόσμος, sem acrescentar interpretação.
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  choice: e se tornou rico
  rationale: Expressa o estado resultante; o sentido de riqueza é provável, embora a forma também possa indicar grandeza ou destaque.
- source_word: ⲙⲁⲣⲉ ⲛⲧⲟϥ
  choice: renuncie
  rationale: O subjuntivo exortativo português transmite com naturalidade a injunção do jussivo copta, sem exigir pronome marcado por gênero.
- source_word: ⲁⲣⲛⲁ
  choice: renuncie
  rationale: Comunica abandono ou rejeição deliberada melhor que uma simples negação verbal.
- source_word: ⲛ/ⲙ ⲡⲕⲟⲥⲙⲟⲥ
  choice: ao mundo
  rationale: Mantém a repetição enfática do substantivo presente no original.
theological_decisions:
- issue: Natureza da riqueza ou grandeza adquirida
  choice: Manter no texto principal o sentido provável de riqueza e registrar a alternativa lexical em nota.
  alternative: “se tornou grande” ou “se tornou importante”
  rationale: O verbo copta admite ambos os campos semânticos; a tradução não deve transformar essa ambiguidade lexical em afirmação teológica exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com cadência breve. O imperativo na terceira pessoa (“renuncie”) preserva a força exortativa e evita introduzir gênero não explicitado na construção genérica.
