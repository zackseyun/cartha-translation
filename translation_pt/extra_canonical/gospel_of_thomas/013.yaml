base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: pt
  text: 'Jesus disse aos seus discípulos: “Comparem-me e digam-me com quem me pareço.”[a]


    Simão Pedro lhe disse: “Você se parece com um anjo justo.”


    Mateus lhe disse: “Você se parece com um ser humano — um filósofo, um homem de entendimento.”[b]


    Tomé lhe disse: “Mestre, minha boca não será de modo algum capaz de dizer com quem você se parece.”


    Jesus disse: “Eu não sou o seu mestre,[c] pois você bebeu e ficou embriagado com a fonte borbulhante[d] que eu mesmo medi.”[e]


    Então ele o tomou consigo, retirou-se e lhe disse três palavras.[f]


    Quando Tomé chegou aos seus companheiros, eles lhe perguntaram: “O que Jesus disse a você?”


    Tomé lhes disse: “Se eu lhes contar uma só das palavras que ele me disse, vocês pegarão pedras e as lançarão contra mim; e sairá fogo das pedras e consumirá vocês.”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No manuscrito, o verbo traduzido por “me pareço” contém uma pequena restauração editorial; ela não produz incerteza relevante quanto ao sentido geral da frase.
    reason: lacuna_or_restoration
  - marker: b
    text: Literalmente, “um homem, um filósofo, um homem de coração/mente”. “Um filósofo sábio” é uma paráfrase possível.
    reason: lexical_alternative
  - marker: c
    text: 'A frase “Eu não sou o seu mestre” é deliberadamente paradoxal no contexto: Tomé acaba de chamá-lo de Mestre, mas Jesus relaciona a negação ao fato de Tomé já ter bebido de sua fonte.'
    reason: cultural_note
  - marker: d
    text: A palavra copta ⲃⲣⲃⲣ é onomatopaica. Também poderia ser traduzida por “murmurante” ou “gorgolejante”.
    reason: lexical_alternative
  - marker: e
    text: “Medi” também pode ser entendido como “reparti” ou, no contexto da água, “tirei”. A imagem do original é vívida e incomum.
    reason: lexical_alternative
  - marker: f
    text: “Três palavras” também pode significar “três declarações” ou “três ditos”. O texto não revela seu conteúdo.
    reason: lexical_alternative
  - marker: g
    text: 'O texto apresenta dois atos: eles pegariam pedras e depois as lançariam contra Tomé. A saída de fogo das próprias pedras inverte de maneira enigmática a cena de apedrejamento.'
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: Comparem-me
  rationale: O verbo ⲧⲟⲛⲧ exprime estabelecer uma comparação. O imperativo plural conciso conserva tanto a forma de ordem quanto a ligação com a pergunta seguinte.
- source_word: ⲉⲓⲛⲉ
  choice: parecer-se com
  rationale: Neste contexto comparativo, o verbo significa ‘ser semelhante a’ ou ‘parecer-se com’, não simplesmente ‘ser’.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: anjo justo
  rationale: O empréstimo grego ⲁⲅⲅⲉⲗⲟⲥ designa aqui plausivelmente um ser celestial; ‘justo’ preserva o valor moral de ⲇⲓⲕⲁⲓⲟⲥ sem ampliação interpretativa.
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: um ser humano — um filósofo, um homem de entendimento
  rationale: Mantém a estrutura apositiva e a referência inicial à humanidade. ‘Homem de entendimento’ reflete literalmente o idioma ‘homem de coração/mente’, sem reduzi-lo apenas a ‘filósofo sábio’.
- source_word: ⲡⲥⲁϩ
  choice: Mestre
  rationale: É o tratamento natural em português para um mestre ou professor, adequado tanto na fala de Tomé quanto na resposta paradoxal de Jesus.
- source_word: ϩⲟⲗⲱⲥ ... ⲛⲁϣϣⲁⲡϥ ⲁⲛ
  choice: não será capaz, de modo algum
  rationale: A tradução preserva a negação intensificada por ϩⲟⲗⲱⲥ e o valor futuro do prefixo ⲛⲁ-.
- source_word: ⲡⲡⲏⲅⲏ ⲉⲧⲃⲣⲃⲣⲉ
  choice: fonte borbulhante
  rationale: ‘Fonte’ corresponde ao empréstimo grego πηγή, e ‘borbulhante’ comunica o caráter sonoro e onomatopaico de ⲃⲣⲃⲣ.
- source_word: ⲁⲛⲟⲕ ⲛⲧⲁⲉⲓϣⲓⲧⲥ
  choice: que eu mesmo medi para você
  rationale: ‘Eu mesmo’ conserva a ênfase do pronome independente ⲁⲛⲟⲕ. ‘Medi’ retém a imagem estranha e concreta do verbo, enquanto ‘para você’ explicita em português o destinatário implicado pelo contexto de beber.
- source_word: ⲛϣⲟⲙⲧ ⲛϣⲁϫⲉ
  choice: três palavras
  rationale: A tradução formal evita decidir se eram palavras isoladas, declarações ou ensinamentos; ‘palavras’ preserva a abertura semântica de ϣⲁϫⲉ.
- source_word: ⲧⲉⲧⲛⲁϥⲓⲱⲛⲉ ⲛⲧⲉⲧⲛⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: vocês pegarão pedras e as lançarão contra mim
  rationale: Traduz os dois verbos distintos — pegar e lançar — sem fundi-los, e faz de ⲉⲣⲟⲉⲓ o alvo explícito do lançamento.
theological_decisions:
- issue: A declaração paradoxal ‘Eu não sou o seu mestre’
  choice: Manter a negação literalmente, sem explicá-la no corpo do texto
  alternative: Parafrasear como uma superação da relação comum entre mestre e discípulo
  rationale: O copta apresenta uma negação direta e a relaciona à embriaguez proveniente da fonte de Jesus. Explicar a lógica teológica eliminaria uma tensão intencional do dito.
- issue: As três palavras secretas ditas a Tomé
  choice: Não reconstruir nem identificar o conteúdo
  alternative: Associá-las a uma fórmula ou doutrina específica
  rationale: O manuscrito não informa quais foram as palavras; qualquer identificação importaria uma interpretação externa.
- issue: Fogo saindo das pedras
  choice: Conservar a imagem como consequência narrativa enigmática
  alternative: Interpretá-la explicitamente como juízo divino, milagre ou vingança
  rationale: O texto não nomeia o agente nem explica o sentido do fogo. A tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “você/vocês” para distinguir com clareza os interlocutores singular e plural. A pontuação organiza o diálogo sem suavizar suas imagens estranhas. Termos concretos como “boca”, “embriagado”, “fonte”, “pedras” e “fogo” foram preservados; ambiguidades relevantes aparecem no texto ou em notas, sem impor uma leitura denominacional.
