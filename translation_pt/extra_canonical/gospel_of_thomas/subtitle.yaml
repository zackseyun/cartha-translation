  text: The gospel according to Thomas[a][b]
translation:
  language: pt
  text: O Evangelho segundo Tomé[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “boa notícia”. O termo ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ, tomado do grego εὐαγγέλιον, pode ser traduzido literalmente como “boa notícia” ou “boa mensagem”; como título de um gênero literário, porém, “Evangelho” é a forma habitual.'
    reason: lexical_alternative
  - marker: b
    text: O copta traz literalmente «o segundo/conforme Tomé» (ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ), uma fórmula fixa usada em títulos de manuscritos coptas. Em português, ela é traduzida idiomaticamente por «segundo Tomé».
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Evangelho
  rationale: Embora o empréstimo do grego εὐαγγέλιον possa exprimir “boa notícia”, “Evangelho” é a designação consagrada e natural em português para esse gênero e título manuscrito.
- source_word: ⲡⲕⲁⲧⲁ
  choice: segundo
  rationale: Na fórmula titular copta, ⲕⲁⲧⲁ, tomado do grego κατά, indica atribuição ou apresentação conforme a pessoa nomeada. “Segundo” preserva essa fórmula tradicional sem afirmar de modo mais forte autoria direta.
- source_word: ⲑⲱⲙⲁⲥ
  choice: Tomé
  rationale: “Tomé” é a forma portuguesa tradicional e amplamente reconhecida desse nome próprio.
theological_decisions:
- issue: Força da atribuição no título
  choice: segundo Tomé
  alternative: de Tomé
  rationale: “Segundo” mantém a ambiguidade da fórmula antiga entre associação, tradição e autoria, enquanto “de Tomé” poderia sugerir autoria direta com maior força.
translation_notes:
  register: Título em português moderno, digno e amplamente inteligível, preservando a fórmula tradicional “Evangelho segundo...”. A capitalização identifica um título de obra. As notas esclarecem tanto a alternativa lexical quanto o caráter convencional da fórmula copta.
