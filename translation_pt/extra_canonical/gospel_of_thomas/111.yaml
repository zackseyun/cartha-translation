review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a coordenação de “os céus e a terra”, o futuro de “se enrolarão”, o plural de “diante de vocês”, a relação expressa em “vive a partir do vivente” e a ambiguidade não teológica de “vivente”. Também conserva corretamente a passagem abrupta para Jesus na terceira pessoa. A pergunta final, porém, fica mais fiel à fórmula interrogativa afirmativa ⲟⲩⲭ ϩⲟⲧⲓ com “Jesus não diz...?”, em vez de “Não é verdade que Jesus diz...?”.
  naturalness: “Não é verdade que Jesus diz...?” é compreensível, mas soa pesado e pouco idiomático no registro português moderno. “Jesus não diz...?” é natural, mantém a pergunta que espera confirmação e deixa a ruptura de voz bem perceptível.
  terminology: “Vivente” em minúscula é uma solução apropriada para ⲡⲉⲧⲟⲛϩ, pois não resolve o referente. “Digno” traduz adequadamente ⲙ̄ⲡϣⲁ. A nota sobre ⲟⲩⲁⲁϥ deve apresentar “sozinho” como possível ressonância, não como sentido imposto ao texto principal.
  issues:
