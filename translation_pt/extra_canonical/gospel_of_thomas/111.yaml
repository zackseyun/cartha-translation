base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: pt
  text: 'Jesus disse: “Os céus e a terra se enrolarão diante de vocês; e aquele que vive a partir do vivente não verá a morte.” Jesus não diz[a]: “Quem encontra a si mesmo[b], o mundo não é digno dele”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui o texto passa abruptamente a falar de Jesus na terceira pessoa, citando-o como autoridade externa. Esse comentário sobre a própria fala é singular no Evangelho de Tomé e pode ser uma observação de compilador ou uma camada editorial posterior incorporada ao texto.
    reason: textual_variant
  - marker: b
    text: O copta pode ser entendido reflexivamente, “encontra a si mesmo”. A palavra também pode evocar “sozinho”, deixando possível a ressonância de “encontra a si mesmo sozinho”, sem que essa leitura seja exigida pelo texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: se enrolarão
  rationale: O verbo pode significar “dobrar” ou “enrolar”, como se faz com um rolo. “Se enrolarão” preserva a imagem apocalíptica sem acrescentar a comparação com um pergaminho.
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: diante de vocês
  rationale: A expressão denota presença ou posição diante de alguém; esta formulação é natural em português e mantém o plural da segunda pessoa.
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ ⲡⲉⲧⲟⲛϩ
  choice: aquele que vive a partir do vivente
  rationale: Mantém tanto a relação de origem expressa por ⲉⲃⲟⲗ ϩⲛ̄ quanto a repetição de “viver”, sem identificar explicitamente o “vivente” com uma figura divina específica.
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: Não é verdade que... ?
  rationale: A locução introduz uma pergunta que espera resposta afirmativa. A formulação portuguesa comunica essa força interrogativa sem confundi-la com a leitura grega literal “não que”.
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: encontra a si mesmo
  rationale: A construção funciona reflexivamente, embora ⲟⲩⲁⲁϥ também possa evocar a ideia de estar só; essa ressonância é preservada em nota.
- source_word: ⲙ̄ⲡϣⲁ
  choice: não é digno dele
  rationale: Reproduz diretamente a declaração de que o mundo não é merecedor ou digno dessa pessoa.
theological_decisions:
- issue: Identidade do “vivente”
  choice: vivente, em minúscula
  alternative: Vivente, com maiúscula, ou “Deus”
  rationale: O texto não identifica de modo inequívoco o referente como o Pai, Jesus ou outra designação divina. A minúscula preserva essa ambiguidade.
- issue: Sentido de ⲟⲩⲁⲁϥ
  choice: valor reflexivo no texto principal
  alternative: “encontra a si mesmo sozinho” ou “encontra aquele que está só”
  rationale: A função reflexiva oferece a leitura gramatical mais direta no contexto, enquanto a possível ressonância de “sozinho” é registrada sem impor uma teologia do solitário.
- issue: Mudança para referência a Jesus na terceira pessoa
  choice: preservar literalmente a mudança e explicá-la em nota
  alternative: harmonizar como continuação direta da fala de Jesus
  rationale: A mudança de voz faz parte do texto transmitido e pode refletir comentário editorial, mas a tradução não deve decidir silenciosamente sua origem.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A sintaxe foi suavizada apenas onde necessário: os dois sujeitos foram coordenados sob um único verbo, como no copta, e a repetição conceitual de “vive/vivente” foi mantida para preservar a tensão do original.'
