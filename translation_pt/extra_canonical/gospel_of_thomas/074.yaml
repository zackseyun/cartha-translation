base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: pt
  text: 'Ele disse: “Senhor,[a] há muitos em volta da cisterna, mas não há nada no poço.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O copta diz literalmente: «Ele disse: “Senhor...”». Não fica claro quem fala nem a quem se dirige «Senhor».'
    reason: Preserva a ambiguidade narrativa e vocativa do copta.
  - marker: b
    text: 'Ou: «mas não há ninguém no poço». O copta pode significar tanto «nada» como «ninguém». Os dois substantivos traduzidos por «cisterna» e «poço» são termos distintos no copta.'
    reason: Registra a ambiguidade de ⲗⲁⲁⲩ e a distinção lexical entre ϫⲱⲧⲉ e ϣⲱⲛⲉ.
lexical_decisions:
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: Senhor
  rationale: 'O artigo definido copta pode acompanhar o vocativo. A forma preserva a leitura direta “Ele disse: ‘Senhor...’” sem converter a expressão em “O Senhor disse”.'
- source_word: ⲡϫⲱⲧⲉ
  choice: poço
  rationale: O termo pode designar poço ou cisterna. “Poço” é natural em português e não acrescenta a ideia pouco segura de um bebedouro.
- source_word: ⲡϣⲱⲛⲉ
  choice: dentro dele
  rationale: O termo designa poço, cisterna ou cova. Como o antecedente imediato já foi traduzido por “poço”, o pronome evita uma repetição artificial, mantendo a imagem espacial expressa por ϩⲛ.
- source_word: ⲗⲁⲁⲩ
  choice: ninguém
  rationale: Com o existencial negativo, pode significar “ninguém” ou “nada”. A presença de muitas pessoas ao redor favorece o contraste humano “muitos... ninguém”, sem eliminar a alternativa gramatical.
theological_decisions:
- issue: Identidade de quem fala e de quem é chamado de Senhor
  choice: 'Ele disse: “Senhor...”'
  alternative: O Senhor disse
  rationale: A construção copta apresenta “ele disse” seguido de “Senhor”, plausivelmente vocativo. A tradução não identifica além do texto nem o falante nem o destinatário.
- issue: Sentido da ausência no poço
  choice: não há ninguém dentro dele
  alternative: não há nada dentro dele
  rationale: “Ninguém” preserva o contraste entre os muitos ao redor e a ausência de alguém dentro, mas ⲗⲁⲁⲩ admite ambas as leituras; a alternativa é registrada em nota para não resolver silenciosamente a metáfora.
translation_notes:
  register: Português moderno, claro e digno. A formulação concisa conserva o paralelismo entre “muitos” e “ninguém”; a nota registra tanto a leitura impessoal quanto a indefinição do falante e do destinatário.
