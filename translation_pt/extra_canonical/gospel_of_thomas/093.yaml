base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: pt
  text: Não deem o que é santo[a] aos cães, para que eles não os joguem[b] no monte de esterco[c]. Não joguem pérolas aos porcos, para que não lhe façam isso [...] [d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O que é santo” traduz um adjetivo substantivado (ⲡⲉⲧⲟⲩⲁⲁⲃ), literalmente “a coisa santa”.
    reason: lexical_alternative
  - marker: b
    text: O texto copta traz um objeto plural, “os”, embora “o que é santo” esteja no singular. A discordância foi preservada.
    reason: textual_grammar
  - marker: c
    text: “Monte de esterco” traduz o empréstimo grego ⲕⲟⲡⲣⲓⲁ, um amontoado de esterco ou resíduos comum na vida aldeã.
    reason: cultural_note
  - marker: d
    text: O copta preserva “lhe façam isso”, com pronome singular apesar de “pérolas” estar no plural, e depois apenas ⲡⲗⲁ… antes de uma lacuna. Alguns editores conjecturam “pisotear”, com base em Mateus 7:6, mas o manuscrito não conserva essa palavra.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ϫⲉⲙⲡⲣϯ
  choice: Não deem
  rationale: A construção proibitiva ⲙⲡⲣ + infinitivo pede um imperativo negativo direto; ϯ significa “dar”.
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: o que é santo
  rationale: É um adjetivo substantivado, literalmente “a coisa santa”; a formulação escolhida preserva o sentido genérico sem acrescentar uma referência ritual ou eclesiástica.
- source_word: ⲛⲡⲟⲩϩⲟⲣ
  choice: aos cães
  rationale: Plural genérico natural em português para ϩⲟⲟⲣ, “cão”.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: para que ... não
  rationale: Expressa prevenção ou finalidade negativa. Em português corrente, “para que não” comunica isso com clareza sem a solenidade pouco usual de “a fim de que não”.
- source_word: ⲛⲟⲩⲛⲟϫⲟⲩ
  choice: eles não os joguem
  rationale: O verbo significa “jogar/lançar” e traz um objeto pronominal plural, -ⲟⲩ. Mantém-se o plural transmitido, embora não concorde claramente com o antecedente singular “o que é santo”.
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: monte de esterco
  rationale: O empréstimo grego designa um amontoado de esterco ou resíduos; “monte de esterco” é concreto e compreensível.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: Não joguem
  rationale: Repete-se “jogar” para conservar a repetição do mesmo verbo presente nas duas partes do dito.
- source_word: ⲛⲡⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: pérolas
  rationale: O empréstimo significa “pérola”; o plural é exigido pelo contexto, apesar da variação dos artigos no copta.
- source_word: ⲛⲡⲉϣⲁⲩ
  choice: aos porcos
  rationale: Tradução simples e atual de ϣⲁⲩ, “porcos/suínos”.
- source_word: ⲉⲓⲣⲉ ⲛⲧⲟϥ / ⲛⲟⲩⲁⲁϥ
  choice: façam isso a ela
  rationale: A parte legível indica “fazer” com referente pronominal singular. “A ela” deixa visível a discordância entre esse singular e “pérolas”, sem conjecturar a ação perdida após a lacuna.
theological_decisions:
- issue: Possível harmonização com Mateus 7:6
  choice: Não completar a lacuna com “pisotear” nem reformular a primeira consequência segundo Mateus.
  alternative: “para que não as pisoteiem” ou uma redação harmonizada com Mateus 7:6
  rationale: O manuscrito não preserva o verbo conjecturado “pisotear”. A tradução deve representar o texto copta existente e sua lacuna, não completar o dito a partir de um paralelo canônico.
translation_notes:
  register: Português moderno, digno e direto, com imperativos no plural e vocabulário concreto. A redação conserva deliberadamente as duas discordâncias pronominais do manuscrito e assinala a lacuna, evitando harmonização com Mateus 7:6.
