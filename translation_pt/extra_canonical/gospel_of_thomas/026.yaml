base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: pt
  text: 'Jesus disse: “A lasca[a] que está no olho do seu irmão[d], você a vê; mas a trave[b] que está no seu próprio olho, você não a vê. Quando você tirar a trave do seu próprio olho, então enxergará claramente[c] para tirar a lasca do olho do seu irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cisco”. “Lasca” preserva mais explicitamente a imagem de um pequeno fragmento de madeira.
    reason: lexical_alternative
  - marker: b
    text: Ou “viga”. O termo copta designa uma peça estrutural de madeira, não apenas um tronco.
    reason: lexical_alternative
  - marker: c
    text: “Enxergará claramente” traduz a expressão copta que, de modo mais literal, seria “verá para fora”.
    reason: dialect_note
  - marker: d
    text: “Irmão” também pode designar, neste contexto, um companheiro ou condiscípulo.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: lasca
  rationale: Designa um pequeno fragmento de madeira. “Lasca” preserva a imagem de madeira e o contraste com a trave; “cisco” seria natural, mas menos específico.
- source_word: ⲡⲥⲟⲓ
  choice: trave
  rationale: O termo denota uma viga estrutural. “Trave” conserva o sentido arquitetônico e o forte contraste de tamanho com “lasca”.
- source_word: ⲛⲟⲩϫⲉ
  choice: tirar
  rationale: O verbo pode significar lançar, expulsar ou remover. No contexto de retirar algo do olho, “tirar” é idiomático e mantém a mesma ação nas duas ocorrências.
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: enxergar claramente
  rationale: A expressão, literalmente próxima de “ver para fora”, comunica clareza de visão; “enxergar claramente” transmite esse valor em português natural.
- source_word: ⲥⲟⲛ
  choice: irmão
  rationale: É o equivalente lexical direto e preserva a linguagem familiar do texto, sem decidir se a referência é a um irmão biológico ou a um companheiro discípulo.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: quando você tirar
  rationale: A construção introduz uma oração temporal futura ou condicional. O futuro do subjuntivo é a forma portuguesa natural e não sobrecarrega o aspecto.
- source_word: ⲃⲁⲗ
  choice: olho
  rationale: Equivalente anatômico direto, sem nuance especial no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A topicalização copta foi preservada por meio de “A lasca..., você a vê” e “a trave..., você não a vê”, incluindo os pronomes resumptivos. Emprega-se “seu” de modo coerente com o tratamento por “você”, evitando regionalismos marcados.
