base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: pt
  text: 'Jesus disse: “Aquilo que você ouvir em seu ouvido, proclame-o no outro ouvido, sobre os terraços de vocês.[a] Pois ninguém acende uma lamparina e a coloca debaixo de um cesto de medir[b], nem a põe num lugar escondido. Pelo contrário, põe-na no suporte para lamparina, a fim de que todos os que entram e os que saem vejam a luz dela.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação “em seu ouvido ... no outro ouvido” é enigmática no copta. O fragmento grego correspondente também apresenta dificuldades de construção; por isso, a tradução não a harmoniza com versões mais conhecidas deste dito.
    reason: Preservar e explicar uma ambiguidade textual real sem resolvê-la no corpo da tradução.
  - marker: b
    text: 'Ou “debaixo de uma medida”: trata-se provavelmente de um recipiente usado para medir produtos secos.'
    reason: Explicar o objeto antigo e registrar a alternativa sem sobrecarregar o texto principal.
  - marker: c
    text: O copta diz expressamente “os que entram e os que saem”, enquanto paralelos conhecidos costumam mencionar apenas os que entram.
    reason: Sinalizar uma característica relevante deste testemunho sem harmonizá-lo com os paralelos canônicos.
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: proclame
  rationale: O verbo expressa anúncio público ou proclamação; “proclame” conserva a força do imperativo e combina naturalmente com a imagem dos terraços.
- source_word: ϩⲓϫⲛ̄ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: sobre os terraços de vocês
  rationale: Preserva a mudança do singular (“você”, nos ouvidos) para o plural (“de vocês”, nos terraços) presente no copta, sem reduzir a expressão à fórmula mais familiar “dos telhados”.
- source_word: ϩⲏⲃⲥ
  choice: lamparina
  rationale: Designa uma pequena lâmpada alimentada por óleo, não uma vela nem uma lâmpada moderna; “lamparina” é claro e historicamente apropriado.
- source_word: ⲙⲁⲁϫⲉ
  choice: cesto de medir
  rationale: A palavra pode designar uma medida ou o recipiente usado para medir. Esta tradução torna concreta a imagem sem recorrer ao arcaísmo regional “alqueire”.
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: suporte para lamparina
  rationale: Expressa o objeto que sustenta a lamparina de modo mais transparente ao leitor moderno do que “candeeiro”, que em variedades do português pode ser entendido como a própria luminária.
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: luz
  rationale: Equivalente direto e natural; o pronome em “a luz dela” remete gramaticalmente à lamparina.
theological_decisions:
- issue: Relação enigmática entre “um ouvido”, “o outro ouvido” e a proclamação
  choice: Manter “no seu ouvido — no outro ouvido — proclame”, assinalando a dificuldade em nota
  alternative: Harmonizar como “o que você ouvir em um ouvido, proclame do alto dos terraços” ou interpretar “ao outro ouvido” como destinatário
  rationale: A construção copta é genuinamente difícil, e o testemunho grego sobreposto também não elimina toda a incerteza. Uma harmonização silenciosa resolveria uma ambiguidade que pertence à evidência textual.
- issue: Alcance da imagem da lamparina
  choice: Traduzir a metáfora sem acrescentar identificação doutrinária da luz
  alternative: Explicitar que a luz representa o evangelho, a revelação interior ou o ensino secreto
  rationale: O dito associa proclamação e visibilidade, mas não identifica expressamente a luz com uma doutrina específica; a tradução não deve impor essa identificação.
- issue: “Os que entram e os que saem”
  choice: Conservar os dois movimentos literalmente
  alternative: Generalizar como “todos” ou harmonizar apenas para “os que entram”
  rationale: A formulação dupla é distintiva do texto copta e pode carregar uma tensão interpretativa própria; deve permanecer visível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantiveram-se a alternância entre o singular e o plural, a estranheza da expressão dos dois ouvidos e a sequência “entram e saem”. Evitaram-se tanto o arcaísmo “alqueire” quanto termos que poderiam sugerir iluminação elétrica moderna.
