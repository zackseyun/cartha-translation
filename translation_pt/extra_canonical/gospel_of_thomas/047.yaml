revisions:
- from: 'Jesus disse: “Uma pessoa não pode montar dois cavalos e esticar dois arcos. Também um servo não pode servir a dois senhores; do contrário, honrará um e insultará o outro. Ninguém bebe vinho velho e imediatamente deseja beber vinho novo. Não se derrama vinho novo em odres velhos, para que eles não se rompam. Nem se derrama vinho velho em odre novo, para que o vinho não o estrague.[a] Não se costura um remendo velho numa roupa de festa,[b] porque disso resultará um rasgo.”'
  to: 'Jesus disse: “Uma pessoa não pode montar dois cavalos e retesar dois arcos. E um servo não pode servir a dois senhores; do contrário, honrará um e insultará o outro. Ninguém bebe vinho velho e imediatamente deseja beber vinho novo. Não se derrama vinho novo em odres velhos, para que eles não se rompam. Nem se derrama vinho velho em odre novo, para que o vinho não o estrague.[a] Não se costura um remendo velho numa roupa de festa,[b] porque disso resultará um rasgo.”'
  rationale: 'A revisão limita-se a duas melhorias seguras de idiomaticidade: «retesar» para a ação de puxar um arco e «E» para a coordenação entre as máximas. Mantêm-se as formulações próprias de Tomé, inclusive vinho velho em odre novo e remendo velho em roupa de festa, bem como os dois vínculos de nota.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:51:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'O texto acompanha fielmente a sequência e as inversões características do copta: dois cavalos/dois arcos, dois senhores, vinho velho e novo, odres e o remendo velho na veste festiva. A explicitação de que o vinho velho estraga o odre novo é uma inferência sintática e contextual segura; não altera o sentido.'
  naturalness: A redação é clara e de registro apropriado. Contudo, «esticar dois arcos» não é a formulação portuguesa mais idiomática para o ato de puxar/tesar um arco; «retesar dois arcos» preserva melhor a imagem. «E um servo» também flui melhor que «Também um servo» após a primeira máxima.
  terminology: «Servo», «senhores», «odres» e «roupa de festa» são escolhas adequadas. «Roupa de festa» traduz literalmente a expressão copta e evita harmonizá-la indevidamente como «roupa nova».
  issues:
  - severity: low
    issue: «Esticar dois arcos» é pouco idiomático no contexto de manejar arcos.
    rationale: O verbo copta ϫⲱⲗⲕ, com «arco», denota puxar/tesar. «Retesar» exprime essa ação com maior precisão e naturalidade em português.
  - severity: low
    issue: «Também um servo» produz uma conexão um pouco truncada.
    rationale: A conjunção copta é simplesmente coordenativa; «E um servo» mantém a ligação e melhora a fluência.
  revised_text: 'Jesus disse: “Uma pessoa não pode montar dois cavalos e retesar dois arcos. E um servo não pode servir a dois senhores; do contrário, honrará um e insultará o outro. Ninguém bebe vinho velho e imediatamente deseja beber vinho novo. Não se derrama vinho novo em odres velhos, para que eles não se rompam. Nem se derrama vinho velho em odre novo, para que o vinho não o estrague.[a] Não se costura um remendo velho numa roupa de festa,[b] porque disso resultará um rasgo.”'
  revised_footnotes:
  - marker: a
    text: Tomé proíbe aqui pôr vinho velho em odre novo, formulação que não aparece dessa maneira nos paralelos sinóticos (cf. Mateus 9:17; Marcos 2:22; Lucas 5:37–39).
    reason: cross_reference
  - marker: b
    text: Literalmente, “roupa de festa”. O texto fala de um remendo velho nessa roupa, preservando uma formulação diferente da imagem do remendo novo numa roupa velha encontrada nos evangelhos sinóticos.
    reason: cultural_note
  revision_rationale: 'A revisão limita-se a duas melhorias seguras de idiomaticidade: «retesar» para a ação de puxar um arco e «E» para a coordenação entre as máximas. Mantêm-se as formulações próprias de Tomé, inclusive vinho velho em odre novo e remendo velho em roupa de festa, bem como os dois vínculos de nota.'
