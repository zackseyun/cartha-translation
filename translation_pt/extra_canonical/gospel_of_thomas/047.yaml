base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: pt
  text: 'Jesus disse: “Uma pessoa não pode montar dois cavalos e retesar dois arcos. E um servo não pode servir a dois senhores; do contrário, honrará um e insultará o outro. Ninguém bebe vinho velho e imediatamente deseja beber vinho novo. Não se derrama vinho novo em odres velhos, para que eles não se rompam. Nem se derrama vinho velho em odre novo, para que o vinho não o estrague.[a] Não se costura um remendo velho numa roupa de festa,[b] porque disso resultará um rasgo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tomé proíbe aqui pôr vinho velho em odre novo, formulação que não aparece dessa maneira nos paralelos sinóticos (cf. Mateus 9:17; Marcos 2:22; Lucas 5:37–39).
    reason: cross_reference
  - marker: b
    text: Literalmente, “roupa de festa”. O texto fala de um remendo velho nessa roupa, preservando uma formulação diferente da imagem do remendo novo numa roupa velha encontrada nos evangelhos sinóticos.
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉ-
  choice: não pode
  rationale: A construção significa literalmente que não há capacidade ou possibilidade. “Não pode” preserva o sentido e soa mais natural em português do que “é impossível que” nesta sequência de máximas.
- source_word: ϫⲱⲗⲕ ⲛⲡⲓⲧⲉ
  choice: esticar dois arcos
  rationale: No contexto do arco, o verbo significa esticar ou retesar; “esticar” é claro para leitores comuns e mantém a imagem concreta.
- source_word: ϩⲙϩⲁⲗ
  choice: servo
  rationale: O termo pode designar servo ou escravo. “Servo” combina naturalmente com “servir a dois senhores” sem eliminar por completo a relação de subordinação presente no original.
- source_word: ⲣⲧⲓⲙⲁ / ⲣϩⲩⲃⲣⲓⲍⲉ
  choice: honrará / insultará
  rationale: Os empréstimos gregos expressam, respectivamente, honrar e tratar com insolência ou ultraje. O par português mantém o contraste direto.
- source_word: ⲁⲥⲕⲟⲥ
  choice: odre
  rationale: Empréstimo do grego askos, um recipiente de pele para líquidos. “Odre” é o equivalente português tradicional e preciso.
- source_word: ⲧⲁⲕⲟ
  choice: estrague
  rationale: O verbo abrange destruir, arruinar ou estragar. “Estragar” se ajusta naturalmente ao efeito do vinho sobre o odre.
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: roupa de festa
  rationale: Tradução concreta do sentido literal, “veste de festa”. Evita substituir a expressão por “roupa nova”, qualificação não expressa diretamente no copta.
- source_word: ⲡⲱϩ
  choice: rompam / rasgo
  rationale: 'O campo semântico inclui romper e rasgar. A escolha varia conforme o referente: odres se rompem, e numa roupa resulta um rasgo.'
theological_decisions:
- issue: Harmonização com os paralelos sinóticos
  choice: Preservar vinho velho em odre novo e remendo velho em roupa de festa
  alternative: Alterar para vinho novo em odres novos e remendo novo em roupa velha, conforme formulações sinóticas conhecidas
  rationale: O testemunho copta de Tomé apresenta essas formulações próprias. Corrigi-las pelos evangelhos canônicos apagaria as inversões e resolveria indevidamente a tensão textual.
- issue: Identidade do agente que estraga o odre novo
  choice: Explicitar “para que o vinho não o estrague”
  alternative: Usar apenas “para que não o estrague”, mantendo os dois pronomes sem referente nominal expresso
  rationale: A construção copta usa pronomes masculinos singulares e permite entender o vinho velho como aquilo que estraga o odre. A explicitação evita uma frase portuguesa opaca sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se as imagens concretas e as formulações próprias de Tomé, sem harmonização denominacional ou sinótica. “Odre” é vocabulário bíblico menos cotidiano, mas necessário pela precisão cultural e suficientemente reconhecível no contexto.
