base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: pt
  text: 'Jesus disse: “As imagens são manifestas ao ser humano[a], e a luz que há nelas está oculta na imagem da luz do Pai. Ele[b] será revelado, e sua imagem está oculta por sua luz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O copta diz literalmente “ao homem” ou “à pessoa”, no singular genérico, com sentido coletivo: a humanidade ou os seres humanos.'
    reason: Esclarecer o uso coletivo do substantivo singular.
  - marker: b
    text: 'O pronome copta pode se referir tanto ao Pai quanto à luz, pois os dois termos são masculinos. Assim, também é possível entender: “A luz será revelada, e sua imagem está oculta por sua luz.”'
    reason: Preservar a ambiguidade gramatical do referente.
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  choice: as imagens
  rationale: O manuscrito traz o artigo plural e o verbo no plural; ϩⲓⲕⲱⲛ é empréstimo do grego εἰκών e designa imagens ou formas visíveis.
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: são manifestas
  rationale: A forma estativa exprime aquilo que está manifesto, visível ou patente; “são manifestas” conserva o contraste com o que permanece oculto.
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: ao ser humano
  rationale: O substantivo singular genérico ⲡⲣⲱⲙⲉ pode funcionar coletivamente; “ao ser humano” preserva o singular e sua abrangência.
- source_word: ϩⲏⲡ⳿ / ϩⲱⲡ
  choice: está oculta
  rationale: O estativo indica um estado presente de ocultação, não uma ação futura.
- source_word: ϭⲱⲗⲡ⳿ ⲉⲃⲟⲗ
  choice: será revelado
  rationale: O verbo exprime revelar-se ou ser trazido à manifestação e mantém o contraste intencional entre revelado e oculto.
theological_decisions:
- issue: Referente do pronome masculino singular em “Ele será revelado”
  choice: Manter “Ele” sem identificar explicitamente o referente, acompanhado de nota
  alternative: “A luz será revelada, e sua imagem está oculta por sua luz” ou uma formulação que identifique o Pai
  rationale: No copta, o pronome masculino singular pode retomar tanto “o Pai” quanto “a luz”, pois ambos os substantivos são gramaticalmente masculinos. A tradução não deve resolver uma ambiguidade real do texto.
- issue: Relação entre imagem, luz e Pai
  choice: Preservar literalmente a sequência “na imagem da luz do Pai”
  alternative: Parafrasear como uma imagem pertencente ao Pai ou como a própria manifestação divina
  rationale: A cadeia de genitivos admite tensão interpretativa; uma paráfrase teológica importaria relações que o texto não explicita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo entre “manifestas”, “oculta” e “revelado”, evita linguagem denominacional e conserva a densidade imagética do original.
