base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: pt
  text: 'Uma mulher lhe disse no meio da multidão: “Feliz o ventre que te carregou e os seios que te amamentaram.”[a] Ele lhe disse: “Felizes os que ouviram a palavra do Pai e a guardaram em verdade.[b] Pois virão dias em que vocês dirão: ‘Feliz o ventre que não concebeu[c] e os seios que não deram leite.’”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta diz literalmente “teus seios”, uma construção possessiva que se refere aos seios dos quais ele mamou; a tradução emprega a forma idiomática “os seios que te amamentaram”.
    reason: dialect_note
  - marker: b
    text: “A guardaram em verdade” também pode ser traduzido como “a preservaram”, “a observaram” ou “a guardaram verdadeiramente”.
    reason: lexical_alternative
  - marker: c
    text: O verbo copta aqui significa “conceber” ou “ficar grávida”, não simplesmente “dar à luz”.
    reason: lexical_alternative
  - marker: d
    text: Algumas letras restauradas no manuscrito, em palavras como “mulher”, “ventre”, “seios” e “amamentaram”, não alteram o sentido. Compare Lucas 11:27–28 e 23:29.
    reason: lacuna_or_restoration_and_cross_reference
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ
  choice: uma mulher
  rationale: O artigo indefinido apresenta uma mulher não identificada no meio da multidão.
- source_word: ⲙⲏⲏϣⲉ
  choice: multidão
  rationale: Equivalente corrente e natural para o sentido de ajuntamento ou grande grupo.
- source_word: ⲡϩⲏ ... ϥⲓ ϩⲁ
  choice: o ventre que te carregou
  rationale: Preserva a imagem corporal e expressa a gestação e o nascimento sem confundir este verbo com o verbo posterior, que significa conceber.
- source_word: ⲓⲃⲉ ... ⲥⲁⲛⲟⲩϣ
  choice: os seios que te amamentaram
  rationale: Expressão portuguesa natural para os seios dos quais ele mamou; evita o pouco idiomático possessivo literal copta.
- source_word: ⲉⲓⲁⲧ
  choice: Feliz/Felizes
  rationale: Forma corrente e solene de introduzir uma bem-aventurança, sem exigir a formulação mais eclesiástica “bem-aventurado”.
- source_word: ⲥⲱⲧⲙ
  choice: ouviram
  rationale: O relativo perfeito indica uma ação realizada; o pretérito perfeito é natural em português.
- source_word: ⲡⲗⲟⲅⲟⲥ ⲛⲡⲉⲓⲱⲧ
  choice: a palavra do Pai
  rationale: Mantém o termo tradicional para λόγος e o título simples “o Pai”, sem explicitação teológica acrescentada.
- source_word: ϩⲁⲣⲉϩ ⲉⲛⲧⲟϥ
  choice: a guardaram
  rationale: Conserva a possibilidade de guardar, preservar ou observar a palavra, sem restringi-la a mera obediência.
- source_word: ϩⲛ ⲟⲩⲙⲉ
  choice: em verdade
  rationale: Reproduz a construção preposicional e preserva o tom característico do texto, embora “verdadeiramente” também seja possível.
- source_word: ⲙⲡⲥⲱ
  choice: não concebeu
  rationale: O verbo ⲱ refere-se especificamente a engravidar ou conceber, distinguindo-se da expressão anterior para carregar ou dar à luz.
- source_word: ⲙⲡⲟⲩϯⲉⲣⲱⲧⲉ
  choice: não deram leite
  rationale: Tradução direta da formulação negativa; mantém a imagem concreta sem harmonizá-la com textos paralelos.
theological_decisions:
- issue: Relação entre parentesco biológico e ouvir a palavra do Pai
  choice: Manter as duas bem-aventuranças em tensão, sem acrescentar conectivo adversativo
  alternative: Introduzir “antes” ou “pelo contrário” na resposta de Jesus
  rationale: O copta justapõe a resposta à fala da mulher e não explicita que a segunda bem-aventurança anule a primeira.
- issue: Referência de “Pai”
  choice: Traduzir apenas “o Pai”
  alternative: Expandir para “Deus Pai”
  rationale: A expansão identificaria explicitamente o referente além do que o texto copta declara.
- issue: Sentido de guardar a palavra
  choice: “a guardaram em verdade”
  alternative: “obedeceram verdadeiramente a ela”
  rationale: A alternativa resolveria a amplitude de ϩⲁⲣⲉϩ em favor de obediência; “guardar” conserva as ideias possíveis de preservar e observar.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Feliz” evita arcaísmo desnecessário; “vocês” torna explícita a mudança do singular dirigido à mulher para o plural dirigido aos ouvintes. A sintaxe mantém o paralelismo e a tensão do original sem harmonização silenciosa com Lucas.
