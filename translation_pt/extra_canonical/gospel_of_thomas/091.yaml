base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: pt
  text: 'Eles lhe disseram: “Diga-nos[e] quem és, para que possamos crer[a] em ti.” Ele lhes disse: “Vocês examinam a face[b] do céu e da terra, e não reconhecem aquele que está diante de vocês[c]; e este kairós vocês não sabem como examinar[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode significar “confiar”; aqui, “crer em ti” pode incluir essa nuance relacional.
    reason: lexical_alternative
  - marker: b
    text: “Face” também pode ter o sentido de “aparência”. A expressão copta diz literalmente “a face do céu e da terra”.
    reason: cultural_note
  - marker: c
    text: 'A construção também admite “aquilo que está diante de vocês”, mas o pronome masculino singular usado em seguida favorece a referência pessoal: “aquele que está diante de vocês”.'
    reason: textual_ambiguity
  - marker: d
    text: Kairós é um empréstimo do grego que pode indicar um tempo determinado, uma ocasião oportuna ou um momento decisivo. “Examinar” também pode ser traduzido por “testar” ou “pôr à prova”.
    reason: lexical_alternative
  - marker: e
    text: O texto impresso traz uma formulação equivalente a “dize/diga-nos”, enquanto a normalização traz outra; ambas sustentam o sentido “Diga-nos”.
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Dize-nos
  rationale: As formas do texto manuscrito e da normalização comunicam o mesmo pedido imperativo. “Dize-nos” preserva a interpelação direta e solene sem ampliar o sentido.
- source_word: ⲛⲧⲕ ⲛⲓⲙ
  choice: quem és
  rationale: É a forma idiomática de perguntar pela identidade pessoal do interlocutor.
- source_word: ⲣⲡⲓⲥⲧⲉⲩⲉ
  choice: crer
  rationale: O empréstimo grego πιστεύειν pode indicar crer ou confiar. “Crer em ti” corresponde naturalmente à construção e mantém aberta a nuance de confiança.
- source_word: ⲣⲡⲓⲣⲁⲍⲉ
  choice: examinar
  rationale: O verbo grego emprestado pode significar testar, pôr à prova ou examinar. “Examinar” funciona naturalmente tanto com a face do céu e da terra quanto com o kairós, preservando a repetição do original.
- source_word: ⲡϩⲟ
  choice: face
  rationale: Mantém a imagem concreta e marcante do copta; a possível acepção idiomática “aparência” é indicada em nota.
- source_word: ⲡⲡⲉ / ⲧⲡⲉ
  choice: céu
  rationale: No par “céu e terra”, designa o céu visível sem exigir que o texto se refira à morada divina.
- source_word: ⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: aquele que está diante de vocês
  rationale: O pronome objeto masculino singular subsequente favorece uma referência pessoal, embora a construção isolada também possa ser entendida de modo impessoal.
- source_word: ⲥⲟⲟⲩⲛ
  choice: reconhecer / saber
  rationale: Na primeira ocorrência, o contexto de uma pessoa presente favorece “reconhecer”; na construção com infinitivo, o verbo expressa saber como realizar a ação.
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: kairós
  rationale: 'A transliteração conserva a amplitude do empréstimo grego: tempo oportuno, decisivo ou determinado. A nota esclarece o termo sem escolher silenciosamente apenas uma dessas nuances.'
theological_decisions:
- issue: Identidade daquele que está diante dos interlocutores
  choice: Manter a referência apenas como “aquele que está diante de vocês”
  alternative: Explicitar “Jesus” ou interpretar a expressão de modo impessoal
  rationale: O contexto sugere que o referente é o próprio interlocutor, mas o texto não o nomeia nesta oração. A tradução evita inserir uma identificação interpretativa no corpo do dito.
- issue: Sentido de kairós
  choice: Conservar o termo transliterado e explicar sua faixa semântica em nota
  alternative: Traduzir exclusivamente como “tempo determinado”, “momento oportuno” ou “época”
  rationale: Nenhum equivalente português único preserva toda a tensão entre ocasião, momento crítico e tempo determinado presente no empréstimo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se “Dize-nos quem és” para a interpelação singular direta, enquanto “vocês” torna natural a resposta dirigida ao grupo. A repetição de “examinar” reproduz a repetição verbal do copta. Evitaram-se tanto arcaísmos excessivos quanto paráfrases teológicas.
