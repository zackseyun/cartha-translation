  naturalness: O texto é claro, mas “Dize-nos” é mais arcaizante do que o registro moderno solicitado. “Diga-nos” preserva a dignidade do discurso e tem legibilidade mais ampla. “Para que possamos crer em ti” explicita naturalmente a finalidade sem alterar o sentido.
  terminology: “Céu e terra”, “face”, “reconhecem”, “aquele que está diante de vocês” e “kairós” são escolhas defensáveis. A nota sobre kairós esclarece o empréstimo sem estreitar indevidamente seu alcance. Convém incluir a nota sobre a variação entre a leitura impressa e a normalizada na fórmula inicial, presente no histórico de auditoria inglês.
