revisions:
- from: 'Eles lhe disseram: “Dize-nos quem és, para que creiamos[a] em ti.” Ele lhes disse: “Vocês examinam a face[b] do céu e da terra, mas não reconhecem aquele que está diante de vocês[c]; e este kairós vocês não sabem examinar[d].”'
  to: 'Eles lhe disseram: “Diga-nos[e] quem és, para que possamos crer[a] em ti.” Ele lhes disse: “Vocês examinam a face[b] do céu e da terra, e não reconhecem aquele que está diante de vocês[c]; e este kairós vocês não sabem como examinar[d].”'
  rationale: A revisão substitui a adversativa não expressa no copta pela coordenação “e”, atualiza a forma imperativa para o português moderno e acrescenta a nota que documenta a variação textual inicial. Mantêm-se a ambiguidade controlada da expressão relativa, a repetição de “examinar” e a transliteração de kairós.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:52:07Z'
