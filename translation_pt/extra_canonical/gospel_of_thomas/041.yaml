base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: pt
  text: 'Jesus disse: “Quem tem algo na mão[a], eles lhe darão; e quem não tem, eles[b] tirarão dele até o pouco[c] que tem[d].”[e][f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção possessiva copta ⲟⲩⲛⲧⲁ- com pronome objeto (aqui, ⲧⲟϥ, “isso”) pode ter uso expletivo, equivalendo simplesmente a “ter”. Por clareza, acrescenta-se “algo”.
    reason: lexical_alternative
  - marker: b
    text: Os verbos na terceira pessoa do plural (“eles darão/tirarão”) têm sentido impessoal no saídico, aproximadamente “será dado/tirado”. A tradução conserva “eles” sem identificar um agente, refletindo a construção copta.
    reason: dialect_note
  - marker: c
    text: ⲡⲕⲉϣⲏⲙ significa literalmente algo como “também/até o pequeno”, com o adjetivo substantivado; pode indicar uma pequena quantidade ou “os poucos”. “Até o pouco” preserva a concisão e traduz o valor adicional de ⲕⲉ-.
    reason: lexical_alternative
  - marker: d
    text: 'A transcrição diplomática traz ⲛ̄ⲧⲟⲟⲧϥ̄, “dele”; a linha normalizada apresenta ⲛⲧⲛⲛⲧⲟϥ. Esta tradução segue a leitura direta da expressão preposicional: “dele”.'
    reason: textual_variant
  - marker: e
    text: Compare Marcos 4:25; Mateus 13:12; Lucas 8:18; 19:26. Esses paralelos apresentam o aforismo na voz passiva e não incluem “na mão”.
    reason: cross_reference
  - marker: f
    text: 'Ou: “até o pouco que tem lhe será tirado”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: O verbo narrativo ⲡⲉϫⲉ significa “dizer/falar”; o pretérito perfeito preserva o estilo sentencioso do texto.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: quem tem algo
  rationale: A relativa com a construção possessiva ⲟⲩⲛⲧⲁ- expressa posse; o pronome objeto pode funcionar de modo expletivo, por isso “algo” explicita o sentido sem identificar o objeto.
- source_word: ϩⲛⲡⲉϥϭⲓϫ
  choice: na mão
  rationale: Tradução direta da expressão espacial; ϭⲓϫ significa “mão”.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ
  choice: eles lhe darão
  rationale: O futuro na terceira pessoa do plural tem agente impessoal; ⲛⲁ- com pronome masculino singular marca o destinatário, expresso por “lhe”.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: quem não tem
  rationale: A forma relativa negativa nega a mesma construção possessiva da primeira oração.
- source_word: ⲡⲕⲉϣⲏⲙ
  choice: até o pouco
  rationale: O adjetivo substantivado ϣⲏⲙ designa “o pouco/a pequena quantidade”, enquanto ⲕⲉ- acrescenta o valor de “também/até”; a formulação mantém a concisão e a ambiguidade.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: que tem
  rationale: A oração relativa especifica que esse pouco pertence à pessoa mencionada.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ
  choice: eles tirarão
  rationale: O segundo futuro na terceira pessoa do plural é igualmente impessoal; ϥⲓ significa “tomar, tirar, levar”.
- source_word: ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: dele
  rationale: A preposição disjuntiva indica separação ou retirada de junto de alguém; “dele” reproduz esse valor de origem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “eles” é deliberadamente preservada como sujeito impessoal, apesar de soar incomum em português. “Até o pouco” mantém tanto o reforço de ⲕⲉ- quanto a concisão ambígua de ϣⲏⲙ. A leitura “dele” segue a transcrição diplomática ⲛ̄ⲧⲟⲟⲧϥ̄; a forma divergente da linha normalizada é tratada como questão textual, sem alterar o sentido adotado.
