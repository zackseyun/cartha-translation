base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: pt
  text: 'Jesus disse: “Uma cidade construída sobre uma montanha alta[a] e fortificada não pode cair, nem poderá ficar escondida[b].”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O fragmento grego deste dito (P.Oxy. 1) traz “no cume de uma montanha alta”, enquanto o copta não contém “no cume”.
    reason: textual_variant
  - marker: b
    text: Na última oração, o copta passa ao futuro (“nem poderá ficar escondida”); o fragmento grego emprega o presente para os dois verbos (“não pode cair nem ficar escondida”).
    reason: textual_variant
  - marker: c
    text: Compare Mateus 5:14. Tomé une a imagem da cidade que não pode ser escondida à de uma construção firme que não cai; compare Mateus 7:24–25.
    reason: cross_reference
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: construída
  rationale: A construção circunstancial com sujeito plural indefinido (‘eles a constroem’) funciona como oração relativa e é expressa naturalmente em português pela voz passiva.
- source_word: ⲧⲟⲟⲩ
  choice: montanha
  rationale: É o termo comum para ‘montanha’ ou ‘monte’; ‘montanha’ preserva melhor a elevação indicada pelo qualificativo seguinte.
- source_word: ϫⲓⲥⲉ
  choice: alta
  rationale: O qualitativo masculino modifica ‘montanha’, e não ‘cidade’, indicando sua altura.
- source_word: ⲧⲁϫⲣⲟ
  choice: fortificada
  rationale: O qualitativo feminino modifica ‘cidade’ e comunica que ela foi tornada firme ou segura; ‘fortificada’ preserva a imagem urbana e explica por que não pode cair.
- source_word: ϩⲉ
  choice: cair
  rationale: Na construção idiomática com ‘não há poder/possibilidade’, o infinitivo significa ‘cair’; portanto, ‘não pode cair’.
- source_word: ϩⲱⲡ
  choice: ficar escondida
  rationale: A forma futura com elemento potencial indica que a cidade não será capaz de ser ocultada; ‘ficar escondida’ é português natural sem apagar a voz passiva da ideia.
theological_decisions:
- issue: Harmonização com Mateus 5:14
  choice: não pode cair, nem poderá ficar escondida
  alternative: não pode ficar escondida
  rationale: O texto copta de Tomé inclui tanto a impossibilidade de cair quanto a de ser escondida. A tradução mantém essa ampliação, sem reduzi-la à formulação canônica de Mateus.
- issue: Sentido de ⲉⲥⲧⲁϫⲣⲏⲩ
  choice: fortificada
  alternative: firmemente estabelecida
  rationale: As duas ideias são lexicalmente possíveis. ‘Fortificada’ se ajusta à imagem de uma cidade e à impossibilidade de cair, sem acrescentar um agente ou uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem sintática natural. ‘Montanha alta’ mantém a concordância do copta; ‘fortificada’ conserva a firmeza defensiva da cidade. O contraste entre presente (‘não pode cair’) e futuro (‘nem poderá ficar escondida’) foi preservado.
