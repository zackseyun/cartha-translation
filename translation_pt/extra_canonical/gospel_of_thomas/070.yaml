base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: pt
  text: 'Jesus disse: “Quando vocês fizerem surgir algo dentro de vocês,[a] isso — o que vocês têm — os salvará.[b] Caso contrário,[c] há pobreza[d] dentro de vocês. Isso — o que vocês não têm dentro de vocês, no íntimo de vocês[f] — os matará.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta traduzida por “fizerem surgir” pode ser vertida mais literalmente como “fizerem vir a existir” dentro de vocês.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode significar “libertar” ou “beneficiar”; a oposição com “matar” favorece “salvar”.
    reason: lexical_alternative
  - marker: c
    text: A partícula foi entendida como “caso contrário” ou “do contrário”; também pode ser interpretada como “antes” ou “em vez disso”.
    reason: alternative_reading
  - marker: d
    text: O copta diz literalmente “pobreza”. O termo foi preservado, em vez de ser explicado como “falta” ou “carência”.
    reason: cultural_note
  - marker: e
    text: No manuscrito, parte das letras do verbo “matará” está danificada e foi restaurada; o sentido da leitura é considerado seguro.
    reason: lacuna_or_restoration
  - marker: f
    text: A expressão copta significa “no interior” ou “interiormente” e reforça, pela segunda vez, a ideia de interioridade.
    reason: dialect_note
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ
  choice: quando
  rationale: Introduz uma condição geral com valor temporal; “quando” preserva a formulação breve sem excluir a nuance de “sempre que”.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ
  choice: fizerem surgir
  rationale: Reproduz a construção causativa, literalmente próxima de “fizerem vir a existir”, em português natural.
- source_word: ϩⲛⲛⲧⲱⲧⲛ
  choice: dentro de vocês
  rationale: Mantém a interioridade pretendida e é idiomático em português de ampla compreensão.
- source_word: ⲡⲁⲓ
  choice: isso
  rationale: Conserva a referência demonstrativa sem identificar o referente, que permanece ambíguo no copta.
- source_word: ⲟⲩⲛ ... ⲛⲧⲱⲧⲛ ⲛⲧⲟϥ
  choice: o que vocês têm
  rationale: A construção existencial com dativo expressa posse; esta é sua forma natural em português.
- source_word: ⲧⲟⲩϫⲟⲛ
  choice: salvará
  rationale: “Salvar” forma a contraposição mais direta com “matar” e conserva a força potencialmente soteriológica sem desenvolvê-la.
- source_word: ⲡⲏ
  choice: caso contrário
  rationale: Expressa o valor disjuntivo ou consequencial mais provável, embora a partícula admita outras análises.
- source_word: ⲙⲛⲧⲁⲁⲛⲟⲛ
  choice: pobreza
  rationale: Mantém o substantivo abstrato concreto e desconcertante do original, em vez de interpretá-lo como mera “falta”.
- source_word: ϩⲛⲧⲏⲛⲉ
  choice: em seu íntimo
  rationale: Torna explícita a segunda expressão de interioridade sem repetir mecanicamente “dentro”.
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: matará
  rationale: Verbo causativo de “morrer”; “matar” preserva a antítese incisiva com “salvar”.
theological_decisions:
- issue: Identidade daquilo que está dentro das pessoas
  choice: Manter o referente indefinido por meio de “isso — o que vocês têm”
  alternative: Explicitar como luz, conhecimento, Reino ou natureza divina
  rationale: O texto copta não identifica o referente; especificá-lo importaria uma interpretação teológica não expressa no dito.
- issue: Sentido de “salvar”
  choice: Conservar “salvar” sem qualificação
  alternative: Parafrasear como libertar, beneficiar ou dar salvação espiritual
  rationale: A antítese com “matar” favorece “salvar”, mas a natureza dessa salvação permanece aberta.
- issue: Relação entre pobreza e ausência interior
  choice: Preservar a formulação paradoxal “há pobreza dentro de vocês”
  alternative: Explicar pobreza como ignorância, vazio espiritual ou carência moral
  rationale: O original apresenta a tensão sem fornecer sua interpretação; a tradução não deve resolvê-la.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para a segunda pessoa do plural. A sintaxe mantém o caráter breve e paradoxal do dito. Travessões destacam a aposição explicativa sem definir o referente ambíguo. Todos os marcadores aparecem junto às expressões a que se referem.
