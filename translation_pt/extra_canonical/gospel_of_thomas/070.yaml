revisions:
- from: 'Jesus disse: “Quando vocês fizerem surgir o que está dentro de vocês,[a] isso — o que vocês têm — os salvará.[b] Caso contrário,[c] há pobreza[d] dentro de vocês. Isso — o que vocês não têm dentro de vocês, em seu íntimo[f] — os matará.”[e]'
  to: 'Jesus disse: “Quando vocês fizerem surgir algo dentro de vocês,[a] isso — o que vocês têm — os salvará.[b] Caso contrário,[c] há pobreza[d] dentro de vocês. Isso — o que vocês não têm dentro de vocês, no íntimo de vocês[f] — os matará.”[e]'
  rationale: Substituí “o que está dentro de vocês” por “algo dentro de vocês” para não converter a locução locativa do original numa caracterização explícita do referente. A alteração conserva o demonstrativo indefinido, a interioridade e a ambiguidade interpretativa do dito. Ajustei “em seu íntimo” para “no íntimo de vocês”, em concordância clara com o plural e com a repetição enfática do copta.
