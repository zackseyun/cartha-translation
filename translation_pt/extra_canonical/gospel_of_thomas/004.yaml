base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: pt
  text: 'Jesus disse: “Um homem de idade avançada não hesitará em perguntar[a] a uma criancinha de sete dias sobre o lugar da vida, e viverá. Pois muitos dos primeiros se tornarão últimos[b], e eles se tornarão um só[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No copta, as palavras traduzidas por “hesitará” (ϫⲛⲁⲩ) e “perguntar” (ϫⲛⲉ) têm sons semelhantes, formando um jogo verbal difícil de reproduzir em português.
    reason: register_note
  - marker: b
    text: O fragmento grego P.Oxy. 654 acrescenta aqui “e os últimos, primeiros”. O texto copta não traz essa frase. Compare Mateus 19:30; Marcos 10:31; Lucas 13:30.
    reason: textual_variant_and_cross_reference
  - marker: c
    text: Literalmente, “um, único” ou “um só”. A expressão indica unidade ou singeleza, mas o texto não especifica sua natureza.
    reason: translation_note
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: não hesitará
  rationale: O verbo significa “hesitar” ou “demorar-se”; o fragmento grego P.Oxy. 654 o confirma com ἀποκνήσει. A tradução “não terá vergonha” confundiria este verbo com outro vocábulo copta.
- source_word: ϫⲛⲉ
  choice: em perguntar
  rationale: O infinitivo deriva de ϫⲛⲟⲩ, “perguntar”. “Perguntar a uma criancinha [...] sobre” reproduz com naturalidade a relação entre o interlocutor e o assunto.
- source_word: ⲡⲣⲱⲙⲉ ⲛϩⲗⲗⲟ ϩⲛⲛⲉϥϩⲟⲟⲩ
  choice: um homem de idade avançada
  rationale: Exprime de modo natural a ideia literal de um homem “velho em seus dias”, sem a redundância pouco idiomática de “um homem idoso em seus dias”.
- source_word: ⲡⲧⲟⲡⲟⲥ ⲙⲡⲱⲛϩ
  choice: o lugar da vida
  rationale: Mantém a formulação concreta e aberta do copta, sem explicar “lugar” como estado, origem ou destino.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: um só
  rationale: Preserva a singeleza numérica e a noção de unidade da expressão copta. Em português, “um só” é mais natural do que “um único” como predicativo neste contexto.
theological_decisions:
- issue: Sentido da unidade no encerramento
  choice: eles se tornarão um só
  alternative: eles ficarão unidos
  rationale: A tradução conserva a linguagem de transformação e unidade sem definir se ela é ontológica, espiritual, comunitária ou simbólica.
- issue: Identidade daquele que viverá
  choice: e viverá
  alternative: e a criança viverá
  rationale: O sujeito implícito retoma naturalmente o homem idoso, mas o português evita inserir um pronome enfático desnecessário e não acrescenta uma identificação que o copta não explicita lexicalmente.
- issue: Forma do dito sobre primeiros e últimos
  choice: muitos dos primeiros se tornarão últimos
  alternative: muitos primeiros serão últimos, e os últimos serão primeiros
  rationale: Segue o texto copta preservado e não incorpora ao corpo da tradução a segunda metade presente no testemunho grego e em paralelos canônicos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção foi tornada natural sem eliminar as imagens incomuns “criancinha de sete dias”, “lugar da vida” e “um só”. Os marcadores [a], [b] e [c] aparecem no texto principal.
