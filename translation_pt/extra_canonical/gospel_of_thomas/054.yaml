base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: pt
  text: 'Jesus disse: “Bem-aventurados os pobres[a], pois de vocês é o Reino dos céus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta traz literalmente “o pobre” no singular genérico, com sentido coletivo. Não aparece aqui a expressão “em espírito”; compare Lucas 6:20 e Mateus 5:3.
    reason: source_form_and_cross_reference
  - marker: b
    text: “Reino” também pode ser entendido como “reinado” ou “governo real”. O copta diz literalmente “dos céus”, no plural, e não “de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Forma natural e direta de verter o introdutor de fala copta; a conjunção seguinte é representada pelos dois-pontos e pelas aspas.
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Bem-aventurados
  rationale: Preserva a fórmula de beatitude e seu caráter avaliativo; “felizes” seria possível, mas menos distintivo neste contexto.
- source_word: ⲡϩⲏⲕⲉ
  choice: os pobres
  rationale: Embora o copta empregue o singular genérico, o plural coletivo é a forma mais natural em português e concorda com a predicação plural.
- source_word: ϫⲉ
  choice: pois
  rationale: Expressa de modo conciso o valor causal da segunda oração.
- source_word: ⲧⲱⲧⲛ
  choice: de vocês
  rationale: Mantém inequivocamente a segunda pessoa do plural e é amplamente compreensível no português moderno.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: o Reino
  rationale: “Reino” abrange tanto o domínio quanto o governo real e corresponde bem ao uso do termo em Tomé; “reinado” permanece alternativa possível.
- source_word: ⲛⲡⲡⲉ
  choice: dos céus
  rationale: Conserva o plural explícito do copta em português idiomático.
theological_decisions:
- issue: A identidade dos pobres
  choice: os pobres
  alternative: os pobres em espírito
  rationale: O texto copta não contém qualificação equivalente a “em espírito”; acrescentá-la harmonizaria indevidamente o dito com Mateus 5:3.
- issue: Referente do Reino
  choice: Reino dos céus
  alternative: Reino de Deus
  rationale: O manuscrito diz explicitamente “dos céus”; a tradução não o substitui pela formulação de Lucas 6:20.
- issue: Valor de ⲙⲛⲧⲣⲣⲟ
  choice: Reino
  alternative: reinado
  rationale: “Reino” preserva a amplitude entre governo soberano e realidade/domínio, sem decidir de forma excessiva entre sentidos possíveis.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “bem-aventurados” para preservar a forma tradicional da beatitude. “De vocês” comunica claramente o plural; a capitalização de “Reino” sinaliza o referente teológico sem alterar o sentido lexical.
