  source_fidelity: 'A tradução reproduz adequadamente a estrutura do dito: a bem-aventurança dirigida aos pobres, a relação causal introduzida por «pois», o possessivo de segunda pessoa plural («de vocês») e «Reino dos céus». Não acrescenta «em espírito» nem substitui «dos céus» por «de Deus».'
  naturalness: O português é claro, conciso e de registro digno. «Bem-aventurados os pobres» é uma elipse plenamente corrente no registro bíblico e preserva bem a cadência da bem-aventurança; «de vocês» é natural e deixa explícito o plural.
  terminology: «Bem-aventurados», «pobres» e «Reino dos céus» são escolhas estabelecidas e adequadas. «Reino» traduz ⲡⲙⲛⲧⲣⲣⲟ sem reduzir indevidamente o termo apenas a território ou apenas a exercício de governo. A nota registra de modo útil «reinado» e «governo real» como possibilidades.
