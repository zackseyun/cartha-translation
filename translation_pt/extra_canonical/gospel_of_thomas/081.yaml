base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: pt
  text: 'Jesus disse: “Quem se tornou rico, seja rei[a]; e quem tem poder[b], renuncie a ele[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo copta também pode ser traduzido por “reine” ou “governe”. “Seja rei” preserva sua ligação verbal direta com a palavra “rei” e a formulação incisiva do dito.
    reason: lexical_alternative
  - marker: b
    text: ⲇⲩⲛⲁⲙⲓⲥ, empréstimo do grego, também pode significar “força”, “capacidade” ou, em certos contextos, “poder milagroso”. Aqui se mantém “poder” por sua abrangência.
    reason: lexical_alternative
  - marker: c
    text: No copta, o objeto de “renuncie” fica implícito. “A ele” o identifica com o poder mencionado imediatamente antes.
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Forma portuguesa corrente para o verbo narrativo de citação, preservando a introdução direta e concisa do dito.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: Quem se tornou rico
  rationale: A construção relativa com perfeito indica alguém que passou a ser rico; a formulação mantém esse aspecto resultativo.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: seja rei
  rationale: O prefixo marca exortação ou ordem na terceira pessoa, e o verbo derivado de “rei” pode significar “ser rei” ou “reinar”. “Seja rei” conserva a expressão incisiva do copta.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa simples, adequada ao paralelismo conciso do dito.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: quem tem poder
  rationale: A construção copta expressa posse. O empréstimo grego ⲇⲩⲛⲁⲙⲓⲥ tem amplo campo semântico, e “poder” preserva essa amplitude.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: renuncie a ele
  rationale: O verbo pode significar negar ou renunciar. “Renuncie” se ajusta ao poder possuído, enquanto “a ele” explicita em português o objeto deixado implícito no copta.
theological_decisions:
- issue: Referente do objeto implícito de ⲁⲣⲛⲁ
  choice: Entendido como o poder mencionado imediatamente antes, sem ampliar sua interpretação teológica.
  alternative: 'Deixar o verbo sem objeto: “renuncie”.'
  rationale: O antecedente sintático mais próximo é ⲇⲩⲛⲁⲙⲓⲥ, mas a nota registra que o objeto não está expresso no copta.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. O subjuntivo de valor exortativo (“seja”, “renuncie”) reproduz o paralelismo dos dois imperativos na terceira pessoa sem suavizar a tensão entre riqueza, realeza e renúncia ao poder.
