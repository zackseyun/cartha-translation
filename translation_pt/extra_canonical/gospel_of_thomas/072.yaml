base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: pt
  text: 'Um homem lhe disse[a]: “Diga aos meus irmãos[b] que repartam comigo os bens[c] de meu pai.” Ele lhe disse: “Homem, quem me constituiu repartidor?” Ele se voltou para seus discípulos[d] e lhes disse: “Eu não sou repartidor, sou?”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início da frase, “Um homem lhe disse”, está parcialmente restaurado no manuscrito por causa de pequenas perdas materiais.
    reason: lacuna_or_restoration
  - marker: b
    text: O texto visível do manuscrito traz “meus irmãos”, no plural; a linha normalizada fornecida traz “meu irmão”, no singular.
    reason: textual_variant
  - marker: c
    text: 'Ou: “as posses” ou “a herança”. O termo copta designa bens ou patrimônio.'
    reason: lexical_alternative
  - marker: d
    text: A diferença entre as formas coptas impressa e normalizada do verbo “voltar-se” é uma variação ortográfica dialetal.
    reason: dialect_note
  - marker: e
    text: 'A partícula ⲙⲏ introduz aqui uma pergunta retórica que espera resposta negativa. Outra tradução possível é: “Por acaso sou repartidor?” Compare Lucas 12:13–14, que também menciona um “juiz”; Tomé conserva apenas “repartidor”.'
    reason: grammar_and_cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁⲛⲧⲟϥ
  choice: Um homem lhe disse
  rationale: Reproduz diretamente a fórmula copta de fala e mantém a dicção simples.
- source_word: ϫⲱⲛⲧⲟⲥ
  choice: Diga
  rationale: O imperativo introduz o pedido para que o interlocutor transmita uma ordem aos irmãos.
- source_word: ⲛⲛⲁⲥⲛⲏⲩ / ⲛⲡⲁⲥⲟⲛ
  choice: aos meus irmãos
  rationale: Segue o plural visível no texto do manuscrito; a normalização fornecida traz o singular, registrado em nota.
- source_word: ϩⲓⲛⲁ ⲉⲣⲉⲛⲧⲟⲟⲩ ⲛⲁⲡⲱϣⲉ
  choice: que repartam
  rationale: Expressa naturalmente a construção de finalidade e o sentido de dividir ou repartir.
- source_word: ⲛⲡϩⲛⲁⲁⲩ
  choice: os bens
  rationale: Abrange bens, posses ou patrimônio sem impor a formulação jurídica específica de herança.
- source_word: ⲉⲓⲣⲉ ... ⲛⲣⲉϥⲡⲱϣⲉ
  choice: constituiu repartidor
  rationale: Preserva o sentido de fazer ou designar alguém para a função, bem como o substantivo agentivo repetido na passagem.
- source_word: ⲁϥⲕⲟⲧϥ / ⲕⲱⲧⲛⲧⲟϥ
  choice: se voltou para
  rationale: É a expressão idiomática portuguesa correspondente ao verbo reflexivo de voltar-se.
- source_word: ⲙⲏ ⲉⲉⲓϣⲟⲟⲡ ⲛⲣⲉϥⲡⲱϣⲉ
  choice: Eu não sou repartidor, sou?
  rationale: Entende ⲙⲏ como partícula que introduz uma pergunta retórica à espera de resposta negativa; a formulação portuguesa conserva esse valor.
theological_decisions:
- issue: Relação com Lucas 12:13–14
  choice: Manter somente “repartidor”
  alternative: Acrescentar “juiz” ou traduzir por “árbitro”
  rationale: O texto de Tomé não contém o equivalente de “juiz”; harmonizá-lo com Lucas apagaria uma diferença real entre as testemunhas.
- issue: Força da pergunta final
  choice: Traduzir como pergunta retórica negativa
  alternative: 'Traduzir como declaração: “Vejam, eu não sou repartidor”'
  rationale: O uso interrogativo de ⲙⲏ neste contexto sustenta uma pergunta que espera resposta negativa, sem transformar a frase em proclamação deítica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Repartidor” é menos comum na fala corrente, mas preserva a repetição e a imagem central do copta; o contexto esclarece a função. A colocação pronominal e os diálogos seguem uso brasileiro natural sem regionalismos marcados.
