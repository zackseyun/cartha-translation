revisions:
- from: 'Um homem lhe disse[a]: “Diga aos meus irmãos[b] que repartam comigo os bens[c] de meu pai.” Ele lhe respondeu: “Homem, quem me constituiu repartidor?” Então se voltou para seus discípulos[d] e lhes disse: “Eu não sou repartidor, sou?”[e]'
  to: 'Um homem lhe disse[a]: “Diga aos meus irmãos[b] que repartam comigo os bens[c] de meu pai.” Ele lhe disse: “Homem, quem me constituiu repartidor?” Ele se voltou para seus discípulos[d] e lhes disse: “Eu não sou repartidor, sou?”[e]'
  rationale: 'As únicas alterações são de aderência formal ao copta: «lhe disse» traduz a fórmula ⲡⲉϫⲉ ... ⲛⲁⲛⲧⲟϥ sem a nuance adicional de «respondeu», e a retirada de «Então» evita explicitar uma progressão temporal ausente. O restante do texto e todas as notas são sólidos, inclusive a preservação da variante irmãos/irmão e do valor interrogativo retórico de ⲙⲏ.'
  reviewer_model: gpt-5.6-terra
