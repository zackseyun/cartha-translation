  terminology: “Ditos” é adequado ao gênero de enunciados breves; “ocultos” reproduz legitimamente a amplitude de “hidden/secret”; e as formas Dídimo, Judas e Tomé são convencionais em português. As notas explicam as alternativas lexicais, a particularidade manuscrita de “vivente” e o duplo sentido de Dídimo/Tomé sem impor leitura doutrinária.
