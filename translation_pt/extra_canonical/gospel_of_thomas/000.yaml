base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
translation:
  language: pt
  text: Estes são os ditos ocultos[a] que Jesus, o Vivente,[b] proferiu e que Dídimo Judas Tomé[c] escreveu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra copta também pode ser traduzida como “secretos” ou “escondidos”. “Ocultos” preserva a ideia de não estarem manifestos sem pressupor uma iniciação esotérica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Jesus que vive” ou “Jesus vivo”. A grafia do manuscrito apresenta uma variação ortográfica ou dialetal, mas o sentido é “vivente”.
    reason: textual_variant
  - marker: c
    text: “Dídimo” é uma palavra grega que significa “gêmeo”; “Tomé” também deriva de uma forma semítica com esse sentido. O texto conserva a designação completa “Dídimo Judas Tomé”.
    reason: cultural_note
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  choice: ditos
  rationale: O plural designa as unidades breves da coleção. “Ditos” preserva esse caráter de gênero sem ampliar o sentido para “ensinamentos” ou “discursos”.
- source_word: ϩⲏⲡ
  choice: ocultos
  rationale: Conserva o sentido de algo escondido ou não manifesto, sem impor por si só a ideia de iniciação esotérica que “secretos” poderia sugerir.
- source_word: ⲱⲛϩ (no manuscrito, ⲧⲟⲛϩ)
  choice: o Vivente
  rationale: Reproduz de modo conciso a caracterização de Jesus como aquele que vive e preserva sua possível força titular, sem harmonização automática com fórmulas canônicas.
- source_word: ϫⲟⲟⲩ
  choice: proferiu
  rationale: Expressa o ato de dizer os ditos e evita em português a repetição pouco elegante de “ditos que disse”, sem acrescentar a noção mais formal de discurso.
- source_word: ⲥϩⲁⲓ
  choice: escreveu
  rationale: Tradução direta e sóbria do verbo de escrever; não acrescenta a ideia interpretativa de editar ou compilar.
- source_word: ⲛϭⲓ
  choice: agente expresso pela ordem da oração portuguesa
  rationale: A partícula identifica Dídimo Judas Tomé como agente de “escreveu”. A construção ativa portuguesa comunica naturalmente essa função sem exigir uma palavra separada.
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  choice: Dídimo Judas Tomé
  rationale: Mantém os três elementos nominais presentes no manuscrito, usando as formas portuguesas convencionais sem substituir Dídimo por sua tradução.
theological_decisions:
- issue: Força da expressão aplicada a Jesus como vivente
  choice: Jesus, o Vivente
  alternative: Jesus vivo / Jesus, que vive
  rationale: A formulação escolhida mantém a possível qualidade titular da expressão copta, mas a nota esclarece que a construção também pode ser entendida simplesmente como “Jesus vivo” ou “Jesus, que vive”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “Ditos” marca o gênero da coleção; “o Vivente” conserva a estranheza e a possível força titular do copta, com esclarecimento em nota.
