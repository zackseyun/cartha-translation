  source_fidelity: 'O texto português preserva os elementos do copta: o demonstrativo plural, os “ditos”, sua qualificação como ocultos, Jesus como vivente, os dois verbos com os ditos como objeto e a atribuição da escrita a Dídimo Judas Tomé. A segunda oração relativa em português expressa adequadamente a retomada do objeto de “proferiu”.'
