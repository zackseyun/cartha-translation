base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: pt
  text: 'Jesus disse: “Talvez as pessoas pensem que eu vim lançar paz sobre o mundo, e não sabem que vim lançar[a] divisões sobre a terra: fogo, espada, guerra. Pois haverá cinco numa casa: três estarão contra dois, e dois contra três; o pai contra o filho, e o filho contra o pai.[b] E eles ficarão de pé como solitários.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nesta segunda ocorrência, o manuscrito apresenta uma variação vocálica na forma copta de “lançar”, comum neste texto; o sentido não muda.
    reason: Nota textual e dialetal.
  - marker: b
    text: Compare Lucas 12:51–53 e Mateus 10:34–35. Esses textos compartilham os temas da divisão familiar e, em Mateus, da espada; a conclusão sobre os “solitários” é própria desta forma do dito.
    reason: Referência comparativa.
  - marker: c
    text: “Solitários” traduz o empréstimo grego monachós, que pode indicar alguém só, singular ou separado. O termo mais tarde passou a designar um monge, mas esse sentido institucional não deve ser pressuposto aqui.
    reason: Esclarecimento lexical e histórico.
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: talvez
  rationale: O empréstimo grego τάχα introduz aqui uma suposição acerca do que as pessoas pensam; “talvez” conserva essa modalidade sem torná-la certeza.
- source_word: ⲛⲟⲩϫⲉ
  choice: lançar
  rationale: Mantém o sentido concreto e vigoroso de “atirar/lançar”, bem como o paralelismo paradoxal entre lançar paz e lançar divisões.
- source_word: ⲡⲱⲣϫ
  choice: divisões
  rationale: O termo designa separações ou divisões; o plural português corresponde ao valor plural do texto e prepara a enumeração seguinte.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ / ⲡⲕⲁϩ
  choice: o mundo / a terra
  rationale: Conserva a distinção lexical do copta entre kosmos e terra, em vez de uniformizar os dois termos.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: ficarão de pé
  rationale: Reproduz de modo natural a expressão copta de estar ou permanecer em pé.
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitários
  rationale: Preserva o sentido antigo de alguém só, singular ou separado, sem introduzir de modo anacrônico a instituição monástica posterior.
theological_decisions:
- issue: Sentido de ⲙⲟⲛⲁⲭⲟⲥ no encerramento
  choice: solitários
  alternative: monges; pessoas sós; unos
  rationale: “Solitários” mantém aberta a possível dimensão social ou espiritual do termo. Traduzir por “monges” fixaria uma leitura institucional posterior; “unos” resolveria a ambiguidade em favor de uma interpretação de unidade interior que o vocábulo, isoladamente, não exige.
- issue: Relação entre paz e divisão
  choice: preservar literalmente o contraste entre “lançar paz” e “lançar divisões”
  alternative: explicar a divisão como mero efeito indireto da missão
  rationale: O texto formula deliberadamente uma tensão e não especifica aqui causalidade, intenção secundária ou sentido metafórico; a tradução não a resolve.
- issue: Identidade dos que ficam como solitários
  choice: manter o pronome “eles” sem explicitar seu referente
  alternative: identificá-los como discípulos ou como membros da família dividida
  rationale: O antecedente permanece aberto no texto copta, e uma identificação explícita importaria uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural para leitores brasileiros. Conservam-se a repetição de “lançar”, a enumeração abrupta “fogo, espada, guerra”, a distinção entre “mundo” e “terra” e a ambiguidade final de “solitários”.
