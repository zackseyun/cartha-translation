base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: pt
  text: 'Jesus disse: “Quem chegou a conhecer o mundo encontrou o corpo; e quem encontrou o corpo, o mundo não é digno dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Fórmula narrativa que introduz uma fala; o pretérito é natural em português e corresponde à forma copta.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲥⲟⲟⲩⲛ
  choice: quem chegou a conhecer
  rationale: Expressa a ação completada da construção relativa perfeita sem reduzir o verbo a mero reconhecimento.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: o mundo
  rationale: Mantém a amplitude do empréstimo grego, que pode abranger tanto o cosmos como o mundo humano.
- source_word: ϩⲉ ⲉ
  choice: encontrou
  rationale: O sentido básico é encontrar; a preposição que acompanha o verbo é um traço dialetal/ortográfico e não exige expansão na tradução.
- source_word: ⲡⲥⲱⲙⲁ
  choice: o corpo
  rationale: Traduz diretamente o empréstimo de σῶμα e preserva a distinção lexical em relação a ⲡⲧⲱⲙⲁ, ‘cadáver’, empregado no dito 56. O artigo definido aparece nas duas ocorrências.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: não é digno dele
  rationale: Equivalente idiomático próximo da construção copta de dignidade ou merecimento, conservando o pronome masculino singular.
- source_word: ⲇⲉ
  choice: e
  rationale: Conectivo discreto que mantém o paralelismo sem impor contraste mais forte do que o texto exige.
theological_decisions:
- issue: Relação simbólica entre ‘mundo’ e ‘corpo’
  choice: Preservar a formulação paradoxal sem explicá-la no texto
  alternative: Interpretar ‘corpo’ como cadáver ou como matéria inerentemente má
  rationale: O dito não explicita a relação teológica entre os termos. Traduzir literalmente sua tensão evita importar uma antropologia ou cosmologia denominacional.
translation_notes:
  register: Português atual, sóbrio e inteligível, com estrutura proverbial concisa. ‘Chegou a conhecer’ conserva a nuance de ação consumada; ‘o corpo’ segue o vocábulo e os artigos do copta, sem harmonizar este dito com o dito 56.
