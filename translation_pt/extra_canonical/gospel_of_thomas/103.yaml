base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: pt
  text: 'Jesus disse: “Feliz é o homem que sabe em que parte os ladrões vão entrar, para que se levante, reúna seu reino e cinja os seus lombos com antecedência, antes que eles entrem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Feliz
  rationale: Reproduz de modo natural em português a fórmula de bem-aventurança expressa pelo empréstimo grego μακάριος, sem reduzir seu sentido a uma emoção passageira.
- source_word: ⲙⲉⲣⲟⲥ
  choice: lado
  rationale: O empréstimo grego μέρος significa parte ou porção; neste contexto espacial, “por qual lado” é português natural e conserva a indeterminação do ponto de entrada, sem impor a interpretação de uma vigília noturna.
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: ladrões
  rationale: O artigo e a retomada pronominal no manuscrito indicam plural. “Ladrões” mantém o sentido básico do empréstimo grego λῃστής, que também pode designar assaltantes.
- source_word: ⲧⲱⲟⲩⲛ
  choice: se levante
  rationale: Traduz diretamente o verbo “levantar-se”, evitando harmonizá-lo com os paralelos sinóticos por meio de “ficar acordado” ou “vigiar”.
- source_word: ⲥⲱⲟⲩϩ
  choice: reúna
  rationale: Conserva a ação incomum de reunir ou ajuntar presente no texto copta, sem substituí-la por uma ação esperada nos paralelos sinóticos.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: reino
  rationale: Mantém o termo teologicamente carregado “reino”, em vez de normalizar a imagem como propriedade, domínio ou bens.
- source_word: ⲙⲟⲩⲣ ... ⲉϫⲛ̄ ⲡⲉϥϯⲡⲉ
  choice: cinja os lombos
  rationale: Preserva o idioma antigo de prender a roupa ao redor dos lombos como preparação para agir; a formulação é digna e reconhecível em registro bíblico português.
- source_word: ϩⲁⲡⲉϩⲏ
  choice: com antecedência
  rationale: Expressa claramente a preparação prévia indicada pelo advérbio, sem confundi-la com a oração final “antes que eles entrem”.
theological_decisions:
- issue: Sentido de ⲙⲛⲧⲣⲣⲟ dentro da imagem dos ladrões
  choice: reino
  alternative: domínio, propriedade ou bens
  rationale: Embora as alternativas tornassem a cena doméstica mais convencional, o copta emprega o termo normal para “reino”. A tradução preserva a tensão deliberada entre a narrativa e o motivo teológico, sem explicar ou corrigir a imagem.
- issue: Relação com os paralelos de Mateus 24:43 e Lucas 12:39
  choice: 'Traduzir as ações próprias de Tomé: levantar-se, reunir e cingir-se'
  alternative: Harmonizar como vigiar para impedir que a casa seja arrombada
  rationale: O testemunho copta contém verbos e objeto distintos dos paralelos sinóticos. A redação portuguesa mantém essas diferenças textuais.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Feliz” torna a bem-aventurança acessível; “cinja os lombos” conserva deliberadamente uma expressão bíblica antiga porque uma paráfrase como “prepare-se” apagaria a imagem concreta. Não foram incluídas notas, pois “por qual lado” comunica no próprio texto a ambiguidade de ⲙⲉⲣⲟⲥ, e a hipótese de uma vigília da noite não é certa o bastante para ser incorporada.
