revisions:
- from: 'Jesus disse: “Feliz o homem que sabe por qual lado os ladrões estão chegando, para que se levante, reúna seu reino e cinja os lombos com antecedência, antes que eles entrem.”'
  to: 'Jesus disse: “Feliz é o homem que sabe em que parte os ladrões vão entrar, para que se levante, reúna seu reino e cinja os seus lombos com antecedência, antes que eles entrem.”'
  rationale: A revisão restaura explicitamente o sentido de entrada em ⲉⲓ ⲉϩⲟⲩⲛ, traduz ⲙⲉⲣⲟⲥ de modo menos interpretativo e completa a fórmula de bem-aventurança. Mantém-se a imagem incomum de reunir o reino e cingir os lombos, sem harmonização com os paralelos sinóticos e sem nota especulativa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:51:50Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente o plural “ladrões”, a sequência distinta de ações (levantar-se, reunir o reino e cingir os lombos) e “reino” para ⲙⲛⲧⲣⲣⲟ. Contudo, “estão chegando” enfraquece o movimento expresso por ⲉⲓ ⲉϩⲟⲩⲛ, ‘vir/entrar para dentro’; e “por qual lado” torna ⲙⲉⲣⲟⲥ exclusivamente direcional, ao passo que “parte” conserva melhor o termo e sua ambiguidade contextual.
  naturalness: “Feliz o homem” é possível em estilo telegráfico ou poético, mas “Feliz é o homem” reproduz mais naturalmente a fórmula copta de bem-aventurança em português atual. “Em que parte os ladrões vão entrar” é claro e evita a repetição pouco idiomática de “entrando ... entrem”, sem perder a distinção entre o conhecimento prévio e a entrada posterior.
  terminology: “Feliz”, “reino”, “reúna” e “cingir os lombos” são escolhas defensáveis. A expressão tradicional “cingir os lombos” preserva apropriadamente a imagem concreta do copta; “os seus lombos” explicita o possessivo sem alterar o registro.
  issues:
  - severity: medium
    issue: “estão chegando” para ⲉⲓ ⲉϩⲟⲩⲛ
    rationale: O composto inclui o direcionamento ‘para dentro’, confirmado pela cláusula final ‘antes que eles entrem’. “Chegando” não exprime necessariamente invasão/entrada.
  - severity: low
    issue: “por qual lado” para ⲙⲉⲣⲟⲥ
    rationale: A formulação é fluente, mas especifica ‘lado’ onde o copta diz literalmente ‘em que parte’; “parte” preserva melhor a abertura sem impor uma leitura espacial particular.
  - severity: low
    issue: Fórmula “Feliz o homem”
    rationale: A cópula explícita em “Feliz é o homem” corresponde à estrutura de ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ ⲡⲉ ⲡⲣⲱⲙⲉ e soa mais completa em português moderno.
  revised_text: 'Jesus disse: “Feliz é o homem que sabe em que parte os ladrões vão entrar, para que se levante, reúna seu reino e cinja os seus lombos com antecedência, antes que eles entrem.”'
