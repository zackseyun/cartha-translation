base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: pt
  text: '**Evangelho de Tomé — Dito 23**


    Jesus disse: “Eu escolherei vocês[a]: um entre mil e dois entre dez mil; e eles permanecerão de pé[b] como um só[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome copta traduzido por “vocês” aparece no manuscrito numa forma regional, ⲧⲏⲛⲉ, correspondente ao plural da segunda pessoa.
    reason: dialect_note
  - marker: b
    text: O texto passa abruptamente de “vocês” para “eles”. Essa mudança gramatical está no copta e foi preservada.
    reason: textual_note
  - marker: c
    text: Literalmente, “um único” ou “um só”. A expressão afirma unidade, mas não especifica de que natureza é essa unidade.
    reason: translation_note
lexical_decisions:
- source_word: ⲥⲱⲧⲡ / ⲥⲉⲧⲡ-
  choice: escolherei
  rationale: O verbo significa “escolher, selecionar”. “Escolherei” conserva o futuro e evita a carga confessional mais específica que “elegerei” pode adquirir em português.
- source_word: ϣⲟ
  choice: mil
  rationale: É o numeral copta comum para 1.000.
- source_word: ⲧⲃⲁ
  choice: dez mil
  rationale: Designa 10.000; “dez mil” é mais claro no português corrente do que “uma miríade”.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: permanecerão de pé
  rationale: A expressão idiomática significa estar ou manter-se de pé. Esta formulação conserva a imagem corporal sem interpretar o verbo como “comparecer diante de” alguém.
- source_word: ⲉⲩⲟ
  choice: como
  rationale: O circunstancial estativo, literalmente “sendo”, indica o estado em que eles estarão. “Como” produz uma frase natural sem introduzir a ideia ativa de que eles farão ou produzirão algo.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: um só
  rationale: Reproduz de modo conciso a expressão enfática “um único/um só”, preservando sua linguagem de unidade sem explicá-la teologicamente no corpo do texto.
theological_decisions:
- issue: Sentido de ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: como um só
  alternative: unidos; uma única pessoa; sendo um único
  rationale: “Um só” mantém a formulação concreta e a tensão teológica do texto. “Unidos” explicaria a expressão como coesão coletiva, enquanto “uma única pessoa” imporia uma leitura ontológica que o copta não exige.
- issue: Mudança da segunda para a terceira pessoa
  choice: “escolherei vocês” seguido de “eles permanecerão”
  alternative: “vocês permanecerão”
  rationale: O manuscrito muda abruptamente da segunda pessoa plural para a terceira pessoa plural. A tradução conserva essa mudança em vez de harmonizá-la.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês” para o plural da segunda pessoa. A tradução segue prioritariamente o texto do manuscrito copta: evita a repetição de “permanecerão” presente na camada inglesa de consulta, pois o original manuscrito traz uma única forma verbal nessa cláusula. A pontuação explicita a relação distributiva de “um entre mil e dois entre dez mil” sem acrescentar conteúdo.'
