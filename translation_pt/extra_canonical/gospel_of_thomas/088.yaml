base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: pt
  text: 'Jesus disse: “Os anjos e os profetas virão até vocês e lhes darão aquilo que pertence a vocês.[a] E vocês, por sua vez, deem a eles o que está em suas mãos[b] e digam a si mesmos: ‘Em que dia eles virão e tomarão o que lhes pertence?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as coisas que vocês têm”.
    reason: Registra a forma mais literal da expressão copta de posse.
  - marker: b
    text: O copta emprega aqui uma forma regional do sufixo da segunda pessoa do plural; o sentido permanece “em suas mãos”.
    reason: Assinala a característica dialetal do manuscrito sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: aquilo que pertence a vocês
  rationale: A construção copta com ⲟⲩⲛⲧⲁ= expressa posse. Esta formulação é natural em português e mantém o contraste recíproco com “o que lhes pertence” no fim do dito.
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: o que está em suas mãos
  rationale: Preserva a imagem concreta da expressão copta “na mão de”, em vez de reduzi-la simplesmente a “o que vocês têm”.
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: por sua vez
  rationale: O pronome enfático assinala a participação correspondente dos destinatários e a reciprocidade da ação.
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: o que lhes pertence
  rationale: Traduz o possessivo independente “deles” de modo idiomático e mantém o paralelo com aquilo que pertence aos destinatários.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ϫⲟⲟⲥ ⲛⲏⲧⲛ̄
  choice: e digam a si mesmos
  rationale: Representa a construção copta “dizer a vocês mesmos”, sem alterar o destinatário reflexivo da fala.
theological_decisions:
- issue: Natureza da troca entre os destinatários, os anjos e os profetas
  choice: “aquilo que pertence a vocês” e “o que lhes pertence”
  alternative: “o que vocês têm” e “o que é deles”
  rationale: A tradução conserva a correspondência possessiva e a tensão enigmática do dito, sem definir o que é entregue nem impor uma interpretação doutrinária sobre a troca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A imagem das mãos, a reciprocidade e a pergunta final foram preservadas. O plural manuscrito “os anjos e os profetas” foi seguido, apesar da normalização fornecida apresentar formas inconsistentes.
