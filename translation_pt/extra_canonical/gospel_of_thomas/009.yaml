  source_fidelity: 'A tradução preserva com cuidado as particularidades da versão copta: a mão cheia do semeador, o recolher/agarrar em vez de devorar, as raízes para baixo e as espigas para o céu, o verme e os rendimentos de sessenta e cento e vinte medidas. Contudo, «o verme a comeu» reduz ao singular o pronome final, onde o copta retoma pluralmente as sementes; convém manter o plural em português.'
  naturalness: O texto é claro e de registro adequado. «No caminho» é mais próximo e menos harmonizante que «à beira do caminho», e «até o céu» expressa naturalmente o movimento vertical explícito no copta.
  terminology: «Semeador», «semente», «espigas», «espinhos», «verme», «terra boa» e «medidas» são escolhas adequadas. «Agarraram» para a ação dos espinhos conserva a distinção textual sem importar o «devoraram» dos paralelos sinóticos.
  issues:
  - severity: medium
    issue: Pronome singular no desfecho dos espinhos
    rationale: Em «o verme a comeu», «a» retoma a «semente» no singular, mas o texto copta termina com objeto plural («comeu-as»), em continuidade com as sementes referidas anteriormente. «O verme as comeu» preserva melhor a forma do enunciado.
  - severity: low
    issue: «À beira do caminho» e «para o céu»
    rationale: O copta diz que as sementes caíram sobre/no caminho e descreve movimento para cima até o céu. «No caminho» e «até o céu» são mais diretos, naturais e próximos da imagem-fonte.
  revised_text: 'Jesus disse: “Eis que o semeador saiu, encheu a mão[a] e lançou a semente. Algumas sementes caíram no caminho; as aves vieram e as recolheram.[b] Outras caíram sobre a rocha; não lançaram raízes para baixo, até a terra, nem fizeram subir espigas até o céu.[c] Outras caíram entre os espinhos; estes as agarraram, sufocaram a semente, e o verme as comeu.[d] Outras caíram em terra boa, e ela produziu bom fruto até o céu: rendeu sessenta medidas e cento e vinte medidas.”[e]'
  revised_footnotes:
  - marker: a
    text: Tomé inclui o detalhe físico de o semeador encher a mão, ausente dos paralelos sinóticos.
    reason: textual_variant
  - marker: b
    text: O verbo copta significa ‘recolher’, ‘juntar’ ou ‘agarrar’, não ‘devorar’, como nos evangelhos canônicos.
    reason: textual_variant
  - marker: c
    text: A imagem vertical — raízes para baixo, na terra, e espigas para cima, rumo ao céu — é característica desta versão da parábola.
    reason: textual_variant
  - marker: d
    text: O verme acrescenta uma etapa de destruição da semente que não aparece nos paralelos sinóticos.
    reason: textual_variant
  - marker: e
    text: O copta traz literalmente ‘sessenta medidas e cento e vinte medidas’. A formulação e os números diferem dos rendimentos apresentados nos evangelhos sinóticos.
    reason: textual_variant
  revision_rationale: A revisão conserva todas as escolhas textualmente distintivas do rascunho e corrige apenas a retomada pronominal final para o plural do copta, além de ajustar duas expressões para maior proximidade com a imagem espacial do original e fluência em português.
