base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: pt
  text: 'Jesus disse: “Eis que o semeador saiu, encheu a mão[a] e lançou a semente. Algumas sementes caíram no caminho; as aves vieram e as recolheram.[b] Outras caíram sobre a rocha; não lançaram raízes para baixo, até a terra, nem fizeram subir espigas até o céu.[c] Outras caíram entre os espinhos; estes as agarraram, sufocaram a semente, e o verme as comeu.[d] Outras caíram em terra boa, e ela produziu bom fruto até o céu: rendeu sessenta medidas e cento e vinte medidas.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tomé inclui o detalhe físico de o semeador encher a mão, ausente dos paralelos sinóticos.
    reason: textual_variant
  - marker: b
    text: O verbo copta significa ‘recolher’, ‘juntar’ ou ‘agarrar’, não ‘devorar’, como nos evangelhos canônicos.
    reason: textual_variant
  - marker: c
    text: A imagem vertical — raízes para baixo, na terra, e espigas para cima, rumo ao céu — é característica desta versão da parábola.
    reason: textual_variant
  - marker: d
    text: O verme acrescenta uma etapa de destruição da semente que não aparece nos paralelos sinóticos.
    reason: textual_variant
  - marker: e
    text: O copta traz literalmente ‘sessenta medidas e cento e vinte medidas’. A formulação e os números diferem dos rendimentos apresentados nos evangelhos sinóticos.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲥⲓⲧⲉ
  choice: o semeador
  rationale: Expressa naturalmente em português o agente substantivado, literalmente ‘aquele que semeia’.
- source_word: ⲙⲉϩⲧⲟⲟⲧϥ
  choice: encheu a mão
  rationale: Preserva o detalhe físico explícito no texto copta sem acrescentar um recipiente ou instrumento.
- source_word: ⲕⲱⲧϥ
  choice: recolheram / agarraram
  rationale: O verbo tem o sentido de reunir, recolher ou agarrar; ‘recolheram’ se ajusta às aves, enquanto ‘agarraram’ torna clara a ação dos espinhos sem harmonizá-la com ‘devoraram’.
- source_word: ϫⲉⲛⲟⲩⲛⲉ … ⲧⲉⲩⲉϩⲙⲥ
  choice: lançaram raízes … fizeram subir espigas
  rationale: Mantém o contraste vertical entre raízes que descem à terra e espigas que sobem ao céu.
- source_word: ⲱϭⲧ
  choice: sufocaram
  rationale: Equivalente corrente para o sentido de sufocar ou estrangular, adequado à ação dos espinhos sobre a semente.
- source_word: ϥⲛⲧ
  choice: verme
  rationale: Tradução direta do substantivo copta, preservando um detalhe próprio desta forma da parábola.
- source_word: ⲉⲥⲟⲧⲉ
  choice: medidas
  rationale: Conserva a formulação concreta do copta e evita substituí-la pelo rendimento em ‘vezes’ ou ‘por um’, conhecido dos paralelos sinóticos.
theological_decisions:
- issue: Harmonização com a parábola sinótica do semeador
  choice: Preservar as diferenças da versão de Tomé
  alternative: Usar ‘devoraram’, omitir o verme e verter o rendimento como ‘sessenta por um e cem por um’
  rationale: O copta apresenta ações, imagens verticais e números próprios. Harmonizá-los com Mateus, Marcos ou Lucas apagaria tensões e características genuínas desta testemunha.
- issue: Referente dos verbos na seção dos espinhos
  choice: Explicitar ‘estes’ como referência aos espinhos
  alternative: Manter apenas uma sequência de verbos com sujeito pronominal ambíguo
  rationale: A concordância e a sequência narrativa favorecem os espinhos como agentes de ‘agarraram’ e ‘sufocaram’; ‘estes’ oferece clareza em português sem introduzir uma interpretação teológica.
- issue: Objeto de ‘lançou’ na abertura
  choice: Explicitar ‘a semente’
  alternative: Traduzir literalmente ‘e lançou’ sem objeto
  rationale: O objeto está elíptico no copta, mas é imediatamente recuperável pelas sementes que caem; a explicitação é necessária para uma frase natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega ‘Eis que’ para conservar a força apresentativa do copta e mantém a repetição narrativa própria da parábola, suavizando apenas o necessário para clareza. As divergências de Tomé não foram harmonizadas com os evangelhos canônicos.
