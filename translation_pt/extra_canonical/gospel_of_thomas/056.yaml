base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: pt
  text: 'Jesus disse: “Quem veio a conhecer[b] o mundo encontrou um cadáver[a]; e quem encontrou o cadáver, o mundo não é digno dele[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na primeira ocorrência, o copta diz “um cadáver”; na segunda, “o cadáver”, provavelmente retomando o mesmo cadáver encontrado. A tradução preserva essa mudança de artigo.
    reason: dialect_note
  - marker: b
    text: “Veio a conhecer” procura expressar o aspecto concluído ou resultativo da construção copta; “conheceu” é uma alternativa mais simples.
    reason: lexical_alternative
  - marker: c
    text: 'Compare Hebreus 11:38: “dos quais o mundo não era digno”. Não se trata de um paralelo sinótico, mas apenas de uma ressonância temática.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: A fórmula narrativa ⲡⲉϫⲉ seguida do sujeito introduz o dito; o pretérito perfeito é a forma natural em português.
- source_word: ⲥⲟⲟⲩⲛ
  choice: veio a conhecer
  rationale: Exprime o valor resultativo/perfectivo da construção relativa, isto é, chegar ao estado de conhecer, sem reduzir o verbo a mera compreensão intelectual.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: o mundo
  rationale: O empréstimo copta do grego kosmos tem aqui o sentido corrente de “mundo”; “cosmos” soaria técnico em português.
- source_word: ϩⲉ
  choice: encontrou
  rationale: Traduz diretamente o sentido de achar ou encontrar e mantém a concisão do copta.
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: um cadáver / o cadáver
  rationale: “Cadáver” preserva a imagem contundente de ptōma. A passagem do artigo indefinido ⲟⲩ- ao definido ⲡ- é mantida como retomada anafórica.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: não é digno dele
  rationale: Reproduz o idioma “ser digno de” e conserva o pronome masculino singular do texto.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção simples que preserva o encadeamento breve do dito.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: quem …
  rationale: “Quem” exprime de modo natural em português o alcance indefinido da oração relativa, equivalente a “todo aquele que”.
theological_decisions:
- issue: Valor simbólico de “mundo” e “cadáver”
  choice: Manter a formulação concreta sem explicar a metáfora no corpo do texto
  alternative: Explicitar o mundo como espiritualmente morto
  rationale: O copta apresenta uma afirmação enigmática e não define o sentido teológico da imagem; explicitá-lo resolveria indevidamente a tensão.
- issue: Referente de “dele”
  choice: Conservar o pronome masculino singular
  alternative: Reformular como “dessa pessoa”
  rationale: O pronome retoma naturalmente quem encontrou o cadáver e mantém a estrutura e a pessoalidade do original.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A pontuação conserva o paralelismo abrupto do copta; “cadáver” mantém a força concreta da imagem, e as notas evitam impor uma interpretação confessional.
