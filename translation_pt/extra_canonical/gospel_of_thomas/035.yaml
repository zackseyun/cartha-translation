base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: pt
  text: 'Jesus disse: “Ninguém pode entrar na casa do homem forte e tomá-la à força[a], a menos que amarre as mãos dele; então virará a casa dele do avesso[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O pronome copta é masculino singular e pode se referir tanto à casa quanto ao homem forte: também seria possível traduzir “tomá-lo à força”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão copta pode significar “virar”, “revolver” ou “esvaziar”. Aqui ela difere do verbo “saquear” empregado nos paralelos sinóticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ
  choice: Ninguém pode
  rationale: Expressa de modo natural em português a construção copta de impossibilidade (‘não há poder/possibilidade de alguém’), sem alterar seu sentido.
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: o homem forte
  rationale: Mantém o uso substantivado de ‘forte’ e a formulação tradicional, sem acrescentar uma identificação interpretativa.
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: tomá-la à força
  rationale: Reproduz o sentido idiomático de tomar pela força. O pronome foi ligado à casa no texto corrido por naturalidade, enquanto a ambiguidade gramatical do copta é preservada em nota.
- source_word: ⲙⲟⲩⲣ ⲛⲛⲉϥϭⲓϫ
  choice: amarre as mãos dele
  rationale: Segue a forma plural do manuscrito (‘suas mãos’) e explicita naturalmente em português que as mãos pertencem ao homem forte.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: virará ... do avesso
  rationale: Conserva a imagem concreta de virar/revolver ou esvaziar, evitando substituir o verbo pelo ‘saquear’ dos paralelos sinóticos.
theological_decisions:
- issue: Referente do pronome em ‘tomá-la à força’
  choice: No texto, o objeto é apresentado como a casa, com nota de ambiguidade.
  alternative: ‘tomá-lo à força’, referindo-se ao homem forte.
  rationale: O pronome copta masculino singular pode retomar tanto ‘casa’ quanto ‘homem forte’, pois ambos os substantivos são masculinos em copta. A tradução portuguesa exige normalmente marcar o gênero, por isso a alternativa é registrada sem resolver silenciosamente a ambiguidade.
- issue: Ação final praticada contra a casa
  choice: ‘virará a casa dele do avesso’
  alternative: ‘esvaziará a casa dele’ ou ‘saqueará a casa dele’
  rationale: A escolha mantém a formulação própria de Tomé e não harmoniza o dito com Marcos 3:27 ou Mateus 12:29.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção ‘Ninguém pode’ evita rigidez desnecessária; ‘virará ... do avesso’ preserva a imagem forte do copta. Todos os marcadores de nota aparecem no texto principal.
