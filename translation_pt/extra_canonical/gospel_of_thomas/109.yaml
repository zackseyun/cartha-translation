revisions:
- from: 'Jesus disse: “O Reino[a] é semelhante a um homem que tinha em seu campo um tesouro escondido, sem saber disso. Depois que morreu, deixou o campo para seu filho. O filho não sabia do tesouro. Tomou posse daquele campo e o vendeu. Então, quem o comprou veio e, enquanto arava, encontrou o tesouro.[b] E começou a emprestar dinheiro a juros a quem quisesse.”'
  to: 'Jesus disse: “O Reino[a] é semelhante a um homem que tinha em seu campo um tesouro escondido, sem saber disso. Depois que morreu, deixou o tesouro para seu filho. O filho não sabia do tesouro. Tomou posse daquele campo e o vendeu. Então, quem o comprou veio e, enquanto arava, encontrou o tesouro.[b] E começou a emprestar dinheiro a juros a quem quisesse.”'
  rationale: 'A revisão corrige somente o referente de “deixou”: o proprietário deixa o tesouro ao filho, embora este o desconheça; depois o filho toma o campo e o vende. Isso preserva a distinção narrativa e a concordância do pronome no copta, sem alterar a ambiguidade ou introduzir interpretação doutrinária.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:51:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a estrutura narrativa, o tesouro escondido, o desconhecimento, a descoberta durante o trabalho no campo e o empréstimo a juros. Contudo, “deixou o campo para seu filho” altera o antecedente do pronome copta: ⲁϥⲕⲁⲁϥ (“deixou-o”) retoma mais naturalmente o tesouro (masculino), enquanto o filho posteriormente toma o campo e o vende.'
  naturalness: O português é moderno, claro e adequado ao registro proverbial. “Enquanto arava” expressa naturalmente a ação circunstancial; “tomou posse daquele campo” é compreensível, embora mais interpretativo que o simples “tomou aquele campo”.
  terminology: “O Reino” conserva corretamente a formulação não expandida do copta; “tesouro escondido”, “emprestar dinheiro a juros” e “encontrou” são escolhas fiéis e naturais. Os nomes e os marcadores de nota estão consistentes.
  issues:
  - severity: medium
    issue: O objeto deixado ao filho foi traduzido como “o campo”.
    rationale: O copta traz um pronome masculino em “deixou-o para seu filho”, cuja referência narrativa e concordância favorecem “o tesouro”, não “o campo”. A sequência seguinte distingue precisamente o tesouro deixado do campo que o filho toma e vende.
