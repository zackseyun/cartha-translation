base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: pt
  text: 'Jesus disse: “O Reino[a] é semelhante a um homem que tinha em seu campo um tesouro escondido, sem saber disso. Depois que morreu, deixou o tesouro para seu filho. O filho não sabia do tesouro. Tomou posse daquele campo e o vendeu. Então, quem o comprou veio e, enquanto arava, encontrou o tesouro.[b] E começou a emprestar dinheiro a juros a quem quisesse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta parábola difere de modo significativo do paralelo em Mateus 13:44. Aqui, o primeiro proprietário e seu filho desconhecem o tesouro; quem o encontra é o comprador posterior, que então passa a emprestar dinheiro a juros.
    reason: cross_reference
  - marker: b
    text: Algumas palavras desta declaração foram restauradas em lacunas do manuscrito. As restaurações são amplamente aceitas e têm forte apoio nas letras preservadas e no contexto.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: o Reino
  rationale: Traduz o substantivo abstrato copta de realeza ou domínio régio pela formulação tradicional e natural em português, sem especificar aqui “de Deus”, expressão ausente do texto.
- source_word: ⲁϩⲟ
  choice: tesouro
  rationale: Equivalente corrente para um tesouro ou depósito de riqueza; o particípio ⲉϥϩⲏⲡ é preservado em “escondido”.
- source_word: ⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟϥ
  choice: sem saber disso
  rationale: Expressa de modo natural o estado de desconhecimento do proprietário em relação ao tesouro.
- source_word: ϥⲓ
  choice: tomou posse
  rationale: No contexto da herança e posterior venda do campo, comunica a assunção de posse sem afirmar mais especificamente do que o copta que o filho o “herdou”.
- source_word: ⲧⲟⲟⲩ
  choice: comprou
  rationale: Representa diretamente o verbo copta que significa comprar.
- source_word: ⲥⲕⲁⲓ
  choice: arava
  rationale: No contexto de um campo recém-comprado, “arar” é natural; a construção circunstancial é preservada em “enquanto arava”, deixando claro que a descoberta ocorreu durante o trabalho.
- source_word: ϩⲉ ⲉ-
  choice: encontrou
  rationale: O verbo com a preposição significa achar ou deparar com algo.
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: emprestar dinheiro a juros
  rationale: Reproduz a expressão literal “dar dinheiro/cobre a juros” sem suavizá-la como “investir”.
theological_decisions:
- issue: Identificação do Reino
  choice: O Reino
  alternative: O Reino de Deus
  rationale: O copta diz apenas “o Reino”; não se acrescenta uma identificação ausente, embora ela possa ser entendida no contexto da coleção.
- issue: Empréstimo a juros
  choice: emprestar dinheiro a juros
  alternative: investir o dinheiro
  rationale: A expressão copta menciona explicitamente dinheiro dado a juros. A tradução preserva a tensão ética e teológica em vez de reinterpretar ou suavizar a ação.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “O Reino” conserva a concisão do copta; “tomou posse” evita a rigidez de “tomou o campo”; e “enquanto arava” mantém a descoberta incidental indicada pela construção circunstancial.
