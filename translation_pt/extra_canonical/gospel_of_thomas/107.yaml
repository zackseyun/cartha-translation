base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: pt
  text: 'Jesus disse: “O reinado[a] é semelhante a um pastor que tinha cem ovelhas. Uma delas — a maior[b] — se perdeu. Ele deixou as noventa e nove e foi procurar a única, até encontrá-la. Depois de ter se cansado, disse à ovelha:[c] ‘Eu amo você[d] mais do que as noventa e nove.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reino”. O termo copta pode indicar o reinado, o governo ou a soberania, e não necessariamente um território.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a grande”; também pode ser entendido como “a maior” ou “a grande ovelha”.
    reason: lexical_alternative
  - marker: c
    text: A palavra “ovelha” contém uma pequena restauração no manuscrito (NHAM02.50, linha 27); a leitura é segura pelo contexto.
    reason: lacuna_or_restoration
  - marker: d
    text: 'Ou: “Eu prefiro você às noventa e nove”. O verbo copta pode significar tanto “amar” como “preferir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: o reinado
  rationale: O substantivo abstrato formado com ⲙⲛⲧ- designa realeza, reinado ou exercício do governo. “Reinado” preserva melhor esse caráter dinâmico do que o mais espacial “reino”.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: um pastor
  rationale: A expressão significa literalmente um homem de pastoreio, isto é, “um pastor”; a posse das cem ovelhas é expressa separadamente por ⲟⲩⲛⲧⲁϥ.
- source_word: ⲛϣⲉ ⲛⲉⲥⲟⲟⲩ
  choice: cem ovelhas
  rationale: No contexto pastoral, “ovelhas” é a equivalência natural, embora o termo possa ter referência mais ampla a pequenos animais de rebanho.
- source_word: ⲥⲱⲣⲙ
  choice: se perdeu
  rationale: O verbo pode significar perder-se, extraviar-se ou andar errante. “Se perdeu” é claro e natural no contexto do rebanho.
- source_word: ⲡⲛⲟϭ
  choice: a maior
  rationale: A expressão significa literalmente “a grande”; em referência a uma ovelha do rebanho, “a maior” comunica o provável sentido de tamanho sem apagar a leitura mais ampla, registrada em nota.
- source_word: ⲕⲱ
  choice: deixou
  rationale: Mantém o sentido neutro do verbo, sem a carga negativa de “abandonou”.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲡⲓⲟⲩⲁ
  choice: foi procurar aquela uma
  rationale: Explicita a busca pela única ovelha perdida e conserva a ênfase numérica incomum do texto.
- source_word: ϣⲁⲛⲧⲉϥϩⲉ ⲉⲣⲟϥ
  choice: até encontrá-la
  rationale: Representa de modo idiomático a construção temporal com “até” e o verbo “encontrar”.
- source_word: ϩⲓⲥⲉ
  choice: se esforçar
  rationale: O termo expressa trabalho, fadiga ou sofrimento. “Se esforçar” conserva a ideia de empenho sem determinar que o pastor tenha ficado exausto.
- source_word: ⲟⲩⲟϣⲕ
  choice: amo você
  rationale: O verbo admite os sentidos “amar” e “preferir”. “Amo você” se ajusta à construção comparativa seguinte, enquanto a alternativa é preservada em nota.
theological_decisions:
- issue: O caráter do ⲡⲙⲛⲧⲣⲣⲟ
  choice: reinado
  alternative: reino
  rationale: A tradução evita reduzir o termo a um território ou lugar e preserva a possibilidade de ele indicar governo ou soberania, sem impor uma interpretação teológica específica.
- issue: A declaração final do pastor
  choice: Eu amo você mais do que as noventa e nove
  alternative: Eu prefiro você às noventa e nove
  rationale: O original permite tanto uma declaração de amor comparativo quanto de preferência. O texto principal adota a formulação mais direta, e a nota mantém a alternativa para não eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com construções de ampla compreensão e legibilidade brasileira. Empregou-se “você” na fala direta por sua naturalidade no português brasileiro e inteligibilidade internacional. A ordem e a ênfase do copta foram preservadas sempre que não prejudicavam a clareza.
