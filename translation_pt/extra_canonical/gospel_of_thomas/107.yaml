  to: 'Jesus disse: “O reinado[a] é semelhante a um pastor que tinha cem ovelhas. Uma delas — a maior[b] — se perdeu. Ele deixou as noventa e nove e foi procurar a única, até encontrá-la. Depois de ter se cansado, disse à ovelha:[c] ‘Eu amo você[d] mais do que as noventa e nove.’”'
