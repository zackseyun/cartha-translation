revisions:
- from: 'Jesus disse: “Não se colhem uvas dos espinheiros, nem se apanham figos dos cardos, pois eles não dão fruto. Uma pessoa boa[a] tira uma coisa boa do seu depósito; uma pessoa má[b] tira coisas más do seu depósito mau, que está em seu coração,[c] e fala coisas más. Pois é da abundância do coração que ela tira coisas más.”[d]'
  to: 'Jesus disse: “Não se colhem uvas dos espinheiros, nem se apanham figos dos cardos, pois eles não dão fruto. Uma pessoa boa[a] tira uma coisa boa do seu depósito; uma pessoa má[b] tira de seu depósito coisas más — o mal que está em seu coração[c] — e fala coisas más. Pois é da abundância do coração que ela tira coisas más.”[d]'
  rationale: A revisão conserva o conteúdo e as imagens do original, mas reformula a relação entre o depósito, o mal e o coração para não impor uma análise sintática contestável. Também ajusta a nota sobre os plurais manuscritos para que seja estritamente textual.
