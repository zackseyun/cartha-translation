base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: pt
  text: 'Jesus disse: “Não se colhem uvas dos espinheiros, nem se apanham figos dos cardos, pois eles não dão fruto. Uma pessoa boa[a] tira uma coisa boa do seu depósito; uma pessoa má[b] tira de seu depósito coisas más — o mal que está em seu coração[c] — e fala coisas más. Pois é da abundância do coração que ela tira coisas más.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As primeiras letras da palavra copta traduzida por “boa” foram restauradas em uma pequena lacuna do manuscrito.
    reason: Sinaliza com transparência uma restauração material no texto copta.
  - marker: b
    text: Parte da palavra copta traduzida por “má” foi restaurada em uma lacuna do manuscrito.
    reason: Sinaliza a segunda restauração material relevante.
  - marker: c
    text: 'A construção copta permite também entender: “tira coisas más de seu depósito mau, que está em seu coração”.'
    reason: Preserva a ambiguidade sintática entre o depósito, seu conteúdo mau e a referência ao coração.
  - marker: d
    text: 'O manuscrito traz formas plurais — “coisas más” — nestas ocorrências; algumas traduções as vertem no singular: “uma coisa má” ou “o mal”.'
    reason: Explica a variação de número sem atribuir ao texto uma uniformização indevida.
lexical_decisions:
- source_word: ϣⲟⲛⲧⲉ / ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: espinheiros / cardos
  rationale: Distingue as duas plantas espinhosas da imagem e emprega termos correntes em português; o segundo vocábulo copta designa literalmente uma espécie de planta espinhosa associada ao camelo.
- source_word: ⲁϩⲟ (ⲉϩⲟ no manuscrito)
  choice: depósito
  rationale: Expressa um lugar onde algo é guardado e do qual se retira seu conteúdo, sem impor a ideia especificamente monetária sugerida por “tesouro”.
- source_word: ⲁⲅⲁⲑⲟⲥ / ⲕⲁⲕⲟⲥ
  choice: boa / má
  rationale: Mantém o contraste moral direto entre a pessoa boa e a pessoa má.
- source_word: ϩⲛ̄ⲡⲟⲛⲏⲣⲟⲛ
  choice: coisas más
  rationale: Segue as formas plurais visíveis no manuscrito nas três ocorrências da parte final, em vez de uniformizá-las como singular abstrato.
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: a abundância do coração
  rationale: Reproduz de modo natural a imagem daquilo que enche ou transborda do coração.
theological_decisions:
- issue: Relação entre o depósito mau e o coração
  choice: “do seu depósito mau, que está em seu coração”
  alternative: “do depósito do mal que está em seu coração”
  rationale: Preserva a sequência e a tensão sintática do copta, no qual a qualificação “mau” se liga mais diretamente ao depósito, seguida da indicação de que ele está no coração.
- issue: Singular ou plural para o mal produzido
  choice: “coisas más”
  alternative: “uma coisa má” ou “o mal”
  rationale: O manuscrito apresenta construções plurais, embora o texto normalizado e a camada inglesa as tenham uniformizado no singular. A tradução dá prioridade ao testemunho manuscrito.
- issue: Sentido de “coração”
  choice: Mantido literalmente
  alternative: “interior” ou “mente”
  rationale: O coração permanece como centro interior da fala e da conduta, sem reduzir a imagem a uma faculdade psicológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se colhem” e “não se apanham” conservam o caráter proverbial. “Pessoa” traduz ⲣⲱⲙⲉ de modo natural e não marcado; “depósito” mantém concreta a metáfora do conteúdo interior guardado.
