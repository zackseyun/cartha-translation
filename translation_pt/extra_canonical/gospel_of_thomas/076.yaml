review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a estrutura e os elementos centrais do copta: o reinado do Pai, o mercador, a carga, a pérola única, a prudência do mercador e a exortação subsequente. «Vocês também» representa corretamente ϩⲱⲱⲛⲧⲱⲧⲛ sem introduzir um reflexivo inexistente. Contudo, «permanece: o lugar onde» não representa de modo claro a relação sintática da expressão final ⲡⲙⲁ; uma pequena revisão torna explícita a ligação locativa sem resolver o referente masculino de ⲡⲉϥⲁϩⲟ.'
  naturalness: 'O português é em geral claro e de registro apropriado. A sequência «que não se esgota e permanece: o lugar onde» é truncada, pois os dois-pontos fazem «o lugar» parecer uma redefinição de «tesouro». «que não se esgota e permanece, no lugar onde» é mais fluente e conserva os componentes do original.'
  terminology: «Reinado do Pai», «mercador», «carga», «pérola», «prudente», «tesouro» e «verme» são escolhas adequadas. «Aquela única pérola» acrescenta um demonstrativo que não é necessário; «a única pérola» transmite a definitude e a ênfase de ⲟⲩⲱⲧ sem esse acréscimo.
  issues:
  - severity: medium
    issue: Ligação pouco clara de «o lugar onde»
    rationale: 'O copta inclui ⲡⲙⲁ («o lugar») após as descrições do tesouro duradouro. Na redação atual, os dois-pontos criam uma aposição semântica pouco natural: o tesouro não é apresentado simplesmente como «o lugar». A construção locativa «permanece, no lugar onde...» preserva a palavra e torna a frase inteligível.'
  - severity: low
    issue: Demonstrativo adicional em «aquela única pérola»
    rationale: O texto traz artigo definido e o numeral «um», com ênfase na singularidade. «A única pérola» exprime isso sem acrescentar a nuance deíctica de «aquela».
