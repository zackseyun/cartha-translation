revisions:
- from: 'Jesus disse: “O reinado do Pai é semelhante a um mercador que tinha uma carga de mercadorias e encontrou uma pérola. Esse mercador era prudente: vendeu a carga[a] e comprou para si aquela única pérola. Vocês também, procurem o tesouro dele[b], que não se esgota e permanece: o lugar onde nenhuma traça entra para comer, e nenhum verme destrói[c].”'
  to: 'Jesus disse: “O reinado do Pai é semelhante a um mercador que tinha uma carga de mercadorias e encontrou uma pérola. Esse mercador era prudente: vendeu a carga[a] e comprou para si a única pérola. Vocês também, procurem o tesouro dele[b], que não se esgota e permanece, no lugar onde nenhuma traça entra para comê-lo e nenhum verme o destrói[c].”'
  rationale: A revisão resolve a ligação sintática e estilística deficiente entre «permanece» e «o lugar onde», mantendo explicitamente o elemento locativo presente no copta. Também remove o demonstrativo não exigido em «aquela única pérola». As âncoras e as notas existentes permanecem adequadamente associadas aos seus termos.
  reviewer_model: gpt-5.6-terra
