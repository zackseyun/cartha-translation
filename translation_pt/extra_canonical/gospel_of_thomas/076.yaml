base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: pt
  text: 'Jesus disse: “O reinado do Pai é semelhante a um mercador que tinha uma carga de mercadorias e encontrou uma pérola. Esse mercador era prudente: vendeu a carga[a] e comprou para si a única pérola. Vocês também, procurem o tesouro dele[b], que não se esgota e permanece, no lugar onde nenhuma traça entra para comê-lo e nenhum verme o destrói[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vendeu a carga: literalmente, “deu a carga para fora”. No contexto de comércio e compra, a expressão indica vender ou desfazer-se dos bens em troca de valor.'
    reason: lexical_alternative
  - marker: b
    text: O manuscrito apresenta aqui uma dificuldade ortográfica; a tradução segue a leitura normalizada ⲡⲉϥⲁϩⲟ, “o tesouro dele”.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Verme: o texto de Tomé traz “verme”, não “ferrugem”, como aparece em alguns paralelos. A imagem é de deterioração orgânica.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: o reinado do Pai
  rationale: ⲙⲛⲧⲣⲣⲟ designa primariamente governo ou domínio régio; “reinado” preserva essa nuance abstrata sem transformar a expressão num território.
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: mercador / esse mercador
  rationale: A expressão literalmente ligada ao comércio designa de modo idiomático um mercador; a segunda ocorrência retoma a mesma pessoa.
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: carga de mercadorias / carga
  rationale: O empréstimo grego φορτίον significa carga ou fardo; o contexto comercial permite explicitar na primeira ocorrência que se trata de mercadorias.
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: pérola
  rationale: É o equivalente corrente do empréstimo grego μαργαρίτης.
- source_word: ⲥⲁⲃⲉ
  choice: prudente
  rationale: Expressa sabedoria prática ou sensatez, especialmente adequada à decisão comercial narrada.
- source_word: ϯⲡⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: vendeu a carga
  rationale: A construção é literalmente “deu a carga para fora”, mas, no contexto explícito de compra e comércio, indica alienar ou vender os bens.
- source_word: ⲧⲟⲟⲩ ⲛⲁϥ
  choice: comprou para si
  rationale: O verbo significa comprar, e o dativo pronominal indica que o mercador adquiriu a pérola para si.
- source_word: ⲟⲩⲱⲧ
  choice: aquela única pérola
  rationale: O numeral enfatiza a singularidade da pérola; “aquela” retoma naturalmente a pérola já mencionada.
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: vocês também
  rationale: A forma enfática/adverbial significa “vocês também” ou “quanto a vocês”; não foi duplicada com o acréscimo reflexivo “para vocês mesmos”.
- source_word: ⲡⲉϥⲁϩⲟ
  choice: o tesouro dele
  rationale: ⲁϩⲟ pode significar riqueza ou tesouro. O pronome masculino foi preservado de modo natural, sem explicitar além do texto a identidade de seu referente.
- source_word: ⲱϫⲛ
  choice: se esgota
  rationale: Na oração negativa, o verbo comunica a ideia de acabar, faltar ou esgotar-se; “não se esgota” é claro e idiomático.
- source_word: ⲙⲟⲩⲛ ⲉⲃⲟⲗ
  choice: permanece
  rationale: A expressão indica continuidade ou duração persistente.
- source_word: ⲡϥⲛⲧ
  choice: verme
  rationale: O substantivo significa verme, mantendo a imagem de deterioração orgânica presente no copta.
theological_decisions:
- issue: Natureza da expressão “reinado do Pai”
  choice: reinado do Pai
  alternative: reino do Pai
  rationale: “Reinado” representa o sentido abstrato de governo régio de ⲙⲛⲧⲣⲣⲟ e evita decidir que a expressão se refere principalmente a um domínio territorial; “reino” continua sendo uma alternativa tradicional possível.
- issue: Referente de “o tesouro dele”
  choice: manter o pronome masculino sem identificar expressamente o referente
  alternative: explicitar “o tesouro do mercador” ou substituir por “um tesouro”
  rationale: O texto copta traz um possessivo masculino, mas a formulação pode causar tensão na passagem da parábola à exortação. A tradução preserva essa forma em vez de resolver interpretativamente o referente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “Mercador” conserva o cenário antigo sem soar excessivamente técnico; “carga de mercadorias” esclarece o objeto comercial. A pontuação mantém o ritmo sentencioso e a transição da parábola para a exortação.
