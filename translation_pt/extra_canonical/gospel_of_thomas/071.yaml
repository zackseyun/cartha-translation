base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: pt
  text: 'Jesus disse: “Eu derrubarei esta casa[a], e ninguém poderá construí-la[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras correspondentes a «esta casa» foram parcialmente restauradas onde o manuscrito está danificado; a leitura normalizada é ⲛⲡⲉⲓⲏⲓ, «esta casa».
    reason: lacuna_or_restoration
  - marker: b
    text: O copta diz literalmente que ninguém «será capaz» em relação a ela; a ação de construir é inferida pelo contexto. «Construí-la» expressa essa inferência; «reconstruí-la» acrescentaria a ideia de «de novo», que não aparece explicitamente no copta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: Preserva a fórmula narrativa copta com o falante explicitamente identificado.
- source_word: ⲁⲛⲟⲕⲛⲁϣⲟⲣϣⲣ
  choice: Eu derrubarei
  rationale: O pronome independente ⲁⲛⲟⲕ dá alguma ênfase ao sujeito, naturalmente conservada pelo uso explícito de “Eu”; ϣⲟⲣϣⲣ significa derrubar, demolir ou destruir uma construção.
- source_word: ⲡⲉⲓⲏⲓ
  choice: esta casa
  rationale: ⲏⲓ designa casa ou moradia, e o elemento demonstrativo indica “esta”.
- source_word: ⲙⲛⲗⲁⲁⲩ
  choice: ninguém
  rationale: A construção negativa com o indefinido ⲗⲁⲁⲩ expressa “ninguém”.
- source_word: ϣⲕⲱⲧⲛⲧⲟϥ
  choice: poderá reconstruí-la
  rationale: ϣⲕⲱⲧ significa “ser capaz”; a ação é elíptica e precisa ser inferida da referência à casa. “Reconstruí-la” comunica em português a ação contextual posterior à demolição, embora o sentido de “de novo” não esteja lexicalmente expresso.
theological_decisions:
- issue: Identidade ou sentido simbólico de “esta casa”
  choice: Manter “esta casa” sem explicação interpretativa
  alternative: Identificá-la com o templo, o corpo ou o mundo
  rationale: O dito não identifica a casa; especificá-la resolveria indevidamente uma ambiguidade potencialmente teológica.
- issue: Ação elíptica após “poderá”
  choice: Suprir “reconstruí-la” no texto e registrar a inferência em nota
  alternative: Traduzir literalmente “ninguém poderá fazê-lo” ou suprir “construí-la”
  rationale: O contexto de uma casa derrubada torna a reconstrução a inferência natural em português, mas a nota preserva a distinção entre o que está explícito e o que foi suprido.
translation_notes:
  register: Português moderno, claro e digno, com pontuação direta. O pronome “Eu” conserva sem exagero a ênfase do pronome copta independente. A formulação evita identificar simbolicamente a casa.
