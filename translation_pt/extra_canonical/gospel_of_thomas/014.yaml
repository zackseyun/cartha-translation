base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: pt
  text: '**Evangelho de Tomé — Dito 14**


    Jesus lhes disse: “Se vocês jejuarem, adquirirão para si um pecado[a]; se orarem, serão condenados[b]; e, se derem esmolas, farão mal ao espírito de vocês. Se entrarem em qualquer terra e andarem pelas regiões, se os receberem, comam o que puserem diante de vocês e curem os enfermos que houver entre eles.[c] Pois o que entrar pela boca de vocês não os tornará impuros; mas o que sair da boca de vocês, isso é o que os tornará impuros.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo copta também pode ser traduzido por “gerar” ou “produzir”: “gerarão para si um pecado”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “eles condenarão vocês”; o sujeito plural indefinido é uma maneira comum de expressar a voz passiva em copta.
    reason: source_idiom
  - marker: c
    text: 'O copta destaca os objetos no início das orações: literalmente, “o que puserem diante de vocês, comam-no; os enfermos entre eles, curem-nos”.'
    reason: register_note
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: adquirirão
  rationale: O verbo pode significar “gerar”, “obter” ou “adquirir”. “Adquirirão para si um pecado” conserva a formulação deliberadamente surpreendente e a ideia de trazer algo sobre si, sem suavizá-la.
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: serão condenados
  rationale: O empréstimo grego κατακρίνω significa condenar. A construção copta com sujeito plural indefinido funciona naturalmente como passiva.
- source_word: ⲕⲱ ϩⲁ-
  choice: puserem diante de vocês
  rationale: Embora a expressão seja literalmente “colocar sob”, no contexto da hospitalidade designa pôr ou servir comida diante de alguém.
- source_word: ϫⲱϩⲙ̄
  choice: tornará impuros
  rationale: O verbo denota tornar impuro, contaminar ou profanar. A formulação escolhida é natural em português e preserva a dimensão ritual e moral sem substituí-la por “sobrecarregar”.
- source_word: ⲙⲟⲟϣⲉ ϩⲛ̄ⲛ̄ⲭⲱⲣⲁ
  choice: andarem pelas regiões
  rationale: O verbo expressa andar ou viajar, e o substantivo está no plural. A tradução evita introduzir a ideia de hospedar-se, ausente do texto.
theological_decisions:
- issue: Crítica provocativa às práticas tradicionais de piedade
  choice: “adquirirão para si um pecado” e “farão mal ao espírito de vocês”
  alternative: “trarão pecado sobre si” e “prejudicarão seu espírito”
  rationale: O dito formula uma inversão deliberadamente contundente a respeito de jejum, oração e esmolas. A tradução não acrescenta condições ou motivações que amenizem essa tensão.
- issue: Pureza e contaminação
  choice: “o que entrar pela boca... não os tornará impuros”
  alternative: “não os contaminará”
  rationale: “Tornar impuro” preserva tanto a possível dimensão ritual quanto a moral, sem decidir entre elas nem harmonizar explicitamente o dito com uma tradição canônica.
- issue: Número de “espírito”
  choice: “ao espírito de vocês”
  alternative: “aos espíritos de vocês”
  rationale: O copta apresenta “espírito” no singular com possuidor plural. A tradução mantém esse singular coletivo, deixando aberta a relação entre o grupo e cada indivíduo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. Conservou-se o tom aforístico e provocativo do original. “Terra” e “regiões” mantêm a alternância lexical do copta; “entre eles” retoma as pessoas que recebem os viajantes, e não significa apenas “ali”.
