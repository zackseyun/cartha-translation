base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: pt
  text: Jesus disse:[a] “Quem busca encontrará; e ao que bate para entrar,[b] abrirão para ele.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras iniciais “Jesus disse” estão parcialmente reconstruídas no manuscrito; o texto normalizado traz ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: “Bate para entrar” traduz o verbo ⲧⲱϩⲙ com a expressão direcional ⲉϩⲟⲩⲛ (“para dentro”, “para entrar”), sem acrescentar “porta”, que não aparece no texto.
    reason: cultural_note
  - marker: c
    text: '“Abrirão para ele” traduz uma forma de terceira pessoa do plural usada em sentido impessoal. Também pode ser traduzida em sentido passivo: “será aberto para ele”. O que é aberto não é expresso no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: ⲡⲉϫⲉ é a fórmula narrativa usual para introduzir uma fala, seguida aqui do nome Jesus.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: Quem busca encontrará
  rationale: A construção relativa apresenta um sujeito genérico; ϣⲓⲛⲉ significa “buscar” e o futuro de ϭⲓⲛⲉ, “encontrará”. A formulação preserva a concisão proverbial.
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: a quem bate para entrar
  rationale: ⲧⲱϩⲙ significa “bater”, enquanto ⲉϩⲟⲩⲛ indica movimento para dentro. “Para entrar” conserva essa direção sem acrescentar “porta”, ausente do copta.
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: será aberto
  rationale: A terceira pessoa do plural pode ter valor impessoal ou passivo. A construção portuguesa evita inventar um agente ou explicitar um objeto como “porta”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial concisa. O paralelismo foi mantido sem inserir “porta” nem identificar quem abre. A construção “a quem bate” permite que “será aberto” conserve a impessoalidade do copta e soe natural para leitores brasileiros e internacionais.
