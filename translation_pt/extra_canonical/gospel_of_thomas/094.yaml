  source_fidelity: A primeira cláusula traduz corretamente o sujeito genérico, o futuro e a concisão proverbial. Na segunda, porém, «a quem bate ... será aberto» não representa de modo claro o dativo final «para ele» (ⲛⲁⲛⲧⲟϥ) e produz uma construção passiva portuguesa incompleta, sem referente expresso ou recuperável para o que é aberto. O plural impessoal copta é mais bem preservado por «abrirão para ele», que também mantém o objeto não expresso.
  naturalness: «Quem busca encontrará» é natural e conciso. «Ao que bate para entrar, abrirão para ele» é compreensível em português moderno, preserva o paralelismo e não acrescenta «porta».
  terminology: «Jesus disse», «busca», «encontrará» e «bater para entrar» são adequados. A nota sobre a lacuna e a nota direcional estão corretas; a nota final deve corresponder à opção impessoal plural adotada.
  issues:
  - severity: medium
    issue: A segunda cláusula omite ou deixa sintaticamente indeterminado o dativo «para ele».
    rationale: O copta termina com ⲛⲁⲛⲧⲟϥ, «para ele». Em «a quem bate ... será aberto», «a quem» funciona antes como complemento relativizado de «bate» do que como o beneficiário explicitamente retomado pelo verbo final; além disso, «será aberto» fica sem sujeito/objeto recuperável em português.
