  verdict: approve
  source_fidelity: A tradução reproduz com precisão a pergunta dos discípulos, a ausência de uma fórmula explícita de resposta no manuscrito (assinalada por colchetes), a negação de uma vinda identificável pela observação e o contraste final com o reinado do Pai já espalhado sobre a terra e não percebido pelas pessoas. A opção textual «aqui/ali» segue adequadamente a leitura do manuscrito e é explicada em nota.
  naturalness: O português é moderno, claro e de boa legibilidade internacional, com formulações naturais como «Em que dia virá», «Não dirão» e «as pessoas não o veem». «Não virá de modo que se possa observá-lo» é um pouco mais explícito que a construção concisa do copta, mas preserva adequadamente o sentido de não vir por observação vigilante e funciona bem no registro adotado.
  terminology: «Reinado» é uma escolha defensável para ⲡⲙⲛⲧⲣⲣⲟ, pois conserva a nuance abstrata de governo ou exercício da realeza; a nota oferece corretamente «reino» como alternativa. «Terra», «espalhado» e «pessoas» correspondem bem aos termos coptas sem impor interpretação teológica adicional.
