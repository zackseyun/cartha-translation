base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: pt
  text: 'Seus discípulos lhe perguntaram: “Em que dia virá o reinado[a]?”


    [Ele disse]:[b] “Não virá de modo que se possa observá-lo. Não dirão: ‘Olhem, está aqui!’ ou: ‘Olhem, está ali!’[c] Pelo contrário, o reinado do Pai está espalhado sobre a terra[d], e as pessoas não o veem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reino”. O termo copta pode destacar o governo ou domínio real, além da ideia de um reino.
    reason: lexical_alternative
  - marker: b
    text: As palavras “Ele disse” não aparecem no manuscrito; foram acrescentadas para deixar clara a mudança de fala.
    reason: source_clarification
  - marker: c
    text: O texto do manuscrito traz “ali”, formando o par “aqui/ali”. O texto normalizado citado na fonte traz “céu” nesse ponto.
    reason: textual_variant
  - marker: d
    text: O termo traduzido como “terra” também pode significar “solo” ou “região”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: reinado
  rationale: A formação abstrata derivada de “rei” aponta para governo, domínio ou exercício da realeza, não necessariamente para um território. “Reinado” preserva essa nuance, enquanto “reino” permanece uma alternativa legítima.
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: em que dia
  rationale: Mantém a formulação concreta do copta, literalmente relacionada a “que dia”, sem reduzi-la ao mais genérico “quando”.
- source_word: ϭⲱϣⲧ
  choice: de modo que se possa observá-lo
  rationale: Expressa o sentido de observação ou vigilância voltada a sinais visíveis. A formulação é natural em português e conserva o contraste com a realidade já presente, mas não percebida.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Olhem
  rationale: Reproduz a força de chamada de atenção da expressão deítica em linguagem portuguesa atual e direta.
- source_word: ⲡⲓⲥⲁ
  choice: está aqui
  rationale: Embora a expressão inclua literalmente “o lugar”, sua função na construção deítica é indicar “aqui”.
- source_word: ⲧⲏ / ⲡⲏ
  choice: está ali
  rationale: A leitura do manuscrito no nível da linha, ⲧⲏ, forma o par natural “aqui/ali”. A normalização ⲡⲏ significaria “céu”, leitura registrada em nota por ser textualmente relevante.
- source_word: ⲥⲡⲱⲣϣ ⲉⲃⲟⲗ
  choice: está espalhado
  rationale: Conserva o estado presente e a imagem de algo difundido ou estendido amplamente, sem impor se a ação anterior deve ser entendida como divina ou impessoal.
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  choice: sobre a terra
  rationale: Preserva a imagem espacial concreta. ⲡⲕⲁϩ também pode designar “terra” no sentido de solo ou região.
- source_word: ⲛⲣⲱⲙⲉ
  choice: as pessoas
  rationale: O plural é genérico; “as pessoas” comunica isso naturalmente, sem restringi-lo ao sexo masculino.
theological_decisions:
- issue: Natureza de ⲡⲙⲛⲧⲣⲣⲟ
  choice: reinado
  alternative: reino
  rationale: “Reinado” deixa em primeiro plano a ação ou realidade do governo do Pai e evita transformar automaticamente a expressão em um lugar, sem negar que “reino” seja tradução possível.
- issue: Temporalidade do reinado do Pai
  choice: está espalhado
  alternative: foi espalhado
  rationale: A formulação apresenta a realidade como já presente e difundida, mas não define quando ou por quem ela foi espalhada; o presente preserva essa abertura.
- issue: Sujeito da resposta não expresso no manuscrito
  choice: '[Ele disse]'
  alternative: omitir a fórmula introdutória
  rationale: A inserção entre colchetes torna clara a mudança para a resposta de Jesus sem sugerir que a fórmula narrativa esteja escrita no copta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Empregou-se “lhe perguntaram”, “olhem” e “as pessoas” como formas correntes. Os colchetes sinalizam com transparência a fórmula de fala suprida, e as notas preservam as ambiguidades lexical e textual.
