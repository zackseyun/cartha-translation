base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: pt
  text: 'Seus discípulos o interrogaram, dizendo:


    — Queres que jejuemos? E como devemos orar? Devemos dar esmolas? E o que devemos observar quanto à alimentação?


    Jesus disse:


    — Não mintam e não façam aquilo que odeiam, pois todas as coisas estão reveladas diante do céu.[a] Porque não há nada oculto que não venha a ser revelado, nem nada encoberto que permaneça sem ser descoberto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O fragmento grego P.Oxy. 654 traz “diante da verdade” em vez de “diante do céu”.
    reason: textual_variant
  - marker: b
    text: O fragmento grego P.Oxy. 654 traz “e nada sepultado que não seja ressuscitado” em vez de “nem nada encoberto que permaneça sem ser descoberto”.
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: jejuemos
  rationale: O verbo copta, tomado do grego νηστεύω, significa jejuar; a forma portuguesa preserva a pergunta sobre a prática comunitária.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: como
  rationale: A expressão significa literalmente “qual é o modo”, funcionando idiomaticamente como “como”.
- source_word: ϯⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: dar esmolas
  rationale: O empréstimo grego designa a prática de dar esmolas; esta formulação é clara e tradicional sem soar arcaica.
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  choice: alimentação
  rationale: O substantivo pode designar o ato de comer, a comida ou o regime alimentar. “Quanto à alimentação” preserva o foco em observâncias alimentares, sem transformar a frase em oração temporal.
- source_word: ϫⲉϭⲟⲗ
  choice: mintam
  rationale: A expressão significa literalmente “dizer mentira”; “não mintam” conserva a força direta e aforística.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ ⲛⲧⲡⲉ
  choice: diante do céu
  rationale: A locução composta significa “diante de, na presença de”; ⲧⲡⲉ é “o céu”. A imagem incomum é preservada.
- source_word: ϩⲱⲡ / ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: oculto / revelado
  rationale: O par expressa ocultação e manifestação; a tradução mantém a correspondência verbal e o tom proverbial.
- source_word: ϩⲱⲃⲥ / ⲟⲩⲉϣⲛ ϭⲱⲗⲡⲛⲧⲟϥ
  choice: encoberto / sem ser descoberto
  rationale: 'Preserva o segundo jogo de imagens do copta, distinto do primeiro: algo coberto que acaba sendo descoberto ou destapado.'
theological_decisions:
- issue: Diferença entre o copta “diante do céu” e o fragmento grego “diante da verdade”
  choice: diante do céu
  alternative: diante da verdade
  rationale: O texto principal traduz o testemunho copta fornecido, enquanto a leitura grega antiga é registrada em nota, sem harmonização.
- issue: Diferença entre o copta “encoberto/descoberto” e o grego “sepultado/ressuscitado”
  choice: nada encoberto que permaneça sem ser descoberto
  alternative: nada sepultado que não seja ressuscitado
  rationale: A redação copta tem caráter revelatório, enquanto a variante grega pode sugerir ressurreição. A tradução não importa essa conotação para o texto copta e preserva a variante em nota.
- issue: Relação entre as perguntas rituais e a resposta ética de Jesus
  choice: manter a transição abrupta sem explicação
  alternative: inserir uma ligação interpretativa entre as práticas e os mandamentos
  rationale: O dito não responde explicitamente a cada pergunta. Acrescentar uma ligação resolveria uma tensão genuína ausente do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” implícito nas formas de terceira pessoa do plural e mantém “Queres” para a pergunta direta dirigida a Jesus, refletindo a alternância natural de número do original. Conserva o paralelismo proverbial e as imagens incomuns do texto, evitando explicações dentro da tradução.
