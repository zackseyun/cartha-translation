base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: pt
  text: 'Simão Pedro lhes disse: “Que Maria saia do nosso meio, pois a mulher[a] não é digna da vida.” Jesus disse: “Eis: eu mesmo a conduzirei[b], para que eu a faça homem[c], a fim de que ela também se torne um espírito vivo, semelhante a vocês, homens. Pois toda mulher que se fizer homem entrará no Reino dos céus[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta ⲥϩⲓⲙⲉ pode significar “mulher” ou “fêmea”. Aqui ele forma uma polaridade direta com ϩⲟⲟⲩⲧ, “homem” ou “macho”.
    reason: lexical_alternative
  - marker: b
    text: O pronome “a” aparece no manuscrito como ⲙ̄ⲙⲟⲥ; a normalização de Dilley traz a forma equivalente ⲛⲛⲧⲟⲥ. Ambas são objeto direto feminino singular.
    reason: textual_variant
  - marker: c
    text: O manuscrito apresenta variação ortográfica em formas da palavra copta para “homem/macho”; trata-se de oscilação gráfica ou dialetal, sem diferença de sentido.
    reason: dialect_note
  - marker: d
    text: “Céus” traduz a forma copta plural. Algumas traduções dizem “céu”; a expressão designa o âmbito do reinado divino e não exige uma distinção espacial rígida entre singular e plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ
  choice: Que … saia
  rationale: A construção volitiva/jussiva pede uma ordem na terceira pessoa; “que saia” é natural em português e conserva o sentido de sair ou deixar o grupo.
- source_word: ϩⲛⲁⲛⲟⲛ
  choice: do nosso meio
  rationale: Com ⲉⲃⲟⲗ, a expressão indica saída de entre o grupo; “do nosso meio” é idiomático e fiel.
- source_word: ⲥϩⲓⲙⲉ
  choice: mulher
  rationale: O termo pode designar “mulher” ou “fêmea”. Em referência a uma pessoa, “mulher” oferece clareza e dignidade em português, enquanto a nota registra a polaridade explícita com “macho/masculino” no copta.
- source_word: ⲙⲡϣⲁ ⲁⲛ
  choice: não é digna
  rationale: Reproduz diretamente a construção negativa de dignidade sem explicar a natureza dessa dignidade.
- source_word: ⲡⲱⲛϩ
  choice: vida
  rationale: Mantém o sentido lexical amplo, sem decidir se a passagem alude à existência, à salvação ou à vida eterna.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Vejam
  rationale: Partícula deíctica que chama a atenção; “Vejam” preserva sua força e se dirige naturalmente ao grupo.
- source_word: ⲥⲱⲕ
  choice: conduzirei
  rationale: O verbo pode significar conduzir, levar ou puxar; “conduzirei” preserva a ideia de direção sem especificar o modo.
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: faça … homem
  rationale: Mantém a formulação deliberadamente estranha e a construção predicativa do copta, sem parafrasear a transformação.
- source_word: ⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: um espírito vivo
  rationale: Trata “espírito” como substantivo comum e conserva o particípio “vivo” como sua qualificação.
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: o Reino dos céus
  rationale: É a expressão portuguesa corrente para o reino associado aos céus; o plural formal do copta é conservado.
theological_decisions:
- issue: Natureza da transformação de mulher em homem
  choice: Conservar literalmente “faça homem” e “se fizer homem”
  alternative: Interpretar como transformação espiritual, superação simbólica do sexo ou aquisição de alguma qualidade considerada masculina
  rationale: O dito não explica se a linguagem é corporal, simbólica, social ou espiritual. A tradução preserva essa tensão em vez de impor uma interpretação.
- issue: Sentido de “vida”
  choice: Manter apenas “vida”
  alternative: Explicitar “vida eterna”, “salvação” ou “existência”
  rationale: O substantivo copta não resolve sozinho qual dimensão da vida está em vista.
- issue: Identidade de “espírito vivo”
  choice: 'Usar minúsculas e artigo indefinido: “um espírito vivo”'
  alternative: “o Espírito vivo” ou referência explícita ao Espírito Santo
  rationale: A sintaxe apresenta um substantivo comum, não um título divino inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A sintaxe permanece direta e oral. “Mulher/homem” evita o tom zoológico que “fêmea/macho” teria no português corrente, mas a nota explicita a polaridade lexical mais crua do copta. A estranheza teológica central do dito foi deliberadamente preservada.
