base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: pt
  text: 'Jesus disse[a]: “Se vocês têm dinheiro, não o emprestem a juros; em vez disso, deem-no[b] a alguém de quem não o receberão de volta[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “Jesus disse” foram restauradas, pois o manuscrito apresenta um pequeno dano nesse ponto.
    reason: lacuna_or_restoration
  - marker: b
    text: 'Há incerteza textual nesta expressão: o manuscrito permite a leitura “deem-no”, enquanto o texto normalizado lê “deem a ele”. O sentido geral — dar ao destinatário caracterizado pela oração seguinte — não muda.'
    reason: textual_variant
  - marker: c
    text: O copta emprega no final um pronome plural, provavelmente concebendo o dinheiro como moedas. O português usa o singular, em concordância natural com “dinheiro”.
    reason: dialect_note
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: se
  rationale: Introduz uma condição geral ou eventual, não uma sequência temporal definida.
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  choice: vocês têm dinheiro
  rationale: A construção copta de posse existencial é expressa naturalmente em português com o verbo “ter”; “vocês” preserva o plural.
- source_word: ϩⲟⲙⲧ
  choice: dinheiro
  rationale: O termo pode designar cobre, moeda ou dinheiro; neste contexto, “dinheiro” comunica de modo natural a referência financeira genérica.
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  choice: não o emprestem a juros
  rationale: A locução significa idiomaticamente emprestar dinheiro cobrando juros; “a juros” evita a possível leitura moderna de “usura” como taxa apenas excessiva.
- source_word: ϯ ⲛⲛⲧⲟϥ
  choice: deem-no a alguém
  rationale: Representa a instrução de dar o dinheiro e introduz naturalmente, em português, o destinatário definido pela oração relativa; o manuscrito apresenta incerteza nessa expressão.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  choice: de quem não o receberão de volta
  rationale: Conserva a direção mais provável da expressão — não recuperar o dinheiro do destinatário — e usa pronome singular por concordância natural com “dinheiro” em português, embora o copta tenha objeto plural, provavelmente concebendo moedas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Vocês” explicita o plural do original. “Deem-no” mantém clareza referencial sem tornar a frase excessivamente coloquial; “a alguém” evita o pouco natural “àquele” antes de uma oração com “de quem”.
