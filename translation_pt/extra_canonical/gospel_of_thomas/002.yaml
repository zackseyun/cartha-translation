  naturalness: O português é moderno, claro e adequado ao registro sentencioso. A repetição de “quando” e “ficará” transmite bem o paralelismo. A única melhoria recomendável é retirar “Então”, pois o copta apenas coordena a última afirmação com “e”; embora a sequência seja evidente, “então” a torna uma conclusão explicitada.
  terminology: “Perturbado” preserva a distinção de ϣⲧⲟⲣⲧⲣ em relação a “maravilhado” para ⲣϣⲡⲏⲣⲉ. “Reinará” representa precisamente o verbo de reinar, e “o Todo” mantém a expressão coletiva/cosmológica sem impor interpretação teológica.
