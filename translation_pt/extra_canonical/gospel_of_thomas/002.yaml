base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: pt
  text: 'Jesus disse: “Quem busca não pare de buscar até encontrar. Quando encontrar, ficará perturbado[b]; e, quando ficar perturbado, ficará maravilhado. E reinará sobre o Todo[c].”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O fragmento grego POxy 654 apresenta uma forma diferente da sequência: inclui que a pessoa “ficará assombrada” e termina com “e, depois de reinar, repousará”. O texto copta traz “ficará perturbado; ... ficará maravilhado” e não inclui o repouso final.'
    reason: textual_variant
  - marker: b
    text: Também pode ser traduzido por “ficará inquieto” ou “ficará alarmado”. O verbo foi mantido distinto do seguinte, que significa maravilhar-se ou ficar admirado.
    reason: lexical_alternative
  - marker: c
    text: “O Todo” designa a totalidade das coisas, ou o cosmos, e não meramente “muitas coisas”.
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  choice: não pare
  rationale: Reproduz como exortação na terceira pessoa o jussivo negativo, sem introduzir um interlocutor implícito, e traduz ⲗⲟ como ‘parar/cessar’.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  choice: quem busca
  rationale: Expressa com naturalidade em português o particípio substantivado ‘aquele que busca’, preservando a concisão da máxima.
- source_word: ⲉⲣⲉ ⲛⲧⲟϥ ϣⲓⲛⲉ
  choice: de buscar
  rationale: Ligado a ‘não pare’, comunica a continuidade da busca exigida pelo aspecto da construção.
- source_word: ϣⲁⲛⲧⲉ ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: até encontrar
  rationale: Verte diretamente a oração temporal com ϣⲁⲛⲧⲉ e evita repetir um pronome desnecessário em português.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: quando encontrar
  rationale: Mantém o valor temporal prospectivo da construção e a progressão do dito.
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: ficará perturbado
  rationale: Representa o campo semântico de perturbação ou inquietação e o distingue do assombro expresso pelo verbo seguinte.
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: ficará maravilhado
  rationale: Traduz o sentido de maravilhar-se ou ficar admirado, preservando a escalada enigmática da sequência.
- source_word: ⲣ̄ⲣ̄ⲣ̄ⲟ
  choice: reinará
  rationale: Conserva a imagem específica de exercer realeza, em vez do sentido mais amplo de simplesmente governar.
- source_word: ⲉϫⲛ ⲡⲧⲏⲣϥ
  choice: sobre o Todo
  rationale: Mantém a expressão coletiva característica para a totalidade das coisas, sem reduzi-la a ‘muitas coisas’.
theological_decisions:
- issue: Sentido cosmológico de ⲡⲧⲏⲣϥ
  choice: o Todo
  alternative: tudo / a totalidade
  rationale: A forma substantivada e o uso no Evangelho de Tomé favorecem uma referência à totalidade do que existe; a maiúscula sinaliza o caráter idiomático sem definir um sistema metafísico específico.
- issue: Relação entre perturbação, maravilhamento e reinado
  choice: preservar a sequência sem explicá-la
  alternative: interpretar a perturbação como conversão, provação ou iluminação
  rationale: O dito não identifica a natureza dessas etapas; explicá-las no texto importaria uma leitura teológica não explicitada pela fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Quem busca não pare” conserva o jussivo de terceira pessoa em forma de máxima. As repetições de “quando” e “ficará” preservam o paralelismo e a progressão do copta; “Então” torna natural em português a ligação conclusiva marcada pela sequência, sem acrescentar uma interpretação doutrinária.
