base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: pt
  text: 'Jesus disse: “Uma videira[a] foi plantada fora do Pai e, como não está firmemente estabelecida[b], será arrancada[c] de sua raiz[d] e perecerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo copta para “videira” é um empréstimo do grego ἄμπελος e aparece no manuscrito com uma forma ortográfica regional, sem a consoante nasal esperada.
    reason: dialect_note
  - marker: b
    text: Também pode ser traduzido como “não está firme” ou “não está consolidada”. No contexto da videira, o sentido pode sugerir que ela não se firmou, mas o verbo não diz literalmente “criar raízes”.
    reason: lexical_alternative
  - marker: c
    text: O copta emprega uma terceira pessoa do plural com sentido impessoal, literalmente “eles a arrancarão”. A tradução usa a voz passiva para expressar naturalmente essa agência indefinida em português.
    reason: grammar_note
  - marker: d
    text: A expressão copta também pode ser entendida como “pela raiz” ou “a partir de sua raiz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: uma videira
  rationale: O substantivo, empréstimo do grego ἄμπελος, designa especificamente a planta que produz uvas. “Videira” é a forma natural e precisa em português.
- source_word: ⲁⲩⲧⲟϭⲥ
  choice: foi plantada
  rationale: O verbo ⲧⲱϭⲉ significa “plantar”. A terceira pessoa do plural tem valor impessoal; a passiva portuguesa comunica esse valor com naturalidade.
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: fora do Pai
  rationale: A expressão indica localização exterior. O artigo definido de ⲡⲉⲓⲱⲧ é preservado, sem harmonizar a frase como “meu Pai”.
- source_word: ⲥⲧⲁϫⲣⲟ
  choice: estar firmemente estabelecida
  rationale: O verbo abrange as ideias de estar firme, forte ou estabelecido. A formulação preserva essa amplitude e evita introduzir explicitamente a imagem de “criar raízes”, que não está no verbo.
- source_word: ⲛⲧⲟⲟⲩ + ⲛⲁ / ⲥⲉⲛⲁⲡⲟⲣⲕⲥ
  choice: será arrancada
  rationale: A terceira pessoa do plural funciona de modo impessoal. A construção passiva é idiomática em português e mantém coerência com “foi plantada”.
- source_word: ⲡⲱⲣⲕ
  choice: arrancar
  rationale: No contexto agrícola, o verbo significa arrancar ou extirpar uma planta. A menção subsequente à raiz torna o sentido inequívoco.
- source_word: ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ
  choice: desde a raiz
  rationale: A preposição pode indicar origem ou separação. “Desde a raiz” preserva essa nuance sem transformar a expressão em “pela raiz” como instrumento ou ponto de apreensão.
- source_word: ⲧⲁⲕⲟ
  choice: perecerá
  rationale: O verbo exprime perecer, arruinar-se ou ser destruído. “Perecerá” conserva o tom sentencioso e solene.
theological_decisions:
- issue: Identidade do Pai
  choice: o Pai
  alternative: meu Pai
  rationale: O copta traz o artigo definido e não contém pronome possessivo. A tradução evita harmonização com Mateus 15:13 e preserva a formulação própria do dito.
- issue: Relação expressa por “fora do Pai”
  choice: manter a expressão espacial sem explicação interpretativa
  alternative: fora da vontade do Pai
  rationale: O texto diz literalmente “fora do Pai”. Acrescentar “vontade”, “domínio” ou outra categoria resolveria uma ambiguidade teológica que o original deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Videira” mantém a especificidade agrícola; “fora do Pai” conserva a formulação incomum do original; e a passiva traduz de modo natural o plural impessoal copta sem identificar agentes inexistentes no texto.
