base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/021.yaml
  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: pt
  text: 'Maria disse a Jesus: “Com quem se parecem os teus discípulos?”


    Ele disse: “Eles se parecem com crianças pequenas que se instalaram num campo que não lhes pertence. Quando os donos do campo vierem, dirão: ‘Deixem o nosso campo para nós.’ Elas se despirão diante deles[a], a fim de deixar-lhes o campo e entregar-lhes o seu campo.


    “Por isso eu digo: se o dono da casa souber que o ladrão vem, ficará vigiando antes que ele chegue e não permitirá que ele cave para entrar na casa do seu reino[b] e leve os seus bens.


    “Vocês, porém, estejam vigilantes diante do mundo. Cinjam-se pela cintura com grande poder, para que os assaltantes não encontrem caminho para chegar até vocês, pois a necessidade que vocês esperam será encontrada[c].


    “Que haja entre vocês uma pessoa de entendimento. Quando o fruto amadureceu, ela veio depressa, com a foice na mão, e o colheu. Quem tem ouvidos para ouvir, ouça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta diz literalmente que elas “ficam nuas” ou “se despem diante deles”. A imagem também aparece em outros ditos de Tomé, mas seu significado não é explicado aqui.
    reason: Esclarecer a expressão literal sem impor uma interpretação teológica.
  - marker: b
    text: Literalmente, “a casa do seu reino”. A construção é incomum e difere dos paralelos de Mateus 24:43 e Lucas 12:39, que mencionam apenas a casa.
    reason: Preservar uma leitura distintiva do manuscrito e assinalar sua sintaxe incomum.
  - marker: c
    text: A palavra copta é um empréstimo do grego χρεία, que pode significar “necessidade”, “dificuldade”, “uso” ou “vantagem”. O sentido exato da frase é incerto.
    reason: Registrar uma ambiguidade lexical relevante que não deve ser resolvida silenciosamente.
lexical_decisions:
- source_word: ϭⲉⲗⲓⲧ / ϭⲟⲓⲗⲉ
  choice: se instalaram
  rationale: Expressa residência ou permanência num lugar sem sugerir propriedade; é natural em português e preserva o contraste com o campo alheio.
- source_word: ⲕⲁⲕⲁϩⲏⲩ
  choice: se despirão
  rationale: O verbo indica ficar nu ou despir-se. A formulação não confunde ⲙⲧⲟ ⲉⲃⲟⲗ, 'diante de', com roupa.
- source_word: ϣⲟϫⲧ
  choice: escave para dentro
  rationale: Preserva a imagem concreta de cavar ou abrir passagem para dentro da casa, sem substituir silenciosamente pela expressão mais geral 'arrombar'.
- source_word: ⲭⲣⲉⲓⲁ
  choice: necessidade
  rationale: O empréstimo grego χρεία pode significar necessidade, dificuldade, uso ou vantagem. 'Necessidade' é um sentido lexical direto, enquanto a nota conserva a incerteza contextual.
- source_word: ⲡⲱϩ
  choice: amadureceu
  rationale: No contexto de fruto, o verbo descreve a chegada à maturidade.
- source_word: ϩⲁⲥ-
  choice: colheu
  rationale: O verbo significa ceifar ou colher; 'colheu' combina naturalmente com 'fruto', mantendo a foice na imagem.
- source_word: ⲣⲱⲙⲉ ⲛⲉⲡⲓⲥⲧⲏⲙⲱⲛ
  choice: uma pessoa de entendimento
  rationale: Reproduz a ideia de alguém entendido, conhecedor ou discernidor sem restringi-la a uma função religiosa.
theological_decisions:
- issue: A nudez das crianças diante dos donos
  choice: se despirão diante deles
  alternative: ficarão nuas diante deles
  rationale: Mantém literalmente a ação e sua possível carga simbólica no Evangelho de Tomé, sem explicar no corpo do texto qual seria seu significado teológico.
- issue: Relação entre casa e reino
  choice: a casa do seu reino
  alternative: a sua casa
  rationale: Preserva o substantivo copta ⲙⲛⲧⲉⲣⲟ, 'reino', e a construção incomum do manuscrito, evitando harmonização com paralelos sinóticos.
- issue: Atitude em relação ao mundo
  choice: estejam vigilantes diante do mundo
  alternative: guardem-se do mundo
  rationale: Conserva a imagem de vigiar perante ou em face do mundo sem transformar a frase numa afirmação doutrinária explícita sobre separação do mundo.
- issue: Identidade da pessoa que colhe
  choice: uma pessoa de entendimento ... ela veio
  alternative: um homem sábio ... ele veio
  rationale: O copta usa o termo genérico 'pessoa/homem'; a tradução evita atribuir identidade cristológica ou função escatológica não explicitada pelo texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “vocês” para legibilidade brasileira e formas verbais não arcaicas. A fala mantém imagens concretas e construções deliberadamente estranhas quando elas pertencem ao texto copta, com notas apenas onde a literalidade ou a ambiguidade exigem esclarecimento.
