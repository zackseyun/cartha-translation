base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: pt
  text: 'Jesus disse: “Quando vocês fizerem dos dois um só, vocês se tornarão filhos do Humano[a]. E, quando disserem: ‘Montanha, mova-se daqui’, ela se moverá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos do Humano” também pode ser traduzido como “crianças do Humano”; o substantivo copta pode ter sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ … ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛ
  choice: quando vocês
  rationale: A construção introduz uma condição temporal de sentido futuro. “Quando vocês” é natural em português e mantém a concisão do copta.
- source_word: ⲉⲓⲣⲉ ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: fizerem dos dois um só
  rationale: Preserva o contraste numérico e a formulação enigmática “os dois/um”, usando uma construção idiomática em português.
- source_word: ⲛϣⲏⲣⲉ
  choice: filhos
  rationale: Mantém o sentido mais formalmente próximo e a formulação marcada de Tomé; a possível leitura coletiva e inclusiva é registrada em nota.
- source_word: ⲛⲡⲣⲱⲙⲉ
  choice: do Humano
  rationale: Reproduz a expressão definida e incomum do texto sem convertê-la silenciosamente na fórmula sinótica “Filho do Homem” nem resolver seu possível valor técnico.
- source_word: ϫⲱⲛⲧⲟⲥ / manuscrito ϫⲟⲟⲥ
  choice: disserem
  rationale: A forma normalizada representa o verbo “dizer” com pronome sufixal que antecipa a fala citada, não um advérbio com o sentido de “em voz alta”.
- source_word: ⲡⲧⲟⲟⲩ
  choice: Montanha
  rationale: O artigo copta pode acompanhar o vocativo; em português, o vocativo sem artigo é mais natural.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ … ⲡⲱⲱⲛⲉ
  choice: mova-se daqui … se moverá
  rationale: “Mover-se” conserva a repetição lexical do copta; “daqui” expressa o elemento direcional ⲉⲃⲟⲗ presente na ordem, mas ausente na oração final.
theological_decisions:
- issue: Sentido de “o Humano”
  choice: Manter a expressão enigmática “do Humano”
  alternative: “do ser humano”, “do Homem” ou assimilação à expressão “Filho do Homem”
  rationale: O texto usa uma expressão definida e potencialmente técnica. A tradução preserva sua estranheza e não impõe uma identificação cristológica ou antropológica específica.
- issue: Referente de “os dois”
  choice: Não explicitar quais são os dois
  alternative: Identificá-los como corpo e espírito, masculino e feminino, interior e exterior ou outra dualidade
  rationale: O dito não fornece aqui o referente; explicitá-lo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A formulação deliberadamente incomum “do Humano” e o enigma de “os dois” foram preservados. O paralelismo verbal de “mover-se” foi mantido, evitando a leitura incorreta “dizer em voz alta”.
