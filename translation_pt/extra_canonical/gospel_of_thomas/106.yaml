review_pass:
  verdict: approve
  source_fidelity: 'A tradução reproduz com precisão a estrutura condicional futura: fazer «os dois» um, tornar-se «filhos do Humano», e dizer à montanha que se mova, com o consequente movimento da montanha. «Disserem» corretamente entende o manuscrito ϫⲟⲟⲥ como «dizer isto/a seguinte fala», e não como «dizer em voz alta». «Daqui» comunica adequadamente o valor direcional de ⲉⲃⲟⲗ.'
  naturalness: O português é moderno, fluente e adequado a leitores brasileiros e internacionais. «Quando vocês fizerem dos dois um só» é uma forma idiomática que preserva o caráter conciso e enigmático do original. O vocativo «Montanha, mova-se daqui» é natural.
  terminology: «Filhos do Humano» preserva deliberadamente a expressão definida e estranha do copta sem a harmonizar com «Filho do Homem» dos Evangelhos sinóticos. A nota registra de modo suficiente a alternativa coletiva «crianças». Não há imposição interpretativa sobre «os dois».
