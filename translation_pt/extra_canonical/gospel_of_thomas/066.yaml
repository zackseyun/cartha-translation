base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: pt
  text: 'Jesus disse: “Mostrem-me esta pedra que os construtores jogaram fora; ela é a pedra angular.”[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em copta, literalmente: “deem-me ver”, isto é, “mostrem-me”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “jogaram-na para fora”; muitas traduções dizem “rejeitaram”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “pedra do canto”.'
    reason: lexical_alternative
  - marker: d
    text: O dito ecoa Salmos 118:22 (117:22 na Septuaginta) e é citado em Marcos 12:10; Mateus 21:42; Lucas 20:17; Atos 4:11; e 1Pedro 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: Mostrem-me
  rationale: A construção copta significa literalmente algo como «deem-me ver»; «mostrem-me» é natural em português e mantém a força do imperativo dirigido a um grupo.
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: esta pedra
  rationale: Preserva o demonstrativo dêitico ⲡⲁⲓ e o caráter incisivo da formulação.
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: jogaram fora
  rationale: Reproduz a imagem concreta do verbo «lançar/jogar para fora», sem substituí-la silenciosamente pelo sentido interpretativo «rejeitaram».
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: os construtores
  rationale: Equivalente português idiomático de «os que constroem» e coerente com a tradição intertextual do dito.
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: a pedra angular
  rationale: Expressão bíblica estabelecida e compreensível em português para a construção literal «pedra do canto», sem definir se se trata de pedra de fundação ou de remate.
theological_decisions:
- issue: Função arquitetônica de ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: pedra angular
  alternative: pedra principal / pedra de esquina
  rationale: O original diz literalmente «pedra do canto» e não especifica sua posição arquitetônica. «Pedra angular» conserva a formulação tradicional sem resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formas naturais no Brasil sem regionalismos marcados. O plural «Mostrem-me» explicita o destinatário coletivo indicado pelos construtores no contexto da frase. Mantém-se a imagem vívida de jogar a pedra fora e a expressão bíblica «pedra angular».
