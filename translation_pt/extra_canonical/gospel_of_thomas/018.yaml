base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: pt
  text: 'Os discípulos disseram a Jesus: “Diga-nos como será o nosso fim.” Jesus disse: “Então vocês encontraram o princípio, enquanto buscam o fim?[a] Pois, no lugar onde está o princípio, ali estará o fim.[b] Feliz é aquele que se mantiver de pé diante dele, no princípio;[c] ele conhecerá o fim e não provará a morte.[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sequência de partículas introduz uma pergunta retórica: “Então vocês encontraram o princípio, enquanto buscam o fim?” «Então» procura transmitir seu tom sem sobrecarregar a frase com a partícula grega gar.'
    reason: lexical_alternative
  - marker: b
    text: O copta diz explicitamente “no lugar onde está o princípio, ali estará o fim”, preservando uma imagem espacial.
    reason: cultural_note
  - marker: c
    text: Literalmente, “aquele que se mantiver de pé diante dele, no princípio”. O pronome “dele” pode referir-se ao princípio ou a um Primeiro/uma Origem subentendida.
    reason: textual_ambiguity
  - marker: d
    text: “Provar a morte” é uma expressão idiomática que significa experimentar a morte.
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ / ϫⲱⲛⲧⲟⲥ ⲉⲣⲟⲛ
  choice: Diga-nos
  rationale: A fórmula imperativa significa literalmente “diga a nós”; “Diga-nos” é direta e natural em português atual.
- source_word: ⲡϩⲁⲏ
  choice: fim
  rationale: O termo pode indicar fim, extremidade ou conclusão; “fim” conserva o contraste conciso com “princípio”.
- source_word: ⲡⲁⲣⲭⲏ
  choice: princípio
  rationale: Empréstimo do grego ἀρχή, com os sentidos de princípio ou origem. “Princípio” mantém a oposição reiterada a “fim”.
- source_word: ϭⲱⲗⲡ
  choice: encontraram
  rationale: O verbo admite “encontrar” ou “descobrir”. “Encontraram” preserva a formulação simples da pergunta retórica.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: procurando o fim
  rationale: A construção significa procurar ou buscar. A forma progressiva portuguesa liga naturalmente a busca à pergunta anterior sem acrescentar uma interpretação.
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  choice: no lugar onde … ali …
  rationale: Mantém tanto o substantivo locativo explícito “lugar” quanto a correlação espacial do copta.
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Feliz
  rationale: Traduz o empréstimo grego μακάριος em linguagem corrente e digna; “bem-aventurado” seria uma alternativa mais tradicional.
- source_word: ⲁⲱϩⲉ / ϩⲱϩⲉ
  choice: se mantiver de pé
  rationale: Expressa o sentido de estar ou tomar posição de pé e funciona naturalmente com o complemento “diante dele”.
- source_word: ⲉⲣⲁⲧϥ ϩⲛ ⲡⲁⲣⲭⲏ
  choice: diante dele, no princípio
  rationale: Conserva a expressão relacional e o pronome masculino singular do manuscrito, sem apagar a incerteza quanto ao antecedente.
- source_word: ⲥⲟⲟⲩⲛ
  choice: conhecerá
  rationale: É o equivalente direto do verbo “conhecer”; preserva a formulação compacta “conhecerá o fim”.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: não provará a morte
  rationale: Preserva o conhecido idioma copta para experimentar a morte, em vez de substituir sua imagem por uma paráfrase.
- source_word: ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ
  choice: Então vocês já …?
  rationale: “Então” comunica o tom incisivo da pergunta retórica, enquanto “já” torna natural em português a pressuposição de terem encontrado o princípio.
theological_decisions:
- issue: Referente de “dele” em “diante dele”
  choice: Manter o pronome sem identificar seu referente
  alternative: Reduzir a expressão a “no princípio” ou explicitar “diante do Princípio/da Origem”
  rationale: O sufixo masculino singular pode retomar “o princípio” gramaticalmente ou apontar para um Primeiro/uma Origem personificada. A tradução preserva essa tensão em vez de impor uma leitura metafísica.
- issue: Sentido de “fim” e “morte”
  choice: Conservar os termos concretos e não explicar sua relação
  alternative: Interpretar “fim” como consumação escatológica e “morte” como morte espiritual ou física
  rationale: O dito não especifica a natureza do fim nem da morte. Explicitar uma dessas leituras importaria uma conclusão teológica ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para o plural, “Diga-nos” como imperativo corrente e “Feliz” em vez do mais arcaizante “bem-aventurado”. A cadência paralela entre “princípio” e “fim” e a imagem “provar a morte” foram preservadas.
