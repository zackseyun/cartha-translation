    issue: Formulação pouco natural e potencialmente direcional em «para estarem procurando o fim»
    rationale: 'A construção portuguesa com «para» tende a indicar propósito. No contexto, a pergunta é retórica: terem encontrado o princípio é posto em contraste com sua busca pelo fim. «enquanto buscam o fim» exprime essa relação com naturalidade, sem atribuir uma finalidade não expressa.'
