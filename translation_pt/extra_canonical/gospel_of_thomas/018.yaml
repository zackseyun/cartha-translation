revisions:
- from: 'Os discípulos disseram a Jesus: “Diga-nos como será o nosso fim.” Ele respondeu: “Então vocês já encontraram o princípio, para estarem procurando o fim?[a] Pois, no lugar onde está o princípio, ali estará o fim.[b] Feliz aquele que se mantiver de pé diante dele, no princípio;[c] ele conhecerá o fim e não provará a morte.”[d]'
  to: 'Os discípulos disseram a Jesus: “Diga-nos como será o nosso fim.” Jesus disse: “Então vocês encontraram o princípio, enquanto buscam o fim?[a] Pois, no lugar onde está o princípio, ali estará o fim.[b] Feliz é aquele que se mantiver de pé diante dele, no princípio;[c] ele conhecerá o fim e não provará a morte.[d]”'
  rationale: A revisão troca uma construção portuguesa pesada e possivelmente final («para estarem procurando») por «enquanto buscam», que retém a tensão retórica entre encontrar o princípio e buscar o fim. Também regulariza a oração «Feliz é aquele que». As demais escolhas são mantidas, inclusive a ambiguidade do pronome e os quatro vínculos de notas.
