base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: pt
  text: '**Evangelho de Tomé — Dito 99**


    Um discípulo lhe disse: “Seus irmãos e sua mãe estão de pé lá fora.”[a]


    Ele lhes disse: “Os que estão aqui[b] e fazem a vontade[c] de meu Pai — estes são meus irmãos e minha mãe.[d] São eles que entrarão[e] no reino de meu Pai.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O manuscrito traz uma construção mais extensa, aproximadamente: “estão de pé diante deles, do lado de fora”. A referência a “diante deles” é difícil e pode ser redundante; por isso, o texto principal conserva “estão de pé lá fora”.'
    reason: textual_dialect_note
  - marker: b
    text: “Os que estão aqui” traduz uma expressão que significa literalmente “os deste lugar” ou “os que estão neste lugar”.
    reason: lexical_alternative
  - marker: c
    text: A palavra copta também pode significar “desejo” ou “querer”, além de “vontade”.
    reason: lexical_alternative
  - marker: d
    text: Compare a declaração sobre a família de Jesus em Marcos 3:31–35; Mateus 12:46–50; Lucas 8:19–21.
    reason: cross_reference
  - marker: e
    text: “Entrarão” traduz literalmente uma expressão de movimento, “irão para dentro”; “irão entrar” também seria possível.
    reason: lexical_alternative
  - marker: f
    text: “Reino” traduz um substantivo abstrato derivado da palavra “rei” e também pode carregar a ideia de “reinado” ou “domínio”. Este dito acrescenta que essas pessoas entrarão no reino do Pai, afirmação que não aparece nessa forma nos paralelos sinóticos.
    reason: cultural_cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: irmãos
  rationale: Em copta saídico, o termo normalmente designa irmãos do sexo masculino, embora em certos contextos possa abranger irmãos e irmãs. “Irmãos” preserva a forma do testemunho e a linguagem de parentesco.
- source_word: ⲙⲁⲁⲩ
  choice: mãe
  rationale: Equivalente direto e corrente do termo copta para “mãe”.
- source_word: ⲁϩⲉⲣⲁⲧⲟⲩ … ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: estão lá fora
  rationale: A expressão descreve uma posição presente no exterior. “Estão lá fora” é natural em português e mantém tanto o estado quanto a localização.
- source_word: ⲡⲉⲓⲙⲁ
  choice: aqui
  rationale: É uma expressão dêitica, literalmente “este lugar”. “Aqui” conserva a referência à presença imediata sem tornar a frase pesada.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  choice: fazem a vontade
  rationale: A construção significa cumprir ou fazer a vontade, o desejo ou o querer de alguém. “Fazer a vontade” é idiomático e mantém o sentido teológico sem ampliá-lo.
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: meu Pai
  rationale: Preserva o possessivo de primeira pessoa e a designação paterna do texto, sem generalização interpretativa.
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: entrarão
  rationale: A combinação verbal expressa movimento para dentro; “entrar” é uma equivalência portuguesa concisa e exata.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: reino
  rationale: O substantivo abstrato formado a partir de “rei” pode indicar reino, reinado ou domínio. “Reino” conserva o equivalente tradicional e se ajusta à construção “entrar no”.
theological_decisions:
- issue: Identificação da família de Jesus com os que fazem a vontade do Pai
  choice: Manter literalmente “meus irmãos e minha mãe”
  alternative: Explicitar “minha verdadeira família”
  rationale: O texto cria a identificação por metáfora de parentesco, mas não usa o adjetivo “verdadeira”. A tradução preserva a tensão entre parentesco biológico e parentesco definido pela vontade do Pai.
- issue: Relação entre fazer a vontade do Pai e entrar no reino
  choice: Conservar as duas afirmações em sequência, sem indicar mecanismo causal
  alternative: Traduzir como “por isso entrarão” ou “assim poderão entrar”
  rationale: O copta associa o mesmo grupo às duas afirmações, mas não inclui um conector causal explícito. A tradução não transforma a justaposição em uma doutrina causal definida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “lhe/lhes” na narração, “meu Pai” para preservar a forma relacional do original e “lá fora” como expressão natural. A pontuação separa as falas e o travessão interno destaca a identificação enfática sem acrescentar relação causal.
