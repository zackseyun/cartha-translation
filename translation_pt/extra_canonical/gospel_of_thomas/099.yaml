    issue: 'O sujeito da primeira fala foi traduzido no plural: «Os discípulos».'
    rationale: O texto copta traz o substantivo definido singular ⲡⲙⲁⲑⲏⲧⲏⲥ, «o discípulo». A tradução deve preservar o singular.
  - severity: low
    issue: «Estão lá fora» omite «estão de pé».
    rationale: O verbo copta descreve a posição de estar de pé. Embora a localização exterior esteja corretamente expressa, «estão de pé lá fora» oferece uma equivalência mais completa e continua natural.
