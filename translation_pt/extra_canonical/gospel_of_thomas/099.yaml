review_pass:
  verdict: revise
  source_fidelity: O sujeito da primeira fala está no singular no copta (ⲡⲙⲁⲑⲏⲧⲏⲥ, «o discípulo»), enquanto o rascunho diz «Os discípulos». Isso altera um dado explícito do texto-fonte. A revisão restaura o singular e também explicita «estão de pé», correspondente ao predicado copta, sem deixar de tratar em nota a construção adicional e difícil «diante deles». O restante transmite adequadamente o dêitico «aqui», a vontade do Pai, a identificação familiar e a entrada no reino do Pai.
  naturalness: «Um discípulo lhe disse» e «estão de pé lá fora» são formulações naturais, claras e adequadas ao português moderno de ampla compreensão. Mantêm um registro sóbrio e legível.
  terminology: «Irmãos», «mãe», «vontade», «meu Pai», «entrarão» e «reino» são escolhas fiéis e idiomáticas. Não é necessário explicitar uma relação causal entre fazer a vontade e entrar no reino.
  issues:
