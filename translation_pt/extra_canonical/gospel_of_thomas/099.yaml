  to: '**Evangelho de Tomé — Dito 99**


    Um discípulo lhe disse: “Seus irmãos e sua mãe estão de pé lá fora.”[a]


    Ele lhes disse: “Os que estão aqui[b] e fazem a vontade[c] de meu Pai — estes são meus irmãos e minha mãe.[d] São eles que entrarão[e] no reino de meu Pai.”[f]'
  rationale: A correção necessária é restaurar o sujeito singular da fala inicial, conforme o copta. Foi também incluído «de pé» para representar o verbo de posição do original. As notas permanecem ancoradas aos trechos pertinentes e preservam a dificuldade da expressão manuscrita sem resolver especulativamente sua ambiguidade.
