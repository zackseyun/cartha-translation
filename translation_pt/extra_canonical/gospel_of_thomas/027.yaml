base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: pt
  text: Se não jejuarem o mundo[a], não encontrarão o reino[b]; e, se não fizerem do sábado um sábado[c], não verão o Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão literalmente trata “o mundo” como objeto do verbo “jejuar”. O copta e o testemunho grego apoiam essa construção incomum; traduções como “jejuar do mundo” ou “abster-se do mundo” já interpretam a metáfora.
    reason: lexical_alternative
  - marker: b
    text: O testemunho grego POxy 1 traz “o reino de Deus”; o texto copta de Nag Hammadi diz apenas “o reino”.
    reason: textual_variant
  - marker: c
    text: “Fazer do sábado um sábado” preserva a repetição compacta do original. A frase pode sugerir deixar que o sábado seja verdadeiramente aquilo que é, isto é, observá-lo como tal, mas o texto não explicita essa interpretação.
    reason: cultural_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ … ⲧⲙ-
  choice: se não
  rationale: A construção introduz uma condição de realização futura ou geral; “se” preserva a forma condicional e a concisão do dito.
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: jejuarem o mundo
  rationale: O verbo de origem grega significa “jejuar”, e ⲉ- introduz aqui seu objeto direto, em consonância com o acusativo do testemunho grego. A construção transitiva deliberadamente incomum é preservada, sem normalizá-la como “jejuar do mundo” ou “em relação ao mundo”.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: o mundo
  rationale: “Mundo” é a equivalência corrente e inteligível para o empréstimo grego κόσμος, sem a tecnicidade de “cosmos”.
- source_word: ⲁϩⲉ
  choice: encontrarão
  rationale: Expressa diretamente a ideia de achar ou encontrar, mantendo o estilo simples do dito.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: o reino
  rationale: O substantivo pode designar reino, reinado ou realeza; “reino” é a forma bíblica corrente e não acrescenta um complemento ausente no copta.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: fizerem do sábado um sábado
  rationale: Reproduz a construção predicativa e a repetição enfática do original, ao mesmo tempo que permanece gramatical em português.
- source_word: ⲛⲁⲩ
  choice: verão
  rationale: Equivalente simples e direto, apropriado ao paralelismo com “encontrarão”.
- source_word: ⲡⲉⲓⲱⲧ
  choice: o Pai
  rationale: O artigo definido e o contexto favorecem o uso titular; a inicial maiúscula sinaliza esse uso sem ampliar o conteúdo.
theological_decisions:
- issue: Sentido de “jejuar o mundo”
  choice: Manter a formulação transitiva e ambígua
  alternative: Interpretar como “abster-se do mundo” ou “jejuar em relação ao mundo”
  rationale: O copta e o testemunho grego sustentam “o mundo” como objeto do verbo. Explicitar uma prática ascética específica resolveria uma metáfora que o texto deixa aberta.
- issue: Designação do reino
  choice: “o reino”
  alternative: “o reino de Deus”
  rationale: O texto copta de Nag Hammadi não contém o complemento “de Deus”; ele não deve ser importado do testemunho grego, embora a variante seja registrada em nota.
- issue: Sentido da frase sobre o sábado
  choice: Preservar “fazer do sábado um sábado”
  alternative: Traduzir interpretativamente como “guardar verdadeiramente o sábado”
  rationale: A formulação comprimida pode sugerir observância autêntica, mas o texto não define em que ela consiste; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com sujeito plural implícito para funcionar naturalmente tanto no uso brasileiro quanto no português internacional. Mantém-se a estranheza deliberada de “jejuarem o mundo” e a repetição de “sábado”, evitando paráfrases doutrinárias.
