review_pass:
  verdict: approve
  source_fidelity: A tradução reproduz com precisão as duas condicionais negativas e seus futuros apodóticos. «Jejuarem o mundo» preserva de modo deliberadamente incomum o mundo como objeto de «jejuar», conforme a construção copta e o apoio do acusativo no testemunho grego. «Não encontrarão o reino» não acrescenta «de Deus», ausente do copta. «Fizerem do sábado um sábado» conserva adequadamente a construção predicativa repetitiva, sem antecipar uma interpretação de observância. «Não verão o Pai» é direto e fiel.
  naturalness: O português é moderno, claro e adequadamente conciso. A transitividade incomum de «jejuar o mundo» soa marcada em português, mas essa marcação é intencional, está bem sinalizada em nota e é preferível a uma normalização interpretativa. A formulação «fazer do sábado um sábado» é idiomática o suficiente para transmitir a compressão do original.
  terminology: «Mundo», «reino», «sábado» e «Pai» são escolhas estáveis, compreensíveis e proporcionais ao registro do dito. A maiúscula em «Pai» comunica o uso titular sem inserir conteúdo doutrinário. As notas distinguem de forma apropriada a variante grega «reino de Deus» e o sentido não explicitado da expressão sobre o sábado.
