base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: pt
  text: 'Jesus disse: “Aquele que vier a conhecer o pai e a mãe, a esse chamarão ‘filho de uma prostituta’.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que vier a conhecer o pai e a mãe, a esse darão o nome de ‘filho de uma prostituta’.” O verbo também pode significar “dar nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲟⲟⲩⲛ
  choice: aquele que vier a conhecer
  rationale: A construção é um futuro relativo. “Vier a conhecer” preserva a nuance prospectiva sem reduzi-la ao presente atemporal “conhece”.
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ ⲡⲙⲁⲁⲩ
  choice: o pai e a mãe
  rationale: Mantém os artigos definidos e evita maiúsculas interpretativas que identificariam necessariamente essas figuras como títulos divinos.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ
  choice: a esse chamarão
  rationale: Conserva o sujeito plural indefinido do copta e dá expressão natural, em português, ao pronome enfático referente ao homem.
- source_word: ⲡϣⲏⲣⲉ
  choice: filho
  rationale: Embora o termo também possa significar “criança”, o artigo masculino e a fórmula de filiação favorecem “filho”.
- source_word: ⲡⲟⲣⲛⲏ
  choice: uma prostituta
  rationale: O ⲡ inicial pertence ao empréstimo grego ⲡⲟⲣⲛⲏ, não é artigo definido copta. Portanto, o substantivo está sem artigo e recebe leitura indefinida natural em português. “Prostituta” é preciso e evita linguagem insultuosa mais carregada.
theological_decisions:
- issue: Identidade de “o pai e a mãe”
  choice: minúsculas e sem explicação no texto
  alternative: “o Pai e a Mãe”, como títulos teológicos
  rationale: O copta não determina por si só uma identificação teológica específica; a tradução preserva essa abertura interpretativa.
- issue: Força do epíteto final
  choice: “filho de uma prostituta”
  alternative: “filho da prostituta”
  rationale: A forma copta não traz artigo definido antes do empréstimo ⲡⲟⲣⲛⲏ; a tradução indefinida evita uma leitura morfologicamente incorreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem “a esse chamarão” mantém a ênfase pronominal do copta sem soar excessivamente arcaica. O único marcador de nota, [a], aparece no texto principal.
