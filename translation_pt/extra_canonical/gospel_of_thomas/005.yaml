base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: pt
  text: 'Jesus disse: “Conheça o que está diante do seu rosto[a], e o que está oculto de você lhe será desvendado[c]. Pois nada há de oculto que não venha a se manifestar[d].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diante do seu rosto” traduz literalmente a expressão copta (ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ), cujo sentido é “bem diante de você”.
    reason: cultural_note
  - marker: b
    text: 'O Papiro de Oxirrinco 654 acrescenta: “e nada enterrado que não seja levantado”. O texto copta de Nag Hammadi não contém essa oração adicional; esta tradução segue o copta.'
    reason: textual_variant
  - marker: c
    text: O verbo ϭⲱⲗⲡ significa literalmente “descobrir”, isto é, retirar uma cobertura; também pode ser traduzido por “revelar” ou “dar a conhecer”.
    reason: lexical_alternative
  - marker: d
    text: A expressão ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ significa “manifestar-se”, “aparecer” ou “vir à luz” nesta construção, e não “viver”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: Conheça
  rationale: Mantém a força direta do imperativo e a concisão sentenciosa do copta, sem ampliar para “compreenda” ou “reconheça”.
- source_word: ⲡⲉⲧⲉⲣⲉ ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ
  choice: o que está diante do seu rosto
  rationale: Preserva a imagem concreta e a formulação idiomática do copta; a nota esclarece o sentido espacial de “bem diante de você”.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: o que está oculto de você
  rationale: Reproduz de modo conciso o sentido de algo escondido ou encoberto em relação ao destinatário, sem especificar quem o ocultou.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: lhe será desvendado
  rationale: “Desvendar” conserva a metáfora de retirar uma cobertura e soa natural em português; “lhe” representa explicitamente o destinatário.
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: Pois nada há
  rationale: Expressa naturalmente a negação universal do copta e preserva o nexo explicativo introduzido por “pois”.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: venha a se manifestar
  rationale: Traduz o sentido de aparecer ou tornar-se manifesto, evitando tanto o falso sentido de “viver” quanto uma harmonização lexical desnecessária com a oração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção literal “diante do seu rosto” conserva a imagem do original e é explicada em nota. O tempo introdutório “disse” segue a forma narrativa copta, enquanto a fala mantém cadência breve e proverbial.
