base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: pt
  text: 'E ele disse: “O ser humano[a] é semelhante a um pescador sábio que lançou sua rede ao mar. Ele a puxou do mar, cheia de peixes pequenos. Entre eles, o pescador sábio encontrou[b] um peixe grande e bom. Jogou todos os peixes pequenos de volta ao mar[c] e escolheu o peixe grande sem dificuldade. Quem tem ouvidos para ouvir, ouça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta traz literalmente “o homem”, empregado aqui em sentido genérico; também se pode traduzir “a pessoa”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “caiu sobre” ou “deparou com”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para baixo, ao mar”. O manuscrito tem aqui uma pequena lacuna em ⲉ[ⲡⲉ]ⲥⲏⲧ (“para baixo”), cuja restauração é segura.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: o ser humano
  rationale: O artigo definido tem sentido genérico neste contexto. “O ser humano” preserva esse alcance sem restringir a referência a um homem específico.
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: pescador sábio
  rationale: ⲟⲩⲱϩⲉ designa um pescador, e ⲣⲙⲛϩⲏⲧ, literalmente alguém “de coração/mente”, tem aqui o sentido de sábio ou sensato.
- source_word: ⲁⲃⲱ
  choice: rede
  rationale: É o termo comum para uma rede, e o possessivo copta exige “sua rede”.
- source_word: ϩⲉ ⲉ-
  choice: encontrou
  rationale: A expressão significa literalmente “cair sobre”, mas idiomaticamente quer dizer encontrar ou deparar com.
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: bom
  rationale: O predicado descreve o peixe como bom ou de boa qualidade; “bom” mantém a formulação simples e não acrescenta a ideia específica de valor monetário.
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: sem dificuldade
  rationale: A expressão combina o grego χωρὶς, “sem”, com o copta ϩⲓⲥⲉ, “trabalho, esforço, dificuldade”.
theological_decisions:
- issue: Relação com a parábola da rede em Mateus 13:47–48
  choice: Manter o foco próprio deste dito no único peixe grande escolhido pelo pescador sábio.
  alternative: Harmonizar o texto com a separação entre peixes bons e ruins em Mateus.
  rationale: O copta não contrapõe peixes bons e ruins nem menciona o fim dos tempos. A tradução preserva a forma e a tensão particulares deste dito sem importar elementos da versão de Mateus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi levemente reorganizada para fluidez, sem alterar os participantes nem a sequência narrativa. “Quem tem ouvidos para ouvir, ouça” conserva a fórmula proverbial e sua força exortativa.
