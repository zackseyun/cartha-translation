  source_fidelity: 'A tradução preserva os elementos narrativos do copta: o Reino do Pai, a mulher que leva um recipiente cheio de farinha, a distância não especificada, a ruptura da alça, a farinha que se esvazia atrás dela pelo caminho, sua falta de percepção do problema e o recipiente vazio ao chegar em casa. Não introduz interpretação alegórica.'
