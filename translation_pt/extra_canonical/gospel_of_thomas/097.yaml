base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: pt
  text: 'Jesus disse: “O Reino do Pai é semelhante a uma mulher que carregava um cântaro cheio de farinha. Enquanto caminhava pela estrada, ainda longe, a alça[a] do cântaro se rompeu, e a farinha foi se derramando atrás dela pela estrada. Ela não sabia disso; não havia percebido o problema.[b] Quando chegou à sua casa, pôs o cântaro no chão e viu que estava vazio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “orelha”.
    reason: Registra a imagem lexical do copta, que usa “orelha” também no sentido de alça de recipiente.
  - marker: b
    text: 'Ou: “a dificuldade”, “o contratempo”.'
    reason: O termo copta tem sentido amplo, incluindo dificuldade, aflição, trabalho penoso ou problema.
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: cântaro
  rationale: Designa um recipiente como jarro ou cântaro; “cântaro” é natural no registro de parábola e permite entender a alça mencionada a seguir.
- source_word: ⲛⲟⲉⲓⲧ
  choice: farinha
  rationale: O termo significa farinha ou cereal moído; “farinha” comunica com clareza o conteúdo fino que se derrama sem ser percebido.
- source_word: ⲙⲁⲁϫⲉ
  choice: alça
  rationale: Literalmente “orelha”, mas aplicado ao cântaro designa sua alça; a imagem literal é preservada em nota.
- source_word: ⲟⲩⲱϭⲡ
  choice: se rompeu
  rationale: Expressa o ato de quebrar-se; “se rompeu” combina naturalmente com a alça de um recipiente.
- source_word: ϣⲟⲩⲟ
  choice: foi se derramando
  rationale: O verbo pode indicar esvaziar-se ou derramar-se; a construção progressiva retrata a farinha saindo ao longo do caminho.
- source_word: ϩⲓⲥⲉ
  choice: problema
  rationale: O campo semântico inclui dificuldade, aflição e penosidade; no contexto, refere-se ao contratempo ocorrido com o cântaro.
- source_word: ⲟⲩⲉ
  choice: ainda longe
  rationale: Preserva a cláusula circunstancial de distância presente no copta sem especificar um destino que o texto não nomeia nesse ponto.
theological_decisions:
- issue: Tradução de ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: O Reino do Pai
  alternative: O Reino de Deus / o Reino dos céus
  rationale: Mantém a formulação específica do testemunho copta, sem harmonizá-la com expressões de outros evangelhos.
- issue: Sentido da parábola
  choice: Não explicitar uma interpretação alegórica
  alternative: Identificar a farinha perdida ou o cântaro vazio com uma realidade teológica específica
  rationale: O dito apresenta somente a comparação e deixa sua força interpretativa em aberto; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cântaro” conserva o ambiente proverbial sem tornar a frase obscura; a sintaxe narrativa permanece simples. Todos os marcadores de nota aparecem no texto principal.
