base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: pt
  text: 'Jesus disse: “Quem blasfemar contra o Pai será perdoado, e quem blasfemar contra o Filho será perdoado. Mas quem blasfemar contra o Espírito Santo não será perdoado, nem na terra nem no céu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  choice: blasfemar
  rationale: O verbo copta significa ‘blasfemar’ ou ‘amaldiçoar’. ‘Blasfemar contra’ preserva o sentido religioso específico e corresponde naturalmente à construção com o Pai, o Filho e o Espírito Santo.
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: será perdoado
  rationale: Embora o copta empregue literalmente a terceira pessoa do plural ativa (‘eles o perdoarão’), essa construção funciona como uma forma impessoal/passiva. A voz passiva é a expressão portuguesa mais natural e fiel.
- source_word: ⲡⲕⲁϩ
  choice: terra
  rationale: Na oposição cósmica com o céu, ‘terra’ é a equivalência direta e natural.
- source_word: ⲧⲡⲉ
  choice: céu
  rationale: ‘Céu’ preserva o singular do copta e forma a oposição espacial ‘terra/céu’.
theological_decisions:
- issue: Estrutura espacial em contraste com possível formulação temporal dos paralelos sinóticos
  choice: nem na terra nem no céu
  alternative: nem neste mundo nem no mundo por vir
  rationale: O texto copta traz explicitamente ‘terra’ e ‘céu’. A tradução conserva essa formulação espacial sem substituí-la pela linguagem temporal de um texto paralelo nem atribuir ao enunciado uma teologia além do que ele expressa.
- issue: Agente do perdão não expresso
  choice: será perdoado
  alternative: eles o perdoarão
  rationale: A formulação passiva preserva a indeterminação do agente presente na construção impessoal copta e evita identificá-lo explicitamente com Deus ou com qualquer outro agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de ‘blasfemar’ e ‘será perdoado’ foi mantida para refletir o paralelismo enfático do original. Não se acrescentaram notas, pois as particularidades gramaticais podem ser representadas com clareza no próprio texto sem sobrecarregar a leitura.
