base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: pt
  text: 'Seu discípulo disse: “Mostra-nos o lugar onde estás, pois precisamos buscá-lo.” Ele lhes disse: “Quem tem ouvidos, ouça.[a] Há luz dentro de um homem de luz,[b] e ele ilumina o mundo inteiro.[c] Quando ele não brilha, há escuridão.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quem tem ouvidos consigo”. Trata-se de uma fórmula idiomática de exortação a ouvir.
    reason: idioma_copta
  - marker: b
    text: 'O copta afirma: “Há luz dentro de um homem de luz”. O fragmento grego lê de forma condicional: “Se houver luz num homem de luz...”. “Homem de luz” também poderia ser traduzido como “pessoa luminosa”.'
    reason: variante_textual_e_alternativa_lexical
  - marker: c
    text: 'No copta, o homem é o sujeito: “ele ilumina o mundo inteiro”. No fragmento grego, a luz é o sujeito: “ela brilha”.'
    reason: variante_textual
  - marker: d
    text: 'O copta diz: “Quando ele não brilha, há escuridão”. A reconstrução do grego diz: “Se ela não existir, o mundo estará em escuridão”.'
    reason: variante_textual
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: Mostra-nos
  rationale: O causativo tem o sentido de fazer saber ou ensinar; no contexto de indicar um lugar, “mostrar” é natural e preciso.
- source_word: ⲧⲟⲡⲟⲥ
  choice: lugar
  rationale: Preserva o sentido concreto do empréstimo grego τόπος e a concisão do dito.
- source_word: ⲡⲉⲓⲡⲁⲛⲁⲅⲕⲏ ⲉⲁⲛⲟⲛ ⲡⲉ
  choice: precisamos
  rationale: Expressa de modo corrente a construção impessoal de necessidade sem enfraquecer sua força.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲛⲧⲟϥ
  choice: buscá-lo
  rationale: Verte diretamente a ideia de procurar ou buscar o lugar mencionado.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ
  choice: Quem tem ouvidos
  rationale: Reproduz em português corrente a fórmula idiomática copta, deixando a expressão literal para a nota.
- source_word: ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  choice: ouça
  rationale: O subjuntivo exortativo português comunica com concisão a força jussiva da construção copta.
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ
  choice: Há luz
  rationale: Representa naturalmente a construção existencial copta e evita impor uma individuação não exigida pelo texto.
- source_word: ⲙ̄ⲫⲟⲩⲛ ⲛ̄ⲛⲟⲩⲣ̄ⲙ̄ⲟⲩⲟⲉⲓⲛ
  choice: dentro de um homem de luz
  rationale: “Dentro de” mantém a imagem espacial; “homem de luz” conserva a construção distintiva e algo enigmática do texto.
- source_word: ϥⲣ̄ⲟⲩⲟⲉⲓⲛ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: ele ilumina o mundo inteiro
  rationale: Mantém a pessoa como sujeito do verbo, conforme o copta, e traduz ⲕⲟⲥⲙⲟⲥ pelo equivalente português usual.
- source_word: ⲉϥⲧⲙ̄ⲣ̄ⲟⲩⲟⲉⲓⲛ ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: Quando ele não ilumina, há escuridão
  rationale: Preserva o sujeito pessoal e a relação circunstancial do copta sem especificar indevidamente onde está a escuridão.
theological_decisions:
- issue: Identidade do sujeito que ilumina
  choice: “ele ilumina”, referindo-se ao homem de luz
  alternative: “ela brilha”, referindo-se à luz
  rationale: O manuscrito copta apresenta a pessoa como sujeito; a leitura alternativa pertence ao fragmento grego e é registrada em nota.
- issue: Natureza do “homem de luz”
  choice: manter a expressão metafórica sem explicação doutrinária
  alternative: “pessoa luminosa” ou uma interpretação espiritual explícita
  rationale: A construção é deliberadamente sugestiva; explicá-la no corpo do texto eliminaria sua ambiguidade e poderia importar uma leitura sectária.
- issue: Caráter da afirmação sobre a luz
  choice: 'afirmação existencial: “Há luz”'
  alternative: 'condição: “Se houver luz”'
  rationale: O copta é declarativo; a forma condicional é testemunhada pelo fragmento grego e deve permanecer como variante textual.
translation_notes:
  register: Português moderno, digno e acessível, com colocação pronominal natural e leitura ampla no Brasil e em outros contextos lusófonos. A sintaxe concisa conserva o caráter aforístico do Evangelho de Tomé. As notas distinguem cuidadosamente o testemunho copta do fragmento grego.
