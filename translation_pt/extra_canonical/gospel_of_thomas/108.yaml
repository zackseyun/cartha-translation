base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: pt
  text: 'Jesus disse: “Quem beber da minha boca se tornará como eu. Eu mesmo me tornarei ele,[a] e o que está oculto se manifestará a ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “eu mesmo me tornarei ele”. A construção copta, com pronome enfático e uma formulação copular compacta, expressa uma forte reciprocidade entre Jesus e quem bebe de sua boca, sem explicar a natureza dessa identificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: Quem beber
  rationale: A construção relativa com futuro tem valor geral e indefinido; “quem beber” expressa isso naturalmente em português.
- source_word: ⲥⲱ ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: beber da minha boca
  rationale: Preserva a imagem concreta e incomum do copta, em que ⲉⲃⲟⲗ ϩⲛ indica a fonte. Não se explicita “minhas palavras”, embora a boca possa representar o ensino ou a fala.
- source_word: ϣⲱⲡⲉ ⲛⲧⲁϩⲉ
  choice: se tornará como eu
  rationale: O manuscrito traz o idioma ⲛ̄ⲧⲁϩⲉ, literalmente “à minha maneira”, portanto “como eu”, e não o substantivo “meu igual”.
- source_word: ⲁⲛⲟⲕ ϩⲱⲱ ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  choice: Eu mesmo me tornarei essa pessoa
  rationale: “Eu mesmo” conserva a ênfase de ϩⲱⲱ. “Essa pessoa” comunica a referência recíproca do pronome sem recorrer ao português pouco natural “tornar-me-ei ele”.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ
  choice: o que está oculto
  rationale: A relativa substantivada é genericamente singular/coletiva; “o que está oculto” mantém essa abertura melhor do que impor um plural.
- source_word: ⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: se manifestará a ela
  rationale: ⲟⲩⲱⲛϩ significa aparecer ou tornar-se manifesto, e ⲉⲛⲧⲟϥ indica a pessoa a quem isso se manifesta.
theological_decisions:
- issue: Reciprocidade entre Jesus e quem bebe de sua boca
  choice: 'Preservar a formulação forte: “Eu mesmo me tornarei essa pessoa”'
  alternative: Parafrasear como união, identificação espiritual ou habitação
  rationale: O texto afirma uma reciprocidade surpreendente, mas não explica sua natureza; a tradução não deve resolver essa tensão segundo uma doutrina específica.
- issue: Sentido da imagem de beber da boca de Jesus
  choice: Manter literalmente a imagem
  alternative: “Quem absorver minhas palavras” ou “quem receber meu ensino”
  rationale: A boca pode funcionar metonimicamente para fala ou ensino, mas o texto conserva uma imagem mais concreta, cujo alcance interpretativo deve permanecer aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem incomum “beber da minha boca” e evita-se linguagem confessional. Emprega-se “essa pessoa” e depois “ela” para manter a referência genérica sem o português rígido “ele”.
