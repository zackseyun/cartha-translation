base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: pt
  text: 'Jesus disse: “Venham a mim, pois o meu jugo é bom[a], e o meu senhorio é brando[b]; e vocês encontrarão descanso para si mesmos.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra é ⲭⲣⲏⲥⲧⲟⲥ, tomada do grego χρηστός, “bom”, “agradável” ou “benigno”, e não ⲭⲣⲓⲥⲧⲟⲥ, “Cristo”. Portanto, trata-se de uma qualidade do jugo, não de um título.
    reason: lexical_alternative
  - marker: b
    text: Compare Mateus 11:28–30. Aqui, porém, Tomé diz “meu senhorio é brando”, uma formulação diferente da de Mateus.
    reason: cross_reference
  - marker: c
    text: “Descanso” traduz o empréstimo grego ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις). O códice apresenta pequena incerteza ortográfica na escrita do termo, mas a leitura é segura. O texto diz “para si mesmos”, não “para as suas almas”.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: Venham a mim
  rationale: O imperativo está na segunda pessoa do plural, e ϣⲁⲁⲛⲟⲕ indica a direção ou o destino, “a mim”. “Venham” expressa naturalmente em português tanto o imperativo quanto a pluralidade.
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: bom
  rationale: O termo, tomado do grego χρηστός, significa “bom”, “agradável” ou “benigno”. “Bom” preserva o sentido central sem confundi-lo com ⲭⲣⲓⲥⲧⲟⲥ, “Cristo”, nem importar a formulação “suave” de uma tradição paralela.
- source_word: ⲛⲁϩⲃ
  choice: jugo
  rationale: É o equivalente direto do objeto agrícola usado também em sentido metafórico; “jugo” mantém a imagem do texto.
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: senhorio
  rationale: O substantivo abstrato deriva de “senhor” ou “mestre”. “Senhorio” conserva a ideia de condição, autoridade ou governo de um senhor, sem reduzi-la apenas a “domínio” ou “poder”.
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: brando
  rationale: O termo qualifica o senhorio como manso, brando ou gentil. “Brando” é natural com “senhorio” e preserva a ideia de uma autoridade não áspera.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: vocês encontrarão
  rationale: A construção é futura e tem sujeito na segunda pessoa do plural. “Vocês encontrarão” é claro e amplamente compreensível no português moderno.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: descanso
  rationale: O empréstimo grego ἀνάπαυσις significa “descanso”, “repouso” ou “alívio”. “Descanso” é o equivalente mais direto e transparente.
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: para si mesmos
  rationale: A construção com ⲛⲁ- e o pronome plural indica benefício ou interesse próprio. “Para si mesmos” explicita essa força reflexiva, em vez de introduzir “almas”, palavra ausente no texto.
theological_decisions:
- issue: Relação com Mateus 11:28–30
  choice: Traduzir a redação própria de Tomé sem harmonizá-la com Mateus
  alternative: Empregar “meu jugo é suave”, “meu fardo é leve” e “descanso para as suas almas”
  rationale: Tomé apresenta “meu jugo é bom”, “meu senhorio é brando” e “descanso para si mesmos”. Preservar essas diferenças evita transformar a passagem em uma reprodução da formulação canônica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A forma “vocês” torna explícita a segunda pessoa do plural do copta. “Senhorio” é menos cotidiano, mas foi mantido por precisão, pois conserva o substantivo abstrato ligado a “senhor” e a diferença característica desta sentença em relação a Mateus.
