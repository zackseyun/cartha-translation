base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: pt
  text: 'Os discípulos lhe disseram: “Quem é você, para nos dizer essas coisas?”


    “Pelo que digo a vocês, vocês não sabem quem eu sou.[a] Mas vocês se tornaram como os judeus: eles amam a árvore, odeiam seu fruto; e amam o fruto, odeiam a árvore.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção copta também pode ser entendida como pergunta retórica: “Pelo que digo a vocês, vocês não sabem quem eu sou?”'
    reason: Preservar a ambiguidade sintática entre declaração e pergunta retórica.
  - marker: b
    text: No copta, “amam” e “odeiam” aparecem lado a lado, sem uma conjunção adversativa como “mas”, ressaltando a contradição.
    reason: Explicar a justaposição enfática preservada na tradução.
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: saber
  rationale: O verbo pode significar ‘saber’ ou ‘entender’; diante de ‘quem eu sou’, ‘saber’ expressa naturalmente o reconhecimento da identidade sem acrescentar uma interpretação.
- source_word: ϣⲱⲡⲉ
  choice: tornar-se
  rationale: A forma no perfeito indica mudança de estado; ‘vocês se tornaram’ preserva essa nuance.
- source_word: ϣⲏⲛ
  choice: árvore
  rationale: Equivalente direto e corrente do substantivo copta.
- source_word: ⲙⲉ
  choice: amar
  rationale: Mantém o contraste explícito e forte com ⲙⲟⲥⲧⲉ, ‘odiar’.
- source_word: ⲙⲟⲥⲧⲉ
  choice: odiar
  rationale: Equivalente direto que conserva a oposição enfática entre amar e odiar.
- source_word: ϩⲛ̄ ⲛⲉϯϫⲱ ⲙ̄ⲙⲟⲟⲩ ⲛⲏⲧⲛ̄
  choice: Pelo que digo a vocês
  rationale: Traduz a construção como referência às coisas ditas aos discípulos, sem introduzir a leitura incorreta ‘em seus ouvidos’.
theological_decisions:
- issue: Declaração ou pergunta retórica na resposta de Jesus
  choice: 'Declaração: ‘vocês não sabem quem eu sou’'
  alternative: 'Pergunta retórica: ‘vocês não sabem quem eu sou?’'
  rationale: A declaração corresponde diretamente à sintaxe copta e conduz naturalmente à repreensão seguinte, enquanto a nota preserva a ambiguidade possível.
- issue: Identificação do grupo comparado aos discípulos
  choice: ‘os judeus’
  alternative: Paráfrases interpretativas ou atenuadas
  rationale: O texto copta nomeia explicitamente o grupo; a tradução mantém a formulação histórica do documento sem ampliar nem explicar sua possível carga polêmica.
- issue: Relação simbólica entre árvore e fruto
  choice: Manter a imagem sem identificar seus referentes
  alternative: Explicitar árvore e fruto como Jesus, seus ensinamentos ou outro referente
  rationale: O dito não esclarece os referentes da metáfora; identificá-los resolveria indevidamente uma tensão interpretativa genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas pronominais legíveis no Brasil. A fala conserva a mudança abrupta de interlocutor do manuscrito, sem acrescentar uma fórmula como ‘ele lhes disse’. A justaposição ‘amam..., odeiam...’ reproduz o assíndeto do copta; o ponto e vírgula organiza as duas formulações paralelas sem inserir um contraste ausente no original.
