base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: pt
  text: 'E ele disse: “Quem encontrar a interpretação[a] destes ditos[b] não provará a morte[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “explicação”. “Interpretação” preserva o sentido hermenêutico do copta ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ, empréstimo do grego ἑρμηνεία.
    reason: lexical_alternative
  - marker: b
    text: O manuscrito apresenta uma forma demonstrativa plural de feição licopolitana, “destes ditos”, enquanto o texto normalizado traz o singular, “deste dito”. O fragmento grego POxy 654 também favorece o plural.
    reason: dialect_note
  - marker: c
    text: “Provar a morte” é uma expressão idiomática que significa experimentar a morte.
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: E
  rationale: Preserva o conectivo simples que introduz o dito e mantém o estilo conciso do texto.
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: ele disse
  rationale: É a forma narrativa comum do verbo de fala; a formulação é direta e natural em português.
- source_word: ϫⲉ
  choice: introdução de discurso direto por dois-pontos e aspas
  rationale: A partícula copta funciona como marcador de citação; a pontuação transmite essa função naturalmente em português.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: Quem encontrar
  rationale: Expressa o sujeito genérico da construção relativa sem introduzir marcação de gênero.
- source_word: ⲛⲁϩⲉ
  choice: encontrar
  rationale: Mantém o sentido básico de achar ou descobrir, apropriado à obtenção da interpretação.
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: interpretação
  rationale: Preserva o valor hermenêutico do empréstimo grego ἑρμηνεία, sem reduzir a expressão a mero significado.
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: destas palavras
  rationale: Adota o plural indicado pela grafia manuscrita e apoiado por POxy 654. “Palavras” é natural em português e pode designar enunciados ou ditos neste contexto.
- source_word: ⲛⲧⲟϥ
  choice: retomado implicitamente em “Quem … não provará”
  rationale: O pronome independente retoma o sujeito genérico; a sintaxe portuguesa dispensa um pronome explícito e evita marcação masculina desnecessária.
- source_word: ϥⲛⲁ
  choice: provará
  rationale: O futuro simples reproduz de modo conciso o auxiliar futuro copta.
- source_word: ϫⲓϯ
  choice: provar
  rationale: Conserva a metáfora idiomática vívida de experimentar a morte, em vez de explicá-la no corpo do texto.
- source_word: ⲁⲛ
  choice: não
  rationale: Reproduz a negação verbal copta.
- source_word: ⲛⲡⲙⲟⲩ
  choice: a morte
  rationale: O artigo definido é idiomático em português na expressão “provar a morte” e corresponde ao substantivo determinado no copta.
theological_decisions:
- issue: Natureza do resultado prometido a quem encontra a interpretação
  choice: não provará a morte
  alternative: não experimentará a morte
  rationale: A tradução conserva a imagem do texto sem definir se “morte” deve ser entendida em sentido físico, espiritual ou escatológico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa. “Palavras” foi preferido a “ditos” por sua maior naturalidade para leitores gerais, mantendo-se em nota a questão textual do número. A metáfora “provar a morte” foi preservada.
