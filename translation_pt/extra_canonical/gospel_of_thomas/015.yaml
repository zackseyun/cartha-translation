  source_fidelity: 'A tradução preserva com precisão a sequência e a força do copta: a construção temporal-prospectiva («Quando vocês virem»), a relativa definida («aquele que não nasceu de mulher»), o imperativo reflexivo de prostração, a adoração dirigida a ele e a identificação enfática como «o Pai de vocês». «Com o rosto por terra» comunica idiomaticamente o sentido distributivo de «sobre as vossas faces», sem introduzir interpretação adicional.'
  naturalness: O português é moderno, claro e de registro digno. «Vocês virem», «lancem-se» e «adorem-no» formam uma combinação amplamente compreensível e gramaticalmente natural. A pontuação do discurso direto é adequada.
  terminology: «Adorem-no» reproduz apropriadamente o valor cultual de ⲟⲩⲱϣⲧ; «Pai de vocês» conserva tanto o artigo definido quanto a segunda pessoa plural. «Esse» mantém, de modo natural em português, a força deítica de «aquele ali/esse».
