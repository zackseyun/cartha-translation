base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: pt
  text: 'Jesus disse: “Quando vocês virem aquele que não nasceu de mulher, lancem-se com o rosto por terra[a] e adorem-no. Esse é o Pai de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrem-se com o rosto por terra”. O copta emprega uma expressão vívida de lançar-se ou cair sobre a face.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus disse
  rationale: ⲡⲉϫⲉ introduz discurso direto; a fórmula portuguesa é simples e preserva a cadência concisa.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: Quando vocês virem
  rationale: A construção prospectiva com ϣⲁⲛ, após ϩⲟⲧⲁⲛ, é expressa naturalmente em português pelo futuro do subjuntivo.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: aquele que não nasceu de mulher
  rationale: A oração relativa é definida, e a combinação do verbo de nascimento com ⲉⲃⲟⲗ ϩⲛ ⲡⲥϩⲓⲙⲉ pede a expressão idiomática direta “nasceu de mulher”.
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: lancem-se com o rosto por terra
  rationale: “Lancem-se” conserva a força concreta de ⲡⲱϩⲧ e o reflexivo; “com o rosto por terra” comunica em português natural a prostração sobre a face, entendida distributivamente.
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: adorem-no
  rationale: ⲟⲩⲱϣⲧ designa adoração ou reverência cultual; o pronome mantém explícito o objeto masculino singular.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: Esse
  rationale: O demonstrativo deítico aponta enfaticamente para a pessoa recém-mencionada; “Esse” é natural e mais marcado que um simples pronome.
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  choice: o Pai de vocês
  rationale: Mantém a referência paterna definida e a segunda pessoa plural em português corrente, sem recorrer ao ambíguo possessivo “seu”.
theological_decisions:
- issue: Identidade daquele que não nasceu de mulher
  choice: 'Manter a identificação direta: “Esse é o Pai de vocês”'
  alternative: Explicar o referente como Deus, o Pai, ou como um ser não humano
  rationale: O texto identifica a figura apenas como “o Pai de vocês”. Acrescentar uma identificação ontológica resolveria uma tensão que o dito deixa aberta.
- issue: Força de ⲟⲩⲱϣⲧ
  choice: adorem-no
  alternative: prostrem-se diante dele / prestem-lhe homenagem
  rationale: A prostração já aparece no imperativo anterior, enquanto ⲟⲩⲱϣⲧ pode ter força cultual. “Adorem-no” preserva a contundência teológica sem suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. A formulação evita lusitanismos restritos e também coloquialismos brasileiros. “De mulher” conserva a concisão do idioma de nascimento presente no copta; a única nota registra uma alternativa para a ordem corporal sem interpretar a identidade da figura.
