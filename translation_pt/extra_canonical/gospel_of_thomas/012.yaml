base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: pt
  text: 'Os discípulos disseram a Jesus: “Sabemos que você partirá de nós.[a] Quem será grande sobre nós?[b]” Jesus lhes disse: “Onde quer que vocês estejam,[c] devem ir até Tiago, o Justo,[d] aquele por causa de quem o céu e a terra vieram a existir.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo copta significa literalmente “ir”. Neste contexto, também pode ser traduzido por “irá embora” ou “nos deixará”; a frase não especifica a natureza da partida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem será grande sobre nós?”. Também se pode entender a expressão no sentido de “quem governará sobre nós?”, mas o copta emprega a palavra “grande”, não um termo formal para governante ou líder.
    reason: lexical_alternative
  - marker: c
    text: 'O manuscrito diz mais literalmente: “o lugar aonde vocês vieram”. A expressão é entendida aqui idiomaticamente como “onde quer que vocês estejam”. O texto manuscrito não contém ênfase reflexiva equivalente a “vocês mesmos”.'
    reason: alternative_reading
  - marker: d
    text: “O Justo” é um epíteto de Tiago. Para seu papel entre os primeiros seguidores de Jesus, compare Atos 15 e Gálatas 1–2.
    reason: cross_reference
  - marker: e
    text: 'Ou: “aquele por cuja causa o céu e a terra vieram a existir”. A tradução conserva a afirmação causal do copta sem determinar se ela deve ser entendida literalmente, simbolicamente ou como hipérbole.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲁⲑⲏⲧⲏⲥ
  choice: os discípulos
  rationale: O empréstimo grego μαθητής, usado no plural conforme o manuscrito, tem em textos cristãos o equivalente corrente e não marcado “discípulos”.
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛⲧⲛⲁⲛⲟⲛ
  choice: você partirá de nós
  rationale: ⲃⲱⲕ significa basicamente “ir”; com “de nós”, o contexto indica afastamento. “Partirá de nós” preserva essa nuance sem especificar morte, ascensão ou outro modo de partida.
- source_word: ⲉⲧⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲱⲛ
  choice: será grande sobre nós
  rationale: A formulação conserva ⲛⲟϭ, “grande”, e a relação “sobre nós”, evitando converter silenciosamente a expressão em “governará” ou “será nosso líder”.
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: onde quer que vocês estejam
  rationale: O manuscrito traz uma oração relativa, literalmente próxima de “o lugar aonde vocês vieram”. No contexto, a expressão funciona idiomaticamente como referência ao lugar em que eles se encontrarem; não há pronome reflexivo independente que justifique “vocês mesmos”.
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁ
  choice: devem ir até
  rationale: A construção transmite uma orientação ou incumbência. “Devem ir até” expressa a diretiva e trata Tiago como pessoa a quem se vai, sem acrescentar um título institucional.
- source_word: ⲓ̈ⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: Tiago, o Justo
  rationale: “Tiago” é a forma portuguesa tradicional de Ἰάκωβος neste contexto; ⲇⲓⲕⲁⲓⲟⲥ funciona como epíteto e é vertido literalmente por “o Justo”.
- source_word: ⲡⲁⲉⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ̅
  choice: aquele por causa de quem o céu e a terra vieram a existir
  rationale: A tradução mantém a afirmação causal forte e a fórmula abrangente “o céu e a terra”, sem reduzi-la a mera homenagem nem explicar sua cosmologia.
theological_decisions:
- issue: A posição de Tiago em relação aos discípulos
  choice: Manter a ordem de ir até Tiago sem denominá-lo chefe, sucessor ou governante.
  alternative: 'Explicitar: “Tiago será o líder de vocês”.'
  rationale: A resposta de Jesus orienta os discípulos a Tiago, mas não repete diretamente a linguagem da pergunta nem lhe confere no texto um cargo formal.
- issue: A afirmação de que céu e terra vieram a existir por causa de Tiago
  choice: Preservar literalmente a afirmação causal, sem explicá-la.
  alternative: Abrandar como hipérbole honorífica ou reinterpretar como referência a outra figura.
  rationale: O dito atribui a frase a Tiago de modo explícito. Sua força e possível tensão teológica pertencem ao texto e não devem ser resolvidas pela tradução.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você/vocês” para leitura brasileira ampla. A sintaxe foi tornada natural onde a expressão copta é idiomática, mas a formulação incomum “grande sobre nós” e a forte declaração final foram preservadas para não eliminar a estranheza nem a tensão do dito.
