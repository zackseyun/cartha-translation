base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: pt
  text: 'Jesus disse: “Se a carne veio a existir por causa do espírito, isso é uma maravilha; mas, se o espírito veio a existir por causa do corpo, isso é uma maravilha das maravilhas[a]. Contudo, eu mesmo me maravilho de como[b] esta grande riqueza fez morada nesta pobreza[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo copta também pode significar “criança” em outros contextos, mas aqui a expressão “maravilha das maravilhas” funciona como superlativo.
    reason: lexical_alternative
  - marker: b
    text: No manuscrito, a última letra da palavra copta traduzida por “como” foi restaurada pelos editores.
    reason: lacuna_or_restoration
  - marker: c
    text: O fragmento grego P.Oxy. 1 também preserva a expressão “nesta pobreza”.
    reason: cross_reference
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: veio a existir
  rationale: Expressa origem ou passagem à existência neste contexto; evita restringir o sentido a nascimento físico.
- source_word: ⲉⲧⲃⲉ
  choice: por causa de
  rationale: Mantém o valor causal e o paralelismo entre as duas orações condicionais.
- source_word: ⲥⲁⲣⲝ / ⲥⲱⲙⲁ
  choice: carne / corpo
  rationale: Preserva a distinção deliberada entre os dois termos gregos presentes no copta, em vez de traduzir ambos por “corpo”.
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: espírito
  rationale: É a correspondência natural no contraste antropológico ou metafísico do dito, sem definir além do texto a natureza desse espírito.
- source_word: ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: uma maravilha das maravilhas
  rationale: Reproduz a construção superlativa e mantém o eco lexical com “uma maravilha” na oração anterior.
- source_word: ⲇⲉ
  choice: mas
  rationale: Explicita o contraste marcado pela partícula copta na segunda oração condicional.
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: eu mesmo me maravilho
  rationale: O manuscrito traz pronome independente enfático seguido da forma verbal de primeira pessoa, não uma repetição literal de “eu”.
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: esta grande riqueza
  rationale: Formulação portuguesa natural que conserva o demonstrativo, a grandeza e a imagem da riqueza.
- source_word: ⲁⲥⲟⲩⲱϩ
  choice: passou a habitar
  rationale: Comunica o perfeito e a ideia de estabelecer residência, conservando a personificação da riqueza.
- source_word: ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: nesta pobreza
  rationale: Mantém o demonstrativo e o contraste paradoxal direto entre riqueza e pobreza.
theological_decisions:
- issue: Relação de origem entre carne, espírito e corpo
  choice: Preservar as duas hipóteses condicionais sem identificar qual delas o dito afirma como verdadeira
  alternative: Interpretar uma das hipóteses como doutrina explícita sobre a criação do ser humano
  rationale: O texto formula ambas com “se” e concentra-se no caráter maravilhoso e paradoxal; resolver a condição importaria uma conclusão teológica não expressa.
- issue: Referentes metafóricos de “riqueza” e “pobreza”
  choice: Manter as imagens sem explicá-las no corpo da tradução
  alternative: Identificar expressamente a riqueza com o espírito e a pobreza com o corpo ou a carne
  rationale: Essa identificação é plausível pelo contexto, mas o último período não a declara de modo inequívoco; a tradução deve conservar a abertura metafórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. Conserva o paralelismo, o contraste marcado por “mas”, a ênfase natural de “eu mesmo” e o paradoxo final, sem reproduzir uma falsa duplicação do pronome causada pela normalização.
