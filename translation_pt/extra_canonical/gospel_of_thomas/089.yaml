base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: pt
  text: 'Jesus disse: “Por que vocês lavam o lado de fora do copo?[a] Não sabem[b] que aquele que fez[c] o lado de dentro também fez o lado de fora?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o lado de fora do copo” (ⲡⲥⲁ ⲛⲃⲟⲗ ⲛⲡⲡⲟⲧⲏⲣⲓⲟⲛ). O texto emprega uma expressão correspondente para “o lado de dentro” (ⲡⲥⲁ ⲛϩⲟⲩⲛ).
    reason: dialect_note
  - marker: b
    text: O copta ⲛⲟⲉⲓ também pode significar “compreender” ou “perceber”.
    reason: lexical_alternative
  - marker: c
    text: O copta ⲧⲁⲙⲓⲟ significa aqui “fazer, formar”; também se poderia traduzir por “formou”. É um verbo diferente do usado anteriormente para “lavar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲉⲉⲧⲃⲉⲟⲩ
  choice: Por que
  rationale: A combinação interrogativa é idiomática e direta; “Por que” preserva o tom conciso do dito.
- source_word: ⲉⲓⲱⲉ
  choice: lavam
  rationale: O verbo denota lavar, inclusive recipientes. “Lavam” é concreto e natural, sem a possível tonalidade religiosa de “purificam”.
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: o lado de fora
  rationale: Traduz de modo natural a expressão espacial formada por “lado” e “fora”, mantendo o paralelismo explícito com “o lado de dentro”.
- source_word: ⲡⲥⲁ ⲛϩⲟⲩⲛ
  choice: o lado de dentro
  rationale: Preserva a construção paralela do copta e produz em português um contraste claro com “o lado de fora”.
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: copo
  rationale: O empréstimo do grego ποτήριον designa um recipiente para beber; “copo” é o equivalente comum e não marcado em português.
- source_word: ⲛⲧⲱⲧⲛ ⲣ̄ⲛⲟⲉⲓ
  choice: Não sabem
  rationale: Mantém o sentido cognitivo mais direto e a interpelação no plural. “Não compreendem” e “Não percebem” permanecem alternativas possíveis.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲧⲁⲙⲓⲟ
  choice: aquele que fez
  rationale: A construção relativa refere-se ao agente que fez ou formou ambas as partes; “fez” é natural e preserva a distinção em relação ao verbo anterior, “lavar”.
- source_word: ⲟⲛ
  choice: também
  rationale: Expressa a força aditiva do advérbio e liga o mesmo agente à feitura do interior e do exterior.
theological_decisions: []
