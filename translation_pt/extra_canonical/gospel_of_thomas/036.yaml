base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: pt
  text: 'Jesus disse: “Não se preocupem[a], desde a manhã até a noite e desde a noite até a manhã, com o que vocês vão vestir[c].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo ϥⲓⲣⲟⲟⲩϣ pode significar “estar ansioso” ou “preocupar-se”. “Não se preocupem” foi escolhido por ser claro e natural em português.
    reason: lexical_alternative
  - marker: b
    text: Em sua forma preservada, POxy 655 acrescenta elementos sobre alimento, lírios e estatura e coincide com este dito apenas na parte referente à roupa. Esta tradução segue o texto copta de Nag Hammadi.
    reason: textual_variant
  - marker: c
    text: No manuscrito, a sequência ⲡⲉ⟨ⲧ⟩ⲉ contém a restauração editorial de uma letra. O texto normalizado de Dilley entende a expressão como uma construção relativa, “o que vocês vão vestir”.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: Não se preocupem
  rationale: O imperativo negativo exprime a ideia de estar ansioso ou preocupado. “Não se preocupem” é natural no português atual e preserva a força da exortação sem recorrer a uma formulação arcaica.
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ
  choice: desde a manhã até a noite
  rationale: Reproduz diretamente o intervalo temporal e conserva o paralelismo do texto copta.
- source_word: ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: desde a noite até a manhã
  rationale: Espelha a primeira expressão temporal e mantém a simetria enfática do dito.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: com o que vocês vão
  rationale: A construção relativa sem antecedente corresponde a “o que”, e ⲛⲁ com o infinitivo comunica sentido futuro. “Vocês vão” oferece leitura clara e corrente em português.
- source_word: ϯⲛⲧⲟϥ ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: vestir
  rationale: Embora a expressão copta seja concretamente “pôr sobre vocês mesmos”, “vestir” transmite de modo natural em português a ação de pôr roupa no próprio corpo, sem acrescentar um objeto ausente do texto.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: A conjunção coordenativa simples preserva a parataxe e liga os dois períodos temporais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para legibilidade brasileira ampla. O paralelismo temporal foi mantido, enquanto a expressão literal “pôr sobre vocês mesmos” foi vertida pelo idiomático “vestir”.
