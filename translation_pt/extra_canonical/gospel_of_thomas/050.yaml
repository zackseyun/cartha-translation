base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: pt
  text: 'Jesus disse: “Se disserem a vocês: ‘De onde vocês vieram a existir?’, digam: ‘Viemos da luz, do lugar onde a luz veio a existir por si mesma; sozinha, ficou de pé[a] e se manifestou na imagem deles[b].’ Se disserem a vocês: ‘São vocês isso?’[c], digam: ‘Somos seus filhos e somos os escolhidos[d] do pai vivo.’ E, se lhes perguntarem: ‘Qual é o sinal do pai de vocês, que está em vocês?’, digam: ‘É movimento e repouso.’[e]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O trecho conserva uma sequência de verbos breves: a luz “veio a existir”, “ficou de pé” e “se manifestou”. O copta também diz “por si mesma” e “sozinha”. O final de “ficou de pé” foi restaurado no manuscrito; “se firmou” é uma alternativa possível.'
    reason: lacuna_or_restoration
  - marker: b
    text: O copta diz literalmente “na imagem deles”. O antecedente de “deles” não é claro e não foi substituído por “dele”, “dela” ou “sua própria”.
    reason: textual_variant
  - marker: c
    text: A pergunta copta tem uma construção copulativa elíptica, literalmente próxima de “Vocês são?”. “São vocês isso?” conserva a brusquidão sem determinar qual predicado está implícito.
    reason: dialect_note
  - marker: d
    text: Ou “os eleitos”. “Os escolhidos” evita conotações tradicionais mais específicas sem alterar o sentido básico.
    reason: lexical_alternative
  - marker: e
    text: “Movimento” também pode ser traduzido por “moção”; para “repouso”, uma alternativa mais literária seria “repose”. O copta emprega artigos indefinidos com esses substantivos abstratos, mas o português natural aqui dispensa “um”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: vieram a existir / veio a existir
  rationale: Preserva a ideia de origem ou entrada na existência e mantém a ligação lexical entre a pergunta sobre os discípulos e a afirmação sobre a luz.
- source_word: ⲉⲓ ⲉⲃⲟⲗ
  choice: viemos da luz
  rationale: Distingue o verbo de movimento ‘vir/sair’ do verbo ϣⲱⲡⲉ, empregado para ‘vir a existir’, sem tornar a frase excessivamente artificial em português.
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: a luz
  rationale: É o sentido lexical direto e conserva a linguagem cosmológica do dito.
- source_word: ϩⲓⲧⲟⲟⲧϥ ⲟⲩⲁⲁⲧϥ
  choice: por si mesma
  rationale: Conserva a força reflexiva da expressão e, em português, concorda naturalmente com ‘a luz’.
- source_word: ⲟⲩⲱϩⲉ
  choice: se firmou
  rationale: Expressa de modo conciso a ideia básica de ficar ou tomar posição, evitando uma imagem portuguesa excessivamente corporal como ‘ficou de pé’.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: se manifestou
  rationale: Reproduz a noção de tornar-se visível ou manifesto sem pressupor necessariamente um agente externo, como poderia sugerir ‘foi revelada’.
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: na imagem deles
  rationale: Mantém o possessivo plural do copta e deixa sem solução a identidade de seu referente.
- source_word: ⲡⲉϥϣⲏⲣⲉ
  choice: seus filhos
  rationale: Preserva o possessivo sem fixar em português, no corpo do texto, um referente mais preciso do que o contexto permite; ‘filhos’ comunica naturalmente o plural coletivo.
- source_word: ⲡⲥⲱⲧⲡ
  choice: os escolhidos
  rationale: Transmite o sentido nominal de pessoas escolhidas sem as conotações tradicionais mais fortes de ‘os eleitos’.
- source_word: ⲡⲉⲓⲱⲧ ⲉⲧⲟⲛϩ
  choice: o pai vivo
  rationale: Conserva a qualificação concisa do substantivo e evita capitalização interpretativa não exigida pelo manuscrito.
- source_word: ⲕⲓⲙ
  choice: movimento
  rationale: É o equivalente português direto para o conceito abstrato; ‘movimentação’ seria menos solene e ‘moção’, menos natural.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: repouso
  rationale: Preserva o contraste conceitual com ‘movimento’ e é mais corrente e digno que alternativas como ‘repose’.
theological_decisions:
- issue: Referente do possessivo plural em ‘na imagem deles’
  choice: Manter ‘deles’ sem identificar o referente
  alternative: Harmonizar como ‘na sua própria imagem’ ou ‘na imagem dele’
  rationale: O copta traz um possessivo plural, mas seu antecedente não é claro; resolver a referência importaria uma leitura cosmológica específica.
- issue: Predicado implícito em ⲛⲧⲱⲧⲛ ⲡⲉ
  choice: ‘São vocês isso?’
  alternative: ‘São vocês ela?’ ou explicitar uma identidade cosmológica
  rationale: A construção copta é elíptica. ‘Isso’ conserva a brusquidão e evita identificar com certeza o predicado implícito com ‘a luz’.
- issue: O pai que está nos discípulos
  choice: ‘o pai de vocês, que está em vocês’
  alternative: ‘o sinal do pai de vocês em vocês’
  rationale: A oração relativa copta modifica ‘pai’; a tradução conserva essa relação sem reformular sua implicação teológica.
- issue: Caráter abstrato da fórmula final
  choice: ‘movimento e repouso’
  alternative: ‘um movimento e um repouso’
  rationale: O artigo indefinido copta pode acompanhar substantivos abstratos; a formulação sem artigos em português preserva melhor o caráter gnômico e conceitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por ‘vocês’ para clareza internacional e boa legibilidade brasileira. A sintaxe direta preserva o ritmo instrutivo do dito. Evitou-se capitalizar ‘pai’ para não acrescentar uma decisão interpretativa, e as ambiguidades do possessivo plural e da pergunta elíptica foram mantidas e explicadas em notas.
