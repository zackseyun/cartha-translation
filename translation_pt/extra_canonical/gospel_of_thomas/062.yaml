base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: pt
  text: 'Jesus disse: “Eu conto[b] os meus mistérios aos que são dignos dos meus mistérios.[a] O que a sua mão direita fizer, não deixe[c] que a sua mão esquerda saiba o que ela está fazendo.”[d]


    [a] O manuscrito está danificado neste trecho. “Aos que são dignos” e a segunda ocorrência de “meus” são restaurações geralmente aceitas com base no contexto e em paralelos cristãos antigos.


    [b] A forma copta traduzida por “eu conto” é uma variante dialetal da forma habitual do presente na primeira pessoa.


    [c] O manuscrito emprega aqui uma grafia variante da forma copta habitual para a ordem negativa “não deixe”.


    [d] Compare Mateus 6:3. Ali, a imagem das mãos aparece no contexto de dar esmolas; neste dito, não há referência explícita a esmolas, e a imagem vem logo depois da declaração sobre os mistérios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito está danificado neste trecho. “Aos que são dignos” e a segunda ocorrência de “meus” são restaurações geralmente aceitas com base no contexto e em paralelos cristãos antigos.
    reason: textual_variant
  - marker: b
    text: A forma copta traduzida por “eu conto” é uma variante dialetal da forma habitual do presente na primeira pessoa.
    reason: dialect_note
  - marker: c
    text: O manuscrito emprega aqui uma grafia variante da forma copta habitual para a ordem negativa “não deixe”.
    reason: dialect_note
  - marker: d
    text: Compare Mateus 6:3. Ali, a imagem das mãos aparece no contexto de dar esmolas; neste dito, não há referência explícita a esmolas, e a imagem vem logo depois da declaração sobre os mistérios.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: mistérios
  rationale: Mantém o empréstimo grego presente no copta; o artigo possessivo plural do manuscrito exige o plural em português.
- source_word: ϫⲱ
  choice: conto
  rationale: Expressa o ato de comunicar ou revelar verbalmente os mistérios. “Digo” seria possível, mas é menos idiomático com objeto direto neste contexto.
- source_word: ⲙⲡϣⲁ
  choice: são dignos
  rationale: Reproduz o sentido de ser digno ou merecedor sem definir em que consiste essa dignidade; a expressão encontra-se em uma lacuna restaurada.
- source_word: ⲟⲩⲛⲁⲙ
  choice: mão direita
  rationale: O termo copta designa o lado direito ou a mão direita; o contexto paralelo com a mão esquerda favorece a forma explícita.
- source_word: ϩⲃⲟⲩⲣ
  choice: mão esquerda
  rationale: O termo copta designa o lado esquerdo ou a mão esquerda; a explicitação natural em português preserva o paralelismo.
- source_word: ⲟⲩ
  choice: o que
  rationale: Traduz o pronome interrogativo da oração final, evitando substituí-lo por uma oração declarativa como “que ela está fazendo isso”.
theological_decisions:
- issue: Relação da imagem das mãos com a declaração sobre os mistérios
  choice: Manter as duas frases em sequência sem explicar que a ação seja esmola nem afirmar que seja necessariamente segredo espiritual.
  alternative: Importar o contexto de Mateus 6:3 e identificar a ação como dar esmolas, ou interpretar explicitamente a frase como ordem de sigilo esotérico.
  rationale: O texto de Tomé não menciona esmolas e não explicita a relação lógica entre as duas frases. A tradução preserva essa tensão, enquanto a nota registra o paralelo canônico sem fazê-lo controlar o sentido.
- issue: Referente do pronome feminino na oração final
  choice: “ela”, preservando a referência gramatical mais próxima à mão esquerda e alguma ambiguidade natural.
  alternative: Substituir o pronome por “a mão esquerda” ou fazer que ele se refira inequivocamente à mão direita.
  rationale: O copta usa um pronome feminino enfático após mencionar a mão esquerda. Como os termos portugueses para ambas as mãos também são femininos, a formulação conserva a estrutura sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção de tratamento por “você” implícito (“sua”, “deixe”), amplamente legível no Brasil e compreensível internacionalmente. A formulação evita arcaísmos e não acrescenta uma interpretação denominacional.
