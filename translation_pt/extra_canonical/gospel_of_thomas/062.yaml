review_pass:
  verdict: approve
  source_fidelity: A tradução preserva adequadamente o presente de primeira pessoa (“Eu conto”), o plural possessivo em “os meus mistérios”, a restauração assinalada de “aos que são dignos dos meus mistérios” e o paralelismo mão direita/mão esquerda. “O que ... fizer” representa de modo natural a construção prospectiva da ação da mão direita, e “o que ela está fazendo” mantém a pergunta indireta final sem resolver indevidamente a referência do pronome.
  naturalness: O português é moderno, claro e amplamente legível. “Conto os meus mistérios” é idiomático no contexto e conserva o caráter verbal de comunicar, sem transformar os “mistérios” em uma doutrina explicitamente definida. A construção imperativa “não deixe que ... saiba” é natural.
  terminology: “Mistérios”, “dignos”, “mão direita” e “mão esquerda” correspondem bem aos termos coptas e preservam o registro conciso do dito. Não há importação do contexto de esmolas de Mateus para o corpo da tradução.
