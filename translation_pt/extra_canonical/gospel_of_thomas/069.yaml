base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: pt
  text: 'Jesus disse: “Felizes os que foram perseguidos no coração deles[a]; são eles os que verdadeiramente conheceram o Pai. Felizes os que têm fome[b], para que se encha a barriga daquele que deseja[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Deles” pode referir-se aos perseguidos ou às pessoas que os perseguiram. O copta permite ambas as leituras.
    reason: ambiguity
  - marker: b
    text: O manuscrito traz uma expressão plural que significa literalmente “os que estão com fome”. Também se pode traduzir “os que passaram fome”.
    reason: grammar_lexical_alternative
  - marker: c
    text: “Barriga” traduz uma palavra corporal concreta, que também pode ser vertida como “estômago” ou “ventre”. O texto não diz o que essa pessoa deseja.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Felizes
  rationale: Reproduz em português atual a fórmula de bem-aventurança expressa pelo empréstimo grego makarios, sem recorrer ao mais arcaico “bem-aventurados” nem introduzir a ideia distinta de terem sido “abençoados”.
- source_word: ⲇⲓⲱⲕⲉ
  choice: foram perseguidos
  rationale: Expressa o sentido passivo produzido pela construção pronominal e conserva a conotação de hostilidade do verbo, em vez do sentido neutro de “seguir”.
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  choice: no coração deles
  rationale: Mantém a imagem concreta do coração e deixa aberto, como no copta, se “deles” se refere aos perseguidos ou aos perseguidores.
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛⲟⲩⲙⲉ
  choice: verdadeiramente conheceram o Pai
  rationale: Traduz o conhecimento consumado e toma ϩⲛⲟⲩⲙⲉ em função adverbial, preservando a referência titular ao Pai.
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  choice: os que têm fome
  rationale: Segue o plural e a forma estativa do manuscrito, apresentando a fome como condição presente sem excluir uma experiência prolongada.
- source_word: ϩⲓⲛⲁ
  choice: para que
  rationale: Conserva a relação de finalidade ou resultado introduzida pela partícula copta, sem decidir entre essas nuances.
- source_word: ⲡϩⲏ
  choice: barriga
  rationale: Mantém a imagem corporal concreta e o registro direto do substantivo copta; “ventre” seria mais solene, mas menos cotidiano.
- source_word: ⲥⲓⲟ
  choice: se encha
  rationale: Preserva a imagem concreta de enchimento ligada à barriga; “se satisfaça” tornaria a expressão mais abstrata.
- source_word: ⲟⲩⲱϣ
  choice: deseja
  rationale: Conserva a ideia volitiva ampla do verbo, sem acrescentar um objeto que o texto não especifica.
theological_decisions:
- issue: Referente de “deles” em “no coração deles”
  choice: Manter o pronome ambíguo
  alternative: Explicitar “no próprio coração” ou “no coração dos perseguidores”
  rationale: A construção copta permite relacionar o pronome tanto aos perseguidos quanto aos agentes indeterminados da perseguição; explicitar um referente resolveria indevidamente a tensão.
- issue: Relação entre a fome de uns e a barriga daquele que deseja
  choice: Preservar a mudança do plural para o singular genérico e a cláusula “para que”
  alternative: Harmonizar os sujeitos ou interpretar o desejo como fome espiritual
  rationale: O texto passa dos famintos no plural para “aquele que deseja” no singular e não identifica o objeto do desejo; a tradução não impõe uma leitura espiritual, ética ou sacramental.
translation_notes:
  register: Português moderno, direto e digno, com boa legibilidade brasileira. “Felizes” evita o arcaísmo de “bem-aventurados”; “barriga” conserva deliberadamente a concretude abrupta do original. A sintaxe paradoxal e as ambiguidades de referente e desejo foram mantidas.
