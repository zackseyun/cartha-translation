base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: pt
  text: 'Jesus disse: “Muitos estão de pé[a] à porta, mas são os solitários[b][c] que entrarão no lugar da câmara nupcial[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta diz literalmente “estão de pé sobre os próprios pés”; aqui foi traduzida idiomaticamente como “estão de pé”.
    reason: dialect_note
  - marker: b
    text: 'O manuscrito apresenta formas plurais: “os solitários” e “os que entrarão”. O texto normalizado fornecido altera a construção para o singular: “o solitário é quem entrará”.'
    reason: textual_variant
  - marker: c
    text: O termo ⲙⲟⲛⲁⲭⲟⲥ, tomado do grego μονάχος, pode significar “solitário” ou, em uso posterior, “monge”. Aqui, “solitários” evita impor o sentido institucional posterior e conserva a ideia de alguém só ou singular.
    reason: lexical_alternative
  - marker: d
    text: O copta diz literalmente “o lugar da câmara nupcial”, e não apenas “a câmara nupcial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: Muitos
  rationale: Expressa de modo natural a construção existencial copta e mantém o destaque inicial dado à multidão.
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: estão parados
  rationale: Traduz idiomaticamente a expressão copta literal ‘estão de pé sobre os próprios pés’, sem redundância em português.
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: à porta
  rationale: A preposição indica posição junto a ou diante da porta; ‘à porta’ é conciso e natural.
- source_word: ⲁⲗⲗⲁ
  choice: mas
  rationale: Preserva o contraste direto introduzido pelo empréstimo grego ἀλλά.
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: os solitários
  rationale: Reflete o plural do manuscrito e o sentido básico de μονάχος como alguém só ou singular, sem impor o sentido institucional posterior de ‘monges’.
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: que entrarão
  rationale: Reproduz o relativo plural futuro do manuscrito e traduz naturalmente o movimento para dentro.
- source_word: ⲡⲙⲁ ⲛ̄ϣⲉⲗⲉⲉⲧ
  choice: o lugar da câmara nupcial
  rationale: Conserva o substantivo explícito ⲙⲁ, ‘lugar’, em vez de reduzi-lo simplesmente a ‘câmara nupcial’.
theological_decisions:
- issue: Sentido de ⲙⲟⲛⲁⲭⲟⲥ
  choice: os solitários
  alternative: os monges; os unos; os que estão sós
  rationale: ‘Solitários’ preserva a amplitude do termo e o motivo de singularidade presente em Tomé, evitando tanto a leitura monástica anacrônica quanto uma interpretação teológica específica de ‘unidade’.
- issue: Número do sujeito que entra
  choice: 'plural: ‘são os solitários que entrarão’'
  alternative: 'singular: ‘é o solitário que entrará’'
  rationale: A tradução segue as formas plurais do manuscrito, ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ e ⲛⲉⲧⲛⲁⲃⲱⲕ, embora o texto normalizado fornecido as apresente no singular.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla legibilidade brasileira. A construção enfática “são os solitários que” reproduz naturalmente o contraste e a estrutura focalizadora do manuscrito. O plural do códice foi priorizado sobre a normalização editorial singular.
