revisions:
- from: 'Jesus disse: “Dois repousarão num divã; um morrerá, o outro viverá.”


    Salomé disse: “Quem és tu, homem? Como vindo de um só[a], subiste ao meu divã e comeste da minha mesa.”


    Jesus lhe disse: “Eu sou aquele que provém do Igual[b]. Fui dado dentre as coisas que pertencem a meu Pai.”


    [Salomé disse:] “Sou tua discípula.”


    [Jesus disse:][c] “Por isso digo: quando alguém ficar vazio[d], ficará cheio de luz; mas, quando ficar dividido, ficará cheio de escuridão.”'
  to: 'Jesus disse: “Dois repousarão num divã; um morrerá, o outro viverá.”


    Salomé disse: “Quem és tu, homem? Como vindo de um só[a], subiste ao meu divã e comeste da minha mesa.”


    Jesus lhe disse: “Eu sou aquele que procede do Igual[b]. Foi-me dado algo do que pertence a meu Pai.”


    [Salomé disse:] “Sou tua discípula.”


    [Jesus disse:][c] “Por isso digo: quando alguém ficar vazio[d], ficará cheio de luz; mas, quando ficar dividido, ficará cheio de escuridão.”'
  rationale: A revisão é limitada à frase sobre o que foi dado por meio do Pai. «Procede do Igual» é uma formulação portuguesa natural para a origem indicada no copta; «Foi-me dado algo do que pertence a meu Pai» reproduz de forma mais clara a construção passiva indefinida e partitiva, sem resolver quem dá nem transformar «o que pertence a meu Pai» numa categoria doutrinária. As ambiguidades textuais, as atribuições editoriais entre colchetes e suas notas foram preservadas.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:52:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem o copta: preserva o cenário do divã, a formulação ambígua «como vindo de um só», «o Igual», a leitura manuscrita «vazio» e «dividido». Contudo, «Fui dado dentre as coisas que pertencem a meu Pai» é pouco natural em português e «dentre» pode sugerir localização entre coisas, não a origem/partitividade expressa por ⲉⲃⲟⲗ ϩⲛ̄. «Foi-me dado algo do que pertence a meu Pai» preserva melhor esse valor sem especificar o agente do dar.'
  naturalness: O registro é claro e adequado. «Divã» é uma solução defensável para um móvel de repouso e refeição reclinada. A alteração proposta torna a frase sobre o Pai mais idiomática, mantendo seu caráter enigmático.
  terminology: «Salomé», «discípula», «luz», «escuridão», «o Igual», «vazio» e «dividido» estão bem empregados. «O Igual» conserva a substantivação sem impor a leitura «o Um» ou «o Indiviso».
  issues:
  - severity: medium
    issue: Construção «Fui dado dentre as coisas que pertencem a meu Pai»
    rationale: Embora pretenda representar o partitivo «de entre/do que pertence a meu Pai», «dentre» em português normalmente exprime posição ou seleção dentro de um conjunto e torna a frase artificial. A construção impessoal «Foi-me dado algo do que pertence a meu Pai» conserva o passivo indefinido do copta e o valor partitivo de ⲉⲃⲟⲗ ϩⲛ̄.
  revised_text: 'Jesus disse: “Dois repousarão num divã; um morrerá, o outro viverá.”


    Salomé disse: “Quem és tu, homem? Como vindo de um só[a], subiste ao meu divã e comeste da minha mesa.”


    Jesus lhe disse: “Eu sou aquele que procede do Igual[b]. Foi-me dado algo do que pertence a meu Pai.”


    [Salomé disse:] “Sou tua discípula.”


    [Jesus disse:][c] “Por isso digo: quando alguém ficar vazio[d], ficará cheio de luz; mas, quando ficar dividido, ficará cheio de escuridão.”'
  revised_footnotes:
  - marker: a
    text: Literalmente, “como vindo de um só”. A expressão também pode ser entendida como “como vindo de alguém” ou, com sentido teológico, “como vindo do Um”.
    reason: lexical_alternative
  - marker: b
    text: O copta traz uma expressão substantivada que significa “o que é igual” ou “o Igual”.
    reason: theological_note
  - marker: c
    text: O texto copta não identifica explicitamente os falantes das duas últimas falas. As indicações “[Salomé disse:]” e “[Jesus disse:]” foram acrescentadas com base no contexto.
    reason: textual_clarity
  - marker: d
    text: O manuscrito diz “vazio”. Muitos estudiosos propõem a emenda “igual”, que retomaria “o Igual” e faria contraste direto com “dividido”.
    reason: textual_variant
  revision_rationale: A revisão é limitada à frase sobre o que foi dado por meio do Pai. «Procede do Igual» é uma formulação portuguesa natural para a origem indicada no copta; «Foi-me dado algo do que pertence a meu Pai» reproduz de forma mais clara a construção passiva indefinida e partitiva, sem resolver quem dá nem transformar «o que pertence a meu Pai» numa categoria doutrinária. As ambiguidades textuais, as atribuições editoriais entre colchetes e suas notas foram preservadas.
