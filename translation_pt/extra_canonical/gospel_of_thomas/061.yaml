base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: pt
  text: 'Jesus disse: “Dois repousarão num divã; um morrerá, o outro viverá.”


    Salomé disse: “Quem és tu, homem? Como vindo de um só[a], subiste ao meu divã e comeste da minha mesa.”


    Jesus lhe disse: “Eu sou aquele que procede do Igual[b]. Foi-me dado algo do que pertence a meu Pai.”


    [Salomé disse:] “Sou tua discípula.”


    [Jesus disse:][c] “Por isso digo: quando alguém ficar vazio[d], ficará cheio de luz; mas, quando ficar dividido, ficará cheio de escuridão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como vindo de um só”. A expressão também pode ser entendida como “como vindo de alguém” ou, com sentido teológico, “como vindo do Um”.
    reason: lexical_alternative
  - marker: b
    text: O copta traz uma expressão substantivada que significa “o que é igual” ou “o Igual”.
    reason: theological_note
  - marker: c
    text: O texto copta não identifica explicitamente os falantes das duas últimas falas. As indicações “[Salomé disse:]” e “[Jesus disse:]” foram acrescentadas com base no contexto.
    reason: textual_clarity
  - marker: d
    text: O manuscrito diz “vazio”. Muitos estudiosos propõem a emenda “igual”, que retomaria “o Igual” e faria contraste direto com “dividido”.
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: divã
  rationale: Abrange um móvel em que se pode repousar ou reclinar-se para comer, harmonizando as referências ao repouso, ao ato de subir e à mesa.
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ
  choice: como vindo de um só
  rationale: Mantém a formulação incomum e sua ambiguidade entre uma origem individual e uma possível alusão à unidade.
- source_word: ⲡⲉⲧϣⲏϣ
  choice: o Igual
  rationale: Traduz a forma substantivada ligada a 'ser igual' sem substituí-la interpretativamente por 'Uno' ou 'Indiviso'.
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: as coisas que pertencem a meu Pai
  rationale: Expressa o possessivo plural do copta, que não diz simplesmente 'de meu Pai'.
- source_word: ϣⲏϥ
  choice: vazio
  rationale: Conserva a leitura do manuscrito, ligada a 'estar vazio/desolado', e o contraste verbal com ficar cheio.
- source_word: ⲡⲏϣ
  choice: dividido
  rationale: Traduz o estado resultante do verbo 'dividir', não o numeral 'dois'.
theological_decisions:
- issue: Sentido de ⲡⲉⲧϣⲏϣ
  choice: o Igual
  alternative: aquilo que é igual; o Indiviso
  rationale: A tradução mantém a imagem de igualdade/uniformidade no texto e evita resolver a expressão como título doutrinário específico.
- issue: Leitura de ϣⲏϥ na frase final
  choice: vazio
  alternative: igual, mediante emenda para ϣⲏϣ
  rationale: A leitura preservada pelo manuscrito foi mantida; a emenda produz uma oposição mais simétrica com 'dividido', mas não deve substituir silenciosamente o texto.
- issue: Identificação dos falantes nas duas últimas falas
  choice: atribuições a Salomé e a Jesus entre colchetes
  alternative: deixar ambas as falas sem identificação
  rationale: O contexto favorece essas atribuições, mas o copta não repete os marcadores de fala; os colchetes e a nota tornam a suplementação transparente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preservaram-se as formulações enigmáticas do copta; 'divã' mantém conjuntamente o cenário de repouso e refeição reclinada. As falas suplementadas aparecem entre colchetes, e não como parte indiscutível do manuscrito.
