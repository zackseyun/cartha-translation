base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: pt
  text: 'Jesus disse: “Feliz aquele que veio a existir antes de vir a existir.[a] Se vocês se tornarem meus discípulos e escutarem minhas palavras, estas pedras servirão a vocês.[b] Pois vocês têm cinco árvores no Paraíso; elas não se movem nem no verão nem no inverno, e suas folhas não caem. Quem vier a conhecê-las não provará a morte.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase repete o verbo copta ϣⲱⲡⲉ, “vir a existir, tornar-se”, e conserva um paradoxo deliberado: “veio a existir antes de vir a existir”.'
    reason: lexical_alternative
  - marker: b
    text: 'A superfície do manuscrito pode ser lida no plural: “minhas palavras, estas pedras”. O texto normalizado de Dilley analisa a passagem no singular: “minha palavra, esta pedra servirá a vocês”.'
    reason: textual_variant
  - marker: c
    text: “Provará a morte” preserva uma expressão idiomática copta; compare Marcos 9:1 e Mateus 16:28.
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Feliz
  rationale: O empréstimo grego introduz uma bem-aventurança. “Feliz” é natural e amplamente compreensível em português, sem reduzir a frase a mera sorte.
- source_word: ϣⲱⲡⲉ
  choice: vir a existir / tornar-se
  rationale: Na abertura, a repetição “veio a existir antes de vir a existir” conserva o paradoxo deliberado e o sentido existencial do verbo. Na oração condicional, “se tornarem” é a formulação portuguesa natural.
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: Se vocês se tornarem
  rationale: A construção admite valor futuro-condicional; “se” preserva essa nuance sem transformá-la em certeza temporal.
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: discípulos
  rationale: É o equivalente tradicional e corrente do empréstimo grego, apropriado ao contexto de relação entre mestre e aprendizes.
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: escutarem
  rationale: Expressa audição atenta sem acrescentar explicitamente a ideia de obedecer.
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: minhas palavras / estas pedras
  rationale: Segue a leitura plural da superfície do manuscrito, conforme a revisão mais recente, e registra em nota a análise singular do texto normalizado.
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: servirão a
  rationale: Traduz com clareza o empréstimo ligado a prestar serviço; “ministrarão a” seria pouco natural ou potencialmente eclesiástico em português atual.
- source_word: ⲛϯⲟⲩ ⲛϣⲏⲛ
  choice: cinco árvores
  rationale: Tradução direta, sem identificar simbolicamente as árvores.
- source_word: ⲕⲓⲙ
  choice: se movem
  rationale: Mantém o sentido concreto de mover-se ou ser agitado, sem interpretar a expressão como “mudar”.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: provará a morte
  rationale: Preserva a metáfora idiomática da fonte, também conhecida na linguagem bíblica.
theological_decisions:
- issue: Sentido da existência anterior à existência
  choice: Manter o paradoxo sem explicação no corpo do texto
  alternative: Interpretar como preexistência, autoconhecimento ou nascimento físico
  rationale: A formulação copta é deliberadamente paradoxal e não especifica qual leitura metafísica ou antropológica deve prevalecer.
- issue: Identidade das cinco árvores do Paraíso
  choice: Não identificar nem alegorizar
  alternative: Associá-las a sentidos, virtudes, sacramentos ou entidades celestes
  rationale: O dito não fornece uma identificação; qualquer definição acrescentaria uma tradição interpretativa ao texto.
- issue: Conhecer as árvores e não provar a morte
  choice: Preservar a relação afirmada sem sistematizá-la
  alternative: Explicar como salvação sacramental, imortalidade física ou conhecimento gnóstico técnico
  rationale: A fonte afirma a consequência, mas não define a natureza do conhecimento nem da morte.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural. A tradução conserva a estranheza aforística do dito, evita linguagem confessional específica e segue a leitura plural do manuscrito em “palavras/pedras”, registrando a alternativa editorial singular em nota.
