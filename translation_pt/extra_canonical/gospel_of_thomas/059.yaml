base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: pt
  text: 'Jesus disse: “Busquem aquele que vive[a], enquanto vocês estão vivos, para que não morram e então procurem vê-lo, e não possam vê-lo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Vivente”; literalmente, “aquele que está vivendo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: busquem
  rationale: A combinação verbal expressa busca ou procura. “Busquem” é natural em português e mantém a força do imperativo sem reproduzir de modo artificial a preposição copta.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: aquele que vive
  rationale: Traduz diretamente a construção relativa, literalmente “aquele que está vivendo”, preservando sem explicitação indevida a identidade do referente.
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: enquanto vocês estão vivos
  rationale: A oração circunstancial tem sentido temporal. A formulação distingue com clareza a condição presente dos ouvintes do referente “aquele que vive”.
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉⲛⲧⲱⲧⲛⲙⲟⲩ
  choice: para que não morram
  rationale: Reproduz a construção de finalidade negativa em português corrente, sem recorrer ao mais literário “para que não venham a morrer”.
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ ⲉⲛⲧⲟϥ
  choice: procurem vê-lo
  rationale: Mantém o sentido básico de ϣⲓⲛⲉ, “buscar/procurar”, e sua ligação temática com a busca, ao mesmo tempo que traduz naturalmente a sequência com “ver”.
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: não consigam ver
  rationale: A expressão literalmente ligada a ter força ou poder é idiomática para capacidade. “Não consigam ver” comunica essa incapacidade em português natural.
theological_decisions:
- issue: Identidade de “aquele que vive”
  choice: aquele que vive
  alternative: o Vivente
  rationale: A tradução relativa preserva a abertura do copta e evita transformar necessariamente a expressão em título técnico ou identificar explicitamente o referente com Jesus, Deus ou outra figura.
- issue: Relação entre morrer e a busca posterior
  choice: e então procurem vê-lo, mas não consigam ver
  alternative: para que não morram, procurem vê-lo e não sejam capazes de ver
  rationale: “Então” torna explícita a sequência já sugerida pelo encadeamento copta, enquanto “mas” expressa a oposição entre procurar e não conseguir. A formulação não define se a morte é física, espiritual ou simbólica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural copta. A repetição de “ver” foi preservada por corresponder ao texto-fonte. Evitou-se “busquem após”, que seria pouco natural em português, e não se capitalizou a expressão para não impor sua leitura como título.
