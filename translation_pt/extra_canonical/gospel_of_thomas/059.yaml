  naturalness: O português é claro, moderno e apropriado. «Não possam vê-lo» expressa de modo mais direto a construção copta de capacidade do que «não consigam ver», além de manter o objeto explícito como na oração precedente.
  terminology: «Aquele que vive» preserva corretamente a construção relativa e sua abertura interpretativa. «Busquem» e «procurem vê-lo» mantêm a repetição lexical de busca sem exigir uma reprodução artificial da preposição copta.
