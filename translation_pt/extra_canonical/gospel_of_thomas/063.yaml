revisions:
- from: 'Jesus disse: “Havia um homem rico que possuía muito dinheiro.[a] Ele disse: ‘Usarei meu dinheiro para que eu semeie, colha[b] e plante,[c] e encha meus armazéns de produtos da terra, a fim de que nada me falte.’ Eram essas as coisas em que ele pensava no coração. E, naquela mesma noite, ele morreu. Quem tem ouvidos, ouça.”[d]'
  to: 'Jesus disse: “Havia um homem rico que possuía muito dinheiro.[a] Ele disse: ‘Usarei meu dinheiro para semear, colher[b] e plantar,[c] e encher meus armazéns de produtos da terra, a fim de não me faltar nada.’ Eram essas as coisas em que ele pensava em seu coração. E, naquela noite, ele morreu. Quem tem ouvidos, ouça.”[d]'
