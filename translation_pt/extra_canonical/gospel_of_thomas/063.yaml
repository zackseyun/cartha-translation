base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: pt
  text: 'Jesus disse: “Havia um homem rico que possuía muito dinheiro.[a] Ele disse: ‘Usarei meu dinheiro para semear, colher[b] e plantar,[c] e encher meus armazéns de produtos da terra, a fim de não me faltar nada.’ Eram essas as coisas em que ele pensava em seu coração. E, naquela noite, ele morreu. Quem tem ouvidos, ouça.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo copta ⲭⲣⲏⲙⲁ pode significar dinheiro, riqueza, bens ou propriedade. Aqui foi traduzido por “dinheiro” devido ao uso concreto que o homem pretende fazer dele.
    reason: lexical_alternative
  - marker: b
    text: No verbo ⲱϩⲥ, “colher”, a letra ϩ foi restaurada na edição citada por causa de dano no manuscrito.
    reason: lacuna_or_restoration
  - marker: c
    text: O verbo ⲧⲱⲱϭⲉ significa “plantar”. Embora esta fala lembre Lucas 12:16–21, o copta usa aqui um verbo agrícola, não o verbo “construir”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “Quem tem ouvidos, que ouça”. O texto não inclui as palavras “para ouvir”, presentes em algumas fórmulas semelhantes dos evangelhos canônicos.
    reason: textual_distinction
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: rico
  rationale: Reproduz diretamente o adjetivo socioeconômico de origem grega, sem acrescentar avaliação moral.
- source_word: ⲭⲣⲏⲙⲁ
  choice: dinheiro
  rationale: O termo pode designar dinheiro, riqueza ou bens; neste contexto, o uso reiterado e o investimento agrícola favorecem o sentido concreto “dinheiro”.
- source_word: ⲣⲭⲣⲱ
  choice: usarei
  rationale: Expressa de modo simples e idiomático a ideia causativa de fazer uso de algo.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: para que
  rationale: A conjunção introduz finalidade, não causa; “para que” preserva explicitamente a lógica do propósito.
- source_word: ϫⲟ / ⲱϩⲥ / ⲧⲱⲱϭⲉ
  choice: semeie, colha e plante
  rationale: Mantém os três verbos agrícolas e sua ordem incomum no manuscrito, sem harmonizar o texto com a parábola de Lucas.
- source_word: ⲁϩⲟ
  choice: armazéns
  rationale: Termo abrangente para locais de armazenamento, evitando restringir indevidamente o sentido a celeiros ou granários.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: produtos da terra
  rationale: No contexto de colheita e armazenamento, indica produção agrícola; evita o sentido moderno mais estreito de “frutas”.
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: nada me falte
  rationale: Reproduz de forma natural a construção negativa, literalmente relativa a não estar necessitado de coisa alguma.
- source_word: ⲡⲉⲧⲉⲩⲛⲙⲁϫⲉ ⲛⲛⲧⲟϥ ⲙⲁⲣⲉⲛⲧⲟϥⲥⲱⲧⲙ
  choice: Quem tem ouvidos, ouça
  rationale: Preserva a fórmula breve do copta e não acrescenta “para ouvir”, ausente do texto.
theological_decisions:
- issue: Relação com Lucas 12:16–21
  choice: Preservar a redação própria de Tomé, incluindo “plante” e a sequência dos atos agrícolas.
  alternative: Harmonizar com a linguagem lucana de construir celeiros maiores.
  rationale: A semelhança temática não justifica substituir os verbos efetivamente presentes no copta.
- issue: Fórmula final de exortação
  choice: “Quem tem ouvidos, ouça.”
  alternative: “Quem tem ouvidos para ouvir, ouça.”
  rationale: O copta diz apenas que a pessoa tem ouvidos; acrescentar “para ouvir” importaria a forma mais conhecida dos evangelhos sinóticos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível no Brasil e compreensível internacionalmente. A ordem “semeie, colha e plante” foi mantida apesar de incomum, por refletir a sequência do copta. “Armazéns” evita regionalismo e excesso de especificidade; “produtos da terra” explicita naturalmente o sentido agrícola de καρπός/ⲕⲁⲣⲡⲟⲥ.
