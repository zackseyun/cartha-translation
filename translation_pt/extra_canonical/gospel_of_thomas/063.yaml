review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente o enredo, a finalidade expressa por ϫⲉⲕⲁⲁⲥ, a sequência agrícola incomum (semear, colher, plantar), a pluralidade de “essas coisas” e a fórmula final sem acrescentar “para ouvir”. A única alteração proposta é estilística e não modifica o sentido: o infinitivo após “para” reproduz a finalidade de modo mais natural em português.'
  naturalness: “Usarei meu dinheiro para que eu semeie” é gramatical, mas é menos idiomático do que “Usarei meu dinheiro para semear”. Também “em seu coração” torna explícita a relação possessiva presente no copta. “Naquela noite” é mais sóbrio do que “naquela mesma noite”, sem introduzir uma ênfase que o português não precisa explicitar.
  terminology: “Rico”, “dinheiro”, “armazéns”, “produtos da terra” e “Quem tem ouvidos, ouça” são escolhas adequadas. As notas explicam de forma suficiente a restauração em ⲱϩⲥ, o valor agrícola de ⲧⲱⲱϭⲉ e a distinção da fórmula final.
