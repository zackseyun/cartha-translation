review_pass:
  verdict: revise
  source_fidelity: A redação preserva bem as imagens, os singulares restaurados («rei» e «dignitário») e a incapacidade de conhecer a verdade. Contudo, «foram ver no deserto» não explicita o movimento de sair para o deserto expresso por ⲁⲛⲧⲱⲧⲛⲉⲓ ⲉⲃⲟⲗ ⲉⲡⲥⲱϣⲉ. Além disso, «Vejam» não possui correspondente no texto copta fornecido e introduz uma injunção não atestada.
  naturalness: A tradução é em geral clara e moderna. «O que vocês saíram para ver no deserto?» é igualmente idiomático e restitui melhor a construção de movimento. A retirada de «Vejam» torna a transição para a afirmação final mais sóbria e fiel.
  terminology: «Deserto», «caniço», «roupas macias», «dignitário» e «a verdade» são escolhas adequadas. As notas explicam apropriadamente a restauração, o empréstimo grego e as alternativas lexicais.
  issues:
  - severity: medium
    issue: O verbo de movimento «sair» foi omitido.
    rationale: O copta pergunta literalmente o que os ouvintes saíram para ver no deserto; «foram ver no deserto» pode indicar apenas o local em que viram algo.
  - severity: medium
    issue: «Vejam» acrescenta uma ordem sem base no texto-fonte.
    rationale: Não há imperativo equivalente entre a segunda pergunta e a oração sobre os que usam roupas macias no texto copta normalizado.
  revised_text: 'Jesus disse: “O que vocês saíram para ver no deserto[a]? Um caniço agitado pelo vento? E uma pessoa vestida com roupas macias[b]? Os que vestem roupas macias estão na casa do rei de vocês e do dignitário de vocês[c][d], e eles não são capazes de conhecer a verdade[e].”'
  revised_footnotes:
