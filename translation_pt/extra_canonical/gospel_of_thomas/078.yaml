base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: pt
  text: 'Jesus disse: “O que vocês saíram para ver no deserto[a]? Um caniço agitado pelo vento? E uma pessoa vestida com roupas macias[b]? Os que vestem roupas macias estão na casa do rei de vocês e do dignitário de vocês[c][d], e eles não são capazes de conhecer a verdade[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta pode ser traduzido como “deserto”, “região erma” ou “campo aberto”.
    reason: lexical_alternative
  - marker: b
    text: “Roupas macias” também pode ser traduzido como “roupas finas” ou “delicadas”.
    reason: lexical_alternative
  - marker: c
    text: O manuscrito está danificado nesta passagem. A tradução segue o texto normalizado, que traz no singular “na casa do rei de vocês e do dignitário de vocês”.
    reason: lacuna_or_restoration
  - marker: d
    text: “Dignitário” traduz um empréstimo do grego que designa uma pessoa de alta posição, um grande senhor.
    reason: lexical_alternative
  - marker: e
    text: “Conhecer a verdade” também pode significar “reconhecer” ou “compreender a verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: O que … foram ver
  rationale: A construção pergunta pelo objeto da saída para ver, não simplesmente pela causa; a formulação também soa natural em português.
- source_word: ⲡⲥⲱϣⲉ
  choice: deserto
  rationale: O termo designa deserto ou região erma; “deserto” é claro e preserva a ressonância bíblica, sem exigir um cenário arenoso.
- source_word: ⲟⲩⲕⲁϣ
  choice: um caniço
  rationale: No contexto proverbial, refere-se a uma planta de haste flexível; “caniço” comunica melhor essa imagem em português atual.
- source_word: ⲕⲓⲙ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: agitado pelo vento
  rationale: Expressa o movimento causado pelo vento sem exagerar sua intensidade.
- source_word: ⲟⲩⲣⲱⲙⲉ
  choice: uma pessoa
  rationale: Embora a forma seja gramaticalmente masculina, o substantivo pode ser genérico; “pessoa” evita restringir indevidamente a referência.
- source_word: ⲛϣⲧⲏⲛ
  choice: roupas macias
  rationale: Preserva a qualidade tátil expressa pelo termo; “finas” ou “delicadas” também são possíveis.
- source_word: ϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ
  choice: vestida com
  rationale: Transmite naturalmente em português a construção copta que descreve roupas colocadas sobre alguém.
- source_word: ⲡⲉⲧⲛⲣⲣⲟ
  choice: o rei de vocês
  rationale: Mantém o singular “rei” e explicita de modo natural o possessivo da segunda pessoa do plural.
- source_word: ⲡⲉⲧⲛⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: o dignitário de vocês
  rationale: O empréstimo grego designa uma pessoa de alta posição; “dignitário” é mais corrente e preciso que “magnata” neste contexto cortesão.
- source_word: ⲛⲁϣⲥⲟⲟⲩⲛⲡⲙⲉ ⲁⲛ
  choice: não são capazes de conhecer a verdade
  rationale: Preserva tanto a expressão explícita de incapacidade quanto o sentido amplo de conhecer, compreender ou reconhecer.
theological_decisions:
- issue: Identidade e alcance dos que não conhecem a verdade
  choice: Manter como referente imediato os que vestem roupas macias
  alternative: Generalizar a afirmação a todos os governantes ou ricos
  rationale: A sintaxe liga a declaração ao grupo mencionado, sem justificar uma ampliação doutrinária.
- issue: Sentido de “verdade”
  choice: Preservar “a verdade” sem definição interpretativa
  alternative: Explicitar como verdade salvífica, revelação ou conhecimento espiritual
  rationale: O dito não define aqui o conteúdo de “verdade”; uma especificação resolveria indevidamente sua abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A redação mantém as perguntas retóricas e os singulares incomuns do testemunho copta, mas transforma a expressão literal sobre roupas colocadas sobre a pessoa em português natural. Todos os marcadores de nota aparecem no texto.
