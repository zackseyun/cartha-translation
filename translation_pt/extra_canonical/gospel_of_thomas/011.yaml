base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: pt
  text: 'Jesus disse: “Este céu passará, e o que está acima dele passará.[a] Os mortos não estão vivos, e os vivos não morrerão. No dia em que vocês comiam o que está morto, vocês o tornavam vivo.[b] Quando vierem a estar na luz, o que farão?[c] No dia em que vocês eram um, tornaram-se dois.[d] Mas, quando se tornarem dois, o que farão?”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Este céu» também pode ser traduzido por «este firmamento» ou «este céu visível». A expressão seguinte, «o que está acima dele», favorece aqui «céu», sem definir a natureza dessa realidade superior.
    reason: lexical_alternative
  - marker: b
    text: '«Vocês o tornavam vivo»: o pronome provavelmente retoma «o que está morto». A construção copta também pode ser traduzida por «vocês faziam dele algo vivo».'
    reason: lexical_alternative
  - marker: c
    text: O copta inclui um pronome objeto na pergunta, que poderia ser entendido como «o que farão com isso?». Como o referente não é seguro, ele fica implícito na tradução.
    reason: lexical_alternative
  - marker: d
    text: '«Vocês eram um»: a expressão copta também pode significar «vocês se tornaram um» ou «fizeram um». A forma seguinte, «tornaram-se dois», favorece aqui uma referência ao passado.'
    reason: alternative_reading
  - marker: e
    text: Na pergunta final, o manuscrito emprega uma forma verbal diferente da usada na pergunta anterior, possivelmente com o sentido de «fazer» ou «fazer com isso». Pelo contexto, a tradução repete «o que farão?».
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: este céu
  rationale: ⲡⲉ pode designar céu ou firmamento; a referência seguinte àquele que está acima dele favorece o sentido cosmológico de “céu”, sem explicitar uma cosmologia além do texto.
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: passará
  rationale: O empréstimo grego com futuro exprime passar ou deixar de existir. “Passará” preserva a concisão e a ressonância apocalíptica sem determinar excessivamente o sentido.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ … ⲛⲉⲧⲟⲛϩ
  choice: os mortos … os vivos
  rationale: Substantivação natural em português, mantendo o paralelismo conciso do copta.
- source_word: ⲟⲩⲱⲙ
  choice: comiam
  rationale: Verbo simples e concreto, no valor temporal passado exigido pelo contexto.
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: vocês o tornavam vivo
  rationale: A construção causativa “fazer/tornar X vivo” é vertida naturalmente por “tornar vivo”; o pronome retoma provavelmente aquilo que está morto.
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁⲛϣⲱⲡⲉ ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: quando vierem a estar na luz
  rationale: “Vierem a estar” conserva o caráter prospectivo ou ingressivo da construção, e “luz” mantém o símbolo sem interpretação adicional.
- source_word: ⲉⲧⲉⲧⲛ̄ⲟ ⲛ̄ⲟⲩⲁ
  choice: vocês eram um
  rationale: A expressão com numeral pode significar ser um, tornar-se um ou fazer um. O passado e o contraste com “tornaram-se dois” favorecem “eram um”, preservando a ambiguidade em nota.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲧⲛ̄ⲛⲁⲁϥ
  choice: o que farão?
  rationale: A pergunta nua é idiomática em português e mantém o caráter enigmático; o pronome objeto copta pode ser pleonástico ou referencial.
theological_decisions:
- issue: Sentido de “um” e “dois”
  choice: Manter os numerais sem explicação no corpo do texto
  alternative: Interpretá-los como unidade primordial, divisão sexual, corpo e alma ou outra doutrina específica
  rationale: O dito não identifica os referentes; explicá-los teologicamente eliminaria uma ambiguidade genuína e importaria uma leitura sectária.
- issue: Condição dos mortos e dos vivos
  choice: Traduzir literalmente o paradoxo temporal
  alternative: Harmonizar com uma doutrina explícita de ressurreição ou imortalidade
  rationale: A sequência “os mortos não estão vivos, e os vivos não morrerão” deve conservar sua tensão própria, sem harmonização confessional.
translation_notes:
  register: Português moderno, digno e direto, com “vocês” para o plural. A sintaxe conserva o paralelismo, os contrastes e o caráter enigmático do dito. “Este céu” foi preferido a “este firmamento” ou “este céu visível” para evitar arcaísmo e interpretação excessiva.
