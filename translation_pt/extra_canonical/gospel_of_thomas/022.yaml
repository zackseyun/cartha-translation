  yaml_path: translation/extra_canonical/gospel_of_thomas/022.yaml
  text: Jesus saw some little ones being suckled[a]. He said to his disciples, “These little ones who are being suckled are like those who are to enter the Kingdom.” They said to him, “Shall we, being little ones, enter the Kingdom?” Jesus said to them, “When you make the two one; and when you make the inner like the outer and the outer like the inner, and the upper like the lower; and when you make the male and the female into a single one, so that the male is not male and the female not female; and when you make eyes in the place of an eye, and a hand in the place of a hand, and a foot in the place of a foot[h][g][f][e][d][c][b], and an image in the place of an image—then you will enter the Kingdom.”
translation:
  language: pt
  text: 'Jesus viu algumas criancinhas mamando[a] e disse aos seus discípulos:


    — Estas criancinhas que mamam são como os que entrarão no Reino[b].


    Eles lhe perguntaram:


    — Sendo nós criancinhas, entraremos no Reino?


    Jesus lhes disse:


    — Quando vocês fizerem dos dois um só; quando fizerem o interior como o exterior e o exterior como o interior, e o de cima como o de baixo[c]; quando fizerem do masculino e do feminino um só, de modo que o masculino não seja masculino e o feminino não seja feminino; quando fizerem olhos no lugar de um olho, uma mão no lugar de uma mão, um pé no lugar de um pé e uma imagem no lugar de uma imagem — então vocês entrarão no Reino[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mamando” traduz uma expressão copta específica para tomar leite ou mamar; também se poderia dizer “sendo amamentadas”.
    reason: lexical_alternative
  - marker: b
    text: “Reino” traduz um substantivo que pode significar também “reinado”, “realeza” ou “domínio régio”. Neste dito, ele é apresentado como aquilo em que se entra.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o celeste como o terreno”. O copta contrapõe o lado de cima ou do céu ao lado de baixo; não há aqui um par adicional como “frente e costas”.'
    reason: textual_clarification
  - marker: d
    text: No manuscrito, o fim da palavra traduzida por “Reino” está danificado. A leitura é restaurada como “Reino” com base nas letras preservadas, na construção e no contexto.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲕⲟⲩⲓ
  choice: criancinhas
  rationale: O termo significa literalmente “pequenos”. O contexto da amamentação indica crianças de colo; “criancinhas” mantém tanto a ideia de pequenez quanto a referência humana, sem restringi-la tecnicamente a “bebês”.
- source_word: ϫⲓⲉⲣⲱⲧⲉ
  choice: mamando
  rationale: A expressão designa tomar leite ou mamar. “Mamando” é corrente, específico e natural em português, além de preservar a imagem concreta da amamentação.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Reino
  rationale: O substantivo abstrato pode significar realeza, reinado ou domínio régio, mas neste dito é tratado como aquilo em que alguém entra. “Reino” conserva essa combinação tradicional de governo e esfera de entrada.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: fizerem dos dois um só
  rationale: Reproduz de maneira concisa a fórmula enfática do texto, sem explicar quais sejam “os dois”.
- source_word: ⲡⲥⲁ ⲛϩⲟⲩⲛ / ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: o interior / o exterior
  rationale: Mantém a oposição espacial e simbólica do copta sem a reduzir a uma interpretação psicológica ou teológica específica.
- source_word: ⲡⲥⲁ ⲛⲧⲡⲉ / ⲡⲥⲁ ⲙⲡⲓⲧⲛ
  choice: o de cima / o de baixo
  rationale: A expressão contrapõe o lado superior ou celeste ao inferior. Esta formulação conserva a ambiguidade espacial e evita acrescentar um par inexistente como “frente e costas”.
- source_word: ⲡϩⲟⲟⲩⲧ / ⲥϩⲓⲙⲉ
  choice: o masculino / o feminino
  rationale: Preserva o paralelismo dos termos sexuais sem introduzir os papéis sociais mais específicos de “homem” e “mulher”.
- source_word: ⲛⲡⲓⲟⲩⲁ ⲟⲩⲱⲧ
  choice: um único ser
  rationale: A expressão copta intensifica a unidade. “Um único ser” comunica a união do par sem definir metafisicamente a natureza dessa unidade.
- source_word: ϩⲓⲕⲱⲛ
  choice: imagem
  rationale: O empréstimo grego pode ser transliterado como “ícone”, mas “imagem” é mais transparente e mantém o sentido amplo do termo.
theological_decisions:
- issue: Sentido da união dos opostos
  choice: Conservar a série de oposições e a linguagem paradoxal sem explicá-las.
  alternative: Interpretar a passagem como retorno à condição primordial, superação da diferenciação sexual ou integração espiritual interior.
  rationale: O dito não identifica explicitamente o referente de cada par nem explica como a transformação deve ocorrer; escolher uma dessas leituras resolveria indevidamente sua tensão.
- issue: Pergunta dos discípulos sobre as criancinhas
  choice: “Sendo nós criancinhas, entraremos no Reino?”
  alternative: “Devemos tornar-nos criancinhas para entrar no Reino?”
  rationale: A construção copta apresenta “sendo criancinhas” como circunstância do verbo futuro “entraremos”, e não afirma de modo inequívoco um processo de tornar-se criança.
- issue: Masculino e feminino tornados um
  choice: Manter “de modo que o masculino não seja masculino e o feminino não seja feminino”.
  alternative: Parafrasear como eliminação, transcendência ou reconciliação dos sexos.
  rationale: A formulação é deliberadamente paradoxal e não especifica se descreve identidade, transformação, unidade ou ausência de distinção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. O discurso preserva as repetições, os contrastes e a estranheza intencional do dito, mas evita construções desnecessariamente arcaicas. A pontuação organiza a longa resposta sem transformar seus paralelos em explicação interpretativa.
