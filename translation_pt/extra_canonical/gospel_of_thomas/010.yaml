base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: pt
  text: 'Jesus disse: “Eu lancei um fogo sobre o mundo e, vejam[a], estou guardando-o[b] até que se inflame.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vejam” traduz a expressão dêitica ⲉⲓⲥϩⲏⲏⲧⲉ, que também pode ser entendida como “eis” ou “prestem atenção”.
    reason: lexical_alternative
  - marker: b
    text: ϩⲁⲣⲉϩ também pode ser traduzido como “estou velando por ele” ou “estou vigiando-o”; “guardando-o” conserva a possível nuance de proteção.
    reason: lexical_alternative
  - marker: c
    text: 'Compare com Lucas 12:49: “Vim lançar fogo sobre a terra...”. Tomé, porém, diz “mundo” e acrescenta: “estou guardando-o até que se inflame”.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: Eu lancei
  rationale: O verbo ⲛⲟⲩϫⲉ significa “lançar, atirar”. O perfeito copta apresenta a ação como realizada; o pretérito perfeito simples é a forma natural em português, enquanto “eu” preserva a ênfase do pronome expresso.
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: um fogo
  rationale: O artigo indefinido ⲛⲟⲩ- favorece “um”, e ⲕⲱϩⲧ tem o sentido básico de “fogo”.
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: sobre o mundo
  rationale: ⲉϫⲛ significa “sobre/em cima de”, e o empréstimo grego ⲕⲟⲥⲙⲟⲥ é traduzido naturalmente por “mundo”, sem restringir seu alcance.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: vejam
  rationale: A expressão dêitica chama a atenção do ouvinte. “Vejam” é atual e direto, preservando a força do imperativo plural sem o tom arcaizante de “eis” ou “eis que”.
- source_word: ϩⲁⲣⲉϩ
  choice: estou guardando
  rationale: O verbo abrange guardar, vigiar e velar por. A construção progressiva comunica a ação durativa que se estende até o fogo se inflamar.
- source_word: ⲉⲛⲧⲟϥ
  choice: -o
  rationale: O pronome objeto masculino singular retoma ⲕⲱϩⲧ, “fogo”, que também é masculino em português; por isso, “guardando-o” conserva claramente a referência.
- source_word: ϣⲁⲛⲧⲉ
  choice: até que
  rationale: A conjunção marca o limite temporal da ação de guardar.
- source_word: ϫⲉⲣⲟ
  choice: se inflame
  rationale: O verbo descreve o fogo começando a arder intensamente ou irrompendo em chamas. “Inflamar-se” preserva essa vivacidade melhor que o mais genérico “queimar”.
theological_decisions:
- issue: Sentido simbólico do fogo
  choice: Manter a imagem sem explicar o que o fogo representa
  alternative: Identificar o fogo como juízo, purificação, conflito ou revelação
  rationale: O dito não define o referente simbólico; especificá-lo na tradução resolveria indevidamente uma ambiguidade teológica genuína.
- issue: Relação de Jesus com o fogo durante a espera
  choice: Traduzir ϩⲁⲣⲉϩ por “estou guardando-o”
  alternative: “estou protegendo-o” ou “estou vigiando-o”
  rationale: “Guardar” mantém abertas tanto a ideia de vigilância quanto a de preservação, sem impor uma interpretação específica da ação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. “Vejam” evita arcaísmo excessivo; “guardando-o” mantém a concisão e a ambiguidade do copta. A repetição explícita de “eu” reproduz a ênfase do texto-fonte.
