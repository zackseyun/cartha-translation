  source_fidelity: 'A tradução preserva adequadamente a sequência verbal do copta: ação perfectiva concluída («Eu lancei»), seguida da ação durativa («estou guardando-o») e de seu limite temporal («até que se inflame»). «Um fogo», «sobre o mundo» e o pronome «-o», que retoma «fogo», são escolhas fiéis. «Se inflame» transmite apropriadamente a ideia de arder em chamas, sem reduzir a imagem a uma leitura interpretativa.'
  naturalness: O texto é claro, conciso e natural em português moderno de ampla compreensão. «Vejam» funciona bem como chamada dêitica imediata; embora «eis» também fosse possível, não é necessária alteração. A colocação pronominal em «guardando-o» é idiomática e adequada ao registro.
  terminology: «Mundo» traduz naturalmente ⲕⲟⲥⲙⲟⲥ neste contexto, e «guardar» mantém de modo útil a abertura semântica de ϩⲁⲣⲉϩ entre vigiar, velar e preservar. A tradução não impõe significado doutrinário ao fogo. As âncoras das notas correspondem corretamente a «vejam», «guardando-o» e à alusão comparativa.
