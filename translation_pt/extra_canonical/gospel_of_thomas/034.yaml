base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
translation:
  language: pt
  text: 'Jesus disse: “Se uma pessoa cega guia outra pessoa cega, as duas caem num buraco.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: pessoa cega
  rationale: O substantivo copta é genérico; esta forma preserva o sentido sem acrescentar gênero e soa natural em português atual.
- source_word: ⲥⲱⲕ ϩⲏⲧ
  choice: guia
  rationale: A expressão, literalmente relacionada a ‘puxar à frente’, funciona idiomaticamente com o sentido de conduzir ou guiar.
- source_word: ϣⲁⲩϩⲉ
  choice: caem
  rationale: O presente português exprime adequadamente a realidade habitual ou gnômica indicada pela forma copta, sem convertê-la em futuro.
- source_word: ⲡⲉⲥⲛⲁⲩ
  choice: as duas
  rationale: Preserva a referência enfática aos dois indivíduos e concorda naturalmente com ‘pessoa’.
- source_word: ⲉⲡⲉⲥⲏⲧ
  choice: —
  rationale: O sentido direcional ‘para baixo’ já está naturalmente implicado em ‘caem’; traduzi-lo separadamente como ‘caem para baixo’ seria redundante e pouco idiomático em português.
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: num buraco
  rationale: Preserva a construção indefinida ‘em/para um buraco’; ‘num’ é corrente e natural no português brasileiro e amplamente inteligível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o caráter proverbial da frase por meio do presente gnômico. A repetição de ‘pessoa cega’ reproduz o paralelismo do copta; ‘as duas’ evita ambiguidade e preserva a ênfase dual.
