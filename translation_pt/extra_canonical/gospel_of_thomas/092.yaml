base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: pt
  text: 'Jesus disse: “Busquem, e vocês encontrarão. Mas as coisas sobre as quais vocês me perguntaram naqueles dias, e que eu não lhes contei naquele dia — agora estou disposto a contá-las, e vocês não as estão buscando.”[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção relativa pode ser entendida no singular (“aquilo sobre o qual”) ou no plural (“as coisas sobre as quais”). As referências pronominais plurais no contexto favorecem o plural.
    reason: textual_variant
  - marker: b
    text: 'A segmentação morfológica impressa pode ser lida como “vocês perguntaram a respeito delas”, enquanto a linha normalizada sustenta “vocês me perguntaram”. A tradução procura preservar as duas relações: perguntaram a Jesus a respeito dessas coisas.'
    reason: textual_variant
  - marker: c
    text: A expressão copta traduzida por “estou disposto a” também pode significar “estou prestes a” ou “pretendo”.
    reason: lexical_alternative
  - marker: d
    text: “Busquem, e vocês encontrarão” também aparece em Mateus 7.7 e Lucas 11.9; aqui, porém, a declaração segue em outra direção, contrastando o que ocorreu antes com o que acontece agora.
    reason: cross_reference
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: busquem / buscando
  rationale: Expressa procura ativa e mantém, em português natural, o par conciso com ϭⲓⲛⲉ.
- source_word: ϭⲓⲛⲉ
  choice: encontrarão
  rationale: É o correspondente direto de ϣⲓⲛⲉ e preserva a formulação proverbial “busquem... encontrarão”.
- source_word: ⲁⲗⲗⲁ
  choice: mas
  rationale: Conjunção adversativa simples, adequada tanto à virada inicial quanto ao contraste final.
- source_word: ⲛⲉⲧⲁ… / ⲡⲉⲧⲉⲣⲉ…
  choice: as coisas sobre as quais
  rationale: Embora a normalização apresente uma construção relativa singular, o manuscrito e as referências pronominais plurais favorecem o sentido plural.
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: me perguntaram ... sobre as quais
  rationale: Preserva tanto o destinatário da pergunta (“me”) quanto a matéria sobre a qual se perguntou.
- source_word: ⲛⲛⲓϩⲟⲟⲩ
  choice: naqueles dias
  rationale: Equivalente temporal idiomático que mantém o contraste com “naquele dia” e “agora”.
- source_word: ϫⲱ (ⲟⲩ)
  choice: contei / contá-las
  rationale: Com conteúdo e destinatário, “contar” é mais natural em português do que “dizer” e permite preservar os objetos.
- source_word: ⲙ̄ⲫⲟⲟⲩ ⲉⲧⲙ̄ⲙⲁⲩ
  choice: naquele dia
  rationale: Conserva a referência explícita a “dia” e sua repetição retórica após “naqueles dias”.
- source_word: ⲧⲉⲛⲟⲩ
  choice: agora
  rationale: Equivalente temporal direto.
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: estou disposto a contá-las
  rationale: A construção exprime disposição ou intenção; “estou disposto” ressalta o contraste com o fato de não ter contado antes, sem excluir a nuance de intenção.
- source_word: ⲛⲥⲱⲟⲩ
  choice: as ... buscando
  rationale: Traduz o objeto plural de “buscar” de modo corrente e claro em português.
theological_decisions:
- issue: Natureza da disposição presente de Jesus
  choice: “estou disposto a contá-las”
  alternative: “estou prestes a contá-las”
  rationale: A perífrase copta admite prontidão, vontade ou intenção. A tradução não transforma a frase em promessa temporal inequívoca, preservando sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. A ordem foi levemente ajustada para clareza, mas foram preservados os contrastes “naqueles dias / naquele dia / agora”, a repetição de buscar e o encadeamento retórico do copta.
