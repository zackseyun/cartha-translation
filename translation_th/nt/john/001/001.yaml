id: JHN.1.1
reference: John 1:1
language:
  code: th
  name: Thai
  native_name: ไทย
  variant: modern standard Thai
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: th
  text: ในปฐมกาล[a] พระวาทะทรงดำรงอยู่ และพระวาทะทรงอยู่กับพระเจ้า และพระวาทะทรงเป็นพระเจ้า[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ถ้อยคำนี้สะท้อนปฐมกาล 1:1 และเชื่อมโยงพระวาทะเข้ากับจุดเริ่มต้นของการทรงสร้าง
    reason: cross_reference
  - marker: b
    text: หรืออาจอธิบายความหมายได้ว่า “พระวาทะมีลักษณะเป็นพระเจ้า” หรือ “พระเจ้าทรงเป็นอย่างไร พระวาทะก็เป็นอย่างนั้น” คำว่า “พระเจ้า” ในวลีสุดท้ายไม่มีคำนำหน้านามในภาษากรีกและวางอยู่ก่อนกริยา ซึ่งอาจเน้นลักษณะหรือสภาวะของพระวาทะ ขณะเดียวกันวลีก่อนยังกล่าวถึงพระวาทะว่าอยู่กับ “พระเจ้า”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: ในปฐมกาล
  rationale: รักษาเสียงสะท้อนถึงปฐมกาล 1:1 และสำนวนว่าด้วยจุดเริ่มต้นของการทรงสร้าง โดยใช้ภาษาพระคัมภีร์ที่ยังเข้าใจได้ในภาษาไทยปัจจุบัน
- source_word: ἦν
  choice: ดำรงอยู่ / อยู่ / เป็น
  rationale: คำกริยา εἰμί ต้องถ่ายทอดต่างกันตามส่วนเติมเต็มในภาษาไทย เพื่อให้เป็นธรรมชาติ โดยยังคงลำดับและจังหวะซ้ำสามครั้งของต้นฉบับ
- source_word: ὁ λόγος
  choice: พระวาทะ
  rationale: ใช้เป็นพระนามเชิงเทววิทยาของบุคคลหนึ่ง และยังคงมิติของถ้อยคำ การสำแดง และการสื่อสารไว้ โดยไม่จำกัดความหมายให้เหลือเพียง “ข่าวสาร” หรือถอดเสียงว่า “โลโกส”
- source_word: πρὸς τὸν θεόν
  choice: อยู่กับพระเจ้า
  rationale: ถ่ายทอดความสัมพันธ์และการอยู่ร่วมต่อพระพักตร์ของบุคคลทั้งสองอย่างเป็นธรรมชาติในภาษาไทย ขณะเดียวกันก็รักษาความแตกต่างระหว่างพระวาทะกับพระเจ้าที่กล่าวถึงในวลีนี้
- source_word: τὸν θεόν
  choice: พระเจ้า
  rationale: คำนำหน้านามในภาษากรีกชี้ถึงพระเจ้าอย่างเฉพาะเจาะจง ส่วนภาษาไทยไม่ต้องมีคำเทียบตรงกับคำนำหน้านามดังกล่าว
- source_word: θεὸς ἦν ὁ λόγος
  choice: พระวาทะเป็นพระเจ้า
  rationale: รักษาคำยืนยันอันหนักแน่นของต้นฉบับเกี่ยวกับสภาวะของพระวาทะ โดยไม่กลับลำดับเป็น “พระเจ้าคือพระวาทะ” ซึ่งอาจทำให้เข้าใจว่าบุคคลทั้งสองไม่มีความแตกต่างกัน
theological_decisions:
- issue: การแปล θεός ซึ่งไม่มีคำนำหน้านามในวลีสุดท้าย
  choice: พระวาทะเป็นพระเจ้า
  alternative: พระวาทะมีสภาวะเป็นพระเจ้า / พระเจ้าทรงเป็นอย่างไร พระวาทะก็เป็นอย่างนั้น
  rationale: ตำแหน่งของ θεός เน้นคุณลักษณะหรือสภาวะของพระวาทะ มิได้ทำให้คำนี้ไม่ชี้เฉพาะจนหมายถึง “พระเจ้าหนึ่งองค์” และมิได้ระบุว่าพระวาทะเป็นบุคคลเดียวกันกับพระเจ้าที่กล่าวในวลีก่อน คำแปลหลักจึงคงทั้งคำยืนยันความเป็นพระเจ้าและความตึงเครียดด้านความแตกต่างระหว่างบุคคลไว้ ส่วนคำอธิบายเชิงคุณลักษณะอยู่ในเชิงอรรถ
translation_notes:
  register: ใช้ภาษาไทยมาตรฐานสมัยใหม่ที่สง่างามและอ่านออกเสียงได้คล่อง คำว่า “พระวาทะ” ทำหน้าที่เป็นพระนาม จึงใช้ซ้ำตามต้นฉบับแทนการใช้สรรพนาม ส่วน “ดำรงอยู่—อยู่กับ—เป็น” ปรับรูปกริยาให้เป็นธรรมชาติในแต่ละวลีโดยรักษาโครงสร้างสามตอนของภาษากรีก
