id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: th
  name: Thai
  native_name: ไทย
  variant: modern standard Thai
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: th
  text: “ลมหายใจเหนือบรรดาลมหายใจ[a]” โคเฮเลท[b]กล่าว “ลมหายใจเหนือบรรดาลมหายใจ ทุกสิ่งล้วนเป็นเพียงลมหายใจ”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: คำฮีบรู הֶבֶל (เฮเวล) แปลตามตัวอักษรว่า “ลมหายใจ” หรือ “ไอระเหย” หนังสือนี้ใช้คำดังกล่าว 38 ครั้ง โดยสื่อถึงสิ่งที่ผ่านไปอย่างรวดเร็ว จับไว้ไม่ได้ และความไม่ลงรอยระหว่างสิ่งที่คาดกับสิ่งที่เกิดขึ้น ไม่มีคำไทยคำเดียวที่ครอบคลุมนัยทั้งหมด จึงคงภาพว่า “ลมหายใจ” ไว้ วลี “ลมหายใจเหนือบรรดาลมหายใจ” ถ่ายทอดสำนวนฮีบรูที่แสดงขั้นสูงสุด เช่น “เพลงแห่งเพลงทั้งหลาย”
    reason: ปรับคำว่า “ไอ” ให้ชัดเจนขึ้น และปรับคำอธิบายให้สอดคล้องกับสำนวนขั้นสูงสุดที่แก้ไข
  - marker: b
    text: “โคเฮเลท” เป็นคำเรียกหรือชื่อภาษาฮีบรู ตามธรรมเนียมมักแปลว่า “อาจารย์” หรือ “นักเทศน์” แต่คำแปลทั้งสองต่างจำกัดขอบเขตความหมาย จึงถอดเสียงไว้
    reason: คงเชิงอรรถเดิม เพราะยังอธิบายการถอดเสียง קֹהֶלֶת ได้ถูกต้อง
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: ลมหายใจ / เพียงลมหายใจ
  rationale: คำฮีบรู הֶבֶל หมายตามตัวอักษรว่า “ลมหายใจ” หรือ “ไอ” และในปัญญาจารย์สื่อพร้อมกันถึงสิ่งที่ผ่านไปอย่างรวดเร็ว จับไว้ไม่ได้ และผิดไปจากที่คาด การคงภาพรูปธรรมว่า “ลมหายใจ” เปิดให้บริบทพัฒนานัยเหล่านี้ โดยเติม “เพียง” ในภาคแสดงเพื่อถ่ายทอดน้ำหนักเชิงลดทอน มิใช่อ้างว่าทุกสิ่งมีเนื้อสารเป็นลมหายใจจริง ๆ
- source_word: הֲבֵל הֲבָלִים
  choice: ลมหายใจแห่งลมหายใจทั้งหลาย
  rationale: คงโครงสร้างขั้นสูงสุดแบบฮีบรู “X แห่ง X ทั้งหลาย” ซึ่งเทียบได้กับ “เพลงแห่งเพลงทั้งหลาย” และ “อภิสุทธิสถาน” พร้อมรักษาภาพของลมหายใจไว้
- source_word: אָמַר
  choice: กล่าว
  rationale: รูปกริยาฮีบรูใช้เป็นสูตรแนะนำถ้อยแถลงทางวรรณกรรม ภาษาไทยใช้ “กล่าว” ได้อย่างเป็นธรรมชาติและสง่างามโดยไม่จำเป็นต้องระบุกาล
- source_word: קֹהֶלֶת
  choice: โคเฮเลท
  rationale: ถอดเสียงคำนาม/สมญาฮีบรูเพื่อไม่ตัดสินล่วงหน้าว่าหมายเฉพาะ “อาจารย์” หรือ “นักเทศน์”
- source_word: הַכֹּל
  choice: ทุกสิ่ง
  rationale: ถ่ายทอดขอบเขตที่ครอบคลุมทั้งหมดอย่างกระชับและเป็นธรรมชาติในภาษาไทย
theological_decisions:
- issue: การถ่ายทอดคำหลัก הֶבֶל
  choice: ใช้ภาพรูปธรรม “ลมหายใจ” และ “เพียงลมหายใจ”
  alternative: อนิจจัง / ไร้สาระ / เปล่าประโยชน์ / ว่างเปล่า / ไร้ความหมาย
  rationale: คำเชิงนามธรรมแต่ละคำจำกัดความหมายไว้ด้านใดด้านหนึ่ง และ “ไร้ความหมาย” อาจนำแนวคิดแบบสิ้นหวังหรือสุญนิยมเข้ามาเกินต้นฉบับ ภาพ “ลมหายใจ” รักษาความชั่วครู่ ความยากจะยึดจับ และความพลิกผันจากสิ่งที่คาดไว้
- issue: สถานะของ קֹהֶלֶת
  choice: ถอดเสียงว่า “โคเฮเลท”
  alternative: อาจารย์ / นักเทศน์ / ผู้ชุมนุมประชาชน
  rationale: ความหมายและหน้าที่ของคำเรียกนี้ไม่แน่นอนพอที่จะเลือกคำแปลเชิงตีความเพียงคำเดียว การถอดเสียงรักษาความเปิดกว้างของต้นฉบับ
translation_notes:
  register: ใช้ภาษาไทยมาตรฐานร่วมสมัยที่สง่างามและอ่านออกเสียงได้ดี คงคำซ้ำและโครงสร้างขั้นสูงสุดของฮีบรูโดยเจตนา เครื่องหมายอัญประกาศแยกคำประกาศของโคเฮเลทอย่างชัดเจน และวางเชิงอรรถตรงคำที่อธิบาย
