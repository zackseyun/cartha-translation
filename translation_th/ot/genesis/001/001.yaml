id: GEN.1.1
reference: Genesis 1:1
language:
  code: th
  name: Thai
  native_name: ไทย
  variant: modern standard Thai
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: th
  text: ในปฐมกาล เมื่อพระเจ้าทรงสร้างฟ้าสวรรค์และแผ่นดินโลก[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ตามธรรมเนียมแปลเป็นประโยคสมบูรณ์ว่า “ในปฐมกาล พระเจ้าทรงสร้างฟ้าสวรรค์และแผ่นดินโลก” แต่ภาษาฮีบรูใช้ בְּרֵאשִׁית ซึ่งไม่มีคำนำหน้านามชี้เฉพาะ ตามด้วยกริยา בָּרָא จึงอ่านได้อย่างเป็นธรรมชาติกว่าว่าเป็นอนุประโยคบอกเวลา คล้ายกับปฐมกาล 2:4ข โดยมีประโยคหลักอยู่ในข้อ 3 ว่า “พระเจ้าตรัสว่า ‘จงเกิดความสว่าง’”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: ในปฐมกาล เมื่อ…ทรงสร้าง
  rationale: คำ בְּרֵאשִׁית ไม่มีคำนำหน้านามชี้เฉพาะ และตามด้วยกริยารูปสมบูรณ์ จึงอ่านได้อย่างเป็นธรรมชาติว่าเป็นอนุประโยคบอกเวลา การแปลเช่นนี้ยังคงความหมายของ רֵאשִׁית ว่า “ปฐมกาล/จุดเริ่มต้น” ไว้ พร้อมบ่งชี้ว่าข้อความดำเนินต่อไปยังประโยคหลักในข้อ 3
- source_word: בָּרָא
  choice: ทรงสร้าง
  rationale: בָּרָא เป็นกริยามาตรฐานที่ใช้กล่าวถึงการสร้างโดยพระเจ้า คำว่า “ทรงสร้าง” ตรงความหมาย เป็นธรรมชาติในภาษาไทย และไม่ตีความเกินต้นฉบับว่าพระองค์ทรงสร้างด้วยกลไกใด
- source_word: אֱלֹהִים
  choice: พระเจ้า
  rationale: แม้รูปคำจะเป็นพหูพจน์ทางสัณฐานวิทยา แต่ใช้กับกริยาเอกพจน์ בָּרָא ในที่นี้ จึงหมายถึงพระเจ้าองค์เดียว
- source_word: אֵת
  choice: ไม่แปลโดยตรง (คำบ่งชี้กรรมตรง)
  rationale: אֵת ทำหน้าที่บ่งชี้กรรมตรงที่ชี้เฉพาะในภาษาฮีบรู ภาษาไทยถ่ายทอดหน้าที่นี้ด้วยโครงสร้างประโยคโดยไม่ต้องมีคำเทียบตรงตัว
- source_word: הַשָּׁמַיִם
  choice: ฟ้าสวรรค์
  rationale: คำนี้มีรูปพหูพจน์และในคู่คำ “ฟ้าสวรรค์และแผ่นดินโลก” หมายรวมถึงสรรพสิ่งที่ทรงสร้าง ภาษาไทยไม่จำเป็นต้องทำเครื่องหมายพหูพจน์ในคำนี้
- source_word: הָאָרֶץ
  choice: แผ่นดินโลก
  rationale: אָרֶץ อาจหมายถึง “แผ่นดิน” หรือ “โลก” แต่เมื่อจับคู่กับ “ฟ้าสวรรค์” ในบริบทจักรวาล จึงหมายถึงแผ่นดินโลก
theological_decisions:
- issue: วากยสัมพันธ์ของข้อความเปิดเรื่อง
  choice: 'อ่านเป็นอนุประโยคบอกเวลา: “ในปฐมกาล เมื่อพระเจ้าทรงสร้างฟ้าสวรรค์และแผ่นดินโลก—”'
  alternative: 'อ่านเป็นประโยคสมบูรณ์: “ในปฐมกาล พระเจ้าทรงสร้างฟ้าสวรรค์และแผ่นดินโลก”'
  rationale: รูป בְּרֵאשִׁית ที่ไม่มีคำนำหน้านามชี้เฉพาะ ตามด้วยกริยา בָּרָא สนับสนุนการอ่านเป็นอนุประโยคบอกเวลา และมีโครงสร้างคล้ายปฐมกาล 2:4ข กับโฮเชยา 1:2 อย่างไรก็ตาม การอ่านเป็นประโยคสมบูรณ์มีประวัติการสืบทอดยาวนาน จึงเก็บไว้ในเชิงอรรถโดยไม่ทำให้ข้อแตกต่างนี้ตัดสินหลักคำสอนเกินกว่าที่วากยสัมพันธ์จะรองรับ
translation_notes:
  register: ใช้ภาษาไทยมาตรฐานสมัยใหม่ที่สง่างามและอ่านเข้าใจง่าย คงคำคุ้นเคยในบริบทพระคัมภีร์อย่าง “ในปฐมกาล” และ “พระเจ้าทรงสร้าง” พร้อมใช้ขีดยาวท้ายข้อเพื่อแสดงว่าอนุประโยคยังดำเนินต่อไป
