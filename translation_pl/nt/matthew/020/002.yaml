  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: pl
  text: Uzgodniwszy z pracownikami stawkę jednego denara za dzień[a], posłał ich do swojej winnicy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denar był typową zapłatą robotnika za dzień pracy.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Uzgodniwszy
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą główne „posłał”; polski imiesłów uprzedni zachowuje tę relację zwięźle i naturalnie.
- source_word: δὲ
  choice: —
  rationale: Łagodny spójnik narracyjny nie wymaga tu osobnego odpowiednika w języku polskim; tok zdania jasno wyraża powiązanie z kontekstem.
- source_word: ἐργατῶν
  choice: z pracownikami
  rationale: Współczesne, neutralne określenie osób najętych do pracy, odpowiednie w kontekście winnicy.
- source_word: ἐκ δηναρίου
  choice: zapłatę po denarze
  rationale: Konstrukcja wskazuje uzgodnioną stawkę. Dodanie rzeczownika „zapłatę” naturalnie objaśnia sens idiomu, a „po denarze” zachowuje starożytną jednostkę pieniężną.
- source_word: τὴν ἡμέραν
  choice: za dzień
  rationale: Oddaje biernik czasu i określa stawkę dzienną bez dopowiadania, że chodzi koniecznie o cały dzień pracy.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Zwięzły i godny odpowiednik standardowego czasownika narracyjnego.
- source_word: ἀμπελῶνα
  choice: winnicy
  rationale: Bezpośredni i utrwalony polski odpowiednik.
- source_word: αὐτοῦ
  choice: swojej
  rationale: Polski zaimek zwrotny naturalnie wskazuje, że winnica należy do podmiotu czasownika „posłał”.
