  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: pl
  text: A ci, którzy przyszli około jedenastej godziny, otrzymali po denarze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denar był powszechną rzymską monetą srebrną, zwykle uznawaną za typową zapłatę robotnika za dzień pracy.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Naturalny polski spójnik narracyjny, który zachowuje prostą więź z poprzednim zdarzeniem.
- source_word: ἐλθόντες
  choice: którzy przyszli
  rationale: Naturalnie oddaje imiesłów aorystu odnoszący się do tej grupy, bez dodawania niewyrażonego wprost czasownika „wynajęto”.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: ci, którzy przyszli około jedenastej godziny
  rationale: Konstrukcja identyfikuje osoby związane z porą około jedenastej godziny; „około” zachowuje temporalny sens περὶ.
- source_word: ἔλαβον
  choice: otrzymali
  rationale: W kontekście wypłaty należności czasownik naturalnie oznacza przyjęcie zapłaty.
- source_word: ἀνὰ
  choice: po
  rationale: 'Polska konstrukcja „po denarze” idiomatycznie i precyzyjnie oddaje sens dystrybutywny: jeden denar na osobę.'
- source_word: δηνάριον
  choice: denarze
  rationale: Zachowuje historyczną nazwę monety obecną w tekście greckim; jej przybliżoną wartość objaśnia przypis.
theological_decisions: []
