id: MAT.20.13
reference: Matthew 20:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: pl
  text: 'On jednak odpowiedział jednemu z nich: „Przyjacielu, nie wyrządzam ci krzywdy. Czy nie umówiłeś się ze mną na denara[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denar był powszechnie używaną rzymską monetą srebrną; często stanowił typową zapłatę robotnika za dzień pracy.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: odpowiedział
  rationale: Polskie „odpowiedział” naturalnie oddaje semicki i grecki zwrot z imiesłowem oraz czasownikiem mówienia, bez niezręcznego dosłownego „odpowiadając, powiedział”.
- source_word: ἑνὶ αὐτῶν
  choice: jednemu z nich
  rationale: Celownik liczby pojedynczej z dopełniaczem cząstkowym wskazuje na jedną osobę należącą do wspomnianej grupy.
- source_word: Ἑταῖρε
  choice: Przyjacielu
  rationale: To naturalny polski odpowiednik formy wołacza; w tym kontekście może brzmieć powściągliwie lub dystansująco, nie musi oznaczać serdecznej zażyłości.
- source_word: οὐκ ἀδικῶ σε
  choice: nie wyrządzam ci krzywdy
  rationale: 'Sformułowanie zachowuje osobowy przedmiot czasownika ἀδικέω oraz jego sens: postępować wobec kogoś niesprawiedliwie lub krzywdząco.'
- source_word: οὐχὶ
  choice: Czy nie
  rationale: Wprowadza pytanie retoryczne, na które mówiący oczekuje odpowiedzi twierdzącej.
- source_word: δηναρίου
  choice: na denara
  rationale: Dopełniacz określa uzgodnioną zapłatę; zachowano historyczną nazwę monety zamiast zastępować ją interpretacyjnym określeniem wartości.
- source_word: συνεφώνησάς μοι
  choice: umówiłeś się ze mną
  rationale: Zwrot naturalnie wyraża wcześniejsze uzgodnienie warunków między gospodarzem a robotnikiem i odpowiada aspektowi dokonanemu aorystu.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny rejestr dialogowy. Zachowano „denara” jako realię historyczną, a informację o jego przybliżonej wartości podano w przypisie. Partykułę δέ oddano przez „jednak”, aby zaznaczyć odpowiedź gospodarza na zarzut.
