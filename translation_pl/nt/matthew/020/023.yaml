revisions:
- from: 'Powiedział im: „Mój kielich wprawdzie wypijecie[a]. Lecz nie do mnie należy przyznać komuś, by zasiadł po mojej prawej i lewej stronie[b]; zasiądą tam ci, dla których zostało to przygotowane przez mojego Ojca”.'
  to: 'Powiedział im: „Mój kielich wprawdzie wypijecie[a], lecz nie do mnie należy przyznać miejsc po mojej prawej i po lewej stronie[b]; są one dla tych, dla których przygotował je mój Ojciec”.'
  rationale: Korekta usuwa explicytne „zasiądą tam”, którego nie ma w greckiej konstrukcji eliptycznej, i oddaje δοῦναι przez „przyznać miejsc”. Zastosowanie czynnej formy „przygotował je mój Ojciec” pozostaje semantycznie równoważne greckiemu perfectum strony biernej z wyrażonym wykonawcą („zostały przygotowane przez mojego Ojca”), a w polszczyźnie brzmi naturalniej. Przypisy zachowują właściwe kotwice i zakres.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:10:48Z'
review_pass:
  verdict: revise
  source_fidelity: Należy skorygować końcową część zdania. Greckie ἀλλ’ οἷς ἡτοίμασται jest eliptyczne („lecz [dla] tych, dla których zostało przygotowane”) i nie stwierdza wprost „zasiądą tam ci”. Ponadto δοῦναι dotyczy udzielenia miejsc po prawej i lewej stronie, nie ogólnie przyznania czegoś „komuś”.
  naturalness: Proponowana korekta zachowuje współczesną, godną polszczyznę. „Nie do mnie należy przyznać miejsc” jest jasne i idiomatyczne w kontekście zaszczytnych miejsc, a „lecz są one dla tych” naturalnie uzupełnia grecką elipsę bez zmiany sensu.
  terminology: „Kielich”, „Ojciec” oraz obraz miejsc po prawej i po lewej stronie są trafne. Zachowano teologiczne napięcie wypowiedzi, bez harmonizującego dopowiedzenia.
  issues:
  - severity: medium
    issue: Dodano bezpośrednie stwierdzenie „zasiądą tam ci”.
    rationale: Choć taki skutek jest kontekstowo implikowany, grecki tekst zachowuje elipsę i mówi jedynie, że miejsca są dla tych, dla których przygotował je Ojciec. Przekład nie powinien zamieniać tej konstrukcji w niezależne orzeczenie o ich zasiadaniu.
  - severity: low
    issue: „Przyznać komuś, by zasiadł” mniej bezpośrednio oddaje przedmiot czasownika δοῦναι.
    rationale: W tym zdaniu chodzi o udzielenie/przyznanie miejsc po prawej i lewej stronie. Nazwanie tych miejsc wprost zwiększa precyzję i usuwa nieco ciężką konstrukcję z „komuś”.
