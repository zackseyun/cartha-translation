  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: pl
  text: 'Powiedział im: „Mój kielich wprawdzie wypijecie[a], lecz nie do mnie należy przyznać miejsc po mojej prawej i po lewej stronie[b]; są one dla tych, dla których przygotował je mój Ojciec”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kielich” jest obrazem cierpienia lub wyznaczonego losu Jezusa, w którym będą mieli udział także jego uczniowie.
    reason: cross_reference
  - marker: b
    text: 'Dosłownie: „zasiąść po mojej prawej i po lewej stronie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Powiedział im
  rationale: Grecki czas teraźniejszy historyczny oddano naturalnym w polskiej narracji czasem przeszłym.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Mój kielich wprawdzie wypijecie
  rationale: Zachowano obraz kielicha bez objaśniania go w tekście głównym; „wprawdzie” oddaje afirmująco-kontrastową funkcję μὲν.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: by zasiadł po mojej prawej i lewej stronie
  rationale: Polskie „po prawej i lewej stronie” naturalnie określa zaszczytne miejsca obok Jezusa, zachowując sens obu wyrażeń przyimkowych.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: nie do mnie należy przyznać komuś
  rationale: „Przyznać” odpowiada kontekstowi wyznaczania zaszczytnych miejsc, a sformułowanie zachowuje bez łagodzenia stwierdzenie Jezusa.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: zasiądą tam ci, dla których zostało to przygotowane
  rationale: Grecka konstrukcja jest eliptyczna; uzupełnienie czasownika w języku polskim zapewnia jasność, a „zostało przygotowane” oddaje perfectum strony biernej.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: przez mojego Ojca
  rationale: Bezpośrednio oddaje osobowego wykonawcę czynności w konstrukcji biernej, bez dodawania niewystępującego w grece słowa „jedynie”.
theological_decisions:
- issue: Chrystologiczne napięcie w słowach „nie do mnie należy”
  choice: Zachować stwierdzenie bez dodatkowego wyjaśnienia ograniczającego lub harmonizującego.
  alternative: Dodać sens „nie do mnie należy bez zgody Ojca” albo „nie ja sam o tym rozstrzygam”.
  rationale: Tekst źródłowy nie zawiera takich dopowiedzeń. Przekład powinien zachować jego własne napięcie dotyczące roli Jezusa i Ojca.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym charakterze. Zachowano metaforę kielicha i teologiczne napięcie wypowiedzi; elipsę grecką rozwinięto tylko w zakresie koniecznym dla naturalnej składni polskiej.
