  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: pl
  text: Nie tak będzie wśród was[a]. Lecz kto chciałby stać się wielkim wśród was, będzie waszym sługą.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie tak jest wśród was”. W tekście greckim występuje czas przyszły („będzie”), który może wyrażać, jak nie powinno być wśród uczniów Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Nie tak będzie wśród was
  rationale: 'Zachowano czas przyszły ἔσται, który w tym pouczeniu może mieć siłę normatywną: tak nie ma być we wspólnocie uczniów. „Wśród was” naturalnie oddaje społeczne znaczenie ἐν ὑμῖν.'
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Lecz kto by chciał
  rationale: Połączenie zaimka względnego z ἄν i trybem łączącym wyraża warunek ogólny i nieokreślony. Polski zwrot „kto by chciał” zachowuje zarówno tę otwartość, jak i wolitywne znaczenie θέλῃ.
- source_word: μέγας γενέσθαι
  choice: stać się wielki
  rationale: „Stać się” zachowuje dynamiczne, ingresywne znaczenie γενέσθαι, zamiast sprowadzać wypowiedź do statycznego „być wielkim”.
- source_word: διάκονος
  choice: sługa
  rationale: W tym kontekście διάκονος oznacza osobę usługującą innym. „Sługa” zachowuje konkretny obraz służby, nie sugerując późniejszego urzędu kościelnego, jak mogłoby to czynić „diakon”.
- source_word: ὑμῶν
  choice: waszym
  rationale: Forma dzierżawcza „waszym” naturalnie oddaje grecki dopełniacz ὑμῶν i jego znaczenie relacyjne.
theological_decisions:
- issue: Charakter wielkości we wspólnocie uczniów Jezusa
  choice: Wypowiedź przedstawiono jako normatywne odwrócenie świeckiej hierarchii, zachowując konkretny język służby.
  alternative: Odczytać διάκονος jako nazwę urzędu kościelnego albo zastąpić obraz sługi ogólną ideą pokory.
  rationale: Kontekst przeciwstawia sposób sprawowania władzy przez władców narodów zasadzie obowiązującej uczniów. „Sługa” nie instytucjonalizuje tego określenia ani nie osłabia jego konkretności.
translation_notes:
  register: Współczesny, godny i jasno brzmiący język. Zachowano przyszłą formę orzeczenia oraz powtórzenie „wśród was”, aby oddać budowę i nacisk tekstu greckiego.
