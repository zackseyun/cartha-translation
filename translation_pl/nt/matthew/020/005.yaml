  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: pl
  text: Oni zaś odeszli. Wyszedł ponownie około szóstej i dziewiątej godziny[a] i postąpił tak samo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To znaczy około południa i trzeciej po południu, według żydowskiego sposobu liczenia godzin.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Oni więc poszli
  rationale: Zaimek domyślny odnosi się do wcześniej wspomnianych robotników; δέ jest łagodnym spójnikiem narracyjnym, a ἀπῆλθον oznacza, że odeszli zgodnie z poleceniem. „Poszli” naturalnie łączy ten werset z poprzednim kontekstem.
- source_word: πάλιν
  choice: znów
  rationale: Wyraża powtórzenie czynności i brzmi naturalnie we współczesnej polskiej narracji.
- source_word: ἐξελθὼν
  choice: wyszedł
  rationale: Grecki imiesłów aorystu opisuje czynność poprzedzającą lub towarzyszącą głównej czynności. Polski czasownik osobowy pozwala oddać ją jasno i naturalnie bez rozstrzygania ponad potrzebę ścisłej relacji czasowej.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: około szóstej i dziewiątej godziny
  rationale: Zachowano starożytny sposób liczenia godzin oraz przybliżenie wyrażone przez περὶ. Współczesne odpowiedniki podano w przypisie.
- source_word: ἐποίησεν ὡσαύτως
  choice: postąpił tak samo
  rationale: Połączenie ποιέω z ὡσαύτως odsyła do wcześniejszego działania gospodarza. „Postąpił tak samo” jest zwięzłe, idiomatyczne i zachowuje porównawczy sens wyrażenia.
