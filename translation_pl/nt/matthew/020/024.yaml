  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: pl
  text: A gdy pozostałych dziesięciu to usłyszało, oburzyli się na obu braci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: pozostałych dziesięciu
  rationale: Dosłownie „dziesięciu”; dodanie „pozostałych” naturalnie sygnalizuje, że chodzi o innych dziesięciu uczniów w odróżnieniu od dwóch braci, zgodnie z kontekstem.
- source_word: ἠγανάκτησαν
  choice: oburzyli się
  rationale: Czasownik wyraża silne niezadowolenie lub oburzenie; polskie „oburzyli się” zachowuje tę siłę.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: na dwóch braci
  rationale: W tym kontekście περί wskazuje osoby będące przedmiotem oburzenia. Idiomatyczne polskie „oburzyć się na kogoś” nie przesądza dokładnego powodu ich reakcji.
