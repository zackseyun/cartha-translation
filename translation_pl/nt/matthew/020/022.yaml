  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: pl
  text: 'Jezus zaś odpowiedział: „Nie wiecie, o co prosicie. Czy możecie wypić kielich[a], który ja mam wypić?” Odpowiedzieli mu: „Możemy”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można objaśnić: „kielich cierpienia, który mam wypić”. W grece pozostaje metafora „kielicha”, częsty w Biblii obraz wyznaczonego komuś udziału, zwłaszcza cierpienia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jezus zaś odpowiedział
  rationale: Polskie „odpowiedział” naturalnie oddaje cały grecki zwrot narracyjny; dosłowne „odpowiedział i powiedział” byłoby sztucznym powtórzeniem. „Zaś” zachowuje łagodne przejście lub kontrast wyrażony przez δέ.
- source_word: Οὐκ οἴδατε
  choice: Nie wiecie
  rationale: Zachowuje podstawowe znaczenie οἶδα, bez interpretacyjnego przesunięcia ku „nie rozumiecie”.
- source_word: τί αἰτεῖσθε
  choice: o co prosicie
  rationale: To naturalny polski odpowiednik prośby wyrażonej przez αἰτέομαι; forma teraźniejsza zachowuje aktualny charakter ich żądania.
- source_word: δύνασθε πιεῖν
  choice: Czy możecie wypić
  rationale: „Możecie” jasno wyraża zdolność lub gotowość, a „wypić” naturalnie oddaje dokonany sens infinitivu aorystu w tym kontekście.
- source_word: τὸ ποτήριον
  choice: kielich
  rationale: Zachowuje biblijną metaforę obecną w grece, nie zastępując jej interpretacyjnym wyjaśnieniem cierpienia lub śmierci.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: który ja mam wypić
  rationale: „Mam wypić” wyraża przyszłe, czekające Jezusa doświadczenie, a jawne „ja” odzwierciedla obecność emfatycznego ἐγώ.
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: 'Odpowiedzieli mu: „Możemy”'
  rationale: Czas przeszły jest naturalny w polskiej narracji mimo greckiego praesens historicum. „Odpowiedzieli” jasno oddaje funkcję wypowiedzi w dialogu, a „Możemy” zachowuje więź leksykalną z wcześniejszym δύνασθε.
theological_decisions:
- issue: Metaforyczny sens kielicha
  choice: Pozostawić „kielich” w tekście głównym bez utożsamiania go wprost z cierpieniem lub śmiercią.
  alternative: „kielich cierpienia” albo „cierpienie, które mam znieść”
  rationale: Grecki tekst zachowuje nośną teologicznie metaforę wyznaczonego udziału. W kontekście wskazuje ona na nadchodzące cierpienie Jezusa, lecz tekst główny nie powinien redukować jej do jednego objaśnienia.
translation_notes:
  register: Współczesny, godny i zrozumiały polski. Zachowano metaforę oraz bezpośredniość dialogu, unikając zarówno niezręcznej kalki „odpowiedział i powiedział”, jak i wyznaniowo nacechowanych dopowiedzeń. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze standardową składnią, bez dodawania niewyrażonego w grece nacechowania typograficznego.
