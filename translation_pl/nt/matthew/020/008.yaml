id: MAT.20.8
reference: Matthew 20:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: pl
  text: 'A gdy nastał wieczór, właściciel winnicy mówi do swojego zarządcy: „Zwołaj robotników i wypłać im należność, zaczynając od ostatnich, a kończąc na pierwszych”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: właściciel winnicy
  rationale: W tym kontekście κύριος oznacza osobę mającą władzę nad winnicą, czyli jej właściciela; wybór jest naturalny po polsku i nie wprowadza niezamierzonego tytułu religijnego.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: do swojego zarządcy
  rationale: ἐπίτροπος oznacza osobę, której powierzono nadzór i administrowanie; „zarządca” trafnie oddaje funkcję w kontekście wypłaty robotnikom.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: wypłać im należność
  rationale: μισθός to zapłata należna za pracę; „należność” zachowuje aspekt tego, co ma zostać wypłacone, bez zawężania do nowoczesnej pensji.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: zaczynając od ostatnich, a kończąc na pierwszych
  rationale: Naturalne polskie sformułowanie jasno oddaje kolejność wypłaty wyrażoną przez konstrukcję „od ostatnich aż do pierwszych”.
theological_decisions:
- issue: Czas teraźniejszy λέγει w narracji
  choice: mówi
  alternative: powiedział
  rationale: Zachowano grecki czas teraźniejszy historyczny, zgodnie ze źródłem i najnowszą rewizją, mimo że polska narracja często preferuje czas przeszły.
- issue: Znaczenie κύριος w przypowieści
  choice: właściciel
  alternative: pan
  rationale: Kontekst bezpośrednio wskazuje na właściciela winnicy. „Właściciel” nie przesądza sposobu alegorycznej interpretacji przypowieści ani nie sugeruje wprost tytułu „Pan”.
translation_notes:
  register: Współczesny, godny i przystępny język narracyjny. Zachowano teraźniejszy czas historyczny „mówi”; dialog brzmi naturalnie, a terminologia odpowiada realiom zarządzania winnicą i wypłaty za pracę.
