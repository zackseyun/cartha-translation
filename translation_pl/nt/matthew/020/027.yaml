  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: pl
  text: A kto chce być wśród was pierwszy, będzie waszym niewolnikiem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „sługą”. Greckie słowo doulos jest mocniejsze niż określenie użyte w poprzednim wersecie i często oznacza niewolnika albo sługę pozostającego w trwałej zależności.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: kto by chciał
  rationale: Zaimek względny z ἄν i trybem łączącym wyraża warunek nieokreślony lub ogólny. Konstrukcja „kto by chciał” brzmi naturalnie po polsku i zachowuje zarówno nieokreśloność, jak i znaczenie woli.
- source_word: ἐν ὑμῖν
  choice: wśród was
  rationale: W kontekście pozycji we wspólnocie wyrażenie oznacza miejsce w hierarchii grupy, dlatego „wśród was” jest bardziej trafne niż czysto przestrzenne „pośród was” lub „w was”.
- source_word: εἶναι πρῶτος
  choice: być pierwszy
  rationale: Bezokolicznik z πρῶτος mówi o dążeniu do najwyższej pozycji. Bezpośredni polski odpowiednik zachowuje prostotę i siłę wypowiedzi.
- source_word: ἔσται
  choice: będzie
  rationale: Zachowano formę czasu przyszłego. W kontekście ma ona również siłę normatywną, lecz nie zastąpiono jej jednoznacznym „musi być”, aby nie usuwać napięcia obecnego w grece.
- source_word: ὑμῶν
  choice: waszym
  rationale: 'Dopełniacz wskazuje relację do całej grupy: osoba pragnąca pierwszeństwa ma stać się niewolnikiem pozostałych.'
- source_word: δοῦλος
  choice: niewolnikiem
  rationale: δοῦλος jest terminem mocniejszym niż διάκονος w poprzednim wersecie i zwykle oznacza niewolnika, czyli osobę pozostającą w zależności od pana. „Niewolnik” zachowuje zamierzoną eskalację oraz radykalny charakter wypowiedzi.
theological_decisions:
- issue: Oddanie δοῦλος w wypowiedzi o uczniostwie
  choice: niewolnikiem
  alternative: sługą; poddanym sługą
  rationale: Wypowiedź przeciwstawia pragnienie pierwszeństwa radykalnemu uniżeniu. Ponieważ poprzedni werset używa innego terminu oznaczającego sługę, tłumaczenie „niewolnik” pozwala zachować wyraźne wzmocnienie bez narzucania interpretacji wyznaniowej.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano paralelną składnię sentencji oraz przyszłe „będzie”, które w kontekście ma również wydźwięk normatywny. Mocne „niewolnikiem” odtwarza kontrast leksykalny z poprzednim wersetem.
