source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: pl
  text: 'A oto dwaj niewidomi, siedzący przy drodze, usłyszeli, że Jezus przechodzi obok, i zawołali: „Panie, zmiłuj się nad nami, Synu Dawida!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Naturalny, podniosły polski wykładnik narracyjny, który zachowuje funkcję zwrócenia uwagi i żywość opowiadania.
- source_word: δύο τυφλοὶ
  choice: dwaj niewidomi
  rationale: Forma „dwaj” jasno wskazuje na dwóch mężczyzn, zgodnie z męskim rodzajem greckiego rzeczownika, a „niewidomi” jest współczesnym i godnym określeniem.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: siedzący przy drodze
  rationale: Bezpośrednie i naturalne oddanie imiesłowu oraz położenia przy drodze.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: usłyszeli, że Jezus przechodzi
  rationale: Grecki imiesłów aorystu oddano jako wcześniejszą czynność w płynnej polskiej składni; czas teraźniejszy „przechodzi” zachowuje żywość mowy zależnej wynikającą z greckiego παράγει.
- source_word: ἔκραξαν λέγοντες
  choice: zawołali
  rationale: „Zawołali” naturalnie zawiera zarówno intensywność κράζω, jak i wprowadzenie wypowiedzi; osobne „mówiąc” byłoby po polsku zbędne i sztywne.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od „Pan” zachowuje pełen szacunku zwrot oraz możliwy ciężar chrystologiczny, szczególnie w połączeniu z tytułem „Syn Dawida”.
- source_word: ἐλέησον ἡμᾶς
  choice: zmiłuj się nad nami
  rationale: Utrwalone, naturalne i znaczeniowo ścisłe oddanie prośby o miłosierną pomoc.
- source_word: υἱὸς Δαυίδ
  choice: Synu Dawida
  rationale: Wołacz zachowuje bezpośredni zwrot, a tradycyjna forma tytułu utrzymuje jego Dawidowe i mesjańskie brzmienie.
theological_decisions:
- issue: Znaczenie κύριος w bezpośrednim zwrocie do Jezusa
  choice: Panie
  alternative: Nauczycielu / Proszę pana
  rationale: W zestawieniu z „Synu Dawida” zwrot ma charakter pełen czci i potencjalnie chrystologiczny. „Panie” zachowuje tę wagę, nie rozstrzygając ponad tekst pełnego zakresu rozumienia mówiących.
- issue: Mesjański charakter υἱὸς Δαυίδ
  choice: Synu Dawida
  alternative: Potomku Dawida
  rationale: Dosłowny tytuł jest rozpoznawalnym w Ewangelii Mateusza określeniem mesjańskim. „Potomku Dawida” spłaszczałoby jego tytularny i królewski wydźwięk.
translation_notes:
  register: Współczesna, godna polszczyzna o lekko podniosłym tonie biblijnym. Zachowano narracyjne „A oto”, tradycyjne „zmiłuj się” i mesjański tytuł, unikając sztucznego kalkowania greckiego imiesłowu λέγοντες.
