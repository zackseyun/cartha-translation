source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: pl
  text: 'On zaś powiedział do niej: „Czego chcesz?” Odpowiedziała mu: „Powiedz, żeby ci dwaj moi synowie zasiedli, jeden po twojej prawej stronie, a drugi po twojej lewej stronie, w twoim królestwie[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Królestwo” może tu także oznaczać „królowanie” lub „władzę królewską”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Czego chcesz?
  rationale: Naturalne, bezpośrednie pytanie w nowoczesnej polszczyźnie, zachowujące prostotę greckiego θέλεις.
- source_word: Εἰπὲ
  choice: Powiedz
  rationale: Zachowuje podstawowe znaczenie trybu rozkazującego od λέγω. Kontekst sugeruje wypowiedź ustanawiającą taki porządek, lecz przekład nie zastępuje prostego czasownika bardziej interpretacyjnym „spraw” lub „pozwól”.
- source_word: ἵνα καθίσωσιν
  choice: żeby ... zasiedli
  rationale: „Żeby” naturalnie wprowadza treść prośby, a „zasiedli” wyraża zajęcie wyznaczonych miejsc zaszczytu, nie sugerując biernego posadzenia.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: ci dwaj moi synowie
  rationale: Oddaje zaimek wskazujący οὗτοι, liczebnik δύο oraz osobiste μου w naturalnym polskim szyku.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: jeden po twojej prawej stronie, a drugi po lewej
  rationale: Naturalny polski odpowiednik przestrzennego idiomu, z zachowaniem symetrycznego układu miejsc po obu stronach Jezusa.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: w twoim królestwie
  rationale: „Królestwo” jest naturalnym i utrwalonym odpowiednikiem βασιλεία; nie wyklucza sensu królowania lub władzy królewskiej.
theological_decisions:
- issue: Charakter miejsc przy Jezusie w jego królestwie
  choice: Prośba o miejsca po prawej i lewej stronie w jego królestwie
  alternative: Wyraźne określenie ich jako miejsc w ziemskim królestwie mesjańskim albo w ostatecznym królestwie niebiańskim
  rationale: Tekst wskazuje na zaszczytne miejsca przy królu, ale nie rozstrzyga fazy ani natury królestwa; przekład zachowuje tę otwartość.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Powiedz” świadomie zachowuje dosłowną wartość Εἰπὲ, mimo że w kontekście wypowiedź ma być skutecznym ustanowieniem. Zastosowano polski cudzysłów i naturalny szyk zdania.
