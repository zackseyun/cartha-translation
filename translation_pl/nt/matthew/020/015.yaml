id: MAT.20.15
reference: Matthew 20:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: pl
  text: Czy nie wolno mi zrobić z tym, co moje, tego, co chcę? Czy też patrzysz złym okiem, ponieważ ja jestem dobry?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Czy jesteś zazdrosny, ponieważ ja jestem dobry?” Wyrażenie „patrzeć złym okiem” oznacza tu zawiść lub niechęć wobec czyjejś dobroci bądź hojności.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: czy nie wolno mi
  rationale: Oddaje znaczenie dozwolenia i uprawnienia w naturalnym polskim pytaniu retorycznym.
- source_word: ὃ θέλω ποιῆσαι
  choice: zrobić… tego, co chcę
  rationale: Naturalnie wyraża osobistą wolę właściciela bez archaizowania.
- source_word: ἐν τοῖς ἐμοῖς
  choice: z tym, co moje
  rationale: Jasno wskazuje na należący do gospodarza majątek i odpowiada polskiej składni czasownika „zrobić”.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: patrzysz złym okiem
  rationale: Polski idiom zachowuje obraz oka oraz jego negatywne, zawistne lub niechętne zabarwienie, a brzmi naturalniej niż dosłowne „twoje oko jest złe”.
- source_word: ἀγαθός
  choice: dobry
  rationale: Zachowuje podstawowe znaczenie przymiotnika oraz kontrast między złym okiem robotnika a dobrocią gospodarza, nie zawężając sensu wyłącznie do hojności.
theological_decisions:
- issue: Czy w tekście głównym objaśnić idiom ὁ ὀφθαλμός σου πονηρός
  choice: Zachować obraz w naturalnym polskim wyrażeniu „patrzysz złym okiem”
  alternative: „jesteś zazdrosny” lub „zawistnie patrzysz”
  rationale: Takie tłumaczenie zachowuje źródłową metaforę i kontrast ze słowem „dobry”, nie rozstrzygając całkowicie, czy chodzi o zazdrość, zawiść, czy pełną niechęci urazę. Przypis podaje interpretacyjną alternatywę.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk pierwszego pytania dostosowano do naturalnej polszczyzny, zachowując nacisk na prawo właściciela do rozporządzania tym, co do niego należy. Idiom oka zachowano w formie zrozumiałej po polsku.
