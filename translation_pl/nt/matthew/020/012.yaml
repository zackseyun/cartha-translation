source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: pl
  text: 'mówiąc: „Ci ostatni przepracowali jedną godzinę, a zrównałeś ich z nami[a], którzy znosiliśmy ciężar dnia i spiekotę”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „potraktowałeś ich tak samo jak nas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Mówili
  rationale: Imiesłów wprowadza wypowiedź i łączy się składniowo z poprzednim zdaniem; w samodzielnie cytowanym wersecie polska forma osobowa naturalnie zachowuje jego funkcję narracyjną.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Ci ostatni
  rationale: Zwięzłe określenie pracowników zatrudnionych jako ostatnich, zachowujące kontrast obecny w grece.
- source_word: μίαν ὥραν ἐποίησαν
  choice: przepracowali jedną godzinę
  rationale: W połączeniu z określeniem czasu ποιέω oznacza tu przepracowanie danego okresu; polski czasownik oddaje idiom bez dodawania niewystępującego w tekście słowa „tylko”.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: zrównałeś ich z nami
  rationale: Naturalnie i bezpośrednio oddaje konstrukcję oznaczającą uczynienie jednych równymi drugim, zachowując siłę skargi.
- source_word: τοῖς βαστάσασι
  choice: którzy znosiliśmy
  rationale: βαστάζω może oznaczać zarówno dźwiganie, jak i znoszenie ciężaru; tutaj „znosiliśmy” obejmuje trud pracy oraz działanie upału.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: ciężar dnia
  rationale: Zachowuje obraz ciężaru wyrażony przez βάρος, a zarazem jest zrozumiałe jako trud całodziennej pracy.
- source_word: τὸν καύσωνα
  choice: spiekotę
  rationale: „Spiekota” zwięźle oddaje dotkliwy, palący upał oznaczany przez καύσων.
theological_decisions:
- issue: Skarga robotników dotycząca równego potraktowania
  choice: Oddać protest wprost jako „zrównałeś ich z nami”
  alternative: Interpretacyjnie podkreślić niesprawiedliwość gospodarza
  rationale: Werset przedstawia punkt widzenia skarżących się robotników. Przekład zachowuje napięcie przypowieści i nie rozstrzyga w samym brzmieniu wypowiedzi, czy działanie gospodarza było niesprawiedliwe.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Przepracowali” oraz „spiekota” brzmią naturalnie, a „ciężar dnia” zachowuje obrazowość greckiego tekstu.
