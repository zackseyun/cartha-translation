base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: pl
  text: 'Powiedzieli mu[a]: „Bo nikt nas nie najął”. Powiedział im: „Idźcie i wy do winnicy”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greka w obu zdaniach używa narracyjnego czasu teraźniejszego: dosłownie „mówią” i „mówi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Odpowiedzieli
  rationale: Historyczny czas teraźniejszy wprowadza ich odpowiedź; polski czas przeszły zapewnia naturalny tok narracji, a „odpowiedzieli” jasno oddaje funkcję wypowiedzi w dialogu.
- source_word: Ὅτι
  choice: Bo
  rationale: Spójnik wprowadza podaną przez robotników przyczynę; „bo” jest naturalnym i precyzyjnym odpowiednikiem w bezpośredniej odpowiedzi.
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: nikt nas nie najął
  rationale: Czasownik oznacza najęcie do pracy; polski czas przeszły dokonany naturalnie wskazuje, że do tej chwili nikt ich nie zatrudnił.
- source_word: λέγει
  choice: Powiedział
  rationale: Historyczny czas teraźniejszy oddano czasem przeszłym, zgodnie z naturalną polską narracją i konsekwentnie z pierwszym orzeczeniem wersetu.
- source_word: Ὑπάγετε
  choice: Idźcie
  rationale: Tryb rozkazujący wyraża bezpośrednie polecenie udania się do miejsca pracy.
- source_word: καὶ ὑμεῖς
  choice: i wy
  rationale: Wyrażenie włącza tę grupę do osób już posłanych; „i wy” zachowuje nacisk zaimka ὑμεῖς.
- source_word: ἀμπελῶνα
  choice: winnicy
  rationale: „Winnica” jest standardowym i wystarczającym polskim odpowiednikiem.
