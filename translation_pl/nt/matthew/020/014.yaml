review_pass:
  verdict: approve
  source_fidelity: Przekład wiernie oddaje kolejno rozkazy ἆρον i ὕπαγε („Weź ... i odejdź”), szerokie τὸ σὸν („to, co twoje”), wolitywne θέλω oraz porównanie równości w ὡς καὶ σοί („tyle samo co tobie”). „Temu ostatniemu” poprawnie zachowuje męską liczbę pojedynczą i wskazujący charakter τούτῳ τῷ ἐσχάτῳ, bez niepotrzebnego dopowiedzenia o zapłacie.
  naturalness: Tekst jest naturalny w nowoczesnej polszczyźnie, zwięzły i odpowiednio stanowczy. „Chcę zaś” jest nieco podniosłe, lecz nadal współczesne i dobrze oddaje łagodny kontrast δέ w rejestrze wypowiedzi gospodarza.
  terminology: Nie występują tu terminy wymagające szczególnej normalizacji teologicznej. „Tyle samo co tobie” trafnie komunikuje równą miarę daną ostatniemu robotnikowi, nie narzucając interpretacji przypowieści.
