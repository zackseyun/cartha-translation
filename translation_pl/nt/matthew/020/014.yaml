  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: pl
  text: Weź to, co twoje, i odejdź. Chcę zaś dać temu ostatniemu tyle samo co tobie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Weź
  rationale: Aorystowy tryb rozkazujący od αἴρω w tym kontekście nakazuje robotnikowi wziąć należną mu rzecz. „Weź” zachowuje zwięzłość i bezpośredniość wypowiedzi.
- source_word: τὸ σὸν
  choice: to, co twoje
  rationale: Neutrum użyte rzeczownikowo oznacza dosłownie „to, co twoje”. Przekład nie dopowiada słowa „zapłata”, choć wynika ono z kontekstu.
- source_word: ὕπαγε
  choice: odejdź
  rationale: W tym kontekście ὑπάγω pełni funkcję polecenia zakończenia rozmowy i opuszczenia miejsca. Polskie „odejdź” brzmi naturalniej niż samo „idź”, nie dodając jawnie wrogiego tonu.
- source_word: θέλω δὲ
  choice: Chcę zaś
  rationale: θέλω wyraża wolę gospodarza, a „zaś” oddaje łagodny kontrast wprowadzany przez δέ.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: temu ostatniemu
  rationale: Grecka fraza ma rodzaj męski i liczbę pojedynczą oraz wskazuje na konkretnego robotnika, który przyszedł jako ostatni. Polski rzeczownikowo użyty przymiotnik zachowuje tę informację bez zbędnego dopowiedzenia „człowiekowi”.
- source_word: δοῦναι ὡς καὶ σοί
  choice: dać (…) tyle samo co tobie
  rationale: δοῦναι znaczy „dać”, natomiast konstrukcja porównawcza ὡς καὶ σοί wskazuje na równą wysokość daru lub zapłaty. „Tyle samo co tobie” jest naturalnym polskim odpowiednikiem tego sensu.
theological_decisions:
- issue: Równe potraktowanie ostatniego robotnika
  choice: tyle samo co tobie
  alternative: tak jak i tobie
  rationale: Konstrukcja ὡς καὶ σοί w kontekście wypłaty wskazuje na równość otrzymanej kwoty. Przekład wyraża tę relację jasno, nie wyjaśniając jej teologicznego znaczenia ani nie rozstrzygając szerszej interpretacji przypowieści.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano stanowczy ton gospodarza oraz łagodny kontrast wyrażony przez δέ. Nie przejęto przypisu z angielskiej warstwy konsultacyjnej, ponieważ podana tam alternatywa dotyczy innej części zdania niż oznaczone miejsce i nie wskazuje rzeczywistej trudności wymagającej przypisu w polskim tekście.
