  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: pl
  text: A gdy wychodzili[a] z Jerycha, poszedł za Nim wielki tłum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „gdy odchodzili z Jerycha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: gdy wychodzili
  rationale: Imiesłów czasu teraźniejszego w dopełniaczu liczby mnogiej pełni funkcję czasową. „Gdy wychodzili” naturalnie oddaje trwającą czynność i zachowuje liczbę mnogą.
- source_word: ἀπὸ Ἰεριχὼ
  choice: z Jerycha
  rationale: Przyimek ἀπό wskazuje ruch od danego miejsca; „z Jerycha” jest naturalnym polskim odpowiednikiem.
- source_word: ἠκολούθησεν
  choice: poszedł za
  rationale: Aoryst czasownika ἀκολουθέω oznacza podążanie za kimś. „Poszedł za” brzmi naturalnie w opisie przemieszczania się i zachowuje aspekt wydarzenia ujętego całościowo.
- source_word: αὐτῷ
  choice: Nim
  rationale: Zaimek w celowniku liczby pojedynczej najnaturalniej odnosi się do Jezusa. Liczba pojedyncza zostaje zachowana mimo wcześniejszego podmiotu mnogiego.
- source_word: ὄχλος πολύς
  choice: wielki tłum
  rationale: Połączenie rzeczownika z przymiotnikiem oznacza liczny tłum; „wielki tłum” jest zrozumiałe, godne i naturalne we współczesnej polszczyźnie.
theological_decisions:
- issue: Odniesienie zaimka αὐτῷ w liczbie pojedynczej po imiesłowie odnoszącym się do wielu osób
  choice: Tłum poszedł za Jezusem („za Nim”).
  alternative: Tłum poszedł za całą grupą („za nimi”).
  rationale: Tekst grecki przechodzi od liczby mnogiej „gdy wychodzili” do liczby pojedynczej „za Nim”, najpewniej wskazując Jezusa jako centralną postać. Przekład zachowuje tę zmianę, zamiast ją wygładzać.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Wielka litera w zaimku „Nim” sygnalizuje odniesienie do Jezusa zgodnie z polską konwencją religijną; tekst zachowuje przejście od liczby mnogiej do pojedynczej.
