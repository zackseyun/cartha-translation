id: MAT.20.3
reference: Matthew 20:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: pl
  text: A gdy wyszedł około trzeciej godziny[a], zobaczył innych, którzy stali bezczynnie[b] na rynku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To znaczy około dziewiątej rano. „Trzecia godzina” była liczona od wschodu słońca.
    reason: cultural_note
  - marker: b
    text: 'Możliwe też: „bez pracy”. Greckie słowo opisuje ludzi, którzy w tej chwili nie pracowali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: gdy wyszedł
  rationale: Aorystowy imiesłów oddaje czynność poprzedzającą zobaczenie; konstrukcja „gdy wyszedł” jest naturalna po polsku i zachowuje następstwo narracji.
- source_word: περὶ τρίτην ὥραν
  choice: około trzeciej godziny
  rationale: Zachowuje starożytny sposób określania czasu i przybliżony charakter wyrażenia περί; współczesny odpowiednik podano w przypisie.
- source_word: εἶδεν
  choice: zobaczył
  rationale: Prosty narracyjny odpowiednik czasownika ὁράω, bez dodawania znaczenia „zauważył”.
- source_word: ἄλλους
  choice: innych
  rationale: Przymiotnik użyty rzeczownikowo; polskie „innych” nie dopowiada płci osób niewskazanej w tym wyrażeniu.
- source_word: ἑστῶτας
  choice: którzy stali
  rationale: Oddaje statyczną wartość imiesłowu perfectum od ἵστημι w naturalnej polskiej konstrukcji zdaniowej.
- source_word: ἀγορᾷ
  choice: na rynku
  rationale: ἀγορά oznacza publiczny plac targowy i miejsce gromadzenia się ludzi; „rynek” jest zwięzłym, naturalnym polskim odpowiednikiem.
- source_word: ἀργούς
  choice: bezczynnie
  rationale: Oddaje fakt, że osoby te nie wykonywały pracy, nie wprowadzając współczesnej kategorii formalnego bezrobocia.
theological_decisions: []
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zachowano źródłowe określenie czasu, objaśniając je w przypisie, oraz uniknięto anachronicznego, administracyjno-ekonomicznego sensu słowa „bezrobotni”.
