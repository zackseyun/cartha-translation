id: MAT.20.32
reference: Matthew 20:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: pl
  text: 'Jezus zatrzymał się, przywołał ich i zapytał: „Co chcecie, żebym dla was zrobił?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: zatrzymał się
  rationale: Imiesłów aorystu od ἵστημι wskazuje tu idiomatycznie, że Jezus przerwał swój ruch. Polski czasownik osobowy naturalnie oddaje czynność poprzedzającą wezwanie.
- source_word: ἐφώνησεν
  choice: przywołał
  rationale: φωνέω może znaczyć „zawołać” lub „wezwać”. „Przywołał ich” zwięźle i naturalnie wskazuje, że Jezus zwrócił się do obu niewidomych i wezwał ich do siebie.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek w bierniku liczby mnogiej odnosi się do dwóch niewidomych z bezpośredniego kontekstu.
- source_word: Τί θέλετε
  choice: Co chcecie
  rationale: Oddaje bezpośredniość pytania i zwykłe znaczenie θέλω we współczesnej polszczyźnie, bez niepotrzebnej podniosłości.
- source_word: ποιήσω
  choice: żebym zrobił
  rationale: Aoryst trybu łączącego po θέλετε określa treść ich pragnienia. Konstrukcja „chcecie, żebym... zrobił” jest naturalnym polskim odpowiednikiem.
- source_word: ὑμῖν
  choice: dla was
  rationale: 'Celownik ma tu sens korzyści: chodzi o czynność wykonaną na ich rzecz.'
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Imię własne oddano w utrwalonej polskiej formie; greckiego rodzajnika przed imieniem nie tłumaczy się osobno.
theological_decisions:
- issue: Ton i wymowa pytania Jezusa
  choice: 'Bezpośrednie, osobiste pytanie: „Co chcecie, żebym dla was zrobił?”'
  alternative: 'Bardziej formalnie: „Czego pragniecie, abym wam uczynił?”'
  rationale: Greka ukazuje osobiste zwrócenie się Jezusa do niewidomych, lecz nie wymaga archaicznego ani uroczyście podniosłego stylu. Wybrane brzmienie zachowuje prostotę i otwartość pytania bez dopowiadania motywacji.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zachowano zwięzłość greckiego zdania; „zapytał” oddaje w tym kontekście funkcję καὶ εἶπεν przed pytaniem bez mechanicznego „i powiedział”.
