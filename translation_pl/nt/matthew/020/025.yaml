id: MAT.20.25
reference: Matthew 20:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: pl
  text: 'Jezus zaś przywołał ich do siebie i powiedział: „Wiecie, że władcy pogan[a] narzucają im swoją władzę, a możni[b] sprawują nad nimi władzę”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „narodów”.'
    reason: alternatywa leksykalna zachowująca wieloznaczność ἔθνη
  - marker: b
    text: 'Dosłownie: „wielcy”; może chodzić o dostojników lub wysokich urzędników.'
    reason: objaśnienie rzeczownikowego użycia οἱ μεγάλοι
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: przywołał ich do siebie
  rationale: Imiesłów aorystu medialnego wskazuje, że Jezus najpierw wezwał uczniów ku sobie; polska konstrukcja osobowa jest naturalniejsza, a „do siebie” oddaje sens formy medialnej.
- source_word: Οἴδατε
  choice: Wiecie
  rationale: Forma οἶδα jest perfektywna morfologicznie, lecz ma znaczenie teraźniejsze; „wiecie” jest idiomatycznym i ścisłym odpowiednikiem.
- source_word: ἄρχοντες
  choice: władcy
  rationale: Termin oznacza osoby rządzące i dobrze odpowiada politycznemu kontekstowi wypowiedzi.
- source_word: τῶν ἐθνῶν
  choice: pogan
  rationale: W żydowskim kontekście ἔθνη często oznacza ludy nieżydowskie. „Poganie” zachowuje to przeciwstawienie, a przypis podaje równie możliwe znaczenie „narody”.
- source_word: κατακυριεύουσιν
  choice: narzucają im swoją władzę
  rationale: Czasownik opisuje władcze, dominujące panowanie. To sformułowanie zachowuje jego negatywny wydźwięk i brzmi naturalnie po polsku.
- source_word: οἱ μεγάλοι
  choice: możni
  rationale: Użyty rzeczownikowo przymiotnik odnosi się do ludzi znaczących lub wysoko postawionych. „Możni” jest zwięzłe, godne i zachowuje gramatyczny rodzaj męski.
- source_word: κατεξουσιάζουσιν
  choice: sprawują nad nimi władzę
  rationale: Wyrażenie wiernie oddaje wykonywanie władzy nad innymi; negatywny kontekst wzmacnia równoległe „narzucają im swoją władzę”.
- source_word: αὐτῶν
  choice: im / nad nimi
  rationale: Zaimek odsyła do ludów nieżydowskich jako poddanych władzy. Polskie formy zaimkowe unikają zbędnego powtarzania rzeczownika.
theological_decisions:
- issue: Znaczenie ἐθνῶν w żydowskim kontekście wypowiedzi Jezusa
  choice: pogan
  alternative: narodów
  rationale: „Poganie” wyraźnie oddaje typowe nowotestamentowe odniesienie do ludów nieżydowskich, ale przypis zachowuje szersze, rzeczywiście możliwe znaczenie „narody”.
- issue: Oddanie οἱ μεγάλοι
  choice: możni
  alternative: wielcy; dostojnicy; wysocy urzędnicy
  rationale: „Możni” zachowuje odniesienie do wysoko postawionych osób bez zawężania ich do konkretnego urzędu. Przypis ujawnia dosłowną formę i możliwy sens funkcjonalny.
translation_notes:
  register: Współczesny, standardowy polski o godnym, publicznym rejestrze. Składnia pozostaje przejrzysta dla zwykłego czytelnika, a równoległość dwóch opisów sprawowania władzy została zachowana bez łagodzenia krytycznego tonu greckich czasowników.
