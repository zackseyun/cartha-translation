id: MAT.20.4
reference: Matthew 20:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: pl
  text: 'Im zaś powiedział: „Idźcie i wy do winnicy, a dam wam to, co będzie słuszne[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „sprawiedliwe” lub „uczciwe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: im
  rationale: Celownik liczby mnogiej wskazuje na wspomnianych wcześniej robotników; polski zaimek „im” jest naturalny i wystarczająco jednoznaczny w kontekście.
- source_word: εἶπεν
  choice: powiedział
  rationale: Zwykły odpowiednik narracyjnego λέγω, właściwie wprowadzający mowę niezależną.
- source_word: Ὑπάγετε
  choice: idźcie
  rationale: Tryb rozkazujący liczby mnogiej wyraża proste polecenie udania się do winnicy.
- source_word: καὶ ὑμεῖς
  choice: i wy
  rationale: Zachowuje emfatyczne włączenie tych robotników do grupy posłanych już wcześniej.
- source_word: ἀμπελῶνα
  choice: winnicy
  rationale: Standardowy i naturalny polski odpowiednik ἀμπελών.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: to, co będzie słuszne
  rationale: Oddaje nieokreślony charakter zdania względnego oraz etyczny zakres δίκαιον bez zawężania go wyłącznie do sprawiedliwości prawnej lub subiektywnie pojmowanej uczciwości.
- source_word: δώσω ὑμῖν
  choice: dam wam
  rationale: Zachowuje podstawowe znaczenie δίδωμι „dać”; kontekst wynagrodzenia pozostaje czytelny bez zastępowania czasownika bardziej interpretacyjnym „zapłacę”.
theological_decisions:
- issue: Oddanie δίκαιον w kontekście ustalania wynagrodzenia
  choice: słuszne
  alternative: sprawiedliwe; uczciwe
  rationale: „Słuszne” zachowuje moralny sens zgodności z tym, co właściwe, nie narzucając wyłącznie prawnego odcienia „sprawiedliwe” ani bardziej potocznego i kontekstowo interpretacyjnego „uczciwe”.
translation_notes:
  register: Współczesny, godny i naturalny rejestr narracyjny. Szyk „Im zaś powiedział” czytelnie łączy wypowiedź z poprzednim kontekstem, a „i wy” zachowuje nacisk obecny w grece.
