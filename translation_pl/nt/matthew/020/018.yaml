source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: pl
  text: „Oto idziemy do Jerozolimy, a Syn Człowieczy[a] zostanie wydany[b] naczelnym kapłanom i uczonym w Piśmie, a oni skażą go na śmierć.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Syn Człowieczy” to charakterystyczne określenie, którym Jezus nazywa samego siebie; może ono nawiązywać do Dn 7,13–14.
    reason: cross_reference
  - marker: b
    text: 'Można też oddać: „zostanie przekazany”; w węższym kontekście czasownik ten może znaczyć „zostanie zdradzony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Naturalny, dignified Polish discourse marker that directs attention without the colloquial force of „spójrzcie”.
- source_word: ἀναβαίνομεν
  choice: idziemy
  rationale: In Polish, movement toward Jerusalem is naturally expressed as „idziemy”; explicit „w górę” would sound awkward here, while the journey context remains clear.
- source_word: Ἱεροσόλυμα
  choice: Jerozolimy
  rationale: Standard Polish form of the place name, governed by „do”.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Established Polish rendering of Jesus’ self-designation, preserving its titular character and possible resonance with Daniel 7.
- source_word: παραδοθήσεται
  choice: zostanie wydany
  rationale: Preserves the broad passive sense of being handed over into another’s power without narrowing the act specifically to betrayal.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: naczelnym kapłanom
  rationale: Standard Polish biblical designation for the leading priestly authorities denoted by the plural.
- source_word: γραμματεῦσιν
  choice: znawcom Prawa
  rationale: Conveys the function of these trained interpreters of the Jewish Law more clearly to ordinary modern readers than the potentially occupationally misleading „uczeni w Piśmie” or archaizing „skrybowie”.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: skażą go na śmierć
  rationale: Idiomatic Polish legal expression accurately conveying condemnation with death as the penalty.
theological_decisions:
- issue: Oddanie tytułu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn Człowieka
  rationale: „Syn Człowieczy” is the established titular form in Polish and preserves the expression’s christological and possible Danielic resonance without reducing it to a generic description.
- issue: Zakres znaczeniowy παραδοθήσεται
  choice: zostanie wydany
  alternative: zostanie zdradzony
  rationale: The Greek passive describes transfer into hostile power but does not in this clause identify the agent or restrict the meaning to betrayal; „wydany” preserves that breadth.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Zachowano tradycyjny tytuł „Syn Człowieczy”, natomiast „znawcy Prawa” jasno komunikuje rolę γραμματεῖς współczesnemu odbiorcy. Interpunkcję podzielono na dwa zdania dla naturalności polskiej wypowiedzi.
