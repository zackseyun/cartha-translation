source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: pl
  text: 'Tłum jednak skarcił ich, żeby zamilkli. Oni zaś tym bardziej[a] wołali: „Panie, zmiłuj się nad nami, Synu Dawida[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jeszcze głośniej”. Grecki stopień wyższy może podkreślać ogólnie większą intensywność („tym bardziej”) albo konkretnie większą głośność.'
    reason: lexical_alternative
  - marker: b
    text: „Syn Dawida” jest tytułem mesjańskim, a nie tylko określeniem pochodzenia.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὄχλος
  choice: tłum
  rationale: Naturalny współczesny odpowiednik określający zgromadzoną grupę ludzi w tej scenie.
- source_word: ἐπετίμησεν αὐτοῖς
  choice: ich karcił
  rationale: Czasownik wyraża stanowczą naganę lub skarcenie; forma „karcił” zachowuje siłę wypowiedzi bez dodawania treści o formalnym rozkazie.
- source_word: ἵνα σιωπήσωσιν
  choice: żeby zamilkli
  rationale: Oddaje cel działania tłumu i jest naturalnym polskim sformułowaniem odnoszącym się do uciszenia wołających.
- source_word: μεῖζον
  choice: tym bardziej
  rationale: Przysłówkowo użyty stopień wyższy nasila czynność; greka może wskazywać ogólnie na większą intensywność, niekoniecznie wyłącznie na głośność.
- source_word: ἔκραξαν
  choice: wołali
  rationale: κράζω oznacza donośne, naglące wołanie; „wołali” pasuje do prośby skierowanej do Jezusa i brzmi naturalnie po polsku.
- source_word: Κύριε
  choice: Panie
  rationale: Zachowuje zwyczajowe znaczenie tytułu κύριος oraz jego możliwy szerszy wydźwięk chrystologiczny.
- source_word: ἐλέησον ἡμᾶς
  choice: zmiłuj się nad nami
  rationale: To utrwalony, precyzyjny i zrozumiały polski odpowiednik prośby o okazanie miłosierdzia.
- source_word: υἱὸς Δαυίδ
  choice: Synu Dawida
  rationale: Wołacz odpowiada bezpośredniemu zwrotowi, a dosłowne brzmienie zachowuje królewski i mesjański charakter tytułu.
theological_decisions:
- issue: Mesjański tytuł υἱὸς Δαυίδ odniesiony do Jezusa
  choice: Synu Dawida
  alternative: potomku Dawida
  rationale: Dosłowny tytuł zachowuje jego mesjańskie i królewskie znaczenie w Ewangelii Mateusza, zamiast sprowadzać go jedynie do informacji genealogicznej.
- issue: Znaczenie κύριος w bezpośrednim zwrocie do Jezusa
  choice: Panie
  alternative: Nauczycielu
  rationale: „Panie” zachowuje zarówno sens pełnego szacunku zwrotu, jak i możliwy wydźwięk chrystologiczny, bez rozstrzygania napięcia obecnego w kontekście.
translation_notes:
  register: Współczesny, godny i narracyjnie płynny język polski. Zachowano stanowczość reakcji tłumu, nagłość wołania oraz tradycyjne, nadal zrozumiałe sformułowanie „zmiłuj się nad nami”. Markery przypisów umieszczono przy wyrażeniach, których dotyczą.
