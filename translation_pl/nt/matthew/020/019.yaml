  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: pl
  text: i wydadzą Go poganom, aby Go wyśmiali, ubiczowali i ukrzyżowali, a trzeciego dnia zostanie wskrzeszony[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „powstanie z martwych”. Grecki czasownik ma stronę bierną („zostanie wskrzeszony”), często używaną w wypowiedziach o zmartwychwstaniu i mogącą wskazywać na działanie Boga.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: wydadzą
  rationale: „Wydać kogoś” naturalnie oddaje przekazanie go pod władzę innych, bez zawężania sensu do zdrady.
- source_word: τοῖς ἔθνεσιν
  choice: poganom
  rationale: W kontekście zapowiedzi męki chodzi o nie-Żydów, zwłaszcza władze rzymskie; „poganie” jest zwięzłym i utrwalonym polskim odpowiednikiem.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: aby Go wyśmiali
  rationale: Konstrukcja z εἰς i bezokolicznikiem wyraża cel lub skutek; forma osobowa jest naturalna po polskim „aby”.
- source_word: μαστιγῶσαι
  choice: ubiczowali
  rationale: „Ubiczować” precyzyjnie określa karne chłostanie i jest zrozumiałe we współczesnej polszczyźnie.
- source_word: σταυρῶσαι
  choice: ukrzyżowali
  rationale: Czasownik oznacza bezpośrednio wykonanie egzekucji przez ukrzyżowanie. Wspólne „Go” przed szeregiem czasowników wystarcza po polsku.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: trzeciego dnia
  rationale: To naturalny polski sposób oddania celownika czasu oznaczającego dzień wydarzenia.
- source_word: ἐγερθήσεται
  choice: zostanie wskrzeszony
  rationale: Forma bierna zachowuje gramatyczną postać greckiego czasownika oraz możliwą sugestię działania Boga.
theological_decisions:
- issue: Strona czasownika opisującego zmartwychwstanie
  choice: zostanie wskrzeszony
  alternative: powstanie z martwych
  rationale: Greka ma formę przyszłą bierną. Przekład bierny zachowuje napięcie tekstu i możliwe odniesienie do działania Boga, nie wykluczając innych nowotestamentowych ujęć sprawczości Chrystusa.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zaimek „Go” zapisano wielką literą zgodnie z rozpowszechnioną polską konwencją odnoszenia zaimków do Jezusa. Rytm trzech czasowników zachowuje narastający ciąg cierpień.
