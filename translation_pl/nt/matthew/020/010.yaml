id: MAT.20.10
reference: Matthew 20:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: pl
  text: Kiedy przyszli ci pierwsi, sądzili, że dostaną więcej, lecz i oni otrzymali po denarze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denar był powszechną zapłatą za dzień pracy robotnika.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: kiedy przyszli
  rationale: Imiesłów aorystu pełni funkcję czasową; polskie zdanie podrzędne naturalnie oddaje kolejność wydarzeń.
- source_word: οἱ πρῶτοι
  choice: ci pierwsi
  rationale: Wyrażenie wskazuje na robotników najętych jako pierwszych; zaimek „ci” sygnalizuje konkretną grupę.
- source_word: ἐνόμισαν
  choice: sądzili
  rationale: Czasownik wyraża przypuszczenie lub oczekiwanie, bez sugerowania pewności.
- source_word: πλεῖον
  choice: więcej
  rationale: Zwięzły i naturalny odpowiednik porównawczego określenia większej zapłaty.
- source_word: λήμψονται
  choice: dostaną
  rationale: W polskiej mowie zależnej po czasowniku w czasie przeszłym przyszłość może naturalnie pozostać wyrażona czasem przyszłym.
- source_word: τὸ ἀνὰ δηνάριον
  choice: po denarze
  rationale: Konstrukcja z ἀνά ma znaczenie dystrybutywne; „po denarze” idiomatycznie znaczy jeden denar dla każdego.
- source_word: καὶ αὐτοί
  choice: i oni
  rationale: Zachowuje nacisk, że również pierwsi otrzymali tę samą ustaloną kwotę.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Zachowano kontrast między oczekiwaniem pierwszych robotników a równą zapłatą; spójnik „lecz” oddaje przeciwstawny sens drugiego καί w tym kontekście.
