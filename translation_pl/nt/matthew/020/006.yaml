  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: pl
  text: 'Około jedenastej godziny[a] wyszedł i znalazł innych, którzy tam stali. Mówi do nich[b]: „Dlaczego stoicie tu bezczynnie przez cały dzień?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „około godziny jedenastej”. Dosłownie: „około jedenastej godziny”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „Powiedział do nich”. Greka używa czasu teraźniejszego historycznego: „mówi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: około jedenastej godziny
  rationale: Przyimek περί z biernikiem wyraża przybliżenie. Sformułowanie zachowuje starożytny sposób określania pory dnia i obrazowanie przypowieści, nie utożsamiając go bezpośrednio ze współczesną godziną jedenastą.
- source_word: ἐξελθὼν
  choice: wyszedł
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą znalezienie robotników; polskie orzeczenie współrzędne naturalnie i jasno oddaje kolejność zdarzeń.
- source_word: εὗρεν
  choice: znalazł
  rationale: Prosty i bezpośredni odpowiednik czasownika εὑρίσκω.
- source_word: ἄλλους
  choice: innych
  rationale: Przymiotnik jest użyty rzeczownikowo. Kontekst wskazuje na kolejnych potencjalnych robotników, a polskie „innych” nie dodaje informacji niewyrażonej w tym zdaniu.
- source_word: ἑστῶτας
  choice: którzy tam stali
  rationale: Imiesłów perfectum określa zastany stan. Zdanie względne brzmi naturalnie po polsku i oddaje trwanie w pozycji stojącej.
- source_word: καὶ λέγει αὐτοῖς
  choice: Mówi do nich
  rationale: Zachowano grecki czas teraźniejszy historyczny, który ożywia narrację.
- source_word: Τί
  choice: Dlaczego
  rationale: 'W tym pytaniu τί ma idiomatyczny sens przyczynowy: „dlaczego?”.'
- source_word: ὧδε
  choice: tu
  rationale: Naturalny, zwięzły odpowiednik przysłówka miejsca.
- source_word: ἑστήκατε
  choice: stoicie
  rationale: Perfectum opisuje utrzymujący się stan; w połączeniu z „przez cały dzień” polski czas teraźniejszy naturalnie wyraża jego trwanie.
- source_word: ὅλην τὴν ἡμέραν
  choice: przez cały dzień
  rationale: Biernik wyraża rozciągłość w czasie; „przez cały dzień” jest naturalnym polskim odpowiednikiem.
- source_word: ἀργοί
  choice: bezczynnie
  rationale: Oddaje brak działania lub pracy bez zawężania sensu do współczesnego statusu bezrobotnego.
