  source_fidelity: Polskie „A gdy otrzymali zapłatę, zaczęli szemrać przeciw gospodarzowi” wiernie oddaje składnię i sens greckiego tekstu. Imiesłów aorystu λαβόντες zostaje naturalnie ujęty czasowo przez „gdy otrzymali”; dopowiedziana „zapłata” jest jednoznacznie określona przez bezpośredni kontekst przypowieści. „Zaczęli szemrać” jest uzasadnionym inchoatywnym odczytaniem imperfectum ἐγόγγυζον, bez wykluczania jego odcienia czynności trwającej. „Przeciw” poprawnie oddaje κατά z dopełniaczem.
