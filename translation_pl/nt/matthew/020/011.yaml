  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: pl
  text: A gdy otrzymali zapłatę[a], zaczęli szemrać przeciw gospodarzowi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „otrzymawszy”; dopełnienie „zapłatę” wynika z kontekstu.'
    reason: implicit_object
lexical_decisions:
- source_word: λαβόντες
  choice: gdy otrzymali zapłatę
  rationale: Imiesłów aorystu wskazuje na czynność poprzedzającą szemranie. Dopełnienie nie występuje w grece, lecz z kontekstu chodzi o otrzymaną zapłatę; jego uzupełnienie daje naturalne i jasne brzmienie po polsku.
- source_word: δὲ
  choice: A
  rationale: Łagodny spójnik narracyjny rozwijający opowieść; „A” naturalnie łączy zdanie z poprzednim kontekstem bez nadmiernego podkreślania przeciwstawienia.
- source_word: ἐγόγγυζον
  choice: zaczęli szemrać
  rationale: Imperfectum może przedstawiać czynność trwającą lub jej rozpoczęcie. W tym kontekście „zaczęli szemrać” oddaje reakcję następującą po otrzymaniu zapłaty, a „szemrać” zachowuje odcień niezadowolonego, przyciszonego narzekania.
- source_word: κατὰ
  choice: przeciw
  rationale: Przy dopełniaczu wyraża tu wrogie lub krytyczne nastawienie skierowane ku osobie.
- source_word: τοῦ οἰκοδεσπότου
  choice: gospodarzowi
  rationale: „Gospodarz” jest naturalnym współczesnym odpowiednikiem osoby zarządzającej domem i majątkiem, a zarazem dobrze pasuje do właściciela winnicy w kontekście przypowieści.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano tradycyjne, lecz nadal zrozumiałe „szemrać”, ponieważ trafniej niż ogólne „narzekać” oddaje odcień greckiego czasownika.
