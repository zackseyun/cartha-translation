  terminology: '„Gospodarz” jest trafnym, naturalnym odpowiednikiem οἰκοδεσπότης w tym kontekście: wskazuje na osobę stojącą na czele domu lub majątku, bez niepotrzebnego zawężania do jednego aspektu własności. Nie występują tu szczególne terminy teologiczne wymagające korekty.'
