id: MAT.20.34
reference: Matthew 20:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: pl
  text: A Jezus, ogarnięty współczuciem, dotknął ich oczu. Natychmiast odzyskali wzrok[a] i poszli za nim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zaczęli widzieć” lub „znów zobaczyli”. Grecki czasownik może oznaczać odzyskanie wzroku, a dosłowniej także spojrzenie w górę; w tym kontekście odnosi się do przywrócenia wzroku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: ogarnięty współczuciem
  rationale: Imiesłów wyraża głębokie, poruszające współczucie. To sformułowanie zachowuje jego emocjonalną siłę i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: δὲ
  choice: A
  rationale: W tym miejscu spójnik łagodnie rozwija narrację; polskie „A” zachowuje ciągłość opowiadania bez sugerowania mocnego przeciwstawienia.
- source_word: ἥψατο
  choice: dotknął
  rationale: W kontekście uzdrowienia czasownik oznacza fizyczne dotknięcie.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: ich oczu
  rationale: Grecki dopełniacz wymagany przez czasownik najnaturalniej oddaje się w języku polskim jako „ich oczu”.
- source_word: εὐθέως
  choice: natychmiast
  rationale: Wyraz podkreśla bezzwłoczny skutek działania Jezusa.
- source_word: ἀνέβλεψαν
  choice: odzyskali wzrok
  rationale: W opisie uzdrowienia niewidomych czasownik oznacza odzyskanie zdolności widzenia. Wybrane sformułowanie jasno przekazuje sens kontekstowy, nie wykluczając wzmiankowanej w przypisie szerszej wartości leksykalnej.
- source_word: ἠκολούθησαν αὐτῷ
  choice: poszli za nim
  rationale: Sformułowanie zachowuje dosłowny sens podążania za Jezusem, a zarazem możliwy wydźwięk uczniostwa, bez przesądzania jego zakresu.
theological_decisions:
- issue: Charakter uzdrowienia wyrażonego przez ἀνέβλεψαν
  choice: Rzeczywiste i natychmiastowe odzyskanie wzroku
  alternative: Mniej precyzyjne stwierdzenie, że zaczęli widzieć albo spojrzeli w górę
  rationale: Połączenie εὐθέως z ἀνέβλεψαν w kontekście uzdrowienia niewidomych wskazuje na natychmiastowe przywrócenie wzroku, bez potrzeby dodawania dalszych szczegółów.
- issue: Znaczenie ἠκολούθησαν αὐτῷ
  choice: poszli za nim
  alternative: stali się jego uczniami
  rationale: Tekst mówi, że poszli za Jezusem. Może to mieć wydźwięk uczniostwa, lecz nie określa wprost trwałości ani charakteru tego podążania.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zachowano emocjonalną siłę opisu współczucia Jezusa oraz zwięzłość relacji. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną współczesną normą językową.
