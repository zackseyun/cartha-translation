review_pass:
  verdict: approve
  source_fidelity: Przekład wiernie oddaje greckie οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ἔσχατοι. „Tak więc” trafnie wprowadza wniosek z przypowieści, a przyszłość („będą”) oraz pełny paralelizm „ostatni—pierwsi / pierwsi—ostatnimi” są zachowane. Nie zawęża znaczenia aforyzmu do statusu społecznego, nagrody ani zbawienia.
  naturalness: Zdanie jest naturalne we współczesnej polszczyźnie, zwięzłe i ma właściwy, sentencyjny rytm. Narzędnik w „pierwszymi” i „ostatnimi” jest poprawny; „a” dobrze łączy kontrastowo-równoległe człony bez dodawania silnej opozycji.
  terminology: „Ostatni” i „pierwsi” są bezpośrednimi, idiomatycznymi odpowiednikami substantywizowanych przymiotników ἔσχατοι i πρῶτοι. Zachowują potrzebną wieloznaczność. Przypis pod znacznikiem [a] jest poprawnie zakotwiczony i podaje dopuszczalny bardziej sposobowy wariant dla οὕτως.
