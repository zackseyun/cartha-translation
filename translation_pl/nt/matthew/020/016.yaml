  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: pl
  text: Tak więc ostatni będą pierwszymi[a], a pierwsi ostatnimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „W ten sposób ostatni będą pierwszymi, a pierwsi ostatnimi”.'
    reason: Alternatywne, bardziej sposobowe oddanie οὕτως.
lexical_decisions:
- source_word: οὕτως
  choice: Tak więc
  rationale: Wprowadza wynikające z przypowieści podsumowanie. „Tak więc” naturalnie oddaje siłę wnioskującą, zachowując zarazem możliwość bardziej sposobowego odczytania wskazaną w przypisie.
- source_word: ἔσονται
  choice: będą
  rationale: Prosta forma czasu przyszłego czasownika εἰμί; polskie „będą” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: οἱ ἔσχατοι
  choice: ostatni
  rationale: Przymiotnik z rodzajnikiem pełni funkcję rzeczownikową. „Ostatni” zachowuje zwięzłość oraz nie rozstrzyga, czy chodzi o kolejność, pozycję społeczną, nagrodę czy zbawienie.
- source_word: πρῶτοι
  choice: pierwszymi
  rationale: Orzecznik po „będą” występuje naturalnie w narzędniku. Zachowuje przeciwstawienie „ostatni—pierwsi”.
- source_word: καὶ
  choice: a
  rationale: Polskie „a” naturalnie łączy dwa równoległe, kontrastujące człony bez wprowadzania silniejszej przeciwstawności właściwej „ale”.
- source_word: οἱ πρῶτοι
  choice: pierwsi
  rationale: Urzeczownikowiony przymiotnik, równoległy do „ostatni”; zachowuje symetrię wypowiedzi.
- source_word: ἔσχατοι
  choice: ostatnimi
  rationale: Orzecznik w narzędniku domyka odwrócenie i zachowuje ścisły paralelizm obu członów.
theological_decisions:
- issue: Charakter zapowiedzianego odwrócenia
  choice: Zwięzła sentencja o odwróceniu kolejności lub pozycji, bez doprecyzowania jej zakresu
  alternative: Wyraźne odniesienie do pozycji społecznej, nagrody uczniów albo kolejności zbawienia
  rationale: Tekst grecki nie określa jednoznacznie, czego dotyczą pojęcia „ostatni” i „pierwsi”. Przekład zachowuje tę wieloznaczność i napięcie teologiczne.
translation_notes:
  register: Język współczesny, zwięzły i godny. Zachowano aforystyczny rytm oraz symetryczną konstrukcję greckiego zdania.
