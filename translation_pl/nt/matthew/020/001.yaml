id: MAT.20.1
reference: Matthew 20:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: pl
  text: Królestwo niebios jest bowiem podobne do gospodarza, który wyszedł wczesnym rankiem, aby nająć robotników do swojej winnicy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: do gospodarza
  rationale: Greckie zestawienie dosłownie oznacza „człowieka będącego gospodarzem domu”, lecz w naturalnej polszczyźnie rzeczownik „gospodarz” wystarczająco określa tę osobę bez zbędnego dublowania.
- source_word: ἅμα πρωῒ
  choice: wczesnym rankiem
  rationale: Wyrażenie wskazuje na bardzo wczesną porę dnia; taki przekład jest naturalny i zachowuje sens czasowy.
- source_word: μισθώσασθαι ἐργάτας
  choice: aby nająć robotników
  rationale: „Nająć” trafnie oddaje zatrudnienie za wynagrodzeniem, a „robotnicy” odpowiadają osobom podejmującym pracę w winnicy.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  rationale: Zachowuje charakterystyczne dla Mateusza określenie i jego liczbę mnogą.
theological_decisions:
- issue: Zakres porównania w formule ὁμοία ... ἀνθρώπῳ οἰκοδεσπότῃ
  choice: Zachowano bezpośrednie porównanie królestwa do gospodarza wprowadzającego przypowieść.
  alternative: „Z królestwem niebios jest tak jak z gospodarzem...”
  rationale: Grecka składnia formalnie mówi, że królestwo jest podobne do gospodarza; nie należy w samym przekładzie rozszerzać porównania na cały opis, choć kontekst przypowieści może tak funkcjonować.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk zdania pozostaje naturalny po polsku, a spójnik „bowiem” zachowuje γάρ i powiązanie z poprzednim kontekstem.
