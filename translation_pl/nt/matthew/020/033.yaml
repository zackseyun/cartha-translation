base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: pl
  text: 'Powiedzieli mu: „Panie[a], niech otworzą się nasze oczy”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Proszę pana, niech otworzą się nasze oczy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Powiedzieli
  rationale: Historyczny czas teraźniejszy w narracji naturalnie oddano polskim czasem przeszłym, zgodnie z kontekstem odpowiedzi.
- source_word: αὐτῷ
  choice: mu
  rationale: Celownik zaimka wskazuje adresata wypowiedzi; polskie „mu” zwięźle zachowuje tę funkcję.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος. „Panie” zachowuje zarówno pełen szacunku zwrot, jak i możliwe uznanie autorytetu Jezusa, bez rozstrzygania całej wagi tytułu.
- source_word: ἵνα
  choice: niech
  rationale: W tym kontekście ἵνα wprowadza treść prośby; konstrukcja z „niech” brzmi naturalnie po polsku i zachowuje życzeniowo-proszący charakter wypowiedzi.
- source_word: ἀνοιγῶσιν
  choice: otworzą się
  rationale: Aoryst strony biernej w trybie łączącym oddano polską konstrukcją medialno-bierną, w której oczy doznają otwarcia.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: nasze oczy
  rationale: Grecki rzeczownik z dopełniaczem zaimka dzierżawczego naturalnie odpowiada polskiemu „nasze oczy”.
theological_decisions:
- issue: Znaczenie κύριος jako zwrotu do Jezusa
  choice: Panie
  alternative: Proszę pana
  rationale: „Panie” jest standardowym odpowiednikiem κύριος i zachowuje napięcie między uprzejmym zwrotem a wyznaniem autorytetu Jezusa; przypis sygnalizuje słabszy odcień możliwy w tym kontekście.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Szyk wypowiedzi jest naturalny po polsku, a konstrukcja „niech otworzą się” zachowuje formę bezpośredniej prośby oraz bierny sens greckiego czasownika.
