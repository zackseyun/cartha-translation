  source_fidelity: „Powiedzieli mu” trafnie oddaje narracyjne λέγουσιν w czasie przeszłym. „Panie” właściwie przekłada wołacz Κύριε, a „niech otworzą się nasze oczy” zachowuje prośbę wprowadzoną przez ἵνα oraz nieosobowo-bierny/medialny sens ἀνοιγῶσιν, bez nieuprawnionego dopowiadania sprawcy.
  naturalness: Brzmienie jest współczesne, proste i godne. Szyk „niech otworzą się nasze oczy” jest dopuszczalny i zrozumiały w podniosłym rejestrze prośby; nie wymaga zmiany na mniej dosłowne „odzyskamy wzrok” ani na konstrukcję, która wprowadzałaby dodatkowy element sprawczy.
  terminology: „Panie” jest właściwym, konsekwentnym odpowiednikiem Κύριε w zwrocie do Jezusa i nie przesądza ponad tekst stopnia chrystologicznego rozpoznania. Przypis z „Proszę pana” uczciwie wskazuje możliwy słabszy, grzecznościowy odcień zwrotu.
