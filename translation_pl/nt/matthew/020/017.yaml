  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: pl
  text: 'Gdy Jezus szedł do Jerozolimy, wziął dwunastu uczniów na osobność i po drodze powiedział im:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: szedł
  rationale: Imiesłów teraźniejszy oznacza czynność równoczesną z παρέλαβεν. Polskie „szedł” naturalnie przedstawia trwającą podróż; kierunek do Jerozolimy wyraża następujące dopełnienie.
- source_word: εἰς Ἱεροσόλυμα
  choice: do Jerozolimy
  rationale: Przy nazwie miasta εἰς naturalnie oddaje się po polsku przyimkiem „do”.
- source_word: παρέλαβεν
  choice: wziął
  rationale: Czasownik oznacza wzięcie kogoś ze sobą. W połączeniu z „na osobność” jasno wskazuje, że Jezus oddzielił uczniów od innych.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: Dwunastu uczniów
  rationale: Przekład zachowuje obecne w tekście μαθητάς. Wielka litera w „Dwunastu” sygnalizuje rozpoznawalną grupę apostołów, bez usuwania określenia „uczniów”.
- source_word: κατ’ ἰδίαν
  choice: na osobność
  rationale: Naturalny polski idiom zachowujący sens oddzielenia od innych w celu prywatnej rozmowy.
- source_word: ἐν τῇ ὁδῷ
  choice: po drodze
  rationale: Zwięzłe, współczesne sformułowanie wskazujące, że wypowiedź nastąpiła podczas podróży.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział im
  rationale: Bezpośredni i naturalny odpowiednik zwykłego czasownika mówienia, pozostawiający treść wypowiedzi kolejnemu wersetowi.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i płynny język narracyjny. Zachowano składniowe powiązanie z następnym wersetem przez dwukropek. Nie dodano przypisów, ponieważ warianty tekstowe nie wpływają tu istotnie na sens przekładu.
