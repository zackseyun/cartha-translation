id: MAT.20.28
reference: Matthew 20:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: pl
  text: tak jak Syn Człowieczy nie przyszedł, aby Mu służono, lecz aby służyć i oddać swoje życie na okup za wielu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub wyraźniej: „jako okup w miejsce wielu”.'
    reason: Alternatywa leksykalna ukazująca możliwy zastępczy odcień przyimka ἀντί.
lexical_decisions:
- source_word: ὥσπερ
  choice: tak jak
  rationale: Naturalnie wprowadza porównanie z poprzedzającą nauką i zachowuje porównawczą funkcję greckiego wyrażenia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tego samookreślenia Jezusa, zachowujący jego tytularny charakter i nawiązanie do Księgi Daniela.
- source_word: οὐκ ἦλθεν
  choice: nie przyszedł
  rationale: Oddaje aoryst prostą, naturalną formą czasu przeszłego, bez dodawania nieobecnych w tekście określeń miejsca.
- source_word: διακονηθῆναι
  choice: aby Mu służono
  rationale: Zachowuje stronę bierną bezokolicznika i wyraża ją naturalną polszczyzną; wielka litera w zaimku odpowiada godnościowemu zwyczajowi polskiego tekstu biblijnego.
- source_word: ἀλλὰ διακονῆσαι
  choice: lecz aby służyć
  rationale: Zachowuje bezpośredni kontrast z formą bierną tego samego czasownika oraz zwykłe, nieklerykalne znaczenie służenia.
- source_word: καὶ δοῦναι
  choice: i oddać
  rationale: W połączeniu z życiem polskie „oddać życie” naturalniej niż dosłowne „dać życie” wyraża dobrowolne wydanie go na śmierć, bez przesądzania mechanizmu tej śmierci.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: swoje życie
  rationale: W tym kontekście ψυχή oznacza życie oddawane aż po śmierć, nie jedynie niematerialną duszę.
- source_word: λύτρον
  choice: okup
  rationale: Wyraża cenę służącą uwolnieniu i zachowuje zwięzły, utrwalony obraz wykupienia.
- source_word: ἀντὶ πολλῶν
  choice: za wielu
  rationale: To naturalny polski zwrot w konstrukcji „okup za”, który zachowuje sens działania dla dobra wielu, podczas gdy wyraźniejszy odcień zastępstwa zostaje udokumentowany w przypisie.
theological_decisions:
- issue: Siła przyimka ἀντί w wypowiedzi o okupie
  choice: W tekście głównym „za wielu”, z wyraźniejszym znaczeniem zastępstwa podanym w przypisie.
  alternative: w miejsce wielu
  rationale: ἀντί może wskazywać na wymianę lub zastępstwo. Sformułowanie „okup za wielu” jest naturalne i nie wyklucza tego sensu, natomiast przypis zachowuje mocniejszy odcień leksykalny bez zawężania tekstu do rozbudowanej interpretacji doktrynalnej.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano paralelny kontrast „aby Mu służono — aby służyć” oraz utrwalony tytuł „Syn Człowieczy”. Przypis umieszczono przy wyrażeniu, którego rzeczywiście dotyczy.
