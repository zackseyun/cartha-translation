  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: pl
  text: Wtedy matka synów Zebedeusza podeszła do Niego wraz ze swoimi synami, oddając Mu pokłon[a] i prosząc Go o coś.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki czasownik może oznaczać pokłon pełen czci, złożenie hołdu albo oddawanie czci religijnej — zależnie od kontekstu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, który przedstawia następne wydarzenie w sekwencji.
- source_word: προσῆλθεν αὐτῷ
  choice: podeszła do Niego
  rationale: Oddaje ruch w kierunku konkretnej osoby; „podeszła do” jest naturalne i dokładniejsze niż ogólne „przyszła”.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: matka synów Zebedeusza
  rationale: Przejrzyste zachowanie greckiej konstrukcji dopełniaczowej, identyfikującej kobietę przez jej relację do synów Zebedeusza.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: wraz ze swoimi synami
  rationale: μετά z dopełniaczem wyraża towarzyszenie; zaimek „swoimi” jednoznacznie odnosi synów do podmiotu zdania.
- source_word: προσκυνοῦσα
  choice: oddała Mu pokłon
  rationale: Polskie wyrażenie obejmuje gest uniżenia i czci, nie przesądzając samo przez się, czy chodzi o kult religijny. Przypis zachowuje mocniejszą możliwość znaczeniową.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: i o coś Go poprosiła
  rationale: Oddaje nieokreślony przedmiot prośby (τι) oraz osobę, od której czegoś oczekiwano (παρ’ αὐτοῦ), w naturalnej polskiej składni.
theological_decisions:
- issue: Znaczenie προσκυνοῦσα w odniesieniu do Jezusa
  choice: oddała Mu pokłon
  alternative: oddała Mu cześć / uwielbiła Go
  rationale: Czasownik προσκυνέω może opisywać fizyczny pokłon, hołd albo oddawanie czci religijnej. Tekst główny zachowuje szerokie znaczenie gestu czci, a przypis sygnalizuje nierozstrzygniętą mocniejszą interpretację.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Dwa zdania pozwalają uniknąć ciężkiego nagromadzenia imiesłowów, zachowując kolejność czynności. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej praktyce religijnej.
