  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: pl
  text: A gdy Jezus dokończył tych słów[a], tłumy zdumiewały się jego nauką.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „tych wypowiedzi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: A gdy
  rationale: Grecka formuła narracyjna wprowadza następstwo czasowe i przejście do kolejnej sceny. Naturalne polskie „A gdy” zachowuje ciągłość narracji bez sztucznego, semicko brzmiącego „I stało się, gdy”.
- source_word: ἐτέλεσεν
  choice: dokończył
  rationale: Czasownik wskazuje na doprowadzenie wypowiedzi do końca; „dokończył” naturalnie łączy się w języku polskim z dopełniaczem „tych słów”.
- source_word: τοὺς λόγους τούτους
  choice: tych słów
  rationale: λόγοι może oznaczać słowa lub wypowiedzi. „Tych słów” zachowuje podstawowy sens i wyraźne odniesienie do bezpośrednio poprzedzającej mowy Jezusa.
- source_word: ἐξεπλήσσοντο
  choice: zdumiewały się
  rationale: Imperfectum przedstawia trwającą lub zbiorową reakcję tłumów. „Zdumiewały się” oddaje siłę reakcji w godnym, współczesnym rejestrze.
- source_word: οἱ ὄχλοι
  choice: tłumy
  rationale: Liczba mnoga w grece zostaje zachowana; „tłumy” jest naturalnym współczesnym odpowiednikiem.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: jego nauką
  rationale: Przy czasowniku wyrażającym zdumienie ἐπί z celownikiem wskazuje przedmiot lub podstawę reakcji. Polski narzędnik po „zdumiewać się” oddaje to zwięźle i naturalnie.
theological_decisions:
- issue: Odniesienie wyrażenia „tych słów”
  choice: Pozostawiono „tych słów” jako odniesienie do bezpośrednio poprzedzającego nauczania Jezusa.
  alternative: „tych wypowiedzi” lub interpretacyjne „tego kazania”
  rationale: Tekst grecki nie używa nazwy typu „kazanie”; przekład nie wprowadza późniejszej etykiety teologicznej i zachowuje możliwie bezpośrednie brzmienie λόγοι.
translation_notes:
  register: Współczesny, godny i płynny polski. Formułę Καὶ ἐγένετο ὅτε oddano idiomatycznie jako „A gdy”, unikając zarówno archaizacji, jak i zbędnego wygładzenia relacji czasowej.
