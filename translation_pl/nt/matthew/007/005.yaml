  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: pl
  text: Obłudniku, najpierw wyjmij belkę[a] ze swojego oka, a wtedy przejrzysz, aby wyjąć drzazgę[b] z oka swojego brata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „bierwiono” lub „duży bal” (δοκός).'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „drobinkę”, „źdźbło” lub „odłamek” (κάρφος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Obłudniku
  rationale: Wołacz liczby pojedynczej zachowuje bezpośredni i ostry charakter nagany.
- source_word: ἔκβαλε
  choice: wyjmij
  rationale: Tryb rozkazujący ἐκβάλλω w obrazie ciała obcego w oku najnaturalniej oddaje polskie „wyjmij”.
- source_word: πρῶτον
  choice: najpierw
  rationale: Wyraźnie oznacza pierwszeństwo w kolejności działania.
- source_word: δοκόν
  choice: belkę
  rationale: δοκός oznacza duży element drewniany, zwłaszcza belkę konstrukcyjną; wybór zachowuje zamierzoną hiperbolę i kontrast z κάρφος.
- source_word: ὀφθαλμοῦ
  choice: oka
  rationale: Podstawowy i kontekstowo jednoznaczny odpowiednik ὀφθαλμός.
- source_word: διαβλέψεις
  choice: przejrzysz
  rationale: Polskie „przejrzysz” zwięźle oddaje wzmocniony sens wyraźnego widzenia i współgra z metaforą usunięcia przeszkody z oka.
- source_word: ἐκβαλεῖν
  choice: aby wyjąć
  rationale: Bezokolicznik zachowano jako konstrukcję celową po czasowniku widzenia, bez dopowiadania „jak” lub „będziesz mógł”.
- source_word: κάρφος
  choice: drzazgę
  rationale: κάρφος może oznaczać drobny suchy kawałek materiału; „drzazga” jest naturalna w odniesieniu do oka i utrzymuje kontrast z belką.
- source_word: ἀδελφοῦ
  choice: swojego brata
  rationale: Zachowuje męski rodzaj i wspólnotowy charakter greckiego ἀδελφός; zaimek zwrotny jest wymagany przez naturalną polską składnię.
theological_decisions:
- issue: Rodzaj gramatyczny i relacyjny sens ἀδελφοῦ
  choice: swojego brata
  alternative: drugiego człowieka; bliźniego
  rationale: Grecki rzeczownik jest rodzaju męskiego i występuje w liczbie pojedynczej. Dosłowne „brata” zachowuje obraz relacji we wspólnocie bez neutralizowania tekstu.
- issue: Relacja bezokolicznika ἐκβαλεῖν do διαβλέψεις
  choice: przejrzysz, aby wyjąć
  alternative: będziesz wyraźnie widział, jak wyjąć; będziesz mógł wyjąć
  rationale: Tekst nie zawiera osobnego odpowiednika „jak” ani czasownika oznaczającego zdolność. Konstrukcja z „aby” zachowuje celowy odcień bez nadmiernego objaśniania.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Obłudniku” zachowuje ostrość bez archaizacji, a „belka” i „drzazga” tworzą naturalny po polsku, wyrazisty kontrast hiperboliczny. Znaczniki przypisów umieszczono bezpośrednio po słowach, których wariantów leksykalnych dotyczą.
