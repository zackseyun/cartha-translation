id: MAT.7.11
reference: Matthew 7:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: pl
  text: Jeśli więc wy, będąc źli, umiecie dawać swoim dzieciom dobre dary, o ileż bardziej wasz Ojciec, który jest w niebiosach, da tym, którzy Go proszą, to, co dobre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „dobre rzeczy”. W drugim członie zdania grecki tekst nie powtarza słowa „dary”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: będąc źli
  rationale: Zachowuje bezpośrednią siłę greckiego imiesłowu i nie łagodzi oceny moralnej, a zarazem nie rozbudowuje jej o dodatkowe twierdzenia doktrynalne.
- source_word: οἴδατε ... διδόναι
  choice: umiecie dawać
  rationale: W tym połączeniu οἴδατε z bezokolicznikiem oznacza praktyczną wiedzę lub zdolność; „umiecie dawać” jest naturalnym polskim odpowiednikiem.
- source_word: δόματα ἀγαθὰ
  choice: dobre dary
  rationale: δόματα oznacza dary, a ἀγαθὰ je określa; polski szyk jest naturalny i zachowuje oba elementy wyrażenia.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: swoim dzieciom
  rationale: τέκνα obejmuje dzieci niezależnie od płci. Zaimek zwrotny „swoim” jest wymagany przez naturalną polską składnię przy podmiocie „wy”.
- source_word: πόσῳ μᾶλλον
  choice: o ileż bardziej
  rationale: Oddaje emfatyczne rozumowanie a fortiori i odpowiada podniosłemu, lecz współczesnemu rejestrowi wypowiedzi.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: wasz Ojciec, który jest w niebiosach
  rationale: Zachowuje rzeczownik „Ojciec”, rozwija grecką konstrukcję przydawkową w naturalne polskie zdanie względne i oddaje liczbę mnogą οὐρανοῖς słowem „niebiosa”.
- source_word: δώσει ἀγαθὰ
  choice: da ... to, co dobre
  rationale: W drugim członie nie występuje rzeczownik δόματα. Polski zwrot „to, co dobre” naturalnie oddaje urzeczownikowiony przymiotnik, nie dopisując ponownie „darów”.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: tym, którzy Go proszą
  rationale: Oddaje urzeczownikowiony imiesłów jako ogólną kategorię osób. Wielka litera w „Go” jest zgodna z polską konwencją religijną i nie zmienia treści źródłowej.
theological_decisions:
- issue: Siła antropologicznego określenia πονηροὶ ὄντες
  choice: będąc źli
  alternative: choć jesteście niedoskonali
  rationale: Bezpośrednie „źli” zachowuje napięcie między moralnym stanem ludzi a dobrocią Ojca, bez łagodzenia tekstu ani dopisywania rozbudowanej doktryny antropologicznej.
- issue: Określenie miejsca przebywania Ojca
  choice: który jest w niebiosach
  alternative: niebieski Ojciec / Ojciec w niebie
  rationale: Wybrane brzmienie zachowuje lokatywny charakter wyrażenia oraz liczbę mnogą greckiego οὐρανοῖς, nie przekształcając go w tytuł teologiczny.
- issue: Treść tego, co daje Ojciec
  choice: to, co dobre
  alternative: dobre dary
  rationale: Nie przenosi rzeczownika „dary” z pierwszego członu do drugiego, gdzie tekst grecki ma jedynie urzeczownikowione ἀγαθὰ. Pozostawia zakres dobra niewyszczególniony.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Konstrukcje „będąc źli” oraz „o ileż bardziej” zachowują retoryczny charakter wypowiedzi, natomiast „to, co dobre” pozwala uniknąć nienaturalnego lub nadmiernie materialnego brzmienia „dobre rzeczy” w tekście głównym.
