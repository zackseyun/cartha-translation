id: MAT.7.17
reference: Matthew 7:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: pl
  text: Tak[a] każde dobre drzewo wydaje dobre owoce, natomiast spróchniałe[b] drzewo wydaje złe[c] owoce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „W ten sposób” lub „A zatem”.'
    reason: lexical_alternative
  - marker: b
    text: Greckie σαπρός może też znaczyć „zgniłe”, „zepsute” albo „bezwartościowe”.
    reason: lexical_alternative
  - marker: c
    text: „Złe owoce” można też oddać jako „niegodziwe owoce” lub „bezwartościowe owoce”. Sformułowanie „złe owoce” naturalnie pasuje do obrazu drzewa, zachowując zarazem jego moralny wydźwięk w kontekście.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Tak
  rationale: Naturalnie wprowadza wynikające z poprzedniego obrazu porównanie lub wniosek; zachowuje też możliwy sens „w ten sposób”.
- source_word: πᾶν δένδρον
  choice: każde drzewo
  rationale: Liczba pojedyncza z πᾶν ma sens dystrybutywny, który po polsku naturalnie oddaje „każde drzewo”.
- source_word: ἀγαθὸν
  choice: dobre
  rationale: Zachowuje prosty, szeroki opis jakości drzewa i współbrzmi z określeniem dobrych owoców, bez dopowiadania interpretacji.
- source_word: καρποὺς καλοὺς
  choice: dobre owoce
  rationale: W kontekście oceny plonu καλός najnaturalniej oznacza owoce dobre; polska liczba mnoga odpowiada formie greckiej.
- source_word: ποιεῖ
  choice: wydaje
  rationale: Choć ποιέω dosłownie znaczy „czynić” lub „wytwarzać”, o drzewie i owocach współczesna polszczyzna idiomatycznie mówi, że drzewo „wydaje owoce”.
- source_word: τὸ δὲ
  choice: natomiast
  rationale: δέ wyraża tu wyraźne przeciwstawienie obu rodzajów drzewa; „natomiast” oddaje je płynnie i godnie.
- source_word: σαπρὸν
  choice: spróchniałe
  rationale: σαπρός oznacza coś zgniłego, zepsutego lub bezwartościowego. W odniesieniu do drzewa „spróchniałe” jest konkretnym i naturalnym odpowiednikiem.
- source_word: καρποὺς πονηροὺς
  choice: złe owoce
  rationale: πονηρός może znaczyć „zły”, „niegodziwy” lub „bezwartościowy”. „Złe owoce” brzmi naturalnie w obrazie rolniczym, a kontekst nadal pozwala dostrzec sens moralny.
theological_decisions:
- issue: Moralny sens obrazu a jego dosłowna, rolnicza postać
  choice: Pozostawiono konkretny obraz drzewa i owoców bez wyjaśniania jego zastosowania w samym wersecie.
  alternative: Oddać obraz interpretacyjnie, np. „zdrowe drzewo przynosi wartościowy plon, a zepsute — niegodziwe skutki”.
  rationale: W kontekście wypowiedź dotyczy rozpoznawania fałszywych proroków, lecz grecki tekst tego wersetu zachowuje formę obrazu. Przekład nie powinien usuwać napięcia między metaforą rolniczą a jej moralnym zastosowaniem.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Zdanie zachowuje zwięzłą, przysłowiową formę oryginału oraz paralelizm „dobre drzewo — dobre owoce / spróchniałe drzewo — złe owoce”.
