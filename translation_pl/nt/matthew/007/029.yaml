  source_fidelity: Zdanie trafnie oddaje peryfrastyczne imperfectum ἦν διδάσκων („uczył”), objaśniające γάρ („bowiem”), kontrast ὡς… καὶ οὐχ ὡς oraz zaimek αὐτῶν („ich”). W tym kontekście ἐξουσία lepiej oddaje „autorytet” niż „władza”, ponieważ chodzi o autorytatywny sposób nauczania, nie o władzę polityczną lub urzędową.
  naturalness: „Uczył ich bowiem…” jest naturalne, godne i zachowuje związek z poprzednim wersetem. „Jak ten, kto ma autorytet” jest współczesne i precyzyjne; „uczeni w Piśmie” pozostaje ustalonym, zrozumiałym określeniem γραμματεῖς.
  terminology: „Autorytet” adekwatnie obejmuje sens ἐξουσία w tym zdaniu bez dopowiadania źródła tej władzy. „Uczeni w Piśmie” właściwie oddaje żydowskich znawców Prawa; wielka litera w „Piśmie” jest w tym terminie uzasadniona.
