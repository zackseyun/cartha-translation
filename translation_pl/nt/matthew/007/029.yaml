  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: pl
  text: Uczył ich bowiem jak ten, kto ma autorytet[a], a nie jak ich uczeni w Piśmie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też bardziej idiomatycznie: „nauczał z autorytetem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: Uczył ich bowiem
  rationale: Konstrukcja peryfrastyczna z imperfectum wskazuje na trwającą czynność w przeszłości; naturalny polski imperfect zachowuje ten aspekt, a „bowiem” oddaje objaśniające γάρ i wiąże zdanie ze zdumieniem tłumów w poprzednim wersecie.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek w bierniku odnosi się do słuchaczy, czyli tłumów wspomnianych w poprzednim wersecie.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: jak ten, kto ma władzę
  rationale: Oddaje porównawczą konstrukcję ὡς oraz osobowy charakter imiesłowu ἔχων. „Władza” obejmuje tu autorytet, prawo i kompetencję, nie sprowadzając sensu jedynie do pewności siebie.
- source_word: καὶ οὐχ ὡς
  choice: a nie jak
  rationale: Naturalnie po polsku zachowuje wyraźny kontrast między sposobem nauczania Jezusa a sposobem nauczania uczonych w Piśmie.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ich uczeni w Piśmie
  rationale: „Uczeni w Piśmie” to współczesny i zrozumiały odpowiednik γραμματεῖς w żydowskim kontekście znawców Prawa; „ich” zachowuje wariant tekstu SBLGNT z αὐτῶν.
theological_decisions:
- issue: Natura władzy Jezusa w nauczaniu
  choice: 'Opisowe porównanie: „jak ten, kto ma władzę”'
  alternative: Dopowiedzieć wprost, że chodzi o władzę Boską, albo osłabić ją do samej pewności czy siły retorycznej
  rationale: Werset przedstawia władzę Jezusa jako rzeczywistą i przeciwstawia ją sposobowi nauczania uczonych w Piśmie, lecz sam nie określa pełnej teologicznej podstawy tej władzy. Przekład zachowuje to napięcie bez interpretacyjnego rozszerzenia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk z „bowiem” zachowuje objaśniający związek z poprzednim wersetem. Termin „uczeni w Piśmie” jest czytelniejszy dla dzisiejszego odbiorcy niż tradycyjne „uczeni w piśmie” rozumiane jako ogólna umiejętność pisania; wielka litera wskazuje na Pisma i utrwaloną grupę znawców Prawa.
