id: MAT.7.16
reference: Matthew 7:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: pl
  text: Poznacie ich po ich owocach[a]. Czy zbiera się winogrona z cierni albo figi z ostów[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też przetłumaczyć: „Rozpoznacie ich po ich owocach”.'
    reason: lexical_alternative
  - marker: b
    text: 'Pytanie zakłada odpowiedź przeczącą: nie zbiera się winogron z cierni ani fig z ostów.'
    reason: rhetorical_question
lexical_decisions:
- source_word: καρπῶν
  choice: owocach
  rationale: Zachowano konkretną metaforę oraz liczbę mnogą greckiego rzeczownika; polskie „po owocach” naturalnie wskazuje na rozpoznanie na podstawie widocznych rezultatów.
- source_word: ἐπιγνώσεσθε
  choice: poznacie
  rationale: Czas przyszły wyraża dojście do poznania na podstawie obserwacji. „Poznacie” jest naturalne i nie wzmacnia czasownika do znaczenia „poznacie w pełni”.
- source_word: μήτι
  choice: Czy
  rationale: Partykuła wprowadza pytanie retoryczne oczekujące odpowiedzi przeczącej; w naturalnej polszczyźnie wystarcza konstrukcja pytajna, a oczekiwaną odpowiedź objaśnia przypis.
- source_word: συλλέγουσιν
  choice: zbiera się
  rationale: Bezosobowa konstrukcja dobrze oddaje ogólne pytanie o zwyczaj i zachowuje obraz zbierania plonów.
- source_word: ἀκανθῶν
  choice: cierni
  rationale: „Ciernie” są zwięzłym, tradycyjnie zrozumiałym odpowiednikiem, który może oznaczać kolczaste rośliny.
- source_word: σταφυλάς
  choice: winogrona
  rationale: Bezpośredni i współczesny polski odpowiednik liczby mnogiej.
- source_word: τριβόλων
  choice: ostów
  rationale: „Osty” jasno oznaczają kolczaste chwasty i zachowują paralelę z cierniami.
- source_word: σῦκα
  choice: figi
  rationale: Bezpośredni odpowiednik greckiego rzeczownika w liczbie mnogiej.
- source_word: αὐτῶν / αὐτούς
  choice: ich / ich
  rationale: Zaimki zachowują osobowe odniesienie do omawianych ludzi; pierwsze „ich” oznacza właścicieli owoców, drugie przedmiot rozpoznania.
theological_decisions:
- issue: Metaforyczne znaczenie „owoców” przy rozeznawaniu ludzi
  choice: Zachować metaforę „owoców” bez jej interpretacyjnego rozwijania.
  alternative: „Poznacie ich po ich czynach” lub „po rezultatach ich działania”.
  rationale: Obraz rolniczy stanowi sedno wypowiedzi i pozostawia otwarty dokładny zakres tego, co obejmują „owoce”, bez zawężania go do jednej interpretacji.
- issue: Stopień poznania wyrażony przez ἐπιγνώσεσθε
  choice: „Poznacie”
  alternative: „Rozpoznacie”
  rationale: Oba warianty są możliwe; „poznacie” naturalnie oddaje ustalenie, kim są, na podstawie owoców, bez sugerowania wcześniejszej znajomości koniecznej czasem przy czasowniku „rozpoznać”.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano zwięzłość, paralelizm pytania oraz tradycyjny, lecz nadal naturalny obraz owoców, cierni i ostów.
