  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: pl
  text: Albo gdy poprosi o rybę — czyż da mu węża?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Albo gdy
  rationale: Wprowadza drugi przykład w parze pytań retorycznych. „Albo gdy” naturalnie kontynuuje wywód, bez mechanicznego oddawania καί osobnym słowem.
- source_word: ἰχθὺν
  choice: rybę
  rationale: Zwykłe znaczenie rzeczownika odpowiada kontekstowi pożywienia, o które dziecko prosi ojca.
- source_word: αἰτήσει
  choice: poprosi o
  rationale: Futurum w przykładzie o charakterze warunkowym najnaturalniej oddaje polska forma dokonana; konstrukcja „prosić o” odpowiada wymaganej składni.
- source_word: μὴ
  choice: czyż ...?
  rationale: Partykuła μή sygnalizuje pytanie, na które oczekuje się odpowiedzi przeczącej. Polskie „czyż” zachowuje tę siłę retoryczną.
- source_word: ὄφιν
  choice: węża
  rationale: „Wąż” jest zwykłym współczesnym polskim określeniem tego zwierzęcia i nie narzuca dodatkowych skojarzeń interpretacyjnych.
- source_word: ἐπιδώσει
  choice: da
  rationale: W tym kontekście czasownik oznacza przekazanie czegoś proszącemu; „da” jest jasnym i naturalnym odpowiednikiem.
- source_word: αὐτῷ
  choice: mu
  rationale: Celownik zaimka jest naturalnie oddany polskim zaimkiem „mu”.
theological_decisions:
- issue: Siła pytania retorycznego
  choice: 'Pytanie oczekujące odpowiedzi przeczącej: „czyż da mu węża?”'
  alternative: Neutralniejsze „czy da mu węża?” albo oznajmujące „nie da mu węża”
  rationale: μή w pytaniu bezpośrednim wskazuje na oczekiwaną odpowiedź przeczącą. Forma z „czyż” zachowuje retoryczny charakter argumentu, nie zmieniając go w zwykłe stwierdzenie.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Pauza oddaje wyraźne przejście od warunku do pytania retorycznego; „czyż” jest nieco podniosłe, lecz nadal powszechnie zrozumiałe.
