  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: pl
  text: Nie dawajcie psom tego, co święte[a], ani nie rzucajcie swoich pereł przed świnie, żeby ich nie podeptały swoimi nogami i, zwróciwszy się, nie rozszarpały was[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „świętej rzeczy” lub „tego, co poświęcone”. Greckie wyrażenie jest szerokie i nie określa dokładnie, o jaką świętą rzecz chodzi.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „nie rozdarły was” albo „nie rozerwały was na strzępy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: tego, co święte
  rationale: Rzeczownikowo użyty przymiotnik rodzaju nijakiego ma szeroki, nieokreślony desygnat. Polski zwrot „tego, co święte” jest naturalny i nie zawęża sensu do nauczania, przedmiotu kultowego ani innej konkretnej rzeczy.
- source_word: τοῖς κυσίν
  choice: psom
  rationale: Prosty odpowiednik celownika liczby mnogiej; zachowuje dosadność i metaforyczny charakter obrazu.
- source_word: βάλητε
  choice: rzucajcie
  rationale: Naturalny współczesny odpowiednik βάλλω w tym kontekście.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: swoich pereł
  rationale: Zachowuje liczbę mnogą i relację przynależności; zaimek zwrotny brzmi naturalnie przy podmiocie domyślnym „wy”.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: przed świnie
  rationale: Dosłowny i idiomatyczny polski odpowiednik, zachowujący tradycyjny obraz bez łagodzenia go.
- source_word: μήποτε
  choice: żeby ... nie
  rationale: W tym ostrzegawczym zdaniu konstrukcja „żeby nie” naturalnie oddaje negatywny skutek lub obawę, nie rozstrzygając ściśle między celem a rezultatem.
- source_word: καταπατήσουσιν αὐτοὺς
  choice: ich nie podeptały
  rationale: Czasownik oznacza deptanie; zaimek „ich” odnosi się gramatycznie do pereł.
- source_word: ἐν τοῖς ποσὶν αὐτῶν
  choice: '[zawarte w czasowniku „podeptały”]'
  rationale: Polskie „podeptać” samo wyraża działanie stopami; dodanie „nogami” byłoby ciężkie i redundantne, choć greka wymienia stopy wprost.
- source_word: στραφέντες
  choice: a potem nie zwróciły się przeciw wam
  rationale: Imiesłów wskazuje zwrot poprzedzający atak. „Przeciw wam” naturalnie ujawnia kierunek wrogiego działania, pozostając w granicach obrazu.
- source_word: ῥήξωσιν ὑμᾶς
  choice: nie rozszarpały was
  rationale: „Rozszarpać” przekazuje gwałtowność ῥήγνυμι i pasuje do obrazu atakujących zwierząt.
theological_decisions:
- issue: Znaczenie metafor „tego, co święte”, „psy”, „perły” i „świnie”
  choice: Pozostawiono metafory bez objaśnienia ich desygnatów w tekście.
  alternative: Utożsamić to, co święte, z nauką lub Ewangelią, a psy i świnie z określoną grupą ludzi.
  rationale: Werset nie definiuje jednoznacznie obrazów. Interpretacyjne rozwinięcie zawęziłoby autentyczną wieloznaczność i mogłoby wprowadzić doktrynalne założenia spoza tekstu.
- issue: Relacja między podeptaniem pereł a atakiem na ludzi
  choice: 'Oddano kolejność: podeptanie, następnie zwrot przeciw ludziom i rozszarpanie.'
  alternative: Potraktować wszystkie czynności jako ściśle równoczesne albo rozdzielić je bez wskazania następstwa.
  rationale: Imiesłów aorystu στραφέντες naturalnie przedstawia zwrot poprzedzający rozszarpanie, a konstrukcja całego zdania kreśli sekwencję grożących działań.
translation_notes:
  register: Współczesna, godna i bezpośrednia polszczyzna. Zachowano liczbę mnogą adresatów oraz ostre metafory oryginału. Konstrukcja ostrzegawcza „żeby... nie” jest bardziej naturalna we współczesnym polskim niż podniosłe „aby przypadkiem nie”.
