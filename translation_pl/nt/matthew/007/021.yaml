  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: pl
  text: 'Nie każdy, kto mówi do mnie: „Panie, Panie”, wejdzie do królestwa niebios[a], lecz ten, kto spełnia wolę mojego Ojca, który jest w niebie[b], wejdzie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „królestwa niebios”. Mateusz często używa tego określenia tam, gdzie w innych kontekstach występuje „królestwo Boga”.'
    reason: lexical_alternative
  - marker: b
    text: 'W tekście greckim „niebiosa” występują w liczbie mnogiej także tutaj; po polsku naturalnie: „w niebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Nie każdy, kto mówi do mnie
  rationale: 'Połączenie οὐ z πᾶς wyraża negację częściową: „nie każdy”, a nie „nikt”. Imiesłów czasu teraźniejszego oddano naturalnym polskim zdaniem względnym, zachowując sens ogólny.'
- source_word: Κύριε κύριε
  choice: Panie, Panie
  rationale: Powtórzony wołacz zachowuje emfatyczny charakter zwrotu; „Pan” jest tutaj naturalnym i teologicznie neutralnym odpowiednikiem κύριος.
- source_word: εἰσελεύσεται
  choice: wejdzie
  rationale: Forma przyszła czasownika εἰσέρχομαι ma prosty sens „wejdzie”; polszczyzna nie wymaga osobnego oddania morfologicznej strony medialnej.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: do królestwa niebios
  rationale: Zachowano rzeczownikowy zwrot charakterystyczny dla Mateusza oraz liczbę mnogą οὐρανῶν. Sformułowanie jest utrwalone, zrozumiałe i bliższe greckiej postaci niż „królestwo niebieskie”.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: lecz ten, kto spełnia
  rationale: Imiesłów z rodzajnikiem oddano jako „ten, kto”. „Spełnia wolę” jest naturalnym polskim połączeniem i zachowuje czynny kontrast między mówieniem a postępowaniem.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: wolę mojego Ojca
  rationale: „Wola” zachowuje etyczny i teologiczny zakres θέλημα, a „mojego Ojca” wiernie oddaje relację wyrażoną w tekście.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: który jest w niebie
  rationale: Grecka fraza przyimkowa określa Ojca. Idiomatyczna polska liczba pojedyncza „w niebie” jasno oddaje referencję, a liczba mnoga oryginału została odnotowana.
theological_decisions:
- issue: Wejście do królestwa a ustne wyznawanie i posłuszeństwo
  choice: Zachowano bezpośredni kontrast między zwracaniem się do Jezusa jako do Pana a spełnianiem woli Ojca.
  alternative: Odczytanie wersetu jako pełnego wykładu zbawienia z uczynków albo jako nauki, że samo ustne wyznanie wystarcza.
  rationale: Werset ostrzega przed samą deklaracją i przeciwstawia jej czynienie woli Ojca, lecz sam nie przedstawia kompletnego systemu soteriologicznego. Przekład nie rozstrzyga tego napięcia ponad treść grecką.
- issue: Elipsa orzeczenia w drugim członie
  choice: Nie powtórzono czasownika „wejdzie”, ponieważ polska konstrukcja „nie każdy…, lecz ten, kto…” naturalnie przenosi orzeczenie na drugi człon.
  alternative: „Lecz ten, kto spełnia wolę…, wejdzie”.
  rationale: Wybrana składnia zachowuje zwięzłość i strukturę greckiego przeciwstawienia, nie zmieniając sensu.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano uroczysty zwrot „Panie, Panie”, Mateuszowe „królestwo niebios” oraz wyraźny kontrast między mówieniem a spełnianiem woli Ojca.
