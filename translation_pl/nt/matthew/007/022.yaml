  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: pl
  text: 'Wielu powie mi w owym dniu: „Panie, Panie, czy w Twoim imieniu nie prorokowaliśmy, w Twoim imieniu nie wypędzaliśmy demonów i w Twoim imieniu nie dokonaliśmy wielu potężnych czynów[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „wielu cudów” lub „wielu dzieł mocy”. Greckie wyrażenie dosłownie mówi o licznych „mocach”; w Ewangeliach często oznacza cudowne czyny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Wielu
  rationale: Przymiotnik w liczbie mnogiej użyty rzeczownikowo; polskie „Wielu” naturalnie zachowuje tę zwięzłość bez dodawania słowa „ludzi”.
- source_word: ἐροῦσίν μοι
  choice: powie mi
  rationale: Forma przyszła czasownika λέγω z zaimkiem w celowniku; jest to bezpośredni i naturalny polski odpowiednik.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: w owym dniu
  rationale: Zachowuje biblijny, eschatologicznie nacechowany zwrot, nie dopowiadając w tekście głównym, że chodzi o dzień sądu.
- source_word: Κύριε κύριε
  choice: Panie, Panie
  rationale: Powtórzony wołacz oddaje natarczywość apelu, a „Pan” zachowuje zarówno zwykłą funkcję tytułu, jak i jego możliwą wagę chrystologiczną.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: czy ... nie prorokowaliśmy
  rationale: Przeczenie w pytaniu retorycznym wskazuje na oczekiwaną odpowiedź twierdzącą; „prorokować” jest utrwalonym i przejrzystym odpowiednikiem προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: w Twoim imieniu
  rationale: Naturalny polski idiom oznaczający działanie z czyjegoś upoważnienia lub przez powołanie się na jego imię. Trzykrotne powtórzenie zachowano dla siły retorycznej.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: wypędzaliśmy demonów
  rationale: ἐκβάλλω w połączeniu z δαιμόνια oznacza wypędzanie demonów; forma jest naturalna i powszechnie zrozumiała.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: dokonaliśmy wielu potężnych czynów
  rationale: δύναμις może oznaczać moc albo przejaw mocy, zwłaszcza cudowny czyn. To sformułowanie zachowuje związek z mocą i nie zawęża sensu wyłącznie do terminologii „cudu”.
theological_decisions:
- issue: Oddanie κύριος w bezpośrednim zwrocie do Jezusa
  choice: Pan
  alternative: Mistrz
  rationale: „Pan” zachowuje zwykły sens tytułu oraz jego możliwą wagę chrystologiczną, nie narzucając dodatkowej interpretacji.
- issue: Eschatologiczny sens wyrażenia „ów dzień”
  choice: w owym dniu
  alternative: w dniu sądu
  rationale: Kontekst wskazuje na sąd ostateczny, lecz tekst grecki mówi jedynie „w owym dniu”. Przekład nie czyni tego, co domyślne, jawnym.
- issue: Zakres znaczeniowy δυνάμεις
  choice: potężne czyny
  alternative: cuda
  rationale: Grecki rzeczownik dosłownie odnosi się do „mocy” i w Ewangeliach często oznacza cudowne dokonania. Tekst główny zachowuje tę więź leksykalną, a przypis podaje bardziej idiomatyczne możliwości.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano trzykrotne „w Twoim imieniu” oraz powtórzenie „Panie, Panie”, ponieważ budują retoryczny nacisk oryginału. Wielka litera w zaimku „Twoim” odpowiada współczesnej polskiej konwencji religijnej.
