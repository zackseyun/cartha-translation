id: MAT.7.14
reference: Matthew 7:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: pl
  text: Bo ciasna jest brama i trudna[a] droga, która prowadzi do życia, a niewielu ją znajduje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ściśnięta” lub „zwężona”.'
    reason: Greckie τεθλιμμένη zawiera konkretny obraz drogi ściśniętej lub ograniczonej, którego nie oddaje w pełni naturalne polskie „trudna”.
lexical_decisions:
- source_word: στενή
  choice: ciasna
  rationale: Przymiotnik określa bramę jako wąską, ciasną; „ciasna brama” jest naturalnym i wyrazistym polskim odpowiednikiem.
- source_word: τεθλιμμένη
  choice: trudna
  rationale: Imiesłów dosłownie przedstawia drogę jako ściśniętą lub zwężoną, a w kontekście wskazuje również na trud podążania nią. „Trudna” brzmi naturalnie po polsku, zaś dosłowny obraz zachowano w przypisie.
- source_word: ἀπάγουσα
  choice: prowadzi
  rationale: Oddaje kierowanie lub doprowadzanie do celu bez zbędnego uszczegóławiania.
- source_word: ζωήν
  choice: życia
  rationale: Bezpośredni odpowiednik zachowujący szeroki, teologicznie nośny sens greckiego rzeczownika.
- source_word: ὀλίγοι
  choice: niewielu
  rationale: Naturalnie odnosi się do małej liczby osób i zachowuje kontrast obecny w zdaniu.
- source_word: εὑρίσκοντες
  choice: znajduje
  rationale: Polska konstrukcja „niewielu ją znajduje” zwięźle i wiernie oddaje substantywizowany imiesłów „ci, którzy ją znajdują”.
theological_decisions:
- issue: Charakter drogi prowadzącej do życia
  choice: trudna droga
  alternative: zwężona / ciasna droga
  rationale: Przekład nie określa, na czym polega trud ani kto go powoduje, dzięki czemu nie narzuca doktrynalnej interpretacji. Przypis zachowuje przestrzenny obraz greckiego słowa.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano równoległą budowę wypowiedzi oraz zwięzłość sentencji; uniknięto archaicznego szyku „mało jest tych”.
