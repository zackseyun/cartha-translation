id: MAT.7.20
reference: Matthew 7:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: pl
  text: Tak więc[a] po ich owocach ich rozpoznacie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „A zatem — właśnie po ich owocach ich poznacie”.'
    reason: Alternatywa oddaje nieco dosłowniej wnioskowanie i lekki nacisk zawarte w ἄρα γε oraz dopuszczalny sens „poznacie” dla ἐπιγνώσεσθε.
lexical_decisions:
- source_word: ἄρα γε
  choice: Tak więc
  rationale: Połączenie wyraża wniosek wynikający z poprzednich słów, z lekkim naciskiem. „Tak więc” brzmi naturalnie we współczesnej polszczyźnie i zachowuje funkcję podsumowującą.
- source_word: ἀπὸ
  choice: po
  rationale: W połączeniu z czasownikiem oznaczającym rozpoznanie przyimek wskazuje podstawę rozpoznania. Polski zwrot „rozpoznać po czymś” jest naturalnym odpowiednikiem tej konstrukcji.
- source_word: καρπῶν
  choice: owocach
  rationale: Zachowano wyraźną w grece liczbę mnogą oraz metaforę owoców, która spaja ten werset z bezpośrednim kontekstem.
- source_word: αὐτῶν
  choice: ich
  rationale: Zaimek w dopełniaczu określa owoce i naturalnie oddaje się go jako „ich”.
- source_word: ἐπιγνώσεσθε
  choice: rozpoznacie
  rationale: Forma przyszła w drugiej osobie liczby mnogiej mówi o rozpoznaniu ludzi na podstawie widocznych oznak. „Rozpoznacie” trafniej niż ogólne „poznacie” oddaje identyfikujący sens czasownika w tym kontekście.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek odnosi się do omawianych wcześniej ludzi; polskie „ich” zachowuje to odniesienie bez interpretacyjnego dopowiedzenia.
theological_decisions:
- issue: Metaforyczne znaczenie „owoców” przy ocenie ludzi
  choice: Zachowano metaforę „owoców”.
  alternative: Oddać interpretacyjnie jako „czyny”, „skutki” lub „rezultaty”.
  rationale: Tekst wskazuje na rozpoznawanie ludzi po widocznych następstwach ich życia, lecz sam nie objaśnia metafory węższym terminem. Jej zachowanie utrzymuje więź z najbliższym kontekstem i nie narzuca określonej interpretacji doktrynalnej.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Szyk „po ich owocach ich rozpoznacie” lekko uwydatnia podstawę rozpoznania, zgodnie z greckim szykiem zdania, a zarazem pozostaje naturalny po polsku.
