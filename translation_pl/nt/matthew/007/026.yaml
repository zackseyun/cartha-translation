    rationale: Greckie καὶ μὴ ποιῶν jest zwykłym połączeniem „i nie...”, nie zaś spójnikiem przeciwstawnym. Kontrast wynika z treści, więc nie trzeba go wzmacniać w przekładzie.
  - severity: medium
    issue: „Człowieka” jako przekład ἀνδρί w tekście głównym
    rationale: ἀνήρ oznacza mężczyznę. Reprezentatywny charakter porównania można wyjaśnić w przypisie, ale tekst główny powinien zachować ten leksykalny szczegół.
