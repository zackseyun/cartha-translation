  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: pl
  text: A każdy, kto słucha tych moich słów i nie postępuje według nich, będzie podobny do nierozsądnego mężczyzny[a], który zbudował swój dom na piasku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo oznacza „mężczyznę”; w tym porównaniu postać ma charakter reprezentatywny.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: każdy, kto słucha
  rationale: Imiesłów z rodzajnikiem ma znaczenie rzeczownikowe i ogólne. To sformułowanie naturalnie oddaje zarówno powszechność, jak i czynność słuchania.
- source_word: μου τοὺς λόγους τούτους
  choice: tych moich słów
  rationale: Zachowano wskazujący charakter τούτους oraz relację dzierżawczą wyrażoną przez μου. „Słowa” są tu prostym i naturalnym odpowiednikiem λόγοι.
- source_word: καὶ μὴ ποιῶν αὐτούς
  choice: lecz ich nie wypełnia
  rationale: W tym kontekście ποιέω oznacza wykonywanie tego, co zostało usłyszane. „Wypełniać słowa” brzmi po polsku naturalniej niż dosłowne „czynić je”, a zarazem zachowuje praktyczny sens wypowiedzi. Spójnik „lecz” jasno oddaje przeciwstawienie między słuchaniem a brakiem działania.
- source_word: ὁμοιωθήσεται
  choice: będzie podobny do
  rationale: Forma przyszła strony biernej wprowadza porównanie. Polski zwrot „będzie podobny do” jest naturalny i zachowuje przyszły charakter orzeczenia.
- source_word: ἀνδρὶ μωρῷ
  choice: nierozsądnego człowieka
  rationale: ἀνήρ oznacza mężczyznę, lecz występuje tutaj jako reprezentatywna postać w porównaniu. „Człowiek” zachowuje osobowy obraz, a „nierozsądny” trafnie oddaje brak mądrości wyrażony przez μωρός bez nadmiernie obraźliwego tonu.
- source_word: ὅστις
  choice: który
  rationale: Zaimek wprowadza objaśnienie postaci z porównania; zwykłe polskie „który” w pełni oddaje jego funkcję.
- source_word: ᾠκοδόμησεν
  choice: zbudował
  rationale: Aoryst opisuje dokonane zbudowanie domu. „Zbudował” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: swój dom
  rationale: Zaimek zwrotny „swój” jest w polszczyźnie naturalnym sposobem wskazania, że dom należał do podmiotu zdania. „Dom” zachowuje konkretny obraz budowli.
- source_word: ἐπὶ τὴν ἄμμον
  choice: na piasku
  rationale: Przyimek ἐπί z biernikiem wskazuje tutaj podłoże budowy. „Na piasku” jest jasnym i idiomatycznym polskim odpowiednikiem.
theological_decisions:
- issue: Męska, reprezentatywna postać w porównaniu
  choice: nierozsądnego człowieka
  alternative: nierozsądnego mężczyzny
  rationale: Greckie ἀνήρ jest gramatycznie i leksykalnie męskie, ale postać pełni funkcję ogólnego przykładu odnoszącego się do „każdego”. Polski „człowiek” zachowuje jednostkową postać i uniwersalny zakres zastosowania; przypis ujawnia dosłownie męskie brzmienie greki.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Składnia zachowuje paralelę między słuchaniem a niewypełnianiem słów, natomiast przypis dokumentuje męską formę greckiego ἀνήρ.
