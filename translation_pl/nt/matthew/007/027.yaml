  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: pl
  text: I spadł deszcz, i nadciągnęły rzeki[a], i wiatry zawiały, i uderzyły w ten dom. Dom runął, a jego upadek był wielki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nadciągnęły wody powodziowe”. Grecki rzeczownik dosłownie oznacza „rzeki”, ale w tym kontekście może przywoływać obraz wezbranych wód.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: spadł deszcz
  rationale: Naturalny polski odpowiednik opisujący ruch deszczu w dół; zachowuje prostotę greckiego wyrażenia.
- source_word: ἦλθον οἱ ποταμοί
  choice: nadciągnęły rzeki
  rationale: „Rzeki” zachowują podstawowe znaczenie ποταμοί, natomiast „nadciągnęły” naturalnie oddaje gwałtowne nadejście wód w obrazie burzy. Możliwe kontekstowe znaczenie „wody powodziowe” podano w przypisie.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: zerwały się wiatry
  rationale: Naturalne współczesne sformułowanie opisujące silne wiatry, odpowiadające burzowemu kontekstowi.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: uderzyły w ten dom
  rationale: Oddaje kontekstowe znaczenie προσκόπτω jako uderzenia w budowlę, bez sugerowania potknięcia.
- source_word: ἔπεσεν
  choice: dom runął
  rationale: „Runął” jest naturalnym polskim określeniem upadku budowli i zachowuje gwałtowność obrazu bez dodatkowego objaśniania.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: jego upadek był wielki
  rationale: Zachowuje rzeczownikowe określenie „upadek” oraz prostą ocenę jego wielkości, nie rozszerzając tekstu o interpretację.
theological_decisions:
- issue: Obraz surowego sądu w zakończeniu przypowieści
  choice: jego upadek był wielki
  alternative: jego zagłada była straszna
  rationale: Grecki tekst mówi o wielkim upadku domu, lecz nie nazywa go wprost zagładą ani sądem eschatologicznym. Przekład zachowuje siłę ostrzeżenia bez dopowiadania jego teologicznego zakresu.
translation_notes:
  register: Język współczesny, prosty i godny. Powtórzenie spójnika „i” zachowuje rytm greckiej narracji, a powtórzenie słów „runął — upadek” odzwierciedla pokrewieństwo greckich ἔπεσεν i πτῶσις.
