source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: pl
  text: Proście[a], a będzie wam dane; szukajcie, a znajdziecie; pukajcie, a zostanie wam otwarte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie formy rozkazujące czasu teraźniejszego można też rozumieć jako wezwanie do wytrwałości: „Nie przestawajcie prosić… szukać… pukać”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Proście
  rationale: Tryb rozkazujący czasu teraźniejszego, 2. osoba liczby mnogiej. „Proście” naturalnie oddaje wezwanie skierowane do wielu osób, nie przesądzając w tekście głównym, czy aspekt należy wyraźnie rozwinąć jako czynność ciągłą lub powtarzaną.
- source_word: δοθήσεται
  choice: będzie wam dane
  rationale: Forma przyszła strony biernej została zachowana; polskie sformułowanie pozostawia dawcę niewymienionego, podobnie jak tekst grecki.
- source_word: ζητεῖτε
  choice: szukajcie
  rationale: Naturalny polski tryb rozkazujący, zachowujący zarówno dosłowny, jak i przenośny zakres znaczeniowy czasownika.
- source_word: εὑρήσετε
  choice: znajdziecie
  rationale: Prosty i bezpośredni odpowiednik greckiej formy przyszłej strony czynnej.
- source_word: κρούετε
  choice: pukajcie
  rationale: „Pukajcie” jest idiomatycznym polskim odpowiednikiem polecenia i zachowuje obraz pukania do drzwi.
- source_word: ἀνοιγήσεται
  choice: będzie wam otworzone
  rationale: Oddaje przyszłą stronę bierną i nie wskazuje wprost osoby, która otworzy, zachowując niedopowiedzenie tekstu greckiego.
- source_word: καὶ
  choice: a
  rationale: W tych równoległych konstrukcjach polskie „a” naturalnie łączy polecenie z następującą obietnicą, nie dodając silniejszego znaczenia wynikowego.
theological_decisions:
- issue: Aspekt trzech imperatywów czasu teraźniejszego
  choice: 'W tekście głównym użyto prostych form rozkazujących: „Proście”, „szukajcie”, „pukajcie”.'
  alternative: „Nie przestawajcie prosić… szukać… pukać” albo „Proście wytrwale…”.
  rationale: Grecki czas teraźniejszy może sugerować trwanie lub powtarzalność działań, ale same formy nie wymagają rozwinięcia tej wartości w przekładzie. Proste polskie imperatywy zachowują siłę polecenia, a możliwy sens ciągły wyjaśnia przypis.
- issue: Niewymieniony sprawca dania i otwarcia
  choice: 'Zachowano stronę bierną: „będzie wam dane” oraz „będzie wam otworzone”.'
  alternative: „Bóg wam da” oraz „Bóg wam otworzy”.
  rationale: W kontekście sprawcą może być rozumiany Bóg, lecz tekst grecki nie nazywa go w tym wersecie. Przekład nie powinien uzupełniać tego niedopowiedzenia w tekście głównym.
translation_notes:
  register: Współczesny, godny i zrozumiały język. Zachowano trójczłonowy rytm, paralelizm oraz stronę bierną oryginału; średniki wyraźnie rozdzielają kolejne wezwania i obietnice.
