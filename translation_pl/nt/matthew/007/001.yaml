  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: pl
  text: Nie sądźcie[a], abyście nie byli sądzeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie potępiajcie, abyście nie byli potępieni”. Grecki czasownik może w pewnych kontekstach oznaczać potępienie, lecz „sądzić” ma szerszy zakres i zachowuje w tym wersecie powtórzenie tego samego rdzenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Nie
  rationale: W połączeniu z trybem rozkazującym czasu teraźniejszego wprowadza zakaz; polskie „nie” naturalnie oddaje jego siłę.
- source_word: κρίνετε
  choice: sądźcie
  rationale: 'Czasownik κρίνω ma szeroki zakres znaczeniowy: sądzić, oceniać, osądzać lub potępiać. „Sądźcie” zachowuje tę szerokość oraz więź leksykalną z κριθῆτε.'
- source_word: ἵνα
  choice: abyście
  rationale: ἵνα z trybem łączącym wyraża tutaj cel lub skutek. „Abyście” zwięźle i naturalnie zachowuje tę relację.
- source_word: μὴ
  choice: nie
  rationale: Druga partykuła μὴ przeczy czasownikowi w stronie biernej.
- source_word: κριθῆτε
  choice: byli sądzeni
  rationale: Forma bierna tego samego czasownika κρίνω została oddana tym samym polskim rdzeniem, co zachowuje paralelizm i nie zawęża znaczenia do potępienia.
theological_decisions:
- issue: Zakres znaczeniowy κρίνω w zakazie Jezusa
  choice: Zachowano szersze „sądzić”, zamiast interpretacyjnie zawężać sens do „potępiać”.
  alternative: Nie potępiajcie, abyście nie byli potępieni.
  rationale: Sam werset nie określa wszystkich granic oceny moralnej; rozwija je najbliższy kontekst (Mt 7:2–5). Szerszy odpowiednik zachowuje napięcie tekstu i pozwala, by zakres zakazu wyjaśniał kontekst.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Konstrukcja „abyście nie byli sądzeni” jest naturalna w stylu biblijnym, a zarazem zrozumiała dla współczesnego odbiorcy.
