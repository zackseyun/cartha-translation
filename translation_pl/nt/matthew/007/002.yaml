id: MAT.7.2
reference: Matthew 7:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: pl
  text: Bo takim sądem, jakim sądzicie, będziecie sądzeni, i taką miarą, jaką mierzycie, zostanie wam odmierzone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „zostanie wam odmierzone”. Grecka forma bierna nie wskazuje, kto odmierzy; nie występuje też wprost słowo „z powrotem”.'
    reason: Zachowanie niewskazanego wykonawcy strony biernej i wyjaśnienie domyślnego sensu wzajemności.
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: sądem / sądzicie / będziecie sądzeni
  rationale: Zachowano powtórzenie wyrazów pokrewnych oraz ogólne znaczenie sądzenia, bez zawężania go do potępienia.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: miarą / mierzycie / odmierzą
  rationale: Polskie wyrazy pokrewne zachowują obraz mierzenia i przysłowiową siłę paralelizmu; bezosobowe znaczeniowo „wam odmierzą” brzmi naturalnie.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: jakim... takim / jaką... taką
  rationale: Konstrukcja korelacyjna naturalnie oddaje miarę lub zasadę, według której następuje wzajemna odpłata.
- source_word: γὰρ
  choice: Bo
  rationale: Spójnik zachowuje uzasadniający związek z zakazem z poprzedniego wersetu.
- source_word: μετρηθήσεται ὑμῖν
  choice: wam odmierzą
  rationale: Naturalna polska konstrukcja o znaczeniu nieosobowym zachowuje niewskazanego wykonawcę czynności; nie dodano wyrazu „z powrotem”, którego grecki tekst nie wyraża wprost.
theological_decisions:
- issue: Wykonawca wzajemnego sądu i odmierzenia
  choice: Pozostawiono go niewskazanego przez formę bierną „będziecie sądzeni” oraz znaczeniowo nieosobowe „wam odmierzą”.
  alternative: „Bóg będzie was sądził” albo „ludzie będą was sądzić”.
  rationale: Greckie formy bierne nie nazywają wykonawcy, dlatego przekład nie rozstrzyga, czy chodzi wyłącznie o sąd Boży, reakcję ludzi, czy szerzej ujętą zasadę wzajemności.
translation_notes:
  register: Współczesny, godny i przystępny polski. Paralelne konstrukcje „jakim… takim” oraz „jaką… taką” zachowują rytm i przysłowiowy charakter wypowiedzi; powtórzenia „sąd—sądzić” i „miara—mierzyć—odmierzyć” odzwierciedlają grecką grę wyrazów.
