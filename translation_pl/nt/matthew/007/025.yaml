  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: pl
  text: Spadł deszcz, nadciągnęły rzeki[a], powiały wiatry i uderzyły w ten dom[b], lecz on nie upadł, ponieważ był posadowiony na skale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gr. ποταμοί dosłownie: „rzeki”; możliwe też: „wezbrane rzeki” lub „rwące potoki”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „naparły na ten dom” lub „smagały ten dom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Spadł deszcz
  rationale: Naturalny polski odpowiednik obrazu deszczu schodzącego z góry; zachowuje ruch wyrażony przez καταβαίνω bez niezręcznego „deszcz zszedł”.
- source_word: ἦλθον οἱ ποταμοί
  choice: wezbrały rzeki
  rationale: ποταμοί dosłownie oznacza „rzeki”, natomiast czasownik „wezbrały” naturalnie oddaje w polskim kontekście nadejście wód zagrażających domowi. Dosłowną konstrukcję odnotowano w przypisie.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: zerwały się wiatry
  rationale: Idiomaticzne polskie sformułowanie opisujące gwałtowne pojawienie się i działanie wiatrów; odpowiada burzowemu kontekstowi czasownika πνέω.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: uderzyły w ten dom
  rationale: W kontekście burzy προσπίπτω oznacza naparcie lub uderzenie w dom. „Uderzyły” jest naturalne i nie przesądza, czy chodzi o pojedynczy cios, czy ciągłe smaganie.
- source_word: οὐκ ἔπεσεν
  choice: nie runął
  rationale: W odniesieniu do budynku polskie „runąć” naturalnie oddaje ἔπεσεν i oznacza zawalenie się bez dodawania obcej treści.
- source_word: τεθεμελίωτο ἐπὶ τὴν πέτραν
  choice: był posadowiony na skale
  rationale: „Posadowiony” zachowuje fundamentowy obraz czasownika θεμελιόω, a konstrukcja stanowa oddaje skutek wcześniejszego, dokonanego założenia fundamentu. „Na skale” zachowuje zwykły obraz przypowieści bez jego teologicznego objaśniania.
theological_decisions:
- issue: Znaczenie obrazu skały
  choice: na skale
  alternative: na podłożu skalnym
  rationale: Tekst tego wersetu nie utożsamia skały wprost z żadną osobą ani doktryną. Proste „na skale” zachowuje obraz i jego otwartość interpretacyjną.
translation_notes:
  register: Współczesny, godny i obrazowy język ogólnopolski. Zdanie zachowuje rytm kolejnych elementów burzy, unikając zarówno nienaturalnej dosłowności, jak i teologicznego dopowiadania sensu skały.
