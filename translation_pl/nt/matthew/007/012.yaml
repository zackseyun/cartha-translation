  naturalness: „Żeby” i „czyńcie” są poprawne i mieszczą się w godnym, współczesnym rejestrze biblijnym. Szyk „wy im tak samo czyńcie” jest naturalny, a zarazem jasno zachowuje wzajemną miarę działania.
