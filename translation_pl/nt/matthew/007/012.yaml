id: MAT.7.12
reference: Matthew 7:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: pl
  text: Wszystko więc, co chcecie, żeby ludzie wam czynili, wy im tak samo czyńcie; to bowiem jest Prawo i Prorocy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Wszystko więc, co
  rationale: Oddaje łącznie uniwersalny zakres Πάντα ὅσα oraz wynikowy charakter οὖν, zachowując naturalny polski szyk.
- source_word: ἐὰν θέλητε
  choice: chcecie
  rationale: Forma teraźniejsza wyraża ogólne pragnienie lub oczekiwanie; proste „chcecie” jest bliższe grece niż polski tryb warunkowy „chcielibyście”.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: żeby ludzie wam czynili
  rationale: „Ludzie” oddaje ogólne, niewskazujące wyłącznie na mężczyzn znaczenie οἱ ἄνθρωποι. Czasownik „czynić” zachowuje więź leksykalną z następującym ποιεῖτε.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: również wy im czyńcie
  rationale: „Czyńcie” oddaje imperatyw teraźniejszy, a „również wy” zachowuje emfatyczne καὶ ὑμεῖς i wzajemny charakter nakazu.
- source_word: οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται
  choice: to bowiem jest Prawo i Prorocy
  rationale: Zachowuje zwięzłą konstrukcję utożsamiającą oraz tradycyjną biblijną formułę „Prawo i Prorocy”, bez interpretacyjnego rozwijania jej znaczenia.
theological_decisions:
- issue: Ogólny sens οἱ ἄνθρωποι
  choice: ludzie
  alternative: mężczyźni
  rationale: W kontekście chodzi o wszystkich ludzi, a nie wyłącznie o osoby płci męskiej.
- issue: Zakres formuły ὁ νόμος καὶ οἱ προφῆται
  choice: Prawo i Prorocy
  alternative: całe etyczne nauczanie Pisma
  rationale: Pozostawiono utrwaloną żydowską i Mateuszową formułę zbiorczą, aby zachować jej intertekstualne i teologiczne napięcie bez dopowiadania parafrazy.
- issue: Charakter zdania οὗτος γάρ ἐστιν
  choice: to bowiem jest
  alternative: na tym bowiem polegają
  rationale: Dosłowniejsza konstrukcja zachowuje mocne utożsamienie obecne w grece; alternatywa interpretowałaby je jako streszczenie lub istotę nauczania.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rejestrze. Powtórzenie rdzenia „czynić” zachowuje retoryczną symetrię greckiego ποιῶσιν/ποιεῖτε. Wielkie litery w „Prawo i Prorocy” wskazują na utrwaloną nazwę części lub całości świadectwa Pisma.
