id: MAT.7.4
reference: Matthew 7:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: pl
  text: 'Albo jak powiesz swemu bratu[a]: „Pozwól, że wyjmę drzazgę[b] z twojego oka”, a oto w twoim oku tkwi belka[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki tekst mówi dosłownie „bratu”; męska liczba pojedyncza może być użyta reprezentatywnie.
    reason: cultural_note
  - marker: b
    text: 'Możliwe też: „drobinkę” lub „źdźbło”. Greckie κάρφος oznacza mały kawałek suchego materiału.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „bierwiono”. Greckie δοκός oznacza duży kawałek drewna, zwłaszcza belkę konstrukcyjną.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Albo jak powiesz
  rationale: Zachowuje spójnik wprowadzający kolejną retoryczną możliwość, pytajne πῶς oraz przyszłą formę ἐρεῖς.
- source_word: τῷ ἀδελφῷ σου
  choice: swojemu bratu
  rationale: Oddaje męski rzeczownik w liczbie pojedynczej i naturalnie wskazuje po polsku na relację podmiotu zdania z adresatem.
- source_word: Ἄφες ἐκβάλω
  choice: Pozwól, że wyjmę
  rationale: Imperatyw ἄφες z koniunktywem ma tu idiomatyczny sens prośby o pozwolenie; „wyjmę” naturalnie oddaje usunięcie przedmiotu z oka.
- source_word: τὸ κάρφος
  choice: drzazgę
  rationale: Kάρφος oznacza mały kawałek suchego materiału. „Drzazga” tworzy w języku polskim jasny i obrazowy kontrast z belką, choć grecki wyraz nie określa materiału tak ściśle.
- source_word: καὶ ἰδοὺ
  choice: a oto
  rationale: „Oto” zachowuje funkcję ἰδού jako wyrażenia kierującego uwagę, a zarazem brzmi godnie i współcześnie.
- source_word: ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ
  choice: w twoim oku tkwi belka
  rationale: „Belka” precyzyjnie oddaje duży element drewniany, a „tkwi” naturalnie uzupełnia pominięte w grece orzeczenie egzystencjalne i podtrzymuje obraz ciała obcego w oku.
theological_decisions:
- issue: Zakres odniesienia ἀδελφῷ
  choice: bratu
  alternative: bratu lub siostrze; współwyznawcy
  rationale: Tekst źródłowy używa rodzaju męskiego i liczby pojedynczej w hipotetycznym zwrocie do konkretnej osoby. Przekład zachowuje tę formę, nie rozstrzygając, czy w szerszym zastosowaniu reprezentuje ona wszystkich uczniów.
- issue: Hiperboliczny kontrast κάρφος / δοκός
  choice: drzazga / belka
  alternative: drobinka / belka; źdźbło / belka
  rationale: Wybrana para zachowuje celową, wyolbrzymioną dysproporcję obrazu bez łagodzenia jego retorycznej siły.
translation_notes:
  register: Współczesny, godny rejestr. Konstrukcja „Pozwól, że wyjmę” jest naturalna w polszczyźnie, „a oto” zachowuje uroczystą siłę zwrócenia uwagi, a obraz „drzazgi” i „belki” pozostaje wyrazisty i łatwo zrozumiały.
