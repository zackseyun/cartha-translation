id: MAT.7.15
reference: Matthew 7:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: pl
  text: Strzeżcie się fałszywych proroków[a], którzy przychodzą do was w owczej skórze[b], lecz wewnątrz są drapieżnymi wilkami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „Miejcie się na baczności przed fałszywymi prorokami”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „w odzieniu owiec”.'
    reason: lexical_alternative
  - marker: c
    text: 'Greckie określenie może też znaczyć: „grabieżczymi” lub „porywającymi zdobycz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Strzeżcie się
  rationale: Konstrukcja wzywa całą grupę do stałej czujności wobec wskazanego zagrożenia. „Strzeżcie się” jest naturalnym polskim ostrzeżeniem i zachowuje siłę trybu rozkazującego czasu teraźniejszego.
- source_word: ψευδοπροφητῶν
  choice: fałszywych proroków
  rationale: Standardowy i precyzyjny odpowiednik określający ludzi, którzy niesłusznie występują jako prorocy lub fałszywie przemawiają w tej roli.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: którzy przychodzą do was
  rationale: Naturalnie oddaje opis ich zbliżania się do adresatów; zaimek względny charakteryzuje osoby, przed którymi pada ostrzeżenie.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: w owczej skórze
  rationale: Utrwalony i zrozumiały polski obraz pozornej łagodności, funkcjonalnie odpowiadający greckiemu wyrażeniu o odzieniu owiec. Przypis zachowuje jego dosłowną postać.
- source_word: ἔσωθεν δέ
  choice: lecz wewnątrz
  rationale: Wyraźnie zachowuje przeciwstawienie wyglądu zewnętrznego i ukrytej rzeczywistości.
- source_word: λύκοι ἅρπαγες
  choice: drapieżnymi wilkami
  rationale: Przymiotnik ἅρπαγες wskazuje na grabieżczy, porywający i niszczycielski charakter. „Drapieżne” zachowuje siłę metafory bez zawężania jej wyłącznie do głodu.
theological_decisions:
- issue: Zakres ostrzeżenia przed zwodniczymi przywódcami religijnymi
  choice: Oddać wprost ostrzeżenie przed „fałszywymi prorokami” oraz kontrast między ich pozorami a rzeczywistym charakterem.
  alternative: Sprecyzować ich jako heretyckich nauczycieli albo przedstawicieli określonej późniejszej kategorii kościelnej.
  rationale: Tekst mówi o fałszywych prorokach i posługuje się obrazem owiec oraz wilków. Nie upoważnia do zawężenia ostrzeżenia do późniejszych kategorii wyznaniowych lub instytucjonalnych.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zdanie zachowuje żywy kontrast pomiędzy zewnętrznym pozorem łagodności a wewnętrzną drapieżnością. Idiom „w owczej skórze” jest powszechnie zrozumiały, a przypis dokumentuje bardziej dosłowną formę grecką.
source_grounding:
  english_pob_role: consult_only
