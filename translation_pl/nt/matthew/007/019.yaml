id: MAT.7.19
reference: Matthew 7:19
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: pl
  text: Każde drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone w ogień[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „które nie przynosi dobrego owocu”.'
    reason: lexical_alternative
  - marker: b
    text: „Ogień” jest obrazem sądu; sam werset nie rozstrzyga dokładniej, czy chodzi o sąd doczesny, eschatologiczny, czy o oba.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Każde drzewo
  rationale: 'πᾶν z rzeczownikiem w liczbie pojedynczej ma sens dystrybutywny: chodzi o każde drzewo z osobna. To naturalne polskie sformułowanie zachowuje przysłowiowy charakter wypowiedzi.'
- source_word: μὴ ποιοῦν
  choice: które nie wydaje
  rationale: Imiesłów czasu teraźniejszego opisuje stałą, charakterystyczną czynność. W połączeniu z owocem polskie „wydaje” jest naturalne i wiernie oddaje sens wytwarzania lub przynoszenia owocu.
- source_word: καρπὸν καλὸν
  choice: dobrego owocu
  rationale: καλός oznacza tutaj to, co dobre, wartościowe lub właściwe. „Dobry owoc” zachowuje prostotę obrazu oraz jego ocenę moralną w kontekście.
- source_word: ἐκκόπτεται
  choice: zostaje wycięte
  rationale: Strona bierna wskazuje na los takiego drzewa. „Wycięte” jest w języku polskim naturalnym określeniem ścięcia i usunięcia drzewa.
- source_word: εἰς πῦρ βάλλεται
  choice: wrzucone w ogień
  rationale: Zwrot wyraża ruch do ognia, a strona bierna czasownika βάλλω — bycie wrzuconym. Polski rzeczownik bez rodzajnika nie wymusza doprecyzowania, o jaki dokładnie ogień chodzi.
theological_decisions:
- issue: Obraz ognia jako sądu
  choice: Zachować obraz wycięcia i wrzucenia w ogień bez określania dokładnego odniesienia ognia.
  alternative: Sąd doczesny, sąd eschatologiczny albo piekło.
  rationale: Werset wyraźnie przedstawia ostrzeżenie przed sądem za pomocą obrazu drzewa, lecz sam nie precyzuje zakresu ani czasu tego sądu. Przekład nie zawęża zatem obrazu do jednej interpretacji doktrynalnej.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zdanie zachowuje obrazowość oryginału oraz typowy polski zwrot „wydawać owoc”; konstrukcja „zostaje wycięte i wrzucone” naturalnie oddaje dwa greckie czasowniki w stronie biernej.
