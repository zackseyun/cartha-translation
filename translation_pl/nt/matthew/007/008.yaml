id: MAT.7.8
reference: Matthew 7:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: pl
  text: Każdy bowiem, kto prosi, otrzymuje; kto szuka, znajduje, a temu, kto puka, zostanie otworzone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greka nie mówi wprost, co zostanie otworzone; z obrazu pukania można domyślić się drzwi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: każdy
  rationale: Użyte rzeczownikowo wraz z imiesłowem obejmuje każdą osobę należącą do wskazanej grupy; „każdy, kto” jest naturalne i zachowuje powszechny zakres wypowiedzi.
- source_word: γὰρ
  choice: bowiem
  rationale: Zachowuje wyjaśniające powiązanie z poprzednim wezwaniem, a zarazem odpowiada godnemu, współczesnemu rejestrowi.
- source_word: ὁ αἰτῶν
  choice: kto prosi
  rationale: Oddaje urzeczownikowiony imiesłów czasu teraźniejszego jako ogólną, powtarzalną czynność, bez nadmiernej dosłowności.
- source_word: λαμβάνει
  choice: otrzymuje
  rationale: Jest zwykłym i precyzyjnym odpowiednikiem w tym kontekście oraz zachowuje paralelizm zdania.
- source_word: ὁ ζητῶν
  choice: kto szuka
  rationale: Naturalnie oddaje konstrukcję z rodzajnikiem i imiesłowem oraz utrzymuje rytmiczną równoległość członów.
- source_word: εὑρίσκει
  choice: znajduje
  rationale: Prosty, podstawowy odpowiednik, właściwy dla zwięzłej i łatwej do zapamiętania sentencji.
- source_word: τῷ κρούοντι
  choice: temu, kto puka
  rationale: Celownik wskazuje osobę, dla której następuje czynność wyrażona stroną bierną; polska konstrukcja zachowuje tę relację.
- source_word: ἀνοιγήσεται
  choice: zostanie otworzone
  rationale: Oddaje czas przyszły i stronę bierną, nie dodając rzeczownika „drzwi”, którego tekst grecki nie wyraża wprost.
theological_decisions:
- issue: Zakres i moc obietnicy
  choice: Ogólne zapewnienie wyrażone w powszechnych kategoriach, bez dopisywania ograniczeń ani bezwzględnej gwarancji oderwanej od kontekstu.
  alternative: Rozumienie jako gwarancji spełnienia każdej konkretnej prośby dokładnie w żądanej postaci albo jako obietnicy ograniczonej wyłącznie do pewnego rodzaju próśb duchowych.
  rationale: Tekst posługuje się szerokim określeniem „każdy” i należy zachować jego pełną moc, nie rozstrzygając w samym przekładzie napięcia teologicznego wynikającego z szerszego kontekstu.
translation_notes:
  register: Współczesny, godny i zwięzły język. Zachowano trójczłonowy paralelizm oraz ogólny, sentencjonalny charakter wypowiedzi. Średniki wspierają rytm i czytelność.
