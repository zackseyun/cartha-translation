  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: pl
  text: Albo czy jest wśród was człowiek[a], którego syn poprosi o chleb, a ten da mu kamień?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „kto z was”; grecki wyraz oznaczający „człowieka” jest tu użyty reprezentatywnie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Albo
  rationale: Wprowadza kolejne retoryczne porównanie i zachowuje ciąg argumentacji z poprzedniego wersetu.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: czy jest wśród was taki człowiek
  rationale: Naturalna polska konstrukcja pytajna oddająca sens „kto spośród was jest takim człowiekiem”; „człowiek” zachowuje reprezentatywne użycie ἄνθρωπος.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: którego syn poprosi
  rationale: Polska konstrukcja względna naturalnie łączy ojca z jego synem, a czas przyszły „poprosi” odpowiada formie αἰτήσει.
- source_word: ἄρτον
  choice: o chleb
  rationale: Bezpośredni i kontekstowo trafny odpowiednik; nie zawęża znaczenia do konkretnego bochenka ani nie rozszerza go do żywności w ogóle.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: a on poda mu kamień?
  rationale: Pytanie retoryczne w języku polskim naturalnie sugeruje odpowiedź przeczącą. „Poda” dobrze oddaje przekazanie proszącemu przedmiotu i wyraźnie kontrastuje chleb z kamieniem.
theological_decisions:
- issue: Reprezentatywny język rodzaju męskiego
  choice: taki człowiek
  alternative: kto z was
  rationale: Greckie ἄνθρωπος występuje w reprezentatywnej konstrukcji rodzaju męskiego. Przekład zachowuje to brzmienie, nie ograniczając sensu wyłącznie do dorosłych mężczyzn.
- issue: Negatywne oczekiwanie pytania retorycznego
  choice: a on poda mu kamień?
  alternative: czy poda mu kamień?
  rationale: Greckie μή wskazuje, że oczekiwana odpowiedź brzmi „nie”. Polski szyk i forma pytania wystarczająco zachowują tę siłę bez dodawania nieobecnego w zdaniu oznajmienia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja „taki człowiek” brzmi naturalnie w polskim pytaniu retorycznym, a powtórzenie zaimków ograniczono bez utraty odniesień.
