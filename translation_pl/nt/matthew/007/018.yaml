id: MAT.7.18
reference: Matthew 7:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: pl
  text: Dobre drzewo[a] nie może wydawać złych owoców ani spróchniałe drzewo[b] wydawać dobrych owoców.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zdrowe drzewo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „zgniłe” lub „zbutwiałe drzewo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: dobre drzewo
  rationale: Podstawowe znaczenie ἀγαθός to „dobry”. W obrazie drzewa zachowuje ono zarówno sens dosłowny, jak i wartościujący, bez zawężania metafory wyłącznie do stanu zdrowotnego.
- source_word: οὐ δύναται ... ποιεῖν
  choice: nie może wydawać
  rationale: δύναται wyraża możliwość lub zdolność, tutaj zanegowaną, natomiast ποιεῖν z καρπούς odpowiada po polsku naturalnemu zwrotowi „wydawać owoce”.
- source_word: καρποὺς πονηρούς
  choice: złych owoców
  rationale: 'Polskie „złych” zachowuje szeroki zakres πονηρός: może opisywać zarówno złą jakość owocu, jak i moralnie złe skutki wskazywane przez metaforę.'
- source_word: οὐδέ
  choice: ani
  rationale: „Ani” naturalnie łączy po polsku drugi człon równoległego przeczenia i zachowuje wyważoną konstrukcję zdania.
- source_word: δένδρον σαπρόν
  choice: spróchniałe drzewo
  rationale: σαπρός oznacza coś zgniłego, zbutwiałego lub zepsutego. „Spróchniałe” jest obrazowe i naturalne w odniesieniu do drzewa, a zarazem wyraźnie kontrastuje z drzewem dobrym.
- source_word: καρποὺς καλούς
  choice: dobrych owoców
  rationale: καλός określa tu owoc dobrej jakości. „Dobre owoce” brzmi naturalnie i zachowuje kontrast ze „złymi owocami”.
theological_decisions:
- issue: Charakter niemożliwości wyrażonej w metaforze
  choice: Kategoryczne „nie może”
  alternative: „zwykle nie wydaje” albo „nie powinno wydawać”
  rationale: Greckie οὐ δύναται wyraża niemożność, a nie jedynie małe prawdopodobieństwo lub powinność. Przekład zachowuje siłę wypowiedzi, nie wyprowadzając z metafory dodatkowych wniosków doktrynalnych.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano paralelizm obu członów oraz naturalny polski zwrot „wydawać owoce”. Słowo „złych” samo obejmuje zarówno znaczenie jakościowe („niedobrych”), jak i moralne („niegodziwych”), dlatego nie wymaga osobnego przypisu.
