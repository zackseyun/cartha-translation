id: MAT.7.23
reference: Matthew 7:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: pl
  text: 'A wtedy oświadczę im: „Nigdy was nie znałem[a]. Odejdźcie ode mnie, wy, którzy czynicie nieprawość[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nigdy was nie uznałem”. Greckie „znałem” może oznaczać relacyjne uznanie, a nie tylko wiedzę o kimś.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „którzy dopuszczacie się bezprawia” lub „którzy czynicie zło”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: A wtedy
  rationale: Zachowuje zarówno powiązanie z poprzednią wypowiedzią, jak i następstwo czasowe.
- source_word: ὁμολογήσω
  choice: oświadczę
  rationale: W tym uroczystym, sądowym kontekście czasownik oznacza jawne i stanowcze oznajmienie, a nie wyznanie winy.
- source_word: Οὐδέποτε
  choice: nigdy
  rationale: Naturalnie i zwięźle oddaje bezwzględną, emfatyczną negację.
- source_word: ἔγνων
  choice: znałem
  rationale: Zachowuje prostotę greckiego sformułowania oraz jego możliwy sens relacyjny, bez zawężania go do samej wiedzy, uznania czy aprobaty.
- source_word: ἀποχωρεῖτε
  choice: odejdźcie
  rationale: Oddaje stanowczy nakaz oddalenia się w naturalnym, uroczystym polskim rejestrze.
- source_word: οἱ ἐργαζόμενοι
  choice: wy, którzy czynicie
  rationale: Imiesłów opisuje działalność lub charakterystyczne postępowanie; konstrukcja względna jest jasna i zachowuje aspekt czynnego dopuszczania się czegoś.
- source_word: τὴν ἀνομίαν
  choice: nieprawość
  rationale: Termin zachowuje moralno-prawny sens ἀνομία i jest w języku polskim szerszy oraz bardziej stosowny w tym kontekście niż potoczne skojarzenie bezprawia wyłącznie z naruszeniem prawa państwowego.
theological_decisions:
- issue: Znaczenie słów „Nigdy was nie znałem”
  choice: Pozostawiono dosłowne, relacyjne sformułowanie „Nigdy was nie znałem”.
  alternative: „Nigdy was nie uznałem” lub „Nigdy was nie aprobowałem”.
  rationale: Greka mówi wprost o poznaniu/znaniu. Parafraza w kategoriach aprobaty albo przynależności rozstrzygałaby napięcie teologiczne, którego sam werset nie objaśnia.
- issue: Zakres znaczeniowy ἀνομία
  choice: „nieprawość”
  alternative: „bezprawie”, „zło”
  rationale: „Nieprawość” zachowuje odniesienie do naruszenia właściwego porządku lub prawa, nie sprowadzając wypowiedzi ani do świeckiej nielegalności, ani do ogólnie pojętego zła.
translation_notes:
  register: Współczesny, uroczysty i bezpośredni rejestr. Zachowano biblijny idiom „znałem” oraz moralno-prawne brzmienie „nieprawość”, unikając archaicznych form i doktrynalnej parafrazy.
