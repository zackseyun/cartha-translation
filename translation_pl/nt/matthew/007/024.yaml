id: MAT.7.24
reference: Matthew 7:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: pl
  text: Dlatego każdy, kto słucha tych moich słów i wprowadza je w czyn, zostanie przyrównany[a] do roztropnego mężczyzny[b], który zbudował swój dom na skale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „będzie podobny do” albo „będzie można go porównać do”.'
    reason: lexical_alternative
  - marker: b
    text: Grecki tekst mówi o roztropnym mężczyźnie; sama postać użyta w porównaniu jest rodzaju męskiego.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Dlatego każdy, kto
  rationale: 'Πᾶς z ὅστις ma sens dystrybutywny i ogólny: „każdy, kto”. οὖν wprowadza wniosek wynikający z poprzedniej nauki, dlatego oddano je jako „dlatego”.'
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: słucha tych moich słów
  rationale: „Słucha” naturalnie wyraża czynne przyjmowanie wypowiedzi, a szyk „tych moich słów” zachowuje wskazujący i osobisty charakter greckiego wyrażenia.
- source_word: καὶ ποιεῖ αὐτούς
  choice: i wprowadza je w czyn
  rationale: Dosłowne „czyni je” byłoby we współczesnej polszczyźnie nienaturalne. „Wprowadza je w czyn” jasno zachowuje sens wykonywania tego, co zostało usłyszane, bez dodawania interpretacji wyznaniowej.
- source_word: ὁμοιωθήσεται
  choice: zostanie przyrównany
  rationale: Forma zachowuje przyszły czas i stronę bierną greckiego czasownika, a zarazem brzmi zrozumiale po polsku. Nie przesądza, kto dokonuje porównania.
- source_word: ἀνδρὶ φρονίμῳ
  choice: do roztropnego mężczyzny
  rationale: ἀνήρ oznacza tu osobę płci męskiej, dlatego wybrano „mężczyzna”, nie neutralne „człowiek”. φρόνιμος w tym kontekście oznacza kogoś rozważnego i praktycznie rozsądnego; tradycyjne „roztropny” dobrze zachowuje ten odcień.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: który zbudował swój dom
  rationale: „Zbudował” bezpośrednio oddaje czynność, a „swój dom” jest naturalnym polskim odpowiednikiem greckiej konstrukcji dzierżawczej.
- source_word: ἐπὶ τὴν πέτραν
  choice: na skale
  rationale: „Skała” bezpośrednio oddaje πέτρα i zachowuje obraz trwałego skalnego podłoża bez doprecyzowywania go jako fundamentu skalnego.
theological_decisions:
- issue: Bierna forma porównania
  choice: zostanie przyrównany
  alternative: będzie podobny / będzie można go porównać
  rationale: Zachowanie strony biernej pozostawia otwarte, czy jest to zwykła konstrukcja porównawcza, czy też niewskazany wprost podmiot dokonuje oceny; przekład nie rozstrzyga tej możliwej różnicy.
- issue: Męski charakter postaci w porównaniu
  choice: roztropnego mężczyzny
  alternative: roztropnego człowieka
  rationale: Greckie ἀνήρ jest gramatycznie i leksykalnie męskie. Ogólny zakres wezwania wyraża już „każdy, kto”, natomiast postać w obrazie pozostaje mężczyzną.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zwrot „wprowadza je w czyn” unika nienaturalnego „czyni je”, natomiast „zostanie przyrównany” celowo zachowuje bierną postać oryginału. „Roztropny” utrzymuje biblijny rejestr, pozostając słowem powszechnie zrozumiałym.
