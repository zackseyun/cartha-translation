  source_fidelity: 'Przekład wiernie oddaje wszystkie podstawowe elementy greckiego tekstu: wnioskowe οὖν („Dlatego”), ogólny zakres Πᾶς ὅστις („każdy, kto”), słuchanie słów Jezusa, ich wykonywanie, przyszłe porównanie oraz obraz roztropnego mężczyzny, który zbudował własny dom na skale. „Wprowadza je w czyn” jest trafnym, idiomatycznym odpowiednikiem ποιεῖ αὐτούς.'
  naturalness: Tekst jest naturalny we współczesnej polszczyźnie i zachowuje godny, biblijny rejestr. „Zostanie przyrównany do” poprawnie zachowuje przyszłą stronę bierną i nie brzmi sztucznie; „roztropnego mężczyzny” jest zrozumiałe, choć nieco bardziej formalne, co odpowiada rejestrowi wypowiedzi.
  terminology: „Słowa”, „wprowadza je w czyn”, „roztropny”, „dom” i „skała” są trafne. Zachowanie „mężczyzny” właściwie odzwierciedla ἀνήρ w postaci użytej w porównaniu, bez ograniczania ogólnego „każdy, kto”. Przypisy są poprawnie zakotwiczone i rzeczowo objaśniają wariant przekładowy oraz rodzaj męski postaci.
