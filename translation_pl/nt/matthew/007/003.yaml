id: MAT.7.3
reference: Matthew 7:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: pl
  text: Dlaczego widzisz drzazgę[a] w oku swojego brata[b], a nie dostrzegasz belki[c] we własnym oku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „drobinkę”, „źdźbło” lub „odłamek” (κάρφος).'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „brata”; grecki tekst ma formę rodzaju męskiego w liczbie pojedynczej.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „kłodę” lub „belkę konstrukcyjną” (δοκός).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: dlaczego
  rationale: W pytaniu z βλέπεις zaimek τί ma idiomatyczną siłę pytajną „dlaczego”, co zachowuje retoryczny charakter wypowiedzi.
- source_word: δὲ
  choice: zaś
  rationale: Wyraża łagodne przeciwstawienie lub przejście; „zaś” brzmi naturalnie i dostojnie, bez nadmiernie ostrego kontrastu.
- source_word: βλέπεις
  choice: widzisz
  rationale: Podstawowy sens czasownika zachowuje konkretny obraz i kontrast z κατανοεῖς.
- source_word: κάρφος
  choice: drzazgę
  rationale: Termin oznacza mały suchy fragment, m.in. drzazgę, źdźbło lub drobinę. „Drzazga” jest naturalna w polskim obrazie czegoś znajdującego się w oku i wyraźnie kontrastuje z belką.
- source_word: ἀδελφοῦ
  choice: brata
  rationale: Grecki rzeczownik występuje w rodzaju męskim i liczbie pojedynczej; przekład zachowuje tę formę zamiast ją neutralizować.
- source_word: σῷ
  choice: własnym
  rationale: Forma dzierżawcza jest emfatyczna i przeciwstawia oko rozmówcy oku jego brata; „własnym” naturalnie oddaje ten nacisk.
- source_word: δοκόν
  choice: belki
  rationale: δοκός oznacza dużą belkę konstrukcyjną. „Belka” wiernie zachowuje architektoniczny sens i hiperboliczny kontrast z drzazgą.
- source_word: οὐ κατανοεῖς
  choice: nie dostrzegasz
  rationale: κατανοέω może znaczyć uważnie zauważać lub rozpoznawać. „Nie dostrzegasz” odróżnia ten czasownik od βλέπεις, a zarazem zachowuje ironię pytania.
- source_word: ὀφθαλμῷ
  choice: oku
  rationale: Standardowy polski odpowiednik w tym konkretnym, metaforycznie zastosowanym obrazie.
theological_decisions:
- issue: Rodzaj gramatyczny terminu pokrewieństwa ἀδελφοῦ
  choice: brata
  alternative: brata lub siostry; bliźniego
  rationale: Tekst grecki ma rzeczownik rodzaju męskiego w liczbie pojedynczej. Choć pouczenie ma szersze zastosowanie, przekład zachowuje źródłową formę bez zawężania lub neutralizowania jej w tekście głównym.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, przystępnym rejestrze. Zachowano pytanie retoryczne, kontrast między „widzisz” a „nie dostrzegasz” oraz hiperbolę drzazgi i belki. Markery przypisów umieszczono bezpośrednio po wyrazach, których dotyczą.
