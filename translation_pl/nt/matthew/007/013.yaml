id: MAT.7.13
reference: Matthew 7:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: pl
  text: Wejdźcie przez wąską bramę. Szeroka bowiem jest brama[a] i przestronna droga, która prowadzi do zguby[b], a wielu przez nią[c] wchodzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: W części rękopisów brak słowa „brama” w tym miejscu.
    reason: textual_variant
  - marker: b
    text: 'Także: „do zagłady” lub „do zniszczenia”.'
    reason: lexical_alternative
  - marker: c
    text: Zaimek „nią” może gramatycznie odnosić się zarówno do bramy, jak i do drogi; wchodzenie „przez” coś przemawia za bramą.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Wejdźcie
  rationale: Aorystowy tryb rozkazujący w drugiej osobie liczby mnogiej oddano bezpośrednim, naturalnym poleceniem.
- source_word: διὰ τῆς στενῆς πύλης
  choice: przez wąską bramę
  rationale: διά z dopełniaczem wyraża przejście przez coś; „wąska brama” jest naturalnym polskim odpowiednikiem i zachowuje obraz przestrzenny.
- source_word: ὅτι
  choice: bowiem
  rationale: Spójnik wprowadza uzasadnienie wcześniejszego nakazu; szyk z „bowiem” jest zwięzły i godny.
- source_word: πλατεῖα ἡ πύλη
  choice: szeroka jest brama
  rationale: Zachowano emfatyczne wysunięcie przymiotnika oraz wyraźny kontrast z wąską bramą.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: przestronna droga
  rationale: εὐρύχωρος oznacza coś szerokiego, obszernego lub przestronnego. „Przestronna” unika mechanicznego powtórzenia „szeroka”, a zarazem wiernie oddaje obraz drogi dającej dużo miejsca.
- source_word: ἡ ἀπάγουσα
  choice: która prowadzi
  rationale: Imiesłów określający drogę naturalnie oddano polskim zdaniem względnym.
- source_word: εἰς τὴν ἀπώλειαν
  choice: do zguby
  rationale: „Zguba” zachowuje powagę ostrzeżenia i szeroki zakres znaczeniowy ἀπώλεια, nie rozstrzygając ponad tekst, na czym dokładnie polega ostateczny los.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: a wielu przez nią wchodzi
  rationale: Naturalna polska konstrukcja zachowuje nacisk na wielką liczbę wchodzących. Żeński zaimek „nią” odtwarza formalną niejednoznaczność greckiego αὐτῆς.
theological_decisions:
- issue: Znaczenie ἀπώλεια w ostrzeżeniu Jezusa
  choice: zguba
  alternative: zagłada; zniszczenie
  rationale: „Zguba” wskazuje na katastrofalny kres, lecz nie narzuca bardziej szczegółowej wykładni natury tego losu.
- issue: Odniesienie zaimka αὐτῆς
  choice: nią
  alternative: tą bramą; tą drogą
  rationale: Zarówno πύλη, jak i ὁδός są w grece rodzaju żeńskiego. Kontekst przechodzenia przez bramę sprzyja odniesieniu do bramy, lecz polski zaimek pozwala zachować formalną niejednoznaczność tekstu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o podniosłym, lecz przystępnym brzmieniu. Zachowano paralelny obraz bramy i drogi oraz umiarkowanie formalny szyk „Szeroka bowiem jest brama”.
