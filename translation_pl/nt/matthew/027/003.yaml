id: MAT.27.3
reference: Matthew 27:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: pl
  text: Wtedy Judasz, który go wydał, widząc, że został skazany, pożałował tego i zwrócił trzydzieści srebrników arcykapłanom i starszym.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wskaźnik następstwa wydarzeń, odpowiadający temporalnej funkcji greckiego przysłówka.
- source_word: ἰδὼν
  choice: widząc
  rationale: Imiesłów zachowuje zwięzły związek z głównymi czynnościami i oddaje temporalno-okolicznościową funkcję greckiej formy.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: który go wydał
  rationale: W tym kontekście παραδίδωμι oznacza wydanie Jezusa władzom; zdanie względne brzmi naturalnie po polsku i identyfikuje Judasza przez jego czyn.
- source_word: ὅτι κατεκρίθη
  choice: że został skazany
  rationale: Oddaje aoryst strony biernej bez dodawania niewystępującego w tekście imienia Jezusa; kontekst wskazuje, kto został skazany.
- source_word: μεταμεληθεὶς
  choice: pożałował tego
  rationale: Wyraża żal z powodu dokonanego czynu, nie przesądzając o pełnym nawróceniu lub pokucie.
- source_word: ἔστρεψεν
  choice: zwrócił
  rationale: W połączeniu z pieniędzmi i odbiorcami czasownik oznacza oddanie ich z powrotem.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: trzydzieści srebrników
  rationale: Zwięzłe, utrwalone i zrozumiałe polskie określenie sztuk srebrnego pieniądza, zachowujące biblijne i międzytekstowe skojarzenia.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: arcykapłanom i starszym
  rationale: Standardowe polskie nazwy wskazanych grup żydowskich przywódców.
theological_decisions:
- issue: Znaczenie μεταμεληθεὶς w opisie reakcji Judasza
  choice: pożałował tego
  alternative: nawrócił się / pokutował
  rationale: μεταμέλομαι wskazuje na żal lub zmianę odczucia, lecz samo w sobie nie rozstrzyga o pełnym nawróceniu. Przekład nie powinien narzucać mocniejszej oceny teologicznej.
translation_notes:
  register: Współczesny, godny i czytelny rejestr. Zachowano imiesłowową budowę oryginału, ponieważ pozostaje naturalna w polszczyźnie. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną współczesną ortografią przekładową.
