id: MAT.27.1
reference: Matthew 27:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: pl
  text: Kiedy nastał ranek[a], wszyscy arcykapłani i starsi ludu odbyli naradę[b] przeciwko Jezusowi, aby go uśmiercić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „O świcie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „naradzili się”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Kiedy nastał ranek
  rationale: Imiesłowowy dopełniacz niezależny wyznacza przejście czasowe. Polski zwrot jest naturalny i zachowuje sens nadejścia poranka; δέ pozostaje oddane przez samo przejście narracyjne.
- source_word: συμβούλιον ἔλαβον
  choice: odbyli naradę
  rationale: Grecki idiom oznacza wspólne obradowanie lub naradzanie się. „Odbyli naradę” zachowuje formalny charakter sytuacji, nie przesądzając, czy chodzi przede wszystkim o samo obradowanie, plan czy o podjętą uchwałę.
- source_word: πάντες
  choice: wszyscy
  rationale: Wyraźnie zachowuje podkreśloną w tekście powszechność udziału wymienionych przywódców.
- source_word: οἱ ἀρχιερεῖς
  choice: arcykapłani
  rationale: Utrwalone i trafne polskie określenie jerozolimskiej elity kapłańskiej; nie sugeruje ono, że wszyscy jednocześnie sprawowali urząd jedynego najwyższego kapłana.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: starsi ludu
  rationale: Naturalne, formalne określenie przywódców reprezentujących lud, zachowujące konstrukcję dopełniaczową.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: przeciwko Jezusowi
  rationale: W tym wrogim kontekście κατά z dopełniaczem wyraża działanie wymierzone w Jezusa, a nie jedynie rozmowę na jego temat.
- source_word: ὥστε
  choice: aby
  rationale: W połączeniu z bezokolicznikiem wskazuje tutaj zamierzony skutek lub cel. Polskie „aby” zwięźle zachowuje tę relację, bez sztucznego rozstrzygania między odcieniem celu a zamierzonego rezultatu.
- source_word: θανατῶσαι αὐτόν
  choice: go uśmiercić
  rationale: Oddaje spowodowanie śmierci w formalnym kontekście. Nie dodaje bardziej szczegółowego sensu prawnego „skazać” ani proceduralnego „stracić”.
theological_decisions:
- issue: Charakter działania przywódców wobec Jezusa
  choice: Wroga narada zmierzająca do uśmiercenia Jezusa
  alternative: Słabsze „naradzali się w sprawie Jezusa” albo mocniejsze „knuli spisek przeciwko Jezusowi”
  rationale: κατά wyraźnie wskazuje wrogość, a ὥστε θανατῶσαι αὐτόν — śmiertelny zamiar. „Odbyli naradę przeciwko Jezusowi” zachowuje oba elementy, lecz nie dopisuje konspiracyjnego odcienia słowa „spisek” ani nie osłabia konfliktu.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zdanie zachowuje formalny charakter narady przywódców oraz zwięzłość greckiej narracji; zaimki odnoszące się do Jezusa zapisano zgodnie ze standardową współczesną ortografią małą literą.
