  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: pl
  text: 'Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza[a]: „I wzięli trzydzieści srebrników, cenę tego, którego wyceniono — którego wycenili spośród synów Izraela[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mateusz przypisuje te prorockie słowa Jeremiaszowi. Ich brzmienie jest najbardziej zbliżone do Za 11,12–13. Wyjaśnia się to różnie: jako cytat złożony, odwołanie do zbioru pism prorockich albo problem powstały w przekazie tekstu.'
    reason: textual_variant
  - marker: b
    text: 'Możliwe też: „od synów Izraela”. Greckie wyrażenie jest trudne; przekład „spośród synów Izraela” oddaje prawdopodobny sens cząstkowy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny, zwięzły odpowiednik przysłówka wskazującego następstwo wydarzeń.
- source_word: ἐπληρώθη τὸ ῥηθέν
  choice: wypełniło się to, co zostało powiedziane
  rationale: Zachowuje Mateuszową formułę wypełnienia oraz bierny charakter wcześniejszej wypowiedzi.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: przez proroka Jeremiasza
  rationale: Oddaje pośrednictwo proroka wyrażone przez διά z dopełniaczem i brzmi naturalnie po polsku.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: trzydzieści srebrników
  rationale: Srebrnik jest utrwalonym i nadal zrozumiałym polskim określeniem sztuki srebrnego pieniądza.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: cenę tego, którego wyceniono
  rationale: Handlowe znaczenie τιμή oddano jako „cena”, a imiesłów od τιμάω jako „którego wyceniono”, zachowując gorzką ironię kontekstu.
- source_word: ὃν ἐτιμήσαντο
  choice: którego wycenili
  rationale: Powtórzenie czasownika „wycenić” odzwierciedla powtórzenie τιμάω w grece.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: spośród synów Izraela
  rationale: Oddaje prawdopodobny sens cząstkowy trudnego wyrażenia, nie ukrywając jego związku z grupą synów Izraela.
theological_decisions:
- issue: Przypisanie wypowiedzi Jeremiaszowi, choć brzmienie najbliżej odpowiada Za 11,12–13
  choice: Zachowano w tekście głównym imię „Jeremiasz” bez harmonizowania.
  alternative: Zmiana na „Zachariasz” albo ogólne „przez proroka”.
  rationale: SBLGNT wyraźnie podaje Jeremiasza; przekład powinien zachować świadectwo tekstu i istniejące napięcie, a problem objaśnić w przypisie.
- issue: Niejednoznaczność ἀπὸ υἱῶν Ἰσραήλ
  choice: spośród synów Izraela
  alternative: od synów Izraela
  rationale: Konstrukcja grecka jest trudna. Sens cząstkowy daje spójniejsze polskie zdanie, ale alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano tradycyjnie zrozumiałe „srebrniki”, natomiast powtórzenie „wyceniono — wycenili” świadomie odtwarza grecką grę słowną. Myślnik porządkuje składnię trudnego cytatu bez rozstrzygania jego niejednoznaczności.
