  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: pl
  text: A gdy był oskarżany przez arcykapłanów i starszych, nic nie odpowiedział.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie udzielił żadnej odpowiedzi”.'
    reason: Alternatywny, bardziej idiomatyczny sposób oddania połączenia οὐδὲν ἀπεκρίνατο.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: gdy oskarżali go
  rationale: Konstrukcja ἐν z rodzajnikiem i bezokolicznikiem wyraża tu równoczesność. Polski czasownik niedokonany zachowuje trwający charakter oskarżania, a forma czynna brzmi naturalniej niż dosłowne „gdy był oskarżany”.
- source_word: κατηγορεῖσθαι
  choice: oskarżali go
  rationale: Czasownik oznacza wnoszenie oskarżeń przeciw komuś; „oskarżali” jest w tym kontekście współczesnym i precyzyjnym odpowiednikiem.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: naczelni kapłani i starsi
  rationale: ἀρχιερεῖς oznacza przywódców kapłańskich, dlatego tradycyjne i zrozumiałe „naczelni kapłani” jest trafniejsze niż dosłowna liczba mnoga „arcykapłani”. „Starsi” odpowiada πρεσβύτεροι bez dopowiadania ich funkcji.
- source_word: οὐδὲν
  choice: nic
  rationale: Zaimek zachowano jako bezpośrednie dopełnienie czasownika „odpowiedział”, bez rozszerzania znaczenia.
- source_word: ἀπεκρίνατο
  choice: nie odpowiedział
  rationale: Aorystyczna forma czasownika ἀποκρίνομαι opisuje fakt udzielenia odpowiedzi. W połączeniu z οὐδέν naturalny polski szyk brzmi „nic nie odpowiedział”.
- source_word: καὶ
  choice: A
  rationale: Spójnik kontynuuje narrację; polskie „A” płynnie łączy zdanie z poprzednim kontekstem, nie wprowadzając silnego przeciwstawienia.
theological_decisions:
- issue: Milczenie Jezusa wobec oskarżycieli
  choice: 'Przedstawić milczenie jako prosty fakt narracyjny: „nic nie odpowiedział”.'
  alternative: Użyć bardziej interpretacyjnego sformułowania, które wyraźniej nawiązywałoby do Izajasza 53.
  rationale: Werset opisuje zachowanie Jezusa, lecz sam nie stwierdza, że jest to wypełnienie proroctwa. Przekład nie powinien dodawać takiej interpretacji.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Szyk czynny „oskarżali go” naturalnie oddaje grecką konstrukcję bierną wraz ze wskazaniem sprawców. Termin „naczelni kapłani” zachowuje utrwalone znaczenie grupy przywódców kapłańskich.
