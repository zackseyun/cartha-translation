  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: pl
  text: A on nie odpowiedział mu ani jednym słowem, tak że namiestnik bardzo się dziwił.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῷ
  choice: nie odpowiedział mu
  rationale: Czasownik ἀποκρίνομαι oznacza tu „odpowiedzieć”, a zaimek w celowniku wskazuje osobę, której Jezus nie udzielił odpowiedzi.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ani jednym słowem
  rationale: Naturalny polski zwrot zachowuje emfatyczne zaprzeczenie οὐδὲ ἕν oraz podstawowe znaczenie ῥῆμα jako „słowo” lub „wypowiedź”.
- source_word: ὥστε
  choice: tak że
  rationale: 'Wprowadza zdanie skutkowe: całkowity brak odpowiedzi wywołał reakcję namiestnika.'
- source_word: τὸν ἡγεμόνα
  choice: namiestnik
  rationale: W rzymskim kontekście Judei ἡγεμών oznacza zarządcę prowincji; „namiestnik” jest utrwalonym, precyzyjnym i zrozumiałym odpowiednikiem.
- source_word: θαυμάζειν ... λίαν
  choice: bardzo się dziwił
  rationale: Oddaje reakcję wyrażoną przez θαυμάζω oraz silne określenie stopnia λίαν w naturalnej współczesnej polszczyźnie.
theological_decisions: []
translation_notes:
  register: Przekład ma współczesny, godny i prosty rejestr narracyjny. Szyk zachowuje nacisk na całkowity brak odpowiedzi, bez dopowiadania, czy chodziło o zarzuty, czy o pytania.
