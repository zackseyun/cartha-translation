  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: pl
  text: 'Wtedy Piłat mówi do niego: „Czy nie słyszysz, jak wiele zeznają przeciwko tobie?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego w narracji.
- source_word: λέγει
  choice: mówi
  rationale: Czas teraźniejszy zachowuje żywość greckiego praesens historicum.
- source_word: αὐτῷ
  choice: do niego
  rationale: Zachowuje grecki zaimek bez dopowiadania imienia Jezusa, którego odniesienie wynika z kontekstu.
- source_word: ὁ Πιλᾶτος
  choice: Piłat
  rationale: W języku polskim przed imieniem własnym nie używa się odpowiednika greckiego rodzajnika.
- source_word: Οὐκ ἀκούεις
  choice: Czy nie słyszysz
  rationale: Oddaje przeczące pytanie oraz podstawowy sens czasownika ἀκούω.
- source_word: πόσα
  choice: jak wiele
  rationale: Oddaje mnogość zarzutów lub spraw bez dodawania rzeczownika, którego tekst grecki nie zawiera.
- source_word: σου
  choice: przeciwko tobie
  rationale: W połączeniu z καταμαρτυρέω zaimek ma sens adwersatywny, który polszczyzna wyraża przyimkiem „przeciwko”.
- source_word: καταμαρτυροῦσιν
  choice: zeznają
  rationale: „Zeznają” naturalnie przekazuje prawno-sądowy sens składania świadectwa przeciw komuś, nie redukując wypowiedzi do samego oskarżania.
