  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: pl
  text: i dali je za pole garncarza, tak jak mi[b] nakazał[a] Pan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „polecił” lub „zarządził”.'
    reason: lexical_alternative
  - marker: b
    text: Mateusz zachowuje w tym cytacie lub nawiązaniu prorockim pierwszoosobowe „mi”, zamiast dostosować je do kontekstu opowiadania.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: dali
  rationale: Aoryst od δίδωμι ma tu podstawowe znaczenie „dali”. W kontekście chodzi o przeznaczenie srebrników na zakup pola; bardziej szczegółowe „zapłacili” byłoby interpretacją.
- source_word: αὐτὰ
  choice: je
  rationale: Zaimek w liczbie mnogiej odnosi się do wspomnianych wcześniej srebrników i zachowuje ich mnogie odniesienie.
- source_word: εἰς τὸν ἀγρὸν
  choice: za pole
  rationale: W kontekście transakcji εἰς z czasownikiem δίδωμι wskazuje na to, za co dano pieniądze. Polskie „za pole” naturalnie oddaje ten sens, bez niezręcznego dosłownego „do pola”.
- source_word: τοῦ κεραμέως
  choice: garncarza
  rationale: Dopełniacz określa pole jako należące do garncarza lub z nim związane; naturalnym polskim odpowiednikiem jest „pole garncarza”.
- source_word: καθὰ
  choice: tak jak
  rationale: Wyrażenie wprowadza zgodność z poleceniem Pana; „tak jak” zachowuje jego porównawczą siłę i brzmi naturalnie po polsku.
- source_word: συνέταξέν
  choice: nakazał
  rationale: συντάσσω może znaczyć „nakazać, polecić, zarządzić”. „Nakazał” jasno zachowuje autorytatywny charakter wypowiedzi.
- source_word: μοι
  choice: mi
  rationale: Celownik zaimka pierwszej osoby liczby pojedynczej oddano bezpośrednio jako „mi”, zachowując pierwszoosobowe brzmienie cytatu.
- source_word: κύριος
  choice: Pan
  rationale: κύριος w tym prorockim przytoczeniu odnosi się do Pana; tradycyjne i naturalne polskie oddanie to „Pan”.
theological_decisions:
- issue: Pierwszoosobowe odniesienie w cytacie lub aluzji prorockiej
  choice: Zachowano „mi”, zgodnie z greckim μοι.
  alternative: Wygładzenie wypowiedzi przez dostosowanie jej do narracyjnego kontekstu albo bardziej jawne zharmonizowanie z tekstem starotestamentowym.
  rationale: Tekst grecki wyraźnie zawiera μοι („mi”). Zachowanie tej formy nie rozstrzyga napięcia związanego ze sposobem, w jaki Mateusz przytacza lub łączy materiał prorocki.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Składnia „tak jak mi nakazał Pan” zachowuje biblijną powagę, a zarazem pozostaje naturalna we współczesnej polszczyźnie.
