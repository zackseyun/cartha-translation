  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: pl
  text: Związali go, odprowadzili i przekazali namiestnikowi Piłatowi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wydali namiestnikowi Piłatowi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: Związali
  rationale: Imiesłów aorystu wskazuje na czynność poprzedzającą główne czasowniki. W polskiej narracji naturalny szereg czasowników osobowych jasno zachowuje kolejność zdarzeń.
- source_word: ἀπήγαγον
  choice: odprowadzili
  rationale: Oddaje fizyczne poprowadzenie Jezusa z miejsca obrad pod władzę Piłata; jest bardziej konkretne niż ogólne „zabrali”.
- source_word: παρέδωκαν
  choice: przekazali
  rationale: Zachowuje sens wydania osoby pod cudzą władzę lub pieczę w kontekście sądowym, bez dopowiadania interpretacji teologicznej.
- source_word: Πιλάτῳ
  choice: Piłatowi
  rationale: Utrwalona polska forma imienia, zastosowana w celowniku zgodnie ze składnią.
- source_word: ἡγεμόνι
  choice: namiestnikowi
  rationale: Naturalny i utrwalony polski odpowiednik szerokiego określenia urzędnika sprawującego władzę; nie zawęża znaczenia do historycznie precyzyjniejszego tytułu „prefekt”.
theological_decisions:
- issue: Znaczenie παραδίδωμι w opisie męki
  choice: przekazali
  alternative: wydali
  rationale: „Przekazali” uwydatnia bezpośredni sens prawno-administracyjny. „Wydali” jest również możliwe i mocniej zachowuje tradycyjny rezonans tego czasownika w opisie męki, dlatego odnotowano je w przypisie.
translation_notes:
  register: Współczesny, godny styl narracyjny. Asyndetyczny w polszczyźnie szereg „Związali…, odprowadzili i przekazali…” naturalnie oddaje kolejność greckich czynności, bez ciężkiego kalkowania imiesłowu. Określenie urzędu umieszczono przed imieniem zgodnie z naturalnym szykiem polskim.
