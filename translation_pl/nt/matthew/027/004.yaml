  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: pl
  text: 'mówiąc: „Zgrzeszyłem, wydając niewinną krew[a]”. Oni zaś powiedzieli: „Co nam do tego? Ty sam się tym zajmij[b]”.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „wydawszy niewinną krew”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „ty zobaczysz”; forma przyszła użyta jako ostre odesłanie do własnej odpowiedzialności: „Ty sam się tym zajmij”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Zgrzeszyłem
  rationale: Polski czas przeszły naturalnie oddaje aoryst w bezpośrednim wyznaniu winy i zachowuje zwięzłość greckiego orzeczenia.
- source_word: παραδοὺς
  choice: wydając
  rationale: Imiesłów wyraża czyn stanowiący podstawę wyznanej winy. „Wydać” jest naturalnym i utrwalonym odpowiednikiem παραδίδωμι w kontekście przekazania Jezusa władzom, a zarazem nie narzuca ponad tekst dodatkowego określenia zdrady.
- source_word: αἷμα ἀθῷον
  choice: niewinną krew
  rationale: Dosłowne i zrozumiałe odtworzenie biblijnego idiomu, zachowujące jego prawno-moralny wydźwięk bez dopowiadania osoby, do której krew należy.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Co nam do tego?
  rationale: Naturalny polski idiom wiernie oddający lekceważące odrzucenie odpowiedzialności lub zainteresowania.
- source_word: σὺ ὄψῃ
  choice: Sam się tym zajmiesz
  rationale: 'Oddaje przyszłą formę czasownika, emfatyczne σὺ oraz idiomatyczny sens: „to twoja odpowiedzialność”. Przypis zachowuje możliwy imperatywny odcień tej opryskliwej odpowiedzi.'
theological_decisions:
- issue: Czy jawnie wskazać, że Judasz mówi o Jezusie
  choice: Pozostawić referenta domyślnego w wyrażeniu „niewinna krew”
  alternative: „krew niewinnego człowieka” albo jawne wymienienie Jezusa
  rationale: Greka nie nazywa tu osoby wprost. Zachowanie idiomu unika dopowiedzenia i podtrzymuje jego biblijny oraz sądowy wydźwięk.
- issue: Siła wypowiedzi σὺ ὄψῃ
  choice: „Sam się tym zajmiesz”
  alternative: „Sam się tym zajmij”
  rationale: Forma grecka jest gramatycznie przyszła, lecz w kontekście działa jak szorstkie odesłanie Judasza do własnej odpowiedzialności. Tekst główny zachowuje przyszłość, a przypis wskazuje sens rozkazujący.
translation_notes:
  register: Współczesna, godna polszczyzna o zwięzłej składni. Zachowano biblijny idiom „niewinna krew” oraz szorstki ton odpowiedzi przywódców; „mówiąc” pozostaje fragmentem zdania zgodnie z zakresem pojedynczego wersetu.
