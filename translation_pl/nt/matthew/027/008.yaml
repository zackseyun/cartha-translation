  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: pl
  text: Dlatego pole to aż po dziś dzień nazywa się Polem Krwi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Dlatego
  rationale: Wyraża wynikowy związek z poprzedzającym opisem zakupu i nazwania pola; jest jasne i naturalne we współczesnej polszczyźnie.
- source_word: ἐκλήθη
  choice: nazywa się
  rationale: Choć forma grecka jest aorystem strony biernej („zostało nazwane”), połączenie z ἕως τῆς σήμερον wskazuje na nazwę pozostającą w użyciu. Polskie „aż po dziś dzień nazywa się” naturalnie oddaje ten trwający skutek.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: pole to
  rationale: Zachowuje podstawowe znaczenie ἀγρός oraz wskazujący charakter ἐκεῖνος; szyk jest naturalny i godny w języku polskim.
- source_word: Ἀγρὸς Αἵματος
  choice: Polem Krwi
  rationale: Oddaje nazwę miejsca oraz relację dopełniaczową między „polem” a „krwią”; forma narzędnika wynika z polskiej składni czasownika „nazywać się”.
- source_word: ἕως τῆς σήμερον
  choice: aż po dziś dzień
  rationale: Idiomaticznie wskazuje, że nazwa pozostawała w użyciu do czasu autora, zachowując nacisk obecny w greckim wyrażeniu.
theological_decisions: []
translation_notes:
  register: Współczesny, naturalny i podniosły rejestr narracyjny. Powtórzenie słowa „pole” zachowuje więź między określeniem gruntu a jego nazwą własną.
