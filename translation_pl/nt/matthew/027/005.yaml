  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: pl
  text: Rzucił srebrniki do świątyni[a], odszedł, po czym poszedł się powiesić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „do sanktuarium”. Greckie naos często oznacza właściwy budynek świątyni, zwłaszcza jej sanktuarium, a nie cały kompleks świątynny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: Rzucił
  rationale: Grecki imiesłów aorystu wyraża czynność poprzedzającą odejście; w naturalnej polskiej narracji najlepiej oddaje ją osobowa forma czasownika w szeregu następujących po sobie wydarzeń.
- source_word: τὰ ἀργύρια
  choice: srebrniki
  rationale: Choć wyrażenie dosłownie oznacza „srebro”, kontekst wskazuje na konkretne sztuki srebrnej zapłaty. „Srebrniki” jest naturalnym i utrwalonym polskim odpowiednikiem bez dodawania nominału monet.
- source_word: εἰς τὸν ναόν
  choice: do świątyni
  rationale: Przyimek εἰς wskazuje ruch do wnętrza, a ναός może oznaczać ściślej sanktuarium świątynne. Tekst główny zachowuje naturalne „do świątyni”, zaś dokładniejszy odcień podaje przypis.
- source_word: ἀνεχώρησεν
  choice: odszedł
  rationale: Czasownik oznacza odejście lub wycofanie się. „Odszedł” jest zwięzłe, naturalne i zachowuje poważny ton narracji.
- source_word: ἀπελθών
  choice: a potem poszedł
  rationale: Imiesłów oznacza udanie się stamtąd i jest odrębny od ἀνεχώρησεν. „A potem poszedł” zachowuje następstwo oraz drugi czasownik ruchu, choć polszczyzna odczuwa tu pewną zamierzoną redundancję.
- source_word: ἀπήγξατο
  choice: się powiesił
  rationale: Forma medialna wskazuje na działanie skierowane na samego sprawcę; w tym kontekście standardowym znaczeniem jest samobójstwo przez powieszenie.
theological_decisions:
- issue: Zakres znaczeniowy ναός wobec określenia całego zespołu świątynnego
  choice: „świątynia” w tekście głównym, z doprecyzowaniem w przypisie
  alternative: „sanktuarium” lub „przybytek świątynny”
  rationale: ναός często odnosi się do właściwego budynku świątyni lub sanktuarium, nie do całego kompleksu. Naturalność tekstu głównego zostaje połączona z precyzją leksykalną w przypisie.
- issue: Relacja ἀνεχώρησεν i ἀπελθών
  choice: 'zachowano dwa kolejne określenia ruchu: „odszedł, a potem poszedł”'
  alternative: „odszedł i się powiesił”
  rationale: Greka używa dwóch odrębnych form oznaczających odejście. Ich całkowite zlanie wygładziłoby tekst kosztem elementu obecnego w źródle; dodane „potem” jasno wyraża następstwo, nie narzucając dalszej interpretacji.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna narracyjna. Zdanie zachowuje zwięzłość oryginału oraz oba greckie określenia odejścia, mimo ich lekkiej redundancji w języku polskim.
