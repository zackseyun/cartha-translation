id: MAT.27.6
reference: Matthew 27:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: pl
  text: 'Arcykapłani zaś wzięli srebrniki i powiedzieli: „Nie wolno wrzucić ich do skarbca świątynnego[a], ponieważ są zapłatą za krew[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie κορβανᾶν (korban): skarbiec świątynny lub święte fundusze.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „krwawe pieniądze” lub „cena krwi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: arcykapłani
  rationale: Standardowy polski odpowiednik liczby mnogiej, odnoszący się do najwyższych rangą przedstawicieli władz kapłańskich.
- source_word: λαβόντες
  choice: wzięli
  rationale: Naturalna polska konstrukcja współrzędna oddaje uprzednią lub towarzyszącą czynność imiesłowu aorystu bez sztucznej składni.
- source_word: τὰ ἀργύρια
  choice: srebrniki
  rationale: Kontekst wskazuje na wcześniej wspomnianą zapłatę w srebrze; „srebrniki” jest zrozumiałe i nie określa konkretnego typu monety.
- source_word: Οὐκ ἔξεστιν
  choice: Nie wolno
  rationale: Zwięźle i naturalnie wyraża zakaz wynikający z norm prawnych lub religijnych.
- source_word: βαλεῖν
  choice: wrzucić
  rationale: W odniesieniu do skarbca czasownik ten naturalnie oddaje βαλεῖν, zachowując jego konkretny charakter.
- source_word: κορβανᾶν
  choice: skarbca świątynnego
  rationale: Termin oznacza święty skarbiec lub fundusze świątynne; przekład znaczeniowy jest czytelniejszy niż sama transliteracja.
- source_word: ἐπεὶ
  choice: ponieważ
  rationale: Jasno wprowadza podaną przez kapłanów przyczynę zakazu.
- source_word: τιμὴ αἵματός
  choice: zapłatą za krew
  rationale: Blisko zachowuje obraz i składnię greckiego wyrażenia, nie rozstrzygając szerzej, czy chodzi o cenę przelanej krwi, czy pieniądze związane ze spowodowaniem śmierci.
theological_decisions:
- issue: Sposób oddania κορβανᾶν
  choice: skarbiec świątynny
  alternative: korban; skarbiec
  rationale: Przekład znaczeniowy jasno wskazuje na święte fundusze świątyni, a przypis zachowuje semicko-grecką nazwę terminu.
- issue: Sposób oddania τιμὴ αἵματός
  choice: zapłata za krew
  alternative: krwawe pieniądze; cena krwi
  rationale: Wyrażenie zachowuje zamierzoną dwuznaczność i moralne napięcie tekstu, bez dopowiadania, że chodzi wyłącznie o cenę przelania krwi.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zdanie zachowuje zwięzłość oryginału oraz kontrast między skrupulatnością prawną arcykapłanów a pochodzeniem pieniędzy.
