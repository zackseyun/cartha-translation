source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: pl
  text: 'Jezus zaś stanął przed namiestnikiem. Namiestnik zapytał go: „Czy ty jesteś królem Żydów[a]?” Jezus odrzekł: „Ty to mówisz”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Judejczyków”. Greckie określenie może odnosić się szerzej do Żydów albo — zależnie od kontekstu — ściślej do mieszkańców Judei.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „Ty mówisz” albo „Jest tak, jak mówisz”. Grecka odpowiedź jest krótka, eliptyczna i zachowuje pewną powściągliwość.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: stanął
  rationale: Aorystyczna forma ἵστημι ma tu naturalny sens nieprzechodni. „Stanął” nie dodaje sprawcy, którego tekst nie wskazuje, i nie narzuca trwania właściwego polskiemu „stał”.
- source_word: ἔμπροσθεν
  choice: przed
  rationale: Zwięzły i naturalny odpowiednik, zachowujący zarówno relację przestrzenną, jak i formalny kontekst sądowy.
- source_word: ἡγεμών / ἡγεμόνος
  choice: namiestnik
  rationale: W tym kontekście oznacza rzymskiego zwierzchnika prowincji. „Namiestnik” jest utrwalonym, zrozumiałym polskim określeniem; „prefekt” byłby bardziej techniczny, a „władca” zbyt ogólny.
- source_word: ἐπηρώτησεν
  choice: zapytał
  rationale: Oddaje zadanie pytania w formalnej sytuacji bez nadawania czasownikowi nadmiernie przemocowego odcienia, jaki mogłoby mieć „przesłuchiwał”.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: król Żydów
  rationale: Naturalne polskie określenie zarzucanego Jezusowi statusu królewskiego. Rzeczownik pospolity „król” zapisano małą literą zgodnie ze współczesną polską ortografią.
- source_word: ἔφη
  choice: odrzekł
  rationale: Wprowadza bezpośrednią odpowiedź Jezusa. „Odrzekł” jest zwięzłe, godne i w tym kontekście naturalniejsze niż ponowne „powiedział”.
- source_word: Σὺ λέγεις
  choice: Ty to mówisz
  rationale: Jawne „ty” zachowuje nacisk obecny w greckim zaimku, a domyślne dopełnienie oddaje eliptyczność wypowiedzi. Sformułowanie pozostaje powściągliwe i nie zmienia odpowiedzi w całkowicie jednoznaczne potwierdzenie.
theological_decisions:
- issue: Niejednoznaczność odpowiedzi Jezusa Σὺ λέγεις
  choice: „Ty to mówisz” — powściągliwa odpowiedź, która nie jest ani prostym zaprzeczeniem, ani rozwiniętym, bezwarunkowym potwierdzeniem politycznego sformułowania namiestnika.
  alternative: „Tak, jest, jak mówisz” — bezpośrednie potwierdzenie.
  rationale: Grecka odpowiedź jest krótka i eliptyczna. Przekład zachowuje napięcie między potwierdzeniem a dystansem wobec sposobu ujęcia zarzutu, zamiast rozstrzygać je interpretacyjnie.
- issue: Zakres określenia τῶν Ἰουδαίων
  choice: „Żydów” w głównym tekście.
  alternative: „Judejczyków”.
  rationale: W rzymskim pytaniu o tytuł królewski najbardziej naturalne jest odniesienie do Żydów jako ludu. Ponieważ grecki termin może w pewnych kontekstach mieć węższy sens geograficzny, alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rejestrze, odpowiednim dla sceny sądowej. Pominięto dosłowne odtworzenie imiesłowu λέγων, ponieważ polskie wprowadzenie pytania po dwukropku przekazuje jego funkcję naturalniej. Spójniki δέ oddano raz przez „zaś”; przy kolejnych zdaniach relację dyskursywną wystarczająco wyznacza następstwo wypowiedzi.
