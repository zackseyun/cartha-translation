  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: pl
  text: Po naradzie kupili za te pieniądze Pole Garncarza jako miejsce pochówku dla cudzoziemców.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „obcych” lub „przybyszów”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: Po naradzie
  rationale: Zwięźle i naturalnie oddaje idiom „powziąwszy naradę” oraz uprzedniość imiesłowu względem zakupu.
- source_word: δὲ
  choice: Po naradzie (bez osobnego spójnika)
  rationale: δέ służy tu głównie kontynuacji narracji; polski szyk i początkowe określenie czasowe zapewniają płynne przejście bez sztucznego „więc”.
- source_word: ἠγόρασαν
  choice: kupili
  rationale: Bezpośredni, współczesny odpowiednik czasownika ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: za te pieniądze
  rationale: Greckie „z nich” odnosi się kontekstowo do srebrników; w polszczyźnie taki sposób wyrażenia środka zapłaty jest jasny i idiomatyczny.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Pole Garncarza
  rationale: Naturalny odpowiednik konstrukcji dopełniaczowej, potraktowany jako utrwalona nazwa miejsca.
- source_word: εἰς ταφὴν
  choice: przeznaczając je na miejsce pochówku
  rationale: Wyraża cel zakupu i jednoznacznie wiąże przeznaczenie z polem.
- source_word: τοῖς ξένοις
  choice: cudzoziemców
  rationale: W tym kontekście ξένοι oznacza osoby obce, przybyłe spoza miejscowej społeczności; „cudzoziemcy” jest precyzyjne i współczesne.
theological_decisions:
- issue: Desygnat αὐτῶν
  choice: Zaimek odnosi się do srebrników wspomnianych w poprzednim kontekście, oddanych jako „te pieniądze”.
  alternative: 'Dosłowniej: „za nie” lub „z nich”.'
  rationale: Rodzaj nijaki liczby mnogiej odpowiada srebrnikom, a idiomatyczna polszczyzna wymaga jasnego wskazania, że chodzi o środek zapłaty.
- issue: Zakres znaczeniowy ξένοι
  choice: cudzoziemcy
  alternative: obcy / przybysze
  rationale: Tekst nie precyzuje dokładnego statusu tych osób. W tekście głównym wybrano najbardziej naturalne znaczenie kontekstowe, a autentyczną możliwość szerszego odczytania zachowano w przypisie.
translation_notes:
  register: Współczesna, godna i płynna polszczyzna. Uniknięto archaicznego „powziąwszy naradę”; zachowano zwięzłość narracji oraz przypisem zaznaczono zakres znaczeniowy ξένοι.
