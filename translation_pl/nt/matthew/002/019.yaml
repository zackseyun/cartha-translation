  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: pl
  text: Gdy zaś Herod umarł, oto anioł Pana[a] ukazuje się we śnie Józefowi, przebywającemu w Egipcie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki tekst nie ma tu rodzajnika przed słowem „anioł”. Sam brak rodzajnika nie rozstrzyga, czy w danym kontekście chodzi o anioła nieokreślonego, czy znanego z kontekstu; polszczyzna nie wyraża tego rozróżnienia rodzajnikiem.
    reason: Zachowanie niejednoznaczności określoności greckiego wyrażenia ἄγγελος κυρίου, której polszczyzna nie oznacza rodzajnikiem.
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: Gdy zaś Herod umarł
  rationale: Genitivus absolutus z imiesłowem aorystu wyraża okoliczność czasową poprzedzającą główne wydarzenie. „Gdy zaś Herod umarł” jest naturalne po polsku, zachowuje przejście narracyjne sygnalizowane przez δέ i nie obciąża zdania konstrukcją imiesłowową.
- source_word: ἰδοὺ
  choice: oto
  rationale: „Oto” zachowuje funkcję wyrazistego, uroczystego sygnału narracyjnego, a zarazem brzmi naturalnie we współczesnej polszczyźnie biblijnej.
- source_word: ἄγγελος κυρίου
  choice: anioł Pana
  rationale: Polszczyzna nie ma rodzajników, dlatego naturalne „anioł Pana” nie rozstrzyga samo przez się określoności rzeczownika ἄγγελος. Dopełniacz „Pana” wiernie oddaje κυρίου jako tytuł odnoszący się w tym kontekście do Boga.
- source_word: φαίνεται
  choice: ukazuje się
  rationale: Czas teraźniejszy zachowuje grecki praesens historicum i ożywia narrację. Forma medialna „ukazuje się” trafnie oddaje pojawienie się anioła.
- source_word: κατ’ ὄναρ
  choice: we śnie
  rationale: To naturalny polski odpowiednik Mateuszowego idiomu oznaczającego objawienie otrzymane podczas snu.
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: Józefowi ... w Egipcie
  rationale: Celownik wskazuje osobę, której anioł się ukazuje, a wyrażenie przyimkowe określa miejsce pobytu Józefa.
theological_decisions:
- issue: Oddanie κυρίου w wyrażeniu ἄγγελος κυρίου
  choice: Pana
  alternative: Władcy
  rationale: „Pan” jest utrwalonym i kontekstowo właściwym odpowiednikiem κύριος jako tytułu Boga; „Władca” niepotrzebnie osłabiałby związek z biblijnym sposobem mówienia o Bogu.
- issue: Określoność wyrażenia ἄγγελος κυρίου
  choice: anioł Pana
  alternative: ów anioł Pana
  rationale: Przed ἄγγελος w tekście greckim nie ma rodzajnika, lecz sama ta nieobecność nie wymusza w każdym kontekście nieokreśloności. Polski tekst główny zachowuje naturalną nierozstrzygniętość, a przypis objaśnia kwestię bez narzucania identyfikacji teologicznej.
translation_notes:
  register: Język współczesny, godny i narracyjnie żywy. Zachowano „oto” oraz historyczny czas teraźniejszy „ukazuje się”. Marker przypisu umieszczono przy wyrażeniu „anioł Pana”, którego dotyczy uwaga tekstowa.
