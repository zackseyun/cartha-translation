id: MAT.2.6
reference: Matthew 2:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: pl
  text: A ty, Betlejem, ziemio Judy, w żadnym razie nie jesteś najmniejsza wśród władców Judy, bo z ciebie wyjdzie władca, który będzie pasł[a] mój lud, Izrael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Będzie pasł” może tu również nieść sens „będzie rządził”; obraz pasterza łączy sprawowanie władzy z troską o lud.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: ziemio
  rationale: Rzeczownik określa obszar związany z Judą i stoi w apozycji do nazwy Betlejem; wołacz „ziemio Judy” zachowuje bezpośredni zwrot.
- source_word: οὐδαμῶς
  choice: w żadnym razie
  rationale: Wyrażenie oddaje mocne, emfatyczne zaprzeczenie, a nie jedynie zwykłe „nie”.
- source_word: ἐλαχίστη
  choice: najmniejsze
  rationale: W kontekście chodzi o najniższą rangę lub znaczenie. Forma nijaka odnosi się do polskiej nazwy „Betlejem”.
- source_word: ἡγεμόσιν
  choice: władców
  rationale: Termin oznacza osoby sprawujące władzę lub przewodzące; „władcy” zachowują sens rządzenia bez zawężania go do konkretnego urzędu.
- source_word: ἐξελεύσεται
  choice: wyjdzie
  rationale: Dosłownie oznacza wyjście; w tym zdaniu naturalnie wskazuje, że przyszły władca będzie pochodził z Betlejem.
- source_word: ἡγούμενος
  choice: władca
  rationale: Urzeczownikowiony imiesłów określa osobę przewodzącą i sprawującą władzę.
- source_word: ποιμανεῖ
  choice: będzie pasł
  rationale: Dosłowne obrazowanie pasterskie pozostaje czytelne po polsku, a zarazem może sugerować sprawowanie władzy i troskę o lud.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: mój lud, Izraela
  rationale: 'Przecinek ukazuje apozycyjny charakter nazwy „Izrael”: to ona objaśnia, kim jest „mój lud”.'
theological_decisions:
- issue: Królewski i pasterski wymiar roli zapowiedzianej postaci
  choice: „władca, który będzie pasł”
  alternative: „przywódca, który będzie rządził”
  rationale: Połączenie języka władzy z metaforą pasterza zachowuje oba aspekty greckiego tekstu i nie redukuje wypowiedzi wyłącznie do rządzenia albo wyłącznie do opieki.
translation_notes:
  register: Współczesny, godny styl cytatu biblijnego. Zachowano emfatyczne zaprzeczenie, bezpośredni zwrot do Betlejem oraz zestawienie terminologii władzy z obrazem pasterskim. Nietypowe porównanie Betlejem „wśród władców Judy” pozostawiono zgodnie z greckim tekstem, bez harmonizowania go z hebrajskim brzmieniem Micheasza 5:1.
