source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: pl
  text: Gdy jednak usłyszał, że Archelaos panuje w Judei w miejsce swego ojca, Heroda, bał się tam udać. Ostrzeżony[a] we śnie, wycofał się w strony Galilei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pouczony”; użyty czasownik często oznacza otrzymanie Bożego ostrzeżenia lub wskazówki, choć tutaj sprawca nie został nazwany.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Gdy jednak usłyszał
  rationale: Imiesłów aorystu określa okoliczność poprzedzającą główną czynność, a δέ sygnalizuje zwrot względem wcześniejszego zamiaru. Takie zdanie czasowe jest naturalne we współczesnej polszczyźnie.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: panuje w Judei
  rationale: Czasownik zachowuje sens sprawowania władzy królewskiej; polskie „panować w” brzmi naturalniej niż dosłowne „królować nad” w tym kontekście.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: w miejsce swego ojca, Heroda
  rationale: ἀντί wyraża tu zastąpienie lub następstwo. Dopowiedzenie „Heroda” pozostaje apozycją do „ojca”.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: bał się tam udać
  rationale: Oddaje wprost obawę przed udaniem się do wskazanego wcześniej miejsca, bez nadawania czasownikowi mocniejszego odcienia.
- source_word: χρηματισθεὶς
  choice: ostrzeżony
  rationale: W Mateuszowym kontekście czasownik często oznacza otrzymanie nadprzyrodzonego ostrzeżenia lub pouczenia. Zachowano stronę bierną i nie dopowiedziano w tekście głównym, kto ostrzegł.
- source_word: κατ’ ὄναρ
  choice: we śnie
  rationale: To naturalny polski odpowiednik stałego Mateuszowego określenia objawienia otrzymanego podczas snu.
- source_word: ἀνεχώρησεν
  choice: wycofał się
  rationale: Czasownik wskazuje na celowe oddalenie się w reakcji na zagrożenie lub okoliczności, a nie jedynie neutralne odejście.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: w okolice Galilei
  rationale: Liczba mnoga μέρη oznacza obszar lub strony należące do Galilei; „okolice Galilei” jest zrozumiałe i zachowuje przestrzenną ogólność wyrażenia.
theological_decisions:
- issue: Czy wskazać Boga jako sprawcę ostrzeżenia wyrażonego przez χρηματισθείς
  choice: Pozostawiono „ostrzeżony” bez dodania „przez Boga”.
  alternative: „ostrzeżony przez Boga” albo „otrzymawszy Boże pouczenie”
  rationale: Kontekst i użycie czasownika sugerują komunikat pochodzenia Bożego, lecz grecki tekst nie nazywa sprawcy. Strona bierna zachowuje tę zamierzoną niedookreśloność.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano wyraźny zwrot w toku opowiadania przez „jednak” i „zaś”, bez archaizmów oraz bez dopowiadania niewymienionego wprost sprawcy ostrzeżenia.
