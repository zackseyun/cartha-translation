  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: pl
  text: 'Przybył i zamieszkał w mieście zwanym Nazaretem, aby wypełniło się to, co zostało powiedziane przez proroków: „Będzie nazwany Nazarejczykiem”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nazorejczykiem”. Dokładne prorockie tło słów „Będzie nazwany Nazarejczykiem” jest przedmiotem dyskusji; Mateusz może podsumowywać motywy obecne u kilku proroków, a nie cytować jeden konkretny tekst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: przybył
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą lub towarzyszącą głównej; współrzędne „przybył… i zamieszkał” naturalnie oddaje kolejność wydarzeń.
- source_word: κατῴκησεν
  choice: zamieszkał
  rationale: Czasownik κατοικέω oznacza zamieszkanie lub obranie miejsca pobytu; „zamieszkał” jest naturalne i dokładniejsze w tym kontekście niż samo „mieszkał”.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: w mieście zwanym Nazaretem
  rationale: Przy czasowniku oznaczającym zamieszkanie polszczyzna wymaga konstrukcji „w mieście”; πόλις oddano jako „miasto”, bez narzucania współczesnych kategorii administracyjnych.
- source_word: ὅπως πληρωθῇ
  choice: aby wypełniło się
  rationale: Konstrukcja celu lub skutku zachowuje charakterystyczną dla Mateusza formułę wypełnienia, a zwrot „wypełniło się” jest idiomatyczny po polsku.
- source_word: τὸ ῥηθὲν
  choice: to, co zostało powiedziane
  rationale: Oddaje urzeczownikowiony imiesłów bierny bez dopowiadania treści ani wskazywania konkretnego cytatu.
- source_word: διὰ τῶν προφητῶν
  choice: przez proroków
  rationale: διά z dopełniaczem wskazuje pośrednictwo lub sprawstwo; polskie „przez proroków” zachowuje tę relację i liczbę mnogą.
- source_word: Ναζωραῖος
  choice: Nazarejczyk
  rationale: W kontekście bezpośrednio poprzedzającej wzmianki o Nazarecie jest to naturalne polskie określenie osoby związanej z tym miastem. Formalny wariant „Nazorejczyk” oraz niepewne tło prorockie odnotowano w przypisie.
- source_word: κληθήσεται
  choice: będzie nazwany
  rationale: Oddaje przyszłą stronę bierną czasownika καλέω i uroczysty charakter formuły prorockiej.
theological_decisions:
- issue: Charakter formuły wypełnienia bez jednego dokładnego odpowiednika w Starym Testamencie
  choice: Pozostawiono liczbę mnogą „przez proroków” i nie wskazano w tekście głównym jednego źródła.
  alternative: Powiązanie wypowiedzi wyłącznie z Iz 11:1 albo wyjaśnienie jej jako podsumowania motywu odrzucenia Mesjasza.
  rationale: Grecki tekst mówi o „prorokach” w liczbie mnogiej i nie podaje konkretnej księgi. Przekład powinien zachować tę otwartość zamiast rozstrzygać dyskusyjną identyfikację.
- issue: Znaczenie Ναζωραῖος
  choice: Nazarejczyk
  alternative: Nazorejczyk; nazirejczyk
  rationale: Kontekst wiąże określenie z Nazaretem. „Nazirejczyk” sugerowałby odmienny termin i instytucję ślubu nazireatu, czego grecki tekst tutaj nie stwierdza; wariant formalny „Nazorejczyk” zachowano w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna bez archaizmów. Składnia jest płynna, a formuła wypełnienia zachowuje uroczysty charakter. Spójnik καί oddano jako „więc”, ponieważ w kontekście pełni funkcję narracyjnego następstwa.
