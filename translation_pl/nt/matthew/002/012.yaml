  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: pl
  text: A gdy zostali ostrzeżeni[a] we śnie, żeby nie wracać do Heroda, inną drogą[b] udali się do swojego kraju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „otrzymawszy ostrzeżenie od Boga”. Grecka forma bierna wskazuje w tym kontekście na ostrzeżenie pochodzące od Boga, choć w tym wersecie Bóg nie został wymieniony wprost.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „inną trasą”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: zostali ostrzeżeni
  rationale: Grecki imiesłów w stronie biernej oznacza otrzymanie ostrzeżenia lub pouczenia, w tym kontekście pochodzącego od Boga. Polski przekład zachowuje stronę bierną i nie dodaje w tekście głównym niewymienionego wprost sprawcy.
- source_word: κατ’ ὄναρ
  choice: we śnie
  rationale: To naturalny polski odpowiednik Mateuszowego wyrażenia oznaczającego otrzymanie objawienia podczas snu.
- source_word: μὴ ἀνακάμψαι
  choice: żeby nie wracać
  rationale: Konstrukcja z μή podaje treść ostrzeżenia; bezokolicznik „wracać” naturalnie oddaje powrót do wcześniej odwiedzonej osoby.
- source_word: πρὸς Ἡρῴδην
  choice: do Heroda
  rationale: Przyimek πρός z biernikiem wskazuje tu kierunek ku osobie; „do Heroda” jest idiomatyczne po polsku.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: inną drogą
  rationale: ὁδός w opisie podróży oznacza konkretną drogę lub trasę. „Inną drogą” jest zwięzłe, naturalne i bliskie formie greckiej.
- source_word: ἀνεχώρησαν
  choice: udali się
  rationale: W kontekście podróży czasownik oznacza odejście lub wycofanie się. „Udali się” naturalnie łączy czynność z podanym celem podróży.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: do swojego kraju
  rationale: χώρα może oznaczać kraj, ziemię lub region; kontekst powrotu mędrców uzasadnia naturalne polskie wyrażenie „do swojego kraju”.
theological_decisions:
- issue: Domyślny boski sprawca ostrzeżenia
  choice: Zachowano formę bierną „zostali ostrzeżeni”, nie dodając w tekście głównym słów „przez Boga”.
  alternative: „zostali ostrzeżeni przez Boga” lub „otrzymali Boże ostrzeżenie”
  rationale: Kontekst i użycie χρηματίζω wskazują na ostrzeżenie pochodzące od Boga, lecz sam werset nie nazywa sprawcy wprost. Przekład zachowuje tę implikację bez jej dopowiadania.
translation_notes:
  register: Współczesny, godny i łatwo zrozumiały rejestr. Zdanie zachowuje kolejność wydarzeń i bierną formę greckiego ostrzeżenia, a zarazem brzmi naturalnie po polsku.
