  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: pl
  text: Po narodzeniu Jezusa w Betlejem w Judei, za dni króla Heroda, oto mędrcy[a] ze Wschodu przybyli do Jerozolimy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „magowie”. Grecki termin oznacza uczonych ludzi ze Wschodu, prawdopodobnie związanych z astrologią lub wiedzą dworską.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Gdy Jezus urodził się
  rationale: Konstrukcja dopełniaczowa absolutna stanowi tło czasowe dla głównego wydarzenia. „Gdy Jezus urodził się” brzmi naturalnie po polsku i nie rozstrzyga ponad miarę, czy należy uwydatnić następstwo czasowe jako „po narodzeniu”.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betlejem w Judei
  rationale: Naturalna polska forma nazwy własnej oraz idiomatyczne oddanie dopełniacza, odróżniające tę miejscowość od innych noszących nazwę Betlejem.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: za dni króla Heroda
  rationale: Zachowuje historyczne umiejscowienie wydarzenia i podniosły, biblijny ton, pozostając zrozumiałe we współczesnej polszczyźnie.
- source_word: ἰδοὺ
  choice: oto
  rationale: Oddaje wyrazisty znacznik dyskursu, który zwraca uwagę czytelnika na pojawienie się przybyszów.
- source_word: μάγοι
  choice: mędrcy
  rationale: Przystępne określenie uczonych ludzi ze Wschodu; nie przypisuje im królewskiego statusu ani liczby. Dokładniejsze leksykalnie „magowie” podano w przypisie.
- source_word: ἀπὸ ἀνατολῶν
  choice: ze Wschodu
  rationale: Naturalne polskie oddanie liczby mnogiej odnoszącej się do wschodnich krain lub regionów.
- source_word: παρεγένοντο
  choice: przybyli
  rationale: Czasownik wskazuje na przybycie i pojawienie się na miejscu.
- source_word: εἰς Ἱεροσόλυμα
  choice: do Jerozolimy
  rationale: Przy czasowniku ruchu polski kierunek „do Jerozolimy” wiernie i idiomatycznie oddaje εἰς.
theological_decisions:
- issue: Oddanie μάγοι bez wprowadzania późniejszej tradycji
  choice: mędrcy
  alternative: magowie
  rationale: Grecki termin oznacza uczonych ludzi ze Wschodu, zapewne związanych z astrologią lub wiedzą dworską. „Mędrcy” nie dodaje późniejszych wyobrażeń o ich liczbie ani królewskim statusie, a techniczny odpowiednik zachowano w przypisie.
translation_notes:
  register: Współczesny, godny styl narracyjny. „Za dni” i „oto” zachowują biblijną podniosłość bez archaizacji. Przecinek na końcu uwzględnia ciąg dalszy zdania w następnym wersecie.
