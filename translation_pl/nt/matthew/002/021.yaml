  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: pl
  text: Wstał więc, wziął dziecko i jego matkę, i wszedł do ziemi Izraela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: więc
  rationale: Spójnik wyznacza tutaj dalszy ciąg narracji, nie wyraźne przeciwstawienie. „Więc” naturalnie łączy działanie Józefa z poprzedzającym je nakazem.
- source_word: ἐγερθεὶς
  choice: wstał
  rationale: Imiesłów aorystu ma w tym kontekście znaczenie nieprzechodnie i wskazuje czynność poprzedzającą kolejne działania. Polski ciąg czasowników osobowych brzmi naturalnie i zachowuje następstwo wydarzeń.
- source_word: παρέλαβε
  choice: wziął
  rationale: Czasownik oznacza tu zabranie kogoś ze sobą. „Wziął” jest zwięzłe, naturalne i odpowiada powtarzalnej formule narracyjnej w opowiadaniu Mateusza.
- source_word: τὸ παιδίον
  choice: dziecko
  rationale: Rzeczownik określa dziecko bez potrzeby dodawania w przekładzie bliższej informacji o wieku.
- source_word: τὴν μητέρα αὐτοῦ
  choice: jego matkę
  rationale: Zaimek αὐτοῦ odnosi się najnaturalniej do dziecka. Sformułowanie wiernie zachowuje tę relację i nie zastępuje jej imieniem niewystępującym w wersecie.
- source_word: εἰσῆλθεν
  choice: wszedł
  rationale: Czasownik oznacza wejście do danego obszaru. „Wszedł” zachowuje sens przekroczenia granicy, choć w tym połączeniu ma nieco podniosły charakter.
- source_word: εἰς γῆν Ἰσραήλ
  choice: do ziemi Izraela
  rationale: Wyrażenie ma sens geograficzno-narodowy. Tradycyjne, ale nadal zrozumiałe określenie „ziemia Izraela” zachowuje formę i zakres greckiego zwrotu.
theological_decisions: []
translation_notes:
  register: Współczesna, zwięzła polszczyzna narracyjna o godnym tonie. Zachowano prostą sekwencję czynności oraz geograficzne określenie „ziemia Izraela”; uniknięto dopowiadania imienia matki i precyzowania wieku dziecka.
