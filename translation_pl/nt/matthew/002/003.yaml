  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: pl
  text: Gdy król Herod to usłyszał, zaniepokoił się[a], a wraz z nim cała Jerozolima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „zatrwożył się” albo „wzburzył się”.'
    reason: lexical_alternative
  - marker: b
    text: Nazwa miasta oznacza tu jego mieszkańców; „cała Jerozolima” może być ogólnym lub hiperbolicznym opisem powszechnego niepokoju w mieście.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: gdy… usłyszał
  rationale: Imiesłów aorystu pełni funkcję czasową. Polski podrzędny zwrot „gdy… usłyszał” brzmi naturalnie i wiernie oddaje następstwo wydarzeń; zaimek „to” wskazuje na wiadomość przyniesioną przez mędrców, domyślną z kontekstu.
- source_word: δὲ
  choice: oddane przez konstrukcję zdania, bez osobnego spójnika
  rationale: δέ jest łagodnym łącznikiem narracyjnym. W połączeniu z imiesłowem jego funkcję wystarczająco wyraża polska konstrukcja czasowa „gdy”.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: król Herod
  rationale: Naturalny współczesny polski szyk zachowujący tytuł βασιλεύς i imię własne.
- source_word: ἐταράχθη
  choice: zaniepokoił się
  rationale: Forma bierna czasownika ταράσσω opisuje wewnętrzne poruszenie, niepokój lub wzburzenie. Polska konstrukcja zwrotna jest idiomatyczna i nie rozstrzyga nadmiernie natężenia emocji.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: cała Jerozolima
  rationale: Zachowano grecką metonimię, w której nazwa miasta oznacza jego mieszkańców, bez zawężania wypowiedzi do przywódców ani dopisywania słowa „mieszkańcy” w tekście głównym.
- source_word: μετ’ αὐτοῦ
  choice: wraz z nim
  rationale: Naturalnie oddaje μετά z dopełniaczem oraz podkreśla, że niepokój Jerozolimy współwystępował z niepokojem Heroda.
theological_decisions:
- issue: Zakres wyrażenia πᾶσα Ἱεροσόλυμα
  choice: Korporacyjne, metonimiczne określenie miasta i jego ludności
  alternative: Hiperboliczne określenie wielu mieszkańców albo szczególne odniesienie do jerozolimskich kręgów przywódczych
  rationale: Greka wymienia całe miasto. Zachowanie tej formy pozostawia otwarty rzeczywisty zakres uogólnienia i nie wprowadza do tekstu węższego twierdzenia socjologicznego.
translation_notes:
  register: Współczesny, dignifikowany i przystępny polski. Szyk jest naturalny, a grecka metonimia i niejednoznaczna siła emocjonalna czasownika zostały zachowane w tekście oraz objaśnione w przypisach.
