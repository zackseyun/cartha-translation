source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: pl
  text: 'Posławszy ich do Betlejem, powiedział: „Idźcie, dokładnie wypytajcie o dziecko, a kiedy je znajdziecie, powiadomcie mnie, żebym i ja mógł przyjść i oddać mu pokłon[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „złożyć mu hołd” albo „upaść przed nim”. Grecki czasownik może oznaczać zarówno oddanie czci, jak i hołd składany władcy.'
    reason: Alternatywa leksykalna zachowująca zakres znaczeniowy προσκυνέω.
lexical_decisions:
- source_word: πέμψας
  choice: Następnie posłał
  rationale: Imiesłów aorystu wskazuje na czynność poprzedzającą wypowiedź Heroda. „Następnie posłał” naturalnie oddaje kolejność wydarzeń bez niezręcznej konstrukcji imiesłowowej.
- source_word: Πορευθέντες
  choice: Idźcie
  rationale: Imiesłów pełni tu funkcję zbliżoną do rozkaźnika w połączeniu z ἐξετάσατε; polski rozkaźnik brzmi naturalnie i zachowuje siłę polecenia.
- source_word: ἐξετάσατε ἀκριβῶς περὶ τοῦ παιδίου
  choice: dokładnie wypytajcie o dziecko
  rationale: Połączenie czasownika z przysłówkiem oznacza staranne, dokładne zbadanie sprawy lub zebranie wiadomości. „Wypytajcie” zachowuje aspekt dociekania, a περί naturalnie oddano jako „o”.
- source_word: παιδίου
  choice: dziecko
  rationale: παιδίον oznacza dziecko; współczesne „dziecko” jest precyzyjne i nie narzuca wieku bardziej szczegółowo, niż pozwala tekst.
- source_word: ἐπὰν δὲ εὕρητε
  choice: a kiedy je znajdziecie
  rationale: Konstrukcja wyraża przyszłą okoliczność zależną. W poleceniu Heroda naturalne polskie „kiedy” oddaje oczekiwane znalezienie dziecka, nie czyniąc z niego bezwarunkowego faktu.
- source_word: ἀπαγγείλατέ μοι
  choice: powiadomcie mnie
  rationale: Czasownik oznacza przekazanie wiadomości lub zdanie relacji. „Powiadomcie mnie” jest naturalne i zachowuje sens oczekiwanego raportu.
- source_word: ὅπως κἀγὼ
  choice: żebym i ja
  rationale: ὅπως wprowadza deklarowany cel, a κἀγώ podkreśla rzekomo wspólny zamiar Heroda. „Żebym i ja” zwięźle zachowuje oba elementy.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: mógł przyjść i oddać mu pokłon
  rationale: Imiesłów i tryb łączący naturalnie oddano jako skoordynowane czynności. „Oddać pokłon” zachowuje możliwy sens czci religijnej, a zarazem hołdu składanego władcy.
theological_decisions:
- issue: Znaczenie προσκυνέω w odniesieniu do dziecka Jezusa
  choice: oddać mu pokłon
  alternative: oddać mu cześć; upaść przed nim
  rationale: Grecki czasownik może oznaczać zarówno religijną cześć, jak i padnięcie przed kimś lub złożenie hołdu postaci królewskiej. „Oddać pokłon” zachowuje tę zamierzoną wieloznaczność i nie przesądza ponad tekst, czy słowa Heroda należy na poziomie leksykalnym rozumieć jako deklarację kultu, czy królewskiego hołdu.
translation_notes:
  register: Współczesny, godny i narracyjnie płynny język. Zachowano bezpośredni ton polecenia Heroda oraz leksykalną niejednoznaczność προσκυνέω. Zaimek odnoszący się do dziecka zapisano małą literą zgodnie z neutralną narracją i bez dopisywania interpretacji teologicznej.
