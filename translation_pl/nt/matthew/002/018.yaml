base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: pl
  text: '„Głos dał się słyszeć w Ramie: płacz i wielki lament[a]. Rachel płakała po swoich dzieciach i nie chciała dać się pocieszyć[b], bo ich nie ma[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zawodzenie i wielka żałoba”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „odmawiała przyjęcia pocieszenia”.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „ponieważ ich nie ma”.'
    reason: literal_rendering
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: W Ramie usłyszano głos
  rationale: Naturalna polska konstrukcja bezosobowa zachowuje bierny sens ἠκούσθη oraz umiejscowienie głosu w Ramie.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: płacz i wielki lament
  rationale: Rozróżnia dwa bliskie określenia żałoby, a przymiotnik „wielki” oddaje intensyfikujące πολύς bez dodawania niewyrażonego odcienia.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Rachel opłakiwała swoje dzieci
  rationale: „Opłakiwała” naturalnie oddaje κλαίουσα w kontekście śmierci i zachowuje ogólne znaczenie τέκνα jako „dzieci”, nie tylko synów.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: nie chciała dać się pocieszyć
  rationale: Oddaje niedokonany czas ἤθελεν i bierny bezokolicznik παρακληθῆναι, nie wzmacniając wypowiedzi do kategorycznego „odmawiała”.
- source_word: ὅτι οὐκ εἰσίν
  choice: bo już ich nie ma
  rationale: Naturalny polski idiom wyraża utratę dzieci, zachowując zarazem powściągliwość greckiego sformułowania, które nie mówi wprost „umarły”.
theological_decisions:
- issue: Charakter postaci Rachel w cytacie prorockim
  choice: Pozostawiono Rachel jako matczyną postać cytatu bez objaśniania jej symbolicznego znaczenia w tekście głównym.
  alternative: Wyjaśnić Rachel wprost jako symbol matek Izraela albo potraktować wyłącznie jako dosłownie przemawiającą postać historyczną.
  rationale: Grecki tekst przedstawia Rachel bez dopowiedzenia, dlatego przekład zachowuje typologiczną i poetycką wieloznaczność cytatu z Jeremiasza.
translation_notes:
  register: Język współczesny, uroczysty i zrozumiały. Zachowano zwięzłą, poetycką budowę cytatu oraz personifikowaną postać Rachel; nie wprowadzono wprost słowa „umarły”, którego nie ma w grece.
