  to: '„Głos dał się słyszeć w Ramie: płacz i wielki lament[a]. Rachel płakała po swoich dzieciach i nie chciała dać się pocieszyć[b], bo ich nie ma[c]”.'
  rationale: 'Korekta usuwa dwa drobne dopowiedzenia interpretacyjne: żałobny odcień „opłakiwała” oraz temporalne „już”. Zachowuje personifikowaną Rachel, poetycki rejestr cytatu, ogólne „dzieci” oraz nieokreślony charakter ich utraty.'
