base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: pl
  text: 'mówiąc: „Gdzie jest ten, który urodził się królem Żydów? Zobaczyliśmy bowiem jego gwiazdę na wschodzie[a] i przybyliśmy, aby oddać mu pokłon[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „gdy wschodziła”. Greckie wyrażenie ἐν τῇ ἀνατολῇ może oznaczać „na wschodzie” albo odnosić się do wschodzenia gwiazdy.'
    reason: alternative_reading
  - marker: b
    text: 'Lub: „oddać mu hołd” albo „oddać mu cześć”. Grecki czasownik może oznaczać zarówno pokłon lub hołd składany królowi, jak i cześć religijną — zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: pytając
  rationale: Imiesłów dosłownie znaczy „mówiąc”, lecz wprowadza tutaj pytanie mędrców. „Pytając” naturalnie oddaje jego funkcję w polskiej narracji.
- source_word: Ποῦ ἐστιν
  choice: Gdzie jest
  rationale: Bezpośrednie i naturalne oddanie pytania o miejsce pobytu.
- source_word: ὁ τεχθεὶς
  choice: ten, który urodził się
  rationale: Rzeczownikowe użycie imiesłowu biernego odnosi się do osoby, która się urodziła; przekład nie dodaje znaczenia „nowo narodzony” ani nie określa wieku dziecka.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: królem Żydów
  rationale: Naturalne polskie brzmienie tytułu królewskiego, zachowujące jego wymiar polityczny i mesjański.
- source_word: εἴδομεν γὰρ
  choice: Zobaczyliśmy bowiem
  rationale: „Bowiem” oddaje uzasadniające γάρ, a czas przeszły dokonany odpowiada aorystowi εἴδομεν.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: jego gwiazdę
  rationale: Zaimek w dopełniaczu ma sens dzierżawczy; przekład nie rozstrzyga natury znaku astronomicznego.
- source_word: ἐν τῇ ἀνατολῇ
  choice: na wschodzie
  rationale: ἀνατολή może oznaczać kierunek geograficzny albo wschodzenie ciała niebieskiego. W tekście głównym zastosowano tradycyjne, kontekstowo możliwe znaczenie kierunkowe, a drugie zachowano w przypisie.
- source_word: ἤλθομεν
  choice: przybyliśmy
  rationale: Polski czas przeszły dokonany naturalnie przedstawia zakończoną podróż, której skutkiem jest obecność mówiących na miejscu.
- source_word: προσκυνῆσαι αὐτῷ
  choice: aby oddać mu pokłon
  rationale: προσκυνέω może opisywać fizyczny pokłon, hołd składany władcy albo cześć religijną. „Oddać pokłon” zachowuje ten zakres lepiej niż określenie jednoznacznie świeckie lub kultowe.
theological_decisions:
- issue: Znaczenie προσκυνῆσαι w odniesieniu do małego Jezusa
  choice: aby oddać mu pokłon
  alternative: aby oddać mu cześć / aby go uwielbić
  rationale: Bezpośrednim kontekstem jest poszukiwanie króla Żydów, ale grecki czasownik może również odnosić się do czci religijnej. „Oddać pokłon” zachowuje napięcie między hołdem królewskim a aktem uwielbienia i nie rozstrzyga go przedwcześnie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Szyk jest naturalny dla polszczyzny, a „bowiem” zachowuje podniosły, lecz nadal zrozumiały ton. Przypisy zachowują rzeczywistą niejednoznaczność frazy astronomicznej oraz czasownika προσκυνέω.
