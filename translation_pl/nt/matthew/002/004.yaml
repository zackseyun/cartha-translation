    issue: Dodano „więc”
    rationale: Werset rozpoczyna καί („i”), nie zawiera wniosku ani następstwa wyrażonego przez „więc”. Dodatek zmienia relację logiczną z kontekstem.
  - severity: medium
    issue: „spośród ludu” dla τοῦ λαοῦ
    rationale: Wyrażenie sugeruje, że osoby zostały wybrane z ludu. Grecki genetyw naturalniej oddać jako „ludu”, określając arcykapłanów i uczonych w Piśmie jako jego przywódców/nauczycieli.
  revised_text: Zgromadził wszystkich arcykapłanów i uczonych w Piśmie ludu i wypytywał ich, gdzie ma się narodzić Mesjasz[a].
