  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: pl
  text: Zgromadził wszystkich arcykapłanów i uczonych w Piśmie ludu i wypytywał ich, gdzie ma się narodzić Mesjasz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Chrystus”. Grecki tytuł Χριστός oznacza „Namaszczony” i odpowiada tytułowi „Mesjasz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: zgromadził więc
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą pytanie. W naturalnej polszczyźnie osobowa forma czasownika jasno zachowuje kolejność wydarzeń; „więc” płynnie wiąże zdanie z kontekstem.
- source_word: πάντας
  choice: wszystkich
  rationale: Zachowuje pełny zakres greckiego określenia.
- source_word: ἀρχιερεῖς
  choice: arcykapłanów
  rationale: Utrwalone polskie określenie naczelnych przedstawicieli ówczesnego kapłaństwa; liczba mnoga nie oznacza wielu jednocześnie urzędujących najwyższych kapłanów.
- source_word: γραμματεῖς
  choice: uczonych w Piśmie
  rationale: Naturalne i powszechnie zrozumiałe określenie żydowskich znawców oraz wykładowców Pisma i Prawa; samo „pisarze” byłoby dziś mylące.
- source_word: τοῦ λαοῦ
  choice: spośród ludu
  rationale: Oddaje przynależność przywódców religijnych do ludu, bez dodawania w tekście głównym objaśniającego określenia etnicznego.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: wypytywał ich
  rationale: Czasownik niedokonany zachowuje aspekt niedokonany greckiego imperfectum i wskazuje na prowadzone dociekanie; polska składnia naturalnie pomija dosłowne „od nich”.
- source_word: ποῦ
  choice: gdzie
  rationale: Bezpośredni odpowiednik greckiego przysłówka pytajnego.
- source_word: ὁ χριστὸς
  choice: Mesjasz
  rationale: W kontekście oczekiwanego władcy z proroctw Χριστός funkcjonuje jako tytuł. „Mesjasz” zachowuje żydowski kontekst i jest naturalne we współczesnej polszczyźnie biblijnej.
- source_word: γεννᾶται
  choice: ma się narodzić
  rationale: Grecki czas teraźniejszy w pytaniu zależnym dotyczy oczekiwanego narodzenia; konstrukcja „ma się narodzić” naturalnie wyraża ten przyszłościowy i prorocki sens bez nadmiernego doprecyzowania.
theological_decisions:
- issue: Oddanie tytułu Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: Herod pyta o oczekiwanego namaszczonego władcę, dlatego słowo jest tu wyraźnie tytułem, a nie imieniem. „Mesjasz” zachowuje żydowski kontekst, natomiast tradycyjne „Chrystus” podano w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano niedokonany charakter wypytywania oraz tytularne znaczenie Χριστός. Termin „uczeni w Piśmie” jest bardziej komunikatywny dla dzisiejszego odbiorcy niż dosłowne „pisarze”.
