  naturalness: Tekst jest zasadniczo płynny, współczesny i zachowuje stosowny, narracyjny rejestr. „Po ich odejściu” oraz „ma zamiar szukać” są naturalne i precyzyjniejsze w tym kontekście.
  terminology: „Anioł Pana”, „Egipt”, „dziecko”, „pozostań” i „zgładzić” są trafne. Małe litery w odniesieniu do dziecka zachowują neutralność tekstową. Przypis do „zgładzić” właściwie objaśnia śmiercionośny sens ἀπολέσαι w kontekście.
