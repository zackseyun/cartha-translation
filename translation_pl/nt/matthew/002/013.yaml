reference: Matthew 2:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: pl
  text: 'Po ich odejściu oto anioł Pana ukazał się Józefowi we śnie i powiedział: „Wstań, weź dziecko i jego matkę, uciekaj do Egiptu i pozostań tam, dopóki ci nie powiem. Herod bowiem ma zamiar szukać dziecka, aby je zgładzić[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „aby je zniszczyć”; w tym kontekście chodzi o pozbawienie dziecka życia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Gdy zaś oni odeszli
  rationale: Grecki genetivus absolutus wskazuje czynność wcześniejszą wobec ukazania się anioła. Sformułowanie zachowuje następstwo wydarzeń oraz spójnik δέ.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje żywy, narracyjny sygnał nagłego wydarzenia, a zarazem brzmi naturalnie i godnie po polsku.
- source_word: ἄγγελος κυρίου
  choice: anioł Pana
  rationale: Polszczyzna nie ma rodzajnika, dlatego przekład nie rozstrzyga wprost między angielskim „an angel” i „the angel”. Dopełniacz „Pana” naturalnie oddaje κυρίου.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: ukazał się Józefowi we śnie
  rationale: Historyczny czas teraźniejszy oddano polskim czasem przeszłym właściwym narracji; κατ’ ὄναρ jest idiomatycznym określeniem ukazania się we śnie.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Wstań, weź
  rationale: Imiesłów Ἐγερθεὶς w ciągu poleceń ma siłę rozkazującą. Dwa krótkie czasowniki zachowują pilność wypowiedzi.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: dziecko i jego matkę
  rationale: Zwykłe współczesne określenia wiernie oddają relację zaimka do dziecka bez dodawania interpretacyjnej tytulatury.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: uciekaj do Egiptu
  rationale: Czasownik „uciekaj” zachowuje znaczenie zagrożenia i pilności zawarte w φεῦγε.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: pozostań tam, dopóki ci nie powiem
  rationale: Dosłowne „bądź tam” ma w kontekście sens dalszego pozostawania. Konstrukcja z ἕως ἄν wyznacza nieokreślony przyszły kres pobytu.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: Herod bowiem wkrótce zacznie szukać
  rationale: μέλλει z bezokolicznikiem wskazuje na bliską przyszłość; „wkrótce zacznie” wyraźniej zachowuje ten aspekt niż samo „będzie szukał”.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: aby je zgładzić
  rationale: Konstrukcja wyraża cel, a ἀπόλλυμι w tym kontekście oznacza doprowadzenie dziecka do śmierci. „Zgładzić” zachowuje zarazem moc i nieco szerszy obraz greckiego czasownika.
theological_decisions:
- issue: Znaczenie κύριος w wyrażeniu ἄγγελος κυρίου
  choice: Pan
  alternative: Władca
  rationale: „Anioł Pana” jest naturalnym i utrwalonym polskim odpowiednikiem biblijnego wyrażenia, bez narzucania dokładniejszej identyfikacji anioła.
- issue: Typograficzne wyróżnienie dziecka i odnoszących się do niego zaimków
  choice: 'małe litery: „dziecko”, „jego”, „je”'
  alternative: 'wielkie litery: „Dziecko”, „Jego”, „Je”'
  rationale: Grecki tekst nie koduje czci przez taką kapitalizację. Małe litery zachowują neutralność tekstową i nie umniejszają identyfikacji dziecka wynikającej z kontekstu.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Krótkie polecenia zachowują pilność sceny; „oto” oddaje Mateuszowy sygnał nagłego wkroczenia Bożego. Uniknięto archaizmów oraz interpretacyjnej kapitalizacji rzeczownika i zaimków.
