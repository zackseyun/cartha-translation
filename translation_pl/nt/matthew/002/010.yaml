  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: pl
  text: Gdy zobaczyli gwiazdę, uradowali się bardzo wielką radością.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „uradowali się radością wielką bardzo” — grecki zwrot w sposób szczególnie mocny podkreśla ich radość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Gdy zobaczyli
  rationale: Aorystyczny imiesłów pełni funkcję czasową względem głównego czasownika; takie ujęcie naturalnie oddaje następstwo zdarzeń.
- source_word: δὲ
  choice: pominięcie odrębnego odpowiednika
  rationale: Łagodny łącznik narracyjny δέ nie sygnalizuje tu wyraźnego przeciwstawienia; w naturalnej polskiej narracji nie wymaga osobnego oddania.
- source_word: τὸν ἀστέρα
  choice: gwiazdę
  rationale: Rzeczownik oznacza „gwiazdę”, a określoność wynika z kontekstu, ponieważ chodzi o gwiazdę wspomnianą wcześniej.
- source_word: ἐχάρησαν
  choice: się uradowali
  rationale: Forma ma znaczenie czynne i wyraża intensywną radość; „uradowali się” zachowuje podniosły, lecz współczesny rejestr.
- source_word: χαρὰν μεγάλην
  choice: uradowali
  rationale: Grecka konstrukcja z biernikiem pokrewnego rzeczownika wzmacnia czasownik; po polsku jej sens najnaturalniej zawiera czasownik wraz z określeniem stopnia.
- source_word: σφόδρα
  choice: niezmiernie
  rationale: Przysłówek silnie intensyfikuje cały zwrot i wraz z czasownikiem oddaje nagromadzone w grece podkreślenie wielkiej radości.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i naturalny język. Zdanie główne unika niezręcznego po polsku powtórzenia rdzenia „radować się radością”, natomiast przypis zachowuje wgląd w silnie emfatyczną konstrukcję grecką.
