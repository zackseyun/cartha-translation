id: MAT.2.9
reference: Matthew 2:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: pl
  text: Po wysłuchaniu króla wyruszyli. A oto gwiazda, którą widzieli na wschodzie[a], szła przed nimi, aż dotarła i zatrzymała się nad miejscem, gdzie było dziecko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „gdy wschodziła”. Grecki zwrot może oznaczać zarówno wschód jako kierunek lub obszar, jak i wschodzenie gwiazdy.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Po wysłuchaniu króla
  rationale: Aorystyczny imiesłów oddaje czynność poprzedzającą wyruszenie, a dopełniacz wskazuje osobę, której wysłuchano. Sformułowanie zachowuje tytuł „król” bez dopowiadania imienia Heroda.
- source_word: ἐπορεύθησαν
  choice: wyruszyli
  rationale: Naturalnie oddaje rozpoczęcie dalszej drogi po spotkaniu z królem, bez nadmiernego rozwijania treści.
- source_word: ἰδοὺ
  choice: A oto
  rationale: Zachowuje żywy znacznik narracyjny kierujący uwagę na nagłe pojawienie się gwiazdy.
- source_word: ἀστὴρ
  choice: gwiazda
  rationale: Podstawowy i jednoznaczny odpowiednik leksykalny.
- source_word: ὃν εἶδον
  choice: którą widzieli
  rationale: Polski czas przeszły wystarczająco jasno wskazuje na wcześniejsze ujrzenie gwiazdy; konstrukcja pozostaje naturalna i bliska grece.
- source_word: ἐν τῇ ἀνατολῇ
  choice: na wschodzie
  rationale: Zachowuje powszechne geograficzne odczytanie zwrotu, a jego możliwe znaczenie astronomiczne podano w przypisie.
- source_word: προῆγεν αὐτούς
  choice: szła przed nimi
  rationale: Oddaje dosłowny obraz gwiazdy idącej przed wędrowcami, nie precyzując mechanizmu jej prowadzenia.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: aż dotarła i zatrzymała się
  rationale: Naturalna polszczyzna zachowuje następstwo przybycia i zatrzymania; rodzaj żeński wynika z polskiego rzeczownika „gwiazda”.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: nad miejscem, gdzie było dziecko
  rationale: Wyraźnie oddaje położenie ponad miejscem przebywania dziecka. „Dziecko” jest współczesnym, nie nacechowanym odpowiednikiem παιδίον.
theological_decisions:
- issue: Znaczenie ἐν τῇ ἀνατολῇ w opowiadaniu o gwieździe
  choice: na wschodzie
  alternative: przy jej wschodzie
  rationale: Grecki zwrot może oznaczać zarówno wschód jako kierunek lub obszar, jak i moment ukazania się ciała niebieskiego nad horyzontem. Tekst główny zachowuje tradycyjne, geograficzne odczytanie, a przypis zabezpiecza rzeczywistą dwuznaczność bez rozstrzygania natury zjawiska.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. „A oto” zachowuje biblijną żywość bez archaizowania całości; „dziecko” zamiast podniosłego „Dziecię” odpowiada neutralnemu παιδίον.
