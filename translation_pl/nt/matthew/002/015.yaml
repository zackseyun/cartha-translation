id: MAT.2.15
reference: Matthew 2:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: pl
  text: 'I pozostał tam aż do śmierci Heroda, aby się wypełniło to, co Pan powiedział przez proroka: „Z Egiptu wezwałem mojego syna”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cytat z Oz 11,1. W swoim pierwotnym kontekście słowa te odnoszą się do Izraela jako syna Boga; Mateusz przedstawia ich spełnienie w Jezusie.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: pozostał tam
  rationale: Dosłownie wyrażenie znaczy „był tam”, lecz w polskim kontekście narracyjnym forma „pozostał tam” naturalnie oddaje trwanie pobytu aż do wskazanego momentu, bez zmiany sensu.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: aż do śmierci Heroda
  rationale: τελευτή oznacza tu kres życia, czyli śmierć; zachowano nominalną konstrukcję grecką.
- source_word: ἵνα πληρωθῇ
  choice: aby się wypełniło
  rationale: Zachowuje celowo-skutkowy odcień formuły wypełnienia, nie sprowadzając jej do prostego bezokolicznika.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: to, co Pan powiedział
  rationale: Naturalna polska konstrukcja zachowuje Pana jako ostateczne źródło wypowiedzi; czynna forma jest idiomatyczna i nie zmienia relacji sprawczej.
- source_word: διὰ τοῦ προφήτου
  choice: przez proroka
  rationale: 'Oddaje pośrednie sprawstwo: Pan jest źródłem słów, a prorok ich przekazicielem.'
- source_word: λέγοντος
  choice: ':'
  rationale: Współczesna polszczyzna naturalnie wprowadza cytat po czasowniku mówienia dwukropkiem; osobne „mówiąc” byłoby niezręczne i niejednoznaczne składniowo.
- source_word: Ἐξ Αἰγύπτου
  choice: Z Egiptu
  rationale: „Z Egiptu” jest zwykłym i precyzyjnym polskim odpowiednikiem ἐξ, zachowującym obraz wyprowadzenia z kraju.
- source_word: ἐκάλεσα
  choice: wezwałem
  rationale: W tym kontekście καλέω oznacza wezwanie kogoś do wyjścia; „wezwałem” brzmi naturalniej niż samo „zawołałem” i nie przesądza mechanizmu wypełnienia cytatu.
- source_word: τὸν υἱόν μου
  choice: mojego Syna
  rationale: υἱός oznacza „syn”; wielka litera sygnalizuje Mateuszowe odniesienie cytatu do Jezusa, pozostawiając wyjaśnienie pierwotnego odniesienia do Izraela w przypisie.
theological_decisions:
- issue: Formuła wypełnienia i cytat z Oz 11,1
  choice: Zachowano twierdzenie Mateusza, że pobyt Jezusa w Egipcie i Jego powrót wiążą się z wypełnieniem słowa Pana.
  alternative: Przekład mógłby doprecyzować, że chodzi wyłącznie o bezpośrednią przepowiednię albo wyłącznie o typologiczne powtórzenie dziejów Izraela.
  rationale: Grecki tekst mówi o wypełnieniu, ale nie objaśnia jego mechanizmu. Przekład nie powinien rozstrzygać tej teologicznej kwestii za autora.
- issue: κύριος w formule cytatu
  choice: Pan
  alternative: PAN
  rationale: Tekst grecki zawiera κύριος; „Pan” wiernie go oddaje bez wprowadzania do tekstu głównego rekonstrukcji hebrajskiego imienia Bożego.
- issue: Odniesienie wyrażenia „mój Syn”
  choice: Syn w tekście głównym, z przypisem o pierwotnym odniesieniu do Izraela
  alternative: syn małą literą bez objaśnienia albo doprecyzowanie „Jezus” w samym cytacie
  rationale: Mateusz odnosi cytat do Jezusa, natomiast Oz 11,1 pierwotnie mówi o Izraelu. Tekst i przypis zachowują oba poziomy bez ich zacierania.
translation_notes:
  register: Język współczesny, godny i czytelny. Zachowano tradycyjną formułę „aby się wypełniło”, lecz uniknięto kalki składniowej „mówiącego”. Marker [a] znajduje się bezpośrednio po cytacie, którego dotyczy.
