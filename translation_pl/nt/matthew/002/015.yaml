  terminology: „Pan”, „prorok”, „wypełniło” i „wezwałem” są trafne. Mała litera w „mojego syna” najlepiej zachowuje formę cytatu i nie narzuca interpretacji wielką literą; mateuszowe zastosowanie do Jezusa wyjaśnia przypis.
