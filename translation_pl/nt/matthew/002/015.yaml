  source_fidelity: Przekład wiernie oddaje konstrukcję czasową, formułę wypełnienia, rozróżnienie między Panem jako mówiącym a prorokiem jako pośrednikiem oraz sens cytatu. „Pozostał tam” jest dopuszczalnym kontekstowym rozwinięciem greckiego „był tam”. Wielka litera w „mojego Syna” nie jest jednak oznaczona przez grekę cytatu i rozstrzyga w tekście głównym relację cytatu do Jezusa, choć przypis słusznie wskazuje także jego pierwotne odniesienie do Izraela.
