id: MAT.2.16
reference: Matthew 2:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: pl
  text: Wtedy Herod, widząc, że magowie[a] go przechytrzyli[b], bardzo się rozgniewał. Posłał ludzi i zgładził wszystkich chłopców w Betlejem i całej jego okolicy, w wieku dwóch lat i poniżej, stosownie do czasu, który dokładnie ustalił na podstawie informacji uzyskanych od magów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradycyjnie: „mędrcy”. Greckie określenie oznacza magów — wschodnich uczonych zajmujących się między innymi astrologią.'
    reason: cultural_note
  - marker: b
    text: 'Lub bardziej dosłownie: „wyśmiali go” albo „zakpili z niego”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, zachowujący następstwo wydarzeń.
- source_word: ἰδὼν ὅτι
  choice: widząc, że
  rationale: Zachowuje konstrukcję percepcyjną i jej związek z następującą reakcją Heroda.
- source_word: ἐνεπαίχθη ὑπὸ τῶν μάγων
  choice: magowie go przechytrzyli
  rationale: W tym kontekście czasownik opisuje zrobienie z Heroda głupca przez niepowrócenie do niego. Strona czynna brzmi po polsku naturalniej; dosłowniejszą możliwość podano w przypisie.
- source_word: ἐθυμώθη λίαν
  choice: bardzo się rozgniewał
  rationale: Przejrzyście oddaje zarówno zmianę stanu wyrażoną czasownikiem, jak i wzmocnienie λίαν.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Posłał ludzi i zgładził
  rationale: Oddaje wysłanie wykonawców oraz przypisanie Herodowi odpowiedzialności za zabicie. „Zgładził” pozwala naturalnie mówić o działaniu władcy dokonanym przez wysłanych ludzi, bez sugerowania, że zabił dzieci osobiście.
- source_word: πάντας τοὺς παῖδας
  choice: wszystkich chłopców
  rationale: Kontekst wskazuje na dzieci płci męskiej; „chłopców” jest zwięzłe i jednoznaczne.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: w Betlejem i całej jego okolicy
  rationale: ὅρια oznacza tu tereny należące do Betlejem lub je otaczające, nie jedynie linie graniczne.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: w wieku dwóch lat i młodszych
  rationale: Naturalny polski sposób wyrażenia włącznie określonej górnej granicy wieku.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: stosownie do czasu, który dokładnie ustalił na podstawie informacji uzyskanych od magów
  rationale: Oddaje zgodność decyzji Heroda z dokładnie ustalonym czasem oraz pochodzenie informacji od magów, bez nadmiernie dosłownej i nienaturalnej składni.
theological_decisions:
- issue: Znaczenie μάγοι
  choice: magowie
  alternative: mędrcy
  rationale: „Magowie” zachowuje historyczno-kulturową swoistość greckiego określenia wschodnich uczonych związanych z astrologią, nie wprowadzając późniejszych wyobrażeń tradycyjnych.
- issue: Znaczenie ἐνεπαίχθη
  choice: przechytrzyli go
  alternative: wyśmiali go / zakpili z niego
  rationale: Kontekst podkreśla, że magowie nie wrócili do Heroda i w ten sposób udaremnili jego zamiar. Wybrane sformułowanie jasno oddaje ten skutek, a dosłowniejszy odcień kpiny pozostaje widoczny w przypisie.
- issue: Sprawstwo Heroda w ἀποστείλας ἀνεῖλεν
  choice: Posłał ludzi i zgładził
  alternative: wysłał ludzi i kazał zabić
  rationale: Tekst przypisuje zabicie Herodowi po wysłaniu wykonawców. Wybrane brzmienie zachowuje tę bezpośrednią odpowiedzialność, nie dodając wyraźnego czasownika „kazał”, którego nie ma w grece.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym tonie. Zdanie podzielono po reakcji Heroda, aby uniknąć ciężkiej wielokrotnie złożonej konstrukcji, zachowując kolejność i związki logiczne tekstu greckiego. Wszystkie przypisy mają odpowiadające znaczniki w tekście głównym.
