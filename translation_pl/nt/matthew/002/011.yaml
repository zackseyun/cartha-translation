    rationale: Greckie θησαυρούς może w tym kontekście oznaczać skarbce lub schowki na kosztowności, co wyjaśnia czasownik „otworzyli”. Polski rzeczownik „skarby” zwykle oznacza same wartościowe przedmioty, których nie można dosłownie otworzyć. „Skarbce” zachowuje zamierzoną nieostrość co do rodzaju pojemnika.
