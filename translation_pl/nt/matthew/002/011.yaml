id: MAT.2.11
reference: Matthew 2:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: pl
  text: 'A gdy weszli do domu, zobaczyli dziecko z Marią, jego matką. Padli przed nim i złożyli mu hołd[a]. Potem otworzyli swoje skarbce i ofiarowali mu dary: złoto, kadzidło i mirrę.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „oddali mu cześć”. Grecki czasownik może oznaczać cześć religijną albo pełen czci hołd, zależnie od kontekstu.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: domu
  rationale: Bezpośredni i naturalny odpowiednik konkretnego miejsca zamieszkania; nie dodaje znaczenia „gospodarstwa domowego” ani „rodziny”.
- source_word: παιδίον
  choice: dziecko
  rationale: Zachowuje ogólność greckiego określenia bez doprecyzowania wieku lub płci ponad to, co wyraża rzeczownik.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: z Marią, jego matką
  rationale: Oddaje znaczenie μετά z dopełniaczem oraz apozycyjne objaśnienie, że Maria jest matką dziecka.
- source_word: πεσόντες
  choice: padli przed nim
  rationale: Naturalnie przedstawia zamierzoną postawę uniżenia; samo „upadli” mogłoby po polsku sugerować przypadkowy upadek, a „padli na twarz” dopowiadałoby szczegół niewyrażony wprost przez ten imiesłów.
- source_word: προσεκύνησαν
  choice: złożyli mu hołd
  rationale: Wyraża głęboką cześć okazaną przez gest uniżenia, a zarazem nie rozstrzyga, czy w najbliższym kontekście chodzi wyłącznie o hołd królewski, czy o kult religijny.
- source_word: θησαυροὺς
  choice: skarby
  rationale: Zachowuje szeroki zakres słowa, które może odnosić się do zgromadzonych kosztowności lub miejsca bądź pojemnika, gdzie są przechowywane; bardziej konkretne „skrzynie” byłoby dopowiedzeniem.
- source_word: προσήνεγκαν
  choice: ofiarowali
  rationale: Pasuje do uroczystego wręczenia darów i oddaje sens przyniesienia oraz przedstawienia ich obdarowanemu.
- source_word: δῶρα
  choice: dary
  rationale: Naturalne, podniosłe i nieprzesadnie interpretacyjne określenie wręczanych kosztowności.
- source_word: λίβανον
  choice: kadzidło
  rationale: W polskiej tradycji językowej jest to utrwalona nazwa wonnej żywicy, czyli frankincense; „kadzidło” jest zrozumiałe dla zwykłego czytelnika.
- source_word: σμύρναν
  choice: mirrę
  rationale: Precyzyjny i utrwalony polski odpowiednik nazwy aromatycznej żywicy.
theological_decisions:
- issue: Znaczenie προσκυνέω wobec dziecka Jezusa
  choice: złożyli mu hołd
  alternative: oddali mu cześć
  rationale: Czasownik może oznaczać zarówno hołd składany władcy, jak i cześć o charakterze religijnym. Tekst główny zachowuje możliwość odczytania gestu jako hołdu królewskiemu dziecku, natomiast przypis sygnalizuje mocniejsze odczytanie kultowe bez narzucania go jako jedynego.
translation_notes:
  register: Współczesna, godna polszczyzna z naturalnym podziałem długiego greckiego zdania. Zaimek odnoszący się do Jezusa zapisano małą literą, aby nie wprowadzać do przekładu interpretacji za pomocą konwencji typograficznej. Powtórzenie spójników ograniczono dla płynności, zachowując kolejność wszystkich działań.
