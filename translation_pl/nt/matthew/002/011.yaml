  source_fidelity: 'Przekład wiernie zachowuje kolejność i wszystkie zasadnicze elementy greckiego zdania: wejście do domu, dziecko z Marią, gest uniżenia i hołdu, otwarcie θησαυρούς oraz trzy dary. „Złożyli mu hołd” trafnie pozostawia otwarte spektrum προσκυνέω, a przypis właściwie sygnalizuje możliwe odczytanie religijne.'
  naturalness: 'Większość sformułowań jest współczesna i naturalna. Jedyny istotny problem stanowi „otworzyli swoje skarby”: po polsku otwiera się raczej pojemniki lub schowki niż same kosztowności. „Skarbce” naturalnie oddają tu rzeczownik użyty w konstrukcji z „otworzyli”, bez określania ich konkretnego kształtu.'
  terminology: „Dziecko”, „Maria, jego matka”, „dary”, „złoto, kadzidło i mirra” są trafne. „Kadzidło” jest utrwalonym polskim odpowiednikiem λίβανος w tym tradycyjnym wyliczeniu. Przypis przy hołdzie jest umieszczony przy właściwym wyrażeniu i nie narzuca interpretacji doktrynalnej.
  issues:
