  to: 'A gdy weszli do domu, zobaczyli dziecko z Marią, jego matką. Padli przed nim i złożyli mu hołd[a]. Potem otworzyli swoje skarbce i ofiarowali mu dary: złoto, kadzidło i mirrę.'
