  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: pl
  text: Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „przez proroka Jeremiasza mówiącego”.'
    reason: Grecki imiesłów λέγοντος odnosi się do Jeremiasza i wprowadza cytat; w tekście głównym jego funkcję naturalnie oddaje dwukropek.
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski przysłówek czasowy zachowujący następstwo wydarzeń w narracji.
- source_word: ἐπληρώθη
  choice: wypełniło się
  rationale: Oddaje aoryst strony biernej oraz charakterystyczny dla Mateusza język wypełnienia proroctwa, bez dopowiadania sposobu realizacji.
- source_word: τὸ ῥηθὲν
  choice: to, co zostało powiedziane
  rationale: Naturalnie oddaje substantywizowany imiesłów i jego stronę bierną.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: przez proroka Jeremiasza
  rationale: Przyimek „przez” zachowuje pośrednictwo wyrażone przez διά z dopełniaczem; szyk jest naturalny po polsku.
- source_word: λέγοντος
  choice: dwukropek wprowadzający cytat
  rationale: Imiesłów w dopełniaczu odnosi się składniowo do Jeremiasza i wprowadza jego wypowiedź. Współczesna polszczyzna najnaturalniej sygnalizuje tę funkcję dwukropkiem, unikając niezręcznego „mówiącego” lub „mówiąc”.
theological_decisions:
- issue: Mateuszowa formuła wypełnienia
  choice: wypełniło się
  alternative: spełniło się / wydarzyło się, aby wypełnić
  rationale: Zachowano wyraźne twierdzenie o wypełnieniu prorockiej wypowiedzi, nie rozszerzając greckiego tekstu o cel wydarzenia.
- issue: Pośrednictwo proroka
  choice: powiedziane przez proroka Jeremiasza
  alternative: powiedziane przez Jeremiasza / słowa proroka Jeremiasza
  rationale: Przekład zachowuje zarówno διά wskazujące pośrednictwo, jak i tytuł „prorok”, bez określania wprost niewymienionego podmiotu mówiącego.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano formalny termin „wypełniło się”, a ciężką grecką konstrukcję imiesłowową oddano naturalną polską interpunkcją.
