  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: pl
  text: 'A oni powiedzieli mu: „W Betlejem w Judei, gdyż tak zostało napisane przez proroka:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Oni zaś
  rationale: Rodzajnik użyty rzeczownikowo odsyła do arcykapłanów i znawców Prawa z poprzedniego wersetu, a δέ stanowi łagodne nawiązanie, bez mocnego przeciwstawienia.
- source_word: εἶπαν αὐτῷ
  choice: powiedzieli mu
  rationale: Prosty polski odpowiednik czasownika λέγω z celownikiem; nie dodaje interpretacyjnego odcienia obecnego w „odpowiedzieli”.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: W Betlejem w Judei
  rationale: Oddaje lokalne ἐν oraz dopełniacz identyfikujący, który odróżnia to Betlejem od innych miejsc o tej nazwie.
- source_word: οὕτως γὰρ
  choice: bo tak
  rationale: γάρ podaje uzasadnienie odpowiedzi, a οὕτως wskazuje naprzód na przytoczenie następujące w kolejnym wersecie.
- source_word: γέγραπται
  choice: zostało napisane
  rationale: Forma dokonana strony biernej odzwierciedla grecki perfectum i trwałą aktualność zapisanego tekstu, pozostając naturalna po polsku.
- source_word: διὰ τοῦ προφήτου
  choice: przez proroka
  rationale: διά z dopełniaczem wyraża pośrednictwo lub sprawczość; polskie „przez proroka” jest zwięzłe i nie rozstrzyga ponad tekst relacji między Boskim źródłem a ludzkim pośrednikiem.
theological_decisions:
- issue: Formuła pośrednictwa prorockiego
  choice: przez proroka
  alternative: za pośrednictwem proroka
  rationale: Wybrana forma jest naturalniejsza we współczesnej polszczyźnie i zachowuje możliwość rozumienia proroka jako pośrednika wypowiedzi, bez dopowiadania doktrynalnego.
translation_notes:
  register: Współczesny, godny i czytelny rejestr. Zachowano ciągłość wypowiedzi oraz dwukropek zapowiadający cytat w następnym wersecie.
