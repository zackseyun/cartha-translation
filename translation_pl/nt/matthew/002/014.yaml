  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: pl
  text: Wstał więc, wziął dziecko i matkę dziecka nocą, i wyruszył do Egiptu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: więc
  rationale: Łagodny spójnik rozwija narrację i w tym kontekście wskazuje na wykonanie wcześniejszego polecenia.
- source_word: ἐγερθεὶς
  choice: wstał
  rationale: Naturalny polski odpowiednik imiesłowu aorystu, zachowujący następstwo wydarzeń bez niezręcznego dosłownego „powstawszy”.
- source_word: παρέλαβε
  choice: wziął
  rationale: W tym kontekście czasownik oznacza zabranie osób ze sobą; „wziął” jest zwięzłe i naturalne.
- source_word: τὸ παιδίον
  choice: dziecko
  rationale: Oddaje podstawowe znaczenie rzeczownika bez dodawania niewyrażonego w tekście nacisku na wiek.
- source_word: τὴν μητέρα αὐτοῦ
  choice: jego matkę
  rationale: Zaimek odnosi się naturalnie do dziecka; polskie sformułowanie zachowuje strukturę i jasność greckiego tekstu.
- source_word: νυκτὸς
  choice: jeszcze w nocy
  rationale: Dopełniacz czasu wskazuje, że działanie nastąpiło nocą; „jeszcze w nocy” brzmi naturalnie i podkreśla niezwłoczne wykonanie polecenia bez określania dokładnej pory.
- source_word: ἀνεχώρησεν
  choice: odszedł
  rationale: Czasownik oznacza odejście lub wycofanie się; „odszedł” zachowuje ogólny sens ruchu bez dopowiadania motywu.
- source_word: εἰς Αἴγυπτον
  choice: do Egiptu
  rationale: Przyimek εἰς oznacza ruch ku celowi; „do Egiptu” jest zwykłym i precyzyjnym polskim odpowiednikiem.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano kolejność czynności oraz rozróżnienie między dzieckiem a jego matką; uniknięto archaicznego „powstawszy” i nadmiernie podniosłego „udał się”.
