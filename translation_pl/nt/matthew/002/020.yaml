  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: pl
  text: 'mówiąc: „Wstań, weź dziecko i jego matkę i idź do ziemi Izraela, bo ci, którzy czyhali na życie dziecka, nie żyją”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „umarli bowiem ci, którzy szukają życia dziecka”.'
    reason: Dosłowny wariant zachowuje szyk z greckim γάρ oraz teraźniejszy imiesłów ζητοῦντες; tekst główny oddaje ten zwrot naturalnym polskim idiomem oznaczającym zamiar pozbawienia życia.
lexical_decisions:
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów czasu teraźniejszego wprowadza wypowiedź anioła i składniowo łączy ją z poprzednim wersetem; polskie „mówiąc” zachowuje tę zależność.
- source_word: Ἐγερθείς
  choice: Wstań
  rationale: Imiesłów aorystu użyty idiomatycznie przed rozkazem najlepiej oddaje naturalny polski tryb rozkazujący.
- source_word: παράλαβε
  choice: weź
  rationale: W tym kontekście czasownik oznacza zabranie kogoś ze sobą; „weź” jest zwięzłe i naturalne.
- source_word: τὸ παιδίον
  choice: Dziecko
  rationale: παιδίον oznacza dziecko; nie ma potrzeby dodawać określenia „małe”. Wielka litera identyfikuje Jezusa zgodnie z polską praktyką religijną, bez zmiany znaczenia rzeczownika.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Jego matkę
  rationale: Oddaje zaimek dzierżawczy αὐτοῦ i zachowuje naturalny szyk polski.
- source_word: πορεύου
  choice: idź
  rationale: Prosty rozkaz ruchu został oddany najbliższym, naturalnym polskim odpowiednikiem.
- source_word: εἰς γῆν Ἰσραήλ
  choice: do ziemi Izraela
  rationale: Zachowuje geograficzne znaczenie γῆ oraz dopełniacz Ἰσραήλ, nie upraszczając wyrażenia do samego „Izraela”.
- source_word: τεθνήκασιν
  choice: już nie żyją
  rationale: Perfectum podkreśla obecny stan będący skutkiem śmierci. Wyrażenie „już nie żyją” brzmi naturalnie po polsku i dobrze oddaje ten rezultat.
- source_word: οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου
  choice: ci, którzy czyhali na życie Dziecka
  rationale: Polski idiom „czyhać na czyjeś życie” jasno wyraża śmiertelne zagrożenie zawarte w greckim zwrocie, nie wprowadzając pojęcia niematerialnej duszy.
theological_decisions:
- issue: Znaczenie ψυχή w kontekście śmiertelnego zagrożenia
  choice: życie
  alternative: dusza
  rationale: Zwrot „szukać czyjejś ψυχή” oznacza tutaj dążenie do pozbawienia osoby życia. „Dusza” nadawałaby wypowiedzi sens antropologiczny lub teologiczny, którego kontekst nie wymaga.
translation_notes:
  register: Język współczesny, godny i zrozumiały. Zachowano imiesłowowe połączenie z poprzednim wersetem. Wielkie litery w „Dziecko” i „Jego” odpowiadają utrwalonej polskiej pisowni odnoszącej zaimki i określenia do Jezusa; nie służą rozstrzyganiu dodatkowej kwestii teologicznej.
