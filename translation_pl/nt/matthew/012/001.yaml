id: MAT.12.1
reference: Matthew 12:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: pl
  text: W tym czasie Jezus szedł w szabat[a] przez pola obsiane zbożem. Jego uczniowie zgłodnieli i zaczęli zrywać kłosy i jeść.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie po grecku: „w szabaty”; liczba mnoga jest tu idiomatycznym określeniem szabatu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: W tym czasie
  rationale: καιρός wskazuje tu na czas lub okoliczność w toku opowiadania, nie na dokładną godzinę. Zwrot zachowuje znacznik czasowy i brzmi naturalnie po polsku.
- source_word: ἐπορεύθη
  choice: szedł
  rationale: πορεύομαι oznacza iść lub podróżować. W połączeniu z διὰ τῶν σπορίμων polskie „szedł […] przez” jasno i naturalnie oddaje przemieszczanie się Jezusa.
- source_word: τοῖς σάββασιν
  choice: w szabat
  rationale: Grecka liczba mnoga jest w tym kontekście idiomatycznym określeniem dnia szabatu. Polska liczba pojedyncza przekazuje zamierzony sens bez sugerowania wielu szabatów.
- source_word: διὰ τῶν σπορίμων
  choice: przez pola obsiane zbożem
  rationale: σπόριμος odnosi się do obsianych pól, zwłaszcza pól zbożowych. Rozwinięte sformułowanie jest jasne dla współczesnego czytelnika.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Jego uczniowie
  rationale: δέ pełni tu funkcję łagodnie łączącą, nie wyraża mocnego przeciwstawienia. Początek nowego polskiego zdania nie wymaga osobnego odpowiednika spójnika.
- source_word: ἐπείνασαν
  choice: zgłodnieli
  rationale: Forma aorystu może wskazywać na pojawienie się głodu. „Zgłodnieli” zwięźle oddaje ten sens dynamiczny.
- source_word: ἤρξαντο τίλλειν
  choice: zaczęli zrywać
  rationale: ἤρξαντο z bezokolicznikiem oznacza początek czynności, a τίλλειν — odrywanie lub zrywanie ręką.
- source_word: στάχυας
  choice: kłosy
  rationale: στάχυς oznacza kłos, czyli część zboża zawierającą ziarna. „Kłosy” jest precyzyjnym i powszechnie zrozumiałym polskim odpowiednikiem.
- source_word: καὶ ἐσθίειν
  choice: i jeść
  rationale: Drugi bezokolicznik jest współrzędny wobec τίλλειν i zależy od „zaczęli”; polska składnia naturalnie pozwala nie powtarzać słowa „zaczęli”.
theological_decisions:
- issue: Oddanie formy σάββασιν
  choice: w szabat
  alternative: w szabaty
  rationale: Choć grecki rzeczownik ma formę liczby mnogiej, jest to znany idiom odnoszący się do dnia szabatu. Liczba pojedyncza po polsku oddaje sens kontekstowy, a przypis zachowuje informację o formie oryginału.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano zwięzłość tekstu greckiego, a „zgłodnieli” oddaje pojawienie się głodu. Termin „szabat” pozostaje tradycyjny i powszechnie rozpoznawalny.
