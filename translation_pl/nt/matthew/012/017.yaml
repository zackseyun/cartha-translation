id: MAT.12.17
reference: Matthew 12:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: pl
  text: 'aby spełniło się to, co zostało powiedziane przez proroka Izajasza[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „przez proroka Izajasza, mówiącego”.'
    reason: Imiesłów λέγοντος dosłownie znaczy „mówiącego”, lecz w tekście głównym jego funkcję wprowadzania cytatu oddano dwukropkiem.
lexical_decisions:
- source_word: ἵνα
  choice: aby
  rationale: Naturalnie wprowadza po polsku zdanie celu lub skutku, nie rozstrzygając nadmiernie tej relacji.
- source_word: πληρωθῇ
  choice: spełniło się
  rationale: Oddaje aorystyczny tryb łączący strony biernej w utrwalonej, naturalnej formule wypełnienia proroctwa.
- source_word: τὸ ῥηθὲν
  choice: to, co zostało powiedziane
  rationale: Zachowuje rzeczownikową funkcję imiesłowu oraz jego bierny charakter.
- source_word: διὰ
  choice: przez
  rationale: Z dopełniaczem wskazuje tu na pośrednictwo proroka; polskie „przez” zachowuje tę relację bez wskazywania Izajasza jako ostatecznego źródła wypowiedzi.
- source_word: Ἠσαΐου
  choice: Izajasza
  rationale: Standardowa polska forma imienia proroka, odmieniona zgodnie ze składnią zdania.
- source_word: τοῦ προφήτου
  choice: proroka
  rationale: Zachowuje obecną w tekście greckim apozycyjną identyfikację Izajasza.
- source_word: λέγοντος
  choice: dwukropek
  rationale: Imiesłów wprowadza następujący cytat. W naturalnej współczesnej polszczyźnie jego funkcję zwięźle i jasno oddaje dwukropek, unikając niezręcznego „mówiącego”.
theological_decisions:
- issue: Pośrednictwo proroka w formule cytowania
  choice: przez proroka Izajasza
  alternative: proroka Izajasza
  rationale: 'Wyrażenie z „przez” zachowuje znaczenie greckiego διά z dopełniaczem: Izajasz jest pośrednikiem wypowiedzi, a niekoniecznie jej ostatecznym źródłem.'
translation_notes:
  register: Współczesny, godny i naturalny rejestr biblijny. Zachowano Mateuszową formułę spełnienia; szyk „przez proroka Izajasza” jest idiomatyczny w polszczyźnie i nadal podkreśla prorockie pośrednictwo.
