id: MAT.12.39
reference: Matthew 12:39
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: pl
  text: 'On zaś odpowiedział im: „Pokolenie złe i cudzołożne[a] szuka znaku, lecz żaden znak nie będzie mu dany oprócz znaku proroka Jonasza[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Cudzołożne” może przywoływać nie tylko niemoralność seksualną, lecz także znany z proroków obraz niewierności wobec Boga.
    reason: cross_reference
  - marker: b
    text: 'Możliwe także: „znaku Jonasza, proroka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Grecka konstrukcja imiesłów + czasownik osobowy jest typową formułą narracyjną. Współczesne polskie „odpowiedział” naturalnie oddaje oba jej elementy; dosłowne „odpowiedziawszy, powiedział” byłoby niezręczne.
- source_word: Γενεὰ
  choice: pokolenie
  rationale: „Pokolenie” zachowuje zbiorowy i czasowy sens rzeczownika, a zarazem dobrze pasuje do moralnej charakterystyki współczesnych Jezusowi ludzi.
- source_word: πονηρὰ
  choice: złe
  rationale: To bezpośredni, naturalny odpowiednik wyrażający moralną ocenę bez niepotrzebnego wzmacniania.
- source_word: μοιχαλὶς
  choice: cudzołożne
  rationale: Określenie zachowuje dosłowną ostrość greckiej metafory oraz jej prorockie skojarzenie z niewiernością wobec Boga, zamiast sprowadzać sens wyłącznie do interpretacyjnego „niewierne”.
- source_word: σημεῖον
  choice: znak
  rationale: „Znak” zachowuje szeroki zakres greckiego wyrazu. Dodanie „cudowny” nadmiernie precyzowałoby treść, której sam wyraz tutaj nie rozstrzyga.
- source_word: ἐπιζητεῖ
  choice: szuka
  rationale: „Szuka” bezpośrednio oddaje czasownik i pozostawia kontekstowi ocenę intencji pytających; „żąda” lub „domaga się” byłoby bardziej interpretacyjne.
- source_word: δοθήσεται
  choice: będzie dany
  rationale: Naturalnie i formalnie oddaje grecki czas przyszły w stronie biernej.
- source_word: αὐτῇ
  choice: mu
  rationale: Zaimek odnosi się do rodzaju nijakiego polskiego rzeczownika „pokolenie”; forma „mu” zachowuje to odniesienie bez zbędnego powtarzania rzeczownika.
- source_word: εἰ μὴ
  choice: oprócz
  rationale: W połączeniu z przeczeniem „żaden” wyraz ten naturalnie oddaje wyjątek wyrażony przez grecką konstrukcję.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: znaku proroka Jonasza
  rationale: To naturalny polski szyk, który zachowuje relację dopełniaczową oraz tytuł Jonasza, nie przesądzając, na czym polega sam znak.
theological_decisions:
- issue: Znaczenie określenia „cudzołożne”
  choice: Zachowano w tekście głównym prorocką metaforę „cudzołożne”.
  alternative: niewierne
  rationale: Grecki wyraz może przywoływać zarówno cudzołóstwo w sensie moralnym, jak i przymierzową niewierność wobec Boga. Przekład nie powinien usuwać tej wieloznaczności przez objaśniającą parafrazę.
- issue: Natura „znaku proroka Jonasza”
  choice: Pozostawiono wyrażenie bez objaśniania jego natury w tekście głównym.
  alternative: znak podobny do przeżycia Jonasza
  rationale: Znaczenie tego znaku rozwija dalszy kontekst. Dopowiedzenie interpretacji już w tym wersecie przedwcześnie rozstrzygałoby sens greckiego wyrażenia.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłość wypowiedzi oraz powtórzenie słowa „znak”, obecne w grece. Partykułę δέ oddano przez „zaś”, a drugie καί w kontekście kontrastowym przez naturalne polskie „lecz”.
