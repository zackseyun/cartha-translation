  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: pl
  text: Dobry człowiek z dobrego skarbca wydobywa to, co dobre[a], a zły człowiek ze złego skarbca wydobywa to, co złe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bezpośredni kontekst dotyczy mowy, dlatego „to, co dobre” i „to, co złe” mogą odnosić się zwłaszcza do wypowiadanych słów.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθός / ἀγαθά
  choice: dobry / to, co dobre
  rationale: Zachowano powtórzenie rdzenia oraz wyraźne przeciwstawienie moralne. Rzeczownikowe użycie nijakiej liczby mnogiej oddano naturalnym polskim wyrażeniem „to, co dobre”, bez zawężania sensu do słów lub czynów.
- source_word: ἄνθρωπος
  choice: człowiek
  rationale: „Człowiek” naturalnie oddaje reprezentatywny, ogólny sens greckiej liczby pojedynczej i nie ogranicza wypowiedzi do mężczyzn.
- source_word: θησαυρός
  choice: skarbiec
  rationale: „Skarbiec” zachowuje metaforę nagromadzonego wewnętrznego zasobu, a w połączeniu z czasownikiem „wydobywa” brzmi naturalniej niż „skarb”.
- source_word: ἐκβάλλει
  choice: wydobywa
  rationale: Wybór zachowuje obraz wyprowadzania czegoś z zasobu, nie nadając czasownikowi zbyt gwałtownego znaczenia, jakie mogłoby mieć „wyrzuca”.
- source_word: πονηρός / πονηρά
  choice: zły / to, co złe
  rationale: „Zły” zachowuje mocny sens moralny i równoległość z „dobry / to, co dobre”.
- source_word: ἐκ
  choice: z / ze
  rationale: Polski przyimek naturalnie wskazuje źródło, z którego człowiek wydobywa dobro lub zło.
theological_decisions:
- issue: Zakres wyrażenia „to, co dobre / złe”
  choice: Pozostawiono szerokie określenie obejmujące wszelkie przejawy dobra lub zła.
  alternative: Zawęzić sens do dobrych i złych słów ze względu na bezpośredni kontekst.
  rationale: Greka używa rzeczownikowo przymiotników w liczbie mnogiej, nie dodając rzeczownika „słowa”. Kontekst dotyczy mowy, lecz tekst wersetu pozwala na szerszy sens; dlatego nie rozstrzygnięto tej możliwej wieloznaczności w tekście głównym.
- issue: Charakter moralnego przeciwstawienia
  choice: Oddano przysłowiowe powiązanie między wewnętrznym zasobem człowieka a tym, co z niego wychodzi.
  alternative: Odczytać zdanie jako pełne sformułowanie określonej doktryny antropologicznej.
  rationale: Werset przedstawia obrazową zależność moralną, ale sam nie rozwija jej w kompletny system doktrynalny.
translation_notes:
  register: Współczesny, zrozumiały i godny styl. Równoległa budowa obu części odzwierciedla przysłowiowy rytm greckiego zdania. „Skarbiec” i „wydobywa” zachowują spójność metafory bez nadmiernej dosłowności.
