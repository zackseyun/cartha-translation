id: MAT.12.43
reference: Matthew 12:43
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: pl
  text: Kiedy zaś duch nieczysty wyjdzie z człowieka, przemierza miejsca bezwodne[a], szukając odpoczynku, i go nie znajduje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „miejsca suche”. Greckie słowo oznacza dosłownie miejsca pozbawione wody.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Kiedy zaś
  rationale: „Kiedy” naturalnie wprowadza ogólną sytuację czasową, a „zaś” oddaje łagodne przejście zaznaczone przez δέ bez nadawania mu silnie przeciwstawnego sensu.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: duch nieczysty
  rationale: Tradycyjne i przejrzyste określenie zachowujące związek z biblijnym językiem czystości; grecki tekst mówi o „duchu”, nie używa tu rzeczownika „demon”.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: wyjdzie z człowieka
  rationale: Polska forma dokonana po „kiedy” naturalnie oddaje aoryst trybu łączącego w ogólnym zdaniu czasowym. „Z człowieka” wiernie i idiomatycznie oddaje ἀπὸ τοῦ ἀνθρώπου.
- source_word: διέρχεται
  choice: przemierza
  rationale: Oddaje ruch przez pewien obszar, brzmiąc naturalniej niż dosłowne „przechodzi przez” przed dopełnieniem opisującym miejsca.
- source_word: δι’ ἀνύδρων τόπων
  choice: miejsca bezwodne
  rationale: „Bezwodne” zachowuje konkretny sens greckiego ἄνυδρος, czyli „pozbawiony wody”, zamiast ograniczać obraz do ogólniejszego „suche”.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: szukając odpoczynku
  rationale: Imiesłów zachowuje równoczesność poszukiwania z przemierzaniem miejsc, a „odpoczynek” nie dopowiada bardziej konkretnego „miejsca odpoczynku”.
- source_word: καὶ οὐχ εὑρίσκει
  choice: i go nie znajduje
  rationale: „I” zachowuje prostą łączność καί, natomiast zaimek „go”, wymagany przez naturalną polszczyznę, odnosi się do odpoczynku.
theological_decisions:
- issue: Znaczenie πνεῦμα w kontekście egzorcyzmów
  choice: duch
  alternative: demon
  rationale: Choć w kontekście chodzi o osobowego złego ducha, tekst grecki ma πνεῦμα, a nie δαιμόνιον. Przekład „duch nieczysty” zachowuje własne słownictwo źródła i jego teologiczne niuanse.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Szyk „duch nieczysty” zachowuje utrwalony rejestr biblijny, a „miejsca bezwodne” celowo podtrzymuje konkretny obraz tekstu greckiego. Znacznik przypisu umieszczono przy wyrażeniu, którego przypis dotyczy.
