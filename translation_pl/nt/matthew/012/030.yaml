  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: pl
  text: Kto nie jest ze mną, jest przeciwko mnie, a kto ze mną nie gromadzi, rozprasza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: kto nie jest
  rationale: Grecki rodzajnik z imiesłowem pełni funkcję rzeczownikową i ma sens ogólny. Polskie „kto nie jest” naturalnie oddaje osobę scharakteryzowaną przez brak przynależności do Jezusa, bez archaicznego brzmienia.
- source_word: μετ’ ἐμοῦ
  choice: ze mną
  rationale: μετά z dopełniaczem wyraża tutaj bycie razem z kimś lub opowiedzenie się po jego stronie. „Ze mną” jest bezpośrednie i zachowuje relacyjny charakter wypowiedzi.
- source_word: κατ’ ἐμοῦ
  choice: przeciwko mnie
  rationale: κατά z dopełniaczem oznacza w tym kontekście opozycję. „Przeciwko mnie” jasno i idiomatycznie oddaje ten sens.
- source_word: συνάγων
  choice: gromadzi
  rationale: Imiesłów oznacza zbieranie lub gromadzenie. „Gromadzi” zachowuje zwięzłość oraz możliwe skojarzenia pasterskie lub żniwne, nie rozstrzygając obrazu.
- source_word: σκορπίζει
  choice: rozprasza
  rationale: Czasownik oznacza rozrzucanie lub rozpraszanie. „Rozprasza” tworzy naturalne przeciwieństwo wobec „gromadzi” i zachowuje paralelizm grecki.
- source_word: καὶ
  choice: a
  rationale: Greckie καί łączy dwa równoległe twierdzenia. W języku polskim „a” naturalnie spaja kontrastowo zestawione człony, nie zmieniając ich relacji na silnie przeciwstawną.
theological_decisions:
- issue: Bezwzględny charakter przeciwstawienia dokonanego przez Jezusa
  choice: 'Zachowano stanowcze przeciwstawienie: kto nie jest z Jezusem, jest przeciwko niemu.'
  alternative: Parafraza osłabiająca podział między opowiedzeniem się za Jezusem a sprzeciwem wobec niego.
  rationale: Greka przedstawia dwa kategoryczne, równoległe zdania bez elementu łagodzącego. Przekład zachowuje tę teologiczną ostrość, nie wyprowadzając z niej dodatkowych wniosków doktrynalnych.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Powtórzenie „ze mną” zachowuje nacisk oraz paralelizm oryginału; konstrukcja „kto…” jest naturalna w polskiej sentencji o znaczeniu ogólnym.
