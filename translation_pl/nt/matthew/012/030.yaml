  source_fidelity: Przekład wiernie oddaje oba rzeczownikowo użyte imiesłowy z przeczeniem („kto nie jest”, „kto ... nie gromadzi”), relacje μετά + dopełniacz („ze mną”), κατά + dopełniacz („przeciwko mnie”) oraz antytezę „gromadzi / rozprasza”. Nie osłabia kategorycznego charakteru wypowiedzi ani nie dopowiada obrazu, którego greka nie precyzuje.
  naturalness: Zdanie jest zwięzłe, idiomatyczne i brzmi jak współczesna polska sentencja. Szyk „kto ze mną nie gromadzi” jest poprawny i zachowuje nacisk na „ze mną”; spójnik „a” naturalnie łączy równoległe człony.
  terminology: „Ze mną”, „przeciwko mnie”, „gromadzi” i „rozprasza” są trafne semantycznie oraz tworzą wyraźny paralelizm. Nie występują tu problematyczne nazwy własne ani terminy wymagające dodatkowego objaśnienia.
