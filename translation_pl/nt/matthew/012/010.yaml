  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: pl
  text: 'I oto człowiek z uschniętą ręką. Zapytali Jezusa: „Czy wolno uzdrawiać w szabaty[a]?” — aby go oskarżyć.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać bardziej idiomatycznie: „w szabat”. Grecki tekst ma liczbę mnogą „w szabaty”, co jest częstym sposobem odnoszenia się do dni szabatu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje funkcję narracyjnego zwrócenia uwagi na pojawiającą się postać, a zarazem brzmi naturalnie i dostojnie we współczesnej polszczyźnie.
- source_word: ἄνθρωπος
  choice: człowiek
  rationale: W tym kontekście rzeczownik wskazuje na konkretną osobę płci męskiej; polskie „człowiek” naturalnie oddaje rzeczownik źródłowy bez zbędnego doprecyzowania.
- source_word: χεῖρα ἔχων ξηράν
  choice: z uschniętą ręką
  rationale: Idiomatycznie oddaje konstrukcję imiesłowową. „Uschnięta” zachowuje obraz ξηράν, nie rozstrzygając, czy chodziło o paraliż, zanik mięśni czy inną dolegliwość.
- source_word: ἐπηρώτησαν αὐτόν
  choice: zapytali Jezusa
  rationale: „Zapytali” jest prostym odpowiednikiem czasownika, a imię „Jezusa” jasno wskazuje referenta zaimka na podstawie bezpośredniego kontekstu, zapobiegając chwilowej niejasności po wzmiance o człowieku.
- source_word: ἔξεστι
  choice: czy wolno
  rationale: Naturalny polski zwrot odnoszący się do tego, co jest dozwolone przez prawo religijne.
- source_word: τοῖς σάββασιν
  choice: w szabaty
  rationale: Zachowuje liczbę mnogą tekstu greckiego. Bardziej typowy polski zwrot w liczbie pojedynczej podano w przypisie.
- source_word: θεραπεύειν
  choice: uzdrawiać
  rationale: Dobrze odpowiada bezokolicznikowi czasu teraźniejszego i może wskazywać na czynność ujmowaną ogólnie, co pasuje do pytania o praktykę w dni szabatu.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: aby go oskarżyć
  rationale: Zwięźle zachowuje cel ich pytania oraz oskarżycielski, potencjalnie prawny sens κατηγορέω.
theological_decisions:
- issue: Liczba gramatyczna określenia szabatu w sporze o dopuszczalność uzdrawiania
  choice: w szabaty
  alternative: w szabat
  rationale: Grecki tekst ma celownik liczby mnogiej τοῖς σάββασιν, będący zwyczajowym sposobem mówienia o dniach szabatu. Tekst główny zachowuje liczbę mnogą, a przypis podaje naturalniejszy polski wariant w liczbie pojedynczej, nie zmieniając sensu pytania.
translation_notes:
  register: Współczesny, zrozumiały i godny styl narracyjny. Zachowano zwracające uwagę „oto”, prawnoreligijny sens pytania „czy wolno” oraz źródłową liczbę mnogą „w szabaty”, objaśnioną w przypisie.
