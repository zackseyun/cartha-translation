source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: pl
  text: A jeśli Szatan wyrzuca Szatana, jest podzielony przeciwko samemu sobie. Jak więc ostoi się jego królestwo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Jak więc może się ostać jego królestwo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: A jeśli
  rationale: Zachowuje spójnik καί i warunkowe εἰ, podtrzymując tok argumentacji z poprzedniego zdania.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Szatan
  rationale: Standardowa polska forma imienia/tytułu Σατανᾶς; powtórzenie zachowuje dosadną logikę greckiego zdania.
- source_word: ἐκβάλλει
  choice: wyrzuca
  rationale: Naturalny i utrwalony w polszczyźnie biblijnej odpowiednik w kontekście wypędzania demonów, zachowujący obraz usuwania kogoś siłą.
- source_word: ἐφ’ ἑαυτὸν
  choice: przeciwko samemu sobie
  rationale: Oddaje opozycyjny sens ἐπί z zaimkiem zwrotnym i brzmi naturalnie po polsku.
- source_word: ἐμερίσθη
  choice: podzielił się
  rationale: Oddaje aoryst bierny czasownika μερίζω idiomatyczną polską konstrukcją zwrotną, bez dopowiadania sprawcy podziału.
- source_word: πῶς οὖν
  choice: Jak więc
  rationale: Zachowuje zarówno pytajny charakter πῶς, jak i wynikowy sens οὖν.
- source_word: σταθήσεται
  choice: ostoi się
  rationale: Oddaje przyszłą formę σταθήσεται oraz metaforyczny sens przetrwania i utrzymania się.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: jego królestwo
  rationale: „Królestwo” naturalnie odpowiada βασιλεία w obrazie podzielonego panowania; zaimek zachowuje odniesienie do Szatana.
theological_decisions:
- issue: Sens samopodziału Szatana
  choice: 'Zachowano argument reductio: gdyby Szatan wyrzucał Szatana, pozostawałby w konflikcie z samym sobą, a jego królestwo nie mogłoby się utrzymać.'
  alternative: Można byłoby rozwinąć obraz „domu podzielonego” z poprzedniego wersetu.
  rationale: Sam tekst grecki mówi o podziale Szatana i trwałości jego królestwa; nie wymaga wprowadzania dodatkowego obrazu z kontekstu.
- issue: Aspekt i strona ἐμερίσθη
  choice: „podzielił się”
  alternative: „został podzielony” lub „jest podzielony”
  rationale: Polska forma zwrotna zachowuje możliwość odczytania stanu wewnętrznego rozdarcia, nie narzucając zewnętrznego sprawcy. Przypis nie jest konieczny, ponieważ alternatywy nie zmieniają zasadniczej logiki wypowiedzi.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. „Ostoi się” zachowuje metaforę stania i jest nadal zrozumiałe w pytaniu o trwałość królestwa. Znacznik przypisu [a] umieszczono bezpośrednio po zdaniu, którego dotyczy.
