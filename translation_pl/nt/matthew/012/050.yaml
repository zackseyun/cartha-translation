id: MAT.12.50
reference: Matthew 12:50
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: pl
  text: Bo kto spełnia wolę mojego Ojca, który jest w niebie, ten jest moim bratem, siostrą i matką.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις γὰρ ἂν
  choice: Bo kto
  rationale: Konstrukcja względna z ἄν wyraża ogólny, otwarty warunek; polskie „kto” naturalnie obejmuje każdą osobę. „Bo” zachowuje objaśniający związek z poprzednim kontekstem.
- source_word: ποιήσῃ τὸ θέλημα
  choice: spełnia wolę
  rationale: „Spełniać wolę” jest naturalnym polskim połączeniem i zachowuje sens działania zgodnego z wolą, bez zawężania go do samego posłuszeństwa.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: mojego Ojca, który jest w niebie
  rationale: Oddaje pełną konstrukcję atrybutywną i zachowuje odniesienie do nieba; liczba pojedyncza jest w polszczyźnie naturalna, choć greckie οὐρανοῖς ma formę liczby mnogiej.
- source_word: αὐτός
  choice: ten
  rationale: Zaimek wskazujący podkreśla, że właśnie osoba spełniająca wolę Ojca należy do rodziny Jezusa; zarazem unika sztucznego polskiego zaimka rodzajowego w zdaniu ogólnym.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: bratem, siostrą i matką
  rationale: Zachowano wszystkie trzy pojedyncze określenia rodzinne oraz ich wyrazistą kolejność.
- source_word: ἐστίν
  choice: jest
  rationale: Zachowuje prostą formę łącznika w czasie teraźniejszym.
theological_decisions:
- issue: Rodzaj gramatyczny w ogólnym stwierdzeniu
  choice: kto ... ten jest moim bratem, siostrą i matką
  alternative: ktokolwiek ... on jest moim bratem, siostrą i matką
  rationale: Greckie ὅστις i αὐτός mają rodzaj męski, lecz pełnią funkcję ogólną. Polskie „kto ... ten” również ma formalnie męską postać składniową, a zarazem naturalnie odnosi się do każdej osoby. Wymienienie „siostry” i „matki” jasno zachowuje zakres obejmujący obie płcie.
- issue: Charakter więzi rodzinnej z Jezusem
  choice: jest moim bratem, siostrą i matką
  alternative: jest dla mnie jak brat, siostra i matka
  rationale: Nie dodano porównawczego „jak”, którego nie ma w tekście. Dzięki temu pozostaje pełna siła wypowiedzi Jezusa i jej teologiczne napięcie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Spełnia wolę” brzmi naturalnie w polszczyźnie biblijnej bez nadmiernej archaizacji. Szyk „kto..., ten...” jasno przekazuje ogólny warunek i nacisk obecny w αὐτός.
