review_pass:
  verdict: approve
  source_fidelity: 'Tekst wiernie oddaje grecką konstrukcję ogólną ὅστις γὰρ ἂν („Bo kto”), czasownik ποιήσῃ z τὸ θέλημα („spełnia wolę”) oraz emfatyczne αὐτός przez korelat „ten”. Zachowano trzy pojedyncze określenia rodzinne w kolejności źródłowej: „bratem, siostrą i matką”. „Mojego Ojca, który jest w niebie” jest poprawnym, naturalnym rozwinięciem greckiego określenia „mojego Ojca w niebiosach”; polskie „w niebie” jest tu idiomatyczne i nie zmienia sensu.'
  naturalness: Brzmienie jest współczesne, jasne i godne. Konstrukcja „kto ..., ten ...” jest w polszczyźnie naturalnym sposobem wyrażenia ogólnego podmiotu i właściwie przenosi nacisk. Zestawienie „bratem, siostrą i matką” celowo zachowuje niecodzienną, mocną formę oryginału, więc nie należy go wygładzać przez dodanie „jak” ani przez parafrazę.
  terminology: „Wola”, „Ojciec”, „brat”, „siostra” i „matka” są trafnymi, utrwalonymi odpowiednikami. „Spełnia wolę” jest idiomatyczne i nie zawęża ποιεῖν do samego posłuszeństwa. Formalnie męskie „ten” ma w tym zdaniu zakres ogólny, a wyraźne „siostrą i matką” zachowuje inkluzywny zakres predykatu.
