  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: pl
  text: Wtedy idzie i zabiera ze sobą siedem innych duchów, bardziej złych niż on[a]. Wchodzą one i mieszkają tam, a końcowy stan tego człowieka staje się gorszy niż początkowy[b]. Tak samo będzie z tym złym pokoleniem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „siedem różnych duchów, bardziej niegodziwych niż on”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „ostatnie rzeczy tego człowieka stają się gorsze od pierwszych”; jest to idiom oznaczający, że jego końcowy stan jest gorszy od wcześniejszego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący kolejny etap opisywanych wydarzeń.
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: idzie i zabiera ze sobą
  rationale: Oddaje żywą narrację w czasie teraźniejszym oraz sens zabrania innych duchów jako towarzyszy.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: siedem innych duchów
  rationale: „Innych” wskazuje przede wszystkim na duchy dodatkowe, bez niepotrzebnego podkreślania odmienności ich rodzaju.
- source_word: πονηρότερα ἑαυτοῦ
  choice: gorszych od siebie
  rationale: W tym kontekście „gorszych” naturalnie wyraża większą niegodziwość duchów i zachowuje stopień wyższy.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Wchodzą one i mieszkają tam
  rationale: Imiesłów odnoszący się do duchów zostaje oddany zdaniem osobowym; liczba mnoga wynika z sensu kontekstu, mimo osobliwej liczby pojedynczej czasownika κατοικεῖ w tekście greckim.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: końcowy stan tego człowieka staje się gorszy niż początkowy
  rationale: Grecki idiom przeciwstawia końcowe położenie człowieka jego stanowi wcześniejszemu; polskie sformułowanie przekazuje ten sens jasno i zwięźle.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Tak samo będzie z tym złym pokoleniem
  rationale: Oddaje zastosowanie wcześniejszego obrazu do obecnego pokolenia oraz zachowuje jego jednoznacznie negatywną ocenę.
theological_decisions:
- issue: Określenie istot demonicznych słowem πνεύματα
  choice: duchy
  alternative: demony
  rationale: Tekst grecki mówi o „duchach”, a kontekst poprzedniego zdania wskazuje, że chodzi o duchy nieczyste. Zachowanie rzeczownika „duchy” nie wprowadza terminu bardziej szczegółowego niż źródło.
- issue: Oddanie τοῦ ἀνθρώπου ἐκείνου
  choice: tego człowieka
  alternative: tej osoby
  rationale: „Człowiek” jest naturalnym i wiernym odpowiednikiem ἄνθρωπος w jednostkowym przykładzie, bez zawężania sensu wyłącznie do mężczyzny.
- issue: Liczba czasownika κατοικεῖ po mnogim εἰσελθόντα
  choice: mieszkają
  alternative: mieszka
  rationale: Liczba mnoga jasno wiąże wejście i zamieszkanie z siedmioma duchami oraz pierwszym duchem działającymi razem. Zachowuje sens zdania, nie budując wykładni teologicznej na osobliwej składni.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano żywy czas teraźniejszy opowiadania. „Mieszkają tam” brzmi naturalniej niż podniosłe „zamieszkują”, a „pokolenie” utrzymuje biblijny sens γενεά bez archaizacji.
