- from: 'Wtedy mówi do tego człowieka: „Wyciągnij rękę”. On ją wyciągnął, a ręka została przywrócona do zdrowia[a] — zdrowa jak druga[b].'
  to: 'Wtedy mówi do tego człowieka: „Wyciągnij rękę”. On ją wyciągnął, a ręka została przywrócona do zdrowia i była zdrowa jak druga[a].'
  rationale: Usunięto niezręczny myślnik i połączono dwa dotychczasowe przypisy, ponieważ po korekcie jedynym oznaczonym miejscem jest końcowy zespół opisujący zarówno przywrócenie ręki, jak i jej stan zdrowia. Pełne „była zdrowa jak druga” naturalnie oddaje greckie ὑγιὴς ὡς ἡ ἄλλη, a „została przywrócona do zdrowia” zachowuje bierny i restytucyjny sens ἀπεκατεστάθη.
