base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: pl
  text: 'Wtedy mówi do tego człowieka: „Wyciągnij rękę”. On ją wyciągnął, a ręka została przywrócona do zdrowia i była zdrowa jak druga[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „zdrowa jak druga”; „druga” oznacza drugą rękę tego człowieka. Można też przetłumaczyć: „została uzdrowiona”; grecki czasownik podkreśla przywrócenie do właściwego stanu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wskazującego kolejność wydarzeń.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy historyczny i żywość narracji Mateusza.
- source_word: τῷ ἀνθρώπῳ
  choice: do tego człowieka
  rationale: Ἄνθρωπος oznacza tu konkretną osobę; kontekst wskazuje na mężczyznę, lecz „człowiek” najbliżej odpowiada greckiemu rzeczownikowi.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Wyciągnij rękę
  rationale: Bezpośredni i naturalny nakaz; χείρ w tym kontekście oznacza rękę.
- source_word: ἐξέτεινεν
  choice: On ją wyciągnął
  rationale: Powtarza czasownik z polecenia, a zaimek jasno odnosi się do ręki.
- source_word: ἀπεκατεστάθη
  choice: została przywrócona do zdrowia
  rationale: Zachowuje stronę bierną oraz nacisk czasownika na przywrócenie właściwego stanu, nie tylko ogólne uzdrowienie.
- source_word: ὑγιὴς
  choice: zdrowa
  rationale: Oddaje stan zdrowia i sprawności wyrażony przez grecki przymiotnik.
- source_word: ὡς ἡ ἄλλη
  choice: jak druga
  rationale: Forma żeńska domyślnie odnosi się do drugiej ręki; polszczyzna pozwala zachować to samo niedopowiedzenie.
theological_decisions:
- issue: Charakter opisu uzdrowienia
  choice: Ręka została przywrócona do zdrowia
  alternative: Ręka została uzdrowiona
  rationale: Wybrane sformułowanie odzwierciedla przywrócenie ręki do właściwego stanu, nie dodając interpretacji doktrynalnej do prostego opisu cudu.
translation_notes:
  register: Współczesna, godna i przejrzysta polszczyzna. Zachowano teraźniejszy czas historyczny w słowie „mówi” oraz zwięzłość narracji. Myślnik ułatwia odczytanie końcowego określenia stanu ręki bez usuwania jego greckiej składni porównawczej.
