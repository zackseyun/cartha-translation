base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: pl
  text: 'On zaś powiedział im: „Czy nie czytaliście, co uczynił Dawid, gdy on i ci, którzy z nim byli, byli głodni[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „gdy zgłodniał i ci, którzy z nim byli”. Grecki czasownik „zgłodniał” ma liczbę pojedynczą i formalnie odnosi się do Dawida; w tej eliptycznej konstrukcji głód może jednak obejmować także osoby, które z nim były.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: On zaś im odpowiedział
  rationale: δέ łagodnie przeciwstawia odpowiedź Jezusa wcześniejszemu zarzutowi. W tym kontekście naturalne polskie „odpowiedział” oddaje funkcję εἶπεν αὐτοῖς, choć dosłownie znaczy ono „powiedział im”.
- source_word: Οὐκ ἀνέγνωτε
  choice: Czy nie czytaliście
  rationale: Polskie pytanie retoryczne naturalnie odwołuje się do wcześniejszej lektury Pisma i zachowuje zarzucający ton greckiej konstrukcji.
- source_word: τί ἐποίησεν
  choice: co zrobił
  rationale: Prosty, historyczny sens ποιέω nie wymaga rozwinięcia.
- source_word: Δαυὶδ
  choice: Dawid
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: ὅτε ἐπείνασεν
  choice: gdy był głodny
  rationale: πεινάω oznacza odczuwać głód; ta forma jest naturalna we współczesnej polszczyźnie i nie przecenia aspektu czasownika.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: a także ci, którzy z nim byli
  rationale: Oddaje dosłownie grupę osób będących z Dawidem, nie określając bliżej ich relacji jako uczniów czy towarzyszy.
theological_decisions:
- issue: Czy wzmianka o głodzie odnosi się wyłącznie do Dawida, czy także do osób będących z nim
  choice: Tekst główny zachowuje liczbę pojedynczą przy Dawidzie, a przez elipsę obejmuje głodem również osoby będące z nim.
  alternative: „gdy on i ci, którzy z nim byli, zgłodnieli”
  rationale: Grecki czasownik ἐπείνασεν ma liczbę pojedynczą i wyraźnie odnosi się do Dawida, lecz następujące καὶ οἱ μετ’ αὐτοῦ może dołączać pozostałych jako podmiot domyślnego orzeczenia. Przypis zachowuje tę rzeczywistą możliwość składniową.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Pytanie zachowuje retoryczny charakter odwołania do Pisma; myślnik pomaga czytelnie oddać grecką elipsę bez jej nadmiernego rozstrzygania.
