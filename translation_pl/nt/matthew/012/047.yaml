  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: pl
  text: 'Wtedy ktoś powiedział mu[a]: „Spójrz, twoja matka i twoi bracia stoją na zewnątrz i chcą z tobą porozmawiać”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy pomijają ten werset.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Wtedy ktoś powiedział mu
  rationale: δέ jest łagodnym spójnikiem narracyjnym; „wtedy” naturalnie wskazuje dalszy ciąg wydarzeń, a τις pozostaje nieokreślone jako „ktoś”.
- source_word: Ἰδοὺ
  choice: Spójrz
  rationale: Wyraz pełni funkcję wezwania do zwrócenia uwagi; „spójrz” zachowuje tę funkcję we współczesnej polszczyźnie bez archaizacji.
- source_word: ἡ μήτηρ σου
  choice: twoja matka
  rationale: Bezpośrednio oddaje zwykłe znaczenie rzeczownika i konstrukcji dzierżawczej.
- source_word: οἱ ἀδελφοί σου
  choice: twoi bracia
  rationale: W tym kontekście ἀδελφοί oznacza męskich członków rodziny; „bracia” zachowuje rodzaj i nie rozstrzyga ponad tekst dokładnego charakteru pokrewieństwa.
- source_word: ἔξω ἑστήκασιν
  choice: stoją na zewnątrz
  rationale: Perfectum ἵστημι wyraża obecny stan po zajęciu miejsca; polskie „stoją” oddaje go naturalnie, a „na zewnątrz” zachowuje ἔξω.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: chcą z tobą porozmawiać
  rationale: W tym kontekście ζητέω z bezokolicznikiem idiomatycznie wyraża zamiar lub pragnienie. „Porozmawiać z tobą” brzmi naturalniej po polsku niż dosłowne „szukają, aby mówić do ciebie”, zachowując sens wypowiedzi skierowanej do Jezusa.
theological_decisions:
- issue: Status tekstualny Mt 12,47
  choice: Włączyć werset do tekstu głównego zgodnie z podanym tekstem SBLGNT i zaznaczyć wariant w przypisie.
  alternative: Pominąć werset, ponieważ nie występuje w części rękopisów.
  rationale: Podane źródło zawiera ten werset w nawiasach krytycznych. Zachowanie go w tekście wraz z przejrzystą notą pozwala oddać źródło bez przemilczania istotnego wariantu.
- issue: Znaczenie οἱ ἀδελφοί
  choice: twoi bracia
  alternative: twoi krewni
  rationale: Najzwyklejszym i formalnie najbliższym odpowiednikiem jest „bracia”. Tłumaczenie nie powinno samo rozstrzygać sporów o dokładną relację rodzinną przez zastąpienie tego słowa szerszym określeniem.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. „Spójrz” zachowuje funkcję ἰδού bez archaicznego „oto”; szyk zdania jest naturalny dla nowoczesnej polszczyzny.
