  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: pl
  text: Oto mój sługa, którego wybrałem, mój umiłowany, w którym moja dusza znalazła upodobanie[a]. Położę na nim mojego Ducha, a on ogłosi sprawiedliwość[b] narodom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „w którym moja dusza ma upodobanie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „sąd”.'
    reason: lexical_alternative
  - marker: c
    text: 'Można też: „poganom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Zachowuje podniosłe, prorockie wezwanie do uwagi, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: παῖς
  choice: sługa
  rationale: W kontekście cytatu z Pieśni o Słudze słowo oznacza sługę; ten wybór zachowuje więź z Księgą Izajasza i nie wprowadza w tym miejscu niewyrażonego wprost określenia „syn”.
- source_word: ᾑρέτισα
  choice: wybrałem
  rationale: Polski czas przeszły naturalnie oddaje dokonany akt Bożego wyboru.
- source_word: ὁ ἀγαπητός μου
  choice: mój umiłowany
  rationale: „Umiłowany” zachowuje osobisty, pełen godności język Bożej miłości.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: w którym moja dusza znalazła upodobanie
  rationale: Zachowuje wyraźny podmiot „moja dusza” oraz sens życzliwego upodobania, nie spłaszczając idiomu do samego „mam w nim upodobanie”.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Złożę na nim mojego Ducha
  rationale: Oddaje prorocki obraz umieszczenia Ducha na wybranym słudze. Wielka litera wskazuje, że chodzi o Ducha Bożego.
- source_word: κρίσιν
  choice: sprawiedliwość
  rationale: W kontekście misji Sługi wobec narodów słowo wskazuje na Boży sprawiedliwy porządek; możliwe znaczenie „sąd” zachowano w przypisie.
- source_word: τοῖς ἔθνεσιν
  choice: narodom
  rationale: Oddaje szeroki, uniwersalny zakres ἔθνη i dobrze odpowiada kontekstowi proroctwa Izajasza; wariant „poganom” podano w przypisie.
- source_word: ἀπαγγελεῖ
  choice: ogłosi
  rationale: Wyraża publiczne, autorytatywne oznajmienie właściwe wypowiedzi prorockiej.
theological_decisions:
- issue: Tożsamość mesjańskiego Sługi w słowie παῖς
  choice: „sługa” zgodnie z kontekstem cytatu z Izajasza
  alternative: „dziecko” lub „syn”
  rationale: „Sługa” zachowuje starotestamentowy kontekst i rolę Jezusa przedstawioną w tym cytacie, bez przenoszenia na to konkretne słowo innego akcentu chrystologicznego.
- issue: Znaczenie κρίσις w opisie misji wobec narodów
  choice: „sprawiedliwość” w tekście głównym
  alternative: „sąd”
  rationale: „Sprawiedliwość” najlepiej oddaje tutaj zapowiedź ustanowienia i obwieszczenia Bożego sprawiedliwego ładu, natomiast przypis zachowuje rzeczywistą możliwość znaczenia „sąd”.
translation_notes:
  register: Rejestr jest współczesny, podniosły i czytelny. Zachowano prorocki charakter cytatu oraz dosłowne „moja dusza”, unikając zarówno archaizmów, jak i wyznaniowo nacechowanych dopowiedzeń.
