source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: pl
  text: O ileż więc cenniejszy jest człowiek od owcy! Tak więc wolno w szabat czynić dobro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w szabaty”. Grecka liczba mnoga jest częstym idiomem odnoszącym się do szabatu lub jego przestrzegania.'
    reason: source_form
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: O ileż więc
  rationale: Oddaje retoryczne porównanie od mniejszego do większego oraz wynikowy charakter οὖν; partykuła „-ż” naturalnie wzmacnia polskie pytanie retoryczne.
- source_word: διαφέρει
  choice: jest cenniejszy
  rationale: W tym kontekście czasownik wskazuje nie na samą odmienność, lecz na większą wartość człowieka w porównaniu z owcą.
- source_word: ἄνθρωπος
  choice: człowiek
  rationale: Polskie „człowiek” zachowuje liczbę pojedynczą i reprezentatywny, ogólnoludzki sens rzeczownika.
- source_word: προβάτου
  choice: od owcy
  rationale: Dopełniacz wyraża człon porównania; konstrukcja „cenniejszy od owcy” jest naturalna po polsku.
- source_word: ὥστε
  choice: Tak więc
  rationale: Wprowadza wniosek wynikający z wcześniejszego porównania.
- source_word: ἔξεστιν
  choice: wolno
  rationale: Zwięzłe i naturalne polskie określenie tego, co jest dozwolone przez prawo; pasuje do sporu o szabat.
- source_word: τοῖς σάββασιν
  choice: w szabat
  rationale: Grecka liczba mnoga jest typowym idiomem odnoszącym się do szabatu lub jego przestrzegania; polska liczba pojedyncza brzmi naturalnie, a forma źródłowa została objaśniona w przypisie.
- source_word: καλῶς ποιεῖν
  choice: czynić dobrze
  rationale: 'Zachowuje zwięzłość i możliwą szerszą wymowę greckiego zwrotu: wykonywać dobro lub postępować dobrze.'
theological_decisions:
- issue: Zakres porównania człowieka z owcą
  choice: człowiek jest cenniejszy od owcy
  alternative: człowiek przewyższa owcę
  rationale: Kontekst wskazuje na względną wartość, lecz przekład nie rozwija tej wypowiedzi w dodatkową doktrynalną tezę o naturze człowieka.
- issue: Liczba mnoga w określeniu szabatu
  choice: w szabat
  alternative: w szabaty
  rationale: W grece liczba mnoga może pełnić funkcję idiomatyczną. Naturalny polski przekład używa liczby pojedynczej, a przypis zachowuje przejrzystość względem formy źródłowej.
- issue: Znaczenie καλῶς ποιεῖν
  choice: czynić dobrze
  alternative: czynić dobro
  rationale: „Czynić dobrze” zachowuje zarówno możliwość dobroczynnego działania, jak i właściwego postępowania, bez niepotrzebnego zawężania sensu.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Wykrzyknik oddaje siłę pytania retorycznego. Szyk końcowy podkreśla kontekst szabatu, nie brzmiąc archaicznie.
