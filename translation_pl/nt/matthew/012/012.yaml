  naturalness: „O ileż więc cenniejszy jest człowiek od owcy!” ma bardziej naturalny polski szyk retorycznego pytania niż konstrukcja z orzeczeniem „człowiek jest cenniejszy”. „Czynić dobro” jest w tym kontekście wyraźniejsze i idiomatyczniejsze niż „czynić dobrze”, które po polsku może znaczyć wykonywać coś w dobry sposób.
  terminology: „Człowiek”, „owca”, „szabat” i „wolno” są trafne, współczesne i odpowiednie dla rejestru sporu o dozwolone działanie w szabat. „Czynić dobro” najlepiej oddaje καλῶς ποιεῖν jako dobroczynne, właściwe działanie, bez dodawania interpretacji.
