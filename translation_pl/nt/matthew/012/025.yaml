review_pass:
  verdict: revise
  source_fidelity: Pierwsza część wiernie oddaje εἰδὼς δὲ τὰς ἐνθυμήσεις αὐτῶν, nie rozstrzygając sposobu, w jaki Jezus znał ich myśli. „Wewnętrznie podzielone” trafnie przekazuje μερισθεῖσα καθ’ ἑαυτῆς, a „popada w ruinę” jest dopuszczalnym, naturalnym oddaniem ἐρημοῦται. W drugiej części należy jednak zachować indywidualny, przysłowiowy paralelizm greckiego „każde miasto lub dom ... nie ostoi się”, zamiast przekształcać go w konstrukcję zbiorczą z zaimkiem względnym.
  naturalness: 'Tekst jest zasadniczo współczesny i godny. Konstrukcja „żadne miasto ani żaden dom, w których panuje...” jest mniej przejrzysta: liczba mnoga zaimka i orzeczenia zaciera fakt, że sentencja dotyczy osobno każdego miasta lub domu. Konstrukcja „każde miasto lub dom ... nie ostoi się” jest równie naturalna i lepiej zachowuje rytm oraz składnię wypowiedzi.'
  terminology: „Myśli”, „królestwo”, „miasto” i „dom” są właściwe. Przypis do „domu” trafnie sygnalizuje możliwy sens gospodarstwa domowego/rodziny bez narzucania go w tekście głównym. „Nie ostoi się” dobrze oddaje idiomatyczne οὐ σταθήσεται.
