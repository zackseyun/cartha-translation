    rationale: Greckie πᾶσα πόλις ἢ οἰκία ... οὐ σταθήσεται mówi o każdym pojedynczym mieście albo domu. Wersja „żadne miasto ani żaden dom, w których panuje ... nie ostoją się” używa liczby mnogiej i dodaje opis „panuje”, przez co mniej bezpośrednio oddaje strukturę oryginału.
