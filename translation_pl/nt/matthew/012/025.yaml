id: MAT.12.25
reference: Matthew 12:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: pl
  text: 'Znając jednak ich myśli[a], powiedział im: „Każde królestwo wewnętrznie podzielone popada w ruinę[b], a każde miasto lub dom[c], wewnętrznie podzielone, nie ostoi się”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „rozważania” lub „zamiary”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „pustoszeje” lub „zostaje spustoszone”.'
    reason: lexical_alternative
  - marker: c
    text: Greckie słowo oznaczające „dom” może tutaj odnosić się także do rodziny lub domowników.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: znając
  rationale: Imiesłów wyraża wiedzę lub świadomość Jezusa, nie określając sposobu, w jaki ją uzyskał.
- source_word: δὲ
  choice: jednak
  rationale: Oddaje łagodne przejście z odcieniem kontrastu właściwe δέ w tym kontekście.
- source_word: ἐνθυμήσεις
  choice: myśli
  rationale: Naturalny, szeroki odpowiednik obejmujący wewnętrzne rozważania i zamiary; alternatywy zachowano w przypisie.
- source_word: Πᾶσα βασιλεία
  choice: Każde królestwo
  rationale: Zachowuje uniwersalny, przysłowiowy charakter wypowiedzi.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: wewnętrznie podzielone
  rationale: Naturalnie oddaje podział skierowany przeciw własnej jedności, bez niezręcznego polskiego sformułowania „podzielone przeciwko sobie”.
- source_word: ἐρημοῦται
  choice: popada w ruinę
  rationale: Oddaje proces lub rezultat spustoszenia i rozpadu, zachowując powagę obrazu.
- source_word: πόλις ἢ οἰκία
  choice: miasto ani dom
  rationale: W polskim zdaniu przeczącym konstrukcja „żadne… ani…” naturalnie oddaje greckie powszechne twierdzenie „każde… lub…”. Wieloznaczność οἰκία zaznaczono w przypisie.
- source_word: οὐ σταθήσεται
  choice: nie ostoją się
  rationale: Idiomaticzne polskie wyrażenie oznaczające, że nie przetrwają ani nie zachowają trwałości; liczba mnoga wynika z połączonych podmiotów „miasto” i „dom”.
theological_decisions:
- issue: Sposób, w jaki Jezus znał ich myśli
  choice: Tekst stwierdza jedynie, że Jezus znał ich myśli.
  alternative: Doprecyzowanie, że była to nadprzyrodzona wszechwiedza, prorocze poznanie albo wniosek z okoliczności.
  rationale: Grecki tekst nie wyjaśnia mechanizmu tej wiedzy, dlatego przekład nie rozstrzyga tej kwestii teologicznej.
translation_notes:
  register: Współczesny, godny i przysłowiowy styl. Konstrukcję drugiej części zdania lekko przeformułowano dla poprawnej, naturalnej polszczyzny, zachowując uniwersalność oraz paralelizm królestwa, miasta i domu.
