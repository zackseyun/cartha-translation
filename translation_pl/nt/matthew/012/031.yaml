  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: pl
  text: 'Dlatego mówię wam: każdy grzech i każde bluźnierstwo zostaną ludziom przebaczone, ale bluźnierstwo przeciwko Duchowi[a] nie zostanie przebaczone.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „przeciwko Duchowi Świętemu”. Z kontekstu wynika, że chodzi o Ducha Świętego, choć w tym wersecie tekst grecki zawiera tylko „Ducha”, bez „Świętego”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dlatego
  rationale: Naturalnie wyraża wniosek wynikający z poprzedzającego kontekstu.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Zachowuje bezpośredni, uroczysty charakter formuły, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: każdy grzech i każde bluźnierstwo
  rationale: Powtórzenie „każde” odpowiada dystrybutywnej sile πᾶσα i uwzględnia różny rodzaj gramatyczny polskich rzeczowników.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: zostaną ludziom przebaczone
  rationale: Zachowuje bierną konstrukcję oraz celownik odbiorcy przebaczenia; szyk jest poprawny i godny we współczesnej polszczyźnie.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ale bluźnierstwo przeciwko Duchowi
  rationale: Dopełniacz wskazuje tu najnaturalniej na obiekt bluźnierstwa. „Duchowi” zachowuje brzmienie tego wersetu bez dopowiadania przymiotnika „Świętemu”.
- source_word: οὐκ ἀφεθήσεται
  choice: nie zostanie przebaczone
  rationale: Oddaje przyszłą stronę bierną i zachowuje ścisły kontrast z pierwszą częścią zdania.
theological_decisions:
- issue: Czy πνεύματος oddać jako „Duchowi”, czy „Duchowi Świętemu”
  choice: Duchowi
  alternative: Duchowi Świętemu
  rationale: W tym wersecie tekst grecki zawiera jedynie πνεύματος, bez ἁγίου. Kontekst jasno wskazuje na Ducha Świętego, lecz tekst główny zachowuje niedopowiedziane brzmienie źródła, a objaśnienie podaje przypis.
- issue: Relacja dopełniacza τοῦ πνεύματος do βλασφημία
  choice: bluźnierstwo przeciwko Duchowi
  alternative: bluźnierstwo Ducha
  rationale: Kontekst wymaga rozumienia dopełniacza jako wskazującego obiekt bluźnierstwa, nie jego sprawcę ani właściciela.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano paralelizm strony biernej obu członów oraz źródłową zwięzłość. Marker [a] umieszczono bezpośrednio przy słowie, którego dotyczy przypis.
