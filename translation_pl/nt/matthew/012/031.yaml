  naturalness: Polszczyzna jest współczesna, poprawna i odpowiednio podniosła. Szyk „zostaną ludziom przebaczone” jest nieco bardziej formalny, lecz naturalny w rejestrze przekładu biblijnego i dobrze zachowuje paralelizm obu członów.
  terminology: '„Grzech”, „bluźnierstwo”, „przebaczone” oraz „Duch” są trafne i konsekwentne. Przypis wymaga jedynie zmiany formuły: „To znaczy” przedstawia identyfikację jako definicyjnie wyrażoną w samym wersecie, podczas gdy „Święty” nie występuje w jego greckim brzmieniu. Ponadto informację o grece należy sformułować z uwzględnieniem greckiego dopełniacza („Ducha”), nie polskiego celownika wymaganego przez „przeciwko”.'
