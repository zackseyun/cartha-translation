base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: pl
  text: Albo uczyńcie[b] drzewo dobrym i jego owoc dobrym, albo uczyńcie drzewo zepsutym[a] i jego owoc zepsutym, bo drzewo poznaje się po jego owocu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie σαπρός może znaczyć „zgniły”, „zepsuty”, „marny” lub „bezwartościowy”.
    reason: lexical_alternative
  - marker: b
    text: 'Powtórzone „uczyńcie” ma formę trybu rozkazującego, lecz w tym retorycznym zestawieniu może też znaczyć: „uznajcie” albo „przyjmijcie, że”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: uczyńcie
  rationale: Aorystowy tryb rozkazujący liczby mnogiej oddano bezpośrednio jako „uczyńcie”, zachowując równoległość i retoryczną ostrość wypowiedzi. W kontekście możliwy jest sens „uznajcie” lub „przyjmijcie, że”, dlatego zaznaczono go w przypisie.
- source_word: δένδρον
  choice: drzewo
  rationale: Naturalny i bezpośredni polski odpowiednik, zachowujący główny obraz metafory.
- source_word: καλός
  choice: dobry
  rationale: „Dobry” zachowuje zarówno znaczenie jakościowe, jak i możliwy wydźwięk moralny; „zdrowy” nadmiernie zawężałby sens.
- source_word: καρπός
  choice: owoc
  rationale: Utrwalony i naturalny odpowiednik, który wiernie zachowuje metaforę źródłową.
- source_word: σαπρός
  choice: zepsuty
  rationale: Greckie słowo może oznaczać coś zgniłego, zepsutego, marnego lub bezwartościowego. „Zepsuty” brzmi naturalnie zarówno przy drzewie, jak i jego owocu, nie zawężając obrazu wyłącznie do rozkładu fizycznego.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: bo ... po jego owocu
  rationale: γάρ oddano jako „bo”, natomiast ἐκ idiomatycznym polskim zwrotem „poznaje się po”, wskazującym podstawę rozpoznania.
- source_word: γινώσκεται
  choice: poznaje się
  rationale: Polska konstrukcja bezosobowa naturalnie oddaje grecką stronę bierną i sens rozpoznawania drzewa na podstawie owocu.
- source_word: αὐτοῦ
  choice: jego
  rationale: Zaimek odnosi się do drzewa; „jego owoc” jest poprawnym i naturalnym polskim odpowiednikiem.
theological_decisions:
- issue: Siła trybów rozkazujących w metaforze Jezusa
  choice: 'Zachowano bezpośrednie tryby rozkazujące: „uczyńcie drzewo…”'
  alternative: „Uznajcie drzewo za dobre…” albo konstrukcja warunkowa
  rationale: Tekst grecki dwukrotnie używa trybu rozkazującego. Choć wypowiedź może mieć retoryczny sens nakazujący konsekwentnie ocenić lub określić drzewo, zachowanie formy rozkazującej nie rozstrzyga tej napiętej kwestii za czytelnika.
- issue: Zakres metafory słowa σαπρός
  choice: „zepsuty”
  alternative: „zgniły”, „zły” lub „bezwartościowy”
  rationale: „Zepsuty” pozwala zachować zarówno żywy obraz wadliwego drzewa i owocu, jak i szerszy sens jakościowej lub moralnej nieprzydatności, bez wprowadzania szczególnej doktrynalnej interpretacji.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano wyrazisty paralelizm dwóch członów oraz bezpośredni tryb rozkazujący tekstu greckiego. Konstrukcja „drzewo poznaje się po jego owocu” jest naturalna w polszczyźnie i bliska strukturze źródłowej.
