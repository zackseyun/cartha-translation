  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: pl
  text: A odszedłszy stamtąd, udał się do ich synagogi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: A
  rationale: Zachowuje prostą funkcję łączącą z poprzednią sceną, bez dodawania wyraźniejszego następstwa czasowego.
- source_word: μεταβὰς
  choice: odszedłszy
  rationale: Imiesłów uprzedni oddaje aorystyczny imiesłów μεταβαίνω oraz ruch z poprzedniego miejsca.
- source_word: ἐκεῖθεν
  choice: stamtąd
  rationale: Naturalny i bezpośredni odpowiednik przysłówka miejsca oznaczającego punkt wyjścia.
- source_word: ἦλθεν
  choice: przyszedł
  rationale: Podstawowy odpowiednik ἔρχομαι; w polskiej narracji brzmi naturalnie przy wskazaniu miejsca, do którego Jezus przybywa.
- source_word: εἰς τὴν συναγωγὴν
  choice: do synagogi
  rationale: Polskie „do” z dopełniaczem naturalnie wyraża ruch do wnętrza miejsca; dosłowne „w synagogę” byłoby nienaturalne.
- source_word: συναγωγὴν
  choice: synagogi
  rationale: Utrwalona i precyzyjna nazwa żydowskiego miejsca zgromadzeń i kultu.
- source_word: αὐτῶν
  choice: ich
  rationale: Zachowuje nieokreślone odniesienie zaimka bez dopowiadania, do jakiej dokładnie grupy należała synagoga.
theological_decisions:
- issue: Odniesienie wyrażenia „ich synagoga”
  choice: ich synagogi
  alternative: synagogi należącej do nich / ich miejsca zgromadzeń
  rationale: Greka nie określa bliżej referenta αὐτῶν ani nie nadaje temu sformułowaniu jawnie polemicznego sensu, dlatego przekład zachowuje jego neutralność i niejednoznaczność.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Konstrukcja „odszedłszy” jest nieco podniosła, lecz nadal zrozumiała i pozwala zachować składniową relację greckiego imiesłowu do czasownika głównego.
