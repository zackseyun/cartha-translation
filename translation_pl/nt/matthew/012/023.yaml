id: MAT.12.23
reference: Matthew 12:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: pl
  text: 'I wszystkie tłumy zdumiewały się i mówiły: „Czyżby to był Syn Dawida?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Syn Dawida” to tytuł mesjański, odnoszący się do obiecanego królewskiego wybawiciela z rodu Dawida.
    reason: cross_reference
  - marker: b
    text: 'Można też oddać moc pytania bardziej dosłownie: „To chyba nie jest Syn Dawida?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: zdumiewały się
  rationale: Czasownik oddaje silne zdumienie, a imperfectum wskazuje na trwającą reakcję tłumów. Forma „zdumiewały się” zachowuje oba te elementy i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: πάντες οἱ ὄχλοι
  choice: wszystkie tłumy
  rationale: Zachowano zarówno πάντες („wszystkie”), jak i liczbę mnogą rzeczownika ὄχλοι („tłumy”), mimo że bardziej idiomatyczne „wszyscy ludzie” byłoby mniej formalnie zgodne ze źródłem.
- source_word: ἔλεγον
  choice: mówiły
  rationale: Imperfectum przedstawia wypowiedź jako trwającą lub powtarzaną. Polskie „mówiły” naturalnie współgra z równoległym „zdumiewały się”, bez nadmiernego doprecyzowania typu „powtarzały”.
- source_word: Μήτι
  choice: Czyżby
  rationale: Partykuła μήτι zazwyczaj wprowadza pytanie, w którym spodziewana jest odpowiedź przecząca, lecz tutaj zarazem wyraża pełne zdumienia wahanie. „Czyżby” zachowuje tę niepewność bez przekształcania pytania w stanowcze zaprzeczenie.
- source_word: οὗτός
  choice: to
  rationale: W polskim pytaniu identyfikującym osobę konstrukcja „Czyżby to był...” jest naturalniejsza niż „Czyżby ten był...”, a wskazanie na Jezusa pozostaje jasne.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Syn Dawida
  rationale: Zachowano utrwalony tytuł mesjański w jego dosłownej postaci, zamiast zastępować go interpretacyjnym określeniem „Mesjasz”.
theological_decisions:
- issue: Mesjański sens tytułu „Syn Dawida”
  choice: Pozostawienie w tekście tytułu „Syn Dawida”
  alternative: Mesjasz; obiecany potomek Dawida
  rationale: Grecki tekst używa historycznie i teologicznie znaczącego tytułu, a nie jego objaśnienia. Zachowanie tytułu nie rozstrzyga za czytelnika całego jego znaczenia; sens mesjański wyjaśnia przypis.
- issue: Siła pytania wprowadzonego przez μήτι
  choice: Czyżby to był...?”
  alternative: To chyba nie jest Syn Dawida?; Czy to może być Syn Dawida?
  rationale: „Czyżby” zachowuje napięcie między gramatycznym oczekiwaniem odpowiedzi przeczącej a rzeczywistym zdumieniem i rodzącym się przypuszczeniem tłumów. Mocniej przeczący wariant mógłby niepotrzebnie przedstawiać ich jako zdecydowanie odrzucających tę możliwość.
translation_notes:
  register: Język jest współczesny, zrozumiały i godny. Szyk „wszystkie tłumy” celowo zachowuje liczbę mnogą greckiego tekstu, a równoległe imperfecta oddano jako „zdumiewały się i mówiły”. Partykuła „czyżby” brzmi naturalnie w pełnym zdumienia pytaniu i pozwala zachować jego autentyczną dwuznaczność.
