  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: pl
  text: 'Lecz mówię wam: z każdego bezużytecznego[a] słowa, które ludzie wypowiedzą, zdadzą sprawę w dniu sądu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „próżnego”, „bezowocnego” lub „lekkomyślnego”. Grecki przymiotnik może opisywać coś bezczynnego, nieproduktywnego albo pozbawionego pożytku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lecz mówię wam
  rationale: Czas teraźniejszy i bezpośredni zwrot oddano naturalnie jako „mówię wam”. Spójnik δέ ma tu łagodnie przeciwstawny charakter, dlatego „lecz” dobrze wprowadza uroczyste ostrzeżenie na tle poprzedniej wypowiedzi.
- source_word: πᾶν ῥῆμα
  choice: każdego ... słowa
  rationale: 'Liczba pojedyncza z πᾶν ma sens dystrybutywny: „każde”. Rzeczownik ῥῆμα oznacza tu wypowiedziane słowo lub wypowiedź; polskie „słowo” jest naturalne i zachowuje zwięzłość oryginału.'
- source_word: ἀργὸν
  choice: bezużytecznego
  rationale: Przymiotnik ἀργός może oznaczać coś bezczynnego, bezowocnego, nieproduktywnego lub nieprzynoszącego pożytku. „Bezużyteczne” zachowuje podstawowy obraz i nie zawęża znaczenia wyłącznie do świadomie złośliwej mowy; przypis sygnalizuje możliwe odcienie.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: które ludzie wypowiedzą
  rationale: Forma przyszła λαλήσουσιν została zachowana jako „wypowiedzą”. οἱ ἄνθρωποι oznacza ludzi ogólnie, nie wyłącznie mężczyzn.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: z każdego ... zdadzą sprawę
  rationale: Grecki zwrot oznacza zdanie rachunku lub sprawy w odniesieniu do danego słowa. Polska konstrukcja „zdać sprawę z czegoś” naturalnie oddaje zarówno idiom, jak i περὶ αὐτοῦ, bez zbędnego powtórzenia zaimka.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: w dniu sądu
  rationale: Wyrażenie wskazuje na czas sądu. „W dniu sądu” jest utrwalone, zrozumiałe i zachowuje sądowniczy sens κρίσις.
theological_decisions:
- issue: Moralny wydźwięk przymiotnika ἀργόν
  choice: bezużytecznego
  alternative: próżnego; bezowocnego; lekkomyślnego
  rationale: Kontekst sądu nadaje wypowiedzi powagę moralną, ale sam przymiotnik nie określa jednoznacznie słowa jako złośliwego czy bluźnierczego. Przekład zachowuje szerszą ideę mowy bez pożytku, a przypis pozostawia autentyczny zakres znaczeniowy.
- issue: Ogólny zakres οἱ ἄνθρωποι
  choice: ludzie
  alternative: człowiek; mężczyźni
  rationale: Rodzajnik z rzeczownikiem w liczbie mnogiej odnosi się tu ogólnie do ludzi. „Ludzie” wiernie zachowuje ten powszechny zakres bez sugerowania, że ostrzeżenie dotyczy tylko mężczyzn.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano zwięzłość ostrzeżenia oraz przyszły charakter obu czasowników. Dwukropek po formule wprowadzającej jest naturalny w polskiej mowie bezpośredniej i nie zmienia relacji składniowej wyrażanej przez ὅτι.
