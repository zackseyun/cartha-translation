id: MAT.12.24
reference: Matthew 12:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: pl
  text: 'Lecz gdy faryzeusze to usłyszeli, powiedzieli: „Ten człowiek wypędza demony tylko mocą Belzebula[a], władcy demonów”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Belzebul: tradycyjnie „Belzebub”.'
    reason: alternatywna tradycyjna forma imienia
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: Oddaje kontrast wobec wcześniejszej pozytywnej reakcji tłumu, zachowując podniosły, lecz współczesny rejestr.
- source_word: ἀκούσαντες
  choice: gdy ... to usłyszeli
  rationale: Imiesłów aorystu został naturalnie oddany jako zdanie czasowe; „to” uzupełnia domyślny przedmiot z kontekstu.
- source_word: Οὗτος
  choice: Ten człowiek
  rationale: Zachowuje wskazujący i lekceważący ton wypowiedzi faryzeuszy wyraźniej niż neutralne „on”.
- source_word: ἐκβάλλει
  choice: wypędza
  rationale: Jest to naturalny i utrwalony polski odpowiednik w kontekście egzorcyzmów.
- source_word: δαιμόνια
  choice: demony
  rationale: Bezpośredni i powszechnie zrozumiały odpowiednik greckiego rzeczownika.
- source_word: εἰ μὴ
  choice: tylko
  rationale: W zdaniu z przeczeniem wyraża wyłączność domniemanego sposobu działania; po polsku konstrukcja „nie... inaczej, jak tylko” byłaby cięższa, a samo „tylko” jasno zachowuje sens.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: mocą Belzebula
  rationale: Przyimek ἐν ma tu znaczenie środka lub sprawczej mocy. Dodanie „mocą” pozwala oddać je jasno i idiomatycznie, nie utożsamiając Belzebula bezpośrednio z działającym podmiotem.
- source_word: Βεελζεβοὺλ
  choice: Belzebul
  rationale: Forma odpowiada greckiemu Βεελζεβούλ; w zdaniu została regularnie odmieniona jako „Belzebula”.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: władcy demonów
  rationale: „Władca” przystępnie oddaje władzę i zwierzchnictwo wyrażone przez ἄρχων, bez wprowadzania dodatkowych skojarzeń tytułu „książę”.
theological_decisions:
- issue: Wrogi odcień zaimka Οὗτος
  choice: Ten człowiek
  alternative: On; Ten
  rationale: Sformułowanie zachowuje pogardliwy dystans faryzeuszy, nie dodając oceny doktrynalnej.
- issue: Forma imienia Βεελζεβούλ
  choice: Belzebul
  alternative: Belzebub
  rationale: Tekst główny odzwierciedla formę obecną w SBLGNT, a tradycyjna forma polska zostaje podana w przypisie.
- issue: Instrumentalne znaczenie ἐν
  choice: mocą Belzebula
  alternative: przez Belzebula; za sprawą Belzebula
  rationale: Oddaje zarzut, że Jezus działa dzięki mocy przypisywanej władcy demonów, zarazem nie rozstrzygając ponad tekst dokładnej natury tej zależności.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. „Lecz” podtrzymuje wyraźny kontrast, a „Ten człowiek” zachowuje nieprzychylny ton. Marker [a] umieszczono bezpośrednio po odmienionej formie imienia.
