id: MAT.12.34
reference: Matthew 12:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: pl
  text: Plemię żmijowe, jak możecie mówić dobre rzeczy, skoro jesteście źli? Przecież z obfitości serca mówią usta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Z przepełnionego serca mówią usta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Plemię żmijowe
  rationale: Wyrażenie zachowuje ostrą metaforę pochodzenia i charakteru, a zarazem brzmi naturalnie i dostojnie we współczesnej polszczyźnie.
- source_word: πῶς δύνασθε
  choice: jak możecie
  rationale: Naturalnie oddaje retoryczne pytanie wskazujące na moralną niemożność lub niezdolność.
- source_word: ἀγαθὰ λαλεῖν
  choice: mówić dobre rzeczy
  rationale: Zachowuje substantywne znaczenie liczby mnogiej ἀγαθά bez zawężania go do jednego rodzaju dobrej wypowiedzi.
- source_word: πονηροὶ ὄντες
  choice: skoro jesteście źli
  rationale: Konstrukcja okolicznikowa wskazuje tu na podstawę retorycznego pytania; „źli” zachowuje wyraźny osąd moralny.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Przecież z obfitości serca
  rationale: „Obfitość” obejmuje zarówno nadmiar, jak i pełnię, z której wypływa mowa; „przecież” naturalnie oddaje uzasadniające γάρ.
- source_word: τὸ στόμα λαλεῖ
  choice: mówią usta
  rationale: Polska liczba mnoga „usta” wymaga mnogiej formy czasownika i zachowuje dosłowny obraz grecki.
theological_decisions:
- issue: Metaforyczne znaczenie καρδία
  choice: serce
  alternative: wnętrze; umysł
  rationale: „Serce” zachowuje biblijne określenie wewnętrznego centrum człowieka, obejmującego myśli, wolę i usposobienie, bez zawężenia do samych emocji.
- issue: Moralna charakterystyka πονηροί
  choice: źli
  alternative: niegodziwi; podli
  rationale: „Źli” jasno przekazuje osąd moralny, nie wzmacniając go ponad greckie brzmienie.
- issue: Relacja między wnętrzem a mową
  choice: Zachowano obraz, według którego mowa wypływa z obfitości serca.
  alternative: Wyjaśniająca parafraza o ujawnianiu charakteru przez słowa.
  rationale: Tekst stwierdza związek między wewnętrznym stanem człowieka a jego mową, lecz nie wymaga dopowiadania szerszej doktryny antropologicznej.
translation_notes:
  register: Język współczesny, prosty i dostojny. Zachowano mocną apostrofę oraz konkretny obraz serca i ust; uniknięto archaizmów i denominacyjnych objaśnień.
