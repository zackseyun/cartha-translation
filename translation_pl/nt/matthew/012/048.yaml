source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: pl
  text: 'On jednak odpowiedział temu, który do niego mówił[a]: „Kto jest moją matką, a kim są moi bracia?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bardziej formalnie: „On jednak odpowiedział i powiedział temu, który do niego mówił”.'
    reason: Alternatywa leksykalna zachowująca oba greckie czasowniki w zwrocie ἀποκριθεὶς εἶπεν.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: On jednak odpowiedział
  rationale: Imiesłów ἀποκριθεὶς połączony z εἶπεν tworzy typowy semityzujący zwrot „odpowiedział i powiedział”. Naturalne polskie „odpowiedział” oddaje jego sens bez zbędnego powtórzenia, a „jednak” zaznacza zwrot w toku wypowiedzi sygnalizowany przez δέ.
- source_word: τῷ λέγοντι αὐτῷ
  choice: temu, który do Niego mówił
  rationale: Rzeczownikowo użyty imiesłów λέγοντι wskazuje osobę zwracającą się do Jezusa. Polski czasownik niedokonany „mówił” zachowuje aspekt trwającej czynności, nie zawężając jej do jednorazowego przekazania wiadomości.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Kto jest moją matką
  rationale: Bezpośrednie i naturalne pytanie o tożsamość, zachowujące rzeczownikowy charakter oryginału oraz zaimek dzierżawczy.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: i kto jest moimi braćmi
  rationale: Polskie „kto” może łączyć się z orzecznikiem w liczbie mnogiej; liczba pojedyncza czasownika „jest” jest tu normatywna i naturalna. „Braćmi” zachowuje męski termin pokrewieństwa ἀδελφοί bez rozszerzania go na rodzeństwo obu płci.
theological_decisions:
- issue: Możliwe interpretacyjne złagodzenie retorycznego pytania Jezusa o więzi rodzinne
  choice: Zachowano dosłowne pytania retoryczne bez objaśniającego rozwinięcia
  alternative: „Kogo uznaję za swoją matkę i swoich braci?”
  rationale: Dalszy kontekst nadaje więzi rodzinnej nowe znaczenie, lecz sam werset jeszcze go nie wyjaśnia. Proste pytanie zachowuje napięcie narracyjne i teologiczne.
- issue: Zakres znaczeniowy ἀδελφοί
  choice: braćmi
  alternative: „rodzeństwem” albo „braćmi i siostrami”
  rationale: W bezpośredniej scenie chodzi o wymienionych członków rodziny Jezusa, a tekst używa rzeczownika rodzaju męskiego w liczbie mnogiej. Nie należy w tym miejscu rozszerzać jego zakresu.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zaimek „On” jasno wskazuje Jezusa, a zapis „Niego” stosuje tradycyjną polską kapitalizację zaimka odnoszącego się do Chrystusa. Szyk pytań pozostaje bliski grece, lecz brzmi naturalnie po polsku.
