  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: pl
  text: I surowo im nakazał, aby go nie ujawniali,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „surowo ich ostrzegł, aby go nie ujawniali” albo „zabronił im go ujawniać”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Prosty spójnik kontynuujący narrację; polskie „I” zachowuje koordynację bez dodawania następstwa czasowego lub skutkowego.
- source_word: ἐπετίμησεν
  choice: surowo nakazał
  rationale: Czasownik może oznaczać zgromienie, surowe ostrzeżenie lub stanowczy nakaz. W połączeniu z treścią zakazu chodzi tu o mocną dyrektywę; „surowo nakazał” oddaje jej stanowczość bez sugerowania winy adresatów tak wyraźnie jak „zgromił”.
- source_word: αὐτοῖς
  choice: im
  rationale: Celownik liczby mnogiej odnosi się do osób wspomnianych w kontekście.
- source_word: ἵνα μὴ
  choice: żeby nie
  rationale: Po czasowniku wyrażającym nakaz konstrukcja wprowadza treść zakazu; „żeby nie” jest naturalnym polskim odpowiednikiem.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: nie ujawniali, kim jest
  rationale: Idiom φανερὸν ποιέω oznacza uczynić jawnym, ujawnić lub rozgłosić. Sformułowanie „ujawniali, kim jest” naturalnie zachowuje osobowy przedmiot αὐτόν i wskazuje na publiczne ujawnienie Jezusa, nie dopowiadając motywu zakazu.
theological_decisions:
- issue: Charakter polecenia Jezusa dotyczącego rozgłosu
  choice: Stanowczy zakaz ujawniania, kim jest
  alternative: Surowe ostrzeżenie lub zgromienie adresatów
  rationale: Greka wyraża mocną dyrektywę, lecz nie podaje w tym wersecie jej teologicznego powodu. Przekład zachowuje stanowczość i nie dopowiada motywu działania Jezusa.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. „Surowo im nakazał” oddaje siłę ἐπιτιμάω, a przypis zachowuje jego zakres znaczeniowy. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną praktyką przekładową.
