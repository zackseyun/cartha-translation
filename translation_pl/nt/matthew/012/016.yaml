  source_fidelity: Konstrukcja ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν wyraża stanowczą dyrektywę, by nie czynili go jawnym/znanym. „Surowo im nakazał” jest możliwym oddaniem ἐπετίμησεν w tym kontekście. Jednak „nie ujawniali, kim jest” zawęża przedmiot zakazu do ujawniania tożsamości, podczas gdy grecki idiom mówi szerzej o ujawnieniu lub publicznym rozgłoszeniu jego osoby.
