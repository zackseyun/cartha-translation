id: MAT.12.7
reference: Matthew 12:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: pl
  text: 'Gdybyście zaś zrozumieli, co znaczą słowa: „Miłosierdzia pragnę, a nie ofiary”[a], nie potępilibyście niewinnych[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jezus cytuje Oz 6,6.
    reason: cross_reference
  - marker: b
    text: 'Można też przetłumaczyć: „wolnych od winy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: zrozumieli
  rationale: W nierzeczywistym zdaniu warunkowym forma ta odnosi się do wcześniejszego poznania sensu Pisma; po polsku „gdybyście zrozumieli” naturalnie oddaje zarazem poznanie i właściwe pojęcie cytatu.
- source_word: τί ἐστιν
  choice: co znaczą słowa
  rationale: Zwrot wprowadza objaśnienie przytoczonego tekstu. Dodanie rzeczownika „słowa” jasno wskazuje na cytat i brzmi naturalnie po polsku.
- source_word: ἔλεος
  choice: miłosierdzia
  rationale: „Miłosierdzie” zachowuje szeroki sens współczucia i łaskawego postępowania, nie zawężając terminu do samego uczucia.
- source_word: θέλω
  choice: pragnę
  rationale: „Pragnę” zachowuje uroczysty, prorocki rejestr oraz wyraża Bożą wolę bez potoczności czasownika „chcę”.
- source_word: θυσίαν
  choice: ofiary
  rationale: „Ofiara” jest zwięzłym i zwyczajowym odpowiednikiem odnoszącym się do ofiary kultowej.
- source_word: κατεδικάσατε
  choice: nie potępilibyście
  rationale: Forma warunkowa oddaje nierzeczywisty skutek, a „potępić” zachowuje sądowniczy wydźwięk czasownika.
- source_word: ἀναιτίους
  choice: niewinnych
  rationale: „Niewinni” naturalnie oddaje osoby wolne od winy i dobrze współbrzmi z sądowniczym czasownikiem „potępić”; alternatywę wskazano w przypisie.
theological_decisions:
- issue: Prorockie zestawienie miłosierdzia i ofiary w cytacie z Oz 6,6
  choice: „Miłosierdzia pragnę, a nie ofiary”
  alternative: „Miłosierdzia chcę, nie ofiary”
  rationale: Zachowano ostre przeciwstawienie obecne w greckim tekście, nie dopowiadając, że chodzi jedynie o hierarchię wartości, ani nie wyprowadzając z niego ogólnego zniesienia ofiar. Dzięki temu pozostaje napięcie właściwe cytatowi.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Cytat prorocki zachowuje podniosłość dzięki formie „pragnę”, natomiast całe zdanie pozostaje naturalne składniowo. Markery przypisów umieszczono bezpośrednio przy elementach, których dotyczą.
