  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: pl
  text: Faryzeusze zaś wyszli i odbyli naradę przeciwko niemu, jak go zgładzić[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zabić” lub „doprowadzić do zguby”. Grecki czasownik może oznaczać zgubienie lub zniszczenie, a w tym kontekście odnosi się do zamiaru usunięcia Jezusa, prawdopodobnie przez śmierć.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: wyszli
  rationale: Imiesłów aorystu ma tu sens czasowo-sekwencyjny; polska forma osobowa naturalnie oddaje czynność poprzedzającą naradę.
- source_word: δὲ
  choice: zaś
  rationale: Partykuła sygnalizuje zmianę toku narracji i łagodny kontrast; „zaś” zachowuje ten odcień w godnym, współczesnym rejestrze.
- source_word: οἱ Φαρισαῖοι
  choice: Faryzeusze
  rationale: Utrwalona polska nazwa tej żydowskiej grupy religijnej.
- source_word: συμβούλιον ἔλαβον
  choice: naradzili się
  rationale: Grecki idiom dosłownie mówi o „wzięciu narady”; polskie „naradzili się” jest naturalne i nie przesądza formalnego charakteru zebrania ani nie wzmacnia tekstu do wyraźnego „spisku”.
- source_word: κατ’ αὐτοῦ
  choice: przeciwko niemu
  rationale: Przyimek κατά z dopełniaczem ma w tym kontekście wyraźny sens wrogi.
- source_word: ὅπως
  choice: jak
  rationale: 'Wprowadza treść zamierzonego działania i zachowuje deliberatywny odcień: rozważali sposób jego wykonania.'
- source_word: ἀπολέσωσιν
  choice: zniszczyć
  rationale: Czasownik ἀπόλλυμι może oznaczać zniszczenie, doprowadzenie do zguby lub zabicie. „Zniszczyć” zachowuje szerszy zakres greckiego słowa, a kontekst pozwala rozpoznać możliwość śmiertelnego zamiaru.
theological_decisions:
- issue: Stopień sprecyzowania śmiertelnego zamiaru w ἀπολέσωσιν
  choice: zniszczyć
  alternative: zgładzić; zabić; doprowadzić do zguby
  rationale: Kontekst wskazuje na skrajnie wrogi, prawdopodobnie śmiertelny zamiar, lecz sam grecki czasownik jest szerszy niż jednoznaczne „zabić”. Tekst główny zachowuje tę nieostrość, a przypis podaje możliwe interpretacje.
translation_notes:
  register: Współczesny, godny język narracyjny. Szyk z „zaś” zachowuje zwrot w opowiadaniu, a „naradzili się” unika zarówno niezręcznej dosłowności, jak i nadmiernie interpretacyjnego „zawiązali spisek”.
