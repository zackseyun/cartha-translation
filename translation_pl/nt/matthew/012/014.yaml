review_pass:
  verdict: revise
  source_fidelity: 'Tekst dobrze oddaje wszystkie elementy greckiego zdania: następstwo „wyszedłszy”, przeciwstawno-rozwijające δέ, wrogi sens κατ’ αὐτοῦ oraz cel/treść narady. Jednak „zniszczyć” w odniesieniu do osoby brzmi w polszczyźnie nienaturalnie i może sugerować zniszczenie w sensie materialnym lub psychicznym; w tym kontekście ἀπολέσωσιν najbezpieczniej i naturalnie oddaje „zgładzić”, bez zawężania do bezpośredniego „zabić”.'
  naturalness: „Faryzeusze zaś wyszli i naradzili się przeciwko niemu, jak go zniszczyć” jest zasadniczo zrozumiałe, ale połączenie „naradzili się ... jak” jest nieco ciężkie, a „zniszczyć” wobec człowieka ma niepożądanie nienaturalne brzmienie. „Odbyli naradę przeciwko niemu, jak go zgładzić” zachowuje formalny, współczesny rejestr i naturalniej oddaje grecki idiom.
  terminology: „Faryzeusze” jest utrwaloną i właściwą nazwą. „Zgładzić” odpowiada wrogiemu, najpewniej śmiertelnemu zamysłowi kontekstu, lecz nie wymusza technicznego sensu egzekucji. Przypis powinien prezentować „zabić” jako wariant bardziej wyraźny, nie zaś wyjaśniać czasownik poprzez niezręczne „doprowadzenie do zguby”.
  issues:
