    rationale: Choć leksykalnie możliwe jako szerokie tłumaczenie ἀπόλλυμι, współczesna polszczyzna zwykle używa go wobec rzeczy, struktur albo reputacji. W tym kontekście „zgładzić” naturalniej przekazuje zamierzone usunięcie osoby i zachowuje właściwy poziom niedookreślenia.
  - severity: low
    issue: „Naradzili się przeciwko niemu” słabiej odzwierciedla rzeczownikowe συμβούλιον ἔλαβον
    rationale: Nie jest błędem, lecz „odbyli naradę przeciwko niemu” bliżej oddaje idiom „powzięli naradę”, bez interpretacyjnego wzmacniania do „spiskowali”.
