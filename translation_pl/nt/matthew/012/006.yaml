id: MAT.12.6
reference: Matthew 12:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: pl
  text: 'Lecz mówię wam: jest tu coś większego niż świątynia[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ktoś większy niż świątynia jest tutaj” albo „ten, kto jest większy niż świątynia, jest tutaj”. W tekście greckim przymiotnik „większe” ma rodzaj nijaki, a jego desygnat nie został wyrażony wprost.'
    reason: alternative_reading
  - marker: b
    text: 'Możliwe też: „w tym miejscu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lecz mówię wam
  rationale: Formuła bezpośredniego zwrotu została oddana naturalnie po polsku; δέ ma tu łagodny odcień przeciwstawny wobec poprzedniego wywodu.
- source_word: ὅτι
  choice: ':'
  rationale: W polszczyźnie treść wypowiedzi po czasowniku „mówię” naturalnie wprowadza dwukropek; dosłowne „że” wymagałoby mniej płynnego szyku.
- source_word: τοῦ ἱεροῦ
  choice: niż świątynia
  rationale: ἱερόν oznacza zwykle cały kompleks świątynny, a „świątynia” jest jego naturalnym i utrwalonym odpowiednikiem w tym kontekście.
- source_word: μεῖζόν
  choice: coś większego
  rationale: Rodzaj nijaki liczby pojedynczej został zachowany przez „coś większego”, bez jawnego utożsamienia niewskazanego gramatycznie desygnatu z osobą.
- source_word: ἐστιν
  choice: jest
  rationale: Prosta forma czasu teraźniejszego nie wymaga rozwinięcia.
- source_word: ὧδε
  choice: tu
  rationale: Zwięzły, naturalny odpowiednik przysłówka miejsca; możliwe jest także bardziej uroczyste „w tym miejscu”.
theological_decisions:
- issue: Tożsamość niewypowiedzianego desygnatu nijakiej formy μεῖζόν
  choice: coś większego niż świątynia
  alternative: ktoś większy niż świątynia; ten, kto jest większy niż świątynia
  rationale: Greka używa formy nijakiej, nie męskiej. Kontekst wskazuje na Jezusa i jego władzę, lecz tekst główny nie powinien usuwać formalnej nieokreśloności ani zawężać sensu.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. „Lecz” zachowuje kontrast, a konstrukcja „jest tu coś większego” brzmi naturalnie i jednocześnie oddaje formalną nieokreśloność greckiego rodzaju nijakiego.
