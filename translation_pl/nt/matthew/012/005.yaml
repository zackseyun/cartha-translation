  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: pl
  text: Albo czy nie czytaliście w Prawie[c], że w szabaty[b] kapłani w świątyni bezczeszczą[a] szabat, a są bez winy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „naruszają szabat” albo „łamią szabat”. Grecki czasownik oznacza traktowanie czegoś świętego jako pospolitego lub nieświętego.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „w szabaty”. Liczba mnoga najpewniej wskazuje na kolejne, powtarzające się dni szabatu.'
    reason: lexical_alternative
  - marker: c
    text: „Prawo” oznacza tu Prawo Mojżeszowe jako część Pisma, najpewniej z uwzględnieniem przepisów o służbie kapłańskiej w szabat (por. Lb 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Albo
  rationale: Wprowadza kolejny, alternatywny argument z Pisma i zachowuje tok pytania retorycznego.
- source_word: οὐκ ἀνέγνωτε
  choice: czy nie czytaliście
  rationale: Naturalna polska formuła pytania retorycznego odwołującego się do znajomości Pisma; zachowuje aorystyczną formę grecką bez wymuszania aspektu dokonanego.
- source_word: ἐν τῷ νόμῳ
  choice: w Prawie
  rationale: Wielka litera wskazuje na Prawo Mojżeszowe jako część Pisma, nie na prawo w sensie abstrakcyjnym.
- source_word: τοῖς σάββασιν
  choice: w szabaty
  rationale: Zachowuje grecką liczbę mnogą, która najpewniej odnosi się do powtarzających się dni szabatu.
- source_word: οἱ ἱερεῖς
  choice: kapłani
  rationale: Bezpośrednie i naturalne określenie kapłanów pełniących służbę świątynną.
- source_word: ἐν τῷ ἱερῷ
  choice: w świątyni
  rationale: Naturalny polski odpowiednik odnoszący się do kompleksu świątynnego; większa precyzja w tekście głównym byłaby niepotrzebnie ciężka.
- source_word: τὸ σάββατον
  choice: szabat
  rationale: Zachowuje liczbę pojedynczą, gdy mowa o szabacie jako dniu i ustanowieniu.
- source_word: βεβηλοῦσιν
  choice: bezczeszczą
  rationale: Oddaje sens traktowania czegoś świętego jako pospolite i zachowuje celowo mocne, prowokacyjne napięcie wypowiedzi.
- source_word: ἀναίτιοί εἰσιν
  choice: są bez winy
  rationale: Jasno wyraża brak prawnej lub moralnej odpowiedzialności i dobrze kontrastuje z mocnym czasownikiem „bezczeszczą”.
theological_decisions:
- issue: Czy złagodzić stwierdzenie, że kapłani bezczeszczą szabat
  choice: Zachować mocne sformułowanie „bezczeszczą szabat”, po czym stwierdzić, że „są bez winy”
  alternative: „naruszają szabat i są niewinni” albo „łamią szabat, lecz nie ponoszą winy”
  rationale: Grecki tekst celowo zestawia mocny czasownik βεβηλοῦσιν z brakiem winy kapłanów. Przekład zachowuje to napięcie i nie wyjaśnia go przez osłabienie pierwszego członu.
translation_notes:
  register: Współczesny, standardowy i godny polski. Szyk zachowuje retoryczny charakter pytania. Wyrażenie „a mimo to” naturalnie uwydatnia kontrast obecny w greckim καί, nie usuwając jego teologicznego napięcia.
