id: MAT.12.27
reference: Matthew 12:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: pl
  text: A jeśli Ja wypędzam demony mocą Belzebula[a], to czyją mocą wypędzają je wasi synowie? Dlatego oni będą waszymi sędziami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Po grecku: „Belzebul”; tradycyjnie także: „Belzebub”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: mocą Belzebula
  rationale: Przyimek ἐν ma tu sens instrumentalny i wskazuje na przypisywane źródło mocy. Polskie „mocą” brzmi naturalniej niż dosłowne „w” i dobrze pasuje do pytania „czyją mocą”. Imię oddano jako „Belzebul”, zgodnie z formą greckiego tekstu.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: wypędzam demony
  rationale: W kontekście egzorcyzmu ἐκβάλλω oznacza usunięcie lub wypędzenie; „wypędzać demony” jest naturalnym i precyzyjnym współczesnym polskim odpowiednikiem.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: wasi synowie
  rationale: Zachowano dosłowny termin pokrewieństwa υἱοί oraz retoryczną ostrość wypowiedzi. Kontekst może sugerować członków własnej grupy lub uczniów rozmówców, ale tekst nie precyzuje tego wprost.
- source_word: ἐν τίνι
  choice: czyją mocą
  rationale: Pytajnik τίς po przyimku ἐν ma tu sens instrumentalny. „Czyją mocą” zachowuje odniesienie do osobowego źródła działania i tworzy naturalną paralelę z „mocą Belzebula”.
- source_word: διὰ τοῦτο
  choice: Dlatego
  rationale: Zwięźle oddaje wynikający z pytania wniosek.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: oni będą waszymi sędziami
  rationale: Oddaje konstrukcję z rzeczownikiem orzecznikowym, czas przyszły i emfatyczne αὐτοί („oni sami/oni”), bez zastępowania jej czasownikiem „osądzą”.
theological_decisions:
- issue: Tożsamość i zapis Βεελζεβούλ
  choice: Belzebul
  alternative: Belzebub
  rationale: Wybrano polską transliteracyjną formę odpowiadającą Βεελζεβούλ w podanym tekście greckim, nie harmonizując jej z tradycyjnym wariantem „Belzebub”. Różnicę zaznaczono w przypisie.
- issue: Znaczenie wyrażenia „wasi synowie”
  choice: Zachowanie dosłownego określenia „wasi synowie”
  alternative: „wasi uczniowie” lub „ludzie spośród was”
  rationale: Greka pozostawia relację nieco otwartą. Przekład zachowuje tę niejednoznaczność i nie przesądza, czy chodzi konkretnie o uczniów, zwolenników czy członków środowiska rozmówców.
translation_notes:
  register: Język współczesny, godny i komunikatywny. Wielka litera w „Ja” podkreśla jawny zaimek ἐγώ i retoryczne przeciwstawienie, zgodnie z polską konwencją zapisu zaimków odnoszonych do Jezusa. Powtórzenie „mocą” klarownie oddaje równoległe instrumentalne użycie ἐν.
