id: MAT.12.46
reference: Matthew 12:46
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: pl
  text: A gdy jeszcze mówił do tłumów, oto jego matka i bracia[a] stali na zewnątrz, chcąc z nim porozmawiać.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może też w szerszym użyciu oznaczać bliskich krewnych; tutaj ma formę męskiej liczby mnogiej i w tekście głównym zostało oddane jako „bracia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: A gdy jeszcze mówił
  rationale: Konstrukcja oddaje równoczesność czynności, ἔτι jako „jeszcze” oraz łagodne przejście narracyjne δέ jako „a”.
- source_word: τοῖς ὄχλοις
  choice: do tłumów
  rationale: Zachowano liczbę mnogą greckiego rzeczownika ὄχλοις, używając naturalnego współczesnego polskiego wyrażenia.
- source_word: ἰδοὺ
  choice: oto
  rationale: „Oto” zachowuje funkcję wyrażenia zwracającego uwagę na nowe wydarzenie, a zarazem brzmi godnie i zrozumiale.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: jego matka i bracia
  rationale: Zaimek „jego” naturalnie odnosi się po polsku do obu członów. „Bracia” odpowiada męskiej liczbie mnogiej ἀδελφοί, nie rozstrzygając dokładnego rodzaju pokrewieństwa.
- source_word: εἱστήκεισαν ἔξω
  choice: stali na zewnątrz
  rationale: Forma εἱστήκεισαν opisuje trwający stan, a „na zewnątrz” nie dodaje niewymienionego w wersecie miejsca, takiego jak dom.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: chcąc z nim porozmawiać
  rationale: W tym kontekście ζητέω wyraża zamiar lub dążenie. Naturalne polskie „chcąc z nim porozmawiać” oddaje cel ich przybycia bez sztucznego kalkowania składni.
theological_decisions:
- issue: Znaczenie ἀδελφοί w odniesieniu do rodziny Jezusa
  choice: bracia
  alternative: krewni; rodzeństwo
  rationale: Grecka forma jest rodzaju męskiego i w warstwie narracyjnej najprościej oznacza „braci”. Przypis zachowuje możliwość szerszego użycia terminu, nie rozstrzygając późniejszych sporów o dokładną więź rodzinną.
translation_notes:
  register: Współczesny, naturalny i godny polski. Zachowano narracyjne „oto”, liczbę mnogą „tłumów” oraz zwięzłość oryginału; uniknięto dopowiedzenia, że chodzi o przebywanie poza domem.
