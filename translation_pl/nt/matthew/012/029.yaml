id: MAT.12.29
reference: Matthew 12:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: pl
  text: Albo jak ktoś może wejść do domu silnego człowieka i zagarnąć jego dobytek[a], jeśli najpierw nie zwiąże[b] tego silnego człowieka? Dopiero wtedy ograbi jego dom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jego rzeczy” lub „jego sprzęty”. Greckie słowo może oznaczać naczynia i sprzęty, a szerzej także należące do kogoś przedmioty.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „nie skrępuje”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Albo
  rationale: Wprowadza alternatywne porównanie wyjaśniające, powiązane z poprzednim argumentem.
- source_word: πῶς δύναταί τις
  choice: jak ktoś może
  rationale: Zachowuje formę pytania retorycznego oraz ogólny, nieokreślony podmiot.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: wejść do domu
  rationale: Naturalny polski odpowiednik konstrukcji oznaczającej wejście do wnętrza domu.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: silnego człowieka / tego silnego człowieka
  rationale: Oddaje urzeczownikowiony grecki przymiotnik i zachowuje konkretną, męską postać występującą w porównaniu; zaimek „tego” w drugim wystąpieniu zapewnia naturalną spójność.
- source_word: τὰ σκεύη αὐτοῦ
  choice: jego dobytek
  rationale: W obrazie napadu na dom liczba mnoga σκεύη obejmuje sprzęty, przedmioty i szerzej to, co należy do gospodarza; „dobytek” brzmi naturalnie i nie zawęża znaczenia do naczyń.
- source_word: ἁρπάσαι
  choice: zagarnąć
  rationale: Wyraża gwałtowne przejęcie cudzej własności, a zarazem pozostaje odróżnione od mocniejszego czasownika διαρπάσει w zakończeniu.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: jeśli najpierw nie zwiąże
  rationale: Zachowuje warunek, kolejność czynności i podstawowe znaczenie czasownika δήσῃ.
- source_word: καὶ τότε
  choice: Dopiero wtedy
  rationale: 'Naturalnie uwydatnia wynikającą z warunku kolejność: ograbienie domu staje się możliwe po związaniu silnego człowieka.'
- source_word: διαρπάσει
  choice: ograbi
  rationale: 'Oddaje intensywniejszy sens czasownika złożonego: zabranie mienia z domu po obezwładnieniu gospodarza.'
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: jego dom
  rationale: Zachowuje dosłowny obraz domu, nie zastępując go interpretacyjnym określeniem domeny lub królestwa.
theological_decisions:
- issue: Męska postać w porównaniu
  choice: silny człowiek
  alternative: siłacz / ktoś silny
  rationale: Grecki tekst przedstawia konkretną męską postać w obrazie napadu. „Silny człowiek” zachowuje ten szczegół bez nadawania mu dodatkowego tytułu teologicznego.
- issue: Zakres metafory domu i dobytku
  choice: Zachowanie konkretnego obrazu wejścia do domu, zagarnięcia dobytku i ograbienia domu
  alternative: Interpretacyjne oddanie domu jako domeny, a dobytku jako poddanych lub zdobyczy duchowej
  rationale: Kontekst wiąże obraz z władzą nad siłami demonicznymi, lecz sam werset pozostaje porównaniem. Przekład nie wpisuje wyjaśnienia alegorii bezpośrednio w tekst.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Pytanie retoryczne oraz konkretny obraz napadu pozostają wyraźne; rozróżnienie między „zagarnąć” a „ograbi” odzwierciedla zmianę greckich czasowników.
