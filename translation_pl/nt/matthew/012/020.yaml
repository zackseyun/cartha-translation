id: MAT.12.20
reference: Matthew 12:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: pl
  text: Trzciny nadłamanej nie złamie ani tlącego się knota[a] nie zgasi, aż doprowadzi sprawiedliwość[b] do zwycięstwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „dymiącego lnu”; chodzi o lniany knot lampy.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „sąd”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: trzciny nadłamanej
  rationale: κάλαμος oznacza trzcinę, a imiesłów od συντρίβω przedstawia ją jako uszkodzoną lub zgniecioną. „Nadłamana trzcina” jest naturalnym, utrwalonym obrazem czegoś osłabionego, lecz jeszcze nie całkiem złamanego.
- source_word: οὐ κατεάξει
  choice: nie złamie
  rationale: κατάγνυμι oznacza złamać lub przełamać. Proste „nie złamie” zachowuje wyrazisty kontrast z nadłamanym stanem trzciny.
- source_word: λίνον τυφόμενον
  choice: tlącego się knota
  rationale: λίνον dosłownie oznacza len, tutaj jednak chodzi o wykonany z lnu knot lampy; τυφόμενον opisuje knot dymiący lub ledwie się tlący. Przekład wskazuje współczesnemu czytelnikowi rzeczywisty przedmiot i stan.
- source_word: οὐ σβέσει
  choice: nie zgasi
  rationale: σβέννυμι znaczy gasić. „Nie zgasi” jest zwięzłe, naturalne i dobrze pasuje do obrazu tlącego się knota.
- source_word: ἕως ἂν
  choice: aż
  rationale: Konstrukcja wyznacza przyszły punkt osiągnięcia celu. Polskie „aż” naturalnie łączy wcześniejsze zaprzeczenia z zamierzonym wynikiem.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: doprowadzi ... do zwycięstwa
  rationale: ἐκβάλλω ma podstawowe znaczenie wyprowadzania lub wydobywania, lecz wraz z εἰς νῖκος wyraża doprowadzenie czegoś do zwycięskiego skutku. Takie sformułowanie zachowuje celowy i rozstrzygający charakter frazy.
- source_word: τὴν κρίσιν
  choice: sprawiedliwość
  rationale: W kontekście cytatu z Izajasza κρίσις oznacza sprawiedliwy sąd lub ustanowienie sprawiedliwego porządku. „Sprawiedliwość” trafnie oddaje szerszy sens, a alternatywę „sąd” zachowano w przypisie.
theological_decisions:
- issue: Znaczenie κρίσις w cytacie o Słudze
  choice: sprawiedliwość
  alternative: sąd
  rationale: Kontekst wskazuje na skuteczne ustanowienie tego, co prawe, nie wyłącznie na ogłoszenie wyroku. Ponieważ grecki wyraz dopuszcza oba odcienie, wariant „sąd” podano w przypisie.
- issue: Stopień dosłowności obrazu λίνον
  choice: knot
  alternative: len
  rationale: Grecki rzeczownik dosłownie nazywa len, ale w obrazie lampy odnosi się do lnianego knota. „Knot” jasno przekazuje zamierzony obraz, a dosłowną postać zachowano w przypisie.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano poetycką równoległość dwóch obrazów oraz napięcie między łagodnością działania Sługi a jego ostatecznym zwycięstwem. Przypisy ujawniają dosłowne brzmienie obrazu knota i zakres znaczeniowy κρίσις.
