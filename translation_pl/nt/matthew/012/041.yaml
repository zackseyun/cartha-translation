source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: pl
  text: Mężczyźni z Niniwy powstaną na sądzie wraz z tym pokoleniem i potępią je, ponieważ opamiętali się w odpowiedzi na orędzie Jonasza. A oto tutaj jest coś większego niż Jonasz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ktoś większy niż Jonasz”. Greka używa formy nijakiej, dosłownie: „coś większego niż Jonasz”, co może wskazywać nie tylko na osobę Jezusa, lecz także na większą rzeczywistość obecną w nim i w jego działalności.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Mieszkańcy Niniwy
  rationale: Greckie wyrażenie dosłownie określa mężczyzn z Niniwy, lecz w naturalnej polszczyźnie „mieszkańcy Niniwy” dobrze oddaje nazwę grupy przywołanej jako uczestnicy wydarzeń opisanych w Księdze Jonasza, bez niezręcznego „mężczyźni Niniwici”.
- source_word: ἀναστήσονται
  choice: powstaną
  rationale: Czas przyszły czasownika ἀνίστημι w kontekście sądu zachowuje zarówno obraz powstania, jak i możliwe odniesienie do zmartwychwstania, bez nadmiernego doprecyzowania.
- source_word: ἐν τῇ κρίσει
  choice: na sądzie
  rationale: To naturalny polski sposób określenia udziału w eschatologicznym wydarzeniu sądu.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: wraz z tym pokoleniem
  rationale: 'Oddaje podstawowe znaczenie μετά z dopełniaczem: „z, wraz z”; sens przeciwstawienia wynika z dalszego „potępią je”.'
- source_word: κατακρινοῦσιν αὐτήν
  choice: potępią je
  rationale: Κατακρίνω oznacza wydać wyrok potępiający, a zaimek odnosi się do rodzaju nijakiego polskiego rzeczownika „pokolenie”.
- source_word: μετενόησαν
  choice: opamiętali się
  rationale: W tym kontekście μετανοέω oznacza zmianę postawy i zwrot w odpowiedzi na prorockie wezwanie; „opamiętali się” jest zrozumiałe, naturalne i zachowuje sens pokuty bez sprowadzenia go jedynie do emocjonalnego żalu.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: w odpowiedzi na orędzie Jonasza
  rationale: Konstrukcja z εἰς wskazuje reakcję na κήρυγμα; „orędzie” obejmuje publicznie głoszoną treść, nie sugerując rozbudowanego kazania.
- source_word: ἰδοὺ
  choice: A oto
  rationale: Zachowuje uroczysty, emfatyczny sygnał zwracający uwagę, a zarazem brzmi naturalnie we współczesnej polszczyźnie biblijnej.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: tutaj jest coś większego niż Jonasz
  rationale: Nijaki stopień wyższy πλεῖον dosłownie wskazuje na „coś większego”; przekład zachowuje tę celową formę i nie zawęża jej wyłącznie do porównania dwóch osób.
theological_decisions:
- issue: Sposób oddania πλεῖον Ἰωνᾶ jako odniesienia Jezusa do siebie i swojej działalności
  choice: tutaj jest coś większego niż Jonasz
  alternative: tutaj jest ktoś większy niż Jonasz
  rationale: Greka używa formy nijakiej πλεῖον, nie męskiej. „Coś większego” zachowuje możliwość, że wypowiedź obejmuje zarówno osobę Jezusa, jak i obecną w nim rzeczywistość oraz jego misję, bez rozstrzygania napięcia tekstu.
- issue: Oddanie ἄνδρες w nazwie grupy mieszkańców Niniwy
  choice: Mieszkańcy Niniwy
  alternative: Mężczyźni z Niniwy
  rationale: Choć ἄνδρες jest gramatycznie męskie, całe wyrażenie funkcjonuje jako określenie Niniwitów występujących jako zbiorowi świadkowie na sądzie. Naturalny polski zwrot „mieszkańcy Niniwy” unika niezręczności, nie wprowadzając doktrynalnej interpretacji.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano sądowy oraz eschatologiczny ton wersetu, unikając archaizmów. „A oto” podtrzymuje retoryczne podkreślenie, a „orędzie” brzmi naturalniej i precyzyjniej niż zawężające „kazanie”.
