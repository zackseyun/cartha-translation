  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: pl
  text: Nie będzie się spierał ani krzyczał[a], ani nikt nie usłyszy jego głosu na ulicach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Nie będzie się spierał ani głośno wołał, ani nikt nie usłyszy jego głosu na placach”.'
    reason: Alternatywy leksykalne dla κραυγάσει oraz ἐν ταῖς πλατείαις; zachowują też równoległy układ trzech przeczeń.
lexical_decisions:
- source_word: ἐρίσει
  choice: będzie się spierał
  rationale: Czasownik ἐρίζω oznacza wdawanie się w spór lub kłótnię. „Spierać się” jest naturalne we współczesnej polszczyźnie i oddaje niekonfliktową postawę Sługi, nie sugerując całkowitej bierności.
- source_word: κραυγάσει
  choice: będzie krzyczał
  rationale: κραυγάζω oznacza głośno wołać lub krzyczeć. „Krzyczeć” zwięźle oddaje publiczną donośność wypowiedzi i zachowuje równoległość z poprzednim czasownikiem.
- source_word: ἀκούσει τις
  choice: nikt nie usłyszy
  rationale: Grecka konstrukcja z przeczeniem i zaimkiem nieokreślonym jest idiomatycznie oddana po polsku jako „nikt nie usłyszy”.
- source_word: ἐν ταῖς πλατείαις
  choice: na ulicach
  rationale: πλατεῖα oznacza szeroką ulicę lub publiczny trakt. „Na ulicach” brzmi naturalnie i zachowuje sens publicznej przestrzeni; możliwe jest też „na placach”.
- source_word: φωνὴν αὐτοῦ
  choice: jego głosu
  rationale: φωνή w tym kontekście oznacza głos; dopełniacz wynika z polskiej składni czasownika „usłyszeć” w zdaniu przeczącym.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: nie… ani… i nikt nie…
  rationale: Układ zachowuje kumulatywną siłę trzech greckich przeczeń, a zarazem brzmi naturalnie w nowoczesnej polszczyźnie.
theological_decisions:
- issue: Związek z proroctwem o Słudze z Izajasza i obraz postawy Mesjasza
  choice: Werset przedstawia Mesjasza jako niekonfliktowego i nieposzukującego rozgłosu przez publiczne krzyki.
  alternative: Bardziej formalne „nie będzie walczył ani podnosił głosu” mogłoby mocniej nawiązywać do tradycyjnego brzmienia cytatu.
  rationale: Greka charakteryzuje sposób działania Jezusa w związku z Iz 42:2. Przekład nie powinien sugerować ani absolutnego milczenia, ani całkowitej bierności, lecz łagodną, nieostentacyjną postawę.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zdanie zachowuje rytmiczną serię przeczeń oryginału bez archaicznego szyku; mała litera w zaimku „jego” odpowiada zwyczajnej współczesnej normie przekładowej.
