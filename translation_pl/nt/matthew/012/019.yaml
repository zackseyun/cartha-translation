review_pass:
  verdict: revise
  source_fidelity: 'Główny sens jest właściwie oddany: ἐρίσει jako „będzie się spierał”, κραυγάσει jako „będzie krzyczał”, a ἐν ταῖς πλατείαις jako „na ulicach”. Dla pełniejszego odtworzenia trzykrotnego ciągu przeczeń οὐκ…οὐδὲ…οὐδὲ trzeci człon powinien zostać połączony przez „ani”, nie przez zwykłe „i”.'
  naturalness: „Nie będzie się spierał ani krzyczał, ani nikt nie usłyszy jego głosu na ulicach” jest naturalne, jasne i utrzymane we współczesnym, godnym rejestrze polskim.
  terminology: „Spierał się”, „krzyczał”, „głos” i „ulice” są trafne. Dotychczasowa alternatywa „wszczynał sporów” nie jest bezpieczna, ponieważ dodaje aspekt inicjowania sporów, którego sam czasownik ἐρίζω nie musi wyrażać.
  issues:
  - severity: low
    issue: Spójnik „i” przed trzecim członem osłabia formalnie serię greckich przeczeń.
    rationale: οὐδὲ przed ἀκούσει τις jest kolejnym członem negatywnym; polskie „ani nikt nie usłyszy” wyraźniej zachowuje jego kumulatywną funkcję.
  - severity: medium
    issue: Przypis zawiera „Nie będzie wszczynał sporów”.
    rationale: „Wszczynać” znaczy rozpoczynać lub inicjować spór i dlatego zawęża oraz nieco interpretuje zakres ἐρίσει. Bezpieczniejsza alternatywa zachowuje „spierać się” albo używa neutralnego „wdawać się w spory”.
  revised_text: Nie będzie się spierał ani krzyczał[a], ani nikt nie usłyszy jego głosu na ulicach.
