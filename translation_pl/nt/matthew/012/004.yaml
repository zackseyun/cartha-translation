  naturalness: '„Jak wszedł do domu Boga i jedli...” jest w polszczyźnie niezręczne, ponieważ podmiot pierwszego czasownika jest pojedynczy, a drugiego mnogi. Naturalne jest powtórzenie imienia Dawida: „jak Dawid wszedł ... i jak on oraz jego towarzysze jedli...”.'
  terminology: „Chleby składane przed Bogiem” jest zrozumiałe, lecz opisowe i nieco nieprecyzyjne wobec stałego terminu τῆς προθέσεως. „Chleby przedkładne” to ustalony, współczesny i wystarczająco przejrzysty termin kultowy; przypis może podać „chleby pokładne” jako tradycyjny odpowiednik. Przypis wariantowy należy przenieść do czasownika, którego dotyczy.
