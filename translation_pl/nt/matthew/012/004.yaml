  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: pl
  text: jak Dawid wszedł do domu Boga i jak on oraz jego towarzysze jedli[a] chleby przedkładne[b], których nie wolno było jeść ani jemu, ani tym, którzy z nim byli, lecz tylko kapłanom?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy mają: „zjadł”.'
    reason: textual_variant
  - marker: b
    text: 'Dosłownie: „chleby przedłożenia”; tradycyjnie: „chleby pokładne”. Były to poświęcone chleby wykładane przed Bogiem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: jak
  rationale: Naturalnie wprowadza treść przywołanego wydarzenia i zachowuje pytajną formę wypowiedzi.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: wszedł do domu Boga
  rationale: Ściśle oddaje ruch do wnętrza oraz greckie określenie „dom Boga”, bez zastępowania go kontekstowym „przybytkiem”.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: chleby składane przed Bogiem
  rationale: Oddaje kultowy sens pieczywa wykładanego przed Bogiem, a zarazem jest bardziej zrozumiałe dla współczesnego czytelnika niż tradycyjne „chleby pokładne”.
- source_word: ἔφαγον
  choice: razem z towarzyszami zjedli
  rationale: Forma mnoga tekstu SBLGNT wymaga liczby mnogiej. Uzupełnienie „razem z towarzyszami” jasno wyraża podmiot wynikający z dalszej części zdania, bez zmiany sensu.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: których nie wolno było jeść ani jemu
  rationale: „Nie wolno było” zachowuje normatywny, prawno-kultowy charakter wyrażenia ἐξὸν, a polska liczba mnoga zaimka zgadza się z rzeczownikiem „chleby”.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ani tym, którzy z nim byli
  rationale: Blisko i naturalnie oddaje osoby towarzyszące Dawidowi, bez nadmiernego doprecyzowania ich tożsamości.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: lecz tylko kapłanom
  rationale: Zwięźle zachowuje zarówno wyjątek wyrażony przez εἰ μή, jak i wyłączność podkreśloną przez μόνοις.
theological_decisions:
- issue: Prawno-kultowy charakter ἐξὸν
  choice: nie wolno było
  alternative: nie było dozwolone
  rationale: Sformułowanie ma wyraźną siłę normatywną, ale nie dodaje do tekstu objaśnienia „zgodnie z Prawem”, którego greka nie wypowiada wprost.
- issue: Podmiot czasownika ἔφαγον
  choice: 'liczba mnoga: „razem z towarzyszami zjedli”'
  alternative: 'liczba pojedyncza: „zjadł”'
  rationale: Tekst główny SBLGNT ma formę mnogą ἔφαγον. Znany wariant w liczbie pojedynczej zostaje odnotowany, aby nie zacierać świadectwa rękopisów.
- issue: Znaczenie kultowego określenia chleba
  choice: chleby składane przed Bogiem
  alternative: chleby pokładne
  rationale: Przekład objaśniający zachowuje odniesienie do chleba umieszczanego przed Bogiem, nie narzucając dodatkowej interpretacji teologicznej.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano formę pytania należącego do szerszej wypowiedzi oraz biblijne określenie „dom Boga”. Kultowy termin oddano jasno w tekście głównym, a jego dosłowną i tradycyjną postać podano w przypisie.
