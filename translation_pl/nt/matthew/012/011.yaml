id: MAT.12.11
reference: Matthew 12:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: pl
  text: 'On zaś powiedział im: „Kto z was, jeśli ma jedną owcę, a ta w szabat[a] wpadnie do dołu, nie chwyci jej i nie wyciągnie[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w szabaty”; grecka liczba mnoga jest tu idiomatycznym określeniem szabatu.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „nie chwyci jej i nie podniesie?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: On zaś powiedział im
  rationale: Zachowuje przeciwstawny odcień δέ i jasno oddaje zmianę mówcy w naturalnym, godnym rejestrze.
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Kto z was
  rationale: Polskie „kto z was” naturalnie oddaje idiomatyczne pytanie retoryczne. Rzeczownik ἄνθρωπος nie wymaga tu osobnego odpowiednika, ponieważ forma „kto” obejmuje wskazaną osobę bez utraty sensu.
- source_word: ὃς ἕξει πρόβατον ἕν
  choice: jeśli ma jedną owcę
  rationale: Przyszła forma ἕξει należy do konstrukcji hipotetycznej; polski czas teraźniejszy jest w takim uogólnieniu naturalny. „Jedną owcę” zachowuje liczebnik i jego nacisk.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: a ta ... wpadnie
  rationale: „Ta” jednoznacznie odsyła do owcy i oddaje wskazujący charakter τοῦτο, a czas przyszły naturalnie wyraża możliwy przypadek.
- source_word: τοῖς σάββασιν
  choice: w szabat
  rationale: Liczba mnoga greckiego wyrażenia jest idiomatyczna; w tym kontekście oznacza dzień szabatu, co po polsku naturalnie oddaje liczba pojedyncza.
- source_word: εἰς βόθυνον
  choice: do dołu
  rationale: βόθυνος oznacza dół lub zagłębienie. „Dół” jest szerokim i naturalnym odpowiednikiem, który nie precyzuje bezpodstawnie rodzaju zagłębienia.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: nie chwyci jej
  rationale: οὐχί wprowadza pytanie oczekujące odpowiedzi twierdzącej, a κρατέω oznacza tu mocne uchwycenie zwierzęcia.
- source_word: καὶ ἐγερεῖ
  choice: i nie wyciągnie
  rationale: W obrazie owcy znajdującej się w dole czasownik ἐγείρω oznacza podniesienie jej i wydobycie. „Wyciągnie” naturalnie ujmuje zamierzony skutek, a bardziej dosłowną możliwość podano w przypisie.
theological_decisions:
- issue: Reprezentatywny rzeczownik ἄνθρωπος w pytaniu retorycznym
  choice: Kto z was
  alternative: Który człowiek spośród was
  rationale: Polska konstrukcja „kto z was” zachowuje osobowy i reprezentatywny charakter przykładu, nie wprowadzając niezręcznego, nadmiernie dosłownego sformułowania ani nie rozstrzygając kwestii wykraczających poza tekst.
- issue: Idiomaticzna liczba mnoga τοῖς σάββασιν
  choice: w szabat
  alternative: w szabaty
  rationale: Kontekst dotyczy działania w dniu szabatu, a grecka liczba mnoga pełni funkcję idiomatyczną. Polska liczba pojedyncza najwierniej przekazuje sens sporu o szabat.
- issue: Zakres znaczeniowy ἐγερεῖ
  choice: wyciągnie
  alternative: podniesie
  rationale: Kontekst dołu przemawia za wydobyciem owcy, lecz sam czasownik podstawowo oznacza podniesienie lub wzbudzenie. Przypis zachowuje tę leksykalną możliwość bez narzucania jej tekstowi głównemu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, lecz niesztucznym brzmieniu. Szyk zdania został dostosowany do naturalnego polskiego pytania retorycznego, przy zachowaniu oczekiwanej odpowiedzi twierdzącej. Markery przypisów umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
