id: MAT.12.38
reference: Matthew 12:38
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: pl
  text: 'Wtedy niektórzy spośród uczonych w Piśmie i faryzeuszy odpowiedzieli mu: „Nauczycielu, chcemy zobaczyć znak[a] od ciebie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „cudowny znak”. Greckie słowo może oznaczać znak o cudownym znaczeniu, ale samo w sobie ma szerszy sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący kolejność wydarzeń.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: odpowiedzieli mu
  rationale: Zachowuje typowy dla narracji greckiej czasownik „odpowiedzieć”, choć bezpośrednio wcześniej nie pada pytanie; w tym użyciu oznacza on reakcję słowną skierowaną do Jezusa.
- source_word: τινες τῶν γραμματέων
  choice: niektórzy spośród uczonych w Piśmie
  rationale: „Niektórzy spośród” jasno wskazuje na część grupy. „Uczeni w Piśmie” to utrwalony, zrozumiały polski odpowiednik γραμματεῖς w kontekście Ewangelii, odnoszący się do znawców i wykładowców Pisma.
- source_word: καὶ Φαρισαίων
  choice: i faryzeuszy
  rationale: Standardowa polska nazwa tej żydowskiej grupy religijnej.
- source_word: λέγοντες
  choice: — pominięte jako osobny człon po polsku
  rationale: Grecki imiesłów wprowadza mowę bezpośrednią. Polski dwukropek po „odpowiedzieli mu” przekazuje tę samą funkcję naturalniej niż dosłowne „mówiąc”.
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Bezpośredni i naturalny odpowiednik wołacza, bez wzmacniania sensu do „Mistrzu” lub „Panie”.
- source_word: θέλομεν
  choice: chcemy
  rationale: Oddaje wprost wolę mówiących we współczesnym, neutralnym języku.
- source_word: σημεῖον
  choice: znak
  rationale: Zachowuje szeroki sens greckiego słowa. Kontekst może wskazywać na znak cudowny, ale tekst nie używa osobnego określenia znaczącego „cudowny”.
- source_word: ἀπὸ σοῦ
  choice: od ciebie
  rationale: Oddaje źródło znaku i nie rozstrzyga bardziej szczegółowo, w jaki sposób miałby on zostać dokonany.
- source_word: ἰδεῖν
  choice: zobaczyć
  rationale: Prosty, współczesny odpowiednik bez interpretacyjnego rozszerzenia do „być świadkami”.
theological_decisions:
- issue: Charakter ζηdanego σημεῖον
  choice: znak
  alternative: cudowny znak
  rationale: W kontekście chodzi o znak potwierdzający autorytet Jezusa i prawdopodobnie mający charakter nadprzyrodzony. Sam rzeczownik σημεῖον pozostaje jednak szerszy, dlatego tekst główny nie dopowiada przymiotnika „cudowny”.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjne, nadal zrozumiałe określenie „uczeni w Piśmie”. Zaimek odnoszący się do Jezusa zapisano małą literą, zgodnie z neutralną współczesną ortografią przekładową, bez dodawania rozróżnienia nieobecnego w grece.
