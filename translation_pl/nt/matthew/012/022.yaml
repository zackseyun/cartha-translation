  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: pl
  text: Wtedy przyprowadzono do niego człowieka opętanego przez demona, niewidomego i niemego[a]. Uzdrowił go, tak że niemy mówił i widział.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „głuchego”. Greckie słowo może oznaczać osobę głuchą albo niemą; tutaj kontekst przemawia za znaczeniem „niemy”, ponieważ po uzdrowieniu człowiek mówił i widział.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, wprowadzający kolejne wydarzenie.
- source_word: προσηνέχθη αὐτῷ
  choice: przyprowadzono do niego
  rationale: Polska konstrukcja bezosobowa zachowuje nieokreślonego sprawcę greckiej strony biernej i brzmi naturalniej niż dosłowne „został przyprowadzony”.
- source_word: δαιμονιζόμενος
  choice: opętanego przez demona
  rationale: Zachowuje wyraźne odniesienie do demonicznego charakteru udręczenia, nie zastępując go kategorią kliniczną ani ogólnikowym określeniem.
- source_word: τυφλὸς
  choice: niewidomego
  rationale: Bezpośredni, współczesny i neutralny odpowiednik leksykalny.
- source_word: κωφός
  choice: niemego
  rationale: κωφός może oznaczać osobę głuchą albo niemą; zdanie o skutku uzdrowienia wskazuje tutaj na odzyskanie mowy. Zwięzłe „niemy” odpowiada temu kontekstowi, a przypis zachowuje alternatywę leksykalną.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Uzdrowił go
  rationale: Standardowy i przejrzysty polski odpowiednik w kontekście ewangelicznego uzdrowienia.
- source_word: ὥστε
  choice: tak że
  rationale: Wprowadza rzeczywisty skutek uzdrowienia, zgodnie z funkcją konstrukcji wynikowej.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: niemy zaczął mówić i widzieć
  rationale: Polska konstrukcja osobowa naturalnie oddaje rezultat. „Zaczął mówić” idiomatycznie opisuje odzyskanie zdolności mowy, nie sugerując dodatkowego procesu.
theological_decisions:
- issue: Charakter demonicznego udręczenia
  choice: Zachować jawne określenie „opętany przez demona”
  alternative: udręczony; chory psychicznie
  rationale: Tekst grecki wyraźnie mówi o demonicznym udręczeniu; przekład nie powinien go demitologizować ani przypisywać mu niewskazanej diagnozy.
- issue: Znaczenie κωφός w tym kontekście
  choice: „niemy” z przypisem o możliwym znaczeniu „głuchy”
  alternative: głuchy; głuchoniemy
  rationale: Wynik uzdrowienia obejmuje mówienie i widzenie, nie słyszenie. „Niemy” najlepiej odpowiada kontekstowi, natomiast przypis uczciwie zachowuje zakres znaczeniowy greckiego wyrazu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, narracyjnym brzmieniu. Konstrukcja bezosobowa „przyprowadzono” jest naturalna i zachowuje nieokreślonego sprawcę. Termin „niemy” jest zwięzły i zrozumiały, a przypis zabezpiecza autentyczną wieloznaczność κωφός.
