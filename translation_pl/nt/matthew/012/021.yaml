  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: pl
  text: A w jego imieniu narody będą pokładać nadzieję[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „A poganie będą pokładać nadzieję w jego imieniu”.'
    reason: ἔθνη może oznaczać zarówno „narody”, jak i „pogan”; przestawny szyk alternatywy jest naturalny po polsku i zachowuje nacisk na jego imię.
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Naturalny polski spójnik zachowujący ciągłość z poprzedzającym fragmentem cytatu.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: w jego imieniu
  rationale: Oddaje celownik przy ἐλπίζω i zachowuje biblijną wieloznaczność „imienia” jako osoby, autorytetu i tego, co ona reprezentuje.
- source_word: ἔθνη
  choice: narody
  rationale: W kontekście cytatu z Izajasza określenie obejmuje ludy spoza Izraela; „narody” zachowuje starotestamentowy horyzont i nie zawęża sensu wyłącznie do etniczno-religijnej kategorii pogan.
- source_word: ἐλπιοῦσιν
  choice: będą pokładać nadzieję
  rationale: Oddaje przyszły czas czasownika ἐλπίζω. Współczesne polskie wyrażenie brzmi naturalniej niż samo „będą mieć nadzieję” z dopełnieniem „w imieniu”, a zarazem zachowuje sens nadziei zamiast zastępować go ufnością.
theological_decisions:
- issue: Znaczenie ἔθνη w cytacie mesjańskim
  choice: narody
  alternative: poganie
  rationale: „Narody” najlepiej zachowuje szeroki horyzont proroctwa o ludach, nie wykluczając sensu odnoszącego się do pogan. Alternatywę podano w przypisie, aby zachować rzeczywistą dwuznaczność.
translation_notes:
  register: Nowoczesny, godny i przystępny rejestr. Sformułowanie „pokładać nadzieję” jest idiomatyczne w polszczyźnie biblijnej i ogólnej, bez archaizacji.
