  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: pl
  text: 'Wyciągnął rękę w stronę swoich uczniów i powiedział: „Oto moja matka i moi bracia”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: wyciągnął
  rationale: Aorystowe imiesłowie opisuje gest towarzyszący wypowiedzi; polska konstrukcja z dwoma czasownikami brzmi naturalnie i zachowuje kolejność czynności.
- source_word: τὴν χεῖρα
  choice: rękę
  rationale: Podstawowe znaczenie rzeczownika χείρ pasuje do konkretnego gestu Jezusa; nie ma potrzeby rozszerzać go do „ramienia”.
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: w stronę swoich uczniów
  rationale: Przy bierniku ἐπί wskazuje tutaj kierunek gestu, a μαθηταί oznacza uczniów w relacji do nauczyciela.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: „Oto” jest naturalnym, zwięzłym polskim sygnałem zwracającym uwagę i zachowuje emfatyczną siłę greckiego ἰδού.
- source_word: ἡ μήτηρ μου
  choice: moja matka
  rationale: Dosłowne określenie pokrewieństwa zachowuje konkretny obraz zawarty w wypowiedzi.
- source_word: οἱ ἀδελφοί μου
  choice: moi bracia
  rationale: Grecki tekst ma rodzaj męski w liczbie mnogiej; „bracia” zachowuje jego formę i paralelę z dosłownym językiem rodzinnym.
theological_decisions:
- issue: Język pokrewieństwa w utożsamieniu uczniów z rodziną Jezusa
  choice: Zachowano konkretne określenia „matka” i „bracia”.
  alternative: Parafraza „rodzina” albo rozszerzenie „bracia i siostry”.
  rationale: Tekst celowo posługuje się konkretnymi nazwami więzi rodzinnych. Szersza parafraza osłabiłaby retoryczną wymowę i dopowiedziałaby treść, której ten werset nie wyraża wprost.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja „wyciągnął… i powiedział” zastępuje cięższy polski imiesłów uprzedni, nie zmieniając sensu ani następstwa gestu i wypowiedzi.
