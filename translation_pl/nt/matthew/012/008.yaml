  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: pl
  text: Bo Syn Człowieczy[a] jest Panem szabatu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Syn Człowieczy” jest charakterystycznym samookreśleniem Jezusa w Ewangeliach; wyrażenie to może także nawiązywać do Dn 7.
    reason: alternative_reading
  - marker: b
    text: 'Lub: „ma władzę nad szabatem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Bo
  rationale: Oddaje uzasadniający związek z poprzednią wypowiedzią; w tym miejscu jest naturalne i zwięzłe.
- source_word: κύριος
  choice: Panem
  rationale: Zachowuje mocne określenie władzy i teologiczny ciężar greckiego κύριος; narzędnik wynika z polskiej składni orzeczenia imiennego.
- source_word: τοῦ σαββάτου
  choice: szabatu
  rationale: Dopełniacz po tytule „Pan” wiernie odzwierciedla grecką konstrukcję i brzmi naturalnie po polsku.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalona polska forma charakterystycznego samookreślenia Jezusa zachowuje jego tytularny i międzytekstowy wydźwięk.
- source_word: ἐστιν
  choice: jest
  rationale: Prosta forma czasu teraźniejszego nie wymaga rozwinięcia.
theological_decisions:
- issue: Chrystologiczna wymowa κύριος ... τοῦ σαββάτου
  choice: „Syn Człowieczy jest Panem szabatu”
  alternative: „Syn Człowieczy ma władzę nad szabatem”
  rationale: Sformułowanie „Panem szabatu” zachowuje bezpośredniość i siłę tytułu κύριος, nie dopowiadając zakresu tej władzy ponad to, co mówi tekst.
- issue: Znaczenie ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Tytularne „Syn Człowieczy”
  alternative: „człowiek” / „istota ludzka”
  rationale: W kontekście Ewangelii wyrażenie funkcjonuje jako charakterystyczne samookreślenie Jezusa i może nieść echo Dn 7; forma ogólna osłabiłaby ten rezonans.
translation_notes:
  register: Współczesny, zwięzły i podniosły polski. Zachowano tradycyjny tytuł „Syn Człowieczy” oraz naturalne w polszczyźnie małe litery w wyrazie „szabat”.
