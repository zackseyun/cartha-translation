source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: pl
  text: Jeśli jednak to ja Duchem Bożym[a] wyrzucam demony, to królestwo Boże dotarło do was[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w Duchu Bożym”. Greckie wyrażenie może wskazywać zarówno na sferę działania, jak i na środek lub sprawcę; w tekście głównym oddano je jako wskazanie sprawczego działania Ducha.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „przyszło do was” lub „dosięgło was”. Grecki czasownik podkreśla, że królestwo Boże osiągnęło adresatów w dziełach Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Jeśli jednak
  rationale: Oddaje warunek oraz łagodny kontrast wprowadzany przez δέ, a zarazem brzmi naturalnie w polskim toku argumentacji.
- source_word: ἐν πνεύματι θεοῦ
  choice: Duchem Bożym
  rationale: Polski narzędnik naturalnie wyraża tutaj środek lub sprawcze działanie. Sformułowanie zachowuje odniesienie do Ducha Bożego, nie sprowadzając Go do bezosobowej mocy.
- source_word: ἐγὼ
  choice: Ja
  rationale: Jawny zaimek, zbędny gramatycznie w polszczyźnie, zachowuje nacisk obecny w greckim tekście.
- source_word: ἐκβάλλω
  choice: wyrzucam
  rationale: Jasny i utrwalony polski odpowiednik w kontekście wypędzania demonów; zachowuje siłę greckiego czasownika.
- source_word: τὰ δαιμόνια
  choice: demony
  rationale: Najbardziej bezpośredni i zrozumiały współczesny odpowiednik nazwy istot demonicznych.
- source_word: ἄρα
  choice: to
  rationale: W polskiej konstrukcji warunkowej „jeśli… to…” naturalnie oznacza wniosek wynikający z postawionego warunku.
- source_word: ἔφθασεν
  choice: dotarło
  rationale: Czasownik wskazuje, że królestwo osiągnęło adresatów lub do nich przybyło. „Dotarło” zachowuje nacisk na realne osiągnięcie celu, nie ograniczając sensu do samego zbliżenia się.
- source_word: ἐφ’ ὑμᾶς
  choice: do was
  rationale: Naturalnie oddaje ruch lub zasięg dochodzący do adresatów; mniej dosłowne „nad wami” byłoby w tym zdaniu nienaturalne i mogłoby nadmiernie sugerować zagrożenie.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: królestwo Boże
  rationale: Utrwalony i trafny polski odpowiednik, mieszczący zarówno królewskie panowanie Boga, jak i rzeczywistość Jego królestwa.
theological_decisions:
- issue: Znaczenie przyjścia królestwa Bożego w związku z wyrzucaniem demonów przez Jezusa
  choice: Egzorcyzmy dokonywane przez Jezusa Duchem Bożym świadczą, że królestwo Boże rzeczywiście dotarło już do słuchaczy w teraźniejszym działaniu Boga.
  alternative: Królestwo jedynie się przybliżyło albo odnosi się wyłącznie do przyszłego dopełnienia.
  rationale: ἔφθασεν oznacza dotarcie lub przybycie, a argument opiera się na obecnym działaniu królestwa widocznym w czynach Jezusa. Przekład nie rozstrzyga przy tym całej relacji między jego obecną rzeczywistością a przyszłym dopełnieniem.
- issue: Odniesienie wyrażenia „Duch Boży”
  choice: Wyrażenie odnosi się do Ducha Bożego jako sprawcy działania Jezusa.
  alternative: Wyrażenie oznacza jedynie bezosobową moc pochodzącą od Boga.
  rationale: πνεύματι θεοῦ w tym kontekście wskazuje na Ducha jako Boskiego sprawcę wyrzucania demonów. Wielka litera jest zgodna ze współczesnym polskim zwyczajem biblijnym, bez dodawania do zdania treści niewyrażonej w tekście.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Jawne „Ja” zachowuje grecki nacisk, a konstrukcja „jeśli… to…” jasno prowadzi od warunku do wniosku. Sformułowania pozostają zrozumiałe dla zwykłego czytelnika i unikają konfesyjnego dopowiadania.
