id: MAT.12.42
reference: Matthew 12:42
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: pl
  text: Królowa Południa[a] powstanie na sądzie wraz z tym pokoleniem i je potępi, ponieważ przybyła z krańców ziemi, aby słuchać mądrości Salomona. A oto jest tu coś większego niż Salomon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Królowa Południa” nawiązuje do królowej Saby (1 Krl 10,1–13; 2 Krn 9,1–12), choć tekst grecki nie wymienia Saby z nazwy.
    reason: cross_reference
  - marker: b
    text: 'Możliwe także: „ktoś większy niż Salomon”. W grece występuje forma rodzaju nijakiego („coś większego”), która może podkreślać przewyższającą wielkość obecną w Jezusie i Jego działalności.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Królowa Południa
  rationale: Zachowuje dosłowne określenie geograficzne z greckiego, bez wpisywania do tekstu głównego interpretacyjnej identyfikacji z królową Saby.
- source_word: ἐγερθήσεται
  choice: powstanie
  rationale: Naturalnie oddaje przyszłą formę czasownika ἐγείρω i zachowuje zarówno skojarzenie ze zmartwychwstaniem, jak i obraz wystąpienia podczas sądu, bez doprecyzowania sprawcy.
- source_word: ἐν τῇ κρίσει
  choice: na sądzie
  rationale: Współczesne i zwięzłe polskie sformułowanie odnoszące się do określonego, ostatecznego sądu.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: wraz z tym pokoleniem
  rationale: Oddaje podstawowe znaczenie μετά z dopełniaczem jako „z”, nie nadając samemu przyimkowi znaczenia „przeciwko”; przeciwstawienie wynika z dalszego „potępi”.
- source_word: κατακρινεῖ αὐτήν
  choice: i je potępi
  rationale: Czasownik κατακρίνω oznacza potępienie, a zaimek odnosi się do rodzaju nijakiego polskiego rzeczownika „pokolenie”.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: z krańców ziemi
  rationale: Zachowuje utrwalony obraz bardzo odległego miejsca i szeroki zakres greckiego γῆ.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: aby słuchać mądrości Salomona
  rationale: Bezokolicznik wyraża cel przybycia; „słuchać mądrości” zachowuje obraz z tekstu źródłowego i jest zrozumiałe po polsku.
- source_word: ἰδοὺ
  choice: A oto
  rationale: Oddaje uroczysty sygnał zwracający uwagę, a zarazem brzmi naturalnie w polskiej narracji biblijnej.
- source_word: πλεῖον Σολομῶνος
  choice: coś większego niż Salomon
  rationale: Forma πλεῖον jest rodzaju nijakiego. „Coś większego” zachowuje tę cechę gramatyczną i nie zawęża wypowiedzi wyłącznie do osobowego „ktoś”, choć kontekst odnosi roszczenie do Jezusa i Jego działalności.
- source_word: ὧδε
  choice: jest tu
  rationale: Zwięzły i naturalny odpowiednik wskazującego miejsca przysłówka ὧδε; czasownik „jest” trzeba uzupełnić w języku polskim.
theological_decisions:
- issue: Odniesienie nijakiej formy porównawczej πλεῖον do Jezusa
  choice: coś większego niż Salomon
  alternative: ktoś większy niż Salomon
  rationale: Grecki rodzaj nijaki może uwydatniać przewyższającą Salomona rzeczywistość obecną w Jezusie i Jego posłannictwie. Tekst główny zachowuje napięcie gramatyczne, natomiast przypis podaje naturalną interpretację osobową.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjnie brzmiące, lecz nadal zrozumiałe „A oto” oraz biblijny idiom „krańce ziemi”. Przypisy umieszczono przy wyrażeniach, których bezpośrednio dotyczą.
