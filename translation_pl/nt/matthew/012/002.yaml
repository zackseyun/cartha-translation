id: MAT.12.2
reference: Matthew 12:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: pl
  text: 'Gdy jednak faryzeusze to zobaczyli, powiedzieli mu: „Spójrz, twoi uczniowie robią to, czego nie wolno robić w szabat[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „co nie jest dozwolone robić w szabat”.'
    reason: Alternatywny sposób oddania wyrażenia οὐκ ἔξεστιν, zachowujący jego prawno-permisywny sens bez wskazywania konkretnej podstawy zarzutu.
lexical_decisions:
- source_word: δὲ
  choice: jednak
  rationale: Oddaje kontrast wobec poprzedzającego rozwoju wydarzeń, a zarazem naturalnie łączy zdania po polsku.
- source_word: ἰδόντες
  choice: gdy ... zobaczyli
  rationale: Imiesłów aorystu oddano jako zdanie czasowe. Zaimek „to” odnosi się do opisanej wcześniej czynności uczniów.
- source_word: εἶπαν αὐτῷ
  choice: powiedzieli mu
  rationale: Bezpośredni i neutralny polski odpowiednik zwykłej formuły wprowadzającej wypowiedź.
- source_word: Ἰδοὺ
  choice: Spójrz
  rationale: Naturalny, współczesny wykrzyknik wskazujący, który kieruje uwagę Jezusa na przedmiot oskarżenia.
- source_word: μαθηταί
  choice: uczniowie
  rationale: Utrwalony i precyzyjny odpowiednik, zachowujący relację ucznia do nauczyciela.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: robią ... robić
  rationale: Zachowuje powtórzenie czasownika ποιέω obecne w grece, nie obciążając zdania sztucznym stylem.
- source_word: ὃ οὐκ ἔξεστιν
  choice: to, czego nie wolno
  rationale: Wyraża brak dozwolenia bez rozstrzygania, czy zarzut odwołuje się do Prawa biblijnego, czy do tradycji interpretacyjnej.
- source_word: ἐν σαββάτῳ
  choice: w szabat
  rationale: Naturalne polskie określenie czynności wykonywanej podczas szabatu; nieokreślona forma grecka nie wymaga dopowiedzenia „ten” ani „pewien”.
theological_decisions:
- issue: Charakter zarzutu faryzeuszy
  choice: „czego nie wolno robić” — sformułowanie dotyczące dozwolenia
  alternative: „co jest niezgodne z Prawem”
  rationale: Tekst przytacza zarzut, lecz nie określa jego dokładnej podstawy prawnej ani nie przesądza o jego słuszności. Przekład zachowuje tę niejednoznaczność.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Konstrukcja „Gdy jednak...” jest płynna po polsku, a celowe powtórzenie „robią ... robić” odzwierciedla grecki tekst.
