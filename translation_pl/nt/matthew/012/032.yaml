id: MAT.12.32
reference: Matthew 12:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: pl
  text: I kto powie coś przeciwko Synowi Człowieczemu[a], temu zostanie przebaczone. Kto jednak powie coś przeciwko Duchowi Świętemu, temu nie zostanie przebaczone — ani w tym wieku[b], ani w przyszłym wieku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „powie słowo”; można też oddać: „wypowie słowo” lub „powie coś”.'
    reason: lexical_alternative
  - marker: b
    text: Greckie αἰών oznacza tutaj „wiek” w sensie okresu lub epoki; nie chodzi przede wszystkim o „świat” jako miejsce.
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „ani w przyszłym”, z domyślnym rzeczownikiem „wiek”. Można też oddać: „ani w wieku, który ma nadejść”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: kto… kto jednak
  rationale: Konstrukcje z ἐάν/ἄν wyrażają ogólny, nieokreślony warunek. Polskie „kto” zachowuje otwarty zakres wypowiedzi, a „jednak” oddaje kontrast δέ.
- source_word: εἴπῃ λόγον
  choice: powie słowo
  rationale: To formalnie bliskie i zrozumiałe oddanie, które zachowuje rzeczownik λόγον oraz uroczysty ton ostrzeżenia.
- source_word: κατά + dopełniacz
  choice: przeciwko
  rationale: W obu zdaniach przyimek wskazuje na wrogą wypowiedź skierowaną przeciw danej osobie; „przeciwko” jest naturalne i nie osłabia tej wymowy.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalone polskie oddanie tego tytułu zachowuje jego brzmienie oraz mesjańskie i apokaliptyczne skojarzenia.
- source_word: ἀφεθήσεται αὐτῷ
  choice: temu zostanie przebaczone
  rationale: Zachowuje stronę bierną i odnosi przebaczenie do wspomnianej wypowiedzi lub winy, bez dopowiadania jej natury.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Duch Święty
  rationale: Standardowe, współczesne polskie określenie, zachowujące osobowy tytuł obecny w kontekście.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: ani w tym wieku
  rationale: αἰών oznacza tutaj okres lub epokę, a nie przestrzenny „świat”; „wiek” zachowuje tradycyjny, lecz nadal aktualny eschatologiczny sens.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: ani w przyszłym
  rationale: Greka eliptycznie pomija ponowne użycie αἰών. Polski przymiotnik rzeczownikowy „w przyszłym” naturalnie zachowuje tę elipsę i wskazuje na wiek wspomniany wcześniej.
theological_decisions:
- issue: Czasowy kontrast między αἰών a ὁ μέλλων
  choice: ani w tym wieku, ani w przyszłym
  alternative: ani w tym świecie, ani w przyszłym świecie; ani w tym wieku, ani w wieku, który ma nadejść
  rationale: Tekst przeciwstawia dwa okresy, nie dwa przestrzenne światy. Zachowano grecką elipsę w drugim członie i nie narzucono szczegółowego systemu eschatologicznego.
- issue: Charakter nieprzebaczalnego wystąpienia przeciw Duchowi Świętemu
  choice: Zachować samo ostrzeżenie tekstu bez dodatkowej definicji doktrynalnej
  alternative: Objaśnić je jako jednorazowe historyczne oskarżenie wobec czynów Jezusa albo jako ostateczny brak skruchy
  rationale: Ten werset podaje skutek wypowiedzi przeciw Duchowi Świętemu, lecz sam nie formułuje pełnej późniejszej definicji teologicznej. Przekład nie powinien rozstrzygać tego ponad treść źródła.
translation_notes:
  register: Współczesny, godny rejestr z zachowaniem utrwalonych tytułów „Syn Człowieczy” i „Duch Święty”. Składnia pozostaje bliska greckiemu kontrastowi, ale jest naturalna po polsku. Myślnik wzmacnia końcowe, dwuczłonowe ostrzeżenie bez dodawania treści.
