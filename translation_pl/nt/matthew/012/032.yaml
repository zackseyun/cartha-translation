  to: I kto powie coś przeciwko Synowi Człowieczemu[a], temu zostanie przebaczone. Kto jednak powie coś przeciwko Duchowi Świętemu, temu nie zostanie przebaczone — ani w tym wieku[b], ani w przyszłym wieku[c].
