  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: pl
  text: Bo na podstawie swoich słów zostaniesz uznany za sprawiedliwego[a] i na podstawie swoich słów zostaniesz potępiony.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zostaniesz uniewinniony” albo „twoja słuszność zostanie potwierdzona”. Grecki czasownik może mieć sens sądowy: zostać uznanym za tego, kto ma słuszność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: na podstawie
  rationale: Przy dopełniaczu ἐκ wskazuje tu podstawę lub materiał dowodowy sądu. Polskie „na podstawie” jasno oddaje sens sądowy, naturalniej niż dosłowne „z”.
- source_word: γάρ
  choice: bo
  rationale: Spójnik wprowadza uzasadnienie wcześniejszej przestrogi dotyczącej mowy; „bo” zachowuje jego objaśniająco-przyczynową funkcję.
- source_word: λόγων
  choice: słów
  rationale: Liczba mnoga odnosi się do wypowiadanych słów. Powtórzenie tego rzeczownika zachowuje paralelizm tekstu greckiego.
- source_word: σου
  choice: swoich
  rationale: Greckie „twoich” odnosi się do podmiotu czasowników w drugiej osobie. W naturalnej polszczyźnie zaimek zwrotny „swoich” jednoznacznie wskazuje na słowa osoby, do której skierowana jest wypowiedź.
- source_word: δικαιωθήσῃ
  choice: zostaniesz uznany za sprawiedliwego
  rationale: 'Przyszła strona bierna δικαιόω ma w zestawieniu z καταδικάζω sens sądowy: orzeczenie, że ktoś jest po właściwej stronie prawa. Rozwinięty odpowiednik jest zrozumiały we współczesnej polszczyźnie i zachowuje związek ze sprawiedliwością.'
- source_word: καταδικασθήσῃ
  choice: zostaniesz potępiony
  rationale: Czasownik ma sens sądowy i tworzy zamierzoną antytezę wobec δικαιωθήσῃ. „Zostaniesz potępiony” jest utrwalonym, jasnym odpowiednikiem, choć może obejmować zarówno uznanie za winnego, jak i niekorzystny wyrok.
theological_decisions:
- issue: Sądowy sens δικαιόω w odniesieniu do słów i sądu
  choice: „zostaniesz uznany za sprawiedliwego” jako orzeczenie sądowe wydane na podstawie słów
  alternative: „zostaniesz uniewinniony” lub „twoja słuszność zostanie potwierdzona”
  rationale: Bezpośrednia antyteza z „zostaniesz potępiony” wskazuje na kontekst sądowy. Przekład nie rozstrzyga ponad tekst, w jaki sposób słowa odnoszą się do szerszej nauki o usprawiedliwieniu; przedstawia je jako podstawę lub dowód w sądzie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Powtórzenie „na podstawie swoich słów” zachowuje emfatyczny paralelizm oryginału. Sformułowanie „uznany za sprawiedliwego” jest bardziej objaśniające niż techniczne „usprawiedliwiony”, a przypis zachowuje alternatywne odcienie sądowe.
