id: MAT.12.44
reference: Matthew 12:44
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: pl
  text: 'Wtedy mówi: „Wrócę do swojego domu, z którego wyszedłem”. A gdy przychodzi, zastaje go pustym[a], wymiecionym i uporządkowanym[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „niezamieszkanym”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „ozdobionym” albo „przystrojonym”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Zwięzły, naturalny odpowiednik przysłówka czasowego, wprowadzający kolejny etap opowieści.
- source_word: λέγει
  choice: mówi
  rationale: Zachowano czas teraźniejszy narracyjny. Podmiotem domyślnym jest duch nieczysty wspomniany w poprzednim wersecie; polszczyzna pozwala naturalnie pominąć zaimek.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Wrócę do swojego domu
  rationale: „Wrócę” naturalnie oddaje ἐπιστρέψω, a „swojego domu” zachowuje roszczenie wyrażone przez zaimek μου.
- source_word: ὅθεν ἐξῆλθον
  choice: z którego wyszedłem
  rationale: Zachowuje konkretny obraz wyjścia z domu i naturalnie łączy zdanie względne z jego poprzednikiem.
- source_word: ἐλθὸν
  choice: gdy przychodzi
  rationale: Imiesłów aorystu oddano zdaniem czasowym, które jasno ukazuje czynność poprzedzającą znalezienie domu, a zarazem współgra z żywym czasem teraźniejszym narracji.
- source_word: εὑρίσκει
  choice: zastaje go
  rationale: W odniesieniu do stanu domu polskie „zastaje” jest bardziej idiomatyczne niż „znajduje”; zaimek „go” wskazuje na dom będący domyślnym dopełnieniem greckich imiesłowów.
- source_word: σχολάζοντα
  choice: pustym
  rationale: W kontekście domu słowo oznacza stan pustki lub niezajęcia. „Pustym” jest naturalne i zachowuje otwartą możliwość rozumienia jako „niezamieszkanym”; tę alternatywę podano w przypisie.
- source_word: σεσαρωμένον
  choice: wymiecionym
  rationale: 'Oddaje rezultat dokonanej czynności wyrażony imiesłowem perfectum strony biernej: dom znajduje się w stanie po wymieceniu.'
- source_word: κεκοσμημένον
  choice: uporządkowanym
  rationale: κοσμέω może znaczyć „porządkować” albo „ozdabiać”. W kontekście stanu domu „uporządkowanym” jest neutralne, a możliwe znaczenie „ozdobionym” zachowano w przypisie.
theological_decisions:
- issue: Metaforyczny sens „domu” w wypowiedzi o powracającym duchu nieczystym
  choice: Zachować dosłowne słowo „dom” bez objaśniania go w tekście jako „człowiek” lub „życie”.
  alternative: „Wrócę do człowieka, z którego wyszedłem”.
  rationale: Sam werset posługuje się obrazem domu. Zachowanie tego obrazu nie narzuca interpretacji metafory i podtrzymuje retoryczne napięcie wypowiedzi.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano żywy czas teraźniejszy narracji oraz metaforę domu. Szyk wypowiedzi bezpośredniej jest naturalny dla języka polskiego, a trzy określenia stanu domu tworzą równoległy ciąg.
