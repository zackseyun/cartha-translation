id: MAT.12.40
reference: Matthew 12:40
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: pl
  text: Jak bowiem Jonasz był w brzuchu wielkiego stworzenia morskiego[a] przez trzy dni i trzy noce[c], tak Syn Człowieczy będzie w sercu ziemi[b] przez trzy dni i trzy noce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wielkiej ryby”. Greckie słowo oznacza duże stworzenie morskie i jest szersze niż ścisłe określenie zoologiczne.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „w sercu ziemi” może odnosić się do pogrzebania, grobu, głębi ziemi albo krainy umarłych; w tekście głównym zachowano grecką metaforę.
    reason: alternative_reading
  - marker: c
    text: Wyrażenie „trzy dni i trzy noce” bywa rozumiane idiomatycznie jako obejmujące części trzech dni, inni jednak odczytują je ściślej.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Jak bowiem
  rationale: Zachowuje zarówno porównawczą funkcję ὥσπερ, jak i wyjaśniająco-łączącą funkcję γάρ, a przy tym brzmi naturalnie po polsku.
- source_word: Ἰωνᾶς
  choice: Jonasz
  rationale: Utrwalona polska forma biblijnego imienia.
- source_word: ἐν τῇ κοιλίᾳ
  choice: w brzuchu
  rationale: κοιλία oznacza tutaj brzuch lub wnętrze ciała; „w brzuchu” jest bezpośrednie, zrozumiałe i zachowuje obraz narracji.
- source_word: τοῦ κήτους
  choice: wielkiego stworzenia morskiego
  rationale: κῆτος określa duże stworzenie morskie i nie wymusza ścisłej klasyfikacji zoologicznej. To sformułowanie unika zarówno zawężenia do ryby, jak i nacechowanego mitologicznie „potwora”.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: przez trzy dni i trzy noce
  rationale: Wiernie oddaje dwukrotnie występujące określenie czasu; przyimek „przez” naturalnie wyraża w polszczyźnie trwanie.
- source_word: οὕτως
  choice: tak
  rationale: Zwięźle i naturalnie wprowadza drugi człon porównania.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tego tytułu, zachowujący jego biblijne odniesienia.
- source_word: ἔσται
  choice: będzie
  rationale: Prosty odpowiednik czasu przyszłego czasownika εἰμί, bez dodawania niewyrażonego aspektu trwania.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: w sercu ziemi
  rationale: Zachowuje metaforę καρδία i nie rozstrzyga, czy chodzi o grób, pogrzebanie, głębię ziemi czy krainę umarłych.
theological_decisions:
- issue: Znaczenie wyrażenia „serce ziemi”
  choice: Pozostawiono metaforyczne „w sercu ziemi” bez interpretacyjnego rozwinięcia.
  alternative: „w grobie”, „w głębi ziemi” albo „w krainie umarłych”
  rationale: Greckie wyrażenie nie rozstrzyga jednoznacznie między tymi interpretacjami; przekład zachowuje jego metaforyczność i napięcie teologiczne.
- issue: Znaczenie wyrażenia „trzy dni i trzy noce”
  choice: Zachowano dosłowne określenie czasu.
  alternative: Semicki idiom obejmujący części trzech dni albo ściśle siedemdziesiąt dwie godziny
  rationale: Tekst wyraźnie podaje tę formułę, lecz sam nie rozstrzyga sporu o sposób jej rachuby, dlatego nie należy interpretować jej w tekście głównym.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia „Jak bowiem… tak…” zachowuje wyraźną budowę porównania. Metaforyczne „serce ziemi” pozostaje bez interpretacyjnego doprecyzowania.
