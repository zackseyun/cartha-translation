source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: pl
  text: Jezus jednak, wiedząc o tym[a], wycofał się stamtąd. Wielu poszło za Nim, a On uzdrowił ich wszystkich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dowiedziawszy się o tym”. W tekście greckim przedmiot czasownika „wiedzieć” pozostaje domyślny; wynika z poprzedniego wersetu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: wiedząc o tym
  rationale: Imiesłów aorystu wskazuje na świadomość poprzedzającą i motywującą odejście. Zaimek „tym” naturalnie odsyła do zamiaru faryzeuszy z poprzedniego wersetu, nie precyzując go ponad tekst.
- source_word: ἀνεχώρησεν
  choice: odszedł
  rationale: Czasownik oznacza oddalenie się lub wycofanie z danego miejsca, w tym kontekście wobec narastającego sprzeciwu. „Odszedł” brzmi naturalnie po polsku i nie sugeruje lękliwej ucieczki.
- source_word: ἐκεῖθεν
  choice: stamtąd
  rationale: Zwięzły i naturalny polski odpowiednik wyrażający ruch z miejsca wskazanego przez kontekst.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Wielu poszło za Nim
  rationale: πολλοί oznacza po prostu „wielu”, bez wyraźnego rzeczownika „tłumy”. Zwrot „pójść za kimś” naturalnie oddaje tutaj ἀκολουθέω z celownikiem.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: W ewangelicznym kontekście θεραπεύω oznacza przywrócenie zdrowia; „uzdrowił” jest jasnym i utrwalonym odpowiednikiem.
- source_word: αὐτοὺς πάντας
  choice: ich wszystkich
  rationale: Oddaje pełny zakres πάντας i zachowuje naturalny polski szyk.
theological_decisions:
- issue: Domyślny przedmiot γνοὺς
  choice: wiedząc o tym
  alternative: wiedząc; dowiedziawszy się o tym
  rationale: Greka nie podaje przedmiotu czasownika wprost. „O tym” zachowuje odesłanie do poprzedniego wersetu, ale nie rozstrzyga dokładniej, w jaki sposób Jezus posiadł tę wiedzę.
- issue: Charakter odejścia Jezusa
  choice: odszedł
  alternative: wycofał się; oddalił się
  rationale: „Odszedł” zachowuje sens zmiany miejsca w reakcji na sprzeciw, nie narzucając interpretacji, że Jezus uciekł ze strachu. Przysłówek „stamtąd” dopełnia kierunkowy sens zdania.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Wielką literę w zaimku „Nim” zastosowano jako polską konwencję odnoszącą się do Jezusa. Spójnik δέ oddano przez „jednak”, natomiast kolejne καί zróżnicowano składniowo, aby uniknąć mechanicznego nagromadzenia „i”.
