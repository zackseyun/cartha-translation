  source_fidelity: Tekst wiernie oddaje greckie Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ. „Ten zaś rodzaj” zachowuje eliptyczne γένος bez dopowiadania „demonów”; „nie wychodzi inaczej, jak tylko” właściwie przekazuje negację wraz z εἰ μὴ; „przez modlitwę i post” trafnie oddaje instrumentalno-okolicznościowy sens ἐν προσευχῇ καὶ νηστείᾳ.
  naturalness: Brzmienie jest zrozumiałe, współczesne i ma stosownie powściągliwy rejestr biblijny. Szyk „Ten zaś rodzaj” jest w tym krótkim, kontekstowo zależnym zdaniu naturalny i zachowuje funkcję δέ.
  terminology: „Rodzaj”, „modlitwa” i „post” są trafnymi, ustalonymi odpowiednikami. Nie wprowadzono wyznaniowych ani interpretacyjnych dopowiedzeń. Przypis poprawnie przedstawia złożoną sytuację tekstualną i nie przesądza ponad ostrożne „prawdopodobnie”.
