source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: pl
  text: Ten zaś rodzaj[a] nie wychodzi inaczej, jak tylko przez modlitwę i post.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wersetu tego nie ma w najwcześniejszych rękopisach greckich, w tym w pochodzących z IV wieku Kodeksie Synajskim i Kodeksie Watykańskim, ani we wczesnych przekładach syryjskich i koptyjskich. Występuje natomiast w większościowej tradycji bizantyjskiej, tradycji łacińskiej oraz w większości świadków syryjskich. Prawdopodobnie został dodany przez późniejszych kopistów w celu uzgodnienia tekstu z Mk 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: rodzaj
  rationale: W tym kontekście oznacza kategorię lub klasę duchów; polskie „rodzaj” zachowuje ogólność greckiego rzeczownika i nie dopowiada ponad tekst.
- source_word: ἐκπορεύεται
  choice: wychodzi
  rationale: Czasownik opisuje wyjście ducha z opętanego człowieka; „wychodzi” jest naturalnym i bezpośrednim odpowiednikiem w tym kontekście.
- source_word: εἰ μὴ
  choice: nie inaczej, jak tylko
  rationale: Konstrukcja ma sens wyłączający. Takie sformułowanie naturalnie oddaje po polsku znaczenie „wyłącznie przez” i pasuje do przeczenia οὐκ.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: przez modlitwę i post
  rationale: Greckie ἐν wyraża tu środek lub okoliczność; „przez” jasno oddaje instrumentalny sens, zachowując oba równorzędne rzeczowniki.
theological_decisions:
- issue: Odniesienie wyrażenia „ten rodzaj”
  choice: Pozostawiono samo „ten rodzaj” bez dodania słowa „demonów”.
  alternative: „ten rodzaj demonów”
  rationale: Kontekst wskazuje na duchy, lecz rzeczownik „demonów” nie występuje w greckim tekście. Zachowanie elipsy pozwala uniknąć dopowiedzenia interpretacyjnego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „Ten zaś rodzaj” zachowuje przeciwstawny odcień δέ, a zarazem brzmi naturalnie w polszczyźnie biblijnej bez nadmiernej archaizacji.
