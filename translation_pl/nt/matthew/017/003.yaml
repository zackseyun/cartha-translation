id: MAT.17.3
reference: Matthew 17:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: pl
  text: I oto ukazali się im Mojżesz i Eliasz, którzy rozmawiali z nim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Naturalny polski wykładnik zwracający uwagę, zachowujący nagłość i obrazowość sceny bez nadmiernie archaicznego brzmienia.
- source_word: ὤφθη
  choice: ukazali się
  rationale: Grecka forma jest formalnie bierna, lecz w tym użyciu idiomatycznie oznacza widzialne ukazanie się. Polska konstrukcja „ukazali się im” jest naturalna i nie dopowiada sposobu obecności.
- source_word: αὐτοῖς
  choice: im
  rationale: Celownik wskazuje osoby będące świadkami ukazania się; „im” najzwięźlej zachowuje tę relację.
- source_word: Μωϋσῆς
  choice: Mojżesz
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: Ἠλίας
  choice: Eliasz
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: συλλαλοῦντες
  choice: którzy rozmawiali
  rationale: Imiesłów wyraża wzajemną rozmowę; zdanie względne brzmi po polsku naturalnie i jasno, zachowując równoczesność czynności w kontekście narracyjnym.
- source_word: μετ’ αὐτοῦ
  choice: z nim
  rationale: μετά z dopełniaczem oznacza towarzyszenie lub udział we wspólnej czynności. Zaimek pozostawiono bez zastępowania go imieniem Jezusa, zgodnie z greckim tekstem.
theological_decisions:
- issue: Odniesienie zaimka αὐτοῦ
  choice: „nim” odnosi się w kontekście do Jezusa
  alternative: Zastąpić zaimek imieniem „Jezusem”
  rationale: Kontekst przemienienia jednoznacznie wskazuje Jezusa, ale zachowanie zaimka wierniej oddaje grecki tekst i nie wymaga dopowiedzenia.
- issue: Charakter ukazania się Mojżesza i Eliasza
  choice: Widzialne ukazanie się, bez określania sposobu ich obecności
  alternative: „zostali przez nich zobaczeni”
  rationale: Tekst przedstawia ich jako widocznych dla świadków, lecz nie objaśnia ontologicznego ani fizycznego charakteru tego wydarzenia; przekład nie powinien go rozstrzygać.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „I oto” zachowuje narracyjne καὶ ἰδοὺ, a „ukazali się im” jest naturalnym polskim odpowiednikiem idiomatycznego biernego ὤφθη. Bez przypisu, ponieważ formalnie bierną alternatywę można objaśnić w aparacie translatorskim, ale nie jest ona potrzebna zwykłemu czytelnikowi tego wersetu.
