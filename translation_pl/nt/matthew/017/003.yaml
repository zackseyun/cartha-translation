  terminology: Użyto utrwalonych polskich form imion biblijnych („Mojżesz”, „Eliasz”). „Ukazali się” trafnie przekazuje widzialne pojawienie się bez narzucania wyjaśnienia natury tego wydarzenia. Zaimek „nim” słusznie pozostaje zaimkiem, jak w tekście greckim.
