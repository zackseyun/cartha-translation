    rationale: W zdaniu „Gdy przyszli do tłumu, podszedł do niego pewien człowiek” zaimek może naturalnie zostać powiązany z bezpośrednio poprzedzającym rzeczownikiem „tłumu”, nie z Jezusem, do którego odnosi się αὐτῷ.
  - severity: low
    issue: „Uklęknął” zaciera imiesłowowy charakter γονυπετῶν
    rationale: Grecki imiesłów teraźniejszy przedstawia klęczenie jako czynność towarzyszącą podejściu. „Klękając” zachowuje tę relację bliżej, pozostając naturalne po polsku.
