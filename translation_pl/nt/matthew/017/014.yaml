  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: pl
  text: Gdy przyszli do tłumu, pewien człowiek podszedł do Jezusa, klękając przed nim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Gdy
  rationale: Grecki spójnik łączy zdanie z poprzednią narracją; w połączeniu z imiesłowem ἐλθόντων naturalna polska konstrukcja czasowa „Gdy przyszli” oddaje tok opowiadania bez wymuszonego „I”.
- source_word: ἐλθόντων
  choice: przyszli
  rationale: Aorystyczny imiesłów w dopełniaczu absolutnym ma domyślny podmiot w liczbie mnogiej. Zdanie „Gdy przyszli” naturalnie zachowuje relację czasową.
- source_word: πρὸς τὸν ὄχλον
  choice: do tłumu
  rationale: ὄχλος oznacza zgromadzony tłum; przyimek πρός z biernikiem wyraża ruch ku niemu. „Do tłumu” jest naturalnym współczesnym odpowiednikiem.
- source_word: προσῆλθεν αὐτῷ
  choice: podszedł do niego
  rationale: προσέρχομαι oznacza podejście lub zbliżenie się do osoby, a zaimek w celowniku wskazuje osobę, do której mężczyzna podszedł.
- source_word: ἄνθρωπος
  choice: pewien człowiek
  rationale: W tym kontekście rzeczownik wskazuje konkretną, wcześniej niewspomnianą osobę płci męskiej. „Pewien człowiek” brzmi naturalnie narracyjnie i nie dodaje informacji ponad tekst.
- source_word: γονυπετῶν αὐτόν
  choice: uklęknął przed nim
  rationale: Imiesłów opisuje przyjęcie postawy na kolanach wobec Jezusa. Polska forma osobowa płynnie łączy tę czynność z podejściem i zachowuje jej kierunek osobowy.
theological_decisions:
- issue: Czy γονυπετῶν wyraża samo uklęknięcie, czy jednoznacznie akt kultu
  choice: uklęknął przed nim
  alternative: padł przed nim na kolana
  rationale: Wyrażenie jasno opisuje gest cielesny skierowany ku Jezusowi, lecz samo w sobie nie rozstrzyga pełnego znaczenia teologicznego tego gestu. Neutralne „ukląkł przed nim” zachowuje tę otwartość.
- issue: Oddanie ἄνθρωπος jako określenia konkretnej osoby
  choice: pewien człowiek
  alternative: pewien mężczyzna
  rationale: Kontekst odnosi rzeczownik do konkretnego mężczyzny, ale zwykłym narracyjnym odpowiednikiem ἄνθρωπος jest tutaj „człowiek”; przekład nie wprowadza szerszych twierdzeń antropologicznych.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Zachowano zwięzłość greckiego zdania i nie dodano przypisów, ponieważ warianty leksykalne można naturalnie oddać w tekście bez istotnej utraty znaczenia.
