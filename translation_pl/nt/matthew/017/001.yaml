source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: pl
  text: A po sześciu dniach Jezus bierze ze sobą Piotra, Jakuba oraz jego brata Jana i wyprowadza ich na wysoką górę, na osobności.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „osobno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: po sześciu dniach
  rationale: Naturalny polski odpowiednik wyrażenia oznaczającego następstwo czasowe; zachowuje ścisłe powiązanie z poprzednią sceną.
- source_word: παραλαμβάνει
  choice: bierze ze sobą
  rationale: Oddaje nie tylko samo „branie”, lecz zabranie wskazanych osób jako towarzyszy.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Piotra, Jakuba i Jana
  rationale: Utrwalone polskie formy imion biblijnych.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: jego brata Jana
  rationale: Składnia najnaturalniej wskazuje, że Jan jest bratem Jakuba; polski szyk jasno przekazuje tę relację.
- source_word: ἀναφέρει
  choice: prowadzi ... na
  rationale: Czasownik wyraża ruch ku górze; w połączeniu z górą polskie „prowadzi na” naturalnie komunikuje wejście.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: na wysoką górę
  rationale: Idiomaticzny polski sposób określenia celu ruchu i wznoszenia się.
- source_word: κατ’ ἰδίαν
  choice: osobno
  rationale: Zwięźle oddaje odłączenie Jezusa i trzech uczniów od pozostałych; możliwe jest też znaczenie „na osobności”.
theological_decisions:
- issue: Historyczny czas teraźniejszy w narracji ewangelicznej
  choice: 'Zachowano czas teraźniejszy: „Jezus bierze ... prowadzi”.'
  alternative: 'Czas przeszły: „Jezus wziął ... zaprowadził”.'
  rationale: Greckie παραλαμβάνει i ἀναφέρει są formami czasu teraźniejszego użytymi dla ożywienia narracji. Taki zabieg jest zrozumiały także we współczesnej polszczyźnie i nie wymaga spłaszczenia do czasu przeszłego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Konstrukcja „bierze ze sobą” precyzyjnie oddaje παραλαμβάνει, a „po czym” naturalnie łączy dwa kolejne działania bez nadmiernego powtarzania spójnika.
