  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: pl
  text: 'A Jezus podszedł, dotknął ich i powiedział: „Wstańcie i nie bójcie się”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: podszedł
  rationale: Czasownik προσέρχομαι oznacza podejście lub przyjście do kogoś; „podszedł” naturalnie oddaje ukierunkowany ruch Jezusa ku uczniom.
- source_word: ἁψάμενος αὐτῶν
  choice: dotknął ich
  rationale: Imiesłów aorystu od ἅπτω z dopełnieniem w dopełniaczu oznacza dotknięcie. Polski szereg czasowników brzmi naturalnie i nie precyzuje sposobu dotyku ponad tekst grecki.
- source_word: εἶπεν
  choice: powiedział
  rationale: Zwykły i bezpośredni odpowiednik λέγω w tej formule narracyjnej.
- source_word: Ἐγέρθητε
  choice: Wstańcie
  rationale: Nakaz dotyczy podniesienia się uczniów, którzy według poprzedniego wersetu upadli na twarz. „Wstańcie” jest naturalne i nie narzuca bardziej szczegółowej pozycji końcowej.
- source_word: μὴ φοβεῖσθε
  choice: nie bójcie się
  rationale: Naturalny polski odpowiednik zakazu wyrażonego przez φοβέομαι; zachowuje uspokajający ton bez przesądzania, że forma teraźniejsza musi znaczyć „przestańcie się bać”.
- source_word: καὶ
  choice: wtedy / i
  rationale: Pierwsze καί oddano narracyjnym „wtedy”, a kolejne spójniki przez naturalne połączenie czynności; zachowano prosty ciąg wydarzeń bez dodawania treści.
theological_decisions:
- issue: Oddanie uspokajającego nakazu Jezusa bez dodawania interpretacji duszpasterskiej
  choice: „Wstańcie i nie bójcie się”
  alternative: „Podnieście się i nie lękajcie się”
  rationale: Przekład zachowuje zarówno fizyczny nakaz powstania, jak i wezwanie do porzucenia lęku, bez rozwijania ich znaczenia doktrynalnego.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. „Podszedł” i „nie bójcie się” są zrozumiałe w zwykłej polszczyźnie, a zarazem odpowiednie dla tekstu biblijnego. Nie dodano przypisów, ponieważ warianty leksykalne nie wnoszą istotnej, niedającej się zachować w tekście głównym wieloznaczności.
