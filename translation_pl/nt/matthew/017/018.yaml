source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: pl
  text: Jezus zgromił go[a], a demon wyszedł z niego. Od tamtej chwili[b] chłopiec był uzdrowiony.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zaimek grecki może gramatycznie odnosić się do chłopca lub do demona; dalszy ciąg wskazuje, że Jezus zgromił demona.
    reason: source_ambiguity
  - marker: b
    text: 'Dosłownie: „od tamtej godziny”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: zgromił
  rationale: Czasownik ἐπιτιμάω oznacza stanowcze skarcenie lub zgromienie; w opisie egzorcyzmu „zgromił” naturalnie oddaje autorytatywny charakter działania Jezusa bez sprowadzania go jedynie do wydania rozkazu.
- source_word: αὐτῷ
  choice: go
  rationale: Grecki zaimek w celowniku może w tym kontekście odnosić się gramatycznie do chłopca albo demona. Polskie „go” zachowuje zaimkową formę i nie zastępuje jej dopowiedzeniem nieobecnym w tekście; dalszy ciąg zdecydowanie wskazuje na demona jako adresata zgromienia.
- source_word: τὸ δαιμόνιον
  choice: demon
  rationale: „Demon” jest bezpośrednim i współczesnym odpowiednikiem δαιμόνιον. Określenie „duch nieczysty” wprowadzałoby sformułowanie, którego w tym wersecie nie ma.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: wyszedł z niego
  rationale: Sformułowanie wiernie zachowuje obraz wyjścia demona z chłopca i jest naturalne w polskim języku biblijnym.
- source_word: ἐθεραπεύθη
  choice: był zdrowy
  rationale: Grecki aoryst strony biernej opisuje dokonane uzdrowienie. W połączeniu z wyrażeniem „od tamtej chwili” polskie „był zdrowy” naturalnie oddaje zarówno skutek, jak i jego trwanie; dosłowniejsze „został uzdrowiony” również jest możliwe.
- source_word: ὁ παῖς
  choice: chłopiec
  rationale: W szerszym kontekście chodzi o syna ojca proszącego Jezusa o pomoc, dlatego „chłopiec” jest trafniejsze niż ogólne „dziecko” i wyklucza kontekstowo nieodpowiednie znaczenie „sługa”.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: od tamtej chwili
  rationale: Choć ὥρα dosłownie znaczy „godzina”, całe wyrażenie idiomatycznie wskazuje na moment, od którego utrzymywał się skutek uzdrowienia. „Od tamtej chwili” brzmi naturalnie we współczesnej polszczyźnie.
theological_decisions:
- issue: Adresat zgromienia wyrażony zaimkiem αὐτῷ
  choice: W tekście zachowano zaimek „go”, przy czym kontekst wskazuje na demona.
  alternative: 'Jezus zgromił chłopca albo jawnie: „Jezus zgromił demona”.'
  rationale: Bezpośredni ciąg zdarzeń — demon wyszedł z chłopca — mocno przemawia za tym, że Jezus zgromił demona. Przypis zachowuje jednak gramatyczną możliwość odniesienia zaimka do chłopca i nie ukrywa formalnej niejednoznaczności.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zdania są krótkie i zachowują kolejność wydarzeń w greckim tekście. „Zgromił” utrzymuje mocny, utrwalony rejestr opisu egzorcyzmu, natomiast „od tamtej chwili” unika nienaturalnego we współczesnym polskim dosłownego kalkowania idiomu czasowego.
