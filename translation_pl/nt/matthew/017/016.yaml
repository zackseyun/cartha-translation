  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: pl
  text: I przyprowadziłem go do twoich uczniów i nie byli w stanie go uzdrowić.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „nie mogli go uzdrowić”.'
    reason: Alternatywne, bardziej zwięzłe oddanie οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
lexical_decisions:
- source_word: προσήνεγκα
  choice: przyprowadziłem
  rationale: Aoryst od προσφέρω oznacza tutaj przyprowadzenie osoby do kogoś. „Przyprowadziłem” naturalnie oddaje czynność odnoszącą się do chłopca.
- source_word: μαθηταῖς σου
  choice: do twoich uczniów
  rationale: W kontekście Ewangelii μαθητής oznacza ucznia i oddanego naśladowcę nauczyciela; „twoich uczniów” jest jasnym, utrwalonym odpowiednikiem.
- source_word: οὐκ ἠδυνήθησαν
  choice: nie byli w stanie
  rationale: δύναμαι wyraża możliwość lub zdolność. Sformułowanie „nie byli w stanie” zachowuje ten odcień, nie podając przyczyny niepowodzenia.
- source_word: θεραπεῦσαι
  choice: uzdrowić
  rationale: θεραπεύω oznacza tu przywrócenie zdrowia cierpiącemu chłopcu; „uzdrowić” jest naturalne w opisie ewangelicznego uzdrowienia.
- source_word: καὶ ... καὶ
  choice: I ... ale
  rationale: Pierwsze καί zachowano jako „I”, łączące wypowiedź z poprzednim kontekstem. Drugie oddano naturalnym polskim „ale”, ponieważ relacja między przyprowadzeniem chłopca a nieskutecznością uczniów ma w tym zdaniu wyraźny sens przeciwstawny, choć greckie καί samo w sobie jest ogólnym spójnikiem łącznym.
- source_word: αὐτόν
  choice: go
  rationale: Zaimek odnosi się do wspomnianego w kontekście syna lub chłopca; polskie „go” jest bezpośrednim i naturalnym odpowiednikiem.
theological_decisions:
- issue: Charakter niepowodzenia uczniów
  choice: Przekład stwierdza jedynie, że uczniowie nie byli w stanie uzdrowić chłopca.
  alternative: Dopowiedzieć, że nie mogli wypędzić demona albo że zawiedli z powodu niewiary.
  rationale: Sam werset mówi o niemożności uzdrowienia i nie wyjaśnia jej przyczyny. Wyjaśnień z dalszego kontekstu nie należy wprowadzać do treści tego zdania.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze standardową współczesną polszczyzną; przekład nie dodaje wyjaśnienia przyczyny niepowodzenia uczniów.
