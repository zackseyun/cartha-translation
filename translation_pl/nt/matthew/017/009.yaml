id: MAT.17.9
reference: Matthew 17:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: pl
  text: 'Kiedy schodzili z góry, Jezus nakazał im: „Nikomu nie mówcie o tym widzeniu[a], dopóki Syn Człowieczy nie zostanie wskrzeszony z martwych[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „o tym, co zobaczyliście”. Grecki tekst mówi dosłownie o „widzeniu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „spośród umarłych”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν
  choice: kiedy schodzili
  rationale: Imiesłów czasu teraźniejszego w konstrukcji genetivus absolutus wskazuje na czynność równoczesną i trwającą; polskie „kiedy schodzili” oddaje to naturalnie.
- source_word: ἐκ τοῦ ὄρους
  choice: z góry
  rationale: Prosty i idiomatyczny odpowiednik wyrażenia przestrzennego, zachowujący określoność góry znanej z kontekstu.
- source_word: ἐνετείλατο αὐτοῖς
  choice: nakazał im
  rationale: Czasownik oznacza wydanie wiążącego polecenia; „nakazał” zachowuje jego stanowczą siłę.
- source_word: λέγων
  choice: ':'
  rationale: W języku polskim imiesłów „mówiąc” po czasowniku wprowadzającym wypowiedź byłby zbędny i nienaturalny; dwukropek wiernie sygnalizuje przytoczenie treści nakazu.
- source_word: Μηδενὶ εἴπητε
  choice: Nikomu nie mówcie
  rationale: Naturalny polski zakaz zachowujący wysunięte na początek, emfatyczne „nikomu”.
- source_word: τὸ ὅραμα
  choice: to widzenie
  rationale: „Widzenie” zachowuje możliwy nadprzyrodzony i objawieniowy odcień greckiego ὅραμα, nie sprowadzając go jedynie do zwykłego oglądania.
- source_word: ἕως οὗ
  choice: dopóki ... nie
  rationale: To naturalna polska konstrukcja wyznaczająca kres obowiązywania zakazu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony i trafny przekład tytułu, zachowujący jego biblijne oraz teologiczne odniesienia bez parafrazy.
- source_word: ἐκ νεκρῶν
  choice: z martwych
  rationale: Utrwalony, zrozumiały polski zwrot dotyczący zmartwychwstania; dosłowniejszy sens „spośród umarłych” podano w przypisie.
- source_word: ἐγερθῇ
  choice: nie zostanie wskrzeszony
  rationale: Forma bierna zachowuje stronę greckiego czasownika i nie dopowiada wprost sprawcy działania.
theological_decisions:
- issue: Sformułowanie i strona czasownika dotyczącego zmartwychwstania
  choice: nie zostanie wskrzeszony z martwych
  alternative: nie powstanie z martwych
  rationale: Greka ma formę bierną ἐγερθῇ. Przekład bierny zachowuje gramatyczną postać tekstu oraz sugestię Bożego działania, nie wskazując jednak sprawcy bardziej jednoznacznie niż oryginał.
- issue: Charakter wydarzenia określonego jako ὅραμα
  choice: widzenie
  alternative: to, co zobaczyliście
  rationale: „Widzenie” zachowuje objawieniowy odcień rzeczownika, lecz przypis pozostawia otwartą możliwość bardziej opisowego rozumienia jako tego, co uczniowie zobaczyli.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Składnia została lekko unaturalniona przez zastąpienie greckiego imiesłowu λέγων dwukropkiem, bez utraty treści. Tradycyjny tytuł „Syn Człowieczy” oraz bierna forma „zostanie wskrzeszony” zachowują teologiczną nośność i napięcie oryginału.
