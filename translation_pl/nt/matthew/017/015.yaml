base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: pl
  text: 'i powiedział: „Panie, zmiłuj się nad moim synem, bo miewa napady[a] i strasznie cierpi. Często bowiem wpada w ogień, a często w wodę”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecki czasownik dosłownie wiąże tę dolegliwość z księżycem i odzwierciedla starożytny sposób opisywania cierpienia objawiającego się napadami; możliwy też przekład: „ma epilepsję”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: i powiedział
  rationale: Grecki imiesłów czasu teraźniejszego łączy wypowiedź z czynnością opisaną w poprzednim wersecie. W naturalnej polskiej narracji konstrukcję tę najlepiej oddaje forma osobowa „i powiedział”.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος jest tu pełnym szacunku zwrotem do Jezusa; „Panie” zachowuje zarówno naturalność, jak i tradycyjną wagę tego tytułu.
- source_word: ἐλέησόν
  choice: zmiłuj się nad
  rationale: Tryb rozkazujący wyraża usilną prośbę o współczującą pomoc. „Zmiłuj się nad” jest naturalnym i podniosłym polskim odpowiednikiem.
- source_word: μου τὸν υἱόν
  choice: moim synem
  rationale: υἱός oznacza konkretnie syna, a nie ogólnie dziecko; przypadek wynika z polskiej składni zwrotu „zmiłować się nad”.
- source_word: σεληνιάζεται
  choice: miewa napady
  rationale: Grecki czasownik, dosłownie związany z księżycem, w starożytnym użyciu opisywał dolegliwość objawiającą się napadami. „Miewa napady” oddaje obserwowalne objawy bez narzucania współczesnej diagnozy medycznej ani dawnego wyjaśnienia ich przyczyny.
- source_word: κακῶς πάσχει
  choice: strasznie cierpi
  rationale: κακῶς wzmacnia πάσχει i wskazuje na ciężkie cierpienie; „strasznie cierpi” jest jasne, naturalne i emocjonalnie adekwatne.
- source_word: πολλάκις
  choice: często
  rationale: Zwięzły i standardowy odpowiednik greckiego przysłówka oznaczającego wielokrotne zdarzenie.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: wpada w ogień
  rationale: „Wpada” naturalnie opisuje niekontrolowane upadanie do ognia i dobrze pasuje do przedstawionych napadów.
- source_word: εἰς τὸ ὕδωρ
  choice: w wodę
  rationale: Zachowuje równoległość z wyrażeniem „w ogień” oraz prostotę greckiej konstrukcji.
theological_decisions:
- issue: Znaczenie σεληνιάζεται w kontekście uzdrowienia i egzorcyzmu
  choice: miewa napady
  alternative: jest epileptykiem; jest dotknięty przez księżyc
  rationale: Werset przytacza opis ojca, a nie techniczną diagnozę medyczną. Przekład fenomenologiczny zachowuje treść obserwacji i nie przesądza ani o współczesnej klasyfikacji choroby, ani o księżycowej przyczynie dolegliwości. Szerszego związku z opętaniem, wynikającego z kontekstu, również nie wprowadza się do samego brzmienia tego wersetu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym tonie. Zachowano powagę błagania i retoryczną równoległość końcowych członów, unikając zarazem anachronicznej diagnozy medycznej.
