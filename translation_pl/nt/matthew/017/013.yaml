    rationale: εἶπεν jest aorystem i opisuje pojedynczy akt mówienia; polskie „powiedział im” oddaje go dokładniej niż niedokonane „mówił im”.
  - severity: low
    issue: Nienaturalna alternatywa w przypisie
    rationale: „Jan, który chrzcił” nie funkcjonuje jako równoważny tytuł i może zmieniać odcień znaczenia na opis czynności w przeszłości. Przypis nie jest niezbędny dla poprawnego przekładu.
