review_pass:
  verdict: revise
  source_fidelity: Główny tekst poprawnie oddaje τότε, συνῆκαν, ὅτι, περί oraz nazwę Ἰωάννης ὁ βαπτιστής. Jednak „mówił im” (czas przeszły niedokonany) może sugerować wypowiedź trwającą lub powtarzaną, podczas gdy grecki aoryst εἶπεν odnosi się do konkretnego aktu powiedzenia. W tym kontekście naturalniejsze i bliższe źródłu jest „powiedział im”, przy zachowaniu polskiej relacji czasowej po „zrozumieli” bez wymuszania czasu zaprzeszłego.
  naturalness: „Wtedy uczniowie zrozumieli, że powiedział im o Janie Chrzcicielu” jest naturalne we współczesnej polszczyźnie biblijnej. Utrzymuje zwięzły, godny rejestr. Samo „mówił im” jest wprawdzie możliwe, lecz aspekt niedokonany jest tu mniej precyzyjny.
  terminology: '„Uczniowie” i „Jan Chrzciciel” są utrwalone, naturalne i trafne. Przypisowa alternatywa „Janie, który chrzcił” nie jest dobrym odpowiednikiem tytułu βαπτιστής: brzmi jak względna informacja o przeszłej czynności i nie oddaje rzeczownikowego określenia funkcji. Lepsze jest „Jan Chrzciciel” jako podstawowe brzmienie; alternatywnego przypisu nie trzeba dodawać.'
  issues:
