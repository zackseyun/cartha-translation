  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: pl
  text: Wtedy uczniowie zrozumieli, że powiedział im o Janie Chrzcicielu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, wskazujący moment, w którym uczniowie doszli do zrozumienia.
- source_word: συνῆκαν
  choice: zrozumieli
  rationale: Aoryst od συνίημι opisuje uchwycenie znaczenia; „zrozumieli” jest jasne, naturalne i nie wzmacnia nadmiernie sensu.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Utrwalony i trafny polski odpowiednik μαθηταί w narracji ewangelicznej.
- source_word: ὅτι
  choice: że
  rationale: Spójnik wprowadza treść tego, co uczniowie zrozumieli, a nie zdanie przyczynowe.
- source_word: περὶ Ἰωάννου τοῦ βαπτιστοῦ
  choice: o Janie Chrzcicielu
  rationale: Przyimek περί z dopełniaczem wskazuje temat wypowiedzi, a „Jan Chrzciciel” jest utrwalonym polskim określeniem tej postaci.
- source_word: εἶπεν αὐτοῖς
  choice: mówił im
  rationale: Oddaje akt mówienia skierowany do uczniów. Polski czas przeszły z aspektem niedokonanym naturalnie odnosi wypowiedź Jezusa do wcześniejszego kontekstu, bez konieczności sztucznego zaznaczania zaprzeszłości.
theological_decisions:
- issue: Utożsamienie postaci Eliasza w bezpośrednim kontekście
  choice: Werset stwierdza, że uczniowie zrozumieli, iż Jezus mówił o Janie Chrzcicielu.
  alternative: Pozostawienie referenta domyślnego lub dopowiedzenie relacji Jana do Eliasza.
  rationale: Narrator sam wyraźnie wskazuje referenta wypowiedzi. Przekład zachowuje to stwierdzenie, nie rozwijając go o dodatkową interpretację teologiczną.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zachowano utrwalone określenie „Jan Chrzciciel”, a dosłowniejszą alternatywę podano w przypisie.
