  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: pl
  text: 'Wtedy Piotr odpowiedział Jezusowi: „Panie, dobrze nam tu być. Jeśli chcesz, postawię tu trzy namioty[a]: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „szałasy”, „schronienia” lub, w tradycyjnym języku biblijnym, „przybytki”; gr. σκηνάς.'
    reason: Grecki rzeczownik σκηνάς może oznaczać namioty lub inne tymczasowe schronienia. Tradycyjne „przybytki” może także przywoływać skojarzenia kultowe bądź świąteczne.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ
  choice: Wtedy Piotr odezwał się do Jezusa
  rationale: Grecka formuła „odpowiadając, powiedział” oznacza tu reakcję Piotra na sytuację, a niekoniecznie odpowiedź na pytanie. „Odezwał się” oddaje tę funkcję naturalną współczesną polszczyzną, a δέ jako „wtedy” wskazuje dalszy tok narracji.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz „Panie” zachowuje szacunek oraz możliwą wagę teologiczną tytułu κύριος, nie zawężając go do znaczenia „Nauczycielu” lub „Mistrzu”.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: dobrze nam tu być
  rationale: Naturalny polski zwrot blisko odpowiada greckiej konstrukcji z bezokolicznikiem i zachowuje zwięzłość wypowiedzi.
- source_word: εἰ θέλεις
  choice: jeśli chcesz
  rationale: θέλω może wyrażać chęć lub wolę. „Jeśli chcesz” jest współczesne, jasne i odpowiednie w bezpośrednim zwrocie do Jezusa.
- source_word: ποιήσω
  choice: postawię
  rationale: W odniesieniu do tymczasowych konstrukcji polskie „postawię” brzmi naturalniej niż dosłowne „zrobię”, zachowując sens osobistej propozycji Piotra.
- source_word: σκηνάς
  choice: namioty
  rationale: σκηνή oznacza namiot lub tymczasowe schronienie. „Namioty” jest konkretnym, naturalnym odpowiednikiem, a inne możliwe odcienie znaczeniowe zachowano w przypisie.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza
  rationale: Powtórzenie „jeden” dla każdej osoby zachowuje rozdzielający nacisk obecny w greckim tekście.
- source_word: ὧδε
  choice: tu
  rationale: Oba wystąpienia ὧδε oddano jako „tu”, zachowując celowe powtórzenie tekstu źródłowego.
theological_decisions:
- issue: Tytuł κύριος w zwrocie do Jezusa
  choice: Panie
  alternative: Mistrzu
  rationale: „Panie” zachowuje pełniejszy zakres znaczeniowy tytułu, obejmujący zarówno pełen szacunku zwrot, jak i możliwe znaczenie teologiczne, bez rozstrzygania go w jedną stronę.
- issue: Znaczenie σκηνάς w opisie przemienienia
  choice: namioty
  alternative: szałasy, schronienia, przybytki
  rationale: Werset nie łączy tych konstrukcji wprost ze Świętem Namiotów. Neutralny i konkretny termin pozostaje więc w tekście głównym, natomiast możliwe skojarzenia kultowe i świąteczne nie zostają wykluczone dzięki przypisowi.
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Zachowano zwięzłość bez sztucznego kalkowania greckiej formuły „odpowiadając, powiedział”. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie z neutralnym standardem nowoczesnej polszczyzny i bez wprowadzania wyróżników wyznaniowych.
