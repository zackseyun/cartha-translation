  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: pl
  text: 'Wtedy uczniowie podeszli do Jezusa na osobności i powiedzieli: „Dlaczego my nie zdołaliśmy go wyrzucić?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zaimek „go” może odnosić się do demona albo do chłopca.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, wprowadzający kolejne wydarzenie.
- source_word: προσελθόντες
  choice: podeszli
  rationale: Imiesłów aorystu został naturalnie oddany czasownikiem osobowym; „podeszli” trafnie wyraża zbliżenie się uczniów do Jezusa.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Utrwalony i kontekstowo właściwy odpowiednik określający uczniów Jezusa.
- source_word: τῷ Ἰησοῦ
  choice: do Jezusa
  rationale: Cel podejścia został oddany zgodnie z naturalną polską składnią czasownika „podejść”.
- source_word: κατ’ ἰδίαν
  choice: na osobności
  rationale: Współczesne, godne i idiomatyczne wyrażenie oznaczające rozmowę bez obecności innych.
- source_word: εἶπον
  choice: powiedzieli
  rationale: Zachowuje podstawowe znaczenie λέγω; pytający charakter wypowiedzi wynika z następującego pytania.
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Naturalny odpowiednik pytania o przyczynę.
- source_word: ἡμεῖς
  choice: my
  rationale: 'Jawny zaimek zachowuje nacisk obecny w greckim tekście: dlaczego właśnie oni nie byli w stanie tego dokonać.'
- source_word: οὐκ ἠδυνήθημεν
  choice: nie zdołaliśmy
  rationale: Oddaje rzeczywistą niemożność dokonania czynności, a zarazem brzmi naturalnie po polsku.
- source_word: ἐκβαλεῖν
  choice: wyrzucić
  rationale: W kontekście egzorcyzmu odpowiada czynności wypędzenia demona i zachowuje podstawowy obraz czasownika ἐκβάλλω.
- source_word: αὐτό
  choice: go
  rationale: Polski zaimek „go” jest gramatycznie naturalny zarówno przy domyślnym odniesieniu do demona, jak i do chłopca, dzięki czemu zachowuje niejednoznaczność referencji.
theological_decisions:
- issue: Odniesienie zaimka αὐτό w kontekście egzorcyzmu
  choice: Zachowano niejednoznaczne „go”, mogące odnosić się do demona lub chłopca.
  alternative: Jednoznaczne dopowiedzenie „demona” albo „chłopca”.
  rationale: Najbliższy kontekst przemawia za demonem jako przedmiotem wyrzucenia, ale grecki zaimek może być rozumiany również jako odniesienie do chłopca. Polski pozwala zachować tę autentyczną niejednoznaczność bez sztucznego rozstrzygania.
translation_notes:
  register: Nowoczesny standardowy język polski, naturalny i godny. Szyk „Dlaczego my” zachowuje nacisk wyrażony przez greckie ἡμεῖς; „na osobności” brzmi idiomatycznie i jasno.
