  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: pl
  text: 'Jezus zaś odpowiedział: „O pokolenie niewierzące[a] i przewrotne[b]! Jak długo jeszcze będę z wami? Jak długo będę was znosił? Przyprowadźcie go tutaj do mnie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „niewierne”. Grecki przymiotnik może oznaczać zarówno brak wiary, jak i brak wierności.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „wypaczone”, „skrzywione”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jezus zaś odpowiedział
  rationale: Imiesłów z εἶπεν tworzy typową formułę „odpowiedział i rzekł”, którą naturalny współczesny polski oddaje jednym czasownikiem. „Zaś” zachowuje łagodnie kontrastowy lub przejściowy charakter δέ.
- source_word: Ὦ γενεὰ
  choice: O pokolenie
  rationale: „O” zachowuje uroczysty ton nagany i lamentu, a „pokolenie” oddaje podstawowy sens γενεά oraz jego prorockie brzmienie.
- source_word: ἄπιστος
  choice: niewierzące
  rationale: W bezpośrednim kontekście chodzi o brak wiary. Wyraz grecki może też znaczyć „niewierne”, dlatego alternatywę zachowano w przypisie.
- source_word: διεστραμμένη
  choice: przewrotne
  rationale: Imiesłów opisuje stan wypaczenia lub skrzywienia. „Przewrotne” jest naturalne, godne i zachowuje moc moralnej nagany bez współczesnych, zawężających skojarzeń słowa „perwersyjne”.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Jak długo jeszcze będę z wami?
  rationale: „Jak długo” jest naturalnym polskim odpowiednikiem ἕως πότε; „jeszcze” idiomatycznie uwydatnia zniecierpliwienie zawarte w pytaniu, nie zmieniając jego odniesienia czasowego.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Jak długo będę was znosił?
  rationale: '„Znosić kogoś” trafnie oddaje ἀνέχομαι z dopełniaczem: cierpliwie tolerować lub wytrzymywać, a zarazem zachowuje formalny ton.'
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Przyprowadźcie go tutaj do mnie
  rationale: Ponieważ chodzi o chłopca, polskie „przyprowadźcie” brzmi naturalniej niż ogólne „przynieście”, zachowując kierunek ruchu ku Jezusowi wyrażony przez μοι i ὧδε.
theological_decisions:
- issue: Zakres znaczeniowy ἄπιστος w naganie Jezusa
  choice: niewierzące
  alternative: niewierne
  rationale: Kontekst nieudanego uzdrowienia i niedostatecznej wiary przemawia za „niewierzące”, lecz przypis zachowuje możliwy sens braku wierności i nie rozstrzyga ponad miarę wieloznaczności greki.
- issue: Adresaci określenia „pokolenie”
  choice: Nie doprecyzowano adresatów w przekładzie
  alternative: Uściślenie jako uczniowie, tłum albo współcześni Jezusowi
  rationale: Sam werset nie wyznacza jednoznacznie zakresu nagany. Zachowanie ogólnego „pokolenie” nie narzuca jednej interpretacji teologicznej.
translation_notes:
  register: Współczesny, standardowy polski o podniosłym, lecz zrozumiałym rejestrze. Zachowano rytm dwóch pytań retorycznych i stanowczy rozkaz końcowy. Uniknięto „perwersyjne”, które we współczesnej polszczyźnie ma często zawężone skojarzenia seksualne.
