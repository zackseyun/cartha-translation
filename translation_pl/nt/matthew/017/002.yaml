source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: pl
  text: I został przemieniony na ich oczach[a]. Jego twarz zajaśniała jak słońce, a jego szaty stały się białe jak światło.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „został przeobrażony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: został przemieniony
  rationale: Aoryst strony biernej od μεταμορφόω oznacza widzialną zmianę postaci. „Został przemieniony” jest naturalnym i utrwalonym polskim odpowiednikiem, a zarazem nie precyzuje ponad tekst, na czym ontologicznie polegała ta zmiana.
- source_word: ἔμπροσθεν αὐτῶν
  choice: na ich oczach
  rationale: Wyrażenie wskazuje, że wydarzenie nastąpiło przed nimi, w ich obecności. Polski idiom „na ich oczach” jasno oddaje rolę uczniów jako świadków i brzmi naturalniej niż dosłowne „przed nimi”.
- source_word: ἔλαμψεν
  choice: zajaśniała
  rationale: Czasownik λάμπω oznacza świecić lub jaśnieć. „Zajaśniała” dobrze oddaje nagłe ukazanie się blasku wyrażone greckim aorystem.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: jego twarz
  rationale: W tym kontekście πρόσωπον odnosi się bezpośrednio do twarzy Jezusa; zwykłe „twarz” jest precyzyjne i współczesne.
- source_word: ὡς ὁ ἥλιος
  choice: jak słońce
  rationale: ὡς wprowadza wyraźne porównanie. „Jak słońce” zachowuje obraz i naturalną polską składnię.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: jego szaty
  rationale: ἱμάτια oznacza odzież lub wierzchnie okrycia. „Szaty” jest w polskim przekładzie narracji biblijnej godne i naturalne, bez zawężania znaczenia do konkretnego rodzaju ubioru.
- source_word: ἐγένετο λευκὰ
  choice: stały się białe
  rationale: Wyrażenie opisuje zmianę stanu. „Stały się białe” oddaje ją bez dodawania stopnia intensywności, którego grecki tekst nie wyraża osobnym określeniem.
- source_word: ὡς τὸ φῶς
  choice: jak światło
  rationale: Porównanie zostało zachowane dosłownie i obrazowo. W polszczyźnie „jak światło” jest naturalniejsze niż „jak to światło”, mimo obecności greckiego rodzajnika.
theological_decisions:
- issue: Określenie wydarzenia przemienienia
  choice: został przemieniony
  alternative: został przeobrażony
  rationale: „Przemieniony” zachowuje utrwalone, trafne określenie widzialnej przemiany Jezusa, nie dodając twierdzeń doktrynalnych wykraczających poza opis blasku twarzy i szat.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rejestrze. Krótszy podział zdań poprawia czytelność, a „szaty” zachowują biblijną powagę bez archaicznej składni.
