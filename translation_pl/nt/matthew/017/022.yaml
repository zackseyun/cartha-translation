id: MAT.17.22
reference: Matthew 17:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: pl
  text: 'Gdy byli razem w Galilei[a], Jezus powiedział im: „Syn Człowieczy ma zostać wydany[b] w ręce ludzi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Gdy zbierali się w Galilei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „ma zostać oddany”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: gdy byli razem
  rationale: Imiesłów w konstrukcji dopełniacza niezależnego opisuje wspólne przebywanie lub zbieranie się uczniów. Sformułowanie „byli razem” zachowuje sens zbiorowy, nie przesądzając, czy właśnie się schodzili, czy już przebywali wspólnie.
- source_word: δὲ
  choice: gdy
  rationale: Spójnik wraz z konstrukcją imiesłowową wprowadza okoliczność czasową. W naturalnej polszczyźnie funkcję tę oddaje zdanie rozpoczynające się od „gdy”.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: w Galilei
  rationale: Naturalne i precyzyjne oddanie określenia miejsca.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział im
  rationale: Bezpośredni, formalnie przejrzysty odpowiednik greckiego zwrotu.
- source_word: Μέλλει
  choice: ma zostać
  rationale: Konstrukcja „ma zostać” wskazuje na nadchodzące wydarzenie, nie narzucając mocniejszego znaczenia przeznaczenia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik zachowujący formę tytułu oraz jego biblijne i teologiczne odniesienia.
- source_word: παραδίδοσθαι
  choice: zostać wydany
  rationale: Strona bierna zostaje zachowana. „Wydać” może oznaczać przekazanie w czyjąś władzę, a zarazem pozostawia obecną w kontekście możliwość zdrady, bez ograniczania sensu wyłącznie do niej.
- source_word: εἰς χεῖρας
  choice: w ręce
  rationale: Zachowuje czytelną także po polsku metaforę znalezienia się pod czyjąś władzą.
- source_word: ἀνθρώπων
  choice: ludzi
  rationale: 'Greckie słowo ma tu sens ogólny: chodzi o ludzi jako sprawców. „Ludzi” jest naturalne, dokładne i zachowuje zestawienie z określeniem „Syn Człowieczy”.'
theological_decisions:
- issue: Oddanie tytułu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn Człowieka / Człowiek
  rationale: Tradycyjna forma „Syn Człowieczy” najpełniej zachowuje charakter Jezusowego samookreślenia oraz jego związki międzytekstowe; warianty bardziej objaśniające mogłyby zawęzić jego sens.
- issue: Zakres znaczeniowy παραδίδοσθαι w zapowiedzi męki
  choice: zostać wydany
  alternative: zostać oddany / zostać zdradzony
  rationale: „Zostać wydany” zachowuje stronę bierną i szeroki sens przekazania w cudze ręce. „Zdradzony” zbyt wcześnie ograniczałoby wydarzenie do działania zdrajcy, a tekst nie wskazuje tu sprawcy wydania.
- issue: Znaczenie μέλλει
  choice: ma zostać
  alternative: wkrótce zostanie / jest przeznaczony, by zostać
  rationale: Wybrana forma sygnalizuje bliskość nadchodzącego wydarzenia, ale nie rozstrzyga, czy czasownik podkreśla wyłącznie jego rychłość, czy także ustalony bieg wydarzeń.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano tradycyjny tytuł „Syn Człowieczy”, metaforę „w ręce” oraz stronę bierną, nie dopowiadając, kto dokonuje wydania.
