source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: pl
  text: 'Lecz mówię wam: Eliasz już przyszedł, a oni go nie rozpoznali[a], lecz postąpili z nim, jak chcieli[b]. Tak też Syn Człowieczy ma cierpieć[c] z ich rąk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie poznali go” lub „nie uznali go”. Grecki czasownik może oznaczać, że nie rozpoznali właściwie jego tożsamości lub roli.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „uczynili mu, co chcieli” lub „potraktowali go, jak chcieli”. Grecki zwrot opisuje swobodne, w tym kontekście wrogie, działanie wobec niego.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „będzie cierpiał”. Grecka konstrukcja przedstawia cierpienie jako nadchodzące.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lecz mówię wam
  rationale: Naturalne, a zarazem bliskie formie greckiej wprowadzenie wypowiedzi; „lecz” oddaje kontrast wyrażony przez δέ.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Eliasz już przyszedł
  rationale: Aoryst z ἤδη wskazuje na przyjście już dokonane; w języku polskim czas przeszły naturalnie zachowuje ten sens.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: nie rozpoznali go
  rationale: W kontekście chodzi przede wszystkim o nierozpoznanie właściwej tożsamości lub roli, nie o zwykły brak znajomości.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: zrobili z nim, co chcieli
  rationale: Polski idiom naturalnie wyraża nieograniczone, w tym kontekście wrogie, postępowanie wobec niego.
- source_word: οὕτως καὶ
  choice: Tak samo
  rationale: Jasno zaznacza analogię między losem Eliasza a cierpieniem Syna Człowieczego.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tytułu, zachowujący jego biblijne rezonanse.
- source_word: μέλλει πάσχειν
  choice: ma cierpieć
  rationale: Naturalna polska konstrukcja wyrażająca zapowiedziane, nadchodzące cierpienie bez wzmacniania jej do wyraźnej formuły konieczności.
- source_word: ὑπ’ αὐτῶν
  choice: z ich rąk
  rationale: Idiomaticznie i wyraźnie oddaje sprawstwo w kontekście wrogiego działania.
theological_decisions:
- issue: Tożsamość Eliasza, który już przyszedł
  choice: Zachowano imię „Eliasz” bez dopisania w tekście, że chodzi o Jana Chrzciciela.
  alternative: Jawne sparafrazowanie odniesienia jako Jana Chrzciciela.
  rationale: Dalszy kontekst objaśnia odniesienie, lecz sam werset mówi o Eliaszu; przekład nie powinien zastępować tekstu jego interpretacją.
- issue: Znaczenie μέλλει w zapowiedzi cierpienia
  choice: „ma cierpieć” jako zapowiedź nadchodzącego cierpienia
  alternative: „jest przeznaczony, by cierpieć” albo „wkrótce będzie cierpiał”
  rationale: Grecka konstrukcja wskazuje na przyszłe, nadchodzące wydarzenie, ale sama nie formułuje tu wprost silnej tezy o przeznaczeniu ani nie musi określać ścisłej bliskości czasowej.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Składnia jest naturalna dla zwykłego czytelnika; zachowano tytuł „Syn Człowieczy” oraz napięcie między zapowiedzią przyszłości a niewypowiedzianą wprost koniecznością teologiczną.
