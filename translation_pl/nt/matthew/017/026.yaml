source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: pl
  text: 'Gdy odpowiedział: „Od obcych”[a], Jezus rzekł mu: „A zatem synowie są wolni”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'To znaczy: od ludzi spoza własnego domu. Greckie słowo przeciwstawia obcych synom władcy; nie musi oznaczać cudzoziemców.'
    reason: lexical_alternative
  - marker: b
    text: 'W tym kontekście także: „synowie są zwolnieni”, to znaczy nie ciąży na nich ten podatek. Dosłownie: „są wolni”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Gdy odpowiedział
  rationale: Konstrukcja dopełniaczowa niezależna wskazuje na okoliczność czasową, a w kontekście chodzi o odpowiedź Piotra na pytanie Jezusa. „Gdy odpowiedział” brzmi naturalnie i jasno.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Od obcych
  rationale: ἀλλότριοι oznacza tu osoby nienależące do domu władcy, przeciwstawione jego synom. „Obcy” zachowuje relacyjny charakter tego kontrastu bez sugerowania odmiennej narodowości.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jezus rzekł mu
  rationale: Naturalny, zwięzły odpowiednik narracyjnego φημί; „rzekł” utrzymuje godny rejestr tekstu biblijnego, pozostając zrozumiałe.
- source_word: Ἄρα γε
  choice: A zatem
  rationale: Wyrażenie wprowadza wniosek wynikający z odpowiedzi Piotra. „A zatem” wyraźnie oddaje tok rozumowania.
- source_word: ἐλεύθεροί
  choice: wolni
  rationale: Podstawowe znaczenie przymiotnika zostaje zachowane. W kontekście oznacza ono wolność od obowiązku podatkowego, lecz nie zawęża wypowiedzi wyłącznie do technicznego „zwolnieni”.
- source_word: οἱ υἱοί
  choice: synowie
  rationale: Greka mówi konkretnie o synach, przeciwstawiając ich osobom spoza domu władcy. Zachowanie rodzaju męskiego oddaje obraz rodzinno-prawny oraz możliwy rezonans synostwa.
theological_decisions:
- issue: Oddanie οἱ υἱοί w analogii dotyczącej domu władcy i obowiązku podatkowego
  choice: synowie
  alternative: dzieci
  rationale: Tekst źródłowy używa rzeczownika „synowie”, a bezpośrednia analogia opiera się na ich pozycji wobec ojca-władcy. „Dzieci” byłoby szersze i osłabiałoby specyficzny język synostwa.
- issue: Zakres znaczeniowy ἐλεύθεροί
  choice: wolni
  alternative: zwolnieni
  rationale: „Zwolnieni” jasno wskazywałoby na podatek, ale rozstrzygałoby szerszą wypowiedź na rzecz samego sensu fiskalnego. „Wolni” zachowuje zarówno bezpośredni wniosek o braku obowiązku, jak i napięcie obrazu synostwa.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie biblijnym rejestrze. Szyk pozostaje naturalny, a „rzekł” podtrzymuje uroczysty ton bez archaizowania całego zdania. Przypisy objaśniają dwie rzeczywiste niejednoznaczności leksykalne; wszystkie znaczniki występują w tekście głównym.
