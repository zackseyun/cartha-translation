id: MAT.17.8
reference: Matthew 17:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: pl
  text: A gdy podnieśli oczy, nie zobaczyli nikogo — tylko samego Jezusa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „nikogo oprócz samego Jezusa”. Greka kumuluje wyrażenia podkreślające, że widzieli wyłącznie Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: gdy podnieśli
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą główne orzeczenie; konstrukcja czasowa brzmi naturalnie po polsku i zachowuje kolejność zdarzeń.
- source_word: δὲ
  choice: A
  rationale: Łagodny spójnik narracyjny kontynuujący opowiadanie; nie wymaga silnie przeciwstawnego „lecz”.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: oczy
  rationale: Zachowuje konkretny obraz greckiego wyrażenia; polski podmiot domyślny sprawia, że zaimek „swoje” nie jest konieczny.
- source_word: οὐδένα εἶδον
  choice: nie zobaczyli nikogo
  rationale: Naturalny polski odpowiednik prostego aorystu i przeczącego zaimka osobowego.
- source_word: εἰ μὴ
  choice: tylko
  rationale: Po przeczeniu konstrukcja wskazuje wyjątek; po polsku „tylko” jasno i naturalnie wprowadza jedyną osobę, którą zobaczyli.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: samego Jezusa
  rationale: Polskie „samego” przed imieniem idiomatycznie oddaje skumulowany nacisk zaimka αὐτόν i końcowego μόνον, podkreślając, że widzieli wyłącznie Jezusa.
theological_decisions:
- issue: Jezus jako jedyna widoczna postać po widzeniu
  choice: tylko samego Jezusa
  alternative: nikogo oprócz Jezusa
  rationale: Wybrana forma zachowuje podwójne podkreślenie wyłączności obecne w εἰ μὴ + αὐτόν + μόνον, nie dodając interpretacji wykraczającej poza opis sceny.
translation_notes:
  register: Współczesny, godny język narracyjny. Myślnik przed „tylko” uwydatnia nagłe stwierdzenie, że poza Jezusem nikogo już nie widzieli.
