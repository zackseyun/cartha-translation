  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: pl
  text: 'On zaś odpowiedział: „Eliasz wprawdzie przyjdzie i przywróci wszystko”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Eliasz wprawdzie przychodzi i przywróci wszystko”. Grecki czasownik „przychodzi” ma tutaj sens odnoszący się do przyszłości.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Imiesłów z czasownikiem osobowym tworzy typową, semityzującą formułę odpowiedzi. Naturalne polskie „odpowiedział” zachowuje sens reakcji bez zbędnego „odpowiadając, powiedział”.
- source_word: Ἠλίας
  choice: Eliasz
  rationale: Zastosowano utrwaloną polską formę biblijnego imienia.
- source_word: μέν
  choice: istotnie
  rationale: Wyraz podkreśla stwierdzenie i zapowiada kontrast rozwinięty w następnym wersecie. „Istotnie” zachowuje tę funkcję bez sztucznej konstrukcji „z jednej strony”.
- source_word: ἔρχεται
  choice: przychodzi
  rationale: Grecki czas teraźniejszy ma tu sens przyszłościowy, ale polski czas teraźniejszy również może naturalnie wyrażać zapowiedziane przyjście i zachowuje obrazowość formy źródłowej.
- source_word: ἀποκαταστήσει
  choice: odnowi
  rationale: Czasownik oznacza przywrócenie do wcześniejszego lub właściwego stanu. „Odnowi” jest zwięzłe i nie precyzuje sposobu ani zakresu tego działania ponad tekst.
- source_word: πάντα
  choice: wszystko
  rationale: Rodzaj nijaki liczby mnogiej ma szeroki, zbiorczy zakres. „Wszystko” zachowuje jego ogólność bez dodawania niewymienionych przedmiotów.
theological_decisions:
- issue: Natura i zakres odnowicielskiego działania Eliasza
  choice: odnowi wszystko
  alternative: przywróci wszystko do właściwego stanu
  rationale: Tekst ujmuje odnowienie szeroko, nie określając w tym wersecie, czy chodzi o odnowę duchową, społeczną czy eschatologiczną. Ogólne sformułowanie zachowuje tę otwartość.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano emfatyczne μέν jako „istotnie” oraz szeroki zakres πάντα. Marker przypisu umieszczono po całej wypowiedzi, której dotyczy objaśnienie czasu czasownika.
