source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: pl
  text: 'Gdy jeszcze mówił, oto[a] osłonił ich[b] świetlisty obłok, a oto z obłoku odezwał się głos: „To jest mój umiłowany Syn, w którym mam upodobanie. Jego słuchajcie[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ἰδού, oddane tu i dalej jako „oto”, kieruje uwagę na nagłe, doniosłe wydarzenie.
    reason: lexical_alternative
  - marker: b
    text: Czasownik „osłonił” może nawiązywać do biblijnego języka teofanii, czyli objawienia się obecności Boga.
    reason: cross_reference
  - marker: c
    text: 'Możliwe także: „Jego usłuchajcie”. Grecki nakaz może oznaczać słuchanie połączone z przyjęciem i wypełnieniem tego, co się słyszy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Gdy jeszcze mówił
  rationale: Konstrukcja dopełniacza absolutnego wyraża czynność równoczesną, a ἔτι wskazuje, że wypowiedź została przerwana. Polski zwrot jest naturalny i zachowuje ten efekt.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowano oba wystąpienia wskaźnika przyciągającego uwagę, który nadaje scenie żywość i podniosłość.
- source_word: νεφέλη φωτεινὴ
  choice: świetlisty obłok
  rationale: Oddaje jasność lub blask określany przez φωτεινή. „Obłok” brzmi naturalnie w podniosłej narracji biblijnej, nie przesądzając symboliki.
- source_word: ἐπεσκίασεν
  choice: osłonił
  rationale: Czasownik wyraża okrycie lub osłonięcie cieniem. W połączeniu ze świetlistym obłokiem „osłonił” brzmi po polsku naturalniej niż „zacienił” i zachowuje możliwe skojarzenie teofaniczne.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: z obłoku odezwał się głos
  rationale: Naturalna polska konstrukcja zastępuje imiesłów formą osobową, zachowując źródło i treść głosu.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mój umiłowany Syn
  rationale: Oddaje zarówno relację synowską, jak i znaczenie ἀγαπητός, bez dodawania późniejszej terminologii doktrynalnej.
- source_word: ἐν ᾧ εὐδόκησα
  choice: w którym mam upodobanie
  rationale: Zachowuje obrazową konstrukcję z ἐν oraz deklaratywny sens Bożej aprobaty. Polski czas teraźniejszy naturalnie wyraża trwałą postawę w tej formule.
- source_word: ἀκούετε αὐτοῦ
  choice: Jego słuchajcie
  rationale: Tryb rozkazujący oznacza nie tylko odbiór dźwięku, lecz uważne przyjęcie słów. Szyk z wysuniętym „Jego” zachowuje nacisk na osobę Jezusa.
theological_decisions:
- issue: Treść Bożej deklaracji o Jezusie
  choice: To jest mój umiłowany Syn, w którym mam upodobanie
  alternative: To jest mój Syn, Umiłowany, w którym znalazłem upodobanie
  rationale: Przekład zachowuje bezpośrednie określenie Jezusa jako Syna oraz język miłości i aprobaty, nie dopowiadając późniejszych formuł doktrynalnych. Nie rozstrzyga też ponad tekst, czy ἀγαπητός ma być odczytane wyłącznie jako epitet, czy jako tytuł.
- issue: Siła nakazu ἀκούετε αὐτοῦ
  choice: Jego słuchajcie
  alternative: Jego usłuchajcie
  rationale: „Słuchajcie” może obejmować uważne słuchanie i podporządkowanie się, lecz nie zawęża greckiego czasownika wyłącznie do posłuszeństwa.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, lekko podniosłym rejestrze. Zachowano dwukrotne „oto” i tradycyjnie zrozumiałe wyrażenie „mieć upodobanie”, unikając zarówno archaizacji, jak i nadmiernej parafrazy.
