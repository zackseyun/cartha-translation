id: MAT.17.25
reference: Matthew 17:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: pl
  text: 'Odpowiedział: „Tak”. A gdy wszedł do domu, Jezus odezwał się do niego pierwszy: „Jak sądzisz, Szymonie? Od kogo królowie ziemi pobierają cła lub podatek pogłówny[a] — od swoich synów czy od obcych[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie dwa różne rodzaje należności: τέλη oznacza cła lub inne opłaty, a κῆνσος — podatek pogłówny bądź trybut.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „od innych”. Greckie ἀλλότριοι oznacza tu osoby nienależące do własnej rodziny, czyli ludzi z zewnątrz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Tak
  rationale: Prosta odpowiedź twierdząca; „Tak” jest najbardziej naturalnym współczesnym odpowiednikiem.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: gdy wszedł do domu
  rationale: Imiesłów w bierniku odnosi się do Szymona jako domyślnego dopełnienia czasownika προέφθασεν; zdanie czasowe jasno i naturalnie oddaje grecką konstrukcję.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: Jezus odezwał się do niego pierwszy
  rationale: W tym kontekście czasownik wskazuje, że Jezus uprzedził Szymona i zabrał głos, zanim ten zdążył coś powiedzieć. Przekład zachowuje pierwszeństwo działania bez niezrozumiałej dosłowności.
- source_word: Τί σοι δοκεῖ
  choice: Jak sądzisz
  rationale: Naturalny polski zwrot wprowadzający pytanie o ocenę rozmówcy.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: królowie ziemi
  rationale: Bezpośredni przekład zachowujący ogólny zakres γῆ, bez zawężania go do jednego kraju.
- source_word: τέλη
  choice: cła
  rationale: Termin oznacza opłaty i podatki pośrednie, zwłaszcza cła; wybór odróżnia go od następującego κῆνσον.
- source_word: κῆνσον
  choice: podatek pogłówny
  rationale: κῆνσος oznacza podatek nakładany na osobę, związany z rzymskim trybutem; ten odpowiednik zachowuje rozróżnienie względem τέλη.
- source_word: υἱῶν αὐτῶν
  choice: swoich synów
  rationale: Zachowano konkretne „synów” oraz przynależność rodzinną, istotną dla kontrastu w pytaniu.
- source_word: ἀλλοτρίων
  choice: obcych
  rationale: Słowo określa osoby nienależące do własnej rodziny lub kręgu, czyli zewnętrzne wobec synów króla; „obcych” zwięźle zachowuje ten kontrast.
theological_decisions:
- issue: Możliwa chrystologiczna wymowa określenia „synowie” w analogii Jezusa
  choice: Zachować dosłowne określenie rodzinne „swoich synów” bez objaśniania jego chrystologicznej wymowy w tekście głównym.
  alternative: swoich dzieci; swoich poddanych
  rationale: Bezpośrednio chodzi o zwolnienie rodziny władcy z danin, co przygotowuje wniosek następnego wersetu. „Synów” zachowuje napięcie narracyjne i teologiczne, nie narzucając jego rozwinięcia w tym miejscu.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Dialog brzmi naturalnie, a zarazem zachowuje rozróżnienie podatkowe oraz rodzinny kontrast między „synami” a „obcymi”.
