source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: pl
  text: 'Gdy przyszli do Kafarnaum, do Piotra podeszli poborcy podatku dwudrachmowego[a] i zapytali: „Czy wasz nauczyciel nie płaci podatku dwudrachmowego?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ci, którzy pobierali dwudrachmy”. Chodzi o podatek świątynny w wysokości dwóch drachm.'
    reason: Wyjaśnienie dosłownego brzmienia greckiego zwrotu oraz jego tła kulturowego.
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Gdy przyszli
  rationale: Konstrukcja dopełniaczowa niezależna określa okoliczność czasową. „Gdy przyszli” oddaje ją naturalnie; δέ pełni tu lekką funkcję przejściową i nie wymaga osobnego odpowiednika.
- source_word: Καφαρναοὺμ
  choice: Kafarnaum
  rationale: Zastosowano utrwaloną polską formę nazwy miejscowej.
- source_word: προσῆλθον ... τῷ Πέτρῳ
  choice: do Piotra podeszli
  rationale: Czasownik oznacza zbliżenie się lub podejście, a celownik wskazuje osobę, do której się zwrócono.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: poborcy podatku wynoszącego dwie drachmy
  rationale: Imiesłowowy zwrot dosłownie opisuje „tych, którzy pobierają dwudrachmy”. W kontekście chodzi o pobieranie należnej opłaty; „poborcy podatku” jest zrozumiałym, funkcjonalnym odpowiednikiem.
- source_word: δίδραχμα
  choice: podatek wynoszący dwie drachmy
  rationale: δίδραχμον oznacza kwotę lub monetę równą dwóm drachmom. Kontekst wskazuje na należną opłatę, dlatego w tekście głównym wyrażono zarówno jej charakter, jak i wysokość.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: wasz nauczyciel
  rationale: διδάσκαλος znaczy „nauczyciel”. Mała litera zachowuje zwykłą formę tytułu w wypowiedzi poborców i nie dodaje interpretacji teologicznej.
- source_word: οὐ τελεῖ
  choice: Czy ... nie płaci
  rationale: W odniesieniu do należnej opłaty τελέω oznacza „płacić” lub „uiszczać”. Zachowano przeczącą postać pytania, która może sugerować oczekiwanie odpowiedzi twierdzącej, ale jej nie narzuca.
theological_decisions:
- issue: Określenie δίδραχμα jako podatku
  choice: 'W tekście głównym: „podatek wynoszący dwie drachmy”'
  alternative: „dwudrachmy” albo „monety dwudrachmowe”
  rationale: Scena dotyczy uiszczenia obowiązkowej opłaty, nie samego posługiwania się monetami. Określenie „podatek” ujawnia sens kontekstowy bez rozstrzygania kwestii doktrynalnych; identyfikację jako podatek świątynny podano w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, lecz niewyspecjalizowanym rejestrze. Uniknięto technicznego „didrachma” oraz niezręcznego powtarzania pełnej nazwy podatku w pytaniu; „tego podatku” jednoznacznie odsyła do wcześniej wymienionej opłaty.
