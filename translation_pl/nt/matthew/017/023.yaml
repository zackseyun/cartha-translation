  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: pl
  text: I zabiją Go, i trzeciego dnia zostanie wskrzeszony[a]. I bardzo się zasmucili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zmartwychwstanie”. Grecki czasownik ma stronę bierną: „zostanie wskrzeszony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: zabiją Go
  rationale: Forma przyszła czynna oznacza bezpośrednio „zabiją”; polskie „uśmiercą” byłoby bardziej formalne, a „zamordują” dodawałoby niewyrażoną w samym czasowniku ocenę prawną lub moralną. Zaimek odnosi się do Syna Człowieczego z poprzedniego wersetu.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: trzeciego dnia
  rationale: Celownik wyraża określony moment w czasie. „Trzeciego dnia” jest naturalnym i precyzyjnym polskim odpowiednikiem bez zbędnego dopowiadania.
- source_word: ἐγερθήσεται
  choice: zostanie wskrzeszony
  rationale: Przyszła forma bierna od ἐγείρω. „Zostanie wskrzeszony” zachowuje stronę bierną i w kontekście śmierci jasno komunikuje powrót do życia.
- source_word: ἐλυπήθησαν σφόδρα
  choice: bardzo się zasmucili
  rationale: Zwrot oddaje silny smutek uczniów naturalnym, współczesnym polskim językiem. „Bardzo” przekazuje intensyfikującą funkcję σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: i ... a ... I
  rationale: Spójniki zachowują prosty, współrzędny tok wypowiedzi; „a” przed zapowiedzią wskrzeszenia naturalnie zaznacza zmianę między śmiercią a wskrzeszeniem, nie nadając relacji znaczenia przeciwstawnego mocniejszego niż dopuszcza kontekst.
theological_decisions:
- issue: Strona bierna czy czynna w zapowiedzi zmartwychwstania
  choice: zostanie wskrzeszony
  alternative: zmartwychwstanie / powstanie z martwych
  rationale: Greka ma formę przyszłą bierną. Zachowanie strony biernej nie przesądza explicite wykonawcy działania, a zarazem pozostawia obecną w tekście możliwość rozumienia jej jako strony biernej wskazującej na działanie Boga.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano zwięzłość oraz współrzędny tok greckiego zdania. Wielką literę w zaimku „Go” zastosowano zgodnie z utrwaloną polską konwencją odnoszenia zaimków do Jezusa.
