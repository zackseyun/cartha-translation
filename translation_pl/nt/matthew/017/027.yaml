source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: pl
  text: Abyśmy jednak ich nie zgorszyli[a], idź nad morze, zarzuć haczyk i wyciągnij pierwszą rybę, która się złapie. Gdy otworzysz jej pysk, znajdziesz statera[b]. Weź go i daj im za mnie i za siebie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „abyśmy ich nie urazili” albo „abyśmy nie dali im powodu do zgorszenia”.'
    reason: lexical_alternative
  - marker: b
    text: Stater był monetą wartą mniej więcej cztery drachmy, czyli wystarczającą do zapłacenia podatku świątynnego za dwie osoby.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: nie zgorszyli
  rationale: Polskie „zgorszyć” zachowuje zarówno sens wywołania sprzeciwu lub urazy, jak i dosłowne skojarzenie z postawieniem komuś przeszkody; przypis objaśnia sens kontekstowy bez usuwania wieloznaczności.
- source_word: θάλασσαν
  choice: morze
  rationale: Zachowano greckie określenie zbiornika wodnego, tradycyjnie nazywanego Morzem Galilejskim, zamiast zastępować je geograficznie precyzyjniejszym „jeziorem”.
- source_word: ἄγκιστρον
  choice: haczyk
  rationale: To naturalne polskie określenie narzędzia do połowu na wędkę; kontekst nie wymaga rozwinięcia „haczyk na ryby”.
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν ἆρον
  choice: wyciągnij pierwszą rybę, która się złapie
  rationale: Sformułowanie naturalnie oddaje pierwszą rybę wydobytą po zarzuceniu haczyka, unikając niezręcznego dosłownego „rybę, która pierwsza wyjdzie w górę”.
- source_word: στατῆρα
  choice: statera
  rationale: Zachowano nazwę konkretnej monety występującej w tekście greckim, a jej wartość wyjaśniono w przypisie.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: za mnie i za siebie
  rationale: Przyimek „za” naturalnie wyraża tutaj zapłatę w imieniu obu osób i zachowuje zwięzłość oryginału.
- source_word: πορευθεὶς
  choice: idź
  rationale: Imiesłów wprowadza czynność towarzyszącą następującym rozkazom; polski tryb rozkazujący oddaje tę sekwencję jasno i naturalnie.
- source_word: δὸς αὐτοῖς
  choice: daj im
  rationale: Dosłowne i idiomatyczne sformułowanie; z kontekstu jasno wynika, że chodzi o przekazanie monety jako zapłaty.
theological_decisions:
- issue: Znaczenie σκανδαλίζω w związku z zapłatą podatku świątynnego
  choice: Jezus poleca zapłatę, aby nie wywołać zgorszenia lub sprzeciwu, nie rozstrzygając przez to, że podatek jest bezwzględnie należny.
  alternative: Jezus płaci dlatego, że podlega bezwzględnemu obowiązkowi podatkowemu.
  rationale: Bezpośredni kontekst zachowuje napięcie między wolnością synów z wersetu 26 a dobrowolnym ustępstwem podjętym po to, by nikogo nie zgorszyć. Przekład nie dodaje rozstrzygnięcia doktrynalnego.
translation_notes:
  register: 'Współczesna, godna i przystępna polszczyzna. Zachowano biblijne „morze” i nazwę monety „stater”, objaśniając mniej znane realia w przypisie. Markery przypisów uporządkowano zgodnie z ich treścią: [a] dotyczy czasownika „zgorszyć”, a [b] statera.'
