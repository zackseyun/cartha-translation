- from: 'Wtedy uczniowie zapytali Go: „Dlaczego więc znawcy Prawa mówią, że najpierw musi przyjść Eliasz?”'
  to: 'A uczniowie zapytali Go: „Dlaczego więc uczeni w Piśmie mówią, że Eliasz musi przyjść najpierw?”'
  rationale: Usunięto nieuzasadnione „Wtedy” i zastąpiono interpretujące „znawcy Prawa” standardowym odpowiednikiem „uczeni w Piśmie”. Zachowano otwarty charakter pytania oraz kolejność „Eliasz musi przyjść najpierw”.
