id: MAT.17.10
reference: Matthew 17:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: pl
  text: 'A uczniowie zapytali Go: „Dlaczego więc uczeni w Piśmie mówią, że Eliasz musi przyjść najpierw?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: zapytali
  rationale: Aoryst czasownika ἐπερωτάω wprowadza bezpośrednie pytanie; „zapytali” jest naturalnym i precyzyjnym polskim odpowiednikiem.
- source_word: μαθηταὶ
  choice: uczniowie
  rationale: Rodzajnik wskazuje na znaną z kontekstu grupę. Nie dodano „Jego”, ponieważ w tekście greckim przy rzeczowniku nie ma zaimka dzierżawczego.
- source_word: λέγοντες
  choice: —
  rationale: Grecki imiesłów wprowadzający treść wypowiedzi oddano naturalną polską konstrukcją z dwukropkiem; dosłowne „mówiąc” byłoby zbędne i mniej idiomatyczne.
- source_word: Τί οὖν
  choice: Dlaczego więc
  rationale: 'Choć τί formalnie znaczy „co”, w konstrukcji τί ... λέγουσιν ὅτι pyta o przyczynę twierdzenia: „Dlaczego więc ... mówią, że...?”'
- source_word: γραμματεῖς
  choice: znawcy Prawa
  rationale: W kontekście Ewangelii γραμματεῖς oznacza specjalistów w Piśmie i Prawie; „znawcy Prawa” jest zrozumiałe dla współczesnego odbiorcy i zachowuje ich funkcję społeczną.
- source_word: λέγουσιν ὅτι
  choice: mówią, że
  rationale: Czas teraźniejszy i ὅτι wprowadzające zdanie dopełnieniowe znajdują bezpośredni odpowiednik w polskim „mówią, że”.
- source_word: Ἠλίαν
  choice: Eliasz
  rationale: Zastosowano utrwaloną polską formę biblijnego imienia.
- source_word: δεῖ ἐλθεῖν
  choice: musi przyjść
  rationale: δεῖ wyraża konieczność; „musi przyjść” zachowuje jej siłę i brzmi naturalnie.
- source_word: πρῶτον
  choice: najpierw
  rationale: Przysłówek określa pierwszeństwo w kolejności wydarzeń; „najpierw” jest idiomatycznym polskim odpowiednikiem.
theological_decisions:
- issue: Wymowa pytania uczniów o przyjście Eliasza
  choice: Pytanie pozostawiono otwarte, bez wskazywania, czy nauka znawców Prawa zostaje potwierdzona, zakwestionowana czy skorygowana.
  alternative: Można by zasugerować sceptycyzm uczniów albo dopowiedzieć związek z proroctwem Malachiasza.
  rationale: Sam werset jedynie przytacza pytanie. Odpowiedź w Mt 17,11–13 nie powinna być z góry wprowadzana do jego brzmienia.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Pominięto dosłowne „mówiąc” jako nieidiomatyczne w tym miejscu. „Znawcy Prawa” wybrano zamiast tradycyjnego „uczeni w Piśmie”, aby jasno oddać funkcję γραμματεῖς zwykłemu współczesnemu czytelnikowi.
