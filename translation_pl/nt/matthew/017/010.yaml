review_pass:
  verdict: revise
  source_fidelity: „Wtedy” nie ma bezpośredniej podstawy w καί i niepotrzebnie wprowadza wyraźne następstwo czasowe. Ponadto γραμματεῖς najtrafniej oddać jako utrwalony tytuł „uczeni w Piśmie”, nie zaś bardziej zawężające i objaśniające „znawcy Prawa”. Pozostałe elementy wiernie przekazują pytanie, konieczność wyrażoną przez δεῖ oraz kolejność wyrażoną przez πρῶτον.
  naturalness: Po korekcie zdanie jest naturalne we współczesnej polszczyźnie. Dwukropek idiomatycznie oddaje funkcję imiesłowu λέγοντες bez sztucznego „mówiąc”.
  terminology: „Uczeni w Piśmie” jest standardowym, rozpoznawalnym polskim odpowiednikiem γραμματεῖς w Ewangeliach i zachowuje charakter nazwy grupy. „Eliasz”, „musi przyjść” i „najpierw” są właściwe.
  issues:
  - severity: medium
    issue: Dodano „Wtedy”.
    rationale: Grecki tekst ma καί („a/i”), lecz nie zawiera τότε („wtedy”). Dodatek wprowadza mocniejszą relację czasową, niż wyraża tekst źródłowy.
  - severity: medium
    issue: γραμματεῖς oddano jako „znawcy Prawa”.
    rationale: To objaśniające określenie częściowo interpretuje funkcję grupy i może ją zawężać do znawstwa Prawa. „Uczeni w Piśmie” jest bliższym i ustalonym odpowiednikiem terminu.
  revised_text: 'A uczniowie zapytali Go: „Dlaczego więc uczeni w Piśmie mówią, że Eliasz musi przyjść najpierw?”'
