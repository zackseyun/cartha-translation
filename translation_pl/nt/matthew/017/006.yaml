  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: pl
  text: Gdy uczniowie to usłyszeli, upadli na twarz i bardzo się przestraszyli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Gdy … usłyszeli
  rationale: Imiesłów aorystu wyraża tu naturalnie relację czasową. Polski podrzędny zwrot czasowy zachowuje następstwo narracji; zaimek „to” odsyła do głosu z poprzedniego wersetu, nie dopowiadając jego treści.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Standardowe i kontekstowo jednoznaczne określenie uczniów Jezusa w Ewangeliach.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: upadli na twarz
  rationale: „Upaść na twarz” jest naturalnym polskim odpowiednikiem opisującym tę postawę ciała. Polska fraza idiomatycznie używa liczby pojedynczej „twarz” także przy podmiocie mnogim.
- source_word: ἐφοβήθησαν
  choice: przestraszyli się
  rationale: Forma dokonana dobrze oddaje aoryst i nagłą reakcję uczniów. Nie rozstrzyga, czy chodziło przede wszystkim o grozę, czy o pełną czci bojaźń.
- source_word: σφόδρα
  choice: bardzo
  rationale: Prosty, współczesny wzmacniacz wiernie oddający znaczny stopień lęku bez archaizacji.
theological_decisions:
- issue: Charakter reakcji uczniów na głos z nieba
  choice: Opisano upadnięcie na twarz i silny lęk, bez określania tej reakcji mianem oddania czci albo przerażenia.
  alternative: Można interpretować tę reakcję przede wszystkim jako pełne czci uwielbienie albo jako grozę wobec objawienia się Boga.
  rationale: Grecki tekst podaje postawę ciała oraz intensywny lęk, lecz sam nie nadaje im bardziej szczegółowej kwalifikacji teologicznej.
translation_notes:
  register: Współczesny, naturalny i godny styl narracyjny. Zachowano prostą składnię oryginału, unikając zarówno archaicznego „zlękli się wielce”, jak i nadmiernie potocznych sformułowań.
