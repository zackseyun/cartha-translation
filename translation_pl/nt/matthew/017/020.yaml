id: MAT.17.20
reference: Matthew 17:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: pl
  text: 'On zaś mówi im: „Z powodu waszej małej wiary.[a] Zaprawdę bowiem mówię wam: Jeśli będziecie mieć wiarę jak ziarnko gorczycy,[b] powiecie tej górze: «Przenieś się stąd tam», a przeniesie się. I nic nie będzie dla was niemożliwe”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „Z powodu niedostatku waszej wiary”. Greckie słowo oznacza wiarę małą lub niewystarczającą, niekoniecznie całkowitą niewiarę.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „wiarę jak ziarno gorczycy”. Porównanie odwołuje się do czegoś bardzo małego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Zachowano grecki czas teraźniejszy historyczny, który nadaje narracji żywość; po polsku takie użycie pozostaje zrozumiałe i naturalne.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Z powodu waszej małej wiary
  rationale: ὀλιγοπιστία wskazuje na wiarę małą lub niedostateczną, niekoniecznie na całkowity brak wiary. Dosłowniejsze sformułowanie zachowuje też związek z następującym obrazem maleńkiego ziarnka.
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: Tradycyjne, lecz nadal zrozumiałe polskie wprowadzenie uroczystej i stanowczej wypowiedzi Jezusa.
- source_word: πίστιν
  choice: wiarę
  rationale: W tym kontekście chodzi o ufne poleganie na Bożej mocy; „wiara” zachowuje szerokość znaczeniową greckiego rzeczownika bez zawężania go do określonej doktryny.
- source_word: ὡς κόκκον σινάπεως
  choice: jak ziarnko gorczycy
  rationale: Naturalny polski odpowiednik porównania, którego kontekst podkreśla bardzo mały rozmiar.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Przenieś się stąd tam
  rationale: Polecenie skierowane do góry dotyczy zmiany miejsca; forma zwrotna dobrze współgra z nieprzechodnim sensem następującego czasownika.
- source_word: μεταβήσεται
  choice: przeniesie się
  rationale: 'Grecka forma ma tutaj sens nieprzechodni: góra zmieni położenie. Polski czasownik zachowuje ten sens i powtarza rdzeń użyty w rozkazie.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: nic nie będzie dla was niemożliwe
  rationale: To naturalne polskie oddanie greckiego idiomu, bez łagodzenia jego kategorycznego brzmienia.
theological_decisions:
- issue: Znaczenie πίστις w kontekście dokonywania rzeczy niemożliwych
  choice: wiara
  alternative: ufność
  rationale: Kontekst wskazuje na ufne poleganie na Bożej mocy, ale ogólniejsze słowo „wiara” zachowuje pełniejszy zakres πίστις i nie rozstrzyga ponad tekst, jaki dokładnie mechanizm działania wiary ma na myśli Jezus.
- issue: Zakres obietnicy „nic nie będzie dla was niemożliwe”
  choice: Zachowano bezwarunkowe brzmienie zdania
  alternative: Doprecyzowanie, że chodzi wyłącznie o czyny zgodne z wolą Boga
  rationale: Sam werset nie zawiera takiego dopowiedzenia. Tłumaczenie zachowuje napięcie wypowiedzi i nie dodaje systematyczno-teologicznego ograniczenia.
translation_notes:
  register: Współczesna, godna polszczyzna z zachowaniem biblijnej uroczystości formuły „Zaprawdę”. Czas teraźniejszy „mówi” odwzorowuje żywy grecki czas historyczny. Interpunkcja i cudzysłowy zostały dostosowane do polskiej normy.
