  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: pl
  text: 'Tego dnia przyszli do niego saduceusze, którzy twierdzą, że nie ma zmartwychwstania[a], i zapytali go:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub, w odniesieniu do ich przyjścia: „przyszli do niego saduceusze, mówiąc, że nie ma zmartwychwstania”.'
    reason: Grecki imiesłów może opisywać stały pogląd saduceuszy lub czynność towarzyszącą ich przyjściu.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Tego dnia
  rationale: Naturalny polski odpowiednik określenia czasu, zachowujący odniesienie do tego samego dnia opisanego wcześniej.
- source_word: προσῆλθον αὐτῷ
  choice: przyszli do niego
  rationale: Oddaje zwykłe znaczenie προσέρχομαι z celownikiem; brzmi naturalnie w narracji i wskazuje na podejście do Jezusa.
- source_word: Σαδδουκαῖοι
  choice: saduceusze
  rationale: Utrwalona we współczesnej polszczyźnie nazwa żydowskiego ugrupowania; mała litera jest zgodna z polską normą dla nazw członków grup.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: którzy twierdzą, że nie ma zmartwychwstania
  rationale: Imiesłów może opisywać charakterystyczne stanowisko saduceuszy. Czas teraźniejszy zachowuje sens ich stałego poglądu, a „twierdzą” nie przedstawia narratora jako popierającego tę tezę.
- source_word: ἀνάστασιν
  choice: zmartwychwstania
  rationale: Standardowy i kontekstowo właściwy polski termin odpowiadający ἀνάστασις.
- source_word: ἐπηρώτησαν αὐτόν
  choice: zapytali go
  rationale: Prosty, naturalny odpowiednik czasownika oznaczającego zadawanie pytania; kontekst kolejnego wersetu wskazuje, że rozpoczyna się wypowiedź, dlatego zastosowano dwukropek.
theological_decisions:
- issue: Charakter wzmianki o zaprzeczaniu zmartwychwstaniu
  choice: którzy twierdzą, że nie ma zmartwychwstania
  alternative: mówiąc, że nie ma zmartwychwstania
  rationale: Grecki imiesłów λέγοντες może określać znane stanowisko saduceuszy albo czynność towarzyszącą ich przyjściu. Tekst główny przyjmuje naturalne w kontekście odczytanie opisujące ich pogląd, a przypis zachowuje możliwość odczytania okolicznikowego. Zaprzeczenie pozostaje ich twierdzeniem, nie wypowiedzią narratora.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Składnia jest naturalna dla polszczyzny, a termin „zmartwychwstanie” zachowuje teologiczną wagę oryginału bez dodatkowego objaśniania.
