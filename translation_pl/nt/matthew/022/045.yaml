  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: pl
  text: Jeśli więc Dawid nazywa go Panem[a], to jak jest jego synem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo, z wyraźnym dopowiedzeniem wynikającym z kontekstu: „Jeśli więc Dawid nazywa Mesjasza «Panem», to jak jest jego synem?”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Jeśli więc
  rationale: Zachowuje zarówno warunkową siłę εἰ, jak i wynikający z toku argumentacji charakter οὖν; jest przy tym naturalne we współczesnej polszczyźnie.
- source_word: Δαυὶδ
  choice: Dawid
  rationale: Standardowa polska forma biblijnego imienia własnego.
- source_word: καλεῖ
  choice: nazywa
  rationale: Oddaje tutaj sens „nazywa, określa mianem”. Forma „nazywa go Panem” brzmi po polsku naturalniej niż dosłowne „nazywa go Pan” i zachowuje predykatywny charakter wyrażenia.
- source_word: αὐτὸν
  choice: go / on
  rationale: Zaimek odnosi się do postaci wskazanej w poprzednim kontekście; w pytaniu powtórzono „on”, aby uniknąć po polsku niejasnego podmiotu.
- source_word: κύριον
  choice: Panem
  rationale: „Pan” zachowuje honorowy i chrystologicznie doniosły wydźwięk tytułu κύριος oraz jego związek z cytowanym Psalmem 110:1.
- source_word: πῶς
  choice: jak
  rationale: Bezpośrednio i naturalnie wprowadza pytanie o logiczną relację między nazwaniem kogoś Panem a jego synostwem.
- source_word: υἱὸς αὐτοῦ
  choice: jego synem
  rationale: Zachowuje dosłowny język synostwa i zamierzone napięcie tekstu; szersze „jego potomkiem” byłoby interpretacyjnym doprecyzowaniem.
- source_word: ἐστιν
  choice: może ... być
  rationale: Polskie „jak może on być” idiomatycznie wyraża retoryczne πῶς ... ἐστιν, nie zmieniając sensu pytania o możliwość pogodzenia obu stwierdzeń.
theological_decisions:
- issue: Mesjańska i chrystologiczna wymowa nazwania tej postaci przez Dawida „Panem”
  choice: W tekście głównym zachowano zaimkowe „go” oraz napięcie między tytułem „Pan” a określeniem „jego syn”.
  alternative: „Jeśli więc Dawid nazywa Mesjasza Panem, jak może Mesjasz być jego synem?”
  rationale: Grecki tekst tego wersetu nie powtarza rzeczownika „Mesjasz”, lecz używa zaimka odsyłającego do wcześniejszego kontekstu. Objaśnienie umieszczono w przypisie, aby nie rozstrzygać ani nie rozszerzać tekstu głównego.
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Szyk zachowuje argumentacyjny tok pytania, a przypis wyjaśnia domyślny referent zaimka bez wprowadzania go do tekstu głównego.
