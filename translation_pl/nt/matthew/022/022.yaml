  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: pl
  text: Gdy to usłyszeli, zdumieli się, a potem zostawili go i odeszli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: gdy to usłyszeli
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą główne orzeczenie. Zdanie czasowe brzmi naturalnie po polsku, a zaimek „to” oddaje domyślny z kontekstu przedmiot słyszenia.
- source_word: ἐθαύμασαν
  choice: zdumieli się
  rationale: Czasownik oznacza reakcję pełną zdziwienia lub podziwu. „Zdumieli się” jest współczesne, zwięzłe i nie rozstrzyga dokładnego odcienia tej reakcji.
- source_word: ἀφέντες αὐτὸν
  choice: zostawili go
  rationale: W tym kontekście ἀφίημι oznacza pozostawienie kogoś i odejście od niego. Nie dodano znaczenia „samego”, którego tekst grecki nie wyraża wprost.
- source_word: ἀπῆλθαν
  choice: odeszli
  rationale: Naturalny polski odpowiednik czasownika oznaczającego oddalenie się lub odejście.
- source_word: καὶ ... καὶ
  choice: a potem ... i
  rationale: Polskie spójniki jasno oddają następujący po sobie ciąg reakcji i działań, zachowując wartki tok narracji bez mechanicznego powtarzania „i”.
