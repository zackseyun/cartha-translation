  footnotes:
  - marker: a
    text: 'Lub: „A Jezus, odpowiadając, ponownie powiedział do nich w przypowieściach”. Greckie „odpowiedział” jest częstym zwrotem narracyjnym także wtedy, gdy bezpośrednio wcześniej nie pada żadne pytanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: A
  rationale: Naturalny polski spójnik narracyjny zachowujący ciągłość wypowiedzi bez dodawania wyraźnego następstwa czasowego.
- source_word: ἀποκριθεὶς
  choice: odpowiedział
  rationale: Imiesłów aorystu od ἀποκρίνομαι tworzy z εἶπεν typową grecką formułę narracyjną. Polski czasownik „odpowiedział” zachowuje jej podstawowy sens, choć bezpośrednie pytanie nie poprzedza tego zdania.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Standardowa polska forma imienia własnego; rodzajnik grecki nie jest oddawany.
- source_word: πάλιν
  choice: ponownie
  rationale: Wyraża powtórzenie czynności i brzmi naturalnie w podniosłej, współczesnej narracji.
- source_word: εἶπεν ... λέγων
  choice: 'odpowiedział ... :'
  rationale: W połączeniu z ἀποκριθείς i λέγων dosłowne odtworzenie wszystkich form mówienia byłoby po polsku ciężkie i redundantne. Dwukropek naturalnie wprowadza treść wypowiedzi rozpoczynającą się w następnym wersecie.
- source_word: ἐν παραβολαῖς
  choice: w przypowieściach
  rationale: Przyimek ἐν z celownikiem wskazuje tu sposób lub środek wypowiedzi; jest to zarazem utrwalony i zrozumiały polski odpowiednik.
- source_word: αὐτοῖς
  choice: im
  rationale: Celownik zaimka wskazuje adresatów wypowiedzi; „im” jest zwięzłym i naturalnym odpowiednikiem.
theological_decisions:
- issue: Idiomyczne użycie „odpowiedział”, mimo braku bezpośrednio poprzedzającego pytania
  choice: Zachować „odpowiedział”
  alternative: „przemówił”, „zwrócił się” albo pominięcie tego elementu
  rationale: Greka posługuje się typową formułą narracyjną, która może nawiązywać do sytuacji lub wcześniejszej wypowiedzi, a nie tylko do wyraźnego pytania. Zachowanie czasownika nie rozstrzyga dodatkowo charakteru tej odpowiedzi.
translation_notes:
  register: Współczesny, godny i czytelny rejestr. Zdanie nie odtwarza mechanicznie greckiego nagromadzenia form „odpowiedziawszy — powiedział — mówiąc”; dwukropek płynnie otwiera treść następującej przypowieści. Marker przypisu umieszczono bezpośrednio po wyrażeniu, którego dotyczy.
