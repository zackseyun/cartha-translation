  source_fidelity: 'Grecki tekst przedstawia kolejno: pozostałych adresatów, którzy pochwycili sługi króla, następnie dopuścili się wobec nich haniebnego/nadużywającego traktowania, a potem ich zabili. Projekt poprawnie oddaje podmiot, zależność „jego sługi” i końcowe „zabili”, a szereg czasowników może idiomatycznie oddać uprzedni imiesłów κρατήσαντες.'
  naturalness: „Pozostali zaś” oraz zwięzły szereg orzeczeń brzmią naturalnie w standardowej polszczyźnie narracyjnej. Jednak „znieważyli ich” bywa rozumiane przede wszystkim jako obrażenie lub uchybienie czci i nie dość wyraźnie oddaje szersze, haniebne złe traktowanie zawarte w ὕβρισαν.
