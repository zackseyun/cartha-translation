  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: pl
  text: Pozostali zaś schwytali jego sługi, haniebnie się z nimi obeszli i zabili ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Pozostali zaś
  rationale: „Pozostali” wskazuje na resztę wcześniej wspomnianych zaproszonych, a „zaś” naturalnie oddaje łagodnie przeciwstawny charakter δέ.
- source_word: κρατήσαντες
  choice: schwytali
  rationale: Aorystyczny imiesłów opisuje czynność poprzedzającą lub ściśle związaną z dalszymi działaniami. Polski szereg czasowników dokonanych naturalnie i zwięźle zachowuje tę kolejność.
- source_word: τοὺς δούλους αὐτοῦ
  choice: jego sługi
  rationale: W kontekście królewskich wysłanników „słudzy” jest naturalnym, godnym polskim odpowiednikiem, który może obejmować zależność właściwą δοῦλος bez narzucania współczesnego skojarzenia wyłącznie z niewolnictwem.
- source_word: ὕβρισαν
  choice: znieważyli ich
  rationale: ὑβρίζω oznacza haniebne, krzywdzące potraktowanie i może obejmować przemoc, nie tylko słowną obelgę. „Znieważyli” zachowuje ten mocny sens, a zaimek dopełnienia jest w polszczyźnie potrzebny dla jasności.
- source_word: ἀπέκτειναν
  choice: zabili
  rationale: Bezpośredni i naturalny odpowiednik ἀποκτείνω, bez dodawania prawnej kwalifikacji sugerowanej przez „zamordowali”.
theological_decisions:
- issue: Oddanie δοῦλος w kontekście przypowieści
  choice: sługi
  alternative: niewolników
  rationale: „Sługi” dobrze pasują do roli królewskich wysłanników i pozostają zwyczajnym polskim określeniem osób podległych panu. „Niewolników” mocniej eksponowałoby status własnościowy, który grecki termin może oznaczać, lecz nie jest tu głównym punktem wypowiedzi.
translation_notes:
  register: 'Współczesna, standardowa polszczyzna o godnym, narracyjnym rejestrze. Zachowano zwięzłość i trójczłonową eskalację działań: schwytanie, znieważenie, zabicie.'
