  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: pl
  text: 'I mówi do niego: „Przyjacielu, jak tu wszedłeś bez stroju weselnego?” A on zamilkł.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „został uciszony”. Grecki czasownik może dosłownie znaczyć „założyć kaganiec”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Przyjacielu
  rationale: Naturalny polski wołacz zachowuje uprzejmą, lecz zdystansowaną i napominającą formę zwrotu, bez nadmiernego zaostrzania tonu.
- source_word: πῶς
  choice: jak
  rationale: Oddaje pytanie o sposób lub możliwość wejścia, a nie bezpośrednio o motyw.
- source_word: εἰσῆλθες ὧδε
  choice: tu wszedłeś
  rationale: Zwięzłe i naturalne po polsku; aoryst przedstawia wejście jako dokonany fakt.
- source_word: μὴ ἔχων
  choice: bez
  rationale: Przyimkowa konstrukcja naturalnie oddaje grecki imiesłów wskazujący na brak wymaganego stroju.
- source_word: ἔνδυμα γάμου
  choice: strój weselny
  rationale: Zachowuje liczbę pojedynczą i związek ubioru z ucztą weselną, nie precyzując niepotrzebnie rodzaju szaty.
- source_word: ἐφιμώθη
  choice: zamilkł
  rationale: W kontekście oznacza, że człowiek nie potrafił odpowiedzieć. Naturalny polski czasownik przekazuje rezultat, a dosłowniejszy sens strony biernej podano w przypisie.
theological_decisions:
- issue: Ton zwrotu gospodarza do niewłaściwie ubranego gościa
  choice: Uprzejme, lecz napominające „Przyjacielu”
  alternative: „Towarzyszu” lub bardziej oschłe „Człowieku”
  rationale: Greckie ἑταῖρε w Mateuszu brzmi formalnie i dystansująco; „Przyjacielu” zachowuje napięcie oraz ironię bez wprowadzania jawnej wrogości.
- issue: Znaczenie ἐφιμώθη
  choice: Rezultatowe „zamilkł” w tekście głównym
  alternative: „został uciszony” albo dosłownie „został zakneblowany / nałożono mu kaganiec”
  rationale: Kontekst wskazuje na niemożność udzielenia odpowiedzi, jednak forma grecka jest bierna i ma obrazowe tło związane z nakładaniem kagańca; tę różnicę zachowuje przypis.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Składnia pozostaje bliska greckiej narracji w czasie teraźniejszym („mówi”), natomiast pytanie brzmi naturalnie po polsku. Marker przypisu umieszczono bezpośrednio po wyrażeniu, którego dotyczy.
