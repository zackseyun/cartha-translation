  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: pl
  text: 'Wtedy mówi do swoich sług: „Uczta weselna jest gotowa, lecz zaproszeni[a] nie byli jej godni”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wezwani”. Grecki imiesłów można oddać bardziej dosłownie w ten sposób, lecz w kontekście uczty oznacza on osoby zaproszone na wesele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, zachowujący następstwo wydarzeń.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy historyczny i jego narracyjną żywość.
- source_word: δούλοις
  choice: sług
  rationale: W kontekście przypowieści określenie dotyczy osób wykonujących polecenia gospodarza; „słudzy” brzmi naturalnie i nie eksponuje statusu prawnego, który nie jest tu głównym tematem.
- source_word: ὁ μὲν γάμος
  choice: uczta weselna
  rationale: γάμος może oznaczać wesele lub związaną z nim ucztę; przygotowany posiłek w tej przypowieści wskazuje właśnie na ucztę weselną. Kontrast μὲν…δὲ oddano przez „lecz”.
- source_word: ἕτοιμός ἐστιν
  choice: jest gotowa
  rationale: Bezpośredni i naturalny odpowiednik orzeczenia imiennego.
- source_word: οἱ δὲ κεκλημένοι
  choice: lecz zaproszeni
  rationale: Imiesłów od καλέω w kontekście uczty oznacza zaproszonych gości. Wariant dosłowniejszy „wezwani” zachowano w przypisie.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: nie byli jej godni
  rationale: Zachowuje oceniający sens ἄξιος. Zaimek „jej” naturalnie wskazuje w języku polskim, czego zaproszeni nie byli godni, bez wyjaśniania przyczyny.
theological_decisions:
- issue: Możliwe teologiczne skojarzenia κεκλημένοι („wezwani”)
  choice: zaproszeni
  alternative: wezwani
  rationale: Bezpośrednim kontekstem są goście wcześniej zaproszeni na ucztę weselną. „Zaproszeni” jasno oddaje sens sytuacyjny, natomiast „wezwani” mogłoby nadmiernie sugerować techniczne pojęcie powołania. Dosłowniejszą możliwość podano w przypisie, aby zachować przejrzystość tekstową.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano teraźniejszy czas historyczny („mówi”) oraz zwięzłą, kontrastową budowę zdania. Marker przypisu umieszczono przy wyrazie „zaproszeni”, którego dotyczy wariant leksykalny.
