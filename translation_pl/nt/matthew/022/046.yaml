id: MAT.22.46
reference: Matthew 22:46
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: pl
  text: I nikt nie potrafił odpowiedzieć Mu ani słowem[a]. Od tego dnia nikt też nie odważył się już zadawać Mu pytań.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „odpowiedzieć Mu słowo”; możliwe też: „odpowiedzieć Mu jednym słowem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: nikt
  rationale: Naturalny polski odpowiednik przeczenia odnoszącego się do całkowitego braku osoby zdolnej udzielić odpowiedzi.
- source_word: ἐδύνατο
  choice: nie potrafił
  rationale: Oddaje wyrażoną w czasie przeszłym niemożność udzielenia odpowiedzi; w tym kontekście brzmi naturalniej niż bardziej ogólne „nie mógł”.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: odpowiedzieć Mu ani słowem
  rationale: Polski idiom zachowuje obecność λόγον („słowo”) i podkreśla, że nie padła żadna odpowiedź, bez nienaturalnej kalki składniowej.
- source_word: οὐδὲ
  choice: też nie
  rationale: Łączy drugie przeczenie z pierwszym w naturalnej polskiej składni.
- source_word: ἐτόλμησέν τις
  choice: nikt nie odważył się
  rationale: W polszczyźnie przeczenie οὐδὲ w połączeniu z zaimkiem τις najnaturalniej wyraża konstrukcja „nikt nie odważył się”.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: od tego dnia
  rationale: Wskazuje punkt początkowy stanu trwającego później; dalszą ciągłość dopowiada w zdaniu partykuła „już”.
- source_word: ἐπερωτῆσαι
  choice: zadawać Mu pytań
  rationale: Oddaje czynność kierowania do Jezusa kolejnych pytań w kontekście sporu, a zarazem nie wzmacnia jej do znaczenia „przesłuchiwać”.
- source_word: οὐκέτι
  choice: już
  rationale: W zdaniu przeczącym naturalnie wyraża ustanie tej czynności od wskazanego momentu.
theological_decisions:
- issue: Narracyjna wymowa milczenia rozmówców po odpowiedzi Jezusa
  choice: Historyczne stwierdzenie, że nie byli w stanie odpowiedzieć i nie odważyli się dalej zadawać Mu pytań
  alternative: Interpretacyjne uwydatnienie w samym przekładzie wyższości mądrości lub autorytetu Jezusa
  rationale: Kontekst wskazuje na rozstrzygające zwycięstwo Jezusa w sporze, ale sam werset opisuje jedynie niezdolność odpowiedzi i zaprzestanie dalszych pytań. Przekład nie dodaje wprost wniosku teologicznego.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Podział na dwa zdania ułatwia odbiór bez zmiany relacji logicznej. Forma „Mu” stosuje tradycyjny polski zapis zaimka odnoszącego się do Jezusa.
