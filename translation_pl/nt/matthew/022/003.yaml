id: MAT.22.3
reference: Matthew 22:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: pl
  text: I posłał swoje sługi, aby wezwali zaproszonych na ucztę weselną, lecz oni nie chcieli przyjść.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie także: „niewolników”. Greckie słowo może oznaczać zarówno sługi, jak i niewolników.'
    reason: lexical_alternative
  - marker: b
    text: Greka używa tu tej samej rodziny słów w wyrażeniu „wezwać tych, którzy zostali wezwani”; w kontekście chodzi o osoby już wcześniej zaproszone.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Naturalny polski odpowiednik aorystu ἀποστέλλω; zachowuje prostą narrację bez dodawania odcienia uroczystego wyprawienia.
- source_word: δούλους
  choice: sługi
  rationale: δοῦλος może oznaczać niewolnika lub sługę. W tej przypowieści najważniejsza jest funkcja wysłanników króla, dlatego „sługi” jest naturalne i kontekstowo trafne; alternatywę odnotowano w przypisie.
- source_word: καλέσαι
  choice: aby wezwali
  rationale: Bezokolicznik celu po ἀπέστειλεν. „Wezwali” zachowuje związek leksykalny z κεκλημένους, a zarazem wskazuje, że wcześniejsze zaproszenie już nastąpiło.
- source_word: κεκλημένους
  choice: zaproszonych
  rationale: Imiesłów perfectum strony biernej odnosi się do osób już wcześniej zaproszonych. Polski imiesłów „zaproszonych” oddaje ten sens naturalnie, choć nie powtarza tego samego rdzenia co „wezwali”.
- source_word: εἰς τοὺς γάμους
  choice: na ucztę weselną
  rationale: Liczba mnoga γάμοι w tym kontekście oznacza obchody weselne, zwłaszcza ucztę, nie tylko sam akt zawarcia małżeństwa.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: nie chcieli przyjść
  rationale: Wiernie i naturalnie oddaje wolitywny sens ἤθελον z bezokolicznikiem, nie wzmacniając go do „odmówili”.
theological_decisions:
- issue: Znaczenie δοῦλος w narracji przypowieściowej
  choice: sługi
  alternative: niewolników
  rationale: Tekst akcentuje rolę królewskich wysłanników, a nie ich status prawny. „Sługi” nie rozstrzyga szerzej teologii służby ani niewolnictwa, zaś dosłowniejszą możliwość zachowuje przypis.
- issue: Relacja między καλέσαι a κεκλημένους
  choice: „wezwali zaproszonych”
  alternative: „zawołali wezwanych” / „zaprosili zaproszonych”
  rationale: Greka celowo używa tej samej rodziny czasownika, ale polski nie pozwala zachować powtórzenia bez niezręczności lub zatarcia faktu wcześniejszego zaproszenia. Przypis sygnalizuje grę leksykalną.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Spójnik „lecz” wyraźnie oddaje kontrast drugiego καί w kontekście. Szyk jest naturalny po polsku, a wszystkie przypisy mają znaczniki w tekście głównym.
