  to: 'Ponownie posłał inne sługi[a] z poleceniem: „Powiedzcie zaproszonym: «Oto przygotowałem mój posiłek: moje woły i utuczone zwierzęta zostały ubite, i wszystko jest gotowe. Przyjdźcie na ucztę weselną[b]»”.'
