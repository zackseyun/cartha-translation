reference: Matthew 22:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: pl
  text: 'Ponownie posłał inne sługi[a] z poleceniem: „Powiedzcie zaproszonym: «Oto przygotowałem mój posiłek: moje woły i utuczone zwierzęta zostały ubite, i wszystko jest gotowe. Przyjdźcie na ucztę weselną[b]»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może również znaczyć „niewolników”.
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „na wesele”; grecka liczba mnoga może oznaczać uroczystości weselne jako całość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Ponownie
  rationale: Naturalny polski przysłówek wskazujący na powtórzenie czynności.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Standardowy, godny rejestr narracyjny; oddaje dokonany charakter czynności.
- source_word: ἄλλους δούλους
  choice: inne sługi
  rationale: W kontekście królewskiego domu „słudzy” brzmią naturalnie po polsku, a przypis zachowuje społeczną możliwość znaczenia „niewolnicy”.
- source_word: λέγων
  choice: z poleceniem
  rationale: Idiomaticznie łączy wysłanie sług z treścią przekazanego im nakazu.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Powiedzcie zaproszonym
  rationale: Imiesłów perfectum wskazuje na ludzi już zaproszonych; polski imiesłów „zaproszonym” zachowuje tę treść zwięźle.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Współczesny, lecz podniosły sygnał zwracający uwagę na to, co następuje.
- source_word: τὸ ἄριστόν μου
  choice: mój posiłek
  rationale: Neutralnie oddaje przygotowany posiłek bez niepewnego określania pory dnia ani utożsamiania go z całością uroczystości weselnych.
- source_word: ἡτοίμακα
  choice: przygotowałem
  rationale: Polski aspekt dokonany wyraża ukończone przygotowanie i jego aktualny rezultat.
- source_word: οἱ ταῦροί μου
  choice: moje woły
  rationale: Tradycyjne i zrozumiałe określenie bydła przeznaczonego na ucztę.
- source_word: τὰ σιτιστὰ
  choice: tuczne zwierzęta
  rationale: Oddaje zwierzęta specjalnie karmione na ubój, nie dopowiadając niewystępującego w grece gatunku ani wieku, jak „cielęta”.
- source_word: τεθυμένα
  choice: zostały zabite
  rationale: W kontekście przygotowania uczty chodzi o ubój zwierząt, nie o ofiarę kultową.
- source_word: καὶ πάντα ἕτοιμα
  choice: i wszystko jest gotowe
  rationale: Bezpośrednie i naturalne oddanie całościowego πάντα oraz stanu gotowości.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Przyjdźcie na ucztę weselną
  rationale: W liczbie mnogiej γάμοι może oznaczać uroczystości weselne; „uczta weselna” naturalnie pasuje do bezpośredniego kontekstu przygotowanego posiłku.
theological_decisions:
- issue: Znaczenie δοῦλος w realiach królewskiego domu
  choice: sługi
  alternative: niewolnicy
  rationale: „Sługi” jest naturalne w polskiej narracji o wysłannikach króla i nie przesądza ponad kontekst ich dokładnego statusu prawnego; przypis ujawnia mocniejszą alternatywę leksykalną.
- issue: Zakres znaczeniowy τοὺς γάμους
  choice: ucztę weselną
  alternative: wesele / uroczystości weselne
  rationale: Kontekst przygotowanych zwierząt i posiłku przemawia za ucztą, ale grecka liczba mnoga może szerzej obejmować całe uroczystości; alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, narracyjnym brzmieniu. Zachowano mowę w mowie za pomocą polskich cudzysłowów pierwszego i drugiego stopnia. Uniknięto archaizmów oraz doprecyzowania τὰ σιτιστά jako cieląt.
