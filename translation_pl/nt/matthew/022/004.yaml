    rationale: W polskim systemie zastosowanym w wersecie cytat zewnętrzny otwiera się znakiem „, a po zamknięciu cytatu wewnętrznego znakiem » powinien zostać zamknięty znakiem ”, nie angielskim ” w układzie „…»”.
  - severity: low
    issue: „Tuczne zwierzęta” słabiej oddaje znaczenie τὰ σιτιστά.
    rationale: Przymiotnik σιτιστά wskazuje na zwierzęta specjalnie karmione i utuczone na ubój; „utuczone zwierzęta” wyraża to wyraźniej i pozostaje równie niespecyficzne co greka.
  - severity: low
    issue: „Zostały zabite” jest mniej precyzyjne w kontekście przygotowania uczty.
    rationale: „Zostały ubite” w naturalny sposób wskazuje na ubój zwierząt na mięso i dobrze odpowiada τεθυμένα w tym niekultycznym kontekście.
