  source_fidelity: Grecki genetivus absolutus (Συνηγμένων δὲ τῶν Φαρισαίων) trafnie oddano jako okoliczność równoczesną. „Zapytał ich” wiernie przekazuje ἐπηρώτησεν αὐτούς, a podmiot „Jezus” jest właściwie zachowany. Pominięcie δέ jest dopuszczalne w naturalnej polszczyźnie, ponieważ partykuła ma tu jedynie łagodną funkcję przejścia.
  naturalness: „Kiedy faryzeusze byli zgromadzeni” jest zrozumiałe, lecz „byli zgromadzeni” brzmi nieco urzędowo i mniej idiomatycznie niż „byli zebrani”. „Gdy” naturalnie wprowadza tło narracyjne i dobrze odpowiada angielskiemu „While”.
  terminology: „Faryzeusze” oraz „Jezus” są standardowymi współczesnymi formami. Nie występują tu terminy teologiczne wymagające dodatkowego uściślenia.
