  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: pl
  text: 'Gdy faryzeusze byli zebrani, Jezus ich zapytał:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: byli zgromadzeni
  rationale: Imiesłów w konstrukcji genetivus absolutus wyznacza okoliczność równoczesną wobec pytania Jezusa. To sformułowanie zachowuje tło sytuacyjne i zbiorowy sens czasownika συνάγω.
- source_word: δὲ
  choice: nieoddane osobnym wyrazem
  rationale: Partykuła sygnalizuje łagodne przejście w toku narracji, bez wyraźnego przeciwstawienia. W naturalnej polszczyźnie przejście wystarczająco wyraża rozpoczynające zdanie „Kiedy”; dodanie „zaś” mogłoby niepotrzebnie sugerować kontrast.
- source_word: τῶν Φαρισαίων
  choice: faryzeusze
  rationale: Standardowa współczesna nazwa tej grupy; przypadek w polskim dostosowano do zdania podrzędnego.
- source_word: ἐπηρώτησεν
  choice: zapytał
  rationale: Naturalny odpowiednik czasownika ἐπερωτάω w kontekście wprowadzenia pytania; nie narzuca tonu przesłuchania ani sporu.
- source_word: αὐτοὺς
  choice: ich
  rationale: Zaimek odnosi się bezpośrednio do wspomnianych faryzeuszy.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Imię własne pełniące funkcję podmiotu; greckiego rodzajnika nie oddaje się przed imieniem w języku polskim.
