  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: pl
  text: 'Oni jednak zlekceważyli to i odeszli: jeden na swoje pole, a drugi do swoich spraw handlowych.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: zlekceważyli zaproszenie
  rationale: Imiesłów od ἀμελέω wyraża brak troski lub lekceważenie. Dopełnienie pozostaje w grece domyślne, lecz kontekst jednoznacznie wskazuje na zaproszenie króla; jego podanie zapewnia naturalność po polsku.
- source_word: ἀπῆλθον
  choice: odeszli
  rationale: Oddaje odejście adresatów po otrzymaniu wezwania, zachowując zwięzłość i ruch narracji.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: jeden ... a drugi
  rationale: Naturalnie oddaje rozdzielczą konstrukcję oraz kontrast wyrażony przez μέν ... δέ.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: na swoje pole
  rationale: ἀγρός oznacza pole lub gospodarstwo; „pole” jest bezpośrednim odpowiednikiem, a „swoje” zachowuje nacisk ἴδιον na własne sprawy.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: do swego interesu
  rationale: ἐμπορία oznacza handel lub działalność zarobkową. „Interes” jest naturalnym współczesnym określeniem takiej działalności i tworzy czytelny kontrast z pracą na polu.
theological_decisions:
- issue: Domyślne dopełnienie ἀμελήσαντες
  choice: W tekście głównym dopowiedziano „zaproszenie”, wskazane przez bezpośredni kontekst.
  alternative: 'Pozostawić dopełnienie niewyrażone: „zlekceważyli to” albo „nie przejęli się”.'
  rationale: Greka nie podaje dopełnienia wprost, ale kontekst wskazuje na królewskie zaproszenie. Dopowiedzenie służy naturalności polszczyzny i nie wnosi treści doktrynalnej; przypis zachowuje informację o elipsie oryginału.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Składnia z dwukropkiem płynnie wprowadza dwa kierunki odejścia; bez archaizmów i bez terminologii wyznaniowej.
