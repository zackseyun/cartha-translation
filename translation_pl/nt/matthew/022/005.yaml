  source_fidelity: Greckie ἀμελήσαντες oznacza okazanie obojętności, zaniedbanie lub zlekceważenie; dopełnienie jest niewyrażone, choć w kontekście odnosi się do zaproszenia. „Zlekceważyli” trafnie oddaje sens, lecz jawne „zaproszenie” w tekście głównym dopowiada element, którego greka nie wyraża. ἀπῆλθον, rozdzielcze ὃς μὲν ... ὃς δὲ oraz oba określenia celu zostały zasadniczo oddane poprawnie.
  naturalness: „Oni jednak zlekceważyli to i odeszli” jest naturalne we współczesnej polszczyźnie i zachowuje kontekstowe, lecz niewyeksplikowane dopełnienie. „Do swego interesu” jest możliwe, ale w tym znaczeniu brzmi mniej idiomatycznie niż „do swoich spraw handlowych”.
  terminology: „Pole” dobrze odpowiada ἀγρός. „Sprawy handlowe” oddają ἐμπορία jako działalność handlową, bez zawężania do konkretnego przedsiębiorstwa ani przesuwania znaczenia na towary. Nie występują tu szczególne terminy teologiczne.
