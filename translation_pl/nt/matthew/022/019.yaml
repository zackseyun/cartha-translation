  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: pl
  text: „Pokażcie mi monetę na podatek[a].” A oni przynieśli Mu denara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gr. κῆνσος: rzymski podatek; możliwe także: „podatek pogłówny” lub „podatek spisowy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Pokażcie mi
  rationale: Aoryst imperativus strony czynnej, 2. osoba liczby mnogiej. „Pokażcie mi” naturalnie oddaje polecenie okazania przedmiotu do obejrzenia i zachowuje wzrokowy aspekt czasownika.
- source_word: νόμισμα τοῦ κήνσου
  choice: monetę podatkową
  rationale: νόμισμα oznacza monetę będącą w obiegu, a dopełniacz τοῦ κήνσου określa jej związek z rzymskim podatkiem. „Moneta podatkowa” jest zwięzłym i naturalnym polskim określeniem monety używanej do zapłaty tego podatku.
- source_word: προσήνεγκαν
  choice: przynieśli
  rationale: Aoryst indicativus strony czynnej od προσφέρω. W tej scenie „przynieśli” jasno i idiomatycznie opisuje dostarczenie monety Jezusowi.
- source_word: δηνάριον
  choice: denara
  rationale: δηνάριον nazywa konkretną rzymską monetę. Utrwalona polska nazwa „denar” zachowuje historyczną precyzję; biernik „denara” odpowiada składni zdania.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny styl narracyjny. Zastosowano formę mnogą „Pokażcie”, zgodną z greckim imperatywem, oraz tradycyjny polski zapis zaimka odnoszącego się do Jezusa wielką literą.
