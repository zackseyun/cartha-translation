  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: pl
  text: Idźcie więc na rozstaje dróg[a] i zaproście na ucztę weselną[b] wszystkich, których znajdziecie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na skrzyżowania dróg” lub „do wylotów dróg”. Greckie wyrażenie odnosi się do miejsc, gdzie drogi się rozchodzą, wychodzą lub zbiegają.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „na wesela”; grecka liczba mnoga oznacza tu uroczystość lub ucztę weselną.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: Idźcie
  rationale: Czasownik w trybie rozkazującym wyraża bezpośrednie polecenie skierowane do wielu osób; „Idźcie” jest naturalne i wierne.
- source_word: οὖν
  choice: więc
  rationale: Spójnik wskazuje na wynik lub wniosek z wcześniejszych słów; „więc” zachowuje ten związek w naturalnej polszczyźnie.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: na rozstaje dróg
  rationale: Wyrażenie oznacza miejsca, w których drogi się rozchodzą, wychodzą lub zbiegają. „Rozstaje dróg” zachowują obraz dróg i nie narzucają wyłącznie miejskiego otoczenia.
- source_word: ὅσους ἐὰν εὕρητε
  choice: wszystkich, których znajdziecie
  rationale: Konstrukcja wyraża nieokreśloną i szeroką grupę osób; polskie sformułowanie naturalnie oddaje sens „ilu tylko znajdziecie”.
- source_word: καλέσατε
  choice: zaproście
  rationale: W kontekście wesela czasownik oznacza zaproszenie na uroczystość, a nie samo zawołanie.
- source_word: εἰς τοὺς γάμους
  choice: na ucztę weselną
  rationale: Grecka liczba mnoga odnosi się idiomatycznie do uroczystości weselnej lub uczty, nie do wielu ślubów. „Uczta weselna” jasno odpowiada kontekstowi przypowieści.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia pozostaje zwięzła i rozkazująca, a dobór „rozstaje dróg” zachowuje obrazowość oraz zakres znaczeniowy greckiego wyrażenia bez nadmiernego uściślania realiów.
