id: MAT.22.29
reference: Matthew 22:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: pl
  text: 'Jezus zaś odpowiedział im: „Jesteście w błędzie[a], ponieważ nie znacie ani Pism, ani mocy Boga”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Dajecie się zwodzić” albo „Błądzicie”.'
    reason: Alternatywne odcienie Πλανᾶσθε obejmują bycie zwodzonym oraz schodzenie na błędną drogę.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jezus zaś odpowiedział im
  rationale: Grecka formuła odpowiedzi, dosłownie „odpowiadając zaś, Jezus powiedział im”, została oddana naturalnym polskim zwrotem. „Zaś” zachowuje łagodne przejście lub przeciwstawienie wyrażone przez δέ.
- source_word: Πλανᾶσθε
  choice: Jesteście w błędzie
  rationale: Forma może oznaczać mylenie się, pozostawanie w błędzie albo bycie zwodzonym. Wybrane sformułowanie jest naturalne, zachowuje polemiczną siłę wypowiedzi i nie rozstrzyga, czy błąd wynika z zewnętrznego zwiedzenia.
- source_word: μὴ εἰδότες
  choice: ponieważ nie znacie
  rationale: Imiesłów wskazuje tu przyczynę błędu. Zdanie przyczynowe brzmi naturalnie po polsku i jasno łączy niewiedzę z wcześniejszym zarzutem.
- source_word: τὰς γραφὰς
  choice: Pism
  rationale: Liczba mnoga γραφαί oznacza w tym żydowskim kontekście święte pisma. Wielka litera sygnalizuje to ustalone odniesienie bez dodawania słowa „Święte”, którego nie ma w tekście greckim.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ani mocy Boga
  rationale: μηδέ tworzy wraz z wcześniejszym przeczeniem parę „ani… ani…”. „Moc Boga” wiernie i naturalnie oddaje τὴν δύναμιν τοῦ θεοῦ.
theological_decisions:
- issue: Przyczyna błędu saduceuszy
  choice: Niewiedza dotycząca zarówno Pism, jak i mocy Boga jest podana jako przyczyna ich błędu.
  alternative: 'Potraktowanie imiesłowu jedynie jako dodatkowego opisu: „błądzicie, nie znając…”.'
  rationale: Kontekstowo μὴ εἰδότες ma naturalny sens przyczynowy. Przekład „ponieważ” ujawnia ten związek, nie dodając wyjaśnienia, na czym dokładnie polega moc Boga.
- issue: Charakter błędu wyrażonego przez Πλανᾶσθε
  choice: „Jesteście w błędzie” pozostawia otwarte, czy chodzi o samodzielne mylenie się, czy o bycie zwiedzionym.
  alternative: „Jesteście zwiedzeni”, co mocniej sugerowałoby zewnętrznego sprawcę zwiedzenia.
  rationale: Grecka forma dopuszcza odcień medialny lub bierny, dlatego tekst główny nie powinien niepotrzebnie rozstrzygać tej kwestii.
translation_notes:
  register: Współczesny, godny i bezpośredni polski. Szyk „Jezus zaś” zachowuje przejściowy lub lekko przeciwstawny charakter δέ, a konstrukcja „ani… ani…” jasno odtwarza grecką parę przeczeń.
