  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: pl
  text: 'Wtedy król powiedział sługom[a]: „Zwiążcie mu nogi i ręce i wyrzućcie go w ciemność zewnętrzną. Tam będzie płacz i zgrzytanie zębów”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „osobom usługującym”.'
    reason: Greckie διάκονοι w tym kontekście może oznaczać sługi lub osoby pełniące funkcję usługujących przy królu i uczcie.
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, który wprowadza kolejne wydarzenie w opowiadaniu.
- source_word: ὁ βασιλεὺς
  choice: król
  rationale: Bezpośrednio zachowuje królewskie obrazowanie przypowieści.
- source_word: τοῖς διακόνοις
  choice: sługom
  rationale: W kontekście królewskiej uczty oznacza osoby pozostające do dyspozycji króla; „słudzy” jest naturalne i nie wnosi kościelnego znaczenia słowa „diakoni”.
- source_word: Δήσαντες
  choice: Zwiążcie
  rationale: Imiesłów aorystu poprzedzający tryb rozkazujący naturalnie oddaje się po polsku jako pierwsze z dwóch skoordynowanych poleceń. „Zwiążcie” jasno wyraża skrępowanie kończyn.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: mu nogi i ręce
  rationale: Zachowuje grecką kolejność „nogi i ręce”; celownik „mu” brzmi naturalniej po polsku niż konstrukcja dzierżawcza.
- source_word: ἐκβάλετε αὐτὸν
  choice: wyrzućcie go
  rationale: Oddaje zdecydowane, gwałtowne usunięcie wyrażone przez ἐκβάλλω, a zarazem brzmi współcześnie.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: w ciemność na zewnątrz
  rationale: Oddaje ciemność znajdującą się poza oświetloną salą uczty i unika mało naturalnego polskiego wyrażenia „zewnętrzna ciemność”, nie zawężając metafory do określonej doktrynalnej interpretacji.
- source_word: ἐκεῖ
  choice: Tam
  rationale: Zwięzły i bezpośredni odpowiednik wskazujący miejsce wykluczenia.
- source_word: ὁ κλαυθμὸς
  choice: płacz
  rationale: Standardowy i trafny polski odpowiednik oznaczający płacz oraz lament.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: zgrzytanie zębów
  rationale: Utrwalony i dokładny polski odpowiednik idiomu, zachowujący możliwość wyrażania udręki lub gniewu.
theological_decisions:
- issue: Charakter obrazu wykluczenia w przypowieści
  choice: Zachowano konkretny obraz wyrzucenia w ciemność na zewnątrz bez objaśniania go w tekście jako piekła, sądu ostatecznego ani wyłącznie społecznego upokorzenia.
  alternative: Jednoznaczne nazwanie piekielnej kary albo złagodzenie obrazu do samego wykluczenia z uczty.
  rationale: Grecki tekst posługuje się wyrazistym obrazem sądu w ramach przypowieści, lecz sam nie precyzuje jego pełnego odniesienia doktrynalnego; przekład powinien zachować to napięcie.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Składnia polecenia jest dynamiczna, lecz nie potoczna. Zachowano grecką kolejność „nogi i ręce” oraz tradycyjne, naturalne wyrażenie „płacz i zgrzytanie zębów”.
