  source_fidelity: Przekład wiernie oddaje kolejność narracji, rozkaz związania, zachowaną w grece kolejność „nogi i ręce”, gwałtowne usunięcie oraz formułę „płacz i zgrzytanie zębów”. Wyrażenie „w ciemność na zewnątrz” jest jednak nieidiomatyczne i mniej precyzyjnie odzwierciedla określony zwrot τὸ σκότος τὸ ἐξώτερον.
