  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: pl
  text: Wielu bowiem jest powołanych[a], lecz niewielu wybranych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „zaproszonych”; w kontekście uczty słowo to może oznaczać osoby zaproszone.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wielu
  rationale: Rzeczownikowe użycie przymiotnika w liczbie mnogiej; zwięzłe „wielu” zachowuje wyraźny kontrast z ὀλίγοι.
- source_word: γάρ
  choice: bowiem
  rationale: Oddaje objaśniający związek tego zdania z poprzedzającą przypowieścią, bez nadmiernego precyzowania rodzaju wynikania.
- source_word: εἰσιν
  choice: jest
  rationale: W polskiej konstrukcji „wielu jest powołanych” orzeczenie występuje naturalnie w liczbie pojedynczej.
- source_word: κλητοὶ
  choice: powołanych
  rationale: „Powołanych” zachowuje szerszy zakres znaczeniowy greckiego słowa i jego zestawienie z „wybranych”; obecny w kontekście uczty sens „zaproszonych” podano w przypisie.
- source_word: ὀλίγοι
  choice: niewielu
  rationale: Naturalny polski odpowiednik, zachowujący zwięzły kontrast z „wielu”.
- source_word: δὲ
  choice: lecz
  rationale: Wyraźnie i godnie oddaje przeciwstawny charakter spójnika.
- source_word: ἐκλεκτοί
  choice: wybranych
  rationale: Bezpośredni, współczesny odpowiednik, który nie narzuca późniejszego systemu doktrynalnego.
theological_decisions:
- issue: Znaczenie κλητοί w kontekście przypowieści o uczcie weselnej
  choice: powołanych
  alternative: zaproszonych
  rationale: Kontekst uczty uzasadnia „zaproszonych”, jednak „powołanych” zachowuje szerszy rezonans wypowiedzi oraz paralelę z „wybranych”. Alternatywę kontekstową zachowano w przypisie.
- issue: Oddanie ἐκλεκτοί w wypowiedzi dotyczącej powołania i wybrania
  choice: wybranych
  alternative: wybranych przez Boga
  rationale: Grecki przymiotnik nie wymienia wprost podmiotu dokonującego wyboru. Samo „wybranych” zachowuje tę zwięzłość i napięcie teologiczne, nie dopowiadając podmiotu ani mechanizmu wybrania.
translation_notes:
  register: Zwięzły, przysłowiowy rytm oryginału zachowano przez symetryczne zestawienie „wielu” i „niewielu”. „Bowiem” ma współczesny, lecz godny rejestr i naturalnie sygnalizuje funkcję objaśniającą zdania.
