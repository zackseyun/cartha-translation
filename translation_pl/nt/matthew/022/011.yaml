id: MAT.22.11
reference: Matthew 22:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: pl
  text: Kiedy zaś król wszedł, aby przyjrzeć się gościom spoczywającym przy stole[a], zobaczył tam człowieka, który nie miał na sobie stroju weselnego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo oznacza „spoczywających [przy stole]” i odzwierciedla zwyczaj leżenia podczas formalnej uczty.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Kiedy zaś ... wszedł
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą główne „zobaczył”, a δέ sygnalizuje nowy, lekko kontrastujący etap opowiadania. Taka konstrukcja jest naturalna po polsku.
- source_word: ὁ βασιλεὺς
  choice: król
  rationale: Podstawowy i kontekstowo właściwy odpowiednik w przypowieści o uczcie królewskiej.
- source_word: θεάσασθαι
  choice: aby przyjrzeć się
  rationale: Bezokolicznik wyraża cel wejścia króla. „Przyjrzeć się” oddaje uważne oglądanie, nie narzucając zbyt formalnego sensu inspekcji.
- source_word: τοὺς ἀνακειμένους
  choice: spoczywającym przy stole gościom
  rationale: ἀνάκειμαι opisuje zwyczajową pozycję uczestników starożytnej uczty. Dodanie „gościom” jasno określa ich rolę wynikającą z kontekstu.
- source_word: εἶδεν ἐκεῖ
  choice: zobaczył tam
  rationale: Bezpośredni i naturalny odpowiednik prostego orzeczenia oraz przysłówka miejsca.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: Polskie „człowiek” w tym konkretnym kontekście odnosi się do pojedynczego mężczyzny i naturalnie oddaje ἄνθρωπον bez zmiany postaci opowiadania.
- source_word: οὐκ ἐνδεδυμένον
  choice: który nie miał na sobie
  rationale: Konstrukcja opisuje aktualny stan tej osoby. Polski zwrot idiomatycznie łączy się z nazwą wymaganego stroju.
- source_word: ἔνδυμα γάμου
  choice: stroju weselnego
  rationale: Dosłownie jest to „szata/ubiór wesela”; „strój weselny” naturalnie oznacza ubiór odpowiedni na ucztę weselną, zachowując liczbę pojedynczą rzeczownika.
theological_decisions:
- issue: Pozycja uczestników uczty
  choice: Zachować informację, że goście spoczywali przy stole.
  alternative: Oddać jedynie jako „gościom” albo formalnie „spoczywającym”.
  rationale: Szczegół odzwierciedla historyczny zwyczaj ucztowania i nie stanowi interpretacyjnego dodatku; słowo „goście” doprecyzowuje funkcję osób na podstawie kontekstu.
- issue: Charakter ἔνδυμα γάμου
  choice: „strój weselny” bez objaśniania jego symboliki ani pochodzenia
  alternative: „szata weselna” albo rozwinięcie sugerujące konkretną interpretację teologiczną
  rationale: Tekst mówi o wymaganym ubiorze, lecz w tym wersecie nie wyjaśnia jego symboliki ani tego, kto miał go zapewnić. Przekład zachowuje tę otwartość.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. „Spoczywającym przy stole” zachowuje realia starożytnej uczty, a „strój weselny” brzmi naturalniej niż bardziej tradycyjna „szata weselna”.
