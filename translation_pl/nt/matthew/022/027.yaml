  text: W końcu, po nich wszystkich, umarła kobieta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Jako ostatnia ze wszystkich umarła kobieta”. Dosłownie: „Później/na końcu ze wszystkich umarła kobieta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον δὲ πάντων
  choice: Na końcu
  rationale: Całe wyrażenie wskazuje na ostatnie wydarzenie w przedstawionej kolejności. „Na końcu” jest naturalnym polskim odpowiednikiem, zachowującym sens „jako ostatnia / wreszcie”.
- source_word: ἀπέθανεν
  choice: umarła
  rationale: Aoryst oznajmujący stwierdza wprost fakt śmierci; forma żeńska wynika z podmiotu „kobieta”.
- source_word: ἡ γυνή
  choice: kobieta
  rationale: γυνή może znaczyć „kobieta” lub „żona”. W opowieści o kolejnych małżeństwach „kobieta” najwierniej zachowuje greckie ujęcie i nie wiąże jej wyłącznie z jednym mężem.
