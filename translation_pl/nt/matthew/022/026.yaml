  text: Tak samo stało się z drugim i trzecim, aż do siódmego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Tak samo
  rationale: Naturalnie i zwięźle wskazuje, że to samo, co opisano wcześniej, spotkało kolejnych braci.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: z drugim i trzecim
  rationale: Greckie liczebniki porządkowe są użyte rzeczownikowo. Polski przekład zachowuje elipsę słowa „bratem”, a przyimek „z” wynika z naturalnej konstrukcji „stało się z kimś”.
- source_word: ἕως τῶν ἑπτά
  choice: aż po wszystkich siedmiu
  rationale: Wyrażenie oznacza, że sytuacja powtarzała się kolejno w całej grupie siedmiu; „aż po wszystkich siedmiu” brzmi naturalnie po polsku i jasno oddaje zakres.
