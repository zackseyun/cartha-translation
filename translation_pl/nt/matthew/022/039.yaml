  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: pl
  text: 'A drugie jest do niego podobne[a]: „Będziesz miłował swego bliźniego jak samego siebie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Drugie zaś jest do niego podobne”.'
    reason: Alternatywny szyk i sposób oddania łagodnego łącznika δέ; greka bez rodzajnika nie daje w polszczyźnie podstaw do rozróżnienia odpowiadającego angielskiemu „a second” i „the second”.
lexical_decisions:
- source_word: Δευτέρα
  choice: drugie
  rationale: Przymiotnik porządkowy rodzaju żeńskiego użyty rzeczownikowo wskazuje na drugie przykazanie. Język polski nie ma rodzajników, dlatego „drugie” naturalnie zachowuje sens liczebnika porządkowego bez wymuszania rozróżnienia między angielskim „a second” a „the second”.
- source_word: δὲ
  choice: A
  rationale: W tym miejscu δέ jest łagodnym łącznikiem rozwijającym wypowiedź, a nie wyrazem silnego przeciwstawienia. Polskie „A” naturalnie łączy to zdanie z poprzednim przykazaniem.
- source_word: ὁμοία αὐτῇ
  choice: jest do niego podobne
  rationale: ὁμοία z celownikiem αὐτῇ oznacza „podobne do niego”; zaimek odnosi się do pierwszego przykazania. Sformułowanie zachowuje porównanie, nie utożsamiając obu przykazań.
- source_word: Ἀγαπήσεις
  choice: Będziesz miłował
  rationale: Forma czasu przyszłego ma w cytowanym przykazaniu moc nakazu i odzwierciedla brzmienie Septuaginty w Kpł 19,18. „Będziesz miłował” zachowuje tę formę oraz podniosły, utrwalony rejestr biblijny.
- source_word: τὸν πλησίον σου
  choice: swego bliźniego
  rationale: Wyrażenie oznacza osobę będącą bliźnim adresata, nie tylko kogoś znajdującego się fizycznie blisko. „Bliźni” jest trafnym, zrozumiałym i utrwalonym polskim odpowiednikiem.
- source_word: ὡς σεαυτόν
  choice: jak samego siebie
  rationale: ὡς wprowadza miarę porównania, a zaimek zwrotny odnosi się do adresata. „Jak samego siebie” jest naturalnym polskim sformułowaniem i podkreśla zwrotny charakter wyrażenia.
theological_decisions:
- issue: Relacja drugiego przykazania do pierwszego
  choice: drugie jest do niego podobne
  alternative: drugie jest takie jak ono
  rationale: Przekład zachowuje stwierdzenie podobieństwa drugiego przykazania do pierwszego, nie utożsamiając ich i nie dopowiadając, czy chodzi dokładnie o rangę, rodzaj, czy znaczenie.
- issue: Nakazujący charakter cytatu
  choice: Będziesz miłował
  alternative: Miłuj
  rationale: Zachowanie formy przyszłej oddaje grecki sposób wyrażenia przykazania oraz jego starotestamentowe brzmienie, a zarazem jest po polsku czytelne jako nakaz.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Formy „miłował” i „bliźniego” zachowują rozpoznawalny rejestr cytatu z Pisma, pozostając zrozumiałe dla dzisiejszego odbiorcy.
