  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: pl
  text: 'A co do zmartwychwstania umarłych, czy nie czytaliście tego, co powiedział wam Bóg:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: A co do
  rationale: Przyimek περί z dopełniaczem wprowadza temat, a δέ zaznacza przejście do kolejnego punktu. „A co do” brzmi naturalnie po polsku i zachowuje tę funkcję bez nadawania wypowiedzi silnego przeciwstawienia.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: zmartwychwstania umarłych
  rationale: Wyrażenie oznacza zmartwychwstanie ludzi umarłych. Standardowy termin „zmartwychwstanie” jest jasny i odpowiada tematowi sporu z saduceuszami, a dopełniacz „umarłych” odzwierciedla grecką konstrukcję.
- source_word: οὐκ ἀνέγνωτε
  choice: czy nie czytaliście
  rationale: Aoryst występuje w pytaniu retorycznym odwołującym się do znajomości Pisma. Polski czas przeszły naturalnie oddaje to wezwanie do przypomnienia sobie przeczytanego tekstu.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: tego, co powiedział wam Bóg
  rationale: 'Naturalna polska strona czynna zachowuje wszystkie istotne elementy greckiej konstrukcji: treść wypowiedzi, jej adresatów i Boga jako mówiącego.'
- source_word: λέγοντος
  choice: ':'
  rationale: Imiesłów wprowadza bezpośredni cytat następujący w kolejnym wersecie. Współczesna polszczyzna najnaturalniej sygnalizuje go dwukropkiem; dodanie „mówiąc” byłoby niezręczne i redundantne po „powiedział”.
theological_decisions:
- issue: Bóg jako autor wypowiedzi Pisma i jej aktualni adresaci
  choice: „tego, co powiedział wam Bóg”
  alternative: „tego, co zostało wam powiedziane przez Boga”
  rationale: Strona czynna jasno zachowuje greckie wskazanie Boga jako mówiącego oraz zaimek „wam”, przez który dawne słowa Pisma zwracają się do słuchaczy Jezusa. Nie dodaje przy tym teorii natchnienia wykraczającej poza tekst.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano retoryczne pytanie oraz przejście do nowego tematu; uniknięto ciężkiej, nienaturalnej strony biernej i zbędnego imiesłowu przed cytatem.
