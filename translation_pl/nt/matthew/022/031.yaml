  verdict: approve
  source_fidelity: 'Przekład wiernie oddaje strukturę i sens greckiego tekstu: „A co do” przekazuje wprowadzenie tematu z περὶ δέ, „zmartwychwstania umarłych” zachowuje dopełniacz τῶν νεκρῶν, a pytanie „czy nie czytaliście” dobrze oddaje retoryczne οὐκ ἀνέγνωτε. Czynne „co powiedział wam Bóg” jest bezpiecznym, idiomatycznym odpowiednikiem biernego τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ i zachowuje zarówno Boga jako mówiącego, jak i „wam” jako adresatów. Dwukropek właściwie wprowadza cytat z następnego wersetu.'
  naturalness: Tekst jest naturalny we współczesnej standardowej polszczyźnie, ma odpowiedni godny rejestr i zachowuje płynność pytania retorycznego. Dwukropek po „Bóg” jest lepszy stylistycznie niż dosłowne, niezręczne „mówiąc”.
  terminology: „Zmartwychwstanie” jest ustalonym i właściwym terminem dla ἀνάστασις w tym kontekście. „Umarłych” trafnie oddaje grecki dopełniacz i nie zawęża znaczenia. Nazwa „Bóg” oraz sposób przypisania mu wypowiedzi są zgodne ze źródłem, bez dodawania interpretacji doktrynalnej.
