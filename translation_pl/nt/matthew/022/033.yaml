lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Prosty spójnik zachowuje ciągłość narracji z poprzedzającą wypowiedzią.
- source_word: ἀκούσαντες
  choice: gdy to usłyszały
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym. Zaimek „to” wskazuje na wcześniejszą odpowiedź Jezusa, choć dopełnienie pozostaje w grece domyślne.
- source_word: οἱ ὄχλοι
  choice: tłumy
  rationale: Zachowano liczbę mnogą greckiego rzeczownika; polskie „tłumy” brzmi naturalnie i współcześnie.
- source_word: ἐξεπλήσσοντο
  choice: zdumiewały się
  rationale: Forma imperfektu przedstawia trwającą lub żywo ukazaną reakcję słuchaczy; „zdumiewały się” zachowuje aspekt niedokonany i siłę czasownika.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: jego nauką
  rationale: Narzędnik po czasowniku „zdumiewać się” naturalnie wyraża podstawę reakcji. „Nauka” jest tu mniej techniczna i bardziej kontekstowa niż „doktryna”.
