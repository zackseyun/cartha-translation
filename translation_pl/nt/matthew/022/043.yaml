base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: pl
  text: 'Zapytał ich: „Jak więc Dawid w Duchu[a] nazywa go Panem[b], mówiąc:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pod wpływem Ducha” albo „za sprawą Ducha”. Greckie wyrażenie może wskazywać zarówno sferę działania, jak i sprawstwo wypowiedzi; „w Duchu” najściślej zachowuje jego formę.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „panem” lub „władcą”. Greckie κύριος jest tu tytułem, zwykle oddawanym jako „Pan”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Zapytał ich
  rationale: Historyczny czas teraźniejszy w narracji oddano naturalnym polskim czasem przeszłym. Ponieważ wypowiedź ma formę pytania, „zapytał” brzmi naturalniej niż dosłowne „mówi im”.
- source_word: Πῶς οὖν
  choice: Jak więc
  rationale: Zachowuje pytajny charakter πῶς oraz wynikowy lub nawiązujący odcień οὖν.
- source_word: Δαυὶδ
  choice: Dawid
  rationale: Zastosowano utrwaloną polską formę imienia.
- source_word: ἐν πνεύματι
  choice: będąc w Duchu
  rationale: Rozwinięcie konieczne dla naturalnej polszczyzny zachowuje podstawowy obraz greckiego ἐν, nie rozstrzygając całkowicie między sferą działania a pośrednictwem Ducha.
- source_word: καλεῖ αὐτὸν κύριον
  choice: nazywa go Panem
  rationale: „Pan” jest standardowym odpowiednikiem κύριος i zachowuje tytularne oraz intertekstualne znaczenie argumentu opartego na Psalmie 110.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów wiernie i naturalnie wprowadza następujący dalej cytat.
theological_decisions:
- issue: Odniesienie πνεύματι
  choice: Duch Święty, zaznaczony wielką literą jako „Duch”
  alternative: duch Dawida lub stan duchowego uniesienia
  rationale: Kontekst natchnionej wypowiedzi Dawida przemawia za odniesieniem do Ducha Świętego, ale przypis zachowuje możliwą różnicę między sferą a sprawstwem.
- issue: Znaczenie κύριος
  choice: Pan
  alternative: pan lub władca
  rationale: W pytaniu dotyczącym mesjańskiego Psalmu 110 forma „Pan” najlepiej zachowuje rangę tytułu i związek z cytowanym tekstem, bez dopowiadania tożsamości jego desygnatu.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Szyk zdania pozostaje bliski grece, ale „λέγει” oddano jako naturalne narracyjne „zapytał”. Wielka litera w „Duchu” i „Panem” sygnalizuje najbardziej prawdopodobne znaczenie kontekstowe; przypisy zachowują istotne alternatywy leksykalne.
