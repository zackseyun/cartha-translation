id: MAT.22.21
reference: Matthew 22:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: pl
  text: 'Powiedzieli mu: „Cezara”. Wtedy powiedział im: „Oddajcie[a] więc Cezarowi to, co należy do Cezara, a Bogu to, co należy do Boga”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Zapłaćcie” lub „dajcie to, co się należy”. Grecki czasownik może oznaczać „oddać”, „zapłacić” albo „przekazać należność”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Powiedzieli
  rationale: Grecki czas teraźniejszy pełni funkcję czasu historycznego; polski czas przeszły zapewnia naturalny tok narracji.
- source_word: Καίσαρος
  choice: Cezara
  rationale: Dopełniacz stanowi eliptyczną odpowiedź na pytanie, czyj wizerunek i napis widnieją na monecie.
- source_word: τότε λέγει
  choice: Wtedy powiedział
  rationale: Zachowuje następstwo wydarzeń, a historyczny czas teraźniejszy oddaje naturalnym polskim czasem przeszłym.
- source_word: Ἀπόδοτε
  choice: Oddajcie
  rationale: Czasownik ἀποδίδωμι może oznaczać oddanie, zapłatę lub przekazanie tego, co się komuś należy; „oddajcie” zachowuje zarówno sens zwrotu, jak i należności.
- source_word: οὖν
  choice: więc
  rationale: Wyraża wniosek wynikający z odpowiedzi rozmówców.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: Cezarowi to, co należy do Cezara
  rationale: Naturalnie oddaje konstrukcję z dopełniaczem i celownikiem oraz zachowuje pojęcie przynależności.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Bogu to, co należy do Boga
  rationale: Zachowuje ścisłą paralelę retoryczną z pierwszym członem wypowiedzi.
theological_decisions:
- issue: Zakres obowiązku wobec władzy świeckiej i Boga
  choice: Zachowano równoległe wezwanie do oddania każdemu tego, co do niego należy, bez dopowiadania zakresu tych roszczeń.
  alternative: Ograniczenie wypowiedzi wyłącznie do podatków albo odczytanie jej jako uznania nieograniczonej władzy państwa.
  rationale: Tekst rozróżnia roszczenie Cezara i roszczenie Boga, lecz nie rozwija pełnej teorii politycznej; przekład zachowuje tę celową zwięzłość i napięcie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano zwięzłość odpowiedzi „Cezara” oraz paralelizm obu członów wypowiedzi Jezusa.
