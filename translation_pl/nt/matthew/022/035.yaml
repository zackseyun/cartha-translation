translation:
  language: pl
  text: 'A jeden z nich, znawca Prawa[a], zadał Mu pytanie, wystawiając Go na próbę:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „prawnik”; chodzi o znawcę żydowskiego Prawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Naturalny polski spójnik narracyjny łączy zdanie z poprzednim kontekstem bez dodawania wyraźnej relacji czasowej.
- source_word: ἐπηρώτησεν
  choice: zapytał
  rationale: Zwięźle i naturalnie oddaje czynność zadania pytania; dopełnienie wynika z następującej wypowiedzi.
- source_word: εἷς ἐξ αὐτῶν
  choice: jeden z nich
  rationale: Naturalny polski odpowiednik konstrukcji partytywnej, wskazujący, że pytający należał do wcześniej wspomnianej grupy.
- source_word: νομικὸς
  choice: znawca Prawa
  rationale: W żydowskim kontekście chodzi o specjalistę w zakresie Prawa Mojżeszowego, nie o współczesnego prawnika; wielka litera precyzuje religijne odniesienie.
- source_word: πειράζων
  choice: wystawiając Go na próbę
  rationale: Oddaje imiesłów wyrażający okoliczność lub zamiar pytania oraz jego nieprzychylny, sprawdzający charakter, bez sugerowania wyłącznie nakłaniania do grzechu.
- source_word: αὐτόν
  choice: Go
  rationale: Zaimek odnosi się do Jezusa; zapis wielką literą jest zgodny z utrwalonym, godnym polskim stylem biblijnym.
theological_decisions:
- issue: Znaczenie πειράζων w odniesieniu do Jezusa
  choice: wystawiając Go na próbę
  alternative: kusząc Go
  rationale: Grecki czasownik może oznaczać próbowanie, sprawdzanie lub kuszenie. W tym kontekście opisuje wrogie badanie Jezusa; wybrane sformułowanie zachowuje tę intencję, nie zawężając sensu do nakłaniania do zła.
translation_notes:
  register: Współczesny, naturalny i godny polski styl biblijny. Dwukropek sygnalizuje, że w następnym wersecie następuje treść pytania. Powtórzenie „Go” zachowuje dwa odniesienia αὐτόν obecne w konstrukcji greckiej.
