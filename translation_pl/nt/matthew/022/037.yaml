id: MAT.22.37
reference: Matthew 22:37
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: pl
  text: 'On zaś powiedział mu: „Będziesz miłował Pana, swojego Boga, całym swoim sercem, całą swoją duszą[a] i całym swoim umysłem[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ψυχή może też znaczyć „życie” lub „cały człowiek”.
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe także: „rozumem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Łagodny łącznik rozwijający dialog; polskie „zaś” zachowuje niewielkie przeciwstawienie bez nadawania mu nadmiernej siły.
- source_word: ἔφη
  choice: powiedział
  rationale: Neutralnie i bez dopowiadania oddaje czasownik wprowadzający mowę bezpośrednią.
- source_word: Ἀγαπήσεις
  choice: Będziesz miłował
  rationale: Czas przyszły pełni tu funkcję nakazu i nawiązuje do brzmienia cytatu z Pwt 6,5; ta forma zachowuje zarazem uroczysty charakter przykazania.
- source_word: κύριον τὸν θεόν σου
  choice: Pana, swojego Boga
  rationale: „Pan” jest standardowym odpowiednikiem κύριος, a cała fraza zachowuje przymierzowe brzmienie cytatu. Przecinek naturalnie objaśnia w polszczyźnie, że Pan jest Bogiem adresata.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: całym swoim sercem
  rationale: Polski narzędnik idiomatycznie oddaje greckie ἐν w konstrukcji określającej pełnię zaangażowania; dosłowne „w całym sercu” byłoby tu mniej naturalne.
- source_word: ψυχῇ
  choice: duszą
  rationale: Zachowuje odrębność elementów wyliczenia i tradycyjne brzmienie przykazania, choć ψυχή może również oznaczać życie lub całego człowieka.
- source_word: διανοίᾳ
  choice: umysłem
  rationale: Naturalnie oddaje zdolność myślenia i rozumienia, zachowując intelektualny wymiar wyliczenia.
theological_decisions:
- issue: Sposób oddania cytatu z Pwt 6,5 w odpowiedzi Jezusa
  choice: Zachowanie trójczłonowego wyliczenia „serce — dusza — umysł” oraz formy „Będziesz miłował”
  alternative: Parafraza ujmująca wszystkie trzy określenia jako miłowanie Boga całym sobą albo użycie bezpośredniego trybu rozkazującego „Miłuj”
  rationale: Grecki tekst rozróżnia καρδία, ψυχή i διάνοια, dlatego przekład nie scala ich w interpretacyjną parafrazę. Przyszła forma czasownika zachowuje charakter przykazania i echo tekstu biblijnego.
translation_notes:
  register: Współczesna, godna polszczyzna o lekko uroczystym rejestrze właściwym cytatowi z Pisma. Powtórzenie zaimka „swoim” ograniczono dzięki naturalnej polskiej składni, a paralelizm zachowano przez trzykrotne „całym/całą”.
