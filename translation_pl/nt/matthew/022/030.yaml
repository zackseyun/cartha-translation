source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: pl
  text: Bo w zmartwychwstaniu[a] ani się nie żenią, ani nie wychodzą za mąż, lecz są jak aniołowie Boga w niebie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „przy zmartwychwstaniu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: w życiu po zmartwychwstaniu
  rationale: Grecka fraza może wskazywać zarówno na czas zmartwychwstania, jak i na stan zmartwychwstałego życia. Wybrane sformułowanie jest naturalne po polsku i pasuje do opisu trwającego sposobu istnienia, a przypis zachowuje bardziej dosłowną możliwość.
- source_word: γαμοῦσιν
  choice: żenią się
  rationale: W zestawieniu z następnym czasownikiem forma ta tradycyjnie przedstawia zawieranie małżeństwa od strony mężczyzny. Polski zwrot jest naturalny i zachowuje rozróżnienie obecne w grece.
- source_word: γαμίζονται
  choice: wychodzą za mąż
  rationale: Grecka forma bierna oznacza bycie wydawanym za mąż. Dosłowne „są wydawani za mąż” byłoby we współczesnej polszczyźnie niezręczne; idiom „wychodzą za mąż” naturalnie zachowuje drugą stronę tradycyjnego zestawienia.
- source_word: ὡς
  choice: jak
  rationale: 'Wyraża porównanie, a nie utożsamienie: zmartwychwstali są podobni do aniołów w omawianym względzie, lecz tekst nie mówi, że stają się aniołami.'
- source_word: ἄγγελοι θεοῦ
  choice: aniołowie Boga
  rationale: Oddaje obecny w tekście dopełniacz θεοῦ, nie pomijając odniesienia do Boga.
- source_word: ἐν τῷ οὐρανῷ
  choice: w niebie
  rationale: W tym kontekście οὐρανός oznacza niebo jako sferę przebywania aniołów, nie fizyczne sklepienie czy nieboskłon.
- source_word: γὰρ
  choice: bo
  rationale: Naturalnie i zwięźle zachowuje uzasadniający związek z poprzednią wypowiedzią.
theological_decisions:
- issue: Zakres podobieństwa do aniołów
  choice: Zmartwychwstali są jak aniołowie w kontekście niezawierania małżeństw.
  alternative: Słowa te można szerzej odczytać jako opis anielskiego sposobu istnienia.
  rationale: ὡς wprowadza podobieństwo, nie tożsamość, a najbliższy kontekst określa jego punkt jako brak zawierania małżeństw. Przekład nie sugeruje więc, że ludzie stają się aniołami.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Dodane słowo „ludzie” jasno wskazuje domyślny podmiot liczby mnogiej i pozwala naturalnie zastosować równoległe polskie zwroty „żenią się” oraz „wychodzą za mąż” bez zmiany sensu.
