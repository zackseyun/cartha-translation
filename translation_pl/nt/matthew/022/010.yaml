  source_fidelity: 'Przekład wiernie oddaje kolejność i zakres greckiej narracji: „tamci niewolnicy” odpowiada οἱ δοῦλοι ἐκεῖνοι, „na drogi” — εἰς τὰς ὁδούς, a „wszystkich, których znaleźli” zachowuje inkluzywność πάντας οὓς εὗρον. Kontrast „zarówno złych, jak i dobrych” trafnie zachowuje πονηρούς τε καὶ ἀγαθούς. „Sala weselna ... napełniła się gośćmi spoczywającymi przy stole” jest uzasadnionym, czytelnym oddaniem γάμος i ἀνακειμένων w tym kontekście; przypisy zachowują istotną wieloznaczność γάμος oraz wyjaśniają zwyczaj biesiadny.'
  naturalness: Tekst jest naturalny we współczesnej, godnej polszczyźnie. Szyk i interpunkcja są płynne, a „spoczywającymi przy stole” brzmi wystarczająco jasno w połączeniu z przypisem kulturowym.
  terminology: „Niewolnicy” właściwie nie łagodzi δοῦλοι. „Złych” zachowuje moralną siłę πονηρούς bez doktrynalnego dopowiadania. „Sala weselna” jest kontekstowo uzasadniona, a przypis poprawnie sygnalizuje dosłowne „wesele” oraz możliwe znaczenie uczty lub miejsca uczty.
