id: MAT.22.10
reference: Matthew 22:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: pl
  text: Tamci niewolnicy wyszli więc na drogi i zebrali wszystkich, których znaleźli — zarówno złych, jak i dobrych[a]. Sala weselna[b] zaś napełniła się gośćmi spoczywającymi przy stole[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zarówno niegodziwych, jak i dobrych”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „wesele”; określenie to może tu oznaczać ucztę weselną albo miejsce, w którym się odbywała.'
    reason: lexical_alternative
  - marker: c
    text: Podczas uroczystych posiłków zwyczajowo zajmowano przy stole pozycję półleżącą.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: niewolnicy
  rationale: Termin oznacza osoby pozostające pod władzą pana i zachowuje realia niewolnictwa obecne w przypowieści; „słudzy” łagodziłoby ten aspekt.
- source_word: ὁδοὺς
  choice: drogi
  rationale: Szerokie określenie publicznych szlaków i miejsc komunikacji; kontekst nie wymaga zawężenia do miejskich ulic.
- source_word: συνήγαγον
  choice: zebrali
  rationale: Bezpośredni i naturalny odpowiednik czasownika oznaczającego zgromadzenie ludzi w jednym miejscu.
- source_word: πάντας οὓς εὗρον
  choice: wszystkich, których znaleźli
  rationale: Zachowuje powszechny zakres wyrażenia oraz jego osobowy charakter.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: zarówno złych, jak i dobrych
  rationale: Oddaje wyraźny kontrast moralny, nie ograniczając go do łagodniejszego przeciwstawienia „niedobrych i dobrych”.
- source_word: γάμος
  choice: sala weselna
  rationale: Grecki rzeczownik może oznaczać wesele lub ucztę weselną, lecz czasownik „napełniła się” oraz wzmianka o osobach przy stole wskazują w tym zdaniu na miejsce uczty; doprecyzowanie objaśnia obraz, a przypis zachowuje dosłowną możliwość.
- source_word: ἐπλήσθη
  choice: napełniła się
  rationale: Naturalnie oddaje bierną formę czasownika i wskazuje, że miejsce stało się pełne.
- source_word: ἀνακειμένων
  choice: gośćmi spoczywającymi przy stole
  rationale: Imiesłów oznacza osoby leżące lub półleżące podczas posiłku; dodanie „gośćmi” i „przy stole” jasno osadza tę pozycję w realiach uczty.
theological_decisions:
- issue: Moralna charakterystyka zgromadzonych
  choice: zarówno złych, jak i dobrych
  alternative: zarówno niegodziwych, jak i dobrych; zarówno niedobrych, jak i dobrych
  rationale: Przekład zachowuje moralną ostrość greckiego πονηρούς oraz bezwarunkowo szeroki zakres zgromadzenia, nie rozstrzygając napięcia między samym przybyciem na ucztę a późniejszą oceną uczestników.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Szyk „tamci niewolnicy” nawiązuje do wcześniej wspomnianych postaci, a pauza uwydatnia zaskakującą rozpiętość moralną zgromadzonych. Termin „niewolnicy” świadomie zachowuje historyczną relację zależności.
