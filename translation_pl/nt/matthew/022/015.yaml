  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: pl
  text: Wtedy faryzeusze odeszli i naradzili się, jak pochwycić go na słowie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „zastawić na niego pułapkę przez to, co powie”.'
    reason: Alternatywne, bardziej objaśniające oddanie παγιδεύσωσιν ἐν λόγῳ, ukazujące wypowiedź jako środek schwytania.
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wskazującego na kolejny moment narracji.
- source_word: πορευθέντες
  choice: odeszli
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą naradę; forma osobowa brzmi po polsku naturalnie i zachowuje następstwo zdarzeń.
- source_word: οἱ Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska nazwa tej grupy; zgodnie ze współczesną normą nazwa członków stronnictwa jest zapisana małą literą.
- source_word: συμβούλιον ἔλαβον
  choice: naradzili się
  rationale: Grecki idiom oznacza odbycie narady lub powzięcie wspólnego planu. Wrogi cel wynika z dalszej części zdania, więc sam idiom oddano bez dodatkowego wzmacniania.
- source_word: ὅπως
  choice: jak
  rationale: Po czasowniku „naradzili się” naturalnie wprowadza treść oraz zamierzony cel narady.
- source_word: αὐτὸν
  choice: go
  rationale: Zaimek odnosi się do Jezusa i pełni funkcję dopełnienia bliższego.
- source_word: παγιδεύσωσιν
  choice: pochwycić
  rationale: Zachowuje obraz schwytania w pułapkę, a w połączeniu „pochwycić na słowie” jasno wyraża próbę wykorzystania czyjejś wypowiedzi przeciw niemu.
- source_word: ἐν λόγῳ
  choice: na słowie
  rationale: Polski idiom „pochwycić na słowie” naturalnie przekazuje sens schwytania kogoś przez to, co powie, zachowując zarazem zwięzłość greckiego wyrażenia.
theological_decisions:
- issue: Stopień wrogości wyrażony przez συμβούλιον ἔλαβον
  choice: Neutralne „naradzili się”, przy czym złośliwy zamiar wyraża zdanie celowe „jak pochwycić go na słowie”.
  alternative: „Uknuli plan” albo „spiskowali”.
  rationale: Wrogi zamiar jest niewątpliwy, lecz w tekście greckim ujawnia go przede wszystkim czasownik παγιδεύσωσιν. Neutralniejsze oddanie idiomu nie przenosi tej treści przedwcześnie na samą naradę.
- issue: Sposób rozumienia ἐν λόγῳ
  choice: „na słowie”, czyli wykorzystując wypowiedź Jezusa jako podstawę do jego pochwycenia.
  alternative: „za pomocą wypowiedzi” lub „przez to, co powie”.
  rationale: Greckie wyrażenie dopuszcza zarówno odcień sfery („w mowie”), jak i środka („za pomocą wypowiedzi”). Polski idiom zachowuje tę zwięzłą, nieco otwartą relację.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr narracyjny. Konstrukcja „pochwycić na słowie” jest zrozumiała w standardowej polszczyźnie i zachowuje metaforę pułapki bez nadmiernego objaśniania tekstu głównego.
