source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: pl
  text: Było zaś u nas siedmiu braci. Pierwszy się ożenił i umarł, a nie mając potomstwa[a], zostawił swoją żonę bratu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „nie mając nasienia”. „Nasienie” oznacza tutaj potomstwo lub potomków.'
    reason: lexical_alternative
  - marker: b
    text: 'Mowa o zwyczaju małżeństwa lewirackiego: od brata zmarłego oczekiwano, że poślubi wdowę, aby wzbudzić mu potomstwo; zob. Pwt 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: u nas
  rationale: παρά z celownikiem wskazuje tu na obecność lub przynależność do opisywanej społeczności. „U nas” jest naturalnym polskim odpowiednikiem w wypowiedzi saduceuszy.
- source_word: ἑπτὰ ἀδελφοί
  choice: siedmiu braci
  rationale: W kontekście małżeństwa lewirackiego ἀδελφοί oznacza braci, czyli męskie rodzeństwo.
- source_word: ὁ πρῶτος
  choice: pierwszy
  rationale: πρῶτος wskazuje na pierwszego w kolejności opowiadania, niekoniecznie najstarszego.
- source_word: γήμας
  choice: się ożenił
  rationale: Imiesłów aorystu oznacza zawarcie małżeństwa przed śmiercią. Polski czasownik „ożenił się” naturalnie odnosi się do mężczyzny.
- source_word: ἐτελεύτησεν
  choice: umarł
  rationale: Bezpośrednio i jasno oddaje znaczenie czasownika τελευτάω, bez eufemizowania.
- source_word: μὴ ἔχων σπέρμα
  choice: ponieważ nie miał potomstwa
  rationale: σπέρμα dosłownie znaczy „nasienie”, lecz w tym kontekście rodzinnym i prawnym oznacza potomstwo. Konstrukcja przyczynowa naturalnie oddaje okoliczność wyrażoną imiesłowem.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: zostawił swoją żonę
  rationale: ἀφίημι oznacza tu pozostawienie żony wskutek śmierci, a nie rozwód ani porzucenie.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: bratu
  rationale: Celownik wskazuje brata, któremu pozostawiona została wdowa. Polski celownik zwięźle zachowuje tę relację.
theological_decisions:
- issue: Czy wyjaśnić małżeństwo lewirackie bezpośrednio w tekście głównym
  choice: Zachować zwięzłe, domyślne sformułowanie tekstu greckiego.
  alternative: „zostawił swoją żonę, aby poślubił ją jego brat”
  rationale: Tło prawne z Pwt 25:5 jest zakładane, ale tekst grecki nie mówi wprost „aby ją poślubił”. Objaśnienie należy więc umieścić w przypisie, nie dodawać do tekstu głównego.
translation_notes:
  register: Współczesna, standardowa polszczyzna o prostym i godnym brzmieniu. Zachowano spójnik δέ jako „zaś”, a założone tło prawne pozostawiono w przypisie. Markery przypisów umieszczono przy wyrażeniach, których faktycznie dotyczą.
