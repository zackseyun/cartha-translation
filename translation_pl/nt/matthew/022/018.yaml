  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: pl
  text: 'Jezus jednak, znając ich niegodziwe zamiary[a], powiedział: „Dlaczego mnie wystawiacie na próbę[b], obłudnicy?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „ich niegodziwość” lub „ich złośliwość”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „Dlaczego mnie kusicie?”. Grecki czasownik może oznaczać „poddawać próbie”, „próbować” albo „kusić”, zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: znając
  rationale: Imiesłów aorystu od γινώσκω wyraża uprzednią świadomość Jezusa co do ich motywów; „znając” jest zwięzłe i naturalne.
- source_word: δὲ
  choice: jednak
  rationale: 'Oddaje łagodny kontrast: rozmówcy udają szczerość, Jezus natomiast zna ich rzeczywiste zamiary.'
- source_word: πονηρίαν
  choice: niegodziwe zamiary
  rationale: W kontekście πονηρία odnosi się do moralnie złej, wrogiej intencji stojącej za pytaniem, nie tylko do abstrakcyjnie pojmowanego zła.
- source_word: εἶπεν
  choice: powiedział
  rationale: Naturalny, standardowy odpowiednik narracyjnej formy czasownika λέγω.
- source_word: Τί
  choice: Dlaczego
  rationale: W tym użyciu zaimek pytajny wprowadza pytanie o powód; polskie „dlaczego” naturalnie oddaje grecki idiom.
- source_word: πειράζετε
  choice: wystawiacie mnie na próbę
  rationale: πειράζω może oznaczać próbowanie, poddawanie próbie lub kuszenie. Wybrane sformułowanie zachowuje wieloznaczność, a zarazem pasuje do próby pochwycenia Jezusa w pułapkę.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Utrwalony i trafny polski odpowiednik określający ludzi pozorujących szczerość, choć ukrywają wrogie pobudki.
theological_decisions:
- issue: Opis rozpoznania przez Jezusa wewnętrznych pobudek przeciwników
  choice: Jezus zna ich niegodziwe zamiary.
  alternative: Jezus rozpoznaje ich niegodziwość lub złośliwość.
  rationale: Tekst przedstawia Jezusa jako trafnie rozpoznającego moralny charakter ich działania, ale przekład nie rozszerza tej wypowiedzi w ogólne twierdzenie doktrynalne.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Szyk z „jednak” po podmiocie brzmi naturalnie po polsku, a bezpośrednie „obłudnicy” zachowuje ostrość wypowiedzi Jezusa.
