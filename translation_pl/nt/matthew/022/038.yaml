  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: pl
  text: To jest wielkie i pierwsze przykazanie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „To jest najważniejsze przykazanie”. Greka dosłowniej zawiera dwa określenia: „wielkie i pierwsze przykazanie”.'
    reason: Alternatywny, bardziej idiomatyczny sposób oddania pierwszeństwa co do rangi.
lexical_decisions:
- source_word: αὕτη
  choice: To
  rationale: Zaimek wskazujący odsyła do przykazania przytoczonego w poprzednim wersecie; polskie „to” zachowuje to odniesienie w naturalny sposób.
- source_word: ἐστὶν
  choice: jest
  rationale: Prosta forma łącznikowa w czasie teraźniejszym, oddana bezpośrednio.
- source_word: μεγάλη
  choice: wielkie
  rationale: Przymiotnik oznacza tu wielkość pod względem znaczenia lub rangi. Forma „największe” byłaby mocniejsza niż grecki stopień równy.
- source_word: πρώτη
  choice: pierwsze
  rationale: Wyraża pierwszeństwo w kolejności lub randze; bezpośredni przekład zachowuje odrębność obu greckich określeń.
- source_word: ἐντολή
  choice: przykazanie
  rationale: W kontekście Prawa i nauczania biblijnego „przykazanie” jest naturalnym, utrwalonym i precyzyjnym odpowiednikiem.
theological_decisions:
- issue: Relacja określeń μεγάλη i πρώτη
  choice: 'Zachować oba skoordynowane przymiotniki: „wielkie i pierwsze przykazanie”.'
  alternative: „najważniejsze przykazanie” albo „największe i pierwsze przykazanie”
  rationale: Greka zawiera dwa odrębne przymiotniki w stopniu równym. Ich jawne oddanie chroni retoryczne napięcie między wielkością a pierwszeństwem, bez sprowadzania obu do jednego superlatywu.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Szyk jest naturalny po polsku, a zarazem możliwie bliski strukturze greckiej; zachowano oba określenia przykazania.
