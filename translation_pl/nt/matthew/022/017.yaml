source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: pl
  text: 'Powiedzcie nam więc: jak sądzisz, czy wolno dać cesarzowi podatek pogłówny, czy nie?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: co o tym sądzisz
  rationale: Naturalny współczesny polski odpowiednik pytania o opinię adresata; zachowuje liczbę pojedynczą zaimka σοι.
- source_word: ἔξεστιν
  choice: czy wolno
  rationale: Oddaje pytanie o dopuszczalność zgodnie z prawem, bez rozstrzygania, czy chodzi wyłącznie o Prawo Mojżeszowe, czy szerzej o legalność.
- source_word: δοῦναι
  choice: dać
  rationale: Formalnie zachowuje podstawowy sens greckiego czasownika i celowo nie zastępuje go interpretacyjnym „płacić”.
- source_word: κῆνσον
  choice: podatek
  rationale: W kontekście oznacza rzymski podatek pogłówny; w tekście głównym użyto zrozumiałego ogólnego określenia, unikając mało naturalnego „pogłówne”.
- source_word: Καίσαρι
  choice: cesarzowi
  rationale: Tytuł władcy został oddany naturalnym polskim odpowiednikiem w celowniku.
theological_decisions:
- issue: Zakres pytania ἔξεστιν
  choice: czy wolno
  alternative: czy Prawo pozwala
  rationale: Greka nie wymienia wprost Prawa; przekład zachowuje otwartość pytania i nie dopowiada jego podstawy prawnej lub religijnej.
- issue: δοῦναι w odniesieniu do podatku
  choice: dać podatek
  alternative: zapłacić podatek
  rationale: Zachowano wybrane w warstwie konsultacyjnej dosłowniejsze „dać”, nie łagodząc napięcia między oddaniem należności a samym płaceniem.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Pierwszy czasownik pozostaje w liczbie mnogiej („Powiedzcie”), a pytanie o opinię w liczbie pojedynczej („sądzisz”), zgodnie z greckim tekstem, gdzie grupa zwraca się do jednego Jezusa.
