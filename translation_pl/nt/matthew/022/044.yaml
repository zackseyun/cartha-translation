source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: pl
  text: '„Pan powiedział mojemu Panu: «Zasiądź po mojej prawej stronie, aż położę twoich wrogów pod twoimi stopami»?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: powiedział
  rationale: Zwykły i naturalny odpowiednik aorystu czasownika λέγω w formule wprowadzającej cytat.
- source_word: κύριος / τῷ κυρίῳ μου
  choice: Pan / mojemu Panu
  rationale: Ten sam tytuł oddaje oba wystąpienia κύριος, zgodnie z greckim tekstem, natomiast zaimek „mojemu” zachowuje relacyjne rozróżnienie między adresatem a mówiącym Panem.
- source_word: Κάθου
  choice: Zasiądź
  rationale: Imperatyw w kontekście intronizacji; „zasiądź” brzmi naturalnie i dostojnie oraz lepiej niż neutralne „usiądź” sygnalizuje objęcie honorowego miejsca.
- source_word: ἐκ δεξιῶν μου
  choice: po mojej prawej stronie
  rationale: Naturalny współczesny polski odpowiednik idiomu oznaczającego miejsce czci i władzy.
- source_word: ἕως ἂν θῶ
  choice: aż położę
  rationale: Oddaje przyszły kres wyrażony przez ἕως ἂν z aorystem trybu łączącego, bez dodawania treści nieobecnej w grece.
- source_word: τοὺς ἐχθρούς σου
  choice: twoich wrogów
  rationale: Jasny, standardowy odpowiednik ἐχθρούς.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: pod twoimi stopami
  rationale: Blisko oddaje właściwe dla tekstu Mateusza sformułowanie „pod stopami”, bez zastępowania go obrazem podnóżka pochodzącym z hebrajskiego brzmienia Psalmu 110:1.
theological_decisions:
- issue: Dwa wystąpienia κύριος w cytacie z Psalmu 110:1
  choice: Pan powiedział mojemu Panu
  alternative: PAN powiedział mojemu Panu; Pan powiedział mojemu panu
  rationale: Grecki cytat używa tego samego rzeczownika κύριος wobec obu osób. Zachowanie formy „Pan” w obu miejscach nie wprowadza typograficznego rozróżnienia opartego na hebrajskim tekście, którego sama greka nie zaznacza, i pozostawia napięcie stanowiące podstawę argumentacji Jezusa.
- issue: Obraz podporządkowania wrogów
  choice: położę twoich wrogów pod twoimi stopami
  alternative: uczynię twoich wrogów podnóżkiem pod twoje stopy
  rationale: Wybrano bezpośrednie brzmienie greckiego tekstu Mateusza. Wariant z podnóżkiem odzwierciedla hebrajski idiom Psalmu, lecz nie jest potrzebny do przełożenia zachowanej greckiej frazy.
translation_notes:
  register: Współczesny, zrozumiały i podniosły rejestr odpowiedni dla cytatu psalmicznego. Forma „zasiądź” zachowuje kontekst królewskiej intronizacji, a składnia pozostaje naturalna po polsku.
