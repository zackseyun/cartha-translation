  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: pl
  text: Nauczycielu, które przykazanie jest największe w Prawie?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Wołacz będący bezpośrednim zwrotem do Jezusa; to naturalny i podstawowy polski odpowiednik διδάσκαλος w tym kontekście.
- source_word: ποία
  choice: które
  rationale: Zaimek pytajny wskazuje na wybór jednego przykazania spośród przykazań zawartych w Prawie.
- source_word: ἐντολὴ
  choice: przykazanie
  rationale: W żydowskim kontekście prawnym i biblijnym termin ten naturalnie oznacza przykazanie.
- source_word: μεγάλη
  choice: największe
  rationale: Choć greka używa przymiotnika w stopniu równym, w pytaniu o wybór spośród wielu ma on kontekstową funkcję superlatywną; polskie „największe” oddaje ten sens naturalnie.
- source_word: ἐν τῷ νόμῳ
  choice: w Prawie
  rationale: νόμος odnosi się tutaj do Prawa Mojżeszowego, czyli Tory; wielka litera sygnalizuje ten określony zbiór Pism.
theological_decisions:
- issue: Czy μεγάλη oddać formalnie jako „wielkie”, czy kontekstowo jako „największe”
  choice: największe
  alternative: wielkie
  rationale: Stopień równy w grece może w takim pytaniu służyć wskazaniu najwyższej rangi w danym zbiorze. Polski wymaga tu stopnia najwyższego, aby pytanie brzmiało naturalnie i przekazywało jego kontekstowy sens, bez rozstrzygania treści odpowiedzi.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Szyk zdania jest naturalny dla polszczyzny, a zapis „Prawo” wskazuje na Torę/Prawo Mojżeszowe.
