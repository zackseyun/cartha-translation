base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: pl
  text: Gdy zaś faryzeusze usłyszeli, że zamknął usta saduceuszom[a], zebrali się razem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „nałożył kaganiec saduceuszom”. Grecki czasownik oznacza nałożenie kagańca, a tutaj przenośnie — uciszenie ich w sporze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Sygnalizuje łagodne przejście narracyjne i kontrast z poprzednią rozmową, bez nadmiernie mocnego przeciwstawienia.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona we współczesnej polszczyźnie nazwa żydowskiego ugrupowania.
- source_word: ἀκούσαντες
  choice: gdy ... usłyszeli
  rationale: Imiesłów aorystu ma tu naturalny sens czasowy; polska konstrukcja zachowuje następstwo wydarzeń.
- source_word: ἐφίμωσεν
  choice: zamknął usta
  rationale: Zwrot oddaje figuratywny sens skutecznego uciszenia przeciwników w sporze, a zarazem częściowo zachowuje konkretność greckiego obrazu kagańca.
- source_word: Σαδδουκαίους
  choice: saduceuszom
  rationale: Utrwalona polska nazwa żydowskiego ugrupowania; celownik wynika z idiomu „zamknąć komuś usta”.
- source_word: συνήχθησαν
  choice: zebrali się
  rationale: 'Forma bierna ma w kontekście sens nieprzechodni: członkowie grupy zgromadzili się.'
- source_word: ἐπὶ τὸ αὐτό
  choice: razem
  rationale: Naturalnie oddaje idiom oznaczający wspólne zgromadzenie, bez rozstrzygania, czy nacisk pada na miejsce, czy cel.
