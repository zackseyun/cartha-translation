  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: pl
  text: Na tych dwóch przykazaniach opiera się całe Prawo i Prorocy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Na tych dwóch przykazaniach wisi całe Prawo i Prorocy”. Grecki czasownik zachowuje obraz zawieszenia i wyraża zależność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: Na tych dwóch przykazaniach
  rationale: Choć ἐν formalnie znaczy „w”, w połączeniu z κρέμαται wyraża tutaj podstawę lub zależność. Polskie „na tych… opiera się” naturalnie oddaje tę relację.
- source_word: ὅλος ὁ νόμος
  choice: całe Prawo
  rationale: ὅλος podkreśla całość, a „Prawo” odnosi się w tym kontekście do Tory, dlatego zastosowano wielką literę.
- source_word: κρέμαται
  choice: opiera się
  rationale: Dosłowne „wisi” zachowywałoby obraz grecki, lecz po polsku mogłoby brzmieć nienaturalnie lub sugerować fizyczne zawieszenie. „Opiera się” jasno i idiomatycznie przekazuje metaforę zależności, nie sprowadzając jej wyłącznie do streszczenia.
- source_word: καὶ οἱ προφῆται
  choice: i Prorocy
  rationale: Wraz z „Prawem” jest to utrwalone określenie części Pisma i szerzej jego świadectwa, dlatego „Prorocy” zapisano wielką literą.
theological_decisions:
- issue: Znaczenie formuły „Prawo i Prorocy”
  choice: Zachowano tradycyjną formułę odnoszącą się do autorytatywnego świadectwa Pisma jako całości.
  alternative: 'Parafraza: „całe Pismo” albo węższe odniesienie jedynie do nauczania etycznego Prawa i proroków.'
  rationale: Grecki tekst zachowuje rozróżnienie „Prawo i Prorocy”. Nie należy go zastępować interpretującą parafrazą, choć w Ewangelii Mateusza formuła ta obejmuje szeroko pojmowane świadectwo Pisma.
- issue: Relacja Prawa i Proroków do dwóch przykazań
  choice: „opiera się” — wyraża zależność, zachowując metaforyczną siłę κρέμαται.
  alternative: „streszcza się” — wskazywałoby przede wszystkim na podsumowanie treści.
  rationale: Tekst mówi dosłownie o „wiszeniu”, a więc o zależności lub oparciu. „Streszcza się” byłoby teologicznie możliwym objaśnieniem, ale zawężałoby metaforę.
translation_notes:
  register: Współczesny, godny i komunikatywny polski. Zachowano utrwalone biblijne określenie „Prawo i Prorocy”, a niezręczne w tym kontekście dosłowne „wisi” przeniesiono do przypisu.
