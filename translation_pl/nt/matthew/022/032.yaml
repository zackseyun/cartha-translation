  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: pl
  text: „Ja jestem Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba”. Nie jest Bogiem umarłych, lecz żyjących.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ja jestem
  rationale: Zachowuje wyraźny zaimek ἐγώ oraz czas teraźniejszy, istotny dla argumentacji Jezusa i zgodny z formą cytowanego Pisma.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba
  rationale: Powtórzenie słowa „Bogiem” oddaje trzykrotną grecką konstrukcję i jej retoryczny nacisk, a narzędnik jest wymagany po polskim „jestem”.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Nie jest Bogiem
  rationale: Polszczyzna naturalnie dopuszcza podmiot domyślny, odnoszący się do Boga właśnie wymienionego; zarazem rzeczownik „Bogiem” pozostaje jawny, zgodnie z tekstem greckim.
- source_word: νεκρῶν
  choice: umarłych
  rationale: Przymiotnik w liczbie mnogiej użyty rzeczownikowo oznacza ludzi umarłych; zwięzłe „umarłych” zachowuje antytezę.
- source_word: ζώντων
  choice: żyjących
  rationale: Imiesłów użyty rzeczownikowo zostaje oddany symetrycznie wobec „umarłych” i zachowuje aspekt trwającego życia.
theological_decisions:
- issue: Znaczenie wypowiedzi dla argumentu o zmartwychwstaniu i dalszym życiu patriarchów przed Bogiem
  choice: Nie jest Bogiem umarłych, lecz żyjących.
  alternative: Nie jest Bogiem ludzi umarłych, lecz tych, którzy nadal dla Niego żyją.
  rationale: Prosty przekład zachowuje siłę argumentu Jezusa, ale nie dopowiada nauki o stanie pośrednim ani nie rozstrzyga ponad to, co wyraża grecki tekst.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano retoryczne powtórzenie „Bogiem” w cytacie, lecz pominięto zbędne w polszczyźnie powtórzenie podmiotu w drugim zdaniu. Bez przypisów, ponieważ polskie brzmienie może naturalnie zachować jawne „Bogiem” bez niezręczności wskazanej w angielskiej warstwie konsultacyjnej.
