  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: pl
  text: Król zaś rozgniewał się, posłał swoje wojska, zgładził tamtych morderców i spalił ich miasto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: rozgniewał się
  rationale: Naturalny i precyzyjny odpowiednik greckiego czasownika oznaczającego wpadnięcie w gniew.
- source_word: τὰ στρατεύματα
  choice: wojska
  rationale: Liczba mnoga i kontekst królewski wskazują na siły zbrojne lub oddziały; „wojska” brzmi naturalnie i zachowuje zakres znaczeniowy.
- source_word: ἀπώλεσεν
  choice: zgładził
  rationale: Oddaje sprawcze zniszczenie i zabicie morderców, a zarazem zachowuje zwięzły, podniosły ton.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: tamtych morderców
  rationale: „Tamtych” zachowuje wskazujący i dystansujący charakter ἐκείνους, a „morderców” bezpośrednio oddaje φονεῖς.
- source_word: ἐνέπρησεν
  choice: spalił
  rationale: Jasny, współczesny odpowiednik oznaczający zniszczenie miasta przez ogień.
theological_decisions:
- issue: Czy doprecyzować symboliczne lub historyczne odniesienie zniszczenia miasta
  choice: Nie doprecyzowywać; zachować narracyjny sens przypowieści
  alternative: Dodać interpretacyjne odniesienie do Jerozolimy albo sądu Bożego
  rationale: Sam werset mówi o królu, mordercach i ich mieście; przekład nie powinien wprowadzać do tekstu określonej interpretacji teologicznej lub historycznej.
translation_notes:
  register: Współczesna, godna i zwięzła polszczyzna. Składnia współrzędna odtwarza szybki ciąg działań tekstu greckiego; brak przypisów, ponieważ w tym wersecie nie ma potrzeby objaśniania istotnej niejednoznaczności.
source_grounding:
  english_pob_role: consult_only
