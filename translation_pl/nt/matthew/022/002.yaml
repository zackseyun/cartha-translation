  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: pl
  text: Królestwo niebios zostało przyrównane do króla, który wyprawił ucztę weselną swojemu synowi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „można przyrównać do”. Grecka forma dosłownie znaczy „zostało przyrównane” lub „stało się podobne”; wariant modalny odpowiada utartej formule rozpoczynającej przypowieści, ale nie jest wyrażony wprost.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „wesela” (liczba mnoga), co po grecku może oznaczać uroczystości weselne lub ucztę weselną.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: zostało przyrównane do
  rationale: Aoryst strony biernej czasownika ὁμοιόω najbezpośredniej oddaje forma „zostało przyrównane do”. Zachowuje ona oznajmujący charakter greckiej formy bez dodawania modalności.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Zachowuje charakterystyczne dla Mateusza sformułowanie i nie harmonizuje go z wyrażeniem „królestwo Boga”.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: do pewnego króla
  rationale: W tej konstrukcji ἄνθρωπος wraz z βασιλεύς naturalnie wskazuje na osobę określoną jako król. Polskie „pewnego króla” oddaje tę idiomatyczną funkcję bez niezręcznego „człowieka, króla”.
- source_word: ὅστις
  choice: który
  rationale: Naturalny polski zaimek względny wystarcza w tym kontekście i nie wzmacnia niepotrzebnie greckiej formy.
- source_word: ἐποίησεν γάμους
  choice: wyprawił ucztę weselną
  rationale: Połączenie ποιέω z liczbą mnogą γάμους idiomatycznie oznacza urządzenie uroczystości weselnych. „Wyprawił ucztę weselną” jest naturalne i odpowiada kontekstowi uczty w przypowieści.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: swojemu synowi
  rationale: Celownik wskazuje, że uroczystość została urządzona dla syna; zaimek „swojemu” jednoznacznie odnosi syna do króla.
theological_decisions:
- issue: Charakter wyrażenia „królestwo niebios”
  choice: Zachować „królestwo niebios” jako własne sformułowanie Mateusza.
  alternative: królestwo Boga; panowanie niebios
  rationale: 'Przekład nie zastępuje Mateuszowego określenia interpretacyjną parafrazą i pozostawia otwarte jego odcienie znaczeniowe: panowanie oraz sferę królowania.'
- issue: Zakres porównania w przypowieści
  choice: Zachować konstrukcję, w której królestwo zostaje przyrównane do króla rozpoczynającego opowieść.
  alternative: Królestwo niebios jest podobne do uczty weselnej
  rationale: Grecki tekst gramatycznie wiąże porównanie z ἀνθρώπῳ βασιλεῖ, dlatego nie należy przenosić go wyłącznie na ucztę, mimo że dalsza opowieść rozwija cały obraz.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Wyprawił ucztę weselną” brzmi naturalnie po polsku, a „królestwo niebios” zachowuje Mateuszową terminologię. Strona bierna w pierwszym zdaniu została zachowana ze względu na formę grecką i jej znaczeniową niejednoznaczność.
