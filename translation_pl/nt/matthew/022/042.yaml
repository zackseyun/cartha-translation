  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: pl
  text: 'mówiąc: „Co sądzicie o Mesjaszu[a]? Czyim synem jest?” Odpowiedzieli mu: „Dawida”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Chrystus”. Grecki tytuł Χριστός (Christos) został tu użyty w znaczeniu mesjańskim.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów czasu teraźniejszego od λέγω wprowadza wypowiedź Jezusa; polskie „mówiąc” zachowuje składnię i tok narracji.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Co sądzicie
  rationale: Idiomu z δοκέω i celownikiem użyto do pytania o osąd lub opinię; „Co sądzicie” jest naturalne i wierne znaczeniowo.
- source_word: περὶ τοῦ χριστοῦ
  choice: o Mesjaszu
  rationale: Χριστός występuje tutaj jako tytuł w kontekście żydowskich oczekiwań mesjańskich, dlatego „Mesjasz” trafniej oddaje funkcję wyrazu niż imienne „Chrystus”.
- source_word: τίνος υἱός ἐστιν
  choice: Czyim jest synem
  rationale: Pytanie dotyczy pochodzenia i linii rodowej Mesjasza. Szyk ten jest zwięzły, naturalny i zachowuje rzeczownik „syn”.
- source_word: λέγουσιν αὐτῷ
  choice: Odpowiedzieli mu
  rationale: Choć dosłownie forma znaczy „mówią mu” i jest historycznym czasem teraźniejszym, w tym dialogu pełni funkcję odpowiedzi; polski czas przeszły zapewnia naturalny tok narracji.
- source_word: Τοῦ Δαυίδ
  choice: Dawida
  rationale: Grecki dopełniacz stanowi eliptyczną odpowiedź, w której domyślnie powtarza się „synem”. Samo „Dawida” zachowuje tę elipsę bez interpretacyjnego rozwijania.
theological_decisions:
- issue: Oddanie Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym miejscu wyraz jest tytułem i przedmiotem pytania o mesjańskie pochodzenie, a nie określeniem o charakterze imiennym. Przypis zachowuje tradycyjny wariant „Chrystus”.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano zwięzłość dialogu oraz eliptyczną odpowiedź „Dawida”; dwukropek po „mówiąc” naturalnie wprowadza mowę bezpośrednią.
