  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: pl
  text: 'Mówiąc: „Nauczycielu, Mojżesz powiedział: «Jeśli mężczyzna umrze, nie pozostawiając dzieci, jego brat poślubi jego żonę[a] i zapewni potomstwo swemu bratu»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie, bardziej formalnie: „spełni wobec niej obowiązek szwagra”. Grecki czasownik odnosi się konkretnie do małżeństwa lewirackiego, czyli poślubienia wdowy po zmarłym bracie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Naturalny i precyzyjny polski zwrot do Jezusa jako nauczyciela.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Jeśli umrze mężczyzna
  rationale: Kontekst prawa lewiratu oraz męska forma konstrukcji wskazują na mężczyznę, nie na osobę dowolnej płci.
- source_word: μὴ ἔχων τέκνα
  choice: nie mając dzieci
  rationale: 'Zachowuje konstrukcję imiesłowową i szerokie znaczenie τέκνα: dzieci, nie wyłącznie synowie.'
- source_word: ἐπιγαμβρεύσει
  choice: poślubi
  rationale: Oddaje podstawowy sens zawarcia małżeństwa, a szczególne znaczenie lewirackie objaśnia przypis.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: jego żonę
  rationale: Bezpośrednio odtwarza grecką składnię; w kontekście chodzi o wdowę po zmarłym.
- source_word: ἀναστήσει σπέρμα
  choice: wzbudzi potomstwo
  rationale: Zachowuje biblijny idiom i rodzinno-prokreacyjny sens wyrażenia bez dosłownego, mylącego „nasienia”.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: swemu bratu
  rationale: Celownik wskazuje, że potomstwo ma zostać uznane za potomstwo zmarłego brata.
theological_decisions:
- issue: Rodzaj gramatyczny w przykładzie prawnym
  choice: mężczyzna i jego brat
  alternative: ktoś i brat tej osoby
  rationale: Przytoczone prawo lewiratu opisuje konkretnie męskie role rodzinne, dlatego nie neutralizuje się płci wskazanej przez tekst.
- issue: Status potomstwa w małżeństwie lewirackim
  choice: wzbudzi potomstwo swemu bratu
  alternative: będzie miał potomstwo z wdową
  rationale: Grecki tekst podkreśla, że potomstwo zostaje wzbudzone dla zmarłego brata, a nie jedynie biologiczne ojcostwo żyjącego brata.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano formułę cytatu z Mojżesza oraz idiom „wzbudzić potomstwo”, z objaśnieniem technicznego terminu prawa lewiratu w przypisie.
