    rationale: „Jeśli umrze mężczyzna, nie mając dzieci” jest dosłowna, ale w nowoczesnej polszczyźnie mniej płynna. „Jeśli mężczyzna umrze, nie pozostawiając dzieci” jasno oddaje μὴ ἔχων τέκνα.
  - severity: low
    issue: Niejednoznaczne sformułowanie w przypisie
    rationale: Zwrot „obowiązek brata jej męża” nie identyfikuje dostatecznie jasno zmarłego męża kobiety. Doprecyzowanie „obowiązek szwagra wobec wdowy po zmarłym bracie” lepiej objaśnia sens techniczny bez zmiany znaczenia.
  - severity: low
    issue: Wielka litera na początku wersetu
    rationale: Tekst wersetu powinien zaczynać się od „Mówiąc”, a nie „mówiąc”.
