lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Grecki czas teraźniejszy pełni tu funkcję czasu historycznego; polski czas teraźniejszy naturalnie zachowuje żywość narracji.
- source_word: αὐτοῖς
  choice: im
  rationale: Celownik liczby mnogiej wskazuje adresatów wypowiedzi; polskie „im” jest zwięzłym i naturalnym odpowiednikiem.
- source_word: Τίνος
  choice: czyj jest
  rationale: Dopełniacz zaimka pytajnego pyta o przynależność lub związek; konstrukcja „czyj jest” jasno oddaje tę funkcję w odniesieniu do obu elementów monety.
- source_word: εἰκών
  choice: wizerunek
  rationale: „Wizerunek” naturalnie oznacza podobiznę osoby umieszczoną na monecie, bez zawężania jej do konkretnej techniki przedstawienia.
- source_word: αὕτη
  choice: ten
  rationale: Zaimek wskazujący zgadza się po polsku z rodzaju męskiego rzeczownikiem „wizerunek”.
- source_word: ἐπιγραφή
  choice: napis
  rationale: W kontekście monety „napis” jest precyzyjnym, współczesnym i powszechnie zrozumiałym odpowiednikiem oznaczającym umieszczony na niej tekst.
- source_word: καὶ
  choice: i
  rationale: Spójnik łączy dwa elementy objęte tym samym pytaniem o przynależność.
