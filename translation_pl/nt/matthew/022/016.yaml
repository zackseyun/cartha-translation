  verdict: revise
  source_fidelity: Grecki czas teraźniejszy „posyłają” został trafnie zachowany, podobnie jak „uczniowie”, „herodianie”, wołacz „Nauczycielu”, „droga Boża” oraz sens obu idiomów dotyczących niezależności od opinii i bezstronności. Dodane „więc” nie ma jednak odpowiednika w καί, a „z takim pytaniem” nie oddaje neutralnego λέγοντες („mówiąc”), zwłaszcza że wypowiedź jest wprowadzeniem do pytania dopiero w następnym wersecie.
  naturalness: Pozostałe sformułowania są współczesne i godne. „Nie oglądasz się na nikogo” oraz „nie kierujesz się pozycją ludzi” naturalnie przekazują sens w polszczyźnie, choć drugi zwrot jest interpretacyjnym objaśnieniem greckiego idiomu i dlatego właściwie nie powinien być dalej wzmacniany.
  terminology: „Herodianie”, „Nauczycielu”, „prawdomówny” i „droga Boża” są trafne. „Prawdomówny” w tym kontekście dobrze oddaje wiarygodność i szczerość przypisywaną nauczycielowi, bez niepotrzebnego rozstrzygania szerszych kwestii teologicznych.
