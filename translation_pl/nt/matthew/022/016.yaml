source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: pl
  text: 'Posyłają do niego swoich uczniów razem z herodianami[a], mówiąc: „Nauczycielu, wiemy, że jesteś prawdomówny i zgodnie z prawdą nauczasz drogi Bożej. Nie oglądasz się na nikogo[b], bo nie kierujesz się pozycją ludzi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Herodianie byli zwolennikami dynastii Heroda; dokładny charakter tej grupy nie jest pewny.
    reason: historical_context
  - marker: b
    text: 'Dosłownie: „nie dbasz o nikogo”; w tym kontekście chodzi o to, że Jezus nie ulega niczyjej opinii ani pozycji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: posyłają
  rationale: Historyczny czas teraźniejszy zachowuje formę grecką i dynamikę narracji.
- source_word: μαθητὰς
  choice: uczniów
  rationale: Standardowy i naturalny polski odpowiednik określający uczniów oraz zwolenników.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: razem z herodianami
  rationale: Jasno oddaje współudział grupy zwanej herodianami, bez dopowiadania jej dokładnego charakteru.
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Naturalna forma wołacza, zachowująca podstawowe znaczenie greckiego tytułu.
- source_word: ἀληθὴς
  choice: prawdomówny
  rationale: W tym kontekście pochwały nauczyciela określa kogoś szczerego i mówiącego prawdę; polskie „prawdziwy” byłoby mniej naturalne i mogłoby sugerować autentyczność zamiast wiarygodności.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: drogi Bożej
  rationale: Zachowuje biblijną metaforę drogi, obejmującą Bożą wolę i sposób życia.
- source_word: ἐν ἀληθείᾳ
  choice: zgodnie z prawdą
  rationale: Naturalnie oddaje nauczanie odpowiadające prawdzie, nie redukując zwrotu jedynie do szczerości.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: nie oglądasz się na nikogo
  rationale: Polski idiom przekazuje brak uległości wobec opinii lub statusu innych, bez sugerowania bezdusznej obojętności.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: bo nie kierujesz się pozycją ludzi
  rationale: Oddaje idiom o bezstronności i nieuwzględnianiu społecznej rangi; dosłowne „nie patrzysz na twarz” byłoby we współczesnej polszczyźnie mylące.
theological_decisions:
- issue: Idiomy wyrażające niezależność od ludzkich opinii i bezstronność
  choice: „Nie oglądasz się na nikogo, bo nie kierujesz się pozycją ludzi”
  alternative: „Nie dbasz o nikogo, bo nie patrzysz na twarz ludzi”
  rationale: 'Przekład znaczeniowy zapobiega błędnemu wrażeniu, że Jezus nie troszczy się o ludzi. Zachowuje zarazem sens wypowiedzi: nie daje się on powodować cudzą opinią ani statusem społecznym.'
- issue: Znaczenie ἀληθὴς w pochlebnym zwrocie do Jezusa
  choice: „prawdomówny”
  alternative: „prawdziwy” lub „szczery”
  rationale: „Prawdomówny” najtrafniej opisuje tutaj wiarygodność nauczyciela, nie rozstrzygając szerszych twierdzeń chrystologicznych na podstawie samego przymiotnika.
translation_notes:
  register: Współczesna, godna polszczyzna. Zachowano historyczny czas teraźniejszy, metaforę „drogi Bożej” oraz napięcie retoryczne pochlebstwa, natomiast greckie idiomy oddano naturalnymi polskimi sformułowaniami, by uniknąć mylnego sensu.
