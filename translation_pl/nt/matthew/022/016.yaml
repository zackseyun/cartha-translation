revisions:
- from: 'Posyłają więc do niego swoich uczniów razem z herodianami[a] z takim pytaniem: „Nauczycielu, wiemy, że jesteś prawdomówny i zgodnie z prawdą nauczasz drogi Bożej. Nie oglądasz się na nikogo[b], bo nie kierujesz się pozycją ludzi.”'
  to: 'Posyłają do niego swoich uczniów razem z herodianami[a], mówiąc: „Nauczycielu, wiemy, że jesteś prawdomówny i zgodnie z prawdą nauczasz drogi Bożej. Nie oglądasz się na nikogo[b], bo nie kierujesz się pozycją ludzi.”'
  rationale: Usunięto niepoświadczone „więc” i zastąpiono „z takim pytaniem” neutralnym „mówiąc”, aby ściślej oddać składnię oraz zakres wersetu greckiego. Pozostałe rozwiązania zachowano, ponieważ wiernie i naturalnie przekazują treść, a przypis wyjaśnia potencjalnie mylący idiom bez narzucania interpretacji doktrynalnej.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:14:03Z'
