  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: pl
  text: Czyją więc żoną spośród tych siedmiu będzie przy zmartwychwstaniu? Przecież wszyscy ją mieli za żonę.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „wszyscy ją mieli”. W tym kontekście chodzi o to, że każdy z siedmiu miał ją za żonę.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: przy zmartwychwstaniu
  rationale: Wyrażenie z ἐν ma tu sens czasowo-sytuacyjny. „Przy zmartwychwstaniu” jest naturalne po polsku i odnosi pytanie do przyszłego zmartwychwstania umarłych.
- source_word: οὖν
  choice: więc
  rationale: Zachowuje wnioskowy związek pytania z przedstawionym wcześniej przypadkiem.
- source_word: τίνος τῶν ἑπτὰ
  choice: czyją ... spośród tych siedmiu
  rationale: Oddaje pytanie o to, do którego z siedmiu braci miałaby należeć relacja małżeńska, w naturalnym polskim szyku.
- source_word: ἔσται γυνή
  choice: będzie ... żoną
  rationale: Kontekst małżeński rozstrzyga wieloznaczność γυνή („kobieta” lub „żona”) na rzecz „żona”; czas przyszły oddaje ἔσται.
- source_word: πάντες γὰρ
  choice: przecież wszyscy
  rationale: „Przecież” naturalnie wyraża uzasadniający i retoryczny charakter γάρ w tym pytaniu.
- source_word: ἔσχον αὐτήν
  choice: mieli ją za żonę
  rationale: Greckie wyrażenie dosłownie brzmi „mieli ją”, lecz w tym kontekście oznacza pozostawanie z nią w relacji małżeńskiej. Dodanie „za żonę” usuwa w polszczyźnie niepożądaną dwuznaczność, zachowując zwięzłość.
theological_decisions:
- issue: Znaczenie ἀνάστασις w pytaniu saduceuszy
  choice: Przyszłe zmartwychwstanie umarłych
  alternative: Ogólnie pojęte życie po śmierci
  rationale: Kontekst dotyczy wyraźnie sporu o zmartwychwstanie, a nie jedynie nieokreślonego istnienia po śmierci. Przekład nie dopowiada natury stanu po zmartwychwstaniu.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Szyk pytania jest naturalny, a partykuła „więc” zachowuje tok argumentacji. Przekład unika dosłownego „mieli ją” w tekście głównym, ponieważ po polsku mogłoby ono zabrzmieć uprzedmiotawiająco lub sugerować sens seksualny; dosłowność zachowano w przypisie.
