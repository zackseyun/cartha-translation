  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: pl
  text: 'A gdy zobaczył przy drodze drzewo figowe, podszedł do niego i nie znalazł na nim nic oprócz samych liści. I powiedział do niego: „Niech już nigdy nie będzie z ciebie owocu”. I drzewo figowe natychmiast uschło.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: drzewo figowe
  rationale: Liczebnik μίαν w tym kontekście naturalnie pełni funkcję zbliżoną do rodzajnika nieokreślonego; polskie „drzewo figowe” wprowadza obiekt bez zbędnego podkreślania jego pojedynczości.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: przy drodze
  rationale: Przy nieruchomym obiekcie ἐπί z dopełniaczem ma sens miejscowy; „przy drodze” jest naturalne i nie sugeruje, że drzewo rosło na jezdni.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: podszedł do niego
  rationale: Zwrot opisuje zbliżenie się do drzewa; „podszedł” oddaje ruch ku niemu w naturalnej polszczyźnie.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: nie znalazł na nim nic
  rationale: Choć ἐν ma dosłownie sens „w”, po polsku owoców i liści szuka się „na” drzewie.
- source_word: εἰ μὴ φύλλα μόνον
  choice: nic oprócz samych liści
  rationale: '„Samych” zachowuje nacisk μόνον: na drzewie były wyłącznie liście.'
- source_word: λέγει αὐτῇ
  choice: powiedział więc do niego
  rationale: Historyczny czas teraźniejszy wygładzono do czasu przeszłego, typowego dla współczesnej polskiej narracji; „więc” naturalnie łączy wypowiedź z dokonanym odkryciem.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: już nigdy
  rationale: Połączenie „już” i „nigdy” naturalnie oddaje zarówno ustanie wyrażone przez μηκέτι, jak i trwałość idiomu εἰς τὸν αἰῶνα.
- source_word: ἐκ σοῦ καρπὸς γένηται
  choice: niech ... nie będzie z ciebie owocu
  rationale: Sformułowanie zachowuje obraz owocu pochodzącego „z” drzewa i jussywną formę wypowiedzi, nie zastępując jej bardziej interpretacyjnym „nie wydawaj owocu”.
- source_word: ἐξηράνθη παραχρῆμα
  choice: natychmiast uschło
  rationale: „Uschło” jest naturalnym odpowiednikiem czasownika w odniesieniu do drzewa, a „natychmiast” zachowuje bezpośredniość παραχρῆμα.
theological_decisions:
- issue: Charakter wypowiedzi Jezusa skierowanej do drzewa figowego
  choice: „Niech już nigdy nie będzie z ciebie owocu” — uroczyste orzeczenie w formie jussywnej
  alternative: „Nigdy więcej nie wydasz owocu” — oznajmienie lub przepowiednia
  rationale: Subjunctivus γένηται z μηκέτι wspiera odczytanie jako stanowcze orzeczenie zakazujące przyszłego pojawienia się owocu. Przekład nie dopowiada mechanizmu ani symbolicznego znaczenia czynu.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna narracyjna. Zachowano powtórzenie „drzewo figowe” oraz zwrot do nieożywionego drzewa, ale uniknięto nienaturalnej kalki składniowej. Brak przypisów, ponieważ idiomatyczne „już nigdy” wystarczająco zachowuje oba elementy greckiego wyrażenia.
