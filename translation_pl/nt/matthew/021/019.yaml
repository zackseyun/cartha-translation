  to: 'A gdy zobaczył przy drodze drzewo figowe, podszedł do niego i nie znalazł na nim nic oprócz samych liści. I powiedział do niego: „Niech już nigdy nie będzie z ciebie owocu”. I drzewo figowe natychmiast uschło.'
  rationale: Usunięto dwa spójniki o odcieniu interpretującym („lecz”, „więc”) i zastąpiono je neutralnym „i”, zgodnym z szeregowym przebiegiem narracji wyrażonym przez καί. Pozostałe sformułowania zachowano, ponieważ wiernie i naturalnie oddają grecki tekst oraz jego jussywną wypowiedź bez narzucania interpretacji symbolicznej czy doktrynalnej.
