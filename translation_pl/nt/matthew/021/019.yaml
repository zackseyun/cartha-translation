  naturalness: Tekst jest płynny, współczesny i zachowuje godny rejestr. „Niech już nigdy nie będzie z ciebie owocu” jest poprawne i celowo zachowuje obraz owocu pochodzącego z drzewa, choć ma lekko podniosły, biblijny charakter właściwy dla wypowiedzi skierowanej do drzewa.
  terminology: '„Drzewo figowe”, „przy drodze”, „samych liści” i „natychmiast uschło” są trafne. Nie są potrzebne przypisy: „już nigdy” wystarczająco przekazuje połączenie μηκέτι z εἰς τὸν αἰῶνα.'
