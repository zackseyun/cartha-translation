- from: 'Odpowiedzieli więc Jezusowi: „Nie wiemy”. Wtedy i on im powiedział: „Ja także nie powiem wam, na mocy jakiej władzy to czynię”.'
  to: 'W odpowiedzi Jezusowi powiedzieli: „Nie wiemy”. On zaś im powiedział: „Ja także nie powiem wam, na mocy jakiej władzy te rzeczy czynię”.'
  rationale: The revision removes unsupported „więc” and „Wtedy,” renders καὶ αὐτός with the natural reciprocal „On zaś,” and restores the plural force of ταῦτα as „te rzeczy.” It retains „nie powiem wam” as an idiomatic Polish refusal and „władza” for ἐξουσία.
  reviewer_model: gpt-5.6-terra
