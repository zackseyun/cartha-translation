source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: pl
  text: 'W odpowiedzi Jezusowi powiedzieli: „Nie wiemy”. On zaś im powiedział: „Ja także nie powiem wam, na mocy jakiej władzy te rzeczy czynię”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: odpowiedzieli
  rationale: Imiesłów wprowadza odpowiedź rozmówców; w naturalnej polszczyźnie najlepiej oddaje go osobowa forma czasownika.
- source_word: Οὐκ οἴδαμεν
  choice: Nie wiemy
  rationale: Bezpośredni i neutralny odpowiednik przeczącego stwierdzenia wiedzy.
- source_word: ἔφη
  choice: powiedział
  rationale: Zwykły czasownik mówienia, bez dodatkowego nacechowania interpretacyjnego.
- source_word: καὶ αὐτός
  choice: wtedy i on
  rationale: 'Oddaje wzajemny charakter odpowiedzi Jezusa: odpowiada on rozmówcom stosownie do ich odmowy.'
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Ja także nie powiem wam
  rationale: Choć λέγω ma formę czasu teraźniejszego, wypowiedź jest odmową ujawnienia informacji; polski czas przyszły brzmi tu naturalnie i zachowuje sens riposty.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: na mocy jakiej władzy
  rationale: Zwrot wskazuje na podstawę uprawnienia do działania. „Na mocy jakiej władzy” zachowuje znaczenie autorytetu lub prawomocnego upoważnienia.
- source_word: ταῦτα ποιῶ
  choice: to czynię
  rationale: Polskie „to” może zbiorczo odnosić się do omawianych działań, mimo greckiej liczby mnogiej ταῦτα; „czynię” odpowiada podniosłemu, lecz nadal zrozumiałemu rejestrowi dialogu.
theological_decisions:
- issue: Znaczenie ἐξουσία w odpowiedzi Jezusa
  choice: władza
  alternative: upoważnienie; prawo; moc
  rationale: W sporze chodzi o prawomocność i źródło działania Jezusa, nie jedynie o zdolność do jego wykonania. „Władza” zachowuje zarówno sens autorytetu, jak i uprawnienia, nie rozstrzygając dokładnie ich źródła.
translation_notes:
  register: Współczesna, godna polszczyzna dialogowa. Zachowano zwięzłość i symetrię wymiany zdań, unikając archaicznego szyku oraz nadmiernie potocznych sformułowań.
