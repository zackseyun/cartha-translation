  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: pl
  text: 'A dzierżawcy chwycili jego niewolników[a]: jednego pobili, drugiego zabili, a innego ukamienowali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „sługi”. Greckie słowo δοῦλοι może, zależnie od kontekstu, oznaczać niewolników albo sługi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: dzierżawcy
  rationale: W kontekście przypowieści są to ludzie, którym właściciel oddał winnicę w dzierżawę; „dzierżawcy” trafniej niż samo „rolnicy” wyraża ich relację z właścicielem.
- source_word: λαβόντες
  choice: schwytali
  rationale: Imiesłów oznacza czynność poprzedzającą dalsze działania. Polski czasownik osobowy brzmi naturalnie, a „schwytali” oddaje w tym brutalnym kontekście więcej niż neutralne „wzięli”, nie przesądzając o dokładnym sposobie pojmania.
- source_word: δούλους
  choice: niewolników
  rationale: Podstawowe znaczenie δοῦλοι wskazuje na osoby należące do pana i działające z jego upoważnienia. „Niewolników” zachowuje ten status wyraźniej niż łagodniejsze „sługi”; alternatywę podano w przypisie.
- source_word: ἔδειραν
  choice: pobili
  rationale: Oddaje fizyczne bicie bez doprecyzowywania narzędzia ani formy kary, których tekst nie podaje.
- source_word: ἀπέκτειναν
  choice: zabili
  rationale: Bezpośrednio oddaje znaczenie czasownika, bez dodawania prawnej kwalifikacji sugerowanej przez „zamordowali”.
- source_word: ἐλιθοβόλησαν
  choice: ukamienowali
  rationale: To zwyczajowy i precyzyjny polski odpowiednik czasownika oznaczającego atak lub uśmiercenie przez obrzucenie kamieniami.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: jednego ... drugiego ... jeszcze innego
  rationale: Polska konstrukcja rozdzielcza jasno przypisuje trzy różne działania różnym osobom, nie narzucając ponad tekst dodatkowego objaśnienia.
theological_decisions:
- issue: Sposób oddania δοῦλος w narracji przypowieściowej
  choice: niewolników
  alternative: sługi
  rationale: „Niewolników” zachowuje społeczną zależność zawartą w greckim rzeczowniku i nie łagodzi jej ze względów tradycyjnych. Ponieważ w tym kontekście osoby te występują zarazem jako wysłannicy właściciela, możliwe kontekstowe „sługi” zachowano w przypisie.
translation_notes:
  register: Współczesny, zwięzły i godny styl narracyjny. Szyk zdania zachowuje kolejne, narastające akty przemocy, a termin „dzierżawcy” odsyła czytelnika do realiów całej przypowieści.
