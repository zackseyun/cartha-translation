  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: pl
  text: 'A stało się to, aby wypełniło się to, co zostało powiedziane za pośrednictwem proroka[a], który tak mówi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „przez proroka”. Grecki tekst dosłowniej wskazuje na przekazanie słów „za pośrednictwem proroka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: to
  rationale: Zaimek rodzaju nijakiego odnosi się do opisanego bezpośrednio wcześniej wydarzenia jako całości.
- source_word: δὲ
  choice: A
  rationale: Lekki spójnik kontynuacyjny; polskie „A” zachowuje więź narracyjną bez sugerowania mocnego przeciwstawienia.
- source_word: γέγονεν
  choice: stało się
  rationale: Perfectum od γίνομαι w formule wypełnienia opisuje zaistniałe wydarzenie; „stało się” jest naturalne i zachowuje uroczysty charakter wypowiedzi.
- source_word: ἵνα πληρωθῇ
  choice: aby się wypełniło
  rationale: Oddaje konstrukcję celu lub skutku z aorystem strony biernej w trybie łączącym, bez rozstrzygania napięcia między celem a rezultatem.
- source_word: τὸ ῥηθὲν
  choice: to, co zostało powiedziane
  rationale: Rzeczownikowe użycie imiesłowu biernego zostało oddane naturalną polską konstrukcją zachowującą stronę bierną.
- source_word: διὰ τοῦ προφήτου
  choice: za pośrednictwem proroka
  rationale: διά z dopełniaczem wskazuje na pośrednictwo; sformułowanie zachowuje myśl, że wypowiedź została przekazana poprzez proroka.
- source_word: λέγοντος
  choice: który mówi
  rationale: Imiesłów czasu teraźniejszego wprowadza następujący cytat; zdanie względne brzmi po polsku naturalniej niż dosłowne „mówiącego”.
theological_decisions:
- issue: Formuła wypełnienia i rola proroka
  choice: „to, co zostało powiedziane za pośrednictwem proroka”
  alternative: „to, co powiedział prorok” albo „to, co zostało powiedziane przez proroka”
  rationale: Przekład zachowuje zawartą w greckim διά z dopełniaczem ideę proroka jako pośrednika wypowiedzi, nie dopowiadając wprost jej ostatecznego autora.
- issue: Cel czy skutek w konstrukcji ἵνα
  choice: „aby się wypełniło”
  alternative: „tak że się wypełniło”
  rationale: „Aby” zachowuje typową celowo-skutkową otwartość formuły Mateuszowej i nie redukuje jej wyłącznie do rezultatu.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Początkowe „A” oddaje łagodną funkcję łączącą δὲ; uniknięto archaicznego „i stało się”, rozbudowanego „przez usta proroka” oraz nienaturalnego imiesłowu „mówiącego”.
