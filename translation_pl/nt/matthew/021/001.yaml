id: MAT.21.1
reference: Matthew 21:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: pl
  text: Gdy zbliżyli się do Jerozolimy i przyszli do Betfage na Górze Oliwnej[a], wtedy Jezus posłał dwóch uczniów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „do Góry Oliwnej”; wyrażenie może też wskazywać kierunek.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: zbliżyli się
  rationale: Aoryst czasownika ἐγγίζω oznacza przestrzenne przybliżenie się; polskie „zbliżyli się” jest naturalne i zachowuje ruch w kierunku Jerozolimy.
- source_word: Ἱεροσόλυμα
  choice: Jerozolimy
  rationale: Utrwalona polska forma nazwy miasta, użyta po przyimku „do”.
- source_word: ἦλθον
  choice: przyszli
  rationale: Bezpośrednio oddaje zwykłe znaczenie ἔρχομαι i zachowuje odrębność drugiego czasownika ruchu.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Utrwalona polska forma nazwy miejscowej.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: na Górze Oliwnej
  rationale: W tym ciągu geograficznym wyrażenie określa położenie Betfage względem Góry Oliwnej. Naturalny polski zwrot lokalizacyjny nie sugeruje, że cała grupa dopiero po Betfage udała się w osobne miejsce.
- source_word: τότε
  choice: wtedy
  rationale: Wyraźnie zachowuje grecki znacznik następstwa narracyjnego.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Naturalne, godne i kontekstowo trafne określenie wysłania uczniów z zadaniem.
- source_word: δύο μαθητὰς
  choice: dwóch uczniów
  rationale: Standardowy polski odpowiednik liczebnika i rzeczownika μαθητής w narracji ewangelicznej.
theological_decisions:
- issue: Domyślny podmiot czasowników w liczbie mnogiej przed wymienieniem Jezusa
  choice: 'Pozostawiono podmiot domyślny: „zbliżyli się… przyszli”, a imię Jezusa wprowadzono dopiero tam, gdzie występuje w grece.'
  alternative: „Jezus i jego uczniowie zbliżyli się…”
  rationale: Tekst grecki zakłada znaną z kontekstu grupę, lecz w tym wersecie nie nazywa jej wprost. Niewprowadzanie dodatkowego podmiotu zachowuje zwięzłość i strukturę źródła.
- issue: Relacja Betfage do Góry Oliwnej
  choice: „Betfage na Górze Oliwnej”
  alternative: „Betfage, ku Górze Oliwnej” lub dosłownie „Betfage, do Góry Oliwnej”
  rationale: Składnia może być odczytana lokalizacyjnie lub kierunkowo. Tekst główny oddaje najbardziej naturalną relację geograficzną, a przypis zachowuje dosłowną postać przyimka i autentyczną możliwość odczytania kierunkowego.
translation_notes:
  register: Współczesny, godny język narracyjny. Zachowano kolejność wydarzeń, domyślny podmiot liczby mnogiej oraz wyraźne „wtedy”, unikając dopowiadania, że chodzi wprost o Jezusa i jego uczniów.
