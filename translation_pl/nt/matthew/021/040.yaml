  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: pl
  text: Kiedy więc przyjdzie właściciel[a] winnicy, co zrobi tamtym rolnikom[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „pan winnicy”. Greckie κύριος często znaczy „Pan”, ale tutaj określa właściciela winnicy w ramach przypowieści.'
    reason: lexical_alternative
  - marker: b
    text: 'Z kontekstu przypowieści wynika, że byli to dzierżawcy winnicy. Samo greckie słowo γεωργοί ma jednak szersze znaczenie: „rolnicy”, „uprawiający ziemię”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: kiedy
  rationale: W połączeniu z trybem łączącym wskazuje tu na oczekiwane przyszłe wydarzenie w opowieści; „kiedy” brzmi naturalniej niż powtarzalne „ilekroć”.
- source_word: οὖν
  choice: więc
  rationale: Wyraża wniosek lub przejście od przedstawionej sytuacji do pytania Jezusa, zachowując logiczny związek z kontekstem.
- source_word: ἔλθῃ
  choice: przyjdzie
  rationale: Aoryst trybu łączącego po ὅταν odnosi się tutaj do przyszłego przybycia; polski czas przyszły oddaje tę konstrukcję naturalnie.
- source_word: κύριος
  choice: właściciel
  rationale: Dopełnienie „winnicy” i realia przypowieści wskazują na właściciela posiadłości, a nie na tytuł „Pan”.
- source_word: ἀμπελῶνος
  choice: winnicy
  rationale: Zwykły i precyzyjny polski odpowiednik rzeczownika oznaczającego winnicę.
- source_word: τί ποιήσει
  choice: co zrobi
  rationale: Pytanie dotyczy przyszłego działania właściciela; celownik τοῖς γεωργοῖς pozwala po polsku naturalnie powiedzieć „co zrobi ... rolnikom”.
- source_word: γεωργοῖς
  choice: rolnikom
  rationale: Greckie słowo ogólnie oznacza rolników lub uprawiających ziemię. Kontekst wskazuje, że są dzierżawcami, lecz samo słowo nie wyraża tego jednoznacznie.
- source_word: ἐκείνοις
  choice: tamtym
  rationale: Zachowuje wskazujący i lekko dystansujący charakter greckiego zaimka.
theological_decisions:
- issue: Znaczenie κύριος w ramach przypowieści
  choice: właściciel
  alternative: pan winnicy
  rationale: W świecie przedstawionym chodzi bezpośrednio o właściciela winnicy. Przekład „właściciel” nie narzuca w tym miejscu tytułu chrystologicznego ani boskiego, choć przypowieść może mieć szerszą wymowę teologiczną.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Szyk „Kiedy więc...” zachowuje związek logiczny, a konstrukcja „co zrobi tamtym rolnikom?” jest idiomatyczna i oddaje skierowanie działania ku nim bez dopowiadania jego rodzaju.
