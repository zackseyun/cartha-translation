  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: pl
  text: 'Jeśli zaś powiemy: „Od ludzi”, boimy się tłumu, bo wszyscy uważają Jana za proroka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Jeśli zaś powiemy
  rationale: Konstrukcja ἐὰν z aorystem trybu łączącego wyraża rozważaną możliwość warunkową; naturalne polskie sformułowanie zachowuje ten sens.
- source_word: Ἐξ ἀνθρώπων
  choice: Od ludzi
  rationale: Zwięźle zachowuje kontrast źródła z „z nieba” w poprzednim wersecie. ἄνθρωποι oznacza tu ludzi w przeciwstawieniu do Boga, nie wyłącznie mężczyzn.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: boimy się tłumu
  rationale: Bezpośredni, współczesny odpowiednik oddający ich obawę przed zgromadzonym tłumem.
- source_word: πάντες
  choice: wszyscy
  rationale: Odnosi się zbiorowo do ludzi tworzących tłum i zachowuje uogólniającą siłę greckiego wyrazu.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: uważają Jana za proroka
  rationale: Idiomaticzna polska konstrukcja wiernie oddaje ἔχω z dopełnieniem oraz ὡς jako uznawanie kogoś za kogoś.
theological_decisions:
- issue: Kontrast między pochodzeniem niebiańskim a ludzkim
  choice: Od ludzi
  alternative: Ludzkiego pochodzenia
  rationale: Wybrana forma zachowuje lapidarny kontrast z odpowiedzią „z nieba” i nie przesądza szerzej o naturze autorytetu Jana.
- issue: Ocena Jana przez tłum
  choice: wszyscy uważają Jana za proroka
  alternative: wszyscy uznają Jana za proroka
  rationale: Tekst relacjonuje przekonanie tłumu, nie dodając odautorskiego rozwinięcia ani dodatkowych wniosków doktrynalnych.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zachowano zwięzłość wypowiedzi oraz przeciwstawienie „od ludzi” wobec kontekstowego „z nieba”.
