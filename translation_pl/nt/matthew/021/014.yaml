id: MAT.21.14
reference: Matthew 21:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: pl
  text: W świątyni[a] podeszli do niego niewidomi i kulawi, a on ich uzdrowił.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ἱερόν oznacza cały kompleks świątynny lub jego teren, a nie ściśle wewnętrzne sanktuarium.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: podeszli do niego
  rationale: Czasownik προσέρχομαι z celownikiem oznacza zbliżenie się do osoby. „Podeszli do niego” naturalnie oddaje ukierunkowany ruch ku Jezusowi.
- source_word: τυφλοὶ
  choice: niewidomi
  rationale: Przymiotnik użyty rzeczownikowo oznacza osoby niewidome; polska forma mnoga jest zwięzła, naturalna i godna.
- source_word: χωλοὶ
  choice: kulawi
  rationale: Przymiotnik użyty rzeczownikowo odnosi się do osób mających trudności z chodzeniem. „Kulawi” zachowuje zwięzłość i równoległość greckiego zestawienia.
- source_word: ἐν τῷ ἱερῷ
  choice: w świątyni
  rationale: ἱερόν oznacza cały kompleks świątynny, a nie ściśle wewnętrzne sanktuarium. Tradycyjne i naturalne „w świątyni” wymaga przypisu precyzującego zakres znaczeniowy.
- source_word: ἐθεράπευσεν αὐτούς
  choice: uzdrowił ich
  rationale: W ewangelicznym opisie θεραπεύω oznacza uzdrawianie. „Uzdrowił ich” jest jasne i zachowuje osobowy przedmiot czynności.
theological_decisions:
- issue: Miejsce uzdrowienia określone rzeczownikiem ἱερόν
  choice: w świątyni, rozumianej jako kompleks świątynny
  alternative: na dziedzińcach świątyni
  rationale: Grecki rzeczownik ἱερόν zwykle obejmuje zabudowania i dziedzińce kompleksu świątynnego, nie zaś wyłącznie wewnętrzne sanktuarium określane jako ναός. Tekst główny pozostaje naturalny, a przypis zapobiega zbyt wąskiemu odczytaniu.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Przestawienie okolicznika „W świątyni” na początek zdania brzmi naturalnie po polsku i nie zmienia jego związku z podejściem do Jezusa. Zachowano zwięzłe, równoległe określenia „niewidomi i kulawi”.
