base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: pl
  text: 'Powiedzieli mu: „Tych niegodziwców zgładzi w straszny sposób[a], a winnicę odda w dzierżawę innym rolnikom[b], którzy będą mu przekazywać plony we właściwych porach[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greka zestawia słowa o wspólnym rdzeniu: „złych [ludzi] źle/nędznie zgładzi”, aby wzmocnić zapowiedź sądu.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „innym dzierżawcom”.'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „którzy będą mu oddawać plony w wyznaczonych dla nich terminach”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Powiedzieli mu
  rationale: Grecki czas teraźniejszy pełni tu funkcję narracyjnego czasu historycznego; polski czas przeszły brzmi naturalnie w opowiadaniu.
- source_word: Κακοὺς κακῶς
  choice: Tych niegodziwców ... w straszny sposób
  rationale: Przymiotnik i przysłówek o wspólnym rdzeniu tworzą emfatyczną grę słów. Polski przekład oddaje zarówno moralną ocenę dzierżawców, jak i surowość ich losu, unikając nienaturalnego „złych źle”.
- source_word: ἀπολέσει
  choice: zgładzi
  rationale: Czasownik oznacza tu stanowcze zniszczenie winnych. „Zgładzi” zachowuje siłę sądu, nie precyzując sposobu śmierci bardziej niż tekst grecki.
- source_word: τὸν ἀμπελῶνα
  choice: winnicę
  rationale: Standardowy polski odpowiednik, zachowujący rolniczy obraz przypowieści.
- source_word: ἐκδώσεται
  choice: odda w dzierżawę
  rationale: W kontekście gospodarowania winnicą czasownik oznacza wynajęcie jej dzierżawcom; ten zwrot jasno wyraża relację gospodarczą.
- source_word: ἄλλοις γεωργοῖς
  choice: innym rolnikom
  rationale: γεωργοί to ludzie uprawiający ziemię; rolę dzierżawców sygnalizuje już zwrot „odda w dzierżawę”.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: będą mu przekazywać
  rationale: ἀποδίδωμι wskazuje na oddawanie należnej części plonów. „Przekazywać” brzmi naturalnie i nie przesądza, czy chodzi o całość zbiorów, czy o należną właścicielowi część.
- source_word: τοὺς καρποὺς
  choice: plony
  rationale: W odniesieniu do winnicy „plony” są naturalnym polskim określeniem owoców zbioru, zachowującym sens rolniczy i możliwość odczytania metaforycznego.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: we właściwych porach
  rationale: καιροί oznacza stosowne lub wyznaczone czasy; liczba mnoga odpowiada kolejnym porom należnych zbiorów.
theological_decisions:
- issue: Surowość i charakter sądu nad niegodziwymi dzierżawcami
  choice: Tych niegodziwców zgładzi w straszny sposób
  alternative: Niegodziwców nędznie wytraci
  rationale: Greka zawiera emfatyczną grę słów, a nie techniczne określenie rodzaju kary. Przekład zachowuje surowość osądu, lecz nie wprowadza szczegółowej doktrynalnej interpretacji jego formy.
- issue: Znaczenie oddawania plonów
  choice: będą mu przekazywać plony
  alternative: będą mu oddawać należną część plonów
  rationale: Tekst wskazuje na należny właścicielowi zwrot, ale nie określa wprost jego proporcji. Nie dodano więc słów „należną część” do tekstu głównego.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. Zachowano obraz winnicy i stanowczą wymowę wyroku. Gra słów κακοὺς κακῶς została funkcjonalnie oddana w tekście, a jej formalny charakter objaśniono w przypisie.
