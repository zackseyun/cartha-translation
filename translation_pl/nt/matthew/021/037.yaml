  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: pl
  text: 'Później jednak posłał do nich swojego syna, mówiąc: „Uszanują[a] mojego syna”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Okażą mojemu synowi szacunek”. Grecki czasownik oznacza tu okazanie szacunku lub poważania; w innych kontekstach może także znaczyć „zawstydzić się”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: później
  rationale: Przysłówek wskazuje na późniejszy moment w ciągu wydarzeń. „Później” brzmi naturalnie i nie dodaje mocniejszego sensu „na koniec”.
- source_word: δὲ
  choice: jednak
  rationale: 'Partykuła sygnalizuje łagodny kontrast i zwrot narracyjny: po sługach właściciel posyła syna.'
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: posłał do nich
  rationale: Naturalny polski odpowiednik czynności wysłania kogoś do określonych osób, bez nadawania czasownikowi technicznego sensu apostolskiego.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: swojego syna
  rationale: Zaimek zwrotny „swojego” naturalnie wskazuje po polsku, że chodzi o syna podmiotu zdania, i nie dodaje emfazy nieobecnej w grece.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów wprowadza treść wypowiedzi właściciela; dosłowne „mówiąc” jest jasne i idiomatyczne.
- source_word: Ἐντραπήσονται
  choice: Uszanują
  rationale: W konstrukcji z bezpośrednim dopełnieniem czasownik oznacza okazanie komuś szacunku lub względów. „Uszanują” jest zwięzłe, współczesne i zachowuje osobowy charakter reakcji.
- source_word: τὸν υἱόν μου
  choice: mojego syna
  rationale: Naturalny odpowiednik bezpośredniego dopełnienia, zachowujący osobistą i relacyjną siłę wypowiedzi.
theological_decisions:
- issue: Oddanie postaci syna bez dopowiadania chrystologicznego tytułu
  choice: swojego syna / mojego syna
  alternative: swojego umiłowanego Syna / mojego Syna
  rationale: Grecki tekst używa zwykłego rzeczownika υἱός i nie zawiera ἀγαπητός („umiłowany”). Mała litera oraz brak dodatkowego określenia zachowują formę przypowieści, pozwalając, by jej chrystologiczny sens wynikał z kontekstu, a nie z dopowiedzenia tłumacza.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Szyk zachowuje rozwój greckiego zdania, a „jednak” podkreśla łagodny kontrast bez nadmiernego dramatyzowania.
