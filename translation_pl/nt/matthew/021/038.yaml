  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: pl
  text: 'Lecz dzierżawcy, gdy zobaczyli syna, powiedzieli między sobą: „To jest dziedzic. Chodźcie, zabijmy go i przejmijmy jego dziedzictwo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „miejmy jego dziedzictwo”; w tym kontekście chodzi o przejęcie go na własność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: dzierżawcy
  rationale: W kontekście przypowieści są to ludzie, którzy dzierżawią i uprawiają winnicę należącą do gospodarza. „Dzierżawcy” naturalnie oddaje ich rolę społeczną, nie sprowadzając ich jedynie do pracowników rolnych.
- source_word: ἰδόντες
  choice: gdy zobaczyli
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym, zachowując następstwo wydarzeń.
- source_word: τὸν υἱὸν
  choice: syna
  rationale: Greka mówi dosłownie o „synu”, bez wyrażonego w tym miejscu zaimka dzierżawczego. Relacja z właścicielem wynika z kontekstu.
- source_word: ἐν ἑαυτοῖς
  choice: między sobą
  rationale: Wyrażenie wskazuje na rozmowę prowadzoną we własnym gronie dzierżawców.
- source_word: κληρονόμος
  choice: dziedzic
  rationale: To standardowy i naturalny polski odpowiednik terminu oznaczającego prawnego spadkobiercę.
- source_word: δεῦτε
  choice: Chodźcie
  rationale: Forma wprowadza wezwanie do wspólnego działania; „Chodźcie” zachowuje jej żywy, naglący charakter.
- source_word: ἀποκτείνωμεν
  choice: zabijmy
  rationale: Tryb zachęcający oddano naturalną polską formą „zabijmy”; nie dodano bardziej interpretacyjnego „zamordujmy” ani sądowego „skażmy na śmierć”.
- source_word: σχῶμεν
  choice: przejmijmy
  rationale: Podstawowe znaczenie czasownika wiąże się z „mieć”, lecz w planie zabicia dziedzica chodzi o wejście w posiadanie należnego mu majątku. „Przejmijmy” wyraża ten sens bez przesadnego dopowiadania użycia siły.
- source_word: κληρονομίαν αὐτοῦ
  choice: jego dziedzictwo
  rationale: „Dziedzictwo” zachowuje bezpośredni związek leksykalny z „dziedzicem”, a „jego” wyraźnie oddaje αὐτοῦ.
theological_decisions:
- issue: Przypowieściowe odniesienie do syna
  choice: Pozostawiono zwykłe określenie „syna”, bez jawnego utożsamienia go w tekście wersetu z Jezusem.
  alternative: Dodać sformułowanie interpretacyjne, które bezpośrednio wskazywałoby, że syn symbolizuje Jezusa.
  rationale: W narracji Mateusza przypowieść wskazuje na Jezusa, ale sam werset pozostaje na poziomie opowiadanej historii. Prosty przekład zachowuje teologiczną wymowę i napięcie bez wprowadzania objaśnienia do tekstu głównego.
translation_notes:
  register: 'Współczesny, zrozumiały i godny rejestr. Dialog zachowuje bezpośredniość greckiego wezwania, a terminologia dziedziczenia pozostaje spójna: „dziedzic” — „dziedzictwo”.'
