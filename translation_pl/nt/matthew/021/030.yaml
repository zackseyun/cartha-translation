id: MAT.21.30
reference: Matthew 21:30
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: pl
  text: 'Potem podszedł do drugiego i powiedział mu to samo. Ten odpowiedział: „Pójdę[a], panie[b]”, lecz nie poszedł.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Ja” — eliptyczna odpowiedź znacząca w tym kontekście: „Pójdę” lub „Ja pójdę”.'
    reason: lexical_alternative
  - marker: b
    text: Greckie κύριε może też znaczyć „Panie” lub „władco”. Tutaj jest pełnym szacunku zwrotem syna do ojca.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu od προσέρχομαι opisuje zbliżenie się ojca do drugiego syna; „podszedł” jest naturalne i precyzyjniejsze niż ogólne „przyszedł”.
- source_word: δὲ
  choice: potem / ten
  rationale: δέ pełni tu łagodną funkcję łączącą i wyznacza dalszy tok opowiadania, bez konieczności oddawania go jako wyraźnego przeciwstawienia.
- source_word: τῷ δευτέρῳ
  choice: do drugiego
  rationale: Greka mówi dosłownie „do drugiego”; rzeczownik „syn” wynika bezpośrednio z kontekstu, dlatego nie trzeba go powtarzać.
- source_word: ὡσαύτως
  choice: to samo
  rationale: Wyrażenie odnosi się do tego samego polecenia skierowanego wcześniej do pierwszego syna. Polski zwrot „powiedział mu to samo” jest zwięzły i naturalny.
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Typową grecką konstrukcję „odpowiadając, powiedział” oddano idiomatycznie jednym polskim czasownikiem.
- source_word: Ἐγώ
  choice: Pójdę
  rationale: Grecki tekst zawiera emfatyczne „ja” jako eliptyczną zgodę na polecenie. W języku polskim samo „ja” brzmiałoby urwanie, dlatego uzupełniono domyślny czasownik, a dosłowną postać zachowano w przypisie.
- source_word: κύριε
  choice: panie
  rationale: Wołacz wyraża pełen szacunku zwrot do ludzkiego ojca. „Panie” zachowuje zakres znaczeniowy greckiego słowa, lecz zapis małą literą zapobiega nieuzasadnionemu odczytaniu go jako tytułu Bożego.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: lecz nie poszedł
  rationale: Choć καί jest formalnie spójnikiem łącznym, w polszczyźnie „lecz” naturalnie uwydatnia zamierzony kontrast między deklaracją a czynem.
theological_decisions:
- issue: Znaczenie κύριε w zwrocie do ojca
  choice: panie
  alternative: Panie / władco
  rationale: W tej przypowieści syn zwraca się z szacunkiem do ludzkiego ojca. Kontekst nie wymaga tytułu boskiego ani mesjańskiego; mała litera i przypis zachowują jednak szerszy zakres greckiego κύριε.
- issue: Uzupełnienie eliptycznej odpowiedzi Ἐγώ
  choice: Pójdę
  alternative: Ja, panie
  rationale: Uzupełnienie wynika z bezpośredniego polecenia pójścia i pozwala uzyskać naturalną polską wypowiedź, nie ukrywając dosłownego brzmienia greki, które podano w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano zwięzłość greckiego zdania, a elipsę i zakres znaczeniowy κύριε objaśniono w przypisach.
