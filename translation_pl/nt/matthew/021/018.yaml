  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: pl
  text: Wczesnym rankiem, gdy wracał do miasta, poczuł głód.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Wczesnym rankiem
  rationale: Oddaje w naturalnej polszczyźnie wczesną porę dnia i zachowuje nacisk czasowy greckiego przysłówka.
- source_word: δὲ
  choice: bez osobnego odpowiednika
  rationale: Jest to łagodny spójnik narracyjny; szyk i ciąg opowiadania wystarczająco wyrażają przejście, a dodanie „zaś” lub „a” brzmiałoby tu ciężej albo sugerowałoby wyraźniejszy kontrast.
- source_word: ἐπανάγων
  choice: gdy wracał
  rationale: Imiesłów czasu teraźniejszego opisuje czynność trwającą równocześnie z orzeczeniem; zdanie podrzędne jest naturalne i precyzyjne po polsku.
- source_word: εἰς τὴν πόλιν
  choice: do miasta
  rationale: Przyimek εἰς wskazuje ruch w kierunku miasta lub do jego wnętrza; „do miasta” nie przesądza, że wejście już nastąpiło.
- source_word: ἐπείνασεν
  choice: poczuł głód
  rationale: Aoryst przedstawia pojawienie się głodu jako wydarzenie. „Poczuł głód” jest współczesne i naturalniejsze niż „zgłodniał”, a wyraźniej dynamiczne niż „był głodny”.
theological_decisions:
- issue: Chrystologiczny wymiar głodu Jezusa
  choice: Przedstawić głód jako rzeczywiste ludzkie doświadczenie, bez komentarza doktrynalnego.
  alternative: 'Osłabić dynamikę zdania do opisu stanu: „był głodny”.'
  rationale: Tekst mówi wprost o rzeczywistym głodzie Jezusa. Prosty przekład zachowuje to świadectwo o jego człowieczeństwie, niczego teologicznie nie dopowiadając.
translation_notes:
  register: Współczesny, godny i przystępny styl narracyjny. Pominięto osobne tłumaczenie δὲ, ponieważ w tym miejscu pełni ono jedynie łagodną funkcję łączącą. Brak przypisów, a więc brak markerów w tekście głównym.
