  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: pl
  text: I zostawiwszy ich, wyszedł z miasta do Betanii i tam przenocował.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zatrzymał się tam na noc” albo „spędził tam noc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν
  choice: zostawiwszy
  rationale: Imiesłów aorystu wskazuje na czynność poprzedzającą wyjście. „Zostawiwszy” zwięźle zachowuje tę relację czasową i jest naturalne w podniosłej, lecz współczesnej polszczyźnie.
- source_word: αὐτοὺς
  choice: ich
  rationale: Prosty zaimek odsyła do osób wspomnianych bezpośrednio wcześniej i nie dodaje interpretacji.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: wyszedł z miasta
  rationale: Greckie wyrażenie wzmacnia ideę wyjścia poza obręb miasta; polskie „wyszedł z miasta” oddaje ją jasno, bez nienaturalnego powtórzenia.
- source_word: πόλεως
  choice: miasta
  rationale: W kontekście chodzi o Jerozolimę; „miasto” jest zwykłym i trafnym odpowiednikiem πόλις.
- source_word: εἰς Βηθανίαν
  choice: do Betanii
  rationale: Przyimek εἰς wyraża kierunek, a „do Betanii” jest naturalną polską konstrukcją z nazwą miejscowości.
- source_word: ηὐλίσθη
  choice: przenocował
  rationale: Czasownik αὐλίζομαι oznacza zatrzymanie się na noc lub spędzenie nocy. „Przenocował” jest zwięzłe, współczesne i zachowuje właściwy sens.
- source_word: ἐκεῖ
  choice: tam
  rationale: Przysłówek miejsca odnosi się do Betanii i naturalnie odpowiada polskiemu „tam”.
