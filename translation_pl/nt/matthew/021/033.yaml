id: MAT.21.33
reference: Matthew 21:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: pl
  text: Posłuchajcie innej przypowieści. Pewien właściciel ziemski zasadził winnicę, otoczył ją ogrodzeniem[b], wykopał w niej tłocznię i zbudował wieżę[a]. Potem wydzierżawił ją rolnikom[c] i wyjechał.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Opis zasadzenia winnicy, otoczenia jej, wykopania tłoczni i zbudowania wieży nawiązuje do Iz 5,1–2.
    reason: cross_reference
  - marker: b
    text: 'Możliwe też: „otoczył ją żywopłotem”. Greckie słowo może oznaczać różnego rodzaju barierę otaczającą, na przykład płot, mur lub żywopłot.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „wynajął ją rolnikom”. Chodzi o powierzenie winnicy dzierżawcom, którzy mieli ją uprawiać.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Posłuchajcie innej przypowieści
  rationale: Aorystyczny tryb rozkazujący ἀκούσατε oddano naturalnym polskim poleceniem „Posłuchajcie”, a παραβολή standardowym w tym kontekście terminem „przypowieść”.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Pewien właściciel ziemski
  rationale: W realiach winnicy i dzierżawców οἰκοδεσπότης oznacza właściciela posiadłości; polskie „pewien właściciel ziemski” naturalnie oddaje również narracyjne wprowadzenie ἄνθρωπος ἦν.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: zasadził winnicę
  rationale: Zachowano konkretne znaczenie φυτεύω i ἀμπελών oraz obraz nawiązujący do Iz 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: otoczył ją ogrodzeniem
  rationale: φραγμός oznacza barierę otaczającą, między innymi płot, mur lub żywopłot. „Ogrodzenie” zachowuje ogólność greckiego terminu bez przesądzania o materiale.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: wykopał w niej tłocznię
  rationale: ὀρύσσω znaczy „kopać”, a ληνός oznacza tłocznię do winogron; w kontekście winnicy krótsze „tłocznię” jest jasne i naturalne.
- source_word: ᾠκοδόμησεν πύργον
  choice: zbudował wieżę
  rationale: πύργος oznacza wieżę. Nie dopowiedziano funkcji strażniczej, której tekst grecki nie określa wprost.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: wydzierżawił ją rolnikom
  rationale: Medialna forma ἐκδίδωμι oznacza oddanie w dzierżawę, a γεωργοί to uprawiający ziemię. „Wydzierżawił ją rolnikom” jasno wyraża relację ekonomiczną bez przedstawiania ich jedynie jako pracowników.
- source_word: ἀπεδήμησεν
  choice: wyjechał
  rationale: ἀποδημέω oznacza udać się z dala od miejsca zamieszkania. „Wyjechał” jest zwięzłe i nie dodaje niewskazanego celu ani kraju podróży.
theological_decisions:
- issue: Nawiązanie obrazu winnicy do Izajasza 5
  choice: Zachowano konkretne obrazy rolnicze, a nawiązanie wskazano w przypisie.
  alternative: Wyraźniej zasygnalizować aluzję w tekście głównym przez tradycyjne słownictwo lub objaśnienie.
  rationale: Tekst silnie przywołuje Iz 5, ale przekład nie powinien wprowadzać interpretacyjnego objaśnienia do samej wypowiedzi. Aluzję najlepiej zachować przez wierny obraz i odnotować w przypisie.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Składnia jest płynna narracyjnie, a słownictwo pozostaje konkretne. „Właściciel ziemski” i „wydzierżawił” jasno oddają realia posiadłości oraz umowy, natomiast przypisy zachowują istotne alternatywy leksykalne.
