id: MAT.21.9
reference: Matthew 21:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: pl
  text: 'A tłumy, które szły przed nim, i te, które podążały za nim, wołały: „Hosanna[a] Synowi Dawida[b]! Błogosławiony, który przychodzi w imię Pana[c]! Hosanna na wysokościach!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hosanna” to wywodzący się z hebrajskiego okrzyk, który pierwotnie znaczy mniej więcej „wybaw, prosimy” lub „wybaw teraz”; tutaj pełni także funkcję okrzyku uwielbienia.
    reason: lexical_alternative
  - marker: b
    text: „Syn Dawida” to królewski tytuł mesjański.
    reason: cultural_note
  - marker: c
    text: Słowa te nawiązują do Psalmu 118:26; występujące tu określenie „Pan” odpowiada w hebrajskim tekście Psalmu Bożemu imieniu JHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: tłumy
  rationale: Naturalny współczesny odpowiednik liczby mnogiej, oddający liczne grupy ludzi uczestniczących w pochodzie.
- source_word: προάγοντες αὐτόν
  choice: które szły przed nim
  rationale: Wyraźnie opisuje położenie uczestników pochodu przed Jezusem, bez sugerowania, że formalnie mu przewodzili.
- source_word: ἀκολουθοῦντες
  choice: te, które podążały za nim
  rationale: Zachowuje procesyjny obraz ludzi idących za Jezusem i naturalnie kontrastuje z tymi, którzy szli przed nim.
- source_word: ἔκραζον λέγοντες
  choice: wołały
  rationale: Polski czasownik „wołały” oddaje trwającą czynność wyrażoną greckim imperfectum; dwuczłonowe „wołały, mówiąc” byłoby w tym miejscu nienaturalne, a dwukropek wprowadza treść okrzyku.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Zachowano utrwaloną transliterację liturgicznego okrzyku; jego hebrajskie źródłosłowie i funkcję objaśnia przypis.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Synowi Dawida
  rationale: Celownik grecki oddano polskim celownikiem, a historyczny tytuł królewsko-mesjański zachowano bez zastępowania go interpretacyjnym słowem „Mesjasz”.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Błogosławiony, który przychodzi
  rationale: Naturalna polska konstrukcja zachowująca rzeczownikowy sens greckiego imiesłowu oraz uroczysty charakter cytatu.
- source_word: ἐν ὀνόματι κυρίου
  choice: w imię Pana
  rationale: Utrwalony i precyzyjny odpowiednik zachowujący zarówno sens działania z upoważnienia Pana, jak i brzmienie nawiązania do Psalmu 118.
- source_word: ἐν τοῖς ὑψίστοις
  choice: na wysokościach
  rationale: Utrwalone, zwięzłe sformułowanie o podniosłym charakterze, które nie rozstrzyga ponad tekst, czy chodzi wprost o najwyższe niebiosa.
theological_decisions:
- issue: Królewsko-mesjański tytuł τῷ υἱῷ Δαυίδ
  choice: Zachować „Synowi Dawida” jako tytuł występujący w tekście.
  alternative: „Mesjaszowi”
  rationale: Choć tytuł ma znaczenie mesjańskie, zastąpienie go słowem „Mesjasz” usunęłoby jego Dawidowy, królewski charakter i wprowadziłoby objaśnienie do tekstu głównego.
- issue: Znaczenie Ὡσαννά
  choice: Zachować „Hosanna” w tekście głównym, a pierwotny sens wyjaśnić w przypisie.
  alternative: „Zbaw nas, prosimy” lub „Zbaw teraz”
  rationale: W tej scenie wyraz działa jako utrwalony okrzyk liturgiczny, łączący prośbę o ratunek z aklamacją i uwielbieniem; samo tłumaczenie etymologiczne zawęziłoby jego funkcję.
- issue: κυρίου w nawiązaniu do Psalmu 118:26
  choice: Przetłumaczyć greckie κυρίου jako „Pana”, a tło hebrajskiego imienia JHWH wskazać w przypisie.
  alternative: „JHWH” lub typograficzne „PANA”
  rationale: Tekst grecki ma κύριος, dlatego „Pan” wiernie oddaje bezpośrednie źródło. Przypis zachowuje istotne tło hebrajskiego psalmu bez zastępowania brzmienia tekstu greckiego.
translation_notes:
  register: Współczesna, standardowa polszczyzna o podniosłym, lecz przystępnym rejestrze. Zachowano rytm publicznej aklamacji i tradycyjne, nadal zrozumiałe formuły „Hosanna” oraz „na wysokościach”, a niezręczne polskie „wołały, mówiąc” zastąpiono naturalnym wprowadzeniem przez dwukropek.
