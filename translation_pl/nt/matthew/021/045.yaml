  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: pl
  text: A gdy arcykapłani i faryzeusze usłyszeli jego przypowieści, zrozumieli, że mówi o nich[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ich dotyczą”. Kontekst wskazuje, że rozpoznali w przypowieściach odniesienie do siebie. Niektóre przekłady ujmują to bardziej interpretacyjnie: „mówi przeciwko nim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: gdy … usłyszeli
  rationale: Imiesłów aorystu wyraża tu relację czasową poprzedzającą czasownik główny; polskie zdanie czasowe brzmi naturalnie i zachowuje kolejność wydarzeń.
- source_word: ἀρχιερεῖς
  choice: arcykapłani
  rationale: Utrwalony polski odpowiednik liczby mnogiej, odnoszący się do członków naczelnego przywództwa kapłańskiego, a nie do wielu jednocześnie urzędujących najwyższych kapłanów.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska forma nazwy żydowskiego ugrupowania.
- source_word: παραβολὰς
  choice: przypowieści
  rationale: Utrwalony i trafny termin określający obrazowe opowiadania i wypowiedzi Jezusa w Ewangeliach synoptycznych.
- source_word: ἔγνωσαν
  choice: zrozumieli
  rationale: W tym kontekście czasownik oznacza dojście do rozpoznania sensu wypowiedzi. „Zrozumieli” jest naturalne po polsku i oddaje moment uświadomienia sobie, do kogo odnoszą się przypowieści.
- source_word: περὶ αὐτῶν
  choice: o nich
  rationale: περί z dopełniaczem znaczy zasadniczo „o, w sprawie, w odniesieniu do”. Nie wprowadzono mocniejszego „przeciwko nim”, choć krytyczny wydźwięk wynika z kontekstu.
- source_word: λέγει
  choice: mówi
  rationale: Grecki czas teraźniejszy można naturalnie zachować w polskiej mowie zależnej po czasowniku przeszłym; forma „mówi” oddaje aktualne odniesienie wypowiedzianych przypowieści.
theological_decisions:
- issue: Czy wyraźnie określić przypowieści Jezusa jako wypowiedź skierowaną przeciw przywódcom
  choice: mówi o nich
  alternative: mówi przeciwko nim
  rationale: Tekst grecki mówi dosłownie, że Jezus mówił „o nich” (περὶ αὐτῶν). Kontekst wskazuje na krytykę, lecz przekład nie powinien wpisywać silniejszego sensu przeciwstawnego w sam przyimek.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjne, powszechnie zrozumiałe terminy „arcykapłani”, „faryzeusze” i „przypowieści”; zaimek odnoszący się do Jezusa zapisano małą literą zgodnie ze standardową współczesną polszczyzną.
