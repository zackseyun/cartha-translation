id: MAT.21.23
reference: Matthew 21:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: pl
  text: 'Gdy przyszedł na teren świątyni[a], arcykapłani i starsi ludu podeszli do niego, kiedy nauczał, i zapytali: „Jakim prawem to robisz? I kto dał ci tę władzę?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ἱερόν oznacza cały kompleks świątynny lub jego dziedzińce, nie zaś wyłącznie wewnętrzne sanktuarium.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: kiedy wszedł
  rationale: Dopełniacz niezależny ma tu sens czasowy; polskie „kiedy wszedł” naturalnie oddaje następstwo wydarzeń, nie precyzując nadmiernie ich bezpośredniości.
- source_word: ἱερὸν
  choice: teren świątyni
  rationale: Ἱερόν oznacza cały kompleks lub dziedzińce świątynne, a nie wyłącznie wewnętrzne sanktuarium; ten przekład jasno zachowuje to rozróżnienie.
- source_word: προσῆλθον αὐτῷ
  choice: podeszli do niego
  rationale: Naturalny polski odpowiednik czasownika oznaczającego fizyczne zbliżenie się do kogoś.
- source_word: διδάσκοντι
  choice: i nauczał
  rationale: Imiesłów jest równoczesny z podejściem przywódców. Konstrukcja „kiedy wszedł... i nauczał, podeszli” płynnie wyraża tę równoczesność po polsku.
- source_word: οἱ ἀρχιερεῖς
  choice: naczelni kapłani
  rationale: Liczba mnoga odnosi się do kierowniczych przedstawicieli warstwy kapłańskiej, nie do wielu urzędujących arcykapłanów.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: starsi ludu
  rationale: Zwięzłe, utrwalone i godne określenie uznanych przywódców społeczności.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: jakim prawem
  rationale: W pierwszym pytaniu idiomatycznie oddaje zakwestionowanie podstawy uprawnienia Jezusa do działania; następujące pytanie z „władzą” zachowuje pełny zakres ἐξουσία i unika niezręcznego powtórzenia.
- source_word: ταῦτα ποιεῖς
  choice: to robisz
  rationale: Polska forma czasu teraźniejszego naturalnie odnosi pytanie do aktualnych działań Jezusa; liczba pojedyncza „to” zbiorczo oddaje greckie ταῦτα.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: kto dał ci tę władzę
  rationale: Czas przeszły oddaje aoryst wskazujący na akt udzielenia władzy, bez dopowiadania jego czasu lub skutków.
theological_decisions:
- issue: Znaczenie ἐξουσία w wyzwaniu przywódców
  choice: prawo / władza
  alternative: upoważnienie / moc
  rationale: Kontekst dotyczy zarówno prawa do działania, jak i udzielonej władzy. Zróżnicowanie dwóch polskich określeń zachowuje instytucjonalny i teologiczny zakres terminu, nie sprowadzając go do samej siły ani nie rozstrzygając źródła autorytetu.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Dialog jest bezpośredni i naturalny; „Jakim prawem” trafnie brzmi jako publiczne zakwestionowanie uprawnień, a „tę władzę” zachowuje więź leksykalną z greckim ἐξουσία.
