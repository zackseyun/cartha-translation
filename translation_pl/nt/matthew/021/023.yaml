  to: 'Gdy przyszedł na teren świątyni[a], arcykapłani i starsi ludu podeszli do niego, kiedy nauczał, i zapytali: „Jakim prawem to robisz? I kto dał ci tę władzę?”'
  rationale: Revision resolves the temporal-syntactic ambiguity by attaching 'kiedy nauczał' directly to the leaders' approach. It also uses the standard Polish biblical term 'arcykapłani'. The temple-complex footnote remains correctly anchored and the twofold challenge concerning ἐξουσία is retained without overinterpretation.
