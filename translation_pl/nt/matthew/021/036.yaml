  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: pl
  text: Znowu posłał innych sług[a], liczniejszych od pierwszej grupy, a oni postąpili z nimi tak samo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „niewolników”. Greckie słowo doulos może, zależnie od kontekstu, oznaczać sługę albo niewolnika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Znowu
  rationale: Naturalny polski przysłówek wskazujący na powtórzenie czynności w toku opowiadania.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Prosty odpowiednik narracyjny czasownika ἀποστέλλω; w tym kontekście nie trzeba dodawać „wysłał” ani „wyprawił”.
- source_word: ἄλλους δούλους
  choice: innych sług
  rationale: „Słudzy” brzmi naturalnie w przypowieści o wysłannikach gospodarza, natomiast możliwy sens „niewolnicy” został zachowany w przypisie.
- source_word: πλείονας τῶν πρώτων
  choice: liczniejszych niż pierwsi
  rationale: Konstrukcja porównawcza wskazuje, że druga grupa była liczniejsza od pierwszej; zwięzłe sformułowanie zachowuje tę informację.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: postąpili z nimi tak samo
  rationale: Naturalny polski zwrot odsyłający do opisanego wcześniej potraktowania pierwszej grupy, bez niepotrzebnego powtarzania szczegółów.
theological_decisions:
- issue: Oddanie rzeczownika δοῦλος w przypowieści
  choice: słudzy
  alternative: niewolnicy
  rationale: W tym miejscu nacisk pada na rolę osób posłanych przez gospodarza i na ich potraktowanie, nie zaś na ich status prawny. „Słudzy” zapewniają naturalność, a przypis zachowuje istotną alternatywę leksykalną.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Składnia pozostaje bliska greckiemu zdaniu, ale jest naturalna po polsku; zachowano porównanie liczebności obu grup oraz anaforyczne „tak samo”.
