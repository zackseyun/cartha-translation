translation:
  language: pl
  text: Uczniowie poszli więc i zrobili tak, jak polecił im Jezus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nakazał im”. Grecki czasownik może oznaczać wydawanie nakazów albo poleceń; w tym kontekście chodzi o wcześniejsze wskazówki Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: poszli
  rationale: Imiesłów aorystu pełni funkcję narracyjną i poprzedza kolejną czynność; polskie „poszli” oddaje to naturalnie.
- source_word: δὲ
  choice: więc
  rationale: Partykuła sygnalizuje ciąg dalszy narracji oraz związek reakcji uczniów z wcześniejszym poleceniem Jezusa.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: To utrwalone i kontekstowo właściwe określenie osób podążających za Jezusem.
- source_word: ποιήσαντες
  choice: zrobili
  rationale: Drugi imiesłów aorystu zostaje naturalnie oddany czasownikiem osobowym, skoordynowanym z „poszli”.
- source_word: καθὼς
  choice: tak, jak
  rationale: Wyrażenie wskazuje na zgodność działania uczniów z poleceniem Jezusa; „tak, jak” brzmi naturalnie i zachowuje ten sens.
- source_word: συνέταξεν
  choice: polecił
  rationale: Czasownik συντάσσω może oznaczać wydanie polecenia lub udzielenie instrukcji. „Polecił” zachowuje autorytatywny charakter wypowiedzi bez nadmiernego zaostrzenia tonu.
- source_word: αὐτοῖς
  choice: im
  rationale: Naturalny polski odpowiednik zaimka w funkcji dopełnienia dalszego przy czasowniku „polecił”.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Rodzajnik przy imieniu własnym nie wymaga osobnego odpowiednika w języku polskim.
