  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: pl
  text: I wszystko[a], o co poprosicie w modlitwie, wierząc[b], otrzymacie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „cokolwiek” albo „wszystko, o co poprosicie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „ufając”; grecki imiesłów opisuje wiarę towarzyszącą proszeniu w modlitwie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: wszystko, o co
  rationale: 'Połączenie πᾶς z ὅσος ma szeroki, całościowy sens: „wszystko, o co” lub „cokolwiek”. W kontekście proszenia polska konstrukcja „wszystko, o co poprosicie” jest naturalna i zachowuje pełny zakres greckiego wyrażenia.'
- source_word: ἂν αἰτήσητε
  choice: poprosicie
  rationale: ἄν z aorystem trybu łączącego tworzy tu nieokreślone zdanie względne. Polski czas przyszły w połączeniu z „wszystko, o co” oddaje tę nieokreśloność bez sztucznego dodawania „moglibyście”.
- source_word: ἐν τῇ προσευχῇ
  choice: w modlitwie
  rationale: To naturalny polski odpowiednik wyrażenia określającego sferę lub okoliczność proszenia. Grecki rodzajnik nie wymaga tutaj użycia w polszczyźnie formy „w tej modlitwie”.
- source_word: πιστεύοντες
  choice: wierząc
  rationale: Imiesłów czasu teraźniejszego wskazuje na wiarę towarzyszącą proszeniu. Forma „wierząc” zachowuje grecką składnię i nie przekształca imiesłowu w wyraźny warunek.
- source_word: λήμψεσθε
  choice: otrzymacie
  rationale: Czas przyszły czasownika λαμβάνω oznacza tutaj „otrzymacie”. Współczesne polskie „otrzymacie” zachowuje godny rejestr i nie wymaga osobnego zaznaczenia strony medialnej.
theological_decisions:
- issue: Związek wiary z wysłuchaniem modlitwy
  choice: Zachowano imiesłowowe „wierząc”, bez przekształcania go w jawny warunek.
  alternative: „jeśli będziecie wierzyć” albo „pod warunkiem, że uwierzycie”
  rationale: Grecki tekst łączy proszenie na modlitwie z wiarą, lecz używa imiesłowu, a nie formalnego zdania warunkowego. Takie tłumaczenie zachowuje nacisk tekstu oraz jego teologiczne napięcie, nie rozstrzygając ponad tekst mechanizmu ani zakresu spełnienia prośby.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Szyk zdania zachowuje nacisk na całość próśb, a imiesłów „wierząc” pozostawia zwięzłą i celowo nierozwiniętą relację między wiarą, modlitwą i otrzymaniem.
