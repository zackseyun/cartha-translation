  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: pl
  text: 'Lecz Jezus im odpowiedział: „Ja także zadam wam jedno pytanie[a]. Jeśli mi odpowiecie, ja wam powiem, jaką władzą to czynię?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „jedno słowo”; możliwe też: „jedną sprawę”. Greckie λόγον ἕνα może oznaczać pytanie albo sprawę będącą przedmiotem rozmowy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lecz Jezus im odpowiedział
  rationale: Grecka konstrukcja imiesłowu ἀποκριθείς z εἶπεν jest typowym narracyjnym zwrotem wprowadzającym odpowiedź; naturalny polski nie wymaga dosłownego powtórzenia „odpowiadając, powiedział”. δέ oddano przez „lecz”, ponieważ zaznacza przejście z lekkim kontrastem w sporze.
- source_word: Ἐρωτήσω ὑμᾶς κἀγώ
  choice: Ja także zadam wam
  rationale: '„Zadam” łączy się naturalnie z rzeczownikiem „pytanie”, a „ja także” zachowuje wzajemność podkreśloną przez κἀγώ: Jezus odpowiada własnym pytaniem na pytanie rozmówców.'
- source_word: λόγον ἕνα
  choice: jedno pytanie
  rationale: λόγος może oznaczać słowo, wypowiedź lub sprawę; w tym kontekście chodzi o kwestię postawioną rozmówcom do rozstrzygnięcia. „Jedno pytanie” jasno przekazuje funkcję wyrażenia, a przypis zachowuje jego szerszy zakres leksykalny.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Jeśli mi odpowiecie
  rationale: Dosłownie konstrukcja mówi o „powiedzeniu mi” tego, o co Jezus pyta. W polskim kontekście kontrpytania „odpowiecie” jest naturalne i zachowuje warunkowy charakter wypowiedzi.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: i ja wam powiem
  rationale: Sformułowanie zachowuje paralelizm i wzajemność drugiego κἀγώ, a czas przyszły ἐρῶ oddaje przez „powiem”.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: jakim prawem
  rationale: ἐξουσία oznacza tu władzę, upoważnienie lub prawo stanowiące podstawę działania. Polskie „jakim prawem” jest naturalnym pytaniem o legitymację działania i pasuje do kontekstu sporu.
- source_word: ταῦτα ποιῶ
  choice: to czynię
  rationale: Choć ταῦτα jest formalnie liczbą mnogą, polskie zbiorcze „to” naturalnie obejmuje działania Jezusa będące przedmiotem sporu; „czynię” zachowuje podniosły, lecz współczesny rejestr.
theological_decisions:
- issue: Znaczenie ἐξουσία jako podstawy działania Jezusa
  choice: jakim prawem
  alternative: z czyjego upoważnienia / jaką władzą
  rationale: Tekst pyta o legitymację działania, nie rozstrzygając w tym wersecie, czy nacisk pada na posiadaną władzę, udzielone upoważnienie czy prawo do działania. „Jakim prawem” zachowuje otwarty charakter pytania bez dodawania źródła upoważnienia.
translation_notes:
  register: Współczesny, dignifikowany polski narracyjny. Zachowano zwięzłość i paralelizm wypowiedzi Jezusa, unikając zarówno kalki „odpowiadając, powiedział”, jak i nadmiernie potocznych sformułowań. Marker [a] umieszczono bezpośrednio po wyrażeniu, którego dotyczy.
