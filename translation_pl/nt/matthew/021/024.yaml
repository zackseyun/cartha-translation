  source_fidelity: Sens wypowiedzi jest zasadniczo zachowany, w tym wzajemność podkreślona przez oba κἀγώ oraz warunkowa konstrukcja. „Jakim prawem” jednak zawęża ἐξουσία do legalnego prawa; greckie słowo obejmuje tu przede wszystkim władzę lub autorytet do działania.
  naturalness: Tekst jest na ogół naturalny, lecz przecinek przed „i ja” niepotrzebnie rozdziela człony okresu warunkowego. Wypowiedź kończy się pytaniem bezpośrednim i powinna mieć znak zapytania.
  terminology: „Jaką władzą” trafniej oddaje ἐν ποίᾳ ἐξουσίᾳ, zachowując otwartość pytania o autorytet i podstawę działania. Przypis wymaga przeformułowania, ponieważ „o jedną sprawę” nie jest prostą wymianą wyrażenia „jedno pytanie” w obecnej składni.
  issues:
  - severity: medium
    issue: „jakim prawem” dla ἐν ποίᾳ ἐξουσίᾳ
    rationale: Polskie wyrażenie koncentruje się na prawnym uprawnieniu, podczas gdy ἐξουσία oznacza władzę, autorytet lub upoważnienie. „Jaką władzą” jest bliższe źródłu i nie ogranicza sensu.
  - severity: low
    issue: Interpunkcja zdania warunkowego i zakończenie wypowiedzi
    rationale: Nie należy stawiać przecinka przed „i ja” po przecinku zamykającym zdanie podrzędne. Końcowy człon jest pytaniem bezpośrednim, więc wymaga znaku zapytania.
  - severity: low
    issue: Składnia alternatywy w przypisie
    rationale: Alternatywa „o jedną sprawę” wymagałaby innej konstrukcji głównego zdania. Przypis można sformułować jako objaśnienie dosłownego i szerszego sensu λόγον ἕνα.
