  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: pl
  text: 'mówiąc im: „Idźcie do wsi naprzeciw was, a zaraz znajdziecie uwiązaną oślicę, a przy niej oślę[a]. Odwiążcie je i przyprowadźcie do mnie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo oznacza młode zwierzę; w tym kontekście chodzi o młode osła.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: mówiąc im
  rationale: Imiesłów wprowadza treść wypowiedzi Jezusa; polski imiesłów zachowuje składniowe powiązanie z poprzednim wersetem.
- source_word: Πορεύεσθε
  choice: Idźcie
  rationale: Naturalny i wierny odpowiednik trybu rozkazującego w poleceniu skierowanym do uczniów.
- source_word: κώμην
  choice: wsi
  rationale: κώμη oznacza niewielką miejscowość, zwykle wieś, w odróżnieniu od miasta.
- source_word: κατέναντι ὑμῶν
  choice: która jest przed wami
  rationale: Wyrażenie przestrzenne może znaczyć „naprzeciw was” lub „przed wami”; wybrana forma jest naturalna po polsku i nie przesądza, czy wieś leżała po drugiej stronie określonej przeszkody.
- source_word: εὐθέως
  choice: Zaraz
  rationale: Oddaje bezpośredniość czasową εὐθέως w naturalnym, współczesnym rejestrze narracyjnym.
- source_word: ὄνον δεδεμένην
  choice: uwiązaną oślicę
  rationale: Żeński rodzaj form greckich wskazuje tu na samicę osła; „uwiązana” idiomatycznie opisuje zwierzę przywiązane w miejscu.
- source_word: πῶλον μετ’ αὐτῆς
  choice: a przy niej oślę
  rationale: πῶλος oznacza młode zwierzę, tutaj młode osła; „przy niej” naturalnie oddaje μετ’ αὐτῆς i relację obu zwierząt.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: Odwiążcie je i przyprowadźcie do mnie
  rationale: Grecki imiesłów poprzedzający rozkaźnik wyraża kolejność działań; dwa współrzędne polecenia są naturalnym polskim odpowiednikiem. „Je” odnosi się do obu zwierząt.
theological_decisions: []
translation_notes:
  register: Współczesny, godny język narracyjny. Zachowano zwięzłość polecenia i żeński rodzaj zwierzęcia wskazany przez grekę. Użyto „oślę” zamiast tradycyjnego, lecz mniej jednoznacznego „źrebię”.
