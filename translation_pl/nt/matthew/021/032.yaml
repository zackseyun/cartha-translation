reference: Matthew 21:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: pl
  text: Jan bowiem przyszedł do was drogą sprawiedliwości[a], a nie uwierzyliście mu. Uwierzyli mu natomiast poborcy podatków i prostytutki. Wy zaś, choć to zobaczyliście, nawet później nie zmieniliście zdania[c], aby mu uwierzyć[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „postępując sprawiedliwie” lub „drogą prawości”. Greckie wyrażenie może opisywać zarówno sposób życia i posługi Jana, jak i sprawiedliwą drogę, którą głosił.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „aby mu zaufać”. Grecki czasownik może oznaczać zarówno uwierzenie komuś, jak i obdarzenie go zaufaniem.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „nie żałowaliście później” albo „nie opamiętaliście się później”. Występuje tu czasownik μεταμέλομαι, który szczególnie wskazuje na zmianę zdania lub żal, a nie częstszy nowotestamentowy czasownik μετανοέω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: bowiem przyszedł
  rationale: Naturalnie zachowuje wyjaśniający związek z poprzednią wypowiedzią oraz narracyjny sens aorystu.
- source_word: πρὸς ὑμᾶς
  choice: do was
  rationale: Bezpośrednio oddaje kierunek wyrażony przez πρός z biernikiem.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: drogą sprawiedliwości
  rationale: Zachowuje metaforę drogi i pojemność greckiego wyrażenia, które może odnosić się zarówno do prawego sposobu życia i posługi Jana, jak i do głoszonej przez niego drogi.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: nie uwierzyliście mu / uwierzyli mu
  rationale: Polska konstrukcja z celownikiem wiernie oddaje πιστεύω z αὐτῷ i zachowuje kontrast, nie narzucając sensu „uwierzyć w niego”.
- source_word: τελῶναι
  choice: poborcy podatków
  rationale: Współczesne, jasne określenie osób pobierających podatki; unika archaicznego „celnicy”, które dziś może kojarzyć się głównie ze służbą graniczną.
- source_word: πόρναι
  choice: prostytutki
  rationale: Bezpośredni i współczesny odpowiednik, zachowujący społeczną oraz moralną siłę określenia w kontekście.
- source_word: ἰδόντες
  choice: choć to zobaczyliście
  rationale: Imiesłów dopuszcza ujęcie okolicznościowe; „to” jasno odsyła do wiary poborców podatków i prostytutek, a „choć” uwydatnia kontrast obecny w zdaniu.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: nawet później nie zmieniliście zdania
  rationale: Oddaje emfatyczne οὐδέ, czasowe ὕστερον i swoisty sens μεταμέλομαι jako zmiany zdania lub odczucia żalu, bez automatycznego utożsamienia z μετανοέω.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: aby mu uwierzyć
  rationale: Oddaje konstrukcję dopełniaczową bezokolicznika jako zamierzony rezultat zmiany zdania w naturalnej polszczyźnie.
theological_decisions:
- issue: Znaczenie ἐν ὁδῷ δικαιοσύνης
  choice: drogą sprawiedliwości
  alternative: postępując sprawiedliwie; drogą prawości
  rationale: 'Dosłowniejsze sformułowanie zachowuje zamierzoną wieloznaczność: może opisywać sposób życia i posługi Jana albo sprawiedliwą drogę, którą wskazywał.'
- issue: Znaczenie πιστεύω z celownikiem αὐτῷ
  choice: uwierzyć mu
  alternative: zaufać mu; uwierzyć w niego
  rationale: Kontekst dotyczy przyjęcia świadectwa i wezwania Jana. „Uwierzyć mu” zachowuje tę relację bez wprowadzania szerszej formuły teologicznej „uwierzyć w niego”.
- issue: Znaczenie μεταμέλομαι
  choice: zmienić zdanie
  alternative: żałować; opamiętać się
  rationale: Wybór zachowuje różnicę leksykalną względem częstszego μετανοέω. Przypis sygnalizuje moralny odcień żalu i możliwość mocniejszego przekładu.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano biblijną metaforę „drogi sprawiedliwości”, lecz użyto dzisiejszego określenia „poborcy podatków”. Składnia ostatniego zdania uwydatnia kontrast i następstwo czasowe bez nadmiernej dosłowności.
