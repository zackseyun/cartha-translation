source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: pl
  text: A chociaż usiłowali go pojmać, bali się tłumów, gdyż tłumy uważały go za proroka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: choć usiłowali
  rationale: Imiesłów czasu teraźniejszego wyraża trwający zamiar lub próbę; w kontekście ma sens przyzwalająco-przeciwstawny wobec lęku, który ich powstrzymywał.
- source_word: κρατῆσαι
  choice: pojmać
  rationale: W tym wrogim kontekście czasownik oznacza schwytanie lub zatrzymanie osoby, nie tylko fizyczne uchwycenie. „Pojmać” jest naturalne i nie przesądza o formalnym charakterze aresztowania.
- source_word: ἐφοβήθησαν
  choice: bali się
  rationale: Prosty polski czas przeszły oddaje aoryst bez narzucania odcienia rozpoczęcia stanu.
- source_word: τοὺς ὄχλους
  choice: tłumów
  rationale: Liczba mnoga źródła zostaje zachowana; forma dopełniacza wynika z polskiej składni czasownika „bać się”.
- source_word: ἐπεὶ εἰς
  choice: ponieważ
  rationale: Wyrażenie wprowadza przyczynę ich lęku; „ponieważ” jasno oddaje tę relację.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: uważały go za proroka
  rationale: Idiomy ἔχω z εἰς oznaczają uznawanie kogoś za kogoś. Polski zwrot „uważać za” naturalnie oddaje ocenę tłumów.
- source_word: προφήτην
  choice: proroka
  rationale: W konstrukcji „uważać za” polski rzeczownik występuje w bierniku; określa kategorię, do której tłumy zaliczały Jezusa.
theological_decisions:
- issue: Oddanie oceny Jezusa przez tłumy jako προφήτην bez zawężania ani rozszerzania chrystologii wersetu
  choice: uważały go za proroka
  alternative: uznawały go za proroka; miały go za proroka
  rationale: Zdanie relacjonuje punkt widzenia tłumów, a nie podaje wyczerpującej definicji tożsamości Jezusa. Sformułowanie nie sugeruje ani że był jedynie prorokiem, ani że tekst w tym miejscu orzeka coś więcej.
translation_notes:
  register: Współczesny, godny i czytelny rejestr. Zaimek „one” doprecyzowuje, że podmiotem czasownika „uważały” są tłumy, nie ludzie usiłujący pojmać Jezusa; pozwala uniknąć niejasności wywołanej polskimi formami rodzaju i liczby.
