  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: pl
  text: 'Odpowiedział: „Nie chcę”. Później jednak zmienił zdanie[a] i poszedł.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pożałował” albo „ustąpił”. Grecki imiesłów może obejmować sens żalu prowadzącego do zmiany wcześniejszej decyzji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Odpowiedział
  rationale: Typowa grecka formuła narracyjna z imiesłowem; w naturalnej polszczyźnie najlepiej oddaje ją osobowa forma czasownika.
- source_word: Οὐ θέλω
  choice: Nie chcę
  rationale: θέλω wyraża tu wolę lub chęć. Bezpośrednie „Nie chcę” zachowuje osobisty charakter odmowy, nie wzmacniając jej do kategorycznego „Nie pójdę”.
- source_word: ὕστερον δὲ
  choice: Później jednak
  rationale: Oddaje zarówno następstwo czasowe, jak i kontrast między wcześniejszą odmową a późniejszym działaniem.
- source_word: μεταμεληθεὶς
  choice: zmienił zdanie
  rationale: W tym kontekście czasownik wskazuje na zmianę wcześniejszej decyzji, mogącą obejmować żal. To sformułowanie zachowuje nacisk na odwrócenie zamiaru bez narzucania technicznego sensu religijnego.
- source_word: ἀπῆλθεν
  choice: poszedł
  rationale: W kontekście oznacza, że syn udał się wykonać polecenie. Zwykłe „poszedł” jest naturalne i wystarczające.
theological_decisions:
- issue: Znaczenie μεταμεληθεὶς w kontekście przypowieści
  choice: zmienił zdanie
  alternative: pożałował; opamiętał się
  rationale: Tekst opisuje przejście od odmowy do posłuszeństwa. „Zmienił zdanie” zachowuje tę zmianę postawy i działania, nie utożsamiając automatycznie μεταμέλομαι z pełnym teologicznym pojęciem nawrócenia ani nie wykluczając obecnego w słowie odcienia żalu.
translation_notes:
  register: Współczesna, prosta i godna polszczyzna narracyjna. Szyk zdań jest naturalny dla języka polskiego, a partykuła „jednak” wyraźnie zachowuje kontrast obecny w greckim δέ.
