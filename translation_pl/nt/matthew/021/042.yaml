id: MAT.21.42
reference: Matthew 21:42
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: pl
  text: 'Jezus powiedział im: „Czy nigdy nie czytaliście w Pismach: «Kamień, który odrzucili budowniczowie, właśnie ten stał się kamieniem węgielnym[a]. Od Pana[b] to się stało i jest godne podziwu w naszych oczach»?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „kamieniem wieńczącym”; dosłownie: „głową narożnika”.'
    reason: lexical_alternative
  - marker: b
    text: Grecki tekst ma „od Pana”; w hebrajskim tekście cytowanego Psalmu występuje „od PANA” (JHWH).
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: powiedział
  rationale: Grecki czas teraźniejszy historyczny naturalnie oddano polskim czasem przeszłym, zgodnie ze stylem narracji.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Czy nigdy nie czytaliście
  rationale: Takie sformułowanie zachowuje stanowczą, retoryczną wymowę pytania i brzmi naturalnie po polsku.
- source_word: ἐν ταῖς γραφαῖς
  choice: w Pismach
  rationale: W tym kontekście chodzi o święte pisma Izraela; liczba mnoga odzwierciedla formę grecką bez sprowadzania jej do pojedynczego zbiorczego tytułu.
- source_word: ἀπεδοκίμασαν
  choice: odrzucili
  rationale: Czasownik oznacza uznanie czegoś za nieodpowiednie i odrzucenie; zwięzłe „odrzucili” dobrze przekazuje sens.
- source_word: οἱ οἰκοδομοῦντες
  choice: budowniczowie
  rationale: Imiesłów użyty rzeczownikowo najnaturalniej oddaje polski rzeczownik zachowujący obraz budowy.
- source_word: οὗτος
  choice: właśnie ten
  rationale: Dodanie „właśnie” zachowuje emfatyczną siłę greckiego zaimka wskazującego.
- source_word: ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: stał się kamieniem węgielnym
  rationale: Oddaje zmianę funkcji lub statusu kamienia, a utrwalone wyrażenie „kamień węgielny” jest jasne i godne, choć inne rozumienie obrazu zaznaczono w przypisie.
- source_word: παρὰ κυρίου
  choice: Od Pana
  rationale: Przyimek παρά z dopełniaczem wskazuje tu źródło lub pochodzenie; „od Pana” zachowuje tę relację.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: jest godne podziwu w naszych oczach
  rationale: Sformułowanie zachowuje podniosły obraz oczu oraz znaczenie czegoś niezwykłego i wzbudzającego podziw.
theological_decisions:
- issue: Oddanie κύριος w cytacie z Psalmu
  choice: Pan
  alternative: PAN
  rationale: Grecki tekst Ewangelii ma κυρίου, dlatego tekst główny używa „Pan”. Hebrajski tekst cytowanego Psalmu zawiera imię JHWH, co przejrzyście wskazano w przypisie.
- issue: Mesjańskie odniesienie obrazu kamienia
  choice: Zachowanie metafory bez dopowiedzenia jej znaczenia
  alternative: Jawne utożsamienie kamienia z Mesjaszem lub Jezusem
  rationale: Kontekst wskazuje na zastosowanie tego cytatu przez Jezusa, lecz sam cytat nie zawiera bezpośredniego objaśnienia. Przekład nie dodaje więc interpretacyjnej identyfikacji.
- issue: Funkcja κεφαλὴ γωνίας
  choice: kamień węgielny
  alternative: kamień wieńczący
  rationale: Greckie wyrażenie może być rozumiane jako główny kamień narożny, ale dokładna funkcja architektoniczna pozostaje dyskutowana. Najbardziej rozpoznawalny odpowiednik umieszczono w tekście, a alternatywę w przypisie.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano retoryczne pytanie, paralelny tok cytatu oraz rozpoznawalną metaforę kamienia, unikając zarówno archaizmów, jak i interpretacyjnego rozwijania sensu.
