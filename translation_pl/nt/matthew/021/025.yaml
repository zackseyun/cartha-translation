  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: pl
  text: '„Skąd pochodził chrzest Jana? Z nieba[a] czy od ludzi[b]?” A oni naradzali się między sobą, mówiąc: „Jeśli powiemy: «Z nieba», powie nam: «Dlaczego więc mu nie uwierzyliście?»”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „od Boga”. Greckie „z nieba” jest pełnym szacunku sposobem mówienia o pochodzeniu od Boga.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie oznacza pochodzenie ludzkie, przeciwstawione pochodzeniu z nieba.
    reason: lexical_clarification
lexical_decisions:
- source_word: βάπτισμα
  choice: chrzest
  rationale: Termin oznacza obrzęd lub praktykę chrztu; w tym kontekście odnosi się do chrztu sprawowanego przez Jana i jego posłannictwa.
- source_word: τὸ Ἰωάννου
  choice: Jana
  rationale: Dopełniacz wskazuje na chrzest związany z Janem. Naturalna polska konstrukcja „chrzest Jana” zachowuje tę relację.
- source_word: πόθεν ἦν
  choice: skąd pochodził
  rationale: Pytanie dotyczy źródła i pochodzenia autorytetu chrztu Jana. Takie sformułowanie jest naturalne po polsku i oddaje sens πόθεν.
- source_word: ἐξ οὐρανοῦ
  choice: z nieba
  rationale: Dosłowne brzmienie zachowuje żydowski pełen szacunku sposób mówienia o boskim pochodzeniu i nie zastępuje go interpretacyjnie wyrażeniem „od Boga”.
- source_word: ἐξ ἀνθρώπων
  choice: od ludzi
  rationale: Wyrażenie wskazuje na pochodzenie ludzkie, przeciwstawione pochodzeniu niebiańskiemu. „Od ludzi” jest naturalne i neutralne pod względem płci.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: rozważali między sobą
  rationale: Imperfectum wskazuje na trwającą naradę; „rozważali między sobą” oddaje zarówno namysł, jak i wzajemną dyskusję.
- source_word: Ἐὰν εἴπωμεν
  choice: jeśli powiemy
  rationale: Naturalny polski odpowiednik zdania warunkowego z aorystem w trybie łączącym.
- source_word: ἐρεῖ ἡμῖν
  choice: zapyta nas
  rationale: Choć λέγω dosłownie znaczy „powie”, następująca wypowiedź ma formę pytania; „zapyta nas” jest naturalnym polskim wprowadzeniem mowy bezpośredniej i zachowuje funkcję wypowiedzi.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: mu nie uwierzyliście
  rationale: πιστεύω z celownikiem oznacza uwierzenie danej osobie; szyk jest naturalny po polsku i zachowuje odniesienie do Jana.
theological_decisions:
- issue: Znaczenie wyrażenia „z nieba”
  choice: Zachować „z nieba” w tekście głównym jako dosłowne określenie boskiego pochodzenia lub upoważnienia.
  alternative: od Boga
  rationale: Dosłowne sformułowanie zachowuje pełen szacunku zwrot źródłowy oraz retoryczne przeciwstawienie pochodzeniu ludzkiemu, nie usuwając sposobu wyrażenia obecnego w grece.
- issue: Zakres znaczeniowy ἀνθρώπων
  choice: od ludzi
  alternative: od człowieka; od mężczyzn
  rationale: Rzeczownik ma tu znaczenie ogólnoludzkie, nie męskie. „Od ludzi” precyzyjnie przeciwstawia źródło ludzkie niebiańskiemu.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano zwięzłą formę sporu oraz dosłowne „z nieba”; użyto neutralnego płciowo „od ludzi”. Markery przypisów umieszczono bezpośrednio po odpowiadających im wyrażeniach.
