  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: pl
  text: 'Gdy wszedł do Jerozolimy, całe miasto się poruszyło[a]. Ludzie pytali: „Kto to jest?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „całe miasto zostało wstrząśnięte”. Grecki czasownik może oznaczać fizyczne wstrząśnięcie, lecz tutaj opisuje publiczne poruszenie lub wzburzenie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Gdy wszedł
  rationale: Grecki genetivus absolutus ma tu znaczenie czasowe. Zdanie podrzędne „Gdy wszedł” oddaje je jasno i naturalnie, bez przesądzania, czy reakcja nastąpiła w trakcie wejścia, czy bezpośrednio po nim.
- source_word: Ἱεροσόλυμα
  choice: Jerozolimy
  rationale: Standardowa polska forma nazwy własnej, użyta po przyimku „do” w dopełniaczu.
- source_word: ἐσείσθη
  choice: ogarnęło poruszenie
  rationale: Czasownik σείω dosłownie oznacza potrząsanie lub wstrząsanie, lecz tutaj opisuje zbiorowe wzburzenie wywołane wejściem Jezusa. Wyrażenie zachowuje obraz silnej reakcji miasta, a zarazem brzmi naturalnie po polsku.
- source_word: πᾶσα ἡ πόλις
  choice: całe miasto
  rationale: Naturalny polski odpowiednik greckiego wyrażenia obejmującego miasto jako zbiorowość jego mieszkańców.
- source_word: λέγουσα
  choice: Ludzie mówili
  rationale: Imiesłów gramatycznie odnosi się do „miasta”, które metonimicznie oznacza mieszkańców. Rozwinięcie „Ludzie mówili” usuwa nienaturalne polskie połączenie „miasto mówiło”, nie zmieniając treści wypowiedzi.
- source_word: Τίς ἐστιν οὗτος;
  choice: Kto to jest?
  rationale: Bezpośredni i idiomatyczny przekład pytania; nie dodaje rzeczownika „człowiek”, którego nie ma w tekście greckim.
theological_decisions:
- issue: Dosłowny lub przenośny sens reakcji miasta
  choice: 'Przenośnie: „całe miasto ogarnęło poruszenie”'
  alternative: „całe miasto się zatrzęsło”
  rationale: Kontekst opisuje publiczne wzburzenie związane z przybyciem Jezusa, a nie fizyczne trzęsienie ziemi. Przekład główny przekazuje sens sytuacyjny, natomiast przypis zachowuje dosłowny obraz i autentyczny zakres znaczeniowy greckiego czasownika.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Podział na dwa zdania pozwala naturalnie oddać grecką personifikację miasta jako zbiorowości mieszkańców. Cudzysłów polski i składnia pytania odpowiadają współczesnej normie.
