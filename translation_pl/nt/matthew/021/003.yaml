source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: pl
  text: 'A jeśli ktoś wam coś powie, odpowiedzcie: „Pan ich potrzebuje”[a], a on zaraz je pośle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wyraz tłumaczony jako „Pan” może tu także, zależnie od kontekstu, oznaczać „właściciela” lub „pana”.
    reason: lexical_alternative
  - marker: b
    text: Podmiot nie jest wyrażony wprost. Najprawdopodobniej chodzi o osobę, która zwróci się do uczniów i zaraz pośle z nimi zwierzęta; możliwe jest też odniesienie do „Pana”.
    reason: referential_ambiguity
lexical_decisions:
- source_word: καὶ ἐάν τις
  choice: A jeśli ktoś
  rationale: Oddaje łącznik καί oraz otwarty, nieokreślony warunek w naturalnej współczesnej polszczyźnie.
- source_word: ὑμῖν εἴπῃ τι
  choice: wam coś powie
  rationale: Zachowuje liczbę mnogą ὑμῖν i szerokie znaczenie λέγω z nieokreślonym τι; tekst nie precyzuje, czy chodzi o pytanie, czy sprzeciw.
- source_word: ἐρεῖτε
  choice: odpowiedzcie
  rationale: Przyszły czasownik ma tutaj funkcję polecenia. „Odpowiedzcie” naturalnie wyraża reakcję na czyjąś wypowiedź, nie ograniczając jej do pytania.
- source_word: Ὁ κύριος
  choice: Pan
  rationale: Zachowuje zwyczajowy tytuł odpowiadający κύριος, a zarazem nie usuwa możliwego w tym kontekście znaczenia „właściciel” lub „pan” zwierząt.
- source_word: αὐτῶν χρείαν ἔχει
  choice: ich potrzebuje
  rationale: Naturalny polski odpowiednik greckiego idiomu „ma potrzebę ich”; zaimek odnosi się do obu zwierząt.
- source_word: εὐθὺς
  choice: zaraz
  rationale: Zwięźle i współcześnie oddaje natychmiastowość działania.
- source_word: ἀποστελεῖ αὐτούς
  choice: on zaraz je pośle
  rationale: „Pośle” zachowuje podstawowe znaczenie ἀποστέλλω bez dopowiadania „odeśle” lub „uwolni”. Wyrażony zaimek „on” uwidacznia zmianę podmiotu, lecz sam tekst główny nie rozstrzyga jej ponad to, co wynika z kontekstu.
theological_decisions:
- issue: Znaczenie i odniesienie Ὁ κύριος
  choice: Pan
  alternative: właściciel / pan
  rationale: „Pan” zachowuje możliwy tytuł odnoszący się do Jezusa oraz autorytet wypowiedzi. Przypis sygnalizuje zwykłe znaczenie rzeczownika, które w tej scenie może zostać odczytane jako „właściciel”, bez narzucania jednego rozwiązania.
- issue: Podmiot ἀποστελεῖ
  choice: osoba, która zwróci się do uczniów, pośle zwierzęta
  alternative: Pan natychmiast je odeśle
  rationale: Najbliższym naturalnym podmiotem domyślnym jest osoba reagująca na wyjaśnienie uczniów. Greka nie podaje jednak podmiotu wprost, dlatego możliwość odniesienia do „Pana” pozostaje zaznaczona w przypisie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Forma „odpowiedzcie” naturalnie przekazuje instrukcyjny charakter greckiego czasu przyszłego, a „zaraz” unika zarówno archaizacji, jak i potoczności.
