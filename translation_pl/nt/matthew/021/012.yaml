source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: pl
  text: Jezus wszedł na dziedzińce świątyni i wypędził wszystkich, którzy na terenie świątyni sprzedawali i kupowali[a]. Poprzewracał też stoły wymieniających monety oraz siedziska sprzedających gołębie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też przetłumaczyć: „do świątyni” lub „na teren świątyni”. Grecki wyraz oznacza cały kompleks świątynny, a nie konkretnie wewnętrzne sanktuarium.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: teren świątyni
  rationale: Grecki wyraz oznacza cały kompleks świątynny, a nie konkretnie wewnętrzne sanktuarium; „teren świątyni” jasno oddaje przestrzeń, w której odbywał się handel.
- source_word: ἐξέβαλεν
  choice: wypędził
  rationale: Czasownik wyraża zdecydowane, przymusowe usunięcie; „wypędził” jest naturalne i zachowuje siłę działania.
- source_word: πάντας
  choice: wszystkich
  rationale: Jawnie zachowuje pełny zakres greckiego określenia odnoszącego się do sprzedających i kupujących.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: którzy (…) sprzedawali i kupowali
  rationale: Naturalna polska konstrukcja opisująca osoby zajmujące się obiema wymienionymi czynnościami, bez zawężania grupy.
- source_word: τράπεζας
  choice: stoły
  rationale: Podstawowe znaczenie rzeczownika pasuje do stołów używanych przy wymianie pieniędzy i nie dodaje szczegółów nieobecnych w tekście.
- source_word: κολλυβιστῶν
  choice: wymieniających pieniądze
  rationale: Określenie odnosi się do osób dokonujących wymiany monet; opisowe tłumaczenie jest jasne we współczesnej polszczyźnie.
- source_word: κατέστρεψεν
  choice: powywracał
  rationale: W tym kontekście czasownik oznacza przewrócenie stołów i krzeseł; forma ta jest obrazowa, lecz nie sugeruje ich zniszczenia.
- source_word: καθέδρας
  choice: krzesła
  rationale: Rzeczownik oznacza miejsca do siedzenia; „krzesła” jest tu konkretnym i naturalnym polskim odpowiednikiem.
- source_word: περιστεράς
  choice: gołębi
  rationale: Grecki termin może oznaczać gołębie różnych odmian; „gołębie” jest naturalnym i utrwalonym określeniem w kontekście ofiar świątynnych.
theological_decisions:
- issue: Zakres znaczeniowy ἱερόν w opisie działania Jezusa
  choice: Jezus wszedł na teren kompleksu świątynnego, nie do samego wewnętrznego sanktuarium.
  alternative: Ogólne „wszedł do świątyni”, bez przestrzennego doprecyzowania.
  rationale: Rozróżnienie między ἱερόν a ναός ma znaczenie historyczne i przestrzenne. „Teren świątyni” zachowuje prawdopodobny sens tekstu i nie sugeruje, że Jezus wszedł do Miejsca Świętego.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Powtórzenie „na jej terenie” zachowuje dwukrotne użycie ἱερόν i wyraźnie lokalizuje handel; druga część została wydzielona jako osobne zdanie dla naturalnego rytmu bez zmiany relacji między czynnościami.
