  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: pl
  text: A ten, kto upadnie na ten kamień, roztrzaska się; lecz na kogo on upadnie, tego zmiażdży[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Czasownik oddany jako „zmiażdży” może też oznaczać „rozetrze na proch” lub „rozproszy jak plewy”.
    reason: lexical_alternative
  - marker: b
    text: Tego wersetu nie ma w niektórych rękopisach Ewangelii Mateusza; por. Łk 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: ten, kto upadnie
  rationale: Urzeczownikowiony imiesłów odnosi się ogólnie do pojedynczej osoby; konstrukcja „ten, kto” jest naturalna po polsku i zachowuje przysłowiowy charakter wypowiedzi.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: na ten kamień
  rationale: Bezpośrednie określenie przestrzenne zachowuje konkretny obraz kamienia oraz jego związek z najbliższym kontekstem.
- source_word: συνθλασθήσεται
  choice: roztrzaska się
  rationale: Czasownik wyraża dotkliwe rozbicie. „Roztrzaska się” brzmi naturalnie i pozostaje znaczeniowo odrębne od mocniejszego λικμήσει w drugiej części zdania.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: na kogo zaś on upadnie
  rationale: 'Konstrukcja zachowuje odwrócenie kierunku uderzenia: teraz to kamień jest domyślnym podmiotem upadania. Zaimek „on” jasno odsyła do kamienia.'
- source_word: λικμήσει
  choice: zmiażdży
  rationale: W tym kontekście czasownik oznacza niszczące skruszenie, mogące sugerować rozdrobnienie lub rozwianie jak plewy. „Zmiażdży” jest wyraziste, współczesne i nie narzuca jednego rozwinięcia metafory.
- source_word: αὐτόν
  choice: tego
  rationale: Polskie „tego” naturalnie podejmuje ogólną, pojedynczą osobę z konstrukcji „na kogo” i zachowuje liczbę pojedynczą bez niezręcznego powtórzenia.
theological_decisions:
- issue: Obraz kamienia i metafora sądu
  choice: Zachować konkretny „kamień” oraz dwa odmienne obrazy niszczącego uderzenia bez dopowiadania w tekście, kogo kamień oznacza.
  alternative: Wprost utożsamić kamień z Mesjaszem lub Jezusem albo ujednolicić oba czasowniki jako ogólne „zniszczy”.
  rationale: Kontekst objaśnia symbolikę kamienia, lecz sam werset ma formę obrazowej, przysłowiowej wypowiedzi. Przekład powinien zachować jej napięcie i surowość bez interpretacyjnego rozszerzenia.
- issue: Niepewność tekstualna całego wersetu
  choice: Umieścić werset w tekście głównym i zaznaczyć wariant rękopiśmienny w przypisie.
  alternative: Pominąć werset z tekstu głównego albo ująć go w nawiasy.
  rationale: Werset należy do przekazanego tekstu SBLGNT, ale jego brak w części rękopisów Mateusza jest istotnym świadectwem, które należy jawnie podać czytelnikowi.
translation_notes:
  register: Współczesny, godny i obrazowy język. Składnia „ten, kto…; na kogo zaś…” zachowuje paralelizm i zmianę kierunku działania, a rozróżnienie „roztrzaska się / zmiażdży” odzwierciedla dwa greckie czasowniki.
