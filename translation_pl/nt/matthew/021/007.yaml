id: MAT.21.7
reference: Matthew 21:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: pl
  text: Przyprowadzili oślicę i źrebię, położyli na nich swoje płaszcze, a on usiadł na nich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też, bardziej szczegółowo: „usiadł na płaszczach” położonych na zwierzętach.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: Przyprowadzili
  rationale: Aoryst od ἄγω może znaczyć „przyprowadzić” lub „prowadzić”. W tej scenie „przyprowadzili” naturalnie oddaje doprowadzenie zwierząt do Jezusa.
- source_word: τὴν ὄνον
  choice: oślicę
  rationale: Rodzajnik żeński wskazuje tutaj na samicę osła. Polskie „oślica” jest naturalne i zachowuje informację gramatyczną oraz kontekst matki ze źrebięciem.
- source_word: τὸν πῶλον
  choice: źrebię
  rationale: πῶλος oznacza młode zwierzę; w tym kontekście młode osła. „Źrebię” jest zwięzłym i zrozumiałym polskim odpowiednikiem.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: położyli na nich swoje płaszcze
  rationale: ἱμάτια oznacza odzież wierzchnią, tutaj naturalnie „płaszcze”. Zaimek „swoje” jasno wskazuje, że chodzi o okrycia uczniów, zgodnie z kontekstem.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: usiadł na nich
  rationale: Greka zachowuje liczbę mnogą i nie rozstrzyga jednoznacznie, czy zaimek odnosi się do zwierząt, czy do położonych na nich płaszczy. Dosłowne „na nich” zachowuje tę niejednoznaczność.
theological_decisions:
- issue: Odniesienie końcowego αὐτῶν w ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: 'Zachować liczbę mnogą: „usiadł na nich”.'
  alternative: „usiadł na płaszczach” albo interpretacyjne wskazanie jednego ze zwierząt
  rationale: Jest to rzeczywista niejednoznaczność składniowa i narracyjna, nie zaś kwestia wymagająca doktrynalnego rozstrzygnięcia. Tekst główny jej nie usuwa, a przypis podaje naturalne doprecyzowanie.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. „Oślica” zachowuje płeć zwierzęcia zaznaczoną w grece, a końcowe „na nich” celowo zachowuje dwuznaczność tekstu źródłowego.
