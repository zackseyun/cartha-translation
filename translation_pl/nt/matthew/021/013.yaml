id: MAT.21.13
reference: Matthew 21:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: pl
  text: 'I mówi im: „Napisano[a]: «Mój dom będzie nazwany domem modlitwy», wy zaś robicie z niego kryjówkę rozbójników[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jezus łączy tu słowa z Iz 56,7 i Jr 7,11.
    reason: cross_reference
  - marker: b
    text: Greckie słowo przetłumaczone jako „rozbójnicy” może też oznaczać rabusiów lub gwałtownych bandytów.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Zachowano grecki praesens historicum, które nadaje narracji żywość; polskie „mówi” jest naturalne w takim użyciu.
- source_word: Γέγραπται
  choice: Napisano
  rationale: Utrwalona polska formuła wprowadzająca cytat z Pisma; oddaje perfectum strony biernej i aktualną moc zapisu.
- source_word: Ὁ οἶκός μου
  choice: Mój dom
  rationale: Dosłownie zachowuje biblijne określenie domu Boga; „świątynia” byłaby doprecyzowaniem interpretacyjnym.
- source_word: οἶκος προσευχῆς
  choice: dom modlitwy
  rationale: Naturalnie oddaje grecką konstrukcję dopełniaczową i zachowuje rozpoznawalny język Iz 56,7.
- source_word: κληθήσεται
  choice: będzie nazwany
  rationale: Bezpośrednio oddaje futurum strony biernej bez archaizacji.
- source_word: ποιεῖτε
  choice: robicie z niego
  rationale: Oddaje trwające działanie adresatów oraz sens czynienia z domu Bożego określonego rodzaju miejsca.
- source_word: σπήλαιον
  choice: kryjówkę
  rationale: W kontekście rozbójników chodzi nie tylko o naturalną jaskinię, lecz o schronienie lub bazę; „kryjówka” brzmi naturalnie i zachowuje funkcjonalny sens metafory.
- source_word: λῃστῶν
  choice: rozbójników
  rationale: λῃστής może oznaczać rabusia lub gwałtownego bandytę; „rozbójników” zachowuje moc oskarżenia i tradycyjne echo Jr 7,11.
theological_decisions:
- issue: Połączenie cytatu z Iz 56,7 i aluzji do Jr 7,11
  choice: Zachowano rozpoznawalne frazy „Mój dom będzie nazwany domem modlitwy” oraz „kryjówkę rozbójników”.
  alternative: Swobodna parafraza, np. „miejsce, gdzie ludzie się modlą” i „schronienie przestępców”.
  rationale: Wypowiedź Jezusa świadomie zestawia język dwóch tekstów prorockich; zachowanie ich związku jest istotne dla przejrzystości teologicznej.
- issue: Zakres znaczeniowy λῃστῶν
  choice: rozbójników
  alternative: rabusiów; bandytów
  rationale: „Rozbójników” obejmuje element rabunku i przemocy, nie ograniczając zarzutu do drobnej kradzieży.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano żywe „mówi” oraz tradycyjnie rozpoznawalny rytm cytatów, unikając archaizmów.
