  to: 'A co wy o tym sądzicie? Pewien człowiek miał dwoje dzieci. Podszedł do pierwszego z nich i powiedział: „Dziecko, idź dzisiaj pracować w winnicy”.'
  rationale: Zmiana „do pierwszego” na „do pierwszego z nich” usuwa nieuzasadnione rodzajowe zawężenie, zachowując odniesienie do pierwszego z dwojga dzieci. Uporządkowano też zakres cudzysłowu i usunięto zbędny przypis. Sens, rejestr oraz obraz przypowieści pozostają bez zmian.
