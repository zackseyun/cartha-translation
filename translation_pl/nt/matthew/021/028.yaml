  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: pl
  text: 'A co wy o tym sądzicie? Pewien człowiek miał dwoje dzieci. Podszedł do pierwszego z nich i powiedział: „Dziecko, idź dzisiaj pracować w winnicy”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: A co wy o tym sądzicie?
  rationale: Naturalne polskie pytanie o osąd słuchaczy; „a” zachowuje łagodną siłę łączącą δέ, a zaimek „wy” oddaje wyraźne ὑμῖν.
- source_word: ἄνθρωπος
  choice: Pewien człowiek
  rationale: W opowiadaniu chodzi o mężczyznę będącego ojcem dzieci; polskie „pewien człowiek” naturalnie wprowadza anonimową postać bez nadmiernego doprecyzowania.
- source_word: τέκνα δύο
  choice: dwoje dzieci
  rationale: τέκνα jest określeniem ogólnym, nie zaś swoistym słowem oznaczającym synów. Forma „dwoje dzieci” jest poprawna i naturalna po polsku.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Podszedł do pierwszego
  rationale: Oddaje czynność poprzedzającą wypowiedź oraz porządkowe τῷ πρώτῳ. Męska forma „pierwszego” wynika z polskiej elipsy rzeczownika osobowego, lecz sama nie rozstrzyga, że grecki tekst mówi „syn”.
- source_word: Τέκνον
  choice: Dziecko
  rationale: Zachowuje szersze znaczenie greckiego τέκνον i nie zastępuje go węższym „synu”.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: idź dzisiaj pracować
  rationale: Naturalnie oddaje dwa imperatywy oraz przysłówek czasu, bez zmiany siły prostego polecenia.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: w winnicy
  rationale: Bezpośrednio i idiomatycznie zachowuje miejsce pracy oraz obraz winnicy.
theological_decisions:
- issue: Czy τέκνα/τέκνον oddać tradycyjnie jako „synowie/synu”
  choice: dzieci / Dziecko
  alternative: synowie / Synu
  rationale: Greka używa ogólniejszych τέκνα i τέκνον, a nie υἱοί i υἱέ. Przekład nie zawęża więc płci dzieci tam, gdzie nie czyni tego ten werset.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano ogólne „dzieci/Dziecko”, choć polska elipsa „do pierwszego” wymaga rodzaju męskiego; przypis zapobiega odczytaniu tej formy jako rozstrzygnięcia płci.
