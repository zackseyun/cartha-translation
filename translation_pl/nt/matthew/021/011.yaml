source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: pl
  text: 'A tłumy mówiły: „To jest prorok[a] Jezus z Nazaretu w Galilei”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie wyrażenie ma rodzajnik: „ten prorok”. Może on wskazywać na rozpoznawaną postać prorocką.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: A tłumy
  rationale: Liczba mnoga ὄχλοι oznacza zgromadzone tłumy lub grupy ludzi; „tłumy” jest naturalne we współczesnej polszczyźnie. Spójnik δέ ma tu lekką funkcję łączącą, oddaną przez „A”.
- source_word: ἔλεγον
  choice: mówiły
  rationale: Imperfectum wskazuje na trwającą lub powtarzaną wypowiedź. Polskie „mówiły” w tym kontekście zachowuje niedokonany aspekt bez nadmiernego doprecyzowania typu „powtarzały”.
- source_word: Οὗτός ἐστιν
  choice: To jest
  rationale: Naturalna polska konstrukcja identyfikacyjna, wiernie oddająca zaimek wskazujący i łącznik.
- source_word: ὁ προφήτης
  choice: prorok
  rationale: Polszczyzna zwykle nie oznacza określoności rodzajnikiem; „prorok” może tu wskazywać na rozpoznawaną postać prorocką, a sztuczne „ten prorok” nadmiernie wzmacniałoby grecki rodzajnik.
- source_word: Ἰησοῦς
  choice: Jezus
  rationale: Utrwalona polska forma imienia.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: z Nazaretu w Galilei
  rationale: Fraza wskazuje miejsce pochodzenia Jezusa. „Z Nazaretu w Galilei” jest naturalnym i geograficznie jasnym odpowiednikiem, zachowującym relację Nazaretu do Galilei.
theological_decisions:
- issue: Czy ὁ προφήτης należy rozumieć określenie definitywne, czy opis ogólny
  choice: prorok
  alternative: ten Prorok / pewien prorok
  rationale: Greka ma rodzajnik, który może sugerować rozpoznawaną lub oczekiwaną postać prorocką, ale jego mechaniczne oddanie jako „ten Prorok” rozstrzygałoby więcej, niż wymaga tekst. Bezrodzajnikowa polszczyzna pozwala zachować napięcie; przypis sygnalizuje możliwy sens definitywny.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano niedokonany charakter czasownika oraz naturalny polski szyk. Przypis nie narzuca identyfikacji mesjańskiej, lecz zachowuje możliwą określoność greckiego wyrażenia.
