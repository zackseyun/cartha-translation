  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: pl
  text: 'Powiedzcie córce Syjonu: „Oto twój król przychodzi do ciebie, łagodny[a] i dosiadający osła oraz źrebięcia[b], potomka zwierzęcia jucznego”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pokorny” lub „cichy”. Greckie πραΰς może wyrażać łagodność, cichość albo pokorę i nawiązuje do Za 9,9.'
    reason: lexical_alternative
  - marker: b
    text: 'Mateusz zachowuje podwojone sformułowanie proroctwa: „osła oraz źrebięcia, potomka zwierzęcia jucznego”.'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Powiedzcie
  rationale: Aorystyczny tryb rozkazujący w liczbie mnogiej; naturalnie zachowuje bezpośrednie polecenie wprowadzające cytat.
- source_word: τῇ θυγατρὶ Σιών
  choice: córce Syjonu
  rationale: Zachowuje prorocką personifikację Syjonu zamiast zastępować ją objaśniającym określeniem mieszkańców Jerozolimy.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Współczesne i podniosłe wezwanie do zwrócenia uwagi, bez archaizowania tekstu.
- source_word: ὁ βασιλεύς σου
  choice: twój Król
  rationale: Wiernie oddaje konstrukcję dzierżawczą i królewską wymowę cytatu; wielka litera sygnalizuje tytuł odnoszony w kontekście do Jezusa, zgodnie ze współczesną polską praktyką religijną.
- source_word: ἔρχεταί σοι
  choice: przychodzi do ciebie
  rationale: Czas teraźniejszy zachowuje żywość i bezpośredniość zapowiadanej chwili przybycia.
- source_word: πραῢς
  choice: łagodny
  rationale: Najbardziej naturalnie oddaje tutaj łagodność i nieagresywny sposób przybycia króla; możliwe znaczenie „pokorny” pozostawiono w przypisie.
- source_word: ἐπιβεβηκὼς
  choice: dosiadający
  rationale: Imiesłów opisuje króla jako znajdującego się na zwierzęciu po jego dosiadaniu; polskie słowo jest zwięzłe i naturalne.
- source_word: ἐπὶ ὄνον
  choice: osła
  rationale: Po czasowniku „dosiadać” polszczyzna wymaga dopełniacza bez przyimka, co naturalnie oddaje grecką frazę przyimkową.
- source_word: πῶλον
  choice: źrebięcia
  rationale: Oznacza młode zwierzę; dalsze dopowiedzenie precyzuje jego pochodzenie i funkcjonalną klasę.
- source_word: υἱὸν ὑποζυγίου
  choice: potomka zwierzęcia jucznego
  rationale: Oddaje semicki zwrot dosłownie znaczący „syna zwierzęcia jucznego”, unikając w polszczyźnie nienaturalnego określenia zwierzęcia jako „syna”, a zarazem nie zawęża ὑποζύγιον do oślicy.
theological_decisions:
- issue: Cytat mesjański z Zachariasza 9,9 i możliwość ujednolicenia go z brzmieniem tekstu hebrajskiego lub tradycyjnych przekładów
  choice: 'Zachowano właściwe Mateuszowi greckie brzmienie: „łagodny i dosiadający osła oraz źrebięcia, potomka zwierzęcia jucznego”.'
  alternative: Użyć „pokorny” albo połączyć oba określenia zwierząt tak, by wyraźnie wskazywały tylko jedno zwierzę.
  rationale: Przekład odzwierciedla tekst grecki Mateusza, nie harmonizując go po cichu z inną postacią proroctwa. Zachowuje również podwojone określenie zwierząt i wynikające z niego napięcie interpretacyjne.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna o lekko podniosłym rejestrze właściwym cytatowi prorockiemu. Zachowano personifikację „córki Syjonu” oraz strukturę obu określeń zwierząt. Markery przypisów umieszczono przy wyrażeniach, których przypisy bezpośrednio dotyczą.
