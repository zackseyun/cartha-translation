  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: pl
  text: Gdy zaś zbliżyła się pora zbioru owoców, posłał swoje sługi[a] do dzierżawców[b], aby odebrali należne mu owoce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „niewolników”. Greckie δοῦλοι może oznaczać zarówno sługi, jak i niewolników; tutaj nacisk pada na ich rolę jako wysłanników właściciela.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „rolników” lub „uprawiających winnicę”. Greckie γεωργοί oznacza ludzi zajmujących się uprawą; w tej przypowieści pracują oni w winnicy należącej do kogoś innego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Gdy zaś
  rationale: ὅτε wprowadza zdanie czasowe, a δέ stanowi łagodne przejście narracyjne; „gdy zaś” oddaje oba elementy naturalnie po polsku.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: zbliżyła się pora zbioru owoców
  rationale: ἤγγισεν oznacza „zbliżyła się”, καιρός właściwą porę, a dopełniacz τῶν καρπῶν określa ją jako porę związaną z owocami. Dodanie „zbioru” jasno i idiomatycznie wyraża sens rolniczy.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Zwykły czasownik narracyjny oznaczający wysłanie kogoś z określonym zadaniem; „posłał” pasuje do roli przedstawicieli właściciela.
- source_word: τοὺς δούλους αὐτοῦ
  choice: swoje sługi
  rationale: δοῦλος może oznaczać niewolnika lub sługę. W tym zdaniu na pierwszym planie jest funkcja wysłanników gospodarza, dlatego wybrano „sługi”, a alternatywę podano w przypisie.
- source_word: πρὸς τοὺς γεωργούς
  choice: do dzierżawców
  rationale: γεωργοί to uprawiający ziemię lub winnicę; z kontekstu przypowieści wynika, że pracują w cudzej winnicy jako dzierżawcy. Polski termin zwięźle ukazuje tę relację.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: aby odebrali należne mu owoce
  rationale: λαβεῖν może znaczyć „wziąć” lub „odebrać”, a αὐτοῦ wskazuje, że owoce należą do właściciela. „Należne mu” naturalnie wyraża ten stosunek własności, zachowując dosłowne „owoce” dla καρπούς.
theological_decisions:
- issue: Znaczenie owoców należących do właściciela
  choice: należne mu owoce
  alternative: jego owoce
  rationale: Sformułowanie oddaje αὐτοῦ w realiach dzierżawy, nie rozstrzygając alegorycznego znaczenia owoców ani nie dodając określonej interpretacji teologicznej.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zdanie zachowuje obraz „owoców”, a zarazem używa naturalnego polskiego określenia „pora zbioru owoców”. Markery przypisów umieszczono bezpośrednio po wyrazach, których dotyczą.
