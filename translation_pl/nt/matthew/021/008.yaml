  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: pl
  text: Większość tłumu[a] rozłożyła na drodze swoje szaty[b], inni zaś ścinali gałęzie z drzew i rozkładali je na drodze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „większa część tłumu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „płaszcze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Większość tłumu
  rationale: πλεῖστος z rzeczownikiem zbiorowym oznacza tu większość, czyli większą część tłumu. Polskie sformułowanie jest naturalne i nie dodaje osobnego odpowiednika δέ tam, gdzie tok zdania nie wymaga wyraźnego spójnika.
- source_word: ἔστρωσαν
  choice: rozłożyła
  rationale: Aoryst wskazuje na dokonane działanie; liczba pojedyncza jest w polszczyźnie zgodna z podmiotem „większość”.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: swoje płaszcze
  rationale: Zaimek „swoje” naturalnie oddaje ἑαυτῶν, a „płaszcze” jasno wskazują na wierzchnie okrycia kładzione na drodze.
- source_word: ἐν τῇ ὁδῷ
  choice: na drodze
  rationale: To idiomatyczny polski opis położenia czegoś na powierzchni drogi; kontekst jest przestrzenny, nie metaforyczny.
- source_word: ἄλλοι δὲ
  choice: inni zaś
  rationale: „Zaś” zaznacza przejście do drugiej grupy w tłumie bez wprowadzania mocnego przeciwstawienia.
- source_word: ἔκοπτον
  choice: ścinali
  rationale: Czasownik niedokonany zachowuje ciągły, rozwijający się charakter czynności wyrażony greckim imperfectum.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: gałęzie z drzew
  rationale: Bezpośrednie i naturalne oddanie przedmiotu oraz jego pochodzenia.
- source_word: καὶ ἐστρώννυον
  choice: i rozkładali je
  rationale: Forma niedokonana oddaje trwającą czynność; dodane „je” jednoznacznie odnosi się do gałęzi.
