id: MAT.21.21
reference: Matthew 21:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: pl
  text: 'Jezus zaś odpowiedział im: „Zaprawdę mówię wam: Jeśli będziecie mieli wiarę i nie zwątpicie[a], nie tylko uczynicie to, co stało się z drzewem figowym, lecz nawet jeśli powiecie tej górze: «Podnieś się i rzuć się w morze», stanie się”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „nie zawahacie się” lub „nie będziecie wewnętrznie rozdwojeni”.'
    reason: Alternatywne odcienie znaczeniowe μὴ διακριθῆτε, które może wskazywać na zwątpienie, wahanie lub wewnętrzne rozdarcie.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jezus zaś odpowiedział im
  rationale: Naturalna polska konstrukcja zachowuje responsywny sens imiesłowu ἀποκριθείς oraz łagodne przejście sygnalizowane przez δέ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Utrwalona, godna i zrozumiała formuła oddająca uroczysty, autorytatywny charakter wypowiedzi.
- source_word: ἐὰν ἔχητε πίστιν
  choice: Jeśli będziecie mieli wiarę
  rationale: W tym kontekście πίστις oznacza pełne ufności poleganie na Bogu; „wiara” zachowuje podstawowy termin tekstu.
- source_word: μὴ διακριθῆτε
  choice: nie zwątpicie
  rationale: Czasownik opisuje wewnętrzne wahanie lub powątpiewanie. „Nie zwątpicie” brzmi naturalnie i pasuje składniowo do warunku; szerszy odcień zachowano w przypisie.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: nie tylko uczynicie to, co stało się z drzewem figowym
  rationale: Greckie wyrażenie jest eliptyczne i odsyła do bezpośrednio poprzedzającego wydarzenia z figowcem. Przekład uzupełnia elipsę bez przesądzania mechanizmu działania.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: lecz nawet jeśli powiecie tej górze
  rationale: „Nawet jeśli” oddaje wzmacniające καὶ ἐάν, a „tej górze” zachowuje wskazujący charakter τούτῳ.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Podnieś się i rzuć się w morze
  rationale: Polskie formy zwrotne naturalnie oddają greckie imperatywy strony biernej oraz zachowują fizyczny i obrazowy charakter polecenia.
- source_word: γενήσεται
  choice: stanie się
  rationale: Zwięzłe, współczesne sformułowanie wiernie wyraża, że nakazane wydarzenie dojdzie do skutku.
theological_decisions:
- issue: Znaczenie πίστις w wypowiedzi o niezwykłym działaniu
  choice: wiara
  alternative: ufność; wierność
  rationale: Kontekst wskazuje na ufne poleganie na Bogu, nie zaś przede wszystkim na cechę wierności. „Wiara” zachowuje zarazem zwyczajowy termin teologiczny bez dopowiadania jego przedmiotu.
- issue: Charakter obrazu przeniesienia góry
  choice: Zachowanie dosłownego, obrazowego brzmienia bez rozstrzygania sposobu interpretacji
  alternative: Wyłącznie dosłowna obietnica cudu; wyłącznie metafora pokonywania trudności
  rationale: Tekst posługuje się mocnym obrazem i sam nie objaśnia, czy należy go ograniczyć do jednego z tych odczytań. Przekład zachowuje tę napiętość.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano uroczyste „Zaprawdę”, lecz uniknięto archaizmów. Obraz góry pozostaje wyrazisty i interpretacyjnie otwarty.
