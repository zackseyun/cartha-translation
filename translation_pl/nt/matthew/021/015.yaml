id: MAT.21.15
reference: Matthew 21:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: pl
  text: 'Kiedy jednak arcykapłani i uczeni w Piśmie zobaczyli niezwykłe czyny, których dokonał, oraz dzieci wołające w świątyni[a]: „Hosanna[b] Synowi Dawida!”, oburzyli się.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ἱερόν oznacza cały kompleks lub teren świątynny, a nie wyłącznie wewnętrzne sanktuarium.
    reason: cultural_note
  - marker: b
    text: „Hosanna” to wywodząca się z hebrajskiego aklamacja znacząca pierwotnie mniej więcej „Ratuj, prosimy” lub „Zbaw teraz”; w tym okresie służyła również jako okrzyk chwały.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: Kiedy jednak ... zobaczyli
  rationale: Imiesłów aorystu określa okoliczność czasową głównego czasownika, a δέ sygnalizuje łagodny kontrast z poprzednią sceną.
- source_word: οἱ ἀρχιερεῖς
  choice: arcykapłani
  rationale: Liczba mnoga oznacza czołowych przedstawicieli władz kapłańskich, a nie kilku urzędujących najwyższych kapłanów.
- source_word: οἱ γραμματεῖς
  choice: uczeni w Piśmie
  rationale: Naturalne i utrwalone polskie określenie specjalistów od Pisma i Prawa; unika mylącego współczesnego znaczenia słowa „pisarze”.
- source_word: τὰ θαυμάσια ἃ ἐποίησεν
  choice: niezwykłe czyny, których dokonał
  rationale: Oddaje rzeczownikowe użycie przymiotnika jako godne podziwu dokonania, nie zawężając go bez potrzeby wyłącznie do cudów.
- source_word: τοὺς παῖδας
  choice: dzieci
  rationale: W tym kontekście najbardziej prawdopodobne znaczenie; „słudzy” nie pasuje do sceny, a „chłopcy” niepotrzebnie zawęża sens.
- source_word: τοὺς κράζοντας ... καὶ λέγοντας
  choice: 'wołające ...:'
  rationale: Oddaje donośną publiczną aklamację, a dwukropek naturalnie wprowadza jej treść bez konieczności powtarzania czasownika „mówić”.
- source_word: ἐν τῷ ἱερῷ
  choice: w świątyni
  rationale: Naturalne polskie sformułowanie; zakres greckiego ἱερόν obejmujący cały kompleks świątynny doprecyzowano w przypisie.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Zachowano utrwaloną, hebrajskiego pochodzenia aklamację, która łączy pierwotną prośbę o ratunek z funkcją okrzyku chwały.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Synowi Dawida
  rationale: Celownik po aklamacji można naturalnie zachować po polsku; dosłowne brzmienie utrzymuje rozpoznawalny tytuł mesjański.
- source_word: ἠγανάκτησαν
  choice: oburzyli się
  rationale: Trafnie wyraża silne niezadowolenie i indignację przywódców wobec tego, co zobaczyli i usłyszeli.
theological_decisions:
- issue: Mesjańskie znaczenie wyrażenia „Syn Dawida”
  choice: Zachowano dosłowny tytuł „Syn Dawida”.
  alternative: potomek Dawida; dziedzic Dawida
  rationale: W Ewangelii Mateusza wyrażenie funkcjonuje jako rozpoznawalny tytuł mesjański; parafraza osłabiłaby jego wagę narracyjną i teologiczną.
- issue: Znaczenie aklamacji Ὡσαννά
  choice: W tekście głównym użyto formy „Hosanna”, a zakres znaczeniowy objaśniono w przypisie.
  alternative: Ratuj, prosimy; Zbaw teraz
  rationale: W tym miejscu słowo zachowuje echo prośby o wybawienie, lecz działa też jako ustalony okrzyk uwielbienia. Transliteracja nie rozstrzyga sztucznie tej dwoistości.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia zachowuje narastanie zdania greckiego i końcowe podkreślenie reakcji przywódców, pozostając przy tym naturalna po polsku. Markery przypisów umieszczono bezpośrednio przy wyrażeniach, które objaśniają.
