source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: pl
  text: 'I powiedzieli do niego: „Słyszysz, co oni mówią?”. Jezus zaś mówi im: „Tak. Czy nigdy nie czytaliście: «Z ust niemowląt i dzieci karmionych piersią przygotowałeś uwielbienie»?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jezus cytuje Ps 8,3 według greckiej tradycji tekstu Pisma. Tekst hebrajski bywa tłumaczony: „Z ust niemowląt i dzieci karmionych piersią ustanowiłeś moc”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Słyszysz
  rationale: Czas teraźniejszy w pytaniu bezpośrednim; naturalnie zachowuje wyzwanie skierowane do Jezusa.
- source_word: τί οὗτοι λέγουσιν
  choice: co oni mówią
  rationale: Naturalny polski odpowiednik oddający czynność trwającą; zaimek „oni” zachowuje dystans obecny w οὗτοι bez dodawania rzeczownika.
- source_word: λέγει
  choice: odpowiedział
  rationale: Choć greka używa praesens historicum („mówi”), polska narracja naturalniej stosuje czas przeszły; kontekst wskazuje, że jest to odpowiedź.
- source_word: Ναί
  choice: Tak
  rationale: Prosta, bezpośrednia odpowiedź twierdząca.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Czy nigdy nie czytaliście
  rationale: Zachowuje retoryczny i lekko karcący charakter pytania o znajomość Pisma.
- source_word: Ἐκ στόματος
  choice: Z ust
  rationale: Zwięzły i naturalny polski odpowiednik frazy przyimkowej.
- source_word: νηπίων
  choice: niemowląt
  rationale: Określa bardzo małe dzieci i pozostaje odrębne od następującego imiesłowu θηλαζόντων.
- source_word: θηλαζόντων
  choice: dzieci karmionych piersią
  rationale: Jasno i współcześnie oddaje dzieci znajdujące się jeszcze w okresie karmienia piersią.
- source_word: κατηρτίσω
  choice: przygotowałeś sobie
  rationale: „Przygotowałeś” oddaje sens greckiego czasownika w cytacie; „sobie” naturalnie wskazuje adresata chwały, choć nie jest osobnym wyrazem w grece.
- source_word: αἶνον
  choice: chwałę
  rationale: W kontekście wypowiedzi dzieci chodzi o pochwałę oddawaną Bogu; „chwała” jest naturalnym polskim odpowiednikiem kultowego αἶνος.
theological_decisions:
- issue: Brzmienie cytatu z Psalmu 8,3 (według numeracji hebrajskiej)
  choice: 'W tekście głównym zachować greckie brzmienie Mateusza: „przygotowałeś sobie chwałę”'
  alternative: 'Hebrajski tekst Psalmu bywa tłumaczony: „ustanowiłeś moc”'
  rationale: Ewangelia cytuje grecką tradycję tekstu Pisma. Nie należy harmonizować słów Mateusza z hebrajskim brzmieniem Psalmu; różnicę zachowano w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Dialog brzmi naturalnie po polsku, a cytat zachowuje podniosłość i obrazowość tekstu źródłowego.
