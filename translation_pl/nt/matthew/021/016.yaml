    rationale: Tekst grecki ma λέγει, historyczny czas teraźniejszy. Polski historyczny teraźniejszy jest tu naturalny i lepiej zachowuje formę oraz żywość narracji źródłowej.
  - severity: medium
    issue: „przygotowałeś sobie chwałę” dla κατηρτίσω αἶνον
    rationale: αἶνος oznacza „pochwałę, uwielbienie”, a nie „chwałę” w sensie δόξα. Zaimek „sobie” nie jest wyrażony w grece; choć może wynikać z kontekstu, nie powinien być dodawany do cytatu.
