id: MAT.21.31
reference: Matthew 21:31
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: pl
  text: '„Który z tych dwóch spełnił wolę ojca?” Odpowiedzieli: „Pierwszy”. Jezus powiedział im: „Zaprawdę mówię wam: poborcy podatków i prostytutki idą przed wami[a] do królestwa Bożego”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wchodzą przed wami do królestwa Bożego”. Grecki czasownik znaczy dosłownie „iść przed kimś” lub „wyprzedzać”; podkreśla pierwszeństwo, nie przesądzając sam przez się o ostatecznym wykluczeniu adresatów.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Który z tych dwóch
  rationale: Naturalne polskie pytanie zachowujące cząstkowy sens konstrukcji ἐκ τῶν δύο.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: spełnił wolę ojca
  rationale: „Spełnić czyjąś wolę” jest naturalnym i godnym polskim odpowiednikiem, zachowującym konkretne znaczenie ποιέω; „ojciec” odnosi się tu do postaci z przypowieści.
- source_word: Ὁ πρῶτος
  choice: Pierwszy
  rationale: Zwięzła, naturalna odpowiedź odpowiadająca eliptycznej formie greckiej.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Utrwalona, zrozumiała i uroczysta polska formuła oddająca emfatyczne Ἀμήν.
- source_word: τελῶναι
  choice: poborcy podatków
  rationale: Współczesne, precyzyjne określenie osób pobierających podatki i opłaty; unika zawężenia dzisiejszego słowa „celnicy” do służby granicznej.
- source_word: πόρναι
  choice: prostytutki
  rationale: Bezpośredni i precyzyjny współczesny odpowiednik, bez archaizacji ani rozszerzania znaczenia na ogólną niemoralność seksualną.
- source_word: προάγουσιν ὑμᾶς
  choice: idą przed wami
  rationale: Zachowuje obraz ruchu i pierwszeństwa zawarty w προάγω, nie przesądzając, że adresaci zostają ostatecznie wykluczeni.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: do królestwa Bożego
  rationale: Naturalny polski odpowiednik zachowujący kierunkowy sens εἰς oraz pełne wyrażenie teologiczne.
theological_decisions:
- issue: Znaczenie προάγουσιν ὑμᾶς w odniesieniu do wejścia do królestwa
  choice: idą przed wami do królestwa Bożego
  alternative: wchodzą przed wami do królestwa Bożego
  rationale: Wybrany przekład zachowuje metaforę poprzedzania i nacisk na pierwszeństwo, ale nie wzmacnia wypowiedzi do jednoznacznego stwierdzenia o ostatecznym wykluczeniu przywódców religijnych.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano uroczystą formułę „Zaprawdę mówię wam”, natomiast nazwy grup społecznych oddano dzisiejszym, jednoznacznym słownictwem.
