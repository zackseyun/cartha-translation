  source_fidelity: 'Znaczenie zostało zasadniczo oddane wiernie: uczniowie widzą skutek wydarzenia, są zdumieni i pytają o natychmiastowe uschnięcie drzewa figowego. „Natychmiast” trafnie odpowiada παραχρῆμα, a „uschło” jest naturalnym odpowiednikiem ἐξηράνθη w odniesieniu do drzewa.'
  naturalness: Zdanie jest naturalne we współczesnej polszczyźnie. Jednak „i mówili” sugeruje czynność rozciągniętą w czasie i mniej dokładnie oddaje grecki imiesłów λέγοντες wprowadzający bezpośrednią wypowiedź. „Mówiąc” zachowuje zwięzłą relację imiesłowową i brzmi naturalnie w tym rejestrze.
  terminology: „Uczniowie”, „drzewo figowe”, „zdumieli się” i „uschło” są właściwe, współczesne i rejestrowo stosowne. Nie występują terminy teologiczne ani nazwy własne wymagające dodatkowej kontroli.
