    rationale: Grecki imiesłów teraźniejszy funkcjonuje tu jako wprowadzenie do cytowanej reakcji. Polski czas przeszły niedokonany „mówili” może niepotrzebnie sugerować trwanie lub powtarzalność; „mówiąc” dokładniej zachowuje funkcję składniową bez zmiany sensu.
