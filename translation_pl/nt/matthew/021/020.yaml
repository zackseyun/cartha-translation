source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: pl
  text: 'Gdy uczniowie to zobaczyli, zdumieli się, mówiąc: „Jak to się stało, że drzewo figowe natychmiast uschło?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Gdy ... zobaczyli
  rationale: Aorystyczny imiesłów oddano jako naturalne w języku polskim zdanie czasowe. Zaimek „to” wynika z kontekstu i odnosi się do tego, co stało się z drzewem figowym.
- source_word: ἐθαύμασαν
  choice: zdumieli się
  rationale: Czasownik wyraża silne zdziwienie lub podziw; „zdumieli się” zachowuje jego intensywność i godny, współczesny rejestr.
- source_word: λέγοντες
  choice: i mówili
  rationale: Imiesłów wprowadzający wypowiedź oddano współrzędnie, zgodnie z naturalną polską składnią, bez zmiany treści.
- source_word: Πῶς
  choice: Jak to się stało, że
  rationale: Rozwinięcie idiomatycznie wyraża pytanie o sposób lub przebieg zdarzenia, nie przesądzając o jego przyczynie.
- source_word: παραχρῆμα
  choice: natychmiast
  rationale: Słowo oznacza „natychmiast”, „od razu”; wybrana forma bezpośrednio zachowuje jego wyraźny sens czasowy.
- source_word: ἐξηράνθη
  choice: uschło
  rationale: W odniesieniu do drzewa polskie „uschło” naturalnie oddaje grecki aoryst bierny użyty o wyschnięciu lub zwiędnięciu rośliny.
- source_word: ἡ συκῆ
  choice: drzewo figowe
  rationale: Jednoznaczna, powszechnie zrozumiała nazwa drzewa; forma „figowiec” byłaby krótszą alternatywą.
theological_decisions: []
translation_notes:
  register: Współczesny, naturalny i godny język narracyjny. Zachowano zdumienie uczniów oraz nacisk na natychmiastowość zdarzenia; uniknięto archaicznego szyku i słownictwa.
