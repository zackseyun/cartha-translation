  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: pl
  text: Wzięli go, wyrzucili z winnicy i zabili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Schwycili
  rationale: Imiesłów aorystu od λαμβάνω w tym wrogim kontekście opisuje pochwycenie syna. „Schwycili” jest naturalne po polsku i oddaje czynność poprzedzającą kolejne działania, nie rozbudowując zdania do formalnego „pochwyciwszy”.
- source_word: ἐξέβαλον
  choice: wyrzucili
  rationale: ἐκβάλλω wraz z ἔξω τοῦ ἀμπελῶνος oznacza fizyczne usunięcie na zewnątrz. „Wyrzucili z winnicy” jest współczesnym, bezpośrednim odpowiednikiem.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: z winnicy
  rationale: W połączeniu z „wyrzucili” polska konstrukcja „z winnicy” naturalnie wyraża ruch poza jej obręb.
- source_word: ἀμπελῶνος
  choice: winnicy
  rationale: ἀμπελών jednoznacznie oznacza winnicę i jest podstawowym polskim odpowiednikiem w kontekście przypowieści.
- source_word: ἀπέκτειναν
  choice: zabili
  rationale: ἀποκτείνω oznacza „zabić” lub „pozbawić życia”. „Zabili” jest bezpośrednie i nie dodaje prawnej ani moralnej kwalifikacji zawartej w słowach „stracili” czy „zamordowali”.
theological_decisions:
- issue: Kolejność wyrzucenia syna z winnicy i zabicia go względem relacji paralelnych
  choice: 'Zachować kolejność Mateusza: najpierw wyrzucili go z winnicy, potem zabili.'
  alternative: Uzgodnić opis z Markiem lub Łukaszem, sugerując, że najpierw go zabili, a potem wyrzucili.
  rationale: 'Grecka składnia podaje wyraźną sekwencję: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. Przekład zachowuje własne brzmienie relacji Mateusza i nie harmonizuje jej z tekstami paralelnymi.'
translation_notes:
  register: Język współczesny, prosty i godny. Trzy skoordynowane czasowniki zachowują zwięzłość oraz gwałtowny rytm greckiego zdania. Nie dodano przypisu, ponieważ „Schwycili go, wyrzucili z winnicy” nie niesie rzeczywistej alternatywy tekstowej ani istotnej niejasności wymagającej objaśnienia.
