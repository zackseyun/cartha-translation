source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: pl
  text: 'Dlatego mówię wam: Królestwo Boże zostanie wam odebrane i dane narodowi[a], który wydaje owoce Królestwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ludowi”. Greckie ἔθνος może oznaczać naród albo lud, czyli zbiorowość; tutaj określa zbiorowego odbiorcę przez wydawanie owoców, nie precyzując bliżej, o kogo chodzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dlatego
  rationale: Zwięźle i naturalnie wyraża wniosek wynikający z poprzedzającej przypowieści i cytatu.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Zachowuje bezpośrednią formułę wypowiedzi oraz osobiste zwrócenie się do adresatów.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: zostanie wam odebrane
  rationale: Naturalna polska konstrukcja oddająca przyszłą stronę bierną oraz odebranie czegoś dotychczasowym posiadaczom.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Królestwo Boże
  rationale: Utrwalony i trafny odpowiednik, który nie zawęża znaczenia wyłącznie do panowania ani wyłącznie do sfery lub wspólnoty.
- source_word: δοθήσεται
  choice: i dane
  rationale: Zachowuje skoordynowaną stronę bierną; elipsa powtórzonego podmiotu jest w polszczyźnie naturalna.
- source_word: ἔθνει
  choice: narodowi
  rationale: Bezpośredni odpowiednik liczby pojedynczej, pozostawiający otwartą dokładną tożsamość zbiorowego odbiorcy; alternatywę „ludowi” podano w przypisie.
- source_word: ποιοῦντι
  choice: który wydaje
  rationale: W połączeniu z owocami naturalnie oddaje trwającą, znamienną czynność opisywanej zbiorowości.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: jego owoce
  rationale: Zachowuje liczbę mnogą i odnosi zaimek do Królestwa Bożego, zgodnie z najbardziej naturalnym związkiem gramatycznym.
theological_decisions:
- issue: Tożsamość ἔθνος
  choice: naród, bez utożsamienia go w tekście głównym z Kościołem, poganami lub odnowionym Izraelem
  alternative: lud; poganie; wspólnota uczniów lub odnowiony lud Boży
  rationale: Greka wskazuje na zbiorowego odbiorcę rozpoznawanego po owocach, lecz sama nie rozstrzyga jego późniejszej identyfikacji teologicznej.
- issue: Zakres znaczeniowy „Królestwa Bożego”
  choice: zachowano tradycyjne i szerokie określenie „Królestwo Boże”
  alternative: panowanie Boga; przywileje Królestwa; przynależność do ludu Bożego
  rationale: Parafraza zawęziłaby wielowymiarowe βασιλεία i doprecyzowałaby charakter sądu ponad to, co mówi tekst.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Szyk „zostanie wam odebrane” brzmi naturalnie, a jednocześnie zachowuje nacisk na adresatów. Wielka litera w „Królestwo Boże” odpowiada powszechnej polskiej konwencji biblijnej.
