id: MAT.14.25
reference: Matthew 14:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: pl
  text: A podczas czwartej straży nocnej przyszedł do nich[b], idąc po morzu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie także: „idąc na morzu”. Niekiedy wyrażenie to rozumiano jako „idąc brzegiem morza”, jednak kontekst zdecydowanie wskazuje na poruszanie się po powierzchni wody.'
    reason: alternative_reading
  - marker: b
    text: „Czwarta straż nocna” była ostatnią częścią nocy, mniej więcej od godziny 3.00 do 6.00 według rzymskiego podziału czasu.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: podczas czwartej straży nocnej
  rationale: Celownik pełni funkcję czasową. Wyrażenie zachowuje historyczny podział nocy na straże, a zarazem brzmi naturalnie po polsku.
- source_word: δὲ
  choice: A
  rationale: Lekki spójnik narracyjny, który płynnie rozwija opowiadanie bez nadawania mu silnego znaczenia przeciwstawnego.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: przyszedł do nich
  rationale: Połączenie czasownika ruchu z πρός i biernikiem wskazuje na zbliżenie się do uczniów; „przyszedł do nich” jest bezpośrednim i idiomatycznym odpowiednikiem.
- source_word: περιπατῶν
  choice: idąc
  rationale: Imiesłów wyraża czynność równoczesną z przyjściem. „Idąc” jest w tym kontekście naturalniejsze po polsku niż bardziej dosłowne „chodząc”.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: po morzu
  rationale: W połączeniu z czasownikiem ruchu wyrażenie opisuje poruszanie się po powierzchni wody. „Po morzu” naturalnie oddaje ten sens i zachowuje rzeczownik θάλασσα jako „morze”.
theological_decisions:
- issue: Cudowny charakter poruszania się Jezusa po wodzie
  choice: idąc po morzu
  alternative: idąc brzegiem morza
  rationale: Składnia i bezpośredni kontekst zdecydowanie wskazują na ruch po powierzchni wody. Przekład zachowuje zwykły sens greckiego opisu, nie osłabiając ani nie rozbudowując jego cudownego charakteru.
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano historyczne określenie „czwarta straż nocna”, objaśnione w przypisie, oraz tradycyjne biblijne „morze”, mimo że chodzi o Jezioro Galilejskie.
