  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: pl
  text: 'I powiedział swoim sługom: „To jest Jan Chrzciciel. On został wskrzeszony z martwych i dlatego te moce[a] działają w nim”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „cudowne moce”; bardziej interpretacyjnie: „cuda”. Grecki tekst mówi dosłownie o „mocach” (αἱ δυνάμεις), czyli o nadprzyrodzonych mocach ujawniających się w potężnych czynach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: sługom
  rationale: W tym kontekście παῖς oznacza członka służby lub otoczenia Heroda. „Sługom” naturalnie oddaje relację społeczną, nie przesądzając dokładnej funkcji ani rangi.
- source_word: ὁ βαπτιστής
  choice: Chrzciciel
  rationale: „Jan Chrzciciel” jest utrwalonym i trafnym polskim odpowiednikiem tego przydomka, wskazującym na działalność Jana polegającą na chrzczeniu.
- source_word: ἠγέρθη
  choice: został wskrzeszony
  rationale: Forma grecka jest bierna. Polski odpowiednik zachowuje tę stronę, nie sugerując, że Jan sam powstał z martwych.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: z martwych
  rationale: To naturalny i utrwalony polski odpowiednik wyrażenia oznaczającego powrót spośród umarłych.
- source_word: διὰ τοῦτο
  choice: dlatego
  rationale: Zwięźle i naturalnie zachowuje związek przyczynowy wyrażony w grece.
- source_word: αἱ δυνάμεις
  choice: te moce
  rationale: Oddaje rzeczownik „moce” bez sprowadzania go od razu do skutków ich działania, czyli cudów. „Te” wskazuje na moce wiązane w kontekście z doniesieniami o niezwykłych czynach Jezusa.
- source_word: ἐνεργοῦσιν
  choice: działają
  rationale: Naturalny polski czasownik wyrażający czynną, skuteczną aktywność.
- source_word: ἐν αὐτῷ
  choice: w nim
  rationale: Zachowuje najbardziej bezpośredni sens przyimka ἐν i nie zastępuje go bardziej interpretacyjnym „przez niego”.
theological_decisions:
- issue: Charakter powrotu Jana do życia
  choice: został wskrzeszony z martwych
  alternative: powstał z martwych
  rationale: Strona bierna odpowiada greckiemu ἠγέρθη i zachowuje gramatyczny kształt wypowiedzi Heroda bez dokładania twierdzenia, że Jan wskrzesił się sam.
- issue: Znaczenie δυνάμεις w tym kontekście
  choice: działają w nim te moce
  alternative: dokonują się przez niego cuda
  rationale: Grecki rzeczownik może odnosić się do nadprzyrodzonej mocy ujawniającej się w potężnych czynach. Tekst główny zachowuje szersze „moce”, a przypis objaśnia sens, nie rozstrzygając go nadmiernie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „działają w nim te moce” zachowuje nacisk greckiego zdania i jego nieco niezwykłe ujęcie, a zarazem pozostaje zrozumiały po polsku.
