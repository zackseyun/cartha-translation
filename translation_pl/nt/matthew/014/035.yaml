lexical_decisions:
- source_word: ἐπιγνόντες
  choice: rozpoznali
  rationale: Imiesłów aorystu od ἐπιγινώσκω oznacza tutaj rozpoznanie Jezusa, zgodnie z kontekstem narracyjnym.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: mężczyźni z tamtego miejsca
  rationale: ἀνήρ oznacza konkretnie mężczyznę, dlatego zachowano odniesienie do płci; τόπος oddano naturalnie jako „miejsce”.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: rozesłali wiadomość po całej tamtejszej okolicy
  rationale: W grece dopełnienie czasownika „posłali” pozostaje niewyrażone. Polski wymaga tu naturalnego doprecyzowania; „wiadomość” przekazuje domyślny sens komunikacyjny, a przypis zachowuje formalną nieokreśloność oryginału.
- source_word: προσήνεγκαν αὐτῷ
  choice: przyprowadzili do Niego
  rationale: W odniesieniu do osób προσφέρω oznacza tutaj doprowadzenie ich do Jezusa, nie zaś złożenie ofiary.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: wszystkich chorych
  rationale: κακῶς ἔχειν jest idiomem oznaczającym bycie chorym lub niedomaganie; „chorzy” jest zwięzłym i naturalnym polskim odpowiednikiem.
