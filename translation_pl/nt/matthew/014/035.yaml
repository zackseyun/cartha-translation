  naturalness: „Mężczyźni z tamtego miejsca” jest zrozumiałe, lecz w nowoczesnej polszczyźnie brzmi mniej naturalnie niż „mężczyźni z tamtej miejscowości”. Konstrukcja „posłali do całej tamtejszej okolicy” pozostaje czytelna, a dzięki przypisowi uczciwie sygnalizuje elipsę greckiego tekstu.
  terminology: „Rozpoznali”, „mężczyźni”, „przyprowadzili do Niego” oraz „wszyscy chorzy” trafnie oddają odpowiednio ἐπιγνόντες, ἄνδρες, προσήνεγκαν αὐτῷ i πάντας τοὺς κακῶς ἔχοντας. Nie ma tu problemu terminologii teologicznej.
