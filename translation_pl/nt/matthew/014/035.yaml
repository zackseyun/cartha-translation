translation:
  language: pl
  text: Gdy mężczyźni z tamtej miejscowości rozpoznali Go, posłali do całej tamtejszej okolicy[a] i przyprowadzili do Niego wszystkich chorych[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „posłali do całej tamtejszej okolicy”; greka nie podaje, co lub kogo posłali — mogła to być wiadomość albo wysłannicy.'
