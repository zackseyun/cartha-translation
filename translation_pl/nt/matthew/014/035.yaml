- from: Gdy mężczyźni z tamtego miejsca Go rozpoznali, rozesłali wiadomość po całej tamtejszej okolicy[a] i przyprowadzili do Niego wszystkich chorych[b].
  to: Gdy mężczyźni z tamtej miejscowości rozpoznali Go, posłali do całej tamtejszej okolicy[a] i przyprowadzili do Niego wszystkich chorych[b].
  rationale: Usunięto „wiadomość”, aby nie dodawać elementu niewyrażonego w tekście greckim, i zachowano tę elipsę z wyjaśnieniem w przypisie. Zmieniono „z tamtego miejsca” na naturalniejsze „z tamtej miejscowości”, bez utraty rozróżnienia płciowego zawartego w ἄνδρες. Pozostałe elementy są wierne źródłu i stylistycznie odpowiednie.
