id: MAT.14.11
reference: Matthew 14:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: pl
  text: Jego głowę przyniesiono na półmisku[a] i dano dziewczynie, a ona zaniosła ją swojej matce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „na tacy” albo „na dużym talerzu”. Greckie πίναξ oznacza półmisek, tacę lub naczynie do podawania potraw.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: przyniesiono
  rationale: Aoryst strony biernej od φέρω. Polska konstrukcja bezosobowa „przyniesiono” naturalnie oddaje bierny sens i tok narracji.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: jego głowę
  rationale: Bezpośredni odpowiednik greckiego wyrażenia, bez łagodzenia drastycznego obrazu.
- source_word: ἐπὶ πίνακι
  choice: na półmisku
  rationale: πίναξ oznacza naczynie lub tacę służącą do podawania; „półmisek” jest naturalnym polskim określeniem w tym kontekście.
- source_word: ἐδόθη
  choice: dano
  rationale: Aoryst strony biernej od δίδωμι. Bezpośrednio po formie „przyniesiono” naturalna polska konstrukcja bezosobowa zachowuje bierną perspektywę.
- source_word: τῷ κορασίῳ
  choice: dziewczynie
  rationale: κοράσιον oznacza dziewczynę lub młodą dziewczynę; samo „dziewczynie” jest jasne, współczesne i niearchaiczne.
- source_word: ἤνεγκεν
  choice: zaniosła ją
  rationale: Aoryst czynny od φέρω. „Zaniosła” naturalnie wyraża przeniesienie głowy do matki, a zaimek „ją” jasno wskazuje na głowę.
- source_word: τῇ μητρὶ αὐτῆς
  choice: swojej matce
  rationale: Zaimek zwrotny „swojej” jednoznacznie wskazuje, że chodzi o matkę dziewczyny, zgodnie z greckim αὐτῆς.
theological_decisions: []
