source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: pl
  text: 'Kiedy jednak uczniowie zobaczyli go idącego po jeziorze, przerazili się, mówiąc: „To zjawa[a]!” I ze strachu krzyknęli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „widmo” albo „duch”.'
    reason: Alternatywne odpowiedniki greckiego φάντασμα, zachowujące zakres znaczeniowy tego określenia.
lexical_decisions:
- source_word: δὲ
  choice: jednak
  rationale: Sygnalizuje łagodny kontrast lub zwrot narracyjny względem poprzedniego wersetu, bez nadmiernego wzmacniania przeciwstawienia.
- source_word: μαθηταὶ
  choice: uczniowie
  rationale: Rodzajnik określa znaną z kontekstu grupę; w języku polskim nie trzeba dodawać zaimka „jego”.
- source_word: ἰδόντες αὐτὸν
  choice: kiedy uczniowie zobaczyli go
  rationale: Imiesłów aorystu naturalnie oddaje zdanie czasowe, zachowujące następstwo wydarzeń.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: idącego po jeziorze
  rationale: W kontekście chodzi o Jezioro Galilejskie; „po jeziorze” naturalnie wyraża ruch po jego powierzchni i zachowuje obraz greckiego tekstu.
- source_word: ἐταράχθησαν
  choice: przerazili się
  rationale: Czasownik opisuje silne wzburzenie lub zatrwożenie; następujący okrzyk i krzyk ze strachu uzasadniają mocne, lecz naturalne polskie sformułowanie.
- source_word: λέγοντες
  choice: mówili
  rationale: Oddaje równoczesną wypowiedź uczniów bez utożsamiania jej z późniejszym czasownikiem oznaczającym głośny krzyk.
- source_word: Φάντασμά ἐστιν
  choice: To zjawa!
  rationale: „Zjawa” jasno wyraża przerażoną interpretację uczniów, nie przesądzając ontologicznie, czym była postrzegana postać.
- source_word: ἀπὸ τοῦ φόβου
  choice: ze strachu
  rationale: Naturalny polski zwrot wskazujący przyczynę lub źródło ich krzyku.
- source_word: ἔκραξαν
  choice: zaczęli krzyczeć
  rationale: Oddaje głośny, gwałtowny krzyk; konstrukcja jest naturalna po wcześniejszym „mówili” i przedstawia wybuch reakcji wywołanej strachem.
theological_decisions:
- issue: Charakter φάντασμα w okrzyku uczniów
  choice: „zjawa” w tekście głównym
  alternative: „widmo” lub „duch”
  rationale: Werset relacjonuje przestraszoną ocenę uczniów, a nie formułuje nauki o naturze duchów. „Zjawa” zachowuje tę perspektywę i nie rozstrzyga kwestii ontologicznej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zastosowano „jezioro”, zgodnie z naturalną polską nazwą Jeziora Galilejskiego, oraz zachowano powtórzoną reakcję słowną i krzyk uczniów.
