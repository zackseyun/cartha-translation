revisions:
- from: 'On zaś powiedział: „Przyjdź”. Wtedy Piotr wyszedł z łodzi, szedł po wodzie i zbliżał się do Jezusa.[a]'
  to: 'On zaś powiedział: „Przyjdź”. Piotr zszedł z łodzi, szedł po wodzie i poszedł ku Jezusowi.[a]'
  rationale: Zmiana „wyszedł” na „zszedł” oddaje καταβάς. Zamiast niedokonanego „zbliżał się” zastosowano „poszedł ku Jezusowi”, które zachowuje aorystyczny charakter zdarzenia oraz kierunkowy sens πρὸς, nie dodając informacji o osiągnięciu celu. Usunięto „Wtedy”, ponieważ δέ jest jedynie łagodnym łącznikiem i w tym miejscu nie wymaga polskiego odpowiednika.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:50Z'
review_pass:
  verdict: revise
  source_fidelity: Draft correctly identifies the direction expressed by πρός, but its imperfect forms „szedł” and especially „zbliżał się” weaken the two aorist narrative events περιεπάτησεν and ἦλθεν. „Wyszedł z łodzi” is possible but does not retain the downward movement of καταβάς as well as „zszedł z łodzi”.
  naturalness: The revised wording is modern, clear Polish narrative. „Ku Jezusowi” is a standard, appropriately elevated biblical-narrative expression and expresses direction without claiming that Peter reached Jesus.
  terminology: „Łódź”, „po wodzie”, and the direct imperative „Przyjdź” are accurate and natural. No doctrinal terminology is introduced.
  issues:
  - severity: medium
    issue: Aspect of the final movement is altered
    rationale: Greek ἦλθεν is an aorist event; „zbliżał się” presents an explicitly ongoing, uncompleted approach. Although πρός marks direction, the imperfect Polish form adds a durative nuance not encoded by the Greek.
  - severity: medium
    issue: Downward movement from the boat is underrepresented
    rationale: καταβάς means having come down. „Wyszedł z łodzi” communicates departure but not the descent; „zszedł z łodzi” retains the source action naturally.
  revised_text: 'On zaś powiedział: „Przyjdź”. Piotr zszedł z łodzi, szedł po wodzie i poszedł ku Jezusowi.[a]'
