  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: pl
  text: 'On zaś powiedział: „Przyjdź”. Piotr zszedł z łodzi, szedł po wodzie i poszedł ku Jezusowi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „i przyszedł do Jezusa”. Greckie wyrażenie wskazuje na ruch ku Jezusowi; samo w sobie nie musi przesądzać, że Piotr do Niego dotarł.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Przyjdź
  rationale: Aorystyczny tryb rozkazujący od ἔρχομαι stanowi krótkie, bezpośrednie wezwanie. „Przyjdź” naturalnie oddaje polecenie bez dodawania treści.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: wyszedł z łodzi
  rationale: Imiesłów καταβάς dosłownie wskazuje zejście w dół; w tym kontekście naturalne polskie „wyszedł z łodzi” jasno opisuje opuszczenie łodzi i zachowuje kolejność zdarzeń.
- source_word: πλοίου
  choice: łodzi
  rationale: W realiach galilejskich πλοῖον najnaturalniej oznacza łódź, nie duży statek.
- source_word: περιεπάτησεν
  choice: szedł
  rationale: Czasownik περιπατέω oznacza tutaj chodzenie lub kroczenie. „Szedł” dobrze łączy czynność z zaznaczonym kierunkiem i nie sugeruje błądzenia.
- source_word: ἐπὶ τὰ ὕδατα
  choice: po wodzie
  rationale: ἐπί z biernikiem opisuje ruch po powierzchni. Polski rzeczownik zbiorowy w liczbie pojedynczej brzmi w tym kontekście naturalnie.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: i zbliżał się do Jezusa
  rationale: Połączenie ἔρχομαι z πρός wyraża ruch w kierunku Jezusa, nie przesądzając, że Piotr już do Niego dotarł. „Zbliżał się do” zachowuje ten kierunkowy i niedokonany sens w naturalnej polszczyźnie.
- source_word: δὲ
  choice: zaś
  rationale: δέ jest łagodnym łącznikiem narracyjnym. „Zaś” zachowuje subtelne przejście między rozmówcami bez nadmiernego podkreślania przeciwstawienia.
theological_decisions:
- issue: Opis ruchu Piotra w kierunku Jezusa
  choice: i zbliżał się do Jezusa
  alternative: i przyszedł do Jezusa
  rationale: Greckie πρός wskazuje kierunek ruchu, lecz samo nie musi oznaczać osiągnięcia celu. Wybrany przekład zachowuje napięcie narracyjne i nie dopowiada, że Piotr w tym momencie dotarł do Jezusa.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna narracyjna. Zachowano zwięzłość wypowiedzi Jezusa oraz rozróżniono opuszczenie łodzi od ruchu po wodzie. Przypis sygnalizuje rzeczywistą możliwość składniowo-leksykalną bez rozstrzygania napięcia opowiadania.
