review_pass:
  verdict: revise
  source_fidelity: 'Główne elementy wersetu oddano trafnie, w tym natychmiastowość, silne ponaglenie, łódź, drugi brzeg i mnogie „tłumy”. Jednak „a On w tym czasie odprawi tłumy” zmienia relację wyrażoną przez ἕως οὗ ἀπολύσῃ: grecki tekst wyznacza punkt czasowy („aż/dopóki nie odprawi”), a nie jedynie czynność równoczesną.'
  naturalness: „I zaraz przynaglił uczniów” oraz „żeby wsiedli do łodzi” są naturalne w godnej, współczesnej polszczyźnie. Zachowanie konstrukcji „aż On odprawi tłumy” jest również jasne i bardziej bezpośrednio odpowiada składni oryginału.
  terminology: „Przynaglił”, „uczniów”, „łódź”, „drugi brzeg” i „odprawi tłumy” są trafne. Zapis „Nim” i „On” respektuje przyjętą w projekcie konwencję biblijną, nie wpływając na znaczenie.
  issues:
  - severity: medium
    issue: Zastąpienie „aż/dopóki” przez „a On w tym czasie”.
    rationale: ἕως οὗ z aorystem w trybie łączącym oznacza przyszły względem głównej czynności punkt graniczny. Sformułowanie „w tym czasie” osłabia tę relację i wnosi akcent na równoczesność, którego tekst nie wyraża w taki sposób.
  - severity: low
    issue: Przypis objaśnia element, który powinien pozostać w tekście głównym.
    rationale: Ponieważ czasowe „aż” można oddać po polsku naturalnie i bez utraty płynności, nie ma potrzeby przenosić go do przypisu.
