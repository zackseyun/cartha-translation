  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: pl
  text: I zaraz przynaglił uczniów, aby wsiedli do łodzi i popłynęli przed Nim na drugi brzeg, aż On odprawi tłumy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: zaraz
  rationale: Naturalnie i zwięźle oddaje natychmiastowość oraz szybkie przejście narracji.
- source_word: ἠνάγκασεν
  choice: przynaglił
  rationale: Zachowuje sens silnego nakłonienia lub nalegania, nie sugerując bezpodstawnie fizycznego przymusu.
- source_word: τοὺς μαθητάς
  choice: uczniów
  rationale: Rodzajnik wskazuje na znaną grupę; polszczyzna nie wymaga dodania zaimka „swoich”.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: żeby wsiedli do łodzi
  rationale: Współczesny, idiomatyczny odpowiednik wejścia na pokład łodzi.
- source_word: προάγειν αὐτόν
  choice: popłynęli przed Nim
  rationale: W kontekście podróży łodzią naturalnie oddaje polecenie, by uczniowie wyruszyli wcześniej niż Jezus.
- source_word: εἰς τὸ πέραν
  choice: na drugi brzeg
  rationale: Utrwalony polski odpowiednik określenia przeciwległej strony jeziora.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: a On w tym czasie odprawi
  rationale: 'Oddaje przyszłą względem głównej czynności sytuację i naturalny sens czasowy: uczniowie mają płynąć naprzód, podczas gdy Jezus odprawia tłumy.'
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: odprawi tłumy
  rationale: Zwięźle zachowuje znaczenie odesłania zgromadzonych ludzi oraz gramatyczną liczbę mnogą.
theological_decisions: []
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. „Przynaglił” zachowuje siłę greckiego czasownika, a „popłynęli” doprecyzowuje ruch wynikający z kontekstu łodzi. Zaimek odnoszący się do Jezusa zapisano wielką literą zgodnie z powszechną polską konwencją biblijną.
