  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: pl
  text: A tych, którzy jedli, było około pięciu tysięcy mężczyzn, oprócz kobiet i dzieci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie licząc kobiet i dzieci”.'
    reason: Alternatywny, bardziej objaśniający sposób oddania χωρὶς z dopełniaczem.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: A tych, którzy jedli
  rationale: Imiesłów z rodzajnikiem ma funkcję rzeczownikową i oznacza uczestników posiłku. Konstrukcja „tych, którzy jedli” jest naturalna po polsku i nie doprecyzowuje niepotrzebnie aspektu. Spójnik δέ oddano lekkim narracyjnym „A”.
- source_word: ἦσαν
  choice: było
  rationale: Imperfectum czasownika εἰμί tworzy tu proste orzeczenie określające liczebność; bezosobowe „było” jest naturalne przy wyrażeniu liczbowym.
- source_word: ἄνδρες
  choice: mężczyzn
  rationale: ἀνήρ oznacza tu osoby płci męskiej, a nie ogólnie ludzi; rozróżnienie zostaje zachowane, ponieważ kobiety i dzieci wymieniono osobno.
- source_word: ὡσεὶ
  choice: około
  rationale: ὡσεί wskazuje na przybliżenie liczby; „około” jest jasnym i współczesnym odpowiednikiem.
- source_word: πεντακισχίλιοι
  choice: pięciu tysięcy
  rationale: Bezpośredni odpowiednik liczebnika, dostosowany do polskiej składni dopełniaczowej.
- source_word: χωρὶς
  choice: oprócz
  rationale: χωρίς z dopełniaczem wskazuje, że kobiety i dzieci nie zostały ujęte w podanej liczbie. „Oprócz” zachowuje zwięzłość oryginału; przypis podaje jednoznaczny wariant „nie licząc”.
- source_word: γυναικῶν
  choice: kobiet
  rationale: W kontekście liczenia zgromadzonych γυνή oznacza kobiety, nie żony.
- source_word: παιδίων
  choice: dzieci
  rationale: παιδίον oznacza dziecko; kontekst nie wymaga zawężenia do bardzo małych dzieci.
theological_decisions:
- issue: Określenie płci w opisie liczebności mieszanego tłumu
  choice: Oddać ἄνδρες jako „mężczyzn” i zachować osobne wymienienie kobiet i dzieci.
  alternative: „ludzi” lub „osób”
  rationale: Greka podaje liczbę mężczyzn, po czym wyraźnie zaznacza, że kobiety i dzieci nie są objęte tą liczbą. Uogólnienie do „ludzi” zatarłoby istotny szczegół tekstu.
translation_notes:
  register: Współczesny, godny i łatwo zrozumiały rejestr. Zdanie zachowuje zwięzłość greckiego opisu, sygnalizuje przejście narracyjne przez „A” i nie zaciera rozróżnienia między mężczyznami, kobietami i dziećmi.
