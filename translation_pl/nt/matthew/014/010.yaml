lexical_decisions:
- source_word: καὶ πέμψας
  choice: Posłał więc ludzi i
  rationale: Imiesłów aorystu πέμψας wskazuje na wcześniejsze wysłanie wykonawców polecenia. Naturalna polska koordynacja zachowuje kolejność czynności, a dopełnienie „ludzi” jasno oddaje domyślnych wysłanników bez sugerowania, że Herod osobiście dokonał egzekucji.
- source_word: ἀπεκεφάλισεν
  choice: ściął
  rationale: Czasownik oznacza pozbawienie głowy. Polski czasownik „ściąć” jest naturalnym i precyzyjnym określeniem egzekucji przez ścięcie; zgodnie z grecką składnią czyn przypisano podmiotowi, choć został wykonany za pośrednictwem wysłanych ludzi.
- source_word: τὸν Ἰωάννην
  choice: Jana
  rationale: Tekst podaje samo imię, a kontekst jednoznacznie wskazuje Jana Chrzciciela; nie dodano tytułu nieobecnego w tym wersecie.
- source_word: ἐν τῇ φυλακῇ
  choice: w więzieniu
  rationale: φυλακή oznacza tutaj miejsce uwięzienia. „W więzieniu” jest współczesnym, idiomatycznym polskim odpowiednikiem konkretnego miejsca wskazanego w grece.
- source_word: καὶ
  choice: więc
  rationale: Spójnik kontynuuje narrację i w tym kontekście łączy wykonanie wcześniejszej obietnicy z rozkazem. „Więc” brzmi naturalnie po polsku, nie zmieniając zasadniczego związku narracyjnego.
