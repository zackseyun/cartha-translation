    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Dlatego
  rationale: Spójnik wskazuje na wniosek lub skutek wynikający z poprzedniego zdarzenia; „dlatego” zachowuje tę zależność i brzmi naturalnie po polsku.
- source_word: μετὰ ὅρκου
  choice: pod przysięgą
  rationale: Wyrażenie określa uroczysty, zaprzysiężony charakter obietnicy; „pod przysięgą” jest naturalnym polskim odpowiednikiem.
- source_word: ὡμολόγησεν
  choice: obiecał
  rationale: W tym kontekście czasownik oznacza podjęcie stanowczego zobowiązania, nie zaś wyznanie; „obiecał” trafnie oddaje sens wraz z bezokolicznikiem δοῦναι.
- source_word: αὐτῇ
  choice: jej
  rationale: Celownik wskazuje dziewczynę jako adresatkę obietnicy.
- source_word: δοῦναι
  choice: dać
  rationale: Bezokolicznik wyraża treść zobowiązania i ma bezpośredni polski odpowiednik „dać”.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: wszystko, o co poprosi
  rationale: Zaimek względny z ἐάν i trybem łączącym tworzy nieokreślone zdanie względne dotyczące przyszłej, otwartej prośby. Polska konstrukcja zachowuje ten sens bez sztuczności.
