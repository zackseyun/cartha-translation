base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: pl
  text: 'Ci zaś, którzy byli w łodzi, oddali mu pokłon[a], mówiąc: „Prawdziwie jesteś Synem Bożym[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „oddali mu cześć” lub „padli przed nim”. Grecki czasownik może opisywać cześć wyrażoną uklęknięciem albo padnięciem na twarz; w tym kontekście gest ma wymiar oddania czci.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „Synem Boga”. W greckim wyrażeniu przed słowem „Bóg” nie ma rodzajnika, lecz w tym kontekście całość funkcjonuje jako tytuł, a nie oznacza jedynie „jakiegoś syna Boga”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ci zaś, którzy
  rationale: δέ jest łagodnym spójnikiem narracyjnym, a οἱ użyte rzeczownikowo wskazuje na osoby znajdujące się w łodzi. „Ci zaś, którzy” brzmi naturalnie i nie nadaje wypowiedzi zbyt silnego przeciwstawienia.
- source_word: ἐν τῷ πλοίῳ
  choice: byli w łodzi
  rationale: πλοῖον oznacza tu zwykłą łódź. Dodanie „byli” jest naturalnym polskim dopełnieniem konstrukcji określającej osoby.
- source_word: προσεκύνησαν αὐτῷ
  choice: oddali mu pokłon
  rationale: προσκυνέω może oznaczać uklęknięcie lub padnięcie przed kimś, złożenie hołdu albo oddanie czci. „Oddali mu pokłon” zachowuje gest i religijną wagę sceny, nie rozstrzygając ponad tekst wszystkich odcieni czasownika.
- source_word: λέγοντες
  choice: mówiąc
  rationale: Imiesłów współczesny wiernie i płynnie oddaje grecką formę imiesłowową, wprowadzając treść wyznania.
- source_word: Ἀληθῶς
  choice: Prawdziwie
  rationale: Wyraz oznacza uroczyste potwierdzenie prawdziwości. „Prawdziwie” zachowuje podniosły, wyznaniowy ton lepiej niż potoczne „naprawdę”.
- source_word: θεοῦ υἱὸς
  choice: Synem Bożym
  rationale: W orzeczniku wyrażenie ma w tym kontekście sens tytułu i nie musi mieć rodzajnika, aby było określone. Polska forma „Synem Bożym” jest naturalna i odpowiada sile tego wyznania.
- source_word: εἶ
  choice: jesteś
  rationale: Polski czasownik w drugiej osobie bezpośrednio i naturalnie oddaje greckie εἶ.
theological_decisions:
- issue: Znaczenie προσκυνέω w odniesieniu do Jezusa
  choice: oddali mu pokłon
  alternative: oddali mu cześć; padli przed nim
  rationale: Kontekst ukazania władzy Jezusa nad morzem oraz następujące wyznanie nadają czynności wymiar czci, ale sam czasownik obejmuje także fizyczny gest pokłonu. Wybrane sformułowanie zachowuje oba aspekty bez zawężenia znaczenia.
- issue: Określoność wyrażenia θεοῦ υἱὸς
  choice: Synem Bożym
  alternative: Synem Boga; synem Bożym
  rationale: Brak rodzajnika w grece nie narzuca znaczenia „jakimś synem Boga”. W tym orzecznikowym i wyznaniowym kontekście wyrażenie funkcjonuje jako tytuł; wielka litera sygnalizuje to w zgodzie ze współczesnym polskim zwyczajem biblijnym.
translation_notes:
  register: Współczesny, zrozumiały polski o godnym, lekko podniosłym tonie. Zachowano grecką konstrukcję imiesłowową oraz łagodne przejście narracyjne. Pisownia zaimka „mu” małą literą pozostaje neutralna redakcyjnie, a tytuł „Syn Boży” zapisano wielkimi literami zgodnie z utrwalonym użyciem.
