source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: pl
  text: A gdy odprawił tłumy, wszedł sam na górę, aby się modlić. Kiedy nastał wieczór, był tam sam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας
  choice: gdy odprawił
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą wejście na górę; konstrukcja czasowa brzmi naturalnie po polsku, a „odprawił” trafnie oddaje odesłanie zgromadzonych ludzi.
- source_word: τοὺς ὄχλους
  choice: tłumy
  rationale: Liczba mnoga została zachowana; „tłumy” to współczesny i naturalny odpowiednik określający zgromadzone grupy ludzi.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: wszedł na górę
  rationale: Wyrażenie oznacza ruch w górę ku obszarowi góry; polskie „wszedł na górę” jest idiomatyczne i zachowuje sens topograficzny.
- source_word: κατ’ ἰδίαν
  choice: sam
  rationale: Zwrot może znaczyć „osobno”, „na osobności” lub „sam”; w tym kontekście zwięzłe „sam” naturalnie wyraża oddalenie się od innych.
- source_word: προσεύξασθαι
  choice: aby się modlić
  rationale: Bezokolicznik wyraża cel wejścia na górę; konstrukcja z „aby” jasno oddaje tę funkcję.
- source_word: ὀψίας δὲ γενομένης
  choice: Kiedy nastał wieczór
  rationale: Genetivus absolutus określa okoliczność czasową; przekład zachowuje przejście do kolejnego momentu narracji.
- source_word: μόνος ἦν ἐκεῖ
  choice: był tam sam
  rationale: Szyk jest naturalny po polsku i zachowuje nacisk na samotność Jezusa.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Rozróżnienie między κατ’ ἰδίαν a μόνος oddano przez powtórzenie „sam”, które w polszczyźnie brzmi naturalnie i odzwierciedla powtórne podkreślenie odosobnienia w tekście greckim.
