id: MAT.14.14
reference: Matthew 14:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: pl
  text: A gdy wyszedł na brzeg[a], zobaczył wielki tłum. Zlitował się nad nimi i uzdrowił ich chorych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „gdy wyszedł” lub „wyszedłszy”. W tym kontekście chodzi najprawdopodobniej o wyjście z łodzi na brzeg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: gdy wyszedł na brzeg
  rationale: Imiesłów oznacza dosłownie „wyszedłszy” lub „gdy wyszedł”. W kontekście przybycia łodzią naturalne polskie sformułowanie „wyszedł na brzeg” jasno oddaje zamierzoną czynność, a przypis zachowuje dosłowniejszą możliwość.
- source_word: εἶδεν
  choice: zobaczył
  rationale: Zwykły odpowiednik aorystu od ὁράω; forma dokonana naturalnie pasuje do polskiej narracji.
- source_word: πολὺν ὄχλον
  choice: wielki tłum
  rationale: Oddaje zarówno rzeczownik ὄχλος („tłum”), jak i ilościową siłę πολύς. Jest naturalne, zwięzłe i godne stylistycznie.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: zlitował się nad nimi
  rationale: Polskie „zlitował się” idiomatycznie wyraża głębokie współczucie prowadzące do działania. Nie sugeruje jedynie przelotnego uczucia.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: W tym kontekście θεραπεύω oznacza przywrócenie zdrowia; „uzdrowił” jest standardowym i naturalnym odpowiednikiem.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: ich chorych
  rationale: Zwięźle zachowuje substantywizowany przymiotnik „chorzy” oraz zaimek αὐτῶν, bez niepotrzebnego rozwijania tekstu.
theological_decisions:
- issue: Sposób oddania emocjonalnej reakcji Jezusa
  choice: zlitował się nad nimi
  alternative: głęboko im współczuł / ogarnęło Go współczucie dla nich
  rationale: Wybrane sformułowanie zachowuje nacisk na miłosierną reakcję Jezusa, która prowadzi do uzdrawiania, bez wzmacniania lub doktrynalnego objaśniania tekstu.
translation_notes:
  register: Współczesny, jasny i godny polski język narracyjny. Podział na dwa zdania ułatwia odbiór bez zmiany relacji między kolejnymi czynnościami. Zaimek podmiotu pozostaje domyślny, zgodnie z naturalną polszczyzną.
