  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: pl
  text: A gdy wsiedli do łodzi[a], wiatr ucichł.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „gdy weszli na łódź”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Spójnik naturalnie kontynuuje tok opowiadania, bez dodawania silniejszego znaczenia czasowego.
- source_word: ἀναβάντων αὐτῶν
  choice: gdy wsiedli
  rationale: Konstrukcję genetivus absolutus oddano naturalnym polskim zdaniem czasowym. W połączeniu z łodzią czasownik ἀναβαίνω idiomatycznie oznacza wejście lub dostanie się do niej; „wsiedli” brzmi naturalnie po polsku.
- source_word: εἰς τὸ πλοῖον
  choice: do łodzi
  rationale: W kontekście Jeziora Galilejskiego πλοῖον oznacza łódź, nie duży statek.
- source_word: ἐκόπασεν
  choice: ucichł
  rationale: Czasownik κοπάζω opisuje ustanie lub osłabnięcie wiatru. „Ucichł” jest zwięzłe, naturalne i nie narzuca stopniowego przebiegu.
- source_word: ὁ ἄνεμος
  choice: wiatr
  rationale: Bezpośredni i naturalny polski odpowiednik; polszczyzna nie ma rodzajnika odpowiadającego greckiemu ὁ.
theological_decisions:
- issue: Narracyjna sugestia władzy Jezusa nad przyrodą
  choice: Przedstawić samo wydarzenie bez dopowiadania jego teologicznego znaczenia.
  alternative: Dodać sformułowanie wyraźnie podkreślające cudowną władzę Jezusa.
  rationale: Grecki tekst stwierdza, że po wejściu do łodzi wiatr ucichł. Znaczenie teologiczne wynika z kontekstu, lecz nie powinno być rozwijane w samym przekładzie.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. „Wsiedli do łodzi” jest bardziej naturalne po polsku niż formalnie bliższe „weszli do łodzi”; alternatywę zachowano w przypisie.
