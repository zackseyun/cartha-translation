  source_fidelity: Zwrot „na drugi brzeg” dopowiada „drugi”, którego w tym wersecie nie ma; διαπεράσαντες oznacza po prostu „przeprawiwszy się / po przeprawieniu się”. Pozostała część zasadniczo trafnie oddaje dotarcie na ląd w rejonie Genezaret oraz zachowuje nieco złożoną relację obu greckich wyrażeń celu.
