  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: pl
  text: A po przeprawieniu się przybyli na ląd w Genezaret[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na ląd, do Genezaret”. Grecki tekst łączy „na ląd” z „do Genezaret”, wskazując na dotarcie do lądu lub brzegu w okolicy Genezaret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: gdy przeprawili się na drugi brzeg
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą przybycie. Polski zwrot „przeprawić się na drugi brzeg” naturalnie oddaje przeprawę przez jezioro, choć sam rzeczownik „brzeg” jest dopowiedziany z kontekstu.
- source_word: ἦλθον
  choice: przybyli
  rationale: Naturalny polski odpowiednik czasownika ruchu ἔρχομαι w kontekście osiągnięcia celu podróży.
- source_word: ἐπὶ τὴν γῆν
  choice: na ląd
  rationale: Zachowuje dosłowny obraz dotarcia z wody na ziemię i brzmi naturalnie w kontekście podróży łodzią.
- source_word: εἰς Γεννησαρέτ
  choice: w Genezaret
  rationale: Przy połączeniu z „na ląd” wyrażenie wskazuje miejsce lub region, w którym dobito do lądu; polskie „w” naturalnie oddaje tę relację bez utożsamiania nazwy wyłącznie z punktem na brzegu.
- source_word: Γεννησαρέτ
  choice: Genezaret
  rationale: Utrwalona we współczesnej polszczyźnie biblijnej forma nazwy geograficznej.
