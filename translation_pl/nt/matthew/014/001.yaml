lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: W tym czasie
  rationale: Naturalny polski odpowiednik idiomatycznego określenia czasu, zachowujący jego prosty sens.
- source_word: ἤκουσεν
  choice: usłyszał
  rationale: Bezpośrednio oddaje aoryst czasownika ἀκούω, bez interpretacyjnego rozszerzenia typu „dowiedział się”.
- source_word: Ἡρῴδης
  choice: Herod
  rationale: Utrwalona polska forma imienia.
- source_word: ὁ τετραάρχης
  choice: tetrarcha
  rationale: Utrwalony historyczny tytuł urzędowy; zachowuje precyzję greckiego określenia.
- source_word: τὴν ἀκοὴν
  choice: wieści
  rationale: W tym kontekście ἀκοή oznacza to, co się słyszy, czyli wieść lub doniesienie. Liczba mnoga „wieści” brzmi naturalnie we współczesnej polszczyźnie.
- source_word: Ἰησοῦ
  choice: o Jezusie
  rationale: Naturalnie wyraża w języku polskim treść wieści wskazaną przez grecki dopełniacz.
