source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: pl
  text: Herod bowiem pojmał Jana[a], związał go i osadził w więzieniu z powodu Herodiady, żony Filipa, brata Heroda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Herod bowiem, pojmawszy Jana, związał go i osadził w więzieniu”.'
    reason: Alternatywa zachowująca dosłowniej imiesłowową formę κρατήσας oraz jej uprzedniość wobec czasowników głównych.
lexical_decisions:
- source_word: γὰρ
  choice: bowiem
  rationale: Zachowuje wyjaśniający związek tego zdania z poprzednim kontekstem i brzmi naturalnie w podniosłej, współczesnej polszczyźnie.
- source_word: κρατήσας
  choice: kazał schwytać
  rationale: Oddaje uprzednią względem kolejnych czynności akcję pojmania oraz jej urzędowo-przymusowy charakter w kontekście uwięzienia, bez sugerowania, że Herod osobiście dokonał zatrzymania.
- source_word: ἔδησεν
  choice: związał go
  rationale: Zachowuje konkretny sens czasownika δέω, nie precyzując, czy użyto sznurów, więzów czy łańcuchów.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: osadził w więzieniu
  rationale: Naturalny polski zwrot wyrażający umieszczenie kogoś w miejscu odosobnienia i pod strażą.
- source_word: διὰ Ἡρῳδιάδα
  choice: z powodu Herodiady
  rationale: διά z biernikiem wskazuje tu przyczynę lub powód działania.
- source_word: γυναῖκα
  choice: żony
  rationale: W tej konstrukcji relacyjnej γυνή oznacza żonę, nie ogólnie kobietę.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: swego brata Filipa
  rationale: Jasno wskazuje, że Filip był bratem Heroda, zachowując relację wyrażoną w greckiej apozycji.
theological_decisions:
- issue: Historyczno-moralna charakterystyka związku Herodiady z Filipem
  choice: Herodiada zostaje neutralnie określona jako żona brata Heroda, Filipa.
  alternative: żona jego brata Filipa, z dodanym określeniem sugerującym bezprawność związku
  rationale: Sam werset identyfikuje Herodiadę przez jej relację z Filipem, lecz nie wypowiada jeszcze osądu o bezprawności; ten pojawia się w następnym wersecie. Przekład nie powinien go antycypować.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk z „bowiem” zachowuje wyjaśniający charakter zdania; „osadził w więzieniu” jest naturalne i nie nadmiernie potoczne.
