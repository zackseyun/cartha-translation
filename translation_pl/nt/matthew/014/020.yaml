  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: pl
  text: Wszyscy jedli i najedli się, a zebrali dwanaście pełnych koszy pozostałych kawałków[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „ułomków”. Greckie słowo oznacza odłamane kawałki, które pozostały po posiłku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: jedli
  rationale: Aoryst czasownika ἐσθίω w toku narracji naturalnie oddaje polski czas przeszły niedokonany, opisujący wspólny posiłek.
- source_word: πάντες
  choice: wszyscy
  rationale: Zachowuje powszechny zakres wypowiedzi i naturalnie pełni funkcję podmiotu w języku polskim.
- source_word: ἐχορτάσθησαν
  choice: najedli się
  rationale: Czasownik oznacza, że zostali w pełni nakarmieni i zaspokoili głód. Zwrot „najedli się” jest współczesny, naturalny i nie osłabia sensu sytości.
- source_word: ἦραν
  choice: zebrali
  rationale: W kontekście pozostałości po posiłku αἴρω opisuje ich podniesienie i zebranie; „zebrali” brzmi po polsku precyzyjniej niż dosłowne „podnieśli”.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: pozostałych kawałków
  rationale: Konstrukcja oznacza to, co zostało z odłamanych kawałków. Polski zwrot zachowuje sens resztek bez niezręcznej nominalizacji.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: dwanaście pełnych koszy
  rationale: Oddaje liczbę, rzeczownik i określenie pełności w naturalnym polskim szyku.
theological_decisions:
- issue: Opis skutku cudownego nakarmienia zwykłym językiem sytości
  choice: najedli się
  alternative: zostali nasyceni
  rationale: „Najedli się” wiernie komunikuje pełne zaspokojenie głodu, nie dodając interpretacji teologicznej ani nie pomniejszając cudu.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. „Najedli się” jest bardziej naturalne dla zwykłego czytelnika niż podniosłe „zostali nasyceni”, a „pozostałe kawałki” jasno oddają sens bez archaizmu.
