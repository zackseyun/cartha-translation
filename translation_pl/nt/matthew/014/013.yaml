  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: pl
  text: Gdy Jezus o tym usłyszał, oddalił się stamtąd łodzią na miejsce odludne[a], z dala od innych. Kiedy tłumy o tym usłyszały, poszły za Nim pieszo z miast[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „na miejsce bezludne” albo „na miejsce odosobnione”. Greckie określenie oznacza teren odludny lub niezamieszkany, niekoniecznie piaszczystą pustynię.'
    reason: lexical_alternative
  - marker: b
    text: Grecki wyraz może, zależnie od kontekstu, oznaczać miasta lub miasteczka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Gdy Jezus o tym usłyszał
  rationale: Imiesłów aorystu oddano jako naturalne polskie zdanie czasowe. δέ sygnalizuje rozwój narracji, więc nie wymaga mocnego spójnika przeciwstawnego. „O tym” naturalnie odsyła do wiadomości z poprzedniego kontekstu, choć dopełnienie pozostaje w grece domyślne.
- source_word: ἀνεχώρησεν ἐκεῖθεν
  choice: oddalił się stamtąd
  rationale: „Oddalił się” zachowuje sens wycofania się lub odejścia, nie przesądzając o motywie Jezusa; ἐκεῖθεν odpowiada naturalnemu „stamtąd”.
- source_word: ἐν πλοίῳ
  choice: łodzią
  rationale: Naturalny polski sposób wyrażenia środka transportu, wiernie odpowiadający greckiej frazie.
- source_word: εἰς ἔρημον τόπον
  choice: na odludne miejsce
  rationale: ἔρημος opisuje tu miejsce niezamieszkane lub odosobnione, niekoniecznie piaszczystą pustynię. „Odludne” jest naturalne i geograficznie nieprzesadne.
- source_word: κατ’ ἰδίαν
  choice: aby być sam
  rationale: Fraza wskazuje na przebywanie osobno, z dala od innych. Celowa konstrukcja jest naturalna po polsku w tym kontekście, lecz nie przypisuje Jezusowi bardziej szczegółowego motywu.
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: Kiedy tłumy o tym usłyszały
  rationale: Imiesłów aorystu oddano czasowo, a liczbę mnogą ὄχλοι zachowano jako „tłumy”. Domyślnego przedmiotu słyszenia nie doprecyzowano ponad ogólne „o tym”.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: poszły za Nim pieszo
  rationale: Oddaje dosłowne podążanie za Jezusem oraz podróż lądem na piechotę, bez nadawania czasownikowi dodatkowego sensu uczniostwa.
- source_word: ἀπὸ τῶν πόλεων
  choice: z miast
  rationale: πόλις może oznaczać miasto lub mniejszy ośrodek miejski. „Miasta” jest bezpośrednim polskim odpowiednikiem, a zakres znaczeniowy objaśnia przypis.
theological_decisions:
- issue: Motyw oddalenia się Jezusa
  choice: Neutralne „oddalił się”, bez wskazywania powodu
  alternative: Wycofał się dla bezpieczeństwa, udał się na modlitwę albo odszedł, by opłakiwać Jana
  rationale: Werset łączy odejście Jezusa z otrzymaną wiadomością i wspomina o odosobnieniu, ale nie określa wprost Jego motywu.
- issue: Znaczenie podążania tłumów za Jezusem
  choice: Zwykłe fizyczne „poszły za Nim”
  alternative: „Naśladowały Go” w sensie uczniostwa
  rationale: Kontekst opisuje sposób przemieszczania się tłumów, dlatego nie należy wprowadzać tutaj dodatkowego znaczenia teologicznego.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, narracyjnym brzmieniu. Składnia jest przystępna, bez archaizmów. Wielką literę w zaimku „Nim” zastosowano zgodnie z utrwaloną polską konwencją odnoszenia się do Jezusa.
