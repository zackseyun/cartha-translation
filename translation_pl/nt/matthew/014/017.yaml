  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: pl
  text: 'Oni jednak powiedzieli mu: „Nie mamy tu nic oprócz pięciu chlebów i dwóch ryb”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Oni jednak
  rationale: Rodzajnik wskazuje na uczniów jako podmiot znany z kontekstu, a δέ wyraża łagodny kontrast wobec wcześniejszego polecenia Jezusa.
- source_word: λέγουσιν αὐτῷ
  choice: powiedzieli mu
  rationale: Grecki czas teraźniejszy pełni funkcję teraźniejszości historycznej; polski czas przeszły brzmi naturalnie w tej narracji i zachowuje funkcję wypowiedzi.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Nie mamy tu nic oprócz
  rationale: Po przeczeniu εἰ μή ma znaczenie wyłączające „oprócz”. Dodanie „nic” daje naturalną polską konstrukcję bez zmiany sensu.
- source_word: πέντε ἄρτους
  choice: pięciu chlebów
  rationale: Ἄρτος oznacza chleb lub bochenek; po „oprócz” dopełniacz „pięciu chlebów” jest naturalny i zgodny z tradycyjnym określeniem tych niewielkich chlebów.
- source_word: δύο ἰχθύας
  choice: dwóch ryb
  rationale: Ἰχθύς oznacza rybę; forma dopełniacza wynika z polskiej składni po „oprócz”.
