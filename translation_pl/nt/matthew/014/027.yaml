  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: pl
  text: 'Lecz Jezus natychmiast przemówił do nich: „Odwagi! To ja[a]. Nie bójcie się”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Ja jestem”. Greckie wyrażenie może tutaj służyć zwykłemu rozpoznaniu mówiącego, choć niektórzy dostrzegają w nim możliwe echo Bożego samookreślenia.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: natychmiast
  rationale: Oddaje wyraźne znaczenie czasowe i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: δὲ
  choice: lecz
  rationale: Sygnalizuje łagodne przeciwstawienie reakcji Jezusa lękowi uczniów opisanemu w poprzednim wersecie.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 'Jezus przemówił do nich:'
  rationale: Naturalna polska konstrukcja z dwukropkiem oddaje czasownik mówienia i imiesłów wprowadzający wypowiedź bez niezręcznego powtórzenia „przemówił, mówiąc”.
- source_word: Θαρσεῖτε
  choice: Odwagi!
  rationale: Zwięzły, współczesny polski odpowiednik rozkaźnika w liczbie mnogiej, zachowujący ton pokrzepienia.
- source_word: ἐγώ εἰμι
  choice: To ja
  rationale: W bezpośrednim kontekście Jezus uspokaja uczniów, rozpoznawalnie wskazując na swoją tożsamość. Dosłowniejszą postać zachowano w przypisie, aby nie usuwać możliwego głębszego rezonansu.
- source_word: μὴ φοβεῖσθε
  choice: Nie bójcie się
  rationale: Naturalnie oddaje zakaz skierowany do wielu uczniów, bez nadmiernego precyzowania aspektu jako „przestańcie się bać”.
theological_decisions:
- issue: Czy ἐγώ εἰμι oddać wyłącznie jako zwykłe rozpoznanie mówiącego, czy jako wyraźne nawiązanie do Bożego samookreślenia
  choice: W tekście głównym „To ja”
  alternative: „Ja jestem”
  rationale: Najbliższy kontekst wskazuje na uspokajające rozpoznanie Jezusa. Przypis zachowuje jednak dosłowne brzmienie i możliwy teologiczny rezonans, nie rozstrzygając go za czytelnika.
translation_notes:
  register: Współczesny, godny i komunikatywny styl narracyjny. Krótkie zdania wypowiedzi Jezusa zachowują nagłość, pokrzepiający ton i rytm tekstu greckiego.
