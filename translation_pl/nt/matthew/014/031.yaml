  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: pl
  text: 'Jezus natychmiast wyciągnął rękę, chwycił go i powiedział mu: „Człowieku małej wiary, dlaczego zwątpiłeś[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zawahałeś się” lub „wahałeś się”. Grecki czasownik może oznaczać zarówno zwątpienie, jak i wahanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: natychmiast
  rationale: Naturalnie oddaje bezzwłoczność działania i zachowuje narracyjną dynamikę.
- source_word: δὲ
  choice: —
  rationale: Lekki łącznik kontynuujący lub kontrastujący nie wymaga osobnego odpowiednika w naturalnej polskiej narracji.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: wyciągnął rękę
  rationale: Zwięzły, naturalny polski odpowiednik, zachowujący konkretny obraz i następstwo czynności.
- source_word: ἐπελάβετο αὐτοῦ
  choice: chwycił go
  rationale: Oddaje zdecydowane uchwycenie Piotra bez dopowiadania sposobu lub skutku działania.
- source_word: λέγει αὐτῷ
  choice: powiedział mu
  rationale: Polski czas przeszły jest naturalny w tej narracji; historyczny czas teraźniejszy greki nie musi być mechanicznie zachowywany.
- source_word: Ὀλιγόπιστε
  choice: Człowieku małej wiary
  rationale: Forma wołacza zachowuje bezpośredni zwrot i wskazuje na niedostatek wiary, nie na jej całkowity brak.
- source_word: εἰς τί
  choice: dlaczego
  rationale: Najbardziej naturalny polski odpowiednik pytania o przyczynę.
- source_word: ἐδίστασας
  choice: zwątpiłeś
  rationale: Jasny i utrwalony odpowiednik w tym kontekście; przypis zachowuje możliwy odcień zawahania lub chwiejności.
theological_decisions:
- issue: Znaczenie Ὀλιγόπιστε w relacji do πίστις
  choice: Człowieku małej wiary
  alternative: Małowierny
  rationale: Wybrane brzmienie jasno przedstawia naganę jako dotyczącą niedostatku wiary, a nie całkowitej niewiary, i unika nieco archaicznego, etykietującego rzeczownika.
- issue: Zakres znaczeniowy ἐδίστασας
  choice: zwątpiłeś
  alternative: zawahałeś się
  rationale: Tekst główny zachowuje teologicznie istotne odniesienie do zwątpienia, natomiast przypis sygnalizuje autentyczną niejednoznaczność czasownika, który może opisywać także wahanie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia jest naturalna po polsku, a bezpośrednia nagana Jezusa zachowuje siłę bez archaizacji i bez sugerowania całkowitego braku wiary.
