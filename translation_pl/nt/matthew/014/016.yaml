  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: pl
  text: 'Jezus jednak powiedział im: „Nie muszą odchodzić[a]. Wy dajcie im jeść”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Nie mają potrzeby odchodzić”; można też: „Nie ma potrzeby, żeby odchodzili”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: jednak
  rationale: Oddaje łagodny kontrast wobec propozycji uczniów z poprzedniego wersetu, nie czyniąc przejścia zbyt ostrym.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział im
  rationale: Prosty i wierny odpowiednik formuły narracyjnej, bez dodawania sensu „odpowiedział”.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Nie muszą odchodzić
  rationale: Naturalny współczesny polski odpowiednik idiomu oznaczającego brak potrzeby lub konieczności odejścia.
- source_word: δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Wy dajcie im jeść
  rationale: Konstrukcja „dać komuś jeść” jest naturalna po polsku, a wyrażone osobno „Wy” zachowuje nacisk obecny w greckim ὑμεῖς.
theological_decisions:
- issue: Nacisk na rolę uczniów w poleceniu Jezusa
  choice: Wy dajcie im jeść
  alternative: Dajcie im jeść
  rationale: Osobny zaimek ὑμεῖς jest w grece emfatyczny. Zachowanie „Wy” uwydatnia adresatów polecenia bez dopowiadania jego teologicznego znaczenia.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. „Wy dajcie im jeść” brzmi naturalnie, a zarazem zachowuje emfatyczny szyk tekstu greckiego.
