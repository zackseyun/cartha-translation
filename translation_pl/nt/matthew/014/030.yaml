  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: pl
  text: 'Widząc jednak silny wiatr[a], przestraszył się, a gdy zaczął tonąć, zawołał: „Panie, ratuj mnie[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „gwałtowny wiatr”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „ocal mnie” lub „zbaw mnie”. Grecki czasownik może oznaczać zarówno ratunek z bezpośredniego niebezpieczeństwa, jak i szerzej rozumiane ocalenie lub zbawienie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: Widząc
  rationale: Imiesłów czasu teraźniejszego wyraża czynność równoczesną; polski imiesłów zachowuje zwięzłe powiązanie z dalszym zdaniem.
- source_word: δὲ
  choice: jednak
  rationale: Spójnik sygnalizuje kontrast i zwrot w narracji po wcześniejszym chodzeniu Piotra po wodzie.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: silny wiatr
  rationale: ἰσχυρός bezpośrednio określa wiatr; „silny wiatr” jest naturalnym i wiernym polskim odpowiednikiem.
- source_word: ἐφοβήθη
  choice: przestraszył się
  rationale: Forma wskazuje na pojawienie się strachu, a nie tylko na trwający stan; czasownik dokonany dobrze oddaje ten moment.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: gdy zaczął tonąć
  rationale: Naturalna polska konstrukcja zachowuje rozpoczęcie procesu. „Tonąć” nie przesądza, że Piotr już utonął.
- source_word: ἔκραξεν λέγων
  choice: zawołał
  rationale: Polski czasownik wyraża głośny, pilny okrzyk, a pominięcie dosłownego „mówiąc” pozwala uniknąć nienaturalnego hebraizującego brzmienia bez utraty treści.
- source_word: Κύριε
  choice: Panie
  rationale: Standardowy wołacz od „Pan”, zachowujący zarówno bezpośredni zwrot do Jezusa, jak i możliwy ciężar chrystologiczny tytułu.
- source_word: σῶσόν με
  choice: ratuj mnie
  rationale: W sytuacji bezpośredniego zagrożenia życia jest to naturalne, pilne polskie wezwanie; przypis zachowuje szerszą możliwość oddania czasownika.
theological_decisions:
- issue: Oddanie κύριος w bezpośrednim zwrocie do Jezusa
  choice: Panie
  alternative: Mistrzu
  rationale: „Panie” jest podstawowym odpowiednikiem κύριος i nie usuwa chrystologicznej wagi zwrotu, zarazem nie dopowiadając jej ponad tekst.
- issue: Oddanie σῴζω w kontekście bezpośredniego niebezpieczeństwa
  choice: ratuj mnie
  alternative: zbaw mnie / ocal mnie
  rationale: Kontekst bezpośrednio dotyczy tonięcia, dlatego „ratuj mnie” brzmi naturalnie i precyzyjnie. Przypis zaznacza szerszy zakres czasownika, obejmujący także ocalenie lub zbawienie.
translation_notes:
  register: Współczesny, godny i narracyjnie płynny język. Zachowano kontrast wyrażony przez δέ oraz rozpoczęcie procesu tonięcia, ale konstrukcję imiesłowową ἀρξάμενος oddano naturalnym polskim zdaniem czasowym.
