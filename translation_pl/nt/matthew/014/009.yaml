id: MAT.14.9
reference: Matthew 14:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: pl
  text: Król zasmucił się, ale ze względu na swoje przysięgi i współbiesiadników[a] rozkazał, by to dano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „tych, którzy spoczywali z nim przy stole”. W tamtych czasach podczas uroczystych posiłków zwykle spoczywano na łożach.'
    reason: cultural_note
  - marker: b
    text: W tekście greckim nie wskazano wprost, co miało zostać dane; chodzi o żądanie przedstawione wcześniej.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: zasmucił się, ale
  rationale: Imiesłów aorystu wyraża doznany smutek; spójnik „ale” naturalnie oddaje koncesywną relację między smutkiem króla a wydanym mimo to rozkazem.
- source_word: ὁ βασιλεὺς
  choice: król
  rationale: Bezpośredni i kontekstowo właściwy odpowiednik βασιλεύς.
- source_word: διὰ τοὺς ὅρκους
  choice: ze względu na swoje przysięgi
  rationale: διά z biernikiem wskazuje przyczynę. „Swoje” wynika z kontekstu i jasno wiąże przysięgi z królem.
- source_word: τοὺς συνανακειμένους
  choice: współbiesiadników
  rationale: Termin oznacza osoby spoczywające razem przy stole. „Współbiesiadnicy” zwięźle i naturalnie wskazują uczestników wspólnego posiłku, a szczegół kulturowy zachowano w przypisie.
- source_word: ἐκέλευσεν
  choice: rozkazał
  rationale: Czasownik oznacza wydanie polecenia lub rozkazu; „rozkazał” zachowuje siłę wypowiedzi i narracyjny rejestr.
- source_word: δοθῆναι
  choice: by to dano
  rationale: Strona bierna i domyślny przedmiot zostają zachowane. Zaimek „to” odsyła do żądania z poprzedniego kontekstu bez jego objaśniającego dopowiadania.
theological_decisions: []
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Konstrukcja „zasmucił się, ale” unika ciężkiego imiesłowu i przejrzyście zachowuje napięcie między reakcją króla a jego decyzją. „Współbiesiadnicy” jest zwięzłe, a przypis wyjaśnia historyczną postawę przy stole.
