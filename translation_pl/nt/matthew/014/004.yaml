  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: pl
  text: 'Jan bowiem powtarzał mu: „Nie wolno ci jej mieć”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: powtarzał
  rationale: Imperfectum wskazuje na trwającą lub powtarzaną w przeszłości wypowiedź; „powtarzał” naturalnie oddaje ten aspekt po polsku.
- source_word: γὰρ
  choice: bowiem
  rationale: Spójnik wprowadza wyjaśnienie wcześniejszej narracji; „bowiem” zachowuje tę funkcję i podniosły, lecz współczesny rejestr.
- source_word: αὐτῷ
  choice: mu
  rationale: Celownik zaimka przy czasowniku mówienia naturalnie oddaje polskie „mu”.
- source_word: ὁ Ἰωάννης
  choice: Jan
  rationale: Tekst źródłowy podaje samo imię, a bezpośredni kontekst jednoznacznie identyfikuje Jana.
- source_word: Οὐκ ἔξεστίν
  choice: Nie wolno
  rationale: Zwrot oznacza brak dozwolenia lub prawnej dopuszczalności. „Nie wolno” jest naturalnym polskim odpowiednikiem, zachowującym stanowczą moc zakazu.
- source_word: σοι
  choice: ci
  rationale: Celownik osoby przy bezosobowym ἔξεστιν naturalnie oddaje polskie „ci”.
- source_word: ἔχειν
  choice: mieć
  rationale: „Mieć” zachowuje zwięzłość greki; kontekst wskazuje na posiadanie kobiety jako żony lub partnerki, bez potrzeby dopowiadania tego w tekście.
- source_word: αὐτήν
  choice: jej
  rationale: Zaimek odnosi się bezpośrednio do Herodiady; polskie „jej” zachowuje formę zaimkową źródła.
theological_decisions:
- issue: Charakter nagany Jana
  choice: „Nie wolno ci jej mieć” jako stanowczy zakaz dotyczący dopuszczalności związku
  alternative: „Nie godzi ci się jej mieć” lub „Nie jest zgodne z Prawem, żebyś ją miał”
  rationale: ἔξεστιν dotyczy tego, co dozwolone lub prawnie dopuszczalne. „Nie wolno” zachowuje moralno-prawną siłę nagany bez dodawania do tekstu rzeczownika „Prawo” ani zawężania sensu do samej oceny obyczajowej.
translation_notes:
  register: Współczesny, naturalny i godny styl. Szyk „Jan bowiem” zachowuje funkcję objaśniającą γάρ, a „powtarzał” oddaje niedokonany, prawdopodobnie iteratywny charakter ἔλεγεν. Nie dodano przypisu, ponieważ główne sformułowanie „Nie wolno” obejmuje podstawowy zakres znaczeniowy ἔξεστιν bez istotnej utraty autentycznej wieloznaczności.
