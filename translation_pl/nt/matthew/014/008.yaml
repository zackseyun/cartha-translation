  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: pl
  text: 'A ona, za namową matki, mówi: „Daj mi tu na półmisku głowę Jana Chrzciciela”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: nakłoniona
  rationale: Imiesłów bierny wskazuje na wcześniejszy wpływ matki na dziewczynę. „Nakłoniona” zachowuje stronę bierną i nie przesądza, czy chodziło o formalne pouczenie, namowę czy silniejszą presję.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: przez swoją matkę
  rationale: Ὑπό z dopełniaczem wskazuje wykonawcę czynności w konstrukcji biernej. Polski zaimek zwrotny naturalnie odnosi matkę do podmiotu zdania.
- source_word: Δός μοι
  choice: Daj mi
  rationale: Bezpośredni rozkaz wyrażony aorystem trybu rozkazującego najnaturalniej oddaje polskie „Daj mi”.
- source_word: φησίν
  choice: mówi
  rationale: Czas teraźniejszy zachowuje grecki praesens historicum i jego narracyjną żywość.
- source_word: ὧδε
  choice: tu
  rationale: Krótki polski odpowiednik zachowuje wskazanie miejsca i możliwy odcień natychmiastowości bez jego dopowiadania.
- source_word: ἐπὶ πίνακι
  choice: na półmisku
  rationale: W kontekście uczty πίναξ oznacza półmisek lub tacę. „Półmisek” jest naturalny i zachowuje realia sceny.
- source_word: τὴν κεφαλὴν
  choice: głowę
  rationale: Dosłowne tłumaczenie zachowuje zamierzoną, drastyczną konkretność żądania.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jana Chrzciciela
  rationale: „Chrzciciel” jest w polszczyźnie naturalnym, utrwalonym rzeczownikiem wykonawcy i zachowuje opisową treść greckiego βαπτιστής.
theological_decisions:
- issue: Oddanie tytułu βαπτιστής
  choice: Jan Chrzciciel
  alternative: Jan Chrzczący / Jan, który chrzcił
  rationale: „Jan Chrzciciel” jest zarazem standardowym polskim tytułem i semantycznym odpowiednikiem greckiego rzeczownika oznaczającego osobę udzielającą chrztu. Nie wymaga wyboru interpretacji wyznaniowej.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Zachowano grecki czas teraźniejszy „mówi” dla żywości opowiadania oraz szyk, który jasno łączy wpływ matki z żądaniem dziewczyny.
