  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: pl
  text: I prosili go, aby mogli dotknąć choćby skraju jego szaty[a]. A wszyscy, którzy dotknęli tego skraju, zostali uzdrowieni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „brzegu”, „obszycia” lub „frędzla”; greckie słowo może oznaczać skraj szaty, być może wraz z umieszczonym na nim frędzlem.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „wyzdrowieli”, „zostali ocaleni” lub „zostali uratowani”; grecki czasownik ma szerszy zakres znaczeniowy, lecz w tym kontekście odnosi się do odzyskania zdrowia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: prosili
  rationale: Czas niedokonany wskazuje na trwającą lub ponawianą prośbę. Polskie „prosili” brzmi naturalnie; pilność sytuacji wynika z kontekstu, bez potrzeby wzmacniania jej słowem „błagali”.
- source_word: ἵνα μόνον ἅψωνται
  choice: żeby mogli choć dotknąć
  rationale: Konstrukcja ἵνα z trybem łączącym wyraża treść prośby, a μόνον podkreśla, że wystarczyć miał sam dotyk. „Choć dotknąć” naturalnie oddaje ten minimalny zakres oczekiwania.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: skraju jego szaty
  rationale: κράσπεδον może oznaczać skraj, brzeg, obszycie albo frędzel szaty. „Skraj” zachowuje szerszy sens i nie przesądza, czy chodziło konkretnie o frędzel. ἱμάτιον oddano ogólnym i godnym słowem „szata”.
- source_word: ὅσοι ἥψαντο
  choice: wszyscy, którzy go dotknęli
  rationale: ὅσοι ma sens obejmujący całą wskazaną grupę. Zaimek „go” odnosi się gramatycznie do „skraju” i pozwala uniknąć ciężkiego powtórzenia.
- source_word: διεσώθησαν
  choice: zostali uzdrowieni
  rationale: W bezpośrednim kontekście uzdrawiania czasownik διασῴζω oznacza odzyskanie zdrowia. Przypis zachowuje jego szerszy zakres znaczeniowy, obejmujący ocalenie lub uratowanie.
theological_decisions:
- issue: Znaczenie διεσώθησαν w opisie cudownego uzdrowienia
  choice: zostali uzdrowieni
  alternative: zostali ocaleni / zostali uratowani
  rationale: Kontekst mówi o chorych szukających fizycznego uzdrowienia, dlatego sens medyczny jest tutaj najbardziej bezpośredni. Szerszego znaczenia czasownika nie usuwa się jednak całkowicie, lecz sygnalizuje je w przypisie, bez narzucania temu zdaniu dodatkowej tezy soteriologicznej.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, narracyjnym brzmieniu. Składnia jest prosta i zrozumiała, a przypisy zachowują istotną wieloznaczność terminów κράσπεδον i διασῴζω.
