lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Łagodny spójnik zaznacza przejście i kontrast wobec wcześniejszej odpowiedzi uczniów, bez nadmiernego wzmacniania przeciwstawienia.
- source_word: εἶπεν
  choice: powiedział
  rationale: Prosty odpowiednik aorystu czasownika λέγω; nie dodaje znaczenia rozkazu, które wynika dopiero z następującego trybu rozkazującego.
- source_word: Φέρετέ
  choice: Przynieście
  rationale: Tryb rozkazujący drugiej osoby liczby mnogiej naturalnie wyraża polecenie skierowane do uczniów, aby dostarczyli wskazane rzeczy.
- source_word: μοι
  choice: mi
  rationale: Polski celownik zwięźle i idiomatycznie oddaje grecki zaimek w celowniku oraz osobowy kierunek czynności.
- source_word: ὧδε
  choice: tutaj
  rationale: Naturalny współczesny odpowiednik przysłówka miejsca, zachowujący przestrzenny element wypowiedzi.
- source_word: αὐτούς
  choice: je
  rationale: Zaimek odnosi się kontekstowo do chlebów i ryb z poprzedniego wersetu; polskie „je” naturalnie obejmuje wspomniane przedmioty bez ich ponownego wyliczania.
