  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: pl
  text: Kiedy zaś obchodzono urodziny Heroda[a], córka Herodiady zatańczyła pośrodku[b] i spodobała się Herodowi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „gdy nadeszły urodziny Heroda” lub „podczas uroczystości urodzinowej Heroda”. Greckie wyrażenie odnosi się do obchodów jego urodzin.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „w środku”. Najprawdopodobniej chodzi o taniec pośrodku zgromadzonych.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: kiedy obchodzono urodziny Heroda
  rationale: Konstrukcja czasowa odnosi się do obchodów urodzin. Polskie „obchodzono urodziny” naturalnie oddaje wydarzenie, nie ograniczając sensu do samej daty ani nie przesądzając, że chodzi o ucztę.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodne przejście narracyjne z możliwym odcieniem kontrastu, bez nadmiernie mocnego „ale”.
- source_word: ὠρχήσατο
  choice: zatańczyła
  rationale: Prosty czasownik wiernie i naturalnie oddaje aorystyczną formę ὀρχέομαι, bez dopowiadania charakteru tańca.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: córka Herodiady
  rationale: Zachowuje podaną w tekście relację i nie wprowadza niewymienionego imienia córki.
- source_word: ἐν τῷ μέσῳ
  choice: pośrodku
  rationale: Bliski, zwięzły odpowiednik greckiego wyrażenia; kontekst wskazuje na środek zgromadzenia, lecz tekst nie określa tego wprost.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: spodobała się Herodowi
  rationale: Naturalny polski odpowiednik czasownika ἀρέσκω z celownikiem, bez dodawania motywu lub rodzaju upodobania.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Heroda / Herodowi
  rationale: Standardowa polska forma imienia wraz z właściwą odmianą przypadkową.
theological_decisions: []
