  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: pl
  text: 'Gdy nastał wieczór, uczniowie podeszli do niego i powiedzieli: „Miejsce jest odludne[a], a pora jest już późna[b]. Odeślij tłumy, żeby poszły do wiosek i kupiły sobie jedzenie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „To miejsce jest pustynne”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „godzina już minęła”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Gdy nastał wieczór
  rationale: Konstrukcja dopełniaczowa wyznacza przejście czasowe w narracji. Naturalne polskie sformułowanie zachowuje sens nastania wieczoru, a δέ nie wymaga tu osobnego odpowiednika.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταί
  choice: uczniowie podeszli do niego
  rationale: προσέρχομαι oznacza podejść lub przyjść do kogoś. Szyk jest naturalny po polsku i nie dodaje niewyrażonego zaimka dzierżawczego „jego”.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Miejsce jest odludne
  rationale: ἔρημος opisuje tu teren niezamieszkany lub oddalony od osad, niekoniecznie pustynię geograficzną.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: pora już późna
  rationale: Dosłowne „godzina już minęła” jest w tym kontekście idiomem wskazującym, że zrobiło się późno. Zwięzłe polskie sformułowanie oddaje ten sens.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Odeślij tłumy
  rationale: ἀπολύω oznacza tutaj odprawić lub odesłać zgromadzonych ludzi. „Odeślij” jasno wyraża zamierzone działanie.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: żeby poszły do wiosek
  rationale: Imiesłów w zdaniu celu został naturalnie włączony w polską konstrukcję z „żeby”. Nie dodano określenia „pobliskich”, którego tekst grecki nie wyraża wprost.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: kupiły sobie jedzenie
  rationale: βρώματα oznacza żywność lub jedzenie, a „sobie” zachowuje zwrotny sens ἑαυτοῖς.
theological_decisions: []
translation_notes:
  register: Współczesny, godny język narracyjny. Użyto prostych i powszechnie zrozumiałych słów; zachowano liczbę mnogą „tłumy” oraz odpowiadające jej polskie formy niemęskoosobowe „poszły” i „kupiły”.
