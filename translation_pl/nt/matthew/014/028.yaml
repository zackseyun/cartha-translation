  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: pl
  text: 'Piotr zaś odpowiedział mu: „Panie, jeśli to ty jesteś, każ mi przyjść do ciebie po wodzie[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „po wodach”. W tekście greckim występuje liczba mnoga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Piotr zaś odpowiedział mu
  rationale: Oddaje typową formułę narracyjną z δέ oraz celownik αὐτῷ, unikając nienaturalnego powtórzenia „odpowiedział, mówiąc”.
- source_word: Κύριε
  choice: Panie
  rationale: Standardowy polski odpowiednik wołacza κύριε; zachowuje zarówno szacunek, jak i możliwą wagę chrystologiczną.
- source_word: εἰ σὺ εἶ
  choice: jeśli to ty jesteś
  rationale: Naturalnie wyraża identyfikację osoby, a zarazem zachowuje nacisk obecny w zaimku σὺ.
- source_word: κέλευσόν με
  choice: każ mi
  rationale: Zwięźle i naturalnie oddaje autorytatywny nakaz wyrażony przez κελεύω.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: przyjść do ciebie
  rationale: Zachowuje kierunek ruchu ku Jezusowi i perspektywę mówiącego.
- source_word: ἐπὶ τὰ ὕδατα
  choice: po wodzie
  rationale: To naturalne współczesne polskie określenie poruszania się po powierzchni wody; grecką liczbę mnogą odnotowano w przypisie.
theological_decisions:
- issue: Znaczenie zwrotu κύριε skierowanego do Jezusa
  choice: Panie
  alternative: Mistrzu; proszę pana
  rationale: „Panie” nie sprowadza zwrotu do samej uprzejmości i zachowuje możliwy ciężar chrystologiczny, nie rozstrzygając go ponad to, co wynika z tekstu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze standardową polską ortografią, bez wprowadzania konfesyjnej konwencji grzecznościowej.
