source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: pl
  text: Chociaż chciał go zabić[a], bał się tłumu, ponieważ ludzie uważali go za proroka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie można też oddać: „Chcąc go zabić, bał się tłumu”. W tym kontekście imiesłów ma sens przyzwalający: „chociaż chciał go zabić”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: chociaż chciał
  rationale: 'Imiesłów wyraża pragnienie podmiotu, a w tym kontekście pozostaje w relacji przyzwalającej do orzeczenia „bał się”. Polski spójnik „chociaż” naturalnie oddaje napięcie: chciał zabić, lecz powstrzymywał go lęk.'
- source_word: ἀποκτεῖναι
  choice: zabić
  rationale: Bezpośredni, współczesny odpowiednik, który nie dodaje moralnej kwalifikacji zawartej w polskim „zamordować”.
- source_word: ἐφοβήθη
  choice: bał się
  rationale: Naturalny polski odpowiednik czasownika φοβέομαι, odpowiedni dla narracji.
- source_word: τὸν ὄχλον
  choice: tłumu
  rationale: ὄχλος oznacza zgromadzony tłum; ten odpowiednik jest zwięzły i zgodny z kontekstem społecznym.
- source_word: ὅτι
  choice: ponieważ
  rationale: Spójnik wprowadza przyczynę lęku i zostaje jasno oddany we współczesnej polszczyźnie.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: ludzie uważali go za proroka
  rationale: Konstrukcja ἔχω z określeniem w bierniku oznacza uznawanie kogoś za kogoś. Dodane „ludzie” wskazuje naturalnie na zbiorowy podmiot zawarty w „tłumie”, bez podawania imion.
theological_decisions:
- issue: Domyślna tożsamość podmiotu i dopełnienia wynika z kontekstu narracji
  choice: Zachować zaimki „go” oraz domyślny podmiot czasowników, bez dodawania imion Heroda i Jana
  alternative: Chociaż Herod chciał zabić Jana, bał się tłumu, ponieważ ludzie uważali Jana za proroka.
  rationale: Tekst grecki posługuje się zaimkami, a osoby są rozpoznawalne z bezpośredniego kontekstu. Niedodawanie imion zachowuje formę źródła i nie wprowadza objaśnienia do samego tekstu wersetu.
- issue: Relacja imiesłowu θέλων do czasownika ἐφοβήθη
  choice: 'Oddać ją przyzwalająco: „Chociaż chciał”'
  alternative: „Chcąc go zabić, bał się tłumu”
  rationale: Sama forma imiesłowu nie koduje jednoznacznie relacji przyzwalającej, lecz kontekst wskazuje na napięcie między zamiarem zabicia a lękiem przed tłumem. Przypis zachowuje bardziej formalną możliwość przekładu.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Składnia jest naturalna dla zwykłego czytelnika, a zaimkowa forma tekstu greckiego została zachowana. Marker [a] występuje w tekście głównym.
