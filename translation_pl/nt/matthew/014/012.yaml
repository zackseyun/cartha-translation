id: MAT.14.12
reference: Matthew 14:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: pl
  text: Jego uczniowie przyszli, zabrali ciało[a] i pochowali go. Potem poszli i donieśli o tym Jezusowi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „zwłoki”. Greckie słowo oznacza martwe ciało.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: przyszli
  rationale: Imiesłów aorystu od προσέρχομαι wprowadza przybycie uczniów i ich kolejne działania. „Przyszli” brzmi naturalnie w polskiej narracji i nie dodaje nieobecnego w tekście określenia miejsca.
- source_word: μαθηταὶ αὐτοῦ
  choice: jego uczniowie
  rationale: Zachowuje ustalony odpowiednik μαθηταί oraz zaimek grecki. Z kontekstu wynika, że chodzi o uczniów Jana Chrzciciela.
- source_word: ἦραν
  choice: zabrali
  rationale: W kontekście przygotowania pogrzebu αἴρω oznacza podniesienie i zabranie ciała. „Zabrali” naturalnie oddaje czynność bez dopowiadania, dokąd je przenieśli.
- source_word: πτῶμα
  choice: ciało
  rationale: Grecki rzeczownik oznacza martwe ciało, zwłoki. „Ciało” jest godnym i naturalnym określeniem narracyjnym, a przypis zachowuje wyraźniejszy sens leksykalny.
- source_word: ἔθαψαν αὐτόν
  choice: pochowali go
  rationale: θάπτω znaczy „pochować”. Męskie „go” odzwierciedla greckie αὐτόν i osobowe odniesienie do Jana, zamiast mechanicznie nawiązywać do nijakiego polskiego „ciało”.
- source_word: ἐλθόντες
  choice: potem poszli
  rationale: Imiesłów wskazuje następne przemieszczenie i działanie. Polska forma osobowa z „potem” jasno i naturalnie oddaje kolejność wydarzeń.
- source_word: ἀπήγγειλαν τῷ Ἰησοῦ
  choice: donieśli o tym Jezusowi
  rationale: ἀπαγγέλλω oznacza przekazać wiadomość lub zdać sprawę. „O tym” naturalnie uzupełnia domyślną treść wiadomości, czyli śmierć i pogrzeb Jana.
theological_decisions:
- issue: Tożsamość określenia „jego uczniowie”
  choice: Z kontekstu są to uczniowie Jana Chrzciciela, lecz przekład zachowuje „jego uczniowie”.
  alternative: 'Jawne doprecyzowanie: „uczniowie Jana”.'
  rationale: Najbliższym kontekstowym odniesieniem zaimka αὐτοῦ jest Jan Chrzciciel. Zachowanie zaimka wiernie oddaje grecką formę i nie usuwa jej formalnej niejednoznaczności, choć sens kontekstowy jest wyraźny.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano osobowe „pochowali go”, które w naturalnej polszczyźnie podkreśla, że uczniowie pochowali Jana, nie zaś jedynie bezosobowe ciało.
