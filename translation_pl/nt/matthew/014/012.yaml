  naturalness: 'Tekst jest naturalny, współczesny i godny: „Jego uczniowie przyszli, zabrali ciało i pochowali go. Potem poszli i donieśli o tym Jezusowi.” Konstrukcja z „Potem” dobrze oddaje następczy charakter drugiego imiesłowu bez sztucznego kalkowania greki.'
