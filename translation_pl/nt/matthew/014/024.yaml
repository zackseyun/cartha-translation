  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: pl
  text: Łódź tymczasem znajdowała się już wiele stadiów od lądu[a][b], miotana przez fale[c], gdyż wiatr był przeciwny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „od brzegu”. Grecki tekst mówi dosłownie: „od lądu”.'
    reason: lexical_alternative
  - marker: b
    text: Stadion był starożytną jednostką długości równą około 185 metrom.
    reason: cultural_note
  - marker: c
    text: 'Dosłownie: „dręczona przez fale”; można też oddać: „nękana” lub „smagana przez fale”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: łódź
  rationale: W kontekście przeprawy przez Jezioro Galilejskie naturalnym współczesnym odpowiednikiem jest „łódź”; „statek” sugerowałby większą jednostkę.
- source_word: ἤδη
  choice: już
  rationale: Oddaje stan, który zdążył się rozwinąć na tym etapie opowiadania.
- source_word: σταδίους πολλοὺς
  choice: wiele stadiów
  rationale: Zachowuje starożytną jednostkę odległości obecną w tekście greckim; jej przybliżoną wartość objaśnia przypis.
- source_word: ἀπὸ τῆς γῆς
  choice: od lądu
  rationale: γῆ oznacza tu ląd w przeciwstawieniu do wody; „od brzegu” jest możliwym odpowiednikiem kontekstowym wskazanym w przypisie.
- source_word: ἀπεῖχεν
  choice: była ... od
  rationale: Naturalna polska konstrukcja wyrażająca odległość przestrzenną.
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: miotały nią fale
  rationale: Dynamiczna, naturalna konstrukcja oddająca gwałtowne działanie fal na łódź. Grecki imiesłów dosłowniej przedstawia łódź jako dręczoną lub nękaną przez fale.
- source_word: ἐναντίος
  choice: przeciwny
  rationale: W odniesieniu do wiatru wyraża kierunek utrudniający łodzi przeprawę, bez dopowiadania nieobecnego wprost dopełnienia.
- source_word: δὲ
  choice: tymczasem
  rationale: Oddaje łagodne przejście narracyjne i przenosi uwagę z Jezusa na położenie łodzi; w tym miejscu brzmi naturalniej niż silnie kontrastujące „ale”.
- source_word: γάρ
  choice: ponieważ
  rationale: 'Jasno zachowuje wyjaśniający związek: przyczyną naporu fal był przeciwny wiatr.'
theological_decisions: []
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano starożytną miarę „stadion”, a niezrozumiały bez kontekstu obraz dosłownego „dręczenia” łodzi oddano idiomatycznie jako miotanie nią przez fale. Wszystkie znaczące alternatywy objaśniono zwięźle w przypisach.
