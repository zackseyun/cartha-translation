id: MAT.14.19
reference: Matthew 14:19
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: pl
  text: Następnie polecił tłumom ułożyć się na trawie. Wziął pięć chlebów i dwie ryby, spojrzał w niebo, pobłogosławił[a], po czym połamał chleby i dał je uczniom, a uczniowie — tłumom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „pobłogosławił”. Greka nie wskazuje wprost, kogo lub co pobłogosławił; możliwy jest sens: „pobłogosławił Boga” lub „pobłogosławił chleby i ryby”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: polecił
  rationale: Oddaje stanowczą dyrektywę, lecz brzmi naturalniej we współczesnej polszczyźnie niż „rozkazał”; następstwo czynności wyraża „następnie”.
- source_word: τοὺς ὄχλους
  choice: tłumom / tłumom
  rationale: Zachowuje liczbę mnogą greckiego rzeczownika i jest naturalnym określeniem zgromadzonych ludzi.
- source_word: ἀνακλιθῆναι
  choice: ułożyć się
  rationale: Zachowuje realia pozycji półleżącej przy posiłku lepiej niż ogólne „usiąść”, a jest bardziej naturalne niż techniczne „spocząć przy stole” w plenerze.
- source_word: ἐπὶ τοῦ χόρτου
  choice: na trawie
  rationale: Bezpośredni odpowiednik wyrażenia lokalnego, bez dodawania nieobecnego tu określenia „zielonej”.
- source_word: τοὺς πέντε ἄρτους
  choice: pięć chlebów
  rationale: W polskiej tradycji językowej i w tym kontekście ἄρτοι naturalnie oznacza niewielkie bochenki chleba; „pięć chlebów” jest zwięzłe i zrozumiałe.
- source_word: τοὺς δύο ἰχθύας
  choice: dwie ryby
  rationale: Prosty i współczesny odpowiednik greckiej liczby mnogiej.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: spojrzał w niebo
  rationale: Naturalnie oddaje skierowanie wzroku ku górze i zachowuje religijny sens οὐρανός bez nadmiernego doprecyzowania.
- source_word: εὐλόγησεν
  choice: wypowiedział błogosławieństwo
  rationale: Grecki czasownik nie podaje dopełnienia. To sformułowanie pozostawia otwarte, czy chodzi o błogosławienie Boga, czy pokarmu, zamiast dopowiadać obiekt.
- source_word: κλάσας
  choice: po czym połamał chleby
  rationale: Oddaje czynność poprzedzającą rozdawanie; dopełnienie wynika z kontekstu i zostaje wyrażone dla jasności.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: a uczniowie — tłumom
  rationale: Zachowuje zwięzłą grecką elipsę czasownika, która w języku polskim pozostaje czytelna dzięki pauzie.
theological_decisions:
- issue: Niewyrażony przedmiot εὐλόγησεν
  choice: wypowiedział błogosławieństwo
  alternative: pobłogosławił je / błogosławił Boga
  rationale: Tekst grecki nie wskazuje wprost przedmiotu błogosławienia. Główne tłumaczenie nie rozstrzyga, czy Jezus pobłogosławił pokarm, czy wypowiedział błogosławieństwo skierowane do Boga; przypis ujawnia tę rzeczywistą niejednoznaczność.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano realia spoczywania przy posiłku oraz grecką elipsę w końcowej części zdania. Podział na dwa zdania poprawia czytelność bez zmiany kolejności wydarzeń.
