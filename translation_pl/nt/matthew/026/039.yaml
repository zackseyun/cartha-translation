  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: pl
  text: 'Poszedł nieco dalej, padł na twarz[a], modlił się i mówił: „Ojcze mój, jeśli to możliwe, niech ominie mnie ten kielich[b]. Jednak nie tak, jak Ja chcę, ale jak Ty”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „upadł twarzą do ziemi”.'
    reason: lexical_alternative
  - marker: b
    text: „Kielich” jest w Biblii obrazem wyznaczonego komuś udziału, zwłaszcza cierpienia; por. Mt 20,22; 26,42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: odszedł nieco dalej
  rationale: Imiesłów aorystu z μικρόν wskazuje na przemieszczenie się o niewielką odległość. Sformułowanie zachowuje sens ruchu naprzód i brzmi naturalnie po polsku.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: padł na twarz
  rationale: Grecki zwrot opisuje przyjęcie postawy pełnego uniżenia. Dosłowny, zwięzły polski idiom zachowuje wyrazistość sceny.
- source_word: προσευχόμενος καὶ λέγων
  choice: modlił się i mówił
  rationale: Imiesłowy czasu teraźniejszego opisują czynności towarzyszące. Konstrukcja współrzędna jest naturalna w nowoczesnej polszczyźnie i nie zmienia ich związku z główną czynnością.
- source_word: Πάτερ μου
  choice: Ojcze mój
  rationale: Wołacz wraz z zaimkiem dzierżawczym wyraża zarazem bliskość i cześć, bez dodawania niewyrażonego w tekście zabarwienia emocjonalnego.
- source_word: εἰ δυνατόν ἐστιν
  choice: jeśli to możliwe
  rationale: Naturalny polski odpowiednik pełnego greckiego zdania warunkowego; zaimek „to” ma funkcję gramatyczną i nie narzuca dodatkowej interpretacji.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: niech ominie mnie
  rationale: Aorystyczny tryb rozkazujący wyraża prośbę. „Niech ominie mnie” idiomatycznie oddaje życzenie, by kielich nie stał się udziałem mówiącego.
- source_word: τὸ ποτήριον τοῦτο
  choice: ten kielich
  rationale: Zachowano dosłowny obraz, ponieważ ma on w Biblii znaczenie metaforyczne i szerokie odniesienia teologiczne. „Kielich” lepiej niż ogólne „naczynie” zachowuje utrwalony, podniosły obraz.
- source_word: πλὴν
  choice: jednak
  rationale: Wyraz wprowadza mocne zastrzeżenie wobec poprzedniej prośby. „Jednak” jest zwięzłe, współczesne i zachowuje kontrast.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: nie tak, jak Ja chcę, ale jak Ty
  rationale: Oddano rzeczywistą wolę Jezusa i jej podporządkowanie Ojcu. Elipsę drugiego θέλω pozostawiono w naturalnej polskiej postaci, gdzie sens „chcesz” jest jednoznaczny.
theological_decisions:
- issue: Metafora kielicha w modlitwie Jezusa
  choice: Zachowano w tekście głównym dosłowny obraz „ten kielich”.
  alternative: „to cierpienie” lub „ten los”
  rationale: ποτήριον jest nazwą dosłowną używaną metaforycznie na oznaczenie wyznaczonego udziału, zwłaszcza cierpienia. Zachowanie obrazu nie ogranicza jego znaczenia do jednej interpretacji i podtrzymuje powiązania biblijne.
- issue: Wola Jezusa wobec woli Ojca
  choice: „nie tak, jak Ja chcę, ale jak Ty”
  alternative: „nie to, czego Ja pragnę, lecz to, czego Ty pragniesz”
  rationale: Tłumaczenie zachowuje napięcie między rzeczywistym pragnieniem Jezusa a Jego poddaniem się Ojcu, nie osłabiając ani nie objaśniając dogmatycznie tej relacji.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłość modlitwy oraz biblijny obraz kielicha. Wielkie litery w zaimkach „Ja” i „Ty” ułatwiają rozpoznanie kontrastu osób, pozostając zgodne z częstą polską praktyką w tekstach religijnych.
