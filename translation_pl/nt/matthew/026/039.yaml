  terminology: „Kielich” słusznie zachowuje obraz obecny w ποτήριον, bez jego interpretacyjnego zawężania. „Ojcze mój”, „niech ominie mnie” oraz „Jednak” są odpowiednie stylistycznie i znaczeniowo. Wielkie litery w zaimkach odnoszonych do osób boskich są dopuszczalną konwencją redakcyjną; nie wynikają z greki, lecz nie zmieniają sensu.
