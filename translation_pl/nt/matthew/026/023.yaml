  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: pl
  text: 'On odpowiedział: „Ten, który razem ze mną zanurzył rękę w misie[a], właśnie ten mnie zdradzi[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „w półmisku”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „wyda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Imiesłów z czasownikiem osobowym tworzy typową semityzującą formułę wypowiedzi; naturalny polski oddaje ją jednym czasownikiem.
- source_word: ἐμβάψας
  choice: zanurzył
  rationale: Aorystyczny imiesłów wskazuje na dokonaną czynność rozpoznawczą; „zanurzył” naturalnie opisuje włożenie ręki do naczynia.
- source_word: μετ’ ἐμοῦ
  choice: razem ze mną
  rationale: Oddaje towarzyszenie wyrażone przez μετά z dopełniaczem i podkreśla wspólność czynności.
- source_word: τὴν χεῖρα
  choice: rękę
  rationale: W polszczyźnie nie trzeba dodawać zaimka dzierżawczego, ponieważ naturalnie chodzi o rękę wykonawcy czynności.
- source_word: ἐν τῷ τρυβλίῳ
  choice: w misie
  rationale: τρύβλιον oznacza naczynie na potrawę, misę lub półmisek; „misa” jest jasnym i odpowiednim kontekstowo określeniem.
- source_word: οὗτός
  choice: właśnie ten
  rationale: Zaimek wskazujący ma siłę emfatyczną; „właśnie ten” zachowuje nacisk bez nienaturalnej dosłowności.
- source_word: παραδώσει
  choice: zdradzi
  rationale: W kontekście wydania Jezusa czasownik opisuje zdradzieckie przekazanie go przeciwnikom; „zdradzi” przekazuje sens kontekstowy, a dosłowniejszą możliwość zachowano w przypisie.
theological_decisions:
- issue: Znaczenie παραδίδωμι w odniesieniu do Judasza
  choice: zdradzi
  alternative: wyda
  rationale: Czasownik zasadniczo może znaczyć „wydać/przekazać”, lecz w tej relacji i kontekście męki czyn ma charakter zdrady. Tekst główny oddaje sens kontekstowy, a przypis zachowuje szerszą wartość leksykalną.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Konstrukcja „właśnie ten” zachowuje emfatyczne οὗτός. Szyk zdania pozostaje naturalny po polsku, a zarazem bliski strukturze greckiej.
