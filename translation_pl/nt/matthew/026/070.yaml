review_pass:
  verdict: revise
  source_fidelity: Greckie ἠρνήσατο oznacza, że Piotr zaprzeczył wcześniejszemu oskarżeniu; domyślny przedmiot może być w polszczyźnie wyrażony jako „temu”, bez dopowiadania, że chodzi o Jezusa. „Wobec wszystkich” trafnie oddaje ἔμπροσθεν πάντων, a „Nie wiem, co mówisz” zachowuje sens τί λέγεις.
  naturalness: Zdanie jest zasadniczo płynne, lecz „zaparł się wobec wszystkich” pozostawia w nowoczesnej polszczyźnie nienaturalnie niedookreślony czasownik, który zwykle wymaga wskazania osoby lub rzeczy, której ktoś się zapiera. „Zaprzeczył temu” jest idiomatyczne i jasno nawiązuje do bezpośrednio poprzedzającego zarzutu.
  terminology: Nie ma tu utrwalonego terminu teologicznego wymagającego zachowania. „Zaprzeczył temu” unika zarówno zbyt wąskiego „zaparł się Jezusa”, jak i niejasnego bezdopełnieniowego „zaparł się”.
  issues:
