  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: pl
  text: 'On jednak zaprzeczył temu wobec wszystkich, mówiąc: „Nie wiem, co mówisz”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: zaparł się
  rationale: W kontekście Piotrowego zaparcia się czasownik ἀρνέομαι naturalnie oddaje polskie „zaprzeć się”. Konstrukcja pozostaje bez wyraźnie dopowiedzianego dopełnienia, podobnie jak tekst grecki, a kontekst wskazuje, że Piotr odrzuca postawiony mu zarzut.
- source_word: ἔμπροσθεν πάντων
  choice: wobec wszystkich
  rationale: Wyrażenie oznacza publiczne zaprzeczenie w obecności wszystkich zgromadzonych; „wobec wszystkich” jest naturalne i zachowuje ten sens.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów „mówiąc” wiernie zachowuje zależność składniową greckiego λέγων i brzmi naturalnie w polskiej narracji.
- source_word: Οὐκ οἶδα
  choice: Nie wiem
  rationale: Bezpośredni, idiomatyczny odpowiednik zanegowanego czasownika οἶδα.
- source_word: τί λέγεις
  choice: co mówisz
  rationale: Dosłownie i naturalnie oddaje greckie sformułowanie, nie rozszerzając go do interpretacyjnego „o czym mówisz” ani „co masz na myśli”.
theological_decisions:
- issue: Przedmiot zaparcia się Piotra
  choice: 'Pozostawiono czasownik bez dopowiedzianego przedmiotu: „zaparł się”.'
  alternative: „zaprzeczył temu” albo „zaparł się Jezusa”
  rationale: Greka nie podaje wyraźnego dopełnienia. „Zaprzeczył temu” precyzowałoby, że chodzi jedynie o zarzut służącej, natomiast „zaparł się Jezusa” wprowadzałoby obiekt z szerszego kontekstu. Bezdopełnieniowe „zaparł się” zachowuje napięcie i jest w tym kontekście zrozumiałe po polsku.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Zachowano formalną bliskość wobec greckiego tekstu bez nienaturalnej dosłowności.
