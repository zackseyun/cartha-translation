    rationale: Choć kontekst pozwala zrozumieć wypowiedź, współczesne „zaprzeć się” zwykle łączy się z dopełnieniem, np. „zaprzeć się czegoś/kogoś”. Grecki domyślny przedmiot to bezpośrednio postawione oskarżenie; polskie „zaprzeczył temu” wyraża go bez interpretacyjnego rozszerzenia.
