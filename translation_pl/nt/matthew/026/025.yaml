  source_fidelity: Korekta jest potrzebna przede wszystkim w odniesieniu do ὁ παραδιδοὺς αὐτόν. Forma „który miał Go wydać” przesuwa czyn w przyszłość i może sugerować konieczność lub zamiar, podczas gdy imiesłów teraźniejszy określa Judasza jako tego, który wydaje Jezusa. „który Go wydawał” zachowuje aspekt trwającego działania bez dopowiadania jego charakteru jako „zdrady”. Odpowiedź Σὺ εἶπας należy pozostawić pośrednią; „Ty to powiedziałeś” bliżej oddaje wyraźne σὺ niż „Sam to powiedziałeś”.
  naturalness: Proponowany tekst pozostaje współczesny, zwięzły i godny. „Odezwał się” naturalnie oddaje narracyjne ἀποκριθεὶς ... εἶπεν bez sztucznego pleonazmu. Usunięto zbędną kropkę po pytajniku zamykającym cytowaną wypowiedź.
  terminology: „Rabbi” właściwie zachowuje greckie ῥαββί. „Wydawał” jest neutralnym odpowiednikiem παραδίδωμι i nie narzuca bardziej interpretacyjnego „zdradzał”. Wielka litera w „Go” jest dopuszczalna w polskim stylu biblijnym.
