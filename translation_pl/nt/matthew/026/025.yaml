  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: pl
  text: 'Wtedy Judasz, który Go wydawał, odezwał się: „Chyba nie ja, Rabbi?” Jezus mu odpowiedział: „Ty to powiedziałeś”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: który miał Go wydać
  rationale: Imiesłów wskazuje Judasza jako tego, który wydaje/zdradza Jezusa; polska konstrukcja oddaje jego rolę w rozwijającym się wydarzeniu bez nienaturalnego „wydający Go”.
- source_word: Μήτι ἐγώ εἰμι
  choice: Chyba nie ja
  rationale: Μήτι sygnalizuje pytanie oczekujące odpowiedzi przeczącej; zwięzła, naturalna polszczyzna zachowuje tę wymowę.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Zachowano semicki tytuł obecny w tekście greckim, zamiast interpretacyjnie zastępować go słowem „Nauczyciel”.
- source_word: Σὺ εἶπας
  choice: Sam to powiedziałeś
  rationale: Idiomatycznie oddaje dosłowne „Ty powiedziałeś”, zachowując powściągliwy i pośredni charakter odpowiedzi.
theological_decisions:
- issue: Charakter odpowiedzi Jezusa „Σὺ εἶπας”
  choice: Sam to powiedziałeś
  alternative: Tak, to ty
  rationale: Nie zamieniono tej formuły w bezpośrednie „tak”, ponieważ grecki tekst pozostawia odpowiedź pośrednią i retorycznie napiętą.
- issue: Określenie czynu Judasza
  choice: wydać
  alternative: zdradzić
  rationale: „Wydać” bliżej odpowiada podstawowemu znaczeniu παραδίδωμι w narracji o przekazaniu Jezusa władzom, nie usuwając kontekstu zdrady.
translation_notes:
  register: Współczesna, godna i zwięzła polszczyzna dialogowa. Pominięto pleonastyczne „odpowiadając, powiedział”, oddając ἀποκριθεὶς ... εἶπεν naturalnym „zapytał”. Wielką literę w zaimku „Go” zastosowano zgodnie z utrwalonym polskim stylem biblijnym.
