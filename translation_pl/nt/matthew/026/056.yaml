id: MAT.26.56
reference: Matthew 26:56
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: pl
  text: A wszystko to się stało, aby wypełniły się Pisma proroków. Wtedy wszyscy uczniowie opuścili go[a] i uciekli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „porzucili go”; imiesłów ἀφέντες może w tym kontekście wyrażać mocniejszy sens porzucenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: A wszystko to
  rationale: Naturalny polski zwrot odnosi się do całej poprzedzającej sytuacji, a „a” oddaje łagodną funkcję łączącą δέ bez nadmiernego wzmacniania przeciwstawienia.
- source_word: γέγονεν
  choice: się stało
  rationale: Polski czas przeszły w tej konstrukcji naturalnie wyraża wydarzenie dokonane, którego skutek pozostaje istotny w chwili wypowiedzi.
- source_word: ἵνα πληρωθῶσιν
  choice: aby wypełniły się
  rationale: Konstrukcja zachowuje celowo-skutkowy charakter ἵνα z trybem łączącym oraz tradycyjny, lecz nadal zrozumiały język wypełnienia Pism.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Pisma proroków
  rationale: „Pisma” jasno wskazują na święte teksty, a zwięzły dopełniacz „proroków” nie rozstrzyga ponad tekstem, czy chodzi o to, co prorocy napisali, czy co zostało przez nich przekazane.
- source_word: τότε
  choice: Wtedy
  rationale: Oddaje następstwo wydarzeń w narracji w sposób naturalny dla współczesnej polszczyzny.
- source_word: οἱ μαθηταὶ πάντες
  choice: wszyscy uczniowie
  rationale: Zachowuje wyraźną powszechność πάντες bez dodawania niewystępującego w grece zaimka „jego”.
- source_word: ἀφέντες αὐτὸν
  choice: opuścili go
  rationale: Oddaje pozostawienie Jezusa przez uczniów, zachowując możliwość mocniejszego odcienia porzucenia, wskazaną w przypisie.
- source_word: ἔφυγον
  choice: uciekli
  rationale: Jest to bezpośredni i naturalny odpowiednik czasownika φεύγω, zachowujący gwałtowność reakcji uczniów.
theological_decisions:
- issue: Wypełnienie prorockich Pism
  choice: aby wypełniły się Pisma proroków
  alternative: aby spełniło się to, co napisali prorocy
  rationale: Wybrane brzmienie zachowuje jawny w tekście motyw wypełnienia oraz określenie „Pisma”, nie zastępując go interpretującą parafrazą.
translation_notes:
  register: Współczesny, godny i przejrzysty rejestr narracyjny. Zachowano biblijne określenie „Pisma proroków”, ale uniknięto archaicznej składni. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną praktyką przekładową.
