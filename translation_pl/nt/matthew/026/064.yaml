  terminology: „Moc” jako kapitalizowane, pełne czci omówienie Boga jest właściwe i nie rozszerza tekstu do jawnego „Boga”. „Syn Człowieczy” oraz „po prawicy” zachowują terminologię i intertekstualne brzmienie źródła.
