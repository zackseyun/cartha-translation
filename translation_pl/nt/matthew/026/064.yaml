id: MAT.26.64
reference: Matthew 26:64
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: pl
  text: 'Jezus mu odpowiedział: „Ty to powiedziałeś[a]. Lecz mówię wam: odtąd ujrzycie Syna Człowieczego siedzącego po prawicy Mocy[b] i przychodzącego na obłokach nieba[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „Powiedziałeś to”. Greckie wyrażenie jest idiomatyczną odpowiedzią twierdzącą.'
    reason: lexical_alternative
  - marker: b
    text: „Moc” jest pełnym czci określeniem odnoszącym się do Boga.
    reason: cultural_note
  - marker: c
    text: Nawiązanie do Dn 7,13 i Ps 110,1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Sam to powiedziałeś
  rationale: Zachowuje idiomatyczną, zasadniczo twierdzącą odpowiedź bez sprowadzania jej do bezwarunkowego „tak”; naturalnie oddaje też dosłowny kształt greckiego wyrażenia.
- source_word: πλὴν
  choice: Lecz
  rationale: Wyraźnie zaznacza przejście od odpowiedzi udzielonej arcykapłanowi do uroczystej zapowiedzi, zachowując przeciwstawny sens spójnika.
- source_word: ἀπ’ ἄρτι
  choice: odtąd
  rationale: Zwięźle i naturalnie wskazuje na nowy stan rzeczy rozpoczynający się od tej chwili, bez zawężania go wyłącznie do natychmiastowego spełnienia.
- source_word: ὄψεσθε
  choice: ujrzycie
  rationale: Oddaje przyszłą formę czasownika ὁράω; „ujrzycie” pasuje do uroczystego rejestru wypowiedzi, pozostając zrozumiałe we współczesnej polszczyźnie.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Syna Człowieczego
  rationale: Zachowuje utrwalony tytuł i jego wyraźne nawiązanie do Księgi Daniela.
- source_word: καθήμενον
  choice: siedzącego
  rationale: Bezpośrednio oddaje imiesłów i w połączeniu z „po prawicy” zachowuje obraz wywyższenia oraz królewskiego autorytetu.
- source_word: ἐκ δεξιῶν
  choice: po prawicy
  rationale: Jest to utrwalony polski idiom biblijny oznaczający miejsce czci, bliskości i władzy.
- source_word: τῆς δυνάμεως
  choice: Mocy
  rationale: Zachowuje pełne szacunku omówienie odnoszące się do Boga, nie zastępując go interpretacyjnym dopowiedzeniem „Boga”.
- source_word: ἐρχόμενον
  choice: przychodzącego
  rationale: Bezpośrednio oddaje imiesłów i zachowuje eschatologiczne oraz Danielowe brzmienie wypowiedzi.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: na obłokach nieba
  rationale: Przejrzyście oddaje konstrukcję grecką i zachowuje nawiązanie do Dn 7,13.
theological_decisions:
- issue: Siła odpowiedzi Σὺ εἶπας udzielonej arcykapłanowi
  choice: 'Twierdząca, lecz zachowująca własne sformułowanie Jezusa odpowiedź: „Sam to powiedziałeś”'
  alternative: Jednoznaczne „Tak” albo potraktowanie słów jako wymijającej odmowy odpowiedzi
  rationale: Wyrażenie pełni funkcję potwierdzenia, ale proste „tak” zaciera jego formę, a odczytanie go jako uniku osłabia wymowę kontekstu.
- issue: Desygnat określenia „Moc” (τῆς δυνάμεως)
  choice: Zachowanie „Mocy” jako pełnego czci omówienia odnoszącego się do Boga
  alternative: Jawne „Boga” lub „Wszechmocnego”
  rationale: Greka najpewniej posługuje się żydowskim omówieniem imienia Boga. Przekład zachowuje powściągliwość tekstu źródłowego.
- issue: Zakres czasowy słów „ujrzycie” w odniesieniu do zasiadania i przychodzenia
  choice: Zachowanie obu obrazów razem bez narzucania jednego schematu czasowego
  alternative: Ograniczenie całości do najbliższej przyszłości albo wyłącznie do powtórnego przyjścia
  rationale: Oba imiesłowy stanowią w grece wspólną treść tego, co adresaci ujrzą; przekład nie rozstrzyga spornej chronologii spełnienia.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr z zachowaniem utrwalonych zwrotów biblijnych („Syn Człowieczy”, „po prawicy”, „obłoki nieba”). Wielka litera w słowie „Moc” sygnalizuje tytułowe, zastępcze odniesienie do Boga. Markery przypisów umieszczono bezpośrednio przy odpowiednich wyrażeniach.
