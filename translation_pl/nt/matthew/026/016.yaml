  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: pl
  text: Od tej chwili szukał sposobności, żeby Go wydać[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zdradzić Go”. Grecki czasownik dosłowniej znaczy „wydać” lub „przekazać w czyjeś ręce”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Od tej chwili
  rationale: Naturalnie oddaje punkt początkowy trwającego odtąd działania; możliwe także „odtąd” lub „od tego czasu”.
- source_word: ἐζήτει
  choice: szukał
  rationale: Polski czasownik niedokonany zachowuje ciągły lub powtarzający się charakter greckiego imperfectum.
- source_word: εὐκαιρίαν
  choice: sposobności
  rationale: Oddaje dogodną, odpowiednią okazję; w tym kontekście brzmi naturalnie w połączeniu z „szukał”.
- source_word: ἵνα
  choice: żeby
  rationale: Naturalnie wyraża cel działania w nowoczesnej polszczyźnie.
- source_word: αὐτὸν
  choice: Go
  rationale: Zaimek odnosi się w kontekście do Jezusa; wielka litera jest zgodna z godnym polskim rejestrem biblijnym, nie zmieniając sensu greckiego.
- source_word: παραδῷ
  choice: wydać
  rationale: „Wydać” zachowuje podstawowy sens przekazania kogoś w cudze ręce i nie zawęża czasownika wyłącznie do pojęcia zdrady.
theological_decisions:
- issue: Znaczenie παραδῷ w odniesieniu do działania Judasza
  choice: wydać
  alternative: zdradzić
  rationale: Kontekst wskazuje na zdradę, lecz grecki czasownik ma szerszy sens „wydać/przekazać”. Tekst główny zachowuje tę szerszą wartość leksykalną, a interpretacyjnie trafną alternatywę podaje przypis.
translation_notes:
  register: Współczesny, naturalny i godny rejestr biblijny. Konstrukcja „szukał sposobności” jest zrozumiała, a zarazem niepotoczna; niedokonaność czasownika zachowuje aspekt trwającego poszukiwania.
