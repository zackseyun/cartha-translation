review_pass:
  verdict: approve
  source_fidelity: „Naradzili się” trafnie oddaje συνεβουλεύσαντο jako wspólną naradę prowadzącą do zamierzonego działania. Konstrukcja „żeby ... schwytać ... i zabić” zachowuje relację celu wyrażoną przez ἵνα z koniunktiwem. „Podstępem” właściwie oddaje δόλῳ, a „schwytać” i „zabić” odpowiadają odpowiednio κρατήσωσιν i ἀποκτείνωσιν.
  naturalness: Zdanie jest płynne, współczesne i odpowiednie dla narracji biblijnej. Elipsa dopełnienia przy drugim bezokoliczniku („i zabić [go]”) jest w języku polskim naturalna i jednoznaczna.
  terminology: Imię „Jezusa” zapisano poprawnie. Dobór słów nie narzuca interpretacji doktrynalnej ani nie dodaje elementów niewystępujących w greckim tekście. „Podstępem” jest lepsze od „skrycie”, ponieważ zachowuje sens oszustwa/fortelu.
