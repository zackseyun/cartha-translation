  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: pl
  text: I naradzili się, żeby podstępem schwytać Jezusa i zabić.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: naradzili się
  rationale: Naturalny polski odpowiednik wspólnego odbycia narady i powzięcia zamiaru; nie przesądza dodatkowo o formalnym „spisku”.
- source_word: δόλῳ
  choice: podstępem
  rationale: Oddaje użycie oszustwa lub fortelu jako sposobu działania; jest trafniejsze i bardziej naturalne niż dosłowne „skrycie”.
- source_word: κρατήσωσιν
  choice: schwytać
  rationale: W tym kontekście oznacza pochwycenie lub ujęcie Jezusa; „schwytać” zachowuje siłę czasownika i brzmi naturalnie.
- source_word: ἀποκτείνωσιν
  choice: zabić
  rationale: Bezpośredni, współczesny odpowiednik oznaczający pozbawienie życia.
theological_decisions:
- issue: Relacja celu wyrażona przez ἵνα
  choice: żeby podstępem schwytać Jezusa i zabić
  alternative: jak podstępem schwytać Jezusa i zabić
  rationale: ἵνα z trybem łączącym najprościej wyraża zamierzony cel narady. Przekład nie dodaje motywacji ani oceny teologicznej ponad tekst.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. Szyk zachowuje nacisk na podstęp jako sposób pojmania, a oba bezokoliczniki przedstawia jako cele narady.
