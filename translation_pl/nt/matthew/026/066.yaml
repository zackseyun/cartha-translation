  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: pl
  text: '„Jakie jest wasze zdanie?” Oni zaś odpowiedzieli: „Zasługuje na śmierć”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „Jest winien śmierci” lub „Podlega karze śmierci”. Grecki zwrot ma charakter prawnego orzeczenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Jakie jest wasze zdanie?
  rationale: Zwrot z δοκέω i celownikiem ὑμῖν pyta o opinię lub osąd. Polski odpowiednik jest naturalny, a zarazem w kontekście narady zachowuje odcień pytania o werdykt.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Oni zaś odpowiedzieli
  rationale: Imiesłów ἀποκριθέντες z εἶπαν oddano jednym naturalnym czasownikiem. δέ ma tu lekką funkcję łączącą i kontrastującą, którą dobrze wyraża „zaś”.
- source_word: Ἔνοχος θανάτου
  choice: Zasługuje na śmierć
  rationale: ἔνοχος z dopełniaczem θανάτου jest formułą orzeczenia oznaczającą winę lub podleganie karze śmierci. Wybrane sformułowanie jest naturalne we współczesnej polszczyźnie i jasno przekazuje skazujący osąd, natomiast przypis zachowuje dosłowniejsze możliwości.
- source_word: ἐστίν
  choice: Zasługuje
  rationale: Grecką kopułę zawartą w orzeczeniu oddano zgodnie z polską składnią formą czasownikową. Domyślnym podmiotem pozostaje Jezus, wskazany jednoznacznie przez kontekst.
theological_decisions:
- issue: Prawny charakter orzeczenia rady
  choice: Zasługuje na śmierć
  alternative: Jest winien śmierci; podlega karze śmierci
  rationale: Wypowiedź przedstawia werdykt zgromadzenia, nie rozstrzyga zaś rzeczywistej winy Jezusa przed Bogiem ani znaczenia jego śmierci. Przekład zachowuje perspektywę mówiących i nie dodaje późniejszej interpretacji teologicznej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Pytanie brzmi naturalnie po polsku, a odpowiedź zachowuje zwięzłość i stanowczość sądowego werdyktu.
