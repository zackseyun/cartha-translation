  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: pl
  text: 'Wtedy Jezus przyszedł z nimi na miejsce zwane Getsemani i powiedział uczniom: „Usiądźcie tutaj, a ja tymczasem odejdę tam i będę się modlił”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłowniej: „Usiądźcie tutaj, aż odejdę tam i pomodlę się”. Greckie wyrażenie ἕως οὗ znaczy „aż do czasu, gdy” lub „dopóki”; przekład główny naturalnie wyraża równoczesne oczekiwanie uczniów.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, który zachowuje kolejność wydarzeń w narracji.
- source_word: ἔρχεται
  choice: przyszedł
  rationale: Grecki czas teraźniejszy historyczny oddano polskim czasem przeszłym, naturalnym w narracji i niewprowadzającym zmiany czasowej względem kontekstu.
- source_word: μετ’ αὐτῶν
  choice: z nimi
  rationale: Bezpośrednio wyraża towarzyszenie.
- source_word: χωρίον
  choice: miejsce
  rationale: Termin oznacza miejsce, teren lub posiadłość; szerokie „miejsce” zachowuje brzmienie Mateusza bez dopowiadania, że był to ogród.
- source_word: λεγόμενον Γεθσημανί
  choice: zwane Getsemani
  rationale: Naturalna polska formuła nazewnicza; imię miejsca zapisano w utrwalonej polskiej postaci.
- source_word: λέγει
  choice: powiedział
  rationale: Drugi grecki czas teraźniejszy historyczny oddano konsekwentnie polskim czasem przeszłym.
- source_word: Καθίσατε αὐτοῦ
  choice: Usiądźcie tutaj
  rationale: Zachowuje prosty rozkaz oraz przestrzenne wskazanie miejsca.
- source_word: ἕως οὗ
  choice: a ja tymczasem
  rationale: Naturalnie wyraża czasowe oczekiwanie uczniów podczas odejścia i modlitwy Jezusa; bardziej dosłowne „dopóki” podano w przypisie.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: odejdę tam i będę się modlił
  rationale: Oddaje oddalenie się do wskazanego miejsca i następującą tam modlitwę, unikając nienaturalnej w polszczyźnie konstrukcji imiesłowowej.
theological_decisions:
- issue: Charakter miejsca Getsemani
  choice: miejsce
  alternative: ogród
  rationale: Mateusz używa szerokiego rzeczownika χωρίον i nie nazywa tego miejsca ogrodem; „ogród” przenosiłby do tekstu Mateusza szczegół znany z J 18,1.
- issue: Czas narracji w czasownikach ἔρχεται i λέγει
  choice: polski czas przeszły
  alternative: 'teraźniejszość historyczna: „przychodzi” i „mówi”'
  rationale: Obie formy greckie są teraźniejszością historyczną. Polski czas przeszły zachowuje ich funkcję narracyjną bez sugerowania, że wydarzenie trwa obecnie.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano proste słownictwo i przestrzenny kontrast między „tutaj” a „tam”; nie dodano określenia „ogród”.
