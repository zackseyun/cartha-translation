  source_fidelity: Greckie ἠρνήσατο μετὰ ὅρκου oznacza, że Piotr ponownie się zaparł, czyniąc to z przysięgą. „Pod przysięgą” nie oddaje tu właściwie konstrukcji μετὰ ὅρκου, ponieważ w polszczyźnie zwykle sugeruje formalne zeznanie lub procedurę prawną. Cytat „Nie znam tego człowieka” wiernie oddaje Οὐκ οἶδα τὸν ἄνθρωπον; „tego” jest naturalnym polskim sposobem wskazania znanego z kontekstu referenta i zachowuje dystansujący wydźwięk.
  naturalness: „Zaparł się pod przysięgą” jest mniej naturalne i kolokacyjnie może znaczyć „będąc pod przysięgą”. Konstrukcja „zaparł się, składając przysięgę” jest współczesna, jasna i nie sugeruje sądu.
  terminology: „Zaparł się” trafnie oddaje ἠρνήσατο w tym kontekście. „Przysięga” trafnie odpowiada ὅρκος. Nie ma potrzeby dodawania imienia Jezusa ani zastępowania „człowieka” zaimkiem.
