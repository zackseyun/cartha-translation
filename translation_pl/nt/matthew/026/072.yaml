  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: pl
  text: 'I znowu zaparł się, składając przysięgę: „Nie znam tego człowieka”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Zachowuje prostą współrzędność narracyjną bez dodawania wyraźniejszego następstwa czasowego.
- source_word: πάλιν
  choice: znowu
  rationale: Naturalnie i bezpośrednio wskazuje na powtórzenie zaparcia się Piotra.
- source_word: ἠρνήσατο
  choice: zaparł się
  rationale: W kontekście zaparcia się znajomości z Jezusem jest to idiomatyczny polski odpowiednik czasownika oznaczającego wyparcie się lub zaprzeczenie; następująca wypowiedź podaje treść zaparcia.
- source_word: μετὰ ὅρκου
  choice: pod przysięgą
  rationale: Oddaje, że Piotr potwierdził swoje zaprzeczenie przysięgą, bez sugerowania formalnej procedury sądowej.
- source_word: ὅτι
  choice: ':'
  rationale: Dwukropek i cytat bezpośredni naturalnie wprowadzają treść zaparcia w języku polskim.
- source_word: Οὐκ οἶδα
  choice: Nie znam
  rationale: Polskie „znać” jest właściwe w odniesieniu do znajomości osoby i odpowiada sensowi greckiego οἶδα w tym kontekście.
- source_word: τὸν ἄνθρωπον
  choice: tego człowieka
  rationale: Wyrażenie zachowuje rzeczownik „człowiek” i dystansujący charakter słów Piotra; polski biernik określonego referenta naturalnie przyjmuje tu formę „tego człowieka”.
theological_decisions:
- issue: Określenie Jezusa w słowach zaparcia się Piotra
  choice: tego człowieka
  alternative: go; Jezusa
  rationale: Greka używa wyraźnie rzeczownika ἄνθρωπος. Zachowanie „człowieka” oddaje dystansujący ton zaparcia; zastąpienie go imieniem „Jezus” lub zaimkiem osłabiłoby tę cechę.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Konstrukcja „zaparł się pod przysięgą” jest zrozumiała i zachowuje podniosły ciężar sceny; cytat brzmi naturalnie po polsku.
