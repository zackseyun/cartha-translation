  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: pl
  text: Można było przecież sprzedać to za znaczną sumę[a], a pieniądze dać ubogim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „za wiele” lub „za wysoką cenę”. W tekście greckim występuje dopełniacz ceny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: można było
  rationale: Imperfectum czasownika δύναμαι wyraża niezrealizowaną możliwość w przeszłości; bezosobowe „można było” brzmi naturalnie po polsku.
- source_word: γὰρ
  choice: przecież
  rationale: Oddaje objaśniające i argumentacyjne powiązanie z poprzednią skargą.
- source_word: τοῦτο
  choice: to
  rationale: Zachowuje zaimek wskazujący tekstu greckiego bez dopowiadania rzeczownika „olejek” lub „pachnidło”.
- source_word: πραθῆναι
  choice: sprzedać
  rationale: Bezokolicznik aorystu strony biernej w połączeniu z bezosobowym „można było” najnaturalniej oddaje się po polsku czynną formą bezokolicznika.
- source_word: πολλοῦ
  choice: za znaczną sumę
  rationale: Dopełniacz ceny wskazuje na wysoką kwotę; sformułowanie jest współczesne, naturalne i nie precyzuje niepodanej wartości.
- source_word: δοθῆναι
  choice: dać
  rationale: Drugi bezokolicznik aorystu strony biernej podporządkowany ἐδύνατο oddano zgodnie z naturalną polską składnią.
- source_word: πτωχοῖς
  choice: ubogim
  rationale: Rzeczownikowo użyty przymiotnik w celowniku liczby mnogiej oznacza osoby ubogie; „ubogim” jest zwięzłe i godne stylistycznie.
theological_decisions:
- issue: Domyślny przedmiot czynności „dać”
  choice: a pieniądze dać ubogim
  alternative: i dać ubogim
  rationale: Grecka konstrukcja skrótowo łączy sprzedaż przedmiotu z przekazaniem ubogim tego, co uzyskano ze sprzedaży. Dodanie „pieniądze” jasno oddaje zamierzony sens bez wprowadzania rozstrzygnięcia teologicznego.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Partykuła „przecież” zachowuje argumentacyjny ton wypowiedzi, a „znaczna suma” unika zarówno archaizmu, jak i potoczności.
