  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: pl
  text: Piotr zaś szedł za Nim z daleka, aż do dziedzińca arcykapłana. Gdy wszedł do środka, siedział razem ze sługami[a], aby zobaczyć, jak to się skończy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ze służbą”, „z pomocnikami” lub „ze strażnikami”. Greckie ὑπηρέται może oznaczać służących, podległych urzędników albo osoby wykonujące polecenia; kontekst nie rozstrzyga dokładnie ich funkcji.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „koniec”. Możliwe też: „wynik” lub „jaki będzie koniec”. Greckie τὸ τέλος może tutaj odnosić się do tego, jak zakończą się wydarzenia dotyczące Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: szedł za Nim
  rationale: Imperfectum przedstawia trwającą czynność w tle; polska forma niedokonana oddaje ten aspekt naturalniej niż bardziej statyczne „podążał”.
- source_word: ἀπὸ μακρόθεν
  choice: z daleka
  rationale: Naturalny polski odpowiednik wyrażający fizyczny dystans.
- source_word: ἕως τῆς αὐλῆς
  choice: aż na dziedziniec
  rationale: „Aż” zachowuje znaczenie osiągniętej granicy, a αὐλή w tym kontekście oznacza wewnętrzny dziedziniec posiadłości.
- source_word: ἀρχιερέως
  choice: arcykapłana
  rationale: Utrwalony i precyzyjny polski odpowiednik tytułu ἀρχιερεύς w opisie męki Jezusa.
- source_word: εἰσελθὼν ἔσω
  choice: kiedy wszedł do środka
  rationale: Imiesłów aorystu z ἔσω wskazuje czynność poprzedzającą siedzenie; zdanie czasowe brzmi po polsku naturalnie.
- source_word: ἐκάθητο
  choice: siedział
  rationale: Imperfectum wskazuje na trwającą pozycję lub czynność, co dobrze oddaje polski czasownik niedokonany.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: razem ze sługami
  rationale: ὑπηρέται oznacza osoby pełniące podrzędną służbę lub wykonujące polecenia; „słudzy” zachowują szerokość terminu bez przesądzania, czy byli formalnymi strażnikami.
- source_word: ἰδεῖν
  choice: żeby zobaczyć
  rationale: Bezokolicznik wyraża cel; „żeby zobaczyć” jest bezpośrednie i naturalne we współczesnej polszczyźnie.
- source_word: τὸ τέλος
  choice: jaki będzie koniec
  rationale: Oddaje dosłowne znaczenie τέλος, a zarazem w tym kontekście naturalnie wskazuje na wynik wydarzeń, nie usuwając wieloznaczności.
theological_decisions:
- issue: Odniesienie zaimka αὐτῷ
  choice: Nim
  alternative: nim
  rationale: Zaimek odnosi się do Jezusa; zapis wielką literą odpowiada polskiej konwencji tekstów biblijnych, nie dodając tytułu ani objaśnienia nieobecnego w grece.
- issue: Zakres znaczeniowy τὸ τέλος
  choice: jaki będzie koniec
  alternative: jaki będzie wynik
  rationale: Wybrano brzmienie bliższe greckiej formie, aby nie zawężać sensu wyłącznie do wyniku postępowania i zachować możliwe napięcie narracyjne.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano narracyjną płynność polszczyzny, niedokonany charakter czasowników ἠκολούθει i ἐκάθητο oraz autentyczną niejednoznaczność ὑπηρέται i τὸ τέλος. Markery przypisów umieszczono przy wyrażeniach, których faktycznie dotyczą.
