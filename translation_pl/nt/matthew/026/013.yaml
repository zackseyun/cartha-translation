  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: pl
  text: 'Zaprawdę mówię wam: gdziekolwiek na całym świecie będzie głoszona ta dobra nowina[a], będzie się również mówić o tym, co uczyniła ta kobieta, na jej pamiątkę[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „ta Ewangelia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „będzie się również mówić o tym, co uczyniła ta kobieta, jako o pamiątce dla niej”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: Tradycyjna, a zarazem nadal zrozumiała polska formuła uroczystego zapewnienia w wypowiedziach Jezusa; zachowuje siłę greckiego ἀμήν.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Naturalnie i bezpośrednio oddaje formułę osobistego zwrotu do słuchaczy.
- source_word: ὅπου ἐὰν
  choice: gdziekolwiek
  rationale: Zwięźle zachowuje nieokreślony sens miejsca wyrażony przez ὅπου z ἐάν.
- source_word: κηρυχθῇ
  choice: będzie głoszona
  rationale: Oddaje stronę bierną i publiczny, obwieszczający charakter κηρύσσω; po polsku brzmi naturalniej niż bardziej techniczne „będzie proklamowana”.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ta dobra nowina
  rationale: Oddaje podstawowy sens εὐαγγέλιον w przystępnym współczesnym języku; tradycyjne „ta Ewangelia” pozostaje uzasadnioną alternatywą i zostało wskazane w przypisie.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: na całym świecie
  rationale: To idiomatyczny polski odpowiednik szerokiego, powszechnego zakresu greckiego wyrażenia.
- source_word: λαληθήσεται
  choice: opowie się również
  rationale: Bezosobowa forma oddaje przyszły sens bierny, a w połączeniu z czynem stanowiącym treść wypowiedzi brzmi naturalnie po polsku.
- source_word: ὃ ἐποίησεν αὕτη
  choice: o tym, co uczyniła ta kobieta
  rationale: Wyraźnie wskazuje czyn jako przedmiot opowiadania, a αὕτη odnosi do kobiety wspomnianej w kontekście.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: na jej pamiątkę
  rationale: Naturalnie zachowuje upamiętniający sens μνημόσυνον i celowy odcień εἰς.
theological_decisions:
- issue: Sposób oddania εὐαγγέλιον
  choice: dobra nowina
  alternative: Ewangelia
  rationale: „Dobra nowina” bezpośrednio oddaje sens greckiego rzeczownika i pozostaje zrozumiała dla zwykłego czytelnika, nie wykluczając jego utrwalonego teologicznego znaczenia; alternatywę tradycyjną zachowano w przypisie.
- issue: Związek εἰς μνημόσυνον αὐτῆς z opowiadaniem o czynie
  choice: na jej pamiątkę
  alternative: jako pamiątka po niej
  rationale: Greka dopuszcza odcień celu lub rezultatu upamiętnienia. Tekst główny zachowuje naturalne sformułowanie, a przypis sygnalizuje bardziej rzeczownikową alternatywę bez rozstrzygania ponad tekst.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano uroczyste „Zaprawdę”, natomiast pozostałą składnię ujęto naturalnie po polsku. Oba znaczniki przypisów [a] i [b] występują w tekście głównym.
