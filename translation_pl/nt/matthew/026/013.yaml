review_pass:
  verdict: revise
  source_fidelity: Tekst trafnie oddaje uroczystą formułę, nieokreślony zasięg miejsca, przyszły sens strony biernej, czyn kobiety oraz jego trwałe upamiętnienie. „Dobra nowina” jest dopuszczalnym, dosłownym odpowiednikiem εὐαγγέλιον. Zmiana „opowie się” na „będzie się również mówić” bliżej zachowuje ogólny sens λαληθήσεται („będzie się mówić”), bez niepotrzebnego zawężenia do opowiadania.
  naturalness: Proponowane brzmienie jest naturalne we współczesnej polszczyźnie i zachowuje godny rejestr. Konstrukcja „będzie się również mówić o tym” jest idiomatyczna i wyraźnie wiąże „na jej pamiątkę” z publicznym wspominaniem czynu.
  terminology: '„Zaprawdę”, „głoszona”, „dobra nowina” i „na jej pamiątkę” są trafne. Przypis b wymaga korekty: „pamiątka po niej” zwykle sugeruje, że kobieta już nie żyje, czego grecki tekst nie mówi; właściwsze jest „pamiątka dla niej” lub „ku jej pamięci”.'
  issues:
  - severity: medium
    issue: Przypis b używa sformułowania „jako o pamiątce po niej”.
    rationale: „Po niej” wnosi nieobecny w εἰς μνημόσυνον αὐτῆς odcień pośmiertności. Alternatywa powinna zachować sens „jako pamiątka dla niej/ku jej pamięci”.
  - severity: low
    issue: „Opowie się również” nieco zawęża sens λαληθήσεται.
    rationale: Czasownik λαλέω oznacza tu ogólnie mówienie o czynie. „Będzie się również mówić” jest bliższe źródłu i równie naturalne.
