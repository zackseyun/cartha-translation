  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: pl
  text: 'Niedługo potem podeszli ci, którzy tam stali, i powiedzieli Piotrowi: „Na pewno i ty jesteś jednym z nich, bo nawet twój sposób mówienia cię zdradza[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „czyni cię rozpoznawalnym”. Greckie λαλιά może oznaczać mowę, sposób mówienia lub akcent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Niedługo potem
  rationale: Naturalny polski odpowiednik wyrażenia czasowego oznaczającego, że upłynęła krótka chwila.
- source_word: δὲ
  choice: —
  rationale: Łagodny łącznik narracyjny; następstwo wydarzeń wystarczająco wyraża polski szyk i określenie „Niedługo potem”.
- source_word: προσελθόντες
  choice: podeszli
  rationale: Oddaje ruch w stronę Piotra, zwięźle i naturalnie w polskiej narracji.
- source_word: οἱ ἑστῶτες
  choice: ci, którzy tam stali
  rationale: Zachowuje opisowy charakter greckiego imiesłowu i nie zawęża grupy bardziej interpretacyjnym rzeczownikiem.
- source_word: εἶπον τῷ Πέτρῳ
  choice: powiedzieli Piotrowi
  rationale: Bezpośredni i naturalny odpowiednik greckiej konstrukcji z celownikiem.
- source_word: Ἀληθῶς
  choice: Na pewno
  rationale: Wyraża stanowcze przekonanie mówiących w naturalnym, współczesnym polskim dialogu.
- source_word: καὶ σὺ
  choice: i ty
  rationale: Zachowuje nacisk na przynależność Piotra do tej samej grupy.
- source_word: ἐξ αὐτῶν
  choice: jednym z nich
  rationale: Naturalnie wyraża przynależność do wskazanej grupy uczniów.
- source_word: καὶ γὰρ
  choice: bo nawet
  rationale: „Bo” wprowadza uzasadnienie, a „nawet” zachowuje emfatyczną funkcję καί.
- source_word: ἡ λαλιά σου
  choice: twój sposób mówienia
  rationale: λαλιά może oznaczać mowę, sposób mówienia albo akcent. Szersze „sposób mówienia” zachowuje tę niejednoznaczność lepiej niż samo „akcent”.
- source_word: δῆλόν σε ποιεῖ
  choice: cię zdradza
  rationale: Idiomaticzne polskie wyrażenie oznaczające, że sposób mówienia ujawnia tożsamość lub przynależność Piotra; sens dosłowny podano w przypisie.
theological_decisions: []
translation_notes:
  register: Współczesny, godny język narracyjny. Dialog brzmi naturalnie, a określenie „sposób mówienia” zachowuje zakres znaczeniowy greckiego λαλιά bez przesądzania, czy chodzi wyłącznie o akcent.
