  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: pl
  text: 'Jezus zaś powiedział do niego[a]: „Przyjacielu, zrób to, po co przyszedłeś”. Wtedy podeszli, pochwycili Jezusa i pojmali Go.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Przyjacielu, po co przyszedłeś?”. Greckie wyrażenie jest zwięzłe i może być rozumiane jako pytanie.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Przyjacielu
  rationale: Naturalny polski wołacz zachowuje powściągliwy sposób zwrócenia się do Judasza; w tym kontekście nie musi oznaczać serdecznej ani bliskiej przyjaźni.
- source_word: ἐφ’ ὃ πάρει
  choice: zrób to, po co przyszedłeś
  rationale: Zwięzła i eliptyczna fraza może mieć sens przyzwalająco-rozkazujący, ujawniający cel przybycia Judasza. Jej możliwe odczytanie pytajne zachowano w przypisie.
- source_word: προσελθόντες
  choice: podeszli
  rationale: Imiesłów aorystu opisuje zbliżenie się uczestników pojmania do Jezusa; polska forma osobowa naturalnie oddaje kolejność narracji.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: pochwycili Jezusa
  rationale: Grecki idiom oznacza fizyczne chwycenie kogoś w celu zatrzymania. „Pochwycili” jest naturalne, wyraźne i unika niezręcznego dosłownego kalkowania.
- source_word: ἐκράτησαν αὐτόν
  choice: pojmali Go
  rationale: κρατέω wskazuje tu na skuteczne schwytanie i zatrzymanie Jezusa. „Pojmali” zachowuje następstwo po fizycznym pochwyceniu, nie narzucając formalnoprawnego odcienia słowa „aresztowali”.
- source_word: δὲ
  choice: zaś
  rationale: δέ sygnalizuje łagodne przejście lub kontrast. „Zaś” brzmi godnie i naturalnie w narracji, bez nadmiernie ostrego przeciwstawienia.
theological_decisions:
- issue: Interpretacja odpowiedzi Jezusa skierowanej do Judasza
  choice: „Przyjacielu, zrób to, po co przyszedłeś”
  alternative: „Przyjacielu, po co przyszedłeś?”
  rationale: Tekst główny oddaje możliwy sens przyzwalająco-rozkazujący, nie łagodząc napięcia sceny. Ponieważ składnia grecka jest skrótowa i może być rozumiana pytajnie, alternatywę podano w przypisie zamiast rozstrzygać wieloznaczność bez zastrzeżenia.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze narracyjnym. Szyk „Jezus zaś” zachowuje płynne przejście, a kolejne czasowniki jasno przedstawiają zbliżenie się, fizyczne pochwycenie i pojmanie Jezusa.
