  source_fidelity: 'Tekst wiernie oddaje kolejność i sens greckiej narracji: odpowiedź Jezusa skierowaną do Judasza, następnie zbliżenie się grupy, fizyczne schwytanie Jezusa i jego pojmanie. „Zrób to, po co przyszedłeś” jest uzasadnionym głównym odczytaniem skrótowego ἐφ’ ὃ πάρει, a przypis właściwie zachowuje realną możliwość odczytania pytajnego.'
