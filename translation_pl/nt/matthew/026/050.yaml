  terminology: „Przyjacielu” trafnie oddaje Ἑταῖρε bez narzucania serdeczności. „Pochwycili” i „pojmali” zachowują fizyczny oraz skuteczny charakter czynności, nie wprowadzając dodatkowego formalnoprawnego sensu. Rejestr „Jezus zaś powiedział” jest godny, lecz nadal standardowy.
