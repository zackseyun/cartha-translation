translation_notes:
  register: Współczesny, naturalny i godny rejestr. Zdanie zachowuje aspekt niedokonany ἔλεγον oraz eliptyczną zwięzłość wypowiedzi „Nie podczas święta”. Nie dodano przypisów, ponieważ warianty „uroczystość/festiwal” i „zamieszki/tumult” nie wnoszą tu koniecznej informacji dla polskiego odbiorcy.
