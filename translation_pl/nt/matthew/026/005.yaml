  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: pl
  text: 'Mówili jednak: „Nie podczas święta, żeby wśród ludu nie wybuchł tumult”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Mówili
  rationale: Imperfectum ukazuje trwającą lub powtarzającą się wypowiedź w toku narady; polska forma niedokonana zachowuje ten aspekt.
- source_word: δέ
  choice: jednak
  rationale: Oddaje łagodny kontrast wobec zamiaru opisanego w poprzednim wersecie, a zarazem brzmi naturalnie w polskiej narracji.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Nie podczas święta
  rationale: Eliptyczne μή wyraża sprzeciw lub postanowienie, a ἐν z celownikiem ma tu sens czasowy. „Święto” naturalnie odnosi się w kontekście do Paschy.
- source_word: ἵνα μὴ
  choice: żeby nie
  rationale: Naturalna współczesna konstrukcja celowa wyraża zamiar uniknięcia przewidywanego skutku.
- source_word: θόρυβος
  choice: rozruchów
  rationale: Termin oznacza publiczne zamieszanie lub tumult. Liczba mnoga „rozruchy” jest idiomatyczna po polsku i przekazuje groźbę niepokojów społecznych bez przesądzania o pełnoskalowym buncie.
- source_word: γένηται
  choice: doszło do
  rationale: W połączeniu z θόρυβος czasownik γίνομαι oznacza zaistnienie lub powstanie czegoś; „doszło do” jest naturalnym polskim odpowiednikiem.
- source_word: ἐν τῷ λαῷ
  choice: wśród ludu
  rationale: Zachowuje społeczne i zbiorowe znaczenie λαός oraz podniosły, lecz zrozumiały rejestr biblijny.
