id: MAT.26.41
reference: Matthew 26:41
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: pl
  text: Czuwajcie i módlcie się, abyście nie weszli w pokusę[a]. Duch wprawdzie jest ochoczy, lecz ciało słabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „próbę” albo „doświadczenie”. Greckie słowo może oznaczać zarówno pokusę do grzechu, jak i wystawienie na próbę.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Czuwajcie
  rationale: Liczba mnoga trybu rozkazującego oznacza dosłownie pozostawanie na jawie lub czuwanie. „Czuwajcie” naturalnie łączy w kontekście Getsemani fizyczne niespanie z duchową czujnością.
- source_word: προσεύχεσθε
  choice: módlcie się
  rationale: Standardowy, jasny odpowiednik greckiego imperatywu w liczbie mnogiej; forma niedokonana dobrze oddaje wezwanie do trwającej modlitwy.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: abyście nie weszli
  rationale: Zachowuje celowo-zapobiegawczą konstrukcję oraz grecką metaforę wejścia, nie zastępując jej bardziej interpretacyjnym „ulegli”.
- source_word: πειρασμόν
  choice: pokusę
  rationale: W bezpośrednim kontekście chodzi przede wszystkim o niebezpieczeństwo moralnego upadku pod presją. Greckie słowo może jednak oznaczać także próbę lub doświadczenie, co zaznaczono w przypisie.
- source_word: τὸ μὲν πνεῦμα
  choice: Duch wprawdzie
  rationale: „Wprawdzie” idiomatycznie sygnalizuje pierwszy człon kontrastu μέν...δέ. Rzeczownik odnosi się najpewniej do ludzkiego ducha lub wewnętrznego usposobienia.
- source_word: πρόθυμον
  choice: jest ochoczy
  rationale: „Ochoczy” oddaje gotowość i szczere pragnienie działania, zachowując zwięzłość greckiego orzecznika.
- source_word: ἡ δὲ σὰρξ
  choice: lecz ciało
  rationale: „Ciało” jest utrwalonym polskim odpowiednikiem σάρξ i zachowuje biblijny kontrast z duchem, nie narzucając interpretacji „grzeszna natura”.
- source_word: ἀσθενής
  choice: słabe
  rationale: Bezpośrednio oddaje słabość i ludzką niemoc w kontraście z ochoczym duchem.
theological_decisions:
- issue: Odniesienie πνεῦμα
  choice: ludzki duch lub wewnętrzne usposobienie; „Duch” nie jest tu tytułem Ducha Świętego
  alternative: Duch Święty
  rationale: Kontrast z ciałem oraz sytuacja uczniów, którzy szczerze chcą wytrwać, lecz zasypiają i zawodzą, przemawiają za odniesieniem do ludzkiego ducha. Sama polska pisownia na początku zdania nie rozstrzyga tego typograficznie, dlatego interpretację podano ostrożnie.
- issue: Znaczenie σάρξ
  choice: „ciało” jako ludzka, ucieleśniona słabość
  alternative: „grzeszna natura” lub wyłącznie fizyczny organizm
  rationale: W tym miejscu nie występuje rozwinięta kategoria „grzesznej natury”. „Ciało” zachowuje obraz i napięcie między gotowością wewnętrzną a ludzką słabością bez nadmiernego doprecyzowania.
translation_notes:
  register: Współczesny, godny i zwięzły język. „Czuwajcie” zachowuje zarazem dosłowne wezwanie, by nie spać, i sens duchowej czujności. Składnia „Duch wprawdzie... lecz ciało...” oddaje wyraźny grecki kontrast bez jego teologicznego wygładzania.
