base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: pl
  text: Bo wylewając ten olejek na moje ciało, uczyniła to, aby przygotować mnie do pogrzebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „uczyniła to dla mojego pogrzebania”. Grecka konstrukcja wskazuje cel; czasownik może odnosić się do przygotowania ciała do pochówku albo do pogrzebania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: wylewając
  rationale: Imiesłów aorystu od βάλλω w tym kontekście oznacza wylanie lub naniesienie wonnego olejku, a nie dosłowne „rzucenie”. Polski imiesłów zachowuje związek tej czynności z orzeczeniem.
- source_word: γὰρ
  choice: Bo
  rationale: γάρ wprowadza wyjaśnienie znaczenia czynu kobiety; „Bo” naturalnie oddaje tę funkcję w języku polskim.
- source_word: αὕτη
  choice: '[zawarte w formie „przygotowała”]'
  rationale: Żeński podmiot jest jasny z kontekstu i jednoznacznie wskazany przez formę czasownika; osobne „ona” brzmiałoby ciężej, choć greka ma zaimek wskazujący.
- source_word: τὸ μύρον τοῦτο
  choice: ten olejek
  rationale: μύρον oznacza wonny olejek lub pachnidło używane do namaszczania. „Olejek” jest naturalne w kontekście wylania go na ciało, a zaimek „ten” zachowuje wskazujący charakter wyrażenia.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: na moje ciało
  rationale: ἐπί z dopełniaczem wskazuje tu na kontakt lub umiejscowienie; „na moje ciało” jest naturalnym polskim odpowiednikiem.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: przygotowała mnie do pogrzebu
  rationale: Konstrukcja πρὸς z bezokolicznikiem wyraża cel, a ἐνταφιάζω obejmuje przygotowanie ciała do pochówku. Przekład zachowuje to znaczenie bez sprowadzania go jedynie do samego złożenia w grobie.
- source_word: ἐποίησεν
  choice: przygotowała
  rationale: Ogólne ποιέω („uczyniła”) łączy czynność wylania z jej celem. W polszczyźnie naturalne zespolenie orzeczenia z bezokolicznikiem celu pozwala uniknąć niezręcznego „uczyniła to, aby mnie przygotować”.
theological_decisions:
- issue: Znaczenie ἐνταφιάζω w odniesieniu do śmierci Jezusa
  choice: Czyn kobiety zostaje przedstawiony jako przygotowanie Jezusa do pogrzebu.
  alternative: Czyn został dokonany ogólnie „na mój pogrzeb”, bez wyraźnego zaznaczenia przygotowania ciała.
  rationale: Czasownik ἐνταφιάζω może odnosić się do przygotowania ciała do pochówku lub pogrzebania. Wybrany przekład oddaje sens przygotowawczy i zapowiedź pogrzebu, nie dodając dalszych twierdzeń doktrynalnych.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. „Olejek” brzmi naturalniej niż archaizujące „wonność” i precyzyjniej w tej scenie niż współczesne „perfumy”. Zdanie zachowuje wyjaśniające „Bo” oraz celowy sens wypowiedzi.
