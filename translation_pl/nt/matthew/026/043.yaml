  language: pl
  text: A gdy znów przyszedł, zastał ich śpiących, bo ich oczy były ociężałe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: gdy przyszedł
  rationale: Imiesłów aorystu pełni funkcję okolicznikową i poprzedza główny czasownik; konstrukcja czasowa brzmi naturalnie po polsku i zachowuje kolejność zdarzeń.
- source_word: πάλιν
  choice: znów
  rationale: Zwięzły, współczesny odpowiednik przysłówka wskazującego na powtórzenie czynności.
- source_word: εὗρεν
  choice: zastał
  rationale: W tym kontekście polskie „zastał” naturalnie oddaje znalezienie osób w określonym stanie.
- source_word: καθεύδοντας
  choice: śpiących
  rationale: Imiesłów zachowuje trwający stan uczniów w chwili, gdy Jezus ich zastał.
- source_word: ἦσαν γὰρ
  choice: bo ... były
  rationale: „Bo” jasno i naturalnie zachowuje wyjaśniający sens γάρ.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: ich oczy
  rationale: Naturalny polski szyk konstrukcji dzierżawczej.
- source_word: βεβαρημένοι
  choice: były ociężałe
  rationale: Oddaje wynikowy stan wyrażony przez imiesłów perfectum oraz metaforyczny ciężar oczu powodowany sennością, bez sugerowania zewnętrznego fizycznego obciążenia.
