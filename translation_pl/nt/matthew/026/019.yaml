  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: pl
  text: Uczniowie zrobili tak, jak polecił im Jezus, i przygotowali Paschę[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wieczerzę paschalną”. Greckie πάσχα może oznaczać szerzej obchód Paschy, w tym przygotowywaną na nią wieczerzę.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: zrobili
  rationale: W połączeniu z ὡς συνέταξεν czasownik oznacza wykonanie otrzymanych wskazówek; „zrobili tak” jest naturalne i wierne konstrukcji greckiej.
- source_word: οἱ μαθηταί
  choice: uczniowie
  rationale: Utrwalony i trafny polski odpowiednik określający uczniów oraz naśladowców Jezusa.
- source_word: ὡς
  choice: tak, jak
  rationale: Oddaje zgodność działania uczniów z poleceniem Jezusa w naturalnej polszczyźnie.
- source_word: συνέταξεν
  choice: polecił
  rationale: συντάσσω wyraża wydanie wiążącego polecenia lub zarządzenia; „polecił” zachowuje autorytet Jezusa bez nadmiernego zaostrzania tonu.
- source_word: ἡτοίμασαν
  choice: przygotowali
  rationale: Bezpośredni, idiomatyczny odpowiednik ἑτοιμάζω w kontekście przygotowań paschalnych.
- source_word: τὸ πάσχα
  choice: Paschę
  rationale: Zachowuje zakres greckiego πάσχα, które może oznaczać obchód Paschy, posiłek paschalny lub związane z nim elementy, bez zawężania sensu w tekście głównym.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Standardowa polska forma imienia.
theological_decisions:
- issue: Zakres znaczeniowy τὸ πάσχα
  choice: Paschę
  alternative: wieczerzę paschalną; baranka paschalnego
  rationale: Kontekst wskazuje na przygotowanie posiłku, lecz greckie wyrażenie nie precyzuje wyłącznie wieczerzy ani baranka. Szerszy termin w tekście głównym zachowuje tę wieloznaczność, a przypis objaśnia sens kontekstowy.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Konstrukcja „zrobili tak, jak polecił” brzmi naturalnie, a tradycyjne „Pascha” zachowuje zwięzłość i zakres znaczeniowy oryginału.
