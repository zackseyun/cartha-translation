  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: pl
  text: Gdy Jezus przebywał w Betanii[a], w domu Szymona Trędowatego[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Kiedy Jezus był w Betanii”. Grecki dopełniacz niezależny wprowadza tu czasowe tło wydarzenia.'
    reason: lexical_alternative
  - marker: b
    text: Greckie określenie stanowi przydomek identyfikujący Szymona; samo w sobie nie rozstrzyga, czy nadal cierpiał on na tę chorobę, czy chorował wcześniej. Termin ten mógł obejmować różne choroby skóry, nie tylko współcześnie rozumiany trąd.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Gdy Jezus przebywał
  rationale: Konstrukcja dopełniacza niezależnego wyznacza czas i tło sceny. „Gdy… przebywał” brzmi naturalnie po polsku, nie oddając mechanicznie γίνομαι jako „stał się” ani nie przesądzając następstwa czasowego.
- source_word: δὲ
  choice: bez osobnego odpowiednika
  rationale: δέ jest tu łagodnym spójnikiem narracyjnym, a nie wyraźnym przeciwstawieniem. W tym urywku naturalna polska składnia nie wymaga dodania „zaś” lub „teraz”.
- source_word: ἐν Βηθανίᾳ
  choice: w Betanii
  rationale: Bezpośrednie oddanie określenia miejsca.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: w domu Szymona
  rationale: οἰκία oznacza tu fizyczne miejsce, a dopełniacz Σίμωνος wskazuje właściciela lub gospodarza domu.
- source_word: τοῦ λεπροῦ
  choice: Trędowatego
  rationale: Zachowuje zwięzły przydomek identyfikujący Szymona. Wielka litera sygnalizuje funkcję przydomka, nie rozstrzygając, czy choroba nadal trwała ani jaki był jej dokładny współczesny odpowiednik medyczny.
theological_decisions:
- issue: Czy przydomek Szymona oznacza aktualną chorobę
  choice: Szymona Trędowatego
  alternative: Szymona, który wcześniej był trędowaty; Szymona cierpiącego na chorobę skóry
  rationale: Greka podaje jedynie utrwalone określenie identyfikujące tę osobę. Nie należy dopowiadać, że Szymon został uzdrowiony, że nadal chorował, ani utożsamiać schorzenia ściśle ze współczesną chorobą Hansena.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Zdanie zachowuje formę wprowadzającej okoliczności frazy oraz końcowy przecinek, ponieważ werset składniowo prowadzi do dalszej części narracji.
