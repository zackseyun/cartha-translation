id: MAT.26.10
reference: Matthew 26:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: pl
  text: 'Jezus jednak, wiedząc o tym, powiedział im: „Dlaczego przysparzacie tej kobiecie trudności? Przecież dokonała wobec mnie pięknego czynu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dobrego czynu dla mnie”.'
    reason: Alternatywa zachowuje bardziej podstawowe znaczenie καλός („dobry”) oraz benefaktywne odczytanie εἰς ἐμέ („dla mnie”).
lexical_decisions:
- source_word: γνοὺς
  choice: wiedząc o tym
  rationale: Imiesłów aorystu od γινώσκω ma funkcję okolicznikową; „o tym” naturalnie odsyła do wynikającego z kontekstu niezadowolenia uczniów.
- source_word: δὲ
  choice: jednak
  rationale: δέ sygnalizuje łagodny kontrast między krytyką uczniów a odpowiedzią Jezusa; „jednak” brzmi naturalnie w tym szyku.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Dlaczego sprawiacie tej kobiecie przykrość?
  rationale: Idiوم κόπους παρέχειν oznacza przysparzanie komuś trudu, kłopotu lub przykrości. Polski zwrot oddaje skierowane do uczniów napomnienie oraz wskazuje kobietę jako osobę dotkniętą ich zachowaniem.
- source_word: ἔργον καλὸν
  choice: piękny czyn
  rationale: καλός łączy ocenę dobra, szlachetności i stosowności; „piękny czyn” zachowuje ten bogatszy odcień i brzmi naturalniej po polsku niż dosłowne „piękne dzieło” w odniesieniu do pojedynczego gestu.
- source_word: ἠργάσατο
  choice: spełniła
  rationale: Forma aorystu wskazuje na dokonany czyn. „Spełniła czyn” jest godnym i naturalnym polskim połączeniem wyrazowym.
- source_word: εἰς ἐμέ
  choice: wobec mnie
  rationale: εἰς z osobą może wyrażać ukierunkowanie lub odniesienie. „Wobec mnie” zachowuje tę relację bez przesądzania wyłącznie o korzyści, jaką sugerowałoby samo „dla mnie”.
theological_decisions:
- issue: Ocena czynu kobiety
  choice: piękny czyn
  alternative: dobry czyn; szlachetny czyn
  rationale: Przekład zachowuje pochwałę oraz estetyczno-moralny odcień καλός, nie przypisując temu czynowi dodatkowego znaczenia sakramentalnego ani zasługującego.
- issue: Relacja czynu do Jezusa
  choice: wobec mnie
  alternative: dla mnie; względem mnie
  rationale: Sformułowanie zachowuje kierunkowo-relacyjny zakres εἰς ἐμέ i nie rozstrzyga nadmiernie, czy nacisk pada na odbiorcę, kierunek czy korzyść.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, przystępnym rejestrze. Pytanie Jezusa zachowuje siłę napomnienia bez archaizmów; „Przecież” naturalnie oddaje uzasadniające γάρ.
