id: MAT.26.75
reference: Matthew 26:75
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: pl
  text: 'Wtedy Piotr przypomniał sobie słowa Jezusa: „Zanim zapieje kogut, trzy razy się mnie wyprzesz”. Wyszedł na zewnątrz i gorzko zapłakał.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: przypomniał sobie
  rationale: Naturalnie oddaje moment przypomnienia sobie wcześniejszej wypowiedzi, bez nadmiernego eksponowania formalnie pasywnej postaci czasownika.
- source_word: ῥήματος Ἰησοῦ εἰρηκότος
  choice: słowa Jezusa
  rationale: ῥῆμα oznacza tu wypowiedź lub słowa; polskie „słowa Jezusa” jest naturalne, a następujący cytat jasno wskazuje, że chodzi o to, co Jezus wcześniej powiedział.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Zanim zapieje kogut
  rationale: Polska konstrukcja czasowa naturalnie oddaje grecki bezokolicznik; brak rodzajnika nie wymaga przypisu, ponieważ polszczyzna nie ma rodzajników i nie rozstrzyga, czy chodzi o określonego ptaka.
- source_word: τρὶς
  choice: trzy razy
  rationale: Współczesne, jasne oddanie przysłówka bez archaizacji.
- source_word: ἀπαρνήσῃ με
  choice: trzy razy się mnie wyprzesz
  rationale: „Wyprzeć się kogoś” trafnie oddaje osobowe odrzucenie lub zaparcie się Jezusa; szyk zachowuje nacisk na trzykrotność.
- source_word: ἐξελθὼν ἔξω
  choice: Wyszedł na zewnątrz
  rationale: Oddaje ruch poza miejsce zdarzenia i zachowuje lekkie wzmocnienie obecne w połączeniu imiesłowu z ἔξω, a zarazem brzmi idiomatycznie po polsku.
- source_word: ἔκλαυσεν πικρῶς
  choice: gorzko zapłakał
  rationale: Zwięzłe i utrwalone polskie wyrażenie przekazuje intensywny żal bez dodawania interpretacji psychologicznej.
theological_decisions:
- issue: Określenie Jezusa
  choice: Jezusa
  alternative: Pana Jezusa
  rationale: Tekst grecki zawiera samo imię Ἰησοῦ; nie należy dodawać nieobecnego w źródle tytułu chrystologicznego.
- issue: Znaczenie ἀπαρνέομαι wobec Jezusa
  choice: wyprzesz się mnie
  alternative: zaprzesz się mnie / mnie się zaprzesz
  rationale: „Wyprzeć się” jasno wyraża odcięcie się od osobistej więzi i nie łagodzi ciężaru czynu; nie dopowiada jednak jego teologicznych skutków.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zachowano zwięzłość i emocjonalny ciężar wersetu. Nie dodano przypisu odpowiadającego angielskiemu rozróżnieniu „a/the rooster”, ponieważ polszczyzna bez rodzajników naturalnie zachowuje tę nieokreśloność.
