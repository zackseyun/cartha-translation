  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: pl
  text: Wtedy jeden z dwunastu[a], zwany Judaszem Iskariotą, poszedł do arcykapłanów,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jeden z Dwunastu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, zachowujący tok narracji.
- source_word: πορευθεὶς
  choice: poszedł
  rationale: Imiesłów aorystu pełni funkcję okolicznikową; polska forma osobowa naturalnie oddaje ruch ku arcykapłanom bez sztucznego „udawszy się”.
- source_word: εἷς τῶν δώδεκα
  choice: jeden z dwunastu
  rationale: Zachowuje wyrażenie partytywne i nie narzuca przez zapis wielką literą interpretacji jako sformalizowanej nazwy grupy.
- source_word: ὁ λεγόμενος
  choice: zwany
  rationale: Zwięzły, naturalny i godny polski odpowiednik imiesłowowego określenia identyfikującego Judasza.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judaszem Iskariotą
  rationale: Stosuje utrwalone w polszczyźnie biblijnej formy imienia i przydomka, z odmianą wymaganą przez konstrukcję „zwany”.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: do arcykapłanów
  rationale: Przyimek πρός z biernikiem wskazuje kierunek, a „arcykapłani” jest utrwalonym określeniem naczelnych władz kapłańskich w tym kontekście.
theological_decisions:
- issue: Sposób zapisu określenia grupy τῶν δώδεκα
  choice: jeden z dwunastu
  alternative: jeden z Dwunastu
  rationale: Mała litera zachowuje formalną neutralność tekstu greckiego, podczas gdy zapis „Dwunastu” pozostaje możliwy jako nazwa rozpoznawalnej grupy uczniów.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. Składnia jest naturalna, a przecinek końcowy zachowuje ciągłość zdania z następnym wersetem.
