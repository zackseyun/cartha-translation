base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: pl
  text: 'A gdy jedli, Jezus wziął chleb, pobłogosławił[a], połamał go i dał uczniom, i powiedział: „Weźcie, jedzcie; to jest moje ciało”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wypowiedział błogosławieństwo”; czynność tę można rozumieć jako dziękczynienie lub jako błogosławieństwo wypowiedziane nad chlebem.'
    reason: lexical_alternative
  - marker: b
    text: 'Grecki tekst brzmi dosłownie: „to jest moje ciało”. Niektórzy rozumieją te słowa w znaczeniu „to oznacza moje ciało” lub „to symbolizuje moje ciało”, lecz przekład zachowuje sformułowanie tekstu źródłowego.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: A gdy jedli
  rationale: Konstrukcja dopełniaczowa niezależna wyznacza tło czasowe trwającej czynności. „A gdy jedli” naturalnie oddaje także lekko łączące δέ.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: Jezus wziął chleb
  rationale: Imiesłów aorystu oddano osobową formą czasownika w płynnym ciągu narracyjnym. ἄρτος oznacza tu chleb, bez potrzeby zawężania do jednego bochenka.
- source_word: εὐλογήσας
  choice: pobłogosławił
  rationale: Czasownik εὐλογέω najbezpośredniej oznacza błogosławienie. Polski czasownik nie wymaga dodania niewyrażonego wprost dopełnienia „go” i zachowuje możliwość rozumienia tej czynności jako wypowiedzenia błogosławieństwa nad chlebem.
- source_word: ἔκλασεν
  choice: połamał
  rationale: W kontekście chleba polskie „połamał” jest naturalniejsze niż ogólne „złamał” i oddaje dzielenie chleba na części.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: dał uczniom
  rationale: Imiesłów oddano jako kolejny czasownik osobowy. Rodzajnik wskazuje znaną grupę uczniów; nie dodano niewystępującego wprost zaimka „swoim”.
- source_word: Λάβετε φάγετε
  choice: Bierzcie, jedzcie
  rationale: Dwa następujące bezspójnikowo rozkaźniki zachowano jako dwa rozkazy rozdzielone przecinkiem. Liczba mnoga i bezpośredni charakter poleceń pozostają wyraźne.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: to jest moje ciało
  rationale: Prosta konstrukcja z ἐστιν została przełożona bez interpretacyjnego zastępowania jej czasownikami „oznacza” lub „symbolizuje”; σῶμα oddano zwykłym słowem „ciało”.
theological_decisions:
- issue: Sformułowanie eucharystyczne w słowach Jezusa
  choice: „to jest moje ciało”
  alternative: „to oznacza moje ciało” / „to symbolizuje moje ciało”
  rationale: Grecki tekst zawiera prosty łącznik ἐστιν („jest”). Przekład zachowuje brzmienie źródła i jego napięcie interpretacyjne, nie przesądzając określonej teologii sakramentalnej.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Składnia jest płynna, lecz zachowuje bezspójnikowy rytm rozkazów oraz dosłowne, teologicznie nierozstrzygające brzmienie końcowej wypowiedzi.
