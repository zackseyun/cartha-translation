lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: A gdy
  rationale: Mateuszowa formuła narracyjna ma semicki charakter. Naturalne polskie „A gdy” zachowuje przejście oraz relację czasową, nie wprowadzając niezręcznego, nadmiernie dosłownego „I stało się, gdy”.
- source_word: ἐτέλεσεν
  choice: dokończył
  rationale: Czasownik wskazuje na doprowadzenie wypowiedzi do końca. „Dokończył” naturalnie łączy się po polsku ze słowami lub mową i ukazuje uprzedniość względem „powiedział” bez konieczności osobnej konstrukcji zaprzeszłej.
- source_word: πάντας τοὺς λόγους τούτους
  choice: wszystkich tych słów
  rationale: Dosłowne „słów” zachowuje brzmienie formuły zamykającej mowę u Mateusza; „wypowiedzi” byłoby bardziej idiomatyczne, lecz mniej przejrzyste leksykalnie.
- source_word: εἶπεν
  choice: powiedział
  rationale: Neutralny i bezpośredni polski odpowiednik czasownika λέγω w narracji.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: do swoich uczniów
  rationale: „Uczniów” jest utrwalonym odpowiednikiem μαθηταί, a „swoich” zachowuje wyraźny zaimek αὐτοῦ i jest naturalne przy podmiocie zdania.
