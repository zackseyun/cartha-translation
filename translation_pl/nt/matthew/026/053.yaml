id: MAT.26.53
reference: Matthew 26:53
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: pl
  text: Albo czy myślisz, że nie mogę poprosić mojego Ojca[a], a On natychmiast postawi do mojej dyspozycji[b] więcej niż dwanaście legionów[c] aniołów?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wezwać mojego Ojca” lub „zwrócić się z prośbą do mojego Ojca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „postawi przy mnie”, czyli zapewni mi ich natychmiastową pomoc.'
    reason: lexical_alternative
  - marker: c
    text: Legion był dużą jednostką armii rzymskiej; wyrażenie to podkreśla ogrom niebiańskiej siły.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Albo
  rationale: Wprowadza alternatywne, retoryczne wyzwanie w toku napomnienia Jezusa i zachowuje związek z poprzednią wypowiedzią.
- source_word: δοκεῖς
  choice: czy myślisz
  rationale: Naturalnie oddaje bezpośrednią siłę pytania retorycznego.
- source_word: οὐ δύναμαι
  choice: nie mogę
  rationale: Wyraża zdolność lub możność, a nie brak pozwolenia ani brak chęci.
- source_word: παρακαλέσαι
  choice: poprosić
  rationale: W tym kontekście oznacza zwrócenie się do Ojca z prośbą o pomoc; współczesne „poprosić” brzmi naturalnie i nie osłabia sensu w kontekście.
- source_word: τὸν πατέρα μου
  choice: mojego Ojca
  rationale: Zachowuje osobistą relację synowską; wielka litera wskazuje na Boga zgodnie z utrwaloną polską praktyką biblijną.
- source_word: παραστήσει μοι
  choice: odda mi do dyspozycji
  rationale: Oddaje sens postawienia kogoś przy Jezusie, aby był dostępny do pomocy, bez zawężania znaczenia do samego wysłania.
- source_word: ἄρτι
  choice: natychmiast
  rationale: Podkreśla bezzwłoczną dostępność pomocy.
- source_word: πλείω δώδεκα
  choice: więcej niż dwanaście
  rationale: Wprost oddaje porównanie ilościowe związane z liczebnikiem.
- source_word: λεγιῶνας
  choice: legionów
  rationale: Zachowuje rzymską metaforykę wojskową i obraz ogromnej siły.
- source_word: ἀγγέλων
  choice: aniołów
  rationale: Kontekst jednoznacznie wskazuje na istoty niebiańskie, a nie ludzkich posłańców.
theological_decisions:
- issue: Czy wypowiedź Jezusa dotyczy zdolności, pozwolenia czy gotowości do uzyskania pomocy Ojca
  choice: „nie mogę poprosić mojego Ojca” — sformułowanie dotyczące możności
  alternative: Przekład sugerujący, że Jezus nie chce lub nie ma pozwolenia prosić
  rationale: 'δύναμαι oznacza zdolność lub możność. Przekład zachowuje napięcie: Jezus może uzyskać przeważającą pomoc niebiańską, choć z niej nie korzysta, i nie dopowiada przyczyn jego decyzji.'
- issue: Tryb wypowiedzi o odpowiedzi Ojca
  choice: „odda mi” — czas przyszły zgodny z παραστήσει
  alternative: „oddałby mi” jako naturalne polskie następstwo warunkowe
  rationale: Forma przyszła wierniej zachowuje stanowczość greckiego sformułowania, mimo że polszczyzna dopuszczałaby w tym pytaniu retorycznym tryb przypuszczający.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zdanie zachowuje formę pytania retorycznego, wojskowy obraz legionów oraz przyszły czas greckiego παραστήσει. Zaimka „On” użyto dla przejrzystości odniesienia do Ojca.
