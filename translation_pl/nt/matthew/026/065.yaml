source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: pl
  text: 'Wtedy arcykapłan rozdarł swoje szaty[a] i powiedział: „Zbluźnił! Na co nam jeszcze świadkowie? Oto właśnie usłyszeliście bluźnierstwo”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rozdarcie szat było publicznym znakiem wstrząsu, żalu lub oburzenia.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, który zachowuje następstwo wydarzeń.
- source_word: ὁ ἀρχιερεὺς
  choice: arcykapłan
  rationale: Utrwalone i precyzyjne określenie żydowskiego zwierzchnika kapłańskiego.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: rozdarł swoje szaty
  rationale: „Rozdarł” wiernie oddaje gwałtowną czynność, a „szaty” zachowują podniosły i publiczny charakter gestu bez nadmiernego uszczegółowienia stroju.
- source_word: λέγων
  choice: i powiedział
  rationale: Naturalne po polsku rozwinięcie imiesłowu współczesnego, jasno łączące słowa z wykonanym gestem.
- source_word: Ἐβλασφήμησεν
  choice: Zbluźnił!
  rationale: Zwięzła forma dokonana zachowuje bezpośrednią, prawnoreligijną siłę oskarżenia arcykapłana.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Na co nam jeszcze świadkowie?
  rationale: Naturalne polskie pytanie retoryczne, które zachowuje sens dalszej potrzeby świadków oraz emfatyczne ἔτι.
- source_word: ἴδε νῦν
  choice: Oto teraz
  rationale: „Oto” działa jako interiekcja zwracająca uwagę, bez sztucznego uzgadniania liczby, natomiast „teraz” zachowuje wyraźne νῦν.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: usłyszeliście bluźnierstwo
  rationale: Forma dokonana oddaje świeżo zakończone usłyszenie traktowane jako dowód, a „bluźnierstwo” zachowuje religijno-prawny termin oskarżenia.
theological_decisions:
- issue: Charakter oskarżenia wyrażonego przez βλασφημέω / βλασφημία
  choice: „Zbluźnił” / „bluźnierstwo” jako słowa oskarżenia arcykapłana
  alternative: „wypowiedział słowa obrażające Boga”
  rationale: Tradycyjny termin zachowuje wagę zarzutu, a ramy mowy bezpośredniej jasno wskazują, że jest to ocena arcykapłana, nie niezależne orzeczenie narratora.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr narracyjny. „Szaty” i „oto” podtrzymują powagę sceny, ale całość unika archaicznej składni. Nie zachowano niespójnych przypisań markerów z angielskiej warstwy konsultacyjnej; przypis kulturowy umieszczono przy geście, którego dotyczy.
