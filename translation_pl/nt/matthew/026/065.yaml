  source_fidelity: Przekład trafnie oddaje kolejność narracji, urząd arcykapłana, rozdarcie szat, oskarżenie o bluźnierstwo oraz retoryczne pytanie o dalszą potrzebę świadków. „Zbluźnił!” i „bluźnierstwo” pozostają, zgodnie z greckim tekstem, słowami przytaczanymi w wypowiedzi arcykapłana, nie oceną narratora.
  naturalness: „Oto teraz usłyszeliście” jest zrozumiałe, ale w nowoczesnej polszczyźnie brzmi sztywno i nienaturalnie. „Oto właśnie usłyszeliście” lepiej oddaje bezpośredniość νῦν w tej sytuacji, zachowując podniosły, lecz współczesny rejestr.
  terminology: „Arcykapłan”, „szaty”, „świadkowie”, „zbluźnił” i „bluźnierstwo” są trafne, utrwalone oraz odpowiednie dla kontekstu prawno-religijnego. Przypis kulturowy jest rzeczowy i poprawnie zakotwiczony przy geście rozdarcia szat.
