id: MAT.26.15
reference: Matthew 26:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: pl
  text: 'Powiedział: „Co chcecie mi dać, a ja wam go wydam[a]?” Oni zaś odliczyli mu trzydzieści srebrników.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zdradzę”. Grecki czasownik może znaczyć „wydać”, „przekazać” lub — w tym kontekście — „zdradzić”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Co chcecie mi dać
  rationale: θέλω może wyrażać chęć lub gotowość. W kontekście targowania się naturalne polskie pytanie „Co chcecie mi dać?” zachowuje tę wolitywną treść bez nadmiernego dopowiadania.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: a ja wam go wydam
  rationale: 'παραδίδωμι ma szeroki zakres: „wydać”, „przekazać”, „oddać w czyjeś ręce”, a w tym kontekście także „zdradzić”. „Wydam” jest naturalne, precyzyjne i nie zawęża czasownika wyłącznie do moralnej oceny czynu.'
- source_word: οἱ δὲ
  choice: Oni zaś
  rationale: δέ jest łagodnym spójnikiem narracyjnym. „Zaś” zachowuje przejście do odpowiedzi rozmówców bez podkreślania ostrego przeciwstawienia.
- source_word: ἔστησαν αὐτῷ
  choice: odliczyli mu
  rationale: W połączeniu z sumą pieniędzy forma ἔστησαν wskazuje na ustalenie lub przekazanie określonej kwoty, prawdopodobnie przez odważenie albo odliczenie. „Odliczyli mu” oddaje konkretną czynność płatniczą w naturalnym współczesnym polskim.
- source_word: τριάκοντα ἀργύρια
  choice: trzydzieści srebrników
  rationale: ἀργύρια oznacza srebrne pieniądze lub sztuki srebra. „Srebrniki” to zrozumiałe i utrwalone polskie określenie srebrnych monet, które nie narzuca nieobecnego w tekście nominału.
theological_decisions:
- issue: Znaczenie παραδώσω w propozycji Judasza
  choice: wydam
  alternative: zdradzę
  rationale: „Wydam” zachowuje szerszy zakres greckiego czasownika παραδίδωμι. Kontekst jednoznacznie ukazuje zdradę, lecz sam czasownik opisuje przede wszystkim przekazanie Jezusa w ręce władz; moralnie nacechowaną alternatywę podano w przypisie.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Dialog brzmi naturalnie po polsku, a tradycyjne słowo „srebrniki” pozostaje powszechnie zrozumiałe. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie ze standardową współczesną praktyką translatorską i bez wprowadzania konfesyjnej konwencji typograficznej.
