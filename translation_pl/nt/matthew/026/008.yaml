  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: pl
  text: 'Lecz gdy uczniowie to zobaczyli, oburzyli się i mówili: „Po co to marnotrawstwo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „W jakim celu ta strata?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: gdy ... zobaczyli
  rationale: 'Aorystowy imiesłów oddano jako zdanie czasowe, co naturalnie wyraża relację do głównej czynności. Zaimek „to” uzupełnia domyślny w grece przedmiot: czyn kobiety opisany wcześniej.'
- source_word: δὲ
  choice: Lecz
  rationale: δέ sygnalizuje łagodne przeciwstawienie reakcji uczniów wcześniejszemu czynowi kobiety; „lecz” zachowuje ten zwrot narracyjny.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Standardowy polski odpowiednik μαθηταί. Nie dodano „jego”, ponieważ nie występuje ono w tekście greckim.
- source_word: ἠγανάκτησαν
  choice: oburzyli się
  rationale: Czasownik wyraża silne niezadowolenie, często połączone z oceną moralną; „oburzyli się” trafnie zachowuje ten odcień.
- source_word: λέγοντες
  choice: i mówili
  rationale: Imiesłów współczesny wprowadza wypowiedź uczniów. Konstrukcja współrzędna jest w tym miejscu naturalna po polsku i nie zmienia związku wypowiedzi z ich oburzeniem.
- source_word: Εἰς τί
  choice: Po co
  rationale: 'Idiomat ten pyta o cel: „w jakim celu?”. Zwięzłe „po co” naturalnie oddaje jego krytyczny ton.'
- source_word: ἡ ἀπώλεια αὕτη
  choice: takie marnotrawstwo
  rationale: W kontekście zużycia kosztownego olejku ἀπώλεια oznacza uznaną przez mówiących stratę lub zmarnowanie. „Takie marnotrawstwo” jest naturalnym polskim wykrzyknieniem i zachowuje ich negatywną ocenę.
theological_decisions: []
translation_notes:
  register: Współczesny, godny rejestr narracyjny. W pytaniu zachowano spontaniczny i krytyczny ton uczniów, bez dopowiadania motywów ani łagodzenia ich oburzenia.
