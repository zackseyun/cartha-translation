source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: pl
  text: 'On zaś powiedział: „Idźcie do miasta, do pewnego człowieka[a], i powiedzcie mu: «Nauczyciel mówi: Mój czas jest bliski. U ciebie[b] obchodzę Paschę[c] z moimi uczniami»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „do takiego a takiego”. Greckie wyrażenie wskazuje konkretną, lecz celowo nienazwaną osobę.'
    reason: lexical_alternative
  - marker: b
    text: Zwrot może też znaczyć „z tobą” lub „u ciebie, w twoim miejscu”; tekst grecki nie wymienia wprost domu.
    reason: lexical_ambiguity
  - marker: c
    text: Grecki idiom brzmi dosłownie „czynię Paschę” i oznacza jej obchodzenie lub świętowanie.
    reason: idiom
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: On zaś powiedział
  rationale: Partykuła δέ zaznacza ciąg dalszy i lekkie przejście; „zaś” zachowuje tę funkcję bez nadmiernego uwydatnienia kontrastu.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Idźcie do miasta
  rationale: Naturalny polski odpowiednik nakazu ruchu, bez dodawania nacisku nieobecnego w grece.
- source_word: πρὸς τὸν δεῖνα
  choice: do pewnego człowieka
  rationale: δεῖνα wskazuje konkretną, lecz celowo nienazwaną osobę. Polski zwrot jest zrozumiały i zachowuje godny rejestr.
- source_word: Ὁ διδάσκαλος
  choice: Nauczyciel
  rationale: Zachowuje podstawowe znaczenie διδάσκαλος oraz jego funkcję jako rozpoznawalnego określenia Jezusa.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Mój czas jest bliski
  rationale: καιρός oznacza tu znaczący, nadchodzący czas; przekład nie zawęża go wyłącznie do śmierci, posiłku paschalnego ani innego pojedynczego wydarzenia.
- source_word: πρὸς σὲ
  choice: U ciebie
  rationale: W tym kontekście zwrot wskazuje miejsce lub gościnę związaną z adresatem. „U ciebie” jest naturalne i mniej dopowiada niż „w twoim domu”.
- source_word: ποιῶ τὸ πάσχα
  choice: obchodzę Paschę
  rationale: ποιέω z πάσχα tworzy idiom oznaczający obchodzenie Paschy. Czas teraźniejszy zachowano zgodnie z greką; może on wyrażać ustalony, bliski zamiar.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: z moimi uczniami
  rationale: „Uczniowie” to utrwalony i trafny odpowiednik μαθηταί w kontekście Ewangelii.
theological_decisions:
- issue: Zakres znaczeniowy słów Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Mój czas jest bliski
  alternative: Mój wyznaczony czas jest bliski; Moja godzina jest bliska
  rationale: Werset wskazuje na bliskość rozstrzygającego czasu, lecz sam nie określa jednoznacznie, czy chodzi wyłącznie o śmierć Jezusa, posiłek paschalny, czy szersze dopełnienie jego misji. Ogólne „czas” zachowuje tę zamierzoną otwartość.
- issue: Aspekt i odniesienie czasowe ποιῶ
  choice: obchodzę
  alternative: będę obchodził; chcę obchodzić
  rationale: Zachowanie greckiego czasu teraźniejszego pozwala odczytać wypowiedź jako oznajmienie ustalonego, bliskiego działania bez przekształcania jej w jednoznaczną zapowiedź przyszłą.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, narracyjnym rejestrze. Składnia pozostaje przejrzysta mimo wielopoziomowej mowy przytoczonej; termin „Pascha” zachowuje utrwalone biblijne określenie żydowskiego święta.
