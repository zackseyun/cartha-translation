id: MAT.26.11
reference: Matthew 26:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: pl
  text: Ubogich bowiem zawsze macie przy sobie[a], ale mnie nie zawsze macie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „wśród siebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: zawsze
  rationale: Oddaje stałą dostępność lub obecność i zachowuje powtórzenie tego słowa w obu częściach zdania.
- source_word: γὰρ
  choice: bowiem
  rationale: Wprowadza uzasadnienie wcześniejszej wypowiedzi; „bowiem” naturalnie i zwięźle zachowuje tę funkcję wyjaśniającą.
- source_word: τοὺς πτωχοὺς
  choice: ubogich
  rationale: Rzeczownikowo użyty przymiotnik w liczbie mnogiej oznacza zbiorowo ludzi ubogich. Polski odpowiednik „ubogich” jest naturalny i godny.
- source_word: ἔχετε
  choice: macie
  rationale: W tym kontekście czasownik wskazuje na obecność i dostępność, nie na posiadanie; „macie przy sobie” oraz „mnie macie” zachowuje prostotę i paralelizm oryginału.
- source_word: μεθ’ ἑαυτῶν
  choice: przy sobie
  rationale: Wyraża obecność ubogich pośród adresatów. „Przy sobie” brzmi naturalniej niż dosłowne „z samymi sobą” i dobrze współgra z czasownikiem „macie”.
- source_word: ἐμὲ
  choice: mnie
  rationale: Forma akcentowana podkreśla osobę Jezusa w kontraście z ubogimi; „mnie” zachowuje ten kontrast.
- source_word: δὲ
  choice: ale
  rationale: Wyraźnie zaznacza przeciwstawienie między stałą obecnością ubogich a ograniczonym czasem obecności Jezusa.
- source_word: οὐ πάντοτε
  choice: nie zawsze
  rationale: Zachowuje bezpośredni kontrast z pierwszym „zawsze” oraz naturalny szyk polski.
theological_decisions:
- issue: Znaczenie obecności Jezusa
  choice: Werset przeciwstawia stałą obecność ubogich ograniczonemu czasowi obecności Jezusa przy uczniach.
  alternative: Odczytanie tej wypowiedzi jako pomniejszającej obowiązek troski o ubogich.
  rationale: Greka formułuje kontrast czasowy, a nie moralną ocenę ubogich. Przekład zachowuje wyjątkowość chwili związanej ze zbliżającą się śmiercią Jezusa, nie dodając tezy lekceważącej miłosierdzie wobec potrzebujących.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Szyk „Ubogich bowiem” zachowuje nacisk na pierwszym członie kontrastu, a powtórzenie „zawsze” i „macie” odtwarza paralelizm greckiego zdania.
