  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: pl
  text: 'Ten zaś, który go zdradzał[a], dał im znak, mówiąc: „Ten, którego pocałuję, to on. Schwytajcie go”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „który go wydawał”. Grecki czasownik może znaczyć „wydać” lub „przekazać”, lecz w tym kontekście opisuje zdradę Judasza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: zdradzał
  rationale: W opisie działania Judasza czasownik παραδίδωμι ma kontekstową siłę „zdradzić”, choć jego podstawowym znaczeniem jest „wydać, przekazać”. Forma „zdradzał” jasno oddaje moralny i narracyjny sens tego miejsca.
- source_word: σημεῖον
  choice: znak
  rationale: σημεῖον oznacza tutaj znak rozpoznawczy, który służy jako sygnał dla zbrojnej grupy. Polskie „znak” zachowuje zakres znaczeniowy greckiego rzeczownika bez dopowiadania, że został wcześniej uzgodniony.
- source_word: Ὃν ἂν φιλήσω
  choice: Ten, którego pocałuję
  rationale: Konstrukcja z ἄν i aorystem trybu łączącego tworzy nieokreślone zdanie względne. „Ten, którego pocałuję” brzmi naturalnie po polsku i zachowuje funkcję identyfikującą.
- source_word: φιλήσω
  choice: pocałuję
  rationale: φιλέω określa sam gest pocałunku. Nie dodano „przywitam pocałunkiem”, ponieważ taki szczegół nie jest wyrażony w tekście greckim.
- source_word: αὐτός ἐστιν
  choice: to on
  rationale: Zwięzłe „to on” naturalnie oddaje identyfikację i nacisk zaimka αὐτός.
- source_word: κρατήσατε
  choice: schwytajcie
  rationale: κρατέω oznacza mocno chwycić lub pochwycić. „Schwytajcie” oddaje fizyczny i wrogi charakter działania, nie zawężając go do formalnej procedury aresztowania.
theological_decisions:
- issue: Moralna wymowa παραδιδοὺς w odniesieniu do Judasza
  choice: „który go zdradzał”
  alternative: „który go wydawał”
  rationale: Bezpośredni kontekst męki wskazuje, że wydanie Jezusa jest zdradą. Główne tłumaczenie przekazuje tę kontekstową wymowę, a przypis zachowuje bardziej podstawowe znaczenie czasownika.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. „Ten zaś” zachowuje łagodną funkcję łączącą δέ bez dodawania określenia czasowego. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze standardową współczesną polszczyzną i bez wprowadzania konfesyjnej konwencji typograficznej.
