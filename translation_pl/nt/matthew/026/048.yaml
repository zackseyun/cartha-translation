  source_fidelity: 'Tekst wiernie oddaje wszystkie elementy greckie: ὁ δὲ przez „Ten zaś”, παραδιδοὺς przez kontekstowo uzasadnione „który go zdradzał”, ἔδωκεν przez „dał”, σημεῖον przez „znak”, a także identyfikującą wypowiedź i rozkaz κρατήσατε. „To on” dobrze przekazuje zwięzłe αὐτός ἐστιν bez nadawania mu nadmiernego nacisku.'
