id: MAT.26.35
reference: Matthew 26:35
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: pl
  text: 'Piotr powiedział mu: „Choćbym nawet miał umrzeć z tobą, na pewno się ciebie nie wyprę[a]”. Tak samo powiedzieli też wszyscy uczniowie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nigdy się ciebie nie wyprę”. W tekście greckim występuje bardzo mocna negacja (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: powiedział
  rationale: Grecki praesens historicum dosłownie znaczy „mówi”, lecz w naturalnej polskiej narracji jego funkcję lepiej oddaje czas przeszły „powiedział”.
- source_word: Κἂν δέῃ με
  choice: choćbym nawet miał
  rationale: Konstrukcja wprowadza warunek przyzwalający i wyraża konieczność; polskie „choćbym nawet miał” zachowuje oba składniki oraz stanowczy ton wypowiedzi Piotra.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: umrzeć z tobą
  rationale: Zwięzłe i naturalne sformułowanie wyrażające wspólne poniesienie śmierci.
- source_word: οὐ μή
  choice: na pewno … nie
  rationale: Podwójna grecka negacja ma silnie emfatyczny charakter. „Na pewno … nie” zachowuje nacisk bez osłabienia wypowiedzi.
- source_word: ἀπαρνήσομαι
  choice: się ciebie nie wyprę
  rationale: „Wyprzeć się kogoś” trafnie określa zaprzeczenie więzi z daną osobą i odpowiada kontekstowi późniejszego zaparcia się Jezusa.
- source_word: ὁμοίως καὶ
  choice: tak samo … też
  rationale: Oddaje zarówno znaczenie podobieństwa zawarte w ὁμοίως, jak i dołączającą funkcję καί.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: powiedzieli wszyscy uczniowie
  rationale: Zachowuje powszechność stwierdzenia oraz zwyczajowy ewangeliczny odpowiednik rzeczownika μαθηταί.
theological_decisions:
- issue: Siła zapewnienia Piotra
  choice: „na pewno się ciebie nie wyprę”
  alternative: „nigdy się ciebie nie wyprę”
  rationale: Greckie οὐ μή wyraża zdecydowaną negację dotyczącą przyszłości. Wybrane brzmienie zachowuje emfatyczność, nie dodając interpretacji do ukazanego w narracji napięcia między pewnością Piotra a późniejszym wydarzeniem.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze zwykłą ortografią narracyjną, bez narzucania dodatkowej interpretacji. Szyk końcowego zdania zachowuje nacisk na zgodność wypowiedzi wszystkich uczniów.
