  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: pl
  text: Bo to jest moja krew przymierza[a], która jest wylewana za wielu[b] na odpuszczenie grzechów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy mają: „moja krew nowego przymierza”.'
    reason: textual_variant
  - marker: b
    text: 'Można też oddać: „na rzecz wielu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: to
  rationale: Oddaje zaimek wskazujący bez dopowiadania „kielich”, którego nie ma w tej klauzuli greckiej.
- source_word: γάρ
  choice: bo
  rationale: Naturalnie zachowuje funkcję wyjaśniającą i związek z poprzednim nakazem picia.
- source_word: τὸ αἷμά μου
  choice: moja krew
  rationale: Bezpośredni, naturalny przekład, zachowujący ofiarnicze i przymierzowe znaczenie obrazu krwi.
- source_word: τῆς διαθήκης
  choice: przymierza
  rationale: Tekst SBLGNT nie zawiera przymiotnika καινῆς („nowego”), dlatego nie dodano go do tekstu głównego.
- source_word: περὶ πολλῶν
  choice: za wielu
  rationale: W kontekście ofiarniczym περί z dopełniaczem wskazuje na działanie dla dobra lub w imieniu innych. Zwięzłe „za wielu” zachowuje możliwe echo języka Izajasza i nie rozstrzyga sporów o zakres odkupienia.
- source_word: ἐκχυννόμενον
  choice: która jest wylewana
  rationale: Imiesłów czasu teraźniejszego w stronie biernej odnosi się do „krwi”. Zdanie względne brzmi po polsku naturalnie i zachowuje obraz wylewania.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: na odpuszczenie grzechów
  rationale: Utrwalone, jasne i godne sformułowanie, zachowujące celowo-skutkowy odcień przyimka εἰς.
theological_decisions:
- issue: Czy przy „przymierzu” dodać słowo „nowego”
  choice: przymierza
  alternative: nowego przymierza
  rationale: Podany tekst grecki nie zawiera καινῆς („nowego”). Wariant zachowano w przypisie, zamiast wprowadzać go do tekstu głównego z tradycji równoległej lub części rękopisów.
- issue: Znaczenie wyrażenia περὶ πολλῶν w wypowiedzi o odkupieniu
  choice: za wielu
  alternative: dla wielu / w imieniu wielu
  rationale: Przekład zachowuje πολλῶν („wielu”) i nie zastępuje go słowem „wszystkich”, nie rozstrzygając tym samym szerszej debaty teologicznej. Przypis sygnalizuje zakres znaczeniowy przyimka.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Szyk pozostaje bliski grece, ale brzmi naturalnie. Wybrano tradycyjnie rozpoznawalne „odpuszczenie grzechów”, unikając zarówno archaizacji, jak i objaśniającej parafrazy.
