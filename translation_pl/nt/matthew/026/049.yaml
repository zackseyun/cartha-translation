base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: pl
  text: 'I natychmiast podszedł do Jezusa i powiedział: „Witaj[a], Rabbi!” I pocałował go[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie także: „Raduj się”; tutaj jest to zwyczajowa forma pozdrowienia.'
    reason: lexical_alternative
  - marker: b
    text: 'Grecki czasownik może oznaczać pocałunek intensywny lub powtarzany: „ucałował go serdecznie” albo „całował go wielokrotnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: natychmiast
  rationale: Oddaje bezzwłoczność działania i zachowuje tempo narracji bez archaicznego brzmienia.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: podszedł do Jezusa
  rationale: Naturalnie oddaje ruch Judasza w stronę Jezusa oraz następstwo czynności wyrażone przez grecki imiesłów aorystu.
- source_word: εἶπεν
  choice: powiedział
  rationale: Prosty, neutralny odpowiednik greckiego czasownika mówienia.
- source_word: Χαῖρε
  choice: Witaj
  rationale: W tym kontekście jest to zwyczajowa forma pozdrowienia. „Witaj” brzmi współcześnie i godnie, a zarazem nie zaciera ironii sytuacji.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Zachowuje semicki tytuł obecny w tekście greckim; forma ta jest rozpoznawalna we współczesnej polszczyźnie.
- source_word: κατεφίλησεν
  choice: pocałował
  rationale: W tekście głównym zastosowano naturalny polski czasownik. Możliwy odcień intensywności lub powtarzalności prefiksalnej formy greckiej zachowano w przypisie.
- source_word: αὐτόν
  choice: go
  rationale: Zaimek jednoznacznie odnosi się do Jezusa; polski szyk „go pocałował” jest naturalny.
theological_decisions:
- issue: Znaczenie pozdrowienia Χαῖρε
  choice: Witaj
  alternative: Raduj się
  rationale: W tej scenie wyraz pełni funkcję konwencjonalnego pozdrowienia, nie wezwania do radości ani teologicznej aklamacji.
- issue: Siła czasownika κατεφίλησεν
  choice: pocałował
  alternative: ucałował go serdecznie / całował go wielokrotnie
  rationale: Grecki czasownik może wskazywać na pocałunek intensywny, demonstracyjny albo powtarzany, lecz stopień tej intensywności pozostaje niepewny. Tekst główny nie rozstrzyga tej kwestii, a wariant znaczeniowy podaje przypis.
translation_notes:
  register: Współczesna, naturalna i godna polszczyzna narracyjna. Zachowano tytuł „Rabbi”, uniknięto archaicznego pozdrowienia oraz nie doprecyzowano w tekście głównym niepewnego odcienia intensywności pocałunku.
