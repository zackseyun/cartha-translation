  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: pl
  text: Jak więc wypełniłyby się Pisma, które mówią, że tak musi się stać?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: Jak więc
  rationale: Naturalnie oddaje pytajny przysłówek oraz wynikowe powiązanie z poprzednią wypowiedzią.
- source_word: πληρωθῶσιν
  choice: wypełniłyby się
  rationale: Tryb przypuszczający dobrze zachowuje potencjalny, retoryczny sens aorystu strony biernej w trybie łączącym.
- source_word: αἱ γραφαί
  choice: Pisma
  rationale: Liczba mnoga odnosi się do świętych pism Izraela; wielka litera sygnalizuje to ustalone odniesienie.
- source_word: ὅτι
  choice: że
  rationale: Wprowadza treść poświadczaną przez Pisma, bez rozstrzygania jej jako zdania przyczynowego.
- source_word: οὕτως
  choice: tak
  rationale: Zwięźle i naturalnie wskazuje sposób, w jaki wydarzenia mają nastąpić.
- source_word: δεῖ γενέσθαι
  choice: musi się stać
  rationale: Zachowuje moc konieczności oraz naturalnie opisuje zaistnienie wydarzeń, nie dodając niewyrażonego objaśnienia.
theological_decisions:
- issue: Charakter konieczności wyrażonej przez δεῖ
  choice: musi się stać
  alternative: musi się stać zgodnie z wolą Boga
  rationale: Związek z wypełnieniem Pism sugeruje konieczność wynikającą z Bożego zamysłu, lecz tekst nie wyraża tego objaśnienia wprost.
- issue: Składniowa funkcja ὅτι
  choice: że — wprowadzenie treści Pism
  alternative: bo — wprowadzenie przyczyny
  rationale: Najbardziej bezpośrednio zachowuje grecką konstrukcję i jej pewną składniową zwięzłość, bez nadmiernego doprecyzowania relacji.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano retoryczną formę pytania, zwięzłość greckiego zdania oraz napięcie między wypełnieniem Pism a niewyjaśnioną bliżej koniecznością wydarzeń.
