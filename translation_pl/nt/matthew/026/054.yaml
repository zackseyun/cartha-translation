- from: Jak więc wypełniłyby się Pisma[a], że tak musi się stać?
  to: Jak więc wypełniłyby się Pisma, które mówią, że tak musi się stać?
  rationale: 'Dodano jedynie „które mówią”, aby naturalnie oddać treściową funkcję ὅτι po „Pismach”. Zachowano retoryczny tryb przypuszczający („wypełniłyby się”), ustalone określenie „Pisma” oraz nieobjaśnioną bliżej konieczność „musi się stać”. Istniejący przypis alternatywny nie jest potrzebny: „mogłyby się wypełnić” jest możliwą parafrazą modalną, ale nie wnosi istotnej wariantywności tekstowej ani nie poprawia zrozumienia wersetu.'
