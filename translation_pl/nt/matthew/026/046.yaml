  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: pl
  text: Wstańcie, chodźmy. Oto zbliżył się ten, który mnie wydaje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ten, który mnie wydaje” (lub: „przekazuje”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Wstańcie
  rationale: Tryb rozkazujący liczby mnogiej zwraca się do uczniów; „Wstańcie” jest bezpośrednie, naturalne i odpowiada sytuacji, w której wcześniej spali.
- source_word: ἄγωμεν
  choice: chodźmy
  rationale: Pierwsza osoba liczby mnogiej w trybie łączącym ma sens zachęty; „chodźmy” jest jej zwięzłym i naturalnym polskim odpowiednikiem.
- source_word: ἰδού
  choice: Oto
  rationale: Partykuła kieruje uwagę na nagły i bliski rozwój wydarzeń; „Oto” zachowuje jej żywą, uroczystą siłę bez nadmiernej archaizacji.
- source_word: ἤγγικεν
  choice: zbliżył się
  rationale: Perfectum przedstawia zbliżenie jako dokonane i aktualnie istotne. „Zbliżył się” zachowuje aspekt osiągniętej bliskości, choć w polszczyźnie może również sugerować, że dana osoba właśnie nadchodzi.
- source_word: ὁ παραδιδούς με
  choice: ten, który mnie wydaje
  rationale: Urzeczownikowiony imiesłów wskazuje osobę dokonującą wydania Jezusa. „Wydaje” zachowuje konkretny sens przekazania w cudze ręce i nie zawęża go wyłącznie do interpretacyjnego pojęcia zdrady.
theological_decisions:
- issue: Oddanie παραδιδούς w kontekście męki
  choice: ten, który mnie wydaje
  alternative: mój zdrajca / ten, który mnie zdradza
  rationale: Grecki czasownik konkretnie opisuje wydanie Jezusa w ręce przeciwników; czyn ten jest zarazem zdradą. Tekst główny zachowuje obraz działania obecny w źródle, a przypis objaśnia jego zdradziecki charakter.
translation_notes:
  register: Współczesny, godny i bezpośredni język wypowiedzi. Krótkie zdania zachowują pilność sceny; „Oto” oddaje funkcję ἰδού i jest utrwalone w polskim rejestrze biblijnym, pozostając zrozumiałe.
