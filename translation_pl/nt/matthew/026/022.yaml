  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: pl
  text: 'Głęboko zasmuceni zaczęli jeden po drugim[a] mówić do Niego: „Chyba nie ja[b], Panie?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „każdy z osobna” lub „każdy po kolei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Greckie μήτι wprowadza pytanie, na które oczekuje się odpowiedzi przeczącej: „Chyba nie ja, Panie?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: głęboko zasmuceni
  rationale: Imiesłów wyraża ich trwający stan emocjonalny, a σφόδρα mocno go nasila. „Głęboko zasmuceni” brzmi naturalnie i zachowuje siłę greckiego wyrażenia.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: zaczęli mówić do Niego
  rationale: Oddaje konstrukcję ingresywną oraz celownik wskazujący adresata wypowiedzi, bez zbędnego dopowiadania.
- source_word: εἷς ἕκαστος
  choice: jeden po drugim
  rationale: Naturalny polski odpowiednik podkreślający, że każdy uczeń odpowiadał indywidualnie i kolejno.
- source_word: Μήτι ἐγώ εἰμι
  choice: Chyba nie ja
  rationale: μήτι sygnalizuje pytanie, na które mówiący oczekuje odpowiedzi przeczącej. Polski zwrot „Chyba nie ja?” zwięźle zachowuje tę pragmatyczną siłę.
- source_word: κύριε
  choice: Panie
  rationale: Wołacz „Panie” zachowuje zwykłe w przekładzie Ewangelii Mateusza tytułowe znaczenie κύριος, a zarazem pozostaje naturalną formą bezpośredniego zwrotu do Jezusa.
theological_decisions:
- issue: Sposób oddania κύριε w zwrocie do Jezusa
  choice: Panie
  alternative: nauczycielu / proszę pana
  rationale: κύριε może w pewnych kontekstach być grzecznościowym zwrotem, lecz „Panie” zachowuje zarówno naturalną formę adresatywną, jak i narracyjną oraz teologiczną wagę tytułu w Ewangelii Mateusza, nie rozstrzygając jej przez objaśniający dodatek.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłość wypowiedzi oraz retoryczny charakter pytania. Zaimek „Niego” zapisano wielką literą zgodnie z utrwaloną polską konwencją przekładów biblijnych.
