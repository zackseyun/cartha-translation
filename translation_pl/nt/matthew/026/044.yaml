  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: pl
  text: Zostawił ich i ponownie odszedł, a po raz trzeci się pomodlił, wypowiadając znów te same słowa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „tę samą wypowiedź” (dosł. „to samo słowo”); możliwe też: „to samo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: Zostawił ich
  rationale: Imiesłów aorystu opisuje odejście od uczniów i pozostawienie ich na miejscu. Polska forma osobowa naturalnie oddaje kolejność narracji.
- source_word: πάλιν ἀπελθὼν
  choice: znowu odszedł
  rationale: Pierwsze πάλιν wskazuje na ponowne oddalenie się Jezusa; ἀπελθών oznacza odejście od uczniów.
- source_word: προσηύξατο ἐκ τρίτου
  choice: modlił się po raz trzeci
  rationale: Wyrażenie ἐκ τρίτου idiomatycznie oznacza trzecią okazję lub trzeci raz.
- source_word: τὸν αὐτὸν λόγον εἰπὼν
  choice: wypowiadając te same słowa
  rationale: Liczba pojedyncza λόγον może oznaczać wypowiedź lub treść wypowiedzi. Polska liczba mnoga „słowa” naturalnie opisuje powtórzenie tej samej modlitwy, bez sugerowania mechanicznego powtórzenia jednego wyrazu.
- source_word: πάλιν
  choice: ponownie
  rationale: Końcowe πάλιν zachowano, aby oddać tekstowe podkreślenie powtórzenia treści modlitwy.
theological_decisions:
- issue: Powtórzenie modlitwy Jezusa
  choice: Zachowano zarówno trzecią okazję modlitwy, jak i informację o ponownym wypowiedzeniu tych samych słów.
  alternative: Można pominąć końcowe „ponownie” jako stylistycznie nadmiarowe albo oddać λόγον jako „to samo”.
  rationale: Grecki tekst zawiera dwa wystąpienia πάλιν i wyraźnie mówi o tej samej wypowiedzi. Przekład zachowuje to napięcie i nacisk narracyjny bez dodatkowej interpretacji teologicznej.
translation_notes:
  register: Współczesny, godny styl narracyjny. Formy osobowe zastępują nagromadzenie greckich imiesłowów, a dwa odpowiedniki πάλιν („znowu”, „ponownie”) zachowują celowe powtórzenie obecne w tekście źródłowym.
