  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: pl
  text: 'Przychodzi do uczniów i zastaje ich śpiących. Mówi do Piotra: „A więc nie mogliście czuwać[a] ze mną przez jedną godzinę?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pozostać ze mną na jawie”.'
    reason: Czasownik γρηγορέω może w tym kontekście uwydatniać zarówno czuwanie, jak i samo niezapadanie w sen.
lexical_decisions:
- source_word: ἔρχεται
  choice: przychodzi
  rationale: Zachowano grecki czas teraźniejszy historyczny, który ożywia narrację i brzmi naturalnie również po polsku.
- source_word: πρὸς τοὺς μαθητὰς
  choice: do uczniów
  rationale: Naturalny polski odpowiednik πρός oznaczającego kierunek ruchu ku osobom.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: zastaje ich śpiących
  rationale: „Zastaje” trafnie oddaje sens znalezienia kogoś w określonym stanie, a imiesłów „śpiących” zachowuje werbalny charakter καθεύδοντας.
- source_word: λέγει τῷ Πέτρῳ
  choice: mówi do Piotra
  rationale: Zachowano teraźniejszy czas narracyjny oraz standardową polską formę imienia Πέτρος.
- source_word: Οὕτως
  choice: A więc
  rationale: W tym pytaniu οὕτως wprowadza pełen zdziwienia i łagodnej nagany wniosek; „A więc” oddaje tę funkcję naturalniej niż dosłowne „tak” lub „w ten sposób”.
- source_word: οὐκ ἰσχύσατε
  choice: nie mogliście
  rationale: ἰσχύω wyraża tutaj zdolność lub siłę do wykonania czegoś. Liczba mnoga została zachowana, mimo że wypowiedź jest skierowana do Piotra.
- source_word: μίαν ὥραν
  choice: przez jedną godzinę
  rationale: Biernik wyraża czas trwania; przyimek „przez” czyni tę relację jasną i idiomatyczną po polsku.
- source_word: γρηγορῆσαι
  choice: czuwać
  rationale: Czasownik oznacza pozostawanie w stanie czuwania, zarówno w sensie niezaspania, jak i zachowania czujności. „Czuwać” zachowuje oba odcienie.
- source_word: μετ’ ἐμοῦ
  choice: ze mną
  rationale: Prosty i naturalny odpowiednik wyrażenia oznaczającego towarzyszenie.
theological_decisions:
- issue: Jezus mówi do Piotra, lecz czasownik ἰσχύσατε ma liczbę mnogą
  choice: „Mówi do Piotra” oraz „nie mogliście”
  alternative: 'Ujednolicić wypowiedź do liczby pojedynczej: „nie mogłeś”'
  rationale: Tekst grecki wyraźnie wskazuje Piotra jako bezpośredniego adresata, ale naganę formułuje w liczbie mnogiej, obejmując także pozostałych uczniów. Zachowano tę celową zmianę liczby bez jej objaśniającego wygładzania.
translation_notes:
  register: Współczesny, naturalny i godny styl narracyjny. Zachowano greckie czasy teraźniejsze historyczne oraz wyraźne przejście od Piotra jako wskazanego adresata do liczby mnogiej obejmującej grupę.
