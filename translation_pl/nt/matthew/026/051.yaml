id: MAT.26.51
reference: Matthew 26:51
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: pl
  text: A oto jeden z tych, którzy byli z Jezusem, wyciągnął rękę, dobył miecza, uderzył niewolnika[a] arcykapłana i odciął mu ucho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „sługę”.'
    reason: Alternatywny przekład greckiego δοῦλος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje nagłość i obrazowość greckiego sygnału narracyjnego, a zarazem brzmi naturalnie i godnie we współczesnej polszczyźnie.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: jeden z tych, którzy byli z Jezusem
  rationale: Naturalnie oddaje konstrukcję cząstkową i nie dopowiada tożsamości tej osoby.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: wyciągnął rękę
  rationale: Oddaje fizyczny ruch wyrażony imiesłowem aorystu jako czynność poprzedzającą dobycie miecza.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: dobył miecza
  rationale: To zwięzły, idiomatyczny polski opis wyciągnięcia własnej broni; dopełniacz po czasowniku „dobyć” jest naturalny.
- source_word: μάχαιραν
  choice: miecz
  rationale: Termin może oznaczać krótki miecz lub duży nóż, lecz ogólne „miecz” zachowuje zakres znaczeniowy bez nadmiernego uszczegółowienia.
- source_word: πατάξας
  choice: uderzył
  rationale: Jasno i współcześnie oddaje gwałtowny cios.
- source_word: δοῦλον
  choice: niewolnika
  rationale: Najpełniej zachowuje konkretny status społeczny osoby należącej do gospodarstwa arcykapłana; przypis podaje tradycyjne, łagodniejsze tłumaczenie.
- source_word: ἀρχιερέως
  choice: arcykapłana
  rationale: Jest to utrwalony polski odpowiednik ἀρχιερεύς w liczbie pojedynczej.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: odciął mu ucho
  rationale: Naturalnie wyraża skutek ciosu mieczem i zachowuje osobową formę greckiego orzeczenia.
- source_word: ὠτίον
  choice: ucho
  rationale: Deminutywna postać grecka nie wymaga w tym kontekście zdrobnienia ani zawężenia do płatka ucha.
theological_decisions:
- issue: Oddanie δοῦλος w konkretnym kontekście społecznym
  choice: niewolnik
  alternative: sługa
  rationale: „Niewolnik” nie łagodzi realiów zależności społecznej obecnych w tekście. Ponieważ polskie „sługa” jest również możliwe w tradycji przekładowej, podano je w przypisie bez rozstrzygania ponad świadectwo źródła.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. Wyrażenie „A oto” zachowuje żywość relacji, a szereg czasowników osobowych przejrzyście odtwarza kolejność działań.
