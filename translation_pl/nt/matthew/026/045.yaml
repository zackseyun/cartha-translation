  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: pl
  text: 'Potem przychodzi do uczniów i mówi im: „Śpijcie już i odpoczywajcie.[a] Oto nadeszła godzina[b] i Syn Człowieczy zostaje wydany[c] w ręce grzeszników”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Czy nadal śpicie i odpoczywacie?”. Grecką wypowiedź można rozumieć jako pytanie retoryczne; może ona mieć wydźwięk ironiczny lub przyzwalający.'
    reason: alternative_reading
  - marker: b
    text: 'Dosłownie także: „zbliżyła się godzina”; możliwe również: „godzina jest blisko”.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „zostaje zdradzony” albo „zostaje przekazany”. Grecki czasownik ma szersze znaczenie niż sama zdrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Potem
  rationale: Naturalny polski łącznik czasowy, wskazujący kolejny etap wydarzeń.
- source_word: ἔρχεται ... καὶ λέγει
  choice: przychodzi ... i mówi
  rationale: Zachowuje żywy czas teraźniejszy narracji greckiej, naturalny także w polskiej narracji biblijnej.
- source_word: πρὸς τοὺς μαθητάς
  choice: do uczniów
  rationale: Oddaje ruch w kierunku uczniów idiomatyczną polszczyzną.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Śpijcie już i odpoczywajcie
  rationale: Zachowuje powierzchniową formę wypowiedzi oraz jej możliwy ironiczny lub przyzwalający wydźwięk, nie rozstrzygając jednoznacznie, czy jest to pytanie retoryczne.
- source_word: ἰδού
  choice: Oto
  rationale: Współczesny, godny odpowiednik formuły zwracającej uwagę, dobrze utrwalony w polszczyźnie biblijnej.
- source_word: ἤγγικεν ἡ ὥρα
  choice: nadeszła godzina
  rationale: Naturalnie oddaje dokonany aspekt czasownika i fakt, że oczekiwana chwila jest już blisko lub właśnie nastąpiła.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik ważnego tytułu występującego w tekście.
- source_word: παραδίδοται
  choice: zostaje wydany
  rationale: Zachowuje bierną konstrukcję i szerszy sens przekazania w czyjeś ręce, bez zawężania znaczenia wyłącznie do zdrady.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: w ręce grzeszników
  rationale: Zachowuje konkretny i czytelny w języku polskim idiom grecki.
theological_decisions:
- issue: Funkcja Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Wypowiedź w formie: „Śpijcie już i odpoczywajcie”'
  alternative: „Czy nadal śpicie i odpoczywacie?”
  rationale: Grecka składnia dopuszcza rozumienie ironiczne, przyzwalające lub retoryczne. Tekst główny zachowuje formalne brzmienie i napięcie wynikające z natychmiastowej zapowiedzi nadejścia godziny, a przypis sygnalizuje możliwe pytanie retoryczne.
- issue: Zakres znaczeniowy παραδίδοται w opisie męki
  choice: „zostaje wydany”
  alternative: „zostaje zdradzony”
  rationale: Grecki czasownik ma szerszy zakres niż sama zdrada. Wybrane sformułowanie obejmuje zdradę i przekazanie Jezusa w cudze ręce, nie narzucając węższego odczytania.
- issue: Znaczenie perfectum ἤγγικεν
  choice: „nadeszła”
  alternative: „zbliżyła się”
  rationale: W kontekście aresztowania, które bezpośrednio następuje, forma wskazuje na bliskość osiągającą punkt aktualny. Przypis zachowuje bardziej dosłowną możliwość „zbliżyła się”.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie biblijnym rejestrze. Zachowano historyczny czas teraźniejszy oraz tytuł „Syn Człowieczy”. Przypisy umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
