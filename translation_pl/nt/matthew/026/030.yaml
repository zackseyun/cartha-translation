  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: pl
  text: A gdy zaśpiewali hymn[a], wyszli na Górę Oliwną.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zaśpiewali pieśń pochwalną”. Grecki czasownik może ogólnie oznaczać śpiewanie na chwałę Boga; „zaśpiewali hymn” dobrze pasuje do kontekstu posiłku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Prosty spójnik zachowuje ciągłość narracji bez dodawania mocniejszego odcienia czasowego.
- source_word: ὑμνήσαντες
  choice: gdy zaśpiewali hymn
  rationale: Imiesłów aorystu oznacza śpiewanie pieśni pochwalnej przed czynnością wyrażoną czasownikiem głównym. Sformułowanie jest naturalne po polsku i pasuje do kontekstu posiłku paschalnego.
- source_word: ἐξῆλθον
  choice: wyszli
  rationale: Bezpośredni i idiomatyczny odpowiednik czasownika oznaczającego wyjście lub wyruszenie.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ku Górze Oliwnej
  rationale: Przyimek εἰς wyraża kierunek, a „Góra Oliwna” jest utrwaloną polską nazwą geograficzną. „Ku” zachowuje kierunkowość bez przesądzania, że w tej samej chwili dotarli na miejsce.
