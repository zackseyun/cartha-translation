  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: pl
  text: I nie znaleźli niczego, chociaż wystąpiło wielu fałszywych świadków. Później jednak wystąpiło dwóch[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „dwóch [wystąpiło]”. Wcześniej grecki nie wyraża dopełnienia po „nie znaleźli”; możliwe uzupełnienie: „nie znaleźli żadnego [zeznania]” lub „żadnego [zarzutu]”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: nie znaleźli żadnego
  rationale: Dopełnienie czasownika pozostaje w grece domyślne i wynika z kontekstu poszukiwania zeznania przeciw Jezusowi. Polski zaimek „żadnego” naturalnie wskazuje na brak odpowiedniego zeznania lub zarzutu, nie przesądzając w tekście głównym dokładnej postaci domyślnego dopełnienia.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: chociaż wystąpiło wielu fałszywych świadków
  rationale: 'Genetivus absolutus ma tutaj sens przyzwalający: nie znaleziono tego, czego szukano, mimo pojawienia się licznych świadków. „Fałszywi świadkowie” zachowuje sądowe znaczenie ψευδομάρτυρες, a „wystąpiło” odpowiada kontekstowi składania zeznań.'
- source_word: ὕστερον δὲ
  choice: Później jednak
  rationale: „Później” oddaje następstwo czasowe, a „jednak” zachowuje lekko przeciwstawny lub zwrotny charakter δέ.
- source_word: προσελθόντες δύο
  choice: wystąpiło dwóch
  rationale: W kontekście przesłuchania προσέρχομαι oznacza wystąpienie w roli świadka. Taki przekład jest naturalniejszy po polsku niż przestrzenne „podeszło dwóch”.
