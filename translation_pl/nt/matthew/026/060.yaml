  terminology: „Fałszywi świadkowie” zachowuje sądowe znaczenie ψευδομάρτυρες. „Wystąpiło wielu/dwóch” jest dopuszczalne i naturalne w opisie postępowania sądowego. Nie ma potrzeby dopowiadać „wiarygodnego zeznania” ani „oskarżenia” w tekście głównym.
