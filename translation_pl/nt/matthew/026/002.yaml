id: MAT.26.2
reference: Matthew 26:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: pl
  text: Wiecie, że za dwa dni będzie Pascha, a Syn Człowieczy zostanie wydany na ukrzyżowanie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zostanie zdradzony”. Grecki czasownik może oznaczać zdradę, ale szerzej znaczy „wydać” lub „przekazać w czyjeś ręce”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Wiecie
  rationale: Forma drugiej osoby liczby mnogiej od οἶδα ma znaczenie teraźniejsze; proste „wiecie” jest naturalne i wierne.
- source_word: μετὰ δύο ἡμέρας
  choice: za dwa dni
  rationale: μετά z biernikiem wyraża odstęp czasu. Współczesne polskie „za dwa dni” naturalnie oddaje wydarzenie następujące po upływie dwóch dni.
- source_word: τὸ πάσχα
  choice: Pascha
  rationale: πάσχα oznacza Paschę; nie dodano słowa „święto”, którego tekst grecki nie zawiera.
- source_word: γίνεται
  choice: będzie
  rationale: W tym kontekście γίνομαι mówi o nastaniu lub odbywaniu się Paschy. „Będzie Pascha” brzmi naturalnie po polsku i zachowuje bliskość wydarzenia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik samookreślenia Jezusa, zachowujący jego biblijny i teologiczny wydźwięk.
- source_word: παραδίδοται
  choice: zostanie wydany
  rationale: Grecki czas teraźniejszy może w zapowiedzi wyrażać zdarzenie bliskie i pewne. „Zostanie wydany” zachowuje szerszy sens czasownika παραδίδωμι, nie zawężając go wyłącznie do zdrady.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: na ukrzyżowanie
  rationale: Konstrukcja εἰς z bezokolicznikiem rodzajnikowym wyraża cel lub skutek; polskie „na ukrzyżowanie” zwięźle i jasno oddaje tę relację.
theological_decisions:
- issue: Znaczenie παραδίδοται w zapowiedzi męki
  choice: zostanie wydany
  alternative: zostanie zdradzony
  rationale: 'Kontekst obejmuje zdradę Judasza, lecz sam czasownik ma szerszy zakres: może oznaczać przekazanie lub wydanie w czyjeś ręce. Szerszy odpowiednik zachowuje napięcie między ludzką zdradą a wydaniem Jezusa na śmierć.'
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie zachowuje zwięzłość greckiej zapowiedzi; „za dwa dni” jest naturalniejsze we współczesnej polszczyźnie niż dosłowne „po dwóch dniach”.
