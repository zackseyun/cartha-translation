  naturalness: Po zastąpieniu „też” tekst brzmi naturalnie, współcześnie i godnie. Ciąg czasowników osobowych jest uzasadnionym, płynnym polskim odpowiednikiem dwóch imiesłowów aorystowych i czasownika głównego.
