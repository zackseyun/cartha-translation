id: MAT.26.27
reference: Matthew 26:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: pl
  text: 'Wziął kielich, podziękował, podał go im i powiedział: „Pijcie z niego wszyscy”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: wziął
  rationale: Aorystowy imiesłów wyraża czynność poprzedzającą podanie kielicha. Polski czasownik osobowy zachowuje kolejność wydarzeń, a brzmi naturalniej niż książkowe „wziąwszy”.
- source_word: ποτήριον
  choice: kielich
  rationale: W kontekście uroczystego posiłku „kielich” jest naturalnym i utrwalonym polskim odpowiednikiem naczynia do picia; grecki rzeczownik nie ma rodzajnika, czego polszczyzna nie musi odrębnie zaznaczać.
- source_word: εὐχαριστήσας
  choice: podziękował
  rationale: Oddaje podstawowe znaczenie czasownika εὐχαριστέω — składanie dziękczynienia — bez wprowadzania późniejszej terminologii sakramentalnej. Forma osobowa tworzy naturalny polski ciąg czynności.
- source_word: ἔδωκεν αὐτοῖς
  choice: podał go im
  rationale: „Podał” jest w kontekście posiłku naturalniejsze od dosłownego „dał”; zaimek „go” jasno odnosi się do kielicha, który w grece pozostaje domyślnym dopełnieniem.
- source_word: λέγων
  choice: i powiedział
  rationale: Grecki imiesłów wprowadza mowę niezależną. Polski czasownik osobowy oddaje tę funkcję jasno i bez sztucznej składni imiesłowowej.
- source_word: Πίετε ἐξ αὐτοῦ
  choice: Pijcie z niego
  rationale: 'Liczba mnoga trybu rozkazującego zwraca się do obecnych uczniów, a ἐξ z dopełniaczem wskazuje źródło: picie z kielicha.'
- source_word: πάντες
  choice: wszyscy
  rationale: Wyraz odnosi się do wszystkich adresatów rozkazu. Polski szyk „Pijcie z niego wszyscy” jasno zachowuje ten zakres.
theological_decisions:
- issue: Możliwe eucharystyczne lub sakramentalne konotacje εὐχαριστήσας
  choice: podziękował
  alternative: pobłogosławił; odmówił dziękczynienie
  rationale: Grecki czasownik oznacza dziękowanie. Przekład zachowuje sens leksykalny, nie narzucając późniejszej interpretacji doktrynalnej.
- issue: Zakres πάντες
  choice: wszyscy jako określenie adresatów
  alternative: wszystko, w odniesieniu do zawartości kielicha
  rationale: 'Grecka składnia najnaturalniej wskazuje, że nakaz dotyczy całej grupy: „wy wszyscy”. Nie mówi, że każdy ma wypić całą zawartość.'
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zrezygnowano z książkowych imiesłowów „wziąwszy” i „podziękowawszy” na rzecz naturalnego ciągu czasowników osobowych. „Kielich” zachowuje biblijny rejestr, nie brzmiąc archaicznie.
