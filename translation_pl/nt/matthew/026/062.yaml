  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: pl
  text: 'A arcykapłan wstał i powiedział mu: „Nic nie odpowiadasz? Co oni zeznają przeciwko tobie?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nic nie odpowiadasz na to, co oni zeznają przeciwko tobie?”'
    reason: alternatywa składniowa
lexical_decisions:
- source_word: ἀναστὰς
  choice: wstał
  rationale: Imiesłów aorystu opisuje fizyczne powstanie arcykapłana przed zabraniem głosu; naturalna polska konstrukcja współrzędna zachowuje kolejność działań.
- source_word: ὁ ἀρχιερεὺς
  choice: arcykapłan
  rationale: Standardowa polska nazwa urzędu żydowskiego najwyższego kapłana w tym kontekście.
- source_word: εἶπεν αὐτῷ
  choice: powiedział mu
  rationale: Zachowuje zaimek obecny w grece, bez zastępowania go imieniem Jezusa.
- source_word: Οὐδὲν ἀποκρίνῃ
  choice: Nic nie odpowiadasz?
  rationale: Naturalne i zarazem bliskie greckiej formie pytanie, które wyraża żądanie odpowiedzi.
- source_word: τί
  choice: Co
  rationale: Bezpośrednio oddaje prosty zaimek pytajny, nie dopowiadając treści oskarżenia.
- source_word: οὗτοί
  choice: oni
  rationale: Zaimek wskazuje na obecnych świadków; polski zaimek osobowy brzmi naturalnie, a jego użycie nie wymaga dodawania rzeczownika nieobecnego w tekście.
- source_word: σου
  choice: przeciwko tobie
  rationale: W połączeniu z καταμαρτυροῦσιν dopełniacz ma sens niekorzystnego świadectwa składanego przeciw oskarżonemu.
- source_word: καταμαρτυροῦσιν
  choice: zeznają przeciwko
  rationale: Oddaje teraźniejszy, sądowy charakter składania obciążającego świadectwa, nie redukując czasownika do ogólnego „oskarżają”.
theological_decisions:
- issue: Relacja między dwoma pytaniami
  choice: Zachowano dwa odrębne pytania zgodnie z interpunkcją SBLGNT.
  alternative: „Nic nie odpowiadasz na to, co oni zeznają przeciwko tobie?”
  rationale: Grecka składnia jest zwięzła i może być rozumiana jako dwa pytania albo jako semantycznie ściśle powiązane żądanie odpowiedzi na świadectwa. Tekst główny zachowuje formalne napięcie, a przypis podaje naturalną możliwość połączenia.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano sądowe „zeznają przeciwko” oraz zwięzłość bez dopowiadania, że chodzi o świadków lub oskarżycieli.
