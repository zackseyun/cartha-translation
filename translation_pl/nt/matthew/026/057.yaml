  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: pl
  text: Ci zaś, którzy pojmali Jezusa, odprowadzili go do Kajfasza, arcykapłana, gdzie zgromadzili się[a] uczeni w Piśmie i starsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zostali zgromadzeni”. Grecka forma może tu opisywać zarówno ich zgromadzenie się, jak i zgromadzenie ich przez kogoś.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ci zaś, którzy
  rationale: Rodzajnik z imiesłowem oddano rzeczownikowo jako „ci, którzy”, a łagodne, narracyjne δέ jako „zaś”, bez sugerowania silnego przeciwstawienia.
- source_word: κρατήσαντες
  choice: pojmali
  rationale: Imiesłów aorystu wskazuje czynność wcześniejszą od odprowadzenia. „Pojmali” zachowuje sens schwytania i przejęcia osoby pod straż, nie narzucając bardziej technicznego znaczenia prawnego słowa „aresztowali”.
- source_word: ἀπήγαγον
  choice: odprowadzili go
  rationale: Czasownik oznacza prowadzenie lub zabranie kogoś stamtąd; „odprowadzili” naturalnie opisuje przemieszczenie Jezusa pozostającego pod strażą.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: do Kajfasza, arcykapłana
  rationale: πρός z biernikiem wyraża ruch ku osobie. Dopowiedzenie „arcykapłana” zachowuje tytuł Kajfasza bez dodawania niewspomnianego w tekście domu ani formalnej sceny stawienia „przed” nim.
- source_word: ὅπου
  choice: gdzie
  rationale: Prosty odpowiednik przysłówka względnego określającego miejsce.
- source_word: οἱ γραμματεῖς
  choice: uczeni w Piśmie
  rationale: W tym żydowskim kontekście γραμματεῖς oznacza znawców i nauczycieli Pisma; „uczeni w Piśmie” jest zrozumiałym, utrwalonym polskim określeniem, trafniejszym kontekstowo niż zawodowe „pisarze”.
- source_word: οἱ πρεσβύτεροι
  choice: starsi
  rationale: „Starsi” zachowuje utrwalone określenie uznanych przywódców wspólnoty żydowskiej.
- source_word: συνήχθησαν
  choice: zgromadzili się
  rationale: Forma aorystu biernego czasownika συνάγω może w tym kontekście opisywać zgromadzenie się grupy. Polski zwrot jest naturalny i nie przesądza, kto ewentualnie ją zwołał.
