  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: pl
  text: 'Wtedy Jezus powiedział do niego: „Odłóż swój miecz z powrotem na miejsce, bo wszyscy, którzy chwytają za miecz[a], od miecza zginą”։'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „biorą miecz”; wyrażenie prawdopodobnie oznacza uciekanie się do przemocy, a nie tylko fizyczne wzięcie broni do ręki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski przysłówek czasowy, który zachowuje następstwo wydarzeń w narracji.
- source_word: λέγει αὐτῷ
  choice: Jezus powiedział do niego
  rationale: Grecki czas teraźniejszy pełni funkcję praesens historicum; polski czas przeszły brzmi naturalnie w narracji, a jawne „Jezus” oddaje podmiot ὁ Ἰησοῦς.
- source_word: Ἀπόστρεψον
  choice: Schowaj
  rationale: W kontekście dobytej broni rozkaz oznacza natychmiastowe odłożenie jej z powrotem; „schowaj” jest naturalne i współgra z frazą „na jego miejsce”.
- source_word: τὴν μάχαιράν σου
  choice: swój miecz
  rationale: μάχαιρα może oznaczać nóż, sztylet lub krótki miecz, lecz „miecz” jest w tym kontekście jasnym i utrwalonym odpowiednikiem.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: na jego miejsce
  rationale: Oddaje skierowanie broni z powrotem tam, gdzie powinna się znajdować, bez dopowiadania niewspomnianej wprost pochwy.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: bo wszyscy, którzy chwytają za miecz
  rationale: Imiesłów z rodzajnikiem ma sens ogólny. Polski idiom „chwytać za miecz” może oznaczać sięganie po przemoc, nie tylko fizyczne ujęcie broni.
- source_word: ἐν μαχαίρῃ
  choice: od miecza
  rationale: Naturalna polska konstrukcja instrumentalno-przyczynowa zachowująca przysłowiową paralelę „za miecz — od miecza”.
- source_word: ἀπολοῦνται
  choice: zginą
  rationale: W tym kontekście czasownik wskazuje na śmierć lub zgubę; „zginą” jest zwięzłe, poważne i naturalne po polsku.
theological_decisions:
- issue: Zakres wypowiedzi Jezusa o mieczu
  choice: 'Zachować ogólną, sentencjonalną formę: „wszyscy, którzy chwytają za miecz, od miecza zginą”.'
  alternative: Odczytać ją wyłącznie jako bezwzględny zakaz wszelkiego użycia siły albo wyłącznie jako zapowiedź dotyczącą tej jednej sytuacji.
  rationale: Grecka konstrukcja ma charakter uogólniający. Przekład zachowuje szeroki sens zasady, nie narzucając rozstrzygnięcia sporów etycznych wykraczających poza brzmienie wersetu.
translation_notes:
  register: Współczesny, godny i zrozumiały polski. Zachowano zwięzłość oraz przysłowiowy rytm wypowiedzi. Marker przypisu [a] umieszczono bezpośrednio przy wyrażeniu, którego dotyczy.
