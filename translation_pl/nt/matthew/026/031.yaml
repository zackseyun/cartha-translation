source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: pl
  text: 'Wtedy Jezus mówi im: „Tej nocy wszyscy zwątpicie we mnie[a], bo jest napisane: «Uderzę pasterza, a owce trzody się rozproszą»”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wszyscy się potkniecie”, „wszyscy się zgorszycie” lub „wszyscy ode mnie odstąpicie”. Grecki czasownik może oznaczać potknięcie, zgorszenie lub odpadnięcie; w tym kontekście chodzi o rozproszenie uczniów i opuszczenie Jezusa.'
    reason: lexical_alternative
  - marker: b
    text: Cytat z Za 13,7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wprowadzającego kolejny moment narracji.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy historyczny i żywość narracji.
- source_word: Πάντες ὑμεῖς
  choice: wszyscy
  rationale: W polszczyźnie forma czasownika wskazuje adresatów, a „wszyscy” zachowuje emfatyczną powszechność zapowiedzi.
- source_word: σκανδαλισθήσεσθε
  choice: się zachwiejecie
  rationale: Oddaje obraz utraty stałości i relacyjne potknięcie z powodu Jezusa, nie przesądzając o ostatecznym odstępstwie; przypis podaje kontekstowo mocniejszą możliwość.
- source_word: ἐν ἐμοὶ
  choice: przeze mnie
  rationale: 'Naturalnie oddaje przyczynowo-relacyjny sens: to, co spotka Jezusa, stanie się dla uczniów powodem zachwiania.'
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: tej nocy
  rationale: Bliskie formie greckiej, a zarazem naturalne i godne we współczesnej polszczyźnie.
- source_word: γέγραπται γάρ
  choice: bo jest napisane
  rationale: Standardowa formuła wprowadzająca cytat z Pisma, zachowująca aspekt trwałego zapisu.
- source_word: Πατάξω
  choice: Uderzę
  rationale: Bezpośredni odpowiednik, który nie dopowiada skutku uderzenia.
- source_word: τὸν ποιμένα
  choice: pasterza
  rationale: Zachowuje podstawowy obraz metaforyczny cytatu.
- source_word: διασκορπισθήσονται
  choice: się rozproszą
  rationale: Naturalna polska konstrukcja oddająca przyszłe rozproszenie owiec.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: owce trzody
  rationale: Zachowuje oba greckie rzeczowniki, nie redukując wyrażenia do samych „owiec”.
theological_decisions:
- issue: Zakres znaczeniowy σκανδαλισθήσεσθε w odniesieniu do Jezusa
  choice: „się zachwiejecie”, z objaśnieniem możliwego sensu „odstąpicie/opuścicie mnie”
  alternative: „zgorszycie się”, „potkniecie się”, „odstąpicie”
  rationale: Grecki czasownik obejmuje zakres od potknięcia lub zgorszenia po odpadnięcie. Kontekst wskazuje na opuszczenie Jezusa, lecz przekład główny zachowuje obraz i napięcie semantyczne, nie sugerując definitywnej apostazji.
- issue: Czas teraźniejszy historyczny λέγει
  choice: „mówi”
  alternative: „powiedział”
  rationale: Zachowanie teraźniejszości historycznej odzwierciedla tekst grecki bez zmiany treści teologicznej.
- issue: Tożsamość pasterza w cytacie
  choice: Pozostawienie samego obrazu „pasterza” bez objaśnienia w tekście głównym
  alternative: Jawne utożsamienie pasterza z Jezusem
  rationale: Kontekst wskazuje na odniesienie do Jezusa, ale cytat nie dokonuje tego utożsamienia za pomocą dopowiedzenia; przekład zachowuje formę źródła.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Zachowano teraźniejszość historyczną („mówi”), skrypturalną formułę „jest napisane” oraz pełny obraz „owce trzody”. Szyk „Tej nocy wszyscy...” podkreśla zarówno bliskość wydarzenia, jak i objęcie zapowiedzią wszystkich uczniów.
