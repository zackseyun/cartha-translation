reference: Matthew 26:47
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: pl
  text: A gdy On jeszcze mówił, oto przyszedł Judasz, jeden z dwunastu, a z nim liczny tłum z mieczami i pałkami[a], od arcykapłanów i starszych ludu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „kijami”. Greckie słowo dosłownie oznacza kawałki drewna; tutaj najpewniej chodzi o pałki.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „wysłany przez arcykapłanów i starszych ludu”. Po grecku dosłownie: „od arcykapłanów i starszych ludu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: gdy On jeszcze mówił
  rationale: Konstrukcja dopełniacza niezależnego wyraża czynność równoczesną; „jeszcze” naturalnie oddaje ἔτι.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje narracyjny sygnał żywości i zwraca uwagę na nagłe pojawienie się Judasza, nie dopowiadając wprost „nagle”.
- source_word: Ἰούδας
  choice: Judasz
  rationale: Utrwalona polska forma imienia.
- source_word: εἷς τῶν δώδεκα
  choice: jeden z dwunastu
  rationale: Bezpośrednio oddaje wyrażenie cząstkowe; mała litera nie narzuca odczytania liczebnika jako formalnego tytułu.
- source_word: ἦλθεν
  choice: przyszedł
  rationale: Prosty, naturalny odpowiednik narracyjnego aorystu czasownika ἔρχομαι.
- source_word: ὄχλος πολὺς
  choice: liczny tłum
  rationale: Naturalnie przekazuje wielkość zgromadzenia, nie dodając nacechowania obecnego w słowie „motłoch”.
- source_word: μετὰ μαχαιρῶν
  choice: z mieczami
  rationale: μάχαιρα może oznaczać miecz lub krótszą broń sieczną; ogólne „miecze” jest w tym kontekście trafne i tradycyjnie zrozumiałe.
- source_word: καὶ ξύλων
  choice: i pałkami
  rationale: ξύλον dosłownie oznacza drewno lub kawałek drewna, lecz w kontekście uzbrojonego tłumu chodzi najpewniej o przedmioty używane jako pałki.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: przybyły od arcykapłanów i starszych ludu
  rationale: „Od” zachowuje znaczenie źródła lub pochodzenia wyrażone przez ἀπό. Dodane dla naturalności składni „przybyły” nie przesądza wprost, że przywódcy formalnie wysłali tłum.
theological_decisions:
- issue: Czy wyraźnie stwierdzić, że tłum został oficjalnie wysłany przez przywódców
  choice: przybyły od arcykapłanów i starszych ludu
  alternative: wysłany przez arcykapłanów i starszych ludu
  rationale: Przyimek ἀπό wskazuje źródło lub pochodzenie, a kontekst sugeruje upoważnienie, jednak grecki tekst nie zawiera czasownika „wysłać”. Tekst główny zachowuje tę ostrożność, a możliwe doprecyzowanie podaje przypis.
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano „oto” jako wyrazisty, lecz nadal zrozumiały sygnał narracyjny. Szyk zdania pozostaje bliski grece, ale został dostosowany do naturalnej polszczyzny.
