  naturalness: Tekst jest naturalny, współczesny i zarazem dostojny. Konstrukcja „Syn Człowieczy wprawdzie odchodzi… jednak biada…” jest płynna i dobrze odzwierciedla strukturę wypowiedzi. „Lepiej byłoby dla niego, gdyby ten człowiek się nie urodził” to ustalony, idiomatyczny polski sposób wyrażenia sensu tej surowej kontrfaktycznej oceny.
  terminology: „Syn Człowieczy” jest właściwym utrwalonym odpowiednikiem tytułu. „Biada” zachowuje prorocko-sądową moc οὐαί. Wybór „wydany” nie zawęża παραδίδοται wyłącznie do zdrady, a przypis wystarczająco sygnalizuje alternatywę leksykalną bez narzucania interpretacji doktrynalnej.
