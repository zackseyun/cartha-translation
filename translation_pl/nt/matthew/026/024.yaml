id: MAT.26.24
reference: Matthew 26:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: pl
  text: Syn Człowieczy wprawdzie odchodzi, zgodnie z tym, co o nim napisano, jednak biada temu człowiekowi, przez którego Syn Człowieczy zostaje wydany[a]. Lepiej byłoby dla niego, gdyby ten człowiek się nie urodził.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „zostaje zdradzony”. Grecki czasownik może oznaczać zarówno „wydać, przekazać”, jak i „zdradzić”; w tym kontekście chodzi o zdradzieckie działanie Judasza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy wprawdzie
  rationale: Zachowano utrwalony tytuł „Syn Człowieczy”, a partykułę μὲν oddano przez „wprawdzie”, aby naturalnie zapowiedzieć kontrast z δὲ.
- source_word: ὑπάγει
  choice: odchodzi
  rationale: Czasownik oznacza odejście; przekład nie dopowiada wprost śmierci, choć kontekst męki nadaje temu odejściu głębszy sens.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: zgodnie z tym, co o nim napisano
  rationale: Sformułowanie naturalnie oddaje zgodność ze świadectwem Pisma oraz wynikowy sens perfectum γέγραπται, bez wskazywania jednego konkretnego tekstu.
- source_word: οὐαὶ δὲ
  choice: jednak biada
  rationale: „Biada” zachowuje prorocką i sądową siłę οὐαί, a „jednak” wyraża kontrast z poprzednią częścią zdania.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: temu człowiekowi
  rationale: Oddaje zarówno rzeczownik ἄνθρωπος, jak i wskazujący, dystansujący charakter ἐκεῖνος.
- source_word: δι’ οὗ
  choice: przez którego
  rationale: Naturalnie wyraża pośrednictwo lub sprawstwo zawarte w διά z dopełniaczem.
- source_word: παραδίδοται
  choice: zostaje wydany
  rationale: „Zostaje wydany” zachowuje podstawowy i szerszy sens παραδίδωμι, ważny w opisie przekazania Jezusa w ręce innych; możliwość znaczenia „zostaje zdradzony” podano w przypisie.
- source_word: καλὸν ἦν αὐτῷ
  choice: Lepiej byłoby dla niego
  rationale: Polski idiom porównawczy naturalnie oddaje sens czegoś korzystniejszego w nierzeczywistej sytuacji, mimo że καλόν dosłownie znaczy „dobre”.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: gdyby ten człowiek się nie urodził
  rationale: Tryb warunkowy oddaje nierzeczywisty sens wypowiedzi, a powtórzenie „ten człowiek” zachowuje nacisk obecny w grece.
theological_decisions:
- issue: Związek między wypełnieniem Pisma a odpowiedzialnością człowieka
  choice: Zachowano zarówno odejście Syna Człowieczego zgodne z tym, co napisano, jak i „biada” skierowane do człowieka, przez którego zostaje wydany.
  alternative: Przekład podkreślający Boże postanowienie kosztem odpowiedzialności zdrajcy albo odpowiedzialność zdrajcy kosztem wypełnienia Pisma.
  rationale: Grecki tekst stawia obie prawdy obok siebie i nie wyjaśnia ich wzajemnej relacji; przekład zachowuje to napięcie.
- issue: Znaczenie stwierdzenia o nieurodzeniu się zdrajcy
  choice: Oddano je jako surową wypowiedź sądową, bez rozwijania jej w szczegółową doktrynę o ostatecznym losie tej osoby.
  alternative: Uznanie wypowiedzi wyłącznie za hiperbolę albo wykorzystanie jej jako jednoznacznego rozstrzygnięcia szczegółowych sporów dotyczących potępienia.
  rationale: Tekst mówi jedynie, że lepiej byłoby dla tego człowieka, gdyby się nie urodził; tłumaczenie nie powinno ani osłabiać tej groźby, ani dopowiadać więcej.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Konstrukcja „wprawdzie… jednak…” zachowuje kontrast bez nadmiernej dosłowności. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną normą współczesnego tekstu, ponieważ greka nie koduje zapisu honoryfikatywnego.
