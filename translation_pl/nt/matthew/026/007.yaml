  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: pl
  text: Podeszła do niego kobieta, trzymając alabastrowe naczynie z bardzo drogim wonnym olejkiem[a], i wylała olejek na jego głowę, gdy półleżał przy stole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „alabastrowy flakon z bardzo drogą wonną maścią”. Greckie μύρον może oznaczać pachnący olejek lub maść.'
    reason: lexical_alternative
  - marker: b
    text: 'To znaczy: zajmował półleżącą pozycję, zgodnie z ówczesnym zwyczajem spożywania posiłków.'
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν
  choice: podeszła do
  rationale: Aoryst od προσέρχομαι wyraża zbliżenie się do osoby; „podeszła do” jest naturalne i zachowuje kierunkowy sens.
- source_word: γυνή
  choice: kobieta
  rationale: Rzeczownik nieokreślony, bez dodatkowej identyfikacji; polszczyzna nie wymaga osobnego rodzajnika.
- source_word: ἔχουσα
  choice: trzymając
  rationale: Imiesłów opisuje kobietę i w tym kontekście naturalnie wskazuje, że miała naczynie w rękach.
- source_word: ἀλάβαστρον μύρου
  choice: alabastrowe naczynie z ... wonnym olejkiem
  rationale: ἀλάβαστρον oznacza pojemnik, zwykle alabastrowy flakon lub naczynie, a μύρον — aromatyczny olejek bądź maść. To sformułowanie jest jasne i nie zawęża nadmiernie kształtu pojemnika.
- source_word: βαρυτίμου
  choice: bardzo drogim
  rationale: Oddaje wysoką cenę lub wielką wartość substancji oraz intensyfikujący charakter przymiotnika.
- source_word: κατέχεεν
  choice: wylała
  rationale: καταχέω oznacza wylewać na coś; dopełnienie „na jego głowę” jasno wskazuje kierunek czynności.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: na jego głowę
  rationale: Naturalny polski odpowiednik konstrukcji oznaczającej wylanie substancji na głowę.
- source_word: ἀνακειμένου
  choice: gdy spoczywał przy stole
  rationale: Czasownik odnosi się do półleżącej pozycji zajmowanej podczas posiłku; dodanie „przy stole” jasno przekazuje kontekst kulturowy.
theological_decisions: []
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Szyk zachowuje tok greckiego zdania, lecz pozostaje naturalny. Zaimek „go” gramatycznie odnosi się do wonnego olejku. Oba znaczniki przypisów występują w tekście głównym.
