id: MAT.26.55
reference: Matthew 26:55
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: pl
  text: 'Wtedy Jezus powiedział do tłumów: „Czy wyszliście z mieczami i kijami, żeby mnie pojmać, jakbym był rozbójnikiem?[a] Dzień po dniu siedziałem w świątyni i nauczałem, a nie schwytaliście mnie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „bandytą”, a w pewnych kontekstach także „buntownikiem”. Greckie słowo może oznaczać nie tylko złodzieja, lecz również brutalnego rabusia, członka zbrojnej bandy albo rebelianta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Wtedy
  rationale: Naturalny polski odpowiednik czasowego wyrażenia, zachowujący bezpośredni związek z chwilą pojmania; dosłowne „w owej godzinie” brzmiałoby podniośle i mniej naturalnie.
- source_word: τοῖς ὄχλοις
  choice: do tłumów
  rationale: Zachowuje liczbę mnogą greckiego rzeczownika ὄχλοις.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: jakbym był rozbójnikiem
  rationale: 'Naturalnie oddaje sens idiomu: przybyli przeciw Jezusowi tak, jak przeciw groźnemu przestępcy. „Rozbójnik” obejmuje sprawcę przemocy i nie zawęża znaczenia do zwykłej kradzieży.'
- source_word: ἐξήλθατε
  choice: wyszliście
  rationale: Formalnie odpowiada czasownikowi i dobrze pasuje do wyjścia uzbrojonej grupy przeciw Jezusowi.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: z mieczami i kijami
  rationale: „Miecze” jest tradycyjnym i jasnym odpowiednikiem μάχαιραι, a „kije” naturalnie określa drewniane pałki użyte jako broń.
- source_word: συλλαβεῖν με
  choice: żeby mnie pojmać
  rationale: „Pojmać” oddaje cel zorganizowanej akcji, a zarazem pozwala odróżnić ten czasownik od późniejszego κρατέω.
- source_word: καθ’ ἡμέραν
  choice: Dzień po dniu
  rationale: Zachowuje dystrybutywny i retoryczny charakter wyrażenia, mocniej niż neutralne „codziennie”.
- source_word: ἐν τῷ ἱερῷ
  choice: w świątyni
  rationale: W naturalnej polszczyźnie „świątynia” może oznaczać cały kompleks świątynny; kontekst publicznego nauczania wyklucza rozumienie jako wewnętrzne sanktuarium.
- source_word: ἐκαθεζόμην διδάσκων
  choice: siedziałem ... i nauczałem
  rationale: Zachowuje niedokonany, powtarzalny charakter czynności oraz współczesność siedzenia i nauczania.
- source_word: οὐκ ἐκρατήσατέ με
  choice: nie schwytaliście mnie
  rationale: Oddaje skuteczne uchwycenie lub zatrzymanie, zachowując rozróżnienie względem wcześniejszego συλλαβεῖν („pojmać”).
theological_decisions:
- issue: Zakres znaczeniowy λῃστής w pytaniu Jezusa
  choice: rozbójnik
  alternative: bandyta; buntownik
  rationale: λῃστής może oznaczać brutalnego rabusia lub bandytę, a w pewnych kontekstach także rebelianta. Werset podkreśla potraktowanie Jezusa jak groźnego przestępcy, lecz sam nie wymaga jednoznacznie politycznego sensu „buntownik”; szerszą możliwość zachowuje przypis.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Pytanie retoryczne ujęto idiomatycznie („jakbym był”), bez zaciemniającej kalki składniowej. Zachowano liczbę mnogą „tłumów”, aspekt powtarzalny czynności oraz rozróżnienie między dwoma czasownikami oznaczającymi pojmanie lub schwytanie.
