id: MAT.26.59
reference: Matthew 26:59
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: pl
  text: Arcykapłani zaś i cała Rada[a] szukali fałszywego świadectwa[b] przeciw Jezusowi, aby go zgładzić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „cały Sanhedryn”. Grecki termin oznacza żydowską najwyższą radę sądowniczo-rządzącą.'
    reason: cultural_note
  - marker: b
    text: 'Lub: „fałszywego świadka”. Greckie określenie może w kontekście sądowym odnosić się do fałszywego świadectwa albo do fałszywego świadka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodne przejście narracyjne i niewielki odcień przeciwstawny, bez dodawania nieobecnego w grece określenia czasu.
- source_word: ἀρχιερεῖς
  choice: arcykapłani
  rationale: Utrwalone i precyzyjne określenie przywódców kapłańskich; liczba mnoga nie oznacza, że wszyscy równocześnie sprawowali urząd jedynego najwyższego kapłana.
- source_word: συνέδριον ὅλον
  choice: cała Rada
  rationale: Naturalny polski odpowiednik nazwy żydowskiego organu sądowniczo-rządzącego; „cała” zachowuje nacisk zawarty w ὅλον.
- source_word: ἐζήτουν
  choice: szukali
  rationale: Polski czas niedokonany oddaje trwający, podejmowany przez pewien czas wysiłek wyrażony greckim imperfectum.
- source_word: ψευδομαρτυρίαν
  choice: fałszywego świadectwa
  rationale: W kontekście procesu chodzi przede wszystkim o treść fałszywych zeznań; przypis zachowuje możliwe odniesienie do fałszywego świadka.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: przeciw Jezusowi
  rationale: Oddaje sądowe i wrogie ukierunkowanie działania przeciwko Jezusowi.
- source_word: ὅπως
  choice: aby
  rationale: Zwięźle i naturalnie wprowadza greckie zdanie celu.
- source_word: θανατώσωσιν
  choice: go zgładzić
  rationale: Oddaje spowodowanie śmierci Jezusa bez zawężania greckiego czasownika wyłącznie do wydania wyroku lub technicznego wykonania egzekucji.
theological_decisions:
- issue: Sądowy charakter zamiaru przywódców
  choice: Ukazano trwające poszukiwanie fałszywego świadectwa w celu doprowadzenia do śmierci Jezusa.
  alternative: Można oddać cel jako „aby skazać go na śmierć”, lecz takie sformułowanie może zawężać znaczenie do samego wyroku.
  rationale: Imperfectum ἐζήτουν oraz zdanie celu ὅπως…θανατώσωσιν przedstawiają rozmyślne i trwające działania procesowe, których ostatecznym zamiarem było pozbawienie Jezusa życia.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zachowano zwięzłość greckiego zdania, aspekt trwającego poszukiwania oraz jego sądowy kontekst; zaimek odnoszący się do Jezusa zapisano małą literą zgodnie z neutralną współczesną normą przekładową.
