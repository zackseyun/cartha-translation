  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: pl
  text: 'A gdy jedli, powiedział: „Zaprawdę mówię wam: jeden z was mnie zdradzi[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub bardziej dosłownie: „wyda mnie” albo „przekaże mnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: gdy jedli
  rationale: Konstrukcja dopełniaczowa wyraża czynność równoczesną; „gdy jedli” naturalnie i zwięźle zachowuje tę relację czasową.
- source_word: Ἀμὴν
  choice: Zaprawdę
  rationale: W wypowiedziach Jezusa słowo to uroczyście potwierdza prawdziwość następującego stwierdzenia. „Zaprawdę” zachowuje podniosły, autorytatywny charakter formuły i jest zrozumiałe we współczesnej polszczyźnie biblijnej.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośredni i naturalny polski odpowiednik utrzymujący zwrot do uczniów.
- source_word: εἷς ἐξ ὑμῶν
  choice: jeden z was
  rationale: Naturalnie oddaje grecką konstrukcję cząstkową bez zbędnego rozwijania.
- source_word: παραδώσει
  choice: zdradzi
  rationale: Czasownik zasadniczo oznacza przekazanie lub wydanie kogoś, lecz w tym kontekście chodzi o zdradzieckie wydanie Jezusa przez jednego z uczniów. „Zdradzi” jasno przekazuje sens sytuacyjny, a przypis zachowuje szerszy, bardziej dosłowny sens słowa.
- source_word: με
  choice: mnie
  rationale: Bezpośredni zaimek dopełnienia odnoszący się do Jezusa.
theological_decisions:
- issue: Znaczenie παραδώσει w opisie męki
  choice: zdradzi
  alternative: wyda mnie
  rationale: „Zdradzi” uwydatnia nielojalność jednego z najbliższych uczniów, obecną w kontekście narracyjnym, natomiast przypis zachowuje bardziej dosłowny i szerszy sens czynności wydania Jezusa w cudze ręce.
translation_notes:
  register: Nowoczesna, zrozumiała polszczyzna o godnym rejestrze biblijnym. Zachowano tradycyjne „Zaprawdę”, ponieważ nadal jest jasne i dobrze oddaje uroczystą formułę Ἀμήν. Marker przypisu umieszczono przy „zdradzi”, którego dotyczy objaśnienie leksykalne.
