  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: pl
  text: 'Jezus powiedział mu: „Zaprawdę mówię ci: tej nocy, zanim zapieje kogut, trzy razy się mnie wyprzesz”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jezus powiedział mu
  rationale: Naturalny polski szyk narracyjny wiernie oddaje prosty czasownik mówienia i adresata wypowiedzi.
- source_word: Ἀμὴν λέγω σοι
  choice: Zaprawdę mówię ci
  rationale: Tradycyjna, lecz nadal zrozumiała i godna formuła zachowuje uroczyste zapewnienie oraz osobisty zwrot do Piotra.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: jeszcze tej nocy
  rationale: Naturalne po polsku określenie wskazuje na bieżącą noc i zachowuje nacisk demonstratywnego ταύτῃ; „jeszcze” uwydatnia, że zapowiedziane wydarzenie nastąpi przed jej końcem.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: zanim zapieje kogut
  rationale: Grecki bezokolicznik najlepiej oddaje naturalne polskie zdanie czasowe. Rzeczownik jest bez rodzajnika, lecz polszczyzna nie rozróżnia tu formalnie odpowiedników „a/the”.
- source_word: τρὶς
  choice: trzy razy
  rationale: Współczesny, jednoznaczny odpowiednik liczebnikowy.
- source_word: ἀπαρνήσῃ με
  choice: się mnie wyprzesz
  rationale: „Wyprzeć się kogoś” trafnie oddaje osobowe dopełnienie i sens zaparcia się więzi z Jezusem; czas przyszły zachowuje stanowczą zapowiedź.
theological_decisions:
- issue: Formuła wprowadzająca Ἀμὴν λέγω σοι
  choice: Zaprawdę mówię ci
  alternative: Amen, mówię ci; Zapewniam cię
  rationale: Wybrane brzmienie zachowuje uroczysty i autorytatywny charakter wypowiedzi Jezusa bez sprowadzania jej do zwykłego zapewnienia ani pozostawiania hebrajskiego zapożyczenia, które po polsku kojarzy się głównie z zakończeniem modlitwy.
- issue: Znaczenie ἀπαρνέομαι wobec osoby
  choice: wyprzeć się mnie
  alternative: zaprzeć się mnie; wyrzec się mnie; stwierdzić, że mnie nie zna
  rationale: „Wyprzeć się” zachowuje napięcie między zaprzeczeniem znajomości a odcięciem się od relacji, nie zawężając wypowiedzi do jednej późniejszej formuły Piotra.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano uroczyste „Zaprawdę”, natomiast pozostałą składnię ukształtowano naturalnie. Wszystkie znaczniki przypisów umieszczono w tekście głównym.
