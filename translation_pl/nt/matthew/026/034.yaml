  source_fidelity: „Jeszcze tej nocy” trafnie wskazuje na bieżącą noc, ale dodaje aspekt „zanim noc się skończy”, którego greckie ἐν ταύτῃ τῇ νυκτί samo w sobie nie wyraża. „Tej nocy” wiernie oddaje określenie czasowe z demonstratywnym naciskiem. Pozostałe elementy, w tym „zanim zapieje kogut”, „trzy razy” oraz „się mnie wyprzesz”, są zgodne z tekstem greckim.
  naturalness: Po usunięciu „jeszcze” zdanie pozostaje naturalne i ma godny, współczesny rejestr biblijnej narracji. „Zaprawdę mówię ci” jest nieco tradycyjne, lecz nadal zrozumiałe i adekwatnie oddaje uroczystą formułę Ἀμὴν λέγω σοι.
  terminology: „Wyprzesz się mnie” poprawnie oddaje ἀπαρνήσῃ με, nie zawężając sensu jedynie do słownego zaprzeczenia. Nie są potrzebne przypisy dotyczące rodzajnika greckiego, ponieważ polszczyzna nie posiada rodzajników, a ta informacja nie wyjaśnia różnicy przekładowej.
  issues:
