    rationale: Przypis a powtarza zasadniczo brzmienie po korekcie, a przypis b omawia grecki rodzajnik, dla którego polski nie ma formalnego odpowiednika. Żaden z nich nie jest konieczny do zachowania znaczenia ani wariantu.
