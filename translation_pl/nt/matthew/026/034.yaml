    rationale: Greckie ἐν ταύτῃ τῇ νυκτί znaczy „tej nocy”; „jeszcze” może sugerować dodatkowo, że wydarzenie nastąpi przed końcem nocy. Choć jest to zgodne z kontekstem, nie jest wyrażone w samym zwrocie greckim.
  - severity: low
