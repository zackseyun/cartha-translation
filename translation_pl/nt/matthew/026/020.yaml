lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Gdy nastał wieczór
  rationale: Konstrukcja dopełniaczowa niezależna wyznacza czas wydarzenia. To naturalne współczesne sformułowanie zachowuje sens temporalny greki.
- source_word: ἀνέκειτο
  choice: zajął miejsce przy stole
  rationale: Czasownik oznacza spoczywanie w pozycji półleżącej podczas posiłku. Polski idiom „zajął miejsce przy stole” jasno oddaje kontekst uczty bez sugerowania zwykłego leżenia, choć nie eksponuje antycznej pozycji ciała.
- source_word: μετὰ
  choice: wraz z
  rationale: Przyimek z dopełniaczem oznacza „z”; forma „wraz z” brzmi naturalnie i wyraźnie wskazuje na wspólne uczestnictwo.
- source_word: τῶν δώδεκα μαθητῶν
  choice: dwunastoma uczniami
  rationale: Rzeczownik μαθητῶν występuje w tekście SBLGNT, dlatego został przełożony. „Uczniowie” to utrwalony i trafny polski odpowiednik μαθηταί w Ewangeliach.
