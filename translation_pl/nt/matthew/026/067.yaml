  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: pl
  text: Wtedy pluli Mu w twarz i bili Go pięściami[a], a inni Go policzkowali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „uderzali Go pięściami” albo „okładali Go pięściami”. Grecki czasownik wskazuje na ciosy zadawane pięścią.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „uderzali Go otwartymi dłońmi”. Grecki czasownik często oznacza uderzenie w twarz otwartą dłonią.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, zachowujący następstwo wydarzeń w narracji.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: pluli Mu w twarz
  rationale: Polski idiom naturalnie oddaje bezpośrednie plucie w twarz jako akt pogardy; greckie εἰς τὸ πρόσωπον ma dosłownie kierunek „w twarz”.
- source_word: ἐκολάφισαν αὐτόν
  choice: bili Go pięściami
  rationale: κολαφίζω oznacza zadawanie ciosów pięścią. Sformułowanie jest konkretne, naturalne i mniej potoczne niż „okładali Go pięściami”.
- source_word: οἱ δὲ ἐράπισαν
  choice: a inni Go policzkowali
  rationale: Rodzajnik użyty rzeczownikowo wskazuje na „innych”, a ῥαπίζω zwykle oznacza uderzenie otwartą dłonią, zwłaszcza w twarz. Dopełnienie „Go” wynika z kontekstu.
- source_word: δέ
  choice: a
  rationale: Partykuła łagodnie wprowadza odrębną grupę lub kolejne działanie; polskie „a” naturalnie zachowuje to rozróżnienie bez nadawania mu silnego przeciwstawienia.
theological_decisions:
- issue: Opis znieważania i przemocy wobec Jezusa
  choice: 'Oddać konkretne czynności bez łagodzenia: plucie w twarz, bicie pięściami i policzkowanie.'
  alternative: Użyć ogólnego określenia, takiego jak „znęcali się nad Nim” lub „bili Go”.
  rationale: Tekst wyraźnie przedstawia upokorzenie i przemoc fizyczną. Konkretne słownictwo zachowuje siłę narracji bez dodawania komentarza teologicznego.
translation_notes:
  register: Współczesny, godny i bezpośredni język narracyjny. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej praktyce biblijnej. Zachowano rozróżnienie między biciem pięściami a uderzaniem otwartą dłonią.
