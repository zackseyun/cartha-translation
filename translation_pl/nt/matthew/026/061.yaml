id: MAT.26.61
reference: Matthew 26:61
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: pl
  text: 'Powiedzieli: „Ten człowiek powiedział: «Mogę zburzyć świątynię Boga i zbudować ją w trzy dni[a]»”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „w ciągu trzech dni”. Grecki zwrot może oznaczać ukończenie czynności w tym okresie.'
    reason: lexical_alternative
  - marker: b
    text: W J 2:19–21 wypowiedź Jezusa o świątyni zostaje odniesiona do Jego ciała.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Powiedzieli
  rationale: Aoryst przedstawia wypowiedź świadków jako pojedyncze wydarzenie w przeszłości; ta forma jest naturalna w polskiej narracji.
- source_word: Οὗτος
  choice: Ten człowiek
  rationale: W oskarżycielskiej wypowiedzi zachowuje wskazujący, lekceważący odcień zaimka, a zarazem brzmi naturalniej niż samo „ten”.
- source_word: ἔφη
  choice: powiedział
  rationale: Czasownik neutralnie wprowadza przytaczaną wypowiedź; mocniejsze „twierdził” niepotrzebnie interpretowałoby ton.
- source_word: Δύναμαι
  choice: Mogę
  rationale: Naturalnie oddaje zdolność wyrażoną przez δύναμαι, bez sztucznego „jestem w stanie”.
- source_word: καταλῦσαι
  choice: zburzyć
  rationale: W odniesieniu do budowli czasownik oznacza zniszczenie przez rozebranie lub zburzenie; „zburzyć” tworzy naturalną opozycję wobec „zbudować”.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: świątynię Boga
  rationale: Oddaje oskarżenie w jego bezpośrednim, budowlanym sensie; polski dopełniacz zachowuje prostą relację wyrażoną w grece.
- source_word: διὰ τριῶν ἡμερῶν
  choice: w trzy dni
  rationale: Zwięzły i idiomatyczny polski zwrot wyraża dokonanie czynności w podanym okresie, zachowując możliwość rozumienia go jako ukończenia przed upływem tego czasu.
- source_word: οἰκοδομῆσαι
  choice: zbudować ją
  rationale: „Zbudować” pozostaje blisko greckiego czasownika, a zaimek „ją” naturalnie uzupełnia w polszczyźnie domyślny obiekt; „odbudować” byłoby bardziej interpretacyjne.
theological_decisions:
- issue: Odniesienie wyrażenia „świątynia Boga” w oskarżeniu
  choice: Oskarżenie oddano na poziomie jego bezpośredniego brzmienia jako dotyczące fizycznej świątyni.
  alternative: Podporządkować przekład interpretacji z J 2:19–21, według której świątynia oznacza ciało Jezusa.
  rationale: Mateusz przytacza zeznanie oskarżycieli. Tekst główny powinien przekazywać treść ich zarzutu bez wprowadzania do niego Janowego objaśnienia; związek chrystologiczny wskazuje przypis.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zagnieżdżone cudzysłowy wyraźnie odróżniają słowa świadków od przypisywanej Jezusowi wypowiedzi; „Ten człowiek” zachowuje oskarżycielski ton bez archaizacji.
