  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: pl
  text: 'Wtedy zaczął przeklinać i przysięgać[a]: „Nie znam tego człowieka”. I natychmiast zapiał kogut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie można też oddać: „zaczął przywoływać przekleństwa i przysięgać”. Prawdopodobnie ściągał przekleństwo na samego siebie na wypadek, gdyby kłamał, aby wzmocnić swoje zaprzeczenie.'
    reason: Alternatywa leksykalna oraz objaśnienie prawdopodobnego sensu formuły przysięgi bez wpisywania go wprost do tekstu głównego.
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wyznaczającego kolejny etap wydarzeń.
- source_word: ἤρξατο
  choice: zaczął
  rationale: Oddaje znaczenie ingresywne konstrukcji z bezokolicznikami i narastanie gwałtowności zaparcia się Piotra.
- source_word: καταθεματίζειν
  choice: przeklinać
  rationale: Zwięzły, bezpośredni odpowiednik oznaczający wypowiadanie lub przywoływanie przekleństwa. Tekst główny nie dopowiada niewyrażonego wprost dopełnienia, a prawdopodobny sens samoprzekleństwa objaśnia przypis.
- source_word: ὀμνύειν
  choice: przysięgać
  rationale: Odnosi się do składania przysięgi, a nie do używania wulgaryzmów; zestawienie z „przeklinać” wyraża eskalację zaparcia.
- source_word: ὅτι
  choice: dwukropek i mowa niezależna
  rationale: Spójnik wprowadza treść przysięgi lub zaprzeczenia; w naturalnej polszczyźnie jasno oddaje ją bezpośredni cytat.
- source_word: Οὐκ οἶδα
  choice: Nie znam
  rationale: W odniesieniu do osoby οἶδα wyraża znajomość; „nie znam” jest naturalniejsze i trafniejsze niż „nie wiem”.
- source_word: τὸν ἄνθρωπον
  choice: tego człowieka
  rationale: Polskie „tego człowieka” naturalnie wskazuje na konkretną osobę obecną w rozmowie, choć greka ma rodzajnik, a nie zaimek wskazujący.
- source_word: καὶ εὐθέως
  choice: I natychmiast
  rationale: Zachowuje łącznik narracyjny oraz podkreśla bezzwłoczne spełnienie wcześniejszej zapowiedzi.
- source_word: ἀλέκτωρ
  choice: kogut
  rationale: Zwykłe współczesne polskie określenie ptaka; brak rodzajnika pozwala na naturalną konstrukcję bez dodatkowego określenia.
- source_word: ἐφώνησεν
  choice: zapiał
  rationale: Idi عomatyczny polski czasownik opisujący głos koguta.
theological_decisions:
- issue: Znaczenie καταθεματίζειν w zaparciu się Piotra
  choice: 'W tekście głównym: „przeklinać”; w przypisie: prawdopodobne przywoływanie przekleństwa na samego siebie dla wzmocnienia przysięgi.'
  alternative: 'Dopowiedzenie w tekście głównym: „ściągać na siebie przekleństwo” albo rozumienie, że Piotr przeklinał Jezusa.'
  rationale: Połączenie z ὀμνύειν przemawia za formułą samoprzekleństwa towarzyszącą przysiędze, lecz sam czasownik nie ma wyrażonego dopełnienia zwrotnego. Neutralny tekst główny zachowuje tę niejednoznaczność i nie sugeruje, że Piotr przeklinał Jezusa.
translation_notes:
  register: Współczesna, godna i płynna polszczyzna narracyjna. Rozróżnienie „przeklinać” i „przysięgać” zachowuje dwa greckie bezokoliczniki; przypis zapobiega odczytaniu pierwszego wyłącznie jako używania wulgaryzmów.
