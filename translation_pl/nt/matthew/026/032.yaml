  text: Lecz po tym, jak zostanę wskrzeszony[a], pójdę przed wami do Galilei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „po moim zmartwychwstaniu”. Greka używa dosłowniej strony biernej: „po tym, jak zostanę wskrzeszony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Lecz gdy
  rationale: Konstrukcja μετά z bezokolicznikiem rodzajnikowym wyznacza następstwo czasowe, a δέ wprowadza łagodny kontrast z wcześniejszą zapowiedzią upadku uczniów. Polskie „lecz gdy” oddaje oba elementy naturalnie.
- source_word: τὸ ἐγερθῆναί με
  choice: gdy zostanę wskrzeszony
  rationale: Aorystyczny bezokolicznik strony biernej od ἐγείρω ma podmiot w bierniku με. Przekład zachowuje stronę bierną i typowy dla kontekstu zmartwychwstania sens, nie nazywając wprost sprawcy działania.
- source_word: προάξω
  choice: pójdę przed
  rationale: Czasownik oznacza tutaj pójście wcześniej lub przed kimś. „Pójdę przed wami” jest współczesne i naturalne, a zarazem nie narzuca silniejszego sensu „poprowadzę”.
- source_word: ὑμᾶς
  choice: wami
  rationale: Zaimek drugiej osoby liczby mnogiej zostaje jednoznacznie oddany polską formą liczby mnogiej.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: do Galilei
  rationale: Przy ruchu ku nazwie regionu polskie „do Galilei” naturalnie oddaje εἰς i jest bardziej idiomatyczne niż dosłowne „w Galileę”.
theological_decisions:
- issue: Strona bierna w ἐγερθῆναί
  choice: gdy zostanę wskrzeszony
  alternative: gdy zmartwychwstanę / gdy powstanę
  rationale: Zachowano wyraźną w grece stronę bierną, która może sugerować działanie Boga, lecz tekst nie wskazuje sprawcy wprost. Przypis podaje naturalną polską alternatywę w stronie czynnej.
- issue: Znaczenie προάξω
  choice: pójdę przed wami
  alternative: poprowadzę was / wyprzedzę was
  rationale: Wybrana forma zachowuje podstawowy sens pierwszeństwa w drodze, nie rozstrzygając, czy czasownik niesie tu dodatkowy odcień przewodzenia.
translation_notes:
  register: Język współczesny, prosty i godny. Zdanie zachowuje łagodny kontrast, bierną formę wypowiedzi o wskrzeszeniu oraz kierunkowy sens pójścia przed uczniami.
