  - marker: b
    text: 'Możliwe też: „na dziedziniec”. Greckie słowo może oznaczać dziedziniec, zwłaszcza należący do dużej rezydencji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, wprowadzający kolejne wydarzenie.
- source_word: συνήχθησαν
  choice: zgromadzili się
  rationale: Naturalnie oddaje zebranie się grupy; przypis zachowuje informację, że grecka forma ma stronę bierną.
- source_word: ἀρχιερεῖς
  choice: naczelni kapłani
  rationale: Utrwalone określenie zwierzchników kapłańskich; nie sugeruje, że wszyscy sprawowali pojedynczy urząd arcykapłana.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: starsi ludu
  rationale: Zwięzłe i tradycyjnie zrozumiałe oddanie uznanych przywódców społeczności.
- source_word: εἰς τὴν αὐλὴν
  choice: na dziedzińcu
  rationale: Przy czasowniku oznaczającym zgromadzenie polszczyzna naturalnie wskazuje miejsce będące rezultatem ruchu; αὐλή oznacza tu dziedziniec dużej rezydencji.
- source_word: τοῦ ἀρχιερέως
  choice: arcykapłana
  rationale: Precyzyjnie określa pojedynczego piastuna urzędu w tym kontekście.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: zwanego Kajfaszem
  rationale: Oddaje imiesłowową identyfikację arcykapłana i zachowuje naturalny, godny styl polski.
