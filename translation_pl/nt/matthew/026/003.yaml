  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: pl
  text: Wtedy naczelni kapłani i starsi ludu zgromadzili się[a] na dziedzińcu[b] arcykapłana zwanego Kajfaszem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie można też oddać: „zostali zgromadzeni”; grecki czasownik ma formę strony biernej.'
