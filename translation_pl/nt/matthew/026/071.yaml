lexical_decisions:
- source_word: πυλών
  choice: brama
  rationale: W tym kontekście oznacza wejście lub przejście bramne prowadzące z dziedzińca; naturalne polskie „ku bramie” zachowuje kierunkowy sens εἰς.
- source_word: λέγει
  choice: mówi
  rationale: Zachowano grecki czas teraźniejszy historyczny, zgodnie ze świadectwem tekstu źródłowego.
- source_word: ὁ Ναζωραῖος
  choice: Nazarejczyk
  rationale: Naturalny i tradycyjny polski odpowiednik określenia Jezusa jako pochodzącego z Nazaretu.
