  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: pl
  text: Wziąwszy ze sobą Piotra i dwóch synów Zebedeusza, zaczął się smucić i odczuwać głęboki niepokój.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν
  choice: wziąwszy ze sobą
  rationale: Imiesłów aorystu wskazuje, że Jezus zabrał wybranych uczniów dalej ze sobą; to naturalny polski odpowiednik zachowujący relacyjny sens czasownika.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: dwóch synów Zebedeusza
  rationale: Zachowano dosłowne określenie z tekstu greckiego, bez dopowiadania imion Jakuba i Jana.
- source_word: ἤρξατο
  choice: zaczął
  rationale: Oddaje wyraźny aspekt ingresywny konstrukcji z bezokolicznikami.
- source_word: λυπεῖσθαι
  choice: się smucić
  rationale: Wyraża rzeczywiste doświadczanie smutku i pozostaje naturalne, zrozumiałe oraz godne we współczesnej polszczyźnie.
- source_word: ἀδημονεῖν
  choice: odczuwać głęboki niepokój
  rationale: Czasownik oznacza dotkliwe wewnętrzne udręczenie lub silny niepokój; sformułowanie odróżnia go od λυπεῖσθαι, nie wprowadzając ponadtekstowej idei rozpaczy.
- source_word: καὶ ... καὶ
  choice: i ... i
  rationale: Spójniki zachowują narastające zestawienie osób oraz dwóch stanów emocjonalnych, a zarazem brzmią naturalnie po polsku.
theological_decisions:
- issue: Opis emocjonalnego stanu Jezusa w świetle chrystologii
  choice: Oba czasowniki oddano wprost jako rzeczywisty ludzki smutek i głęboki niepokój.
  alternative: Osłabienie opisu emocjonalnej podatności albo wzmocnienie go do „przerażenia” czy „rozpaczy”.
  rationale: Tekst ukazuje autentyczne ludzkie cierpienie emocjonalne Jezusa. Przekład nie powinien go łagodzić ani wykraczać poza świadectwo greckich słów, sugerując beznadziejną rozpacz.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Składnia imiesłowowa zachowuje zwięzłą strukturę greckiego zdania; fraza „odczuwać głęboki niepokój” jasno komunikuje intensywność ἀδημονεῖν bez archaizacji.
