  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: pl
  text: 'Ponownie odszedł i po raz drugi modlił się, mówiąc: „Mój Ojcze, jeśli to[a] nie może przeminąć, chyba że to wypiję[b], niech się stanie Twoja wola”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chodzi o kielich cierpienia wspomniany w poprzednim wersecie; po grecku w tym miejscu występuje jedynie „to”.
    reason: cross_reference
  - marker: b
    text: 'Możliwe też: „jeśli nie jest możliwe, aby to przeminęło, chyba że to wypiję”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Ponownie ... po raz drugi
  rationale: Zachowuje oba greckie określenia powtórzenia, a zarazem brzmi naturalnie w polskiej narracji.
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: odszedł i ... modlił się słowami
  rationale: Imiesłowową konstrukcję grecką oddano naturalnym polskim zdaniem współrzędnym; „słowami” płynnie wprowadza treść modlitwy.
- source_word: Πάτερ μου
  choice: Mój Ojcze
  rationale: Bezpośrednio oddaje wołacz i zaimek dzierżawczy, zachowując osobisty charakter zwrotu.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: jeśli to nie może przeminąć
  rationale: Zachowuje demonstratywne „to” bez dopowiadania rzeczownika „kielich” oraz sens niemożności wyrażony przez οὐ δύναται.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: chyba że to wypiję
  rationale: „Chyba że” naturalnie oddaje warunek wyłączający ἐὰν μή, a „to” zachowuje odniesienie αὐτό bez dodawania nieobecnego w wersecie słowa „kielich”.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: niech się stanie Twoja wola
  rationale: Oddaje imperatywną formę modlitwy i zachowuje spójność z brzmieniem Modlitwy Pańskiej w Mt 6,10.
theological_decisions:
- issue: Czy w tekście głównym dopowiedzieć „kielich” przy τοῦτο i αὐτό
  choice: Pozostawiono „to” ... „to”
  alternative: „ten kielich” ... „go”
  rationale: Kontekst Mt 26,39 jednoznacznie wskazuje na kielich cierpienia, lecz w samym wersecie 26,42 rzeczownik ποτήριον nie występuje. Zachowanie zaimków nie zaciera tej różnicy i nie usuwa zamierzonego odniesienia kontekstowego.
- issue: Oddanie modlitwy poddania woli Ojca
  choice: niech się stanie Twoja wola
  alternative: niech spełni się Twoja wola
  rationale: Wybrana forma zachowuje podstawowy sens γίνομαι, siłę imperatywu oraz więź słowną z Mt 6,10, bez dodatkowej interpretacji.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia modlitwy zachowuje uroczysty ton bez archaizmów; wielka litera w „Twoja” odpowiada polskiej konwencji zapisu zwrotu do Boga.
