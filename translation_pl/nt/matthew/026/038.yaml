  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: pl
  text: 'Wtedy mówi im: „Moja dusza jest pogrążona w głębokim smutku, aż do śmierci[a]. Zostańcie tutaj i czuwajcie ze mną[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „do granic śmierci” lub „aż po śmierć”.'
    reason: lexical_alternative
  - marker: b
    text: 'Greckie słowo może oznaczać zarówno czujne trwanie, jak i dosłowne pozostawanie bez snu: „pozostańcie ze mną na jawie”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski spójnik czasowy, zachowujący następstwo wydarzeń w narracji.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki praesens historicum i jego narracyjną bezpośredniość; polszczyzna dopuszcza taki czas teraźniejszy w żywej relacji.
- source_word: αὐτοῖς
  choice: im
  rationale: Naturalny odpowiednik celownika wskazującego adresatów wypowiedzi.
- source_word: Περίλυπός
  choice: pogrążona w głębokim smutku
  rationale: Oddaje wyjątkowo intensywny smutek lub udrękę wyrażoną przez περίλυπος, a zarazem łączy się naturalnie z zachowanym rzeczownikiem „dusza”.
- source_word: ἡ ψυχή μου
  choice: Moja dusza
  rationale: Zachowuje wyraźnie użyte ψυχή oraz ciężar wypowiedzi o najgłębszym cierpieniu Jezusa, bez narzucania technicznej antropologii.
- source_word: ἕως θανάτου
  choice: aż do śmierci
  rationale: Bliski i idiomatyczny odpowiednik wyrażenia granicy lub skrajnego natężenia; pozostawia otwarte, czy chodzi o smutek sięgający śmierci, czy o smutek tak wielki, że prowadzi do granicy śmierci.
- source_word: μείνατε
  choice: Zostańcie
  rationale: Naturalny polski tryb rozkazujący oznaczający pozostanie w danym miejscu.
- source_word: ὧδε
  choice: tutaj
  rationale: Bezpośredni, współczesny odpowiednik przysłówka miejsca.
- source_word: γρηγορεῖτε
  choice: czuwajcie
  rationale: Polskie „czuwać” obejmuje zarówno niezasypianie, jak i świadomą, uważną gotowość, dzięki czemu zachowuje oba odcienie greckiego czasownika.
- source_word: μετ’ ἐμοῦ
  choice: ze mną
  rationale: Naturalnie oddaje towarzyszenie wyrażone przez μετά z dopełniaczem.
theological_decisions:
- issue: Sposób oddania ψυχή w wypowiedzi Jezusa
  choice: Moja dusza
  alternative: Jestem pogrążony w głębokim smutku
  rationale: Zachowanie rzeczownika nie redukuje wypowiedzi do samego zaimka i pozwala wybrzmieć realności głębokiego ludzkiego cierpienia Jezusa, nie przesądzając przy tym szczegółowej doktryny o budowie człowieka.
- issue: Zakres znaczeniowy γρηγορεῖτε
  choice: czuwajcie
  alternative: nie zasypiajcie / pozostańcie przytomni
  rationale: W kontekście Getsemani czasownik może oznaczać zarówno dosłowne pozostawanie bez snu, jak i czujność. „Czuwajcie” zachowuje oba aspekty, a przypis podaje bardziej dosłowną możliwość.
- issue: Znaczenie ἕως θανάτου
  choice: aż do śmierci
  alternative: do granic śmierci / tak bardzo, że mógłbym umrzeć
  rationale: Tekst wyraża skrajność smutku, ale nie rozstrzyga precyzyjnie relacji między tym smutkiem a śmiercią. Dosłownie bliskie brzmienie zachowuje tę napiętą wieloznaczność.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym tonie. Zachowano narracyjny czas teraźniejszy („mówi”), wyraz „dusza” oraz zwięzłe polecenia Jezusa. Uniknięto archaizmów takich jak „aż po śmierć” czy „pozostańcie”, wybierając naturalne „aż do śmierci” i „zostańcie”.
