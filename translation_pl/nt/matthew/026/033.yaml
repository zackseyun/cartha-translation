  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: pl
  text: 'Lecz Piotr odpowiedział mu: „Choćby wszyscy z twojego powodu odstąpili[a], ja nigdy nie odstąpię”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „potknęli się”, „poczuli się urażeni” lub „zostali doprowadzeni do upadku”. Grecki czasownik może oznaczać potknięcie się, poczucie urazy albo odstąpienie; w tej formie może również wskazywać na bycie doprowadzonym do upadku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Lecz Piotr odpowiedział mu
  rationale: Grecka konstrukcja imiesłowu z czasownikiem mówienia jest idiomatycznym wprowadzeniem wypowiedzi. Współczesne polskie „odpowiedział mu” oddaje ją naturalnie, a „lecz” zaznacza kontrast wobec wcześniejszej zapowiedzi Jezusa.
- source_word: Εἰ πάντες
  choice: Choćby wszyscy
  rationale: 'Formalnie εἰ znaczy „jeśli”, lecz tutaj wypowiedź ma sens przyzwalający i emfatyczny: nawet gdyby dotyczyło to wszystkich innych.'
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: odstąpili / odstąpię
  rationale: W kontekście uczniów opuszczających Jezusa czasownik wskazuje na zachwianie lojalności i wycofanie się. „Odstąpić” oddaje ten sens mocniej niż samo „potknąć się”, nie rozstrzygając jednak, czy chodzi o ostateczne odstępstwo.
- source_word: ἐν σοί
  choice: z twojego powodu
  rationale: Przy σκανδαλίζω wyrażenie wskazuje na osobę, w związku z którą lub z której powodu ktoś się potyka albo odstępuje. Polski zwrot jest naturalny i zachowuje osobiste odniesienie do Jezusa.
- source_word: ἐγὼ οὐδέποτε
  choice: ja nigdy
  rationale: Jawny zaimek ἐγώ jest emfatyczny i przeciwstawia Piotra wszystkim pozostałym; „nigdy” zwięźle oddaje mocne οὐδέποτε.
theological_decisions:
- issue: Znaczenie σκανδαλίζω w kontekście zawodności uczniów
  choice: odstąpić
  alternative: potknąć się; załamać się; poczuć się urażonym
  rationale: Kontekst wskazuje na opuszczenie Jezusa pod naciskiem, dlatego „odstąpić” jasno wyraża załamanie uczniowskiej lojalności. Przypis zachowuje szerszy zakres greckiego czasownika, a przekład nie przesądza kwestii ostatecznej apostazji.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zdanie zachowuje stanowczy kontrast między „wszyscy” a emfatycznym „ja nigdy”; zaimki odnoszące się do Jezusa zapisano małą literą zgodnie ze standardową współczesną polszczyzną.
