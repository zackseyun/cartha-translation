  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: pl
  text: 'Piotr zaś siedział na zewnątrz, na dziedzińcu. Podeszła do niego pewna służąca[a] i powiedziała: „Ty też byłeś z Jezusem Galilejczykiem”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „młoda służąca” albo „niewolnica”. Greckie παιδίσκη może oznaczać młodą kobietę pełniącą służbę, niekiedy mającą status niewolnicy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Łagodnie zaznacza przejście narracji z przesłuchania Jezusa do Piotra, nie wprowadzając nieobecnego w grece określenia czasu.
- source_word: ἐκάθητο ἔξω
  choice: siedział na zewnątrz
  rationale: Czas niedokonany oddaje trwającą sytuację, a „na zewnątrz” wskazuje położenie Piotra względem wnętrza, w którym toczyło się przesłuchanie.
- source_word: ἐν τῇ αὐλῇ
  choice: na dziedzińcu
  rationale: αὐλή oznacza tutaj otwarty dziedziniec należący do siedziby arcykapłana.
- source_word: προσῆλθεν αὐτῷ
  choice: podeszła do niego
  rationale: Naturalnie oddaje fizyczne zbliżenie się służącej do Piotra.
- source_word: μία παιδίσκη
  choice: pewna służąca
  rationale: μία przedstawia konkretną, dotąd niewspomnianą osobę, co po polsku naturalnie oddaje „pewna”; παιδίσκη określa młodą służącą i może, lecz nie musi, wskazywać na status niewolnicy.
- source_word: λέγουσα
  choice: i powiedziała
  rationale: Polskie zdanie współrzędne naturalnie oddaje okolicznikowy imiesłów grecki bez zmiany kolejności wydarzeń.
- source_word: Καὶ σὺ
  choice: Ty też
  rationale: 'Zachowuje nacisk położony na zaimek σὺ oraz włączające znaczenie καί: Piotr zostaje wskazany jako kolejna osoba związana z Jezusem.'
- source_word: ἦσθα μετὰ
  choice: byłeś z
  rationale: Proste sformułowanie zachowuje relacyjny sens tekstu bez dopowiadania, że chodzi o formalne uczniostwo.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jezusem Galilejczykiem
  rationale: Oddaje Γαλιλαῖος jako określenie identyfikujące Jezusa przez Jego pochodzenie regionalne.
theological_decisions: []
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Konstrukcja „Piotr zaś” zachowuje łagodne przejście greckiego δὲ, a „pewna służąca” brzmi idiomatycznie i nie rozstrzyga ponad tekst jej dokładnego statusu społecznego.
