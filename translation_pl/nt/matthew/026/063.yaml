id: MAT.26.63
reference: Matthew 26:63
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: pl
  text: 'Jezus jednak milczał. Wtedy arcykapłan powiedział do Niego: „Zaklinam Cię na Boga żywego[a]: powiedz nam, czy Ty jesteś Mesjaszem[b], Synem Boga”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'To uroczysta formuła wezwania pod przysięgą; można też przełożyć: „Zobowiązuję Cię pod przysięgą przed Bogiem żywym”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „Chrystusem”. Greckie Christos jest tutaj tytułem i znaczy „Pomazaniec”, czyli „Mesjasz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: milczał
  rationale: Imperfectum przedstawia trwające milczenie Jezusa; polskie „milczał” naturalnie oddaje ten aspekt w kontekście narracyjnym.
- source_word: ἀρχιερεὺς
  choice: arcykapłan
  rationale: To utrwalona i precyzyjna polska nazwa najwyższego urzędu kapłańskiego w tym kontekście.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Zaklinam Cię na Boga żywego
  rationale: Sformułowanie zachowuje uroczysty charakter wezwania pod przysięgą i odwołanie się do Boga, nie nadając czasownikowi sensu związanego z egzorcyzmem.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: powiedz nam
  rationale: Po formule zaklinania konstrukcja wskazuje na żądaną treść wypowiedzi; polski tryb rozkazujący oddaje ją jasno i naturalnie.
- source_word: ὁ χριστός
  choice: Mesjasz
  rationale: Rodzajnik i kontekst przesłuchania wskazują, że chodzi o tytuł oczekiwanego Pomazańca, a nie o imię własne.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Syn Boga
  rationale: Dosłownie zachowuje tytuł chrystologiczny i jego określony charakter bez dopowiadania relacji między tytułami.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jezus jednak
  rationale: „Jednak” oddaje łagodny kontrast sygnalizowany przez δέ wobec wcześniejszych oskarżeń i wezwania do odpowiedzi.
theological_decisions:
- issue: Oddanie tytułu Χριστός w pytaniu arcykapłana
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym miejscu wyraz funkcjonuje jako tytuł oczekiwanego Pomazańca. Wariant „Chrystus” pozostaje możliwy i został zachowany w przypisie.
- issue: Charakter formuły Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: uroczyste zaklęcie na Boga, mające moc wezwania pod przysięgą
  alternative: „Zobowiązuję Cię pod przysięgą przed Bogiem żywym”
  rationale: Grecka formuła ma uroczysty, sądowy charakter. „Zaklinam Cię na Boga żywego” zachowuje jej zwięzłość oraz siłę, a przypis objaśnia sens prawno-przysięgowy.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie podniosłym tonie. Składnia dialogu jest naturalna, a tradycyjna formuła „Zaklinam Cię na Boga żywego” zachowuje uroczystość sceny. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej konwencji biblijnej.
