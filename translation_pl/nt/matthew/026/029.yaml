base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: pl
  text: 'Mówię wam jednak: odtąd na pewno nie będę pił z tego owocu winorośli aż do owego dnia, kiedy będę go pił z wami jako coś nowego[a] w królestwie mojego Ojca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na nowo”. Grecki przymiotnik może oznaczać nowość rodzaju lub jakości, a całe wyrażenie może sugerować picie go w nowy sposób w nadchodzącym królestwie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mówię wam jednak
  rationale: δέ ma tu łagodny odcień przeciwstawny lub przejściowy. Konstrukcja z „jednak” zachowuje ten odcień bez nadmiernego wzmacniania kontrastu.
- source_word: οὐ μὴ πίω
  choice: na pewno nie będę pił
  rationale: Połączenie οὐ μή z aorystem trybu łączącego wyraża emfatyczne zaprzeczenie dotyczące przyszłości. „Na pewno nie będę” oddaje nacisk w naturalnej współczesnej polszczyźnie.
- source_word: ἀπ’ ἄρτι
  choice: odtąd
  rationale: Wyrażenie wskazuje na czas od obecnej chwili naprzód; „odtąd” jest zwięzłe i precyzyjne.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: z tego owocu winorośli
  rationale: γένημα oznacza owoc lub produkt. Zachowano źródłowy idiom odnoszący się do zawartości kielicha, zamiast zastępować go interpretacyjnym „winem”.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: aż do owego dnia
  rationale: „Ów dzień” zachowuje wskazujący i uroczysty charakter ἐκείνης oraz odniesienie do określonego przyszłego dnia.
- source_word: ὅταν αὐτὸ πίνω
  choice: kiedy będę pił go
  rationale: ὅταν z trybem łączącym wskazuje tu na przyszłe zdarzenie; zaimek „go” odsyła do „owocu winorośli”, czyli zawartości kielicha.
- source_word: καινὸν
  choice: jako nowy
  rationale: Przymiotnik καινός określa zaimek αὐτό i może oznaczać nowość rodzaju lub jakości. Konstrukcja „jako nowy” zachowuje predykatywny charakter wyrażenia i nie rozstrzyga, na czym dokładnie polega ta nowość.
- source_word: μεθ’ ὑμῶν
  choice: z wami
  rationale: Proste i naturalne oddanie znaczenia wspólnego uczestnictwa.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: w królestwie mojego Ojca
  rationale: Sformułowanie jest bliskie greckiemu szykowi i zachowuje uroczysty charakter odniesienia Jezusa do Ojca.
theological_decisions:
- issue: Czy zawartość kielicha nazwać wprost winem
  choice: Zachowano wyrażenie „owoc winorośli”
  alternative: wino
  rationale: Tekst grecki nie używa słowa οἶνος, lecz idiomu „owoc/produkt winorośli”. Jego zachowanie respektuje źródło i nie wprowadza większej sakramentalnej ani symbolicznej precyzji, niż zawiera sam werset.
- issue: Znaczenie καινὸν w przyszłej uczcie królestwa
  choice: „jako nowy” w tekście głównym
  alternative: „na nowo” lub „w nowy sposób”
  rationale: Przymiotnik może wskazywać na nowość jakości lub rodzaju, a w kontekście może również sugerować ponowne picie w nowej rzeczywistości. Tekst główny pozostawia to napięcie nierozstrzygnięte, a przypis podaje możliwy wariant.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie uroczystym rejestrze. Zachowano semicki idiom „owoc winorośli” oraz emfatyczne zaprzeczenie. Nieco nietypowe „pić go jako nowy” świadomie odzwierciedla predykatywne καινόν i wraz z przypisem chroni źródłową wieloznaczność.
