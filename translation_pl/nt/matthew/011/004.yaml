  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: pl
  text: 'Jezus odpowiedział im: „Idźcie i przekażcie Janowi, co słyszycie i widzicie:”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: '[pominięte jako osobne „i”]'
  rationale: Na początku zdania καί kontynuuje narrację. W naturalnej współczesnej polszczyźnie nie musi być oddane osobnym spójnikiem, gdy ciągłość wynika z kontekstu.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: odpowiedział im
  rationale: Grecka formuła narracyjna dosłownie łączy imiesłów „odpowiedziawszy” z czasownikiem „powiedział”. Polskie „odpowiedział im” naturalnie zachowuje jej funkcję bez zbędnego powtórzenia.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Rodzajnika przed imieniem własnym nie oddaje się w standardowej polszczyźnie.
- source_word: Πορευθέντες
  choice: Idźcie
  rationale: Imiesłów poprzedzający tryb rozkazujący ma tu sens towarzyszącego polecenia; forma „Idźcie” jasno zachowuje jego siłę rozkazującą.
- source_word: ἀπαγγείλατε
  choice: opowiedzcie
  rationale: Czasownik oznacza przekazanie lub zdanie relacji. „Opowiedzcie Janowi” brzmi naturalnie i wskazuje, że posłańcy mają przekazać mu to, czego byli świadkami.
- source_word: Ἰωάννῃ
  choice: Janowi
  rationale: Celownik wskazuje odbiorcę przekazywanej wiadomości.
- source_word: ἃ
  choice: co
  rationale: Zaimek względny w rodzaju nijakim liczby mnogiej odnosi się do treści obserwacji; polskie „co” jest naturalnym odpowiednikiem.
- source_word: ἀκούετε καὶ βλέπετε
  choice: słyszycie i widzicie
  rationale: Czas teraźniejszy opisuje aktualne doświadczenie wysłanników, a zestawienie obu czasowników zachowano bez zmiany.
theological_decisions:
- issue: Oddanie formuły ἀποκριθεὶς ... εἶπεν
  choice: Jezus odpowiedział im
  alternative: A Jezus, odpowiadając, powiedział im
  rationale: Skrócona forma jest idiomatyczna po polsku i zachowuje funkcję wypowiedzi jako odpowiedzi. Pełniejsza konstrukcja nie wnosi dodatkowej treści teologicznej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano bezpośrednie polecenie oraz kolejność „słyszycie i widzicie”. Dwukropek na końcu wskazuje, że wypowiedź jest kontynuowana w następnym wersecie.
