id: MAT.11.11
reference: Matthew 11:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: pl
  text: 'Zaprawdę mówię wam: wśród narodzonych z kobiet[a] nie powstał[b] nikt większy niż Jan Chrzciciel. A jednak najmniejszy[c] w królestwie niebios jest większy od niego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wyrażenie „narodzeni z kobiet” jest semickim sposobem mówienia o ludziach.
    reason: cultural_note
  - marker: b
    text: 'Możliwe także: „nie został wzbudzony”. Grecki czasownik może oznaczać zarówno „powstać”, jak i „zostać wzbudzonym”; tutaj najpewniej chodzi o pojawienie się na scenie dziejów, nie o zmartwychwstanie.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „mniejszy”. Grecki używa stopnia wyższego; w tym kontekście może chodzić o osobę najmniejszą rangą lub znaczeniem w królestwie niebios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Oddaje uroczystą, autorytatywną formułę Jezusa w rozpoznawalnym, godnym i nadal zrozumiałym współczesnym języku polskim.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: wśród narodzonych z kobiet
  rationale: Zachowuje semicki obraz odnoszący się do ludzi, nie zastępując go objaśniającym wyrażeniem „wśród ludzi”.
- source_word: οὐκ ἐγήγερται
  choice: nie powstał
  rationale: Greckie perfectum wskazuje na zaistnienie osoby w dziejach i wynikający z tego stan. „Nie powstał” zachowuje obraz źródłowy oraz jego możliwą wieloznaczność.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: nikt większy niż Jan Chrzciciel
  rationale: Naturalnie po polsku wyraża przeczące porównanie zawarte w konstrukcji greckiej.
- source_word: τοῦ βαπτιστοῦ
  choice: Chrzciciel
  rationale: To utrwalone i powszechnie zrozumiałe polskie określenie Jana, odpowiadające greckiemu tytułowi βαπτιστής.
- source_word: ὁ δὲ μικρότερος
  choice: A jednak najmniejszy
  rationale: Forma grecka jest stopniem wyższym, lecz w tym kontekście idiomatycznie wskazuje na osobę o najniższej randze lub pozycji. „A jednak” wyraźnie oddaje paradoksalny kontrast δέ.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: w królestwie niebios
  rationale: Zachowuje charakterystyczne dla Mateusza określenie i liczbę mnogą οὐρανῶν, a zarazem brzmi naturalnie w polszczyźnie biblijnej.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: jest większy od niego
  rationale: Bezpośrednio i naturalnie oddaje porównanie, nie dopowiadając, na czym polega ta wielkość.
theological_decisions:
- issue: Na czym polega wyższość najmniejszego w królestwie nad Janem
  choice: Pozostawić paradoksalne porównanie bez wyjaśnienia jego podstawy.
  alternative: Objaśnić je jako różnicę między epokami przymierza, pozycję w historii zbawienia albo przywilej uczniów.
  rationale: Sam werset nie wyjaśnia mechanizmu tego porównania. Przekład powinien zachować napięcie teologiczne, zamiast rozstrzygać je na rzecz jednej interpretacji.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. Zachowano rozpoznawalną formułę „Zaprawdę mówię wam”, semicki obraz „narodzonych z kobiet” oraz Mateuszowe „królestwo niebios”, unikając archaicznej składni i interpretacyjnego wygładzania paradoksu.
