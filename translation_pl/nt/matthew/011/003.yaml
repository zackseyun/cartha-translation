id: MAT.11.3
reference: Matthew 11:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: pl
  text: 'i powiedział mu: „Czy Ty jesteś Tym, który ma przyjść[a], czy mamy oczekiwać kogoś innego?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Ten, który przychodzi” albo „Przychodzący”. Greckie wyrażenie może pełnić funkcję tytułu mesjańskiego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: i powiedział mu
  rationale: Aoryst εἶπεν znaczy „powiedział”, a αὐτῷ — „mu”. Spójnik „i” naturalnie łączy zdanie z poprzedzającą narracją, choć nie ma osobnego odpowiednika w podanym tekście greckim.
- source_word: Σὺ εἶ
  choice: Czy Ty jesteś
  rationale: Polska forma pytajna zachowuje wyraźny zaimek σύ i wynikający z niego nacisk na osobę Jezusa.
- source_word: ὁ ἐρχόμενος
  choice: Ten, który ma przyjść
  rationale: Rodzajnik z imiesłowem tworzy określenie rzeczownikowe. Sformułowanie brzmi naturalnie po polsku i zachowuje zarówno sens osoby mającej przyjść, jak i możliwą funkcję tytułu mesjańskiego, bez zastępowania go słowem „Mesjasz”.
- source_word: ἢ
  choice: czy
  rationale: W polskim pytaniu alternatywnym „czy” naturalnie wprowadza drugą możliwość.
- source_word: ἕτερον
  choice: kogoś innego
  rationale: Męska forma ἕτερον wskazuje na inną osobę. „Kogoś innego” jest w tym zdaniu bardziej naturalne niż dosłowne „innego”.
- source_word: προσδοκῶμεν
  choice: mamy oczekiwać
  rationale: 'W pytaniu czasownik ma sens deliberatywny: chodzi o to, czy należy oczekiwać innej osoby. Przekład zachowuje znaczenie oczekiwania bez zawężania go do samego czekania.'
theological_decisions:
- issue: Mesjańska lub tytularna funkcja ὁ ἐρχόμενος
  choice: Ten, który ma przyjść
  alternative: Przychodzący; ten, który przychodzi; oczekiwany Mesjasz
  rationale: Kontekst pozwala rozumieć to wyrażenie jako tytuł oczekiwanej postaci mesjańskiej, ale sama greka nie zawiera rzeczownika „Mesjasz”. Przekład zachowuje tę aluzję i zarazem leksykalną otwartość oryginału.
translation_notes:
  register: Współczesny, godny i łatwo zrozumiały rejestr. Wielka litera w wyrażeniu „Tym, który ma przyjść” sygnalizuje możliwą funkcję tytułu w tym kontekście, nie dodając wprost określenia „Mesjasz”.
