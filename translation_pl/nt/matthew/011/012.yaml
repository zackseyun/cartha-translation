  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: pl
  text: Lecz od dni Jana Chrzciciela aż do teraz[a] królestwo niebios doznaje przemocy, a ludzie gwałtowni porywają je.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „królestwo niebios z mocą toruje sobie drogę, a ludzie gwałtowni porywają je”. Grecki czasownik przełożony jako „doznaje przemocy” może być rozumiany także w znaczeniu medialnym lub nieprzechodnim.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Lecz od
  rationale: ἀπό wyznacza początek okresu („od”), a δέ sygnalizuje łagodne przejście lub przeciwstawienie. „Lecz od” zachowuje zmianę toku wypowiedzi bez nadmiernego wzmacniania kontrastu.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: dni Jana Chrzciciela
  rationale: Dosłownie i naturalnie oddaje grecką konstrukcję dopełniaczową oraz zachowuje biblijny idiom „dni” zamiast interpretującego „czasu”.
- source_word: ἕως ἄρτι
  choice: aż do teraz
  rationale: Naturalne współczesne sformułowanie, wyrażające ciągłość od dni Jana po chwilę wypowiedzi.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Utrwalony, godny i zrozumiały polski odpowiednik charakterystycznego dla Mateusza wyrażenia, zachowujący liczbę mnogą οὐρανῶν w naturalnej polszczyźnie.
- source_word: βιάζεται
  choice: doznaje przemocy
  rationale: Oddaje możliwy sens bierny czasownika bez niezręcznego polskiego „cierpi przemoc”. Ponieważ forma może być również rozumiana medialnie lub nieprzechodnio, alternatywę zachowano w przypisie.
- source_word: βιασταὶ
  choice: ludzie gwałtowni
  rationale: Oddaje osoby posługujące się gwałtem lub siłą. Rzeczownik jest rodzaju męskiego w grece, lecz w tym kontekście polskie „ludzie” naturalnie określa zbiorowo osoby działające przemocą, bez nieuzasadnionego zawężenia do płci biologicznej.
- source_word: ἁρπάζουσιν αὐτήν
  choice: porywają je
  rationale: ἁρπάζω oznacza gwałtowne pochwycenie, porwanie lub zagarnięcie. „Porywają” zachowuje dynamikę i przemoc tego działania, a zaimek „je” jednoznacznie odnosi się do królestwa.
theological_decisions:
- issue: Znaczenie βιάζεται w odniesieniu do królestwa
  choice: 'W tekście głównym sens bierny: „królestwo niebios doznaje przemocy”.'
  alternative: 'Sens medialny lub nieprzechodni: „królestwo niebios z mocą toruje sobie drogę, a ludzie zdecydowani zdobywają je”.'
  rationale: Grecka forma jest rzeczywiście wieloznaczna. Odczytanie bierne dobrze współgra z następującymi słowami o gwałtownych ludziach, jednak odczytanie medialne lub nieprzechodnie ma istotne podstawy językowe. Tekst główny przyjmuje jedno możliwe rozumienie, a przypis zachowuje alternatywę i napięcie interpretacyjne.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rejestrze. Zachowano idiom „od dni Jana Chrzciciela” oraz tradycyjne Mateuszowe określenie „królestwo niebios”. Przypis sygnalizuje autentyczną wieloznaczność kluczowego czasownika bez rozstrzygania jej doktrynalnie.
