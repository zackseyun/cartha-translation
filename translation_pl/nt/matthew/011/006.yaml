  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: pl
  text: A szczęśliwy jest ten, kto nie potknie się przeze Mnie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie zgorszy się Mną” lub „nie uzna Mnie za powód do zgorszenia”.'
    reason: Alternatywne sposoby oddania szerokiego znaczenia σκανδαλισθῇ ἐν ἐμοί.
lexical_decisions:
- source_word: καί
  choice: A
  rationale: Zachowuje powiązanie wypowiedzi z poprzednim kontekstem i brzmi naturalnie po polsku.
- source_word: μακάριος
  choice: szczęśliwy
  rationale: W formule błogosławieństwa oznacza człowieka znajdującego się w godnym uznania, pomyślnym położeniu przed Bogiem; „szczęśliwy” jest naturalnym i utrwalonym polskim odpowiednikiem, nie ograniczającym sensu wyłącznie do chwilowego uczucia.
- source_word: ὃς ἐὰν μὴ
  choice: ten, kto… nie
  rationale: Naturalnie oddaje nieokreśloną, ogólną osobę oraz warunkowy odcień greckiej konstrukcji.
- source_word: σκανδαλισθῇ
  choice: się… nie potknie
  rationale: Zachowuje metaforę potknięcia zawartą w czasowniku i może obejmować zarówno zgorszenie, jak i załamanie wiary lub odwrócenie się.
- source_word: ἐν ἐμοί
  choice: przeze Mnie
  rationale: W tym połączeniu wskazuje Jezusa jako powód lub okazję potknięcia; polskie sformułowanie jest zwięzłe i idiomatyczne.
theological_decisions:
- issue: Zakres znaczeniowy σκανδαλισθῇ w odniesieniu do Jezusa
  choice: 'Zachowano metaforę potknięcia: „się przeze Mnie nie potknie”.'
  alternative: „nie zgorszy się z mojego powodu” / „nie zwątpi przeze Mnie”
  rationale: 'Metafora pozostawia otwartą pełną siłę wypowiedzi: chodzi nie tylko o emocjonalną obrazę, lecz potencjalnie także o zwątpienie, odrzucenie lub upadek z powodu tego, kim Jezus jest i jak działa.'
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zaimek odnoszący się do Jezusa zapisano wielką literą zgodnie z powszechną polską konwencją religijną. Główny tekst zachowuje obraz potknięcia, a przypis objaśnia jego możliwy sens kontekstowy.
