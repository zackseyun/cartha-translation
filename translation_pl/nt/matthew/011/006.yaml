  terminology: Metaforyczne „potknąć się” trafnie zachowuje szeroki zakres σκανδαλίζω. W przypisie właściwą alternatywą jest „nie zgorszy się Mną” lub „nie uzna Mnie za powód do zgorszenia”; nie należy podawać „nie zwątpi” jako prostego wariantu przekładowego.
