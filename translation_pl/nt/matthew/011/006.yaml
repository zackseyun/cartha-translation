  source_fidelity: 'Główny tekst dobrze zachowuje strukturę zdania, ogólną osobę („ten, kto”), metaforę potknięcia w σκανδαλισθῇ oraz Jezusa jako okoliczność/powód potknięcia. „Szczęśliwy” jest dopuszczalnym współczesnym odpowiednikiem μακάριος w formule makaryzmu. Przypis wymaga jednak korekty: „nie zwątpi przeze Mnie” jest możliwym skutkiem interpretacyjnym w kontekście, ale nie stanowi równorzędnego leksykalnego oddania greckiego czasownika.'
