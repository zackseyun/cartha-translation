id: MAT.11.7
reference: Matthew 11:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: pl
  text: 'Gdy oni odchodzili, Jezus zaczął mówić do tłumów o Janie: „Co wyszliście zobaczyć na pustkowiu? Trzcinę chwiejącą się na wietrze?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Gdy oni odchodzili
  rationale: Konstrukcja genetivus absolutus wyraża czynność równoczesną. Zaimek „oni” naturalnie odsyła do uczniów Jana z bezpośredniego kontekstu, bez dopowiadania rzeczownika nieobecnego w tekście greckim.
- source_word: ἤρξατο ... λέγειν
  choice: zaczął mówić
  rationale: Oddaje konstrukcję ἄρχομαι z bezokolicznikiem oraz naturalnie wprowadza dłuższą wypowiedź skierowaną do tłumów.
- source_word: τοῖς ὄχλοις
  choice: do tłumów
  rationale: Zachowuje liczbę mnogą greckiego rzeczownika i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: περὶ Ἰωάννου
  choice: o Janie
  rationale: Przyimek περί z dopełniaczem wskazuje temat wypowiedzi; „o Janie” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Co wyszliście zobaczyć na pustkowiu?
  rationale: Τί zachowano jako pytanie „co?”, nie „dlaczego?”. Czasownik θεάομαι oznacza uważne oglądanie lub zobaczenie, a „zobaczyć” jest tu zwięzłe i naturalne. „Pustkowie” oddaje ἔρημος jako niezamieszkany teren, bez sugerowania wyłącznie piaszczystej pustyni.
- source_word: κάλαμον ὑπὸ ἀνέμου σαλευόμενον
  choice: Trzcinę chwiejącą się na wietrze?
  rationale: „Trzcina” jest zwykłym odpowiednikiem κάλαμος. Imiesłów „chwiejącą się” zachowuje trwający obraz poruszania pod wpływem wiatru i naturalnie wskazuje na niestałość.
theological_decisions:
- issue: Odniesienie zaimka Τούτων
  choice: „oni”, z odniesieniem wynikającym z kontekstu do uczniów Jana
  alternative: „ci ludzie” albo jawnie „uczniowie Jana”
  rationale: Greka używa zaimka bez rzeczownika. Polskie „oni” zachowuje tę zwięzłość i pozwala bezpośredniemu kontekstowi wskazać referent, nie wprowadzając objaśnienia do tekstu głównego.
- issue: Retoryczna wymowa obrazu trzciny
  choice: Pozostawiono pytanie i obraz bez objaśnienia w tekście głównym
  alternative: Dodać wyjaśnienie, że chodzi o człowieka chwiejnego lub niestałego
  rationale: Pytanie najpewniej oczekuje odpowiedzi przeczącej i kontrastuje chwiejność trzciny ze stałością Jana, lecz metafora powinna zachować własną siłę i nie być interpretacyjnie rozwijana w przekładzie.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Składnia pozostaje bliska grece, ale jest naturalna po polsku. Nie dodano przypisów, ponieważ wariant „widzieć/oglądać” nie zmienia istotnie sensu, a retoryczny obraz trzciny jest czytelny w tekście.
