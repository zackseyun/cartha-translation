  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: pl
  text: 'To jest ten, o którym napisano: „Oto, ja posyłam mojego posłańca przed twoim obliczem[a], który przygotuje twoją drogę przed tobą”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idiomaticznie: „przed tobą”. Grecki tekst zachowuje bardziej konkretne wyrażenie „przed twoim obliczem”, pochodzące z cytatu biblijnego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ
  choice: To o nim
  rationale: Zwięzła i naturalna polska formuła identyfikacyjna zachowująca wskazujący charakter οὗτός oraz znaczenie περί z dopełniaczem.
- source_word: γέγραπται
  choice: napisano
  rationale: Utrwalony polski odpowiednik formuły wprowadzającej cytat z Pisma; oddaje stronę bierną i aktualną ważność zapisu.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Zachowuje podniosły, prorocki ton cytatu, a zarazem jest zrozumiałe we współczesnej polszczyźnie.
- source_word: ἀποστέλλω
  choice: posyłam
  rationale: Czas teraźniejszy zachowuje żywość greckiego cytatu i jego uroczysty charakter.
- source_word: ἄγγελόν
  choice: posłańca
  rationale: W kontekście chodzi o ludzkiego zwiastuna i poprzednika, Jana; „posłaniec” oddaje właściwy zakres znaczeniowy bez sugerowania istoty niebiańskiej.
- source_word: πρὸ προσώπου σου
  choice: przed twoim obliczem
  rationale: Zachowuje konkretny obraz greckiego wyrażenia oraz formalną fakturę cytatu biblijnego.
- source_word: κατασκευάσει
  choice: przygotuje
  rationale: Naturalnie oddaje czynność uczynienia drogi gotową.
- source_word: τὴν ὁδόν σου
  choice: twoją drogę
  rationale: „Droga” zachowuje zarówno sens dosłowny, jak i metaforyczny.
- source_word: ἔμπροσθέν σου
  choice: przed tobą
  rationale: Naturalny polski odpowiednik zachowujący drugie, odrębne określenie miejsca w cytacie.
theological_decisions:
- issue: 'Powtórzenie dwóch podobnych określeń: πρὸ προσώπου σου oraz ἔμπροσθέν σου'
  choice: Zachowano oba jako „przed twoim obliczem” i „przed tobą”
  alternative: Wygładzenie cytatu przez pominięcie jednego określenia lub zastąpienie obu jednym wyrażeniem „przed tobą”
  rationale: Tekst grecki celowo zawiera oba wyrażenia. Ich zachowanie oddaje formalny kształt i emfatyczną równoległość cytatu bez rozstrzygania, że powtórzenie jest stylistycznie zbędne.
translation_notes:
  register: Współczesna, godna polszczyzna z lekko podniosłym rejestrem właściwym cytatowi prorockiemu. Zachowano obraz „oblicza” i oba równoległe określenia, choć w zwykłej mowie brzmiałyby redundantnie.
