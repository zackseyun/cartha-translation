id: MAT.11.29
reference: Matthew 11:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: pl
  text: Weźcie na siebie moje jarzmo i uczcie się ode mnie, bo jestem łagodny i pokorny sercem, a znajdziecie odpoczynek dla swoich dusz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Weźcie na siebie moje jarzmo
  rationale: Polski zwrot naturalnie oddaje przyjęcie jarzma, zachowując konkretną i centralną metaforę podporządkowania się nauce lub władzy.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: uczcie się ode mnie
  rationale: Bezpośredni i współczesny odpowiednik imperatywu oraz ἀπό; może obejmować zarówno przyjmowanie nauki, jak i naśladowanie nauczyciela.
- source_word: ὅτι
  choice: bo
  rationale: W tym kontekście spójnik ma naturalną wartość wyjaśniającą lub przyczynową; „bo” jasno łączy wezwanie z charakterem Jezusa.
- source_word: πραΰς
  choice: łagodny
  rationale: Oddaje łagodność i brak surowości bez współczesnych ubocznych skojarzeń słowa „potulny” ze słabością lub uległością.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: pokorny sercem
  rationale: Zwięzły, naturalny i godny polski zwrot zachowujący odniesienie do wewnętrznej postawy.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: znajdziecie odpoczynek
  rationale: Zachowuje prostą formę obietnicy oraz biblijnie nośne znaczenie ἀνάπαυσις bez zawężania go do samej ulgi.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: dla swoich dusz
  rationale: Naturalnie oddaje dativus korzyści i zachowuje tradycyjny, zrozumiały termin „dusze”, odnoszący się tu do wewnętrznego życia lub całej osoby.
theological_decisions:
- issue: 'Opis charakteru Jezusa: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ'
  choice: jestem łagodny i pokorny sercem
  alternative: jestem cichy i uniżony sercem
  rationale: Wybrane sformułowanie zachowuje osobiste samookreślenie Jezusa i jego teologiczną wagę, a zarazem brzmi naturalnie we współczesnej polszczyźnie. Nie dopowiada, czy przymiotniki opisują wyłącznie sposób nauczania, czy szerzej charakter Jezusa.
- issue: Zakres znaczeniowy ψυχή
  choice: dusze
  alternative: życie / was samych
  rationale: „Dusze” zachowują obrazowanie tekstu i jego wymiar wewnętrzny, nie rozstrzygając antropologicznie ścisłego podziału człowieka na części.
translation_notes:
  register: Współczesna polszczyzna standardowa o godnym, biblijnym rejestrze. Zachowano metaforę jarzma oraz zwięzły rytm wezwania i obietnicy. Nie dodano przypisu, ponieważ polskie odpowiedniki „łagodny” i „pokorny sercem” jasno oddają sens źródła, a alternatywy nie reprezentują odrębnego wariantu tekstowego.
