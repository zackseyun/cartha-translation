  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: pl
  text: Bo moje jarzmo jest łagodne, a moje brzemię lekkie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: bo
  rationale: Oddaje uzasadniający związek tego zdania z poprzednią wypowiedzią.
- source_word: ζυγός
  choice: jarzmo
  rationale: Tradycyjny, naturalny w polszczyźnie odpowiednik metafory zobowiązania i poddania się nauce lub władzy.
- source_word: χρηστός
  choice: łagodne
  rationale: Zachowuje sens czegoś dobrego, życzliwego i nieuciążliwego, nie sprowadzając przymiotnika wyłącznie do znaczenia „łatwe”.
- source_word: φορτίον
  choice: brzemię
  rationale: Dostojny i zrozumiały odpowiednik ciężaru niesionego w sensie dosłownym lub metaforycznym; dobrze współbrzmi z obrazem jarzma.
- source_word: ἐλαφρόν
  choice: lekkie
  rationale: Bezpośrednio oddaje przeciwieństwo ciężaru i naturalnie opisuje brzemię.
theological_decisions:
- issue: Znaczenie χρηστός w opisie jarzma Jezusa
  choice: łagodne
  alternative: łatwe / dobre / miłe
  rationale: „Łagodne” zachowuje życzliwy, dobroczynny charakter jarzma bez sugerowania, że naśladowanie Jezusa nie wymaga wysiłku. Nie rozstrzyga też ponad tekst, na czym dokładnie polega ta właściwość jarzma.
translation_notes:
  register: Współczesny, godny i zwięzły rejestr biblijny. Zachowano paralelizm „jarzmo—brzemię” oraz naturalny szyk polskiego zdania.
