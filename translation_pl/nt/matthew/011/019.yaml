source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: pl
  text: 'Syn Człowieczy przyszedł, jedząc i pijąc, a oni mówią: „Oto żarłok i pijak, przyjaciel celników i grzeszników!” A mądrość została uznana za słuszną na podstawie jej dzieł[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „A mądrość została potwierdzona przez swoje czyny”.'
    reason: lexical_alternative
  - marker: b
    text: 'Niektóre rękopisy zamiast „dzieł” mają „dzieci”: „mądrość została uznana za słuszną na podstawie jej dzieci”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tego tytułu, zachowujący jego semickie tło i znaczenie teologiczne bez interpretacyjnej parafrazy.
- source_word: ἐσθίων καὶ πίνων
  choice: jedząc i pijąc
  rationale: Proste oddanie imiesłowów, zachowujące kontrast z ascetycznym sposobem życia Jana bez nadinterpretacji w rodzaju „ucztując”.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Naturalny, podniosły, lecz nadal współczesny odpowiednik wykrzyknikowej partykuły wskazującej, odpowiedni dla publicznego oskarżenia.
- source_word: φάγος
  choice: żarłok
  rationale: Zwięzłe, idiomatyczne i wyraźnie obraźliwe określenie, odpowiadające pejoratywnej sile greckiego rzeczownika.
- source_word: οἰνοπότης
  choice: pijak
  rationale: Oddaje zarzut nadmiernego picia, a nie neutralną informację o spożywaniu wina.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: przyjaciel celników i grzeszników
  rationale: Zachowuje konstrukcję i społeczno-religijną wymowę obu określeń bez ich objaśniającego rozszerzania.
- source_word: ἐδικαιώθη
  choice: została uznana za słuszną
  rationale: W tym kontekście czasownik oznacza wykazanie lub potwierdzenie słuszności. Polski zwrot przekazuje ten sens naturalniej niż dosłowne „została usprawiedliwiona”, nie usuwając strony biernej.
- source_word: ἡ σοφία
  choice: mądrość
  rationale: Zachowuje uosobienie mądrości bez wskazywania jej konkretnego teologicznego desygnatu.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: na podstawie swoich dzieł
  rationale: Oddaje podstawę rozpoznania słuszności mądrości oraz odczyt SBLGNT ἔργων, zachowując odniesienie dzieł do uosobionej mądrości.
theological_decisions:
- issue: Znaczenie „mądrości” w końcowym zdaniu
  choice: Pozostawiono uosobione określenie „mądrość” bez wyraźnego utożsamienia jej z Jezusem, Bożą mądrością lub Bożym planem.
  alternative: Możliwe interpretacje utożsamiają mądrość z Jezusem albo z Bożym zbawczym zamysłem.
  rationale: Tekst formułuje uosobione powiedzenie, lecz nie rozstrzyga wprost jego desygnatu; przekład powinien zachować tę teologiczną otwartość.
- issue: Brzmienie końcowej frazy w tekście głównym
  choice: Przyjęto odczyt „dzieł” zgodnie z podanym tekstem SBLGNT.
  alternative: Część rękopisów ma „dzieci”, podobnie jak tekst paralelny w Łk 7,35.
  rationale: Tekst główny powinien podążać za wskazanym wydaniem źródłowym, a istotny wariant rękopiśmienny należy zachować w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie biblijnym rejestrze. Utrwalony tytuł „Syn Człowieczy” i termin „celnicy” zachowano ze względu na ich rozpoznawalność, natomiast obelgi „żarłok” i „pijak” celowo pozostają mocne i potoczne, zgodnie z tonem oskarżenia.
