  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: pl
  text: Niewidomi odzyskują wzrok, kulawi chodzą, trędowaci zostają oczyszczeni, głusi słyszą, umarli zostają wskrzeszeni, a ubogim głosi się dobrą nowinę[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „ubogim głosi się Ewangelię”. Grecka forma ma sens bierny: ubodzy są odbiorcami dobrej nowiny.'
    reason: lexical_alternative
  - marker: b
    text: Wyliczenie nawiązuje do Iz 35,5–6 i 61,1, ukazując znaki związane z działalnością Mesjasza.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: niewidomi
  rationale: Użyty rzeczownikowo przymiotnik oznacza osoby niewidome jako grupę; zwięzłe polskie określenie zachowuje katalogowy styl zdania.
- source_word: ἀναβλέπουσιν
  choice: odzyskują wzrok
  rationale: W kontekście uzdrowień czasownik oznacza uzyskanie lub odzyskanie zdolności widzenia, a nie tylko spojrzenie w górę.
- source_word: χωλοὶ
  choice: kulawi
  rationale: Zwięzłe, tradycyjne określenie osób mających trudności z chodzeniem, odpowiadające rzeczownikowemu użyciu greckiego przymiotnika.
- source_word: περιπατοῦσιν
  choice: chodzą
  rationale: Prosty czas teraźniejszy oddaje formę grecką i rytm wyliczenia.
- source_word: λεπροὶ
  choice: trędowaci
  rationale: Tradycyjny i zwięzły odpowiednik w ewangelicznych opisach uzdrowień; nie przesądza w tekście głównym o dokładnej współczesnej diagnozie.
- source_word: καθαρίζονται
  choice: zostają oczyszczeni
  rationale: Zachowuje stronę bierną oraz zarówno cielesny, jak i rytualny wymiar czasownika, czego samo „zostają uzdrowieni” nie oddawałoby w pełni.
- source_word: κωφοὶ
  choice: głusi
  rationale: Choć słowo może zależnie od kontekstu oznaczać głuchych lub niemych, zestawienie z „słyszą” jednoznacznie wskazuje tutaj na głuchotę.
- source_word: ἀκούουσιν
  choice: słyszą
  rationale: Naturalny polski czas teraźniejszy wiernie oddaje przywróconą zdolność i zwięzłość greckiego tekstu.
- source_word: νεκροὶ
  choice: umarli
  rationale: Rzeczownikowe użycie przymiotnika odnosi się do osób zmarłych; „umarli” jest naturalne i zachowuje podniosły ton.
- source_word: ἐγείρονται
  choice: są wskrzeszani
  rationale: Strona bierna zachowuje formę grecką i przedstawia umarłych jako odbiorców działania przywracającego życie.
- source_word: πτωχοὶ
  choice: ubogim
  rationale: Celownik wynika z polskiej konstrukcji „głosi się komu”; „ubodzy” zachowuje sens społeczno-ekonomiczny i odniesienie do Izajasza bez zawężającej interpretacji.
- source_word: εὐαγγελίζονται
  choice: głosi się dobrą nowinę
  rationale: 'Polska konstrukcja bezosobowa zachowuje bierny sens: ubodzy są odbiorcami ogłaszanej dobrej wiadomości. Unika też nadawania czasownikowi wyłącznie późniejszego, technicznego znaczenia kościelnego.'
theological_decisions:
- issue: Oddanie εὐαγγελίζονται i jego związku z terminologią ewangelii
  choice: ubogim głosi się dobrą nowinę
  alternative: ubogim głosi się Ewangelię; ubodzy są ewangelizowani
  rationale: Wybrane brzmienie zachowuje związek z dobrą wiadomością oraz bierny sens formy greckiej, a zarazem nie zawęża jej do późniejszego technicznego języka kościelnego.
- issue: Lista cudów jako świadectwo mesjańskiego spełnienia
  choice: Pozostawienie prostych stwierdzeń o dokonujących się dziełach
  alternative: Dodanie w tekście głównym wyjaśnienia, że wypełniają się proroctwa Izajasza
  rationale: Tekst wyraźnie przywołuje język Izajasza, lecz nie zawiera bezpośredniej formuły spełnienia. Przekład zachowuje to napięcie, a aluzję objaśnia przypis.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr z zachowaniem rytmicznego wyliczenia. Powtórzone czasowniki w czasie teraźniejszym odtwarzają lapidarny charakter greki, a konstrukcje bierne przy „oczyszczeni” i „wskrzeszani” zachowują ukierunkowanie działania obecne w tekście źródłowym.
