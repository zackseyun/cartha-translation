  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: pl
  text: A jeśli chcecie to przyjąć[a], on jest Eliaszem, który ma przyjść[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jeśli jesteście gotowi to przyjąć”.'
    reason: lexical_alternative
  - marker: b
    text: Chodzi o utożsamienie Jana Chrzciciela z Eliaszem, który ma przyjść; por. Ml 3,23–24 oraz Mt 17,10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Naturalny polski spójnik zachowuje powiązanie zdania z poprzednim wywodem, nie narzucając bardziej szczegółowej relacji logicznej.
- source_word: εἰ θέλετε δέξασθαι
  choice: jeśli chcecie to przyjąć
  rationale: Połączenie θέλετε z bezokolicznikiem wyraża gotowość lub wolę przyjęcia wypowiedzi Jezusa. Zaimek „to” uzupełnia domyślny przedmiot czasownika w sposób naturalny po polsku.
- source_word: αὐτός
  choice: 'on'
  rationale: Zaimek odnosi się do Jana Chrzciciela. Polskie „on” jest naturalne i nie przesądza, czy αὐτός ma tu dodatkowy odcień emfatyczny.
- source_word: ἐστιν Ἠλίας
  choice: jest Eliaszem
  rationale: Zachowano bezpośrednią formę utożsamienia obecną w grece; „Eliasz” jest utrwaloną polską formą imienia.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: który miał przyjść
  rationale: Sformułowanie oddaje oczekiwaną, zapowiedzianą przyszłość z perspektywy wypowiedzi i brzmi naturalnie po polsku, zachowując odniesienie do prorockiej zapowiedzi.
theological_decisions:
- issue: Utożsamienie Jana Chrzciciela z Eliaszem
  choice: on jest Eliaszem, który miał przyjść
  alternative: on pełni rolę Eliasza / on jest podobny do Eliasza
  rationale: Greka formułuje utożsamienie wprost, a zarazem poprzedza je warunkiem dotyczącym przyjęcia tej wypowiedzi. Przekład zachowuje oba elementy i nie rozstrzyga, w jakim dokładnie sensie Jan jest Eliaszem.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Bezpośrednie „jest Eliaszem” zachowuje siłę oraz napięcie teologiczne tekstu, natomiast „który miał przyjść” naturalnie oddaje perspektywę wcześniejszej zapowiedzi.
