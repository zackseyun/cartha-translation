  source_fidelity: Greckie ὁ μέλλων ἔρχεσθαι wyraża oczekiwanego/przeznaczonego „tego, który ma przyjść”. Forma „który miał przyjść” przesuwa perspektywę na przeszłość i osłabia aktualne w wypowiedzi Jezusa oczekiwanie. Pozostałe elementy, w tym warunkowe „jeśli chcecie to przyjąć” oraz bezpośrednie „jest Eliaszem”, są wierne tekstowi.
  naturalness: „A jeśli chcecie to przyjąć” jest naturalne we współczesnej polszczyźnie, a „który ma przyjść” brzmi równie naturalnie i dokładniej zachowuje aspekt oczekiwania niż „który miał przyjść”.
  terminology: „Eliasz” jest standardową polską formą imienia. Należy zachować bezpośrednie utożsamienie, nie zastępując go określeniem „podobny do Eliasza”.
