id: MAT.11.1
reference: Matthew 11:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: pl
  text: Gdy Jezus skończył wydawać polecenia swoim dwunastu uczniom[a], odszedł stamtąd, aby nauczać i głosić w ich miastach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pouczać swoich dwunastu uczniów”.'
    reason: lexical_alternative
  - marker: b
    text: 'Greckie wyrażenie „ich miasta” jest niejednoznaczne: może oznaczać miasta uczniów albo szerzej — miasta i miejscowości tamtejszej ludności.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Gdy
  rationale: Semityzująca formuła narracyjna wprowadza następną czynność i określa jej czas. Polskie „Gdy” zachowuje tę funkcję bez nienaturalnego „I stało się, gdy”.
- source_word: ἐτέλεσεν
  choice: skończył
  rationale: Czasownik wskazuje, że czynność została zakończona przed odejściem Jezusa; polska konstrukcja „skończył wydawać” naturalnie oddaje tę kolejność.
- source_word: διατάσσων
  choice: wydawać polecenia
  rationale: Imiesłów oznacza autorytatywne przekazywanie zaleceń lub nakazów. „Wydawać polecenia” wiernie zachowuje ten odcień, a alternatywę „pouczać” podano w przypisie.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: swoim dwunastu uczniom
  rationale: To naturalny polski odpowiednik, który zachowuje wyraźną liczbę dwunastu oraz relację uczniów do Jezusa.
- source_word: μετέβη ἐκεῖθεν
  choice: odszedł stamtąd
  rationale: Wyrażenie opisuje przemieszczenie się z dotychczasowego miejsca; przekład jest zwięzły i naturalny narracyjnie.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: aby nauczać i głosić
  rationale: Konstrukcja bezokolicznikowa wyraża cel. Zachowano rozróżnienie między nauczaniem a publicznym głoszeniem.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: w ich miastach
  rationale: Dosłowne „ich” nie rozstrzyga niejasnego odniesienia zaimka, a „miasta” jest podstawowym odpowiednikiem πόλεις; kontekst może obejmować także miejscowości niewielkich rozmiarów.
theological_decisions:
- issue: Odniesienie zaimka αὐτῶν w wyrażeniu ἐν ταῖς πόλεσιν αὐτῶν
  choice: Zachować niejednoznaczne „w ich miastach”.
  alternative: „w miastach uczniów” albo interpretacyjne „w miastach tamtejszej ludności”.
  rationale: Tekst grecki nie wskazuje jednoznacznie, do kogo odnosi się zaimek. Przekład nie powinien rozstrzygać tego, czego nie rozstrzyga tekst źródłowy.
translation_notes:
  register: Współczesny, klarowny i godny styl narracyjny. Zachowano autorytatywny odcień poleceń Jezusa oraz nie rozstrzygnięto odniesienia zaimka „ich”.
