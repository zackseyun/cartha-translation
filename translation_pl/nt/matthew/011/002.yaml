  source_fidelity: 'Znaczenie jest zasadniczo wierne: Jan w więzieniu słyszy o dziełach Mesjasza i podejmuje działanie za pośrednictwem swoich uczniów. Jednak „posłał przez swoich uczniów” pozostawia w polszczyźnie czasownik bez koniecznego, choć w grece eliptycznie domyślnego, dopełnienia; brzmi to jak urwana konstrukcja bardziej niż zamierzona zależność od w. 3.'
  naturalness: „Kiedy Jan usłyszał w więzieniu” jest zrozumiałe, ale „Jan, będąc w więzieniu, usłyszał” naturalniej wiąże okolicznik miejsca z Janem. Dodanie „wiadomość” czyni końcową frazę idiomatyczną i zachowuje sens greckiego πέμψας z dalszym „mówiąc” w następnym wersecie.
  terminology: „Mesjasz” trafnie oddaje tytuł χριστός; przypis z tradycyjnym „Chrystus” jest właściwy. „Dzieła” adekwatnie oddaje τὰ ἔργα.
