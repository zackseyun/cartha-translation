    rationale: Polskie „posłać przez kogoś” zwykle wymaga wskazania tego, co zostało posłane. Grecki imiesłów dopuszcza elipsę, której dopełnienie rozwija kolejny werset, lecz w polszczyźnie bezpiecznie i naturalnie można wyrazić je jako „wiadomość”, nie dodając nowej treści.
