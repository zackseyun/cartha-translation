  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: pl
  text: Gdy Jan, będąc w więzieniu, usłyszał o dziełach Mesjasza[a], posłał przez swoich uczniów wiadomość
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Chrystusa”.'
    reason: Alternatywny, tradycyjny sposób oddania greckiego Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: pominięte jako osobny wyraz
  rationale: Partykuła sygnalizuje przejście w narracji; w naturalnej polszczyźnie nie wymaga tu odrębnego odpowiednika, a rozpoczynanie od „A” byłoby opcjonalne.
- source_word: ἀκούσας
  choice: Kiedy Jan usłyszał
  rationale: Imiesłów aorystu oddano naturalnym zdaniem czasowym, zachowując uprzedniość usłyszenia względem posłania.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: w więzieniu
  rationale: Zwięzły, idiomatyczny odpowiednik określający miejsce przebywania Jana.
- source_word: τὰ ἔργα
  choice: o dziełach
  rationale: „Dzieła” zachowują szeroki zakres ἔργα i więź leksykalną z biblijnym językiem czynów, obejmując działalność i potężne czyny.
- source_word: τοῦ χριστοῦ
  choice: Mesjasza
  rationale: Χριστός pełni tu funkcję tytułu; „Mesjasz” przekazuje znaczenie „Pomazaniec” i kontekst żydowski.
- source_word: πέμψας
  choice: posłał
  rationale: Imiesłów powiązano z główną czynnością w naturalnej polskiej składni. Dopełnienie wypowiedzi pojawia się w następnym wersecie, dlatego nie dodano „wiadomości” nieobecnej w tekście.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: przez swoich uczniów
  rationale: διά z dopełniaczem wskazuje pośredników; zaimek zwrotny naturalnie odnosi uczniów do Jana.
theological_decisions:
- issue: Oddanie Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym miejscu wyraz działa jako tytuł określający oczekiwanego Pomazańca, więc przekład „Mesjasz” uwidacznia jego znaczenie. Tradycyjny odpowiednik „Chrystus” zachowano w przypisie.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano niepełność zdania wynikającą z podziału na wersety i nie dopowiedziano treści posłania, która następuje w wersecie 3.
