id: MAT.11.27
reference: Matthew 11:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: pl
  text: Wszystko zostało mi przekazane przez mojego Ojca. Nikt nie zna Syna, tylko Ojciec, i nikt nie zna Ojca, tylko Syn oraz ten, komu Syn zechce Go objawić.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „i komu Syn zechce objawić”; domyślnym przedmiotem objawienia jest Ojciec.'
    reason: implicit_object
lexical_decisions:
- source_word: Πάντα
  choice: Wszystko
  rationale: Rodzaj nijaki liczby mnogiej ma szeroki, całościowy zakres; polskie „wszystko” oddaje go naturalniej niż dosłowne „wszystkie rzeczy”.
- source_word: παρεδόθη
  choice: zostało przekazane
  rationale: Aoryst strony biernej παραδίδωμι wskazuje na dokonane przekazanie; ta forma jest wierna i naturalna, nie dopowiadając, czy chodzi ściśle o powierzenie w zarząd.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: przez mojego Ojca
  rationale: Wyrażenie wskazuje sprawcę czynności i relacyjny tytuł Boga; wielka litera sygnalizuje użycie tytularne.
- source_word: ἐπιγινώσκει
  choice: zna
  rationale: W tym kontekście czasownik oznacza rzeczywiste, osobowe poznanie. Sam prefiks nie wymaga dodania „w pełni”; proste „zna” zachowuje sens i nie wzmacnia tekstu ponad grekę.
- source_word: εἰ μὴ
  choice: tylko
  rationale: Po przeczeniu wyrażenie wprowadza jedyny wyjątek. „Tylko” daje po polsku naturalną i wyraźną konstrukcję wyłączającą.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ten, komu Syn zechce Go objawić
  rationale: „Zechce” zachowuje wolitywną treść βούληται, a „objawić” bezpośrednio oddaje ἀποκαλύψαι. „Go” odnosi się do Ojca.
theological_decisions:
- issue: Zakres wzajemnego poznania Ojca i Syna w ἐπιγινώσκει
  choice: „zna” w obu równoległych członach
  alternative: „zna w pełni” albo „naprawdę zna”
  rationale: Grecki czasownik może w pewnych kontekstach sugerować pełne lub dogłębne poznanie, lecz tutaj nie wymaga jawnego intensyfikatora. Wyłączność poznania wynika już z konstrukcji „nikt… tylko”, więc przekład nie rozstrzyga ponad tekst.
- issue: Wolitywny charakter βούληται
  choice: „zechce”
  alternative: „postanowi”, „będzie chciał”
  rationale: „Zechce” jasno przypisuje Synowi inicjatywę objawienia, nie sprowadzając jej do samego pragnienia ani nie wprowadzając technicznego języka doktrynalnego.
- issue: Domyślny przedmiot ἀποκαλύψαι
  choice: dodane „Go”, odnoszące się do Ojca
  alternative: „komu Syn zechce objawić” bez dopełnienia
  rationale: Greka pozostawia przedmiot domyślny, ale bezpośrednim poprzednikiem jest Ojciec. Polskie zdanie wymaga jego naturalnego dopowiedzenia; przypis odnotowuje tę elipsę.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelizm wypowiedzi o Ojcu i Synu oraz wyłączność wyrażoną w grece, bez dodawania intensyfikatora „w pełni”.
