  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: pl
  text: Przyjdźcie do mnie wszyscy, którzy się trudzicie i jesteście obciążeni[a], a ja dam wam odpoczynek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „zostaliście obciążeni”. Grecki imiesłów czasu perfectum w stronie biernej wskazuje na ludzi, których obciążono i którzy nadal pozostają w tym stanie.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „pokrzepię was”. Czasownik może oznaczać sprawienie, że ktoś odpocznie, lub przyniesienie mu pokrzepienia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Przyjdźcie
  rationale: Naturalny polski tryb rozkazujący wyrażający bezpośrednie zaproszenie skierowane do wielu osób.
- source_word: πρός με
  choice: do mnie
  rationale: 'Przy czasowniku ruchu przyimek πρός z biernikiem wskazuje kierunek ku osobie; po polsku naturalnie: „do mnie”.'
- source_word: πάντες
  choice: wszyscy
  rationale: Zachowuje pełny, obejmujący wszystkich zakres zaproszenia.
- source_word: οἱ κοπιῶντες
  choice: którzy się trudzicie
  rationale: Imiesłów czasu teraźniejszego wskazuje na podejmowanie trudu lub mozolną pracę; przekład zachowuje sens czynny, nie ograniczając go jedynie do odczuwania zmęczenia.
- source_word: πεφορτισμένοι
  choice: jesteście obciążeni
  rationale: Imiesłów czasu perfectum w stronie biernej opisuje ludzi, których obciążono i którzy nadal pozostają pod ciężarem.
- source_word: κἀγὼ
  choice: a ja
  rationale: Oddaje jawnie wyrażony podmiot oraz łagodne przeciwstawienie lub nacisk obecne w greckim κἀγώ.
- source_word: ἀναπαύσω
  choice: dam wam odpoczynek
  rationale: Czasownik może oznaczać sprawienie, że ktoś odpocznie, albo pokrzepienie go. Wybrane sformułowanie jest naturalne i zachowuje szeroki charakter obietnicy.
- source_word: ὑμᾶς
  choice: wam
  rationale: Celownik w polskiej konstrukcji „dać komuś odpoczynek” naturalnie oddaje osoby będące odbiorcami działania; liczba mnoga wynika także z „wszyscy”.
theological_decisions:
- issue: Charakter odpoczynku obiecanego w ἀναπαύσω
  choice: dam wam odpoczynek
  alternative: pokrzepię was
  rationale: Sam werset nie rozstrzyga, czy chodzi przede wszystkim o odpoczynek duchowy, eschatologiczny, emocjonalny czy fizyczny. Szerokie sformułowanie zachowuje tę otwartość i bogactwo znaczeniowe.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano liczbę mnogą oraz osobisty charakter zaproszenia. Sformułowanie „którzy się trudzicie” utrzymuje czynny sens greckiego imiesłowu, a „dam wam odpoczynek” nie zawęża rodzaju obiecanej ulgi.
