  terminology: „Wysławiam Cię”, „Ojcze, Panie nieba i ziemi”, „ukryłeś” oraz „objawiłeś” są trafne. Wielkie litery w zaimkach odnoszących się do Boga są dopuszczalną, utrwaloną konwencją polskiego rejestru religijnego.
