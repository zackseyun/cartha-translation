  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: pl
  text: 'W tym czasie Jezus odpowiedział: „Wysławiam Cię[a], Ojcze, Panie nieba i ziemi, że ukryłeś te rzeczy przed mądrymi i rozumnymi, a objawiłeś je małym dzieciom[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Dziękuję Ci”. Grecki czasownik może wyrażać zarówno wysławianie, jak i dziękczynienie lub otwarte uznanie.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „niemowlętom”. Greckie słowo może oznaczać niemowlęta lub małe dzieci; tutaj może być użyte przenośnie, a jego dokładne odniesienie pozostaje otwarte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: W tym czasie
  rationale: Naturalny polski odpowiednik wyrażenia czasowego, zachowujący jego narracyjną ogólność.
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν
  choice: Jezus odezwał się tymi słowami
  rationale: Grecka formuła dosłownie zawiera „odpowiedziawszy, powiedział”, choć nie poprzedza jej wyraźne pytanie. Polski idiom oddaje rozpoczęcie wypowiedzi bez sugerowania nieobecnego w tekście pytania.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Wysławiam Cię
  rationale: W tym zwrocie do Ojca czasownik oznacza otwarte uznanie połączone z uwielbieniem lub dziękczynieniem. „Wysławiam Cię” zachowuje podniosły, doksologiczny ton, a przypis sygnalizuje możliwy odcień dziękczynny.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Ojcze, Panie nieba i ziemi
  rationale: Bezpośrednio zachowuje dwa wołacze oraz obraz powszechnego panowania Boga.
- source_word: ὅτι
  choice: że
  rationale: Po polskim czasowniku „wysławiam” zdanie dopełnieniowe z „że” naturalnie może wskazywać treść i zarazem podstawę wysławiania, bez wymuszania wyłącznie przyczynowego odczytania.
- source_word: ἔκρυψας ... ἀπεκάλυψας
  choice: ukryłeś ... objawiłeś
  rationale: Zachowuje czynne formy i bezpośrednio przypisuje oba działania Ojcu, zgodnie z greką.
- source_word: ταῦτα ... αὐτά
  choice: te rzeczy ... je
  rationale: Pozostawia otwarte odniesienie zaimków, nie dopowiadając, czym dokładnie są wskazane rzeczy.
- source_word: σοφῶν καὶ συνετῶν
  choice: mądrymi i rozumnymi
  rationale: Zwięzła, naturalna para rzeczownikowo użytych przymiotników, zachowująca rozróżnienie między mądrością a zdolnością rozumienia.
- source_word: νηπίοις
  choice: niemowlętom
  rationale: Najpełniej zachowuje wyrazisty kontrast greckiego rzeczownika oznaczającego niemowlęta lub bardzo małe dzieci. Metaforyczny sens pozostaje dostępny bez zastępowania obrazu interpretacyjnym określeniem „pokorni”.
theological_decisions:
- issue: Boskie działanie w ukrywaniu i objawianiu
  choice: „ukryłeś ... a objawiłeś”
  alternative: „pozwoliłeś, by pozostało ukryte ... a objawiłeś”
  rationale: Greka używa prostych form czynnych, których podmiotem jest Ojciec. Przekład zachowuje napięcie teologiczne i nie łagodzi boskiego sprawstwa.
- issue: Tożsamość νηπίοις
  choice: „niemowlętom” z objaśnieniem możliwego użycia przenośnego
  alternative: „małym dzieciom” lub interpretacyjne „pokornym”
  rationale: Dosłowny obraz najlepiej zachowuje paradoksalny kontrast z „mądrymi i rozumnymi”; przypis wskazuje przenośne zastosowanie, nie zamykając go w jednej abstrakcyjnej kategorii.
- issue: Relacja wyrażona przez ὅτι
  choice: „że”
  alternative: „ponieważ”
  rationale: ὅτι może wprowadzać treść wyznania/wysławiania, a w kontekście również jego podstawę. „Że” naturalnie zachowuje tę niejednoznaczność.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Wielkie litery w zaimkach odnoszących się do Boga odpowiadają utrwalonej polskiej praktyce religijnej. Składnia jest naturalna po polsku, a zarazem zachowuje obrazowość, referencyjną otwartość i napięcie tekstu źródłowego.
