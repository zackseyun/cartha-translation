  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: pl
  text: Ale co wyszliście zobaczyć? Człowieka ubranego w delikatne szaty[a]? Oto ci, którzy noszą delikatne szaty, są w domach królów[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ubranego w miękkie szaty” albo „w kosztowny strój”. Greckie wyrażenie dosłownie mówi o „miękkich [rzeczach/szatach]” i w tym kontekście sugeruje delikatny, luksusowy ubiór.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „w pałacach królewskich”. Grecki tekst mówi bardziej dosłownie: „w domach królów”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ale
  rationale: Naturalnie wprowadza kolejne przeciwstawne pytanie retoryczne Jezusa.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: co wyszliście zobaczyć
  rationale: Oddaje zaimek τί oraz cel wyjścia wyrażony bezokolicznikiem ἰδεῖν; zachowuje formę pytania retorycznego.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: Dosłowny i naturalny polski odpowiednik, stosowny w bezpośrednim odniesieniu do Jana.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: ubranego w miękkie szaty
  rationale: Zachowuje konkretny obraz greckiego „ubrany w miękkie [rzeczy]”; „szaty” brzmią godnie i jasno w kontekście stroju.
- source_word: ἰδοὺ
  choice: Oto
  rationale: Współczesny, lecz podniosły sygnał zwrócenia uwagi, zachowujący retoryczną siłę partykuły.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ci, którzy noszą miękkie szaty
  rationale: Imiesłów φοροῦντες wskazuje na zwyczaj noszenia; powtórzenie „miękkie szaty” zachowuje więź leksykalną obu członów.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: przebywają w domach królów
  rationale: Zachowuje liczbę mnogą i dosłowny obraz „domów królów”; „przebywają” brzmi po polsku naturalniej niż samo „są” w znaczeniu lokalizacji.
theological_decisions: []
