  register: Nowoczesna, standardowa polszczyzna o godnym rejestrze. Zachowano ciąg pytań retorycznych, uwagę przyciągające „Oto” oraz powtórzenie obrazu miękkich szat. Przypisy objaśniają luksusowy sens stroju i idiomatyczną możliwość oddania domów królów jako pałaców.
