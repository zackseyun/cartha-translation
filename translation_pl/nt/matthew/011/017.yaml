base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: pl
  text: 'Mówią: „Graliśmy wam na flecie, a nie tańczyliście; śpiewaliśmy pieśń żałobną, a nie biliście się w piersi[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „nie biliście się”; chodzi o gest żałoby, zwłaszcza uderzanie się w piersi.'
