lexical_decisions:
- source_word: λέγουσιν
  choice: Mówią
  rationale: Czas teraźniejszy zachowuje żywość wypowiedzi dzieci w obrębie porównania.
- source_word: Ηὐλήσαμεν
  choice: Graliśmy wam na flecie
  rationale: Czasownik αὐλέω oznacza konkretnie grę na flecie lub piszczałce; ten przekład jest naturalny i zachowuje wzmiankę o instrumencie.
- source_word: ὑμῖν
  choice: wam
  rationale: Polski celownik naturalnie oddaje występ skierowany do pozostałych dzieci.
- source_word: ὠρχήσασθε
  choice: tańczyliście
  rationale: Forma medialna nie wymaga w tym kontekście osobnego zaznaczania zwrotności.
- source_word: ἐθρηνήσαμεν
  choice: śpiewaliśmy pieśń żałobną
  rationale: Oddaje żałobny, zapewne pogrzebowy charakter θρηνέω oraz zachowuje paralelę dwóch wykonywanych utworów.
- source_word: ἐκόψασθε
  choice: biliście się w piersi
  rationale: W kontekście żałoby czasownik odnosi się do uderzania się jako zwyczajowego gestu opłakiwania; dosłowne oddanie zachowuje konkretny obraz źródłowy.
