id: MAT.11.21
reference: Matthew 11:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: pl
  text: Biada tobie, Korozain! Biada tobie, Betsaido! Bo gdyby w Tyrze i Sydonie dokonały się te potężne dzieła[a], które dokonały się pośród was, już dawno pokutowałyby w worze i popiele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „cuda” albo „dzieła mocy”.'
    reason: Alternatywne oddanie greckiego αἱ δυνάμεις.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Biada tobie
  rationale: Zachowuje prorocki ton zarazem lamentu i zapowiedzi sądu, a przy tym jest utrwalonym, godnym polskim zwrotem.
- source_word: Χοραζίν
  choice: Korozain
  rationale: Przyjęto rozpowszechnioną polską formę biblijnej nazwy miejscowej.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: 'Przyjęto utrwaloną współczesną polską formę nazwy miejscowej; w wołaczu: „Betsaido”.'
- source_word: ὅτι
  choice: Bo
  rationale: Spójnik wprowadza uzasadnienie wcześniejszej zapowiedzi biada.
- source_word: αἱ δυνάμεις
  choice: potężne dzieła
  rationale: Oddaje dzieła będące przejawami mocy, nie zawężając znaczenia wyłącznie do nowoczesnej kategorii „cudów”.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: dokonały się ... które dokonały się
  rationale: Powtórzenie odzwierciedla wspólny grecki czasownik i pozostaje naturalne w uroczystym polskim zdaniu.
- source_word: ἐν ὑμῖν
  choice: pośród was
  rationale: Liczba mnoga odnosi się do mieszkańców miast; chodzi o wydarzenia mające miejsce w ich otoczeniu, nie wewnątrz nich.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: już dawno pokutowałyby
  rationale: Forma warunkowa oddaje nierzeczywisty skutek, πάλαι wskazuje na znacznie wcześniejszy czas, a „pokutować” naturalnie wyraża tutaj nawrócenie potwierdzone znakami żałoby.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: w worze pokutnym i popiele
  rationale: Zachowuje konkretny starożytny obraz zewnętrznych oznak żalu i nawrócenia; dopowiedzenie „pokutnym” ułatwia współczesnemu odbiorcy rozpoznanie sensu worka.
theological_decisions:
- issue: Charakter porównania z Tyrem i Sydonem
  choice: Zachowano rzeczywiste porównanie odpowiedzialności miast, które były świadkami potężnych dzieł, lecz nie pokutowały.
  alternative: Potraktowanie wypowiedzi wyłącznie jako retorycznej przesady bez rzeczywistego porównania w sądzie.
  rationale: Grecki kontrfaktyczny okres warunkowy wzmacnia oskarżenie Korozain i Betsaidy. Przekład nie dodaje jednak wniosków doktrynalnych wykraczających poza tekst.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano prorocką formułę „Biada tobie”, polskie wołacze nazw miast oraz kulturowy obraz wora pokutnego i popiołu.
