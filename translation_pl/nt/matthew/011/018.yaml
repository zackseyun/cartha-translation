id: MAT.11.18
reference: Matthew 11:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: pl
  text: 'Jan bowiem przyszedł, nie jedząc ani nie pijąc, a oni mówią: „Ma demona”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Jest opętany przez demona”. Dosłownie po grecku: „Ma demona”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: przyszedł
  rationale: Aoryst czasownika ἔρχομαι wskazuje na przyjście Jana i jego pojawienie się publicznie; „przyszedł” zachowuje podstawowy sens greckiego czasownika.
- source_word: γὰρ
  choice: bowiem
  rationale: Spójnik wprowadza uzasadnienie wcześniejszej wypowiedzi. „Bowiem” naturalnie zachowuje jego funkcję wyjaśniającą.
- source_word: Ἰωάννης
  choice: Jan
  rationale: Utrwalona polska forma imienia; z kontekstu wynika, że chodzi o Jana Chrzciciela.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: nie jedząc ani nie pijąc
  rationale: Imiesłowy z μήτε…μήτε opisują ascetyczny sposób życia Jana. Przekład zachowuje zwięzłość i nie dodaje chleba ani wina, których ten werset nie wymienia.
- source_word: καὶ λέγουσιν
  choice: a oni mówią
  rationale: Czas teraźniejszy ma żywy, uogólniający charakter. Zaimek „oni” nie precyzuje ponad tekst, kim są oskarżyciele, a spójnik „a” naturalnie oddaje kontrast widoczny w kontekście.
- source_word: Δαιμόνιον ἔχει
  choice: Ma demona
  rationale: To bliskie i naturalne oddanie dosłownej konstrukcji „ma demona”; nie utożsamia δαιμόνιον z diabłem i nie wzmacnia interpretacyjnie samego oskarżenia.
theological_decisions:
- issue: Sposób oddania oskarżenia z δαιμόνιον
  choice: Ma demona
  alternative: Jest opętany przez demona
  rationale: Werset przytacza zarzut przeciwników wobec Jana, a nie ocenę narratora. Dosłowniejsza forma zachowuje brzmienie i napięcie wypowiedzi bez dopowiadania charakteru domniemanego opętania.
translation_notes:
  register: Współczesny, godny i zwięzły polski. Szyk „Jan bowiem przyszedł” zachowuje funkcję wyjaśniającą γάρ, a konstrukcja imiesłowowa odtwarza skondensowaną formę grecką. Marker przypisu umieszczono przy wyrażeniu, którego dotyczy wariant leksykalny.
