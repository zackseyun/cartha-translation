base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: pl
  text: Kto ma uszy[a], niech słucha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „Ten, kto ma uszy, niech słucha”. Grecki tekst używa ogólnego określenia w liczbie pojedynczej.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Kto ma
  rationale: Rodzajnik z imiesłowem pełni funkcję rzeczownikową i ma sens ogólny. Polskie „kto ma” naturalnie odnosi się do każdej osoby, zachowując liczbę pojedynczą bez archaicznego brzmienia.
- source_word: ὦτα
  choice: uszy
  rationale: Grecki rzeczownik występuje w liczbie mnogiej; „uszy” jest przekładem formalnie wiernym i zachowuje idiomatyczne wezwanie do uważnego odbioru.
- source_word: ἀκουέτω
  choice: niech słucha
  rationale: Forma ta jest rozkaźnikiem trzeciej osoby liczby pojedynczej w czasie teraźniejszym. „Niech słucha” zachowuje zarówno wartość rozkazującą, jak i aspekt ciągły, a w tym kontekście może obejmować słuchanie ze zrozumieniem i posłuszeństwem.
theological_decisions:
- issue: Ogólne odniesienie wyrażone formą liczby pojedynczej
  choice: Kto ma uszy, niech słucha.
  alternative: Ten, kto ma uszy, niech słucha.
  rationale: Grecka konstrukcja jest gramatycznie rodzaju męskiego i liczby pojedynczej, lecz ma znaczenie ogólne. Polskie „kto” naturalnie obejmuje każdą osobę, a czasowniki w liczbie pojedynczej zachowują strukturę źródła bez niepotrzebnego zawężania wezwania do mężczyzn.
translation_notes:
  register: Język współczesny, zwięzły i godny. Wybrano „niech słucha” zamiast bardziej archaicznego „niechaj słucha” oraz zamiast „niech usłyszy”, ponieważ grecki rozkaźnik czasu teraźniejszego podkreśla słuchanie, nie jednorazowe usłyszenie.
