id: MAT.11.22
reference: Matthew 11:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: pl
  text: 'Jednak mówię wam: Tyrowi i Sydonowi będzie znośniej[a] w dniu sądu niż wam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „łatwiej do zniesienia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Jednak
  rationale: Wprowadza mocny kontrast z poprzedzającym potępieniem; „jednak” zachowuje przeciwstawny sens i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Zachowuje bezpośredni zwrot Jezusa do adresatów oraz uroczysty nacisk formuły, nie nadając jej sztucznie archaicznego brzmienia.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Tyrowi i Sydonowi
  rationale: Celownik grecki przy stopniu wyższym wskazuje strony porównania. Polski celownik oddaje tę składnię naturalnie; nazwy miast są tu traktowane jako ich mieszkańcy lub wspólnoty.
- source_word: ἀνεκτότερον
  choice: znośniej
  rationale: Stopień wyższy od ἀνεκτός oznacza coś łatwiejszego do zniesienia. „Znośniej” jest zwięzłe, współczesne i zachowuje porównawczy charakter wyrażenia.
- source_word: ἔσται
  choice: będzie
  rationale: Oddaje przyszłą formę czasownika εἰμί i naturalnie łączy się w języku polskim z przysłówkowym „znośniej”.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: w dniu sądu
  rationale: Blisko oddaje określenie czasu i zachowuje sądowy, eschatologiczny sens κρίσις bez zawężania go do samego potępienia.
- source_word: ἢ ὑμῖν
  choice: niż wam
  rationale: Zwięźle i wiernie domyka porównanie, zachowując liczbę mnogą adresatów.
theological_decisions:
- issue: Charakter przyszłego sądu
  choice: w dniu sądu
  alternative: w dzień sądu
  rationale: Greckie ἐν ἡμέρᾳ κρίσεως wskazuje w kontekście na rozpoznawalny przyszły sąd. Sformułowanie nie dodaje szczegółów dotyczących jego przebiegu ani wyniku.
- issue: Stopniowalność ciężaru sądu
  choice: Tyrowi i Sydonowi będzie znośniej niż wam
  alternative: Tyrowi i Sydonowi będzie łatwiej to znieść niż wam
  rationale: Zachowano wyraźne porównanie obecne w tekście, nie wyjaśniając, na czym dokładnie polega różnica w doświadczeniu sądu.
translation_notes:
  register: Język współczesny, zwięzły i godny. Szyk z „Jednak” na początku wyraźnie sygnalizuje kontrast, a forma „znośniej” unika rozwlekłości i zachowuje sądowy ton wypowiedzi.
