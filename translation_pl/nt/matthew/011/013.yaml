  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: pl
  text: Gdyż wszyscy prorocy i Prawo prorokowali aż do Jana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „do Jana” albo „do czasów Jana”. Wyrażenie to może przedstawiać Jana jako kulminację prorockiego świadectwa lub jako granicę wyznaczającą przejście.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: wszyscy
  rationale: W połączeniu z οἱ προφῆται oznacza cały zbiorowy krąg proroków; „wszyscy” jest naturalnym polskim odpowiednikiem.
- source_word: γὰρ
  choice: gdyż
  rationale: Spójnik uzasadnia lub objaśnia poprzednią wypowiedź; „gdyż” zachowuje tę funkcję i odpowiada godnemu, współczesnemu rejestrowi.
- source_word: οἱ προφῆται
  choice: prorocy
  rationale: To standardowe określenie osób przemawiających proroczo w imieniu Boga.
- source_word: ὁ νόμος
  choice: Prawo
  rationale: W zestawieniu z prorokami chodzi o Prawo jako rozpoznawalną część Pisma Izraela, a nie o prawo w sensie ogólnym; wielka litera sygnalizuje ten charakter.
- source_word: ἕως Ἰωάννου
  choice: aż do Jana
  rationale: ἕως z dopełniaczem wyznacza granicę czasową. „Aż do Jana” jest zwięzłe i naturalne, a zarazem nie rozstrzyga, czy Jan należy do kulminacji wcześniejszego świadectwa, czy wyznacza moment przejścia.
- source_word: ἐπροφήτευσαν
  choice: prorokowali
  rationale: Forma aorystu czynnego od προφητεύω. Dosłowne „prorokowali” zachowuje personifikujące odniesienie orzeczenia zarówno do proroków, jak i do Prawa.
theological_decisions:
- issue: Czy ὁ νόμος oddać jako pojęcie ogólne, czy jako nazwę części Pisma
  choice: Prawo
  alternative: prawo
  rationale: Kontekst wskazuje na uznane świadectwo Pisma Izraela — proroków i Prawo — nie zaś na abstrakcyjną zasadę prawną.
- issue: Czy ἕως Ἰωάννου włącza Jana w okres prorocki, czy jedynie wyznacza jego kres
  choice: aż do Jana
  alternative: do czasów Jana
  rationale: Greka nie rozstrzyga w pełni, czy Jan stanowi kulminację prorockiego świadectwa, czy granicę przejścia. Tekst główny zachowuje tę niejednoznaczność, a przypis ją objaśnia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano nietypowe, lecz zamierzone wspólne orzeczenie „prorokowali” odnoszące się do proroków i Prawa. Marker przypisu [a] występuje w tekście głównym.
