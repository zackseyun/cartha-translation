  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: pl
  text: 'Ale do czego mam porównać to pokolenie? Jest podobne do dzieci siedzących na placach targowych[a] i wołających do innych[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „na rynkach”. Greckie ἀγοραί oznacza publiczne place handlowe, na których gromadzili się ludzie.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „do innych dzieci”. Tekst grecki mówi dosłownie „do innych”, a ich tożsamość wynika z obrazu przedstawionego w porównaniu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: Ale do czego mam porównać
  rationale: Pytajne Τίνι wyznacza przedmiot porównania, a przyszłe ὁμοιώσω ma tu retoryczny, deliberatywny charakter. Konstrukcja „mam porównać” brzmi naturalnie po polsku i zachowuje ten odcień; δέ oddano łagodnie kontrastującym „Ale”.
- source_word: τὴν γενεὰν ταύτην
  choice: to pokolenie
  rationale: γενεά oznacza tutaj współczesne Jezusowi pokolenie lub ludzi ujmowanych jako jedna generacja; tradycyjne i trafne „to pokolenie” nie zawęża sensu.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: Jest podobne do dzieci
  rationale: Proste orzeczenie podobieństwa oddano bez dodawania niewyrażonych szczegółów; παιδίοις oznacza dzieci, bez konieczności eksponowania zdrobnienia.
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: siedzących na placach targowych
  rationale: Imiesłów zachowuje obraz trwającej sceny. ἀγορά to publiczny plac handlowy i miejsce zgromadzeń, dlatego „place targowe” jest historycznie trafniejsze niż współczesne „targowiska” rozumiane głównie jako teren ze straganami.
- source_word: ἃ προσφωνοῦντα τοῖς ἑτέροις
  choice: i wołających do innych
  rationale: προσφωνέω oznacza zwracanie się do kogoś głosem; „wołać do” pasuje do publicznej sceny. τοῖς ἑτέροις pozostawiono jako „do innych”, nie dopowiadając w tekście głównym, że chodzi o inne dzieci.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk pytania jest naturalny w języku polskim, a końcowy dwukropek sygnalizuje, że wypowiedź dzieci następuje w kolejnym wersecie. Wszystkie przypisy mają odpowiadające znaczniki w tekście głównym.
