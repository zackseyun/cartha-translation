id: MAT.11.23
reference: Matthew 11:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: pl
  text: A ty, Kafarnaum, czy zostaniesz wywyższone aż do nieba? Aż do Hadesu[a] zstąpisz. Gdyby bowiem w Sodomie dokonały się dzieła mocy, które dokonały się w tobie, przetrwałaby ona aż do dziś.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „krainy umarłych”. Gr. „Hades”, nie Gehenna.'
    reason: Alternatywa leksykalna objaśnia termin ᾅδης, nie utożsamiając go z odmiennym greckim określeniem Gehenny.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Zastosowano utrwaloną polską formę biblijnej nazwy miejscowej. Jako rzeczownik rodzaju nijakiego wymaga w bezpośrednim zwrocie formy „wywyższone”.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: czy zostaniesz wywyższone aż do nieba?
  rationale: μή z czasownikiem w czasie przyszłym odczytano jako pytanie retoryczne oczekujące odpowiedzi przeczącej. „Wywyższone” oddaje zarówno obraz wzniesienia, jak i sens wysokiej pozycji, a „aż do nieba” zachowuje graniczny charakter ἕως.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Aż do Hadesu zstąpisz
  rationale: „Zstąpisz” naturalnie oddaje καταβαίνω i zachowuje podniosły, lecz zrozumiały rejestr. Transliteracja „Hades” nie utożsamia ᾅδης z Gehenną ani nie rozstrzyga jego pełnego znaczenia teologicznego.
- source_word: δυνάμεις
  choice: dzieła mocy
  rationale: Wyrażenie obejmuje konkretne czyny dokonane mocą, nie zawężając znaczenia wyłącznie do współczesnego rozumienia słowa „cuda”.
- source_word: γενόμεναι ἐν σοί
  choice: które dokonały się w tobie
  rationale: Zachowano personifikację miasta oraz konstrukcję miejscową „w tobie”; „dokonały się” odpowiada zdarzeniowemu znaczeniu γίνομαι w odniesieniu do dzieł mocy.
- source_word: ἐγενήθησαν
  choice: gdyby ... dokonały się
  rationale: Polska konstrukcja z „gdyby” jasno oddaje nierzeczywisty warunek odnoszący się do przeszłości.
- source_word: ἔμεινεν ἂν
  choice: przetrwałaby ona
  rationale: Tryb przypuszczający oddaje nierzeczywisty skutek z ἄν. Zaimek rodzaju żeńskiego odnosi się do Sodomy jako miasta i zachowuje liczbę pojedynczą greckiego orzeczenia.
- source_word: μέχρι τῆς σήμερον
  choice: aż do dziś
  rationale: Jest to zwięzłe i naturalne współczesne polskie oddanie granicy czasowej wyrażonej w tekście.
theological_decisions:
- issue: Oddanie ᾅδης
  choice: Hades
  alternative: kraina umarłych; piekło
  rationale: „Hades” zachowuje grecki termin oraz jego odrębność od Gehenny. Nie wprowadza automatycznie późniejszych skojarzeń doktrynalnych związanych ze słowem „piekło”; objaśniający odpowiednik podano w przypisie.
translation_notes:
  register: Język współczesny, godny i zrozumiały. Zachowano bezpośrednią apostrofę do miasta, pytanie retoryczne, paralelizm kierunków „aż do nieba / aż do Hadesu” oraz nierzeczywisty okres warunkowy.
