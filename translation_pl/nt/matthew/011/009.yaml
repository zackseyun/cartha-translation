  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: pl
  text: Ale co wyszliście zobaczyć? Proroka? Tak, mówię wam, i więcej niż proroka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „kogoś większego niż prorok”. Dosłownie: „i więcej niż proroka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ale
  rationale: Wprowadza kontrast wobec poprzednich pytań retorycznych i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: τί ἐξήλθατε ... ἰδεῖν
  choice: co wyszliście zobaczyć
  rationale: Zachowuje zaimkowe „co” oraz celowy bezokolicznik ἰδεῖν, nie zmieniając pytania na „dlaczego”.
- source_word: προφήτην
  choice: proroka
  rationale: W pytaniu retorycznym polski biernik naturalnie oddaje grecki rzeczownik bez rodzajnika.
- source_word: ναί, λέγω ὑμῖν
  choice: Tak, mówię wam
  rationale: Bezpośrednio zachowuje potwierdzenie ναί i uroczystą formułę wypowiedzi Jezusa.
- source_word: καὶ περισσότερον προφήτου
  choice: nawet więcej niż proroka
  rationale: καί ma tu naturalny sens wzmacniający („nawet”), a „więcej niż proroka” zachowuje zwięzłość i celową niedookreśloność greckiego porównania.
theological_decisions:
- issue: Tożsamość i ranga Jana Chrzciciela w wypowiedzi Jezusa
  choice: więcej niż proroka
  alternative: kogoś większego niż prorok
  rationale: Grecki tekst wynosi Jana ponad kategorię proroka, lecz nie precyzuje tutaj, na czym polega ta przewaga. Dosłowniejsza konstrukcja zachowuje napięcie i nie dopowiada ukrytego podmiotu.
translation_notes:
  register: Język współczesny, jasny i godny. Szyk pytania jest naturalny po polsku, a pauza przed kulminacyjnym stwierdzeniem podkreśla jego wagę bez dodawania treści.
