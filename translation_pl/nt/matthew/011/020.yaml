  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: pl
  text: Wtedy zaczął ganić miasta, w których dokonała się większość jego dzieł mocy[a], ponieważ się nie nawróciły.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „cuda” lub „potężne dzieła” (gr. dýnameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wskaźnik czasu, zachowujący narracyjne następstwo greckiego Τότε.
- source_word: ἤρξατο ὀνειδίζειν
  choice: zaczął czynić wyrzuty
  rationale: Zachowuje aspekt rozpoczęcia czynności wyrażony przez ἤρξατο oraz sens ὀνειδίζω jako ostrego wytykania win, bez wzmacniania go do formalnego potępienia.
- source_word: τὰς πόλεις ἐν αἷς
  choice: miastom, w których
  rationale: Oddaje cel wyrzutów celownikiem wymaganym przez polską składnię oraz zachowuje odniesienie względne do miejsc.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: dokonało się najwięcej jego potężnych dzieł
  rationale: Bezpodmiotowa konstrukcja jest naturalna po polsku; „najwięcej” zachowuje superlatywną wartość πλεῖσται, a „potężne dzieła” uwydatniają związek δυνάμεις z mocą.
- source_word: ὅτι οὐ μετενόησαν
  choice: ponieważ się nie opamiętały
  rationale: ὅτι podaje przyczynę wyrzutów. „Opamiętać się” naturalnie wyraża zmianę myślenia i postępowania właściwą μετανοέω, nie ograniczając jej do samego żalu.
theological_decisions:
- issue: Znaczenie δυνάμεις w kontekście cudownych czynów Jezusa
  choice: potężne dzieła
  alternative: cuda; dzieła mocy
  rationale: Wyrażenie zachowuje nacisk greckiego rzeczownika na moc, a przypis podaje bardziej utarte i formalnie bliższe możliwości.
- issue: Oddanie μετανοέω
  choice: opamiętać się
  alternative: nawrócić się; pokutować
  rationale: „Opamiętać się” obejmuje przemianę myślenia prowadzącą do zmiany postępowania, nie narzucając wąskiego, wyznaniowo nacechowanego rozumienia pokuty. Zachowana forma żeńska odnosi się gramatycznie do miast, czyli ich mieszkańców.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Metonimia „miasta” na oznaczenie ich mieszkańców została zachowana tak jak w grece. Zaimek „jego” pozostawiono zgodnie z tekstem źródłowym, choć w polszczyźnie można by go pominąć.
