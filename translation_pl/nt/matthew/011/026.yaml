  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: pl
  text: Tak[a], Ojcze, gdyż tak Ci się upodobało.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Istotnie, Ojcze, ponieważ takie było Twoje upodobanie”.'
    reason: Alternatywny przekład ναί oraz bardziej rzeczownikowe oddanie frazy οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου.
lexical_decisions:
- source_word: ναί
  choice: Tak
  rationale: Bezpośrednie, naturalne potwierdzenie w kontekście modlitwy; zachowuje ton zgody i uznania.
- source_word: ὁ πατήρ
  choice: Ojcze
  rationale: Grecki mianownik z rodzajnikiem pełni funkcję zwrotu bezpośredniego; polski wołacz jest tu naturalny i precyzyjny.
- source_word: ὅτι
  choice: bo
  rationale: Oddaje przyczynowy sens spójnika w zwięzłej, współczesnej polszczyźnie.
- source_word: οὕτως
  choice: takie
  rationale: W połączeniu z rzeczownikiem „upodobanie” wskazuje na opisany wcześniej sposób działania Ojca, nie dopowiadając jego charakteru.
- source_word: εὐδοκία
  choice: upodobanie
  rationale: Zachowuje rzeczownikowy charakter greckiego wyrazu oraz jego znaczenie przychylnej woli, aprobaty lub tego, co sprawia zadowolenie, bez zawężania go do dekretu czy planu.
- source_word: ἐγένετο
  choice: było
  rationale: W tym idiomatycznym połączeniu prosta forma czasownika „być” brzmi po polsku naturalnie, podczas gdy dosłowne „stało się” byłoby niezręczne.
- source_word: ἔμπροσθέν σου
  choice: Twoje
  rationale: Greckie „przed Tobą” wyraża tu osobiste upodobanie Ojca; polska konstrukcja dzierżawcza naturalnie oddaje ten sens, choć mniej dosłownie.
theological_decisions:
- issue: Czy εὐδοκία należy oddać jako Boży zamysł/dekret, czy jako upodobanie i aprobatę
  choice: upodobanie
  alternative: zamysł; to, co się Tobie spodobało
  rationale: „Upodobanie” zachowuje zakres znaczeniowy obejmujący wolę, aprobatę i przyjemność, nie narzucając mocniejszego sensu dekretalnego, którego sam werset jednoznacznie nie rozstrzyga.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr modlitwy. Wołacz „Ojcze” jest naturalny, a „upodobanie” zachowuje teologiczną pojemność tekstu. Wielkie litery w zaimkach odnoszących się do Ojca odpowiadają polskiej konwencji religijnej.
