source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: pl
  text: 'Ale mówię wam: ziemi Sodomy lżej[a] będzie w dniu sądu niż tobie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „znośniej”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ale
  rationale: W tym kontekście wyraz wprowadza mocne przeciwstawienie i uroczystą konkluzję; „Ale” brzmi naturalnie we współczesnej polszczyźnie.
- source_word: λέγω ὑμῖν
  choice: mówię ci
  rationale: Grecki zaimek jest formalnie w liczbie mnogiej, lecz polski przekład dostosowuje adres do personifikowanego miasta, do którego odnosi się końcowe σοί; formuła zachowuje bezpośredni charakter wypowiedzi.
- source_word: γῇ Σοδόμων
  choice: ziemi Sodomy
  rationale: Oddaje wyraźnie obecny rzeczownik γῇ („ziemia, kraina”), nie sprowadzając zwrotu jedynie do nazwy miasta.
- source_word: ἀνεκτότερον
  choice: lżej
  rationale: W konstrukcji „lżej będzie” jest to naturalny polski odpowiednik stopnia wyższego oznaczającego, że sąd będzie łatwiejszy do zniesienia; alternatywę bardziej dosłowną podano w przypisie.
- source_word: ἔσται
  choice: będzie
  rationale: Prosta, współczesna forma czasu przyszłego czasownika „być”.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: w dniu sądu
  rationale: Zachowuje budowę greckiego określenia czasu i jego eschatologiczny sens bez dodatkowego objaśniania.
- source_word: ἢ σοί
  choice: niż tobie
  rationale: Zachowuje liczbę pojedynczą σοί i bezpośredni, personifikujący zwrot do miasta.
theological_decisions:
- issue: Odniesienie liczby pojedynczej σοί
  choice: „tobie” jako bezpośredni zwrot do personifikowanego miasta
  alternative: „wam” lub „niż waszym mieszkańcom”
  rationale: Grecki tekst ma liczbę pojedynczą i kontynuuje prorocki zwrot do miasta; rozwinięcie go do mieszkańców usuwałoby zamierzoną personifikację.
translation_notes:
  register: Język współczesny, zwięzły i godny. Konstrukcja „ziemi Sodomy lżej będzie” zachowuje emfatyczne wysunięcie adresata porównania oraz uroczysty ton wypowiedzi.
