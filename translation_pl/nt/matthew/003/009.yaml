  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: pl
  text: 'I nie myślcie sobie[a]: „Naszym ojcem jest Abraham”. Mówię wam bowiem, że Bóg może z tych kamieni wzbudzić dzieci dla Abrahama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie mówcie między sobą” albo „nie mówcie w głębi siebie”. Grecki zwrot może odnosić się zarówno do wewnętrznego przekonywania samych siebie, jak i do wypowiedzi w obrębie grupy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: nie sądźcie, że możecie
  rationale: Konstrukcja μή z aorystem trybu łączącego ma charakter zakazu i ostrzega przed przyjęciem pewnego siebie, błędnego założenia. Polskie „nie sądźcie, że możecie” naturalnie oddaje zarówno myśl, jak i bezpodstawną śmiałość zawartą w kontekście.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: sobie mówić
  rationale: Zwrot może oznaczać zarówno wewnętrzną mowę, jak i wypowiedzi w obrębie grupy. „Sobie mówić” zachowuje w polszczyźnie tę dwuznaczność; przypis objaśnia oba odcienie.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Naszym ojcem jest Abraham
  rationale: Naturalna współczesna polszczyzna, która zachowuje roszczenie oparte na pochodzeniu od Abrahama i jego emfatyczny charakter.
- source_word: λέγω γὰρ ὑμῖν
  choice: Mówię wam bowiem
  rationale: Oddaje formułę dyskursywną oraz wyjaśniającą funkcję γάρ, zachowując podniosły, lecz zrozumiały rejestr.
- source_word: δύναται
  choice: może
  rationale: Współczesny i naturalny odpowiednik wyrażający Bożą zdolność i moc działania.
- source_word: ἐκ τῶν λίθων τούτων
  choice: z tych kamieni
  rationale: Dosłownie i idiomatycznie oddaje ἐκ oraz zachowuje obraz źródła, z którego Bóg może wzbudzić potomstwo.
- source_word: ἐγεῖραι
  choice: wzbudzić
  rationale: Czasownik oznacza tu powołanie do istnienia lub ustanowienie potomków, niekoniecznie zmartwychwstanie. „Wzbudzić” zachowuje biblijny rezonans bez rozstrzygania mechanizmu działania.
- source_word: τέκνα
  choice: dzieci
  rationale: Termin jest inkluzywny płciowo i oznacza dzieci lub potomków; „dzieci” najbliżej zachowuje podstawową metaforę rodzinną.
- source_word: τῷ Ἀβραάμ
  choice: Abrahamowi
  rationale: Celownik grecki wyraża relację lub korzyść. Polski celownik brzmi naturalnie i zachowuje zwięzłość oraz możliwy sens dzieci należących do linii Abrahama.
theological_decisions:
- issue: Znaczenie pochodzenia od Abrahama w ostrzeżeniu Jana
  choice: Werset odrzuca poleganie na fizycznym pochodzeniu od Abrahama jako wystarczającej podstawie bezpieczeństwa przed Bogiem, nie zaprzeczając historycznemu ojcostwu Abrahama wobec Izraela.
  alternative: Można uznać wypowiedź jedynie za retoryczną hiperbolę bez krytyki przywileju rodowego albo odczytać ją jako twierdzenie o zastąpieniu etnicznego Izraela.
  rationale: Sformułowanie bezpośrednio gani ufność pokładaną w pochodzeniu. Przekład zachowuje tę krytykę, lecz nie wprowadza późniejszych systemów teologicznych ani wniosku o zastąpieniu, którego sam werset nie wyraża.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano obraz „wzbudzenia dzieci z kamieni” oraz dwuznaczność zwrotu ἐν ἑαυτοῖς. Szyk „Mówię wam bowiem” utrzymuje uroczysty ton wypowiedzi bez archaizacji.
