- from: 'I nie sądźcie, że możecie sobie mówić[a]: „Naszym ojcem jest Abraham”. Mówię wam bowiem, że Bóg może z tych kamieni wzbudzić Abrahamowi dzieci.'
  to: 'I nie myślcie sobie[a]: „Naszym ojcem jest Abraham”. Mówię wam bowiem, że Bóg może z tych kamieni wzbudzić dzieci dla Abrahama.'
  rationale: Revision removes the added implication of permission or ability and renders the warning as a direct rejection of the self-assured ancestral claim. It retains the source ambiguity concerning whether the claim is inward self-talk or speech among the group, documented in the footnote. The final clause is adjusted for clearer modern Polish while preserving the image and relational dative.
  reviewer_model: gpt-5.6-terra
