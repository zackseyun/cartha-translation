    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: i mówił
  rationale: Grecki imiesłów łączy wypowiedź Jana z poprzednim zdaniem. Polski czasownik osobowy daje naturalny ciąg narracji, nie dodając bardziej szczegółowego sensu „głosił” ani „wołał”.
- source_word: Μετανοεῖτε
  choice: Zmieńcie sposób myślenia
  rationale: Tryb rozkazujący liczby mnogiej wzywa do zasadniczej zmiany myślenia i wynikającego z niej ukierunkowania życia. To sformułowanie wydobywa poznawczy składnik μετανοέω, którego samo „żałujcie” nie oddaje; tradycyjne „nawróćcie się” podano w przypisie.
- source_word: ἤγγικεν
  choice: przybliżyło się
  rationale: Perfectum wskazuje, że królestwo nadeszło blisko i pozostaje blisko. „Przybliżyło się” zachowuje ten aspekt lepiej niż samo „jest blisko”.
- source_word: γὰρ
  choice: bo
  rationale: Wprowadza podstawę wezwania i brzmi naturalnie we współczesnej polskiej proklamacji.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Zachowuje charakterystyczne dla Mateusza określenie oraz liczbę mnogą οὐρανῶν, a zarazem należy do utrwalonego, zrozumiałego polskiego rejestru biblijnego.
theological_decisions:
- issue: Zakres znaczeniowy μετανοεῖτε
  choice: Zmieńcie sposób myślenia
  alternative: Nawróćcie się
  rationale: Tekst główny uwydatnia gruntowną reorientację myślenia bez sprowadzania wezwania do emocjonalnego żalu. Przypis zachowuje tradycyjny przekład, który trafnie sugeruje także zmianę kierunku życia.
- issue: Znaczenie wyrażenia „królestwo niebios”
  choice: Zachować Mateuszowe „królestwo niebios”
  alternative: panowanie Boga
  rationale: Βασιλεία może oznaczać królowanie lub królestwo, lecz bezpośrednie oddanie Mateuszowej formuły zachowuje jej rozpiętość znaczeniową i nie zastępuje jej interpretacyjną parafrazą.
translation_notes:
  register: Współczesny, godny i komunikatywny polski. Zachowano zwięzłość prorockiego wezwania oraz Mateuszowe określenie „królestwo niebios”; uniknięto archaicznego „pokutujcie”.
