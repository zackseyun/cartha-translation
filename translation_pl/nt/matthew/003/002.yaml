  text: 'i mówił: „Nawróćcie się[a], bo przybliżyło się królestwo niebios[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie μετανοεῖτε wzywa do zmiany nastawienia i zwrotu życia; możliwe też: „Zmieńcie swoje myślenie”.'
    reason: lexical_alternative
