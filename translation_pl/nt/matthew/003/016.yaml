revisions:
- from: A gdy Jezus został ochrzczony, natychmiast wyszedł z wody. I oto otworzyły się niebiosa, i zobaczył Ducha Bożego zstępującego niczym gołębica i przychodzącego na niego.
  to: A gdy Jezus został ochrzczony, natychmiast wyszedł z wody. I oto otworzyły się niebiosa, i zobaczył Ducha Bożego zstępującego jak gołębica i zbliżającego się do niego.
  rationale: Korekta ogranicza się do zastąpienia nienaturalnego kolokacyjnie „przychodzącego na niego” przez „zbliżającego się do niego” oraz do prostszego „jak gołębica”. Zachowano aspekt trwającego ruchu obu greckich imiesłowów, porównawczy sens ὡσεὶ, brak dopowiedzenia o „lądowaniu” oraz wszystkie pozostałe decyzje przekładowe. Przypisy nie są konieczne, ponieważ w tekście głównym nie pozostaje nierozwiązywalna niejednoznaczność wymagająca oznaczenia.
  reviewer_model: gpt-5.6-terra
