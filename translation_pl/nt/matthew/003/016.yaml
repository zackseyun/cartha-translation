id: MAT.3.16
reference: Matthew 3:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: pl
  text: A gdy Jezus został ochrzczony, natychmiast wyszedł z wody. I oto otworzyły się niebiosa, i zobaczył Ducha Bożego zstępującego jak gołębica i zbliżającego się do niego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: A gdy Jezus został ochrzczony
  rationale: Imiesłów aorystu strony biernej wyraża okoliczność czasową związaną z czynnością główną; polskie „gdy... został ochrzczony” zachowuje stronę bierną i nie usztywnia nadmiernie relacji czasowej.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: natychmiast wyszedł z wody
  rationale: „Natychmiast” oddaje εὐθύς, a idiomatyczne „wyszedł z wody” wyraża ruch ku górze i od wody bez rozstrzygania sposobu chrztu.
- source_word: ἰδοὺ
  choice: oto
  rationale: Naturalny, podniosły polski wykładnik zwracający uwagę na następujące wydarzenie.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: otworzyły się niebiosa
  rationale: Zachowuje liczbę mnogą οἱ οὐρανοί oraz sens greckiej strony biernej w naturalnej polskiej konstrukcji zwrotnej.
- source_word: πνεῦμα θεοῦ
  choice: Ducha Bożego
  rationale: Zachowuje relację do Boga wyrażoną greckim dopełniaczem i w tym kontekście naturalnie wskazuje na Ducha Bożego, bez zastępowania sformułowania tytułem niewystępującym w wersecie.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: zstępującego niczym gołębica
  rationale: „Niczym” wyraźnie zachowuje porównawczą funkcję ὡσεὶ i nie utożsamia Ducha dosłownie z gołębicą.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: przychodzącego na niego
  rationale: Blisko oddaje czasownik „przychodzić” i kierunek wyrażony przez ἐπί, nie wprowadzając bardziej interpretacyjnego „spoczywającego” ani „siadającego”.
theological_decisions:
- issue: Czy πνεῦμα θεοῦ oddać ogólnie, czy jako określenie Ducha Bożego
  choice: Ducha Bożego
  alternative: ducha od Boga
  rationale: Kontekst chrztu Jezusa przemawia za określonym odniesieniem do Ducha Bożego; przekład zachowuje jednak dokładne określenie tekstu, nie zastępując go wyrażeniem „Duch Święty”.
- issue: Czy ὡσεὶ περιστερὰν określa podobieństwo, czy dosłowną postać Ducha
  choice: niczym gołębica
  alternative: jako gołębica
  rationale: Partykuła ὡσεὶ sygnalizuje porównanie. Wybrana forma zachowuje otwartość co do tego, czy podobieństwo dotyczy wyglądu, sposobu zstępowania, czy całej sceny.
- issue: Podmiot czasownika εἶδεν
  choice: zobaczył
  alternative: zobaczono
  rationale: Grecka forma jest w trzeciej osobie liczby pojedynczej, a najbliższym wyraźnym podmiotem jest Jezus; polski przekład zachowuje tę naturalną składnię bez dopowiadania innego obserwatora.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. „Oto”, „niebiosa” i „zstępującego” zachowują biblijną podniosłość, pozostając zrozumiałe. Nie dodano przypisów, ponieważ istotne niuanse można było zachować bezpośrednio w tekście.
