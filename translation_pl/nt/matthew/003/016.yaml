    rationale: Choć jest to dosłowna próba oddania ἐρχόμενον ἐπ’ αὐτόν, polskie „przychodzić na kogoś” nie funkcjonuje naturalnie dla ruchu Ducha ku Jezusowi. Zmiana na „zbliżającego się do niego” oddaje trwający ruch wyrażony imiesłowem i nie dodaje interpretacyjnego „spoczywającego” ani „siadającego”.
