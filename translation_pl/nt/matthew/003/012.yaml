source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: pl
  text: W ręku ma szuflę do odwiewania ziarna[a]. Dokładnie oczyści swoje klepisko i zbierze swoją pszenicę do spichlerza[b], lecz plewy doszczętnie spali ogniem, którego nie można ugasić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „widły do odwiewania ziarna”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „magazynu” albo „stodoły”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: szufla do odwiewania ziarna
  rationale: Narzędzie służące do podrzucania wymłóconego ziarna, aby oddzielić je od plew. To współczesne i zrozumiałe określenie, które nie przesądza nadmiernie dokładnego kształtu narzędzia.
- source_word: διακαθαριεῖ
  choice: dokładnie oczyści
  rationale: Czasownik złożony podkreśla zupełność oczyszczenia; polskie wyrażenie zachowuje tę intensywność i brzmi naturalnie.
- source_word: ἅλωνα
  choice: klepisko
  rationale: Standardowe polskie określenie miejsca młócenia i odwiewania ziarna, odpowiadające realiom obrazu rolniczego.
- source_word: σῖτον
  choice: pszenicę
  rationale: Choć rzeczownik może szerzej oznaczać zboże lub ziarno, w zestawieniu z plewami naturalnym i tradycyjnie zrozumiałym odpowiednikiem jest „pszenica”.
- source_word: ἀποθήκην
  choice: spichlerza
  rationale: Oznacza miejsce przechowywania zbiorów; „spichlerz” precyzyjnie pasuje do zbożowego kontekstu, a przypis zachowuje szerszą możliwość leksykalną.
- source_word: ἄχυρον
  choice: plewy
  rationale: W obrazie odwiewania są to bezwartościowe resztki oddzielane od ziarna; „plewy” to właściwy i idiomatyczny polski termin.
- source_word: κατακαύσει
  choice: doszczętnie spali
  rationale: Przedrostkowy czasownik wskazuje na całkowite spalenie; przysłówek „doszczętnie” oddaje tę intensywność.
- source_word: πυρὶ ἀσβέστῳ
  choice: ogniem nieugaszonym
  rationale: Celownik wyraża środek działania, a przymiotnik określa ogień, którego nie można ugasić. Sformułowanie jest naturalne, godne i zachowuje siłę obrazu.
- source_word: οὗ
  choice: W jego ręku
  rationale: Zaimek względny w dopełniaczu nawiązuje do nadchodzącego z poprzedniego wersetu. Rozpoczęcie od „W jego ręku” naturalnie przenosi tę relację dzierżawczą do polskiego zdania.
theological_decisions:
- issue: Obraz sądu polegającego na oddzieleniu pszenicy od plew
  choice: Zachowano konkretną metaforę rolniczą oraz przyszły, stanowczy język sądu.
  alternative: Objaśniająca parafraza utożsamiająca w tekście głównym pszenicę i plewy odpowiednio ze sprawiedliwymi i niegodziwymi.
  rationale: Sam werset podaje metaforę bez jawnego objaśnienia jej elementów. Przekład powinien zachować jej wagę i napięcie teologiczne, nie dodając interpretacji do tekstu głównego.
translation_notes:
  register: Współczesny, standardowy język polski o godnym rejestrze. Zachowano rytm trzech kolejnych czynności oraz surowy kontrast między zgromadzeniem pszenicy a spaleniem plew. Termin „klepisko” jest tradycyjny, lecz nadal precyzyjny i zrozumiały w tym kontekście.
