  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: pl
  text: Wtedy Jezus przychodzi z Galilei nad Jordan, do Jana, aby dać się ochrzcić przez niego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „aby zostać przez niego ochrzczonym”. Grecka konstrukcja wyraża cel przyjścia Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wskaźnik czasu, który zachowuje następstwo wydarzeń w narracji.
- source_word: παραγίνεται
  choice: przychodzi
  rationale: Zachowuje grecki czas teraźniejszy historyczny i jego narracyjną żywość; w tym kontekście oznacza przybycie.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: z Galilei
  rationale: ἀπό wskazuje miejsce, z którego Jezus przybywa; jest to zwięzłe i naturalne po polsku.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: nad Jordan
  rationale: Przy nazwach rzek polskie „nad” idiomatycznie wyraża udanie się w okolice lub nad brzeg rzeki, zgodnie z kierunkowym sensem ἐπί z biernikiem.
- source_word: πρὸς τὸν Ἰωάννην
  choice: do Jana
  rationale: πρός z biernikiem wskazuje tu ruch ku osobie. Nie dodano tytułu, którego w tym wersecie nie ma.
- source_word: τοῦ βαπτισθῆναι
  choice: aby dać się ochrzcić
  rationale: Dopełniacz rodzajnika z bezokolicznikiem wyraża cel. Ta konstrukcja jest naturalna po polsku i jasno zachowuje bierny sens greckiego czasownika.
- source_word: ὑπ’ αὐτοῦ
  choice: przez niego
  rationale: ὑπό z dopełniaczem wskazuje osobowego wykonawcę czynności; zaimek zachowuje brzmienie tekstu greckiego bez ponownego dodawania imienia Jana.
theological_decisions:
- issue: Historyczny czas teraźniejszy παραγίνεται
  choice: 'Zachowano czas teraźniejszy: „przychodzi”'
  alternative: 'Czas przeszły: „przyszedł”'
  rationale: Grecki czas teraźniejszy ożywia opowiadanie. Polski czas teraźniejszy może pełnić tę samą funkcję i nie wymaga wygładzenia do czasu przeszłego.
- issue: Określenie Jana
  choice: Tylko „Jan”
  alternative: „Jan Chrzciciel”
  rationale: Tekst wersetu zawiera wyłącznie imię. Nie dodano tytułu znanego z kontekstu, aby nie rozszerzać tekstu źródłowego.
- issue: Cel przyjścia Jezusa i bierna forma βαπτισθῆναι
  choice: „aby dać się przez niego ochrzcić”
  alternative: „żeby został przez niego ochrzczony”
  rationale: Zachowano cel oraz fakt, że Jan ma dokonać chrztu, bez wprowadzania teologicznego objaśnienia znaczenia tego wydarzenia.
translation_notes:
  register: Współczesny, godny i narracyjnie żywy polski. Szyk „nad Jordan, do Jana” zachowuje dwa kolejne określenia celu ruchu z greki, a zarazem brzmi naturalniej niż dosłowne „do Jordanu, do Jana”.
