- from: Ja chrzczę was w wodzie ku nawróceniu[a], lecz Ten, który idzie za mną, jest potężniejszy ode mnie. Nie jestem godny nosić Jego sandałów. On sam będzie was chrzcił w Duchu Świętym i ogniu[b].
  to: Ja chrzczę was w wodzie ku nawróceniu[a], lecz ten, który przychodzi po mnie, jest silniejszy ode mnie, a ja nie jestem godny nieść jego sandałów. On sam będzie was chrzcił w Duchu Świętym i ogniu[b].
  rationale: Korekta precyzuje czynność wyrażoną przez βαστάσαι jako niesienie sandałów, zachowuje wyraźną relację względną „którego ... sandałów” oraz stosuje neutralną polską kapitalizację. Nie rozstrzyga funkcji chrztu, znaczenia przyimka ἐν ani obrazu ognia.
