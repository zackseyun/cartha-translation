id: MAT.3.11
reference: Matthew 3:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: pl
  text: Ja chrzczę was w wodzie ku nawróceniu[a], lecz ten, który przychodzi po mnie, jest silniejszy ode mnie, a ja nie jestem godny nieść jego sandałów. On sam będzie was chrzcił w Duchu Świętym i ogniu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „wodą ku nawróceniu”. Greckie ἐν może w tych wyrażeniach znaczyć „w” albo „za pomocą”, a εἰς zachowuje sens kierunku lub celu bez dokładnego określenia relacji między chrztem a nawróceniem.'
    reason: lexical_alternative
  - marker: b
    text: „Ogień” może być obrazem oczyszczenia albo sądu; greckie sformułowanie pozostawia ten obraz otwarty, a jego znaczenie należy odczytywać w świetle kontekstu.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: chrzczę / będzie chrzcił
  rationale: Utrwala rozpoznawalny termin odnoszący się do obrzędu chrztu, nie rozstrzygając jego sposobu przez użycie słowa „zanurzać”.
- source_word: ἐν ὕδατι
  choice: w wodzie
  rationale: Zachowuje podstawową postać greckiego wyrażenia oraz paralelę z późniejszym „w Duchu Świętym i ogniu”; ἐν może też mieć sens narzędziowy „wodą”.
- source_word: εἰς μετάνοιαν
  choice: ku nawróceniu
  rationale: „Ku” zachowuje kierunkowy lub celowy odcień εἰς, nie rozstrzygając dokładnej relacji między nawróceniem a chrztem. „Nawrócenie” naturalnie oddaje tu zmianę myślenia i postępowania.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: lecz Ten, który idzie za mną
  rationale: Naturalnie oddaje imiesłowową konstrukcję i następstwo zapowiadanej osoby; wielka litera jest zgodna z polską konwencją odnoszenia zaimków do Chrystusa.
- source_word: ἰσχυρότερός μού
  choice: jest potężniejszy ode mnie
  rationale: „Potężniejszy” dobrze wyraża przewagę siły i znaczenia, a zarazem brzmi naturalnie i godnie w tym kontekście.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Nie jestem godny
  rationale: W formule uniżenia ἱκανός ma idiomatyczny sens bycia godnym lub odpowiednim, nie tylko fizycznie zdolnym.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: nosić Jego sandałów
  rationale: βαστάσαι oznacza nosić lub dźwigać, nie zdejmować; „sandały” odpowiada realiom i znaczeniu ὑποδήματα.
- source_word: αὐτὸς
  choice: On sam
  rationale: Oddaje emfatyczny zaimek i kontrast między działalnością Jana a działalnością nadchodzącego.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: w Duchu Świętym
  rationale: Zachowuje paralelę składniową z „w wodzie” i standardowe osobowe odniesienie wyrażenia πνεῦμα ἅγιον w tym kontekście.
- source_word: καὶ πυρί
  choice: i ogniu
  rationale: Dosłowne sformułowanie zachowuje otwarty charakter obrazu, bez przesądzania, czy chodzi o oczyszczenie, sąd, czy oba aspekty.
theological_decisions:
- issue: Znaczenie wyrażenia „Duch Święty i ogień”
  choice: Pozostawiono dosłowne „w Duchu Świętym i ogniu”.
  alternative: „Duchem Świętym i oczyszczającym ogniem” albo „Duchem Świętym i ogniem sądu”.
  rationale: Grecki tekst nie objaśnia samego obrazu, a kontekst dopuszcza związek ognia zarówno z oczyszczeniem, jak i z sądem. Przekład nie powinien usuwać tej teologicznej napiętości.
- issue: Odniesienie πνεύματι ἁγίῳ
  choice: „Duch Święty” jako osobowe odniesienie.
  alternative: „święty duch” albo „święta moc ducha”.
  rationale: W kontekście Mateuszowym wyrażenie najnaturalniej odnosi się do Ducha Świętego; przekład nie dodaje jednak żadnego dalszego objaśnienia doktrynalnego.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano tradycyjne, powszechnie zrozumiałe słownictwo biblijne („chrzcić”, „Duch Święty”), unikając archaizmów oraz interpretacyjnego dopowiadania. Rozdzielenie długiego zdania po „ode mnie” poprawia czytelność bez zmiany relacji składniowych i sensu.
