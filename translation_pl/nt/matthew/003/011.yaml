  source_fidelity: 'Główny sens został oddany wiernie: kontrast między chrztem Jana a działaniem Nadchodzącego, celowy odcień εἰς μετάνοιαν oraz otwarte znaczenie „ognia” są zachowane. Jednak „nosić Jego sandałów” może po polsku oznaczać noszenie ich na nogach, podczas gdy βαστάσαι znaczy „nieść/dźwigać”. Warto też zachować w tekście relację „którego sandałów”, wyrażoną przez οὗ.'
  naturalness: Rejestr jest współczesny i godny. „Ku nawróceniu” jest poprawne, choć nieco podniosłe; w tym gatunku pozostaje naturalne. „Ten” i „Jego” zapisane wielką literą nie wynikają z greki i nie są konieczne; małe litery są neutralniejsze oraz zgodne ze współczesną normą poza formami grzecznościowymi.
  terminology: „Chrzczę/chrzcił”, „Duch Święty”, „nawrócenie” i „ogień” są trafne. „Silniejszy” jest bliższym i bardziej zwyczajnym odpowiednikiem ἰσχυρότερος niż „potężniejszy”.
  issues:
  - severity: medium
    issue: „nosić Jego sandałów”
    rationale: Polskie „nosić sandały” zwykle znaczy mieć je na nogach. Greckie βαστάσαι w tym miejscu oznacza nosić w sensie nieść/dźwigać; „nieść jego sandałów” usuwa niezamierzoną dwuznaczność.
  - severity: low
    issue: Rozluźnienie względnej konstrukcji „οὗ ... τὰ ὑποδήματα”
    rationale: Oddzielne zdanie „Nie jestem godny nosić...” pozwala domyślić się odniesienia, ale „którego sandałów nie jestem godny nieść” wyraźniej zachowuje składnię i zależność źródłową.
  - severity: low
    issue: Wielkie litery w zaimkach odnoszonych do zapowiadanego mężczyzny
    rationale: Grecki nie rozróżnia tu wielkości liter w sposób teologiczny. Małe litery nie wprowadzają interpretacyjnej konwencji i są neutralne w polskim tekście narracyjnym.
