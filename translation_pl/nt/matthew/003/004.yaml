id: MAT.3.4
reference: Matthew 3:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: pl
  text: Sam Jan nosił ubranie z wielbłądziej sierści[a][b] i skórzany pas wokół talii. Jego pokarmem były szarańcze i dziki miód.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Strój Jana przypomina wygląd proroka Eliasza opisany w 2 Krl 1:8; jest to ważne tło sposobu, w jaki Mateusz przedstawia Jana.
    reason: cross_reference
  - marker: b
    text: 'Można też oddać: „miał ubranie z wielbłądziej sierści”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Sam Jan
  rationale: αὐτός ma tu wartość emfatyczną, oddaną przez „sam”; δέ jest łagodnym łącznikiem, którego nie trzeba mechanicznie wyrażać na początku polskiego zdania.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: nosił ubranie
  rationale: Dosłownie konstrukcja mówi, że Jan „miał” ubranie, lecz w tym opisie naturalny polski czasownik „nosił” trafnie wyraża trwały lub zwyczajowy stan i nie sugeruje zlecenia wykonania stroju.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: z wielbłądziej sierści
  rationale: ἀπό wskazuje tutaj materiał; „z wielbłądziej sierści” jest naturalnym i precyzyjnym polskim odpowiednikiem.
- source_word: ζώνην δερματίνην
  choice: skórzany pas
  rationale: ζώνη oznacza pas lub przepaskę, a δερματίνην określa materiał. „Skórzany pas” jest jasne we współczesnej polszczyźnie.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: wokół bioder
  rationale: ὀσφύς może oznaczać biodra, lędźwie lub okolice pasa. „Wokół bioder” zachowuje obraz źródłowy bez archaicznego brzmienia „wokół lędźwi”.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: Jego pokarmem były
  rationale: Oddaje rzeczownik τροφή oraz grecką konstrukcję orzecznikową w zwięzłej, godnej i naturalnej polszczyźnie.
- source_word: ἀκρίδες
  choice: szarańcze
  rationale: Jest to zwykłe leksykalne znaczenie greckiego wyrazu, odnoszące się do owadów; tekst nie daje podstaw do zastępowania go nazwą rośliny.
- source_word: μέλι ἄγριον
  choice: dziki miód
  rationale: Naturalny polski odpowiednik miodu pozyskiwanego w stanie dzikim.
theological_decisions:
- issue: Prorocka surowość stroju i możliwe nawiązanie do Eliasza
  choice: Zachować prosty opis stroju i pożywienia, a nawiązanie do Eliasza wskazać wyłącznie w przypisie.
  alternative: Wprowadzić do tekstu głównego słownictwo wyraźniej utożsamiające Jana z Eliaszem.
  rationale: Grecki tekst opisuje wygląd i dietę Jana, nie objaśniając wprost ich znaczenia. Przekład nie powinien rozstrzygać relacji typologicznej w samym tekście.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. Składnia została podzielona na dwa zdania dla naturalności, bez utraty relacji między dwiema częściami greckiego opisu. Uniknięto archaizmu „lędźwie” oraz interpretacyjnego dopowiadania związku Jana z Eliaszem.
