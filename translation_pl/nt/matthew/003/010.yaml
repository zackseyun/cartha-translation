revisions:
- from: Już teraz siekiera jest przyłożona do korzenia drzew. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone do ognia.
  to: A już siekiera leży przy korzeniu drzew. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone do ognia.
  rationale: Wprowadzono niewielką korektę pierwszego zdania, aby dokładniej oddać κέῖται jako położenie siekiery, a nie czynność jej przykładania. Zachowano liczbę pojedynczą „korzeniu” zgodną z greckim τὴν ῥίζαν oraz liczbę mnogą „drzew”. Nie dodano przypisu, ponieważ w polskim wariant „leży/jest położona” nie wymaga objaśnienia i nie zachodzi sporny problem tekstowy.
