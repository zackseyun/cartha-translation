review_pass:
  verdict: revise
  source_fidelity: Grecki tekst przedstawia siekierę jako już znajdującą się przy korzeniu drzew (κέῖται), a następnie wnioskuje o losie każdego drzewa niewydającego dobrego owocu. Druga część przekładu wiernie oddaje stronę bierną i obraz bez dopowiadania natury „ognia”. „Jest przyłożona” jest możliwe w kontekście, lecz sugeruje bardziej czynność przykładania lub dociśnięcia niż statyczne „leży/jest położona”.
  naturalness: „Już teraz” jest zrozumiałe, ale w połączeniu z obrazem gotowej siekiery brzmi nieco ciężej niż zwięzłe „A już”. „Leży przy korzeniu drzew” jest współczesne, naturalne i zachowuje obrazowy styl wypowiedzi.
  terminology: „Siekiera”, „wydaje dobry owoc”, „wycięte” oraz „wrzucone do ognia” są trafne i zachowują rejestr prorockiej metafory. Nie należy utożsamiać ognia z konkretną doktrynalną interpretacją.
  issues:
  - severity: low
    issue: „jest przyłożona” jako odpowiednik κεῖται
    rationale: κέῖται oznacza przede wszystkim „leży, znajduje się, jest położona”. „Jest przyłożona” może sugerować aktywne przystawienie siekiery do korzenia; „leży przy” dokładniej zachowuje statyczny obraz i nie osłabia jego groźby.
  - severity: low
    issue: „Już teraz” dla ἤδη
    rationale: Jest dopuszczalne, ale „już” wystarczająco oddaje ἤδη; dodatek „teraz” nie jest konieczny. Początkowe „A” może zarazem łagodnie odzwierciedlić łączące δέ.
  revised_text: A już siekiera leży przy korzeniu drzew. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone do ognia.
