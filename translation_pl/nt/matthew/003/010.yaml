  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: pl
  text: A już siekiera leży przy korzeniu drzew. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone do ognia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Już teraz
  rationale: Oddaje czasową pilność ἤδη, a łagodnie łączące δέ pozostaje naturalnie zawarte w toku polskiego zdania bez wymuszonego osobnego spójnika.
- source_word: ἡ ἀξίνη
  choice: siekiera
  rationale: Standardowy, współczesny polski odpowiednik narzędzia do ścinania, zachowujący obraz sądu.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: jest przyłożona do korzenia drzew
  rationale: Naturalnie oddaje położenie siekiery już gotowej do użycia; liczba pojedyncza „korzenia” odpowiada greckiemu ῥίζαν, a „drzew” zachowuje dopełniacz liczby mnogiej.
- source_word: πᾶν οὖν δένδρον
  choice: Każde więc drzewo
  rationale: „Więc” zachowuje wnioskowy charakter οὖν, nie nadając wypowiedzi nadmiernie formalnego brzmienia.
- source_word: μὴ ποιοῦν καρπὸν καλόν
  choice: które nie wydaje dobrego owocu
  rationale: Polskie „wydawać owoc” jest naturalnym odpowiednikiem czynności drzewa i zachowuje charakterystyczne, trwające działanie wyrażone imiesłowem.
- source_word: ἐκκόπτεται
  choice: zostaje wycięte
  rationale: W odniesieniu do drzewa „wyciąć” jasno oddaje usunięcie przez ścięcie; forma bierna zachowuje grecką stronę bierną.
- source_word: εἰς πῦρ βάλλεται
  choice: wrzucone do ognia
  rationale: Współczesne i bezpośrednie sformułowanie zachowujące siłę βάλλεται oraz nieobjaśniony obraz ognia.
theological_decisions:
- issue: Charakter obrazu ognia
  choice: Pozostawiono „do ognia” bez interpretacyjnego rozwinięcia.
  alternative: Doprecyzowanie jako sąd eschatologiczny, kara doczesna albo piekło.
  rationale: Tekst wyraźnie przedstawia obraz sądu, lecz sam nie precyzuje dokładnej natury ognia; przekład zachowuje tę teologiczną otwartość.
- issue: Aspekt czasowy sądu
  choice: „Już teraz” podkreśla obecną gotowość siekiery.
  alternative: Samo „już”, które może brzmieć mniej bezpośrednio.
  rationale: ἤδη wskazuje, że zagrożenie nie jest wyłącznie odległe; nie należy jednak dodawać twierdzenia, że wykonanie sądu już się dokonało.
translation_notes:
  register: Współczesny, godny i zrozumiały polski. Zachowano zwięzłość oraz siłę prorockiej metafory. Nie dodano przypisu, ponieważ „jest przyłożona” wystarczająco naturalnie obejmuje sens κεῖται („leży/jest położona”), a wariant nie zmienia istotnie znaczenia.
