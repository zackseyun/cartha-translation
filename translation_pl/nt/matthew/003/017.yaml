  source_fidelity: 'Sens deklaracji został oddany poprawnie: zachowano znacznik uwagi, liczbę mnogą „niebios”, tytuł „Syn” oraz biblijną formułę „w którym mam upodobanie”. Sformułowanie „z niebios rozległ się głos” jest jednak nieco mniej precyzyjne niż greckie „głos z niebios, mówiący”, ponieważ może opisywać samo rozleganie się dźwięku. „Odezwał się głos z niebios” wyraźniej wprowadza wypowiedź bez zmiany sensu.'
  naturalness: Rejestr jest godny i zrozumiały dla współczesnego odbiorcy. Zmiana szyku na „odezwał się głos z niebios” brzmi po polsku naturalnie oraz lepiej łączy rzeczownik „głos” z następującą mową bezpośrednią. Końcową kropkę należy umieścić wewnątrz polskiego cudzysłowu.
  terminology: „Mój umiłowany Syn” trafnie oddaje ὁ υἱός μου ὁ ἀγαπητός i właściwie zachowuje podniosły, tytułowy charakter wypowiedzi. „W którym mam upodobanie” jest utrwalonym, zrozumiałym polskim odpowiednikiem ἐν ᾧ εὐδόκησα; nie należy dopowiadać interpretacji teologicznej.
