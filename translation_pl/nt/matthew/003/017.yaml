    rationale: Grecki opisuje „głos z niebios” i zaraz potem zaznacza, że głos mówi. Polski zwrot „odezwał się głos z niebios” naturalniej i dokładniej oddaje tę funkcję, nie czyniąc przekładu dosłownym.
