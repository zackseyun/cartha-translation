  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: pl
  text: 'A oto odezwał się głos z niebios: „To jest mój umiłowany Syn, w którym mam upodobanie.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: A oto
  rationale: „A oto” naturalnie oddaje grecki znacznik dyskursu, który zwraca uwagę na doniosłe wydarzenie, zachowując przy tym uroczysty ton.
- source_word: φωνὴ ἐκ τῶν οὐρανῶν
  choice: z niebios rozległ się głos
  rationale: Konstrukcja z czasownikiem „rozległ się” jest naturalna po polsku i jasno przedstawia φωνή jako słyszalny, mówiący głos. „Niebiosa” zachowują liczbę mnogą greckiego οὐρανῶν.
- source_word: λέγουσα
  choice: 'rozległ się głos:'
  rationale: Grecki imiesłów wprowadza treść wypowiedzi. Dwukropek oraz polska konstrukcja idiomatyczna unikają niezręcznego „głos mówiący”, nie usuwając żadnej treści.
- source_word: Οὗτός ἐστιν
  choice: To jest
  rationale: Bezpośredni i naturalny polski odpowiednik identyfikacyjnej konstrukcji z zaimkiem wskazującym i łącznikiem.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mój umiłowany Syn
  rationale: „Umiłowany” zachowuje podniosły, a zarazem zrozumiały sens ἀγαπητός. Wielka litera w „Syn” sygnalizuje tytułowe odniesienie do Jezusa, nie dodając treści ponad kontekst.
- source_word: ἐν ᾧ εὐδόκησα
  choice: w którym mam upodobanie
  rationale: To bliski formie źródłowej i utrwalony w godnej polszczyźnie odpowiednik, który zachowuje konstrukcję ἐν ᾧ oraz deklarację Bożej przychylności. Czas teraźniejszy naturalnie wyraża aktualny stan wynikający z aorystycznej formuły εὐδόκησα.
theological_decisions:
- issue: Charakter deklaracji synostwa Jezusa
  choice: mój umiłowany Syn
  alternative: mój ukochany syn
  rationale: Przekład zachowuje wyraźne synostwo i uroczysty charakter Bożej deklaracji, ale nie dopowiada sposobu ani czasu tego synostwa.
- issue: Liczba mnoga οὐρανῶν
  choice: z niebios
  alternative: z nieba
  rationale: „Z niebios” zachowuje liczbę mnogą tekstu greckiego i dobrze pasuje do uroczystego rejestru; wariant pojedynczy byłby bardziej potoczny, lecz mniej formalnie zgodny ze źródłem.
- issue: Relacja wyrażona przez ἐν ᾧ
  choice: w którym mam upodobanie
  alternative: którego sobie upodobałem
  rationale: Wybrana wersja zachowuje dosłowną relację „w którym” i jej możliwy rezonans biblijny, zamiast sprowadzać ją wyłącznie do idiomatycznego wskazania przedmiotu aprobaty.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna o lekko uroczystym rejestrze, odpowiednim dla niebiańskiej deklaracji. Zachowano źródłową liczbę mnogą „niebios” oraz formalną konstrukcję „w którym mam upodobanie”, ponieważ obie brzmią naturalnie w polskim stylu biblijnym i nie wymagają przypisów.
