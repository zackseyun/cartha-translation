  terminology: „Wszelką sprawiedliwość” trafnie zachowuje Mattheuszową pojemność δικαιοσύνη i nie narzuca zawężenia do prawa ani konkretnej wykładni doktrynalnej. Przypis doprecyzowuje możliwy zakres terminu bez parafrazowania go jako jedynego sensu.
