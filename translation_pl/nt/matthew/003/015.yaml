  source_fidelity: Przekład wiernie oddaje kontrastowe δέ, prośbę Jezusa, czasowe ἄρτι, sens οὕτως, πρέπον, πληρῶσαι oraz szerokie πᾶσαν δικαιοσύνην. Końcowe ἀφίησιν wymaga jednak w polszczyźnie wyraźniejszego wskazania Jana jako podmiotu, ponieważ po wypowiedzi Jezusa sam zaimek może błędnie sugerować, że to Jezus udzielił pozwolenia.
