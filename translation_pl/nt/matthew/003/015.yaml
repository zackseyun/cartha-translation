base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: pl
  text: 'Lecz Jezus mu odpowiedział: „Pozwól na to teraz, bo w ten sposób godzi się nam wypełnić wszelką sprawiedliwość[a]”. Wtedy Jan mu pozwolił.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może oznaczać zarówno sprawiedliwość, jak i prawość; tutaj wskazuje szeroko na to, co jest zgodne z wolą Boga.
    reason: alternatywa_leksykalna
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Lecz Jezus mu odpowiedział
  rationale: Typową konstrukcję „odpowiadając, powiedział” oddano naturalnym polskim czasownikiem „odpowiedział”; δέ wskazuje na przeciwstawienie wobec sprzeciwu Jana z poprzedniego wersetu.
- source_word: Ἄφες ἄρτι
  choice: Pozwól na to teraz
  rationale: ἀφίημι oznacza tu zezwolenie na chrzest, nie przebaczenie ani odejście; ἄρτι wskazuje na obecną chwilę.
- source_word: οὕτως γὰρ
  choice: bo w ten sposób
  rationale: Wyrażenie wskazuje na właśnie omawiane działanie, czyli przyjęcie chrztu Jezusa z rąk Jana.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: godzi się nam
  rationale: „Godzi się” zachowuje sens tego, co stosowne i właściwe, a zarazem ma godny, naturalny rejestr biblijny.
- source_word: πληρῶσαι
  choice: wypełnić
  rationale: W Ewangelii Mateusza πληρόω często odnosi się do pełnego urzeczywistnienia Bożego zamysłu; „wypełnić” zachowuje to szersze brzmienie.
- source_word: πᾶσαν δικαιοσύνην
  choice: wszelką sprawiedliwość
  rationale: Dosłowne i zrozumiałe sformułowanie zachowuje szeroki zakres δικαιοσύνη jako zgodności z Bożą wolą, bez zawężania go wyłącznie do wymogów prawnych.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Wtedy mu na to pozwolił
  rationale: Powtórzenie „pozwolił” odzwierciedla ten sam grecki czasownik co na początku wypowiedzi. Grecki czas teraźniejszy historyczny naturalnie oddano polskim czasem przeszłym; podmiot wynika z kontekstu.
theological_decisions:
- issue: Znaczenie wyrażenia „wszelka sprawiedliwość”
  choice: Szerokie odniesienie do pełnego wykonania tego, co w tej sytuacji jest zgodne z Bożą sprawiedliwą wolą
  alternative: Wszystko, czego wymaga sprawiedliwość, rozumiane węziej jako ogół powinności
  rationale: Brzmienie greckie nie ogranicza sensu do przestrzegania prawa ani nie rozwija określonego systemu doktrynalnego. Dosłowniejsze wyrażenie zachowuje teologiczną pojemność tekstu.
translation_notes:
  register: Współczesny, godny polski z umiarkowanie podniosłym zwrotem „godzi się nam”. Zachowano zwięzłość i powtórzenie czasownika ἀφίημι. Nie dopisano imienia Jana w ostatnim zdaniu, ponieważ podmiot wynika z kontekstu, podobnie jak w grece.
