  source_fidelity: Przekład wiernie oddaje kontrastowe δέ („Lecz”), imperfectum διεκώλυεν jako próbę powstrzymania, imiesłów λέγων, idiom χρείαν ἔχω oraz bierne βαπτισθῆναι z osobowym wykonawcą wyrażonym przez ὑπὸ σοῦ. Retoryczne przeciwstawienie „ja — Ty” i pytanie końcowe zachowują sens oraz otwartość greckiego tekstu.
  naturalness: Tekst jest naturalny w standardowej współczesnej polszczyźnie, przy zachowaniu godnego rejestru biblijnego. Konstrukcja „potrzebuję być ochrzczony przez Ciebie” jest poprawna i precyzyjnie zachowuje stronę bierną oryginału.
  terminology: „Ochrzczony” i „ochrzcić” są właściwymi, utrwalonymi polskimi odpowiednikami βαπτίζω i nie rozstrzygają kwestii sposobu chrztu. Wielkie litery w zaimkach odnoszonych do Jezusa są dopuszczalną polską konwencją szacunku, bez wpływu na sens. Przypis poprawnie objaśnia możliwy ciągły lub iteratywny odcień imperfectum.
