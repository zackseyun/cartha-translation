id: MAT.3.14
reference: Matthew 3:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: pl
  text: 'Lecz Jan próbował Go powstrzymać[a], mówiąc: „To ja potrzebuję być ochrzczony przez Ciebie, a Ty przychodzisz do mnie?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Jan usiłował Go powstrzymać” albo „Jan powstrzymywał Go”. Grecka forma czasu przeszłego może wskazywać na trwającą lub ponawianą czynność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: próbował Go powstrzymać
  rationale: Imperfectum ukazuje trwającą próbę sprzeciwu. Polski zwrot „próbował powstrzymać” brzmi naturalnie i nie przesądza, czy chodziło o czynność powtarzaną, czy ciągłą; tę możliwość objaśnia przypis.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów zachowuje ścisły związek między próbą powstrzymania Jezusa a wypowiedzianym przez Jana uzasadnieniem.
- source_word: χρείαν ἔχω
  choice: potrzebuję
  rationale: Naturalny współczesny odpowiednik idiomu oznaczającego „mieć potrzebę”.
- source_word: ὑπὸ σοῦ
  choice: przez Ciebie
  rationale: Przy biernym bezokoliczniku wyrażenie ὑπό z dopełniaczem wskazuje osobowego wykonawcę czynności.
- source_word: βαπτισθῆναι
  choice: być ochrzczony
  rationale: Oddaje bierną formę czasownika bez zawężania sposobu dokonania chrztu.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: a Ty przychodzisz do mnie?
  rationale: „A” naturalnie wyraża retoryczny kontrast obecny w pytaniu, bez dodawania interpretacyjnego „jednak”.
- source_word: δὲ
  choice: Lecz
  rationale: Sygnalizuje kontrast wobec przyjścia Jezusa do Jana opisanego w poprzednim wersecie i zachowuje podniosły, lecz współczesny rejestr.
theological_decisions:
- issue: Sprzeciw Jana wobec ochrzczenia Jezusa
  choice: Wypowiedź oddano jako uznanie przez Jana własnej potrzeby przyjęcia chrztu od Jezusa oraz odwrócenia oczekiwanych ról.
  alternative: Wyjaśnić ją wprost jako stwierdzenie bezgrzeszności Jezusa albo wyłącznie jako wskazanie Jego wyższej rangi.
  rationale: Werset nie podaje pełnego teologicznego uzasadnienia sprzeciwu Jana. Przekład zachowuje jego napięcie i nie dopowiada późniejszych interpretacji.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej konwencji szacunku. Szyk pytania zachowuje nacisk na przeciwstawienie „ja — Ty”.
