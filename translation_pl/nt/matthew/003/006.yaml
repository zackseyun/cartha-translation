source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: pl
  text: i byli przez niego chrzczeni w rzece Jordan[a], wyznając swoje grzechy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „zostali ochrzczeni”; greckie imperfectum może podkreślać trwającą lub powtarzającą się czynność.'
    reason: Alternatywne oddanie aspektu czasownika ἐβαπτίζοντο.
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: byli chrzczeni
  rationale: Polski aspekt niedokonany naturalnie oddaje grecki imperfectum, wskazując na trwającą lub powtarzającą się czynność. Zachowano utrwalony termin „chrzcić”, ponieważ w tym kontekście βαπτίζω jest nazwą obrzędu, a sam werset nie rozstrzyga jego sposobu.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: w rzece Jordan
  rationale: Przyimek ἐν z celownikiem ma znaczenie miejscowe, a ποταμῷ wyraźnie określa Jordan jako rzekę. Szyk „w rzece Jordan” jest naturalny we współczesnej polszczyźnie i zachowuje rzeczownik obecny w grece.
- source_word: ὑπ’ αὐτοῦ
  choice: przez niego
  rationale: Ὑπό z dopełniaczem wskazuje osobowego wykonawcę czynności. Zaimek odnosi się w kontekście do Jana, lecz zachowanie formy zaimkowej nie dopowiada imienia w samym wersecie.
- source_word: ἐξομολογούμενοι
  choice: wyznając
  rationale: Imiesłów opisuje czynność równoczesną z chrztem i oznacza otwarte przyznawanie się do przewinień. „Wyznając” jest zwięzłym i idiomatycznym odpowiednikiem w kontekście pokuty.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: swoje grzechy
  rationale: Zaimek zwrotny „swoje” naturalnie odnosi posiadanie do podmiotu zdania, a liczba mnoga „grzechy” zachowuje formę tekstu greckiego.
- source_word: καὶ
  choice: i
  rationale: Prosty spójnik zachowuje łączność narracyjną z poprzednim wersetem bez nadawania mu dodatkowej funkcji interpretacyjnej.
theological_decisions:
- issue: Znaczenie terminologii chrztu
  choice: Zachowano „byli chrzczeni”, bez określania sposobu obrzędu.
  alternative: „byli zanurzani” lub „obmywali się”
  rationale: Werset mówi o chrzcie udzielanym przez Jana w Jordanie, ale sam nie definiuje jednoznacznie sposobu wykonania. Utrwalony termin „chrzcić” nie narzuca rozstrzygnięcia wyznaniowego.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Konstrukcja „byli chrzczeni” zachowuje stronę bierną i niedokonany charakter czynności; „wyznając swoje grzechy” jest naturalne i czytelne dla zwykłego odbiorcy.
