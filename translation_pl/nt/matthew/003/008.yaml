  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: pl
  text: Wydajcie więc owoc godny nawrócenia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „owoc odpowiadający nawróceniu” lub „owoc zgodny z nawróceniem”.'
    reason: Alternatywa leksykalna objaśniająca, że ἄξιον wyraża zgodność i stosowność, a nie zasługę.
lexical_decisions:
- source_word: ποιήσατε
  choice: Wydajcie
  rationale: Aoryst trybu rozkazującego w drugiej osobie liczby mnogiej wyraża stanowcze wezwanie. W połączeniu z obrazem owocu polskie „wydajcie” jest naturalniejsze niż dosłowne „uczyńcie” i zachowuje czynny charakter nakazu.
- source_word: οὖν
  choice: więc
  rationale: Spójnik wskazuje na wniosek wynikający z poprzedzającego wezwania i ostrzeżenia; „więc” oddaje tę zależność jasno i naturalnie.
- source_word: καρπὸν
  choice: owoc
  rationale: Zachowano liczbę pojedynczą oraz metaforę widocznego rezultatu w postępowaniu.
- source_word: ἄξιον
  choice: godny
  rationale: To bezpośredni odpowiednik przymiotnika oznaczającego coś stosownego lub odpowiadającego czemuś. Przypis objaśnia sens zgodności, aby sformułowanie nie sugerowało zasługiwania na nawrócenie.
- source_word: μετανοίας
  choice: nawrócenia
  rationale: W tym kontekście μετάνοια oznacza zasadniczą przemianę myślenia i kierunku życia w odpowiedzi na wezwanie Jana. „Nawrócenie” jest naturalnym, utrwalonym polskim określeniem, szerszym niż sama „zmiana zdania”.
theological_decisions:
- issue: Znaczenie wyrażenia καρπὸν ἄξιον τῆς μετανοίας
  choice: Postępowanie odpowiadające rzeczywistemu nawróceniu
  alternative: Postępowanie, które zasługuje na nawrócenie albo je zdobywa
  rationale: Konstrukcja z dopełniaczem wyraża stosowność lub zgodność. Nakaz dotyczy widocznego owocu nawrócenia, nie uczynków kupujących je lub powodujących.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Zachowano metaforę owocu, liczbę pojedynczą oraz bezpośrednią siłę rozkazu skierowanego do wielu osób.
