  source_fidelity: 'Przekład zasadniczo wiernie oddaje grekę: konstrukcję cząstkową („wielu spośród”), przybywanie ku chrztowi Jana, ostrzeżenie oraz obraz ucieczki przed przyszłym gniewem. Korekty wymaga forma aspektowa „żebyście uciekali”, która sugeruje czynność trwającą lub powtarzaną, podczas gdy grecki aorystowy bezokolicznik φυγεῖν przedstawia ucieczkę jako całościowy, nagły akt. Naturalniejsze i bliższe źródłu jest „aby uciec”.'
  naturalness: Tekst ma współczesny i godny rejestr. „Potomstwo żmij” jest poprawne, lecz jako bezpośrednia obelga brzmi nieco mniej idiomatycznie niż „Pomioty żmij”; nie jest to jednak konieczna zmiana. „Przychodzących na jego chrzest” jest w tym kontekście naturalniejsze niż „do jego chrztu” i nie przesądza przyjęcia chrztu.
  terminology: Nazwy „faryzeusze” i „saduceusze” oraz „gniew” są trafne. „Jego chrztu” może być poprawnie rozumiane jako chrzest Jana, ale w przypisie należy wyraźnie identyfikować Jana, ponieważ sam polski zaimek może być odczytany mniej jednoznacznie. Przypis b nie powinien przedstawiać „Pomiotów żmij” wyłącznie jako wariantu, jeśli jest to wybrana, bardziej idiomatyczna forma tekstu głównego.
