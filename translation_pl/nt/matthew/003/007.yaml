  to: 'Gdy zaś zobaczył wielu spośród faryzeuszów i saduceuszów przychodzących na jego chrzest[a], powiedział im: „Pomioty żmij, kto was ostrzegł, aby uciec przed nadchodzącym gniewem?”'
  rationale: Zmieniono „do jego chrztu” na naturalniejsze „na jego chrzest” oraz „żebyście uciekali” na „aby uciec”, aby oddać całościowy sens greckiego φυγεῖν. „Pomioty żmij” wybrano jako współczesne, ostre i idiomatyczne oddanie Γεννήματα ἐχιδνῶν. Usunięto przypis b, ponieważ po zmianie nie pełni już funkcji potrzebnego wariantu leksykalnego; zachowano przypis a i doprecyzowano jego odniesienie do Jana.
