  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: pl
  text: 'Gdy zaś zobaczył wielu spośród faryzeuszów i saduceuszów przychodzących na jego chrzest[a], powiedział im: „Pomioty żmij, kto was ostrzegł, aby uciec przed nadchodzącym gniewem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „do jego chrztu”. Grecki tekst mówi o przychodzeniu ku chrztowi Jana, nie stwierdzając tutaj wprost, że osoby te zostały ochrzczone.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Gdy zaś zobaczył
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym, a δέ jako „zaś”, zachowując tok narracji i lekki kontrast.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: wielu spośród faryzeuszów i saduceuszów
  rationale: „Spośród” wyraża konstrukcję cząstkową i nie sugeruje, że chodzi o wszystkich członków obu grup.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: przychodzących do jego chrztu
  rationale: Sformułowanie zachowuje ruch ku chrztowi sprawowanemu przez Jana, nie przesądzając, że osoby te rzeczywiście przyjęły chrzest.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Potomstwo żmij
  rationale: „Potomstwo” bezpośrednio oddaje γεννήματα, a całość zachowuje dosadność prorockiej nagany bez wprowadzania dodatkowej interpretacji.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: kto was ostrzegł
  rationale: W kontekście wezwania do ucieczki ὑποδείκνυμι ma sens ostrzegania lub wskazywania grożącego niebezpieczeństwa; „ostrzegł” brzmi naturalnie po polsku.
- source_word: φυγεῖν ἀπὸ
  choice: żebyście uciekali przed
  rationale: Oddaje obraz pilnej ucieczki zawarty w φυγεῖν; polskie „uciekać przed” jest naturalnym połączeniem.
- source_word: τῆς μελλούσης ὀργῆς
  choice: nadchodzącym gniewem
  rationale: „Nadchodzący” zachowuje przyszły, zbliżający się charakter μελλούσης, a „gniew” oddaje teologiczną wagę ὀργή bez łagodzenia jej do samej kary lub konsekwencji.
theological_decisions:
- issue: Zakres osób objętych naganą
  choice: Jan zwraca się do wielu spośród obecnych faryzeuszów i saduceuszów.
  alternative: Jan charakteryzuje w ten sposób wszystkich faryzeuszów i saduceuszów bez wyjątku.
  rationale: Grecka konstrukcja cząstkowa wskazuje na wielu należących do tych grup, nie na każdego ich członka.
- issue: Eschatologiczny sens ὀργή
  choice: gniew
  alternative: sąd lub kara
  rationale: „Gniew” zachowuje moc i teologiczne napięcie tekstu oraz nie zawęża pojęcia wyłącznie do wyroku czy kary.
- issue: Cel przybycia do chrztu
  choice: Tekst mówi, że przychodzili do chrztu Jana, bez stwierdzenia w tym wersecie, że go przyjęli.
  alternative: Przychodzili, aby na pewno zostać przez Jana ochrzczeni.
  rationale: Przyimek ἐπί wskazuje ukierunkowanie ku chrztowi lub wydarzeniu chrztu, ale sam nie rozstrzyga o jego przyjęciu.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano ostrą formę prorockiej nagany, unikając zarówno jej złagodzenia, jak i archaizacji. Nazwy grup zapisano zgodnie ze współczesną polską normą małą literą.
