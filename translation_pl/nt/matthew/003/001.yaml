  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: pl
  text: W tamtych dniach Jan Chrzciciel[a] przybył[b], głosząc na pustyni Judei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „Jan Chrzczący”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „pojawił się”. W grece użyto narracyjnego czasu teraźniejszego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: W tamtych dniach
  rationale: Przyimek ἐν z celownikiem wyraża czas. Łagodne δέ pełni funkcję przejścia narracyjnego i nie wymaga w tym miejscu osobnego polskiego spójnika.
- source_word: παραγίνεται
  choice: przybył
  rationale: Grecki czas teraźniejszy historyczny naturalnie oddano polskim czasem przeszłym. „Przybył” jasno wprowadza Jana na scenę, nie sugerując nadprzyrodzonego pojawienia się.
- source_word: Ἰωάννης
  choice: Jan
  rationale: Zastosowano utrwaloną polską postać imienia.
- source_word: ὁ βαπτιστὴς
  choice: Chrzciciel
  rationale: To utrwalony i naturalny w polszczyźnie przydomek Jana, zachowujący związek z czynnością chrzczenia.
- source_word: κηρύσσων
  choice: i głosił
  rationale: Imiesłów oznacza czynność współczesną z głównym czasownikiem. W polszczyźnie współrzędna konstrukcja osobowa brzmi naturalniej niż „przybył, głosząc”, a zachowuje sens ciągłego publicznego obwieszczania.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: na pustyni Judei
  rationale: ἔρημος oznacza odludny, niezamieszkany obszar, niekoniecznie piaszczystą pustynię. „Pustynia” jest jednak naturalnym i utrwalonym polskim określeniem tego regionu, a „Judei” zachowuje geograficzne odniesienie greckiego dopełniacza.
theological_decisions:
- issue: Oddanie przydomka βαπτιστής
  choice: Chrzciciel
  alternative: Chrzczący
  rationale: Jest to rozstrzygnięcie leksykalne, nie doktrynalne. „Chrzciciel” jest utrwalonym polskim przydomkiem Jana; wariant „Chrzczący” wyraźniej ukazuje czynność, lecz brzmi mniej naturalnie jako tytuł.
- issue: Sposób przedstawienia wejścia Jana na scenę
  choice: przybył
  alternative: pojawił się
  rationale: Oba warianty mieszczą się w zakresie παραγίνομαι. Wybrano neutralne „przybył”, aby nie sugerować nagłego ani cudownego pojawienia się; alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Szyk z podmiotem przed orzeczeniem ułatwia naturalne rozmieszczenie przypisów. Konstrukcja „i głosił” idiomatycznie oddaje grecki imiesłów współczesny, bez zmiany relacji czasowej.
