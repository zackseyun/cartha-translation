  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: pl
  text: Wtedy wychodzili do niego ludzie z Jerozolimy, z całej Judei i z całej okolicy nad Jordanem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Określenia „cała Judea” i „cała okolica nad Jordanem” są szerokimi określeniami geograficznymi, opisującymi rozległy odzew; nie muszą oznaczać każdego mieszkańca bez wyjątku.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik czasu, łączący reakcję ludzi z opisaną wcześniej działalnością Jana.
- source_word: ἐξεπορεύετο
  choice: wychodzili
  rationale: Grecka forma imperfectum wskazuje na trwające lub powtarzające się wychodzenie; polski czasownik niedokonany zachowuje ten aspekt.
- source_word: πρὸς αὐτόν
  choice: do niego
  rationale: Przy czasowniku ruchu wyraża kierunek ku osobie, tutaj ku Janowi.
- source_word: Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: mieszkańcy Jerozolimy, całej Judei i całej okolicy nad Jordanem
  rationale: Nazwy miejsc występują metonimicznie jako podmiot zbiorowy. Dodanie słowa „mieszkańcy” daje naturalne zdanie po polsku, nie zmieniając geograficznego zakresu wypowiedzi.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: cała okolica nad Jordanem
  rationale: „Okolica” naturalnie oddaje περίχωρος, a „nad Jordanem” idiomatycznie określa tereny położone wokół rzeki.
theological_decisions:
- issue: Zakres określeń „cała Judea” i „cała okolica nad Jordanem”
  choice: Zachować szerokie określenia geograficzne i objaśnić ich zbiorowy charakter w przypisie.
  alternative: Parafrazować jako „ludzie z Jerozolimy, Judei i okolic Jordanu”.
  rationale: Tekst podkreśla rozległość odzewu na działalność Jana, ale zwyczajna funkcja takich uogólnień nie wymaga rozumienia, że chodzi o każdego mieszkańca bez wyjątku.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Liczba mnoga „wychodzili” jawnie oddaje metonimiczny sens nazw miejsc, natomiast niedokonany aspekt czasownika zachowuje trwający lub powtarzalny charakter greckiego imperfectum.
