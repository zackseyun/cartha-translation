  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: pl
  text: 'To bowiem jest ten, o którym powiedziano przez proroka Izajasza:


    „Głos wołającego na pustkowiu[a]:


    Przygotujcie drogę Pana[b],


    prostujcie jego ścieżki”.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwy też podział: „Głos wołającego: Na pustkowiu przygotujcie drogę Pana…”.'
    reason: ambiguity
  - marker: b
    text: 'Można też oddać: „PANA”. Cytat nawiązuje do Izajasza 40:3, gdzie tekst hebrajski ma imię Boże YHWH.'
    reason: divine_name_background
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: To właśnie o nim
  rationale: Zwrot wskazuje na Jana Chrzciciela i objaśnia poprzednie zdanie. „Właśnie” naturalnie oddaje emfatyczny charakter formuły identyfikującej, a związek przyczynowo-objaśniający γάρ wynika po polsku z toku wypowiedzi.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: powiedziano przez proroka Izajasza
  rationale: Strona bierna zachowuje formułę odwołania do proroctwa, a „przez” oddaje διά z dopełniaczem jako pośrednictwo proroka.
- source_word: Φωνὴ βοῶντος
  choice: Głos wołającego
  rationale: Zachowuje zwięzłą, poetycką konstrukcję grecką i starotestamentowe brzmienie cytatu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: na pustkowiu
  rationale: „Pustkowie” naturalnie określa niezamieszkany obszar związany z działalnością Jana, bez zawężania obrazu wyłącznie do piaszczystej pustyni.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Przygotujcie drogę Pana
  rationale: Tryb rozkazujący i metafora drogi zostały zachowane. „Pan” bezpośrednio oddaje greckie κυρίου.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: prostujcie jego ścieżki
  rationale: Naturalny polski imperatyw zachowuje obraz czynienia ścieżek prostymi oraz osobowy zaimek αὐτοῦ.
theological_decisions:
- issue: Oddanie κυρίου w cytacie z Izajasza 40:3, gdzie tekst hebrajski zawiera imię YHWH
  choice: Pana
  alternative: PANA
  rationale: Tekst grecki Ewangelii ma κυρίου, dlatego tekst główny mówi „Pana”. Przypis zachowuje istotne tło hebrajskiego imienia Bożego bez narzucania go greckiemu brzmieniu zdania.
- issue: Związek wyrażenia „na pustkowiu” z wołaniem albo z przygotowaniem drogi
  choice: '„Głos wołającego na pustkowiu: Przygotujcie…”'
  alternative: '„Głos wołającego: Na pustkowiu przygotujcie…”'
  rationale: Grecki ciąg wyrazów bez pierwotnej interpunkcji dopuszcza oba podziały. Kontekst działalności Jana sprzyja tekstowi głównemu, lecz alternatywne powiązanie odpowiada składni hebrajskiego Izajasza 40:3 i zostaje zachowane w przypisie.
translation_notes:
  register: Współczesny, podniosły język polski z zachowaniem poetyckiego układu cytatu. Zastosowano „pustkowie” zamiast węższego „pustynia”. Zaimek „jego” zapisano małą literą zgodnie ze współczesną neutralną praktyką przekładową; wielka litera nie występuje w tekście źródłowym.
