  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: pl
  text: Aram spłodził Aminadaba, Aminadab spłodził Nachszona, a Nachszon spłodził Salmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Imię oddano bezpośrednio według greckiej formy Ἀράμ. Polski zapis „Aram” jest zarazem utrwalony i nie wymaga wariantu w przypisie.
- source_word: δὲ
  choice: zaś / a / pominięcie przy zachowaniu połączenia składniowego
  rationale: W rodowodzie δέ posuwa wyliczenie naprzód, nie wyrażając mocnego przeciwstawienia. Zróżnicowanie spójników zapobiega sztucznej monotonii, a zachowuje ciągłość genealogii.
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W kontekście genealogicznym czasownik oznacza zrodzenie lub ustanowienie linii pochodzenia przez mężczyznę. „Był ojcem” brzmi naturalnie i godnie we współczesnej polszczyźnie, bez archaizmu formy „zrodził”.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Zastosowano utrwaloną polską postać imienia biblijnego.
- source_word: Ναασσών
  choice: Naasson
  rationale: Zastosowano utrwaloną w polskiej tradycji biblijnej formę odpowiadającą greckiemu Ναασσών.
- source_word: Σαλμών
  choice: Salmon
  rationale: Imię oddano jako „Salmon”, zgodnie z rozpoznawalną polską formą biblijną i greckim brzmieniem.
