  source_fidelity: Konstrukcja „był ojcem” poprawnie wskazuje relację genealogiczną, lecz nie oddaje w pełni aorystycznego ἐγέννησεν („spłodził/zrodził”). W tym krótkim, powtarzalnym rodowodzie można to wiernie i idiomatycznie oddać przez „spłodził”.
