id: MAT.1.8
reference: Matthew 1:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: pl
  text: Asaf zaś był ojcem Jozafata[a], Jozafat był ojcem Jorama, a Joram był ojcem Ozjasza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy mają „Asa” zamiast „Asaf”; imię „Asa” odpowiada też królowi Judy wymienionemu w genealogii Starego Testamentu.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Zachowano formę imienia obecną w tekście greckim SBLGNT, bez cichego uzgadniania jej ze starotestamentowym imieniem Asa; wariant i tło genealogiczne podano w przypisie.
- source_word: δὲ
  choice: zaś / a
  rationale: W genealogii δέ jest łagodnym spójnikiem kontynuującym wywód, a nie wyraźnym przeciwstawieniem. Zróżnicowane polskie odpowiedniki pozwalają zachować tok zdań bez sztucznego powtarzania.
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: Naturalny, współczesny polski zwrot genealogiczny. Zachowuje relację ojcowskiego pochodzenia, unikając archaicznego „zrodził” i biologicznie niezręcznego w dzisiejszej polszczyźnie „spłodził”.
- source_word: Ἰωσαφάτ
  choice: Jozafat
  rationale: Utrwalona polska forma biblijnego imienia króla Judy.
- source_word: Ἰωράμ
  choice: Joram
  rationale: Forma bliska greckiemu Ἰωράμ i utrwalona w polskiej tradycji biblijnej.
- source_word: Ὀζίαν
  choice: Ozjasz
  rationale: Utrwalona i rozpoznawalna polska forma imienia króla Judy, odpowiadająca postaci znanej ze Starego Testamentu.
theological_decisions:
- issue: Oddanie powtarzających się δὲ i ἐγέννησεν w szeregu genealogicznym
  choice: Zachować każdą relację ojciec–syn, ujmując ją w naturalne polskie zdanie z formułą „był ojcem”.
  alternative: 'Powtarzać dosłowniej: „zrodził”, z δέ każdorazowo oddanym jako „a”.'
  rationale: Decyzja ma charakter stylistyczny, nie doktrynalny. Wybrane brzmienie zachowuje pełny ciąg genealogiczny, a zarazem pozostaje naturalne i zrozumiałe we współczesnej polszczyźnie.
- issue: Czy uzgodnić Ἀσὰφ z oczekiwanym historycznym imieniem Asa
  choice: Pozostawić „Asaf” w tekście głównym, a „Asa” podać w przypisie.
  alternative: Wprowadzić „Asa” do tekstu głównego na podstawie starotestamentowej genealogii lub wariantu rękopiśmiennego.
  rationale: Pierwszeństwo tekstu źródłowego wymaga zachowania greckiej formy poświadczonej w przyjętej edycji. Przypis przejrzyście sygnalizuje wariant oraz zgodność imienia Asa ze starotestamentowym rodowodem, bez cichej harmonizacji.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja „był ojcem” brzmi naturalniej w dzisiejszej polszczyźnie niż archaiczne „zrodził”. Imiona podano w utrwalonych polskich formach biblijnych, z wyjątkiem „Asaf”, gdzie zachowano istotną formę greckiego tekstu głównego.
