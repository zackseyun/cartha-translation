id: MAT.1.12
reference: Matthew 1:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: pl
  text: Po przesiedleniu do Babilonu[a] Jechoniasz został ojcem Salatiela, a Salatiel został ojcem Zorobabela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „po wygnaniu do Babilonu”. Greckie słowo odnosi się do przymusowego przesiedlenia ludności na wygnanie babilońskie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Po
  rationale: μετά z biernikiem wyraża następstwo czasowe. Łagodne δέ nie wymaga osobnego oddania w naturalnej polszczyźnie.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: przesiedleniu do Babilonu
  rationale: μετοικεσία oznacza przeniesienie ludności, tutaj przymusowe przesiedlenie prowadzące do niewoli babilońskiej. „Przesiedlenie” zachowuje nacisk na samo wydarzenie, a przypis podaje tradycyjną alternatywę.
- source_word: Ἰεχονίας
  choice: Jechoniasz
  rationale: Użyto utrwalonej polskiej biblijnej postaci imienia.
- source_word: ἐγέννησεν
  choice: został ojcem
  rationale: W formule genealogicznej γεννάω wskazuje na ojcostwo lub pochodzenie w linii męskiej. Naturalne polskie wyrażenie nie przesądza o bezpośredniości każdego ogniwa genealogii.
- source_word: Σαλαθιήλ
  choice: Salatiel
  rationale: Użyto rozpoznawalnej, utrwalonej w polskiej tradycji biblijnej postaci imienia.
- source_word: δὲ
  choice: a
  rationale: Spójnik naturalnie łączy kolejne ogniwo genealogii; polskie „a” dobrze oddaje łagodne przejście bez kontrastu.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Użyto standardowej polskiej biblijnej postaci imienia.
theological_decisions:
- issue: Znaczenie γεννάω w genealogii
  choice: „został ojcem” jako konwencjonalna formuła pochodzenia w linii genealogicznej
  alternative: „zrodził” lub „spłodził”, mogące sugerować bezpośrednie biologiczne ojcostwo
  rationale: Ewangeliczne genealogie mogą ujmować linię rodową skrótowo. Przekład zachowuje relację ojcowsko-rodową, lecz nie narzuca większej bezpośredniości niż wymaga tego gatunek.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano rytm genealogii przez powtórzenie formuły „został ojcem” oraz tradycyjne polskie formy imion biblijnych.
