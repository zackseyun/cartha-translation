  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: pl
  text: A Józef, jej mąż[a], będąc człowiekiem sprawiedliwym i nie chcąc wystawić jej na publiczną hańbę[b], zamierzał potajemnie się z nią rozwieść[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „jej narzeczony”. Dosłownie: „jej mąż”; żydowskie zaręczyny tworzyły prawnie wiążącą relację.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „uczynić z niej publiczny przykład” albo „publicznie ją zniesławić”.'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „potajemnie ją oddalić” lub „odesłać”. W tym kontekście chodzi o formalne rozwiązanie prawnie wiążącego związku w okresie zaręczyn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: jej mąż
  rationale: W kontekście prawnie wiążących zaręczyn ἀνήρ określa Józefa jako męża Maryi; naturalny polski odpowiednik zachowuje prawny charakter ich więzi.
- source_word: δίκαιος
  choice: człowiek sprawiedliwy
  rationale: Oddaje moralny i religijny wydźwięk δίκαιος bez rozstrzygania, czy nacisk pada na przestrzeganie Prawa, miłosierdzie, czy oba te aspekty.
- source_word: δειγματίσαι
  choice: wystawić ją na publiczną hańbę
  rationale: Wyraża publiczne ujawnienie połączone ze wstydem; jest zrozumiałe i zachowuje siłę greckiego czasownika.
- source_word: ἐβουλήθη
  choice: postanowił
  rationale: Wskazuje na rozważony zamiar lub decyzję, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: λάθρᾳ
  choice: potajemnie
  rationale: Oddaje działanie skryte, niepubliczne; wariant „dyskretnie” byłby bardziej interpretacyjny.
- source_word: ἀπολῦσαι αὐτήν
  choice: się z nią rozwieść
  rationale: W realiach żydowskich zaręczyn chodzi o formalne rozwiązanie prawnie wiążącej relacji, nie tylko o odesłanie Maryi.
- source_word: δὲ
  choice: A
  rationale: Łagodnie rozwija narrację i naturalnie łączy ten werset z poprzednim.
- source_word: ὢν καὶ μὴ θέλων
  choice: był ... i nie chciał ... dlatego
  rationale: Naturalna polska składnia jasno ukazuje okoliczności prowadzące do decyzji Józefa, choć relacja logiczna pozostaje zależna od kontekstu zdania.
theological_decisions:
- issue: Charakterystyka Józefa jako δίκαιος
  choice: „człowiek sprawiedliwy” bez doprecyzowania rodzaju tej sprawiedliwości
  alternative: „prawy” albo parafraza podkreślająca wyłącznie przestrzeganie Prawa lub miłosierdzie
  rationale: Grecki tekst zestawia sprawiedliwość Józefa z niechęcią do publicznego pohańbienia Maryi. Przekład zachowuje napięcie między prawością a miłosierną powściągliwością.
- issue: Status prawny Józefa i Maryi
  choice: W tekście głównym „mąż” oraz „rozwieść się”
  alternative: „narzeczony” oraz „zerwać zaręczyny” albo dosłowne „odesłać”
  rationale: Żydowskie zaręczyny miały moc prawną i wymagały formalnego rozwiązania. Wybrane określenia jasno przekazują to współczesnemu czytelnikowi, a etap relacji i dosłowniejszy wariant podają przypisy.
- issue: Związek składniowy imiesłowów z decyzją Józefa
  choice: 'Oddany jako tło i motywacja decyzji: „był... i nie chciał..., dlatego postanowił”'
  alternative: 'Ściślej formalne: „będąc... i nie chcąc..., postanowił”'
  rationale: Polska forma osobowa jest bardziej naturalna. Nie rozstrzyga przy tym szczegółowo, jak sprawiedliwość Józefa odnosiła się do jego zamiaru, poza związkiem wskazanym przez grecką składnię.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano biblijne określenie „sprawiedliwy”, unikając archaicznej konstrukcji „będąc sprawiedliwym”. Przypisy objaśniają prawny charakter zaręczyn i alternatywne odcienie kluczowych czasowników.
