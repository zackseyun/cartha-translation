  source_fidelity: 'Sens zasadniczo oddano wiernie: Józef jest nazwany mężem, jego sprawiedliwość i niechęć do publicznego pohańbienia Maryi są zachowane, podobnie jak prawny sens ἀπολῦσαι. Jednak „dlatego” czyni relację między imiesłowami a decyzją wyraźnie przyczynowo-skutkową, choć greka przedstawia ją jako tło/okoliczność i nie wymaga takiego dopowiedzenia. „Postanowił” jest możliwe, ale „zamierzał” bliżej oddaje ἐβουλήθη jako rozważony zamiar.'
  naturalness: Tekst jest naturalny i ma odpowiedni, współczesny rejestr biblijny. Konstrukcja z imiesłowami w proponowanej rewizji pozostaje zrozumiała, a zarazem wierniej zachowuje składnię oryginału.
  terminology: „Mąż”, „sprawiedliwy”, „publiczna hańba” i „rozwieść się” są trafne. Przypis dotyczący ἀπολῦσαι warto sformułować jako alternatywę przekładową, nie jako dosłowność całej polskiej frazy, oraz wyjaśnić prawny charakter rozstania w czasie zaręczyn.
