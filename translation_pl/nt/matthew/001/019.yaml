  to: A Józef, jej mąż[a], będąc człowiekiem sprawiedliwym i nie chcąc wystawić jej na publiczną hańbę[b], zamierzał potajemnie się z nią rozwieść[c].
  rationale: Usunięto dodane „dlatego”, aby nie narzucać bardziej określonej relacji logicznej niż w grece, a „postanowił” zastąpiono bliższym semantycznie „zamierzał”. Doprecyzowano też przypis o ἀπολῦσαι, zachowując zarówno dosłowniej brzmiące alternatywy, jak i prawny sens rozwodu w okresie zaręczyn.
