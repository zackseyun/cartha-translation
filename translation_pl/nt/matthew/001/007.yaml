  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: pl
  text: Salomon był ojcem Roboama, Roboam był ojcem Abiasza, a Abiasz był ojcem Asafa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy mają tu „Asa”, zgodnie z imieniem króla Judy wymienionego w 1 Krl 15 oraz 2 Krn 14–16; przyjęty tutaj tekst grecki ma „Asaf”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W rodowodzie czasownik γεννάω opisuje męskie pochodzenie. Zwrot „był ojcem” jest naturalny we współczesnej polszczyźnie, zachowuje sens genealogiczny i unika archaicznego „spłodził”.
- source_word: δὲ
  choice: a
  rationale: W tym szeregu genealogicznym δέ jest łagodnym spójnikiem kontynuującym wyliczenie, a nie przeciwstawieniem. Polskie „a” naturalnie łączy kolejne ogniwa.
- source_word: Σολομών
  choice: Salomon
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: Ῥοβοάμ
  choice: Roboam
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: Ἀβιά
  choice: Abiasz
  rationale: Utrwalona polska forma imienia króla Judy, zapewniająca rozpoznawalność i ciągłość z nazewnictwem Starego Testamentu.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Podany tekst grecki ma formę Ἀσάφ, dlatego tekst główny zachowuje imię Asaf zamiast harmonizować je z imieniem króla Asy.
theological_decisions:
- issue: Czy zharmonizować rodowód Mateusza ze starotestamentową listą królów, oddając Ἀσάφ jako „Asa”
  choice: Zachować „Asaf” w tekście głównym
  alternative: Oddać imię jako „Asa”
  rationale: Pierwszeństwo ma podany tekst grecki, który brzmi Ἀσάφ. Oczekiwaną na podstawie 1 Krl 15 oraz 2 Krn 14–16 formę „Asa” podano w przypisie, aby jawnie zachować wariant tekstowy i napięcie genealogiczne.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Powtarzalna konstrukcja „był ojcem” odtwarza rytm rodowodu bez archaizacji. Marker przypisu umieszczono bezpośrednio przy imieniu, którego dotyczy wariant.
