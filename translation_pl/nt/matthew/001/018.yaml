source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: pl
  text: 'Narodzenie Jezusa Mesjasza[a] nastąpiło w ten sposób: gdy jego matka Maria była zaręczona z Józefem[b], zanim zamieszkali razem[c], okazało się, że jest w ciąży z Ducha Świętego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „Jezusa Chrystusa”. Greckie Χριστός jest tytułem oznaczającym „Mesjasza”.'
    reason: alternative_reading
  - marker: b
    text: Ówczesne zaręczyny były formalnym, prawnie uznawanym zobowiązaniem, bardziej wiążącym niż współczesne zaręczyny.
    reason: cultural_note
  - marker: c
    text: Zwrot „zanim zamieszkali razem” może odnosić się do rozpoczęcia wspólnego życia małżeńskiego, w tym do dopełnienia małżeństwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: narodzenie
  rationale: W tym kontekście termin wprowadza opis narodzenia Jezusa. „Narodzenie” jest naturalne po polsku i dobrze odpowiada dalszej narracji.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jezusa Mesjasza
  rationale: Χριστός pełni tu funkcję tytułu; „Mesjasz” przekazuje jego znaczenie, zamiast traktować go jak nazwisko.
- source_word: οὕτως ἦν
  choice: nastąpiło w ten sposób
  rationale: Zwrot zapowiada sposób, w jaki doszło do opisywanego wydarzenia. Takie sformułowanie jest jasne i współczesne.
- source_word: μνηστευθείσης
  choice: była zaręczona
  rationale: „Zaręczona” jest zrozumiałym współczesnym odpowiednikiem, a przypis wyjaśnia, że ówczesne zaręczyny miały mocniejszy charakter prawny niż obecnie.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: zanim się zeszli
  rationale: Zachowuje dyskretny i nieco wieloznaczny idiom grecki, który w kontekście może obejmować rozpoczęcie wspólnego życia małżeńskiego i jego dopełnienie.
- source_word: εὑρέθη
  choice: okazało się
  rationale: Naturalny polski odpowiednik strony biernej w tym kontekście, bez wskazywania osoby, która dokonała odkrycia.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: jest w ciąży
  rationale: To naturalny, współczesny polski odpowiednik idiomu oznaczającego ciążę.
- source_word: ἐκ πνεύματος ἁγίου
  choice: z Ducha Świętego
  rationale: Przyimek ἐκ wskazuje źródło lub pochodzenie; tradycyjne i nadal zrozumiałe polskie „z Ducha Świętego” zachowuje ten sens.
theological_decisions:
- issue: Oddanie Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym miejscu słowo działa jako tytuł i dlatego przełożono jego znaczenie. Alternatywę podano w przypisie, nie narzucając rozstrzygnięcia ponad tekst.
- issue: Odniesienie πνεύματος ἁγίου
  choice: Duch Święty
  alternative: duch święty
  rationale: Kontekst Mateuszowej opowieści wskazuje na Bożego Ducha Świętego; brak rodzajnika w grece nie wymaga odczytania nieokreślonego.
- issue: Zakres znaczeniowy συνελθεῖν
  choice: zeszli się
  alternative: zamieszkali razem / podjęli współżycie małżeńskie
  rationale: Zachowano dyskretną wieloznaczność greckiego zwrotu, nie ograniczając go wyłącznie do wspólnego zamieszkania ani wyłącznie do współżycia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tytuł „Mesjasz”, dyskretny idiom dotyczący związku Marii i Józefa oraz źródłowy sens wyrażenia „z Ducha Świętego”.
