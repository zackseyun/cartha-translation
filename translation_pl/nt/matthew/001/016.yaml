id: MAT.1.16
reference: Matthew 1:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: pl
  text: Jakub zaś był ojcem Józefa, męża Marii, z której narodził się Jezus, zwany Mesjaszem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Spójnik lekko posuwa rodowód naprzód; „zaś” zachowuje jego funkcję łączącą bez wprowadzania silnego przeciwstawienia.
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W kontekście rodowodu wyrażenie oznacza ojcostwo i pochodzenie. „Był ojcem” brzmi naturalnie we współczesnej polszczyźnie i unika zarówno archaicznego „zrodził”, jak i nazbyt biologicznego „spłodził”.
- source_word: τὸν ἄνδρα Μαρίας
  choice: męża Marii
  rationale: W połączeniu z dopełniaczem imienia ἀνήρ oznacza tutaj męża, nie po prostu mężczyznę.
- source_word: ἐξ ἧς
  choice: z której
  rationale: Żeński zaimek względny jednoznacznie odnosi się do Marii, a przyimek ἐκ oddano przez „z”. Zachowuje to celowe odejście od powtarzanej formuły męskiej linii rodowodu.
- source_word: ἐγεννήθη
  choice: narodził się
  rationale: Strona bierna czasownika γεννάω odnosi się tu idiomatycznie do narodzin Jezusa. Polski czasownik „narodził się” zachowuje zmianę względem wcześniejszej formuły genealogicznej.
- source_word: ὁ λεγόμενος
  choice: zwany
  rationale: Imiesłów identyfikuje Jezusa za pomocą noszonego przez niego tytułu; „zwany” jest zwięzłym i naturalnym polskim odpowiednikiem.
- source_word: χριστός
  choice: Mesjaszem
  rationale: W formule „zwany…” wyraz funkcjonuje wyraźnie jako tytuł, dlatego oddano jego znaczenie jako „Mesjasz”, zamiast używać formy imiennej „Chrystus”.
theological_decisions:
- issue: Oddanie Χριστός w formule identyfikującej Jezusa
  choice: zwany Mesjaszem
  alternative: zwany Chrystusem
  rationale: Χριστός występuje tutaj jako tytuł. Przekład „Mesjasz” ukazuje jego sens, nie dodając interpretacji wykraczającej poza tekst.
- issue: Zmiana formuły genealogicznej przy narodzeniu Jezusa
  choice: Jakub jest nazwany ojcem Józefa, natomiast Jezus narodził się z Marii
  alternative: Ujednolicenie obu członów jako kolejnych relacji ojciec–syn
  rationale: Greka przechodzi od czynnego ἐγέννησεν do ἐγεννήθη oraz żeńskiego ἐξ ἧς. Przekład zachowuje tę zmianę i nie stwierdza, że Józef był biologicznym ojcem Jezusa.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie podniosłym rejestrze. Konstrukcja „z której” zachowuje ścisłe odniesienie do Marii, a „był ojcem” zapewnia naturalność bez archaizacji.
