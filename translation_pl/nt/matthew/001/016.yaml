  source_fidelity: 'Przekład wiernie oddaje strukturę grecką: Jakub pozostaje podmiotem czynnej formuły genealogicznej wobec Józefa, natomiast o Jezusie mówi się odmiennie — że „narodził się” z Marii. Żeński zaimek „z której” jasno odnosi się do Marii i zachowuje celową zmianę konstrukcji w tekście źródłowym.'
