id: MAT.1.17
reference: Matthew 1:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: pl
  text: Tak więc wszystkich pokoleń od Abrahama do Dawida było czternaście, od Dawida do przesiedlenia do Babilonu — czternaście, a od przesiedlenia do Babilonu do Mesjasza[a] — czternaście.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Chrystusa”. Greckie χριστός jest tutaj tytułem oznaczającym Mesjasza.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Tak więc wszystkich pokoleń
  rationale: „Tak więc” oddaje podsumowująco-wnioskującą funkcję οὖν, a „wszystkich pokoleń” zachowuje Πᾶσαι oraz genealogiczny sens γενεαί.
- source_word: ἀπὸ ... ἕως
  choice: od ... do
  rationale: Naturalnie i precyzyjnie wyznacza kolejne przedziały genealogii.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: przesiedlenia do Babilonu
  rationale: μετοικεσία oznacza przymusowe przesiedlenie lub deportację; sformułowanie wskazuje zarówno wydarzenie, jak i jego kierunek, bez zawężania go jedynie do późniejszego stanu niewoli.
- source_word: τοῦ χριστοῦ
  choice: Mesjasza
  rationale: Rodzajnik i kulminacyjna pozycja w genealogii wskazują, że χριστός pełni tu funkcję tytułu; „Mesjasz” przekazuje jego znaczenie w naturalnej współczesnej polszczyźnie.
- source_word: γενεαὶ δεκατέσσαρες
  choice: czternaście [pokoleń]
  rationale: W pierwszym członie rzeczownik zostaje wyrażony wprost, a w dwóch następnych naturalna polska elipsa oraz pauzy zachowują rytmiczną, trójdzielną strukturę greckiego zdania.
theological_decisions:
- issue: Oddanie tytułu Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym miejscu jest to tytuł stanowiący punkt kulminacyjny genealogii, dlatego przekład znaczeniowy „Mesjasz” jest trafniejszy; tradycyjną formę „Chrystus” podano w przypisie.
translation_notes:
  register: Współczesny, godny i czytelny rejestr. Powtórzona konstrukcja „od… do…” oraz trzy wystąpienia liczby czternaście zachowują formalny rytm podsumowania genealogii; myślniki sygnalizują elipsę bez sztucznego powtarzania słowa „pokoleń”.
source_grounding:
  english_pob_role: consult_only
