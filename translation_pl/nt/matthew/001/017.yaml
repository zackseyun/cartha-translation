  source_fidelity: Przekład wiernie oddaje podsumowujące οὖν („Tak więc”), zakres trzech odcinków genealogii, trzykrotną liczbę czternastu pokoleń oraz sens μετοικεσία Βαβυλῶνος jako przesiedlenia/deportacji do Babilonu. „Mesjasza” trafnie przekłada tytularne τοῦ χριστοῦ.
  naturalness: Zdanie jest poprawne, współczesne i czytelne. Konstrukcja „wszystkich pokoleń ... było czternaście” jest w polszczyźnie naturalnym sposobem wyrażenia sumy, a elipsa „pokoleń” w dalszych członach, podkreślona pauzami, zachowuje rytm greckiego podsumowania bez zbędnych powtórzeń.
  terminology: Imiona i nazwa miejsca są zgodne ze standardową polską tradycją biblijną. „Mesjasz” jako przekład χριστός jest właściwy w tym kontekście; przypis uczciwie podaje tradycyjną alternatywę „Chrystusa”.
