id: MAT.1.9
reference: Matthew 1:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: pl
  text: Ozjasz został ojcem Jotama[a], Jotam zaś został ojcem Achaza, a Achaz został ojcem Ezechiasza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ἐγέννησεν tradycyjnie tłumaczy się jako „zrodził” lub „spłodził”; tutaj użyto współczesnego odpowiednika „został ojcem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ozjasz
  rationale: Standardowa polska forma biblijnego imienia króla Judy, odpowiadająca greckiej formie Ὀζίας i hebrajskiemu imieniu znanemu ze Starego Testamentu.
- source_word: δὲ
  choice: zaś / a
  rationale: W rodowodzie δέ jest łagodnym spójnikiem rozwijającym wyliczenie. Warianty „zaś” i „a” zachowują rytm, a zarazem pozwalają uniknąć nienaturalnej monotonii.
- source_word: ἐγέννησεν
  choice: został ojcem
  rationale: W formule genealogicznej czasownik oznacza ojcostwo i następstwo rodu. „Został ojcem” jest jasnym, współczesnym i godnym odpowiednikiem, mniej archaicznym niż „zrodził” lub „spłodził”.
- source_word: Ἰωαθάμ
  choice: Jotam
  rationale: Utrwalona polska forma biblijnego imienia króla Judy.
- source_word: Ἀχάζ
  choice: Achaz
  rationale: Utrwalona polska forma biblijnego imienia, zgodna z polską tradycją nazewniczą.
- source_word: Ἑζεκίαν
  choice: Ezechiasz
  rationale: Utrwalona polska forma biblijnego imienia króla Judy.
theological_decisions:
- issue: Zakres genealogiczny czasownika γεννάω
  choice: „został ojcem” — bez rozszerzania na „był przodkiem”
  alternative: „był przodkiem” / „zrodził” / „spłodził”
  rationale: Tekst przedstawia kolejne relacje ojcostwa za pomocą powtarzalnej formuły. Przekład zachowuje to bez wprowadzania do tekstu głównego interpretacyjnego uogólnienia, choć genealogie biblijne mogą pomijać niektóre pokolenia.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Powtórzenie „został ojcem” zachowuje schemat genealogii, natomiast naprzemienne „zaś” i „a” zapewnia płynność polskiego zdania.
