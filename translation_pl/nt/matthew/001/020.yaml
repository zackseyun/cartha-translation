id: MAT.1.20
reference: Matthew 1:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: pl
  text: 'Gdy zaś to rozważał, oto anioł Pana ukazał mu się we śnie i powiedział: „Józefie, synu Dawida, nie bój się przyjąć do siebie Maryję, twoją żonę[a], ponieważ to, co się w niej poczęło, pochodzi od Ducha Świętego”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wziąć Maryję za żonę”. Greckie wyrażenie odnosi się do przyjęcia jej do swojego domu w ramach małżeństwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: rozważał
  rationale: Oddaje trwający namysł Józefa, nie sugerując, że podjął już ostateczną decyzję.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje wyrazisty znacznik narracyjny w naturalnej, podniosłej polszczyźnie.
- source_word: ἄγγελος κυρίου
  choice: anioł Pana
  rationale: Brak rodzajnika przy ἄγγελος nie wskazuje jednoznacznie na szczególnego, określonego anioła; polskie „anioł Pana” wiernie zachowuje konstrukcję dopełniaczową.
- source_word: κατ’ ὄναρ
  choice: we śnie
  rationale: Naturalny polski odpowiednik greckiego wyrażenia idiomatycznego.
- source_word: ἐφάνη
  choice: ukazał mu się
  rationale: Standardowe i naturalne określenie objawieniowego pojawienia się.
- source_word: υἱὸς Δαυίδ
  choice: synu Dawida
  rationale: Wołacz odpowiada bezpośredniemu zwrotowi i zachowuje znaczenie genealogiczne oraz dawidowe.
- source_word: μὴ φοβηθῇς
  choice: nie bój się
  rationale: Współczesny i bezpośredni polski odpowiednik zakazu.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: przyjąć do siebie Marii, swojej żony
  rationale: W tekście głównym forma fleksyjna brzmi „przyjąć do siebie Marię, swoją żonę”; oddaje przyjęcie Marii do domu w ramach małżeństwa, nie przesądzając, że dopiero w tej chwili uzyskałaby status żony.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: to, co się w niej poczęło
  rationale: Naturalnie oddaje prenatalny sens imiesłowu γεννηθέν, a zaimek „to, co” zachowuje jego urzeczownikową, nijaką formę.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: pochodzi od Ducha Świętego
  rationale: Jasno oddaje źródło lub pochodzenie wyrażone przez ἐκ; „Duch Święty” funkcjonuje jako osobowe określenie.
theological_decisions:
- issue: Znaczenie κυρίου w wyrażeniu ἄγγελος κυρίου
  choice: Pana
  alternative: JHWH / anioł Pański jako ustalony tytuł
  rationale: Przekład „anioł Pana” zachowuje zwykłe znaczenie κύριος i nie narzuca utożsamienia anioła z teofanią.
- issue: Odniesienie πνεύματός ... ἁγίου
  choice: Ducha Świętego
  alternative: świętego ducha / mocy Ducha Świętego
  rationale: W kontekście narracji Mateusza wyrażenie wskazuje na Ducha Świętego jako boskiego sprawcę, nie na bezosobową moc ani nieokreślonego ducha.
- issue: Status Marii w παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: Marii, swojej żony
  alternative: Marii za żonę
  rationale: Apozycja τὴν γυναῖκά σου nazywa Marię żoną Józefa. Przekład główny nie sugeruje zmiany statusu, natomiast przypis zachowuje idiomatyczną alternatywę związaną z dopełnieniem małżeństwa przez przyjęcie jej do domu.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie podniosłym tonie. Zachowano narracyjne „oto” oraz dawidowe określenie Józefa, a konstrukcję dotyczącą Marii przełożono tak, by nie zacierać napięcia między istniejącym statusem małżeńskim a przyjęciem jej do domu.
