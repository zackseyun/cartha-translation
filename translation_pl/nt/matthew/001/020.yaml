  to: 'Gdy zaś to rozważał, oto anioł Pana ukazał mu się we śnie i powiedział: „Józefie, synu Dawida, nie bój się przyjąć do siebie Maryję, twoją żonę[a], ponieważ to, co się w niej poczęło, pochodzi od Ducha Świętego”.'
  rationale: Poprawiono wymagany biernik imienia oraz oddano wprost drugą osobę greckiego zaimka σου. Przypis przeniesiono przy pełny zwrot, którego dotyczy alternatywne tłumaczenie; zachowuje on informację o idiomie małżeńskim bez zmiany sensu tekstu głównego.
