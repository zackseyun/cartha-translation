  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: pl
  text: Księga rodowodu[a] Jezusa, Mesjasza[b], syna Dawida, syna Abrahama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Księga pochodzenia” lub „Księga narodzenia”. Grecki wyraz ma szerszy sens związany z początkiem i pochodzeniem, choć następujący dalej wykaz przodków przemawia za „rodowodem”.'
    reason: alternative_reading
  - marker: b
    text: 'Możliwe też tradycyjne: „Jezusa Chrystusa”. Greckie Χριστός jest tytułem oznaczającym „Pomazańca”, czyli Mesjasza.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Księga
  rationale: Rzeczownik może oznaczać księgę, zwój lub zapis. W nagłówku „Księga” zachowuje zwięzły, uroczysty charakter oryginału.
- source_word: γενέσεως
  choice: rodowodu
  rationale: Wyraz może oznaczać pochodzenie, narodzenie lub rodowód. Bezpośrednio następujący wykaz przodków przemawia za „rodowodem”, natomiast szerszy zakres znaczeniowy zachowano w przypisie.
- source_word: Ἰησοῦ
  choice: Jezusa
  rationale: Zastosowano utrwaloną polską formę imienia własnego w dopełniaczu, zgodnie ze składnią zdania.
- source_word: χριστοῦ
  choice: Mesjasza
  rationale: Χριστός jest tu tytułem oznaczającym Pomazańca. „Mesjasz” uwydatnia tytularny i żydowski kontekst tego określenia; tradycyjne „Chrystus” podano w przypisie.
- source_word: υἱοῦ Δαυὶδ
  choice: syna Dawida
  rationale: Dosłowne sformułowanie zachowuje utrwalony tytuł mesjański i królewskie znaczenie związku z Dawidem, choć „syn” oznacza tutaj również potomka.
- source_word: υἱοῦ Ἀβραάμ
  choice: syna Abrahama
  rationale: Dosłowny idiom genealogiczny zachowuje związek Jezusa z Abrahamem i płynącą z tekstu wagę przymierza; w kontekście chodzi o potomka.
theological_decisions:
- issue: Sposób oddania Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym nagłówku określenie pełni funkcję tytułu, dlatego „Mesjasz” najczytelniej przekazuje sens Pomazańca. Tradycyjną formę zachowano jako wariant w przypisie.
- issue: Zakres znaczeniowy γενέσεως
  choice: rodowód
  alternative: pochodzenie lub narodzenie
  rationale: Rodowód rozpoczynający się w następnym wersecie wskazuje na podstawowy sens genealogiczny, ale grecki wyraz dopuszcza szersze odniesienie do początku, pochodzenia lub narodzenia; tej wieloznaczności nie należy usuwać.
translation_notes:
  register: Współczesny, zrozumiały język polski z zachowaniem zwięzłości i uroczystego charakteru nagłówka. Powtórzenie „syna” odtwarza paralelną budowę greckiego tekstu i nie zastępuje teologicznie nośnego idiomu słowem „potomka”.
