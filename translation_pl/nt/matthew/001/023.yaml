id: MAT.1.23
reference: Matthew 1:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: pl
  text: 'Oto dziewica[a] pocznie i urodzi syna, i nazwą go Emmanuelem[b] — co w tłumaczeniu znaczy: „Bóg z nami”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „młoda kobieta”. Alternatywa wiąże się z dyskusją nad tekstem Iz 7,14; w greckim tekście Mateusza użyto słowa παρθένος.'
    reason: lexical_alternative
  - marker: b
    text: Spotyka się też zapis „Immanuel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Naturalny, podniosły polski wykładnik zwrócenia uwagi, dobrze pasujący do cytatu prorockiego.
- source_word: ἡ παρθένος
  choice: dziewica
  rationale: W grece Mateusza termin ten oznacza dziewicę, a bezpośredni kontekst opisu narodzenia przedstawia poczęcie jako nadzwyczajne.
- source_word: ἐν γαστρὶ ἕξει
  choice: pocznie
  rationale: Idiomy grecki dosłownie mówi o „posiadaniu w łonie”; „pocznie” jest zwięzłym i naturalnym odpowiednikiem.
- source_word: τέξεται υἱόν
  choice: urodzi syna
  rationale: Współczesne i godne sformułowanie, wiernie oddające narodzenie dziecka płci męskiej.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: nazwą go imieniem
  rationale: Zachowuje nieokreślony podmiot trzeciej osoby liczby mnogiej, zamiast zastępować go stroną bierną.
- source_word: Ἐμμανουήλ
  choice: Emmanuel
  rationale: Utrwalona w polskiej tradycji biblijnej transliteracja imienia obecnego w greckim tekście.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: co w tłumaczeniu znaczy
  rationale: Naturalnie oddaje objaśniający imiesłów i sygnalizuje podanie znaczenia imienia.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Bóg z nami
  rationale: Zwięzły, utrwalony i semantycznie wierny przekład objaśnienia imienia.
theological_decisions:
- issue: Znaczenie παρθένος w wersecie dotyczącym dziewiczego poczęcia
  choice: dziewica
  alternative: młoda kobieta
  rationale: Mateusz używa greckiego παρθένος w kontekście wcześniejszego stwierdzenia, że Maryja poczęła bez współżycia z Józefem. Przekład główny powinien więc brzmieć „dziewica”; alternatywa wynika z dyskusji nad hebrajskim tekstem Iz 7:14, nie z naturalnego sensu greki Mateusza.
- issue: Teologiczna wymowa objaśnienia imienia Emmanuel
  choice: Bóg z nami
  alternative: Z nami jest Bóg
  rationale: Zachowano samo objaśnienie podane przez ewangelistę, bez rozwijania go w dodatkową interpretację chrystologiczną.
translation_notes:
  register: Język współczesny, zwięzły i godny. „Oto” zachowuje prorocki ton cytatu, a nieokreślone „nazwą” wiernie oddaje grecką trzecią osobę liczby mnogiej.
