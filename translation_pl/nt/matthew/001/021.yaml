  terminology: '„Jezus”, „zbawi” i „swój lud” są właściwe. Przypis należy doprecyzować: Jeszua i Jozue są imionami pokrewnymi, lecz nie należy bez zastrzeżenia utożsamiać Jeszuy z polską formą „Jozue”.'
