source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: pl
  text: Urodzi syna, a ty nadasz mu imię Jezus[a], bo On zbawi swój lud od ich grzechów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Imię Jezus jest grecką formą imienia Jeszua, pokrewnego hebrajskiemu imieniu Jehoszua (Jozue), i wiąże się ze znaczeniem „Jahwe zbawia”. Słowa „bo On zbawi” nawiązują do znaczenia tego imienia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: urodzi
  rationale: Forma przyszła czasownika τίκτω w kontekście narodzin. Polskie „urodzi” jest naturalne, zwięzłe i zachowuje zapowiedź przyszłego wydarzenia.
- source_word: δὲ
  choice: —
  rationale: δέ jest łagodnym spójnikiem dyskursywnym; w polszczyźnie jego osobne oddanie na początku zdania byłoby zbędne i mogłoby usztywnić wypowiedź.
- source_word: υἱὸν
  choice: syna
  rationale: W polskim zdaniu „urodzi syna” rzeczownik bez rodzajnika jest naturalny i odpowiada greckiemu υἱόν.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: nadasz mu imię
  rationale: Naturalny współczesny polski odpowiednik semicko-greckiej formuły nadania imienia; zachowuje wyraźne odniesienie do imienia, istotne dla następującego objaśnienia.
- source_word: Ἰησοῦν
  choice: Jezus
  rationale: Utrwalona polska forma imienia nowotestamentowego. Związek z hebrajskim lub aramejskim Jeszua zostaje objaśniony w przypisie.
- source_word: αὐτὸς
  choice: 'On'
  rationale: 'Osobny, zapisany wielką literą zaimek zachowuje obecny w grece nacisk na podmiot: właśnie Jezus będzie sprawcą zbawienia. Nie dodano wzmacniającego „sam”, które mogłoby brzmieć w polszczyźnie bardziej wyłącznie niż tekst grecki.'
- source_word: γὰρ
  choice: bo
  rationale: Wprowadza uzasadnienie nadania imienia. „Bo” jest naturalnym i precyzyjnym polskim spójnikiem wyjaśniającym.
- source_word: σώσει
  choice: zbawi
  rationale: W połączeniu z „ludem” i „grzechami” czasownik σῴζω ma tutaj sens zbawienia, a nie jedynie doraźnego ratunku.
- source_word: τὸν λαὸν αὐτοῦ
  choice: swój lud
  rationale: Zachowuje relację przynależności bez zawężania tego ludu wyłącznie do Izraela ani rozszerzania go w samym przekładzie na całą ludzkość.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: od jego grzechów
  rationale: ἀπό wyraża uwolnienie lub oddzielenie od grzechów. Polski zaimek w liczbie pojedynczej zgadza się gramatycznie ze zbiorowym rzeczownikiem „lud”, a liczba mnoga „grzechów” zachowuje formę grecką.
theological_decisions:
- issue: Nacisk wyrażony przez αὐτός w odniesieniu do zbawczego działania Jezusa
  choice: „On zbawi” z osobnym zaimkiem podmiotowym
  alternative: „zbawi” albo „On sam zbawi”
  rationale: Polski zwykle pomija zaimek osobowy, dlatego jego jawne użycie zachowuje grecki nacisk. Jednocześnie rezygnacja z „sam” pozwala uniknąć dodania sugestii wyłączności silniejszej niż samo αὐτός.
- issue: Zakres wyrażenia „swój lud”
  choice: Pozostawiono „swój lud” bez dodatkowego określenia
  alternative: „swój lud, Izraela” albo „wszystkich, którzy do Niego należą”
  rationale: Werset nie definiuje tutaj dokładniej zakresu tego wyrażenia. Przekład zachowuje jego przymierzowe brzmienie i nie rozstrzyga w samym tekście szerszej interpretacji kanonicznej.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zastosowano naturalną formułę „nadasz mu imię”, zachowano nacisk greckiego αὐτός przez jawne „On” oraz pozostawiono bez doprecyzowania zakres wyrażenia „swój lud”.
