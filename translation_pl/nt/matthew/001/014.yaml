  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Imię własne oddano zgodnie z utrwaloną polską formą biblijną.
- source_word: δέ
  choice: a
  rationale: W rodowodzie δέ pełni funkcję prostego łącznika. Polskie „a” naturalnie spaja ostatni człon sekwencji, natomiast wcześniejsze wystąpienia pozostają niewyrażone, zgodnie z idiomatyczną polszczyzną.
- source_word: ἐγέννησεν
  choice: spłodził
  rationale: W kontekście genealogii czasownik oznacza męskie zrodzenie lub pochodzenie rodowe. „Spłodził” jest zwięzłym, współczesnym i precyzyjnym odpowiednikiem.
- source_word: τὸν
  choice: (nieprzetłumaczone osobno)
  rationale: Grecki rodzajnik w bierniku oznacza dopełnienie bliższe przed imieniem własnym; w tej konstrukcji polszczyzna nie wymaga jego osobnego odpowiednika.
- source_word: Σαδώκ
  choice: Sadok
  rationale: Zastosowano utrwaloną polską formę imienia biblijnego.
- source_word: Ἀχίμ
  choice: Achim
  rationale: Zastosowano utrwaloną polską formę imienia biblijnego.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Zastosowano utrwaloną polską formę imienia biblijnego.
