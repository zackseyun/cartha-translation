source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: pl
  text: Zorobabel zaś był ojcem Abiuda[a], Abiud był ojcem Eliakima, a Eliakim był ojcem Azora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „stał się ojcem Abiuda”. W biblijnych rodowodach powtarzana formuła może przedstawiać linię pochodzenia w sposób skrócony.'
    reason: Alternatywa leksykalna i zachowanie możliwej kompresji genealogii.
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Przyjęto utrwaloną polską formę imienia biblijnego, zgodną z polską tradycją nazewniczą i odpowiadającą greckiej formie.
- source_word: δέ
  choice: zaś / a
  rationale: W szeregu genealogicznym δέ jest łagodnym spójnikiem rozwijającym wyliczenie, bez wyraźnego przeciwstawienia. Polskie „zaś” i „a” zachowują płynny, kumulatywny tok.
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W genealogii czasownik oznacza relację ojcostwa lub pochodzenia. Zwrot „był ojcem” jest naturalny we współczesnej polszczyźnie, zachowuje męską linię genealogiczną i nie przesądza, że każde ogniwo musi oznaczać bezpośrednie następstwo pokoleń.
- source_word: Ἀβιούδ
  choice: Abiud
  rationale: Zastosowano ustaloną polską postać imienia, będącą czytelną transliteracją greckiego Ἀβιούδ.
- source_word: Ἐλιακίμ
  choice: Eliakim
  rationale: Zastosowano utrwaloną polską postać imienia, bliską greckiemu brzmieniu.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Imię oddano w prostej, utrwalonej polskiej formie bez znaków transliteracyjnych.
theological_decisions:
- issue: Znaczenie genealogicznego czasownika γεννάω w rodowodzie, który może pomijać niektóre pokolenia
  choice: był ojcem
  alternative: zrodził; stał się ojcem; był przodkiem
  rationale: „Był ojcem” zachowuje formułę genealogiczną i naturalność współczesnej polszczyzny, nie rozstrzygając, czy każda wymieniona relacja jest bezpośrednia. „Był przodkiem” zbyt jednoznacznie interpretowałoby możliwą kompresję rodowodu, a „zrodził” jest we współczesnym języku mniej naturalne w odniesieniu do mężczyzny.
translation_notes:
  register: Język współczesny, prosty i godny. Powtórzenie „był ojcem” odtwarza rytm greckiego rodowodu, a zróżnicowanie spójników zapobiega sztuczności w polszczyźnie.
