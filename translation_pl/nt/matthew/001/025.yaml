  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: pl
  text: Nie współżył z nią[a], dopóki nie urodziła syna[b]. I nadał mu imię Jezus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „nie poznawał jej”. Grecki czasownik „poznawać” został tu użyty jako eufemizm oznaczający współżycie seksualne.'
    reason: lexical_alternative
  - marker: b
    text: Słowo „dopóki” określa, co było prawdą do narodzin Jezusa; samo w sobie nie rozstrzyga, co wydarzyło się później.
    reason: alternative_reading
  - marker: c
    text: 'Dosłowniej według greckiej konstrukcji: „nazwał jego imię Jezus”. Po polsku ten zwrot naturalnie znaczy: „nadał mu imię Jezus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: nie współżył
  rationale: W tym kontekście γινώσκω („poznawać”) jest eufemizmem oznaczającym stosunki seksualne. Dosłowne „nie poznawał jej” byłoby we współczesnej polszczyźnie niejasne, dlatego sens idiomu oddano naturalnie, a jego formę objaśniono w przypisie.
- source_word: ἕως οὗ
  choice: dopóki nie
  rationale: Naturalny polski odpowiednik konstrukcji czasowej wyznaczającej okres trwający do narodzin; samo wyrażenie nie rozstrzyga, co nastąpiło później.
- source_word: ἔτεκεν
  choice: urodziła
  rationale: Zwykły, współczesny polski odpowiednik czasownika τίκτω w tym kontekście.
- source_word: υἱόν
  choice: syna
  rationale: Rzeczownik jest w grece bez rodzajnika; polska forma „syna” naturalnie nie dodaje nacisku ani określoności nieobecnych w tekście.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: nadał mu imię Jezus
  rationale: To naturalny polski sposób oddania semicko-greckiego zwrotu oznaczającego nadanie imienia, bez niezręcznego kopiowania jego składni.
- source_word: Ἰησοῦν
  choice: Jezus
  rationale: „Jezus” jest utrwaloną polską formą tego imienia w Nowym Testamencie.
theological_decisions:
- issue: Czy „dopóki” sugeruje późniejsze współżycie Maryi i Józefa
  choice: Pozostawiono zwykłą konstrukcję czasową „dopóki nie”, bez dopowiadania, co wydarzyło się później.
  alternative: Jedni odczytują to zdanie jako sugestię, że później rozpoczęli współżycie; inni uważają, że konstrukcja nie mówi nic o późniejszym stanie rzeczy.
  rationale: Greckie ἕως οὗ określa stan trwający do narodzin Jezusa, lecz samo nie przesądza o tym, co nastąpiło potem. Przypis zachowuje tę nierozstrzygniętą kwestię.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Wyrażenie „nie współżył z nią” jasno przekazuje sens greckiego eufemizmu, natomiast przypis zachowuje jego dosłowną postać. Podział na dwa zdania brzmi naturalnie po polsku i nie zmienia relacji między wydarzeniami.
