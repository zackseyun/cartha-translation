  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: pl
  text: Jozjasz zaś został ojcem Jechoniasza i jego braci w czasie przesiedlenia do Babilonu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „podczas wygnania do Babilonu” albo „w czasie deportacji do Babilonu”. Grecki termin oznacza przymusowe przesiedlenie lub wygnanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: został ojcem
  rationale: W rodowodzie czasownik γεννάω opisuje genealogiczne ojcostwo. „Został ojcem” jest naturalne we współczesnej polszczyźnie, zachowuje sens formuły i nie przesądza, czy w każdym ogniwie chodzi o bezpośrednie ojcostwo biologiczne.
- source_word: Ἰεχονίαν
  choice: Jechoniasza
  rationale: Forma „Jechoniasz” jest utrwalonym i rozpoznawalnym polskim odpowiednikiem greckiego Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: jego braci
  rationale: Grecki rzeczownik ma rodzaj męski i liczbę mnogą; „braci” oddaje go precyzyjnie i naturalnie.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: w czasie przesiedlenia do Babilonu
  rationale: μετοικεσία oznacza przymusowe przeniesienie ludności, deportację lub wygnanie, a ἐπί z dopełniaczem ma tutaj sens czasowy. „Do Babilonu” naturalnie wyraża kierunek wskazany przez tę grecką konstrukcję.
- source_word: δὲ
  choice: zaś
  rationale: Łagodny spójnik kontynuujący wywód genealogiczny; „zaś” zachowuje jego obecność bez nadmiernego wzmacniania związku logicznego.
theological_decisions:
- issue: Skrócenie genealogii w rodowodzie Mateusza
  choice: Oddać podaną formułę genealogiczną bez rozstrzygania w tekście głównym pytań historycznych.
  alternative: Rozumieć γεννάω szerzej jako wskazanie pochodzenia od przodka, niekoniecznie bezpośredniego ojcostwa w każdym ogniwie.
  rationale: Grecki tekst przedstawia relację genealogiczną, lecz starożytne rodowody mogły pomijać pokolenia. Sformułowanie „został ojcem” zachowuje brzmienie tekstu i istniejące napięcie, nie dodając harmonizującego objaśnienia.
translation_notes:
  register: Nowoczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Zachowano spójnik „zaś” typowy dla uporządkowanej narracji genealogicznej; uniknięto archaicznego „zrodził”.
