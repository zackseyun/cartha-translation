id: MAT.1.6
reference: Matthew 1:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: pl
  text: Jesse był ojcem Dawida, króla. Dawid zaś był ojcem Salomona z żoną Uriasza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie po grecku: „z [kobiety] Uriasza”. Jest to eliptyczne określenie żony Uriasza. Mateusz nie wymienia tutaj Batszeby z imienia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W rodowodzie czasownik γεννάω opisuje ojcostwo i pochodzenie w linii męskiej. Zwrot „był ojcem” jest naturalny we współczesnej polszczyźnie i nie ma archaicznego brzmienia formy „spłodził”.
- source_word: βασιλέα
  choice: króla
  rationale: Rzeczownik z rodzajnikiem wyróżnia królewski status Dawida; apozycja „Dawida, króla” zachowuje to podkreślenie, nie zmieniając imienia w utarty tytuł „król Dawid”.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: którego matką była żona Uriasza
  rationale: 'Grecki zwrot jest eliptyczny: dosłownie „z [tej] Uriasza”, z domyślnym określeniem kobiety lub żony. Naturalne polskie sformułowanie jasno oddaje macierzyństwo, zachowuje odniesienie do Uriasza i nie dodaje imienia Batszeby.'
- source_word: Ἰεσσαί
  choice: Jesse
  rationale: Utrwalona polska forma imienia.
- source_word: Δαυίδ
  choice: Dawid
  rationale: Utrwalona polska forma imienia.
- source_word: Σολομῶνα
  choice: Salomon
  rationale: Utrwalona polska forma imienia.
- source_word: Οὐρίου
  choice: Uriasza
  rationale: Dopełniacz utrwalonej polskiej formy imienia Uriasz.
- source_word: δέ
  choice: zaś (w drugim zdaniu); pominięte w pierwszym
  rationale: δέ jest łagodnym spójnikiem porządkującym kolejne ogniwa rodowodu. W pierwszym zdaniu jego jawne oddanie byłoby po polsku ciężkie, natomiast w drugim „zaś” naturalnie zaznacza przejście do następnego pokolenia.
theological_decisions:
- issue: Pośrednie określenie Batszeby przez relację z Uriaszem
  choice: „żona Uriasza” bez podawania jej imienia
  alternative: „Batszeba” albo „ta, która była żoną Uriasza”
  rationale: Mateusz nie wymienia tej kobiety z imienia, lecz określa ją przez Uriasza. Przekład zachowuje ten literacki i moralny rezonans narracji, nie rozstrzygając ponad tekst, czy należy tu szczególnie podkreślić wcześniejszy stan małżeński.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Powtarzalna konstrukcja „był ojcem” odpowiada stylowi rodowodu, a zarazem unika archaicznego „spłodził”. Marker przypisu umieszczono bezpośrednio po wyrażeniu, którego przypis dotyczy.
