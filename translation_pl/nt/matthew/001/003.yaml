  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: pl
  text: Juda zaś z Tamar został ojcem Peresa i Zeracha, Peres został ojcem Chesrona, a Chesron został ojcem Arama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre przekłady mają tu imię „Ram”, odzwierciedlając odmienną tradycję lub transkrypcję; podany tekst grecki ma formę „Aram”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Juda
  rationale: W rodowodzie chodzi o patriarchę Judę; forma „Juda” jest utrwalona w polskiej tradycji biblijnej i odróżnia go od postaci Nowego Testamentu noszących imię Judasz.
- source_word: δὲ
  choice: zaś / a / pominięcie w płynnym szeregu
  rationale: Partykuła pełni tu funkcję łagodnego łącznika, nie wyraża mocnego przeciwstawienia. Zróżnicowanie polskich spójników pozwala zachować tok rodowodu bez sztucznej powtarzalności.
- source_word: ἐγέννησεν
  choice: został ojcem
  rationale: W kontekście genealogicznym czasownik oznacza ojcostwo lub pochodzenie w linii rodowej. „Został ojcem” jest współczesne, godne i naturalniejsze niż archaiczne „spłodził”.
- source_word: Φαρὲς
  choice: Peres
  rationale: Forma odpowiada hebrajskiemu פֶּרֶץ i zachowuje ciągłość z typowym polskim zapisem imienia w Starym Testamencie.
- source_word: Ζάρα
  choice: Zerach
  rationale: Forma odpowiada hebrajskiemu זֶרַח i zachowuje rozpoznawalny polski zapis starotestamentowego imienia.
- source_word: ἐκ τῆς Θαμάρ
  choice: z Tamar
  rationale: Przyimek ἐκ wskazuje tutaj pochodzenie od matki. Dosłowne i naturalne po polsku „z Tamar” zachowuje zwięzłość genealogii.
- source_word: Θαμάρ
  choice: Tamar
  rationale: Utrwalona polska forma biblijnego imienia.
- source_word: Ἑσρώμ
  choice: Chesron
  rationale: Forma odpowiada hebrajskiemu חֶצְרוֹן i utrzymuje spójność ze współczesnym polskim nazewnictwem starotestamentowym.
- source_word: Ἀράμ
  choice: Aram
  rationale: Przekład idzie bezpośrednio za podanym tekstem greckim Ἀράμ, bez harmonizowania go z formą znaną z innych przekazów genealogii.
theological_decisions:
- issue: Czy końcowe imię zharmonizować z formą spotykaną w starotestamentowym rodowodzie
  choice: Aram
  alternative: Ram
  rationale: Podany grecki tekst brzmi Ἀράμ, dlatego tekst główny zachowuje formę „Aram”. Wariant „Ram” podano w przypisie, aby ujawnić różnicę tradycji, a nie rozstrzygać jej przez milczącą harmonizację.
translation_notes:
  register: Współczesny, godny rejestr genealogiczny. Konstrukcja „został ojcem” jest czytelna dla zwykłego odbiorcy i unika zarówno archaizmu „spłodził”, jak i nadmiernie potocznego brzmienia. Marker przypisu umieszczono bezpośrednio po imieniu, którego dotyczy.
