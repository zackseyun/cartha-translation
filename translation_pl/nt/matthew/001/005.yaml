source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: pl
  text: Salmon zrodził Booza z Rachab[a], Booz zaś zrodził Obeda z Rut, a Obed zrodził Jessego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki tekst używa przyimka ἐκ („z”) zarówno przy Rachab, jak i przy Rut, wskazując na pochodzenie od wymienionej matki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: spłodził
  rationale: W rodowodzie czasownik oznacza przekazanie pochodzenia w linii ojcowskiej. „Spłodził” jest zwięzłym, utrwalonym odpowiednikiem genealogicznym i zachowuje czynny charakter greckiej formuły.
- source_word: ἐκ
  choice: z
  rationale: Przy imieniu matki przyimek wskazuje pochodzenie macierzyńskie. Polskie „z Rachab” i „z Rut” zachowuje tę relację bez dopisywania czasownika nieobecnego w tekście.
- source_word: δὲ
  choice: zaś / a
  rationale: δέ jest tu łagodnym spójnikiem kontynuującym wyliczenie, a nie przeciwstawieniem. Warianty „zaś” i „a” zapewniają naturalny rytm polskiego rodowodu.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Przyjęto utrwaloną polską postać imienia biblijnego.
- source_word: Βόες
  choice: Booz
  rationale: Utrwalona polska forma imienia postaci znanej ze Starego Testamentu sprzyja rozpoznawalności i ciągłości międzytestamentowej.
- source_word: Ῥαχάβ
  choice: Rachab
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Utrwalona polska forma hebrajskiego imienia znanego ze Starego Testamentu.
- source_word: Ῥούθ
  choice: Rut
  rationale: Standardowa polska forma imienia oraz nazwy księgi biblijnej.
- source_word: Ἰεσσαί
  choice: Jesse
  rationale: Utrwalona polska forma imienia ojca Dawida; w bierniku przyjmuje postać „Jessego”.
theological_decisions:
- issue: Formuła genealogiczna i wymienienie matek
  choice: Zachowano ojcowską formułę „spłodził”, a Rachab i Rut wskazano wyraźnie za pomocą „z”.
  alternative: „Był ojcem…, którego matką była…” albo „zrodził… z…”
  rationale: Grecki tekst celowo umieszcza imiona obu kobiet w formule ἐκ z dopełniaczem. Przekład zachowuje zarówno linię ojcowską, jak i wyraźne wskazanie pochodzenia macierzyńskiego, bez rozwijania tekstu interpretacyjną parafrazą.
translation_notes:
  register: Język współczesny, zwięzły i godny, zgodny ze stylem rodowodu. Zachowano utrwalone polskie formy imion oraz lekkie zróżnicowanie spójników, aby uniknąć nienaturalnej monotonii.
