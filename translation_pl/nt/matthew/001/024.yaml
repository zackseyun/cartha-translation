source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: pl
  text: Gdy Józef obudził się ze snu, uczynił tak, jak mu nakazał anioł Pana, i przyjął do siebie swoją żonę.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „wziął do siebie swoją żonę” lub „przyjął swoją żonę”. Grecki czasownik może oznaczać przyjęcie kogoś do własnego domu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: Gdy Józef obudził się ze snu
  rationale: Imiesłów aorystu wyznacza czynność poprzedzającą działanie Józefa. Polska konstrukcja czasowa brzmi naturalnie i zachowuje kolejność wydarzeń; δέ pełni tu funkcję łagodnego przejścia narracyjnego, którego nie trzeba oddawać osobnym spójnikiem.
- source_word: ἐποίησεν ὡς
  choice: uczynił tak, jak
  rationale: Oddaje zgodność działania Józefa z otrzymanym nakazem, zachowując podniosły, lecz współczesny rejestr.
- source_word: προσέταξεν
  choice: nakazał
  rationale: Czasownik oznacza wydanie wiążącego polecenia; „nakazał” trafnie zachowuje jego autorytatywną siłę.
- source_word: ὁ ἄγγελος κυρίου
  choice: anioł Pana
  rationale: Naturalny i utrwalony polski odpowiednik greckiego wyrażenia, zachowujący tytuł κύριος jako „Pan”.
- source_word: παρέλαβεν
  choice: przyjął do siebie
  rationale: παραλαμβάνω może oznaczać wzięcie lub przyjęcie kogoś do siebie. To sformułowanie dobrze oddaje aspekt przyjęcia żony do wspólnoty domowej, nie dopowiadając szczegółów ponad tekst.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: swoją żonę
  rationale: W kontekście prawno-małżeńskim γυνή oznacza żonę. Zaimek zwrotny „swoją” jest naturalny po polsku, gdy podmiotem zdania jest Józef.
theological_decisions:
- issue: Znaczenie γυνή przed dopełnieniem małżeństwa
  choice: swoją żonę
  alternative: kobietę
  rationale: Narracja ujmuje Marię w prawno-małżeńskiej relacji do Józefa, choć następny werset wyraźnie odróżnia przyjęcie jej od współżycia. „Żona” zachowuje ten status bez sugerowania dopełnienia małżeństwa.
- issue: Oddanie κύριος w wyrażeniu ἄγγελος κυρίου
  choice: anioł Pana
  alternative: anioł Jahwe
  rationale: „Pan” bez narzucania identyfikacji niewyrażonej wprost w greckim tekście zachowuje tradycyjny biblijny idiom oraz sposób użycia κύριος w tym miejscu.
translation_notes:
  register: Współczesna, zrozumiała polszczyzna o godnym tonie. „Uczynił” zachowuje biblijny rejestr bez archaizowania, a „przyjął do siebie” naturalnie przekazuje sens sytuacji małżeńskiej i domowej.
