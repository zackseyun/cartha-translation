source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: pl
  text: Abraham został ojcem Izaaka[a], Izaak zaś został ojcem Jakuba, Jakub zaś został ojcem Judy i jego braci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „spłodził”. Grecki czasownik można też oddać bardziej tradycyjnie jako „zrodził”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: został ojcem
  rationale: W rodowodzie czasownik γεννάω wskazuje na ojcostwo i pochodzenie w linii męskiej. Sformułowanie „został ojcem” jest jasne i naturalne we współczesnej polszczyźnie, a zarazem zachowuje genealogiczny sens greckiego czasownika bez staroświeckiego brzmienia.
- source_word: δὲ
  choice: zaś
  rationale: W tym szeregu genealogicznym δέ jest łagodnym łącznikiem, a nie sygnałem mocnego przeciwstawienia. Polskie „zaś” naturalnie wyznacza kolejne ogniwa rodowodu.
- source_word: Ἰούδαν
  choice: Judy
  rationale: 'Chodzi o Judę, syna Jakuba i patriarchę, dlatego zastosowano utrwaloną polską formę imienia „Juda”, tutaj w dopełniaczu: „Judy”.'
- source_word: ἀδελφοὺς αὐτοῦ
  choice: jego braci
  rationale: Rzeczownik jest rodzaju męskiego i w tym kontekście odnosi się do pozostałych synów Jakuba, czyli braci Judy.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Abraham / Izaak / Jakub
  rationale: Zastosowano utrwalone w polszczyźnie biblijnej formy imion.
theological_decisions:
- issue: Sposób oddania czasownika genealogicznego
  choice: Konsekwentne „został ojcem”
  alternative: „spłodził” lub tradycyjne „zrodził”
  rationale: Wybrane sformułowanie zachowuje nacisk na ojcostwo i linię genealogiczną, pozostając naturalne dla współczesnego czytelnika. Nie rozstrzyga ponad tekst, czy każdy element rodowodu ma wyrażać bezpośrednie następstwo pokoleń.
translation_notes:
  register: Współczesny, godny i prosty rejestr. Powtórzenie „został ojcem” zachowuje rytm rodowodu, a „zaś” czytelnie prowadzi przez jego kolejne ogniwa.
