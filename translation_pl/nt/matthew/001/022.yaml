  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: pl
  text: 'Wszystko to[a] się stało, aby wypełniło się to, co Pan powiedział przez proroka, który powiedział:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „Całe to wydarzenie się dokonało”. Greckie τοῦτο δὲ ὅλον podkreśla całość opisanych przed chwilą wydarzeń.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Wszystko to
  rationale: Naturalny polski szyk oddaje zaimek wskazujący wraz z naciskiem ὅλον na całość opisanych wydarzeń. δέ pełni tu łagodną funkcję łączącą; w polszczyźnie jej osobne oddanie nie jest konieczne i mogłoby niepotrzebnie sugerować kontrast.
- source_word: γέγονεν
  choice: się stało
  rationale: Forma perfectum opisuje zaistniałe wydarzenia; „się stało” jest naturalne w narracji i zachowuje odniesienie do całego poprzedniego opisu.
- source_word: ἵνα πληρωθῇ
  choice: aby wypełniło się
  rationale: Konstrukcja zachowuje zarówno stronę bierną, jak i nierozstrzygnięte do końca napięcie między celem a rezultatem.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: to, co Pan powiedział
  rationale: Idiomaticzna polska konstrukcja oddaje treść wypowiedzianą przez Pana bez dodawania słowa „Bóg”, którego nie ma w tekście greckim.
- source_word: διὰ τοῦ προφήτου
  choice: przez proroka
  rationale: „Przez” zachowuje rolę proroka jako pośrednika wypowiedzi, przy jednoczesnym wskazaniu Pana jako jej ostatecznego autora.
- source_word: λέγοντος
  choice: mówiąc
  rationale: Imiesłów wprowadza cytat następujący w kolejnym wersecie. Zachowano jego formalną obecność i funkcję, mimo że polska składnia jest tu nieco podniosła.
theological_decisions:
- issue: Sprawstwo wypowiedzi prorockiej
  choice: „Pan powiedział przez proroka”
  alternative: „prorok powiedział od Pana”
  rationale: Greka rozróżnia Pana jako sprawcę wypowiedzi (ὑπό z dopełniaczem) i proroka jako pośrednika (διά z dopełniaczem). Przekład zachowuje to rozróżnienie bez rozwijania go w dodatkową doktrynę.
- issue: Formuła wypełnienia
  choice: „aby wypełniło się”
  alternative: „wskutek czego wypełniło się”
  rationale: ἵνα z trybem łączącym może obejmować odcień celu i rezultatu. „Aby” nie rozstrzyga tej relacji bardziej, niż czyni to tekst źródłowy.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Szyk „Wszystko to” jest naturalny i czytelny; „mówiąc” zachowuje formę tekstu greckiego oraz otwiera cytat w następnym wersecie.
