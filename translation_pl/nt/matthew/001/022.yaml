    issue: Niejednoznaczne odniesienie „mówiąc”
    rationale: W grece λέγοντος jest związane z τοῦ προφήτου („proroka, który mówi/powiedział”), nie z κυρίου. W polskim układzie „Pan powiedział przez proroka, mówiąc” imiesłów może zostać odczytany jako odnoszący się do Pana. „Przez proroka, który powiedział” usuwa tę niejasność i nadal wprowadza cytat z następnego wersetu.
