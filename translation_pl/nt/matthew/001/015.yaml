id: MAT.1.15
reference: Matthew 1:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: pl
  text: Eliud był ojcem Eleazara, Eleazar był ojcem Mattana, a Mattan był ojcem Jakuba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Przyjęto utrwaloną polską formę imienia biblijnego.
- source_word: δὲ
  choice: (pominięte / „a”)
  rationale: W genealogii δέ jest łagodnym spójnikiem rozwijającym wyliczenie. W pierwszym i drugim członie naturalna polska składnia pozwala je pominąć, a przed ostatnim członem oddano je jako „a”.
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W kontekście genealogii czasownik oznacza relację ojcostwa lub pochodzenia. Zwrot „był ojcem” jest współczesny, zwięzły i naturalniejszy niż archaiczne „zrodził”.
- source_word: τὸν
  choice: (nieprzetłumaczone osobno)
  rationale: Grecki rodzajnik oznacza dopełnienie bliższe przed imieniem własnym; w naturalnej polszczyźnie nie wymaga osobnego odpowiednika.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: 'Zastosowano utrwaloną polską formę imienia biblijnego; w dopełniaczu: „Eleazara”.'
- source_word: Ματθάν
  choice: Mattan
  rationale: 'Zastosowano polską transliterację imienia, z podwojonym „t” odpowiadającym greckiemu τθ; w dopełniaczu: „Mattana”.'
- source_word: Ἰακώβ
  choice: Jakub
  rationale: 'Zastosowano tradycyjną i powszechną polską formę tego imienia biblijnego; w dopełniaczu: „Jakuba”.'
theological_decisions:
- issue: Zakres znaczeniowy ἐγέννησεν w genealogii
  choice: był ojcem
  alternative: zrodził / był przodkiem
  rationale: Wyrażenie „był ojcem” wiernie oddaje podstawową relację genealogiczną, nie wprowadzając archaizmu. Nie dodano „bezpośrednim”, dzięki czemu tekst nie rozstrzyga ponad to, co wynika z formuły genealogicznej.
translation_notes:
  register: Współczesny, godny i prosty rejestr. Powtórzenie „był ojcem” zachowuje rytm genealogii, natomiast użycie „a” w ostatnim członie zapewnia naturalny polski tok zdania.
