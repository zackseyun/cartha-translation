id: MAT.1.10
reference: Matthew 1:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: pl
  text: Ezechiasz był ojcem Manassesa, Manasses był ojcem Amosa[a], a Amos był ojcem Jozjasza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre przekłady mają tu „Amona”, uzgadniając imię z królem Judy wymienionym w 2 Krl 21. Grecki tekst Ewangelii Mateusza ma „Amosa”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: był ojcem
  rationale: W rodowodzie czasownik γεννάω wskazuje na ojcostwo i pochodzenie. Zwrot „był ojcem” brzmi naturalnie i godnie we współczesnej polszczyźnie, bez archaiczności formy „zrodził”.
- source_word: Ἑζεκίας
  choice: Ezechiasz
  rationale: Zastosowano utrwaloną polską formę biblijnego imienia króla Judy.
- source_word: Μανασσῆς
  choice: Manasses
  rationale: Zastosowano utrwaloną polską formę biblijnego imienia.
- source_word: Ἀμώς
  choice: Amos
  rationale: Tekst SBLGNT ma Ἀμώς, dlatego tekst główny zachowuje formę „Amos”, zamiast uzgadniać ją z imieniem króla Amona znanego z Ksiąg Królewskich i Kronik.
- source_word: Ἰωσίας
  choice: Jozjasz
  rationale: Zastosowano utrwaloną polską formę biblijnego imienia.
- source_word: δέ
  choice: a
  rationale: W szeregu genealogicznym δέ jest spójnikiem rozwijającym wyliczenie; w polszczyźnie wcześniejsze wystąpienia naturalnie oddaje przecinek, a ostatnie spójnik „a”.
theological_decisions:
- issue: Różnica między imieniem w greckim tekście Mateusza a imieniem króla Judy w Starym Testamencie
  choice: W tekście głównym zachowano imię „Amos” zgodnie z greckim Ἀμώς.
  alternative: „Amon”, jako uzgodnienie z imieniem króla w 2 Krl 21 i 2 Krn 33.
  rationale: Pierwszeństwo ma świadectwo greckiego tekstu Mateusza. Różnicy nie należy po cichu usuwać przez harmonizację; znaną identyfikację genealogiczną objaśnia przypis.
translation_notes:
  register: Nowoczesna, standardowa i godna polszczyzna. Powtarzalna konstrukcja odpowiada rytmowi rodowodu, lecz „był ojcem” jest bardziej naturalne dla zwykłego czytelnika niż archaiczne „zrodził”.
