  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: pl
  text: 'Bo co łatwiej powiedzieć: „Twoje grzechy są odpuszczone”[a], czy powiedzieć: „Wstań i chodź”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Twoje grzechy zostały odpuszczone”. Grecki czas teraźniejszy strony biernej może opisywać stan będący skutkiem dokonanego odpuszczenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Bo co łatwiej powiedzieć
  rationale: τί z formą porównawczą εὐκοπώτερον wprowadza wybór między dwiema wypowiedziami. „Co łatwiej” jest naturalne po polsku, a „bo” zachowuje wyjaśniający związek γάρ z poprzednim zdaniem.
- source_word: εἰπεῖν
  choice: powiedzieć
  rationale: Bezokolicznik oznacza tu zwykły akt mówienia; to samo słowo zachowano w obu członach.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Twoje grzechy są odpuszczone
  rationale: Grecki czasownik jest w czasie teraźniejszym, stronie biernej, a podmiotem są „grzechy”. Tradycyjne, lecz nadal zrozumiałe „odpuszczone” trafnie oddaje przebaczenie grzechów i statyczny sens formy.
- source_word: ἁμαρτίαι
  choice: grzechy
  rationale: To zwykły i bezpośredni polski odpowiednik w tym kontekście.
- source_word: Ἔγειρε
  choice: Wstań
  rationale: Aorystyczny tryb rozkazujący w opisie uzdrowienia wzywa do podniesienia się; „Wstań” jest naturalne i zwięzłe.
- source_word: καὶ περιπάτει
  choice: i chodź
  rationale: Teraźniejszy tryb rozkazujący wskazuje na czynność następującą po wstaniu. „Chodź” naturalnie oddaje zdolność chodzenia, nie zaś polecenie podejścia do mówiącego.
- source_word: σου
  choice: twoje
  rationale: Zaimek drugiej osoby liczby pojedynczej oddano polskim zaimkiem dzierżawczym w liczbie mnogiej, zgodnym z rzeczownikiem „grzechy”.
theological_decisions:
- issue: Sposób oddania Jezusowej wypowiedzi o odpuszczeniu grzechów
  choice: Twoje grzechy są odpuszczone
  alternative: Twoje grzechy zostały odpuszczone
  rationale: Grecki czas teraźniejszy strony biernej dopuszcza odczytanie jako aktualnego stanu wynikającego z dokonanego odpuszczenia. Prosta konstrukcja „są odpuszczone” nie rozstrzyga ponad tekst kwestii czasu i zachowuje napięcie dotyczące autorytetu Jezusa.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano wyjaśniające „bo”, równoległość obu wystąpień „powiedzieć” oraz bezpośrednią formę rozkazującą. Termin „odpuszczone” jest utrwalony w polszczyźnie biblijnej i nadal powszechnie zrozumiały.
