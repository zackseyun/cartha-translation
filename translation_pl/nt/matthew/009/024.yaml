  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: pl
  text: 'Mówił: „Odejdźcie, bo dziewczynka nie umarła, lecz śpi”. A oni wyśmiewali Go.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „śmiali się z Niego”; chodzi o szyderczy śmiech.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Mówił
  rationale: Imperfectum wskazuje na trwającą lub powtarzaną wypowiedź. Polskie „mówił” zachowuje ten aspekt naturalniej niż bardziej punktowe „powiedział”.
- source_word: Ἀναχωρεῖτε
  choice: Odejdźcie
  rationale: Tryb rozkazujący liczby mnogiej nakazuje obecnym oddalić się. „Odejdźcie” jest współczesne, zwięzłe i odpowiednio stanowcze.
- source_word: οὐ γὰρ
  choice: bo… nie
  rationale: γάρ wprowadza uzasadnienie polecenia; „bo” brzmi naturalnie w bezpośredniej wypowiedzi.
- source_word: ἀπέθανεν
  choice: nie umarła
  rationale: Aoryst przedstawia śmierć jako zdarzenie. Polski czas przeszły wiernie i naturalnie oddaje tę formę.
- source_word: τὸ κοράσιον
  choice: dziewczynka
  rationale: κοράσιον oznacza młodą dziewczynę lub dziewczynkę; kontekst dziecka oraz zdrobniała forma grecka przemawiają za naturalnym polskim „dziewczynka”.
- source_word: ἀλλὰ καθεύδει
  choice: lecz śpi
  rationale: Czas teraźniejszy opisuje aktualny stan lub czynność. „Śpi” zachowuje dosłowną, prowokującą opozycję wobec „umarła”.
- source_word: κατεγέλων αὐτοῦ
  choice: wyśmiewali Go
  rationale: Czasownik oznacza szyderczy śmiech skierowany przeciw komuś, a imperfectum sugeruje czynność trwającą. „Wyśmiewali Go” zwięźle oddaje zarówno śmiech, jak i drwinę.
theological_decisions:
- issue: Stwierdzenie Jezusa, że dziewczynka „nie umarła, lecz śpi”
  choice: Zachowano dosłowne „śpi” bez interpretacyjnego objaśnienia w tekście głównym.
  alternative: „tylko śpi” albo rozwinięcie wyjaśniające, że sen jest metaforą śmierci
  rationale: Grecki tekst pozostawia prowokujące napięcie między śmiercią a snem. Dodanie „tylko” lub objaśnienia rozstrzygałoby sens, którego autor nie wyjaśnia w tym zdaniu.
translation_notes:
  register: Współczesny, godny i łatwo zrozumiały polski. Składnia bezpośredniej wypowiedzi pozostaje zwięzła; wielką literę w zaimku „Go” zastosowano zgodnie z utrwaloną polską konwencją odnoszącą się do Jezusa.
