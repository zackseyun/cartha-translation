  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: pl
  text: Gdy Jezus przyszedł do domu przełożonego[a] i zobaczył flecistów[b] oraz hałasujący tłum[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dostojnika” lub — w świetle relacji równoległych — „przełożonego synagogi”. Mateusz używa tutaj po prostu ogólnego określenia „przełożony”.'
    reason: alternative_reading
  - marker: b
    text: Fleciści należeli do osób uczestniczących w zwyczajowym publicznym opłakiwaniu zmarłych; mogli występować wraz z zawodowymi żałobnikami.
    reason: cultural_note
  - marker: c
    text: 'Możliwe też: „tłum pogrążony we wrzawie” lub „tłum w zamęcie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: gdy Jezus przyszedł
  rationale: Imiesłów aorystu wyraża tu następstwo czasowe; zdanie podrzędne z „gdy” brzmi naturalnie po polsku i zachowuje tę relację.
- source_word: οἰκίαν
  choice: domu
  rationale: „Dom” jest prostym i kontekstowo właściwym odpowiednikiem, bez zbędnego doprecyzowania.
- source_word: ἄρχοντος
  choice: przełożonego
  rationale: Grecki rzeczownik określa osobę sprawującą władzę lub pełniącą przywódczą funkcję. „Przełożony” zachowuje ogólność sformułowania Mateusza i nie wprowadza szczegółu znanego z relacji równoległych.
- source_word: ἰδὼν
  choice: zobaczył
  rationale: Zwykły czasownik narracyjny; „zobaczył” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: αὐλητὰς
  choice: flecistów
  rationale: Termin oznacza grających na aulosie, instrumencie dętym zbliżonym funkcją do piszczałki lub fletu. „Fleciści” jest zrozumiałym współczesnym odpowiednikiem, a przypis objaśnia kontekst pogrzebowy.
- source_word: ὄχλον
  choice: tłum
  rationale: Standardowy i naturalny odpowiednik w narracji.
- source_word: θορυβούμενον
  choice: czyniący zgiełk
  rationale: Imiesłów opisuje tłum będący w stanie hałaśliwego poruszenia. Sformułowanie zachowuje aspekt słyszalnego zamieszania, nie rozstrzygając dokładnego charakteru emocji.
theological_decisions:
- issue: Identyfikacja gospodarza domu
  choice: przełożony
  alternative: dostojnik; zwierzchnik synagogi
  rationale: Mateusz używa jedynie ogólnego ἄρχων. Tekst główny nie harmonizuje tego określenia z bardziej szczegółową identyfikacją obecną w relacjach równoległych.
translation_notes:
  register: Współczesny, godny język narracyjny. Składnia pozostaje otwarta przecinkiem, ponieważ zdanie jest kontynuowane w następnym wersecie. Uniknięto archaicznego „fletnistów” oraz harmonizującego dopowiedzenia „synagogi” w tekście głównym.
