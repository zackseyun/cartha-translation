  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: pl
  text: Gdy zobaczył tłumy, ogarnęło go współczucie dla nich, ponieważ byli udręczeni i powaleni[a], jak owce, które nie mają pasterza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „udręczeni i bezradni”. Greckie określenia mogą opisywać ludzi nękanych i wyczerpanych, którzy nie są w stanie sami o siebie zadbać.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: Gdy zobaczył tłumy
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym. δέ jest tu łagodnym łącznikiem narracyjnym i nie wymaga osobnego odpowiednika, a ὄχλοι oznacza zgromadzone tłumy ludzi.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: ogarnęło go współczucie dla nich
  rationale: σπλαγχνίζομαι wyraża głębokie, wewnętrzne współczucie. Takie sformułowanie zachowuje siłę uczucia i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: ὅτι ἦσαν
  choice: ponieważ byli
  rationale: ὅτι wprowadza przyczynę współczucia, dlatego przejrzystym odpowiednikiem jest „ponieważ”.
- source_word: ἐσκυλμένοι
  choice: udręczeni
  rationale: Imiesłów opisuje ludzi nękanych, źle traktowanych i wyczerpanych; „udręczeni” zachowuje zarówno bierny charakter ich stanu, jak i jego dotkliwość.
- source_word: καὶ ἐρριμμένοι
  choice: i powaleni
  rationale: ῥίπτω dosłownie wiąże się z rzuceniem lub powaleniem. „Powaleni” zachowuje obrazowość greckiego tekstu, zamiast zastępować ją samą interpretacją „bezradni”.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: jak owce, które nie mają pasterza
  rationale: Oddanie porównania zdaniem względnym jest naturalne po polsku i zachowuje obraz owiec pozbawionych pasterza.
theological_decisions:
- issue: Sposób wyrażenia współczucia Jezusa
  choice: ogarnęło go współczucie dla nich
  alternative: ulitował się nad nimi
  rationale: Wybrane brzmienie podkreśla głębię reakcji Jezusa, nie sprowadzając jej do chłodnej oceny ani nie dodając treści doktrynalnej nieobecnej w tekście.
- issue: Opis stanu tłumów
  choice: udręczeni i powaleni
  alternative: udręczeni i bezradni
  rationale: Wybrane brzmienie zachowuje konkretny obraz ludzi źle traktowanych i jakby rzuconych na ziemię. Alternatywa „bezradni” trafnie wskazuje na wynik tego stanu, lecz jest bardziej interpretacyjna.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano pasterską metaforę oraz obrazową niejednoznaczność dwóch greckich imiesłowów; uniknięto archaizmów i dopowiedzeń wyznaniowych.
