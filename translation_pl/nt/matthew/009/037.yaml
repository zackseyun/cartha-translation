  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: pl
  text: 'Wtedy mówi[a] do swoich uczniów: „Żniwo wprawdzie obfite, ale pracowników mało”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać w czasie przeszłym: „powiedział”. Greka używa tu narracyjnego czasu teraźniejszego: „mówi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Zwięzły i naturalny odpowiednik przysłówka wskazującego kolejność wydarzeń.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy użyty w żywej narracji; po polsku takie użycie czasu teraźniejszego jest zrozumiałe i naturalne.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: do swoich uczniów
  rationale: Oddaje zarówno rzeczownik μαθηταῖς, jak i wyraźny zaimek dzierżawczy αὐτοῦ; forma „swoich” jest naturalna przy podmiocie zdania.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: wprawdzie ... ale
  rationale: Naturalnie odtwarza kontrast sygnalizowany przez konstrukcję μέν...δέ.
- source_word: θερισμός
  choice: żniwo
  rationale: Zachowuje rolniczą metaforę tekstu greckiego i jej utrwalony biblijny charakter.
- source_word: πολύς
  choice: obfite
  rationale: W połączeniu ze słowem „żniwo” jasno wyraża wielkość lub obfitość, nie dodając interpretacji.
- source_word: ἐργάται
  choice: pracowników
  rationale: Współczesny, szeroko zrozumiały odpowiednik osób wykonujących pracę przy żniwie.
- source_word: ὀλίγοι
  choice: mało
  rationale: Naturalna polska konstrukcja orzecznikowa z rzeczownikiem „pracowników”, wiernie wyrażająca ich niewielką liczbę.
theological_decisions:
- issue: Metaforyczny sens wypowiedzi o żniwie
  choice: Zachowano metaforę rolniczą bez objaśniania jej odniesienia w tekście głównym.
  alternative: Wyjaśnić w przekładzie, że żniwo oznacza ludzi gotowych przyjąć posłannictwo Jezusa.
  rationale: Sam werset pozostawia obraz w postaci metafory, a jego odniesienie wynika z kontekstu. Dopowiedzenie interpretacji zawęziłoby sens tekstu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano zwięzłość sentencji, historyczny czas teraźniejszy oraz kontrast „wprawdzie… ale”.
