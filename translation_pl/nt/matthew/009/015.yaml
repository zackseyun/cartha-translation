  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: pl
  text: 'Jezus powiedział im: „Czyż drużbowie[a] mogą być w żałobie, dopóki pan młody jest z nimi? Nadejdą jednak dni, kiedy pan młody zostanie im zabrany[b], i wtedy będą pościć”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „synowie komnaty weselnej” — idiom oznaczający towarzyszy pana młodego lub osoby pełniące funkcję przy weselu.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „zostanie od nich usunięty”. Forma bierna sugeruje coś więcej niż zwyczajne odejście.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: drużbowie
  rationale: Dosłownie jest to semicki idiom „synowie komnaty weselnej”, oznaczający towarzyszy pana młodego lub osoby pełniące funkcję przy weselu. „Drużbowie” jasno i zwięźle oddaje tę rolę we współczesnej polszczyźnie.
- source_word: πενθεῖν
  choice: być w żałobie
  rationale: Czasownik oznacza opłakiwanie lub przeżywanie żałoby. To sformułowanie zachowuje mocniejszy sens niż samo „smucić się” i dobrze kontrastuje z radością wesela.
- source_word: ἐφ’ ὅσον
  choice: dopóki
  rationale: 'Naturalnie oddaje czasowe znaczenie: przez cały czas, gdy pan młody pozostaje z nimi.'
- source_word: νυμφίος
  choice: pan młody
  rationale: To zwykłe i godne polskie określenie oblubieńca w kontekście weselnym, zachowujące obraz bez jego interpretacyjnego rozwijania.
- source_word: ἀπαρθῇ
  choice: zostanie im zabrany
  rationale: Strona bierna i czasownik sugerują odebranie lub usunięcie, a nie zwyczajne dobrowolne odejście. Polski zwrot zachowuje tę sugestię bez dopowiadania sprawcy.
- source_word: νηστεύσουσιν
  choice: będą pościć
  rationale: Bezpośredni i naturalny odpowiednik greckiej formy przyszłej.
- source_word: Μὴ δύνανται ... ;
  choice: Czy ... mogą ...?
  rationale: Pytanie retoryczne z μή zakłada odpowiedź przeczącą. Polska konstrukcja pytajna zachowuje tę retoryczną siłę bez niezręcznego pytania dopowiadającego.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Nadejdą jednak dni
  rationale: Naturalny polski zwrot przyszłościowy; „jednak” oddaje łagodny kontrast wyrażony przez δέ.
theological_decisions:
- issue: Możliwe chrystologiczne znaczenie obrazu pana młodego
  choice: Zachować metaforę pana młodego bez wyjaśniania jej w tekście przekładu.
  alternative: Rozwinąć przekład przez bezpośrednie utożsamienie Jezusa z mesjańskim oblubieńcem.
  rationale: Werset pozwala odbiorcy rozpoznać znaczenie obrazu, ale sam nie formułuje jego pełnego objaśnienia. Przekład nie powinien usuwać tej teologicznej otwartości.
- issue: Sugestia przemocy lub śmierci w ἀπαρθῇ
  choice: „zostanie im zabrany”
  alternative: „odejdzie od nich” albo „zostanie od nich usunięty”
  rationale: Strona bierna sugeruje, że pan młody nie odchodzi po prostu z własnej woli. Sformułowanie może zapowiadać śmierć Jezusa, lecz przekład pozostawia tę sugestię niewyjaśnioną.
translation_notes:
  register: Współczesna, naturalna i godna polszczyzna. „Drużbowie” oddają rolę społeczną ukrytą w greckim idiomie, a „być w żałobie” zachowuje wagę πενθεῖν. Szyk i rytm wypowiedzi pozostają przejrzyste dla zwykłego czytelnika.
