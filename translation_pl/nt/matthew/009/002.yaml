source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: pl
  text: 'I oto[a] przynieśli Mu sparaliżowanego, leżącego na łóżku. Gdy Jezus zobaczył ich wiarę[b], powiedział do sparaliżowanego: „Odwagi, synu! Twoje grzechy są odpuszczone[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „A oto”.'
    reason: lexical_alternative
  - marker: b
    text: Grecki tekst mówi „ich wiarę”; liczba mnoga może obejmować sparaliżowanego i tych, którzy go przynieśli, albo odnosić się do samych niosących.
    reason: alternative_reading
  - marker: c
    text: 'Możliwe także: „Twoje grzechy zostały odpuszczone”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: I oto
  rationale: Zachowuje żywy, kierujący uwagę znacznik narracyjny typowy dla Mateusza, a zarazem brzmi naturalnie w podniosłej, współczesnej polszczyźnie.
- source_word: προσέφερον
  choice: przynieśli
  rationale: W tym zdarzeniu polski czas przeszły dokonany naturalnie przedstawia wniesienie chorego przed Jezusa; niedokonany aspekt greckiego pozostaje elementem sposobu przedstawienia sceny, lecz oddanie go jako „przynosili” byłoby tu mniej naturalne.
- source_word: παραλυτικὸν
  choice: sparaliżowanego
  rationale: Rzeczownikowe użycie przymiotnika można po polsku naturalnie oddać bez dodawania słowa „człowiek” lub „mężczyzna”.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: leżącego na łóżku
  rationale: Naturalnie opisuje pozycję chorego; κλίνη oznacza tu łóżko lub posłanie, a „łóżko” nie zawęża tekstu do maty.
- source_word: πίστιν
  choice: wiarę
  rationale: Standardowy i kontekstowo trafny odpowiednik, obejmujący ufność ujawnioną w działaniu.
- source_word: Θάρσει
  choice: Odwagi
  rationale: Zwięzłe, idiomatyczne słowo otuchy, zachowujące imperatywną siłę greckiego wyrażenia.
- source_word: τέκνον
  choice: dziecko
  rationale: Zachowuje czułą formę zwrotu bez dopowiadania płci przez „synu”; w polszczyźnie biblijnej brzmi godnie i zrozumiale.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Twoje grzechy są odpuszczone
  rationale: Polski bierny zwrot zachowuje teraźniejszą formę oznajmienia oraz niewskazanego wprost sprawcę; „odpuszczone” jest naturalnym określeniem przebaczenia grzechów.
- source_word: ἁμαρτίαι
  choice: grzechy
  rationale: Bezpośredni, utrwalony odpowiednik zachowujący liczbę mnogą konkretnych przewinień.
theological_decisions:
- issue: Zakres wyrażenia τὴν πίστιν αὐτῶν
  choice: Zachowano liczbę mnogą „ich wiarę”, bez rozstrzygania, czy obejmuje ona sparaliżowanego wraz z niosącymi, czy tylko niosących.
  alternative: Uściślić jako „wiarę tych, którzy go przynieśli” albo przypisać wiarę samemu sparaliżowanemu.
  rationale: Grecki zaimek w liczbie mnogiej wskazuje grupę, ale nie określa jednoznacznie jej składu; przekład powinien zachować tę niejednoznaczność.
- issue: Charakter oznajmienia o odpuszczeniu
  choice: „Twoje grzechy są odpuszczone” jako bierne oznajmienie bez nazwania sprawcy.
  alternative: „Odpuszczam ci grzechy” albo „Bóg odpuścił ci grzechy”.
  rationale: Grecka strona bierna nie nazywa sprawcy. Zachowanie jej nie przesądza w przekładzie, czy nacisk pada na działanie Boga, czy na władzę Jezusa ujawnioną w narracji.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze narracji biblijnej. Wielką literę w zaimku „Mu” zastosowano zgodnie z częstą polską konwencją odnoszenia się do Jezusa. Szyk i interpunkcja mają pozostać jasne w głośnym czytaniu; „I oto” zachowuje Mateuszowe przejście narracyjne, natomiast „Odwagi” brzmi naturalniej niż dosłowne, lecz cięższe „Nabierz otuchy”.
