  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: pl
  text: 'Mówiła bowiem sobie: „Jeśli tylko dotknę jego szaty, zostanę ocalona[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „zostanę uzdrowiona” albo „wrócę do zdrowia”. Grecki tekst mówi dosłownie o ocaleniu, używając czasownika, który w tym kontekście może również oznaczać uzdrowienie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: mówiła
  rationale: Imperfect wskazuje na trwającą lub powtarzaną czynność; polska forma niedokonana „mówiła” zachowuje ten aspekt bez rozstrzygania, czy słowa były wielokrotnie powtarzane.
- source_word: γὰρ
  choice: bowiem
  rationale: Spójnik wprowadza wyjaśnienie wcześniejszej narracji; „bowiem” naturalnie zachowuje jego funkcję objaśniającą i pasuje do godnego rejestru.
- source_word: ἐν ἑαυτῇ
  choice: sobie
  rationale: W połączeniu z czasownikiem mówienia jest to naturalny polski sposób oddania wypowiedzi wewnętrznej.
- source_word: Ἐὰν μόνον
  choice: Jeśli tylko
  rationale: Wyrażenie wskazuje na warunek ograniczony do jednej wystarczającej czynności i nadaje jej wyraźny nacisk.
- source_word: ἅψωμαι
  choice: dotknę
  rationale: Aoryst trybu łączącego po ἐάν przedstawia przyszły warunek; polski czasownik dokonany w czasie przyszłym naturalnie oddaje pojedyncze, zamierzone dotknięcie.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: jego szaty
  rationale: Ἱμάτιον oznacza ubranie, zwłaszcza szatę wierzchnią; „szata” pozostaje zwięzła i nie doprecyzowuje niepotrzebnie rodzaju odzienia.
- source_word: σωθήσομαι
  choice: zostanę ocalona
  rationale: Czasownik σῴζω może oznaczać ocalenie, zbawienie albo przywrócenie zdrowia. „Zostanę ocalona” zachowuje jego szerszy zakres, natomiast przypis podaje sens uzdrowienia wymagany przez bezpośredni kontekst.
theological_decisions:
- issue: Oddanie σωθήσομαι w kontekście uzdrowienia
  choice: zostanę ocalona
  alternative: zostanę uzdrowiona; wrócę do zdrowia
  rationale: Bezpośredni kontekst dotyczy cielesnego uzdrowienia, lecz tekst używa szerokiego czasownika σῴζω, a nie terminu wyłącznie medycznego. Tekst główny zachowuje tę szerokość i możliwy rezonans teologiczny, a przypis jasno wskazuje sens kontekstowy. Uniknięto „będę zbawiona”, ponieważ we współczesnej polszczyźnie brzmiałoby ono niemal wyłącznie religijnie i przesłaniałoby znaczenie uzdrowienia.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Szyk „mówiła bowiem sobie” zachowuje objaśniające połączenie z kontekstem, a „jeśli tylko” naturalnie oddaje nacisk wypowiedzi. Rodzaj żeński w „ocalona” wynika z mówiącej kobiety.
