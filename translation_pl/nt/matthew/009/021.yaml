  source_fidelity: 'Tekst wiernie oddaje składnię i sens grecki: niedokonane ἔλεγεν jako „mówiła”, objaśniające γάρ jako „bowiem”, wewnętrzną wypowiedź jako „sobie”, warunek ἐὰν μόνον jako „Jeśli tylko”, aorystyczne ἅψωμαι jako „dotknę” oraz ἱμάτιον jako „szata”. „Zostanę ocalona” zachowuje szerszy zakres σωθήσομαι, nie redukując go wyłącznie do uzdrowienia.'
  naturalness: Polszczyzna jest współczesna, zrozumiała i odpowiednio godna. Zwrot „mówiła bowiem sobie” jest naturalnym sposobem przedstawienia wewnętrznej mowy; „jego szaty” nie brzmi nadmiernie archaicznie w rejestrze narracji biblijnej.
  terminology: „Ocalona” jest trafnym, szerokim odpowiednikiem σωθήσομαι w tekście głównym, a przypis właściwie sygnalizuje kontekstowe znaczenie uzdrowienia bez narzucania wyłącznie soteriologicznego odczytania. Termin „szata” odpowiednio oddaje ἱμάτιον bez nieuzasadnionego doprecyzowania.
