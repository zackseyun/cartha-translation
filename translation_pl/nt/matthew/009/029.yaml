base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: pl
  text: 'Wtedy dotknął ich oczu i powiedział: „Niech się wam stanie zgodnie z waszą wiarą[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Niech się wam stanie stosownie do waszej ufności”. Greckie słowo pistis może oznaczać „wiarę” lub „ufność”, a w niektórych kontekstach także „wierność”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący kolejny moment opowiadania.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: dotknął ich oczu
  rationale: Czasownik ἅπτομαι z dopełnieniem w dopełniaczu oznacza tu fizyczne dotknięcie; polszczyzna naturalnie używa konstrukcji „dotknąć” z dopełniaczem.
- source_word: λέγων
  choice: i powiedział
  rationale: Imiesłów współczesny oddano naturalnym polskim zdaniem współrzędnym, zachowując jednoczesny i narracyjny związek z dotknięciem.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: zgodnie z waszą wiarą
  rationale: κατά z biernikiem wyraża zgodność lub miarę; „zgodnie z” nie narzuca silniejszego związku przyczynowego. πίστις oddano standardowo jako „wiara”.
- source_word: γενηθήτω ὑμῖν
  choice: Niech się wam stanie
  rationale: Konstrukcja zachowuje rozkazujący charakter aorystycznej formy γενηθήτω oraz celownik ὑμῖν, a zarazem brzmi podniośle i zrozumiale po polsku.
theological_decisions:
- issue: Znaczenie πίστις w wypowiedzi o uzdrowieniu
  choice: wiara
  alternative: ufność
  rationale: W bezpośrednim kontekście chodzi o ufne przekonanie niewidomych dotyczące mocy Jezusa, jednak „wiara” pozostaje tradycyjnym i zakresowo odpowiednim odpowiednikiem πίστις. Wariant „ufność” zachowano w przypisie.
- issue: Relacja wiary do skutku wyrażona przez κατά
  choice: zgodnie z waszą wiarą
  alternative: na podstawie waszej wiary
  rationale: „Zgodnie z” zachowuje możliwy sens miary lub odpowiedniości i nie rozstrzyga, że wiara jest samodzielną przyczyną uzdrowienia.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Szyk wypowiedzi jest naturalny, a formuła „Niech się wam stanie” zachowuje uroczysty, performatywny charakter słów Jezusa bez nadmiernej archaizacji.
