id: MAT.9.4
reference: Matthew 9:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: pl
  text: 'A Jezus, znając[a] ich myśli, powiedział: „Dlaczego rozważacie w swoich sercach to, co złe?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „rozpoznając ich myśli”.'
    reason: Alternatywny odcień znaczeniowy εἰδὼς, który może akcentować spostrzeżenie lub rozpoznanie.
lexical_decisions:
- source_word: εἰδὼς
  choice: znając
  rationale: Imiesłów wyraża świadomość wewnętrznych myśli rozmówców. „Znając” jest zwięzłe, naturalne i nie dopowiada, w jaki sposób Jezus je poznał.
- source_word: ἐνθυμήσεις
  choice: myśli
  rationale: Rzeczownik oznacza wewnętrzne rozważania lub myśli; „myśli” jest naturalnym, szerokim odpowiednikiem w tym kontekście.
- source_word: Ἱνατί
  choice: dlaczego
  rationale: Oddaje pytanie o powód lub motyw w zwykłej, współczesnej polszczyźnie.
- source_word: ἐνθυμεῖσθε
  choice: rozważacie
  rationale: Czasownik odnosi się do trwającego wewnętrznego namysłu. „Rozważacie” brzmi naturalniej niż dosłowne „myślicie złe rzeczy” i zachowuje związek z procesem myślowym.
- source_word: πονηρὰ
  choice: to, co złe
  rationale: Przymiotnik w liczbie mnogiej jest użyty rzeczownikowo. Zwrot „to, co złe” zachowuje jego ogólny charakter, nie zawężając znaczenia wyłącznie do złych myśli lub zamiarów.
- source_word: καρδίαις
  choice: sercach
  rationale: Zachowuje źródłową metaforę serca jako wnętrza człowieka, obejmującego myśli i intencje.
theological_decisions:
- issue: Wiedza Jezusa o niewypowiedzianych myślach
  choice: Jezus, znając ich myśli
  alternative: Jezus, rozpoznając ich myśli
  rationale: Tekst przedstawia Jezusa jako świadomego ich wewnętrznych rozważań. Przekład zachowuje to twierdzenie, nie rozstrzygając sposobu ani doktrynalnego zakresu tej wiedzy.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano biblijną metaforę „w sercach”, a niezgrabne dosłowne „myślicie złe rzeczy” oddano naturalnym „rozważacie… to, co złe”.
