  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: pl
  text: A gdy wsiadł do łodzi, przeprawił się na drugi brzeg i przybył do swojego miasta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „do jego własnego miasta”. Wyrażenie może odnosić się do miasta, z którym Jezus był związany na tym etapie opowiadania, prawdopodobnie do Kafarnaum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: gdy wsiadł
  rationale: Aorystowy imiesłów wyraża czynność uprzednią wobec głównych czasowników. Konstrukcja „gdy wsiadł” zachowuje tę kolejność i brzmi naturalnie po polsku.
- source_word: πλοῖον
  choice: do łodzi
  rationale: πλοῖον jest ogólnym określeniem jednostki pływającej; w kontekście Jeziora Galilejskiego naturalnym polskim odpowiednikiem jest „łódź”, nie „statek”.
- source_word: διεπέρασεν
  choice: przeprawił się na drugi brzeg
  rationale: διαπεράω oznacza przedostanie się z jednej strony na drugą, zwłaszcza przez wodę. Dodanie „na drugi brzeg” naturalnie oddaje kierunkowy sens czasownika.
- source_word: ἦλθεν
  choice: przybył
  rationale: W tym ciągu narracyjnym „przybył” jasno wyraża osiągnięcie celu podróży i odpowiada kontekstowemu użyciu ἔρχομαι.
- source_word: ἰδίαν πόλιν
  choice: swojego miasta
  rationale: Dosłowne i naturalne sformułowanie zachowuje znaczenie przynależności lub szczególnego związku wyrażone przez ἴδιος, bez utożsamiania miasta z miejscem urodzenia.
- source_word: Καὶ ... καὶ
  choice: A ... i
  rationale: Spójniki zachowują prosty ciąg narracyjny charakterystyczny dla tekstu, a zarazem brzmią płynnie we współczesnej polszczyźnie.
theological_decisions:
- issue: Tożsamość „swojego miasta”
  choice: W tekście głównym pozostawiono neutralne „swojego miasta”.
  alternative: Wskazanie wprost na Kafarnaum albo oddanie jako „rodzinnego miasta”.
  rationale: Greka nie podaje nazwy miasta, a „własne/swoje miasto” nie musi oznaczać miejsca urodzenia. Kontekst najpewniej wskazuje na Kafarnaum, lecz nie należy rozstrzygać tego w tekście głównym.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Zachowano zwięzłość greckiego zdania oraz jego prosty ciąg czynności; uniknięto archaicznego „wszedłszy” i nadinterpretującego „rodzinnego miasta”.
