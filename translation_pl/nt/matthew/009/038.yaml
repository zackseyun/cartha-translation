review_pass:
  verdict: revise
  source_fidelity: Greckie δεήθητε jest wezwaniem do usilnej modlitwy/błagania. „Proście usilnie Pana” jest możliwe, ale w polszczyźnie może znaczyć po prostu „proście Pana o coś” i słabiej zaznacza sam akt modlitwy. „Módlcie się ... do Pana” wyraźniej oddaje sens. „Posłał” jest naturalnym kontekstowym odpowiednikiem ἐκβάλῃ; jego silniejszy, dosłowniej wypierający odcień należy zachować w przypisie.
  naturalness: „Módlcie się więc usilnie do Pana żniwa” brzmi współcześnie, godnie i idiomatycznie. „Na swoje żniwo” jest naturalnym polskim oddaniem εἰς τὸν θερισμὸν αὐτοῦ w obrazie pracy żniwnej.
  terminology: „Pan żniwa” słusznie zachowuje biblijny rejestr i nie rozstrzyga tożsamości referenta. „Robotnicy” trafnie oddaje ἐργάτας. Przypis powinien podawać rzeczywistą silniejszą alternatywę leksykalną bez parafrazującego „przynaglił do wyjścia”.
