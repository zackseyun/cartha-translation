  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: pl
  text: Módlcie się więc usilnie do Pana żniwa, aby posłał robotników na swoje żniwo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wypędził” lub „wypchnął” robotników. Grecki czasownik jest mocniejszy niż zwykłe „posłał”, choć w tym kontekście oznacza skierowanie robotników do pracy przy żniwie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: Proście usilnie
  rationale: Czasownik δέομαι wyraża usilną, naglącą prośbę. „Proście usilnie” zachowuje zarówno kontekst modlitwy, jak i intensywność wezwania, a brzmi naturalnie we współczesnej polszczyźnie.
- source_word: οὖν
  choice: więc
  rationale: Spójnik wskazuje na wniosek wynikający z poprzedniej wypowiedzi o wielkim żniwie i małej liczbie robotników. „Więc” jasno i naturalnie oddaje ten związek.
- source_word: κυρίου τοῦ θερισμοῦ
  choice: Pana żniwa
  rationale: „Pan” zachowuje znaczenie władzy i utrwalony język biblijny, natomiast „żniwo” pozostawia metaforę bez objaśniającej parafrazy.
- source_word: ὅπως
  choice: aby
  rationale: Wprowadza treść i zamierzony skutek prośby. „Aby” jest w tym zdaniu naturalnym polskim odpowiednikiem.
- source_word: ἐκβάλῃ
  choice: wyprawił
  rationale: ἐκβάλλω jest mocniejsze niż zwykłe „posłać” i może oznaczać wypchnięcie lub przynaglone wysłanie. „Wyprawił” naturalnie opisuje skierowanie robotników do pracy, a mocniejszy odcień czasownika zachowano w przypisie.
- source_word: ἐργάτας
  choice: robotników
  rationale: Wyraz oznacza ludzi wykonujących pracę. „Robotnicy” jest czytelnym i tradycyjnie zrozumiałym określeniem osób pracujących przy metaforycznym żniwie.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: na swoje żniwo
  rationale: Polskie „na żniwo” naturalnie wyraża skierowanie do pracy przy zbiorach. Zaimek „swoje” odnosi żniwo do podmiotu, czyli jego Pana, bez dodawania niewystępującego w tekście „pola”.
theological_decisions:
- issue: Tożsamość „Pana żniwa”
  choice: Pozostawiono tytuł „Pan żniwa” bez wskazania, czy chodzi konkretnie o Ojca, Jezusa, czy szerzej o Boga.
  alternative: Wyraźne utożsamienie Pana żniwa z Ojcem albo z Jezusem.
  rationale: Sam werset nie precyzuje referenta. Zachowanie tytułu bez dopowiedzenia pozostawia obecną w tekście otwartość teologiczną.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano biblijną metaforę żniwa oraz zwięzłą budowę wezwania. Forma „Proście usilnie” oddaje naglący charakter greckiego czasownika bez nadmiernej archaizacji.
