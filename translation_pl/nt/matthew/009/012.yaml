source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: pl
  text: 'Jezus zaś, gdy to usłyszał, powiedział: „Lekarza nie potrzebują ci, którzy są zdrowi, lecz ci, którzy są chorzy”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: Jezus zaś, gdy to usłyszał
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym. Dopełnienie „to” wynika z poprzedniego kontekstu, a imię „Jezus” jasno wskazuje domyślny podmiot. „Zaś” zachowuje przejściowo-kontrastową funkcję δέ.
- source_word: εἶπεν
  choice: powiedział
  rationale: Neutralnie i ściśle oddaje zwykły czasownik mówienia, bez dopowiadania, że była to formalna odpowiedź.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: nie potrzebują
  rationale: To naturalny polski odpowiednik idiomu oznaczającego brak potrzeby; szyk z „Lekarza” na początku zachowuje nacisk przysłowia.
- source_word: οἱ ἰσχύοντες
  choice: ci, którzy są zdrowi
  rationale: Choć czasownik dosłownie wiąże się z siłą, w medycznym przeciwstawieniu oznacza ludzi zdrowych. Takie ujęcie jest naturalne i zachowuje obraz tekstu.
- source_word: ἰατροῦ
  choice: lekarza
  rationale: Najbardziej naturalny i współczesny polski odpowiednik rzeczownika ἰατρός; dopełniacz wynika z czasownika „potrzebować”.
- source_word: οἱ κακῶς ἔχοντες
  choice: ci, którzy chorują
  rationale: Grecki idiom w tym zestawieniu medycznym oznacza ludzi chorych. Forma czasownikowa naturalnie odpowiada równoległemu opisowi grupy osób.
theological_decisions:
- issue: Dosłowny obraz medyczny a jego duchowe zastosowanie
  choice: Pozostawiono wypowiedź w kategoriach zdrowia, choroby i lekarza.
  alternative: Dopowiedzieć w przekładzie, że chodzi o grzeszników potrzebujących duchowego uzdrowienia.
  rationale: Sam werset formułuje przysłowie medyczne, natomiast jego duchowe zastosowanie wynika z kontekstu. Przekład nie powinien usuwać tej warstwy obrazowej ani przedwcześnie rozstrzygać jej interpretacji.
translation_notes:
  register: Współczesna, godna i łatwo zrozumiała polszczyzna. Zachowano zwięzłą formę przysłowia oraz wyraźny kontrast między zdrowymi a chorującymi.
