  source_fidelity: Przekład trafnie oddaje funkcję χρονową imiesłowu ἀκούσας („gdy to usłyszał”), łagodne przejście δέ („zaś”), prosty czasownik εἶπεν („powiedział”) oraz medyczny sens obu członów przysłowia. „Zdrowi” właściwie przekazuje οἱ ἰσχύοντες w tym kontekście. Bezpieczniej jest jednak oddać οἱ κακῶς ἔχοντες jako stan („są chorzy”), a nie aspekt czynnościowy („chorują”).
  naturalness: Tekst jest naturalny, zwięzły i utrzymany we współczesnym, godnym rejestrze. Zestawienie „zdrowi” / „chorzy” jest w polszczyźnie bardziej idiomatyczne i symetryczne niż „zdrowi” / „chorują”.
  terminology: „Lekarz” jest współczesnym i właściwym odpowiednikiem ἰατρός. Przekład zachowuje dosłowny obraz medyczny i nie dopowiada jego duchowej aplikacji.
