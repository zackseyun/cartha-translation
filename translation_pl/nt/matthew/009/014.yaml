source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: pl
  text: 'Wtedy podeszli do niego uczniowie Jana i zapytali: „Dlaczego my i faryzeusze często pościmy[a], a twoi uczniowie nie poszczą?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dużo pościmy” lub „wiele razy pościmy”; greckie πολλά w połączeniu z „pościć” wyraża częstą praktykę.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wskaźnik następstwa czasowego, zwięźle wprowadzający kolejne wydarzenie.
- source_word: προσέρχονται αὐτῷ
  choice: podeszli do niego
  rationale: Oddaje ruch w stronę Jezusa; polski czas przeszły odpowiada narracyjnemu użyciu greckiego czasu teraźniejszego.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: uczniowie Jana
  rationale: Naturalna konstrukcja dopełniaczowa zachowująca relację uczniów do Jana.
- source_word: λέγοντες
  choice: i zapytali
  rationale: W tym kontekście imiesłów wprowadza bezpośrednie pytanie; taka forma brzmi naturalnie po polsku i nie zmienia funkcji wypowiedzi.
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Standardowy, współczesny odpowiednik pytania o przyczynę.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: my i faryzeusze
  rationale: Zachowuje emfatyczne „my” oraz zestawienie obu grup.
- source_word: νηστεύομεν
  choice: pościmy
  rationale: Zwyczajny polski termin religijny oznaczający powstrzymywanie się od pokarmu w ramach praktyki pobożnościowej.
- source_word: πολλά
  choice: często
  rationale: Użyte przysłówkowo z czasownikiem „pościć” wskazuje najpewniej na częstotliwość praktyki; przypis zachowuje możliwy odcień ilościowy.
- source_word: οἱ δὲ μαθηταί σου
  choice: a twoi uczniowie
  rationale: Polskie „a” naturalnie wyraża kontrast bez nadawania pytaniu silniejszego tonu oskarżenia.
- source_word: οὐ νηστεύουσιν
  choice: nie poszczą
  rationale: Czas teraźniejszy przedstawia zwyczajową praktykę, zgodnie z kontrastem wobec częstego poszczenia.
theological_decisions:
- issue: Charakter zarzutu dotyczącego postu
  choice: Pytanie przedstawiono jako porównanie zwyczajowych praktyk religijnych.
  alternative: Można by zasugerować, że uczniowie Jezusa zaniedbują obowiązek, albo odnieść wypowiedź tylko do jednego konkretnego postu.
  rationale: Formy czasu teraźniejszego i πολλά wskazują na ogólny wzorzec praktyki. Przekład nie wzmacnia wypowiedzi do rangi jawnego oskarżenia ani nie ogranicza jej do pojedynczej okazji.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Narracyjne greckie praesens oddano naturalnym polskim czasem przeszłym. „Faryzeusze” zapisano małą literą zgodnie ze współczesną polską normą.
