  text: Wstał i poszedł do swojego domu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: więc
  rationale: W tym kontekście spójnik łączy polecenie Jezusa z jego bezpośrednim wykonaniem; polskie „więc” naturalnie oddaje następstwo i wynik bez przeciążania zdania.
- source_word: ἐγερθεὶς
  choice: wstał
  rationale: Imiesłów aorystu od ἐγείρω ma tu sens nieprzechodni. Skończona forma „wstał” brzmi naturalnie po polsku i zachowuje kolejność czynności.
- source_word: ἀπῆλθεν
  choice: poszedł
  rationale: Aoryst od ἀπέρχομαι oznacza odejście z danego miejsca. „Poszedł” jest w tym krótkim kontekście naturalne, a kierunek do domu jasno wskazuje oddalenie się.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: do swojego domu
  rationale: Przyimek εἰς wyraża ruch ku miejscu lub do jego wnętrza, a οἶκος oznacza dom. Zaimek zwrotny „swojego” jednoznacznie odnosi dom do podmiotu zdania.
