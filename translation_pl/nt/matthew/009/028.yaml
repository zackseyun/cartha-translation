  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: pl
  text: 'Gdy wszedł do domu, podeszli do Niego niewidomi, a Jezus zapytał ich: „Czy wierzycie, że mogę to uczynić?”. Odpowiedzieli Mu: „Tak, Panie[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Tak, panie”. Greckie κύριε może być uprzejmym zwrotem, ale może też wyrażać uznanie autorytetu Jezusa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Gdy wszedł do domu
  rationale: Imiesłów aorystu wprowadza kolejne zdarzenie w relacji czasowej. „Gdy wszedł do domu” naturalnie oddaje zarówno ruch do wnętrza, jak i następstwo narracji.
- source_word: προσῆλθον αὐτῷ
  choice: podeszli do Niego
  rationale: προσέρχομαι oznacza przyjście lub zbliżenie się do kogoś; „podeszli” jest zwięzłe i naturalne, a zarazem odróżnia ten czasownik od wcześniejszego ἔρχομαι.
- source_word: οἱ τυφλοί
  choice: niewidomi
  rationale: Rodzajnik z przymiotnikiem pełni funkcję rzeczownikową. Polski rzeczownik „niewidomi” jasno odnosi się do wcześniej wspomnianych dwóch mężczyzn bez zbędnego dopowiedzenia.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jezus zapytał ich
  rationale: Choć greka używa czasu teraźniejszego historycznego, polska narracja brzmi naturalniej w czasie przeszłym. Czasownik „zapytał” wynika z bezpośrednio następującego pytania i unika niezręcznego „powiedział im”.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Czy wierzycie, że mogę to uczynić?
  rationale: „Wierzycie” zachowuje sens πιστεύω jako ufnego przekonania, a „mogę” naturalnie oddaje δύναμαι. „Uczynić” utrzymuje godny rejestr bez nadmiernej archaizacji.
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 'Odpowiedzieli Mu: „Tak”'
  rationale: Historyczny czas teraźniejszy oddano polskim czasem przeszłym. W kontekście pytania „odpowiedzieli” jest idiomatyczne, natomiast Ναί to proste potwierdzenie „Tak”.
- source_word: κύριε
  choice: Panie
  rationale: Wołacz „Panie” zachowuje podstawowe znaczenie κύριε oraz możliwe uznanie autorytetu Jezusa, nie przesądzając, czy jest to pełne wyznanie chrystologiczne, czy uprzejmy zwrot.
theological_decisions:
- issue: Znaczenie κύριε w zwrocie do Jezusa
  choice: Panie
  alternative: proszę pana
  rationale: '„Panie” zachowuje zamierzoną dwuznaczność: może być pełnym szacunku zwrotem, a zarazem może wskazywać na rozpoznanie szczególnego autorytetu Jezusa. Polski przekład nie powinien tej napiętej wieloznaczności usuwać.'
- issue: Czasy teraźniejsze historyczne λέγει i λέγουσιν
  choice: 'Polski czas przeszły: „zapytał”, „odpowiedzieli”'
  alternative: 'Czas teraźniejszy historyczny: „pyta”, „odpowiadają”'
  rationale: Współczesna polska narracja biblijna naturalnie prowadzi tę scenę w czasie przeszłym. Zmiana nie usuwa żadnego istotnego sensu teologicznego ani relacji czasowej.
translation_notes:
  register: Współczesny, godny i zrozumiały język polski. Zachowano zwięzłość greckiej narracji. Wielką literę w zaimkach odnoszących się do Jezusa zastosowano jako polską konwencję szacunku, bez dodawania treści nieobecnej w tekście źródłowym.
