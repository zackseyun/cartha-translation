base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: pl
  text: 'I otworzyły się ich oczy. A Jezus stanowczo im nakazał[a]: „Uważajcie, żeby nikt się nie dowiedział”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „surowo ich ostrzegł” albo „stanowczo ich upomniał”. Grecki czasownik wyraża silne emocje i stanowczość nakazu.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „Uważajcie, niech nikt nie wie”. To, czego nikt nie ma wiedzieć, wynika z kontekstu uzdrowienia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: otworzyły się
  rationale: Grecki aoryst strony biernej opisuje przywrócenie wzroku idiomem „otworzyły się oczy”. W języku polskim taka konstrukcja jest naturalniejsza niż dosłowne „zostały otwarte”, a nie dodaje sprawcy.
- source_word: αὐτῶν οἱ ὀφθαλμοί
  choice: ich oczy
  rationale: Naturalny polski szyk zachowuje wyraźną informację o tym, że chodzi o oczy obu uzdrowionych.
- source_word: ἐνεβριμήθη
  choice: surowo ich przestrzegł
  rationale: Czasownik wyraża silne emocje i stanowczość. W kontekście następującego zakazu „surowo przestrzegł” oddaje zarówno siłę wypowiedzi, jak i jej ostrzegawczo-nakazowy charakter.
- source_word: λέγων
  choice: dwukropek po czasowniku mówienia
  rationale: Grecki imiesłów wprowadza treść ostrzeżenia. W naturalnej polszczyźnie jego funkcję przejrzyście oddaje bezpośrednie wprowadzenie cytatu, bez zbędnego „mówiąc”.
- source_word: Ὁρᾶτε
  choice: Uważajcie
  rationale: Imperatyw pełni funkcję stanowczego wezwania do dopilnowania, by zakaz został zachowany. „Uważajcie” jest naturalne i zachowuje odcień czujności.
- source_word: μηδεὶς γινωσκέτω
  choice: żeby nikt się nie dowiedział
  rationale: Grecki imperatyw trzeciej osoby z przeczeniem wyraża zakaz. Polski zwrot nie dopowiada gramatycznego dopełnienia „o tym”, lecz naturalnie pozostawia przedmiot wiedzy domyślny z kontekstu.
theological_decisions:
- issue: Siła nakazu Jezusa po uzdrowieniu
  choice: stanowczy zakaz rozgłaszania wydarzenia, bez podawania motywu
  alternative: Jezus ich zganił lub wydał im ścisły rozkaz
  rationale: Tekst wskazuje na silne, stanowcze ostrzeżenie, lecz nie objaśnia jego przyczyny. Przekład zachowuje tę siłę i nie dodaje teologicznego wyjaśnienia motywu Jezusa.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano semicki idiom otwarcia oczu, siłę ostrzeżenia oraz niewyrażony w grece przedmiot czasownika „wiedzieć”, nie wyjaśniając motywu nakazu milczenia.
