id: MAT.9.8
reference: Matthew 9:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: pl
  text: A gdy tłumy to zobaczyły, ogarnął je lęk[a] i oddały chwałę Bogu, który dał ludziom[b] taką władzę.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki czasownik dosłowniej oznacza, że się przestraszyli; w tym kontekście lęk może obejmować także pełną czci bojaźń.
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „ludziom” — w liczbie mnogiej. Sformułowanie może odnosić się do ludzi ogólnie, choć w tej scenie władzę tę wykonuje Jezus.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδόντες
  choice: gdy ... zobaczyły
  rationale: Imiesłów aorystu oddano naturalnym w polskiej narracji zdaniem czasowym. Zaimek „to” wskazuje na opisane wcześniej uzdrowienie, nie rozstrzygając dokładniej jego przedmiotu.
- source_word: δὲ
  choice: A
  rationale: Partykuła wprowadza kolejny etap narracji i reakcję tłumów; polskie „A” brzmi naturalniej niż silnie kontrastujące „Ale”.
- source_word: οἱ ὄχλοι
  choice: tłumy
  rationale: Zachowano liczbę mnogą greckiego rzeczownika oraz współczesne, naturalne brzmienie.
- source_word: ἐφοβήθησαν
  choice: ogarnął je lęk
  rationale: Sformułowanie zachowuje podstawowe znaczenie strachu, a zarazem nie wyklucza pełnego czci przejęcia wynikającego z kontekstu.
- source_word: ἐδόξασαν
  choice: oddały chwałę
  rationale: Utrwalony i zrozumiały polski odpowiednik czasownika δοξάζω zachowuje jego teologiczną wagę.
- source_word: τὸν θεὸν
  choice: Bogu
  rationale: Celownik wynika z polskiej konstrukcji „oddać chwałę komuś” i odpowiada greckiemu dopełnieniu czasownika.
- source_word: τὸν δόντα
  choice: który dał
  rationale: Imiesłów aorystu odnoszący się do Boga oddano naturalnym zdaniem względnym; polski aspekt dokonany wystarczająco zaznacza uprzedniość czynności.
- source_word: ἐξουσίαν
  choice: władzę
  rationale: „Władza” trafniej niż sama „moc” wyraża uprawnienie i autorytet, istotne w kontekście odpuszczania grzechów.
- source_word: τοιαύτην
  choice: taką
  rationale: Bezpośredni i idiomatyczny odpowiednik określenia wskazującego na tego rodzaju władzę.
- source_word: τοῖς ἀνθρώποις
  choice: ludziom
  rationale: Greckie ἄνθρωποι oznacza tutaj ludzi i występuje w liczbie mnogiej. Polski rzeczownik „ludzie” naturalnie obejmuje osoby obu płci, zachowując zarazem kontrast między Bogiem a ludźmi.
theological_decisions:
- issue: Czy reakcję tłumów oddać jako strach, czy jako pełen czci podziw
  choice: ogarnął je lęk
  alternative: zdumiały się pełne bojaźni
  rationale: Grecki czasownik przede wszystkim oznacza lęk lub strach, choć kontekst uwielbienia Boga dopuszcza także religijną bojaźń. Tekst główny zachowuje tę napiętą wieloznaczność zamiast ograniczać reakcję do podziwu.
- issue: Zakres wyrażenia τοῖς ἀνθρώποις
  choice: ludziom
  alternative: człowiekowi
  rationale: Zachowano grecką liczbę mnogą. Nie zawężono wypowiedzi wyłącznie do Jezusa ani nie rozwinięto jej w ogólne twierdzenie doktrynalne o całej ludzkości.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja „oddały chwałę Bogu” zachowuje biblijną podniosłość bez archaizacji. Zgodność rodzaju i liczby („tłumy… zobaczyły… oddały”) jest naturalna we współczesnej polszczyźnie.
