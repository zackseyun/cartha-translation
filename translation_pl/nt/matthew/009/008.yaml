  source_fidelity: 'Tekst wiernie oddaje grecką kolejność zdarzeń i sens: imiesłów ἰδόντες naturalnie ujęto jako „gdy ... zobaczyły”, ἐφοβήθησαν jako reakcję lęku, ἐδόξασαν jako oddanie chwały Bogu, a ἐξουσίαν jako „władzę”. „Ludziom” poprawnie zachowuje liczbę mnogą i ogólnoludzki zakres τοῖς ἀνθρώποις, nie zawężając go interpretacyjnie do Jezusa.'
