review_pass:
  verdict: revise
  source_fidelity: Sens zasadniczo oddany poprawnie, lecz „była zdrowa” słabiej niż greckie ἐσώθη wyraża zaistniałe uzdrowienie i pozostawia nieco nienaturalną w tym kontekście konstrukcję stanową. „Została uzdrowiona” bezpośrednio oddaje rezultat czynności i zachowuje fizyczny sens narracyjnego podsumowania.
  naturalness: Pierwsze zdanie jest naturalne i ma godny, współczesny rejestr. „I od tej chwili kobieta była zdrowa” jest zrozumiałe, ale w polskiej narracji biblijnej i współczesnej najnaturalniej brzmi „kobieta została uzdrowiona od tej chwili” albo „od tej chwili kobieta została uzdrowiona”.
  terminology: „Wiara”, „córko” i „Odwagi” są trafne. „Ocaliła cię” zachowuje szerokość σῴζω, a przypis właściwie sygnalizuje wariant uzdrowienia. Dla ἐσώθη należy użyć „została uzdrowiona”, zgodnie z bezpośrednim kontekstem i z rozróżnieniem obecnym w angielskim audycie.
  issues:
  - severity: low
    issue: „była zdrowa” jako przekład ἐσώθη
    rationale: Wyrażenie opisuje stan, podczas gdy aoryst pasywny σῴζω w tym miejscu podsumowuje dokonane uzdrowienie. „Została uzdrowiona” jest bliższe formie i bardziej idiomatyczne, nie zmieniając sensu.
