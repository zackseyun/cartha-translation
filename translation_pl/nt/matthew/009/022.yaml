  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: pl
  text: 'Jezus zaś odwrócił się, zobaczył ją i powiedział: „Odwagi, córko! Twoja wiara cię ocaliła[a]”. I od tej chwili kobieta została uzdrowiona.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „uzdrowiła cię” lub „przywróciła ci zdrowie”. Grecki czasownik może oznaczać ocalenie, zbawienie albo uzdrowienie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: odwrócił się, zobaczył ją
  rationale: Polskie czasowniki osobowe naturalnie oddają następujące po sobie greckie imiesłowy aorystu, nie doprecyzowując kierunku obrotu.
- source_word: Θάρσει
  choice: Odwagi
  rationale: Zwięzły, współczesny polski odpowiednik wezwania do ufności i śmiałości.
- source_word: θύγατερ
  choice: córko
  rationale: Zachowuje bezpośredni, rodzinny i czuły charakter zwrotu bez dodawania określenia nieobecnego w grece.
- source_word: πίστις
  choice: wiara
  rationale: Najpełniej zachowuje religijny sens terminu, obejmujący w tym kontekście ufne zawierzenie.
- source_word: σέσωκέν σε
  choice: cię ocaliła
  rationale: Oddaje perfectum oraz szeroki zakres σῴζω, który może obejmować zarówno ocalenie, jak i uzdrowienie; szyk z enklitycznym „cię” jest naturalny po polsku.
- source_word: ἐσώθη
  choice: była zdrowa
  rationale: W narracyjnym podsumowaniu kontekst wskazuje na ustąpienie fizycznej dolegliwości. Stanowe sformułowanie dobrze łączy rezultat z określeniem „od tej chwili”.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: od tej chwili
  rationale: Naturalny polski idiom czasowy; greckie ὥρα może w tym zwrocie oznaczać moment, niekoniecznie pełną godzinę.
theological_decisions:
- issue: Znaczenie πίστις
  choice: wiara
  alternative: ufność
  rationale: „Wiara” zachowuje szerszy sens religijny, a „ufność” trafnie wyraża możliwy odcień tego miejsca, lecz nie wyczerpuje całego zakresu terminu.
- issue: Znaczenie σῴζω w wypowiedzi Jezusa i podsumowaniu narratora
  choice: „ocaliła” w wypowiedzi Jezusa, a „była zdrowa” w podsumowaniu
  alternative: „uzdrowiła” w obu miejscach
  rationale: Rozróżnienie zachowuje szerszy, potencjalnie zbawczy wydźwięk słów Jezusa, podczas gdy końcowe zdanie jasno wskazuje na konkretny skutek fizyczny. Nie zaciera to celowego powtórzenia tego samego greckiego rdzenia, ponieważ przypis ujawnia jego zakres znaczeniowy.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Krótkie „Odwagi” brzmi naturalnie, a „córko” zachowuje czułość zwrotu. Tekst unika archaicznego „od owej godziny”, wybierając zrozumiałe „od tej chwili”.
