source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: pl
  text: '„Abyście jednak wiedzieli, że Syn Człowieczy ma na ziemi władzę odpuszczać grzechy” — wtedy mówi do sparaliżowanego[a]: „Wstań, weź swoje posłanie[b] i idź do domu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dosłownie forma ta może znaczyć „sparaliżowany”; tradycyjnie także „paralityk”.
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „łóżko” albo „mata”. Greckie κλίνη może oznaczać łóżko, legowisko lub przenośne posłanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Abyście jednak wiedzieli
  rationale: ἵνα wyraża tu cel, a δέ łagodne przeciwstawienie lub przejście. Polski szyk zachowuje oba elementy i brzmi naturalnie.
- source_word: ἐξουσίαν ἔχει
  choice: ma władzę
  rationale: ἐξουσία oznacza uprawnioną władzę lub prawo, nie tylko zdolność; „ma władzę” dobrze odpowiada kontekstowi odpuszczania grzechów.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Tradycyjny polski tytuł zachowuje Jezusowe samookreślenie oraz możliwe nawiązanie do Daniela 7.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: To naturalny polski odpowiednik określający sferę, w której Syn Człowieczy sprawuje tę władzę.
- source_word: ἀφιέναι ἁμαρτίας
  choice: odpuszczać grzechy
  rationale: W tym kontekście ἀφίημι oznacza przebaczać lub darować grzechy; „odpuszczać grzechy” jest utrwalonym i precyzyjnym polskim wyrażeniem.
- source_word: τότε λέγει
  choice: wtedy mówi
  rationale: Zachowano grecki czas teraźniejszy historyczny, który nadaje narracji żywość.
- source_word: τῷ παραλυτικῷ
  choice: do sparaliżowanego
  rationale: Przymiotnik jest użyty rzeczownikowo. Forma „sparaliżowany” jest współczesna i zrozumiała, bez dodawania rzeczownika nieobecnego w tekście.
- source_word: Ἐγερθεὶς
  choice: Wstań
  rationale: Choć formalnie jest to imiesłów aorystu, w ciągu poleceń ma siłę rozkazu; „Wstań” oddaje ją naturalnie.
- source_word: ἆρόν
  choice: weź
  rationale: αἴρω oznacza tu podnieść i zabrać. W połączeniu z posłaniem polskie „weź” zwięźle obejmuje ten sens.
- source_word: κλίνην
  choice: posłanie
  rationale: κλίνη może oznaczać łóżko, legowisko lub przenośną matę. „Posłanie” zachowuje szerokość znaczenia i pasuje do przedmiotu, który można zabrać.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: idź do domu
  rationale: οἶκος może oznaczać dom jako budynek lub miejsce zamieszkania; idiomatyczne „do domu” wiernie oddaje kierunek i sens polecenia.
theological_decisions:
- issue: Chrystologiczny tytuł ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Człowiek / Istota ludzka
  rationale: Utrwalony tytuł zachowuje jego funkcję jako samookreślenia Jezusa i możliwy rezonans Daniela 7, nie rozstrzygając całego zakresu znaczeniowego przez parafrazę.
- issue: Charakter ἐξουσία przy odpuszczaniu grzechów
  choice: władza
  alternative: moc / prawo
  rationale: Werset podkreśla prawomocną władzę odpuszczania grzechów, a nie jedynie zdolność dokonania cudu; „władza” zachowuje to roszczenie bez jego rozszerzania.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rejestrze. Zachowano tradycyjny tytuł „Syn Człowieczy” i teraźniejszy czas historyczny „mówi”. Wielokropek i pauza sygnalizują przerwanie wypowiedzi narracyjnym wtrąceniem, odzwierciedlając grecką anakolutyczną konstrukcję.
