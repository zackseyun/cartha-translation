  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: pl
  text: Oni jednak, gdy wyszli, rozgłosili wieść o nim po całej tamtejszej okolicy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „po całej tamtej ziemi”. Greckie słowo γῆ może oznaczać „ziemię”, „krainę”, „okolicę” lub „obszar”.'
    reason: Alternatywa leksykalna zachowująca zakres znaczeniowy greckiego γῆ.
lexical_decisions:
- source_word: δὲ
  choice: jednak
  rationale: Sygnalizuje łagodny kontrast z wcześniejszym nakazem Jezusa, by nikomu o tym nie mówili, a zarazem brzmi naturalnie w polskiej narracji.
- source_word: ἐξελθόντες
  choice: gdy wyszli
  rationale: Imiesłów aorystu wskazuje czynność poprzedzającą lub towarzyszącą czynności głównej; „gdy wyszli” zachowuje naturalny porządek wydarzeń.
- source_word: διεφήμισαν
  choice: rozgłosili wieść
  rationale: Czasownik oznacza szerokie rozpowszechnienie wiadomości lub rozgłosu. Takie sformułowanie jest naturalne po polsku i oddaje intensywność greckiego czasownika.
- source_word: αὐτὸν
  choice: o nim
  rationale: Grecki zaimek jest dopełnieniem bliższym czasownika, lecz przy polskim wyrażeniu „rozgłosili wieść” relację naturalnie oddaje konstrukcja „o nim”.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: po całej tamtejszej okolicy
  rationale: W tym lokalnym kontekście γῆ może oznaczać okolicę lub obszar. Przyimek „po” dobrze oddaje rozprzestrzenienie wiadomości na całym terenie.
theological_decisions:
- issue: Zakres geograficzny rzeczownika γῆ
  choice: okolica
  alternative: ziemia; kraina
  rationale: Kontekst opisuje lokalne rozchodzenie się wieści o Jezusie. „Okolica” nie rozszerza niepotrzebnie zasięgu, a przypis zachowuje szerszą możliwość leksykalną.
translation_notes:
  register: Współczesny, zrozumiały i godny styl narracyjny. Szyk „Oni jednak” uwydatnia kontrast z nakazem milczenia z poprzedniego wersetu, bez nadmiernej emfazy.
