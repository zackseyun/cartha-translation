id: MAT.9.25
reference: Matthew 9:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: pl
  text: Gdy zaś wyproszono tłum, wszedł, wziął ją za rękę, a dziewczynka wstała[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „została podniesiona”. Grecki czasownik można w tym miejscu rozumieć zarówno jako „wstała”, jak i „została podniesiona”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Gdy zaś
  rationale: ὅτε wprowadza zdanie czasowe, a δέ jest łagodnym spójnikiem narracyjnym. „Gdy zaś” zachowuje oba elementy i brzmi naturalnie w polskiej narracji.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: wyproszono tłum
  rationale: Aoryst strony biernej ἐκβάλλω oznacza tu usunięcie zgromadzonych z pomieszczenia. Polska konstrukcja bezosobowa zachowuje nieokreślonego wykonawcę, a „wyproszono” naturalnie oddaje czynność w tym kontekście bez sugerowania egzorcyzmu.
- source_word: εἰσελθὼν
  choice: wszedł
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą główne działanie. Osobowa forma „wszedł” jest zwięzła i naturalna w polskiej narracji.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: wziął ją za rękę
  rationale: κρατέω z dopełniaczem oznacza uchwycenie lub wzięcie za rękę. Wybrany zwrot jest utartym, współczesnym polskim odpowiednikiem.
- source_word: ἠγέρθη
  choice: wstała
  rationale: Forma ἐγείρω może w tym kontekście opisywać zarówno powstanie dziewczynki, jak i jej podniesienie przez zewnętrzne działanie. „Wstała” jest naturalnym polskim opisem rezultatu, natomiast możliwe odczytanie bierne zachowano w przypisie.
- source_word: τὸ κοράσιον
  choice: dziewczynka
  rationale: κοράσιον oznacza dziewczynkę lub młodą dziewczynę. Zdrobnieniowa forma jest w polszczyźnie zwyczajnym, nieafektowanym określeniem dziecka płci żeńskiej i pasuje do kontekstu.
theological_decisions:
- issue: Sposób oddania ἠγέρθη w opisie przywrócenia dziewczynki do życia
  choice: wstała
  alternative: została podniesiona
  rationale: Grecka forma jest morfologicznie bierna, lecz czasownik ἐγείρω bywa używany w znaczeniu nieprzechodnim „wstać, powstać”. Tekst główny przedstawia rezultat w naturalnej polszczyźnie, a przypis zachowuje możliwość odczytania biernego bez przesądzania sposobu działania ani dodawania wyraźnego terminu „została wskrzeszona”.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zdanie zachowuje zwięzłość greckiego oryginału, a konstrukcje „wyproszono tłum” i „wziął ją za rękę” brzmią naturalnie we współczesnej polszczyźnie.
