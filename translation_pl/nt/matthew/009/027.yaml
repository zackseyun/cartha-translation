  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: pl
  text: 'Gdy Jezus odchodził stamtąd, poszli za Nim dwaj niewidomi, wołając: „Zmiłuj się nad nami, Synu Dawida!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Syn Dawida” to tytuł królewsko-mesjański, wskazujący na Jezusa jako obiecanego dziedzica z rodu Dawida.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: odchodził stamtąd
  rationale: Imiesłów czasu teraźniejszego wskazuje na czynność trwającą równocześnie z podążaniem niewidomych. „Odchodził stamtąd” naturalnie oddaje przemieszczanie się Jezusa z tamtego miejsca, bez sugerowania, że jedynie przechodził obok tych ludzi.
- source_word: ἠκολούθησαν αὐτῷ
  choice: poszli za Nim
  rationale: W tym kontekście ἀκολουθέω opisuje fizyczne podążanie za Jezusem. Polski zwrot jest naturalny i zachowuje narracyjny sens.
- source_word: δύο τυφλοὶ
  choice: dwaj niewidomi
  rationale: Grecki przymiotnik w rodzaju męskim występuje rzeczownikowo i oznacza dwóch niewidomych mężczyzn. „Dwaj niewidomi” jest zwięzłe, współczesne i zgodne z formą źródłową.
- source_word: κράζοντες καὶ λέγοντες
  choice: wołając
  rationale: κράζω wyraża głośne, usilne wołanie, a λέγοντες wprowadza jego treść. W naturalnej polszczyźnie jedno „wołając” oddaje obie funkcje bez niezręcznego powtórzenia.
- source_word: Ἐλέησον ἡμᾶς
  choice: Zmiłuj się nad nami
  rationale: Rozkaźnik jest bezpośrednią prośbą o miłosierne działanie. „Zmiłuj się nad nami” to utrwalony, precyzyjny i nadal zrozumiały polski odpowiednik.
- source_word: υἱὲ Δαυίδ
  choice: Synu Dawida
  rationale: Zachowano tradycyjny tytuł w wołaczu, zamiast zastępować go objaśniającym „potomku Dawida”, ponieważ w Ewangelii Mateusza ma on królewsko-mesjański wydźwięk.
theological_decisions:
- issue: Mesjańskie znaczenie określenia „Syn Dawida”
  choice: Zachować w tekście tytuł „Synu Dawida”
  alternative: Oddać objaśniająco jako „Mesjaszu, Synu Dawida” lub „potomku Dawida”
  rationale: Grecki tekst podaje tradycyjny tytuł bez dopowiedzenia. Zachowanie jego formy pozostawia czytelnikowi pełne królewskie i mesjańskie napięcie obecne w narracji Mateusza, bez dodawania interpretacji do tekstu głównego.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zastosowano naturalną składnię, a utrwalone wyrażenia „Zmiłuj się nad nami” i „Synu Dawida” zachowują podniosłość bez archaizacji. Marker przypisu umieszczono bezpośrednio po tytule, którego dotyczy.
