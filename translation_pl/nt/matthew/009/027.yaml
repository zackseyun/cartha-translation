  source_fidelity: 'Tekst wiernie oddaje sens grecki: czynność Jezusa odbywa się w tle („Gdy Jezus odchodził stamtąd”), dwaj niewidomi podążają za nim, a ich głośna prośba zachowuje bezpośredni charakter imperatywu Ἐλέησον. „Synu Dawida” poprawnie oddaje wołacz υἱὲ Δαυίδ i zachowuje tytularny charakter wyrażenia.'
  naturalness: Przekład jest naturalny we współczesnej, godnej polszczyźnie. „Poszli za Nim”, „wołając” oraz „Zmiłuj się nad nami” brzmią idiomatycznie i pasują do narracji ewangelicznej. Zredukowanie dosłownego „wołając i mówiąc” do „wołając:” jest stylistycznie uzasadnione i nie gubi treści.
  terminology: „Niewidomi” jest poprawnym, współczesnym określeniem odpowiadającym τυφλοί. „Zmiłuj się nad nami” trafnie oddaje prośbę o miłosierdzie. „Synu Dawida” zachowuje tradycyjny królewsko-mesjański tytuł bez interpretacyjnego dopowiedzenia w tekście głównym. Przypis objaśnia jego funkcję rzeczowo, bez narzucania konfesyjnej wykładni.
