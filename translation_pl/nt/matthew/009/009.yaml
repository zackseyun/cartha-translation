id: MAT.9.9
reference: Matthew 9:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: pl
  text: 'Gdy Jezus odchodził stamtąd, zobaczył człowieka imieniem Mateusz, siedzącego w miejscu poboru podatków. Mówi do niego[a]: „Pójdź za mną”. Wtedy Mateusz wstał i poszedł za nim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „powiedział do niego”. W tekście greckim występuje czas teraźniejszy historyczny: „mówi”, nadający opowiadaniu żywość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: Gdy Jezus odchodził stamtąd
  rationale: Imiesłów czasu teraźniejszego ukazuje czynność trwającą w chwili zobaczenia Mateusza, a ἐκεῖθεν wskazuje na oddalanie się z poprzedniego miejsca.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: Polskie „człowieka” naturalnie odnosi się tutaj do konkretnego mężczyzny, a zarazem ściśle odpowiada ogólnemu rzeczownikowi ἄνθρωπος.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: siedzącego w miejscu poboru podatków
  rationale: Sformułowanie jasno opisuje stanowisko poborcy i jest zrozumialsze dla współczesnego czytelnika niż tradycyjna „komora celna”; nie przesądza też, czy pobierano tam cło, myto czy inny podatek.
- source_word: Μαθθαῖον λεγόμενον
  choice: imieniem Mateusz
  rationale: Oddaje informację, że człowiek ten nazywał się Mateusz, w naturalnej współczesnej polszczyźnie.
- source_word: λέγει αὐτῷ
  choice: Mówi do niego
  rationale: Zachowano grecki czas teraźniejszy historyczny, który ożywia narrację.
- source_word: Ἀκολούθει μοι
  choice: Pójdź za mną
  rationale: Naturalny i godny polski odpowiednik wezwania do podążania za Jezusem; zachowuje zarówno sens konkretnego pójścia, jak i wynikającą z kontekstu więź ucznia z nauczycielem.
- source_word: ἀναστὰς ἠκολούθησεν αὐτῷ
  choice: Mateusz wstał i poszedł za nim
  rationale: Oddaje kolejność czynności wyrażoną przez imiesłów i czasownik główny. Powtórzenie imienia usuwa możliwą w polszczyźnie niejasność zaimka bez zmiany sensu.
theological_decisions:
- issue: Charakter wezwania Jezusa
  choice: „Pójdź za mną” bez objaśniającego rozwinięcia
  alternative: „Zostań moim uczniem”
  rationale: Kontekst wskazuje na powołanie do uczniostwa, lecz tekst grecki wyraża je prostym nakazem podążania za Jezusem. Przekład nie dopowiada technicznego objaśnienia.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano żywy czas teraźniejszy w słowach narratora oraz uniknięto archaicznego wyrażenia „komora celna”. Zaimek w ostatnim zdaniu zastąpiono imieniem Mateusza dla jednoznaczności.
