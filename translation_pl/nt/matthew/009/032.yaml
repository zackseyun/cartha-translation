  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: pl
  text: Kiedy zaś tamci wychodzili, oto przyprowadzono do niego człowieka niemego[a], opętanego przez demona[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „głuchego”. Greckie słowo może zależnie od kontekstu oznaczać człowieka niemego albo głuchego; wzmianka w następnym wersecie, że przemówił, przemawia tu za „niemego”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „będącego pod władzą demona”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Kiedy zaś tamci wychodzili
  rationale: Konstrukcja dopełniacza absolutnego wyraża równoczesność, a δέ sygnalizuje przejście w narracji. „Tamci” naturalnie odsyła do osób z poprzedniego kontekstu i zachowuje zaimek αὐτῶν.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje funkcję zwrócenia uwagi i narracyjną wyrazistość, pozostając naturalne w podniosłej, współczesnej polszczyźnie.
- source_word: προσήνεγκαν αὐτῷ
  choice: przyprowadzono do niego
  rationale: Polska forma bezosobowa zachowuje nieokreślony podmiot liczby mnogiej i jasno oddaje kierunek wyrażony przez αὐτῷ.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: Oddaje ogólny rzeczownik ἄνθρωπος bez dodawania informacji ponad tekst; w polszczyźnie jest naturalne w tej konstrukcji.
- source_word: κωφὸν
  choice: niemego
  rationale: κωφός może oznaczać osobę głuchą lub niemą. Kontekst następnego wersetu, w którym człowiek zaczyna mówić, przemawia tu za „niemego”, przy zachowaniu alternatywy w przypisie.
- source_word: δαιμονιζόμενον
  choice: opętanego przez demona
  rationale: Naturalne i rozpoznawalne polskie określenie stanu opisanego przez δαιμονίζομαι; wskazanie „przez demona” zachowuje jednostkowy sens formy greckiej i nie rozwija szczegółowej demonologii.
theological_decisions:
- issue: Sposób oddania demonicznego udręczenia
  choice: opętanego przez demona
  alternative: będącego pod władzą demona
  rationale: Tekst przedstawia rzeczywiste działanie demona, lecz nie objaśnia dokładnego charakteru ani stopnia jego wpływu. Główne brzmienie jest idiomatyczne, a przypis zachowuje mniej interpretujące sformułowanie alternatywne.
translation_notes:
  register: Współczesny, godny styl narracyjny. „Oto” zachowuje wyrazisty sygnał narracyjny tekstu greckiego. Szyk z imiesłowem „opętanego” jest naturalny po polsku i zachowuje równoległe określenia człowieka bez przeciążenia zdania.
