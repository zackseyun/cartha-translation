lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Zachowuje prosty spójnik narracyjny i naturalnie łączy zdanie z poprzednim wydarzeniem.
- source_word: ἐξῆλθεν
  choice: rozeszła się
  rationale: Grecki czasownik dosłownie oznacza „wyszła”, lecz w połączeniu z φήμη naturalny polski idiom „wieść rozeszła się” wiernie oddaje obraz rozpowszechniania się wiadomości.
- source_word: ἡ φήμη αὕτη
  choice: ta wieść
  rationale: „Wieść” oznacza krążącą wiadomość bez sugerowania jej fałszywości, a „ta” wskazuje na relację o właśnie opisanym wydarzeniu.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: po całej tamtej okolicy
  rationale: W tym lokalnym kontekście γῆ oznacza najpewniej obszar lub krainę. Przy czasowniku „rozeszła się” przyimek „po” naturalnie wyraża objęcie wiadomością całego obszaru.
