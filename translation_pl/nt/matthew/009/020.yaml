id: MAT.9.20
reference: Matthew 9:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: pl
  text: A oto kobieta, która od dwunastu lat cierpiała na krwawienie, podeszła do Niego od tyłu i dotknęła skraju[a][b] Jego szaty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „rąbka”, „frędzla” lub „chwostu”. Greckie słowo może oznaczać skraj albo obramowanie szaty, być może wraz z frędzlem lub chwostem charakterystycznym dla żydowskiego stroju.'
    reason: lexical_alternative
  - marker: b
    text: Tło dotyczące frędzli lub chwostów przy szatach w Prawie Izraela zob. Liczb 15:38 oraz Powtórzonego Prawa 22:12.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: A oto
  rationale: Zachowuje żywy znacznik narracyjny i zwraca uwagę na niespodziewane pojawienie się kobiety, a zarazem brzmi naturalnie i godnie we współczesnej polszczyźnie.
- source_word: γυνὴ
  choice: kobieta
  rationale: Proste, nieokreślone wprowadzenie postaci, zgodne z greckim tekstem.
- source_word: αἱμορροοῦσα
  choice: która ... cierpiała na krwawienie
  rationale: Oddaje przewlekły charakter dolegliwości bez sugerowania wyłącznie ostrego krwotoku; czas trwania został naturalnie włączony w zdanie.
- source_word: δώδεκα ἔτη
  choice: od dwunastu lat
  rationale: Naturalny polski sposób wyrażenia trwającego stanu, odpowiadający greckiemu określeniu rozciągłości czasu.
- source_word: προσελθοῦσα ὄπισθεν
  choice: podeszła do Niego od tyłu
  rationale: Oddaje zarówno zbliżenie się do Jezusa, jak i kierunek podejścia. Dopełnienie „do Niego” wynika jasno z kontekstu.
- source_word: ἥψατο
  choice: dotknęła
  rationale: Najlepiej odpowiada znaczeniu czasownika w tej scenie i nie wzmacnia kontaktu do „chwycenia”.
- source_word: τοῦ κρασπέδου
  choice: skraju
  rationale: Greckie słowo może oznaczać skraj, rąbek, frędzel lub chwost szaty. „Skraj” zachowuje ogólność terminu i nie rozstrzyga, czy chodzi dokładnie o rytualny chwost.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: Jego szaty
  rationale: „Szata” jest szerokim i naturalnym odpowiednikiem ἱμάτιον, bez nadmiernego zawężenia do płaszcza lub konkretnego kroju ubrania.
theological_decisions:
- issue: Możliwe żydowskie znaczenie κράσπεδον jako frędzla lub chwostu przy skraju szaty
  choice: W tekście głównym użyto ogólnego określenia „skraj”, a możliwość odniesienia do frędzla lub chwostu podano w przypisie.
  alternative: Przetłumaczyć bezpośrednio jako „frędzel” lub „chwost”, mocniej uwydatniając związek z przepisami Prawa.
  rationale: Sam werset nie objaśnia symboliki tej części szaty. Ogólne tłumaczenie zachowuje zakres znaczeniowy greckiego słowa, natomiast przypisy udostępniają istotne tło kulturowe bez narzucania go tekstowi głównemu.
translation_notes:
  register: Współczesny, zrozumiały i godny styl narracyjny. Zwrot „A oto” zachowuje wyrazistość greckiego ἰδού, a „cierpiała na krwawienie” przedstawia przewlekłą dolegliwość bez archaizacji. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej konwencji religijnej, nie zmieniając sensu źródła.
