id: MAT.9.34
reference: Matthew 9:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: pl
  text: 'Lecz faryzeusze mówili: „Za sprawą władcy[a] demonów wyrzuca demony”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „księcia”.'
    reason: Alternatywny odpowiednik ἄρχων; „książę” jest tradycyjny, ale może kojarzyć się ze statusem arystokratycznym bardziej niż ze sprawowaniem władzy.
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: Spójnik wprowadza przeciwstawienie wobec wcześniejszej reakcji tłumu i naturalnie oddaje tu adwersatywną funkcję δέ.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona we współczesnej polszczyźnie nazwa tej żydowskiej grupy; grecki rodzajnik nie wymaga osobnego odpowiednika w języku polskim.
- source_word: ἔλεγον
  choice: mówili
  rationale: Polski czasownik niedokonany naturalnie zachowuje aspekt imperfectum, wskazujący na trwającą lub powtarzaną wypowiedź, bez niezręcznego „mawiali”.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Za sprawą władcy
  rationale: 'ἐν z celownikiem ma tutaj sens instrumentalny: wskazuje rzekome źródło lub pośrednictwo mocy. „Za sprawą” brzmi naturalnie i nie sugeruje przestrzennego znaczenia „w”.'
- source_word: ἄρχοντι
  choice: władcy
  rationale: „Władca” jasno oddaje osobę sprawującą zwierzchnią władzę. Tradycyjne „książę” pozostaje możliwym odpowiednikiem, lecz we współczesnej polszczyźnie może przede wszystkim kojarzyć się z tytułem arystokratycznym.
- source_word: τῶν δαιμονίων
  choice: demonów
  rationale: Dopełniacz oddaje zależność od „władcy”; polszczyzna nie ma rodzajnika, więc określoność greckiej frazy wynika z kontekstu.
- source_word: ἐκβάλλει
  choice: wyrzuca
  rationale: „Wyrzuca” jest bezpośrednim, zrozumiałym odpowiednikiem ἐκβάλλω i zachowuje słownictwo związane z wypędzaniem demonów.
- source_word: τὰ δαιμόνια
  choice: demony
  rationale: Termin precyzyjnie odpowiada δαιμόνια i nie zastępuje go szerszym wyrażeniem „złe duchy”; brak rodzajnika w polskim nie usuwa kontekstowej określoności.
theological_decisions:
- issue: Oddanie δαιμόνια w kontekście egzorcyzmu
  choice: demony
  alternative: złe duchy
  rationale: Grecki tekst używa rzeczownika δαιμόνια, a nie wyrażenia πνεύματα πονηρά. „Demony” najdokładniej zachowuje jego konkretną treść i nadprzyrodzony charakter zarzutu.
- issue: Charakter oskarżenia dotyczącego źródła mocy Jezusa
  choice: Za sprawą władcy demonów
  alternative: Władcą demonów / w władcy demonów
  rationale: Instrumentalne rozumienie ἐν zachowuje oskarżenie, że Jezus działa dzięki mocy lub pośrednictwu zwierzchnika demonów, nie utożsamiając Go bezpośrednio z tym władcą.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Niedokonane „mówili” zachowuje trwający lub powtarzany charakter greckiego imperfectum. Szyk wypowiedzi pozostaje bliski grece, a „za sprawą” naturalnie wyraża narzędzie lub źródło działania.
