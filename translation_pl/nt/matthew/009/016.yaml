  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: pl
  text: Nikt też nie przyszywa do starego ubrania łaty z materiału, który się jeszcze nie skurczył[a], bo łata odrywa się od ubrania i powstaje gorsze rozdarcie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „z tkaniny niepoddanej folowaniu”. Greckie określenie oznacza tkaninę, która nie przeszła jeszcze obróbki powodującej jej skurczenie; po przyszyciu może więc napierać na stare ubranie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Nikt też nie
  rationale: οὐδεὶς wyraża powszechne przeczenie, a δὲ łagodne przejście lub nawiązanie do poprzedniego przykładu; „też” brzmi naturalnie w polskim kontekście równoległych obrazów.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: przyszywa ... łatę
  rationale: Choć ἐπιβάλλει dosłownie znaczy „nakłada”, w kontekście naprawy ubrania naturalne polskie sformułowanie „przyszywa łatę” jasno oddaje zamierzoną czynność.
- source_word: ῥάκους ἀγνάφου
  choice: z nieskurczonego materiału
  rationale: ἄγναφος opisuje tkaninę jeszcze niepoddaną pełnej obróbce; „nieskurczony materiał” przystępnie oddaje cechę istotną dla skutku przedstawionego w obrazie.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: do starego ubrania
  rationale: ἱμάτιον może oznaczać szatę lub część odzieży; „ubranie” jest szerokim i zrozumiałym współczesnym odpowiednikiem.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: odrywa się od ubrania
  rationale: W tym kontekście αἴρει wskazuje, że łata wskutek naprężenia oddziela się od ubrania. Forma zwrotna naturalnie oddaje rezultat bez nadmiernego precyzowania mechanizmu.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: łata
  rationale: Dosłownie „jego wypełnienie”; w obrazie chodzi o kawałek wypełniający ubytek, czyli łatę. Powtórzenie rzeczownika zapewnia jasność.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: i powstaje jeszcze większe rozdarcie
  rationale: χείρον dosłownie znaczy „gorsze”, lecz o rozdarciu naturalniej po polsku powiedzieć „większe”; „jeszcze” uwydatnia stopień wyższy, a γίνεται oddano jako „powstaje”.
