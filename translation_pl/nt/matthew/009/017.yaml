  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: pl
  text: Nie wlewa się też młodego wina do starych bukłaków. W przeciwnym razie bukłaki pękają, wino się wylewa, a bukłaki zostają zniszczone. Młode wino wlewa się natomiast do nowych bukłaków[a] i jedno, i drugie zostaje zachowane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greka używa różnych przymiotników: wino jest „młode” (νέος), a bukłaki „nowe” pod względem stanu (καινός).'
    reason: Objaśnienie zachowanego w przekładzie rozróżnienia leksykalnego.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: Nie wlewa się też
  rationale: Polska konstrukcja bezosobowa naturalnie oddaje ogólną praktykę wyrażoną grecką trzecią osobą liczby mnogiej; „wlewa” jest kontekstowo trafniejsze niż dosłowne „wkłada” lub „wrzuca” w odniesieniu do wina.
- source_word: οἶνον νέον
  choice: młodego wina
  rationale: „Młode wino” jest naturalnym polskim określeniem świeżo powstałego wina i zachowuje odróżnienie νέος od καινός.
- source_word: ἀσκοὺς παλαιούς
  choice: starych bukłaków
  rationale: „Bukłaki” jasno oznaczają skórzane pojemniki, a „stare” bezpośrednio oddaje kontrast z καινούς.
- source_word: εἰ δὲ μή γε
  choice: W przeciwnym razie
  rationale: Naturalnie oddaje warunkowe ostrzeżenie i wynikającą z niewłaściwego postępowania konsekwencję.
- source_word: ῥήγνυνται
  choice: pękają
  rationale: Trafnie i obrazowo opisuje rozerwanie bukłaków pod wpływem ciśnienia.
- source_word: ἐκχεῖται
  choice: się wylewa
  rationale: Oddaje niezamierzone wydostanie się i utratę wina, a nie celowe jego wylanie.
- source_word: ἀπόλλυνται
  choice: niszczeją
  rationale: Wskazuje, że bukłaki stają się niezdatne do użytku, bez nadmiernie absolutnego brzmienia „giną”.
- source_word: ἀλλὰ βάλλουσιν
  choice: wlewa się natomiast
  rationale: „Natomiast” zachowuje korekcyjny kontrast, a konstrukcja bezosobowa utrzymuje spójny, przysłowiowy charakter wypowiedzi.
- source_word: ἀσκοὺς καινούς
  choice: nowych bukłaków
  rationale: „Nowe” oddaje καινός jako nowość lub świeżość stanu i kontrastuje ze „starymi”, podczas gdy νέος o winie oddano jako „młode”.
- source_word: ἀμφότεροι συντηροῦνται
  choice: i jedno, i drugie zostaje zachowane
  rationale: Zachowuje odniesienie do obu elementów — wina i bukłaków — oraz stronę bierną greckiego czasownika.
theological_decisions:
- issue: Rozróżnienie νέος i καινός w tym samym wersecie
  choice: νέος oddano jako „młode”, a καινός jako „nowe”
  alternative: Oba przymiotniki oddać jako „nowe”
  rationale: 'Polszczyzna pozwala naturalnie zachować greckie rozróżnienie: wino jest młode, natomiast bukłaki są nowe, czyli niewyeksploatowane. Nie należy nadawać tej różnicy dodatkowego znaczenia doktrynalnego.'
- issue: Zakres ἀμφότεροι
  choice: Odniesienie do wina i bukłaków łącznie
  alternative: 'Uściślić parafrazą: „ocalone zostają zarówno wino, jak i bukłaki”'
  rationale: Zaimek obejmuje oba wspomniane elementy; zwięzłe „jedno i drugie” zachowuje formę tekstu bez dopowiadania interpretacji przypowieści.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Konstrukcje bezosobowe oddają ogólny charakter wypowiedzi. Zachowano tradycyjne, lecz nadal czytelne słowo „bukłaki”; składnię uproszczono bez usuwania kolejnych skutków opisanych w grece.
