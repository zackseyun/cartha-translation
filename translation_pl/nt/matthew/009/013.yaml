  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: pl
  text: 'Idźcie i nauczcie się, co to znaczy: „Miłosierdzia chcę, a nie ofiary”[a]. Nie przyszedłem bowiem powołać sprawiedliwych[b], lecz grzeszników.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cytat z Oz 6,6.
    reason: cross_reference
  - marker: b
    text: 'Możliwe też, że chodzi o tych, którzy uważają się za sprawiedliwych; tekst grecki mówi po prostu: „sprawiedliwych”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Idźcie więc i nauczcie się
  rationale: Imiesłów aorystu wraz z następującym trybem rozkazującym tworzy idiomatyczne wezwanie; naturalna polszczyzna zachowuje zarówno nakaz, jak i ton napomnienia. δέ oddano kontekstowo jako „więc”.
- source_word: τί ἐστιν
  choice: co znaczą słowa
  rationale: Wprowadza objaśnienie sensu następującego cytatu. Polski zwrot jest naturalny, a dodane „słowa” jasno wskazuje na cytowaną wypowiedź bez zmiany jej treści.
- source_word: Ἔλεος
  choice: Miłosierdzia
  rationale: Tradycyjny i semantycznie szeroki odpowiednik ἔλεος, obejmujący litość, miłosierne postępowanie oraz wydźwięk przymierzowy cytatu z Ozeasza.
- source_word: θέλω
  choice: pragnę
  rationale: Oddaje wolę i upodobanie Boga w podniosłym, lecz współczesnym rejestrze odpowiednim dla cytatu z Pisma.
- source_word: θυσίαν
  choice: ofiary
  rationale: Bezpośredni odpowiednik rzeczownika oznaczającego ofiarę kultową; zachowuje liczbę pojedynczą greckiego tekstu.
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: Nie przyszedłem bowiem powołać
  rationale: Zachowuje uzasadniające γάρ oraz misyjny i wzywający zakres καλέω. „Powołać” brzmi naturalnie i nie zawęża wezwania wyłącznie do zaproszenia.
- source_word: δικαίους
  choice: sprawiedliwych
  rationale: Rzeczownikowe użycie przymiotnika oddano bez dopowiedzenia, czy chodzi o ludzi rzeczywiście sprawiedliwych, czy uważających się za takich.
- source_word: ἁμαρτωλούς
  choice: grzeszników
  rationale: Standardowy odpowiednik zachowujący wyraźne przeciwstawienie obu grup.
theological_decisions:
- issue: Sens cytatu z Ozeasza 6:6
  choice: „Miłosierdzia pragnę, a nie ofiary”
  alternative: Parafraza sugerująca całkowite odrzucenie wszelkich ofiar albo jedynie łagodną preferencję w tej sytuacji
  rationale: Zachowano dosadny prorocki kontrast bez rozstrzygania, że Bóg znosi ofiary w każdym możliwym sensie.
- issue: Tożsamość „sprawiedliwych”
  choice: sprawiedliwych
  alternative: „tych, którzy uważają się za sprawiedliwych” lub „obłudnie sprawiedliwych”
  rationale: Kontekst może dopuszczać ironię, lecz greka mówi po prostu o „sprawiedliwych”; przekład pozostawia tę teologiczną i retoryczną niejednoznaczność.
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Zachowano formę napomnienia, prorocki kontrast oraz zwięzłość końcowej wypowiedzi. Wszystkie przypisy mają odpowiadające im znaczniki w tekście głównym.
