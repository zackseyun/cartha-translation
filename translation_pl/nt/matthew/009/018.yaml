  to: 'Gdy mówił im o tych rzeczach, oto przyszedł pewien zwierzchnik i złożył mu pokłon, mówiąc: „Moja córka właśnie umarła. Ale przyjdź, połóż na niej rękę, a będzie żyła”.'
  rationale: Removed the unsupported „jeszcze”, adjusted the phrasing of the introductory participial clause, and rendered προσκυνέω as „złożył mu pokłon” to represent homage/prostration without theological overinterpretation. The general title ἄρχων, the emphatic „oto”, the recent death, and the confident future statement are retained.
