  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: pl
  text: 'Gdy mówił im o tych rzeczach, oto przyszedł pewien zwierzchnik i złożył mu pokłon, mówiąc: „Moja córka właśnie umarła. Ale przyjdź, połóż na niej rękę, a będzie żyła”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: oto
  rationale: Zachowuje narracyjny sygnał zwracający uwagę czytelnika, a zarazem brzmi godnie i naturalnie w polskiej narracji biblijnej.
- source_word: ἄρχων
  choice: przełożony
  rationale: Greckie określenie jest ogólne i oznacza osobę sprawującą władzę; przekład nie dopowiada tutaj konkretnej funkcji znanej z paralelnych relacji.
- source_word: προσεκύνει
  choice: pokłonił się przed nim
  rationale: Oddaje gest uniżenia lub czci bez rozstrzygania, czy w tym miejscu należy mu przypisać pełny sens religijnego uwielbienia.
- source_word: ἄρτι ἐτελεύτησεν
  choice: właśnie umarła
  rationale: Oddaje zarówno niedawność zdarzenia wyrażoną przez ἄρτι, jak i bezpośredni sens czasownika oznaczającego śmierć.
- source_word: ζήσεται
  choice: będzie żyła
  rationale: Zachowuje prostą formę przyszłą i ufne przekonanie ojca, nie zastępując jej bardziej interpretacyjnym „ożyje”.
theological_decisions:
- issue: Znaczenie gestu wyrażonego przez προσκυνέω
  choice: pokłonił się przed nim
  alternative: oddał mu cześć
  rationale: Kontekst jednoznacznie wskazuje na gest głębokiego uniżenia, lecz sam czasownik może obejmować zakres od pokłonu przed zwierzchnikiem po religijną cześć. Wybrany przekład zachowuje tę możliwość bez narzucania rozstrzygnięcia.
translation_notes:
  register: Współczesny, godny język narracyjny. Zachowano emfatyczne „oto” oraz ogólność tytułu ἄρχων. Szyk wypowiedzi jest naturalny po polsku, a zarazem bliski strukturze greckiego tekstu.
