  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: pl
  text: 'A gdy demon został wyrzucony, niemy[a] przemówił. Tłumy zdumiały się i mówiły: „Nigdy czegoś takiego nie widziano w Izraelu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „głuchy”. Greckie słowo może oznaczać osobę głuchą albo niemą; tutaj kontekst przemawia za „niemym”, ponieważ podkreślono, że człowiek przemówił.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: gdy demon został wyrzucony
  rationale: Aorystowy imiesłów bierny w konstrukcji genetivus absolutus wyraża czynność poprzedzającą przemówienie; polskie „gdy… został wyrzucony” oddaje tę relację naturalnie i zwięźle.
- source_word: δαιμονίου
  choice: demon
  rationale: W kontekście ewangelicznych egzorcyzmów δαιμόνιον najdokładniej odpowiada polskiemu „demon”.
- source_word: ἐλάλησεν
  choice: przemówił
  rationale: „Przemówił” naturalnie opisuje odzyskanie zdolności mówienia, nie dodając nieobecnego w grece rozwinięcia typu „zaczął mówić”.
- source_word: ὁ κωφός
  choice: niemy
  rationale: κωφός może oznaczać osobę głuchą albo niemą, lecz bezpośredni kontekst — „przemówił” — wskazuje, że zaakcentowana jest niemożność mówienia.
- source_word: ἐθαύμασαν
  choice: zdumiewały się
  rationale: Czasownik wyraża silne zdziwienie lub podziw; „zdumiewały się” jest współczesne, naturalne i zachowuje aspekt reakcji tłumów.
- source_word: οἱ ὄχλοι
  choice: tłumy
  rationale: Liczba mnoga greckiego rzeczownika została zachowana przez naturalne polskie „tłumy”.
- source_word: Οὐδέποτε
  choice: Nigdy
  rationale: Bezpośredni i idiomatyczny odpowiednik greckiego przysłówka.
- source_word: ἐφάνη
  choice: nie widziano
  rationale: Bierna forma φαίνω może znaczyć „ukazało się” lub idiomatycznie „zostało dostrzeżone / widziane”. W tej wypowiedzi polskie „nie widziano” brzmi naturalnie i zachowuje sens bezprecedensowego wydarzenia.
- source_word: οὕτως
  choice: czegoś takiego
  rationale: W polszczyźnie wypowiedź wymaga uzupełnienia idiomatycznego; „czegoś takiego” oddaje wskazanie na rodzaj właśnie oglądanego wydarzenia.
- source_word: ἐν τῷ Ἰσραήλ
  choice: w Izraelu
  rationale: Zwięzły standardowy odpowiednik, mogący odnosić się zarówno do ludu, jak i do jego obszaru.
theological_decisions:
- issue: Zakres znaczeniowy κωφός w opisie uzdrowienia i egzorcyzmu
  choice: niemy
  alternative: głuchy
  rationale: Wyraz może oznaczać osobę głuchą albo niemą. Następujące stwierdzenie, że człowiek przemówił, przemawia za „niemym”, bez przypisywania mu dodatkowo głuchoty.
- issue: Sposób oddania ἐφάνη
  choice: nie widziano
  alternative: nie pojawiło się / nie ukazało się
  rationale: Forma grecka dopuszcza sens „ukazać się” oraz bierny, idiomatyczny sens „być widzianym”. „Nie widziano” jest w tym okrzyku naturalne po polsku, bez rozstrzygania, że podmiotem jest konkretna osoba lub rzecz.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano narracyjną zwięzłość tekstu greckiego, liczbę mnogą „tłumy” oraz leksykalną niejednoznaczność κωφός w przypisie.
