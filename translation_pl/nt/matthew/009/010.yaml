  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: pl
  text: A gdy Jezus spoczywał przy stole w domu[a][b], oto przyszli liczni poborcy podatków i grzesznicy i spoczywali przy stole z Jezusem i jego uczniami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bardziej idiomatycznie: „gdy Jezus jadł w domu”. Greka mówi dokładniej o spoczywaniu przy stole, zgodnie z ówczesnym zwyczajem spożywania posiłków.'
    reason: lexical_alternative
  - marker: b
    text: Tekst mówi po prostu „w domu” i w tym wersecie nie wskazuje wyraźnie, do kogo ten dom należał.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: A gdy Jezus spoczywał przy stole
  rationale: Konstrukcja καὶ ἐγένετο z dopełniaczem absolutnym pełni funkcję przejścia narracyjnego i określa okoliczność czasową. Naturalne polskie „A gdy” oddaje tę funkcję bez niezręcznego „i stało się”. Imię „Jezus” dopowiada referenta zaimka dla jasności składniowej.
- source_word: ἀνακειμένου
  choice: spoczywał przy stole
  rationale: W kontekście posiłku czasownik oznacza zajmowanie półleżącej pozycji przy stole. Wyrażenie zachowuje realia starożytnego posiłku, a przypis podaje bardziej idiomatyczny odpowiednik.
- source_word: ἐν τῇ οἰκίᾳ
  choice: w domu
  rationale: Greka nie wskazuje w tym wersecie wyraźnie właściciela domu, dlatego przekład nie dodaje „jego” ani „Mateusza”.
- source_word: ἰδοὺ
  choice: oto
  rationale: „Oto” jest naturalnym, podniosłym, lecz zrozumiałym polskim wykładnikiem zwracającym uwagę na następujące wydarzenie.
- source_word: τελῶναι
  choice: poborcy podatków
  rationale: Współczesne i precyzyjne określenie osób pobierających podatki lub opłaty; zachowuje ich odrębność jako grupy społecznej.
- source_word: ἁμαρτωλοὶ
  choice: grzesznicy
  rationale: Rzeczownikowe użycie przymiotnika najnaturalniej oddaje utrwalone polskie „grzesznicy”, zachowując społeczną i religijną kategorię tekstu.
- source_word: ἐλθόντες
  choice: przyszło
  rationale: Imiesłów aorystu zostaje naturalnie rozwinięty w polskie orzeczenie określające czynność poprzedzającą wspólne zajęcie miejsca przy stole.
- source_word: συνανέκειντο
  choice: spoczywali przy stole razem z
  rationale: Złożony czasownik wskazuje na wspólne uczestnictwo w posiłku w pozycji półleżącej. „Razem z” uwydatnia wspólnotę stołu bez dodawania interpretacji.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: jego uczniami
  rationale: „Uczniowie” to standardowy i trafny odpowiednik μαθηταί, zachowujący relację ucznia do nauczyciela.
theological_decisions:
- issue: Pozycja podczas posiłku i wspólnota stołu
  choice: Zachować sformułowanie „spoczywał/spoczywali przy stole”.
  alternative: „jadł/jedli” albo „spożywał/spożywali posiłek”
  rationale: Dosłowniejszy obraz uwidacznia wspólny stół i historyczny sposób spożywania posiłku, istotne dla sceny, bez dokładania wniosków doktrynalnych.
- issue: Tożsamość właściciela domu
  choice: Nie określać, do kogo należał dom.
  alternative: „w jego domu” albo „w domu Mateusza”
  rationale: Tekst grecki mówi jedynie „w domu”. Kontekst może prowadzić do określonego wniosku, lecz sam werset nie rozstrzyga tego wprost.
translation_notes:
  register: Nowoczesna, standardowa polszczyzna o godnym rejestrze narracji biblijnej. „Oto” zachowuje wyrazistość greckiego znacznika dyskursu, a „spoczywać przy stole” celowo zachowuje historyczny obraz, objaśniony w przypisie. Składnia unika archaicznego „i stało się” oraz nie dopowiada właściciela domu.
