base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: pl
  text: 'Kiedy faryzeusze to zobaczyli,[a] pytali jego uczniów: „Dlaczego wasz nauczyciel je z poborcami podatków i grzesznikami?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwy bardziej dosłowny przekład: „A faryzeusze, widząc [to], mówili do jego uczniów...”. Grecki imiesłów nie ma wyrażonego dopełnienia; z kontekstu wynika, że chodzi o scenę posiłku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Kiedy ... to zobaczyli
  rationale: Aorystyczny imiesłów oddano naturalnym polskim zdaniem czasowym. Zaimek „to” wskazuje na widoczną w kontekście scenę posiłku, choć w grece dopełnienie pozostaje niewyrażone.
- source_word: ἔλεγον
  choice: pytali
  rationale: Imperfectum zachowano przez czasownik niedokonany „pytali”, który naturalnie przedstawia trwającą lub powtarzaną czynność mówienia; następująca wypowiedź ma formę pytania.
- source_word: μαθηταῖς
  choice: uczniów
  rationale: „Uczniowie” to utrwalony i trafny odpowiednik, zachowujący relację między nauczycielem a uczniem.
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Naturalny, zwięzły polski odpowiednik pytania o przyczynę.
- source_word: τελωνῶν
  choice: poborcami podatków
  rationale: Określenie zrozumiałe współczesnemu czytelnikowi i dostatecznie precyzyjne, bez wprowadzania zbędnego terminu technicznego.
- source_word: ἁμαρτωλῶν
  choice: grzesznikami
  rationale: Bezpośredni, tradycyjny i nadal zrozumiały odpowiednik, zachowujący moralne i społeczne nacechowanie greckiego określenia.
- source_word: ἐσθίει
  choice: jada
  rationale: Polskie „jada” naturalnie wyraża niedokonany aspekt i może wskazywać na zwyczaj lub charakterystyczne postępowanie, zgodnie z formą pytania; nie przesądza wyłącznie o jednorazowym posiłku.
- source_word: διδάσκαλος
  choice: Nauczyciel
  rationale: Podstawowy odpowiednik tytułu διδάσκαλος, czytelnie zachowujący relację nauczyciel–uczniowie. Wielka litera pełni funkcję grzecznościowo-tytularną w odniesieniu do Jezusa, nie zmieniając znaczenia rzeczownika.
theological_decisions:
- issue: Czy wyrazić domyślne dopełnienie czasownika „zobaczyli”
  choice: Dodano „to” w tekście głównym
  alternative: „Widząc [to], faryzeusze...” albo konstrukcja bez wyraźnego dopełnienia
  rationale: Greka nie wyraża dopełnienia, lecz kontekst wskazuje na scenę wspólnego posiłku. Polskie „to” daje naturalne zdanie bez teologicznego dopowiedzenia; przypis zachowuje świadomość formalnej nieokreśloności.
- issue: Czy ἐσθίει odnosi się do jednego posiłku, czy do charakterystycznego zwyczaju
  choice: „jada”
  alternative: „je” lub „spożywa posiłek”
  rationale: Forma teraźniejsza w pytaniu może opisywać obserwowaną czynność albo postępowanie uznane za charakterystyczne. „Jada” zachowuje tę otwartość i naturalność zarzutu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano standardowe terminy biblijne „faryzeusze”, „uczniowie” i „grzesznicy”, a τελῶναι oddano przejrzyście jako „poborcy podatków”.
