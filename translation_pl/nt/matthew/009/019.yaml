  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: pl
  text: Jezus wstał i poszedł za nim, a jego uczniowie wraz z nim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: wstał
  rationale: Imiesłów aorystu pełni tu funkcję narracyjną i oznacza podniesienie się Jezusa, by ruszyć w drogę. Polski czasownik osobowy brzmi naturalniej niż dosłowne „powstawszy”.
- source_word: ἠκολούθει αὐτῷ
  choice: poszedł za nim
  rationale: Imperfectum ἀκολουθέω przedstawia podążanie za przełożonym wspomnianym w poprzednim wersecie. „Poszedł za nim” naturalnie oddaje rozpoczęcie i trwanie ruchu, nie nadając temu użyciu koniecznie technicznego sensu uczniostwa.
- source_word: μαθηταὶ
  choice: uczniowie
  rationale: Standardowy i kontekstowo trafny odpowiednik μαθηταί w Ewangeliach, zachowujący relację uczniów do nauczyciela.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: a wraz z nim jego uczniowie
  rationale: Greka nie powtarza czasownika. Polska konstrukcja eliptyczna zachowuje tę zwięzłość, jasno wskazując, że uczniowie Jezusa również poszli.
- source_word: καί
  choice: więc
  rationale: Na początku zdania καί wiąże czynność Jezusa z prośbą przełożonego z poprzedniego wersetu. „Więc” naturalnie wyraża następstwo i reakcję w polskiej narracji.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i płynny język narracyjny. Uniknięto książkowego „powstawszy” oraz niezręcznego powtórzenia „poszli za nim”, w którym drugi zaimek mógłby mieć niejasne odniesienie.
