id: MAT.9.35
reference: Matthew 9:35
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: pl
  text: Jezus obchodził wszystkie miasta i wsie, nauczając w ich synagogach, głosząc dobrą nowinę o królestwie[a] oraz uzdrawiając każdą chorobę i każdą niemoc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Ewangelię o królestwie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „każdą chorobę i każdą dolegliwość”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: obchodził
  rationale: Czas niedokonany wskazuje na trwającą lub powtarzającą się działalność wędrowną; „obchodził” naturalnie oddaje przemieszczanie się Jezusa po kolejnych miejscowościach.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: wszystkie miasta i wsie
  rationale: Zachowuje rozróżnienie między większymi ośrodkami a mniejszymi osadami oraz łączny zakres wyrażony przez πάσας.
- source_word: διδάσκων
  choice: nauczając
  rationale: Imiesłów zachowuje współbieżność tej czynności z wędrowną działalnością Jezusa.
- source_word: συναγωγαῖς αὐτῶν
  choice: w ich synagogach
  rationale: Zachowano historyczne określenie „synagogi” oraz zaimek αὐτῶν, odnoszący się do wspólnot odwiedzanych miejscowości.
- source_word: κηρύσσων
  choice: głosząc
  rationale: „Głosić” naturalnie oddaje publiczne, autorytatywne obwieszczanie zawarte w κηρύσσω.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: dobrą nowinę o królestwie
  rationale: „Dobra nowina” przejrzyście oddaje podstawowy sens εὐαγγέλιον, a „o królestwie” zachowuje zwięzłość i możliwy zakres greckiego dopełniacza.
- source_word: θεραπεύων
  choice: uzdrawiając
  rationale: W kontekście działalności Jezusa „uzdrawiać” jest naturalnym odpowiednikiem θεραπεύω.
- source_word: πᾶσαν νόσον
  choice: każdą chorobę
  rationale: Oddaje jednostkowy i zarazem całościowy zakres πᾶσαν oraz zwykłe znaczenie νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: każdą niemoc
  rationale: „Niemoc” obejmuje osłabienie, niedomaganie lub dolegliwość i pozwala zachować odróżnienie μαλακία od νόσος.
theological_decisions:
- issue: Sposób oddania εὐαγγέλιον
  choice: dobra nowina
  alternative: Ewangelia
  rationale: Wybrano przejrzyste znaczeniowo, współczesne sformułowanie, nie usuwając tradycyjnego odpowiednika, który podano w przypisie.
- issue: Relacja dopełniacza w τὸ εὐαγγέλιον τῆς βασιλείας
  choice: dobra nowina o królestwie
  alternative: dobra nowina królestwa
  rationale: „O królestwie” brzmi naturalnie po polsku, lecz nie dopowiada natury ani zakresu królestwa, dzięki czemu nie rozstrzyga ponad tekst grecki.
- issue: Zakres uzdrowień w πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: każdą chorobę i każdą niemoc
  alternative: wszelką chorobę i wszelką dolegliwość
  rationale: Powtórzenie „każdą” odzwierciedla dwukrotne πᾶσαν i zachowuje pełny zakres wypowiedzi bez wprowadzania dodatkowego twierdzenia doktrynalnego.
translation_notes:
  register: 'Współczesny, godny i przystępny rejestr. Konstrukcja z imiesłowami zachowuje rytm trzech równoległych czynności: nauczania, głoszenia i uzdrawiania. Małą literę w słowach „dobra nowina” i „królestwo” zastosowano jako przekład wyrażeń pospolitych w tekście greckim, bez narzucania terminologii wyznaniowej.'
