  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: pl
  text: 'I oto niektórzy z uczonych w Piśmie powiedzieli między sobą[a]: „Ten człowiek bluźni”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „powiedzieli sobie” lub „pomyśleli”. Grecki zwrot może oznaczać prywatną rozmowę albo wewnętrzny namysł.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Prosty spójnik zachowuje ciągłość narracji i naturalnie łączy ten moment z poprzednim zdarzeniem.
- source_word: ἰδού
  choice: oto
  rationale: Naturalny, podniosły, lecz nadal współczesny polski odpowiednik sygnału zwracającego uwagę odbiorcy.
- source_word: τινες τῶν γραμματέων
  choice: niektórzy z uczonych w Piśmie
  rationale: „Niektórzy z” oddaje nieokreśloną część grupy, a „uczeni w Piśmie” jest zrozumiałym i utrwalonym określeniem osób biegłych w żydowskim Prawie i jego wykładni.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: powiedzieli między sobą
  rationale: Sformułowanie zachowuje czasownik „powiedzieli” oraz możliwość prywatnej wymiany słów, nie wykluczając całkowicie wewnętrznego namysłu; zakres greckiego zwrotu objaśnia przypis.
- source_word: Οὗτος
  choice: Ten człowiek
  rationale: Samodzielny zaimek wskazujący odnosi się do Jezusa i w kontekście może brzmieć lekceważąco; „ten człowiek” jest naturalniejsze niż drewniane „ten” lub nacechowane „ten typ”.
- source_word: βλασφημεῖ
  choice: bluźni
  rationale: Czas teraźniejszy i bezpośrednie oskarżenie zostają zachowane w zwięzłej, naturalnej polszczyźnie.
theological_decisions:
- issue: Oskarżenie Jezusa o bluźnierstwo
  choice: „Ten człowiek bluźni”
  alternative: „Ten wypowiada bluźnierstwo”
  rationale: Bezpośredni czasownik zachowuje siłę zarzutu uczonych w Piśmie, nie dodając jeszcze narracyjnego ani doktrynalnego rozstrzygnięcia.
- issue: Czy uczeni mówili do siebie, czy tylko rozważali to w myślach
  choice: „powiedzieli między sobą” z przypisem
  alternative: „pomyśleli sobie”
  rationale: Greckie wyrażenie dopuszcza prywatną wypowiedź lub wewnętrzny namysł. Tekst główny pozostaje bliski składni źródła, a przypis zachowuje istotną niejednoznaczność.
translation_notes:
  register: Współczesna, godna polszczyzna o lekkim rejestrze biblijnym. „Oto” zachowuje żywość narracji, a „uczeni w Piśmie” jest czytelniejsze dla zwykłego odbiorcy niż techniczne „skrybowie”.
