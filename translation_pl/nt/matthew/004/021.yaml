- from: 'Idąc stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i jego brata Jana. Siedzieli w łodzi ze swoim ojcem Zebedeuszem i naprawiali swoje sieci. Wtedy ich wezwał.'
  to: 'Idąc stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i Jana, jego brata, w łodzi z ich ojcem Zebedeuszem, przygotowujących swoje sieci, i wezwał ich.'
  rationale: 'Usunięto nieobecne w tekście źródłowym „Siedzieli” oraz interpretujące „Wtedy”. Zachowano wszystkie składniki greckiego zdania: dalsze udanie się, dwóch kolejnych braci, ich identyfikację, obecność w łodzi z ojcem, czynność przy sieciach i wezwanie. „Przygotowujących” oddaje imiesłów teraźniejszy oraz nie zawęża znaczenia καταρτίζω bardziej niż wymaga tego kontekst.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:19Z'
review_pass:
  verdict: revise
  source_fidelity: Projekt zasadniczo trafnie oddaje grecki tekst. Jednak rozbicie zdania wprowadza dodatkową informację przez „Siedzieli”, której greckie ἐν τῷ πλοίῳ nie wyraża; mówi ono jedynie, że byli/w znajdowali się w łodzi. „Wtedy” również dodaje wyraźny niuans następstwa, którego καί nie musi zaznaczać. Bezpieczniej zachować jedną konstrukcję zdaniową i relację współczesności czynności przygotowywania sieci.
  naturalness: Proponowane brzmienie jest naturalne we współczesnej polszczyźnie. Szyk „Janem, jego bratem” jest płynny i jasno wskazuje, że Jan był bratem Jakuba. „Przygotowywali swoje sieci” jest idiomatyczne i obejmuje zakres καταρτίζω w tym kontekście (doprowadzanie sieci do właściwego stanu), bez zawężania go wyłącznie do naprawy uszkodzeń.
  terminology: Imiona „Jakub”, „Jan” i „Zebedeusz” są standardowe. „Wezwał ich” trafnie zachowuje prosty czasownik ἐκάλεσεν, nie rozwijając go do wezwania do pójścia za Jezusem ani nie narzucając technicznego sensu „powołał”.
  issues:
  - severity: medium
    issue: Dodano czynność „Siedzieli”.
    rationale: Grecki tekst lokalizuje braci „w łodzi” (ἐν τῷ πλοίῳ), lecz nie określa ich postawy. Dodanie „Siedzieli” jest niepotrzebną konkretyzacją.
  - severity: low
    issue: „Wtedy” wzmacnia następstwo czasowe.
    rationale: Koordynujące καί najlepiej oddać zwykłym „i”; „wtedy” może być dopuszczalne stylistycznie, ale nie jest potrzebne i nie odpowiada wyraźnemu elementowi tekstu.
  - severity: low
    issue: „Naprawiali” nieco zawęża καταρτίζοντας.
    rationale: W odniesieniu do sieci καταρτίζω może obejmować naprawianie i przygotowywanie/porządkowanie. „Przygotowywali” zachowuje szerszy, bezpieczny sens.
  revised_text: 'Idąc stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i Jana, jego brata, w łodzi z ich ojcem Zebedeuszem, przygotowujących swoje sieci, i wezwał ich.'
