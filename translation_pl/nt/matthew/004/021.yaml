id: MAT.4.21
reference: Matthew 4:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: pl
  text: 'Idąc stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i Jana, jego brata, w łodzi z ich ojcem Zebedeuszem, przygotowujących swoje sieci, i wezwał ich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Idąc stamtąd dalej
  rationale: Imiesłów aorystu wyraża dalsze przemieszczanie się z poprzedniego miejsca; ten przekład naturalnie oddaje zarówno kontynuację drogi, jak i punkt wyjścia.
- source_word: εἶδεν
  choice: zobaczył
  rationale: Zachowano zwykłe narracyjne znaczenie czasownika ὁράω, bez wzmacniania go do „zauważył”.
- source_word: ἄλλους δύο ἀδελφούς
  choice: dwóch innych braci
  rationale: Oddaje liczbę oraz fakt, że chodzi o kolejną parę braci po wcześniej wspomnianych uczniach.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jakuba, syna Zebedeusza
  rationale: Dopełniacz określający pochodzenie został zgodnie z polskim zwyczajem wyrażony rzeczownikiem „syn”.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: jego brata Jana
  rationale: Sformułowanie jasno wskazuje, że Jan jest bratem Jakuba, i zachowuje naturalny polski szyk.
- source_word: ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: w łodzi ze swoim ojcem Zebedeuszem
  rationale: „Łódź” odpowiada rybackiemu kontekstowi, a „ze swoim ojcem” jednoznacznie odnosi ojcostwo Zebedeusza do obu braci.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: naprawiali swoje sieci
  rationale: 'W kontekście połowu καταρτίζω oznacza doprowadzanie sieci do właściwego stanu, najnaturalniej: ich naprawianie.'
- source_word: ἐκάλεσεν αὐτούς
  choice: wezwał ich
  rationale: „Wezwał” zachowuje sens skierowanego do nich wezwania, nie dopowiadając w samym wersecie jego treści.
theological_decisions:
- issue: Uczniowski sens czasownika ἐκάλεσεν
  choice: wezwał ich
  alternative: powołał ich; wezwał ich, aby poszli za Nim
  rationale: Kontekst wskazuje na wezwanie do uczniostwa, ale tekst wersetu nie podaje jego treści. Nie dodano więc frazy „aby poszli za Nim”; uniknięto też mocniej zinterpretowanego, terminologicznego „powołał”.
translation_notes:
  register: Współczesny, godny język narracyjny. Długie zdanie greckie podzielono dla naturalności polszczyzny. „Siedzieli” konkretyzuje położenie braci w łodzi zgodnie z kontekstem, nie zmieniając przebiegu sceny.
