id: MAT.4.14
reference: Matthew 4:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: pl
  text: 'aby wypełniło się to, co zostało powiedziane przez proroka Izajasza:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: aby
  rationale: Naturalnie wprowadza w języku polskim zamierzony skutek lub cel, zachowując funkcję zdania z ἵνα.
- source_word: πληρωθῇ
  choice: wypełniło się
  rationale: Utrwalony i trafny odpowiednik formuły wypełnienia Pisma; polska konstrukcja zwrotna naturalnie oddaje sens greckiej strony biernej i trybu łączącego w zdaniu celowo-skutkowym.
- source_word: τὸ ῥηθὲν
  choice: to, co zostało powiedziane
  rationale: Oddaje substantywizowany imiesłów bierny bez upraszczania wcześniejszego aktu wypowiedzenia.
- source_word: διὰ
  choice: przez
  rationale: Przy dopełniaczu wskazuje pośrednictwo proroka; polskie „przez” zachowuje zarazem naturalność i ideę przekazania słowa za jego pośrednictwem.
- source_word: Ἠσαΐου
  choice: Izajasza
  rationale: Standardowa polska forma imienia proroka, odmieniona zgodnie ze składnią zdania.
- source_word: τοῦ προφήτου
  choice: proroka
  rationale: Zachowuje wyraźne określenie roli Izajasza; szyk „przez proroka Izajasza” jest naturalny w polszczyźnie.
- source_word: λέγοντος
  choice: ':'
  rationale: Imiesłów wprowadza następujący cytat. W naturalnej współczesnej polszczyźnie jego funkcję najzwięźlej i bez utraty treści oddaje dwukropek; dosłowne „mówiącego” byłoby niezręczne, a „który powiedział” mogłoby błędnie sugerować, że podmiotem jest Izajasz, podczas gdy forma gramatycznie zgadza się z „prorokiem”, lecz cała formuła uwydatnia wypowiedź przekazaną przez niego.
theological_decisions:
- issue: Mateuszowa formuła wypełnienia
  choice: „aby wypełniło się”
  alternative: „aby spełniło się” lub „aby stało się prawdą”
  rationale: „Wypełniło się” zachowuje charakterystyczny dla Mateusza związek wydarzenia z wcześniejszym słowem prorockim, nie objaśniając dodatkowo rodzaju ani mechanizmu tego wypełnienia.
- issue: Pośrednictwo proroka
  choice: „powiedziane przez proroka Izajasza”
  alternative: „powiedziane przez Izajasza”
  rationale: Zachowano zarówno διά, jak i tytuł prorocki, aby nie osłabiać zawartego w tekście motywu przekazania słowa za pośrednictwem proroka.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr biblijny. Dwukropek naturalnie zapowiada cytat z następnego wersetu; nie dodano słowa „mówiącego”, które w tym miejscu brzmiałoby po polsku sztywno.
