source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: pl
  text: 'Od tego czasu Jezus zaczął głosić[a]: „Nawracajcie się, bo przybliżyło się[b] królestwo niebios[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „głosić i mówić”.'
    reason: Zachowanie informacji o dwóch współrzędnych bezokolicznikach w tekście greckim.
  - marker: b
    text: 'Można też oddać: „stało się bliskie” lub „jest blisko”. Grecki czas perfectum wskazuje, że królestwo osiągnęło bliskość, która pozostaje aktualna.'
    reason: Wyjaśnienie aspektu czasownika oraz dopuszczalnych odpowiedników.
  - marker: c
    text: 'Dosłownie: „królestwo niebios”. Jest to charakterystyczne wyrażenie Mateusza; w innych miejscach podobny sens często wyraża zwrot „królestwo Boga”.'
    reason: Objaśnienie Mateuszowej formuły i greckiej liczby mnogiej.
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Od tego czasu
  rationale: Naturalnie zaznacza punkt zwrotny w narracji i zachowuje temporalny sens greckiego wyrażenia.
- source_word: ἤρξατο
  choice: zaczął
  rationale: Bezpośredni i naturalny odpowiednik czasownika rozpoczynającego dalszą działalność Jezusa.
- source_word: κηρύσσειν καὶ λέγειν
  choice: głosić
  rationale: W tym kontekście λέγειν wprowadza treść publicznego głoszenia. Dwukropek oddaje tę relację po polsku bez niezręcznego „głosić i mówić”; dosłowniejszą budowę zachowano w przypisie.
- source_word: Μετανοεῖτε
  choice: Nawracajcie się
  rationale: Oddaje wezwanie do zasadniczej przemiany myślenia, postawy i życia, nie ograniczając go do samego żalu ani intelektualnej zmiany zdania.
- source_word: ἤγγικεν
  choice: przybliżyło się
  rationale: 'Polski czas przeszły dokonany dobrze oddaje grecki perfectum: bliskość nadeszła i pozostaje aktualna.'
- source_word: βασιλεία
  choice: królestwo
  rationale: Zachowuje rozpoznawalny biblijny termin, który w zależności od kontekstu może obejmować zarówno królewskie panowanie, jak i jego sferę.
- source_word: τῶν οὐρανῶν
  choice: niebios
  rationale: Zachowuje charakterystyczne dla Mateusza wyrażenie w liczbie mnogiej, a zarazem brzmi naturalnie i godnie po polsku.
theological_decisions:
- issue: Zakres znaczeniowy Μετανοεῖτε
  choice: Nawracajcie się
  alternative: Zmieńcie swoje myślenie / Opamiętajcie się
  rationale: Wybrane sformułowanie obejmuje przemianę wewnętrzną oraz zwrot w sposobie życia, nie narzucając węższej interpretacji psychologicznej ani wyznaniowej.
- issue: Znaczenie βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  alternative: panowanie niebios / królestwo niebieskie
  rationale: Sformułowanie zachowuje Mateuszową konstrukcję i jej zamierzoną otwartość na sens królewskiego panowania oraz królestwa, bez sprowadzania go wyłącznie do miejsca.
- issue: Aspekt czasownika ἤγγικεν
  choice: przybliżyło się
  alternative: jest blisko / nadeszło
  rationale: Perfectum wskazuje na osiągniętą bliskość, której skutek nadal trwa. Przekład zachowuje to napięcie bez rozstrzygania, w jaki dokładnie sposób królestwo jest już obecne.
translation_notes:
  register: Współczesna, zrozumiała polszczyzna o godnym rejestrze biblijnym. Dwukropek naturalnie wprowadza treść głoszenia, a „królestwo niebios” zachowuje charakterystyczne słownictwo Mateusza.
