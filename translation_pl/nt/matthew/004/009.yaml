base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: pl
  text: 'I powiedział mu: „Dam ci to wszystko, jeśli upadniesz i oddasz mi pokłon[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „będziesz mnie czcił” albo „złożysz mi hołd”. Grecki czasownik może oznaczać padnięcie przed kimś, złożenie hołdu lub oddawanie czci; w tym kontekście ma wyraźny sens religijny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Prosty spójnik zachowuje ciąg narracji bez dodawania wyraźnego następstwa czasowego.
- source_word: εἶπεν αὐτῷ
  choice: powiedział mu
  rationale: Zachowano zaimkowe brzmienie greckiego tekstu, nie wprowadzając imion nieobecnych w tym zdaniu.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Dam ci to wszystko
  rationale: Naturalny polski szyk oddaje obietnicę oraz pełny zakres wskazany przez ταῦτά i πάντα, odnoszący się do rzeczy pokazanych wcześniej.
- source_word: ἐὰν
  choice: jeśli
  rationale: Bezpośrednio i naturalnie wprowadza warunek.
- source_word: πεσὼν
  choice: upadniesz
  rationale: Zachowuje konkretny obraz fizycznego padnięcia przed kimś, choć polska konstrukcja współrzędna naturalnie wyraża czynność poprzedzającą oddanie pokłonu.
- source_word: προσκυνήσῃς μοι
  choice: oddasz mi pokłon
  rationale: Wyrażenie zachowuje zarówno gest uniżenia, jak i religijny ciężar żądania; szerszy zakres czasownika objaśniono w przypisie.
theological_decisions:
- issue: Znaczenie προσκυνέω w żądaniu skierowanym do Jezusa
  choice: oddasz mi pokłon
  alternative: będziesz mnie czcił; pokłonisz mi się
  rationale: Kontekst następnego wersetu wskazuje na cześć należną Bogu, jednak grecki czasownik może też oznaczać padnięcie przed kimś lub złożenie hołdu. „Oddać pokłon” zachowuje cielesny obraz oraz religijne napięcie bez nadmiernego zawężania znaczenia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano zwięzłość greckiego zdania oraz rozróżnienie między fizycznym upadnięciem a następującym po nim oddaniem pokłonu.
