id: MAT.4.6
reference: Matthew 4:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: pl
  text: 'I mówi mu: „Jeśli jesteś Synem Boga, rzuć się w dół, napisano bowiem: «Swoim aniołom wyda polecenie dotyczące ciebie» oraz: «Na rękach będą cię nosić[a], abyś nie uderzył nogą o kamień»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „będą cię podtrzymywać”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Historyczny czas teraźniejszy jest naturalny w polskiej narracji biblijnej i zachowuje żywość greckiej formy.
- source_word: Εἰ
  choice: Jeśli
  rationale: Zachowuje warunkowy i prowokacyjny charakter wyzwania, bez przesądzania, że sens brzmi „skoro”.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Synem Boga
  rationale: W kontekście Mateusza wyrażenie ma charakter rozpoznawalnego tytułu chrystologicznego; wielka litera oddaje tę funkcję bez rozwijania jej doktrynalnie.
- source_word: βάλε σεαυτὸν κάτω
  choice: rzuć się w dół
  rationale: Naturalny współczesny odpowiednik imperatywu z zaimkiem zwrotnym i przysłówkiem, odpowiedni do skoku z wysokości.
- source_word: γέγραπται
  choice: napisano
  rationale: Utrwalona polska formuła wprowadzająca cytat z Pisma, zachowująca jego obowiązującą moc.
- source_word: ἐντελεῖται
  choice: wyda polecenie
  rationale: Oddaje przyszłą formę czasownika oraz sens autorytatywnego nakazu.
- source_word: περὶ σοῦ
  choice: dotyczące ciebie
  rationale: Bezpośrednio zachowuje sens περί z dopełniaczem; jest precyzyjniejsze niż swobodniejsze „dla ciebie”.
- source_word: ἐπὶ χειρῶν
  choice: Na rękach
  rationale: Zachowuje obraz aniołów podtrzymujących człowieka na swoich rękach.
- source_word: ἀροῦσίν σε
  choice: będą cię nosić
  rationale: W tym kontekście αἴρω oznacza podtrzymywanie lub niesienie; polskie „nosić” naturalnie współgra z wyrażeniem „na rękach”.
- source_word: μήποτε προσκόψῃς
  choice: abyś nie uderzył
  rationale: Oddaje zapobiegawczy sens μήποτε oraz konkretne uderzenie stopą, a nie tylko ogólne potknięcie.
- source_word: πρὸς λίθον
  choice: o kamień
  rationale: To naturalna polska konstrukcja przy uderzeniu nogą; rzeczownik bez rodzajnika pozostaje nieokreślony.
- source_word: τὸν πόδα σου
  choice: nogą
  rationale: Zachowuje liczbę pojedynczą; narzędnik jest wymagany przez naturalny polski zwrot „uderzyć nogą o”.
theological_decisions:
- issue: Chrystologiczna funkcja wyrażenia „Syn Boga” w wyzwaniu kusiciela
  choice: Tytuł „Syn Boga” zapisany wielkimi literami
  alternative: „syn Boga” jako określenie nietytularne
  rationale: Kontekst Ewangelii Mateusza wskazuje na rozpoznawalne określenie chrystologiczne. Wielkie litery zachowują tę funkcję, nie dodając objaśnienia doktrynalnego.
- issue: Diabeł cytuje Psalm 91
  choice: Cytat pozostawiono bez komentarza i korekty w tekście głównym
  alternative: Dodać w tekście interpretacyjne zastrzeżenie dotyczące sposobu użycia Psalmu
  rationale: Tekst przedstawia wypowiedź kusiciela posługującego się Pismem; przekład powinien zachować to napięcie, a nie rozstrzygać go przez dopisek.
translation_notes:
  register: Współczesny, godny rejestr polszczyzny biblijnej. Zachowano historyczny czas teraźniejszy greckiego λέγει. Cytat ujęto w polskie cudzysłowy drugiego stopnia; składnia pozostaje zrozumiała dla zwykłego czytelnika bez archaizowania.
