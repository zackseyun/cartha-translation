id: MAT.4.10
reference: Matthew 4:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: pl
  text: 'Wtedy Jezus mówi do niego: „Odejdź, Szatanie! Napisano bowiem: «Panu, swojemu Bogu, będziesz oddawał cześć[a] i tylko jemu będziesz służył[b]»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „będziesz się kłaniał Panu, swojemu Bogu”. Grecki czasownik może dosłowniej oznaczać padanie na twarz lub skłanianie się w geście czci.'
    reason: lexical_alternative
  - marker: b
    text: Czasownik przełożony jako „służyć” może oznaczać zwłaszcza służbę o charakterze świętym lub religijnym, pełnioną dla Boga.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wskazującego kolejny moment narracji.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy historyczny i jego narracyjną żywość.
- source_word: Ὕπαγε
  choice: Odejdź
  rationale: Stanowczy, lecz współczesny nakaz oddalenia się; brzmi naturalniej niż archaiczne formuły odprawienia.
- source_word: Σατανᾶ
  choice: szatanie
  rationale: Utrwalona polska forma wołacza nazwy lub tytułu osobowego.
- source_word: γέγραπται
  choice: Napisano
  rationale: Utrwalona polska formuła wprowadzająca cytat z Pisma, oddająca rezultat greckiego perfectum strony biernej.
- source_word: Κύριον τὸν θεόν σου
  choice: Panu, swojemu Bogu
  rationale: Polski celownik wynika z konstrukcji „oddawać cześć komuś”; apozycja zachowuje utożsamienie Pana z Bogiem adresata.
- source_word: προσκυνήσεις
  choice: będziesz oddawał cześć
  rationale: W kontekście religijnym wyraża kult i uwielbienie, nie ograniczając znaczenia wyłącznie do gestu fizycznego.
- source_word: αὐτῷ μόνῳ
  choice: tylko jemu
  rationale: Położenie „tylko” bezpośrednio przed zaimkiem jasno podkreśla wyłączność należnej Bogu służby.
- source_word: λατρεύσεις
  choice: będziesz służył
  rationale: Zachowuje rozróżnienie wobec προσκυνήσεις, a przypis sygnalizuje szczególny, religijny odcień tego czasownika.
theological_decisions:
- issue: Rozróżnienie προσκυνέω i λατρεύω
  choice: „oddawać cześć” oraz „służyć”
  alternative: Oddać oba czasowniki słownictwem czci albo przełożyć προσκυνέω dosłowniej jako „kłaniać się”
  rationale: Greka używa dwóch powiązanych, ale odrębnych czasowników. Rozróżnienie zachowuje napięcie między czcią oddawaną Bogu a wyłączną służbą dla Niego, bez narzucania węższej wykładni doktrynalnej.
- issue: Przyszła forma czasowników w cytacie jako nakaz
  choice: Zachować formy „będziesz oddawał” i „będziesz służył”
  alternative: 'Użyć jawnych rozkaźników: „oddawaj cześć” i „służ”'
  rationale: Forma przyszła wiernie odzwierciedla grecki cytat i w polskim stylu biblijnym pozostaje zrozumiała jako wiążący nakaz.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Teraźniejszy historyczny „mówi” zachowuje żywość greki, a składnia cytatu świadomie nawiązuje do podniosłego języka Pisma bez używania form archaicznych. Zaimek „jemu” zapisano małą literą zgodnie z praktyką nieingerowania typografią w tekst źródłowy.
