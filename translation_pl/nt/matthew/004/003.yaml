id: MAT.4.3
reference: Matthew 4:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: pl
  text: 'A kusiciel podszedł i powiedział do Niego: „Jeśli jesteś Synem Boga[a], powiedz, żeby te kamienie stały się bochenkami chleba[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też rozumieć: „Skoro jesteś Synem Boga”. Greckie zdanie warunkowe może mieć charakter wyzwania, a nie wyrażać zwykłego powątpiewania.'
    reason: alternative_reading
  - marker: b
    text: 'Dosłownie: „chlebami”; grecki rzeczownik występuje w liczbie mnogiej i może oznaczać bochenki chleba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu od προσέρχομαι opisuje zbliżenie się kusiciela przed wypowiedzią; „podszedł” naturalnie i precyzyjnie oddaje ten ruch.
- source_word: ὁ πειράζων
  choice: kusiciel
  rationale: Urzeczownikowiony imiesłów wskazuje na tego, który wystawia Jezusa na próbę i kusi; „kusiciel” jest zwięzłym, utrwalonym i kontekstowo trafnym określeniem.
- source_word: Εἰ
  choice: Jeśli
  rationale: Zachowuje formalny kształt greckiego warunku oraz jego możliwą funkcję retorycznego wyzwania, bez przesądzania, że mówiący rzeczywiście wątpi.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Synem Boga
  rationale: Konstrukcja orzecznikowa identyfikuje Jezusa za pomocą znanego tytułu. Wielka litera sygnalizuje tytuł, a dopełniacz „Boga” bezpośrednio oddaje τοῦ θεοῦ.
- source_word: εἰπὲ ἵνα
  choice: powiedz, żeby
  rationale: Połączenie trybu rozkazującego z ἵνα wprowadza treść lub zamierzony skutek wypowiedzi. Polski zwrot „powiedz, żeby” jest naturalny i nie wzmacnia czasownika do znaczenia „rozkazać”.
- source_word: οἱ λίθοι οὗτοι
  choice: te kamienie
  rationale: Oddaje rzeczownik λίθος i zachowuje wskazujący nacisk zaimka οὗτοι.
- source_word: ἄρτοι γένωνται
  choice: stały się bochenkami chleba
  rationale: „Stały się” neutralnie oddaje γένωνται, a „bochenkami chleba” zachowuje liczbę mnogą ἄρτοι w naturalnej polszczyźnie.
theological_decisions:
- issue: Siła zdania warunkowego Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: „Jeśli jesteś Synem Boga”
  alternative: „Skoro jesteś Synem Boga” lub „Jeśli rzeczywiście jesteś Synem Boga”
  rationale: Proste „jeśli” zachowuje zarówno formę grecką, jak i napięcie między możliwym powątpiewaniem, założeniem a prowokacyjnym wyzwaniem.
- issue: Chrystologiczny tytuł υἱὸς τοῦ θεοῦ
  choice: „Syn Boga”
  alternative: „syn Boga” lub „jeden z synów Boga”
  rationale: W kontekście Ewangelii Mateusza wyrażenie pełni funkcję określonego tytułu Jezusa, a nie oznaczenia przynależności do nieokreślonej klasy; przekład nie dodaje jednak treści ponad tekst.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia jest naturalna dla dzisiejszej polszczyzny, natomiast tytuł „Syn Boga” oraz słowo „kusiciel” zachowują biblijną powagę. Liczbę mnogą ἄρτοι oddano idiomatycznie jako „bochenki chleba”.
