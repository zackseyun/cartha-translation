  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: pl
  text: Wtedy diabeł zabiera go do świętego miasta[a] i stawia na szczycie świątyni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'To znaczy: Jerozolima.'
    reason: cross_reference
  - marker: b
    text: 'Lub: „na skrzydle świątyni”; greckie słowo może oznaczać wysuniętą krawędź, narożnik albo najwyższy punkt kompleksu świątynnego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, wprowadzający kolejne wydarzenie narracji.
- source_word: παραλαμβάνει
  choice: zabiera
  rationale: Historyczny czas teraźniejszy zachowano dla żywości narracji; „zabiera” naturalnie wyraża w tym kontekście wzięcie kogoś ze sobą.
- source_word: ὁ διάβολος
  choice: diabeł
  rationale: W tym kontekście słowo pełni funkcję utrwalonego tytułu osobowego, dlatego nie oddano go dosłownie jako „oszczerca”.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: do świętego miasta
  rationale: Przyimek „do” naturalnie wyraża kierunek ruchu, a określenie „święte miasto” zachowuje sformułowanie greckie bez zastępowania go nazwą własną.
- source_word: ἔστησεν
  choice: stawia
  rationale: 'Forma jest przechodnia i sprawcza: diabeł powoduje, że Jezus znajduje się i stoi w danym miejscu. Czas teraźniejszy współgra z narracyjnym „zabiera”.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: na szczycie
  rationale: To czytelne, tradycyjne określenie prawdopodobnego wysokiego lub wysuniętego elementu budowli; niepewność co do dokładnego elementu architektonicznego zachowano w przypisie.
- source_word: τοῦ ἱεροῦ
  choice: świątyni
  rationale: Zwięzłe i naturalne tłumaczenie; greckie ἱερόν może oznaczać cały kompleks świątynny, co doprecyzowano w przypisie.
theological_decisions:
- issue: Identyfikacja „świętego miasta”
  choice: Zachowano określenie „święte miasto” w tekście głównym.
  alternative: Jerozolima
  rationale: Greka posługuje się zaszczytnym określeniem, a nie nazwą własną; identyfikację podano w przypisie, aby uniknąć interpretacyjnego zastąpienia tekstu.
- issue: Znaczenie πτερύγιον τοῦ ἱεροῦ
  choice: na szczycie świątyni
  alternative: na skrzydle, występie lub krawędzi kompleksu świątynnego
  rationale: Dokładny element architektoniczny nie jest pewny. Tekst główny pozostaje płynny i zrozumiały, a przypis ujawnia zakres możliwych znaczeń zamiast pozornie rozstrzygać tę kwestię.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Zachowano historyczny czas teraźniejszy obu czasowników. Zaimek „go” zapisano małą literą zgodnie z neutralną normą przekładową, bez wprowadzania niewystępującego w grece wyróżnienia graficznego.
