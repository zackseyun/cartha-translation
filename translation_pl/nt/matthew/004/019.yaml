  source_fidelity: 'Tekst wiernie oddaje wszystkie elementy greckie: καὶ λέγει jako narracyjne „I mówi”, wezwanie Δεῦτε ὀπίσω μου jako „Chodźcie za mną”, przyszłe ποιήσω jako „uczynię” oraz metaforę ἁλιεῖς ἀνθρώπων jako „rybakami ludzi”. Polski rzeczownik „ludzi” poprawnie przekazuje ogólnoludzki zakres ἀνθρώπων.'
  naturalness: Brzmienie jest współczesne, zrozumiałe i zarazem stosownie podniosłe. „Chodźcie za mną” jest idiomatyczne, a „rybakami ludzi” stanowi utrwaloną i naturalną w polszczyźnie metaforę biblijną. Narracyjne „I mówi” jest dopuszczalne i dobrze zachowuje żywość greckiego praesens historicum.
  terminology: Terminologia jest trafna. „Rybacy ludzi” nie zawęża adresatów do mężczyzn, ponieważ polskie „ludzie” ma tu zakres ogólny, zgodny z ἀνθρώπων. Nie ma potrzeby dodawania przypisu odpowiadającego angielskiemu, gdyż polskie sformułowanie nie tworzy analogicznej dwuznaczności.
