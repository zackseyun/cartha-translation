id: MAT.4.19
reference: Matthew 4:19
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: pl
  text: 'I mówi do nich: „Chodźcie za mną, a uczynię was rybakami ludzi”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Czas teraźniejszy zachowuje grecki praesens historicum, które w polskiej narracji biblijnej brzmi naturalnie i żywo.
- source_word: Δεῦτε ὀπίσω μου
  choice: Chodźcie za mną
  rationale: Naturalne polskie wezwanie oddaje zarówno imperatyw Δεῦτε („chodźcie”), jak i ὀπίσω μου („za mną”), bez redukowania całego wyrażenia do samego „naśladujcie mnie”.
- source_word: ποιήσω ὑμᾶς
  choice: uczynię was
  rationale: Bezpośrednio oddaje przyszłą czynność Jezusa i jej przemieniający charakter.
- source_word: ἁλιεῖς
  choice: rybakami
  rationale: Najbliższy naturalny polski odpowiednik rzeczownika oznaczającego osoby łowiące ryby; zachowuje metaforę źródłową.
- source_word: ἀνθρώπων
  choice: ludzi
  rationale: Ἄνθρωπος w tym kontekście oznacza ludzi ogólnie. Polskie „ludzi” dokładnie oddaje ten zakres i naturalnie łączy się z metaforą „rybaków ludzi”.
theological_decisions:
- issue: Zakres znaczeniowy ἀνθρώπων
  choice: ludzi
  alternative: mężczyzn
  rationale: Dopełniacz liczby mnogiej odnosi się tu do istot ludzkich ogólnie, nie wyłącznie do dorosłych mężczyzn. „Ludzi” zachowuje powszechny zakres wezwania bez narzucania dodatkowej interpretacji.
- issue: Obraz uczniostwa w Δεῦτε ὀπίσω μου
  choice: Chodźcie za mną
  alternative: Naśladujcie mnie
  rationale: Wybrana forma zachowuje przestrzenny obraz podążania za Jezusem, który w kontekście wyraża uczniostwo, ale nie sprowadza go wyłącznie do moralnego naśladowania.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano narracyjny czas teraźniejszy oraz rozpoznawalną metaforę „rybaków ludzi”. Spójnik „a” naturalnie wyraża następstwo między wezwaniem a obietnicą.
