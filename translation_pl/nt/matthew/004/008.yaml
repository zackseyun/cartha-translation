id: MAT.4.8
reference: Matthew 4:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: pl
  text: Znów diabeł zabiera go na bardzo wysoką górę i pokazuje mu wszystkie królestwa świata oraz ich chwałę[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „wspaniałość”.'
    reason: Alternatywny odpowiednik δόξα, który w tym kontekście może oznaczać widzialny splendor i przepych królestw.
lexical_decisions:
- source_word: Πάλιν
  choice: Znów
  rationale: Wskazuje na kolejny, powtarzający się etap kuszenia; zwięzłe „znów” zachowuje ten sens i brzmi naturalnie po polsku.
- source_word: παραλαμβάνει
  choice: zabiera
  rationale: Czas teraźniejszy zachowuje żywość greckiej narracji historycznej, a „zabiera” naturalnie oddaje przemieszczenie wraz z drugą osobą.
- source_word: ὁ διάβολος
  choice: diabeł
  rationale: W tym kontekście jest to utrwalony tytuł przeciwnika; „diabeł” jest standardowym i zrozumiałym odpowiednikiem.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: na bardzo wysoką górę
  rationale: Przy ruchu ku górze polskie „na” jest naturalne, a „bardzo” zachowuje wzmocnienie wyrażone przez λίαν.
- source_word: δείκνυσιν
  choice: pokazuje
  rationale: Prosty odpowiednik greckiego czasownika, bez dodawania niewyrażonej intensywności.
- source_word: πάσας τὰς βασιλείας
  choice: wszystkie królestwa
  rationale: Zachowuje liczbę mnogą, pełny zakres wyrażony przez πάσας oraz polityczno-królewski sens βασιλεία.
- source_word: τοῦ κόσμου
  choice: świata
  rationale: Najbardziej naturalny i kontekstowo trafny odpowiednik κόσμος w odniesieniu do całego świata.
- source_word: τὴν δόξαν αὐτῶν
  choice: ich chwałę
  rationale: „Chwała” zachowuje podstawowy związek leksykalny z δόξα, choć w tym kontekście chodzi także o widzialny przepych lub wspaniałość; tę możliwość podaje przypis.
theological_decisions:
- issue: Charakter sceny na górze w opisie kuszenia
  choice: Oddać wydarzenie zgodnie z prostym brzmieniem narracji, nie określając sposobu ukazania wszystkich królestw.
  alternative: Interpretować je jako dosłowny ogląd geograficzny albo jako wizję bądź nadprzyrodzone objawienie.
  rationale: Tekst grecki mówi jedynie, że diabeł zabiera Jezusa na bardzo wysoką górę i pokazuje mu wszystkie królestwa świata oraz ich chwałę. Przekład nie powinien rozstrzygać, jak było to możliwe.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano grecki czas teraźniejszy narracji oraz małą literę w zaimku odnoszącym się do Jezusa, zgodnie ze zwykłą współczesną normą przekładową.
