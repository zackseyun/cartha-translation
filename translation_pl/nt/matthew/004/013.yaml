  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: pl
  text: Opuścił Nazarę[a], przybył do Kafarnaum nad morzem i zamieszkał na terytorium Zabulona i Neftalego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Po grecku: „Nazara”; w wielu przekładach: „Nazaret”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: opuścił
  rationale: Imiesłów aorystu wskazuje na czynność poprzedzającą zamieszkanie; polska forma osobowa naturalnie oddaje kolejność wydarzeń.
- source_word: Ναζαρὰ
  choice: Nazarę
  rationale: Zachowuje występującą w tekście greckim formę nazwy Ναζαρά, zamiast utożsamiać ją w samym tekście z bardziej znaną formą „Nazaret”.
- source_word: ἐλθὼν
  choice: przybył
  rationale: Imiesłów aorystu został oddany czasownikiem osobowym, co po polsku jasno i naturalnie przedstawia sekwencję czynności.
- source_word: κατῴκησεν
  choice: tam zamieszkał
  rationale: Czasownik oznacza zamieszkanie lub osiedlenie się; „zamieszkał” jest naturalne i nie przesądza, czy chodziło o stałe osiedlenie.
- source_word: Καφαρναοὺμ
  choice: Kafarnaum
  rationale: Utrwalona polska forma nazwy miejscowej.
- source_word: τὴν παραθαλασσίαν
  choice: położonego nad jeziorem
  rationale: Przymiotnik opisuje Kafarnaum jako miejscowość nad akwenem; w polskim kontekście geograficznym „jezioro” brzmi naturalniej niż dosłowne „morze”, odnosząc się do Jeziora Galilejskiego.
- source_word: ἐν ὁρίοις
  choice: na obszarze
  rationale: Liczba mnoga ὅρια może oznaczać granice, okolice lub terytorium; „na obszarze” zachowuje przestrzenny sens bez nadmiernego uściślania.
- source_word: Ζαβουλὼν
  choice: Zabulona
  rationale: Utrwalona polska biblijna forma nazwy plemiennej i geograficznej.
- source_word: Νεφθαλίμ
  choice: Neftalego
  rationale: Utrwalona polska biblijna forma nazwy plemiennej i geograficznej.
