  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: pl
  text: Oni zaś natychmiast[a] zostawili łódź i swego ojca i poszli za nim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „od razu”.'
    reason: Alternatywne, bardziej potoczne oddanie εὐθέως.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Oni zaś
  rationale: Rodzajnik użyty rzeczownikowo wskazuje na obu braci, a δέ łagodnie rozwija narrację. „Oni zaś” zachowuje spójność i subtelne przejście bez nadmiernego podkreślania kontrastu.
- source_word: εὐθέως
  choice: natychmiast
  rationale: Oddaje wyraźną bezzwłoczność reakcji oraz charakterystyczne dla narracji Mateusza tempo.
- source_word: ἀφέντες
  choice: zostawili
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą pójście za Jezusem. Polski czasownik osobowy brzmi naturalnie i nie narzuca mocniejszego sensu trwałego porzucenia.
- source_word: τὸ πλοῖον
  choice: łódź
  rationale: W kontekście połowu ryb πλοῖον oznacza łódź; „statek” sugerowałby większą jednostkę.
- source_word: τὸν πατέρα αὐτῶν
  choice: swego ojca
  rationale: Naturalna polska forma jasno odnosi ojca do obu braci i zachowuje rodzinny wymiar ich decyzji.
- source_word: ἠκολούθησαν αὐτῷ
  choice: poszli za Nim
  rationale: Zwrot zachowuje zarówno dosłowny ruch za Jezusem, jak i kontekst uczniostwa. Wielka litera w zaimku odpowiada utrwalonej, godnej polskiej konwencji odnoszenia się do Jezusa, nie zmieniając znaczenia greki.
theological_decisions:
- issue: Odpowiedź uczniów i rozstanie z ojcem
  choice: Bracia bezzwłocznie zostawiają łódź i ojca, aby pójść za Jezusem.
  alternative: „Porzucili” ojca na stałe albo tylko chwilowo od niego odeszli.
  rationale: Tekst podkreśla szybkość i zdecydowanie reakcji, lecz ἀφέντες samo w sobie nie rozstrzyga, czy rozstanie było trwałe. „Zostawili” zachowuje tę otwartość i nie wzmacnia wypowiedzi interpretacyjnym czasownikiem „porzucili”.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Powtórzenie spójnika „i” zachowuje nieskomplikowaną koordynację greckiego zdania; przypis sygnalizuje naturalny wariant leksykalny.
