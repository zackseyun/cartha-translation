  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: pl
  text: 'Gdy szedł brzegiem Jeziora Galilejskiego, zobaczył dwóch braci: Szymona, zwanego Piotrem, i jego brata Andrzeja, zarzucających sieć[a] do jeziora; byli bowiem rybakami.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „sieć zarzutowa”; greckie słowo oznacza sieć zarzucaną podczas połowu ryb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ
  choice: Gdy szedł
  rationale: Imiesłów czasu teraźniejszego opisuje czynność trwającą równocześnie z głównym czasownikiem; zdanie czasowe brzmi naturalnie po polsku. δέ pełni tu funkcję łagodnego łącznika narracyjnego i nie wymaga osobnego odpowiednika.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: brzegiem Jeziora Galilejskiego
  rationale: παρά z biernikiem wskazuje na przemieszczanie się wzdłuż akwenu. Choć θάλασσα dosłownie oznacza „morze”, utrwalona i geograficznie naturalna polska nazwa tego akwenu to „Jezioro Galilejskie”.
- source_word: εἶδεν
  choice: zobaczył
  rationale: Aoryst ὁράω jest prostym czasownikiem narracyjnym; „zobaczył” oddaje zdarzenie punktowe i nie dodaje znaczenia celowego przyglądania się.
- source_word: δύο ἀδελφούς
  choice: dwóch braci
  rationale: Kontekst jednoznacznie wskazuje na dwóch rodzonych braci płci męskiej.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Szymona, zwanego Piotrem
  rationale: Imiesłów λεγόμενον oddano naturalną polską konstrukcją imiesłowową; tradycyjne polskie formy imion są powszechnie zrozumiałe.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: jego brata Andrzeja
  rationale: Apozycja określa Andrzeja jako brata Szymona; polski szyk jasno zachowuje tę relację.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: Zarzucali ... sieć
  rationale: Imiesłów czasu teraźniejszego opisuje czynność braci w chwili, gdy Jezus ich zobaczył. „Zarzucali sieć” jest naturalnym polskim określeniem tej czynności, a szczególny typ sieci objaśnia przypis.
- source_word: εἰς τὴν θάλασσαν
  choice: w jezioro
  rationale: εἰς wyraża kierunek ruchu. „Jezioro” zachowuje spójność z przyjętą polską nazwą akwenu.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: byli bowiem rybakami
  rationale: γάρ wprowadza objaśnienie; „bowiem” zwięźle zachowuje tę relację. ἁλιεῖς oznacza tu zawodowo łowiących mężczyzn, czyli rybaków.
