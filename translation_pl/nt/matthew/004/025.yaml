  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: pl
  text: A szły za Nim wielkie tłumy z Galilei, Dekapolu, Jerozolimy, Judei i zza Jordanu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „z drugiej strony Jordanu”.'
    reason: Alternatywne oddanie przestrzennego wyrażenia πέραν τοῦ Ἰορδάνου.
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: szły za Nim
  rationale: Naturalny polski odpowiednik narracyjny, który zachowuje zarówno sens fizycznego podążania za Jezusem, jak i możliwe zainteresowanie uczniowskie, nie przesądzając o trwałym zobowiązaniu.
- source_word: ὄχλοι πολλοὶ
  choice: wielkie tłumy
  rationale: Idiomaticzne polskie wyrażenie oddające znaczną liczebność zgromadzonych ludzi; brzmi naturalniej niż dosłowne „liczne tłumy”.
- source_word: ἀπὸ
  choice: z
  rationale: Przyimek wskazuje pochodzenie tłumów i obejmuje cały wykaz miejsc.
- source_word: Γαλιλαίας
  choice: Galilei
  rationale: Utrwalona polska nazwa regionu w wymaganym przypadku.
- source_word: Δεκαπόλεως
  choice: Dekapolu
  rationale: Utrwalona polska forma nazwy obszaru dziesięciu miast.
- source_word: Ἱεροσολύμων
  choice: Jerozolimy
  rationale: Standardowa polska forma nazwy miasta; grecka forma gramatycznie mnoga nie jest odwzorowywana w polszczyźnie.
- source_word: Ἰουδαίας
  choice: Judei
  rationale: Utrwalona polska nazwa regionu.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: zza Jordanu
  rationale: Zwięzłe i naturalne określenie pochodzenia z obszaru leżącego po drugiej stronie Jordanu; zachowuje perspektywiczny sens greckiego wyrażenia.
- source_word: καὶ ... καὶ ... καὶ
  choice: i ... , ... , ... i
  rationale: Polska składnia wyliczenia nie wymaga mechanicznego powtarzania każdego spójnika; końcowe „i” zachowuje kumulacyjny charakter listy bez nienaturalnego brzmienia.
theological_decisions: []
