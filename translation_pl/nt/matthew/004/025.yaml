  verdict: approve
  source_fidelity: „Szły za Nim” wiernie oddaje ἠκολούθησαν αὐτῷ w sensie narracyjnego podążania, bez nadawania mu silniejszego znaczenia trwałego uczniostwa. „Wielkie tłumy” dobrze przekłada ὄχλοι πολλοί. Jedno „z” naturalnie obejmuje cały szereg miejsc, tak jak greckie ἀπό. „Zza Jordanu” trafnie oddaje πέραν τοῦ Ἰορδάνου jako pochodzenie z obszaru po drugiej stronie rzeki.
  naturalness: Tekst jest płynny i idiomatyczny we współczesnej polszczyźnie. Wyliczenie z przecinkami i końcowym „i” brzmi naturalnie; powtarzanie „z” lub „i” przy każdym członie byłoby niepotrzebnie ciężkie. Forma „A szły za Nim” zachowuje narracyjny tok wypowiedzi.
  terminology: Nazwy własne „Galilei”, „Dekapolu”, „Jerozolimy”, „Judei” i „Jordanu” są standardowe. Zapis „Nim” wielką literą jest dopuszczalną konwencją redakcyjną i nie zmienia znaczenia. Przypis podaje rzeczywistą, bezpieczną alternatywę przestrzenną.
