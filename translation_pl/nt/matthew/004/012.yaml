  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: pl
  text: Gdy usłyszał, że Jan został wydany[a], wycofał się do Galilei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub, dokładniej w tym kontekście: „został aresztowany”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Gdy usłyszał
  rationale: Imiesłów aorystu pełni tu funkcję czasową względem głównego czasownika. Polski podrzędny zwrot czasowy brzmi naturalnie i zachowuje tę relację; podmiotem domyślnym z kontekstu jest Jezus.
- source_word: δὲ
  choice: pominięte jako łagodny spójnik narracyjny
  rationale: δέ sygnalizuje przejście w narracji, bez wyraźnego przeciwstawienia. W tym krótkim zdaniu polszczyzna nie wymaga osobnego odpowiednika; dodanie „zaś” lub „wtedy” mogłoby nadać tekstowi mocniejszy odcień niż greka.
- source_word: Ἰωάννης
  choice: Jan
  rationale: Utrwalona polska forma imienia biblijnego.
- source_word: παρεδόθη
  choice: został wydany
  rationale: Strona bierna od παραδίδωμι ma szersze znaczenie niż techniczne „został aresztowany”. „Został wydany” zachowuje leksykalną szerokość i możliwy motyw przekazania w ręce władz, a kontekstowe doprecyzowanie podano w przypisie.
- source_word: ἀνεχώρησεν
  choice: odszedł
  rationale: ἀναχωρέω oznacza odejście lub wycofanie się w reakcji na okoliczności. „Odszedł” jest naturalne we współczesnej polszczyźnie i nie sugeruje nadmiernie ucieczki ani lęku.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: do Galilei
  rationale: εἰς wyraża kierunek. Polskie „do Galilei” jest idiomatycznym odpowiednikiem ruchu ku temu regionowi.
theological_decisions:
- issue: Znaczenie παραδίδωμι w odniesieniu do Jana
  choice: został wydany
  alternative: został aresztowany
  rationale: Grecki czasownik jest szerszy niż określenie samego aresztowania i w Ewangelii Mateusza może zachowywać motyw wydania w cudze ręce. Tekst główny nie zawęża znaczenia, natomiast przypis podaje bardziej szczegółowy sens wynikający z kontekstu.
translation_notes:
  register: Współczesna, godna i prosta polszczyzna narracyjna. Zachowano zwięzłość greckiego zdania oraz szerszy sens czasownika παραδίδωμι; uniknięto zbędnego wprowadzającego „zaś” i zbyt dramatycznego „wycofał się”.
