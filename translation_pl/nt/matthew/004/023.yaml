id: MAT.4.23
reference: Matthew 4:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: pl
  text: I przemierzał całą Galileę, nauczając w ich synagogach, głosząc dobrą nowinę o królestwie[a] oraz uzdrawiając każdą chorobę i każdą niemoc wśród ludu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ewangelię o królestwie”.'
    reason: Alternatywny, tradycyjny odpowiednik greckiego εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: przemierzał
  rationale: Imperfectum przedstawia trwającą, wędrowną działalność na całym obszarze; „przemierzał” naturalnie oddaje ruch z miejsca na miejsce.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: całą Galileę
  rationale: Przy czasowniku ruchu wyrażenie ma sens dystrybutywny, obejmujący cały region; polski biernik po „przemierzał” przekazuje go bez sztucznej dosłowności.
- source_word: διδάσκων
  choice: nauczając
  rationale: Imiesłów współczesny zachowuje równoczesność tej czynności z przemierzaniem Galilei.
- source_word: συναγωγαῖς αὐτῶν
  choice: w ich synagogach
  rationale: „Synagogi” jest utrwalonym i zrozumiałym określeniem żydowskich miejsc zgromadzeń, a „ich” zachowuje zaimek αὐτῶν.
- source_word: κηρύσσων
  choice: głosząc
  rationale: Oddaje publiczne, autorytatywne obwieszczanie, a zarazem brzmi naturalnie we współczesnej polszczyźnie biblijnej.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: dobrą nowinę o królestwie
  rationale: „Dobra nowina” przejrzyście oddaje podstawowe znaczenie εὐαγγέλιον, natomiast „o królestwie” naturalnie wyraża treściowy związek dopełniacza bez przesądzania ponad kontekst.
- source_word: θεραπεύων
  choice: uzdrawiając
  rationale: W tym kontekście czasownik oznacza rzeczywiste przywracanie zdrowia; „uzdrawiając” zachowuje szeroki zakres greckiego wyrazu.
- source_word: πᾶσαν νόσον
  choice: każdą chorobę
  rationale: „Choroba” jest zwykłym odpowiednikiem νόσος, a „każdą” zachowuje powtórzone πᾶσαν i jego nacisk na pełny zakres.
- source_word: πᾶσαν μαλακίαν
  choice: każdą niemoc
  rationale: „Niemoc” obejmuje osłabienie i dolegliwość oraz pozwala zachować rozróżnienie względem νόσος bez nadmiernego uszczegółowienia.
- source_word: ἐν τῷ λαῷ
  choice: wśród ludu
  rationale: Wyrażenie wskazuje środowisko, w którym dokonywały się uzdrowienia; „wśród ludu” jest zwięzłe i zachowuje zbiorowy charakter λαός.
theological_decisions:
- issue: Sposób oddania εὐαγγέλιον
  choice: dobra nowina
  alternative: ewangelia
  rationale: Wybrano przejrzysty znaczeniowo, współczesny odpowiednik, nie zmieniając treści teologicznej; tradycyjny termin podano w przypisie.
- issue: Relacja dopełniacza w τὸ εὐαγγέλιον τῆς βασιλείας
  choice: dobra nowina o królestwie
  alternative: dobra nowina królestwa
  rationale: Konstrukcja może określać nowinę przez jej treść lub przynależność; naturalne polskie „o królestwie” oddaje sens treściowy, nie rozwijając go w interpretację dotyczącą natury królestwa.
- issue: Zakres uzdrowień w πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: każdą chorobę i każdą niemoc
  alternative: wszelką chorobę i wszelką dolegliwość
  rationale: Powtórzenie „każdą” zachowuje emfatyczną wszechstronność dwóch wystąpień πᾶσαν, a dwa różne rzeczowniki nie zostają zlane w jedno ogólne określenie.
translation_notes:
  register: Język jest współczesny, zrozumiały i godny. Zachowano rozpoczynające zdanie „I”, zgodnie z Καί oraz ciągłością narracji, a także brak wyrażonego rzeczownikiem podmiotu w podanym tekście greckim. Imiesłowy „nauczając”, „głosząc” i „uzdrawiając” odtwarzają strukturę oraz równoległość oryginału.
