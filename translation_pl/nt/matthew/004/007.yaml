  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: pl
  text: 'Jezus mu powiedział: „Znowu jest napisane: «Nie będziesz wystawiał na próbę Pana, twojego Boga»”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też przetłumaczyć: „Nie będziesz próbował Pana, twojego Boga”. Greckie ἐκπειράζω znaczy „próbować” lub „wystawiać na próbę”.'
    reason: lexical_alternative
  - marker: b
    text: Cytat z Pwt 6,16. Greckie określenie „Pan” odzwierciedla sposób, w jaki Septuaginta oddaje imię Boże.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: mu odpowiedział
  rationale: W kontekście bezpośredniej repliki naturalne polskie „odpowiedział” oddaje prostą formułę wprowadzającą wypowiedź oraz celownik αὐτῷ, nie dodając szczególnej emfazy.
- source_word: Πάλιν
  choice: również
  rationale: πάλιν wprowadza kolejny, przeciwstawny cytat z Pisma. „Również” brzmi naturalnie w formule „Napisano również” i zachowuje sens ponownego odwołania do tekstu biblijnego.
- source_word: γέγραπται
  choice: Napisano
  rationale: To utrwalona polska formuła cytowania autorytatywnego Pisma; oddaje rezultatywny charakter greckiego perfectum bez niezręcznego dosłownego kalkowania.
- source_word: Οὐκ ἐκπειράσεις
  choice: Nie będziesz wystawiał na próbę
  rationale: Grecki czas przyszły pełni funkcję zakazu. „Wystawiać na próbę” trafnie oddaje ἐκπειράζω i zachowuje podniosły, prawny ton cytatu.
- source_word: κύριον τὸν θεόν σου
  choice: Pana, swojego Boga
  rationale: „Pan” odpowiada greckiemu κύριος, a „swojego Boga” naturalnie oddaje apozycję i zaimek σου. Przecinek ułatwia odczytanie wyrażenia jako „Pana, który jest twoim Bogiem”.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Standardowa polska postać imienia; greckiego rodzajnika przed imieniem własnym nie odtwarza się.
theological_decisions:
- issue: Oddanie κύριος w cytacie odnoszącym się do Boga Izraela
  choice: Pan
  alternative: PAN
  rationale: Bezpośrednim tekstem źródłowym jest greckie κύριος w cytacie zgodnym z Septuagintą. Tekst główny zachowuje więc „Pan”, a związek z imieniem Bożym objaśnia przypis.
- issue: Siła zakazu Οὐκ ἐκπειράσεις
  choice: Nie będziesz wystawiał na próbę
  alternative: Nie wystawiaj na próbę
  rationale: Forma z czasem przyszłym zachowuje styl prawnego zakazu obecny w greckim cytacie, bez rozstrzygania go jako zwykłego trybu rozkazującego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjną formułę cytowania Pisma „Napisano” oraz prawny ton zakazu. Markery przypisów umieszczono bezpośrednio po cytacie, w kolejności odpowiadającej objaśnieniom.
