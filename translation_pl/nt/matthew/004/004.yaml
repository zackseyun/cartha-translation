id: MAT.4.4
reference: Matthew 4:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: pl
  text: 'On zaś odpowiedział: „Napisano: «Nie samym chlebem będzie żył człowiek, lecz każdym słowem, które wychodzi przez usta Boga[a]»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Często przekłada się: „z ust Boga”. Grecki tekst ma dosłownie „przez usta Boga”, zachowując obraz słowa wypowiadanego przez Boga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: On zaś odpowiedział
  rationale: Naturalny polski odpowiednik narracyjnej formuły „odpowiadając, powiedział”; unika zbędnej redundancji, a δέ oddaje przez „zaś”.
- source_word: Γέγραπται
  choice: Napisano
  rationale: Utrwalona polska formuła wprowadzająca cytat z Pisma; strona bezosobowa odpowiada greckiemu perfectum strony biernej i zachowuje aktualną ważność zapisu.
- source_word: Οὐκ ἐπ’ ἄρτῳ μόνῳ
  choice: Nie samym chlebem
  rationale: Zwięzłe i idiomatyczne po polsku, zachowuje dosłowne znaczenie ἄρτος jako „chleb”, bez rozszerzania go do ogólnego „pokarmu”.
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: będzie żył człowiek
  rationale: Oddaje czas przyszły ζήσεται. Polski rzeczownik „człowiek” naturalnie ma tu znaczenie ogólne i odnosi się do każdego człowieka.
- source_word: παντὶ ῥήματι
  choice: każdym słowem
  rationale: „Słowo” jest naturalnym odpowiednikiem ῥῆμα w kontekście tego, co wypowiada Bóg.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: które wychodzi przez usta Boga
  rationale: 'Zdanie względne brzmi naturalniej po polsku niż imiesłów, a zarazem zachowuje obraz słowa wychodzącego oraz podstawowe znaczenie διά z dopełniaczem: „przez”.'
theological_decisions:
- issue: Ogólne znaczenie ὁ ἄνθρωπος
  choice: człowiek
  alternative: każdy człowiek; osoba
  rationale: Wypowiedź dotyczy ludzkości ogólnie. „Człowiek” zachowuje liczbę pojedynczą i reprezentatywny charakter greckiego wyrażenia bez zawężania go do mężczyzn.
- issue: Trwała ważność formuły Γέγραπται
  choice: Napisano
  alternative: Jest napisane
  rationale: Konwencjonalna formuła cytowania Pisma przekazuje autorytet tekstu bez dodawania objaśnienia doktrynalnego.
- issue: διά στόματος θεοῦ jako obraz Bożej wypowiedzi
  choice: przez usta Boga
  alternative: z ust Boga
  rationale: Wybrano „przez”, aby zachować konstrukcję grecką i obraz słowa przechodzącego przez Boże usta; przypis podaje bardziej zwyczajowy polski wariant.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjnie rozpoznawalne sformułowanie „Nie samym chlebem”, lecz czas przyszły oddano zgodnie z greckim ζήσεται. Cudzysłowy rozróżniają wypowiedź narracyjną i zawarty w niej cytat z Pisma.
