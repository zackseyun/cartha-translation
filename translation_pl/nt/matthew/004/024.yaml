  source_fidelity: Tekst trafnie oddaje zasadniczą strukturę i wszystkie elementy greckiego wyliczenia. „Wieść” oraz „rozeszła się” są dobrymi odpowiednikami ἀκοή i ἀπῆλθεν. Należy jednak usunąć „więc”, ponieważ samo καί nie wyraża tu wniosku ani skutku. „Będących pod władzą demonów” może niepotrzebnie wzmacniać zakres δαιμονιζομένους; „dręczonych przez demony” zachowuje nadprzyrodzony sens bez doprecyzowywania stopnia kontroli.
  naturalness: Rejestr jest współczesny, godny i naturalny. Skorygowane „I przyprowadzili do Niego” lepiej zachowuje prostą parataktyczną narrację grecką niż „Przyprowadzili więc”.
  terminology: „Syria”, „chorzy”, „rozmaite choroby”, „cierpienia”, „sparaliżowani” i „uzdrowił” są trafne. „Cierpiących na napady” ostrożnie komunikuje prawdopodobny referent σεληνιαζομένους, a przypis poprawnie zachowuje tradycyjne oraz etymologiczne tło terminu.
