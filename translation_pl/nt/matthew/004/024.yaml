  - severity: medium
    issue: „będących pod władzą demonów” może zawężać lub wzmacniać δαιμονιζομένους.
    rationale: Wyrażenie może sugerować pełną władzę lub kontrolę demonów. „Dręczonych przez demony” pozostaje wierne realnemu demonicznemu odniesieniu, lecz nie rozstrzyga zakresu oddziaływania ponad grecki imiesłów.
