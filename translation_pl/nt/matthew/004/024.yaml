id: MAT.4.24
reference: Matthew 4:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: pl
  text: Wieść o Nim rozeszła się po całej Syrii. I przyprowadzili do Niego wszystkich chorych, nękanych rozmaitymi chorobami i cierpieniami, dręczonych przez demony[a], cierpiących na napady[b] oraz sparaliżowanych, a On ich uzdrowił.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „opętanych przez demony” lub „będących pod władzą demonów”.'
    reason: lexical_alternative
  - marker: b
    text: Grecki wyraz tradycyjnie tłumaczono jako „epileptyków”; dosłownie odnosi się do ludzi uważanych za dotkniętych wpływem księżyca.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: wieść
  rationale: W tym kontekście oznacza to, co słyszano i rozpowiadano o Jezusie, nie zaś sam zmysł słuchu. „Wieść” jest naturalna i zachowuje sens rozpowszechnianej informacji.
- source_word: ἀπῆλθεν
  choice: rozeszła się
  rationale: Polski idiom naturalnie oddaje grecki obraz wieści wychodzącej i docierającej na cały obszar.
- source_word: Συρίαν
  choice: Syria
  rationale: Standardowa polska nazwa regionu.
- source_word: προσήνεγκαν
  choice: przyprowadzili
  rationale: Czasownik oznacza przyniesienie lub przyprowadzenie kogoś do Jezusa. W odniesieniu do całej zróżnicowanej grupy chorych „przyprowadzili” brzmi naturalnie, nie wykluczając udzielonej im pomocy.
- source_word: κακῶς ἔχοντας
  choice: chorych
  rationale: Grecki idiom oznacza ludzi będących w złym stanie zdrowia; zwięzłe „chorych” jasno przekazuje jego sens.
- source_word: ποικίλαις νόσοις
  choice: rozmaitymi chorobami
  rationale: Oddaje zarówno różnorodność wyrażoną przez ποικίλαις, jak i chorobowy sens νόσοις.
- source_word: βασάνοις συνεχομένους
  choice: nękanych … cierpieniami
  rationale: συνέχω przedstawia tych ludzi jako dotkliwie trapionych lub przytłoczonych, a βάσανος może oznaczać ból, mękę lub ciężkie cierpienie. Sformułowanie zachowuje intensywność bez nadmiernego zawężenia rodzaju dolegliwości.
- source_word: δαιμονιζομένους
  choice: będących pod władzą demonów
  rationale: Wyrażenie zachowuje rzeczywisty nadprzyrodzony desygnat, lecz nie narzuca jednego technicznego stopnia demonicznego oddziaływania. Tradycyjny wariant podano w przypisie.
- source_word: σεληνιαζομένους
  choice: cierpiących na napady
  rationale: W kontekście chodzi najpewniej o osoby doświadczające napadów drgawkowych. Przekład jest zrozumiały dla współczesnego czytelnika, a historyczne powiązanie terminu z księżycem zachowano w przypisie.
- source_word: παραλυτικούς
  choice: sparaliżowanych
  rationale: Naturalne współczesne określenie osób dotkniętych paraliżem.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: Standardowy i kontekstowo trafny polski odpowiednik czasownika oznaczającego leczenie lub uzdrawianie.
theological_decisions:
- issue: Zakres znaczeniowy δαιμονιζομένους
  choice: będących pod władzą demonów
  alternative: opętanych przez demony; nękanych przez demony
  rationale: Przekład nie demitologizuje wypowiedzi, ale też nie rozstrzyga ponad tekst, czy współczesna kategoria „opętania” wyczerpuje zakres greckiego imiesłowu. Alternatywę zachowano w przypisie.
- issue: Oddanie σεληνιαζομένους bez potwierdzania dawnej etiologii
  choice: cierpiących na napady
  alternative: epileptyków; dotkniętych wpływem księżyca
  rationale: Grecki termin jest etymologicznie związany z księżycem, lecz w wykazie chorób wskazuje na ludzi doświadczających napadów. Tekst główny przekazuje prawdopodobny objaw, natomiast przypis zachowuje dosłowne i tradycyjne skojarzenia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie zachowuje szeroką kategorię chorych oraz następujący po niej ciąg określeń, bez wprowadzania dwukropka, którego nie ma w tekście greckim. Wielka litera w zaimkach odnoszących się do Jezusa odpowiada utrwalonej polskiej konwencji religijnej.
