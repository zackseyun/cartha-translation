  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: pl
  text: Lud siedzący w ciemności ujrzał wielkie światło, a siedzącym w krainie i cieniu śmierci wzeszło światło.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λαὸς
  choice: lud
  rationale: „Lud” naturalnie oddaje zbiorową grupę ludzi i zachowuje podniosły, prorocki ton cytatu, nie sugerując współczesnego państwa ani narodu w sensie politycznym.
- source_word: καθήμενος / καθημένοις
  choice: siedzący / którzy siedzieli
  rationale: Dosłowne „siedzieć” zachowuje obrazowość i paralelizm z tekstem Izajasza; bardziej interpretacyjne „mieszkać” nie jest konieczne.
- source_word: σκοτίᾳ
  choice: ciemności
  rationale: Standardowy odpowiednik, który zachowuje zarówno dosłowną, jak i metaforyczną wymowę bez określania rodzaju ciemności.
- source_word: φῶς εἶδεν μέγα
  choice: ujrzał wielkie światło
  rationale: Aoryst oddano czasem przeszłym, a szyk dostosowano do naturalnej, godnej polszczyzny. „Ujrzał” dobrze współgra z prorockim obrazem nagłego objawienia się światła.
- source_word: χώρᾳ
  choice: krainie
  rationale: „Kraina” zachowuje sens obszaru lub ziemi i dobrze łączy się z poetyckim wyrażeniem „cień śmierci”, bez nowoczesnych skojarzeń politycznych.
- source_word: σκιᾷ θανάτου
  choice: cieniu śmierci
  rationale: Greka wyraźnie zawiera θανάτου, „śmierci”; zachowano więc ten tradycyjny i biblijnie nośny obraz zamiast redukować go do „głębokiej ciemności”.
- source_word: ἀνέτειλεν
  choice: wzeszło
  rationale: Czasownik przywołuje wschodzenie ciała niebieskiego lub światła. „Wzeszło światło” jest naturalnym polskim odpowiednikiem i zachowuje ten obraz.
- source_word: αὐτοῖς
  choice: tym
  rationale: Celownik grecki został naturalnie powiązany z polskim „tym, którzy”; odbiorcy światła pozostają wyraźnie wskazani, choć polski czasownik „wzeszło” nie wymaga przyimka.
theological_decisions:
- issue: Charakter obrazów ciemności i światła
  choice: Zachować obrazy bez doprecyzowania, czy ciemność jest duchowa, moralna, polityczna lub egzystencjalna, ani bez bezpośredniego utożsamienia światła.
  alternative: Wyjaśnić ciemność jako grzech lub niewiedzę pogan, a światło jako zbawcze objawienie Mesjasza.
  rationale: Prorocki obraz ma bogatą wymowę teologiczną, lecz sam grecki tekst tego zdania nie zawęża jego znaczenia. Przekład nie powinien rozstrzygać tej wieloznaczności przez dodanie interpretacji.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna z zachowaniem prorockiej obrazowości oraz paralelizmu. Tradycyjnie brzmiące wyrażenia „lud”, „kraina”, „cień śmierci” i „wzeszło światło” są nadal czytelne i odpowiadają stylowi cytatu biblijnego.
