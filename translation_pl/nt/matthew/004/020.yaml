  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: pl
  text: Oni zaś natychmiast zostawili sieci i poszli za Nim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Łagodny spójnik narracyjny; „zaś” zachowuje lekkie nawiązanie do poprzedniej wypowiedzi bez wprowadzania silnego przeciwstawienia.
- source_word: εὐθέως
  choice: natychmiast
  rationale: Oddaje nacisk na bezzwłoczną reakcję uczniów i odpowiada podniosłemu, a zarazem współczesnemu rejestrowi narracji.
- source_word: ἀφέντες
  choice: zostawili
  rationale: Imiesłów aorystu oznacza czynność poprzedzającą pójście za Jezusem. W naturalnej polszczyźnie współrzędne „zostawili… i poszli” jasno zachowuje tę kolejność bez niezręcznego „zostawiwszy”.
- source_word: τὰ δίκτυα
  choice: sieci
  rationale: Kontekst jednoznacznie wskazuje na sieci rybackie. Polski rzeczownik nie wymaga dodawania zaimka „swoje” ani określenia „rybackie”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: poszli za Nim
  rationale: Naturalnie oddaje konstrukcję ἀκολουθέω z celownikiem oraz zachowuje zarówno sens fizycznego podążenia za Jezusem, jak i rodzącej się więzi uczniowskiej.
theological_decisions:
- issue: Uczniowski odcień ἠκολούθησαν αὐτῷ
  choice: poszli za Nim
  alternative: podążyli za Nim
  rationale: 'Sformułowanie „poszli za Nim” zachowuje podwójny sens: konkretny ruch za Jezusem i wejście na drogę uczniostwa, nie czyniąc tego drugiego znaczenia bardziej wyraźnym, niż czyni to tekst grecki.'
translation_notes:
  register: Współczesna, prosta i godna polszczyzna narracyjna. Wielka litera w zaimku „Nim” jest zgodna z utrwaloną polską konwencją odnoszenia zaimków do Jezusa; nie zmienia treści zdania.
