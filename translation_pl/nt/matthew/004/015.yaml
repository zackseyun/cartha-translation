id: MAT.4.15
reference: Matthew 4:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: pl
  text: Ziemia Zabulona i ziemia Neftalego, droga nad morzem, za Jordanem, Galilea pogan[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „narodów”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Ziemia / ziemia
  rationale: Oddaje geograficzne znaczenie rzeczownika i zachowuje paralelne powtórzenie tekstu greckiego.
- source_word: Ζαβουλὼν
  choice: Zebulona
  rationale: Współczesna polska forma biblijnego imienia, odmieniona zgodnie z naturalną składnią wyrażenia „ziemia Zebulona”.
- source_word: Νεφθαλίμ
  choice: Neftalego
  rationale: Utrwalona polska forma biblijnego imienia, odmieniona zgodnie z naturalną składnią wyrażenia „ziemia Neftalego”.
- source_word: ὁδὸν θαλάσσης
  choice: droga nad morzem
  rationale: Naturalne polskie określenie drogi związanej z morzem; zachowuje ogólny charakter greckiej frazy, nie zastępując jej nazwą konkretnego szlaku.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: za Jordanem
  rationale: Zwięzły polski odpowiednik geograficznego idiomu „po tamtej stronie Jordanu”, bez dodatkowego objaśniania punktu widzenia.
- source_word: Γαλιλαία
  choice: Galilea
  rationale: Standardowa polska nazwa regionu.
- source_word: τῶν ἐθνῶν
  choice: pogan
  rationale: W żydowskim kontekście cytatu określenie wskazuje przede wszystkim na ludność nieżydowską; tradycyjne i zrozumiałe polskie „poganie” oddaje ten kontrast.
theological_decisions:
- issue: Znaczenie ἐθνῶν w cytacie z Izajasza
  choice: pogan
  alternative: narodów
  rationale: „Pogan” najczytelniej wyraża obecny w kontekście kontrast między Żydami a nie-Żydami, natomiast dosłowniejsza możliwość „narodów” została zachowana w przypisie, aby nie usuwać wieloznaczności.
translation_notes:
  register: Styl podniosły, lecz współczesny, odpowiedni dla poetyckiego cytatu prorockiego. Zachowano serię określeń geograficznych oraz końcowy myślnik wskazujący, że zdanie jest kontynuowane w następnym wersecie.
