source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: pl
  text: Wtedy Jezus został poprowadzony przez Ducha na pustkowie, aby był kuszony przez diabła[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „aby został poddany próbie”. Grecki czasownik może oznaczać zarówno „kusić”, jak i „poddawać próbie”, choć bezpośredni kontekst przemawia tutaj za „kuszony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski spójnik czasowy, który wskazuje na następstwo wydarzeń.
- source_word: ἀνήχθη
  choice: został poprowadzony
  rationale: Zachowuje stronę bierną i udział Ducha jako sprawcy; kierunkowe „w górę” nie brzmi tu naturalnie po polsku i nie jest konieczne dla sensu.
- source_word: εἰς τὴν ἔρημον
  choice: na pustkowie
  rationale: Oddaje odludny, niezamieszkany obszar bez nadmiernego precyzowania rodzaju terenu; jest naturalne w połączeniu z czasownikiem ruchu.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: przez Ducha
  rationale: Kontekst chrztu Jezusa wskazuje na Ducha Bożego; wielka litera sygnalizuje tę identyfikację bez dodawania nieobecnego w tekście przymiotnika „Świętego”.
- source_word: πειρασθῆναι
  choice: aby był kuszony
  rationale: Diabeł jako działający podmiot i dalszy przebieg opowiadania przemawiają za znaczeniem „kusić”; możliwe znaczenie „poddawać próbie” zachowano w przypisie.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: przez diabła
  rationale: W tym kontekście διάβολος jest utrwalonym określeniem osobowego przeciwnika; „diabeł” jest jasnym i naturalnym polskim odpowiednikiem.
theological_decisions:
- issue: Tożsamość τοῦ πνεύματος
  choice: Duch, rozumiany jako Duch Boży
  alternative: duch lub ludzki duch Jezusa
  rationale: Bezpośredni kontekst chrztu, w którym Duch zstępuje na Jezusa, zdecydowanie wskazuje na Ducha Bożego, lecz przekład nie dodaje słowa „Święty”.
- issue: Znaczenie πειρασθῆναι
  choice: aby był kuszony
  alternative: aby został poddany próbie
  rationale: Bezpośrednim sprawcą jest diabeł, a kolejne wersety opisują nakłanianie Jezusa; przypis zachowuje jednak szerszy zakres greckiego czasownika i napięcie między kuszeniem a próbą.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Pustkowie” zachowuje ogólność greckiego ἔρημος, a składnia pozostaje bliska tekstowi źródłowemu bez nienaturalnej kalki.
