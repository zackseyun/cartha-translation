  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: pl
  text: A po czterdziestu dniach i czterdziestu nocach postu poczuł głód.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „A gdy pościł czterdzieści dni i czterdzieści nocy, potem poczuł głód”.'
    reason: Alternatywny, bardziej dosłowny sposób oddania imiesłowu νηστεύσας oraz przysłówka ὕστερον.
lexical_decisions:
- source_word: νηστεύσας
  choice: gdy pościł
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą główne orzeczenie. Konstrukcja „gdy pościł” jest naturalna po polsku i wraz z „w końcu” zachowuje następstwo czasowe bez sugerowania, że głód pojawił się dopiero po całkowitym zakończeniu postu.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: przez czterdzieści dni i czterdzieści nocy
  rationale: Biernik rozciągłości czasu naturalnie oddaje polskie „przez”; zachowano pełną, uroczystą formułę źródłową.
- source_word: ὕστερον
  choice: w końcu
  rationale: Przysłówek wskazuje późniejszy moment po opisanym okresie. „W końcu” jest idiomatyczne i zachowuje osobną wartość słowa ὕστερον, której nie należy zacierać przez samo przekształcenie imiesłowu.
- source_word: ἐπείνασεν
  choice: poczuł głód
  rationale: Zwrot naturalnie wyraża wystąpienie głodu, a nie tylko statyczny stan. Jest współczesny i godny, bez archaicznego „łaknął”.
- source_word: καὶ
  choice: A
  rationale: „A” naturalnie łączy zdanie z wcześniejszą narracją, zachowując prostą funkcję greckiego καί.
theological_decisions:
- issue: Rzeczywista ludzka potrzeba Jezusa po długim poście
  choice: poczuł głód
  alternative: był głodny
  rationale: Sformułowanie jasno przekazuje rzeczywiste doświadczenie głodu, nie rozbudowując tekstu o dodatkowe twierdzenia doktrynalne.
- issue: Relacja czasowa między postem a pojawieniem się głodu
  choice: gdy pościł przez czterdzieści dni i czterdzieści nocy, w końcu poczuł głód
  alternative: po czterdziestu dniach i czterdziestu nocach postu poczuł głód
  rationale: 'Tekst źródłowy łączy imiesłów opisujący post z ὕστερον. Wybrana forma zachowuje pewne napięcie: głód następuje później, po upływie wskazanego okresu, bez przesadnie ścisłego rozstrzygania fizjologicznej chronologii.'
translation_notes:
  register: Współczesny, naturalny i godny rejestr polszczyzny. Zachowano biblijną pełnię wyrażenia „czterdzieści dni i czterdzieści nocy”, unikając zarówno archaizmu, jak i nadmiernej parafrazy.
