base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: pl
  text: Wtedy diabeł go opuścił. A oto podeszli aniołowie i usługiwali mu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „służyli mu”. Grecki czasownik może znaczyć „służyć” lub „usługiwać”, a forma czasu imperfectum wskazuje na trwającą czynność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, który zachowuje następstwo wydarzeń.
- source_word: ἀφίησιν
  choice: opuścił
  rationale: Grecki czas teraźniejszy pełni tu funkcję czasu historycznego; polski czas przeszły brzmi naturalnie w narracji. W tym kontekście czasownik oznacza odejście od Jezusa.
- source_word: ὁ διάβολος
  choice: diabeł
  rationale: W opowiadaniu o kuszeniu wyraz ten jest osobowym określeniem przeciwnika Jezusa; utrwalony polski odpowiednik zachowuje jasność odniesienia.
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje sygnał nagłego zwrócenia uwagi i podniosłą żywość greckiego wyrażenia, a zarazem jest zrozumiałe we współczesnej polszczyźnie.
- source_word: ἄγγελοι
  choice: aniołowie
  rationale: Kontekst wskazuje na istoty niebiańskie, nie na ludzkich posłańców.
- source_word: προσῆλθον
  choice: podeszli
  rationale: Oddaje ruch ku Jezusowi wyrażony czasownikiem προσέρχομαι; jest precyzyjniejsze niż samo „przyszli”.
- source_word: διηκόνουν
  choice: usługiwali
  rationale: Czasownik niedokonany naturalnie oddaje trwającą czynność wyrażoną greckim imperfectum, zachowując przy tym odpowiednio podniosły rejestr.
- source_word: αὐτῷ
  choice: mu
  rationale: Naturalny polski celownik wskazujący Jezusa jako odbiorcę posługi aniołów.
theological_decisions:
- issue: Znaczenie διάβολος jako określenia osobowego
  choice: diabeł
  alternative: oszczerca
  rationale: Choć etymologicznie możliwe jest „oszczerca”, w tym kontekście wyraz wskazuje na znaną postać z opowiadania o kuszeniu. „Diabeł” zachowuje jasność bez dodawania treści doktrynalnej.
- issue: Charakter działania aniołów wyrażony przez διηκόνουν
  choice: usługiwali mu
  alternative: służyli mu
  rationale: Oba znaczenia są możliwe. „Usługiwali” zachowuje niedokonany, trwający charakter czynności i nie precyzuje ponad tekst, na czym ta posługa polegała.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. „A oto” zachowuje żywość oryginału bez archaizacji; szyk zdań jest typowy dla polszczyzny, a aspekt niedokonany w „usługiwali” przekazuje ciągłość działania.
