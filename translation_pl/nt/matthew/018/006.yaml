id: MAT.18.6
reference: Matthew 18:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: pl
  text: Kto zaś doprowadzi do upadku[a] jednego z tych małych, którzy wierzą we mnie, temu byłoby lepiej, gdyby zawieszono mu u szyi kamień młyński obracany przez osła[b] i zatopiono go na otwartym morzu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „doprowadzi do grzechu jednego z tych małych, którzy wierzą we mnie”. Grecki czasownik może oznaczać spowodowanie czyjegoś potknięcia, upadku, odejścia od wiary lub grzechu.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „ośli kamień młyński”, czyli wielki kamień obracany przez osła.'
    reason: cultural_note
  - marker: c
    text: 'Można też oddać: „w głębi morza”. Greckie wyrażenie wskazuje szczególnie na otwarte morze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: doprowadzi do upadku
  rationale: 'Zachowuje metaforę potknięcia i upadku oraz jej szeroki duchowy sens: spowodowanie grzechu, odejścia od wiary lub zguby. Nie zawęża czasownika wyłącznie do popełnienia grzechu.'
- source_word: μικρῶν τούτων
  choice: tych małych
  rationale: Naturalne współczesne sformułowanie, które nie ogranicza odniesienia wyłącznie do dzieci; może oznaczać osoby mało znaczące, pokorne lub bezbronne.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: którzy wierzą we mnie
  rationale: Bezpośrednio i idiomatycznie oddaje imiesłowowy zwrot określający tych małych jako wierzących w Jezusa.
- source_word: συμφέρει αὐτῷ
  choice: dla tego byłoby lepiej
  rationale: W kontekście surowego ostrzeżenia naturalnie oddaje sens korzyści lub względnie lepszego losu.
- source_word: μύλος ὀνικός
  choice: kamień młyński obracany przez osła
  rationale: Wyraźnie oddaje dosłowne odniesienie do osła, a zarazem wskazuje na wielki kamień młyna napędzanego przez zwierzę, nie mały kamień żarnowy.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: u szyi
  rationale: To naturalny polski zwrot opisujący zawieszenie ciężaru na szyi.
- source_word: καταποντισθῇ
  choice: zatopiono go
  rationale: Oddaje stronę bierną i obraz pogrążenia człowieka w głębokiej wodzie; nie dopowiada sposobu wykonania czynności.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: na otwartym morzu
  rationale: πέλαγος oznacza morską otchłań lub rozległe, otwarte morze z dala od brzegu; wybrane brzmienie jest precyzyjne i naturalne.
theological_decisions:
- issue: Zakres określenia „tych małych”
  choice: Pozostawiono szerokie określenie „tych małych, którzy wierzą we mnie”.
  alternative: „tych dzieci, które wierzą we mnie”
  rationale: Choć bezpośredni kontekst wykorzystuje dziecko jako żywy przykład, dopowiedzenie „którzy wierzą we mnie” pozwala rozumieć tę grupę szerzej jako pokornych, mało znaczących lub bezbronnych uczniów. Przekład nie rozstrzyga tej możliwej wieloznaczności.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano surowość obrazu oraz szeroki sens „małych” i czasownika σκανδαλίζω, unikając archaicznego „maluczkich” i wyznaniowego doprecyzowania.
