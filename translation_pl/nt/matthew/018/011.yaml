  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: pl
  text: Syn Człowieczy przyszedł bowiem zbawić to, co zginęło.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tego wersetu nie ma w najwcześniejszych zachowanych rękopisach greckich, w tym w pochodzących z IV wieku kodeksach Synajskim i Watykańskim, ani we wczesnych przekładach koptyjskich. Występuje jednak w Kodeksie Bezy z V wieku, w większościowej tradycji bizantyjskiej oraz w łacińskiej Wulgacie. Prawdopodobnie został dodany przez późniejszych kopistów w celu upodobnienia tekstu do Łukasza 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: ocalić
  rationale: Bezokolicznik σῶσαι oznacza uratowanie od zguby. „Ocalić” jest naturalnym współczesnym odpowiednikiem i zachowuje zarówno wymiar ratunku, jak i teologiczny sens zbawienia, nie zawężając go nadmiernie.
- source_word: τὸ ἀπολωλός
  choice: to, co zginęło
  rationale: Rodzajnik z imiesłowem czasu perfectum w rodzaju nijakim liczby pojedynczej ma funkcję rzeczownikową. Przekład „to, co zginęło” zachowuje jego formę i stan wynikający z zaginięcia lub zguby, zamiast zmieniać nijaką liczbę pojedynczą w osobową liczbę mnogą.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony i zrozumiały polski odpowiednik tytułu używanego przez Jezusa; wielkie litery sygnalizują funkcję tytularną.
- source_word: γάρ
  choice: bowiem
  rationale: Oddaje uzasadniający związek zdania z poprzednim kontekstem, przy zachowaniu naturalnego, podniosłego szyku polskiego.
theological_decisions:
- issue: Zakres τὸ ἀπολωλός
  choice: Zachowano bezosobową, zbiorczą formę „to, co zginęło”.
  alternative: „zagubionych” lub „to, co było zaginione”
  rationale: Greka ma rodzaj nijaki liczby pojedynczej, dlatego nie należy bez konieczności rozstrzygać, że wyrażenie odnosi się gramatycznie wyłącznie do wielu osób. W kontekście sens obejmuje ludzi potrzebujących ocalenia, ale forma źródłowa pozostaje celowo szeroka.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Szyk z „bowiem” jest naturalny i zachowuje funkcję greckiego γάρ. Przekład pozostaje bliski składni i znaczeniu tekstu bizantyjskiego, a przypis jasno informuje o istotnym wariancie tekstowym.
