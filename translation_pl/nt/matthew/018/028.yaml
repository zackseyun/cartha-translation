  source_fidelity: 'Polski tekst wiernie oddaje grekę: „niewolnik / współniewolnik” zachowuje sens δοῦλος i σύνδουλος, „sto denarów” odpowiada ἑκατὸν δηνάρια, a „Chwycił go i zaczął dusić” dobrze przekazuje gwałtowną czynność κρατήσας oraz możliwy ingresywny charakter imperfectum ἔπνιγεν. „Cokolwiek jesteś winien” zasadnie zachowuje niedookreślony odcień εἴ τι ὀφείλεις, bez rozstrzygania spornej idiomatyki ponad tekst.'
  naturalness: Brzmienie jest współczesne, klarowne i ma stosowny, poważny rejestr narracyjny. „Współniewolnik” jest nieco formalne, lecz w tym kontekście celowo precyzyjne i zrozumiałe. Interpunkcja oraz podział zdania są naturalne po polsku.
  terminology: 'Terminologia jest konsekwentna: „niewolnik” i „współniewolnik” odpowiadają sobie semantycznie, a „denar” trafnie zachowuje realium historyczne. Przypis b podaje rzeczywiście dosłowniej warunkową formę grecką; przypis a jest rzeczowy i właściwie zakotwiczony przy „denarach”.'
