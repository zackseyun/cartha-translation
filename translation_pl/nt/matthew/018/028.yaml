id: MAT.18.28
reference: Matthew 18:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: pl
  text: 'Lecz gdy ów niewolnik wyszedł, spotkał jednego ze swoich współniewolników, który był mu winien sto denarów[a]. Chwycił go i zaczął dusić, mówiąc: „Oddaj, cokolwiek jesteś winien!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denar był powszechną zapłatą za dzień pracy robotnika lub żołnierza.
    reason: cultural_note
  - marker: b
    text: 'Bardziej dosłownie: „Oddaj, jeśli jesteś coś winien”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: niewolnik
  rationale: Oddaje zależny status postaci oraz realia własności i przymusu istotne dla tej przypowieści; „sługa” nadmiernie łagodziłby sens.
- source_word: ἐξελθὼν δὲ
  choice: Lecz gdy… wyszedł
  rationale: Naturalnie oddaje narracyjne δέ oraz czasową funkcję imiesłowu aorystu.
- source_word: σύνδουλος
  choice: współniewolnik
  rationale: Zachowuje znaczenie przedrostka σύν- i konsekwentnie odpowiada przekładowi δοῦλος jako „niewolnik”.
- source_word: ἑκατὸν δηνάρια
  choice: sto denarów
  rationale: Zachowuje historyczną nazwę monety i kontrast tej sumy z ogromnym długiem opisanym wcześniej.
- source_word: κρατήσας
  choice: Chwycił go
  rationale: Zwięźle oddaje gwałtowny, fizyczny charakter czynności.
- source_word: ἔπνιγεν
  choice: zaczął dusić
  rationale: 'Oddaje niedokonany, możliwie ingresywny aspekt imperfectum: przemoc rozpoczęła się i trwała.'
- source_word: Ἀπόδος
  choice: Oddaj
  rationale: Krótki, stanowczy rozkaz właściwy kontekstowi egzekwowania długu.
- source_word: εἴ τι ὀφείλεις
  choice: cokolwiek jesteś winien
  rationale: Naturalnie oddaje możliwy nieokreślony sens wyrażenia εἴ τι, nie zmieniając go w odniesienie do ściśle wskazanej należności; bardziej dosłowną postać zachowano w przypisie.
theological_decisions:
- issue: Sposób oddania δοῦλος w narracji przypowieściowej
  choice: niewolnik / współniewolnik
  alternative: sługa / współsługa
  rationale: Scena zakłada podległość właścicielowi i przemoc między osobami pozostającymi w niewoli. Mocniejsze określenie wierniej zachowuje społeczne realia tekstu bez narzucania interpretacji wyznaniowej.
- issue: Nieokreślony charakter żądania εἴ τι ὀφείλεις
  choice: cokolwiek jesteś winien
  alternative: to, co jesteś winien / jeśli jesteś coś winien
  rationale: Wybrana forma zachowuje nieokreśloność i groźny ton żądania; dosłownie warunkową konstrukcję podano w przypisie, aby nie usuwać rzeczywistej dwuznaczności.
translation_notes:
  register: Współczesny, godny i bezpośredni język narracyjny. Zachowano historyczne „denary” oraz społecznie precyzyjne „niewolnik”. Długie zdanie greckie podzielono po informacji o długu, aby przemoc i wypowiedź pozostały czytelne w naturalnej polszczyźnie. Markery przypisów umieszczono przy treści, której dotyczą.
