source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: pl
  text: 'Jeszcze raz zapewniam was: jeśli dwaj z was na ziemi zgodzą się w jakiejkolwiek sprawie, o którą poproszą,[a] mój Ojciec w niebie[b] uczyni to dla nich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: W najbliższym kontekście słowa te następują po nauczaniu Jezusa o postępowaniu wspólnoty i jej autorytecie (18,15–18), choć sam werset mówi szeroko o zgodnych prośbach.
    reason: cross_reference
  - marker: b
    text: 'Dosłownie: „w niebiosach”; po polsku oddano idiomatycznie jako „w niebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: I jeszcze raz
  rationale: Oddaje ponowienie lub uzupełnienie uroczystej wypowiedzi i naturalnie łączy ją z poprzednim nauczaniem.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: zapewniam was
  rationale: Naturalny współczesny odpowiednik uroczystej formuły Jezusa, zachowujący jej stanowczy i prawdziwościowy charakter bez zbędnej transliteracji.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: jeśli dwaj z was […] zgodzą się
  rationale: συμφωνέω oznacza tu osiągnięcie zgody, a ἐξ ὑμῶν naturalnie oddaje polskie „z was”.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: Zachowuje wskazanie ziemskiej sfery, pozostające w kontraście do Ojca w niebie.
- source_word: περὶ παντὸς πράγματος
  choice: co do jakiejkolwiek sprawy
  rationale: πρᾶγμα ma szerokie znaczenie „sprawa, rzecz”; wybrane sformułowanie jest naturalne i nie zawęża zakresu wypowiedzi.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: o którą będą prosić
  rationale: Oddaje nieokreśloną konstrukcję względną oraz sens αἰτέω jako proszenia, bez dopowiadania w tekście głównym, że chodzi wyłącznie o określony rodzaj modlitwy.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: mój Ojciec […] uczyni to dla nich
  rationale: Naturalna polska konstrukcja ujawnia sprawczość Ojca, którą dopuszcza παρά z dopełniaczem przy γενήσεται, i zachowuje sens działania na rzecz proszących.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: w niebie
  rationale: Idiomaticzne polskie określenie miejsca przebywania Ojca; grecka liczba mnoga nie wymaga tu mechanicznego odwzorowania.
theological_decisions:
- issue: Zakres obietnicy w kontekście
  choice: Wypowiedź oddano szeroko, bez dodawania w tekście głównym ograniczeń dotyczących dyscypliny wspólnotowej, modlitwy lub woli Bożej.
  alternative: Wyraźnie ograniczyć obietnicę do decyzji związanych z dyscypliną wspólnoty albo przedstawić ją jako nieograniczoną gwarancję spełnienia każdej modlitwy.
  rationale: Najbliższy kontekst dotyczy postępowania wspólnoty i jej autorytetu (18,15–18), a αἰτέω wskazuje na prośbę, zapewne kierowaną do Boga. Sam werset nie zawiera jednak dodatkowych kwalifikacji, dlatego przekład zachowuje jego szerokie brzmienie i napięcie kontekstowe.
- issue: Źródło lub sprawca spełnienia prośby
  choice: „mój Ojciec […] uczyni to dla nich”
  alternative: „stanie się to dla nich od mojego Ojca”
  rationale: παρά z dopełniaczem może wskazywać źródło lub sprawcę. Wybrane brzmienie jest naturalne po polsku i wyraźnie wskazuje na działanie Ojca, nie dodając innego pośrednika ani mechanizmu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Zapewniam was” oddaje uroczystość formuły ἀμὴν λέγω ὑμῖν, a składnia pozostaje płynna dla zwykłego polskiego czytelnika. Nie wprowadzono konfesyjnych objaśnień ani doktrynalnych ograniczeń niewyrażonych w grece.
