id: MAT.18.33
reference: Matthew 18:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: pl
  text: Czy i ty nie powinieneś był zmiłować się nad swoim współniewolnikiem[a], tak jak i ja zmiłowałem się nad tobą?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „współsługą”. Greckie σύνδουλος oznacza niewolnika lub sługę mającego tego samego pana.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Czy ... nie powinieneś był
  rationale: Bezokolicznikowa konstrukcja z bezosobowym ἔδει wyraża moralną powinność. Polska forma pytania retorycznego zachowuje naganę i odniesienie do zaniechanego działania w przeszłości.
- source_word: καὶ σὲ
  choice: i ty
  rationale: Καί włącza adresata w paralelę z wcześniejszym działaniem króla, a polski mianownik „ty” jest naturalny przy osobowej konstrukcji z „powinieneś”.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: zmiłować się / zmiłowałem się
  rationale: Powtórzenie tego samego polskiego czasownika zachowuje leksykalną więź między oczekiwanym miłosierdziem sługi a miłosierdziem okazanym mu przez pana. „Zmiłować się nad” jest godne, zrozumiałe i ma właściwy ciężar etyczny.
- source_word: τὸν σύνδουλόν σου
  choice: swoim współniewolnikiem
  rationale: Σύνδουλος oznacza niewolnika mającego tego samego pana. „Współniewolnik” zachowuje zarówno człon σύν- (współ-), jak i zależny, niewolny status postaci w przypowieści; zaimek zwrotny „swoim” jest naturalny po polsku.
- source_word: ὡς κἀγὼ
  choice: tak jak i ja
  rationale: Wyrażenie oddaje porównanie oraz emfatyczne καὶ w κἀγώ, uwydatniając ścisłą paralelę między postępowaniem pana a powinnością sługi.
theological_decisions:
- issue: Oddanie terminu z rodziny δοῦλος w σύνδουλος
  choice: współniewolnik
  alternative: współsługa; drugi niewolnik tego samego pana
  rationale: Kontekst przypowieści podkreśla władzę pana nad zależnymi od niego ludźmi. „Współniewolnik” nie łagodzi tego statusu do dobrowolnej służby, a przypis podaje bardziej tradycyjny odpowiednik.
translation_notes:
  register: Współczesna, godna polszczyzna z wyraźną siłą pytania retorycznego. Celowo zachowano dwukrotne „zmiłować się”, aby odtworzyć powtórzenie greckiego ἐλεέω, oraz dosłowny sens zależnego statusu w σύνδουλος.
