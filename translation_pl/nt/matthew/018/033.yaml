  source_fidelity: Tekst wiernie oddaje pytanie retoryczne z οὐκ ἔδει, moralną powinność odnoszącą się do przeszłości („nie powinieneś był”), paralelne καί („i ty” / „i ja”), powtórzenie ἐλεέω oraz porównanie ὡς. „Zmiłować się nad” trafnie przekazuje sens okazania miłosierdzia, a „współniewolnik” zachowuje znaczenie σύνδουλος jako osoby podległej temu samemu panu.
  naturalness: Brzmienie jest naturalne we współczesnej, godnej polszczyźnie. Szyk „Czy i ty nie powinieneś był...” dobrze niesie naganę pytania retorycznego. „Współniewolnik” jest słowem mniej częstym, ale przejrzystym znaczeniowo i uzasadnionym kontekstem przypowieści.
  terminology: Konsekwentne powtórzenie „zmiłować się” zachowuje więź leksykalną oryginału. „Współniewolnik” właściwie odzwierciedla σύνδουλος bez łagodzenia zależnego statusu; przypis poprawnie podaje „współsługę” jako możliwy wariant.
