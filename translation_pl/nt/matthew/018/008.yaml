id: MAT.18.8
reference: Matthew 18:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: pl
  text: A jeśli twoja ręka albo stopa prowadzi cię do upadku[a], odetnij ją i odrzuć od siebie. Lepiej jest dla ciebie wejść do życia okaleczonym lub kulawym, niż mając obie ręce albo obie stopy, zostać wrzuconym w ogień wieczny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „prowadzi cię do grzechu”. Grecki czasownik dosłownie przywołuje obraz spowodowania potknięcia lub upadku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: prowadzi cię do upadku
  rationale: Zachowuje grecki obraz potknięcia i upadku, a zarazem w naturalnej polszczyźnie wskazuje na moralne niebezpieczeństwo. Dosłowne „powoduje, że się potykasz” byłoby mniej idiomatyczne.
- source_word: ἔκκοψον
  choice: odetnij
  rationale: Oddaje stanowczy, konkretny imperatyw i nie łagodzi drastyczności wypowiedzi.
- source_word: βάλε ἀπὸ σοῦ
  choice: odrzuć od siebie
  rationale: Wyraża zarówno energiczne usunięcie, jak i oddalenie od siebie; brzmi naturalnie i dostojnie.
- source_word: καλόν σοί ἐστιν
  choice: lepiej jest dla ciebie
  rationale: W konstrukcji porównawczej z ἤ przymiotnik καλόν ma sens idiomatycznie porównawczy.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: wejść do życia
  rationale: Zachowuje samo „życie”, bez dopowiadania „wieczne”, którego w tym miejscu tekst grecki nie zawiera.
- source_word: κυλλὸν
  choice: okaleczonym
  rationale: Termin oznacza osobę okaleczoną lub pozbawioną części ciała; wybór odpowiada bezpośredniemu kontekstowi odcięcia ręki.
- source_word: χωλόν
  choice: kulawym
  rationale: Jest to bezpośredni i zrozumiały współczesny odpowiednik określenia osoby niesprawnej w chodzeniu wskutek uszkodzenia nogi lub stopy.
- source_word: δύο χεῖρας ἢ δύο πόδας ἔχοντα
  choice: mając obie ręce albo obie stopy
  rationale: Polskie „obie” naturalnie oddaje posiadanie dwóch członków ciała i zachowuje kontrast z okaleczeniem.
- source_word: βληθῆναι
  choice: zostać wrzuconym
  rationale: Zachowuje stronę bierną i gwałtowność czasownika βάλλω.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: ogień wieczny
  rationale: To naturalny polski odpowiednik frazy w kontekście sądu, bez rozwijania jej znaczenia w tekście głównym.
theological_decisions:
- issue: Czy σκανδαλίζει oddać wprost jako powodowanie grzechu, czy zachować metaforę upadku
  choice: prowadzi cię do upadku
  alternative: prowadzi cię do grzechu
  rationale: Tekst grecki zachowuje obraz potknięcia lub upadku. Przekład główny nie zawęża go do objaśniającej interpretacji moralnej, którą podano w przypisie.
- issue: Znaczenie τὴν ζωὴν
  choice: życie
  alternative: życie wieczne
  rationale: Kontekst nadaje temu życiu wymiar eschatologiczny, lecz rzeczownik αἰώνιος nie określa tu słowa ζωή. Przekład nie dopowiada elementu nieobecnego w tekście.
- issue: Dosłowność nakazu odcięcia ręki lub stopy
  choice: zachowanie dosadnego nakazu bez rozstrzygania, czy jest hiperbolą
  alternative: parafraza jako wezwanie do radykalnego usunięcia przyczyny grzechu
  rationale: Tekst ma celowo skrajną i konkretną formę. Przekład powinien zachować jej napięcie, nie narzucając interpretacji w tekście głównym.
translation_notes:
  register: Współczesna, standardowa polszczyzna o podniosłym, lecz przystępnym brzmieniu. Użycie pary „ręka albo stopa” pozwala zachować precyzję anatomiczną źródła, a zarazem naturalne odniesienie zaimka „ją”. Drastyczność obrazu pozostawiono bez złagodzenia.
