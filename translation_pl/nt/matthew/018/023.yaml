source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: pl
  text: Dlatego królestwo niebios zostało porównane[b] do króla, który chciał przeprowadzić rozrachunek ze swoimi niewolnikami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „sługami”; gr. δοῦλοι oznacza osoby pozostające pod władzą pana i może być tłumaczone jako „niewolnicy” lub „słudzy”.'
    reason: alternative_reading
  - marker: b
    text: 'Bliżej dosłownie: „zostało upodobnione”; idiomatycznie także: „jest podobne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dlatego
  rationale: Naturalnie oddaje wynikowy i wyjaśniający związek przypowieści z poprzedzającą nauką.
- source_word: ὡμοιώθη
  choice: zostało porównane
  rationale: Zachowuje stronę bierną aorystu ὁμοιόω i jasno wprowadza porównanie, bez sugerowania przemiany królestwa.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Oddaje charakterystyczne dla Mateusza wyrażenie z dopełniaczem liczby mnogiej i brzmi naturalnie oraz godnie po polsku.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: do króla
  rationale: Rzeczownik βασιλεῖ doprecyzowuje ἀνθρώπῳ; polskie „do króla” przekazuje sens bez niezręcznego „do człowieka, króla”.
- source_word: ἠθέλησεν
  choice: chciał
  rationale: Bezpośrednio oddaje wolę lub zamiar wyrażony przez θέλω, nie wzmacniając go do „postanowił”.
- source_word: συνᾶραι λόγον
  choice: rozliczyć się
  rationale: Naturalny polski odpowiednik idiomu oznaczającego dokonanie obrachunku; w połączeniu z „ze swoimi niewolnikami” zachowuje sens finansowego rozrachunku.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: ze swoimi niewolnikami
  rationale: Władza króla, zadłużenie i dalszy przebieg przypowieści uwydatniają zależny, niewolny status osób określonych jako δοῦλοι.
theological_decisions:
- issue: Oddanie δοῦλος w królewskim i ekonomicznym kontekście przypowieści
  choice: niewolnikami
  alternative: sługami
  rationale: „Niewolnikami” przejrzyście zachowuje podległość i status prawny sygnalizowane przez δοῦλοι oraz władzę króla; „sługami” pozostaje możliwym, lecz mniej precyzyjnym odpowiednikiem.
- issue: Charakter porównania królestwa z postacią króla
  choice: królestwo niebios zostało porównane do króla
  alternative: królestwo niebios jest podobne do króla
  rationale: Strona bierna zachowuje formę tekstu greckiego i nie rozstrzyga, kto dokonuje porównania; przypowieść rozwija analogię przez działania króla.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano Mateuszowe „królestwo niebios”, bierną formę porównania oraz ekonomiczny sens rozrachunku.
