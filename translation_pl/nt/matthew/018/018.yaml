source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: pl
  text: 'Zaprawdę mówię wam: cokolwiek zwiążecie na ziemi, będzie już związane w niebie, a cokolwiek rozwiążecie na ziemi, będzie już rozwiązane w niebie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też tradycyjnie: „będzie związane w niebie… będzie rozwiązane w niebie”. Grecka konstrukcja łączy czasownik w czasie przyszłym z imiesłowem perfectum i może wskazywać na stan już ustanowiony w niebie.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: Uroczysta formuła potwierdzająca, która w naturalnym, podniosłym polskim wprowadza autorytatywną wypowiedź Jezusa.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośredni i naturalny odpowiednik standardowej formuły mowy, zachowujący liczbę mnogą zaimka.
- source_word: ὅσα ἐὰν
  choice: cokolwiek
  rationale: Oddaje nieokreślony, ogólny zakres greckiego wyrażenia bez sztucznego „wszystko, co”.
- source_word: δήσητε
  choice: zwiążecie
  rationale: Zachowuje podstawową metaforę czasownika δέω oraz jej szerszy, możliwy sens autorytatywny, bez zawężania jej wyłącznie do „zakazywania”.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: Naturalny polski odpowiednik przestrzennego określenia przeciwstawionego niebu.
- source_word: ἔσται δεδεμένα
  choice: będzie już związane
  rationale: Polszczyzna nie ma odrębnej formy czasu przyszłego dokonanego odpowiadającej dokładnie konstrukcji ἔσται z imiesłowem perfectum. „Będzie już związane” wskazuje na stan istniejący w przyszłym punkcie odniesienia i częściowo zachowuje wynikowy charakter greckiej formy.
- source_word: ἐν οὐρανῷ
  choice: w niebie
  rationale: Naturalnie oddaje liczbę pojedynczą i znaczenie nieba jako sfery Bożej.
- source_word: λύσητε
  choice: rozwiążecie
  rationale: Zachowuje metaforyczne przeciwieństwo „wiązać — rozwiązywać” i nie zawęża sensu jedynie do „zezwalać” lub „uwalniać”.
- source_word: ἔσται λελυμένα
  choice: będzie już rozwiązane
  rationale: Równolegle do pierwszej części oddaje przyszły stan będący wynikiem dokonanego działania, bez przesądzania pełnej teorii relacji między decyzją ziemską a niebiańską.
theological_decisions:
- issue: Czasowa i teologiczna relacja między wiązaniem lub rozwiązywaniem na ziemi a stanem w niebie
  choice: „będzie już związane / będzie już rozwiązane w niebie”
  alternative: „będzie związane / będzie rozwiązane w niebie”
  rationale: Konstrukcja z przyszłą formą εἰμί i imiesłowem perfectum może wskazywać na przyszły stan wynikający z działania dokonanego wcześniej. Dodanie „już” sygnalizuje ten aspekt, ale przypis zachowuje tradycyjne i gramatycznie możliwe odczytanie prostszą formą przyszłą. Przekład nie rozstrzyga denominacyjnej teorii władzy kościelnej.
translation_notes:
  register: Język współczesny, zwięzły i godny. „Zaprawdę” zachowuje uroczysty charakter wypowiedzi; tradycyjna para „wiązać — rozwiązywać” pozostawia metaforę i jej zamierzoną pojemność znaczeniową.
