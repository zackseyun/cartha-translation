id: MAT.18.35
reference: Matthew 18:35
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: pl
  text: Tak też mój Ojciec niebieski postąpi z wami, jeśli każdy z was nie przebaczy z serca swojemu bratu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie „bratu” ma rodzaj męski i liczbę pojedynczą; w tym kontekście odnosi się reprezentatywnie do każdego współucznia lub współwierzącego. Dosłownie końcowe słowa brzmią: „z waszych serc”.'
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Tak też
  rationale: Naturalnie wprowadza zastosowanie poprzedniej przypowieści i zachowuje jej porównawczo-wnioskujący charakter.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mój Ojciec niebieski
  rationale: Utrwalone i godne polskie sformułowanie, zachowujące zarówno zaimek „mój”, jak i przymiotnik οὐράνιος.
- source_word: ποιήσει ὑμῖν
  choice: postąpi z wami
  rationale: Naturalny polski odpowiednik odnoszący działanie Ojca do postępowania pana z przypowieści. Nie dopowiada rodzaju ani ostatecznego zakresu sądu.
- source_word: ἐὰν μὴ
  choice: jeśli ... nie
  rationale: Zachowuje przejrzystą formę warunku przeczącego; możliwe byłoby również „jeżeli nie” lub „chyba że”.
- source_word: ἀφῆτε
  choice: przebaczy
  rationale: W kontekście winy, długu i relacji między uczniami ἀφίημι oznacza przebaczenie.
- source_word: ἕκαστος
  choice: każdy z was
  rationale: Oddaje jednostkową, rozdzielczą odpowiedzialność członków liczby mnogiej „wy”.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: swojemu bratu
  rationale: Polski zaimek zwrotny naturalnie wskazuje, że chodzi o brata każdej z osób objętych wezwaniem; rzeczownik zachowuje męską liczbę pojedynczą tekstu greckiego.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: z serca
  rationale: 'To naturalny polski idiom oznaczający szczere, wewnętrzne przebaczenie. Greka ma dosłownie liczbę mnogą: „z waszych serc”.'
theological_decisions:
- issue: Zakres i siła ostrzeżenia
  choice: Bezpośrednie ostrzeżenie, że Ojciec postąpi z adresatami na wzór pana z przypowieści
  alternative: Dopowiedzenie, że chodzi konkretnie o wieczne potępienie albo jedynie utratę nagrody
  rationale: Werset zawiera poważne ostrzeżenie warunkowe, lecz sam nie określa pełnej systematyczno-teologicznej kategorii sądu; przekład zachowuje tę powagę i napięcie.
- issue: Rodzaj gramatyczny słowa ἀδελφῷ
  choice: swojemu bratu
  alternative: bratu lub siostrze; współwierzącemu
  rationale: Grecki tekst ma męską liczbę pojedynczą. Przekład jej nie neutralizuje, a reprezentatywny zakres wyjaśnia w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym i bezpośrednim brzmieniu. Szyk „przebaczy z serca swojemu bratu” jest naturalny, a zarazem zachowuje nacisk na szczerość przebaczenia. Marker przypisu występuje w tekście głównym.
