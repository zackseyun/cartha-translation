id: MAT.18.9
reference: Matthew 18:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: pl
  text: A jeśli twoje oko prowadzi cię do upadku[a], wyłup je i odrzuć od siebie. Lepiej jest dla ciebie wejść do życia z jednym okiem, niż mając dwoje oczu, zostać wrzuconym do Gehenny ognia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pobudza cię do grzechu”. Grecki czasownik może oznaczać doprowadzenie kogoś do potknięcia, upadku lub grzechu.'
    reason: lexical_alternative
  - marker: b
    text: „Gehenna” oznacza miejsce ostatecznego sądu; tradycyjnie tłumaczy się ten termin jako „piekło”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: prowadzi cię do upadku
  rationale: Zachowuje obraz potknięcia i upadku obecny w czasowniku, a zarazem pozostawia otwarte jego kontekstowe odniesienie do grzechu.
- source_word: ἔξελε
  choice: wyłup
  rationale: Mocny tryb rozkazujący i drastyczny obraz najlepiej oddaje współczesne polskie „wyłup”, bez osłabiania wypowiedzi.
- source_word: βάλε ἀπὸ σοῦ
  choice: odrzuć od siebie
  rationale: Wyraża zdecydowane usunięcie i oddalenie; brzmi naturalnie i dostojnie po polsku.
- source_word: καλόν σοί ἐστιν
  choice: lepiej jest dla ciebie
  rationale: W konstrukcji porównawczej z ἤ przymiotnik καλόν ma sens tego, co korzystniejsze lub lepsze.
- source_word: μονόφθαλμον
  choice: z jednym okiem
  rationale: Naturalny polski odpowiednik przymiotnika „jednooki”, dobrze pasujący do konstrukcji „wejść do życia”.
- source_word: εἰς τὴν ζωὴν
  choice: do życia
  rationale: Nie dodaje niewystępującego w grece określenia „wiecznego”, zachowując eschatologiczną wymowę i niedookreślenie tekstu.
- source_word: βληθῆναι
  choice: zostać wrzuconym
  rationale: Wiernie oddaje bierny bezokolicznik i gwałtowność czasownika βάλλω.
- source_word: γέενναν
  choice: Gehenny
  rationale: Transliteracja zachowuje swoistość żydowskiego i eschatologicznego terminu γέεννα, zamiast utożsamiać go bezpośrednio z szerszym polskim pojęciem „piekła”.
- source_word: τοῦ πυρός
  choice: ognia
  rationale: Bezpośrednio zachowuje dopełniacz grecki w wyrażeniu „Gehenna ognia”, mimo że jest ono mniej idiomatyczne niż „ognista Gehenna”.
theological_decisions:
- issue: Oddanie γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: Grecki tekst używa konkretnego terminu γέεννα. Zachowanie go nie zaciera jego historycznych i eschatologicznych skojarzeń ani nie narzuca późniejszego, szerszego terminu teologicznego.
- issue: Oddanie εἰς τὴν ζωὴν
  choice: wejść do życia
  alternative: wejść do życia wiecznego
  rationale: Chociaż kontekst wskazuje na życie eschatologiczne, przymiotnika „wieczne” nie ma w tekście greckim, dlatego nie został dodany.
- issue: Charakter polecenia o wyłupieniu oka
  choice: zachowanie dosadnego obrazu bez objaśniającego złagodzenia
  alternative: parafraza wskazująca wprost na usunięcie przyczyny grzechu
  rationale: Przekład zachowuje radykalne brzmienie wypowiedzi i nie rozstrzyga w samym tekście sposobu jej zastosowania.
translation_notes:
  register: Współczesna, standardowa polszczyzna o podniosłym, lecz przystępnym rejestrze. Zachowano drastyczność obrazu, metaforę upadku oraz zwięzłe „życie” bez dopowiedzenia „wieczne”. Nietypowe, ale źródłowo bliskie wyrażenie „Gehenna ognia” zachowuje grecką konstrukcję dopełniaczową.
