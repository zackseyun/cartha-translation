  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: pl
  text: Gdy zaś zaczął się rozliczać, przyprowadzono do niego jednego dłużnika, który był winien dziesięć tysięcy talentów.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent był bardzo dużą jednostką wagi, używaną także jako jednostka wartości pieniężnej; „dziesięć tysięcy talentów” oznacza w realiach tej przypowieści niewyobrażalnie wielki dług.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: A gdy zaczął
  rationale: Konstrukcja dopełniaczowa określa okoliczność czasową głównej czynności. „Gdy zaczął” naturalnie oddaje jej sens, a spójnik „A” zachowuje narracyjną funkcję δέ.
- source_word: συναίρειν
  choice: rozliczać rachunki
  rationale: W kontekście finansowym czasownik oznacza dokonywanie rozrachunku. To współczesne i zrozumiałe sformułowanie zachowuje obraz księgowy przypowieści.
- source_word: προσηνέχθη
  choice: przyprowadzono
  rationale: Grecka strona bierna wskazuje, że inni przyprowadzili dłużnika. Polska forma bezosobowa brzmi naturalniej niż dosłowne „został przyprowadzony” i nie wskazuje wykonawców czynności.
- source_word: αὐτῷ
  choice: do niego
  rationale: Oddaje cel przyprowadzenia oraz grecki celownik przy προσφέρω, pozostając naturalne po polsku.
- source_word: εἷς ὀφειλέτης
  choice: jednego dłużnika
  rationale: Zachowano wyraźny w grece liczebnik εἷς, przedstawiający jeden konkretny przypadek spośród rozliczanych osób.
- source_word: μυρίων ταλάντων
  choice: dziesięć tysięcy talentów
  rationale: Μύριοι oznacza dosłownie dziesięć tysięcy, a talent jest historyczną jednostką masy i wartości. Zachowanie tej jednostki unika niepewnego przeliczenia na współczesną walutę.
