source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: pl
  text: 'A jeśli zdarzy mu się ją znaleźć[a], zaprawdę mówię wam: cieszy się z niej bardziej niż z dziewięćdziesięciu dziewięciu owiec, które się nie zabłąkały[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „jeśli się zdarzy, że ją znajdzie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „które nie zbłądziły”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Zachowuje prosty łącznik i naturalnie kontynuuje opowieść Jezusa.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: jeśli zdarzy mu się ją znaleźć
  rationale: Oddaje zarówno warunkowość, jak i obecny w konstrukcji sens zdarzenia się czegoś, nie spłaszczając jej do samego „jeśli ją znajdzie”.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: zaprawdę mówię wam
  rationale: Zachowuje uroczysty, emfatyczny charakter stałej formuły wypowiadanej przez Jezusa.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: cieszy się z niej
  rationale: To naturalny polski sposób wyrażenia radości z odnalezionej owcy; zachowuje wyraźny obiekt radości.
- source_word: μᾶλλον ἢ
  choice: bardziej niż
  rationale: Bezpośrednio zachowuje rzeczywiste porównanie, nie sugerując wykluczenia radości z pozostałych owiec.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: z dziewięćdziesięciu dziewięciu owiec
  rationale: Rzeczownik „owiec”, choć domyślny w grece z kontekstu, został dopowiedziany dla naturalności i jednoznaczności polskiego zdania.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: które się nie zabłąkały
  rationale: Oddaje rezultat opisany przez imiesłów perfectum oraz pozostaje naturalne w obrazie owiec, które nie zeszły z właściwej drogi.
theological_decisions:
- issue: Znaczenie porównania radości pasterza
  choice: Pasterz cieszy się z odnalezionej owcy bardziej niż z dziewięćdziesięciu dziewięciu, które się nie zabłąkały.
  alternative: Złagodzenie porównania, aby nie sugerowało większej radości z jednej owcy, albo odczytanie go jako stwierdzenia mniejszej wartości pozostałych.
  rationale: Greckie μᾶλλον ἢ wyraża porównanie, które należy zachować. Przekład nie rozstrzyga przy tym, że pozostałe owce są mniej wartościowe ani że pasterz się o nie nie troszczy.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Tradycyjne „zaprawdę mówię wam” zachowuje uroczystą siłę formuły ἀμὴν λέγω ὑμῖν; pozostała składnia jest naturalna dla dzisiejszej polszczyzny.
