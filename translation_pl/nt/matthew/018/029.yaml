source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: pl
  text: 'Wtedy jego współniewolnik upadł przed nim i błagał go: „Bądź cierpliwy wobec mnie, a oddam ci”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: upadł przed nim
  rationale: Imiesłów opisuje fizyczny gest uniżenia i błagania; dodanie „przed nim” naturalnie wyraża w polszczyźnie relację między postaciami, nie zmieniając sensu.
- source_word: οὖν
  choice: Wtedy
  rationale: W tym miejscu spójnik prowadzi narrację dalej i wskazuje następstwo wydarzeń; „wtedy” brzmi naturalniej niż bardziej wnioskowe „dlatego”.
- source_word: σύνδουλος
  choice: współniewolnik
  rationale: Termin oznacza człowieka będącego niewolnikiem tego samego pana. „Współniewolnik” zachowuje związek z δοῦλος oraz istotną w przypowieści zależność od pana.
- source_word: παρεκάλει
  choice: błagał
  rationale: Kontekst długu i gest padnięcia wskazują na usilną prośbę; aspekt niedokonany greckiego czasownika oddaje polski czasownik niedokonany.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Bądź cierpliwy wobec mnie
  rationale: Zwrot jest prośbą o cierpliwą zwłokę i wyrozumiałość; ta forma jest współczesna, naturalna i zachowuje osobowe odniesienie przyimka.
- source_word: ἀποδώσω
  choice: oddam
  rationale: W kontekście długu czasownik oznacza zwrot należności. Polskie „oddam” jest zwięzłe i idiomatyczne.
theological_decisions:
- issue: Oddanie słownictwa δοῦλος w wyrazie σύνδουλος
  choice: współniewolnik
  alternative: współsługa
  rationale: „Współniewolnik” dokładniej zachowuje status osoby podlegającej temu samemu panu, ważny dla struktury tej przypowieści. Nie łagodzi społecznej rzeczywistości obecnej w greckim określeniu.
- issue: Zakres obietnicy spłaty
  choice: oddam ci wszystko
  alternative: oddam ci
  rationale: SBLGNT w tym wersecie ma καὶ ἀποδώσω σοι bez wyraźnego πᾶν („wszystko”). Dlatego ściśle źródłowe brzmienie powinno być „a oddam ci”; „wszystko” nie powinno zostać dodane do tekstu głównego.
translation_notes:
  register: 'Współczesna, godna polszczyzna narracyjna. Tekst zachowuje mocne społecznie określenie „współniewolnik” i prostą, desperacką prośbę dłużnika. Korekta publikacyjna: ze względu na brak πᾶν w podanym SBLGNT ostateczny tekst główny powinien brzmieć: „Wtedy jego współniewolnik upadł przed nim i błagał go: «Bądź cierpliwy wobec mnie, a oddam ci»”.'
