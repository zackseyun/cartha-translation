id: MAT.18.10
reference: Matthew 18:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: pl
  text: Uważajcie, żebyście nie pogardzili[a] ani jednym z tych małych. Mówię wam bowiem, że ich aniołowie[b] w niebie[c] nieustannie widzą oblicze mojego Ojca, który jest w niebie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie lekceważyli” ani „nie patrzyli z góry na” żadnego z tych małych.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „ich aniołowie” może oznaczać aniołów związanych z tymi małymi lub ich reprezentujących; sam ten werset nie rozstrzyga pełnej nauki o aniołach stróżach.
    reason: alternative_reading
  - marker: c
    text: W obu miejscach tekst grecki ma dosłownie „w niebiosach”; przełożono idiomatycznie jako „w niebie”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Uważajcie
  rationale: Tryb rozkazujący wprowadza ostrzeżenie i wezwanie do czujności; „Uważajcie” oddaje tę funkcję naturalnie we współczesnej polszczyźnie.
- source_word: μὴ καταφρονήσητε
  choice: żebyście nie pogardzili
  rationale: Konstrukcja z μή po Ὁρᾶτε wyraża zakaz. „Pogardzić” zachowuje moc καταφρονέω, obejmującego pogardę i lekceważenie kogoś jako nieważnego.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ani jednym z tych małych
  rationale: Sformułowanie zachowuje jednostkowy nacisk ἑνός („ani jednym”) oraz nie zawęża μικρῶν wyłącznie do dzieci; w kontekście może chodzić także o ludzi małych lub pokornych pod względem pozycji.
- source_word: λέγω γὰρ ὑμῖν
  choice: Mówię wam bowiem
  rationale: Bezpośrednio oddaje formułę wypowiedzi oraz wyjaśniające znaczenie γάρ.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: ich aniołowie
  rationale: Zachowuje prostą relację dzierżawczą tekstu greckiego bez rozstrzygania, na czym dokładnie polega związek tych aniołów z „małymi”.
- source_word: ἐν οὐρανοῖς
  choice: w niebie
  rationale: Grecka liczba mnoga ma tu idiomatyczne znaczenie lokatywne; polskie „w niebie” jest naturalnym odpowiednikiem.
- source_word: διὰ παντὸς
  choice: nieustannie
  rationale: Idiom oznacza stałość lub ciągłość; „nieustannie” dobrze współgra z czasem teraźniejszym βλέπουσι.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: widzą oblicze
  rationale: Zachowuje obraz bezpośredniego dostępu do Boga. „Oblicze” nadaje wypowiedzi godny, biblijny rejestr, pozostając zrozumiałe.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: mojego Ojca, który jest w niebie
  rationale: Zachowuje osobiste określenie „mojego Ojca” oraz następującą po nim frazę atrybutywną bez dodawania interpretacji.
theological_decisions:
- issue: Znaczenie wyrażenia „ich aniołowie”
  choice: Pozostawiono dosłowne „ich aniołowie”, bez określania formalnej nauki o indywidualnych aniołach stróżach.
  alternative: Można rozumieć to jako osobistych aniołów stróżów każdego dziecka lub wierzącego albo szerzej jako aniołów związanych z tymi małymi, reprezentujących ich bądź pełniących wobec nich posługę.
  rationale: Tekst stwierdza istnienie relacji wyrażonej zaimkiem „ich”, lecz nie objaśnia jej dokładnego charakteru. Dosłowne brzmienie zachowuje tę otwartość i nie narzuca doktrynalnego rozstrzygnięcia.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. „Uważajcie” brzmi naturalnie jako ostrzeżenie, a „oblicze” zachowuje podniosłość obrazu bez archaizowania całego zdania. Składnia „ani jednym z tych małych” uwydatnia troskę o każdą pojedynczą osobę i zachowuje szerszy zakres referencyjny greckiego μικρῶν.
