id: MAT.18.15
reference: Matthew 18:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: pl
  text: Jeśli zaś twój brat[b] zgrzeszy przeciwko tobie[a], idź i upomnij go[c] w cztery oczy. Jeśli cię posłucha, pozyskałeś swego brata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy pomijają słowa „przeciwko tobie” i mają: „Jeśli zaś twój brat zgrzeszy, idź…”'
    reason: textual_variant
  - marker: b
    text: Greckie słowo „brat” ma tu formę rodzaju męskiego w liczbie pojedynczej; w tym kontekście może szerzej oznaczać innego ucznia Jezusa.
    reason: lexical_alternative
  - marker: c
    text: 'Można też oddać: „wykaż mu jego winę”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: zgrzeszy
  rationale: Aoryst trybu łączącego po ἐάν tworzy warunek ogólny. „Zgrzeszy” zachowuje moralny i religijny sens czasownika ἁμαρτάνω.
- source_word: εἰς σέ
  choice: przeciwko tobie
  rationale: Wyrażenie określa grzech jako skierowany przeciw adresatowi. Ponieważ jego obecność jest wariantem tekstowym, krótszą lekcję podano w przypisie.
- source_word: ἀδελφός σου
  choice: twój brat
  rationale: Przekład zachowuje gramatycznie męską liczbę pojedynczą; kontekst może obejmować szerzej współucznia Jezusa, co zaznaczono w przypisie.
- source_word: ὕπαγε
  choice: idź
  rationale: Zwięzły i naturalny odpowiednik imperatywu rozpoczynającego zalecane działanie.
- source_word: ἔλεγξον
  choice: upomnij go
  rationale: Czasownik oznacza ujawnienie lub wykazanie komuś winy. „Upomnij go” jest naturalne we współczesnej polszczyźnie i nie narzuca nadmiernie ostrego tonu; dosłowniejszą możliwość podano w przypisie.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: w cztery oczy
  rationale: 'Naturalny polski idiom oddaje prywatność i wyłączność rozmowy: tylko między dwiema osobami.'
- source_word: ἀκούσῃ
  choice: cię posłucha
  rationale: Oddaje słuchanie prowadzące do przyjęcia napomnienia, nie zawężając znaczenia do samego fizycznego usłyszenia ani nie wzmacniając go do bezwzględnego posłuszeństwa.
- source_word: ἐκέρδησας
  choice: pozyskałeś
  rationale: Zachowuje metaforę zyskania lub zdobycia osoby, bez dodawania nieobecnego wprost sensu „odzyskałeś”.
theological_decisions:
- issue: Zakres znaczeniowy ἀδελφός
  choice: twój brat
  alternative: brat lub siostra; współwyznawca; współuczeń
  rationale: Tekst główny zachowuje męską liczbę pojedynczą źródła, natomiast przypis informuje o możliwym szerszym odniesieniu w kontekście wspólnoty uczniów.
- issue: Status tekstualny εἰς σέ
  choice: włączenie „przeciwko tobie” do tekstu głównego
  alternative: 'pominięcie tego wyrażenia: „Jeśli zaś twój brat zgrzeszy”'
  rationale: SBLGNT zawiera εἰς σέ. Wariant krótszy ma znaczenie dla zakresu polecenia, dlatego został jawnie zachowany w przypisie.
- issue: Charakter reakcji opisanej przez ἀκούσῃ
  choice: „cię posłucha”
  alternative: „usłucha cię”; „wysłucha cię”
  rationale: Sformułowanie zachowuje możliwość responsywnego przyjęcia napomnienia, nie rozstrzygając dokładnie, jaki stopień skruchy lub posłuszeństwa jest zakładany.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Idiom „w cztery oczy” naturalnie oddaje grecki nacisk na rozmowę tylko między dwiema osobami. Zachowano zwięzłość i metaforę „pozyskania” brata.
