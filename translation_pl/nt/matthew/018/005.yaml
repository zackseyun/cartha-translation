  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: pl
  text: A kto przyjmuje jedno takie dziecko w moje imię, mnie przyjmuje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wita”. Grecki czasownik może znaczyć „przyjmować”, „witać” lub „akceptować”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: kto
  rationale: Połączenie zaimka względnego z ἐάν wyraża ogólny, nieokreślony warunek; polskie „kto” naturalnie oddaje sens „ktokolwiek” bez zbędnego obciążenia stylistycznego.
- source_word: δέξηται / δέχεται
  choice: przyjmuje / przyjmuje
  rationale: „Przyjmuje” mieści znaczenia przyjęcia, zaakceptowania i ugoszczenia, a zarazem zachowuje istotne powtórzenie tego samego greckiego czasownika w obu częściach zdania.
- source_word: ἓν παιδίον τοιοῦτο
  choice: jedno takie dziecko
  rationale: Przekład zachowuje liczebnik ἕν i wskazujące τοιοῦτο. Nie dodaje przymiotnika „małe”, którego w tym wersecie nie ma.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: w moje imię
  rationale: To utrwalone i naturalne polskie sformułowanie zachowuje odniesienie do imienia, autorytetu lub więzi z Jezusem, nie rozstrzygając ponad tekst, który odcień dominuje.
- source_word: ἐμὲ
  choice: mnie
  rationale: Zaimek umieszczono przed powtórzonym orzeczeniem, co w polszczyźnie naturalnie podkreśla utożsamienie przyjęcia dziecka z przyjęciem Jezusa.
theological_decisions:
- issue: Reprezentacyjne utożsamienie dziecka z Jezusem
  choice: Przyjęcie takiego dziecka w imię Jezusa jest przedstawione jako przyjęcie samego Jezusa.
  alternative: 'Złagodzenie wypowiedzi do znaczenia: przyjmując dziecko, okazuje się jedynie szacunek Jezusowi.'
  rationale: Powtórzenie δέχομαι i bezpośrednia zmiana dopełnienia z dziecka na Jezusa tworzą mocne utożsamienie reprezentacyjne. Przekład zachowuje je bez dodawania niewyrażonych w tekście konsekwencji doktrynalnych.
translation_notes:
  register: Współczesna, godna i prosta polszczyzna. Zachowano zwięzłość oraz powtórzenie czasownika z greckiego oryginału. Marker przypisu umieszczono po całym zdaniu, a przypis sygnalizuje zakres znaczeniowy czasownika bez niepotrzebnego powtarzania informacji już jawnej w tekście głównym.
