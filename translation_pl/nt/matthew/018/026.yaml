  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: pl
  text: 'Wtedy niewolnik padł przed nim i oddawał mu pokłon[a], mówiąc: „Okaż mi cierpliwość, a oddam ci wszystko”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki czasownik może w innych kontekstach znaczyć także „oddawać cześć”; tutaj opisuje jednak pełen uniżenia hołd wobec ludzkiego pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν οὖν
  choice: Wtedy ... upadł ... na twarz
  rationale: Imiesłów aorystu opisuje poprzedzający mowę akt uniżenia, a οὖν wiąże reakcję niewolnika z wcześniejszą decyzją pana. „Wtedy” naturalnie oddaje tok narracji, zaś „upadł na twarz” jasno ukazuje pokorną postawę.
- source_word: ὁ δοῦλος
  choice: niewolnik
  rationale: δοῦλος oznacza osobę pozostającą w niewoli i całkowicie zależną od pana. W kontekście sprzedaży jego samego i rodziny określenie „niewolnik” zachowuje realia społeczne przypowieści.
- source_word: προσεκύνει αὐτῷ
  choice: błagał go
  rationale: Czas niedokonany wskazuje na trwającą czynność, a kontekst przedstawia pełne czci uniżenie przed ludzkim panem. Postawę ciała oddaje już „upadł przed nim na twarz”, natomiast „błagał” naturalnie przekazuje funkcję tego gestu i następującej wypowiedzi.
- source_word: λέγων
  choice: — wprowadzenie mowy bez osobnego odpowiednika
  rationale: Polszczyzna naturalnie wprowadza bezpośrednią prośbę po czasowniku „błagał”; dosłowne dodanie „mówiąc” byłoby zbędne.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Okaż mi cierpliwość
  rationale: Imperatyw prosi o cierpliwe powstrzymanie działania wobec dłużnika. To naturalne i godne współczesne sformułowanie, które nie dopowiada konkretnie odroczenia długu.
- source_word: καὶ πάντα ἀποδώσω σοι
  choice: a oddam ci wszystko
  rationale: ἀποδίδωμι w kontekście długu oznacza oddanie należności. „Oddam ci wszystko” jest idiomatyczne i zachowuje całościowy sens πάντα.
theological_decisions:
- issue: Znaczenie προσκυνέω wobec ludzkiego pana
  choice: Gest uniżenia i usilnej prośby, nie jednoznacznie kult religijny
  alternative: „oddał mu pokłon” albo „uwielbił go”
  rationale: W świecie przedstawionym przypowieści adresatem jest ludzki pan. Czasownik może oznaczać padnięcie na twarz w geście czci lub hołdu; przełożenie go jako „uwielbił” narzucałoby religijne znaczenie, którego kontekst nie wymaga. Przypis zachowuje zakres znaczeniowy greckiego słowa.
translation_notes:
  register: Współczesna, dignifikowana polszczyzna narracyjna. „Niewolnik” zachowuje historyczny ciężar δοῦλος, a „upadł na twarz” jest jasne dla zwykłego czytelnika. Konstrukcja unika zarówno archaizmu, jak i nadmiernie potocznego tonu.
