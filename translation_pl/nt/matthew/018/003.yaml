  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: pl
  text: 'I powiedział: „Zaprawdę mówię wam: jeśli nie zawrócicie[a] i nie staniecie się jak dzieci, na pewno nie wejdziecie do królestwa niebios”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jeśli nie zostaniecie zwróceni” albo „jeśli się nie nawrócicie”. Grecka forma może mieć sens bierny lub nieprzechodni.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμὴν
  choice: Zaprawdę
  rationale: Wprowadza uroczystą, autorytatywną wypowiedź. „Zaprawdę” jest zrozumiałe we współczesnej polszczyźnie i zachowuje podniosły rejestr formuły Jezusa.
- source_word: στραφῆτε
  choice: zawrócicie
  rationale: Forma może być rozumiana biernie lub nieprzechodnio. „Zawrócicie” wyraża stanowczą zmianę kierunku, nie narzucając późniejszego technicznego znaczenia słowa „nawrócenie”.
- source_word: γένησθε
  choice: staniecie się
  rationale: Oddaje zmianę stanu wyrażoną przez γίνομαι i zachowuje odrębność drugiego z dwóch skoordynowanych czasowników.
- source_word: ὡς τὰ παιδία
  choice: jak dzieci
  rationale: W języku polskim rzeczownik w liczbie mnogiej bez rodzajnika naturalnie wyraża tę klasę osób. Przekład nie dopowiada, jakie cechy dzieci są podstawą porównania.
- source_word: οὐ μὴ εἰσέλθητε
  choice: na pewno nie wejdziecie
  rationale: Konstrukcja οὐ μή z aorystem trybu łączącego stanowi emfatyczne zaprzeczenie. „Na pewno nie” jasno i naturalnie zachowuje jego stanowczą siłę.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: królestwa niebios
  rationale: Zachowuje charakterystyczne dla Mateusza dopełniaczowe wyrażenie „królestwo niebios” i nie redukuje go do mniej dosłownej formy przymiotnikowej.
theological_decisions:
- issue: Znaczenie στραφῆτε jako wezwania do przemiany
  choice: zawrócicie
  alternative: nawrócicie się; zostaniecie zwróceni
  rationale: Greka mówi o zasadniczej zmianie kierunku, lecz nie wymaga technicznego terminu teologicznego ani jednoznacznego rozstrzygnięcia sprawczości. Tekst główny pozostaje naturalny, a przypis zachowuje możliwość odczytania biernego.
- issue: Podstawa porównania z dziećmi
  choice: jak dzieci
  alternative: jak małe dzieci; tak niewinni lub pokorni jak dzieci
  rationale: Werset nie określa wprost, która cecha dzieci jest przedmiotem porównania. Przekład zachowuje tę otwartość i nie wprowadza interpretacji do tekstu głównego.
- issue: Siła zaprzeczenia dotyczącego wejścia do królestwa
  choice: na pewno nie wejdziecie
  alternative: nigdy nie wejdziecie
  rationale: Emfatyczne οὐ μή wymaga mocnego zaprzeczenia, ale samo nie musi oznaczać czasowego „nigdy”. Wybrana forma zachowuje nacisk bez nadmiernego doprecyzowania.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano uroczystą formułę „Zaprawdę mówię wam” oraz charakterystyczne dla Mateusza wyrażenie „królestwo niebios”. Uniknięto zarówno archaicznego szyku, jak i terminologii narzucającej określony system teologiczny.
