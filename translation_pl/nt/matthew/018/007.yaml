id: MAT.18.7
reference: Matthew 18:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: pl
  text: Biada światu z powodu zgorszeń[a]! Zgorszenia bowiem muszą przyjść, lecz biada człowiekowi[b], przez którego przychodzi zgorszenie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „przeszkód”, „powodów do upadku” albo „pułapek”. Greckie słowo σκάνδαλον oznacza coś, co doprowadza człowieka do potknięcia lub upadku — przez pokusę, przeszkodę albo sposobność do grzechu.'
    reason: lexical_alternative
  - marker: b
    text: Grecki rzeczownik ma tutaj rodzaj męski i liczbę pojedynczą, lecz reprezentuje każdego człowieka, przez którego przychodzi takie zgorszenie.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Biada
  rationale: Zachowuje prorocki i sądowniczy ton ostrzeżenia oraz powtórzenie obecne w obu częściach wersetu.
- source_word: κόσμῳ
  choice: światu
  rationale: Oddaje szerokie odniesienie do świata ludzi dotkniętego złem, bez zawężania go do fizycznego stworzenia ani do określonego systemu społecznego.
- source_word: ἀπὸ
  choice: z powodu
  rationale: W tym kontekście przyimek wskazuje na przyczynę biady; polskie wyrażenie jasno i naturalnie oddaje tę relację.
- source_word: σκάνδαλα / σκάνδαλον
  choice: zgorszenia / zgorszenie
  rationale: „Zgorszenie” jest utrwalonym, zwięzłym polskim odpowiednikiem, obejmującym przeszkodę, pokusę lub okoliczność prowadzącą do upadku. Przypis objaśnia szerszy zakres greckiego obrazu. Zachowano różnicę między liczbą mnogą a pojedynczą.
- source_word: ἀνάγκη
  choice: muszą
  rationale: Wyraża konieczność lub nieuchronność, ale nie rozstrzyga, z czego ona wynika.
- source_word: γάρ
  choice: bowiem
  rationale: Naturalnie wprowadza uzasadnienie poprzedniego stwierdzenia i odpowiada podniosłemu, lecz współczesnemu rejestrowi.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: przyjść ... przychodzi
  rationale: Zachowuje powtórzenie tego samego czasownika i mniej abstrakcyjny obraz tekstu greckiego.
- source_word: πλήν
  choice: lecz
  rationale: Wyraźnie zaznacza przeciwstawienie między nieuchronnością zgorszeń a odpowiedzialnością osoby, przez którą przychodzą.
- source_word: ἀνθρώπῳ
  choice: człowiekowi
  rationale: Zachowuje męską liczbę pojedynczą tekstu źródłowego, a przypis wyjaśnia jej reprezentatywny zakres.
- source_word: δι’ οὗ
  choice: przez którego
  rationale: Naturalnie oddaje osobowego pośrednika, przez którego pojawia się zgorszenie.
theological_decisions:
- issue: Charakter konieczności wyrażonej przez ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: „Zgorszenia bowiem muszą przyjść” — stwierdzenie konieczności bez wskazania jej podstawy.
  alternative: „Zgorszenia na pewno się pojawią” albo sformułowanie sugerujące bezpośredni Boży dekret.
  rationale: Greka stwierdza konieczność lub nieuchronność, lecz nie wyjaśnia, czy ma ona charakter opatrznościowy, logiczny czy sytuacyjny. Przekład zachowuje to napięcie.
- issue: Reprezentatywny zakres ἀνθρώπῳ
  choice: W tekście głównym „człowiekowi”, z objaśnieniem w przypisie.
  alternative: „osobie” lub „każdemu, przez kogo”.
  rationale: Forma grecka jest rodzaju męskiego i liczby pojedynczej, choć ostrzeżenie odnosi się reprezentatywnie do każdego człowieka będącego sprawcą zgorszenia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Utrzymano retoryczne powtórzenie „Biada” oraz „przyjść/przychodzi”. Termin „zgorszenie” zachowuje tradycyjne zakorzenienie biblijne, a jego szersze od dzisiejszego potocznego znaczenie wyjaśnia przypis.
