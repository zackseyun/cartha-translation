id: MAT.18.34
reference: Matthew 18:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: pl
  text: A jego pan, rozgniewany, wydał go oprawcom, dopóki nie odda wszystkiego, co był winien.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Pan”. Greckie kýrios może mieć oba znaczenia; tutaj w obrębie przypowieści oznacza pana sługi.'
    reason: alternative_reading
  - marker: b
    text: 'Lub: „tym, którzy zadają męki”; słabiej: „dozorcom więziennym”. Greckie słowo oznacza osoby zadające cierpienie, nie tylko zwykłych strażników.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: rozgniewany
  rationale: Imiesłów aorystu ma tu funkcję okolicznikową i opisuje stan pana towarzyszący jego decyzji. Polski imiesłów zachowuje zwięzłość i naturalny tok zdania.
- source_word: κύριος
  choice: pan
  rationale: W obrębie przypowieści słowo oznacza zwierzchnika sługi. „Pan” jest naturalnym polskim określeniem tej relacji, a mała litera nie narzuca bezpośredniego utożsamienia tej postaci z Bogiem lub Chrystusem.
- source_word: παρέδωκεν
  choice: wydał
  rationale: Czasownik oznacza przekazanie kogoś pod władzę innych; „wydał” zachowuje sądowo-karny charakter czynności.
- source_word: βασανισταῖς
  choice: oprawcom
  rationale: Termin określa ludzi zadających mękę lub tortury, a nie jedynie zwykłych strażników więziennych. „Oprawcy” brzmi naturalnie i zachowuje surowość obrazu.
- source_word: ἕως οὗ
  choice: dopóki nie
  rationale: To naturalny polski odpowiednik konstrukcji wyznaczającej przewidywany kres trwania kary.
- source_word: ἀποδῷ
  choice: odda
  rationale: W tym kontekście czasownik oznacza zwrot należności. Forma po „dopóki nie” naturalnie oddaje prospektywny sens greckiego trybu łączącego.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: wszystkiego, co był winien
  rationale: Sformułowanie zachowuje ogólność greckiego wyrażenia i nie wprowadza rzeczownika „dług”, którego w tej frazie źródłowej nie ma.
theological_decisions:
- issue: Czy κύριος oddać doktrynalnym tytułem „Pan”
  choice: pan
  alternative: Pan
  rationale: W bezpośredniej warstwie narracyjnej chodzi o pana sługi. Pisownia małą literą zachowuje sens przypowieści i nie rozstrzyga ponad tekstem sposobu odniesienia jej postaci do Boga.
- issue: Siła znaczeniowa βασανισταῖς w kontekście kary
  choice: oprawcom
  alternative: dozorcom więziennym; tym, którzy zadają męki
  rationale: „Oprawcom” zachowuje element zadawania cierpienia obecny w greckim terminie, nie łagodząc go do samego dozoru więziennego ani nie rozstrzygając szerszej doktryny sądu.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Szyk „A jego pan, rozgniewany” zachowuje nacisk na gniew pana bez sztucznego rozwijania związku przyczynowego. Przypisy sygnalizują wieloznaczność κύριος oraz zakres βασανισταῖς.
