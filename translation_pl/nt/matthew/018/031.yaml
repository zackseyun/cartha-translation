  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: pl
  text: Gdy więc jego współniewolnicy[a] zobaczyli, co się stało, bardzo się zasmucili. Potem przyszli i szczegółowo opowiedzieli swemu panu[b] wszystko, co się wydarzyło.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „współsłudzy”. Greckie σύνδουλοι dosłownie określa osoby będące niewolnikami lub sługami tego samego pana.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe także: „właścicielowi” lub „zwierzchnikowi”. Greckie κύριος może oznaczać pana, właściciela albo zwierzchnika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: więc
  rationale: Naturalnie zaznacza wynikowy, a zarazem narracyjny związek z poprzednim wydarzeniem.
- source_word: σύνδουλοι
  choice: współniewolnicy
  rationale: Oddaje wspólny status niewolników podlegających temu samemu panu; ten status ma znaczenie dla logiki przypowieści.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: co się stało / wszystko, co się wydarzyło
  rationale: Idiomy polskie oddają urzeczownikowione imiesłowy, a „wszystko” zachowuje wzmocnienie wniesione przez πάντα.
- source_word: ἐλυπήθησαν σφόδρα
  choice: bardzo się zasmucili
  rationale: Zachowuje znaczenie silnego smutku i poruszenia bez dopowiadania gniewu.
- source_word: ἐλθόντες
  choice: potem przyszli
  rationale: Oddaje wcześniejszą wobec głównego czasownika czynność imiesłowu aorystu w naturalnej polskiej sekwencji narracyjnej.
- source_word: διεσάφησαν
  choice: szczegółowo opowiedzieli
  rationale: Czasownik wskazuje na dokładne przedstawienie lub wyjaśnienie sprawy, a nie jedynie krótkie zawiadomienie.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: swemu panu
  rationale: „Pan” jest naturalnym określeniem ludzkiego zwierzchnika w tej przypowieści i zachowuje podstawowy sens κύριος.
theological_decisions:
- issue: Oddanie wyrazu z rodziny δοῦλος w realiach przypowieści
  choice: współniewolnicy
  alternative: współsłudzy
  rationale: Złożenie σύνδουλοι nazywa osoby dzielące status niewolników. „Współniewolnicy” nie łagodzi zależności od pana, istotnej w przypowieści.
- issue: Oddanie κύριος w odniesieniu do ludzkiego zwierzchnika
  choice: pan
  alternative: właściciel / zwierzchnik
  rationale: Mała litera jasno wskazuje na postać ludzką, a „pan” zachowuje szerokość znaczeniową greckiego słowa bez narzucania odniesienia boskiego.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Rzadziej spotykane „współniewolnicy” zachowano ze względu na precyzję tekstu źródłowego i objaśniono w przypisie. Markery przypisów umieszczono przy słowach, których dotyczą.
