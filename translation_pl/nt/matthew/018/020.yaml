source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: pl
  text: Bo gdzie dwaj lub trzej są zgromadzeni w moje imię, tam jestem pośród nich[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „między nimi”.'
    reason: Alternatywny, równie możliwy idiomatyczny przekład ἐν μέσῳ αὐτῶν.
lexical_decisions:
- source_word: οὗ
  choice: gdzie
  rationale: Wprowadza zdanie miejscowe i naturalnie współgra z późniejszym „tam”; „gdziekolwiek” byłoby nieco szersze niż wymaga tego greka.
- source_word: γάρ
  choice: bo
  rationale: Zachowuje objaśniające powiązanie tej wypowiedzi z poprzednim kontekstem.
- source_word: δύο ἢ τρεῖς
  choice: dwaj lub trzej
  rationale: Prosty odpowiednik liczebników odnoszących się tu do osób; forma męskoosobowa jest zgodna z polską składnią.
- source_word: συνηγμένοι
  choice: są zgromadzeni
  rationale: Imiesłów perfectum strony biernej opisuje wynikły stan zebrania; przekład zachowuje stronę bierną i aspekt rezultatywny bez dodawania sprawcy.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: w moje imię
  rationale: To naturalny polski odpowiednik zwrotu oznaczającego zgromadzenie ze względu na imię Jezusa, pod jego autorytetem lub w związku z nim; dosłowne „do mojego imienia” byłoby nienaturalne.
- source_word: ἐκεῖ
  choice: tam
  rationale: Zachowuje grecką korelację „gdzie… tam”.
- source_word: εἰμι
  choice: jestem
  rationale: Oddaje prosty czas teraźniejszy bez interpretacyjnego dopowiedzenia „jestem obecny”.
- source_word: ἐν μέσῳ αὐτῶν
  choice: pośród nich
  rationale: Zachowuje obraz znajdowania się w środku grupy, a zarazem brzmi naturalnie i godnie po polsku.
theological_decisions:
- issue: Chrystologiczny sens obecności Jezusa wśród zgromadzonych uczniów
  choice: Bezpośrednie „tam jestem pośród nich”
  alternative: „tam jestem obecny między nimi” albo interpretacja sakramentalna czy eklezjologiczna właściwa określonej tradycji
  rationale: Werset stwierdza obecność Jezusa, lecz nie określa jej metafizycznego sposobu. Przekład zachowuje to twierdzenie bez narzucania późniejszych ujęć doktrynalnych.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. Szyk „dwaj lub trzej są zgromadzeni” świadomie zachowuje bierną konstrukcję grecką, mimo że potoczne „gromadzą się” byłoby swobodniejsze. Znacznik przypisu umieszczono przy wyrażeniu, którego wariant dotyczy.
