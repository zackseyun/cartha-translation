id: MAT.18.4
reference: Matthew 18:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: pl
  text: Kto więc uniży się jak to dziecko, ten jest największy w królestwie niebios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: kto
  rationale: 'Naturalny polski odpowiednik zaimka względnego o znaczeniu uogólniającym: „ktokolwiek, kto”.'
- source_word: οὖν
  choice: więc
  rationale: Zachowuje wynikowy związek wypowiedzi z poprzedzającym pouczeniem Jezusa.
- source_word: ταπεινώσει ἑαυτόν
  choice: uniży się
  rationale: Oddaje czynność skierowaną ku sobie bez niezręcznego „uniży samego siebie”; forma dokonana odpowiada greckiemu aorystowi.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: jak to dziecko
  rationale: Proste i bezpośrednie odwzorowanie porównania oraz wskazania na obecne dziecko.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: ten jest największy
  rationale: Zaimek „ten” zachowuje emfatyczne podjęcie podmiotu; stopień wyższy z rodzajnikiem ma tutaj sens najwyższej pozycji w obrębie wskazanej grupy.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: w królestwie niebios
  rationale: Tradycyjne, a zarazem zrozumiałe polskie oddanie Mateuszowego wyrażenia „królestwo niebios”.
theological_decisions:
- issue: Znaczenie uniżenia się „jak dziecko”
  choice: Pozostawiono samo porównanie bez dopowiadania, na czym polega dziecięca postawa.
  alternative: Rozwinąć jako pokorę, zależność, prostotę albo niski status.
  rationale: Werset nie precyzuje jednego aspektu porównania; jego objaśnienie w tekście zawęziłoby zamierzoną treść.
- issue: ὁ μείζων jako określenie rangi
  choice: „największy”
  alternative: „większy” albo „wielki”
  rationale: Rodzajnik i kontekst pytania o największego w królestwie uzasadniają polski stopień najwyższy, bez rozstrzygania natury tej wielkości.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja korelacyjna „Kto…, ten…” naturalnie zachowuje greckie emfatyczne οὗτος bez sztucznego powtórzenia zaimka osobowego.
