  source_fidelity: 'Tekst wiernie oddaje grecki sens: οὖν („więc”), uogólniające ὅστις („kto”), zwrotną czynność ταπεινώσει ἑαυτόν („uniży się”), porównanie z konkretnie wskazanym dzieckiem oraz emfatyczną konstrukcję „ten jest”. „Największy” poprawnie wyraża ὁ μείζων w kontekście pytania z Mt 18,1 i nie dodaje interpretacji.'
  naturalness: Polszczyzna jest współczesna, płynna i godna. Konstrukcja „Kto więc…, ten…” jest naturalna oraz dobrze odtwarza greckie podjęcie zaimkowe. „Królestwo niebios” pozostaje zrozumiałe i ma właściwy dla Mateusza rejestr.
  terminology: „Uniży się”, „największy” i „królestwo niebios” są trafne terminologicznie. Przekład nie zawęża otwartego w tekście znaczenia porównania „jak to dziecko” ani nie wprowadza obciążenia doktrynalnego.
