id: MAT.18.17
reference: Matthew 18:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: pl
  text: Jeśli zaś nie zechce ich posłuchać, przedstaw to zgromadzeniu[a]. A jeśli nie zechce posłuchać także zgromadzenia, niech będzie dla ciebie jak poganin i poborca podatków.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Kościołowi” albo „wspólnocie” (gr. ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: nie zechce posłuchać
  rationale: W kontekście kolejnych prób napomnienia czasownik oznacza nie tylko brak usłyszenia, lecz odmowę przyjęcia tego, co mówią inni. To sformułowanie zachowuje odcień świadomej niechęci bez wzmacniania go do „nie okaże posłuszeństwa”.
- source_word: εἰπὸν
  choice: powiedz o tym
  rationale: 'Tryb rozkazujący wprowadza kolejny krok: przedstawienie sprawy wspólnocie. „O tym” naturalnie oddaje domyślny przedmiot wynikający z kontekstu.'
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: zgromadzeniu / zgromadzenia
  rationale: „Zgromadzenie” oddaje podstawowy sens ἐκκλησία jako zebranej wspólnoty i nie narzuca późniejszych skojarzeń instytucjonalnych. Tradycyjne „Kościół” pozostaje możliwe i zostało wskazane w przypisie.
- source_word: ἔστω σοι
  choice: niech będzie dla ciebie
  rationale: Sformułowanie zachowuje tryb rozkazujący oraz celownik σοι, a zarazem brzmi naturalnie po polsku i nie rozszerza tekstu do szczegółowej procedury.
- source_word: ὥσπερ
  choice: jak
  rationale: Prosty i naturalny odpowiednik zachowujący porównanie.
- source_word: ὁ ἐθνικός
  choice: poganin
  rationale: W żydowskim kontekście termin oznacza człowieka spoza ludu przymierza. „Poganin” jest utrwalonym, zrozumiałym polskim odpowiednikiem; rodzajnik wskazujący kategorię nie wymaga osobnego oddania.
- source_word: ὁ τελώνης
  choice: poborca podatków
  rationale: To precyzyjny i współczesny polski odpowiednik nazwy osoby pobierającej podatki lub opłaty. Konstrukcja przedstawia reprezentatywną kategorię.
theological_decisions:
- issue: Oddanie ἐκκλησία w przedpaschalnym kontekście napomnienia wspólnotowego
  choice: zgromadzenie
  alternative: Kościół; wspólnota
  rationale: „Zgromadzenie” zachowuje podstawowy sens greckiego słowa i nie przesądza o późniejszej formie instytucjonalnej. Ponieważ tradycyjne „Kościół” jest kontekstowo możliwe, podano je w przypisie.
- issue: Wymowa uznania osoby nieprzyjmującej napomnienia za kogoś z zewnątrz
  choice: niech będzie dla ciebie jak poganin i poborca podatków
  alternative: traktuj go jak poganina i poborcę podatków; uznaj go za osobę spoza wspólnoty
  rationale: Zachowano porównanie i osobisty zwrot σοι. Nie rozwinięto go w techniczną formułę wykluczenia ani nie rozstrzygnięto wszystkich praktycznych konsekwencji tego polecenia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Powtórzenie „nie zechce posłuchać” odzwierciedla powtórzenie παρακούσῃ, a składnia pozostaje bliska grece bez nienaturalnej dosłowności.
