id: MAT.18.14
reference: Matthew 18:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: pl
  text: Tak samo nie jest wolą waszego Ojca w niebie, aby zginął choćby jeden z tych małych.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „aby się zagubił”. Grecki czasownik może oznaczać zarówno „zginąć”, jak i „zagubić się”; bezpośredni kontekst zagubionej owcy przemawia za drugim odcieniem znaczeniowym.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Tak samo
  rationale: Naturalnie i wyraźnie łączy zdanie z poprzedzającym obrazem zagubionej owcy, zachowując porównawczą siłę wyrażenia.
- source_word: θέλημα ἔμπροσθεν τοῦ πατρὸς
  choice: wolą ... Ojca
  rationale: Greckie wyrażenie z ἔμπροσθεν, dosłownie „przed Ojcem”, w tym kontekście idiomatycznie oznacza to, czego Ojciec chce. Dosłowne „wolą przed Ojcem” byłoby po polsku nienaturalne i niejasne.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: waszego Ojca w niebie
  rationale: Zachowuje formę osobową „waszego Ojca” i sens lokalizującego określenia, oddając grecką liczbę mnogą οὐρανοῖς naturalnym polskim zwrotem „w niebie”.
- source_word: ἵνα ἀπόληται
  choice: aby zginął
  rationale: Oddaje poważny sens czasownika ἀπόλλυμι, nie wykluczając kontekstowego znaczenia „zagubić się”, podanego w przypisie.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: choćby jeden z tych małych
  rationale: „Choćby jeden” naturalnie uwydatnia pojedynczość w zdaniu przeczącym, a „ci mali” zachowuje szersze, niekoniecznie wyłącznie dziecięce odniesienie τούτων τῶν μικρῶν.
theological_decisions:
- issue: Znaczenie ἀπόληται w związku z poprzedzającym obrazem zagubionej owcy
  choice: aby zginął
  alternative: aby się zagubił
  rationale: Czasownik może wskazywać zarówno na zgubę, jak i na zagubienie. Tekst główny zachowuje moc ostrzeżenia, natomiast przypis ujawnia sens szczególnie wspierany przez bezpośredni kontekst.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Składnia jest naturalna dla polszczyzny, a określenie „ci mali” celowo nie ogranicza odniesienia wyłącznie do dzieci.
