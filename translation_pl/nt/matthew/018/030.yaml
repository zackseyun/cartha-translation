  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: pl
  text: On jednak nie chciał[a], lecz odszedł i wtrącił go do więzienia[b], dopóki nie odda tego, co był winien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „odmówił”; dosłownie: „nie chciał” lub „nie był skłonny”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „osadził go w więzieniu”; grecki czasownik jest bardziej dosadny i dosłownie znaczy „rzucił”.'
    reason: lexical_alternative
  - marker: c
    text: 'Można też: „należną kwotę” albo „dług”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: On jednak
  rationale: Zaimek wskazuje na wspomnianego wcześniej sługę, a „jednak” naturalnie oddaje kontrast wprowadzony przez δέ.
- source_word: οὐκ ἤθελεν
  choice: nie chciał
  rationale: Oddaje wolitywny sens θέλω bez wzmacniania go do interpretacyjnego „odmówił”.
- source_word: ἀλλὰ
  choice: lecz
  rationale: Wyraża zdecydowane przeciwstawienie jego postępowania wcześniejszej prośbie współsługi.
- source_word: ἀπελθὼν
  choice: odszedł
  rationale: Imiesłów aorystu został naturalnie przełożony polską formą osobową, z zachowaniem następstwa czynności.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: wtrącił go do więzienia
  rationale: „Wtrącił” zachowuje siłę βάλλω, a zarazem jest naturalnym, współczesnym polskim określeniem osadzenia kogoś w więzieniu.
- source_word: ἕως οὗ
  choice: dopóki nie
  rationale: Naturalna polska konstrukcja wyznaczająca kres uwięzienia przez oczekiwane dokonanie czynności.
- source_word: ἀποδῷ
  choice: odda
  rationale: Po „dopóki nie” polski czasownik dokonany trafnie oddaje oczekiwane pełne uregulowanie należności.
- source_word: τὸ ὀφειλόμενον
  choice: tego, co był winien
  rationale: Oddaje substantywizowany imiesłów „to, co jest należne”, a kontekstowo wskazuje na kwotę długu bez zastępowania wyrażenia rzeczownikiem „dług”.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Wtrącił do więzienia” zachowuje brutalność działania bez archaicznego „wrzucił do ciemnicy”. Konstrukcja „dopóki nie odda” jest idiomatyczna po polsku i zachowuje aspekt oczekiwanego dokonania.
