base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: pl
  text: 'Wtedy Piotr podszedł do niego i powiedział: „Panie, ile razy mój brat zgrzeszy przeciwko mnie, a ja mu przebaczę? Czy aż siedem razy?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „mój brat”. Greckie słowo ma formę męską, lecz w tym kontekście może odnosić się szerzej do współucznia lub współuczennicy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, zachowujący tok narracji.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Piotr podszedł do niego i powiedział
  rationale: Oddaje czynność uprzednią imiesłowu aorystu oraz zwykły czasownik mówienia; zaimek odnosi się do Jezusa.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος zachowuje zarówno pełen szacunku zwrot do Jezusa, jak i możliwy wydźwięk teologiczny.
- source_word: ποσάκις
  choice: ile razy
  rationale: Pytanie dotyczy liczbowej częstotliwości, co potwierdza następująca propozycja siedmiu razy.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: zgrzeszy przeciwko mnie
  rationale: Forma przyszła została zachowana, a εἰς ἐμέ naturalnie oznacza tu przewinienie skierowane przeciw mówiącemu.
- source_word: ὁ ἀδελφός μου
  choice: mój brat
  rationale: Oddaje męską liczbę pojedynczą tekstu greckiego bez wpisywania szerszego zakresu znaczeniowego do tekstu głównego.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: a ja mu przebaczę
  rationale: ἀφίημι w tym kontekście oznacza przebaczyć; polska forma przyszła zachowuje napięcie składniowe oryginału, a „a” naturalnie przedstawia reakcję Piotra.
- source_word: ἕως ἑπτάκις
  choice: Czy aż siedem razy?
  rationale: ἕως wyznacza proponowaną granicę; partykuła „czy” i „aż” tworzą naturalne polskie pytanie sugerujące wysoki limit.
theological_decisions:
- issue: Zakres znaczeniowy ἀδελφός w kontekście wspólnoty uczniów
  choice: 'W tekście głównym: „mój brat”.'
  alternative: „mój brat lub siostra”; „współuczeń”; „ktoś ze wspólnoty”
  rationale: Greka ma rzeczownik rodzaju męskiego w liczbie pojedynczej. W kontekście może on szerzej oznaczać współucznia, ale tekst nie wyraża tego wprost, dlatego możliwość tę odnotowano w przypisie.
- issue: Relacja między zgrzeszeniem a przebaczeniem
  choice: Zachowano przyszłe formy „zgrzeszy” i „przebaczę” oraz współrzędność zdań.
  alternative: „ile razy mam przebaczyć bratu, który grzeszy przeciwko mnie?”
  rationale: 'Alternatywa jest bardziej idiomatyczna, lecz przekształca pytanie i zaciera osobliwą, teologicznie istotną konstrukcję grecką: „zgrzeszy... a ja przebaczę”.'
translation_notes:
  register: Współczesny, godny i przystępny polski. Zachowano bezpośredni tok pytania oraz przyszłe formy oryginału. Marker przypisu umieszczono po całej wypowiedzi, ponieważ objaśnia występujące w niej wyrażenie „mój brat”.
