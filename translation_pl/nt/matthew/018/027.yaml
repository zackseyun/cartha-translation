source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: pl
  text: Wtedy pan[a] owego niewolnika ulitował się nad nim, uwolnił go i darował mu dług[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może znaczyć „pan” lub „władca”; tutaj oznacza ludzkiego pana w przypowieści, nie jest zaś bezpośrednim tytułem Boga.
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „pożyczkę” lub „to, co zostało pożyczone”. W tym kontekście chodzi o wynikający z niej dług.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: ulitował się nad nim
  rationale: Imiesłów wyraża głębokie współczucie prowadzące do działania. Polska forma osobowa brzmi naturalnie i zachowuje siłę emocjonalną greckiego czasownika.
- source_word: δὲ
  choice: Wtedy
  rationale: W tym miejscu spójnik sygnalizuje dalszy ciąg opowiadania; „wtedy” jasno oddaje następstwo wydarzeń.
- source_word: κύριος
  choice: pan
  rationale: Chodzi o ludzkiego pana niewolnika w przypowieści. Mała litera zapobiega bezpośredniemu odczytaniu tego słowa jako tytułu Bożego.
- source_word: δοῦλου
  choice: niewolnika
  rationale: Grecki rzeczownik oznacza osobę pozostającą w niewoli i pod władzą pana; w tej przypowieści ta nierówna relacja jest istotna.
- source_word: ἀπέλυσεν αὐτόν
  choice: uwolnił go
  rationale: Sformułowanie zachowuje szeroki sens zwolnienia lub puszczenia wolno, bez dopowiadania, czy chodziło o formalne wyzwolenie z niewoli.
- source_word: τὸ δάνειον
  choice: dług
  rationale: Rzeczownik ściślej oznacza pożyczkę lub to, co zostało pożyczone, lecz w połączeniu z ἀφῆκεν chodzi o umorzenie wynikającego z niej zobowiązania. „Dług” jest w tym zdaniu naturalny i precyzyjny kontekstowo.
- source_word: ἀφῆκεν αὐτῷ
  choice: darował mu
  rationale: Czasownik może oznaczać odpuszczenie, darowanie lub umorzenie. „Darował mu dług” zachowuje finansowy sens obrazu oraz językowe powiązanie z motywem przebaczenia.
theological_decisions:
- issue: Możliwe odczytanie κύριος jako tytułu Bożego
  choice: pan, pisane małą literą
  alternative: Pan; właściciel
  rationale: Bezpośrednim uczestnikiem opowiadania jest ludzki pan niewolnika. Tłumaczenie nie narzuca jego bezpośredniego utożsamienia z Bogiem, lecz nie usuwa szerszego znaczenia przypowieści.
- issue: Społeczny status określony przez δοῦλος
  choice: niewolnik
  alternative: sługa
  rationale: „Niewolnik” wierniej ukazuje zależność i władzę pana, ważne w kontekście długu, groźby sprzedaży i uwolnienia.
- issue: Finansowy i przebaczeniowy sens ἀφῆκεν
  choice: darował mu dług
  alternative: umorzył mu pożyczkę
  rationale: Wyrażenie zachowuje konkretny sens finansowy, a zarazem zamierzone powiązanie przypowieści z przebaczeniem, bez zamiany samego pana wprost w postać boską.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. Konstrukcję imiesłowową rozwinięto w naturalne polskie zdanie współrzędne. „Darował mu dług” zachowuje zarówno realia finansowe, jak i motyw przebaczenia.
