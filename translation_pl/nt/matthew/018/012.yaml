id: MAT.18.12
reference: Matthew 18:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: pl
  text: Jak wam się wydaje? Jeśli ktoś ma sto owiec i jedna z nich się zabłąka[a], czy nie zostawi dziewięćdziesięciu dziewięciu na górach[b] i nie pójdzie szukać tej, która się błąka[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zbłądzi” lub „odejdzie od stada”. Grecki czasownik może znaczyć „błąkać się”, „zabłądzić”, a w innych kontekstach także „zostać zwiedzionym”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „na wzgórzach”.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „tej błąkającej się”; tradycyjnie: „zagubionej”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Jak wam się wydaje?
  rationale: Naturalne polskie pytanie wprowadzające, skierowane bezpośrednio do słuchaczy i zapraszające ich do oceny.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Jeśli jakiś człowiek ma
  rationale: Konstrukcja wyraża posiadanie; „jakiś człowiek” zachowuje liczbę pojedynczą i osobowy charakter greckiego ἀνθρώπῳ, nie sugerując konkretnej postaci.
- source_word: ἑκατὸν πρόβατα
  choice: sto owiec
  rationale: Bezpośredni i naturalny odpowiednik liczebnika oraz rzeczownika.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: jedna z nich się zabłąka
  rationale: „Zabłąka się” dobrze oddaje w kontekście owcy sens πλανάω bez rozstrzygania, czy przyczyną jest własne odejście, czy zewnętrzne zwiedzenie.
- source_word: οὐχὶ ἀφήσει
  choice: czy nie zostawi
  rationale: Pytanie z οὐχί oczekuje odpowiedzi twierdzącej; czas przyszły odpowiada formie ἀφήσει, a „zostawi” nie ma nadmiernie mocnego wydźwięku „porzuci”.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: dziewięćdziesięciu dziewięciu
  rationale: Standardowy polski odpowiednik liczebnika, w dopełniaczu wymaganym przez czasownik „zostawić” przy wyrażeniu dopełnienia osobowego/żywotnego.
- source_word: ἐπὶ τὰ ὄρη
  choice: na górach
  rationale: Zachowuje konkretny obraz topograficzny greckiego ὄρη; wariant „na wzgórzach” pozostaje możliwy.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: i nie pójdzie szukać
  rationale: Imiesłów okolicznikowy i czasownik główny przełożono naturalną polską konstrukcją ruchu z bezokolicznikiem; powtórzone „nie” klarownie wiąże oba orzeczenia z pytaniem retorycznym.
- source_word: τὸ πλανώμενον
  choice: tej, która się błąka
  rationale: Imiesłów czasu teraźniejszego zachowano jako trwającą czynność i powiązano leksykalnie z wcześniejszym „zabłąka”, bez zastępowania go mocniejszym określeniem „zagubiona”.
theological_decisions:
- issue: Zakres znaczeniowy πλανάω w metaforze owcy
  choice: zabłąka się / ta, która się błąka
  alternative: odejdzie; zostanie zwiedziona; zagubiona
  rationale: Przekład zachowuje możliwość dosłownego i metaforycznego odczytania oraz nie przesądza ani o winie owcy, ani o działaniu zewnętrznego sprawcy.
- issue: Ogólne użycie ἀνθρώπῳ
  choice: jakiś człowiek
  alternative: ktoś; pewien człowiek
  rationale: „Jakiś człowiek” zachowuje pojedynczą, reprezentatywną postać z przypowieści, a zarazem brzmi naturalnie i nie wprowadza wyznaniowej interpretacji.
- issue: Określenie błąkającej się owcy
  choice: ta, która się błąka
  alternative: zagubiona owca; ta, która zginęła
  rationale: Grecki tekst używa πλανάω, nie ἀπόλλυμι; dlatego przekład nie importuje silniejszej kategorii „zguby”, choć jest ona tradycyjnie kojarzona z tym obrazem.
translation_notes:
  register: 'Współczesny, godny i przystępny rejestr. Pytanie retoryczne zachowuje bezpośredni zwrot do licznych słuchaczy. Powtórzenie rdzenia „błąkać” odzwierciedla greckie πλανάω w obu wystąpieniach, przy czym aspektowo naturalne polskie formy różnią się: „zabłąka” oraz „się błąka”.'
