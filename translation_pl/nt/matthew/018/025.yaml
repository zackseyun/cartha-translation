    issue: Końcowe „aby należność została spłacona” może nadmiernie uwydatniać relację celu.
    rationale: W grece καὶ ἀποδοθῆναι jest drugim, współrzędnym bezokolicznikiem zależnym od ἐκέλευσεν, nie formalną konstrukcją celu. Polska konstrukcja „i aby dokonano spłaty” lepiej zachowuje tę składnię i stronę nieosobową.
