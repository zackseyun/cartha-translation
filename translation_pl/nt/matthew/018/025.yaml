source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: pl
  text: Ponieważ jednak nie miał z czego oddać, pan[a] rozkazał sprzedać go wraz z jego żoną i dziećmi oraz wszystko, co posiadał, i aby dokonano spłaty[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie κύριος może znaczyć „pan” lub „władca”; tutaj oznacza ludzkiego zwierzchnika sługi w przypowieści.
    reason: lexical_alternative
  - marker: b
    text: To znaczy, że sprzedaż dłużnika, jego rodziny i majątku miała zapewnić środki na spłatę należności.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Ponieważ jednak nie miał z czego oddać
  rationale: 'Konstrukcja dopełniaczowa opisuje przyczynę lub okoliczność: dłużnik nie miał środków, by oddać należność. Zwrot „nie miał z czego oddać” jest naturalny po polsku i nie sugeruje, że nie miał niczego, co podlegało spłacie.'
- source_word: ἐκέλευσεν
  choice: rozkazał
  rationale: Czasownik κελεύω oznacza wydanie autorytatywnego polecenia; „rozkazał” zachowuje jego stanowczą wymowę.
- source_word: ὁ κύριος
  choice: pan
  rationale: W ramach przypowieści κύριος oznacza ludzkiego zwierzchnika sługi. Mała litera i rzeczownik „pan” zachowują sens społeczny bez narzucania bezpośredniego tytułu Bożego.
- source_word: πραθῆναι
  choice: sprzedać go
  rationale: Bezokolicznik bierny od πιπράσκω mówi o sprzedaniu dłużnika. Polska składnia po czasowniku „rozkazał” naturalnie przyjmuje bezokolicznik czynny z nieokreślonym wykonawcą.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: jego żonę i dzieci
  rationale: Rodzajniki wskazują w kontekście na żonę i dzieci dłużnika; zaimek „jego” naturalnie wyraża tę relację po polsku.
- source_word: πάντα ὅσα ἔχει
  choice: wszystko, co posiadał
  rationale: Sformułowanie blisko oddaje pełny zakres majątku dłużnika i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: καὶ ἀποδοθῆναι
  choice: aby należność została spłacona
  rationale: Bierny bezokolicznik ἀποδοθῆναι nawiązuje do uregulowania zobowiązania. „Należność” jawnie oddaje obiekt domyślny z kontekstu, a strona bierna zachowuje formę źródłową.
theological_decisions:
- issue: Znaczenie κύριος w realiach przypowieści
  choice: pan
  alternative: Pan; właściciel
  rationale: Tutaj słowo określa ludzkiego zwierzchnika dłużnika w opowiadaniu. Zapis „pan” zachowuje podstawowy sens κύριος, nie przedstawiając go automatycznie jako bezpośredniego tytułu Boga lub Chrystusa.
- issue: Związek sprzedaży ze spłatą
  choice: aby należność została spłacona
  alternative: i żeby dokonano spłaty
  rationale: Kontekst wskazuje, że nakazana sprzedaż miała służyć uzyskaniu spłaty. Przekład wyraża ten naturalny związek celowy, nie rozstrzygając symbolicznego znaczenia wydarzeń przypowieści.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano surowość realiów prawno-społecznych przypowieści, bez ich łagodzenia ani przenoszenia na współczesne kategorie prawne.
