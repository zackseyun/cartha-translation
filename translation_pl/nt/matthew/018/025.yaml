  source_fidelity: Przekład trafnie oddaje niezdolność dłużnika do spłaty, rozkaz zwierzchnika i objęcie rozkazem dłużnika, jego rodziny oraz całego majątku. Końcowe „aby należność została spłacona” przedstawia jednak drugi bezokolicznik skoordynowany z rozkazem przede wszystkim jako cel sprzedaży. Greckie καὶ ἀποδοθῆναι zachowuje formę kolejnego elementu nakazu („i żeby dokonano spłaty”), dlatego warto tę koordynację wyrazić wyraźniej.
  naturalness: „Nie miał z czego oddać”, „pan” i „rozkazał” są naturalne w nowoczesnej polszczyźnie o godnym, narracyjnym rejestrze. Zmiana końcowej składni na „i aby dokonano spłaty” jest równie naturalna, a bliższa strukturze źródłowej.
  terminology: „Pan” właściwie oddaje tu κύριος jako ludzkiego zwierzchnika w przypowieści. „Należność” i „spłata” trafnie oddają domyślny w kontekście dług oraz ἀποδοθῆναι. Przypis kulturowy poprawnie objaśnia surowe realia bez ich wartościowania.
  issues:
