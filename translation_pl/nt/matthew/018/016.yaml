source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: pl
  text: Jeśli jednak cię nie posłucha, weź ze sobą jeszcze jedną lub dwie osoby, aby każda sprawa została potwierdzona na podstawie zeznań dwóch lub trzech świadków.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nawiązanie do Pwt 19,15. Dosłownie: „aby na ustach dwóch lub trzech świadków stanęło każde słowo”.'
    reason: cross_reference_and_literal_alternative
lexical_decisions:
- source_word: ἀκούσῃ
  choice: cię nie posłucha
  rationale: W kontekście napomnienia czasownik oznacza nie tylko usłyszenie słów, lecz odmowę przyjęcia ich i zastosowania się do nich. Zaimek „cię” wynika z kontekstu bezpośredniej rozmowy z poprzedniego wersetu.
- source_word: παράλαβε μετὰ σοῦ
  choice: weź ze sobą
  rationale: Naturalnie oddaje nakaz zabrania dodatkowych osób, zachowując znaczenie towarzyszenia wyrażone przez μετὰ σοῦ.
- source_word: ἔτι ἕνα ἢ δύο
  choice: jeszcze jedną lub dwie osoby
  rationale: ἔτι wskazuje na osoby dodatkowe; dopowiedzenie „osoby” jest w polszczyźnie potrzebne dla jasności, a formy żeńskie zgadzają się z tym rzeczownikiem.
- source_word: ἵνα
  choice: aby
  rationale: Zwięźle i naturalnie zachowuje celowy charakter zdania.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: na podstawie zeznania dwóch lub trzech świadków
  rationale: Grecki semityzm dosłownie mówi „na ustach”; w polskim języku prawnym sens formuły najlepiej przekazuje „na podstawie zeznania”, przy zachowaniu liczby świadków i aluzji do Pwt 19,15.
- source_word: σταθῇ
  choice: została rozstrzygnięta
  rationale: W formule prawnej czasownik oznacza, że sprawa ma zostać ustalona jako wiążąca. „Rozstrzygnięta” brzmi naturalnie po polsku, nie ograniczając sensu wyłącznie do potwierdzenia oskarżenia.
- source_word: πᾶν ῥῆμα
  choice: każda sprawa
  rationale: Choć formalnie wyrażenie może znaczyć „każde słowo”, w prawnej formule zaczerpniętej z Pwt 19,15 odnosi się do rozpatrywanej sprawy.
theological_decisions:
- issue: Starotestamentowa formuła świadków w kontekście napomnienia wspólnotowego
  choice: 'Oddać formułę jasnym współczesnym językiem prawnym: „na podstawie zeznania dwóch lub trzech świadków”.'
  alternative: 'Bardziej dosłownie: „na ustach dwóch lub trzech świadków stanęło każde słowo”.'
  rationale: Przekład zachowuje prawny charakter aluzji do Pwt 19,15, ale unika nienaturalnego w polszczyźnie semityzmu. Nie przesądza też, czy świadkowie mają potwierdzić pierwotne przewinienie, przebieg napomnienia, czy całość rozpatrywanej sprawy.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano ton bezpośredniego nakazu oraz prawną wymowę cytowanej formuły, unikając zarówno archaizmu „na ustach świadków”, jak i zawężającego „każde oskarżenie”.
