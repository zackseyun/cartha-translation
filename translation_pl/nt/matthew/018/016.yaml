  source_fidelity: '„Cię nie posłucha” trafnie oddaje ἀκούσῃ w kontekście napomnienia, a „weź ze sobą jeszcze jedną lub dwie osoby” wiernie przekazuje παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο. Zasadnicza trudność dotyczy σταθῇ: oznacza ono, że sprawa/słowo ma być ustanowione, potwierdzone lub uznane za ustalone na podstawie świadectwa, nie zaś że ma zostać rozstrzygnięte. „Rozstrzygnięta” sugeruje wydanie decyzji w sprawie i przez to zmienia zakres formuły.'
  naturalness: Proponowane brzmienie jest naturalne we współczesnej polszczyźnie. „Na podstawie zeznań dwóch lub trzech świadków” jasno oddaje prawną funkcję idiomu ἐπὶ στόματος, bez sztucznego kalkowania „na ustach”.
  terminology: „Świadkowie” i „sprawa” są odpowiednimi odpowiednikami μαρτύρων i πᾶν ῥῆμα w tym prawnym, deuteronomicznych tle. „Została potwierdzona” lepiej niż „została rozstrzygnięta” odpowiada σταθῇ, zachowując otwartość co do tego, co dokładnie mają poświadczyć świadkowie.
