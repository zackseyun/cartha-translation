source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: pl
  text: 'Wtedy jego pan wezwał go i powiedział mu: „Zły niewolniku, darowałem ci cały tamten dług[a], ponieważ błagałeś mnie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „umorzyłem ci cały tamten dług”. Grecki czasownik może oznaczać zarówno darowanie lub umorzenie długu, jak i przebaczenie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, zachowujący kolejność wydarzeń w przypowieści.
- source_word: προσκαλεσάμενος
  choice: wezwał go
  rationale: Oddaje wezwanie kogoś do siebie, a zarazem autorytet pana; imiesłów przełożono naturalną polską formą osobową.
- source_word: ὁ κύριος αὐτοῦ
  choice: jego pan
  rationale: W kontekście przypowieści κύριος określa pana niewolnika, nie tytuł Boży.
- source_word: λέγει αὐτῷ
  choice: powiedział mu
  rationale: Grecki czas teraźniejszy historyczny oddano polskim czasem przeszłym, naturalnym w narracji.
- source_word: Δοῦλε πονηρέ
  choice: Zły niewolniku
  rationale: „Niewolnik” zachowuje zależność prawną i społeczną istotną dla przypowieści, a „zły” zwięźle wyraża moralną naganę zawartą w πονηρός.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: cały tamten dług
  rationale: Ściśle oddaje zarówno całość długu, jak i wskazujący charakter ἐκείνην.
- source_word: ἀφῆκά σοι
  choice: darowałem ci
  rationale: W języku polskim „darować dług” naturalnie oznacza jego umorzenie, a jednocześnie zachowuje związek z językiem przebaczenia.
- source_word: ἐπεὶ
  choice: ponieważ
  rationale: Jasno wprowadza przyczynę działania pana.
- source_word: παρεκάλεσάς με
  choice: mnie błagałeś
  rationale: Oddaje usilną prośbę właściwą temu kontekstowi i zachowuje emfatyczne dopełnienie „mnie”.
theological_decisions:
- issue: Oddanie δοῦλος w relacji pan–niewolnik
  choice: niewolnik
  alternative: sługa
  rationale: Ekonomiczna i prawna zależność tej postaci od pana jest ważna dla wymowy przypowieści. „Sługa” byłby łagodniejszy, ale zacierałby charakter tej relacji.
- issue: Oddanie ἀφίημι w kontekście długu
  choice: darować dług
  alternative: umorzyć dług / przebaczyć
  rationale: „Darować dług” zachowuje konkretny sens anulowania zobowiązania, a zarazem nie usuwa zamierzonego związku obrazu długu z przebaczeniem.
translation_notes:
  register: Współczesny, godny styl narracyjny. Wołacz „Zły niewolniku” zachowuje bezpośredniość nagany. Szyk „mnie błagałeś” podkreśla osobę pana zgodnie z greckim με.
