base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: pl
  text: 'W tym czasie uczniowie podeszli do Jezusa i zapytali: „Kto zatem jest większy w królestwie niebios?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: W tym czasie
  rationale: Naturalny współczesny odpowiednik wyrażenia wskazującego na daną chwilę lub czas w toku narracji, bez nadmiernego zawężania go do jednej godziny.
- source_word: προσῆλθον
  choice: podeszli
  rationale: Oddaje ruch uczniów ku Jezusowi w prostym, naturalnym języku.
- source_word: λέγοντες
  choice: i zapytali
  rationale: Imiesłów „mówiąc” wprowadza tu bezpośrednie pytanie; polska forma osobowa brzmi naturalniej i zachowuje funkcję wypowiedzi.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: Kto zatem jest większy
  rationale: Zachowuje formę stopnia wyższego μείζων oraz wnioskująco-nawiązujący odcień ἄρα, nie zastępując ich stopniem najwyższym.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Utrwalone i zrozumiałe określenie Mateuszowe, zachowujące liczbę mnogą οὐρανῶν.
theological_decisions:
- issue: Stopień przymiotnika μείζων w pytaniu uczniów
  choice: większy
  alternative: największy
  rationale: Tekst grecki ma formalnie stopień wyższy. Przekład zachowuje tę postać i wynikające z niej napięcie, choć kontekst może sugerować pytanie o najwyższą pozycję.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Składnię imiesłowową zastąpiono naturalnym polskim połączeniem zdań, zachowując treść i kolejność wydarzeń.
