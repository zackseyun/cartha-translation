  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: pl
  text: 'Jezus mówi mu: „Nie mówię ci, że aż siedem razy, lecz aż siedemdziesiąt siedem razy[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „siedemdziesiąt razy po siedem”.'
    reason: alternatywne odczytanie niejednoznacznego greckiego wyrażenia ἑβδομηκοντάκις ἑπτά
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jezus mówi mu
  rationale: Zachowano grecki czas teraźniejszy narracyjny oraz zaimek odpowiadający αὐτῷ; szyk dostosowano do naturalnej polszczyzny.
- source_word: Οὐ λέγω σοι
  choice: Nie mówię ci
  rationale: Bezpośrednie i naturalne oddanie greckiego czasu teraźniejszego oraz celownika σοι.
- source_word: ἕως ἑπτάκις
  choice: aż siedem razy
  rationale: W kontekście liczbowym ἕως wyznacza granicę; polskie „aż” naturalnie nawiązuje do pytania Piotra z poprzedniego wersetu.
- source_word: ἀλλὰ
  choice: lecz
  rationale: Dostojny, ale współczesny spójnik wyrażający wyraźne przeciwstawienie.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: aż siedemdziesiąt siedem razy
  rationale: Wybrano uzasadnione odczytanie jako 77 razy, zachowując alternatywne odczytanie 70 × 7 w przypisie z powodu rzeczywistej niejednoznaczności wyrażenia.
theological_decisions:
- issue: Niejednoznaczna liczba w nauczaniu Jezusa o przebaczeniu
  choice: siedemdziesiąt siedem razy
  alternative: siedemdziesiąt razy po siedem
  rationale: Greckie ἑβδομηκοντάκις ἑπτά dopuszcza oba odczytania. Tekst główny przyjmuje odczytanie „siedemdziesiąt siedem”, a przypis zachowuje tradycyjną alternatywę bez rozstrzygania sensu teologicznego ponad to, co mówi tekst.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Historyczny czas teraźniejszy zachowuje żywość greckiej narracji. Dwukropek po „ci” naturalnie wprowadza przeciwstawione granice liczbowe; przypis umieszczono bezpośrednio przy niejednoznacznym wyrażeniu.
