  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: pl
  text: 'I znowu wam mówię: łatwiej jest wielbłądowi[b] przejść przez ucho igielne[a] niż bogatemu wejść do królestwa Boga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „przez otwór igły do szycia”.'
    reason: lexical_alternative
  - marker: b
    text: Czasem proponowano odczytanie „lina” zamiast „wielbłąd”, jednak grecki tekst tego wersetu ma „wielbłąd”.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: I znowu wam mówię
  rationale: πάλιν wyraża powtórzenie, a δέ jest łagodnym łącznikiem. Polski zwrot zachowuje oba elementy i brzmi naturalnie.
- source_word: εὐκοπώτερόν ἐστιν
  choice: Łatwiej jest
  rationale: Naturalny polski odpowiednik stopnia wyższego, wprowadzający porównanie dwóch bezokolicznikowych konstrukcji.
- source_word: κάμηλον
  choice: wielbłądowi
  rationale: Greckie κάμηλος oznacza „wielbłąda”; celownik wynika z naturalnej polskiej konstrukcji „łatwiej jest komuś”.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: przez ucho igielne
  rationale: Wyrażenie oznacza otwór w igle do szycia. „Ucho igielne” jest ustalonym, zrozumiałym polskim odpowiednikiem.
- source_word: εἰσελθεῖν
  choice: przejść / wejść
  rationale: 'Ten sam grecki bezokolicznik został oddany kontekstowo: przy uchu igielnym naturalne jest „przejść przez”, a przy królestwie — „wejść do”.'
- source_word: ἢ πλούσιον
  choice: niż bogatemu
  rationale: πλούσιον to rzeczownikowo użyty przymiotnik rodzaju męskiego w liczbie pojedynczej. Polska forma zachowuje zwięzłość i reprezentatywny charakter wypowiedzi.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: wejść do królestwa Boga
  rationale: εἰς z czasownikiem ruchu naturalnie odpowiada polskiemu „do”. „Królestwo Boga” jasno zachowuje grecki dopełniacz τοῦ θεοῦ.
theological_decisions:
- issue: Obraz wielbłąda i ucha igielnego
  choice: Zachowano dosłowny, celowo skrajny obraz wielbłąda przechodzącego przez otwór igły.
  alternative: Interpretacja „ucha igielnego” jako nazwy bramy albo zastąpienie „wielbłąda” słowem „lina”.
  rationale: Tekst grecki mówi o wielbłądzie i otworze igły. Nie daje podstaw do wpisania w przekład objaśnienia o rzekomej bramie ani do złagodzenia hiperboli.
- issue: Siła porównania dotyczącego bogatego
  choice: Pozostawiono napięcie wypowiedzi bez dopowiedzenia, w jaki sposób wejście staje się możliwe.
  alternative: Dodanie w wersecie objaśnienia, że jest to możliwe wyłącznie dzięki Bogu.
  rationale: Tę kwestię rozwija bezpośredni kontekst, lecz sam werset 24 zawiera jedynie ostre porównanie. Przekład nie powinien uprzedzać kolejnej wypowiedzi.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano tradycyjnie rozpoznawalne „ucho igielne”, a przypis podaje bardziej dosłowną postać greckiego wyrażenia. Markery przypisów umieszczono przy wyrażeniach, których dotyczą.
