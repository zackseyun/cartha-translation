id: MAT.19.28
reference: Matthew 19:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: pl
  text: 'Jezus zaś powiedział im: „Zaprawdę mówię wam: wy, którzy poszliście za mną, w czasie odnowienia[a], gdy Syn Człowieczy zasiądzie na tronie swojej chwały, również zasiądziecie na dwunastu tronach, sądząc[b] dwanaście pokoleń Izraela”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w czasie odrodzenia”, „w nowym świecie” lub „przy ponownym stworzeniu”. W tym miejscu chodzi najprawdopodobniej o przyszłe odnowienie związane z panowaniem Syna Człowieczego, a nie o indywidualne nowe narodzenie.'
    reason: lexical_alternative
  - marker: b
    text: „Sądząc” może tu również obejmować sens rządzenia lub sprawowania władzy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Zaprawdę
  rationale: Oddaje uroczystą, autorytatywną formułę wprowadzającą wypowiedź Jezusa i zachowuje podniosły, lecz zrozumiały rejestr.
- source_word: ἀκολουθήσαντές μοι
  choice: którzy poszliście za Mną
  rationale: Naturalny polski odpowiednik naśladowania Jezusa, zachowujący bezpośrednie odniesienie do Jego osoby oraz identyfikujący adresatów przez podjęte przez nich pójście za Nim.
- source_word: ἐν τῇ παλιγγενεσίᾳ
  choice: w czasie odnowienia
  rationale: παλιγγενεσία może oznaczać odrodzenie lub odnowienie; kontekst przyszłego zasiadania Syna Człowieczego wskazuje na eschatologiczne odnowienie, nie na indywidualne nowe narodzenie. Dodanie „w czasie” daje naturalną polską składnię bez określania szczegółowego schematu eschatologicznego.
- source_word: ὅταν καθίσῃ
  choice: gdy ... zasiądzie
  rationale: Konstrukcja ὅταν z aorystem w trybie łączącym odnosi się tu do przyszłego wydarzenia; polski czas przyszły „zasiądzie” oddaje je naturalnie.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tytułu, zachowujący jego biblijne i mesjańskie skojarzenia.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: na tronie swojej chwały
  rationale: Dość formalnie zachowuje grecką konstrukcję dopełniaczową i podniosły ton, pozostając zrozumiałe po polsku.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: również zasiądziecie
  rationale: „Również” oddaje καί i uwydatnia paralelę między zasiadaniem Syna Człowieczego a przyszłym zasiadaniem uczniów.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: na dwunastu tronach
  rationale: Bezpośredni i naturalny polski odpowiednik wyrażenia przyimkowego.
- source_word: κρίνοντες
  choice: sądząc
  rationale: Zachowuje podstawowy sens czasownika i nie rozstrzyga, czy związana z nim władza obejmuje także rządzenie.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: dwanaście plemion Izraela
  rationale: Konwencjonalne i precyzyjne określenie dwunastu plemion Izraela.
theological_decisions:
- issue: Znaczenie παλιγγενεσία w tym kontekście
  choice: przyszłe odnowienie związane z zasiadaniem Syna Człowieczego
  alternative: indywidualne odrodzenie; nowy wiek; nowy świat
  rationale: Bezpośredni kontekst dotyczy przyszłego tronu, udziału uczniów we władzy sądowniczej i Izraela. Przekład wskazuje więc na eschatologiczne odnowienie, ale nie narzuca określonego systemu dotyczącego czasów ostatecznych.
- issue: Zakres znaczeniowy κρίνοντες
  choice: sądząc
  alternative: rządząc; sprawując władzę
  rationale: Czasownik bezpośrednio oznacza sądzenie, choć w tym kontekście może obejmować także sprawowanie władzy. Tekst główny zachowuje sens podstawowy, a przypis sygnalizuje szerszą możliwość.
translation_notes:
  register: Współczesny, godny i lekko podniosły polski rejestr biblijny. Zachowano tradycyjne „Zaprawdę” oraz tytuł „Syn Człowieczy”, unikając technicznego „regeneracja” i denominacyjnie nacechowanego doprecyzowania przyszłego odnowienia.
