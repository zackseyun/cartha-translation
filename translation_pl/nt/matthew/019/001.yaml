    issue: „tereny Judei”
    rationale: Wyrażenie jest możliwe, lecz ma administracyjno-urzędowy odcień i słabiej odpowiada narracyjnemu opisowi τὰ ὅρια. „Okolice Judei” naturalniej oddają znaczenie regionu/obszaru bez sugerowania ściśle wytyczonych granic.
  revised_text: Gdy Jezus skończył mówić te słowa, opuścił Galileę i przybył w okolice Judei po drugiej stronie Jordanu.[a]
