source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: pl
  text: Gdy Jezus skończył mówić te słowa, opuścił Galileę i przybył w okolice Judei po drugiej stronie Jordanu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „za Jordanem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Gdy
  rationale: Grecka formuła wprowadza kolejny etap narracji. Samo „Gdy” oddaje tę funkcję naturalną współczesną polszczyzną, bez archaicznego „I stało się, że”.
- source_word: ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους
  choice: Jezus skończył mówić te słowa
  rationale: Konstrukcja jasno wskazuje, że Jezus zakończył poprzednią wypowiedź. Dodanie „mówić” pozwala zachować pluralne „te słowa” bez nienaturalnego polskiego „skończył te słowa”.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: opuścił Galileę
  rationale: Oddaje odejście z miejsca pochodzenia ruchu w sposób zwięzły, naturalny i zgodny z narracyjnym rejestrem.
- source_word: ἦλθεν εἰς
  choice: przybył na
  rationale: Zachowuje znaczenie czasownika ruchu oraz wejścia na określony obszar, a zarazem brzmi naturalnie po polsku.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: tereny Judei
  rationale: ὅρια może oznaczać granice, okręg lub terytorium. „Tereny” dobrze pasują do opisu podróży i nie ograniczają sensu do samej linii granicznej.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: po drugiej stronie Jordanu
  rationale: Wyrażenie zachowuje relacyjny sens πέραν i jest jasnym, współczesnym określeniem geograficznym.
theological_decisions: []
translation_notes:
  register: Współczesny, godny styl narracyjny. Pominięto dosłowne „I stało się” jako formułę brzmiącą dziś archaicznie, zachowując jej funkcję przejścia narracyjnego. Znacznik przypisu umieszczono przy wyrażeniu geograficznym, którego dotyczy wariant.
