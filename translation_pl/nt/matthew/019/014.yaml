  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: pl
  text: 'Lecz Jezus powiedział: „Pozwólcie dzieciom przychodzić do mnie i nie przeszkadzajcie im, bo do takich[a] należy królestwo niebios”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłowniej: „bo takich jest królestwo niebios”. Wyrażenie „takich” może odnosić się zarówno do obecnych dzieci, jak i do ludzi tego rodzaju.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Pozwólcie
  rationale: W tym kontekście ἀφίημι wyraża zezwolenie. „Pozwólcie” jest naturalnym i precyzyjnym odpowiednikiem polskim.
- source_word: τὰ παιδία
  choice: dzieciom
  rationale: παιδία oznacza dzieci, często małe, lecz sam rzeczownik nie wymaga dodania określenia „małe”.
- source_word: μὴ κωλύετε
  choice: nie przeszkadzajcie
  rationale: κωλύω znaczy „przeszkadzać, powstrzymywać, nie dopuszczać”. Wybrana forma zachowuje ogólny sens zakazu bez rozstrzygania, czy przeszkadzanie już trwa.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: im […] przychodzić do mnie
  rationale: Połączenie κωλύω z bezokolicznikiem naturalnie oddaje polska konstrukcja „przeszkadzać komuś coś robić”; πρός με wskazuje na przychodzenie do Jezusa.
- source_word: τῶν γὰρ τοιούτων
  choice: bo do takich należy
  rationale: τοιούτων odnosi się do osób tego rodzaju, nie tylko do konkretnych obecnych dzieci. „Do takich” zachowuje reprezentatywną, lecz niedookreśloną wymowę greki.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: „Królestwo niebios” naturalnie zachowuje Mateuszowe wyrażenie z liczbą mnogą οὐρανῶν i ma utrwalony, godny rejestr.
- source_word: ἐστὶν
  choice: należy
  rationale: W połączeniu z dopełniaczem τῶν τοιούτων polskie „należy do takich” jasno i idiomatycznie oddaje sens konstrukcji, podczas gdy dosłowne „jest takich” byłoby nienaturalne.
theological_decisions:
- issue: Czy Jezus mówi wyłącznie o literalnych dzieciach, czy również o osobach, które są do nich pod pewnym względem podobne
  choice: „do takich należy”
  alternative: „do tych dzieci należy” albo interpretacyjne „należy do tych, którzy są jak dzieci”
  rationale: Greckie τοιούτων wykracza poza wskazanie samych obecnych dzieci, ale nie określa wyraźnie cechy, która je wyróżnia. „Do takich” zachowuje zarówno bezpośrednie odniesienie do dzieci, jak i szerszą możliwość odniesienia.
translation_notes:
  register: 'Współczesny, standardowy polski o godnym, prostym brzmieniu. Szyk polecenia uproszczono naturalnie: wspólny sens „pozwólcie im przychodzić” wynika z greckiego Ἄφετε τὰ παιδία ... ἐλθεῖν. Zachowano Mateuszowe „królestwo niebios” oraz niejednoznaczność „takich”.'
