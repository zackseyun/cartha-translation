source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: pl
  text: 'A mówię wam: kto rozwodzi się ze swoją żoną, z wyjątkiem niemoralności seksualnej[a], i poślubia inną, dopuszcza się cudzołóstwa; a kto poślubia kobietę rozwiedzioną[b], dopuszcza się cudzołóstwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greckie wyrażenie można też oddać: „z wyjątkiem nierządu” lub „z powodu niemoralności seksualnej”. Termin ten bywa rozumiany węziej jako „rozpusta” albo „niewierność seksualna”.'
    reason: lexical_alternative
  - marker: b
    text: 'W niektórych rękopisach brak słów: „a kto poślubia kobietę rozwiedzioną, dopuszcza się cudzołóstwa”.'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ja zaś mówię wam
  rationale: „Mówię wam” naturalnie oddaje λέγω z celownikiem ὑμῖν, a „zaś” zachowuje łagodnie przeciwstawny lub kontynuacyjny charakter δέ w kontekście.
- source_word: ὃς ἂν
  choice: kto
  rationale: Zaimek względny z ἄν tworzy ogólny warunek odnoszący się do każdej osoby spełniającej wskazaną przesłankę; polskie „kto” oddaje to zwięźle i naturalnie.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: oddala swoją żonę
  rationale: W kontekście małżeńskim ἀπολύω oznacza odprawienie prowadzące do rozwodu. „Oddala” zachowuje obrazowość greckiego czasownika i utrwalony polski język biblijny, pozostając zrozumiałe; „żonę” jest wymagane przez kontekst.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: jeśli nie z powodu nierządu
  rationale: Konstrukcja wskazuje wyjątek lub podstawę działania. „Jeśli nie z powodu” zachowuje składniową formę greki, natomiast „nierząd” pozostawia πορνεία szersze niż samo cudzołóstwo, bez rozstrzygania spornego zakresu terminu.
- source_word: γαμήσῃ ἄλλην
  choice: poślubia inną
  rationale: ἄλλην ma rodzaj żeński i oznacza inną kobietę; w polszczyźnie po czasowniku „poślubia” samo „inną” jest jasne i nie wymaga dopowiedzenia.
- source_word: μοιχᾶται
  choice: dopuszcza się cudzołóstwa
  rationale: To naturalny i precyzyjny polski odpowiednik czasownika oznaczającego popełnianie cudzołóstwa.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: a kto poślubia oddaloną, dopuszcza się cudzołóstwa
  rationale: Rzeczownikowa konstrukcja z imiesłowem została oddana ogólnym „kto”. „Oddaloną” zachowuje więź leksykalną z wcześniejszym ἀπολύσῃ i wskazuje na kobietę odprawioną przez męża.
theological_decisions:
- issue: Znaczenie πορνεία w klauzuli wyjątku
  choice: nierząd
  alternative: niemoralność seksualna; rozpusta; niewierność seksualna
  rationale: πορνεία ma szerszy zakres niż μοιχεία („cudzołóstwo”). „Nierząd” jest zwięzłym, godnym i szerokim odpowiednikiem, a przypis zachowuje możliwość innych ujęć bez narzucania wąskiej interpretacji wyznaniowej.
- issue: Funkcja μὴ ἐπὶ πορνείᾳ
  choice: jeśli nie z powodu nierządu
  alternative: z wyjątkiem nierządu; poza przypadkiem nierządu
  rationale: Sformułowanie zachowuje zarówno wyjątek, jak i sens podstawy lub przyczyny wyrażany przez ἐπί z celownikiem, nie przesądzając dalszych wniosków doktrynalnych.
- issue: Obecność końcowej klauzuli καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: uwzględnić w tekście głównym
  alternative: pominąć zgodnie z częścią świadków tekstu
  rationale: Podany tekst SBLGNT zawiera tę klauzulę, zarazem oznaczając ją jako wariant tekstualny. Dlatego zostaje przełożona w tekście głównym, a jej nieobecność w części rękopisów jest odnotowana w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna o umiarkowanie formalnym rejestrze. Zachowano paralelizm i zwięzłość wypowiedzi. „Oddala” oraz „oddaloną” uwidaczniają powtórzenie rdzenia ἀπολύω, a przypisy dokumentują niejednoznaczność πορνεία i wariant rękopiśmienny.
