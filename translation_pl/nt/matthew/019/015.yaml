  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: pl
  text: A gdy położył na nie ręce, odszedł stamtąd.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Spójnik łączy zdanie z poprzedzającą narracją; polskie „A” naturalnie zachowuje ciąg opowiadania.
- source_word: ἐπιθεὶς
  choice: gdy położył
  rationale: Aorystyczny imiesłów wskazuje tu na czynność poprzedzającą główne orzeczenie. Konstrukcja „gdy położył” brzmi naturalnie we współczesnej polszczyźnie i zachowuje kolejność wydarzeń.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: na nie ręce
  rationale: Zwrot oznacza konkretne położenie rąk na osobach. Zaimek „nie” odnosi się do dzieci z kontekstu, a polszczyzna nie wymaga dodawania zaimka dzierżawczego „swoje”.
- source_word: ἐπορεύθη
  choice: odszedł
  rationale: W tym kontekście czasownik oznacza opuszczenie miejsca i dalszą drogę; „odszedł” jest zwięzłe, współczesne i narracyjnie naturalne.
- source_word: ἐκεῖθεν
  choice: stamtąd
  rationale: Przysłówek miejsca dosłownie wskazuje ruch „z tamtego miejsca”; „stamtąd” jest jego bezpośrednim i naturalnym odpowiednikiem.
theological_decisions:
- issue: Charakter nałożenia rąk przez Jezusa
  choice: 'Zachowano konkretną czynność: „położył na nie ręce”.'
  alternative: Zastąpienie jej interpretacyjnym sformułowaniem „pobłogosławił je”.
  rationale: Grecki tekst wyraźnie opisuje gest położenia rąk. Choć kontekst wskazuje na błogosławieństwo, przekład nie zastępuje opisanego działania jego domniemanym znaczeniem ani nie nadaje mu znaczenia sakramentalnego czy ordynacyjnego.
translation_notes:
  register: Współczesny, godny i prosty rejestr narracyjny. Zdanie podrzędne „gdy położył” pozwala uniknąć nieco książkowego imiesłowu „położywszy”, zachowując zarazem czasową relację obecną w grece.
