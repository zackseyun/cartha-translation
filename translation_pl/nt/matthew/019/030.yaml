  text: But many who are first will be last[a], and the last first.
translation:
  language: pl
  text: Lecz wielu, którzy są pierwsi, będzie ostatnimi[a], a ostatni będą pierwszymi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też bardziej dosłownie: „Lecz wielu pierwszych będzie ostatnimi, a ostatni pierwszymi”. Grecka wypowiedź jest szczególnie zwięzła i ma charakter przysłowia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wielu
  rationale: Przymiotnik jest użyty rzeczownikowo i odnosi się do szerokiej, bliżej nieokreślonej grupy; polskie „wielu” zachowuje tę zwięzłość bez dodawania rzeczownika „ludzi”.
- source_word: δὲ
  choice: lecz
  rationale: Spójnik sygnalizuje łagodne przeciwstawienie wobec wcześniejszej wypowiedzi o nagrodzie i pozycji; „lecz” oddaje ten odcień w naturalnej, podniosłej polszczyźnie.
- source_word: ἔσονται
  choice: będzie / będą
  rationale: 'Grecka forma czasu przyszłego została oddana zgodnie z polską składnią: w pierwszym członie liczbą pojedynczą przy liczebnikowym „wielu”, a w drugim domyślny grecki czasownik rozwinięto jako „będą”.'
- source_word: πρῶτοι
  choice: pierwsi / pierwszymi
  rationale: Wyraz wskazuje tu na miejsce lub rangę, a niekoniecznie pierwszeństwo czasowe. Bezpośredni odpowiednik „pierwsi” zachowuje szerokość i przysłowiowy charakter wypowiedzi.
- source_word: ἔσχατοι
  choice: ostatnimi / ostatni
  rationale: „Ostatni” tworzy w polszczyźnie wyraźną antytezę wobec „pierwszych”, nie zawężając sensu do konkretnego rodzaju statusu.
- source_word: πολλοὶ … πρῶτοι ἔσχατοι
  choice: wielu, którzy są pierwsi, będzie ostatnimi
  rationale: Dodanie zdania względnego wyraża relację domyślną w zwięzłej greckiej konstrukcji i zapewnia naturalny tok współczesnej polszczyzny, nie zmieniając zakresu twierdzenia.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: a ostatni będą pierwszymi
  rationale: Grecki czasownik jest pominięty, lecz wynika z pierwszego członu. Jego powtórzenie po polsku zapewnia jasność, a spójnik „a” zachowuje symetryczne przeciwstawienie.
theological_decisions:
- issue: Charakter zapowiedzi odwrócenia porządku
  choice: Ogólna wypowiedź o odwróceniu miejsca lub rangi, bez określenia jego dokładnej dziedziny.
  alternative: Odczytanie wyłącznie jako wypowiedzi o wejściu do królestwa, nagrodach uczniów albo odwróceniu pozycji społecznej.
  rationale: Sam werset ma formę szerokiej, przysłowiowej sentencji i nie rozstrzyga jednoznacznie, czy chodzi o zbawienie, nagrodę, pozycję społeczną czy rangę eschatologiczną. Przekład nie zawęża tej zamierzonej otwartości.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zdanie względne oraz powtórzony czasownik ułatwiają odbiór, natomiast przypis zachowuje dostęp do bardziej zwięzłej budowy greckiej.
