  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: pl
  text: 'Młodzieniec mówi mu: „Tego wszystkiego przestrzegałem. Czego mi jeszcze brakuje?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Zachowano grecki czas teraźniejszy narracyjny, który w polskiej narracji brzmi naturalnie.
- source_word: αὐτῷ
  choice: mu
  rationale: Polski celownik naturalnie oddaje grecki zaimek w celowniku po czasowniku „mówi”.
- source_word: ὁ νεανίσκος
  choice: młodzieniec
  rationale: Termin oznacza młodego mężczyznę; nie dodano określenia „dostojnik”, którego nie ma w tym wersecie Mateusza.
- source_word: Πάντα ταῦτα
  choice: tego wszystkiego
  rationale: Naturalny polski odpowiednik odnoszący się do wymienionych wcześniej przykazań.
- source_word: ἐφύλαξα
  choice: przestrzegałem
  rationale: W odniesieniu do przykazań φυλάσσω oznacza ich przestrzeganie; polski czas przeszły ujmuje dotychczasowe postępowanie mówiącego bez rozstrzygania prawdziwości jego oceny.
- source_word: τί
  choice: czego
  rationale: Dopełniacz „czego” jest wymagany przez polski czasownik „brakować”.
- source_word: ἔτι
  choice: jeszcze
  rationale: Oddaje ideę nadal istniejącego lub pozostającego braku.
- source_word: ὑστερῶ
  choice: mi brakuje
  rationale: Idiomaticznie oddaje znaczenie niedostatku lub pozostawania w tyle, bez dopowiadania, na czym brak polega.
theological_decisions:
- issue: Samoocena posłuszeństwa
  choice: Wypowiedź młodzieńca przedstawiono jako bezpośrednie twierdzenie, że przestrzegał przykazań.
  alternative: Zasygnalizowanie w przekładzie, że jego twierdzenie jest błędne, przesadne albo ironiczne.
  rationale: Greka przytacza jego deklarację bez jawnej oceny. Przekład zachowuje napięcie narracyjne i nie przesądza o jej słuszności.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. „Młodzieniec” jest zwięzłe i odpowiada greckiemu określeniu młodego mężczyzny; „przestrzegałem” jest naturalnym polskim połączeniem z przykazaniami.
