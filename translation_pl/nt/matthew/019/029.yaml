language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: pl
  text: 'A każdy, kto opuścił domy, braci, siostry, ojca, matkę, żonę[a], dzieci lub pola ze względu na moje imię, otrzyma stokroć tyle i odziedziczy życie wieczne.


    [a] Niektóre rękopisy pomijają słowo „żonę”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy pomijają słowo „żonę”.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: każdy, kto
  rationale: 'Oddaje dystrybutywny i ogólny sens wyrażenia: obietnica dotyczy każdej osoby spełniającej podany warunek.'
- source_word: ἀφῆκεν
  choice: opuścił
  rationale: Czasownik oznacza pozostawienie kogoś lub czegoś; „opuścił” zachowuje powagę decyzji, nie narzucając mocniejszego sensu „porzucił”.
- source_word: οἰκίας
  choice: domy
  rationale: Konkretny rzeczownik w liczbie mnogiej pasuje do zestawienia więzi rodzinnych i dóbr materialnych.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: braci, siostry
  rationale: Greka wymienia braci i siostry osobno, dlatego zachowano oba określenia.
- source_word: πατέρα ἢ μητέρα
  choice: ojca, matkę
  rationale: Bezpośrednie i naturalne odpowiedniki nazw relacji rodzinnych.
- source_word: γυναῖκα
  choice: żonę
  rationale: W szeregu relacji rodzinnych γυνή oznacza tu żonę, nie kobietę w znaczeniu ogólnym.
- source_word: τέκνα
  choice: dzieci
  rationale: Naturalny polski odpowiednik określenia potomstwa w tym kontekście.
- source_word: ἀγρούς
  choice: pola
  rationale: Zachowuje konkretny sens gruntów uprawnych i materialny wymiar wyliczenia, bez zawężania do gospodarstw.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: ze względu na moje imię
  rationale: Wyrażenie jasno wskazuje motyw działania, a zarazem zachowuje źródłowy idiom „mojego imienia” i jego odniesienie do osoby oraz autorytetu Jezusa.
- source_word: ἑκατονταπλασίονα
  choice: stokroć tyle
  rationale: Naturalne, zwięzłe polskie wyrażenie zachowujące ilościową siłę obietnicy; unika potencjalnie mylącego „sto razy więcej”.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: odziedziczy życie wieczne
  rationale: Zachowuje zarówno metaforę dziedziczenia, jak i utrwalone, czytelne określenie życia wiecznego.
theological_decisions:
- issue: Znaczenie γυνή w wyliczeniu tego, co pozostawiono
  choice: żonę
  alternative: kobietę
  rationale: Kontekst domu i więzi rodzinnych przemawia za relacyjnym znaczeniem „żona”; wariant ogólny sugerowałby nieobecny w tekście sens wyrzeczenia się kobiet jako takich.
- issue: Zachowanie wyrażenia „moje imię”
  choice: ze względu na moje imię
  alternative: ze względu na mnie
  rationale: Zachowanie rzeczownika „imię” oddaje sformułowanie greckie i nie usuwa jego możliwych odniesień do osoby, autorytetu i publicznie wyznawanej tożsamości Jezusa.
- issue: Charakter obietnicy ἑκατονταπλασίονα
  choice: stokroć tyle
  alternative: sto razy więcej
  rationale: Przekład zachowuje niezwykłą skalę obietnicy bez rozstrzygania, w jaki sposób lub kiedy ma się ona urzeczywistnić.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Wyliczenie uproszczono składniowo przez użycie przecinków i końcowego „lub”, zachowując wszystkie elementy tekstu źródłowego. „Stokroć tyle” jest zrozumiałe, lecz niepotoczne, dzięki czemu odpowiada uroczystemu charakterowi wypowiedzi.
