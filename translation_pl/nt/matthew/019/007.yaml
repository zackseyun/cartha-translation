id: MAT.19.7
reference: Matthew 19:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: pl
  text: 'Mówią mu: „Dlaczego więc Mojżesz nakazał dać list rozwodowy i ją oddalić[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „rozwieść się z nią”. Grecki czasownik może znaczyć „odesłać, oddalić”, a w tym kontekście jest określeniem rozwodu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Mówią mu
  rationale: Zachowano grecki czas teraźniejszy narracyjny; taka forma jest naturalna również w podniosłej polskiej narracji biblijnej.
- source_word: Τί οὖν
  choice: Dlaczego więc
  rationale: W kontekście wyrażenie wprowadza zarzut wynikający z poprzedniej wypowiedzi Jezusa, dlatego oddano jego funkcję argumentacyjną.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Mojżesz nakazał
  rationale: Czasownik oznacza wydanie nakazu. Zachowano sposób przedstawienia sprawy przez rozmówców, bez uprzedzania korekty Jezusa w następnym wersecie.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: dać list rozwodowy
  rationale: To utrwalone, zrozumiałe określenie dokumentu prawnego poświadczającego rozwód, nawiązujące do Pwt 24,1.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: i ją oddalić
  rationale: Czasownik dosłownie wyraża odprawienie lub odesłanie, a w tym kontekście oznacza rozwód. „Oddalić” zachowuje obrazowość i prawną funkcję sformułowania.
theological_decisions:
- issue: Czy wypowiedź rozmówców dostosować do rozróżnienia między nakazem a zezwoleniem, które Jezus wprowadza w następnym wersecie
  choice: nakazał
  alternative: pozwolił
  rationale: Grecki tekst tego wersetu mówi wyraźnie o nakazie i przedstawia argument rozmówców. Zastąpienie go „pozwolił” przedwcześnie harmonizowałoby ich słowa z odpowiedzią Jezusa.
translation_notes:
  register: Współczesny, godny i zwięzły rejestr. Zachowano narracyjny czas teraźniejszy oryginału oraz brak niewyrażonego w grece zaimka „nam”.
