source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: pl
  text: Wtedy przyniesiono do niego dzieci, aby nałożył na nie ręce i się pomodlił. Uczniowie jednak chcieli je skarcić[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecki zaimek może odnosić się zarówno do dzieci, jak i do tych, którzy je przynieśli.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wyznaczającego kolejny moment narracji.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: przyniesiono do niego dzieci
  rationale: Konstrukcja bezosobowa naturalnie oddaje grecki aoryst strony biernej, nie wskazując osób, które przyniosły dzieci.
- source_word: ἵνα
  choice: aby
  rationale: Zachowuje celowy charakter zdania podrzędnego.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: położył na nich ręce
  rationale: Oddaje dosłownie liczbę mnogą „ręce” oraz idiom gestu nałożenia rąk, bez dopowiadania jego skutku.
- source_word: καὶ προσεύξηται
  choice: i się pomodlił
  rationale: Czasownik nie ma w tekście greckim wyrażonego dopełnienia „za nimi”, dlatego przekład go nie dodaje.
- source_word: οἱ δὲ μαθηταὶ
  choice: Uczniowie jednak
  rationale: „Jednak” naturalnie sygnalizuje łagodny kontrast wyrażony przez δέ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: zwrócili się do nich z naganą
  rationale: Peryfraza zachowuje moc czasownika oznaczającego zgromienie lub skarcenie, a zarazem dzięki „do nich” nie rozstrzyga niejednoznacznego odniesienia zaimka.
theological_decisions:
- issue: Odniesienie końcowego αὐτοῖς
  choice: do nich
  alternative: do dzieci / do tych, którzy je przynieśli
  rationale: Grecki zaimek może odnosić się zarówno do dzieci, jak i do osób, które je przyniosły. Polski zwrot zachowuje tę niejednoznaczność, a przypis ją objaśnia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Peryfrastyczne „zwrócili się do nich z naganą” pozwala uniknąć rozstrzygnięcia, które wprowadzałyby polskie zaimki biernikowe „ich” lub „je”.
