  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: pl
  text: 'Podeszli do niego faryzeusze i, wystawiając go na próbę, zapytali: „Czy wolno mężczyźnie rozwieść się ze swoją żoną z jakiegokolwiek powodu?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „z każdego powodu” lub „na każdej podstawie”. Greckie wyrażenie odzwierciedla szerokie pytanie prawne o dopuszczalne podstawy rozwodu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: podeszli
  rationale: Czasownik oznacza zbliżenie się lub podejście do kogoś; „podeszli” jest naturalne i zachowuje kierunkowy charakter czynności.
- source_word: πειράζοντες
  choice: wystawiając go na próbę
  rationale: πειράζω może znaczyć „próbować”, „wystawiać na próbę” lub „kusić”. To sformułowanie zachowuje sens badania intencji lub stanowiska Jezusa, nie zawężając go do nakłaniania do grzechu.
- source_word: λέγοντες
  choice: zapytali
  rationale: Dosłownie „mówiąc”, lecz następująca wypowiedź jest pytaniem; polskie „zapytali” naturalnie oddaje funkcję wypowiedzi, a imiesłów πειράζοντες pozostaje wyrażony osobno.
- source_word: ἔξεστιν
  choice: czy wolno
  rationale: W kontekście sporu prawnego oznacza to, co jest dozwolone. „Czy wolno” brzmi naturalnie po polsku i zachowuje prawny charakter pytania.
- source_word: ἀνθρώπῳ
  choice: mężczyźnie
  rationale: Rzeczownik może być ogólny, ale wzmianka o „jego żonie” konkretyzuje go jako mężczyznę będącego mężem.
- source_word: ἀπολῦσαι
  choice: rozwieść się z
  rationale: Choć podstawowym sensem jest „odprawić” lub „uwolnić”, w kontekście małżeńskim czasownik stanowi idiom oznaczający rozwód.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: z żoną
  rationale: γυνή w kontekście małżeństwa oznacza „żonę”; polska konstrukcja „rozwieść się z żoną” naturalnie zawiera relację wskazaną przez αὐτοῦ.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: z dowolnego powodu
  rationale: Wyrażenie dotyczy szerokiego zakresu możliwych podstaw rozwodu. „Z dowolnego powodu” jasno zachowuje tę szerokość i charakter pytania prawnego.
theological_decisions:
- issue: Oddanie pytania o dopuszczalne podstawy rozwodu bez narzucania późniejszego stanowiska wyznaniowego
  choice: Czy wolno mężczyźnie rozwieść się z żoną z dowolnego powodu?
  alternative: Czy mężczyzna może odprawić swoją żonę z każdego powodu?
  rationale: Przekład zachowuje formę prawnego wyzwania oraz szerokość pytania. Nie przesądza odpowiedzi Jezusa ani nie wprowadza późniejszych systematyzacji doktrynalnych.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Składnia jest naturalna dla zwykłego czytelnika, a zarazem zachowuje prawną wymowę pytania i nie dopowiada wprost wrogiego zamiaru ponad znaczenie πειράζοντες.
