  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: pl
  text: Tak więc nie są już dwojgiem, lecz jednym ciałem. Co zatem Bóg złączył, tego człowiek[a] niech nie rozdziela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Człowiek” ma tu znaczenie ogólne: żaden człowiek nie powinien rozdzielać tego, co Bóg złączył.'
    reason: Wyjaśnienie ogólnego zakresu rzeczownika ἄνθρωπος.
lexical_decisions:
- source_word: ὥστε
  choice: Tak więc
  rationale: Wprowadza skutek wcześniejszej wypowiedzi o dwojgu stających się jednym ciałem; wyrażenie zachowuje siłę wynikową i brzmi naturalnie po polsku.
- source_word: οὐκέτι εἰσὶν δύο
  choice: nie są już dwojgiem
  rationale: „Już nie” oddaje negację zmienionego stanu, a „dwojgiem” naturalnie odnosi się w polszczyźnie do pary osób i pozostaje w składniowym kontraście z „jednym ciałem”.
- source_word: σὰρξ μία
  choice: jednym ciałem
  rationale: Zachowuje utrwalone biblijne sformułowanie nawiązujące do opisu małżeństwa w Księdze Rodzaju, bez zawężania go do samej cielesności.
- source_word: ὃ οὖν
  choice: Co zatem … tego
  rationale: Konstrukcja korelacyjna „co… tego” jasno oddaje nijaki zaimek względny odnoszący się do dokonanego przez Boga złączenia, a „zatem” zachowuje wnioskowanie wyrażone przez οὖν.
- source_word: συνέζευξεν
  choice: złączył
  rationale: Oddaje dokonane połączenie dwojga w małżeństwie. Dosłowniejszy obraz wspólnego jarzma byłby w tym miejscu mniej naturalny.
- source_word: ἄνθρωπος
  choice: człowiek
  rationale: Zachowuje liczbę pojedynczą i ogólny, reprezentatywny sens greckiego rzeczownika; po polsku „człowiek” naturalnie oznacza tu każdą osobę.
- source_word: μὴ χωριζέτω
  choice: niech nie rozdziela
  rationale: Naturalna polska forma zakazu, zachowująca imperatywną siłę greckiego trybu rozkazującego i aspekt trwającego działania.
theological_decisions:
- issue: Ogólny zakres ἄνθρωπος w zakazie dotyczącym małżeństwa
  choice: „człowiek” w znaczeniu ogólnym
  alternative: „nikt” lub „żaden człowiek”
  rationale: Grecki rzeczownik występuje w liczbie pojedynczej i ma sens ogólny. „Człowiek” zachowuje formę źródła, a przypis wyjaśnia, że zakaz odnosi się do każdego człowieka.
- issue: Nawiązanie do Księgi Rodzaju w wyrażeniu σὰρξ μία
  choice: „jednym ciałem”
  alternative: „jedną istotą”
  rationale: Tradycyjne wyrażenie zachowuje międzytekstowe powiązanie i teologiczne napięcie obrazu „jednego ciała”, nie dopowiadając natury tej jedności.
- issue: Przedmiot zakazu wyrażony nijakim zaimkiem ὃ
  choice: „Co Bóg złączył, tego…”
  alternative: „Tych, których Bóg złączył…”
  rationale: Forma nijaka wskazuje na złączenie lub powstałą jedność, nie tylko na dwie osoby ujmowane oddzielnie. Konstrukcja „co… tego” zachowuje tę cechę źródła.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano biblijne wyrażenie „jednym ciałem”, natomiast zakaz oddano naturalną polską konstrukcją „niech nie rozdziela”.
