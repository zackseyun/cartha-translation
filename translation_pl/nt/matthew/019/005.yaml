  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: pl
  text: 'i powiedział: „Dlatego mężczyzna opuści ojca i matkę i złączy się[a] ze swoją żoną, i tych dwoje stanie się jednym ciałem”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „zostanie złączony ze swoją żoną” albo „przylgnie do swojej żony”. Grecki czasownik oznacza ścisłe związanie lub przywiązanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Dlatego
  rationale: Naturalny współczesny odpowiednik wyrażenia przyczynowo-wnioskującego; zachowuje związek z poprzedzającym uzasadnieniem.
- source_word: καταλείψει
  choice: opuści
  rationale: Oddaje czas przyszły i sens odejścia od ojca i matki bez archaicznego brzmienia.
- source_word: ἄνθρωπος
  choice: mężczyzna
  rationale: W cytacie dotyczącym małżeństwa rzeczownik odnosi się konkretnie do mężczyzny zestawionego z jego żoną, a nie ogólnie do człowieka.
- source_word: κολληθήσεται
  choice: złączy się
  rationale: Naturalnie oddaje ścisłe i trwałe związanie z żoną. Strona zwrotna brzmi po polsku idiomatycznie, a przypis zachowuje możliwe odcienie greckiego czasownika.
- source_word: γυναικὶ αὐτοῦ
  choice: ze swoją żoną
  rationale: W kontekście małżeńskim γυνή oznacza żonę; zaimek zwrotny „swoją” jest naturalny przy podmiocie „mężczyzna”.
- source_word: οἱ δύο
  choice: tych dwoje
  rationale: Zachowuje wyraźne wskazanie na dwie osoby i brzmi naturalnie w odniesieniu do mężczyzny i kobiety.
- source_word: εἰς σάρκα μίαν
  choice: jednym ciałem
  rationale: Utrwalone i semantycznie precyzyjne oddanie biblijnego obrazu jedności małżeńskiej; konstrukcja „stanie się” wyraża rezultat zawarty w ἔσονται εἰς.
theological_decisions:
- issue: Rodzajowo określony język cytatu o małżeństwie
  choice: mężczyzna… swoją żoną
  alternative: człowiek… współmałżonkiem
  rationale: Grecki tekst przedstawia konkretnie mężczyznę i jego żonę. Zachowanie tej formy nie uogólnia wypowiedzi ponad świadectwo tekstu.
- issue: Sposób oddania obrazu jednego ciała
  choice: tych dwoje stanie się jednym ciałem
  alternative: tych dwoje będzie jednym ciałem
  rationale: „Stanie się” oddaje kierunek i rezultat konstrukcji ἔσονται εἰς, nie wyjaśniając dodatkowo natury tej jedności.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano ciągłość składniową z poprzedzającym pytaniem Jezusa, dlatego po zamknięciu cytatu pozostaje znak zapytania. Marker przypisu umieszczono bezpośrednio przy wyrażeniu, którego dotyczy.
