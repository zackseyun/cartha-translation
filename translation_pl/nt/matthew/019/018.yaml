  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: pl
  text: 'Mówi mu: „Które?”. Jezus powiedział: „Te przykazania: Nie popełnisz morderstwa, nie dopuścisz się cudzołóstwa, nie będziesz kradł ani składał fałszywego świadectwa”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Które?
  rationale: Naturalny polski odpowiednik pytania o to, które przykazania Jezus ma na myśli.
- source_word: Τὸ
  choice: 'Te:'
  rationale: Rodzajnik pełni tu funkcję wprowadzającą wyliczenie; polskie „Te:” zachowuje tę strukturę bez niezręcznego dosłownego „To:”.
- source_word: Οὐ φονεύσεις
  choice: Nie popełnisz morderstwa
  rationale: φονεύω oznacza bezprawne zabicie człowieka, dlatego „morderstwo” jest precyzyjniejsze niż ogólne „zabicie”.
- source_word: Οὐ μοιχεύσεις
  choice: nie dopuścisz się cudzołóstwa
  rationale: Oddaje zakaz μοιχεύω w naturalnym, godnym współczesnym języku.
- source_word: Οὐ κλέψεις
  choice: nie będziesz kradł
  rationale: Bezpośredni i idiomatyczny odpowiednik zakazu kradzieży.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: ani składał fałszywego świadectwa
  rationale: Zachowuje sądowo-świadkowy sens czasownika, a „ani” naturalnie zamyka polskie wyliczenie zakazów.
theological_decisions:
- issue: Zakres przykazania Οὐ φονεύσεις
  choice: Nie popełnisz morderstwa
  alternative: Nie zabijaj
  rationale: Wybrano sformułowanie wskazujące na bezprawne pozbawienie życia, nie rozstrzygając dalszych kwestii etycznych dotyczących wszelkiego zabijania.
- issue: Funkcja Τὸ przed wyliczeniem
  choice: 'Te:'
  alternative: Pominięcie tego elementu
  rationale: Zachowano widoczny w tekście greckim sygnał wprowadzający konkretne przykazania, zgodnie z audytowaną warstwą konsultacyjną.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zwięzła narracja oraz rytmiczne wyliczenie nawiązują do brzmienia przykazań, bez archaizacji.
