  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: pl
  text: Kiedy jednak młody człowiek usłyszał te słowa[a], odszedł zasmucony[b], miał bowiem wiele dóbr[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „to słowo”, czyli poprzednią wypowiedź Jezusa.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „odszedł ze smutkiem”. Grecki imiesłów opisuje stan, w jakim odchodził.'
    reason: lexical_alternative
  - marker: c
    text: 'Można też oddać: „wiele posiadłości” lub „wiele rzeczy, które posiadał”. Greckie wyrażenie oznacza wiele dóbr lub mienia; podkreśla ich liczbę, nie ich wielkość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: kiedy ... usłyszał
  rationale: Aorystyczny imiesłów oddano naturalnym polskim zdaniem czasowym, zachowując kolejność wydarzeń.
- source_word: δὲ
  choice: jednak
  rationale: Partykuła zaznacza łagodny kontrast między wezwaniem Jezusa a reakcją młodego człowieka.
- source_word: νεανίσκος
  choice: młody człowiek
  rationale: Oddaje znaczenie rzeczownika bez dopowiadania, że był dostojnikiem, co pochodzi z relacji Łukasza, a nie z tego wersetu Mateusza.
- source_word: τὸν λόγον
  choice: te słowa
  rationale: W kontekście chodzi o wypowiedź Jezusa bezpośrednio poprzedzającą ten werset. Polska liczba mnoga brzmi tu naturalnie, choć grecki ma liczbę pojedynczą.
- source_word: ἀπῆλθεν
  choice: odszedł
  rationale: Zwięzły i naturalny odpowiednik zwykłego czasownika oznaczającego odejście.
- source_word: λυπούμενος
  choice: zasmucony
  rationale: Imiesłów opisuje stan towarzyszący jego odejściu; forma ta zachowuje związek smutku z czynnością odchodzenia.
- source_word: ἦν γὰρ ἔχων
  choice: miał bowiem
  rationale: Peryfrastyczną konstrukcję wyrażającą trwały stan posiadania oddano idiomatycznie po polsku.
- source_word: κτήματα πολλά
  choice: wiele posiadłości
  rationale: κτήματα oznacza dobra, majątek lub posiadłości, a πολλά podkreśla ich mnogość. „Posiadłości” dobrze współgrają z wcześniejszą wzmianką o sprzedaży tego, co człowiek posiada.
theological_decisions:
- issue: Czy dodać określenie „dostojnik” na podstawie relacji równoległej
  choice: młody człowiek
  alternative: młody dostojnik
  rationale: Tekst Mateusza określa go wyłącznie jako młodego człowieka. Dodatek harmonizowałby ten werset z Łukaszem zamiast tłumaczyć go bezpośrednio.
translation_notes:
  register: Współczesny, godny i narracyjnie płynny polski. Składnia „miał bowiem” zachowuje wyjaśniający charakter γάρ, a słowo „jednak” sygnalizuje łagodny zwrot narracji. Wszystkie przypisy mają odpowiadające im znaczniki w tekście głównym.
