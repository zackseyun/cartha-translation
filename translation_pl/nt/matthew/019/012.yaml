  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: pl
  text: Są bowiem eunuchowie, którzy urodzili się tacy już z łona matki; są też eunuchowie, których ludzie uczynili eunuchami; i są eunuchowie, którzy sami siebie uczynili eunuchami[a] ze względu na królestwo niebios. Kto potrafi to przyjąć, niech przyjmie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „wykastrowali samych siebie”; wielu rozumie te słowa przenośnie jako wybór bezżeństwa ze względu na królestwo niebios.'
    reason: alternative_reading
  - marker: b
    text: 'Dosłowniej: „Kto może to pomieścić, niech pomieści”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: eunuchowie
  rationale: Zachowuje zwykłe znaczenie greckiego rzeczownika i jego trzykrotne powtórzenie, nie narzucając interpretacyjnej parafrazy „bezżenni”.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: urodzili się tacy już z łona matki
  rationale: Oddaje obrazowy grecki zwrot o stanie istniejącym od urodzenia, a zarazem brzmi zrozumiale we współczesnej polszczyźnie.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: których uczynili eunuchami ludzie
  rationale: Zachowuje związek słowotwórczy z rzeczownikiem „eunuchowie” oraz sprawców wskazanych przez greckie ὑπὸ τῶν ἀνθρώπων; nie zawęża tekstu do samego zabiegu fizycznego.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: sami uczynili się eunuchami
  rationale: Zachowuje celowo mocne i niejednoznaczne brzmienie źródła, bez rozstrzygania w tekście głównym, czy wypowiedź jest dosłowna, hiperboliczna, czy metaforyczna.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: ze względu na królestwo niebios
  rationale: Naturalnie oddaje motyw lub cel wyrażony przez διά z biernikiem i zachowuje Mateuszowe sformułowanie „królestwo niebios”.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Kto potrafi to przyjąć, niech przyjmie
  rationale: „Przyjąć” naturalnie oddaje idiomatyczne znaczenie χωρέω jako zaakceptowania wymagającej nauki, a tryb rozkazujący pozostaje wyraźny.
theological_decisions:
- issue: Czy εὐνούχισαν ἑαυτοὺς rozumieć dosłownie, czy metaforycznie
  choice: W tekście głównym zachować sformułowanie „sami uczynili się eunuchami”.
  alternative: „wykastrowali samych siebie” albo interpretacyjnie „wybrali bezżeństwo”
  rationale: Sam werset nie rozstrzyga jednoznacznie, czy chodzi o czyn fizyczny, hiperbolę, czy dobrowolną rezygnację z małżeństwa dla królestwa. Przekład zachowuje to napięcie, a przypis podaje główne możliwości interpretacyjne.
- issue: Znaczenie końcowego χωρεῖν
  choice: „przyjąć”
  alternative: „pomieścić” lub „zrobić na to miejsce”
  rationale: „Przyjąć” jest czytelne i idiomatyczne we współczesnej polszczyźnie, nie usuwając sensu świadomego zaakceptowania trudnej wypowiedzi.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Powtórzenie słowa „eunuchowie” odzwierciedla retoryczną konstrukcję greckiego tekstu. Markery przypisów umieszczono przy wyrażeniach, których rzeczywiście dotyczą.
