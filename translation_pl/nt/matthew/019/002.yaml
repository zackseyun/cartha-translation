  text: And large crowds followed him, and he healed them there.
translation:
  language: pl
  text: I poszły za Nim liczne tłumy, a On ich tam uzdrowił.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: poszły za
  rationale: Aoryst od ἀκολουθέω opisuje w tej narracji dosłowne podążanie za Jezusem. Polskie „poszły za” brzmi naturalnie i nie narzuca dodatkowego sensu uczniostwa.
- source_word: αὐτῷ
  choice: Nim
  rationale: Zaimek wskazuje na Jezusa jako osobę, za którą podążały tłumy. Po polsku konstrukcja „iść za kimś” wymaga narzędnika.
- source_word: ὄχλοι πολλοί
  choice: liczne tłumy
  rationale: Wyrażenie dosłownie oznacza „wiele tłumów”. „Liczne tłumy” zachowuje wielość grup ludzi i jest naturalnym odpowiednikiem w podniosłym, lecz współczesnym rejestrze.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: W kontekście działalności Jezusa θεραπεύω oznacza przywrócenie zdrowia. „Uzdrowił” jest zwyczajnym i trafnym polskim odpowiednikiem.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek w bierniku liczby mnogiej odnosi się do ludzi tworzących tłumy.
- source_word: ἐκεῖ
  choice: tam
  rationale: Prosty przysłówek miejsca został oddany bez rozwijania go do „w tym miejscu”.
- source_word: καὶ ... καὶ
  choice: I ... a On
  rationale: Pierwsze καί zachowano jako narracyjne „I”. Drugie oddano przez „a On”, co naturalnie łączy w języku polskim zmianę podmiotu, nie wprowadzając przeciwstawienia ani zależności przyczynowej.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i przystępny styl narracyjny. Wielka litera w zaimku „Nim” oraz dodanym „On” jest zgodna z polską konwencją odnoszenia zaimków do Jezusa; nie zmienia treści greckiego tekstu.
