  rationale: Removed the unsupported supplied object „ludzi” and normalized capitalization. The revision keeps the rhetorical question, preserves the two Greek creation verbs through „stworzył” and „uczynił,” and maintains the Genesis-shaped pair „mężczyzną i kobietą.”
