  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: pl
  text: 'On odpowiedział: „Czy nie czytaliście, że ten, który od początku stworzył, uczynił ich mężczyzną i kobietą?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: On odpowiedział
  rationale: Imiesłów z czasownikiem osobowym tworzy typową konstrukcję grecką; naturalny polski oddaje ją jednym czasownikiem bez utraty treści.
- source_word: Οὐκ ἀνέγνωτε
  choice: Czy nie czytaliście
  rationale: Pytanie odwołuje się do znajomości Pisma przez rozmówców; polski czas przeszły brzmi naturalnie i zachowuje retoryczny charakter wypowiedzi.
- source_word: ὁ κτίσας
  choice: Ten, który ... stworzył
  rationale: Oddaje rzeczownikowo użyty imiesłów bez przekształcania go w bardziej interpretacyjny tytuł „Stwórca”.
- source_word: ἀπ’ ἀρχῆς
  choice: od początku
  rationale: Zachowuje brzmienie nawiązujące do opisu stworzenia w Księdze Rodzaju oraz możliwie bliski związek ze stworzeniem.
- source_word: ἄρσεν καὶ θῆλυ
  choice: mężczyzną i kobietą
  rationale: W tym odniesieniu do ludzi są to naturalne i godne polskie odpowiedniki pary płciowej z Rdz 1,27; forma narzędnika wynika z polskiej składni czasownika „uczynić”.
- source_word: ἐποίησεν αὐτούς
  choice: uczynił ich
  rationale: Pozwala zachować rozróżnienie między κτίζω („stworzyć”) a ποιέω („uczynić”) obecne w tekście greckim.
- source_word: αὐτούς (po ὁ κτίσας)
  choice: ludzi
  rationale: Grecki zaimek ma domyślny desygnat wynikający z cytowanego opisu stworzenia. Uzupełnienie „ludzi” zapobiega w polszczyźnie niezręcznemu zdaniu „Ten, który od początku stworzył, uczynił ich”, nie zawężając odniesienia do jednej osoby.
theological_decisions:
- issue: Oddanie pary stworzeniowej w nawiązaniu do Rdz 1,27
  choice: mężczyzną i kobietą
  alternative: osobnikami płci męskiej i żeńskiej; jako mężczyznę i kobietę
  rationale: Sformułowanie zachowuje dwoistość płciową greckiego ἄρσεν καὶ θῆλυ i bezpośrednie nawiązanie do stworzenia, a zarazem nie dopowiada wniosków doktrynalnych wykraczających poza werset.
- issue: Zakres wyrażenia ἀπ’ ἀρχῆς
  choice: 'Umieszczenie przy „stworzył”: „od początku stworzył ludzi”'
  alternative: „że od początku Ten, który stworzył ludzi...”
  rationale: Szyk grecki najbliżej wiąże wyrażenie z imiesłowem κτίσας, choć możliwe jest szersze odczytanie czasowe. Polski szyk zachowuje to najbliższe powiązanie bez rozbudowanej interpretacji.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Wielka litera w „Ten” sygnalizuje odniesienie do Boga, nie zastępując greckiej konstrukcji tytułem. Zachowano zwięzłość pytania retorycznego i rozróżnienie czasowników „stworzył” oraz „uczynił”.
