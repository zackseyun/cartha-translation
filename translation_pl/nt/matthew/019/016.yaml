id: MAT.19.16
reference: Matthew 19:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: pl
  text: 'A oto ktoś podszedł do niego i powiedział: „Nauczycielu, co dobrego[a] mam uczynić, aby mieć życie wieczne?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „jaki dobry czyn mam spełnić…?”. Greckie τί ἀγαθόν może znaczyć „co dobrego” albo — w połączeniu z czasownikiem „uczynić” — „jaki dobry czyn”.'
    reason: Alternatywa leksykalna zachowująca możliwy konkretny sens greckiego wyrażenia.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: A oto
  rationale: Zachowuje zarówno łączącą funkcję καί, jak i zwracającą uwagę, ożywiającą narrację siłę ἰδού, a przy tym brzmi naturalnie i dostojnie po polsku.
- source_word: εἷς
  choice: ktoś
  rationale: Greckie εἷς dosłownie znaczy „jeden”, lecz w tym użyciu wskazuje na bliżej nieokreśloną osobę. „Ktoś” jest naturalnym polskim odpowiednikiem i nie wprowadza przedwcześnie informacji, że chodzi o mężczyznę, młodzieńca lub bogacza.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: podszedł do niego i powiedział
  rationale: Polska konstrukcja współrzędna naturalnie oddaje uprzedniość czynności wyrażonej aorystycznym imiesłowem προσελθών wobec εἶπεν, bez niezręcznego „podszedłszy”. Czasownik „powiedział” zachowuje leksykalne znaczenie εἶπεν.
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Bezpośredni i współczesny odpowiednik tytułu oznaczającego nauczyciela lub instruktora.
- source_word: τί ἀγαθὸν
  choice: co dobrego
  rationale: Zachowuje otwartość nijakiej konstrukcji τί ἀγαθόν, która może oznaczać „co dobrego” lub w połączeniu z ποιήσω konkretny „dobry czyn”.
- source_word: ποιήσω
  choice: mam uczynić
  rationale: Naturalnie oddaje pytanie deliberatywne wyrażone aorystycznym trybem łączącym. „Uczynić” dobrze łączy się z „co dobrego” i zachowuje praktyczną siłę pytania.
- source_word: ἵνα σχῶ
  choice: aby mieć
  rationale: „Aby” wyraża cel wprowadzany przez ἵνα, a „mieć” jest bezpośrednim odpowiednikiem σχῶ od ἔχω, bez interpretacyjnego dopowiedzenia „uzyskać” lub „zdobyć”.
- source_word: ζωὴν αἰώνιον
  choice: życie wieczne
  rationale: Utrwalony, zrozumiały i trafny odpowiednik tego wyrażenia w danym kontekście.
theological_decisions:
- issue: Określenie osoby zwracającej się do Jezusa
  choice: ktoś
  alternative: jeden; pewien człowiek; bogaty młodzieniec
  rationale: Werset używa tylko εἷς i nie określa jeszcze tej osoby jako mężczyzny, młodzieńca ani bogacza. Przekład nie przenosi do tego miejsca szczegółów z dalszego kontekstu lub tekstów paralelnych.
- issue: Związek działania z życiem wiecznym w pytaniu rozmówcy
  choice: co dobrego mam uczynić, aby mieć życie wieczne?
  alternative: jaki dobry uczynek mam spełnić, żeby zdobyć życie wieczne?
  rationale: Przekład zachowuje ukierunkowane na działanie pytanie rozmówcy, lecz nie rozstrzyga ponad tekst kwestii zasługi, uczynków ani sposobu otrzymania zbawienia. „Mieć” nie wzmacnia wypowiedzi do „zasłużyć” czy „zdobyć”.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym tonie. „A oto” zachowuje narracyjną wyrazistość oryginału bez nadmiernej archaizacji. Zastosowano małą literę w zaimku „niego”, zgodnie z neutralną praktyką przekładową i bez narzucania konfesyjnej konwencji graficznej.
