  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: pl
  text: Czcij swojego ojca i swoją matkę, i miłuj swojego bliźniego jak siebie samego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bardziej formalnie: „Czcij swojego ojca i swoją matkę, i będziesz miłował swojego bliźniego jak siebie samego”.'
    reason: Grecki tekst łączy tryb rozkazujący z formą czasu przyszłego używaną jako nakaz.
lexical_decisions:
- source_word: Τίμα
  choice: Czcij
  rationale: Czasownik τιμάω w tym kontekście nawiązuje do brzmienia przykazania i oznacza okazywanie należnej czci, nie tylko wewnętrzny szacunek. „Czcij” zachowuje jego etyczną wagę i utrwalony polski język Dekalogu.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: swojego ojca i swoją matkę
  rationale: Choć greka używa rodzajników bez wyrażonego zaimka dzierżawczego, bezpośredni zwrot oraz przywołane przykazanie uzasadniają naturalne po polsku „swojego… swoją…”.
- source_word: Ἀγαπήσεις
  choice: miłuj
  rationale: Grecka forma czasu przyszłego pełni w cytowanym języku Prawa funkcję nakazu. Polski tryb rozkazujący naturalnie oddaje siłę polecenia i zachowuje równoległość z „Czcij”; formalnie bliższą postać podano w przypisie.
- source_word: τὸν πλησίον σου
  choice: swojego bliźniego
  rationale: W kontekście etycznym πλησίον oznacza drugiego człowieka pozostającego w sferze relacji mówiącego. „Bliźni” jest precyzyjnym i utrwalonym odpowiednikiem w Kpł 19:18 oraz w nauczaniu Jezusa.
- source_word: ὡς σεαυτόν
  choice: jak siebie samego
  rationale: To zwięzły, naturalny odpowiednik porównania, który nie dopowiada niewyrażonego wprost czasownika ani nie zawęża sensu.
theological_decisions:
- issue: Oddanie form nakazu w przytoczeniu przykazań
  choice: 'Oba człony oddano polskim trybem rozkazującym: „Czcij… i miłuj…”'
  alternative: „Czcij… i będziesz miłował…”
  rationale: Greka łączy tryb rozkazujący Τίμα z formą przyszłą Ἀγαπήσεις, typową dla języka przykazań. Dwa polskie rozkaźniki czytelnie zachowują nakazowy charakter wyliczenia, natomiast formalną różnicę form źródłowych zachowano w przypisie.
translation_notes:
  register: Współczesna, godna i powszechnie zrozumiała polszczyzna. Zachowano utrwalone biblijne czasowniki „czcić” i „miłować”, unikając zarówno archaicznej składni, jak i osłabiającego sens parafrazowania.
