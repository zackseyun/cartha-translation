  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: pl
  text: 'Jego uczniowie powiedzieli mu: „Jeśli tak przedstawia się sprawa mężczyzny z żoną[a], nie opłaca się żenić się”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Jeśli taka jest sytuacja mężczyzny z żoną”. Greckie wyrażenie jest zwarte, a słowo αἰτία może tu oznaczać „sprawę”, „sytuację” lub „położenie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: powiedzieli mu
  rationale: Grecki czas teraźniejszy pełni tu funkcję narracyjnego czasu historycznego; polski czas przeszły brzmi naturalnie w opowiadaniu.
- source_word: μαθηταί
  choice: uczniowie
  rationale: To utrwalony i trafny odpowiednik ewangelicznego określenia uczniów Jezusa, zachowujący aspekt uczenia się.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Jeśli tak przedstawia się sprawa
  rationale: Oddaje warunkowy i podsumowujący charakter wypowiedzi, a αἰτία rozumie jako sprawę lub sytuację, nie jako przyczynę w ścisłym sensie.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: mężczyzny z żoną
  rationale: Zachowuje rodzaj męski ἀνθρώπου oraz małżeńskie znaczenie γυναικός; polskie „żona” naturalnie wyraża relację omawianą w kontekście.
- source_word: οὐ συμφέρει
  choice: nie opłaca się
  rationale: Naturalny współczesny polski zwrot oznaczający, że coś nie przynosi korzyści lub nie jest korzystne; nie dodaje normatywnego sensu „nie należy”.
- source_word: γαμῆσαι
  choice: żenić
  rationale: Wypowiedź jest sformułowana z perspektywy mężczyzny, dlatego „żenić się” precyzyjniej zachowuje kontekst niż neutralne „zawierać małżeństwo”.
theological_decisions:
- issue: Rodzajowe sformułowanie ἀνθρώπου ... γυναικός
  choice: mężczyzny z żoną
  alternative: człowieka z kobietą / osoby ze współmałżonkiem
  rationale: Bezpośredni kontekst dotyczy mężczyzny i jego żony. Zachowanie tej asymetrii nie neutralizuje płci wskazanej przez tekst źródłowy.
- issue: Pragmatyczny sens οὐ συμφέρει
  choice: nie opłaca się żenić
  alternative: nie warto się żenić / nie jest korzystne się żenić
  rationale: Wybrany zwrot zachowuje ocenę korzyści wyrażoną przez μαθηταί, nie przekształcając jej w nakaz ani w ogólną naukę przeciw małżeństwu.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. „Nie opłaca się” jest idiomatyczne i zrozumiałe, a zarazem zachowuje sens korzyści zawarty w συμφέρει. Marker przypisu umieszczono przy niejednoznacznym zwartym wyrażeniu dotyczącym sytuacji mężczyzny z żoną.
