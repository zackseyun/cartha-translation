id: MAT.19.23
reference: Matthew 19:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: pl
  text: 'Wtedy Jezus powiedział swoim uczniom: „Zaprawdę[a] mówię wam: bogaty z trudem wejdzie do królestwa niebios”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Amen”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Wtedy
  rationale: Oddaje przejście i postęp narracji w naturalnej współczesnej polszczyźnie.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: swoim uczniom
  rationale: Zachowuje wyraźny zaimek αὐτοῦ, a zarazem brzmi naturalnie po polsku.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Zachowuje uroczysty i autorytatywny charakter formuły Jezusa; przypis wskazuje dosłowne brzmienie pierwszego słowa.
- source_word: πλούσιος
  choice: bogaty
  rationale: Rzeczownikowe użycie przymiotnika w rodzaju męskim liczby pojedynczej; zwięzły polski odpowiednik pozwala zachować reprezentatywny, jednostkowy charakter wypowiedzi.
- source_word: δυσκόλως
  choice: z trudem
  rationale: Wiernie oddaje sposób wejścia, nie wzmacniając samodzielnie wypowiedzi do znaczenia niemal całkowitej niemożliwości.
- source_word: εἰσελεύσεται
  choice: wejdzie
  rationale: Naturalny polski odpowiednik przyszłej formy εἰσέρχομαι.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: królestwa niebios
  rationale: Zachowuje Mateuszowe określenie oraz liczbę mnogą οὐρανῶν, pozostając zrozumiałym i godnym stylistycznie wyrażeniem polskim.
theological_decisions:
- issue: Rzeczownikowe użycie πλούσιος w rodzaju męskim
  choice: bogaty
  alternative: człowiek bogaty / osoba bogata
  rationale: Grecki wyraz ma formę męską liczby pojedynczej. Polski rzeczownikowo użyty przymiotnik zachowuje tę formę bez dodawania niewystępującego w tekście rzeczownika.
- issue: Znaczenie δυσκόλως
  choice: z trudem
  alternative: zaledwie / bardzo trudno
  rationale: „Z trudem” zachowuje napięcie wypowiedzi i nie przesądza jeszcze o niemożliwości, którą Jezus dobitniej rozwija w następnym wersecie.
- issue: Formuła Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  alternative: Amen, mówię wam
  rationale: „Zaprawdę” naturalnie przekazuje uroczyste potwierdzenie prawdziwości słów Jezusa, a przypis zachowuje informację o dosłownym brzmieniu greckiego zapożyczenia.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Składnia pozostaje prosta i bliska greckiej, bez archaizowania. Wyrażenie „królestwo niebios” zachowuje charakterystyczną terminologię Mateusza.
