source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: pl
  text: 'Jezus zaś spojrzał na nich i powiedział im: „U ludzi jest to niemożliwe, ale u Boga wszystko jest możliwe”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: spojrzał na nich
  rationale: Imiesłów aorystu wskazuje na skierowanie wzroku ku uczniom. Polski czasownik osobowy naturalnie oddaje tę uprzednią czynność bez nadmiernego wzmacniania jej jako wpatrywania się.
- source_word: δὲ
  choice: zaś
  rationale: δέ sygnalizuje łagodne przeciwstawienie lub ciąg dalszy. „Zaś” zachowuje kontrast, a zarazem odpowiada godnemu rejestrowi narracji.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział
  rationale: Adresaci są już wyraźnie wskazani przez „na nich”, a w języku polskim ponowne „im” brzmiałoby ciężko. Sens celownika αὐτοῖς pozostaje jasny z kontekstu zdania.
- source_word: παρὰ ἀνθρώποις
  choice: u ludzi
  rationale: παρά z celownikiem określa sferę lub to, co jest możliwe po stronie człowieka. „U ludzi” jest naturalnym polskim odpowiednikiem i jednoznacznie obejmuje całą ludzkość.
- source_word: τοῦτο
  choice: to
  rationale: Zaimek wskazuje na omawianą właśnie możliwość zbawienia; proste „to” zachowuje odniesienie bez dopowiadania interpretacji.
- source_word: ἀδύνατόν ἐστιν
  choice: jest niemożliwe
  rationale: Bezpośredni i idiomatyczny odpowiednik greckiego orzecznika z łącznikiem.
- source_word: παρὰ δὲ θεῷ
  choice: ale u Boga
  rationale: Powtórzenie konstrukcji „u...” zachowuje retoryczną równowagę obu członów, a „ale” wyraźnie oddaje kontrast δέ.
- source_word: πάντα δυνατά
  choice: wszystko jest możliwe
  rationale: Grecka liczba mnoga rodzaju nijakiego πάντα ma w polszczyźnie naturalny zbiorowy odpowiednik „wszystko”; przekład zachowuje sentencjonalną siłę wypowiedzi.
theological_decisions:
- issue: Zakres znaczeniowy ἀνθρώποις w ogólnym stwierdzeniu
  choice: u ludzi
  alternative: dla człowieka / po ludzku
  rationale: ἄνθρωποι oznacza tutaj ludzi ogólnie, nie wyłącznie mężczyzn. „U ludzi” zachowuje powszechny zakres i kontrast między ludzką niemożnością a Bożą możliwością, nie narzucając dodatkowego objaśnienia doktrynalnego.
- issue: Zakres πάντα δυνατά
  choice: wszystko jest możliwe
  alternative: możliwe są wszystkie rzeczy
  rationale: Zachowano szerokie, maksymalne brzmienie greki, pozostawiając jego właściwe rozumienie w bezpośrednim kontekście rozmowy o zbawieniu, bez dopisywania ograniczenia do tekstu głównego.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, zwięzłym charakterze. Szyk z „zaś” lekko podnosi rejestr, lecz pozostaje czytelny. Paralelizm „u ludzi... u Boga” odtwarza strukturę greckiego zdania.
