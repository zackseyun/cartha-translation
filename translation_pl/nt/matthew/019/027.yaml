  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: pl
  text: 'Wtedy Piotr odpowiedział mu: „Oto my zostawiliśmy wszystko i poszliśmy za tobą. Co więc nam przypadnie?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: odezwał się
  rationale: Grecka formuła dosłownie łączy „odpowiedziawszy” i „powiedział”, lecz w tym kontekście naturalne polskie „odezwał się” zachowuje funkcję reakcji Piotra bez niezręcznego pleonazmu.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Zachowuje emfatyczne zwrócenie uwagi i ma godny, nadal zrozumiały rejestr.
- source_word: ἀφήκαμεν πάντα
  choice: zostawiliśmy wszystko
  rationale: Oddaje dokonane porzucenie lub pozostawienie wszystkiego bez dopowiadania, co dokładnie obejmowało.
- source_word: ἠκολουθήσαμέν σοι
  choice: poszliśmy za tobą
  rationale: Naturalny polski odpowiednik idiomu oznaczającego zarówno fizyczne pójście za Jezusem, jak i zostanie jego uczniem; nie zawęża tej wieloznaczności.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Co więc przypadnie nam?
  rationale: Oddaje eliptyczne pytanie o to, co będzie należało do uczniów lub co otrzymają, bez dodawania w tekście słowa „nagroda”.
theological_decisions:
- issue: Czy dopowiedzieć, że Piotr pyta o nagrodę?
  choice: 'Pozostawić pytanie eliptyczne: „Co więc przypadnie nam?”'
  alternative: „Co więc za to otrzymamy?”
  rationale: Grecki tekst nie zawiera wyrażeń „za to” ani „nagroda”. Wybrana forma zachowuje napięcie i otwartość pytania, a zarazem jest naturalna po polsku.
translation_notes:
  register: Współczesny, godny i komunikatywny polski. Zaimek odnoszący się do Jezusa zapisano małą literą zgodnie ze standardowym współczesnym zwyczajem przekładowym; wypowiedź zachowuje bezpośredniość i emfatyczny ton Piotra.
