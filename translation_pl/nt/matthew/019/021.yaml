  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: pl
  text: 'Jezus powiedział mu: „Jeśli chcesz być doskonały[a], idź, sprzedaj to, co posiadasz, i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź i chodź za mną”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może także wskazywać na pełnię lub dojrzałość.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jezus powiedział mu
  rationale: Naturalny polski szyk i zwykły odpowiednik narracyjnego czasownika mówienia, bez dopowiadania tonu wypowiedzi.
- source_word: τέλειος
  choice: doskonały
  rationale: Najbliższy i utrwalony odpowiednik w tym kontekście; może oznaczać także kogoś pełnego, dojrzałego lub całkowicie oddanego, dlatego zakres znaczeniowy zachowano w przypisie.
- source_word: ὕπαγε
  choice: idź
  rationale: Prosty, idiomatyczny odpowiednik rozkaźnika oznaczającego odejście i podjęcie wskazanego działania.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: sprzedaj to, co posiadasz
  rationale: Wyrażenie obejmuje posiadany majątek; polska konstrukcja jest naturalna i nie zawęża go do przedmiotów osobistych.
- source_word: δὸς πτωχοῖς
  choice: rozdaj ubogim
  rationale: Czasownik „rozdaj” naturalnie wskazuje na przekazanie uzyskanych dóbr wielu potrzebującym; dopełnienie nie jest w grece wyrażone, lecz wynika bezpośrednio z poprzedniego nakazu sprzedaży.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: będziesz miał skarb w niebie
  rationale: Oddaje przyszły skutek w naturalnej polszczyźnie; liczba pojedyncza „w niebie” jest idiomatycznym odpowiednikiem greckiej liczby mnogiej.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Potem przyjdź i chodź za mną
  rationale: „Przyjdź” zachowuje wezwanie δεῦρο, a „chodź za mną” oddaje ciągły aspekt ἀκολούθει oraz utrwalony język uczniostwa. „Potem” jasno wyraża kolejność wynikającą z szeregu nakazów.
theological_decisions:
- issue: Znaczenie τέλειος w odniesieniu do uczniostwa
  choice: doskonały
  alternative: pełny; dojrzały
  rationale: „Doskonały” najwierniej zachowuje mocne i tradycyjne brzmienie wypowiedzi, nie rozstrzygając, czy chodzi o bezgrzeszną perfekcję, pełnię oddania, czy dojrzałość. Możliwy zakres semantyczny podano w przypisie, aby nie narzucać doktrynalnej interpretacji.
- issue: Charakter polecenia dotyczącego majątku
  choice: Zachowano bezpośrednie nakazy w drugiej osobie liczby pojedynczej
  alternative: Uogólnienie ich jako powszechnej zasady dla wszystkich uczniów
  rationale: Grecki tekst kieruje te słowa bezpośrednio do rozmówcy. Przekład nie przesądza, jak należy zastosować je do wszystkich wierzących.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano krótkie, stanowcze rozkaźniki oraz tradycyjne ewangeliczne wyrażenie „chodź za mną”. Marker [a] występuje bezpośrednio po słowie, którego dotyczy.
