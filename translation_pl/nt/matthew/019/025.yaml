  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: pl
  text: 'Gdy uczniowie to usłyszeli, bardzo się zdumieli i powiedzieli: „Któż więc może być zbawiony?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Gdy […] to usłyszeli
  rationale: Aorystowy imiesłów wyraża okoliczność czasową poprzedzającą główną reakcję. Polski podrzędnik czasowy brzmi naturalnie; „to” odsyła do wcześniejszych słów Jezusa.
- source_word: δὲ
  choice: '[łącznik niewyrażony osobno]'
  rationale: δέ sygnalizuje ciąg dalszy lub lekki kontrast, który w naturalnej polszczyźnie wystarczająco oddaje rozpoczęcie zdania od „Gdy”.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Standardowe, naturalne określenie uczniów Jezusa w narracji ewangelicznej.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: bardzo się zdumieli
  rationale: „Zdumieli się” oddaje silne zaskoczenie, a „bardzo” zachowuje intensyfikującą funkcję σφόδρα. Polski aspekt dokonany naturalnie ujmuje zaistniałą reakcję, choć grecki imperfectum przedstawia ją jako trwającą.
- source_word: λέγοντες
  choice: i mówili
  rationale: Imiesłów towarzyszącej wypowiedzi naturalnie oddano czasownikiem osobowym. Imperfektywne „mówili” harmonizuje z greckim imiesłowem czasu teraźniejszego.
- source_word: Τίς ἄρα
  choice: Któż więc
  rationale: „Któż” oddaje pytanie nacechowane zdumieniem, a „więc” zachowuje wnioskowy charakter ἄρα bez nadmiernego objaśniania.
- source_word: δύναται σωθῆναι
  choice: może być zbawiony
  rationale: Zachowuje modalność możliwości oraz bierną formę σωθῆναι, nie dopowiadając sprawcy ani sposobu zbawienia.
theological_decisions:
- issue: Znaczenie σωθῆναι w kontekście
  choice: być zbawionym
  alternative: zostać ocalonym / uratowanym
  rationale: Kontekst wejścia do królestwa wskazuje na pełny sens zbawczy. Sformułowanie zachowuje teologiczną wagę greckiego czasownika i stronę bierną, nie narzucając wyjaśnienia sposobu zbawienia.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. „Któż więc” zachowuje zarówno emocjonalne zdumienie uczniów, jak i wnioskowy tok pytania; bez potrzeby stosowania przypisów.
