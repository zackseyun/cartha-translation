  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: pl
  text: 'On zaś powiedział im: „Nie wszyscy są w stanie przyjąć tę wypowiedź[a], lecz tylko ci, którym zostało to dane[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „to stwierdzenie”, „to słowo” lub „tę naukę”.'
    reason: lexical_alternative
  - marker: b
    text: Strona bierna „zostało to dane” prawdopodobnie wskazuje na Boga jako dawcę, lecz tekst grecki nie wymienia sprawcy wprost.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: powiedział
  rationale: Naturalny, standardowy odpowiednik narracyjnego aorystu od λέγω; grecki tekst nie wymaga mocniejszego „odpowiedział”.
- source_word: Οὐ πάντες
  choice: Nie wszyscy
  rationale: Naturalnie oddaje zanegowany kwantyfikator ogólny bez sugerowania, że nikt nie może przyjąć wypowiedzi.
- source_word: χωροῦσι
  choice: potrafią przyjąć
  rationale: W połączeniu z λόγον czasownik oznacza zrobienie miejsca dla wypowiedzi, a więc zdolność jej przyjęcia; przekład zachowuje modalny sens kontekstu bez dosłownego, nienaturalnego „mieszczą”.
- source_word: τὸν λόγον τοῦτον
  choice: tę wypowiedź
  rationale: λόγος odnosi się tutaj do poprzedzającego stwierdzenia. „Wypowiedź” jest współczesna i pozostawia otwarte, czy chodzi o bezpośrednie zdanie Jezusa, czy szerzej o przedstawioną naukę.
- source_word: ἀλλ’ οἷς
  choice: lecz tylko ci, którym
  rationale: „Tylko” jasno wyraża ograniczający sens przeciwstawienia i zdania względnego w naturalnej polszczyźnie.
- source_word: δέδοται
  choice: zostało to dane
  rationale: Forma zachowuje perfectum strony biernej jako dokonane udzielenie o aktualnym skutku, nie wskazując wprost niewymienionego sprawcy.
theological_decisions:
- issue: Tożsamość domyślnego dawcy w δέδοται
  choice: 'Pozostawić sprawcę niewskazanego: „zostało to dane”.'
  alternative: „którym Bóg to dał”
  rationale: Konstrukcja może być rozumiana jako strona bierna wskazująca pośrednio na Boga, lecz tekst grecki nie nazywa sprawcy. Zachowanie formy biernej nie rozstrzyga tego, czego źródło nie mówi wprost.
- issue: Przedmiot „dania”
  choice: Zaimek „to” odnosi się do zdolności przyjęcia wypowiedzi, zgodnie z konstrukcją zdania, bez jej teologicznego objaśniania w tekście głównym.
  alternative: Rozwinąć jako „zdolność jej przyjęcia”
  rationale: Greka używa bezosobowej formy δέδοται i nie nazywa wprost daru; rozwinięcie uczyniłoby interpretację bardziej jednoznaczną niż oryginał.
translation_notes:
  register: Współczesny, godny rejestr standardowej polszczyzny. „On zaś” zachowuje przeciwstawny charakter δέ, a „lecz” podtrzymuje uroczysty, lecz nadal naturalny ton. Wszystkie znaczniki przypisów występują w tekście głównym.
