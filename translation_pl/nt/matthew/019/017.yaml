  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: pl
  text: 'Odpowiedział mu: „Dlaczego pytasz mnie o to, co dobre? Tylko jeden jest dobry.[a] Jeśli zaś chcesz wejść do życia, przestrzegaj przykazań”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy oraz relacje równoległe mają: „Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden — Bóg”. Tekst SBLGNT w Ewangelii Mateusza brzmi natomiast: „Dlaczego pytasz mnie o to, co dobre? Tylko jeden jest dobry”.'
    reason: textual_variant
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Dlaczego pytasz mnie o to, co dobre?
  rationale: Rodzaj nijaki τοῦ ἀγαθοῦ wskazuje tutaj na „to, co dobre”, a nie na osobę nazwaną dobrą. Przekład zachowuje brzmienie tekstu Mateusza bez ujednolicania go z paralelami synoptycznymi.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Jeden jest Dobry
  rationale: Sformułowanie zachowuje wyraźne εἷς oraz osobowe, substantywizowane ὁ ἀγαθός. Wielka litera sygnalizuje tytułowe użycie przymiotnika, nie dodając w tekście głównym niewystępującego tu słowa „Bóg”.
- source_word: εἰ δὲ θέλεις
  choice: Jeśli zaś chcesz
  rationale: „Chcesz” naturalnie oddaje θέλεις, a „zaś” przekazuje łagodne przejście wyrażone przez δέ bez nadmiernego uwydatniania przeciwstawienia.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: wejść do życia
  rationale: Wyrażenie zachowuje motyw wejścia do życia i nie dopowiada „wiecznego”, którego w tej klauzuli nie ma.
- source_word: τήρησον τὰς ἐντολάς
  choice: przestrzegaj przykazań
  rationale: W odniesieniu do przykazań τηρέω oznacza stosowanie się do nich; „przestrzegaj” jest naturalne i godne we współczesnej polszczyźnie.
theological_decisions:
- issue: Relacja wypowiedzi Jezusa do dobroci Boga i chrystologii
  choice: Zachować Mateuszowe pytanie o „to, co dobre” oraz odpowiedź „Jeden jest Dobry”, bez dopowiadania tożsamości owego Jednego.
  alternative: 'Ujednolicić z Mk 10,18 i Łk 18,19: „Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko sam Bóg”.'
  rationale: Tekst SBLGNT u Mateusza różni się od formy znanej z Marka i Łukasza. Przekład nie powinien ani harmonizować relacji, ani wyprowadzać z tego zdania niewyrażonego wprost zaprzeczenia dobroci lub boskości Jezusa.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Zachowano zwięzłość i nieco zaznaczoną formę greckiego zdania „Jeden jest Dobry”, lecz uniknięto sztucznego „Jeden jest tym Dobrym”. Jedyny przypis oznaczono w tekście jako [a].
