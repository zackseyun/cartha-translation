  terminology: „Rozwieść się z żonami” właściwie przekazuje rozwodowy sens ἀπολύω w tym kontekście. Przypis zachowuje informację o dosłownym obrazie „odesłać/odprawić”, nie czyniąc go niejasnym w tekście głównym.
