  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: pl
  text: 'Powiedział im: „Ze względu na zatwardziałość waszych serc Mojżesz pozwolił wam rozwieść się z waszymi żonami[a], lecz od początku tak nie było”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „odesłać” lub „odprawić swoje żony”; w tym kontekście chodzi o rozwód.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Powiedział im
  rationale: Grecki czas teraźniejszy historyczny w polskiej narracji naturalnie oddaje się czasem przeszłym.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Ze względu na zatwardziałość waszych serc
  rationale: Wyrażenie wskazuje na przyczynę lub okoliczność ustępstwa, a zarazem zachowuje biblijny obraz serca.
- source_word: ἐπέτρεψεν
  choice: pozwolił
  rationale: Czasownik oznacza udzielenie pozwolenia, nie nakaz ani aprobatę.
- source_word: ἀπολῦσαι
  choice: oddalać
  rationale: W kontekście małżeńskim oznacza odprawienie żony, czyli rozwód; „oddalać” zachowuje konkretny obraz greckiego czasownika, a przypis objaśnia sens prawny.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: wasze żony
  rationale: Kontekst małżeństwa i rozwodu rozstrzyga znaczenie γυνή jako „żona”.
- source_word: ἀπ’ ἀρχῆς
  choice: od początku
  rationale: Naturalne i formalnie bliskie oddanie aluzji do początku stworzenia.
- source_word: οὐ γέγονεν οὕτως
  choice: tak nie było
  rationale: Grecki perfect opisuje stan rzeczy ustanowiony od początku; polskie „tak nie było” jest zwięzłe i naturalne, bez dopowiadania podmiotu.
theological_decisions:
- issue: Czy działanie Mojżesza przedstawić jako nakaz, aprobatę czy ustępstwo
  choice: Mojżesz pozwolił wam
  alternative: Mojżesz nakazał wam
  rationale: ἐπέτρεψεν wyraża pozwolenie będące ustępstwem wobec ludzkiej zatwardziałości, a nie pozytywny nakaz.
- issue: Czy wprost dopowiedzieć, że chodzi o pierwotny zamysł Boga
  choice: lecz od początku tak nie było
  alternative: lecz od początku nie taki był zamysł Boga
  rationale: Przekład zachowuje zwięzłość i napięcie oryginału; odniesienie do porządku stworzenia wynika z kontekstu i nie wymaga interpretacyjnego rozwinięcia.
- issue: Czy ἀπολῦσαι oddać bezpośrednio jako „rozwodzić się”
  choice: oddalać wasze żony
  alternative: rozwodzić się z waszymi żonami
  rationale: „Oddalać” zachowuje idiom źródłowy, natomiast przypis jasno podaje jego sens rozwodowy w tym kontekście.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zachowano biblijny idiom „zatwardziałość serc” oraz zwięzłość końcowego odwołania do początku, unikając denominacyjnych dopowiedzeń.
