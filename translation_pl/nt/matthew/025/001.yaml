  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: pl
  text: Wtedy królestwo niebios będzie podobne[a] do dziesięciu dziewic[b], które wzięły swoje lampy[c] i wyszły na spotkanie pana młodego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „zostanie przyrównane do” lub „będzie przyrównane do”. Grecki czasownik ma stronę bierną.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „panien”.'
    reason: lexical_alternative
  - marker: c
    text: 'Można też oddać: „pochodnie”. Greckie słowo może oznaczać przenośne źródło światła używane podczas orszaku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik czasowy, zachowujący związek przypowieści z poprzedzającym kontekstem.
- source_word: ὁμοιωθήσεται
  choice: będzie podobne
  rationale: Naturalnie oddaje formułę porównania w przypowieści; stronę bierną greckiego czasownika zachowano jako wariant w przypisie.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Utrwalone i znaczeniowo wierne oddanie charakterystycznego dla Mateusza wyrażenia z liczbą mnogą οὐρανῶν.
- source_word: δέκα παρθένοις
  choice: do dziesięciu panien
  rationale: W kontekście weselnym „panny” brzmią naturalnie i wskazują na młode niezamężne kobiety; dosłowniejszy wariant „dziewic” podano w przypisie.
- source_word: λαβοῦσαι
  choice: które wzięły
  rationale: Grecki imiesłów aorystu został naturalnie oddany polskim zdaniem względnym, bez zmiany kolejności wydarzeń.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: swoje lampy
  rationale: „Lampy” to tradycyjne i zrozumiałe oddanie λαμπάδες; możliwe znaczenie „pochodnie” zachowano w przypisie.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: wyszły na spotkanie
  rationale: Idiomaticzne polskie wyrażenie wiernie oddające ruch na zewnątrz w celu spotkania nadchodzącej osoby.
- source_word: τοῦ νυμφίου
  choice: pana młodego
  rationale: Współczesne, precyzyjne i naturalne określenie mężczyzny zawierającego małżeństwo; unika archaiczności słowa „oblubieniec”.
theological_decisions:
- issue: Formuła porównania w przypowieści
  choice: królestwo niebios będzie podobne do
  alternative: królestwo niebios zostanie przyrównane do
  rationale: Tekst główny zachowuje sens przyszłego porównania w naturalnej polszczyźnie, a przypis ujawnia stronę bierną greckiego ὁμοιωθήσεται, nie rozstrzygając ponad tekst zakresu samego porównania.
- issue: Znaczenie παρθένοις
  choice: panny
  alternative: dziewice
  rationale: „Panny” pasują do orszaku weselnego i są naturalne we współczesnej polszczyźnie, natomiast przypis zachowuje bardziej bezpośrednie znaczenie odnoszące się do dziewictwa.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano Mateuszowe „królestwo niebios”, a zamiast podniosłego, lecz dziś mniej codziennego „oblubieńca” użyto precyzyjnego określenia „pan młody”. Przypisy zachowują istotne warianty leksykalne i grecką stronę bierną.
