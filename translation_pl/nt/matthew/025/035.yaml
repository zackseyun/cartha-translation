  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: pl
  text: Byłem bowiem głodny i daliście mi jeść; byłem spragniony i daliście mi pić; byłem przybyszem i przyjęliście mnie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecki czasownik ma podstawowe znaczenie „zgromadzić” lub „zebrać”; w tym kontekście oznacza gościnne przyjęcie przybysza. Możliwe także: „przygarnęliście mnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: byłem głodny
  rationale: Naturalny polski odpowiednik opisujący doświadczany w przeszłości stan głodu.
- source_word: γὰρ
  choice: bowiem
  rationale: Wprowadza uzasadnienie wcześniejszej wypowiedzi i zachowuje związek logiczny z kontekstem.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: daliście mi jeść
  rationale: Naturalna polska konstrukcja wiernie oddająca δίδωμι z celownikiem i bezokolicznikiem.
- source_word: ἐδίψησα
  choice: byłem spragniony
  rationale: Oddaje stan pragnienia w naturalnym, godnym rejestrze; jest też zwięzłe i równoległe do „byłem głodny”.
- source_word: ἐποτίσατέ με
  choice: daliście mi pić
  rationale: W kontekście okazanej pomocy ποτίζω oznacza dostarczenie napoju; polski zwrot zachowuje paralelę z „daliście mi jeść”.
- source_word: ξένος
  choice: przybysz
  rationale: Wskazuje osobę obcą, pozbawioną zwykłego miejsca w danej społeczności i potrzebującą gościnnego przyjęcia, bez zawężania sensu do statusu prawnego lub narodowości.
- source_word: συνηγάγετέ με
  choice: przyjęliście mnie
  rationale: W zestawieniu z ξένος czasownik συνάγω odnosi się do gościnnego przygarnięcia lub przyjęcia. „Przyjęliście mnie” brzmi naturalnie i nie dodaje nieobecnego w grece wyrażenia „do domu”.
theological_decisions:
- issue: Gościnność w wyrażeniu ξένος … συνηγάγετέ με
  choice: „byłem przybyszem, a przyjęliście mnie”
  alternative: „byłem obcy, a przygarnęliście mnie” lub bardziej dosłownie „zgromadziliście mnie”
  rationale: Wybrany przekład zachowuje osobisty wymiar miłosiernego przyjęcia człowieka spoza zwykłego kręgu społecznego, nie wprowadzając współczesnych kategorii politycznych ani nie ograniczając gestu do udzielenia noclegu.
translation_notes:
  register: Współczesny, zrozumiały i godny polski. Powtórzenia oraz paralelna budowa trzech członów odzwierciedlają rytm tekstu greckiego. Marker przypisu umieszczono przy wyrażeniu, którego dotyczy, czyli przy „przyjęliście mnie”.
