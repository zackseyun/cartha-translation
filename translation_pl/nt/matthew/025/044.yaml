  terminology: „Panie” właściwie oddaje wołacz Κύριε. „Obcym” słusznie nie zawęża ξένον do cudzoziemca, a „chorym” trafnie interpretuje ἀσθενῆ w tym szeregu. „Nie usłużyliśmy Ci” jest dopuszczalnym, naturalnym w rejestrze biblijnym oddaniem διακονέω; przypis uczciwie podaje szersze możliwości leksykalne.
