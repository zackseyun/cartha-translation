source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: pl
  text: 'Wtedy i oni odpowiedzą: „Panie, kiedy widzieliśmy Cię głodnym albo spragnionym, albo obcym, albo nagim, albo chorym, albo w więzieniu, a nie usłużyliśmy Ci[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie służyliśmy Ci” albo „nie zatroszczyliśmy się o Ciebie” (gr. διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski przysłówek czasowy, zachowujący następstwo wydarzeń w scenie sądu.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: i oni odpowiedzą
  rationale: „I oni” oddaje nacisk καὶ αὐτοὶ, odnosząc ich odpowiedź do wcześniejszej odpowiedzi drugiej grupy; imiesłów λέγοντες można naturalnie zawrzeć w polskim wprowadzeniu mowy niezależnej.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος; tradycyjny, naturalny tytuł w bezpośrednim zwrocie do Jezusa, zachowujący jego chrystologiczny wydźwięk.
- source_word: πεινῶντα ἢ διψῶντα
  choice: głodnym albo spragnionym
  rationale: Orzecznikowe imiesłowy po εἴδομεν są naturalnie oddane polskimi przymiotnikami w narzędniku.
- source_word: ξένον
  choice: obcym
  rationale: Zachowuje szeroki sens osoby spoza własnego domu lub wspólnoty, potrzebującej przyjęcia, bez zawężania do cudzoziemca.
- source_word: γυμνὸν
  choice: nagim
  rationale: Bezpośrednio zachowuje podstawową siłę leksykalną, choć kontekst może obejmować także niedostateczne odzienie.
- source_word: ἀσθενῆ
  choice: chorym
  rationale: W wyliczeniu konkretnych potrzeb cielesnych i społecznych termin najnaturalniej oznacza osobę chorą.
- source_word: ἐν φυλακῇ
  choice: w więzieniu
  rationale: Prosty i współczesny odpowiednik określający uwięzienie.
- source_word: οὐ διηκονήσαμέν σοι
  choice: nie usłużyliśmy Ci
  rationale: „Usłużyć” oddaje praktyczną pomoc zawartą w διακονέω, zachowuje odniesienie do osoby („Ci”) i brzmi naturalniej w tym zdaniu niż kościelnie nacechowane „posługiwać”.
theological_decisions:
- issue: Tytuł κύριος wobec Jezusa
  choice: Panie
  alternative: Mistrzu
  rationale: „Panie” zachowuje zarówno pełen szacunku zwrot, jak i chrystologiczny wydźwięk tytułu, bez jego osłabiania lub doprecyzowywania.
- issue: Zakres znaczeniowy διακονέω
  choice: usłużyliśmy Ci
  alternative: służyliśmy Ci; zatroszczyliśmy się o Ciebie; posłużyliśmy Ci
  rationale: Wybrana forma obejmuje konkretną pomoc potrzebującemu oraz służbę okazaną Królowi. Przypis zachowuje możliwy szerszy odcień troski i służby.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano rytmiczne wyliczenie z powtarzanym „albo” oraz bezpośrednie pytanie. Wielka litera w zaimku „Ci” odpowiada polskiej konwencji szacunku w tekście biblijnym.
