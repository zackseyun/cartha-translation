  source_fidelity: Tekst wiernie oddaje następstwo τότε, emfatyczne καὶ αὐτοί („i oni”), przyszłe ἀποκριθήσονται oraz pytanie retrospektywne. Pełne wyliczenie stanów potrzebujących zostało zachowane, podobnie jak praktyczny sens οὐ διηκονήσαμεν σοι.
