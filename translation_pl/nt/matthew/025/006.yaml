  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: pl
  text: 'Lecz o północy rozległo się wołanie: „Oto pan młody! Wyjdźcie mu na spotkanie”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Lecz o północy
  rationale: Dopełniaczowa konstrukcja czasowa znaczy idiomatycznie „o północy”. „Lecz” oddaje łagodne przejście narracyjne δέ z odcieniem kontrastu wobec wcześniejszego oczekiwania i snu.
- source_word: κραυγὴ γέγονεν
  choice: rozległo się wołanie
  rationale: Perfectum γέγονεν przedstawia zaistnienie wydarzenia, a naturalne polskie „rozległo się wołanie” zachowuje nagłość i słyszalny charakter obwieszczenia.
- source_word: Ἰδού
  choice: Oto
  rationale: „Oto” jest naturalnym, podniosłym, lecz nie archaicznym sygnałem zwracającym uwagę i dobrze odpowiada funkcji ἰδού.
- source_word: ὁ νυμφίος
  choice: pan młody
  rationale: W polszczyźnie „pan młody” jest zwyczajnym i jednoznacznym określeniem mężczyzny w kontekście weselnym; zachowuje obraz przypowieści.
- source_word: ἐξέρχεσθε
  choice: Wyjdźcie
  rationale: Imperatyw liczby mnogiej oznacza wyjście z miejsca, w którym przebywają oczekujące; neutralne „wyjdźcie” nie narzuca perspektywy mówiącego.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: mu na spotkanie
  rationale: To utrwalony polski odpowiednik idiomu oznaczającego wyjście w celu spotkania przybywającej osoby.
theological_decisions:
- issue: Paraboliczny desygnat νυμφίος
  choice: pan młody, zapisany małą literą
  alternative: Pan Młody, zapisany wielkimi literami jako tytuł chrystologiczny
  rationale: Choć w szerszym kontekście przypowieści postać wskazuje na Jezusa, sam werset pozostaje na poziomie obrazu weselnego. Mała litera nie wprowadza interpretacji bezpośrednio do przekładu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. Zdanie zachowuje żywość nagłego nocnego obwieszczenia, a zarazem naturalny szyk polski.
