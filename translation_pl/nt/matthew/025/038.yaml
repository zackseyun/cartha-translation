  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: pl
  text: A kiedy zobaczyliśmy Cię jako przybysza[a] i przyjęliśmy pod swój dach[b] albo nagiego[c] i ubraliśmy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „obcego” albo „cudzoziemca”. Greckie słowo może oznaczać osobę nieznaną lub przybyłą z zewnątrz; tutaj chodzi o kogoś potrzebującego gościnnego przyjęcia.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „zebraliśmy [do siebie]”. W tym kontekście chodzi o przyjęcie kogoś i udzielenie mu gościny.'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „bez dostatecznego ubrania”. Greckie słowo może oznaczać zarówno kogoś nagiego, jak i niedostatecznie odzianego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kiedy
  rationale: Naturalny polski odpowiednik przysłówka pytajnego odnoszącego się do czasu.
- source_word: δέ
  choice: A
  rationale: Lekko łączy pytanie z poprzednią częścią wypowiedzi, bez wprowadzania silnego przeciwstawienia.
- source_word: σε
  choice: Cię
  rationale: Zaimek w funkcji dopełnienia odnosi się do króla/Syna Człowieczego; wielka litera zachowuje utrwalony, godny rejestr polskiego tekstu biblijnego.
- source_word: εἴδομεν
  choice: zobaczyliśmy
  rationale: Oddaje aoryst ὁράω jako jednorazowe spostrzeżenie w przeszłości i naturalnie brzmi w pytaniu.
- source_word: ξένον
  choice: jako przybysza
  rationale: Wskazuje na osobę przybyłą z zewnątrz i potrzebującą gościnnego przyjęcia, bez zawężania sensu do cudzoziemca określonej narodowości.
- source_word: συνηγάγομεν
  choice: przyjęliśmy pod swój dach
  rationale: Kontekstowy sens συνάγω dotyczy udzielenia gościny; polski idiom jasno wyraża przyjęcie potrzebującego do domu.
- source_word: ἢ
  choice: albo
  rationale: Naturalnie łączy drugi człon pytania jako alternatywną sytuację.
- source_word: γυμνὸν
  choice: nagiego
  rationale: Zachowuje podstawowe znaczenie greckiego określenia, a jego możliwy szerszy sens — brak dostatecznej odzieży — podaje przypis.
- source_word: περιεβάλομεν
  choice: ubraliśmy
  rationale: Zwięźle i naturalnie oddaje znaczenie nałożenia komuś ubrania.
theological_decisions:
- issue: Znaczenie ξένος w kontekście sądu i czynów miłosierdzia
  choice: przybysz
  alternative: obcy; cudzoziemiec
  rationale: „Przybysz” zachowuje społeczne położenie osoby spoza miejscowego kręgu, która potrzebuje gościnności, nie narzucając wyłącznie etnicznego lub państwowego rozumienia.
- issue: Zakres znaczeniowy γυμνός
  choice: nagi
  alternative: bez dostatecznego ubrania; skąpo ubrany
  rationale: Tekst główny zachowuje bezpośredni sens słowa, natomiast przypis sygnalizuje, że w tym kontekście może chodzić także o niedostatek odzieży.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Idiom „przyjąć pod swój dach” naturalnie oddaje kontekst gościnności, a przypisy zachowują istotne warianty znaczeniowe. Wielka litera w zaimku „Cię” podkreśla odniesienie do Chrystusa zgodnie z utrwaloną polską praktyką biblijną, bez zmiany treści źródłowej.
