  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: pl
  text: 'Później zaś przychodzą także pozostałe panny i mówią: „Panie, panie[a], otwórz nam[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie Kyrie może być uprzejmym zwrotem „panie”, a w tym kontekście może również zachowywać szerszy wydźwięk tytułu „Pan”.
    reason: alternative_reading
  - marker: b
    text: 'Dosłownie: „otwórz nam”; z kontekstu wynika, że chodzi o drzwi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Później
  rationale: Przysłówek czasowy wskazuje na następną czynność w opowiadaniu; „później” jest naturalnym i precyzyjnym odpowiednikiem.
- source_word: δὲ
  choice: zaś
  rationale: Łagodny spójnik przejściowy; „zaś” zachowuje ciąg narracji bez nadawania wypowiedzi silnego przeciwstawienia.
- source_word: ἔρχονται
  choice: przychodzą
  rationale: Grecki czas teraźniejszy pełni funkcję żywego czasu narracyjnego; polski czas teraźniejszy zachowuje tę bezpośredniość.
- source_word: καὶ
  choice: także
  rationale: 'Wyraża sens addytywny: pozostałe panny również pojawiają się na miejscu.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: pozostałe panny
  rationale: „Pozostałe” wiernie oddaje λοιπαί, a „panny” jest naturalnym polskim określeniem niezamężnych młodych kobiet w realiach przypowieści.
- source_word: λέγουσαι
  choice: i mówią
  rationale: Imiesłów wprowadza mowę niezależną; konstrukcja współrzędna brzmi naturalniej po polsku i nie dodaje emocji nieobecnych w czasowniku λέγω.
- source_word: Κύριε κύριε
  choice: Panie, Panie
  rationale: Zachowano dwukrotne wołanie oraz możliwe napięcie między grzecznościowym zwrotem do gospodarza a teologicznym tytułem „Pan”.
- source_word: ἄνοιξον ἡμῖν
  choice: otwórz nam
  rationale: Oddaje rozkaźnik aorystu i zaimek w celowniku bez dopisywania rzeczownika „drzwi”, który wynika z kontekstu, lecz nie występuje w greckim tekście.
theological_decisions:
- issue: Znaczenie κύριος w bezpośrednim zwrocie
  choice: Pan
  alternative: proszę pana / gospodarzu
  rationale: „Pan” zachowuje zarówno sens uprzejmego zwrotu w ramach przypowieści, jak i szerszy wydźwięk chrystologiczny obecny w Ewangelii Mateusza, nie rozstrzygając tej celowej wieloznaczności.
translation_notes:
  register: Współczesny, zrozumiały i godny styl narracyjny. Zachowano narracyjny czas teraźniejszy, powtórzenie wołacza oraz zwięzłość greckiego polecenia.
