  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: pl
  text: I ci odejdą na wieczną karę[a], sprawiedliwi zaś — do wiecznego życia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „karę trwającą przez wiek” — i odpowiednio: „życie trwające przez wiek”. Znaczenie przymiotnika αἰώνιος bywa w niektórych kontekstach dyskutowane, lecz tutaj to samo słowo określa zarówno „karę”, jak i „życie”; przekład zachowuje tę równoległość, używając w obu miejscach słowa „wieczny”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: odejdą
  rationale: Czas przyszły od ἀπέρχομαι oznacza odejście. Polskie „odejdą” jest naturalne, zwięzłe i nie dodaje szczegółów niewyrażonych w tekście.
- source_word: οὗτοι
  choice: ci
  rationale: Zaimek wskazujący odsyła do wcześniej opisanej grupy i zachowuje zwięzły kontrast ze „sprawiedliwymi”.
- source_word: κόλασιν
  choice: karę
  rationale: W kontekście sądu κόλασις oznacza karę lub konsekwencję karną; „kara” jest najbardziej naturalnym współczesnym odpowiednikiem.
- source_word: αἰώνιον
  choice: wieczną / wiecznego
  rationale: Ten sam przymiotnik określa zarówno karę, jak i życie. Powtórzenie „wieczny” zachowuje ścisłą symetrię greckiego zdania.
- source_word: οἱ δὲ δίκαιοι
  choice: sprawiedliwi zaś
  rationale: Przymiotnik użyty rzeczownikowo oznacza ludzi sprawiedliwych, a δέ sygnalizuje kontrast. Konstrukcja z „zaś” jest naturalna i godna, bez nadmiernego wzmacniania przeciwstawienia.
- source_word: ζωὴν
  choice: życia
  rationale: ζωή standardowo oznacza „życie”; kontekst nie wymaga rozwinięcia tego pojęcia.
theological_decisions:
- issue: Znaczenie αἰώνιον w równoległych wyrażeniach κόλασιν αἰώνιον i ζωὴν αἰώνιον
  choice: Oddać αἰώνιον jako „wieczny” w obu członach
  alternative: „trwający przez wiek” / „wiekuisty” w obu członach
  rationale: To samo greckie słowo określa oba losy, dlatego przekład powinien zachować ich formalną i znaczeniową równoległość, nie przypisując im różnych zakresów trwania. „Wieczny” jest naturalnym i leksykalnie uzasadnionym polskim odpowiednikiem; dyskutowaną alternatywę odnotowano w przypisie.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Szyk „sprawiedliwi zaś” zachowuje wyraźny kontrast i rytm zdania. Myślnik ułatwia odczytanie elipsy czasownika w drugim członie.
