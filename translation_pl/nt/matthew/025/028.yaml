id: MAT.25.28
reference: Matthew 25:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: pl
  text: Dlatego zabierzcie mu ten talent[a] i dajcie temu, który ma dziesięć talentów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent był dużą jednostką wagi, a w konsekwencji także wartości pieniężnej.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: zabierzcie
  rationale: Aoryst rozkazujący liczby mnogiej od αἴρω wyraża bezpośredni nakaz odebrania czegoś danej osobie. „Zabierzcie” naturalnie łączy sens wzięcia i oddzielenia, który dopowiada ἀπ’ αὐτοῦ.
- source_word: οὖν
  choice: dlatego
  rationale: Spójnik wskazuje na wniosek wynikający z poprzedniego osądu; „dlatego” jasno zachowuje tę zależność logiczną.
- source_word: ἀπ’ αὐτοῦ
  choice: mu
  rationale: W połączeniu z czasownikiem „zabrać” polski celownik naturalnie wyraża odebranie czegoś tej osobie. Dosłownie konstrukcja znaczy „od niego”.
- source_word: τὸ τάλαντον
  choice: ten talent
  rationale: Zachowano historyczną nazwę dużej jednostki wagi, a wtórnie wartości pieniężnej. Zaimek „ten” oddaje określoność i odniesienie do wcześniej wspomnianego talentu.
- source_word: δότε
  choice: dajcie
  rationale: Aoryst rozkazujący liczby mnogiej od δίδωμι; „dajcie” jest prostym i naturalnym odpowiednikiem zachowującym siłę nakazu.
- source_word: τῷ ἔχοντι
  choice: temu, który ma
  rationale: Rzeczownikowo użyty imiesłów oddano naturalną polską konstrukcją bez niepotrzebnego dopowiadania, że chodzi o mężczyznę.
- source_word: τὰ δέκα τάλαντα
  choice: dziesięć talentów
  rationale: Kontekst i określona forma grecka wskazują na konkretnych dziesięć talentów wspomnianych wcześniej. W polszczyźnie po czasowniku „ma” sama liczba z rzeczownikiem brzmi naturalnie i zachowuje to odniesienie kontekstowe.
theological_decisions:
- issue: Znaczenie τάλαντον w przypowieści
  choice: Zachowano historyczny termin „talent”, odnoszący się tutaj do dużej jednostki wartości pieniężnej.
  alternative: „suma pieniędzy” lub „pieniądze”
  rationale: Tekst mówi o powierzonym majątku, nie o wrodzonych zdolnościach. Historyczny termin zachowuje realia i tradycyjne powiązania tego fragmentu, a przypis zapobiega współczesnemu błędnemu odczytaniu.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. „Zabierzcie mu” idiomatycznie oddaje ἄρατε ἀπ’ αὐτοῦ, dlatego osobny przypis o wariancie „odbierzcie” nie jest potrzebny; nie oznacza on rzeczywistej różnicy sensu w języku polskim.
