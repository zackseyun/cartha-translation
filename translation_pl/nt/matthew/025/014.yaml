  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: pl
  text: Jest bowiem tak jak z człowiekiem, który, udając się w podróż, wezwał swoich niewolników[a] i powierzył im swój majątek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „sług”. Greckie doulos może, zależnie od kontekstu, oznaczać niewolnika albo sługę; tutaj wybrano „niewolników”, ponieważ widoczne są zwierzchnictwo pana i przynależność tych ludzi do jego domu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Jest bowiem jak z
  rationale: Grecki zwrot wprowadza objaśniające porównanie z poprzednią wypowiedzią, ale pozostaje eliptyczny. Dodanie „jest” zapewnia naturalne polskie zdanie bez dopowiadania wprost podmiotu porównania.
- source_word: ἄνθρωπος
  choice: człowiekiem
  rationale: W przypowieści chodzi o konkretnego mężczyznę, jednak polskie „człowiek” jest tu naturalnym określeniem postaci i nie zaciera jej roli.
- source_word: ἀποδημῶν
  choice: wyjeżdżając
  rationale: Imiesłów oznacza oddalanie się do innego miejsca, zwykle w związku z podróżą. „Wyjeżdżając” jest zwięzłe i nie precyzuje nadmiernie celu ani odległości.
- source_word: ἐκάλεσεν
  choice: wezwał
  rationale: W kontekście pana przywołującego podległych mu ludzi „wezwał” naturalnie oddaje jego autorytet; „zawołał” mogłoby sugerować jedynie podniesienie głosu.
- source_word: τοὺς ἰδίους δούλους
  choice: swoich niewolników
  rationale: δοῦλοι oznacza osoby pozostające pod władzą właściciela; ἰδίους podkreśla, że należeli do tego właśnie człowieka. „Niewolnicy” zachowuje realia społeczne i widoczną w przypowieści relację własności oraz zwierzchnictwa.
- source_word: παρέδωκεν
  choice: powierzył
  rationale: Chodzi o przekazanie mienia wraz z odpowiedzialnością za nie, dlatego „powierzył” trafniej oddaje sens niż neutralne „przekazał”.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: swój majątek
  rationale: Wyrażenie odnosi się do posiadanych przez człowieka dóbr. „Majątek” jest naturalne w polszczyźnie i pasuje do ekonomicznego kontekstu przypowieści.
theological_decisions:
- issue: Oddanie δοῦλος w realiach gospodarstwa domowego z przypowieści
  choice: niewolników
  alternative: sług
  rationale: Relacja własności i władza pana są w tym kontekście wyraźne, dlatego „niewolnicy” nie łagodzi społecznego znaczenia greckiego terminu. Przypis wskazuje częste alternatywne tłumaczenie, nie rozstrzygając na jego podstawie sensu teologicznego przypowieści.
- issue: Elipsa w formule porównawczej Ὥσπερ γὰρ
  choice: Jest bowiem jak z
  alternative: Królestwo niebios jest bowiem jak
  rationale: Tekst grecki nie powtarza wprost „królestwa niebios”. Zachowanie elipsy unika dopisania referenta, choć związek z poprzednim kontekstem pozostaje czytelny.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Składnia zachowuje eliptyczny charakter greckiego porównania, a słownictwo nie zaciera historycznych realiów przypowieści.
