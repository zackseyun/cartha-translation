source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: pl
  text: 'Wtedy sprawiedliwi odpowiedzą mu: „Panie, kiedy widzieliśmy cię głodnego i nakarmiliśmy cię albo gdy widzieliśmy cię spragnionego i daliśmy ci pić?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wskazującego kolejność wydarzeń w wypowiedzi.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: odpowiedzą mu
  rationale: Forma czasownika ma znaczenie czynne, a celownik αὐτῷ naturalnie oddaje polskie „mu”.
- source_word: οἱ δίκαιοι
  choice: sprawiedliwi
  rationale: Przymiotnik użyty rzeczownikowo oznacza osoby uznane w tej scenie za sprawiedliwe; polska forma rzeczownikowa zachowuje zwięzłość oryginału.
- source_word: λέγοντες
  choice: ':'
  rationale: Imiesłów wprowadza wypowiedź bezpośrednią. W naturalnej polszczyźnie jego funkcję wystarczająco i płynnie oddaje dwukropek po czasowniku mówienia.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος; zachowuje zarówno pełen szacunku zwrot, jak i możliwy rezonans chrystologiczny.
- source_word: πότε σε εἴδομεν
  choice: kiedy widzieliśmy cię
  rationale: Bezpośrednie pytanie czasowe oddane naturalnym polskim szykiem.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: głodnym i nakarmiliśmy
  rationale: Imiesłów πεινῶντα pełni funkcję dopełnienia orzekającego po „widzieliśmy”, a τρέφω oznacza tu konkretnie nakarmienie.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: spragnionym i daliśmy ci pić
  rationale: „Spragnionym” zachowuje paralelę z „głodnym”, a „daliśmy ci pić” jest naturalnym i precyzyjnym odpowiednikiem czasownika ποτίζω.
theological_decisions:
- issue: Oddanie κύριος w bezpośrednim zwrocie do Jezusa
  choice: Panie
  alternative: Mistrzu
  rationale: „Panie” jest podstawowym odpowiednikiem κύριος i zachowuje zarówno szacunek mówiących, jak i chrystologiczne napięcie kontekstu bez dopowiadania jego zakresu.
- issue: Pisownia zaimka odnoszącego się do adresata
  choice: cię / ci
  alternative: Cię / Ci
  rationale: Mała litera odpowiada współczesnej neutralnej ortografii i nie wprowadza typograficznej interpretacji nieobecnej w greckim źródle.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Pominięto dosłowne „mówiąc”, ponieważ po czasowniku „odpowiedzą” brzmiałoby redundantnie; dwukropek wiernie przejmuje jego funkcję. Zachowano równoległą budowę „głodnym… spragnionym”.
