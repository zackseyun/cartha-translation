review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the contrast, the elliptically supplied „jeden talent”, the servant's departure, concealment, and the owner's money. However, „kopał w ziemi” uses an imperfective verb and can suggest an ongoing activity, whereas the Greek aorist ὤρυξεν denotes the completed act of digging; in Polish it is also less idiomatic than the contextual expression „wykopał dół w ziemi”.
  naturalness: The register is modern and appropriate. „Ten jednak, który otrzymał jeden talent” and „pieniądze swego pana” are natural. Replacing „kopał w ziemi” with „wykopał dół w ziemi” makes the action both idiomatic and narratively complete.
  terminology: „Talent” correctly retains the ancient monetary/unit term in context. „Pan” is an appropriate contextual rendering of κύριος for the human superior in the parable. „Pieniądze” appropriately renders ἀργύριον here; the footnote preserves the literal silver nuance.
  issues:
  - severity: medium
    issue: „kopał w ziemi” does not adequately render the completed action of ὤρυξεν and is stylistically awkward in this context.
    rationale: The Greek aorist presents a completed act. Polish „kopał” is imperfective and normally depicts an activity in progress. „Wykopał dół w ziemi” is the standard idiomatic contextual expression and makes explicit only what the act of burying necessarily entails.
  revised_text: Ten jednak, który otrzymał jeden talent, odszedł, wykopał dół w ziemi i ukrył pieniądze swego pana[a].
  revised_footnotes:
  - marker: a
    text: 'Dosłownie: „srebro swego pana”.'
    reason: ἀργύριον może oznaczać zarówno srebro, jak i pieniądze; przypis zachowuje bardziej dosłowny wariant leksykalny.
  revision_rationale: Jedyna korekta zastępuje niedokonane „kopał” dokonanym, idiomatycznym „wykopał dół”, aby oddać zakończony charakter greckiego ὤρυξεν oraz naturalny polski opis ukrycia pieniędzy w ziemi. Pozostałe elementy i przypis są trafne.
