id: MAT.25.18
reference: Matthew 25:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: pl
  text: Ten jednak, który otrzymał jeden talent, odszedł, wykopał dół w ziemi i ukrył pieniądze swego pana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „srebro swego pana”.'
    reason: ἀργύριον może oznaczać zarówno srebro, jak i pieniądze; przypis zachowuje bardziej dosłowny wariant leksykalny.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ten jednak
  rationale: δέ sygnalizuje kontrast z poprzednimi sługami, a rodzajnik użyty rzeczownikowo wskazuje na tego konkretnego sługę.
- source_word: τὸ ἓν
  choice: jeden talent
  rationale: Greckie „jeden” eliptycznie odsyła do talentu wspomnianego w Mt 25,15; uzupełnienie rzeczownika zapewnia jasność po polsku.
- source_word: λαβὼν
  choice: który otrzymał
  rationale: W tej przypowieści sługa jest odbiorcą powierzonej sumy; forma imiesłowowa opisuje czynność poprzedzającą dalsze działania.
- source_word: ἀπελθὼν
  choice: odszedł
  rationale: Naturalnie oddaje ruch w inne miejsce przed ukryciem pieniędzy.
- source_word: ὤρυξεν γῆν
  choice: kopał w ziemi
  rationale: Sformułowanie zachowuje obraz kopania ziemi bez dopowiadania w tekście, że sługa wykopał dół, choć wynika to z sytuacji.
- source_word: ἔκρυψεν
  choice: ukrył
  rationale: Prosty i naturalny odpowiednik czasownika κρύπτω.
- source_word: τὸ ἀργύριον
  choice: pieniądze
  rationale: ἀργύριον może oznaczać srebro lub pieniądze; w kontekście powierzonego kapitału „pieniądze” najczytelniej przekazuje sens, a dosłowniejszą możliwość zachowuje przypis.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: swego pana
  rationale: κύριος odnosi się tutaj bezpośrednio do zwierzchnika sługi w świecie przypowieści; „pan” naturalnie oddaje tę relację i zachowuje możliwość parabolicznego odniesienia.
theological_decisions:
- issue: Oddanie κύριος w ramach przypowieści
  choice: pan
  alternative: Pan
  rationale: Bezpośrednim desygnatem jest właściciel i zwierzchnik sługi w opowiadaniu, dlatego mała litera nie przesądza utożsamienia tej postaci z Bogiem ani go nie wyklucza na poziomie interpretacji przypowieści.
translation_notes:
  register: Współczesny, godny i narracyjnie płynny język. Szyk „Ten jednak” wyraźnie zachowuje kontrast. Przypis umieszczono przy wyrażeniu, którego rzeczywiście dotyczy.
