  to: Ten jednak, który otrzymał jeden talent, odszedł, wykopał dół w ziemi i ukrył pieniądze swego pana[a].
  rationale: Jedyna korekta zastępuje niedokonane „kopał” dokonanym, idiomatycznym „wykopał dół”, aby oddać zakończony charakter greckiego ὤρυξεν oraz naturalny polski opis ukrycia pieniędzy w ziemi. Pozostałe elementy i przypis są trafne.
