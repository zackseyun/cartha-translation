id: MAT.25.25
reference: Matthew 25:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: pl
  text: Bałem się, więc odszedłem i ukryłem twój talent[a] w ziemi. Oto masz to, co twoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent był jednostką wagi, a zarazem bardzo wysokiej wartości pieniężnej; nie chodzi tu o naturalne uzdolnienie.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Bałem się
  rationale: Imiesłów okolicznikowy od φοβέομαι wyraża stanowiący motyw działania lęk sługi. Polski czasownik osobowy brzmi naturalnie i nie sugeruje czci ani bojaźni religijnej.
- source_word: ἀπελθὼν
  choice: odszedłem
  rationale: Imiesłów aorystu poprzedza ἔκρυψα; przełożenie go jako kolejnego czasownika zachowuje naturalny w polszczyźnie ciąg czynności.
- source_word: ἔκρυψα
  choice: ukryłem
  rationale: κρύπτω znaczy „ukryć, schować”. Samo zakopanie wynika z frazy „w ziemi”, dlatego nie zostaje dopisane do znaczenia czasownika.
- source_word: τὸ τάλαντόν σου
  choice: twój talent[a]
  rationale: „Talent” jest utrwaloną nazwą starożytnej jednostki wagi i wartości pieniężnej. Przypis zapobiega odczytaniu go jako wrodzonej zdolności.
- source_word: ἐν τῇ γῇ
  choice: w ziemi
  rationale: W tym kontekście γῆ oznacza ziemię jako miejsce ukrycia; „w ziemi” jest zwięzłe i idiomatyczne.
- source_word: ἴδε
  choice: Oto
  rationale: ἴδε kieruje uwagę na oddawaną własność. „Oto” zachowuje wskazujący charakter wypowiedzi i jest dignifikowane, lecz nadal współczesne.
- source_word: ἔχεις τὸ σόν
  choice: masz to, co twoje
  rationale: Grecka konstrukcja podkreśla przynależność rzeczy do pana. Polski zwrot zachowuje eliptyczność i nacisk posesywny bez dopowiadania „z powrotem”.
theological_decisions:
- issue: Znaczenie τάλαντον w przypowieści, którą później wiązano z naturalnymi uzdolnieniami
  choice: W tekście głównym zachowano historyczny termin „talent”, a jego sens pieniężny objaśniono w przypisie.
  alternative: wielka suma pieniędzy
  rationale: Greckie τάλαντον oznacza tu jednostkę wagi lub odpowiadającą jej bardzo wysoką wartość pieniężną, nie wrodzoną zdolność. Zachowanie tradycyjnego terminu oddaje realia przypowieści, a przypis ogranicza ryzyko anachronicznego odczytania.
- issue: Relacja lęku do dalszego działania sługi
  choice: „Bałem się, więc…” oddaje lęk jako podany przez sługę motyw jego postępowania.
  alternative: „Przestraszywszy się, odszedłem…”
  rationale: Imiesłów φοβηθεὶς jest okolicznikowy i w kontekście ma sens przyczynowy. Przekład nie rozstrzyga, czy wyjaśnienie sługi jest prawdziwe lub usprawiedliwione; przedstawia jedynie jego własną deklarację.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zdanie zachowuje prosty tok wypowiedzi sługi oraz posesywny nacisk końcowej frazy. Marker przypisu umieszczono bezpośrednio po słowie wymagającym objaśnienia.
