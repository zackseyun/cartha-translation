  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: pl
  text: 'Lecz on odpowiedział: „Zapewniam was: nie znam was”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „nie rozpoznaję was”. Greckie οἶδα dosłownie znaczy „znam”; w tym kontekście może wskazywać na nieuznanie relacji z adresatami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: On jednak odpowiedział
  rationale: Imiesłów z czasownikiem osobowym tworzy typową formułę narracyjną; naturalne polskie „odpowiedział” oddaje ją bez zbędnego powtórzenia, a „jednak” zachowuje kontrast wyrażony przez δέ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zapewniam was
  rationale: W uroczystej formule Jezusa wyrażenie to podkreśla prawdziwość i stanowczość wypowiedzi. „Zapewniam was” brzmi naturalnie we współczesnej polszczyźnie i zachowuje jej uroczysty ton.
- source_word: οὐκ οἶδα ὑμᾶς
  choice: nie znam was
  rationale: Dosłownie zachowuje podstawowe znaczenie οἶδα oraz liczbę mnogą zaimka. Nie rozstrzyga, czy w kontekście nacisk pada na nierozpoznanie, brak relacji czy stanowcze odrzucenie.
theological_decisions:
- issue: Znaczenie słów „nie znam was” w przypowieści
  choice: Zachowano proste, relacyjnie doniosłe sformułowanie „nie znam was”.
  alternative: „Nie rozpoznaję was” albo „nic mnie z wami nie łączy”.
  rationale: Kontekst wskazuje na wykluczenie i odmowę uznania, ale tekst nie rozwija tego w pełne twierdzenie doktrynalne. Przekład główny nie powinien dopowiadać tego, co pozostaje domyślne.
translation_notes:
  register: Współczesny, dignifikowany i komunikatywny rejestr. Zachowano zwięzłość oraz stanowczy ton odpowiedzi; zaimek „On” jasno wskazuje zmianę mówiącego i odpowiada rodzajnikowi użytemu rzeczownikowo w greckiej konstrukcji.
