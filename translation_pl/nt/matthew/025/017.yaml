  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: pl
  text: Podobnie ten, który miał dwa, zyskał kolejne dwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: Podobnie
  rationale: Przysłówek łączy działanie tego sługi z działaniem poprzedniego sługi w wersecie 16 i zachowuje sens porównawczy.
- source_word: ὁ τὰ δύο
  choice: ten, który miał dwa
  rationale: Rodzajnik z biernikową frazą ma charakter eliptyczny i wskazuje na sługę określonego przez dwa talenty wspomniane w kontekście. Polski przekład zachowuje tę zwięzłość bez dopowiadania czasownika „otrzymał” ani rzeczownika „talenty”.
- source_word: ἐκέρδησεν
  choice: zyskał
  rationale: Aoryst czasownika κερδαίνω oznacza tutaj uzyskanie dodatkowej sumy dzięki podjętemu działaniu; „zyskał” jest naturalne w kontekście finansowym i nie sugeruje wynagrodzenia za pracę.
- source_word: ἄλλα δύο
  choice: kolejne dwa
  rationale: Wyrażenie oznacza dwa dodatkowe przedmioty tego samego rodzaju; „kolejne dwa” brzmi naturalnie i zachowuje elipsę tekstu greckiego.
theological_decisions: []
