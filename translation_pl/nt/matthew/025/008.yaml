id: MAT.25.8
reference: Matthew 25:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: pl
  text: 'Nierozsądne zaś powiedziały do roztropnych: „Dajcie nam trochę swojej oliwy, bo nasze lampy[a] gasną”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pochodnie”. Greckie słowo λαμπάδες może oznaczać przenośne źródła światła różnego rodzaju.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: nierozsądne
  rationale: Przymiotnik użyty rzeczownikowo odnosi się do panien z przypowieści. „Nierozsądne” naturalnie wyraża brak praktycznej rozwagi i tworzy trafny kontrast z φρονίμοις.
- source_word: φρονίμοις
  choice: roztropnych
  rationale: Termin wskazuje na praktyczną mądrość, przezorność i przygotowanie; „roztropne” zachowuje ten sens bez nadmiernego objaśniania.
- source_word: Δότε
  choice: Dajcie
  rationale: Aorystyczny tryb rozkazujący w liczbie mnogiej ma tu postać bezpośredniej prośby; proste „Dajcie” oddaje jego siłę.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: trochę swojej oliwy
  rationale: 'Konstrukcja z ἐκ ma sens cząstkowy: chodzi o część posiadanego zapasu. Takie sformułowanie jest naturalne po polsku.'
- source_word: λαμπάδες
  choice: lampy
  rationale: λαμπάς może oznaczać lampę albo pochodnię. „Lampy” dobrze współgrają ze wzmianką o oliwie i są utrwalone w polskim odbiorze tej przypowieści; wariant leksykalny zachowano w przypisie.
- source_word: σβέννυνται
  choice: gasną
  rationale: Czas teraźniejszy przedstawia trwający proces zanikania płomienia. „Gasną” oddaje to zwięźle i naturalnie.
- source_word: ὅτι
  choice: bo
  rationale: Spójnik wprowadza przyczynę prośby. „Bo” jest współczesnym, naturalnym odpowiednikiem w mowie bezpośredniej.
theological_decisions: []
