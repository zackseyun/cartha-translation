id: MAT.25.29
reference: Matthew 25:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: pl
  text: Każdemu bowiem, kto ma, będzie dane i będzie miał w obfitości[a]; temu zaś, kto nie ma, zostanie odebrane nawet to, co ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „będzie obfitował”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντί
  choice: Każdemu bowiem, kto ma
  rationale: Rzeczownikowe użycie imiesłowu z παντί ma sens dystrybutywny. Polski zaimek „każdemu” z konstrukcją „kto ma” naturalnie zachowuje ogólny i jednostkowy charakter wypowiedzi.
- source_word: γὰρ
  choice: bowiem
  rationale: γάρ wprowadza uzasadnienie poprzedniej wypowiedzi. „Bowiem” zachowuje ten związek logiczny i odpowiada godnemu, współczesnemu rejestrowi.
- source_word: δοθήσεται
  choice: będzie dane
  rationale: Zachowano stronę bierną greckiego czasu przyszłego, nie wskazując wprost dawcy, którego tekst nie nazywa.
- source_word: περισσευθήσεται
  choice: będzie miał w obfitości
  rationale: Czasownik wyraża osiągnięcie stanu obfitości lub nadmiaru. To sformułowanie jest naturalne po polsku, a przypis zachowuje bliższy formalnie wariant „będzie obfitował”.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: temu zaś, kto nie ma
  rationale: Konstrukcja zachowuje kontrast wprowadzony przez δέ oraz reprezentatywną liczbę pojedynczą, a przy polskiej składni strony biernej celownik „temu” brzmi naturalnie.
- source_word: καὶ ὃ ἔχει
  choice: nawet to, co ma
  rationale: 'καί ma tu sens wzmacniający: podkreśla paradoks odebrania nawet posiadanej rzeczy.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: zostanie odebrane
  rationale: Strona bierna i znaczenie oddzielenia są zachowane; polska konstrukcja z celownikiem „temu” wystarczająco wyraża, komu rzecz zostanie odebrana.
theological_decisions:
- issue: Ogólny charakter rodzaju męskiego w konstrukcjach imiesłowowych
  choice: Zachować reprezentatywną liczbę pojedynczą przez „każdemu, kto” i „temu, kto”
  alternative: 'Użyć liczby mnogiej: „wszystkim, którzy mają” oraz „tym, którzy nie mają”'
  rationale: Greka używa gramatycznie męskich form liczby pojedynczej w znaczeniu ogólnym. Polska konstrukcja z „kto” obejmuje każdą osobę bez dodawania zaimka wskazującego na płeć i nie spłaszcza struktury do liczby mnogiej.
- issue: Niewskazany sprawca dania i odebrania
  choice: 'Zachować stronę bierną: „będzie dane” i „zostanie odebrane”'
  alternative: Dodać domyślny podmiot, np. „Bóg da” i „Bóg odbierze”
  rationale: Tekst grecki pozostawia sprawcę niewyrażonego. Przekład nie dopowiada jego tożsamości, choć kontekst może ją sugerować.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelizm, kontrast oraz reprezentatywną liczbę pojedynczą; średnik przejrzyście oddziela dwa przeciwstawne człony sentencji.
