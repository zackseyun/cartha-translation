review_pass:
  verdict: approve
  source_fidelity: Przekład wiernie oddaje oba przyszłe passiva ("będzie dane", "zostanie odebrane"), dystrybutywną konstrukcję liczby pojedynczej oraz kontrast γάρ/δέ. Polski celownik w „temu zaś ... zostanie odebrane” jest naturalnym odpowiednikiem sensu „zostanie odebrane od niego”; nie zmienia znaczenia ἀπ’ αὐτοῦ.
  naturalness: Zdanie brzmi naturalnie we współczesnej, godnej polszczyźnie. Paralelizm „Każdemu ...; temu zaś ...” jest czytelny, a „będzie miał w obfitości” poprawnie wyraża wynikowy sens περισσευθήσεται.
  terminology: Nie występują tu terminy wymagające szczególnej normalizacji teologicznej. Zachowano bezosobową stronę bierną, bez dopowiadania sprawcy. Przypis trafnie podaje dopuszczalny, bliższy formalnie wariant dla περισσευθήσεται.
