base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: pl
  text: 'Wtedy odpowie im: „Zapewniam was[a]: o ile nie uczyniliście tego dla jednego z tych najmniejszych[b], nie uczyniliście tego także dla mnie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Amen, mówię wam”.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „tych najmniejszych” można rozumieć konkretnie jako uczniów Jezusa albo szerzej jako ludzi uniżonych i potrzebujących; przekład pozostawia je w brzmieniu tekstu.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazującego kolejny moment sceny sądu.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: odpowie im
  rationale: Polskie „odpowie im” naturalnie oddaje czasownik oraz adresatów; imiesłów λέγων jest w formule odpowiedzi zbędny stylistycznie i jego sens zawiera się w następującej wypowiedzi.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zapewniam was
  rationale: Oddaje uroczysty, stanowczy charakter właściwej Jezusowi formuły, a zarazem brzmi naturalnie we współczesnej polszczyźnie; bardziej formalny wariant zachowano w przypisie.
- source_word: ἐφ’ ὅσον
  choice: skoro
  rationale: 'W tym przeczącym zdaniu polskie „skoro nie” zwięźle i naturalnie wyraża zależność: niewykonanie czynu wobec najmniejszych oznacza niewykonanie go wobec Jezusa, bez wprowadzania dodatkowej przyczynowości.'
- source_word: οὐκ ἐποιήσατε
  choice: nie uczyniliście tego
  rationale: „Tego” wskazuje na czyny wymienione w poprzednim kontekście, a „uczyniliście” zachowuje uroczysty rejestr i powtórzenie greckiego czasownika.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: dla jednego z tych najmniejszych
  rationale: Zachowuje liczbę pojedynczą ἑνί, wskazanie τούτων i superlatywny sens ἐλαχίστων; „dla” jest naturalne przy czynieniu dobra komuś.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: nie uczyniliście tego także dla mnie
  rationale: W zdaniu przeczącym „także ... nie” naturalnie oddaje włączający sens οὐδέ i zachowuje emfatyczne powtórzenie czasownika.
theological_decisions:
- issue: Tożsamość „tych najmniejszych”
  choice: Pozostawiono nieokreślone wyrażenie „tych najmniejszych”, nie precyzując, do jakiej grupy się odnosi.
  alternative: Rozumieć je konkretnie jako uczniów lub posłańców Jezusa albo szerzej jako ludzi uniżonych i potrzebujących.
  rationale: Sam werset utożsamia postępowanie wobec najmniejszych z postępowaniem wobec Jezusa, ale nie rozstrzyga jednoznacznie zakresu tej grupy; przekład zachowuje tę otwartość.
- issue: Utożsamienie czynu wobec najmniejszych z czynem wobec Jezusa
  choice: 'Zachowano bezpośrednią paralelę: czego nie uczyniono jednemu z najmniejszych, tego nie uczyniono również Jezusowi.'
  alternative: Osłabić utożsamienie przez parafrazę typu „to tak, jakbyście nie uczynili tego dla mnie”.
  rationale: Grecki tekst stwierdza zależność bez porównawczego „jakby”, dlatego przekład nie osłabia jej interpretacyjną parafrazą.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano uroczysty ton wypowiedzi, paralelizm obu członów oraz powtórzenie „uczyniliście”. Markery [a] i [b] umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
