  naturalness: Tekst ma godny, współczesny rejestr i brzmi naturalnie. „O ile nie uczyniliście tego” jest zwięzłym, przyjętym w tym rejestrze sposobem oddania konstrukcji określającej zakres; zachowuje też paralelizm wypowiedzi.
