id: MAT.25.41
reference: Matthew 25:41
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: pl
  text: 'Wtedy powie także tym po lewej stronie: „Odejdźcie ode mnie, przeklęci[a], do wiecznego ognia, przygotowanego diabłu i jego aniołom”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „wy, którzy jesteście przeklęci”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, zachowujący następstwo wydarzeń w scenie sądu.
- source_word: ἐρεῖ
  choice: powie
  rationale: Forma przyszła czasownika λέγω; prosty odpowiednik nie dodaje treści do samego aktu mówienia.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: tym po lewej stronie
  rationale: Czytelne, współczesne określenie grupy stojącej po lewej stronie króla w bezpośrednim kontekście.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Odejdźcie ode mnie
  rationale: Łączne oddanie nakazu odejścia i oddzielenia od mówiącego; forma naturalna i godna w polskiej mowie bezpośredniej.
- source_word: οἱ κατηραμένοι
  choice: przeklęci
  rationale: Imiesłów dokonany strony biernej użyty jako bezpośredni zwrot; zwięzłe polskie określenie zachowuje jego moc, nie rozstrzygając, kto wypowiedział przekleństwo.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: w ogień wieczny
  rationale: Przyimek „w” z biernikiem zachowuje kierunek ruchu ku wyznaczonemu przeznaczeniu, a „wieczny” jest zwykłym i kontekstowo odpowiednim odpowiednikiem αἰώνιος.
- source_word: τὸ ἡτοιμασμένον
  choice: przygotowany
  rationale: Oddaje stan wynikający z wcześniejszego przygotowania, wyrażony greckim imiesłowem perfectum strony biernej.
- source_word: τῷ διαβόλῳ
  choice: diabłu
  rationale: W kontekście sądu eschatologicznego διάβολος jest utrwalonym osobowym określeniem diabła; celownik zachowano naturalną polską konstrukcją.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: jego aniołom
  rationale: W tym kontekście ἄγγελοι oznacza istoty nadprzyrodzone związane z diabłem, nie ludzkich posłańców.
theological_decisions:
- issue: Znaczenie αἰώνιον w kontekście sądu
  choice: wieczny
  alternative: trwający przez wiek; wiekuisty
  rationale: „Wieczny” jest naturalnym i podstawowym odpowiednikiem w tym kontekście oraz zachowuje powagę ostatecznego sądu bez dopisywania szerszego systemu doktrynalnego.
- issue: Referenci διάβολος i ἄγγελοι
  choice: diabeł i jego aniołowie
  alternative: oszczerca i jego posłańcy
  rationale: Eschatologiczny kontekst oraz utrwalone użycie tych określeń wskazują na diabła i związane z nim istoty anielskie; sens ogólny byłby tu niedostateczny.
- issue: Siła bierna οἱ κατηραμένοι
  choice: przeklęci
  alternative: wy, którzy jesteście przeklęci
  rationale: Zwięzły zwrot zachowuje bierny sens greckiego imiesłowu i nie wskazuje wprost sprawcy przekleństwa.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Mowa bezpośrednia pozostaje stanowcza, ale nie archaiczna. Szyk „ogień wieczny, przygotowany…” jest naturalny po polsku i wyraźnie łączy imiesłów z ogniem.
