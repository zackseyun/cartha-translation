  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: pl
  text: Roztropne zaś zabrały oliwę w naczyniach wraz ze swoimi lampami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pochodniami”. Greckie słowo λαμπάς może, zależnie od kontekstu, oznaczać lampę lub pochodnię.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: roztropne
  rationale: Termin oznacza praktyczną mądrość i przezorność. „Roztropne” zachowuje kontrast z nierozsądnymi pannami, nie sprowadzając sensu jedynie do przygotowania.
- source_word: ἔλαβον
  choice: zabrały
  rationale: W tym kontekście narracyjnym chodzi o wzięcie czegoś ze sobą, dlatego „zabrały” brzmi naturalniej niż ogólne „wzięły”.
- source_word: ἔλαιον
  choice: oliwę
  rationale: ἔλαιον oznacza olej, zwykle oliwę; w realiach lamp i w naturalnej polszczyźnie „oliwa” jest trafnym odpowiednikiem.
- source_word: ἀγγείοις
  choice: w naczyniach
  rationale: ἀγγεῖον jest ogólnym określeniem pojemnika lub naczynia. „Naczynia” nie narzucają konkretnego kształtu ani materiału.
- source_word: λαμπάδων
  choice: lampami
  rationale: λαμπάς może oznaczać lampę albo pochodnię. „Lampy” dobrze współgrają ze wzmianką o dodatkowej oliwie, a realną alternatywę zachowano w przypisie.
- source_word: ἑαυτῶν
  choice: swoimi
  rationale: Polski zaimek zwrotny naturalnie oddaje odniesienie do podmiotu i posiadanie wyrażone przez ἑαυτῶν.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: ze swoimi lampami
  rationale: μετά z dopełniaczem wyraża towarzyszenie; sformułowanie wskazuje, że oliwę zabrano razem z lampami.
