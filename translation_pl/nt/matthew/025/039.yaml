  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: pl
  text: A kiedy widzieliśmy Cię chorego albo w więzieniu i przyszliśmy do Ciebie?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „odwiedziliśmy Cię”. Dosłownie po grecku: „przyszliśmy do Ciebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kiedy
  rationale: Naturalny polski odpowiednik przysłówka pytajnego odnoszącego się do czasu.
- source_word: δέ
  choice: a
  rationale: Łagodny spójnik w szeregu pytań; polskie „a” naturalnie podtrzymuje ciąg wypowiedzi bez wprowadzania silnego przeciwstawienia.
- source_word: εἴδομεν
  choice: widzieliśmy
  rationale: Aoryst od ὁράω odnosi się do czynności przeszłej; forma pytajna wynika w polszczyźnie z szyku i kontekstu.
- source_word: ἀσθενοῦντα
  choice: chorego
  rationale: Imiesłów opisuje tu stan choroby fizycznej, zgodnie z kontekstem uczynków miłosierdzia.
- source_word: ἐν φυλακῇ
  choice: w więzieniu
  rationale: φυλακή oznacza w tym kontekście miejsce uwięzienia; „więzienie” jest współczesnym, neutralnym i godnym odpowiednikiem.
- source_word: ἤλθομεν πρός σε
  choice: przyszliśmy do Ciebie
  rationale: Oddaje dosłowny i prosty sens greckiego wyrażenia ruchu ku osobie, nie zawężając go w tekście głównym do odwiedzin.
theological_decisions:
- issue: Czy ἤλθομεν πρός σε oddać jako „odwiedziliśmy Cię”, czy dosłowniej jako „przyszliśmy do Ciebie”
  choice: przyszliśmy do Ciebie
  alternative: odwiedziliśmy Cię
  rationale: Greka mówi dosłownie o przyjściu do kogoś, nie używając swoistego czasownika oznaczającego odwiedziny. Tekst główny zachowuje szersze brzmienie źródła, a naturalną interpretację kontekstową podaje przypis.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, prostym rejestrze. Wielkie litery w zaimkach odnoszących się do Jezusa zachowują tradycyjną polską konwencję szacunku, bez zmiany treści źródłowej.
