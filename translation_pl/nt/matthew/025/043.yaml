source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: pl
  text: Byłem przybyszem, a nie przyjęliście mnie[a]; byłem nagi, a nie ubraliście mnie; byłem chory i w więzieniu, a nie odwiedziliście mnie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie przyjęliście mnie do siebie”. Grecki czasownik dosłownie znaczy „zgromadzić”, lecz tutaj odnosi się do gościnnego przyjęcia przybysza.'
    reason: lexical_alternative
  - marker: b
    text: „Odwiedzić” może tu również znaczyć „zatroszczyć się” lub „zaopiekować się”; nie chodzi jedynie o wizytę towarzyską.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: obcy
  rationale: W tym kontekście oznacza osobę spoza domu lub wspólnoty, potrzebującą gościnnego przyjęcia. „Obcy” zachowuje społeczną bezbronność bez zawężania sensu do cudzoziemca.
- source_word: συνηγάγετέ
  choice: przyjęliście
  rationale: Choć czasownik dosłownie wiąże się ze zgromadzeniem, w połączeniu z ξένος oznacza przyjęcie kogoś do siebie i okazanie mu gościnności.
- source_word: γυμνός
  choice: nagi
  rationale: Bezpośredni odpowiednik zachowujący siłę greckiego określenia; w kontekście może obejmować także brak dostatecznej odzieży.
- source_word: περιεβάλετέ
  choice: ubraliście
  rationale: Czasownik oznacza nałożenie odzienia, czyli ubranie kogoś. Forma „ubraliście mnie” jest naturalna i odpowiada konkretnej czynności miłosierdzia.
- source_word: ἀσθενής
  choice: chory
  rationale: Chociaż wyraz może znaczyć również „słaby”, w tym wyliczeniu potrzebujących najbardziej naturalnie odnosi się do choroby.
- source_word: ἐν φυλακῇ
  choice: w więzieniu
  rationale: φυλακή oznacza tutaj miejsce uwięzienia; „w więzieniu” jest standardowym i niezawężającym polskim odpowiednikiem.
- source_word: ἐπεσκέψασθέ
  choice: odwiedziliście
  rationale: Przekład zachowuje konkretną czynność wyrażoną w grece, a przypis wskazuje, że chodzi o odwiedziny połączone z troską, nie wyłącznie o spotkanie towarzyskie.
theological_decisions:
- issue: Zakres miłosiernego działania wyrażonego przez ἐπεσκέψασθέ με
  choice: nie odwiedziliście mnie
  alternative: nie zatroszczyliście się o mnie
  rationale: „Odwiedziliście” zachowuje konkretny obraz obecny w greckim czasowniku, nie ograniczając jednak przez przypis jego sensu do zwykłej wizyty towarzyskiej.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Powtórzenie „byłem” w trzech członach brzmi naturalnie po polsku i podtrzymuje retoryczny rytm wypowiedzi. Średnik porządkuje serię zaniedbanych czynów miłosierdzia.
