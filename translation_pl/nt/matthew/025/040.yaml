  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: pl
  text: 'A Król odpowie im: „Zaprawdę mówię wam[a]: To, co uczyniliście jednemu z tych moich najmniejszych braci[b], to Mnie uczyniliście”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Amen, mówię wam”.'
    reason: lexical_alternative
  - marker: b
    text: Grecki wyraz oddany jako „braci” ma formę męskiej liczby mnogiej. Określenie „ci moi najmniejsi bracia” może odnosić się szczególnie do uczniów Jezusa, ogólniej do wierzących albo szerzej do ludzi potrzebujących i bezbronnych; przekład zachowuje brzmienie tekstu, nie rozstrzygając tej kwestii.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς
  choice: A Król odpowie im
  rationale: Imiesłów ἀποκριθείς wraz z przyszłym ἐρεῖ tworzy naturalny sens „odpowie”. Zachowano tytuł „Król” i jego określoność, a wielka litera wskazuje na postać królewskiego Sędziego w ramach przypowieści.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: „Zaprawdę” naturalnie oddaje uroczystą formułę ἀμήν, a „mówię wam” zachowuje jej bezpośredni i podniosły charakter.
- source_word: ἐφ’ ὅσον ἐποιήσατε
  choice: To, co uczyniliście
  rationale: Polska konstrukcja naturalnie wyraża ścisłą odpowiedniość między czynem wobec brata a czynem wobec Króla, bez niezręcznego lub warunkowo brzmiącego „o ile”.
- source_word: ἑνὶ τούτων
  choice: jednemu z tych
  rationale: Zachowuje indywidualizującą siłę ἑνί oraz wskazujący charakter τούτων.
- source_word: τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: tych moich najmniejszych braci
  rationale: „Braci” odpowiada męskiej liczbie mnogiej ἀδελφῶν. „Najmniejszych” zachowuje szeroki sens niskiego znaczenia, pozycji lub statusu bez zawężenia go do jednej kategorii.
- source_word: ἐμοὶ ἐποιήσατε
  choice: uczyniliście mnie
  rationale: Celownik ἐμοί oddano bezpośrednio jako „mnie”, zachowując utożsamienie czynu wobec braci z czynem wobec Króla oraz powtórzenie czasownika.
theological_decisions:
- issue: Tożsamość „tych moich najmniejszych braci”
  choice: Pozostawiono dosłowne określenie bez doprecyzowania grupy.
  alternative: Uczniowie lub posłańcy Jezusa; wszyscy wierzący; szerzej — potrzebujący i bezbronni.
  rationale: Sam werset nie rozstrzyga jednoznacznie zakresu tego określenia. Przekład zachowuje jego otwartość i nie narzuca stanowiska wyznaniowego.
- issue: Rodzaj gramatyczny ἀδελφῶν
  choice: braci
  alternative: braci i sióstr; rodzeństwa
  rationale: Grecki rzeczownik ma tutaj formę męskiej liczby mnogiej. Rozszerzenie neutralizujące rodzaj rozstrzygałoby częściowo sporny zakres grupy, którego tekst nie objaśnia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Zaprawdę” zachowuje uroczysty ton wypowiedzi Jezusa, a składnia pozostaje naturalna dla dzisiejszej polszczyzny bez zacierania paralelizmu oryginału.
