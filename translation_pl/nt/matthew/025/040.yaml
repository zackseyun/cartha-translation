  to: 'A Król odpowie im: „Zaprawdę mówię wam[a]: To, co uczyniliście jednemu z tych moich najmniejszych braci[b], to Mnie uczyniliście”.'
  rationale: 'Poprawiono wyłącznie końcową konstrukcję, dodając konieczne w polszczyźnie „to”. Dzięki temu zachowano grecki paralelizm: czyn dokonany wobec jednego z najmniejszych braci jest tym samym czynem dokonanym wobec Króla. Przypisy pozostają poprawnie zakotwiczone i zachowują otwartość interpretacyjną tekstu.'
