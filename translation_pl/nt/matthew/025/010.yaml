  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: pl
  text: Gdy zaś tamte poszły kupić, nadszedł pan młody. Te, które były gotowe, weszły z nim na ucztę weselną[a] i zamknięto drzwi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na uroczystość weselną” lub po prostu „na wesele”. Grecka liczba mnoga może oznaczać całe obchody weselne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Gdy zaś tamte poszły kupić
  rationale: Konstrukcja dopełniaczowa wyraża czynność równoczesną z nadejściem pana młodego. „Poszły kupić” brzmi naturalnie po polsku, zachowuje ideę oddalenia się i cel czynności, a zaimek „tamte” wskazuje na kobiety wspomniane w poprzednim kontekście bez dodawania niewystępującego tu przedmiotu zakupu.
- source_word: ὁ νυμφίος
  choice: pan młody
  rationale: To zwykłe i precyzyjne współczesne polskie określenie mężczyzny zawierającego małżeństwo; zachowuje obraz weselny przypowieści bez jego objaśniania.
- source_word: αἱ ἕτοιμοι
  choice: Te, które były gotowe
  rationale: Przymiotnik rodzaju żeńskiego użyty rzeczownikowo odnosi się do gotowych kobiet. Taki przekład jest naturalny i nie dopowiada, na czym polegała ich gotowość.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: weszły z nim
  rationale: Zwięzły, naturalny odpowiednik opisujący wspólne wejście.
- source_word: εἰς τοὺς γάμους
  choice: na ucztę weselną
  rationale: Grecka liczba mnoga może oznaczać uroczystości weselne jako całość, w tym ucztę. „Uczta weselna” jasno oddaje sytuację, a przypis zachowuje szerszy zakres wyrażenia.
- source_word: ἐκλείσθη ἡ θύρα
  choice: zamknięto drzwi
  rationale: Polska konstrukcja bezosobowa naturalnie oddaje grecką stronę bierną bez wskazywania wykonawcy i zachowuje stanowczą końcowość sceny.
theological_decisions:
- issue: Obraz weselny w przypowieści
  choice: Zachować zwykłe określenia „pan młody” i „uczta weselna” bez dopowiadania ich znaczenia chrystologicznego
  alternative: Wprowadzić w tekście jawne utożsamienie pana młodego z Chrystusem albo użyć interpretacyjnego objaśnienia uczty
  rationale: Znaczenie teologiczne powinno wynikać z przypowieści i jej kontekstu. Przekład zachowuje obraz oraz powagę zamknięcia drzwi, nie narzucając wykładni w samym tekście.
translation_notes:
  register: Współczesny, godny i przystępny polski. Krótkie zdania zachowują narracyjne tempo oraz końcowy, stanowczy wydźwięk. Przedmiot kupowania pozostawiono niewyrażony, zgodnie z greckim tekstem.
