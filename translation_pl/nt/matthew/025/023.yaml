id: MAT.25.23
reference: Matthew 25:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: pl
  text: 'Jego pan powiedział mu: „Dobrze, sługo dobry i wierny[a]! Byłeś wierny w niewielu sprawach, nad wieloma cię ustanowię. Wejdź do radości swego pana”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „niewolniku”. Greckie δοῦλος może, zależnie od kontekstu, oznaczać sługę lub niewolnika.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: powiedział
  rationale: Naturalny, standardowy polski odpowiednik czasownika wprowadzającego mowę bezpośrednią.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: jego pan / swego pana
  rationale: W ramach przypowieści κύριος oznacza zwierzchnika sługi; „pan” zachowuje relację hierarchiczną i jest naturalne po polsku.
- source_word: Εὖ
  choice: Dobrze
  rationale: Zwięzła formuła pochwały, odpowiadająca greckiemu przysłówkowi użytemu samodzielnie.
- source_word: δοῦλε
  choice: sługo
  rationale: „Sługa” brzmi naturalnie w przypowieści i zachowuje relację podporządkowania; możliwe mocniejsze znaczenie „niewolnik” podano w przypisie.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: dobry i wierny
  rationale: Zachowuje oba przymiotniki oraz powiązanie πιστέ z późniejszym πιστός.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: byłeś wierny w niewielu sprawach
  rationale: Oddaje sferę powierzonej odpowiedzialności, a zarazem zachowuje naturalną polszczyznę.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: nad wieloma cię ustanowię
  rationale: Zachowuje paralelny kontrast między niewieloma a wieloma oraz sens powierzenia szerszej odpowiedzialności.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: wejdź do radości
  rationale: Zachowuje obraz wejścia obecny w greckim imperatywie i konstrukcji z εἰς, bez spłaszczania go do samego uczestnictwa.
theological_decisions:
- issue: Znaczenie κύριος w przypowieści
  choice: pan
  alternative: Pan
  rationale: Bezpośrednim odniesieniem wewnątrz opowiadania jest zwierzchnik sługi. Mała litera nie narzuca tytułu odnoszonego bezpośrednio do Boga lub Mesjasza, choć nie usuwa teologicznego znaczenia przypowieści.
- issue: Znaczenie δοῦλος w tym kontekście
  choice: sługa
  alternative: niewolnik
  rationale: Nacisk zdania pada na wierne wywiązanie się z powierzonego zadania. „Sługa” jest naturalny w polskim tekście głównym, natomiast historycznie i leksykalnie możliwe „niewolnik” pozostaje jawne w przypisie.
- issue: Interpretacja εἴσελθε εἰς τὴν χαρὰν
  choice: wejdź do radości
  alternative: miej udział w radości
  rationale: Dosłowniejsze ujęcie zachowuje metaforę wejścia i nie rozstrzyga, czy radość oznacza udział w uczcie, szczęściu pana czy szerszej nagrodzie eschatologicznej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano zwięzłość pochwały oraz paralelizm „w niewielu sprawach — nad wieloma”. Zaimek zwrotny „swego” naturalnie odnosi radość do pana sługi.
