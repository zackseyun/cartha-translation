  source_fidelity: 'Tekst wiernie oddaje wszystkie elementy greckie: formułę pochwały, parę „dobry i wierny”, kontrast między niewieloma a wieloma powierzonymi sprawami, przyszłe ustanowienie oraz obrazowe wezwanie do wejścia do radości pana. „W niewielu sprawach” trafnie i naturalnie wyraża odpowiedzialność implikowaną przez ἐπί.'
  naturalness: Przekład brzmi naturalnie we współczesnej, godnej polszczyźnie. Szyk „sługo dobry i wierny” jest poprawny jako stylizowany, biblijny wołacz i dobrze pasuje do rejestru przypowieści. Konstrukcje „nad wieloma cię ustanowię” i „wejdź do radości swego pana” są idiomatyczne w tym rejestrze.
  terminology: „Pan” właściwie oddaje κύριος jako zwierzchnika w świecie przypowieści, bez nieuzasadnionego narzucania tytułu teologicznego. „Sługa” jest dopuszczalnym, naturalnym odpowiednikiem δοῦλος, a przypis uczciwie podaje „niewolniku” jako możliwą alternatywę. Powtórzenie „wierny” zachowuje istotną więź leksykalną πιστέ / πιστός.
