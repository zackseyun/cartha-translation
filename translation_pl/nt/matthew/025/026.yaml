  naturalness: „Zbieram stamtąd, gdzie nie rozsypałem” zachowuje naturalny, podniosły współczesny rejestr i lepiej odzwierciedla kierunkowy odcień ὅθεν. Przypis dotyczący całej interpunkcji umieszczono przy znaku zapytania.
