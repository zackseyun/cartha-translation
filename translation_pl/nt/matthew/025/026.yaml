    rationale: Ὅθεν ma odcień „stamtąd / z miejsca, gdzie”, a grecki aoryst διεσκόρπισα najlepiej odpowiada polskiemu dokonanemu „nie rozsypałem”. Obecne „nie rozsypywałem” sugeruje czynność trwającą lub powtarzaną, której greka nie wyraża.
