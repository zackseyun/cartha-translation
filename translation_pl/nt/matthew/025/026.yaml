  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: pl
  text: 'Lecz jego pan odpowiedział mu: „Zły i leniwy sługo[a]! Wiedziałeś, że żnę tam, gdzie nie zasiałem, i zbieram stamtąd, gdzie nie rozsypałem?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Zły i leniwy niewolniku!”. Greckie słowo doulos może, zależnie od kontekstu, oznaczać sługę albo niewolnika.'
    reason: lexical_alternative
  - marker: b
    text: 'Słowa te można też odczytać jako stwierdzenie: „Wiedziałeś, że żnę tam, gdzie nie zasiałem, i zbieram stamtąd, gdzie nie rozsypałem”. Tekst grecki nie rozstrzyga interpunkcji.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Lecz ... odpowiedział
  rationale: Oddaje typową formułę narracyjną oraz łagodnie przeciwstawny charakter δέ, unikając nienaturalnego polskiego powtórzenia „odpowiadając, powiedział”.
- source_word: ὁ κύριος αὐτοῦ
  choice: jego pan
  rationale: W realiach przypowieści κύριος określa pana sługi; polskie „pan” naturalnie zachowuje relację zwierzchnictwa bez narzucania w tym miejscu bezpośredniego tytułu chrystologicznego.
- source_word: Πονηρὲ
  choice: Zły
  rationale: Przymiotnik ma tu wyraźny sens moralny. „Zły” jest współczesne i mocne, a zarazem naturalniejsze w bezpośredniej naganie niż „niegodziwy”.
- source_word: δοῦλε
  choice: sługo
  rationale: „Sługa” jest naturalnym polskim określeniem postaci w tej przypowieści. Ponieważ δοῦλος może także oznaczać niewolnika, alternatywę zachowano w przypisie.
- source_word: ὀκνηρέ
  choice: leniwy
  rationale: Jasno i współcześnie oddaje niechęć do działania oraz bezczynność zawartą w ὀκνηρός.
- source_word: ᾔδεις ὅτι
  choice: Wiedziałeś, że
  rationale: Zachowuje treść przypisywanej słudze wiedzy, a znak zapytania nadaje całości możliwy sens pytania retorycznego.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: żnę tam, gdzie nie zasiałem
  rationale: Zachowuje rolniczą parę żęcia i siania oraz kontrast obecny w tekście greckim.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: zbieram tam, gdzie nie rozsypywałem
  rationale: „Zbieram” i „rozsypywałem” oddają podstawowe znaczenia czasowników bez dodawania nieobecnego w grece rzeczownika „ziarno”. Polskie „tam, gdzie” brzmi naturalniej niż dosłowne „stamtąd, skąd” przy tej paralelnej konstrukcji.
theological_decisions:
- issue: Siła końcowej wypowiedzi i interpunkcja
  choice: 'Pytanie retoryczne: „Wiedziałeś, że…?”'
  alternative: 'Zdanie oznajmujące: „Wiedziałeś, że…”'
  rationale: Grecki zapis dopuszcza zarówno stwierdzenie, jak i ironiczne pytanie retoryczne. Pytanie dobrze odpowiada polemicznemu tokowi wypowiedzi pana, lecz alternatywę zachowano w przypisie, aby nie usuwać rzeczywistej wieloznaczności.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Wołacz „sługo” zachowuje bezpośredniość nagany; obrazy żęcia, siania, zbierania i rozsypywania pozostają celowo konkretne. Nie dodano rzeczownika „ziarno”, którego brak w tekście greckim.
