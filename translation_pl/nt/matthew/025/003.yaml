  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: pl
  text: Nierozsądne bowiem, wziąwszy swoje lampy[a], nie zabrały ze sobą oliwy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pochodnie”. Greckie słowo λαμπάς może oznaczać lampę albo pochodnię.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: zaś
  rationale: Spójnik wiąże zdanie z poprzednim i w tym kontekście naturalnie wprowadza rozwinięcie kontrastu; polskie „zaś” zachowuje tę funkcję bez nadmiernie przyczynowego brzmienia.
- source_word: μωραὶ
  choice: nierozsądne
  rationale: Żeńska forma liczby mnogiej odsyła do panien z poprzedniego wersetu. „Nierozsądne” jest współczesne i godne, a zarazem oddaje negatywną ocenę ich braku roztropności.
- source_word: λαβοῦσαι
  choice: wziąwszy
  rationale: Imiesłów uprzedni zwięźle oddaje czynność poprzedzającą główne orzeczenie i pozwala zachować greckie powtórzenie czasownika λαμβάνω.
- source_word: λαμπάδας
  choice: lampy
  rationale: Tradycyjny i kontekstowo zrozumiały odpowiednik; oliwa wskazuje na przenośne źródła światła. Możliwe znaczenie „pochodnie” podano w przypisie.
- source_word: οὐκ ἔλαβον
  choice: nie zabrały
  rationale: „Zabrały” brzmi po polsku naturalnie przy wyrażeniu „ze sobą”, zachowując podstawowy sens czasownika, choć nie odtwarza dosłownie pełnego powtórzenia „wziąć”.
- source_word: μεθ’ ἑαυτῶν
  choice: ze sobą
  rationale: Naturalny polski odpowiednik zwrotu refleksywnego.
- source_word: ἔλαιον
  choice: oliwy
  rationale: W kontekście oświetlenia chodzi o oliwę używaną jako paliwo; „oliwa” jest precyzyjniejsza niż ogólne „olej”.
theological_decisions: []
translation_notes:
  register: Współczesny, dignifikowany rejestr narracyjny. Zachowano zwięzłość greckiego zdania oraz odniesienie przymiotnika w rodzaju żeńskim do panien wspomnianych wcześniej. Marker przypisu umieszczono bezpośrednio po wyrazie, którego dotyczy.
