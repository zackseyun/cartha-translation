source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: pl
  text: 'Wtedy Król powie do tych, którzy są po jego prawej stronie: „Przyjdźcie, pobłogosławieni przez mojego Ojca! Odziedziczcie królestwo przygotowane dla was od założenia świata[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „od czasu założenia świata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka wskazującego kolejny moment w scenie sądu.
- source_word: ἐρεῖ
  choice: powie
  rationale: Czas przyszły czasownika λέγω najprościej i najtrafniej oddaje polskie „powie”.
- source_word: ὁ βασιλεὺς
  choice: Król
  rationale: Rzeczownik z rodzajnikiem określa konkretną postać w tej scenie; wielka litera sygnalizuje użycie tytułowe, nie zmieniając sensu.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: do tych, którzy będą po jego prawej stronie
  rationale: Oddaje zarówno położenie grupy względem Króla, jak i przyszłą perspektywę wypowiedzi; sformułowanie jest jasne we współczesnej polszczyźnie.
- source_word: Δεῦτε
  choice: Przyjdźcie
  rationale: Liczba mnoga odpowiada adresatom i zachowuje charakter uroczystego wezwania.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: pobłogosławieni przez mojego Ojca
  rationale: Imiesłów zachowuje bierny charakter błogosławieństwa, a dopełnienie z „przez” naturalnie wskazuje jego źródło lub sprawcę.
- source_word: κληρονομήσατε
  choice: Odziedziczcie
  rationale: Zachowuje znaczenie otrzymania czegoś jako dziedzictwa oraz imperatywną formę greckiego czasownika.
- source_word: τὴν ... βασιλείαν
  choice: królestwo
  rationale: W połączeniu z dziedziczeniem i przygotowaniem chodzi przede wszystkim o eschatologiczne królestwo, choć słowo nie wyklucza aspektu królowania.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: przygotowane dla was
  rationale: Zwięźle oddaje dokonane przygotowanie, którego skutek pozostaje aktualny dla adresatów.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: od założenia świata
  rationale: Bliski formalnie i utrwalony polski odpowiednik biblijnego wyrażenia o początku świata.
theological_decisions:
- issue: Relacja dopełniacza τοῦ πατρός μου do „pobłogosławieni”
  choice: pobłogosławieni przez mojego Ojca
  alternative: pobłogosławieni mojego Ojca
  rationale: Konstrukcja naturalnie wskazuje Ojca jako źródło lub sprawcę błogosławieństwa. Polski przyimek „przez” wyraża to jasno, bez dodawania odrębnej tezy teologicznej.
- issue: Znaczenie βασιλεία w kontekście dziedziczenia
  choice: królestwo
  alternative: królowanie
  rationale: Królestwo jest tu czymś przygotowanym dla adresatów i przekazanym im jako dziedzictwo; taki kontekst przemawia za sensem sfery lub rzeczywistości królestwa, nie wykluczając Bożego panowania.
- issue: Związek składniowy wyrażenia ἀπὸ καταβολῆς κόσμου
  choice: odniesienie do przygotowania królestwa
  alternative: luźne odniesienie do całego zaproszenia
  rationale: Najbliższym i najbardziej naturalnym określeniem jest imiesłów „przygotowane”. Przekład zachowuje tę relację bez rozwijania jej w system doktrynalny.
translation_notes:
  register: Współczesny, uroczysty i zrozumiały rejestr. Zachowano tytułowe „Król” oraz relacyjne „Ojciec” wielką literą. Wykrzyknik po pierwszym wezwaniu porządkuje dwa następujące po sobie imperatywy i oddaje siłę bezpośredniej mowy.
