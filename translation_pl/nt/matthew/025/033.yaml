  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: pl
  text: I postawi owce po swojej prawej stronie[b], a koźlęta po lewej[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „młode kozy”; greckie ἐρίφια oznacza koźlęta.'
    reason: lexical_alternative
  - marker: b
    text: 'Grecki tekst dosłownie mówi: „z prawej … z lewej”, co jest idiomem oznaczającym ustawienie po prawej i po lewej stronie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: postawi
  rationale: 'Forma przyszła czasownika ἵστημι ma tu znaczenie sprawcze: ustawi kogoś w określonym miejscu. „Postawi” jest naturalne po polsku i zachowuje obraz pasterza rozdzielającego zwierzęta.'
- source_word: πρόβατα
  choice: owce
  rationale: πρόβατα to zwykłe określenie owiec; kontekst wskazuje na wcześniej wyodrębnioną grupę.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: po swojej prawej stronie
  rationale: Konstrukcja ἐκ z dopełniaczem jest tu idiomem określającym położenie po prawej stronie danej osoby. Polski zaimek zwrotny jasno odnosi stronę do podmiotu zdania.
- source_word: ἐρίφια
  choice: koziołki
  rationale: ἐρίφια oznacza młode kozy, czyli koźlęta lub koziołki. „Koziołki” zachowują niuans młodego wieku, brzmią naturalnie w zestawieniu z owcami i nie wprowadzają potocznej wieloznaczności.
- source_word: ἐξ εὐωνύμων
  choice: po lewej
  rationale: Grecki idiom oznacza umieszczenie po lewej stronie. Odniesienie do jego strony pozostaje zrozumiałe z równoległej pierwszej części zdania.
- source_word: μὲν ... δὲ
  choice: … zaś …
  rationale: Korelacja μὲν ... δὲ przeciwstawia dwie grupy. Polski szyk z „zaś” oddaje kontrast w sposób zwięzły i godny.
theological_decisions:
- issue: Czy wyrazić symboliczne znaczenie prawej i lewej strony
  choice: 'Oddać wyłącznie przestrzenne ustawienie: „po swojej prawej stronie… po lewej”'
  alternative: Rozwinąć sens jako miejsca przychylności i nieprzychylności
  rationale: Tekst bezpośrednio opisuje rozmieszczenie grup. Jego wartościująca symbolika wynika z kontekstu sądu i nie powinna być dopisywana do przekładu.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zachowano obraz przestrzennego rozdzielenia oraz kontrast obu grup, bez objaśniającego dopisywania symboliki.
