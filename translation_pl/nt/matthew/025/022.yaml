reference: Matthew 25:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: pl
  text: 'Podszedł także ten, który otrzymał dwa talenty, i powiedział: „Panie[a], przekazałeś mi dwa talenty[b]. Spójrz, zyskałem kolejne dwa talenty”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Mistrzu”. Greckie kyrios zwykle znaczy „Pan”, lecz w tej przypowieści może być również grzecznościowym zwrotem do pana lub zwierzchnika.'
    reason: alternative_reading
  - marker: b
    text: Talent był dużą jednostką wagi i wartości pieniężnej, a nie wrodzoną zdolnością.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu od προσέρχομαι opisuje zbliżenie się sługi, by zdać sprawę; polskie „podszedł” naturalnie zachowuje ten sens.
- source_word: δὲ καὶ
  choice: także
  rationale: Połączenie kontynuuje narrację i wskazuje na kolejnego sługę; „także” wystarczająco oddaje paralelę, a szyk zdania sygnalizuje następstwo.
- source_word: ὁ τὰ δύο τάλαντα
  choice: ten, który otrzymał dwa talenty
  rationale: Grecka konstrukcja rzeczownikowa identyfikuje sługę według powierzonej mu kwoty. Czasownik „otrzymał” wynika z kontekstu i zapewnia naturalność po polsku.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος; „Panie” zachowuje podstawowy odpowiednik tytułu, a przypis wskazuje możliwy sens społeczny „panie, gospodarzu”.
- source_word: παρέδωκας
  choice: przekazałeś
  rationale: παραδίδωμι oznacza przekazać lub oddać komuś; „przekazałeś” zachowuje konkretny sens bez dopowiadania, że chodziło formalnie o powierzenie.
- source_word: μοι
  choice: mi
  rationale: Naturalny polski celownik oddający grecki zaimek w funkcji dopełnienia dalszego.
- source_word: ἴδε
  choice: Spójrz
  rationale: Forma zwraca uwagę rozmówcy na rezultat; „Spójrz” jest współczesne i zachowuje wyrazistość wezwania.
- source_word: ἄλλα δύο τάλαντα
  choice: kolejne dwa talenty
  rationale: ἄλλα z liczebnikiem oznacza dodatkową równą liczbę; „kolejne dwa” brzmi naturalnie i jasno.
- source_word: ἐκέρδησα
  choice: zyskałem
  rationale: κερδαίνω oznacza osiągnąć zysk lub przysporzyć; „zyskałem” zachowuje rezultat bez nadmiernego precyzowania sposobu.
- source_word: τάλαντα
  choice: talenty
  rationale: τάλαντον było dużą jednostką wagi i wartości. Zachowanie tradycyjnego terminu utrzymuje obraz przypowieści, natomiast przypis wyklucza współczesne znaczenie „zdolność”.
theological_decisions:
- issue: Znaczenie κύριος w zwrocie sługi do właściciela
  choice: Panie
  alternative: Gospodarzu
  rationale: „Panie” formalnie odpowiada κύριος i zachowuje możliwy szerszy rezonans tego tytułu. W realiach przypowieści może to być zarazem grzecznościowy zwrot do pana lub gospodarza, co zaznaczono w przypisie bez rozstrzygania ponad tekst.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano tradycyjne „talenty”, ale objaśniono ich starożytne znaczenie ekonomiczne. Szyk jest płynny, a bezpośrednia mowa pozostaje zwięzła i wyrazista.
