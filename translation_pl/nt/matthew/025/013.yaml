  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: pl
  text: Czuwajcie więc[a], bo nie znacie dnia ani godziny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Bądźcie czujni” lub „Nie zasypiajcie”. Grecki nakaz wskazuje na nieustanną czujność.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Czuwajcie
  rationale: Grecki czasownik w trybie rozkazującym czasu teraźniejszego, w liczbie mnogiej, wzywa do stałej czujności. Polskie „czuwajcie” naturalnie zachowuje zarówno obraz niezasypiania obecny w przypowieści, jak i przenośny sens gotowości.
- source_word: οὖν
  choice: więc
  rationale: Wskazuje na wniosek wynikający z poprzedzającej przypowieści; „więc” jest naturalnym współczesnym odpowiednikiem.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza uzasadnienie nakazu. „Bo” jasno i naturalnie oddaje tutaj zależność przyczynową.
- source_word: οὐκ οἴδατε
  choice: nie znacie
  rationale: Oddaje prostą negację czasownika „wiedzieć, znać” w drugiej osobie liczby mnogiej, bez nieuzasadnionego dopowiedzenia.
- source_word: τὴν ἡμέραν
  choice: dnia
  rationale: Zachowuje rzeczownik bez objaśniającego rozszerzenia, zgodnie z greckim tekstem i utrwalonym naturalnym polskim połączeniem „nie znać dnia”.
- source_word: οὐδὲ τὴν ὥραν
  choice: ani godziny
  rationale: Po przeczeniu polska konstrukcja „nie znacie dnia ani godziny” naturalnie oddaje greckie οὐδέ i zachowuje oba równorzędne określenia czasu.
theological_decisions:
- issue: Obrazowy charakter wezwania do czujności
  choice: Czuwajcie
  alternative: Nie zasypiajcie; Bądźcie czujni
  rationale: „Czuwajcie” zachowuje związek z obrazem snu w przypowieści, a zarazem wyraża ciągłą gotowość, nie narzucając określonego systemu eschatologicznego.
- issue: Zakres wyrażenia „dnia ani godziny”
  choice: Pozostawienie wyrażenia bez interpretacyjnego rozwinięcia
  alternative: dnia ani godziny przyjścia Syna Człowieczego; wyznaczonego czasu
  rationale: Choć kontekst wskazuje na gotowość wobec przyszłego przyjścia i sądu, sam werset nie dopowiada, czego dokładnie dotyczą „dzień” i „godzina”. Przekład zachowuje tę zwięzłość i napięcie tekstu.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. „Czuwajcie” jest powszechnie zrozumiałe, zachowuje metaforę przypowieści i nie brzmi nadmiernie technicznie. Marker przypisu umieszczono bezpośrednio po odpowiadającym mu czasowniku.
