  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: pl
  text: 'Roztropne jednak odpowiedziały: „Nie, bo mogłoby nie wystarczyć i nam, i wam[a]. Idźcie raczej do tych, którzy sprzedają, i kupcie sobie”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greka łączy wyrażenie obawy z mocnym przeczeniem; konstrukcja podkreśla obawę, że zapasu może nie wystarczyć ani im, ani wam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ
  choice: jednak odpowiedziały
  rationale: Oddaje narracyjny czasownik odpowiedzi oraz przeciwstawny odcień δέ; rodzaj żeński wynika z greckiej formy i kontekstu przypowieści.
- source_word: αἱ φρόνιμοι
  choice: Roztropne
  rationale: Przymiotnik użyty rzeczownikowo odnosi się do wcześniej wspomnianych kobiet. „Roztropne” wyraża praktyczną mądrość i przezorność bez dodawania nieobecnego tu rzeczownika.
- source_word: λέγουσαι
  choice: pominięte jako odrębne „mówiąc”
  rationale: W polszczyźnie po „odpowiedziały” ponowne wprowadzenie mowy słowem „mówiąc” brzmiałoby sztucznie; dwukropek zachowuje jego funkcję.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Nie, bo mogłoby nie wystarczyć
  rationale: Naturalna polska odmowa połączona z wyrażeniem silnej obawy, że zapas okaże się niewystarczający; przypis sygnalizuje niezwykłą emfatyczną konstrukcję grecką.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: i nam, i wam
  rationale: Powtórzone „i” naturalnie podkreśla obie grupy i oddaje sens celownika korzyści.
- source_word: πορεύεσθε μᾶλλον
  choice: Idźcie raczej
  rationale: Bezpośredni tryb rozkazujący oraz wskazanie preferowanego działania.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: do tych, którzy sprzedają
  rationale: Zachowuje rzeczownikową funkcję imiesłowu i nie dopowiada przedmiotu sprzedaży, choć z kontekstu chodzi o oliwę.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: kupcie sobie
  rationale: Zwięzły, współczesny odpowiednik rozkaźnika wraz z celownikiem zwrotnym.
