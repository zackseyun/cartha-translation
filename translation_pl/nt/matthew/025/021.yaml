  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: pl
  text: 'Jego pan powiedział mu: „Dobrze, dobry i wierny sługo! Byłeś wierny w niewielu sprawach, ustanowię cię nad wieloma sprawami. Wejdź do radości swego pana”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: powiedział
  rationale: Naturalny, standardowy odpowiednik czasownika wprowadzającego mowę bezpośrednią.
- source_word: κύριος
  choice: pan
  rationale: Polskie „pan” naturalnie określa zwierzchnika sługi w realiach przypowieści, a zarazem nie usuwa możliwego teologicznego odniesienia postaci.
- source_word: δοῦλε
  choice: sługo
  rationale: W tym kontekście zwrot „sługo dobry i wierny” brzmi naturalnie i zachowuje relację podporządkowania; możliwe znaczenie „niewolniku” odnotowano w przypisie.
- source_word: Εὖ
  choice: Dobrze
  rationale: Zwięzła, idiomatyczna pochwała odpowiadająca greckiemu przysłówkowi; w połączeniu z dalszym zwrotem przekazuje aprobatę pana.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: dobry i wierny
  rationale: Bezpośredni i naturalny przekład obu określeń, zachowujący tradycyjne oraz kontekstowo trafne znaczenie πιστός jako lojalny i godny zaufania.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Byłeś wierny w niewielu sprawach
  rationale: Oddaje wierność w zakresie ograniczonej odpowiedzialności, unikając nienaturalnego dosłownego „nad niewieloma”.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: nad wieloma cię ustanowię
  rationale: Zachowuje paralelny kontrast między małym a wielkim zakresem odpowiedzialności oraz formalny sens powierzenia zwierzchnictwa.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Wejdź do radości
  rationale: Zachowuje obraz wejścia wyrażony przez imperatyw i przyimek εἰς, zamiast interpretacyjnie spłaszczać go do samego uczestnictwa.
theological_decisions:
- issue: κύριος jako określenie postaci z przypowieści mogącej wskazywać na Boga lub Chrystusa
  choice: pan
  alternative: Pan; właściciel
  rationale: „Pan” odpowiada relacji przedstawionej w przypowieści i zarazem zachowuje w języku polskim możliwość głębszego odniesienia teologicznego bez narzucania go wielką literą.
- issue: Status określony rzeczownikiem δοῦλος
  choice: sługa
  alternative: niewolnik
  rationale: W głównym tekście „sługa” zapewnia naturalny, godny rejestr i jasno współgra z określeniem „pan”; ponieważ δοῦλος może wskazywać na niewolnika, tę istotną możliwość zachowano w przypisie.
translation_notes:
  register: Współczesny, godny język narracyjny. Zachowano powtórzenie rdzenia „wierny”, kontrast między niewieloma a wieloma sprawami oraz metaforę wejścia do radości pana. Mała litera w słowie „pan” odpowiada bezpośredniej warstwie przypowieści, nie wykluczając jej sensu teologicznego.
