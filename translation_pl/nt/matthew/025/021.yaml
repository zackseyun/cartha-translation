  source_fidelity: Przekład trafnie oddaje sens wypowiedzi, relację pan–sługa oraz metaforę wejścia do radości pana. W drugiej części zdania greckie ἐπὶ πολλῶν eliptycznie nawiązuje do „rzeczy/spraw”; po polsku wymaga to dopowiedzenia rzeczownika, aby zachować sens ustanowienia nad powierzonym zakresem odpowiedzialności.
