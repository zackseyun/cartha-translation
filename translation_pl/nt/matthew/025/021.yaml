  terminology: „Pan” dla κύριος oraz „sługa” dla δοῦλος są właściwe w warstwie przypowieści. Przypis uczciwie zachowuje możliwy przekład „niewolnik”, bez narzucania rozstrzygnięcia interpretacyjnego. „Wierny” trafnie oddaje πιστός w obu wystąpieniach.
