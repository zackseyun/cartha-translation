  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: pl
  text: Wtedy wszystkie te dziewice wstały i przygotowały swoje lampy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pochodnie”. Greckie słowo λαμπάς może oznaczać przenośne źródło światła obu rodzajów; kontekst oliwy i przygotowań dopuszcza oba przekłady.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, zachowujący następstwo wydarzeń w narracji.
- source_word: ἠγέρθησαν
  choice: wstały
  rationale: W tym kontekście czasownik oznacza podniesienie się po śnie lub odpoczynku; „wstały” jest naturalne i nie rozstrzyga, czy zostały obudzone.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: wszystkie te dziewice
  rationale: „Dziewice” zachowuje podstawowe, konkretne znaczenie παρθένοι oraz związek przypowieści z uroczystością weselną.
- source_word: ἐκόσμησαν
  choice: przygotowały
  rationale: κοσμέω oznacza tu doprowadzenie lamp do porządku i gotowości. „Przygotowały” jest jasne po polsku i nie narzuca szczegółowej czynności, której tekst grecki nie precyzuje.
- source_word: λαμπάδας
  choice: lampy
  rationale: λαμπάς może oznaczać lampę albo pochodnię. Wzmianki o oliwie i przygotowaniu przemawiają za „lampami”, choć „pochodnie” pozostają możliwym przekładem.
- source_word: ἑαυτῶν
  choice: swoje
  rationale: Polski zaimek zwrotny naturalnie oddaje odniesienie ἑαυτῶν do podmiotu zdania bez zbędnego nacisku właściwego wyrażeniu „własne”.
