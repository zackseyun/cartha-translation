  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: pl
  text: 'A ten, który otrzymał pięć talentów[a], podszedł i przyniósł kolejnych pięć talentów. Powiedział: „Panie[b], przekazałeś mi pięć talentów. Spójrz, zyskałem kolejnych pięć talentów”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent był dużą jednostką wagi, a zarazem bardzo dużą sumą pieniędzy.
    reason: cultural_note
  - marker: b
    text: Greckie kyrios może tu znaczyć „pan” lub „mistrz”; w tej przypowieści jest to zwrot sługi do jego pana.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu od προσέρχομαι opisuje zbliżenie się sługi do pana; polskie „podszedł” naturalnie oddaje scenę zdawania sprawy.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ten, który otrzymał pięć talentów
  rationale: Konstrukcja z imiesłowem rodzajnikowym identyfikuje sługę przez wcześniejsze otrzymanie pieniędzy, bez dodawania rzeczownika nieobecnego w grece.
- source_word: τάλαντα
  choice: talentów
  rationale: τάλαντον oznacza dużą jednostkę wagi, a w tym kontekście sumę pieniędzy. Tradycyjny termin „talent” zachowuje obraz źródłowy, a przypis objaśnia jego starożytne znaczenie.
- source_word: προσήνεγκεν
  choice: przyniósł
  rationale: Czasownik προσφέρω oznacza tutaj przyniesienie dodatkowej sumy przed pana; „przyniósł” jest proste i naturalne, bez kultowego odcienia możliwego w innych kontekstach.
- source_word: ἄλλα πέντε τάλαντα
  choice: kolejnych pięć talentów
  rationale: ἄλλα z liczebnikiem wskazuje na dodatkową, równą sumę. „Kolejnych pięć” brzmi naturalnie i zachowuje ilościową precyzję.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz „Panie” jest zwyczajnym polskim odpowiednikiem κύριε i zachowuje zarówno sens zwrotu sługi do jego pana, jak i szerszy rezonans słowa „Pan” w Ewangelii Mateusza.
- source_word: παρέδωκας
  choice: przekazałeś
  rationale: παραδίδωμι znaczy przekazać lub oddać komuś; „przekazałeś mi” pozostaje blisko greki i nie dopowiada wprost idei powiernictwa.
- source_word: ἴδε
  choice: Spójrz
  rationale: ἴδε jest wezwaniem do zwrócenia uwagi. „Spójrz” jest współczesne, żywe i odpowiednie w mowie bezpośredniej.
- source_word: ἐκέρδησα
  choice: zyskałem
  rationale: κερδαίνω oznacza osiągnąć zysk lub przysporzyć. „Zyskałem” zachowuje ekonomiczny sens bez sugerowania wynagrodzenia za pracę.
theological_decisions:
- issue: Znaczenie κύριος w zwrocie występującym w przypowieści
  choice: Panie
  alternative: panie / mój panie
  rationale: W obrębie przypowieści sługa zwraca się do swojego pana, lecz greckie κύριος może mieć także szerszy wydźwięk teologiczny. Polskie „Panie” zachowuje tę dwuznaczność bez przesądzania identyfikacji postaci.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zdanie podzielono przed mową bezpośrednią dla naturalności polskiej narracji. W końcowej wypowiedzi pominięto powtórzenie rzeczownika „talentów”, ponieważ polskie „kolejnych pięć” jednoznacznie odsyła do talentów i brzmi naturalniej, zachowując pełny sens.
