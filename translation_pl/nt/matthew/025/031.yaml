id: MAT.25.31
reference: Matthew 25:31
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: pl
  text: Gdy zaś Syn Człowieczy przyjdzie w swojej chwale, a z nim wszyscy aniołowie, wtedy zasiądzie na swoim pełnym chwały tronie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na tronie jego chwały”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Gdy zaś
  rationale: Ὅταν z aorystem trybu łączącego wskazuje tu na pojedyncze przyszłe wydarzenie, dlatego naturalnym polskim odpowiednikiem jest „gdy”. Partykuła δὲ sygnalizuje przejście w toku wypowiedzi; „zaś” zachowuje tę funkcję bez wprowadzania zbyt mocnego przeciwstawienia.
- source_word: ἔλθῃ
  choice: przyjdzie
  rationale: Aoryst trybu łączącego po ὅταν odnosi się do przyszłości. Polski czas przyszły jest w takim zdaniu czasowym naturalny i jednoznaczny.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski tytuł zachowuje jego biblijne, zwłaszcza Danielowe, odniesienia oraz chrystologiczne znaczenie.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: w swojej chwale
  rationale: δόξα oznacza tu objawiony majestat i chwałę. „W swojej chwale” jest naturalne, zachowuje zaimek odnoszący się do Syna Człowieczego i biblijny wydźwięk wyrażenia.
- source_word: πάντες οἱ ἄγγελοι
  choice: wszyscy aniołowie
  rationale: Przekład nie dodaje zaimka „Jego”, którego brak w tekście greckim.
- source_word: μετ’ αὐτοῦ
  choice: z Nim
  rationale: Proste i naturalne oddanie relacji towarzyszenia. Wielka litera w zaimku osobowym odpowiada polskiej konwencji szacunku wobec Chrystusa.
- source_word: τότε καθίσει
  choice: wtedy zasiądzie
  rationale: τότε wskazuje następstwo, a przyszłe καθίσει oznacza zajęcie miejsca na tronie. „Zasiądzie” brzmi naturalnie w kontekście królewskim i sądowniczym.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: na swoim pełnym chwały tronie
  rationale: ἐπί z dopełniaczem oznacza położenie „na” tronie. Idiomatyczny polski przekład oddaje dopełniacz jakościowy δόξης, a zaimek „swoim” wskazuje, że chwała i tron należą do podmiotu. Bardziej formalną składnię zachowano w przypisie.
theological_decisions:
- issue: Tytuł chrystologiczny ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn człowieka / Człowiek
  rationale: Tradycyjny tytuł nie rozstrzyga przez parafrazę wszystkich jego odcieni, a zarazem zachowuje związek z Dn 7 oraz rolę królewską i sądowniczą w tym fragmencie.
- issue: Znaczenie θρόνου δόξης αὐτοῦ
  choice: na swoim pełnym chwały tronie
  alternative: na tronie swojej chwały
  rationale: Tekst przedstawia królewskie i sądownicze zasiadanie Syna Człowieczego. Przekład główny jest naturalny we współczesnej polszczyźnie, natomiast przypis ujawnia dosłowniejszą strukturę, nie zawężając relacji dopełniaczowej.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna biblijna. Zachowano rytm zdania warunkowo-czasowego „Gdy… wtedy”, utrwalony tytuł „Syn Człowieczy” oraz rozróżnienie między „wszyscy aniołowie” a niewystępującym w grece „wszyscy Jego aniołowie”.
