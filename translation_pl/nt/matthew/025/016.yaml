  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: pl
  text: Ten, który otrzymał pięć talentów[a], poszedł i obracał nimi[b], a zyskał kolejne pięć.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent był dużą jednostką pieniężną, a nie naturalnym uzdolnieniem.
    reason: cultural_note
  - marker: b
    text: 'Lub: „wykorzystał je”; greckie wyrażenie opisuje aktywne wykorzystanie powierzonych pieniędzy dla zysku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: poszedł
  rationale: Imiesłów aorystu opisuje działanie poprzedzające lub wprowadzające dalszą czynność. Polski czasownik osobowy brzmi naturalnie i nie dodaje niewyrażonego wprost pośpiechu.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ten, który otrzymał pięć talentów
  rationale: Konstrukcja z rodzajnikiem identyfikuje sługę przez to, co otrzymał, bez potrzeby dodawania rzeczownika „człowiek” lub „sługa” w tym wersecie.
- source_word: τάλαντα
  choice: talentów
  rationale: Zachowano tradycyjną nazwę dużej jednostki pieniężnej; przypis zapobiega współczesnemu odczytaniu jej jako uzdolnienia.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: obracał nimi
  rationale: W kontekście powierzonych pieniędzy wyrażenie oznacza ich aktywne wykorzystanie dla osiągnięcia zysku. „Obracał nimi” jest naturalne po polsku, a przypis zachowuje bardziej dosłowną możliwość.
- source_word: ἐκέρδησεν
  choice: zyskał
  rationale: Czasownik κερδαίνω oznacza tutaj osiągnięcie zysku; „zyskał” zachowuje bezpośredni związek z rezultatem działania.
- source_word: ἄλλα πέντε
  choice: kolejne pięć
  rationale: 'Oddaje addytywny sens wyrażenia: pięć ponad już otrzymane.'
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano tradycyjny termin „talent”, objaśniając jego starożytne znaczenie pieniężne w przypisie. Nie dodano określenia „natychmiast”, którego nie ma wprost w tekście greckim.
