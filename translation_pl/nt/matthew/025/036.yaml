source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: pl
  text: Byłem nagi, a przyodzialiście mnie; byłem chory, a odwiedziliście mnie[a]; byłem w więzieniu, a przyszliście do mnie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „zatroszczyliście się o mnie”. Grecki czasownik może oznaczać odwiedziny połączone z troską lub opieką.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: nagi
  rationale: Bezpośredni odpowiednik greckiego przymiotnika, który może też opisywać brak dostatecznego ubrania; zachowuje ścisły związek z czynnością przyodziania.
- source_word: περιεβάλετέ
  choice: przyodzialiście
  rationale: Oddaje czynność nałożenia komuś ubrania. Forma jest zwięzła, godna i naturalna w kontekście konkretnego aktu miłosierdzia.
- source_word: ἠσθένησα
  choice: chorowałem
  rationale: Czasownik może szerzej oznaczać słabość, lecz w tym kontekście najprawdopodobniej odnosi się do choroby.
- source_word: ἐπεσκέψασθέ
  choice: odwiedziliście
  rationale: Zachowuje podstawowy obraz przyjścia do chorego, nie wykluczając zawartego w greckim czasowniku odcienia troski i opieki.
- source_word: φυλακῇ
  choice: więzieniu
  rationale: Standardowy, szeroki odpowiednik miejsca uwięzienia lub odosobnienia.
- source_word: ἤλθατε πρός με
  choice: przyszliście do mnie
  rationale: Oddaje dosłowną prostotę greckiego wyrażenia i nie dodaje ponownie pojęcia odwiedzin.
theological_decisions:
- issue: Zakres interpretacyjnego rozwinięcia opisu czynów miłosierdzia
  choice: 'Zachowano konkretne czynności: „przyodzialiście”, „odwiedziliście” i „przyszliście do mnie”.'
  alternative: „Zaopiekowaliście się mną” oraz „przyszliście mnie odwiedzić”.
  rationale: Grecki tekst wymienia proste, namacalne czyny. Rozwinięcie mogłoby trafnie sugerować troskę, ale dodawałoby treść niewyrażoną wprost i zacierało rozróżnienie między dwoma ostatnimi sformułowaniami.
translation_notes:
  register: Współczesna, godna polszczyzna o rytmicznej składni. „Przyodzialiście” jest nieco podniosłe, lecz nadal zrozumiałe i dobrze odpowiada zwięzłości oraz konkretności tekstu greckiego.
