id: MAT.25.42
reference: Matthew 25:42
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: pl
  text: Bo byłem głodny, a nie daliście mi jeść[a]; byłem spragniony, a nie daliście mi pić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „nie daliście mi nic do jedzenia”; podobnie dalej: „nie daliście mi nic do picia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: byłem głodny
  rationale: Aoryst opisuje stan głodu w przeszłości; to naturalny, współczesny polski odpowiednik, zachowujący osobisty charakter wypowiedzi.
- source_word: γὰρ
  choice: bo
  rationale: Spójnik wprowadza uzasadnienie wyroku z kontekstu; „bo” jasno i naturalnie oddaje jego funkcję wyjaśniającą.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: nie daliście mi jeść
  rationale: Polska konstrukcja jest zarazem naturalna i bliska greckiemu „nie daliście mi zjeść/jeść”; zachowuje zaimek μοι oraz czasownikowy charakter φαγεῖν.
- source_word: ἐδίψησα
  choice: byłem spragniony
  rationale: Oddaje przeszły stan pragnienia i zachowuje paralelizm ze zwrotem „byłem głodny” w podniosłym, lecz współczesnym rejestrze.
- source_word: ἐποτίσατέ με
  choice: nie daliście mi pić
  rationale: W kontekście udzielania pomocy ποτίζω oznacza danie komuś napoju; wybrana konstrukcja jest naturalna po polsku i odpowiada paralelnemu „nie daliście mi jeść”.
theological_decisions:
- issue: Stopień dosłowności negowanych zdań o udzieleniu pokarmu i napoju
  choice: „nie daliście mi jeść … nie daliście mi pić”
  alternative: „nie daliście mi nic do jedzenia … nie daliście mi nic do picia”
  rationale: Wybrana forma zachowuje bliskość greckiej składni oraz osobisty nacisk na zaniedbanie Jezusa, bez wprowadzania dodatkowej interpretacji do kontekstu sądu i miłosierdzia.
translation_notes:
  register: Współczesny, godny i przystępny język polski. Paralelna budowa obu członów odzwierciedla retorykę tekstu greckiego; średnik czytelnie rozdziela dwa odpowiadające sobie zaniedbania.
