  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: pl
  text: Pięć z nich było nierozsądnych, a pięć roztropnych.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: pięć
  rationale: Podstawowy odpowiednik liczebnika głównego; powtórzenie zachowuje wyważony kontrast greckiego zdania.
- source_word: δὲ
  choice: a
  rationale: Partykuła łagodnie łączy zdanie z kontekstem; polskie „a” naturalnie wprowadza opis i zarazem pozwala wybrzmieć wewnętrznemu przeciwstawieniu obu grup.
- source_word: ἐξ αὐτῶν
  choice: z nich
  rationale: Naturalny polski odpowiednik konstrukcji partytywnej, wskazującej na część wcześniej wspomnianej grupy.
- source_word: ἦσαν
  choice: było
  rationale: Imperfectum czasownika εἰμί pełni funkcję łącznika w opisie; nijaka forma „było” zgadza się z liczebnikiem „pięć”.
- source_word: μωραὶ
  choice: nierozsądnych
  rationale: Oddaje brak rozsądku właściwy μωρός, a forma dopełniacza jest wymagana przez polską składnię liczebnika „pięć”.
- source_word: καὶ πέντε φρόνιμοι
  choice: a pięć roztropnych
  rationale: φρόνιμος oznacza osobę roztropną, rozsądną i przewidującą; „roztropnych” trafnie pasuje do kontekstu przypowieści. Polszczyzna naturalnie opuszcza powtórzone „było”.
theological_decisions: []
translation_notes:
  register: Współczesna, zwięzła i godna polszczyzna. Zachowano symetrię „pięć… pięć” oraz kontrast między brakiem rozsądku a roztropnością; nie dodano rzeczownika określającego kobiety, ponieważ wynika on z poprzedniego wersetu.
