  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: pl
  text: Jednemu dał pięć talentów[a], drugiemu dwa, a trzeciemu jeden — każdemu według jego własnych możliwości — po czym udał się w podróż.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Talent był bardzo dużą jednostką wagi i wartości pieniężnej; tutaj nie oznacza naturalnego uzdolnienia. Można też oddać: „bardzo duże sumy pieniędzy”.'
    reason: lexical_alternative
  - marker: b
    text: 'W przytoczonym tekście greckim słowo „zaraz” rozpoczyna następny człon (w. 16) i najnaturalniej odnosi się do działania sługi: „Zaraz potem ten, który otrzymał pięć talentów…”. Możliwe jest także łączenie go z wyjazdem gospodarza.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talentów
  rationale: „Talent” zachowuje historyczną nazwę bardzo dużej jednostki wagi i wartości pieniężnej, znaną z tej przypowieści. Przypis zapobiega odczytaniu tego słowa w jego współczesnym znaczeniu wrodzonego uzdolnienia.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: jednemu ... drugiemu ... a trzeciemu
  rationale: Naturalna polska konstrukcja rozdzielcza jasno wskazuje trzech różnych odbiorców i zachowuje kontrast μέν/δέ.
- source_word: ἕν
  choice: jeden
  rationale: Rzeczownik „talent” wynika z poprzednich członów; pominięcie go jest naturalne w polszczyźnie i zachowuje zwięzłość greckiego tekstu.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: każdemu stosownie do jego własnych możliwości
  rationale: δύναμις oznacza tu zdolność lub zakres możliwości danej osoby, nie cudowną moc. Liczba pojedyncza i zaimek „jego” zachowują rozdzielczy charakter greckiej konstrukcji.
- source_word: ἀπεδήμησεν
  choice: wyjechał
  rationale: Czasownik oznacza oddalenie się, zwykle w podróż. „Wyjechał” jest w tym kontekście naturalniejsze i pełniejsze niż ogólne „odszedł”, a nie dopowiada celu podróży.
- source_word: εὐθέως
  choice: zaraz
  rationale: Zwięzły, współczesny odpowiednik oznaczający natychmiastowość. W tekście głównym łączy się z wyjazdem gospodarza, zgodnie z możliwą interpunkcją; alternatywne powiązanie wskazuje przypis.
theological_decisions:
- issue: Znaczenie talentów w przypowieści
  choice: Historyczne jednostki pieniężne, nie naturalne uzdolnienia
  alternative: bardzo duże sumy pieniędzy
  rationale: Kontekst mówi o powierzonym majątku. Zachowanie terminu historycznego nie powinno sugerować, że greckie τάλαντα oznacza tu zdolności człowieka.
- issue: Odniesienie wyrażenia κατὰ τὴν ἰδίαν δύναμιν
  choice: Możliwości każdego z poszczególnych sług
  alternative: według możliwości każdego
  rationale: Singularna konstrukcja rozdzielcza wiąże własne możliwości z każdym odbiorcą osobno. Nie należy jej odczytywać jako odniesienia do możliwości gospodarza.
- issue: Powiązanie εὐθέως
  choice: Gospodarz zaraz wyjechał
  alternative: Zaraz potem sługa, który otrzymał pięć talentów, zaczął nimi obracać
  rationale: Starożytne rękopisy nie zawierają współczesnej interpunkcji, dlatego przysłówek można łączyć z końcem tego zdania albo z początkiem następnego. Tekst główny przyjmuje pierwszą możliwość, a przypis zachowuje rzeczywistą niejednoznaczność.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Szyk rozdzielczy jest naturalny, a myślniki czytelnie wydzielają objaśnienie zasady podziału. Termin „talent” zachowano ze względu na historyczny i międzytekstowy charakter, lecz objaśniono go, aby uniknąć nowoczesnego znaczenia „uzdolnienie”.
