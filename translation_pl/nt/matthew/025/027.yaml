- from: Powinieneś więc był oddać moje pieniądze bankierom, a gdybym wrócił, odebrałbym swoją własność z odsetkami.[a]
  to: Powinieneś był więc złożyć moje pieniądze[a] u bankierów, a ja po powrocie odebrałbym to, co do mnie należy, wraz z odsetkami.
  rationale: Korekta precyzuje obraz depozytu zawarty w βαλεῖν przy τραπεζίταις, zachowuje czasową funkcję ἐλθών i kontrfaktyczny skutek wyrażony przez ἐκομισάμην ἄν oraz oddaje τὸ ἐμόν idiomatycznie, bez osłabienia nacisku na własność pana. Przypis odnotowuje uzasadnioną alternatywę „srebro” dla ἀργύρια.
