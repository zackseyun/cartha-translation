id: MAT.25.27
reference: Matthew 25:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: pl
  text: Powinieneś był więc złożyć moje pieniądze[a] u bankierów, a ja po powrocie odebrałbym to, co do mnie należy, wraz z odsetkami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „moje srebro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: powinieneś był
  rationale: Imperfectum bezosobowego δέω wskazuje na powinność istniejącą w przeszłości; ta forma zachowuje ton nagany i brzmi naturalnie po polsku.
- source_word: οὖν
  choice: więc
  rationale: Spójnik wyraża wniosek wynikający z wcześniejszego zarzutu; „więc” jest jasne i naturalne.
- source_word: βαλεῖν
  choice: oddać
  rationale: Dosłownie czasownik znaczy „położyć/umieścić”, lecz w połączeniu z bankierami oznacza powierzenie im pieniędzy; „oddać ... bankierom” naturalnie oddaje tę czynność bez nadmiernie współczesnego terminologizowania.
- source_word: τὰ ἀργύριά μου
  choice: moje pieniądze
  rationale: ἀργύριον może oznaczać srebro lub pieniądze; kontekst transakcji finansowej przemawia za naturalnym polskim „pieniądze”.
- source_word: τραπεζίταις
  choice: bankierom
  rationale: τραπεζίτης oznacza osobę zajmującą się obrotem pieniędzmi lub bankowością; wzmianka o odsetkach uzasadnia wybór „bankierzy”.
- source_word: ἐλθὼν ἐγώ
  choice: gdybym wrócił
  rationale: Imiesłów ma sens czasowy, a cały skutek jest nierzeczywisty z perspektywy przeszłości; w kontekście powrotu pana naturalne jest „gdybym wrócił”.
- source_word: ἐκομισάμην ἂν
  choice: odebrałbym
  rationale: Medium κομίζω może znaczyć odebranie lub odzyskanie czegoś dla siebie, a ἄν wyraża skutek warunkowy, który nie nastąpił.
- source_word: τὸ ἐμόν
  choice: swoją własność
  rationale: Rzeczownikowo użyty zaimek dzierżawczy oznacza to, co należy do mówiącego; „swoją własność” zachowuje nacisk na prawo właściciela.
- source_word: σὺν τόκῳ
  choice: z odsetkami
  rationale: τόκος oznacza tutaj odsetki od pieniędzy; neutralny termin nie wprowadza oceny moralnej zawartej we współczesnym słowie „lichwa”.
theological_decisions:
- issue: Język finansowy przypowieści a moralna ocena pobierania odsetek
  choice: Oddać terminy finansowe neutralnie jako element obrazu przypowieści.
  alternative: Użyć słowa „lichwa”, sugerującego naganną lub nadmierną opłatę.
  rationale: Werset nie formułuje ogólnej oceny etycznej pobierania odsetek. Neutralny przekład nie wnosi do tekstu późniejszych sporów teologicznych.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano ton nagany oraz nierzeczywisty skutek odnoszący się do przeszłości. Terminologia finansowa pozostaje neutralna.
