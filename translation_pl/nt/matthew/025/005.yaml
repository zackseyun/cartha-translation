id: MAT.25.5
reference: Matthew 25:5
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: pl
  text: Gdy jednak pan młody się opóźniał[a], wszystkie zrobiły się senne i zasnęły[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „długo nie nadchodził”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „wszystkie zrobiły się senne i spały”. Greka odróżnia ogarnięcie sennością (ἐνύσταξαν) od trwania we śnie (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: się opóźniał
  rationale: Imiesłów czasu teraźniejszego χρονίζω wskazuje, że przybycie pana młodego trwało dłużej, niż oczekiwano. Polska konstrukcja „gdy… się opóźniał” naturalnie oddaje zarówno okoliczność czasową, jak i przedłużające się oczekiwanie.
- source_word: δὲ
  choice: jednak
  rationale: δέ wprowadza łagodny zwrot lub kontrast w opowiadaniu. „Jednak” dobrze łączy opóźnienie z wcześniejszym oczekiwaniem.
- source_word: νυμφίου
  choice: pan młody
  rationale: νυμφίος oznacza mężczyznę zawierającego małżeństwo. „Pan młody” jest precyzyjnym, współczesnym i naturalnym polskim określeniem w kontekście wesela.
- source_word: ἐνύσταξαν
  choice: zrobiły się senne
  rationale: Aoryst czasownika νυστάζω wyraża popadnięcie w senność. Sformułowanie to zachowuje etap senności poprzedzający właściwy sen.
- source_word: πᾶσαι
  choice: wszystkie
  rationale: Forma żeńska liczby mnogiej odsyła do wszystkich dziesięciu panien z przypowieści. „Wszystkie” jasno zachowuje rodzaj i pełny zakres wypowiedzi.
- source_word: ἐκάθευδον
  choice: zasnęły
  rationale: καθεύδω znaczy „spać”. W zestawieniu z wcześniejszym „zrobiły się senne” polskie „zasnęły” naturalnie ukazuje przejście od senności do snu, choć grecki imperfectum może też być oddany jako „spały”.
theological_decisions:
- issue: Obraz pana młodego w przypowieści
  choice: Zachować określenie „pan młody” jako element obrazu narracyjnego bez dopowiadania jego chrystologicznej identyfikacji.
  alternative: Uczynić utożsamienie pana młodego z Chrystusem jawnym w samym przekładzie.
  rationale: Szerszy kontekst Ewangelii według Mateusza nadaje temu obrazowi znaczenie teologiczne, ale sam werset pozostaje na poziomie opowiadanej przypowieści. Przekład powinien zachować możliwe odniesienie bez rozstrzygania go przez objaśniający dodatek.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Zachowano łagodny kontrast wyrażony przez δέ oraz rozróżnienie między narastającą sennością a snem; przypis sygnalizuje aspektową alternatywę przy ἐκάθευδον.
