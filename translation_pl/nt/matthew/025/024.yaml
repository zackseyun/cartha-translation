  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: pl
  text: 'Wtedy podszedł także ten, który otrzymał jeden talent, i powiedział: „Panie, wiedziałem, że jesteś twardym człowiekiem[a], żniesz tam, gdzie nie zasiałeś, i zbierasz tam, gdzie nie rozsypałeś[b]”.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „surowym człowiekiem” lub „ostrym człowiekiem”. Greckie słowo może oznaczać kogoś twardego, surowego lub ostrego.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „zbierasz stamtąd, skąd nie rozsypałeś”. W tekście greckim nie podano, co zostało rozsypane.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu wprowadza czynność poprzedzającą wypowiedź; „podszedł” naturalnie oddaje przybliżenie się sługi do pana.
- source_word: δὲ καὶ
  choice: Wtedy ... także
  rationale: δέ posuwa opowiadanie naprzód, a καί wskazuje, że również ten sługa stanął przed panem.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ten, który otrzymał jeden talent
  rationale: Konstrukcja imiesłowowa identyfikuje sługę przez to, co otrzymał. Polski czas przeszły wystarczająco jasno wskazuje wcześniejszą czynność.
- source_word: τάλαντον
  choice: talent
  rationale: Zachowuje starożytną jednostkę pieniężną i jej znaczenie w przypowieści bez doprecyzowywania rodzaju majątku.
- source_word: Κύριε
  choice: Panie
  rationale: Jest to naturalny polski wołacz wyrażający pełen szacunku zwrot do pana w przypowieści, a zarazem standardowy odpowiednik κύριος.
- source_word: ἔγνων σε ὅτι
  choice: wiedziałem, że
  rationale: W tym kontekście wyrażenie wprowadza deklarowaną wiedzę sługi o usposobieniu pana. Dosłowne zachowanie zaimka „cię” byłoby po polsku niezręczne.
- source_word: σκληρὸς ἄνθρωπος
  choice: twardym człowiekiem
  rationale: „Twardy” zachowuje metaforyczną szerokość σκληρός i nie rozstrzyga, czy chodzi przede wszystkim o surowość, bezwzględność czy nieustępliwość.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: żniesz tam, gdzie nie zasiałeś
  rationale: Zachowuje rolniczy obraz oraz ścisłą parę czasowników „żąć” i „siać”.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: zbierasz stamtąd, gdzie nie rozsypałeś
  rationale: Oddaje ὅθεν jako wskazanie źródła („stamtąd”) i nie dodaje niewystępującego w grece dopełnienia, mimo że sformułowanie pozostaje celowo eliptyczne.
theological_decisions:
- issue: Oddanie κύριος w wypowiedzi postaci przypowieści
  choice: Panie
  alternative: Mój panie / Panie mój
  rationale: „Panie” jest naturalnym zwrotem do właściciela i nie przesądza, czy w obrębie przypowieści tytuł ma dodatkowy wydźwięk chrystologiczny.
- issue: Ocena pana wyrażona przez sługę
  choice: Zarzut sługi zostaje przytoczony bez złagodzenia ani potwierdzenia jego prawdziwości.
  alternative: surowym człowiekiem
  rationale: Tekst relacjonuje ocenę sługi. „Twardym” pozostawia otwartą siłę i moralną trafność tej charakterystyki, zachowując napięcie przypowieści.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Zachowano termin „talent” oraz rolniczą metaforykę. Końcowa fraza pozostaje lekko eliptyczna, podobnie jak grecki oryginał; przypis objaśnia jej dosłowną budowę bez dopisywania „ziarna” do tekstu głównego.
