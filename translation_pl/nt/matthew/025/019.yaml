  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: pl
  text: Po długim czasie pan tamtych niewolników wraca i rozlicza się z nimi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Po długim czasie
  rationale: Μετά z biernikiem wyraża następstwo czasowe. Łagodne δέ nie wymaga osobnego odpowiednika w tym zdaniu; tok narracji jest naturalnie oddany przez początkowe „Po długim czasie”.
- source_word: ἔρχεται
  choice: wraca
  rationale: Historyczny czas teraźniejszy zachowano w polskim czasie teraźniejszym. W kontekście wcześniejszego odjazdu pana naturalne „wraca” precyzyjnie oddaje jego przybycie z powrotem.
- source_word: ὁ κύριος
  choice: pan
  rationale: W przypowieści κύριος oznacza pana stojącego nad niewolnikami, nie zaś bezpośrednio tytuł chrystologiczny. Polskie „pan” naturalnie zachowuje tę relację i zarazem nie usuwa możliwego szerszego odniesienia przypowieści.
- source_word: τῶν δούλων ἐκείνων
  choice: tamtych niewolników
  rationale: δοῦλος może oznaczać sługę lub niewolnika, ale tutaj zależność od pana i gospodarcze tło przypowieści uwydatniają status niewolny. ἐκείνων oddano jako „tamtych”.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: rozlicza się z nimi
  rationale: Grecki idiom oznacza dokonanie rozrachunku lub rozliczenie rachunków. „Rozlicza się z nimi” jest współczesne, jasne i dobrze pasuje do finansowego kontekstu talentów.
theological_decisions:
- issue: Znaczenie κύριος w przypowieści
  choice: pan
  alternative: Pan; właściciel
  rationale: Małą literą zaznaczono narracyjną rolę pana niewolników, bez narzucania w samym zdaniu bezpośredniego tytułu chrystologicznego. Jednocześnie „pan” pozostawia czytelnikowi możliwość rozpoznania szerszego znaczenia przypowieści.
- issue: Oddanie δοῦλος
  choice: niewolników
  alternative: sług
  rationale: W tej relacji gospodarczej istotny jest status osób należących do pana; „niewolników” lepiej zachowuje społeczną realność greckiego terminu niż łagodniejsze „sług”.
translation_notes:
  register: Współczesny, godny i prosty język narracyjny. Zachowano żywy czas teraźniejszy greckiej narracji. Nie dodano odpowiednika łagodnego δέ, ponieważ polski szyk z „Po długim czasie” wystarczająco prowadzi opowiadanie.
