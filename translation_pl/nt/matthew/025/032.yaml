id: MAT.25.32
reference: Matthew 25:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: pl
  text: I zostaną przed Nim zgromadzone wszystkie narody[a], a On oddzieli jednych od drugich, jak pasterz oddziela owce od kozłów[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wszyscy ludzie”; dosłownie po grecku: „wszystkie narody” (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: Greckie słowo ἐρίφων może dokładniej oznaczać „młode kozy” lub „koźlęta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: zostaną zgromadzone
  rationale: Forma przyszła strony biernej; przekład zachowuje stronę bierną i nie dodaje niewskazanego wprost wykonawcy czynności.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: przed Nim
  rationale: Naturalny i godny polski odpowiednik, zachowujący zarówno sens przestrzenny, jak i kontekst sądu.
- source_word: πάντα τὰ ἔθνη
  choice: wszystkie narody
  rationale: Najbliższy formalnie i znaczeniowo odpowiednik, który nie zawęża sensu do pogan ani nie rozstrzyga, czy chodzi o zbiorowości, czy o ludzi należących do narodów.
- source_word: ἀφορίσει
  choice: oddzieli
  rationale: Bezpośrednio oddaje rozdzielenie jednej grupy od drugiej.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: jednych od drugich
  rationale: Naturalny polski zwrot wyrażający wzajemne rozdzielenie osób należących do zgromadzonej całości.
- source_word: ὥσπερ
  choice: jak
  rationale: Zwięźle i naturalnie wprowadza porównanie; polskie „tak jak” byłoby możliwe, lecz mniej oszczędne.
- source_word: ὁ ποιμὴν
  choice: pasterz
  rationale: Rodzajnik grecki ma tu wartość uogólniającą; polszczyzna naturalnie wyraża taki przykład bez rodzajnika.
- source_word: τὰ πρόβατα
  choice: owce
  rationale: Zachowuje konkretny obraz zwierząt, bez zastępowania go zbiorowym określeniem „stado”.
- source_word: τῶν ἐρίφων
  choice: kozłów
  rationale: Naturalnie zachowuje tradycyjny kontrast owiec i kóz; przypis sygnalizuje, że grecki rzeczownik może oznaczać dokładniej młode kozy lub koźlęta.
theological_decisions:
- issue: Zakres wyrażenia πάντα τὰ ἔθνη
  choice: wszystkie narody
  alternative: wszyscy ludzie; wszyscy poganie
  rationale: Przekład zachowuje szerokość i zbiorową formę greckiego wyrażenia, nie zawężając go do pogan ani nie rozstrzygając, czy „narody” należy interpretować wyłącznie jako poszczególne osoby.
translation_notes:
  register: Współczesna, godna i jasno zbudowana polszczyzna. Wielka litera w zaimku „Nim” i „On” odpowiada polskiej konwencji odnoszenia zaimków do Chrystusa, bez dodawania treści niewyrażonej w tekście. Zachowano stronę bierną pierwszego orzeczenia oraz obraz pasterski.
