  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: pl
  text: A gdy odprawił tłumy, wszedł do łodzi i przybył w okolice Magadanu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy mają „Magdala” zamiast „Magadan”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: gdy odprawił
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą wejście do łodzi. „Gdy odprawił” brzmi naturalnie po polsku i zachowuje sens odesłania zgromadzonych ludzi.
- source_word: τοὺς ὄχλους
  choice: tłumy
  rationale: Liczba mnoga greckiego rzeczownika została zachowana; „tłumy” to współczesne i zrozumiałe określenie zgromadzonych ludzi.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: wszedł do łodzi
  rationale: Grecki zwrot opisuje wejście na pokład. W odniesieniu do niewielkiej łodzi naturalnym polskim odpowiednikiem jest „wszedł do łodzi”.
- source_word: ἦλθεν
  choice: przybył
  rationale: W opisie podróży ἔρχομαι wskazuje na dotarcie do miejsca. „Przybył” naturalnie oddaje ten sens bez narzucania perspektywy wyrażanej przez polskie „przyszedł”.
- source_word: τὰ ὅρια
  choice: okolice
  rationale: Liczba mnoga dosłownie oznacza granice, lecz w tym użyciu odnosi się do obszaru lub rejonu. „Okolice” jest naturalnym polskim odpowiednikiem geograficznym.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: Tekst SBLGNT ma formę Μαγαδάν, dlatego w tekście głównym zachowano nazwę „Magadan”, odmienioną zgodnie z polską składnią jako „Magadanu”.
theological_decisions:
- issue: Wariant nazwy miejsca na końcu wersetu
  choice: Magadan
  alternative: Magdala
  rationale: Jest to kwestia tekstualna i geograficzna, nie doktrynalna. Tekst główny przekłada odczyt SBLGNT Μαγαδάν, a znany wariant „Magdala” podaje w przypisie.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zdanie zachowuje kolejność wydarzeń z greckiego tekstu, a nazwę miejsca podaje zgodnie z tekstem źródłowym.
