  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: pl
  text: I przyszły do Niego liczne tłumy, przyprowadzając ze sobą niemych[a], niewidomych, kulawych, ludzi z niesprawnymi kończynami[b] oraz wielu innych. Złożyli ich u Jego stóp, a On ich uzdrowił.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „niesłyszących”. Greckie κωφούς może oznaczać osoby niesłyszące, niemówiące albo dotknięte obiema trudnościami, zależnie od kontekstu.'
    reason: lexical_alternative
  - marker: b
    text: Greckie κυλλούς odnosi się szeroko do osób z uszkodzonymi, zdeformowanymi lub niesprawnymi kończynami; tradycyjnie bywa oddawane jako „okaleczonych”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: przyszły do
  rationale: Naturalny polski odpowiednik czasownika oznaczającego przyjście lub zbliżenie się do kogoś; dobrze oddaje ruch tłumów ku Jezusowi.
- source_word: ὄχλοι πολλοὶ
  choice: wielkie tłumy
  rationale: Idiomaticzne sformułowanie zachowujące liczbę mnogą i wskazujące na znaczną liczbę zgromadzonych ludzi.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: przyprowadzając ze sobą
  rationale: Konstrukcja dosłownie znaczy „mając ze sobą”, lecz w kontekście opisuje sprowadzenie chorych do Jezusa; imiesłów zachowuje zależność od czynności głównej.
- source_word: κωφούς
  choice: niemych
  rationale: κωφός może określać osobę niesłyszącą, niemówiącą albo dotkniętą obiema trudnościami. „Niemych” jest zwięzłe i kontekstowo uzasadnione, a nieusuwalną wieloznaczność wskazuje przypis.
- source_word: τυφλούς
  choice: niewidomych
  rationale: Współczesny, naturalny i precyzyjny odpowiednik τυφλούς.
- source_word: χωλούς
  choice: kulawych
  rationale: Zwięzły odpowiednik określający osoby mające trudności z chodzeniem; zachowuje odrębność tej grupy w wyliczeniu.
- source_word: κυλλούς
  choice: ludzi z niesprawnymi kończynami
  rationale: Oddaje szeroki sens uszkodzonych, zdeformowanych lub niesprawnych kończyn, a zarazem unika współcześnie obraźliwie brzmiącego rzeczownikowego określenia.
- source_word: ἑτέρους πολλούς
  choice: wielu innych
  rationale: Naturalnie odnosi się do dalszych osób cierpiących na niewymienione dolegliwości.
- source_word: ἔρριψαν
  choice: złożyli
  rationale: Choć czasownik może dosłownie znaczyć „rzucili”, w tej scenie oznacza umieszczenie przyniesionych osób przed Jezusem. „Złożyli” zachowuje energię czynności, nie sugerując bezpodstawnie brutalności.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: u Jego stóp
  rationale: Naturalny polski zwrot zachowujący obraz umieszczenia potrzebujących bezpośrednio przed Jezusem.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: Standardowy polski odpowiednik w ewangelicznych relacjach o przywracaniu zdrowia.
