id: MAT.15.27
reference: Matthew 15:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: pl
  text: 'Ona zaś powiedziała: „Tak, Panie[b], bo przecież nawet pieski[a] jedzą okruszyny spadające ze stołu swoich panów”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greka używa formy zdrobniałej; można ją też rozumieć jako „psy”, „małe psy” lub „psy domowe”, niekoniecznie „szczenięta”.
    reason: lexical_alternative
  - marker: b
    text: „Panie” może być tutaj również pełnym szacunku zwrotem podobnym do „proszę pana”; przekład zachowuje jednak zwyczajowe ewangeliczne oddanie słowa κύριος.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Tak
  rationale: Proste, naturalne potwierdzenie; zachowuje zgodę kobiety z poprzednią wypowiedzią Jezusa.
- source_word: κύριε
  choice: Panie
  rationale: Polski wołacz oddaje bezpośredni zwrot. Może wyrażać zarówno szacunek, jak i uznanie autorytetu Jezusa, dlatego zachowuje zakres możliwy w tym kontekście.
- source_word: καὶ γὰρ
  choice: bo przecież nawet
  rationale: „Bo” oddaje funkcję uzasadniającą γάρ, a „przecież nawet” — addytywno-wzmacniający sens καί oraz sposób, w jaki kobieta podejmuje i rozwija porównanie.
- source_word: κυνάρια
  choice: pieski
  rationale: Zdrobnienie zachowuje formalny niuans greckiego κυνάρια i pasuje do obrazu zwierząt przebywających przy domowym stole, nie przesądzając, czy chodzi konkretnie o szczenięta.
- source_word: ἐσθίει
  choice: jedzą
  rationale: Grecki czasownik jest formalnie w liczbie pojedynczej przy podmiocie rodzaju nijakiego w liczbie mnogiej; polszczyzna wymaga tu liczby mnogiej.
- source_word: ψιχίων
  choice: okruszyny
  rationale: Precyzyjnie oddaje małe kawałki jedzenia spadające ze stołu i zachowuje zwyczajny, domowy obraz.
- source_word: τῶν πιπτόντων
  choice: spadające
  rationale: Imiesłów naturalnie oddaje grecki imiesłów czasu teraźniejszego i jego ogólny, powtarzalny sens.
- source_word: τραπέζης
  choice: stołu
  rationale: Podstawowy sens rzeczownika i centralny element domowego obrazu.
- source_word: τῶν κυρίων αὐτῶν
  choice: swoich panów
  rationale: Zaimek zwrotny jasno wiąże panów z psami, a „panów” naturalnie opisuje relację zwierząt do ludzi sprawujących nad nimi władzę.
theological_decisions:
- issue: Znaczenie κύριε w bezpośrednim zwrocie do Jezusa
  choice: Panie
  alternative: proszę pana
  rationale: „Panie” zachowuje typowy dla Ewangelii sposób zwracania się do Jezusa oraz możliwą głębię teologiczną, nie wykluczając użycia jako zwrotu pełnego szacunku.
- issue: Siła zdrobnienia w κυνάρια
  choice: pieski
  alternative: psy; psy domowe; szczenięta
  rationale: Forma grecka jest zdrobniała, lecz nie rozstrzyga jednoznacznie wieku zwierząt. „Pieski” zachowuje ten niuans bez zawężania znaczenia do szczeniąt i bez łagodzenia całego porównania przez rozbudowaną parafrazę.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Składnia pozostaje bliska greckiemu tokowi argumentacji, ale brzmi naturalnie. „Bo przecież nawet” uwydatnia, że kobieta nie odrzuca porównania, lecz na jego podstawie uzasadnia swoją prośbę.
