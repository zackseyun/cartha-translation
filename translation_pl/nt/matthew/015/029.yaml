source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: pl
  text: Jezus odszedł stamtąd i przybył nad Morze Galilejskie[a]. Następnie wszedł na górę i tam siedział[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „szedł wzdłuż Morza Galilejskiego”. Grecki przyimek może wskazywać zarówno przybycie nad brzeg, jak i ruch wzdłuż niego.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie czasownik ma formę niedokonaną i opisuje trwającą czynność: „siedział”. W naturalnym polskim w tym kontekście można też powiedzieć: „usiadł”.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: odszedł stamtąd
  rationale: Imiesłów aorystu wskazuje czynność poprzedzającą przybycie nad jezioro. Polski czasownik osobowy brzmi naturalniej niż konstrukcja „odszedłszy”, a zarazem zachowuje kolejność wydarzeń.
- source_word: ἦλθεν
  choice: przybył
  rationale: Narracyjny aoryst czasownika ἔρχομαι oznacza dotarcie do wskazanego miejsca; „przybył” dobrze współgra z przyimkowym określeniem brzegu.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: nad Morze Galilejskie
  rationale: παρά z biernikiem przy czasowniku ruchu może oznaczać przybycie w pobliże brzegu albo ruch wzdłuż niego. Tekst główny oddaje pierwszy sens, a przypis zachowuje drugi. „Morze Galilejskie” zachowuje tradycyjną nazwę odpowiadającą greckiemu θάλασσα.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: wszedł na górę
  rationale: Naturalna polska konstrukcja oddaje wznoszący ruch oraz czynność wcześniejszą względem siedzenia; rodzajnik nie musi wskazywać góry mającej własną nazwę.
- source_word: ἐκάθητο ἐκεῖ
  choice: tam siedział
  rationale: Imperfectum przedstawia trwającą pozycję lub stan. Niedokonane „siedział” zachowuje ten aspekt lepiej niż dynamiczne „usiadł”.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Dwa greckie imiesłowy aorystu rozwinięto w polskie czasowniki osobowe, aby uniknąć książkowych form „odszedłszy” i „wszedłszy”. Zachowano niedokonany aspekt ἐκάθητο oraz nie rozstrzygnięto bez przypisu przestrzennej wieloznaczności παρά.
