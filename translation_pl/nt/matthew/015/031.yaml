  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: pl
  text: Tak że tłum zdumiewał się, widząc, że niemi[a] mówią, okaleczeni odzyskali sprawność[b], chromi chodzą, a niewidomi widzą. I oddali chwałę Bogu Izraela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „głusi mówią”. Greckie słowo może oznaczać osoby głuche albo nieme; tutaj wzmianka o mówieniu wskazuje raczej na niemych.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „okaleczeni są zdrowi”. Greckie słowo opisuje osoby z niesprawnymi lub okaleczonymi kończynami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: tak że
  rationale: Naturalnie oddaje skutek wcześniejszych uzdrowień i zachowuje wynikowy charakter greckiego spójnika.
- source_word: τὸν ὄχλον
  choice: tłum
  rationale: Współczesny i bezpośredni odpowiednik rzeczownika ὄχλος w tej scenie narracyjnej.
- source_word: θαυμάσαι
  choice: zdumiewał się
  rationale: Oddaje silne zdziwienie i podziw wywołane oglądanymi uzdrowieniami.
- source_word: βλέποντας
  choice: widząc, że
  rationale: Imiesłów odnosi się do tłumu i wskazuje, co było przyczyną jego zdumienia; konstrukcja jest naturalna po polsku.
- source_word: κωφοὺς
  choice: niemi
  rationale: κωφός może oznaczać osobę głuchą lub niemą, lecz następujące λαλοῦντας („mówią”) wskazuje tu przede wszystkim na odzyskanie mowy.
- source_word: λαλοῦντας
  choice: mówią
  rationale: Prosty odpowiednik λαλέω, zachowujący kontrast z wcześniejszą niemożnością mówienia.
- source_word: κυλλοὺς
  choice: kalecy
  rationale: Zwięźle oddaje osoby z niesprawnymi lub okaleczonymi kończynami; szerszy zakres słowa objaśnia przypis.
- source_word: ὑγιεῖς
  choice: są zdrowi
  rationale: Bezpośrednio oddaje orzecznikowy przymiotnik ὑγιεῖς, bez dodawania nieobecnej w tekście strony biernej.
- source_word: χωλοὺς
  choice: chromi
  rationale: Tradycyjny, nadal zrozumiały i precyzyjny polski odpowiednik w kontekście uzdrowienia osób niemogących prawidłowo chodzić.
- source_word: περιπατοῦντας
  choice: chodzą
  rationale: W tym wykazie uzdrowień czasownik ma dosłowne znaczenie chodzenia.
- source_word: τυφλοὺς βλέποντας
  choice: niewidomi widzą
  rationale: Zachowuje zwięzłość i równoległą budowę greckiego wyliczenia.
- source_word: ἐδόξασαν
  choice: oddali chwałę
  rationale: Idiomaticzne polskie wyrażenie zachowuje teologiczny sens przypisywania chwały Bogu.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Bogu Izraela
  rationale: Wiernie zachowuje określenie Boga przez Jego związek z Izraelem.
theological_decisions:
- issue: Znaczenie κωφούς w połączeniu κωφοὺς λαλοῦντας
  choice: niemi mówią
  alternative: głusi mówią
  rationale: Grecki przymiotnik może odnosić się do głuchoty albo niemożności mówienia. Bezpośredni kontrast z „mówią” przemawia za znaczeniem „niemi”, a alternatywę zachowano w przypisie.
- issue: Oddanie δοξάζω w odniesieniu do Boga
  choice: oddali chwałę Bogu Izraela
  alternative: wysławiali Boga Izraela
  rationale: Wyrażenie „oddali chwałę” jasno ukazuje, że cudowne czyny wywołały uznanie i uczczenie Boga, a zarazem zachowuje mocny sens δοξάζω.
- issue: Stan osób określonych jako κυλλοί
  choice: kalecy są zdrowi
  alternative: okaleczeni odzyskują sprawność
  rationale: Tekst grecki używa przymiotnika ὑγιεῖς („zdrowi”), nie czasownika oznaczającego przywrócenie. Dosłowniejszą konstrukcję zachowano w tekście, a bardziej objaśniającą możliwość podano w przypisie.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Zachowano rytmiczne wyliczenie cudów oraz rozróżnienie między „kalekimi” (κυλλοί) a „chromymi” (χωλοί). Forma „chromi” jest nieco podniosła, ale powszechnie rozpoznawalna w polszczyźnie biblijnej; pozostała składnia jest nowoczesna i przejrzysta.
