  naturalness: „Była uzdrowiona” brzmi po polsku nienaturalnie i może sugerować stan bierny bez wyraźnego sensu odzyskanego zdrowia. „Była zdrowa” jest idiomatyczne i, wraz z „od tamtej godziny”, właściwie oddaje trwały skutek uzdrowienia. Przypis b należy umieścić przy wyrażeniu czasowym, którego dotyczy.
  terminology: „Wiara” jest trafnym podstawowym odpowiednikiem πίστις; przypis słusznie wskazuje „ufność” jako możliwy odcień. „O kobieto” zachowuje podniosły, bezpośredni charakter greckiego zwrotu, nie wprowadzając nieuzasadnionego zabarwienia.
