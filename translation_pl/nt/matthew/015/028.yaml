  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: pl
  text: 'Wtedy Jezus odpowiedział jej: „O kobieto, wielka jest twoja wiara[a]. Niech ci się stanie, jak pragniesz”. I od tamtej godziny[b] jej córka była zdrowa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „wielka jest twoja ufność”. Greckie πίστις może oznaczać wiarę, ufność lub wierność; tutaj chodzi przede wszystkim o ufne zwrócenie się do Jezusa.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „od tamtej chwili”. Dosłownie po grecku: „od tamtej godziny”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski znacznik następstwa, łączący odpowiedź Jezusa z poprzedzającą rozmową.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: Jezus odpowiedział jej
  rationale: Grecka konstrukcja z imiesłowem i czasownikiem mówienia jest idiomatycznie oddana jednym polskim czasownikiem; „jej” zachowuje αὐτῇ.
- source_word: Ὦ γύναι
  choice: O kobieto
  rationale: Zachowuje emfatyczny, bezpośredni zwrot. W tym kontekście „kobieto” nie jest określeniem obraźliwym.
- source_word: μεγάλη σου ἡ πίστις
  choice: wielka jest twoja wiara
  rationale: Zachowuje nacisk wynikający z wysunięcia orzecznika oraz podstawowe znaczenie πίστις w kontekście ufnego zwrócenia się do Jezusa.
- source_word: γενηθήτω σοι
  choice: Niech ci się stanie
  rationale: Oddaje aorystyczny imperatyw strony biernej oraz uroczysty, sprawczy charakter wypowiedzi.
- source_word: ὡς θέλεις
  choice: jak pragniesz
  rationale: „Pragniesz” naturalnie i godnie oddaje θέλω, unikając nadmiernie potocznego „chcesz”.
- source_word: ἰάθη
  choice: była uzdrowiona
  rationale: Oddaje bierną formę czasownika ἰάομαι i rezultat uzdrowienia córki.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: od tamtej godziny
  rationale: Formalnie zachowuje grecki idiom, który może znaczyć także „od tamtej chwili”.
theological_decisions:
- issue: Znaczenie πίστις w pochwale Jezusa
  choice: wiara
  alternative: ufność
  rationale: „Wiara” jest podstawowym odpowiednikiem i dobrze pasuje do ufnego nalegania kobiety; przypis zachowuje istotny odcień „ufności” bez rozstrzygania ponad tekst.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Szyk „wielka jest twoja wiara” zachowuje nacisk oryginału, a „O kobieto” jego uroczysty bezpośredni zwrot. Wszystkie znaczące warianty leksykalne zachowano w przypisach.
