  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: pl
  text: Ten lud czci mnie wargami, lecz ich serce[a] jest daleko ode mnie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ich serca”. W tekście greckim „serce” występuje w liczbie pojedynczej, prawdopodobnie zbiorowo w odniesieniu do całego ludu.'
    reason: 'Alternatywa gramatyczno-leksykalna: polska liczba mnoga jest bardziej rozdzielcza, natomiast liczba pojedyncza dokładniej zachowuje formę grecką.'
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Ten lud
  rationale: „Lud” zachowuje zbiorowy charakter λαός, a „ten” oddaje wskazujące οὗτος i nawiązuje do prorockiego brzmienia cytatu.
- source_word: τοῖς χείλεσίν
  choice: wargami
  rationale: Celownik ma znaczenie narzędziowe. Konkretne „wargami” zachowuje obraz źródłowy i brzmi naturalnie po polsku.
- source_word: με τιμᾷ
  choice: czci mnie
  rationale: τιμάω oznacza tutaj okazywanie czci; „czci” jest zwięzłe, współczesne i nie wzmacnia sensu do „uwielbia”.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: lecz ich serce
  rationale: „Lecz” oddaje przeciwstawne δέ. Liczba pojedyncza „serce” zachowuje grecki zbiorowy sposób przedstawienia wewnętrznej postawy całego ludu, natomiast „ich” odpowiada liczbie mnogiej αὐτῶν.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: jest daleko ode mnie
  rationale: Zwrot wyraża pozostawanie w znacznej odległości. Polski odpowiednik zachowuje zarówno obraz dystansu, jak i jego relacyjny wydźwięk, bez dopowiadania przyczyny.
theological_decisions:
- issue: Zbiorowa liczba pojedyncza „serce” czy rozdzielcza liczba mnoga
  choice: 'Zachowano liczbę pojedynczą: „ich serce”.'
  alternative: „ich serca”
  rationale: Greckie καρδία występuje w liczbie pojedynczej i ujmuje lud jako zbiorowość o wspólnej postawie wewnętrznej. Zachowanie tej formy podtrzymuje napięcie między zewnętrzną czcią a wspólnym stanem wewnętrznym, nie wykluczając odniesienia do poszczególnych osób.
translation_notes:
  register: Współczesny, godny i prosty rejestr. Zachowano konkretny obraz „warg” oraz celowo nieco wyraziste zbiorowe sformułowanie „ich serce”; uniknięto archaizmu „czci mię” i interpretacyjnego rozszerzenia „tylko słowami”.
