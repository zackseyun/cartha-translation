id: MAT.15.3
reference: Matthew 15:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: pl
  text: 'On zaś odpowiedział im: „Dlaczego i wy łamiecie przykazanie Boga ze względu na waszą tradycję?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: On zaś odpowiedział im
  rationale: Polskie „odpowiedział” naturalnie oddaje semityzującą konstrukcję imiesłowu z czasownikiem mówienia; dosłowne „odpowiadając, powiedział” byłoby nienaturalne. „Zaś” zachowuje przeciwstawny zwrot odpowiedzi.
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Naturalny polski odpowiednik pytania o przyczynę.
- source_word: καὶ ὑμεῖς
  choice: i wy
  rationale: 'Zachowuje nacisk na odpowiedź wobec wcześniejszego zarzutu: rozmówcy również dopuszczają się przekroczenia.'
- source_word: παραβαίνετε
  choice: przekraczacie
  rationale: Oddaje sens naruszania lub przekraczania ustanowionego nakazu, zachowując podniosły, lecz zrozumiały rejestr.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: przykazanie Boga
  rationale: „Przykazanie” zachowuje biblijny i przymierzowy ton ἐντολή oraz wyraźny kontrast z ludzką tradycją.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: ze względu na waszą tradycję
  rationale: διά z biernikiem wskazuje tu powód lub rację działania. „Ze względu na” zachowuje pewną otwartość między sensem „z powodu” a „dla dobra”, bez przesadnego rozstrzygania motywacji.
theological_decisions:
- issue: Kontrast między przykazaniem Boga a ludzką tradycją
  choice: przykazanie Boga / wasza tradycja
  alternative: nakaz Boga / wasz zwyczaj lub nauka
  rationale: Bezpośrednie odpowiedniki zachowują napięcie tekstu i ograniczają krytykę do tradycji rozmówców będącej przedmiotem sporu, nie sugerując potępienia każdej tradycji.
translation_notes:
  register: Współczesny, godny i przystępny polski. Konstrukcję ἀποκριθεὶς εἶπεν wygładzono zgodnie z polskim idiomem, bez utraty funkcji odpowiedzi. Nie dodano przypisu, ponieważ „ze względu na” wystarczająco zachowuje zakres znaczeniowy wyrażenia przyczynowego.
