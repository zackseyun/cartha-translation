source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: pl
  text: A to, co wychodzi z ust, pochodzi z serca i to czyni człowieka nieczystym[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „kala człowieka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: to, co wychodzi
  rationale: Naturalna polska konstrukcja rzeczownikowa oddaje ogólnie wszystko, co wydobywa się z ust, bez zawężania tego wyłącznie do pojedynczych słów.
- source_word: ἐκ τοῦ στόματος
  choice: z ust
  rationale: Zachowuje dosłowny obraz ust oraz kontekst wypowiedzi.
- source_word: ἐκ τῆς καρδίας
  choice: z serca
  rationale: „Serce” zachowuje biblijne określenie wewnętrznego człowieka, obejmujące myśli, zamiary i postawę moralną.
- source_word: κἀκεῖνα
  choice: i właśnie to
  rationale: Wyraźnie odsyła do tego, co wychodzi z ust, a partykuła „właśnie” naturalnie podkreśla wskazujący charakter greckiego ἐκεῖνα.
- source_word: κοινοῖ
  choice: czyni nieczystym
  rationale: W kontekście sporu o czystość sformułowanie to jasno oddaje sens uznania człowieka za nieczystego; tradycyjne „kala” podano jako zwięzłą alternatywę.
- source_word: τὸν ἄνθρωπον
  choice: człowieka
  rationale: Polskie „człowieka” naturalnie zachowuje reprezentatywną liczbę pojedynczą i odnosi się do osoby ludzkiej bez nieuzasadnionego zawężenia do mężczyzny.
theological_decisions:
- issue: Źródło nieczystości moralnej
  choice: Nieczystość człowieka pochodzi z jego wnętrza — z serca — i ujawnia się w tym, co wychodzi z ust.
  alternative: Odczytanie ograniczone wyłącznie do rytualnej nieczystości wywołanej mową.
  rationale: Najbliższy kontekst przeciwstawia to, co wchodzi do ust, temu, co wychodzi z serca. Przekład zachowuje zarówno język czystości, jak i wskazanie na wewnętrzne źródło, bez rozstrzygania ponad tekst relacji między wymiarem rytualnym a moralnym.
- issue: Reprezentatywna liczba pojedyncza ἄνθρωπον
  choice: człowieka
  alternative: osobę
  rationale: „Człowieka” wiernie i idiomatycznie oddaje greckie ἄνθρωπον jako ogólne określenie istoty ludzkiej oraz zachowuje liczbę pojedynczą.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Powtórzenie „to” podtrzymuje tok greckiego zdania, a „czyni człowieka nieczystym” zachowuje związek z kontekstem czystości, pozostając zrozumiałe dla zwykłego czytelnika.
