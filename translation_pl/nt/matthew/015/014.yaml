  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: pl
  text: Zostawcie ich w spokoju. To ślepi przewodnicy ślepych. A jeśli ślepy prowadzi ślepego, obaj wpadną do dołu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „do rowu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Zostawcie ich
  rationale: Aorystowy tryb rozkazujący ἀφίημι w tym kontekście znaczy „zostawić, dać spokój”, a zaimek odnosi się do faryzeuszy. Zwięzłe „Zostawcie ich” zachowuje stanowczą, oddalającą siłę polecenia.
- source_word: τυφλοί
  choice: ślepi
  rationale: Orzecznikowy przymiotnik zachowuje metaforę braku rozeznania, bez dopowiadania jej duchowego sensu w tekście głównym.
- source_word: ὁδηγοὶ τυφλῶν
  choice: przewodnicy ślepych
  rationale: Dosłowne i naturalne odwzorowanie obrazu; „przewodnicy” lepiej niż „przywódcy” łączy się z następnym zdaniem o prowadzeniu.
- source_word: τυφλὸς ... τυφλὸν
  choice: ślepy ... ślepego
  rationale: Polski rzeczownikowo użyty przymiotnik naturalnie zachowuje męską liczbę pojedynczą greckiej sentencji, a zarazem ma charakter ogólny.
- source_word: δὲ
  choice: A
  rationale: δέ wprowadza dalszy, lekko przeciwstawny rozwój wypowiedzi. Polskie „A” brzmi naturalnie w sentencji i nie wzmacnia kontrastu ponad miarę.
- source_word: ἐὰν ὁδηγῇ
  choice: jeśli ... prowadzi
  rationale: ἐάν z trybem łączącym wyraża warunek ogólny. „Prowadzi” jest naturalne po polsku i zachowuje obraz przewodnictwa.
- source_word: ἀμφότεροι
  choice: obaj
  rationale: Forma odnosi się do dwóch postaci wyrażonych w rodzaju męskim; „obaj” jest precyzyjne i zwięzłe.
- source_word: εἰς βόθυνον
  choice: do dołu
  rationale: βόθυνος może oznaczać dół, jamę lub rów. „Dół” jest szerokim, obrazowym i naturalnym odpowiednikiem; alternatywę podano w przypisie.
- source_word: πεσοῦνται
  choice: wpadną
  rationale: Przy kierunkowym εἰς polskie „wpadną do” naturalniej oddaje ruch do wnętrza niż dosłowne „upadną do”, zachowując przyszły skutek warunku.
theological_decisions:
- issue: Metaforyczny sens ślepoty
  choice: Zachować określenie „ślepi” bez objaśnienia w tekście głównym.
  alternative: „duchowo ślepi” albo „nierozumni przewodnicy”
  rationale: Grecki tekst posługuje się metaforą i nie objaśnia jej w samym wersecie. Dopowiedzenie zawężałoby sens i osłabiałoby obraz.
- issue: Rodzaj gramatyczny w sentencji
  choice: Użyć form „ślepy ... ślepego” oraz „obaj”.
  alternative: „osoba niewidoma ... osobę niewidomą” oraz „oboje”
  rationale: Greka ma reprezentatywną męską liczbę pojedynczą. Polski pozwala zachować tę formę sentencjonalną bez twierdzenia, że zasada dotyczy wyłącznie mężczyzn.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Zachowano paralelizm oraz przysłowiowy charakter wypowiedzi, unikając zarówno archaizmu „ślepiec”, jak i objaśniających parafraz.
