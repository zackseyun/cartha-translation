source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: pl
  text: 'Wy zaś mówicie: „Kto powie ojcu lub matce: «Darem[a] jest to, czym mógłbym cię wesprzeć»,…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ofiarą”. Chodzi o uznanie za poświęcone Bogu tego, co mogłoby posłużyć do wsparcia rodziców; por. Mk 7:11, gdzie użyto określenia „korban”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Wy zaś mówicie
  rationale: Zaimek ὑμεῖς jest emfatyczny, a δὲ wyraża przeciwstawienie wobec przytoczonego wcześniej przykazania; „zaś” zachowuje kontrast w naturalnej polszczyźnie.
- source_word: Ὃς ἂν εἴπῃ
  choice: Kto powie
  rationale: Konstrukcja zaimka względnego z ἄν i aorystem trybu łączącego wyraża ogólny, nieokreślony przypadek; „kto powie” oddaje go zwięźle i idiomatycznie.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ojcu lub matce
  rationale: Celownik wskazuje adresatów wypowiedzi. Polski nie wymaga tu zaimka dzierżawczego, ponieważ więź rodzinna jest jasna z kontekstu.
- source_word: Δῶρον
  choice: Darem
  rationale: δῶρον oznacza dar lub ofiarę. Narzędnik tworzy naturalne orzeczenie imienne („darem jest”) i zachowuje podstawowe znaczenie bez wprowadzania terminu „korban”, którego Mateusz nie używa.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: to, czym mógłbym cię wesprzeć
  rationale: Zwrot odnosi się do korzyści lub pomocy, którą rodzic mógłby otrzymać od mówiącego. „Wesprzeć” naturalnie obejmuje w tym kontekście utrzymanie rodziców, a forma „mógłbym” zachowuje potencjalny charakter niewyświadczonej pomocy.
theological_decisions:
- issue: Czy wprowadzić techniczny termin „korban” do tekstu Mateusza
  choice: Zachować słowo „dar” w tekście głównym
  alternative: „korban” lub „ofiara poświęcona Bogu”
  rationale: Mateusz ma δῶρον, nie κορβᾶν występujące w Mk 7:11. Znaczenie poświęcenia Bogu należy objaśnić w przypisie, a nie dopisywać do tekstu głównego.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Szyk „Darem jest to…” zachowuje nacisk położony w grece na Δῶρον. Wielokropek wskazuje, że zdanie składniowo trwa dalej w wersecie 6; nie stanowi dodatku znaczeniowego.
