source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: pl
  text: 'Lecz on nie odpowiedział jej ani słowem. A jego uczniowie podeszli do niego i nie przestawali go prosić: „Odeślij ją[a], bo woła za nami[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Słowa uczniów nie rozstrzygają, czy proszą Jezusa, aby spełnił jej prośbę i ją odprawił, czy po prostu kazał jej odejść.
    reason: alternative_reading
  - marker: b
    text: Greckie wyrażenie może znaczyć zarówno „za nami”, jak i „idąc za nami”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῇ λόγον
  choice: nie odpowiedział jej ani słowem
  rationale: 'Naturalny polski idiom zachowuje emfatyczny sens greckiego wyrażenia: Jezus nie udzielił jej żadnej odpowiedzi.'
- source_word: προσελθόντες
  choice: podeszli
  rationale: Imiesłów wskazuje, że uczniowie zbliżyli się do Jezusa; „podeszli” jest zwięzłe i naturalne w narracji.
- source_word: ἠρώτουν
  choice: nie przestawali go prosić
  rationale: Imperfectum wskazuje na trwającą lub ponawianą prośbę. To sformułowanie oddaje jej uporczywość, nie nadając czasownikowi nadmiernie silnego znaczenia „błagali”.
- source_word: Ἀπόλυσον αὐτήν
  choice: Odeślij ją
  rationale: Oddaje polecenie odprawienia kobiety, a zarazem nie rozstrzyga, czy uczniowie chcieli, by Jezus najpierw spełnił jej prośbę.
- source_word: κράζει
  choice: woła
  rationale: Czasownik oznacza głośne wołanie. Polski czas teraźniejszy naturalnie wyraża trwającą czynność.
- source_word: ὄπισθεν ἡμῶν
  choice: za nami
  rationale: Polskie „za nami” dobrze zachowuje możliwość rozumienia zarówno położenia z tyłu, jak i podążania za grupą.
theological_decisions:
- issue: Zamiar uczniów wyrażony w Ἀπόλυσον αὐτήν
  choice: Neutralne „Odeślij ją”
  alternative: „Spełnij jej prośbę i odpraw ją” albo „Odpraw ją od nas”
  rationale: Grecki rozkaźnik nie precyzuje, czy uczniowie chcieli, aby Jezus spełnił prośbę kobiety przed jej odejściem, czy tylko ją oddalił. Przekład zachowuje tę narracyjną i interpretacyjną niejednoznaczność.
translation_notes:
  register: Współczesny, godny styl narracyjny. Zastosowano małe litery w zaimkach odnoszących się do Jezusa, zgodnie ze standardową współczesną polszczyzną przekładową. Powtórzenie zaimków pozostaje naturalne, a konstrukcja „ani słowem” wzmacnia całkowity brak odpowiedzi.
