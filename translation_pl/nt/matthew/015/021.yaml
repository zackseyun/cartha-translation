base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: pl
  text: A Jezus, opuściwszy tamto miejsce, wycofał się w okolice Tyru i Sydonu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „udał się w rejon Tyru i Sydonu”. Grecki czasownik można oddać bardziej neutralnie, jednak „wycofał się” odzwierciedla powracające u Mateusza użycie tego czasownika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: A
  rationale: Prosty spójnik zachowuje ciągłość narracji z poprzednim fragmentem.
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: odszedł stamtąd
  rationale: Naturalny polski odpowiednik uprzedniej czynności wyrażonej imiesłowem aorystu; oddaje opuszczenie wcześniejszego miejsca bez dopowiadania motywu.
- source_word: ἀνεχώρησεν
  choice: wycofał się
  rationale: Zachowuje charakterystyczny dla Mateusza odcień odejścia lub usunięcia się, lecz nie sugeruje tak mocno porażki jak „uciekł” czy „ustąpił”.
- source_word: εἰς τὰ μέρη
  choice: w okolice
  rationale: Idiomaticznie wskazuje na obszar związany z miastami, nie przesądzając, że Jezus wszedł do samych miast.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Tyru i Sydonu
  rationale: Stosuje utrwalone polskie formy nazw geograficznych oraz dopełniacz wymagany przez rzeczownik „okolice”.
theological_decisions:
- issue: Odcień znaczeniowy ruchu Jezusa ku obszarowi kojarzonemu z poganami
  choice: „wycofał się” bez wskazywania przyczyny
  alternative: „udał się” lub „odszedł” jako przekład bardziej neutralny
  rationale: Czasownik może sugerować celowe usunięcie się, szczególnie w Mateuszowym użyciu, lecz werset nie podaje motywu. Przekład zachowuje ten odcień bez narzucania wyjaśnienia teologicznego lub psychologicznego.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. „Okolice Tyru i Sydonu” brzmią naturalnie po polsku i zachowują geograficzną ogólność oryginału.
