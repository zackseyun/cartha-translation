id: MAT.15.9
reference: Matthew 15:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: pl
  text: Lecz na próżno oddają mi cześć, nauczając ludzkich nakazów jako nauk[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nauczając nauk, które są nakazami ludzi”.'
    reason: Grecka fraza jest składniowo zwięzła i może być rozumiana apozycyjnie.
lexical_decisions:
- source_word: μάτην
  choice: na próżno
  rationale: Naturalny polski odpowiednik znaczenia „bez skutku, daremnie”; zachowuje osądzający ton cytatu.
- source_word: δὲ
  choice: lecz
  rationale: Oddaje łagodny kontrast wprowadzany przez δέ i dobrze pasuje do polemicznego kontekstu.
- source_word: σέβονταί με
  choice: oddają mi cześć
  rationale: σέβομαι oznacza okazywanie religijnej czci; ten zwrot jest naturalny po polsku i jasno wskazuje na kult skierowany ku Bogu.
- source_word: διδάσκοντες
  choice: nauczając
  rationale: Imiesłów zachowuje zależność od głównego orzeczenia i przedstawia okoliczność lub sposób, w jaki ich cześć okazuje się daremna.
- source_word: διδασκαλίας
  choice: jako nauk
  rationale: Ujęcie z „jako” wyraża sens, że ludzkim nakazom nadaje się rangę autorytatywnego nauczania, a zarazem unika zawężającego terminu „doktryny”.
- source_word: ἐντάλματα ἀνθρώπων
  choice: ludzkich nakazów
  rationale: „Nakazy” oddają przepisy lub polecenia, natomiast przymiotnik „ludzkich” naturalnie wyraża ogólne znaczenie ἀνθρώπων i kontrastuje ludzkie pochodzenie z Bożym.
theological_decisions:
- issue: Relacja składniowa między διδασκαλίας a ἐντάλματα ἀνθρώπων
  choice: nauczając ludzkich nakazów jako nauk
  alternative: nauczając nauk, które są nakazami ludzi
  rationale: Grecka konstrukcja jest zwięzła i dopuszcza ujęcie apozycyjne. Tekst główny jasno przekazuje, że ludzkie nakazy są nauczane z rangą nauki, a przypis zachowuje mniej interpretacyjne, apozycyjne brzmienie.
- issue: Ogólne znaczenie ἀνθρώπων
  choice: ludzkich
  alternative: ludzi
  rationale: Rzeczownik ma tu znaczenie ogólne, a nie wyłącznie męskie. „Ludzkich” zwięźle i naturalnie zachowuje kontrast między tym, co pochodzi od ludzi, a tym, co pochodzi od Boga.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zwrot „oddają mi cześć” jest bardziej naturalny niż dosłowne „czczą mnie”, a „ludzkie nakazy” jasno zachowują przeciwstawienie autorytetu ludzkiego autorytetowi Bożemu.
