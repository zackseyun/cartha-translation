  source_fidelity: 'Tekst trafnie oddaje μάτην („na próżno”), kontrastowe δέ („Lecz”), religijny sens σέβονταί με („oddają mi cześć”) oraz imiesłowowe διδάσκοντες („nauczając”). „Ludzkich nakazów jako nauk” naturalnie wyraża sens zwartej konstrukcji διδασκαλίας ἐντάλματα ἀνθρώπων: nakazy pochodzące od ludzi są przedstawiane jako autorytatywne nauczanie. Nie wprowadza to dodatkowej treści doktrynalnej.'
