  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: pl
  text: 'On zaś odpowiedział: „Nie jest właściwe zabrać dzieciom chleb i rzucić go pieskom[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „małym psom” lub „psom domowym”. Grecki rzeczownik ma formę zdrobniałą, która może sugerować małe lub domowe psy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Typowe greckie połączenie imiesłowu z czasownikiem osobowym naturalnie oddaje się po polsku jednym czasownikiem, z zachowaniem znaczenia odpowiedzi.
- source_word: καλὸν
  choice: jest rzeczą właściwą
  rationale: W tym kontekście słowo wyraża stosowność lub właściwość postępowania, nie tylko ogólnie pojęte dobro.
- source_word: λαβεῖν
  choice: zabierać
  rationale: W obrazie chodzi o wzięcie chleba należącego do dzieci; „zabierać” jasno ukazuje tę relację, nie dodając obcej treści.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: chleb dzieciom
  rationale: Polska konstrukcja z celownikiem naturalnie przekazuje sens chleba należącego lub przeznaczonego dla dzieci i zachowuje obraz chleba.
- source_word: βαλεῖν
  choice: rzucać
  rationale: Zachowuje dosłowność i wyrazistość czasownika βάλλω, bez łagodzenia go do „dawać”.
- source_word: κυναρίοις
  choice: pieskom
  rationale: Zdrobnienie oddaje formę κυνάρια, mogącą wskazywać na małe lub domowe psy, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
theological_decisions:
- issue: Metafora dzieci i psów oraz jej odniesienie
  choice: Zachowano bezpośrednio obraz chleba, dzieci i piesków, bez objaśniania jego referentów w tekście głównym.
  alternative: Rozwinąć metaforę przez wskazanie grup etnicznych albo złagodzić „rzucać” do „dawać”.
  rationale: Sam werset nie nazywa wprost referentów metafory. Bezpośredni przekład zachowuje jej napięcie, a interpretację pozostawia kontekstowi.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „On zaś odpowiedział” zachowuje kontrast wyrażony przez δέ, natomiast zwięzłe „odpowiedział” naturalizuje grecką konstrukcję imiesłowową.
