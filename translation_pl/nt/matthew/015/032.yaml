id: MAT.15.32
reference: Matthew 15:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: pl
  text: 'Wtedy Jezus przywołał do siebie swoich uczniów i powiedział: „Żal mi tego tłumu[a], bo już od trzech dni są przy mnie[b] i nie mają co jeść. Nie chcę odprawić ich głodnych[c], żeby nie zasłabli w drodze[d]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „Ogarnia mnie współczucie dla tego tłumu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „już trzy dni pozostają przy mnie”.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „bez jedzenia” lub „poszczących”. W tym miejscu chodzi o to, że pozostają bez jedzenia, a nie o praktykę religijnego postu.'
    reason: lexical_alternative
  - marker: d
    text: 'Można też: „żeby nie opadli z sił w drodze” albo „żeby nie omdleli w drodze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: przywołał do siebie
  rationale: 'Oddaje zarówno czynność wezwania uczniów, jak i kierunek wyrażony przez medialną formę imiesłowu: Jezus wzywa ich ku sobie.'
- source_word: Σπλαγχνίζομαι
  choice: Żal mi
  rationale: Naturalny współczesny polski zwrot wyrażający głębokie współczucie i wewnętrzne poruszenie, bez osłabiania emocjonalnej siły greckiego czasownika.
- source_word: ὄχλον
  choice: tego tłumu
  rationale: „Tłum” jest naturalnym odpowiednikiem ὄχλος; zaimek „tego” wynika z polskiej składni zwrotu „żal mi” i wskazuje na obecnych ludzi.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: już od trzech dni są przy mnie
  rationale: Naturalnie wyraża trwającą od trzech dni obecność przy Jezusie, zachowując aspekt pozostawania z kimś zawarty w προσμένω.
- source_word: τί φάγωσιν
  choice: nie mają co jeść
  rationale: To idiomatyczny polski odpowiednik greckiego wyrażenia oznaczającego brak pożywienia.
- source_word: ἀπολῦσαι
  choice: odprawić
  rationale: W kontekście rozpuszczenia zgromadzonego tłumu „odprawić” jest zwięzłe, naturalne i zachowuje sens odesłania ludzi.
- source_word: νήστεις
  choice: głodnych
  rationale: W tym kontekście chodzi o ludzi pozostających bez jedzenia, a nie o dobrowolny post religijny; „głodnych” jasno przekazuje sens sytuacyjny.
- source_word: μήποτε
  choice: żeby nie
  rationale: Naturalnie wprowadza po polsku obawę przed możliwym skutkiem, bez przedstawiania go jako pewnego.
- source_word: ἐκλυθῶσιν
  choice: zasłabli
  rationale: Oddaje możliwość utraty sił lub omdlenia w drodze, zachowując nieostrość greckiego czasownika między wyczerpaniem a zasłabnięciem.
- source_word: ἐν τῇ ὁδῷ
  choice: w drodze
  rationale: Najbardziej idiomatyczne polskie określenie tego, co mogłoby się wydarzyć podczas powrotu.
