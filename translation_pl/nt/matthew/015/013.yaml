  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: pl
  text: 'On zaś odpowiedział: „Każda roślina, której nie zasadził mój Ojciec niebieski, zostanie wyrwana z korzeniami”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: On zaś odpowiedział
  rationale: Grecka formuła narracyjna dosłownie łączy imiesłów „odpowiedziawszy” z czasownikiem „powiedział”, lecz we współczesnej polszczyźnie naturalnie i wiernie oddaje ją jedno orzeczenie „odpowiedział”; „zaś” zachowuje δέ i sygnalizuje przejście do odpowiedzi Jezusa.
- source_word: Πᾶσα
  choice: Każda
  rationale: Forma pojedyncza ma sens dystrybutywny; „każda” odpowiada rodzajowi i liczbie rzeczownika „roślina”.
- source_word: φυτεία
  choice: roślina
  rationale: Rzeczownik może oznaczać to, co zostało zasadzone, albo samo nasadzenie. „Roślina” jest naturalna w obrazie czegoś, co następnie zostaje wyrwane z korzeniami, i nie rozstrzyga metaforycznego odniesienia.
- source_word: ἐφύτευσεν
  choice: zasadził
  rationale: „Zasadził” zachowuje dosłowny obraz ogrodniczy oraz związek znaczeniowy z „rośliną”.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mój Ojciec niebieski
  rationale: To zwięzłe, naturalne i godne polskie sformułowanie zachowuje zarówno zaimek dzierżawczy, jak i określenie οὐράνιος.
- source_word: ἐκριζωθήσεται
  choice: zostanie wyrwana z korzeniami
  rationale: Przyszła strona bierna zostaje zachowana, a zwrot „wyrwana z korzeniami” jasno oddaje czynność usunięcia wraz z korzeniem i podtrzymuje obraz sądu.
theological_decisions:
- issue: Metaforyczne odniesienie wyrażenia „każda roślina”
  choice: Zachować otwartą metaforę jako „każda roślina”.
  alternative: Doprecyzować jako „każda nauka”, „każda tradycja” albo „każdy człowiek”.
  rationale: Tekst grecki nie wskazuje jednoznacznie, czy chodzi o nauki, tradycje, ludzi czy szerzej o rzeczywistość niepochodzącą od Ojca. Pozostawienie obrazu nie narzuca interpretacji teologicznej.
translation_notes:
  register: Współczesna polszczyzna standardowa o prostym, godnym brzmieniu. Zachowano rolniczą metaforę i przyszłą stronę bierną, unikając zarówno archaicznej konstrukcji „odpowiadając, rzekł”, jak i interpretacyjnego doprecyzowania obrazu.
