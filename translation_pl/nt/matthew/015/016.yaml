  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: pl
  text: 'On zaś powiedział: „Czy i wy nadal nie rozumiecie?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Wprowadza łagodne przeciwstawienie lub zwrot w dialogu; „zaś” naturalnie łączy odpowiedź Jezusa z wcześniejszą wypowiedzią uczniów.
- source_word: ὁ … εἶπεν
  choice: On … powiedział
  rationale: Rodzajnik ὁ pełni funkcję zaimkową i odnosi się do Jezusa, a aoryst εἶπεν jest zwykłą formą narracyjną czasownika „powiedzieć”.
- source_word: ἀκμήν
  choice: nadal
  rationale: Wyraża trwanie danego stanu aż do obecnej chwili. W tym pytaniu „nadal” jest zwięzłe i idiomatyczne.
- source_word: καὶ ὑμεῖς
  choice: i wy
  rationale: 'Zachowuje nacisk wyrażony przez καί oraz jawny zaimek ὑμεῖς: również uczniowie okazują brak zrozumienia.'
- source_word: ἀσύνετοί ἐστε
  choice: nie rozumiecie
  rationale: Greckie wyrażenie opisuje brak pojmowania lub rozeznania. Polska forma czasownikowa brzmi naturalniej niż „jesteście bez zrozumienia” i nie zaostrza sensu do moralnego potępienia jako „głupi”.
theological_decisions:
- issue: Ton nagany skierowanej przez Jezusa do uczniów
  choice: „Czy i wy nadal nie rozumiecie?”
  alternative: „Czy i wy nadal jesteście nierozumni?”
  rationale: Przekład zachowuje wyraźną naganę oraz zdziwienie utrzymującym się brakiem zrozumienia, ale nie wzmacnia wypowiedzi do ostrzejszego osądu moralnego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „On zaś powiedział” zachowuje narracyjny zwrot tekstu greckiego, a pytanie brzmi naturalnie we współczesnej polszczyźnie.
