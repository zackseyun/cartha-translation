  source_fidelity: Tekst wiernie oddaje greckie ὁ δὲ εἶπεν oraz pytanie Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε. „Nadal” trafnie wyraża trwanie stanu wskazane przez ἀκμήν, „i wy” zachowuje inkluzywno-emfatyczne καὶ ὑμεῖς, a „nie rozumiecie” stanowi naturalny polski odpowiednik ἀσύνετοι ἐστε w tym kontekście.
