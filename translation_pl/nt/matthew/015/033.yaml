  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: pl
  text: 'Uczniowie powiedzieli mu: „Skąd weźmiemy na tym pustkowiu[a] tyle chleba[b], żeby nakarmić do syta[c] tak wielki tłum?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na pustyni” lub „w odludnym miejscu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „tyle chlebów” lub „tyle bochenków”.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „nasycić”; grecki czasownik oznacza nakarmić do pełna, aż do zaspokojenia głodu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: powiedzieli
  rationale: Grecki czas teraźniejszy pełni tu funkcję teraźniejszości historycznej; polski czas przeszły brzmi naturalnie w narracji i zachowuje jej tok.
- source_word: οἱ μαθηταί
  choice: uczniowie
  rationale: Rodzajnik wskazuje na znaną z kontekstu grupę. Nie dodano zaimka „jego”, którego nie ma w tekście greckim.
- source_word: Πόθεν ἡμῖν
  choice: Skąd weźmiemy
  rationale: Idiomatczne polskie pytanie oddaje zarówno źródło wyrażone przez Πόθεν, jak i perspektywę uczniów zawartą w celowniku ἡμῖν.
- source_word: ἐν ἐρημίᾳ
  choice: na tym pustkowiu
  rationale: Wyrażenie oznacza miejsce odludne lub niezamieszkane. „Pustkowie” zachowuje charakter scenerii, nie sugerując koniecznie piaszczystej pustyni; „tym” wynika z bezpośredniej sytuacji.
- source_word: ἄρτοι τοσοῦτοι
  choice: tyle chleba
  rationale: Liczba mnoga ἄρτοι dosłownie odnosi się do wielu chlebów lub bochenków, lecz zbiorowe „tyle chleba” jest naturalne po polsku i zachowuje nacisk na ilość.
- source_word: ὥστε χορτάσαι
  choice: żeby nakarmić do syta
  rationale: Konstrukcja wyraża zamierzony lub osiągalny skutek, a χορτάζω oznacza nakarmienie aż do nasycenia. To sformułowanie zachowuje pełnię posiłku, nie tylko samo podanie jedzenia.
- source_word: ὄχλον τοσοῦτον
  choice: tak wielki tłum
  rationale: Przekład zachowuje rzeczownik „tłum” oraz emfatyczne określenie jego rozmiaru.
theological_decisions: []
