  terminology: „Czcij” trafnie zachowuje utrwalone biblijne i etyczne znaczenie przykazania. „Złorzeczy” mieści się w zakresie κακολογέω; przypis poprawnie sygnalizuje możliwe „przeklina” oraz bardziej explicytną polską formułę karną. Kotwica przypisu po drugim cytacie jest właściwa.
