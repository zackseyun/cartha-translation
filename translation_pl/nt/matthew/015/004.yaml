  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: pl
  text: 'Bóg bowiem powiedział: „Czcij swego ojca i swoją matkę”, oraz: „Kto złorzeczy ojcu lub matce, niech poniesie śmierć”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Kto przeklina ojca lub matkę, musi zostać ukarany śmiercią”.'
    reason: Alternatywa oddaje κακολογῶν jako „przeklina” oraz wyraża prawnokarny sens θανάτῳ τελευτάτω w naturalnej polszczyźnie.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Bóg bowiem
  rationale: Partykuła γάρ wprowadza uzasadnienie argumentu Jezusa; szyk „Bóg bowiem” jest naturalny i zachowuje jej funkcję wyjaśniającą.
- source_word: εἶπεν
  choice: powiedział
  rationale: Czasownik λέγω wprowadza cytat z Pisma. „Powiedział” oddaje jego zwykłe znaczenie bez wzmacniania go do „nakazał”.
- source_word: Τίμα
  choice: Czcij
  rationale: τιμάω oznacza okazywanie należnej czci. „Czcij” zachowuje wagę przykazania i jest jego utrwalonym, nadal zrozumiałym polskim brzmieniem.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: swego ojca i swoją matkę
  rationale: Zaimek dzierżawczy, obecny w sensie cytowanego przykazania, zapewnia naturalne polskie brzmienie; zróżnicowane formy „swego/swoją” unikają niezręcznego powtórzenia.
- source_word: Ὁ κακολογῶν
  choice: Kto złorzeczy
  rationale: κακολογέω może oznaczać złorzeczenie, przeklinanie lub znieważanie słowami. „Złorzeczy” zwięźle zachowuje mocny, werbalny charakter czynu oraz podniosły rejestr cytatu prawnego.
- source_word: πατέρα ἢ μητέρα
  choice: ojcu lub matce
  rationale: Polski czasownik „złorzeczyć” łączy się z celownikiem. Brak zaimka zachowuje ogólny charakter greckiego sformułowania.
- source_word: θανάτῳ τελευτάτω
  choice: niech poniesie śmierć
  rationale: Sformułowanie zachowuje uroczystą formułę kary śmierci i tryb rozkazujący, nie dopowiadając w tekście głównym wykonawcy kary.
theological_decisions:
- issue: Sposób oddania prawnej formuły θανάτῳ τελευτάτω
  choice: niech poniesie śmierć
  alternative: musi zostać ukarany śmiercią
  rationale: Grecka formuła jednoznacznie orzeka śmierć, lecz nie wskazuje wprost wykonawcy. Tekst główny zachowuje tę cechę, a przypis podaje naturalne, prawne odczytanie strony biernej.
translation_notes:
  register: Współczesna, godna polszczyzna z umiarkowanie podniosłym rejestrem właściwym dla cytatu z Prawa. Zachowano dwa odrębne cytaty i nie dopowiedziano ludzkiej sprawczości wykonania kary w tekście głównym.
