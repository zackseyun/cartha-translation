  source_fidelity: 'Tekst wiernie oddaje grecki: „Bóg bowiem” zachowuje funkcję γάρ, „Czcij” odpowiada τιμάω, a „Kto złorzeczy ojcu lub matce” właściwie ujmuje κακολογῶν z wymaganym w polszczyźnie celownikiem. „Niech poniesie śmierć” adekwatnie przekazuje uroczystą prawną formułę θανάτῳ τελευτάτω, nie wskazując dodatkowo wykonawcy kary.'
