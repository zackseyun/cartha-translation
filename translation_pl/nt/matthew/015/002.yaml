source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: pl
  text: Dlaczego twoi uczniowie łamią tradycję starszych? Nie myją bowiem rąk, kiedy jedzą chleb[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chodzi o obmywanie rąk związane z tradycją starszych, a nie jedynie o zwykłą higienę.
    reason: cultural_note
  - marker: b
    text: 'Możliwe też: „kiedy spożywają posiłek”. Greckie słowo oznaczające „chleb” może niekiedy odnosić się szerzej do jedzenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Naturalny współczesny polski odpowiednik pytania o przyczynę.
- source_word: παραβαίνουσιν
  choice: łamią
  rationale: Oddaje naruszanie wiążącej normy lub tradycji bez nadmiernie technicznego brzmienia.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: tradycję starszych
  rationale: Zachowuje pojęcie przekazanej tradycji oraz kontekstowe określenie uznanych dawnych autorytetów.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: nie myją bowiem rąk
  rationale: Naturalna polszczyzna; zaimek dzierżawczy jest zbędny, ponieważ odniesienie do uczniów pozostaje jasne.
- source_word: ὅταν
  choice: kiedy
  rationale: W połączeniu z czasem teraźniejszym naturalnie wyraża powtarzającą się sytuację.
- source_word: ἄρτον
  choice: chleb
  rationale: Zachowuje dosłowne znaczenie greckiego rzeczownika, nie wykluczając jego szerszego, metonimicznego użycia.
- source_word: ἐσθίωσιν
  choice: jedzą
  rationale: Prosty czas teraźniejszy trafnie oddaje zwyczajowy charakter greckiej konstrukcji.
theological_decisions:
- issue: Charakter obmywania rąk
  choice: W tekście głównym pozostawiono spór jako dotyczący tradycji starszych, bez dodawania określenia „rytualnie”.
  alternative: Wyraźnie nazwać obmywanie rytualnym albo potraktować je jako zwykłą higienę.
  rationale: Sam werset wiąże praktykę z tradycją starszych, lecz nie określa jej wprost jako rytualnej ani higienicznej; objaśnienie kulturowe podano w przypisie.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Szyk „Nie myją bowiem rąk” zachowuje uzasadniający charakter γάρ, a zarazem brzmi płynnie po polsku. Wszystkie przypisy są oznaczone w tekście głównym.
