  - marker: b
    text: „Ta wypowiedź” odnosi się do poprzedniej wypowiedzi Jezusa.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski łącznik narracyjny, wskazujący na kolejny moment wydarzeń.
- source_word: προσελθόντες οἱ μαθηταὶ λέγουσιν αὐτῷ
  choice: podeszli uczniowie i powiedzieli Mu
  rationale: Oddaje konstrukcję z imiesłowem i historycznym czasem teraźniejszym w naturalnej polskiej narracji, bez dodawania niewyrażonego w grece zaimka „Jego”.
- source_word: Οἶδας
  choice: Czy wiesz
  rationale: Bezpośrednio zachowuje pytajną formę greckiego czasownika οἶδα.
- source_word: οἱ Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska nazwa tej grupy; rodzajnik grecki nie wymaga osobnego odpowiednika w języku polskim.
- source_word: ἀκούσαντες τὸν λόγον
  choice: gdy usłyszeli te słowa
  rationale: W tym kontekście λόγος oznacza wcześniejszą wypowiedź Jezusa. Liczba mnoga „te słowa” brzmi naturalniej po polsku niż dosłowne „to słowo”, a przypis zachowuje odniesienie do poprzedniej wypowiedzi.
- source_word: ἐσκανδαλίσθησαν
  choice: poczuli się urażeni
  rationale: Naturalnie oddaje negatywną reakcję faryzeuszy, zachowując sens obrażenia się bez przesądzania szerszego znaczenia metafory potknięcia.
theological_decisions:
- issue: Znaczenie σκανδαλίζω w opisie reakcji faryzeuszy
  choice: poczuli się urażeni
  alternative: obrazili się; zostali doprowadzeni do upadku
  rationale: Kontekst wskazuje na negatywną reakcję na nauczanie Jezusa. Wybrane sformułowanie nie wprowadza twierdzenia o odstępstwie ani moralnym upadku, a przypis zachowuje dosłowniejszy obraz greckiego czasownika.
translation_notes:
  register: Współczesny, godny i przystępny polski. Szyk zdania jest naturalny dla narracji, a zaimki odnoszące się do Jezusa zapisano wielką literą zgodnie z rozpowszechnioną polską praktyką biblijną.
