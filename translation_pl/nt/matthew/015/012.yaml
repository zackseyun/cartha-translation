  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: pl
  text: 'Wtedy uczniowie podeszli i powiedzieli Mu: „Czy wiesz, że faryzeusze obrazili się[a], gdy usłyszeli tę wypowiedź[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „poczuli się urażeni”; bardziej dosłownie: „zostali doprowadzeni do potknięcia”.'
