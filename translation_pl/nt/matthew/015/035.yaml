review_pass:
  verdict: revise
  source_fidelity: Polskie „polecił tłumowi, żeby usiadł na ziemi” wiernie oddaje sens παραγγείλας τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τὴν γῆν. Forma osobowa naturalnie zastępuje grecki imiesłów, którego czynność poprzedza dalsze wydarzenie w następnym wersecie. „Usiąść” jest dopuszczalnym kontekstowym odpowiednikiem ἀναπεσεῖν, pod warunkiem zachowania w przypisie niuansu pozycji przy posiłku.
  naturalness: 'Tekst główny jest naturalny we współczesnej polszczyźnie. Przypis wymaga drobnej redakcji: zwrot „Dosłownie także” jest niezręczny i sugeruje, że podana alternatywa jest dosłownym odpowiednikiem, choć „ułożyć się” stanowi raczej interpretacyjne przybliżenie.'
  terminology: „Tłum” i „ziemia” są właściwe w tym kontekście. „Polecił” zachowuje dyrektywną siłę παραγγέλλω bez niepotrzebnego zaostrzenia. Nie występują tu szczególne terminy teologiczne.
