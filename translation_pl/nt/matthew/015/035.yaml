lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Naturalny polski spójnik kontynuujący ciąg wydarzeń.
- source_word: παραγγείλας
  choice: polecił
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą główne działanie następnego wersetu. Polski czasownik „polecił” zachowuje stanowczy charakter dyspozycji bez nadmiernie ostrego tonu.
- source_word: τῷ ὄχλῳ
  choice: tłumowi
  rationale: Celownik wskazuje adresata polecenia; „tłum” jest naturalnym i precyzyjnym określeniem zgromadzonych ludzi.
- source_word: ἀναπεσεῖν
  choice: żeby usiadł
  rationale: Czasownik oznacza zajęcie miejsca, zwłaszcza do posiłku, pierwotnie często w pozycji półleżącej. Współczesne polskie „usiąść” brzmi naturalnie w odniesieniu do tłumu na ziemi, a przypis zachowuje kulturowy niuans pozycji przy posiłku.
- source_word: ἐπὶ τὴν γῆν
  choice: na ziemi
  rationale: W tym kontekście γῆ oznacza powierzchnię gruntu, na której ludzie mieli zająć miejsca.
