revisions:
- from: Bo z serca wychodzą złe myśli, zabójstwa, cudzołóstwa, czyny nierządu, kradzieże, fałszywe świadectwa i oszczerstwa[a].
  to: Bo z serca wychodzą złe myśli, zabójstwa, cudzołóstwa, czyny rozpustne, kradzieże, fałszywe świadectwa i zniewagi[a].
  rationale: Wprowadzono jedynie bezpieczne korekty leksykalne. „Zniewagi” lepiej niż „oszczerstwa” obejmują podstawowy zakres βλασφημίαι, nie przesądzając, czy mowa jest skierowana przeciw ludziom, czy przeciw Bogu; tę drugą możliwość zachowano w przypisie. „Czyny rozpustne” zastępują archaizujące i potencjalnie zawężające „czyny nierządu”, zachowując mnogość oraz ogólny zakres πορνεῖαι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:44Z'
review_pass:
  verdict: revise
  source_fidelity: Przekład wiernie zachowuje składnię wyjaśniającą γάρ, obraz serca jako źródła oraz katalog występków. „Oszczerstwa” jest jednak znaczeniowo zbyt wąskie dla βλασφημίαι, ponieważ po polsku zwykle zakłada fałszywe zarzuty, podczas gdy grecki termin może obejmować także znieważającą lub obelżywą mowę. „Czyny nierządu” brzmią archaizująco i mogą być odczytane zbyt wąsko jako odnoszące się do prostytucji.
  naturalness: Zdanie jest płynne i zachowuje godny, współczesny rejestr. Zastąpienie archaizującego „czynów nierządu” przez „czyny rozpustne” poprawia współczesną zrozumiałość, a „zniewagi” naturalniej oddają szeroki charakter końcowego rzeczownika w tym katalogu.
  terminology: „Zabójstwa”, „cudzołóstwa”, „kradzieże” i „fałszywe świadectwa” są trafne. „Czyny rozpustne” oddają szeroką, negatywnie wartościowaną kategorię πορνεῖαι bez zawężania jej do jednego rodzaju zachowania. „Zniewagi” obejmują mowę znieważającą przeciw ludziom; przypis zachowuje możliwe znaczenie „bluźnierstwa” w odniesieniu do Boga.
  issues:
  - severity: medium
    issue: „Oszczerstwa” jako przekład βλασφημίαι
    rationale: 'Polskie „oszczerstwo” zwykle oznacza fałszywe, zniesławiające oskarżenie. βλασφημίαι ma szerszy zakres: znieważanie, obelgi lub zniesławianie, a zależnie od odniesienia także bluźnierstwo. „Zniewagi” nie dodają wymogu fałszu i lepiej zachowują tę szerokość.'
  - severity: low
    issue: „Czyny nierządu” jako przekład πορνεῖαι
    rationale: Wyrażenie jest dziś częściowo archaiczne, a rzeczownik „nierząd” może niepotrzebnie nasuwać przede wszystkim prostytucję. „Czyny rozpustne” pozostają ogólne, pluralne i bardziej współczesne.
  revised_text: Bo z serca wychodzą złe myśli, zabójstwa, cudzołóstwa, czyny rozpustne, kradzieże, fałszywe świadectwa i zniewagi[a].
