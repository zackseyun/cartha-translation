  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: pl
  text: Bo z serca wychodzą złe myśli, zabójstwa, cudzołóstwa, czyny rozpustne, kradzieże, fałszywe świadectwa i zniewagi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „bluźnierstwa”. Greckie słowo może oznaczać znieważającą lub zniesławiającą mowę przeciw ludziom, a także bluźnierczą mowę przeciw Bogu — zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Bo z serca
  rationale: γάρ wprowadza wyjaśnienie, a ἐκ wskazuje źródło. „Z serca” zachowuje biblijny obraz serca jako wnętrza człowieka i brzmi naturalnie po polsku.
- source_word: ἐξέρχονται
  choice: wychodzą
  rationale: Dosłownie oznacza „wychodzą” lub „wydostają się”; wybrane słowo zachowuje obraz wyłaniania się z wewnętrznego źródła.
- source_word: διαλογισμοὶ πονηροί
  choice: złe myśli
  rationale: διαλογισμοί może oznaczać myśli, rozważania lub zamysły. „Złe myśli” jest naturalne i nie zawęża sensu wyłącznie do planowania zła.
- source_word: φόνοι
  choice: zabójstwa
  rationale: Termin oznacza bezprawne pozbawianie życia; „zabójstwa” zachowują liczbę mnogą i moralny ciężar wyrażenia.
- source_word: μοιχεῖαι
  choice: cudzołóstwa
  rationale: Bezpośredni, współczesny odpowiednik odnoszący się do naruszenia wierności małżeńskiej; zachowuje liczbę mnogą.
- source_word: πορνεῖαι
  choice: czyny nierządu
  rationale: πορνεῖαι obejmuje różne formy niedozwolonych zachowań seksualnych. „Czyny nierządu” oddaje konkretny i mnogi charakter greckiego rzeczownika, nie ograniczając go do jednego rodzaju czynu.
- source_word: κλοπαί
  choice: kradzieże
  rationale: Zwięzły i naturalny polski odpowiednik zachowujący liczbę mnogą oraz rytm wyliczenia.
- source_word: ψευδομαρτυρίαι
  choice: fałszywe świadectwa
  rationale: Oddaje zarówno fałsz, jak i wymiar składania świadectwa, w tym kontekst prawny, oraz zachowuje liczbę mnogą.
- source_word: βλασφημίαι
  choice: oszczerstwa
  rationale: W ogólnym katalogu występków greckie słowo może oznaczać zniesławiające lub obelżywe wypowiedzi przeciw ludziom. „Oszczerstwa” zachowują ten szeroki sens, a możliwe odniesienie do bluźnierstw wobec Boga podano w przypisie.
theological_decisions:
- issue: Zakres znaczeniowy βλασφημίαι
  choice: oszczerstwa
  alternative: bluźnierstwa
  rationale: Kontekst nie określa jednoznacznie adresata wypowiedzi. Tekst główny oddaje prawdopodobny sens dotyczący szkodliwej mowy przeciw ludziom, natomiast przypis zachowuje możliwość odniesienia do mowy przeciw Bogu.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzły rytm greckiego katalogu występków oraz metaforę serca jako źródła postępowania.
