  terminology: „Obłudnicy”, „Izajasz” i „prorokował” są ustalone, właściwe i adekwatne do rejestru biblijnego. „Słusznie” lepiej niż „trafnie” oddaje zakres καλῶς bez niepotrzebnego zawężenia znaczenia.
