  source_fidelity: Grecki zwrot ὑποκριταί został wiernie oddany przez mocne, bezpośrednie „Obłudnicy!”. Konstrukcja „Izajasz ... prorokował o was, mówiąc:” poprawnie odtwarza składnię oraz funkcję wprowadzenia cytatu. Jednak καλῶς w tym kontekście znaczy przede wszystkim „słusznie/właściwie”, tj. że proroctwo Izajasza trafnie odnosi się do adresatów; „trafnie” jest możliwe, lecz może zbyt łatwo sugerować wyłącznie trafność przewidywania.
