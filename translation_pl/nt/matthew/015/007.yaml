  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: pl
  text: 'Obłudnicy! Izajasz słusznie[a] prorokował o was, mówiąc:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „trafnie” lub „dobrze”.'
    reason: καλῶς może oznaczać „dobrze”, „właściwie” lub „trafnie”; w tekście głównym „słusznie” najlepiej oddaje jego funkcję w tym kontekście.
lexical_decisions:
- source_word: ὑποκριταί
  choice: Obłudnicy!
  rationale: Mocny, bezpośredni zwrot w liczbie mnogiej. „Obłudnicy” naturalnie oddaje moralno-religijny zarzut obecny w kontekście, a wykrzyknik zachowuje ostrość nagany.
- source_word: καλῶς
  choice: trafnie
  rationale: Przysłówek określa prorokowanie Izajasza jako słusznie i odpowiednio odnoszące się do adresatów. „Trafnie” brzmi naturalnie we współczesnej polszczyźnie; możliwe jest również bardziej dosłowne „dobrze”.
- source_word: ἐπροφήτευσεν
  choice: prorokował
  rationale: Standardowy i bezpośredni odpowiednik czasownika προφητεύω, zachowujący prorocki charakter wypowiedzi Izajasza.
- source_word: περὶ ὑμῶν
  choice: o was
  rationale: Naturalny polski odpowiednik περί z dopełniaczem w znaczeniu „o, w odniesieniu do”.
- source_word: Ἠσαΐας
  choice: Izajasz
  rationale: Utrwalona polska forma imienia proroka.
- source_word: λέγων
  choice: 'mówiąc:'
  rationale: Imiesłów wprowadza następujący cytat; dwukropek jasno sygnalizuje jego początek.
theological_decisions:
- issue: Siła bezpośredniego zwrotu Jezusa do uczonych w Piśmie i faryzeuszy
  choice: 'Mocne oskarżenie: „Obłudnicy!”'
  alternative: Łagodniejsze określenie, np. „Udający”
  rationale: ὑποκριταί stanowi w tym kontekście stanowczy osąd moralno-religijny. Złagodzenie terminu osłabiłoby naganę Jezusa i jej związek z następującym cytatem z Izajasza.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Szyk z imieniem „Izajasz” przed orzeczeniem jest naturalny po polsku, a zarazem zachowuje wszystkie elementy tekstu greckiego.
