  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: pl
  text: 'Piotr odpowiedział mu: „Wyjaśnij[a] nam tę przypowieść”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Powiedz nam tę przypowieść” albo „Uczyń nam tę przypowieść zrozumiałą”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Wtedy Piotr odezwał się do niego
  rationale: Grecki zwrot dosłownie łączy imiesłów „odpowiadając” z czasownikiem „powiedział”. W naturalnej współczesnej polszczyźnie „odezwał się” oddaje podjęcie wypowiedzi przez Piotra bez niezręcznego „odpowiedział i powiedział”. δέ sygnalizuje dalszy rozwój narracji, dlatego wybrano neutralne „wtedy”, a zaimek αὐτῷ zachowano jako „do niego”.
- source_word: Φράσον
  choice: Wyjaśnij
  rationale: Tryb rozkazujący czasownika φράζω oznacza przedstawienie czegoś jasno lub objaśnienie; w tym kontekście Piotr prosi o wyjaśnienie znaczenia wcześniejszej obrazowej wypowiedzi.
- source_word: ἡμῖν
  choice: nam
  rationale: Celownik wskazuje odbiorców wyjaśnienia; polskie „nam” jest naturalnym odpowiednikiem.
- source_word: τὴν παραβολὴν ταύτην
  choice: tę przypowieść
  rationale: „Przypowieść” zachowuje utrwalone ewangeliczne znaczenie παραβολή, nie rozstrzygając, czy chodzi o rozbudowaną opowieść, czy krótszą wypowiedź obrazową. Zaimek „tę” wskazuje na bezpośrednio poprzedzającą wypowiedź.
theological_decisions:
- issue: Zakres znaczeniowy παραβολή
  choice: przypowieść
  alternative: wypowiedź obrazowa / porównanie
  rationale: Termin może mieć szerszy zakres niż narracyjna przypowieść, lecz „przypowieść” zachowuje spójność terminologiczną Ewangelii i nie narzuca szczegółowej interpretacji gatunkowej.
translation_notes:
  register: Współczesny, godny i zwięzły styl narracyjny. Uniknięto kalki „odpowiadając, powiedział”, zachowując sens greckiej formuły w naturalnej polszczyźnie.
