    issue: „Wtedy” jako odpowiednik δέ
    rationale: „Wtedy” określa relację czasową mocniej niż greckie δέ, które przede wszystkim sygnalizuje przejście lub łagodne przeciwstawienie. Lepiej je pominąć w polszczyźnie albo oddać przez „a”.
  - severity: low
    issue: „Odezwał się” osłabia odpowiedziowy charakter ἀποκριθεὶς
    rationale: Czasownik jest możliwy stylistycznie, lecz nie zaznacza tak wyraźnie, że słowa Piotra są odpowiedzią na poprzednią wypowiedź. „Odpowiedział” zachowuje ten sens naturalnie.
