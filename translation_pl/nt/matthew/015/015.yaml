- from: 'Wtedy Piotr odezwał się do niego: „Wyjaśnij nam tę przypowieść”.'
  to: 'Piotr odpowiedział mu: „Wyjaśnij[a] nam tę przypowieść”.'
  rationale: Usunięto nadmiernie czasowe „Wtedy” i zastąpiono „odezwał się” przez „odpowiedział”, aby bliżej oddać funkcję greckiego ἀποκριθείς, przy zachowaniu naturalnej polskiej składni. Dodano przypis przy „Wyjaśnij”, odpowiadający odnotowanym w audycie angielskim możliwym odcieniom czasownika φράζω.
