review_pass:
  verdict: revise
  source_fidelity: 'Rdzeń wypowiedzi oddano trafnie: Piotr zwraca się do Jezusa z prośbą, aby wyjaśnił uczniom wskazaną przypowieść. Jednak „Wtedy” wnosi wyraźny odcień czasowy, którego δέ samo w sobie nie wyraża; jest ono raczej łagodnym łącznikiem narracyjnym lub kontrastem. „Odpowiedział mu” czytelniej oddaje ἀποκριθεὶς ... εἶπεν niż ogólne „odezwał się do niego”.'
  naturalness: „Piotr odpowiedział mu” jest naturalne we współczesnej standardowej polszczyźnie, zwięzłe i odpowiednie dla rejestru narracji ewangelicznej. Nie trzeba kalkować greckiego połączenia „odpowiadając, powiedział”.
  terminology: „Wyjaśnij nam tę przypowieść” właściwie oddaje Φράσον ἡμῖν τὴν παραβολὴν ταύτην. „Przypowieść” zachowuje tradycyjny termin ewangeliczny, choć greckie παραβολή może obejmować także krótszą wypowiedź obrazową. Przypis zachowuje możliwe szersze odcienie Φράσον.
  issues:
