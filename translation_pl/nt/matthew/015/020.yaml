  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: pl
  text: To są rzeczy, które kalają człowieka[a], natomiast jedzenie nieumytymi rękami nie kala człowieka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „czyni człowieka nieczystym”. Grecki czasownik może oznaczać uczynienie kogoś nieczystym rytualnie; tutaj „kala” zachowuje zarówno kontekst czystości rytualnej, jak i szerszy sens moralnego skażenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: To właśnie
  rationale: Naturalna polska konstrukcja zachowuje wskazujący i podsumowujący nacisk greckiego wyrażenia; „właśnie” uwydatnia kontrast z dalszą częścią zdania.
- source_word: κοινοῦντα / κοινοῖ
  choice: kala / nie kala
  rationale: W kontekście sporu o czystość κοινόω oznacza uczynienie człowieka nieczystym, a zarazem niesie szerszy sens moralnego skalania. Polski czasownik „kalać” zwięźle zachowuje oba odcienie i umożliwia powtórzenie greckiego czasownika.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: „Człowiek” naturalnie oddaje rodzajowo reprezentatywną liczbę pojedynczą ὁ ἄνθρωπος i odnosi wypowiedź ogólnie do istoty ludzkiej, bez zmiany na liczbę mnogą.
- source_word: ἀνίπτοις χερσὶν
  choice: nieumytymi rękami
  rationale: Naturalny polski odpowiednik celownika sposobu, który jasno nawiązuje do omawianego obmywania rąk.
- source_word: τὸ ... φαγεῖν
  choice: jedzenie
  rationale: Urzeczownikowiona forma „jedzenie” naturalnie oddaje grecki bezokolicznik z rodzajnikiem i dobrze funkcjonuje jako podmiot zdania po polsku.
- source_word: δέ
  choice: natomiast
  rationale: „Natomiast” wyraźnie i płynnie zaznacza kontrast między tym, co kala, a jedzeniem nieumytymi rękami.
theological_decisions:
- issue: Znaczenie κοινόω w sporze o czystość
  choice: „kalać”, z zachowaniem zarówno tła rytualnej nieczystości, jak i szerszej wymowy moralnej
  alternative: „czynić nieczystym”
  rationale: Bezpośredni kontekst dotyczy czystości rytualnej, lecz nauczanie Jezusa obejmuje także rzeczywiste moralne skażenie człowieka. „Kalać” nie ogranicza sensu wyłącznie do obrzędu.
- issue: Ogólny charakter liczby pojedynczej ἄνθρωπον
  choice: „człowieka” jako reprezentatywna liczba pojedyncza
  alternative: „ludzi” lub „osoby”
  rationale: Przekład zachowuje źródłową liczbę pojedynczą, a polskie słowo „człowiek” w tym zdaniu naturalnie wyraża prawdę odnoszącą się do każdego człowieka.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano powtórzenie „kala człowieka”, odpowiadające retorycznej symetrii greckiego zdania. Przypis umieszczono po pierwszym wystąpieniu czasownika, gdzie objaśnia on oba wystąpienia.
