  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: pl
  text: 'Lecz ona podeszła, uklękła przed Nim[a] i powiedziała: „Panie, pomóż mi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „oddała Mu pokłon” lub „oddała Mu cześć”. Grecki czasownik może oznaczać pełen szacunku pokłon, złożenie hołdu albo oddawanie czci — zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: Spójnik wskazuje na łagodny kontrast z poprzednią wypowiedzią Jezusa i podkreśla, że kobieta mimo niej nie ustępuje.
- source_word: ἐλθοῦσα
  choice: podeszła
  rationale: Imiesłów aorystu opisuje zbliżenie się kobiety; polskie „podeszła” naturalnie oddaje ruch ku Jezusowi.
- source_word: προσεκύνει αὐτῷ
  choice: uklękła przed Nim
  rationale: Czasownik może oznaczać pokłon, złożenie hołdu albo oddanie czci. W tym kontekście przekład główny ukazuje cielesny gest pełen szacunku, nie rozstrzygając jednoznacznie jego teologicznego znaczenia.
- source_word: λέγουσα
  choice: i powiedziała
  rationale: Imiesłów wprowadza bezpośrednią wypowiedź; forma osobowa połączona spójnikiem jest naturalna we współczesnej polszczyźnie.
- source_word: Κύριε
  choice: Panie
  rationale: Zachowuje tradycyjne i kontekstowo doniosłe zwrócenie się do Jezusa, bez osłabiania go do zwykłej formy grzecznościowej.
- source_word: βοήθει μοι
  choice: pomóż mi
  rationale: Bezpośredni tryb rozkazujący trafnie oddaje krótkość, pilność i rozpaczliwy charakter prośby.
theological_decisions:
- issue: Znaczenie προσκυνέω w odniesieniu do Jezusa
  choice: uklękła przed Nim
  alternative: oddała Mu pokłon; oddała Mu cześć
  rationale: Grecki czasownik obejmuje zarówno gest pokłonu i hołdu, jak i oddawanie czci. Tekst główny zachowuje widoczny gest, a przypis pozostawia otwarte jego pełniejsze znaczenie teologiczne.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Wielka litera w zaimku „Nim” odpowiada polskiej konwencji odnoszenia zaimków do Jezusa; wykrzyknik oddaje naglący charakter krótkiej prośby.
