base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: pl
  text: 'Wtedy faryzeusze i uczeni w Piśmie przychodzą z Jerozolimy do Jezusa i mówią:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego, zachowujący tok narracji.
- source_word: προσέρχονται
  choice: przychodzą do
  rationale: Oddaje ruch ku Jezusowi w naturalnym współczesnym polskim oraz zachowuje grecki czas teraźniejszy narracyjny.
- source_word: τῷ Ἰησοῦ
  choice: do Jezusa
  rationale: Cel ruchu wyrażono zgodnie z polską składnią czasownika „przychodzić”.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: z Jerozolimy
  rationale: Przyimek ἀπό wskazuje pochodzenie lub miejsce przybycia; przekład nie przesądza, czy chodzi o oficjalną delegację.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska nazwa historyczno-religijnej grupy żydowskiej.
- source_word: γραμματεῖς
  choice: uczeni w Piśmie
  rationale: Utrwalone i zrozumiałe określenie znawców oraz nauczycieli Prawa; trafniej niż dosłowne „skrybowie” oddaje funkcję tej grupy w kontekście Ewangelii.
- source_word: καὶ
  choice: i
  rationale: Zachowuje proste współrzędne połączenie obu grup, a następnie czynności mówienia.
- source_word: λέγοντες
  choice: i mówią
  rationale: Naturalnie wprowadza wypowiedź z następnego wersetu, zachowując żywy, teraźniejszy tok narracji.
theological_decisions:
- issue: Czas teraźniejszy narracyjny
  choice: 'Zachować czas teraźniejszy: „przychodzą… mówią”'
  alternative: 'Użyć czasu przeszłego: „przyszli… powiedzieli”'
  rationale: Greckie προσέρχονται oraz imiesłów λέγοντες tworzą żywą narrację w czasie teraźniejszym. Taki tok jest możliwy i naturalny także po polsku.
- issue: Znaczenie γραμματεῖς
  choice: uczeni w Piśmie
  alternative: skrybowie; znawcy Prawa; nauczyciele Prawa
  rationale: W tym kontekście termin oznacza religijno-prawnych ekspertów, nie tylko osoby zawodowo przepisujące teksty. Wybrana forma jest utrwalona, nie narzuca konkretnej denominacyjnej interpretacji i zachowuje odniesienie do Pisma.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano grecki czas teraźniejszy narracyjny. Szyk „faryzeusze i uczeni w Piśmie z Jerozolimy” naturalnie wiąże pochodzenie z obiema grupami, zgodnie z tekstem źródłowym.
