  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: pl
  text: „ten z pewnością nie musi czcić swego ojca”[a]. I unieważniliście słowo Boga[b] z powodu waszej tradycji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Czcić” oznacza tu prawdopodobnie także praktyczny obowiązek utrzymywania rodziców, a nie tylko okazywanie im szacunku.
    reason: lexical_alternative
  - marker: b
    text: Niektóre rękopisy mają „przykazanie Boga” zamiast „słowo Boga”.
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ
  choice: z pewnością nie musi
  rationale: Podwójne przeczenie ma charakter emfatyczny. W kontekście przytoczonej reguły wypowiedź oznacza zwolnienie z obowiązku, dlatego polskie „nie musi” trafniej oddaje sens niż forma wyłącznie przyszła, a „z pewnością” zachowuje nacisk.
- source_word: τιμήσει
  choice: czcić
  rationale: Czasownik τιμάω oznacza oddawanie czci lub okazywanie szacunku. „Czcić” zachowuje związek z przykazaniem dotyczącym ojca i matki, nie ograniczając znaczenia wyłącznie do wsparcia materialnego.
- source_word: τὸν πατέρα αὐτοῦ
  choice: swego ojca
  rationale: Tekst grecki wymienia tu wyłącznie ojca w liczbie pojedynczej; przekład nie rozszerza sformułowania o matkę, choć jest ona wspomniana w szerszym kontekście.
- source_word: ἠκυρώσατε
  choice: unieważniliście
  rationale: ἀκυρόω znaczy uczynić coś nieważnym lub pozbawić mocy. „Unieważniliście” jest mocnym, naturalnym odpowiednikiem w nowoczesnej polszczyźnie.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: słowo Boga
  rationale: Przekład idzie za tekstem SBLGNT, który ma λόγον („słowo”), a nie wariant ἐντολήν („przykazanie”).
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: z powodu waszej tradycji
  rationale: 'διά z biernikiem wyraża tutaj przyczynę: ich tradycja jest powodem, dla którego pozbawiają słowo Boga mocy.'
theological_decisions:
- issue: Czy wyraźnie wskazać, że cześć dla ojca obejmuje jego materialne wspieranie
  choice: W tekście głównym zachować ogólne „czcić”, a praktyczny wymiar objaśnić w przypisie.
  alternative: Przełożyć jako „wspierać” lub „troszczyć się o”.
  rationale: Spór dotyczy realnej pomocy rodzicom, lecz grecki czasownik τιμάω ma szersze znaczenie i nawiązuje do brzmienia przykazania. Zawężenie go w tekście głównym usuwałoby tę więź i nadmiernie rozstrzygało sens.
- issue: Czy ujednolicić tekst z szerszym kontekstem albo wariantami rękopiśmiennymi
  choice: Zachować „swego ojca” oraz „słowo Boga” zgodnie z tekstem SBLGNT.
  alternative: Rozszerzyć do „ojca lub matki” albo przyjąć wariant „przykazanie Boga”.
  rationale: Pierwszeństwo ma podany tekst grecki. Istotny wariant „przykazanie Boga” zostaje odnotowany w przypisie, nie zaś wprowadzony do tekstu głównego.
translation_notes:
  register: Współczesny, godny rejestr biblijny. „Czcić swego ojca” zachowuje rozpoznawalne nawiązanie do przykazania, a „unieważniliście” jasno oddaje siłę oskarżenia. Początkowy mały znak wynika z tego, że werset rozpoczyna się dalszym ciągiem zdania z wersetu 5.
