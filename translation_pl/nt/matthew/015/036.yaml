id: MAT.15.36
reference: Matthew 15:36
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: pl
  text: Wziął siedem chlebów i ryby, a gdy złożył dzięki[a], połamał je i podawał uczniom, uczniowie zaś tłumom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „złożywszy dzięki”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: Wziął
  rationale: Naturalny polski odpowiednik rozpoczynający sekwencję czynności Jezusa; nie ma tu potrzeby używać znaczenia „otrzymał”.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: siedem chlebów
  rationale: W kontekście rozmnożenia pokarmu ἄρτοι oznacza konkretne bochenki chleba; polskie „chleby” jest zwięzłe i naturalne.
- source_word: τοὺς ἰχθύας
  choice: ryby
  rationale: Zwykły współczesny polski odpowiednik liczby mnogiej, bez archaizującej formy.
- source_word: εὐχαριστήσας
  choice: a gdy złożył dzięki
  rationale: Oddaje uprzedniość imiesłowu aorystu względem łamania chleba, nie dodając niewymienionego w tekście adresata dziękczynienia.
- source_word: ἔκλασεν
  choice: połamał je
  rationale: Czasownik odnosi się w tym kontekście do dzielenia chlebów przed rozdaniem. Zaimek „je” jest naturalnym polskim dopełnieniem wynikającym z kontekstu.
- source_word: ἐδίδου
  choice: podawał
  rationale: Czas niedokonany oddaje trwającą lub powtarzaną czynność rozdawania; „podawał” zachowuje ten aspekt bez nadmiernego objaśniania.
- source_word: τοῖς μαθηταῖς
  choice: uczniom
  rationale: Celownik wskazuje odbiorców. Nie dodano „swoim”, ponieważ nie występuje ono w grece.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: uczniowie zaś tłumom
  rationale: Zachowuje grecką elipsę czasownika oraz liczbę mnogą ὄχλοι. „Zaś” naturalnie sygnalizuje zmianę podmiotu.
theological_decisions:
- issue: Możliwe eucharystyczne skojarzenie εὐχαριστήσας
  choice: złożył dzięki
  alternative: odmówił dziękczynienie / pobłogosławił
  rationale: Wyrażenie opisuje dziękczynienie nad pokarmem i może budzić późniejsze skojarzenia eucharystyczne, lecz przekład nie powinien sam wprowadzać interpretacji sakramentalnej ani utożsamiać dziękczynienia z błogosławieniem.
translation_notes:
  register: Współczesny, godny i przystępny styl narracyjny. Zachowano zwięzłość greckiej elipsy w końcowej części zdania oraz aspekt niedokonany czasownika ἐδίδου.
