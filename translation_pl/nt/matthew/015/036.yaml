  terminology: „Chleby”, „ryby”, „złożył dzięki”, „uczniowie” i „tłumy” są trafne oraz konsekwentne z sensem greckiego tekstu. „Złożył dzięki” nie wprowadza ani nie rozstrzyga skojarzeń sakramentalnych. Przypis poprawnie podaje formalniejszą, dosłowną możliwość oddania imiesłowu εὐχαριστήσας.
