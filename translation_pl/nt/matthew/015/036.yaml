  source_fidelity: 'Przekład wiernie oddaje sekwencję grecką: Jezus bierze siedem chlebów i ryby, składa dzięki, łamie chleby i rozdaje je uczniom, którzy przekazują je tłumom. „Podawał” trafnie wyraża niedokonany (ciągły/powtarzalny) charakter ἐδίδου. Końcowa elipsa odpowiada grece i nie dodaje treści.'
