base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: pl
  text: 'Jezus powiedział do nich: „Ile macie chlebów?” Odpowiedzieli: „Siedem i kilka małych ryb[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „ryb”. Grecki wyraz ma formę zdrobniałą, która może wskazywać na małe ryby.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jezus zapytał ich
  rationale: Grecki czas teraźniejszy pełni funkcję historycznego czasu teraźniejszego. Polski czas przeszły brzmi naturalnie w narracji, a czasownik „zapytał” jasno oddaje funkcję następującej wypowiedzi.
- source_word: Πόσους ἄρτους
  choice: Ile macie chlebów
  rationale: Rzeczownik ἄρτος występuje w liczbie mnogiej i oznacza policzalne bochenki lub chleby; w tym kontekście naturalne polskie pytanie brzmi „Ile macie chlebów?”.
- source_word: οἱ δὲ εἶπαν
  choice: Odpowiedzieli
  rationale: Partykuła δέ wprowadza dalszy ciąg rozmowy, a „odpowiedzieli” naturalnie wyraża relację tej wypowiedzi do pytania Jezusa bez nadawania jej silnego sensu przeciwstawnego.
- source_word: Ἑπτά
  choice: Siedem
  rationale: Bezpośredni odpowiednik greckiego liczebnika.
- source_word: ὀλίγα
  choice: kilka
  rationale: Naturalny polski odpowiednik określenia niewielkiej, nieoznaczonej liczby.
- source_word: ἰχθύδια
  choice: małych ryb
  rationale: Grecki rzeczownik ma formę zdrobniałą, dlatego przekład zachowuje możliwą informację o niewielkich rozmiarach ryb.
