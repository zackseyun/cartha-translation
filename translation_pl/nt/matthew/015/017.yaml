id: MAT.15.17
reference: Matthew 15:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: pl
  text: Czy nie rozumiecie, że wszystko, co wchodzi do ust, trafia do żołądka, a potem zostaje wydalone do ustępu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wszystko, co wchodzi do ust… zostaje wydalone do latryny / miejsca wypróżniania”.'
    reason: Alternatywne odpowiedniki rzeczownika ἀφεδρών, którego sens obejmuje ustęp, latrynę lub miejsce wypróżniania.
lexical_decisions:
- source_word: νοεῖτε
  choice: rozumiecie
  rationale: Czasownik odnosi się tutaj do pojmowania sensu wypowiedzi Jezusa; „rozumiecie” jest naturalne i zachowuje ton pytania napominającego.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: wszystko, co wchodzi
  rationale: Rodzajnikowa konstrukcja imiesłowowa w rodzaju nijakim ma znaczenie ogólne i obejmuje wszystko, co jest przyjmowane jako pokarm.
- source_word: εἰς τὸ στόμα
  choice: do ust
  rationale: Przyimek εἰς wyraża ruch do wnętrza; polskie „do ust” oddaje ten kierunek idiomatycznie.
- source_word: κοιλίαν
  choice: żołądka
  rationale: W kontekście procesu trawienia κοιλία oznacza wnętrze ciała, zwłaszcza żołądek; ten odpowiednik jest jasny dla współczesnego czytelnika.
- source_word: χωρεῖ
  choice: trafia
  rationale: W tym kontekście χωρέω opisuje przemieszczanie się pokarmu do żołądka. „Trafia” brzmi naturalnie i zachowuje kierunek ruchu.
- source_word: ἀφεδρῶνα
  choice: ustępu
  rationale: ἀφεδρών oznacza miejsce wypróżniania, czyli latrynę lub ustęp. „Ustęp” jest godny stylistycznie i nie wprowadza nowoczesnego urządzenia sanitarnego.
- source_word: ἐκβάλλεται
  choice: zostaje wydalone
  rationale: Strona bierna opisuje usunięcie z organizmu; „zostaje wydalone” precyzyjnie i bez zbędnej dosadności oddaje sens fizjologiczny.
theological_decisions:
- issue: Związek wypowiedzi Jezusa z przepisami o czystości rytualnej
  choice: Oddać dosłownie fizjologiczne stwierdzenie bez dodawania formuły o uznaniu wszystkich pokarmów za czyste.
  alternative: Dodać interpretacyjne objaśnienie, że w ten sposób wszystkie pokarmy zostają uznane za czyste.
  rationale: Sam werset opisuje drogę pokarmu i służy argumentowi Jezusa o tym, co kala człowieka, lecz nie zawiera komentarza interpretacyjnego z Mk 7,19. Niedodawanie go zachowuje zakres i napięcie tekstu Mateusza.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Zdanie zachowuje formę pytania napominającego oraz konkretny, fizjologiczny obraz bez archaizacji i bez nadmiernej dosadności.
