id: MAT.15.38
reference: Matthew 15:38
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: pl
  text: A tych, którzy jedli, było cztery tysiące mężczyzn, nie licząc kobiet i dzieci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: A tych
  rationale: δέ jest łagodnym spójnikiem narracyjnym, a rodzajnik z imiesłowem tworzy wyrażenie rzeczownikowe; „A tych” naturalnie zachowuje oba elementy bez sugerowania silnego przeciwstawienia.
- source_word: ἐσθίοντες
  choice: którzy jedli
  rationale: Imiesłów czasu teraźniejszego wskazuje na uczestników posiłku; polskie „którzy jedli” jest naturalne i w tym kontekście może odnosić się do właśnie zakończonego jedzenia.
- source_word: ἦσαν
  choice: było
  rationale: Prosta forma łącznikowa wprowadza liczebność grupy; w polskiej konstrukcji ilościowej właściwa jest forma „było”.
- source_word: τετρακισχίλιοι
  choice: cztery tysiące
  rationale: Bezpośredni odpowiednik liczebnika greckiego.
- source_word: ἄνδρες
  choice: mężczyzn
  rationale: ἀνήρ oznacza tutaj mężczyzn, nie ogólnie ludzi; osobne wymienienie kobiet i dzieci potwierdza to rozróżnienie.
- source_word: χωρὶς
  choice: nie licząc
  rationale: W formule podawania liczby χωρίς wskazuje, że kobiety i dzieci nie zostały włączone do liczby czterech tysięcy; „nie licząc” wyraża to jasno i naturalnie.
- source_word: γυναικῶν
  choice: kobiet
  rationale: Ogólne znaczenie „kobiety” pasuje do kontekstu i nie zawęża odniesienia do żon.
- source_word: καὶ παιδίων
  choice: i dzieci
  rationale: παιδίον może oznaczać dziecko lub małe dziecko; neutralne „dzieci” nie wprowadza nieuzasadnionego ograniczenia wieku.
theological_decisions:
- issue: Formuła liczenia z rozróżnieniem płci i wieku
  choice: Zachować „mężczyzn” oraz osobno wymienić kobiety i dzieci.
  alternative: Oddać ἄνδρες jako „ludzi”.
  rationale: Grecki tekst wyraźnie mówi o ἄνδρες, a następnie wymienia kobiety i dzieci jako grupy nieuwzględnione w podanej liczbie. „Ludzi” zatarłoby rozróżnienie obecne w źródle.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Składnia jest naturalna, a zarazem bliska strukturze greckiej; nie dodano znaczeń doktrynalnych ani niewyrażonego wprost określenia czasowego.
