  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: pl
  text: Wszyscy zjedli i najedli się do syta, a z pozostałych kawałków zebrali siedem pełnych koszy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „siedem pełnych dużych koszy”. Użyte tu greckie słowo σπυρίς może oznaczać większy rodzaj kosza niż kosze wspomniane w niektórych innych opisach nakarmienia tłumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: jedli
  rationale: Aoryst czasownika ἐσθίω oznacza po prostu „jedli”; greka nie wyraża dopełnienia, dlatego nie dodano go także w przekładzie.
- source_word: πάντες
  choice: wszyscy
  rationale: Oddaje powszechny zakres wypowiedzi i naturalnie odnosi się do całego zgromadzonego tłumu.
- source_word: ἐχορτάσθησαν
  choice: najedli się do syta
  rationale: Czasownik oznacza, że zostali nakarmieni aż do pełnego nasycenia; to naturalne, współczesne sformułowanie zachowuje ten sens.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: pozostałe kawałki
  rationale: Imiesłów z rodzajnikiem oznacza to, co pozostało, a κλάσματα — kawałki, zapewne połamanego chleba lub pokarmu. Zwięzłe wyrażenie nie dopowiada rodzaju żywności.
- source_word: ἦραν
  choice: zebrali
  rationale: W kontekście pozostałości po posiłku αἴρω opisuje ich podniesienie i zebranie; polskie „zebrali” brzmi naturalnie i jasno.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: siedem pełnych koszy
  rationale: Zachowuje liczbę, rzeczownik i określenie pełności. Informację o możliwie dużym rozmiarze koszy podano w przypisie, ponieważ sam rzeczownik nie wymaga jej każdorazowego wyrażenia w tekście głównym.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny rejestr. Podział na dwa zdania ułatwia odbiór bez zmiany relacji wydarzeń; pauza zachowuje grecką konstrukcję, w której „siedem pełnych koszy” określa ilość zebranych resztek.
