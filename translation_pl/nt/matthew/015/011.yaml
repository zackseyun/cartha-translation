id: MAT.15.11
reference: Matthew 15:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: pl
  text: Nie to, co wchodzi do ust, czyni człowieka nieczystym[a], lecz to, co wychodzi z ust — właśnie to czyni człowieka nieczystym.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „kala”. W tym kontekście grecki czasownik oznacza uczynienie kogoś nieczystym lub skalanym w sensie związanym z czystością rytualną.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: czyni nieczystym
  rationale: W kontekście sporu o czystość czasownik κοινόω oznacza uczynienie kogoś nieczystym, zwłaszcza w sensie religijnym. Sformułowanie „czyni nieczystym” jest naturalne po polsku i zachowuje związek z kategoriami czystości, nie ograniczając wypowiedzi do zwykłego zabrudzenia.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: to, co wchodzi do ust
  rationale: Imiesłów z rodzajnikiem ma funkcję rzeczownikową. Konstrukcja „to, co wchodzi do ust” naturalnie oddaje zarówno tę funkcję, jak i konkretny obraz zawarty w tekście greckim.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: to, co wychodzi z ust
  rationale: 'Naturalny polski odpowiednik rzeczownikowo użytego imiesłowu, zachowujący przeciwstawienie kierunków: „do ust” i „z ust”.'
- source_word: τὸν ἄνθρωπον
  choice: człowieka
  rationale: Ἄνθρωπος oznacza tu człowieka jako przedstawiciela ogółu ludzi. Polskie „człowiek” ma w tym zdaniu naturalną, ogólną siłę i nie wymaga zawężenia do mężczyzny.
- source_word: τοῦτο
  choice: właśnie to
  rationale: 'Jawne oddanie zaimka wskazującego zachowuje nacisk położony w grece na drugi człon: właśnie to, co wychodzi z ust, czyni człowieka nieczystym.'
- source_word: οὐ ... ἀλλὰ
  choice: nie ... lecz ...
  rationale: Ta konstrukcja jasno i godnie oddaje greckie przeciwstawienie, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
theological_decisions:
- issue: Znaczenie języka czystości w κοινόω
  choice: czyni nieczystym
  alternative: bezcześci; kala
  rationale: Wybrane sformułowanie zachowuje obecny w kontekście sens czystości religijnej, a jednocześnie nie rozstrzyga sztucznie, że chodzi wyłącznie o status rytualny albo wyłącznie o skalanie moralne.
- issue: Ogólny sens ἄνθρωπος
  choice: człowieka
  alternative: osobę; mężczyznę
  rationale: Greckie ἄνθρωπος odnosi się tutaj reprezentatywnie do istoty ludzkiej. Polski rzeczownik „człowiek” wiernie zachowuje liczbę pojedynczą i ogólny zakres wypowiedzi bez wprowadzania znaczenia właściwego słowu „mężczyzna”.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Paralelna budowa obu części zachowuje retoryczne przeciwstawienie oryginału, a „właśnie to” odtwarza nacisk greckiego τοῦτο.
