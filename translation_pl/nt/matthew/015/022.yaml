id: MAT.15.22
reference: Matthew 15:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: pl
  text: 'A oto pewna Kananejka wyszła z tamtych okolic i wołała: „Zmiłuj się nade mną, Panie, Synu Dawida! Moją córkę straszliwie dręczy demon[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „moja córka jest ciężko opętana przez demona” albo „demon straszliwie ją gnębi”.'
    reason: Grecki czasownik wskazuje na działanie demona, ale nie określa precyzyjnie charakteru tego stanu; polskie „opętana” może sugerować bardziej szczegółową diagnozę niż sam tekst.
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje funkcję narracyjnego zwrócenia uwagi i żywość wypowiedzi, a zarazem brzmi naturalnie i godnie we współczesnej polszczyźnie.
- source_word: Χαναναία
  choice: Kananejka
  rationale: Oddaje dokładne określenie użyte przez Mateusza i zachowuje jego historyczne oraz teologiczne skojarzenia; nie zastępuje go określeniem „Syrofenicjanka” z paralelnego opowiadania Marka.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: z tamtych okolic
  rationale: Naturalnie oddaje odniesienie do tamtego terytorium lub regionu, nie sprowadzając liczby mnogiej ὅρια do dosłownych granic.
- source_word: ἐξελθοῦσα
  choice: wyszła
  rationale: Imiesłów aorystu został przełożony jako polski czasownik osobowy, co zachowuje kolejność wydarzeń bez niezręcznej konstrukcji imiesłowowej.
- source_word: ἔκραζεν
  choice: wołała
  rationale: Czas niedokonany oddaje trwające lub ponawiane wołanie; polska forma niedokonana zachowuje ten aspekt.
- source_word: Ἐλέησόν με
  choice: Zmiłuj się nade mną
  rationale: To utrwalone, zrozumiałe i podniosłe oddanie pilnej prośby o miłosierdzie.
- source_word: κύριε
  choice: Panie
  rationale: W połączeniu z tytułem „Synu Dawida” zachowuje możliwy sens czci i mesjańskiego uznania, nie ograniczając zwrotu do grzecznościowego „proszę pana”.
- source_word: υἱὸς Δαυίδ
  choice: Synu Dawida
  rationale: Dosłownie zachowuje rozpoznawalny tytuł mesjański i jego królewsko-Dawidowe znaczenie; wołacz odpowiada polskiej składni bezpośredniego zwrotu.
- source_word: κακῶς
  choice: straszliwie
  rationale: Wyraża ciężki stan córki i naglący ton matczynej prośby; w tym zdaniu brzmi naturalniej niż dosłowne „źle”.
- source_word: δαιμονίζεται
  choice: dręczy demon
  rationale: Jasno zachowuje demoniczne sprawstwo, ale nie rozstrzyga ponad miarę, jaki dokładnie stan oznacza grecki czasownik. Strona czynna jest naturalna po polsku i odpowiada sensowi biernego doświadczania działania demona.
theological_decisions:
- issue: Znaczenie κύριε w zwrocie połączonym z tytułem mesjańskim
  choice: Panie
  alternative: panie / proszę pana
  rationale: Połączenie z „Synu Dawida” przemawia za zachowaniem mocniejszego, pełnego czci tytułu. Przekład nie przesądza jednak, jak pełne było chrystologiczne rozumienie kobiety.
- issue: Zakres znaczeniowy δαιμονίζεται
  choice: dręczy demon
  alternative: jest opętana przez demona
  rationale: Tekst jednoznacznie przypisuje stan córki działaniu demonicznemu, lecz sam czasownik nie opisuje dokładnej natury ani stopnia tego oddziaływania. Tekst główny zachowuje sprawstwo demona, a przypis podaje tradycyjne mocniejsze sformułowanie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. „A oto” zachowuje Mateuszowe zwrócenie uwagi, a niedokonane „wołała” oddaje ciągłość lub powtarzalność czynności. Bezpośrednia mowa jest pilna i emocjonalna, lecz nie potoczna.
