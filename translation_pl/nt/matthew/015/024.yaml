  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: pl
  text: 'On zaś odpowiedział: „Zostałem posłany tylko do zaginionych owiec z domu Izraela”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo dosłowniej: „Nie zostałem posłany, jeśli nie do zaginionych owiec z domu Izraela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: On zaś odpowiedział
  rationale: Naturalny polski odpowiednik konstrukcji z imiesłowem i czasownikiem mówienia; zachowuje łagodny zwrot lub kontrast wyrażony przez δέ bez niezręcznego „odpowiadając, powiedział”.
- source_word: Οὐκ ἀπεστάλην
  choice: Zostałem posłany
  rationale: Aoryst strony biernej wskazuje na powierzoną misję; polski czas przeszły dokonany oddaje tę formę naturalnie i bez dopowiadania sprawcy.
- source_word: εἰ μὴ
  choice: tylko do
  rationale: W połączeniu z przeczeniem wyraża wyłączenie i ograniczenie. Konstrukcja „zostałem posłany tylko do” jest naturalna po polsku, a sens dosłowniejszej formy podaje przypis.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: zaginionych owiec
  rationale: Zachowuje metaforę owiec oraz stan zagubienia. „Zaginione” jest w tym obrazie naturalniejsze niż „zgubione” i nie sugeruje ostatecznej zagłady.
- source_word: οἴκου Ἰσραήλ
  choice: z domu Izraela
  rationale: Zachowuje biblijny, narodowo-przymierzowy idiom greckiego dopełniacza, nie redukując go do samego określenia „Izraelitów”.
theological_decisions:
- issue: Zakres misji Jezusa wyrażony w tej wypowiedzi
  choice: 'Zachowano jednoznacznie ograniczającą formę: „tylko do zaginionych owiec z domu Izraela”.'
  alternative: Parafraza sugerująca jedynie pierwszeństwo Izraela albo rozszerzająca wypowiedź w świetle późniejszej misji do narodów.
  rationale: Greckie Οὐκ ... εἰ μὴ ma wyraźnie restrykcyjny charakter. Przekład zachowuje napięcie narracyjne i teologiczne, nie rozstrzygając go przez dodanie treści spoza wersetu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjnie brzmiące wyrażenie „dom Izraela” ze względu na jego znaczenie biblijne. Marker przypisu umieszczono po całej wypowiedzi.
