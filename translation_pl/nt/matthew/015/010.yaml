  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: pl
  text: 'A przywoławszy do siebie tłum, powiedział im: „Słuchajcie i zrozumcie”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Potem
  rationale: Spójnik rozwija tok narracji; „Potem” naturalnie łączy ten epizod z poprzednim bez dodawania istotnej treści interpretacyjnej.
- source_word: προσκαλεσάμενος
  choice: przywołał do siebie
  rationale: Imiesłów aorystu opisuje czynność poprzedzającą wypowiedź. Polski czasownik osobowy pozwala oddać tę kolejność naturalnie, a „do siebie” zachowuje kierunkowy sens czasownika.
- source_word: τὸν ὄχλον
  choice: tłum
  rationale: „Tłum” jest współczesnym i precyzyjnym odpowiednikiem określenia zgromadzonej grupy ludzi.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział im
  rationale: Bezpośredni, formalnie bliski i naturalny odpowiednik greckiej konstrukcji.
- source_word: Ἀκούετε
  choice: Słuchajcie
  rationale: Tryb rozkazujący liczby mnogiej wzywa do uważnego słuchania, nie tylko do fizycznego słyszenia.
- source_word: συνίετε
  choice: zrozumcie
  rationale: Czasownik oznacza uchwycenie sensu usłyszanych słów; „zrozumcie” zachowuje rozkazujący charakter i naturalne zestawienie ze „Słuchajcie”.
