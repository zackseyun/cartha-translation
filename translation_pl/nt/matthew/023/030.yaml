  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: pl
  text: 'I mówicie: „Gdybyśmy żyli w czasach naszych ojców, nie uczestniczylibyśmy wraz z nimi w przelaniu krwi proroków”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγετε
  choice: mówicie
  rationale: Czas teraźniejszy, druga osoba liczby mnogiej; naturalnie oddaje bezpośredni zwrot Jezusa.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Gdybyśmy żyli w czasach
  rationale: Polski tryb warunkowy jasno oddaje nierzeczywistą sytuację dotyczącą przeszłości, a „żyli w czasach” naturalnie przekazuje grecki idiom.
- source_word: τῶν πατέρων ἡμῶν
  choice: naszych ojców
  rationale: Zachowuje dosłowne, męskie określenie πατέρων oraz uroczysty, lecz zrozumiały rejestr.
- source_word: οὐκ ἂν ἤμεθα αὐτῶν κοινωνοὶ
  choice: nie uczestniczylibyśmy wraz z nimi
  rationale: κοινωνοί wskazuje na współudział lub wspólne zaangażowanie. Forma czasownikowa brzmi naturalniej po polsku i nie przesądza mocniejszego znaczenia „wspólnicy”.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: w przelaniu krwi proroków
  rationale: W polszczyźnie samo „uczestniczyć w krwi” byłoby nienaturalne. „Przelanie krwi” ujawnia idiomatyczny sens przemocy i odpowiedzialności za śmierć, zachowując obraz krwi.
theological_decisions:
- issue: Stopień współudziału wyrażony przez κοινωνοὶ ἐν τῷ αἵματι
  choice: uczestniczylibyśmy wraz z nimi w przelaniu krwi proroków
  alternative: bylibyśmy ich wspólnikami w krwi proroków
  rationale: Wybrane sformułowanie oddaje moralny współudział w zabijaniu proroków, ale nie wzmacnia tekstu do jednoznacznego „morderstwa” ani technicznej „winy krwi”. Zachowuje też relacyjne „wraz z nimi”.
translation_notes:
  register: Współczesna, godna polszczyzna z zachowaniem biblijnego obrazu „krwi proroków”. Składnia warunkowa jest naturalna i jednoznacznie odnosi się do hipotetycznej przeszłości.
