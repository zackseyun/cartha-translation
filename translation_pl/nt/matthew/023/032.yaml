  text: And you[a], fill up the measure of your fathers.
translation:
  language: pl
  text: A wy dopełnijcie miary waszych ojców.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dopełnijcie pełnej miary grzechów waszych ojców”. Dosłownie po grecku: „dopełnijcie miary waszych ojców”; jest to obraz nagromadzonej winy dochodzącej do swej granicy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A
  rationale: Oddaje grecki spójnik i zachowuje retoryczną ciągłość z poprzednim zdaniem.
- source_word: ὑμεῖς
  choice: wy
  rationale: Jawny zaimek jest w grece emfatyczny; polskie „wy” zachowuje nacisk bez sztucznego wzmacniania.
- source_word: πληρώσατε
  choice: dopełnijcie
  rationale: Forma aorystu w trybie rozkazującym, 2. osoba liczby mnogiej. „Dopełnijcie” naturalnie zachowuje zarówno rozkaz, jak i metaforę doprowadzenia miary do pełni.
- source_word: τὸ μέτρον
  choice: miary
  rationale: Dosłowne zachowanie metafory określonej ilości, która osiąga swój kres; dopełniacz wynika z polskiej składni czasownika „dopełnić”.
- source_word: τῶν πατέρων ὑμῶν
  choice: waszych ojców
  rationale: Zachowuje dosłowne „ojców” oraz retoryczne powiązanie adresatów z poprzednikami; w kontekście chodzi o przodków.
theological_decisions:
- issue: Rozkaz czy ironiczna zapowiedź
  choice: Zachowano gramatyczny rozkaz „dopełnijcie”, mający w kontekście ironiczną i sądowniczą siłę.
  alternative: „Dopełniacie” albo „dopełnicie” jako opis lub zapowiedź.
  rationale: πληρώσατε jest morfologicznie aorystem czynnym trybu rozkazującego w 2. osobie liczby mnogiej. Przekład nie łagodzi tej formy do zwykłej przepowiedni, lecz pozostawia napięcie retoryczne.
translation_notes:
  register: Współczesny, zwięzły i podniosły rejestr. „Dopełnijcie miary” jest naturalnym polskim związkiem frazeologicznym, który zachowuje źródłową metaforę oraz rozkazujący ton.
