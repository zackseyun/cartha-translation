id: MAT.23.22
reference: Matthew 23:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: pl
  text: A kto przysięga na niebo, przysięga na tron Boga i na Tego, który na nim zasiada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Tego, który na nim siedzi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: kto przysięga
  rationale: Rodzajnikowy imiesłów aorystu ma sens ogólny i rzeczownikowy; polski czas teraźniejszy naturalnie wyraża zasadę ogólną.
- source_word: ἐν
  choice: na
  rationale: W polskich formułach przysięgi idiomatycznym odpowiednikiem greckiego ἐν z celownikiem jest „przysięgać na”, a nie przestrzenne „w”.
- source_word: οὐρανῷ
  choice: niebo
  rationale: W tym kontekście religijnym, bezpośrednio powiązanym z tronem Boga, chodzi o niebo, nie jedynie o fizyczne sklepienie niebieskie.
- source_word: ὀμνύει
  choice: przysięga
  rationale: Czas teraźniejszy oznajmujący przedstawia prawdę ogólną; polski czas teraźniejszy oddaje ją jasno i naturalnie.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: tron Boga
  rationale: Sformułowanie zachowuje jawną konstrukcję dopełniaczową tekstu greckiego oraz uroczysty ton.
- source_word: τῷ καθημένῳ
  choice: Tego, który zasiada
  rationale: Imiesłów wskazuje na osobę zasiadającą na tronie. „Zasiada” jest naturalne w obrazie królewskiego tronu i zachowuje reverencyjny charakter omówienia.
- source_word: ἐπάνω αὐτοῦ
  choice: na nim
  rationale: W kontekście tronu przyimek oznacza położenie na nim, nie ponad nim w sensie przestrzennego oddalenia; zaimek odnosi się do tronu.
theological_decisions:
- issue: Tożsamość „Tego, który na nim zasiada”
  choice: Zachowano pełne czci omówienie odnoszące się do Boga zasiadającego na tronie.
  alternative: 'Można oddać bardziej opisowo: „tego, który na nim siedzi”, bez typograficznego wskazania referenta.'
  rationale: Bezpośrednie określenie „tron Boga” jasno wskazuje referenta, a logika wersetu polega na tym, że przysięga na niebo obejmuje także samego Boga. Nie zastąpiono jednak greckiego omówienia bezpośrednio słowem „Bóg”.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Zasiada” podtrzymuje obraz tronu bez archaizowania; wielka litera w „Tego” sygnalizuje jednoznaczne w kontekście odniesienie do Boga.
