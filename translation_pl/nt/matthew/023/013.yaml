source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: pl
  text: A biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Zamykacie bowiem przed ludźmi królestwo niebios. Sami do niego nie wchodzicie ani nie pozwalacie wejść tym, którzy wchodzą[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „tym, którzy usiłują wejść”. Grecki imiesłów może opisywać zarówno osoby będące w trakcie wchodzenia, jak i zmierzające do wejścia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: A biada wam
  rationale: „Biada” zachowuje moc prorockiego potępienia, a „A” naturalnie oddaje przejście wyrażone przez δέ.
- source_word: γραμματεῖς
  choice: uczeni w Piśmie
  rationale: To współczesne i zrozumiałe określenie żydowskich znawców oraz nauczycieli Pisma, trafniejsze kontekstowo niż zawodowe „pisarze”.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska nazwa tej grupy religijnej.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Oddaje zarzut religijnej i moralnej obłudy w naturalnej, godnej polszczyźnie.
- source_word: κλείετε
  choice: zamykacie
  rationale: Zachowuje metaforę zamknięcia dostępu do królestwa.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Utrwalone i naturalne polskie oddanie charakterystycznego dla Mateusza wyrażenia; liczba mnoga „niebios” odpowiada formie greckiej.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: przed ludźmi
  rationale: Zwięźle zachowuje obraz zamykania dostępu komuś stojącemu przed wejściem; ἀνθρώπων ma tu znaczenie ogólne.
- source_word: οὐκ εἰσέρχεσθε
  choice: sami do niego nie wchodzicie
  rationale: Zaimek „sami” uwydatnia wyrażone w grece ὑμεῖς, a „do niego” naturalnie wskazuje na wcześniej wymienione królestwo.
- source_word: τοὺς εἰσερχομένους
  choice: tym, którzy wchodzą
  rationale: Zachowuje aspekt teraźniejszego imiesłowu oraz celową powtórkę rdzenia „wchodzić” bez przesądzania, czy chodzi o faktyczne wchodzenie, czy o podjętą próbę.
- source_word: ἀφίετε εἰσελθεῖν
  choice: nie pozwalacie wejść
  rationale: W tej konstrukcji ἀφίημι oznacza pozwolenie; polskie wyrażenie jest naturalne i wyraźnie oddaje bezokolicznik εἰσελθεῖν.
theological_decisions:
- issue: Znaczenie wyrażenia βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  alternative: królestwo nieba; królestwo Boże
  rationale: Przekład zachowuje właściwe Mateuszowi sformułowanie i nie narzuca ani nie wyklucza teologicznego utożsamienia go z „królestwem Bożym”.
- issue: Aspekt τοὺς εἰσερχομένους
  choice: tym, którzy wchodzą
  alternative: tym, którzy usiłują wejść
  rationale: 'Tekst główny zachowuje formalną niejednoznaczność imiesłowu: może on przedstawiać ludzi jako będących w trakcie wchodzenia, podczas gdy kontekst dopuszcza sens podejmowania próby wejścia.'
translation_notes:
  register: Współczesna, godna polszczyzna o profetycznej sile. Powtórzenie „wejść — wchodzą” pozostawiono świadomie, ponieważ odpowiada greckiemu εἰσερχομένους… εἰσελθεῖν i zachowuje napięcie wypowiedzi.
