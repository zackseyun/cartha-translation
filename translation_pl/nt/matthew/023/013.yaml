  terminology: Nazwy grup („uczeni w Piśmie”, „faryzeusze”) są trafne. „Królestwo niebios” adekwatnie zachowuje charakterystyczne Mateuszowe wyrażenie bez zastępowania go interpretacyjnym „królestwem Bożym”. Przypis jest właściwie zakotwiczony przy „wchodzą” i uczciwie sygnalizuje możliwy odcień usiłowania wejścia.
