id: MAT.23.27
reference: Matthew 23:27
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: pl
  text: Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Jesteście bowiem podobni do pobielanych grobowców[a], które z zewnątrz wydają się piękne, lecz wewnątrz są pełne kości umarłych i wszelkiej nieczystości[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie także: „grobowców pokrytych wapnem”.'
    reason: lexical_alternative
  - marker: b
    text: „Nieczystość” może tutaj obejmować zarówno rytualne skalanie związane ze szczątkami zmarłych, jak i zepsucie moralne.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Biada
  rationale: Zachowuje prorocki ton groźby i osądu, silniejszy niż wyrażenie samego żalu.
- source_word: γραμματεῖς
  choice: uczeni w Piśmie
  rationale: Naturalne i utrwalone we współczesnej polszczyźnie określenie żydowskich znawców oraz nauczycieli Pisma; jest czytelniejsze niż samo „pisarze”.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Standardowa polska nazwa tej grupy religijnej.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: W kontekście nagany oznacza ludzi skrywających wewnętrzne zepsucie pod pozorem religijności; „obłudnicy” oddaje to naturalnie i bez zawężania do scenicznego sensu „aktorzy”.
- source_word: παρομοιάζετε
  choice: jesteście podobni do
  rationale: Bezpośrednio i idiomatycznie oddaje porównanie skierowane do adresatów.
- source_word: τάφοις κεκονιαμένοις
  choice: pobielanych grobowców
  rationale: „Grobowce” dobrze pasują do widocznych budowli grobowych, a „pobielanych” zachowuje obraz pokrycia wapnem.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: z zewnątrz ... lecz wewnątrz
  rationale: Zachowuje wyrazisty kontrast między wyglądem zewnętrznym a rzeczywistym stanem wnętrza.
- source_word: φαίνονται ὡραῖοι
  choice: wydają się piękne
  rationale: Oddaje zarówno wrażenie wizualnego piękna, jak i nacisk na pozór.
- source_word: γέμουσιν
  choice: są pełne
  rationale: Naturalny polski odpowiednik czasownika oznaczającego bycie wypełnionym czymś.
- source_word: ὀστέων νεκρῶν
  choice: kości umarłych
  rationale: Naturalnie oddaje konstrukcję dopełniaczową i jasno wskazuje, że chodzi o szczątki zmarłych ludzi.
- source_word: πάσης ἀκαθαρσίας
  choice: wszelkiej nieczystości
  rationale: Zachowuje szeroki zakres znaczeniowy obejmujący w obrazie grobu nieczystość rytualną, a w naganie także zepsucie moralne.
theological_decisions:
- issue: Zakres znaczeniowy ἀκαθαρσία w metaforze
  choice: wszelka nieczystość
  alternative: wszelka nieczystość rytualna / wszelkie zepsucie moralne
  rationale: Groby przywołują żydowski kontekst rytualnego skalania, natomiast cała nagana dotyczy również wewnętrznego zepsucia moralnego. Ogólne sformułowanie zachowuje oba aspekty bez rozstrzygania napięcia.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano retoryczną ostrość wypowiedzi oraz symetryczny kontrast „z zewnątrz — wewnątrz”. Termin „uczeni w Piśmie” jest czytelny dla zwykłego odbiorcy i historycznie stosowny.
source_grounding:
  english_pob_role: consult_only
