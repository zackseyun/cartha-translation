id: MAT.23.3
reference: Matthew 23:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: pl
  text: Czyńcie więc i zachowujcie wszystko, co wam powiedzą, ale nie postępujcie według ich uczynków[a], mówią bowiem, lecz nie czynią.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „nie postępujcie tak jak oni”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: więc ... wszystko, co
  rationale: 'Konstrukcja πάντα ὅσα ἐὰν ma znaczenie całościowe: „wszystko, co”. οὖν oddano inferencyjnie jako „więc”, naturalnie łącząc nakaz z poprzednim zdaniem.'
- source_word: εἴπωσιν ὑμῖν
  choice: wam powiedzą
  rationale: λέγω oznacza tu po prostu „powiedzieć” komuś; przekład nie dodaje interpretacyjnego „nauczą” ani „polecą”.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: czyńcie ... i zachowujcie
  rationale: Rozróżnienie ποιέω i τηρέω zachowano przez dwa czasowniki. „Zachowujcie” w tym kontekście znaczy przestrzegajcie tego, co zostało powiedziane, bez zawężenia sensu do samego posłuszeństwa.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: ale nie postępujcie według ich uczynków
  rationale: κατά z biernikiem wyraża zgodność ze wzorem lub normą. „Według ich uczynków” zachowuje rzeczownik ἔργα i formalny związek z językiem działania, natomiast „postępujcie” daje naturalny polski zakaz naśladowania ich praktyki.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: mówią bowiem, lecz nie czynią
  rationale: Zwięzła antyteza zachowuje kontrast między mową a działaniem. Polskie „lecz” naturalnie oddaje przeciwstawny sens καί w połączeniu z przeczeniem, nie dodając niewyrażonego dopełnienia.
theological_decisions:
- issue: Czy doprecyzować, że chodzi o nauczanie uczonych w Piśmie i faryzeuszów zasiadających na mównicy Mojżesza
  choice: Pozostawić przedmiot wypowiedzi niewyszczególniony, tak jak w wersecie greckim.
  alternative: „Czyńcie wszystko, czego was nauczają” albo „wszystko, co mówią wam z mównicy Mojżesza”.
  rationale: Kontekst poprzedniego wersetu wskazuje osoby i sytuację, ale werset 3 nie powtarza tych informacji. Ich dodanie rozstrzygałoby zakres nakazu szerzej, niż czyni to samo zdanie.
- issue: Czy stylistycznie wygładzić powtórzenia rdzenia ποιέω
  choice: Zachować język czynienia i działania na tyle, na ile pozwala naturalna polszczyzna.
  alternative: „Wypełniajcie ich naukę, ale ich nie naśladujcie, bo głoszą jedno, a robią drugie”.
  rationale: Powtórzenie ποιέω tworzy retoryczne napięcie między nakazem a zarzutem obłudy. Parafraza „głoszą jedno, a robią drugie” dodawałaby treść niewyrażoną wprost.
translation_notes:
  register: Współczesna, godna polszczyzna. „Czyńcie” i „uczynki” zachowują biblijny rejestr oraz więź leksykalną z ποιέω/ἔργα, a „postępujcie” zapobiega niezręcznemu nagromadzeniu form „czynić”. Marker [a] umieszczono bezpośrednio po wyrażeniu, którego dotyczy wariant.
