  terminology: „Uczynki” jest trafnym odpowiednikiem ἔργα i dobrze współbrzmi z rejestrem przekładu. Rozróżnienie między „czyńcie”, „zachowujcie” i „postępujcie” zachowuje sens źródłowy bez nienaturalnego mechanicznego powtarzania jednego polskiego czasownika. Przypis [a] jest właściwie zakotwiczony i podaje dopuszczalną, mniej dosłowną alternatywę.
