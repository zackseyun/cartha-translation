  verdict: approve
  source_fidelity: Przekład wiernie oddaje całościowy zakres πάντα ὅσα ἐὰν („wszystko, co”), wnioskowe οὖν („więc”), dwa nakazy ποιήσατε καὶ τηρεῖτε („czyńcie i zachowujcie”) oraz zakaz postępowania według uczynków tych osób. Końcowa antyteza „mówią bowiem, lecz nie czynią” trafnie zachowuje zwięzłość i kontrast greckiego λέγουσιν γὰρ καὶ οὐ ποιοῦσιν, bez dopowiadania przedmiotu czynności.
