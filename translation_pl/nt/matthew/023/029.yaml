id: MAT.23.29
reference: Matthew 23:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: pl
  text: Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo budujecie grobowce proroków i ozdabiacie pomniki[a] sprawiedliwych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „miejsca pamięci” lub „grobowce”. Grecki wyraz może oznaczać miejsce pamięci, grobowiec lub pomnik nagrobny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Biada
  rationale: Tradycyjny, nadal zrozumiały polski okrzyk prorockiej groźby i żalu; zachowuje moc sądu obecną w kontekście.
- source_word: γραμματεῖς
  choice: znawcy Prawa
  rationale: W tym kontekście określa żydowskich ekspertów w dziedzinie Prawa; naturalniej i precyzyjniej niż współczesne znaczenie słowa „uczeni” lub historyzujące „uczeni w Piśmie”.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska nazwa tej grupy religijnej.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Oddaje moralno-religijną pozorność piętnowaną w tej wypowiedzi i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza przyczynę wypowiedzenia groźby; „bo” naturalnie łączy całe zdanie bez osłabiania związku przyczynowego.
- source_word: οἰκοδομεῖτε
  choice: budujecie
  rationale: Zachowuje prosty sens czasu teraźniejszego bez dopowiadania, że chodzi o odbudowę.
- source_word: τάφους
  choice: grobowce
  rationale: Pasuje do budowanych miejsc pochówku i odróżnia je od zwykłych grobów.
- source_word: κοσμεῖτε
  choice: ozdabiacie
  rationale: Jasno oddaje czynność upiększania lub dekorowania.
- source_word: μνημεῖα
  choice: pomniki
  rationale: Zachowuje odrębność od τάφους i uwydatnia funkcję upamiętniającą, choć grecki wyraz może także oznaczać grobowce lub nagrobne miejsca pamięci.
- source_word: δικαίων
  choice: sprawiedliwych
  rationale: Substantywizowany przymiotnik oznacza ludzi uznanych za sprawiedliwych; zwięzłe określenie zachowuje kategorię moralno-teologiczną tekstu.
theological_decisions:
- issue: Znaczenie δικαίων
  choice: sprawiedliwych
  alternative: prawych
  rationale: „Sprawiedliwi” zachowuje stałe biblijne słownictwo moralno-teologiczne, nie ograniczając sensu do uczciwości ani nie narzucając późniejszego systemu doktrynalnego.
translation_notes:
  register: Język współczesny, godny i bezpośredni. Składnia zachowuje jedność groźby i podanej przyczyny. Dobór „pomniki” pozwala nie zacierać rozróżnienia między τάφους i μνημεῖα, a przypis zachowuje rzeczywistą wieloznaczność drugiego terminu.
