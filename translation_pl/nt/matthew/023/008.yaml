  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: pl
  text: Wy zaś nie dajcie się nazywać „Rabbi”[a], bo jeden jest waszym nauczycielem, a wy wszyscy jesteście braćmi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tytuł „Rabbi” ma sens „nauczyciel”. Zachowano jego brzmienie, aby oddać żydowski kontekst i nie utożsamiać go całkowicie ze słowem „nauczyciel” występującym dalej w wersecie.
    reason: lexical_alternative
  - marker: b
    text: Greckie ἀδελφοί ma formę męską („bracia”); w tym kontekście może zbiorowo oznaczać członków wspólnoty uczniów.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: nie pozwalajcie, by nazywano was
  rationale: Oddaje bierną formę grecką i wyraźną siłę zakazu w naturalnej współczesnej polszczyźnie, bez sugerowania jedynie, że uczniowie sami nadają sobie ten tytuł.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Zachowanie transliterowanego tytułu podtrzymuje żydowski kontekst wypowiedzi i nie zaciera jego odrębności względem późniejszego słowa διδάσκαλος.
- source_word: εἷς
  choice: jeden
  rationale: Jest to bezpośredni odpowiednik greckiego liczebnika i zachowuje nacisk na jedyność bez dodawania mocniejszego interpretacyjnie słowa „jedyny”.
- source_word: ὁ διδάσκαλος
  choice: wasz nauczyciel
  rationale: Dopełniacz ὑμῶν wyraża relację nauczyciela do uczniów; taki szyk pozostaje naturalny po polsku, a zarazem zachowuje emfatyczne „jeden”.
- source_word: πάντες δὲ ὑμεῖς
  choice: a wy wszyscy
  rationale: Sformułowanie zachowuje zbiorowy nacisk obejmujący całą grupę oraz kontrast wprowadzany przez δέ.
- source_word: ἀδελφοί
  choice: braćmi
  rationale: Forma męskoosobowa wiernie zachowuje grecki rzeczownik i rodzinną metaforę; możliwy szerszy zakres odnoszący się do wspólnoty uczniów objaśnia przypis.
theological_decisions:
- issue: Czy zakaz dotyczy bezwzględnie wszelkiego użycia tytułów wobec ludzi, czy dążenia do statusu we wspólnocie uczniów
  choice: Zachowano bezpośredni zakaz zawarty w wersecie bez rozszerzania go na sformułowaną w przekładzie ogólną regułę doktrynalną.
  alternative: Można go rozumieć jako absolutny zakaz wszelkich analogicznych tytułów albo węziej, wyłącznie jako krytykę ambicji i zabiegania o prestiż.
  rationale: Sam tekst podaje zakaz i jego uzasadnienie, lecz nie rozstrzyga wszystkich późniejszych zastosowań; przekład zachowuje tę otwartość.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcja „nie pozwalajcie, by nazywano was” brzmi naturalnie po polsku i zachowuje stronę bierną oraz siłę zakazu. Pisownia „nauczyciel” małą literą nie przesądza ponad tekstem, czy wyraz funkcjonuje jako formalny tytuł chrystologiczny.
