base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: pl
  text: 'Zaprawdę mówię wam: to wszystko spadnie na to pokolenie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wyrażenie „to pokolenie” bywa też rozumiane szerzej jako „ci ludzie” albo jako pokolenie cechujące się niewiarą, jednak grecki tekst mówi najbardziej bezpośrednio: „to pokolenie”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: W synoptycznej formule uroczystego zapewnienia tradycyjne „zaprawdę” trafnie oddaje stanowczą i podniosłą funkcję ἀμήν, a zarazem pozostaje zrozumiałe we współczesnej polszczyźnie.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośredni odpowiednik greckiego czasownika w czasie teraźniejszym i zaimka w celowniku; zachowuje uroczysty rytm formuły.
- source_word: ἥξει
  choice: przyjdzie
  rationale: Czas przyszły czasownika ἥκω oznacza tu nadejście zapowiedzianych następstw; polskie „przyjdzie na” zachowuje obraz ruchu obecny w grece.
- source_word: ταῦτα πάντα
  choice: to wszystko
  rationale: Naturalny polski odpowiednik nijakiej liczby mnogiej odnoszącej się zbiorczo do wcześniej wymienionych wydarzeń. Dosłowne „wszystkie te rzeczy” byłoby w tym kontekście mniej idiomatyczne.
- source_word: ἐπὶ
  choice: na
  rationale: Przy bierniku wyraża tu nadejście czegoś na daną grupę; „przyjdzie na” jest zwięzłe i zachowuje sądowniczy wydźwięk bez dopowiadania „przeciw”.
- source_word: γενεὰν ταύτην
  choice: to pokolenie
  rationale: Najbardziej bezpośredni odpowiednik greckiego wyrażenia, zachowujący jego temporalny wydźwięk i nieprzesądzający spornego zakresu odniesienia.
theological_decisions:
- issue: Odniesienie wyrażenia γενεὰν ταύτην („to pokolenie”)
  choice: to pokolenie
  alternative: ci ludzie; szersze pokolenie niewierzących; obecny wiek
  rationale: Przekład zachowuje bezpośrednie brzmienie oraz napięcie interpretacyjne tekstu. Nie rozstrzyga, czy zakres wyrażenia ogranicza się do współczesnych Jezusowi, czy ma być rozumiany szerzej.
translation_notes:
  register: Język współczesny, zwięzły i podniosły. „Zaprawdę” zachowuje utrwalony uroczysty charakter wypowiedzi Jezusa. „To wszystko” jest naturalniejsze po polsku niż formalnie dosłowne „wszystkie te rzeczy”. Marker przypisu umieszczono bezpośrednio po wyrażeniu, którego dotyczy.
