base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: pl
  text: Kto zaś się wywyższy, zostanie poniżony, a kto się uniży, zostanie wywyższony.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „zostanie sprowadzony nisko” oraz „zostanie wyniesiony wysoko”. Formy bierne nie wskazują wprost, kto dokonuje poniżenia i wywyższenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: kto
  rationale: Zaimek względny o nieokreślonym, ogólnym odniesieniu; w polskiej sentencji naturalnie oddaje go konstrukcja „kto…, ten…” lub samo „kto…” w dwóch równoległych zdaniach.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodny kontrast i nawiązanie do poprzedniego kontekstu bez nadmiernie mocnego przeciwstawienia.
- source_word: ὑψώσει ἑαυτόν
  choice: sam siebie wywyższy
  rationale: Zachowuje przyszły aspekt greckiej formy oraz zwrotny sens świadomego wynoszenia własnej osoby.
- source_word: ταπεινωθήσεται
  choice: zostanie poniżony
  rationale: Zachowuje stronę bierną i nie wskazuje wprost sprawcy; „poniżony” odpowiada przeciwstawieniu wywyższenia i uniżenia.
- source_word: καί
  choice: a
  rationale: W polszczyźnie naturalnie łączy dwie przeciwstawne, symetryczne części sentencji.
- source_word: ταπεινώσει ἑαυτόν
  choice: sam siebie uniży
  rationale: Oddaje czynność zwrotną i zachowuje leksykalną symetrię z biernym „zostanie poniżony”.
- source_word: ὑψωθήσεται
  choice: zostanie wywyższony
  rationale: Zachowuje stronę bierną, przyszłość oraz ścisły paralelizm z „sam siebie wywyższy”.
theological_decisions:
- issue: Sprawca form biernych
  choice: Zachować formy bierne bez nazywania sprawcy
  alternative: „Bóg go poniży / wywyższy”
  rationale: Tekst grecki nie wskazuje sprawcy wprost. Bierna konstrukcja zachowuje możliwe domyślne działanie Boga, ale nie czyni go jawnym ponad brzmienie źródła.
- issue: Ogólne odniesienie męskiej liczby pojedynczej
  choice: Użyć naturalnego polskiego „kto” oraz form rodzaju męskiego w orzeczeniu biernym
  alternative: Parafraza w liczbie mnogiej lub forma neutralizująca rodzaj
  rationale: Grecka wypowiedź ma postać rodzaju męskiego liczby pojedynczej, lecz pełni funkcję ogólnej zasady dotyczącej każdego człowieka. Polski zaimek „kto” zachowuje ten ogólny zakres, a formy męskie wynikają z jego standardowej składni.
translation_notes:
  register: Współczesny, godny rejestr sentencjonalny. Powtórzenie „sam siebie” podkreśla zwrotność obu czynności, a równoległe słownictwo zachowuje retoryczną symetrię greckiego zdania.
