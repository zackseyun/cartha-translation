  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: pl
  text: Tak więc świadczycie przeciwko sobie, że jesteście synami tych, którzy zamordowali proroków.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „świadczycie o sobie”. Dosłownie greckie wyrażenie zawiera „sobie”, ale w tym kontekście ich świadectwo ich obciąża.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: W ten sposób
  rationale: Wprowadza wniosek wynikający z poprzedniej wypowiedzi; naturalnie zachowuje inferencyjno-skutkową funkcję greckiego spójnika.
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: sami sobie dajecie świadectwo
  rationale: Zachowuje dosłowną konstrukcję z celownikiem ἑαυτοῖς oraz jej naturalną polską postać, nie przesądzając w tekście głównym, czy świadectwo jest wyraźnie „przeciwko” mówiącym; kontekst nadaje mu obciążający charakter.
- source_word: ὅτι
  choice: że
  rationale: Wprowadza treść składanego świadectwa.
- source_word: υἱοί
  choice: synami
  rationale: Oddaje wyraźnie męski rzeczownik i zachowuje rodzinny obraz, obejmujący zarówno pochodzenie, jak i moralną solidarność z przodkami.
- source_word: τῶν φονευσάντων
  choice: tych, którzy zamordowali
  rationale: Imiesłów określa przodków przez dokonany czyn; „zamordowali” trafnie oddaje bezprawne, zawinione zabicie.
- source_word: τοὺς προφήτας
  choice: proroków
  rationale: Bezpośrednio oddaje określoną grupę Bożych posłańców znaną z dziejów Izraela.
theological_decisions:
- issue: Czy υἱοί oddać dosłownie jako „synowie”, czy interpretacyjnie jako „dzieci” albo „potomkowie”.
  choice: synami
  alternative: dziećmi; potomkami
  rationale: „Synami” zachowuje męski język rodzinny tekstu i retoryczną siłę zarzutu, nie ograniczając sensu wyłącznie do biologicznego pochodzenia.
- issue: Czy ἑαυτοῖς rozwinąć jako świadectwo „przeciwko sobie”.
  choice: sami sobie dajecie świadectwo
  alternative: świadczycie przeciwko samym sobie
  rationale: Grecki celownik dosłownie znaczy „sobie”; choć kontekst wskazuje na samooskarżający skutek świadectwa, tekst główny zachowuje formalną niejednoznaczność, a przypis objaśnia sens kontekstowy.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Konstrukcja „sami sobie dajecie świadectwo” jest naturalna w polszczyźnie, zachowuje obraz sądowego świadectwa i formalną otwartość greckiego celownika.
