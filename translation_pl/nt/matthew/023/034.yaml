id: MAT.23.34
reference: Matthew 23:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: pl
  text: Dlatego oto ja posyłam do was proroków, mędrców i znawców Pisma. Niektórych z nich zabijecie i ukrzyżujecie, innych ubiczujecie w swoich synagogach i będziecie prześladować od miasta do miasta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Naturalny, podniosły sygnał zwracający uwagę, odpowiadający greckiemu wezwaniu do dostrzeżenia tego, co następuje.
- source_word: γραμματεῖς
  choice: znawców Pisma
  rationale: W tym kontekście chodzi o ludzi biegłych w Piśmie, nie o zwykłych pisarzy lub sekretarzy; przekład oddaje funkcję terminu zrozumiale dla współczesnego czytelnika.
- source_word: ἐξ αὐτῶν … καὶ ἐξ αὐτῶν
  choice: Niektórych z nich … innych
  rationale: Idiomaticznie oddaje podział grupy bez sugerowania, że każda z wymienionych czynności dotknie każdą osobę.
- source_word: μαστιγώσετε
  choice: ubiczujecie
  rationale: Precyzyjnie zachowuje sens chłosty wymierzonej biczem.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: będziecie prześladować od miasta do miasta
  rationale: Zachowuje ciągłość prześladowania oraz ruch pomiędzy miastami obecne w greckim wyrażeniu.
theological_decisions:
- issue: Tożsamość mówiącego jako posyłającego proroków, mędrców i znawców Pisma
  choice: Zachowano emfatyczne „posyłam” w pierwszej osobie bez objaśnienia.
  alternative: Doprecyzować, że Jezus mówi z Bożym autorytetem albo utożsamia się z Bożą Mądrością.
  rationale: Tekst sam przedstawia Jezusa jako posyłającego, lecz nie wyjaśnia tutaj wprost teologicznej podstawy tego roszczenia; przekład nie powinien rozstrzygać tej kwestii za czytelnika.
- issue: Zakres czasowników „zabijecie i ukrzyżujecie”
  choice: Zachowano wspólną grupę „niektórych”, bez rozdzielania jej na dwie podgrupy.
  alternative: „Niektórych zabijecie, a innych ukrzyżujecie”.
  rationale: Grecka składnia łączy oba czasowniki po jednym ἐξ αὐτῶν i nie wymaga rozdzielenia ofiar na odrębne grupy.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. „Znawcy Pisma” jest bardziej komunikatywne niż tradycyjne „uczeni w Piśmie”, a zarazem odróżnia γραμματεῖς od współczesnych zawodowych pisarzy. Zachowano retoryczną stanowczość wypowiedzi i paralelny układ zdania.
