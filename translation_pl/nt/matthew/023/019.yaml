  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: pl
  text: 'Ślepcy! Co bowiem jest większe: dar[a] czy ołtarz, który uświęca[b] ten dar?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „ofiara”.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „który czyni ten dar świętym”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Ślepcy!
  rationale: Przymiotnik w wołaczu liczby mnogiej został użyty rzeczownikowo jako bezpośrednia nagana. „Ślepcy!” brzmi naturalnie po polsku, zachowuje osobowy charakter zwrotu i nie dodaje określenia „głupcy”, którego w tym wersecie tekst grecki nie zawiera.
- source_word: τί γὰρ μεῖζον
  choice: Co bowiem jest większe
  rationale: „Co” naturalnie wprowadza pytanie porównawcze, „bowiem” oddaje wyjaśniające γάρ, a „większe” zachowuje dosłowną wartość stopnia wyższego μεῖζον bez interpretacyjnego zawężenia do „ważniejsze”.
- source_word: τὸ δῶρον
  choice: dar
  rationale: Podstawowym znaczeniem δῶρον jest „dar”; w kontekście świątynnym chodzi o dar składany Bogu, czyli ofiarę. W tekście głównym zachowano szersze określenie, a wariant kontekstowy podano w przypisie.
- source_word: θυσιαστήριον
  choice: ołtarz
  rationale: Standardowy i jednoznaczny polski odpowiednik terminu kultowego θυσιαστήριον.
- source_word: τὸ ἁγιάζον
  choice: który uświęca
  rationale: Imiesłów czasu teraźniejszego określa działanie ołtarza wobec daru. „Uświęca” zachowuje kultowy i teologiczny ciężar ἁγιάζω, a zarazem jest zrozumiałe we współczesnej polszczyźnie.
theological_decisions:
- issue: Kultowe znaczenie ἁγιάζω w relacji między ołtarzem a darem
  choice: który uświęca ten dar
  alternative: który czyni ten dar świętym / który poświęca ten dar
  rationale: Sformułowanie zachowuje założenie argumentu Jezusa, że ołtarz nadaje darowi świętość. Nie sprowadza tego działania wyłącznie do formalnego obrzędu ani nie rozstrzyga ponad to, co mówi tekst.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Bezpośrednia nagana „Ślepcy!” zachowuje siłę wypowiedzi, a składnia pytania jest naturalna w języku polskim. Znaczniki przypisów umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
