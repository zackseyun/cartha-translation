id: MAT.23.17
reference: Matthew 23:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: pl
  text: 'Głupcy i ślepcy! Co bowiem jest większe: złoto czy świątynia[a], która uświęciła[b] złoto?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie ναός może oznaczać ściślej sanktuarium, czyli właściwy budynek świątynny.
    reason: cultural_note
  - marker: b
    text: 'Można też oddać: „uczyniła świętym”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ
  choice: Głupcy
  rationale: Rzeczownik w wołaczu wiernie oddaje bezpośrednią, mocną naganę, nie wprowadzając potocznego ani klinicznego zabarwienia.
- source_word: τυφλοί
  choice: ślepcy
  rationale: Użycie rzeczownikowe zachowuje męską liczbę mnogą i formę bezpośredniego zwrotu; wraz z „Głupcy” tworzy naturalną polską paralelę.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Co bowiem jest większe
  rationale: „Co” naturalnie wprowadza pytanie o wybór między dwiema wymienionymi rzeczami, a „bowiem” zachowuje wyjaśniająco-argumentacyjny sens γάρ.
- source_word: ὁ χρυσὸς / τὸν χρυσόν
  choice: złoto / złoto
  rationale: Powtórzenie rzeczownika odtwarza retoryczną paralelę greckiego zdania; polszczyzna nie ma rodzajnika, więc określoność wynika z kontekstu.
- source_word: ὁ ναὸς
  choice: świątynia
  rationale: To jasny i naturalny odpowiednik w tym kontekście; przypis zachowuje bardziej precyzyjne znaczenie „sanktuarium, właściwy budynek świątynny”.
- source_word: ὁ ἁγιάσας
  choice: która uświęciła
  rationale: Imiesłów aorystu oddano zdaniem względnym w czasie przeszłym, zachowując aspekt przedstawionego działania oraz kultowy sens ἁγιάζω.
theological_decisions:
- issue: Oddanie kultowego czasownika ἁγιάζω
  choice: uświęciła
  alternative: uczyniła świętym; poświęciła
  rationale: „Uświęciła” zachowuje religijny sens nadania świętego statusu i nie precyzuje ponad tekst sposobu, w jaki świątynia nadaje złotu tę rangę.
- issue: Czas imiesłowu aorystu ὁ ἁγιάσας
  choice: która uświęciła
  alternative: która uświęca
  rationale: Czas przeszły formalnie zachowuje aoryst źródła, choć polski czas teraźniejszy mógłby idiomatycznie wyrażać ogólną zasadę. Wybrana forma pozostawia argument w postaci przedstawionej w tekście greckim.
translation_notes:
  register: Współczesna, zrozumiała i podniosła polszczyzna. Mocny bezpośredni zwrot zachowuje ton nagany, a szyk pytania oddaje zwięzłą argumentację tekstu greckiego.
