id: MAT.23.39
reference: Matthew 23:39
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: pl
  text: 'Mówię wam bowiem[a]: odtąd na pewno Mnie nie zobaczycie, aż powiecie[b]: „Błogosławiony, który przychodzi w imieniu Pana”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Mówię wam bowiem: odtąd w żadnym razie Mnie nie zobaczycie, aż powiecie”. W grece występuje emfatyczne zaprzeczenie οὐ μή.'
    reason: lexical_alternative
  - marker: b
    text: Cytat lub nawiązanie do Psalmu 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Mówię wam bowiem
  rationale: Zachowuje formułę bezpośredniego zwrotu oraz wyjaśniającą funkcję γάρ, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: οὐ μή
  choice: na pewno … nie
  rationale: Oddaje emfatyczne zaprzeczenie greckiej konstrukcji οὐ μή bez użycia archaicznego lub nazbyt absolutyzującego sformułowania.
- source_word: ἴδητε
  choice: zobaczycie
  rationale: Naturalny polski odpowiednik przyszłościowego sensu aorystu trybu łączącego w konstrukcji z οὐ μή.
- source_word: ἀπ’ ἄρτι
  choice: odtąd
  rationale: Zwięźle i precyzyjnie wskazuje okres rozpoczynający się w chwili wypowiedzi.
- source_word: ἕως ἂν εἴπητε
  choice: aż powiecie
  rationale: Oddaje przyszłą granicę czasową lub warunek, nie rozstrzygając, kiedy ani w jakich okolicznościach nastąpi.
- source_word: Εὐλογημένος
  choice: Błogosławiony
  rationale: Zachowuje znaczenie i rozpoznawalne brzmienie cytatu z Psalmu 118:26.
- source_word: ὁ ἐρχόμενος
  choice: który przychodzi
  rationale: Naturalnie oddaje grecki imiesłów z rodzajnikiem, nie narzucając silniejszego sensu tytularnego.
- source_word: ἐν ὀνόματι κυρίου
  choice: w imieniu Pana
  rationale: Wiernie zachowuje konstrukcję przyimkową oraz biblijny rytm cytatu.
theological_decisions:
- issue: Znaczenie przyszłego ujrzenia Jezusa i wypowiedzenia błogosławieństwa
  choice: Uroczysta zapowiedź nieobecności aż do przyszłego uznania wyrażonego słowami psalmu, bez określenia dokładnego wydarzenia.
  alternative: Jednoznaczne odniesienie do wjazdu do Jerozolimy, powtórnego przyjścia albo przyszłego nawrócenia Izraela.
  rationale: Sam tekst nie określa dokładnego momentu ani wydarzenia, dlatego przekład zachowuje jego eschatologiczną i historyczną otwartość.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Szyk „Mówię wam bowiem” zachowuje więź z poprzedzającym kontekstem, a „na pewno … nie” wyraża nacisk greckiego zaprzeczenia. Wielka litera w „Mnie” jest zgodna z polskim zwyczajem religijnym, nie zmieniając treści źródła.
