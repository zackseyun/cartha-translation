id: MAT.23.35
reference: Matthew 23:35
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: pl
  text: aby spadła na was cała krew sprawiedliwych przelana na ziemi[a], od krwi sprawiedliwego Abla aż po krew Zachariasza, syna Barachiasza[b], którego zamordowaliście między sanktuarium a ołtarzem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w kraju”. Greckie słowo może oznaczać zarówno ziemię, jak i kraj.'
    reason: lexical_alternative
  - marker: b
    text: Tożsamość „Zachariasza, syna Barachiasza” jest przedmiotem dyskusji. Niektórzy łączą go z prorokiem Zachariaszem, inni z Zachariaszem, synem Jojady (2 Krn 24,20–22). Przekład zachowuje brzmienie tekstu greckiego.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ἔλθῃ ἐφ’ ὑμᾶς
  choice: aby spadła na was odpowiedzialność
  rationale: Konstrukcja wyraża cel lub skutek i ma sens sądowy. Samo „aby przyszła na was krew” byłoby w polszczyźnie niejasne, dlatego dopowiedziano metonimicznie obecną w kontekście odpowiedzialność za przelaną krew.
- source_word: πᾶν αἷμα δίκαιον
  choice: całą niewinną krew
  rationale: δίκαιον gramatycznie określa „krew”, lecz metonimicznie chodzi o krew ludzi sprawiedliwych, a więc niewinnie przelaną. „Niewinna krew” jest naturalnym i utrwalonym polskim wyrażeniem.
- source_word: ἐκχυννόμενον
  choice: przelaną
  rationale: Imiesłów czasu teraźniejszego ma charakter uogólniający; polskie „przelaną” idiomatycznie oddaje obraz rozlewu krwi bez sugerowania, że czynność trwa właśnie w chwili wypowiedzi.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: γῆ może znaczyć zarówno „ziemia” w szerokim sensie, jak i „kraj”. Zakres od Abla przemawia za sensem szerszym; alternatywę zachowano w przypisie.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: od krwi sprawiedliwego Abla
  rationale: Zachowuje konstrukcję zakresu oraz określenie Abla jako sprawiedliwego, brzmiąc zarazem naturalnie po polsku.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: aż po krew Zachariasza, syna Barachiasza
  rationale: „Od… aż po…” naturalnie oddaje greckie ἀπό…ἕως. Imię ojca zostało transliterowane zgodnie z formą tekstu greckiego.
- source_word: ὃν ἐφονεύσατε
  choice: którego zamordowaliście
  rationale: φονεύω oznacza zabójstwo o jednoznacznie nagannym charakterze; „zamordowaliście” zachowuje siłę oskarżenia.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: między przybytkiem a ołtarzem
  rationale: ναός odnosi się do właściwego sanktuarium, nie do całego kompleksu świątynnego. „Przybytek” pozwala zachować to węższe znaczenie i odróżnić go od dziedzińców świątyni.
theological_decisions:
- issue: Sens przyjścia krwi na adresatów
  choice: Wyrazić odpowiedzialność za krew, która „spada na” adresatów.
  alternative: 'Dosłownie: „aby przyszła na was cała sprawiedliwa krew”.'
  rationale: W kontekście chodzi o sądową odpowiedzialność za rozlew krwi. Dopowiedzenie jej w przekładzie zapobiega niezrozumieniu polskiej metafory, nie ograniczając zakresu oskarżenia.
- issue: Tożsamość Zachariasza, syna Barachiasza
  choice: Zachować brzmienie tekstu greckiego bez harmonizacji i emendacji.
  alternative: Utożsamić go z prorokiem Zachariaszem albo z Zachariaszem, synem Jojady, i odpowiednio wyjaśnić lub zmienić patronimik.
  rationale: Tekst grecki jednoznacznie podaje „syna Barachiasza”, lecz historyczna identyfikacja postaci pozostaje dyskusyjna. Przekład nie powinien rozstrzygać tej trudności w tekście głównym.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Zdanie zachowuje retoryczną siłę oskarżenia, a zarazem unika nienaturalnej kalki składni greckiej. „Przybytek” ma tu węższy sens niż cały kompleks świątynny.
