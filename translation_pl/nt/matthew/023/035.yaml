- from: aby spadła na was odpowiedzialność za całą niewinną krew przelaną na ziemi[a], od krwi sprawiedliwego Abla aż po krew Zachariasza, syna Barachiasza[b], którego zamordowaliście między przybytkiem a ołtarzem.
  to: aby spadła na was cała krew sprawiedliwych przelana na ziemi[a], od krwi sprawiedliwego Abla aż po krew Zachariasza, syna Barachiasza[b], którego zamordowaliście między sanktuarium a ołtarzem.
  rationale: Revision removes the added noun „odpowiedzialność”, preserves the Greek metonymy of blood coming upon the addressees, and renders δίκαιον with the corresponding Polish term „sprawiedliwi”. It also uses „sanktuarium” for the narrower referent of ναός. The disputed identification of Zechariah remains unresolved in the main text and is appropriately retained in the footnote.
