  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: pl
  text: Lubią też honorowe miejsca na ucztach[a] i najważniejsze miejsca w synagogach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „pierwsze miejsce przy stole”. Podczas uroczystych posiłków w starożytności miejsca odzwierciedlały rangę gości.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „pierwsze siedzenia” albo „zaszczytne miejsca”. Greckie określenie podkreśla najwyższą rangę i pierwszeństwo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοῦσι
  choice: Lubią
  rationale: Czasownik wyraża tu silne upodobanie, nie zaś miłość w sensie teologicznym. „Lubią” brzmi naturalnie i zachowuje krytyczny wydźwięk wypowiedzi.
- source_word: δὲ
  choice: też
  rationale: Partykuła łagodnie łączy zdanie z wcześniejszym opisem, bez wprowadzania mocnego przeciwstawienia.
- source_word: τὴν πρωτοκλισίαν
  choice: honorowe miejsce
  rationale: Grecki rzeczownik w liczbie pojedynczej oznacza najzaszczytniejsze miejsce zajmowane przy posiłku. Przekład oddaje przede wszystkim rangę społeczną tego miejsca, nie narzucając współczesnego wyobrażenia krzesła.
- source_word: ἐν τοῖς δείπνοις
  choice: na ucztach
  rationale: W tym kontekście chodzi o uroczyste posiłki, podczas których rozmieszczenie gości ukazywało ich rangę.
- source_word: τὰς πρωτοκαθεδρίας
  choice: najważniejsze miejsca
  rationale: Termin oznacza miejsca dające najwyższą rangę lub pierwszeństwo. „Najważniejsze miejsca” jest naturalne po polsku i zachowuje nacisk na status, a nie wygodę.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: w synagogach
  rationale: Bezpośredni i naturalny odpowiednik greckiego określenia miejsca.
theological_decisions: []
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Liczbę pojedynczą w πρωτοκλισίαν zachowano jako „honorowe miejsce”, natomiast liczbę mnogą w πρωτοκαθεδρίας jako „najważniejsze miejsca”. Przypisy objaśniają realia społeczne i możliwe bardziej dosłowne odpowiedniki.
