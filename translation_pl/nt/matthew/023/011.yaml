id: MAT.23.11
reference: Matthew 23:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: pl
  text: Lecz największy spośród was będzie waszym sługą[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub bardziej dosłownie: „większy spośród was będzie waszym sługą”. Grecki stopień wyższy może tu idiomatycznie oznaczać osobę największą, czyli zajmującą najwyższą pozycję w grupie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: największy
  rationale: Stopień wyższy od μέγας może w tym kontekście grupowym pełnić funkcję zbliżoną do stopnia najwyższego i wskazywać osobę zajmującą najwyższą pozycję. Polskie „największy” naturalnie oddaje ten sens.
- source_word: ὑμῶν (pierwsze)
  choice: spośród was
  rationale: 'Pierwszy dopełniacz ma sens cząstkowy: chodzi o największego w obrębie grupy adresatów.'
- source_word: ἔσται
  choice: będzie
  rationale: Zwykła, współczesna forma czasu przyszłego czasownika „być” dokładnie oddaje greckie ἔσται.
- source_word: ὑμῶν (drugie)
  choice: waszym
  rationale: Drugi dopełniacz określa relację sługi do adresatów; polski zaimek dzierżawczy brzmi naturalnie i zachowuje sens.
- source_word: διάκονος
  choice: sługą
  rationale: W tym miejscu wyraz oznacza osobę usługującą innym, a nie nazwę urzędu kościelnego. „Sługa” zachowuje społeczne odwrócenie pozycji zawarte w wypowiedzi.
- source_word: δὲ
  choice: Lecz
  rationale: Spójnik zaznacza kontrast wobec wcześniejszego dążenia do tytułów i wywyższenia. „Lecz” jest zwięzłe, godne i naturalne w tym kontekście.
theological_decisions:
- issue: Relacja między wielkością a służbą w nauczaniu Jezusa
  choice: „największy spośród was będzie waszym sługą”
  alternative: „większy z was będzie waszym usługującym”
  rationale: 'Przekład zachowuje paradoksalne odwrócenie rangi: prawdziwa wielkość wyraża się w służbie. Nie narzuca przy tym późniejszego, technicznego znaczenia urzędu kościelnego.'
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, prostym brzmieniu. „Lecz” wyraża kontrast, „spośród was” jasno oddaje dopełniacz cząstkowy, a „sługa” unika nieuzasadnionego skojarzenia z urzędem kościelnym.
