  text: 'Wtedy Jezus przemówił do tłumów i do swoich uczniów:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący na kolejność wydarzeń.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: W greckiej narracji imię występuje z rodzajnikiem, którego w języku polskim przy imieniu własnym się nie oddaje.
- source_word: ἐλάλησεν
  choice: przemówił
  rationale: Aoryst λαλέω oznacza tu rozpoczętą i ujętą całościowo czynność mówienia do wskazanych słuchaczy; „przemówił do” jest naturalne i nie dodaje treści wypowiedzi.
- source_word: τοῖς ὄχλοις
  choice: do tłumów
  rationale: Zachowano liczbę mnogą greckiego rzeczownika oraz jego sens odnoszący się do zgromadzonych grup ludzi.
- source_word: καὶ
  choice: i
  rationale: Prosty spójnik łączący dwie grupy adresatów.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: do swoich uczniów
  rationale: Zaimek zwrotny „swoich” naturalnie wskazuje w języku polskim, że chodzi o uczniów Jezusa, będącego podmiotem zdania.
