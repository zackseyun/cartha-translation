revisions:
- from: 'Biada wam, ślepi przewodnicy, którzy mówicie: „Kto przysięga na świątynię[a], to nic[b], lecz kto przysięga na złoto świątyni, ten jest zobowiązany”.'
  to: 'Biada wam, ślepi przewodnicy, którzy mówicie: „Kto przysięga na świątynię[a], nic to nie znaczy[b]; lecz kto przysięga na złoto świątyni, jest związany taką przysięgą”.'
  rationale: Zmiana ogranicza się do dwóch miejsc, w których dosłowna polska elipsa jest mniej zrozumiała niż grecki oryginał. „Nic to nie znaczy” naturalnie oddaje οὐδέν ἐστιν, a „jest związany taką przysięgą” wyjaśnia konieczną w polszczyźnie implikację ὀφείλει. Przypisy zachowują informację o dosłownym brzmieniu i o formule przysięgi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:15:34Z'
review_pass:
  verdict: revise
  source_fidelity: „Biada wam” trafnie oddaje Οὐαὶ ὑμῖν, a „ślepi przewodnicy” zachowuje obrazowy sens ὁδηγοὶ τυφλοί. „Przysięgać na świątynię” jest właściwym polskim ekwiwalentem formuły przysięgi, choć greckie ἐν dosłownie znaczy „w”. Kontrast między uznaniem jednej przysięgi za nieważną a związaniem drugą został zachowany.
  naturalness: W tekście głównym „Kto przysięga na świątynię, to nic” brzmi po polsku eliptycznie w sposób mogący sugerować ocenę osoby, nie przysięgi. Również samo „ten jest zobowiązany” pozostaje składniowo niedopełnione. Minimalne doprecyzowanie idiomatyczne zachowuje sens greckiej elipsy i czyni wypowiedź jednoznaczną dla współczesnego odbiorcy.
  terminology: „Świątynia”, „złoto świątyni” i „przysięga” są trafne oraz utrzymują rejestr polemiczno-prorocki. „Jest związany taką przysięgą” naturalnie wyraża ὀφείλει w kontekście sporów o wiążący charakter przysięgi, bez narzucania dalszej interpretacji.
  issues:
  - severity: medium
    issue: Niejednoznaczne i mało naturalne „to nic” w obrębie cytowanej zasady.
    rationale: Greckie οὐδέν ἐστιν jest eliptyczne, ale polskie „Kto..., to nic” może odnosić „nic” do człowieka. „Nic to nie znaczy” przekazuje tę samą ocenę skuteczności przysięgi w naturalnej polszczyźnie.
  - severity: medium
    issue: Składniowo niedomknięte „ten jest zobowiązany”.
    rationale: Polskie „zobowiązany” zwykle wymaga wskazania, do czego ktoś jest zobowiązany. „Jest związany taką przysięgą” wyraża kontekstowo konieczne, lecz ograniczone dopowiedzenie implikowane przez ὀφείλει.
