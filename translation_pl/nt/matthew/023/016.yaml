source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: pl
  text: 'Biada wam, ślepi przewodnicy, którzy mówicie: „Kto przysięga na świątynię[a], nic to nie znaczy[b]; lecz kto przysięga na złoto świątyni, jest związany taką przysięgą”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w świątyni”. W tym kontekście chodzi o formułę przysięgi: „na świątynię”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „to nic”. Sens: taką przysięgę uznaje się za niewiążącą.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Biada wam
  rationale: Utrwalona, godna i mocna formuła prorockiego potępienia, odpowiadająca funkcji Οὐαί w tym kontekście.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: ślepi przewodnicy
  rationale: Bezpośrednio zachowuje metaforę ludzi prowadzących innych, choć sami nie widzą.
- source_word: οἱ λέγοντες
  choice: którzy mówicie
  rationale: Polski zwrot względny naturalnie oddaje urzeczownikowiony imiesłów; druga osoba harmonizuje z poprzedzającym „wam”.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Kto przysięga
  rationale: Oddaje ogólny, nieokreślony warunek wyrażony przez zaimek względny, ἄν i aoryst trybu łączącego.
- source_word: ἐν τῷ ναῷ
  choice: na świątynię
  rationale: W kontekście formuły przysięgi przyimek ἐν ma sens odwołania się do świątyni; „przysięgać na” jest naturalną polską konstrukcją. Dosłowniejszą możliwość podano w przypisie.
- source_word: οὐδέν ἐστιν
  choice: to nic
  rationale: Zachowuje zwięzłość i eliptyczność greckiego wyrażenia, nie dopowiadając w tekście głównym, że przysięga nie obowiązuje.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: złoto świątyni
  rationale: Proste oddanie konstrukcji dopełniaczowej zachowujące kontrast między świątynią a należącym do niej złotem.
- source_word: ὀφείλει
  choice: jest zobowiązany
  rationale: Oddaje znaczenie „być dłużnym, zobowiązanym” i zachowuje elipsę greckiego tekstu bez dodawania wyraźnego przedmiotu zobowiązania.
theological_decisions:
- issue: Eliptyczny charakter wypowiedzi o wiążącej mocy przysięgi
  choice: „to nic… jest zobowiązany”
  alternative: „taka przysięga nie obowiązuje… jest związany przysięgą”
  rationale: Greka zestawia dwa krótkie, eliptyczne orzeczenia. Przekład zachowuje tę retoryczną zwięzłość i nie rozstrzyga ponad tekst, choć sens dotyczy obowiązywania przysięgi.
translation_notes:
  register: Współczesny, godny rejestr z zachowaniem ostrej formuły „Biada wam” oraz celowej zwięzłości sporu o przysięgi. Szyk „którzy mówicie” brzmi naturalnie po polsku i utrzymuje bezpośredni zwrot do adresatów.
