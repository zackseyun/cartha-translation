reference: Matthew 23:26
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: pl
  text: Ślepy faryzeuszu, oczyść najpierw wnętrze kielicha i misy[a], aby także to, co na zewnątrz, stało się czyste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „półmiska”, „talerza” albo „naczynia”; greckie παροψίς oznacza naczynie do podawania jedzenia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Ślepy faryzeuszu
  rationale: Oba wyrazy są w wołaczu liczby pojedynczej. Polski szyk zachowuje bezpośredni, ostry charakter zwrotu i metaforę duchowej ślepoty.
- source_word: καθάρισον
  choice: oczyść
  rationale: Aorystyczny tryb rozkazujący wzywa do zdecydowanego działania. „Oczyść” pasuje zarówno do naczyń, jak i do moralnego sensu metafory.
- source_word: πρῶτον
  choice: najpierw
  rationale: Wyraża pierwszeństwo w kolejności i logice działania.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: wnętrze kielicha
  rationale: Oddaje substantywizowane „to, co wewnątrz” w naturalnej polszczyźnie. „Kielich” jest utrwalonym i zrozumiałym odpowiednikiem ποτήριον w tym kontekście.
- source_word: καὶ τῆς παροψίδος
  choice: i misy
  rationale: παροψίς oznacza naczynie służące do podawania jedzenia; „misa” pozostaje naturalna i nie przesądza zbyt ściśle jego kształtu.
- source_word: ἵνα γένηται
  choice: aby ... stało się
  rationale: 'Zachowuje celowo-skutkową konstrukcję oraz dynamiczny sens γίνομαι: „stać się”, nie tylko „być”.'
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ
  choice: także to, co na zewnątrz
  rationale: Oddaje adwerbialne καί jako „także” oraz substantywizowane τὸ ἐκτός bez narzucania niejednoznacznego polskiego zaimka dzierżawczego.
- source_word: καθαρόν
  choice: czyste
  rationale: Zachowuje obraz dosłownego czyszczenia naczyń, a zarazem pozostawia otwarty jego sens moralny.
theological_decisions:
- issue: Konkretny obraz naczyń a jawne objaśnienie moralne
  choice: Pozostawiono dosłowny obraz oczyszczania wnętrza i tego, co na zewnątrz.
  alternative: Parafraza odnosząca tekst wprost do życia wewnętrznego i zewnętrznego postępowania.
  rationale: Greka przekazuje moralne napomnienie za pomocą konkretnej metafory. Jej objaśnienie w tekście głównym usunęłoby zamierzone napięcie i wykroczyłoby poza brzmienie źródła.
- issue: Liczba pojedyncza αὐτοῦ po dwóch rzeczownikach
  choice: Zastosowano neutralne „to, co na zewnątrz”, bez jawnego wskazania tylko jednego naczynia.
  alternative: „Jego zewnętrzna strona”, odnoszące αὐτοῦ wyłącznie do kielicha, albo liczba mnoga odnosząca je do obu naczyń.
  rationale: Grecki zaimek jest w liczbie pojedynczej, choć poprzedzają go kielich i misa. Przekład nie powinien sztucznie rozstrzygać tej nieregularności lub skrótu myślowego.
translation_notes:
  register: Współczesna, godna i bezpośrednia polszczyzna. Zachowano ostry wołacz oraz konkretną metaforę, bez dopisywania jej interpretacji.
