  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: pl
  text: 'Biada wam, znawcy Prawa i faryzeusze, obłudnicy! Dajecie bowiem dziesięcinę z mięty, kopru i kminu rzymskiego, a zaniedbaliście to, co w Prawie ważniejsze: sprawiedliwość, miłosierdzie i wierność[a]. To należało czynić, a tamtych nie zaniedbywać.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wiarę”. Greckie słowo może oznaczać wiarę, zaufanie albo wierność; w tym etycznym kontekście wielu rozumie je jako wierność.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Biada
  rationale: Utrwalony polski odpowiednik prorockiego okrzyku nagany i zapowiedzi sądu; zachowuje mocniejszy ton niż „Niestety”.
- source_word: γραμματεῖς
  choice: znawcy Prawa
  rationale: W kontekście Ewangelii termin oznacza osoby zawodowo obeznane z Pismem i wykładające Prawo; współczesnemu czytelnikowi „znawcy Prawa” przekazuje funkcję jaśniej niż historyczne „uczeni w Piśmie” lub mylące dziś „skrybowie”.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Oddaje etyczny, metaforyczny sens określenia w naturalnej i godnej współczesnej polszczyźnie.
- source_word: ἀποδεκατοῦτε
  choice: dajecie dziesięcinę
  rationale: Czasownik oznacza oddawanie jednej dziesiątej; konstrukcja jest naturalna po polsku i zachowuje prawno-religijny charakter czynności.
- source_word: ἡδύοσμον
  choice: mięta
  rationale: Standardowa identyfikacja wymienionego zioła.
- source_word: ἄνηθον
  choice: koper
  rationale: Standardowy współczesny polski odpowiednik nazwy zioła.
- source_word: κύμινον
  choice: kmin
  rationale: Precyzyjna polska nazwa rośliny i przyprawy; unika potocznego mylenia z kminem rzymskim.
- source_word: ἀφήκατε
  choice: zaniedbaliście
  rationale: W tym kontekście ἀφίημι oznacza pozostawienie czegoś bez wykonania; „zaniedbaliście” naturalnie oddaje naganę.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: to, co w Prawie ważniejsze
  rationale: Oddaje metaforyczny sens stopnia wyższego βαρύτερα jako spraw większej wagi, zachowując porównanie priorytetów w obrębie Prawa.
- source_word: κρίσιν
  choice: sprawiedliwość
  rationale: W etycznym szeregu chodzi o sprawiedliwe postępowanie, nie jedynie o wydawanie sądu.
- source_word: ἔλεος
  choice: miłosierdzie
  rationale: Utrwalony odpowiednik biblijny, dobrze pasujący do etycznego szeregu.
- source_word: πίστιν
  choice: wierność
  rationale: W zestawieniu konkretnych obowiązków etycznych πίστις najnaturalniej oznacza rzetelność lub wierność; autentyczną możliwość znaczenia „wiara” zachowano w przypisie.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: To należało czynić, a tamtego nie zaniedbywać
  rationale: Zachowuje kontrast między obowiązkami ważniejszymi a praktyką dziesięciny oraz nie sugeruje zniesienia tej drugiej.
theological_decisions:
- issue: Znaczenie πίστιν w etycznym szeregu
  choice: wierność
  alternative: wiara
  rationale: Bezpośredni kontekst wymienia praktyczne, moralne wymagania Prawa, co sprzyja znaczeniu „wierność”. Ponieważ πίστις może również znaczyć „wiara”, alternatywę podano w przypisie, nie rozstrzygając szerzej relacji między tymi pojęciami.
- issue: Stosunek ważniejszych wymagań Prawa do dziesięciny
  choice: 'Zachowano oba człony: ważniejsze należało czynić, a dziesięciny nie zaniedbywać'
  alternative: Parafraza sugerująca odrzucenie drobniejszych nakazów
  rationale: Grecki tekst wyraźnie gani zaniedbanie spraw ważniejszych, ale zarazem mówi, by nie pomijać „tamtych”; przekład zachowuje to napięcie bez nakładania późniejszego systemu teologicznego.
translation_notes:
  register: Współczesna, godna polszczyzna o wyraźnym tonie prorockiej nagany. „Znawcy Prawa” objaśniają funkcję γραμματεῖς bez archaizmu, a równoległa składnia końcowego zdania zachowuje zwięzłość i nacisk oryginału. Marker [a] występuje w tekście głównym.
