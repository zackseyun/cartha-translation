  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: pl
  text: A kto przysięga na świątynię, przysięga na nią i na Tego, który w niej mieszka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w świątyni… w niej”; w tej formule przysięgi grecki przyimek ma znaczenie „na”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: kto przysięga
  rationale: Grecki substantywizowany imiesłów aorystu ma sens ogólny. Polskie „kto przysięga” naturalnie oddaje odniesienie do każdej osoby i dobrze współgra z następującym czasownikiem w czasie teraźniejszym.
- source_word: ἐν τῷ ναῷ
  choice: na świątynię
  rationale: Choć ἐν dosłownie zwykle znaczy „w”, w formule przysięgi wskazuje na to, na co ktoś przysięga. Współczesna polszczyzna wymaga tu konstrukcji „przysięgać na”.
- source_word: ναῷ
  choice: świątynię
  rationale: ναός oznacza właściwy przybytek świątynny; w tym kontekście „świątynia” jest jasnym i naturalnym odpowiednikiem.
- source_word: ὀμνύει
  choice: przysięga
  rationale: Czas teraźniejszy wyraża ogólną zasadę. Prosta forma „przysięga” zachowuje zwięzły charakter wypowiedzi.
- source_word: ἐν αὐτῷ
  choice: na nią
  rationale: Przyimek zachowuje sens właściwy formule przysięgi, a zaimek odnosi się do świątyni.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Tego, który w niej mieszka
  rationale: Substantywizowany imiesłów odnosi się w kontekście do Boga mieszkającego w świątyni. Zdanie względne brzmi naturalnie po polsku i zachowuje obraz zamieszkiwania.
- source_word: αὐτόν
  choice: w niej
  rationale: Zaimek odnosi się do ναός, czyli świątyni; polska forma żeńska odpowiada rodzajowi rzeczownika „świątynia”.
theological_decisions:
- issue: Tożsamość mieszkającego w świątyni
  choice: „Tego” zapisane wielką literą jako odniesienie do Boga
  alternative: „tego, który w niej mieszka” bez wielkiej litery
  rationale: Kontekst wskazuje na Boga, którego obecność wiąże świątynię z przysięgą. Wielka litera sygnalizuje oczywiste odniesienie, nie dodając określenia nieobecnego w grece.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelizm obu członów oraz tradycyjny, lecz nadal naturalny zwrot „przysięgać na”. Wielka litera w „Tego” wskazuje na boski desygnat wynikający z kontekstu.
