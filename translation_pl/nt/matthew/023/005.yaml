id: MAT.23.5
reference: Matthew 23:5
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: pl
  text: Oni zaś wszystko robią po to, żeby ludzie ich widzieli. Poszerzają bowiem swoje filakterie[a] i wydłużają frędzle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Filakterie to małe skórzane pudełeczka zawierające fragmenty Pisma, noszone przez niektórych Żydów zgodnie z takimi nakazami jak Pwt 6:8.
    reason: cultural_note
  - marker: b
    text: 'Można też oddać: „frędzle na skrajach szat”. Por. Lb 15:38–39.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα … τὰ ἔργα αὐτῶν ποιοῦσιν
  choice: wszystko robią
  rationale: Naturalny polski odpowiednik obejmujący ogół ich czynów; unika nienaturalnego połączenia „wykonywać uczynki”.
- source_word: δὲ
  choice: zaś
  rationale: Zaznacza kontrast z poprzednią wypowiedzią, nie nadając mu przesadnie ostrego charakteru.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: po to, żeby ludzie ich widzieli
  rationale: Jasno oddaje konstrukcję celu oraz ogólne znaczenie ἄνθρωποι, bez ograniczania go do mężczyzn.
- source_word: γὰρ
  choice: bowiem
  rationale: Wprowadza wyjaśnienie wcześniejszego zarzutu i zachowuje spójność argumentacji.
- source_word: πλατύνουσι
  choice: poszerzają
  rationale: Bezpośrednio oddaje sens czynienia czegoś szerszym.
- source_word: φυλακτήρια
  choice: filakterie
  rationale: Jest to precyzyjny, utrwalony termin oznaczający skórzane pudełeczka z fragmentami Pisma; przypis objaśnia mniej znane słowo.
- source_word: μεγαλύνουσι
  choice: powiększają
  rationale: Zachowuje ogólny sens czynienia większym, nie zawężając go bez konieczności do samego wydłużania.
- source_word: κράσπεδα
  choice: frędzle
  rationale: W tym żydowskim kontekście chodzi o frędzle przy szatach noszone zgodnie z nakazem Tory.
theological_decisions:
- issue: Sposób przedstawienia żydowskich przedmiotów religijnych bez narzucania polemicznej oceny
  choice: W tekście głównym użyto precyzyjnych określeń „filakterie” i „frędzle”, a filakterie objaśniono w przypisie.
  alternative: Oddać φυλακτήρια opisowo jako „pudełeczka modlitewne”, a κράσπεδα jako „skraje” lub „obrzeża”.
  rationale: Werset krytykuje ostentacyjne powiększanie tych przedmiotów w celu zdobycia uznania, a nie same praktyki związane z nakazami Tory. Neutralne, konkretne nazwy nie rozszerzają krytyki poza sens tekstu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „Oni zaś” zachowuje kontrast, a konstrukcja „po to, żeby” naturalnie wyraża cel. Specjalistyczne „filakterie” pozostawiono w tekście ze zwięzłym objaśnieniem kulturowym.
