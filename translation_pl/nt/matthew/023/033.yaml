  source_fidelity: „Węże, pomiocie żmij!” trafnie oddaje dwa greckie wołacze oraz ich ostrą, metaforyczną wymowę. „Jak uciekniecie przed sądem Gehenny?” zachowuje retoryczne πῶς z perspektywą przyszłą, sens φύγητε jako ucieczki/uniknięcia oraz szerokie znaczenie κρίσις. „Gehenna” właściwie zachowuje specyfikę γέεννα.
  naturalness: Tekst jest naturalny we współczesnej polszczyźnie, z odpowiednio stanowczym i podniosłym rejestrem. „Pomiocie żmij” jest utrwalonym, zrozumiałym i adekwatnie mocnym zwrotem. „Uciekniecie przed sądem” jest jasne w tym retorycznym kontekście.
  terminology: Rozróżnienie między ogólnymi „wężami” a „żmijami” jest trafne. „Sąd” nie zawęża κρίσις do potępienia, a „Gehenna” nie zaciera terminu źródłowego. Przypis uczciwie podaje „piekło” jako możliwy tradycyjny odpowiednik, bez narzucania jego późniejszych skojarzeń.
