id: MAT.23.33
reference: Matthew 23:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: pl
  text: Węże, pomiocie żmij! Jak uciekniecie przed sądem Gehenny?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „przed sądem piekła”. Po grecku: „Gehenna”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: Węże
  rationale: Bezpośredni wołacz o obraźliwej, metaforycznej sile; współczesne polskie „węże” naturalnie oddaje obraz.
- source_word: γεννήματα ἐχιδνῶν
  choice: pomiocie żmij
  rationale: „Pomiot” zachowuje sens tego, co zostało zrodzone, oraz moc potępienia; dopełniacz „żmij” odzwierciedla konstrukcję grecką i rozróżnia je od ogólnego „węże”.
- source_word: πῶς φύγητε
  choice: Jak uciekniecie
  rationale: Pytanie retoryczne ma ukierunkowanie przyszłe; forma nie przesądza, czy nacisk pada wyłącznie na możliwość, czy na przyszły skutek.
- source_word: κρίσεως
  choice: sądem
  rationale: „Sąd” zachowuje szeroki sens terminu κρίσις bez interpretacyjnego zawężenia do samego potępienia lub wyroku.
- source_word: γεέννης
  choice: Gehenny
  rationale: Transliteracja zachowuje swoistość greckiego terminu γέεννα oraz jego żydowskie tło historyczne i eschatologiczne.
theological_decisions:
- issue: Oddanie γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: „Gehenna” zachowuje termin źródłowy i nie utożsamia go bez objaśnienia ze wszystkimi późniejszymi skojarzeniami słowa „piekło”; powszechny odpowiednik podano w przypisie.
- issue: Charakter κρίσις
  choice: sąd
  alternative: potępienie
  rationale: Grecki rzeczownik sam w sobie oznacza sąd lub osąd; „potępienie” rozstrzygałoby wynik mocniej, niż wymaga tego pojedynczy termin, choć kontekst wypowiedzi jest wyraźnie groźny.
translation_notes:
  register: Język współczesny, stanowczy i podniosły. „Pomiocie żmij” jest mocnym, lecz naturalnym polskim zwrotem, odpowiadającym ostrości nagany. Marker przypisu umieszczono bezpośrednio po terminie, którego dotyczy.
