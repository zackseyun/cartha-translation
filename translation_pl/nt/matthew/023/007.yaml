lexical_decisions:
- source_word: ἀσπασμούς
  choice: pozdrowienia
  rationale: Naturalny polski odpowiednik obejmujący publiczne oznaki szacunku, których pragną opisani ludzie.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: na rynkach
  rationale: Dosłowne i zrozumiałe oddanie miejsc publicznych, gdzie dokonywał się handel i toczyło życie społeczne.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: ludzie
  rationale: W tym ogólnym kontekście ἄνθρωποι oznacza ludzi, nie wyłącznie mężczyzn.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Zachowuje żydowski tytuł obecny w tekście źródłowym i utrwalony w polszczyźnie biblijnej.
theological_decisions:
- issue: Zakres ἀνθρώπων
  choice: ludzie
  alternative: mężczyźni
  rationale: 'Rzeczownik ma tu znaczenie ogólne: chodzi o osoby zwracające się do uczonych tym tytułem, bez wskazania wyłącznie na płeć męską.'
- issue: Składnia καλεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: 'gdy ludzie zwracają się do nich: „Rabbi”'
  alternative: być nazywanymi przez ludzi „Rabbi”
  rationale: Naturalna polszczyzna oddająca bierną konstrukcję grecką i fakt używania tytułu wobec adresatów, bez dodawania interpretacji doktrynalnej.
