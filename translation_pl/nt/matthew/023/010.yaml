  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: pl
  text: Nie dajcie się też nazywać przewodnikami, bo jeden jest wasz Przewodnik — Mesjasz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „Chrystus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: też nie
  rationale: Partykuła łączy ten zakaz z poprzednimi, a „też” zachowuje ciągłość wywodu bez wymuszania rozpoczęcia zdania od spójnika.
- source_word: κληθῆτε
  choice: nie pozwalajcie, by nazywano was
  rationale: Grecka forma bierna odnosi się do nadawania lub używania wobec kogoś tytułu. Taka konstrukcja jest naturalniejsza po polsku niż dosłowne „nie bądźcie nazywani” i zachowuje odniesienie do działania innych osób.
- source_word: καθηγηταί / καθηγητής
  choice: przewodnikami / Przewodnik
  rationale: Termin może oznaczać osobę prowadzącą i pouczającą. „Przewodnik” zachowuje ten zakres znaczeniowy i nie utożsamia go bez reszty z „nauczycielem”, oddającym w bliskim kontekście inne greckie słowo, διδάσκαλος.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza uzasadnienie zakazu; „bo” jest naturalne we współczesnej polszczyźnie i zachowuje bezpośredni ton wypowiedzi.
- source_word: ὑμῶν ἐστιν εἷς
  choice: jeden jest wasz
  rationale: Zachowano emfatyczne stwierdzenie, że istnieje tylko jeden właściwy im Przewodnik, bez przekształcania go w mniej wyrazistą konstrukcję.
- source_word: ὁ χριστός
  choice: Mesjasz
  rationale: Rodzajnik wskazuje tu na tytuł. „Mesjasz” przekazuje jego znaczenie i żydowski kontekst, zamiast traktować Χριστός wyłącznie jak imię własne.
theological_decisions:
- issue: Sposób oddania tytułu Χριστός
  choice: Mesjasz
  alternative: Chrystus
  rationale: W tym zdaniu wyraz pełni funkcję wyraźnego tytułu. „Mesjasz” ukazuje jego sens, natomiast tradycyjne „Chrystus” podano w przypisie jako uprawnioną alternatywę.
- issue: Zakres tytułu καθηγητής
  choice: Przewodnik
  alternative: Nauczyciel lub mistrz
  rationale: „Przewodnik” zachowuje napięcie między prowadzeniem a pouczaniem i nie zaciera różnicy leksykalnej względem διδάσκαλος w sąsiednim kontekście. Wielka litera w drugim użyciu sygnalizuje tytuł odnoszony do Mesjasza, nie dodając nowej treści doktrynalnej.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Składnia pozostaje blisko greckiego nacisku na jednego Przewodnika, a pauza przed „Mesjasz” naturalnie wskazuje jego tożsamość.
