review_pass:
  verdict: revise
  source_fidelity: Greckie μηδὲ κληθῆτε jest zakazem przyjmowania nadawanego tytułu („nie bądźcie nazywani / nie dajcie się nazywać”). Wersja robocza trafnie zachowuje ciągłość przez „też”, sens tytułu καθηγητής jako „przewodnik” oraz emfatyczne „jeden” i tytuł „Mesjasz”. Jednak „Nie pozwalajcie też, by nazywano was” niepotrzebnie przekształca prostą stronę bierną w zakaz zezwalania, z lekkim przesunięciem akcentu na osobistą kontrolę nad działaniem innych.
  naturalness: „Nie pozwalajcie też, by nazywano was” jest zrozumiałe, ale cięższe i mniej idiomatyczne niż współczesne „Nie dajcie się też nazywać”. Pozostała część zdania jest naturalna; szyk „jeden jest wasz Przewodnik” dobrze podkreśla jedyność.
  terminology: „Przewodnik” jest bezpiecznym odpowiednikiem καθηγητής, ponieważ obejmuje prowadzenie i pouczanie, nie utożsamiając terminu automatycznie z διδάσκαλος z sąsiednich wersetów. „Mesjasz” właściwie oddaje tytuł ὁ χριστός; przypis z „Chrystus” jako alternatywą jest prawidłowo zakotwiczony przy tym wyrazie.
  issues:
