    rationale: Jest możliwa, lecz dodaje element „pozwalania”, którego grecki pasyw nie wyraża wprost, i brzmi mniej naturalnie. „Nie dajcie się też nazywać” zachowuje sens zakazu oraz polską idiomatykę.
