  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: pl
  text: Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Bo oczyszczacie zewnętrzną stronę kielicha i misy, lecz wewnątrz są one pełne grabieży i braku opanowania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „lecz wewnątrz są one pełne chciwości i pobłażania sobie”. Greckie słowa mogą oznaczać zarówno grabież, zdzierstwo lub wyzysk, jak i brak panowania nad sobą lub nieumiarkowanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Biada
  rationale: Zachowuje moc prorockiego potępienia i jest utrwalonym, zrozumiałym odpowiednikiem w polszczyźnie biblijnej.
- source_word: γραμματεῖς
  choice: znawcy Prawa
  rationale: Naturalnie oddaje funkcję religijnych uczonych i interpretatorów Prawa; samo „uczeni w Piśmie” mogłoby sugerować współczesnych biblistów.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Standardowa polska nazwa tej grupy.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Trafnie wyraża moralno-religijną dwulicowość i zachowuje siłę zarzutu.
- source_word: καθαρίζετε
  choice: oczyszczacie
  rationale: Oddaje czynność usuwania nieczystości, a zarazem współgra z kontekstem rytualnym.
- source_word: τὸ ἔξωθεν
  choice: zewnętrzną stronę
  rationale: Naturalnie zachowuje wyraźny kontrast między tym, co zewnętrzne, a wnętrzem naczyń.
- source_word: ποτηρίου
  choice: kielicha
  rationale: Tradycyjny i nadal zrozumiały odpowiednik naczynia do picia w rejestrze biblijnym.
- source_word: παροψίδος
  choice: misy
  rationale: Termin oznacza naczynie stołowe, zwłaszcza półmisek lub misę; „misa” pozostaje dostatecznie szeroka i naturalna.
- source_word: ἔσωθεν
  choice: wewnątrz
  rationale: Bezpośrednio zachowuje przestrzenny obraz i przeciwstawienie wobec strony zewnętrznej.
- source_word: γέμουσιν
  choice: są one pełne
  rationale: Liczba mnoga czasownika odnosi się naturalnie do obu naczyń, dlatego zachowano ją również po polsku.
- source_word: ἁρπαγῆς
  choice: grabieży
  rationale: Zachowuje mocny sens bezprawnego, drapieżnego zagarniania, zamiast ograniczać wyraz do ogólnej chciwości.
- source_word: ἀκρασίας
  choice: nieopanowania
  rationale: Oddaje brak panowania nad pragnieniami i skłonność do nieumiarkowanego używania; nie zawęża znaczenia do jednego rodzaju pobłażania sobie.
theological_decisions:
- issue: Metaforyczne odniesienie wewnętrznej nieczystości
  choice: 'Zachować naczynia jako gramatyczny podmiot: „wewnątrz są one pełne”.'
  alternative: „lecz wewnątrz jesteście pełni grabieży i nieopanowania”
  rationale: Grecki czasownik jest w liczbie mnogiej i wprost kontynuuje obraz kielicha oraz misy. Odniesienie do przywódców jest czytelne, ale nie należy go wprowadzać kosztem formy metafory.
- issue: Zakres znaczeniowy ἁρπαγή i ἀκρασία
  choice: W tekście głównym użyć mocnych, formalnie bliskich określeń „grabież” i „nieopanowanie”.
  alternative: „chciwość i pobłażanie sobie”
  rationale: Wariant alternatywny jasno opisuje wewnętrzne wady, lecz łagodzi możliwe sensy wyzysku oraz niekontrolowanego nadmiaru. Przypis zachowuje tę różnicę bez rozstrzygania jej ponad świadectwo greki.
translation_notes:
  register: Współczesna, godna polszczyzna z zachowaniem prorockiej ostrości wypowiedzi i wyrazistej metafory naczyń. Określenie „znawcy Prawa” objaśnia funkcję γραμματεῖς bez rozbudowanej parafrazy. Marker [a] występuje w tekście głównym.
