  terminology: „Jeruzalem”, „prorocy”, „posłani”, „dzieci” oraz „pisklęta” są trafne. „Kura” w tym kontekście jednoznacznie oznacza kurę-matkę (hen) i nie obniża rejestru; przypis może uczciwie odnotować szerszy zakres greckiego ὄρνις.
