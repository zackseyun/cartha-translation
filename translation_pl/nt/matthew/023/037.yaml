source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: pl
  text: Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz posłanych do ciebie — ileż razy chciałem zgromadzić twoje dzieci, jak kura gromadzi swoje pisklęta pod skrzydła[a], a wy nie chcieliście?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może oznaczać ptaka bardziej ogólnie, lecz obraz gromadzenia piskląt pod skrzydła wskazuje tutaj na kurę.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jeruzalem, Jeruzalem
  rationale: Zachowuje tradycyjną polską formę nazwy, emfatyczne powtórzenie i ton lamentu.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: które zabijasz ... i kamienujesz
  rationale: Imiesłowy czasu teraźniejszego opisują charakterystyczne działanie uosobionego miasta; forma względna jest naturalna po polsku.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: posłanych do ciebie
  rationale: Zachowuje bierny sens imiesłowu oraz bezpośredni zwrot do uosobionego Jeruzalem.
- source_word: ποσάκις ἠθέλησα
  choice: ileż razy chciałem
  rationale: Oddaje częstotliwość i rzeczywistą wolę lub pragnienie bez wzmacniania jej do determinującego postanowienia.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: zgromadzić twoje dzieci
  rationale: Zachowuje metaforę dzieci miasta i ideę zebrania ich razem.
- source_word: ὄρνις
  choice: kokosz
  rationale: Grecki wyraz może oznaczać ptaka ogólnie, lecz obraz piskląt chronionych pod skrzydłami wskazuje w tym kontekście na samicę kury; „kokosz” jest precyzyjna i ma godny, biblijny rejestr.
- source_word: τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: swoje pisklęta pod skrzydłami
  rationale: Naturalnie oddaje młode ptaki oraz obraz ochrony pod skrzydłami.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: lecz nie chcieliście
  rationale: Liczba mnoga zostaje zachowana, ujawniając przejście od pojedynczego miasta do jego mieszkańców; „lecz” naturalnie wyraża kontrast.
theological_decisions:
- issue: Kontrast woli Jezusa i niechęci mieszkańców Jeruzalem
  choice: „chciałem” oraz „nie chcieliście”
  alternative: „postanowiłem” albo parafraza sprowadzająca wypowiedź jedynie do emocjonalnego żalu
  rationale: Powtórzenie rdzenia θέλω tworzy realny kontrast woli, ale samo nie rozstrzyga szerszych sporów o wolę Bożą, ludzką odpowiedzialność ani chrystologię.
- issue: Tożsamość „twoich dzieci”
  choice: zachowanie dosłownej metafory „twoje dzieci”
  alternative: „twoi mieszkańcy” lub „twój lud”
  rationale: Tekst uosabia miasto i określa związanych z nim ludzi jako jego dzieci, nie zawężając wyraźnie tej grupy.
- issue: Zmiana liczby gramatycznej w końcowym czasowniku
  choice: „nie chcieliście” w liczbie mnogiej
  alternative: „nie chciałoś” odnoszące wszystko wyłącznie do miasta
  rationale: Greckie ἠθελήσατε jest w liczbie mnogiej i kieruje odpowiedzialność ku ludziom przedstawionym jako dzieci Jeruzalem, przy zachowaniu napięcia z uosobionym zwrotem do miasta.
translation_notes:
  register: Nowoczesna, godna polszczyzna z zachowaniem retorycznego lamentu. Forma „kokosz” jest dziś rzadsza niż „kura”, ale trafniej nazywa samicę w obrazie macierzyńskim i unika potocznego wydźwięku. Końcowa liczba mnoga została zachowana zgodnie z greką.
