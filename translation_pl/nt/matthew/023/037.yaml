  to: Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz posłanych do ciebie — ileż razy chciałem zgromadzić twoje dzieci, jak kura gromadzi swoje pisklęta pod skrzydła[a], a wy nie chcieliście?
