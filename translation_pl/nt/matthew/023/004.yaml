  variant: modern standard Polish
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: pl
  text: Wiążą ciężkie brzemiona i wkładają je na ramiona ludzi, sami jednak nie chcą ich poruszyć nawet palcem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: wiążą
  rationale: Oddaje czynność wiązania lub krępowania i zachowuje konkretny obraz przygotowywania ciężarów.
- source_word: φορτία βαρέα
  choice: ciężkie brzemiona
  rationale: „Brzemiona” zachowują zarówno obraz fizycznego ciężaru, jak i możliwy sens przenośny; przymiotnik „ciężkie” odpowiada βαρέα.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: wkładają je na ramiona
  rationale: Naturalne po polsku sformułowanie zachowujące konkretny obraz umieszczania ciężaru na ramionach.
- source_word: τῶν ἀνθρώπων
  choice: ludzi
  rationale: W tym miejscu ἄνθρωποι oznacza ludzi ogólnie; polskie „ludzi” precyzyjnie i naturalnie oddaje reprezentatywny zakres wyrazu.
- source_word: αὐτοὶ δὲ
  choice: sami jednak
  rationale: Zachowuje emfatyczny kontrast między nakładaniem ciężarów na innych a własną odmową działania.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: nawet palcem
  rationale: Polski idiom naturalnie wyraża minimalny wysiłek. „Nawet” jest pragmatycznie zawarte w obrazie odmowy poruszenia ciężaru palcem.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: nie chcą ich poruszyć
  rationale: Zachowuje wolitywny sens θέλουσιν oraz podstawowe znaczenie κινῆσαι, nie zawężając go interpretacyjnie do podnoszenia.
theological_decisions:
- issue: Czy brzemiona są literalne, czy metaforyczne
  choice: Zachować konkretny obraz „ciężkich brzemion” bez objaśniania ich referentu.
  alternative: Wyraźnie nazwać je przepisami, wymaganiami religijnymi lub obowiązkami Prawa.
  rationale: Grecki tekst pozostawia referent metafory niedopowiedziany. Kontekst sugeruje nakładane obowiązki, lecz ich doprecyzowanie w samym przekładzie zawęziłoby sens.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zdanie zachowuje kontrast oraz żywy obraz ciężaru nakładanego na ramiona. Nie dodano przypisu do „ludzi”, ponieważ polski odpowiednik nie rodzi tej samej dwuznaczności płciowej co angielskie „men”.
