source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: pl
  text: I nikogo na ziemi nie nazywajcie swoim ojcem[a], bo jeden jest wasz Ojciec, Ojciec niebiański[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „I nie zwracajcie się do nikogo na ziemi jako do ojca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „ten niebiański”. Możliwe też: „Ten, który jest w niebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: ojcem
  rationale: Rzeczownik jest dopełnieniem czasownika καλέσητε; polska składnia „nazywać kogoś kimś” wymaga narzędnika. Zachowano bezpośrednie określenie „ojciec” oraz paralelę z drugą częścią zdania.
- source_word: μὴ καλέσητε
  choice: nikogo nie nazywajcie
  rationale: Aoryst trybu łączącego z μή wyraża zakaz. „Nikogo nie nazywajcie” naturalnie oddaje jego stanowczą, ogólną formę, nie dodając interpretacyjnego zawężenia.
- source_word: ὑμῶν
  choice: swoim / wasz
  rationale: W pierwszym członie polskie „swoim” jest naturalnym zaimkiem zwrotnym odnoszącym się do podmiotu „wy”; w drugim „wasz” bezpośrednio oddaje relację wyrażoną przez grecki genetivus.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: To naturalny polski odpowiednik określenia ziemskiej sfery lub miejsca, pozostający w kontraście z określeniem Ojca jako niebiańskiego.
- source_word: εἷς
  choice: jeden
  rationale: Grecki tekst mówi wprost „jeden”. Nie dodano słowa „tylko”, ponieważ wyłączność wynika już z konstrukcji zdania.
- source_word: ὁ πατήρ
  choice: wasz Ojciec
  rationale: Rodzajnik z rzeczownikiem oraz obecne w tekście ὑμῶν najlepiej oddaje sformułowanie „wasz Ojciec”, zachowujące osobową relację.
- source_word: ὁ οὐράνιος
  choice: Ten niebiański
  rationale: Przymiotnik z rodzajnikiem ma użycie substantywizowane i dopowiada, kim jest Ojciec. „Ten niebiański” zachowuje zaznaczoną, nieco uroczystą konstrukcję grecką, zamiast utożsamiać ją bez reszty z opisem miejsca.
theological_decisions:
- issue: Zakres zakazu Jezusa
  choice: Zachowano bezpośredni, kategoryczny zakaz nazywania kogokolwiek na ziemi swoim ojcem, bez objaśniającego zawężenia w tekście głównym.
  alternative: Można rozumieć wypowiedź jako absolutny zakaz każdego ludzkiego użycia słowa „ojciec” albo osłabić ją jako czystą hiperbolę.
  rationale: Grecki tekst ma formę stanowczego zakazu. Przekład nie powinien jednak sam rozstrzygać, jak wypowiedź odnosi się do biologicznego, rodzinnego czy społecznego użycia słowa „ojciec”; napięcie to pozostawiono kontekstowi.
- issue: Znaczenie ὁ οὐράνιος
  choice: Oddano jako „Ten niebiański”.
  alternative: „Ojciec niebiański” albo „Ten, który jest w niebie”.
  rationale: Wybrana forma zachowuje substantywizowany przymiotnik i jego ścisłe powiązanie z „wasz Ojciec”, nie rozstrzygając, czy nacisk pada na przynależność do sfery niebiańskiej, czy na przebywanie w niebie.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Pierwszy człon brzmi naturalnie po polsku, natomiast celowo zaznaczona forma „Ten niebiański” odzwierciedla nietypową konstrukcję grecką. Wielka litera w „Ojciec” i „Ten” zgodna jest z polską normą religijną w odniesieniu do Boga.
