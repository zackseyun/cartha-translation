  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: pl
  text: Ślepi przewodnicy! Przecedzacie komara, a połykacie wielbłąda!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: Ślepi przewodnicy!
  rationale: Zachowuje bezpośrednią, metaforyczną naganę oraz naturalny w języku polskim szyk wołacza.
- source_word: διϋλίζοντες
  choice: przecedzacie
  rationale: Czasownik oznacza filtrowanie lub przecedzanie płynu w celu usunięcia czegoś; polskie „przecedzacie” jasno oddaje tę czynność. Imiesłowy greckie oddano osobowymi formami czasownika, naturalniejszymi w tym wykrzyknieniu.
- source_word: τὸν κώνωπα
  choice: komara
  rationale: κώνωψ oznacza małego owada z rodzaju komara; „komar” jest współczesnym, zrozumiałym i trafnym odpowiednikiem, zachowującym kontrast rozmiarów.
- source_word: τὴν δὲ κάμηλον
  choice: a połykacie wielbłąda
  rationale: „Wielbłąd” odpowiada κάμηλος, a kontrastowe δέ naturalnie oddaje spójnik „a”, który uwydatnia absurdalną dysproporcję.
- source_word: καταπίνοντες
  choice: połykacie
  rationale: Bezpośrednio i obrazowo oddaje czynność połknięcia, bez dodawania potocznego zabarwienia.
theological_decisions:
- issue: Metaforyczna siła obrazu nieczystości i rażącej dysproporcji
  choice: Zachowano konkretny obraz przecedzania komara i połykania wielbłąda.
  alternative: Interpretacyjna parafraza o pomijaniu spraw ważnych przy drobiazgowości w sprawach małych.
  rationale: Sens nagany wynika z hiperbolicznego zestawienia dwóch konkretnych obrazów. Ich zachowanie nie rozstrzyga ponad tekst, czy nacisk pada przede wszystkim na nieczystość rytualną, moralne proporcje, czy oba aspekty naraz.
translation_notes:
  register: Język współczesny, zwięzły i podniosły. Dwa wykrzyknienia zachowują ostrą retorykę wypowiedzi. Nie dodano przypisu, ponieważ „przecedzacie” wystarczająco jasno oddaje sens czasownika greckiego, a wariant leksykalny nie jest potrzebny do zrozumienia tekstu.
