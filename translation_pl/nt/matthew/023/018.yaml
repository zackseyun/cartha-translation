id: MAT.23.18
reference: Matthew 23:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: pl
  text: 'I: „Kto przysięgnie na ołtarz, to nic nie znaczy[a], lecz kto przysięgnie na dar[b] leżący na ołtarzu, jest zobowiązany”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Według nauki, którą Jezus tu potępia, przysięga na ołtarz „nic nie znaczy”, czyli nie jest uznawana za wiążącą.
    reason: cultural_note
  - marker: b
    text: 'Lub: „ofiarę”. Greckie słowo może oznaczać dar składany Bogu w świątyni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: I
  rationale: Prosty spójnik naturalnie kontynuuje serię przytaczanych zasad, które Jezus potępia.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Kto przysięgnie... lecz kto przysięgnie
  rationale: Konstrukcja ὅς + ἄν z aorystem w trybie łączącym wyraża ogólny, nieokreślony warunek; polska forma zachowuje tę ogólność.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: na ołtarz
  rationale: Przy czasowniku oznaczającym składanie przysięgi ἐν wskazuje to, na co ktoś przysięga; „przysięgać na” jest naturalnym polskim odpowiednikiem.
- source_word: θυσιαστήριον
  choice: ołtarz
  rationale: Standardowy i precyzyjny odpowiednik w kontekście świątynnym.
- source_word: οὐδέν ἐστιν
  choice: to nic nie znaczy
  rationale: Oddaje twierdzenie, że taka przysięga nie ma mocy wiążącej, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: ἐν τῷ δώρῳ
  choice: na dar
  rationale: δῶρον oznacza dar składany Bogu, w tym kontekście umieszczony na ołtarzu; „dar” zachowuje bezpośredni sens leksykalny.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: który jest na nim
  rationale: Oddaje położenie daru na ołtarzu i jednoznacznie wskazuje desygnat zaimka bez ciężkiego sformułowania „na jego wierzchu”.
- source_word: ὀφείλει
  choice: jest zobowiązany
  rationale: W kontekście przysięgi czasownik wyraża pozostawanie pod zobowiązaniem; przekład zachowuje niewypowiedziany przedmiot tego zobowiązania.
theological_decisions:
- issue: Niewyrażony przedmiot zobowiązania wynikającego z przysięgi
  choice: jest zobowiązany
  alternative: jest związany przysięgą / jest zobowiązany jej dotrzymać
  rationale: Greka nie podaje dopełnienia czasownika ὀφείλει. Kontekst wskazuje na obowiązek dotrzymania przysięgi, lecz tekst główny nie dopowiada tego, czego źródło nie wyraża wprost.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano formę cytowanej reguły oraz zwięzłość końcowego „jest zobowiązany”, nie dodając przedmiotu obowiązku.
