  source_fidelity: Przekład wiernie oddaje grecki tekst tradycji bizantyjskiej. „Biada”, „znawcy Pisma”, „faryzeusze”, „obłudnicy”, metaforyczne „pożeracie domy wdów”, modlitwa „dla pozoru” oraz „surowszy wyrok” odpowiadają kolejno sensowi οὐαί, γραμματεῖς, κατεσθίετε, προφάσει μακρὰ προσευχόμενοι i περισσότερον κρίμα. Nie dopowiada, na czym miałby polegać wyrok ani w jaki sposób dochodziło do wyzysku.
  naturalness: Tekst jest płynny, współczesny i zachowuje podniosły, prorocko-oskarżycielski rejestr wypowiedzi. „Dla pozoru długo się modlicie” naturalnie przekazuje, że naganna jest pozorność, nie sama długość modlitwy.
  terminology: „Znawcy Pisma” jest zrozumiałym współczesnym określeniem γραμματεῖς, a „surowszy wyrok” trafnie zachowuje sądowy i karny wydźwięk περισσότερον κρίμα. Przypis poprawnie sygnalizuje istotną niepewność tekstualną bez przedstawiania hipotezy o harmonizacji jako pewnika.
