id: MAT.23.14
reference: Matthew 23:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: pl
  text: Biada wam, znawcy Pisma i faryzeusze, obłudnicy! Pożeracie domy wdów, a dla pozoru długo się modlicie. Dlatego otrzymacie surowszy wyrok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tego wersetu nie ma w najstarszych zachowanych rękopisach greckich, między innymi w Kodeksie Synajskim i Watykańskim z IV wieku, ani we wczesnych przekładach koptyjskich. Występuje jednak w większości rękopisów tradycji bizantyjskiej oraz w przekładach starołacińskich, Wulgacie i przekładach syryjskich. Prawdopodobnie został dopisany przez późniejszych kopistów pod wpływem podobnych wypowiedzi z Mk 12:40 i Łk 20:47. Rękopisy, które go zawierają, umieszczają go przed wersetem 13 albo po nim.
    reason: textual_critical
lexical_decisions:
- source_word: γραμματεῖς
  choice: znawcy Pisma
  rationale: W tym kontekście chodzi o ludzi biegłych w Prawie i Piśmie; współczesne „znawcy Pisma” jest jaśniejsze niż tradycyjne, lecz dziś wieloznaczne „uczeni w Piśmie”.
- source_word: κατεσθίετε
  choice: pożeracie
  rationale: Zachowuje mocną metaforę bezwzględnego wykorzystywania wdów i przejmowania ich majątku.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: domy wdów
  rationale: Zachowuje obrazowy semityzm, w którym „dom” może obejmować gospodarstwo i majątek wdowy, bez zawężania znaczenia wyłącznie do budynku.
- source_word: προφάσει
  choice: dla pozoru
  rationale: Naturalnie wyraża modlitwę służącą za fasadę skrywającą złe postępowanie.
- source_word: μακρὰ προσευχόμενοι
  choice: długo się modlicie
  rationale: Oddaje długość modlitw bez dodawania, że sama długa modlitwa jest naganna; problemem jest jej pozorność.
- source_word: περισσότερον κρίμα
  choice: surowszy wyrok
  rationale: W kontekście kary komparatyw wskazuje na cięższy wyrok. „Wyrok” zachowuje sądowy sens κρίμα, a „surowszy” naturalnie oddaje περισσότερον.
theological_decisions:
- issue: Charakter związku między wyzyskiem, pozorną pobożnością a wyrokiem
  choice: Zachowano wynikowe „dlatego otrzymacie surowszy wyrok” bez dopowiadania mechanizmu kary.
  alternative: „Dlatego spotka was większe potępienie”.
  rationale: Tekst stwierdza zaostrzony sąd z powodu opisanej obłudy, ale nie precyzuje jego formy ani stopniowania; przekład nie powinien tego rozstrzygać.
translation_notes:
  register: Współczesny, podniosły i bezpośredni rejestr. Zachowano retoryczną ostrość nagany („Biada”, „obłudnicy”, „pożeracie”), a konstrukcję grecką wygładzono do naturalnej polszczyzny. Marker przypisu umieszczono po całym wersecie, ponieważ przypis dotyczy jego obecności w tradycji rękopiśmiennej.
source_grounding:
  english_pob_role: consult_only
