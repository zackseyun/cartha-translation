id: MAT.23.28
reference: Matthew 23:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: pl
  text: Tak samo i wy z zewnątrz wydajecie się ludziom sprawiedliwi, lecz wewnątrz jesteście pełni obłudy i bezprawia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Tak samo
  rationale: Naturalnie łączy wypowiedź z poprzedzającym porównaniem do pobielanych grobów i zachowuje sens porównawczy.
- source_word: ἔξωθεν
  choice: z zewnątrz
  rationale: Tworzy jasny i naturalny kontrast z ἔσωθεν — „wewnątrz”.
- source_word: φαίνεσθε
  choice: wydajecie się
  rationale: Oddaje wrażenie wywierane na obserwatorach, nie przypisując adresatom rzeczywistej sprawiedliwości.
- source_word: τοῖς ἀνθρώποις
  choice: ludziom
  rationale: Naturalny polski odpowiednik ogólnego określenia ludzi jako obserwatorów; celownik zachowuje relację „wydawać się komuś”.
- source_word: δίκαιοι
  choice: sprawiedliwi
  rationale: Zachowuje etyczny i religijny zakres greckiego terminu, przy czym czasownik wskazuje, że chodzi o pozór w oczach ludzi.
- source_word: ἔσωθεν
  choice: wewnątrz
  rationale: Zwięźle przeciwstawia rzeczywistość wewnętrzną wyglądowi zewnętrznemu.
- source_word: μεστοὶ
  choice: pełni
  rationale: Bezpośredni i idiomatyczny odpowiednik przymiotnika oznaczającego bycie pełnym czegoś.
- source_word: ὑποκρίσεως
  choice: obłudy
  rationale: „Obłuda” naturalnie oddaje moralno-religijną dwulicowość potępianą w tym kontekście.
- source_word: ἀνομίας
  choice: bezprawia
  rationale: Zachowuje odniesienie do postawy sprzeciwiającej się prawu, zamiast redukować sens do ogólnej niegodziwości.
theological_decisions:
- issue: Czy δίκαιοι określa rzeczywisty stan moralny, czy jedynie wrażenie wywierane na ludziach
  choice: Pozorna sprawiedliwość w ocenie ludzi
  alternative: Rzeczywista sprawiedliwość
  rationale: φαίνεσθε wraz z przeciwstawieniem „lecz wewnątrz” wskazuje, że Jezus mówi o zewnętrznym pozorze, a nie potwierdza autentycznej sprawiedliwości.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano równoległy kontrast „z zewnątrz — wewnątrz” oraz stanowczy ton wypowiedzi. Nie dodano przypisu, ponieważ „ludziom” jednoznacznie i naturalnie oddaje rodzajowo ogólne ἀνθρώποις.
