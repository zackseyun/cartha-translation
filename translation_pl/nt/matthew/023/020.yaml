source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: pl
  text: Kto więc przysięga na ołtarz, przysięga na niego i na wszystko, co się na nim znajduje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Kto więc przysięga
  rationale: 'Grecki imiesłów z rodzajnikiem ma sens ogólny: „ten, kto przysięga” lub naturalniej po polsku „kto przysięga”. οὖν oddano jako wynikowe „więc”.'
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: na ołtarz
  rationale: Przy ὀμνύω przyimek ἐν wprowadza przedmiot przysięgi. Współczesna polszczyzna używa w tej formule konstrukcji „przysięgać na”.
- source_word: ὀμνύει
  choice: przysięga
  rationale: Czas teraźniejszy wyraża ogólną zasadę i zachowuje powtórzenie czasownika obecne w grece.
- source_word: ἐν αὐτῷ
  choice: na niego
  rationale: Zaimek odnosi się do ołtarza, a konstrukcja „na niego” zachowuje naturalną polską formułę przysięgi.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: i na wszystko, co się na nim znajduje
  rationale: Wyrażenie obejmuje ogólnie wszystko znajdujące się na ołtarzu. Tłumaczenie jest naturalne po polsku i nie zawęża sensu do jednego daru ani wyłącznie do ofiar.
theological_decisions:
- issue: Zakres wyrażenia „wszystko, co się na nim znajduje”
  choice: Ogólne odniesienie do wszystkiego znajdującego się na ołtarzu
  alternative: „wszystkie ofiary na nim” albo dosłowniej „wszystko ponad nim”
  rationale: Kontekst wspomina dar na ołtarzu, lecz greckie sformułowanie w tym wersecie jest szersze. Tekst główny zachowuje tę ogólność bez narzucania węższej interpretacji.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zdanie zachowuje zwięzłość, inferencyjne „więc” oraz retoryczne powtórzenie „przysięga”.
