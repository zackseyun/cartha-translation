translation:
  language: pl
  text: 'mówiąc: „Na katedrze Mojżesza zasiedli[a] znawcy Pisma i faryzeusze”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na krześle Mojżesza”. Chodzi o miejsce nauczycielskiego autorytetu związane z Mojżeszem. Możliwe też: „zasiadają”; grecki czasownik może opisywać zarówno zajęcie miejsca, jak i zasiadanie na nim.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów czasu teraźniejszego łączy wypowiedź Jezusa z poprzednim zdaniem; polskie „mówiąc” zachowuje tę zależność składniową.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: na miejscu Mojżesza
  rationale: Wyrażenie oznacza miejsce zasiadania związane z autorytetem nauczania Mojżesza. „Miejsce Mojżesza” brzmi naturalniej niż dosłowne „krzesło” i nie wprowadza wieloznacznego dziś słowa „katedra”, a zarazem zachowuje metaforę zajmowanej pozycji.
- source_word: ἐκάθισαν
  choice: zasiedli
  rationale: Aoryst od καθίζω może opisywać zajęcie miejsca lub stan zasiadania. „Zasiedli” zachowuje aspekt dokonanego objęcia pozycji, nie dodając wyraźnego zaimka zwrotnego, którego nie ma w grece.
- source_word: οἱ γραμματεῖς
  choice: znawcy Pisma
  rationale: W tym kontekście chodzi o uznanych ekspertów w zakresie Prawa i Pism. „Znawcy Pisma” jest jasnym, współczesnym określeniem funkcji tej grupy, bez mylącego skojarzenia słowa „uczeni” wyłącznie z działalnością akademicką.
- source_word: οἱ Φαρισαῖοι
  choice: faryzeusze
  rationale: Standardowa polska nazwa tej żydowskiej grupy religijnej.
theological_decisions:
- issue: Czy ἐκάθισαν opisuje neutralnie sprawowanie urzędu, czy objęcie pozycji autorytetu
  choice: zasiedli
  alternative: zasiadają; zajęli miejsce
  rationale: Forma „zasiedli” pozwala usłyszeć możliwość objęcia autorytatywnej pozycji, lecz sama nie rozstrzyga, czy autorytet ten został prawomocnie nadany, czy przyjęty przez nich. Przypis zachowuje neutralną alternatywę.
translation_notes:
  register: Współczesny, godny rejestr. „Znawcy Pisma” jest zrozumiałe dla zwykłego czytelnika, a „miejsce Mojżesza” przekazuje metaforę autorytetu bez nadmiernie dosłownego obrazu mebla.
