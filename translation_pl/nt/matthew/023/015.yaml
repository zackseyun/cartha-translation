id: MAT.23.15
reference: Matthew 23:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: pl
  text: Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Przemierzacie bowiem morze i ląd, aby pozyskać jednego prozelitę[a], a gdy nim zostanie, czynicie go dwakroć bardziej synem Gehenny[b] niż wy sami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Czyli człowieka, który przyjął judaizm.
    reason: lexical_clarification
  - marker: b
    text: 'Często tłumaczone: „piekła”. Gehenna to grecka forma nazwy doliny Hinnom, używana jako obraz miejsca ostatecznej kary.'
    reason: historical_and_lexical_clarification
lexical_decisions:
- source_word: Οὐαὶ
  choice: Biada
  rationale: Zachowuje prorocki ton groźby i potępienia, mocniejszy niż wyrażenie samego żalu.
- source_word: γραμματεῖς
  choice: uczeni w Piśmie
  rationale: Naturalne i utrwalone polskie określenie żydowskich znawców oraz nauczycieli Pisma; jest czytelniejsze niż dosłowne „pisarze”.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Standardowa polska nazwa tego żydowskiego stronnictwa religijnego.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: Oddaje religijno-moralną nieszczerość piętnowaną w tym kontekście.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: obchodzicie morze i ląd
  rationale: Zachowuje obraz rozległych, mozolnych podróży, a zarazem brzmi naturalnie po polsku.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: aby pozyskać jednego prozelitę
  rationale: „Prozelita” precyzyjnie oddaje προσήλυτος jako osobę przyjmującą judaizm; czasownik „pozyskać” naturalnie wyraża sens greckiego ποιῆσαι w tym kontekście.
- source_word: ὅταν γένηται
  choice: gdy nim zostanie
  rationale: Oddaje stanie się prozelitą bez dodawania, że przemiana nastąpiła pod przymusem lub wyłącznie za sprawą adresatów.
- source_word: υἱὸν γεέννης
  choice: synem Gehenny
  rationale: Zachowuje zarówno nazwę Gehenna, jak i semicki idiom „syn”, nie spłaszczając go do ogólnego określenia człowieka złego lub potępionego.
- source_word: διπλότερον ὑμῶν
  choice: dwa razy bardziej niż wy sami
  rationale: Możliwie wiernie zachowuje porównawczą, eliptyczną konstrukcję grecką, nie zastępując jej interpretacyjnym „dwa razy gorszym”.
theological_decisions:
- issue: Oddanie terminu γεέννα
  choice: Gehenna
  alternative: piekło
  rationale: Grecki tekst używa konkretnego terminu zakorzenionego w żydowskim tle historycznym i eschatologicznym. Transliteracja zachowuje te skojarzenia, a powszechniejszy odpowiednik podano w przypisie.
- issue: Oddanie idiomu υἱὸν γεέννης
  choice: syn Gehenny
  alternative: człowiek zasługujący na piekło
  rationale: 'Dosłowny idiom pozostawia otwarty jego pełny zakres: przynależność, charakter i przeznaczenie, zamiast ograniczać sens wyłącznie do winy lub przyszłej kary.'
- issue: Sens διπλότερον ὑμῶν
  choice: dwa razy bardziej niż wy sami
  alternative: dwa razy gorszym od was
  rationale: Wybrana forma zachowuje zwięzłą i napiętą metaforę tekstu źródłowego; alternatywa jest bardziej płynna, lecz dopowiada kategorię moralnej „gorszości”, której greka nie nazywa wprost.
translation_notes:
  register: Język współczesny, podniosły i bezpośredni. Zachowano tradycyjne, zrozumiałe określenia „uczeni w Piśmie”, „faryzeusze” i „obłudnicy”. Eliptyczne zakończenie celowo pozostaje nieco ostre, aby nie usuwać metafory i porównawczej niejednoznaczności greckiego tekstu.
