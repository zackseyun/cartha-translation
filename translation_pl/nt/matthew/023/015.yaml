  naturalness: „Obchodzicie morze i ląd” może po polsku sugerować omijanie ich, nie przemierzanie. „Przemierzacie morze i ląd” jest naturalniejsze i dokładniej oddaje obraz rozległych podróży. Końcowe „czynicie go synem Gehenny dwa razy bardziej niż wy sami” jest niezręczne; przestawienie określenia usuwa tę wadę bez dodawania kategorii „gorszości”.
  terminology: „Uczeni w Piśmie”, „faryzeusze”, „obłudnicy”, „prozelita” i „Gehenna” są trafne dla współczesnej polszczyzny o podniosłym rejestrze. Przypis o prozelicie właściwie objaśnia termin, a przypis o Gehennie zachowuje alternatywę „piekło”, nie utożsamiając jej bezpośrednio z greckim terminem.
