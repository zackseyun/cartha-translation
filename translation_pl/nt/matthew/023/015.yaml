  to: Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Przemierzacie bowiem morze i ląd, aby pozyskać jednego prozelitę[a], a gdy nim zostanie, czynicie go dwakroć bardziej synem Gehenny[b] niż wy sami.
  rationale: Zmieniono wyłącznie dwa miejsca wymagające bezpiecznej korekty stylistyczno-składniowej. „Przemierzacie” lepiej oddaje podróżowanie „przez morze i ląd”. Szyk „dwakroć bardziej synem Gehenny niż wy sami” zachowuje obraz i elipsę tekstu greckiego, a zarazem nie wprowadza interpretacyjnego określenia „gorszym”. Przypisy i ich kotwice pozostają kompletne oraz zgodne z tekstem.
