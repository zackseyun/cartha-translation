  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: pl
  text: Oto wasz dom[a] zostaje wam pozostawiony opuszczony.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wasza świątynia”. Wyrażenie „wasz dom” może odnosić się szczególnie do świątyni, choć grecki tekst pozostawia je szerszym.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Oto
  rationale: Naturalny, podniosły sygnał zwracający uwagę, odpowiedni dla uroczystej zapowiedzi sądu.
- source_word: ἀφίεται
  choice: zostaje pozostawiony
  rationale: Oddaje czas teraźniejszy i stronę bierną greckiego czasownika, nie przesądzając wprost, kto opuszcza dom.
- source_word: ὑμῖν
  choice: wam
  rationale: Zachowuje celownik i sens pozostawienia domu adresatom.
- source_word: ὁ οἶκος ὑμῶν
  choice: wasz dom
  rationale: Dosłownie zachowuje szerokie, metaforyczne określenie greckie, zamiast zawężać je w tekście głównym do świątyni lub Jerozolimy.
- source_word: ἔρημος
  choice: opustoszały
  rationale: Wyraża opuszczenie i pustkę właściwe prorockiemu kontekstowi sądu, bez dodawania wyraźnej idei fizycznego zburzenia.
theological_decisions:
- issue: Do czego odnosi się wyrażenie „wasz dom”
  choice: W tekście głównym zachowano „wasz dom”.
  alternative: „wasza świątynia”, Jerozolima albo dom Izraela
  rationale: Kontekst wskazuje szczególnie na świątynię i Jerozolimę, ale greckie wyrażenie pozostaje szersze. Przekład zachowuje tę zamierzoną pojemność i napięcie interpretacyjne.
translation_notes:
  register: Współczesny, zrozumiały i godny styl. „Oto” zachowuje uroczysty ton wypowiedzi, a nieco formalna konstrukcja bierna odzwierciedla greckie brzmienie bez nadmiernego objaśniania.
