  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: pl
  text: Ty zaś, gdy pościsz, namaść sobie głowę[a] i umyj twarz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „nałóż oliwę na głowę”. Grecki czasownik może oznaczać stosowanie oliwy lub olejku w ramach zwykłej pielęgnacji.'
    reason: lexical_alternative
  - marker: b
    text: Chodzi o zachowanie zwykłego wyglądu, zamiast okazywania innym, że się pości.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ty zaś
  rationale: Wyraźny zaimek σὺ wraz z δέ podkreśla kontrast z obłudnikami wspomnianymi wcześniej. „Ty zaś” zachowuje ten nacisk i brzmi naturalnie po polsku.
- source_word: νηστεύων
  choice: gdy pościsz
  rationale: Imiesłów pełni funkcję okolicznikową; polskie zdanie czasowe jasno i naturalnie oddaje sens instrukcji odnoszącej się do czasu postu.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: namaść sobie głowę
  rationale: Czasownik ἀλείφω oznacza nakładanie oliwy lub olejku, tutaj jako zwykły zabieg pielęgnacyjny. „Namaść sobie głowę” zachowuje obraz i zwięzłość oryginału, a przypis wyjaśnia możliwy dziś rytualny wydźwięk słowa „namaścić”.
- source_word: καὶ
  choice: i
  rationale: Proste połączenie dwóch nakazów.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: umyj twarz
  rationale: νίπτω oznacza mycie części ciała, a πρόσωπον w tym miejscu odnosi się do twarzy. Jest to bezpośrednie i współczesne sformułowanie.
theological_decisions:
- issue: Charakter polecenia dotyczącego wyglądu podczas postu
  choice: Polecenie zachowania zwykłej higieny i zadbanego wyglądu podczas postu
  alternative: Nakaz rytualnego namaszczenia albo zakaz publicznego postu jako takiego
  rationale: Najbliższy kontekst przeciwstawia ostentacyjne zaniedbanie wyglądu zwyczajnemu zachowaniu. Przekład nie przedstawia jednak zawartego w wersecie gestu jako samego obrzędu ani nie dopowiada zakazu poszczenia w miejscu publicznym.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Konstrukcja „Ty zaś” zachowuje emfatyczny kontrast, a „namaść sobie głowę” oddaje kulturowy obraz oryginału; przypis zapobiega zawężeniu go wyłącznie do czynności rytualnej.
