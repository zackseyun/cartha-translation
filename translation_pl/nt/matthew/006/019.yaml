  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: pl
  text: Nie gromadźcie sobie skarbów na ziemi, gdzie mól i rdza[a] niszczą, a złodzieje włamują się[b] i kradną.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „niszczące zużycie” lub „rozkład”. Greckie słowo może szerzej oznaczać zjadanie, zużycie lub niszczenie, a nie tylko korozję metalu.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „przekopują się”, zapewne przez ściany z suszonej gliny.'
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Nie gromadźcie
  rationale: Zakaz wyrażony przez μή z trybem rozkazującym czasu teraźniejszego. „Nie gromadźcie” naturalnie oddaje czynność odkładania i pomnażania dóbr.
- source_word: ὑμῖν
  choice: sobie
  rationale: Celownik ma sens zwrotny i wskazuje, że skarby są gromadzone dla własnej korzyści adresatów.
- source_word: θησαυροὺς
  choice: skarbów
  rationale: Bezpośredni, szeroki odpowiednik obejmujący cenne dobra, nie tylko pieniądze; zachowuje związek znaczeniowy z czasownikiem θησαυρίζετε.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: Naturalne polskie określenie ziemskiej sfery, przeciwstawionej niebu w następnym wersecie.
- source_word: σὴς
  choice: mól
  rationale: Standardowy odpowiednik odnoszący się do mola niszczącego przechowywane szaty i inne dobra.
- source_word: βρῶσις
  choice: rozkład
  rationale: Grecki rzeczownik wiąże się ze zjadaniem lub pochłanianiem i może oznaczać niszczące zużycie. „Rozkład” zachowuje szerszy sens niż tradycyjna „rdza”; tę możliwość podano w przypisie.
- source_word: ἀφανίζει
  choice: niszczą
  rationale: Czasownik oznacza doprowadzenie do zaniku lub ruiny. Polska liczba mnoga jest wymagana przez złożony podmiot „mól i rozkład”.
- source_word: κλέπται
  choice: złodzieje
  rationale: Bezpośredni i współczesny odpowiednik leksykalny.
- source_word: διορύσσουσιν
  choice: włamują się
  rationale: Idiomaticznie przekazuje cel działania złodziei. Dosłowny obraz przekopywania się przez ścianę zachowano w przypisie.
- source_word: κλέπτουσιν
  choice: kradną
  rationale: Standardowy polski odpowiednik czasownika oznaczającego kradzież.
theological_decisions:
- issue: Zakres wyrażenia ἐπὶ τῆς γῆς
  choice: na ziemi
  alternative: na tej ziemi
  rationale: „Na ziemi” naturalnie zachowuje kontrast ziemia–niebo z bezpośredniego kontekstu, bez dodawania nacisku demonstratywnego nieobecnego w tekście.
- issue: Znaczenie βρῶσις
  choice: rozkład
  alternative: rdza
  rationale: βρῶσις ma szerszy sens niszczącego pochłaniania lub zużycia niż sama korozja metalu. „Rozkład” nie ogranicza obrazu do metalowych dóbr, a tradycyjną możliwość „rdza” zachowuje przypis.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Liczba mnoga odpowiada zbiorowym adresatom. Powtórzenie sensu gromadzenia i skarbów pozostaje naturalne po polsku, a przypisy zachowują istotną niejednoznaczność leksykalną oraz realia włamania.
