source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: pl
  text: Nie martwcie się więc o jutro, gdyż jutro będzie się martwić o siebie. Każdy dzień ma dość własnych utrapień[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwy także bardziej dosłowny przekład: „Każdemu dniowi wystarcza jego własne zło”. Greckie słowo może oznaczać „zło”, lecz tutaj najpewniej odnosi się do utrapień lub przeciwności danego dnia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: nie martwcie się
  rationale: W kontekście Mt 6,25–34 czasownik oznacza zamartwianie się i pełną niepokoju troskę. To naturalne, współczesne polskie sformułowanie zachowuje tryb zakazu.
- source_word: εἰς τὴν αὔριον
  choice: o jutro
  rationale: Przy czasowniku μεριμνάω przyimek wskazuje przedmiot troski; polskie „martwić się o” oddaje tę relację idiomatycznie.
- source_word: ἡ αὔριον
  choice: jutro
  rationale: Zachowuje personifikację jutra jako podmiotu kolejnego zdania.
- source_word: μεριμνήσει αὑτῆς
  choice: samo zatroszczy się o siebie
  rationale: Oddaje personifikację i zwrotność greckiego wyrażenia. „Zatroszczy się” brzmi po polsku naturalniej niż powtórzone „będzie się martwić”, nie usuwając retorycznego związku z pierwszą częścią.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Każdy dzień ma dosyć
  rationale: Idiomaticzna konstrukcja wyraża, że przypadające na dany dzień utrapienia są wystarczające; „każdy dzień” jasno przekazuje sens dystrybutywny.
- source_word: ἡ κακία αὐτῆς
  choice: własnych utrapień
  rationale: W tym kontekście κακία odnosi się najpewniej do przeciwności lub uciążliwości danego dnia. Liczba mnoga jest naturalna w polskim, a „własnych” oddaje zaimek odnoszący się do dnia.
theological_decisions:
- issue: Znaczenie κακία w sentencji o trosce
  choice: utrapienia
  alternative: zło
  rationale: Kontekst dotyczy niepokoju o przyszłe potrzeby i przeciwności, dlatego sens sytuacyjny „utrapienia” jest najbardziej prawdopodobny. Przypis zachowuje dosłowniejszą możliwość „zło” i nie rozstrzyga bez śladu rzeczywistej szerokości znaczeniowej słowa.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano personifikację jutra oraz zwięzłą, przysłowiową formę końcowego zdania. Marker przypisu umieszczono bezpośrednio po wyrażeniu, którego wariant dotyczy.
