review_pass:
  verdict: revise
  source_fidelity: Pierwszy zakaz dobrze oddaje μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον. W drugiej części „zatroszczy się o siebie” przesuwa sens z celowo powtórzonego „martwić się”/„niepokoić się” ku pozytywnemu „zadba o siebie” i osłabia retoryczną personifikację oraz powtórzenie μεριμνάω. Końcowe zdanie trafnie oddaje sens ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς; „utrapienia” jest uzasadnionym kontekstowym ujęciem κακία, przy zachowaniu „zła” w przypisie.
  naturalness: „Jutro będzie się martwić o siebie” jest zamierzenie personifikujące, ale pozostaje naturalne w aforystycznym rejestrze i lepiej spaja oba człony niż „samo zatroszczy się o siebie”. „Gdyż” ma nieco godniejszy, a nadal współczesny ton niż „bo”.
  terminology: „Utrapienia” właściwie przekazuje tu codzienne przeciwności, nie przesądzając, że κακία oznacza wyłącznie zło moralne. Przypis powinien wyraźniej przedstawiać „zło” jako możliwy bardziej dosłowny przekład, a jego znacznik należy zakotwiczyć przy „utrapieniach”, nie po całym zdaniu.
  issues:
  - severity: medium
    issue: „jutro samo zatroszczy się o siebie”
    rationale: Czasownik „zatroszczyć się o” oznacza zwykle zadbanie o kogoś/coś, podczas gdy greckie μεριμνήσει powtarza wcześniejsze „nie martwcie się” i oznacza martwienie się lub niespokojną troskę. Zmiana zaciera powtórzenie oraz może odwracać wydźwięk personifikacji.
  - severity: low
    issue: Położenie markera przypisu
    rationale: Przypis dotyczy wyboru „utrapienia” dla κακία, więc marker powinien stać bezpośrednio po tym wyrazie, przed kropką.
  - severity: low
    issue: Brzmienie przypisu
    rationale: Sformułowanie „Dosłownie możliwe również” jest niezręczne. Prostsze wskazanie możliwego przekładu dosłowniejszego czytelnie zachowuje alternatywę leksykalną.
