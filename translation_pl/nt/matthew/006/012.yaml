  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: pl
  text: I przebacz nam nasze długi[a], jak i my przebaczyliśmy naszym dłużnikom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub w znaczeniu: „winy” lub „grzechy”. Dosłownie „długi”; grecki zachowuje metaforę tego, co jest należne, odnosząc ją tutaj do moralnych win wobec Boga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: przebacz
  rationale: Aorystyczny tryb rozkazujący czasownika ἀφίημι w kontekście modlitwy najnaturalniej wyraża prośbę o przebaczenie. „Przebacz” zachowuje zarówno stanowczość prośby, jak i jej moralny sens.
- source_word: τὰ ὀφειλήματα
  choice: długi
  rationale: Rzeczownik ὀφειλήματα dosłownie oznacza „długi”, czyli to, co jest należne. Zachowanie tego słowa podtrzymuje metaforę obciążenia moralnego oraz związek leksykalny z „dłużnikami” w dalszej części zdania.
- source_word: ὡς
  choice: jak
  rationale: ὡς wprowadza porównanie między przebaczeniem, o które proszą modlący się, a przebaczeniem udzielonym przez nich innym. Polskie „jak” oddaje tę relację bez rozstrzygania jej dokładnego charakteru.
- source_word: καὶ ἡμεῖς
  choice: i my
  rationale: Partykuła καί wraz z wyrażonym zaimkiem ἡμεῖς podkreśla, że również modlący się przebaczyli swoim dłużnikom. „I my” naturalnie zachowuje ten nacisk.
- source_word: ἀφήκαμεν
  choice: przebaczyliśmy
  rationale: Grecki aoryst przedstawia przebaczenie jako dokonane. Polski czasownik dokonany w czasie przeszłym naturalnie oddaje ten aspekt, nie dodając odrębnej kategorii znaczeniowej odpowiadającej angielskiemu present perfect.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: naszym dłużnikom
  rationale: „Dłużnikom” zachowuje wspólny rdzeń i spójność metafory z wcześniejszymi „długami”, zamiast zastępować ją objaśniającą parafrazą.
theological_decisions:
- issue: Moralna metafora długu w ὀφειλήματα
  choice: Zachować w tekście głównym „długi” jako metaforę win i grzechów wobec Boga.
  alternative: „winy” lub „grzechy”
  rationale: Tekst grecki świadomie posługuje się językiem długu i dłużników. Przekład dosłowny zachowuje obraz oraz wewnętrzne powiązanie obu członów, a przypis wyjaśnia moralne odniesienie bez usuwania metafory.
- issue: Relacja wyrażona przez ὡς
  choice: Oddać neutralnie jako „jak”, zachowując napięcie między prośbą o Boże przebaczenie a przebaczeniem udzielanym innym.
  alternative: „ponieważ” albo „pod warunkiem, że”
  rationale: ὡς wyraża przede wszystkim porównanie. Przekład nie powinien sam rozstrzygać, czy relacja ma tu charakter podstawy, warunku, miary czy analogii.
- issue: Aspekt i czas ἀφήκαμεν
  choice: Użyć dokonanego czasu przeszłego „przebaczyliśmy”.
  alternative: „przebaczamy”
  rationale: Forma grecka jest aorystem i przedstawia czyn jako dokonany. Polski czasownik dokonany wiernie oddaje tę perspektywę, nie sugerując jedynie ogólnego, trwającego zwyczaju.
translation_notes:
  register: Współczesny, prosty i godny rejestr modlitewny. Zachowano tradycyjnie rozpoznawalną metaforę „długów” i „dłużników”, lecz uniknięto archaizmów. Szyk „jak i my” oddaje greckie podkreślenie zaimka, pozostając naturalny w polszczyźnie.
