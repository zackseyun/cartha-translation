id: MAT.6.30
reference: Matthew 6:30
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: pl
  text: A jeśli Bóg tak przyodziewa polną trawę, która dziś jest, a jutro zostaje wrzucona do pieca[a], to czy tym bardziej nie przyodzieje was, ludzie małej wiary?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chodzi o piec do wypieku; wysuszonej trawy i innych roślin polnych można było używać jako opału.
    reason: cultural_note
  - marker: b
    text: 'Możliwe też: „wy, którzy macie mało wiary”. Greckie ὀλιγόπιστοι jest bezpośrednim zwrotem zawierającym naganę z powodu niedostatecznego zaufania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: A jeśli
  rationale: δέ łagodnie rozwija i przeciwstawia tok argumentacji; „A jeśli” brzmi naturalnie po polsku i nie sugeruje zbyt ostrego kontrastu.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: polną trawę
  rationale: χόρτος oznacza trawę lub roślinność zielną. „Polna trawa” zachowuje obraz nietrwałej roślinności bez zawężania go wyłącznie do kwiatów.
- source_word: σήμερον ὄντα
  choice: która dziś jest
  rationale: Dosłowne i zarazem zrozumiałe oddanie imiesłowu ὄντα podkreśla obecną, lecz krótkotrwałą egzystencję trawy.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: a jutro zostaje wrzucona do pieca
  rationale: κλίβανος to piec, zwłaszcza piec do wypieku, niekoniecznie piec hutniczy. Czas teraźniejszy „zostaje wrzucona” zachowuje obrazowy charakter greckiego imiesłowu biernego.
- source_word: οὕτως ἀμφιέννυσιν
  choice: tak przyodziewa
  rationale: ἀμφιέννυμι znaczy „ubierać, przyodziewać”. „Przyodziewa” zachowuje metaforę ubrania i podniosły, lecz nadal zrozumiały rejestr.
- source_word: οὐ πολλῷ μᾶλλον
  choice: to czy tym bardziej nie
  rationale: Oddaje retoryczne rozumowanie od mniejszego do większego oraz naturalny szyk polskiego pytania.
- source_word: ὑμᾶς
  choice: przyodzieje was
  rationale: Greka eliptycznie pozostawia domyślny czasownik powtórzony z wcześniejszej części zdania; w polszczyźnie jego uzupełnienie zapewnia jasność.
- source_word: ὀλιγόπιστοι
  choice: ludzie małej wiary
  rationale: Rzeczownikowe określenie w wołaczu jest bezpośrednią naganą dotyczącą niewystarczającego zaufania. „Ludzie małej wiary” jest naturalne, godne i zachowuje bezpośredni zwrot.
theological_decisions:
- issue: Argument o Bożej trosce od mniejszego do większego
  choice: Zachowano pytanie retoryczne mówiące o tym, że Bóg tym bardziej przyodzieje uczniów.
  alternative: Oddanie wypowiedzi jako zdania oznajmującego.
  rationale: Grecka składnia z οὐ i końcowym wołaczem wspiera pytanie retoryczne, które uwydatnia napomnienie, nie dodając dalszych twierdzeń doktrynalnych.
- issue: Znaczenie ὀλιγόπιστοι
  choice: ludzie małej wiary
  alternative: wy, którzy macie mało wiary / małowierni
  rationale: 'Zachowano napięcie między „wiarą” a „zaufaniem”: przekład nie redukuje terminu wyłącznie do niepokoju psychologicznego ani nie czyni z niego nazwy stałej kategorii ludzi.'
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym tonie. „Przyodziewa” zachowuje metaforę ubrania i podniosłość wypowiedzi, a pozostała składnia jest prosta i komunikatywna. Markery przypisów umieszczono przy „pieca” i końcowym zwrocie zgodnie z treścią przypisów.
