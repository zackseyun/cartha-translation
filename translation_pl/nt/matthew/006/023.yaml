id: MAT.6.23
reference: Matthew 6:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: pl
  text: Jeśli zaś twoje oko jest złe[a], całe twoje ciało będzie ciemne. Jeśli więc światło, które jest w tobie, jest ciemnością, jakże wielka jest ciemność!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „chore” albo „niegodziwe”; ze względu na idiom związany z „okiem” i najbliższy kontekst możliwy jest też sens „skąpe”.'
    reason: Alternatywy leksykalne i idiomatyczne dla πονηρός.
lexical_decisions:
- source_word: πονηρός
  choice: złe
  rationale: 'Szerokie znaczeniowo „złe” zachowuje otwartość metafory: może wskazywać na wadliwość, moralne zło, a w semickim sposobie mówienia o oku także na skąpstwo. Nie zawęża tekstu wyłącznie do zdrowia wzroku ani do braku hojności.'
- source_word: σκοτεινός
  choice: ciemne
  rationale: Naturalny odpowiednik przymiotnika, zachowujący orzecznikowy charakter wyrażenia oraz obraz ciemności.
- source_word: φῶς
  choice: światło
  rationale: Podstawowy polski odpowiednik, który zachowuje metaforę bez dopowiadania, że chodzi o wewnętrzne, moralne lub duchowe poznanie.
- source_word: σκότος
  choice: ciemność
  rationale: Zachowuje bezpośredni kontrast ze „światłem” oraz kulminacyjne powtórzenie w ostatnim zdaniu.
- source_word: πόσον
  choice: jakże wielka
  rationale: Oddaje stopień w eliptycznym wykrzyknieniu i brzmi naturalnie oraz uroczyście po polsku.
- source_word: ὀφθαλμός
  choice: oko
  rationale: Dosłowne tłumaczenie jest konieczne dla zachowania cielesnej metafory dotyczącej postrzegania, nastawienia i orientacji moralnej.
- source_word: ὅλον τὸ σῶμά σου
  choice: całe twoje ciało
  rationale: Prosty i naturalny przekład, zachowujący nacisk wyrażony przez ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: światło, które jest w tobie
  rationale: Bliski grece, jasny po polsku przekład; nie wprowadza bardziej interpretacyjnego określenia „wewnętrzne światło”.
theological_decisions:
- issue: Znaczenie metafory „złego oka”
  choice: W tekście głównym pozostawiono szerokie określenie „złe”.
  alternative: 'Możliwe są odczytania: „chore” jako wadliwe postrzeganie, „niegodziwe” jako moralne zepsucie lub „skąpe” jako brak hojności.'
  rationale: 'Kontekst Mt 6,19–24 dopuszcza nakładające się sensy: moralną ciemność, zniekształcone postrzeganie i prawdopodobnie semicki idiom skąpego oka. Przekład nie rozstrzyga napięcia interpretacyjnego, a możliwe odcienie podaje w przypisie.'
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano prostą metaforykę światła i ciemności oraz wykrzyknieniową siłę zakończenia. Szyk „całe twoje ciało” jest naturalny, a zarazem oddaje nacisk tekstu greckiego.
