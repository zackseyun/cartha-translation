id: MAT.6.28
reference: Matthew 6:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: pl
  text: 'I dlaczego martwicie się o ubranie? Przyjrzyjcie się liliom polnym[a], jak rosną: nie trudzą się ani nie przędą.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dzikim kwiatom polnym”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: o ubranie
  rationale: Liczba pojedyncza ἐνδύματος oznacza tu ubranie jako ogólną kategorię materialnego zaopatrzenia, nie jedną konkretną szatę.
- source_word: τί μεριμνᾶτε
  choice: dlaczego martwicie się
  rationale: W tym kontekście μεριμνάω wyraża pełną niepokoju troskę. Polski zwrot „martwić się” jest naturalny i zachowuje pytajną funkcję τί.
- source_word: καταμάθετε
  choice: przyjrzyjcie się
  rationale: Czasownik w trybie rozkazującym wzywa do uważnej obserwacji prowadzącej do zrozumienia. „Przyjrzyjcie się” oddaje tę treść naturalniej niż samo „rozważcie”.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: liliom polnym
  rationale: κρίνα najbezpośredniej oznacza lilie, a dopełniacz τοῦ ἀγροῦ wskazuje na rośliny rosnące na polu lub dziko. „Lilie polne” to zwięzłe i naturalne sformułowanie.
- source_word: πῶς αὐξάνουσιν
  choice: jak rosną
  rationale: αὐξάνω opisuje tutaj naturalny wzrost roślin; „rosną” jest jasnym i bezpośrednim odpowiednikiem.
- source_word: οὐ κοπιῶσιν
  choice: nie trudzą się
  rationale: κοπιάω oznacza ciężko pracować lub trudzić się. „Nie trudzą się” zachowuje nacisk na wysiłek oraz zwięzłą paralelę z następnym czasownikiem.
- source_word: οὐδὲ νήθουσιν
  choice: ani nie przędą
  rationale: νήθω oznacza przędzenie nici lub przędzy. Samo „przędą” jest w języku polskim wystarczająco precyzyjne.
theological_decisions:
- issue: Znaczenie μεριμνάω w nauczaniu Jezusa o Bożym zaopatrzeniu
  choice: martwicie się
  alternative: troszczycie się / niepokoicie się
  rationale: Werset odnosi się do niepokojącej troski o materialne potrzeby, a nie potępia wszelkiej roztropnej dbałości. „Martwicie się” zachowuje to rozróżnienie bez dodawania interpretacji doktrynalnej.
- issue: Zakres znaczeniowy κρίνα
  choice: lilie
  alternative: dzikie kwiaty
  rationale: Podstawowe znaczenie rzeczownika przemawia za „liliami”, lecz możliwe szersze odniesienie botaniczne zostaje zachowane w przypisie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano początkowe „I”, odpowiadające greckiemu καί i łączące pytanie z poprzednim wywodem. Paralelizm „nie trudzą się ani nie przędą” naśladuje zwięzłą budowę grecką.
