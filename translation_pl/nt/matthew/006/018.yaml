id: MAT.6.18
reference: Matthew 6:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: pl
  text: abyś, poszcząc, nie był widziany przez ludzi, lecz przez swojego Ojca, który jest w ukryciu; a twój Ojciec, który widzi w ukryciu, wynagrodzi cię.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: abyś
  rationale: Wprowadza zdanie celu; polskie „abyś” naturalnie zachowuje celowy charakter wypowiedzi.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: nie pokazywał ludziom, że pościsz
  rationale: Oddaje sens bycia widocznym dla ludzkich obserwatorów jako ktoś poszczący, a zarazem brzmi naturalnie we współczesnej polszczyźnie. „Ludziom” ma tu znaczenie ogólne, zgodne z ἀνθρώποις.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: lecz swojemu Ojcu
  rationale: Zachowuje wyraźny kontrast między ludźmi a Ojcem oraz równoległą składnię celownika.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: który jest w ukryciu
  rationale: Nie dopowiada konkretnego miejsca i zachowuje związek z powtórzonym ἐν τῷ κρυφαίῳ w dalszej części wersetu.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: który widzi w ukryciu
  rationale: 'Pozostawia otwartą naturalną dwuznaczność: Ojciec widzi z ukrycia i dostrzega to, co dokonuje się w ukryciu; nie dodaje niewystępującego wprost dopełnienia.'
- source_word: ἀποδώσει σοι
  choice: wynagrodzi cię
  rationale: W kontekście Bożej odpowiedzi na pobożność praktykowaną bez ostentacji czasownik oznacza odpłatę lub nagrodę; „wynagrodzi” jest jasne i idiomatyczne.
theological_decisions:
- issue: Ogólny zakres τοῖς ἀνθρώποις
  choice: ludziom
  alternative: mężczyznom
  rationale: Kontekst dotyczy ludzkich obserwatorów bez ograniczenia do osób płci męskiej; „ludziom” dokładnie oddaje ogólny zakres greckiego wyrażenia.
- issue: Znaczenie ἐν τῷ κρυφαίῳ w obu wystąpieniach
  choice: w ukryciu
  alternative: w miejscu ukrytym; w skrytości
  rationale: Jednakowe tłumaczenie zachowuje retoryczne powtórzenie i nie rozstrzyga nadmiernie, czy nacisk pada na ukryte miejsce, niewidzialną obecność Ojca, czy skryty charakter działania.
- issue: Relacja między μὴ a ἀλλὰ
  choice: nie pokazywał ludziom… lecz swojemu Ojcu
  alternative: nie był widziany przez ludzi jako poszczący, lecz przez Ojca
  rationale: Polska konstrukcja zachowuje kontrast dwóch odbiorców bez sugerowania, że sam post ma być skierowany do Ojca jako świadczenie zasługi.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelizm „w ukryciu” oraz tradycyjne wielkie „O” w tytule „Ojciec” odnoszonym do Boga.
