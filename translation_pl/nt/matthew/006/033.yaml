id: MAT.6.33
reference: Matthew 6:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: pl
  text: Lecz szukajcie najpierw jego królestwa i jego sprawiedliwości[a], a wszystko to będzie wam dodane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „prawości”. Greckie słowo obejmuje zarówno prawość przed Bogiem i postępowanie zgodne z jego wolą, jak i sprawiedliwość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: szukajcie
  rationale: Tryb rozkazujący czasu teraźniejszego w liczbie mnogiej wyraża stałe, czynne dążenie. „Szukajcie” jest zwięzłe i naturalne, a ciągłość działania wynika z formy nakazu i kontekstu.
- source_word: δὲ
  choice: lecz
  rationale: Spójnik zaznacza przeciwstawienie wobec wcześniejszej troski o jedzenie, picie i ubranie. „Lecz” jasno oddaje ten zwrot argumentacji.
- source_word: πρῶτον
  choice: najpierw
  rationale: Zachowuje podstawowe znaczenie słowa oraz sens pierwszeństwa i nadrzędnego priorytetu bez rozwijania go w parafrazę.
- source_word: βασιλείαν
  choice: królestwa
  rationale: „Królestwo” jest naturalnym i pojemnym odpowiednikiem, mogącym obejmować zarówno królewskie panowanie Boga, jak i rzeczywistość poddaną temu panowaniu.
- source_word: δικαιοσύνην
  choice: sprawiedliwości
  rationale: 'Polskie „sprawiedliwość” zachowuje szeroki zakres greckiego terminu: właściwą relację z Bogiem, postępowanie zgodne z jego wolą oraz wymiar sprawiedliwości. Alternatywne „prawość” podano w przypisie.'
- source_word: αὐτοῦ
  choice: jego
  rationale: Zaimek zachowano bez dopowiadania imienia Boga; z kontekstu wynika, że odnosi się on do Boga, Ojca.
- source_word: ταῦτα πάντα
  choice: wszystko to
  rationale: 'Naturalne po polsku sformułowanie wskazuje na wszystkie potrzeby materialne wymienione wcześniej: jedzenie, picie i ubranie.'
- source_word: προστεθήσεται
  choice: będzie wam dodane
  rationale: Forma przyszła bierna zostaje zachowana i wyraża, że wymienione dobra zostaną dołączone do tego, co ma być przedmiotem pierwszorzędnego dążenia.
- source_word: ὑμῖν
  choice: wam
  rationale: Celownik liczby mnogiej jest oddany bezpośrednio i naturalnie przez „wam”.
theological_decisions:
- issue: Zakres znaczeniowy δικαιοσύνη
  choice: sprawiedliwość
  alternative: prawość
  rationale: „Sprawiedliwość” zachowuje zarówno wymiar zgodności z wolą Boga, jak i etyczny czy społeczny wymiar sprawiedliwego działania. Samo „prawość” mogłoby osłabić ten drugi aspekt, dlatego pozostaje wariantem w przypisie.
- issue: Odniesienie zaimka αὐτοῦ
  choice: jego
  alternative: Boga
  rationale: Pozostawienie zaimka odzwierciedla tekst grecki i nie wprowadza niepotrzebnego uściślenia, choć kontekst jasno wskazuje na Boga, Ojca.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłą budowę nakazu oraz biblijnie rozpoznawalne, lecz nadal naturalne wyrażenia „szukajcie najpierw” i „będzie wam dodane”.
