  terminology: „Ojcze nasz” i „imię” są trafne oraz zachowują zakorzenioną terminologię biblijną bez interpretacyjnego zastępowania jej innymi pojęciami. „Uznawane za święte” precyzyjniej przekazuje pragmatyczny sens ἁγιασθήτω niż „uświęcone”, nie narzucając wyjaśnienia, kto i w jaki sposób ma oddawać tę cześć.
