  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: pl
  text: 'Wy zatem módlcie się tak: „Ojcze nasz, który jesteś w niebiosach[a], niech Twoje imię będzie uznawane za święte[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradycyjnie: „w niebie”. Grecki tekst ma liczbę mnogą: „w niebiosach”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „niech Twoje imię zostanie uświęcone”. Sens: niech będzie uznawane i traktowane jako święte. Tradycyjnie: „święć się imię Twoje”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: tak
  rationale: Wprowadza sposób lub wzór modlitwy. Polskie „tak” jest naturalne i zachowuje instrukcyjny charakter wypowiedzi.
- source_word: οὖν
  choice: zatem
  rationale: Zachowuje wynikowy związek z poprzedzającym nauczaniem Jezusa.
- source_word: προσεύχεσθε ὑμεῖς
  choice: Wy ... módlcie się
  rationale: Tryb rozkazujący oddano bezpośrednio, a osobny zaimek „Wy” zachowuje nacisk obecny w greckim ὑμεῖς.
- source_word: Πάτερ ἡμῶν
  choice: Ojcze nasz
  rationale: Naturalny polski wołacz zachowuje bezpośredni zwrot oraz wspólnotowy zaimek liczby mnogiej.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: który jesteś w niebiosach
  rationale: Forma „niebiosa” zachowuje grecką liczbę mnogą, a dodane w polszczyźnie „który jesteś” jasno i naturalnie oddaje funkcję greckiej konstrukcji określającej Ojca.
- source_word: ἁγιασθήτω
  choice: niech ... będzie uświęcone
  rationale: Konstrukcja zachowuje bierną formę greckiego rozkaźnika oraz charakter prośby, nie rozstrzygając ponad tekst, kto dokonuje uświęcenia.
- source_word: τὸ ὄνομά σου
  choice: Twoje imię
  rationale: Bezpośrednio zachowuje biblijne pojęcie „imienia”, bez zastępowania go interpretacyjnymi określeniami osoby, sławy czy objawionego charakteru Boga.
theological_decisions:
- issue: Liczba mnoga w określeniu miejsca przebywania Ojca
  choice: w niebiosach
  alternative: w niebie
  rationale: Grecki tekst ma liczbę mnogą τοῖς οὐρανοῖς. Zachowano ją, choć tradycyjna polska formuła zwykle używa liczby pojedynczej.
- issue: Znaczenie biernego ἁγιασθήτω
  choice: niech Twoje imię będzie uświęcone
  alternative: niech Twoje imię będzie uznawane za święte
  rationale: Wybrana forma zachowuje zwięzłość, stronę bierną i teologiczną doniosłość oryginału. Nie ogranicza sensu wyłącznie do ludzkiego uznania świętości imienia, lecz pozostawia otwarty pełny zakres prośby.
translation_notes:
  register: Współczesna, godna polszczyzna z zachowaniem rozpoznawalnego rytmu Modlitwy Pańskiej. Wielkie litery w zaimkach odnoszących się do Boga stosuje się zgodnie z polską konwencją religijną. „Niebiosa” ma lekko podniosły rejestr, ale wiernie odzwierciedla grecką liczbę mnogą.
