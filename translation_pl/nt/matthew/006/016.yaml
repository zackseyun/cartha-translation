id: MAT.6.16
reference: Matthew 6:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: pl
  text: 'A kiedy pościcie, nie przybierajcie ponurego wyglądu jak obłudnicy. Oni bowiem oszpecają[a] swoje twarze, aby ludzie widzieli, że poszczą. Zaprawdę mówię wam: otrzymali już całą swoją zapłatę.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zaniedbują swój wygląd”.'
    reason: Greckie ἀφανίζουσιν może w tym kontekście opisywać zarówno szpecenie twarzy, jak i celowe zaniedbanie wyglądu, aby post stał się widoczny.
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: A kiedy pościcie
  rationale: Ὅταν z trybem łączącym odnosi się do powtarzającej się praktyki. Polskie „kiedy pościcie” naturalnie oddaje tę ogólną, nieokreśloną sytuację, a „A” łączy wypowiedź z wcześniejszymi pouczeniami.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: nie przybierajcie ponurego wyglądu
  rationale: Sformułowanie zachowuje dynamiczny odcień γίνεσθε — chodzi o przyjmowanie określonej postawy lub miny — i wiąże przymiotnik σκυθρωποί z widocznym wyrazem twarzy.
- source_word: ὡς οἱ ὑποκριταί
  choice: jak obłudnicy
  rationale: „Obłudnicy” jest współczesnym, zrozumiałym odpowiednikiem określającym ludzi odgrywających pobożność na pokaz.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: oszpecają swoje twarze
  rationale: Zachowano konkretny obraz twarzy oraz mocny sens celowego pogarszania wyglądu. Przypis sygnalizuje możliwy odcień zaniedbywania wyglądu.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: aby ludzie widzieli, że poszczą
  rationale: Naturalna polska konstrukcja celowa oddaje zamiar, by post został zauważony przez innych. „Ludzie” odpowiada ogólnemu znaczeniu ἄνθρωποι bez zawężenia do mężczyzn.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Zachowuje uroczystą i autorytatywną formułę wypowiedzi Jezusa, pozostając zrozumiałe we współczesnej polszczyźnie biblijnej.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: otrzymali już całą swoją zapłatę
  rationale: ἀπέχω jest tu idiomem handlowym oznaczającym pełne otrzymanie należności. „Już całą” jasno przekazuje, że nie pozostaje dalsza zapłata.
theological_decisions:
- issue: Zakres τοῖς ἀνθρώποις
  choice: ludzie
  alternative: mężczyźni
  rationale: W tym kontekście ἄνθρωποι oznacza ludzi ogólnie. Polski rzeczownik „ludzie” wiernie oddaje ten zakres i nie wprowadza nieuzasadnionego ograniczenia płci.
- issue: Sens pełnego otrzymania zapłaty
  choice: otrzymali już całą swoją zapłatę
  alternative: mają swoją zapłatę
  rationale: 'Rozwinięcie oddaje idiomatyczną siłę ἀπέχουσιν: uznanie ze strony ludzi stanowi pełną należność, którą już odebrali. Nie dopowiada wprost dalszego sądu ani nagrody, lecz zachowuje napięcie obecne w tekście.'
translation_notes:
  register: Współczesna, godna polszczyzna z umiarkowanie biblijną formułą „Zaprawdę mówię wam”. Zdania są proste i czytelne; zachowano wyrazisty kontrast między postem a publicznym odgrywaniem pobożności.
