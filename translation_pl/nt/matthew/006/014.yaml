source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: pl
  text: Bo jeśli przebaczycie ludziom ich przewinienia[a], również wam przebaczy wasz Ojciec niebieski.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „występki”, „uchybienia” lub „wykroczenia”. Greckie słowo oznacza moralne przewinienia albo fałszywe kroki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Bo jeśli
  rationale: γάρ łączy zdanie wyjaśniająco z poprzedzającą modlitwą, a ἐάν z aorystem trybu łączącego wprowadza rzeczywisty warunek; naturalnym polskim odpowiednikiem jest „Bo jeśli”.
- source_word: ἀφῆτε ... ἀφήσει
  choice: przebaczycie ... przebaczy
  rationale: W kontekście win moralnych ἀφίημι oznacza „przebaczać”. Powtórzenie tego samego polskiego rdzenia zachowuje więź słowną obecną w grece.
- source_word: τοῖς ἀνθρώποις
  choice: ludziom
  rationale: ἄνθρωποι oznacza tu ludzi ogólnie, nie tylko mężczyzn; „ludziom” jest wierne i naturalne.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: ich przewinienia
  rationale: παράπτωμα określa moralne uchybienie, występek lub fałszywy krok. „Przewinienia” zachowują sens moralny i relacyjny, a zaimek „ich” oddaje αὐτῶν.
- source_word: καὶ ὑμῖν
  choice: również wam
  rationale: καί wskazuje tu na odpowiadające sobie przebaczenie i zostaje oddane przez „również”; celownik ὑμῖν naturalnie brzmi po polsku jako „wam”.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: wasz Ojciec niebieski
  rationale: To naturalne i godne polskie oddanie greckiej konstrukcji atrybutywnej, zachowujące Mateuszowe określenie Boga jako Ojca.
theological_decisions:
- issue: Warunkowy związek między przebaczeniem ludziom a przebaczeniem Bożym
  choice: 'Zachować zdanie jako bezpośredni warunek: „jeśli ... również ...”.'
  alternative: Wyjaśnić je jako zasługiwanie na Boże przebaczenie albo jedynie jako dowód wcześniej otrzymanego przebaczenia.
  rationale: Greka formułuje prostą wypowiedź warunkową, nie rozstrzygając w tym wersecie jej szerszego związku doktrynalnego. Przekład zachowuje tę teologiczną napiętość bez dopowiadania interpretacji.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Szyk „również wam przebaczy” podkreśla odpowiedniość obu członów, nie brzmiąc archaicznie. Wielka litera w „Ojciec” sygnalizuje odniesienie do Boga zgodnie ze współczesną polską praktyką religijną.
