  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: pl
  text: Ty zaś, gdy się modlisz, wejdź do swojego wewnętrznego pomieszczenia[a], zamknij drzwi i módl się do swojego Ojca, który jest w ukryciu. A twój Ojciec, który widzi w ukryciu, wynagrodzi cię[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „prywatnego pokoju”, „schowka” lub tradycyjnie „komory”. Greckie słowo oznacza wewnętrzne pomieszczenie służące odosobnieniu albo przechowywaniu rzeczy.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „odpłaci ci” albo „odda ci”. Grecki czasownik może oznaczać oddanie, odpłatę lub wynagrodzenie, zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ty zaś
  rationale: Emfatyczny zaimek wraz z δέ tworzy kontrast wobec obłudników z poprzedniego wersetu. „Ty zaś” naturalnie zachowuje ten nacisk w języku polskim.
- source_word: ὅταν προσεύχῃ
  choice: gdy się modlisz
  rationale: Konstrukcja ὅταν z trybem łączącym ma sens ogólnoczasowy. Polskie „gdy się modlisz” obejmuje sytuacje powtarzalne, nie sugerując jednorazowego wydarzenia.
- source_word: εἴσελθε
  choice: wejdź do
  rationale: Tryb rozkazujący wyraża bezpośrednie polecenie wejścia do określonego miejsca.
- source_word: ταμεῖόν
  choice: wewnętrzne pomieszczenie
  rationale: Termin oznacza odosobnione pomieszczenie wewnątrz domu, często używane także jako schowek. Wybór nie ogranicza znaczenia wyłącznie do magazynu ani nie przywołuje mylącego współczesnego obrazu garderoby.
- source_word: κλείσας τὴν θύραν σου
  choice: zamknij drzwi
  rationale: Imiesłów aorystu wskazuje czynność poprzedzającą modlitwę. Naturalna polska sekwencja poleceń zachowuje kolejność bez ciężkiej konstrukcji „zamknąwszy drzwi”.
- source_word: πρόσευξαι
  choice: módl się
  rationale: Bezpośredni i naturalny odpowiednik imperatywu czasownika προσεύχομαι.
- source_word: τῷ πατρί σου
  choice: do swojego Ojca
  rationale: Zachowano relacyjne określenie Boga bez dodawania niewystępującego tu przymiotnika „niebieskiego”.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: który jest w ukryciu
  rationale: Sformułowanie zachowuje odniesienie do Ojca oraz motyw ukrycia, nie sprowadzając go wyłącznie do fizycznego miejsca.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: który widzi w ukryciu
  rationale: Dosłowne powtórzenie „w ukryciu” zachowuje retoryczną więź między ukrytą obecnością Ojca a Jego widzeniem.
- source_word: ἀποδώσει σοι
  choice: odpłaci tobie
  rationale: Czasownik może znaczyć „oddać”, „odpłacić” albo „wynagrodzić”. „Odpłaci tobie” zachowuje ideę odpowiedzi i należnego odwzajemnienia, nie precyzując postaci zapłaty.
theological_decisions:
- issue: Znaczenie powtórzonego wyrażenia ἐν τῷ κρυπτῷ
  choice: w ukryciu w obu wystąpieniach
  alternative: w ukrytym miejscu; potajemnie; to, co dzieje się w ukryciu
  rationale: Powtórzenie podkreśla kontrast między ukrytą modlitwą a publicznym popisem. Zachowanie tego samego wyrażenia nie rozstrzyga ponad tekst, czy nacisk jest przede wszystkim miejscowy, czy sposobowy.
- issue: Określenie Boga jako πατήρ
  choice: Ojciec
  alternative: Ojciec niebieski
  rationale: Tekst mówi po prostu „twój Ojciec”. Wielka litera sygnalizuje odniesienie do Boga, bez dodawania określenia zaczerpniętego z sąsiednich fragmentów.
- issue: Charakter Bożej odpowiedzi wyrażonej przez ἀποδώσει
  choice: odpłaci tobie
  alternative: wynagrodzi cię; odda tobie
  rationale: Wybrano sformułowanie, które zachowuje szerszy sens odwzajemnienia i nie określa natury ani formy Bożej odpowiedzi.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Ty zaś” zachowuje wyraźny kontrast, a równoległe „w ukryciu” oddaje zamierzone powtórzenie. Składnię imiesłowową przełożono jako naturalny ciąg poleceń.
