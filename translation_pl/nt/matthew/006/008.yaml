  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: pl
  text: Nie upodabniajcie się więc do nich[a], bo wasz Ojciec wie, czego potrzebujecie, zanim Go poprosicie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie stańcie się tacy jak oni” albo „Nie bądźcie do nich podobni”.'
    reason: Alternatywne oddanie greckiej formy biernej ὁμοιωθῆτε i jej aspektu.
lexical_decisions:
- source_word: μὴ οὖν
  choice: Nie ... więc
  rationale: Przeczenie z trybem łączącym wyraża zakaz, a οὖν wskazuje na wniosek wynikający z poprzedniego ostrzeżenia. Polski szyk z „więc” brzmi naturalnie i zachowuje to powiązanie.
- source_word: ὁμοιωθῆτε
  choice: upodabniajcie się
  rationale: Czasownik oznacza stawanie się podobnym lub przyjmowanie czyjegoś wzoru. Forma zwrotna jest naturalna po polsku i oddaje sens bez niezręcznej dosłowności strony biernej.
- source_word: αὐτοῖς
  choice: do nich
  rationale: Zaimek odsyła do pogan wspomnianych bezpośrednio wcześniej; nie ma potrzeby ponownie ich nazywać.
- source_word: οἶδεν
  choice: wie
  rationale: 'Choć greckie οἶδα ma formę perfectum, ma znaczenie teraźniejsze: „wie”.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: wasz Ojciec
  rationale: Tekst mówi po prostu „wasz Ojciec”; nie dodano określenia „niebieski”, którego w tym zdaniu nie ma.
- source_word: ὧν χρείαν ἔχετε
  choice: czego potrzebujecie
  rationale: Naturalna polska konstrukcja zwięźle oddaje treść potrzeb uczniów.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: zanim Go poprosicie
  rationale: Konstrukcja πρὸ τοῦ z bezokolicznikiem określa wcześniejszy moment. „Zanim Go poprosicie” jest idiomatyczne i zachowuje osobowy dopełniacz czasownika αἰτέω.
theological_decisions:
- issue: Uprzednia wiedza Boga a modlitwa
  choice: 'Stwierdzenie oddano wprost: Ojciec zna potrzeby uczniów, zanim Go poproszą.'
  alternative: Parafraza wyjaśniająca, że modlitwa służy relacji, a nie przekazywaniu Bogu informacji, albo sformułowanie podkreślające określoną doktrynę wszechwiedzy.
  rationale: Werset stwierdza uprzednią wiedzę Ojca, lecz nie objaśnia, dlaczego mimo to należy się modlić. Przekład zachowuje to napięcie i nie rozstrzyga szerszej debaty teologicznej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk „Nie upodabniajcie się więc do nich” zachowuje logiczne połączenie z poprzednim zdaniem. Wielka litera w zaimku „Go” odpowiada utrwalonej polskiej konwencji odnoszenia zaimków do Boga, bez dodawania treści niewystępującej w grece.
