  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: pl
  text: Oko jest lampą ciała. Jeśli więc twoje oko jest zdrowe[a], całe twoje ciało będzie pełne światła.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „proste”, „niepodzielone”, „jasne” lub „sprawne”; greckie słowo w pewnych kontekstach może również oznaczać „szczodre”.'
    reason: Alternatywne znaczenia wieloznacznego greckiego przymiotnika ἁπλοῦς.
lexical_decisions:
- source_word: λύχνος
  choice: lampa
  rationale: Zwykle oznacza konkretną lampę, a nie światło w sensie abstrakcyjnym; zachowuje metaforę oka jako źródła oświetlenia dla ciała.
- source_word: σῶμα
  choice: ciało
  rationale: Podstawowy i naturalny polski odpowiednik, dobrze zachowujący obraz cielesny.
- source_word: ὀφθαλμός
  choice: oko
  rationale: Dosłowne tłumaczenie pasuje zarówno do obrazu fizycznego, jak i jego sensu metaforycznego.
- source_word: ἐὰν οὖν
  choice: jeśli więc
  rationale: Zachowuje zarówno warunkowy charakter zdania, jak i wynikowe nawiązanie οὖν do poprzedniego stwierdzenia.
- source_word: ἁπλοῦς
  choice: zdrowe
  rationale: W bezpośrednim obrazie oka i oświetlenia ciała naturalnie wskazuje na oko prawidłowo funkcjonujące. Inne możliwe odcienie znaczeniowe zachowano w przypisie.
- source_word: ὅλον
  choice: całe
  rationale: Naturalnie oddaje pełny, obejmujący całość zakres greckiego przymiotnika.
- source_word: φωτεινὸν
  choice: pełne światła
  rationale: Idiomaticzne sformułowanie zachowujące obraz przeniknięcia całego ciała światłem.
- source_word: ἔσται
  choice: będzie
  rationale: Zachowuje wyraźny czas przyszły tekstu greckiego.
theological_decisions:
- issue: Znaczenie ἁπλοῦς w metaforze oka
  choice: 'W tekście głównym: „zdrowe”'
  alternative: „proste”, „niepodzielone”, „jasne”, „sprawne”; w pewnych kontekstach także „szczodre”
  rationale: Najbliższy kontekst mówi o oku jako lampie ciała i przeciwstawia je złemu oku w następnym wersecie, dlatego „zdrowe” najczytelniej zachowuje obraz prawidłowego widzenia. Ponieważ greckie słowo ma szerszy zakres znaczeń i może sugerować niepodzielność, prostotę lub szczodrość, nie rozstrzygnięto tego napięcia bez zaznaczenia alternatyw.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano zwięzłość oraz konkretną metaforę oryginału; szyk „Jeśli więc” brzmi naturalnie i oddaje logiczne powiązanie zdań.
