  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: pl
  text: A kto z was, zamartwiając się, może dodać jeden łokieć do długości swojego życia[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dodać do swojego wzrostu jeden łokieć”. Greckie słowo może oznaczać zarówno długość życia albo wiek, jak i wzrost.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: A kto z was
  rationale: Wyrażenie τίς ἐξ ὑμῶν jest idiomatycznym pytaniem „kto z was”, a δέ pełni tu lekką funkcję łączącą; polskie „A” naturalnie wiąże zdanie z poprzednim wywodem.
- source_word: μεριμνῶν
  choice: zamartwiając się
  rationale: 'Imiesłów oddaje trwające martwienie się i zachowuje związek środka lub okoliczności: człowiek nie może tego osiągnąć przez zamartwianie się.'
- source_word: δύναται προσθεῖναι
  choice: może dodać
  rationale: Proste i naturalne sformułowanie zachowuje zarówno sens zdolności wyrażony przez δύναται, jak i konkretny obraz dodawania obecny w προσθεῖναι.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: do długości swojego życia
  rationale: ἡλικία może oznaczać wiek lub długość życia, ale także wzrost. W kontekście troski o życie wybrano „długość swojego życia”, nie usuwając alternatywy z przypisu.
- source_word: πῆχυν ἕνα
  choice: choć jeden łokieć
  rationale: Łokieć jest dosłowną starożytną miarą długości i zachowuje wyrazisty obraz mierzenia życia. Partykuła „choć” naturalnie wzmacnia retoryczny sens pytania bez zmiany jego treści.
theological_decisions:
- issue: Znaczenie ἡλικία w tym powiedzeniu
  choice: długość życia
  alternative: wzrost
  rationale: Sens „długość życia” dobrze współgra z szerszym nauczaniem o trosce o życie, choć połączenie z łokciem pozwala także rozumieć to słowo jako „wzrost”. Autentyczna niejednoznaczność została zachowana w przypisie.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. „Zamartwiając się” jest zrozumiałe dla zwykłego czytelnika, a „łokieć” zachowuje historyczny obraz tekstu. Zaimek zwrotny „swojego” odpowiada polskiej składni pytania ogólnego.
