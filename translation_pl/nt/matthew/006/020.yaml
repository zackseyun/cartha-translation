source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: pl
  text: Gromadźcie natomiast sobie skarby w niebie, gdzie ani mól, ani rozkład[a] nie niszczą i gdzie złodzieje nie włamują się[b] ani nie kradną.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „rdza” lub szerzej: „to, co zżera”. Greckie słowo oznacza niszczące zżeranie lub stopniowe niszczenie.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „przekopują się” lub „przebijają się”; chodzi prawdopodobnie o złodziei przebijających ścianę domu.'
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: gromadźcie
  rationale: Czas teraźniejszy trybu rozkazującego wskazuje na trwające lub powtarzające się działanie; „gromadźcie” naturalnie oddaje czynność odkładania skarbów.
- source_word: δὲ
  choice: natomiast
  rationale: Wyraża kontrast z zakazem z poprzedniego wersetu, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: ὑμῖν
  choice: sobie
  rationale: Oddaje celownik korzyści i zwrotny sens wyrażenia bez zbędnego rozwijania tekstu.
- source_word: θησαυροὺς
  choice: skarby
  rationale: Zachowuje liczbę mnogą oraz metaforę obecną w tekście greckim.
- source_word: ἐν οὐρανῷ
  choice: w niebie
  rationale: Naturalny polski odpowiednik wyrażenia miejscowego w liczbie pojedynczej.
- source_word: σὴς
  choice: mól
  rationale: Oznacza mola niszczącego przechowywane tkaniny i inne dobra; liczba pojedyncza ma sens gatunkowy.
- source_word: βρῶσις
  choice: rozkład
  rationale: Słowo może oznaczać zżeranie lub niszczące zużycie. „Rozkład” zachowuje szerszy sens niż samo „rdza”, choć alternatywę podano w przypisie.
- source_word: ἀφανίζει
  choice: niszczy
  rationale: Jasno oddaje doprowadzanie do zaniku lub ruiny i pasuje do obu wymienionych czynników.
- source_word: κλέπται
  choice: złodzieje
  rationale: Bezpośredni i standardowy odpowiednik rzeczownika w liczbie mnogiej.
- source_word: διορύσσουσιν
  choice: włamują się
  rationale: Naturalnie przekazuje sens wtargnięcia w celu kradzieży; dosłowny obraz przebijania lub przekopywania ściany zachowano w przypisie.
- source_word: κλέπτουσιν
  choice: kradną
  rationale: Prosty, bezpośredni odpowiednik greckiego czasownika.
theological_decisions:
- issue: Natura „skarbów w niebie”
  choice: Zachowano metaforę „skarby w niebie” bez objaśniającej parafrazy.
  alternative: „nagrody w niebie” lub „duchowe bogactwa”
  rationale: Tekst nie definiuje tu dokładnie natury tych skarbów. Zachowanie metafory nie narzuca określonej nauki o zasłudze, nagrodzie ani dobrach duchowych.
- issue: Zakres znaczeniowy βρῶσις
  choice: rozkład
  alternative: rdza; korozja; zżeranie
  rationale: Wybór zachowuje ogólny obraz niszczącego procesu i nie ogranicza wypowiedzi wyłącznie do korozji metalu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Szyk zachowuje kontrast z poprzednim wersetem, a obraz skarbów pozostaje bez interpretacyjnego rozwinięcia.
