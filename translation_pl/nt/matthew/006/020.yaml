  terminology: „Skarby w niebie” zachowuje metaforę bez doktrynalnego dopowiedzenia. „Mól”, „złodzieje” i „kradną” są trafne. Przypis do βρῶσις właściwie sygnalizuje, że „rdza” jest możliwą, lecz nie jedyną interpretacją; przypis do διορύσσουσιν poprawnie objaśnia realium budowlane.
