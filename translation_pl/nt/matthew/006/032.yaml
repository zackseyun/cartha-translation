  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: pl
  text: Bo o to wszystko zabiegają poganie[a]. Wasz Ojciec niebieski przecież wie, że tego wszystkiego potrzebujecie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „narody” albo „nie-Żydzi”. Greckie określenie może oznaczać ogólnie narody, lecz tutaj najpewniej odnosi się do ludzi spoza ludu przymierza.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: poganie
  rationale: W tym kontekście określenie odnosi się do ludzi spoza ludu przymierza i kontrastuje ich postawę z postawą uczniów. „Poganie” jest naturalne po polsku, choć może akcentować aspekt religijny; dlatego w przypisie zachowano alternatywy „narody” i „nie-Żydzi”.
- source_word: ἐπιζητοῦσιν
  choice: usilnie zabiegają
  rationale: Czasownik ἐπιζητέω wyraża ukierunkowane, gorliwe lub uporczywe poszukiwanie. „Usilnie zabiegają” oddaje tę intensywność i dobrze łączy się z dobrami wymienionymi w kontekście.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Wasz Ojciec niebieski
  rationale: Naturalne i godne polskie sformułowanie, zachowujące zarówno zaimek „wasz”, jak i określenie Ojca jako niebieskiego.
- source_word: οἶδεν
  choice: wie
  rationale: Choć grecka forma jest formalnie perfectum, ma znaczenie teraźniejsze i najtrafniej odpowiada jej polskie „wie”.
- source_word: χρῄζετε
  choice: potrzebujecie
  rationale: Jasny, współczesny odpowiednik wskazujący na rzeczywistą potrzebę.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: o to wszystko ... tego wszystkiego
  rationale: Zachowano greckie powtórzenie obejmujące wszystkie rzeczy wymienione w poprzednim kontekście, dostosowując przypadki do polskiej składni.
- source_word: γὰρ ... γὰρ
  choice: Bo ... przecież
  rationale: Obie partykuły zachowują funkcję uzasadniającą. Zróżnicowanie polskich odpowiedników pozwala uniknąć niezręcznego powtórzenia „bo”, a „przecież” naturalnie przedstawia drugie zdanie jako podstawę ufności.
theological_decisions:
- issue: Odniesienie τὰ ἔθνη w nauczaniu Jezusa
  choice: poganie
  alternative: narody; nie-Żydzi
  rationale: Kontekst przeciwstawia troskę ludzi spoza wspólnoty przymierza ufności uczniów wobec Ojca. „Poganie” zachowuje historyczno-religijny kontrast, ale przypis sygnalizuje szerszy zakres greckiego określenia i nie zamienia go w bezwzględny osąd wszystkich nie-Żydów.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano nacisk wynikający z ἐπιζητοῦσιν oraz powtórzenie „wszystko / wszystkiego”, unikając zarazem kalkowania podwójnego γάρ.
