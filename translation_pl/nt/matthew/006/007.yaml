id: MAT.6.7
reference: Matthew 6:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: pl
  text: A gdy się modlicie, nie mnóżcie pustych słów[a] jak poganie[b]. Sądzą bowiem, że zostaną wysłuchani z powodu mnóstwa swoich słów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „nie paplajcie” albo „nie powtarzajcie bezmyślnie”. Grecki czasownik jest rzadki i prawdopodobnie odnosi się do pustej, mechanicznej lub rozwlekłej mowy, nie zaś do każdej szczerej modlitwy, w której powtarza się te same słowa.'
    reason: lexical_alternative
  - marker: b
    text: 'To znaczy ludzie z narodów nieżydowskich, pozostający poza ludem przymierza; można też oddać: „nie-Żydzi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: gdy się modlicie
  rationale: Imiesłów określa okoliczność, w której obowiązuje nakaz. Taki przekład jest naturalny po polsku i zachowuje sens greckiej konstrukcji.
- source_word: δὲ
  choice: A
  rationale: Partykuła wprowadza kolejne pouczenie i łagodnie łączy je z poprzednim kontekstem, bez nadmiernego podkreślania przeciwstawienia.
- source_word: μὴ βατταλογήσητε
  choice: nie mnóżcie pustych słów
  rationale: Rzadki czasownik najprawdopodobniej oznacza pustą, mechaniczną lub rozwlekłą mowę. Przekład oddaje zarówno nadmiar słów, jak i ich beztreściowość, nie sugerując, że zakazane jest każde powtarzanie słów w modlitwie.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: jak poganie
  rationale: W żydowskim kontekście określenie odnosi się do ludzi spoza Izraela, czyli narodów nieżydowskich. „Poganie” jest utartym i zrozumiałym polskim odpowiednikiem, a przypis objaśnia jego zakres.
- source_word: δοκοῦσιν
  choice: Sądzą
  rationale: Czasownik wyraża ich przekonanie lub założenie dotyczące skuteczności modlitwy. „Sądzą” brzmi naturalnie i zachowuje lekko krytyczny odcień kontekstu.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: z powodu mnóstwa swoich słów
  rationale: Wyrażenie wskazuje na wielomówność jako domniemaną podstawę wysłuchania. Przekład jasno oddaje sens przyczynowy bez nienaturalnego rzeczownika „wielomówność” w tekście głównym.
- source_word: εἰσακουσθήσονται
  choice: zostaną wysłuchani
  rationale: Strona bierna oznacza uzyskanie przychylnego posłuchu. „Zostaną wysłuchani” zachowuje tę formę i nie narzuca mocniejszego znaczenia „otrzymają odpowiedź”.
theological_decisions:
- issue: Czy Jezus zakazuje wszelkiego powtarzania w modlitwie, czy pustej i rozwlekłej mowy
  choice: nie mnóżcie pustych słów
  alternative: nie powtarzajcie bezmyślnie; nie paplajcie
  rationale: Rzadki grecki czasownik nie pozwala sprowadzić zakazu do każdego rodzaju powtórzeń. Wybrany przekład wskazuje na pustą wielomówność jako sposób rzekomego zapewnienia sobie wysłuchania, a zarazem zachowuje zakres niepewności leksykalnej w przypisie.
translation_notes:
  register: Współczesny, jasny i godny rejestr. Zdanie podzielono po porównaniu, aby zachować naturalny polski rytm. Sformułowanie „mnóżcie pustych słów” jest zrozumiałe dla zwykłego czytelnika, a jednocześnie unika potoczności czasownika „paplać” w tekście głównym.
