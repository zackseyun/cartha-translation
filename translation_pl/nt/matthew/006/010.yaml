  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: pl
  text: Niech przyjdzie Twoje królestwo; niech się spełni Twoja wola[a], jak w niebie, tak i na ziemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Możliwe także, że słowa „jak w niebie, tak i na ziemi” odnoszą się do obu próśb, a nie tylko do prośby o spełnienie woli Boga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: Niech przyjdzie
  rationale: Aoryst rozkazujący w trzeciej osobie wyraża prośbę skierowaną do Boga. Konstrukcja „niech przyjdzie” jest naturalna we współczesnej polszczyźnie modlitewnej i zachowuje wolitywną siłę greki.
- source_word: ἡ βασιλεία σου
  choice: Twoje królestwo
  rationale: βασιλεία może oznaczać królowanie, panowanie lub królestwo. „Królestwo” jest utrwalone, naturalne w Ewangelii Mateusza i nie wyklucza dynamicznego sensu Bożego panowania.
- source_word: γενηθήτω
  choice: niech się spełni
  rationale: Aoryst rozkazujący strony biernej od γίνομαι z rzeczownikiem θέλημα wskazuje, by wola Boga stała się rzeczywistością. „Niech się spełni” jest naturalne po polsku i zachowuje zarówno sens działania zgodnego z wolą, jak i jej urzeczywistnienia.
- source_word: τὸ θέλημά σου
  choice: Twoja wola
  rationale: θέλημα oznacza to, czego ktoś chce lub co zamierza. „Wola” zachowuje zakres znaczeniowy i wagę teologiczną bez nadmiernego doprecyzowania.
- source_word: ὡς
  choice: jak
  rationale: ὡς wprowadza porównanie; „jak” oddaje je zwięźle i naturalnie.
- source_word: ἐν οὐρανῷ
  choice: w niebie
  rationale: Przyimek ἐν z celownikiem oznacza tutaj sferę niebiańską. „W niebie” jest idiomatycznym polskim odpowiednikiem.
- source_word: καὶ ἐπὶ γῆς
  choice: tak i na ziemi
  rationale: W konstrukcji porównawczej ὡς ... καί polskie „jak ..., tak i ...” jasno i naturalnie odtwarza relację między niebem a ziemią. ἐπί z dopełniaczem oddano jako „na”.
theological_decisions:
- issue: Zakres frazy porównawczej ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: W tekście głównym fraza „jak w niebie, tak i na ziemi” łączy się bezpośrednio z prośbą „niech się spełni Twoja wola”.
  alternative: 'Fraza może odnosić się łącznie do obu próśb: o przyjście królestwa i o spełnienie woli Boga.'
  rationale: Najbliższym składniowo odniesieniem jest druga prośba, lecz interpunkcja współczesnych wydań greckich ma charakter redakcyjny, a szerszy zakres pozostaje możliwy. Przypis zachowuje tę autentyczną niejednoznaczność.
translation_notes:
  register: Współczesny, godny rejestr modlitewny. Wielka litera w zaimku „Twoje/Twoja” wyraża polską konwencję grzecznościowo-religijną, nie dodając treści do greki. Średnik zachowuje równoległość dwóch próśb, a konstrukcja „jak..., tak i...” naturalnie oddaje greckie porównanie.
