id: MAT.6.24
reference: Matthew 6:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: pl
  text: Nikt nie może służyć dwóm panom, bo albo jednego będzie nienawidził, a drugiego kochał, albo do jednego przylgnie, a drugim wzgardzi. Nie możecie służyć Bogu i mamonie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „bogactwu” albo „pieniądzom”. Grecki wyraz „mamona” jest zapożyczeniem i może uosabiać bogactwo jako rywalizującego pana.'
    reason: Alternatywy leksykalne objaśniają znaczenie zapożyczenia, a zarazem wskazują na jego możliwą funkcję personifikującą.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Nikt
  rationale: Naturalny i pełny polski odpowiednik powszechnego przeczenia odnoszącego się do osoby.
- source_word: δύναται / δύνασθε
  choice: nie może / nie możecie
  rationale: Polski czasownik modalny jasno oddaje brak możliwości i zachowuje zmianę z trzeciej osoby liczby pojedynczej na drugą osobę liczby mnogiej.
- source_word: δυσὶ κυρίοις
  choice: dwóm panom
  rationale: W kontekście służby zależnej κύριος oznacza pana sprawującego władzę nad sługą; „panom” zachowuje tę relację i nie sugeruje dwóch boskich tytułów.
- source_word: δουλεύειν
  choice: służyć
  rationale: To idiomatyczne polskie określenie służby panom; zależnościowy, niemal niewolniczy odcień wynika z zestawienia z „panami”.
- source_word: μισήσει
  choice: będzie nienawidził
  rationale: Zachowuje mocne, dosłowne przeciwstawienie wobec miłości, bez łagodzenia go do znaczenia „mniej kochać”.
- source_word: ἀγαπήσει
  choice: będzie kochał
  rationale: Bezpośrednio oddaje czasownik miłości i zachowuje antytezę z nienawiścią.
- source_word: ἑνὸς ἀνθέξεται
  choice: do jednego przylgnie
  rationale: Oddaje ideę mocnego uchwycenia się jednej osoby, trwania przy niej i lojalnego przywiązania.
- source_word: καταφρονήσει
  choice: drugim wzgardzi
  rationale: „Wzgardzi” zwięźle wyraża potraktowanie kogoś z pogardą i odpowiada podniosłemu, sentencjonalnemu rejestrowi wypowiedzi.
- source_word: θεῷ
  choice: Bogu
  rationale: Standardowy polski odpowiednik celownika po czasowniku „służyć”.
- source_word: μαμωνᾷ
  choice: mamonie
  rationale: Zachowanie zapożyczonego określenia podtrzymuje retoryczne uosobienie bogactwa jako konkurencyjnego pana; znaczenie objaśnia przypis.
theological_decisions:
- issue: Znaczenie κύριος w społecznym obrazie służby
  choice: panom
  alternative: władcom
  rationale: Liczba mnoga i czasownik δουλεύειν wskazują na panów, którym podlega sługa. „Panom” zachowuje obraz zależności bez utożsamiania ich z boskim tytułem.
- issue: Oddanie μαμωνᾶς
  choice: mamona
  alternative: bogactwo / pieniądze
  rationale: Wypowiedź przedstawia Boga i mamonę jako konkurencyjne obiekty służby. Zapożyczenie zachowuje to zamierzone uosobienie, podczas gdy „bogactwo” lub „pieniądze” wyjaśnia sens, ale osłabia obraz rywalizującego pana.
- issue: Siła przeciwstawienia μισεῖν i ἀγαπᾶν
  choice: nienawidzić i kochać
  alternative: kochać mniej i kochać
  rationale: Grecki tekst tworzy mocną antytezę, dodatkowo równoległą do przylgnięcia i wzgardzenia. Nie należy bez wyraźnej konieczności łagodzić jej do porównania stopnia miłości.
translation_notes:
  register: Język współczesny, zwięzły i godny. Paralelna budowa zdania oraz mocne kontrasty zostały zachowane. „Przylgnie” i „wzgardzi” są powszechnie zrozumiałe, a jednocześnie utrzymują sentencjonalny ton wypowiedzi.
