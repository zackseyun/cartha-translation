  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: pl
  text: 'Nie martwcie się więc[a], mówiąc: „Co będziemy jeść?”, albo: „Co będziemy pić?”, albo: „W co się ubierzemy?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie troszczcie się”.'
    reason: Alternatywny odpowiednik leksykalny czasownika μεριμνάω.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Dlatego nie martwcie się
  rationale: Czasownik μεριμνάω oznacza tu pełną niepokoju troskę o podstawowe potrzeby. „Nie martwcie się” jest naturalnym współczesnym polskim odpowiednikiem, a „dlatego” oddaje wnioskowe οὖν i łączy nakaz z poprzedzającym wywodem.
- source_word: λέγοντες
  choice: i nie mówcie
  rationale: Imiesłów określa sposób, w jaki wyraża się zamartwianie. W polszczyźnie konstrukcja współrzędna naturalnie zachowuje związek z zakazem i prowadzi do pytań w mowie niezależnej.
- source_word: Τί φάγωμεν;
  choice: Co będziemy jeść?
  rationale: Deliberatywny aoryst trybu łączącego wyraża zatroskane pytanie o przyszłe zaopatrzenie; polski czas przyszły oddaje je naturalnie.
- source_word: Τί πίωμεν;
  choice: Co będziemy pić?
  rationale: Tak jak w pytaniu o jedzenie, forma deliberatywna dotyczy przyszłego zaspokojenia podstawowej potrzeby.
- source_word: Τί περιβαλώμεθα;
  choice: W co się ubierzemy?
  rationale: περιβάλλω w tym kontekście odnosi się do nakładania odzieży. „W co się ubierzemy?” jest idiomatyczne i zachowuje zwrotny charakter formy greckiej.
- source_word: ἤ ... ἤ
  choice: albo
  rationale: Spójnik zachowuje rozłączny charakter wyliczenia; w naturalnej polszczyźnie pierwsze dwa pytania można zestawić bezspójnikowo, a ostatnie wprowadzić przez „albo”.
theological_decisions:
- issue: Zakres zakazu dotyczącego potrzeb materialnych
  choice: Zakaz pełnego niepokoju zamartwiania się
  alternative: Całkowity zakaz wszelkiej troski lub roztropnego planowania
  rationale: Najbliższy kontekst dotyczy lęku o zapewnienie jedzenia, picia i odzieży. „Nie martwcie się” nie rozszerza wypowiedzi na zakaz odpowiedzialnego przewidywania.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Powtórzone pytania zachowują retoryczny rytm wypowiedzi Jezusa; zastosowano polskie cudzysłowy i klarowną składnię.
