  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: pl
  text: Jeśli jednak nie przebaczycie ludziom, wasz Ojciec także nie przebaczy waszych przewinień.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Jeśli jednak nie
  rationale: ἐάν wprowadza warunek, μή go neguje, a δέ zaznacza kontrast z poprzednim zdaniem. Szyk „Jeśli jednak nie” jest naturalny po polsku i zachowuje tę relację.
- source_word: ἀφῆτε
  choice: przebaczycie
  rationale: W kontekście win między ludźmi ἀφίημι oznacza „przebaczyć”. Czasownik ten zostaje oddany tak samo w obu częściach wersetu, by zachować jego powtórzenie.
- source_word: τοῖς ἀνθρώποις
  choice: ludziom
  rationale: ἄνθρωποι odnosi się tu ogólnie do ludzi, a nie wyłącznie do mężczyzn. „Ludziom” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: οὐδὲ
  choice: również ... nie
  rationale: οὐδέ wiąże negatywny skutek z negatywnym warunkiem. Polska konstrukcja „również ... nie” naturalnie oddaje sens „także nie / ani” bez niezręczności.
- source_word: ὁ πατὴρ ὑμῶν
  choice: wasz Ojciec
  rationale: Tekst grecki mówi jedynie „wasz Ojciec”; nie dodano określenia „niebieski”, którego w tym wersecie brak.
- source_word: ἀφήσει
  choice: przebaczy
  rationale: Powtórzenie tego samego polskiego czasownika zachowuje paralelizm z ἀφῆτε i wzajemną strukturę wypowiedzi.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: waszych przewinień
  rationale: παράπτωμα oznacza uchybienie, występek lub przekroczenie. „Przewinienia” brzmią współcześnie i godnie, zachowując moralny ciężar wyrażenia bez archaizującego „win” czy mniej naturalnego „wykroczeń” w tym kontekście.
theological_decisions:
- issue: Warunkowa zależność między przebaczaniem ludziom a przebaczeniem Ojca
  choice: Zachowano bezpośrednią konstrukcję warunkową bez jej łagodzenia lub objaśniania w samym tekście.
  alternative: Ująć brak ludzkiego przebaczenia jedynie jako dowód braku wcześniejszego przebaczenia albo ograniczyć skutek do utraty społeczności z Bogiem.
  rationale: Greka formułuje prosty warunek i wynik. Przekład powinien zachować wynikające z niego napięcie teologiczne, zamiast rozstrzygać je za pomocą parafrazy.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Zachowano zwięzłość, paralelizm obu członów oraz bezpośredniość ostrzeżenia. Werset nie wymaga przypisu, ponieważ „przewinienia” jasno oddają zakres znaczeniowy παραπτώματα.
