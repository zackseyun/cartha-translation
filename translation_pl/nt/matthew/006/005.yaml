id: MAT.6.5
reference: Matthew 6:5
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: pl
  text: 'A ilekroć się modlicie, nie bądźcie jak obłudnicy. Lubią bowiem modlić się, stojąc w synagogach i na rogach szerokich ulic[a], aby ludzie ich widzieli. Zaprawdę mówię wam: odebrali już całą swoją zapłatę[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „na rogach ulic”. Grecki tekst mówi dosłowniej o rogach szerokich ulic lub publicznych traktów.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „mają swoją zapłatę” albo „otrzymali swoją zapłatę”. Użyty czasownik może należeć do języka rozliczeń i sugerować odebranie należności w całości.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: ilekroć się modlicie
  rationale: 'Oddaje nieokreślony, powtarzalny charakter sytuacji: chodzi o każdą okazję do modlitwy, nie o pojedyncze wydarzenie.'
- source_word: οὐκ ἔσεσθε ὡς
  choice: nie bądźcie jak
  rationale: Grecki futurum ma tutaj moc zakazu lub pouczenia. Polski tryb rozkazujący brzmi naturalnie i jasno przekazuje tę funkcję.
- source_word: ὑποκριταί
  choice: obłudnicy
  rationale: To utrwalony i kontekstowo trafny odpowiednik osób, które wystawiają pobożność na pokaz.
- source_word: φιλοῦσιν
  choice: lubią
  rationale: Wskazuje na upodobanie w opisanym publicznym zachowaniu; w tym zdaniu jest naturalniejsze po polsku niż bardziej emocjonalne „kochają”.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: w synagogach
  rationale: Zachowuje historyczną i religijną konkretność żydowskiego kontekstu.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: na rogach szerokich ulic
  rationale: Blisko oddaje obraz rogów szerokich ulic lub publicznych ciągów komunikacyjnych, zamiast redukować go do ogólnego „na ulicach”.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: modlić się, stojąc
  rationale: Zachowuje stanie jako okoliczność modlitwy, nie sugerując, że sama stojąca postawa jest przedmiotem krytyki.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: aby ludzie ich widzieli
  rationale: Naturalnie oddaje konstrukcję celu oraz bierny sens bycia widzianym; ἀνθρώποις odnosi się ogólnie do ludzi.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Zachowuje uroczystą, charakterystyczną formułę Jezusa, a zarazem pozostaje zrozumiałe we współczesnej polszczyźnie.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: odebrali już całą swoją zapłatę
  rationale: 'Oddaje handlowy odcień ἀπέχω: otrzymać należność, nierzadko z implikacją pełnego rozliczenia. „Zapłata” zachowuje zarówno sens wynagrodzenia, jak i moralną ironię wypowiedzi.'
theological_decisions:
- issue: Charakter krytykowanej modlitwy
  choice: 'Krytyce podlega cel: bycie widzianym przez ludzi'
  alternative: Krytyce podlega publiczna modlitwa albo stojąca postawa jako taka
  rationale: Składnia zdania wiąże naganę z zamiarem pokazania się ludziom. Przekład nie rozszerza zakazu na każdą publiczną modlitwę ani na modlitwę w pozycji stojącej.
- issue: Zakres zapłaty obłudników
  choice: odebrali już całą swoją zapłatę
  alternative: mają swoją zapłatę
  rationale: Sformułowanie uwydatnia możliwy idiom rozliczeniowy czasownika ἀπέχουσι, ale przypis zachowuje mniej interpretacyjne odczytanie i nie rozwija dalszych wniosków doktrynalnych.
- issue: Ogólny sens τοῖς ἀνθρώποις
  choice: ludzie
  alternative: mężczyźni
  rationale: W tym kontekście rzeczownik oznacza obserwatorów będących ludźmi ogólnie, a nie wyłącznie osoby płci męskiej.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Zaprawdę” zachowano jako rozpoznawalną uroczystą formułę, natomiast pozostałą składnię ukształtowano naturalnie po polsku. Przecinki wokół „stojąc” zapobiegają odczytaniu, jakoby krytyka dotyczyła samej postawy ciała.
