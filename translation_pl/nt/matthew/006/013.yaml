  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: pl
  text: I nie wystawiaj nas na próbę[a], ale wybaw nas od Złego[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „na pokusę”. Greckie słowo może oznaczać próbę, doświadczenie albo pokusę.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „od zła”. Greckie wyrażenie może odnosić się osobowo do Złego albo bezosobowo do zła.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: nie wystawiaj
  rationale: Dosłownie czasownik oznacza „nie wprowadź/nie wwiedź”. W naturalnej współczesnej polszczyźnie modlitewnej „nie wystawiaj nas na próbę” oddaje prośbę bez interpretacyjnego dodatku „nie dopuść”.
- source_word: πειρασμόν
  choice: próbę
  rationale: πειρασμός może oznaczać zarówno próbę/doświadczenie, jak i pokusę. „Próba” zachowuje szerszy zakres znaczeniowy, a możliwość sensu „pokusa” podano w przypisie.
- source_word: ῥῦσαι
  choice: wybaw
  rationale: Tryb rozkazujący wyraża prośbę o czynne ocalenie. „Wybaw” jest naturalne, podniosłe i utrwalone w polskim języku modlitwy.
- source_word: τοῦ πονηροῦ
  choice: od Złego
  rationale: Forma z rodzajnikiem może być rodzaju męskiego („Zły”) albo nijakiego („zło”). Tekst główny przyjmuje sens osobowy, a rzeczywistą dwuznaczność zachowuje przypis.
theological_decisions:
- issue: Znaczenie τοῦ πονηροῦ
  choice: od Złego
  alternative: od zła
  rationale: Grecka postać jest gramatycznie niejednoznaczna i może wskazywać na osobowego przeciwnika albo na zło w sensie bezosobowym. Sens osobowy dobrze odpowiada rodzajnikowi i kontekstowi, lecz alternatywy nie należy usuwać.
- issue: Znaczenie πειρασμός
  choice: próba
  alternative: pokusa
  rationale: Słowo obejmuje doświadczenie wystawiające człowieka na próbę, a zależnie od kontekstu również pokusę do grzechu. Przekład główny zachowuje szerszy sens, zaś przypis wskazuje tradycyjną alternatywę.
translation_notes:
  register: Współczesna, godna polszczyzna modlitewna. Zachowano zwięzłość i paralelny rytm dwóch próśb, unikając zarówno archaicznego „nie wódź”, jak i interpretacyjnej parafrazy „nie dopuść, abyśmy ulegli”.
