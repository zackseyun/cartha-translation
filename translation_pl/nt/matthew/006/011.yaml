  text: Give us today our daily bread[a].
translation:
  language: pl
  text: Daj nam dzisiaj naszego powszedniego chleba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „chleba na dzisiaj”, „chleba na nadchodzący dzień” albo „chleba, którego potrzebujemy”. Grecki przymiotnik ἐπιούσιον jest rzadki, a jego dokładne znaczenie pozostaje przedmiotem dyskusji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: naszego chleba
  rationale: Ἄρτος oznacza dosłownie „chleb” i zachowuje konkretny obraz pożywienia; zaimek ἡμῶν oddano naturalnym polskim zaimkiem dzierżawczym.
- source_word: τὸν ἐπιούσιον
  choice: powszedniego
  rationale: Rzadki przymiotnik ἐπιούσιος ma niepewne znaczenie. Tradycyjne i nadal zrozumiałe „powszedni” zwięźle wyraża codzienną potrzebę, ale możliwe znaczenia podano w przypisie.
- source_word: δὸς ἡμῖν
  choice: Daj nam
  rationale: Bezpośrednio i naturalnie oddaje imperatyw aorystu δὸς oraz celownik ἡμῖν.
- source_word: σήμερον
  choice: dzisiaj
  rationale: Współczesny, naturalny odpowiednik σήμερον, zachowujący wyraźne odniesienie do obecnego dnia.
theological_decisions:
- issue: Znaczenie ἐπιούσιον w Modlitwie Pańskiej
  choice: powszedniego
  alternative: na dzisiaj; na nadchodzący dzień; potrzebnego do życia
  rationale: Znaczenie przymiotnika pozostaje sporne. Tekst główny zachowuje utrwalone i zrozumiałe sformułowanie modlitewne, natomiast przypis ujawnia rzeczywistą niepewność leksykalną, nie rozstrzygając jej doktrynalnie.
translation_notes:
  register: Współczesny, godny rejestr modlitewny. Zachowano tradycyjne „chleb powszedni”, lecz zastosowano naturalne dziś „dzisiaj” zamiast archaizującego „dnia dzisiejszego”.
