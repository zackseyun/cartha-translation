id: MAT.6.1
reference: Matthew 6:1
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: pl
  text: Strzeżcie się, aby nie praktykować swojej sprawiedliwości przed ludźmi po to, żeby ludzie was widzieli[a]. W przeciwnym razie nie macie nagrody od waszego Ojca, który jest w niebiosach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „waszych uczynków sprawiedliwości”. Wariant tekstowy ma: „jałmużny”.'
    reason: Zachowuje szeroki sens δικαιοσύνη, a zarazem odnotowuje wariant ἐλεημοσύνην.
  - marker: b
    text: 'Dosłownie: „w niebiosach”; grecki rzeczownik występuje w liczbie mnogiej.'
    reason: Wyjaśnia zachowaną w przekładzie grecką liczbę mnogą.
lexical_decisions:
- source_word: Προσέχετε
  choice: Uważajcie
  rationale: Czas teraźniejszy trybu rozkazującego w liczbie mnogiej wzywa do stałej czujności; „Uważajcie” zachowuje siłę ostrzeżenia i brzmi naturalnie.
- source_word: δὲ
  choice: bez osobnego odpowiednika
  rationale: Partykuła sygnalizuje przejście lub lekki kontrast. W polszczyźnie na początku tego zdania jej jawne oddanie jako „ale” byłoby mniej naturalne, a funkcję przejścia zachowuje samo ostrzeżenie.
- source_word: δικαιοσύνην
  choice: sprawiedliwości
  rationale: Podstawowy sens rzeczownika pozostaje szeroki i obejmuje sprawiedliwe, pobożne postępowanie; nie zawężono go w tekście głównym do jałmużny. Konkretniejsze możliwości podano w przypisie.
- source_word: μὴ ποιεῖν
  choice: żeby nie czynić
  rationale: Konstrukcja zależna od czasownika ostrzegania określa działanie, którego należy unikać. „Czynić sprawiedliwość” zachowuje zwięzłość i formalne napięcie greckiego wyrażenia.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: przed ludźmi
  rationale: Wyrażenie odnosi się ogólnie do ludzkich obserwatorów; „ludźmi” jest w polszczyźnie znaczeniowo trafne i naturalne.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: po to, by was widzieli
  rationale: Konstrukcja wyraża cel działania. Polska strona czynna brzmi naturalniej niż „być przez nich widzianymi”, zachowując sens zamierzonego publicznego pokazu.
- source_word: εἰ δὲ μή γε
  choice: W przeciwnym razie
  rationale: Idiomaticznie i jasno oddaje warunkowe ostrzeżenie oraz wynikającą z niego konsekwencję.
- source_word: μισθὸν
  choice: nagrody
  rationale: W kontekście odpłaty od Boga „nagroda” jest najbardziej naturalnym polskim odpowiednikiem i nie sugeruje zwykłej zapłaty pracowniczej.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: u waszego Ojca
  rationale: Παρά z celownikiem może wskazywać obecność lub sferę, w której nagroda jest dostępna. „U waszego Ojca” zachowuje tę konstrukcyjną niejednoznaczność lepiej niż jednoznaczne „od Ojca”.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: który jest w niebiosach
  rationale: Oddano grecką liczbę mnogą oraz względny charakter określenia Ojca; sformułowanie pozostaje zrozumiałe i dostojne.
theological_decisions:
- issue: Zakres znaczeniowy δικαιοσύνην
  choice: szeroko rozumiana „sprawiedliwość”, czyli sprawiedliwe lub pobożne postępowanie
  alternative: uczynki sprawiedliwości; jałmużna
  rationale: Tekst SBLGNT ma δικαιοσύνην, które naturalnie ma zakres szerszy niż jałmużna. Nie rozstrzygnięto napięcia przez zawężenie tekstu głównego; możliwości konkretniejsze oraz wariant rękopiśmienny zachowano w przypisie.
- issue: Relacja nagrody do Ojca w παρὰ τῷ πατρὶ ὑμῶν
  choice: „u waszego Ojca”
  alternative: „od waszego Ojca”
  rationale: Grecka konstrukcja z celownikiem dopuszcza odcień obecności lub pozostawania nagrody u Ojca, choć kontekst może wskazywać na Ojca jako jej źródło. Tekst główny zachowuje formalną niejednoznaczność.
- issue: Liczba mnoga τοῖς οὐρανοῖς
  choice: „w niebiosach”
  alternative: „w niebie”
  rationale: Liczba mnoga odzwierciedla greckie brzmienie i styl Mateusza, nie wprowadzając dodatkowego twierdzenia doktrynalnego.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Zachowano szerokie i nieco formalne wyrażenie „czynić sprawiedliwość”, aby nie zawężać sensu do jałmużny. Konstrukcja „po to, by was widzieli” jest naturalniejsza po polsku od ciężkiej strony biernej. Wszystkie znaczniki przypisów występują w tekście głównym.
