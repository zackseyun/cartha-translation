id: MAT.6.3
reference: Matthew 6:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: pl
  text: Lecz gdy dajesz potrzebującym[a], niech twoja lewa ręka nie wie, co robi prawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dajesz jałmużnę”; grecki termin oznacza dobroczynne wsparcie udzielane ubogim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Lecz gdy dajesz
  rationale: Konstrukcja genetivus absolutus z δέ przeciwstawia tę sytuację postępowaniu opisanemu wcześniej. W połączeniu z ἐλεημοσύνην czasownik ποιέω odnosi się do udzielania pomocy materialnej, dlatego naturalne polskie „gdy dajesz” trafnie oddaje sens.
- source_word: ἐλεημοσύνην
  choice: potrzebującym
  rationale: Termin oznacza jałmużnę lub dobroczynne wsparcie ubogich. „Dajesz potrzebującym” jest jasne we współczesnej polszczyźnie, natomiast przypis zachowuje formalną alternatywę „dajesz jałmużnę”.
- source_word: μὴ γνώτω
  choice: niech ... nie wie
  rationale: Przeczący imperatyw trzeciej osoby zachowano w naturalnej polskiej konstrukcji „niech nie wie”, podtrzymującej personifikację ręki.
- source_word: ἡ ἀριστερά σου
  choice: twoja lewa ręka
  rationale: Dosłowne tłumaczenie zachowuje wyrazisty obraz i paralelizm wypowiedzi.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: co robi prawa
  rationale: Czas teraźniejszy ποιεῖ oddano przez „robi”. Pominięcie powtórzonego rzeczownika „ręka” jest naturalne po polsku, a znaczenie pozostaje jednoznaczne.
theological_decisions:
- issue: Znaczenie obrazu lewej i prawej ręki
  choice: Zachować metaforę jako dobitne wezwanie do dyskrecji i wolności od ostentacji przy udzielaniu pomocy.
  alternative: Oddać ją interpretacyjnie jako ogólne wezwanie do pokory albo jako bezwzględny zakaz wszelkiej publicznej dobroczynności.
  rationale: Tekst posługuje się personifikacją i hiperbolicznym obrazem. Zachowanie go bez objaśniającej parafrazy nie rozstrzyga ponad tekst, czy chodzi o absolutny zakaz jawnej pomocy, lecz utrzymuje nacisk na brak samopokazu.
translation_notes:
  register: Współczesny, prosty i godny rejestr. „Lecz” wyraża kontrast obecny w δέ, a tradycyjny obraz obu rąk pozostaje nienaruszony. Przecinek na końcu odpowiada temu, że zdanie trwa dalej w następnym wersecie.
