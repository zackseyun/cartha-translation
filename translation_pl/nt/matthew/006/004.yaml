  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: pl
  text: aby to, co dajesz ubogim[a], pozostawało w ukryciu. A twój Ojciec, który widzi w ukryciu, wynagrodzi cię[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „aby twoja jałmużna pozostawała w ukryciu”. Grecki termin oznacza dar przeznaczony dla ubogich.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „odpłaci ci”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: aby … pozostawało
  rationale: Konstrukcja celowa z trybem łączącym łączy ten werset z poprzednim nakazem. „Aby” zachowuje sens celu, a „pozostawało” naturalnie oddaje trwanie w ukryciu.
- source_word: ἐλεημοσύνη
  choice: to, co dajesz ubogim
  rationale: Grecki rzeczownik oznacza konkretnie jałmużnę, czyli dar dla potrzebujących, a nie ogólnie miłosierdzie. Opisowe sformułowanie jest jasne we współczesnej polszczyźnie i nie zawęża daru do określonej formy.
- source_word: ἐν τῷ κρυπτῷ
  choice: w ukryciu
  rationale: Sformułowanie zachowuje zwięzłość greckiego idiomu i jego celowe powtórzenie w obu częściach wersetu.
- source_word: ὁ πατήρ σου
  choice: twój Ojciec
  rationale: Tekst grecki mówi po prostu „twój Ojciec”; nie dodano określenia „niebieski”, występującego w innych miejscach.
- source_word: ὁ βλέπων
  choice: który widzi
  rationale: Imiesłów z rodzajnikiem naturalnie oddano zdaniem względnym, bez dopowiadania przedmiotu widzenia.
- source_word: ἀποδώσει σοι
  choice: wynagrodzi cię
  rationale: W tym kontekście czasownik oznacza przychylną odpłatę Boga za ukryte dobro. Przekład nie określa rodzaju ani czasu nagrody.
theological_decisions:
- issue: Charakter Bożej odpłaty wyrażonej przez ἀποδώσει
  choice: wynagrodzi cię
  alternative: odpłaci ci
  rationale: „Wynagrodzi” jasno przekazuje pozytywny sens obietnicy, lecz nie rozstrzyga, czy nagroda jest doczesna czy wieczna, materialna czy duchowa. Alternatywa „odpłaci” mocniej zachowuje ogólną ideę odwzajemnienia.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano powtórzenie „w ukryciu” oraz nie dodano informacji o sposobie, czasie ani rodzaju Bożej nagrody.
