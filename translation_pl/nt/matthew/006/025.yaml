id: MAT.6.25
reference: Matthew 6:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: pl
  text: 'Dlatego mówię wam: nie martwcie się o swoje życie[a], o to, co będziecie jeść, ani o swoje ciało, o to, w co się ubierzecie. Czy życie nie jest czymś więcej niż pokarm, a ciało czymś więcej niż ubranie?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „duszę”. Greckie ψυχή może oznaczać duszę lub życie; kontekst jedzenia przemawia tutaj za znaczeniem „życie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dlatego
  rationale: Naturalnie wyraża wniosek wynikający z poprzedzającego nauczania i zachowuje logiczne powiązanie.
- source_word: μεριμνᾶτε
  choice: nie martwcie się
  rationale: Oddaje zakaz pełnego lęku, uporczywego zamartwiania się; jest naturalne i zrozumiałe we współczesnej polszczyźnie.
- source_word: ψυχῇ / ψυχὴ
  choice: życie
  rationale: Kontekst jedzenia i podtrzymywania egzystencji wskazuje tu na życie, nie zaś szczególnie na niematerialną duszę.
- source_word: τί φάγητε
  choice: o to, co będziecie jeść
  rationale: Tryb łączący w pytaniu zależnym wyraża przyszły przedmiot troski; forma przyszła jest naturalna po polsku.
- source_word: σώματι / σῶμα
  choice: ciało
  rationale: Chodzi o fizyczne ciało zestawione z ubraniem.
- source_word: τί ἐνδύσησθε
  choice: o to, w co się ubierzecie
  rationale: Naturalny polski odpowiednik czynności przyodziewania się, zachowujący przyszłe odniesienie.
- source_word: οὐχὶ
  choice: Czy ... nie jest
  rationale: Wprowadza pytanie retoryczne, które oczekuje odpowiedzi twierdzącej.
- source_word: πλεῖόν
  choice: czymś więcej niż
  rationale: Oddaje porównanie znaczenia i wartości bez zawężania go wyłącznie do wartości materialnej.
- source_word: τροφῆς
  choice: pokarm
  rationale: Dostojny, lecz nadal powszechnie zrozumiały odpowiednik tego, co podtrzymuje życie.
- source_word: ἐνδύματος
  choice: ubranie
  rationale: Ogólne, współczesne określenie odzieży, naturalniejsze w tym zdaniu niż pojedyncza „szata”.
theological_decisions:
- issue: Znaczenie ψυχή w nauczaniu Jezusa
  choice: życie
  alternative: dusza
  rationale: Bezpośredni kontekst dotyczy jedzenia i potrzeb materialnych, dlatego ψυχή oznacza tutaj życie człowieka. Wybór ten nie narzuca antropologicznego rozróżnienia między ciałem a niematerialną duszą.
translation_notes:
  register: Współczesna, naturalna i godna polszczyzna. Zachowano retoryczne pytanie oraz paralelę między życiem i pokarmem a ciałem i ubraniem.
