  source_fidelity: 'Przekład wiernie oddaje wszystkie główne elementy greckiego zdania: łagodne δέ („A”), zwrot do odbiorców, emfatyczne οὐδέ („nawet ... nie”), imię Salomon, królewską δόξα jako „przepych”, obraz bycia ubranym oraz porównanie do pojedynczego elementu wskazywanej grupy. Dodane „kwiatów” trafnie doprecyzowuje elipsę na podstawie bezpośredniego kontekstu lilii i nie narzuca konkretnego gatunku.'
