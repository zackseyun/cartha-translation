id: MAT.6.29
reference: Matthew 6:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: pl
  text: A mówię wam, że nawet Salomon w całym swoim przepychu nie był ubrany jak jeden z tych kwiatów.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „jak jeden z tych”.'
    reason: W tekście greckim rzeczownik jest domyślny; „kwiatów” dodano dla jasności na podstawie bezpośredniego kontekstu.
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: A mówię wam
  rationale: Czasownik λέγω z celownikiem ὑμῖν naturalnie oddaje się jako „mówię wam”. Partykuła δέ łagodnie rozwija lub przeciwstawia poprzednią myśl; polskie „A” zachowuje płynność wywodu bez nadmiernie ostrego kontrastu.
- source_word: οὐδὲ
  choice: nawet ... nie
  rationale: 'Ta naturalna polska konstrukcja zachowuje emfatyczne przeczenie: nawet Salomon nie dorównywał kwiatom.'
- source_word: Σολομὼν
  choice: Salomon
  rationale: Zastosowano utrwaloną polską formę imienia.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: w całym swoim przepychu
  rationale: W tym kontekście δόξα oznacza królewską okazałość i wspaniałość. „Przepych” jasno przekazuje ziemski, królewski charakter porównania.
- source_word: περιεβάλετο
  choice: był ubrany
  rationale: Forma czasownika περιβάλλω oznacza tutaj bycie odzianym lub ubranym. Sformułowanie „był ubrany” jest współczesne, naturalne i zachowuje obraz odzienia z kontekstu.
- source_word: ὡς ἓν τούτων
  choice: jak jeden z tych kwiatów
  rationale: Grecki tekst dosłownie mówi „jak jeden z tych”. Dodanie rzeczownika „kwiatów” jasno wskazuje odniesienie do roślin z bezpośredniego kontekstu, zachowując pojedynczy element porównania wyrażony przez ἓν.
theological_decisions:
- issue: Znaczenie δόξα w odniesieniu do Salomona
  choice: przepych
  alternative: chwała; wspaniałość
  rationale: Kontekst dotyczy królewskiej okazałości Salomona zestawionej z tym, jak Bóg przyodziewa kwiaty. „Przepych” nie sugeruje tutaj boskiej chwały, a zarazem zachowuje siłę porównania.
- issue: Domyślny rzeczownik w wyrażeniu „ἓν τούτων”
  choice: jeden z tych kwiatów
  alternative: jeden z nich; jedno z nich
  rationale: Rodzaj nijaki ἓν odpowiada domyślnemu określeniu rośliny lub kwiatu z poprzedniego wersetu. Jawne „kwiatów” ułatwia zrozumienie i nie rozstrzyga kwestii konkretnego gatunku rośliny.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie zachowuje retoryczny kontrast oraz obraz królewskiego stroju, unikając archaicznego „przyodziany” i możliwie teologizującej w tym miejscu „chwały”.
