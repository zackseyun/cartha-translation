id: MAT.6.21
reference: Matthew 6:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: pl
  text: Bo gdzie jest twój skarb, tam będzie też twoje serce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: gdzie
  rationale: Naturalnie wprowadza zdanie względne określające miejsce i zachowuje korelację „gdzie… tam”.
- source_word: γάρ
  choice: bo
  rationale: Zachowuje wyjaśniający związek z poprzednią nauką o gromadzeniu skarbów; „bo” jest naturalne we współczesnej polszczyźnie.
- source_word: θησαυρός
  choice: skarb
  rationale: Standardowy odpowiednik, zachowujący zarówno dosłowny, jak i metaforyczny sens rzeczownika.
- source_word: σου
  choice: twój / twoje
  rationale: Oddaje relację posiadania przy rzeczownikach „skarb” i „serce”, z formami dostosowanymi do ich rodzaju gramatycznego.
- source_word: ἐκεῖ
  choice: tam
  rationale: 'Tworzy zwięzłą i naturalną korelację z ὅπου: „gdzie… tam”.'
- source_word: ἔσται
  choice: będzie
  rationale: Zachowuje czas przyszły greckiego czasownika εἰμί, nie sprowadzając wypowiedzi do bezczasowego stwierdzenia w czasie teraźniejszym.
- source_word: καρδία
  choice: serce
  rationale: Utrwalony i zakresowo trafny odpowiednik, obejmujący pragnienia, lojalność i wewnętrzne ukierunkowanie człowieka.
- source_word: καὶ
  choice: też
  rationale: Naturalnie oddaje sens addytywny i łączy położenie serca z położeniem skarbu.
theological_decisions:
- issue: Czasowa wartość ἔσται w sentencji o charakterze mądrościowym
  choice: 'Zachowanie czasu przyszłego: „będzie”'
  alternative: 'Czas teraźniejszy: „jest”, wyrażający ogólną, bezczasową zasadę'
  rationale: Tekst grecki ma formę przyszłą. Jej zachowanie pozwala wyrazić nie tylko odpowiedniość między skarbem a sercem, lecz także ukierunkowanie serca ku temu, w czym człowiek lokuje swój skarb, bez narzucania dodatkowej interpretacji doktrynalnej.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano zwięzły paralelizm oryginału „gdzie… tam” oraz wyraźny czas przyszły.
