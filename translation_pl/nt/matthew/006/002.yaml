id: MAT.6.2
reference: Matthew 6:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: pl
  text: 'Dlatego gdy dajesz jałmużnę[a], nie trąb przed sobą[b], jak obłudnicy czynią w synagogach i na ulicach, aby ludzie ich otaczali chwałą[c]. Zaprawdę mówię wam: otrzymali już całą swoją zapłatę[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „wspierasz potrzebujących” albo „spełniasz uczynki miłosierdzia”. Greckie wyrażenie odnosi się do dobroczynnego dawania ubogim.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „nie zatrąb przed sobą”. Obraz może być hiperboliczny lub metaforyczny.'
    reason: lexical_alternative
  - marker: c
    text: 'Można też: „aby ludzie ich chwalili” lub „okazywali im uznanie”. Grecki czasownik dosłownie wiąże się z otaczaniem chwałą.'
    reason: lexical_alternative
  - marker: d
    text: 'Greckie wyrażenie ma charakter handlowy: oznacza pokwitowanie pełnej należności, a więc otrzymanie całej zapłaty bez perspektywy dalszej.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Dlatego gdy
  rationale: „Dlatego” zachowuje wynikowe lub kontynuacyjne znaczenie οὖν, a „gdy” z czasownikiem w czasie teraźniejszym naturalnie wyraża ogólną, powtarzalną okoliczność w języku polskim.
- source_word: ποιῇς ἐλεημοσύνην
  choice: dajesz jałmużnę
  rationale: Grecki idiom oznacza dobroczynne wsparcie potrzebujących. „Dawać jałmużnę” jest zwięzłe, precyzyjne i nadal zrozumiałe we współczesnej polszczyźnie.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: nie trąb przed sobą
  rationale: Zachowano dosłowny, wyrazisty obraz trąbienia oraz naturalną polską formę zwrotną odpowiadającą ἔμπροσθέν σου, bez rozstrzygania, czy wypowiedź jest hiperbolą, czy metaforą.
- source_word: οἱ ὑποκριταί
  choice: obłudnicy
  rationale: „Obłudnicy” to utrwalony i kontekstowo trafny odpowiednik osób odgrywających pobożność na pokaz.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: w synagogach i na ulicach
  rationale: Nazwy miejsc oddano bezpośrednio i naturalnie; ῥύμαι może oznaczać ulice lub zaułki, lecz w tym kontekście ogólne „ulice” najlepiej wskazuje przestrzeń publiczną.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: aby ludzie ich otaczali chwałą
  rationale: Konstrukcja czynna brzmi naturalniej po polsku, zachowuje cel ὅπως i mocne znaczenie δοξάζω, a „ludzie” trafnie oddaje rodzajowo ogólne ἀνθρώπων.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Utrwalona, godna i bezpośrednia formuła zachowująca uroczystą moc ἀμήν.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: otrzymali już całą swoją zapłatę
  rationale: ἀπέχω jest tu idiomem handlowym oznaczającym otrzymanie należności w całości. „Zapłata” zachowuje ekonomiczny odcień μισθός i wskazuje, że nic więcej im się nie należy.
theological_decisions:
- issue: Ogólne znaczenie ἀνθρώπων
  choice: ludzie
  alternative: mężczyźni; inni
  rationale: Rzeczownik odnosi się ogólnie do ludzkich obserwatorów, nie wyłącznie do osób płci męskiej.
- issue: Siła czasownika δοξασθῶσιν
  choice: aby ludzie ich otaczali chwałą
  alternative: aby ludzie ich chwalili; aby zdobyli uznanie ludzi
  rationale: Zachowano mocniejsze pojęcie chwały, nie sprowadzając go jedynie do pochwały, co podtrzymuje napięcie między uznaniem od ludzi a zapłatą od Boga w szerszym kontekście.
- issue: Charakter zapłaty wyrażonej przez ἀπέχουσιν
  choice: otrzymali już całą swoją zapłatę
  alternative: mają swoją zapłatę; odbierają swoją nagrodę
  rationale: 'Sformułowanie zachowuje sens dokonany idiomu: publiczne uznanie stanowi pełną zapłatę, którą już odebrali, bez dodawania szczegółów niewyrażonych w wersecie.'
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym tonie. Zachowano tradycyjne i czytelne terminy „jałmużna”, „obłudnicy” oraz „Zaprawdę”, a niezręczną stronę bierną zastąpiono naturalną polską konstrukcją czynną. Wszystkie warianty istotne leksykalnie i kulturowo ujęto w przypisach.
