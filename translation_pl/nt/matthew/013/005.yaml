  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: pl
  text: Inne zaś ziarna padły na miejsca skaliste[a], gdzie nie było wiele gleby, i od razu wzeszły, ponieważ gleba była płytka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na miejsca skaliste”; chodzi o płytką warstwę gleby zalegającą na skale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Inne zaś ziarna
  rationale: Neutrum liczby mnogiej nawiązuje eliptycznie do ziaren z poprzedniego wersetu. Dodanie rzeczownika „ziarna” zapewnia jasność, a „zaś” zachowuje kontrast wyrażony przez δέ.
- source_word: ἔπεσεν
  choice: padły
  rationale: Grecki czasownik oznacza po prostu „paść”. Polska liczba mnoga wynika z naturalnej zgody z dopowiedzianym rzeczownikiem „ziarna”; nie wprowadzono interpretującego „zostały zasiane”.
- source_word: ἐπὶ τὰ πετρώδη
  choice: na miejsca skaliste
  rationale: Rzeczownikowo użyty przymiotnik w liczbie mnogiej oznacza skaliste lub kamieniste miejsca. Sformułowanie zachowuje liczbę mnogą oryginału oraz obraz cienkiej warstwy gleby nad skałą.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: gdzie nie miały wiele gleby
  rationale: W naturalnej polszczyźnie podmiotem pozostają domyślne ziarna; „gleba” trafnie oddaje γῆ w kontekście uprawy.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: i od razu wzeszły
  rationale: „Od razu” zachowuje natychmiastowość εὐθέως, a „wzeszły” jest naturalnym polskim określeniem kiełkowania i pojawienia się roślin.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: ponieważ gleba nie była głęboka
  rationale: Konstrukcja z διά wyraża przyczynę. Polski zwrot naturalnie oddaje dosłowny sens „nie mieć głębokości gleby”, zachowując obraz płytkiej warstwy ziemi.
theological_decisions: []
