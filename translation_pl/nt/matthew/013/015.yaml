revisions:
- from: Bo serce tego ludu stało się nieczułe[a], uszami słuchają z trudem i zamknęli swoje oczy, żeby przypadkiem nie zobaczyli oczami, nie usłyszeli uszami, nie zrozumieli sercem, nie zawrócili[b] — a Ja ich uzdrowię.[c]
  to: Bo serce tego ludu stało się nieczułe[a], uszami z trudem słyszeli i zamknęli oczy, by przypadkiem nie zobaczyli oczami, nie usłyszeli uszami, nie zrozumieli sercem i nie zwrócili się[b] — a Ja ich uzdrowię.[c]
  rationale: Korekta ogranicza się do przywrócenia przeszłego aspektu greckiego ἤκουσαν, bardziej pojemnego oddania ἐπιστρέψωσιν oraz drobnego wygładzenia idiomu. Zachowano aktywne „zamknęli oczy”, obraz serca jako miejsca rozumienia, przyszłe „uzdrowię” oraz nierozstrzygnięte napięcie klauzuli μήποτε.
