id: MAT.13.15
reference: Matthew 13:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: pl
  text: Bo serce tego ludu stało się nieczułe[a], uszami z trudem słyszeli i zamknęli oczy, by przypadkiem nie zobaczyli oczami, nie usłyszeli uszami, nie zrozumieli sercem i nie zwrócili się[b] — a Ja ich uzdrowię.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „stało się grube”; chodzi o otępienie lub brak wrażliwości.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „nie zawrócili” lub „nie powrócili”.'
    reason: lexical_alternative
  - marker: c
    text: Cytat z Izajasza 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: stało się nieczułe
  rationale: Czasownik dosłownie oznacza „stać się grubym/otyłym”, lecz w połączeniu z sercem opisuje otępienie i brak wrażliwości. „Stało się nieczułe” oddaje sens idiomu naturalną współczesną polszczyzną.
- source_word: καρδία
  choice: serce
  rationale: Zachowuje biblijny obraz wnętrza człowieka jako ośrodka rozumienia i postawy; werset wprost łączy serce ze zrozumieniem.
- source_word: λαοῦ τούτου
  choice: tego ludu
  rationale: Oddaje zarówno rzeczownik „lud”, jak i wskazujące τούτου („tego”).
- source_word: βαρέως ἤκουσαν
  choice: uszami słuchają z trudem
  rationale: βαρέως dosłownie wnosi pojęcie ciężkości, a przy słuchaniu oznacza trudność lub opieszałość w słyszeniu. Polski czas teraźniejszy naturalnie przedstawia utrzymujący się stan opisany w cytacie.
- source_word: ἐκάμμυσαν
  choice: zamknęli
  rationale: Zachowuje stronę czynną i odpowiedzialność ludzi za zamknięcie oczu.
- source_word: μήποτε
  choice: żeby przypadkiem nie
  rationale: Oddaje negatywną klauzulę celu lub skutku, zachowując napięcie tekstu bez rozstrzygania jego teologicznej interpretacji.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν ... ἐπιστρέψωσιν
  choice: nie zobaczyli ... nie usłyszeli ... nie zrozumieli ... nie zawrócili
  rationale: Po polskim „żeby przypadkiem nie” formy te naturalnie oddają ciąg greckich aorystów w trybie łączącym i zachowują jego paralelną strukturę.
- source_word: ἐπιστρέψωσιν
  choice: zawrócili
  rationale: Oddaje kierunkowy sens zwrócenia się z powrotem, nie narzucając terminologii wyznaniowej takiej jak „nawrócili się”.
- source_word: ἰάσομαι
  choice: Ja ich uzdrowię
  rationale: Bezpośrednio oddaje grecką formę przyszłą; zaimek „Ja” uwydatnia zmianę podmiotu i naturalizuje składnię polską.
theological_decisions:
- issue: Napięcie między sądem Bożym a odpowiedzialnością człowieka w klauzuli μήποτε
  choice: żeby przypadkiem nie zobaczyli ... nie zawrócili — a Ja ich uzdrowię
  alternative: bo inaczej zobaczyliby ... zawróciliby, a Ja bym ich uzdrowił
  rationale: Wybrany przekład zachowuje powierzchniową siłę μήποτε oraz ludzi jako czynny podmiot zamknięcia oczu. Nie rozstrzyga, czy zdanie wyraża cel, skutek, czy sądową ironię.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Zachowano paralelizm oczu, uszu i serca oraz aktywną rolę ludu w zamknięciu oczu. Myślnik przed ostatnią klauzulą pomaga czytelnie zaznaczyć zmianę podmiotu bez dopowiadania relacji logicznej.
