base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: pl
  text: Inne ziarna padły między ciernie[a]. Ciernie wyrosły i je zagłuszyły.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na ciernie”; w kontekście siewu: „między ciernie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Inne ziarna
  rationale: Przymiotnik w rodzaju nijakim i liczbie mnogiej został użyty rzeczownikowo; z kontekstu wynika, że chodzi o inne ziarna. Dodanie rzeczownika „ziarna” zapewnia jasność po polsku.
- source_word: δὲ
  choice: podział na kolejne zdanie bez osobnego odpowiednika
  rationale: δέ jest tu łagodnym łącznikiem rozwijającym opowieść. Naturalna polska narracja nie wymaga oddzielnego spójnika.
- source_word: ἔπεσεν
  choice: padły
  rationale: Zachowuje podstawowe znaczenie czasownika πίπτω („padać”), bez zastępowania go bardziej interpretacyjnym „zostały zasiane”.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: między ciernie
  rationale: Choć ἐπί z biernikiem może dosłownie oznaczać „na”, w kontekście siewu naturalne polskie „między ciernie” oddaje trafienie nasion w miejsce porośnięte cierniami.
- source_word: ἀκάνθας / ἄκανθαι
  choice: ciernie
  rationale: „Ciernie” to naturalny i utrwalony odpowiednik, obejmujący kolczaste rośliny zarówno jako miejsce upadku ziaren, jak i później wyrastającą roślinność.
- source_word: ἀνέβησαν
  choice: wyrosły
  rationale: W odniesieniu do roślin „wyrosły” naturalnie oddaje obraz ich wznoszenia się i wzrostu zawarty w ἀναβαίνω.
- source_word: ἔπνιξαν
  choice: zagłuszyły
  rationale: Polskie „zagłuszyć” jest naturalnym określeniem sytuacji, gdy chwasty lub ciernie hamują wzrost innych roślin, i zachowuje metaforyczną siłę πνίγω.
- source_word: αὐτά
  choice: je
  rationale: Zaimek rodzaju nijakiego w liczbie mnogiej odnosi się do ziaren; polskie „je” zachowuje zwięzłość tekstu greckiego.
