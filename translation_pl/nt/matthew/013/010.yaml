  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: pl
  text: 'Wtedy uczniowie podeszli[a] i powiedzieli mu: „Dlaczego mówisz do nich w przypowieściach?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „zbliżyli się”. Grecki imiesłów podkreśla, że uczniowie najpierw podeszli do Jezusa, a potem się odezwali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Wtedy
  rationale: Spójnik καί łączy zdanie z poprzednią sceną i posuwa narrację naprzód. „Wtedy” brzmi naturalnie po polsku, nie wprowadzając dodatkowej treści.
- source_word: προσελθόντες
  choice: podeszli
  rationale: Imiesłów aorystu od προσέρχομαι oznacza zbliżenie się do Jezusa poprzedzające wypowiedź. Polski czasownik „podeszli” jasno oddaje ten ruch i zachowuje naturalny szyk narracji.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: Rodzajnik wskazuje na znaną z kontekstu grupę. Nie dodano zaimka „jego”, ponieważ nie występuje on w tekście greckim.
- source_word: εἶπαν αὐτῷ
  choice: powiedzieli mu
  rationale: Choć wypowiedź ma formę pytania, εἶπαν jest formą czasownika λέγω, „powiedzieć”. Przekład zachowuje to sformułowanie zamiast interpretacyjnego „zapytali go”.
- source_word: Διὰ τί
  choice: Dlaczego
  rationale: Jest to zwykłe greckie wyrażenie pytające o przyczynę; „Dlaczego” jest jego zwięzłym i naturalnym polskim odpowiednikiem.
- source_word: ἐν παραβολαῖς
  choice: w przypowieściach
  rationale: Przyimek ἐν z celownikiem określa tutaj sposób lub środek mówienia. „W przypowieściach” jest utrwalonym, naturalnym odpowiednikiem zachowującym obrazową formę nauczania.
- source_word: λαλεῖς
  choice: mówisz
  rationale: Czas teraźniejszy, strona czynna, druga osoba liczby pojedynczej. „Mówisz” wiernie i idiomatycznie oddaje tę formę.
- source_word: αὐτοῖς
  choice: do nich
  rationale: Zaimek w celowniku wskazuje adresatów wypowiedzi Jezusa; po polsku naturalną konstrukcją jest „mówić do nich”.
