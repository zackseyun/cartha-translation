  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: pl
  text: Jezus powiedział tłumom to wszystko w przypowieściach, a bez przypowieści niczego im nie mówił.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecka forma czasownika może wskazywać, że w opisywanym kontekście Jezus zwykle nie mówił do nich bez przypowieści.
    reason: aspekt_czasownika
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: O tym wszystkim
  rationale: Naturalny polski odpowiednik zachowujący zarówno wskazanie na poprzedzające nauczanie, jak i jego całościowy zakres.
- source_word: ἐλάλησεν
  choice: mówił
  rationale: Polski czas przeszły niedokonany brzmi naturalnie w podsumowaniu sposobu nauczania i trafnie oddaje czynność mówienia.
- source_word: ἐν παραβολαῖς
  choice: w przypowieściach
  rationale: Przyimek ἐν wyraża tu sposób lub środek; utrwalony i naturalny polski zwrot to „w przypowieściach”.
- source_word: τοῖς ὄχλοις
  choice: do tłumów
  rationale: Zachowano liczbę mnogą greckiego rzeczownika oraz jego funkcję odbiorcy wypowiedzi.
- source_word: χωρὶς παραβολῆς
  choice: bez przypowieści
  rationale: Oddaje χωρίς z dopełniaczem i zachowuje liczbę pojedynczą παραβολῆς bez niepotrzebnego doprecyzowania.
- source_word: οὐδὲν ἐλάλει
  choice: niczego im nie mówił
  rationale: Naturalna polska konstrukcja przecząca; czasownik niedokonany może wyrażać zwyczajowy lub trwający sposób przemawiania.
- source_word: αὐτοῖς
  choice: im
  rationale: Zaimek jasno odsyła do wspomnianych wcześniej tłumów i pozwala uniknąć zbędnego powtórzenia.
theological_decisions:
- issue: Wartość aspektowa imperfectum ἐλάλει w drugim zdaniu
  choice: „niczego im nie mówił”, z polskim czasownikiem niedokonanym
  alternative: „nie powiedział im niczego” jako jednorazowe ujęcie dokonane
  rationale: 'Forma niedokonana naturalnie zachowuje możliwy sens zwyczajowy lub ciągły: w opisywanej sytuacji Jezus przemawiał do tłumów przypowieściami. Nie rozstrzyga ponad tekstem, czy chodzi wyłącznie o pojedynczy akt, czy o stałą praktykę w tym kontekście.'
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelizm obu części wersetu oraz liczbę mnogą „tłumów”. Marker przypisu umieszczono po całym zdaniu, ponieważ objaśnia aspekt czasownika w drugiej części.
