id: MAT.13.17
reference: Matthew 13:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: pl
  text: 'Zaprawdę bowiem mówię wam: wielu proroków i ludzi sprawiedliwych[a] pragnęło zobaczyć to, co wy widzicie, lecz nie zobaczyli, i usłyszeć to, co wy słyszycie, lecz nie usłyszeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „sprawiedliwi”. Grecki przymiotnik ma tu znaczenie rzeczownikowe i oznacza osoby sprawiedliwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: zaprawdę
  rationale: Oddaje uroczyste zapewnienie w formule Jezusa. Słowo jest podniosłe, ale nadal powszechnie zrozumiałe w polskim języku biblijnym.
- source_word: γὰρ
  choice: bowiem
  rationale: Zachowuje wyjaśniający związek tego zdania z poprzednią wypowiedzią.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośrednio i naturalnie odtwarza grecką formułę wypowiedzi.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: liczni prorocy i sprawiedliwi
  rationale: „Liczni” pozwala zachować osobową liczbę mnogą w całym zdaniu, a użyte rzeczownikowo „sprawiedliwi” wiernie oddaje grecki przymiotnik substantywizowany.
- source_word: ἐπεθύμησαν
  choice: pragnęli
  rationale: Wyraża silne, lecz w tym kontekście pozytywne pragnienie, bez niepożądanych skojarzeń.
- source_word: ἰδεῖν / ἃ βλέπετε
  choice: zobaczyć / to, co wy widzicie
  rationale: Zachowuje paralelę między pragnieniem dawnych pokoleń a obecnym doświadczeniem adresatów; zaimek „wy” uwydatnia kontrast obecny w formach greckich.
- source_word: ἀκοῦσαι / ἃ ἀκούετε
  choice: usłyszeć / to, co wy słyszycie
  rationale: Odtwarza składniową i znaczeniową równoległość z czasownikami dotyczącymi widzenia.
- source_word: οὐκ εἶδαν / οὐκ ἤκουσαν
  choice: nie zobaczyli / nie usłyszeli
  rationale: Proste formy przeszłe oddają historyczny fakt, że ich pragnienie nie zostało spełnione za ich życia.
theological_decisions:
- issue: Zakres znaczeniowy δίκαιοι
  choice: sprawiedliwi jako odrębna, szersza grupa wymieniona obok proroków
  alternative: ludzie sprawiedliwi
  rationale: Grecki przymiotnik występuje rzeczownikowo w liczbie mnogiej. Polski rzeczownikowy przymiotnik „sprawiedliwi” zachowuje tę formę i nie ogranicza grupy do proroków.
- issue: Przedmiot widzenia i słyszenia
  choice: pozostawiono ogólne sformułowania „to, co wy widzicie” i „to, co wy słyszycie”
  alternative: doprecyzowanie jako Jezus, Mesjasz, królestwo albo tajemnice królestwa
  rationale: Kontekst pomaga rozpoznać odniesienie, ale sam werset go nie nazywa. Przekład nie rozstrzyga więc explicite tego, co tekst pozostawia domyślne.
translation_notes:
  register: Współczesna, zrozumiała polszczyzna o godnym rejestrze. Zachowano tradycyjne „zaprawdę”, ponieważ należy do uroczystej formuły zapewnienia, oraz wyraźny paralelizm między widzeniem a słyszeniem.
