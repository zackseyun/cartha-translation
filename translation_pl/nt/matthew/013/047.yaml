  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: pl
  text: I znowu królestwo niebios podobne jest do niewodu[a] zarzuconego w morze i zbierającego ryby wszelkiego rodzaju[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niewód to duża sieć rybacka ciągnięta przez wodę; można też przełożyć ogólniej: „sieć”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „z każdego rodzaju”. Słowo „ryby” wynika z obrazu połowu, lecz nie występuje w tekście greckim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: I znowu
  rationale: Wprowadza kolejne porównanie w szeregu przypowieści; „I znowu” naturalnie zaznacza ciąg dalszy.
- source_word: ὁμοία ἐστὶν
  choice: podobne jest do
  rationale: Zachowuje Mateuszową formułę porównawczą i podniosły, lecz zrozumiały szyk.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Oddaje charakterystyczne dla Mateusza sformułowanie bez zastępowania go interpretacyjnym „królestwem Boga”.
- source_word: σαγήνῃ
  choice: niewodu
  rationale: „Niewód” oznacza dużą sieć ciągnioną w wodzie i precyzyjniej niż ogólne „sieć” oddaje konkretny typ narzędzia połowowego.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: zarzuconego w morze
  rationale: Naturalny polski zwrot dotyczący sieci, zachowujący bierną formę oraz źródłowe „morze”.
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: który zagarnął ryby wszelkiego rodzaju
  rationale: Zdanie względne brzmi naturalnie po polsku; „ryby” są domyślnym dopełnieniem wynikającym z obrazu połowu, a przypis ujawnia ich nieobecność w tekście greckim.
theological_decisions:
- issue: Znaczenie wyrażenia „królestwo niebios”
  choice: Zachowano Mateuszowe „królestwo niebios”.
  alternative: królestwo Boga; panowanie niebios
  rationale: Przekład nie zastępuje charakterystycznej formuły ewangelisty równoważnym teologicznie objaśnieniem ani nie rozstrzyga jej zakresu.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Termin „niewód” zachowuje precyzję obrazu, a przypis objaśnia mniej częste słowo. Składnia pozostaje bliska greckiemu porównaniu, lecz jest naturalna po polsku.
