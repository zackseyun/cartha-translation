  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: pl
  text: Królestwo niebios jest podobne do skarbu ukrytego w polu[a]. Pewien człowiek znalazł go i ukrył, a z radości[b] idzie, sprzedaje wszystko, co ma, i kupuje to pole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Królestwo niebios jest podobne do ukrytego w polu skarbu”.'
    reason: Polski szyk może mocniej łączyć imiesłów „ukrytego” ze „skarbem”; oba warianty zachowują sens greckiej konstrukcji.
  - marker: b
    text: 'Dosłownie: „z jego radości”; sens: „z powodu swojej radości”.'
    reason: Greckie ἀπὸ τῆς χαρᾶς αὐτοῦ wyraża radość jako motyw działania.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: jest podobne do
  rationale: Naturalna polska formuła porównawcza, która zachowuje charakter przypowieści.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  rationale: Utrwalone i naturalne oddanie charakterystycznego dla Mateusza wyrażenia; zachowuje zarówno pojęcie królestwa, jak i reverencyjne odwołanie do niebios.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: do skarbu ukrytego w polu
  rationale: Celownik wynika z konstrukcji porównawczej; imiesłów perfectum opisuje trwały stan ukrycia. Polski brak rodzajnika pozwala zachować nieokreśloność pola.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: Pewien człowiek znalazł go i ponownie ukrył
  rationale: „Pewien człowiek” naturalnie wprowadza nieokreśloną postać, a „ponownie” jasno oddaje, że po znalezieniu skarb został znów ukryty.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: z radości
  rationale: Zwięzłe, idiomatyczne oddanie przyczyny działania, bez ograniczania frazy wyłącznie do opisu stanu emocjonalnego.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: idzie, sprzedaje wszystko, co ma
  rationale: Zachowuje żywy czas teraźniejszy narracji i pełny zakres wyrażenia πάντα ὅσα ἔχει.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: kupuje to pole
  rationale: Zaimek „to” oddaje demonstratywne ἐκεῖνον i wskazuje na konkretne pole zawierające skarb.
theological_decisions:
- issue: Znaczenie βασιλεία
  choice: królestwo
  alternative: panowanie
  rationale: „Królestwo” zachowuje szeroki zakres terminu, mogącego wskazywać zarówno na władzę, jak i jej sferę, bez rozstrzygania napięcia na rzecz jednego aspektu.
- issue: Rodzajowe oddanie ἄνθρωπος
  choice: pewien człowiek
  alternative: pewna osoba
  rationale: Rzeczownik i odnoszące się do postaci formy są rodzaju męskiego; tłumaczenie zachowuje męską postać przypowieści bez nadawania jej dodatkowego znaczenia doktrynalnego.
- issue: Powód sprzedaży majątku
  choice: z radości
  alternative: w swojej radości
  rationale: Fraza ἀπὸ τῆς χαρᾶς αὐτοῦ naturalnie wyraża motywującą przyczynę; nie dopowiada, co symbolizują poszczególne elementy przypowieści.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano żywy czas teraźniejszy w końcowej sekwencji. „Ponownie ukrył” dopowiada relację wynikającą z kolejności greckich czasowników, lecz nie dodaje nowego wydarzenia.
