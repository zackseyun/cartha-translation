id: MAT.13.11
reference: Matthew 13:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: pl
  text: 'On zaś odpowiedział im: „Wam dano poznać tajemnice królestwa niebios, lecz tamtym nie dano”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Greckie połączenie imiesłowu z czasownikiem osobowym jest utartym zwrotem oznaczającym udzielenie odpowiedzi; naturalna polszczyzna nie wymaga dosłownego „odpowiadając, powiedział”.
- source_word: Ὅτι
  choice: pominięte jako wskaźnik wprowadzenia wypowiedzi
  rationale: W tym kontekście ὅτι może wprowadzać treść odpowiedzi. Polski dwukropek i mowa niezależna oddają tę funkcję naturalniej niż „że”; przekład „ponieważ” nadmiernie rozstrzygałby relację logiczną.
- source_word: ὑμῖν δέδοται
  choice: wam dano
  rationale: Zachowuje celownik odbiorcy i stronę bierną z niewskazanym sprawcą, a zarazem brzmi naturalnie po polsku.
- source_word: γνῶναι
  choice: poznać
  rationale: „Poznać” oddaje γινώσκω oraz bezokolicznik aorystu bez zawężania sensu do samego intelektualnego zrozumienia.
- source_word: τὰ μυστήρια
  choice: tajemnice
  rationale: „Tajemnice” jest utrwalonym i trafnym odpowiednikiem prawd Bożych, które pozostawały ukryte, a zostają objawione; nie sugeruje jedynie zagadek.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: królestwa niebios
  rationale: „Niebios” zachowuje Mateuszową formę liczby mnogiej i pozostaje zrozumiałym, godnym określeniem w języku polskim.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: lecz tamtym nie dano
  rationale: „Tamtym” zachowuje wskazujący i kontrastowy charakter ἐκείνοις, a powtórzenie „dano” oddaje równoległą budowę obu członów.
theological_decisions:
- issue: Niewskazany sprawca formy δέδοται
  choice: Zachować formę bierną „dano” bez jawnego wskazywania Boga
  alternative: Bóg dał wam
  rationale: Greka pozostawia dawcę niewymienionego. Choć kontekst wskazuje na Boga, dopowiedzenie podmiotu usuwałoby zamierzoną pośredniość tekstu.
- issue: Znaczenie μυστήρια w odniesieniu do królestwa
  choice: tajemnice
  alternative: sekrety; ukryte prawdy
  rationale: „Tajemnice” zachowują biblijną kategorię rzeczywistości wcześniej ukrytej, a następnie udostępnionej, bez narzucania węższej interpretacji.
- issue: Funkcja ὅτι na początku odpowiedzi
  choice: Oddać składniowo przez bezpośrednie wprowadzenie wypowiedzi
  alternative: ponieważ; że
  rationale: Forma może wprowadzać treść lub uzasadnienie. Bezpośrednia wypowiedź w języku polskim zachowuje sens bez przesądzania, że Jezus rozpoczyna zdanie spójnikiem przyczynowym.
translation_notes:
  register: Współczesna, godna i oszczędna polszczyzna. Szyk „Wam dano… lecz tamtym…” zachowuje nacisk i wyraźny kontrast oryginału. Strona bierna pozostawia dawcę domyślnym zgodnie z tekstem greckim.
