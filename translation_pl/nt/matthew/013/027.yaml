  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: pl
  text: 'Wtedy niewolnicy gospodarza podeszli do niego i powiedzieli: „Panie, czy nie zasiałeś dobrego ziarna na swoim polu? Skąd więc wzięły się na nim chwasty[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „kąkol”. Greckie słowo prawdopodobnie odnosi się do życicy odurzającej, chwastu podobnego do pszenicy we wczesnej fazie wzrostu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: podeszli do niego
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą wypowiedź; polskie „podeszli do niego” naturalnie oddaje ruch w stronę gospodarza.
- source_word: δοῦλοι
  choice: niewolnicy
  rationale: Termin oznacza osoby pozostające pod władzą pana; „niewolnicy” zachowuje ich status wyraźniej niż łagodniejsze „słudzy”.
- source_word: οἰκοδεσπότου
  choice: gospodarza
  rationale: W kontekście domu i pola „gospodarz” naturalnie oddaje osobę sprawującą władzę nad domostwem i jego pracownikami.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz jest pełnym szacunku zwrotem do gospodarza; „Panie” zachowuje zwyczajowy polski odpowiednik κύριος bez przesądzania dodatkowego sensu chrystologicznego w dialogu przypowieści.
- source_word: οὐχὶ
  choice: czy nie
  rationale: Konstrukcja pytajna zakłada odpowiedź twierdzącą; „czy nie” zachowuje tę siłę.
- source_word: καλὸν σπέρμα
  choice: dobre ziarno
  rationale: To prosty i naturalny polski odpowiednik wyrażenia rolniczego.
- source_word: ἔσπειρας
  choice: zasiałeś
  rationale: Czasownik σπείρω oznacza konkretnie sianie; aspekt dokonany odpowiada greckiemu aorystowi w tym pytaniu.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: na swoim polu
  rationale: W języku polskim sieje się „na polu”; zaimek „swoim” jasno wskazuje, że pole należy do adresata.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: Skąd więc wzięły się na nim chwasty
  rationale: Grecka konstrukcja dosłownie mówi, że pole „ma” chwasty, ale po polsku pytanie o ich pochodzenie naturalnie brzmi „skąd się wzięły”; „na nim” zachowuje odniesienie do pola.
- source_word: ζιζάνια
  choice: chwasty
  rationale: „Chwasty” są jasne dla współczesnego czytelnika, natomiast bardziej precyzyjne „kąkol” zachowano w przypisie.
theological_decisions:
- issue: Status osób określonych jako δοῦλοι
  choice: niewolnicy
  alternative: słudzy
  rationale: „Niewolnicy” nie zaciera zależności społecznej wyrażonej przez δοῦλοι, choć przypowieść nie wypowiada tu oceny instytucji niewolnictwa.
- issue: Sposób oddania κύριε w dialogu przypowieści
  choice: Panie
  alternative: Gospodarzu
  rationale: „Panie” zachowuje podstawowy odpowiednik κύριε i pełni funkcję zwrotu grzecznościowego do właściciela; sam kontekst nie wymusza ani nie wyklucza szerszych skojarzeń tytułu.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano wyraźne „niewolnicy”, natomiast niezręczną w polszczyźnie dosłowną konstrukcję „skąd więc ma chwasty?” oddano idiomatycznie jako pytanie o ich pochodzenie.
