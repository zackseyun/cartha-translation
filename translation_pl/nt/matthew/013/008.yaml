translation:
  language: pl
  text: 'Inne zaś ziarna padły na dobrą ziemię i wydawały plon: jedno stokrotny, drugie sześćdziesięciokrotny, a trzecie trzydziestokrotny.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „i przynosiły plon: jedne stokrotny, inne sześćdziesięciokrotny, a jeszcze inne trzydziestokrotny”. Grecka konstrukcja rozdzielcza dopuszcza oba sposoby wyrażenia zróżnicowanych plonów.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: inne ziarna
  rationale: Neutrum liczby mnogiej użyte rzeczownikowo odsyła w kontekście przypowieści do ziaren; polszczyzna wymaga naturalnego dopowiedzenia rzeczownika w liczbie mnogiej.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje kontrast wobec wcześniejszych nieurodzajnych miejsc, zachowując płynny i godny rejestr narracji.
- source_word: ἔπεσεν
  choice: padły
  rationale: Zachowuje dosłowny obraz padania ziaren; liczba mnoga wynika z polskiego rozwinięcia „inne ziarna”.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: na dobrą ziemię
  rationale: „Ziemia” jest naturalnym polskim określeniem urodzajnego podłoża w obrazie siewu i zachowuje tradycyjnie rozpoznawalną metaforę.
- source_word: ἐδίδου καρπόν
  choice: wydawały plon
  rationale: Imperfectum wskazuje na trwające lub charakterystyczne przynoszenie plonu; „wydawały plon” brzmi naturalnie w kontekście rolniczym.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: jedno stokrotny, drugie sześćdziesięciokrotny, a inne trzydziestokrotny
  rationale: Odtwarza grecki rozdzielczy układ „jedno… drugie… inne” i jasno wyraża wielokrotność uzyskanego plonu.
