translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zachowano rolniczy obraz padania ziaren oraz aspekt niedokonany czasownika opisującego wydawanie plonu; „zaś” sygnalizuje kontrast bez nadmiernego uwydatniania go.
