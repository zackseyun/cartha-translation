id: MAT.13.54
reference: Matthew 13:54
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: pl
  text: 'A gdy przyszedł w swoje rodzinne strony, nauczał ich w ich synagodze, tak że zdumiewali się i mówili: „Skąd u niego ta mądrość i te dzieła mocy[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „moce”; chodzi o czyny będące przejawami mocy, często rozumiane jako cuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: rodzinne strony
  rationale: W tym kontekście chodzi o miejsce, z którego Jezus pochodził i gdzie był znany, nie o państwo ani ojczyznę w sensie narodowym. Polskie „rodzinne strony” brzmi naturalnie i zachowuje lokalny sens wyrazu.
- source_word: ἐδίδασκεν
  choice: nauczał
  rationale: Polski czasownik niedokonany oddaje trwającą lub powtarzającą się czynność wyrażoną greckim imperfectum.
- source_word: συναγωγῇ
  choice: synagodze
  rationale: W żydowskim kontekście jest to zwykłe i jednoznaczne określenie miejsca oraz instytucji zgromadzenia.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: tak że zdumiewali się i mówili
  rationale: „Tak że” wyraża skutek nauczania, a niedokonane formy „zdumiewali się” i „mówili” naturalnie oddają greckie bezokoliczniki w polskiej składni.
- source_word: Πόθεν τούτῳ
  choice: Skąd u niego
  rationale: Pytanie dotyczy źródła mądrości i czynów Jezusa. „Skąd u niego” jest idiomatyczne po polsku i zachowuje lekko dystansujący ton zaimka τούτῳ.
- source_word: σοφία
  choice: mądrość
  rationale: To standardowy i bezpośredni odpowiednik, odnoszący się tutaj do niezwykłej mądrości dostrzeganej w nauczaniu Jezusa.
- source_word: δυνάμεις
  choice: dzieła mocy
  rationale: Wyrażenie wskazuje na czyny objawiające moc. Zachowuje związek z podstawowym sensem δύναμις, a zarazem jest po polsku czytelniejsze niż samo „moce” i mniej interpretacyjne niż „cuda”.
theological_decisions:
- issue: Oddanie δυνάμεις w odniesieniu do niezwykłych czynów Jezusa
  choice: dzieła mocy
  alternative: cuda
  rationale: „Dzieła mocy” zachowują nacisk greckiego słowa na działającą moc i nie zawężają go bezpośrednio do technicznego określenia cudów. Przypis podaje dosłowniejszy wariant i wyjaśnia sens kontekstowy.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Rodzinne strony” brzmi naturalniej niż formalna „ojczyzna”, a „dzieła mocy” zachowują biblijną wagę bez narzucania węższej interpretacji. Marker przypisu umieszczono przy wyrażeniu, którego przypis dotyczy.
