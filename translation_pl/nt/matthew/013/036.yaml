base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: pl
  text: 'Wtedy odszedł od tłumów i wszedł do domu. Jego uczniowie podeszli do Niego i powiedzieli: „Wyjaśnij nam przypowieść o chwastach na polu[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecki wyraz może oznaczać dokładniej życicę odurzającą — chwast podobny do pszenicy; tradycyjnie: „kąkol”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wskaźnik następstwa czasowego, odpowiadający narracyjnej funkcji greckiego wyrazu.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: zostawiwszy tłumy
  rationale: Imiesłów uprzedni zachowuje relację czasową greckiego imiesłowu aorystu; liczba mnoga „tłumy” odpowiada τοὺς ὄχλους.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: wszedł do domu
  rationale: W tym kontekście konstrukcja opisuje przejście z miejsca publicznego do wnętrza; „wszedł do domu” jest naturalne i zwięzłe.
- source_word: προσῆλθον αὐτῷ
  choice: podeszli do Niego
  rationale: Oddaje ruch uczniów ku Jezusowi i jest naturalnym odpowiednikiem προσέρχομαι.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Jego uczniowie
  rationale: Naturalna polska konstrukcja dzierżawcza wiernie identyfikuje grupę.
- source_word: λέγοντες
  choice: i powiedzieli
  rationale: Skończona forma czasownika brzmi w polskiej narracji naturalniej niż dosłowne „mówiąc”, nie zmieniając treści wypowiedzi.
- source_word: Διασάφησον ἡμῖν
  choice: Wyjaśnij nam
  rationale: Jasny, współczesny odpowiednik prośby o uczynienie sensu zrozumiałym.
- source_word: τὴν παραβολὴν
  choice: przypowieść
  rationale: Utrwalony i trafny odpowiednik παραβολή w kontekście Ewangelii.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: o chwastach na polu
  rationale: Naturalna polska forma tytułu przypowieści; „chwasty” jest zrozumiałe, a możliwe dokładniejsze odniesienie botaniczne zachowano w przypisie.
