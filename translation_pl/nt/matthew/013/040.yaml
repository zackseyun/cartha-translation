  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: pl
  text: Jak więc zbiera się chwasty[a] i spala je w ogniu, tak będzie u kresu wieku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradycyjnie: „kąkol”. Grecki termin oznacza szkodliwe chwasty, prawdopodobnie życicę roczną.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe także: „u kresu świata”; gr. „wieku”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Jak zatem
  rationale: „Jak” wprowadza porównanie, a „zatem” zachowuje wynikowy lub kontynuacyjny sens οὖν i łączy wypowiedź z wcześniejszym objaśnieniem przypowieści.
- source_word: συλλέγεται
  choice: zbiera się
  rationale: Forma strony biernej odnosi się do chwastów zbieranych w celu usunięcia; polska konstrukcja z „się” brzmi naturalnie i zachowuje ogólny charakter obrazu.
- source_word: τὰ ζιζάνια
  choice: chwasty
  rationale: Grecki termin oznacza szkodliwe chwasty, najpewniej życicę roczną. „Chwasty” są jasnym i współczesnym odpowiednikiem, natomiast tradycyjny „kąkol” może sugerować inny gatunek.
- source_word: πυρὶ καίεται
  choice: spala w ogniu
  rationale: Sformułowanie zachowuje wyraźne odniesienie do ognia oraz prosty sens czasownika καίω. W połączeniu z „zbiera się” polska konstrukcja ma naturalny, bezosobowy charakter.
- source_word: οὕτως ἔσται
  choice: tak będzie
  rationale: Zwięźle oddaje człon odpowiadający wcześniejszemu „jak” oraz przyszły sens ἔσται.
- source_word: ἐν τῇ συντελείᾳ
  choice: u kresu
  rationale: „U kresu” naturalnie wyraża kulminację i dopełnienie, nie ograniczając znaczenia jedynie do ostatniego punktu czasowego.
- source_word: τοῦ αἰῶνος
  choice: wieku
  rationale: „Wiek” zachowuje czasowy sens αἰών i nie utożsamia go automatycznie z materialnym światem. Nie dodano zaimka „tego”, którego nie ma w tekście greckim.
theological_decisions:
- issue: Eschatologiczne wyrażenie συντέλεια τοῦ αἰῶνος
  choice: u kresu wieku
  alternative: u kresu świata
  rationale: Przekład „wieku” zachowuje czasowy i eschatologiczny sens greckiego αἰών, nie przesądzając szczegółowego schematu wydarzeń końca ani nie utożsamiając kresu wieku ze zniszczeniem kosmosu.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Paralelna konstrukcja „Jak… tak…” zachowuje retoryczną budowę greckiego zdania, a „zatem” wyraża jego powiązanie z wcześniejszym kontekstem.
