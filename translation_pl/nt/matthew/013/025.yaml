    issue: Singular „chwastu” for plural ζιζάνia
    rationale: The Greek noun is accusative plural and refers to weeds sown among the wheat. Polish plural „chwasty” more directly preserves the source number and avoids suggesting an undifferentiated mass noun.
  - severity: low
    issue: „między pszenicą”
    rationale: Although understandable, this phrasing is less idiomatic for plants dispersed amid a standing crop. „wśród pszenicy” naturally expresses ἀνὰ μέσον τοῦ σίτου without altering the meaning.
