  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: pl
  text: Lecz gdy ludzie spali, przyszedł jego nieprzyjaciel, nasiał chwastów wśród pszenicy i odszedł.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ludzie
  rationale: W tym kontekście oznacza osoby pozostające na miejscu, zapewne sługi z poprzedniego wersetu. Naturalne polskie „ludzie” zachowuje ogólność greckiego wyrażenia.
- source_word: ἐπέσπειρεν
  choice: nasiał
  rationale: Czasownik opisuje dosianie niepożądanych roślin na już obsianym polu; „nasiał” naturalnie oddaje celowe i obfite sianie między pszenicą.
- source_word: ζιζάνια
  choice: chwastu
  rationale: Greckie ζιζάνια odnosi się najpewniej do życicy rocznej, podobnej we wczesnym stadium do pszenicy. W tekście głównym ogólne „chwast” jest jasne i nie wprowadza niepewnej identyfikacji botanicznej.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: między pszenicą
  rationale: Naturalny polski odpowiednik wskazujący, że chwast zasiano pośród rosnącej pszenicy.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Zachowano kontrast wprowadzony przez δέ jako „Lecz” oraz zwięzłą sekwencję działań przeciwnika.
