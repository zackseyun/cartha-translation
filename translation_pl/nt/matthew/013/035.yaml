  rationale: Zmiana ogranicza interpretacyjne przesunięcie od „założenia” do „stworzenia”, a zarazem zachowuje brak słowa „świata” w tekście SBLGNT. Pełniejszy wariant rękopiśmienny pozostaje wyłącznie w przypisie. Nie wprowadza się imienia proroka ani żadnej interpretacji doktrynalnej.
