  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: pl
  text: 'aby wypełniło się to, co zostało powiedziane przez proroka: „Otworzę usta w przypowieściach, wypowiem rzeczy ukryte od początku[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy mają: „od założenia świata”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: aby wypełniło się
  rationale: Naturalna polska konstrukcja celowo-skutkowa zachowuje tryb formuły wypełnienia proroctwa bez nadmiernego precyzowania relacji celu i rezultatu.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: to, co zostało powiedziane przez proroka
  rationale: Oddaje urzeczownikowiony imiesłów i pośrednictwo proroka w płynnej, współczesnej polszczyźnie.
- source_word: λέγοντος
  choice: dwukropek przed cytatem
  rationale: W polszczyźnie funkcję greckiego imiesłowu wprowadzającego wypowiedź naturalniej pełni interpunkcyjne wprowadzenie cytatu niż niezręczne „mówiącego”.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Otworzę usta w przypowieściach
  rationale: Zachowuje poetycki obraz oraz Mateuszowy termin „przypowieści”; polskie „usta” brzmi naturalniej niż dosłowne „moje usta” i nie zmienia sensu pierwszej osoby.
- source_word: ἐρεύξομαι
  choice: wypowiem
  rationale: Oddaje energiczne wydobycie słów na zewnątrz, lecz unika zarówno archaicznego „wyrzeknę”, jak i nazbyt fizycznego dosłownego odpowiednika.
- source_word: κεκρυμμένα
  choice: rzeczy ukryte
  rationale: Zachowuje rzeczownikową funkcję imiesłowu oraz jego bierny, rezultatowy sens, nie interpretując go jako „tajemnice”.
- source_word: ἀπὸ καταβολῆς
  choice: od stworzenia
  rationale: Źródłowy tekst nie zawiera rzeczownika κόσμου. „Od stworzenia” stanowi naturalny polski odpowiednik eliptycznego wyrażenia i zachowuje odniesienie do początku, nie dodając w tekście głównym słowa „świata”.
theological_decisions:
- issue: Identyfikacja proroka
  choice: przez proroka
  alternative: przez Asafa, proroka
  rationale: Podany tekst grecki nie wymienia proroka z imienia; przekład nie uzupełnia identyfikacji na podstawie nagłówka Psalmu 78.
- issue: Zakres wyrażenia ἀπὸ καταβολῆς
  choice: od stworzenia
  alternative: od stworzenia świata
  rationale: W tekście SBLGNT podanym dla tego miejsca brak κόσμου („świata”). Główny przekład zachowuje tę krótszą postać, a pełniejsze brzmienie rękopiśmienne odnotowuje w przypisie.
translation_notes:
  register: Współczesny, godny rejestr z zachowaniem poetyckiego paralelizmu cytatu. Pominięto zbędny zaimek dzierżawczy przy „ustach”, a imiesłów λέγοντος oddano zgodnie z naturalną polską składnią za pomocą dwukropka.
