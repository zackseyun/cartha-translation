review_pass:
  verdict: revise
  source_fidelity: Zwrot „od stworzenia” zbyt wyraźnie interpretuje καταβολή jako akt stworzenia. W SBLGNT występuje eliptyczne „od założenia”, bez κόσμου; polski „od początku” najnaturalniej oddaje temporalny sens elipsy, nie dopowiadając „świata”. Pozostałe elementy, w tym formuła wypełnienia i cytat, są zgodne z tekstem greckim.
  naturalness: Tekst jest zasadniczo płynny i zachowuje godny rejestr. „Od początku” jest we współczesnej polszczyźnie naturalniejsze niż niedookreślone „od założenia” oraz mniej interpretujące niż „od stworzenia”. Dwukropek może naturalnie wprowadzać cytat i wystarczająco oddaje funkcję λέγοντος.
  terminology: „Przypowieściach”, „wypełniło się”, „rzeczy ukryte” i „proroka” są trafne. Przypis należy zachować jako wariant tekstowy, ale jego treść powinna wskazywać pełne alternatywne brzmienie, aby była jasna poza bezpośrednim kontekstem zdania.
  issues:
  - severity: medium
    issue: „od stworzenia” dla ἀπὸ καταβολῆς
    rationale: Καταβολή oznacza dosłownie założenie/ustanowienie, a nie samo „stworzenie”. Ponieważ tekst podstawowy nie zawiera κόσμου, nie należy pisać „od założenia świata”; „od początku” zachowuje eliptyczny sens czasowy bez dodawania elementu nieobecnego w tekście.
  - severity: low
    issue: Skrótowy przypis wariantowy
    rationale: 'Samo „dodają: ‘świata’” jest zrozumiałe w kontekście, lecz pełne brzmienie wariantu jest czytelniejsze i dokładniej dokumentuje jego zakres.'
