id: MAT.13.31
reference: Matthew 13:31
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: pl
  text: 'Przedstawił im inną przypowieść: „Królestwo niebios podobne jest do ziarnka gorczycy, które pewien człowiek wziął i zasiał na swoim polu”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: przedstawił
  rationale: W tym kontekście czasownik oznacza przedstawienie przypowieści słuchaczom. „Przedstawił” jest naturalne po polsku i zachowuje sens greckiego obrazu stawiania czegoś przed kimś.
- source_word: παραβολὴν
  choice: przypowieść
  rationale: To utrwalony i trafny polski odpowiednik nazwy gatunku παραβολή w nauczaniu synoptycznym.
- source_word: Ὁμοία ἐστὶν
  choice: podobne jest do
  rationale: Naturalna, godna i bliska greckiej formule konstrukcja wprowadzająca porównanie.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  rationale: Zachowuje charakterystyczne dla Mateusza określenie oraz otwartość pojęcia βασιλεία na królowanie i sferę panowania, bez zawężania go w samym przekładzie.
- source_word: κόκκῳ σινάπεως
  choice: ziarnka gorczycy
  rationale: „Ziarnko gorczycy” jest jasnym i utrwalonym polskim odpowiednikiem obrazu małego nasienia.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: które pewien człowiek wziął
  rationale: Zdanie względne zachowuje odniesienie do ziarnka, a imiesłów λαβών został naturalnie oddany czasownikiem osobowym. „Pewien człowiek” odpowiada narracyjnemu, nieokreślonemu ἄνθρωπος.
- source_word: ἔσπειρεν
  choice: zasiał
  rationale: Czasownik precyzyjnie opisuje siew nasienia i jest bardziej zgodny ze źródłem niż ogólne „posadził”.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: na swoim polu
  rationale: Polski mówi idiomatycznie o sianiu „na polu”; zaimek zwrotny jednoznacznie odnosi własność pola do podmiotu zdania.
theological_decisions:
- issue: Oddanie Mateuszowego wyrażenia βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  alternative: panowanie niebios; Królestwo Niebieskie
  rationale: „Królestwo niebios” zachowuje Mateuszowe sformułowanie i nie rozstrzyga nadmiernie, czy nacisk spoczywa na królowaniu, czy na sferze panowania. Mała litera w „niebios” traktuje ten wyraz jako określenie, nie nazwę własną.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano zwięzłość oraz rytm wypowiedzi przypowieściowej. Nie dodano przypisu, ponieważ warianty przekładowe nie są niezbędne do zrozumienia tekstu.
