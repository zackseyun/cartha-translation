  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: pl
  text: Tego dnia Jezus wyszedł z domu i siedział nad morzem[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Tego samego dnia”, jeśli zwrot podkreśla ciągłość z poprzednim wydarzeniem, a nie tylko określa czas.'
    reason: alternative_reading
  - marker: b
    text: 'Możliwe też: „przy morzu”. Grecki zwrot oznacza miejsce w pobliżu morza, nie precyzując odległości od brzegu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Tego dnia
  rationale: Naturalny polski zwrot czasowy zachowuje wskazanie na konkretny dzień. Greka nie zawiera osobnego odpowiednika słowa „samego”.
- source_word: ἐξελθὼν
  choice: wyszedł
  rationale: Imiesłów aorystu poprzedza czynność główną; polskie współrzędne ujęcie „wyszedł… i” naturalnie oddaje kolejność zdarzeń.
- source_word: τῆς οἰκίας
  choice: z domu
  rationale: Dopełniacz z ἐξέρχομαι oznacza miejsce, z którego się wychodzi; „wyszedł z domu” jest idiomatycznym i precyzyjnym odpowiednikiem.
- source_word: ἐκάθητο
  choice: siedział
  rationale: Imperfectum przedstawia trwającą sytuację stanowiącą tło sceny. „Siedział” zachowuje ten aspekt lepiej niż ingresywne „usiadł”.
- source_word: παρὰ τὴν θάλασσαν
  choice: nad morzem
  rationale: Współczesny polski zwrot „nad morzem” naturalnie oznacza położenie w pobliżu brzegu, nie określając dokładnej odległości. Zachowano podstawowe znaczenie θάλασσα, nie zawężając go w tekście głównym do „jeziora”.
- source_word: ὁ Ἰησοῦς
  choice: Jezus
  rationale: Utrwalona polska forma imienia.
