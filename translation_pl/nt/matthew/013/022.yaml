  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: pl
  text: Ten zaś, który został zasiany między ciernie, to ten, kto słucha słowa, lecz troska tego wieku[a] i zwodniczość bogactwa[b] zagłuszają słowo, a on staje się bezowocny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „troska tego świata”; greckie αἰών może w tym kontekście być oddane także jako „świat”.'
    reason: alternative_reading
  - marker: b
    text: 'Możliwe także: „ułuda bogactwa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: A posiany między ciernie
  rationale: Zachowano osobowy, rodzaju męskiego referent greckiego imiesłowu oraz obraz zasiewu. „Między ciernie” jest naturalnym polskim odpowiednikiem εἰς τὰς ἀκάνθας w tym kontekście.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ten, kto słucha słowa
  rationale: Polskie zdanie względne naturalnie oddaje grecki imiesłów czasu teraźniejszego; „słowo” zachowuje utrwalony i kontekstowo właściwy odpowiednik λόγος jako głoszonego orędzia.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: troska tego wieku
  rationale: „Troska” oddaje obciążające zatroskanie wyrażone przez μέριμνα, a „ten wiek” zachowuje czasowo-moralny sens αἰών bez utożsamiania go wprost ze światem fizycznym.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: zwodniczość bogactwa
  rationale: Sformułowanie wskazuje na zwodniczy charakter bogactwa i naturalnie oddaje grecką konstrukcję dopełniaczową.
- source_word: συμπνίγει
  choice: zagłuszają
  rationale: W obrazie cierni czasownik oznacza tłumienie wzrostu przez ściskanie lub duszenie. „Zagłuszają” jest naturalnym polskim określeniem działania chwastów i zachowuje przenośny sens wobec słowa.
- source_word: ἄκαρπος γίνεται
  choice: a on staje się bezowocny
  rationale: Zaimek „on” jasno odnosi końcowy skutek do słuchającego człowieka, zgodnie z osobową identyfikacją w objaśnieniu przypowieści, a nie do samego słowa.
theological_decisions:
- issue: Oddanie αἰών
  choice: tego wieku
  alternative: tego świata
  rationale: Greckie αἰών oznacza przede wszystkim wiek lub epokę. Wariant główny zachowuje właściwe Nowemu Testamentowi napięcie między obecnym wiekiem a inną rzeczywistością, natomiast tradycyjne i kontekstowo możliwe „tego świata” podano w przypisie.
- issue: Osobowy czy nieosobowy referent zakończenia
  choice: a on staje się bezowocny
  alternative: i staje się bezowocne
  rationale: Grecki tekst przechodzi od obrazu zasianego ziarna do człowieka słuchającego słowa. Osobowe „on” zachowuje ten ruch i nie sugeruje, że samo słowo jest z natury bezowocne.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano obraz zasiewu oraz osobowy charakter objaśnienia. Składnia jest naturalna dla polszczyzny, a termin „ten wiek” pozostawia widoczne greckie napięcie eschatologiczne bez jego doktrynalnego dopowiadania.
