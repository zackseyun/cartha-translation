id: MAT.13.21
reference: Matthew 13:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: pl
  text: Nie ma jednak w sobie korzenia, lecz trwa tylko do czasu. Gdy zaś z powodu słowa przychodzi ucisk lub prześladowanie, natychmiast upada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „potyka się”, „zostaje doprowadzony do upadku” lub „gorszy się”. Grecki czasownik ma szeroki zakres znaczeniowy i w tym kontekście wskazuje na załamanie się pod wpływem ucisku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: korzenia
  rationale: Zachowuje dosłowną metaforę rośliny obecną w przypowieści.
- source_word: ἐν ἑαυτῷ
  choice: w sobie
  rationale: Naturalnie oddaje zwrotny i wewnętrzny sens greckiego wyrażenia.
- source_word: πρόσκαιρός
  choice: trwa tylko do czasu
  rationale: W odniesieniu do człowieka brzmi naturalniej niż dosłowne „jest tymczasowy”, a wiernie wyraża krótkotrwałość.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: gdy ... przychodzi ucisk lub prześladowanie
  rationale: Oddaje konstrukcję imiesłowową jako zdanie czasowe i zachowuje powagę obu doświadczeń.
- source_word: θλίψεως
  choice: ucisk
  rationale: Zachowuje sens nacisku, udręki i trudnego położenia, pozostając zrozumiałym we współczesnej polszczyźnie.
- source_word: διωγμοῦ
  choice: prześladowanie
  rationale: Jest standardowym i precyzyjnym odpowiednikiem w kontekście wrogości wywołanej przyjęciem słowa.
- source_word: διὰ τὸν λόγον
  choice: z powodu słowa
  rationale: Zachowuje termin λόγος oraz jego więź z pozostałą częścią przypowieści, gdzie oznacza głoszone orędzie.
- source_word: εὐθὺς
  choice: natychmiast
  rationale: Wyraźnie oddaje podkreśloną w tekście szybkość reakcji.
- source_word: σκανδαλίζεται
  choice: upada
  rationale: Oddaje w tym kontekście załamanie się pod naciskiem, lecz nie rozstrzyga ponad miarę, czy chodzi o definitywne odstępstwo; szerszy zakres greckiego czasownika objaśnia przypis.
theological_decisions:
- issue: Znaczenie σκανδαλίζεται w kontekście uczniostwa
  choice: upada
  alternative: potyka się; zostaje doprowadzony do upadku; gorszy się; odstępuje
  rationale: „Upada” zachowuje obraz przeszkody i poważnego załamania wiary bez narzucania konkretnej doktryny o trwałości lub utracie zbawienia. Przypis ujawnia szerszy zakres greckiego czasownika.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano roślinną metaforę „korzenia” oraz ewangeliczne „słowo”. Podział na dwa zdania zapewnia naturalny polski tok wypowiedzi, nie zmieniając związku logicznego.
