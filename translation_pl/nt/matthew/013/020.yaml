id: MAT.13.20
reference: Matthew 13:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: pl
  text: A zasiany na skalistym gruncie[a] to ten, kto słucha słowa i od razu przyjmuje je z radością.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bardziej dosłownie: „zasiany na skalistych miejscach”.'
    reason: Alternatywa leksykalna zachowująca liczbę mnogą i bardziej formalną strukturę greckiego wyrażenia ἐπὶ τὰ πετρώδη.
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: A zasiany na skalistym gruncie
  rationale: „A” oddaje łagodne przejście sygnalizowane przez δέ. Imiesłowowa konstrukcja „zasiany” zachowuje zwięzłą metaforę siewu, a „na skalistym gruncie” brzmi naturalnie po polsku i oddaje rolniczy obraz πετρώδη.
- source_word: σπαρείς
  choice: zasiany
  rationale: Zwięzły imiesłów bierny zachowuje stronę bierną i metaforę siewu bez rozwijania jej w parafrazę.
- source_word: οὗτός ἐστιν
  choice: to ten
  rationale: Naturalna polska konstrukcja identyfikacyjna, która nie dopowiada interpretacyjnego „oznacza” ani „przedstawia”.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ten, kto słucha słowa
  rationale: Imiesłów czasu teraźniejszego oddano idiomatycznym zdaniem względnym. „Słowo” zachowuje brzmienie i tematyczne znaczenie λόγος zamiast zawężać je do „przesłania”.
- source_word: εὐθὺς
  choice: od razu
  rationale: Współczesny, neutralny i wyrazisty odpowiednik podkreślający natychmiastowość reakcji.
- source_word: μετὰ χαρᾶς
  choice: z radością
  rationale: Bezpośredni i naturalny odpowiednik, zachowujący rzeczownik χαρά.
- source_word: λαμβάνων αὐτόν
  choice: przyjmuje je
  rationale: W tym kontekście λαμβάνω oznacza przyjęcie słowa. Zaimek „je” jednoznacznie odnosi się do rodzaju nijakiego polskiego rzeczownika „słowo”.
theological_decisions:
- issue: Odniesienie wyrażenia „zasiany” w objaśnieniu przypowieści
  choice: 'Zachowano skondensowaną metaforę: „zasiany na skalistym gruncie”, po czym utożsamiono go ze słuchającym człowiekiem.'
  alternative: „Ziarno zasiane na skalistym gruncie oznacza człowieka, który…”
  rationale: Greka mówi dosłownie o „zasianym”, a następnie wskazuje, że jest nim słuchający. Przekład nie rozstrzyga napięcia metafory przez dodanie rzeczownika „ziarno” ani czasownika „oznacza”.
translation_notes:
  register: Język współczesny, godny i zrozumiały. Konstrukcja „A zasiany…” jest celowo zwięzła, aby zachować obrazowość oraz pewną niezwykłość greckiej metafory; „od razu” jest naturalniejsze we współczesnej polszczyźnie niż bardziej książkowe „natychmiast”.
