source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: pl
  text: Wtedy sprawiedliwi zajaśnieją[a] jak słońce w królestwie swego Ojca. Kto ma uszy, niech słucha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „rozbłysną”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „Mający uszy, niech słucha” — wezwanie w liczbie pojedynczej, skierowane reprezentatywnie do każdego słuchacza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący na wynik i czas wydarzeń opisanych w poprzedzającym wyjaśnieniu przypowieści.
- source_word: οἱ δίκαιοι
  choice: sprawiedliwi
  rationale: Rzeczownikowe użycie przymiotnika oznacza ludzi uznanych za sprawiedliwych; wybór zachowuje zarówno wymiar moralny, jak i relacyjno-przymierzowy, nie rozstrzygając między nimi.
- source_word: ἐκλάμψουσιν
  choice: zajaśnieją
  rationale: Czas przyszły czasownika oznaczającego jaśnieć lub rozbłysnąć. „Zajaśnieją” brzmi naturalnie i dostojnie oraz dobrze łączy się z porównaniem do słońca.
- source_word: ὡς ὁ ἥλιος
  choice: jak słońce
  rationale: Zachowuje bezpośrednie porównanie i jego wyrazisty obraz.
- source_word: ἐν τῇ βασιλείᾳ
  choice: w królestwie
  rationale: Konstrukcja ma tu sens miejscowy; „królestwo” oddaje obraz sfery królewskiego panowania, nie wykluczając dynamicznego znaczenia rządów.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: swego Ojca
  rationale: Polski zaimek zwrotny jednoznacznie odnosi Ojca do podmiotu „sprawiedliwi” i pozwala uniknąć mniej naturalnego „ich Ojca”. Wielka litera odpowiada współczesnej polskiej konwencji biblijnej dotyczącej Boga.
- source_word: ὁ ἔχων ὦτα
  choice: Kto ma uszy
  rationale: Naturalna polska konstrukcja odnosząca się jednostkowo i reprezentatywnie do każdego słuchacza; zachowuje liczbę pojedynczą bez niezręcznego kalkowania imiesłowu.
- source_word: ἀκουέτω
  choice: niech słucha
  rationale: Oddaje imperatyw trzeciej osoby oraz wezwanie nie tylko do słyszenia dźwięku, lecz do uważnego przyjęcia wypowiedzi.
theological_decisions:
- issue: Znaczenie βασιλεία w kontekście eschatologicznym
  choice: królestwo
  alternative: panowanie
  rationale: Przyimek ἐν oraz obraz sprawiedliwych jaśniejących „w” rzeczywistości Ojca przemawiają za ujęciem przestrzenno-sferycznym. „Królestwo” nie wyklucza zarazem czynnego królowania Boga.
- issue: Reprezentatywna liczba pojedyncza w końcowym wezwaniu
  choice: Kto ma uszy, niech słucha
  alternative: Mający uszy, niech słucha
  rationale: Wybrana forma zachowuje pojedyncze, skierowane do każdego człowieka wezwanie, ale brzmi naturalniej we współczesnej polszczyźnie. Nie zmienia go na liczbę mnogą ani nie ogranicza do jednej płci.
translation_notes:
  register: Współczesna, dostojna i przystępna polszczyzna. Zdanie zachowuje eschatologiczny ton, obraz słońca oraz uroczystą formę końcowego wezwania, bez archaizmu „kto ma uszy ku słuchaniu”.
