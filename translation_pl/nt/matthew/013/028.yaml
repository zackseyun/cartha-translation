  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: pl
  text: 'On im powiedział: „Zrobił to nieprzyjaciel”. Wtedy niewolnicy[a] zapytali go: „Czy chcesz więc, żebyśmy poszli i je zebrali?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „słudzy”. Greckie słowo δοῦλοι może, zależnie od kontekstu, oznaczać niewolników albo sługi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: odpowiedział
  rationale: W dialogu czasownik ἔφη wprowadza odpowiedź gospodarza; „odpowiedział” naturalnie oddaje funkcję wypowiedzi w kontekście.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: nieprzyjaciel
  rationale: Greckie wyrażenie dosłownie wskazuje na „wrogiego człowieka”, lecz w naturalnej polszczyźnie rzeczownik „nieprzyjaciel” wystarczająco określa konkretną osobę i zachowuje sens wrogości.
- source_word: τοῦτο ἐποίησεν
  choice: zrobił to
  rationale: Aoryst opisuje dokonany czyn, a polskie „zrobił to” bezpośrednio i naturalnie oddaje czasownik oraz zaimek wskazujący.
- source_word: δοῦλοι
  choice: niewolnicy
  rationale: Termin oznacza osoby pozostające pod władzą pana i może zależnie od kontekstu być oddawany jako „niewolnicy” lub „słudzy”. „Niewolnicy” przejrzyście zachowuje realia społeczne przypowieści; tradycyjna alternatywa została podana w przypisie.
- source_word: Θέλεις
  choice: Czy chcesz
  rationale: Współczesny, prosty odpowiednik pytania o wolę lub życzenie adresata.
- source_word: οὖν
  choice: więc
  rationale: Spójnik wskazuje, że proponowane działanie wynika z wyjaśnienia gospodarza; „więc” zachowuje ten związek.
- source_word: ἀπελθόντες
  choice: żebyśmy poszli
  rationale: 'Imiesłów poprzedzający główną czynność naturalnie przechodzi w polską konstrukcję z „żebyśmy”, zachowując kolejność: pójść, a następnie zebrać.'
- source_word: συλλέξωμεν
  choice: zebrali
  rationale: Czasownik dobrze pasuje do zebrania i usunięcia roślin w rolniczym obrazie przypowieści.
- source_word: αὐτά
  choice: je
  rationale: Zaimek w liczbie mnogiej odsyła do wcześniej wspomnianych chwastów; polskie „je” zachowuje to odniesienie bez jego dopowiadania.
theological_decisions:
- issue: Oddanie δοῦλοι w realiach przypowieści
  choice: niewolnicy
  alternative: słudzy
  rationale: „Niewolnicy” zachowuje zależny status społeczny postaci wobec gospodarza, nie czyniąc z niego odrębnego twierdzenia teologicznego. Ponieważ w polskiej tradycji przekładowej możliwe i częste jest „słudzy”, alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna narracyjna. Zachowano zwięzłość wypowiedzi oraz naturalny tok dialogu; marker przypisu umieszczono bezpośrednio po wyrazie, którego dotyczy.
