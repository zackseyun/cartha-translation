  naturalness: „Czyż wszystkie jego siostry nie są wśród nas?” jest współczesne, naturalne i zachowuje retoryczny charakter pytania. „Ten człowiek” jest idiomatyczny w drugim pytaniu i dobrze oddaje dystans zawarty w demonstratywie.
