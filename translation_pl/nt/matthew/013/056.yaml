  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: pl
  text: Czyż wszystkie jego siostry nie są wśród nas? Skąd więc ten człowiek ma to wszystko?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „krewne”. Greckie słowo oznacza tu zwykle „siostry”, choć ze względu na późniejsze dyskusje teologiczne niektórzy rozumieją je szerzej.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: siostry
  rationale: Zwykłe znaczenie rodzinne najlepiej pasuje do kontekstu, w którym mieszkańcy mówią o rodzinie Jezusa; nie należy zastępować go szerszym określeniem pod wpływem późniejszych sporów teologicznych.
- source_word: οὐχὶ πᾶσαι
  choice: czy wszystkie… nie
  rationale: Konstrukcja tworzy pytanie retoryczne oczekujące odpowiedzi twierdzącej i zachowuje nacisk na wszystkie siostry.
- source_word: πρὸς ἡμᾶς
  choice: mieszkają wśród nas
  rationale: W tym kontekście wyrażenie wskazuje na obecność i przynależność do miejscowej społeczności. Dodane „mieszkają” naturalnie oddaje po polsku sens niezbędny przy orzeczeniu εἰσιν.
- source_word: πόθεν
  choice: skąd
  rationale: Bezpośrednio zachowuje pytanie o źródło lub pochodzenie tego, co Jezus posiada.
- source_word: οὖν
  choice: więc
  rationale: Naturalnie oddaje wynikający z wcześniejszych uwag wniosek mieszkańców.
- source_word: τούτῳ
  choice: 'on'
  rationale: Polskie „on” brzmi naturalnie w pytaniu „Skąd więc on ma…”. Demonstratywny, potencjalnie lekceważący odcień greki jest trudny do zachowania bez nienaturalnego „ten” lub dopowiedzenia „ten człowiek”.
- source_word: ταῦτα πάντα
  choice: to wszystko
  rationale: Naturalny polski odpowiednik liczby mnogiej odnoszącej się zbiorczo do wspomnianej wcześniej mądrości i czynów pełnych mocy.
theological_decisions:
- issue: Charakter wzmianki o siostrach Jezusa
  choice: Przełożyć ἀδελφαὶ w zwykłym znaczeniu jako „siostry”.
  alternative: „krewne” lub „kuzynki”
  rationale: Najbardziej bezpośredni sens greckiego słowa i kontekst rodzinny przemawiają za „siostrami”. Przekład nie powinien rozstrzygać późniejszych debat doktrynalnych przez wprowadzanie szerszego znaczenia do tekstu głównego.
translation_notes:
  register: Współczesny, prosty i godny rejestr. „Mieszkają wśród nas” idiomatycznie wyraża ich stałą obecność w lokalnej społeczności; „to wszystko” naturalnie ujmuje zbiorcze odniesienie do wcześniejszej mądrości i potężnych czynów.
