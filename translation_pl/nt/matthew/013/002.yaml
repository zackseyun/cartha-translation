  terminology: „Łódź”, „brzeg” i „tłum/tłumy” są trafne oraz neutralne. Zapis „Nim/Niego” wielką literą jest spójny z przyjętą konwencją biblijną. Przypis właściwie sygnalizuje zakres αἰγιαλός, nie rozstrzygając go nadmiernie.
