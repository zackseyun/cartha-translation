  source_fidelity: Wymaga drobnej korekty πρὸς αὐτόν. Zwrot „przy Nim” opisuje przede wszystkim położenie, podczas gdy πρός z biernikiem wyraża ruch/skierowanie ku osobie. „Do Niego” oddaje to bezpośrednio. Pozostałe elementy wiernie przekazują tekst grecki, w tym przejście od mnogich „tłumów” do zbiorowego „całego tłumu” oraz skutek wprowadzony przez ὥστε.
