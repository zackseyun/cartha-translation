id: MAT.13.2
reference: Matthew 13:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: pl
  text: I zebrały się do Niego wielkie tłumy, tak że wszedł do łodzi i usiadł, a cały tłum stał na brzegu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „na plaży” albo „nad brzegiem jeziora”.'
    reason: αἰγιαλός może oznaczać brzeg, plażę lub pas lądu bezpośrednio przy wodzie; tekst grecki nie wymaga bardziej szczegółowego określenia.
lexical_decisions:
- source_word: συνήχθησαν
  choice: zebrały się
  rationale: Grecka forma bierna ma tu naturalny sens zgromadzenia się ludzi; polskie „zebrały się” brzmi idiomatycznie i zachowuje ten sens bez sugerowania, że ktoś wyraźnie ich zwołał.
- source_word: πρὸς αὐτόν
  choice: przy Nim
  rationale: Przyimek πρός z biernikiem wskazuje na skierowanie się ku Jezusowi. W tym kontekście „przy Nim” naturalnie oddaje zarówno przybycie do Niego, jak i zgromadzenie się w Jego pobliżu, bez dopowiadania, że tłumy całkowicie Go otoczyły.
- source_word: ὄχλοι πολλοί
  choice: wielkie tłumy
  rationale: Choć πολλοί dosłownie odnosi się do liczby tłumów, naturalne polskie wyrażenie „wielkie tłumy” przekazuje wielką liczbę zgromadzonych ludzi i zachowuje liczbę mnogą greckiego tekstu.
- source_word: ὥστε
  choice: tak że
  rationale: Wyrażenie wprowadza skutek napływu tłumów; „tak że” jasno i naturalnie zachowuje relację wynikową.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: wszedł do łodzi
  rationale: Imiesłów z εἰς πλοῖον oznacza wejście na pokład. „Wszedł do łodzi” jest współczesnym, naturalnym polskim odpowiednikiem, odpowiednim dla niewielkiej jednostki pływającej na jeziorze.
- source_word: καθῆσθαι
  choice: usiadł
  rationale: Polskie „usiadł” zwięźle oddaje zajęcie pozycji siedzącej po wejściu do łodzi.
- source_word: πᾶς ὁ ὄχλος
  choice: cały tłum
  rationale: Mateusz przechodzi od liczby mnogiej do zbiorowego określenia w liczbie pojedynczej; „cały tłum” zachowuje tę zmianę.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: na brzegu
  rationale: αἰγιαλός oznacza brzeg lub pas lądu przy wodzie. „Na brzegu” jest neutralne i naturalne, a wariant bardziej obrazowy podano w przypisie.
- source_word: εἱστήκει
  choice: stał
  rationale: Grecka forma przedstawia tłum pozostający w pozycji stojącej. Czas przeszły „stał” naturalnie opisuje tę scenę po polsku.
theological_decisions: []
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano zmianę z mnogiego „tłumy” na zbiorowe „cały tłum” oraz wynikowy charakter zdania wprowadzonego przez ὥστε. Wielką literę w zaimku „Nim” zastosowano zgodnie z utrwaloną polską konwencją biblijną.
