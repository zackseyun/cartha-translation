  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: pl
  text: 'Tak będzie u kresu tego wieku[a]: aniołowie wyjdą i oddzielą niegodziwych spośród sprawiedliwych.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „przy dopełnieniu się wieku”. Greckie αἰών oznacza tutaj „wiek” lub „epokę”, a nie „świat”.'
    reason: Alternatywa leksykalna objaśniająca sens συντέλεια i αἰών oraz zapobiegająca utożsamieniu tego wyrażenia z końcem fizycznego świata.
lexical_decisions:
- source_word: οὕτως
  choice: Tak
  rationale: Naturalnie wprowadza objaśnienie i wniosek wynikający z przypowieści, zachowując sens „w taki sposób”.
- source_word: ἔσται
  choice: będzie
  rationale: Prosty polski odpowiednik formy przyszłej, idiomatyczny w połączeniu „Tak będzie”.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: przy końcu tego wieku
  rationale: „Koniec” jasno oddaje dojście okresu do kresu, a „wiek” odpowiada αἰών i nie utożsamia tego wyrażenia z fizycznym światem. Zaimek „tego” pomaga współczesnemu czytelnikowi rozumieć „wiek” jako obecną epokę, nie stulecie.
- source_word: ἐξελεύσονται
  choice: wyjdą
  rationale: Bezpośredni i naturalny odpowiednik przyszłej formy ἐξέρχομαι; kontekst określa wyjście aniołów w celu dokonania rozdzielenia.
- source_word: οἱ ἄγγελοι
  choice: aniołowie
  rationale: W obrazie sądu u kresu wieku chodzi o istoty niebiańskie, nie o ludzkich posłańców.
- source_word: ἀφοριοῦσιν
  choice: oddzielą
  rationale: Oddaje czynność wyłączenia jednej grupy z drugiej bez dodawania sposobu ani podstawy rozdziału.
- source_word: τοὺς πονηροὺς
  choice: niegodziwych
  rationale: Przymiotnik użyty rzeczownikowo oznacza ludzi moralnie złych; „niegodziwi” brzmi naturalnie i godnie w kontekście sądu.
- source_word: ἐκ μέσου
  choice: spośród
  rationale: Zwięźle wyraża usunięcie jednej grupy z wnętrza grupy mieszanej.
- source_word: τῶν δικαίων
  choice: sprawiedliwych
  rationale: Tradycyjny, a zarazem nadal zrozumiały polski odpowiednik rzeczownikowego użycia δικαίων.
theological_decisions:
- issue: Znaczenie αἰών w formule eschatologicznej
  choice: wiek rozumiany jako epoka
  alternative: świat
  rationale: Greckie αἰών oznacza tu wiek lub epokę, dlatego przekład nie wprowadza twierdzenia o końcu albo unicestwieniu fizycznego świata, którego samo brzmienie tekstu nie wymaga.
- issue: Tożsamość οἱ ἄγγελοι
  choice: aniołowie niebiańscy
  alternative: posłańcy
  rationale: Kontekst objaśnienia przypowieści i sądu ostatecznego wskazuje na aniołów; jest to rozstrzygnięcie kontekstowo-leksykalne, nie denominacyjne.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie biblijnym rejestrze. Konstrukcja jest zwięzła i zachowuje obraz rozdzielenia dwóch grup. „Niegodziwi” i „sprawiedliwi” tworzą czytelną parę moralną, a przypis chroni istotne rozróżnienie między epoką a światem.
