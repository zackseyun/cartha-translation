source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: pl
  text: Gdy się napełniła, wyciągnęli ją na brzeg, usiedli i zebrali dobre ryby do naczyń[a], a zepsute[b] wyrzucili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pojemników”. Greckie słowo ma znaczenie ogólne i nie musi oznaczać koszy.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „złe” albo „bezwartościowe”. Greckie słowo może oznaczać coś zepsutego, zgniłego lub ogólnie nieprzydatnego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ją
  rationale: Zaimek odnosi się do sieci z poprzedniego wersetu; polski zaimek rodzaju żeńskiego zachowuje to odniesienie bez niezręcznego powtórzenia.
- source_word: ἐπληρώθη
  choice: się napełniła
  rationale: Aoryst bierny opisuje napełnienie sieci; naturalna polska konstrukcja „napełniła się” oddaje sens bez dopowiadania, czym została napełniona.
- source_word: ἀναβιβάσαντες
  choice: wyciągnęli ją
  rationale: Imiesłów opisuje wydobycie sieci z wody na ląd; „wyciągnęli” jest naturalne i zachowuje fizyczny charakter czynności.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: na brzeg
  rationale: αἰγιαλός oznacza brzeg lub wybrzeże; „brzeg” pasuje do sceny połowu i nie zakłada piaszczystej plaży.
- source_word: καθίσαντες
  choice: usiedli
  rationale: Kolejny imiesłów aorystu wyraża następującą czynność; polska forma osobowa zapewnia płynny tok narracji.
- source_word: συνέλεξαν
  choice: zebrali
  rationale: Czasownik oznacza zebranie lub zgromadzenie; „zebrali” naturalnie opisuje sortowanie połowu.
- source_word: τὰ καλά
  choice: dobre ryby
  rationale: Rzeczownik „ryby” jest domyślny z kontekstu; jego dodanie po polsku jasno wskazuje referent, nie zmieniając obrazu.
- source_word: εἰς ἄγγη
  choice: do naczyń
  rationale: ἄγγη to ogólne określenie pojemników lub naczyń. „Naczynia” zachowują szeroki sens i nie zawężają go do koszy.
- source_word: τὰ δὲ σαπρά
  choice: zepsute
  rationale: σαπρός może znaczyć „zepsuty”, „zgniły” lub szerzej „bezwartościowy”. „Zepsute” dobrze pasuje do ryb i zachowuje konkretny obraz, zaś przypis odnotowuje szerszą możliwość.
- source_word: ἔξω ἔβαλον
  choice: wyrzucili
  rationale: Połączenie oznacza wyrzucenie na zewnątrz; polskie „wyrzucili” naturalnie zawiera ten kierunek i siłę odrzucenia.
theological_decisions:
- issue: Interpretacja sortowania w przypowieści
  choice: Werset pozostaje konkretnym opisem sceny rybackiej, bez wprowadzania do tekstu objaśnienia o sądzie.
  alternative: Użyć interpretacyjnego słownictwa zapowiadającego sąd ostateczny.
  rationale: Sam werset przedstawia obraz przypowieści, a jego objaśnienie następuje w kolejnych wersetach. Zachowanie poziomu obrazu nie przesądza interpretacji w tekście przekładu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Dodano podmiot „rybacy”, domyślny z kontekstu liczby mnogiej i sceny połowu, aby uniknąć niejasnego polskiego zdania po zmianie konstrukcji imiesłowowej na osobową. Znaczniki przypisów stoją bezpośrednio przy wyrażeniach, których dotyczą.
