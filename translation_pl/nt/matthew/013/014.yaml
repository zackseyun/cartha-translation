  source_fidelity: Tekst wiernie oddaje konstrukcję spełnienia proroctwa (ἀναπληροῦται αὐτοῖς) jako proces zachodzący „na nich”, bez dopowiadania mechanizmu teologicznego. Oba człony cytatu zachowują przyszły charakter, paralelizm oraz mocną negację οὐ μή przez „nigdy nie”. Rozróżnienie „patrzeć” / „dostrzec” trafnie sygnalizuje kontrast między widzeniem a rzeczywistym postrzeżeniem.
  naturalness: Przekład jest płynny, współczesny i odpowiednio podniosły. „Spełnia się na nich proroctwo Izajasza” jest utrwaloną i naturalną polską formułą biblijną. Użycie „lecz” czytelnie wyraża zamierzony kontrast, choć greka formalnie powtarza καί.
