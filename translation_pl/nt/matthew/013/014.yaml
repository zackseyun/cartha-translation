source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: pl
  text: 'I spełnia się na nich proroctwo Izajasza, które mówi: „Będziecie słyszeć, lecz nigdy nie zrozumiecie; będziecie patrzeć, lecz nigdy nie dostrzeżecie”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Słuchem usłyszycie… i patrząc, będziecie patrzeć” — jest to semicki sposób wyrażenia nacisku, zachowany w greckim cytacie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: spełnia się
  rationale: Czas teraźniejszy strony biernej wskazuje, że proroctwo znajduje spełnienie w opisywanych ludziach. Polskie „spełnia się” jest naturalne w odniesieniu do proroctwa i nie narzuca mocniejszego sensu całkowitego dopełnienia.
- source_word: αὐτοῖς
  choice: na nich
  rationale: Polska konstrukcja „spełnia się na nich” idiomatycznie oddaje celownik wskazujący ludzi, w których przypadku urzeczywistnia się proroctwo.
- source_word: προφητεία Ἠσαΐου
  choice: proroctwo Izajasza
  rationale: Naturalnie i blisko greckiej konstrukcji dopełniaczowej.
- source_word: ἡ λέγουσα
  choice: które mówi
  rationale: Oddaje przydawkowy imiesłów wprowadzający cytat, zachowując naturalną polszczyznę.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Będziecie słyszeć
  rationale: Naturalny przekład semickiej konstrukcji emfatycznej odtworzonej w grece; jej dosłowniejszą postać objaśnia przypis.
- source_word: οὐ μὴ συνῆτε
  choice: lecz nigdy nie zrozumiecie
  rationale: „Nigdy” oddaje stanowczą negację οὐ μή, a „lecz” wyraża kontrast obecny między słyszeniem a brakiem zrozumienia.
- source_word: βλέποντες βλέψετε
  choice: będziecie patrzeć
  rationale: Oddaje czynność wzrokową i zachowuje paralelizm z pierwszym członem; emfatyczną formę grecką odnotowano w przypisie.
- source_word: οὐ μὴ ἴδητε
  choice: lecz nigdy nie dostrzeżecie
  rationale: „Dostrzec” odróżnia samo patrzenie od rzeczywistego rozpoznania, a „nigdy” zachowuje siłę emfatycznej negacji.
theological_decisions:
- issue: Charakter spełnienia proroctwa
  choice: Proroctwo spełnia się na tych ludziach
  alternative: Proroctwo jest przez nich jedynie zilustrowane albo zostaje w nich całkowicie i ostatecznie dopełnione
  rationale: Przekład zachowuje biblijną formułę spełnienia, nie rozstrzygając mechanizmu zatwardzenia ani nie wzmacniając ἀναπληροῦται ponad to, co wymaga kontekst.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano równoległość obu części wypowiedzi oraz rozróżnienie między fizycznym patrzeniem a rzeczywistym dostrzeżeniem. Przypis objaśnia nietypową formę emfatyczną bez obciążania nią tekstu głównego.
