source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: pl
  text: a gdy znalazł jedną perłę wielkiej wartości[a], odszedł, sprzedał wszystko, co miał, i ją kupił.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „drogocenną perłę”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: a gdy znalazł
  rationale: Imiesłów aorystu wyraża czynność wcześniejszą względem głównych czasowników, a δέ ma tu łagodną funkcję łączącą. Konstrukcja „a gdy znalazł” naturalnie oddaje następstwo wydarzeń.
- source_word: ἕνα
  choice: jedną
  rationale: Zachowano wyraźnie obecny w grece liczebnik, podkreślający pojedynczą perłę o wyjątkowej wartości.
- source_word: πολύτιμον
  choice: wielkiej wartości
  rationale: Naturalne, współczesne sformułowanie oddające wysoką wartość; alternatywę „drogocenną” podano w przypisie.
- source_word: μαργαρίτην
  choice: perłę
  rationale: Standardowy polski odpowiednik rzeczownika μαργαρίτης.
- source_word: ἀπελθὼν
  choice: odszedł
  rationale: Grecki imiesłów oddano czasownikiem osobowym, co w języku polskim przejrzyście zachowuje kolejność czynności.
- source_word: πέπρακεν
  choice: sprzedał
  rationale: Perfectum wskazuje na dokonaną sprzedaż; polski czasownik dokonany w czasie przeszłym naturalnie oddaje jej zakończony charakter w narracji.
- source_word: πάντα ὅσα εἶχεν
  choice: wszystko, co miał
  rationale: Idiomaticzny i wierny odpowiednik zachowujący pełny zakres wyrażenia πάντα.
- source_word: ἠγόρασεν
  choice: kupił
  rationale: Prosty, naturalny odpowiednik greckiego czasownika, z zachowaniem aspektu dokonanego.
- source_word: αὐτόν
  choice: ją
  rationale: Zaimek odnosi się do rzeczownika „perła”, który w języku polskim jest rodzaju żeńskiego; dlatego właściwą formą jest „ją”.
theological_decisions: []
