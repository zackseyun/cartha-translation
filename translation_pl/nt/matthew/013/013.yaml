id: MAT.13.13
reference: Matthew 13:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: pl
  text: Dlatego mówię do nich w przypowieściach, ponieważ widząc, nie widzą, a słysząc, nie słyszą ani nie rozumieją.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ponieważ choć widzą, nie widzą, a choć słyszą, nie słyszą ani nie rozumieją”.'
    reason: Imiesłowy greckie mogą w tym kontekście mieć sens przyzwalający, ale można je również oddać bardziej formalnie, jak w tekście głównym.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dlatego
  rationale: Zwięźle i naturalnie oddaje przyczynowe „z tego powodu”, nie wzmacniając go do czysto wnioskowego „zatem”.
- source_word: ἐν παραβολαῖς
  choice: w przypowieściach
  rationale: Zachowuje obraz sposobu nauczania wyrażony przez ἐν z celownikiem i odpowiada utrwalonemu, nadal naturalnemu polskiemu sformułowaniu.
- source_word: λαλῶ
  choice: mówię
  rationale: Oddaje czas teraźniejszy i ma neutralny, współczesny rejestr.
- source_word: ὅτι
  choice: ponieważ
  rationale: W tym zdaniu spójnik wprowadza przyczynę mówienia w przypowieściach.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: widząc, nie widzą
  rationale: Zachowuje formalny paradoks i gramatyczną otwartość imiesłowu bez dopowiadania, czy relacja jest wyraźnie przyzwalająca.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: słysząc, nie słyszą
  rationale: Zachowuje paralelizm poprzedniego członu oraz rozróżnienie między odbiorem zmysłowym a rzeczywistym uchwyceniem sensu.
- source_word: οὐδὲ συνίουσιν
  choice: ani nie rozumieją
  rationale: Naturalnie kontynuuje szereg zaprzeczeń, a „rozumieją” jasno oddaje brak uchwycenia znaczenia.
theological_decisions:
- issue: Funkcja imiesłowów βλέποντες i ἀκούοντες
  choice: „widząc” i „słysząc”, bez jawnego dodania „choć”
  alternative: „choć widzą” i „choć słyszą”
  rationale: Greckie imiesłowy w kontekście mogą mieć odcień przyzwolenia, lecz nie jest on oznaczony osobnym spójnikiem. Tekst główny zachowuje zatem formalną niejednoznaczność i paradoks, a możliwe odczytanie przyzwalające podaje przypis.
- issue: Znaczenie συνίουσιν
  choice: „rozumieją”
  alternative: „pojmują”
  rationale: „Rozumieją” naturalnie wskazuje na nieuchwycenie sensu tego, co widziane i słyszane, nie przesądzając ponad tekst o dokładnej naturze lub przyczynie tego braku.
translation_notes:
  register: Współczesny, godny i zrozumiały język. Celowo zachowano retoryczny paralelizm oraz paradoks „widząc, nie widzą / słysząc, nie słyszą”; przecinki przy imiesłowowych równoważnikach są zgodne z polską normą.
