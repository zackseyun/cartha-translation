  terminology: „Żniwo”, „żniwiarze”, „chwasty”, „wiązki” i „spichlerz” są trafne w obrazie rolniczym. Przypis przy „chwastach” słusznie zachowuje możliwość bardziej specyficznego „kąkol”, nie narzucając identyfikacji jako jedynej pewnej. Kotwica przypisu jest umieszczona przy właściwym wyrazie.
