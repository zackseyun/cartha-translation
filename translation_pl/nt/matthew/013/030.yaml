  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: pl
  text: 'Niech jedno i drugie rośnie razem aż do żniwa. A w porze żniwa powiem żniwiarzom: „Najpierw zbierzcie chwasty[a] i zwiążcie je w wiązki, żeby je spalić, pszenicę zaś zgromadźcie w moim spichlerzu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „kąkol”; chodzi o chwast podobny do pszenicy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: Niech jedno i drugie rośnie razem
  rationale: Konstrukcja z „niech” naturalnie oddaje przyzwalający rozkaz ἄφετε, a „jedno i drugie” zachowuje odniesienie ἀμφότερα do dwóch rodzajów roślin bez dodawania ich nazw.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: aż do żniwa
  rationale: „Żniwo” wskazuje na określony moment zbioru w przypowieści i zachowuje liczbę pojedynczą greckiego rzeczownika.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: w porze żniwa
  rationale: Oddaje καιρός jako właściwą porę lub wyznaczony czas, a zarazem brzmi naturalnie po polsku.
- source_word: θερισταῖς
  choice: żniwiarzom
  rationale: To precyzyjny, utrwalony polski odpowiednik osób dokonujących żniwa.
- source_word: τὰ ζιζάνια
  choice: chwasty
  rationale: Ogólne „chwasty” jest zrozumiałe dla współczesnego czytelnika; możliwą dokładniejszą identyfikację botaniczną zachowano w przypisie.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: zwiążcie je w wiązki
  rationale: Zachowuje konkretną czynność wiązania oraz rezultat wyrażony przez εἰς δέσμας, bez sugerowania, że chwasty układano w snopy zboża.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: żeby je spalić
  rationale: Naturalnie oddaje konstrukcję celu; nie wzmacnia jej interpretacyjnie ponad obraz przypowieści.
- source_word: τὸν δὲ σῖτον συναγάγετε
  choice: pszenicę zaś zgromadźcie
  rationale: „Zaś” wyraźnie zachowuje przeciwstawienie δέ, a „zgromadźcie” odróżnia συναγάγετε od wcześniejszego συλλέξατε.
- source_word: εἰς τὴν ἀποθήκην μου
  choice: w moim spichlerzu
  rationale: W kontekście zbioru zboża „spichlerz” jest naturalnym i konkretnym odpowiednikiem ἀποθήκη.
theological_decisions:
- issue: Obraz ostatecznego rozdzielenia w przypowieści
  choice: Zachowano wyłącznie rolniczy obraz chwastów, ognia, pszenicy i spichlerza.
  alternative: Objaśnić w samym wersecie chwasty jako ludzi przeznaczonych na sąd, a ogień jako ostateczną karę.
  rationale: Interpretacja obrazu pojawia się później w rozdziale; ten werset powinien zachować formę przypowieści i nie uprzedzać jej objaśnienia.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano rytm bezpośredniej wypowiedzi gospodarza oraz wyraźne przeciwstawienie losu chwastów i pszenicy.
