  source_fidelity: 'Przekład wiernie oddaje kolejność i sens greckiego tekstu: przyzwalający rozkaz („Niech”), wspólny wzrost obu roślin do żniwa, polecenie skierowane do żniwiarzy, uprzednie zebranie i związanie chwastów w celu spalenia oraz przeciwstawne zgromadzenie pszenicy w spichlerzu gospodarza. „W porze żniwa” trafnie oddaje ἐν καιρῷ τοῦ θερισμοῦ bez nieuzasadnionego dopowiadania interpretacji eschatologicznej.'
