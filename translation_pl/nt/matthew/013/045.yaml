  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: pl
  text: I znowu królestwo niebios podobne jest do kupca[a], który szuka pięknych pereł.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „do człowieka, kupca, szukającego pięknych pereł”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: I znowu
  rationale: Wprowadza kolejne porównanie w szeregu przypowieści. „I znowu” naturalnie podtrzymuje tok wypowiedzi i zachowuje powtórzeniowy sens greckiego wyrazu.
- source_word: ὁμοία ἐστὶν
  choice: podobne jest do
  rationale: Naturalny i utrwalony polski sposób wyrażenia porównania w przypowieści.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Zachowuje charakterystyczne dla Mateusza określenie i brzmi naturalnie we współczesnej, podniosłej polszczyźnie.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: do kupca
  rationale: Rzeczownik ἔμπορος wystarczająco określa osobę, dlatego powtórzenie „człowieka, kupca” byłoby w tekście głównym nienaturalne; pełniejszą formę grecką odnotowano w przypisie.
- source_word: ζητοῦντι
  choice: który szuka
  rationale: Zdanie względne jest naturalniejsze po polsku niż imiesłów i zachowuje trwającą czynność wyrażoną greckim imiesłowem czasu teraźniejszego.
- source_word: καλοὺς μαργαρίτας
  choice: pięknych pereł
  rationale: καλός wskazuje tu na cenioną jakość i piękno pereł. „Piękne perły” jest zwięzłe i naturalne, a zarazem nie dopowiada wprost ich wartości pieniężnej.
theological_decisions:
- issue: Zakres porównania w formule przypowieści
  choice: Królestwo zostaje bezpośrednio porównane do kupca.
  alternative: Królestwo jest podobne do całej sytuacji, w której kupiec szuka pięknych pereł.
  rationale: Konstrukcja ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ wskazuje gramatycznie na kupca jako bezpośredni człon porównania. Przekład nie zawęża jednak znaczenia całej przypowieści, której obraz rozwija się w następnym wersecie.
translation_notes:
  register: Język współczesny, zwięzły i godny. Szyk „podobne jest” zachowuje lekko podniosły rejestr biblijny, pozostając czytelnym dla współczesnego odbiorcy.
