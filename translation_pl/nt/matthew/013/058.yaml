  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: pl
  text: I nie uczynił tam wielu dzieł mocy z powodu ich niewiary[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „wielu cudów” lub „wielu potężnych czynów”. Greckie wyrażenie oznacza czyny objawiające moc, a w tym kontekście odnosi się do cudownych dzieł.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: I nie dokonał
  rationale: Καί kontynuuje narrację, a οὐκ przeczy czasownikowi w aoryście. „Nie dokonał” naturalnie łączy się po polsku z „dziełami mocy” i opisuje brak działania, nie niezdolność.
- source_word: ἐκεῖ
  choice: tam
  rationale: Prosty przysłówek miejsca, odnoszący się do rodzinnych stron Jezusa w bezpośrednim kontekście.
- source_word: δυνάμεις πολλὰς
  choice: wielu dzieł mocy
  rationale: W kontekście Ewangelii δύναμις oznacza przejaw mocy, zwłaszcza cudowny czyn. „Dzieła mocy” zachowują związek tego rzeczownika z mocą, a πολλὰς oddano jako „wielu”.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: z powodu ich niewiary
  rationale: Διά z biernikiem wskazuje tu przyczynę. Ἀπιστία wyraża niewiarę lub brak wiary; „niewiara” zachowuje wyraźnie negatywny sens rzeczownika i pasuje do kontekstu odrzucenia.
theological_decisions:
- issue: Czy werset mówi o niemożności dokonania cudów, czy o niedokonaniu ich w reakcji na niewiarę
  choice: „nie dokonał tam wielu dzieł mocy”
  alternative: „nie mógł tam dokonać wielu cudów”
  rationale: Grecki tekst Mateusza ma οὐκ ἐποίησεν („nie uczynił/nie dokonał”), a nie wyrażenie oznaczające niemożność. Przekład pozostaje na poziomie stwierdzenia o działaniu i nie rozstrzyga szerzej teologicznej relacji między niewiarą ludzi a mocą Jezusa.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Wyrażenie „dzieła mocy” jest nieco podniosłe, ale czytelne i zachowuje ważny związek leksykalny greckiego rzeczownika z mocą; przypis podaje bardziej potoczne „cuda”.
