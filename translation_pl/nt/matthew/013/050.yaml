id: MAT.13.50
reference: Matthew 13:50
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: pl
  text: i wrzucą ich do ognistego pieca[a]. Tam będzie płacz i zgrzytanie zębów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „do pieca ognia”.'
    reason: Greka zawiera konstrukcję dopełniaczową κάμινον τοῦ πυρός; tekst główny podaje jej naturalny polski odpowiednik.
lexical_decisions:
- source_word: βαλοῦσιν
  choice: wrzucą
  rationale: Forma przyszła czasownika βάλλω oznacza tu gwałtowne umieszczenie kogoś wewnątrz pieca. „Wrzucą” jest naturalne we współczesnej polszczyźnie i zachowuje siłę obrazu.
- source_word: αὐτοὺς
  choice: ich
  rationale: Zaimek w bierniku liczby mnogiej odnosi się do złych ludzi wspomnianych w poprzednim kontekście.
- source_word: κάμινον τοῦ πυρός
  choice: ognistego pieca
  rationale: Grecka konstrukcja dosłownie brzmi „pieca ognia”. Polski zwrot „ognisty piec” naturalnie oddaje ten obraz, nie osłabiając jego konkretności.
- source_word: ἐκεῖ
  choice: Tam
  rationale: Zwięzły polski przysłówek miejsca wiernie oddaje emfatyczne wskazanie ἐκεῖ.
- source_word: ἔσται
  choice: będzie
  rationale: Czas przyszły czasownika εἰμί zostaje oddany zwykłą polską konstrukcją egzystencjalną.
- source_word: ὁ κλαυθμός
  choice: płacz
  rationale: „Płacz” trafnie oddaje lament i jest naturalnym rzeczownikiem w utrwalonej formule Mateuszowej.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: zgrzytanie zębów
  rationale: To trafne i utrwalone w polszczyźnie biblijnej oddanie wyrażenia opisującego udrękę w obliczu sądu.
theological_decisions:
- issue: Obraz sądu w kontekście eschatologicznym
  choice: Zachować konkretne obrazy ognistego pieca, płaczu i zgrzytania zębów bez łagodzenia ani objaśniającej parafrazy.
  alternative: Oddać końcową część opisowo, np. „tam ludzie będą płakać i zgrzytać zębami z udręki”.
  rationale: Tekst przedstawia mocny obraz sądu w objaśnieniu przypowieści. Przekład nie powinien rozstrzygać ponad tekst charakteru tego obrazu ani osłabiać jego siły.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Zachowano rozpoznawalną formułę Mateuszową „płacz i zgrzytanie zębów”, unikając zarówno archaizacji, jak i interpretacyjnego rozwijania obrazu.
