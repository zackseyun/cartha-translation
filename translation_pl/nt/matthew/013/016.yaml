  terminology: Dla μακάριοι bezpieczniejszym i bardziej ustalonym odpowiednikiem jest „błogosławione”. Nie narzuca on szczegółowej interpretacji teologicznej, a lepiej zachowuje rejestr oraz sens pomyślnego, uprzywilejowanego stanu niż „szczęśliwe”.
