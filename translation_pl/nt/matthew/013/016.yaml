  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: pl
  text: Lecz błogosławione są wasze oczy, ponieważ widzą, i wasze uszy, ponieważ słyszą.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też przetłumaczyć: „bo widzą… bo słyszą”. Grecki spójnik dopuszcza tu oba sposoby oddania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: Oddaje kontrast wobec poprzedzającej wypowiedzi o tych, którzy patrzą, a nie widzą, i słuchają, a nie słyszą.
- source_word: μακάριοι
  choice: szczęśliwe
  rationale: W odniesieniu do oczu i uszu brzmi naturalnie po polsku i wyraża godny uznania, uprzywilejowany stan, nie sprowadzając sensu jedynie do chwilowej emocji.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: wasze oczy
  rationale: Naturalny polski odpowiednik greckiej konstrukcji dzierżawczej.
- source_word: ὅτι βλέπουσιν
  choice: ponieważ widzą
  rationale: ὅτι najprawdopodobniej podaje tu przyczynę; przekład zachowuje prosty czasownik zmysłowy.
- source_word: τὰ ὦτα ὑμῶν
  choice: wasze uszy
  rationale: Naturalny polski odpowiednik, zachowujący równoległość z „wasze oczy”.
- source_word: ὅτι ἀκούουσιν
  choice: ponieważ słyszą
  rationale: Oddaje prawdopodobny sens przyczynowy ὅτι oraz prostotę greckiego czasownika.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: widzą / słyszą
  rationale: Dosłowne czasowniki zmysłowe pozostawiają kontekstowi wskazanie ich głębszego, duchowego wymiaru.
theological_decisions:
- issue: Czy uczynić widzenie i słyszenie wyraźnie duchowymi
  choice: Zachować dosłowne „widzą” i „słyszą”.
  alternative: „rozpoznają” i „rozumieją”
  rationale: Sam werset posługuje się językiem zmysłów; kontekst nadaje mu głębszy wymiar. Dopowiedzenie „rozumieją” rozstrzygałoby napięcie obecne w tekście.
- issue: Znaczenie μακάριοι
  choice: „szczęśliwe”
  alternative: „błogosławione”
  rationale: Greckie μακάριοι określa pomyślny, uprzywilejowany stan. „Szczęśliwe” jest naturalne w połączeniu z oczami i uszami, a zarazem nie przesądza, że chodzi o formalny akt błogosławienia.
translation_notes:
  register: Współczesny, godny i zrozumiały język polski. Zachowano paralelizm oczu i uszu oraz dosłowne czasowniki „widzieć” i „słyszeć”. Marker przypisu umieszczono po całym zdaniu, ponieważ uwaga dotyczy obu równoległych wystąpień ὅτι.
