  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: pl
  text: Gdy jednak wzeszło słońce, zostało przypalone, a ponieważ nie miało korzenia, uschło[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wyschło”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Gdy jednak wzeszło słońce
  rationale: Konstrukcja dopełniacza absolutnego wyraża okoliczność czasową, a „jednak” oddaje łagodny kontrast wprowadzany przez δέ.
- source_word: ἐκαυματίσθη
  choice: zostało przypalone
  rationale: Strona bierna czasownika καυματίζω wskazuje na uszkodzenie żarem; „przypalone” brzmi naturalnie w odniesieniu do młodej rośliny i nie sugeruje całkowitego spalenia.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ponieważ nie miało
  rationale: διά z urzeczownikowionym bezokolicznikiem wyraża przyczynę; polskie zdanie przyczynowe wiernie i naturalnie oddaje tę relację.
- source_word: ῥίζαν
  choice: korzenia
  rationale: Zachowano liczbę pojedynczą tekstu greckiego; zwrot „nie miało korzenia” jest naturalny po polsku.
- source_word: ἐξηράνθη
  choice: uschło
  rationale: W kontekście rośliny ξηραίνω oznacza uschnięcie lub wyschnięcie. „Uschło” najtrafniej oddaje obumarcie rośliny, natomiast wariant leksykalny podano w przypisie.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny rejestr. Nijaka liczba pojedyncza („zostało”, „miało”, „uschło”) nawiązuje do domyślnego ziarna lub tego, co wyrosło, zgodnie z grecką liczbą pojedynczą.
