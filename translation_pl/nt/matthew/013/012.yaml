id: MAT.13.12
reference: Matthew 13:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: pl
  text: Bo kto ma, temu będzie dane i będzie miał w obfitości[a]; kto zaś nie ma, temu zostanie odebrane nawet to, co ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „zostanie mu dane i będzie obfitował”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: kto
  rationale: Nieokreślony zaimek względny wyraża ogólną zasadę. Polskie „kto” naturalnie zachowuje sens odnoszący się do każdego człowieka z osobna.
- source_word: γὰρ
  choice: bo
  rationale: Spójnik wprowadza uzasadnienie poprzedniej wypowiedzi; „bo” zachowuje tę funkcję i brzmi naturalnie we współczesnej polszczyźnie.
- source_word: ἔχει
  choice: ma
  rationale: Zachowano prosty czasownik posiadania oraz niewypowiedziany przedmiot, tak jak w tekście greckim.
- source_word: δοθήσεται αὐτῷ
  choice: temu będzie dane
  rationale: Przyszła forma bierna z celownikiem oznacza, że dana osoba coś otrzyma. Nie dodano wprost „więcej”, ponieważ greka pozostawia przedmiot niewyrażony, a dalszy człon wskazuje na obfitość.
- source_word: περισσευθήσεται
  choice: będzie miał w obfitości
  rationale: Czasownik wyraża osiągnięcie stanu obfitości. Takie sformułowanie jest naturalniejsze po polsku niż dosłowne „będzie obfitował”, a zachowuje rezultat opisany w grece.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje kontrast między dwiema częściami sentencji w stylu godnym, lecz współczesnym.
- source_word: οὐκ ἔχει
  choice: nie ma
  rationale: Bezpośrednio oddaje zaprzeczone posiadanie, nadal bez dopowiadania jego przedmiotu.
- source_word: καὶ
  choice: nawet
  rationale: 'Spójnik ma tu sens wzmacniający i podkreśla paradoks: odebrane będzie nawet to, co dana osoba już ma.'
- source_word: ὃ ἔχει
  choice: to, co ma
  rationale: Naturalny polski odpowiednik greckiej konstrukcji względnej, bez określania, czym jest posiadana rzecz.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: temu zostanie odebrane
  rationale: Przyszła forma bierna αἴρω z ἀπό wyraża odebranie lub usunięcie czegoś od danej osoby. Polska konstrukcja bezosobowo-bierna zachowuje ten sens.
theological_decisions:
- issue: Niewyrażony przedmiot czasowników „ma” i „będzie dane”
  choice: Pozostawiono przedmiot niewskazany.
  alternative: Doprecyzowanie go jako zrozumienia, otwartości na naukę lub poznania tajemnic królestwa.
  rationale: Kontekst wiąże wypowiedź z przyjmowaniem nauczania Jezusa, lecz tekst grecki nie nazywa przedmiotu. Niedopowiedzenie zachowuje szerokość i napięcie sentencji.
- issue: Grecki rodzaj męski liczby pojedynczej w αὐτῷ i αὐτοῦ
  choice: Oddano konstrukcją „kto… temu”, która w polszczyźnie ma naturalnie ogólne odniesienie.
  alternative: Użycie form „jemu” i „od niego”.
  rationale: Polskie „kto… temu” wiernie zachowuje liczbę pojedynczą i reprezentatywny, ogólny charakter wypowiedzi bez niepotrzebnego uwydatniania rodzaju gramatycznego.
translation_notes:
  register: Współczesna, zwięzła i godna polszczyzna o charakterze sentencjonalnym. Paralelizm „kto ma… kto zaś nie ma” odtwarza budowę greckiego zdania; nie dopowiedziano przedmiotu posiadania.
