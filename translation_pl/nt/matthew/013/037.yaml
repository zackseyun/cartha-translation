source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: pl
  text: 'On zaś odpowiedział: „Tym, który sieje dobre ziarno, jest Syn Człowieczy[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Syn Człowieka”. Grecki tytuł nawiązuje do Księgi Daniela 7; w tekście zachowano utrwaloną polską formę „Syn Człowieczy” ze względu na jej ewangeliczne i teologiczne znaczenie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Grecka konstrukcja imiesłowu z czasownikiem osobowym dosłownie znaczy „odpowiedziawszy, powiedział”, lecz naturalnym polskim odpowiednikiem wprowadzającym odpowiedź jest jedno słowo „odpowiedział”.
- source_word: Ὁ σπείρων
  choice: Tym, który sieje
  rationale: Rzeczownikowo użyty imiesłów czasu teraźniejszego identyfikuje osobę przez wykonywaną czynność; ta forma zachowuje objaśniający charakter wypowiedzi.
- source_word: τὸ καλὸν σπέρμα
  choice: dobre ziarno
  rationale: καλός oznacza tu to, co dobre i właściwe; σπέρμα jest rzeczownikiem zbiorowym w liczbie pojedynczej, co naturalnie oddaje polskie „ziarno”.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: To utrwalony w polskiej tradycji biblijnej tytuł Jezusa, zachowujący związek z Księgą Daniela 7 i jego znaczenie w Ewangeliach.
theological_decisions:
- issue: Oddanie chrystologicznego tytułu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn Człowieka / Człowiek
  rationale: „Syn Człowieczy” zachowuje rozpoznawalny tytuł, jego kanoniczne powiązania i teologiczną doniosłość, nie sprowadzając go do ogólnego określenia istoty ludzkiej.
translation_notes:
  register: Współczesny, godny i jasno objaśniający rejestr. Inwersja „Tym, który sieje…, jest…” naturalnie podkreśla identyfikację siewcy, zgodnie z grecką konstrukcją.
