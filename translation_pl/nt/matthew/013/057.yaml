id: MAT.13.57
reference: Matthew 13:57
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: pl
  text: 'I gorszyli się Nim[a]. Jezus zaś powiedział im: „Prorok nigdzie nie jest pozbawiony czci, z wyjątkiem swojej rodzinnej miejscowości[b] i własnego domu[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „I czuli się Nim urażeni”; dosłownie zwrot ten nawiązuje do potknięcia się z Jego powodu.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „ojczyzny” lub „rodzinnych stron”.'
    reason: lexical_alternative
  - marker: c
    text: Greckie słowo może oznaczać dom jako miejsce albo domowników i krąg rodzinny.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: gorszyli się Nim
  rationale: Naturalny polski zwrot zachowuje idiomatyczny sens reakcji odrzucenia i urazy wobec Jezusa, a zarazem pozostaje blisko obrazu zawartego w czasowniku σκανδαλίζω.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jezus zaś powiedział im
  rationale: „Zaś” oddaje łagodny kontrast wprowadzany przez δέ i brzmi naturalnie w podniosłej, lecz współczesnej polszczyźnie.
- source_word: προφήτης
  choice: prorok
  rationale: Bezpośredni, utrwalony odpowiednik zachowujący przysłowiowy charakter wypowiedzi.
- source_word: ἄτιμος
  choice: pozbawiony czci
  rationale: Oddaje kategorię czci i hańby oraz pozwala zachować retoryczną konstrukcję przeczącą greckiego zdania.
- source_word: εἰ μὴ
  choice: z wyjątkiem
  rationale: Wyraźnie sygnalizuje wyjątek i naturalnie łączy się z polską konstrukcją „nigdzie nie... z wyjątkiem”.
- source_word: πατρίδι
  choice: rodzinnej miejscowości
  rationale: W kontekście Nazaretu chodzi o miejsce pochodzenia, niekoniecznie o ojczyznę w sensie całego kraju. Wybór unika anachronicznego zabarwienia słowa „miasto”.
- source_word: οἰκίᾳ αὐτοῦ
  choice: własnego domu
  rationale: „Dom” zachowuje w polszczyźnie dwuznaczność między miejscem zamieszkania a domownikami lub kręgiem rodzinnym, obecną w οἰκία.
theological_decisions:
- issue: Zakres przysłowia Jezusa o odrzuceniu proroka
  choice: Zachować ogólną sentencję o braku czci w rodzinnym środowisku proroka.
  alternative: Objaśnić ją w tekście jako wypowiedź odnoszącą się konkretnie do niewiary krewnych Jezusa.
  rationale: Grecki tekst przedstawia przysłowie zastosowane do bieżącej sytuacji, ale nie rozwija w tym wersecie szerszego twierdzenia doktrynalnego ani nie ogranicza „domu” wyłącznie do rodziny.
translation_notes:
  register: Współczesna, godna polszczyzna. Konstrukcja „nigdzie nie jest... z wyjątkiem” zachowuje paradoksalną formę sentencji. Wielka litera w zaimku „Nim” odpowiada częstej polskiej praktyce biblijnej, bez dodawania treści interpretacyjnej.
