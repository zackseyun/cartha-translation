  verdict: approve
  source_fidelity: Tekst wiernie oddaje grecką wypowiedź. „Gorszyli się Nim” trafnie przekazuje idiom ἐσκανδαλίζοντο ἐν αὐτῷ jako reakcję urazy/zgorszenia, bez dosłownego rozumienia potknięcia. „Jezus zaś” właściwie sygnalizuje łagodny kontrast δέ. Sentencja zachowuje zarówno przysłowiową formę, jak i semantykę ἄτιμος („pozbawiony czci”) oraz wyjątek obejmujący πατρίς i οἰκία.
  naturalness: Brzmienie jest współczesne, godne i naturalne dla polskiego przekładu biblijnego. Konstrukcja „nigdzie nie jest pozbawiony czci, z wyjątkiem…” poprawnie i idiomatycznie odtwarza grecką konstrukcję negacji z wyjątkiem. „Rodzinna miejscowość” dobrze pasuje do lokalnego kontekstu i nie zawęża terminu do miasta.
  terminology: '„Prorok”, „pozbawiony czci”, „rodzinna miejscowość” i „własny dom” są trafne. „Dom” słusznie zachowuje niedookreślenie οἰκία: może wskazywać zarówno miejsce zamieszkania, jak i domowników czy krąg rodzinny. Przypisy są właściwie zakotwiczone i przekazują istotne alternatywy bez narzucania interpretacji.'
