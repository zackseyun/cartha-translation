id: MAT.13.38
reference: Matthew 13:38
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: pl
  text: Polem jest świat. Dobre ziarno to synowie królestwa[b], chwasty[a] zaś to synowie Złego[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dokładniej może chodzić o życicę roczną — chwast podobny do pszenicy; tradycyjnie: „kąkol”.'
    reason: lexical_alternative
  - marker: b
    text: „Synowie” to tutaj relacyjne określenie ludzi należących do królestwa; nie ogranicza się ono wyłącznie do mężczyzn.
    reason: cultural_note
  - marker: c
    text: 'Możliwe także: „zła”, choć kontekst mocniej przemawia za osobowym „Złego”.'
    reason: translation_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: pole
  rationale: Podstawowe i naturalne określenie pola uprawnego w kontekście przypowieści.
- source_word: κόσμος
  choice: świat
  rationale: Oddaje szeroki zakres κόσμος jako przestrzeni, w której dokonuje się siew.
- source_word: καλὸν σπέρμα
  choice: dobre ziarno
  rationale: Zachowuje rolniczy obraz oraz wyraźny kontrast z chwastami.
- source_word: οὗτοί εἰσιν
  choice: to synowie
  rationale: Naturalna polska konstrukcja identyfikująca ludzi przedstawionych wcześniej zbiorowym rzeczownikiem „ziarno”.
- source_word: υἱοὶ τῆς βασιλείας
  choice: synowie królestwa
  rationale: Zachowuje dosłowny, relacyjny idiom tekstu greckiego; jego reprezentatywny sens objaśnia przypis.
- source_word: ζιζάνια
  choice: chwasty
  rationale: Współczesne i zrozumiałe określenie; dokładniejszą identyfikację botaniczną podano w przypisie.
- source_word: τοῦ πονηροῦ
  choice: Złego
  rationale: Rodzajnik i kontekst kontrastujących ze sobą grup przemawiają za osobowym odniesieniem. Wielka litera jasno sygnalizuje tę interpretację, bez dodawania imienia niewystępującego w wersecie.
theological_decisions:
- issue: Czy τοῦ πονηροῦ oznacza osobowego „Złego”, czy bezosobowe „zło”
  choice: Złego
  alternative: zła
  rationale: Forma gramatyczna może sama w sobie dopuszczać odczytanie osobowe lub bezosobowe, lecz w tym objaśnieniu przypowieści konstrukcja „synowie Złego” i kontrast między grupami wyraźniej wspierają odniesienie osobowe. Alternatywę zachowano w przypisie.
- issue: Czy υἱοί oddać jako „synowie”, czy szerzej jako „dzieci”
  choice: synowie
  alternative: dzieci
  rationale: Przekład zachowuje męski rzeczownik użyty w grece oraz jego idiomatyczny sens przynależności. Przypis wyjaśnia, że określenie obejmuje ludzi należących do danej rzeczywistości, a nie wyłącznie mężczyzn.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Krótkie zdania zachowują rytm kolejnych objaśnień przypowieści. Konstrukcja „Dobre ziarno to…” jest naturalniejsza po polsku niż dosłowne „dobre ziarno — ci są…”, a zarazem zachowuje przejście od obrazu do oznaczanych nim ludzi.
