base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: pl
  text: 'Przedstawił im inną przypowieść, mówiąc: „Królestwo niebios jest podobne[a] do człowieka, który zasiał dobre ziarno na swoim polu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zostało przyrównane”. Grecki czasownik ma formę aorystu strony biernej, lecz w formule wprowadzającej przypowieść naturalnie oddaje się go jako: „jest podobne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: inną przypowieść
  rationale: Wyrażenie wprowadza kolejną przypowieść w tym samym ciągu nauczania; „inną przypowieść” jest naturalne i zachowuje tok narracji.
- source_word: παρέθηκεν αὐτοῖς
  choice: przedłożył im
  rationale: Czasownik παρατίθημι oznacza tutaj przedstawienie czegoś słuchaczom. „Przedłożył im” zachowuje obraz stawiania treści przed odbiorcami, a zarazem pasuje do podniosłego, lecz współczesnego rejestru.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów bezpośrednio łączy wprowadzenie przypowieści z wypowiedzią Jezusa.
- source_word: Ὡμοιώθη
  choice: jest podobne[a]
  rationale: W formule rozpoczynającej przypowieść polskie „jest podobne” naturalnie wyraża ustanowione porównanie. Przypis zachowuje informację o biernej i aorystycznej postaci greckiego czasownika.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  rationale: „Królestwo niebios” jest utrwalonym, zrozumiałym odpowiednikiem charakterystycznego dla Mateusza wyrażenia i zachowuje liczbę mnogą οὐρανῶν.
- source_word: ἀνθρώπῳ
  choice: do człowieka
  rationale: Rzeczownik odnosi się w przypowieści do mężczyzny, lecz polskie „człowiek” jest tu naturalnym określeniem postaci i nie zaciera jej roli.
- source_word: σπείραντι
  choice: który zasiał
  rationale: Zdanie względne naturalnie oddaje imiesłów aorystu i przedstawia dokonany zasiew.
- source_word: καλὸν σπέρμα
  choice: dobre ziarno
  rationale: καλός wskazuje tutaj na dobrą jakość ziarna i przygotowuje kontrast z chwastem w dalszej części przypowieści.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: na swoim polu
  rationale: W polszczyźnie sieje się „na polu”; zaimek „swoim” jednoznacznie odnosi pole do podmiotu czynności.
theological_decisions:
- issue: Oddanie Mateuszowej formuły ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  alternative: Królestwo nieba
  rationale: Liczba mnoga „niebios” zachowuje charakterystyczną formę greckiego wyrażenia, nie przesądzając dodatkowych kwestii dotyczących natury Bożego panowania.
- issue: Siła formy Ὡμοιώθη we wprowadzeniu przypowieści
  choice: jest podobne
  alternative: zostało przyrównane
  rationale: W tym formule parabolicznej sens polega na ustanowieniu porównania, a niekoniecznie na czasowej przemianie królestwa. Naturalna polska forma nie wprowadza twierdzenia, że królestwo dopiero zaczęło być podobne, zaś stronę bierną greki odnotowuje przypis.
translation_notes:
  register: Współczesna, godna polszczyzna z umiarkowanie podniosłym „przedłożył”. Zachowano Mateuszowe „Królestwo niebios”, a składnię wypowiedzi uproszczono tylko tam, gdzie wymaga tego naturalny polski idiom.
