  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: pl
  text: Gdy zaś zasiew wzeszedł i wydał ziarno, wtedy ukazały się także chwasty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „kąkol”; możliwe, że chodzi o konkretny chwast, na przykład życicę roczną.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Kiedy zaś
  rationale: ὅτε wprowadza zdanie czasowe, a δέ jest łagodnym łącznikiem sygnalizującym dalszy tok opowiadania i lekki kontrast.
- source_word: ἐβλάστησεν
  choice: wyrosły
  rationale: Czasownik βλαστάνω oznacza wypuszczanie pędów lub wzrastanie; w naturalnej polszczyźnie rolniczej „wyrosły” dobrze opisuje pojawienie się zasiewu nad ziemią.
- source_word: ὁ χόρτος
  choice: rośliny
  rationale: χόρτος może oznaczać trawę lub roślinność; w kontekście pola odnosi się do wzrastającego zasiewu. „Rośliny” nie precyzuje gatunku przed wzmianką o ziarnie.
- source_word: καρπὸν ἐποίησεν
  choice: wydały ziarno
  rationale: Dosłownie „uczyniły owoc”; w kontekście zboża chodzi o wydanie plonu, a „ziarno” brzmi naturalnie i zachowuje rolniczy sens.
- source_word: τότε
  choice: wtedy
  rationale: τότε wyznacza kolejny moment narracji; prostym polskim odpowiednikiem jest „wtedy”.
- source_word: ἐφάνη
  choice: ukazały się
  rationale: Forma od φαίνω wskazuje, że coś stało się widoczne lub ujawniło się; „ukazały się” oddaje ten sens bez dodawania interpretacji.
- source_word: καὶ τὰ ζιζάνια
  choice: również chwasty
  rationale: ζιζάνια oznacza chwasty na polu, prawdopodobnie życicę roczną; καί ma tu sens addytywny, oddany przez „również”.
theological_decisions:
- issue: Szczegółowa identyfikacja ζιζάνια
  choice: W tekście głównym ogólne „chwasty”
  alternative: „kąkol” lub bardziej botanicznie „życica roczna”
  rationale: Grecki termin może wskazywać na konkretny chwast podobny do pszenicy, lecz sam werset nie wymaga pewnej identyfikacji botanicznej. Ogólne „chwasty” jest zrozumiałe, a tradycyjna i możliwa identyfikacja zostaje zachowana w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano temporalną budowę zdania oraz lekkie przeciwstawienie wyrażone przez δέ. Marker [a] umieszczono bezpośrednio po wyrazie „chwasty”.
