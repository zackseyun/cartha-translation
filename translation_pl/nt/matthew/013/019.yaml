  variant: modern standard Polish
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: pl
  text: Gdy ktoś słucha słowa o królestwie, lecz go nie rozumie, przychodzi Zły[a] i porywa to, co zostało zasiane w jego sercu. To jest ten, który został zasiany przy drodze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Niegodziwy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „obok drogi” albo „przy ścieżce”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: gdy ktoś słucha
  rationale: Konstrukcja dopełniaczowa z imiesłowem ma sens ogólny; polskie „gdy ktoś słucha” oddaje go naturalnie i zachowuje aspekt słuchania.
- source_word: λόγον τῆς βασιλείας
  choice: słowa o królestwie
  rationale: Dopełniacz może określać treść słowa. „Słowo o królestwie” jest jasne po polsku, a zarazem zachowuje termin „słowo” i związek obrazu słowa z zasianym ziarnem.
- source_word: μὴ συνιέντος
  choice: lecz go nie rozumie
  rationale: Czasownik oznacza rozumienie lub pojmowanie; zaimek „go” naturalnie odsyła do słowa.
- source_word: ὁ πονηρὸς
  choice: Zły
  rationale: Rodzajnik i osobowe działanie wskazują na osobowego sprawcę. Rzeczownikowe „Zły” jest zwięzłym, utrwalonym polskim odpowiednikiem, który nie dopowiada imienia tej postaci.
- source_word: ἁρπάζει
  choice: porywa
  rationale: Oddaje gwałtowne, nagłe zabranie wyrażone przez ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: to, co zostało zasiane
  rationale: Zachowuje substantywizowany i bierny charakter greckiego imiesłowu.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: w jego sercu
  rationale: Bezpośrednio zachowuje biblijny obraz serca oraz reprezentatywny męski zaimek liczby pojedynczej.
- source_word: οὗτός ἐστιν
  choice: To jest ten
  rationale: Naturalnie wprowadza utożsamienie słuchacza z elementem obrazu przypowieści.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: ten, który został zasiany przy drodze
  rationale: Zachowuje celową metonimię tekstu, w której człowiek zostaje opisany jako zasiany, oraz przestrzenny sens παρά z biernikiem.
theological_decisions:
- issue: Tożsamość ὁ πονηρός
  choice: 'osobowy przeciwnik: „Zły”'
  alternative: abstrakcyjne „zło” lub „niegodziwy”
  rationale: Postać przychodzi i porywa zasiane słowo, co przemawia za odczytaniem osobowym; przekład nie utożsamia jej jednak imiennie z konkretną postacią poza tym, co mówi werset.
- issue: Metonimia w ὁ ... σπαρείς
  choice: zachować sformułowanie „ten, który został zasiany”
  alternative: wyjaśniające „to oznacza ziarno zasiane przy drodze” albo „to człowiek podobny do ziarna”
  rationale: Greka utożsamia słuchacza z tym, co zostało zasiane. Zachowanie napięcia obrazu unika interpretacyjnego wygładzenia.
- issue: Rodzaj gramatyczny αὐτοῦ
  choice: „w jego sercu”
  alternative: „w sercu tej osoby”
  rationale: Forma męska liczby pojedynczej odpowiada tekstowi źródłowemu, a początkowe „ktoś” sygnalizuje ogólny zakres wypowiedzi.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Składnia jest naturalna po polsku, lecz zachowuje przypowieściową metonimię „ten, który został zasiany”. Wielka litera w „Zły” sygnalizuje użycie osobowe, nie dodając imienia niewystępującego w wersecie.
