id: MAT.13.42
reference: Matthew 13:42
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pl
  text: I wrzucą ich do ognistego pieca[a]. Tam będzie płacz i zgrzytanie zębów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „pieca ognia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: wrzucą
  rationale: Czas przyszły od βάλλω wyraża czynność rzucenia lub wtrącenia; „wrzucą” naturalnie oddaje w polszczyźnie skierowanie kogoś do wnętrza pieca.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek w bierniku liczby mnogiej odsyła do osób wskazanych w poprzednim kontekście, bez potrzeby ponownego nazywania ich.
- source_word: κάμινον τοῦ πυρός
  choice: ognistego pieca
  rationale: Grecka konstrukcja dopełniaczowa dosłownie brzmi „pieca ognia”; idiomatyczne polskie „ognisty piec” zachowuje konkretny i surowy obraz sądu.
- source_word: ἐκεῖ
  choice: Tam
  rationale: Zwięzły polski odpowiednik zachowuje znaczenie miejscowe i wskazuje na właśnie wspomniany piec.
- source_word: κλαυθμός
  choice: płacz
  rationale: „Płacz” jest naturalnym, utrwalonym odpowiednikiem rzeczownika oznaczającego płakanie lub zawodzenie, bez niepotrzebnego zawężania stopnia intensywności.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: zgrzytanie zębów
  rationale: To naturalny i utrwalony polski odpowiednik greckiego wyrażenia, zachowujący jego obrazowość oraz możliwy zakres dotkliwej rozpaczy i wrogiego wzburzenia.
- source_word: καὶ
  choice: I
  rationale: Spójnik zachowano na początku wersetu, aby utrzymać jego więź z poprzednią wypowiedzią.
theological_decisions:
- issue: Charakter obrazu „ognistego pieca”
  choice: Zachowano konkretną metaforę sądu, nie utożsamiając jej w samym przekładzie z późniejszym terminem doktrynalnym.
  alternative: Parafraza typu „ogień piekielny” albo złagodzenie obrazu.
  rationale: Tekst przedstawia żywy obraz eschatologicznego sądu, lecz nie objaśnia tutaj szczegółowo jego natury; przekład nie powinien ani dopowiadać, ani osłabiać tej metafory.
- issue: Znaczenie „płaczu i zgrzytania zębów”
  choice: Zachowano pełną, utartą formułę Mateuszową bez rozstrzygania, czy zgrzytanie oznacza przede wszystkim rozpacz, ból czy gniew.
  alternative: Interpretacyjne zawężenie wyrażenia wyłącznie do smutku albo wyłącznie do wściekłości.
  rationale: Greckie sformułowanie może obejmować dotkliwą udrękę i wzburzenie; dosadne, lecz nieobjaśniające tłumaczenie zachowuje tę napiętą wieloznaczność.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Szyk „ognistego pieca” jest naturalniejszy niż dosłowne „pieca ognia”, a krótkie „Tam” wiernie oddaje greckie ἐκεῖ. Zachowano tradycyjne, nadal powszechnie zrozumiałe wyrażenie „zgrzytanie zębów”.
