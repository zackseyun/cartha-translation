  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: pl
  text: 'On jednak powiedział: „Nie, bo gdy będziecie zbierać chwasty[a], moglibyście razem z nimi wyrwać z korzeniami pszenicę”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradycyjnie: „kąkol”; być może chodzi o życicę odurzającą, chwast podobny we wczesnej fazie wzrostu do pszenicy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ φησιν
  choice: On jednak powiedział
  rationale: Grecki czas teraźniejszy pełni funkcję praesens historicum. Polski czas przeszły brzmi naturalnie w narracji, a δέ oddano jako „jednak”, zaznaczając odpowiedź przeciwną do propozycji sług.
- source_word: Οὔ
  choice: Nie
  rationale: Prosta, stanowcza odpowiedź przecząca odpowiada greckiemu Οὔ.
- source_word: μήποτε
  choice: bo ... moglibyście
  rationale: Konstrukcja wyraża obawę przed możliwym, niepożądanym skutkiem. Takie sformułowanie jest naturalne we współczesnej polszczyźnie i nie przedstawia skutku jako pewnego.
- source_word: συλλέγοντες
  choice: gdy będziecie zbierać
  rationale: Imiesłów oznacza czynność towarzyszącą możliwemu wyrwaniu pszenicy; zdanie czasowe jasno oddaje tę relację.
- source_word: τὰ ζιζάνια
  choice: chwasty
  rationale: „Chwasty” są współczesnym, zrozumiałym odpowiednikiem ogólnym. Możliwą identyfikację rośliny jako życicy odurzającej zachowano w przypisie.
- source_word: ἐκριζώσητε
  choice: wyrwać z korzeniami
  rationale: Sformułowanie zachowuje właściwe czasownikowi znaczenie usunięcia rośliny razem z korzeniami.
- source_word: ἅμα αὐτοῖς
  choice: razem z nimi
  rationale: Naturalnie wyraża wspólne usunięcie pszenicy i chwastów; zaimek odnosi się do chwastów.
- source_word: τὸν σῖτον
  choice: pszenicę
  rationale: W rolniczym obrazie i w kontraście z ζιζάνια termin najtrafniej oznacza pszenicę, nie zboże w sensie ogólnym.
theological_decisions:
- issue: Oddanie ζιζάνια w znanej przypowieści
  choice: chwasty
  alternative: kąkol; życica odurzająca
  rationale: Tekst nie wymaga rozstrzygnięcia dokładnego gatunku. „Chwasty” zachowują sens obrazu i są jasne dla współczesnego czytelnika, a tradycyjne oraz botanicznie bardziej szczegółowe możliwości podano w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. Wypowiedź gospodarza jest bezpośrednia i prosta; zachowano możliwy, a nie pewny charakter niepożądanego skutku.
