  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: pl
  text: Syn Człowieczy pośle swoich aniołów, a oni zbiorą z jego królestwa wszystko, co prowadzi do upadku[a], oraz tych, którzy dopuszczają się nieprawości[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wszelkie przeszkody prowadzące do grzechu” lub „wszelkie zgorszenia”. Greckie słowo σκάνδαλα może oznaczać rzeczy, wpływy albo okoliczności, które skłaniają ludzi do grzechu lub odejścia.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „tych, którzy czynią nieprawość”. Forma grecka wskazuje na postępowanie powtarzające się lub charakterystyczne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: pośle
  rationale: Forma przyszła czasownika ἀποστέλλω oznacza posłanie wyznaczonych wykonawców. Polskie „pośle” jest naturalne i zachowuje sens zlecenia misji bez zbędnego dopowiadania.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tytułu, zachowujący jego związek z obrazem z Księgi Daniela oraz sposób, w jaki Jezus określa siebie w Ewangelii Mateusza.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: swoich aniołów
  rationale: W kontekście sądu i czasów ostatecznych ἄγγελοι oznacza istoty niebiańskie, nie ludzkich posłańców. Zaimek „swoich” naturalnie odnosi aniołów do podmiotu zdania.
- source_word: συλλέξουσιν ἐκ
  choice: usuną z
  rationale: Dosłownie chodzi o zebranie czegoś z wnętrza określonej sfery. W tym kontekście skutkiem zebrania jest usunięcie z królestwa; „usuną z” brzmi naturalnie po polsku i zachowuje kierunek wyrażony przez ἐκ.
- source_word: πάντα τὰ σκάνδαλα
  choice: wszystko, co prowadzi do upadku
  rationale: σκάνδαλα oznacza przeszkody, wpływy lub rzeczy powodujące grzech, odejście albo upadek. Ten przekład zachowuje szeroki zakres wyrażenia i unika współczesnego, głównie emocjonalnego znaczenia słowa „zgorszenie”.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: tych, którzy dopuszczają się nieprawości
  rationale: Imiesłów czasu teraźniejszego wskazuje na znamienne lub powtarzające się postępowanie. „Nieprawość” zachowuje moralno-teologiczny sens ἀνομία, a całe sformułowanie jest naturalne we współczesnej polszczyźnie.
theological_decisions:
- issue: Oddanie tytułu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Człowiek / Syn Człowieka
  rationale: Tradycyjna forma najlepiej zachowuje charakter tytułu i jego apokaliptyczne odniesienia, nie rozstrzygając w samym przekładzie wszystkich niuansów wyrażenia.
- issue: Zakres znaczeniowy σκάνδαλα w scenie sądu
  choice: wszystko, co prowadzi do upadku
  alternative: wszelkie zgorszenia / wszystkie przeszkody
  rationale: Grecka liczba mnoga rodzaju nijakiego może obejmować rzeczy, wpływy lub inne czynniki prowadzące ludzi do grzechu czy odstępstwa. Przekład nie zawęża jej wyłącznie do osób ani do odczucia oburzenia.
- issue: Charakter działania opisanego przez ποιοῦντας τὴν ἀνομίαν
  choice: tych, którzy dopuszczają się nieprawości
  alternative: czyniących nieprawość
  rationale: Wyrażenie oddaje ludzi rozpoznawanych po takim postępowaniu, lecz nie wprowadza dodatkowego twierdzenia o bezwyjątkowej ciągłości ich czynów.
translation_notes:
  register: Język współczesny, godny i przystępny. Zachowano tradycyjny tytuł „Syn Człowieczy”, natomiast uniknięto słowa „zgorszenia” w tekście głównym, ponieważ we współczesnej polszczyźnie często oznacza ono przede wszystkim oburzenie. Konstrukcja zdania zachowuje rozróżnienie między tym, co prowadzi do upadku, a osobami dopuszczającymi się nieprawości.
