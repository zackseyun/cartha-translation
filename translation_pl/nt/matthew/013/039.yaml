id: MAT.13.39
reference: Matthew 13:39
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: pl
  text: Wrogiem, który je zasiał, jest diabeł; żniwem jest koniec wieku[a], a żniwiarzami są aniołowie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dopełnienie wieku”; tradycyjnie: „koniec świata”.'
    reason: 'Alternatywa leksykalna: συντέλεια może oznaczać doprowadzenie do pełni lub kres, a αἰών — wiek bądź epokę, niekoniecznie materialny świat.'
lexical_decisions:
- source_word: ἐχθρός
  choice: nieprzyjaciel
  rationale: Naturalne i godne określenie osobowego przeciwnika; zachowuje związek z wcześniejszym obrazem przypowieści.
- source_word: ὁ σπείρας
  choice: który zasiał
  rationale: Oddaje imiesłów aorystu jako dokonaną czynność i zachowuje rolniczy obraz siewu.
- source_word: αὐτά
  choice: je
  rationale: Naturalne polskie odesłanie do wcześniej wspomnianego chwastu.
- source_word: διάβολος
  choice: diabeł
  rationale: W tym kontekście jest to utrwalone osobowe określenie szatana, a nie ogólne „oszczerca”.
- source_word: θερισμός
  choice: żniwo
  rationale: Standardowy polski odpowiednik, zachowujący metaforykę przypowieści.
- source_word: συντέλεια αἰῶνος
  choice: koniec wieku
  rationale: Zachowuje czasowy i eschatologiczny sens wyrażenia, nie utożsamiając go automatycznie z unicestwieniem materialnego świata.
- source_word: θερισταί
  choice: żniwiarze
  rationale: Bezpośredni, zrozumiały odpowiednik zachowujący obraz żniwa.
- source_word: ἄγγελοι
  choice: aniołowie
  rationale: Kontekst eschatologiczny wskazuje na istoty niebiańskie, nie na ludzkich posłańców.
- source_word: δέ
  choice: zaś / a
  rationale: Powtarzające się δέ wyznacza kolejne człony objaśnienia; polskie „zaś” i „a” naturalnie oddają tę progresję.
theological_decisions:
- issue: Znaczenie αἰών w wyrażeniu συντέλεια αἰῶνος
  choice: koniec wieku
  alternative: koniec świata; dopełnienie wieku
  rationale: „Wiek” zachowuje odniesienie do okresu lub porządku dziejów, podczas gdy tradycyjne „świat” może sugerować sens materialno-kosmiczny, którego sam grecki rzeczownik nie wymaga. „Dopełnienie” lepiej uwydatnia kulminację, lecz jest mniej naturalne w tekście głównym.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia zachowuje równoległość trzech członów greckiego objaśnienia, a spójniki „zaś” i „a” brzmią naturalnie po polsku.
