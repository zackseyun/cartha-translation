  source_fidelity: „Przy drodze” dobrze oddaje παρά τὴν ὁδόν, a „niektóre ziarna” jest uzasadnionym, oznaczonym w przypisie dopowiedzeniem. „Przyleciały ptaki” naturalnie oddaje przybycie ptaków, choć grecki czasownik ogólnie znaczy „przyszły/przybyły”. „Wydziobały” opisuje typowy sposób pobierania ziarna przez ptaki, ale nie jest bezpośrednim odpowiednikiem κατέφαγεν („zjadły, pożarły”) i niepotrzebnie precyzuje sposób czynności.
