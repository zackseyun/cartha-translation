  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: pl
  text: A gdy siał, niektóre ziarna[a] padły przy drodze. Przyleciały ptaki i je zjadły.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „niektóre rzeczy”; słowo „ziarna” wynika z kontekstu przypowieści o siewcy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: gdy siał
  rationale: Konstrukcja ἐν z rodzajnikowym bezokolicznikiem wyraża równoczesność; „gdy siał” jest naturalnym polskim odpowiednikiem.
- source_word: ἃ μὲν
  choice: niektóre ziarna
  rationale: Zaimek w liczbie mnogiej dosłownie oznacza „niektóre rzeczy”, lecz w kontekście odnosi się do wysiewanego ziarna; rzeczownik zostaje dopowiedziany dla jasności.
- source_word: ἔπεσεν
  choice: padły
  rationale: Aoryst w narracji naturalnie oddaje polski czas przeszły dokonany; liczba mnoga wynika z dopowiedzianego rzeczownika „ziarna”.
- source_word: παρὰ τὴν ὁδόν
  choice: przy drodze
  rationale: παρά z biernikiem wskazuje tu miejsce obok drogi; „przy drodze” jest naturalne i nie przesądza, czy ziarna spadły na sam trakt, czy na jego skraj.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: przyleciały ptaki
  rationale: Imiesłów aorystu oddano osobową formą czasownika, a πετεινά jako „ptaki”. „Przyleciały” naturalnie wyraża przybycie latających zwierząt bez dodawania nieobecnego w tekście określenia „niebieskie”.
- source_word: κατέφαγεν
  choice: wydziobały
  rationale: κατεσθίω oznacza zjedzenie lub pochłonięcie czegoś. W odniesieniu do ptaków i rozsypanych ziaren „wydziobały” jest naturalne, obrazowe i wskazuje na całkowite usunięcie ziaren.
- source_word: αὐτά
  choice: je
  rationale: Zaimek odnosi się do ziaren; polskie „je” zachowuje to odniesienie bez zbędnego powtórzenia.
