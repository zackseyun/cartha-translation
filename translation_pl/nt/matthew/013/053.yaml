  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: pl
  text: A gdy Jezus skończył opowiadać te przypowieści, odszedł stamtąd.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: A gdy
  rationale: Semicki zwrot narracyjny καὶ ἐγένετο nie wymaga dosłownego „i stało się”; „A gdy” naturalnie wprowadza w języku polskim następstwo czasowe i zachowuje ciągłość opowiadania.
- source_word: ἐτέλεσεν
  choice: skończył opowiadać
  rationale: Czasownik τελέω oznacza doprowadzenie czynności do końca. Dodanie „opowiadać” naturalnie łączy go z przypowieściami i nie zmienia sensu wypowiedzi.
- source_word: τὰς παραβολὰς ταύτας
  choice: te przypowieści
  rationale: „Przypowieści” to utrwalony i trafny odpowiednik παραβολαί w kontekście nauczania Jezusa, a „te” wskazuje na bezpośrednio poprzedzający zbiór.
- source_word: μετῆρεν
  choice: odszedł
  rationale: μεταίρω opisuje opuszczenie miejsca i przeniesienie się gdzie indziej. „Odszedł” jest zwięzłe, naturalne i nie precyzuje sposobu przemieszczania się.
- source_word: ἐκεῖθεν
  choice: stamtąd
  rationale: „Stamtąd” jest dokładnym i idiomatycznym odpowiednikiem przysłówka oznaczającego ruch z danego miejsca.
