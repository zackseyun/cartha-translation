id: MAT.13.32
reference: Matthew 13:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: pl
  text: Jest ono wprawdzie mniejsze od wszystkich nasion, lecz gdy wyrośnie, jest większe od roślin ogrodowych i staje się drzewem, tak że przylatują ptaki podniebne[a] i gnieżdżą się w jego gałęziach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ptaki nieba”; tradycyjnie także: „ptaki powietrzne”.'
    reason: lexical_alternative
  - marker: b
    text: Obraz ptaków gnieżdżących się w gałęziach może nawiązywać do starotestamentowych obrazów wielkiego drzewa (np. Ez 17,23; Dn 4,12), ale werset nie objaśnia tej symboliki wprost.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: mniejsze od wszystkich nasion
  rationale: Zachowuje stopień wyższy greckiego przymiotnika i jawne porównanie z wszystkimi nasionami, nie zmieniając go bez potrzeby w polski superlatyw „najmniejsze”.
- source_word: μέν ... δέ
  choice: wprawdzie ... lecz
  rationale: Naturalnie oddaje kontrast między niepozornym początkiem a późniejszym wzrostem.
- source_word: ὅταν ... αὐξηθῇ
  choice: gdy wyrośnie
  rationale: Oddaje przyszłą możliwość ujętą całościowo oraz osiągnięty stan wzrostu przed dalszym skutkiem.
- source_word: μεῖζον τῶν λαχάνων
  choice: większe od roślin ogrodowych
  rationale: λάχανα oznacza uprawiane rośliny ogrodowe; szerokie określenie nie zawęża sensu do warzyw ani ziół.
- source_word: γίνεται δένδρον
  choice: staje się drzewem
  rationale: Zachowuje bez złagodzenia wyrazisty obraz zawarty w greckim tekście.
- source_word: ὥστε ἐλθεῖν
  choice: tak że przylatują
  rationale: Wyraża skutek; w odniesieniu do ptaków polskie „przylatują” jest naturalniejsze niż ogólne „przychodzą”.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ptaki podniebne
  rationale: Naturalny, podniosły polski odpowiednik idiomu dosłownie mówiącego o „ptakach nieba”; unika mylącego wyrażenia „ptaki niebieskie”.
- source_word: κατασκηνοῦν
  choice: gnieżdżą się
  rationale: W kontekście ptaków i gałęzi trafnie oddaje zamieszkanie lub znalezienie schronienia.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: w jego gałęziach
  rationale: Bezpośrednio oddaje relację miejscową i odnosi zaimek do drzewa.
theological_decisions:
- issue: Możliwa aluzja do starotestamentowego obrazu wielkiego drzewa królestwa
  choice: Pozostawienie obrazu ptaków gnieżdżących się w gałęziach bez jego interpretowania w tekście głównym.
  alternative: Objaśnienie ptaków jako narodów lub ludów znajdujących schronienie w królestwie Boga.
  rationale: Możliwa jest aluzja do Ez 17,23 i Dn 4,12, lecz sam werset nie wyjaśnia symboliki. Przekład zachowuje obraz i jego teologiczne napięcie, a przypis jedynie wskazuje możliwe tło.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Wprawdzie ... lecz” utrzymuje retoryczny kontrast, a „ptaki podniebne” brzmi naturalnie i zachowuje biblijną obrazowość bez archaizacji.
