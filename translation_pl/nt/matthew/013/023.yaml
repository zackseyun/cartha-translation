  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: pl
  text: 'A posiany na dobrej ziemi[a] to ten, kto słyszy słowo i je rozumie, który rzeczywiście wydaje owoc i przynosi plon: jeden stukrotny, drugi sześćdziesięciokrotny, a trzeci trzydziestokrotny[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na dobrej glebie” lub „na dobrym gruncie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „jeden sto, drugi sześćdziesiąt, a trzeci trzydzieści”; chodzi o różną wielkość plonu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: na dobrej ziemi
  rationale: W kontekście siewu γῆ oznacza ziemię lub glebę przyjmującą ziarno; „dobra ziemia” jest naturalnym, utrwalonym po polsku określeniem podłoża żyznego i odpowiedniego pod uprawę. Przymiotnik καλός opisuje tu przydatność i jakość ziemi, nie jej moralność.
- source_word: σπαρείς
  choice: posiany
  rationale: Imiesłów bierny zachowuje obraz zasianego ziarna, które w objaśnieniu przypowieści reprezentuje człowieka. Zwięzła forma „posiany” jest naturalna i nie usuwa metaforycznego napięcia.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ten, kto słyszy słowo
  rationale: Imiesłów teraźniejszy opisuje charakterystyczną czynność. „Słyszy” oddaje ἀκούω bez dodawania interpretacyjnego nacisku na uważne słuchanie, a „słowo” zachowuje ewangeliczne słownictwo tekstu.
- source_word: συνιείς
  choice: i je rozumie
  rationale: συνίημι oznacza tutaj pojmowanie treści usłyszanego słowa. Zaimek „je” w sposób naturalny wskazuje na „słowo”.
- source_word: δὴ
  choice: właśnie
  rationale: Partykuła δή wzmacnia stwierdzenie. „Właśnie” lekko i naturalnie zachowuje ten emfatyczny odcień.
- source_word: καρποφορεῖ
  choice: wydaje owoc
  rationale: Sformułowanie zachowuje rolniczą metaforę oraz jej zastosowanie do reakcji na słowo.
- source_word: ποιεῖ
  choice: przynosi plon
  rationale: 'W tym kontekście ποιέω odnosi się do wytworzenia określonego plonu. Osobne oddanie tego czasownika pozwala zachować dwa greckie orzeczenia: καρποφορεῖ καὶ ποιεῖ.'
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: jeden stukrotny, drugi sześćdziesięciokrotny, a trzeci trzydziestokrotny
  rationale: Konstrukcja rozdzielcza wskazuje na różne wielkości plonu. Polski przymiotnik „-krotny” jasno wyraża domyślną w kontekście proporcję zbioru, a przypis zachowuje informację o dosłownej zwięzłości greki.
theological_decisions:
- issue: Charakter odpowiedzi na słowo w przypowieści
  choice: Werset opisuje człowieka jako tego, kto słyszy słowo, rozumie je i wydaje owoc w różnej mierze.
  alternative: Przekład mógłby interpretacyjnie dopowiedzieć wytrwałość, prawdziwe nawrócenie albo odrodzenie.
  rationale: Tekst grecki mówi wprost o słyszeniu, rozumieniu i owocowaniu, lecz nie formułuje tutaj późniejszych kategorii doktrynalnych. Przekład zachowuje własne kategorie tekstu bez rozstrzygania sporów wyznaniowych.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano rolniczy obraz przypowieści oraz zwięzłe utożsamienie zasianego z człowiekiem, unikając zarówno archaizmów, jak i doktrynalnych dopowiedzeń.
