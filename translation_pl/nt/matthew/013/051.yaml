  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: pl
  text: 'Czy zrozumieliście to wszystko? Powiedzieli mu: „Tak.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Czy zrozumieliście
  rationale: Aoryst trybu oznajmującego w pytaniu wskazuje na osiągnięcie zrozumienia dotychczasowego nauczania. Polski czas przeszły naturalnie zachowuje ten aspekt; możliwe „Czy rozumiecie” przesuwa nacisk na stan obecny.
- source_word: ταῦτα πάντα
  choice: to wszystko
  rationale: Naturalny polski odpowiednik rodzaju nijakiego liczby mnogiej, odnoszący się łącznie do przedstawionych nauk i przypowieści.
- source_word: λέγουσιν αὐτῷ
  choice: Odpowiedzieli mu
  rationale: Historyczny czas teraźniejszy oddano polskim czasem przeszłym zgodnie z naturalną narracją. Czasownik „odpowiedzieli” jasno wyraża funkcję wypowiedzi po pytaniu, nie zmieniając jej treści.
- source_word: Ναί
  choice: Tak
  rationale: Zachowano samo proste potwierdzenie obecne w tekście greckim, bez dodawania tytułu grzecznościowego lub religijnego.
theological_decisions:
- issue: Czy rozbudować odpowiedź uczniów o tytuł wyrażający szacunek
  choice: Pozostawić samo „Tak”.
  alternative: „Tak, Panie”.
  rationale: SBLGNT zawiera wyłącznie ναί. Dodanie „Panie” wprowadzałoby treść nieobecną w przyjętym tekście źródłowym.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. Pytanie zachowuje aspekt dokonanego zrozumienia, a zwięzła odpowiedź brzmi idiomatycznie po polsku.
