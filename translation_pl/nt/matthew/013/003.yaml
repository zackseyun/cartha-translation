- source_word: ὁ σπείρων
  choice: siewca
  rationale: Rzeczownikowo oddaje grecki imiesłów użyty jako określenie osoby siejącej.
- source_word: τοῦ σπείρειν
  choice: siać
  rationale: Naturalny polski bezokolicznik celu; unika niezręcznego dosłownego powtórzenia „do siania”.
