source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: pl
  text: 'A on im powiedział: „Dlatego każdy znawca Pisma, wykształcony w sprawach królestwa niebios[a], podobny jest do gospodarza domu[b], który wydobywa ze swego skarbca[c] rzeczy nowe i stare”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „który stał się uczniem królestwa niebios”. Grecki imiesłów może oznaczać zarówno uczynienie kogoś uczniem, jak i jego pouczenie lub wykształcenie.'
    reason: alternative_reading
  - marker: b
    text: 'Można też oddać: „pana domu” lub „głowę domu”. Chodzi o osobę zarządzającą domem i jego zasobami.'
    reason: lexical_alternative
  - marker: c
    text: Greckie słowo może oznaczać zarówno skarb, jak i skarbiec lub składnicę, z której wydobywa się cenne rzeczy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dlatego
  rationale: Naturalny polski spójnik wynikowy, zachowujący logiczne nawiązanie do poprzedniej wypowiedzi.
- source_word: πᾶς γραμματεὺς
  choice: każdy znawca Pisma
  rationale: W tym kontekście γραμματεύς oznacza człowieka biegłego w świętych Pismach. „Znawca Pisma” jest współczesne i czytelne, a zarazem nie ogranicza obrazu wyłącznie do zawodu kopisty.
- source_word: μαθητευθεὶς
  choice: wykształcony
  rationale: Oddaje bierny, formacyjny sens imiesłowu bez rozstrzygania, czy nacisk pada na nauczanie, przygotowanie, czy stanie się uczniem; alternatywny sens uczniostwa podano w przypisie.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dla królestwa niebios
  rationale: Celownik wyraża tu niejednoznaczną relację lub ukierunkowanie. „Dla” zachowuje tę otwartość lepiej niż doprecyzowujące „o sprawach” lub „w zakresie”.
- source_word: ὅμοιός ἐστιν
  choice: podobny jest do
  rationale: Jasna i godna polska formuła porównania, odpowiednia dla języka przypowieści.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: do gospodarza domu
  rationale: Oddaje osobę zarządzającą domem i jego zasobami w sposób naturalny dla współczesnego polskiego.
- source_word: ἐκβάλλει
  choice: wydobywa
  rationale: W połączeniu ze skarbcem czasownik oznacza wyjmowanie i ukazywanie przechowywanych rzeczy, nie gwałtowne wyrzucanie.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: ze swego skarbca
  rationale: θησαυρός może oznaczać zarówno cenny zasób, jak i miejsce jego przechowywania. „Skarbiec” naturalnie pasuje do obrazu gospodarza wydobywającego zgromadzone rzeczy.
- source_word: καινὰ καὶ παλαιά
  choice: rzeczy nowe i stare
  rationale: 'Uzupełnienie rzeczownika wynika z nijakich przymiotników w liczbie mnogiej; zachowano grecką kolejność: nowe, potem stare.'
theological_decisions:
- issue: Znaczenie μαθητευθεὶς w relacji do znawcy Pisma i królestwa
  choice: Znawca Pisma wykształcony i uformowany dla królestwa niebios
  alternative: Znawca Pisma, który stał się uczniem królestwa niebios
  rationale: Grecki imiesłów może wskazywać zarówno na uczynienie kogoś uczniem, jak i na jego pouczenie lub wyszkolenie. Tekst główny zachowuje sens formacji, a przypis ujawnia wyraźniejszą możliwość uczniostwa.
- issue: Sens οἰκοδεσπότης w porównaniu
  choice: gospodarz domu
  alternative: pan domu; głowa domu
  rationale: Wyrażenie zachowuje rolę osoby zarządzającej domem i skarbcem, nie wprowadzając dodatkowych twierdzeń o strukturze rodziny ani własności.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano Mateuszowe „królestwo niebios”, porządek „nowe i stare” oraz metaforę gospodarza i skarbca. Nietypową relację celownikową przy μαθητευθεὶς oddano możliwie zwięźle, a jej istotną wieloznaczność objaśniono w przypisie.
