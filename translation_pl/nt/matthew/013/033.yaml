  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: pl
  text: 'Opowiedział im też inną przypowieść: „Królestwo niebios jest podobne do zakwasu[a], który kobieta wzięła i ukryła[b] w trzech miarach mąki[c], aż wszystko się zakwasiło”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „drożdży” lub „zaczynu”. Grecki wyraz oznacza środek używany do spulchniania ciasta.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „wmieszała” lub „wymieszała z”; dosłownie: „ukryła w”.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „w trzech satach mąki”. Sat był starożytną miarą objętości; trzy saty oznaczały dużą ilość mąki.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Opowiedział im też inną przypowieść
  rationale: Naturalny polski wstęp narracyjny zachowuje sens kolejnej przypowieści; „też” jasno oddaje addytywną funkcję ἄλλην w tym kontekście.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Królestwo niebios
  rationale: Utrwalone i zrozumiałe określenie Mateuszowe, zachowujące rzeczownikową konstrukcję grecką bez nienaturalnego „królestwa niebiosów”.
- source_word: ζύμῃ
  choice: zakwasu
  rationale: „Zakwas” oznacza środek powodujący fermentację ciasta i zachowuje tradycyjny, metaforycznie pojemny obraz; przypis podaje potoczną alternatywę.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: który pewna kobieta wzięła
  rationale: Imiesłów λαβοῦσα oddano naturalną polską formą osobową. „Pewna” sygnalizuje nieokreśloną postać bez sugerowania konkretnej kobiety.
- source_word: ἐνέκρυψεν εἰς
  choice: ukryła w
  rationale: Zachowuje dosłowną siłę czasownika ἐγκρύπτω („ukryć, schować w”), nie rozstrzygając obrazu przez bardziej objaśniające „wmieszała”.
- source_word: ἀλεύρου σάτα τρία
  choice: w trzech miarach mąki
  rationale: Czytelne sformułowanie w tekście głównym; właściwa starożytna jednostka i informacja o dużej ilości zostały zachowane w przypisie.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: aż wszystko się zakwasiło
  rationale: Naturalnie oddaje grecką stronę bierną oraz ὅλον, nie dopowiadając, czy chodzi o mąkę, ciasto czy całą przygotowaną masę.
theological_decisions:
- issue: Wartościowanie obrazu zakwasu w przypowieści o królestwie
  choice: Neutralne „zakwas”, bez dodawania oceny pozytywnej lub negatywnej
  alternative: Oddać obraz jako negatywną „zgniliznę” albo wyłącznie pozytywny symbol wzrostu
  rationale: Sam werset akcentuje ukryte przeniknięcie całości, lecz nie objaśnia wprost moralnej wartości symbolu. Przekład nie powinien rozstrzygać szerszego sporu interpretacyjnego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano zwięzłość przypowieści, dosłowny obraz ukrycia zakwasu oraz nieokreślone „wszystko”, a obce współczesnemu czytelnikowi szczegóły leksykalne i miarę wyjaśniono w przypisach.
