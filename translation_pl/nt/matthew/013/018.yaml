lexical_decisions:
- source_word: Ὑμεῖς
  choice: Wy
  rationale: Wyraźnie użyty zaimek jest w grece emfatyczny; zachowanie go w polskim oddaje nacisk i kontrast obecny w kontekście.
- source_word: οὖν
  choice: zatem
  rationale: Partykuła wskazuje na wynikający z poprzednich słów wniosek lub przejście; „zatem” zachowuje to powiązanie w naturalnym, godnym rejestrze.
- source_word: ἀκούσατε
  choice: posłuchajcie
  rationale: Aorystowy tryb rozkazujący w drugiej osobie liczby mnogiej. „Posłuchajcie” naturalnie oddaje wezwanie do uważnego słuchania, nie wprowadzając mocniejszego interpretacyjnie „zrozumcie”.
- source_word: παραβολὴν
  choice: przypowieści
  rationale: „Przypowieść” jest utrwalonym i trafnym odpowiednikiem παραβολή w nauczaniu synoptycznym.
- source_word: τοῦ σπείραντος
  choice: o siewcy
  rationale: Grecki dopełniacz urzeczownikowionego imiesłowu oznacza tego, który siał. „O siewcy” jest naturalnym polskim określeniem tematu przypowieści, a bardziej dosłowną postać zachowano w przypisie.
