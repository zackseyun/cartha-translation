id: MAT.13.55
reference: Matthew 13:55
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: pl
  text: Czy nie jest to syn cieśli? Czy jego matka nie nazywa się Maria, a jego braćmi[a] nie są Jakub, Józef[b], Szymon i Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „krewni” lub „bliscy krewni”. Greckie słowo zwykle znaczy „bracia”, lecz niektórzy rozumieją je tutaj szerzej.'
    reason: lexical_alternative
  - marker: b
    text: Niektóre rękopisy mają w tym miejscu imię „Jozes” zamiast „Józef”.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: cieśli
  rationale: Rzeczownik τέκτων oznacza rzemieślnika zajmującego się obróbką drewna lub pracami budowlanymi; „cieśla” jest w tym kontekście naturalnym i utrwalonym polskim odpowiednikiem, choć grecki termin ma nieco szerszy zakres.
- source_word: υἱός
  choice: syn
  rationale: Bezpośredni kontekst rodzinny wskazuje na zwykłe znaczenie relacji synowskiej.
- source_word: λέγεται
  choice: nazywa się
  rationale: Grecka strona bierna w tym idiomie oznacza „jest nazywana”; naturalnym polskim odpowiednikiem jest „nazywa się”.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Zastosowano standardową polską formę imienia biblijnego.
- source_word: ἀδελφοὶ
  choice: bracia
  rationale: Podstawowym i zwyczajnym znaczeniem słowa jest „bracia”. Możliwe szersze odniesienie rodzinne zaznaczono w przypisie, bez rozstrzygania sporu interpretacyjnego w tekście głównym.
- source_word: Ἰάκωβος
  choice: Jakub
  rationale: Jest to standardowa polska forma tego imienia w Nowym Testamencie.
- source_word: Ἰωσὴφ
  choice: Józef
  rationale: Tak brzmi tekst SBLGNT; wariant imienia „Joses” poświadczony w części rękopisów podano w przypisie.
- source_word: Σίμων
  choice: Szymon
  rationale: Zastosowano standardową polską formę imienia biblijnego.
- source_word: Ἰούδας
  choice: Juda
  rationale: „Juda” jest właściwą polską formą tego imienia w tym kontekście i nie wprowadza dodatkowego rozróżnienia nieobecnego w grece.
- source_word: οὐχ ... ;
  choice: Czy nie jest…? Czy… nie…?
  rationale: Partykuła wprowadza pytania retoryczne zakładające odpowiedź twierdzącą; pełna konstrukcja zachowuje ich ton i jest naturalna po polsku.
theological_decisions:
- issue: Znaczenie wyrażenia ἀδελφοὶ αὐτοῦ w odniesieniu do rodziny Jezusa
  choice: 'W tekście głównym: „jego bracia”'
  alternative: „jego krewni” lub „jego bliscy krewni”
  rationale: Zwykłym znaczeniem greckiego rzeczownika jest „bracia”. Przekład nie powinien rozstrzygać późniejszego sporu o dokładną więź rodzinną tych mężczyzn z Jezusem ani o trwałe dziewictwo Marii; szerszą możliwość znaczeniową zachowano w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, ale przystępnym brzmieniu. Zachowano dwa pytania retoryczne i podstawowe znaczenie terminów rodzinnych. Myślnik przed wyliczeniem imion ułatwia odczytanie eliptycznej konstrukcji, w której czasownik „nazywają się” pozostaje domyślny.
