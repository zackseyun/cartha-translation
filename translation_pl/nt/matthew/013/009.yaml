  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: pl
  text: Kto ma uszy, niech słucha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Kto ma
  rationale: Grecki rodzajnik z imiesłowem pełni funkcję rzeczownikową i odnosi się ogólnie do każdej osoby spełniającej ten warunek. Polskie „kto ma” naturalnie oddaje tę ogólną, jednostkową konstrukcję bez wprowadzania rodzaju gramatycznego osoby.
- source_word: ὦτα
  choice: uszy
  rationale: Grecki rzeczownik występuje w liczbie mnogiej; „uszy” wiernie zachowują liczbę i naturalny charakter tego zwrotu.
- source_word: ἀκουέτω
  choice: niech słucha
  rationale: Tryb rozkazujący trzeciej osoby liczby pojedynczej naturalnie oddaje konstrukcja „niech słucha”. „Słucha” lepiej niż czysto percepcyjne „słyszy” wyraża w tym kontekście wezwanie do uważnego przyjęcia słów, zachowując zarazem podstawowe znaczenie ἀκούω.
theological_decisions:
- issue: Ogólne odniesienie wyrażone w grece rodzajem męskim liczby pojedynczej
  choice: Kto ma uszy, niech słucha.
  alternative: Ten, kto ma uszy, niech słucha.
  rationale: Grecka forma męska liczby pojedynczej ma znaczenie ogólne. Polskie „kto” obejmuje każdą osobę, a jednocześnie zachowuje jednostkową liczbę oraz wezwanie w trzeciej osobie, bez potrzeby dodawania przypisu dotyczącego inkluzywności.
translation_notes:
  register: Współczesny, zwięzły i godny styl. Zdanie zachowuje aforystyczną formę wezwania Jezusa; „niech słucha” brzmi naturalnie po polsku i wskazuje na uważny, posłuszny odbiór, nie tylko fizyczne słyszenie.
