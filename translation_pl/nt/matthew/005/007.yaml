  verdict: approve
  source_fidelity: 'Tekst wiernie oddaje grecką strukturę błogosławieństwa: μακάριοι jako „Błogosławieni”, substantywizowane οἱ ἐλεήμονες jako „miłosierni”, a przyszłą obietnicę ἐλεηθήσονται jako „dostąpią miłosierdzia”. Polski zwrot nie nazywa sprawcy miłosierdzia, zachowując nieokreśloność greckiej strony biernej. „To oni” stosownie oddaje emfatyczne αὐτοὶ.'
  naturalness: „Błogosławieni miłosierni, bo to oni dostąpią miłosierdzia” jest zwięzłe, idiomatyczne i ma podniosły, lecz nadal zrozumiały współczesnemu odbiorcy rejestr. „Dostąpią miłosierdzia” jest nieco uroczyste, ale dobrze pasuje do gatunku błogosławieństwa i nie jest archaizmem niezrozumiałym.
  terminology: 'Konsekwentne powtórzenie „miłosierni / miłosierdzia” trafnie odzwierciedla związek między ἐλεήμονες a ἐλεηθήσονται. „Błogosławieni” zachowuje ustalone w polszczyźnie biblijnej i teologicznie adekwatne brzmienie. Brak przypisu jest właściwy: przekład nie wprowadza rozstrzygnięcia co do niewyrażonego sprawcy.'
