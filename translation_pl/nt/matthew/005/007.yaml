  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: pl
  text: Błogosławieni miłosierni, bo to oni dostąpią miłosierdzia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Błogosławieni
  rationale: Utrwalony, a zarazem nadal zrozumiały polski termin w błogosławieństwach; wyraża stan Bożej przychylności i pomyślności, nie tylko subiektywne poczucie szczęścia.
- source_word: οἱ ἐλεήμονες
  choice: miłosierni
  rationale: Przymiotnik z rodzajnikiem pełni funkcję rzeczownikową. Zwięzłe „miłosierni” zachowuje formę sentencji oraz więź słowną z obietnicą miłosierdzia.
- source_word: ὅτι
  choice: bo
  rationale: Naturalnie i jasno wprowadza w dzisiejszej polszczyźnie podstawę ogłoszonego błogosławieństwa.
- source_word: αὐτοὶ
  choice: to oni
  rationale: Konstrukcja „to oni” oddaje nacisk zaimka i podkreśla odpowiedniość między miłosiernymi a tymi, którzy dostąpią miłosierdzia.
- source_word: ἐλεηθήσονται
  choice: dostąpią miłosierdzia
  rationale: Naturalny, godny polski zwrot oddający przyszłą obietnicę i zachowujący powtórzenie rdzenia znaczeniowego miłosierdzia. Nie wskazuje wprost sprawcy, podobnie jak grecka strona bierna.
theological_decisions:
- issue: Sprawca obiecanego miłosierdzia
  choice: 'Nie nazywać sprawcy: „dostąpią miłosierdzia”.'
  alternative: „Bóg okaże im miłosierdzie” albo „ludzie okażą im miłosierdzie”.
  rationale: Grecka forma przyszła bierna pozostawia sprawcę niewyrażonego. Kontekst może sugerować Boga, lecz przekład nie powinien dopowiadać tego, czego zdanie nie mówi wprost.
translation_notes:
  register: Zwięzły, podniosły, lecz współczesny rejestr. Zachowano rytm błogosławieństwa oraz emfatyczne αὐτοὶ przez „to oni”, bez archaicznego „albowiem”.
