  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: pl
  text: 'Słyszeliście, że powiedziano przodkom[a]: „Nie popełnisz morderstwa[b]; a kto dopuści się morderstwa, będzie podlegał sądowi”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ludziom dawnych czasów”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradycyjnie: „Nie zabijaj”, jednak użyty tu grecki czasownik oznacza konkretniej „mordować”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Słyszeliście
  rationale: Polski czas przeszły naturalnie oddaje formułę odwołującą się do nauczania, które słuchacze wcześniej przyjęli; forma „usłyszeliście” sugerowałaby raczej pojedynczy akt usłyszenia.
- source_word: ἐρρέθη
  choice: powiedziano
  rationale: Bezosobowa forma zachowuje stronę bierną greckiego wyrażenia i nie rozstrzyga, kto był mówiącym.
- source_word: τοῖς ἀρχαίοις
  choice: przodkom
  rationale: Dativus wskazuje adresatów wypowiedzi, czyli ludzi dawnych pokoleń. „Przodkom” jest zwięzłe i naturalne; alternatywę bardziej dosłowną podano w przypisie.
- source_word: Οὐ φονεύσεις
  choice: Nie będziesz mordował
  rationale: φονεύω oznacza pozbawienie życia w sensie morderstwa, nie każde zabicie. Przyszła forma niedokonana odpowiada tradycyjnej polskiej postaci zakazu.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: a kto by zamordował
  rationale: Konstrukcja z ἄν i aorystem trybu łączącego wyraża ogólny, nieokreślony przypadek; polskie „kto by” zachowuje ten warunkowy odcień.
- source_word: ἔνοχος ἔσται
  choice: będzie podlegał
  rationale: W połączeniu z dativem ἔνοχος wyraża odpowiedzialność prawną lub podleganie osądowi, nie tylko abstrakcyjną winę.
- source_word: τῇ κρίσει
  choice: sądowi
  rationale: κρίσις ma tu sens prawno-sądowy. „Sądowi” zachowuje możliwą dwuznaczność między procesem osądzenia a instancją sądową, bez dopowiadania potępienia.
theological_decisions:
- issue: Zakres szóstego przykazania
  choice: mordował
  alternative: zabijał
  rationale: Greckie φονεύω odnosi się konkretnie do morderstwa. Szersze „zabijał” mogłoby sugerować zakaz każdego pozbawienia życia, czego użyty czasownik sam przez się nie stwierdza.
- issue: Adresaci wcześniejszej wypowiedzi
  choice: powiedziano przodkom
  alternative: powiedziano przez przodków
  rationale: Grecki dativus τοῖς ἀρχαίοις najnaturalniej oznacza odbiorców („przodkom”), nie sprawców wypowiedzi („przez przodków”).
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano jedną wypowiedź cytowaną, z średnikiem rozdzielającym przykazanie od konsekwencji prawnej. Sformułowanie „kto by zamordował” świadomie zachowuje ogólny odcień warunkowy tekstu greckiego.
