base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: pl
  text: 'Mówię wam bowiem: jeśli wasza sprawiedliwość[a] nie przewyższy sprawiedliwości uczonych w Piśmie i faryzeuszy, z całą pewnością nie wejdziecie do królestwa niebios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „prawość”. Greckie słowo może oznaczać zarówno sprawiedliwość, jak i prawość; w tym kontekście najlepiej pasuje „sprawiedliwość”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Bo mówię wam
  rationale: „Bo” oddaje wyjaśniającą funkcję γάρ, a „mówię wam” zachowuje czas teraźniejszy i bezpośredni zwrot do słuchaczy.
- source_word: ἐὰν μὴ
  choice: jeśli… nie
  rationale: Konstrukcja wyraża konieczny warunek negatywny. W tym zdaniu polskie „jeśli… nie” brzmi naturalniej niż „chyba że” i wiernie zachowuje tok wypowiedzi.
- source_word: περισσεύσῃ
  choice: nie przewyższy
  rationale: Czasownik w połączeniu z porównaniem oznacza przekroczenie pewnej miary; „przewyższy” jest zwięzłe i naturalne.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: wasza sprawiedliwość
  rationale: „Sprawiedliwość” zachowuje szeroki zakres δικαιοσύνη, obejmujący prawość i postępowanie zgodne z wolą Boga, bez zawężania sensu do samej sprawiedliwości społecznej.
- source_word: πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: sprawiedliwości uczonych w Piśmie i faryzeuszy
  rationale: Powtórzenie rzeczownika „sprawiedliwość” jasno wskazuje, że porównywana jest sprawiedliwość obu grup, a nie sami ludzie. „Uczeni w Piśmie” to naturalna polska nazwa żydowskich znawców i wykładowców Pism.
- source_word: οὐ μὴ εἰσέλθητε
  choice: z całą pewnością nie wejdziecie
  rationale: Zwrot oddaje stanowczy nacisk podwójnego przeczenia οὐ μή z aorystem trybu łączącego.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: królestwa niebios
  rationale: To utrwalone i zrozumiałe oddanie charakterystycznego dla Mateusza wyrażenia, zachowujące rzeczownikowy obraz „niebios”.
theological_decisions:
- issue: Zakres znaczeniowy δικαιοσύνη w kontekście Ewangelii Mateusza
  choice: sprawiedliwość
  alternative: prawość
  rationale: „Sprawiedliwość” zachowuje zarówno wymiar właściwej relacji z Bogiem, jak i zgodnego z Jego wolą postępowania. „Prawość” byłaby czytelna, lecz zawężałaby bogatszy zakres greckiego terminu.
- issue: Charakter porównania ze sprawiedliwością uczonych w Piśmie i faryzeuszy
  choice: Jawne powtórzenie słowa „sprawiedliwość”
  alternative: „bardziej niż uczeni w Piśmie i faryzeusze”
  rationale: Tekst porównuje miarę sprawiedliwości, nie rozstrzyga natomiast w tym wersecie, czy chodzi o jej ilość, jakość, źródło czy charakter. Powtórzenie nie dopowiada tej teologicznej kwestii.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano stanowczość końcowego ostrzeżenia oraz Mateuszowe wyrażenie „królestwo niebios”; uniknięto archaizmów i denominacyjnych dopowiedzeń.
