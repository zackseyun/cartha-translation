id: MAT.5.22
reference: Matthew 5:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: pl
  text: 'Ja zaś mówię wam: każdy, kto gniewa się na swego brata[a][d], będzie podlegał sądowi. Kto powie swemu bratu: „Raka!”[b], będzie podlegał radzie[c]. A kto powie: „Głupcze!”, będzie podlegał karze Gehenny ognia[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy dodają po słowach „gniewa się na swego brata”: „bez powodu”. Najstarsze i najlepiej poświadczone brzmienie nie zawiera tego dodatku.'
    reason: textual_variant
  - marker: b
    text: „Raka” to aramejskie określenie pogardliwe, znaczące mniej więcej „pusta głowo” lub „nic niewart człowieku”.
    reason: cultural_note
  - marker: c
    text: 'Możliwe też: „Sanhedrynowi”, czyli żydowskiej radzie sądowniczej.'
    reason: alternative_reading
  - marker: d
    text: Grecki rzeczownik oddany jako „brat” ma formę męską liczby pojedynczej, lecz może być użyty reprezentatywnie; sens wypowiedzi nie ogranicza się wyłącznie do męskiego rodzeństwa.
    reason: lexical_alternative
  - marker: e
    text: 'Możliwe też: „piekłu ognia”. „Gehenna” zachowuje grecki termin γέεννα, wywodzący się od Doliny Hinnom i związany z obrazem sądu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ja zaś mówię wam
  rationale: Zachowuje emfatyczne ἐγώ oraz kontrast wyrażony przez δέ, a zarazem brzmi naturalnie i uroczyście po polsku.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: Każdy, kto gniewa się
  rationale: Imiesłów czasu teraźniejszego ma tu ogólny, sentencjonalny charakter; przekład nie przesądza, czy chodzi o chwilowe wzburzenie, czy trwanie w gniewie.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: na swego brata
  rationale: Polskie „gniewać się na kogoś” naturalnie oddaje konstrukcję z celownikiem; „brat” zachowuje męską liczbę pojedynczą tekstu źródłowego, a jego reprezentatywny zakres objaśnia przypis.
- source_word: ἔνοχος ἔσται
  choice: będzie podlegał
  rationale: Oddaje prawniczą ideę narażenia na osąd lub karę i pozwala zachować paralelizm trzech ostrzeżeń.
- source_word: τῇ κρίσει
  choice: sądowi
  rationale: Zachowuje dwuznaczność między sądem jako organem a samym osądzeniem, bez nieuzasadnionego utożsamienia z konkretną instancją.
- source_word: Ῥακά
  choice: Raka
  rationale: Aramejską obelgę zachowano w transliteracji, aby nie spłaszczać jej kulturowego charakteru; sens podano w przypisie.
- source_word: τῷ συνεδρίῳ
  choice: Radzie
  rationale: Polskie „Rada” oddaje znaczenie συνέδριον; wielka litera sygnalizuje możliwą konkretną żydowską instytucję, nie przesądzając bez reszty identyfikacji z Sanhedrynem.
- source_word: Μωρέ
  choice: Głupcze!
  rationale: Wołacz oddaje bezpośrednią obelgę; „głupiec” zachowuje jej moralny ciężar lepiej niż współczesne, klinicznie kojarzące się zapożyczenia.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: Gehennie ognia
  rationale: Zachowuje szczególny termin γέεννα oraz dosłowną konstrukcję „ognia”, nie utożsamiając go automatycznie ze wszystkimi późniejszymi skojarzeniami słowa „piekło”.
theological_decisions:
- issue: Sposób oddania γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: „Gehenna” zachowuje żydowskie tło i obraz Doliny Hinnom związany z sądem, bez narzucania pełnego zakresu późniejszej terminologii teologicznej.
- issue: Zakres znaczeniowy ἀδελφός
  choice: brat
  alternative: brat lub siostra; bliźni; współwyznawca
  rationale: Tekst grecki używa rodzaju męskiego w liczbie pojedynczej. Przekład zachowuje tę formę, a szerokie, reprezentatywne zastosowanie wypowiedzi wyjaśnia w przypisie.
- issue: Charakter τῇ κρίσει
  choice: sądowi
  alternative: osądowi; trybunałowi
  rationale: Nie rozstrzyga, czy chodzi ściśle o lokalny sąd, procedurę sądową, czy szerzej o osąd, dzięki czemu zachowana zostaje celowa paralela i napięcie obrazu.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Zachowano retoryczną trójstopniową konstrukcję oraz prawniczy paralelizm. Formy „Raka”, „Rada” i „Gehenna” pozostawiają historyczno-kulturową fakturę tekstu, a niejasności objaśniają przypisy.
