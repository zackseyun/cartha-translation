  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: pl
  text: A jeśli ktoś zmusi cię do przejścia jednej mili[a], idź z nim dwie mile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Użyty tu czasownik może oznaczać przymuszenie kogoś przez władzę do wykonania usługi, co prawdopodobnie nawiązuje do praktyki stosowanej w czasach rzymskich. Chodzi o milę rzymską.
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „idź z nim dwie”; słowo „mile” jest domyślne z poprzedniej części zdania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: jeśli ktoś
  rationale: Zaimek nieokreślony wprowadza ogólny przypadek. Konstrukcja „jeśli ktoś” brzmi naturalnie po polsku i zachowuje szeroki zakres wypowiedzi.
- source_word: ἀγγαρεύσει
  choice: zmusi cię do przejścia
  rationale: Czasownik oznacza przymuszenie kogoś do wykonania usługi, zwłaszcza na mocy urzędowego nakazu. „Zmusi cię” zachowuje element przymusu, a „do przejścia” naturalnie łączy go z podaną odległością.
- source_word: μίλιον ἕν
  choice: jednej mili
  rationale: Chodzi o milę rzymską. Zachowanie jednostki „mila” oddaje konkretny obraz historyczny bez zastępowania go współczesnym przeliczeniem w tekście głównym.
- source_word: ὕπαγε
  choice: idź
  rationale: Prosty tryb rozkazujący wiernie i naturalnie oddaje wezwanie do pójścia dalej.
- source_word: μετ’ αὐτοῦ
  choice: z nim
  rationale: Przyimek μετά z dopełniaczem wyraża towarzyszenie; „z nim” jest bezpośrednim i idiomatycznym odpowiednikiem.
- source_word: δύο
  choice: dwie mile
  rationale: W grece występuje samo „dwie”, a jednostka jest domyślna z wcześniejszej części zdania. W polszczyźnie powtórzenie słowa „mile” zapewnia jasność i naturalność.
theological_decisions:
- issue: Historyczno-społeczny charakter przymusowej służby
  choice: Oddać przymus, nie wskazując w tekście głównym rzymskiego żołnierza ani innego konkretnego sprawcy.
  alternative: Wyraźnie opisać nakaz jako przymusową służbę na rzecz rzymskiego wojska.
  rationale: Czasownik i wzmianka o mili przywołują realia urzędowo nakładanej służby w świecie rzymskim, lecz sam tekst nie nazywa żołnierza ani urzędnika. Przekład zachowuje historyczne napięcie bez dopowiadania sprawcy.
translation_notes:
  register: Współczesna, zrozumiała i godna polszczyzna. Zdanie zachowuje zwięzłość aforyzmu oraz wyraźny kontrast między przymusowo narzuconą jedną milą a dobrowolnym przejściem dwóch.
