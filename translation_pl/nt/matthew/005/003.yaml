  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: pl
  text: Błogosławieni[a] ubodzy w duchu[b], bo do nich należy królestwo niebios[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Także: „szczęśliwi” lub „pomyślni”. Greckie słowo opisuje godny pozazdroszczenia stan związany z Bożą przychylnością, a nie tylko uczucie szczęścia.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „ubodzy w duchu” można też rozumieć jako „ubodzy duchowo” albo „świadomi swojej duchowej potrzeby”. Przekład zachowuje greckie sformułowanie, nie zawężając jego znaczenia.
    reason: alternative_reading
  - marker: c
    text: 'Dosłownie: „królestwo niebios”; jest to charakterystyczne dla Mateusza określenie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Szczęśliwi
  rationale: Greckie μακάριοι określa ludzi znajdujących się w godnym pozazdroszczenia stanie pomyślności i Bożej przychylności. „Szczęśliwi” jest naturalne we współczesnej polszczyźnie; przypis zaznacza, że nie chodzi jedynie o subiektywne uczucie.
- source_word: οἱ πτωχοὶ
  choice: ubodzy
  rationale: Rzeczownikowe użycie przymiotnika z rodzajnikiem oznacza „ubogich”. „Ubodzy” zachowuje sens niedostatku, nie zawężając go do żebraków.
- source_word: τῷ πνεύματι
  choice: w duchu
  rationale: Miejscownikowa konstrukcja „w duchu” zachowuje zwięzłość i otwartość greckiego celownika, nie utożsamiając πνεῦμα wprost z Duchem Świętym ani nie rozwijając frazy interpretacyjnie.
- source_word: ὅτι
  choice: bo
  rationale: ὅτι wprowadza uzasadnienie. „Bo” jest jasne, naturalne i bezpośrednie we współczesnym języku polskim.
- source_word: αὐτῶν ἐστιν
  choice: do nich należy
  rationale: Ta naturalna polska konstrukcja oddaje orzecznikowy dopełniacz i zachowuje czas teraźniejszy greckiego ἐστιν.
- source_word: ἡ βασιλεία
  choice: królestwo
  rationale: „Królestwo” jest utrwalonym i zrozumiałym odpowiednikiem βασιλεία, mogącym obejmować zarówno królewskie panowanie, jak i jego sferę.
- source_word: τῶν οὐρανῶν
  choice: niebios
  rationale: Liczba mnoga „niebios” formalnie odpowiada greckiemu τῶν οὐρανῶν, a zarazem brzmi naturalnie w polskiej tradycji biblijnej.
theological_decisions:
- issue: Znaczenie wyrażenia „ubodzy w duchu”
  choice: Zachować dosłowne wyrażenie „ubodzy w duchu” bez objaśniającego rozwinięcia.
  alternative: „ubodzy duchowo”; „pokorni”; „świadomi swojej duchowej potrzeby”
  rationale: Grecka fraza jest treściowo bogata i pozostaje częściowo otwarta. Rozwinięcie w tekście głównym rozstrzygałoby to, czego tekst źródłowy nie dopowiada.
- issue: Teraźniejsze posiadanie królestwa
  choice: 'Oddać ἐστιν w czasie teraźniejszym: „do nich należy”.'
  alternative: „będzie do nich należeć”
  rationale: Grecki tekst używa czasu teraźniejszego, dlatego nie należy przesuwać obietnicy wyłącznie w przyszłość.
translation_notes:
  register: Współczesny, prosty i godny rejestr. „Bo” zapewnia naturalny tok zdania, a „królestwo niebios” zachowuje charakterystyczne brzmienie Mateuszowej formuły. Wszystkie przypisy są oznaczone w tekście głównym.
