  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: pl
  text: ani na ziemię[a], bo jest podnóżkiem jego stóp; ani na Jerozolimę[b], bo jest miastem wielkiego Króla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nawiązanie do Iz 66:1: „ziemia jest podnóżkiem moich stóp”.'
    reason: cross_reference
  - marker: b
    text: 'Dosłownie grecki przyimek oznacza „do Jerozolimy” lub „ku Jerozolimie”, lecz tutaj najpewniej należy do idiomatycznej formuły przysięgi: „na Jerozolimę”.'
    reason: lexical_alternative
  - marker: c
    text: Nawiązanie do Ps 48:3, gdzie Jerozolima jest nazwana „miastem wielkiego Króla”.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ani
  rationale: Kontynuuje szereg zakazów z poprzedniego wersetu i zachowuje równoległą składnię.
- source_word: ἐν τῇ γῇ
  choice: na ziemię
  rationale: W polskiej formule przysięgi naturalnie mówi się „przysięgać na” coś; oddanie dosłowne „w ziemi” zaciemniałoby sens.
- source_word: γῇ
  choice: ziemię
  rationale: W zestawieniu z niebem i Jerozolimą chodzi o ziemię, nie o konkretny kraj.
- source_word: ὅτι
  choice: bo
  rationale: Wyraża przyczynę zakazu w naturalnym, współczesnym polskim stylu.
- source_word: ὑποπόδιόν
  choice: podnóżkiem
  rationale: To precyzyjny i utrwalony odpowiednik, zachowujący także nawiązanie do języka Pisma.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: jego stóp
  rationale: Zachowuje grecką konstrukcję dopełniaczową oraz domyślny charakter odniesienia zaimka.
- source_word: εἰς Ἱεροσόλυμα
  choice: na Jerozolimę
  rationale: W kontekście przysięgi εἰς pełni funkcję idiomatyczną. Polski przyimek „na” jasno oddaje formułę przysięgania, a nietypowa grecka konstrukcja zostaje odnotowana w przypisie.
- source_word: πόλις
  choice: miastem
  rationale: Bezpośredni i naturalny polski odpowiednik.
- source_word: τοῦ μεγάλου βασιλέως
  choice: wielkiego Króla
  rationale: Zachowuje podniosłe określenie oraz nawiązanie do Ps 48; wielka litera sygnalizuje, że tytuł odnosi się do Boga.
theological_decisions:
- issue: Odniesienie zaimka αὐτοῦ w wyrażeniu „podnóżkiem jego stóp”
  choice: Zapisano „jego” małą literą, pozostawiając odniesienie formalnie domyślne, choć kontekst wskazuje na Boga.
  alternative: „Jego” wielką literą, aby jednoznacznie wskazać Boga.
  rationale: Greka nie rozróżnia wielkości litery w sposób odpowiadający polskiemu zapisowi grzecznościowo-religijnemu; mała litera nie dopowiada więcej niż tekst źródłowy.
- issue: Tożsamość „wielkiego Króla”
  choice: Zapisano „Króla” wielką literą jako tytuł Boga w rozpoznawalnym nawiązaniu do Psalmu 48.
  alternative: „wielkiego króla” małymi literami, bez typograficznego wskazania referenta.
  rationale: Kontekst oraz niemal dosłowne nawiązanie do Ps 48:3 wskazują na Boga, a zapis tytułu wielką literą jest naturalny w polszczyźnie religijnej.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano równoległość obu zakazów oraz biblijną obrazowość „podnóżka”. Średnik wyraźnie rozdziela współrzędne człony dłuższej wypowiedzi.
