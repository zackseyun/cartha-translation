  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: pl
  text: A jeśli twoja prawa ręka prowadzi cię do upadku[a], odetnij ją i odrzuć ją. Lepiej bowiem dla ciebie, żeby zginęła jedna z części twojego ciała, niż żeby całe twoje ciało poszło do Gehenny[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „prowadzi cię do grzechu”. Grecki czasownik dosłownie odnosi się do spowodowania potknięcia lub upadku.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „do piekła”. Greckie słowo „Gehenna” to określenie wywodzące się od Doliny Hinnoma i używane w odniesieniu do sądu ostatecznego.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: twoja prawa ręka
  rationale: Naturalny polski odpowiednik, zachowujący konkretny obraz części ciała oraz paralelę z poprzednim wersetem.
- source_word: σκανδαλίζει
  choice: prowadzi cię do upadku
  rationale: Zachowuje metaforę potknięcia i upadku, a zarazem w kontekście moralnym pozostaje zrozumiałe; przypis podaje bardziej interpretacyjne „prowadzi cię do grzechu”.
- source_word: ἔκκοψον
  choice: odetnij ją
  rationale: Bezpośredni i naturalny odpowiednik stanowczego imperatywu odnoszącego się do ręki.
- source_word: βάλε ἀπὸ σοῦ
  choice: odrzuć
  rationale: Zwięźle oddaje zdecydowane usunięcie od siebie i odtrącenie; dosłowniejsza konstrukcja „odrzuć ją od siebie” byłaby po polsku cięższa i częściowo redundantna.
- source_word: συμφέρει γάρ σοι
  choice: Lepiej bowiem dla ciebie
  rationale: Naturalnie wyraża korzyść wynikającą z porównania, bez finansowego odcienia słowa „opłaca się”.
- source_word: ἵνα ἀπόληται
  choice: żeby zginęła
  rationale: Zachowuje moc czasownika ἀπόλλυμι i kontrast między utratą jednej części ciała a losem całego ciała.
- source_word: ἓν τῶν μελῶν σου
  choice: jedna z części twojego ciała
  rationale: Współczesne i szerokie znaczeniowo sformułowanie; „członków” byłoby dziś archaiczne lub niejednoznaczne, a „kończyn” zbyt wąskie.
- source_word: ὅλον τὸ σῶμά σου
  choice: całe twoje ciało
  rationale: Naturalnie zachowuje kontrast całości z jedną częścią ciała.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: poszło do Gehenny
  rationale: Oddaje czasownik ruchu ἀπέρχομαι i zachowuje źródłowy termin γέεννα zamiast utożsamiać go bez objaśnienia ze wszystkimi późniejszymi skojarzeniami słowa „piekło”.
theological_decisions:
- issue: Oddanie terminu γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: Transliteracja zachowuje historycznie i eschatologicznie obciążony termin wywodzący się od Doliny Hinnoma, nie rozstrzygając milcząco wszystkich późniejszych ujęć doktrynalnych. Powszechny odpowiednik „piekło” podano w przypisie.
- issue: Zakres znaczeniowy σκανδαλίζει
  choice: prowadzi cię do upadku
  alternative: prowadzi cię do grzechu
  rationale: Tekst główny zachowuje metaforę potknięcia/upadku obecną w greckim czasowniku, natomiast przypis wyjaśnia jej moralny sens w tym kontekście.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano mocną hiperboliczną obrazowość wypowiedzi oraz metaforę upadku, unikając archaicznego „członek” i denominacyjnego doprecyzowywania natury Gehenny.
