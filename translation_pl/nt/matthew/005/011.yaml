id: MAT.5.11
reference: Matthew 5:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: pl
  text: Błogosławieni jesteście, gdy wam ubliżają[a], prześladują was i kłamliwie mówią o was wszelkie zło[b] z mojego powodu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „znieważają was”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „mówią o was wszystko, co złe”.'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „ze względu na mnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Błogosławieni jesteście
  rationale: Zachowuje rozpoznawalną formułę błogosławieństwa oraz jej religijny ciężar znaczeniowy; „szczęśliwi” mogłoby nadmiernie sugerować jedynie stan emocjonalny.
- source_word: ὅταν
  choice: gdy
  rationale: Naturalnie wprowadza ogólną, przyszłą możliwość wyrażoną w grece przez tryb łączący, bez narzucania znaczenia jednorazowego.
- source_word: ὀνειδίσωσιν
  choice: wam ubliżają
  rationale: Jasno i współcześnie oddaje słowną zniewagę; składnia z celownikiem jest naturalna w języku polskim.
- source_word: διώξωσιν
  choice: prześladują was
  rationale: Zachowuje szeroki sens wrogiego traktowania z powodu więzi z Jezusem, nie ograniczając go do przemocy fizycznej.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: mówią przeciwko wam wszelkie zło
  rationale: Możliwie blisko zachowuje szeroki zakres πᾶν πονηρόν oraz wrogi kierunek wypowiedzi wyrażony przez κατά z dopełniaczem.
- source_word: ψευδόμενοι
  choice: kłamliwie
  rationale: Naturalny polski przysłówek wskazuje, że wypowiadane zarzuty są nieprawdziwe, i odnosi się do następującego aktu mówienia.
- source_word: ἕνεκεν ἐμοῦ
  choice: z mojego powodu
  rationale: Bezpośrednio i współcześnie wyraża, że przyczyną wrogości jest więź adresatów z Jezusem; nie dopowiada charakteru tej więzi.
theological_decisions:
- issue: Zakres opisanej wrogości
  choice: Werset obejmuje słowne znieważanie, prześladowanie oraz kłamliwe wypowiadanie zła z powodu Jezusa, bez zawężania prześladowania do jednej formy.
  alternative: Ograniczenie prześladowania wyłącznie do przemocy fizycznej albo całego opisu wyłącznie do oszczerstwa.
  rationale: Trzy skoordynowane czasowniki wskazują na szerokie spektrum wrogości. Przekład zachowuje tę szerokość i nie utożsamia wszystkich członów z jednym rodzajem krzywdy.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjną formułę „Błogosławieni jesteście”, natomiast pozostałe słownictwo jest obecne i zrozumiałe. Szyk zdania odzwierciedla trzy skoordynowane greckie formy czasownikowe, a „kłamliwie” jednoznacznie wskazuje na fałszywość wrogich wypowiedzi.
