source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: pl
  text: 'A ja wam mówię: nie sprzeciwiajcie się złemu człowiekowi.[a] Lecz jeśli ktoś uderzy cię w prawy policzek, nadstaw mu także drugi policzek.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie sprzeciwiajcie się złu” albo „Nie sprzeciwiajcie się Złemu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: A ja wam mówię
  rationale: Konstrukcja zachowuje emfatyczne ἐγώ oraz kontrast wyrażony przez δέ, a zarazem brzmi naturalnie i dostojnie po polsku.
- source_word: μὴ ἀντιστῆναι
  choice: Nie sprzeciwiajcie się
  rationale: Czasownik ἀνθίστημι oznacza przeciwstawienie się lub stawianie oporu. Polski odpowiednik zachowuje szeroki sens i nie zawęża wypowiedzi wyłącznie do odwetu.
- source_word: τῷ πονηρῷ
  choice: złemu człowiekowi
  rationale: Rodzajnik z przymiotnikiem w celowniku może oznaczać zło, złego człowieka albo Złego. Następujący przykład konkretnego napastnika przemawia tutaj za odniesieniem osobowym i ogólnym.
- source_word: ῥαπίζει
  choice: uderzy
  rationale: ῥαπίζω oznacza uderzenie ręką, często spoliczkowanie. „Uderzy w policzek” jest w tym zdaniu naturalniejsze niż „spoliczkuje w policzek” i nie traci podstawowego obrazu.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: w prawy policzek
  rationale: σιαγών może znaczyć szczękę lub policzek; w kontekście uderzenia naturalnym polskim odpowiednikiem jest „policzek”.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: nadstaw mu także drugi
  rationale: Dosłownie chodzi o zwrócenie ku napastnikowi także drugiego policzka. Idiomatyczne „nadstaw” jasno oddaje gest, a „drugi” jest jednoznaczne z kontekstu.
- source_word: ὅστις
  choice: jeśli ktoś
  rationale: W tej konstrukcji wyrażenie ma sens nieokreślony i warunkowy; „jeśli ktoś” jest naturalnym współczesnym odpowiednikiem.
theological_decisions:
- issue: Znaczenie τῷ πονηρῷ
  choice: 'osobowe i ogólne: „złemu człowiekowi”'
  alternative: 'abstrakcyjne: „złu”; osobowe i szczególne: „Złemu”'
  rationale: Grecka forma jest rzeczywiście wieloznaczna. Bezpośrednio następujący przykład człowieka uderzającego w policzek sprzyja odczytaniu osobowemu i ogólnemu, lecz pozostałe możliwości zachowano w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o podniosłym, lecz przystępnym rejestrze. Zachowano zmianę z liczby mnogiej („wam”, „sprzeciwiajcie się”) na pojedynczą w przykładzie („cię”, „mu”), obecną w grece.
