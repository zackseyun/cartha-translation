id: MAT.5.40
reference: Matthew 5:40
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: pl
  text: A temu, kto chce wytoczyć ci sprawę sądową[a] i zabrać twoją tunikę[b], odstąp mu także płaszcz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pozwać cię do sądu”. Dosłownie: „być sądzonym z tobą”; w tym kontekście chodzi o wszczęcie sprawy sądowej przeciw tobie.'
    reason: lexical_alternative
  - marker: b
    text: Tunika była szatą spodnią, a płaszcz — szatą wierzchnią.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: temu, kto chce
  rationale: Imiesłów z rodzajnikiem wskazuje ogólnie na osobę podejmującą taki zamiar; polskie sformułowanie jest naturalne i zachowuje znaczenie woli.
- source_word: σοι κριθῆναι
  choice: pozwać cię do sądu
  rationale: Bezokolicznik dosłownie odnosi się do poddania sprawy osądowi; w kontekście żądania szaty chodzi o wystąpienie przeciw komuś na drodze sądowej.
- source_word: χιτῶνά
  choice: tunikę
  rationale: χιτών oznacza spodnią szatę noszoną bliżej ciała; „tunika” zachowuje realia historyczne oraz odróżnienie od ἱμάτιον.
- source_word: λαβεῖν
  choice: zabrać
  rationale: W kontekście roszczenia sądowego czasownik oznacza wejście w posiadanie cudzej tuniki; „zabrać” brzmi naturalnie i zachowuje konkretność wypowiedzi.
- source_word: ἄφες
  choice: odstąp
  rationale: Tryb rozkazujący ἀφίημι wyraża dobrowolne zrzeczenie się lub pozostawienie czegoś drugiej osobie. „Odstąp” zwięźle oddaje radykalny nakaz, nie dopowiadając formalnej darowizny.
- source_word: ἱμάτιον
  choice: płaszcz
  rationale: ἱμάτιον to wierzchnia szata, odróżniona od tuniki; „płaszcz” jest zrozumiałym polskim odpowiednikiem tej funkcji.
- source_word: καὶ ... καὶ
  choice: A ... również
  rationale: Pierwsze καί łączy zdanie z poprzednią wypowiedzią, drugie zaś dodaje kolejną, dalej idącą rzecz; „również” zachowuje tę siłę addytywną.
theological_decisions:
- issue: Etyczna siła polecenia Jezusa w sporze sądowym
  choice: Bezpośredni nakaz radykalnej rezygnacji z odwetu i dobrowolnego ustąpienia także w konkretnej sprawie majątkowej.
  alternative: Ogólna, złagodzona zasada ustępowania ze swoich praw.
  rationale: Tryb rozkazujący ἄφες oraz konkretny obraz dwóch szat wymagają zachowania ostrości wypowiedzi, bez sprowadzania jej do abstrakcyjnej metafory ani wpisywania w określony system doktrynalny.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano konkretne nazwy ubioru oraz prawniczy kontekst, a zarazem uniknięto nadmiernie technicznego języka.
