review_pass:
  verdict: revise
  source_fidelity: 'Sens zasadniczo oddano trafnie: chodzi o osobę zamierzającą wszcząć przeciw adresatowi postępowanie sądowe, aby uzyskać jego χιτών, oraz o nakaz oddania także ἱμάτιον. Jednak αὐτῷ („mu”) powinno zostać wyraźnie oddane, a „odstąp również płaszcz” brzmi eliptycznie i może chwilowo sugerować po prostu zrezygnowanie z płaszcza, nie przekazanie go tej osobie.'
  naturalness: „Pozwać cię do sądu” jest zrozumiałe, lecz „wytoczyć ci sprawę sądową” lepiej odpowiada polskiej składni oraz kontekstowi prawnemu. „Odstąp mu także płaszcz” jest naturalne, jednoznaczne i zachowuje godny, współczesny rejestr.
  terminology: „Tunika” i „płaszcz” właściwie zachowują rozróżnienie χιτών / ἱμάτιον. Nie ma potrzeby zastępowania ich współczesnymi nazwami ubioru. Przypis dotyczący terminu prawnego należy doprecyzować, ponieważ dosłowne „sądzić się z tobą” nie oddaje dobrze strony biernej κριθῆναι.
  issues:
  - severity: medium
    issue: Brak wyraźnego odpowiednika αὐτῷ
    rationale: Grecki zaimek celownikowy wskazuje, że płaszcz ma zostać pozostawiony właśnie osobie wnoszącej sprawę. Dodanie „mu” usuwa niepotrzebną elipsę.
  - severity: low
    issue: Niezręczna konstrukcja „odstąp również płaszcz”
    rationale: Choć znaczenie jest możliwe do odczytania, bez celownika brzmi mniej naturalnie i słabiej wyraża przekazanie rzeczy drugiej osobie.
  - severity: low
    issue: Przypis a nieprecyzyjnie opisuje formę grecką
    rationale: κρυθῆναι jest bezokolicznikiem strony biernej („być sądzonym”), który w tym kontekście oznacza wejście w postępowanie sądowe przeciw adresatowi; proponowane „sądzić się z tobą” zaciera tę formę.
  revised_text: A temu, kto chce wytoczyć ci sprawę sądową[a] i zabrać twoją tunikę[b], odstąp mu także płaszcz.
