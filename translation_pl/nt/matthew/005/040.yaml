  to: A temu, kto chce wytoczyć ci sprawę sądową[a] i zabrać twoją tunikę[b], odstąp mu także płaszcz.
  rationale: Zmiana zachowuje prawną i konkretną wymowę greckiego tekstu, a zarazem wyraźnie oddaje αὐτῷ przez „mu”. Zmieniono czasownik prawny na idiomatyczne polskie „wytoczyć ci sprawę sądową” i skorygowano objaśnienie w przypisie, nie rozstrzygając niczego ponad znaczenie tekstu.
