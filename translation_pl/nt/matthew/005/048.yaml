id: MAT.5.48
reference: Matthew 5:48
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: pl
  text: Wy zatem bądźcie doskonali[a], jak doskonały jest wasz Ojciec niebieski.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „zupełni”, „pełni” lub „dojrzali”. Greckie τέλειος może oznaczać zarówno doskonałość, jak i pełnię, integralność bądź dojrzałość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: bądźcie
  rationale: Forma przyszła czasownika εἰμί ma w tym kontekście moc nakazu lub wezwania. Polski tryb rozkazujący oddaje tę funkcję naturalniej niż dosłowne „będziecie”.
- source_word: οὖν
  choice: zatem
  rationale: Wyraża wniosek wynikający z poprzedzającego nauczania, zwłaszcza z wezwania do miłości nieprzyjaciół.
- source_word: ὑμεῖς
  choice: Wy
  rationale: Jawny zaimek w grece jest emfatyczny; zachowanie go w polskim uwydatnia adresatów wezwania.
- source_word: τέλειοι / τέλειός
  choice: doskonali / doskonały
  rationale: „Doskonały” jest bezpośrednim i utrwalonym odpowiednikiem, zachowującym siłę etycznego wezwania oraz powtórzenie tego samego greckiego słowa w obu częściach zdania. Szerszy zakres znaczeniowy podano w przypisie.
- source_word: ὡς
  choice: jak
  rationale: Naturalnie wprowadza porównanie uczniów z Ojcem.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: wasz Ojciec niebieski
  rationale: Oddaje konstrukcję dzierżawczą i przymiotnik οὐράνιος w naturalnym, utrwalonym polskim szyku.
theological_decisions:
- issue: Znaczenie τέλειος w wezwaniu etycznym
  choice: W tekście głównym „doskonały”, z objaśnieniem zakresu znaczeniowego w przypisie.
  alternative: zupełny, pełny, dojrzały
  rationale: W bezpośrednim kontekście słowo wskazuje na pełnię i niepodzielność miłości, obejmującej także nieprzyjaciół. „Doskonały” zachowuje jednak dosłowną, wymagającą siłę wypowiedzi, nie rozstrzygając ponad tekst, na czym dokładnie polega ta doskonałość.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Początkowe „Wy” zachowuje nacisk greckiego zaimka, a „zatem” wyraźnie łączy werset z poprzednim wywodem.
