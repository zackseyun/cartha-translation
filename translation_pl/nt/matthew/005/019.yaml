id: MAT.5.19
reference: Matthew 5:19
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: pl
  text: Kto więc[a] uchyli jedno z tych najmniejszych przykazań i będzie uczył ludzi, by postępowali tak samo, zostanie nazwany najmniejszym w królestwie niebios. Kto zaś będzie je wypełniał i nauczał tych przykazań, ten zostanie nazwany wielkim w królestwie niebios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dosłownie czasownik ten znaczy „rozwiązać” lub „rozluźnić”; tutaj może oznaczać także „osłabić moc”, „unieważnić” albo „złamać” przykazanie.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: więc
  rationale: Naturalnie zaznacza wniosek wynikający z poprzedniej wypowiedzi Jezusa, nie nadając zdaniu nadmiernie urzędowego tonu.
- source_word: λύσῃ
  choice: uchyli
  rationale: W kontekście przykazań λύω oznacza rozluźnienie ich mocy, unieważnienie lub potraktowanie jako niewiążących. „Uchyli” zachowuje prawno-normatywny sens; przypis podaje inne możliwe odcienie.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: choćby jedno z tych najmniejszych przykazań
  rationale: Oddaje przynależność jednego przykazania do grupy określonej jako „najmniejsze”, a „choćby” naturalnie wyraża minimalny zakres bez zmiany sensu.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: będzie uczył ludzi, by postępowali tak samo
  rationale: „Ludzi” trafnie oddaje ogólne odniesienie ἀνθρώπους, natomiast „tak samo” wskazuje wstecz na uchylanie przykazania.
- source_word: ἐλάχιστος κληθήσεται
  choice: zostanie nazwany najmniejszym
  rationale: Zachowuje przyszłą stronę bierną czasownika καλέω oraz stopień najwyższy ἐλάχιστος bez dopowiadania wykluczenia z królestwa.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: będzie je wypełniał i ich nauczał
  rationale: W odniesieniu do przykazań polskie „wypełniać” naturalnie oddaje ποιέω jako wykonywanie ich treści. Zróżnicowanie zaimków wynika z polskiej składni czasowników.
- source_word: οὗτος
  choice: ten
  rationale: Zachowuje emfatyczne wskazanie i wyraźny kontrast między obiema osobami.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: w królestwie niebios
  rationale: To utrwalony i godny polski odpowiednik charakterystycznego dla Mateusza wyrażenia z liczbą mnogą οὐρανῶν.
theological_decisions:
- issue: Status „najmniejszego” i „wielkiego” w królestwie
  choice: Zachowano porównawczy status wewnątrz królestwa bez wyjaśniania go jako wykluczenia lub technicznej rangi nagrody.
  alternative: Odczytać „najmniejszego” jako osobę wykluczoną z królestwa albo „wielkiego” jako określenie konkretnego stopnia nagrody.
  rationale: Tekst mówi, że dana osoba zostanie tak nazwana „w królestwie niebios”; przekład nie powinien rozstrzygać szerszego sporu soteriologicznego.
- issue: Zakres τοὺς ἀνθρώπους
  choice: „ludzi” jako ogólne określenie wszystkich osób.
  alternative: „mężczyzn” lub „innych”.
  rationale: Rzeczownik ma tu odniesienie ogólnoludzkie, a współczesne polskie „ludzi” dokładnie i naturalnie przekazuje ten zakres.
- issue: Przedmiot ποιήσῃ καὶ διδάξῃ
  choice: Domyślnym przedmiotem obu czynności są przykazania.
  alternative: Rozumieć drugie „nauczał” bez odniesienia do przykazań albo jako ogólne nauczanie własnym przykładem.
  rationale: Paralelizm z pierwszą częścią zdania i najbliższy kontekst wskazują na wykonywanie tych przykazań oraz nauczanie ich.
translation_notes:
  register: Współczesna, godna polszczyzna o przejrzystej składni. „Królestwo niebios” zachowuje Mateuszową formułę, a równoległe „zostanie nazwany” podtrzymuje retoryczną symetrię wersetu.
