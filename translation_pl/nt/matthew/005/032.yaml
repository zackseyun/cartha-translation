id: MAT.5.32
reference: Matthew 5:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: pl
  text: 'Ja jednak mówię wam: każdy, kto rozwodzi się ze swoją żoną — z wyjątkiem powodu niemoralności seksualnej[a] — sprawia, że dopuszcza się ona cudzołóstwa[b]. A kto poślubia rozwiedzioną kobietę, dopuszcza się cudzołóstwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie porneia jest szerokim określeniem niedozwolonych zachowań seksualnych; bywa też tłumaczone jako „nierząd” lub „nieczystość seksualna”.
    reason: lexical_alternative
  - marker: b
    text: 'Dosłowniej możliwe: „sprawia, że staje się cudzołożnicą”. Grecki bezokolicznik ma formę bierną, dlatego możliwy jest również sens wynikowy: „sprawia, że zostaje uwikłana w cudzołóstwo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: rozwodzi się / rozwiedzioną kobietę
  rationale: W kontekście małżeństwa czasownik ἀπολύω oznacza rozwód, a nie jedynie ogólne „oddalenie” lub „uwolnienie”. Użycie słownictwa związanego z rozwodem w obu miejscach zachowuje prawnomałżeński sens i spójność.
- source_word: γυναῖκα
  choice: żoną
  rationale: Rzeczownik γυνή może znaczyć „kobieta” lub „żona”, lecz zaimek dzierżawczy αὐτοῦ oraz kontekst rozwodu wskazują tutaj na żonę.
- source_word: παρεκτὸς λόγου πορνείας
  choice: z wyjątkiem przypadku niemoralności seksualnej
  rationale: παρεκτός wprowadza wyjątek, λόγος oznacza tu przypadek lub podstawę, a πορνεία jest szerokim określeniem niedozwolonych zachowań seksualnych. „Niemoralność seksualna” nie zawęża znaczenia wyłącznie do cudzołóstwa ani jednego konkretnego czynu.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: sprawia, że dopuszcza się ona cudzołóstwa
  rationale: Konstrukcja ποιέω z bezokolicznikiem wyraża spowodowanie czynności lub stanu. Polski przekład jest naturalny i czytelny, natomiast formalnie bierną postać μοιχευθῆναι oraz wynikową możliwość rozumienia zachowano w przypisie.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: kto poślubia
  rationale: Zdanie względne z ἐάν wyraża ogólny, nieokreślony warunek. „Kto poślubia” oddaje go zwięźle i naturalnie.
- source_word: μοιχᾶται
  choice: dopuszcza się cudzołóstwa
  rationale: Forma czasu teraźniejszego opisuje czyn w sposób ogólny. Polski zwrot „dopuszcza się cudzołóstwa” jest idiomatyczny i nie narzuca nienaturalnego rozstrzygnięcia kategorii strony greckiego czasownika.
- source_word: πᾶς ὁ ἀπολύων
  choice: każdy, kto rozwodzi się
  rationale: Męska forma imiesłowu odnosi się w tej sytuacji do męża, co pozostaje widoczne w wyrażeniu „ze swoją żoną”. Konstrukcja „każdy, kto” naturalnie oddaje ogólny charakter wypowiedzi.
theological_decisions:
- issue: Znaczenie klauzuli wyjątku παρεκτὸς λόγου πορνείας
  choice: 'Oddano ją jako rzeczywisty wyjątek: „z wyjątkiem przypadku niemoralności seksualnej”.'
  alternative: „z wyjątkiem związku niezgodnego z prawem” albo interpretacyjne zawężenie do jednego rodzaju czynu seksualnego
  rationale: Greka wyraźnie wprowadza wyjątek, ale nie określa dokładniej całego zakresu πορνεία. Przekład zachowuje wyjątek, nie rozstrzygając sporów o jego precyzyjny zakres.
- issue: Znaczenie μοιχευθῆναι po ποιεῖ
  choice: W tekście głównym użyto naturalnego „sprawia, że dopuszcza się ona cudzołóstwa”, a formalnie bierny lub wynikowy niuans odnotowano w przypisie.
  alternative: „sprawia, że staje się cudzołożnicą” lub „sprawia, że zostaje uwikłana w cudzołóstwo”
  rationale: Bezokolicznik jest bierny w formie, a jego sens może być odczytywany czynnościowo albo wynikowo. Przypis zachowuje tę istotną niejednoznaczność bez przeciążania tekstu głównego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia zachowuje stanowczy kontrast wprowadzony przez ἐγὼ δὲ λέγω ὑμῖν, a jednocześnie brzmi naturalnie po polsku. Termin „niemoralność seksualna” jest szerszy i bardziej zrozumiały współcześnie niż samo „nierząd”; jego tradycyjne odpowiedniki podano w przypisie.
