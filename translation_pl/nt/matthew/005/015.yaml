id: MAT.5.15
reference: Matthew 5:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: pl
  text: Nie zapala się też lampy i nie stawia jej pod koszem[a], lecz na stojaku na lampę, a ona świeci[b] wszystkim w domu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie chodzi o naczynie służące jako miara produktów sypkich; tradycyjnie: „pod korcem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „i daje światło wszystkim w domu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ καίουσιν λύχνον
  choice: Nie zapala się też lampy
  rationale: Konstrukcja bezosobowa naturalnie oddaje grecką, ogólną formę trzeciej osoby liczby mnogiej; „zapalać lampę” jest współczesnym i idiomatycznym odpowiednikiem καίω z λύχνος.
- source_word: καὶ τιθέασιν αὐτὸν
  choice: i nie stawia jej
  rationale: Polski zaimek przyjmuje rodzaj rzeczownika „lampa”. Powtórzenie przeczenia jest konieczne dla naturalnego powiązania z polską konstrukcją „nie zapala się”.
- source_word: ὑπὸ τὸν μόδιον
  choice: pod koszem
  rationale: μόδιος oznacza miarę produktów sypkich, a także służące do odmierzania naczynie. „Kosz” zachowuje konkretny obraz i pozostaje zrozumiały; dokładniejsze znaczenie podano w przypisie.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: lecz na stojaku na lampę
  rationale: λυχνία to podstawa lub stojak przeznaczony na lampę. To określenie jest precyzyjniejsze niż tradycyjny „świecznik”, który współczesnemu czytelnikowi kojarzy się przede wszystkim ze świecami.
- source_word: καὶ λάμπει
  choice: a ona świeci
  rationale: „Świeci” bezpośrednio oddaje λάμπει. Zaimek jawnie wskazuje lampę jako podmiot i zapewnia płynność polskiego zdania.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: wszystkim w domu
  rationale: Zwięzłe i naturalne sformułowanie zachowuje powszechny zakres πᾶσιν oraz przestrzenne znaczenie οἰκία w tej scenie.
theological_decisions:
- issue: Niewyrażony, ogólny podmiot czasowników w trzeciej osobie liczby mnogiej
  choice: 'Polska konstrukcja bezosobowa: „Nie zapala się też… i nie stawia…”'
  alternative: „Ludzie też nie zapalają…” albo „Nikt też nie zapala…”
  rationale: Forma bezosobowa zachowuje przysłowiową ogólność greckiego zdania, nie wprowadza konkretnego podmiotu i brzmi naturalnie we współczesnej polszczyźnie.
translation_notes:
  register: Język współczesny, prosty i godny. Zachowano konkretny obraz lampy oraz równoległą budowę wypowiedzi, unikając archaicznego „korca” w tekście głównym i potencjalnie mylącego „świecznika”.
