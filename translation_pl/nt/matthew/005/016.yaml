id: MAT.5.16
reference: Matthew 5:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: pl
  text: Tak samo niech wasze światło świeci przed ludźmi, aby widzieli wasze dobre czyny i oddawali chwałę waszemu Ojcu, który jest w niebiosach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Tak samo
  rationale: Naturalnie wskazuje na sposób opisany w poprzedzającym obrazie lampy i światła, zachowując więź dyskursywną.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: niech wasze światło świeci
  rationale: Konstrukcja z „niech” naturalnie oddaje grecki imperatyw trzeciej osoby; zachowano pojedyncze, zbiorowe „światło”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: przed ludźmi
  rationale: „Ludźmi” jest współczesnym, naturalnym i ogólnym odpowiednikiem ἀνθρώπων, obejmującym ludzi bez ograniczenia do mężczyzn.
- source_word: ὅπως ἴδωσιν
  choice: aby widzieli
  rationale: Oddaje cel wyrażony przez ὅπως z trybem łączącym, bez przesadnego rozstrzygania między odcieniem celu i zamierzonego skutku.
- source_word: τὰ καλὰ ἔργα
  choice: dobre czyny
  rationale: „Czyny” brzmią w tym kontekście naturalniej niż bardziej techniczne „uczynki”, a „dobre” jasno oddaje καλὰ, które może również znaczyć szlachetne lub piękne.
- source_word: δοξάσωσιν
  choice: oddawali chwałę
  rationale: Zwrot jasno i naturalnie oddaje skierowane ku Bogu δοξάζω oraz zachowuje jego teologiczną wagę.
- source_word: τὸν πατέρα ὑμῶν
  choice: waszemu Ojcu
  rationale: Zachowuje osobową i relacyjną formę greckiego wyrażenia, z wielką literą zgodną z polską normą religijną.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: który jest w niebiosach
  rationale: Zachowuje grecką liczbę mnogą οὐρανοῖς, a zarazem pozostaje zrozumiałe i godne stylistycznie.
theological_decisions:
- issue: Ogólny zakres ἀνθρώπων
  choice: przed ludźmi
  alternative: przed innymi
  rationale: Polskie „ludzie” naturalnie obejmuje wszystkich, dlatego nie ma potrzeby naśladować formalnego rodzaju greckiego kosztem współczesnej polszczyzny.
- issue: Liczba mnoga οὐρανοῖς
  choice: w niebiosach
  alternative: w niebie
  rationale: Liczba mnoga została zachowana zgodnie ze źródłem; nie narzuca ona dodatkowej kosmologicznej interpretacji.
- issue: Cel widzialności dobrych czynów
  choice: aby widzieli ... i oddawali chwałę ... Ojcu
  alternative: żeby zobaczyli ... i wysławili ... Ojca
  rationale: 'Składnia zachowuje napięcie tekstu: czyny uczniów mają być widoczne, lecz chwała ma zostać skierowana nie ku nim, ale ku Ojcu.'
translation_notes:
  register: Współczesny, naturalny i godny rejestr. „Tak samo” łączy zdanie z poprzednim obrazem; „dobre czyny” unika nadmiernie kościelnego brzmienia, a „w niebiosach” świadomie zachowuje liczbę mnogą tekstu greckiego.
source_grounding:
  english_pob_role: consult_only
