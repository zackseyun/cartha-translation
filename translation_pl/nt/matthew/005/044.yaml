source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: pl
  text: 'Ja zaś mówię wam: kochajcie swoich nieprzyjaciół i módlcie się za tych, którzy was prześladują.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ja zaś mówię wam
  rationale: Zaś zachowuje kontrast wyrażony przez δέ, a jawne „Ja” oddaje emfatyczne ἐγώ. Sformułowanie jest uroczyste, lecz naturalne we współczesnej polszczyźnie.
- source_word: ἀγαπᾶτε
  choice: miłujcie
  rationale: Tryb rozkazujący został zachowany. „Miłujcie” jest zrozumiałym, godnym i utrwalonym biblijnie odpowiednikiem, który nie zawęża nakazu wyłącznie do uczuć ani do konkretnych działań.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: swoich nieprzyjaciół
  rationale: Polski zaimek zwrotny „swoich” naturalnie odnosi nieprzyjaciół do adresatów i wiernie oddaje ὑμῶν.
- source_word: προσεύχεσθε
  choice: módlcie się
  rationale: Standardowy polski odpowiednik deponencyjnej formy προσεύχομαι, zachowujący siłę trybu rozkazującego bez nadmiernego eksponowania aspektu ciągłego.
- source_word: ὑπὲρ
  choice: za
  rationale: Przy modlitwie polskie „za” idiomatycznie oddaje ὑπέρ z dopełniaczem, obejmując sens modlitwy w czyjejś intencji lub dla czyjegoś dobra.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: tych, którzy was prześladują
  rationale: Konstrukcja względna zachowuje czasownikowy i potencjalnie trwający charakter imiesłowu czasu teraźniejszego, a zarazem brzmi naturalnie po polsku.
theological_decisions:
- issue: Zakres nakazu wobec nieprzyjaciół
  choice: Oba nakazy oddano bezpośrednio, bez objaśniającego rozszerzania ich treści.
  alternative: Doprecyzować miłość jako życzliwe działanie albo modlitwę jako prośbę o błogosławieństwo, nawrócenie czy przebaczenie.
  rationale: Tekst nakazuje miłować nieprzyjaciół i modlić się za prześladowców, lecz w tym wersecie nie określa pełnego zakresu praktycznych konsekwencji ani treści modlitwy. Przekład zachowuje tę otwartość i napięcie etyczne.
translation_notes:
  register: Nowoczesny standardowy język polski o godnym, lekko uroczystym rejestrze. „Miłujcie” zachowuje biblijną podniosłość, pozostając powszechnie zrozumiałe. Nie dodano przypisu, ponieważ polskie „módlcie się za” naturalnie obejmuje sens „w intencji / dla dobra” i nie wymaga wariantu dla zachowania znaczenia.
