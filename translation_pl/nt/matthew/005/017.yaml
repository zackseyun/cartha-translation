source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: pl
  text: Nie myślcie, że przyszedłem[a] znieść Prawo albo Proroków; nie przyszedłem znieść, lecz je wypełnić[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „przybyłem” — w obu wystąpieniach.'
    reason: lexical_alternative
  - marker: b
    text: „Wypełnić” można też rozumieć jako „doprowadzić do pełni” lub „ukazać w całej pełni”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Nie sądźcie
  rationale: Konstrukcja z μή i aorystem trybu łączącego wyraża zakaz. „Nie sądźcie” jest naturalne, bezpośrednie i zachowuje sens wezwania, by nie przyjmować błędnego założenia.
- source_word: ἦλθον
  choice: przyszedłem
  rationale: Aoryst oddano naturalnym polskim czasem przeszłym. „Przyszedłem” dobrze wyraża przybycie Jezusa w określonym celu i zachowuje paralelizm obu zdań.
- source_word: καταλῦσαι
  choice: znieść
  rationale: W odniesieniu do Prawa i Proroków czasownik oznacza unieważnienie lub usunięcie ich obowiązywania, nie fizyczne zniszczenie. „Znieść” zwięźle oddaje ten sens.
- source_word: τὸν νόμον
  choice: Prawo
  rationale: W połączeniu z „Prorokami” chodzi o rozpoznawalną część Pism Izraela, dlatego zastosowano wielką literę.
- source_word: τοὺς προφήτας
  choice: Proroków
  rationale: Wyrażenie ma najpewniej sens kanoniczny i odnosi się do prorockiej części Pism, a nie jedynie do poszczególnych proroków; wielka litera sygnalizuje to odniesienie.
- source_word: ἀλλὰ πληρῶσαι
  choice: lecz je wypełnić
  rationale: „Wypełnić” zachowuje szeroki, teologicznie doniosły zakres πληρόω. Zaimek „je”, domyślny w grece, dodano dla naturalności i jasności polskiego zdania; odnosi się do Prawa i Proroków.
theological_decisions:
- issue: Znaczenie relacji Jezusa do „Prawa lub Proroków” wyrażonej przez πληρῶσαι
  choice: wypełnić
  alternative: doprowadzić do pełni; urzeczywistnić w całej pełni; dopełnić
  rationale: „Wypełnić” nie zawęża wypowiedzi do jednego ujęcia doktrynalnego. Pozwala zachować możliwe sensy realizacji zapowiedzi, ukazania pełnego znaczenia oraz doprowadzenia do zamierzonej pełni.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano tradycyjne, powszechnie zrozumiałe określenie „Prawo i Prorocy”, a zarazem greckie „lub” w tekście tego wersetu. Składnia pozostaje zwięzła i retorycznie równoległa.
