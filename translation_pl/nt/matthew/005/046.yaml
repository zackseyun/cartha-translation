source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: pl
  text: Bo jeśli kochacie tych, którzy was kochają, jaką macie nagrodę?[a] Czyż nawet poborcy podatków nie robią tego samego?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „jaką macie zapłatę?”. Greckie słowo może oznaczać „zapłatę” albo „nagrodę”; tutaj odnosi się do odpłaty w kontekście nauczania Jezusa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Bo jeśli
  rationale: „Bo” zachowuje związek uzasadniający z poprzednią wypowiedzią, a „jeśli” oddaje warunek w naturalnej polszczyźnie.
- source_word: ἀγαπήσητε ... τοὺς ἀγαπῶντας ὑμᾶς
  choice: kochacie tych, którzy was kochają
  rationale: Czas teraźniejszy naturalnie oddaje warunek ogólny, a powtórzenie czasownika zachowuje celową więź leksykalną greckiego tekstu.
- source_word: τίνα μισθὸν ἔχετε
  choice: jaką macie nagrodę
  rationale: μισθός może oznaczać zapłatę lub nagrodę; w kontekście nauczania etycznego „nagroda” brzmi naturalnie i nie przesądza mechanicznej koncepcji zasługi.
- source_word: οὐχὶ καὶ
  choice: Czyż nawet ... nie
  rationale: Konstrukcja oddaje pytanie retoryczne oczekujące odpowiedzi twierdzącej oraz emfatyczną funkcję καί.
- source_word: οἱ τελῶναι
  choice: poborcy podatków
  rationale: Określenie jasno nazywa osoby pobierające podatki i opłaty, zachowując historyczny sens bez zbędnej techniczności.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: czynią tego samego
  rationale: Dostojne, lecz nadal zrozumiałe sformułowanie odpowiada dosłownemu „robią to samo” i dobrze pasuje do rejestru wypowiedzi Jezusa.
theological_decisions:
- issue: Znaczenie μισθός w nauczaniu etycznym Jezusa
  choice: nagroda
  alternative: zapłata
  rationale: „Nagroda” zachowuje ideę odpłaty w kontekście Kazania na Górze, nie narzucając przy tym określonej doktryny zasługi; alternatywa została zachowana w przypisie.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. „Kochacie” jest bardziej naturalne w dzisiejszym języku niż „miłujecie”, natomiast „czynią” podtrzymuje podniosłość bez utraty zrozumiałości.
