  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: pl
  text: Gdy zobaczył tłumy, wszedł na górę. Kiedy usiadł[a], podeszli do niego jego uczniowie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Gdy już usiadł” albo „Po tym, jak usiadł”. W tekście greckim występuje konstrukcja genitivus absolutus, która określa okoliczność czasową, lecz nie precyzuje jej tak ściśle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Gdy zobaczył
  rationale: Aorystyczny imiesłów pełni funkcję okolicznikową. Polski odpowiednik zdaniowy brzmi naturalnie i oddaje relację czasową bez przesadnego usztywniania kolejności wydarzeń.
- source_word: δὲ
  choice: —
  rationale: Łagodny łącznik narracyjny; w naturalnej polszczyźnie nie wymaga osobnego odpowiednika.
- source_word: τοὺς ὄχλους
  choice: tłumy
  rationale: Liczba mnoga rzeczownika ὄχλος została zachowana; „tłumy” to współczesny i naturalny odpowiednik.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: wszedł na górę
  rationale: Konstrukcja oznacza ruch ku górze, na wzniesienie. „Wszedł na górę” jest naturalne po polsku i zachowuje określoność wyrażenia.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Kiedy usiadł
  rationale: Grecki genetivus absolutus określa okoliczność czasową. „Kiedy usiadł” zachowuje szerszą relację czasową, nie narzucając ściśle znaczenia „potem”.
- source_word: προσῆλθαν αὐτῷ
  choice: podeszli do niego
  rationale: Czasownik προσέρχομαι oznacza przyjście lub zbliżenie się do kogoś; „podeszli do niego” jest precyzyjne i naturalne w tej scenie.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: jego uczniowie
  rationale: „Uczniowie” to utrwalony, trafny odpowiednik μαθηταί, obejmujący relację ucznia do nauczyciela.
theological_decisions:
- issue: Określoność wyrażenia τὸ ὄρος
  choice: na górę
  alternative: na pewną górę / na zbocze
  rationale: Rodzajnik określony przemawia za formą „górę”, lecz tekst nie identyfikuje jej nazwą ani nie wymaga zamiany na bardziej interpretacyjne „zbocze”.
- issue: Relacja czasowa konstrukcji καθίσαντος αὐτοῦ
  choice: Kiedy usiadł
  alternative: Gdy już usiadł / Po tym, jak usiadł
  rationale: Przekład zachowuje czasową okoliczność genetivus absolutus bez dopowiadania ścisłego następstwa ani ceremonialnego znaczenia siedzącej postawy nauczyciela.
translation_notes:
  register: Współczesna, dignifikowana polszczyzna narracyjna. Krótkie zdania zapewniają czytelność, a utrwalone terminy „góra” i „uczniowie” zachowują biblijny rejestr bez archaizacji.
