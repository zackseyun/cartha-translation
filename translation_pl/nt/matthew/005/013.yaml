id: MAT.5.13
reference: Matthew 5:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: pl
  text: Wy jesteście solą ziemi. Lecz jeśli sól straci smak[a], czym zostanie posolona? Nie nadaje się już do niczego poza tym, że zostanie wyrzucona na zewnątrz i podeptana przez ludzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie także: „stanie się głupia”; w odniesieniu do soli czasownik oznacza utratę smaku lub słoności.'
    reason: Gra znaczeń greckiego czasownika μωρανθῇ jest niewidoczna w naturalnym przekładzie głównym.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Wy
  rationale: Jawny zaimek ma w grece wartość emfatyczną; polskie „Wy” zachowuje ten nacisk naturalnie i zwięźle.
- source_word: τὸ ἅλας τῆς γῆς
  choice: solą ziemi
  rationale: γῆ może oznaczać ziemię, ląd lub grunt; w tej szerokiej metaforze najbardziej naturalne jest „ziemia”.
- source_word: μωρανθῇ
  choice: straci smak
  rationale: Czasownik jest spokrewniony z określeniem „głupi”, lecz w odniesieniu do soli oznacza utratę smaku lub słoności. Wyrażenie „straci smak” jest jasne i zachowuje obraz.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: czym zostanie posolona?
  rationale: Oddaje przyszłą stronę bierną oraz pytanie o środek, za pomocą którego sól miałaby odzyskać słoność, bez wyjaśniania paradoksu.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Nie nadaje się już do niczego
  rationale: W tym kontekście ἰσχύω wyraża praktyczną przydatność lub skuteczność; polski zwrot jest naturalnym odpowiednikiem.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: chyba tylko do wyrzucenia na zewnątrz
  rationale: „Chyba tylko” naturalnie oddaje konstrukcję wyjątku, a „na zewnątrz” zachowuje przestrzenny sens ἔξω.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: podeptania przez ludzi
  rationale: καταπατεῖσθαι oznacza deptanie lub tratowanie; ἄνθρωποι odnosi się tu ogólnie do ludzi, co polski rzeczownik oddaje bez zawężenia do mężczyzn.
theological_decisions:
- issue: Zakres wyrażenia ὑπὸ τῶν ἀνθρώπων
  choice: przez ludzi
  alternative: przez człowieka / przez mężczyzn
  rationale: Greckie ἄνθρωποι ma tutaj ogólny sens ludzki, a nie odniesienie wyłącznie do osób płci męskiej. „Przez ludzi” zachowuje ten zakres bez narzucania dodatkowej interpretacji.
- issue: Paradoks ponownego posolenia soli
  choice: czym zostanie posolona?
  alternative: jak odzyska słoność?
  rationale: Dosłowniejsza forma zachowuje niezwykłe pytanie i jego napięcie obrazowe, zamiast objaśniać je w tekście głównym.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano emfatyczne „Wy”, zwięzłość sentencji oraz celowo paradoksalne pytanie o ponowne posolenie soli.
