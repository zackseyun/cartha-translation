  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: pl
  text: Daj temu, kto cię prosi, i nie odwracaj się[a] od tego, kto chce od ciebie pożyczyć.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie odmawiaj temu, kto chce od ciebie pożyczyć”.'
    reason: Alternatywne, bardziej idiomatyczne oddanie ἀποστραφῇς, które wyraża praktyczny sens zwrotu, lecz nie zachowuje dosłownego obrazu odwrócenia się.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: temu, kto cię prosi
  rationale: Rodzajnik z imiesłowem pełni funkcję rzeczownikową i wskazuje ogólnie na osobę proszącą. To sformułowanie jest naturalne we współczesnej polszczyźnie i zachowuje osobowy, ogólny charakter wypowiedzi.
- source_word: δός
  choice: Daj
  rationale: Aorystyczny tryb rozkazujący od δίδωμι wyraża bezpośrednie polecenie. Proste „Daj” nie osłabia ani nie rozszerza jego siły.
- source_word: θέλοντα
  choice: tego, kto chce
  rationale: Imiesłów z rodzajnikiem jest użyty rzeczownikowo. „Kto chce” naturalnie oddaje θέλω bez dodawania oceny motywów tej osoby.
- source_word: ἀπὸ σοῦ
  choice: od ciebie
  rationale: Wyrażenie przyimkowe wskazuje źródło, czyli osobę, od której ktoś zamierza pożyczyć.
- source_word: δανίσασθαι
  choice: pożyczyć
  rationale: Bezokolicznik w stronie medialnej oznacza tutaj pożyczenie czegoś od kogoś. Nie dodano „pieniędzy”, ponieważ przedmiot pożyczki nie został w grece określony.
- source_word: μὴ ἀποστραφῇς
  choice: nie odwracaj się
  rationale: Zakaz zachowuje obraz zawarty w ἀποστρέφω, a zarazem brzmi naturalnie po polsku. Możliwy sens pragmatyczny „nie odmawiaj” podano w przypisie.
theological_decisions:
- issue: Zakres i siła etycznego nakazu Jezusa
  choice: Bezpośrednie nakazy zachowano bez łagodzenia i bez ograniczania kręgu proszących.
  alternative: Dodać niewyrażone w tekście zastrzeżenia dotyczące godnych lub uzasadnionych próśb.
  rationale: Grecki tekst formułuje ogólne, stanowcze polecenia. Przekład nie powinien dopisywać kwalifikacji, których w tym wersecie nie ma.
- issue: Obrazowe czy pragmatyczne oddanie ἀποστραφῇς
  choice: nie odwracaj się
  alternative: nie odmawiaj
  rationale: Wybrana forma zachowuje metaforyczny obraz i nie rozstrzyga ponad tekst, czy chodzi wyłącznie o odmowę udzielenia pożyczki. Alternatywę objaśniającą sens podano w przypisie.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano równoległą budowę dwóch nakazów oraz ogólny charakter określeń osób. Nie doprecyzowano przedmiotu pożyczki.
