lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Zachowuje prosty spójnik łączący zdanie z poprzednim kontekstem bez dodawania mocniejszego odcienia czasowego.
- source_word: ἀνοίξας
  choice: otworzywszy
  rationale: Imiesłów uprzedni wiernie oddaje aorystyczny imiesłów i zachowuje uroczysty zwrot źródłowy, a zarazem jest poprawny i zrozumiały po polsku.
- source_word: τὸ στόμα αὐτοῦ
  choice: usta
  rationale: Polszczyzna naturalnie używa w tym zwrocie słowa „usta” bez zaimka dzierżawczego, ponieważ podmiot czynności jest jednoznaczny.
- source_word: ἐδίδασκεν
  choice: nauczał
  rationale: Czasownik niedokonany oddaje trwający, niedokonany charakter greckiego imperfectum bez zawężania go do znaczenia „zaczął nauczać”.
- source_word: αὐτοὺς
  choice: ich
  rationale: Zachowuje zaimek tekstu greckiego i nie rozstrzyga w samym wersecie, czy chodzi wyłącznie o uczniów, czy o szersze grono.
- source_word: λέγων
  choice: mówiąc
  rationale: Imiesłów wprowadza treść nauczania i formalnie odpowiada greckiemu imiesłowowi czasu teraźniejszego.
