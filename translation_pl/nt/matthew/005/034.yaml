  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: pl
  text: 'Ja zaś mówię wam: nie przysięgajcie w ogóle — ani na niebo, ponieważ jest tronem Boga;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ja zaś mówię wam
  rationale: Zachowuje emfatyczne ἐγώ oraz kontrast δέ, a zarazem brzmi naturalnie i dostojnie po polsku.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Wcale nie przysięgajcie
  rationale: Bezokolicznik aorystu po μή ma tu wartość zakazu; ὅλως oddano jako „wcale”, bez zawężania zakresu wypowiedzi.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ani na niebo
  rationale: W kontekście przysięgania polskie „przysięgać na” naturalnie oddaje instrumentalne użycie ἐν.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: ponieważ jest tronem Boga
  rationale: ὅτι zachowano przyczynowo jako „ponieważ”, zgodnie z bezpośrednią argumentacją zdania.
theological_decisions:
- issue: Zakres zakazu przysięgania
  choice: „Wcale nie przysięgajcie”
  alternative: „Nie składajcie żadnych przysiąg”
  rationale: Wybrana forma możliwie bezpośrednio zachowuje szerokie brzmienie μὴ ὀμόσαι ὅλως, nie dopowiadając wyjątków ani zastosowań doktrynalnych.
- issue: Relacja nieba do Boga
  choice: „jest tronem Boga”
  alternative: „jest Bożym tronem”
  rationale: Forma z dopełniaczem blisko odtwarza τοῦ θεοῦ i zachowuje obraz oraz tok argumentacji tekstu.
translation_notes:
  register: Współczesny, standardowy polski o godnym, bezpośrednim brzmieniu. Zastosowano liczbę mnogą zgodną z ὑμῖν i polską formę zakazu skierowanego do słuchaczy.
