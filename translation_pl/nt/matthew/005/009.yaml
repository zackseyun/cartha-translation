  text: Błogosławieni, którzy wprowadzają pokój, bo to oni zostaną nazwani synami Boga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dziećmi Boga”. Grecki tekst mówi dosłownie „synowie Boga”, używając męskiej liczby mnogiej, która może obejmować zarówno mężczyzn, jak i kobiety.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Błogosławieni
  rationale: Utrwalone i godne brzmienie błogosławieństw; wyraża przychylność Boga i godny pozazdroszczenia stan, a nie jedynie subiektywne poczucie szczęścia.
- source_word: εἰρηνοποιοί
  choice: którzy wprowadzają pokój
  rationale: Naturalne we współczesnej polszczyźnie określenie ludzi aktywnie doprowadzających do pokoju; zachowuje sprawczy sens greckiego rzeczownika złożonego.
- source_word: ὅτι
  choice: bo
  rationale: Jasno i naturalnie wprowadza podstawę wypowiedzianego błogosławieństwa.
- source_word: αὐτοὶ
  choice: to oni
  rationale: Konstrukcja podkreślająca oddaje emfatyczny zaimek grecki, pozostając naturalna po polsku.
- source_word: υἱοὶ θεοῦ
  choice: synami Boga
  rationale: Zachowuje męską liczbę mnogą i synowską terminologię tekstu źródłowego, nie wykluczając jej reprezentatywnego, obejmującego kobiety sensu, objaśnionego w przypisie.
- source_word: κληθήσονται
  choice: zostaną nazwani
  rationale: Bezpośrednio oddaje przyszłą stronę bierną czasownika καλέω bez zawężania znaczenia do samego społecznego uznania.
theological_decisions:
- issue: Rodzajowo określony język synostwa w wyrażeniu υἱοὶ θεοῦ
  choice: synami Boga
  alternative: dziećmi Boga
  rationale: Tekst główny zachowuje dosłowne, męskie określenie synowskie oraz jego możliwe skojarzenia ze statusem i dziedziczeniem. Przypis wyjaśnia, że w tym użyciu ma ono sens reprezentatywny i obejmuje również kobiety.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano tradycyjne „Błogosławieni”, natomiast użyto naturalnych konstrukcji „wprowadzają pokój” i „bo to oni”. Gramatyczny nacisk αὐτοί oddano przez „to oni”.
