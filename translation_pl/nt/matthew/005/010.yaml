  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: pl
  text: Szczęśliwi ci, którzy doznali prześladowań z powodu sprawiedliwości[a], bo do nich należy królestwo niebios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „z powodu prawości” albo „z powodu sprawiedliwego postępowania”. Greckie słowo może obejmować osobistą prawość, życie zgodne z wolą Boga oraz sprawiedliwość.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Szczęśliwi
  rationale: Naturalny i utrwalony w polskich przekładach sposób wprowadzenia błogosławieństw; wyraża obiektywnie pomyślny stan ogłoszony przez Jezusa, nie tylko chwilowe odczucie.
- source_word: οἱ δεδιωγμένοι
  choice: ci, którzy są prześladowani
  rationale: Rodzajnik z imiesłowem biernym pełni funkcję rzeczownikową. Polski czas teraźniejszy strony biernej naturalnie oddaje ludzi pozostających w stanie prześladowania, wynikającym z doznanych działań.
- source_word: ἕνεκεν
  choice: z powodu
  rationale: Jasno i współcześnie wyraża przyczynę prześladowania.
- source_word: δικαιοσύνης
  choice: sprawiedliwości
  rationale: 'Polskie „sprawiedliwość” zachowuje szeroki zakres pojęcia: prawe postępowanie, zgodność z wolą Boga oraz wymiar sprawiedliwości; przypis sygnalizuje tę wieloznaczność.'
- source_word: ὅτι
  choice: bo
  rationale: Naturalnie wprowadza uzasadnienie błogosławieństwa i odpowiada wyjaśniającej funkcji greckiego spójnika.
- source_word: αὐτῶν ἐστιν
  choice: do nich należy
  rationale: Idiomaticzna polska konstrukcja oddająca sens posiadania lub przynależności bez rozstrzygania natury udziału w królestwie.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: królestwo niebios
  rationale: Oddaje charakterystyczne dla Mateusza wyrażenie oraz zachowuje liczbę mnogą οὐρανῶν w naturalnej, podniosłej polszczyźnie.
theological_decisions:
- issue: Zakres znaczeniowy δικαιοσύνη
  choice: sprawiedliwość
  alternative: prawość; sprawiedliwe postępowanie
  rationale: „Sprawiedliwość” jest najbliższym polskim odpowiednikiem i nie ogranicza tekstu wyłącznie do moralności osobistej ani wyłącznie do sprawiedliwości społecznej. Możliwe odcienie znaczeniowe zachowano w przypisie.
- issue: Czasowy aspekt οἱ δεδιωγμένοι
  choice: są prześladowani
  alternative: zostali prześladowani
  rationale: Grecki perfect wskazuje na doznane prześladowanie i trwający jego skutek. Naturalna polska forma „są prześladowani” uwydatnia aktualny stan, nie wykluczając wcześniejszych aktów prześladowania.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano rytm błogosławieństwa oraz Mateuszowe „królestwo niebios”; uniknięto zarówno nadmiernej archaizacji, jak i potoczności.
