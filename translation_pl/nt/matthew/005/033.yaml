  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: pl
  text: 'Dalej słyszeliście, że powiedziano przodkom: „Nie będziesz fałszywie przysięgał[a], lecz dotrzymasz swoich przysiąg złożonych Panu[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie złamiesz przysięgi”; czasownik może oznaczać fałszywe przysięganie albo niedotrzymanie przysięgi.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „PANA”, zgodnie z imieniem Boga przymierza obecnym w tle starotestamentowym.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Ponadto
  rationale: Wprowadza kolejny przykład w następującej po sobie serii. „Ponadto” naturalnie oddaje tok wypowiedzi, bez sugerowania dosłownego powtórzenia tej samej treści.
- source_word: ἠκούσατε
  choice: słyszeliście
  rationale: Polski czas przeszły naturalnie oddaje aoryst w tej formule i zachowuje bezpośredni zwrot do słuchaczy.
- source_word: ἐρρέθη
  choice: powiedziano
  rationale: Forma bezosobowa zachowuje sens greckiej strony biernej i nie dopowiada, kto był mówiącym.
- source_word: τοῖς ἀρχαίοις
  choice: ludziom dawnych czasów
  rationale: Wyrażenie odnosi się do wcześniejszych pokoleń, a nie po prostu do osób w podeszłym wieku; wybrana forma jest jasna we współczesnej polszczyźnie.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Nie będziesz fałszywie przysięgał
  rationale: Oddaje podstawowy sens składania fałszywej przysięgi, a przypis zachowuje możliwy sens złamania przysięgi.
- source_word: ἀποδώσεις
  choice: dotrzymasz
  rationale: W połączeniu z przysięgami czasownik oznacza wykonanie przyjętego pod przysięgą zobowiązania. „Dotrzymasz” brzmi naturalnie i jasno.
- source_word: τῷ κυρίῳ
  choice: wobec Pana
  rationale: Celownik wskazuje, wobec kogo zobowiązanie ma zostać spełnione. „Pan” wiernie oddaje greckie κύριος, a wielka litera wskazuje na Boga.
- source_word: τοὺς ὅρκους σου
  choice: swoich przysiąg
  rationale: „Przysięgi” jest bezpośrednim i współczesnym odpowiednikiem ὅρκους; zaimek zwrotny naturalnie odnosi je do podmiotu zdania.
theological_decisions:
- issue: Oddanie κύριος w aluzji do Pism Izraela
  choice: Pana
  alternative: PANA
  rationale: Tekst grecki ma κυρίῳ, dlatego tekst główny zachowuje zwykły odpowiednik „Pan”. Ponieważ tłem są starotestamentowe nakazy, przypis sygnalizuje możliwość zapisu odpowiadającego imieniu przymierza.
- issue: Zakres znaczeniowy ἐπιορκέω
  choice: fałszywie przysięgać
  alternative: złamać przysięgę
  rationale: Czasownik może dotyczyć zarówno fałszywego przysięgania, jak i niedotrzymania przysięgi. Tekst główny zachowuje pierwszy sens, a przypis drugi, bez zawężania wypowiedzi do technicznego pojęcia krzywoprzysięstwa sądowego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia pozostaje bliska greckiemu tokowi zdania, lecz idiomatyczne „dotrzymasz swoich przysiąg wobec Pana” unika nienaturalnego kalkowania czasownika ἀποδίδωμι. Cudzysłów polski i zapis „Pan” odpowiadają standardowej polskiej praktyce wydawniczej.
