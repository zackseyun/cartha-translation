revisions:
- from: Bądź przychylny swojemu oskarżycielowi i nie zwlekaj[a], dopóki jesteś z nim w drodze, aby oskarżyciel nie wydał cię sędziemu, sędzia urzędnikowi sądowemu i aby nie wtrącono cię do więzienia.
  to: Szybko okaż przychylność swemu przeciwnikowi w sporze, dopóki jesteś z nim w drodze, żeby twój przeciwnik nie wydał cię sędziemu, a sędzia urzędnikowi sądowemu, i żeby nie wtrącono cię do więzienia.
  rationale: Korekta zachowuje obraz wspólnej drogi, prawną sekwencję przeciwnik–sędzia–urzędnik–więzienie oraz mocny sens βληθήσῃ. Główny tekst pozostawia na pierwszym planie leksykalny sens przychylności (εὐνοέω), natomiast przypis podaje idiomatyczne odczytanie jako szybkiego porozumienia. Nie zawęża ἀντίδικος do oskarżyciela w postępowaniu karnym.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Wymaga korekty. „Oskarżyciel” nie jest najlepszym odpowiednikiem ἀντίδικος: termin oznacza stronę przeciwną w sporze prawnym, niekoniecznie oskarżyciela w sensie karnym. Ponadto „i nie zwlekaj” oddaje pilność ταχύ, ale rozdziela ją od czynności „bycia przychylnym” i czyni z niej osobny nakaz. „Szybko okaż przychylność” zachowuje zarówno sens εὐνοέω, jak i przysłówek ταχύ, bez przesądzania, że chodzi wyłącznie o zawarcie ugody.'
  naturalness: Proponowane brzmienie jest współczesne i zrozumiałe. „Przeciwnik w sporze” jasno sygnalizuje kontekst prawny, nie używając zbyt technicznego ani zbyt wąskiego określenia. Powtórzenie „żeby” w końcowym ostrzeżeniu jest naturalne i przejrzyście oddaje kolejność przekazania.
  terminology: „Sędzia”, „urzędnik sądowy” i „wtrącić do więzienia” są trafne. Zastąpienie „oskarżyciela” przez „przeciwnika w sporze” lepiej odpowiada ἀντίδικος oraz nie zawęża sytuacji do konkretnego modelu postępowania karnego.
  issues:
  - severity: medium
    issue: „Oskarżyciel” zbyt wąsko oddaje ἀντίδικος.
    rationale: Grecki termin oznacza przeciwnika/adwersarza w kontekście prawnym i nie wymaga, by był to formalny oskarżyciel. Polski „oskarżyciel” może niepotrzebnie sugerować sprawę karną i rolę oskarżyciela publicznego.
  - severity: low
    issue: „i nie zwlekaj” luźno przyłącza ταχύ do pierwszego nakazu.
    rationale: ταχύ bezpośrednio określa wezwanie z ἴσθι εὐνοῶν. Ujęcie „Szybko okaż przychylność” bardziej bezpośrednio zachowuje związek pilności z przychylnym nastawieniem.
  revised_text: Szybko okaż przychylność swemu przeciwnikowi w sporze, dopóki jesteś z nim w drodze, żeby twój przeciwnik nie wydał cię sędziemu, a sędzia urzędnikowi sądowemu, i żeby nie wtrącono cię do więzienia.
  revised_footnotes:
  - marker: a
    text: 'W tym kontekście prawnym można też: „Szybko dojdź do porozumienia ze swoim przeciwnikiem w sporze”.'
    reason: lexical_alternative
