id: MAT.5.25
reference: Matthew 5:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: pl
  text: Szybko okaż przychylność swemu przeciwnikowi w sporze, dopóki jesteś z nim w drodze, żeby twój przeciwnik nie wydał cię sędziemu, a sędzia urzędnikowi sądowemu, i żeby nie wtrącono cię do więzienia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Bądź przychylny ... i nie zwlekaj
  rationale: Zachowuje podstawowy sens εὐνοέω, czyli przychylne nastawienie, a zarazem oddaje pilność wyrażoną przez ταχύ w naturalnej współczesnej polszczyźnie. Konstrukcja z imiesłowem ma charakter ciągły, czego nie należy zawężać wyłącznie do formalnego zawarcia ugody.
- source_word: τῷ ἀντιδίκῳ σου / ὁ ἀντίδικος
  choice: swojemu oskarżycielowi / oskarżyciel
  rationale: Kontekst sędziego, urzędnika i więzienia nadaje terminowi wyraźny sens prawny. „Oskarżyciel” jest zrozumiały dla współczesnego czytelnika i trafniej komunikuje ten kontekst niż ogólne „przeciwnik”.
- source_word: ταχὺ
  choice: nie zwlekaj
  rationale: Naturalnie wyraża nakaz szybkiego działania i jego pilność, bez niezręcznego połączenia przysłówka „szybko” z opisem trwałego nastawienia.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: dopóki jesteś z nim w drodze
  rationale: Zachowuje konkretny obraz wspólnej drogi i nie dopowiada wprost, że chodzi o drogę do sądu, choć wskazuje na to kontekst.
- source_word: μήποτέ
  choice: aby ... nie
  rationale: W naturalnej polszczyźnie oddaje ostrzegawczy sens greckiego spójnika bez nadmiernie podniosłego lub archaicznego brzmienia.
- source_word: παραδῷ
  choice: wydał cię
  rationale: „Wydać kogoś” dobrze oddaje przekazanie osoby pod władzę organu sądowego.
- source_word: κριτῇ / κριτὴς
  choice: sędziemu / sędzia
  rationale: Standardowy i jednoznaczny odpowiednik w kontekście prawnym.
- source_word: ὑπηρέτῃ
  choice: urzędnikowi sądowemu
  rationale: Oddaje podległego funkcjonariusza wykonującego decyzję sędziego, nie narzucając kulturowo węższej funkcji woźnego lub komornika.
- source_word: εἰς φυλακὴν βληθήσῃ
  choice: nie wtrącono cię do więzienia
  rationale: „Wtrącić do więzienia” zachowuje mocny, przymusowy charakter biernej formy czasownika βάλλω, a zarazem brzmi naturalnie i godnie.
theological_decisions:
- issue: Czy początkowy nakaz oddać jako wezwanie do ugody prawnej, czy jako przychylne nastawienie wobec oskarżyciela
  choice: 'W tekście głównym zachować sens przychylnego nastawienia: „Bądź przychylny ... i nie zwlekaj”.'
  alternative: „Szybko dojdź do porozumienia ze swoim oskarżycielem” albo „Szybko pogódź się ze swoim oskarżycielem”.
  rationale: Kontekst prawny dopuszcza sens praktycznego porozumienia, lecz εὐνοέω bezpośrednio opisuje przychylne nastawienie. Tekst główny zachowuje tę otwartość, a przypis podaje idiomatyczne odczytanie prawne.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano obraz drogi oraz sądową sekwencję przekazania oskarżonego. Szyk końcowej części ogranicza powtórzenia, nie zaciera jednak kolejnych etapów ostrzeżenia.
