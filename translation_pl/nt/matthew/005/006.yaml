  naturalness: Brzmienie jest naturalne dla współczesnej polszczyzny biblijnej. „Błogosławieni” i „łakną” zachowują godny, rozpoznawalny rejestr, a zarazem są zrozumiałe. Konstrukcja jest zwięzła i rytmiczna.
