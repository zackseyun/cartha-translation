id: MAT.5.6
reference: Matthew 5:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: pl
  text: Błogosławieni, którzy łakną i pragną sprawiedliwości[a], bo to oni zostaną nasyceni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może oznaczać sprawiedliwość, prawość albo to, co słuszne przed Bogiem.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Błogosławieni
  rationale: Tradycyjne i nadal zrozumiałe określenie w błogosławieństwach; zachowuje uroczysty, religijny i deklaratywny sens lepiej niż psychologizujące „szczęśliwi”.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: którzy łakną i pragną
  rationale: Imiesłowy czasu teraźniejszego wyrażają trwałe, intensywne dążenie. „Łakną i pragną” naturalnie zachowuje obraz głodu i pragnienia.
- source_word: τὴν δικαιοσύνην
  choice: sprawiedliwości
  rationale: Polskie „sprawiedliwość” może obejmować zarówno prawość, jak i sprawiedliwość w relacjach; nie rozstrzyga nadmiernie szerokiego zakresu greckiego terminu.
- source_word: ὅτι
  choice: bo
  rationale: Zwięźle i naturalnie wprowadza uzasadnienie ogłoszonego błogosławieństwa.
- source_word: αὐτοὶ
  choice: to oni
  rationale: Konstrukcja „to oni” oddaje nacisk emfatycznego zaimka greckiego bez nadmiernej ciężkości stylistycznej.
- source_word: χορτασθήσονται
  choice: zostaną nasyceni
  rationale: Przyszła strona bierna zostaje zachowana, a „nasyceni” podtrzymuje metaforę głodu i pragnienia oraz może sugerować działanie Boga bez dopowiadania go w tekście.
theological_decisions:
- issue: Zakres znaczeniowy δικαιοσύνη
  choice: sprawiedliwość
  alternative: prawość; to, co słuszne przed Bogiem
  rationale: Grecki rzeczownik może odnosić się do osobistej prawości, sprawiedliwości społecznej lub stanu zgodnego z wolą Boga. Polskie „sprawiedliwość” najlepiej zachowuje tę wieloznaczność, a przypis ją objaśnia.
- issue: Niewyrażony sprawca nasycenia
  choice: zostaną nasyceni
  alternative: Bóg ich nasyci
  rationale: Strona bierna w grece nie nazywa sprawcy. Zachowanie jej w przekładzie pozwala odczytać wypowiedź jako tzw. stronę bierną wskazującą na działanie Boga, ale nie dodaje imienia Boga wbrew formie tekstu.
translation_notes:
  register: Współczesny, godny rejestr biblijny. „Łakną” jest lekko podniosłe, ale powszechnie zrozumiałe i dobrze współgra z formułą błogosławieństwa. Zdanie zachowuje paralelizm oraz metaforę głodu, pragnienia i nasycenia.
