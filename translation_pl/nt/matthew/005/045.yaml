source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: pl
  text: abyście stali się synami waszego Ojca, który jest w niebie[a], bo sprawia, że jego słońce wschodzi nad złymi i dobrymi i zsyła deszcz na sprawiedliwych i niesprawiedliwych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w niebiosach”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: abyście
  rationale: Naturalnie wprowadza w języku polskim zamierzony skutek lub cel, zachowując celowy charakter zdania.
- source_word: γένησθε
  choice: stali się
  rationale: Zachowuje dynamiczne znaczenie aorystu trybu łączącego od γίνομαι, zamiast spłaszczać je do statycznego „byli”.
- source_word: υἱοὶ
  choice: synami
  rationale: Grecki rzeczownik wyraźnie oznacza „synów”; zachowanie tego słowa oddaje synowską metaforykę źródła, obejmującą w kontekście ogół uczniów.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: waszego Ojca
  rationale: Bezpośrednio oddaje konstrukcję dopełniaczową i zachowuje osobowe, relacyjne określenie Boga.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: który jest w niebie
  rationale: Naturalny polski odpowiednik Mateuszowego wyrażenia; grecka liczba mnoga οὐρανοῖς nie wymaga w tym zwrocie polskiej liczby mnogiej.
- source_word: ὅτι
  choice: On bowiem
  rationale: „Bowiem” jasno wprowadza uzasadnienie poprzedniej wypowiedzi, a zaimek „On” zapewnia naturalne przejście i jednoznacznie zachowuje Boże sprawstwo.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: jego słońce
  rationale: Zachowuje wyraźny w grece zaimek dzierżawczy, podkreślający Bożą własność i opatrzność.
- source_word: ἀνατέλλει
  choice: sprawia, że ... wschodzi
  rationale: Konstrukcja przyczynowa naturalnie oddaje tutaj przechodnie użycie czasownika ze „słońcem” jako dopełnieniem oraz zachowuje Boże sprawstwo.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: nad złymi i dobrymi
  rationale: Przymiotniki użyte rzeczownikowo zostają oddane zwięźle i symetrycznie; przy słońcu polskie „nad” brzmi naturalniej niż „na”.
- source_word: βρέχει
  choice: zsyła deszcz
  rationale: Naturalnie wyraża w polszczyźnie czynność Boga, zachowując sens greckiego czasownika i Boże sprawstwo.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: na sprawiedliwych i niesprawiedliwych
  rationale: Zachowuje utrwaloną biblijną parę moralnych przeciwieństw oraz rzeczownikowe użycie greckich przymiotników.
theological_decisions:
- issue: Rodzajowo określony język synostwa
  choice: synami waszego Ojca
  alternative: dziećmi waszego Ojca
  rationale: Źródło ma υἱοί, nie τέκνα. „Synami” zachowuje metaforykę synostwa, choć w kontekście wypowiedź odnosi się reprezentatywnie do wszystkich uczniów.
- issue: Znaczenie γένησθε w odniesieniu do synostwa Bożego
  choice: abyście stali się
  alternative: abyście byli / abyście okazali się
  rationale: Przekład zachowuje dynamiczną siłę greckiego czasownika, nie rozstrzygając ponad tekst, czy chodzi o uzyskanie statusu, ujawnienie tożsamości czy upodobnienie charakteru przez naśladowanie Ojca.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Zachowano paralelizm „złymi i dobrymi” oraz „sprawiedliwymi i niesprawiedliwymi”, a także wyraźne Boże sprawstwo. Marker przypisu [a] znajduje się bezpośrednio po wyrażeniu, którego dotyczy.
