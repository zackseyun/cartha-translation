  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: pl
  text: 'Zaprawdę bowiem mówię wam: dopóki nie przeminą niebo i ziemia, z Prawa w żadnym razie nie przeminie ani jedna jota[a] ani jedna kreska[b] — aż wszystko się stanie[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jota to nazwa litery iota; w tym obrazie oznacza nawet najmniejszą literę.
    reason: lexical_alternative
  - marker: b
    text: To znaczy drobny znak pisarski lub element odróżniający jedną literę od drugiej.
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „aż wszystko się wypełni” albo „aż wszystko się dokona”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: zaprawdę
  rationale: Wprowadza uroczyste, autorytatywne zapewnienie Jezusa. „Zaprawdę” zachowuje rozpoznawalny biblijny ton, a zarazem przekazuje funkcję semickiego zapożyczenia.
- source_word: γὰρ
  choice: bowiem
  rationale: Zachowuje objaśniające powiązanie tego zdania z poprzednią wypowiedzią.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośrednio oddaje greckie sformułowanie i jego autorytatywny ton.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: dopóki nie przeminą niebo i ziemia
  rationale: Naturalna polska konstrukcja czasowa zachowująca przyszłe odniesienie oraz kosmiczny zakres wypowiedzi.
- source_word: ἰῶτα ἓν
  choice: ani jedna jota
  rationale: „Jota” zachowuje nazwę najmniejszej litery alfabetu greckiego i jest zrozumiała po polsku także jako określenie najmniejszego elementu.
- source_word: μία κεραία
  choice: ani jedna kreska
  rationale: „Kreska” naturalnie oznacza drobny znak pisarski lub element odróżniający litery, bez użycia archaicznego słownictwa.
- source_word: οὐ μὴ παρέλθῃ
  choice: z pewnością nie przeminie
  rationale: Wyrażenie oddaje emfatyczne greckie przeczenie οὐ μή w naturalnej, uroczystej polszczyźnie.
- source_word: ἀπὸ τοῦ νόμου
  choice: z Prawa
  rationale: W kontekście Mt 5,17–19 chodzi o objawione Prawo znane z Pisma. Wielka litera sygnalizuje to kontekstowe znaczenie, nie rozstrzygając, czy zakres obejmuje wyłącznie Torę, czy szerzej Pismo.
- source_word: ἕως ἂν πάντα γένηται
  choice: aż wszystko się stanie
  rationale: Szerokie znaczeniowo sformułowanie zachowuje możliwość rozumienia γένηται zarówno jako wydarzenia się, jak i urzeczywistnienia tego, co zamierzone.
theological_decisions:
- issue: Zakres znaczeniowy νόμος
  choice: Prawo jako objawione Prawo znane z Pisma
  alternative: ściśle Pięcioksiąg albo, przez rozszerzenie, całe Pismo
  rationale: Najbliższy kontekst mówi o „Prawie i Prorokach”. Przekład zachowuje samo określenie „Prawo” i nie dopowiada jego dokładnego zakresu.
- issue: Znaczenie πάντα γένηται
  choice: aż wszystko się stanie
  alternative: aż wszystko się wypełni / dokona
  rationale: Greckie γίνομαι może wskazywać na zaistnienie, wydarzenie się lub dojście do skutku. Główny tekst pozostawia tę teologiczną relację otwartą, a przypis podaje możliwe ujęcie rezultatywne.
translation_notes:
  register: Współczesna, godna polszczyzna z umiarkowanie podniosłym „zaprawdę”. Szyk zdania zachowuje emfatyczne wyliczenie najmniejszych elementów pisma, a pauza przed końcową klauzulą pomaga czytelnie rozróżnić dwa zdania czasowe.
