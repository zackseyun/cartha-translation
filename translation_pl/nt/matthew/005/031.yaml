base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: pl
  text: 'Powiedziano też: „Kto rozwodzi się[a] ze swoją żoną, niech da jej dokument rozwodowy”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „oddala” lub „odsyła”. W tym prawnomałżeńskim kontekście czasownik odnosi się do rozwodu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: Powiedziano
  rationale: Bezosobowa forma naturalnie oddaje grecki aoryst strony biernej w formule wprowadzającej przytoczenie.
- source_word: δέ
  choice: też
  rationale: W tym miejscu δέ sygnalizuje przejście do kolejnego przykładu. Polskie „też” zachowuje ciąg wywodu bez narzucania silniejszego przeciwstawienia, które ujawni się w następnym wersecie.
- source_word: Ὃς ἂν
  choice: Kto
  rationale: Konstrukcja względna z ἄν wyraża ogólny, nieokreślony warunek; zwięzłe polskie „kto” jest naturalnym odpowiednikiem.
- source_word: ἀπολύσῃ
  choice: oddala
  rationale: Czasownik oznacza dosłownie odesłanie lub oddalenie, a w tym kontekście prawnomałżeńskim odnosi się do rozwodu. W tekście głównym zachowano obrazowy termin źródłowy, a sens prawny objaśnia przypis.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: swoją żonę
  rationale: γυνή w kontekście rozwiązania małżeństwa znaczy „żona”; polski zaimek zwrotny „swoją” naturalnie odnosi posiadanie do podmiotu zdania.
- source_word: δότω
  choice: niech da
  rationale: Forma ta wiernie i naturalnie oddaje grecki imperatyw trzeciej osoby.
- source_word: αὐτῇ
  choice: jej
  rationale: Polski celownik „jej” bezpośrednio oddaje grecki celownik zaimka.
- source_word: ἀποστάσιον
  choice: dokument rozwodowy
  rationale: Rzeczownik oznacza pisemny dokument potwierdzający rozwód; współczesne sformułowanie zachowuje jego prawny i dokumentarny charakter.
theological_decisions:
- issue: Stosunek słów Jezusa do mojżeszowego przepisu rozwodowego
  choice: Oddać wypowiedź jako przytoczenie formuły prawnej, bez sugerowania w tym wersecie aprobaty lub dezaprobaty.
  alternative: Przełożyć ją interpretacyjnie jako nakaz popierający procedurę rozwodową albo jedynie jako opis rozpowszechnionego nauczania.
  rationale: Werset wprowadza tradycyjną formułę, do której Jezus odnosi się w wersecie następnym. Przekład nie powinien zawczasu rozstrzygać szerszej kwestii etycznej.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano zwięzłą formę cytowanego przepisu oraz prawniczy charakter końcowego rzeczownika; przypis wyjaśnia relację między dosłownym „oddala” a kontekstowym sensem „rozwodzi się”.
