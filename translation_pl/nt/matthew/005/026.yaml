  source_fidelity: Przekład wiernie oddaje formułę zapewnienia, emfatyczne οὐ μή, ruch „stamtąd”, warunek zakończony pełną zapłatą oraz konkretną nazwę monety. Nie rozstrzyga też metafory w kategoriach doktrynalnych.
  naturalness: Zdanie jest zasadniczo naturalne i ma odpowiedni, godny rejestr. Korekty wymagają interpunkcja po „Zaprawdę” oraz konstrukcja „oddać ostatniego kwadransa”, która przy tym czasowniku brzmi niestandardowo. „Zapłacić ostatniego kwadransa” jest idiomatyczne i zachowuje sens uregulowania należności.
  terminology: „Kwadrans” jest właściwym polskim odpowiednikiem łac. quadrans / gr. κοδράντης; przypis trafnie objaśnia realium. „Zaprawdę” jest tradycyjnie podniosłe, lecz nadal zrozumiałe w przekładzie biblijnym.
