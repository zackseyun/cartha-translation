  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: pl
  text: 'Zaprawdę, mówię ci: na pewno nie wyjdziesz stamtąd, dopóki nie zapłacisz ostatniego kwadransa[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwadrans był drobną monetą rzymską.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: W formule ἀμὴν λέγω σοι słowo to wprowadza uroczyste, stanowcze zapewnienie. „Zaprawdę” zachowuje tę funkcję i podniosły ton, pozostając zrozumiałe we współczesnej polszczyźnie.
- source_word: λέγω σοι
  choice: mówię ci
  rationale: Naturalnie i bezpośrednio oddaje formułę osobistego zwrotu oraz jej autorytatywny charakter.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: na pewno nie wyjdziesz
  rationale: Połączenie οὐ μή z aorystem trybu łączącego wyraża bardzo mocne zaprzeczenie. „Na pewno nie” przekazuje tę stanowczość bez archaicznej składni.
- source_word: ἐκεῖθεν
  choice: stamtąd
  rationale: Zwięźle i idiomatycznie oznacza ruch z owego miejsca; w kontekście zachowuje obraz opuszczenia miejsca uwięzienia.
- source_word: ἕως ἂν ἀποδῷς
  choice: dopóki nie oddasz
  rationale: Konstrukcja wyznacza przyszłą granicę trwania opisanego stanu, a aoryst wskazuje na dokonanie zapłaty. „Oddać” naturalnie odnosi się do uregulowania należności.
- source_word: τὸν ἔσχατον
  choice: ostatniego
  rationale: Wskazuje na pełną zapłatę aż do najmniejszej końcowej części należności, bez dodawania niewyrażonego wprost wzmocnienia.
- source_word: κοδράντην
  choice: kwadransa
  rationale: Zachowano nazwę konkretnej drobnej monety rzymskiej zamiast zastępować ją polską monetą o innej wartości. Przypis wyjaśnia realium historyczne.
theological_decisions:
- issue: Czy wypowiedź należy przełożyć tak, by rozstrzygała, że chodzi o sąd ostateczny, oczyszczenie po śmierci albo wyłącznie o ziemskie uwięzienie za dług
  choice: Zachowano konkretny obraz niemożności wyjścia przed całkowitym uregulowaniem należności, bez wskazania jednej interpretacji doktrynalnej.
  alternative: Można interpretacyjnie uściślić obraz jako metaforę sądu Bożego, wezwanie do pojednania z konsekwencjami eschatologicznymi albo naukę o pośmiertnym oczyszczeniu.
  rationale: Grecki tekst nie nazywa wprost żadnej z tych doktryn. Przekład powinien zachować napięcie między bezpośrednim obrazem prawnym a możliwym szerszym znaczeniem w kontekście.
translation_notes:
  register: Współczesny, zrozumiały język o godnym tonie. Tradycyjne „Zaprawdę” zachowuje uroczystość formuły Jezusa; „na pewno nie wyjdziesz” naturalnie oddaje bardzo mocne greckie zaprzeczenie. Nazwę monety pozostawiono w formie historycznej i objaśniono w przypisie.
