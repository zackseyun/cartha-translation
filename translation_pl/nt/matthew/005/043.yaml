  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: pl
  text: 'Słyszeliście, że powiedziano[a]: „Będziesz miłował swego bliźniego, a swego wroga będziesz nienawidził”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pierwszy człon nawiązuje do Księgi Kapłańskiej 19,18. Drugi — „a swego wroga będziesz nienawidził” — nie jest bezpośrednim cytatem ze Starego Testamentu, lecz odzwierciedla przyjęte nauczanie, które Jezus koryguje.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Słyszeliście
  rationale: Aoryst w utrwalonej formule wprowadzającej odwołuje się do wcześniej usłyszanego i przyjętego nauczania; polski czas przeszły brzmi naturalnie i nie dodaje aspektu nieobecnego w grece.
- source_word: ἐρρέθη
  choice: powiedziano
  rationale: Bezosobowa forma dobrze oddaje grecki passivum bez wskazywania, kto wypowiedział przytoczone nauczanie.
- source_word: Ἀγαπήσεις
  choice: Będziesz miłował
  rationale: Futurum pełni funkcję nakazu i nawiązuje do brzmienia Kpł 19,18; forma ta zachowuje uroczysty, przykazaniowy charakter wypowiedzi.
- source_word: τὸν πλησίον σου
  choice: swego bliźniego
  rationale: „Bliźni” jest precyzyjnym i utrwalonym polskim odpowiednikiem πλησίον w kontekście etycznym oraz w aluzji do Kpł 19,18.
- source_word: μισήσεις
  choice: będziesz nienawidził
  rationale: Powtórzenie formy przyszłej zachowuje równoległość obu członów greckiego powiedzenia i jego nakazowy charakter.
- source_word: τὸν ἐχθρόν σου
  choice: swego wroga
  rationale: „Wróg” jest naturalnym, bezpośrednim odpowiednikiem ἐχθρός i wyraźnie kontrastuje z „bliźnim”.
theological_decisions:
- issue: Status słów „a swego wroga będziesz nienawidził”
  choice: Oddano je jako część jednego przytoczonego nauczania, lecz przypisem zaznaczono, że nie są bezpośrednim cytatem ze Starego Testamentu.
  alternative: Przedstawić całe powiedzenie jako jednolity cytat biblijny albo już w tekście głównym nazwać drugi człon późniejszą interpretacją.
  rationale: Greka ujmuje oba człony jako jedno powiedzenie wprowadzone słowami „że powiedziano”. Przekład zachowuje tę konstrukcję i napięcie, nie utożsamiając zarazem drugiego członu z nakazem Pisma.
translation_notes:
  register: Współczesny, godny rejestr biblijny. „Miłował” zachowuje tradycyjny ton przykazania, pozostając zrozumiałe; szyk z powtórzonym „swego” oraz pełną formą „będziesz nienawidził” odtwarza równoległość greckiego zdania.
