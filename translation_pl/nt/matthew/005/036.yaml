id: MAT.5.36
reference: Matthew 5:36
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: pl
  text: Nie przysięgaj też na swoją głowę, bo nie możesz uczynić ani jednego włosa białym lub czarnym.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: też nie
  rationale: Kontynuuje skoordynowany ciąg wcześniejszych zakazów; w polszczyźnie naturalnie oddaje to konstrukcja „nie… też”.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: na swoją głowę
  rationale: W połączeniu z ὀμόσῃς wyraża to, na co ktoś przysięga; „przysięgać na swoją głowę” jest naturalnym polskim odpowiednikiem.
- source_word: ὀμόσῃς
  choice: przysięgaj
  rationale: Aoryst trybu łączącego po μήτε ma tutaj moc zakazu; polski tryb rozkazujący przeczący oddaje ją bez sztucznej formalności.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza uzasadnienie zakazu; „bo” jest jasne, współczesne i zachowuje związek przyczynowy.
- source_word: οὐ δύνασαι
  choice: nie możesz
  rationale: Zwięźle i bezpośrednio oddaje brak zdolności lub władzy wyrażony przez δύνασαι.
- source_word: μίαν τρίχα
  choice: ani jednego włosa
  rationale: W kontekście przeczenia konstrukcja „ani jednego” naturalnie podkreśla nawet najmniejszy zakres ludzkiej niemocy.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: białym lub czarnym
  rationale: Zachowuje podstawowe określenia barw oraz wyraźny kontrast greckiego tekstu.
- source_word: ποιῆσαι
  choice: uczynić
  rationale: 'Oddaje znaczenie sprawcze ποιέω: spowodować, aby włos stał się biały albo czarny; forma jest zwięzła i godna.'
theological_decisions:
- issue: Zakres zakazu składania przysiąg
  choice: Oddać bezpośredni zakaz przysięgania na własną głowę, bez rozszerzania go na doktrynalne twierdzenie o wszystkich przysięgach.
  alternative: Rozumieć ten werset jako zakaz wszelkich przysiąg albo wyłącznie manipulacyjnych formuł przysięgi.
  rationale: Sam werset mówi konkretnie o przysięganiu na własną głowę i uzasadnia zakaz ograniczeniem ludzkiej władzy. Przekład zachowuje tę treść i nie rozstrzyga szerszego sporu teologicznego.
translation_notes:
  register: Współczesna, naturalna i godna polszczyzna. Zachowano bezpośrednią formę zakazu oraz kontrast „biały lub czarny”. Nie dodano przypisu, ponieważ angielski przypis zawiera alternatywę leksykalną niezwiązaną z markerem umieszczonym po słowie „head”, a polski tekst jasno oddaje oba elementy bez potrzeby objaśnienia.
