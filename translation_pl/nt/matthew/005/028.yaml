  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: pl
  text: Ja zaś mówię wam, że każdy, kto patrzy na kobietę[b] po to, by jej pożądać[a], już dopuścił się z nią cudzołóstwa w swoim sercu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „aby jej pragnąć”. Konstrukcja grecka wskazuje na cel lub zamiar patrzenia.'
    reason: lexical_alternative
  - marker: b
    text: Greckie γυνή może, zależnie od kontekstu, oznaczać „kobietę” albo „żonę”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ja zaś mówię wam
  rationale: „Zaś” oddaje kontrast wprowadzony przez δέ, a wyrażone „Ja” zachowuje nacisk obecny w ἐγώ. Całość brzmi naturalnie i dostojnie po polsku.
- source_word: πᾶς ὁ βλέπων
  choice: każdy, kto patrzy
  rationale: Oddaje ogólny i powszechny zakres konstrukcji bez niepotrzebnego zawężania jej do rzeczownika rodzaju męskiego.
- source_word: γυναῖκα
  choice: na kobietę
  rationale: γυνή może znaczyć „kobieta” albo „żona”. W tym ogólnym sformułowaniu tekst grecki nie określa wprost stanu cywilnego, dlatego w tekście głównym zachowano szersze znaczenie.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: po to, by jej pożądać
  rationale: πρός z bezokolicznikiem rodzajnikowym wskazuje na cel lub zamiar patrzenia. „Po to, by” jasno zachowuje tę celowość, a „pożądać” w tym kontekście naturalnie wyraża niewłaściwe pragnienie seksualne.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: już dopuścił się z nią cudzołóstwa
  rationale: „Już” odpowiada ἤδη, natomiast idiomatyczne polskie wyrażenie „dopuścić się cudzołóstwa z kimś” trafnie oddaje czasownik μοιχεύω z dopełnieniem αὐτήν.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: w swoim sercu
  rationale: Zachowuje biblijny obraz serca jako wnętrza człowieka, obejmującego myśli, wolę i pragnienia. Zaimek zwrotny jest w tym polskim zdaniu naturalniejszy niż „w jego sercu”.
theological_decisions:
- issue: Czy γυνή oddać jako „kobieta”, czy „żona”
  choice: kobieta
  alternative: żona
  rationale: Greka nie określa tu jednoznacznie stanu cywilnego. „Kobieta” zachowuje zakres źródłowego wyrazu i nie rozstrzyga ponad tekst, choć wzmianka o cudzołóstwie nadaje wypowiedzi wyraźny kontekst etyczny.
- issue: Czy ἐπιθυμέω oddać ogólniej jako „pragnąć”, czy mocniej jako „pożądać”
  choice: pożądać
  alternative: pragnąć jej
  rationale: Czasownik ma szerszy zakres znaczeniowy, lecz w bezpośrednim kontekście cudzołóstwa chodzi o niewłaściwe pragnienie seksualne. Polskie „pożądać” naturalnie przekazuje ten sens bez dodawania doktrynalnej interpretacji.
- issue: Czy πρὸς τὸ ἐπιθυμῆσαι opisuje cel patrzenia, czy jedynie jego skutek
  choice: 'celowe patrzenie: „po to, by jej pożądać”'
  alternative: patrzenie, którego skutkiem jest pożądanie
  rationale: Konstrukcja πρὸς τό z bezokolicznikiem standardowo wyraża ukierunkowanie lub cel. Przekład zachowuje więc element zamiaru i nie przedstawia każdego mimowolnego zauważenia kobiety jako cudzołóstwa w sercu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym rejestrze. Szyk jest naturalny, a zarazem zachowuje emfatyczne „Ja” i kontrast „zaś”. Wyrażenie „po to, by” celowo uwidacznia intencjonalny charakter patrzenia.
