  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: pl
  text: A jeśli pozdrawiacie tylko swoich braci[a], cóż wyjątkowego czynicie?[b] Czyż nawet nie-Żydzi[c] nie czynią tak samo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „braci i siostry”; grecki wyraz oznacza dosłownie „braci”, lecz tutaj może szerzej odnosić się do członków własnej rodziny lub wspólnoty.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „cóż więcej czynicie?”'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „poganie” albo „ludzie z innych narodów”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: pozdrawiacie
  rationale: Czasownik oznacza zwracanie się do kogoś z pozdrowieniem; „pozdrawiacie” naturalnie oddaje tę czynność bez rozszerzania jej na gościnne przyjęcie.
- source_word: ἀδελφοὺς
  choice: braci
  rationale: Zachowano gramatycznie męską liczbę mnogą greckiego rzeczownika. Przypis wskazuje, że w tym kontekście określenie może szerzej obejmować członków własnej wspólnoty, w tym kobiety.
- source_word: μόνον
  choice: tylko
  rationale: Słowo ogranicza krąg pozdrawianych osób i ma w polszczyźnie jasny, idiomatyczny odpowiednik.
- source_word: τί περισσὸν ποιεῖτε
  choice: cóż wyjątkowego czynicie?
  rationale: περισσόν wskazuje na coś wykraczającego poza zwykłą miarę. „Wyjątkowego” zachowuje retoryczną siłę pytania, a „czynicie” odpowiada podniosłemu, lecz zrozumiałemu rejestrowi.
- source_word: ἐθνικοὶ
  choice: poganie
  rationale: W tym żydowskim kontekście termin oznacza ludzi spoza Izraela i wspólnoty przymierza. Tradycyjne polskie „poganie” brzmi naturalnie w tym zdaniu, natomiast przypis zachowuje bardziej etniczne odczytanie „nie-Żydzi”.
- source_word: τὸ αὐτό
  choice: tego samego
  rationale: To naturalny polski odpowiednik wyrażenia „to samo” po czasowniku „czynić”.
theological_decisions:
- issue: Zakres znaczeniowy ἀδελφοὺς w nauczaniu etycznym
  choice: „braci” w tekście głównym
  alternative: „braci i siostry” albo „członków własnej wspólnoty”
  rationale: Tekst główny zachowuje męską formę grecką, nie rozstrzygając jednak, że chodzi wyłącznie o mężczyzn lub krewnych. Szerszy sens społeczny został zachowany w przypisie.
- issue: Znaczenie ἐθνικοὶ
  choice: „poganie”
  alternative: „nie-Żydzi” albo „ludzie z innych narodów”
  rationale: „Poganie” jest utrwalonym i naturalnym polskim określeniem ludzi spoza ludu Izraela, ale może brzmieć bardziej religijnie niż grecki termin; dlatego bardziej etniczne odpowiedniki podano w przypisie.
translation_notes:
  register: Współczesna, zrozumiała polszczyzna o godnym, lekko podniosłym rejestrze. Paralelna budowa dwóch pytań zachowuje retoryczną siłę wypowiedzi, a przypisy pozostawiają otwarte istotne zakresy znaczeniowe.
