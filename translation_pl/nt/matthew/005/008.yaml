review_pass:
  verdict: revise
  source_fidelity: Greckie „οἱ καθαροὶ τῇ καρδίᾳ” oznacza osoby czyste w odniesieniu do serca, tj. wewnętrznego człowieka. „Którzy mają czyste serce” zasadniczo oddaje sens, lecz „o czystym sercu” jest bliższe konstrukcji źródłowej i bardziej zwięzłe. W formule makaryzmu „Błogosławieni” lepiej niż „Szczęśliwi” zachowuje ustalony, podniosły sens μακάριοι jako stanu godnego uznania i Bożej przychylności, bez redukcji do odczucia szczęścia. Przyszłe „zobaczą Boga” wiernie oddaje ὄψονται, a jawne „oni” stosownie zachowuje emfatyczne αὐτοί.
  naturalness: „Błogosławieni są ci o czystym sercu” jest naturalne we współczesnej, godnej polszczyźnie biblijnej. Jest mniej opisowe niż „którzy mają czyste serce”, ale nie archaiczne. Spójnik „bo” jest współczesny i dobrze funkcjonuje w sentencji; nie osłabia relacji wyrażonej przez ὅτι.
  terminology: „Błogosławieni” jest w polszczyźnie najbardziej rozpoznawalnym i semantycznie bezpiecznym odpowiednikiem μακάριοι w Błogosławieństwach. „Czyste serce” zachowuje metaforykę tekstu bez zawężania jej do emocji, rytuału lub konkretnej szkoły interpretacyjnej. „Zobaczą Boga” pozostaje dosłowne i nie rozstrzyga charakteru tego oglądania.
