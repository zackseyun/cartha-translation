- from: Szczęśliwi, którzy mają czyste serce,[a] ponieważ oni zobaczą Boga.[b]
  to: Błogosławieni są ci o czystym sercu,[a] bo oni zobaczą Boga.[b]
  rationale: Zmieniono „Szczęśliwi” na „Błogosławieni”, aby oddać utrwalony sens i rejestr μακάριοι w Błogosławieństwach. Konstrukcję dotyczącą serca skrócono do naturalnego „ci o czystym sercu”, zachowując jej wewnętrzny, nie tylko emocjonalny zakres. Tekst obietnicy pozostawiono bez interpretacyjnego rozwinięcia; przypisy uporządkowano tak, by sygnalizowały wariant i możliwe odczytania bez ich rozstrzygania.
