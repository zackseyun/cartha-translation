  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: pl
  text: Błogosławieni są ci o czystym sercu,[a] bo oni zobaczą Boga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „czyści w sercu”.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „zobaczą Boga” zachowano dosłownie. Może ono wskazywać na bezpośrednie oglądanie Boga lub na pełnię przyszłego spełnienia tej obietnicy, lecz tekst nie rozstrzyga tego bliżej.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Szczęśliwi
  rationale: W formule błogosławieństw określa ludzi znajdujących się w godnym pragnienia stanie dzięki Bożej przychylności. „Szczęśliwi” jest naturalne we współczesnej polszczyźnie i nie ogranicza sensu do chwilowej emocji w tym uroczystym kontekście.
- source_word: καθαροὶ
  choice: czyste
  rationale: „Czyste” zachowuje podstawowy sens moralnej i wewnętrznej czystości, nie przesądzając o jej dokładnym zakresie.
- source_word: τῇ καρδίᾳ
  choice: mają ... serce
  rationale: Grecki celownik określa sferę, w której dana osoba jest czysta. Polski zwrot „mają czyste serce” oddaje to naturalnie, a „serce” oznacza tu wnętrze człowieka, nie tylko uczucia.
- source_word: ὅτι
  choice: ponieważ
  rationale: Wyraźnie wprowadza podstawę ogłoszonego szczęścia i odpowiada funkcji greckiego spójnika.
- source_word: αὐτοὶ
  choice: oni
  rationale: 'Jawny zaimek zachowuje nacisk greckiego αὐτοί: właśnie ci ludzie otrzymają obietnicę.'
- source_word: τὸν θεὸν
  choice: Boga
  rationale: Naturalny polski biernik bez rodzajnika, którego język polski nie posiada.
- source_word: ὄψονται
  choice: zobaczą
  rationale: Prosty czas przyszły zachowuje bezpośredni charakter obietnicy i nie dopowiada sposobu ani czasu jej spełnienia.
theological_decisions:
- issue: Znaczenie wyrażenia „zobaczą Boga”
  choice: Zachowano dosłowne „zobaczą Boga” bez objaśnienia w tekście głównym.
  alternative: „doświadczą obecności Boga” albo „ujrzą Boga przy ostatecznym spełnieniu”
  rationale: Greckie sformułowanie może obejmować bezpośredni dostęp do Bożej obecności oraz przyszłe, ostateczne spełnienie obietnicy, lecz samo zdanie nie zawęża znaczenia do jednej interpretacji.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Konstrukcja „którzy mają czyste serce” jest bardziej naturalna niż formalne „czyści sercem”, a zarazem wiernie oddaje odniesienie do wewnętrznego człowieka. Zachowano emfatyczne „oni”.
