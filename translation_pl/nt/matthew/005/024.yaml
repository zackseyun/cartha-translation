id: MAT.5.24
reference: Matthew 5:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: pl
  text: Zostaw tam swój dar przed ołtarzem i idź. Najpierw pojednaj się ze swoim bratem[a], a potem przyjdź i złóż swój dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie użyto greckiego rzeczownika rodzaju męskiego w liczbie pojedynczej: „bratem”. W tym kontekście zasada pojednania może odnosić się także szerzej do relacji z innymi osobami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: zostaw tam
  rationale: Imperatyw ἄφες w tym kontekście nakazuje pozostawić dar na miejscu; „tam” zachowuje przestrzenne znaczenie ἐκεῖ.
- source_word: τὸ δῶρόν σου
  choice: swój dar
  rationale: „Dar” zachowuje podstawowe znaczenie δῶρον, a wzmianka o ołtarzu jasno wskazuje, że chodzi o dar ofiarny.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: przed ołtarzem
  rationale: Naturalne i formalnie bliskie oddanie relacji przestrzennej oraz kultowego terminu θυσιαστήριον.
- source_word: ὕπαγε πρῶτον
  choice: idź. Najpierw
  rationale: Zachowuje nakaz ruchu i wyraźne pierwszeństwo pojednania. Podział na zdania brzmi naturalnie po polsku, nie zmieniając kolejności poleceń.
- source_word: διαλλάγηθι
  choice: pojednaj się
  rationale: Naturalny polski odpowiednik nakazu wejścia w stan pojednania; forma zwrotna dobrze oddaje relacyjny charakter czynności bez wskazywania jednostronnej winy.
- source_word: τῷ ἀδελφῷ σου
  choice: ze swoim bratem
  rationale: Polska składnia czasownika „pojednać się” wymaga konstrukcji „z” i narzędnika. „Bratem” zachowuje męską liczbę pojedynczą greckiego ἀδελφός.
- source_word: καὶ τότε ἐλθὼν
  choice: a potem przyjdź
  rationale: Oddaje następstwo czasowe τότε, a imiesłów ἐλθών naturalnie rozwija jako kolejny polski czasownik w trybie rozkazującym.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: złóż swój dar
  rationale: W polszczyźnie „złożyć dar” jest naturalnym kultowym odpowiednikiem πρόσφερε i unika mniej idiomatycznego „ofiaruj swój dar”.
theological_decisions:
- issue: Zakres znaczeniowy ἀδελφός w nauczaniu o pojednaniu
  choice: bratem
  alternative: bratem lub siostrą; bliźnim; współwyznawcą
  rationale: Grecki rzeczownik występuje w rodzaju męskim i liczbie pojedynczej, dlatego tekst główny zachowuje tę formę. Przypis sygnalizuje, że zasada pojednania może mieć szersze zastosowanie, nie wpisując tego rozszerzenia bezpośrednio w przekład.
- issue: Strona i wzajemność διαλλάγηθι
  choice: pojednaj się
  alternative: daj się pojednać; pogódź się
  rationale: Grecka forma jest bierna, lecz polskie „daj się pojednać” sugerowałoby zewnętrznego sprawcę i brzmiałoby nienaturalnie. „Pojednaj się” zachowuje wezwanie do przywrócenia relacji i nie rozstrzyga, która strona ponosi winę.
translation_notes:
  register: Współczesna, godna polszczyzna o prostej składni. „Dar”, „ołtarz” i „złóż” zachowują kultowy kontekst bez archaizacji. Interpunkcja rozdziela kolejne nakazy, uwydatniając pierwszeństwo pojednania.
