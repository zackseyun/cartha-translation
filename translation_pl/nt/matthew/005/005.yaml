  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: pl
  text: Błogosławieni są łagodni[a], bo oni odziedziczą ziemię[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „cisi” lub „pokorni”. Chodzi o pokorną łagodność, nie o słabość.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „kraj”. Sformułowanie prawdopodobnie nawiązuje do Ps 37:11, gdzie obietnicę można rozumieć zarówno w odniesieniu do ziemi przymierza, jak i szerzej.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Szczęśliwi
  rationale: W formule błogosławieństw słowo oznacza pomyślny stan wynikający z Bożej przychylności, nie tylko chwilowe uczucie szczęścia. „Szczęśliwi” jest naturalne we współczesnej polszczyźnie, a kontekst zachowuje głębszy sens.
- source_word: οἱ πραεῖς
  choice: łagodni
  rationale: Przymiotnik użyty rzeczownikowo określa ludzi odznaczających się pokorną łagodnością, a nie słabością czy biernością. „Łagodni” brzmi naturalniej niż archaizujące „cisi” i trafnie oddaje podstawowy sens πραΰς.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza uzasadnienie błogosławieństwa. Zwięzłe „bo” jest naturalne i zachowuje rytm wypowiedzi.
- source_word: αὐτοὶ
  choice: oni
  rationale: 'Wyrażony zaimek ma w grece funkcję emfatyczną. Jawne „oni” zachowuje nacisk: właśnie ci ludzie odziedziczą ziemię.'
- source_word: κληρονομήσουσι
  choice: odziedziczą
  rationale: Bezpośrednio oddaje przyszłą formę κληρονομέω oraz zachowuje język dziedzictwa i obietnicy.
- source_word: τὴν γῆν
  choice: ziemię
  rationale: Polskie „ziemia” może, podobnie jak greckie γῆ, oznaczać zarówno całą ziemię, jak i określoną krainę. Dzięki temu tekst główny naturalnie zachowuje zamierzoną wieloznaczność.
theological_decisions:
- issue: Zakres znaczeniowy τὴν γῆν
  choice: ziemię
  alternative: kraj / tę ziemię
  rationale: Greckie γῆ dopuszcza sens powszechny („ziemia, świat”) oraz sens terytorialny („kraj, ziemia”). Prawdopodobne nawiązanie do Ps 37:11 przywołuje obietnicę ziemi, ale wypowiedź może mieć szerszy zakres. Polskie „ziemię” pozwala zachować to napięcie bez rozstrzygania go w tekście głównym.
translation_notes:
  register: Współczesny, prosty i godny styl. Zachowano zwięzły rytm błogosławieństwa oraz emfatyczne „oni”. „Łagodni” wybrano zamiast tradycyjnego „cisi”, które we współczesnej polszczyźnie może błędnie sugerować małomówność.
