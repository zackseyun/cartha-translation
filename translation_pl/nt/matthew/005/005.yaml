  naturalness: „Błogosławieni są łagodni” jest naturalną, zrozumiałą współczesną polszczyzną w podniosłym, biblijnym rejestrze. Jawne „oni” stosownie oddaje grecki nacisk, bez nienaturalnego przeciążenia zdania.
