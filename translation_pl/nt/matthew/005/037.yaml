  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: pl
  text: 'Niech zaś wasze słowo będzie: „Tak, tak” albo „Nie, nie”. Wszystko, co ponadto, pochodzi od Złego[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „pochodzi ze zła”. Greckie τοῦ πονηροῦ można rozumieć osobowo („Zły”) albo bezosobowo („zło”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: niech … brzmi
  rationale: Tryb rozkazujący trzeciej osoby wyraża wezwanie. W połączeniu ze „słowem” polskie „niech … brzmi” jest naturalniejsze niż dosłowne „niech będzie”, a zachowuje nakazowy charakter wypowiedzi.
- source_word: ὁ λόγος ὑμῶν
  choice: wasze słowo
  rationale: „Słowo” zachowuje zwięzłą, przysłowiową formę greckiego λόγος i odnosi się tutaj do tego, co uczniowie mówią.
- source_word: ναὶ ναί, οὒ οὔ
  choice: '„Tak, tak” albo: „Nie, nie”'
  rationale: Powtórzenie obu partykuł zachowuje nacisk i rytm oryginału; „albo” naturalnie wyraża kontrast między dwiema odpowiedziami.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: Wszystko, co ponadto
  rationale: Przymiotnik περισσόν użyty rzeczownikowo oznacza to, co wykracza poza wskazane proste „tak” lub „nie”. Polski zwrot jest zwięzły i idiomatyczny.
- source_word: ἐκ
  choice: pochodzi od
  rationale: Przyimek wskazuje źródło lub pochodzenie; czasownik „pochodzi” uzupełnia w polszczyźnie sens domyślny w greckim zdaniu nominalnym.
- source_word: τοῦ πονηροῦ
  choice: od Złego
  rationale: Forma z rodzajnikiem może oznaczać osobowo „Złego” albo bezosobowo „zło”. Kontekst użycia ὁ πονηρός u Mateusza przemawia za odczytaniem osobowym, przy zachowaniu drugiej możliwości w przypisie.
theological_decisions:
- issue: Czy τοῦ πονηροῦ oznacza bezosobowo „zło”, czy osobowo „Złego”
  choice: Złego
  alternative: zła
  rationale: Konstrukcja grecka pozostaje gramatycznie niejednoznaczna, lecz Mateusz często używa ὁ πονηρός osobowo. Tekst główny oddaje prawdopodobny sens osobowy, a przypis zachowuje autentyczną alternatywę.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano zwięzłość, paralelizm oraz podwojenie „tak” i „nie”; niejednoznaczność końcowego wyrażenia udokumentowano w przypisie.
