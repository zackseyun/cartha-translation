  source_fidelity: Korekta jest potrzebna, ponieważ greckie δέ ma tu funkcję łączno-kontrastową („zaś”, „a”), nie wnioskową. „Więc” wprowadza nieobecną w oryginale relację konsekwencji. „Niech ... będzie” bliżej oddaje ἔστω niż „niech ... brzmi”. Końcowe „od Złego” trafnie oddaje prawdopodobne osobowe rozumienie τοῦ πονηροῦ, a przypis zachowuje rzeczywistą niejednoznaczność.
  naturalness: Zmienione brzmienie pozostaje współczesne, zwięzłe i godne. Dwukropek oraz powtórzenia „Tak, tak” i „Nie, nie” są w polszczyźnie naturalne i zachowują paralelizm wypowiedzi.
  terminology: „Zły” pisany wielką literą konsekwentnie sygnalizuje osobowe odczytanie, bez narzucania go przypisowi. „Zło” jako wariant bezosobowy jest właściwie przedstawione w nocie.
