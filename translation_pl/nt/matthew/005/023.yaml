  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: pl
  text: Jeśli więc składasz swój dar na ołtarzu i tam przypomnisz sobie, że twój brat[a] ma coś przeciwko tobie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „twój brat lub siostra”. Grecki tekst mówi dosłownie „brat”; w tym kontekście męska forma liczby pojedynczej może mieć znaczenie reprezentatywne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Jeśli więc
  rationale: „Jeśli” zachowuje warunkowy charakter zdania, a „więc” wskazuje na wniosek wynikający z poprzedniej nauki.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: składasz swój dar
  rationale: W kontekście ołtarza czasownik oznacza przedstawianie lub składanie daru. „Składasz” brzmi naturalnie w polskim języku religijnym, a „dar” wiernie oddaje szerokie znaczenie δῶρον.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: na ołtarzu
  rationale: Polskie wyrażenie „składać dar na ołtarzu” naturalnie oddaje czynność przedstawienia daru na ołtarzu, bez archaizowania.
- source_word: κἀκεῖ μνησθῇς
  choice: i tam przypomnisz sobie
  rationale: „Tam” zachowuje nacisk przestrzenny, a „przypomnisz sobie” naturalnie oddaje μνησθῇς bez rozstrzygania, co wywołało wspomnienie.
- source_word: ὁ ἀδελφός σου
  choice: twój brat
  rationale: Zachowano męski rodzaj i liczbę pojedynczą tekstu greckiego. Możliwy reprezentatywny zakres tego określenia zaznaczono w przypisie.
- source_word: ἔχει τι κατὰ σοῦ
  choice: ma coś przeciwko tobie
  rationale: To naturalny polski odpowiednik idiomu, który zachowuje zamierzoną nieokreśloność zaimka τι („coś”).
theological_decisions:
- issue: Zakres znaczeniowy ἀδελφός
  choice: twój brat
  alternative: twój brat lub siostra; współwyznawca
  rationale: Tekst grecki używa rzeczownika rodzaju męskiego w liczbie pojedynczej. Przekład główny zachowuje tę formę, nie zawężając ani nie rozszerzając samodzielnie zastosowania wypowiedzi; możliwy sens reprezentatywny objaśnia przypis.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano składnię zdania warunkowego oraz końcowy przecinek, ponieważ werset prowadzi bezpośrednio do dalszego polecenia w Mt 5,24.
