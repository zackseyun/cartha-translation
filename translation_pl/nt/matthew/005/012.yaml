source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: pl
  text: Radujcie się i weselcie się, bo wielka jest wasza nagroda w niebie[a]. Tak bowiem prześladowali proroków, którzy byli przed wami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w niebiosach”. U Mateusza liczba mnoga często odpowiada polskiemu „w niebie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Radujcie się
  rationale: Tryb rozkazujący czasu teraźniejszego, liczba mnoga. „Radujcie się” naturalnie wyraża wezwanie do czynnej radości i zachowuje podniosły, lecz zrozumiały rejestr.
- source_word: ἀγαλλιᾶσθε
  choice: weselcie się
  rationale: Czasownik oznacza intensywną, żywiołową radość. W zestawieniu „radujcie się i weselcie” wzmacnia pierwsze wezwanie bez uciekania się do mało naturalnego polskiego odpowiednika.
- source_word: μισθὸς
  choice: nagroda
  rationale: W kontekście Bożej odpłaty za znoszone prześladowanie „nagroda” jest bardziej naturalna niż handlowo brzmiąca „zapłata”, nie usuwając idei należnej odpłaty.
- source_word: πολὺς
  choice: wielka
  rationale: Przymiotnik określa rozmiar lub doniosłość nagrody; „wielka nagroda” jest naturalnym polskim połączeniem.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: w niebie
  rationale: Grecka liczba mnoga ma u Mateusza często charakter semityzujący. Polski idiom w tym znaczeniu wymaga zwykle liczby pojedynczej; dosłowną formę odnotowano w przypisie.
- source_word: οὕτως
  choice: tak
  rationale: Przysłówek wskazuje na podobieństwo sposobu prześladowania uczniów i wcześniejszych proroków. Zwięzłe „tak” zachowuje tę relację w naturalnej polszczyźnie.
- source_word: ἐδίωξαν
  choice: prześladowali
  rationale: Kontekst jednoznacznie wskazuje na wrogie działania, nie na neutralne ściganie lub podążanie.
- source_word: προφήτας
  choice: proroków
  rationale: Standardowy polski odpowiednik odnoszący się do proroków poprzedzających uczniów.
- source_word: τοὺς πρὸ ὑμῶν
  choice: którzy byli przed wami
  rationale: Wyrażenie określa proroków jako historycznych poprzedników adresatów i pozostaje bliskie składni greckiej.
theological_decisions:
- issue: Znaczenie wyrażenia „w niebie” / „w niebiosach”
  choice: „w niebie” jako naturalne polskie określenie sfery niebiańskiej, gdzie znajduje się nagroda uczniów
  alternative: „w niebiosach”, jako formalnie bliższe greckiej liczbie mnogiej
  rationale: Wybór ma charakter językowy, a nie doktrynalny. Liczba pojedyncza przekazuje zwykły polski sens, natomiast przypis zachowuje informację o liczbie mnogiej tekstu greckiego.
- issue: Charakter „nagrody”
  choice: Zachowano ogólne pojęcie Bożej odpłaty bez objaśniania jej natury lub podstawy
  alternative: „zapłata”, mocniej sugerująca wynagrodzenie za wykonaną pracę
  rationale: Greckie μισθός może oznaczać zapłatę lub nagrodę. Kontekst uzasadnia „nagrodę”, ale werset sam nie rozwija relacji między nią a łaską lub zasługą, dlatego przekład tego nie rozstrzyga.
translation_notes:
  register: Współczesna, godna polszczyzna o biblijnym rytmie. Paralelne wezwanie „Radujcie się i weselcie” zachowuje retoryczne wzmocnienie oryginału, a szyk „wielka jest wasza nagroda” podkreśla jej wielkość bez brzmienia archaicznego.
