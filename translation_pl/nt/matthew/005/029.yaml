id: MAT.5.29
reference: Matthew 5:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: pl
  text: Jeśli zaś twoje prawe oko doprowadza cię do upadku[a], wyłup je i odrzuć od siebie. Lepiej bowiem dla ciebie, żeby zginął jeden z twoich członków, niż żeby całe twoje ciało zostało wrzucone do Gehenny[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „doprowadza cię do grzechu”.'
    reason: lexical_alternative
  - marker: b
    text: Gehenna to grecka forma nazwy związanej z Doliną Hinnoma; tradycyjnie tłumaczona jako „piekło”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: doprowadza cię do upadku
  rationale: Zachowuje metaforę potknięcia i upadku obecną w greckim czasowniku, a zarazem brzmi naturalnie po polsku. Kontekst wskazuje na grzech, lecz nie należy zawężać obrazu w tekście głównym.
- source_word: ἔξελε
  choice: wyłup
  rationale: Tryb rozkazujący ma tu mocny, naglący charakter. „Wyłup” jest naturalnym polskim określeniem gwałtownego usunięcia oka i zachowuje dosadność obrazu.
- source_word: βάλε ἀπὸ σοῦ
  choice: odrzuć od siebie
  rationale: Oddaje zarówno stanowczy rozkaz βάλε, jak i wyrażoną przez ἀπὸ σοῦ ideę odsunięcia i rozdzielenia.
- source_word: συμφέρει
  choice: lepiej dla ciebie
  rationale: Naturalnie wyraża korzyść lub przewagę i odpowiada porównawczej konstrukcji całego zdania.
- source_word: ἀπόληται
  choice: zginął
  rationale: Zachowuje powagę czasownika ἀπόλλυμι bez doprecyzowywania sposobu utraty członka ciała.
- source_word: μελῶν
  choice: członków
  rationale: „Członek” jest tradycyjnym, lecz nadal zrozumiałym określeniem części ciała i dobrze współgra z przeciwstawieniem całemu ciału; „kończyna” byłaby zbyt wąska w odniesieniu do oka.
- source_word: βληθῇ
  choice: zostało wrzucone
  rationale: Forma bierna zachowuje dosłowną i mocną czynność wyrażoną przez βάλλω.
- source_word: γέενναν
  choice: Gehenny
  rationale: Transliteracja zachowuje odrębny termin geograficzno-teologiczny użyty w tekście greckim, zamiast utożsamiać go bezpośrednio z szerszym polskim terminem „piekło”.
- source_word: ὁ δεξιὸς
  choice: prawe
  rationale: Zachowuje wyraźnie podany w źródle szczegół dotyczący prawego oka.
- source_word: δὲ
  choice: zaś
  rationale: „Zaś” naturalnie sygnalizuje łagodne przeciwstawienie lub dalszy ciąg argumentacji, nie wzmacniając spójnika ponad grecki tekst.
theological_decisions:
- issue: Oddanie terminu γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: Zachowano szczególny termin użyty przez autora oraz jego historyczne skojarzenie z Doliną Hinnoma, bez automatycznego nakładania wszystkich późniejszych konotacji słowa „piekło”. Powszechny odpowiednik podano w przypisie.
- issue: Metaforyczny sens σκανδαλίζω
  choice: doprowadza cię do upadku
  alternative: doprowadza cię do grzechu
  rationale: Tekst główny zachowuje metaforę upadku, podczas gdy przypis objaśnia jej sens w kontekście grzechu. Pozwala to uniknąć przedwczesnego rozstrzygnięcia wieloznaczności.
translation_notes:
  register: Współczesny, godny i bezpośredni język. Zachowano mocną hiperboliczną obrazowość wypowiedzi, nie łagodząc czasownika „wyłup”. Szyk zdania jest naturalny dla polszczyzny, a termin „Gehenna” opatrzono krótkim objaśnieniem.
