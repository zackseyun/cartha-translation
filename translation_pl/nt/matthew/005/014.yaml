  source_fidelity: Pierwsze zdanie wiernie oddaje grecki tekst, włącznie z wyrażonym zaimkiem liczby mnogiej. W drugim zdaniu „Nie może się ukryć miasto” jest zrozumiałe, lecz polska konstrukcja zwrotna może sugerować, że miasto samo się ukrywa. Greckie κρυβῆναι jest bezokolicznikiem strony biernej („zostać/być ukrytym”). Zmiana na „nie może być ukryte” zachowuje tę perspektywę bez wskazywania sprawcy.
  naturalness: „Wy jesteście światłem świata” jest współczesne, godne i naturalne. Szyk „Miasto położone na górze nie może być ukryte” jest płynny i bardziej jednoznaczny niż konstrukcja z „się ukryć”.
  terminology: „Światło świata”, „miasto”, „góra” i „położone” trafnie oraz konsekwentnie oddają kluczowe elementy tekstu. Nie wprowadzają interpretacji doktrynalnej ani niepotrzebnego zawężenia obrazu.
  issues:
