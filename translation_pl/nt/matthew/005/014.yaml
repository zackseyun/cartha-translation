  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: pl
  text: Wy jesteście światłem świata. Miasto położone na górze nie może być ukryte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „miasto leżące na górze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Wy
  rationale: Grecki zaimek drugiej osoby liczby mnogiej jest wyrażony i emfatyczny. Polskie „Wy” zachowuje bezpośredni zwrot i nacisk bez dodawania interpretacyjnego „sami”.
- source_word: τὸ φῶς
  choice: światłem
  rationale: W polskim orzecznik rzeczownikowy po „jesteście” naturalnie przyjmuje narzędnik. Określoność greckiego wyrażenia wynika tu z konstrukcji i kontekstu, mimo braku rodzajnika w języku polskim.
- source_word: τοῦ κόσμου
  choice: świata
  rationale: Dopełniacz „świata” formalnie i naturalnie odpowiada greckiemu dopełniaczowi, zachowując szeroki sens κόσμος bez interpretacyjnego „dla świata”.
- source_word: οὐ δύναται
  choice: Nie może
  rationale: Naturalny polski odpowiednik wyrażający niemożność.
- source_word: πόλις
  choice: miasto
  rationale: „Miasto” jest zwykłym odpowiednikiem πόλις i zachowuje rozpoznawalny obraz przysłowiowy.
- source_word: κρυβῆναι
  choice: się ukryć
  rationale: Polska konstrukcja zwrotna naturalnie oddaje grecki bezokolicznik strony biernej w odniesieniu do miasta, bez sugerowania konkretnego sprawcy ukrycia.
- source_word: ἐπάνω ὄρους
  choice: na górze
  rationale: ὄρος może oznaczać górę lub wzniesienie. „Na górze” pozostaje blisko greckiego obrazu i nie zawęża go do łagodnego wzgórza.
- source_word: κειμένη
  choice: położone
  rationale: Imiesłów oznacza „leżące, usytuowane”. „Położone” jest naturalne przy opisie lokalizacji miasta i nie sugeruje celowego założenia go w tym miejscu.
theological_decisions:
- issue: Metaforyczne utożsamienie uczniów ze światłem
  choice: „Wy jesteście światłem świata” — zachowano bezpośrednią metaforę.
  alternative: „Wy jesteście światłem dla świata”.
  rationale: Grecki dopełniacz τοῦ κόσμου najnaturalniej odpowiada wyrażeniu „światłem świata”. Wariant z „dla” objaśniałby funkcję metafory i osłabiał jej zamierzone napięcie.
- issue: Niemożność ukrycia miasta
  choice: 'Zachowano bezosobowo ujętą niemożność: „Nie może się ukryć”.'
  alternative: „Nie można ukryć miasta”.
  rationale: Alternatywa sugerowałaby zewnętrznego sprawcę, podczas gdy grecki bezokolicznik bierny pozostawia tę kwestię niewskazaną.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano emfatyczne „Wy”, bezpośrednią metaforę oraz obraz miasta usytuowanego na górze; przypis sygnalizuje bardziej dosłowne oddanie imiesłowu κειμένη.
