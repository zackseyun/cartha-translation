  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: pl
  text: 'Słyszeliście, że powiedziano: „Oko za oko i ząb za ząb”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Słyszeliście
  rationale: Aoryst w utrwalonej formule wprowadzającej odnosi się do nauczania, które adresaci już znają; polskie „Słyszeliście” brzmi naturalnie i nie ogranicza wypowiedzi do jednego wydarzenia.
- source_word: ὅτι
  choice: że
  rationale: Wprowadza treść tego, co adresaci usłyszeli.
- source_word: ἐρρέθη
  choice: powiedziano
  rationale: Bezosobowa forma zachowuje sens greckiej strony biernej i naturalny polski szyk formuły cytowania.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Oko za oko
  rationale: Utrwalony polski odpowiednik formuły prawnej; przyimek „za” trafnie oddaje tu wymianę lub odpowiadającą odpłatę wyrażoną przez ἀντί.
- source_word: καὶ
  choice: i
  rationale: Prosty spójnik łączący dwa równoległe człony.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: ząb za ząb
  rationale: Zachowuje równoległość, zwięzłość i rozpoznawalną postać zasady prawnej.
theological_decisions:
- issue: Sposób oddania przytoczonej zasady odpłaty
  choice: Oko za oko i ząb za ząb
  alternative: Oko w zamian za oko i ząb w zamian za ząb
  rationale: Tradycyjna polska formuła wiernie oddaje grecki tekst i pozostawia nierozstrzygniętą kwestię, czy zasada opisuje dosłowną odpłatę, czy ograniczenie jej do proporcjonalnego wymiaru.
translation_notes:
  register: Współczesny, godny i powszechnie zrozumiały rejestr. Zachowano zwięzłą, rytmiczną postać znanej formuły prawnej; przypis nie jest potrzebny, ponieważ polskie „za” bezpośrednio i idiomatycznie oddaje ἀντί.
