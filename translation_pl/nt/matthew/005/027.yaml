  language: pl
  text: 'Słyszeliście, że powiedziano: „Nie będziesz cudzołożył”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Słyszeliście
  rationale: Aoryst w tej formule odwołuje się do tego, co słuchacze usłyszeli i znają z przekazanej tradycji. Polski czas przeszły „słyszeliście” jest naturalny i wiernie zachowuje formę grecką.
- source_word: ὅτι
  choice: że
  rationale: Spójnik wprowadza treść tego, co słuchacze usłyszeli.
- source_word: ἐρρέθη
  choice: powiedziano
  rationale: Bezosobowe „powiedziano” naturalnie oddaje grecki aoryst strony biernej i nie wskazuje wprost mówiącego, podobnie jak tekst źródłowy.
- source_word: Οὐ μοιχεύσεις
  choice: Nie będziesz cudzołożył
  rationale: Forma ta zachowuje przyszły tryb zakazu oraz rozpoznawalny, uroczysty styl przykazania Dekalogu. „Cudzołożyć” jest precyzyjnym i utrwalonym polskim odpowiednikiem μοιχεύω.
theological_decisions:
- issue: Związek z przykazaniem Dekalogu
  choice: Nie będziesz cudzołożył
  alternative: Nie cudzołóż
  rationale: Brzmienie z czasem przyszłym zachowuje formalną postać cytowanego przykazania i jego międzytekstowe odniesienie, bez dodawania interpretacji.
translation_notes:
  register: Współczesny, zrozumiały język polski z zachowaniem godnego i rozpoznawalnego brzmienia cytatu z Dekalogu. Nie dodano przypisu do Ἠκούσατε, ponieważ „Słyszeliście” jest zarazem dosłownym i naturalnym odpowiednikiem polskim.
