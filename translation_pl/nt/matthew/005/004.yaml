id: MAT.5.4
reference: Matthew 5:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: pl
  text: Błogosławieni, którzy się smucą[a], bo oni zostaną pocieszeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „którzy boleją”. Greckie określenie ma szeroki zakres i nie precyzuje przyczyny smutku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Błogosławieni
  rationale: Zachowuje utrwaloną formułę błogosławieństw oraz jej obiektywną, oceniającą wymowę; „szczęśliwi” mogłoby sugerować przede wszystkim subiektywne samopoczucie.
- source_word: οἱ πενθοῦντες
  choice: którzy się smucą
  rationale: Oddaje rzeczownikowo użyty imiesłów w naturalnej polszczyźnie i nie zawęża przyczyny smutku do żałoby po zmarłym, osobistej straty, grzechu ani ucisku.
- source_word: ὅτι
  choice: bo
  rationale: Naturalnie i jasno wprowadza w języku polskim podstawę wypowiedzianego błogosławieństwa.
- source_word: αὐτοὶ
  choice: oni
  rationale: Zachowuje wyrażony w grece zaimek i jego lekkie uwydatnienie, nie wprowadzając silniejszego, kontrastowego „to właśnie oni”.
- source_word: παρακληθήσονται
  choice: zostaną pocieszeni
  rationale: Oddaje przyszły czas i stronę bierną oraz właściwe w tym kontekście znaczenie otrzymania pociechy.
theological_decisions:
- issue: Zakres smutku w błogosławieństwie
  choice: Ogólne „którzy się smucą”, bez wskazywania przyczyny smutku
  alternative: „którzy opłakują swoje grzechy”, „którzy są w żałobie” albo „którzy boleją nad stanem Izraela”
  rationale: Tekst grecki nie określa przedmiotu ani przyczyny smutku. Szerokie sformułowanie zachowuje otwartość wypowiedzi i nie rozstrzyga napięcia teologicznego na rzecz jednej tradycji interpretacyjnej.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano tradycyjne „Błogosławieni”, natomiast użyto naturalnego dziś spójnika „bo”. Konstrukcja pozostaje zwięzła i rytmiczna.
