  verdict: approve
  source_fidelity: Polskie „Błogosławieni, którzy się smucą, bo oni zostaną pocieszeni” wiernie oddaje formułę μακάριοι, rzeczownikowo użyty imiesłów οἱ πενθοῦντες, relację przyczynową ὅτι oraz przyszłą stronę bierną παρακληθήσονται. „Którzy się smucą” pozostaje celowo szerokie i nie określa przedmiotu żalu.
  naturalness: Tekst jest naturalny we współczesnej, godnej polszczyźnie. „Błogosławieni” słusznie zachowuje ustaloną formę gatunkową błogosławieństw, a „bo oni zostaną pocieszeni” jest zwięzłe i idiomatyczne.
  terminology: Kluczowe terminy są właściwie dobrane. „Błogosławieni” nie redukuje μακάριοι do subiektywnego szczęścia, zaś „zostaną pocieszeni” trafnie zachowuje przyszłość i stronę bierną greckiego czasownika. Przypis poprawnie sygnalizuje możliwy wariant leksykalny bez zawężania sensu.
