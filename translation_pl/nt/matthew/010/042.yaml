id: MAT.10.42
reference: Matthew 10:42
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: pl
  text: 'A kto da jednemu z tych małych[b] choćby kubek zimnej wody dlatego, że jest on uczniem[a], zapewniam was: z pewnością nie utraci swojej nagrody.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „w imię ucznia”. Greckie wyrażenie wskazuje, że ten gest zostaje wykonany ze względu na to, że odbiorca jest uczniem.'
    reason: alternative_reading
  - marker: b
    text: „Ci mali” to w tym kontekście prawdopodobnie uczniowie Jezusa uważani za mało znaczących, niekoniecznie wyłącznie dzieci.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: kto
  rationale: Konstrukcja względna z ἄν ma sens nieokreślony i uogólniający; polskie „kto” naturalnie oddaje „ktokolwiek” w takim zdaniu.
- source_word: ποτίσῃ
  choice: poda ... kubek zimnej wody
  rationale: Czasownik znaczy dosłownie „dać pić, napoić”; w tym kontekście idiomatyczne polskie sformułowanie zachowuje konkretny gest ugoszczenia.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: jednemu z tych małych
  rationale: '„Małych” zachowuje otwartość μικρῶν: może wskazywać na ludzi niskiego znaczenia lub słabych pośród uczniów, bez ograniczania frazy wyłącznie do dzieci.'
- source_word: ποτήριον ψυχροῦ
  choice: kubek zimnej wody
  rationale: Dopełniacz ψυχροῦ zakłada rzeczownik „woda”; „kubek zimnej wody” brzmi naturalnie i podkreśla prostotę daru.
- source_word: μόνον
  choice: choćby
  rationale: W tym szyku μόνον uwydatnia minimalny charakter daru; „choćby” przekazuje sens „zaledwie/nawet tylko” bez niezręczności.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: dlatego, że jest on uczniem
  rationale: 'Fraza określa podstawę działania: pomoc zostaje udzielona ze względu na tożsamość odbiorcy jako ucznia. Zaimek „on” zmniejsza ryzyko błędnego odniesienia podmiotu.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: zapewniam was
  rationale: Oddaje uroczystą i autorytatywną funkcję formuły Jezusa naturalną, współczesną polszczyzną.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: z pewnością nie utraci
  rationale: Podwójna konstrukcja przecząca οὐ μή wyraża zdecydowane zapewnienie, które oddaje „z pewnością nie”.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: swojej nagrody
  rationale: W kontekście uczniostwa μισθός oznacza należną nagrodę lub odpłatę; „nagroda” jest zrozumiała i nie narzuca jej dokładnej natury.
theological_decisions:
- issue: Odniesienie wyrażenia „tych małych”
  choice: Pozostawiono szerokie określenie „tych małych”, odnoszące się w kontekście przede wszystkim do uczniów o niskiej pozycji lub niewielkim znaczeniu.
  alternative: Rozumieć wyrażenie wyłącznie jako odnoszące się do dzieci albo tylko do nowych lub słabych wierzących.
  rationale: Najbliższy kontekst mówi o przyjmowaniu uczniów, ale samo określenie nie powinno zostać zawężone ponad to, co wynika z tekstu.
- issue: Znaczenie εἰς ὄνομα μαθητοῦ
  choice: 'Oddano przyczynowo: „dlatego, że jest on uczniem”.'
  alternative: 'Formalnie: „w imię ucznia” lub „ze względu na miano ucznia”.'
  rationale: Grecka fraza wskazuje, że gest wynika z rozpoznania odbiorcy jako ucznia; przekład przyczynowy unika sugerowania formuły rytualnej, której tekst nie wymaga.
- issue: Charakter „nagrody”
  choice: Zachowano ogólne określenie bez wyjaśniania czasu, sposobu ani rodzaju nagrody.
  alternative: Doprecyzować ją jako nagrodę doczesną, eschatologiczną albo zbawienie.
  rationale: Werset stanowczo zapewnia o nagrodzie, lecz sam jej nie definiuje; przekład zachowuje tę otwartość.
translation_notes:
  register: Współczesna, dignifikowana polszczyzna o naturalnym szyku. „Zapewniam was” przekazuje uroczysty charakter formuły ἀμὴν λέγω ὑμῖν bez archaizacji. Markery przypisów umieszczono przy frazach, których dotyczą.
