  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: pl
  text: Gdy zaś was wydadzą, nie martwcie się o to, jak lub co macie mówić. W tej bowiem godzinie zostanie wam dane[a], co macie mówić.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Strona bierna „zostanie wam dane” nie wskazuje tutaj wprost dawcy; następny werset mówi, że przez was będzie przemawiał Duch waszego Ojca.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Gdy zaś
  rationale: ὅταν wskazuje na przyszłą okoliczność, a δέ łagodnie łączy zdanie z poprzednim ostrzeżeniem. „Gdy zaś” jest naturalne i zachowuje tę funkcję przejścia.
- source_word: παραδῶσιν
  choice: wydadzą
  rationale: παραδίδωμι oznacza tu przekazanie uczniów w ręce wrogich władz. Polskie „wydać kogoś” zachowuje sens sądowo-represyjny bez zawężania go do zdrady.
- source_word: μὴ μεριμνήσητε
  choice: nie martwcie się
  rationale: Czasownik zakazuje pełnej lęku troski o przyszłe wystąpienie. „Nie martwcie się” jest współczesne, jasne i nie sugeruje zakazu wszelkiej odpowiedzialnej rozwagi.
- source_word: πῶς ἢ τί
  choice: jak albo co
  rationale: Przekład zachowuje greckie rozróżnienie między sposobem mówienia a treścią wypowiedzi oraz alternatywną siłę spójnika ἤ.
- source_word: λαλήσητε
  choice: macie mówić
  rationale: W pytaniu zależnym forma trybu łączącego odnosi się do oczekiwanej wypowiedzi. „Macie mówić” naturalnie oddaje ten sens i pozwala zachować powtórzenie czasownika w obu częściach wersetu.
- source_word: δοθήσεται
  choice: zostanie wam dane
  rationale: Przyszła strona bierna pozostawia dawcę niewymienionym, zgodnie z tekstem greckim.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: w tej bowiem godzinie
  rationale: Dosłowne „w tej godzinie” zachowuje nacisk na pomoc udzieloną dokładnie w chwili potrzeby; „bowiem” oddaje γάρ i naturalnie wskazuje uzasadnienie wcześniejszego nakazu.
theological_decisions:
- issue: Niewskazany sprawca w stronie biernej δοθήσεται
  choice: Zachować formę „zostanie wam dane” bez wymieniania dawcy.
  alternative: „Bóg da wam” albo „Duch da wam”.
  rationale: W tym wersecie greka nie nazywa sprawcy. Następny werset objaśnia działanie Ducha, lecz nie należy uprzedzać tego dopowiedzenia ani usuwać zamierzonej powściągliwości tekstu.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanie formalnym rytmie. Zachowano powtórzenie „macie mówić”, alternatywę „jak albo co” oraz niewskazanego sprawcę strony biernej. Marker [a] umieszczono bezpośrednio przy wyrażeniu objaśnianym w przypisie.
