source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: pl
  text: Nie bójcie się ich więc, bo nie ma nic zakrytego, co nie zostanie odsłonięte, ani nic ukrytego, co nie zostanie poznane.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Nie bójcie się ich więc
  rationale: Oddaje zakaz w naturalnej polszczyźnie, zachowuje odniesienie zaimka do prześladowców z kontekstu oraz wynikowy charakter οὖν.
- source_word: κεκαλυμμένον ... ἀποκαλυφθήσεται
  choice: zakrytego ... zostanie odsłonięte
  rationale: Zachowuje obrazową opozycję między tym, co zakryte, a jego przyszłym odsłonięciem.
- source_word: κρυπτὸν ... γνωσθήσεται
  choice: ukrytego ... stanie się znane
  rationale: 'Oddaje odrębną opozycję źródłową: rzecz ukryta zostanie poznana, bez zacierania paralelizmu.'
theological_decisions:
- issue: Zakres maksymy o ujawnieniu tego, co zakryte i ukryte
  choice: Pozostawiono sformułowanie ogólne i bez dopowiedzenia, co konkretnie zostanie ujawnione.
  alternative: Objaśnić je jako ujawnienie prawdy Ewangelii albo złych czynów prześladowców.
  rationale: Sam werset nie rozstrzyga jednoznacznie zakresu odniesienia; dopowiedzenie zawęziłoby zamierzoną treść i usunęło jej napięcie kontekstowe.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano paralelną budowę zdania oraz rozróżnienie między „zakryte–odsłonięte” i „ukryte–znane”.
