  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: pl
  text: Każdy więc, kto przyzna się do mnie przed ludźmi, do tego również ja przyznam się[a] przed moim Ojcem, który jest w niebie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greka w obu częściach używa dosłownie przyimka „w”: „we mnie” oraz „w nim”. W tym kontekście wyraża on otwarte przyznanie się do danej osoby lub uznanie jej.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Każdy więc, kto
  rationale: Oddaje uogólniające i obejmujące wszystkich znaczenie konstrukcji Πᾶς... ὅστις, a „więc” zachowuje wynikowe powiązanie z poprzednim kontekstem.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: przyzna się do mnie
  rationale: Naturalny polski zwrot wyraża publiczne uznanie więzi z Jezusem i opowiedzenie się za Nim. Zachowuje osobę Jezusa jako przedmiot wyznania, nie sprowadzając wypowiedzi jedynie do deklaracji określonej nauki.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: przed ludźmi
  rationale: „Przed” oddaje obecność i publiczny charakter sytuacji, a „ludźmi” naturalnie przekazuje ogólne odniesienie greckiego ἀνθρώπων do ludzi.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: do tego również ja przyznam się
  rationale: Powtórzenie „przyznam się” zachowuje zamierzoną wzajemność czasownika ὁμολογέω, zaś „również ja” oddaje emfatyczne κἀγώ. Konstrukcja „do tego” jest idiomatyczna po polsku i nawiązuje do wcześniejszego „każdy, kto”.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: moim Ojcem, który jest w niebie
  rationale: To naturalne współczesne polskie brzmienie typowego Mateuszowego określenia. Liczba pojedyncza „w niebie” jest polskim idiomem, mimo greckiej liczby mnogiej οὐρανοῖς.
theological_decisions:
- issue: Publiczne przyznanie się do Jezusa i odpowiadające mu przyznanie się Jezusa do człowieka
  choice: Zachować bezpośrednią obietnicę wzajemnego, publicznego uznania bez dopowiadania okoliczności.
  alternative: Jednoznacznie określić wypowiedź jako dotyczącą wyłącznie sądu ostatecznego albo wyłącznie obecnego uczniostwa.
  rationale: Werset mówi o przyznaniu się Jezusa przed Ojcem, lecz sam nie precyzuje czasu ani pełnych ram doktrynalnych tego wydarzenia. Przekład zachowuje jego wagę i napięcie bez narzucania systematycznej interpretacji.
translation_notes:
  register: Współczesny, godny i publicznie zrozumiały rejestr. Zwrot „przyznać się do kogoś” brzmi naturalnie po polsku i zachowuje wyraźną wzajemność obu części zdania. Szyk „do tego również ja” pozwala zachować grecką konstrukcję uogólniającą bez niezręcznego anakolutu.
