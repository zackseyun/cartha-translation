  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: pl
  text: I nie bójcie się tych, którzy zabijają ciało, lecz duszy zabić nie mogą. Bójcie się raczej tego[a], który może i duszę, i ciało zniszczyć w Gehennie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „tego, który”. Najbardziej naturalnym odniesieniem w kontekście jest Bóg, lecz tekst grecki nie nazywa go wprost.'
    reason: preservation_of_referential_ambiguity
  - marker: b
    text: 'Lub: „w piekle”. Greckie słowo γεέννα („Gehenna”) wywodzi się od nazwy Doliny Hinnoma i jest używane w odniesieniu do miejsca ostatecznego sądu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: nie bójcie się / bójcie się
  rationale: Powtórzenie tego samego czasownika zachowuje wyraźną antytezę tekstu greckiego. „Bać się” jest naturalne i nie osłabia siły ostrzeżenia.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: tych, którzy zabijają
  rationale: Rodzajnik z imiesłowem wskazuje ogólną kategorię osób; polska konstrukcja względna brzmi naturalnie i zachowuje ten sens.
- source_word: σῶμα
  choice: ciało
  rationale: Bezpośredni i standardowy odpowiednik określający fizyczne ciało.
- source_word: ψυχήν
  choice: duszę
  rationale: W zestawieniu z ciałem słowo oznacza niefizyczny wymiar osoby. „Życie” jest możliwe w innych kontekstach, lecz tutaj zacierałoby zamierzone rozróżnienie.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: zabić nie mogą
  rationale: Oddaje zarówno czynność zabicia, jak i podkreśloną w grece niezdolność; szyk jest zwięzły i godny.
- source_word: μᾶλλον
  choice: raczej
  rationale: 'Wyraża przeciwstawienie i korektę: nie lęk przed jednymi, lecz raczej przed Tym, który ma większą władzę.'
- source_word: τὸν δυνάμενον
  choice: Tego, który może
  rationale: Zachowuje rzeczownikowy charakter imiesłowu i nie dopisuje imienia referenta. Wielka litera sygnalizuje najbardziej naturalne kontekstowo odniesienie do Boga, nie zastępując jednak greckiego wyrażenia słowem „Bóg”.
- source_word: ἀπολέσαι
  choice: zgładzić
  rationale: Oddaje rozstrzygające zniszczenie w sądzie, nie przesądzając jego metafizycznego sposobu. „Zgładzić” w tym kontekście brzmi naturalniej i uroczyściej niż dosłowne „zniszczyć” osobę.
- source_word: ἐν γεέννῃ
  choice: w Gehennie
  rationale: Transliteracja zachowuje konkretny termin grecki i jego żydowskie tło, zamiast zastępować go interpretacyjnym odpowiednikiem „piekło”.
theological_decisions:
- issue: Tożsamość „Tego, który może i duszę, i ciało zgładzić w Gehennie”
  choice: Pozostawiono określenie „Tego, który”, bez dopisania imienia; wielka litera wskazuje na Boga jako najbardziej naturalnego referenta kontekstowego.
  alternative: 'Bóg; szatan; zapis małą literą: „tego, który”'
  rationale: Grecki tekst nie wymienia referenta wprost, choć władza ostatecznego sądu najnaturalniej wskazuje na Boga. Przekład nie dopisuje więc „Boga”; przypis ujawnia kwestię interpretacyjną.
- issue: Oddanie γέεννα
  choice: Gehenna
  alternative: piekło
  rationale: „Gehenna” zachowuje termin źródłowy oraz jego związek z Doliną Hinnoma. Znany odpowiednik interpretacyjny podano w przypisie.
translation_notes:
  register: Współczesna, godna polszczyzna z zachowaniem retorycznego powtórzenia „bójcie się”, kontrastu ciało–dusza oraz źródłowego terminu „Gehenna”. Konstrukcja „zabić nie mogą” nadaje zdaniu rytm bez archaizacji. Wszystkie znaczące alternatywy interpretacyjne pozostają jawne w przypisach.
