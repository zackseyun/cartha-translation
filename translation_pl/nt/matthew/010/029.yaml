id: MAT.10.29
reference: Matthew 10:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: pl
  text: Czy nie sprzedaje się dwóch wróbli za assariona[b]? A jednak ani jeden z nich nie spadnie na ziemię niezależnie od waszego Ojca[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „bez waszego Ojca”. Wyrażenie może wskazywać na jego wiedzę, troskę lub wolę, lecz tekst grecki nie precyzuje, o który aspekt chodzi.'
    reason: alternative_reading
  - marker: b
    text: Assarion był rzymską monetą miedzianą o bardzo małej wartości.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: wróbli
  rationale: W tym kontekście rzeczownik najnaturalniej oznacza wróble; ogólnie może odnosić się także do małych ptaków.
- source_word: ἀσσαρίου
  choice: assariona
  rationale: Zachowano nazwę konkretnej, mało wartościowej monety rzymskiej, zamiast zastępować ją niedokładnym współczesnym odpowiednikiem.
- source_word: πωλεῖται
  choice: sprzedaje się
  rationale: Polska konstrukcja bezosobowa naturalnie oddaje grecką stronę bierną czasu teraźniejszego.
- source_word: ἓν ἐξ αὐτῶν
  choice: ani jeden z nich
  rationale: Idiomaticznie oddaje wyrażenie cząstkowe, a partykuła „ani” współgra z przeczeniem w zdaniu.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: nie spadnie na ziemię
  rationale: Naturalny polski odpowiednik greckiej konstrukcji oznaczającej upadek na ziemię.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: bez waszego Ojca
  rationale: Ściśle zachowuje zwięzłość i nieokreśloność greckiego wyrażenia, bez dopowiadania, czy chodzi konkretnie o wiedzę, wolę, zgodę lub opiekę Ojca.
- source_word: οὐχὶ ... ;
  choice: Czy nie ...?
  rationale: Oddaje pytanie retoryczne, które zakłada odpowiedź twierdzącą.
- source_word: καὶ
  choice: A jednak
  rationale: W kontekście uwydatnia kontrast między znikomą wartością wróbli a troską Ojca; jest naturalniejsze po polsku niż samo „i”.
theological_decisions:
- issue: Znaczenie wyrażenia „bez waszego Ojca” w odniesieniu do Bożej opatrzności
  choice: Zachowano szerokie i niejednoznaczne sformułowanie „bez waszego Ojca”.
  alternative: „bez wiedzy waszego Ojca” albo „bez woli waszego Ojca”
  rationale: Grecki tekst wskazuje na związek wydarzenia z Ojcem, lecz nie określa wprost charakteru tego związku. Rozwinięcie go jako wiedzy lub woli rozstrzygałoby kwestię, którą tekst pozostawia otwartą.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano retoryczne pytanie oraz teologiczną niejednoznaczność końcowego wyrażenia. Nazwę starożytnej monety objaśniono w przypisie.
