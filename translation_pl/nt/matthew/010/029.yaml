  rationale: Korekta ogranicza się do idiomatycznego oddania końcowego wyrażenia, które w dosłownej polskiej postaci jest niejasne i łatwo zmienia sens. Przypis wskazuje dosłowną formę oraz zachowuje niejednoznaczność interpretacyjną tekstu greckiego.
