  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: pl
  text: A nawet wszystkie włosy na waszej głowie są policzone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „zostały policzone”. Grecki perfectum strony biernej może podkreślać dokonaną czynność, której skutek trwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: waszej
  rationale: Zaimek w drugiej osobie liczby mnogiej wyraża przynależność; w naturalnej polszczyźnie łączy się tu z rzeczownikiem „głowie”.
- source_word: δὲ
  choice: A
  rationale: Partykuła wskazuje na łagodne przeciwstawienie lub przejście w toku wypowiedzi; „A” naturalnie zachowuje tę funkcję w kontekście pocieszenia.
- source_word: καὶ
  choice: nawet
  rationale: 'Ma tu wartość emfatyczną: podkreśla, że policzone są nawet pojedyncze włosy.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: włosy na waszej głowie
  rationale: To naturalny współczesny polski odpowiednik greckiej konstrukcji dopełniaczowej, zachowujący konkretny obraz.
- source_word: πᾶσαι
  choice: wszystkie
  rationale: Oddaje pełny zakres stwierdzenia i zgadza się rodzajowo z polskim rzeczownikiem „włosy” w liczbie mnogiej.
- source_word: ἠριθμημέναι εἰσίν
  choice: są policzone
  rationale: Grecka konstrukcja peryfrastyczna perfectum strony biernej przedstawia stan wynikający z dokonanej czynności; „są policzone” brzmi naturalnie i zachowuje sens rezultatywny.
theological_decisions:
- issue: Zakres sugerowanej wiedzy i troski Boga
  choice: Zachować konkretne stwierdzenie, że wszystkie włosy są policzone, bez dopisywania objaśnienia o opatrzności.
  alternative: Parafraza wprost mówiąca o wszechwiedzy, trosce lub opatrzności Boga.
  rationale: Werset posługuje się konkretnym obrazem; jego teologiczne znaczenie powinno wynikać z kontekstu, a nie z dodanej interpretacji.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Konstrukcja „włosy na waszej głowie” jest bardziej naturalna niż dosłowne „włosy waszej głowy”, a jednocześnie zachowuje obraz i nacisk tekstu greckiego.
