source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: pl
  text: 'Tych dwunastu Jezus posłał, polecając im: „Nie udawajcie się do pogan[a] i nie wchodźcie do żadnego miasta Samarytan[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „na drogę pogan”. Greckie wyrażenie posługuje się obrazem drogi; prawdopodobnie oznacza udanie się w stronę obszaru pogan.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też: „do samarytańskiego miasta” lub „do miejscowości Samarytan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: Tych dwunastu
  rationale: Zachowuje wskazujący charakter wyrażenia i nie dodaje rzeczownika „uczniów”, którego nie ma w tekście greckim.
- source_word: ἀπέστειλεν
  choice: posłał
  rationale: Naturalny, godny polski odpowiednik oznaczający wysłanie z określonym zadaniem; kontekst ukazuje misyjny charakter posłania bez potrzeby dodawania „z misją”.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: dając im takie polecenie
  rationale: Oddaje dyrektywną siłę παραγγέλλω i naturalnie wprowadza mowę bez zbędnego dosłownego „mówiąc”.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Nie idźcie drogą ku poganom
  rationale: Zachowuje obecny w grece obraz drogi oraz kierunkowy charakter εἰς, nie sprowadzając wyrażenia wyłącznie do wejścia na konkretną drogę.
- source_word: ἐθνῶν
  choice: poganom
  rationale: W tym żydowskim kontekście oznacza ludzi spoza Izraela. „Poganie” jest utrwalonym i zrozumiałym odpowiednikiem, choć może też być oddane jako „narody” lub „nie-Żydzi”.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: nie wchodźcie do miasta Samarytan
  rationale: Blisko oddaje składnię grecką i zachowuje odniesienie do miejscowości należącej do Samarytan; „miasto” jest podstawowym odpowiednikiem πόλις, choć kontekst nie przesądza jego wielkości.
theological_decisions:
- issue: Zakres zakazu dotyczącego pogan i Samarytan
  choice: Przedstawić go jako bezpośrednie polecenie dane Dwunastu przy tym konkretnym posłaniu, bez dopowiadania jego trwałości.
  alternative: Sformułować zakaz tak, by sugerował powszechne i bezterminowe wykluczenie pogan oraz Samarytan.
  rationale: Sam werset podaje stanowczy nakaz w określonej scenie posłania. Przekład zachowuje jego siłę, ale nie dodaje twierdzenia o jego obowiązywaniu poza tym kontekstem.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, biblijnym tonie. Składnię uproszczono przy wprowadzeniu mowy, zachowując stanowczy charakter polecenia. Markery przypisów umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
