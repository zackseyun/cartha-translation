id: MAT.10.36
reference: Matthew 10:36
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: pl
  text: I nieprzyjaciółmi człowieka będą jego domownicy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo oddane jako „człowiek” jest tu użyte reprezentatywnie i odnosi się ogólnie do osoby; „domownicy” to osoby należące do jej domu.
    reason: Objaśnienie reprezentatywnego użycia liczby pojedynczej oraz zakresu znaczeniowego οἰκιακοί.
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Zachowuje prostą funkcję łączącą z poprzednią wypowiedzią bez dodawania związku przyczynowego.
- source_word: ἐχθροὶ
  choice: nieprzyjaciółmi
  rationale: Rzeczownikowe użycie przymiotnika oznacza osoby wrogo nastawione; polski narzędnik wynika z uzupełnienia zdania domyślnym czasownikiem „będą”.
- source_word: τοῦ ἀνθρώπου
  choice: człowieka
  rationale: Dopełniacz wyraża tu relację przynależności. „Człowieka” zachowuje reprezentatywną liczbę pojedynczą i brzmi naturalnie w sentencjonalnym charakterze wypowiedzi.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: jego domownicy
  rationale: οἰκιακοί oznacza osoby należące do danego domu lub gospodarstwa domowego, nie sam budynek. „Domownicy” jest zwięzłe i nie zawęża znaczenia wyłącznie do rodziny biologicznej.
theological_decisions:
- issue: Reprezentatywne użycie rodzaju męskiego w ἀνθρώπου
  choice: człowieka
  alternative: danej osoby
  rationale: Grecki rzeczownik w liczbie pojedynczej ma tutaj sens ogólny. Polski wyraz „człowiek” naturalnie zachowuje zarówno formę źródłową, jak i reprezentatywne odniesienie, bez ograniczania wypowiedzi wyłącznie do mężczyzn.
- issue: Brak wyrażonego czasownika w zdaniu greckim
  choice: uzupełnienie czasownikiem „będą”
  alternative: 'konstrukcja nominalna: „nieprzyjaciele człowieka — jego domownicy”'
  rationale: Greka posługuje się zdaniem nominalnym. Czas przyszły wynika z przytoczonego kontekstu prorockiego i pozwala oddać zdanie naturalną, pełną polszczyzną, nie zmieniając relacji między podmiotem a orzecznikiem.
translation_notes:
  register: Współczesna, zwięzła i godna polszczyzna o sentencjonalnym rytmie. „Domownicy” zachowuje szersze znaczenie gospodarstwa domowego i nie sprowadza go automatycznie do rodziny biologicznej.
