  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: pl
  text: Kto kocha ojca lub matkę bardziej niż mnie, nie jest mnie godny[a], a kto kocha syna lub córkę bardziej niż mnie, nie jest mnie godny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie stawia mnie wyżej”. Greckie wyrażenie ὑπὲρ ἐμέ mówi tutaj o kochaniu kogoś bardziej niż Jezusa, czyli dawaniu tej osobie pierwszeństwa przed Nim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: kto kocha
  rationale: Rodzajnik z imiesłowem czasu teraźniejszego pełni funkcję rzeczownikową i opisuje osobę charakteryzującą się tym działaniem. Konstrukcja „kto kocha” jest naturalna, ogólna i niedyskryminująca płciowo.
- source_word: πατέρα ἢ μητέρα
  choice: ojca lub matkę
  rationale: Rzeczowniki relacyjne oddano bez dodawania zaimka dzierżawczego, którego tekst grecki nie wyraża wprost.
- source_word: ὑπὲρ ἐμέ
  choice: bardziej niż mnie
  rationale: W tym porównawczym kontekście ὑπέρ wskazuje na większą miłość lub pierwszeństwo. „Bardziej niż mnie” jest jasnym i idiomatycznym polskim odpowiednikiem.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: nie jest mnie godny
  rationale: Ta zwięzła, utrwalona po polsku konstrukcja zachowuje dopełniacz μου przy ἄξιος i nie dodaje interpretacyjnych pojęć przynależności lub zdatności.
- source_word: καὶ
  choice: a
  rationale: W polskim paralelizm dwóch odpowiadających sobie zdań naturalnie łączy spójnik „a”, który nie wprowadza sprzeczności, lecz zestawia równoległe przypadki.
- source_word: υἱὸν ἢ θυγατέρα
  choice: syna lub córkę
  rationale: Rzeczowniki relacyjne przełożono bez niewyrażonego wprost zaimka dzierżawczego, zgodnie z budową greckiego zdania.
theological_decisions:
- issue: Relacja nadrzędnego oddania Jezusowi do miłości rodzinnej
  choice: Tekst wymaga, by miłość do Jezusa miała pierwszeństwo nawet przed najbliższymi więziami rodzinnymi, nie zaprzeczając przez to wartości samej miłości rodzinnej.
  alternative: Złagodzenie wypowiedzi do „nie kocha mnie równie mocno” albo rozszerzenie jej w nakaz nienawiści wobec rodziny.
  rationale: Greka wyraża porównanie za pomocą ὑπὲρ ἐμέ i zachowuje stanowczy osąd „nie jest mnie godny”. Przekład nie osłabia tego wymagania ani nie wprowadza mocniejszego sformułowania z innych miejsc.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Powtórzenie „nie jest mnie godny” zachowuje nacisk i równoległą budowę oryginału; nie dodano zaimków „swego/swoją”, których brak w tekście greckim.
