id: MAT.10.33
reference: Matthew 10:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: pl
  text: Lecz kto się mnie wyprze przed ludźmi, tego i ja się wyprę przed moim Ojcem, który jest w niebie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „który jest w niebiosach”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Lecz kto
  rationale: ὅστις z ἄν wprowadza ogólny warunek („kto” w znaczeniu „ktokolwiek”), a δέ przeciwstawia go treści poprzedniego wersetu; „lecz” naturalnie zachowuje ten kontrast.
- source_word: ἀρνήσηταί με
  choice: się mnie wyprze
  rationale: ἀρνέομαι może oznaczać zaparcie się, wyparcie się lub publiczne odrzucenie więzi z kimś. „Wyprzeć się kogoś” jest we współczesnej polszczyźnie naturalne i pasuje do osobowego dopełnienia „mnie”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: przed ludźmi
  rationale: ἔμπροσθεν oznacza „przed, w obecności”, a liczba mnoga ἀνθρώπων ma tutaj sens ogólny. Polskie „ludźmi” wiernie i naturalnie obejmuje osoby obu płci.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: tego i ja się wyprę
  rationale: Powtórzenie tego samego polskiego czasownika zachowuje ścisłą wzajemność obu członów. „I ja” oddaje emfatyczne κἀγώ, a „tego” jasno nawiązuje do ogólnego „kto”.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: przed moim Ojcem
  rationale: Bezpośredni i idiomatyczny odpowiednik greckiego wyrażenia; wielka litera odpowiada polskiej praktyce w odniesieniu do Boga.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: który jest w niebie
  rationale: Greka dosłownie używa liczby mnogiej „w niebiosach”, lecz polska liczba pojedyncza „w niebie” jest naturalnym odpowiednikiem w tym kontekście. Dosłowniejszą postać podano w przypisie.
theological_decisions:
- issue: Wzajemność zaparcia się
  choice: się mnie wyprze ... tego i ja się wyprę
  alternative: zaprze się mnie ... i ja się go zaprę
  rationale: Zastosowanie tego samego czasownika w obu członach zachowuje uroczystą symetrię wypowiedzi bez dopowiadania zakresu ani ostatecznych skutków zaparcia się.
- issue: Ogólny zakres ἀνθρώπων i męska forma αὐτόν
  choice: przed ludźmi ... tego
  alternative: przed ludźmi ... tej osoby
  rationale: „Ludzie” ma w polszczyźnie naturalnie ogólny zakres, natomiast korelacja „kto ... tego” zachowuje gramatyczny kształt zdania i nie ogranicza wypowiedzi do mężczyzn.
translation_notes:
  register: Język współczesny, uroczysty i przystępny. Konstrukcja „kto... tego...” zachowuje zwięzłość oraz retoryczną równoległość oryginału; „wyprzeć się” brzmi naturalnie i ma odpowiednią wagę.
