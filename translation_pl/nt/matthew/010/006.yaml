  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: pl
  text: lecz idźcie raczej do zaginionych owiec domu Izraela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: idźcie
  rationale: Tryb rozkazujący w drugiej osobie liczby mnogiej. „Idźcie” jest naturalnym, bezpośrednim poleceniem i dobrze odpowiada kontekstowi posłania uczniów.
- source_word: δὲ
  choice: lecz
  rationale: Partykuła wyraża tu kontrast wobec zakazu z poprzedniego wersetu. „Lecz” zachowuje związek składniowy i przeciwstawienie.
- source_word: μᾶλλον
  choice: raczej
  rationale: W połączeniu z δέ wskazuje na wybór właściwego kierunku zamiast wcześniej wykluczonych miejsc. „Raczej” jest bliskie greckiemu wyrażeniu i naturalne po polsku.
- source_word: πρὸς
  choice: do
  rationale: Przy czasowniku ruchu przyimek wskazuje cel lub kierunek; polskie „do” jest tu najbardziej idiomatyczne.
- source_word: τὰ πρόβατα
  choice: owce
  rationale: Zachowano wyraźny obraz metaforyczny obecny w grece, zamiast zastępować go objaśniającym określeniem ludzi.
- source_word: τὰ ἀπολωλότα
  choice: zaginione
  rationale: Imiesłów czasu perfectum od ἀπόλλυμι w obrazie pasterskim opisuje owce pozostające w stanie zagubienia. „Zaginione” brzmi naturalnie i nie zawęża sensu do fizycznej zagłady.
- source_word: οἴκου Ἰσραήλ
  choice: z domu Izraela
  rationale: Sformułowanie zachowuje biblijne, wspólnotowe określenie „dom Izraela”. Przyimek „z” pozwala naturalnie połączyć je z rzeczownikiem „owce”, nie usuwając możliwości odczytania, że chodzi o owce, które zaginęły spośród tego domu.
theological_decisions:
- issue: Metaforyczne określenie Izraela
  choice: zaginione owce z domu Izraela
  alternative: Izraelici, którzy zbłądzili
  rationale: Grecki tekst wprost posługuje się obrazem owiec. Zachowanie metafory podtrzymuje jej biblijne i prorockie powiązania bez dodawania interpretacyjnej parafrazy.
- issue: Związek wyrażenia „domu Izraela” z „owcami” lub ich zaginięciem
  choice: z domu Izraela
  alternative: które zaginęły spośród domu Izraela
  rationale: Zwięzła konstrukcja główna odpowiada naturalnemu odczytaniu „owce należące do domu Izraela”, a przypis zachowuje możliwe odczytanie, w którym dopełniacz określa wspólnotę, spośród której owce zaginęły.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano ciągłość zdania przez początkowe „lecz”, bez sztucznego podnoszenia stylu. Obraz „zaginionych owiec” pozostaje przejrzysty dla współczesnego czytelnika i zachowuje biblijny rezonans.
