  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: pl
  text: I przywoławszy do siebie swoich dwunastu uczniów, dał im władzę nad duchami nieczystymi[a], aby je wypędzać i uzdrawiać wszelką chorobę i wszelką niemoc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „moc nad duchami nieczystymi”; greckie exousia oznacza zwykle władzę lub udzielone uprawnienie do działania.'
    reason: lexical_alternative
  - marker: b
    text: 'Grecki tekst używa dwóch pokrewnych określeń: nosos i malakia, które można też oddać jako „wszelką chorobę i wszelką dolegliwość”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: przywołał do siebie
  rationale: Aorystowy imiesłów προσκαλέομαι oznacza wezwanie lub przywołanie kogoś do siebie. Współrzędna forma osobowa brzmi naturalniej po polsku, zachowując następstwo czynności bez nadmiernego precyzowania relacji czasowej.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: swoich dwunastu uczniów
  rationale: μαθητής w kontekście Ewangelii oznacza ucznia Jezusa, a zaimek zwrotny „swoich” naturalnie odnosi αὐτοῦ do podmiotu zdania.
- source_word: ἔδωκεν
  choice: dał
  rationale: Prosty odpowiednik δίδωμι, bez dodawania niuansu uroczystego nadania.
- source_word: ἐξουσίαν
  choice: władzę
  rationale: ἐξουσία oznacza uprawnienie lub władzę do działania, tutaj udzieloną uczniom przez Jezusa; „władza” lepiej niż sama „moc” oddaje aspekt autorytetu.
- source_word: πνευμάτων ἀκαθάρτων
  choice: nad duchami nieczystymi
  rationale: Dopełniacz zależny od ἐξουσίαν wskazuje zakres sprawowanej władzy. „Duchy nieczyste” to precyzyjne i utrwalone określenie ewangeliczne.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: aby je wypędzali
  rationale: ὥστε z bezokolicznikiem może wyrażać zamierzony lub wynikający skutek; „aby” zachowuje tę relację w naturalnej polszczyźnie, a „je” odnosi się do duchów.
- source_word: θεραπεύειν
  choice: uzdrawiali
  rationale: W tym kontekście θεραπεύω oznacza przywracanie zdrowia; forma niedokonana odpowiada równoległemu bezokolicznikowi i ogólnemu zakresowi misji.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: każdą chorobę i każdą niemoc
  rationale: Rozróżnienie „choroba”–„niemoc” zachowuje dwa pokrewne, lecz nieidentyczne greckie rzeczowniki νόσος i μαλακία oraz powtórzenie πᾶσαν.
theological_decisions:
- issue: Charakter upoważnienia uczniów
  choice: Jezus dał uczniom władzę nad duchami nieczystymi
  alternative: Jezus dał uczniom moc przeciw duchom nieczystym
  rationale: „Władzę” oddaje ἐξουσία jako udzielone uprawnienie i autorytet, nie wykluczając skutecznej mocy, ale też nie sprowadzając sensu do samej zdolności.
- issue: Relacja wyrażona przez ὥστε
  choice: „aby” bez rozstrzygania między czystym celem a zamierzonym skutkiem
  alternative: „tak że”, akcentujące wyłącznie rezultat
  rationale: Konstrukcja ὥστε z bezokolicznikiem pozwala na odcień celu lub skutku. Polski spójnik „aby” naturalnie łączy udzieloną władzę z wypędzaniem i uzdrawianiem, bez rozwijania dodatkowej doktryny.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Zachowano początkowe „I”, powtórzenie „każdą” oraz rozróżnienie dwóch greckich określeń choroby. Składnię imiesłowową przełożono na naturalną polską konstrukcję współrzędną.
