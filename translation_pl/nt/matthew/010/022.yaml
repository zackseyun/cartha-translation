id: MAT.10.22
reference: Matthew 10:22
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: pl
  text: I wszyscy będą was nienawidzić z powodu mojego imienia.[a] Lecz kto wytrwa[b] do końca, ten zostanie zbawiony.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „ze względu na moje imię”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „pozostanie wytrwały”.'
    reason: lexical_alternative
  - marker: c
    text: W zależności od ujęcia kontekstu słowa „zostanie zbawiony” można też rozumieć jako „zostanie ocalony” lub „uratowany”.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: wszyscy będą was nienawidzić
  rationale: Naturalna polska konstrukcja czynna wiernie oddaje przyszły stan wyrażony przez ἔσεσθε z imiesłowem oraz powszechny zakres πάντων. Unika cięższego sformułowania „będziecie znienawidzeni przez wszystkich”.
- source_word: διὰ τὸ ὄνομά μου
  choice: z powodu mojego imienia
  rationale: διά z biernikiem wskazuje przyczynę. „Imię” zachowuje biblijną pojemność znaczeniową, obejmując osobę Jezusa i przynależność do Niego, bez dopowiadania tego w tekście głównym.
- source_word: ὁ δὲ ὑπομείνας
  choice: lecz kto wytrwa
  rationale: ὑπομένω w kontekście prześladowania oznacza trwanie mimo trudności. Polski zwrot „kto wytrwa” jest naturalny i nie wprowadza późniejszej terminologii doktrynalnej.
- source_word: εἰς τέλος
  choice: do końca
  rationale: Zwięzły i idiomatyczny odpowiednik wskazujący trwanie aż do punktu końcowego, bez rozstrzygania, jaki konkretnie „koniec” ma na myśli kontekst.
- source_word: οὗτος
  choice: ten
  rationale: Polska konstrukcja korelacyjna „kto…, ten…” naturalnie zachowuje resumptywny i podkreślający charakter zaimka οὗτος.
- source_word: σωθήσεται
  choice: zostanie zbawiony
  rationale: „Zostanie zbawiony” zachowuje szeroki zakres σῴζω i jego teologiczną wagę, nie zawężając sensu do samego doczesnego ocalenia.
theological_decisions:
- issue: Znaczenie zbawienia w związku z wytrwaniem
  choice: Pozostawiono szerokie sformułowanie „zostanie zbawiony”.
  alternative: „zostanie ocalony” lub „zostanie uratowany”
  rationale: Werset łączy wytrwanie wśród prześladowań ze zbawieniem, ale sam przekład nie powinien rozstrzygać, czy nacisk pada na doczesne ocalenie, zbawienie eschatologiczne, czy określony model doktryny o wytrwaniu.
translation_notes:
  register: Współczesny, godny i zrozumiały polski. Konstrukcja „kto…, ten…” brzmi naturalnie, a zarazem zachowuje nacisk obecny w greckim οὗτος. Szyk pierwszego zdania oddaje sens greckiej strony biernej bardziej idiomatyczną w polszczyźnie stroną czynną.
