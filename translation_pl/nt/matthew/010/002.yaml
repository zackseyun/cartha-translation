id: MAT.10.2
reference: Matthew 10:2
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: pl
  text: 'A oto imiona dwunastu apostołów: pierwszy[a] — Szymon, zwany Piotrem, i jego brat Andrzej; Jakub, syn Zebedeusza, i jego brat Jan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Słowo „pierwszy” może tu wskazywać nie tylko kolejność w wyliczeniu, lecz także szczególną pozycję wśród Dwunastu.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: a oto
  rationale: δέ łagodnie wprowadza wykaz imion; polskie „a oto” naturalnie sygnalizuje przejście, nie nadając mu wyraźnie czasowego znaczenia.
- source_word: δώδεκα ἀποστόλων
  choice: dwunastu apostołów
  rationale: „Apostołowie” to utrwalone i trafne określenie rozpoznawalnej grupy posłanej przez Jezusa.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: oto imiona
  rationale: Zwięzła, naturalna polska konstrukcja zachowująca wskazujący charakter greckiego wyrażenia.
- source_word: πρῶτος
  choice: pierwszy
  rationale: Zachowuje podstawowe znaczenie słowa w wyliczeniu, bez rozstrzygania, czy chodzi również o szczególną rangę.
- source_word: ὁ λεγόμενος
  choice: zwany
  rationale: Naturalny i godny polski odpowiednik imiesłowowej formuły identyfikującej Szymona jako Piotra.
- source_word: Πέτρος
  choice: Piotr
  rationale: Zastosowano utrwaloną polską formę imienia.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: jego brat
  rationale: Wyrażenie oznacza rodzonego brata; zaimek odnosi się odpowiednio do Szymona i Jakuba.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: syn Zebedeusza
  rationale: Grecki dopełniacz identyfikujący osobę przez ojca najnaturalniej oddaje się po polsku jako „syn Zebedeusza”.
theological_decisions:
- issue: Znaczenie πρῶτος przy Szymonie/Piotrze
  choice: „pierwszy” w tekście głównym, przede wszystkim jako początek wyliczenia
  alternative: „pierwszy” może także sugerować szczególną pozycję lub znaczenie wśród Dwunastu
  rationale: Sam werset nie rozstrzyga, czy poza kolejnością wyliczenia chodzi o rangę. Prosty przekład zachowuje sens leksykalny, a przypis sygnalizuje możliwy dodatkowy odcień bez wprowadzania rozstrzygnięcia wyznaniowego.
translation_notes:
  register: Współczesny, standardowy i godny język polski. Myślnik po „pierwszy” porządkuje rozbudowane wyliczenie, a średnik oddziela pary braci. Zachowano tradycyjne polskie formy imion biblijnych.
