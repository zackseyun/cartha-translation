id: MAT.10.39
reference: Matthew 10:39
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: pl
  text: Kto znajduje swoje życie, straci je[a], a kto straci swoje życie ze względu na mnie, znajdzie je.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „swoją duszę” w obu częściach zdania. Greckie ψυχή może oznaczać „życie” lub „duszę”; w tym kontekście najlepiej pasuje „życie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Kto znajduje
  rationale: Rodzajnik z imiesłowem pełni funkcję rzeczownikową i wskazuje ogólnie na osobę. Polskie „kto” naturalnie oddaje tę ogólną, jednostkową konstrukcję.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: swoje życie
  rationale: W kontekście paradoksu uczniostwa ψυχή oznacza przede wszystkim życie człowieka, nie zaś wyłącznie niematerialną duszę. Zaimek zwrotny „swoje” jest naturalnym polskim odpowiednikiem odniesienia do podmiotu.
- source_word: ἀπολέσει
  choice: straci
  rationale: Czasownik wyraża tutaj utratę. „Straci” zachowuje kontrast z „znajdzie” bez sugerowania unicestwienia.
- source_word: ὁ ἀπολέσας
  choice: kto straci
  rationale: Imiesłów aorystu w sentencjonalnej konstrukcji określa ogólny przypadek; polski czas przyszły dokonany naturalnie przedstawia czyn poprzedzający znalezienie życia.
- source_word: ἕνεκεν ἐμοῦ
  choice: ze względu na mnie
  rationale: Wyrażenie oznacza przyczynę lub motywację. „Ze względu na mnie” jest współczesne i zachowuje sens utraty życia wynikającej z więzi i lojalności wobec Jezusa.
- source_word: εὑρήσει
  choice: znajdzie
  rationale: Dosłowne „znajdzie” zachowuje zamierzoną symetrię z wcześniejszym „znajduje”.
theological_decisions:
- issue: Znaczenie ψυχή w paradoksie uczniostwa
  choice: życie
  alternative: dusza
  rationale: Kontekst mówi o zachowaniu lub utracie własnego życia z powodu wierności Jezusowi. „Życie” najlepiej zachowuje ten sens, natomiast przypis odnotowuje szerszy zakres greckiego słowa, aby nie usuwać jego możliwego odniesienia do całej osoby.
- issue: Charakter utraty życia „ze względu na mnie”
  choice: pozostawienie sformułowania bez doprecyzowania rodzaju utraty
  alternative: jawne odniesienie do męczeńskiej śmierci albo do wyrzeczenia się siebie
  rationale: Grecki tekst nie ogranicza wypowiedzi wyłącznie do fizycznej śmierci ani wyłącznie do metaforycznego samozaparcia; przekład zachowuje tę teologiczną rozpiętość.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Powtórzenia „znajduje/znajdzie” oraz „straci” zachowują paradoks i symetrię oryginału. Konstrukcja „kto... a kto...” jest naturalna w polszczyźnie i oddaje ogólny charakter wypowiedzi.
