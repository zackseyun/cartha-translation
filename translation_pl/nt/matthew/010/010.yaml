id: MAT.10.10
reference: Matthew 10:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: pl
  text: Nie zabierajcie ze sobą w drogę torby ani dwóch tunik, ani sandałów, ani laski[a], bo pracownik jest godzien swego pożywienia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektórzy rozumieją ten zakaz jako odnoszący się do dodatkowej laski, zwłaszcza w świetle Mk 6:8, gdzie pozwolono wziąć laskę.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: torby
  rationale: πήρα oznacza torbę podróżną, zwłaszcza na zapasy. W połączeniu z „w drogę” proste „torby” brzmi naturalnie i zachowuje właściwy sens.
- source_word: εἰς ὁδὸν
  choice: w drogę
  rationale: Wyrażenie wskazuje na rzeczy zabierane na podróż; „w drogę” jest zwięzłym i naturalnym polskim odpowiednikiem.
- source_word: δύο χιτῶνας
  choice: dwóch tunik
  rationale: χιτών to podstawowa spodnia szata; „tunika” zachowuje realia historyczne i jest precyzyjniejsza niż ogólne „ubranie”.
- source_word: ὑποδήματα
  choice: sandałów
  rationale: ὑπόδημα oznacza obuwie przywiązywane pod stopą; w realiach I wieku najlepiej odpowiadają mu „sandały”.
- source_word: ῥάβδον
  choice: laski
  rationale: W tym kontekście ῥάβδος oznacza laskę używaną w podróży. Przekład zachowuje zakaz występujący u Mateusza i nie harmonizuje go z Mk 6:8.
- source_word: ἄξιος
  choice: jest godzien
  rationale: Formalne „jest godzien” zachowuje znaczenie oceny należności i biblijną zwięzłość, choć we współczesnej polszczyźnie możliwe byłoby także „zasługuje na”.
- source_word: ὁ ἐργάτης
  choice: pracownik
  rationale: ἐργάτης oznacza osobę wykonującą pracę. „Pracownik” jest jasne i nie wprowadza technicznego języka kościelnego.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: swego pożywienia
  rationale: τροφή oznacza przede wszystkim pokarm lub pożywienie. Przekład zachowuje konkretny sens grecki, nie rozszerzając go interpretacyjnie do ogólnego „utrzymania”.
theological_decisions:
- issue: Możliwa harmonizacja z relacją równoległą dotyczącą wyposażenia podróżnego
  choice: W tekście głównym zachowano Mateuszowy zakaz brania laski.
  alternative: Rozumieć zakaz jako odnoszący się jedynie do dodatkowej laski, zwłaszcza w świetle Mk 6:8, albo przełożyć szerzej w sposób harmonizujący relacje.
  rationale: Grecki tekst Mateusza wyraźnie wymienia ῥάβδον wśród rzeczy zakazanych. Pierwszeństwo tekstu źródłowego wymaga zachowania napięcia między relacjami, a nie rozstrzygania go w samym przekładzie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano historycznie precyzyjne „tuniki” oraz konkretny sens „pożywienia”. Konstrukcja wyliczenia jest zwarta i odpowiada rytmowi greckiego tekstu.
