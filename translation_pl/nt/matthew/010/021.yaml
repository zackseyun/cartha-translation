  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: pl
  text: Brat zaś wyda brata na śmierć[a], a ojciec — swoje dziecko. Dzieci powstaną przeciw rodzicom i uśmiercą ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „przekaże” lub „zdradzi”. Czasownik może oznaczać wydanie kogoś w cudze ręce, a w kontekście nielojalności również zdradę.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: wyda
  rationale: Czasownik oznacza przekazanie osoby w cudze ręce, tutaj ze skutkiem śmierci. „Wyda” zachowuje konkretny sens czynności, a zarazem nie przesądza, czy nacisk pada na formalne przekazanie, czy na zdradę.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: brat ... brata
  rationale: Reprezentatywna liczba pojedyncza oraz męski, rodzinny sens greckiego wyrazu zostają zachowane bez uogólniania go do „rodzeństwa”.
- source_word: εἰς θάνατον
  choice: na śmierć
  rationale: 'Wyrażenie wskazuje na cel lub skutek wydania: osoba zostaje wydana tak, że poniesie śmierć. „Na śmierć” jest zwięzłym i idiomatycznym odpowiednikiem.'
- source_word: πατὴρ τέκνον
  choice: ojciec — swoje dziecko
  rationale: τέκνον oznacza dziecko bez określania płci. Zaimek „swoje” jasno wskazuje relację, a elipsa czasownika odtwarza zwartą budowę greckiego zdania.
- source_word: ἐπαναστήσονται
  choice: powstaną przeciw
  rationale: Sformułowanie zachowuje obrazowy sens wystąpienia przeciw komuś i nie zawęża go do buntu politycznego.
- source_word: τέκνα
  choice: dzieci
  rationale: Wyraz obejmuje potomstwo obu płci; „dzieci” jest naturalnym i zakresowo trafnym odpowiednikiem.
- source_word: ἐπὶ γονεῖς
  choice: przeciw rodzicom
  rationale: Przy czasowniku wyrażającym wrogie wystąpienie ἐπί z biernikiem znaczy „przeciw”. „Rodzicom” oddaje liczbę mnogą i nie określa płci.
- source_word: θανατώσουσιν
  choice: doprowadzą do ich śmierci
  rationale: Grecki czasownik znaczy spowodować czyjąś śmierć, niekiedy przez egzekucję. Wybrane sformułowanie zachowuje sens sprawczy, nie przesądzając o dokładnym sposobie zabicia.
- source_word: αὐτούς
  choice: ich
  rationale: Zaimek odnosi się do bezpośrednio poprzedzających „rodziców”; polski zaimek zachowuje tok oryginału.
theological_decisions:
- issue: Rodzaj i reprezentatywne określenia członków rodziny
  choice: Zachowano „brat” dla ἀδελφός oraz szersze znaczeniowo „dzieci” i „rodzice” dla τέκνα i γονεῖς.
  alternative: Oddać ἀδελφός ogólnie jako „jedno z rodzeństwa”.
  rationale: ἀδελφός jest tutaj wyrazem rodzaju męskiego i naturalnie oznacza brata, podczas gdy τέκνα oraz γονεῖς obejmują osoby obu płci. Przekład zachowuje te różnice zakresu bez dodawania interpretacji doktrynalnej.
translation_notes:
  register: Współczesny, godny rejestr biblijny. Składnia pozostaje zwarta; pauza po „ojciec” sygnalizuje elipsę czasownika bez tworzenia nienaturalnego polskiego zdania. Zachowano obrazowe „powstaną przeciw”, natomiast końcowy czasownik oddano jasno i bez przesądzenia, czy śmierć nastąpi przez formalną egzekucję, czy w inny sposób.
