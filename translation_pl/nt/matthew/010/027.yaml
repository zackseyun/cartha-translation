  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: pl
  text: Co mówię wam w ciemności[a], mówcie w świetle; a co słyszycie na ucho[b], ogłaszajcie z dachów.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać sens: „w ukryciu… otwarcie”; grecki tekst zachowuje obraz „w ciemności… w świetle”.'
    reason: lexical_alternative
  - marker: b
    text: 'To znaczy: to, co słyszycie prywatnie, macie ogłaszać publicznie. Płaskie dachy starożytnych domów były widocznymi miejscami, z których można było zwracać się do ludzi.'
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Co mówię wam
  rationale: Naturalny polski szyk zachowuje substantywne znaczenie zaimka względnego oraz bezpośredniość wypowiedzi Jezusa.
- source_word: ἐν τῇ σκοτίᾳ
  choice: w ciemności
  rationale: Zachowuje obraz oraz wyraźne przeciwstawienie ciemności i światła, nie zastępując metafory objaśniającym „w ukryciu”.
- source_word: εἴπατε
  choice: mówcie
  rationale: Tryb rozkazujący oddaje wezwanie skierowane do wielu uczniów; aspekt dokonany greckiego aorystu nie wymaga w tym uogólnionym nakazie polskiej formy dokonanej.
- source_word: ἐν τῷ φωτί
  choice: w świetle
  rationale: Zachowuje równoległość i obrazowy kontrast z „w ciemności”.
- source_word: εἰς τὸ οὖς
  choice: do ucha
  rationale: Formalnie bliskie oddanie greckiego wyrażenia kierunkowego zachowuje żywy obraz prywatnego przekazu, mimo że po polsku jest on nieco niezwykły.
- source_word: ἀκούετε
  choice: słyszycie
  rationale: Polski czas teraźniejszy naturalnie odpowiada greckiej formie w zdaniu względnym.
- source_word: κηρύξατε
  choice: ogłaszajcie
  rationale: Oddaje publiczne obwieszczanie właściwe κηρύσσω, bez zawężania sensu do formalnego kaznodziejstwa.
- source_word: ἐπὶ τῶν δωμάτων
  choice: z dachów
  rationale: Naturalny polski zwrot wskazuje dachy jako wyniesione miejsca, z których publicznie ogłaszano wiadomości; funkcjonalnie oddaje greckie ἐπί z dopełniaczem.
theological_decisions:
- issue: Czy obrazy ciemności, światła, ucha i dachów zastąpić interpretacją dotyczącą przekazu prywatnego i publicznego
  choice: Zachować obrazy w tekście głównym.
  alternative: „Co mówię wam w ukryciu, powiedzcie otwarcie; a co słyszycie prywatnie, ogłoście publicznie”.
  rationale: Grecki tekst celowo zestawia wyraziste obrazy. Ich zachowanie nie rozstrzyga ponad tekst, czy chodzi wyłącznie o poufność i jawność, i pozwala wybrzmieć retoryce Jezusa.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Powtórzenie „co” oraz paralelna budowa zachowują rytm wypowiedzi. Niezwykłe „do ucha” celowo zachowuje konkretny grecki obraz; przypis objaśnia jego sens.
