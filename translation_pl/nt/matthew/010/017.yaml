id: MAT.10.17
reference: Matthew 10:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: pl
  text: Strzeżcie się jednak ludzi[a], bo wydadzą was sądom, a w swoich synagogach będą was chłostać.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ludzi”; grecki rzeczownik ma formę rodzaju męskiego w liczbie mnogiej, ale tutaj odnosi się ogólnie do ludzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: Strzeżcie się
  rationale: Tryb rozkazujący liczby mnogiej wyraża stanowcze ostrzeżenie przed zagrożeniem; konstrukcja „strzec się kogoś” jest naturalna i zachowuje sens προσέχω z ἀπό.
- source_word: δὲ
  choice: jednak
  rationale: δέ sygnalizuje łagodne przeciwstawienie lub zwrot ku ostrzeżeniu; „jednak” brzmi naturalnie w tym miejscu.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: ludzi
  rationale: Przy προσέχω przyimek ἀπό wskazuje źródło zagrożenia. ἄνθρωποι ma tutaj znaczenie ogólne i nie ogranicza się do mężczyzn.
- source_word: παραδώσουσιν
  choice: wydadzą
  rationale: παραδίδωμι oznacza tu przekazanie kogoś władzom. „Wydadzą” z dopełnieniem „sądom” zachowuje sens prawny bez dopowiadania zdrady.
- source_word: συνέδρια
  choice: sądom
  rationale: Liczba mnoga odnosi się do lokalnych organów sądowniczych lub rad. W tym kontekście polskie „sądy” jasno oddaje ich funkcję i nie sugeruje wyłącznie jerozolimskiego Sanhedrynu.
- source_word: συναγωγαῖς
  choice: synagogach
  rationale: Termin oznacza konkretne żydowskie miejsca zgromadzeń; „synagogi” jest utrwalonym i przejrzystym odpowiednikiem.
- source_word: αὐτῶν
  choice: swoich
  rationale: Zaimek odnosi synagogi do tych samych ludzi, którzy wydadzą i będą chłostać uczniów. Polski zaimek zwrotny „swoich” wyraża tę relację naturalniej niż „ich”.
- source_word: μαστιγώσουσιν
  choice: będą was chłostać
  rationale: μαστιγόω oznacza wymierzanie kary przez bicie biczem. „Chłostać” jest zrozumiałe, poważne i dobrze pasuje do kontekstu karnego.
theological_decisions:
- issue: Zakres znaczeniowy ἀνθρώπων
  choice: ludzi
  alternative: mężczyzn
  rationale: Rzeczownik jest gramatycznie rodzaju męskiego, lecz w tym kontekście oznacza ogólnie ludzi jako potencjalnych prześladowców, a nie wyłącznie osoby płci męskiej.
- issue: Tożsamość συνέδρια
  choice: sądy
  alternative: rady; sanhedryny
  rationale: Liczba mnoga wskazuje na lokalne organy sądownicze, niekoniecznie na jeden centralny Sanhedryn. „Sądy” oddaje funkcję instytucji, nie rozstrzygając jej dokładnej formy.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Zachowano ostrzegawczy ton oraz paralelną budowę dwóch zapowiedzi. „Chłostać” celowo pozostawia historyczny i sądowy ciężar kary, nie popadając w archaizm.
