id: MAT.10.16
reference: Matthew 10:16
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: pl
  text: Oto posyłam was jak owce między wilki. Bądźcie więc roztropni jak węże i niewinni jak gołębie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Naturalny, podniosły sygnał zwracający uwagę, dobrze odpowiadający greckiemu ἰδού.
- source_word: ἀποστέλλω
  choice: posyłam
  rationale: Oddaje czynność wysłania z określoną misją, bez nadmiernego dopowiadania.
- source_word: ἐν μέσῳ
  choice: między
  rationale: Naturalny polski odpowiednik obrazu owiec znajdujących się pośród wilków.
- source_word: φρόνιμοι
  choice: roztropni
  rationale: Wyraża praktyczną mądrość, rozwagę i trafny osąd; jest precyzyjniejsze w tym kontekście niż ogólne „mądrzy”.
- source_word: οἱ ὄφεις
  choice: węże
  rationale: Tradycyjny i naturalny odpowiednik greckiego ὄφεις, zachowujący metaforyczny obraz.
- source_word: ἀκέραιοι
  choice: niewinni
  rationale: W tym zestawieniu oznacza brak szkodliwości i moralnej domieszki; „niewinni” brzmi naturalnie i zachowuje napięcie z roztropnością.
- source_word: αἱ περιστεραί
  choice: gołębie
  rationale: Zwykły polski odpowiednik, odpowiedni dla ogólnego porównania gatunkowego.
theological_decisions:
- issue: Relacja między roztropnością a niewinnością
  choice: 'Zachowano równorzędne wezwanie: „roztropni… i niewinni”.'
  alternative: Uściślić „ostrożni” albo „nieszkodliwi”.
  rationale: Grecki tekst zestawia praktyczną rozwagę z niezepsutą, nieszkodliwą postawą; przekład nie powinien podporządkowywać jednego wezwania drugiemu ani rozstrzygać ich napięcia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Oto” zachowuje retoryczne zwrócenie uwagi, a imperatyw „Bądźcie” naturalnie oddaje γίνεσθε w tym kontekście.
