id: MAT.10.25
reference: Matthew 10:25
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: pl
  text: Uczniowi wystarczy, że stanie się jak jego nauczyciel, a niewolnikowi — jak jego pan. Jeśli gospodarza domu nazwali Beelzebulem[a], o ileż bardziej jego domowników.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Belzebub” — tradycyjna polska forma tego imienia.'
    reason: Tradycyjna forma „Belzebub” jest szeroko znana, natomiast tekst grecki ma formę odpowiadającą „Beelzebul”.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: wystarczy
  rationale: Naturalny polski odpowiednik orzecznikowego przymiotnika wyrażającego wystarczalność; zachowuje zwięzłość greckiego zdania.
- source_word: μαθητῇ
  choice: uczniowi
  rationale: „Uczeń” oddaje relację nauki i naśladowania właściwą kontekstowi Ewangelii, nie ograniczając jej do edukacji szkolnej.
- source_word: ἵνα γένηται
  choice: że stanie się
  rationale: Po polskim „wystarczy” konstrukcja ta naturalnie oddaje greckie ἵνα z trybem łączącym, nie rozstrzygając nadmiernie między odcieniem celu a rezultatu.
- source_word: διδάσκαλος
  choice: nauczyciel
  rationale: W parze z μαθητής jest to najjaśniejszy odpowiednik i pozwala odróżnić ten wyraz od κύριος.
- source_word: δοῦλος
  choice: niewolnik
  rationale: Kontrast z κύριος wskazuje na podporządkowanie wynikające ze statusu niewolniczego; „sługa” nadmiernie łagodziłby tę relację.
- source_word: κύριος
  choice: pan
  rationale: W obrazie społecznym pan–niewolnik polskie „pan” jest naturalne i zachowuje odrębność od tytułowego „Pan”.
- source_word: οἰκοδεσπότην
  choice: gospodarza domu
  rationale: Wyrażenie oddaje osobę sprawującą władzę nad domem i zachowuje więź słowną z następującymi „domownikami”.
- source_word: Βεελζεβοὺλ
  choice: Belzebul
  rationale: Forma „Belzebul” odpowiada greckiemu Βεελζεβούλ; tradycyjną polską formę „Belzebub” podano w przypisie.
- source_word: ἐπεκάλεσαν
  choice: nazwali
  rationale: W tym kontekście czasownik oznacza nadanie komuś określenia lub imienia; polska składnia wymaga narzędnika „Belzebulem”.
- source_word: πόσῳ μᾶλλον
  choice: o ileż bardziej
  rationale: To naturalny, podniosły, lecz współczesny polski odpowiednik argumentacji a fortiori.
- source_word: οἰκιακοὺς
  choice: domowników
  rationale: Termin obejmuje ogół osób należących do gospodarstwa domowego, nie tylko sługi czy niewolników.
theological_decisions:
- issue: Znaczenie κύριος w analogii dotyczącej gospodarstwa domowego
  choice: pan
  alternative: Pan
  rationale: Bezpośrednie zestawienie z δοῦλος ma charakter społeczny i domowy. Mała litera nie narzuca w tej części zdania tytułu chrystologicznego, choć szerszy kontekst pozwala dostrzec odniesienie do Jezusa.
- issue: Oddanie δοῦλος
  choice: niewolnik
  alternative: sługa
  rationale: Wzajemna relacja δοῦλος–κύριος uwydatnia nierówny status i zależność prawnospołeczną; „niewolnik” zachowuje tę siłę znaczeniową.
translation_notes:
  register: Język jest współczesny, zwięzły i godny. Konstrukcja „o ileż bardziej” zachowuje retoryczną siłę wypowiedzi. Myślnik w drugim członie eliptycznym zapobiega niezręcznemu powtórzeniu czasownika.
