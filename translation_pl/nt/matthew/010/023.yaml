  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: pl
  text: 'A gdy będą was prześladować w tym mieście, uciekajcie do innego[a]. Bo zapewniam was: na pewno nie zdołacie obejść miast Izraela[b], zanim przyjdzie Syn Człowieczy[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „do drugiego/innego [miasta]”. Słowo „miasta” wynika z poprzedniego zdania.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „na pewno nie ukończycie miast Izraela”. Przekład „nie zdołacie obejść” wyraża domyślną w kontekście wędrówkę misyjną po tych miastach.'
    reason: lexical_alternative
  - marker: c
    text: Sformułowanie „zanim przyjdzie Syn Człowieczy” celowo pozostaje otwarte. Różnie rozumie się je jako odniesienie do wywyższenia Jezusa, przyjścia na sąd albo Jego ostatecznego powrotu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: A gdy
  rationale: Konstrukcja wprowadza przyszłą, mogącą się powtarzać sytuację. W polszczyźnie „gdy będą” naturalnie oddaje jej otwarty charakter, a „a” zachowuje ciąg wywodu.
- source_word: διώκωσιν ὑμᾶς
  choice: będą was prześladować
  rationale: W kontekście mowy misyjnej czasownik oznacza wrogie prześladowanie, nie tylko ściganie.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: w tym mieście
  rationale: Zachowuje wskazujący i bezpośredni charakter greckiego wyrażenia.
- source_word: φεύγετε
  choice: uciekajcie
  rationale: Tryb rozkazujący wyraża pilne opuszczenie miejsca wobec prześladowania.
- source_word: εἰς τὴν ἑτέραν
  choice: do innego
  rationale: Rzeczownik „miasta” jest domyślny z poprzedniego członu. „Do innego” jest naturalne i nie narzuca kolejności przestrzennej, której samo ἑτέραν nie wymaga.
- source_word: ἀμὴν γὰρ λέγω ὑμῖν
  choice: Zapewniam was
  rationale: Oddaje uroczystą formułę autorytatywnego zapewnienia we współczesnej, godnej polszczyźnie. Spójnik γάρ wiąże zapewnienie z poprzednim poleceniem; w polskim tę relację wystarczająco sygnalizuje następstwo zdań.
- source_word: οὐ μὴ τελέσητε
  choice: nie zdążycie obejść
  rationale: Emfatyczne οὐ μή stanowczo wyklucza ukończenie czynności przed wskazanym momentem. „Nie zdążycie” naturalnie oddaje tę relację czasową, a „obejść” ujawnia domyślną w kontekście działalność w kolejnych miastach.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: miast Izraela
  rationale: Proste i utrwalone oddanie dopełniaczowej konstrukcji, odnoszącej się do miast należących do obszaru lub ludu Izraela.
- source_word: ἕως ἂν ἔλθῃ
  choice: zanim przyjdzie
  rationale: Przy zanegowanym czasowniku głównym polskie „zanim” naturalnie wyraża, że czynność nie zostanie ukończona do momentu przyszłego przyjścia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik zachowujący dosłowne brzmienie oraz biblijne i teologiczne rezonanse tytułu.
theological_decisions:
- issue: Znaczenie przyjścia Syna Człowieczego w tym kontekście
  choice: Pozostawiono dosłowne „zanim przyjdzie Syn Człowieczy” bez określania rodzaju tego przyjścia.
  alternative: Doprecyzowanie jako przyjście w ramach zmartwychwstania i wywyższenia, sądu nad Jerozolimą albo ostatecznego powrotu.
  rationale: Grecki tekst nie rozstrzyga jednoznacznie, do którego wydarzenia odnosi się ta wypowiedź. Przekład zachowuje zamierzoną otwartość i napięcie eschatologiczne.
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Forma „Zapewniam was” oddaje uroczyste ἀμήν bez archaizującego „zaprawdę”. „Nie zdążycie obejść” brzmi naturalnie, lecz jego interpretacyjne dopowiedzenie objaśnia przypis.
