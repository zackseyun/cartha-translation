id: MAT.10.18
reference: Matthew 10:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: pl
  text: Z mojego powodu zostaniecie też postawieni przed namiestnikami i królami, aby dać świadectwo im[a] i narodom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „przeciwko nim”. Grecki celownik nie rozstrzyga tego jednoznacznie.'
    reason: alternative_reading
  - marker: b
    text: 'Lub: „poganom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: przed namiestnikami i królami
  rationale: Przy czasowniku oznaczającym prowadzenie ἐπί z biernikiem wskazuje tu na stawienie przed władzami. „Namiestnicy” trafnie oddają urzędniczo-polityczny sens ἡγεμόνες w realiach Ewangelii Mateusza.
- source_word: ἀχθήσεσθε
  choice: zostaniecie postawieni
  rationale: Przyszła strona bierna od ἄγω oznacza, że uczniowie zostaną doprowadzeni przed władze. Naturalne polskie „zostaniecie postawieni przed” zachowuje kontekst sądowy bez dodawania niewyrażonej wprost przemocy.
- source_word: ἕνεκεν ἐμοῦ
  choice: z mojego powodu
  rationale: 'Wyrażenie wskazuje na przyczynę: związek uczniów z Jezusem będzie powodem postawienia ich przed władzami.'
- source_word: εἰς μαρτύριον
  choice: aby dać świadectwo
  rationale: εἰς może w tym kontekście wyrażać cel lub skutek. Forma czasownikowa brzmi po polsku naturalniej niż „na świadectwo”, zachowując sens świadectwa składanego wobec innych.
- source_word: αὐτοῖς
  choice: im
  rationale: Celownik najnaturalniej odnosi się do wcześniej wymienionych namiestników i królów. Neutralne „im” nie rozstrzyga, czy świadectwo będzie dla nich, czy przeciw nim.
- source_word: τοῖς ἔθνεσιν
  choice: narodom
  rationale: ἔθνη może oznaczać „narody” lub, w kontraście z Izraelem, „pogan”. „Narodom” zachowuje szerokość greckiego określenia; możliwy sens „poganom” podano w przypisie.
theological_decisions:
- issue: Znaczenie μαρτύριον αὐτοῖς
  choice: neutralne „dać świadectwo im”
  alternative: „na świadectwo przeciwko nim”
  rationale: 'Sam celownik αὐτοῖς nie oznacza jednoznacznie świadectwa oskarżającego. Przekład neutralny zachowuje napięcie: świadectwo może być dla słuchaczy wezwaniem, a w razie odrzucenia stać się świadectwem przeciw nim.'
- issue: Zakres τοῖς ἔθνεσιν
  choice: „narodom”
  alternative: „poganom”
  rationale: W Mateuszu termin często odnosi się do ludów nieżydowskich, lecz jego podstawowy zakres leksykalny pozostaje szerszy. Tekst główny nie zawęża go ponad to, co wyraża greka.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Szyk rozpoczynający się od „Z mojego powodu” uwydatnia przyczynę zgodnie z greckim ἕνεκεν ἐμοῦ, a „zostaniecie też postawieni przed” naturalnie oddaje sytuację przymusowego stawienia przed władzami.
