id: MAT.10.38
reference: Matthew 10:38
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: pl
  text: A kto nie bierze swojego krzyża[a] i nie idzie za mną[b], nie jest mnie godny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecka forma ma liczbę pojedynczą i sens ogólny: każdy uczeń ma wziąć własny krzyż.'
    reason: lexical_alternative
  - marker: b
    text: 'Greckie wyrażenie wyraźnie przedstawia podążanie za Jezusem; można też przełożyć: „podąża za mną”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: kto
  rationale: W konstrukcji „a kto…” naturalnie oddaje nieokreślony, ogólny sens greckiego zaimka względnego i zachowuje warunkowy charakter wypowiedzi.
- source_word: λαμβάνει
  choice: bierze
  rationale: W połączeniu z „krzyżem” oznacza podjęcie go i przyjęcie związanych z nim konsekwencji. Polskie „bierze swój krzyż” jest naturalne i nie dopowiada abstrakcyjnej interpretacji.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: swojego krzyża
  rationale: Zaimek zwrotny „swojego” jednoznacznie odnosi krzyż do osoby będącej podmiotem zdania, zachowując sens jednostkowy i ogólny greckiej konstrukcji.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: idzie za mną
  rationale: Zwrot ten naturalnie oddaje zarówno podążanie za Jezusem, jak i wyraźny w ὀπίσω obraz kroczenia za nim.
- source_word: ἄξιος
  choice: godny
  rationale: „Godny” jest bezpośrednim, uroczystym i idiomatycznym odpowiednikiem oceny wyrażonej przez ἄξιος.
- source_word: μου ἄξιος
  choice: mnie godny
  rationale: Konstrukcja „nie jest mnie godny” zachowuje osobowy dopełniacz grecki i jego zwięzłość bez rozwijania sensu w parafrazę.
theological_decisions:
- issue: Obraz wzięcia własnego krzyża w nauczaniu o uczniostwie
  choice: Zachowano konkretny obraz „bierze swojego krzyża”.
  alternative: „przyjmuje cierpienie” lub „wyrzeka się siebie”
  rationale: Tekst posługuje się historycznie i teologicznie nośnym obrazem krzyża. Abstrakcyjna parafraza zawęziłaby jego sens i usunęła napięcie związane z hańbą, cierpieniem oraz kosztowną wiernością.
- issue: Zakres przeczenia w połączonych wymaganiach
  choice: 'W języku polskim powtórzono przeczenie: „nie bierze… i nie idzie”.'
  alternative: „nie bierze… i idzie za mną”
  rationale: Greckie οὐ stoi przed pierwszym z dwóch połączonych orzeczeń, lecz w tym zdaniu wymagania tworzą jedną konstrukcję opisującą uczniostwo. Powtórzenie „nie” jest w polszczyźnie konieczne, by nie wywołać mylnego wrażenia, że druga czynność jest twierdząca.
translation_notes:
  register: Współczesny, zrozumiały i uroczysty rejestr. „Idzie za mną” jest bardziej naturalne po polsku niż mechaniczne „idzie w ślad za mną”, a zarazem zachowuje obraz podążania za Jezusem. Szyk „mnie godny” utrzymuje biblijną powagę bez archaizacji.
