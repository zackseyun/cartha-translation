id: MAT.10.8
reference: Matthew 10:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: pl
  text: Uzdrawiajcie chorych, wskrzeszajcie umarłych[a], oczyszczajcie trędowatych[b], wypędzajcie demony. Darmo otrzymaliście, darmo dawajcie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: W części rękopisów brak słów „wskrzeszajcie umarłych”.
    reason: textual_variant
  - marker: b
    text: Biblijne określenie tradycyjnie tłumaczone jako „trąd” może obejmować różne poważne choroby skóry, nie tylko współcześnie rozumianą chorobę Hansena.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Uzdrawiajcie chorych
  rationale: Imiesłów ἀσθενοῦντας oznacza w tym kontekście ludzi chorych, a θεραπεύετε jest bezpośrednim nakazem uzdrawiania. Polski zwrot jest naturalny i zachowuje zwięzłość oryginału.
- source_word: νεκροὺς ἐγείρετε
  choice: wskrzeszajcie umarłych
  rationale: W zestawieniu z νεκρούς czasownik ἐγείρω oznacza wzbudzanie ze śmierci. „Wskrzeszajcie” wyraża to po polsku jednoznacznie i naturalnie.
- source_word: λεπροὺς καθαρίζετε
  choice: oczyszczajcie trędowatych
  rationale: „Oczyszczajcie” zachowuje zarówno fizyczny, jak i rytualny wymiar καθαρίζω. Tradycyjne „trędowatych” jest zwięzłe, a przypis wyjaśnia szerszy zakres biblijnego określenia choroby skóry.
- source_word: δαιμόνια ἐκβάλλετε
  choice: wypędzajcie demony
  rationale: „Wypędzajcie” wiernie oddaje siłę ἐκβάλλετε w kontekście egzorcyzmu, a „demony” jest bezpośrednim odpowiednikiem δαιμόνια.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Darmo otrzymaliście, darmo dawajcie
  rationale: 'Powtórzenie „darmo” zachowuje paralelizm i nacisk greckiego δωρεάν: bez opłaty, jako dar. Forma „otrzymaliście” odpowiada aorystowi, a „dawajcie” — imperatywowi.'
theological_decisions:
- issue: Zakres nakazów dotyczących cudów
  choice: Oddać wszystkie czasowniki jako bezpośrednie nakazy skierowane do Dwunastu w ramach tej mowy misyjnej.
  alternative: Rozumieć niektóre działania metaforycznie albo wyłącznie jako późniejsze praktyki kościelne.
  rationale: Grecki tekst zawiera konkretne imperatywy liczby mnogiej. Przekład nie rozstrzyga o ich zastosowaniu poza historycznym kontekstem wypowiedzi.
- issue: Wariant tekstowy dotyczący wskrzeszania umarłych
  choice: Zachować słowa „wskrzeszajcie umarłych” w tekście głównym i zaznaczyć wariant w przypisie.
  alternative: Pominąć te słowa zgodnie z częścią tradycji rękopiśmiennej.
  rationale: SBLGNT przyjmuje tę frazę do tekstu, oznaczając ją jako miejsce wariantowe; przypis zachowuje przejrzystość tekstualną bez usuwania przyjętego brzmienia.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Seria czterech imperatywów zachowuje rytm greckiego wyliczenia, a paralelne „darmo… darmo…” odtwarza retoryczną równowagę zakończenia.
