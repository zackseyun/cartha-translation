id: MAT.10.20
reference: Matthew 10:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: pl
  text: Bo nie wy jesteście tymi, którzy mówią, lecz Duch waszego Ojca mówi w was.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „przez was”. Grecki tekst dosłownie mówi „w was”, co w tym kontekście może również wskazywać na mowę wyrażaną za pośrednictwem uczniów.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Bo nie
  rationale: γάρ wyjaśnia wcześniejszą obietnicę, a „Bo” naturalnie zachowuje ten związek w języku polskim.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: wy jesteście tymi, którzy mówią
  rationale: Jawny zaimek ὑμεῖς oraz konstrukcja z imiesłowem podkreślają, kto rzeczywiście mówi; ta forma zachowuje nacisk oryginału.
- source_word: ἀλλὰ
  choice: lecz
  rationale: Wyraża mocne przeciwstawienie, a zarazem odpowiada godnemu, współczesnemu rejestrowi.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Duch waszego Ojca
  rationale: W kontekście chodzi o Bożego Ducha; „waszego Ojca” ściśle oddaje tekst bez dodawania określenia „niebieskiego”.
- source_word: τὸ λαλοῦν
  choice: mówi
  rationale: Imiesłów czasu teraźniejszego odnosi się do Ducha; polskie zdanie osobowe jest naturalniejsze i jednoznacznie zachowuje jego odniesienie.
- source_word: ἐν ὑμῖν
  choice: w was
  rationale: Najbardziej bezpośredni odpowiednik ἐν zachowuje obraz i nie rozstrzyga, czy nacisk pada na obecność Ducha, czy na działanie za pośrednictwem uczniów.
theological_decisions:
- issue: Czy ἐν ὑμῖν oddać jako obecność „w was”, czy jako sprawcze działanie „przez was”
  choice: w was
  alternative: przez was
  rationale: Podstawowym znaczeniem ἐν jest „w”. Kontekst wypowiedzi uczniów może sugerować działanie przez nich, ale przekład główny nie powinien usuwać autentycznej wieloznaczności.
translation_notes:
  register: Współczesna, godna polszczyzna. Konstrukcja „nie wy jesteście tymi, którzy mówią” zachowuje nacisk obecny w grece, choć jest nieco bardziej formalna niż potoczne „to nie wy mówicie”.
