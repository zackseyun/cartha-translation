review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the indefinite destination, the instruction to identify a person who is ἄξιος, and the temporal limit on remaining. However, „u niego” adds a masculine singular host and narrows κἀκεῖ („and there”), while „wyruszycie dalej” adds the idea of onward travel not stated by ἐξέλθητε.
  naturalness: The Polish is generally clear and modern. „Gdy wejdziecie do jakiegokolwiek miasta lub wsi” is more idiomatic than the fronted relative construction, and „pozostańcie tam, aż stamtąd odejdziecie” is natural without interpretive expansion.
  terminology: „Godny” is an appropriate equivalent for ἄξιος and preserves its evaluative openness. The explanatory note properly frames a likely contextual sense without making a doctrinal claim.
  issues:
  - severity: medium
    issue: „u niego” specifies a male individual host.
    rationale: κἀκεῖ means „and there”; it does not explicitly say „with him” or specify a host’s gender. The contextual inference should not be placed in the main text.
  - severity: medium
    issue: „dopóki nie wyruszycie dalej” expands the departure clause.
    rationale: ἐξέλθητε means „you leave/go out.” Although onward travel is contextually plausible, „dalej” is not expressed and reduces the source wording’s restraint.
  revised_text: Gdy wejdziecie do jakiegokolwiek miasta lub wsi, dowiedzcie się, kto w tej miejscowości jest godny[a], i pozostańcie tam, aż stamtąd odejdziecie[b].
