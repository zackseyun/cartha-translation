source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: pl
  text: Gdy wejdziecie do jakiegokolwiek miasta lub wsi, dowiedzcie się, kto w tej miejscowości jest godny[a], i pozostańcie tam, aż stamtąd odejdziecie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'W tym kontekście „godny” może znaczyć: odpowiedni lub gotowy przyjąć wysłanników; nie musi oznaczać kogoś, kto zasłużył na Bożą przychylność.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „aż wyjdziecie”; chodzi o opuszczenie tej miejscowości.'
    reason: translation_clarity
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Do jakiegokolwiek miasta lub wsi wejdziecie
  rationale: Polska konstrukcja zachowuje kierunkowy sens εἰς oraz nieokreśloność zdania względnego z ἄν, a zarazem brzmi naturalnie jako ogólna instrukcja.
- source_word: ἐξετάσατε
  choice: dowiedzcie się
  rationale: Czasownik nakazuje przeprowadzić rozeznanie lub zasięgnąć informacji. „Dowiedzcie się” jest jasne i współczesne, choć nie eksponuje w pełni staranności badania.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: kto w tej miejscowości jest godny
  rationale: „W tej miejscowości” naturalnie odsyła zarówno do miasta, jak i wsi. „Godny” zachowuje oceniający charakter ἄξιος i jego możliwą wieloznaczność.
- source_word: κἀκεῖ μείνατε
  choice: i zatrzymajcie się u niego
  rationale: W kontekście przyjmowania wysłanników greckie „tam pozostańcie” odnosi się do miejsca związanego ze wskazaną osobą. Polska forma „u niego” jasno oddaje zamieszkanie u gospodarza bez określania rodzaju domu.
- source_word: ἕως ἂν ἐξέλθητε
  choice: dopóki nie wyruszycie dalej
  rationale: Wyrażenie wskazuje na pozostanie aż do opuszczenia danej miejscowości. „Wyruszycie dalej” jest naturalne w kontekście wędrownej misji i unika niejasnego polskiego „wyjdziecie”.
theological_decisions:
- issue: Znaczenie określenia „godny” w instrukcji misyjnej
  choice: Zachować w tekście słowo „godny”, a w przypisie wskazać jego kontekstowe znaczenie jako odpowiedniości lub gotowości do przyjęcia wysłanników.
  alternative: Przełożyć bezpośrednio jako „odpowiedni” albo „gotowy was przyjąć”.
  rationale: Greckie ἄξιος ma wydźwięk oceniający, którego nie należy usuwać. Kontekst sugeruje odpowiedniego gospodarza, ale sam werset nie definiuje jednoznacznie podstaw tej „godności”, dlatego przypis objaśnia bez dogmatycznego rozstrzygania.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano tradycyjne, lecz nadal zrozumiałe słowo „godny”, a potencjalnie niezręczne dosłowne sformułowania oddano naturalną polszczyzną. Wszystkie znaczące dopowiedzenia objaśniono w przypisach.
