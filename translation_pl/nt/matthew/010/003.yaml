  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: pl
  text: Filip i Bartłomiej, Tomasz i Mateusz, poborca podatków, Jakub, syn Alfeusza, i Tadeusz[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy mają tu „Lebbeusz” albo „Lebbeusz zwany Tadeuszem”, natomiast w odpowiadającym miejscu na listach apostołów u Łukasza występuje „Juda, syn Jakuba”.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Filip
  rationale: Utrwalona polska forma imienia występującego w Nowym Testamencie.
- source_word: Βαρθολομαῖος
  choice: Bartłomiej
  rationale: Utrwalona polska forma tego imienia.
- source_word: Θωμᾶς
  choice: Tomasz
  rationale: Utrwalona polska forma tego imienia.
- source_word: Μαθθαῖος
  choice: Mateusz
  rationale: Utrwalona polska forma tego imienia.
- source_word: ὁ τελώνης
  choice: poborca podatków
  rationale: Naturalne i współczesne określenie osoby pobierającej podatki lub opłaty; unika archaicznego „celnik”, które we współczesnej polszczyźnie może sugerować przede wszystkim funkcjonariusza służby celnej.
- source_word: Ἰάκωβος
  choice: Jakub
  rationale: Utrwalona polska forma greckiego imienia Ἰάκωβος.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: syn Alfeusza
  rationale: Grecka konstrukcja z rodzajnikiem i dopełniaczem wskazuje tu na pochodzenie od ojca; jawne „syn” brzmi jasno i naturalnie po polsku.
- source_word: Ἁλφαίου
  choice: Alfeusz
  rationale: Utrwalona polska forma imienia, odmieniona w tekście jako „Alfeusza”.
- source_word: Θαδδαῖος
  choice: Tadeusz
  rationale: Utrwalona polska forma imienia odpowiadająca odczytowi Θαδδαῖος w SBLGNT; odmienne tradycje rękopiśmienne zachowano w przypisie.
- source_word: καὶ
  choice: i
  rationale: Prosty spójnik współrzędny zachowuje parataktyczną budowę greckiej listy.
theological_decisions:
- issue: Tożsamość ostatniego apostoła w tym wersecie
  choice: Tadeusz
  alternative: Lebbeusz; „Lebbeusz zwany Tadeuszem”; Juda, syn Jakuba, w odpowiadającym miejscu list Łukasza
  rationale: Tekst bazowy SBLGNT ma Θαδδαῖος, dlatego tekst główny podaje „Tadeusz”. Inne świadectwa nie są harmonizowane z tekstem głównym, lecz odnotowane dla przejrzystości.
translation_notes:
  register: Współczesna, godna i łatwo zrozumiała polszczyzna. Zachowano prosty rytm wyliczenia oraz tradycyjne polskie formy imion. Przecinki wokół dopowiedzeń „poborca podatków” i „syn Alfeusza” ułatwiają poprawne rozpoznanie osób.
