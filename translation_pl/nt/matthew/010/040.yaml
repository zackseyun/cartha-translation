id: MAT.10.40
reference: Matthew 10:40
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: pl
  text: Kto przyjmuje was, przyjmuje mnie[a], a kto przyjmuje mnie, przyjmuje Tego, który mnie posłał.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wita” albo „uznaje”; grecki czasownik może oznaczać przyjęcie, zaakceptowanie lub powitanie kogoś, zwłaszcza posłańca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Kto przyjmuje
  rationale: Rodzajnik z imiesłowem czasu teraźniejszego pełni funkcję rzeczownikową i ma sens ogólny. Konstrukcja „kto przyjmuje” jest naturalna we współczesnej polszczyźnie i zachowuje uniwersalny charakter wypowiedzi.
- source_word: δέχομαι / δέχεται
  choice: przyjmuje
  rationale: 'Powtórzenie tego samego czasownika zachowuje zamierzony łańcuch utożsamienia: przyjęcie uczniów oznacza przyjęcie Jezusa, a przyjęcie Jezusa — przyjęcie Posyłającego. „Przyjmuje” obejmuje zarówno ugoszczenie, jak i uznanie czy zaakceptowanie posłańca.'
- source_word: ὑμᾶς
  choice: was
  rationale: Zaimek w drugiej osobie liczby mnogiej odnosi się do uczniów Jezusa; polskie „was” jednoznacznie zachowuje liczbę mnogą.
- source_word: ἐμέ
  choice: mnie
  rationale: Bezpośredni odpowiednik zaimka w pierwszej osobie liczby pojedynczej, odnoszącego się do Jezusa.
- source_word: τὸν ἀποστείλαντά με
  choice: Tego, który mnie posłał
  rationale: Imiesłów aorystu z rodzajnikiem ma funkcję rzeczownikową. To sformułowanie jest naturalne, osobowe i nie dopowiada w tekście głównym tożsamości Posyłającego ponad brzmienie greki.
theological_decisions:
- issue: Tożsamość Tego, który posłał Jezusa
  choice: Tego, który mnie posłał
  alternative: Ojca, który mnie posłał
  rationale: Kontekst i teologia Mateusza wskazują na Ojca, lecz tekst grecki nie wymienia Go wprost. Przekład zachowuje niedopowiedziane sformułowanie oryginału, nie usuwając jego oczywistej implikacji.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Powtórzenie „przyjmuje” celowo odtwarza retoryczną strukturę greckiego zdania. Wielka litera w „Tego” sygnalizuje osobowe odniesienie do Boga zgodnie z utrwalonym polskim zwyczajem, nie dodając tytułu „Ojciec”.
