  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: pl
  text: 'A idąc, głoście[a]: „Przybliżyło się[b] królestwo niebios”[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „głoście, mówiąc”.'
    reason: previous_rendering
  - marker: b
    text: 'Możliwe również: „jest już blisko”. Grecka forma perfectum podkreśla bliskość, która już nastała i pozostaje aktualna.'
    reason: lexical_alternative
  - marker: c
    text: Mateusz regularnie używa określenia „królestwo niebios”, podczas gdy pozostałe Ewangelie często mówią „królestwo Boga”.
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: idąc
  rationale: Imiesłów czasu teraźniejszego wyraża czynność towarzyszącą nakazowi; polskie „idąc” zachowuje zwięzłość i zależność składniową tekstu greckiego.
- source_word: δὲ
  choice: A
  rationale: Łagodny spójnik łączący ten nakaz z poprzednimi wskazaniami; „A” zachowuje ciąg wypowiedzi bez nadawania mu mocnego sensu przeciwstawnego.
- source_word: κηρύσσετε
  choice: głoście
  rationale: Tryb rozkazujący oznacza publiczne, autorytatywne obwieszczanie. „Głoście” jest naturalne, podniosłe i nie ogranicza czynności do kazania kościelnego.
- source_word: λέγοντες
  choice: dwukropek wprowadzający treść obwieszczenia
  rationale: Imiesłów określa treść głoszenia. W naturalnej polszczyźnie dwukropek przekazuje tę funkcję bez niezręcznego powtórzenia „głoście, mówiąc”; dosłowną konstrukcję podano w przypisie.
- source_word: ὅτι
  choice: bez osobnego odpowiednika; mowa bezpośrednia
  rationale: Spójnik wprowadza treść wypowiedzi. Polski cytat po dwukropku naturalnie oddaje jego funkcję.
- source_word: Ἤγγικεν
  choice: przybliżyło się
  rationale: Grecki perfectum wskazuje na bliskość, która już zaistniała i pozostaje aktualna. Tradycyjne, lecz nadal zrozumiałe „przybliżyło się” zachowuje zarówno ruch ku bliskości, jak i wynikowy aspekt formy.
- source_word: ἡ βασιλεία
  choice: królestwo
  rationale: „Królestwo” może obejmować zarówno królewskie panowanie, jak i jego sferę; nie zawęża wieloznaczności rzeczownika do samego „panowania”.
- source_word: τῶν οὐρανῶν
  choice: niebios
  rationale: Liczba mnoga odpowiada greckiemu wyrażeniu i zachowuje charakterystyczne dla Mateusza sformułowanie bez harmonizowania go do „królestwa Boga”.
theological_decisions:
- issue: Znaczenie wyrażenia „królestwo niebios”
  choice: Zachowano „królestwo niebios”.
  alternative: królowanie niebios; królestwo Boga
  rationale: Przekład zachowuje charakterystyczne słownictwo Mateusza oraz semantyczną pojemność „królestwa”, nie utożsamiając go wyłącznie ze sferą ani wyłącznie z aktem panowania.
- issue: Aspekt czasownika ἤγγικεν
  choice: „przybliżyło się” — forma wynikowa, wskazująca na osiągniętą i nadal aktualną bliskość
  alternative: jest blisko; nadeszło
  rationale: Takie brzmienie zachowuje napięcie obecne w greckim perfectum i nie rozstrzyga ponad tekst szerszej kwestii sposobu urzeczywistnienia królestwa.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Konstrukcję λέγοντες oddano naturalnym polskim dwukropkiem, a charakterystyczne dla Mateusza „królestwo niebios” pozostawiono bez harmonizacji.
