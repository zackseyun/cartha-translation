  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: pl
  text: Nie bójcie się więc; jesteście cenniejsi niż wiele wróbli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Nie bójcie się więc
  rationale: Przeczenie μή z trybem rozkazującym φοβεῖσθε wyraża zakaz, a οὖν wskazuje na wniosek wynikający z wcześniejszych słów o trosce Ojca. Taki szyk jest naturalny we współczesnej polszczyźnie i zachowuje związek logiczny.
- source_word: πολλῶν στρουθίων
  choice: niż wiele wróbli
  rationale: W bezpośrednim kontekście στρουθίον oznacza wróbla, a dopełniacz po διαφέρετε ma sens porównawczy.
- source_word: διαφέρετε
  choice: jesteście cenniejsi
  rationale: W tym kontekście czasownik oznacza przewyższanie pod względem wartości lub znaczenia, a nie jedynie odmienność. „Jesteście cenniejsi” zwięźle i naturalnie oddaje porównanie.
- source_word: ὑμεῖς
  choice: jesteście
  rationale: Wyraźny zaimek podkreśla adresatów w zestawieniu z wróblami. W języku polskim nacisk ten wystarczająco wynika z osobowej formy czasownika i kontrastu zdania; dodanie „wy” byłoby możliwe, lecz niekonieczne.
theological_decisions:
- issue: Względna wartość uczniów i wróbli w nauczaniu Jezusa
  choice: jesteście cenniejsi niż wiele wróbli
  alternative: znaczycie więcej niż wiele wróbli
  rationale: Przekład zachowuje porównawczą wymowę διαφέρετε i wskazuje na szczególną troskę Boga o uczniów, nie sugerując przy tym, że Bóg nie troszczy się o zwierzęta.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zdanie zachowuje zwięzłość oraz uspokajający, wnioskujący ton oryginału.
