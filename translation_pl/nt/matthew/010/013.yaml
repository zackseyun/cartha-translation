id: MAT.10.13
reference: Matthew 10:13
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: pl
  text: A jeśli dom[a] jest godny[b], niech wasz pokój zstąpi na niego; jeśli zaś nie jest godny, niech wasz pokój powróci do was[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „domostwo” albo „domownicy”. Greckie słowo oznaczające „dom” może w tym kontekście odnosić się również do mieszkających w nim ludzi.'
    reason: lexical_alternative
  - marker: b
    text: „Godny” znaczy tutaj odpowiedni, by przyjąć posłańców i ich pokój, a nie moralnie bezgrzeszny.
    reason: cultural_note
  - marker: c
    text: 'Lub: „niech wasz pokój zawróci do was”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: dom
  rationale: To najbardziej bezpośredni polski odpowiednik. W tym kontekście słowo może obejmować także domowników, ale tekst nazywa sam dom.
- source_word: ἀξία
  choice: godny
  rationale: Zachowuje oceniający sens greckiego przymiotnika, nie zawężając go do samej otwartości lub życzliwości.
- source_word: ἐλθάτω ... ἐπ’ αὐτήν
  choice: niech ... zstąpi na niego
  rationale: Naturalny, podniosły polski zwrot zachowujący kierunkowy obraz pokoju przychodzącego na dom oraz rozkazującą formę wypowiedzi.
- source_word: εἰρήνη ὑμῶν
  choice: wasz pokój
  rationale: Dosłowne sformułowanie zachowuje zarówno sens pokoju, jak i szersze tło wypowiadanego błogosławieństwa, bez zastępowania go interpretacją.
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: niech ... powróci do was
  rationale: Oddaje kierunek ku uczniom i sens powrotu pokoju, który nie pozostaje w niegodnym domu.
- source_word: μὲν ... δὲ
  choice: jeśli ...; jeśli zaś ...
  rationale: Naturalnie odtwarza kontrast dwóch warunkowych członów bez ciężkiej, nadmiernie dosłownej konstrukcji.
theological_decisions:
- issue: Natura wyrażenia „wasz pokój”
  choice: Zachowano obraz pokoju uczniów, który może zstąpić na dom albo do nich powrócić.
  alternative: „wasze pozdrowienie pokoju” lub „wypowiedziane przez was błogosławieństwo pokoju”
  rationale: Tekst ukazuje pokój w sposób konkretny, niemal jak coś, co może przyjść i powrócić, lecz nie wyjaśnia mechanizmu tego działania. Przekład nie sprowadza go ani do zwykłego pozdrowienia, ani do określonej doktryny o udzielaniu duchowej mocy.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, lekko podniosłym rytmie. Zachowano paralelizm obu zdań warunkowych oraz obraz pokoju zstępującego na dom i powracającego do uczniów.
