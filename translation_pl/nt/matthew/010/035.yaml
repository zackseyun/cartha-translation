  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: pl
  text: Bo przyszedłem poróżnić człowieka z jego ojcem[a], córkę z jej matką i synową z jej teściową[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „podzielić”. Grecki bezokolicznik oznacza „podzielić, wywołać rozłam”, a powtarzające się wyrażenia „przeciw” wskazują tutaj na konflikt między bliskimi.'
    reason: lexical_alternative
  - marker: b
    text: Greckie νύμφη może w niektórych kontekstach oznaczać „pannę młodą”; tutaj znaczy „synowa”, ponieważ występuje w parze z „teściową”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: przyszedłem
  rationale: Aoryst czasownika ἔρχομαι odnosi się tutaj do przyjścia i misji Jezusa; polski czas przeszły oddaje to naturalnie i bez dopowiadania.
- source_word: γὰρ
  choice: bo
  rationale: Spójnik wprowadza uzasadnienie wcześniejszej wypowiedzi; „bo” jasno zachowuje jego funkcję wyjaśniającą.
- source_word: διχάσαι
  choice: poróżnić
  rationale: Czasownik oznacza podzielić lub spowodować rozłam. W połączeniu z kolejnymi wyrażeniami κατά + dopełniacz wskazuje tu na konflikt między osobami; „poróżnić” naturalnie oddaje ten relacyjny wymiar.
- source_word: ἄνθρωπον
  choice: człowieka
  rationale: Ἄνθρωπος może oznaczać człowieka lub mężczyznę. „Człowieka” najbliżej zachowuje zakres greckiego rzeczownika, a wzmianka o jego ojcu pozostaje jednoznaczna.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: z jego ojcem
  rationale: Przy czasowniku „poróżnić” polska konstrukcja „kogoś z kimś” idiomatycznie oddaje opozycję wyrażoną przez κατά z dopełniaczem.
- source_word: θυγατέρα κατὰ τῆς μητρὸς αὐτῆς
  choice: córkę z jej matką
  rationale: Bezpośredni i naturalny odpowiednik, zachowujący równoległą budowę rodzinnych przeciwstawień.
- source_word: νύμφην
  choice: synową
  rationale: Νύμφη może znaczyć „panna młoda”, lecz zestawienie z πενθερά, czyli teściową, wskazuje tutaj na synową.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: z jej teściową
  rationale: Naturalna polska terminologia pokrewieństwa oraz równoległa konstrukcja z czasownikiem „poróżnić” oddają greckie przeciwstawienie.
theological_decisions:
- issue: Charakter celu przyjścia Jezusa wyrażonego w tym zdaniu
  choice: Zachować mocne stwierdzenie, że przyjście Jezusa powoduje rozłam i konflikt nawet w rodzinie, bez dodatkowego objaśniania motywów w tekście głównym.
  alternative: Parafrazować wypowiedź jako opis prześladowania wynikającego z opowiedzenia się za Jezusem albo osłabić ją do ogólnej różnicy zdań.
  rationale: Grecki tekst przedstawia podział jako skutek związany z przyjściem Jezusa i wyraźnie wymienia przeciwstawione sobie osoby. Przekład powinien zachować teologiczną ostrość i napięcie tej wypowiedzi, nie sugerując zarazem przez dopowiedzenia, że wrogość rodzinna jest dobrem samym w sobie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Poróżnić” pozwala zachować zwięzłość oraz równoległą budowę trzech par rodzinnych, a zarazem wyraża konflikt mocniej niż neutralne „podzielić”. Zaimki „jego” i „jej” zachowano dla przejrzystości i zgodności z tekstem greckim.
