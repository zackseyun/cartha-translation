  text: As you enter the house[a], greet it.
translation:
  language: pl
  text: A gdy wejdziecie do domu[a], pozdrówcie go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „pozdrówcie go”, to jest dom; zapewne metonimicznie chodzi o jego mieszkańców. Możliwe też: „pozdrówcie domowników”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: wchodząc
  rationale: Imiesłów czasu teraźniejszego w liczbie mnogiej pełni funkcję okolicznikową i wskazuje czynność towarzyszącą nakazowi; polski imiesłów zachowuje zwięzłość oraz współczesność obu czynności.
- source_word: δὲ
  choice: A
  rationale: Łagodny spójnik kontynuujący wypowiedź; „A” naturalnie łączy ten nakaz z poprzednim kontekstem, bez nadawania mu silnego znaczenia przeciwstawnego.
- source_word: οἰκίαν
  choice: domu
  rationale: Rzeczownik może oznaczać budynek albo domowników. Kontekst wejścia przemawia za konkretnym „domem”, pozostawiając możliwe użycie metonimiczne.
- source_word: ἀσπάσασθε
  choice: pozdrówcie
  rationale: Aorystyczny tryb rozkazujący w drugiej osobie liczby mnogiej wyraża bezpośredni nakaz. „Pozdrówcie” jest naturalnym, współczesnym odpowiednikiem.
- source_word: αὐτήν
  choice: go
  rationale: Zaimek odnosi się gramatycznie do οἰκίαν. W języku polskim „dom” ma rodzaj męski, dlatego wymaga formy „go”; zachowano odniesienie do domu, nie zastępując go interpretacyjnym „ich”.
theological_decisions:
- issue: Metonimiczne pozdrowienie domu a wyraźne odniesienie do jego mieszkańców
  choice: W tekście głównym zachowano „pozdrówcie go”, odnoszące się do domu.
  alternative: „pozdrówcie domowników” lub „pozdrówcie tych, którzy w nim mieszkają”
  rationale: Grecki zaimek αὐτήν odnosi się bezpośrednio do οἰκίαν. Zachowanie tego odniesienia respektuje sformułowanie źródłowe i nie rozstrzyga w tekście głównym prawdopodobnej metonimii; sens społeczny objaśnia przypis.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Konstrukcja „A wchodząc” zachowuje łagodne powiązanie z kontekstem, a „pozdrówcie go” celowo oddaje grecką metonimię, mimo że po polsku brzmi nieco nietypowo.
