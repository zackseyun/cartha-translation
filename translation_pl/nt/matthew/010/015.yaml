id: MAT.10.15
reference: Matthew 10:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: pl
  text: 'Zapewniam was[a]: ziemi Sodomy i Gomory[b] będzie lżej[c] w dniu sądu niż temu miastu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Amen, mówię wam”; tradycyjnie: „Zaprawdę mówię wam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać sens krócej: „Sodomie i Gomorze”. Greka dosłownie mówi o „ziemi Sodomy i Gomory”.'
    reason: lexical_alternative
  - marker: c
    text: 'Albo: „znośniej”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zapewniam was
  rationale: Oddaje uroczystą formułę zapewnienia w naturalnej, współczesnej polszczyźnie. Dosłowne „Amen, mówię wam” brzmi po polsku obco, a tradycyjne „Zaprawdę mówię wam” ma dziś odcień archaiczny.
- source_word: ἀνεκτότερον
  choice: będzie lżej
  rationale: Naturalny polski odpowiednik stopnia wyższego oznaczającego, że coś będzie łatwiejsze do zniesienia; zachowuje porównanie między losem obu miejsc na sądzie.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: ziemi Sodomy i Gomory
  rationale: Zachowuje obecny w grece rzeczownik γῇ („ziemi, krainie”) oraz zależne od niego nazwy miejscowe w dopełniaczu.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: w dniu sądu
  rationale: Bliski i naturalny przekład greckiego wyrażenia, bez rozbudowywania obrazu sądu ponad to, co mówi tekst.
- source_word: τῇ πόλει ἐκείνῃ
  choice: temu miastu
  rationale: Polskie „miasto” naturalnie obejmuje miejscowość określoną greckim πόλις, a zaimek „temu” odsyła do miasta odrzucającego posłańców.
theological_decisions:
- issue: Charakter „dnia sądu”
  choice: Pozostawiono określenie „w dniu sądu” jako odniesienie do przyszłego Bożego sądu.
  alternative: Rozumienie wyrażenia jako ogólniejszego czasu lub wydarzenia osądu.
  rationale: Kontekst i sformułowanie wskazują na uroczysty przyszły sąd, lecz przekład nie dodaje szczegółowego schematu eschatologicznego.
- issue: Stopniowanie surowości sądu
  choice: 'Zachowano porównanie: ziemi Sodomy i Gomory „będzie lżej” niż wskazanemu miastu.'
  alternative: Parafraza mówiąca jedynie, że odrzucające miasto zostanie surowo osądzone.
  rationale: Stopień wyższy ἀνεκτότερον wyraźnie zestawia względną surowość losu na sądzie; nie należy usuwać wynikającego z tekstu napięcia.
translation_notes:
  register: Współczesny, uroczysty i przystępny rejestr. „Zapewniam was” unika archaicznego „zaprawdę”, zachowując stanowczy charakter wypowiedzi. Składnia „ziemi… będzie lżej” jest naturalna po polsku i pozostaje bliska greckiej konstrukcji celownikowej.
