    issue: Niezręczna konstrukcja „zdobywajcie … do swoich pasów”.
    rationale: Może być odczytana jako zdobywanie metali na potrzeby pasów, zamiast jako zaopatrywanie się w pieniądze wkładane do pasa. Dodanie „sobie” oraz usunięcie zbędnego „swoich” lepiej oddaje relację wyrażoną w grece i współczeszną polską składnię.
