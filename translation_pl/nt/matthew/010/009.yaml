review_pass:
  verdict: revise
  source_fidelity: Greckie μὴ κτήσησθε oznacza zakaz nabywania/zaopatrywania się, a nie wyłącznie noszenia. „Nie zdobywajcie” zasadniczo to oddaje, lecz dodanie „sobie” lepiej uwidacznia stronę medialną czasownika. Wyliczenie złota, srebra i miedzi oraz obraz wkładania ich do pasów są zachowane.
  naturalness: Zwrot „do swoich pasów” po „zdobywajcie” jest w polszczyźnie nieco niezręczny i może sugerować pozyskiwanie materiału przeznaczonego na pasy. „Nie zdobywajcie sobie … do pasów” jest naturalniejsze, a nadal zachowuje dosłowny obraz tekstu.
  terminology: „Miedź” jest trafnym podstawowym odpowiednikiem χαλκός w tym kontekście monetarnym; „brąz” należy zachować jako alternatywę przypisową. „Pasy” właściwie oddaje ζῶναι, a przypis słusznie objaśnia ich funkcję jako miejsca noszenia pieniędzy.
  issues:
