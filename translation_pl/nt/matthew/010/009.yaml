  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: pl
  text: Nie zdobywajcie sobie złota, srebra ani miedzi do pasów[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pasy służyły również do przechowywania i noszenia pieniędzy.
    reason: cultural_note
  - marker: b
    text: 'Lub: „brązu” zamiast „miedzi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Nie zdobywajcie
  rationale: κτάομαι znaczy „nabyć, zdobyć, pozyskać”. Przekład zachowuje sens zakazu zaopatrywania się w pieniądze, zamiast sprowadzać go jedynie do ich noszenia.
- source_word: χρυσὸν
  choice: złota
  rationale: Naturalny odpowiednik nazwy kruszcu; w tym kontekście chodzi o pieniądze w złocie.
- source_word: ἄργυρον
  choice: srebra
  rationale: Naturalny odpowiednik nazwy kruszcu; w kontekście może oznaczać srebrne pieniądze.
- source_word: χαλκὸν
  choice: miedzi
  rationale: χαλκός może oznaczać miedź lub brąz. W szeregu kruszców używanych jako pieniądze „miedź” jest naturalnym określeniem monet o niższej wartości; wariant „brąz” podano w przypisie.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: do swoich pasów
  rationale: ζώνη oznacza pas lub przepaskę, w których można było przechowywać pieniądze. „Do swoich pasów” zachowuje obraz oryginału bez wpisywania objaśnienia kulturowego w tekst główny.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i bezpośredni język. Zachowano dosłowny obraz metali wkładanych do pasów, a jego kulturowe znaczenie wyjaśniono w przypisie.
