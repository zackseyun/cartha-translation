  naturalness: Składnia jest naturalna, zwięzła i zachowuje paralelizm. „Człowiek sprawiedliwy” jest bardziej ustalonym i rozpoznawalnym współczesnym odpowiednikiem rzeczownikowo użytego δίκαιος w rejestrze biblijnym niż „człowiek prawy”.
