id: MAT.10.41
reference: Matthew 10:41
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: pl
  text: Kto przyjmuje proroka w imię proroka[a], otrzyma nagrodę proroka; a kto przyjmuje człowieka sprawiedliwego w imię człowieka sprawiedliwego[b], otrzyma nagrodę człowieka sprawiedliwego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „dlatego że jest prorokiem” albo „jako proroka”. Dosłownie: „w imię proroka”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „dlatego że jest człowiekiem sprawiedliwym” albo „jako człowieka sprawiedliwego”. Dosłownie: „w imię człowieka sprawiedliwego”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: kto przyjmuje
  rationale: Rzeczownikowo użyty imiesłów z rodzajnikiem wyraża ogólną zasadę. Polskie „kto przyjmuje” brzmi naturalniej niż strukturalne „ten, kto przyjmuje”, nie tracąc sensu.
- source_word: προφήτην
  choice: proroka
  rationale: Standardowy i bezpośredni odpowiednik biernika, zachowujący określenie rozpoznawalnej roli.
- source_word: εἰς ὄνομα προφήτου
  choice: w imię proroka
  rationale: Zachowuje powtórzoną formę greckiego idiomu i jego możliwe powiązania z innymi zwrotami o imieniu; sens „dlatego, że jest prorokiem” lub „jako proroka” objaśnia przypis.
- source_word: μισθὸν προφήτου
  choice: zapłatę proroka
  rationale: '„Zapłata” naturalnie oddaje μισθός w tym kontekście i zachowuje niejednoznaczność dopełniacza: może chodzić o zapłatę należną prorokowi lub związaną z przyjęciem proroka.'
- source_word: λήμψεται
  choice: otrzyma
  rationale: Prosty czas przyszły trafnie oddaje grecką formę przyszłą; „otrzyma” zachowuje godny rejestr.
- source_word: δίκαιον
  choice: człowieka prawego
  rationale: Przymiotnik jest użyty rzeczownikowo w rodzaju męskim. Dodanie „człowieka” daje naturalne, zrozumiałe brzmienie i zachowuje męską formę źródła.
- source_word: εἰς ὄνομα δικαίου
  choice: w imię człowieka prawego
  rationale: Odtwarza paralelizm pierwszej części oraz dosłowny idiom; możliwy sens przyczynowy lub uznaniowy podaje przypis.
- source_word: μισθὸν δικαίου
  choice: zapłatę człowieka prawego
  rationale: Zachowuje ścisły paralelizm z „zapłatą proroka” i nie rozstrzyga funkcji dopełniacza.
theological_decisions:
- issue: Znaczenie idiomu εἰς ὄνομα + dopełniacz
  choice: Zachować w tekście „w imię”, a sens „dlatego, że nim jest” lub „jako takiego” podać w przypisach.
  alternative: 'Przełożyć wprost: „dlatego, że jest prorokiem/człowiekiem prawym” albo „jako proroka/człowieka prawego”.'
  rationale: Zwrot wskazuje na przyjęcie kogoś ze względu na rozpoznaną tożsamość lub rolę. Dosłowniejszy przekład zachowuje powtórzenie i teologiczną nośność wyrażenia, a przypisy zapobiegają niezrozumieniu idiomu.
- issue: Rodzaj gramatyczny δίκαιον / δικαίου
  choice: „człowiek prawy”
  alternative: „osoba prawa” lub rzeczownikowe „sprawiedliwy”
  rationale: Greka ma męską liczbę pojedynczą. Wyrażenie „człowiek prawy” jest współczesne i przejrzyste, nie przesądzając, że ogólna zasada wyklucza kobiety.
- issue: Zakres znaczeniowy μισθός i dopełniaczy προφήτου / δικαίου
  choice: „zapłata proroka / człowieka prawego”
  alternative: „nagroda proroka / człowieka prawego”
  rationale: „Zapłata” zachowuje podstawowy sens μισθός oraz napięcie między wynagrodzeniem a nagrodą. Konstrukcja dopełniaczowa nie rozstrzyga, czy jest to zapłata otrzymywana przez proroka/prawego, czy zapłata należna za ich przyjęcie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano retoryczny paralelizm obu członów oraz autentyczną niejednoznaczność greckich dopełniaczy. Markery przypisów umieszczono bezpośrednio po objaśnianych idiomach.
