base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: pl
  text: A jeśli ktoś was nie przyjmie ani nie wysłucha waszych słów[a], wychodząc z tego domu albo z tego miasta[b], strząśnijcie pył ze swoich stóp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „ani nie usłyszy waszych słów”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „z tego domu albo z tej miejscowości”.'
    reason: lexical_alternative
  - marker: c
    text: Strząśnięcie pyłu ze stóp było symbolicznym gestem odcięcia się od tych, którzy odrzucili przyniesione im orędzie, oraz znakiem sądu.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: jeśli ktoś… nie
  rationale: Konstrukcja względna z ἄν ma sens nieokreślony i ogólny. Polskie „jeśli ktoś” naturalnie zachowuje jej warunkowy charakter.
- source_word: δέξηται ὑμᾶς
  choice: was nie przyjmie
  rationale: „Przyjąć” obejmuje zarówno udzielenie posłańcom gościny, jak i przychylne odniesienie się do ich misji, bez zawężania sensu do samego powitania.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: ani nie będzie słuchał waszych słów
  rationale: ἀκούω może oznaczać słyszenie lub uważne słuchanie. W tym kontekście forma „będzie słuchał” oddaje odrzucenie orędzia, ale nie dopowiada posłuszeństwa, które sugerowałoby „usłucha”.
- source_word: ἐξερχόμενοι ἔξω
  choice: wychodząc
  rationale: Imiesłów oddaje czynność towarzyszącą nakazowi; samo polskie „wychodząc” naturalnie zawiera sens wyjścia na zewnątrz, więc dodatkowe „na zewnątrz” byłoby zbędne.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: z tego domu albo z tego miasta
  rationale: Powtórzenie „z tego” jasno odnosi wskazanie do obu możliwych miejsc. πόλις oddano jako „miasto”, pozostawiając w przypisie możliwe „miejscowość”.
- source_word: ἐκτινάξατε
  choice: strząśnijcie
  rationale: Czasownik oznacza zdecydowane otrząśnięcie lub usunięcie czegoś przez strząśnięcie; polski tryb rozkazujący zachowuje siłę polecenia.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: pył ze swoich stóp
  rationale: κονιορτός oznacza konkretnie pył lub kurz. „Ze swoich stóp” jasno wyraża usunięcie go ze stóp uczniów.
theological_decisions:
- issue: Symboliczny gest wobec odrzucających posłańców i ich orędzie
  choice: Zachowano dosłowny nakaz „strząśnijcie pył ze swoich stóp”.
  alternative: Dopowiedzieć w tekście głównym „na świadectwo przeciwko nim” albo sparafrazować gest jako pozostawienie odrzucających pod sądem.
  rationale: Sam ten werset podaje konkretny gest, lecz nie objaśnia wprost jego znaczenia. Niedodawanie sformułowań z tekstów paralelnych zachowuje granice i napięcie tekstu źródłowego.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Składnia zachowuje warunkowy tok zdania greckiego, a konkretność gestu pozostaje bez interpretacyjnego dopowiedzenia w tekście głównym.
