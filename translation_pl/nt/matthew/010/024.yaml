id: MAT.10.24
reference: Matthew 10:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: pl
  text: Uczeń nie stoi wyżej od nauczyciela ani niewolnik[a] od swojego pana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „sługa”; greckie δοῦλος może zależnie od kontekstu oznaczać niewolnika lub sługę, tutaj jednak podkreślona jest podległość panu.'
    reason: alternative_reading
  - marker: b
    text: Greckie κύριος może również znaczyć „Pan”, lecz w tym obrazie określa ludzkiego pana niewolnika.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: uczeń
  rationale: „Uczeń” naturalnie oddaje zarówno naukę, jak i osobistą więź z nauczycielem charakterystyczną dla kontekstu Ewangelii.
- source_word: ὑπέρ
  choice: stać wyżej od
  rationale: W połączeniu z biernikiem wyraża tu wyższą pozycję lub rangę. Polski zwrot „stać wyżej od” zachowuje porównawczy sens bez dopowiadania, na czym miałaby polegać wyższość.
- source_word: διδάσκαλος
  choice: nauczyciel
  rationale: To podstawowy i współcześnie naturalny odpowiednik, wyraźnie odróżniający pierwszą parę pojęć od relacji niewolnika i pana.
- source_word: δοῦλος
  choice: niewolnik
  rationale: W zestawieniu z κύριος słowo wskazuje na człowieka podporządkowanego panu i pozostającego pod jego władzą; „niewolnik” zachowuje tę społeczną nierówność wyraźniej niż „sługa”.
- source_word: κύριος
  choice: pan
  rationale: W tej analogii oznacza ludzkiego zwierzchnika niewolnika, nie tytuł Boży. „Pan” jest naturalnym polskim określeniem tej relacji.
- source_word: αὐτοῦ
  choice: swojego
  rationale: Polski zaimek zwrotny jasno odnosi pana do podmiotu drugiego członu, czyli niewolnika.
- source_word: οὐδέ
  choice: ani
  rationale: „Ani” naturalnie łączy drugi człon z pierwszym przeczeniem.
theological_decisions:
- issue: Znaczenie δοῦλος w analogii społecznej
  choice: niewolnik
  alternative: sługa
  rationale: Kontekst zestawia pozycję ucznia wobec nauczyciela z pozycją δοῦλος wobec κύριος. „Niewolnik” lepiej zachowuje mocny aspekt podporządkowania, a łagodniejszą możliwość leksykalną podano w przypisie.
- issue: Znaczenie κύριος w kontekście niedotyczącym bezpośrednio Boga
  choice: pan
  alternative: Pan
  rationale: Bezpośrednim odniesieniem jest ludzki pan niewolnika w obrazie społecznym. Mała litera zapobiega narzuceniu tekstowi bezpośredniego tytułu chrystologicznego, nie przekreślając zastosowania całego powiedzenia do Jezusa i uczniów.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Konstrukcja „stać wyżej od” brzmi naturalnie po polsku, a zarazem zachowuje metaforę pozycji zawartą w ὑπέρ. W drugim członie eliptycznie pominięto powtórzenie „nie stoi wyżej”, zgodnie z naturalną polską składnią i strukturą greckiego zdania.
