source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: pl
  text: Nie myślcie, że przyszedłem[a] przynieść pokój na ziemię; nie przyszedłem przynieść pokoju, lecz miecz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecki aoryst można też oddać: „przybyłem”.'
    reason: lexical_alternative
  - marker: b
    text: Greckie słowo oznacza „miecz”; w tym kontekście obraz ten wskazuje na podział, a nie na zachętę do przemocy.
    reason: contextual_explanation
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Nie sądźcie
  rationale: Konstrukcja μή z aorystem trybu łączącego wyraża zakaz. „Nie sądźcie” jest naturalne, bezpośrednie i zachowuje odcień świadomego przekonania.
- source_word: ἦλθον
  choice: przyszedłem
  rationale: Aoryst czasownika ἔρχομαι w wypowiedzi o celu misji naturalnie oddaje polski czas przeszły dokonany. „Przyszedłem” brzmi jasno i osobiście.
- source_word: βαλεῖν
  choice: przynieść
  rationale: Choć podstawowym znaczeniem βάλλω jest „rzucać”, w tej konstrukcji celowej z „pokojem” i „mieczem” chodzi o spowodowanie lub sprowadzenie określonego skutku. „Przynieść” zachowuje obraz i brzmi naturalnie po polsku.
- source_word: εἰρήνην
  choice: pokój / pokoju
  rationale: '„Pokój” jest zwykłym odpowiednikiem εἰρήνη. W drugim zdaniu zastosowano naturalny w polszczyźnie dopełniacz po przeczeniu: „nie przynieść pokoju”.'
- source_word: ἐπὶ τὴν γῆν
  choice: na ziemię
  rationale: Przyimek ἐπί z biernikiem wskazuje tu zasięg lub kierunek skutku. „Na ziemię” zachowuje składnię wypowiedzi o przyniesieniu czegoś i szeroki sens γῆ.
- source_word: ἀλλὰ
  choice: lecz
  rationale: „Lecz” wyraźnie i godnie oddaje mocne przeciwstawienie, nie nadając wypowiedzi archaicznego tonu.
- source_word: μάχαιραν
  choice: miecz
  rationale: μάχαιρα oznacza miecz lub krótszą broń sieczną. Zachowano konkretny obraz „miecza”, zamiast zastępować go interpretacyjnym słowem „podział”.
theological_decisions:
- issue: Czy obraz miecza zastąpić w tekście głównym interpretacyjnym określeniem „podział”
  choice: Zachować w tekście głównym słowo „miecz”
  alternative: podział
  rationale: Grecki tekst zawiera konkretny rzeczownik μάχαιρα. Dalszy kontekst wskazuje na rozłam wywołany odpowiedzią na misję Jezusa, ale przekład nie powinien usuwać napięcia obrazu ani zastępować go objaśnieniem.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym i bezpośrednim brzmieniu. Powtórzenie „przyszedłem przynieść” zachowano ze względu na retoryczną paralelę oryginału. Obraz miecza pozostawiono w tekście głównym, a jego kontekstowy sens wyjaśniono w przypisie.
