  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: pl
  text: Szymon Kananejczyk[a] i Judasz Iskariota, który także Go zdradził[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Szymon Gorliwy”. Grecki wyraz brzmi „Kananaíos” i prawdopodobnie odzwierciedla aramejskie lub hebrajskie miano tradycyjnie rozumiane jako „Gorliwy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „który także Go wydał”. Grecki czasownik może znaczyć „wydać” lub „przekazać”, lecz w odniesieniu do Judasza kontekst wskazuje na zdradę.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Kananejczyk
  rationale: Transliteracyjny, utrwalony w polskiej tradycji biblijnej odpowiednik greckiej formy pochodzenia aramejskiego lub hebrajskiego. Nie utożsamia jej bezpośrednio z greckim ζηλωτής; prawdopodobne znaczenie „Gorliwy” podano w przypisie.
- source_word: Ἰσκαριώτης
  choice: Iskariota
  rationale: Utrwalona polska forma przydomka Judasza, zachowująca charakter nazwy własnej.
- source_word: παραδοὺς
  choice: zdradził
  rationale: Czasownik παραδίδωμι zasadniczo oznacza „wydać, przekazać”, lecz w odniesieniu do czynu Judasza kontekst Ewangelii nadaje mu sens zdrady. Szersze, bardziej dosłowne znaczenie zachowano w przypisie.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: który Go zdradził
  rationale: Rodzajnik z imiesłowem pełni funkcję określającą Judasza przez jego czyn; naturalnym polskim odpowiednikiem jest zdanie względne. Nie oddano καί osobnym „także”, ponieważ w tym miejscu ma ono naturalnie funkcję przyłączającą i wyróżniającą, a jego mechaniczne tłumaczenie brzmiałoby niezręcznie.
theological_decisions:
- issue: Czy παραδοὺς oddać neutralniej jako „wydał”, czy kontekstowo jako „zdradził”
  choice: zdradził
  alternative: wydał
  rationale: W wykazie apostołów Judasz zostaje wskazany przez czyn znany z dalszej narracji, dlatego „zdradził” naturalnie przekazuje jego relacyjny i moralny charakter. Ponieważ sam grecki czasownik ma szersze znaczenie, wariant „wydał” podano w przypisie, bez zacierania napięcia leksykalnego.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr listy imion. Zachowano utrwalone polskie formy „Kananejczyk” i „Iskariota”. Wielką literę w zaimku „Go” zastosowano zgodnie z powszechną polską konwencją odnoszenia zaimków do Jezusa.
