  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: pl
  text: 'Podeszli i obudzili Go, mówiąc: „Panie, ocal nas! Giniemy!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: podeszli
  rationale: Imiesłów aorystu od προσέρχομαι wskazuje, że uczniowie zbliżyli się do Jezusa, zanim Go obudzili. „Podeszli” naturalnie oddaje ten ruch bez zbędnego dopowiedzenia.
- source_word: ἤγειραν
  choice: obudzili
  rationale: W kontekście snu ἐγείρω oznacza obudzenie kogoś, nie zaś podniesienie ani wskrzeszenie.
- source_word: λέγοντες
  choice: wołając
  rationale: Dosłownie oznacza „mówiąc”, jednak w sytuacji bezpośredniego zagrożenia polskie „wołając” naturalnie oddaje sposób wypowiedzenia prośby, nie przesądzając, że był to krzyk.
- source_word: Κύριε
  choice: Panie
  rationale: Wołacz od κύριος. „Panie” zachowuje zarówno możliwość pełnego szacunku zwrotu do Jezusa, jak i głębszy wydźwięk tytułu.
- source_word: σῶσον
  choice: ratuj nas
  rationale: Aorystyczny tryb rozkazujący od σῴζω jest tu błaganiem o natychmiastowe wybawienie z niebezpieczeństwa. Dopełnienie „nas”, choć niewyrażone osobnym słowem, jasno wynika z następującego ἀπολλύμεθα.
- source_word: ἀπολλύμεθα
  choice: giniemy
  rationale: Forma teraźniejsza wyraża trwające, bezpośrednie zagrożenie zgubą lub śmiercią. „Giniemy” jest zwięzłe, naglące i naturalne po polsku.
theological_decisions:
- issue: Znaczenie tytułu κύριος w zwrocie do Jezusa
  choice: Panie
  alternative: Nauczycielu / Mistrzu
  rationale: „Panie” nie ogranicza zwrotu do czysto funkcjonalnego tytułu, lecz zachowuje możliwą chrystologiczną wagę słowa bez jej narzucania.
- issue: Zakres znaczeniowy σῴζω w bezpośrednim niebezpieczeństwie
  choice: ratuj nas
  alternative: zbaw nas
  rationale: Kontekst burzy wskazuje przede wszystkim na ocalenie od natychmiastowej śmierci. Przypis zachowuje jednak szersze, teologicznie istotne znaczenie czasownika.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Wielka litera w zaimku „Go” odpowiada utrwalonej polskiej konwencji odnoszenia się do Jezusa. Krótkie zdania wykrzyknikowe zachowują nagłość i napięcie sceny.
