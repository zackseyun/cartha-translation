review_pass:
  verdict: revise
  source_fidelity: Draft correctly reflects the sequence of approaching Jesus, waking him, addressing him as κύριε, and the urgent claim ἀπολλύμεθα. However, «więc» has no basis in the Greek, and «wołając» adds a vocal/emotional nuance beyond λέγοντες («mówiąc»). «Ocal nas» is a more idiomatic Polish plea for immediate rescue while retaining the lexical range of σῴζω through the footnote.
  naturalness: «Podeszli i obudzili Go, mówiąc» is natural, concise modern Polish. «Panie, ocal nas! Giniemy!» is urgent and idiomatic without becoming colloquial. Capitalization of «Go» is retained as an accepted reverential convention.
  terminology: «Panie» appropriately renders κύριε without deciding the precise degree of titular or christological force. «Ocal nas» fits the immediate peril; the footnote preserves «zbaw nas» as the broader lexical alternative. «Giniemy» accurately conveys present, imminent ruin.
  issues:
  - severity: medium
    issue: Unwarranted connective «więc»
    rationale: The Greek begins καί («and»), not an inferential «therefore/so». «Więc» introduces a relation not expressed by the source.
  - severity: low
    issue: «wołając» over-specifies λέγοντες
    rationale: λέγοντες simply introduces their speech («mówiąc»). The dangerous setting supplies urgency, but the verb itself does not state that they cried out.
  revised_text: 'Podeszli i obudzili Go, mówiąc: „Panie, ocal nas! Giniemy!”'
  revised_footnotes:
  - marker: a
    text: 'Możliwe także: „zbaw nas”. Grecki czasownik σῴζω może oznaczać zarówno natychmiastowe ocalenie z niebezpieczeństwa, jak i zbawienie w szerszym sensie.'
    reason: lexical_alternative
  revision_rationale: Usunięto nieobecne w grece «więc» oraz zastąpiono interpretujące «wołając» dosłowniej i neutralniej oddającym λέγοντες «mówiąc». «Ratuj nas» zmieniono na dokonane «ocal nas», które naturalniej wyraża naglące błaganie o jednorazowe wybawienie w sytuacji bezpośredniego zagrożenia, nie tracąc szerszego sensu σῴζω dzięki przypisowi.
