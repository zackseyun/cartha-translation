revisions:
- from: 'Podeszli więc i obudzili Go, wołając: „Panie, ratuj nas[a]! Giniemy!”'
  to: 'Podeszli i obudzili Go, mówiąc: „Panie, ocal nas! Giniemy!”'
  rationale: Usunięto nieobecne w grece «więc» oraz zastąpiono interpretujące «wołając» dosłowniej i neutralniej oddającym λέγοντες «mówiąc». «Ratuj nas» zmieniono na dokonane «ocal nas», które naturalniej wyraża naglące błaganie o jednorazowe wybawienie w sytuacji bezpośredniego zagrożenia, nie tracąc szerszego sensu σῴζω dzięki przypisowi.
  reviewer_model: gpt-5.6-terra
