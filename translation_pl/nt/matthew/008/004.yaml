id: MAT.8.4
reference: Matthew 8:4
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: pl
  text: 'Jezus powiedział mu: „Uważaj, nikomu nic nie mów, lecz idź, pokaż się kapłanowi i złóż dar nakazany przez Mojżesza[b] — na świadectwo dla nich[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „na świadectwo przeciwko nim”. Wyrażenie może odnosić się do dowodu przedstawionego kapłanom; niektórzy rozumieją je też jako świadectwo przeciw tym, którzy nie uwierzą.'
    reason: alternative_reading
  - marker: b
    text: Polecenie to nawiązuje do Prawa Mojżeszowego dotyczącego osoby oczyszczonej z trądu; zob. Kpł 14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Uważaj, nikomu nic nie mów
  rationale: Idiomaticzne użycie ὅρα wprowadza stanowcze ostrzeżenie lub polecenie, a konstrukcja z μηδενί i trybem łączącym wyraża zakaz. Polski zwrot zachowuje zarówno nacisk, jak i naturalność.
- source_word: ὕπαγε
  choice: idź
  rationale: Prosty i naturalny odpowiednik rozkaźnika ruchu.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: pokaż się kapłanowi
  rationale: Wiernie oddaje konstrukcję zwrotną i zachowuje aluzję do oględzin kapłańskich wymaganych po oczyszczeniu.
- source_word: τῷ ἱερεῖ
  choice: kapłanowi
  rationale: Polszczyzna nie ma rodzajnika; forma ta naturalnie wskazuje kapłana właściwego dla przewidzianej procedury, nie dopowiadając więcej niż greka.
- source_word: προσένεγκον τὸ δῶρον
  choice: złóż dar
  rationale: W kontekście kultowym προσφέρω oznacza przedstawienie lub ofiarowanie daru. „Złóż dar” brzmi naturalnie i zachowuje rzeczownik δῶρον.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: nakazany przez Mojżesza
  rationale: Zwięzła polska konstrukcja zachowuje znaczenie nakazu oraz autorytet Mojżesza.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: na świadectwo dla nich
  rationale: Zachowuje celowy odcień εἰς, szeroki sens μαρτύριον oraz nieokreślony referent zaimka αὐτοῖς.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jezus powiedział mu
  rationale: Grecki czas teraźniejszy historyczny naturalnie oddano polskim czasem przeszłym w narracji.
theological_decisions:
- issue: Referent i wydźwięk wyrażenia εἰς μαρτύριον αὐτοῖς
  choice: na świadectwo dla nich
  alternative: jako dowód dla kapłanów / na świadectwo przeciwko nim
  rationale: Tekst grecki nie określa wprost, do kogo odnosi się αὐτοῖς, ani czy świadectwo ma charakter neutralnego dowodu, pozytywnego potwierdzenia czy świadectwa obciążającego. Przekład zachowuje tę niejednoznaczność.
translation_notes:
  register: Współczesna, standardowa i godna polszczyzna. „Uważaj” zachowuje stanowczy ton polecenia, a „złóż dar” brzmi naturalnie w kontekście kultowym. Szyk końcowy celowo pozostawia niejednoznaczność greckiego αὐτοῖς.
