  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: pl
  text: 'I mówi mu[a]: „Przyjdę i go uzdrowię”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Czy mam przyjść i go uzdrowić?”. Niektórzy odczytują te słowa Jezusa jako pytanie ze względu na kontekst, jednak sama grecka konstrukcja naturalnie jest odczytywana jako oznajmienie.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: I
  rationale: Zwykły spójnik narracyjny; zachowuje prostą więź z poprzednim zdaniem bez dodawania wyraźnego następstwa czasowego lub wynikania.
- source_word: λέγει
  choice: mówi
  rationale: Grecki czas teraźniejszy pełni funkcję praesens historicum. Polski czas teraźniejszy naturalnie zachowuje żywość narracji.
- source_word: αὐτῷ
  choice: mu
  rationale: Celownik wskazuje adresata wypowiedzi; zwięzłe polskie „mu” jest naturalne i jednoznaczne w kontekście.
- source_word: Ἐγὼ
  choice: '[podmiot zawarty w formie „przyjdę”]'
  rationale: Grecki zaimek osobowy może nieść lekki nacisk, lecz osobne polskie „ja” brzmiałoby mocniej niż wymaga tego kontekst. Forma czasownika jasno wskazuje pierwszą osobę.
- source_word: ἐλθὼν
  choice: przyjdę
  rationale: Imiesłów aorystu wraz z czasownikiem w czasie przyszłym wyraża czynność towarzyszącą lub poprzedzającą; naturalnym polskim odpowiednikiem jest konstrukcja „przyjdę i…”.
- source_word: θεραπεύσω
  choice: uzdrowię
  rationale: W opisie cudownego przywrócenia zdrowia „uzdrowić” jest naturalnym, godnym i trafnym odpowiednikiem θεραπεύω.
- source_word: αὐτόν
  choice: go
  rationale: Zaimek w bierniku odnosi się do chorego sługi; „go” jest naturalnym polskim odpowiednikiem.
theological_decisions:
- issue: Czy wypowiedź oddać jako oznajmienie, czy pytanie
  choice: 'Oznajmienie: „Przyjdę i go uzdrowię”.'
  alternative: 'Pytanie: „Czy mam przyjść i go uzdrowić?”'
  rationale: W grece nie ma partykuły pytajnej, a składnia naturalnie pozwala odczytać słowa jako oznajmienie. Kontekst umożliwia interpretację pytajną, dlatego zachowano ją w przypisie, nie narzucając jej tekstowi głównemu.
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Zachowano greckie praesens historicum („mówi”) oraz naturalny polski szyk. Nie dodano osobnego „ja”, aby nie wzmacniać nacisku ponad to, co pewne w tekście.
