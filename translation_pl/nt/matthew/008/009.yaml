  source_fidelity: 'Przekład wiernie oddaje tok argumentacji setnika: jego podporządkowanie zwierzchniej władzy, posiadanie podwładnych żołnierzy oraz trzy równoległe przykłady skutecznego rozkazu. „Bo i ja” właściwie zachowuje wyjaśniające καὶ γάρ i akcent wyrażonego ἐγώ. Nie dodaje treści do rozkazów ani nie zaciera obecnej w grece relacji władzy.'
