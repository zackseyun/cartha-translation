id: MAT.8.9
reference: Matthew 8:9
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: pl
  text: 'Bo i ja jestem człowiekiem podlegającym władzy, a mam pod sobą żołnierzy. Mówię jednemu: „Idź” — i idzie; innemu: „Przyjdź” — i przychodzi; a mojemu niewolnikowi[a]: „Zrób to” — i robi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „słudze”. Greckie δοῦλος może oznaczać niewolnika albo sługę, zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Bo i ja
  rationale: „Bo” zachowuje funkcję uzasadniającą γάρ, a „i ja” oddaje καί oraz wyraźne ἐγώ, wskazując na analogię między autorytetem Jezusa a sytuacją setnika.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: jestem człowiekiem podlegającym władzy
  rationale: Sformułowanie oddaje podporządkowanie setnika zwierzchniej władzy i zachowuje obraz wojskowego łańcucha dowodzenia.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: mam pod sobą żołnierzy
  rationale: 'Naturalny polski zwrot wiernie zachowuje kontrast: setnik sam podlega władzy, ale ma też podporządkowanych sobie żołnierzy.'
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: Mówię jednemu ... innemu
  rationale: Polska para „jednemu… innemu” naturalnie oddaje rozdzielczy układ greckich zaimków, bez niezręcznego dosłownego „temu” pozbawionego wskazującego kontekstu.
- source_word: Πορεύθητι ... Ἔρχου
  choice: „Idź” ... „Przyjdź”
  rationale: Proste rozkaźniki odpowiadają bezpośrednim poleceniom greckim; nie dodano niewyrażonego w tekście „tutaj”.
- source_word: δοῦλος
  choice: niewolnik
  rationale: W domowym otoczeniu rzymskiego setnika wyraz najpewniej określa osobę pozostającą w stanie niewoli. „Niewolnik” zachowuje społeczną asymetrię obecną w greckim terminie; tradycyjne „sługa” podano w przypisie.
- source_word: ποιεῖ
  choice: robi
  rationale: Prosty czas teraźniejszy zachowuje paralelę z „idzie” i „przychodzi” oraz podkreśla natychmiastowe wykonanie rozkazu.
theological_decisions:
- issue: Sposób oddania δοῦλος w przykładzie setnika
  choice: niewolnik
  alternative: sługa
  rationale: Grecki termin może zależnie od kontekstu oznaczać niewolnika lub sługę. W realiach gospodarstwa rzymskiego oficera „niewolnik” trafniej zachowuje prawdopodobny status społeczny tej osoby, nie zmieniając głównego sensu wypowiedzi o władzy i posłuszeństwie. Łagodniejsze, tradycyjne „sługa” pozostaje zaznaczone jako możliwa alternatywa.
translation_notes:
  register: Współczesny, godny i przystępny język polski. Powtórzenia „idzie”, „przychodzi” i „robi” zachowują celowo prosty rytm rozkazu oraz natychmiastowego posłuszeństwa. Myślniki wzmacniają równoległość wypowiedzi bez dodawania treści.
