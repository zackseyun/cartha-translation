    issue: The rendering „Kimże on jest?” weakens the lexical force of Ποταπός.
    rationale: Ποταπός concerns the sort, character, or extraordinary kind of person in view, not simply his identity. Polish „Co to za człowiek” directly and naturally retains this force.
