  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: pl
  text: 'Ludzie zaś zdumieli się i mówili: „Co to za człowiek, że nawet wiatry i morze są mu posłuszne?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Ludzie zaś
  rationale: ἄνθρωποι oznacza tu osoby obecne w łodzi; polskie „ludzie” jest naturalne i nie narzuca większej precyzji niż tekst grecki. Partykułę δέ oddano jako „zaś”, zachowując przejście narracyjne.
- source_word: ἐθαύμασαν
  choice: zdumieli się
  rationale: Czasownik wyraża silne zdziwienie połączone z podziwem; „zdumieli się” jest współczesne, godne i odpowiada punktowej reakcji wyrażonej aorystem.
- source_word: λέγοντες
  choice: i mówili
  rationale: Grecki imiesłów został naturalnie rozwinięty w polską konstrukcję współrzędną, bez zmiany związku między zdumieniem a wypowiedzią.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Kimże on jest
  rationale: To naturalne polskie pytanie wyrażające zdumienie tożsamością i niezwykłym charakterem tej osoby. Partykuła „-że” oddaje emocjonalną siłę pytania, a przypis zachowuje bardziej dosłowny niuans jakości lub rodzaju zawarty w ποταπός.
- source_word: ὅτι
  choice: że
  rationale: „Że” naturalnie wprowadza podstawę zdumionego pytania i zachowuje związek z następującym opisem posłuszeństwa żywiołów.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: nawet wiatry i morze
  rationale: „Nawet” oddaje emfatyczną funkcję καί, podkreślając niezwykłość władzy obejmującej żywioły. Liczbę mnogą „wiatry” zachowano zgodnie z greką.
- source_word: αὐτῷ ὑπακούουσιν
  choice: są mu posłuszne
  rationale: Zwrot oddaje trwałą i osobową ideę podporządkowania się jego rozkazowi; jest idiomatyczny w odniesieniu do uosobionych sił natury.
theological_decisions:
- issue: Chrystologiczna wymowa pytania uczniów
  choice: Pozostawić pytanie otwarte, zachowując zdumienie wywołane władzą Jezusa nad stworzeniem.
  alternative: Dopowiedzieć wprost, kim jest Jezus, albo sprowadzić wypowiedź jedynie do reakcji na cud.
  rationale: Tekst buduje chrystologiczną wymowę przez pytanie i posłuszeństwo żywiołów, lecz sam nie podaje w tym miejscu odpowiedzi. Przekład zachowuje to napięcie bez doktrynalnego dopowiedzenia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracyjny. Szyk „Ludzie zaś” zachowuje lekko podniosły charakter tekstu biblijnego bez archaizacji; „Kimże” wyraża zdumienie, pozostając naturalne w bezpośredniej wypowiedzi.
