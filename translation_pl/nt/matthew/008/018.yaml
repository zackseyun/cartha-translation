  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: pl
  text: Gdy Jezus zobaczył wokół siebie liczne tłumy, polecił przeprawić się na drugi brzeg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Gdy ... zobaczył
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym; δέ pełni tu funkcję łącznika narracyjnego i nie wymaga osobnego „zaś”.
- source_word: πολλοὺς ὄχλους
  choice: liczne tłumy
  rationale: Zachowuje gramatyczną liczbę mnogą i sens wielkiej liczby zgromadzonych grup ludzi.
- source_word: περὶ αὐτόν
  choice: wokół siebie
  rationale: Naturalne odniesienie zwrotne w polskim przy zachowaniu Jezusa jako podmiotu.
- source_word: ἐκέλευσεν
  choice: polecił
  rationale: Oddaje stanowcze wydanie polecenia, bez nadmiernie urzędowego „wydał rozkaz”.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: przeprawić się na drugi brzeg
  rationale: W kontekście Jeziora Galilejskiego idiomatycznie wyraża udanie się na przeciwległą stronę; bez dopowiadania środka transportu.
theological_decisions: []
translation_notes:
  register: Współczesny, godny i płynny język narracyjny. Szyk zdania pozostaje bliski grece, lecz unika nienaturalnego dosłownego „odejść na drugą stronę”.
