id: MAT.8.34
reference: Matthew 8:34
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: pl
  text: A oto całe miasto wyszło Jezusowi na spotkanie. Gdy Go zobaczyli, błagali, żeby odszedł z ich okolic[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „z ich terytorium”; dosłownie: „od ich granic”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje funkcję zwrócenia uwagi i narracyjną wyrazistość greckiego wyrażenia, a zarazem brzmi naturalnie i godnie we współczesnej polszczyźnie.
- source_word: πᾶσα ἡ πόλις
  choice: całe miasto
  rationale: Naturalny polski odpowiednik zbiorowego określenia mieszkańców miasta; nie narzuca twierdzenia, że chodzi bez wyjątku o każdą osobę.
- source_word: ἐξῆλθεν
  choice: wyszło
  rationale: Oddaje ruch mieszkańców na zewnątrz miasta i zachowuje liczbę pojedynczą zgodną z rzeczownikiem zbiorowym „miasto”.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: Jezusowi na spotkanie
  rationale: Naturalny polski zwrot celowy, wiernie oddający wyjście po to, by spotkać Jezusa.
- source_word: ἰδόντες αὐτὸν
  choice: Gdy Go zobaczyli
  rationale: Czasowe zdanie podrzędne jasno oddaje relację imiesłowu aorystu do następującej prośby, bez niezręcznej dosłowności.
- source_word: παρεκάλεσαν
  choice: błagali
  rationale: W tym kontekście czasownik oznacza usilną prośbę; „błagali” zachowuje jej mocniej nacechowany charakter.
- source_word: ὅπως μεταβῇ
  choice: żeby odszedł
  rationale: Naturalnie oddaje treść usilnej prośby wyrażonej przez ὅπως z trybem łączącym, zachowując sens oddalenia się.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: z ich okolic
  rationale: Liczba mnoga ὅρια może dosłownie oznaczać granice, lecz w kontekście wskazuje na obszar należący do mieszkańców. „Okolice” brzmią naturalnie i zachowują sens geograficzny; dosłowniejsze możliwości podano w przypisie.
theological_decisions:
- issue: Powód prośby mieszkańców
  choice: Nie podano ich motywu; tekst mówi jedynie, że błagali Jezusa, aby odszedł.
  alternative: Lęk przed mocą Jezusa, gniew z powodu utraty świń albo ogólne przerażenie wydarzeniem.
  rationale: Grecki tekst nie wyjaśnia przyczyny prośby. Przekład zachowuje tę narracyjną i teologiczną otwartość, zamiast dopowiadać motyw.
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. „A oto” zachowuje biblijną wyrazistość bez nadmiernej archaizacji; „błagali” oddaje intensywność prośby. Wielka litera w zaimku „Go” odpowiada utrwalonej polskiej konwencji zapisu odniesień do Jezusa.
