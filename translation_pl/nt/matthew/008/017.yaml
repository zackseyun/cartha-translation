id: MAT.8.17
reference: Matthew 8:17
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: pl
  text: 'aby wypełniło się to, co zostało powiedziane przez proroka Izajasza: „On sam wziął nasze słabości[a] i poniósł[b] nasze choroby”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dolegliwości” lub „niemoce”. Greckie słowo może oznaczać słabości, niemoce albo choroby.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „dźwignął” lub „wziął na siebie”. Użyty czasownik oznacza nosić albo dźwigać i nawiązuje do Iz 53:4.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: aby wypełniło się
  rationale: Naturalnie oddaje konstrukcję celu lub skutku oraz Mateuszowy motyw wypełnienia Pisma, nie rozstrzygając zbyt ostro między celem a rezultatem.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: to, co zostało powiedziane przez proroka Izajasza
  rationale: Oddaje imiesłów w stronie biernej oraz διά z dopełniaczem jako pośrednictwo proroka, zachowując naturalną polszczyznę.
- source_word: λέγοντος
  choice: ':'
  rationale: W polszczyźnie dwukropek naturalnie i zwięźle wprowadza treść cytatu; dosłowne „mówiącego” byłoby niezręczne.
- source_word: Αὐτὸς
  choice: On sam
  rationale: Zachowuje emfatyczny charakter greckiego zaimka.
- source_word: ἀσθενείας
  choice: słabości
  rationale: Zachowuje szeroki zakres znaczeniowy obejmujący słabości, niemoce i dolegliwości, a zarazem pasuje do kontekstu uzdrowień.
- source_word: ἔλαβεν
  choice: wziął
  rationale: Bezpośrednio oddaje λαμβάνω bez dopowiadania „usunął” ani zacierania różnicy względem następnego czasownika.
- source_word: νόσους
  choice: choroby
  rationale: Precyzyjny i współczesny odpowiednik terminu oznaczającego choroby.
- source_word: ἐβάστασεν
  choice: poniósł
  rationale: Oddaje sens niesienia lub dźwigania, a także zachowuje związek z językiem Iz 53 bez narzucania jednego wyjaśnienia teologicznego.
theological_decisions:
- issue: Znaczenie cytatu z Izajasza 53:4 w kontekście uzdrowień dokonywanych przez Jezusa
  choice: „słabości” i „choroby”, z czasownikami „wziął” i „poniósł”
  alternative: „dolegliwości” i „choroby” albo bardziej tradycyjne „niemoce” i „choroby”; „niósł” zamiast „poniósł”
  rationale: Rzeczowniki pozostają zakorzenione w bezpośrednim kontekście fizycznych uzdrowień, natomiast „poniósł” zachowuje szerszy wydźwięk cytatu z Izajasza. Przekład nie ogranicza tekstu ani wyłącznie do medycznego opisu, ani do jednej sformułowanej doktryny zadośćuczynienia.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano emfatyczne „On sam” oraz rozróżnienie między „wziął” i „poniósł”. Dwukropek zastępuje niezręczne dosłowne oddanie imiesłowu λέγοντος.
