id: MAT.8.33
reference: Matthew 8:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: pl
  text: Pasterze zaś uciekli, a gdy przyszli do miasta, opowiedzieli o wszystkim, także o tym, co dotyczyło opętanych przez demony.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „i o sprawach dotyczących opętanych przez demony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Pasterze zaś
  rationale: Imiesłów określa ludzi pasących i pilnujących stada świń; „pasterze” jest zwięzłym, naturalnym polskim określeniem ich roli. δέ oddano jako „zaś”, zachowując narracyjne przejście.
- source_word: ἔφυγον
  choice: uciekli
  rationale: Aoryst czasownika φεύγω bezpośrednio oznacza ucieczkę; „uciekli” jest naturalne i wyraziste.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: gdy przyszli do miasta
  rationale: Imiesłów aorystu wskazuje czynność poprzedzającą zdanie główne. „Gdy przyszli do miasta” naturalnie wyraża tę relację czasową, a polskie „do miasta” idiomatycznie oddaje kierunkowe εἰς τὴν πόλιν.
- source_word: ἀπήγγειλαν πάντα
  choice: opowiedzieli o wszystkim
  rationale: ἀπαγγέλλω oznacza przekazać wiadomość lub zdać sprawę, a πάντα obejmuje całość wydarzeń. Połączenie „opowiedzieli o wszystkim” brzmi naturalnie we współczesnej polszczyźnie.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: także o tym, co dotyczyło opętanych przez demony
  rationale: Konstrukcja jest eliptyczna i dosłownie mówi o „sprawach dotyczących” opętanych. Przekład zachowuje tę nieokreśloność, nie zawężając sensu wyłącznie do tego, co im się wydarzyło.
- source_word: δαιμονιζομένων
  choice: opętanych przez demony
  rationale: Określenie wskazuje osoby znajdujące się pod działaniem demonów. Tradycyjne i zrozumiałe „opętani przez demony” oddaje realność opisanej przypadłości, nie wprowadzając dodatkowych rozróżnień doktrynalnych.
theological_decisions:
- issue: Zakres znaczeniowy δαιμονιζομένων
  choice: opętanych przez demony
  alternative: dręczonych przez demony
  rationale: „Opętanych przez demony” jest rozpoznawalnym odpowiednikiem terminu w tej narracji, a zarazem nie dopowiada mechanizmu ani stopnia demonicznego oddziaływania ponad to, co mówi tekst.
- issue: Eliptyczne καὶ τὰ τῶν δαιμονιζομένων
  choice: także o tym, co dotyczyło opętanych przez demony
  alternative: także o tym, co przydarzyło się opętanym przez demony
  rationale: Greka nie określa wprost, czy chodzi wyłącznie o to, co przydarzyło się tym ludziom, czy szerzej o całą sprawę z nimi związaną. Tekst główny zachowuje tę autentyczną otwartość.
translation_notes:
  register: Współczesny, godny rejestr narracyjny. Składnia jest naturalna dla polskiego czytelnika, a przypis sygnalizuje eliptyczny charakter końcowej frazy greckiej.
