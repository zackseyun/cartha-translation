  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: pl
  text: 'I oto[a] krzyknęli: „Czego chcesz od nas[b], Synu Boży? Czy przyszedłeś tutaj przed wyznaczonym czasem, aby nas dręczyć?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „A oto”.'
    reason: Alternatywne oddanie zwrotu καὶ ἰδού jako narracyjnego sygnału zwracającego uwagę.
  - marker: b
    text: 'Dosłownie: „Co nam i Tobie?”, to znaczy: „Co mamy ze sobą wspólnego?”'
    reason: Bardziej dosłowne oddanie idiomu Τί ἡμῖν καὶ σοί, który wyraża dystans lub sprzeciw wobec ingerencji.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: I oto
  rationale: Zachowuje spójnik oraz żywy sygnał narracyjny zwracający uwagę na nagłe wydarzenie; jest zrozumiałe i godne we współczesnej polszczyźnie.
- source_word: ἔκραξαν λέγοντες
  choice: krzyknęli
  rationale: „Krzyknęli” oddaje donośność κράζω. Osobne tłumaczenie λέγοντες jako „mówiąc” byłoby w polszczyźnie zbędne i nienaturalne, ponieważ po czasowniku wprowadzono mowę bezpośrednią.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Czego chcesz od nas
  rationale: Naturalny polski odpowiednik semickiego idiomu wyrażającego dystans, sprzeciw lub kwestionowanie ingerencji. Bardziej dosłowną strukturę zachowano w przypisie.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Synu Boży
  rationale: Bezpośredni tytuł w wołaczu, odnoszący się do Jezusa; wielkie litery zachowują funkcję tytularną bez rozszerzania treści.
- source_word: ἦλθες ὧδε
  choice: Czy przyszedłeś tutaj
  rationale: Naturalnie oddaje aoryst ἦλθες oraz wyraźnie miejscowe ὧδε.
- source_word: πρὸ καιροῦ
  choice: przed wyznaczonym czasem
  rationale: καιρός może oznaczać właściwy lub ustalony moment; „wyznaczony czas” zachowuje możliwy wydźwięk eschatologiczny.
- source_word: βασανίσαι ἡμᾶς
  choice: aby nas dręczyć
  rationale: Oddaje bezokolicznik celu oraz dotkliwe cierpienie wyrażone przez βασανίζω, nie zawężając go wyłącznie do tortur fizycznych.
theological_decisions:
- issue: Rozpoznanie tożsamości Jezusa przez demony
  choice: Synu Boży
  alternative: synu Boga
  rationale: Tekst wprost wkłada w ich usta chrystologiczny tytuł. Przekład zachowuje jego bezpośredniość, nie osłabiając go ani nie rozwijając doktrynalnie.
- issue: Eschatologiczny odcień καιρός
  choice: przed wyznaczonym czasem
  alternative: przed czasem
  rationale: Sformułowanie może wskazywać na ustalony moment sądu. „Wyznaczonym” zachowuje tę możliwość, nie określając, kto ani w jaki sposób go wyznaczył.
- issue: Zakres idiomu Τί ἡμῖν καὶ σοί
  choice: Czego chcesz od nas
  alternative: Co nam do Ciebie
  rationale: Wybrano naturalne pytanie wyrażające opór wobec ingerencji, a przypis zachowuje bardziej dosłowną i szerszą postać idiomu.
translation_notes:
  register: Nowoczesny, standardowy i godny rejestr polski. Zachowano narracyjne „I oto”, lecz uniknięto nienaturalnego „krzyknęli, mówiąc”. Forma „Czego chcesz od nas” jest idiomatyczna, a dosłowną konstrukcję źródłową podano w przypisie. Wszystkie znaczniki przypisów występują w tekście głównym.
