  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: pl
  text: Gdy zszedł z góry, poszły za Nim wielkie tłumy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Gdy zszedł
  rationale: Grecki genetivus absolutus z imiesłowem aorystu naturalnie oddaje zdanie czasowe. „Gdy zszedł” zachowuje następstwo wydarzeń, a lekko łączne δέ nie wymaga osobnego odpowiednika w płynnej polszczyźnie.
- source_word: ἀπὸ τοῦ ὄρους
  choice: z góry
  rationale: ὄρος może oznaczać górę lub wzgórze; „z góry” jest naturalnym odpowiednikiem i nawiązuje do miejsca wskazanego w poprzednim kontekście.
- source_word: ἠκολούθησαν αὐτῷ
  choice: poszły za Nim
  rationale: W narracyjnym kontekście ἀκολουθέω z celownikiem oznacza podążanie za kimś. „Poszły za Nim” brzmi naturalnie po polsku i zachowuje fizyczny kierunek ruchu.
- source_word: ὄχλοι πολλοί
  choice: wielkie tłumy
  rationale: Wyrażenie dosłownie oznacza „liczne/wielkie tłumy”. „Wielkie tłumy” jest naturalne we współczesnej polszczyźnie, zachowuje liczbę mnogą i wskazuje na znaczną liczbę ludzi.
theological_decisions: []
translation_notes:
  register: Współczesny, prosty i godny rejestr narracyjny. Wielka litera w zaimku „Nim” jest polską konwencją szacunku wobec Jezusa, bez zmiany treści źródłowej.
