id: MAT.8.15
reference: Matthew 8:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: pl
  text: I dotknął jej ręki, a gorączka ją opuściła. Potem wstała i zaczęła mu usługiwać[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „usługiwała mu”. Greckie imperfectum może po prostu opisywać trwającą czynność, choć może też wskazywać, że zaczęła mu usługiwać.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: dotknął
  rationale: Forma ἅπτομαι oznacza tu dotknięcie lub nawiązanie fizycznego kontaktu. „Dotknął” jest naturalne i nie sugeruje mocniejszego uchwycenia, niż wynika z tekstu.
- source_word: τῆς χειρὸς αὐτῆς
  choice: jej ręki
  rationale: χείρ oznacza zwykle „rękę”, a grecki dopełniacz wymagany przez ἅπτομαι naturalnie odpowiada polskiemu dopełniaczowi po czasowniku „dotknąć”.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: gorączka ją opuściła
  rationale: Sformułowanie zachowuje obecną w grece personifikację gorączki, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: πυρετός
  choice: gorączka
  rationale: Rzeczownik bezpośrednio oznacza gorączkę; nie ma podstaw do rozwijania go w szersze określenie choroby.
- source_word: ἠγέρθη
  choice: wstała
  rationale: W tym kontekście forma opisuje zwykłe podniesienie się po uzdrowieniu. „Wstała” jest jasne i nie narzuca skojarzenia ze zmartwychwstaniem.
- source_word: διηκόνει αὐτῷ
  choice: zaczęła mu usługiwać
  rationale: διακονέω oznacza służyć lub usługiwać. W scenie domowej „usługiwać” dobrze oddaje praktyczną posługę, a „zaczęła” przedstawia możliwy inchoatywny odcień greckiego imperfectum; przypis zachowuje prostszą alternatywę.
theological_decisions:
- issue: Możliwe teologiczne nadinterpretowanie ἠγέρθη
  choice: „wstała” w zwykłym sensie narracyjnym
  alternative: „została podniesiona”
  rationale: Chociaż ἐγείρω może w innych miejscach odnosić się do wskrzeszenia lub zmartwychwstania, bezpośredni kontekst mówi o tym, że po ustąpieniu gorączki kobieta podniosła się i usługiwała.
- issue: Zakres znaczeniowy διακονέω
  choice: „usługiwać” jako praktyczna posługa w domu
  alternative: „służyć” lub „posługiwać” w szerszym sensie religijnym
  rationale: Kontekst uzdrowienia w domu przemawia za zwyczajną, praktyczną obsługą, bez wprowadzania późniejszego technicznego znaczenia kościelnej posługi.
translation_notes:
  register: Współczesna, naturalna i godna polszczyzna. Zachowano personifikujące wyrażenie „gorączka ją opuściła”. Mała litera w zaimku „mu” odzwierciedla zwykłą polską składnię i nie dodaje informacji nieobecnej w greckim tekście. „Potem” naturalnie porządkuje następujące po sobie czynności wyrażone przez kolejne καί.
