id: MAT.8.11
reference: Matthew 8:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: pl
  text: Mówię wam jednak, że wielu przyjdzie ze wschodu i zachodu i zasiądzie do stołu z Abrahamem, Izaakiem i Jakubem w królestwie niebios[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „ułożą się [przy stole]”; podczas uczt w starożytności posiłki spożywano w pozycji półleżącej.'
    reason: cultural_note
  - marker: b
    text: Wyrażenie „ze wschodu i zachodu” wskazuje zapewne na ludzi przybywających z odległych krain, w tym spoza Izraela.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mówię wam jednak
  rationale: λέγω znaczy „mówię”, a δέ sygnalizuje łagodne przeciwstawienie lub rozwinięcie myśli. „Jednak” naturalnie oddaje ten zwrot w toku wypowiedzi.
- source_word: πολλοὶ
  choice: wielu
  rationale: Przymiotnik występuje rzeczownikowo. Polskie „wielu” zachowuje zwięzłość tekstu i nie dopowiada, kim dokładnie są przychodzący.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: ze wschodu i zachodu
  rationale: Formy liczby mnogiej mają tu idiomatyczny sens kierunków lub rozległych regionów. Polski zwrot zachowuje szeroki sens geograficzny.
- source_word: ἥξουσιν
  choice: przyjdzie
  rationale: ἥκω oznacza przybycie lub przyjście. Forma liczby pojedynczej jest w polszczyźnie wymagana przy podmiocie wyrażonym liczebnikowo-rzeczownikowym zaimkiem „wielu”.
- source_word: ἀνακλιθήσονται
  choice: zasiądzie do stołu
  rationale: Czasownik opisuje zajęcie miejsca w pozycji półleżącej podczas posiłku. „Zasiądzie do stołu” naturalnie przekazuje polskiemu czytelnikowi obraz wspólnej uczty, a przypis zachowuje szczegół dawnego zwyczaju.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: z Abrahamem, Izaakiem i Jakubem
  rationale: μετά z dopełniaczem wyraża wspólnotę lub przebywanie razem; tutaj chodzi o wspólnotę stołu. Zastosowano utrwalone polskie formy imion patriarchów.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: w królestwie niebios
  rationale: Jest to charakterystyczne dla Mateusza określenie. „Królestwo niebios” zachowuje rzeczownikową formę greckiego dopełniacza i jest naturalnym, utrwalonym polskim odpowiednikiem.
theological_decisions:
- issue: Obraz uczty i eschatologicznej wspólnoty
  choice: Zachowano obraz wspólnego posiłku przez wyrażenie „zasiądzie do stołu”.
  alternative: „spocznie z Abrahamem, Izaakiem i Jakubem”
  rationale: Werset przywołuje ucztę i wspólnotę stołu, a nie tylko obecność w tym samym miejscu. Przekład zachowuje ten sens bez dodawania szczegółów doktrynalnych.
- issue: Zakres określenia „wielu” przychodzących ze wschodu i zachodu
  choice: Pozostawiono geograficzne sformułowanie i nie nazwano przychodzących poganami w tekście głównym.
  alternative: „wielu pogan przyjdzie ze wschodu i zachodu”
  rationale: Kontekst może wskazywać na objęcie ludzi spoza Izraela, ale tekst grecki mówi jedynie o „wielu” ze wschodu i zachodu. Przekład zachowuje tę implikację bez jej rozstrzygania.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. „Zasiądzie do stołu” brzmi naturalnie po polsku, zachowując obraz uczty, natomiast przypis objaśnia dosłowny gest opisany w grece. Składnia „wielu przyjdzie i zasiądzie” odpowiada normie współczesnej polszczyzny.
