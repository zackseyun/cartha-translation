id: MAT.8.21
reference: Matthew 8:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: pl
  text: 'A inny z uczniów powiedział do Niego: „Panie, pozwól mi najpierw odejść i pogrzebać mojego ojca”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Prośba może dotyczyć zarówno bezpośredniego pogrzebu, jak i — szerzej — wypełniania synowskiego obowiązku aż do śmierci ojca; tekst grecki tego nie precyzuje.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: A inny z uczniów
  rationale: Oddaje przynależność mówiącego do grona uczniów oraz łagodne przejście narracyjne wyrażone przez δέ, bez sugerowania mocnego przeciwstawienia.
- source_word: Κύριε
  choice: Panie
  rationale: Naturalna polska forma wołacza zachowuje zarówno pełen szacunku zwrot do Jezusa, jak i możliwy ciężar teologiczny tytułu.
- source_word: ἐπίτρεψόν μοι
  choice: pozwól mi
  rationale: Współczesny i godny odpowiednik prośby o udzielenie pozwolenia; brzmi naturalniej niż formalne „zezwól mi”.
- source_word: πρῶτον ἀπελθεῖν
  choice: najpierw odejść
  rationale: Zachowuje pierwszeństwo w kolejności oraz zawarty w czasowniku kierunek oddalenia się od obecnego miejsca.
- source_word: θάψαι τὸν πατέρα μου
  choice: pogrzebać mojego ojca
  rationale: Bezpośrednio i idiomatycznie oddaje czynność pochówku oraz jej dopełnienie.
theological_decisions:
- issue: Znaczenie prośby o pogrzebanie ojca
  choice: Pozostawić prostą prośbę o pozwolenie na odejście i pogrzebanie ojca, bez określania, kiedy ojciec umarł lub umrze.
  alternative: Rozumieć ją albo jako prośbę o natychmiastowy udział w pogrzebie, albo szerzej jako obowiązek pozostania przy ojcu aż do jego śmierci.
  rationale: Grecki tekst nie rozstrzyga czasu śmierci ojca, dlatego przekład zachowuje rzeczywistą niejednoznaczność zamiast narzucać interpretację.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Pozwól mi” jest naturalną polszczyzną, a „odejść” zachowuje niuans ἀπέρχομαι. Zaimek „Niego” zapisano wielką literą zgodnie z częstą polską konwencją biblijną.
