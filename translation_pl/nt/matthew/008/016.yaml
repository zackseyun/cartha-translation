  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: pl
  text: Gdy nastał wieczór, przyprowadzono do Niego wielu opętanych przez demony[a]. On zaś słowem wypędził duchy i uzdrowił wszystkich chorych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wielu dręczonych przez demony”. Grecki imiesłów określa ludzi znajdujących się pod wpływem demonów; „opętanych przez demony” jest tradycyjnym, zwięzłym odpowiednikiem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Gdy nastał wieczór
  rationale: Naturalny polski odpowiednik greckiego dopełniacza absolutnego wyznaczającego czas; zachowuje sens nadejścia wieczoru.
- source_word: προσήνεγκαν αὐτῷ
  choice: przyprowadzono do Niego
  rationale: W odniesieniu do ludzi polskie „przyprowadzono” brzmi naturalniej niż dosłowne „przyniesiono”; bezosobowa forma trafnie oddaje nieokreślony podmiot liczby mnogiej.
- source_word: δαιμονιζομένους πολλούς
  choice: wielu opętanych przez demony
  rationale: Zwięzłe, tradycyjnie zrozumiałe określenie osób pod wpływem demonów; przypis zachowuje szerszą możliwość rozumienia greckiego imiesłowu.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: wypędził duchy
  rationale: „Wypędził” odpowiada ἐκβάλλω w kontekście egzorcyzmu, a „duchy” zachowuje dosłowny przedmiot greckiego zdania bez dopowiadania przymiotnika „złe”.
- source_word: λόγῳ
  choice: słowem
  rationale: Narzędnik naturalnie oddaje instrumentalny celownik i podkreśla skuteczność wypowiedzianego rozkazu, nie dodając niewystępującego w grece zaimka „swoim”.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: wszystkich chorych
  rationale: Grecki idiom oznacza osoby chore; sformułowanie jest jasne, naturalne i właściwe dla kontekstu uzdrawiania.
- source_word: ἐθεράπευσεν
  choice: uzdrowił
  rationale: Standardowy i godny polski odpowiednik θεραπεύω w ewangelicznych opisach uzdrowień.
theological_decisions:
- issue: Charakter δαιμονιζομένους i τὰ πνεύματα
  choice: Zachować tekstowe rozróżnienie między osobami opętanymi przez demony a chorymi oraz oddać τὰ πνεύματα jako „duchy”.
  alternative: „wielu dręczonych przez demony” albo interpretacyjne utożsamienie ich stanu z chorobą psychiczną
  rationale: Werset osobno mówi o wypędzaniu duchów i uzdrawianiu chorych. Przekład zachowuje własne kategorie narracji, nie psychologizując jej, a przypis sygnalizuje zakres greckiego imiesłowu.
- issue: Znaczenie λόγῳ
  choice: Oddać instrumentalnie jako „słowem”.
  alternative: „swoim słowem” lub „wydając rozkaz”
  rationale: Takie brzmienie zachowuje zwięzłość oryginału i ukazuje autorytet Jezusa bez dodawania elementów niewyrażonych w tekście.
translation_notes:
  register: Współczesny, standardowy polski o godnym, narracyjnym brzmieniu. Wielka litera w zaimku „Niego” jest zgodna z polską konwencją tekstów biblijnych. Składnia pozostaje płynna i zrozumiała dla zwykłego czytelnika.
