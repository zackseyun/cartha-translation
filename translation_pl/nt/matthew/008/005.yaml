  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: pl
  text: 'Gdy Jezus wszedł do Kafarnaum, przyszedł do niego setnik i usilnie go prosił:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Gdy Jezus wszedł
  rationale: Grecki dopełniacz niezależny z imiesłowem aorystu naturalnie oddaje zdanie czasowe. Imię „Jezus” dopowiada jednoznaczny podmiot wynikający z kontekstu, unikając w polszczyźnie niezręcznego nagromadzenia zaimków.
- source_word: εἰς Καφαρναοὺμ
  choice: do Kafarnaum
  rationale: Zastosowano utrwaloną polską formę nazwy miejscowej; przy czasowniku „wszedł” przyimek „do” naturalnie oddaje kierunek εἰς.
- source_word: προσῆλθεν αὐτῷ
  choice: podszedł do niego
  rationale: Oddaje podstawowy sens προσέρχομαι jako zbliżenia się do osoby i brzmi naturalnie w polskiej narracji.
- source_word: ἑκατόνταρχος
  choice: setnik
  rationale: „Setnik” jest tradycyjnym, zwięzłym i nadal zrozumiałym polskim określeniem dowódcy oddziału odpowiadającego greckiemu ἑκατόνταρχος.
- source_word: παρακαλῶν αὐτὸν
  choice: prosił go usilnie
  rationale: W tym kontekście παρακαλέω oznacza gorącą, poważną prośbę. „Prosił usilnie” zachowuje intensywność bez przesądzania o błaganiu na kolanach czy skrajnym tonie emocjonalnym.
theological_decisions: []
translation_notes:
  register: Współczesna, godna i płynna polszczyzna narracyjna. Dwukropek sygnalizuje, że wypowiedź setnika następuje w kolejnym wersecie. Nie przeniesiono mylących przypisów angielskiej warstwy konsultacyjnej, ponieważ ich markery nie odpowiadają wskazanym alternatywom; istotne niuanse leksykalne ujęto bezpośrednio w decyzjach translatorskich.
