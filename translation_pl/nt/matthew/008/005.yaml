  source_fidelity: Grecki dopełniacz niezależny został poprawnie oddany przez zdanie czasowe, a dopowiedzenie „Jezus” trafnie identyfikuje podmiot z kontekstu. „Setnik” wiernie oddaje ἑκατόνταρχος, zaś „usilnie prosił” dobrze przekazuje παρακαλῶν bez nadmiernego wzmacniania sensu. Czasownik „podszedł” jest możliwy, lecz προσῆλθεν w tym kontekście najprościej i idiomatycznie oddaje „przyszedł do niego”.
  naturalness: Tekst jest płynny i ma właściwy, godny rejestr narracyjny. Zmiana „podszedł do niego” na „przyszedł do niego” usuwa niepotrzebne zawężenie do fizycznego podejścia z bliska i lepiej brzmi w polskiej narracji biblijnej. Dwukropek jest uzasadniony, ponieważ prośba zostaje zacytowana w następnym wersecie.
  terminology: '„Kafarnaum” i „setnik” są utrwalonymi oraz zrozumiałymi polskimi formami. Nie są potrzebne przypisy: werset nie zawiera niuansu, który wymagałby objaśnienia, a angielskie przypisy nie stanowią poprawnych kotwic dla polskiego tekstu.'
