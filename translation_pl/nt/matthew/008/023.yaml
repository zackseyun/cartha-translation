  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: pl
  text: Gdy wsiadł do łodzi, jego uczniowie poszli za nim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: gdy wsiadł
  rationale: Aorystowy imiesłów wyraża tu okoliczność czasową, naturalnie oddaną po polsku zdaniem „gdy wsiadł”. Czasownik „wsiąść” jest zwyczajnym określeniem wejścia do łodzi.
- source_word: πλοῖον
  choice: łodzi
  rationale: W kontekście Jeziora Galilejskiego πλοῖον najnaturalniej oznacza łódź. Polski nie wymaga rozstrzygania między angielskim rodzajnikiem określonym i nieokreślonym.
- source_word: ἠκολούθησαν
  choice: poszli za
  rationale: Wyrażenie opisuje rzeczywiste podążenie uczniów za Jezusem, a zarazem zachowuje możliwe skojarzenie z uczniostwem obecne w ἀκολουθέω.
- source_word: μαθηταὶ
  choice: uczniowie
  rationale: „Uczniowie” to naturalny i utrwalony polski odpowiednik określenia μαθηταί w Ewangeliach.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: wsiadł / za nim / jego
  rationale: Wszystkie zaimki odnoszą się w kontekście do Jezusa; polska składnia pozwala pominąć zaimek podmiotowy przy „wsiadł”, zachowując pozostałe odniesienia.
theological_decisions:
- issue: Możliwy sens uczniostwa w ἀκολουθέω
  choice: poszli za nim
  alternative: towarzyszyli mu
  rationale: „Poszli za nim” przekazuje ruch fizyczny, nie usuwając szerszego skojarzenia z naśladowaniem Jezusa; nie rozwija go jednak w interpretacyjną parafrazę.
translation_notes:
  register: Współczesny, prosty i godny język narracyjny. Zdanie zachowuje czasową relację imiesłowu oraz naturalny polski szyk, bez zbędnego oznaczania określoności rzeczownika „łódź”.
