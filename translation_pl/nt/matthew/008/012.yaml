  source_fidelity: Grecki kontrast δέ, idiom „synowie królestwa”, przyszła strona bierna ἐκβληθήσονται oraz obraz płaczu i zgrzytania zębami zostały oddane trafnie. Wyrażenie „w ciemność na zewnątrz” nie stanowi jednak dobrego polskiego odpowiednika określonego, utrwalonego zwrotu τὸ σκότος τὸ ἐξώτερον.
  naturalness: „Lecz synowie królestwa”, „zostaną wyrzuceni”, „Tam będzie płacz i zgrzytanie zębami” są naturalne w godnym, współczesnym rejestrze biblijnym. „W ciemność na zewnątrz” brzmi składniowo niezręcznie i może być odczytane jako zwykłe wskazanie miejsca („w ciemność, która jest na zewnątrz”), zamiast jako nazwanie Matt. obrazu „zewnętrznej ciemności”.
  terminology: „Synowie królestwa” słusznie zachowuje formę i idiom grecki, a przypis objaśnia go bez narzucania interpretacji. „Ciemność zewnętrzna” jest w polszczyźnie biblijnej ustalonym i jednocześnie czytelnym odpowiednikiem greckiego wyrażenia.
