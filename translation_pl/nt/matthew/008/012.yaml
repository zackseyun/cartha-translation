  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pl
  text: Lecz synowie królestwa[a] zostaną wyrzuceni w ciemność zewnętrzną. Tam będzie płacz i zgrzytanie zębami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „synowie królestwa” — idiom oznaczający tych, których uważano za prawowitych dziedziców lub oczekiwanych uczestników królestwa.'
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Lecz synowie królestwa
  rationale: „Lecz” oddaje kontrast δέ z poprzednim zdaniem. Dosłowne „synowie królestwa” zachowuje semicki idiom oraz ironię dotyczącą tych, których uważano za należących do królestwa.
- source_word: ἐκβληθήσονται
  choice: zostaną wyrzuceni
  rationale: Forma przyszła strony biernej czasownika ἐκβάλλω wyraża przymusowe usunięcie; „zostaną wyrzuceni” jest mocne, współczesne i naturalne po polsku.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: w ciemność na zewnątrz
  rationale: Oddaje kierunek wyrażony przez εἰς oraz przestrzenny kontrast przymiotnika ἐξώτερον. W języku polskim brzmi naturalniej niż kalkowane „zewnętrzna ciemność”.
- source_word: ἐκεῖ
  choice: Tam
  rationale: Umieszczenie „Tam” na początku drugiego zdania zachowuje początkową, emfatyczną pozycję greckiego ἐκεῖ.
- source_word: ὁ κλαυθμὸς
  choice: płacz
  rationale: „Płacz” jest naturalnym i utrwalonym odpowiednikiem κλαυθμός, bez nadmiernego wzmacniania intensywności.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: zgrzytanie zębami
  rationale: To utrwalony polski zwrot biblijny, który idiomatycznie oddaje grecką konstrukcję.
theological_decisions:
- issue: Obraz wykluczenia i sądu
  choice: Zachowano obrazy wyrzucenia w ciemność oraz płaczu i zgrzytania zębami.
  alternative: Parafraza za pomocą terminów takich jak „piekło” lub „wieczna kara”.
  rationale: Tekst przedstawia surowy sąd i wykluczenie za pomocą obrazów, lecz nie używa w tym wersecie słowa „piekło” ani nie formułuje pełnego opisu natury kary.
- issue: Oddanie υἱοὶ w idiomie υἱοὶ τῆς βασιλείας
  choice: synowie królestwa
  alternative: dzieci królestwa; dziedzice królestwa
  rationale: „Synowie” zachowują gramatycznie męską formę grecką, idiom i jego zamierzoną ironię; przypis objaśnia reprezentatywny zakres wyrażenia bez rozstrzygania go w tekście głównym.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polszczyzny. Zachowano zwięzłość, paralelizm obrazów sądu oraz emfatyczne „Tam”; uniknięto zarówno archaizowania, jak i doktrynalnej parafrazy.
