source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: pl
  text: 'I powiedział do nich: „Dlaczego się boicie, ludzie małej wiary?” Wtedy wstał, zgromił wiatry i morze, a nastała wielka cisza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: bojaźliwi
  rationale: Oddaje nie tylko chwilowe odczuwanie lęku, lecz postawę zalęknienia wskazaną przez przymiotnik; zachowuje też związek z wyrzutem dotyczącym małej wiary.
- source_word: ὀλιγόπιστοι
  choice: ludzie małej wiary
  rationale: Naturalne po polsku określenie osób, którym brakuje ufności; zachowuje bezpośredni zwrot w liczbie mnogiej.
- source_word: ἐπετίμησεν
  choice: zgromił
  rationale: Zachowuje moc czasownika oznaczającego stanowcze skarcenie lub rozkaz, bez osłabiania go do neutralnego „uciszył”.
- source_word: τῇ θαλάσσῃ
  choice: jezioro
  rationale: W kontekście chodzi o Jezioro Galilejskie; polskie „jezioro” jest geograficznie naturalne, choć grecki rzeczownik dosłownie może znaczyć „morze”.
- source_word: γαλήνη μεγάλη
  choice: wielka cisza
  rationale: Oddaje zupełne uciszenie wzburzonej wody i zachowuje emfatyczne „wielka”; jest naturalniejsze w tym kontekście niż „wielki spokój”.
theological_decisions:
- issue: Związek lęku z małą wiarą
  choice: 'Zachowano oba elementy jako pytanie i bezpośredni zwrot: „Dlaczego jesteście bojaźliwi, ludzie małej wiary?”'
  alternative: „Czemu się boicie? Jakże mało macie wiary!”
  rationale: Tekst nie definiuje dokładnie charakteru ich małej wiary ani nie zamienia drugiego określenia w osobne zdanie; przekład zachowuje zwięzłą, napiętą formę oryginału.
- issue: Osobowe zgromienie żywiołów
  choice: „zgromił wichry i jezioro”
  alternative: „uciszył wiatr i jezioro”
  rationale: Zachowanie czasownika „zgromił” pozostawia niezwykły, autorytatywny charakter działania Jezusa, nie dopowiadając jego teologicznego znaczenia.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. „Wichry” nadają zdaniu podniosłość bez archaizacji i trafnie oddają liczbę mnogą ἀνέμοις. Imiesłów ἐγερθείς przełożono naturalnym polskim zdaniem „wstał”.
