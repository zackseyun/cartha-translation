review_pass:
  verdict: revise
  source_fidelity: Greckie ἐπετίμησεν trafnie oddano przez „zgromił”, a liczba mnoga „wiatry” odpowiada τοῖς ἀνέμοις. Jednak τῇ θαλάσσῃ brzmi dosłownie „morze”; kontekst Jeziora Galilejskiego nie wymaga zastąpienia tego wyrazu w przekładzie. γαλήνη μεγάλη to wielki, nastający spokój/cisza na wodzie; „wielka cisza” jest dopuszczalne i zachowuje obraz skutku uciszenia żywiołów.
  naturalness: „Bojaźliwi” jest zrozumiałe, lecz w nowoczesnej polszczyźnie brzmi książkowo i mniej naturalnie w bezpośrednim pytaniu. Idiom „Dlaczego się boicie?” naturalnie przekazuje sens δειλοί w tym kontekście. Należy też usunąć kropkę po cytacie zakończonym znakiem zapytania.
  terminology: „Ludzie małej wiary” dobrze przekazuje ὀλιγόπιστοι bez nadinterpretacji. „Zgromił” właściwie zachowuje stanowczy charakter ἐπετίμησεν. „Morze” powinno pozostać w tekście głównym jako odpowiednik θαλάσσῃ; ewentualne doprecyzowanie geograficzne byłoby materiałem na przypis, lecz nie jest konieczne.
  issues:
  - severity: medium
    issue: „jezioro” zamiast „morze”
    rationale: Choć chodzi o akwen galilejski, tekst grecki i angielski ślad audytowy mają „morze”. Zachowanie „morza” jest wierniejsze źródłu i nie wymaga interpretacyjnej lokalizacji.
  - severity: low
    issue: „bojaźliwi” jest mało współczesne
    rationale: W bezpośredniej wypowiedzi naturalniejsze „Dlaczego się boicie?” zachowuje zarzut lęku bez sugerowania trwałej cechy charakteru.
  - severity: low
