id: MAT.8.10
reference: Matthew 8:10
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: pl
  text: 'Gdy Jezus to usłyszał, zdumiał się i powiedział do tych, którzy szli za Nim: „Zaprawdę mówię wam: u nikogo w Izraelu nie znalazłem tak wielkiej wiary”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Gdy Jezus to usłyszał
  rationale: Imiesłów aorystu wyraża okoliczność czasową poprzedzającą główną czynność. Zaimek „to” jest naturalnym uzupełnieniem w języku polskim i odnosi się do wcześniejszych słów setnika.
- source_word: ἐθαύμασεν
  choice: zdumiał się
  rationale: Oddaje silne zdziwienie lub podziw wyrażone przez czasownik, a zarazem brzmi naturalnie i godnie we współczesnej polszczyźnie.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: do tych, którzy szli za Nim
  rationale: Imiesłów teraźniejszy wskazuje na osoby towarzyszące Jezusowi w tej chwili; sformułowanie nie narzuca im formalnego statusu uczniów.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Zachowuje uroczysty i emfatyczny charakter charakterystycznej formuły Jezusa, pozostając zrozumiałe we współczesnym języku religijnym.
- source_word: παρ’ οὐδενὶ
  choice: u nikogo
  rationale: Przyimek παρά z celownikiem wskazuje tutaj na osobę, u której lub w której przypadku stwierdza się daną cechę. „U nikogo” jest zwięzłym i naturalnym odpowiednikiem.
- source_word: τοσαύτην πίστιν
  choice: tak wielkiej wiary
  rationale: τοσαύτην podkreśla stopień lub rozmiar. Polski zwrot „tak wielka wiara” wyraźnie zachowuje tę intensywność.
- source_word: ἐν τῷ Ἰσραήλ
  choice: w Izraelu
  rationale: Bezpośrednie i idiomatyczne oddanie określenia odnoszącego się zarówno do wspólnoty Izraela, jak i jej środowiska.
- source_word: εὗρον
  choice: nie znalazłem
  rationale: Polski czas przeszły naturalnie oddaje grecki aoryst i w tym kontekście obejmuje doświadczenie Jezusa aż do chwili wypowiedzi.
theological_decisions:
- issue: Znaczenie πίστις
  choice: wiara
  alternative: ufność; zaufanie
  rationale: Kontekst wskazuje na pełne ufności uznanie władzy Jezusa przez setnika. „Wiara” zachowuje jednak szerokość greckiego pojęcia i jest najbardziej bezpośrednim odpowiednikiem bez zawężania sensu.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym rejestrze. Zachowano tradycyjne „Zaprawdę” ze względu na uroczystą funkcję formuły Ἀμὴν λέγω ὑμῖν. Wielka litera w zaimku „Nim” jest konwencją szacunku właściwą polskim przekładom biblijnym, nie zmianą sensu tekstu źródłowego.
