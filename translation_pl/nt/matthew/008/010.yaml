  source_fidelity: 'Tekst wiernie oddaje wszystkie elementy greckie: okoliczność uprzednią („Gdy Jezus to usłyszał”), reakcję Jezusa, adresatów będących przy nim, uroczystą formułę zapewnienia, negację oraz stopień wiary stwierdzony „w Izraelu”. „U nikogo w Izraelu” trafnie przekazuje παρ’ οὐδενὶ ... ἐν τῷ Ἰσραήλ, bez nieuzasadnionego zawężania do formalnej grupy uczniów.'
  naturalness: Przekład jest płynny, współczesny i zachowuje stosowny biblijny rejestr. „Zaprawdę mówię wam” jest nadal zrozumiałą i dobrze osadzoną w polskiej tradycji formułą dla Ἀμὴν λέγω ὑμῖν. „Którzy szli za Nim” naturalnie przedstawia osoby towarzyszące Jezusowi w tej chwili.
  terminology: „Wiara” jest właściwym, szerokim i neutralnym doktrynalnie odpowiednikiem πίστις w tym kontekście. „Tak wielkiej” poprawnie wyraża intensyfikujące τοσαύτην. Nazwa „Izrael” i wielka litera w zaimku odnoszonym do Jezusa są stosowne dla przyjętej konwencji przekładowej.
