  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: pl
  text: I oto[a] na morzu zerwała się potężna burza, tak że fale zalewały łódź[b]. On zaś spał.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo oddane jako „burza” często oznacza dosłownie „trzęsienie” lub „wstrząs”; tutaj kontekst wskazuje na gwałtowną burzę na morzu.
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „łódź była okrywana przez fale”.'
    reason: formal_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Naturalny, podniosły polski wykładnik zwracający uwagę, zachowujący nagłość i obrazowość greckiego sygnału dyskursywnego.
- source_word: σεισμὸς μέγας
  choice: potężna burza
  rationale: Choć σεισμός często oznacza trzęsienie lub wstrząs, kontekst morza, łodzi i fal wskazuje na gwałtowną burzę; „potężna” oddaje μέγας idiomatycznie.
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: na morzu zerwała się
  rationale: Polskie „zerwała się” naturalnie opisuje nagłe rozpoczęcie burzy, a „na morzu” zachowuje źródłowe θάλασσα bez geograficznego doprecyzowania do jeziora.
- source_word: ὥστε
  choice: tak że
  rationale: Jasno wprowadza rzeczywisty skutek gwałtownej burzy.
- source_word: τὸ πλοῖον
  choice: łódź
  rationale: W ewangelicznym kontekście niewielkiej jednostki na Morzu Galilejskim „łódź” jest naturalniejsze niż „statek”.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: fale zalewały łódź
  rationale: Oddaje trwającą czynność wyrażoną przez bezokolicznik czasu teraźniejszego strony biernej, a zarazem brzmi naturalnie po polsku; przypis zachowuje bardziej formalną możliwość „okrywały”.
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: On zaś spał
  rationale: „Zaś” zachowuje wyraźny kontrast, zaimek oddaje lekkie podkreślenie αὐτός, a niedokonane „spał” odpowiada trwającej czynności imperfectum.
theological_decisions:
- issue: Charakter zjawiska określonego słowem σεισμός
  choice: Oddano kontekstowo jako „burza”.
  alternative: „Trzęsienie”, „wstrząs” albo „trzęsienie morza”.
  rationale: To decyzja leksykalno-kontekstowa, nie doktrynalna. Obraz fal zalewających łódź wskazuje na gwałtowne wzburzenie morza, lecz dosłowniejszy zakres słowa zachowano w przypisie.
translation_notes:
  register: Współczesny, naturalny i godny rejestr polszczyzny. „I oto” zachowuje narracyjną żywość oryginału, natomiast krótka końcowa fraza uwydatnia kontrast między niebezpieczeństwem a snem Jezusa.
