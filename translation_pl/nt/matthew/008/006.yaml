  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: pl
  text: 'i mówiąc: „Panie, mój sługa[a] leży w domu sparaliżowany i strasznie cierpi[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „mój chłopiec” lub „moje dziecko”. Greckie słowo może oznaczać sługę albo dziecko; w kontekście setnika najlepiej pasuje „sługa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „jest ciężko dręczony”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: i mówiąc
  rationale: Imiesłowowa konstrukcja zachowuje sposób powiązania tej wypowiedzi z poprzedzającą narracją; w polszczyźnie jest zrozumiała i nie wymaga zamiany na formę osobową.
- source_word: Κύριε
  choice: Panie
  rationale: Forma „Panie” może wyrażać zarówno pełen szacunku zwrot, jak i tytuł o głębszym znaczeniu, dzięki czemu zachowuje otwartość greckiego κύριε.
- source_word: ὁ παῖς μου
  choice: mój sługa
  rationale: παῖς może oznaczać sługę, chłopca albo dziecko. W kontekście setnika najbardziej prawdopodobny jest „sługa”, natomiast pozostałe możliwości podano w przypisie.
- source_word: βέβληται
  choice: leży
  rationale: Perfectum strony biernej opisuje stan, w jakim znajduje się chory. Naturalne polskie „leży” oddaje ten rezultat bez niezręcznego dosłownego „został położony”.
- source_word: ἐν τῇ οἰκίᾳ
  choice: w domu
  rationale: Jest to naturalny polski odpowiednik określenia miejsca, zachowujący jego prosty sens.
- source_word: παραλυτικός
  choice: sparaliżowany
  rationale: Przymiotnik opisuje stan sługi; współczesne „sparaliżowany” brzmi naturalniej niż rzeczownikowe „paralityk”.
- source_word: δεινῶς βασανιζόμενος
  choice: strasznie cierpi
  rationale: Zwrot wyraża dotkliwe cierpienie lub udrękę. „Strasznie cierpi” jest współczesne i czytelne, a mocniejszy wariant „jest ciężko dręczony” zachowano w przypisie.
theological_decisions:
- issue: Znaczenie κύριε jako zwrotu do Jezusa
  choice: Panie
  alternative: Proszę pana
  rationale: Tekst może wyrażać zarówno pełen szacunku zwrot, jak i uznanie wyższego autorytetu Jezusa. „Panie” nie ogranicza wypowiedzi wyłącznie do grzecznościowego sensu ani nie rozstrzyga jej jako pełnego wyznania wiary.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Zachowano imiesłowowe nawiązanie do poprzedniego wersetu oraz niejednoznaczność zwrotu „Panie”. Przypisy umieszczono bezpośrednio przy wyrazach, których dotyczą.
