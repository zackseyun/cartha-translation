  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: pl
  text: 'I podszedł do niego jeden uczony w Piśmie i powiedział: „Nauczycielu, pójdę za tobą, dokądkolwiek się udasz[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dokądkolwiek odejdziesz” albo „dokądkolwiek pójdziesz”. Grecki czasownik może wyraźniej oznaczać odejście, choć tutaj naturalnie odnosi się do udania się w dowolne miejsce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: podszedł
  rationale: Imiesłów aorystu wskazuje, że człowiek zbliżył się do Jezusa przed wypowiedzeniem słów; polskie „podszedł” naturalnie oddaje ruch ku niemu.
- source_word: εἷς
  choice: jeden
  rationale: Zachowano liczebnik wprowadzający konkretną, pojedynczą osobę.
- source_word: γραμματεὺς
  choice: uczony w Piśmie
  rationale: To utrwalone i zrozumiałe współczesne określenie żydowskiego znawcy i nauczyciela Prawa; trafniej komunikuje funkcję niż samo „pisarz”.
- source_word: Διδάσκαλε
  choice: Nauczycielu
  rationale: Bezpośrednio oddaje tytuł διδάσκαλος, nie wzmacniając go do „Mistrzu” ani nie zastępując tytułem „Rabbi”.
- source_word: ἀκολουθήσω
  choice: pójdę za tobą
  rationale: Naturalny polski zwrot zachowujący zarówno sens fizycznego podążania, jak i możliwy sens uczniostwa.
- source_word: ὅπου ἐὰν
  choice: dokądkolwiek
  rationale: Oddaje nieokreślony i nieograniczony zakres greckiej konstrukcji względnej.
- source_word: ἀπέρχῃ
  choice: się udasz
  rationale: Naturalnie wyraża przemieszczanie się ku dowolnemu miejscu, zachowując nieco wyraźniej niż ogólne „pójdziesz” odcień odejścia obecny w ἀπέρχομαι.
theological_decisions:
- issue: Tytuł διδάσκαλος skierowany do Jezusa
  choice: Nauczycielu
  alternative: Mistrzu; Rabbi
  rationale: „Nauczycielu” zachowuje podstawowe znaczenie tytułu i respekt wypowiedzi, nie dodając silniejszej rangi ani niewyrażonego w tekście tytułu żydowskiego.
translation_notes:
  register: Współczesny, godny styl narracyjny. „Uczony w Piśmie” jest czytelniejsze i trafniejsze historycznie niż dosłowne „pisarz”, a „pójdę za tobą” zachowuje zamierzoną dwuznaczność między towarzyszeniem Jezusowi a zostaniem jego uczniem.
