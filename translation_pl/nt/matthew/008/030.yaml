  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: pl
  text: W pewnej odległości od nich pasło się duże stado świń[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „daleko od nich”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: pasło się
  rationale: Konstrukcja ἦν z imiesłowem βοσκομένη opisuje trwającą czynność. Łagodny łącznik δέ nie wymaga tu osobnego odpowiednika w naturalnej polskiej narracji.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: w pewnej odległości od nich
  rationale: Wyrażenie wskazuje na przestrzenne oddalenie. Ten wariant brzmi naturalnie i zachowuje możliwość rozumienia większej odległości, odnotowaną w przypisie.
- source_word: ἀγέλη
  choice: stado
  rationale: „Stado” jest zwykłym i trafnym polskim określeniem grupy zwierząt.
- source_word: χοίρων
  choice: świń
  rationale: To współczesny, neutralny odpowiednik rzeczownika χοῖρος.
- source_word: πολλῶν
  choice: duże
  rationale: Przy rzeczowniku zbiorowym „stado” naturalny polski zwrot „duże stado” przekazuje znaczenie liczebności zawarte w πολλῶν.
- source_word: βοσκομένη
  choice: pasło się
  rationale: Imiesłów opisuje zwierzęta pobierające pokarm. „Pasło się” jest jasne i nie wprowadza niewspomnianego w tekście działania pasterzy.
