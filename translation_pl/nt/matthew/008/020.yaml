  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: pl
  text: 'Jezus mówi mu: „Lisy mają nory, a ptaki nieba — gniazda[a], lecz Syn Człowieczy[b] nie ma gdzie położyć głowy”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „miejsca schronienia” lub „miejsca odpoczynku”.'
    reason: lexical_alternative
  - marker: b
    text: '„Syn Człowieczy” to używane przez Jezusa określenie samego siebie; możliwy jest także przekład: „Syn Człowieka”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: mówi
  rationale: Czas teraźniejszy zachowuje grecki praesens historicum, które również po polsku może ożywiać narrację.
- source_word: ἀλώπεκες
  choice: lisy
  rationale: Bezpośredni i naturalny polski odpowiednik rzeczownika w liczbie mnogiej.
- source_word: φωλεούς
  choice: nory
  rationale: W odniesieniu do lisów „nory” są współczesnym i precyzyjnym określeniem ich schronień.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ptaki nieba
  rationale: Sformułowanie zachowuje obraz οὐρανός i podniosły, biblijny ton, pozostając zrozumiałe we współczesnej polszczyźnie.
- source_word: κατασκηνώσεις
  choice: gniazda
  rationale: W kontekście ptaków „gniazda” są najbardziej naturalnym odpowiednikiem; szerszy sens miejsc schronienia lub odpoczynku odnotowano w przypisie.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalona polska forma tytułu zachowuje jego rozpoznawalność, możliwe nawiązania biblijne oraz nierozstrzygnięte warstwy znaczeniowe.
- source_word: οὐκ ἔχει ποῦ
  choice: nie ma gdzie
  rationale: Naturalna polska konstrukcja wiernie oddająca negację połączoną z ποῦ.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: położyć głowy
  rationale: Naturalny polski zwrot zachowujący konkretny obraz położenia głowy i braku miejsca odpoczynku.
theological_decisions:
- issue: Oddanie samookreślenia Jezusa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn Człowieka / Człowiek
  rationale: „Syn Człowieczy” zachowuje tradycyjny tytuł, jego możliwy związek z Dn 7 oraz napięcie między zwykłym określeniem człowieka a znaczeniem tytularnym. Parafraza „Człowiek” zbyt mocno rozstrzygałaby sens.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Zachowano narracyjny czas teraźniejszy oraz utrwalony tytuł „Syn Człowieczy”; szyk i interpunkcja uwydatniają kontrast między schronieniem zwierząt a brakiem miejsca odpoczynku Jezusa.
