id: MAT.8.8
reference: Matthew 8:8
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: pl
  text: 'Setnik odpowiedział: „Panie, nie jestem godny, abyś wszedł pod mój dach. Powiedz tylko słowo[a], a mój sługa[b] zostanie uzdrowiony”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „powiedz słowem”; sens: „wypowiedz słowo”.'
    reason: lexical_alternative
  - marker: b
    text: Greckie słowo może również znaczyć „chłopiec” lub „dziecko”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: odpowiedział
  rationale: Imiesłów ἀποκριθείς wraz z czasownikiem ἔφη tworzy typowe greckie wprowadzenie odpowiedzi. Jedno polskie „odpowiedział” oddaje jego sens bez nienaturalnego „odpowiadając, powiedział”.
- source_word: ἑκατόνταρχος
  choice: setnik
  rationale: Tradycyjne, precyzyjne i nadal zrozumiałe polskie określenie rzymskiego dowódcy oddziału liczącego nominalnie około stu żołnierzy.
- source_word: Κύριε
  choice: Panie
  rationale: Forma wołacza zachowuje zarówno szacunek wobec Jezusa, jak i możliwy głębszy wydźwięk tytułu κύριος, bez rozstrzygania go jako wyłącznie grzecznościowego zwrotu.
- source_word: ἱκανός
  choice: godny
  rationale: W tym kontekście chodzi o poczucie niegodności wobec przyjęcia Jezusa we własnym domu, nie zaś jedynie o brak zdolności lub kompetencji.
- source_word: ὑπὸ τὴν στέγην
  choice: pod mój dach
  rationale: Zachowuje obrazowy grecki idiom, który jest również naturalny i zrozumiały po polsku.
- source_word: μόνον εἰπὲ λόγῳ
  choice: Powiedz tylko słowo
  rationale: Naturalne polskie sformułowanie zachowuje ograniczające μόνον oraz wzmiankę o słowie jako wystarczającym środku dokonania uzdrowienia.
- source_word: ἰαθήσεται
  choice: zostanie uzdrowiony
  rationale: Forma bierna wiernie oddaje przyszły bierny czasownika ἰάομαι i nie dopowiada wprost wykonawcy uzdrowienia.
- source_word: παῖς
  choice: sługa
  rationale: Kontekst setnika oraz paralelna relacja sprzyjają znaczeniu „sługa”, ale szeroki zakres słowa παῖς zostaje zachowany w przypisie.
theological_decisions:
- issue: Znaczenie κύριος w zwrocie do Jezusa
  choice: Panie
  alternative: Proszę pana
  rationale: „Panie” zachowuje zwykłą wartość tytułu κύριος oraz możliwy wydźwięk chrystologiczny, nie wymuszając rozstrzygnięcia, czy mówiący używa go wyłącznie jako zwrotu grzecznościowego.
- issue: Znaczenie παῖς
  choice: sługa
  alternative: chłopiec lub dziecko
  rationale: „Sługa” najlepiej pasuje do przedstawionej sytuacji, lecz greckie słowo może również oznaczać chłopca lub dziecko; dlatego nie usuwa się tej rzeczywistej wieloznaczności.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Zachowano biblijny, lecz nadal naturalny po polsku obraz „pod mój dach”. Uniknięto niezręcznego dosłownego powtórzenia „odpowiadając, powiedział”.
