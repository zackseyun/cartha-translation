  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: pl
  text: 'Lecz Jezus mówi mu: „Pójdź za mną, a umarłym[a] zostaw, by pogrzebali ich własnych umarłych”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pierwsze słowo „umarli” często rozumie się przenośnie: ludzie duchowo nieczuli mogą pogrzebać tych, którzy umarli fizycznie.'
    reason: alternatywne odczytanie
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: W kontekście wprowadza łagodny kontrast między prośbą ucznia a stanowczą odpowiedzią Jezusa, bez nadmiernego wzmacniania przeciwstawienia.
- source_word: λέγει
  choice: mówi
  rationale: Zachowuje grecki czas teraźniejszy użyty jako praesens historicum oraz żywość narracji.
- source_word: Ἀκολούθει μοι
  choice: Pójdź za mną
  rationale: Naturalne i utrwalone po polsku wezwanie do osobistego pójścia za Jezusem; obejmuje zarówno dosłowne podążanie, jak i uczniostwo.
- source_word: ἄφες
  choice: zostaw
  rationale: Oddaje wezwanie do pozostawienia tej powinności innym, a nie jedynie udzielenia im pozwolenia.
- source_word: νεκρούς ... νεκρούς
  choice: umarłym ... umarłych
  rationale: Zachowuje celowe powtórzenie tego samego określenia oraz wynikającą z niego grę znaczeń, nie dopisując w tekście głównym słowa „duchowo”.
- source_word: θάψαι
  choice: grzebanie
  rationale: Rzeczownik odczasownikowy po „zostaw” tworzy w tym zdaniu zwięzłą i czytelną polską konstrukcję, zachowując czynność wyrażoną greckim bezokolicznikiem.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: ich własnych umarłych
  rationale: „Własnych” zachowuje nacisk wyrażony przez grecki zaimek zwrotny ἑαυτῶν.
theological_decisions:
- issue: Znaczenie pierwszego wystąpienia słowa „umarli”
  choice: Tekst główny zachowuje brzmienie „umarłym ... umarłych” bez dopowiedzenia „duchowo”.
  alternative: Pierwsze „umarli” można rozumieć przenośnie jako ludzi duchowo nieczułych, a drugie dosłownie jako zmarłych fizycznie.
  rationale: Greka używa w obu miejscach tego samego słowa. Zachowanie powtórzenia pozostawia zamierzoną prowokacyjność, wieloznaczność i napięcie teologiczne wypowiedzi Jezusa.
translation_notes:
  register: Współczesny, godny i zwięzły język. Historyczny czas teraźniejszy „mówi” zachowano zgodnie z greką, a utrwalone „Pójdź za mną” brzmi naturalnie w polskim kontekście uczniostwa.
