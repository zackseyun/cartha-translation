  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: pl
  text: Kiedy Jezus przyszedł do domu Piotra, zobaczył teściową Piotra, która leżała i gorączkowała.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: Kiedy Jezus przyszedł
  rationale: Aorystowy imiesłów wyraża tu relację czasową; zdanie podrzędne z „kiedy” brzmi naturalnie po polsku i zachowuje kolejność wydarzeń.
- source_word: οἰκίαν Πέτρου
  choice: do domu Piotra
  rationale: Proste i naturalne oddanie relacji dzierżawczej; „dom” odpowiada οἰκία bez niepotrzebnego zawężania znaczenia.
- source_word: πενθερὰν αὐτοῦ
  choice: jego teściową
  rationale: πενθερά oznacza „teściową”, a zaimek odnosi się w kontekście do Piotra.
- source_word: βεβλημένην
  choice: leżała
  rationale: Imiesłów perfectum biernego od βάλλω opisuje utrzymujący się stan osoby położonej lub leżącej. Nie dodano „w łóżku”, ponieważ nie występuje ono w tekście greckim.
- source_word: πυρέσσουσαν
  choice: gorączkowała
  rationale: Imiesłów czasu teraźniejszego opisuje trwający stan chorobowy; „gorączkowała” jest zwięzłym i naturalnym polskim odpowiednikiem.
theological_decisions:
- issue: Odniesienie zaimka αὐτοῦ
  choice: 'Zaimek odnosi się do Piotra: chodzi o teściową Piotra.'
  alternative: Formalnie polskie „jego” mogłoby zostać odczytane jako odnoszące się do Jezusa.
  rationale: Najbliższym i kontekstowo jednoznacznym odniesieniem w grece jest Piotr. Polski szyk umieszcza „jego” bezpośrednio po „Piotra”, zachowując naturalność i właściwe odniesienie bez wyciągania dodatkowych wniosków doktrynalnych.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Konstrukcję imiesłowową rozwinięto w zdanie „która leżała i gorączkowała”, co jest naturalniejsze po polsku, a zarazem zachowuje dwa równoległe opisy stanu kobiety.
