id: MAT.8.32
reference: Matthew 8:32
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: pl
  text: 'I powiedział im: „Idźcie”. Wtedy wyszły i weszły w świnie. I oto całe stado popędziło w dół po stromym zboczu[a] do morza i zginęło w wodach[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „po urwisku” albo „po stromej skarpie”. Greckie słowo może oznaczać strome zbocze, skarpę lub urwisko.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „utonęło w wodzie”. Dosłownie: „umarło w wodach”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Idźcie
  rationale: Krótki tryb rozkazujący naturalnie oddaje zwięzłość i stanowczość polecenia, nie dodając znaczenia nieobecnego w grece.
- source_word: ἐξελθόντες ἀπῆλθον εἰς τοὺς χοίρους
  choice: wyszły i weszły w świnie
  rationale: Imiesłów oznacza wyjście demonów z opętanych, a dalsza fraza ich przemieszczenie się do wnętrza świń. W języku polskim „weszły w świnie” jest jasne w kontekście i mniej niezręczne niż dosłowne „odeszły w świnie”.
- source_word: ἰδοὺ
  choice: I oto
  rationale: Zachowuje narracyjny sygnał zwracający uwagę na nagłe i niezwykłe wydarzenie.
- source_word: πᾶσα ἡ ἀγέλη
  choice: całe stado
  rationale: Naturalny polski odpowiednik rzeczownika zbiorowego wraz z pełną siłą πᾶσα.
- source_word: ὥρμησεν
  choice: popędziło
  rationale: Oddaje gwałtowny, energiczny ruch stada, bez sugerowania samego upadku.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: w dół po stromym zboczu
  rationale: κρημνός może oznaczać strome zbocze, skarpę lub urwisko. To sformułowanie zachowuje kierunek ruchu i nie przesądza, że chodziło o pionową ścianę.
- source_word: τὴν θάλασσαν
  choice: do morza
  rationale: Oddaje podstawowe znaczenie θάλασσα i zachowuje sposób nazwania akwenu w tekście źródłowym.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: zginęło w wodach
  rationale: Greka mówi dosłownie o śmierci w wodach. „Zginęło” brzmi naturalnie w odniesieniu do całego stada i nie dopowiada wprost sposobu śmierci.
theological_decisions:
- issue: Stopień doprecyzowania sposobu śmierci stada
  choice: zginęło w wodach
  alternative: utonęło w wodzie
  rationale: Kontekst wyraźnie nasuwa utonięcie, lecz czasownik ἀπέθανον oznacza po prostu „umarły/zginęły”. Tekst główny zachowuje sformułowanie źródłowe, a interpretacyjne doprecyzowanie podano w przypisie.
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano zwięzłość polecenia Jezusa oraz emfatyczne „I oto”. Żeńska forma „wyszły” odsyła w kontekście do demonów/nieczystych duchów, bez ponownego wprowadzania rzeczownika nieobecnego w tym zdaniu greckim.
