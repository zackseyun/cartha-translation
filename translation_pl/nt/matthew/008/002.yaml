  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: pl
  text: 'A oto podszedł człowiek chory na trąd i oddał Mu pokłon[a], mówiąc: „Panie, jeśli zechcesz, możesz mnie oczyścić”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „oddał Mu cześć”. Grecki czasownik może oznaczać pokłon wyrażający szacunek, złożenie hołdu albo oddanie czci religijnej — zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: oto
  rationale: Zachowuje funkcję partykuły kierującej uwagę i narracyjną wyrazistość, a zarazem brzmi naturalnie i godnie po polsku.
- source_word: λεπρὸς
  choice: człowiek chory na trąd
  rationale: Oddaje substantywizowany przymiotnik jako określenie osoby dotkniętej chorobą, nie sprowadzając jej tożsamości do schorzenia. „Trąd” zachowuje tradycyjne określenie szerzej rozumianej starożytnej choroby skórnej.
- source_word: προσελθὼν
  choice: podszedł
  rationale: Naturalnie i zwięźle wyraża zbliżenie się do Jezusa.
- source_word: προσεκύνει
  choice: oddał Mu pokłon
  rationale: Oddaje gest czci i uniżenia, nie rozstrzygając nadmiernie, czy chodzi o kult religijny w pełnym sensie.
- source_word: Κύριε
  choice: Panie
  rationale: 'Zachowuje zakres uroczystego zwrotu do Jezusa: od uznania Jego autorytetu po możliwy ciężar chrystologiczny.'
- source_word: ἐὰν θέλῃς
  choice: jeśli zechcesz
  rationale: Naturalnie wyraża warunek odnoszący się do woli Jezusa, bez sugerowania wątpliwości co do Jego mocy.
- source_word: δύνασαί
  choice: możesz
  rationale: Współczesny i bezpośredni polski odpowiednik wskazujący na zdolność lub moc.
- source_word: καθαρίσαι
  choice: oczyścić mnie
  rationale: Zachowuje fizyczny i rytualny wymiar oczyszczenia związany z chorobami określanymi jako trąd, którego samo „uzdrowić” nie oddawałoby w pełni.
theological_decisions:
- issue: Znaczenie προσκυνέω w odniesieniu do Jezusa
  choice: oddał Mu pokłon
  alternative: padł przed Nim na kolana; oddał Mu cześć; uwielbił Go
  rationale: Czasownik może oznaczać pokłon, hołd albo akt kultu. Przekład główny zachowuje wyraźną cześć okazaną Jezusowi, ale nie rozstrzyga przedwcześnie pełnego teologicznego sensu gestu.
translation_notes:
  register: Współczesna, godna polszczyzna narracyjna. „A oto” zachowuje uwagę kierowaną przez tekst grecki; szyk wypowiedzi pozostaje prosty i zrozumiały. Wielka litera w zaimku „Mu” odpowiada utrwalonej polskiej konwencji odnoszenia zaimków do Jezusa.
