  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: pl
  text: 'Demony zaś błagały Go, mówiąc: „Jeśli nas wypędzasz, poślij nas w stado świń”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: Demony zaś
  rationale: „Demony” jest naturalnym i precyzyjnym określeniem osobowych złych duchów; „zaś” oddaje narracyjne lub lekko kontrastujące δέ bez nadmiernego wzmacniania przeciwstawienia.
- source_word: παρεκάλουν
  choice: błagały
  rationale: Imperfectum wskazuje na trwającą czynność; polska forma niedokonana „błagały” zachowuje ten aspekt bez potrzeby dodawania „wciąż”.
- source_word: λέγοντες
  choice: mówiąc
  rationale: Imiesłów współczesny naturalnie zachowuje grecką konstrukcję wprowadzającą mowę bezpośrednią.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Jeśli nas wypędzasz
  rationale: „Jeśli” zachowuje warunkowość, a „wypędzasz” dobrze oddaje ἐκβάλλω w kontekście wypędzania demonów oraz aspekt greckiego czasu teraźniejszego.
- source_word: ἀπόστειλον ἡμᾶς
  choice: poślij nas
  rationale: Tryb rozkazujący aorystu wyraża bezpośrednią prośbę; „poślij nas” jest zwięzłe i naturalne.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: w stado świń
  rationale: „Stado świń” jest współczesnym, jednoznacznym odpowiednikiem wyrażenia greckiego; przy czasowniku ruchu naturalny jest przyimek „w” z biernikiem.
theological_decisions:
- issue: Określenie złych duchów
  choice: demony
  alternative: złe duchy
  rationale: „Demony” bezpośrednio odpowiada δαίμονες i zachowuje przedstawienie ich jako osobowych istot przemawiających do Jezusa, bez dodawania objaśnień doktrynalnych.
- issue: Warunkowy charakter wypowiedzi
  choice: Jeśli nas wypędzasz
  alternative: Skoro nas wypędzasz
  rationale: Greckie Εἰ formalnie wprowadza warunek. Przekład „jeśli” zachowuje możliwą retoryczną lub rzeczywistą warunkowość, zamiast rozstrzygać ją jako pewnik.
translation_notes:
  register: Współczesny, godny język narracyjny. Zachowano szyk i zwięzłość oryginału tam, gdzie brzmią naturalnie po polsku; wielka litera w zaimku „Go” odpowiada polskiej konwencji szacunku wobec Jezusa.
