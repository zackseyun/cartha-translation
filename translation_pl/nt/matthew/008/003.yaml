id: MAT.8.3
reference: Matthew 8:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: pl
  text: 'Wyciągnął rękę, dotknął go i powiedział: „Chcę. Bądź oczyszczony”. I natychmiast został oczyszczony z trądu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo tradycyjnie tłumaczone jako „trąd” może oznaczać różne poważne choroby skóry, nie tylko współczesną chorobę Hansena.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: Wyciągnął rękę
  rationale: Polski czasownik osobowy naturalnie oddaje czynność poprzedzającą dotknięcie, zachowując konkretny gest opisany w grece.
- source_word: ἥψατο αὐτοῦ
  choice: dotknął go
  rationale: ἅπτομαι z dopełnieniem w dopełniaczu ma tutaj zwykłe znaczenie „dotknąć”.
- source_word: Θέλω
  choice: Chcę
  rationale: Zwięzła odpowiedź bezpośrednio podejmuje pytanie chorego o wolę Jezusa; zachowuje volitywny sens greckiego czasownika bez dodawania odcienia czasu przyszłego.
- source_word: καθαρίσθητι
  choice: Bądź oczyszczony
  rationale: Strona bierna i słownictwo oczyszczenia zachowują zarówno wymiar fizyczny, jak i związany z czystością rytualną.
- source_word: εὐθέως
  choice: natychmiast
  rationale: Oddaje nacisk tekstu na bezzwłoczny skutek.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: został oczyszczony z trądu
  rationale: Naturalna polska konstrukcja zachowuje słownictwo oczyszczenia, choć dla płynności przenosi uwagę z choroby jako podmiotu gramatycznego na uzdrowionego człowieka.
- source_word: ἡ λέπρα
  choice: trąd
  rationale: Tradycyjny i rozpoznawalny odpowiednik; przypis wyjaśnia, że starożytny zakres terminu był szerszy niż współczesna choroba Hansena.
theological_decisions:
- issue: Znaczenie καθαρίζω w opisie uzdrowienia
  choice: W rozkazie i opisie skutku zachowano język oczyszczenia.
  alternative: Oddać oba miejsca czasownikiem „uzdrowić”.
  rationale: Greka łączy fizyczne usunięcie choroby z kategorią czystości; samo „uzdrowić” zatarłoby ten wymiar.
- issue: Znaczenie Θέλω w odpowiedzi Jezusa
  choice: Chcę.
  alternative: Jestem gotów; Uczynię to.
  rationale: „Chcę” najściślej odpowiada greckiemu czasownikowi i bezpośrednio odpowiada na wcześniejsze odwołanie do woli Jezusa, nie wprowadzając nieobecnego w tekście czasu przyszłego.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Krótkie „Chcę” zachowuje stanowczość odpowiedzi. Końcową składnię ukształtowano naturalnie po polsku, zachowując powtórzenie słownictwa oczyszczenia.
