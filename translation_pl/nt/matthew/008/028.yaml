id: MAT.8.28
reference: Matthew 8:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: pl
  text: Gdy przybył na drugi brzeg, do krainy Gadareńczyków[a], z grobowców wyszli mu naprzeciw dwaj opętani przez demony. Byli niezwykle groźni, tak że nikt nie mógł przejść tamtą drogą.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Niektóre rękopisy mają: „Gergezeńczyków” lub „Gerazeńczyków” zamiast „Gadareńczyków”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Gdy przybył
  rationale: Dopełniacz niezależny oddano naturalnym polskim zdaniem czasowym, zachowując następstwo wydarzeń.
- source_word: τὸ πέραν
  choice: na drugi brzeg
  rationale: W kontekście przeprawy przez jezioro wyrażenie oznacza przeciwległy brzeg.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: krainy Gadareńczyków
  rationale: 'χώρα oznacza krainę, okolicę lub terytorium; forma „Gadareńczyków” odpowiada tekstowi SBLGNT: Γαδαρηνῶν.'
- source_word: ὑπήντησαν αὐτῷ
  choice: wyszli mu naprzeciw
  rationale: Polski zwrot dobrze oddaje spotkanie kogoś nadchodzącego i łączy się naturalnie z imiesłowem ἐξερχόμενοι.
- source_word: δύο δαιμονιζόμενοι
  choice: dwaj opętani przez demony
  rationale: Oddaje dwóch mężczyzn znajdujących się pod władzą demonów, bez używania niejasnego neologizmu.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: z grobowców
  rationale: Miejsce, z którego wychodzili, włączono w naturalną polską konstrukcję „wyszli mu naprzeciw z grobowców”.
- source_word: χαλεποὶ λίαν
  choice: tak bardzo groźni
  rationale: χαλεπός w tym kontekście wskazuje na niebezpieczną, budzącą strach gwałtowność; „groźni” nie zawęża znaczenia wyłącznie do przemocy fizycznej. λίαν oddano przez „bardzo”.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: że nikt nie mógł przejść
  rationale: Konstrukcję skutkową oddano idiomatycznie; ἰσχύω wyraża tutaj możność, nie tylko siłę fizyczną.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: tamtą drogą
  rationale: Narzędnik naturalnie wyraża po polsku trasę przemieszczania się wskazaną przez διά z dopełniaczem.
theological_decisions:
- issue: Sposób oddania demonicznego zniewolenia
  choice: opętani przez demony
  alternative: będący pod władzą demonów
  rationale: Tradycyjne i zrozumiałe współczesnym czytelnikom sformułowanie oddaje realne działanie demonów, nie precyzując ponad tekst mechanizmu ani stopnia ich władzy.
- issue: Wariant nazwy mieszkańców regionu
  choice: Gadareńczyków
  alternative: Gergezeńczyków lub Gerazeńczyków
  rationale: Tekst główny idzie za odczytaniem Γαδαρηνῶν w SBLGNT, a ważne warianty rękopiśmienne zachowano w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie greckie podzielono na dwa polskie zdania dla klarowności, zachowując wszystkie relacje znaczeniowe. Uniknięto zarówno archaicznego „nader srodzy”, jak i zawężającego „agresywni”.
