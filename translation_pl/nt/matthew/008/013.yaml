  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: pl
  text: 'Jezus powiedział do setnika: „Idź. Niech ci się stanie tak, jak uwierzyłeś”. I w tej godzinie jego sługa[a] został uzdrowiony.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „chłopiec” albo „dziecko”. Greckie παῖς może oznaczać sługę lub młodą osobę. W tym kontekście „sługa” najlepiej pasuje do podwładnego setnika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: setnika
  rationale: „Setnik” to utrwalone i precyzyjne polskie określenie rzymskiego oficera dowodzącego centurią.
- source_word: Ὕπαγε
  choice: Idź
  rationale: Prosty tryb rozkazujący naturalnie oddaje polecenie odejścia bez dodawania treści.
- source_word: ὡς ἐπίστευσας
  choice: tak, jak uwierzyłeś
  rationale: Zachowuje czasownikowy i osobisty charakter greckiego ἐπίστευσας, nie zastępując go bardziej interpretacyjnym rzeczownikiem „wiara”.
- source_word: γενηθήτω σοι
  choice: Niech ci się stanie
  rationale: Naturalna, a zarazem bliska grece konstrukcja oddająca rozkazująco-przyzwalający charakter aorystycznej formy biernej.
- source_word: παῖς
  choice: sługa
  rationale: W kontekście podwładnego setnika najlepiej pasuje „sługa”, choć grecki wyraz może także oznaczać chłopca lub dziecko; wieloznaczność zachowano w przypisie.
- source_word: ἰάθη
  choice: został uzdrowiony
  rationale: Standardowo oddaje bierną formę czasownika oznaczającego uzdrowienie lub przywrócenie zdrowia.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: w tej godzinie
  rationale: Zachowuje dosłowny wyraz czasowy bez rozstrzygania, czy chodzi o dokładnie ten sam moment, czy szerzej o tę porę.
theological_decisions:
- issue: Oddanie πιστεύω
  choice: uwierzyłeś
  alternative: zaufałeś / miałeś wiarę
  rationale: „Uwierzyłeś” zachowuje czasownikową formę oraz standardowy biblijny język wiary, nie zawężając znaczenia do samego zaufania ani nie przekształcając go w rzeczownik.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Zachowano zwięzłość wypowiedzi Jezusa oraz dosłowny zwrot czasowy „w tej godzinie”. Zaimek „jego” doprecyzowuje naturalnie w polszczyźnie, do kogo należał sługa.
