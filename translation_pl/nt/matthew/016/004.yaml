  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: pl
  text: Złe i cudzołożne[a] pokolenie szuka znaku, lecz żaden znak nie będzie mu dany oprócz znaku Jonasza[b]. Zostawiwszy ich, odszedł.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „niewierne”. Grecki wyraz dosłownie oznacza „cudzołożne” i prawdopodobnie nawiązuje do prorockiego obrazu niewierności wobec Boga.'
    reason: lexical_alternative
  - marker: b
    text: '„Znak Jonasza” zostaje objaśniony w Mt 12,39–40: trzy dni i trzy noce Jonasza stanowią wzorzec odniesiony do Syna Człowieczego.'
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: pokolenie
  rationale: Najbliższy i utrwalony w kontekście Ewangelii Mateusza odpowiednik, odnoszący się do współczesnej Jezusowi grupy ludzi bez zawężania go do całego narodu.
- source_word: πονηρὰ
  choice: złe
  rationale: Bezpośrednio oddaje ocenę moralną zawartą w πονηρά, a zarazem brzmi naturalnie we współczesnej polszczyźnie.
- source_word: μοιχαλὶς
  choice: cudzołożne
  rationale: Zachowuje dosadną metaforę cudzołóstwa oraz możliwe echo prorockiego języka niewierności wobec Boga, nie sprowadzając jej do jednej interpretacji.
- source_word: σημεῖον
  choice: znak
  rationale: Oddaje grecki rzeczownik bez dopowiadania, że chodzi wyłącznie o cud; funkcję potwierdzającą znaku wskazuje kontekst.
- source_word: ἐπιζητεῖ
  choice: szuka
  rationale: Naturalny odpowiednik czasownika oznaczającego usilne poszukiwanie lub domaganie się; nie wzmacnia ponad tekst tonu żądania.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: żaden znak nie będzie mu dany
  rationale: Zachowuje stronę bierną i odnosi zaimek do rodzaju nijakiego polskiego słowa „pokolenie”.
- source_word: εἰ μὴ
  choice: oprócz
  rationale: Jasno wprowadza jedyny wyjątek od wcześniejszego zaprzeczenia.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: znak Jonasza
  rationale: Zachowuje zwięzłą i częściowo otwartą znaczeniowo konstrukcję dopełniaczową bez wpisywania jej objaśnienia w tekst główny.
- source_word: καταλιπὼν αὐτοὺς ἀπῆλθεν
  choice: Potem zostawił ich i odszedł
  rationale: Naturalnie oddaje uprzedniość czynności wyrażonej imiesłowem aorystu oraz główny czasownik ruchu, unikając ciężkiej konstrukcji „zostawiwszy ich”.
theological_decisions:
- issue: Znaczenie określenia „cudzołożne pokolenie”
  choice: Zachowano metaforę „cudzołożne” w tekście głównym.
  alternative: „niewierne pokolenie”
  rationale: Greka posługuje się słownictwem cudzołóstwa, które może nawiązywać do prorockiego obrazu niewierności wobec Boga. Dosłowna metafora pozwala zachować zarówno jej ostrość, jak i teologiczne napięcie.
- issue: Znaczenie „znaku Jonasza”
  choice: Pozostawiono zwięzłe wyrażenie „znak Jonasza” bez objaśnienia w tekście głównym.
  alternative: Jawne wskazanie na śmierć i zmartwychwstanie Jezusa
  rationale: Mt 12,39–40 rozwija tę typologię, lecz sam ten werset jej nie objaśnia. Dopowiedzenie interpretacji w tekście głównym usunęłoby zamierzoną zwięzłość i wieloznaczność.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. Szyk przymiotników jest naturalny dla języka polskiego, metafora „cudzołożne” pozostaje celowo wyrazista, a końcowe zdanie unika archaizującego imiesłowu.
