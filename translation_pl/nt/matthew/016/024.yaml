id: MAT.16.24
reference: Matthew 16:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: pl
  text: 'Wtedy Jezus powiedział do swoich uczniów: „Jeśli ktoś chce pójść za mną, niech się wyrzeknie samego siebie, niech weźmie swój krzyż i niech idzie za mną”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski wykładnik następstwa czasowego w narracji.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: do swoich uczniów
  rationale: „Uczniowie” to utrwalony i trafny odpowiednik μαθηταί; zaimek zwrotny „swoich” naturalnie odnosi ich do podmiotu zdania, Jezusa.
- source_word: Εἴ τις θέλει
  choice: Jeśli ktoś chce
  rationale: Oddaje warunek, nieokreślony zakres τις oraz znaczenie woli zawarte w θέλει.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: pójść za mną
  rationale: Naturalny polski idiom uczniostwa, zachowujący obraz podążania za Jezusem i odróżniony leksykalnie od końcowego ἀκολουθείτω.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: niech się wyrzeknie samego siebie
  rationale: 'Oddaje stanowczy imperatyw aorystyczny oraz silniejszy sens ἀπαρνέομαι: zaparcie się lub wyrzeczenie własnego roszczenia do kierowania sobą.'
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: niech weźmie swój krzyż
  rationale: „Wziąć krzyż” jest naturalnym i utrwalonym odpowiednikiem obrazu podjęcia własnego krzyża; „swój” zachowuje indywidualny sens αὐτοῦ.
- source_word: ἀκολουθείτω μοι
  choice: niech idzie za mną
  rationale: Naturalnie oddaje nakaz podążania za Jezusem; czas teraźniejszy imperatywu dopuszcza sens trwającego naśladowania, który wynika z kontekstu.
theological_decisions:
- issue: Reprezentatywna liczba pojedyncza i rodzaj gramatyczny
  choice: „Jeśli ktoś… niech się wyrzeknie… niech weźmie… niech idzie”
  alternative: Liczba mnoga, np. „Jeśli ktoś chce… niech wyrzekną się…”
  rationale: Greka konsekwentnie używa liczby pojedynczej. Polski zaimek „ktoś” i czasowniki w liczbie pojedynczej zachowują tę indywidualizację, a zarazem mają ogólny zakres obejmujący każdą osobę; nie trzeba dodawać osobnego zaimka rodzaju męskiego.
- issue: Charakter samozaparcia
  choice: „wyrzeknie się samego siebie”
  alternative: „zaprze się samego siebie”
  rationale: Oba warianty są możliwe. „Wyrzec się” w nowoczesnej polszczyźnie jasno wyraża radykalną rezygnację z uznawania siebie za nadrzędny punkt odniesienia, bez rozstrzygania szerszych doktrynalnych interpretacji.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano trzy równoległe nakazy oraz rozróżnienie między początkowym „pójść za mną” a końcowym „iść za mną”. Nie dodano przypisu, ponieważ polskie „ktoś” naturalnie zachowuje ogólny, jednostkowy zakres greckiego τις bez problemu angielskiego zaimka rodzajowego.
