  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: pl
  text: Bo kto chce ocalić swoje życie, straci je[a], lecz kto straci swoje życie ze względu na mnie, znajdzie je.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „duszę” w całym wersecie. Greckie słowo psychē może, zależnie od kontekstu, oznaczać „życie”, „siebie” lub „duszę”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Bo kto… lecz kto
  rationale: Konstrukcje względne z ἐάν/ἄν wyrażają ogólny, nieokreślony warunek. „Kto” brzmi naturalnie po polsku; „bo” zachowuje związek z poprzednią wypowiedzią, a „lecz” uwydatnia kontrast między członami.
- source_word: θέλῃ
  choice: chce
  rationale: Czasownik wyraża wolę lub pragnienie; „chce” jest współczesnym i bezpośrednim odpowiednikiem.
- source_word: ψυχὴν
  choice: życie
  rationale: W kontekście uczniostwa oraz zestawienia czasowników „ocalić”, „stracić” i „odnaleźć” ψυχή oznacza przede wszystkim życie człowieka, choć może też znaczyć „duszę” lub „siebie”. Istotną alternatywę zachowano w przypisie.
- source_word: σῶσαι
  choice: ocalić
  rationale: „Ocalić” naturalnie odnosi się do życia i oddaje sens zachowania go od zguby, nie przesądzając szerszego teologicznego znaczenia czasownika.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: straci / straci
  rationale: W tym kontekście ἀπόλλυμι oznacza utratę życia. Pierwsza forma jest greckim czasem przyszłym, druga zaś aorystem trybu łączącego w konstrukcji ogólnego warunku; w obu członach polski czas przyszły jest idiomatyczny.
- source_word: ἕνεκεν ἐμοῦ
  choice: ze względu na mnie
  rationale: Wyrażenie wskazuje przyczynę lub motyw związany z osobą Jezusa. „Ze względu na mnie” jest naturalne i nie dodaje interpretacji ponad tekst.
- source_word: εὑρήσει
  choice: odnajdzie
  rationale: „Odnajdzie” zachowuje dosłowny obraz εὑρίσκω oraz paradoks utraty i ponownego znalezienia życia.
- source_word: αὐτοῦ / αὐτήν
  choice: swoje / je
  rationale: Polski zaimek zwrotny „swoje” jasno odnosi życie do podmiotu zdania, a „je” ma za poprzednik rzeczownik „życie”.
theological_decisions:
- issue: Znaczenie ψυχή w paradoksie dotyczącym uczniostwa
  choice: życie
  alternative: dusza; siebie
  rationale: Kontekst mówi o pójściu za Jezusem mimo groźby śmierci, dlatego „życie” najlepiej zachowuje praktyczny i paradoksalny sens wypowiedzi. Ponieważ ψυχή ma szerszy zakres i tradycyjnie bywa oddawane jako „dusza”, alternatywę podano w przypisie, nie zawężając tekstu wyłącznie do niematerialnego aspektu człowieka.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłą, równoległą budowę obu członów oraz paradoks „ocalić–stracić–odnaleźć”. Marker przypisu [a] umieszczono w tekście głównym.
