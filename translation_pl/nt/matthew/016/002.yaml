  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: pl
  text: 'On zaś odpowiedział im: „Gdy zapada wieczór, mówicie: «Będzie piękna pogoda, bo niebo[a] się czerwieni»”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może oznaczać zarówno widzialne „niebo”, jak i „niebiosa”; tutaj powiedzenie o pogodzie wyraźnie wskazuje na widzialne niebo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Grecka formuła dosłownie łączy imiesłów „odpowiedziawszy” z czasownikiem „powiedział”, lecz we współczesnej polszczyźnie naturalnie i wystarczająco oddaje ją jedno słowo „odpowiedział”.
- source_word: Ὀψίας γενομένης
  choice: Gdy zapada wieczór
  rationale: Konstrukcja dopełniaczowa określa czas. Wyrażenie „zapada wieczór” jest naturalne i zachowuje dynamiczny sens nadejścia wieczoru.
- source_word: λέγετε
  choice: mówicie
  rationale: Czas teraźniejszy opisuje zwyczajową, powtarzaną wypowiedź, co polski czas teraźniejszy oddaje bez dodatkowych objaśnień.
- source_word: Εὐδία
  choice: Będzie piękna pogoda
  rationale: Rzeczownik oznacza dobrą, pogodną aurę. Dodanie „będzie” wynika z prognostycznego charakteru przysłowia i daje naturalne polskie zdanie.
- source_word: πυρράζει
  choice: się czerwieni
  rationale: Czasownik opisuje przybieranie lub ukazywanie czerwonej barwy; „się czerwieni” brzmi naturalnie w odniesieniu do nieba i nie wzmacnia niepotrzebnie odcienia do „ognistej czerwieni”.
- source_word: ὁ οὐρανός
  choice: niebo
  rationale: Polskie „niebo” naturalnie oznacza widzialne niebo w kontekście meteorologicznym, a zarazem odpowiada zwykłemu zakresowi znaczeniowemu greckiego rzeczownika.
theological_decisions: []
translation_notes:
  register: Współczesny, naturalny i godny rejestr narracyjny. Grecką formułę „odpowiedziawszy, powiedział” wygładzono zgodnie z normą polską, natomiast obraz przysłowia pogodowego zachowano bez interpretacyjnego rozwijania.
