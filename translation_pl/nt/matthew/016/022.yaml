  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: pl
  text: 'Piotr zaś wziął Go na bok i zaczął Go strofować: „Niech Cię Bóg uchowa, Panie![a] Na pewno Cię to nie spotka”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grecki zwrot jest idiomatyczny i eliptyczny; dosłownie mówi o łaskawości lub przychylności „dla Ciebie”. Można też oddać: „Oby Cię to ominęło, Panie!” albo „To nie dla Ciebie, Panie!”. Słowo „Bóg” jest w przekładzie domyślne, nie występuje wprost w tekście greckim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: wziął Go na bok
  rationale: Imiesłów w stronie medialnej wskazuje w tym kontekście, że Piotr odciągnął Jezusa na bok, aby zwrócić się do Niego osobiście; taki przekład jest naturalny i oddaje sytuacyjny niuans.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: zaczął Go strofować
  rationale: Konstrukcja ἤρξατο z bezokolicznikiem ma znaczenie ingresywne. „Strofować” oddaje stanowczą naganę, a zarazem brzmi naturalniej po polsku w tej scenie niż cięższe „ganić” lub „karcić”.
- source_word: Ἵλεώς σοι
  choice: Niech Cię Bóg uchowa
  rationale: Jest to eliptyczny idiom wyrażający zdecydowany sprzeciw i życzenie, by zapowiedziane nieszczęście nie nastąpiło. Polski zwrot „Niech Cię Bóg uchowa” naturalnie oddaje jego funkcję; ponieważ imię Boga nie występuje wprost w grece, dosłowność i alternatywę zachowano w przypisie.
- source_word: κύριε
  choice: Panie
  rationale: Wołacz „Panie” zachowuje podstawowe znaczenie κύριε, szacunek Piotra wobec Jezusa oraz chrystologiczny rezonans tego tytułu bez jego zawężania.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Na pewno Cię to nie spotka
  rationale: Połączenie οὐ μή z czasem przyszłym jest mocnym zaprzeczeniem. „Na pewno… nie” oddaje nacisk, a „Cię to nie spotka” naturalnie przekazuje greckie σοι.
theological_decisions:
- issue: Oddanie protestu Piotra bez nadmiernego doprecyzowania eliptycznego idiomu
  choice: Niech Cię Bóg uchowa, Panie!
  alternative: To nie dla Ciebie, Panie! / Oby Cię to ominęło, Panie!
  rationale: Greckie Ἵλεώς σοι jest idiomatyczne i eliptyczne. Główny przekład wykorzystuje rozpoznawalny polski zwrot wyrażający życzenie oddalenia nieszczęścia, lecz przypis zaznacza, że „Bóg” pozostaje domyślny, a nie wyrażony wprost. Pozwala to zachować zarówno naturalność, jak i rzeczywistą niejednoznaczność źródła.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. „Strofować” zachowuje powagę oraz stanowczość wypowiedzi. Wielkie litery w zaimkach odnoszących się do Jezusa zastosowano zgodnie z polską konwencją religijną; nie zmieniają one znaczenia tekstu źródłowego.
