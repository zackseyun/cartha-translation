id: MAT.16.19
reference: Matthew 16:19
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: pl
  text: Dam ci klucze królestwa niebios. Cokolwiek zwiążesz na ziemi[a], będzie już związane w niebie[b], a cokolwiek rozwiążesz na ziemi, będzie już rozwiązane w niebie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Związać” i „rozwiązać” mogą oznaczać także zakazać i zezwolić albo nałożyć i znieść zobowiązanie; przekład zachowuje grecką metaforę.
    reason: cultural_note
  - marker: b
    text: 'Tradycyjnie można tłumaczyć: „będzie związane… będzie rozwiązane”. Grecka konstrukcja może jednak dokładniej wskazywać: „będzie już związane… będzie już rozwiązane”. Dosłownie występuje tu także liczba mnoga: „w niebiosach”.'
    reason: alternative_reading
lexical_decisions:
- source_word: δώσω σοι
  choice: Dam ci
  rationale: Grecki czas przyszły wyraża prostą obietnicę, a celownik σοι naturalnie oddaje polskie „ci”.
- source_word: τὰς κλεῖδας
  choice: klucze
  rationale: Zachowano dosłowny obraz kluczy, bez dopowiadania, jaki konkretnie zakres władzy symbolizują.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: królestwa niebios
  rationale: To naturalne i utrwalone po polsku oddanie charakterystycznego dla Mateusza wyrażenia z liczbą mnogą „niebios”.
- source_word: ὃ ἐὰν
  choice: cokolwiek
  rationale: Naturalnie oddaje grecką konstrukcję względną o znaczeniu nieokreślonym.
- source_word: δήσῃς
  choice: zwiążesz
  rationale: Zachowuje metaforę oraz możliwe znaczenie zakazywania lub nakładania zobowiązań, nie zawężając tekstu do jednej interpretacji.
- source_word: ἐπὶ τῆς γῆς
  choice: na ziemi
  rationale: Naturalne polskie sformułowanie w kontraście ziemia–niebo.
- source_word: ἔσται δεδεμένον
  choice: będzie już związane
  rationale: Dodanie „już” pomaga oddać konstrukcję z przyszłą formą εἰμί i imiesłowem perfectum, wskazującą na przyszły stan będący wynikiem dokonanego związania.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: w niebie
  rationale: W tym zestawieniu liczba pojedyncza jest naturalna we współczesnej polszczyźnie, choć grecki tekst ma dosłownie liczbę mnogą.
- source_word: λύσῃς
  choice: rozwiążesz
  rationale: Tworzy przejrzystą parę ze „zwiążesz” i zachowuje grecką metaforę bez zastępowania jej interpretacją „pozwolisz”.
- source_word: ἔσται λελυμένον
  choice: będzie już rozwiązane
  rationale: Równolegle do pierwszej klauzuli oddaje przyszły stan wynikający z czynności dokonanej.
theological_decisions:
- issue: Aspekt formuły o związywaniu i rozwiązywaniu oraz relacja działania ziemskiego do niebiańskiego
  choice: będzie już związane / będzie już rozwiązane
  alternative: będzie związane / będzie rozwiązane
  rationale: Konstrukcja ἔσται z imiesłowem perfectum może wskazywać na stan wynikający z wcześniejszego dokonania. Polskie „już” sygnalizuje tę wartość, ale przypis nie wyklucza tradycyjnego odczytania; przekład nie rozstrzyga przez to denominacyjnej nauki o zakresie władzy kościelnej.
- issue: Znaczenie kluczy królestwa niebios
  choice: Zachowano metaforę „kluczy”
  alternative: władza wpuszczania i wykluczania; władza zarządcy
  rationale: Obraz sugeruje powierzoną władzę, lecz sam werset nie objaśnia szczegółowo jej zakresu. Rozwinięcie metafory w tekście głównym narzucałoby określony system eklezjologiczny.
- issue: Znaczenie pary „wiązać” i „rozwiązywać”
  choice: Zachowano dosłowną parę metaforyczną
  alternative: zakazywać i zezwalać; nakładać i znosić zobowiązania
  rationale: Greckie terminy mogą mieć takie sensy w kontekście rozstrzygnięć autorytatywnych, ale przekład nie powinien usuwać szerszego obrazu ani przesądzać jednego zastosowania.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano symetrię zdań oraz kluczowe metafory. Formy „zwiążesz” i „rozwiążesz” są skierowane do jednej osoby, zgodnie z grecką drugą osobą liczby pojedynczej.
