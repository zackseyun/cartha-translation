  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: pl
  text: 'A oni rozważali między sobą: „Nie wzięliśmy chleba”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „Nie zabraliśmy ze sobą chleba”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: A oni
  rationale: δέ jest łagodnym spójnikiem narracyjnym; „a” naturalnie prowadzi opowiadanie bez nadmiernego podkreślania przeciwstawienia.
- source_word: διελογίζοντο
  choice: rozmawiali
  rationale: Imperfectum wskazuje na trwającą naradę lub wymianę myśli; „rozmawiali” jest naturalne i nie przesądza, czy była to dyskusja, czy spór.
- source_word: ἐν ἑαυτοῖς
  choice: między sobą
  rationale: Zwrot oznacza rozmowę we własnym gronie; polskie „między sobą” oddaje to idiomatycznie.
- source_word: λέγοντες
  choice: ':'
  rationale: Imiesłów wprowadza treść rozmowy; dwukropek przekazuje tę funkcję naturalniej po polsku, bez utraty treści.
- source_word: Ἄρτους
  choice: chleba
  rationale: Choć grecki rzeczownik występuje w liczbie mnogiej, w kontekście zapasów oznacza chleb ogólnie; polska liczba pojedyncza jest idiomatyczna.
- source_word: οὐκ ἐλάβομεν
  choice: Nie wzięliśmy
  rationale: λαμβάνω może znaczyć „wziąć”, a w kontekście podróży — „zabrać ze sobą”. Zachowano zwięzłe „wzięliśmy”, a sens alternatywny objaśniono w przypisie.
theological_decisions:
- issue: 'Czy dopowiedzieć zależność przyczynową: „To dlatego, że…”'
  choice: Nie dopowiadać zależności przyczynowej
  alternative: „To dlatego, że nie wzięliśmy chleba”
  rationale: Grecki tekst po λέγοντες podaje bezpośrednio jedynie ὅτι Ἄρτους οὐκ ἐλάβομεν; ὅτι może wprowadzać treść wypowiedzi. Niedopowiedziany związek z poprzednim zdaniem należy pozostawić czytelnikowi, zamiast rozstrzygać go w przekładzie.
translation_notes:
  register: Współczesny, prosty i godny styl narracyjny. Szyk oraz interpunkcja są naturalne dla polszczyzny; nie dodano nieobecnego w grece dopełnienia „o tym” ani wyjaśniającego „to dlatego”.
