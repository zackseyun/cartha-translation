id: MAT.16.20
reference: Matthew 16:20
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: pl
  text: Wtedy surowo nakazał uczniom, żeby nikomu nie mówili, że On jest Mesjaszem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „Chrystusem”. Greckie Χριστός jest tutaj tytułem i znaczy „Mesjasz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący na kolejny moment narracji.
- source_word: διεστείλατο
  choice: surowo nakazał
  rationale: Oddaje stanowczą moc polecenia; jest naturalne we współczesnej polszczyźnie i nie sugeruje przede wszystkim ostrzeżenia przed niebezpieczeństwem.
- source_word: τοῖς μαθηταῖς
  choice: uczniom
  rationale: Rodzajnik wskazuje na znaną z kontekstu grupę; polszczyzna nie wymaga tu dodania zaimka „swoim”.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: żeby nikomu nie mówili
  rationale: Konstrukcja z ἵνα i trybem łączącym określa treść nakazu; zdanie podrzędne zachowuje liczbę mnogą podmiotu.
- source_word: ὅτι
  choice: że
  rationale: Wprowadza treść tego, czego uczniowie nie mieli mówić.
- source_word: αὐτός ἐστιν
  choice: On jest
  rationale: Jawny zaimek αὐτός może mieć lekką siłę wskazującą lub emfatyczną; zapis „On” zachowuje tę obecność bez rozwijania jej do „On sam”.
- source_word: ὁ χριστός
  choice: Mesjaszem
  rationale: Χριστός jest tutaj tytułem odpowiadającym hebrajskiemu pojęciu Mesjasza; polski orzecznik po „jest” naturalnie przyjmuje narzędnik.
theological_decisions:
- issue: Oddanie Χριστός jako tytułu
  choice: Mesjaszem
  alternative: Chrystusem
  rationale: W tym kontekście Χριστός oznacza rozpoznawalny tytuł mesjański, a nie imię własne. „Mesjasz” przejrzyście zachowuje jego znaczenie; tradycyjny wariant „Chrystus” podano w przypisie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Szyk pozostaje naturalny po polsku, a „surowo nakazał” zachowuje stanowczość greckiego czasownika.
