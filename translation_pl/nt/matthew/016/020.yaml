  source_fidelity: 'Tekst wiernie oddaje τότε („Wtedy”), stanowczą siłę διεστείλατο („surowo nakazał”), adresatów nakazu oraz treść zakazu: uczniowie nie mają nikomu mówić, że Jezus jest Mesjaszem. Konstrukcja „żeby ... nie mówili” poprawnie przekazuje ἵνα z trybem łączącym. Polski narzędnik „Mesjaszem” jest wymagany po „jest”.'
