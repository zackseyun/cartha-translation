id: MAT.16.6
reference: Matthew 16:6
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: pl
  text: 'Jezus zaś powiedział im: „Uważajcie i strzeżcie się zakwasu[a] faryzeuszy i saduceuszy”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Można też oddać jako „zaczynu”. Jezus później objaśnia tę metaforę w odniesieniu do nauki faryzeuszy i saduceuszy.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodne przejście lub kontrast wobec poprzedniego kontekstu, bez nadmiernego wzmacniania spójnika.
- source_word: εἶπεν αὐτοῖς
  choice: powiedział im
  rationale: Bezpośredni i standardowy odpowiednik greckiej konstrukcji, naturalny we współczesnej polszczyźnie.
- source_word: Ὁρᾶτε
  choice: Uważajcie
  rationale: Tryb rozkazujący ma tu idiomatyczną funkcję ostrzeżenia, a nie dosłowne znaczenie patrzenia.
- source_word: προσέχετε ἀπὸ
  choice: strzeżcie się
  rationale: Naturalnie oddaje wezwanie do czujności i unikania zagrożenia; wraz z „Uważajcie” zachowuje retoryczne podwojenie ostrzeżenia.
- source_word: ζύμης
  choice: zakwasu
  rationale: „Zakwas” trafnie zachowuje obraz fermentującego zaczynu oraz jego metaforyczną i biblijną nośność; nie zastępuje obrazu jego późniejszym objaśnieniem.
- source_word: Φαρισαίων
  choice: faryzeuszy
  rationale: Utrwalona polska nazwa tej grupy religijnej.
- source_word: Σαδδουκαίων
  choice: saduceuszy
  rationale: Utrwalona polska nazwa tej grupy religijnej.
theological_decisions:
- issue: Metaforyczny sens zakwasu
  choice: Zachowanie rzeczownika „zakwas” jako niewyjaśnionej jeszcze metafory.
  alternative: Oddanie go wprost jako „nauki” lub „wpływu”.
  rationale: W tym zdaniu Jezus posługuje się obrazem zakwasu; jego znaczenie zostaje objaśnione dopiero później w kontekście. Przekład nie powinien uprzedzać tego objaśnienia ani zawężać możliwego zakresu metafory.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Podwójne ostrzeżenie „Uważajcie i strzeżcie się” zachowuje nacisk greckich imperatywów, a szyk z „zaś” subtelnie odzwierciedla tok wypowiedzi.
