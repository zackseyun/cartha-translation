id: MAT.16.18
reference: Matthew 16:18
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: pl
  text: 'A ja także mówię ci: Ty jesteś Piotrem, a na tej skale[a] zbuduję mój Kościół, a bramy Hadesu[b] go nie przemogą.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: W grece występuje gra słów między imieniem Petros („Piotr”) a petra („skała”). „Ta skała” bywa rozumiana jako Piotr, jego wyznanie albo Piotr jako wyznający i reprezentujący apostołów.
    reason: alternative_reading
  - marker: b
    text: 'Hades — kraina umarłych; tradycyjnie: „piekło”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: A ja
  rationale: Oddaje emfatyczne κἀγώ oraz łagodne nawiązanie lub przeciwstawienie wyrażone przez δέ, zachowując naturalny tok polskiej wypowiedzi.
- source_word: σοι λέγω
  choice: mówię ci
  rationale: Bezpośredni i naturalny odpowiednik λέγω z celownikiem osoby.
- source_word: Πέτρος
  choice: Piotrem
  rationale: Użyto utrwalonej polskiej formy imienia; narzędnik jest wymagany przez naturalną współczesną polszczyznę po „jesteś”. Związek brzmieniowy z πέτρα objaśnia przypis.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: na tej skale
  rationale: Zachowuje przyimek, wyraźne wskazanie ταύτῃ oraz metaforę budowania, nie rozstrzygając odniesienia „skały”.
- source_word: οἰκοδομήσω
  choice: zbuduję
  rationale: Zachowuje dosłowną metaforę budowy obecną w οἰκοδομέω.
- source_word: μου τὴν ἐκκλησίαν
  choice: mój Kościół
  rationale: „Kościół” jest utrwalonym i zrozumiałym określeniem wspólnoty należącej do Jezusa; „mój” wyraźnie oddaje μου. Wielka litera wskazuje na wspólnotę, nie budynek.
- source_word: πύλαι ᾅδου
  choice: bramy Hadesu
  rationale: Zachowuje obraz bram i precyzyjnie odróżnia ᾅδης, krainę umarłych, od Gehenny i późniejszych skojarzeń słowa „piekło”.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: go nie przemogą
  rationale: „Przemóc” naturalnie wyraża przewagę lub pokonanie zawarte w κατισχύω; zaimek „go” odnosi się gramatycznie do Kościoła.
theological_decisions:
- issue: Odniesienie wyrażenia „ta skała” (ταύτῃ τῇ πέτρᾳ)
  choice: Pozostawiono „na tej skale” bez wskazania jednego desygnatu.
  alternative: Skała może być rozumiana jako sam Piotr, jego wyznanie albo Piotr jako wyznający i reprezentujący apostołów.
  rationale: Greka tworzy zamierzoną grę słów Πέτρος–πέτρα, lecz sam przekład nie powinien rozstrzygać sporu interpretacyjnego między tradycjami.
- issue: Znaczenie ᾅδης
  choice: Hades
  alternative: 'kraina umarłych; tradycyjnie: piekło'
  rationale: „Hades” najwierniej zachowuje termin źródłowy i nie utożsamia go automatycznie z miejscem ostatecznej kary.
- issue: Obraz „bram Hadesu”
  choice: Zachowano obraz bez dopowiedzenia, czy przedstawia siły śmierci w ataku, czy niemożność zatrzymania wspólnoty.
  alternative: Możliwe są interpretacje akcentujące napaść potęg śmierci albo bramy jako obronę krainy umarłych.
  rationale: Tekst stwierdza brak zwycięstwa Hadesu nad Kościołem, ale nie objaśnia mechaniki metafory; przekład zachowuje tę otwartość.
translation_notes:
  register: Współczesna, godna i łatwo zrozumiała polszczyzna. Szyk „A ja mówię ci” zachowuje uroczysty charakter bez archaizacji. Wielka litera w „Kościół” odróżnia wspólnotę od budynku. Markery przypisów umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
