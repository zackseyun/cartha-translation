id: MAT.16.23
reference: Matthew 16:23
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: pl
  text: 'On zaś odwrócił się i powiedział do Piotra: „Idź za Mną, Szatanie![a] Jesteś dla Mnie przeszkodą, ponieważ nie masz na względzie tego, co Boże, lecz to, co ludzkie[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „Idź za Mną”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „to, co należy do ludzi”; chodzi o ludzi jako takich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: odwrócił się
  rationale: Imiesłów aorystu ma tu znaczenie nieprzechodnie i opisuje zwrócenie się Jezusa przed wypowiedzeniem nagany.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Odejdź za Mnie
  rationale: Sformułowanie zachowuje zarówno nakaz oddalenia się zawarty w ὕπαγε, jak i przestrzenny sens ὀπίσω μου („za Mnie”), nie rozstrzygając, czy akcent pada wyłącznie na odrzucenie, czy także na właściwe miejsce ucznia za Jezusem.
- source_word: Σατανᾶ
  choice: szatanie
  rationale: Wołacz zachowuje mocne, rozpoznawalne określenie z tekstu greckiego, bez redukowania go do ogólnego „przeciwniku”.
- source_word: σκάνδαλον
  choice: przeszkodą
  rationale: W tym kontekście słowo oznacza coś, co staje komuś na drodze i może spowodować potknięcie; „przeszkoda” brzmi naturalnie i pasuje do sprzeciwu Piotra wobec drogi Jezusa.
- source_word: ἐμοῦ
  choice: dla Mnie
  rationale: Dopełniacz przy σκάνδαλον wskazuje osobę, dla której ktoś staje się przeszkodą; taki przekład jest jasny i idiomatyczny po polsku.
- source_word: φρονεῖς
  choice: myślisz o
  rationale: Czasownik wyraża ukierunkowanie myślenia i nastawienie, nie tylko pojedynczą myśl. W połączeniu z przeciwstawionymi wyrażeniami „to, co Boże” i „to, co ludzkie” polska konstrukcja pozostaje naturalna.
- source_word: τὰ τοῦ θεοῦ
  choice: to, co Boże
  rationale: Zwięzły polski odpowiednik zachowuje szerokie znaczenie spraw, zamysłów lub interesów należących do sfery Boga, bez zawężania sensu.
- source_word: τὰ τῶν ἀνθρώπων
  choice: to, co ludzkie
  rationale: Wyrażenie oddaje reprezentatywny, ogólnoludzki sens liczby mnogiej ἀνθρώπων i zachowuje symetryczne przeciwstawienie wobec „tego, co Boże”.
theological_decisions:
- issue: Znaczenie zwrotu „szatanie” skierowanego do Piotra
  choice: Zachowano bezpośredni zwrot „szatanie”, nie objaśniając w tekście głównym relacji Piotra do Szatana.
  alternative: „przeciwniku” albo przekład wskazujący, że Jezus zwraca się do Szatana działającego przez Piotra
  rationale: Greka pozwala usłyszeć zarówno ostrość osobistej nagany, jak i echo kuszenia Jezusa. Przekład nie powinien rozstrzygać, czy Piotr zostaje utożsamiony z Szatanem, nazwany przeciwnikiem, czy przedstawiony jako jego narzędzie.
- issue: Możliwy sens μαθηczny wyrażenia ὀπίσω μου
  choice: Zachowano przestrzenne „za Mnie” obok nakazu odejścia.
  alternative: „Zejdź Mi z oczu” albo „Idź precz ode Mnie”
  rationale: Bardziej idiomatyczne warianty wyrażałyby wyłącznie odrzucenie i usuwały możliwe nawiązanie do właściwego miejsca ucznia podążającego za Jezusem.
- issue: Zakres ἀνθρώπων
  choice: „to, co ludzkie”
  alternative: „sprawy mężczyzn” albo „sprawy ludzi”
  rationale: W tym przeciwstawieniu Bogu ἀνθρώπων odnosi się do ludzi jako takich, a nie wyłącznie do mężczyzn. Forma „ludzkie” wiernie oddaje zakres znaczeniowy bez wprowadzania nieobecnego ograniczenia płciowego.
translation_notes:
  register: Współczesny, godny i bezpośredni język. Wielkie litery w zaimkach odnoszących się do Jezusa odpowiadają utrwalonej polskiej konwencji religijnej. Szyk zachowuje wyraźne przeciwstawienie tego, co Boże, temu, co ludzkie.
