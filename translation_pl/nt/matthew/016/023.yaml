review_pass:
  verdict: revise
  source_fidelity: Sens zdania jest zasadniczo zachowany, w tym bezpośrednie „szatanie” oraz kontrast między tym, co Boże, a tym, co ludzkie. Jednak „Odejdź za Mnie” nie jest naturalnym polskim odpowiednikiem Ὕπαγε ὀπίσω μου i może sugerować oddalenie się, zamiast nakazu zajęcia miejsca za Jezusem. „Idź za Mną” wiernie zachowuje zarówno dosłowny kierunek, jak i zamierzoną wieloznaczność.
  naturalness: Po zmianie na „Idź za Mną” wypowiedź brzmi naturalnie we współczesnej, godnej polszczyźnie. „Nie masz na względzie” trafniej i idiomatyczniej niż „nie myślisz o” oddaje trwałe nastawienie wyrażone przez φρονεῖς.
  terminology: „Szatanie” należy pisać wielką literą jako użyte tu rozpoznawalne imię/tytuł. „Przeszkodą” jest poprawnym, współczesnym odpowiednikiem metafory σκάνδαλον. „To, co Boże” oraz „to, co ludzkie” zachowują zakres i antytezę greckich wyrażeń bez nieuprawnionego ograniczania ἀνθρώπων do mężczyzn.
  issues:
  - severity: medium
    issue: „Odejdź za Mnie”
    rationale: Polska konstrukcja jest nienaturalna i semantycznie przesuwa wypowiedź ku nakazowi odejścia. Greckie ὕπαγε ὀπίσω μου dosłownie wzywa do pójścia za mówiącym; przekład powinien zachować ten przestrzenny sens i nie usuwać możliwego podtekstu uczniostwa.
  - severity: low
    issue: Mała litera w „szatanie”
    rationale: W tym kontekście Σατανᾶ jest standardowo zachowywanym imieniem/tytułem własnym, więc polski wołacz powinien brzmieć „Szatanie”.
  - severity: low
    issue: Przypis a podaje parafrazy jako rzekomo tradycyjne alternatywy
    rationale: „Zejdź Mi z oczu” i „Idź precz ode Mnie” nie zachowują wyraźnego składnika ὀπίσω („za”), a więc nie są równoważnymi alternatywami leksykalnymi. Przypis należy ograniczyć do rzeczywistego dosłownego sensu.
  - severity: low
    issue: „Nie myślisz o” osłabia zakres φρονεῖς
    rationale: Czasownik oznacza nastawienie, ukierunkowanie umysłu lub to, co ktoś ma na względzie, a nie tylko przedmiot doraźnej myśli.
  - severity: low
    issue: Przypis b dodaje „czysto”
    rationale: Przysłówek „czysto” jest interpretacyjnym wzmocnieniem, którego grecki tekst nie zawiera; przypis powinien jedynie objaśniać, że ἀνθρώπων odnosi się do ludzi.
