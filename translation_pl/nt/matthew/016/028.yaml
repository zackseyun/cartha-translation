reference: Matthew 16:28
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: pl
  text: 'Zaprawdę mówię wam: Niektórzy spośród stojących tutaj na pewno nie zakosztują śmierci[a], zanim ujrzą Syna Człowieczego przychodzącego w swoim królestwie[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „z całą pewnością nie zakosztują śmierci”; grecki tekst zawiera emfatyczne przeczenie.'
    reason: lexical_alternative
  - marker: b
    text: Wyrażenie „Syn Człowieczy przychodzący w swoim królestwie” może odnosić się do przemienienia, zmartwychwstania i wywyższenia, sądu nad Jerozolimą albo ostatecznego przyjścia; sam tekst nie wskazuje jednoznacznie konkretnego wydarzenia.
    reason: alternative_reading
  - marker: c
    text: 'Lub: „w swoim panowaniu” albo „w swojej królewskiej władzy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: Oddaje uroczystą formułę zapewnienia, zachowując jej biblijną powagę i pozostając zrozumiałe we współczesnej polszczyźnie.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Naturalnie i bezpośrednio oddaje formułę wprowadzającą wypowiedź.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: niektórzy spośród stojących tutaj
  rationale: 'Wyraźnie zachowuje cząstkowy sens konstrukcji: chodzi o niektóre osoby z obecnej grupy.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: na pewno nie zakosztują śmierci
  rationale: „Na pewno nie” oddaje emfatyczne greckie przeczenie οὐ μή, a „zakosztują śmierci” zachowuje wyrazistą metaforę oryginału.
- source_word: ἕως ἂν ἴδωσιν
  choice: zanim ujrzą
  rationale: Naturalna polska konstrukcja czasowa odnosząca się do przyszłego wydarzenia; „ujrzą” zachowuje podniosły, lecz zrozumiały rejestr.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Syna Człowieczego
  rationale: Utrwalone tłumaczenie tytułu, zachowujące jego biblijne i apokaliptyczne odniesienia.
- source_word: ἐρχόμενον
  choice: przychodzącego
  rationale: Bezpośrednio oddaje imiesłów określający Syna Człowieczego i nie dodaje elementów nieobecnych w tym wersecie.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: w swoim królestwie
  rationale: Zachowuje konkretny obraz królestwa, nie wykluczając możliwego znaczenia panowania lub królewskiej władzy.
theological_decisions:
- issue: Odniesienie wyrażenia „Syn Człowieczy przychodzący w swoim królestwie”
  choice: Pozostawiono sformułowanie bez wskazywania konkretnego wydarzenia.
  alternative: Przemienienie, zmartwychwstanie i wywyższenie, Pięćdziesiątnica, sąd nad Jerozolimą albo ostateczne przyjście.
  rationale: Tekst grecki nie rozstrzyga jednoznacznie, do którego wydarzenia odnosi się ta zapowiedź; przekład powinien zachować tę otwartość interpretacyjną.
- issue: Zakres znaczeniowy βασιλεία
  choice: królestwo
  alternative: panowanie lub królewska władza
  rationale: „Królestwo” zachowuje tradycyjny i obrazowy charakter wyrażenia, nie ograniczając go wyłącznie do abstrakcyjnie pojmowanego sprawowania władzy.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Zachowano uroczyste „Zaprawdę”, tytuł „Syn Człowieczy” oraz metaforę „zakosztować śmierci”, unikając doprecyzowania spornego odniesienia zapowiedzi.
