  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: pl
  text: 'A rano: „Dziś będzie zła pogoda, bo niebo jest czerwone i pochmurne”. Umiecie rozpoznawać wygląd nieba[a], lecz znaków czasów[b] nie potraficie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „oblicze nieba”.'
    reason: lexical_alternative
  - marker: b
    text: „Znaki czasów” mogą oznaczać duchowo doniosły charakter obecnej chwili, w tym mesjańskie dzieła Jezusa.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: rano
  rationale: Przysłówkowe określenie czasu; „rano” jest naturalnym polskim odpowiednikiem i zachowuje związek z poprzednią wypowiedzią o pogodzie.
- source_word: χειμών
  choice: burzliwa pogoda
  rationale: W tym kontekście wyraz oznacza złą, burzową pogodę, a nie porę roku. Takie sformułowanie jasno oddaje sens prognozy.
- source_word: πυρράζει
  choice: jest czerwone
  rationale: Czasownik opisuje czerwony wygląd nieba; prosty zwrot odpowiada naturalnemu językowi obserwacji pogody.
- source_word: στυγνάζων
  choice: pochmurne
  rationale: Imiesłów przedstawia niebo jako posępne, ciemne lub groźnie wyglądające. „Pochmurne” naturalnie pasuje do kontekstu meteorologicznego bez nadmiernego doprecyzowania.
- source_word: πρόσωπον
  choice: wygląd
  rationale: Dosłownie „twarz” lub „oblicze”, lecz w tym wyrażeniu chodzi o widzialny wygląd nieba. Dosłowną możliwość zachowano w przypisie.
- source_word: γινώσκετε διακρίνειν
  choice: umiecie rozpoznawać
  rationale: Konstrukcja wyraża nabytą zdolność właściwego rozróżniania lub oceniania; polskie sformułowanie zachowuje zarówno aspekt umiejętności, jak i interpretacji.
- source_word: σημεῖα
  choice: znaki
  rationale: Standardowy odpowiednik zachowujący sens wskazujący, dowodowy i objawieniowy obecny w Ewangelii Mateusza.
- source_word: καιρῶν
  choice: czasów
  rationale: καιρός oznacza tu znaczący moment lub okres, nie pory roku. „Czasów” zachowuje szeroki sens frazy i jej możliwy wydźwięk mesjański oraz eschatologiczny.
- source_word: οὐ δύνασθε
  choice: nie potraficie
  rationale: Oddaje wyrażoną wprost niezdolność i naturalnie nawiązuje do wcześniejszego „umiecie rozpoznawać”; domyślne „rozpoznawać” nie musi być powtórzone po polsku.
theological_decisions:
- issue: Znaczenie wyrażenia „znaki czasów”
  choice: Zachowano szerokie wyrażenie „znaki czasów” bez zawężania jego znaczenia.
  alternative: „znaki obecnego czasu” lub „mesjańskie znaki wieku”
  rationale: Wypowiedź gani słuchaczy za nierozpoznanie duchowego znaczenia obecnej chwili, w tym dzieł Jezusa. Greka dopuszcza wymiar mesjański i eschatologiczny, ale nie ogranicza frazy wyłącznie do jednego z nich.
translation_notes:
  register: Współczesny, naturalny i godny rejestr polski. Zachowano zwięzłą formę przysłowia pogodowego oraz wyraźny kontrast między umiejętnością odczytywania nieba a nierozpoznaniem znaczenia czasów.
