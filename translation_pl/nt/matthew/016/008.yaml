source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: pl
  text: 'Jezus zaś, wiedząc o tym, powiedział: „Dlaczego rozmawiacie między sobą, małej wiary, o tym, że nie wzięliście chleba[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „nie wzięliście bochenków”.'
    reason: Grecki tekst używa liczby mnogiej ἄρτους oraz czasownika ἐλάβετε („wzięliście”); tekst główny zachowuje czasownik, ale naturalnie oddaje liczbę mnogą rzeczownikiem zbiorowym „chleb”.
lexical_decisions:
- source_word: γνοὺς
  choice: wiedząc o tym
  rationale: Imiesłów aorystu wskazuje, że Jezus rozpoznał sytuację przed wypowiedzią. Zaimek „tym” wynika z kontekstu, ponieważ dopełnienie pozostaje w grece domyślne.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodne przeciwstawienie lub przejście narracyjne bez nadmiernie mocnego kontrastu.
- source_word: εἶπεν
  choice: powiedział
  rationale: Standardowy odpowiednik narracyjnego czasownika λέγω; pytajny charakter wypowiedzi wynika z mowy bezpośredniej.
- source_word: Τί
  choice: dlaczego
  rationale: W połączeniu z διαλογίζεσθε i zdaniem wprowadzonym przez ὅτι zaimek ma sens przysłówkowy i pyta o powód ich rozmowy.
- source_word: διαλογίζεσθε
  choice: rozmawiacie
  rationale: W tym kontekście chodzi o wspólne omawianie sprawy przez uczniów. „Rozmawiacie” brzmi naturalnie, zachowując wzajemny charakter czynności wyrażony także przez ἐν ἑαυτοῖς.
- source_word: ἐν ἑαυτοῖς
  choice: między sobą
  rationale: Zwrot może odnosić się do rozważań wewnętrznych albo wymiany myśli w grupie; kontekst wskazuje na rozmowę uczniów między sobą.
- source_word: ὀλιγόπιστοι
  choice: ludzie małej wiary
  rationale: Sformułowanie zachowuje bezpośrednią naganę dotyczącą niedostatecznej wiary lub ufności, unikając możliwego skojarzenia słowa „małowierni” z całkowitym niedowiarstwem.
- source_word: ὅτι
  choice: o tym, że
  rationale: Wprowadza treść rozmowy uczniów. Polska konstrukcja „rozmawiać o tym, że” jasno oddaje tę funkcję.
- source_word: ἄρτους
  choice: chleba
  rationale: Grecki rzeczownik występuje w liczbie mnogiej, lecz polski rzeczownik zbiorowy „chleb” jest w tym kontekście naturalny i odnosi się do zapasu pieczywa.
- source_word: οὐκ ἐλάβετε
  choice: nie wzięliście
  rationale: Zachowuje podstawowe znaczenie λαμβάνω i kontekstowy sens niewzięcia chleba w drogę, bez zastępowania czynności samym rezultatem „nie macie”.
theological_decisions:
- issue: Wymowa nagany ὀλιγόπιστοι
  choice: Bezpośrednia nagana z powodu małej wiary lub niedostatecznego zaufania uczniów
  alternative: Łagodny opis niezrozumienia, bez nacisku na wiarę
  rationale: Greckie określenie bezpośrednio dotyczy niedostatku wiary. Przekład zachowuje ten sens, lecz nie rozbudowuje go w szerszą tezę doktrynalną.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Szyk zachowuje bezpośredni zwrot Jezusa, a wyrażenie „ludzie małej wiary” przekazuje naganę bez archaizacji i bez sugerowania całkowitego braku wiary.
