  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: pl
  text: Czy nadal nie rozumiecie[a] ani nie pamiętacie tych pięciu chlebów dla pięciu tysięcy i ile koszy zebraliście[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „jeszcze nie rozumiecie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „wzięliście”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: nadal nie
  rationale: W pytaniu o charakterze nagany naturalnie oddaje czasowy sens „jeszcze nie / wciąż nie”; wariant zachowano w przypisie.
- source_word: νοεῖτε
  choice: rozumiecie
  rationale: Chodzi o uchwycenie znaczenia wcześniejszych wydarzeń, nie jedynie o ich dostrzeżenie.
- source_word: οὐδὲ
  choice: ani nie
  rationale: Naturalnie łączy w języku polskim dwa zanegowane czasowniki.
- source_word: μνημονεύετε
  choice: pamiętacie
  rationale: Bezpośrednio oddaje przypominanie sobie wcześniejszego rozmnożenia chleba.
- source_word: τοὺς πέντε ἄρτους
  choice: tych pięciu chlebów
  rationale: „Chleby” jest naturalnym i utrwalonym określeniem bochenków w tym opowiadaniu; zaimek wskazujący odpowiada greckiemu rodzajnikowi odsyłającemu do znanego wydarzenia.
- source_word: τῶν πεντακισχιλίων
  choice: dla pięciu tysięcy
  rationale: Kontekstowo wyraża związek pięciu chlebów z nakarmieniem pięciu tysięcy i brzmi naturalnie po polsku.
- source_word: πόσους κοφίνους
  choice: ilu koszy
  rationale: Zachowuje konkretny obraz oraz pytanie o liczbę koszy.
- source_word: ἐλάβετε
  choice: zebraliście
  rationale: W kontekście pozostałych ułomków oznacza ich zebranie do koszy; dosłowniejszą możliwość podano w przypisie.
theological_decisions: []
