  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: pl
  text: 'Gdy Jezus przyszedł w okolice Cezarei Filipowej, pytał swoich uczniów: „Kim, zdaniem ludzi, jest Syn Człowieczy[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „Syn Człowieka”. Jest to charakterystyczne samookreślenie Jezusa; wyrażenie może też przywoływać postać podobną do syna człowieczego z Dn 7,13.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Gdy ... przyszedł
  rationale: Imiesłów aorystu z δέ otwiera nową scenę i wskazuje okoliczność czasową. Polski spójnik „gdy” naturalnie oddaje tę relację bez dodawania wyraźnego „wtedy” lub „teraz”.
- source_word: εἰς τὰ μέρη
  choice: w okolice
  rationale: Liczba mnoga μέρη oznacza tu obszar lub krainę otaczającą miasto, a nie dosłowne „części”.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cezarei Filipowej
  rationale: To utrwalona w polskiej tradycji biblijnej nazwa miasta odróżniająca je od innych miejscowości noszących nazwę Cezarea.
- source_word: ἠρώτα
  choice: pytał
  rationale: Imperfectum wskazuje na czynność przedstawioną w toku; polskie „pytał” zachowuje ten aspekt, a zarazem brzmi naturalnie narracyjnie.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: swoich uczniów
  rationale: „Uczniowie” to zwykły i utrwalony odpowiednik μαθηταί w Ewangeliach; zaimek zwrotny jest naturalny w polszczyźnie przy podmiocie „Jezus”.
- source_word: λέγων
  choice: '[oddane przez wprowadzenie bezpośredniego pytania po dwukropku]'
  rationale: Grecki imiesłów „mówiąc” wprowadza treść wypowiedzi. Współczesna polszczyzna naturalnie wyraża tę funkcję dwukropkiem, bez niezręcznego „pytał ..., mówiąc”.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Kim, zdaniem ludzi, jest
  rationale: 'To naturalny polski sposób oddania greckiej konstrukcji mowy zależnej: dosłownie ludzie „mówią”, kim ktoś „jest”. Sformułowanie zachowuje pytanie o tożsamość, nie zawężając go do opinii o roli lub statusie.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalone polskie określenie własne Jezusa zachowuje biblijne i międzytekstowe skojarzenia tego wyrażenia, w tym możliwe echo Dn 7, bez rozstrzygania wszystkich jego niuansów.
theological_decisions:
- issue: Sposób oddania ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Syn Człowieka / Człowiek
  rationale: „Syn Człowieczy” jest rozpoznawalnym polskim tytułem i zachowuje napięcie między semickim sposobem mówienia o człowieku, samookreśleniem Jezusa oraz możliwą aluzją do postaci z Dn 7. „Człowiek” byłby bardziej interpretacyjny, a „Syn Człowieka” mniej utrwalony w tym kontekście.
translation_notes:
  register: Współczesny, godny i przystępny rejestr narracyjny. Konstrukcję λέγων oddano interpunkcyjnie, aby uniknąć kalki „pytał, mówiąc”. Pytanie przełożono idiomatycznie jako „Kim, zdaniem ludzi, jest...”, zachowując sens greckiego bez wygładzania tytułu „Syn Człowieczy”.
