id: MAT.16.12
reference: Matthew 16:12
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: pl
  text: Wtedy zrozumieli, że nie powiedział, by wystrzegali się zaczynu chlebowego[a], lecz by wystrzegali się nauki faryzeuszy i saduceuszy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „zaczynu chlebów”; grecki rzeczownik oznaczający chleby lub bochenki występuje tu w liczbie mnogiej.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący moment, w którym uczniowie pojęli sens wypowiedzi.
- source_word: συνῆκαν
  choice: zrozumieli
  rationale: Aoryst wskazuje na dojście do zrozumienia; „zrozumieli” jest jasne i nie dodaje interpretacji.
- source_word: οὐκ εἶπεν
  choice: nie powiedział
  rationale: Polski czas przeszły naturalnie oddaje grecki aoryst; następstwo wydarzeń wynika z „wtedy” i kontekstu.
- source_word: προσέχειν ἀπό
  choice: by wystrzegali się
  rationale: W kontekście ostrzeżenia konstrukcja oznacza zachowanie czujności wobec czegoś; „wystrzegać się” dobrze oddaje tę siłę.
- source_word: τῆς ζύμης τῶν ἄρτων
  choice: zaczynu chlebowego
  rationale: „Zaczyn” zachowuje biblijną metaforę, a „chlebowy” brzmi naturalnie po polsku. Liczbę mnogą greckiego rzeczownika ἄρτων odnotowano w przypisie.
- source_word: ἀλλὰ
  choice: lecz
  rationale: Wyraźnie i godnie zaznacza kontrast między dosłownym zaczynem a zamierzonym znaczeniem metaforycznym.
- source_word: διδαχῆς
  choice: nauki
  rationale: „Nauka” jest naturalnym, współczesnym odpowiednikiem treści nauczania i nie narzuca specjalistycznego znaczenia dogmatycznego.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: faryzeuszy i saduceuszy
  rationale: Utrwalone w polszczyźnie biblijnej nazwy obu ugrupowań, zapisane małą literą zgodnie ze współczesną normą.
theological_decisions:
- issue: Metaforyczny sens „zaczynu”
  choice: 'Zachować obraz „zaczynu” i objaśnienie podane przez sam tekst: chodzi o naukę faryzeuszy i saduceuszy.'
  alternative: Rozwinąć sens jako „obłudę”, „fałszywą naukę” albo „zepsutą naukę”.
  rationale: Werset utożsamia zaczyn z nauką tych ugrupowań, ale nie określa jej tutaj dodatkowymi ocenami. Przekład nie importuje objaśnień z miejsc paralelnych ani tradycji wyznaniowej.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, prostym brzmieniu. Składnia „nie powiedział, by…” jest naturalna, a „zaczyn chlebowy” zachowuje metaforę bez niezręcznego dosłownego połączenia rzeczowników.
