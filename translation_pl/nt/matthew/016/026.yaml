id: MAT.16.26
reference: Matthew 16:26
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: pl
  text: Jaką bowiem korzyść odniesie człowiek, jeśli zdobędzie cały świat, lecz straci swoje życie? Albo co człowiek da w zamian za swoje życie?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub w obu miejscach: „swoją duszę”. Greckie słowo ψυχή może, zależnie od kontekstu, oznaczać „życie”, „osobę” albo „duszę”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Jaką bowiem korzyść
  rationale: τί wprowadza pytanie retoryczne, a γάρ wiąże je objaśniająco z poprzednią wypowiedzią. W polszczyźnie połączenie z rzeczownikiem „korzyść” naturalnie oddaje sens całego zwrotu wraz z ὠφεληθήσεται.
- source_word: ὠφεληθήσεται
  choice: odniesie korzyść
  rationale: Choć grecka forma jest bierna, polskie „odniesie korzyść” naturalnie i dokładnie wyraża otrzymanie pożytku, bez niezręcznego dosłownego passivum.
- source_word: ἄνθρωπος
  choice: człowiek
  rationale: Rzeczownik oznacza tutaj człowieka w sensie ogólnym i reprezentatywnym; polskie „człowiek” zachowuje ten zakres.
- source_word: τὸν κόσμον ὅλον
  choice: cały świat
  rationale: Oddaje całościowy zakres κόσμος wzmocniony przez ὅλον oraz zachowuje naturalny polski szyk.
- source_word: κερδήσῃ
  choice: zdobędzie
  rationale: Czasownik oznacza zyskać lub pozyskać. „Zdobędzie” brzmi naturalnie w odniesieniu do całego świata i zachowuje kontrast z utratą.
- source_word: τὴν ψυχὴν αὐτοῦ / τῆς ψυχῆς αὐτοῦ
  choice: swoje życie / za swoje życie
  rationale: ψυχή może oznaczać życie, osobę lub duszę. W tym kontekście „życie” dobrze oddaje pełną wartość istnienia człowieka, a tradycyjna i możliwa alternatywa „dusza” została zachowana w przypisie.
- source_word: ζημιωθῇ
  choice: straci
  rationale: Grecki czasownik może oznaczać poniesienie straty, utratę lub pozbawienie czegoś. „Straci” jasno oddaje przeciwstawienie zdobycia świata utracie własnego życia.
- source_word: ἀντάλλαγμα
  choice: w zamian za
  rationale: Wyrażenie zachowuje metaforę wymiany i jest idiomatyczne w połączeniu z czasownikiem „da”, bez zawężania sensu do okupu.
theological_decisions:
- issue: Znaczenie ψυχή w wypowiedzi o ostatecznej stracie
  choice: życie
  alternative: dusza
  rationale: Tekst nie wymaga ścisłego rozdzielenia ciała i niematerialnej duszy; ψυχή może tu obejmować życie lub samego człowieka w jego najwyższej wartości. „Życie” pozostawia ten szerszy sens, natomiast „dusza” jako ważna i tradycyjna możliwość została podana w przypisie.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Pytania retoryczne oraz objaśniająca funkcja γάρ zostały zachowane; uniknięto zarówno niezręcznej kalki strony biernej, jak i zawężenia antropologicznego sensu ψυχή.
