base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: pl
  text: Syn Człowieczy ma[a] bowiem przyjść w chwale swego Ojca wraz ze swoimi aniołami. Wtedy odpłaci każdemu stosownie do jego postępowania[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „ma wkrótce przyjść”. Greckie μέλλει z bezokolicznikiem oznacza, że wydarzenie ma nastąpić, i może podkreślać jego bliskość.'
    reason: lexical_alternative
  - marker: b
    text: 'Można też oddać: „według tego, co uczynił”. Grecki rzeczownik występuje w liczbie pojedynczej i może obejmować całe działanie lub sposób postępowania danej osoby.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: ma przyjść
  rationale: Konstrukcja „ma przyjść” naturalnie oddaje μέλλει z bezokolicznikiem, zachowując zarówno zapowiedź przyszłego wydarzenia, jak i możliwy odcień jego bliskości, bez sztucznego polskiego „właśnie ma przyjść”.
- source_word: γὰρ
  choice: bowiem
  rationale: „Bowiem” zwięźle wskazuje, że zdanie uzasadnia poprzednią wypowiedź, a zarazem odpowiada godnemu rejestrowi tekstu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tytułu, zachowujący jego formę i powiązania intertekstualne.
- source_word: ἔρχεσθαι
  choice: przyjść
  rationale: Bezokolicznik zależny od μέλλει; „przyjść” jest naturalnym odpowiednikiem i zachowuje eschatologiczne skojarzenia.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: w chwale swego Ojca
  rationale: „W chwale” zachowuje przyimek ἐν jako wskazanie sfery lub objawienia chwały, a „swego Ojca” jasno odnosi zaimek do Syna Człowieczego.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: wraz ze swoimi aniołami
  rationale: Oddaje towarzyszenie wyrażone przez μετά z dopełniaczem oraz zachowuje zaimek dzierżawczy.
- source_word: καὶ τότε
  choice: Wtedy
  rationale: 'Naturalnie zaznacza kolejność: najpierw przyjście, potem odpłata. Podział na dwa zdania pozwala oddać καί przez płynne następstwo bez przeciążenia składni.'
- source_word: ἀποδώσει
  choice: odpłaci
  rationale: W kontekście sądu czasownik oznacza oddanie każdemu tego, co mu się należy. „Odpłaci” zachowuje zarówno pozytywną, jak i negatywną możliwość, w przeciwieństwie do węższego „wynagrodzi”.
- source_word: ἑκάστῳ
  choice: każdemu
  rationale: Celownik i sens dystrybutywny są bezpośrednio i naturalnie oddane jednym polskim słowem.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: stosownie do jego postępowania
  rationale: Choć πρᾶξις występuje w liczbie pojedynczej, może ujmować całość działania lub postępowania danej osoby. „Postępowanie” zachowuje liczbę pojedynczą i brzmi naturalniej niż dosłowne „czyn” w tym kontekście.
theological_decisions:
- issue: Eschatologiczna wymowa μέλλει przy przyjściu Syna Człowieczego
  choice: „ma bowiem przyjść”, z przypisem wskazującym możliwy odcień bliskości
  alternative: „wkrótce przyjdzie” albo proste „przyjdzie”
  rationale: Greckie μέλλω z bezokolicznikiem może wskazywać na wydarzenie oczekiwane, mające nastąpić, niekiedy z odcieniem bliskości. Tekst główny zachowuje tę konstrukcję bez rozstrzygania sporu o czas spełnienia, a przypis ujawnia napięcie leksykalne.
- issue: Sąd stosownie do πρᾶξις każdego człowieka
  choice: „odpłaci każdemu stosownie do jego postępowania”
  alternative: „wynagrodzi każdego według jego uczynków” albo „odda każdemu według jego czynu”
  rationale: Sformułowanie zachowuje indywidualny i sądowy charakter odpłaty, lecz nie narzuca szerszego systemu doktrynalnego. „Postępowanie” oddaje zbiorowy sens pojedynczego πρᾶξις bez zmiany go na liczbę mnogą.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano tradycyjny tytuł „Syn Człowieczy”, unikając archaizmów takich jak „odda każdemu według uczynków jego”. Dwa zdania poprawiają czytelność, nie zacierając logicznego następstwa greckiego καὶ τότε.
