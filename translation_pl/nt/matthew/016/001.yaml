  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: pl
  text: Podeszli do niego faryzeusze i saduceusze i, wystawiając go na próbę[a], poprosili, żeby pokazał im znak z nieba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „kusząc go” albo „próbując go pochwycić w pułapkę”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: podeszli do niego
  rationale: Imiesłów aorystu wskazuje na zbliżenie się do Jezusa przed główną czynnością; polskie „podeszli do niego” oddaje ten ruch naturalnie i wyraźnie.
- source_word: Φαρισαῖοι
  choice: faryzeusze
  rationale: Utrwalona polska forma nazwy tego ugrupowania.
- source_word: Σαδδουκαῖοι
  choice: saduceusze
  rationale: Utrwalona polska forma nazwy tego ugrupowania.
- source_word: πειράζοντες
  choice: wystawiając go na próbę
  rationale: Oddaje sens sprawdzania z nieprzychylną intencją, nie przesądzając w tekście głównym, czy chodzi o kuszenie, czy o próbę pochwycenia Jezusa w pułapkę.
- source_word: ἐπηρώτησαν
  choice: poprosili
  rationale: W połączeniu z bezokolicznikiem ἐπιδεῖξαι czasownik wyraża prośbę lub żądanie wykonania czynności; „poprosili, żeby pokazał” jest naturalną polską konstrukcją.
- source_word: σημεῖον
  choice: znak
  rationale: Zachowuje podstawowe znaczenie greckiego rzeczownika bez dopowiadania w tekście głównym, że znak miał być cudowny.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: z nieba
  rationale: Naturalny polski odpowiednik wskazujący źródło lub pochodzenie znaku.
- source_word: ἐπιδεῖξαι
  choice: żeby pokazał
  rationale: Naturalnie oddaje bezokolicznik zależny od czasownika prośby, zachowując sens przedstawienia znaku do zobaczenia.
theological_decisions:
- issue: Wroga intencja prośby faryzeuszów i saduceuszów
  choice: „wystawiając go na próbę”
  alternative: „kusząc go” lub „próbując go pochwycić w pułapkę”
  rationale: Greckie πειράζοντες sygnalizuje próbę o nieprzychylnym charakterze, ale nie wymaga zawężenia sensu wyłącznie do kuszenia ani jawnego podstępu. Wybrany zwrot zachowuje tę intencjonalną i teologiczną niejednoznaczność.
translation_notes:
  register: Współczesny, standardowy i godny rejestr polski. Szyk zdania jest naturalny, a nazwy ugrupowań mają utrwalone polskie formy. Przypis zachowuje zakres znaczeniowy πειράζοντες bez przeciążania tekstu głównego interpretacją.
