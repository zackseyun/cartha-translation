source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: pl
  text: 'Jezus zaś odpowiedział mu: „Błogosławiony jesteś, Szymonie, Bar-Jona[a], bo nie objawiły ci tego ciało i krew[b], lecz mój Ojciec, który jest w niebiosach[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „Szymonie, synu Jony”. Grecki tekst zachowuje aramejską formę patronimiczną Bar-Jona.'
    reason: lexical_alternative
  - marker: b
    text: „Ciało i krew” to idiom oznaczający ludzi lub wyłącznie ludzkie źródło poznania.
    reason: cultural_note
  - marker: c
    text: 'Dosłownie: „w niebiosach”. W tym przekładzie zachowano liczbę mnogą występującą w tekście greckim.'
    reason: lexical_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jezus zaś odpowiedział mu
  rationale: Naturalnie oddaje typową konstrukcję imiesłów + czasownik osobowy („odpowiedział i powiedział”), bez zbędnego powtórzenia; δέ zachowano jako „zaś”.
- source_word: Μακάριος
  choice: Szczęśliwy
  rationale: W formule błogosławieństwa oznacza osobę znajdującą się w godnym uznania, uprzywilejowanym położeniu. „Szczęśliwy” jest naturalne we współczesnej polszczyźnie i nie sprowadza sensu wyłącznie do chwilowego uczucia.
- source_word: Σίμων Βαριωνᾶ
  choice: Szymonie Bar-Jona
  rationale: Zachowano utrwaloną polską postać imienia Szymon oraz obecną w grece aramejską formę patronimiczną; wołacz wynika ze składni wypowiedzi.
- source_word: ὅτι
  choice: bo
  rationale: Wprowadza przyczynę orzeczenia „Szczęśliwy jesteś”; „bo” jest jasne i naturalne w bezpośredniej wypowiedzi.
- source_word: σὰρξ καὶ αἷμα
  choice: ciało i krew
  rationale: Zachowuje dosłowne brzmienie idiomu określającego ludzi lub czysto ludzkie źródło poznania, nie zawężając go do własnego rozumowania Szymona ani do ludzkiego nauczyciela.
- source_word: ἀπεκάλυψέν σοι
  choice: nie objawiły ci tego
  rationale: „Objawić” zachowuje sens odsłonięcia prawdy i teologiczną doniosłość czasownika. „Tego” uzupełnia domyślny z kontekstu przedmiot; liczba mnoga orzeczenia jest zgodna z polską składnią szeregu „ciało i krew”.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: lecz mój Ojciec
  rationale: „Lecz” wyraźnie zachowuje przeciwstawienie ludzkiego i Bożego źródła objawienia.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: który jest w niebiosach
  rationale: Oddaje rodzajnikową konstrukcję opisową i grecką liczbę mnogą, a zarazem brzmi godnie i zrozumiale po polsku.
theological_decisions:
- issue: Źródło wyznania Szymona
  choice: Idiom „ciało i krew” szeroko wyklucza ludzkie źródło objawienia i przeciwstawia mu Ojca.
  alternative: Wyrażenie może być zawężane do naturalnego rozumowania samego Szymona albo do pouczenia przez innych ludzi.
  rationale: Tekst nie rozstrzyga, który konkretny rodzaj ludzkiego pośrednictwa jest wykluczony; przekład zachowuje szeroki kontrast między ludzkim a Bożym źródłem poznania.
- issue: Wartość znaczeniowa Μακάριος
  choice: Szczęśliwy
  alternative: Błogosławiony
  rationale: „Szczęśliwy” naturalnie komunikuje uprzywilejowane położenie adresata; przypis wskazuje tradycyjną alternatywę, ponieważ greckie słowo ma również religijną i eschatologiczną doniosłość.
translation_notes:
  register: Współczesna, godna polszczyzna o umiarkowanej formalności. Zachowano biblijny idiom „ciało i krew” oraz aramejski patronimik, objaśniając je w przypisach. Szyk pozostaje bliski grece, ale jest naturalny po polsku.
