id: MAT.16.21
reference: Matthew 16:21
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: pl
  text: Od tego czasu Jezus zaczął ukazywać swoim uczniom, że musi udać się do Jerozolimy, wiele wycierpieć ze strony starszych, naczelnych kapłanów i uczonych w Piśmie, zostać zabity i trzeciego dnia zostać wskrzeszony.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Od tego czasu
  rationale: Naturalnie zaznacza punkt zwrotny w narracji i zachowuje wyraźną wartość czasową greckiego wyrażenia.
- source_word: ἤρξατο δεικνύειν
  choice: zaczął ukazywać
  rationale: Oddaje rozpoczęcie nowego etapu nauczania; „ukazywać” zachowuje sens czynienia czegoś widocznym lub zrozumiałym, bez zawężenia do samego objaśniania.
- source_word: δεῖ αὐτὸν
  choice: musi
  rationale: Zwięźle zachowuje moc konieczności, nie rozstrzygając w samym przekładzie, czy chodzi o Boży zamysł, wypełnienie Pism czy inną podstawę tej konieczności.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: udać się do Jerozolimy
  rationale: Współczesne, godne i idiomatyczne określenie ruchu ku celowi.
- source_word: πολλὰ παθεῖν
  choice: wiele wycierpieć
  rationale: Naturalna polszczyzna zachowująca zakres greckiego πολλὰ oraz nacisk na rozległość cierpień.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: ze strony starszych, naczelnych kapłanów i uczonych w Piśmie
  rationale: „Ze strony” naturalnie oddaje źródło lub sprawców cierpienia wyrażonych przez ἀπό; nazwy grup są zrozumiałe we współczesnej polszczyźnie i odpowiadają ich funkcjom w kontekście.
- source_word: ἀποκτανθῆναι
  choice: zostać zabity
  rationale: Bezpośrednio i naturalnie oddaje bierny bezokolicznik.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: trzeciego dnia zostać wskrzeszony
  rationale: Zachowuje określenie czasu oraz bierną stronę greckiego czasownika.
theological_decisions:
- issue: Siła δεῖ w zapowiedzi męki
  choice: musi
  alternative: jest konieczne, aby
  rationale: Tekst stwierdza konieczność, ale w tym zdaniu nie określa wprost jej źródła. „Musi” zachowuje teologiczną wagę bez dopowiadania interpretacji.
- issue: Strona czasownika ἐγερθῆναι
  choice: zostać wskrzeszony
  alternative: zmartwychwstać / powstać z martwych
  rationale: Grecka forma jest bierna. Przekład bierny zachowuje brzmienie źródła i nie zaciera możliwej implikacji działania Boga.
translation_notes:
  register: Współczesny standardowy język polski, styl godny i czytelny. Zachowano formalną strukturę ciągu bezokoliczników, lecz zastosowano naturalne polskie związki frazeologiczne. Nie dodano przypisów, ponieważ użyte sformułowania wystarczająco przejrzyście oddają źródło bez konieczności sygnalizowania wariantów.
