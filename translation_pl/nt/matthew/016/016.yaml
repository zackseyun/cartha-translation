base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: pl
  text: 'Szymon Piotr odpowiedział: „Ty jesteś Mesjaszem[a], Synem żywego Boga”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „Chrystusem”. Grecki tytuł Χριστός można oddać jako „Chrystus”; tutaj przetłumaczono go jako „Mesjasz”, aby zachować jego tytularny sens i żydowski kontekst mesjański.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: odpowiedział
  rationale: Grecka konstrukcja dosłownie łączy imiesłów „odpowiedziawszy” z czasownikiem „powiedział”, lecz w naturalnej polskiej narracji oba elementy najlepiej oddaje jedno słowo „odpowiedział”.
- source_word: δὲ
  choice: —
  rationale: Partykuła sygnalizuje łagodne przejście lub ciąg dalszy wypowiedzi; polszczyzna nie wymaga tu osobnego odpowiednika.
- source_word: Σίμων Πέτρος
  choice: Szymon Piotr
  rationale: Zastosowano utrwalone polskie formy imion biblijnych.
- source_word: Σὺ
  choice: Ty
  rationale: Jawny zaimek w grece jest emfatyczny; polskie „Ty” zachowuje nacisk, mimo że sama forma czasownika wskazywałaby osobę.
- source_word: ὁ χριστός
  choice: Mesjaszem
  rationale: Χριστός pełni tutaj funkcję tytułu odpowiadającego hebrajskiemu „Mesjasz”, a nie części imienia. Narzędnik wynika z polskiej składni orzecznika po „jesteś”.
- source_word: ὁ υἱὸς
  choice: Synem
  rationale: 'Rodzajnik wskazuje na określony, tytularny sens: „Syn”. Narzędnik odpowiada polskiej składni po „jesteś”.'
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Boga żywego
  rationale: Zachowano dopełniaczową relację oraz atrybut „żywy”; szyk „Boga żywego” jest godny, naturalny i utrwalony w polszczyźnie biblijnej.
theological_decisions:
- issue: Oddanie Χριστός jako tytułu lub formy zbliżonej do imienia
  choice: Mesjasz
  alternative: Chrystus
  rationale: W wyznaniu Piotra słowo oznacza mesjański tytuł. Główny tekst przekłada jego znaczenie, a przypis zachowuje tradycyjny wariant „Chrystus”.
- issue: Znaczenie wyrażenia „Syn Boga”
  choice: Syn Boga żywego
  alternative: —
  rationale: Zachowano dokładne, tytularne i wyznaniowe brzmienie tekstu bez rozwijania go za pomocą późniejszych sformułowań doktrynalnych.
translation_notes:
  register: Współczesna, jasna i godna polszczyzna. Emfatyczne „Ty” zachowuje nacisk tekstu greckiego, a szyk „Boga żywego” utrzymuje podniosłość bez archaizowania.
