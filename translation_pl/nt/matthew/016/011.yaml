  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: pl
  text: Jak to, że nie rozumiecie, iż nie mówiłem wam o chlebie? Strzeżcie się jednak zakwasu faryzeuszów i saduceuszów[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „Uważajcie na zakwas faryzeuszów i saduceuszów”.'
    reason: lexical_alternative
  - marker: b
    text: „Zakwas” jest tutaj metaforą; w następnym wersecie zostaje objaśniony jako nauka faryzeuszów i saduceuszów.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Jak możecie nie rozumieć
  rationale: Pytanie ma charakter napominający i wyraża zdumienie brakiem zrozumienia. Taki zwrot jest naturalny po polsku i zachowuje retoryczną siłę oryginału.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: że nie mówiłem wam o chlebie
  rationale: Choć ἄρτων ma formę liczby mnogiej, w tym kontekście naturalnym polskim odpowiednikiem jest zbiorowe „chleb”. Imperfektywne „nie mówiłem” trafnie oddaje sens wypowiedzi dotyczącej chleba.
- source_word: προσέχετε δὲ
  choice: Strzeżcie się jednak
  rationale: Imperatyw προσέχετε z ἀπό jest ostrzeżeniem przed czymś. „Strzeżcie się” dobrze oddaje tę funkcję, a „jednak” zaznacza łagodne przeciwstawienie lub przejście wprowadzane przez δέ.
- source_word: ἀπὸ τῆς ζύμης
  choice: zakwasu
  rationale: „Zakwas” jest naturalnym i tradycyjnie rozpoznawalnym polskim odpowiednikiem ζύμη; zachowuje metaforę obecną w tekście źródłowym.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: faryzeuszów i saduceuszów
  rationale: Są to utrwalone polskie nazwy tych żydowskich ugrupowań. Dopełniacz wskazuje na zakwas związany z nimi lub dla nich charakterystyczny.
theological_decisions:
- issue: Metaforyczny sens „zakwasu”
  choice: Zachować w tekście głównym metaforę „zakwasu”, bez zastępowania jej słowem „nauka”.
  alternative: Strzeżcie się jednak nauki faryzeuszów i saduceuszów.
  rationale: Następny werset objaśnia metaforę jako naukę faryzeuszów i saduceuszów, lecz ten werset sam używa obrazu zakwasu. Zachowanie go respektuje kolejność i napięcie tekstu źródłowego.
translation_notes:
  register: Współczesny, standardowy język polski o godnym, biblijnym rejestrze. Zdanie zachowuje napominający ton pytania, ostrzegawczą siłę imperatywu oraz metaforę zakwasu, a zarazem pozostaje zrozumiałe dla zwykłego czytelnika.
