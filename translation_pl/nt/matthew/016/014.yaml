    issue: Niepełna konstrukcja po „mówią, że”
    rationale: W polskim spójnik „że” wprowadza zdanie z osobową formą czasownika. Narzędnikowe identyfikacje wymagają tu dopowiedzenia „jesteś”, które jest jednoznacznie dane przez pytanie bezpośrednio poprzedzające i nie zmienia sensu greckiej elipsy.
