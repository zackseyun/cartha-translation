  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: pl
  text: 'Oni zaś odpowiedzieli: „Jedni mówią, że jesteś Janem Chrzcicielem, inni — Eliaszem, a jeszcze inni — Jeremiaszem albo jednym z proroków”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Oni zaś odpowiedzieli
  rationale: Zaś naturalnie zaznacza przejście do odpowiedzi, nie wyolbrzymiając kontrastu; w kontekście pytania εἶπαν można idiomatycznie oddać jako „odpowiedzieli”.
- source_word: Οἱ μὲν
  choice: Jedni mówią
  rationale: μέν rozpoczyna wyliczenie różnych grup; polska konstrukcja „jedni… inni…” naturalnie oddaje ten podział.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Janem Chrzcicielem
  rationale: To utrwalone i powszechnie zrozumiałe polskie określenie tej postaci. Narzędnik wynika z eliptycznie domyślnego „że jesteś”.
- source_word: ἄλλοι δὲ Ἠλίαν
  choice: inni — Eliaszem
  rationale: Kontynuuje rozdzielne wyliczenie; tradycyjna polska forma imienia to „Eliasz”.
- source_word: ἕτεροι δὲ Ἰερεμίαν
  choice: a jeszcze inni — Jeremiaszem
  rationale: „Jeszcze inni” jasno wskazuje trzecią grupę, zaś „a” zachowuje lekki sygnał kolejnego członu wyliczenia.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: albo jednym z proroków
  rationale: Oddaje alternatywę bez dodawania słowa „innych”, którego tekst grecki nie zawiera.
theological_decisions:
- issue: Eliptyczny przedmiot utożsamień
  choice: 'Zachowano częściową elipsę: „Jedni mówią, że Janem Chrzcicielem…”'
  alternative: „Jedni mówią, że jesteś Janem Chrzcicielem…”
  rationale: 'Greka podaje same utożsamienia, opierając się na poprzednim pytaniu. W języku polskim samo „Jedni: Janem Chrzcicielem” byłoby nienaturalne, dlatego dodano minimalne „mówią, że”, lecz nie dopowiedziano zaimka i czasownika „jesteś”.'
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Konstrukcja „jedni… inni… jeszcze inni” naturalnie odtwarza greckie wyliczenie; pauzy zwiększają czytelność eliptycznych utożsamień.
