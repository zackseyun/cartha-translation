  text: He says to them[a], “But who do you say that I am?”
translation:
  language: pl
  text: 'Mówi im: „A wy za kogo mnie uważacie?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bardziej formalnie: „A wy, kim mówicie, że jestem?”. W grece występuje konstrukcja z biernikiem i bezokolicznikiem, którą w polszczyźnie idiomatycznie oddano pytaniem: „za kogo mnie uważacie?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Mówi
  rationale: Grecki czas teraźniejszy pełni funkcję praesens historicum. Polski czas teraźniejszy zachowuje żywość narracji i brzmi naturalnie.
- source_word: αὐτοῖς
  choice: im
  rationale: Zaimek w celowniku wskazuje adresatów wypowiedzi; zwięzłe polskie „im” jest naturalnym odpowiednikiem.
- source_word: Ὑμεῖς δὲ
  choice: A wy
  rationale: Jawny zaimek ὑμεῖς jest emfatyczny, a δέ zaznacza przeciwstawienie opiniom przytoczonym wcześniej. „A wy” naturalnie oddaje zarówno zmianę punktu odniesienia, jak i nacisk na uczniów.
- source_word: τίνα με λέγετε εἶναι
  choice: za kogo mnie uważacie
  rationale: Grecka konstrukcja accusativus cum infinitivo dosłownie przedstawia pytanie, kim uczniowie mówią, że Jezus jest. Polski idiom „za kogo mnie uważacie” naturalnie wyraża pytanie o ich własne rozpoznanie jego tożsamości, choć czasownik λέγετε jest dosłownie związany z mówieniem; tę formalną różnicę odnotowano w przypisie.
theological_decisions:
- issue: Nacisk na osobistą odpowiedź uczniów
  choice: „A wy za kogo mnie uważacie?”
  alternative: „Wy zaś kim, jak mówicie, jestem?”
  rationale: Sformułowanie zachowuje kontrast między opiniami innych ludzi a odpowiedzią uczniów, nie uprzedzając treści wyznania, które pojawia się dopiero w następnym wersecie.
translation_notes:
  register: Współczesny, naturalny i godny rejestr. „A wy” wyraźnie zachowuje kontrast oraz emfatyczny zaimek, a historyczny czas teraźniejszy „Mówi” odpowiada formie greckiej.
