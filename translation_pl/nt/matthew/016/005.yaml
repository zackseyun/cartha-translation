  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: pl
  text: Gdy uczniowie przybyli na drugi brzeg, zapomnieli zabrać chleba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „chlebów” lub „bochenków”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: gdy ... przybyli
  rationale: Imiesłów aorystu oddano naturalnym polskim zdaniem czasowym, zachowując jego relację do głównego czasownika.
- source_word: οἱ μαθηταὶ
  choice: uczniowie
  rationale: To utrwalone i kontekstowo właściwe określenie uczniów Jezusa w Ewangeliach.
- source_word: εἰς τὸ πέραν
  choice: na drugi brzeg
  rationale: Zwrot oznacza dotarcie na przeciwną stronę jeziora; „na drugi brzeg” jest naturalne i precyzyjne po polsku.
- source_word: ἐπελάθοντο
  choice: zapomnieli
  rationale: Czasownik oznacza „zapomnieć”; polski aspekt dokonany jasno wskazuje, że nie zabrali chleba wskutek zapomnienia.
- source_word: ἄρτους
  choice: chleba
  rationale: 'Grecki rzeczownik występuje w liczbie mnogiej („chleby/bochenki”), lecz w tym kontekście naturalna polszczyzna używa rzeczownika zbiorowego w dopełniaczu: „zabrać chleba”.'
- source_word: λαβεῖν
  choice: zabrać
  rationale: W kontekście podróży „zabrać” naturalnie wyraża wzięcie czegoś ze sobą i dobrze oddaje sens bezokolicznika λαβεῖν.
