  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: pl
  text: Ani siedmiu chlebów dla czterech tysięcy — i ile wielkich koszy zebraliście?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Ani
  rationale: Partykuła kontynuuje ciąg pytań retorycznych i nawiązuje do wcześniejszego przeczenia; polskie „ani” naturalnie zachowuje tę więź, choć werset samodzielnie brzmi eliptycznie.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: siedmiu chlebów
  rationale: W kontekście nakarmienia tłumu ἄρτοι oznacza konkretne bochenki chleba; w polskiej narracji biblijnej naturalne jest liczenie ich jako „chlebów”.
- source_word: τῶν τετρακισχιλίων
  choice: dla czterech tysięcy
  rationale: Dopełniacz określa związek chlebów z nakarmieniem czterech tysięcy; „dla” jasno i naturalnie oddaje tę relację w języku polskim.
- source_word: πόσας
  choice: ile
  rationale: Zaimek pytajny określa liczbę koszy; „ile” jest bezpośrednim polskim odpowiednikiem.
- source_word: σπυρίδας
  choice: wielkich koszy
  rationale: σπυρίς oznacza duży kosz i różni się od κόφινος użytego przy nakarmieniu pięciu tysięcy; przymiotnik „wielkich” zachowuje to rozróżnienie.
- source_word: ἐλάβετε
  choice: zebraliście
  rationale: W kontekście pozostałych ułomków czasownik odnosi się do zebrania ich do koszy; „zebraliście” jest naturalne i precyzyjne.
