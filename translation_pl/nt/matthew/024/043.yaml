source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: pl
  text: 'Ale to wiedzcie: gdyby gospodarz wiedział, podczas której straży nocnej[a] przychodzi złodziej, czuwałby i nie pozwoliłby włamać się do swego domu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noc dzielono na kolejne okresy czuwania, nazywane strażami.
    reason: cultural_note
  - marker: b
    text: 'Dosłownie: „aby jego dom został przekopany” — obraz włamania przez przekopanie się przez ścianę, a niekiedy także przez dach budynku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: A to wiedzcie
  rationale: Oddaje zmianę toku wypowiedzi zaznaczoną przez δέ oraz bezpośrednie wezwanie skierowane do słuchaczy. Forma γινώσκετε może być morfologicznie oznajmująca lub rozkazująca; kontekst wspiera naturalne w polszczyźnie wezwanie „wiedzcie”.
- source_word: οἰκοδεσπότης
  choice: gospodarz
  rationale: W tym obrazie oznacza zwierzchnika domu. „Gospodarz” jest naturalne i nie narzuca współczesnego założenia o prawnym posiadaniu nieruchomości.
- source_word: ποίᾳ φυλακῇ
  choice: o której straży nocnej
  rationale: φυλακή oznacza tu jedną z części, na które dzielono noc. Dodanie „nocnej” jasno przekazuje sens kulturowego określenia czasu.
- source_word: ὁ κλέπτης ἔρχεται
  choice: przychodzi złodziej
  rationale: Zachowuje grecki czas teraźniejszy w zdaniu zależnym i brzmi naturalnie po polsku w hipotetycznym obrazie.
- source_word: ἐγρηγόρησεν ἂν
  choice: czuwałby
  rationale: γρηγορέω obejmuje pozostawanie przytomnym i czujnym; „czuwałby” zwięźle zachowuje oba odcienie oraz związek z nocnymi strażami.
- source_word: οὐκ ἂν εἴασεν
  choice: nie pozwoliłby
  rationale: 'Naturalnie oddaje kontrfaktyczną konstrukcję z ἄν i znaczenie czasownika ἐάω: dopuścić lub pozwolić.'
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: włamać się do swego domu
  rationale: Idiomyczne polskie wyrażenie przekazuje skutek działania złodzieja. Dosłowny obraz przebicia lub przekopania ściany zachowano w przypisie.
theological_decisions:
- issue: Charakter wezwania γινώσκετε
  choice: wiedzcie
  alternative: wiecie / rozumiecie
  rationale: Grecka forma sama w sobie może być odczytana jako tryb oznajmujący albo rozkazujący. W kontekście napomnienia do czujności imperatyw daje najbardziej spójny i naturalny sens, bez dodawania treści doktrynalnej.
- issue: Ujęcie postaci οἰκοδεσπότης
  choice: gospodarz
  alternative: pan domu / właściciel domu
  rationale: Jest to element porównania, nie tytuł teologiczny. „Gospodarz” zachowuje funkcję zwierzchnika domostwa, nie przesądzając kwestii własności.
- issue: Obraz włamania διορύσσω
  choice: włamać się do domu
  alternative: przebić / podkopać dom
  rationale: Tekst opisuje wtargnięcie złodzieja przez naruszenie konstrukcji domu. Przekład główny podaje sens idiomatycznie, a przypis zachowuje konkretny starożytny obraz.
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. Zachowano zwięzłość przestrogi oraz obraz nocnego czuwania; termin kulturowy objaśniono w przypisie.
