  terminology: „Sługa” trafnie oddaje funkcję δοῦλος w obrazie przypowieści, z „niewolnikiem” jako właściwą alternatywą. „Pan” jest właściwym przekładem κύριος w bezpośredniej scenie relacji sługi z panem domu. Nie ma podstaw, by kapitalizacją narzucać interpretację chrystologiczną.
