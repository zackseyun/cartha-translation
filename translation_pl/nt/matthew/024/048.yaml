  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: pl
  text: 'Lecz jeśli ów zły sługa[a] powie w swoim sercu: „Pan mój zwleka”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „ów zły niewolnik”. Greckie doulos może oznaczać zarówno sługę, jak i niewolnika, zależnie od kontekstu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Lecz jeśli
  rationale: ἐὰν z aorystem trybu łączącego wprowadza warunek, a δέ zaznacza łagodny kontrast; „lecz jeśli” naturalnie oddaje oba elementy.
- source_word: εἴπῃ
  choice: powie
  rationale: Polski czas przyszły po „jeśli” idiomatycznie oddaje aoryst trybu łączącego w zdaniu warunkowym, bez sugerowania, że wypowiedź już trwa.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ów zły sługa
  rationale: κακός określa moralną niegodziwość, δοῦλος w obrazie domu wskazuje na podległego sługę, a „ów” zachowuje wskazujący nacisk ἐκεῖνος. Możliwe znaczenie „niewolnik” podano w przypisie.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: w swoim sercu
  rationale: Zachowano źródłową metaforę wewnętrznej myśli lub mowy do siebie; forma „swoim” jest naturalna przy polskim podmiocie zdania.
- source_word: Χρονίζει
  choice: zwleka
  rationale: Czasownik oznacza przedłużanie oczekiwania lub opóźnianie przybycia. „Zwleka” jest zwięzłe i naturalne, a zarazem nie określa przyczyny opóźnienia.
- source_word: μου ὁ κύριος
  choice: mój pan
  rationale: W bezpośrednim obrazie gospodarstwa κύριος oznacza pana sługi. Mała litera zachowuje poziom narracji przypowieści, nie wykluczając jej szerszego odniesienia.
theological_decisions:
- issue: Oddanie κύριος w przypowieści mającej także szersze odniesienie do przyjścia Syna Człowieczego
  choice: mój pan
  alternative: mój Pan; mój władca
  rationale: Bezpośrednio mówi sługa o swoim zwierzchniku w gospodarstwie, dlatego „pan” najlepiej oddaje sens sceny. Tłumaczenie nie powinno samą kapitalizacją rozstrzygać parabolicznego odniesienia chrystologicznego; możliwość oddania tytułu jako „Pan” zaznaczono w przypisie.
- issue: Zakres znaczeniowy δοῦλος
  choice: sługa
  alternative: niewolnik
  rationale: W tym miejscu nacisk pada na powierzoną funkcję i zachowanie podległego człowieka w domu. „Niewolnik” pozostaje jednak autentyczną możliwością leksykalną i dlatego pojawia się w przypisie.
translation_notes:
  register: Współczesny, zwięzły i godny rejestr. Zachowano biblijną metaforę „w swoim sercu” oraz demonstratywne „ów”, unikając archaicznej składni. Przecinek na końcu odpowiada temu, że werset urywa zdanie kontynuowane w następnym wersecie.
