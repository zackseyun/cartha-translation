  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: pl
  text: Wtedy wydadzą was na ucisk[a] i zabiją was, a wszystkie narody będą was nienawidzić z powodu mojego imienia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „na udrękę”, „na prześladowanie” lub „na cierpienie”. Greckie słowo może oznaczać niedolę, opresję albo ucisk.'
    reason: lexical_alternative
  - marker: c
    text: 'Dosłownie: „z powodu mojego imienia”, czyli z powodu wierności Jezusowi i temu, co reprezentuje jego imię.'
    reason: lexical_explanation
lexical_decisions:
- source_word: Τότε
  choice: Wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, zachowujący następstwo wydarzeń w wypowiedzi Jezusa.
- source_word: παραδώσουσιν ὑμᾶς
  choice: wydadzą was
  rationale: Czasownik oznacza przekazanie kogoś w cudzą władzę. „Wydadzą was” zachowuje wrogi sens, nie dodając węższego pojęcia zdrady.
- source_word: εἰς θλῖψιν
  choice: na ucisk
  rationale: „Ucisk” obejmuje niedolę, opresję i prześladowanie, a zarazem zachowuje możliwy eschatologiczny wydźwięk słowa θλῖψις w tym rozdziale.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: zabiją was
  rationale: Bezpośredni i współczesny odpowiednik greckiego czasownika, bez dodatkowych niuansów prawnych lub moralnych.
- source_word: ἔσεσθε μισούμενοι
  choice: będą was nienawidzić
  rationale: Naturalna polska konstrukcja oddająca przyszły sens greckiej formy opisowej; strona czynna brzmi po polsku swobodniej niż „będziecie znienawidzeni” i zachowuje ten sam sens.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: wszystkie narody
  rationale: W tym kontekście ἔθνη najpewniej wskazuje na powszechny zasięg wrogości, nie na ścisłe przeciwstawienie Żydów poganom.
- source_word: διὰ τὸ ὄνομά μου
  choice: z powodu mojego imienia
  rationale: Zachowuje przyczynowe znaczenie διά oraz biblijną treść „imienia” jako tego, co reprezentuje osobę Jezusa, bez zastępowania jej objaśniającą parafrazą.
theological_decisions:
- issue: Znaczenie θλῖψις w mowie eschatologicznej
  choice: ucisk
  alternative: udręka; prześladowanie; cierpienie
  rationale: „Ucisk” zachowuje zarówno zwykły sens doznawanej opresji, jak i możliwy szerszy wydźwięk eschatologiczny, nie narzucając określonego systemu interpretacji czasów ostatecznych.
- issue: Zakres znaczeniowy ἔθνη
  choice: narody
  alternative: poganie
  rationale: Sformułowanie „wszystkie narody” najlepiej oddaje powszechny zasięg wrogości. Przekład „poganie” wprowadzałby rozróżnienie etniczno-religijne, którego kontekst nie wymaga.
- issue: Znaczenie wyrażenia „z powodu mojego imienia”
  choice: zachowanie obrazu imienia w tekście głównym
  alternative: z powodu wierności mnie
  rationale: Dosłowniejsze brzmienie zachowuje bogactwo biblijnego pojęcia imienia, natomiast przypis wyjaśnia jego sens bez zawężania tekstu głównego.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano zwięzłość oraz prorocki rytm zdania. „Ucisk” jest celowo nieco bardziej podniosły, ponieważ lepiej niż węższe „prześladowanie” zachowuje wieloznaczność i napięcie eschatologiczne greckiego θλῖψις.
