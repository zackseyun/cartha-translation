  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: pl
  text: A ten, kto jest na polu, niech nie wraca, żeby zabrać swój płaszcz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „swoją szatę” albo „swoje okrycie wierzchnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: ten, kto będzie na polu
  rationale: Grecka fraza z rodzajnikiem pełni funkcję rzeczownikową i wskazuje reprezentatywnie na osobę znajdującą się na polu. Konstrukcja „ten, kto” zachowuje liczbę pojedynczą, nie ograniczając sensu wyłącznie do mężczyzn; czas przyszły naturalnie wpisuje ostrzeżenie w zapowiadane okoliczności.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: niech nie wraca
  rationale: Aoryst imperativus z μή wyraża stanowczy zakaz. Polski czasownik „wracać” zawiera już sens ruchu z powrotem wyrażony przez ὀπίσω, dlatego osobne „z powrotem” byłoby zbędne.
- source_word: ἆραι
  choice: żeby zabrać
  rationale: Bezokolicznik wyraża cel ewentualnego powrotu. „Zabrać” naturalnie oddaje podjęcie rzeczy należącej do danej osoby i wzięcie jej ze sobą podczas ucieczki.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: swój płaszcz
  rationale: ἱμάτιον często oznacza wierzchnie okrycie lub płaszcz. Zaimek zwrotny „swój” jest naturalnym polskim odpowiednikiem αὐτοῦ, gdy właścicielem jest podmiot zdania.
theological_decisions:
- issue: Zakres rodzaju gramatycznego w ὁ ἐν τῷ ἀγρῷ
  choice: ten, kto będzie na polu
  alternative: mężczyzna, który będzie na polu
  rationale: Męska forma rodzajnika jest tutaj reprezentatywna i nie wymaga zawężenia ostrzeżenia do mężczyzn. „Ten, kto” zachowuje jednostkowy charakter wypowiedzi oraz ogólny zakres odniesienia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Składnia zachowuje naglący charakter zakazu, a „płaszcz” konkretnie i naturalnie oddaje typowe znaczenie ἱμάτιον.
