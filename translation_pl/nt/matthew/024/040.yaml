  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: pl
  text: 'Wtedy dwaj mężczyźni będą na polu: jeden zostanie zabrany[a], a drugi pozostawiony.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „wzięty ze sobą”. Sam czasownik nie rozstrzyga, czy chodzi o zabranie ku ocaleniu, czy na sąd.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Naturalny przysłówek czasowy, który łączy wypowiedź z poprzedzającym kontekstem eschatologicznym.
- source_word: δύο ἔσονται
  choice: dwaj mężczyźni będą
  rationale: Choć rzeczownik „mężczyźni” jest domyślny, męskie formy εἷς ... εἷς oraz równoległy przykład dotyczący kobiet w następnym wersecie wskazują na dwóch mężczyzn. W języku polskim „dwaj” również wyraża męskoosobowość.
- source_word: ἐν τῷ ἀγρῷ
  choice: na polu
  rationale: Najbardziej naturalny i bezpośredni polski odpowiednik określenia miejsca.
- source_word: εἷς ... εἷς
  choice: jeden ... drugi
  rationale: Polskie „jeden ... drugi” jasno i naturalnie oddaje kontrast między dwiema osobami, choć greka dosłownie powtarza „jeden”.
- source_word: παραλαμβάνεται
  choice: zostanie zabrany
  rationale: 'Czas teraźniejszy w opisie przyszłego wydarzenia naturalnie oddano po polsku czasem przyszłym. „Zabrany” zachowuje niejednoznaczność co do celu: ocalenia albo sądu.'
- source_word: ἀφίεται
  choice: pozostawiony
  rationale: Oddaje bierny sens czasownika bez interpretacyjnie obciążonego dodatku „w tyle” ani mocniejszego „porzucony”.
theological_decisions:
- issue: Czy παραλαμβάνεται oznacza zabranie ku ocaleniu, czy ku sądowi
  choice: Neutralne „zostanie zabrany” w tekście głównym
  alternative: „zostanie wzięty ze sobą” albo interpretacyjne wskazanie zabrania na sąd bądź ku ocaleniu
  rationale: Sam czasownik i bezpośredni kontekst nie rozstrzygają jednoznacznie celu zabrania; przekład powinien zachować tę teologiczną niejednoznaczność.
- issue: Czy wyraźnie wskazać płeć dwóch osób
  choice: „dwaj mężczyźni”
  alternative: „dwaj”
  rationale: Męskoosobowa składnia εἷς ... εἷς oraz żeński przykład w następnym wersecie wspierają rozumienie tej sceny jako dotyczącej dwóch mężczyzn; jawne dopełnienie jest przy tym naturalne po polsku.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano zwięzły kontrast zdania oraz nie rozstrzygnięto eschatologicznego znaczenia zabrania i pozostawienia.
