  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: pl
  text: Bo jak błyskawica pojawia się ze wschodu i jest widoczna aż po zachód, tak będzie z przyjściem Syna Człowieczego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „obecnością”. Greckie słowo παρουσία może oznaczać „obecność” albo „przybycie”; w tym kontekście odnosi się do przyszłego przyjścia Syna Człowieczego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Bo jak
  rationale: Oddaje wyjaśniające γάρ oraz porównawcze ὥσπερ w naturalnej polszczyźnie.
- source_word: ἡ ἀστραπή
  choice: błyskawica
  rationale: Najbardziej bezpośredni i naturalny polski odpowiednik zjawiska wskazanego w porównaniu.
- source_word: ἐξέρχεται ἀπὸ ἀνατολῶν
  choice: pojawia się na wschodzie
  rationale: W odniesieniu do błyskawicy naturalne polskie sformułowanie oddaje jej wyłonienie się od strony wschodu; liczba mnoga ἀνατολῶν ma tu sens kierunkowy.
- source_word: φαίνεται ἕως δυσμῶν
  choice: jest widoczna aż na zachodzie
  rationale: Zachowuje bierny sens φαίνεται oraz rozciągłość wyrażoną przez ἕως w kontraście wschód–zachód.
- source_word: οὕτως ἔσται
  choice: tak będzie z
  rationale: Naturalna polska konstrukcja porównawcza zachowująca przyszły sens wypowiedzi.
- source_word: ἡ παρουσία
  choice: przyjście
  rationale: W tym eschatologicznym kontekście słowo oznacza przyszłe przybycie lub ukazanie się Syna Człowieczego; alternatywny sens „obecność” zachowano w przypisie.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Syna Człowieczego
  rationale: Utrwalony polski odpowiednik tytułu, zachowujący jego związek z tradycją biblijną, zwłaszcza z Dn 7.
theological_decisions:
- issue: Znaczenie παρουσία w wypowiedzi eschatologicznej
  choice: przyjście
  alternative: obecność; przybycie
  rationale: Porównanie z widoczną błyskawicą wskazuje tu na przyszłe, jawne przybycie Syna Człowieczego. Przekład „przyjście” nie narzuca bardziej szczegółowego schematu eschatologicznego, a leksykalną możliwość „obecność” podaje przypis.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. Konstrukcja „tak będzie z przyjściem” jest bardziej naturalna niż dosłowne „tak będzie przyjście”, a zarazem zachowuje strukturę porównania. Marker przypisu umieszczono bezpośrednio po zdaniu, którego dotyczy.
