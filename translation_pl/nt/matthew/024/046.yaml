source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: pl
  text: Szczęśliwy ten sługa, którego jego pan, gdy przyjdzie, zastanie tak czyniącego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Szczęśliwy
  rationale: Oddaje stan osoby godnej uznania i znajdującej się w pomyślnym położeniu; w tym kontekście brzmi naturalnie i zachowuje formę błogosławieństwa.
- source_word: δοῦλος
  choice: sługa
  rationale: W przypowieści chodzi o osobę podległą panu i wykonującą powierzone obowiązki. „Sługa” jest naturalne w polszczyźnie biblijnej, choć greckie słowo może też oznaczać niewolnika.
- source_word: κύριος
  choice: pan
  rationale: Relacyjny odpowiednik osoby sprawującej władzę nad sługą; zachowuje również możliwy rezonans tytułu „Pan”, nie wymuszając go wielką literą w warstwie przypowieściowej.
- source_word: οὕτως ποιοῦντα
  choice: przy takim postępowaniu
  rationale: Odsyła do wykonywania czynności opisanych w poprzednim wersecie. Polski zwrot oddaje ciągłość działania bez niezręcznego dosłownego „czyniącego tak”.
theological_decisions:
- issue: Czy κύριος należy zapisać jako „Pan” w sensie chrystologicznym, czy jako „pan” w obrębie przypowieści
  choice: pan
  alternative: Pan
  rationale: Bezpośrednia składnia oznacza pana danego sługi. Mała litera zachowuje obraz przypowieści i nie usuwa możliwości odniesienia do Jezusa w szerszym kontekście.
- issue: Zakres μακάριος
  choice: Szczęśliwy
  alternative: Błogosławiony
  rationale: „Szczęśliwy” jasno komunikuje pomyślny stan sługi, nie zawężając wypowiedzi do wyłącznie liturgicznego lub technicznie religijnego sensu.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie zachowuje uroczysty charakter sentencji, ale unika archaicznego „którego pan jego” oraz kalki „czyniącego tak”.
