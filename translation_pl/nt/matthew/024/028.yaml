  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: pl
  text: Gdziekolwiek będzie martwe ciało, tam zgromadzą się sępy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „orły”. Greckie słowo może oznaczać orły, jednak w obrazie ptaków zbierających się przy martwym ciele bardziej naturalne są sępy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Gdziekolwiek będzie
  rationale: Połączenie ὅπου z ἐάν i trybem łączącym wyraża nieokreślone miejsce. „Gdziekolwiek będzie” brzmi naturalnie po polsku i zachowuje tę nieokreśloność.
- source_word: πτῶμα
  choice: martwe ciało
  rationale: πτῶμα oznacza ciało zmarłego lub padłe ciało. „Martwe ciało” jest jasne, godne i nie ogranicza obrazu wyłącznie do zwierzęcej padliny.
- source_word: συναχθήσονται
  choice: zgromadzą się
  rationale: Choć forma grecka jest bierna, w tym kontekście może naturalnie opisywać zebranie się ptaków. Polska forma zwrotna oddaje sens bez niezręcznego „zostaną zgromadzone”.
- source_word: ἀετοί
  choice: sępy
  rationale: ἀετός często oznacza orła, lecz obraz ptaków zbierających się przy martwym ciele wskazuje tu najpewniej na sępy. Ponieważ znaczenie „orły” pozostaje leksykalnie możliwe, zachowano je w przypisie.
theological_decisions:
- issue: Znaczenie obrazu martwego ciała i ptaków
  choice: Oddać przysłowiowy obraz bez wskazywania jego konkretnego eschatologicznego odpowiednika.
  alternative: Objaśnić go jako nieuchronny sąd, widzialność przyjścia Syna Człowieczego albo odniesienie do zburzenia Jerozolimy lub rzymskich znaków wojskowych.
  rationale: Tekst grecki nie wyjaśnia wprost symbolicznego znaczenia martwego ciała ani ptaków. Przekład powinien zachować tę otwartość interpretacyjną.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Zachowano zwięzłą, przysłowiową budowę zdania oraz równoległość „gdziekolwiek… tam…”. Marker przypisu umieszczono bezpośrednio po słowie, którego dotyczy.
