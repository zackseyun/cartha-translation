  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: pl
  text: 'Wtedy, jeśli ktoś wam powie: „Oto tu jest Mesjasz[a]!” albo: „Tu[b]!”, nie wierzcie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „Chrystus”.'
    reason: Alternatywny, tradycyjny sposób oddania tytułu ὁ χριστός.
  - marker: b
    text: 'Możliwe rozwinięcie: „Jest tu!”. Grecki tekst ma samo „Tu!”.'
    reason: Wyjaśnienie eliptycznej konstrukcji i możliwego rozwinięcia jej po polsku.
lexical_decisions:
- source_word: τότε
  choice: Wtedy
  rationale: Zwięzły przysłówek czasowy zachowuje związek tego ostrzeżenia z poprzedzającą mową o wydarzeniach przyszłych.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: jeśli ktoś wam powie
  rationale: Naturalnie oddaje konstrukcję warunkową z nieokreślonym podmiotem τις oraz liczbę mnogą zaimka ὑμῖν.
- source_word: Ἰδοὺ
  choice: Oto
  rationale: Współczesny, lecz godny polski wyraz wskazujący i przyciągający uwagę; w tym zdaniu brzmi naturalniej niż rozkazujące „Spójrzcie”.
- source_word: ὧδε
  choice: tutaj / Tutaj
  rationale: Oba wystąpienia tego samego greckiego przysłówka miejsca oddano konsekwentnie, nie zastępując drugiego słowem „tam”, którego tekst źródłowy nie zawiera.
- source_word: ὁ χριστός
  choice: Mesjasz
  rationale: Rodzajnik i kontekst roszczeń do tożsamości oczekiwanego Pomazańca wskazują, że Χριστός pełni tu funkcję tytułu, nie imienia własnego.
- source_word: μὴ πιστεύσητε
  choice: nie wierzcie
  rationale: Polski czasownik może naturalnie wystąpić bez dopełnienia; odniesienie do przytoczonego twierdzenia pozostaje jasne bez dodawania nieobecnego w grece „mu” lub „w to”.
theological_decisions:
- issue: Sposób oddania tytułu Χριστός
  choice: Mesjasz
  alternative: Chrystus / Pomazaniec
  rationale: W kontekście rozpoznawania oczekiwanego wybawiciela „Mesjasz” jasno zachowuje tytularne znaczenie terminu, a przypis podaje tradycyjny polski odpowiednik.
- issue: Elipsa w drugim Ὧδε
  choice: „Tutaj!”
  alternative: „Jest tutaj!”
  rationale: Greka nie powtarza podmiotu ani orzeczenia. Zachowanie krótkiego, urwanego wskazania nie przesądza ponad tekst, co dokładnie należy domyślnie uzupełnić.
translation_notes:
  register: Nowoczesny standardowy polski o godnym, bezpośrednim brzmieniu. Zachowano zwięzłość ostrzeżenia oraz elipsę drugiej wypowiedzi; interpunkcja wyraźnie rozdziela dwa cytowane okrzyki.
