  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: pl
  text: O tym jednak dniu i godzinie nikt nie wie — ani aniołowie niebios, ani Syn[a] — tylko sam Ojciec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Niektóre rękopisy pomijają słowa „ani Syn”. Tekst główny jest zgodny z brzmieniem SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: O tym jednak
  rationale: Przyimek περί z dopełniaczem wprowadza temat, a δέ zaznacza przejście z lekkim odcieniem przeciwstawienia. „O tym jednak” brzmi naturalnie po polsku i zachowuje obie funkcje.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: dniu i godzinie
  rationale: Zaimek „tym” wprowadzony na początku zdania odnosi się naturalnie do całego skoordynowanego wyrażenia „dniu i godzinie”, bez niezręcznego powtórzenia.
- source_word: οὐδεὶς οἶδεν
  choice: nikt nie wie
  rationale: To bezpośredni i naturalny odpowiednik powszechnego przeczenia οὐδείς oraz czasownika οἶδα użytego w znaczeniu teraźniejszym.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: ani aniołowie niebios
  rationale: οὐδέ dołącza kolejny wykluczony podmiot, a „ani” naturalnie współgra z wcześniejszym „nikt nie wie”. „Aniołowie niebios” zachowuje źródłowy dopełniacz i podniosły, lecz zrozumiały rejestr.
- source_word: οὐδὲ ὁ υἱός
  choice: ani Syn
  rationale: Wyrażenie pozostaje współrzędne względem poprzedniego członu przeczącego. Wielka litera wskazuje na rozpoznawalny tytuł odnoszący się do Syna.
- source_word: εἰ μὴ
  choice: tylko
  rationale: Po zdaniu przeczącym εἰ μή wprowadza wyjątek. Polskie „tylko” z następującym „sam Ojciec” jasno i idiomatycznie oddaje tę funkcję.
- source_word: ὁ πατὴρ μόνος
  choice: sam Ojciec
  rationale: μόνος wyłącza wszystkie inne osoby; „sam Ojciec” zachowuje tę wyłączność i brzmi naturalnie po polsku. Wielka litera odpowiada użyciu tytułu Bożego.
theological_decisions:
- issue: Chrystologiczna wymowa słów „ani Syn”
  choice: Zachować w tekście głównym pełne wyrażenie „ani Syn”, bez łagodzenia ani objaśniającej parafrazy.
  alternative: Pominąć te słowa zgodnie z częścią tradycji rękopiśmiennej albo sparafrazować je tak, by osłabić napięcie teologiczne.
  rationale: Tekst SBLGNT zawiera οὐδὲ ὁ υἱός. Przekład powinien wiernie zachować stwierdzenie źródła i wynikające z niego napięcie, nie rozstrzygając go interpretacyjnym dodatkiem.
translation_notes:
  register: Współczesny, standardowy polski o godnym rejestrze. Składnia jest prosta i czytelna, a pauzy uwydatniają kolejne wyłączenia bez dodawania interpretacji.
