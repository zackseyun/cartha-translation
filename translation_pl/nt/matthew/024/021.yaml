  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: pl
  text: Wtedy bowiem nastanie wielki ucisk[a], jakiego nie było od początku świata aż dotąd i nigdy już nie będzie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „wielka udręka” lub „wielkie utrapienie”. Greckie słowo oznacza dotkliwe cierpienie, ciężkie położenie, presję lub prześladowanie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Wtedy bowiem
  rationale: Zachowuje zarówno czasowe τότε, jak i wyjaśniający związek γάρ z poprzednim kontekstem, a przy tym brzmi naturalnie po polsku.
- source_word: ἔσται
  choice: nastanie
  rationale: W połączeniu z rzeczownikiem „ucisk” czasownik ten naturalnie wyraża przyszłe zaistnienie opisywanej sytuacji.
- source_word: θλῖψις μεγάλη
  choice: wielki ucisk
  rationale: „Ucisk” obejmuje ciężkie położenie, udrękę i presję, zachowując zarazem powagę oraz eschatologiczne skojarzenia greckiego terminu; μεγάλη oddano bezpośrednio jako „wielki”.
- source_word: οἵα
  choice: jakiego
  rationale: Wprowadza jakościowe porównanie i wskazuje na bezprecedensowy charakter ucisku.
- source_word: οὐ γέγονεν
  choice: nie było
  rationale: Polski idiom przy rzeczowniku „ucisk” naturalnie oddaje perfectum γέγονεν jako stan rzeczy bez precedensu aż do chwili obecnej, bez narzucania technicznego rozróżnienia między „być” a „wydarzyć się”.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: od początku świata aż dotąd
  rationale: Wiernie i idiomatycznie zachowuje oba krańce okresu czasowego; κόσμος pozostaje „światem”, bez dopowiadania „stworzenia”.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: i nigdy już nie będzie
  rationale: Oddaje emphatyczne przyszłe zaprzeczenie οὐ μή. „Już” sygnalizuje, że taki ucisk nie powtórzy się, co wynika z porównawczej konstrukcji zdania.
theological_decisions:
- issue: Eschatologicznie nacechowane θλῖψις
  choice: wielki ucisk
  alternative: wielka udręka / wielkie utrapienie
  rationale: „Wielki ucisk” jest zrozumiały we współczesnej polszczyźnie, zachowuje ciężar terminu i jego rezonans eschatologiczny, ale nie przesądza szczegółowego schematu wydarzeń.
- issue: Zakres bezprecedensowości ucisku
  choice: jakiego nie było… i nigdy już nie będzie
  alternative: jaki się nie wydarzył… i już się nie wydarzy
  rationale: Sformułowanie zachowuje absolutną, emfatyczną formę wypowiedzi greckiej, nie ograniczając jej przez dodatkowe interpretacyjne kwalifikacje.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr biblijny. Składnia jest zwięzła, a tradycyjne „wielki ucisk” pozostaje zrozumiałe dzięki przypisowi wskazującemu szerszy zakres znaczeniowy.
