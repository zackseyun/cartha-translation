id: MAT.24.11
reference: Matthew 24:11
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: pl
  text: I powstanie[a] wielu fałszywych proroków, którzy zwiodą wielu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „zostaną wzbudzeni”.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „wprowadzą wielu w błąd”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: wielu
  rationale: Naturalny polski odpowiednik liczebnego przymiotnika, zachowujący jego niesprecyzowany zakres.
- source_word: ψευδοπροφῆται
  choice: fałszywych proroków
  rationale: Utrwalone i trafne określenie osób występujących jako prorocy, lecz będących fałszywymi lub zwodniczymi.
- source_word: ἐγερθήσονται
  choice: powstanie
  rationale: Forma „powstanie” naturalnie oddaje pojawienie się lub wystąpienie takich osób, nie sugerując zmartwychwstania; przypis zachowuje możliwość bardziej dosłownego odczytania strony biernej.
- source_word: πλανήσουσιν
  choice: zwiodą
  rationale: „Zwiodą” zwięźle obejmuje wprowadzenie w błąd i sprowadzenie z właściwej drogi, bez zawężania rodzaju zwiedzenia.
- source_word: πολλούς
  choice: wielu
  rationale: Zachowuje powtórzenie greckiego πολλοί/πολλούς oraz nie dodaje rzeczownika „ludzi”, który w polszczyźnie można naturalnie pominąć.
- source_word: καὶ ... καὶ
  choice: I ... którzy
  rationale: Pierwsze καί oddano jako „I”, natomiast drugie włączono w naturalną polską konstrukcję względną; relacja dwóch kolejnych czynności pozostaje wyraźna.
theological_decisions:
- issue: Charakter zwiedzenia opisanego przez πλανήσουσιν
  choice: Ogólne sprowadzenie wielu na błędną drogę
  alternative: Zwiedzenie przede wszystkim doktrynalne, moralne albo eschatologiczne
  rationale: Czasownik πλανάω ma szeroki zakres znaczeniowy. Przekład nie rozstrzyga, na czym dokładnie będzie polegało zwiedzenie.
- issue: Znaczenie strony biernej ἐγερθήσονται
  choice: Idiomaticzne „powstanie”, czyli pojawi się lub wystąpi
  alternative: „Zostanie wzbudzonych”, z możliwym naciskiem na zewnętrzną sprawczość
  rationale: Kontekst mówi o pojawieniu się fałszywych proroków. Tekst nie wskazuje sprawcy, dlatego przekład główny nie dopowiada, kto ich wzbudzi; alternatywę zachowano w przypisie.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Konstrukcja „powstanie wielu” jest naturalna w stylu biblijnym, a „zwiodą” zachowuje zwięzłość i szeroki sens oryginału. Wszystkie znaczniki przypisów umieszczono w tekście głównym.
