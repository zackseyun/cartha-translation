  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: pl
  text: Jak bowiem w dniach przed potopem jedli i pili, żenili się i wydawali za mąż[a], aż do dnia, kiedy Noe wszedł do arki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „żenili się i byli wydawani za mąż”. Greka rozróżnia czasowniki γαμοῦντες i γαμίζοντες; drugi może oznaczać wydawanie kogoś za mąż albo bycie wydawanym za mąż.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Jak bowiem
  rationale: „Jak” zachowuje sens porównawczy ὡς, a „bowiem” oddaje wyjaśniający związek γάρ z poprzednim zdaniem.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: jedli i pili
  rationale: Grecka konstrukcja peryfrastyczna opisuje trwające, zwyczajne czynności. Polski czas przeszły niedokonany oddaje ten aspekt naturalniej niż dosłowne odwzorowanie konstrukcji.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: w dniach przed potopem
  rationale: To jasne i naturalne określenie czasu; „potop” jest utrwalonym polskim odpowiednikiem w opowiadaniu o Noem.
- source_word: γαμοῦντες
  choice: żenili się
  rationale: Oddaje zawieranie małżeństwa i zachowuje tradycyjne rozróżnienie względem następującego γαμίζοντες.
- source_word: γαμίζοντες
  choice: wydawali za mąż[a]
  rationale: Oddaje aktywny sens powierzania kogoś w małżeństwo, nie zacierając różnicy leksykalnej między dwoma greckimi czasownikami. Przypis sygnalizuje możliwe alternatywne rozumienie.
- source_word: ἄχρι ἧς ἡμέρας
  choice: aż do dnia, kiedy
  rationale: Naturalnie wskazuje kres opisywanych czynności i zachowuje nacisk na konkretny dzień.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noe wszedł do arki
  rationale: „Wszedł” oddaje punktowe wydarzenie, a „arka” zachowuje utrwalone powiązanie z opowiadaniem z Księgi Rodzaju.
theological_decisions:
- issue: Czy wymienione czynności należy przedstawić jako grzeszne nadużycia, czy jako zwyczajne życie trwające przed nadejściem sądu
  choice: Czynności oddano neutralnie jako zwyczajne działania ludzi.
  alternative: Nadać jedzeniu, piciu i zawieraniu małżeństw ton rozwiązłości lub moralnej beztroski.
  rationale: Greckie imiesłowy nie zawierają wyraźnej oceny moralnej. Kontekst podkreśla trwanie codziennego życia aż do nagłego nadejścia sądu, dlatego przekład nie dodaje potępienia nieobecnego w samych słowach.
- issue: Zakres znaczeniowy γαμίζοντες
  choice: „wydawali za mąż”, z przypisem zachowującym możliwą alternatywę
  alternative: „byli wydawani za mąż” albo ogólne „zawierali małżeństwa”
  rationale: Forma może być rozumiana jako dawanie kogoś w małżeństwo, lecz historia użycia dopuszcza także odniesienie do bycia wydawanym za mąż. Tekst główny zachowuje rozróżnienie dwóch czasowników, a przypis nie usuwa rzeczywistej niejednoznaczności.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano składniową ciągłość z następnym wersetem przez końcowy przecinek. Sformułowania nie sugerują, że jedzenie, picie lub małżeństwo były same w sobie naganne.
