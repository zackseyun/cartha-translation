source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: pl
  text: 'Jezus odpowiedział im: „Uważajcie, żeby was ktoś nie zwiódł[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „nie wprowadził w błąd”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: odpowiedział im
  rationale: Grecka konstrukcja łączy imiesłów oznaczający odpowiedź z czasownikiem „powiedział”. Naturalne polskie „odpowiedział im” zachowuje sens reakcji na wcześniejsze pytanie, bez sztucznego powtórzenia „odpowiadając, powiedział”.
- source_word: Βλέπετε
  choice: Uważajcie
  rationale: W tym kontekście forma rozkazująca ma idiomatyczny sens zachowania czujności. „Uważajcie” jest naturalnym, współczesnym odpowiednikiem i dobrze łączy się z następującym zdaniem zapobiegawczym.
- source_word: μή τις
  choice: żeby … ktoś nie
  rationale: Po rozkazie konstrukcja μή z trybem łączącym wyraża przestrogę lub zapobieganie. Polski szyk „żeby was ktoś nie…” oddaje tę funkcję jasno i naturalnie.
- source_word: πλανήσῃ
  choice: zwiódł
  rationale: Czasownik może oznaczać spowodowanie zejścia z właściwej drogi, wprowadzenie w błąd lub oszukanie. „Zwiódł” zwięźle zachowuje zarówno aspekt błędnego ukierunkowania, jak i podstępu.
theological_decisions:
- issue: Zakres ostrzeżenia wyrażonego przez πλανήσῃ
  choice: ogólna przestroga przed zwiedzeniem
  alternative: węższa przestroga przed wprowadzeniem w błąd
  rationale: „Zwiódł” nie ogranicza wypowiedzi jedynie do intelektualnego błędu, lecz może obejmować także sprowadzenie uczniów z właściwej drogi, zachowując szeroki zakres greckiego czasownika.
translation_notes:
  register: Współczesny, godny i bezpośredni rejestr. Pominięto dosłowne „odpowiadając, powiedział”, ponieważ po polsku brzmiałoby sztucznie; sens obu greckich form zawiera „odpowiedział”. Zapis wypowiedzi i położenie odsyłacza dostosowano do polskiej interpunkcji.
