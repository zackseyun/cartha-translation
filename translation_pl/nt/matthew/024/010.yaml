  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: pl
  text: I wtedy wielu odpadnie[a], i zdradzą jedni drugich[b], i będą nienawidzić jedni drugich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „wielu się potknie”, „wielu zostanie doprowadzonych do upadku” albo „wielu się zgorszy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „wydadzą jedni drugich”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: wtedy
  rationale: Naturalny polski odpowiednik przysłówka czasowego, wskazujący kolejny etap wydarzeń opisanych w mowie Jezusa.
- source_word: σκανδαλισθήσονται
  choice: odpadnie
  rationale: W kontekście prześladowania czasownik wskazuje na poważne załamanie i odstępstwo, nie tylko chwilowe oburzenie. „Odpadnie” zachowuje tę wagę, nie dopowiadając wprost przedmiotu odstępstwa.
- source_word: πολλοὶ
  choice: wielu
  rationale: Rzeczownikowe użycie przymiotnika ilościowego; „wielu” jest zwięzłe i naturalne.
- source_word: ἀλλήλους
  choice: jedni drugich
  rationale: Wyraźnie oddaje wzajemność działań i pozwala zachować powtórzenie obecne w tekście greckim.
- source_word: παραδώσουσιν
  choice: będą zdradzać
  rationale: W kontekście wrogości i prześladowania chodzi o zdradzieckie wydawanie innych. Główne tłumaczenie oddaje sens relacyjny, a przypis zachowuje bardziej dosłowną możliwość „wydawać”.
- source_word: μισήσουσιν
  choice: nienawidzić
  rationale: Bezpośredni, współczesny odpowiednik wyrażający czynną wrogość.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: I wtedy ... i ... oraz ...
  rationale: Początkowe „I” zachowuje ciągłość wywodu, a spójniki podtrzymują narastający rytm zdania bez nadmiernie ciężkiego potrójnego powtórzenia.
theological_decisions:
- issue: Znaczenie σκανδαλισθήσονται w kontekście eschatologicznego prześladowania
  choice: wielu odpadnie
  alternative: wielu się potknie / wielu się zgorszy
  rationale: „Odpadnie” oddaje powagę załamania lojalności widoczną w następujących po nim zdradzie i nienawiści, ale nie rozstrzyga systematyczno-teologicznej kwestii natury apostazji. Przypis zachowuje szerszy zakres greckiego czasownika.
- issue: Zakres znaczeniowy παραδώσουσιν
  choice: będą zdradzać jedni drugich
  alternative: będą wydawać jedni drugich
  rationale: „Zdradzać” naturalnie wyraża interpersonalną nielojalność w tym kontekście, podczas gdy przypis zachowuje konkretniejszy sens przekazania kogoś w cudze ręce.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano początkowe połączenie z poprzednim zdaniem oraz dwukrotne „jedni drugich”, aby oddać wzajemność i narastanie wrogości.
