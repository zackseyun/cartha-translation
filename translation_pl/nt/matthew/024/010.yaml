  naturalness: Zdanie po korekcie pozostaje współczesne, jasne i godne. Prosty czas przyszły „zdradzą” jest naturalniejszy i bliższy greckiej formie niż konstrukcja „będą zdradzać”, która może niepotrzebnie sugerować czynność ciągłą lub powtarzalną.
  terminology: „Odpadnie” zachowuje powagę kontekstową bez narzucania szczegółowej doktrynalnej interpretacji. „Zdradzą” przekazuje sens zdradzieckiego wydania; przypis podaje dosłowniejszą alternatywę „wydadzą”.
