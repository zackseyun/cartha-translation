  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: pl
  text: A ponieważ rozmnoży się bezprawie[a], miłość wielu oziębnie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „z powodu wzrostu bezprawia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „miłość licznych oziębnie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: ponieważ ... się rozmnoży
  rationale: Konstrukcja διά z rodzajnikowym bezokolicznikiem wyraża przyczynę, a aorystyczny bezokolicznik bierny πληθυνθῆναι ma w tym przyszłościowym kontekście sens wzrostu lub rozpowszechnienia się. Zwrot „ponieważ ... się rozmnoży” zachowuje jego czasownikowy charakter i jest naturalny po polsku.
- source_word: ἀνομίαν
  choice: bezprawie
  rationale: ἀνομία oznacza lekceważenie lub naruszanie prawa, zwłaszcza prawa Bożego. „Bezprawie” jest bezpośrednie, zrozumiałe i precyzyjniejsze niż ogólniejsza „niegodziwość”.
- source_word: ψυγήσεται
  choice: oziębnie
  rationale: Forma ψυγήσεται metaforycznie opisuje utratę żaru uczuć. „Oziębnie” naturalnie zachowuje metaforę stygnięcia i podniosły, lecz współczesny rejestr.
- source_word: ἀγάπη
  choice: miłość
  rationale: „Miłość” jest standardowym i dokładnym odpowiednikiem ἀγάπη, bez zawężania jej tutaj do konkretnego rodzaju więzi.
- source_word: τῶν πολλῶν
  choice: wielu
  rationale: „Wielu” zachowuje szeroki, nieokreślony zakres greckiego wyrażenia i nie sugeruje statystycznej większości ani konkretnej grupy.
theological_decisions:
- issue: Zakres wyrażenia „miłość wielu”
  choice: Nie określono, czy chodzi o ludzi w ogólności, uczniów, czy grupę mieszaną.
  alternative: „miłość wierzących oziębnie” albo „miłość między ludźmi oziębnie”
  rationale: Greckie τῶν πολλῶν nie identyfikuje wyraźnie tej grupy. Ogólne „miłość wielu” zachowuje zamierzoną nieokreśloność i napięcie interpretacyjne.
translation_notes:
  register: Współczesny, godny i przystępny język. Zachowano metaforę stygnięcia miłości oraz nieokreślony zakres „wielu”; „rozmnoży się” oddaje wzrost i szerzenie się bezprawia.
