  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: pl
  text: pan[a] tego niewolnika[b] przyjdzie w dniu, którego się nie spodziewa, i o godzinie, której nie zna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „właściciel”. Greckie kyrios może znaczyć „pan” lub „właściciel”; tutaj określa ludzkiego zwierzchnika w przypowieści.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „sługi”. Greckie doulos oznacza osobę pozostającą w trwałej, nieswobodnej zależności służebnej; „niewolnik” uwydatnia istotny tutaj status społeczny.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: nadejdzie
  rationale: Czas przyszły od ἥκω oznacza przybycie. „Nadejdzie” naturalnie wyraża oczekiwany, lecz nieprzewidziany powrót pana.
- source_word: κύριος
  choice: pan
  rationale: W świecie przedstawionym przypowieści chodzi o zwierzchnika niewolnika. Polskie „pan” zachowuje relację społeczną, a zarazem nie przesądza bezpośredniego użycia tytułu Bożego.
- source_word: δούλου
  choice: niewolnika
  rationale: δοῦλος określa osobę pozostającą w zależności niewolniczej; w zestawieniu z κύριος ta relacja jest wyraźnie istotna.
- source_word: ἐκείνου
  choice: tego
  rationale: Zaimek wskazujący odsyła do konkretnego niewolnika opisanego wcześniej.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: w dniu, w którym ten się go nie spodziewa
  rationale: Sformułowanie zachowuje nieokreśloność dnia i wskazuje niewolnika jako domyślny podmiot czasownika. Zaimek „go” naturalnie odnosi oczekiwanie do przybywającego pana, zgodnie z kontekstem.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: o godzinie, której nie zna
  rationale: 'Dosłowne zestawienie dnia i godziny zachowuje paralelizm oraz prosty sens γινώσκω: „znać, wiedzieć”.'
theological_decisions:
- issue: Znaczenie κύριος w przypowieści o gospodarstwie domowym
  choice: pan
  alternative: Pan; właściciel
  rationale: Bezpośrednio chodzi o ludzkiego zwierzchnika niewolnika w obrazie przypowieści. Mała litera i kontekst nie narzucają w samym zdaniu tytułu chrystologicznego, choć przypowieść ma wymiar eschatologiczny.
- issue: Oddanie rzeczownika δοῦλος
  choice: niewolnik
  alternative: sługa
  rationale: Relacja z κύριος czyni status zależności szczególnie wyraźnym. „Niewolnik” zachowuje społeczną i retoryczną siłę greckiego określenia, podczas gdy „sługa” może ją osłabić.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zachowano paralelizm „w dniu… i o godzinie…” oraz kolejność greckiego zdania. Zaimek „ten” jasno wskazuje, że podmiotem oczekiwania i wiedzy jest niewolnik.
