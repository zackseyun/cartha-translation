  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: pl
  text: Lecz to wszystko jest początkiem bólów porodowych[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „bólów rodzenia”. Greckie słowo przywołuje bóle towarzyszące porodowi jako obraz początkowej fazy nadchodzącego ucisku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: wszystko
  rationale: W połączeniu z ταῦτα tworzy naturalne po polsku wyrażenie „to wszystko”, obejmujące wszystkie wcześniej wymienione wydarzenia.
- source_word: δὲ
  choice: Lecz
  rationale: Oddaje łagodne przeciwstawienie i przejście od wcześniejszego wyliczenia do jego oceny; podkreśla, że wymienione wydarzenia nie są jeszcze końcem.
- source_word: ταῦτα
  choice: to
  rationale: W konstrukcji „to wszystko” zaimek wskazuje na wydarzenia wymienione bezpośrednio wcześniej i brzmi naturalniej niż dosłowne „wszystkie te rzeczy”.
- source_word: ἀρχὴ
  choice: początkiem
  rationale: Orzecznik w narzędniku po „jest” naturalnie oddaje początkową fazę procesu bez dopowiadania dalszego schematu wydarzeń.
- source_word: ὠδίνων
  choice: bólów porodowych
  rationale: Grecki rzeczownik oznacza bóle związane z porodem. To sformułowanie zachowuje wyrazistą metaforę i jest jasne we współczesnej polszczyźnie.
theological_decisions:
- issue: Metaforyczny sens ὠδίνων
  choice: Zachowano metaforę porodu jako „bóle porodowe”.
  alternative: Udręki; cierpienia; bóle rodzenia.
  rationale: Tekst ukazuje wcześniejsze wstrząsy jako początek większego procesu, a nie sam jego kres. Zachowanie metafory podtrzymuje eschatologiczne napięcie oryginału bez narzucania konkretnego systemu doktrynalnego.
- issue: Relacja wymienionych wydarzeń do końca
  choice: „początkiem”
  alternative: „jednym z początków” lub dopowiedzenie, że są znakami bezpośredniego końca
  rationale: ἀρχή określa etap początkowy. Przekład nie precyzuje długości ani szczegółowego przebiegu dalszego procesu, ponieważ werset tego nie rozstrzyga.
translation_notes:
  register: Współczesny, godny i zwięzły rejestr. Szyk „to wszystko” jest idiomatyczny w języku polskim, a „bóle porodowe” zachowują konkretny obraz greckiego tekstu.
