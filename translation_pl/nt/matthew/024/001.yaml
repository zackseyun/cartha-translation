  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: pl
  text: Jezus wyszedł ze świątyni[a] i oddalał się, a jego uczniowie podeszli, aby pokazać Mu zabudowania świątyni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo ἱερόν oznacza cały zespół lub teren świątynny, a nie tylko wewnętrzne sanktuarium.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: wyszedł
  rationale: Imiesłów aorystu wyraża czynność poprzedzającą ruch opisany czasownikiem głównym; „wyszedł” zachowuje kierunkowy sens bez nadinterpretacji.
- source_word: ἱεροῦ
  choice: świątyni
  rationale: Ἱερόν oznacza cały zespół świątynny, nie tylko wewnętrzne sanktuarium; w tekście głównym naturalne polskie „świątynia” uzupełnia przypis.
- source_word: ἐπορεύετο
  choice: oddalał się
  rationale: Imperfectum wskazuje na trwający ruch od świątyni; forma niedokonana „oddalał się” naturalnie oddaje ten aspekt.
- source_word: προσῆλθον
  choice: podeszli
  rationale: Aoryst προσέρχομαι w tym kontekście oznacza zbliżenie się uczniów do Jezusa.
- source_word: ἐπιδεῖξαι
  choice: aby pokazać
  rationale: Bezokolicznik wyraża cel podejścia uczniów.
- source_word: οἰκοδομὰς
  choice: zabudowania
  rationale: Rzeczownik odnosi się do wzniesionych budowli lub struktur; „zabudowania” trafnie obejmują budynki zespołu świątynnego.
- source_word: τοῦ ἱεροῦ
  choice: świątynne
  rationale: Przymiotnikowa konstrukcja jest naturalna po polsku i wskazuje, że zabudowania należały do zespołu świątynnego.
theological_decisions:
- issue: Rozróżnienie między ἱερόν a ναός
  choice: świątynia
  alternative: teren świątynny / zespół świątynny
  rationale: Tekst używa ἱερόν, które obejmuje cały teren i kompleks świątynny, a nie wyłącznie wewnętrzne sanktuarium. Tradycyjne i czytelne „świątynia” pozostaje w tekście głównym, a zakres znaczeniowy objaśnia przypis.
translation_notes:
  register: Współczesny, godny styl narracyjny. Zachowano następstwo „wyszedł i oddalał się” oraz naturalny polski szyk zdania. Marker przypisu umieszczono po wyrażeniu odnoszącym się do całego kompleksu świątynnego.
