id: MAT.24.33
reference: Matthew 24:33
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: pl
  text: Tak samo i wy, gdy zobaczycie to wszystko, wiedzcie, że jest blisko — u drzwi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także: „on jest blisko”. W tekście greckim podmiot nie został wyrażony wprost.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Tak samo i wy
  rationale: „Tak samo” nawiązuje do poprzedzającego przykładu drzewa figowego, a „i wy” zachowuje nacisk położony na uczniów jako tych, którzy mają dostrzec odpowiadające mu znaki.
- source_word: ὅταν ἴδητε
  choice: gdy zobaczycie
  rationale: Konstrukcja ὅταν z aorystem w trybie łączącym wskazuje tu na przyszłą sytuację; polskie „gdy zobaczycie” brzmi naturalnie i nie sugeruje niepotrzebnie wielokrotności.
- source_word: πάντα ταῦτα
  choice: to wszystko
  rationale: Naturalny polski odpowiednik obejmujący ogół wcześniej wymienionych rzeczy lub wydarzeń bez dopowiadania ich charakteru.
- source_word: γινώσκετε
  choice: wiedzcie
  rationale: Zachowuje bezpośrednią, rozkazującą siłę greckiej formy, nie zawężając jej do samego rozpoznania lub zrozumienia.
- source_word: ἐγγύς ἐστιν
  choice: jest blisko
  rationale: Polszczyzna pozwala pozostawić podmiot niewyrażony, dzięki czemu przekład zachowuje obecną w grece niejednoznaczność co do tego, kto lub co jest blisko.
- source_word: ἐπὶ θύραις
  choice: u drzwi
  rationale: Zwięzły i utrwalony polski zwrot oddający obraz kogoś lub czegoś znajdującego się bezpośrednio przy wejściu; forma „drzwi” odpowiada także greckiej liczbie mnogiej.
theological_decisions:
- issue: Niewyrażony podmiot ἐγγύς ἐστιν
  choice: 'Pozostawić podmiot niewyrażony: „jest blisko”'
  alternative: „on jest blisko”
  rationale: Tekst grecki nie wskazuje podmiotu wprost. Może chodzić o Syna Człowieczego, nadchodzące wydarzenie, sąd, królestwo lub dopełnienie. Polska konstrukcja bez jawnego podmiotu naturalnie zachowuje tę otwartość zamiast rozstrzygać ją teologicznie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Szyk jest naturalny dla polszczyzny, a pauza przed „u drzwi” wzmacnia końcowy obraz skrajnej bliskości bez dodawania treści nieobecnej w źródle.
