id: MAT.24.5
reference: Matthew 24:5
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: pl
  text: 'Wielu bowiem przyjdzie w moim imieniu, mówiąc: „Ja jestem Mesjaszem”[a], i wielu zwiodą.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Ja jestem Chrystusem”. Grecki tytuł ὁ χριστός znaczy „Pomazaniec”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: πολλοὶ
  choice: Wielu
  rationale: Naturalny Polish equivalent of the quantitative adjective; it retains the indefinite plural reference.
- source_word: γὰρ
  choice: bowiem
  rationale: Preserves the explanatory link with the preceding warning and reads naturally in dignified modern Polish.
- source_word: ἐλεύσονται
  choice: przyjdzie
  rationale: The singular verb agrees with the Polish quantifier construction „wielu … przyjdzie” and accurately renders the future of ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: w moim imieniu
  rationale: The established Polish idiom retains the phrase's possible appeal to Jesus' name, identity, or authority without narrowing it.
- source_word: λέγοντες
  choice: mówiąc
  rationale: A direct participial rendering introduces the content of the claim without adding the interpretive sense „podając się”.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Ja jestem Mesjaszem
  rationale: In this context χριστός functions as the messianic title claimed by impostors; „Mesjasz” communicates that titular force naturally in Polish.
- source_word: πλανήσουσιν
  choice: zwiodą
  rationale: „Zwiodą” naturally conveys causing others to be deceived or led off the right way, preserving the semantic force of πλανάω.
- source_word: πολλοὺς
  choice: wielu
  rationale: Concise and idiomatic Polish rendering of the substantival masculine plural object.
theological_decisions:
- issue: Oddanie tytułu ὁ χριστός w wypowiedzi fałszywych pretendentów
  choice: Mesjasz
  alternative: Chrystus
  rationale: Rodzajnik oraz kontekst wskazują na tytuł mesjański, a nie imię własne. „Mesjasz” jasno wyraża treść roszczenia, natomiast przypis zachowuje tradycyjny grecko-łaciński odpowiednik „Chrystus”.
translation_notes:
  register: Współczesny, standardowy i godny polski. Zachowano wyjaśniające „bowiem”, powtórzenie „wielu” oraz zwięzłość tekstu greckiego. Szyk „i wielu zwiodą” lekko podkreśla skalę zwiedzenia, pozostając naturalny w stylu biblijnym.
source_grounding:
  english_pob_role: consult_only
