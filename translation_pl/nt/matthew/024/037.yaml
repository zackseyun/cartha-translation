  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: pl
  text: Bo jak było za dni Noego, tak będzie z przyjściem Syna Człowieczego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „obecnością”. Greckie słowo może oznaczać „obecność” albo „przybycie”, tutaj jednak odnosi się do przyszłego przyjścia Syna Człowieczego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: jak
  rationale: Wraz z οὕτως tworzy naturalną polską konstrukcję porównawczą „jak… tak…”, zachowującą wyraźną odpowiedniość obu członów.
- source_word: γὰρ
  choice: Bo
  rationale: Zachowuje objaśniające powiązanie z poprzednim kontekstem i brzmi naturalnie na początku polskiego zdania.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: było za dni Noego
  rationale: Grecki pierwszy człon porównania jest eliptyczny. Konstrukcja „jak było za dni Noego” naturalnie uzupełnia domyślny predykat, nie precyzując ponad tekst, co dokładnie było wówczas charakterystyczne.
- source_word: Νῶε
  choice: Noego
  rationale: Zastosowano utrwaloną w polszczyźnie biblijnej formę imienia Noe w wymaganym przez składnię dopełniaczu.
- source_word: οὕτως
  choice: tak
  rationale: Odpowiada polskiej konstrukcji korelatywnej „jak… tak…” i wiernie sygnalizuje analogię.
- source_word: ἔσται
  choice: będzie
  rationale: Prosty czas przyszły czasownika εἰμί oddano bez interpretacyjnego rozszerzenia.
- source_word: παρουσία
  choice: przyjście
  rationale: W tym kontekście eschatologicznym słowo oznacza przyszłe przybycie lub ukazanie się Syna Człowieczego. „Przyjście” jest jasnym i utrwalonym polskim odpowiednikiem; szerszy zakres znaczeniowy zaznaczono w przypisie.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Syna Człowieczego
  rationale: Zachowuje utrwalony tytuł Jezusa oraz jego biblijne i teologiczne odniesienia.
theological_decisions:
- issue: Znaczenie παρουσία w wypowiedzi eschatologicznej
  choice: przyjście
  alternative: obecność; przybycie
  rationale: Kontekst wskazuje na przyszłe eschatologiczne przybycie Syna Człowieczego, dlatego „przyjście” najlepiej przekazuje sens wydarzeniowy. Przypis zachowuje przejrzystość wobec możliwego znaczenia „obecność”.
translation_notes:
  register: Współczesna, godna polszczyzna o naturalnym szyku. Konstrukcja „jak było za dni Noego, tak będzie z…” zachowuje eliptyczny charakter greckiego porównania, a zarazem jest zrozumiała dla zwykłego czytelnika. Wielkie litery w tytule „Syn Człowieczy” odpowiadają utrwalonej polskiej praktyce biblijnej.
