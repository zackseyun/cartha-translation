  source_fidelity: Greckie οὐκ ἔγνωσαν oznacza przede wszystkim „nie wiedzieli / nie zdawali sobie sprawy”, a niekoniecznie potoczne „nie zorientowali się”. „Potop” trafnie oddaje κατακλυσμός. „Zmiótł ich wszystkich” dobrze odpowiada ἦρεν ἅπαντας w kontekście niszczycielskiego potopu oraz angielskiemu „swept them all away”, bez wprowadzania dodatkowej interpretacji eschatologicznej. Konstrukcja „Tak też będzie z przyjściem Syna Człowieczego” zachowuje porównawcze οὕτως ... καὶ.
