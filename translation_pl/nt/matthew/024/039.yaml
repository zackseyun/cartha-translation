  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: pl
  text: I nie zdawali sobie sprawy, aż nadszedł potop i zmiótł ich wszystkich. Tak też będzie z przyjściem Syna Człowieczego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: nie zorientowali się
  rationale: W tym kontekście wyrażenie wskazuje nie tyle na brak samej wiedzy, ile na nierozpoznanie nadchodzącego sądu; współczesne polskie sformułowanie brzmi naturalnie i zachowuje ten sens.
- source_word: κατακλυσμός
  choice: potop
  rationale: Utrwalony i jednoznaczny polski odpowiednik w odniesieniu do potopu z czasów Noego.
- source_word: ἦρεν ἅπαντας
  choice: porwał wszystkich
  rationale: Czasownik αἴρω może znaczyć „zabrać” lub „usunąć”; „porwał” naturalnie opisuje niszczycielskie działanie wód, nie rozstrzygając ponad tekst losu poszczególnych ludzi.
- source_word: οὕτως ... καὶ
  choice: tak samo
  rationale: Oddaje porównawczą konstrukcję „tak również” zwięźle i idiomatycznie.
- source_word: παρουσία
  choice: przyjście
  rationale: W kontekście eschatologicznym oznacza nadejście lub obecność; „przyjście” jest naturalnym i utrwalonym odpowiednikiem, bez dodawania szczegółów niewyrażonych w wersecie.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski tytuł chrystologiczny, zachowujący formę greckiego wyrażenia.
theological_decisions:
- issue: Znaczenie ἦρεν w obrazie potopu
  choice: porwał wszystkich
  alternative: zabrał wszystkich / zmiótł wszystkich
  rationale: „Porwał” zachowuje gwałtowność działania potopu i nie sugeruje pozytywnego „zabrania”, które w dyskusjach eschatologicznych mogłoby zostać odczytane doktrynalnie.
- issue: Charakter analogii do przyjścia Syna Człowieczego
  choice: Tak samo będzie z przyjściem Syna Człowieczego
  alternative: Takie też będzie przyjście Syna Człowieczego
  rationale: Sformułowanie zachowuje zakres porównania bez dopowiadania, czy nacisk spoczywa na nagłości, nieświadomości ludzi, sądzie, czy na wszystkich tych elementach łącznie.
translation_notes:
  register: Współczesny, godny i komunikatywny rejestr. Zdanie zachowuje nagłość obrazu oraz otwartość zakresu porównania, unikając archaicznego „nie poznali” i doktrynalnie obciążonego „zabrał”.
