  text: then those in Judea must flee to the mountains,[a]
translation:
  language: pl
  text: Wtedy ci, którzy są w Judei, niech uciekają w góry.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: wtedy
  rationale: Naturalny polski przysłówek czasowy zachowujący następstwo wydarzeń w wypowiedzi Jezusa.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ci, którzy będą w Judei
  rationale: Grecka konstrukcja rzeczownikowa oznacza osoby znajdujące się w Judei. Czas przyszły brzmi naturalnie w polskim kontekście zapowiedzi, nie zmieniając odniesienia wyrażenia.
- source_word: Ἰουδαίᾳ
  choice: Judei
  rationale: Utrwalona polska forma nazwy geograficznej w miejscowniku wymaganym przez przyimek „w”.
- source_word: φευγέτωσαν
  choice: niech uciekają
  rationale: Trzecia osoba liczby mnogiej trybu rozkazującego jest najwierniej i naturalnie oddana polską konstrukcją „niech” z czasownikiem; forma czasu teraźniejszego może wyrażać rozpoczęcie i kontynuowanie pilnej ucieczki.
- source_word: ἐπὶ τὰ ὄρη
  choice: w góry
  rationale: Przy czasowniku ruchu ἐπί z biernikiem wskazuje kierunek. Polskie „uciekać w góry” jest idiomatyczne i zachowuje góry jako cel ucieczki.
theological_decisions:
- issue: Siła trybu rozkazującego w ostrzeżeniu eschatologicznym
  choice: 'Bezpośrednie polecenie: „niech uciekają”'
  alternative: „muszą uciekać”
  rationale: Konstrukcja „niech uciekają” formalnie zachowuje grecki tryb rozkazujący w trzeciej osobie, a zarazem brzmi naturalnie i pilnie, bez przekształcania polecenia w stwierdzenie konieczności ani narzucania interpretacji eschatologicznej.
translation_notes:
  register: Współczesny, prosty i godny rejestr. Szyk zdania jest naturalny po polsku, a przekład zachowuje zwięzłość oraz pilność oryginału.
