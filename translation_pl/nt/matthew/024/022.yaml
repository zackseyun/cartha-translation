  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: pl
  text: A gdyby te dni nie zostały skrócone[a], nie ocalałoby żadne ciało[b]; lecz ze względu na wybranych te dni zostaną skrócone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też oddać: „nie zostały ucięte … zostaną ucięte”. Grecki czasownik oznacza skrócenie lub ucięcie.'
    reason: lexical_alternative
  - marker: b
    text: „Żadne ciało” to biblijny idiom oznaczający żadnego człowieka, nikogo żywego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: nie zostały skrócone / zostaną skrócone
  rationale: Czasownik κολοβόω oznacza skrócenie lub ucięcie. W odniesieniu do dni naturalny polski zwrot „skrócić dni” jasno oddaje zmniejszenie ich liczby lub czasu trwania, nie rozstrzygając dokładnego sposobu.
- source_word: οὐκ ἂν ἐσώθη
  choice: nie zostałoby ocalone
  rationale: Konstrukcja wyraża nierealny skutek w przeszłości. „Zostałoby ocalone” zachowuje stronę bierną i szeroki zakres σῴζω, a kontekst wskazuje przede wszystkim na zachowanie przy życiu.
- source_word: πᾶσα σάρξ
  choice: żadne ciało
  rationale: Przy przeczeniu greckie „wszelkie ciało” znaczy „żadne ciało”. Zachowanie biblijnego idiomu oddaje obrazowość tekstu; przypis wyjaśnia, że chodzi o żadnego człowieka pozostającego przy życiu.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ze względu jednak na wybranych
  rationale: διά z biernikiem wskazuje tu na wzgląd, przyczynę lub korzyść. „Ze względu na” pozostawia ten zakres otwarty, a „wybrani” jest precyzyjnym i zrozumiałym odpowiednikiem ἐκλεκτοί bez dopowiadania tożsamości tej grupy.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: te dni / dni te
  rationale: Polskie „te dni” naturalnie zachowuje wskazujący charakter greckiego wyrażenia; szyk „dni te” w drugim zdaniu podtrzymuje spójność i uroczysty rejestr.
- source_word: καὶ εἰ μὴ
  choice: I gdyby ... nie
  rationale: Forma „gdyby ... nie” naturalnie oddaje warunek przeciwny rzeczywistości, sygnalizowany również przez formę czasownika i partykułę ἄν w zdaniu wynikowym.
theological_decisions:
- issue: Tożsamość „wybranych” w mowie eschatologicznej
  choice: Zachować określenie „wybrani” bez objaśniającego rozszerzenia.
  alternative: lud wybrany przez Boga; wierzący; wierna reszta
  rationale: Werset nazywa tę grupę wybranymi, ale nie określa tutaj wyczerpująco, kim są. Niedopowiedzenie chroni autentyczną otwartość tekstu i nie narzuca systemu wyznaniowego.
- issue: Znaczenie σῴζω w kontekście ucisku
  choice: Przełożyć jako „zostałoby ocalone”, pozostawiając kontekstowi wskazanie na fizyczne zachowanie życia.
  alternative: przeżyłby; pozostałby przy życiu
  rationale: Kontekst mocno wskazuje na przetrwanie katastrofalnego okresu, lecz „ocalone” zachowuje szerszy zakres greckiego czasownika i nie zawęża go w samym przekładzie.
translation_notes:
  register: Współczesny, godny polski o umiarkowanie formalnym brzmieniu. Zachowano biblijny idiom „żadne ciało”, objaśniając go w przypisie, oraz termin „wybrani” bez interpretacyjnego dopowiedzenia.
