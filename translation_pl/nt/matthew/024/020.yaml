  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: pl
  text: Módlcie się jednak, żeby wasza ucieczka nie wypadła zimą ani w szabat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύχεσθε
  choice: Módlcie się
  rationale: Tryb rozkazujący czasu teraźniejszego w drugiej osobie liczby mnogiej. Naturalny polski imperatyw zachowuje wezwanie skierowane do wielu osób; ewentualna ciągłość czynności pozostaje domyślna.
- source_word: δὲ
  choice: jednak
  rationale: Partykuła sygnalizuje łagodny kontrast lub przejście względem poprzedniego ostrzeżenia. „Jednak” brzmi naturalnie i nie wzmacnia nadmiernie przeciwstawienia.
- source_word: ἵνα μὴ γένηται
  choice: żeby ... nie wypadła
  rationale: Po czasowniku modlitwy konstrukcja ἵνα z przeczeniem wyraża treść modlitwy. Polski zwrot „żeby nie wypadła” idiomatycznie odnosi termin wydarzenia do niepożądanej pory.
- source_word: ἡ φυγὴ ὑμῶν
  choice: wasza ucieczka
  rationale: φυγή oznacza ucieczkę lub uchodzenie. „Wasza ucieczka” jest zwięzłe i nie przesądza, czy zakończy się ona powodzeniem.
- source_word: χειμῶνος
  choice: zimą
  rationale: Dopełniacz czasu lub pory roku naturalnie oddaje polski narzędnik „zimą”.
- source_word: μηδὲ σαββάτῳ
  choice: ani w szabat
  rationale: μηδέ dołącza drugi wykluczany termin. Dativus σαββάτῳ wskazuje na dzień szabatu; po polsku naturalną konstrukcją jest „w szabat”. Brak rodzajnika w grece nie daje się odwzorować polskim rodzajnikiem, ponieważ polszczyzna go nie posiada.
theological_decisions:
- issue: Określoność σαββάτῳ
  choice: w szabat
  alternative: w dzień szabatu
  rationale: Grecki rzeczownik występuje bez rodzajnika, lecz polszczyzna nie koduje określoności za pomocą rodzajnika. „W szabat” zachowuje zwięzłość i żydowski kontekst dnia odpoczynku, nie rozstrzygając ponad tekst, czy chodzi o dowolny szabat, czy o szabat rozumiany jako ustanowiony dzień.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Nie wypadła” jest naturalnym polskim określeniem terminu zdarzenia, a „w szabat” zachowuje biblijny termin bez denominacyjnego dopowiedzenia.
