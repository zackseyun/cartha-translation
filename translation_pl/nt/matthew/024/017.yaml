lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Kto będzie na dachu
  rationale: Grecki zwrot z rodzajnikiem pełni funkcję rzeczownikową i oznacza osobę znajdującą się na dachu. Konstrukcja „kto będzie” jest naturalna w polskim kontekście zapowiedzi i zachowuje reprezentatywny, jednostkowy charakter wypowiedzi bez niepotrzebnego określania płci.
- source_word: δώματος
  choice: dachu
  rationale: δῶμα oznacza górną część domu, w ówczesnych realiach zwykle płaski, użytkowy dach. Polskie „dach” jest jasne i konkretne; przypis objaśnia różnicę kulturowo-architektoniczną.
- source_word: μὴ καταβάτω
  choice: niech nie schodzi
  rationale: Forma rozkazująca wyraża pilny zakaz. „Niech nie schodzi” naturalnie oddaje zarówno dyrektywę, jak i ruch z dachu w dół.
- source_word: ἆραι
  choice: żeby zabrać
  rationale: Bezokolicznik wskazuje cel zejścia. „Żeby zabrać” jasno oddaje zamiar wzięcia rzeczy z domu.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: rzeczy ze swego domu
  rationale: Grecka konstrukcja jest eliptyczna i odnosi się do przedmiotów znajdujących się w domu. „Rzeczy ze swego domu” pozostaje blisko tekstu, a zaimek zwrotny naturalnie wiąże dom z podmiotem zdania.
theological_decisions:
- issue: Reprezentatywne odniesienie w liczbie pojedynczej
  choice: Zachować jednostkową konstrukcję „kto… swego”
  alternative: Użyć liczby mnogiej albo formy „ich”
  rationale: Tekst grecki przedstawia pojedynczą, reprezentatywną osobę. Polska konstrukcja nie narzuca płci, ale zachowuje liczbę pojedynczą i ścisłe odniesienie zaimka do tej osoby; nie zmienia to sensu teologicznego.
translation_notes:
  register: Współczesny, zrozumiały i godny styl. Zdanie zachowuje pilność nakazu oraz konkretny obraz zejścia z użytkowego dachu do wnętrza domu.
