translation:
  language: pl
  text: Kto jest na dachu[a], niech nie schodzi, aby zabrać rzeczy ze swego domu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chodzi o płaski, użytkowy dach domu, typowy dla ówczesnej architektury.
