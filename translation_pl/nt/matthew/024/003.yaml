id: MAT.24.3
reference: Matthew 24:3
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: pl
  text: 'Gdy siedział na Górze Oliwnej, uczniowie podeszli do Niego na osobności i zapytali: „Powiedz nam, kiedy to nastąpi i jaki będzie znak Twojego przyjścia[a] oraz końca wieku[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „Twojej obecności” albo „Twojego przybycia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „dopełnienia wieku”; tradycyjnie: „końca świata”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Gdy siedział
  rationale: Konstrukcja genetivus absolutus wyraża okoliczność czasową; polskie „gdy siedział” naturalnie zachowuje jej sens i aspekt trwający.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: na Górze Oliwnej
  rationale: To utrwalona i naturalna polska nazwa geograficzna odpowiadająca greckiemu określeniu.
- source_word: προσῆλθον αὐτῷ
  choice: podeszli do Niego
  rationale: Oddaje ruch uczniów ku Jezusowi i brzmi naturalnie w polskiej narracji.
- source_word: κατ’ ἰδίαν
  choice: na osobności
  rationale: Grecki idiom oznacza rozmowę z dala od innych; „na osobności” jest jasne i zachowuje podniosły, lecz współczesny rejestr.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: 'i zapytali: „Powiedz nam”'
  rationale: Imiesłów „mówiąc” wprowadza tu treść pytania. Przekład „zapytali” naturalnie oddaje funkcję wypowiedzi, a „Powiedz nam” zachowuje imperatyw.
- source_word: πότε ταῦτα ἔσται
  choice: kiedy to nastąpi
  rationale: Idiomaticzne polskie sformułowanie zachowuje przyszłe odniesienie oraz nawiązanie do wcześniej zapowiedzianych wydarzeń.
- source_word: σημεῖον
  choice: znak
  rationale: „Znak” jest podstawowym i kontekstowo trafnym odpowiednikiem w mowie eschatologicznej.
- source_word: παρουσίας
  choice: przyjścia
  rationale: W pytaniu dotyczącym przyszłości „przyjście” jasno oddaje eschatologiczny sens terminu, nie wykluczając jego leksykalnych odcieni „obecności” i „przybycia”.
- source_word: συντελείας
  choice: końca
  rationale: „Koniec” jest naturalnym odpowiednikiem, choć grecki rzeczownik może również podkreślać dopełnienie lub zwieńczenie procesu.
- source_word: τοῦ αἰῶνος
  choice: tego wieku
  rationale: αἰών oznacza tutaj wiek lub epokę, nie zaś jednoznacznie fizyczny świat; zaimek „tego” naturalnie wskazuje na obecny wiek.
theological_decisions:
- issue: Znaczenie παρουσία w kontekście eschatologicznym
  choice: przyjścia
  alternative: obecności; przybycia
  rationale: „Przyjście” najlepiej odpowiada przyszłościowemu charakterowi pytania uczniów, ale przypis zachowuje szerszy zakres greckiego terminu i nie rozstrzyga ponad tekst natury ani przebiegu tego wydarzenia.
- issue: Znaczenie συντελείας τοῦ αἰῶνος
  choice: końca tego wieku
  alternative: dopełnienia tego wieku; końca świata
  rationale: Przekład podstawowy zachowuje odniesienie do wieku lub epoki i nie utożsamia go automatycznie z unicestwieniem fizycznego świata. „Dopełnienie” ujawnia możliwy odcień zwieńczenia, a tradycyjne „koniec świata” podano jedynie jako wariant translatorski.
translation_notes:
  register: Współczesny, godny i komunikatywny polski. Szyk jest naturalny, bez niepotrzebnych kalk z greki. Wielkie litery w zaimkach odnoszących się do Jezusa zachowują utrwaloną polską konwencję religijną; nie wpływają na interpretację treści.
