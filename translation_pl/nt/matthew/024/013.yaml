  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: pl
  text: Lecz kto wytrwa do końca, ten będzie zbawiony[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „aż do końca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „zostanie ocalony”. Grecki czasownik może oznaczać zarówno zbawienie, jak i ocalenie lub wybawienie; szersze sformułowanie zachowano w tekście głównym, ponieważ kontekst nie wymaga zawężenia znaczenia.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lecz
  rationale: Spójnik zaznacza łagodny kontrast wobec wcześniejszych ostrzeżeń. „Lecz” oddaje go jasno i w sposób godny, bez nadmiernego wzmacniania.
- source_word: ὁ ... ὑπομείνας
  choice: kto wytrwa
  rationale: Rodzajnik z imiesłowem aorystu pełni funkcję rzeczownikową i wskazuje na osobę, która wytrwa. Polska konstrukcja „kto wytrwa” jest naturalna, zachowuje reprezentatywną liczbę pojedynczą i nie narzuca płci.
- source_word: ὑπομείνας (ὑπομένω)
  choice: wytrwa
  rationale: Czasownik oznacza trwanie mimo próby, znoszenie przeciwności lub pozostawanie niezachwianym. „Wytrwa” jest zwięzłe, naturalne i dobrze oddaje aspekt doprowadzenia wytrwałości do wskazanego kresu.
- source_word: εἰς τέλος
  choice: do końca
  rationale: Wyrażenie wskazuje na trwanie aż po punkt końcowy. „Do końca” jest najprostszym i najbardziej idiomatycznym polskim odpowiednikiem; wariant „aż do końca” podano w przypisie.
- source_word: οὗτος
  choice: ten
  rationale: Zaimek ma charakter emfatyczny i podejmuje wcześniejszą konstrukcję imiesłowową. Korelacja „kto…, ten…” naturalnie zachowuje ten nacisk w języku polskim.
- source_word: σωθήσεται (σῴζω)
  choice: będzie zbawiony
  rationale: Forma przyszła bierna może oznaczać zarówno zbawienie, jak i ocalenie lub wybawienie. „Będzie zbawiony” zachowuje szeroki, eschatologiczny sens, a alternatywę „zostanie ocalony” odnotowano w przypisie.
theological_decisions:
- issue: Zakres znaczeniowy σωθήσεται w kontekście eschatologicznym i wezwania do wytrwałości
  choice: będzie zbawiony
  alternative: zostanie ocalony
  rationale: Tekst nie rozstrzyga wprost, czy chodzi wyłącznie o ostateczne zbawienie, o ocalenie w czasie ucisku, czy o oba aspekty. Przekład zachowuje tę napiętą wieloznaczność i nie dopowiada określonej doktryny wytrwania.
translation_notes:
  register: Współczesny, standardowy język polski o prostym i godnym brzmieniu. Konstrukcja „kto…, ten…” jest naturalna i zarazem zachowuje emfatyczne οὗτος. Nie użyto form nacechowanych denominacyjnie ani nie doprecyzowano natury obiecanego zbawienia.
