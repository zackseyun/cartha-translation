  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: pl
  text: i zacznie bić swoich współsług[a], a będzie jadł i pił z tymi, którzy się upijają[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dosłownie: „swoich współniewolników”, czyli tych, którzy wraz z nim podlegają temu samemu panu.'
    reason: alternative_reading
  - marker: b
    text: 'Możliwe też: „z pijakami”. Greckie określenie odnosi się do ludzi oddających się pijaństwu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: zacznie bić
  rationale: Konstrukcja ἄρξηται z bezokolicznikiem wyraża początek działania, a τύπτειν w tym kontekście wskazuje na fizyczne znęcanie się, nie tylko pojedyncze uderzenie.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: swoich współsług
  rationale: σύνδουλος oznacza osobę służącą temu samemu panu. „Współsłudzy” brzmi naturalniej po polsku niż „współniewolnicy”, a przypis zachowuje dosłowny obraz wspólnego statusu pod jednym panem.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: a będzie jadł i pił
  rationale: Czasowniki w czasie teraźniejszym trybu łączącego przedstawiają dalsze lub charakterystyczne postępowanie; polski czas przyszły niedokonany naturalnie oddaje ten sens w zależnej konstrukcji warunkowej.
- source_word: μετὰ τῶν μεθυόντων
  choice: z tymi, którzy się upijają
  rationale: Imiesłów czasu teraźniejszego określa osoby oddające się pijaństwu. Opisowa forma zachowuje aspekt czynnościowy i unika etykietującego rzeczownika „pijacy”.
- source_word: δὲ
  choice: a
  rationale: δέ ma tu łagodnie łączącą funkcję; „a” naturalnie dołącza kolejny przejaw niewierności bez narzucania silnego przeciwstawienia.
theological_decisions:
- issue: Oddanie terminu z rodziny δοῦλος w συνδούλους
  choice: współsług
  alternative: współniewolników
  rationale: Kontekst podkreśla wspólne podporządkowanie jednemu panu, lecz w polskiej przypowieści „współsłudzy” jest czytelne i godne stylistycznie. Przypis sygnalizuje dosłowny status niewolników, aby nie zatrzeć społecznego obrazu tekstu.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr narracji przypowieściowej. Zachowano ciągłość zdania z poprzednim i następnym wersetem oraz końcowy przecinek.
