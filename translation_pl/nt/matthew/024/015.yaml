id: MAT.24.15
reference: Matthew 24:15
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: pl
  text: Kiedy więc zobaczycie „ohydę spustoszenia”[b], o której mówił prorok Daniel, stojącą w miejscu świętym[a] — kto czyta, niech rozumie —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w Miejscu Świętym”, jeśli wyrażenie rozumieć jako szczególne odniesienie do świątyni.'
    reason: alternative_reading
  - marker: b
    text: 'Wyrażenie „ohyda spustoszenia” można też oddać: „pustosząca ohyda” lub „ohyda powodująca spustoszenie”; nawiązuje ono do Księgi Daniela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Kiedy więc
  rationale: Oddaje przyszłą okoliczność wprowadzoną przez ὅταν z trybem łączącym oraz zachowuje wynikające z kontekstu przejście οὖν.
- source_word: ἴδητε
  choice: zobaczycie
  rationale: Naturalny polski odpowiednik aorystu trybu łączącego ὁράω w zdaniu odnoszącym się do przyszłości.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ohydę spustoszenia
  rationale: Formalnie zachowuje grecką konstrukcję dopełniaczową i rozpoznawalne nawiązanie do Księgi Daniela, nie rozstrzygając, czy spustoszenie jest skutkiem, cechą czy sferą tej ohydy.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: zapowiedzianą przez proroka Daniela
  rationale: W kontekście wypowiedzi prorockiej „zapowiedzianą” naturalnie oddaje τὸ ῥηθέν, a „przez” zachowuje pośrednictwo wyrażone przez διά z dopełniaczem.
- source_word: ἑστὸς
  choice: stojącą
  rationale: Bezpośrednio oddaje imiesłów od ἵστημι i zachowuje jego zgodność z polskim rzeczownikiem „ohyda”, bez interpretacyjnego dodatku „ustawioną”.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: w miejscu świętym
  rationale: Polszczyzna nie używa rodzajników, dlatego sformułowanie naturalnie zachowuje możliwą zarówno niesprecyzowaną, jak i kontekstowo określoną referencję greckiego wyrażenia bez rodzajnika.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: kto czyta, niech rozumie
  rationale: Zwięźle zachowuje ogólny podmiot imiesłowowy i imperatywną siłę νοείτω.
theological_decisions:
- issue: Określoność τόπῳ ἁγίῳ i możliwe odniesienie do świątyni
  choice: w miejscu świętym
  alternative: w Miejscu Świętym
  rationale: Greka nie ma tu rodzajnika, a polskie „w miejscu świętym” nie wymusza ani nie wyklucza kontekstowej określoności. Nie zastosowano wielkich liter, które zawężałyby sens do technicznej nazwy części świątyni.
- issue: Znaczenie Danielowego wyrażenia βδέλυγμα τῆς ἐρημώσεως
  choice: ohyda spustoszenia
  alternative: ohyda powodująca spustoszenie; pustosząca ohyda
  rationale: Formalna konstrukcja zachowuje intertekstualne echo Daniela oraz autentyczną niejednoznaczność relacji dopełniaczowej, zamiast przesądzać, że ohyda powoduje spustoszenie.
- issue: Charakter wypowiedzi przekazanej przez Daniela
  choice: zapowiedzianą przez proroka Daniela
  alternative: o której powiedziano przez proroka Daniela
  rationale: „Zapowiedzianą” jest naturalne w kontekście proroctwa i nie rozstrzyga, kto jest ostatecznym mówiącym; konstrukcja „przez proroka Daniela” zachowuje ideę pośrednictwa.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Cudzysłów sygnalizuje utrwalone Danielowe określenie. Zachowano parentetyczny charakter wezwania skierowanego do czytającego oraz formalną niejednoznaczność dwóch kluczowych wyrażeń.
