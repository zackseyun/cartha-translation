revisions:
- from: Kiedy więc zobaczycie „ohydę spustoszenia”, zapowiedzianą przez proroka Daniela, stojącą w miejscu świętym[a] — kto czyta, niech rozumie —[b]
  to: Kiedy więc zobaczycie „ohydę spustoszenia”[b], o której mówił prorok Daniel, stojącą w miejscu świętym[a] — kto czyta, niech rozumie —
  rationale: Zmieniono „zapowiedzianą” na niezwężające „o której mówił”, aby wierniej oddać τὸ ῥηθέν w kontekście odwołania do Daniela. Odsyłacz dotyczący Danielowego wyrażenia przeniesiono do samego wyrażenia. Nie zmieniono znaczenia pozostałej części wersetu ani nie rozstrzygano referencji „miejsca świętego”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:17:23Z'
review_pass:
  verdict: revise
  source_fidelity: Zwrot „zapowiedzianą przez proroka Daniela” zawęża τὸ ῥηθὲν („to, co zostało powiedziane”) do zapowiedzi. W tym miejscu greka odsyła do tego, o czym wypowiedziano się przez Daniela, bez konieczności takiego doprecyzowania. „O której mówił prorok Daniel” oddaje sens naturalnie i bez tego zawężenia. Pozostałe elementy, w tym „stojącą w miejscu świętym” oraz wezwanie do czytającego, są zgodne ze źródłem.
  naturalness: Rewizja zachowuje współczesny, godny i płynny styl. „Kto czyta, niech rozumie” jest naturalnym, zwięzłym odpowiednikiem ὁ ἀναγινώσκων νοείτω. Przeniesienie odsyłacza b bezpośrednio po wyrażeniu, którego dotyczy, poprawia czytelność przypisu.
  terminology: „Ohyda spustoszenia” trafnie zachowuje utrwalone Danielowe sformułowanie i nie rozstrzyga funkcji dopełniacza. „Miejsce święte” nie narzuca technicznego, świątynnego znaczenia „Miejsca Świętego”; wariant pozostaje w przypisie.
  issues:
  - severity: medium
    issue: „Zapowiedzianą przez proroka Daniela”
    rationale: „Zapowiedzianą” interpretuje τὸ ῥηθὲν jako zapowiedź. Imiesłów ῥηθέν oznacza szerzej „powiedziane”; tłumaczenie powinno nie dodawać tej kwalifikacji.
  - severity: low
    issue: Odsyłacz b umieszczony na końcu wersetu
    rationale: Przypis b wyjaśnia wyłącznie wyrażenie „ohyda spustoszenia”, dlatego powinien być zakotwiczony bezpośrednio przy tym wyrażeniu, a nie po parentetycznym wezwaniu do czytającego.
