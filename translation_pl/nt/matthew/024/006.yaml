  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: pl
  text: Będziecie zaś słyszeć o wojnach i o doniesieniach o wojnach[a]. Uważajcie, abyście się nie trwożyli. Musi się to bowiem wydarzyć, ale to jeszcze nie koniec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pogłoski o wojnach”. Greckie wyrażenie może oznaczać doniesienia, wiadomości albo pogłoski.'
    reason: Alternatywa leksykalna zachowuje tradycyjne tłumaczenie, jednocześnie wyjaśniając szerszy zakres znaczeniowy greckiego ἀκοή.
lexical_decisions:
- source_word: μελλήσετε
  choice: będziecie
  rationale: Konstrukcja μέλλω z bezokolicznikiem wskazuje na oczekiwaną przyszłość. Polski czas przyszły „będziecie słyszeć” oddaje ten sens naturalnie, bez nadmiernego akcentowania bezpośredniej bliskości wydarzeń.
- source_word: ἀκούειν
  choice: słyszeć o
  rationale: W odniesieniu do wojen chodzi o otrzymywanie wiadomości, nie o bezpośrednie doznanie słuchowe; polskie „słyszeć o” jest w tym kontekście idiomatyczne.
- source_word: πολέμους
  choice: wojnach
  rationale: πόλεμος oznacza zasadniczo wojnę, a nie pojedynczą bitwę czy ogólnie rozumiany konflikt.
- source_word: ἀκοὰς πολέμων
  choice: doniesienia o wojnach
  rationale: ἀκοή może oznaczać zasłyszaną wiadomość, doniesienie lub pogłoskę. „Doniesienia” zachowują szeroki sens i nie sugerują koniecznie, że wiadomości są fałszywe.
- source_word: ὁρᾶτε
  choice: uważajcie
  rationale: Imperatyw pełni tu funkcję ostrzeżenia wprowadzającego następujący zakaz. „Uważajcie” brzmi naturalnie i zachowuje siłę wezwania.
- source_word: μὴ θροεῖσθε
  choice: abyście się nie trwożyli
  rationale: θροέομαι oznacza dać się zaniepokoić, przerazić lub wprawić w popłoch. „Nie trwożyli” jest zwięzłe, zrozumiałe i odpowiednio podniosłe, bez wzmacniania emocji do skrajnego przerażenia.
- source_word: δεῖ γὰρ γενέσθαι
  choice: musi się to bowiem wydarzyć
  rationale: δεῖ wyraża konieczność, a γενέσθαι — zaistnienie lub wydarzenie się. Zaimek „to” naturalnie wskazuje na poprzednio wymienione zjawiska, nie dodając bardziej szczegółowej interpretacji.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ale to jeszcze nie koniec
  rationale: Sformułowanie jest naturalne po polsku, a zarazem zachowuje zwięzłość i ogólność greckiego τὸ τέλος.
theological_decisions:
- issue: Eschatologiczny sens τὸ τέλος
  choice: koniec
  alternative: dopełnienie; ostateczny koniec
  rationale: Pozostawiono szerokie określenie „koniec”, zgodnie z greką, bez przypisywania go do konkretnego schematu wydarzeń eschatologicznych.
translation_notes:
  register: Współczesna, standardowa polszczyzna o godnym, lekko podniosłym tonie. Zachowano powtórzenie „o wojnach”, obecne w greckiej składni, oraz rozdzielono ostrzeżenie na osobne zdanie dla jasności.
