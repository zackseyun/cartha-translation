  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: pl
  text: I pośle swoich aniołów z donośnym dźwiękiem trąby[a], a oni zgromadzą jego wybranych[b] z czterech wiatrów[c], od jednego krańca niebios aż po drugi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „z wielką trąbą” lub „przy potężnym dźwięku trąby”.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „jego wybrańców”.'
    reason: lexical_alternative
  - marker: c
    text: Wyrażenie „z czterech wiatrów” oznacza wszystkie kierunki, czyli najdalsze zakątki świata.
    reason: cultural_note
  - marker: d
    text: 'Dosłownie: „od krańców niebios aż po ich krańce” — od jednego skrajnego punktu do drugiego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: pośle
  rationale: Czas przyszły czasownika ἀποστέλλω oznacza posłanie lub wysłanie z określonym zadaniem. Polskie „pośle” jest naturalne i zachowuje ten sens bez zbędnego dopowiedzenia.
- source_word: ἀγγέλους
  choice: aniołów
  rationale: W eschatologicznym kontekście chodzi o istoty niebiańskie, dlatego właściwym odpowiednikiem jest „aniołowie”, nie ogólne „posłańcy”.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: przy donośnym dźwięku trąby
  rationale: μετά z dopełniaczem wyraża tu towarzyszącą okoliczność. σάλπιγξ oznacza trąbę, a μεγάλη może wskazywać na wielkość lub donośność; przekład główny naturalnie oddaje słyszalny sygnał, a bardziej dosłowne możliwości podano w przypisie.
- source_word: ἐπισυνάξουσιν
  choice: zgromadzą
  rationale: Czasownik oznacza zebranie rozproszonych osób w jedną całość. „Zgromadzą” brzmi naturalnie i zachowuje wzmacniającą wartość przedrostka ἐπι-.
- source_word: ἐκλεκτούς
  choice: wybranych
  rationale: Rzeczownikowo użyty przymiotnik oznacza tych, którzy zostali wybrani. „Wybrani” jest w języku polskim jasne i nie narzuca rozwiniętego systemu teologicznego.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: z czterech stron świata
  rationale: Dosłowne „z czterech wiatrów” jest biblijnym obrazem oznaczającym wszystkie kierunki. Współczesny polski idiom „z czterech stron świata” przekazuje sens i zachowuje czteroczłonową, uniwersalną rozpiętość obrazu; formę dosłowną odnotowano w przypisie.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: od jednego krańca niebios aż po drugi
  rationale: Grecka konstrukcja dosłownie mówi o krańcach niebios i ich krańcach. Polski meryzm „od jednego krańca… po drugi” jasno oddaje pełny zasięg, zachowując liczbę mnogą „niebios”.
theological_decisions:
- issue: Oddanie ἐκλεκτούς w kontekście eschatologicznym
  choice: jego wybranych
  alternative: jego wybrańców
  rationale: „Wybranych” zachowuje podstawowy sens greckiego określenia, nie rozstrzygając w tym wersecie podstawy, czasu ani doktrynalnego zakresu wybrania. „Wybrańcy” jest możliwe, lecz bardziej nacechowane tradycyjną terminologią.
- issue: Zakres obrazu zgromadzenia
  choice: z czterech stron świata, od jednego krańca niebios aż po drugi
  alternative: z czterech wiatrów, od krańców niebios aż po ich krańce
  rationale: Przekład zachowuje powszechny, kosmiczny zasięg obrazu i nie zawęża go wyłącznie do geografii ziemskiej. Jednocześnie stosuje naturalne polskie idiomy, a dosłowną postać greckich wyrażeń udostępnia w przypisach.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zdanie zachowuje uroczysty ton mowy eschatologicznej, ale unika archaizmów i nadmiernie technicznej terminologii. Zaimek „oni” jednoznacznie wskazuje aniołów jako wykonawców zgromadzenia.
