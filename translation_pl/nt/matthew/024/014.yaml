id: MAT.24.14
reference: Matthew 24:14
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: pl
  text: A ta dobra nowina o królestwie[a] będzie głoszona po całym świecie[b] na świadectwo wszystkim narodom[c]. I wtedy nadejdzie koniec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „dobra nowina królestwa” lub „ewangelia o królestwie”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „po całym zamieszkanym świecie”.'
    reason: lexical_alternative
  - marker: c
    text: 'Możliwe też: „wszystkim ludom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: będzie głoszona
  rationale: Forma przyszła strony biernej wskazuje na publiczne obwieszczanie. „Będzie głoszona” brzmi naturalnie po polsku i zachowuje sens uroczystego, publicznego zwiastowania bez zawężania go do formalnego kaznodziejstwa.
- source_word: εὐαγγέλιον
  choice: dobra nowina
  rationale: Podstawowym sensem rzeczownika jest „dobra wiadomość/nowina”. „Dobra nowina” jest przejrzysta dla współczesnego odbiorcy i nie ogranicza wyrażenia do utrwalonego terminu kościelnego „ewangelia”.
- source_word: τῆς βασιλείας
  choice: o królestwie
  rationale: Dopełniacz może być oddany formalnie jako „królestwa”, lecz w tym połączeniu wskazuje na treść dobrej nowiny dotyczącą królestwa. „O królestwie” jest naturalne po polsku; bardziej formalną możliwość zachowano w przypisie.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: po całym świecie
  rationale: οἰκουμένη oznacza zamieszkany świat, świat ludzkiej społeczności. „Po całym świecie” naturalnie wyraża powszechny zasięg, a dosłowniejszy niuans podano w przypisie.
- source_word: εἰς μαρτύριον
  choice: na świadectwo
  rationale: 'Wyrażenie może wskazywać cel lub skutek: głoszenie ma służyć jako świadectwo. Sformułowanie nie rozstrzyga, czy chodzi o świadectwo dla słuchaczy, czy przeciw nim.'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: wszystkim narodom
  rationale: ἔθνη odnosi się tu szeroko do narodów lub ludów. „Wszystkim narodom” zachowuje podstawowe znaczenie i biblijny wydźwięk, nie zawężając sensu do nie-Żydów.
- source_word: ἥξει
  choice: nadejdzie
  rationale: W odniesieniu do oczekiwanego wydarzenia „nadejdzie” jest naturalnym polskim odpowiednikiem ἥξει i zachowuje jego przyszły aspekt.
- source_word: τὸ τέλος
  choice: koniec
  rationale: Proste „koniec” oddaje τέλος bez dopowiadania, czy chodzi o kres epoki, dopełnienie dziejów czy określony schemat czasów ostatecznych.
theological_decisions:
- issue: Zakres οἰκουμένη i ἔθνη w wypowiedzi eschatologicznej
  choice: Zastosowano szerokie określenia „po całym świecie” i „wszystkim narodom”.
  alternative: Możliwe są bardziej historycznie nacechowane „po całym zamieszkanym świecie” oraz etnicznie ukierunkowane „wszystkim ludom”.
  rationale: Przekład zachowuje powszechny zakres wypowiedzi, ale nie rozstrzyga, czy οἰκουμένη ma przede wszystkim perspektywę świata znanego w I wieku, ani nie narzuca konkretnego poglądu na historyczne spełnienie lub harmonogram eschatologiczny.
- issue: Znaczenie εἰς μαρτύριον
  choice: „na świadectwo” bez wskazania, czy jest ono dla narodów, czy przeciw nim
  alternative: „aby dać świadectwo wszystkim narodom” lub „jako świadectwo przeciw wszystkim narodom”
  rationale: Grecka konstrukcja pozostawia funkcję świadectwa niedookreśloną; przekład zachowuje tę teologiczną i retoryczną otwartość.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zdanie podzielono przed końcową frazą dla naturalnego polskiego rytmu, zachowując jej ścisły związek logiczny przez „I wtedy”. Wszystkie warianty przypisowe są oznaczone w tekście głównym.
