base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: pl
  text: 'On zaś odpowiedział im: „Czy nie widzicie tego wszystkiego? Zaprawdę mówię wam: nie pozostanie tu kamień na kamieniu, który nie zostałby zburzony[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „rozebrany”. Grecki czasownik może oznaczać zburzenie lub rozebranie budowli; „zburzony” oddaje w tym kontekście jej całkowite zniszczenie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: odpowiedział
  rationale: Grecka konstrukcja imiesłów + czasownik osobowy jest typowym, częściowo semityzującym połączeniem. W naturalnej współczesnej polszczyźnie jeden czasownik „odpowiedział” wiernie oddaje jej funkcję bez zbędnego dublowania „odpowiedział i powiedział”.
- source_word: Οὐ βλέπετε
  choice: Czy nie widzicie
  rationale: Przeczenie οὐ wprowadza pytanie retoryczne oczekujące potwierdzenia; polska forma zachowuje zarówno dosłowne widzenie, jak i wezwanie do uświadomienia sobie tego, co znajduje się przed rozmówcami.
- source_word: ταῦτα πάντα
  choice: tego wszystkiego
  rationale: Naturalny polski odpowiednik greckiego zaimka w liczbie mnogiej z πᾶς; w kontekście odnosi się do wspomnianych budowli świątynnych.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Zaprawdę mówię wam
  rationale: Zachowuje uroczystą, charakterystyczną formułę Jezusa oraz tradycyjny, lecz nadal zrozumiały polski odpowiednik ἀμήν.
- source_word: οὐ μὴ ἀφεθῇ
  choice: nie pozostanie
  rationale: 'Konstrukcja οὐ μή z aorystem trybu łączącego wyraża stanowcze zaprzeczenie. W polskim siłę tę naturalnie niesie całość zdania: „nie pozostanie... kamień na kamieniu”.'
- source_word: ὧδε
  choice: tu
  rationale: Zwięzły i naturalny odpowiednik przysłówka miejsca, odnoszącego się do bezpośredniego otoczenia świątyni.
- source_word: λίθος ἐπὶ λίθον
  choice: kamień na kamieniu
  rationale: Jest to utrwalony i naturalny polski idiom, zachowujący konkretny obraz całkowitego rozebrania budowli.
- source_word: καταλυθήσεται
  choice: został zwalony
  rationale: Czasownik w tym kontekście oznacza rozebranie lub zburzenie konstrukcji. „Zwalony” zachowuje konkretny obraz usunięcia kamieni z ich miejsca, a przypis podaje szerszą alternatywę leksykalną.
theological_decisions:
- issue: Zakres i wymowa zapowiedzi Jezusa dotyczącej świątyni
  choice: Konkretna zapowiedź całkowitego zniszczenia budowli, bez przypisywania jej w przekładzie określonego systemu eschatologicznego.
  alternative: Odczytanie wypowiedzi przede wszystkim symbolicznie albo powiązanie jej w samym przekładzie z konkretnym późniejszym schematem eschatologicznym.
  rationale: 'Słownictwo wersetu jest konkretne i architektoniczne: mówi o kamieniach, które nie pozostaną jeden na drugim. Przekład zachowuje ten sens, nie dodając interpretacji doktrynalnej niewyrażonej w tekście.'
translation_notes:
  register: Współczesna, godna i komunikatywna polszczyzna. „Zaprawdę” zachowano ze względu na uroczysty i rozpoznawalny charakter formuły Jezusa. Konstrukcja „który by nie został zwalony” oddaje greckie zdanie względne i stanowczą całościową negację, pozostając naturalna po polsku.
