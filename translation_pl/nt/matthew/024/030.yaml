source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: pl
  text: Wtedy na niebie[a] ukaże się znak Syna Człowieczego. Wtedy wszystkie plemiona ziemi[b] będą lamentować i zobaczą Syna Człowieczego przychodzącego na obłokach nieba[c] z mocą i wielką chwałą.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w niebie”. Greckie οὐρανός może oznaczać zarówno niebo jako sferę niebiańską, jak i widzialne niebo nad ziemią.'
    reason: lexical_alternative
  - marker: b
    text: 'Możliwe też: „wszystkie plemiona kraju”. Greckie γῆ może oznaczać „ziemię” albo „kraj”.'
    reason: alternative_reading
  - marker: c
    text: Wyrażenie „przychodzącego na obłokach nieba” nawiązuje do Księgi Daniela 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: ukaże się
  rationale: 'Forma ta ma tu sens nieprzechodni: znak stanie się widoczny. „Ukaże się” jest naturalne i zachowuje podniosły charakter wypowiedzi.'
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: znak Syna Człowieczego
  rationale: 'Dosłowna konstrukcja dopełniaczowa zachowuje niejednoznaczność: może chodzić o znak związany z Synem Człowieczym, a być może o niego samego jako znak.'
- source_word: ἐν τῷ οὐρανῷ
  choice: na niebie
  rationale: Polskie „na niebie” naturalnie określa miejsce widzialnego ukazania się znaku, a zarazem może zachować religijno-apokaliptyczne skojarzenie z niebem. Alternatywny sens „na firmamencie” podano w przypisie.
- source_word: κόψονται
  choice: będą lamentować
  rationale: W tym użyciu czasownik oznacza żałobny lament, pierwotnie mogący obejmować bicie się w piersi. „Będą lamentować” jasno oddaje czynność bez narzucania konkretnego gestu.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: wszystkie plemiona ziemi
  rationale: „Plemiona” najbliżej odpowiada φυλαί i zachowuje biblijne aluzje, natomiast „ziemia” pasuje do kosmicznego kontekstu. Możliwe znaczenie „kraju” zachowano w przypisie.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: przychodzącego na obłokach nieba
  rationale: Sformułowanie blisko oddaje grecką konstrukcję i zachowuje wyraźne nawiązanie do Daniela 7:13. „Obłoki” odpowiadają podniosłemu, apokaliptycznemu rejestrowi.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: z mocą i wielką chwałą
  rationale: Przekład zachowuje składnię, w której określenie „wielką” odnosi się bezpośrednio do chwały, i brzmi naturalnie po polsku.
theological_decisions:
- issue: Znaczenie wyrażenia „znak Syna Człowieczego”
  choice: Zachowano konstrukcję „znak Syna Człowieczego”.
  alternative: „znak należący do Syna Człowieczego” albo „znak, którym jest sam Syn Człowieczy”
  rationale: Grecki dopełniacz nie rozstrzyga jednoznacznie relacji między znakiem a Synem Człowieczym, dlatego przekład nie usuwa tej teologicznej niejednoznaczności.
- issue: Zakres znaczeniowy γῆ
  choice: W tekście głównym użyto „ziemi”.
  alternative: „kraju”
  rationale: Kosmiczny i apokaliptyczny kontekst przemawia za znaczeniem powszechnym, ale możliwe nawiązanie dotyczące konkretnego kraju pozostaje realną alternatywą i zostało wskazane w przypisie.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr z zachowaniem apokaliptycznej podniosłości. „Syn Człowieczy”, „obłoki” i „chwała” utrzymują rozpoznawalny język biblijny, natomiast składnia pozostaje naturalna dla dzisiejszego polskiego czytelnika.
