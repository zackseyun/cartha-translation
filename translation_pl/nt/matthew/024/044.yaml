  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: pl
  text: Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przychodzi o godzinie, której się nie spodziewacie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „o godzinie, o której nie sądzicie, że przyjdzie”. Grecki czasownik może znaczyć „myśleć” lub „sądzić”, a w tym kontekście: „spodziewać się”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dlatego
  rationale: Zwrot wskazuje na wniosek wynikający z poprzedzającego ostrzeżenia; „dlatego” naturalnie i zwięźle zachowuje ten związek.
- source_word: καὶ ὑμεῖς
  choice: i wy
  rationale: Zachowuje włączający i lekko emfatyczny charakter καί wraz z wyraźnym zaimkiem ὑμεῖς.
- source_word: γίνεσθε ἕτοιμοι
  choice: bądźcie gotowi
  rationale: Naturalny polski tryb rozkazujący oddaje wezwanie do pozostawania w stanie gotowości; dosłowne „stawajcie się gotowi” sugerowałoby niepotrzebnie proces dochodzenia do gotowości.
- source_word: ὅτι
  choice: bo
  rationale: Spójnik wprowadza przyczynę nakazu; „bo” jest współczesne, naturalne i zachowuje tok argumentacji.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: o godzinie, której się nie spodziewacie
  rationale: Polski idiom czasowy „o godzinie” odpowiada greckiemu celownikowi czasu, a „nie spodziewacie się” jasno przekazuje kontekstowy sens δοκεῖτε, nie zacierając jego podstawowego znaczenia odnotowanego w przypisie.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  rationale: Utrwalony polski odpowiednik tytułu zachowuje jego dosłowną formę, tło semickie i możliwe odniesienie do Księgi Daniela.
- source_word: ἔρχεται
  choice: przychodzi
  rationale: Czas teraźniejszy zachowuje żywość greckiej formy i może w tym kontekście wskazywać na przyszłe przyjście bez zastępowania jej jednoznacznym futurum.
theological_decisions:
- issue: Oddanie chrystologicznego tytułu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Syn Człowieczy
  alternative: Człowiek / Istota ludzka
  rationale: Tradycyjne, dosłowne brzmienie zachowuje status tytułu, jego wieloznaczność oraz możliwy rezonans Danielowy, bez narzucania interpretacyjnej parafrazy.
- issue: Aspekt i odniesienie czasowe ἔρχεται
  choice: przychodzi
  alternative: przyjdzie
  rationale: Grecki czas teraźniejszy może mieć odniesienie przyszłe, lecz forma „przychodzi” zachowuje jego retoryczną bezpośredniość i nie rozstrzyga ponad tekst.
translation_notes:
  register: Współczesny, godny i prosty rejestr. Zachowano tradycyjny tytuł „Syn Człowieczy” oraz grecki czas teraźniejszy „przychodzi”. Marker przypisu umieszczono bezpośrednio po zdaniu, którego dotyczy.
