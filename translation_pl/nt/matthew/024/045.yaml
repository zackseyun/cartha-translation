source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: pl
  text: Kto więc jest wiernym i roztropnym niewolnikiem[a], którego pan[b] ustanowił nad swoją służbą domową, aby dawał im pożywienie we właściwym czasie?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „sługą”. Greckie słowo może zależnie od kontekstu oznaczać niewolnika lub sługę; tutaj „niewolnik” mocniej oddaje podległość władzy pana.'
    reason: lexical_alternative
  - marker: b
    text: 'Albo: „Pan”. W obrazie gospodarstwa domowego greckie słowo oddano jako „pan”, zgodnie z relacją między panem a niewolnikiem.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Kto więc
  rationale: Pytajnik τίς wraz z wynikowym lub nawiązującym ἄρα wprowadza pytanie retoryczne wypływające z poprzedniej nauki; „Kto więc” naturalnie zachowuje tę funkcję.
- source_word: πιστὸς
  choice: wiernym
  rationale: W tym kontekście określa kogoś godnego zaufania i niezawodnego w powierzonym zadaniu; „wierny” zachowuje zarówno sens praktyczny, jak i moralny.
- source_word: δοῦλος
  choice: niewolnikiem
  rationale: δοῦλος oznacza osobę podległą władzy pana. W obrazie gospodarstwa domowego „niewolnik” pełniej niż łagodniejsze „sługa” oddaje zależny status tej postaci; alternatywę podano w przypisie.
- source_word: φρόνιμος
  choice: roztropnym
  rationale: φρόνιμος wskazuje na praktyczną mądrość, rozsądek i przezorność. „Roztropny” trafnie oddaje ten aspekt w kontekście odpowiedzialnego zarządzania.
- source_word: κατέστησεν
  choice: ustanowił
  rationale: Czasownik oznacza tu wyznaczenie kogoś do pełnienia odpowiedzialnej funkcji i powierzenie mu zwierzchnictwa.
- source_word: κύριος
  choice: pan
  rationale: W bezpośrednim obrazie gospodarstwa domowego κύριος określa pana, któremu podlega niewolnik. Mała litera zachowuje powierzchniowy sens przypowieści, nie wykluczając jej szerszego odniesienia.
- source_word: οἰκετείας
  choice: służbą domową
  rationale: οἰκετεία odnosi się do domowników pozostających w służbie, czyli personelu domu. „Służba domowa” precyzyjniej niż ogólne „dom” wskazuje na osoby, nad którymi niewolnik został ustanowiony.
- source_word: τοῦ δοῦναι
  choice: aby dawał
  rationale: Rodzajnikowy bezokolicznik wyraża cel ustanowienia; polska konstrukcja „aby dawał” przekazuje tę relację jasno i naturalnie.
- source_word: τροφὴν
  choice: pożywienie
  rationale: τροφή oznacza żywność lub pokarm. „Pożywienie” jest godne stylistycznie i nie dopowiada szczegółów dotyczących racji żywnościowych.
- source_word: ἐν καιρῷ
  choice: we właściwym czasie
  rationale: καιρός oznacza stosowną, odpowiednią porę, a nie tylko punkt chronologiczny; przekład zachowuje tę treść.
theological_decisions:
- issue: Oddanie κύριος w obrazie gospodarstwa domowego
  choice: pan
  alternative: Pan
  rationale: Bezpośrednia warstwa wypowiedzi przedstawia relację pana domu do podległego mu niewolnika, dlatego mała litera i znaczenie „pan” najlepiej zachowują obraz społeczny. Zapis „Pan” mógłby od razu rozstrzygać chrystologiczne odniesienie, które pozostaje obecne na poziomie zastosowania przypowieści, lecz nie powinno przesłaniać jej dosłownej sceny.
- issue: Siła społecznego określenia δοῦλος
  choice: niewolnik
  alternative: sługa
  rationale: „Niewolnik” zachowuje mocny sens osoby znajdującej się pod władzą pana. „Sługa” jest tradycyjne i możliwe kontekstowo, ale może osłabiać zależność wyrażoną przez grecki rzeczownik.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zdanie zachowuje formę pytania retorycznego oraz metaforykę zarządzania gospodarstwem domowym. Zaimek „jej” odnosi się zbiorowo do służby domowej; dzięki temu polszczyzna pozostaje naturalna, choć grecki tekst używa zaimka w liczbie mnogiej odnoszącego się do jej członków.
