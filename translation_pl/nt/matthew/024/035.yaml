  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: pl
  text: Niebo i ziemia przeminą, lecz moje słowa z całą pewnością nie przeminą.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: niebo
  rationale: W eschatologicznym zestawieniu z γῆ oznacza stworzone niebo, nie tylko widzialny firmament; polskie „niebo i ziemia” naturalnie oddaje całość obecnego stworzonego porządku.
- source_word: ἡ γῆ
  choice: ziemia
  rationale: W stałym zestawieniu „niebo i ziemia” odnosi się do ziemi jako części kosmicznej całości, a nie do określonego kraju czy obszaru.
- source_word: παρελεύσεται
  choice: przeminą
  rationale: Czasownik παρέρχομαι wyraża tu ustanie obecnego porządku stworzenia. „Przeminą” jest zwięzłe, uroczyste i nie dopowiada sposobu tego ustania.
- source_word: δὲ
  choice: lecz
  rationale: Spójnik wprowadza wyraźny kontrast między przemijaniem nieba i ziemi a trwałością słów Jezusa.
- source_word: οἱ λόγοι μου
  choice: moje słowa
  rationale: λόγοι obejmuje wypowiedzi i nauczanie Jezusa; „moje słowa” jest bezpośrednim i naturalnym odpowiednikiem.
- source_word: οὐ μὴ παρέλθωσιν
  choice: z całą pewnością nie przeminą
  rationale: Konstrukcja οὐ μή z aorystem trybu łączącego stanowi mocne, emfatyczne zaprzeczenie. Wyrażenie „z całą pewnością nie” jasno przekazuje ten nacisk we współczesnej polszczyźnie.
theological_decisions:
- issue: Siła twierdzenia Jezusa o trwałości jego słów
  choice: Zachować emfatyczny kontrast między przemijającym stworzeniem a niezawodną trwałością słów Jezusa.
  alternative: Przełożyć bardziej interpretacyjnie, wprost objaśniając wynikające z wypowiedzi roszczenie do boskiego autorytetu.
  rationale: Tekst sam mocno stwierdza trwałość słów Jezusa, lecz nie rozwija jej doktrynalnych konsekwencji. Przekład zachowuje wagę tej wypowiedzi bez dodawania objaśnień.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. Powtórzenie czasownika „przeminą” odtwarza retoryczny kontrast oryginału, a „z całą pewnością” przekazuje emfatyczne οὐ μή bez archaizowania.
