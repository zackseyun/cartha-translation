base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: pl
  text: Czuwajcie więc[a], ponieważ nie wiecie, którego dnia przychodzi wasz Pan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „Bądźcie czujni” lub „Nie przestawajcie czuwać”.'
