lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Czuwajcie
  rationale: Tryb rozkazujący czasu teraźniejszego, w liczbie mnogiej, wzywa do stałej czujności. „Czuwajcie” naturalnie zachowuje zarówno obraz pozostawania na jawie, jak i sens duchowej gotowości.
- source_word: οὖν
  choice: więc
  rationale: Wskazuje na wniosek wynikający z poprzedzającej nauki; „więc” jest zwięzłe i naturalne we współczesnej polszczyźnie.
- source_word: ὅτι
  choice: ponieważ
  rationale: Wprowadza uzasadnienie wezwania. „Ponieważ” jasno oddaje zależność przyczynową.
- source_word: οὐκ οἴδατε
  choice: nie wiecie
  rationale: Bezpośrednio oddaje zanegowany czasownik oznaczający wiedzę, bez dodawania nieobecnego w grece stopnia pewności.
- source_word: ποίᾳ ἡμέρᾳ
  choice: którego dnia
  rationale: Celownik wyraża określenie czasu. „Którego dnia” jest idiomatyczne i zachowuje nieokreśloność konkretnego dnia.
- source_word: ὁ κύριος ὑμῶν
  choice: wasz Pan
  rationale: Naturalny polski odpowiednik konstrukcji z rodzajnikiem i zaimkiem dzierżawczym; zachowuje tytuł „Pan” oraz relację wyrażoną przez ὑμῶν.
- source_word: ἔρχεται
  choice: przychodzi
  rationale: Forma czasu teraźniejszego zostaje oddana polskim czasem teraźniejszym, co zachowuje żywość i eschatologiczne napięcie wypowiedzi bez precyzowania terminu wydarzenia.
theological_decisions:
- issue: Eschatologiczna wymowa czasu teraźniejszego ἔρχεται
  choice: przychodzi
  alternative: przyjdzie
  rationale: Grecki tekst używa czasu teraźniejszego w kontekście przyszłego przyjścia. Polski czas teraźniejszy zachowuje formę i naglący charakter wypowiedzi, nie rozstrzygając dokładnej relacji czasowej ani określonej doktryny bliskości tego wydarzenia.
translation_notes:
  register: Język współczesny, prosty i godny. „Czuwajcie” zachowuje utrwalony biblijny obraz, a zarazem pozostaje zrozumiałe. Szyk zdania jest naturalny po polsku i nie zaciera nacisku na niewiedzę co do dnia przyjścia.
