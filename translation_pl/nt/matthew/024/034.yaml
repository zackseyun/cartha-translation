  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: pl
  text: 'Zaprawdę mówię wam: to pokolenie na pewno nie przeminie, aż wydarzy się to wszystko[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „ten lud” lub „ten ród”. Greckie słowo może mieć szersze znaczenie, ale „pokolenie” jest tutaj najbardziej bezpośrednim odpowiednikiem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: W uroczystej formule Jezusa tradycyjne, lecz nadal zrozumiałe „Zaprawdę” naturalnie oddaje stanowcze zapewnienie.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośredni i naturalny polski odpowiednik, zachowujący zwrot do słuchaczy.
- source_word: ὅτι
  choice: dwukropek po formule wprowadzającej
  rationale: Polszczyzna naturalnie wprowadza treść uroczystej wypowiedzi dwukropkiem; osobne „że” nie jest konieczne.
- source_word: οὐ μὴ παρέλθῃ
  choice: na pewno nie przeminie
  rationale: Konstrukcja οὐ μή z aorystem trybu łączącego wyraża mocne przeczenie; „na pewno nie” jasno zachowuje jej emfatyczny charakter.
- source_word: ἡ γενεὰ αὕτη
  choice: to pokolenie
  rationale: „Pokolenie” jest najbardziej bezpośrednim odpowiednikiem γενεά i nie rozstrzyga spornej interpretacji eschatologicznej.
- source_word: ἕως ἂν
  choice: aż
  rationale: W tym zdaniu „aż” naturalnie wyznacza przyszłą granicę czasową.
- source_word: πάντα ταῦτα
  choice: to wszystko
  rationale: Naturalny polski zwrot zbiorczo odnoszący się do wszystkich wcześniej wymienionych wydarzeń.
- source_word: γένηται
  choice: wydarzy się
  rationale: W kontekście zapowiadanych wydarzeń γίνομαι oznacza ich nastąpienie; forma ta jest współczesna i klarowna.
theological_decisions:
- issue: Znaczenie wyrażenia ἡ γενεὰ αὕτη w mowie eschatologicznej
  choice: to pokolenie
  alternative: ten lud; ten ród
  rationale: Najbardziej bezpośrednie znaczenie leksykalne zachowano w tekście głównym, bez narzucania konkretnego schematu eschatologicznego. Szersze możliwe odczytania podano w przypisie.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. „Zaprawdę” zachowuje uroczysty ton formuły, a pozostała składnia jest naturalna dla dzisiejszej polszczyzny.
