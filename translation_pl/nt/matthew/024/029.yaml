id: MAT.24.29
reference: Matthew 24:29
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: pl
  text: Lecz zaraz po ucisku owych dni słońce zostanie zaciemnione, księżyc nie da swego blasku, gwiazdy spadną z nieba[a], a moce niebios zostaną wstrząśnięte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greckie słowo może oznaczać zarówno widzialne niebo, jak i niebo rozumiane jako sfera niebiańska.
    reason: lexical_alternative
  - marker: b
    text: „Moce niebios” mogą oznaczać siły kosmiczne, ciała niebieskie albo moce niebiańskie; greckie wyrażenie pozostaje szerokie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Lecz zaraz
  rationale: „Zaraz” zachowuje silny sens bezpośredniego następstwa czasowego, a „lecz” oddaje przejście z lekkim odcieniem kontrastu wyrażonym przez δέ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: po ucisku owych dni
  rationale: „Ucisk” jest naturalnym i treściowo nośnym odpowiednikiem θλῖψις; dopełniacz „owych dni” zachowuje zależność składniową tekstu greckiego.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: słońce zostanie zaciemnione
  rationale: Forma bierna zachowuje stronę przyszłą bierną oryginału i nie sprowadza obrazu do zwykłego zjawiska astronomicznego, jakie mogłoby sugerować samo „zaćmi się”.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: księżyc nie da swego blasku
  rationale: Dosłowny, a zarazem naturalny zwrot zachowuje obraz księżyca, który nie daje własnego blasku.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: gwiazdy spadną z nieba
  rationale: 'Prosta forma przyszła wiernie oddaje πεσοῦνται. Polskie „niebo” naturalnie zachowuje możliwe znaczenia οὐρανός: widzialne niebo i sferę niebiańską.'
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: moce niebios
  rationale: To zwięzłe, godne rejestru biblijnego sformułowanie zachowuje liczbę mnogą οὐρανῶν oraz szeroki zakres znaczeniowy δυνάμεις, bez rozstrzygania, czym są te moce.
- source_word: σαλευθήσονται
  choice: zostaną wstrząśnięte
  rationale: Forma przyszła bierna odpowiada greckiemu czasownikowi i zachowuje mocny kosmiczny obraz poruszenia.
theological_decisions:
- issue: Charakter kosmicznych znaków w mowie apokaliptycznej
  choice: Zachować obrazy wprost, bez rozstrzygania, czy opisują dosłowne zjawiska kosmiczne, język prorocko-symboliczny, czy oba wymiary naraz.
  alternative: Odczytać znaki wyłącznie jako dosłowny rozpad kosmosu albo wyłącznie jako symbole przewrotów politycznych i sądu.
  rationale: Tekst posługuje się utrwalonym obrazowaniem prorocko-apokaliptycznym, lecz sam nie objaśnia jego charakteru. Przekład powinien zachować tę teologiczną i literacką otwartość.
- issue: Tożsamość „mocy niebios”
  choice: Pozostawić szerokie określenie „moce niebios”.
  alternative: Doprecyzować je jako ciała niebieskie, siły kosmiczne albo istoty duchowe.
  rationale: Greckie wyrażenie może dopuszczać kilka odniesień; wybór jednego z nich w tekście głównym stanowiłby nadinterpretację.
translation_notes:
  register: Współczesny, uroczysty rejestr biblijny. Zachowano rytmiczny ciąg czterech zdań współrzędnych oraz apokaliptyczną powagę bez archaizmów. Markery przypisów umieszczono przy wyrażeniach, których rzeczywiście dotyczą.
