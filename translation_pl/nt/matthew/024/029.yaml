  source_fidelity: 'Przekład wiernie oddaje składnię i obrazowanie greckie: silne następstwo czasowe („Lecz zaraz po”), θλῖψις jako „ucisk”, przyszłą stronę bierną przy zaciemnieniu słońca i wstrząśnięciu mocy oraz nierozstrzygniętą frazę „moce niebios”. „Gwiazdy spadną z nieba” trafnie zachowuje sens ἀπὸ τοῦ οὐρανοῦ.'
