  terminology: „Ucisk”, „blask”, „niebo/niebiosa” i „moce niebios” są trafne. Zwłaszcza „moce niebios” zachowuje wieloznaczność δυνάμεις τῶν οὐρανῶν, nie przesądzając o siłach kosmicznych, ciałach niebieskich ani istotach niebiańskich.
