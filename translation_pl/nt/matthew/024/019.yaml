  variant: modern standard Polish
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: pl
  text: Biada zaś kobietom w ciąży i karmiącym piersią w owych dniach[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Można też: „tym, które są w ciąży, i tym, które karmią piersią”.'
    reason: Alternatywne, bardziej dosłowne oddanie żeńskich form greckich użytych rzeczownikowo.
lexical_decisions:
- source_word: οὐαί
  choice: biada
  rationale: Zachowuje mocne, prorockie zawołanie wyrażające zarówno lament, jak i zapowiedź dotkliwego nieszczęścia.
- source_word: δὲ
  choice: zaś
  rationale: Oddaje łagodne przejście w toku wypowiedzi bez narzucania silnego przeciwstawienia.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: będącym w ciąży
  rationale: Naturalnie oddaje grecki idiom oznaczający bycie w ciąży, a żeńska forma celownika zachowuje wskazanie na kobiety bez dodawania rzeczownika nieobecnego w tekście.
- source_word: ταῖς θηλαζούσαις
  choice: karmiącym piersią
  rationale: Jasno i współcześnie oddaje czynność karmienia dziecka mlekiem matki; dopełnienie pozostaje domyślne, podobnie jak w grece.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: w owych dniach
  rationale: Wiernie oddaje wskazujący charakter ἐκείναις i zachowuje godny, naturalny rejestr.
theological_decisions:
- issue: Odniesienie żeńskich form celownika i imiesłowów
  choice: będącym w ciąży i karmiącym piersią
  alternative: kobietom w ciąży i kobietom karmiącym piersią
  rationale: Greckie formy żeńskie jednoznacznie odnoszą się do kobiet, lecz nie zawierają rzeczownika „kobiety”. Polska konstrukcja zachowuje zarówno żeński referent, jak i zwięzłość źródła, nie przesuwając akcentu z ich szczególnie trudnego położenia.
translation_notes:
  register: Współczesny, zrozumiały i godny rejestr. „Biada” zachowuje biblijną siłę wypowiedzi, natomiast „karmiącym piersią” jest naturalne we współczesnej polszczyźnie.
