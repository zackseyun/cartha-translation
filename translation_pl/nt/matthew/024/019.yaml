  terminology: '„Biada”, „w ciąży” i „karmiącym piersią” są trafne dla współczesnej polszczyzny o godnym rejestrze. Jawne „kobietom” nie jest nieuzasadnionym dodatkiem znaczeniowym: żeński rodzaj greckich rodzajników i imiesłowów wyraźnie wskazuje ten referent.'
