  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: pl
  text: 'Zaprawdę mówię wam: ustanowi go nad całym swoim mieniem[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Albo: „nad wszystkim, co posiada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Zaprawdę
  rationale: Wprowadza uroczyste, autorytatywne oświadczenie Jezusa; tradycyjna forma pozostaje zrozumiała i zachowuje podniosłość formuły.
- source_word: λέγω ὑμῖν
  choice: mówię wam
  rationale: Bezpośrednio oddaje czasownik w czasie teraźniejszym i zaimek w celowniku, zachowując formułę wypowiedzi.
- source_word: ὅτι
  choice: ':'
  rationale: W naturalnej polszczyźnie treść uroczystej zapowiedzi można przejrzyście wprowadzić dwukropkiem; sens greckiego spójnika pozostaje zachowany.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: nad całym swoim mieniem
  rationale: Przy καταστήσει przyimek ἐπί z celownikiem wskazuje zakres powierzonej odpowiedzialności, a τοῖς ὑπάρχουσιν oznacza to, co do pana należy. „Mienie” jest zwięzłe, naturalne i obejmuje ogół jego dóbr.
- source_word: καταστήσει
  choice: ustanowi
  rationale: W tym kontekście czasownik oznacza wyznaczenie kogoś do odpowiedzialnej funkcji, nie fizyczne postawienie.
- source_word: αὐτόν
  choice: go
  rationale: Zaimek rodzaju męskiego w liczbie pojedynczej odnosi się do sługi z poprzedniego kontekstu i zostaje zachowany.
theological_decisions:
- issue: Charakter nagrody lub powierzenia przez pana
  choice: Werset przedstawia ustanowienie sługi nad całym mieniem pana w ramach obrazu przypowieści.
  alternative: Doprecyzować to jako władzę kościelną albo eschatologiczną nagrodę w niebie.
  rationale: Sam tekst mówi o rozszerzeniu zakresu odpowiedzialności. Przekład nie powinien wpisywać w niego określonego systemu interpretacji eklezjologicznej ani eschatologicznej.
translation_notes:
  register: Współczesny, godny rejestr. „Zaprawdę” zachowuje uroczystą formułę, a „mienie” jest zwięzłym i zrozumiałym określeniem całego dobytku pana.
