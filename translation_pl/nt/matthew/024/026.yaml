source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: pl
  text: 'Jeśli więc powiedzą wam: „Spójrzcie, jest na pustkowiu”, nie wychodźcie; „Spójrzcie, jest w wewnętrznych pomieszczeniach”[a], nie wierzcie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „w schowkach”, „w prywatnych komnatach” lub „w ukrytych izbach”. Greckie słowo oznacza wewnętrzne albo prywatne pomieszczenia, niekiedy służące jako składy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Jeśli więc
  rationale: Zachowuje zarówno warunkowy charakter ἐάν, jak i wynikowe nawiązanie οὖν do wcześniejszego ostrzeżenia; szyk jest naturalny po polsku.
- source_word: εἴπωσιν ὑμῖν
  choice: powiedzą wam
  rationale: Oddaje nieokreśloną trzecią osobę liczby mnogiej bez wskazywania konkretnej grupy.
- source_word: Ἰδοὺ
  choice: Spójrzcie
  rationale: Współczesny, bezpośredni zwrot przyciągający uwagę, bez archaizującego tonu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: na pustkowiu
  rationale: ἔρημος oznacza teren odludny lub pustynny; „pustkowie” zachowuje szerszy zakres znaczeniowy i nie narzuca obrazu piaszczystej pustyni.
- source_word: ἐστίν
  choice: jest
  rationale: Polszczyzna pozwala pozostawić podmiot domyślny; kontekst wskazuje na osobę, o której rzekomej obecności mówią rozmówcy, bez potrzeby dopisywania tytułu.
- source_word: μὴ ἐξέλθητε
  choice: nie wychodźcie
  rationale: Bezpośrednio oddaje zakaz oraz ruch na zewnątrz zawarty w ἐξέρχομαι.
- source_word: ἐν τοῖς ταμείοις
  choice: w wewnętrznych izbach
  rationale: ταμεῖον może oznaczać wewnętrzne, prywatne pomieszczenie, izbę lub skład; wybrane sformułowanie pasuje do kontekstu ukrytej lokalizacji i nie przesądza funkcji pomieszczeń.
- source_word: μὴ πιστεύσητε
  choice: nie wierzcie
  rationale: Polski czasownik może naturalnie wystąpić bez wyrażonego dopełnienia; zakaz odnosi się do przytoczonego twierdzenia.
theological_decisions:
- issue: Domyślny podmiot ἐστίν
  choice: „jest” z podmiotem pozostawionym domyślnie
  alternative: „on jest”; „Mesjasz jest”
  rationale: Kontekst pozwala rozpoznać męski osobowy desygnat, a polszczyzna nie wymaga zaimka. Niedodawanie „Mesjasz” ani „Jezus” zachowuje zwięzłość i niedookreślenie greckiego zdania.
- issue: Relacja między dwoma przytoczonymi doniesieniami
  choice: Średnik bez dodanego spójnika „albo”
  alternative: '„albo: «Spójrzcie…»”'
  rationale: Grecki tekst zestawia dwa równoległe przykłady, lecz nie zawiera wyraźnego spójnika rozłącznego; interpunkcja ukazuje paralelizm bez dopowiadania relacji logicznej.
translation_notes:
  register: Język współczesny i godny, z zachowaniem krótkiej, ostrzegawczej formy wypowiedzi. „Spójrzcie” brzmi naturalniej niż archaiczne „Oto”, a „izby” zachowują biblijny rejestr bez utraty zrozumiałości.
