id: MAT.24.7
reference: Matthew 24:7
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: pl
  text: Powstanie bowiem naród przeciw narodowi i królestwo przeciw królestwu. W różnych miejscach[a] nastaną też klęski głodu i trzęsienia ziemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe też: „miejscami”, „w poszczególnych miejscach” albo „tu i ówdzie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: powstanie
  rationale: W konstrukcji z ἐπί i biernikiem czasownik opisuje wystąpienie jednego ludu przeciw drugiemu. „Powstanie” naturalnie oddaje wybuch wrogości, nie sugerując przy tym, że strona bierna wskazuje wprost na Boże działanie.
- source_word: γὰρ
  choice: bowiem
  rationale: Partykuła ma funkcję objaśniającą i łączy zdanie z poprzednim kontekstem. „Bowiem” zachowuje ten związek w naturalnym, podniosłym polskim szyku.
- source_word: ἔθνος
  choice: naród
  rationale: W zestawieniu z „królestwem” oznacza zbiorowość ludzką występującą w konflikcie. „Naród” zachowuje szeroki sens społeczno-polityczny bez zawężania go do pogan.
- source_word: ἐπὶ ἔθνος
  choice: przeciw narodowi
  rationale: Przyimek ἐπί z biernikiem w tej konstrukcji wyraża wrogie wystąpienie przeciw drugiej stronie.
- source_word: βασιλεία
  choice: królestwo
  rationale: Tutaj chodzi o państwo lub obszar politycznego panowania, równoległy wobec „narodu”. Tradycyjne „królestwo” zachowuje polityczny i eschatologiczny rejestr wypowiedzi.
- source_word: ἔσονται
  choice: nastaną
  rationale: Egzystencjalna forma εἰμί zapowiada pojawienie się wymienionych klęsk. „Nastaną” jest zwięzłe i naturalne w tym kontekście.
- source_word: λιμοὶ
  choice: klęski głodu
  rationale: Liczba mnoga odnosi się do powtarzających się lub występujących w wielu miejscach dotkliwych niedoborów żywności. Polski zwrot „klęski głodu” jest jaśniejszy i bardziej idiomatyczny niż samo „głody”.
- source_word: σεισμοὶ
  choice: trzęsienia ziemi
  rationale: W tym kontekście σεισμός oznacza zjawisko sejsmiczne; jest to zwykły i precyzyjny polski odpowiednik.
- source_word: κατὰ τόπους
  choice: w różnych miejscach
  rationale: 'Wyrażenie ma sens dystrybutywny: wydarzenia będą występowały w rozmaitych miejscach, a nie w jednym określonym punkcie.'
theological_decisions:
- issue: Zakres znaczeniowy ἔθνος w zapowiedzi konfliktu
  choice: naród
  alternative: lud
  rationale: Paralelizm z „królestwem” wskazuje na duże zbiorowości społeczne i polityczne. „Naród” nie narzuca ani wyłącznie etnicznego, ani szczególnie pogańskiego odniesienia.
- issue: Znaczenie przyszłej formy ἐγερθήσεται
  choice: powstanie przeciw
  alternative: zostanie wzbudzony przeciw
  rationale: W tym idiomie forma opisuje rozpoczęcie wrogiego działania. Przekład nie przedstawia jej jako wyraźnego passivum divinum, ponieważ tekst nie wskazuje sprawcy.
translation_notes:
  register: Współczesny, zrozumiały polski o godnym, biblijnym rytmie. Zachowano paralelizm „naród przeciw narodowi i królestwo przeciw królestwu”, a dwa człony zdania rozdzielono kropką dla przejrzystości.
