  variant: modern standard Polish
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pl
  text: i rozetnie go na dwoje[a], i wyznaczy mu udział[b] wraz z obłudnikami. Tam będzie płacz i zgrzytanie zębami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Możliwe także w sensie przenośnym: „ukarze go surowo”. Grecki czasownik dosłownie znaczy „rozetnie na dwoje”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dosłownie: „jego udział z obłudnikami”; może chodzić o przydzielony udział lub los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: rozetnie go na dwoje
  rationale: Czasownik dosłownie oznacza rozcięcie na dwie części. Zachowano konkretne, mocne sformułowanie źródła zamiast zastępować je ogólnym opisem surowej kary.
- source_word: μέρος
  choice: dział
  rationale: Polskie „dział” może oznaczać przydzielony komuś udział lub los i dobrze oddaje sądowy kontekst wyrażenia, nie ograniczając go wyłącznie do miejsca.
- source_word: ὑποκριτῶν
  choice: obłudnikami
  rationale: „Obłudnicy” to naturalny i utrwalony polski odpowiednik, zachowujący ważny dla Ewangelii Mateusza motyw pozornej sprawiedliwości.
- source_word: ἐκεῖ
  choice: tam
  rationale: Prosty przysłówek wskazuje na dopiero co wspomniany los obłudników i odpowiada zwięzłości greckiego tekstu.
- source_word: κλαυθμὸς
  choice: płacz
  rationale: „Płacz” jest trafnym i utrwalonym odpowiednikiem w powtarzającej się u Mateusza formule sądu.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: zgrzytanie zębami
  rationale: To naturalny, obrazowy i tradycyjnie rozpoznawalny polski odpowiednik greckiego wyrażenia.
theological_decisions:
- issue: Czy διχοτομήσει złagodzić jako przenośne określenie kary
  choice: Zachować konkretne „rozetnie go na dwoje” w tekście głównym
  alternative: „ukarze go surowo”
  rationale: Dosłowny sens czasownika jest wyraźny, a tekst nie rozstrzyga wprost, czy obraz należy rozumieć literalnie, czy przenośnie. Przypis zachowuje alternatywę bez osłabiania ostrzeżenia.
- issue: Jak oddać τὸ μέρος αὐτοῦ ... θήσει
  choice: „wyznaczy mu dział z obłudnikami”
  alternative: „wyznaczy mu miejsce wśród obłudników”
  rationale: „Dział” zachowuje zakres greckiego μέρος jako udział, przydział lub los i nie przesądza, że chodzi jedynie o lokalizację.
translation_notes:
  register: Współczesny, godny i zrozumiały rejestr. Zachowano gwałtowność greckiego obrazu oraz utrwaloną Mateuszową formułę „płacz i zgrzytanie zębami”. Markery przypisów umieszczono bezpośrednio przy wyrażeniach, których dotyczą.
