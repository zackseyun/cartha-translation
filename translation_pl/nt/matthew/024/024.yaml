id: MAT.24.24
reference: Matthew 24:24
language:
  code: pl
  name: Polish
  native_name: Polski
  variant: modern standard Polish
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: pl
  text: Powstaną bowiem fałszywi mesjasze[a] i fałszywi prorocy. Będą czynić wielkie znaki i cuda, żeby zwieść[b] — jeśli to możliwe[c] — nawet wybranych.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „fałszywi Chrystusowie”. Grecki wyraz Christos jest tutaj tytułem, dlatego w tekście głównym oddano go jako „mesjasze”.'
    reason: alternative_reading
  - marker: b
    text: 'Lub: „sprowadzić na manowce”. Grecki czasownik może oznaczać oszukanie kogoś lub sprawienie, że zejdzie z właściwej drogi.'
    reason: lexical_alternative
  - marker: c
    text: 'Lub: „gdyby to było możliwe”. Tekst grecki mówi po prostu „jeśli możliwe” i nie rozstrzyga zawartej w tym sformułowaniu kwestii teologicznej.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: powstaną
  rationale: W odniesieniu do osób czasownik ten idiomatycznie opisuje pojawienie się lub wystąpienie na scenie; „powstaną” zachowuje obraz grecki, nie sugerując zmartwychwstania.
- source_word: ψευδόχριστοι
  choice: fałszywi mesjasze
  rationale: Χριστός pełni tu funkcję tytułu, dlatego „mesjasze” naturalnie oddaje sens pretendentów do godności mesjańskiej; ψευδο- oddano jako „fałszywi”.
- source_word: ψευδοπροφῆται
  choice: fałszywi prorocy
  rationale: Bezpośredni i utrwalony polski odpowiednik złożonego rzeczownika greckiego.
- source_word: δώσουσιν σημεῖα μεγάλα καὶ τέρατα
  choice: będą czynić wielkie znaki i cuda
  rationale: Choć δίδωμι dosłownie oznacza „dawać”, w połączeniu ze znakami i cudami polszczyzna wymaga idiomatycznego „czynić”. „Znaki” zachowują możliwy sens dowodowy lub zwiastujący, a „cuda” oddają niezwykłość τέρατα.
- source_word: ὥστε πλανῆσαι
  choice: żeby zwieść
  rationale: Konstrukcja ὥστε z bezokolicznikiem może wskazywać zamierzony albo naturalny skutek. Polskie „żeby zwieść” jest zwięzłe i nie rozstrzyga ostro między celem a skutkiem.
- source_word: εἰ δυνατὸν
  choice: jeśli to możliwe
  rationale: Bezpośrednio zachowuje zwięzły warunek obecny w grece, bez dodawania wyraźnie kontrfaktycznego sensu.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: nawet wybranych
  rationale: καί ma tu znaczenie gradacyjne („nawet”), a „wybrani” jest naturalnym i precyzyjnym polskim odpowiednikiem ἐκλεκτοί.
theological_decisions:
- issue: Oddanie ψευδόχριστοι
  choice: fałszywi mesjasze
  alternative: fałszywi Chrystusowie
  rationale: W tym miejscu Χριστός oznacza tytuł roszczony przez wielu pretendentów, a nie imię lub określenie użyte wyłącznie wobec Jezusa. „Mesjasze” zachowuje żydowski i tytularny kontekst ostrzeżenia.
- issue: Znaczenie warunku εἰ δυνατὸν w odniesieniu do wybranych
  choice: jeśli to możliwe
  alternative: gdyby to było możliwe
  rationale: Tekst grecki formułuje prosty warunek i nie wyjaśnia jego teologicznych następstw. Przekład nie przesądza, czy zwiedzenie wybranych jest ostatecznie niemożliwe.
translation_notes:
  register: Współczesna, godna polszczyzna biblijna. Dwa zdania poprawiają czytelność bez zmiany relacji logicznych; pauzy wyodrębniają warunek „jeśli to możliwe”. Zachowano tradycyjną parę „znaki i cuda” oraz teologiczną otwartość greckiego warunku.
