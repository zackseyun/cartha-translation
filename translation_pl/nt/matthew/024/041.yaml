  variant: modern standard Polish
source:
  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: pl
  text: Dwie kobiety będą mełły przy żarnach[a]; jedna zostanie zabrana, a druga pozostawiona[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „przy młynie ręcznym” albo „przy kamieniu młyńskim”. Grecki wyraz może oznaczać młyn, żarna lub kamień służący do mielenia.'
    reason: lexical_alternative
  - marker: b
    text: Grecki tekst mówi po prostu, że jedna zostaje zabrana, a druga pozostawiona; w tym miejscu nie precyzuje, czy zabranie oznacza zbawienie, czy sąd.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Dwie kobiety będą mełły
  rationale: Imiesłów ἀλήθουσαι jest rodzaju żeńskiego i liczby mnogiej, dlatego w polszczyźnie naturalnie i precyzyjnie uzupełniono podmiot „kobiety”. Konstrukcja „będą mełły” oddaje czynność trwającą w opisywanej chwili.
- source_word: ἐν τῷ μύλῳ
  choice: przy żarnach
  rationale: μύλος może oznaczać młyn, kamień młyński lub urządzenie do mielenia. W kontekście domowej pracy „przy żarnach” jest naturalne i nie sugeruje dużego młyna.
- source_word: μία ... καὶ μία
  choice: jedna ... a druga
  rationale: Polskie „jedna… a druga” jasno oddaje rozdzielenie dwóch kobiet; spójnik „a” naturalnie wyraża kontrast wynikający z przeciwstawnych losów, nie rozstrzygając ich znaczenia teologicznego.
- source_word: παραλαμβάνεται
  choice: zostanie zabrana
  rationale: Forma bierna została zachowana. „Zabrana” pozostawia otwarte, dokąd i w jakim celu dana osoba zostaje wzięta.
- source_word: ἀφίεται
  choice: pozostawiona
  rationale: „Pozostawiona” jest bezpośrednim i neutralnym odpowiednikiem, mniej interpretacyjnym niż „porzucona” lub „pozostawiona w tyle”.
theological_decisions:
- issue: Czy wyraźnie wskazać płeć osób wykonujących pracę
  choice: Użyć wyrażenia „dwie kobiety”
  alternative: „Dwie będą mełły”
  rationale: Żeński rodzaj imiesłowu ἀλήθουσαι jednoznacznie wskazuje na kobiety; należy to odzwierciedlić w przekładzie.
- issue: Czy określić zabranie jako zbawienie albo sąd
  choice: Zachować neutralne „zostanie zabrana” i „pozostawiona”
  alternative: Dopowiedzieć, że jedna zostaje zabrana ku zbawieniu lub na sąd
  rationale: Sam werset nie określa jednoznacznie teologicznego znaczenia obu działań, dlatego przekład nie powinien rozstrzygać tej kwestii.
translation_notes:
  register: Współczesna, godna i zrozumiała polszczyzna. „Mełły” jest poprawną formą czasu przeszłego użytego w konstrukcji przyszłej z „będą”; „żarna” dobrze odpowiadają realiom domowego mielenia. Markery przypisów umieszczono bezpośrednio przy odpowiednich wyrażeniach.
