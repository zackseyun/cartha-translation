review_pass:
  verdict: approve
  source_fidelity: Tekst wiernie oddaje żeński rodzaj liczby mnogiej imiesłowu ἀλήθουσαι przez „dwie kobiety”, czynność trwającą w scenie eschatologicznej przez „będą mełły” oraz kontrast μία ... καὶ μία jako „jedna ... a druga”. Strona bierna w „zostanie zabrana” i eliptycznym „[zostanie] pozostawiona” zachowuje sens παραλαμβάνεται i ἀφίεται, nie przesądzając ich wartości soteriologicznej lub sądowniczej. „Przy żarnach” jest trafnym, realioznawczo naturalnym oddaniem ἐν τῷ μύλῳ w tym kontekście.
  naturalness: Przekład brzmi współcześnie, jasno i godnie. Forma „będą mełły” jest poprawna i naturalna, a „przy żarnach” dobrze pasuje do domowego mielenia zboża. Konstrukcja „jedna zostanie zabrana, a druga pozostawiona” jest w polszczyźnie zrozumiała; opuszczenie powtórzonego „zostanie” jest stylistycznie dopuszczalne.
  terminology: Terminologia jest trafna i nie narzuca interpretacji. „Kobiety” właściwie ujawnia informację gramatyczną tekstu greckiego, „żarna” nie anachronizują realiów, a „zabrana” / „pozostawiona” pozostają teologicznie neutralne. Przypis a uczciwie wskazuje zakres μύλος, zaś przypis b właściwie zachowuje nierozstrzygniętą funkcję przeciwstawienia.
