source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: pl
  text: 'Nauczcie się przypowieści[a] od figowca: gdy jego gałąź już mięknie i wyrastają liście[b], wiecie, że lato[c] jest blisko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lub: „pouczenia” albo „porównania”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lub: „wypuszcza liście”.'
    reason: lexical_alternative
  - marker: c
    text: Greckie θέρος może oznaczać „lato”, a w niektórych kontekstach także porę żniw; tutaj obraz figowca przemawia za znaczeniem sezonowym.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: od figowca
  rationale: Przyimek ἀπό z dopełniaczem wskazuje źródło, z którego uczniowie mają zaczerpnąć pouczenie. Polski szyk „nauczcie się… od figowca” jest naturalniejszy niż zachowanie greckiego szyku początkowego. Łagodne δέ nie wymaga tutaj osobnego odpowiednika.
- source_word: μάθετε
  choice: nauczcie się
  rationale: Aorystyczny tryb rozkazujący wyraża bezpośrednie polecenie. „Nauczcie się” zachowuje czynność uczenia się, zamiast przesuwać sens ku samemu rezultatowi, jak „zrozumcie”.
- source_word: τὴν παραβολήν
  choice: tej przypowieści
  rationale: „Przypowieść” zachowuje utrwalony ewangeliczny odpowiednik παραβολή i pozostawia otwarty charakter następującego porównania.
- source_word: ὅταν ἤδη
  choice: gdy … już
  rationale: ὅταν wprowadza ogólną zależność czasową, a ἤδη wskazuje, że opisywana zmiana już się rozpoczyna. Rozdzielona polska konstrukcja oddaje oba elementy bez nadmiernej interpretacji.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: jego gałąź staje się już miękka
  rationale: γένηται oznacza zmianę stanu, a ἁπαλός miękkość lub delikatność młodego przyrostu. „Miękka” jest prostym i wiernym odpowiednikiem, bez dodawania pojęcia soczystości, którego tekst nie wyraża.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: i wypuszcza liście
  rationale: ἐκφύῃ opisuje wyrastanie lub wypuszczanie. „Wypuszcza liście” jest naturalnym współczesnym polskim określeniem rozwoju rośliny.
- source_word: γινώσκετε
  choice: wiecie
  rationale: Forma drugiej osoby liczby mnogiej jest tu oznajmująca i opisuje rozpoznanie znaku; nie należy jej zmieniać w dodatkowy rozkaz.
- source_word: ἐγγὺς τὸ θέρος
  choice: lato jest blisko
  rationale: W obrazie figowca θέρος najnaturalniej oznacza porę letnią. Polski zwrot „jest blisko” jasno oddaje ἐγγύς.
theological_decisions:
- issue: Znaczenie obrazu figowca
  choice: Obraz oddano jako sezonową przypowieść o rozpoznawaniu bliskości na podstawie widocznych oznak.
  alternative: Utożsamienie figowca w samym przekładzie z Izraelem albo wyraźne określenie go wyłącznie jako przypadkowego przykładu z natury.
  rationale: Werset przedstawia obserwowalne zjawisko i wynikający z niego wniosek, lecz sam nie objaśnia figowca jako symbolu określonej wspólnoty. Przekład nie powinien rozstrzygać szerszych interpretacji eschatologicznych.
translation_notes:
  register: Współczesny, godny i przystępny rejestr. Zachowano ewangeliczny termin „przypowieść”, prostą botaniczną obrazowość oraz liczbę mnogą w zwrocie do uczniów. Nie dodano interpretacji symbolicznej figowca.
