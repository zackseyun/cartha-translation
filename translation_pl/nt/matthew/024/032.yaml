- from: 'Nauczcie się tej przypowieści[a] od figowca: gdy jego gałąź staje się już miękka i wypuszcza liście[b], wiecie, że lato[c] jest blisko.'
  to: 'Nauczcie się przypowieści[a] od figowca: gdy jego gałąź już mięknie i wyrastają liście[b], wiecie, że lato[c] jest blisko.'
  rationale: Usunięto nieobecny w grece zaimek wskazujący „tej”. Zmieniono opis rozwoju rośliny tak, aby liście były podmiotem „wyrastają”, zgodnie z grecką konstrukcją, oraz wygładzono botaniczny idiom bez zmiany sensu. Przypisy zachowują właściwe alternatywy i ich kotwice.
