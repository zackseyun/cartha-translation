  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: pl
  text: Na początku[a] było Słowo, a Słowo było u Boga, a Bogiem było Słowo.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Sformułowanie „Na początku” nawiązuje do Rdz 1:1 i łączy Słowo z początkiem stworzenia.
    reason: cross_reference
  - marker: b
    text: 'Można objaśnić: „tym, czym był Bóg, było Słowo”. Grecki szyk może podkreślać naturę Słowa; ostatni człon nazywa Słowo Bogiem, nie utożsamiając go po prostu z Bogiem wspomnianym wcześniej. Przekład „Słowo było boskie” mógłby po polsku osłabić sens greckiego wyrażenia.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Na początku
  rationale: Naturalny polski odpowiednik, który zachowuje wyraźne nawiązanie do Rdz 1:1 i umieszcza Słowo u początku stworzenia.
- source_word: ἦν
  choice: było
  rationale: Imperfectum czasownika εἰμί najprościej oddaje „było”; powtórzenie zachowuje rytm i ciągłość greckiego zdania.
- source_word: ὁ λόγος
  choice: Słowo
  rationale: „Słowo” zachowuje zarówno sens wypowiedzi i objawienia, jak i osobowy charakter tego określenia w prologu Jana. „Logos” byłby mniej zrozumiały, a „Rozum” lub „Przesłanie” zawężałyby znaczenie.
- source_word: πρὸς τὸν θεόν
  choice: u Boga
  rationale: W tym kontekście „u Boga” naturalnie wyraża osobową bliskość i zarazem odrębność Słowa. Dosłowne „ku Bogu” byłoby w polszczyźnie zbyt mechaniczne i mogłoby sugerować jedynie kierunek.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Bogiem było Słowo
  rationale: Polski orzecznik rzeczownikowy przy łączniku „być” przyjmuje narzędnik. Zachowany szyk uwydatnia słowo „Bogiem” podobnie jak grecki szyk z θεός na początku zdania, a jednocześnie nie utożsamia osobowo Słowa z Bogiem wspomnianym wcześniej.
theological_decisions:
- issue: Oddanie bezrodzajnikowego orzecznika θεός w ostatnim członie
  choice: Bogiem było Słowo
  alternative: Słowo było boskie; tym, czym był Bóg, było Słowo
  rationale: 'Grecki szyk nadaje θεός przede wszystkim sens jakościowy: mówi, jaką naturę ma Słowo, zachowując odrębność między Słowem a Bogiem z poprzedniego członu. „Bogiem było Słowo” wiernie i naturalnie potwierdza pełnię tego orzeczenia. „Boskie” może po polsku znaczyć jedynie podobieństwo do Boga, natomiast druga alternatywa jest objaśnieniem, nie przekładem.'
translation_notes:
  register: Język współczesny, podniosły i zrozumiały. Zachowano zwięzły, trójczłonowy rytm oryginału oraz celowo uwydatniony szyk ostatniego członu. Wielka litera w „Słowo” sygnalizuje osobowe użycie tego tytułu w prologu.
