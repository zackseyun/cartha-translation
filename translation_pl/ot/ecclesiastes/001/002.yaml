  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: pl
  text: Tchnienie tchnień[a] — mówi Kohelet[b] — tchnienie tchnień; wszystko jest tylko tchnieniem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: tchnienie
  rationale: Hebrajskie słowo oznacza dosłownie tchnienie, oddech lub parę i w Księdze Koheleta przywołuje zarazem przemijanie, nieuchwytność oraz rozdźwięk między oczekiwaniem a rzeczywistością. Konkretne „tchnienie” zachowuje ten obraz i nie zawęża sensu do samej bezcelowości czy bezsensu.
- source_word: הֲבֵל הֲבָלִים
  choice: tchnienie tchnień
  rationale: Konstrukcja rzeczownika z jego liczbą mnogą wyraża hebrajski stopień najwyższy, podobnie jak w wyrażeniach „Pieśń nad pieśniami” czy „Święte Świętych”. Forma „tchnienie tchnień” zachowuje zarówno intensyfikację, jak i obraz źródłowy.
- source_word: אָמַר
  choice: mówi
  rationale: Choć forma hebrajska jest morfologicznie dokonana, w formule wprowadzającej ponadczasową wypowiedź naturalny polski czas teraźniejszy oddaje jej żywy, sentencjonalny charakter.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Utrwalona polska transliteracja hebrajskiego tytułu lub imienia zachowuje jego otwartość znaczeniową, zamiast rozstrzygać ją przez przekład „Nauczyciel” albo „Kaznodzieja”.
- source_word: הַכֹּל
  choice: wszystko
  rationale: Oddaje szeroki, całościowy zakres hebrajskiego wyrażenia.
- source_word: הָבֶל
  choice: tylko tchnieniem
  rationale: W orzeczniku partykuła „tylko” nadaje wypowiedzi oceniający i odzierający ze złudzeń ton; samo „jest tchnieniem” mogłoby brzmieć wyłącznie jak definicja substancji.
theological_decisions:
- issue: Jak oddać przewodni motyw הֶבֶל
  choice: Zachować konkretny obraz jako „tchnienie”, z objaśnieniem jego nakładających się sensów.
  alternative: marność; bezsens; daremność; przemijanie; absurd; para
  rationale: Abstrakcyjne odpowiedniki wybierają tylko jeden aspekt hebrajskiego słowa i mogą narzucać nihilistyczny lub moralizujący wniosek. Obraz tchnienia pozostawia otwarte obecne w księdze napięcie między krótkotrwałością, nieuchwytnością a zawodnością ludzkich oczekiwań.
- issue: Znaczenie określenia קֹהֶלֶת
  choice: Transliterować jako „Kohelet”.
  alternative: Nauczyciel; Kaznodzieja; Zgromadzający
  rationale: Znaczenie i funkcja tego określenia nie są całkowicie jednoznaczne; transliteracja nie rozstrzyga tej kwestii w samym tekście.
translation_notes:
  register: Współczesny, podniosły język poetycki. Myślniki wyodrębniają formułę „mówi Kohelet”, a wykrzyknik po powtórzonym superlatywie wzmacnia retoryczny impet bez dodawania nowej treści. „Tchnienie” jest celowo bardziej obrazowe niż tradycyjna „marność”, lecz pozostaje zrozumiałe i godne.
