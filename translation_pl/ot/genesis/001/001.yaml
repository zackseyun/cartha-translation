  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: pl
  text: Na początku, gdy Bóg stworzył niebo i ziemię[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Tradycyjnie oddaje się ten werset jako pełne zdanie: „Na początku Bóg stworzył niebo i ziemię”. Hebrajskie בְּרֵאשִׁית, bez rodzajnika, po którym następuje osobowa forma czasownika בָּרָא, można jednak naturalnie odczytać jako początek podrzędnego zdania czasowego, podobnie jak w Rdz 2:4b. W takim ujęciu zdaniem głównym są słowa wersetu 3: „Bóg powiedział: «Niech powstanie światło»”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Na początku, gdy … stwarzał
  rationale: Pozbawione rodzajnika בְּרֵאשִׁית, po którym następuje osobowa forma czasownika בָּרָא, można naturalnie rozumieć jako początek podrzędnego zdania czasowego. Sformułowanie zachowuje znaczenie רֵאשִׁית („początek”), a zarazem sygnalizuje składniową zależność wersetu.
- source_word: בָּרָא
  choice: stwarzał
  rationale: Czasownik „stwarzać” jest bezpośrednim i utrwalonym odpowiednikiem hebrajskiego ברא w odniesieniu do działania Boga. Aspekt niedokonany w polskim zdaniu czasowym naturalnie przedstawia czynność stanowiącą tło dalszej narracji, bez rozstrzygania mechanizmu stworzenia.
- source_word: אֱלֹהִים
  choice: Bóg
  rationale: Mimo morfologicznie mnogiej formy rzeczownika towarzyszący mu czasownik בָּרָא ma liczbę pojedynczą, dlatego chodzi tu o jednego Boga.
- source_word: אֵת
  choice: '[nieprzetłumaczone; znacznik dopełnienia bliższego]'
  rationale: Hebrajskie אֵת oznacza określone dopełnienie bliższe i nie ma osobnego odpowiednika w naturalnej polszczyźnie; jego funkcję oddają przypadek i szyk zdania.
- source_word: הַשָּׁמַיִם
  choice: niebo
  rationale: Hebrajskie שָׁמַיִם ma formę mnogą, lecz standardowym polskim określeniem sfery niebieskiej w tym kosmicznym zestawieniu jest liczba pojedyncza „niebo”. Razem z „ziemią” wyrażenie obejmuje całość stworzonego porządku.
- source_word: הָאָרֶץ
  choice: ziemię
  rationale: 'Choć אֶרֶץ może znaczyć także „kraj” lub „ląd”, w zestawieniu z niebem ma znaczenie kosmiczne: „ziemia”.'
theological_decisions:
- issue: Składnia zdania otwierającego
  choice: 'Podrzędne zdanie czasowe: „Na początku, gdy Bóg stwarzał niebo i ziemię—”'
  alternative: 'Samodzielne zdanie główne: „Na początku Bóg stworzył niebo i ziemię.”'
  rationale: Brak rodzajnika przy בְּרֵאשִׁית oraz następująca po nim osobowa forma בָּרָא sprzyjają odczytaniu czasowemu, podobnemu do Rdz 2:4b i Oz 1:2. Myślnik wskazuje, że wypowiedź prowadzi dalej, ku zdaniu głównemu w wersecie 3. Tradycyjne odczytanie jako pełnego zdania pozostaje podane w przypisie, aby zachować rzeczywistą niejednoznaczność tekstu.
translation_notes:
  register: Współczesna, godna i przystępna polszczyzna. „Niebo i ziemia” zachowuje tradycyjne, naturalne w języku polskim określenie całości stworzonego porządku. Myślnik sygnalizuje, że werset jest składniowo otwarty i łączy się z dalszym opisem.
