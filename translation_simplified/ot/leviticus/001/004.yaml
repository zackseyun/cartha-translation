  simplified_phrase: He must place his hand
  preserved_meaning: The worshiper is required to perform the physical ritual gesture.
  reasoning_layer_used: POB lexical decision for וְסָמַךְ
  rationale: “Must place” expresses the command in ordinary modern English without implying extra pressure.
- pob_phrase: the burnt offering
  simplified_phrase: the animal he is presenting as a burnt offering
  preserved_meaning: The animal is being offered as the whole burnt sacrifice.
  reasoning_layer_used: POB lexical decision for הָעֹלָה and immediate sacrificial context
  rationale: The added wording helps new readers understand that the offering has a head because it is an animal.
- pob_phrase: and it shall be accepted for him to make atonement on his behalf
  simplified_phrase: The offering will be accepted for him and will make atonement on his behalf
