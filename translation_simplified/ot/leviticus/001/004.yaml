translation:
  language: en
  text: He must place his hand on the head of the animal he is presenting as a burnt offering. The offering will be accepted for him and will make atonement on his behalf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “and he will be accepted.” The Hebrew may refer directly to the person rather than to the offering.
    reason: alternative_reading
