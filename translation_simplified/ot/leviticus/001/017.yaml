  text: He must tear the bird open at its wings, but he must not separate it into two pieces. Then the priest must burn it on the altar, on the wood over the fire. It is a burnt offering, a food offering[a] with an aroma pleasing to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire” or “a fire offering.”
    reason: lexical_alternative
