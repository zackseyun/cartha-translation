translation:
  language: en
  text: The person bringing the offering must slaughter the young bull before Yahweh. Then Aaron’s sons, the priests, must present the blood and throw it against the altar on every side.[a] The altar is at the entrance to the tent of meeting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “dash the blood”; traditionally, “sprinkle the blood.” The Hebrew describes throwing the blood as part of the ritual.
    reason: lexical_alternative
