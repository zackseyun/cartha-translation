translation:
  language: en
  text: He must slaughter the animal on the north side of the altar, in Yahweh’s presence. Then Aaron’s sons, the priests, must throw its blood against every side of the altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “dash its blood against every side of the altar.” The Hebrew describes forceful casting, not light sprinkling.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he shall slaughter it
  simplified_phrase: he must slaughter the animal
  preserved_meaning: The animal is to be killed as a required sacrificial act.
  reasoning_layer_used: Lexical decision for וְשָׁחַט and ritual instruction register
  rationale: “Must” states the required procedure clearly, while “slaughter” preserves the specific sacrificial action.
- pob_phrase: before Yahweh
  simplified_phrase: in Yahweh’s presence
  preserved_meaning: The sacrifice takes place before Yahweh in the worship setting.
  reasoning_layer_used: Lexical decision for לִפְנֵי יְהוָה and theological decision on the divine name
  rationale: This wording explains the cultic expression while retaining the name Yahweh.
- pob_phrase: against the altar all around
  simplified_phrase: against every side of the altar
  preserved_meaning: The blood is forcefully cast against the altar around its full extent.
  reasoning_layer_used: Lexical decisions for וְזָרְקוּ and עַל הַמִּזְבֵּחַ סָבִיב
  rationale: “Every side” makes the spatial meaning of “all around” immediately clear.
