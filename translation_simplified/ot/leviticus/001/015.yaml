translation:
  language: en
  text: The priest must bring the bird to the altar, pinch off its head,[a] and burn the head on the altar. He must drain the bird’s blood onto the side of the altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wring off its head.” The Hebrew uses a special term for how a priest killed a bird offering.
    reason: lexical_alternative
  - marker: b
    text: Literally “on the wall of the altar.”
    reason: lexical_alternative
