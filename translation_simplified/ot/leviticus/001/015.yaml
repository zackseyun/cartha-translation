  preserved_meaning: The priest is required to move the bird offering to the altar.
  reasoning_layer_used: POB lexical decisions for וְהִקְרִיבוֹ and אֶל הַמִּזְבֵּחַ
  rationale: “Must” states the ritual requirement naturally, and “the bird” makes the referent clear.
- pob_phrase: and pinch off its head and burn it on the altar
  simplified_phrase: pinch off its head, and burn the head on the altar
  preserved_meaning: The priest removes the bird’s head by the prescribed action and burns it on the altar.
  reasoning_layer_used: POB lexical decisions for וּמָלַק and וְהִקְטִיר
  rationale: Repeating “the head” removes an unclear pronoun while keeping the concrete ritual actions distinct.
- pob_phrase: and its blood shall be drained out on the side of the altar
  simplified_phrase: He must drain the bird’s blood onto the side of the altar
  preserved_meaning: The bird’s blood is drained so that it goes onto the altar’s side.
  reasoning_layer_used: POB lexical decisions for וְנִמְצָה and עַל קִיר הַמִּזְבֵּחַ
  rationale: An active sentence makes the required action and its destination easier to follow.
