translation:
  language: en
  text: He must wash the animal’s internal organs and legs with water. Then the priest must turn all of it into smoke on the altar. It is a burnt offering—a food offering presented through fire—and a pleasing aroma to Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he shall wash its entrails and its legs with water
  simplified_phrase: He must wash the animal’s internal organs and legs with water.
  preserved_meaning: The required washing of the animal’s inner parts and legs remains explicit.
  reasoning_layer_used: POB lexical decisions for קִרְבּוֹ, כְרָעָיו, and יִרְחַץ בַּמָּיִם
  rationale: “Internal organs” is clearer than “entrails,” while “must” naturally states the ritual requirement.
- pob_phrase: the priest shall turn all of it into smoke on the altar
  simplified_phrase: Then the priest must turn all of it into smoke on the altar.
  preserved_meaning: The priest causes everything prescribed in this prepared offering to go up in smoke.
  reasoning_layer_used: POB lexical decisions for וְהִקְטִיר and אֶת־הַכֹּל, bounded by the ritual context
  rationale: A separate sentence clarifies the sequence without overstating what “all of it” includes.
- pob_phrase: a burnt offering, a food offering, a pleasing aroma to Yahweh
  simplified_phrase: It is a burnt offering—a food offering presented through fire—and a pleasing aroma to Yahweh.
  preserved_meaning: The offering categories and the metaphor of divine acceptance remain distinct.
  reasoning_layer_used: POB lexical and theological decisions for עֹלָה, אִשֵּׁה, רֵיחַ נִיחוֹחַ, and יְהוָה
  rationale: The wording explains how the food offering is presented while preserving the aroma image and divine name.
interpretive_expansions:
- pob_phrase: a food offering
  rendering: a food offering presented through fire
  claim: Fire is the means by which the food offering is presented.
  evidence:
  - The POB lexical rationale describes אִשֵּׁה as a food gift or offering presented by fire.
  confidence: high
  alternatives_preserved:
  - a food offering
  - an offering by fire
  - a fire offering
translation_notes:
  risk_flags:
  - risk: “All of it” may leave its precise scope implicit.
    mitigation: This preserves the Hebrew wording and avoids wrongly including parts removed during preparation.
  - risk: “Food offering” could suggest that Yahweh needs food.
    mitigation: “Presented through fire” keeps the term within its sacrificial setting without asserting divine need.
