translation:
  language: en
  text: Then Moses took the ram's breast and waved it as a wave offering in Yahweh's presence. This was the share assigned to Moses from the ram used in the ordination ceremony.[a] Moses did this just as Yahweh had commanded him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the ram used in the consecration ceremony.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: waved it as a wave offering before Yahweh
  simplified_phrase: waved it as a wave offering in Yahweh's presence
  preserved_meaning: Moses performed the ritual waving and presented the portion to Yahweh as the named wave offering.
  reasoning_layer_used: POB lexical decisions for וַיְנִיפֵהוּ תְנוּפָה and לִפְנֵי יְהוָה
  rationale: This keeps the technical ritual term while making “before Yahweh” immediately clear.
- pob_phrase: It was Moses' portion
  simplified_phrase: This was the share assigned to Moses
  preserved_meaning: The sacrificial breast belonged to Moses as his designated share.
  reasoning_layer_used: POB lexical decision for לְמֹשֶׁה הָיָה לְמָנָה
  rationale: “Share assigned to Moses” clearly expresses an allotted portion.
- pob_phrase: just as Yahweh had commanded Moses
  simplified_phrase: Moses did this just as Yahweh had commanded him
  preserved_meaning: Moses followed Yahweh's earlier command exactly.
  reasoning_layer_used: POB lexical decision for כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  rationale: A separate sentence makes the command and Moses' obedience easier to follow.
