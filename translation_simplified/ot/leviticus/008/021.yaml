translation:
  language: en
  text: Moses washed the ram’s internal organs and legs with water. Then he burned the whole ram on the altar. It was a burnt offering and a food offering[a] to Yahweh, with an aroma pleasing to him. Moses did this just as Yahweh had commanded him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He washed the entrails and the legs with water
  simplified_phrase: Moses washed the ram’s internal organs and legs with water
  preserved_meaning: Moses washed the animal’s inner parts and legs as part of the sacrifice.
  reasoning_layer_used: Lexical decisions for קֶּרֶב, כְּרָעַיִם, and רָחַץ בַּמָּיִם
  rationale: “Internal organs” is clearer than “entrails,” and naming Moses and the ram makes the participants explicit.
- pob_phrase: Moses burned the whole ram on the altar
  simplified_phrase: Then he burned the whole ram on the altar
  preserved_meaning: The entire ram was burned as the sacrifice on the altar.
  reasoning_layer_used: Applied revision and lexical decisions for וַיַּקְטֵר and כָּל הָאַיִל
  rationale: The short new sentence keeps the full-sacrifice action while making the sequence easy to follow.
- pob_phrase: just as Yahweh had commanded Moses
  simplified_phrase: Moses did this just as Yahweh had commanded him
  preserved_meaning: Moses carried out the sacrifice in exact obedience to Yahweh’s instruction.
  reasoning_layer_used: Lexical decision for כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  rationale: “Did this” connects the command directly to the actions in the verse.
interpretive_expansions:
- pob_phrase: for a pleasing aroma
  rendering: with an aroma pleasing to him
  claim: The aroma is presented as pleasing to Yahweh.
  evidence:
  - The phrase לְרֵיחַ נִיחֹחַ describes the sacrifice as acceptable or pleasing before God.
  - The immediate clause identifies Yahweh as the recipient of the offering.
  confidence: high
  alternatives_preserved:
  - for a pleasing aroma
  - for a soothing aroma
translation_notes:
  risk_flags:
