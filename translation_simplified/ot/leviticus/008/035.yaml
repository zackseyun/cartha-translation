simplification_decisions:
- pob_phrase: you shall stay at the entrance of the tent of meeting day and night for seven days
  simplified_phrase: You must remain at the entrance of the tent of meeting day and night for seven days.
  preserved_meaning: The priests must stay continuously at the sanctuary entrance for the full seven days.
  reasoning_layer_used: POB lexical decisions for תֵּשְׁבוּ, יוֹמָם וָלַיְלָה, and שִׁבְעַת יָמִים
  rationale: “Must remain” expresses the continuing command in natural English.
- pob_phrase: keep the charge of Yahweh
  simplified_phrase: Carry out the duty Yahweh requires
  preserved_meaning: They must perform Yahweh’s prescribed ritual duty.
  reasoning_layer_used: POB lexical decision for שׁמר + משמרת and theological decision for יְהוָה
  rationale: “Carry out the duty” clarifies the opaque phrase without adding a personal assignment claim.
- pob_phrase: for so I have been commanded
  simplified_phrase: For this is what I was commanded.
  preserved_meaning: Moses explains that these specific instructions are the command he received.
  reasoning_layer_used: POB lexical decision for כִּי כֵן צֻוֵּיתִי
  rationale: The wording preserves both the explanation and its link to the preceding procedure.
