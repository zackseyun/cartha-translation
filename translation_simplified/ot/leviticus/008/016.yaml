  preserved_meaning: The designated fat came from the animal's inner organs.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר עַל הַקֶּרֶב
  rationale: Internal organs is more widely understood than entrails while preserving the anatomy.
- pob_phrase: the two kidneys and their fat
