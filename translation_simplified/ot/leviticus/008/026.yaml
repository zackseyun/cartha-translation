translation:
  language: en
  text: From the basket of bread made without yeast that stood before Yahweh, he took one cake made without yeast, one bread cake with oil[a], and one thin flatbread. He placed them on the fat portions and on the right thigh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one bread cake mixed with oil.” The Hebrew does not specify exactly how the oil was used.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the basket of unleavened bread that was before Yahweh
  simplified_phrase: the basket of bread made without yeast that stood before Yahweh
  preserved_meaning: The basket contained unleavened bread and was presented in Yahweh’s presence.
  reasoning_layer_used: Lexical decisions for הַמַּצּוֹת and לִפְנֵי יְהוָה, with the theological decision for Yahweh
  rationale: This explains “unleavened” while clearly attaching the location phrase to the basket.
- pob_phrase: one cake of bread with oil
  simplified_phrase: one bread cake with oil[a]
  preserved_meaning: The bread was associated with oil, but the exact preparation method remains uncertain.
  reasoning_layer_used: Lexical decision for חַלַּת לֶחֶם שֶׁמֶן אַחַת
  rationale: The noncommittal wording and footnote preserve the Hebrew’s uncertainty.
- pob_phrase: one wafer
  simplified_phrase: one thin flatbread
  preserved_meaning: The item was a thin bread used in the offering.
  reasoning_layer_used: Lexical decision for רָקִיק אֶחָד
  rationale: “Thin flatbread” avoids the misleading modern non-bread sense of “wafer.”
translation_notes:
