translation:
  language: en
  text: Take Aaron together with his sons, along with the garments, the anointing oil, the bull for the sin offering,[a] the two rams, and the basket of bread made without yeast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the bull for the purification offering.” The Hebrew term can refer to an offering associated with both sin and ritual purification.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Aaron and his sons with him
  simplified_phrase: Aaron together with his sons
  preserved_meaning: Aaron and his sons are all included in the command.
  reasoning_layer_used: Lexical decision for בָּנָיו אִתּוֹ
  rationale: “Together with” makes the relationship clear without dropping the Hebrew phrase “with him.”
- pob_phrase: and the garments, and the anointing oil, and the bull ...
  simplified_phrase: along with the garments, the anointing oil, the bull ...
  preserved_meaning: Every required person and ritual item remains part of the command.
  reasoning_layer_used: Source syntax and listed lexical decisions
  rationale: One introductory phrase replaces repeated conjunctions while preserving the full list.
- pob_phrase: basket of unleavened bread
  simplified_phrase: basket of bread made without yeast
  preserved_meaning: The basket contains bread prepared without leaven.
  reasoning_layer_used: Lexical decision for סַל הַמַּצּוֹת
  rationale: The plain description explains “unleavened” for readers unfamiliar with the term.
