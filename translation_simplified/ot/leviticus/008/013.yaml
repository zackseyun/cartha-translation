  text: Then Moses brought Aaron’s sons forward.[a] He dressed them in tunics, wrapped a priestly sash around each of them, and fastened a priestly cap on each one. He did this just as Yahweh[b] had commanded Moses.
  philosophy: optimal-equivalence
