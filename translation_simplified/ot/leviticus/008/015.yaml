translation:
  language: en
  text: He slaughtered it. Then Moses used his finger to put some of the blood on each of the altar’s horns. In this way he purified the altar.[a] He poured out the blood at the base of the altar and consecrated it to make atonement for it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “cleansed the altar.” This refers to ritual purification.
    reason: lexical_alternative
  - marker: b
    text: Or “to purge it.” The Hebrew describes sacrificial purification and atonement.
    reason: lexical_alternative
