translation:
  language: en
  text: Moses said to Aaron and his sons, “Boil the meat at the entrance to the tent of meeting. Eat it there with the bread from the basket of ordination offerings.[a] Do this just as I commanded when I said, ‘Aaron and his sons are to eat it.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the basket of consecration offerings.” The Hebrew term refers to offerings used when the priests were installed in their office.
    reason: lexical_alternative
