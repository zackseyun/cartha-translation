translation:
  language: en
  text: He dressed him in the tunic, wrapped the sash around his waist, and put the robe on him. Then he put the ephod—a special priestly garment—on him. He fastened the ephod on him with its skillfully woven band,[a] using the band to tie it in place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “decorated band” or “waistband.”
    reason: lexical_alternative
