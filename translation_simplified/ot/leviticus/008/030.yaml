translation:
  language: en
  text: Then Moses took some of the anointing oil and some of the blood from the altar. He sprinkled the oil and blood on Aaron and his garments, and on the sons who were there with him and their garments. In this way, Moses consecrated Aaron and his garments, along with the sons who were with him and their garments, setting them apart as holy for priestly service.
