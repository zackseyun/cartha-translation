translation:
  language: en
  text: If anyone turns to mediums or spiritists[a], they are unfaithful to me by following them, like a spouse who prostitutes themselves. I will set my face against that person and cut them off[b] from among their people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mediums and spiritists are people who claim to consult the dead or other spirits.
    reason: simplification_note
  - marker: b
    text: The exact form of the judgment described as “cut off” is not specified here.
    reason: alternative_reading
