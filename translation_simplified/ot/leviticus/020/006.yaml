  rationale: The conditional opening states the legal case in natural modern English.
- pob_phrase: to prostitute himself after them
  simplified_phrase: they are unfaithful to me by following them, like a spouse who prostitutes themselves
  preserved_meaning: Seeking these practitioners is pictured as severe covenantal and spiritual unfaithfulness.
  reasoning_layer_used: Lexical and theological decisions for לִזְנוֹת אַחֲרֵיהֶם
  rationale: The simile explains the metaphor while preserving its sexual force.
- pob_phrase: I will set my face against that person and cut him off from among his people
