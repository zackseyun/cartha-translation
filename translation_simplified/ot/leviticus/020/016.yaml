  reasoning_layer_used: POB lexical and theological decisions for לְרִבְעָה אֹתָהּ
  rationale: “Have sex with it” states the contextual meaning directly and avoids a reproductive sense.
- pob_phrase: you shall kill the woman and the animal
  simplified_phrase: both the woman and the animal must be killed
  preserved_meaning: The law requires the death of both the woman and the animal.
  reasoning_layer_used: POB lexical and theological decisions for וְהָרַגְתָּ
  rationale: The passive wording reads naturally while retaining the command’s full force.
