translation:
  language: en
  text: If a woman comes near any animal to have sex with it, both the woman and the animal must be killed. They must certainly be put to death. Their blood is on them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This legal expression means that responsibility for the death penalty rests on them.
    reason: simplification_note
