translation:
  language: en
  text: You must not uncover the nakedness of your mother’s sister or your father’s sister—that is, you must not have sexual relations with either of them. The man who does this has laid bare his own flesh—his close relative. They will bear their iniquity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bear their iniquity” may include bearing their guilt or its consequences.
    reason: lexical_alternative
