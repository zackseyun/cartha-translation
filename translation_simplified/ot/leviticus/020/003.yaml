translation:
  language: en
  text: I myself will set my face against that man—that is, I will oppose him—and cut him off from among his people. I will do this because he has given some of his children to Molech.[a] He does this to defile my sanctuary and to treat my holy name as unholy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has sacrificed some of his children to Molech.” The Hebrew literally says “has given,” while the wider context indicates sacrifice.
    reason: lexical_alternative
