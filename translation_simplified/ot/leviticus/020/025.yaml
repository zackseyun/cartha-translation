translation:
  language: en
  text: So you must distinguish clean animals from unclean ones,[a] and unclean birds from clean ones. Do not make yourselves detestable through any animal, bird, or creature that crawls on the ground that I have designated as unclean for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “clean” and “unclean” are ritual categories God gave Israel, not statements about hygiene.
    reason: cultural_note
simplification_decisions:
- pob_phrase: distinguish between the clean animal and the unclean
  simplified_phrase: distinguish clean animals from unclean ones
  preserved_meaning: Israel must recognize and follow the prescribed clean and unclean categories.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast uses ordinary English while retaining the covenantal categories.
- pob_phrase: by anything that creeps on the ground
  simplified_phrase: through any ... creature that crawls on the ground
  preserved_meaning: Ground-moving creatures can be the means by which the people make themselves detestable.
  reasoning_layer_used: lexical decision for רמשׂ and the instrumental preposition
  rationale: “Crawls” is clearer today while preserving the close-to-the-ground image.
- pob_phrase: which I have set apart for you as unclean
  simplified_phrase: that I have designated as unclean for you
  preserved_meaning: God assigned these creatures to Israel's unclean category.
  reasoning_layer_used: lexical decision for בדל and לְטַמֵּא
  rationale: “Designated” states the classificatory sense more directly.
translation_notes:
  risk_flags:
  - risk: “Detestable” may sound like a general moral judgment rather than the source verb's distinct abhorrence language.
    mitigation: The wording is retained to avoid confusing it with the separate Hebrew category of becoming unclean.
  - risk: Modern readers may mistake “clean” and “unclean” for sanitary labels.
    mitigation: The footnote identifies them as Israel's ritual categories.
