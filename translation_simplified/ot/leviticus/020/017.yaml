translation:
  language: en
  text: If a man takes his sister[a]—whether she shares his father, his mother, or both—and they see each other’s nakedness, this is a disgrace. They must be cut off[b] before their people. He has uncovered his sister’s nakedness and must bear his guilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “takes” may imply taking her sexually or as a wife; the Hebrew does not specify further.
    reason: lexical_alternative
  - marker: b
    text: “Cut off” does not specify whether the penalty is death, expulsion, or another form of removal.
    reason: alternative_reading
