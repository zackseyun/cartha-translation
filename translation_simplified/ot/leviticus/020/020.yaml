translation:
  language: en
  text: If a man has sexual relations with his aunt, he has “uncovered his uncle’s nakedness”—that is, he has violated a forbidden family sexual boundary. Both of them must bear their sin,[a] and they will die childless.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “bear their guilt.” The Hebrew can refer either to the sin or to the guilt they bear for it.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew states the outcome but does not explain how or when they become childless.
    reason: simplification_note
