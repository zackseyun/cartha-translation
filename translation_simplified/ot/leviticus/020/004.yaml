translation:
  language: en
  text: But if the people of the community deliberately look the other way when that man gives any of his children to Molech,[a] so that they do not put him to death,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Molech may be the name of a deity or a child-sacrifice rite. Some instead read “the king.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the people of the land
  simplified_phrase: the people of the community
  preserved_meaning: The phrase refers to the local populace, not a social class.
  reasoning_layer_used: POB lexical rationale for עַם הָאָרֶץ
  rationale: “Community” clearly identifies the people collectively responsible for acting.
- pob_phrase: deliberately close their eyes to that man
  simplified_phrase: deliberately look the other way
  preserved_meaning: The people intentionally ignore the man and refuse to act against him.
  reasoning_layer_used: POB lexical decision for הַעְלֵם יַעְלִימוּ and the eye idiom
  rationale: This familiar expression preserves both intentional avoidance and the eye image.
- pob_phrase: some of his offspring
  simplified_phrase: any of his children
  preserved_meaning: The law applies when the man gives a child of his, without specifying an exact number.
  reasoning_layer_used: POB lexical rationale for the partitive מִזַּרְעוֹ
  rationale: “Any of his children” is natural English and preserves the indefinite scope.
translation_notes:
  risk_flags:
  - risk: Molech’s precise identity is uncertain.
    mitigation: The footnote preserves the deity, rite, and “the king” possibilities while retaining POB’s main reading.
