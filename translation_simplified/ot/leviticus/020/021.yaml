translation:
  language: en
  text: If a man takes his brother’s wife for himself, their union is impure. By having sexual relations with her, he has uncovered his brother’s nakedness. The two of them will be childless.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says they will be childless but does not say how this judgment will happen.
    reason: alternative_reading
