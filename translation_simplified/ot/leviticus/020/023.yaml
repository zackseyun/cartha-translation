translation:
  language: en
  text: Do not follow the established practices of the nation I am driving out before you, because they did all these things and I loathed them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall not walk in the statutes
  simplified_phrase: Do not follow the established practices
  preserved_meaning: Israel must not adopt the nation's fixed patterns of conduct.
  reasoning_layer_used: POB lexical decisions for תֵלְכוּ and בְּחֻקֹּת
  rationale: “Follow the established practices” makes the conduct image clear while preserving the settled force of the statutes.
- pob_phrase: the nation that I am driving out before you
  simplified_phrase: the nation I am driving out before you
  preserved_meaning: God is expelling the Canaanite population from Israel's presence.
  reasoning_layer_used: POB lexical decisions for מְשַׁלֵּחַ and מִפְּנֵיכֶם
  rationale: Dropping the relative pronoun makes the clause more direct without weakening the expulsion language.
- pob_phrase: because they did all these things, and I loathed them
  simplified_phrase: because they did all these things and I loathed them
  preserved_meaning: Their prohibited conduct is explicitly given as the reason for the command and God's strong moral revulsion.
  reasoning_layer_used: POB lexical and theological decisions for כִּי and וָאָקֻץ
  rationale: Keeping “because” preserves the explicit causal connection while “loathed” retains the Hebrew's force.
translation_notes:
