translation:
  language: en
  text: If a man or woman acts as a medium or spiritist,[a] that person must certainly be put to death by stoning. Their blood is on them; they are responsible for their own death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first Hebrew term may also refer to a spirit associated with consulting the dead; the second has traditionally been translated “wizard.”
    reason: lexical_alternative
