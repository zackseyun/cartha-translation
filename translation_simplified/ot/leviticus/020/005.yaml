translation:
  language: en
  text: Then I myself will turn my face against that man and his family. I will cut off[b] from among their people both that man and everyone who follows his example, prostituting themselves spiritually[a] by going after Molech.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses sexual unfaithfulness as a picture of abandoning faithfulness to God for idolatry.
    reason: lexical_alternative
  - marker: b
    text: “Cut off” is a covenant-judgment expression; this verse does not say whether it means death, expulsion, or another form of divine removal.
    reason: lexical_alternative
