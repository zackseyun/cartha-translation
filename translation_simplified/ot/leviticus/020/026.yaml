simplification_decisions:
- pob_phrase: You shall be holy to me
  simplified_phrase: You are to be holy to me
  preserved_meaning: Israel is required to be holy in covenant relationship to Yahweh.
  reasoning_layer_used: Lexical decisions for וִהְיִיתֶם, לִי, and קְדֹשִׁים
  rationale: “Are to be” makes the requirement natural while “to me” preserves covenant relationship.
- pob_phrase: and I have separated you
  simplified_phrase: I have separated you
  preserved_meaning: Yahweh’s completed act of separation remains distinct from the command to be holy.
  reasoning_layer_used: Lexical decision for וָאַבְדִּל and theological holiness decision
  rationale: A new sentence clarifies the thought without merging holiness with separation.
- pob_phrase: to be mine
  simplified_phrase: so that you will belong to me
  preserved_meaning: Yahweh separated Israel for the purpose and result of covenant possession.
  reasoning_layer_used: Lexical decision for לִהְיוֹת לִי
  rationale: The expanded clause expresses covenant belonging in ordinary modern English.
interpretive_expansions:
- pob_phrase: from the peoples
  rendering: from the other peoples
  claim: The peoples are groups distinct from Israel.
  evidence:
  - The immediate contrast is between Israel and the peoples from whom Yahweh separated them.
  - The POB lexical rationale identifies “other” as implied by context.
  confidence: high
  alternatives_preserved:
  - from the peoples
  - from the nations
translation_notes:
  risk_flags:
  - risk: “To me” is less conversational than “for me.”
    mitigation: It is retained because it preserves covenant relationship rather than suggesting service performed for Yahweh.
