translation:
  language: en
  text: You are to be holy to me, because I, Yahweh, am holy. I have separated you from the other peoples so that you will belong to me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peoples” can also be translated “nations.”
