translation:
  language: en
  text: A priest must not make himself ritually unclean for his wife among his own people,[a] and so profane himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may instead mean, “He must not make himself unclean as a chief man among his people, and so profane himself.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He shall not defile himself
  simplified_phrase: A priest must not make himself ritually unclean
  preserved_meaning: The prohibition concerns a priest incurring impurity through contact with the dead.
  reasoning_layer_used: Lexical decision for יִטַּמָּא and immediate priestly context
  rationale: This makes the ritual sense of “defile” clear without weakening the command.
- pob_phrase: as a husband among his people
  simplified_phrase: for his wife among his own people
  preserved_meaning: The controlling reading forbids a priest from incurring corpse impurity for his wife within his kin-group.
  reasoning_layer_used: Lexical and theological decisions for בַּעַל בְּעַמָּיו
  rationale: This states the relational meaning directly while preserving the difficult alternative in the footnote.
- pob_phrase: and so profane himself
  simplified_phrase: and so profane himself
  preserved_meaning: The resulting ritual impurity would profane the priest himself.
  reasoning_layer_used: Lexical decision for לְהֵחַלּוֹ and grounding review
  rationale: Retaining this wording preserves both the personal object and the result-or-purpose connection.
