translation:
  language: en
  text: He must not make his offspring unholy among his people,[a] because I am Yahweh, who makes him holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, breaking the marriage restrictions would bring unholiness upon his family line within his people.
    reason: cultural_note
simplification_decisions:
- pob_phrase: shall not profane
  simplified_phrase: must not make ... unholy
  preserved_meaning: The priest must not make what belongs to a holy line profane or common.
  reasoning_layer_used: Lexical decision for יְחַלֵּל and the priestly holiness context.
  rationale: The plain phrase explains the cultic meaning of “profane” while preserving its force.
- pob_phrase: his offspring
  simplified_phrase: his offspring
  preserved_meaning: The prohibition concerns the priest’s children or family line.
  reasoning_layer_used: Lexical decision for זַרְעוֹ and the documented theological ambiguity.
  rationale: Retaining “offspring” avoids narrowing the wording to priestly disqualification alone.
- pob_phrase: who sanctifies him
  simplified_phrase: who makes him holy
  preserved_meaning: Yahweh is the one who sets the priest apart as holy.
  reasoning_layer_used: Lexical decision for מְקַדְּשׁוֹ.
  rationale: “Makes him holy” states the same holiness concept in common English.
translation_notes:
  risk_flags:
