translation:
  language: en
  text: They must be holy—set apart for their God. They must not treat their God's name as unholy, because they present Yahweh's food offerings, the food of their God.[a] For this reason, they must be holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Yahweh's offerings by fire, the bread of their God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They shall be holy to their God
  simplified_phrase: They must be holy—set apart for their God
  preserved_meaning: They are required to be holy in their relationship to God.
  reasoning_layer_used: Lexical decisions for קְדֹשִׁים, יִהְיוּ, and לֵאלֹהֵיהֶם
  rationale: “Must” makes the legal force clear, while “set apart” explains “holy” without replacing it.
- pob_phrase: shall not profane the name of their God
  simplified_phrase: must not treat their God's name as unholy
  preserved_meaning: They must not violate the holiness of God's name.
  reasoning_layer_used: Lexical decision for יְחַלְּלוּ and the holiness contrast
  rationale: The wording replaces the less familiar verb “profane” while preserving the holy-versus-common contrast.
- pob_phrase: therefore they shall be holy
  simplified_phrase: For this reason, they must be holy
  preserved_meaning: Their priestly offering role grounds the repeated requirement of holiness.
  reasoning_layer_used: Lexical rationale for וְהָיוּ קֹדֶשׁ
  rationale: The shorter sentence states the verse's conclusion in ordinary English.
interpretive_expansions:
- pob_phrase: holy to their God
  rendering: holy—set apart for their God
  claim: Here holiness includes being set apart for God.
  evidence:
  - The lexical decision lists “set apart” as a supported sense of קְדֹשִׁים.
  - The verse connects holiness with presenting God's offerings.
  confidence: high
  alternatives_preserved:
  - holy to their God
  - consecrated to their God
translation_notes:
  risk_flags:
