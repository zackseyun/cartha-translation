translation:
  language: en
  text: However, because he has a physical defect, he must not go in as far as the sanctuary veil or approach the altar, so that he does not treat my holy places as common.[a] For I am Yahweh, who makes them holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This physical defect disqualifies him from this priestly service; it is not a moral fault.
    reason: simplification_note
simplification_decisions:
- pob_phrase: go in to the veil
  simplified_phrase: go in as far as the sanctuary veil
  preserved_meaning: He may not enter the inner area marked by the sanctuary curtain.
  reasoning_layer_used: POB lexical decision for הַפָּרֹכֶת and immediate sanctuary context
  rationale: The added wording identifies the veil and clarifies the restricted movement.
- pob_phrase: profane my sanctuaries
  simplified_phrase: treat my holy places as common
  preserved_meaning: He must not violate the holy status of Yahweh’s sacred places.
  reasoning_layer_used: POB lexical decisions for יְחַלֵּל and מִקְדָּשַׁי
  rationale: This explains the holy-versus-common contrast while preserving the plural.
- pob_phrase: who sanctifies them
  simplified_phrase: who makes them holy
  preserved_meaning: Yahweh gives the holy places their sacred status.
  reasoning_layer_used: POB lexical and theological decisions for מְקַדְּשָׁם
  rationale: The common wording keeps “them” tied to the plural holy places.
interpretive_expansions:
- pob_phrase: there is a defect in him
  rendering: he has a physical defect
  claim: The defect is bodily and concerns qualification for priestly approach, not moral guilt.
  evidence:
  - The POB lexical rationale identifies מוּם as a physical defect that disqualifies in this law.
  - The POB theological decision distinguishes ritual qualification from moral impurity.
  confidence: high
  alternatives_preserved:
  - blemish
translation_notes:
  risk_flags:
  - risk: Modern readers may take “physical defect” as implying moral fault or lesser worth.
    mitigation: The footnote limits the restriction to this priestly service and denies moral blame.
