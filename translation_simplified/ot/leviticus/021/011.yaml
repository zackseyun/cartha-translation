translation:
  language: en
  text: He must not go near any dead body. He must not make himself unclean, even when the dead person is his father or mother.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unclean” here means ritually unclean under Israel’s priestly law, not necessarily morally guilty.
    reason: simplification_note
