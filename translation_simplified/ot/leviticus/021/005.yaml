simplification_decisions:
- pob_phrase: They shall not make a bald patch on their head
  simplified_phrase: They must not make bald patches on their heads
  preserved_meaning: The prohibition concerns deliberately producing bald areas without specifying how.
  reasoning_layer_used: POB lexical decisions for יקרחה ... קָרְחָה and בְּרֹאשָׁם
  rationale: “Must not” is direct modern English, and plural “heads” expresses the distributive sense naturally.
- pob_phrase: nor shave off the edge of their beard, nor make cuts in their flesh
  simplified_phrase: They must not shave off the edges of their beards, or make cuts in their flesh
  preserved_meaning: The prohibitions against removing beard edges and cutting the body remain distinct.
  reasoning_layer_used: POB lexical decisions for פְאַת זְקָנָם, יְגַלֵּחוּ, and יִשְׂרְטוּ שָׂרָטֶת
  rationale: A new sentence and plural body terms make the commands easier to follow without changing their scope.
translation_notes:
  risk_flags:
  - risk: “Edges” does not identify one exact beard-grooming pattern.
    mitigation: The wording preserves the Hebrew term’s breadth, and the footnote gives “corners” as an alternative.
  - risk: Readers may connect these acts with mourning even though this verse does not say so.
    mitigation: The translation does not add “for the dead,” following the POB theological decision.
