translation:
  language: en
  text: They must not make bald patches on their heads. They must not shave off the edges of their beards,[a] or make cuts in their flesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the corners of their beards.” The Hebrew word can mean an edge, side, or corner.
