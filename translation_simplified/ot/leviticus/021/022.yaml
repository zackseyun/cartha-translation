translation:
  language: en
  text: He may eat the food portions that belong to his God, whether they come from the most holy offerings or the holy offerings.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the bread of his God”; here “bread” means the priest’s food portions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the food of his God
  simplified_phrase: the food portions that belong to his God
  preserved_meaning: The priest may receive the sacred food assigned from what belongs to his God.
  reasoning_layer_used: Lexical decision for לֶחֶם and its sacrificial context
  rationale: “Food portions” makes the legal-sacrificial sense clear without limiting the food to bread.
- pob_phrase: from the most holy things and from the holy things
  simplified_phrase: whether they come from the most holy offerings or the holy offerings
  preserved_meaning: Permission includes both legally distinct grades of sacred portions.
  reasoning_layer_used: Lexical decisions for both קדש expressions
  rationale: “Offerings” identifies the ritual categories while preserving their distinction.
- pob_phrase: He may eat
  simplified_phrase: He may eat
  preserved_meaning: The law grants permission rather than predicting or commanding the action.
  reasoning_layer_used: Theological decision on the legal imperfect יֹאכֵל
  rationale: Retaining “may” protects the verse’s contrast between priestly restriction and continued permission.
