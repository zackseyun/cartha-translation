translation:
  language: en
  text: A male descendant of Aaron the priest who has a bodily defect must not come forward to present Yahweh’s food offerings.[a] Because he has a defect, he must not come forward to present the bread of his God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “offerings by fire to Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Bread of his God” is a priestly expression for food presented to God as a sacrifice.
    reason: lexical_alternative
