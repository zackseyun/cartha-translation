  rationale: The wording replaces the awkward “from the offspring” while retaining the male priestly context and universal prohibition.
- pob_phrase: shall come near to offer
  simplified_phrase: must not come forward to present
  preserved_meaning: The man is prohibited from approaching to perform the sacrificial act.
  reasoning_layer_used: lexical decisions for יִגַּשׁ and לְהַקְרִיב
  rationale: “Must not” states the legal force clearly, and “come forward” preserves the act of approaching for service.
- pob_phrase: the food offerings of Yahweh
