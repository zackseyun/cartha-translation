translation:
  language: en
  text: If a priest’s daughter makes herself unholy by prostituting herself, she also profanes her father. She must be burned with fire.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And the daughter of a priest, if she profanes herself by prostituting herself
  simplified_phrase: If a priest’s daughter makes herself unholy by prostituting herself
  preserved_meaning: Her prostitution violates the holiness required by this priestly law.
  reasoning_layer_used: Lexical and theological decisions on חלל and זנה
  rationale: Ordinary sentence order and “unholy” clarify the holiness sense while keeping the specific conduct.
- pob_phrase: profanes her father
  simplified_phrase: she also profanes her father
  preserved_meaning: Her conduct desecrates the priestly holiness associated with her father.
  reasoning_layer_used: Theological decision on priestly holiness vocabulary
  rationale: “Profanes” retains the verse’s deliberate holiness-language link.
- pob_phrase: she shall be burned with fire
  simplified_phrase: She must be burned with fire.
  preserved_meaning: The law prescribes burning as her penalty.
  reasoning_layer_used: Lexical decisions on תִּשָּׂרֵף and בָּאֵשׁ
  rationale: “Must” states the legal requirement in clear modern English.
translation_notes:
  risk_flags:
  - risk: “Profanes” may still be unfamiliar to some readers.
    mitigation: The preceding phrase “makes herself unholy” supplies its holiness context.
  - risk: “Prostituting herself” may sound occupational to some readers.
    mitigation: The verbal wording presents conduct rather than saying she becomes a prostitute.
