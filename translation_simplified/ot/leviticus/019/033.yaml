translation:
  language: en
  text: When a foreigner is living among you in your land, do not mistreat him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean, “Do not oppress him” or “Do not wrong him.”
    reason: lexical_alternative
  - marker: b
    text: Here “foreigner” means a non-native resident living among the people of Israel, not a visitor passing through.
    reason: cultural_note
simplification_decisions:
- pob_phrase: resides with you
  simplified_phrase: is living among you
  preserved_meaning: The foreigner is a non-native resident within the community.
  reasoning_layer_used: Lexical decisions for יָגוּר and אִתְּךָ
  rationale: Common wording preserves both ongoing residence and life within the community.
- pob_phrase: you shall not mistreat him
  simplified_phrase: do not mistreat him
  preserved_meaning: Israel must not wrong, oppress, or otherwise abuse the foreign resident.
  reasoning_layer_used: Lexical decision for לֹא תוֹנוּ
  rationale: The direct command is made natural without weakening the broad legal prohibition.
translation_notes:
  risk_flags:
  - risk: “Mistreat” may not display the full force of oppression or legal wrongdoing by itself.
    mitigation: Footnote a preserves the stronger lexical alternatives “oppress” and “wrong.”
