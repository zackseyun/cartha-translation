translation:
  language: en
  text: Whoever eats it will bear the guilt and consequences of their sin, because they have treated what is holy to Yahweh as if it were common. That person will be cut off from their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cut off” may mean death, removal from the community, or direct judgment from God; this verse does not specify which.
    reason: alternative_reading
