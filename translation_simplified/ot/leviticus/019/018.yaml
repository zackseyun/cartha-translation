translation:
  language: en
  text: You must not take revenge or hold a grudge against members of your own people.[a] You must love your neighbor as you love yourself. I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the sons of your people.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall not take vengeance
  simplified_phrase: You must not take revenge
  preserved_meaning: The command forbids active retaliation.
  reasoning_layer_used: Lexical decision for תִקֹּם and its legal context
  rationale: “Must not take revenge” states the prohibition in direct modern English.
- pob_phrase: the sons of your people
  simplified_phrase: members of your own people
  preserved_meaning: The immediate object is fellow members of Israel’s covenant community.
  reasoning_layer_used: Lexical and theological decisions on בְּנֵי עַמֶּךָ
  rationale: The idiomatic wording clarifies group membership while the footnote preserves the literal image.
- pob_phrase: but you shall love your neighbor
  simplified_phrase: You must love your neighbor
  preserved_meaning: Love remains a distinct covenant command rather than a general contrast.
  reasoning_layer_used: Lexical decision for וְאָהַבְתָּ and the verse’s command structure
  rationale: A new sentence makes the positive command easier to follow without weakening its force.
interpretive_expansions:
- pob_phrase: as yourself
  rendering: as you love yourself
  claim: The comparison uses a person’s love for self as the measure of love for the neighbor.
  evidence:
  - The POB rationale for כָּמוֹךָ identifies self-regard as the standard of comparison.
  confidence: high
  alternatives_preserved:
  - as yourself
translation_notes:
  risk_flags:
  - risk: “Members of your own people” may be read as defining “neighbor” just as narrowly.
    mitigation: The commands remain separate, preserving the verse’s distinction between the two expressions.
