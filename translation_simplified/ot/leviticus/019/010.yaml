translation:
  language: en
  text: Do not go back over your vineyard to gather the grapes left behind, and do not pick up the grapes that have fallen. Leave them for the poor and for the foreigners living among you. I am Yahweh your God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall not strip your vineyard bare
  simplified_phrase: Do not go back over your vineyard to gather the grapes left behind
  preserved_meaning: The owner must not make another pass through the vineyard to take the remaining grapes.
  reasoning_layer_used: POB lexical decision and footnote a for תְעוֹלֵל
  rationale: This states the distinct second-pass restriction in clear language.
- pob_phrase: nor shall you gather the fallen grapes of your vineyard
  simplified_phrase: and do not pick up the grapes that have fallen
  preserved_meaning: The owner must not collect grapes that fell during the harvest.
  reasoning_layer_used: POB lexical decisions for פֶּרֶט and תְלַקֵּט
  rationale: “Pick up” clearly describes gathering fallen grapes.
- pob_phrase: for the sojourner
  simplified_phrase: for the foreigners living among you
  preserved_meaning: The grapes are also left for non-native residents within Israel.
  reasoning_layer_used: POB lexical decision and footnote c for גֵּר
  rationale: The phrase explains the resident sense of “sojourner” in common English.
interpretive_expansions:
- pob_phrase: the sojourner
  rendering: the foreigners living among you
  claim: These are non-native people residing within the Israelite community.
  evidence:
  - POB footnote c defines the sojourner as a non-native person living among Israel.
  - The POB lexical rationale identifies גֵּר as a non-native resident.
  confidence: high
  alternatives_preserved:
  - resident foreigner
  - sojourner
translation_notes:
  risk_flags:
  - risk: “Go back over” may be read as any return to the vineyard.
    mitigation: “To gather the grapes left behind” limits it to a further harvesting pass.
  - risk: “Foreigners” could imply all outsiders rather than residents.
    mitigation: “Living among you” preserves the documented resident sense.
