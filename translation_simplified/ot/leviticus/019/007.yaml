translation:
  language: en
  text: But if anyone eats the meat on the third day, it is tainted and will not be accepted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term describes sacrificial meat made unacceptable by being eaten after the permitted time; it may also be translated “foul” or “defiled.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if it is eaten at all
  simplified_phrase: if anyone eats the meat
  preserved_meaning: The condition still warns against eating the sacrificial meat at that time.
  reasoning_layer_used: Lexical decision for הֵאָכֹל יֵאָכֵל and immediate sacrificial context
  rationale: Naming the eater and the meat makes the passive wording easier to understand.
- pob_phrase: it is a defiled thing
  simplified_phrase: it is tainted
  preserved_meaning: The meat is declared ritually unacceptable, not broadly morally evil.
  reasoning_layer_used: Lexical decision for פִּגּוּל and theological decision on cultic status
  rationale: “Tainted” clearly preserves the evaluative force without suggesting future use in a sacrifice.
