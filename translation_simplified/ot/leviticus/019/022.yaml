translation:
  language: en
  text: The priest will make atonement for him before Yahweh with the ram offered as a guilt offering[a] because of the sin he committed. Then he will be forgiven for that sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “reparation offering.” The Hebrew term includes both guilt and the offering’s role in making reparation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with the ram of the guilt offering
  simplified_phrase: with the ram offered as a guilt offering
  preserved_meaning: The ram is the sacrificial guilt offering used to make atonement.
  reasoning_layer_used: Lexical decision for בְּאֵיל הָאָשָׁם
  rationale: This wording clearly identifies the ram as the offering rather than as preparation for a separate offering.
- pob_phrase: for the sin that he committed, and he shall be forgiven for the sin that he committed
  simplified_phrase: because of the sin he committed. Then he will be forgiven for that sin.
  preserved_meaning: Atonement addresses the committed sin, and forgiveness is granted for that same sin.
  reasoning_layer_used: Lexical decisions for עַל חַטָּאתוֹ and וְנִסְלַח לוֹ
  rationale: Two short sentences reduce difficult repetition while preserving the link between sin, atonement, and forgiveness.
