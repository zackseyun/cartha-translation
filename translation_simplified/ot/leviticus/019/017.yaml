translation:
  language: en
  text: Do not harbor hatred toward your brother. You must rebuke your neighbor for wrongdoing, so that you do not become guilty because of him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “share in his sin” or “incur guilt on his account.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hate your brother in your heart
  simplified_phrase: harbor hatred toward your brother
  preserved_meaning: The command forbids inward, continuing hatred while retaining the covenant term “brother.”
  reasoning_layer_used: Lexical decisions for תִשְׂנָא, אָחִיךָ, and בִּלְבָבֶךָ
  rationale: “Harbor hatred” expresses hatred kept within the inner person in natural English.
- pob_phrase: You shall surely rebuke your neighbor
  simplified_phrase: You must rebuke your neighbor for wrongdoing
  preserved_meaning: The rebuke remains an emphatic moral obligation directed toward one’s neighbor.
  reasoning_layer_used: Lexical decisions for הוֹכֵחַ תּוֹכִיחַ and עֲמִיתֶךָ
  rationale: “Must” carries the Hebrew emphasis more naturally than “shall surely.”
- pob_phrase: you shall not bear sin because of him
  simplified_phrase: so that you do not become guilty because of him
  preserved_meaning: Failing to confront the neighbor’s sin can make the hearer culpable.
  reasoning_layer_used: Lexical rationale and POB footnote for תִשָּׂא עָלָיו חֵטְא
  rationale: “Become guilty” makes the idiom understandable while the footnote preserves other possible nuances.
interpretive_expansions:
- pob_phrase: rebuke your neighbor
  rendering: rebuke your neighbor for wrongdoing
  claim: The rebuke concerns the neighbor’s wrongful conduct.
  evidence:
  - The immediate clause warns of bearing sin because of the neighbor.
  - The POB rationale describes culpability from failing to confront wrongdoing.
  confidence: high
translation_notes:
  risk_flags:
