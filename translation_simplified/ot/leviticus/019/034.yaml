translation:
  language: en
  text: Treat the non-native resident who lives among you[a] like someone born among you. Love that person as yourself, because you were non-native residents in the land of Egypt. I am Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term, often translated “sojourner,” means a non-native who has settled among Israel; other translations include “foreigner,” “resident alien,” and “stranger.”
    reason: lexical_alternative
