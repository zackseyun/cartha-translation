translation:
  language: en
  text: Do not make a false oath using my name. By doing that, you treat the name of your God as unholy. I am Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: swear falsely by my name
  simplified_phrase: make a false oath using my name
  preserved_meaning: God forbids invoking his name to support an oath that is false.
  reasoning_layer_used: POB lexical decisions for תִשָּׁבְעוּ, בִשְׁמִי, and לַשָּׁקֶר
  rationale: The wording replaces legal-sounding “swear falsely” with a clear description while retaining the oath and God's name.
- pob_phrase: and so profane the name of your God
  simplified_phrase: By doing that, you treat the name of your God as unholy
  preserved_meaning: A false oath made with God's name violates the holiness of his revealed name and honor.
  reasoning_layer_used: POB lexical decision for וְחִלַּלְתָּ and theological decision on the consequential clause
  rationale: The new sentence explains “profane” and keeps the stated consequence of the false oath.
translation_notes:
  risk_flags:
