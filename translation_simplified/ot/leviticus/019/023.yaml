translation:
  language: en
  text: When you enter the land and plant any tree grown for food, you must regard its fruit as “uncircumcised.”[a] For its first three years, that fruit is forbidden to you and must not be eaten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls the fruit “uncircumcised,” a metaphor meaning that it is not yet permitted to be eaten.
    reason: lexical_alternative
