translation:
  language: en
  text: Do not turn to mediums or spiritists.[a] Do not seek them out. Involvement with them will make you unclean. I am Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These terms refer to forbidden practitioners associated with consulting spirits or the dead; they may also be called necromancers or people with familiar spirits.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not turn to mediums or to spiritists; do not seek them out
  simplified_phrase: Do not turn to mediums or spiritists. Do not seek them out.
  preserved_meaning: Both commands against approaching and deliberately pursuing occult practitioners remain distinct.
  reasoning_layer_used: POB lexical decisions for תִּפְנוּ and תְּבַקְשׁוּ
  rationale: Two short sentences make the parallel prohibitions easier to follow.
- pob_phrase: to become unclean by them
  simplified_phrase: Involvement with them will make you unclean.
  preserved_meaning: Seeking these practitioners results in uncleanness without limiting it to ritual or moral impurity.
  reasoning_layer_used: POB lexical and theological decisions for לְטָמְאָה בָהֶם
  rationale: The new sentence clearly states the result while retaining the broad term “unclean.”
