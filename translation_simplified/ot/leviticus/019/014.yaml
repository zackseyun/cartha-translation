translation:
  language: en
  text: Do not curse a deaf man or put a stumbling block in front of a blind man.[a] But fear your God. I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew gives a deaf man and a blind man as representative examples; the command applies generally to deaf and blind people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall not curse
  simplified_phrase: Do not curse
  preserved_meaning: The direct prohibition and the verbal force of “curse” remain unchanged.
  reasoning_layer_used: POB lexical decision for תְקַלֵּל
  rationale: A direct modern command is clearer than the formal future-like wording.
- pob_phrase: before a blind man you shall not put a stumbling block
  simplified_phrase: put a stumbling block in front of a blind man
  preserved_meaning: The concrete image of deliberately placing something that can cause a blind man to trip is preserved.
  reasoning_layer_used: POB lexical decisions for לִפְנֵי, תִתֵּן, and מִכְשֹׁל
  rationale: Ordinary English places the object before the location and uses “in front of” for the spatial relation.
- pob_phrase: but you shall fear your God
  simplified_phrase: But fear your God
  preserved_meaning: Reverence for God remains the ethical ground for the prohibitions.
  reasoning_layer_used: POB theological decision on the final motivation clause
  rationale: The shorter imperative keeps the contrast and removes archaic command wording.
translation_notes:
  risk_flags:
  - risk: The masculine singular examples could be mistaken for limits on whom the law protects.
    mitigation: The footnote explains that these are representative legal examples with general scope.
