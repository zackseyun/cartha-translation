translation:
  language: en
  text: If a man has sexual intercourse with a woman and ejaculates, and she is a slave woman designated for a man,[a] but payment has not been made to free her and she has not been given her freedom, there must be an inquiry.[b] Neither of them is to be put to death, because she had not been freed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “betrothed to a man” or “pledged to a man.” Her commitment to the man did not give her the full legal status of a free wife.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word translated “inquiry” is uncertain and may instead mean “punishment” or “compensation.”
    reason: lexical_alternative
