translation:
  language: en
  text: When you harvest crops from your land, do not harvest your field all the way to its edge.[a] Do not pick up the crops left behind during harvest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean the side or corner of the field; it refers here to the outer part that must remain unharvested.
    reason: lexical_alternative
