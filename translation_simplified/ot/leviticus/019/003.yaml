translation:
  language: en
  text: Each man[a] must show reverent fear for his mother and his father. You must observe my Sabbath days. I am Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “each man,” using one man to represent each member of the community; “each person” is also possible.
    reason: lexical_alternative
