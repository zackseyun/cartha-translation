  preserved_meaning: The command retains both fear and reverence while naming the mother before the father.
  reasoning_layer_used: POB lexical and theological decisions on תִּירָאוּ and אִמּוֹ וְאָבִיו
  rationale: This wording prevents “fear” from sounding like mere terror without softening it to ordinary respect.
- pob_phrase: you shall keep my Sabbaths
  simplified_phrase: You must observe my Sabbath days
  preserved_meaning: Israel must carefully practice the recurring sacred days that belong to Yahweh.
  reasoning_layer_used: POB lexical decisions on שַׁבְּתֹתַי and תִּשְׁמֹרוּ
  rationale: “Observe” and “Sabbath days” make the required practice and explicit plural easier to understand.
