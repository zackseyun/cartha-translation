  preserved_meaning: One act of bringing takes the items to the priest at the appointed sanctuary location in Yahweh’s presence.
  reasoning_layer_used: POB lexical decisions for אֶל הַכֹּהֵן, אֶל פֶּתַח אֹהֶל מוֹעֵד, and לִפְנֵי יְהוָה
