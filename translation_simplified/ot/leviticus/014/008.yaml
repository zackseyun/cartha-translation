translation:
  language: en
  text: The person going through the cleansing ritual must wash his clothes, shave off all his hair, and bathe in water. Then he will be ritually clean. After that, he may return to the camp,[a] but he must stay outside his tent for seven days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he shall return to the camp.” The Hebrew may state his return rather than explicitly say that he is permitted to return.
    reason: alternative_reading
