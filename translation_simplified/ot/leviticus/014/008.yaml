  preserved_meaning: The person is undergoing the prescribed process of ritual cleansing.
  reasoning_layer_used: POB lexical and theological decisions on הַמִּטַּהֵר
  rationale: This wording makes the ritual setting clear without suggesting moral cleansing.
- pob_phrase: then he shall be clean
