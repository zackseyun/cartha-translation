  preserved_meaning: The washing actions result in a restored ritual status.
  reasoning_layer_used: POB lexical decision on וְטָהֵר and theological decision on ritual purity
  rationale: Adding “ritually” prevents readers from mistaking ceremonial status for ordinary hygiene or inner morality.
- pob_phrase: Afterward he may come into the camp, but he shall stay outside his tent
  simplified_phrase: After that, he may return to the camp, but he must stay outside his tent
  preserved_meaning: He is permitted back into the camp while remaining under a temporary domestic restriction.
  reasoning_layer_used: POB lexical decisions on יָבֹא and וְיָשַׁב
  rationale: “Return” and “must stay” state the sequence and continuing restriction in ordinary English.
