translation:
  language: en
  text: But if he is poor and cannot afford the required offerings, he must bring one male lamb as a guilt offering. The lamb is to be presented by waving it to make atonement for him. He must also bring one-tenth of an ephah of fine flour mixed with oil as a grain offering, together with one log of oil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an Israelite dry measure, and a log was a small liquid measure.
    reason: cultural_note
