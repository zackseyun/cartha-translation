translation:
  language: en
  text: Then the priest must order that the house be emptied before he goes in to inspect the diseased area.[a] This is to keep everything in the house from becoming unclean. After that, the priest must go in and inspect the house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the mark,” “the infection,” or, traditionally, “the plague.” The Hebrew refers to the affected spot or condition the priest inspects.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the priest shall command that they empty the house
  simplified_phrase: the priest must order that the house be emptied
  preserved_meaning: The priest directs that all the house's contents be removed.
  reasoning_layer_used: Lexical decision for וְצִוָּה and וּפִנּוּ
  rationale: The passive wording avoids an unclear “they” while keeping the priest's command and the complete emptying.
- pob_phrase: so that everything in the house may not become unclean
  simplified_phrase: This is to keep everything in the house from becoming unclean.
  preserved_meaning: Emptying the house prevents its contents from acquiring ritual uncleanness.
  reasoning_layer_used: Lexical and theological decisions for וְלֹא יִטְמָא
  rationale: A separate purpose sentence is easier to follow and retains the ritual term “unclean.”
- pob_phrase: and afterward the priest shall go in to inspect the house
  simplified_phrase: After that, the priest must go in and inspect the house.
  preserved_meaning: The inspection follows the emptying of the house as the next required step.
  reasoning_layer_used: Lexical decisions for וְאַחַר כֵּן and לִרְאוֹת
  rationale: The wording presents the legal sequence directly in common English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “unclean” to mean morally guilty or physically dirty.
    mitigation: The established Levitical term is retained because the POB audit identifies ceremonial impurity as its meaning.
