translation:
  language: en
  text: On the eighth day, he must take two male lambs with no defects and one female lamb, a year old, also with no defects. He must also take three-tenths of an ephah of fine flour mixed with oil for a grain offering, and one small log measure of oil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure, and a log was a small liquid measure used in Israelite worship.
    reason: cultural_note
