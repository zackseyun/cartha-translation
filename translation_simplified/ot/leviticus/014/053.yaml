  text: Then he must release the live bird into the open country outside the city. Then he must make atonement for the house,[a] and it will be clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated “purge the house” or “make expiation for the house.” The Hebrew uses priestly atonement language as part of a cleansing ritual.
