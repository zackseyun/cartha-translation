translation:
  language: en
  text: Then the owner of the house must go to the priest and say, “I have seen something in the house that looks like a plague.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “plague” means an affected spot on the house; the owner is reporting what it looks like, not making a definite diagnosis.
    reason: lexical_alternative
