translation:
  language: en
  text: Whoever lies down in the house must wash his clothes.[a][b] Whoever eats in the house must also wash his clothes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “sleeps,” but “lies down” has a broader meaning here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses “his” in a generic legal sense and does not limit the command to men.
    reason: simplification_note
simplification_decisions:
- pob_phrase: shall wash
  simplified_phrase: must wash
  preserved_meaning: The washing is required by the law.
  reasoning_layer_used: POB lexical decision for יְכַבֵּס
  rationale: “Must” makes the legal obligation immediately clear in modern English.
- pob_phrase: And whoever lies down ... and whoever eats
  simplified_phrase: Whoever lies down ... Whoever eats
  preserved_meaning: Each action carries the same washing requirement.
  reasoning_layer_used: POB lexical decisions for the two substantival participles
  rationale: Two sentences make the parallel rules easier to follow without merging them.
- pob_phrase: shall wash his clothes
  simplified_phrase: must also wash his clothes
  preserved_meaning: The person who eats has the same duty as the person who lies down.
  reasoning_layer_used: Immediate parallel structure and POB translation
  rationale: “Also” clearly marks the repeated requirement.
