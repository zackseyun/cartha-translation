translation:
  language: en
  text: Then the priest must take some of the blood from the guilt offering and put it on the right earlobe[a], right thumb, and right big toe of the person being cleansed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the tip of the right ear.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall take some of the blood of
  simplified_phrase: must take some of the blood from
  preserved_meaning: The priest is commanded to take part of the offering’s blood for the rite.
  reasoning_layer_used: Lexical decision for מִדַּם and procedural legal context
  rationale: “Must” states the command naturally, while “some” preserves the partitive sense.
- pob_phrase: the lobe of the right ear ... the thumb of his right hand ... the big toe of his right foot
  simplified_phrase: the right earlobe, right thumb, and right big toe
  preserved_meaning: Blood is applied to the same three right-side body parts.
  reasoning_layer_used: Lexical decisions for תְּנוּךְ, בֹּהֶן, and הַיְמָנִית
  rationale: The shorter list removes unnecessary anatomical repetition without changing the locations.
- pob_phrase: the one being cleansed
  simplified_phrase: the person being cleansed
  preserved_meaning: The participant undergoes the priestly cleansing rite rather than cleansing himself.
  reasoning_layer_used: Lexical and theological decisions for הַמִּטַּהֵר
  rationale: “Person” makes the referent explicit while retaining the passive process.
translation_notes:
  risk_flags:
  - risk: “Earlobe” may be more specific than the Hebrew term requires.
    mitigation: The footnote preserves “tip of the right ear” as the documented alternative.
