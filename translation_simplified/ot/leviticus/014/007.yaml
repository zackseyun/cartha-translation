translation:
  language: en
  text: He must sprinkle it seven times on the person being cleansed from the skin disease.[a] Then he must declare that person clean and release the living bird over the open field.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “leprosy.” The Hebrew term covers various skin conditions and does not necessarily mean modern leprosy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one being cleansed from the skin disease
  simplified_phrase: the person being cleansed from the skin disease
  preserved_meaning: The person is still undergoing the ritual cleansing process.
  reasoning_layer_used: POB lexical decision for הַמִּטַּהֵר
  rationale: “The person” is more natural than the abstract phrase “the one.”
- pob_phrase: he shall pronounce him clean
  simplified_phrase: he must declare that person clean
  preserved_meaning: This is a formal ritual and judicial declaration, not a medical cure.
  reasoning_layer_used: POB lexical decision for וְטִהֲרוֹ
  rationale: “Declare” expresses the official act in familiar English.
- pob_phrase: he shall let the living bird go free
  simplified_phrase: release the living bird
  preserved_meaning: The bird that remains alive is set free as part of the rite.
  reasoning_layer_used: POB lexical decisions for וְשִׁלַּח and הַצִּפֹּר הַחַיָּה
  rationale: “Release” states the same action more directly.
