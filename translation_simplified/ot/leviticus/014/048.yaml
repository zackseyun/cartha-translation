translation:
  language: en
  text: But if the priest enters and inspects, and finds that the disease[a] has not spread in the house after it was plastered, he must pronounce the house clean because the disease has healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term refers to the diseased affliction affecting the house; traditional versions often call it a “plague.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: comes in and looks, and behold
  simplified_phrase: enters and inspects, and finds
  preserved_meaning: The priest enters to conduct the required inspection and observes its result.
  reasoning_layer_used: Lexical decisions for בֹּא יָבֹא, וְרָאָה, and וְהִנֵּה
  rationale: The procedural action and discovery are stated naturally without the formal marker “behold.”
- pob_phrase: the disease has not spread in the house after the house was plastered
  simplified_phrase: the disease has not spread in the house after it was plastered
  preserved_meaning: The affliction did not spread after the remedial plastering of the house.
  reasoning_layer_used: Source syntax and lexical decision for אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  rationale: The plastering phrase remains attached to the failure of the disease to spread.
- pob_phrase: then the priest shall pronounce the house clean
  simplified_phrase: he must pronounce the house clean
  preserved_meaning: The priest makes the required ritual declaration rather than physically cleaning the house.
  reasoning_layer_used: Theological decision on וְטִהַר
  rationale: “Must” expresses the required legal action in common English.
