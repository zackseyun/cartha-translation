translation:
  language: en
  text: The priest shall take some of the oil from his palm and put it on the right earlobe of the person being cleansed, on the thumb of his right hand, and on the big toe of his right foot. He shall put the oil on the same places where the blood of the guilt offering was applied.
  philosophy: optimal-equivalence
