- pob_phrase: put some of the oil that is on his palm
  simplified_phrase: take some of the oil from his palm and put it
  preserved_meaning: The priest applies part of the oil resting on his palm.
  reasoning_layer_used: The lexical decisions identify a partitive amount of oil and preserve the palm as the ritual source.
  rationale: The added action sequence makes the physical movement easier to follow.
- pob_phrase: on the lobe of the right ear of the one being cleansed
  simplified_phrase: on the right earlobe of the person being cleansed
  preserved_meaning: The oil is applied to the right ear lobe of the person undergoing ritual cleansing.
  reasoning_layer_used: The lexical decisions support “earlobe,” “right,” and the process-oriented “being cleansed.”
  rationale: Natural anatomical word order reduces the phrase's complexity.
- pob_phrase: on the place of the guilt-offering blood
  simplified_phrase: on the same places where the blood of the guilt offering was applied
  preserved_meaning: The oil goes on the body locations that already received the guilt-offering blood.
  reasoning_layer_used: The lexical rationale and immediate ritual context identify these as the previously used locations.
  rationale: The clearer clause explains the ritual relationship without changing the sacrificial term.
