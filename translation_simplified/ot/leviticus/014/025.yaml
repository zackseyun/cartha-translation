translation:
  language: en
  text: Then he must slaughter the lamb for the guilt offering. The priest must take some of the lamb’s blood and put it on the right earlobe, right thumb, and right big toe of the person being cleansed.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall slaughter the guilt-offering lamb
  simplified_phrase: must slaughter the lamb for the guilt offering
  preserved_meaning: The lamb is slaughtered as the specific sacrifice called the guilt offering.
  reasoning_layer_used: lexical and theological decisions for שָׁחַט and אָשָׁם
  rationale: “Must” gives the procedural force clearly while “guilt offering” retains the established sacrificial term.
- pob_phrase: take some of the blood of the guilt offering
  simplified_phrase: take some of the lamb’s blood
  preserved_meaning: The priest takes only a portion of the sacrificed lamb’s blood.
  reasoning_layer_used: partitive lexical decision for מִן and construct decision for כֶּבֶשׂ הָאָשָׁם
  rationale: Naming the lamb directly makes the source of the blood immediately clear.
- pob_phrase: put it on the lobe of the right ear ... and on the thumb of his right hand, and on the big toe of his right foot
  simplified_phrase: put it on the right earlobe, right thumb, and right big toe
  preserved_meaning: Blood is applied to the three specified places on the person’s right side.
  reasoning_layer_used: lexical decisions for תְּנוּךְ and בֹּהֶן
  rationale: The compact list removes repeated anatomy without losing any ritual location.
translation_notes:
  risk_flags:
  - risk: The compact list could momentarily obscure whose body receives the blood.
    mitigation: The phrase “of the person being cleansed” governs all three body parts.
