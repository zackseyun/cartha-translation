translation:
  language: en
  text: When you enter Canaan, the land I am giving you to possess, and I put an outbreak like a skin disease[a] in one of the houses there,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term, traditionally translated “leprosy,” covers various diseased or contaminating outbreaks and can also describe a house.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the land of Canaan that I am giving to you as a possession
  simplified_phrase: Canaan, the land I am giving you to possess
  preserved_meaning: God is giving Canaan to Israel as its landed possession.
  reasoning_layer_used: Lexical decisions for אֶרֶץ כְּנַעַן and אֲחֻזָּה
  rationale: The active verb “possess” expresses the land-holding idea in more natural English.
- pob_phrase: in a house in the land of your possession
  simplified_phrase: in one of the houses there
  preserved_meaning: The outbreak occurs in a house within the land Israel will possess.
  reasoning_layer_used: Immediate context and lexical decision for אֶרֶץ אֲחֻזַּתְכֶם
  rationale: “There” removes a heavy repetition while still pointing clearly to Canaan.
- pob_phrase: I put an outbreak of skin disease
  simplified_phrase: I put an outbreak like a skin disease
  preserved_meaning: God explicitly brings the described affliction upon a house.
  reasoning_layer_used: Theological decision on divine agency and lexical decisions for נֶגַע צָרַעַת
  rationale: The wording keeps God’s agency and makes the disease image understandable in a house setting.
