translation:
  language: en
  text: Then the priest must offer the burnt offering and the grain offering on the altar. He will make atonement for the person, and that person will be clean.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “clean” refers to ritual status. Or, “that person will be purified”; the Hebrew more literally states the result, “that person will be clean.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the priest shall offer up
  simplified_phrase: the priest must offer
  preserved_meaning: The priest is required to present the sacrifice on the altar.
  reasoning_layer_used: Lexical decision for וְהֶעֱלָה and ritual context
  rationale: “Must offer” expresses the ritual requirement in clearer modern English while retaining the sacrificial sense.
- pob_phrase: and the priest shall make atonement for him, and he shall be clean
  simplified_phrase: He will make atonement for the person, and that person will be clean
  preserved_meaning: The priest acts on the person’s behalf, resulting in the person’s clean status.
  reasoning_layer_used: Lexical decisions for וְכִפֶּר עָלָיו and וְטָהֵר
  rationale: Replacing ambiguous pronouns makes clear that the priest performs the rite and the person becomes clean.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “clean” as physical cleanliness or moral purity.
    mitigation: The footnote identifies it as ritual status without altering the biblical term in the main text.
