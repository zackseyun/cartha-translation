  preserved_meaning: The house is required to be physically demolished at this stage.
  reasoning_layer_used: Lexical decision for וְנָתַץ and its sequential context
  rationale: “Must” states the legal requirement clearly, while “tear down” keeps the force of demolition.
- pob_phrase: its timbers
  simplified_phrase: wooden beams
  preserved_meaning: The house’s structural wooden parts must be removed.
  reasoning_layer_used: Lexical decision for עֵצָיו
  rationale: “Wooden beams” is more immediately understandable than “timbers” in this building context.
- pob_phrase: and carry them out to an unclean place outside the city
  simplified_phrase: He must carry ... to an unclean place outside the city.
  preserved_meaning: All dismantled materials must be removed beyond the city to a ritually unclean location.
  reasoning_layer_used: Lexical and theological decisions for וְהוֹצִיא and טָמֵא
  rationale: A second sentence makes the required removal easier to follow while retaining the key term “unclean.”
