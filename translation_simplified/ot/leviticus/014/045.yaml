translation:
  language: en
  text: Then he must tear the house down. He must carry its stones, wooden beams, and all its plaster[a] to an unclean place outside the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “dust”; here it probably means the plaster or other material scraped from the house.
    reason: lexical_alternative
