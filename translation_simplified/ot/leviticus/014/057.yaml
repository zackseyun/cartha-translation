  text: These instructions teach when something is unclean and when it is clean. This is the law about the skin disease.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “leprosy.” The Hebrew term is broader than modern leprosy and, in these laws, can involve people, garments, and houses.
    reason: lexical_alternative
