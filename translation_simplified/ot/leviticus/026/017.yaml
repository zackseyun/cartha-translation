simplification_decisions:
- pob_phrase: And I will set my face against you
  simplified_phrase: I will set my face against you in judgment.
  preserved_meaning: God personally and firmly opposes his people as covenant judgment.
  reasoning_layer_used: Lexical and theological decisions on anthropomorphic divine language
  rationale: The concrete image remains, while “in judgment” makes its force clear.
- pob_phrase: and you will be struck down before your enemies; those who hate you will rule over you
  simplified_phrase: You will be struck down before your enemies. Those who hate you will rule over you.
  preserved_meaning: Israel will suffer defeat and subjection to those who hate them.
  reasoning_layer_used: Lexical decisions for וְנִגַּפְתֶּם and וְרָדוּ בָכֶם
  rationale: Two shorter sentences clarify the sequence without strengthening “rule” into tyranny.
- pob_phrase: and you will flee when no one is pursuing you
  simplified_phrase: You will run away even when no one is chasing you.
  preserved_meaning: Fear will make the people flee despite the absence of any actual pursuer.
  reasoning_layer_used: Lexical decision for וְאֵין רֹדֵף אֶתְכֶם
  rationale: Common wording and “even” make the contrast immediately understandable.
