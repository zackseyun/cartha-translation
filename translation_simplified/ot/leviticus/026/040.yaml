translation:
  language: en
  text: But if they confess their own sins and the sins of their fathers, admitting that they were unfaithful to me and that they also lived in opposition to me,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “lived with hostility toward me.” The Hebrew term describes oppositional or hostile conduct.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their iniquity and the iniquity of their fathers
  simplified_phrase: their own sins and the sins of their fathers
  preserved_meaning: They must acknowledge both their culpable wrongdoing and their fathers’ wrongdoing.
  reasoning_layer_used: Lexical and theological decisions on עָוֹן and corporate confession
  rationale: “Sins” is clearer than “iniquity,” while “their own” keeps the two groups distinct.
- pob_phrase: in the unfaithfulness by which they were unfaithful to me
  simplified_phrase: admitting that they were unfaithful to me
  preserved_meaning: Their confession includes their breach of faith against God.
  reasoning_layer_used: Lexical decisions on מַעַל and מָעֲלוּ בִי
  rationale: The recast removes an awkward cognate repetition without weakening the covenantal offense.
- pob_phrase: walked contrary to me
  simplified_phrase: lived in opposition to me
  preserved_meaning: Their way of life was actively opposed to God.
  reasoning_layer_used: Lexical decisions on הָלַךְ and קֶרִי
  rationale: “Lived” makes the Hebrew walking image’s conduct sense immediately clear.
translation_notes:
  risk_flags:
  - risk: Replacing “iniquity” with “sins” may slightly reduce its emphasis on guilt.
    mitigation: The wording still identifies culpable wrongdoing that must be confessed.
  - risk: Rendering the walking image as “lived” removes its literal form.
    mitigation: “Lived in opposition” preserves its force as an ongoing pattern of conduct.
