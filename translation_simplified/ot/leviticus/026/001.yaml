    text: Or “carved stone” or “stone image.” The exact kind of stone object is uncertain, but it was associated with forbidden worship.
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, God’s personal name; traditionally rendered “the LORD.”
    reason: alternative_reading
