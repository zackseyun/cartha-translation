translation:
  language: en
  text: I will destroy your shrines on the heights and cut down your incense altars.[a] I will lay your corpses on the corpses of your idols,[b] and my soul will loathe you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sun pillars.” The exact kind of object used in this false worship is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew calls both the dead people and the lifeless idols “corpses,” stressing the idols’ disgrace.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your high places
  simplified_phrase: your shrines on the heights
  preserved_meaning: These were elevated sites used for worship.
  reasoning_layer_used: POB lexical decision for בָּמֹתֵיכֶם
  rationale: The wording explains the religious sense of “high places” without losing their elevated setting.
- pob_phrase: place your corpses on
  simplified_phrase: lay your corpses on
  preserved_meaning: God will physically put their dead bodies upon the ruined idols.
  reasoning_layer_used: POB lexical decisions for נָתַתִּי and עַל
  rationale: “Lay” is more natural here while preserving the grim physical image.
- pob_phrase: my soul will abhor you
  simplified_phrase: my soul will loathe you
  preserved_meaning: God expresses intense personal and covenantal revulsion toward them.
  reasoning_layer_used: POB theological decision on divine revulsion
  rationale: “Loathe” is clearer modern English, while “my soul” retains the source’s theological tension and force.
translation_notes:
  risk_flags:
  - risk: “Shrines on the heights” may sound more specific than the traditional term “high places.”
    mitigation: The POB lexical rationale identifies them as elevated worship sites and lists nearly identical wording as an alternative.
  - risk: Calling idols “corpses” is intentionally unusual in English.
    mitigation: The wording and footnote preserve the Hebrew repetition that portrays the idols as lifeless and disgraced.
