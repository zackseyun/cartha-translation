translation:
  language: en
  text: Then I too will set myself against you.[a] I myself will strike you with sevenfold punishment because of your sins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “walk contrary to you”; this repeated expression describes the LORD opposing Israel in response to their opposition.
    reason: source_note
  - marker: b
    text: Or “strike you seven times for your sins”; the expression emphasizes intensified punishment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will walk contrary to you
  simplified_phrase: will set myself against you
  preserved_meaning: The LORD will respond to Israel by opposing them in covenant judgment.
  reasoning_layer_used: POB lexical and theological decisions on בקרי
  rationale: The clearer English states the reciprocal opposition while the footnote preserves the Hebrew walking image.
- pob_phrase: will strike you sevenfold for your sins
  simplified_phrase: will strike you with sevenfold punishment because of your sins
  preserved_meaning: God will personally impose intensified judgment on account of Israel’s sins.
  reasoning_layer_used: POB lexical decisions on נכה, שבע, and על חטאתיכם
  rationale: Adding “punishment” clarifies what the striking means without reducing “sevenfold” to strict arithmetic.
translation_notes:
  risk_flags:
