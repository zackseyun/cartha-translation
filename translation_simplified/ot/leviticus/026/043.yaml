translation:
  language: en
  text: Then the land will be left without them. While it lies desolate, it will enjoy its Sabbath rests. They will accept the punishment for their wrongdoing,[a] because—yes, because—they rejected my rulings, and their whole being loathed my decrees.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “accept their iniquity” or “make amends for their iniquity.” Here it refers to accepting the punishment their wrongdoing deserves.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them
  simplified_phrase: the land will be left without them. While it lies desolate, it will enjoy its Sabbath rests
  preserved_meaning: The people's absence leaves the land desolate and allows it to receive its covenantal rests.
  reasoning_layer_used: Lexical decisions for תֵּעָזֵב, שַׁבְּתֹתֶיהָ, and בָּהְשַׁמָּה מֵהֶם
  rationale: Two sentences clarify the sequence while “Sabbath rests” explains the land-focused term.
- pob_phrase: accept the punishment for their iniquity
  simplified_phrase: accept the punishment for their wrongdoing
  preserved_meaning: They bear the judicial consequence of their covenant wrongdoing.
  reasoning_layer_used: Theological decision on יִרְצוּ אֶת עֲוֺנָם
  rationale: “Wrongdoing” is clearer than “iniquity” without weakening the chosen penal sense.
- pob_phrase: they rejected my judgments and their soul abhorred my statutes
  simplified_phrase: they rejected my rulings, and their whole being loathed my decrees
  preserved_meaning: They contemptuously rejected God's distinct covenant requirements from within themselves.
  reasoning_layer_used: Lexical decisions for מִשְׁפָּטַי, מָאָסוּ, חֻקֹּתַי, and גָּעֲלָה נַפְשָׁם
  rationale: “Rulings” and “decrees” remain distinct, while “whole being” preserves the force of the soul image.
translation_notes:
  risk_flags:
  - risk: “Wrongdoing” does not display the full range of iniquity, guilt, and punishment carried by עֲוֺן.
    mitigation: The main text retains the penal reading, and the footnote preserves the documented alternatives.
  - risk: “Whole being” interprets the collective singular expression “their soul.”
    mitigation: It preserves inward personal abhorrence rather than flattening the image to a simple subject.
