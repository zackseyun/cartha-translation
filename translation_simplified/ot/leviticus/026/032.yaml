  preserved_meaning: The LORD will personally cause the covenant land to become desolate.
  reasoning_layer_used: Lexical and theological decisions on וַהֲשִׁמֹּתִי and הָאָרֶץ
  rationale: “Devastate” states the causative destruction plainly while keeping “the land” contextually limited.
