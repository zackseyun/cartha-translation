translation:
  language: en
  text: I myself will devastate the land, and your enemies who live there will be appalled[a] by its devastation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “astonished” or “horrified.” The Hebrew describes a shocked response to the devastation.
    reason: lexical_alternative
