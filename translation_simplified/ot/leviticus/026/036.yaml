translation:
  language: en
  text: As for those of you who remain, I will make their hearts lose courage in the lands of their enemies. The sound of a leaf blown along will chase them. They will flee as people flee from a sword, and they will fall even though no one is chasing them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will bring faintness into their hearts
  simplified_phrase: I will make their hearts lose courage
  preserved_meaning: God causes an inner collapse of courage rather than ordinary fear alone.
  reasoning_layer_used: lexical and theological decisions
  rationale: The clearer wording preserves both divine agency and the psychological force of the judgment.
- pob_phrase: the sound of a driven leaf will pursue them
  simplified_phrase: The sound of a leaf blown along will chase them
  preserved_meaning: A harmless leaf becomes an imagined pursuer because of their panic.
  reasoning_layer_used: lexical decision and footnote
  rationale: The concrete image remains while “blown along” is easier to picture than “driven.”
- pob_phrase: they will flee as one flees from the sword
  simplified_phrase: They will flee as people flee from a sword
  preserved_meaning: Their terrified flight resembles flight from a deadly armed threat.
  reasoning_layer_used: lexical decision and doctrine-realigned revision
  rationale: The plural wording reads naturally without weakening the protected comparison.
translation_notes:
