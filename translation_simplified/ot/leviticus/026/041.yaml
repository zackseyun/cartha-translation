translation:
  language: en
  text: I too will walk against them and bring them into their enemies’ land. Or then[a] their uncircumcised heart[b] will be humbled, and they will accept the punishment their sin deserves.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase “or then” is difficult and may point to the time when their heart is humbled.
    reason: alternative_reading
  - marker: b
    text: An “uncircumcised heart” is a covenant image for a heart that remains stubborn and unclean.
    reason: cultural_note
  - marker: c
    text: This may also be translated, “they will bear the consequences of their iniquity” or “their iniquity will be paid for.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will walk contrary to them
  simplified_phrase: will walk against them
  preserved_meaning: God responds to their opposition by opposing them while the chapter’s walking image remains intact.
  reasoning_layer_used: POB lexical decision for אֵלֵךְ עִמָּם בְּקֶרִי
  rationale: “Walk against” is clearer modern English without removing the covenant-curse image.
- pob_phrase: bring them into the land of their enemies
  simplified_phrase: bring them into their enemies’ land
  preserved_meaning: God brings them into exile among their enemies.
  reasoning_layer_used: POB lexical decision for וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  rationale: The possessive form is shorter and more natural while preserving the exile setting.
- pob_phrase: accept the punishment for their iniquity
  simplified_phrase: accept the punishment their sin deserves
  preserved_meaning: They acknowledge and bear the due consequence of their guilt.
  reasoning_layer_used: POB lexical and theological decisions for וְאָז יִרְצוּ אֶת עֲוֺנָם
  rationale: “Their sin deserves” explains the judicial relationship between guilt and punishment in common English.
