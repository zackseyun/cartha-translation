translation:
  language: en
  text: I will bring a sword against you to carry out the covenant’s vengeance.[a] You will be forced to gather inside your cities. Then I will send a plague among you, and you will be handed over to the enemy’s power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “vengeance for the covenant” or “covenant vengeance”; each refers to judgment because the covenant was broken.
    reason: lexical_alternative
