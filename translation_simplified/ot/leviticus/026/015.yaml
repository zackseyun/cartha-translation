  rationale: “Whole being” communicates the idiom clearly, while the footnote preserves its literal image.
- pob_phrase: so that you do not do all my commandments
  simplified_phrase: so that you do not obey all my commandments
  preserved_meaning: Their abhorrence results in disobedience to God’s commands.
  reasoning_layer_used: POB lexical decision on לְבִלְתִּי עֲשׂוֹת and כָּל מִצְוֺתַי
  rationale: English speakers naturally obey commandments rather than “do” them.
- pob_phrase: and if ... and if ... thereby breaking
