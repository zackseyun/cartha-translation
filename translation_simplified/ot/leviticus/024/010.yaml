translation:
  language: en
  text: The son of an Israelite woman had an Egyptian father. He went out among the sons of Israel.[a] There in the camp, he fought with an Israelite man.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the Hebrew covenant name for the Israelite people.
    reason: simplification_note
  - marker: b
    text: Or “quarreled with”; the Hebrew can describe either a dispute or a fight.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The son of an Israelite woman, and he was the son of an Egyptian man
  simplified_phrase: The son of an Israelite woman had an Egyptian father
  preserved_meaning: His mother was an Israelite, and his father was Egyptian.
  reasoning_layer_used: POB lexical decisions on maternal and paternal identity
  rationale: The family relationship is recast in ordinary English without changing either parent’s identity.
- pob_phrase: went out among the sons of Israel; and in the camp
  simplified_phrase: He went out among the sons of Israel. There in the camp
  preserved_meaning: He went among Israel’s people, and the fight occurred in their camp.
  reasoning_layer_used: POB lexical and theological decisions on location and covenantal designation
  rationale: Two shorter sentences clarify the movement and setting while retaining “sons of Israel.”
- pob_phrase: the son of the Israelite woman and an Israelite man fought
  simplified_phrase: he fought with an Israelite man
  preserved_meaning: The mixed-parentage man fought the man identified as Israelite.
  reasoning_layer_used: POB lexical decisions on participant identity and וַיִּנָּצוּ
  rationale: A pronoun removes heavy repetition while keeping the contrast between the two men.
translation_notes:
  risk_flags:
  - risk: Using “he” reduces the Hebrew repetition of “the son of the Israelite woman.”
    mitigation: The first sentence clearly identifies him, and the contrast with the Israelite man remains explicit.
  - risk: “Fought” may suggest physical violence where the Hebrew can also mean a quarrel.
    mitigation: Footnote b preserves the documented lexical ambiguity.
