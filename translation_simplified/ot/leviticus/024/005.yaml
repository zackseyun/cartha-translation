translation:
  language: en
  text: Take fine flour and bake twelve loaves. Use two-tenths of an ephah of flour for each loaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure. The Hebrew literally says “two tenths” for each loaf.
    reason: cultural_note
