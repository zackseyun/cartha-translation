translation:
  language: en
  text: In the tent of meeting, outside the veil of the testimony,[a] Aaron must tend the lamp before Yahweh from evening until morning, night after night. This is a permanent law for every generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The testimony refers especially to the covenant tablets kept in the ark; the veil may also be called the curtain of the testimony.
    reason: source_note
