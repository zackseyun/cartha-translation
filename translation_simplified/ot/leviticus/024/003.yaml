- pob_phrase: shall arrange it
  simplified_phrase: must tend the lamp
  preserved_meaning: Aaron is responsible for setting and maintaining the lamp as the prescribed ritual.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Tend” expresses the priestly task naturally, while “the lamp” supplies the likely antecedent from the previous verse.
- pob_phrase: before Yahweh continually
  simplified_phrase: before Yahweh ... night after night
  preserved_meaning: The rite must be performed regularly in Yahweh’s presence.
  reasoning_layer_used: theological decision on תָּמִיד
  rationale: “Night after night” makes the ongoing observance clear without suggesting constant daytime burning.
- pob_phrase: a permanent statute throughout your generations
  simplified_phrase: a permanent law for every generation
  preserved_meaning: The command remains binding across successive generations.
  reasoning_layer_used: lexical decisions for חֻקַּת עוֹלָם and לְדֹרֹתֵיכֶם
  rationale: “Law for every generation” states the enduring obligation in common English.
