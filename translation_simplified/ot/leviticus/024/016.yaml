translation:
  language: en
  text: Anyone who blasphemes the name of Yahweh must be put to death.[a] The whole community must stone that person. Whether a resident foreigner or native-born, anyone who blasphemes the Name[b] must be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “pronounces the name of Yahweh” or “curses the name of Yahweh.” In this law, it refers to profaning the divine name.
    reason: lexical_alternative
  - marker: b
    text: “The Name” is a reverent way of referring to the divine name.
    reason: cultural_note
simplification_decisions:
- pob_phrase: shall surely be put to death
  simplified_phrase: must be put to death
  preserved_meaning: The sentence remains a binding legal command requiring capital punishment.
  reasoning_layer_used: Lexical decision for מֹות יוּמָת
  rationale: “Must” expresses the formula’s force more directly in modern English.
- pob_phrase: all the congregation shall certainly stone him
  simplified_phrase: The whole community must stone that person
  preserved_meaning: The assembled covenant community is responsible for carrying out the stoning.
  reasoning_layer_used: Lexical decisions for רָגוֹם יִרְגְּמוּ and כָּל הָעֵדָה
  rationale: Common wording replaces formal terms while retaining the communal duty and its force.
- pob_phrase: The sojourner as well as the native-born
  simplified_phrase: Whether a resident foreigner or native-born
  preserved_meaning: The law applies equally to non-native residents and native Israelites.
  reasoning_layer_used: Lexical decisions for כַּגֵּר and כָּאֶזְרָח
  rationale: “Resident foreigner” clearly identifies the sojourner as a non-native living among Israel.
translation_notes:
  risk_flags:
