translation:
  language: en
  text: Anyone who kills an animal by striking it must pay compensation for it. But anyone who kills a man[a] by striking him must be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a human being.” The Hebrew uses a masculine singular form here as a representative legal case.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: whoever strikes down an animal
  simplified_phrase: Anyone who kills an animal by striking it
  preserved_meaning: The blow is fatal, and the source image of striking remains explicit.
  reasoning_layer_used: Lexical decision for מַכֵּה and the parallel legal outcomes
  rationale: This wording makes the lethal sense immediately clear without losing the act of striking.
- pob_phrase: shall make restitution for it
  simplified_phrase: must pay compensation for it
  preserved_meaning: The offender is legally required to compensate for the dead animal.
  reasoning_layer_used: Lexical decision for יְשַׁלְּמֶנָּה
  rationale: “Pay compensation” expresses the legal remedy in familiar English.
- pob_phrase: shall be put to death
  simplified_phrase: must be put to death
  preserved_meaning: The offender is judicially sentenced to death rather than merely destined to die.
  reasoning_layer_used: Lexical decision for יוּמָת
  rationale: “Must” states the legal requirement clearly while retaining the judicial passive.
translation_notes:
  risk_flags:
  - risk: “By striking” may sound more mechanically specific than the Hebrew participle requires.
    mitigation: It preserves POB’s chosen striking image while “kills” states the contextually established fatal result.
  - risk: Modern readers may understand “man” as excluding other human beings.
    mitigation: The footnote preserves the broader lexical alternative while the main text follows POB’s masculine legal formulation.
