translation:
  language: en
  text: The priest will present the offering before Yahweh and make atonement for the woman. Then she will be ritually clean from her bleeding.[a] This is the law for a woman who gives birth, whether the child is male or female.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from her flow of blood.” The Hebrew literally says “from the source of her blood.”
    reason: lexical_alternative
