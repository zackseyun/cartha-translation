translation:
  language: en
  text: But if she gives birth to a girl, she will be ritually unclean for two weeks, just as she is during her menstrual period. For sixty-six days after that, she must continue in her purification period connected with post-birth bleeding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is literally “blood of purification”; it describes a prescribed post-birth purification period, not moral guilt.
    reason: cultural_note
