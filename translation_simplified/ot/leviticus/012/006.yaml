translation:
  language: en
  text: 'When her required days of purification are over, whether she gave birth to a son or a daughter, she must bring two offerings to the priest at the entrance of the tent of meeting: a one-year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be called a “purification offering.” Here it addresses ritual impurity and does not mean that childbirth was a moral sin.
    reason: lexical_alternative
