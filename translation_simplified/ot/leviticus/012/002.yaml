translation:
  language: en
  text: 'Tell the sons of Israel: “If[a] a woman conceives and gives birth to a boy, she will be unclean[b] for seven days. During that time, she will be unclean just as she is during her menstrual period.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When.” The Hebrew introduces a case that may be expressed with either word.
    reason: lexical_alternative
  - marker: b
    text: Here “unclean” describes ritual impurity, not moral guilt.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Speak to the sons of Israel, saying
  simplified_phrase: Tell the sons of Israel
  preserved_meaning: God commands that this instruction be given to the covenant people.
  reasoning_layer_used: Lexical and theological decisions on בְּנֵי יִשְׂרָאֵל
  rationale: The shorter command is natural English while retaining “sons of Israel.”
- pob_phrase: gives birth to a male child
  simplified_phrase: gives birth to a boy
  preserved_meaning: The law concerns the birth of male offspring.
  reasoning_layer_used: Lexical decision on וְיָלְדָה זָכָר
  rationale: “Boy” clearly preserves the male-sex reference in ordinary English.
- pob_phrase: she shall be unclean as in the days of her menstrual impurity
  simplified_phrase: During that time, she will be unclean just as she is during her menstrual period
  preserved_meaning: Her seven-day uncleanness is compared with her menstrual uncleanness.
  reasoning_layer_used: Lexical decisions on כִּימֵי נִדַּת דְּוֺתָהּ and repeated תִּטְמָא
  rationale: The sentence explains the comparison directly while preserving the repeated declaration of uncleanness.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “unclean” as moral condemnation.
    mitigation: A cultural footnote identifies it as ritual impurity rather than guilt.
  - risk: “If” may sound as though childbirth is merely hypothetical.
    mitigation: The footnote preserves “when” as the contextual alternative.
