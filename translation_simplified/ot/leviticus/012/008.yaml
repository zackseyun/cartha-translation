- pob_phrase: then she shall take
  simplified_phrase: she must bring
  preserved_meaning: She is required to provide the less costly bird offerings.
  reasoning_layer_used: POB translation and immediate sacrificial context
  rationale: “Must bring” states the requirement in natural modern English.
- pob_phrase: one for a burnt offering and one for a sin offering
  simplified_phrase: One will be a burnt offering, and the other a sin offering.
  preserved_meaning: The two birds serve distinct sacrificial purposes.
  reasoning_layer_used: POB lexical decisions for עֹלָה and חַטָּאת
  rationale: A separate sentence makes the two offerings easier to distinguish.
- pob_phrase: and the priest shall make atonement for her, and she shall be clean
  simplified_phrase: The priest will make atonement for her, and she will then be ritually clean.
  preserved_meaning: The priestly rite results in her restoration to ritual cleanness.
  reasoning_layer_used: POB lexical rationales for כפר and טהר
  rationale: Modern verb forms and “then” clarify the sequence without weakening the ritual meaning.
interpretive_expansions:
- pob_phrase: she shall be clean
  rendering: she will then be ritually clean
  claim: The cleanness in view is ritual status rather than ordinary hygiene or moral innocence.
  evidence:
