translation:
  language: en
  text: But if she cannot afford a lamb, she must bring two turtledoves or two young pigeons. One will be a burnt offering, and the other a sin offering.[a] The priest will make atonement for her, and she will then be ritually clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” Here the offering concerns ritual impurity after childbirth, not personal moral wrongdoing.
    reason: lexical_alternative
