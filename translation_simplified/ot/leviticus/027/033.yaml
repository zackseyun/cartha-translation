translation:
  language: en
  text: No one is to judge whether the animal is good or bad or exchange it for another. If someone does exchange it anyway, both the original animal and its replacement will be holy. It may not be redeemed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “redeemed” means bought back from its status as an animal set apart for God.
    reason: simplification_note
simplification_decisions:
- pob_phrase: He shall not inspect whether it is good or bad
  simplified_phrase: No one is to judge whether the animal is good or bad
  preserved_meaning: The owner must not evaluate the animal's quality when it is selected.
  reasoning_layer_used: Lexical decisions for יְבַקֵּר and בֵּין טוֹב לָרַע
  rationale: “Judge whether” clearly expresses the qualitative distinction being forbidden.
- pob_phrase: nor shall he exchange it; and if he does in fact exchange it
  simplified_phrase: or exchange it for another. If someone does exchange it anyway
  preserved_meaning: Replacing the selected animal is forbidden, but the law states what happens if someone does so.
  reasoning_layer_used: Lexical decision for יְמִירֶנּוּ and the intensified הָמֵר יְמִירֶנּוּ
  rationale: “Anyway” naturally preserves the Hebrew emphasis and the act's prohibited character.
- pob_phrase: both it and its substitute shall be holy
  simplified_phrase: both the original animal and its replacement will be holy
  preserved_meaning: Both animals become consecrated to God.
  reasoning_layer_used: Lexical and theological decisions for הוּא וּתְמוּרָתוֹ and קֹדֶשׁ
  rationale: Naming the original animal removes pronoun ambiguity while retaining “holy.”
translation_notes:
  risk_flags:
  - risk: “Redeemed” may sound purely spiritual to a modern reader.
    mitigation: The footnote explains its legal meaning here while preserving the important biblical term.
  - risk: The singular “it” leaves its precise referent less explicit after both animals are mentioned.
    mitigation: The wording retains the source and POB ambiguity rather than resolving it into a plural prohibition.
