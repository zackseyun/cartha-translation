translation:
  language: en
  text: But no one may dedicate a firstborn livestock animal to Yahweh, because it already belongs to Yahweh. This applies whether it is an ox or a sheep.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to either a sheep or a goat.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a firstborn among the livestock, which as a firstborn belongs to Yahweh
  simplified_phrase: a firstborn livestock animal ... because it already belongs to Yahweh
  preserved_meaning: Every firstborn livestock animal is already Yahweh’s by prior claim.
  reasoning_layer_used: lexical and theological decisions
  rationale: The cause clause states the verse’s legal logic directly.
- pob_phrase: no man may consecrate
  simplified_phrase: no one may dedicate
  preserved_meaning: A person may not offer the animal to Yahweh by a new act of consecration.
  reasoning_layer_used: lexical decision
  rationale: “No one” expresses the generic Hebrew, while “dedicate” is clearer than “consecrate.”
- pob_phrase: whether an ox or a sheep
  simplified_phrase: This applies whether it is an ox or a sheep
  preserved_meaning: The rule covers firstborn animals from both named livestock classes.
  reasoning_layer_used: lexical decision
  rationale: A separate sentence makes the scope of the rule easier to follow.
interpretive_expansions:
- pob_phrase: it belongs to Yahweh
  rendering: because it already belongs to Yahweh
  claim: Prior ownership is the reason the animal cannot be newly dedicated.
