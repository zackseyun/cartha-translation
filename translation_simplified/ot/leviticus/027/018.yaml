translation:
  language: en
  text: But if he consecrates his field after the Jubilee, the priest must calculate the amount for him based on how many years remain until the Jubilee year. That amount must be deducted from your valuation.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: calculate the money for him according to the years remaining
  simplified_phrase: calculate the amount for him based on how many years remain
  preserved_meaning: The priest determines a monetary amount in proportion to the remaining years.
  reasoning_layer_used: POB lexical decision for וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף and עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  rationale: “Amount” and “based on” express the legal calculation more naturally in modern English.
- pob_phrase: and it shall be deducted from your valuation
  simplified_phrase: That amount must be deducted from your valuation
  preserved_meaning: The calculated sum is subtracted from the valuation previously specified.
  reasoning_layer_used: POB lexical and theological decisions for וְנִגְרַע מֵעֶרְכֶּךָ
  rationale: Naming “that amount” removes an unclear pronoun while retaining the singular legal address “your.”
- pob_phrase: consecrates his field
  simplified_phrase: consecrates his field
  preserved_meaning: The owner sets his field apart as holy to the LORD.
  reasoning_layer_used: POB cultic terminology decision for יַקְדִּישׁ
  rationale: The key sacred-legal term is retained because a simpler generic word would weaken its meaning.
