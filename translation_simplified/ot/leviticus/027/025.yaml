translation:
  language: en
  text: Every value you assign must use the sanctuary shekel[a] as the standard. One shekel equals twenty gerahs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sanctuary shekel was the official standard of weight used for sanctuary-related valuations; it equaled twenty gerahs.
    reason: cultural_note
