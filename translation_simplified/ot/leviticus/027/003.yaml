translation:
  language: en
  text: For a male from twenty years old up to sixty years old, you must set the valuation at fifty shekels of silver, measured by the sanctuary’s standard weight.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel was a unit of weight. Here, the sanctuary shekel was the sacred standard used to measure the silver.
    reason: cultural_note
simplification_decisions:
- pob_phrase: your valuation for the male
  simplified_phrase: For a male ... you must set the valuation
  preserved_meaning: The addressee assigns a legal valuation to the male category, not the person’s intrinsic worth.
  reasoning_layer_used: Lexical and theological decisions on עֶרְכְּךָ and הַזָּכָר
  rationale: Active wording makes the required assignment clear while preserving the legal category and sex distinction.
- pob_phrase: shall be fifty shekels of silver
  simplified_phrase: you must set the valuation at fifty shekels of silver
  preserved_meaning: The amount is a binding legal prescription rather than a prediction.
  reasoning_layer_used: Lexical decision on repeated וְהָיָה
  rationale: “Must set” expresses the stipulative force in plain modern English.
- pob_phrase: according to the sanctuary shekel
  simplified_phrase: measured by the sanctuary’s standard weight
  preserved_meaning: The silver amount is measured according to the sacred sanctuary standard.
  reasoning_layer_used: Lexical decision and POB footnote on בְּשֶׁקֶל הַקֹּדֶשׁ
  rationale: The wording explains the unfamiliar expression without adding where the standard was kept.
