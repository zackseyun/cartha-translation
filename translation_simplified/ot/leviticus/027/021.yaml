translation:
  language: en
  text: But when the field is released in the Jubilee year,[a] it will become holy to Yahweh, like a field permanently given over to Yahweh.[b] It will become the priest’s property.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Jubilee was the appointed year when property was released or returned.
    reason: cultural_note
  - marker: b
    text: Or “placed under the ban.” The Hebrew describes something permanently given to Yahweh and removed from ordinary human use.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when it is released in the Jubilee
  simplified_phrase: when the field is released in the Jubilee year
  preserved_meaning: The field is released at the legally appointed Jubilee.
  reasoning_layer_used: Lexical decisions for בְּצֵאתוֹ and בַיֹּבֵל
  rationale: Adding “year” makes the historical occasion immediately understandable.
- pob_phrase: like a field devoted to destruction
  simplified_phrase: like a field permanently given over to Yahweh
  preserved_meaning: The field is irrevocably consecrated to Yahweh and removed from ordinary use.
  reasoning_layer_used: Theological decision and footnote for חֵרֶם
  rationale: This preserves the term’s severity without implying that the land is physically destroyed.
- pob_phrase: it shall be the priest’s possession
  simplified_phrase: It will become the priest’s property.
  preserved_meaning: The field is transferred to the priest as a landed holding.
  reasoning_layer_used: Lexical decision for לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  rationale: “Property” expresses the land-law result in familiar English.
interpretive_expansions:
- pob_phrase: like a field devoted to destruction
  rendering: like a field permanently given over to Yahweh
  claim: The devotion is irrevocable and removes the field from ordinary human use.
  evidence:
