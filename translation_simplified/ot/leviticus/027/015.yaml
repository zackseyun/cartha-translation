translation:
  language: en
  text: If the person who consecrated his house to the LORD buys it back, he must pay the assessed value in silver plus one-fifth of that amount. Then the house will belong to him again.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the one who consecrated it redeems his house
  simplified_phrase: the person who consecrated his house to the LORD buys it back
  preserved_meaning: The owner regains a house he had set apart as holy by making the required payment.
  reasoning_layer_used: Lexical and theological decisions for הַמַּקְדִּישׁ and יִגְאַל
  rationale: “Buys it back” clearly expresses redemption by payment while “consecrated” keeps the sacred setting.
- pob_phrase: he shall add a fifth of the silver of your valuation to it
  simplified_phrase: he must pay the assessed value in silver plus one-fifth of that amount
  preserved_meaning: The required payment is the priestly valuation with an additional one-fifth.
  reasoning_layer_used: Lexical decisions and POB cultural footnote b
  rationale: The revised order makes the total payment clear while preserving silver and the one-fifth surcharge.
- pob_phrase: it shall be his
  simplified_phrase: Then the house will belong to him again
  preserved_meaning: Payment restores the house to the former owner.
  reasoning_layer_used: Lexical decision for וְהָיָה לוֹ
  rationale: Naming the house and restored ownership removes unclear pronouns.
