translation:
  language: en
  text: If a man sets apart part of his hereditary field as holy to Yahweh, you must assess the field by how much seed is needed to sow it. Land requiring one homer[a] of barley seed is valued at fifty shekels[b] of silver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A homer was a large ancient dry measure.
    reason: cultural_note
  - marker: b
    text: A shekel was a unit of weight used to value silver.
    reason: cultural_note
simplification_decisions:
- pob_phrase: consecrates to Yahweh
  simplified_phrase: sets apart ... as holy to Yahweh
  preserved_meaning: The field is placed in a holy status for Yahweh, not merely given for ordinary use.
  reasoning_layer_used: POB lexical decision for יַקְדִּישׁ
  rationale: This wording explains the ritual meaning of “consecrates” in common English.
- pob_phrase: part of the field of his possession
  simplified_phrase: part of his hereditary field
  preserved_meaning: Only part of the man's hereditary landholding is in view.
  reasoning_layer_used: POB lexical rationale and footnote for מִשְּׂדֵה אֲחֻזָּתוֹ
  rationale: “Hereditary field” preserves the legal landholding sense without implying a recent inheritance.
- pob_phrase: your valuation shall be according to its seed requirement
  simplified_phrase: you must assess the field by how much seed is needed to sow it
  preserved_meaning: The field's assessed value is based on the quantity of seed required for sowing.
  reasoning_layer_used: POB lexical decisions for עֶרְכְּךָ and לְפִי זַרְעוֹ
  rationale: Active wording clearly explains both the assessment and its agricultural basis.
