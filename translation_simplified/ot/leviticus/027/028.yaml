  text: However, anything that a man permanently devotes[a] to the LORD from what he owns—whether a human, an animal, or a field from his inherited property—must not be sold or bought back. Everything devoted in this way is most holy to the LORD.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term means something irrevocably set apart to the LORD; in some contexts it can also mean something placed under a ban or devoted to destruction.
    reason: lexical_alternative
