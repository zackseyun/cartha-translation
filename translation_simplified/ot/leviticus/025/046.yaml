translation:
  language: en
  text: You may leave them as an inheritance to your sons after you. They may be your sons’ permanent property, and you may make them work. But no man may rule harshly over his brother, a son of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” and “son of Israel” preserve the Hebrew kinship language for fellow Israelites.
    reason: cultural_note
simplification_decisions:
- pob_phrase: pass them on as an inheritance to your sons after you
  simplified_phrase: leave them as an inheritance to your sons after you
  preserved_meaning: The people held as property could be transferred to sons by inheritance.
  reasoning_layer_used: POB lexical decisions for וְהִתְנַחֲלְתֶּם and לִבְנֵיכֶם אַחֲרֵיכֶם
  rationale: “Leave them” is ordinary English, while “after you” avoids fixing the transfer to an unstated precise time.
- pob_phrase: to inherit as a possession permanently
  simplified_phrase: They may be your sons’ permanent property
  preserved_meaning: The permission concerns enduring hereditary ownership rather than temporary service.
  reasoning_layer_used: POB lexical and theological decisions on אֲחֻזָּה and לְעֹלָם
  rationale: The wording clearly states permanent property status while preserving the law’s permissive force.
- pob_phrase: from them you may exact labor
  simplified_phrase: you may make them work
  preserved_meaning: Those held as property could be compelled to labor.
  reasoning_layer_used: POB lexical decision for בָּהֶם תַּעֲבֹדוּ
  rationale: “Make them work” is common English and does not soften the coercion.
translation_notes:
  risk_flags:
  - risk: “Leave them” may suggest transfer specifically by a will.
    mitigation: “As an inheritance” and “after you” retain the broader hereditary-transfer sense.
  - risk: “Make them work” is less formal than “exact labor.”
    mitigation: The permanent-property wording keeps the coercive legal setting explicit.
