simplification_decisions:
- pob_phrase: carry out my statutes and keep my judgments
  simplified_phrase: follow the laws I have established and obey my legal decisions
  preserved_meaning: God commands Israel to obey two distinct kinds of covenant law.
  reasoning_layer_used: lexical decisions
  rationale: The wording explains the two legal terms while keeping them distinct.
- pob_phrase: and do them
  simplified_phrase: Put them into practice.
  preserved_meaning: The repeated command stresses actual obedience.
  reasoning_layer_used: lexical decision on וַעֲשִׂיתֶם ... אֹתָם
  rationale: A separate short sentence preserves the Hebrew repetition without sounding awkward.
- pob_phrase: you shall dwell in the land securely
  simplified_phrase: you will live safely in the land
  preserved_meaning: Israel will have settled, secure life in the promised land.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Live safely” is common English and retains the covenant land setting.
interpretive_expansions:
