translation:
  language: en
  text: Follow the laws I have established and obey my legal decisions. Put them into practice. Then you will live safely in the land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the land” means the land promised to Israel.
