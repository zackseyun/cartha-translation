translation:
  language: en
  text: If a resident foreigner among you gains enough wealth, while your brother[a] beside him becomes poor and sells himself to that foreigner or to a member of the foreigner’s clan,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a fellow Israelite, not necessarily a literal brother.
    reason: simplification_note
  - marker: b
    text: The Hebrew expression is difficult; it may more literally refer to the stock or offshoot of a foreigner’s family.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the means of a resident foreigner among you become sufficient
  simplified_phrase: a resident foreigner among you gains enough wealth
  preserved_meaning: The resident foreigner acquires sufficient financial resources.
  reasoning_layer_used: Lexical decision for תַשִּׂיג יַד
  rationale: This expresses the financial idiom in ordinary English without implying great riches.
- pob_phrase: your brother beside him becomes poor
  simplified_phrase: your brother beside him becomes poor
  preserved_meaning: The fellow Israelite becomes impoverished in relation to the prosperous foreigner.
  reasoning_layer_used: Lexical and theological decisions for אָחִיךָ and עִמּוֹ
  rationale: The wording retains both the law’s kinship language and the broad relational sense of “beside him.”
- pob_phrase: sells himself to the resident foreigner among you, or to a member of the foreigner’s clan
  simplified_phrase: sells himself to that foreigner or to a member of the foreigner’s clan
  preserved_meaning: Because of poverty, he enters service under the foreigner or someone in that foreigner’s clan.
  reasoning_layer_used: Lexical and theological decisions for וְנִמְכַּר and לְעֵקֶר מִשְׁפַּחַת גֵּר
  rationale: “That foreigner” removes repetition while preserving self-sale and the difficult clan expression.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “brother” as only a biological sibling.
    mitigation: Footnote a identifies the contextual referent as a fellow Israelite.
  - risk: The Hebrew expression behind “member of the foreigner’s clan” is uncertain.
    mitigation: Footnote b preserves the more literal possibilities without displacing POB’s likely sense.
