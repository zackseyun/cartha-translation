  text: Year by year, he must be treated like a hired worker by his owner. The owner must not rule over him harshly in your presence.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Like a hired worker year by year he shall be with him
  simplified_phrase: Year by year, he must be treated like a hired worker by his owner
  preserved_meaning: The Israelite remains with the owner but must be regarded like a hired worker rather than a slave.
  reasoning_layer_used: lexical and theological decisions
  rationale: This keeps the live comparison without turning it into a formal legal status.
- pob_phrase: he shall not rule over him harshly
  simplified_phrase: The owner must not rule over him harshly
  preserved_meaning: The owner is forbidden to exercise harsh mastery over the Israelite.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: Naming the owner resolves the unclear pronoun while preserving the prohibition.
- pob_phrase: in your sight
  simplified_phrase: in your presence
  preserved_meaning: The addressed Israelite relative witnesses the owner's conduct.
  reasoning_layer_used: lexical decision
  rationale: “In your presence” gives the witnessed setting in natural modern English.
interpretive_expansions:
