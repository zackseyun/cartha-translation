translation:
  language: en
  text: If one of the Levites redeems a house in a city belonging to him, the house must be released from the sale in the Jubilee year. This is because the houses in the Levites’ cities are their property among the sons of Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sale of the house in the city of his possession shall be released
  simplified_phrase: the house must be released from the sale
  preserved_meaning: The sold house leaves the buyer’s possession under the Jubilee law.
  reasoning_layer_used: POB lexical decisions for וְיָצָא and מִמְכַּר
  rationale: This recasts the dense legal wording while preserving the reversal of the sale.
- pob_phrase: the city of his possession
  simplified_phrase: a city belonging to him
  preserved_meaning: The house is in a city connected to the Levite’s recognized holding.
  reasoning_layer_used: POB lexical decision for וְעִיר אֲחֻזָּתוֹ and grounding review
  rationale: This preserves the legal connection without implying that one Levite owns the entire city.
- pob_phrase: the houses of the cities of the Levites are their possession
  simplified_phrase: the houses in the Levites’ cities are their property
  preserved_meaning: These houses form part of the Levites’ legally recognized holding.
  reasoning_layer_used: POB lexical decisions for בָתֵּי עָרֵי הַלְוִיִּם and אֲחֻזָּתָם
  rationale: Common syntax and “property” make the legal claim easier to understand.
interpretive_expansions:
- pob_phrase: shall be released in the Jubilee
  rendering: the house must be released from the sale in the Jubilee year
  claim: At Jubilee, the sold house leaves the sale arrangement and the buyer’s possession.
  evidence:
  - The POB rationale says the sold property leaves the buyer’s possession and returns.
  - The POB says מִמְכַּר can denote either the sale or the thing sold.
  confidence: high
  alternatives_preserved:
  - shall go out
  - shall revert
translation_notes:
  risk_flags:
