translation:
  language: en
  text: If your brother becomes poor and can no longer support himself while living among you,[a] you must help him so that he can keep living beside you as a resident foreigner or a temporary resident.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “his hand falters with you,” a picture of losing the means to support himself.
    reason: lexical_alternative
  - marker: b
    text: The compressed Hebrew may instead mean, “support him—the resident foreigner and the temporary resident.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: his hand falters beside you
  simplified_phrase: can no longer support himself while living among you
  preserved_meaning: He has lost the means to provide for himself while remaining in the community.
  reasoning_layer_used: Lexical decision for וּמָטָה יָדוֹ עִמָּךְ and its documented idiomatic sense
  rationale: The main text explains the economic idiom, while footnote a preserves its hand image.
- pob_phrase: then you shall support him
  simplified_phrase: you must help him
  preserved_meaning: Helping the poor community member is a binding command.
  reasoning_layer_used: Lexical decision for וְהֶחֱזַקְתָּ בּוֹ
  rationale: “Must help” uses direct common English while retaining the command’s force.
- pob_phrase: so that he may live beside you
  simplified_phrase: so that he can keep living beside you
  preserved_meaning: The support enables him to continue living within the community.
  reasoning_layer_used: Lexical decisions for וָחַי and עִמָּךְ plus the doctrine-realignment revision
  rationale: “Keep living” naturally expresses the intended result without weakening the relational sense.
