translation:
  language: en
  text: But if only a few years remain until the Year of Jubilee,[a] the two of them must calculate the amount based on those remaining years. He must then pay that amount as his redemption price.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Year of Jubilee was the appointed year when Israelite debt-servants went free and ancestral property returned to its family. The redemption price therefore depended on how many years remained until that release.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he shall calculate with him
  simplified_phrase: the two of them must calculate the amount
  preserved_meaning: The accounting is carried out between both parties.
  reasoning_layer_used: The lexical rationale identifies interpersonal accounting between the parties.
  rationale: This replaces an awkward legal formula with direct modern wording.
- pob_phrase: according to his years
  simplified_phrase: based on those remaining years
  preserved_meaning: The payment is proportional to the years left before Jubilee.
  reasoning_layer_used: The lexical decision says the phrase indicates proportion or accordance.
  rationale: Naming the remaining years makes the calculation clear.
- pob_phrase: he shall repay his redemption
  simplified_phrase: He must then pay that amount as his redemption price
  preserved_meaning: He must pay the financial amount required for his release.
  reasoning_layer_used: The POB footnote and lexical rationale define redemption here as a required payment.
  rationale: Concrete financial wording avoids an abstract reading of redemption.
interpretive_expansions:
- pob_phrase: his redemption
  rendering: that amount as his redemption price
  claim: Redemption here means the payment required for release.
  evidence:
