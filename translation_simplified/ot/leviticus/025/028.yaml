translation:
  language: en
  text: But if he does not have the means to recover the property, it will remain in the buyer’s possession until the year of Jubilee. At the Jubilee, the property will be released from the buyer, and the original owner will return to his property.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “and the property will return to his possession.” The final Hebrew verb may refer to the property rather than the original owner.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: if his hand does not find enough to restore it to him
  simplified_phrase: if he does not have the means to recover the property
  preserved_meaning: The seller lacks sufficient resources to regain the sold property.
  reasoning_layer_used: Lexical decisions for מָצְאָה יָדוֹ, דֵּי, and הָשִׁיב לוֹ
  rationale: The plain wording explains the Hebrew hand idiom as having the necessary means.
- pob_phrase: shall remain in the hand of the one who bought it
  simplified_phrase: will remain in the buyer’s possession
  preserved_meaning: The buyer keeps legal control of the property until Jubilee.
  reasoning_layer_used: Lexical decision for בְּיַד הַקֹּנֶה אֹתוֹ
  rationale: “In the buyer’s possession” states the legal sense of the Hebrew hand idiom directly.
- pob_phrase: it shall go out in the Jubilee
  simplified_phrase: At the Jubilee, the property will be released from the buyer
  preserved_meaning: Jubilee ends the buyer’s possession of the sold property.
  reasoning_layer_used: Lexical decision for וְיָצָא בַּיּוֹבֵל
  rationale: “Released from the buyer” makes the direction of the property’s departure clear.
interpretive_expansions:
- pob_phrase: he shall return to his property
  rendering: the original owner will return to his property
  claim: The final masculine singular subject is identified as the original owner rather than left as a pronoun.
  evidence:
  - The POB theological decision selects the seller or original owner as the most likely subject.
  - The Jubilee context concerns a person regaining access to his hereditary property.
  confidence: moderate
  alternatives_preserved:
  - The sold property may be the subject of the final verb.
translation_notes:
  risk_flags:
  - risk: Naming the original owner as the final subject may appear to settle a genuine Hebrew ambiguity.
    mitigation: The footnote preserves the alternative in which the property returns to his possession.
