- pob_phrase: the sons of the sojourners who reside with you
  simplified_phrase: descendants of the resident foreigners who live among you
  preserved_meaning: They are descendants of non-Israelites residing among Israel.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: Common terms replace the unfamiliar legal term “sojourners” and the overly narrow “sons.”
- pob_phrase: from their families who are with you, whom they have fathered in your land
  simplified_phrase: members of their families who were born to them in your land
  preserved_meaning: The permission includes their offspring born within Israel’s land.
  reasoning_layer_used: POB lexical decisions for מִשְׁפַּחְתָּם and הוֹלִידוּ
  rationale: “Born to them” preserves both descent and birthplace in natural English.
- pob_phrase: and they shall become your possession
  simplified_phrase: They will become your property
  preserved_meaning: Those bought receive the legal status of owned and inheritable property.
  reasoning_layer_used: POB theological decision and lexical rationale for אֲחֻזָּה
  rationale: Direct ownership language preserves the law’s stark force without euphemism.
