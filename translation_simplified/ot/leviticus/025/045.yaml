translation:
  language: en
  text: You may also buy descendants of the resident foreigners who live among you. You may buy members of their families who were born to them in your land. They will become your property.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “property” means property that could be passed down to one’s heirs.
    reason: lexical_alternative
