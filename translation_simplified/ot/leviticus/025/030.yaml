translation:
  language: en
  text: But if a house in a walled city is not redeemed—that is, bought back—within one full year, it will permanently belong to the buyer and the buyer’s family for all future generations. Even at the Jubilee, it will not return to the original owner’s family.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Jubilee was the appointed year when certain property returned to its original family.
    reason: cultural_note
