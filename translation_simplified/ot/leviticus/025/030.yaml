  reasoning_layer_used: Reviewed WLC source text and the contrast between Leviticus 25:29–30 and 25:31
  rationale: The supplied POB omitted the pronominal force meaning “has a wall,” so the corrected wording restores the source and its legal category.
- pob_phrase: shall pass permanently to the one who bought it, throughout his generations
