translation:
  language: en
  text: You must set apart the fiftieth year as holy and proclaim liberty[a] in the land to everyone who lives there. It will be a jubilee year for you. Each of you must return to his property[b], and each must return to his family.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Liberty” means the formal release proclaimed for the jubilee year; “release” or “freedom” are also possible.
    reason: lexical_alternative
  - marker: b
    text: The property is especially an inherited family landholding.
    reason: simplification_note
  - marker: c
    text: Hebrew says “each man”; “family” may also mean “clan.”
    reason: cultural_note
