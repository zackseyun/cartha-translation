translation:
  language: en
  text: The priest must burn the part of the crushed grain and oil that serves as a memorial, together with all the frankincense. This is an offering made by fire to Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall burn its memorial portion from its crushed grain and from its oil
  simplified_phrase: must burn the part of the crushed grain and oil that serves as a memorial
  preserved_meaning: The priest burns the designated memorial portion taken from both the grain and the oil.
  reasoning_layer_used: Lexical decisions for אַזְכָּרָתָהּ, מִגִּרְשָׂהּ, and וּמִשַּׁמְנָהּ
  rationale: The technical phrase is unpacked while keeping the portion’s memorial function and ingredients distinct.
- pob_phrase: with all its frankincense
  simplified_phrase: together with all the frankincense
  preserved_meaning: All the frankincense accompanies the memorial portion in the burning.
  reasoning_layer_used: Lexical decision for עַל כָּל לְבֹנָתָהּ
  rationale: “Together with” makes the accompaniment clear in ordinary English.
- pob_phrase: —an offering made by fire to Yahweh
  simplified_phrase: This is an offering made by fire to Yahweh.
  preserved_meaning: The burning is a sacrificial offering dedicated to Yahweh.
  reasoning_layer_used: Lexical decision for אִשֶּׁה and theological decision for יהוה
  rationale: A separate sentence eases the syntax while retaining the fire-offering term and divine name.
