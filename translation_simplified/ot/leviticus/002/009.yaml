translation:
  language: en
  text: Then the priest must lift out the part of the grain offering set aside as a memorial and burn it on the altar. It is a food offering,[a] a pleasing aroma to the LORD.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall lift up from the grain offering its memorial portion
  simplified_phrase: must lift out the part of the grain offering set aside as a memorial
  preserved_meaning: The priest removes a designated representative portion while the concrete lifting action remains visible.
  reasoning_layer_used: POB lexical decisions for וְהֵרִים and אַזְכָּרָתָהּ
  rationale: This wording explains the ritual term without suggesting that the whole offering is burned.
- pob_phrase: and burn it on the altar, a food offering, a pleasing aroma to Yahweh
  simplified_phrase: and burn it on the altar. It is a food offering, a pleasing aroma to the LORD.
  preserved_meaning: The burned portion is presented as sacrificial food and is pleasing to the LORD.
  reasoning_layer_used: POB theological decision on the sacrificial formula and divine-name doctrine
  rationale: Two sentences make the ritual action and its meaning easier to follow while retaining the aroma image.
translation_notes:
  risk_flags:
  - risk: “Food offering” could be mistaken for ordinary food given because God needs it.
    mitigation: The altar-burning context and the alternative footnote keep the sacrificial meaning clear.
