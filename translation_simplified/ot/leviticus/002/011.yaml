translation:
  language: en
  text: No grain offering you present to Yahweh may be made with leaven. This is because you must not burn any leaven or honey[b] from the offering as a food offering[a] to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “offering by fire.” The Hebrew term means an offering burned on the altar.
    reason: lexical_alternative
  - marker: b
    text: In ancient usage, “honey” could also include fruit syrup, not only bee honey.
    reason: cultural_note
