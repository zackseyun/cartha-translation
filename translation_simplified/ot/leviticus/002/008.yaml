- pob_phrase: and he shall present it to the priest, and he shall bring it near to the altar
  simplified_phrase: Give it to the priest, and he will bring it near the altar
  preserved_meaning: The worshiper hands over the offering, after which the priest takes it near the altar.
  reasoning_layer_used: The lexical rationales preserve the transfer to the priest and the later approach to the altar.
