  preserved_meaning: Oil is applied to the surface of the thin unleavened cakes.
  reasoning_layer_used: Lexical decision for מְשֻׁחִים בַּשָּׁמֶן
  rationale: “Spread with oil” makes the food-preparation action immediately clear.
