  text: If you present a grain offering baked in an oven, it must be made from fine flour—either unleavened cakes mixed with oil or[a] unleavened wafers spread with oil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “and,” but it likely introduces another permitted form of the offering.
