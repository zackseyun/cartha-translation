  rationale: “Present” removes awkward repetition while preserving the ritual action.
- pob_phrase: 'it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers'
  simplified_phrase: it must be made from fine flour—either unleavened cakes mixed with oil or unleavened wafers
  preserved_meaning: Fine flour and the stated oil preparation are required for either permitted form.
  reasoning_layer_used: Source syntax and lexical decisions for סֹלֶת, חַלּוֹת מַצּוֹת, and וּרְקִיקֵי מַצּוֹת
