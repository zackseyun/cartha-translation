translation:
  language: en
  text: He must bring the grain offering to Aaron’s sons, the priests. A priest must take from it a handful of the fine flour and some of the oil, together with all the frankincense. He must burn this memorial portion on the altar as a food offering.[a] Its aroma will be pleasing to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire” or “a fire offering.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He shall bring it
  simplified_phrase: He must bring the grain offering
  preserved_meaning: The required procedure begins by bringing the offering to the priests.
  reasoning_layer_used: Lexical decision for וֶהֱבִיאָהּ and its stated grain-offering context
  rationale: “Must” states the legal requirement naturally, while naming the offering clarifies the pronoun.
- pob_phrase: he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense
  simplified_phrase: A priest must take from it a handful of the fine flour and some of the oil, together with all the frankincense
  preserved_meaning: The priest takes only a handful of flour and some oil but includes all the frankincense.
  reasoning_layer_used: Lexical decisions for וְקָמַץ, מִסָּלְתָּהּ, וּמִשַּׁמְנָהּ, and עַל כָּל לְבֹנָתָהּ
  rationale: The sentence identifies the actor and makes the differing quantities easy to follow.
- pob_phrase: a food offering, a pleasing aroma to Yahweh
  simplified_phrase: as a food offering. Its aroma will be pleasing to Yahweh
  preserved_meaning: The altar burning is a food offering whose aroma signifies divine acceptance.
  reasoning_layer_used: Theological decision for אִשֵּׁה and lexical decision for רֵיחַ נִיחֹחַ
  rationale: Two short sentences preserve both sacrificial images without the dense apposition.
