translation:
  language: en
  text: This law governs the burnt offering, the grain offering, the sin offering[a], the guilt offering[b], the rites for ordaining priests[c], and the peace-offering sacrifice[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering”; this offering deals with both sin and impurity.
    reason: lexical_alternative
  - marker: b
    text: Or “reparation offering”; the term can include liability and required repayment.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term is plural and can refer to the ordination offerings or the wider ordination rites.
    reason: lexical_alternative
  - marker: d
    text: Or “fellowship-offering sacrifice” or “well-being-offering sacrifice.”
    reason: lexical_alternative
