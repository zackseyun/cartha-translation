translation:
  language: en
  text: But if anyone eats any of the meat from his peace offering[a] on the third day, the offering will not be accepted or credited to the person who offered it. It will be something offensive[b], and whoever eats any of it will bear his guilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “peace offering” may also be called a “fellowship offering” or an “offering of well-being.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses a special sacrificial term for an offering that is unacceptable and loathsome.
    reason: source_note
