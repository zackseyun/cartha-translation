  language: en
  text: When he presents a peace offering[a] to give thanks, he must also bring cakes of bread made with yeast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term translated “peace offering” may also be rendered “fellowship offering” or “offering of well-being.”
