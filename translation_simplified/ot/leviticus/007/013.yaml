simplification_decisions:
- pob_phrase: Along with cakes of leavened bread
  simplified_phrase: he must also bring cakes of bread made with yeast
  preserved_meaning: The bread is an additional required part of the offering and is made with leaven.
  reasoning_layer_used: Lexical decisions for עַל, חַלֹּת לֶחֶם, and חָמֵץ
  rationale: “Also bring” clarifies accompaniment, while “made with yeast” explains “leavened” in common English.
- pob_phrase: he shall present his offering with the sacrifice
  simplified_phrase: When he presents a peace offering ... he must also bring
  preserved_meaning: The worshiper presents the bread together with the sacrifice.
  reasoning_layer_used: Lexical decisions for יַקְרִיב, קָרְבָּנוֹ, and זֶבַח
  rationale: The recast sentence makes the required action easier to follow.
- pob_phrase: his peace offerings of thanksgiving
  simplified_phrase: a peace offering to give thanks
  preserved_meaning: This is the thanksgiving form of the peace offering.
  reasoning_layer_used: Theological decision for שְׁלָמִים and lexical decision for תּוֹדַת
  rationale: The wording retains “peace offering” while stating its thankful purpose plainly.
translation_notes:
  risk_flags:
  - risk: “Cakes” may suggest sweet modern cakes.
    mitigation: “Cakes of bread made with yeast” identifies them as bread.
