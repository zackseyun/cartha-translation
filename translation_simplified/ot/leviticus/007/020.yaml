translation:
  language: en
  text: But if anyone who is ritually unclean eats meat from a peace offering that belongs to Yahweh, that person will be cut off from their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “excluded from their people.” “Cut off” may mean expulsion or death, but the Hebrew does not specify how it happens here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the person who eats meat from the sacrifice of peace offerings
  simplified_phrase: if anyone ... eats meat from a peace offering
  preserved_meaning: The law applies generally to anyone who eats meat from this kind of sacrifice.
  reasoning_layer_used: POB lexical decisions and casuistic legal context
  rationale: The conditional form presents the general legal case in natural English.
- pob_phrase: while his uncleanness is on him
  simplified_phrase: who is ritually unclean
  preserved_meaning: The person is in the legally unclean condition that bars eating sacred meat.
  reasoning_layer_used: POB lexical decision and immediate ritual context
  rationale: This prevents readers from mistaking the condition for ordinary dirtiness.
- pob_phrase: that person shall be cut off from his people
  simplified_phrase: that person will be cut off from their people
  preserved_meaning: The offender faces severe removal from the covenant community by an unspecified means.
  reasoning_layer_used: POB theological decision on the penalty formula
  rationale: “Will” states the consequence without implying that a named human agent must impose it.
