translation:
  language: en
  text: If a person touches anything unclean—something unclean from a human being, an unclean animal, or any unclean and detestable thing—and then eats some of the meat from a peace offering that belongs to the LORD, that person must be cut off from their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cut off” may mean exclusion or divine judgment; the Hebrew does not specify how it happens.
    reason: alternative_reading
