  reasoning_layer_used: POB lexical decision for זֶבַח קָרְבָּנוֹ
  rationale: The compact phrase avoids an awkward noun chain while preserving both source ideas.
- pob_phrase: it shall be eaten on the day he presents his sacrifice
  simplified_phrase: it may be eaten on the day he presents it
  preserved_meaning: The offering is permitted to be eaten on the day it is presented without implying that none may remain.
  reasoning_layer_used: POB lexical decision for יֵאָכֵל and immediate context
  rationale: “May” expresses the permitted procedure consistently with the next-day allowance.
- pob_phrase: and on the next day what remains of it may be eaten
  simplified_phrase: Anything left over may be eaten the next day
  preserved_meaning: Eating the remaining sacrificial food on the second day is permitted.
  reasoning_layer_used: POB lexical decisions for וְהַנּוֹתָר מִמֶּנּוּ and יֵאָכֵל
  rationale: Everyday wording and clause order make the permission immediately clear.
