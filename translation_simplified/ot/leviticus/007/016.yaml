translation:
  language: en
  text: But if his sacrificial offering is connected with a vow[a] or is a freewill offering, it may be eaten on the day he presents it. Anything left over may be eaten the next day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a vow offering.” This is distinct from an offering given freely.
    reason: lexical_alternative
