translation:
  language: en
  text: The fat from an animal that died without being properly slaughtered,[a] or from one torn by wild animals, may be used for any other purpose. But you must absolutely not eat it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an animal found dead.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an animal that dies naturally
  simplified_phrase: an animal that died without being properly slaughtered
  preserved_meaning: The animal died apart from proper slaughter.
  reasoning_layer_used: POB lexical decision for נְבֵלָה
  rationale: This avoids limiting the phrase to natural causes of death.
- pob_phrase: one torn by beasts
  simplified_phrase: one torn by wild animals
  preserved_meaning: The animal was torn by predators without implying dismemberment.
  reasoning_layer_used: POB lexical decision for טְרֵפָה and grounding review
  rationale: “Wild animals” is clearer than “beasts,” while “torn” avoids the added force of “torn apart.”
- pob_phrase: for any work; but you must certainly not eat it
  simplified_phrase: for any other purpose. But you must absolutely not eat it
  preserved_meaning: The fat is broadly available for practical use, but eating it is emphatically forbidden.
  reasoning_layer_used: POB lexical decisions for לְכָל מְלָאכָה and וְאָכֹל לֹא תֹאכְלֻהוּ
  rationale: The wording keeps the broad permission and the specific emphatic ban distinct.
interpretive_expansions:
- pob_phrase: an animal that dies naturally
  rendering: an animal that died without being properly slaughtered
  claim: The term concerns an animal that died apart from proper slaughter, not only one that died from natural causes.
  evidence:
  - The POB lexical rationale explicitly identifies death without proper slaughter.
  confidence: high
  alternatives_preserved:
  - an animal found dead
translation_notes:
  risk_flags:
  - risk: “Without being properly slaughtered” makes the legal sense more explicit than the Hebrew term alone.
    mitigation: The wording follows the POB lexical rationale, and the footnote preserves the alternative “found dead.”
  - risk: “Any other purpose” could be read as broader than the Hebrew phrase “any work.”
    mitigation: The separate sentence retains the verse’s precise prohibition against eating rather than excluding all food-related use.
