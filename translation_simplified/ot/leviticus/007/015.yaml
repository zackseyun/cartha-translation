translation:
  language: en
  text: The meat from his thanksgiving peace offering[a] must be eaten on the day he presents it. He must not leave any of it until morning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offering for thanksgiving.”
