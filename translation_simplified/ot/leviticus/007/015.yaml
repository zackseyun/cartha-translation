simplification_decisions:
- pob_phrase: the flesh of the sacrifice of his thanksgiving peace offering
  simplified_phrase: the meat from his thanksgiving peace offering
  preserved_meaning: The meat comes from the sacrificed animal given as a peace offering for thanksgiving.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: “Meat from” removes a dense sacrificial construction while retaining the specific offering category.
- pob_phrase: shall be eaten on the day of his offering
  simplified_phrase: must be eaten on the day he presents it
  preserved_meaning: The offerer is required to have the meat eaten on the day the offering is presented.
  reasoning_layer_used: POB lexical decision for בְּיוֹם קָרְבָּנוֹ and יֵאָכֵל
  rationale: The active time clause and “must” state the instruction in direct modern English.
- pob_phrase: he shall not leave any of it until morning
  simplified_phrase: He must not leave any of it until morning
  preserved_meaning: No portion may remain overnight.
  reasoning_layer_used: POB lexical decisions for לֹא יַנִּיחַ, מִמֶּנּוּ, and עַד בֹּקֶר
  rationale: A separate sentence makes the prohibition immediate and easy to follow.
