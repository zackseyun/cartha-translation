translation:
  language: en
  text: Tell the sons of Israel:[a] Anyone who presents a peace sacrifice[b] to the LORD must bring an offering to the LORD from that peace sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the children of Israel” or “the Israelites.” The Hebrew is literally “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Traditionally “peace offering”; some versions say “fellowship offering.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Speak to the sons of Israel, saying
  simplified_phrase: Tell the sons of Israel
  preserved_meaning: God directs Moses to give this instruction to Israel’s covenant community.
  reasoning_layer_used: POB lexical decision for דַּבֵּר and gendered covenantal-address decision
  rationale: “Tell” removes the formal speech formula while retaining the command and the source-driven masculine wording.
- pob_phrase: The one who presents
  simplified_phrase: Anyone who presents
  preserved_meaning: The rule applies to each person who presents this sacrifice.
  reasoning_layer_used: POB lexical decision for הַמַּקְרִיב
  rationale: “Anyone who” is more natural English while “presents” retains the sacrificial action.
- pob_phrase: shall bring
  simplified_phrase: must bring
  preserved_meaning: This is a binding instruction, not a prediction.
  reasoning_layer_used: POB lexical decision for יָבִיא
  rationale: “Must” expresses the legal obligation more clearly for modern readers.
