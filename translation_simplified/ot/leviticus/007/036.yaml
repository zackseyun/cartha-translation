translation:
  language: en
  text: On the day Yahweh anointed the priests, he commanded the people of Israel to give them these portions. This is an everlasting law for all their generations.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: which Yahweh commanded to be given to them from the sons of Israel
  simplified_phrase: Yahweh ... commanded the people of Israel to give them these portions
  preserved_meaning: Yahweh authoritatively required Israel to provide the priests’ allotted portions.
  reasoning_layer_used: Immediate context and lexical decisions for צִוָּה, לָתֵת, and מֵאֵת בְּנֵי יִשְׂרָאֵל.
  rationale: The passive relative clause becomes a direct sentence without weakening the command.
- pob_phrase: on the day he anointed them
  simplified_phrase: On the day Yahweh anointed the priests
  preserved_meaning: The command was given on the day Yahweh anointed Aaron and his sons.
  reasoning_layer_used: Lexical decision for מָשְׁחוֹ אֹתָם and immediate context.
  rationale: Naming Yahweh and the priests makes both pronouns clear while retaining the specific act of anointing.
- pob_phrase: an everlasting statute throughout their generations
  simplified_phrase: an everlasting law for all their generations
  preserved_meaning: The requirement remains binding across successive generations of Israel.
  reasoning_layer_used: Lexical and theological decisions for חֻקַּת עוֹלָם and לְדֹרֹתָם.
  rationale: “Law” is more familiar than “statute,” while “everlasting” and the generation language preserve its enduring legal force.
interpretive_expansions:
- pob_phrase: them ... from the sons of Israel
  rendering: the people of Israel to give them these portions
  claim: The Israelites are the givers, and the priests receive the portions described in the preceding context.
  evidence:
  - The POB lexical rationale identifies Israel as the source of the priestly dues.
  - The immediate context identifies Aaron and his sons as the recipients.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Everlasting” may be read as making a broader theological claim than this priestly law states.
    mitigation: The phrase “for all their generations” keeps the claim tied to its covenantal setting.
