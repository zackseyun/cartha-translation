translation:
  language: en
  text: He must put his hand on the goat’s head. Then he must slaughter the goat before Yahweh, at the same place where they slaughter the burnt offering. It is a sin offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer both to sin and to the offering that deals with sin or impurity.
    reason: lexical_alternative
