  preserved_meaning: The worshiper is required to perform the ritual gesture with one hand on the goat’s head.
  reasoning_layer_used: POB lexical decisions for וְסָמַךְ, יָדוֹ, and עַל רֹאשׁ הַשָּׂעִיר
  rationale: “Must put” states the required action in direct, common English while preserving the singular hand.
- pob_phrase: and slaughter it
  simplified_phrase: Then he must slaughter the goat
  preserved_meaning: The goat is ritually killed after the laying on of the hand.
  reasoning_layer_used: POB lexical decision for וְשָׁחַט אֹתוֹ
  rationale: A new sentence clarifies the sequence, and “slaughter” retains the sacrificial setting.
- pob_phrase: in the place where they slaughter the burnt offering before Yahweh
