translation:
  language: en
  text: If the anointed priest sins and this brings guilt on the people, he must present to Yahweh a bull from the herd that has no defects. He must offer it as a sin offering for the sin he committed.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The anointed priest here may refer to the anointed high priest.
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase about guilt is compact and may also be translated “resulting in the people’s guilt.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: then he shall present for the sin that he has committed
  simplified_phrase: he must present ... He must offer it ... for the sin he committed
  preserved_meaning: The priest is required to provide a specific offering because of his sin.
  reasoning_layer_used: The lexical decisions for וְהִקְרִיב and עַל חַטָּאתוֹ אֲשֶׁר חָטָא.
  rationale: Two short sentences make the legal requirement easier to follow.
- pob_phrase: a bull, a son of the herd
  simplified_phrase: a bull from the herd
  preserved_meaning: The required animal is a bull from the cattle herd.
  reasoning_layer_used: The lexical decision for פַּר בֶּן בָּקָר.
  rationale: The natural English phrase avoids the opaque literal expression “son of the herd.”
- pob_phrase: without blemish
  simplified_phrase: that has no defects
  preserved_meaning: The sacrificial animal must be physically acceptable and unblemished.
  reasoning_layer_used: The lexical decision for תָּמִים.
  rationale: Common wording explains the ritual requirement without weakening it.
