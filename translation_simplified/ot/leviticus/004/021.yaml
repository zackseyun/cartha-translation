translation:
  language: en
  text: He must take the bull outside the camp and burn it there, just as he burned the earlier bull. This bull is the community’s sin offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term may emphasize removing impurity as well as dealing with sin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He shall bring the bull outside the camp and burn it
  simplified_phrase: He must take the bull outside the camp and burn it there
  preserved_meaning: The required action is to move the bull beyond the camp and burn it at that location.
  reasoning_layer_used: Lexical decisions for וְהוֹצִיא, אֶל מִחוּץ לַמַּחֲנֶה, and וְשָׂרַף אֹתוֹ
  rationale: “Must take” states the command naturally, while “there” clarifies where the burning occurs.
- pob_phrase: the first bull
  simplified_phrase: the earlier bull
  preserved_meaning: The phrase points back to the bull described in the preceding case.
  reasoning_layer_used: Lexical decision for הַפָּר הָרִאשׁוֹן
  rationale: “Earlier” makes the backward reference clearer than the potentially numbered sense of “first.”
- pob_phrase: It is the sin offering for the assembly
  simplified_phrase: This bull is the community’s sin offering
  preserved_meaning: The bull serves as the corporate sin offering of the gathered covenant community.
  reasoning_layer_used: Lexical and theological decisions for חַטַּאת, הַקָּהָל, and הוּא
  rationale: Naming the bull directly and using the possessive form makes the identification easier to follow.
translation_notes:
  risk_flags:
  - risk: “Community” may sound broader than the gathered covenant assembly.
    mitigation: The wording retains the corporate sense, and the audit identifies the assembly as the covenant community.
