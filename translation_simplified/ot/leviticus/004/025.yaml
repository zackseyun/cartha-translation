translation:
  language: en
  text: Then the priest must use his finger to take some blood from the sin offering[a] and put it on the horn-shaped projections of the altar used for burnt offerings. He must pour the rest of the blood at the base of that altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to an offering connected with removing impurity as well as sin.
    reason: lexical_alternative
