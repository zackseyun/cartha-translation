translation:
  language: en
  text: Then the anointed priest must take some of the bull’s blood and carry it into the tent of meeting.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “to the tent of meeting”; “into” fits the ritual context, since the next actions take place inside.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And ... shall take
  simplified_phrase: Then ... must take
  preserved_meaning: The action continues the ordered ritual instructions and is required of the priest.
  reasoning_layer_used: Lexical rationale for וְלָקַח and the procedural context
  rationale: “Then” marks the sequence, while “must” expresses the command in common modern English.
- pob_phrase: and bring it into
  simplified_phrase: and carry it into
  preserved_meaning: The priest moves the portion of blood inside the sanctuary.
  reasoning_layer_used: Lexical rationale for וְהֵבִיא אֹתוֹ and contextual rationale for אֶל
  rationale: “Carry” makes the physical movement of the blood immediately clear.
translation_notes:
  risk_flags:
