  rationale: This shortens the clause while preserving the Hebrew passive ambiguity.
- pob_phrase: then he shall bring
  simplified_phrase: he must bring
  preserved_meaning: The law requires him to bring the offering.
  reasoning_layer_used: lexical decision for וְהֵבִיא
  rationale: “Must” states the prescriptive force in direct modern English.
- pob_phrase: a female goat without blemish as his offering for the sin that he has committed
  simplified_phrase: a female goat with no defects as his offering for that sin
  preserved_meaning: The required offering is a defect-free female goat brought for the committed sin.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording explains the sacrificial condition and removes needless repetition.
