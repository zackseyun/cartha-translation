translation:
  language: en
  text: Or if the sin he committed becomes known to him,[a] he must bring a female goat with no defects as his offering for that sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that someone informs him or that he comes to recognize the sin himself.
