  preserved_meaning: The priest burns the several removed portions of fat.
  reasoning_layer_used: Hebrew grammar decision for אֹתָם
  rationale: Naming the plural referent avoids an unclear pronoun.
- pob_phrase: on the food offerings of Yahweh
