translation:
  language: en
  text: He must remove all its fat, just as fat is removed from a lamb sacrificed as a peace offering. The priest must burn the pieces of fat on the altar with Yahweh’s offerings made by fire. In this way, the priest will make atonement for him because of the sin he committed, and he will be forgiven.
