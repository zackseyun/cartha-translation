translation:
  language: en
  text: If the whole congregation of Israel sins unintentionally by doing something Yahweh has commanded them not to do, and what happened escapes the assembly’s notice, they become guilty.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the matter is hidden from the eyes of the assembly
  simplified_phrase: what happened escapes the assembly’s notice
  preserved_meaning: The community is unaware of the offense.
  reasoning_layer_used: POB lexical decision for וְנֶעְלַם דָּבָר and מֵעֵינֵי הַקָּהָל
  rationale: This turns the Hebrew perception idiom into clear English while preserving its force.
- pob_phrase: they do one of all the things that Yahweh has commanded not to be done
  simplified_phrase: by doing something Yahweh has commanded them not to do
  preserved_meaning: They commit one action prohibited by Yahweh’s commands.
  reasoning_layer_used: POB lexical decision and applied revision for וְעָשׂוּ אַחַת מִכָּל מִצְוֺת
  rationale: This removes awkward legal phrasing without broadening the prohibited act.
- pob_phrase: sins unintentionally ... and they become guilty
  simplified_phrase: sins unintentionally ... they become guilty
  preserved_meaning: An inadvertent offense still results in guilt.
  reasoning_layer_used: POB theological decision for שׁגה and lexical decision for וְאָשֵׁמוּ
  rationale: The wording keeps both the unintentional nature of the sin and its resulting guilt.
