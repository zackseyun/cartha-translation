  simplified_phrase: He must put some of the blood
  preserved_meaning: Only part of the blood is put on the altar’s horns.
  reasoning_layer_used: POB lexical decision for וּמִן הַדָּם and יִתֵּן
  rationale: The direct word order makes the ritual instruction easier to follow while keeping the required action.
- pob_phrase: the horns of the altar
  simplified_phrase: the altar’s horns—the horn-like projections
  preserved_meaning: The literal horn image and the altar feature it names are both retained.
  reasoning_layer_used: POB lexical decision for קַרְנֹת הַמִּזְבֵּחַ
  rationale: A brief explanation makes the ritual term understandable without replacing its source-language image.
- pob_phrase: the altar of burnt offering, which is at the entrance of the tent of meeting
  simplified_phrase: the burnt offering altar, which stands at the entrance to the tent of meeting
  preserved_meaning: The type and location of the altar remain distinct and explicit.
  reasoning_layer_used: POB lexical decisions for מִזְבַּח הָעֹלָה and אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  rationale: The shorter noun phrase and ordinary location wording reduce complexity without losing ritual detail.
