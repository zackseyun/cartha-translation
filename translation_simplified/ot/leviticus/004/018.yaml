translation:
  language: en
  text: He must put some of the blood on the altar’s horns—the horn-like projections of the altar before Yahweh inside the tent of meeting. He must pour out all the blood at the base of the burnt offering altar, which stands at the entrance to the tent of meeting.
  philosophy: optimal-equivalence
