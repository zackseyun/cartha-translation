translation:
  language: en
  text: He must remove all the fat from the sin offering bull. This includes the fat that covers the entrails and all the fat on them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the bull of the purification offering.” The Hebrew term can refer both to sin and to the offering associated with removing sin or impurity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he shall remove from it
  simplified_phrase: He must remove
  preserved_meaning: The appointed person is required to separate the specified fat from the bull.
  reasoning_layer_used: Lexical decision for יָרִים and procedural context
  rationale: “Must remove” states the required ritual action in direct modern English.
- pob_phrase: all the fat of the sin offering bull
  simplified_phrase: all the fat from the sin offering bull
  preserved_meaning: Every designated fat portion is removed from the bull assigned to the sin offering.
  reasoning_layer_used: Lexical decisions for כָּל, חֵלֶב, and פַּר הַחַטָּאת
  rationale: “From” makes the physical removal clear while retaining “sin offering bull.”
- pob_phrase: the fat that covers the entrails and all the fat that is on the entrails
  simplified_phrase: This includes the fat that covers the entrails and all the fat on them
  preserved_meaning: Both the covering fat and the fat situated on the entrails are specified.
  reasoning_layer_used: Lexical decisions for הַמְכַסֶּה and אֲשֶׁר עַל הַקֶּרֶב
  rationale: A second sentence and a pronoun reduce repetition without merging the two locations.
translation_notes:
  risk_flags:
  - risk: “Sin offering” may understate the purification aspect of the Hebrew term.
    mitigation: The footnote preserves “purification offering” as an important lexical alternative.
