translation:
  language: en
  text: If an ordinary member of the community[a] unintentionally sins by doing something forbidden by one of Yahweh’s commandments, that person becomes guilty.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “from the people of the land”; here this means someone who is not a priest or leader.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “incurs guilt” or “is guilty.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one person from the common people
  simplified_phrase: an ordinary member of the community
  preserved_meaning: The law concerns an individual Israelite who is not a priest or leader.
  reasoning_layer_used: POB lexical and theological decisions on מֵעַם הָאָרֶץ
  rationale: This states the social distinction in natural English without suggesting a separate landed class.
- pob_phrase: by doing one of Yahweh’s commandments that must not be done
  simplified_phrase: by doing something forbidden by one of Yahweh’s commandments
  preserved_meaning: The person violates one of Yahweh’s prohibitions.
  reasoning_layer_used: POB lexical decision on אֲשֶׁר לֹא תֵעָשֶׂינָה
  rationale: The recast removes an awkward apparent claim that the commandment itself must not be done.
- pob_phrase: and becomes guilty
  simplified_phrase: that person becomes guilty
  preserved_meaning: The prohibited act results in a state of guilt.
  reasoning_layer_used: POB lexical and theological decisions on וְאָשֵׁם
  rationale: Repeating the subject makes the legal consequence clear after the longer conditional clause.
