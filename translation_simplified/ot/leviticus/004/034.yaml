  preserved_meaning: The priest uses his finger to take only part of the offering’s blood.
  reasoning_layer_used: Lexical decisions for מִדַּם and בְּאֶצְבָּעוֹ
  rationale: The active wording makes the instrument and partitive sense easier to follow.
- pob_phrase: the altar of burnt offering
  simplified_phrase: the altar used for burnt offerings
  preserved_meaning: This is the altar associated with burnt offerings.
  reasoning_layer_used: Lexical decision for מִזְבַּח הָעֹלָה
  rationale: The recast phrase explains the altar’s function in ordinary English.
- pob_phrase: and he shall pour out all its blood at the base of the altar
  simplified_phrase: He must pour out all its blood at the base of the altar.
  preserved_meaning: The priest deliberately pours all the blood at the altar’s base.
