translation:
  language: en
  text: Then the priest must use his finger to take some blood from the sin offering[a] and put it on the horns of the altar used for burnt offerings. He must pour out all its blood at the base of the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to a sacrifice connected with sin and ritual cleansing.
    reason: lexical_alternative
