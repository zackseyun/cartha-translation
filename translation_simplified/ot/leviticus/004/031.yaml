translation:
  language: en
  text: All its fat must be removed, just as fat is removed from a peace offering.[a] The priest must burn the fat on the altar as an aroma pleasing to the LORD.[b] The priest will make atonement for the person, and that person will be forgiven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offering.”
    reason: lexical_alternative
  - marker: b
    text: “An aroma pleasing to the LORD” is a standard expression for an offering the LORD accepts.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And he shall remove all its fat
  simplified_phrase: All its fat must be removed
  preserved_meaning: The ritual requires all the animal’s sacrificial fat to be removed without identifying who removes it.
  reasoning_layer_used: Hebrew syntax, POB wording, and grounding review
  rationale: The passive wording makes the requirement clear while preserving the unstated subject.
- pob_phrase: just as the fat is removed from the sacrifice of peace offerings
  simplified_phrase: just as fat is removed from a peace offering
  preserved_meaning: The established peace-offering procedure governs how the fat is removed.
  reasoning_layer_used: Lexical decisions for כַּאֲשֶׁר הוּסַר and זֶבַח הַשְּׁלָמִים
  rationale: The shorter wording keeps the comparison and the recognized offering category.
- pob_phrase: the priest shall burn it on the altar as a pleasing aroma to the LORD
  simplified_phrase: The priest must burn the fat on the altar as an aroma pleasing to the LORD
  preserved_meaning: The priest sacrificially burns the removed fat, producing the aroma image associated with acceptance by the LORD.
  reasoning_layer_used: Lexical decisions for וְהִקְטִיר and לְרֵיחַ נִיחֹחַ
  rationale: Repeating “the fat” clarifies the object while natural word order preserves the source image.
