simplification_decisions:
- pob_phrase: The priest shall dip his finger in the blood and sprinkle
  simplified_phrase: The priest must dip his finger into the blood. Then he must sprinkle
  preserved_meaning: The priest is required to perform both ritual actions in sequence.
  reasoning_layer_used: POB lexical decisions for וְטָבַל and וְהִזָּה
  rationale: Two short sentences make the required ritual sequence easier to follow.
- pob_phrase: before Yahweh
  simplified_phrase: in Yahweh’s presence
  preserved_meaning: The sprinkling occurs before Yahweh in a spatial and worship setting.
  reasoning_layer_used: POB lexical decision for לִפְנֵי יְהוָה
  rationale: The approved alternative avoids a possible temporal reading of “before.”
- pob_phrase: the curtain of the sanctuary
  simplified_phrase: the sanctuary curtain
  preserved_meaning: This is the sacred inner curtain associated with the holy area.
  reasoning_layer_used: POB lexical and theological decisions for פָּרֹכֶת הַקֹּדֶשׁ
  rationale: The shorter phrase is natural English and identifies the same sacred object.
