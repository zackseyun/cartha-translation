translation:
  language: en
  text: The priest must dip his finger into the blood. Then he must sprinkle some of the blood seven times in Yahweh’s presence, in front of the sanctuary curtain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
