- pob_phrase: all its blood
  rendering: all the remaining blood
  claim: The command concerns all blood left after the priest applies some to the altar horns.
  evidence:
  - The preceding clause says the priest first takes some of the blood.
  - POB footnote c says the sequence implies that the remaining blood is then poured out.
  confidence: high
  alternatives_preserved:
  - all its blood
