translation:
  language: en
  text: The priest must take some of the animal’s blood on his finger and put it on the horns—the projections at the corners—of the altar for burnt offerings. Then he must pour out all the remaining blood at the base of the altar.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall take some of its blood with his finger
  simplified_phrase: must take some of the animal’s blood on his finger
  preserved_meaning: The priest is instructed to take only a portion of the animal’s blood, using his finger.
  reasoning_layer_used: Lexical decisions for מִדָּמָהּ and בְּאֶצְבָּעוֹ, with the ritual-instruction decision.
  rationale: “Must” states the required procedure plainly, and “the animal’s” gives the pronoun a clear referent.
- pob_phrase: the horns of the altar of burnt offering
  simplified_phrase: the horns—the projections at the corners—of the altar for burnt offerings
  preserved_meaning: The literal cultic term “horns” remains while their physical form is explained.
  reasoning_layer_used: Cultic terminology decision and cultural footnote b.
  rationale: The brief explanation makes the unfamiliar altar feature understandable without replacing its biblical image.
- pob_phrase: pour out all its blood at the base of the altar
  simplified_phrase: pour out all the remaining blood at the base of the altar
  preserved_meaning: After some blood is put on the horns, everything left is poured at the altar’s base.
  reasoning_layer_used: Lexical decision for כָּל דָּמָהּ and footnote c.
  rationale: “Remaining” makes the ritual sequence explicit and avoids implying that the already-applied blood is poured out.
