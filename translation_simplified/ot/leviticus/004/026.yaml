translation:
  language: en
  text: The priest must burn all its fat on the altar, just as he burns the fat from a peace offering.[a] In this way the priest will make atonement for the man’s sin,[b] and the man will be forgiven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “peace offering” may also be called a “fellowship offering” or an “offering of well-being.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can mean either “sin” or “sin offering”; here it most likely means the man’s sin.
    reason: lexical_alternative
