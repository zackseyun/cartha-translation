translation:
  language: en
  text: He must take the whole bull outside the camp to a clean place[a]—the ash dump[b]. He must burn it there on wood in the fire. The bull must be burned at the ash dump.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, a ceremonially clean place.
    reason: lexical_alternative
  - marker: b
    text: This was the designated place where ashes from the altar were dumped.
    reason: cultural_note
simplification_decisions:
- pob_phrase: He shall bring out the whole bull
  simplified_phrase: He must take the whole bull outside the camp
  preserved_meaning: The entire bull must be moved beyond the camp boundary.
  reasoning_layer_used: Lexical decisions for וְהוֹצִיא and כָּל הַפָּר
  rationale: “Must take ... outside” expresses the required outward movement in natural procedural English.
- pob_phrase: to a clean place outside the camp, to the ash dump
  simplified_phrase: outside the camp to a clean place—the ash dump
  preserved_meaning: The destination is the designated ash-disposal site, which must be clean.
  reasoning_layer_used: Theological decisions on ritual purity and the designated disposal site
  rationale: The apposition clearly connects the clean place with the ash dump.
- pob_phrase: and burn it on wood in the fire; it shall be burned at the ash dump
  simplified_phrase: He must burn it there on wood in the fire. The bull must be burned at the ash dump.
  preserved_meaning: The wood, fire, and repeated location requirement remain distinct.
  reasoning_layer_used: Lexical decisions for עַל עֵצִים בָּאֵשׁ and the repeated ash-dump clause
  rationale: Two sentences clarify the procedure while retaining its legal emphasis.
