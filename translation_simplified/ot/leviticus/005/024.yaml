translation:
  language: en
  text: or if he has sworn falsely about anything, he must repay the full amount and add one-fifth more. He must give the whole payment to its rightful owner on the day of his guilt offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “on the day of his guilt.” The Hebrew term can refer either to guilt itself or to the guilt offering; the main text follows the sacrificial context.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: or anything about which he swore falsely
  simplified_phrase: or if he has sworn falsely about anything
  preserved_meaning: The clause continues the legal list and concerns any matter covered by a false oath.
  reasoning_layer_used: Lexical decision for א֠וֹ and יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  rationale: Adding “if” makes the legal condition immediately clear without changing its scope.
- pob_phrase: he shall repay it in full, and shall add a fifth to it
  simplified_phrase: he must repay the full amount and add one-fifth more
  preserved_meaning: The offender owes the original value plus an additional twenty percent.
  reasoning_layer_used: Lexical decisions for בְּרֹאשׁוֹ and וַחֲמִשִׁתָיו
  rationale: “Full amount” and “one-fifth more” state the restitution formula in ordinary English.
- pob_phrase: to the one to whom it belongs
  simplified_phrase: to its rightful owner
  preserved_meaning: The restitution must be delivered to the person who legally owns it.
  reasoning_layer_used: Lexical decision for לַאֲשֶׁר הוּא לוֹ
  rationale: “Rightful owner” compresses the ownership clause while keeping its legal force.
interpretive_expansions:
