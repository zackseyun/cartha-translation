translation:
  language: en
  text: He must bring to the priest a ram from the flock that has no defects and is valued at the amount you set. It will be his guilt offering.[a] The priest will make atonement for him for the error he committed unintentionally while he was unaware of it. Then he will be forgiven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This specific sacrifice may also be called a “reparation offering.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He shall bring to the priest
  simplified_phrase: He must bring to the priest
  preserved_meaning: The wording remains a binding legal instruction and clearly identifies the priest as the recipient.
  reasoning_layer_used: Lexical decision for וְהֵבִיא and grounding review
  rationale: “Must” states the requirement naturally, while “to” prevents a momentary misreading.
- pob_phrase: a ram without blemish from the flock, according to your valuation
  simplified_phrase: a ram from the flock that has no defects and is valued at the amount you set
  preserved_meaning: The ram must be defect-free and conform to the stated valuation.
  reasoning_layer_used: Lexical decisions for תָּמִים and בְּעֶרְכְּךָ
  rationale: The sacrificial requirements are restated in ordinary modern English.
- pob_phrase: concerning the error that he committed unintentionally, though he did not know it
  simplified_phrase: for the error he committed unintentionally while he was unaware of it
  preserved_meaning: The offense was committed inadvertently and without the person’s awareness.
  reasoning_layer_used: Lexical decisions for שִׁגְגָתוֹ, שָׁגָג, and לֹא יָדַע
  rationale: The shorter clause preserves both unintentional action and lack of awareness.
translation_notes:
  risk_flags:
  - risk: The person addressed by “you” in the valuation clause remains unspecified.
    mitigation: The second-person wording is retained rather than assigning the valuation to someone not named in the text.
