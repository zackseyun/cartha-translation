translation:
  language: en
  text: The person must bring the offering to the priest. The priest must take a handful from it as the part that serves as a memorial. He must burn that portion on the altar, in addition to the food offerings burned for Yahweh. This is a sin offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a purification offering.” The Hebrew term can refer to an offering that deals with sin by purification.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Then he shall bring it to the priest
  simplified_phrase: The person must bring the offering to the priest.
  preserved_meaning: The worshiper is required to bring the offering to the priest.
  reasoning_layer_used: Lexical decision for וֶהֱבִיאָהּ and immediate context
  rationale: Naming the person and offering makes the pronouns clear without changing the command.
- pob_phrase: a handful as its memorial portion
  simplified_phrase: a handful from it as the part that serves as a memorial
  preserved_meaning: The priest removes one handful as the offering’s memorial portion.
  reasoning_layer_used: Lexical decisions for וְקָמַץ, מְלֹא קֻמְצוֹ, and אַזְכָּרָתָהּ
  rationale: The technical phrase is unpacked while retaining the measured handful and memorial function.
- pob_phrase: burn it on the altar, in addition to the food offerings of Yahweh
  simplified_phrase: burn that portion on the altar, in addition to the food offerings burned for Yahweh
  preserved_meaning: The distinct memorial portion is burned on the altar in addition to Yahweh’s fire offerings.
  reasoning_layer_used: Lexical decisions for וְהִקְטִיר, עַל אִשֵּׁי יְהוָה, and יְהוָה
  rationale: The wording identifies the portion, preserves the additive relationship, and explains that these offerings are burned.
