- pob_phrase: shall make atonement for him before Yahweh
  simplified_phrase: will make atonement for the person in Yahweh’s presence
  preserved_meaning: The priest acts on the offender’s behalf in the presence of Yahweh.
  reasoning_layer_used: Lexical decisions for וְכִפֶּר, עָלָיו, and לִפְנֵי יְהוָה; theological decision for Yahweh
  rationale: The wording clarifies the setting and referent while retaining the key sacrificial term and divine name.
- pob_phrase: for any one of all the things by which one may incur guilt
  simplified_phrase: for any act that brought guilt on them
  preserved_meaning: Forgiveness applies to any individual offense through which the person became guilty.
  reasoning_layer_used: Lexical decisions for עַל אַחַת מִכֹּל and לְאַשְׁמָה בָהּ
  rationale: The compact wording keeps both the distributive force of “any” and the link between the act and guilt.
