translation:
  language: en
  text: Or suppose a person rashly makes a verbal oath, promising to do harm or to do good—whatever a man may say in an oath.[a] If he is unaware of it but later realizes it, he becomes guilty in one of these matters.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents any person.
    reason: source_note
  - marker: b
    text: The Hebrew can simply mean “speaks with his lips,” though the context suggests a rash or thoughtless oath.
    reason: lexical_alternative
