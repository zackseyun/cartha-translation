translation:
  language: en
  text: But if he cannot afford a sheep, he must bring two turtledoves or two young pigeons to the LORD as his guilt offering for the sin he committed. One bird must be a sin offering[a], and the other a burnt offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if his means do not suffice for a sheep
  simplified_phrase: if he cannot afford a sheep
  preserved_meaning: The person lacks the financial ability to provide a sheep.
  reasoning_layer_used: lexical decision for תַגִּיע יָדוֹ דֵּי שֶׂה
  rationale: The direct modern idiom makes the economic meaning immediately clear.
- pob_phrase: then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh
  simplified_phrase: he must bring two turtledoves or two young pigeons to the LORD as his guilt offering for the sin he committed
  preserved_meaning: The two birds are brought to the LORD as the required guilt offering connected with his sin.
  reasoning_layer_used: lexical decisions for אֲשָׁמוֹ, אֲשֶׁר חָטָא, and לַיהוָה
  rationale: Natural clause order clarifies what is brought, to whom, and for what purpose.
- pob_phrase: one for a sin offering and one for a burnt offering
  simplified_phrase: One bird must be a sin offering, and the other a burnt offering
  preserved_meaning: The two birds have distinct sacrificial functions.
  reasoning_layer_used: lexical and theological decisions for חַטָּאת and עֹלָה
  rationale: Naming each bird explicitly prevents the two offerings from blending together.
