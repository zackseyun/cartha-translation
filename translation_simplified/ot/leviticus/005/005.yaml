translation:
  language: en
  text: When a person becomes guilty[a] in any of these matters, they must confess the sin they committed in that matter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means coming under legal guilt, not merely realizing that one has done wrong.
    reason: lexical_alternative
