translation:
  language: en
  text: Or if a person touches anything unclean—the carcass of an unclean wild animal, of unclean livestock, or of an unclean swarming creature—and does not realize it, he is unclean and becomes guilty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “unclean” means ritually unclean, and “guilty” means liable under this purity law; the contact was not necessarily an intentional moral wrong.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and it is hidden from him
  simplified_phrase: and does not realize it
  preserved_meaning: The person is unaware that the contact occurred.
  reasoning_layer_used: POB lexical decision for וְנֶעְלַם מִמֶּנּוּ
  rationale: The POB lexical alternative expresses the Hebrew idiom in direct modern English.
- pob_phrase: whether the carcass of an unclean wild animal, or the carcass of unclean livestock, or the carcass of an unclean swarming creature
  simplified_phrase: the carcass of an unclean wild animal, of unclean livestock, or of an unclean swarming creature
  preserved_meaning: All three cases involve touching the carcass of an unclean creature.
  reasoning_layer_used: POB lexical decisions for נִבְלַת, חַיָּה, בְּהֵמָה, and שֶׁרֶץ
  rationale: Repeating “of” clearly applies “carcass” to each distinct animal category.
- pob_phrase: any unclean thing
  simplified_phrase: anything unclean
  preserved_meaning: The opening category broadly includes every unclean thing described by the examples.
  reasoning_layer_used: POB lexical decision for כָל דָּבָר טָמֵא
  rationale: The compact wording is more natural while keeping the category broad.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “unclean” and “guilty” to mean intentional moral wrongdoing.
    mitigation: The footnote distinguishes ritual uncleanness and legal liability from necessarily intentional moral evil.
