translation:
  language: en
  text: If a person sins by doing something Yahweh has commanded people not to do, even though he did not realize it, he is guilty and must bear responsibility for his wrongdoing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: does any one of all the things that by Yahweh’s commandments must not be done
  simplified_phrase: does something Yahweh has commanded people not to do
  preserved_meaning: The person commits one act from among the actions Yahweh has prohibited.
  reasoning_layer_used: Lexical decisions for וְעָשְׂתָה אַחַת מִכָּל and אֲשֶׁר לֹא תֵעָשֶׂינָה
  rationale: The direct wording clearly identifies Yahweh’s command as a prohibition.
- pob_phrase: though he did not know it
  simplified_phrase: even though he did not realize it
  preserved_meaning: The person committed the offense without being aware of it.
  reasoning_layer_used: Lexical decision for וְלֹא יָדַע
  rationale: “Did not realize it” is natural English and preserves the source’s broad reference to ignorance.
- pob_phrase: shall bear his iniquity
  simplified_phrase: must bear responsibility for his wrongdoing
  preserved_meaning: The offender remains liable for the wrongdoing.
  reasoning_layer_used: Lexical decision for וְנָשָׂא עֲוֺנוֹ and POB footnote b
  rationale: This keeps the image of bearing while explaining the legal sense without asserting both guilt and consequences separately.
interpretive_expansions:
- pob_phrase: shall bear his iniquity
  rendering: must bear responsibility for his wrongdoing
  claim: Bearing iniquity means remaining liable for the offense.
  evidence:
  - POB footnote b says the idiom can refer to carrying liability for wrongdoing.
  - The lexical rationale recognizes bearing guilt or the consequence of wrongdoing as viable senses.
  confidence: high
  alternatives_preserved:
  - must bear his guilt
  - must bear the consequence of his wrongdoing
translation_notes:
  risk_flags:
  - risk: “Did not realize it” does not specify whether the person was unaware of the act or its prohibited character.
    mitigation: The wording preserves the POB’s ambiguity rather than resolving it without sufficient evidence.
  - risk: “Responsibility” may sound less weighty than the traditional term “iniquity.”
    mitigation: The verb “bear” and the explicit reference to wrongdoing preserve the verse’s legal and moral gravity.
