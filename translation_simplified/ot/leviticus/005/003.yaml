- pob_phrase: touches human uncleanness
  simplified_phrase: comes into contact with ritual uncleanness from a human
  preserved_meaning: The person has contact with the broad category of ritual uncleanness arising from a human source.
  reasoning_layer_used: POB lexical decisions for יִגַּע בְּ and טֻמְאַת אָדָם, plus the theological decision on טֻמְאָה
  rationale: This avoids implying a discrete object while clearly identifying the contact and its human source.
- pob_phrase: any uncleanness by which one becomes unclean
  simplified_phrase: any kind of uncleanness that makes a person ritually unclean
  preserved_meaning: The phrase includes every relevant form of human-sourced uncleanness and its ritual effect.
  reasoning_layer_used: POB lexical decisions for לְכֹל טֻמְאָתוֹ and אֲשֶׁר יִטְמָא בָּהּ
  rationale: The wording makes the broad scope and ritual result immediately understandable.
- pob_phrase: and it is hidden from him, and then he comes to know it
  simplified_phrase: but is unaware of it at the time and later realizes it
  preserved_meaning: The person does not know about the contact when it occurs but becomes aware afterward.
  reasoning_layer_used: POB lexical rationale and footnote b
  rationale: Ordinary English preserves the sequence of initial ignorance and later realization.
