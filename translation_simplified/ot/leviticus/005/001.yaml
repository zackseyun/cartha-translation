  simplified_phrase: hears a solemn public summons to testify
  preserved_meaning: The person hears a formal, oath-backed call for witnesses to speak.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Summons to testify” explains the unfamiliar legal term “adjuration” in common English.
- pob_phrase: whether he has seen or otherwise knows
  simplified_phrase: because he saw what happened or knows about it in some other way
  preserved_meaning: A witness may have direct sight or another basis for knowing the matter.
  reasoning_layer_used: POB lexical decision for אוֹ רָאָה אוֹ יָדָע
  rationale: The recast wording makes the two possible sources of a witness’s knowledge immediately clear.
- pob_phrase: then he shall bear his guilt
  simplified_phrase: He must bear his guilt.
  preserved_meaning: He remains liable for the wrongdoing and its consequences.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: A separate short sentence clarifies the result while retaining the covenantal-legal image of bearing guilt.
