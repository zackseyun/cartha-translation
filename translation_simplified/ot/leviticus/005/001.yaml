translation:
  language: en
  text: If a person hears a solemn public summons to testify[a] and he is a witness—because he saw what happened or knows about it in some other way—he sins if he does not report it. He must bear his guilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “hears the voice of an oath,” meaning a solemn sworn summons calling for testimony.
    reason: lexical_alternative
