translation:
  language: en
  text: 'The person must bring Yahweh a guilt offering[a] for the sin they committed: a female animal from the flock, either a lamb or a goat, as a sin offering. Then the priest must make atonement for that person for their sin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “an offering for guilt” or “a reparation offering.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “from their sin” and can emphasize removal from sin as a result of atonement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and he shall bring
  simplified_phrase: The person must bring
  preserved_meaning: The law requires the person who sinned to bring the offering.
  reasoning_layer_used: POB lexical decision for וְהֵבִיא
  rationale: “Must” expresses the legal requirement in ordinary modern English.
- pob_phrase: a female from the flock, a lamb or a female goat
  simplified_phrase: a female animal from the flock, either a lamb or a goat
  preserved_meaning: The required animal is female and may be a sheep or a goat.
  reasoning_layer_used: POB lexical decisions for נְקֵבָה, מִן הַצֹּאן, כִּשְׂבָּה, and שְׂעִירַת עִזִּים
  rationale: The wording states the shared sex requirement once and clearly presents both choices.
- pob_phrase: and the priest shall make atonement for him for his sin
  simplified_phrase: Then the priest must make atonement for that person for their sin
  preserved_meaning: The law requires the priest to perform the atoning act for the sinner.
  reasoning_layer_used: POB lexical decisions for וְכִפֶּר עָלָיו and מֵחַטָּאתוֹ
  rationale: A new sentence and “must” make both the required action and its recipient clear.
translation_notes:
  risk_flags:
  - risk: Readers may assume “guilt offering” and “sin offering” are interchangeable terms.
    mitigation: The main text retains both terms because the Hebrew deliberately places them together.
  - risk: The removal nuance in “from their sin” could be understood too definitively.
    mitigation: Footnote b says the wording can emphasize removal rather than claiming that it must.
