translation:
  language: en
  text: 'If a person acts unfaithfully by unintentionally sinning in matters involving Yahweh’s holy things, he must bring Yahweh a compensation offering[a]: a ram from the flock that has no defect. Its value must be what you assess in silver shekels, measured by the sanctuary shekel standard.[b] The ram will serve as the compensation offering.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be called a “guilt offering” or “reparation offering.” The Hebrew term refers both to liability for the offense and to the sacrifice that provides compensation.
    reason: lexical_alternative
  - marker: b
    text: The sanctuary shekel was the standard weight used for sacred valuations.
    reason: cultural_note
simplification_decisions:
- pob_phrase: sins unintentionally in regard to the holy things of Yahweh
  simplified_phrase: unintentionally sinning in matters involving Yahweh’s holy things
  preserved_meaning: The offense is unintentional and concerns sacred property or offerings belonging to Yahweh.
  reasoning_layer_used: lexical decisions for בִשְׁגָגָה and מִקָּדְשֵׁי יְהוָה
  rationale: The recast uses ordinary English without narrowing the kind of holy thing involved.
- pob_phrase: an unblemished ram
  simplified_phrase: a ram from the flock that has no defect
  preserved_meaning: The sacrificial ram must be free from defects.
  reasoning_layer_used: lexical decision for אַיִל תָּמִים
  rationale: The plain description replaces specialized sacrificial vocabulary while retaining its requirement.
- pob_phrase: according to your valuation in silver shekels, by the sanctuary shekel
  simplified_phrase: Its value must be what you assess in silver shekels, measured by the sanctuary shekel standard
  preserved_meaning: The required value is assessed in silver using the sacred standard weight.
  reasoning_layer_used: lexical decisions for בְּעֶרְכְּךָ, כֶּסֶף שְׁקָלִים, and בְּשֶׁקֶל הַקֹּדֶשׁ
  rationale: A separate sentence makes the valuation procedure easier to follow.
