- pob_phrase: if his means are not sufficient for
  simplified_phrase: if he cannot afford
  preserved_meaning: The law provides a less costly offering for someone without enough money.
  reasoning_layer_used: POB lexical and theological decisions on the poverty idiom
  rationale: The direct wording makes the economic condition immediately clear.
- pob_phrase: a tenth of an ephah of fine flour for a sin offering
  simplified_phrase: 'fine flour as the offering for his sin: one-tenth of an ephah. This will be his sin offering.'
  preserved_meaning: The required amount of flour serves as the sin offering.
  reasoning_layer_used: POB lexical decisions for the measure, flour, and sin offering
  rationale: Two short sentences clarify both the material and its ritual purpose.
- pob_phrase: He shall put no oil on it and place no frankincense on it
  simplified_phrase: He must not put oil or frankincense on it
  preserved_meaning: Both oil and frankincense are forbidden on this offering.
  reasoning_layer_used: POB lexical decisions for the ritual prohibitions
  rationale: A single natural prohibition preserves both distinct items.
