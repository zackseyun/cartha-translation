translation:
  language: en
  text: 'But if he cannot afford two turtledoves or two young pigeons, he must bring fine flour as the offering for his sin: one-tenth of an ephah.[a] This will be his sin offering. He must not put oil or frankincense on it, because it is a sin offering.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure.
    reason: cultural_note
