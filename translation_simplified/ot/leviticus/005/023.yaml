  text: When he sins and becomes guilty,[a] he must restore whatever he took by robbery or extortion, any property entrusted to his care, or any lost property he found,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “If he sins and incurs guilt.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be, when he sins and becomes guilty, that he shall restore
  simplified_phrase: When he sins and becomes guilty, he must restore
  preserved_meaning: The wording keeps sin, resulting guilt, and the legal duty to make restitution.
  reasoning_layer_used: POB lexical decisions for וְהָיָה, כִּי, וְאָשֵׁם, and וְהֵשִׁיב
  rationale: Removing the formal Hebrew frame and using “must” states the legal requirement directly.
- pob_phrase: what he took by robbery, or what he extorted
  simplified_phrase: whatever he took by robbery or extortion
  preserved_meaning: Robbery and oppressive or fraudulent seizure remain identified as wrongful forms of taking property.
  reasoning_layer_used: POB lexical decisions for הַגְּזֵלָה and הָעֹשֶׁק
  rationale: The compact parallel wording makes the legal list easier to read.
- pob_phrase: the deposit that was entrusted to him, or the lost thing that he found
  simplified_phrase: any property entrusted to his care, or any lost property he found
  preserved_meaning: The offender must return property placed in his custody and property that another person lost.
  reasoning_layer_used: POB lexical decisions for הַפִּקָּדוֹן and הָאֲבֵדָה
  rationale: “Property” clearly identifies the concrete goods while replacing opaque or unnatural legal wording.
