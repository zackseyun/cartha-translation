translation:
  language: en
  text: He must repay whatever he wrongly took or withheld from what is holy. He must add one-fifth to that amount and give it all to the priest. Then the priest will make atonement for him with the ram of the guilt offering,[a] and he will be forgiven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be called a “reparation offering.”
    reason: lexical_alternative
