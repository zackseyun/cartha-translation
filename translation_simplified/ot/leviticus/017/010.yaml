translation:
  language: en
  text: And if any man from the house of Israel, or any foreigner living among them, eats any blood, I will set my face against that person and cut him off from among his people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cut off” describes a severe covenant penalty, but this verse does not say whether it means death, expulsion, or another form of divine judgment.
    reason: lexical_alternative
