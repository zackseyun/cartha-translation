  preserved_meaning: The rule applies to every man in either named group who violates the prohibition.
  reasoning_layer_used: Source syntax and lexical rationale for the distributive legal formula
  rationale: A direct conditional makes the law easier to follow without changing its scope.
- pob_phrase: the sojourner who sojourns among them
  simplified_phrase: any foreigner living among them
  preserved_meaning: The person is a non-native resident within Israelite society, not a passing visitor.
  reasoning_layer_used: POB lexical decision for גֵּר
  rationale: Common wording replaces an unfamiliar term and removes the awkward repeated verb.
- pob_phrase: the person who eats the blood
  simplified_phrase: that person
  preserved_meaning: God’s judgment falls on the individual offender who ate blood.
