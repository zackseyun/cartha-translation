translation:
  language: en
  text: Anyone who eats an animal found dead without proper slaughter or one torn by wild animals must wash their clothes and bathe in water. This applies both to a native Israelite and to a foreigner living among them. That person will remain ritually unclean until evening; then they will be clean.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: every person who eats an animal found dead or one torn by beasts
  simplified_phrase: Anyone who eats an animal found dead without proper slaughter or one torn by wild animals
  preserved_meaning: The rule covers anyone who eats either kind of animal carcass.
  reasoning_layer_used: POB lexical decisions for נְבֵלָה and טְרֵפָה
  rationale: The wording explains the first category and replaces “beasts” with clearer modern English while retaining the torn-animal image.
- pob_phrase: whether native or sojourner
  simplified_phrase: This applies both to a native Israelite and to a foreigner living among them.
  preserved_meaning: The law applies to native members of Israel and resident outsiders alike.
  reasoning_layer_used: POB lexical decisions for בָּאֶזְרָח and בַגֵּר
  rationale: A separate sentence makes the scope clear and explains the unfamiliar term “sojourner.”
- pob_phrase: shall wash his clothes and bathe in water, and he shall be unclean until the evening; then he shall be clean
  simplified_phrase: must wash their clothes and bathe in water. That person will remain ritually unclean until evening; then they will be clean.
  preserved_meaning: Washing is required, and the temporary unclean status ends after evening.
  reasoning_layer_used: POB lexical and theological decisions for the washing commands and clean/unclean status
  rationale: Shorter sentences and singular “they” clarify the required action and sequence without adding moral guilt.
