  simplified_phrase: to present it as an offering to Yahweh in front of Yahweh’s tabernacle
  preserved_meaning: Bringing the animal to the sanctuary is for presenting it as a sacrifice.
  reasoning_layer_used: Lexical decisions for לְהַקְרִיב קָרְבָּן and לִפְנֵי מִשְׁכַּן יְהוָה
  rationale: “In front of” gives the spatial meaning of “before” in ordinary English.
- pob_phrase: 'blood shall be imputed to that man: he has shed blood'
  simplified_phrase: that man will be held guilty of bloodshed. He has shed blood
  preserved_meaning: The man is legally accountable for unauthorized bloodshed.
  reasoning_layer_used: Theological decision on דָּם יֵחָשֵׁב and its confirming clause
  rationale: The legal result is stated directly while the bloodshed image remains.
- pob_phrase: that man shall be cut off from among his people
  simplified_phrase: he will be cut off from among his people
  preserved_meaning: The offender will undergo an unspecified form of covenantal removal.
  reasoning_layer_used: Theological decision preserving the ambiguity of וְנִכְרַת
  rationale: The pronoun avoids repetition without defining the penalty.
