translation:
  language: en
  text: but does not bring the animal to the entrance of the tent of meeting to present it as an offering to Yahweh in front of Yahweh’s tabernacle, that man will be held guilty of bloodshed.[a] He has shed blood, and he will be cut off from among his people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says that blood will be counted or imputed to the man; this means he is held guilty of bloodshed.
    reason: lexical_alternative
  - marker: b
    text: “Cut off” does not specify whether the penalty is death, expulsion, or another form of removal from the covenant community.
    reason: cultural_note
