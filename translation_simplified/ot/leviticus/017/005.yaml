translation:
  language: en
  text: The purpose is for the sons of Israel to bring to Yahweh the sacrifices they have been making out in the open countryside. They are to bring them to the priest at the entrance to the tent of meeting and sacrifice them to Yahweh as peace offerings.[a]
  philosophy: optimal-equivalence
  footnotes:
