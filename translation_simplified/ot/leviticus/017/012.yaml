translation:
  language: en
  text: That is why I said to the sons of Israel,[a] “None of you may eat blood. A foreigner who lives among you must not eat blood either.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of Israel”; this expression may also be translated “children of Israel” or “Israelites.”
    reason: lexical_alternative
  - marker: b
    text: This means a non-Israelite resident living among Israel under its community laws.
    reason: cultural_note
