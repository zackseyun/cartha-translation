translation:
  language: en
  text: A creature’s life is in its blood. I have given you the blood for use on the altar, to make atonement for your lives. The blood makes atonement by means of the life in it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compact and may also be rendered, “The blood makes atonement by the life.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the life of the flesh is in the blood
  simplified_phrase: A creature’s life is in its blood
  preserved_meaning: The animating life of living flesh is associated with its blood.
  reasoning_layer_used: Lexical decisions for נֶפֶשׁ, הַבָּשָׂר, and בַּדָּם
  rationale: This replaces an opaque phrase while retaining “life,” not “soul,” as the controlling sense.
- pob_phrase: I have given it to you on the altar
  simplified_phrase: I have given you the blood for use on the altar
  preserved_meaning: God provides blood for its appointed altar use without naming who performs the ritual action.
  reasoning_layer_used: Source syntax and immediate sacrificial context
  rationale: Naming the blood clarifies the pronoun while avoiding an unsupported assignment of action.
- pob_phrase: it is the blood that makes atonement by the life
  simplified_phrase: The blood makes atonement by means of the life in it
  preserved_meaning: Blood atones because of its relation to the life bound up with it.
  reasoning_layer_used: Theological decision on בַּנֶּפֶשׁ and POB footnote a
  rationale: The fuller wording explains the difficult phrase while the footnote retains its documented ambiguity.
