translation:
  language: en
  text: Speak to Aaron, his sons, and all the Israelites[a], and tell them, “This is what Yahweh has commanded:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew, “all the sons of Israel,” a traditional family name for the people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to Aaron and to his sons and to all the sons of Israel
  simplified_phrase: to Aaron, his sons, and all the Israelites
  preserved_meaning: Aaron, his male priestly descendants, and the whole covenant people are addressed.
  reasoning_layer_used: Lexical decisions for בָּנָיו and כָּל בְּנֵי יִשְׂרָאֵל
  rationale: The streamlined list is natural, and “Israelites” prevents the collective name from sounding male-only.
- pob_phrase: and say to them
  simplified_phrase: and tell them
  preserved_meaning: Moses must communicate the command directly to everyone named.
  reasoning_layer_used: Lexical decision for וְאָמַרְתָּ אֲלֵהֶם
  rationale: “Tell them” is clear common English and is a documented lexical alternative.
- pob_phrase: This is the thing that Yahweh has commanded, saying
  simplified_phrase: 'This is what Yahweh has commanded:'
  preserved_meaning: The words that follow are Yahweh’s binding command.
  reasoning_layer_used: Lexical decisions for זֶה הַדָּבָר, צִוָּה, יְהוָה, and לֵאמֹר
  rationale: “What” avoids an awkward noun, while the colon introduces the command that follows.
translation_notes:
  risk_flags:
  - risk: “Israelites” does not display the Hebrew family image in the main text.
    mitigation: The footnote preserves the literal expression and explains its collective function.
  - risk: Replacing “saying” with a colon removes a visible Hebrew formula.
    mitigation: The colon preserves the formula’s function by introducing the command in the next verse.
