translation:
  language: en
  text: The life of every creature is bound up with its blood.[a] That is why I told the Israelites, “You must not eat the blood of any creature, because the life of every creature is bound up with its blood.” Anyone who eats it will be cut off.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed and may also be translated “its blood is in its life” or “its blood is its life.”
    reason: lexical_alternative
  - marker: b
    text: “Cut off” leaves the exact form of judgment unspecified.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the life of all flesh is its blood; in its life it is
  simplified_phrase: The life of every creature is bound up with its blood
  preserved_meaning: A creature’s blood is inseparably connected with its animating life.
  reasoning_layer_used: Lexical decisions for נֶפֶשׁ, בָּשָׂר, and בְנַפְשׁוֹ
  rationale: This recasts the compressed Hebrew relation in natural English while the footnote preserves its ambiguity.
- pob_phrase: So I said to the sons of Israel
  simplified_phrase: That is why I told the Israelites
  preserved_meaning: God gives the command to Israel as a consequence of the life-blood principle.
  reasoning_layer_used: Lexical decisions for וָאֹמַר and לִבְנֵי יִשְׂרָאֵל
  rationale: The wording makes both the intended audience and the logical connection immediately clear.
- pob_phrase: You shall not eat the blood of any flesh
  simplified_phrase: You must not eat the blood of any creature
  preserved_meaning: The statement remains a direct covenant prohibition against consuming blood.
  reasoning_layer_used: Lexical decisions for לֹא תֹאכֵלוּ, דָּם, and בָּשָׂר
  rationale: “Must not” states the prohibition plainly, and “creature” clarifies the biblical expression “flesh.”
