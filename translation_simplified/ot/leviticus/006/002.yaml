translation:
  language: en
  text: 'Command Aaron and his sons: “This is the law[a] for the burnt offering. The burnt offering itself must remain where it burns on the altar all night until morning. The altar fire must be kept burning there.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the instruction.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Command Aaron and his sons, saying
  simplified_phrase: 'Command Aaron and his sons:'
  preserved_meaning: God gives Aaron and his sons a direct command and introduces its words.
  reasoning_layer_used: Lexical decision for צַו and the direct-speech function of לֵאמֹר.
  rationale: A colon introduces the command naturally without weakening its force.
- pob_phrase: shall remain on its hearth on the altar
  simplified_phrase: must remain where it burns on the altar
  preserved_meaning: The offering stays on the altar’s designated burning place.
  reasoning_layer_used: Lexical decision identifying מוֹקְדָה as the altar’s burning place or hearth.
  rationale: The concrete description is clearer than the less familiar ritual use of “hearth.”
- pob_phrase: the fire of the altar shall be kept burning on it
  simplified_phrase: The altar fire must be kept burning there
  preserved_meaning: The priests are required to maintain the altar fire continuously.
  reasoning_layer_used: Lexical and theological decisions on the passive verb form and its prescriptive force.
  rationale: “Must” states the obligation plainly, while “kept burning” preserves ongoing maintenance.
translation_notes:
  risk_flags:
  - risk: “There” leaves the Hebrew suffix’s exact altar-or-hearth reference compact.
    mitigation: The preceding phrase clearly locates both the offering and fire at the altar’s burning place.
