translation:
  language: en
  text: 'Every male among Aaron’s sons may eat of this offering. This is their permanent right in every generation: a portion from Yahweh’s food offerings. Whatever touches these offerings will become holy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Only what is holy may touch them.” The Hebrew may describe becoming holy through contact, but some understand it more restrictively.
    reason: alternative_reading
