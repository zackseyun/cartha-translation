  preserved_meaning: The verse introduces the governing rule for this sacrifice.
  reasoning_layer_used: Lexical decision for זֹאת תּוֹרַת
  rationale: “Instruction” makes the sacrificial sense of “law” immediately clear.
- pob_phrase: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered
