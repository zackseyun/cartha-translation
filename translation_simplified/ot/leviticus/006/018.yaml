translation:
  language: en
  text: 'Give Aaron and his sons these instructions: “This is the instruction for the sin offering.[a] The sin offering must be slaughtered before Yahweh in the same place as the burnt offering. It is most holy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering”; the Hebrew term can refer both to sin and to the offering that provides purification from it.
    reason: lexical_alternative
