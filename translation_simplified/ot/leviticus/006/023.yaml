translation:
  language: en
  text: But any sin offering must not be eaten if some of its blood is brought into the tent of meeting to make atonement in the holy place. The offering must be burned with fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term translated “sin offering” can also be translated “purification offering”; this sacrifice deals with impurity as well as sin.
    reason: lexical_alternative
