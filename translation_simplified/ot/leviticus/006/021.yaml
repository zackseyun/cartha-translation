translation:
  language: en
  text: Any clay pot used to boil it must be broken. But if it was boiled in a bronze pot[a], the pot must be thoroughly scrubbed and rinsed with water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “copper pot.” The Hebrew word can refer to copper or bronze.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an earthenware vessel in which it is boiled
  simplified_phrase: Any clay pot used to boil it
  preserved_meaning: The container is made of clay, and the sacrificial food is boiled in it.
  reasoning_layer_used: POB lexical decisions for כְלִי חֶרֶשׂ and תְּבֻשַּׁל
  rationale: “Clay pot” is more familiar than “earthenware vessel” while keeping the material distinction.
- pob_phrase: if it is boiled in a bronze vessel
  simplified_phrase: if it was boiled in a bronze pot
  preserved_meaning: A metal container used for boiling receives different treatment from a clay one.
  reasoning_layer_used: POB lexical decision for כְלִי נְחֹשֶׁת
  rationale: “Bronze pot” uses ordinary wording while retaining POB’s preferred metal and its copper alternative.
- pob_phrase: it must be scoured and rinsed with water
  simplified_phrase: the pot must be thoroughly scrubbed and rinsed with water
  preserved_meaning: The metal pot requires vigorous cleaning followed by rinsing with water.
  reasoning_layer_used: POB lexical decisions for וּמֹרַק and וְשֻׁטַּף בַּמָּיִם
  rationale: Naming the pot removes pronoun ambiguity, and “thoroughly scrubbed” makes “scoured” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Pot” is narrower in ordinary English than the general Hebrew word for a vessel.
    mitigation: The immediate context specifies a container used for boiling, making “pot” an appropriate plain-language equivalent.
