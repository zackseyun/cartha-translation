translation:
  language: en
  text: The fire on the altar must be kept burning; it must never go out. Each morning, the priest must put more wood on the fire. Then he must arrange the burnt offering on it and burn the fat portions of the peace offerings there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peace offerings” may also be translated “fellowship offerings” or “offerings of well-being.”
    reason: lexical_alternative
