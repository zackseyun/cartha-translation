translation:
  language: en
  text: This is the offering Aaron and his sons must present to the LORD on the day he is anointed:[a] about two liters of fine flour[b] as the regular grain offering. They must present half in the morning and half in the evening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “on the day of his anointing.” The Hebrew says “he” even though Aaron and his sons are named.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: one-tenth of an ephah.'
    reason: cultural_note
simplification_decisions:
- pob_phrase: which they shall present to Yahweh
  simplified_phrase: must present to the LORD
  preserved_meaning: The offering is formally required and presented to Israel’s covenant God.
  reasoning_layer_used: Lexical decision for יַקְרִיבוּ and divine-name doctrine for יהוה
  rationale: “Must” states the legal requirement plainly, and “the LORD” follows the audited divine-name decision.
- pob_phrase: a tenth of an ephah of fine flour
  simplified_phrase: about two liters of fine flour
  preserved_meaning: The offering uses the specified quantity of refined flour.
  reasoning_layer_used: Measure expression and lexical decision for סֹלֶת
  rationale: A modern approximate measure is immediately understandable, while the Hebrew measure remains in a note.
- pob_phrase: half of it in the morning and half of it in the evening
  simplified_phrase: They must present half in the morning and half in the evening.
  preserved_meaning: The regular offering is divided equally between two daily times.
  reasoning_layer_used: Lexical decisions for the divided portions and temporal phrases
  rationale: A separate sentence makes the two required portions easier to follow.
