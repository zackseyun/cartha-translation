translation:
  language: en
  text: Anything that touches the flesh of the sin offering becomes holy.[a] If any of its blood spatters[b] a garment, you must wash the garment in a holy place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “holy” describes ritual status, not inward moral change.
    reason: simplification_note
  - marker: b
    text: The Hebrew can also mean “is sprinkled,” but “spatters” fits blood landing on a garment that must then be washed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: touches its flesh
  simplified_phrase: touches the flesh of the sin offering
  preserved_meaning: Contact is with the sacrificial flesh, not flesh in general.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Naming the sin offering makes the pronoun’s referent clear.
- pob_phrase: shall become holy
  simplified_phrase: becomes holy
  preserved_meaning: Contact gives the person or object a new ritual status.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The present tense expresses this standing rule naturally.
- pob_phrase: wash that on which it was spattered
  simplified_phrase: wash the garment
  preserved_meaning: The blood-spattered garment itself must be washed.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: This removes the difficult relative clause without narrowing the command to spot-cleaning.
interpretive_expansions:
