  reasoning_layer_used: POB lexical decisions for זֶבַח הַשְּׁלָמִים and אֲשֶׁר לָעָם
  rationale: Removing the relative clause improves flow without making the two animals sound like one indefinite offering.
- pob_phrase: Aaron’s sons brought the blood to him
  simplified_phrase: His sons brought him the blood
  preserved_meaning: Aaron’s sons delivered the sacrificial blood to Aaron.
  reasoning_layer_used: POB lexical decisions for וַיַּמְצִאוּ and אֶת הַדָּם אֵלָיו
  rationale: Naming Aaron earlier makes the shorter pronouns clear.
- pob_phrase: he splashed it on the altar all around
  simplified_phrase: he splashed it against the altar on all sides
  preserved_meaning: Aaron forcefully applied the blood around the sides of the altar.
  reasoning_layer_used: POB lexical decisions for וַיִּזְרְקֵהוּ and עַל הַמִּזְבֵּחַ סָבִיב
  rationale: This wording makes the altar the target of the blood application and preserves the ritual direction.
