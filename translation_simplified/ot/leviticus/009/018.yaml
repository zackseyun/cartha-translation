translation:
  language: en
  text: Then Aaron slaughtered the ox and the ram, the sacrifice of peace offerings for the people.[a] His sons brought him the blood, and he splashed it against the altar on all sides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be called a “fellowship offering” or “well-being offering.” The Hebrew term carries ideas of peace, wholeness, and communion.
    reason: lexical_alternative
