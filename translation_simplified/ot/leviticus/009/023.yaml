simplification_decisions:
- pob_phrase: went into the tent of meeting
  simplified_phrase: went inside the tent of meeting
  preserved_meaning: Moses and Aaron entered the sacred meeting tent.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא and אֹהֶל מוֹעֵד
  rationale: “Went inside” states the movement in familiar English while retaining the established name of the tent.
- pob_phrase: when they came out
  simplified_phrase: When they came back out
  preserved_meaning: They emerged from the tent before blessing the people.
  reasoning_layer_used: Lexical decision for וַיֵּצְאוּ and the restored narrative sequence
  rationale: “Came back out” clearly connects their exit with their earlier entrance without implying causation.
- pob_phrase: the glory of Yahweh appeared to all the people
  simplified_phrase: Yahweh’s glory became visible to all the people
  preserved_meaning: Yahweh’s manifested glory was seen by the gathered people.
  reasoning_layer_used: Lexical decisions for כְבוֹד יְהוָה, וַיֵּרָא, and כָּל הָעָם
  rationale: The possessive form and “became visible” clarify the manifestation while “all the people” preserves the identified witnesses.
translation_notes:
  risk_flags:
