  preserved_meaning: The blood was applied to the altar’s projecting horn-like corners.
  reasoning_layer_used: Lexical decision and POB cultural note for קַרְנוֹת הַמִּזְבֵּחַ.
  rationale: The wording preserves the horn image while explaining the unfamiliar altar feature.
- pob_phrase: he poured out the blood at the base of the altar
  simplified_phrase: Then he poured the rest of the blood at the base of the altar
