translation:
  language: en
  text: He made the fat, the kidneys, and the lobe from the liver of the sin offering[a] go up in smoke on the altar, just as Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to removing impurity as well as dealing with sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the fat, the kidneys, and the lobe of the liver from the sin offering he turned into smoke
  simplified_phrase: He made the fat, the kidneys, and the lobe from the liver of the sin offering go up in smoke
  preserved_meaning: The specified parts of the sin offering were consumed as altar smoke.
  reasoning_layer_used: POB lexical decisions for חֵלֶב, כְּלָיֹת, יֹּתֶרֶת מִן־הַכָּבֵד, and הִקְטִיר
  rationale: The ordinary subject-first order is easier to follow while preserving every sacrificial detail and the smoke image.
- pob_phrase: from the sin offering
  simplified_phrase: of the sin offering
  preserved_meaning: The listed parts belonged to the sin offering.
  reasoning_layer_used: POB theological decision for חַטָּאת
  rationale: Changing the repeated preposition removes awkwardness without changing the offering category.
