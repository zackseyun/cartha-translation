  simplified_phrase: the goat designated as their sin offering
  preserved_meaning: The goat was set apart as a sin offering on behalf of the people.
  reasoning_layer_used: Lexical decisions for שְׂעִיר הַחַטָּאת and אֲשֶׁר לָעָם
  rationale: “Designated as” expresses the goat’s ritual purpose more clearly than the dense possessive clauses.
- pob_phrase: offered it for sin
  simplified_phrase: performed the sin-offering ritual with it
  preserved_meaning: He carried out the required sin-offering rite using the slaughtered goat.
  reasoning_layer_used: Lexical and theological decisions for וַיְחַטְּאֵהוּ
  rationale: The functional wording is clear without implying that the goat itself was purified or importing “atonement.”
- pob_phrase: as with the first one
  simplified_phrase: just as he had done with the first sin offering
  preserved_meaning: He followed the same procedure used for the earlier sin offering.
  reasoning_layer_used: Lexical rationale for כָּרִאשׁוֹן and immediate context
