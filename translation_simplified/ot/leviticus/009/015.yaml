translation:
  language: en
  text: Then he presented the people’s offering. He took the goat designated as their sin offering, slaughtered it, and performed the sin-offering ritual with it,[a] just as he had done with the first sin offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “used it to perform the purifying rite.” The Hebrew verb can describe either making a sin offering or ritual purification.
    reason: lexical_alternative
