translation:
  language: en
  text: Moses said to Aaron, “Come to the altar. Offer your sin offering[a] and your burnt offering, and make atonement[b] for yourself and the people. Then offer the people’s offering and make atonement for them, just as Yahweh commanded.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can emphasize purification from impurity as well as dealing with sin.
    reason: lexical_alternative
  - marker: b
    text: Here, making atonement means dealing with sin and impurity through the sacrifice Yahweh commanded.
    reason: simplification_note
