translation:
  language: en
  text: Tell the sons of Israel, “Take a male goat for a sin offering.[a] Also take a calf and a lamb for a burnt offering. The calf and the lamb must each be one year old and have no blemish.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And to the sons of Israel you shall speak, saying
  simplified_phrase: Tell the sons of Israel
  preserved_meaning: Moses is commanded to give this instruction directly to Israel’s sons.
  reasoning_layer_used: Lexical and theological decisions for תְּדַבֵּר and בְּנֵי יִשְׂרָאֵל
  rationale: The direct command removes an awkward quotation formula while retaining the source-driven corporate designation.
- pob_phrase: and a calf and a lamb, each a year old, without blemish, for a burnt offering
  simplified_phrase: Also take a calf and a lamb for a burnt offering. The calf and the lamb must each be one year old and have no blemish.
  preserved_meaning: Both animals belong to the burnt offering category, and both meet the age and condition requirements.
  reasoning_layer_used: Lexical decisions for בְּנֵי שָׁנָה, תְּמִימִם, and לְעֹלָה
  rationale: Two sentences make clear that the age and blemish requirements apply to both animals.
- pob_phrase: without blemish
  simplified_phrase: have no blemish
  preserved_meaning: The sacrificial animals must be free from defects.
  reasoning_layer_used: Lexical decision for תְּמִימִם
  rationale: The verbal wording is easier for common readers while preserving the sacrificial requirement.
