translation:
  language: en
  text: Aaron raised his hands[a] toward the people and blessed them. Then he came down after presenting the sin offering, the burnt offering, and the peace offerings.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew form is singular, “his hand,” but the blessing gesture is commonly understood as using both hands.
    reason: lexical_alternative
  - marker: b
    text: The sin offering may also be called the purification offering, and the peace offerings may be called fellowship or well-being offerings.
    reason: lexical_alternative
