  simplified_phrase: from Yahweh’s presence
  preserved_meaning: The fire came outward from where Yahweh was present.
  reasoning_layer_used: lexical and theological decisions
  rationale: This replaces the opaque Hebrew idiom while retaining Yahweh’s covenant name.
- pob_phrase: consumed on the altar the burnt offering and the fat portions
  simplified_phrase: burned up the burnt offering and the fat portions on the altar
  preserved_meaning: The divine fire completely took up the designated sacrifices on the altar.
  reasoning_layer_used: lexical decisions
  rationale: The new clause order and common verb make the action immediately clear.
- pob_phrase: fell on their faces
  simplified_phrase: fell facedown
  preserved_meaning: The people physically prostrated themselves in awe or worship.
  reasoning_layer_used: lexical decision
  rationale: This keeps the bodily image in concise modern English.
