translation:
  language: en
  text: You must not do what the people do in Egypt, where you lived, or what the people do in Canaan, where I am bringing you. You must not walk in their statutes—that is, live by their rules.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall not do as they do
  simplified_phrase: You must not do what the people do
  preserved_meaning: God forbids Israel from copying the inhabitants’ practices.
  reasoning_layer_used: POB lexical and theological decisions on כְּמַעֲשֵׂה
  rationale: “Must not” states the legal command clearly, while “the people” makes the implied inhabitants explicit.
- pob_phrase: in the land of Egypt / in the land of Canaan
  simplified_phrase: in Egypt / in Canaan
  preserved_meaning: Egypt is Israel’s former home, and Canaan is its divinely appointed destination.
  reasoning_layer_used: POB lexical decisions on both land names and relative clauses
  rationale: Dropping “the land of” gives natural English without changing either place or its role.
- pob_phrase: You shall not walk in their statutes
  simplified_phrase: You must not walk in their statutes—that is, live by their rules
  preserved_meaning: Israel must not order its conduct by the binding norms of those peoples.
  reasoning_layer_used: POB lexical and theological decisions on חֻקֹּתֵיהֶם and לֹא תֵלֵכוּ
  rationale: The wording retains the biblical walking image and immediately explains it in common English.
interpretive_expansions:
- pob_phrase: as they do
  rendering: what the people do
  claim: The practices belong to the inhabitants of Egypt and Canaan, not to the land itself.
  evidence:
  - The POB theological decision identifies the peoples’ practices as the intended referent.
  - The POB lexical rationale says “they” represents the inhabitants implied by the land names.
  confidence: high
  alternatives_preserved:
  - the practices of Egypt and Canaan
- pob_phrase: walk in their statutes
  rendering: walk in their statutes—that is, live by their rules
  claim: Walking in statutes means governing one’s conduct by those binding norms.
  evidence:
  - The POB lexical rationale identifies “walk” as a metaphor for conduct.
  - The POB theological rationale says “statutes” carries normative force.
  confidence: high
  alternatives_preserved:
  - follow their statutes
  - live by their ordinances
translation_notes:
