- pob_phrase: the persons who do them shall be cut off
  simplified_phrase: will be cut off
  preserved_meaning: Those who commit the acts receive the stated judgment.
  reasoning_layer_used: Lexical decisions for הַנְּפָשׁוֹת, הָעֹשֹׂת, and וְנִכְרְתוּ
  rationale: Combining the repeated subject into one clause makes the sentence direct without weakening the penalty.
