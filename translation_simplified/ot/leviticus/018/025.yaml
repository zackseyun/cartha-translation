translation:
  language: en
  text: So the land became unclean.[a] I punished the land for its iniquity, and it vomited out the people who lived there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was defiled.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I punished its iniquity upon it
  simplified_phrase: I punished the land for its iniquity
  preserved_meaning: God directly calls the land’s iniquity to account through punishment.
  reasoning_layer_used: POB lexical and theological decisions on וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  rationale: The recast clause expresses the Hebrew idiom in clear English while preserving divine agency and judgment.
- pob_phrase: the land vomited out its inhabitants
  simplified_phrase: it vomited out the people who lived there
  preserved_meaning: The personified land forcefully expelled those dwelling in it.
  reasoning_layer_used: POB lexical decision on וַתָּקִא and theological decision on land personification
  rationale: The wording explains “inhabitants” plainly without weakening the graphic image of vomiting.
- pob_phrase: So the land became unclean, and I punished ... and the land vomited
  simplified_phrase: So the land became unclean. I punished ... and it vomited
  preserved_meaning: Defilement, divine punishment, and expulsion remain linked in sequence.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Dividing the long chain into two sentences makes the sequence easier to follow.
translation_notes:
  risk_flags:
  - risk: The pronoun “it” could briefly seem to refer to iniquity rather than the land.
    mitigation: The singular subject of “vomited” follows the immediately named land and preserves the established personification.
