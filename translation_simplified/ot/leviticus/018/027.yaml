simplification_decisions:
- pob_phrase: the men of the land who were before you
  simplified_phrase: the men who lived in the land before you
  preserved_meaning: The phrase still identifies the male prior inhabitants of the land.
  reasoning_layer_used: POB lexical decisions for אַנְשֵׁי הָאָרֶץ and אֲשֶׁר לִפְנֵיכֶם
  rationale: Adding “lived” makes the historical relationship clear in natural English.
- pob_phrase: did all these abominations
  simplified_phrase: committed all these detestable acts
  preserved_meaning: Their actions were strongly condemned as morally and covenantally abhorrent.
  reasoning_layer_used: POB lexical decision for כָּל הַתּוֹעֵבֹת הָאֵל and listed alternative for עָשׂוּ
  rationale: “Detestable acts” communicates the force clearly, while “committed” is natural with wrongdoing.
translation_notes:
  risk_flags:
