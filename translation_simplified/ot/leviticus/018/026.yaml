translation:
  language: en
  text: But you yourselves must obey my laws and legal rulings. You must not do any of these detestable acts. This command applies to both the native-born and the foreigners living among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall keep my statutes and my judgments
  simplified_phrase: must obey my laws and legal rulings
  preserved_meaning: The people are required to follow both God’s fixed commands and his judicial rulings.
  reasoning_layer_used: lexical decisions for שׁמר, חֻקֹּתַי, and מִשְׁפָּטַי
  rationale: Common legal wording preserves the two distinct categories and the command’s binding force.
- pob_phrase: any of these abominations
  simplified_phrase: any of these detestable acts
  preserved_meaning: Every prohibited act listed in the chapter is strongly condemned.
  reasoning_layer_used: lexical decision for הַתּוֹעֵבֹת and immediate context
  rationale: “Detestable acts” makes the reference clear while retaining the source term’s strong moral force.
- pob_phrase: the sojourner who sojourns among you
  simplified_phrase: the foreigners living among you
  preserved_meaning: The command includes non-native residents within the Israelite community.
  reasoning_layer_used: lexical decisions for הַגֵּר and הַגָּר בְּתוֹכְכֶם
  rationale: This removes an unfamiliar repeated term while preserving resident foreign status.
interpretive_expansions:
- pob_phrase: neither the native-born nor the sojourner who sojourns among you
  rendering: This command applies to both the native-born and the foreigners living among you.
  claim: The prohibition binds both native-born people and resident foreigners.
  evidence:
  - The Hebrew syntax places both groups under the prohibition.
  - The POB theological decision explicitly identifies both groups as bound by the command.
  confidence: high
  alternatives_preserved:
  - The phrase may be read appositionally without stressing equality.
translation_notes:
  risk_flags:
  - risk: “Foreigners” alone could suggest visitors rather than established residents.
    mitigation: The words “living among you” preserve the resident-community sense.
