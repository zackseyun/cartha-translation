translation:
  language: en
  text: Speak to the people of Israel[a] and tell them, “I am Yahweh your God.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “sons of Israel,” a family expression for the people of Israel as a whole; it may also be translated “the children of Israel” or “the Israelites.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal name of God, traditionally rendered “the LORD.”
    reason: alternative_reading
