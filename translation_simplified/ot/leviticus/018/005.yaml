translation:
  language: en
  text: So you must obey my laws and my legal rulings. If a man[a] obeys them, he shall live by them.[b] I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents anyone.
    reason: lexical_alternative
  - marker: b
    text: Or, “he shall live in them.” The Hebrew can describe either the means of life or the realm in which one lives.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you shall keep
  simplified_phrase: you must obey
  preserved_meaning: God requires faithful compliance with his commands.
  reasoning_layer_used: The lexical rationale treats the Hebrew form as legal instruction and covenantal keeping.
  rationale: “Must obey” states the required action in direct modern English.
- pob_phrase: my statutes and my judgments
  simplified_phrase: my laws and my legal rulings
  preserved_meaning: The two distinct kinds of divine legal instruction remain separate.
  reasoning_layer_used: The lexical decisions distinguish prescribed enactments from legal judgments.
  rationale: The new wording explains both legal terms without merging them.
- pob_phrase: which if a man does them
  simplified_phrase: If a man obeys them
  preserved_meaning: Life is connected conditionally with carrying out these commands.
  reasoning_layer_used: The lexical rationale identifies concrete obedience and an implied conditional sense.
  rationale: The shorter clause expresses the Hebrew idiom naturally.
translation_notes:
  risk_flags:
  - risk: “Obey” is less concrete than the source wording about doing the commands.
    mitigation: The wording still presents obedience as action required of the man.
  - risk: Modern readers may understand “live by them” only as describing the means of life.
    mitigation: Footnote b preserves the possible sphere or realm reading.
