translation:
  language: en
  text: 'So you must carry out the duty I have given you: do not follow any of the abominable customs[a] practiced by the people who lived in the land before you, and do not make yourselves unclean by them. I am Yahweh your God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “abominable prescribed practices” or “abominable statutes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall keep my charge
  simplified_phrase: you must carry out the duty I have given you
  preserved_meaning: God has given Israel a binding obligation that they must observe.
  reasoning_layer_used: POB lexical decisions for וּשְׁמַרְתֶּם and מִשְׁמַרְתִּי
  rationale: This explains the formal phrase without adding a separate manner of obedience.
- pob_phrase: so as not to practice any of the abominable statutes
  simplified_phrase: do not follow any of the abominable customs
  preserved_meaning: Israel must avoid the established detestable practices of the former inhabitants.
  reasoning_layer_used: POB lexical decisions for לְבִלְתִּי עֲשׂוֹת, מֵחֻקּוֹת, and הַתּוֹעֵבֹת
  rationale: The direct command and common word “customs” clearly express the prohibited repeated conduct.
- pob_phrase: that were practiced before you
  simplified_phrase: practiced by the people who lived in the land before you
  preserved_meaning: These were practices of the inhabitants who preceded Israel in the land.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם and immediate context
  rationale: This removes the misleading possibility that the acts occurred in Israel’s presence.
interpretive_expansions:
- pob_phrase: before you
  rendering: by the people who lived in the land before you
  claim: The phrase refers to the inhabitants who occupied the land before Israel.
  evidence:
  - The POB audit explicitly identifies a temporal-cultural sense tied to Israel’s arrival in the land.
  - Leviticus 18:3 and 18:24–28 connect these practices with the land’s former inhabitants.
  confidence: high
  alternatives_preserved:
  - before you
translation_notes:
  risk_flags:
  - risk: “Customs” could sound as though every earlier cultural custom is condemned.
    mitigation: “Abominable” restricts the command, and the footnote preserves the sense of prescribed practices or statutes.
