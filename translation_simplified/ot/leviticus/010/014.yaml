translation:
  language: en
  text: You, together with your sons and daughters, are to eat the breast that was waved before the LORD and the thigh that was set apart as a contribution. Eat them in a clean place.[a] They have been given as the assigned portion for you and your sons from the peace offerings of the sons of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “clean” refers to ritual cleanness.
    reason: simplification_note
  - marker: b
    text: “The sons of Israel” is the Hebrew expression for Israel’s people as a whole.
    reason: source_note
simplification_decisions:
- pob_phrase: the breast of the wave offering and the thigh of the contribution
  simplified_phrase: the breast that was waved before the LORD and the thigh that was set apart as a contribution
  preserved_meaning: The animal portions and the distinct ritual treatment of each remain explicit.
  reasoning_layer_used: POB lexical decisions for חֲזֵה הַתְּנוּפָה and שׁוֹק הַתְּרוּמָה
  rationale: The wording explains unfamiliar offering terms while preserving both ritual actions.
- pob_phrase: you, and your sons and your daughters with you, shall eat
  simplified_phrase: You, together with your sons and daughters, are to eat
  preserved_meaning: The instruction applies to the priest together with his explicitly named sons and daughters.
  reasoning_layer_used: POB lexical decisions for תֹּאכְלוּ and the household phrase
  rationale: Natural word order preserves both the command and household participation.
- pob_phrase: because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel
  simplified_phrase: They have been given as the assigned portion for you and your sons from the peace offerings of the sons of Israel
  preserved_meaning: These parts are the established priestly share from Israel’s peace offerings.
  reasoning_layer_used: POB lexical and theological decisions for חָק, נִתְּנוּ, שְׁלָמִים, and בְּנֵי יִשְׂרָאֵל
  rationale: A separate sentence clarifies the reason without claiming who performed the sacrifice.
