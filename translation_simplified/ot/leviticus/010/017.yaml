translation:
  language: en
  text: Why didn’t you eat the sin offering[a] in the holy place? It is most holy. God gave it to you so that you could carry the congregation’s guilt and make atonement for them before Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to an offering that addresses sin and removes impurity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For it is most holy, and he has given it to you
  simplified_phrase: It is most holy. God gave it to you
  preserved_meaning: The offering has the highest sacred status and was assigned to the priests by God.
  reasoning_layer_used: Theological decision on the implied subject of נָתַן and lexical decision on קֹדֶשׁ קָדָשִׁים.
  rationale: Two sentences clarify the logic, while “God” identifies the implied subject established by context.
- pob_phrase: to bear the iniquity of the congregation
  simplified_phrase: to carry the congregation’s guilt
  preserved_meaning: The priests representatively bear the community’s guilt in their sacrificial service.
  reasoning_layer_used: Lexical decision on לָשֵׂאת אֶת עֲוֺן הָעֵדָה.
  rationale: “Carry” preserves the source image, while “guilt” is clearer than “iniquity” for common readers.
- pob_phrase: to make atonement for them before Yahweh
  simplified_phrase: make atonement for them before Yahweh
  preserved_meaning: The priestly rite addresses the congregation’s guilt in God’s presence.
  reasoning_layer_used: Lexical decisions on לְכַפֵּר עֲלֵיהֶם and לִפְנֵי יְהוָה.
  rationale: The established theological term “atonement” remains because a broader paraphrase would lose sacrificial meaning.
interpretive_expansions:
- pob_phrase: he has given it to you
  rendering: God gave it to you
  claim: The unstated subject of “gave” is God.
  evidence:
  - The POB theological decision identifies God as the implied subject.
  - The immediate context concerns God’s assignment of priestly portions.
  confidence: high
  alternatives_preserved:
  - He gave it to you
  - It was given to you
translation_notes:
  risk_flags:
