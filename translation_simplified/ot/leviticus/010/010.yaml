translation:
  language: en
  text: to tell the difference between what is holy and what is common,[a] and between what is ritually unclean and what is ritually clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “common” means not set apart as holy; it does not necessarily mean irreverent or wicked.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to distinguish between the holy and the common
  simplified_phrase: to tell the difference between what is holy and what is common
  preserved_meaning: Priests must recognize the distinction between the holy category and the non-holy category.
  reasoning_layer_used: POB lexical and theological decisions for וּלֲהַבְדִּיל, הַקֹּדֶשׁ, and הַחֹל
  rationale: The rewrite uses familiar wording while preserving “common” as non-holy rather than wicked.
- pob_phrase: between the unclean and the clean
  simplified_phrase: between what is ritually unclean and what is ritually clean
  preserved_meaning: The contrast concerns Levitical ritual status, not necessarily moral guilt or physical dirt.
  reasoning_layer_used: POB theological decision on טָמֵא and טָהוֹר
  rationale: Adding “what is” makes the categories natural in English, while “ritually” prevents a moral or hygienic misunderstanding.
