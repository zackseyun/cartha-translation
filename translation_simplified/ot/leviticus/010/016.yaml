translation:
  language: en
  text: Moses searched carefully for the goat of the sin offering. He discovered that it had been burned up. So he became angry with Eleazar and Ithamar, Aaron’s remaining sons, and said,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: diligently searched for
  simplified_phrase: searched carefully for
  preserved_meaning: Moses made an active and thorough search.
  reasoning_layer_used: The lexical decision identifies the Hebrew verb construction as emphatic.
  rationale: “Searched carefully” expresses the emphasis in familiar English.
- pob_phrase: and behold, it had been burned up
  simplified_phrase: He discovered that it had been burned up.
  preserved_meaning: Moses found the goat in a fully burned state.
  reasoning_layer_used: The lexical decisions preserve both sudden discovery and the goat’s resulting condition.
  rationale: A separate sentence makes the discovery clear without the elevated word “behold.”
- pob_phrase: saying,
  simplified_phrase: and said,
  preserved_meaning: Moses’ speech begins in the next verse.
  reasoning_layer_used: The lexical decision lists “and said” as a natural alternative.
  rationale: The finite verb is smoother modern English while keeping the verse open to the speech that follows.
translation_notes:
  risk_flags:
  - risk: Replacing “behold” may reduce the narrative’s marked call to attention.
    mitigation: “He discovered” preserves the moment of finding that triggers Moses’ anger.
