simplification_decisions:
- pob_phrase: You shall eat it
  simplified_phrase: You must eat it
  preserved_meaning: The words remain a direct command to the priests.
  reasoning_layer_used: Lexical decision for וַאֲכַלְתֶּם
  rationale: “Must” expresses the command naturally in modern English.
- pob_phrase: your portion and the portion of your sons
  simplified_phrase: your assigned portion and the assigned portion of your sons
  preserved_meaning: Aaron’s allotted share remains distinct from the allotted share of his sons.
  reasoning_layer_used: Lexical and theological decisions for חָקְךָ ... וְחָק בָּנֶיךָ
  rationale: “Assigned” clarifies the priestly entitlement while repeating “portion” preserves both shares.
- pob_phrase: for so I have been commanded
  simplified_phrase: This is what I have been commanded
  preserved_meaning: Moses states that he received this instruction as a command.
  reasoning_layer_used: Lexical decision for כִּי כֵן צֻוֵּיתִי
  rationale: A separate sentence removes the archaic phrase “for so” while preserving the passive command.
