- pob_phrase: you shall not go out from the entrance
  simplified_phrase: Do not leave the entrance
  preserved_meaning: They are strictly forbidden to depart from the sanctuary entrance.
  reasoning_layer_used: Lexical decision for לֹא תֵצְאוּ and וּמִפֶּתַח
  rationale: A direct command is clearer modern English while keeping the prohibition’s full force.
- pob_phrase: lest you die
  simplified_phrase: or you will die
  preserved_meaning: Death is the warned consequence of disobedience.
  reasoning_layer_used: Lexical decision for פֶּן תָּמֻתוּ
  rationale: The stated alternative preserves the solemn warning without the uncommon word “lest.”
- pob_phrase: they did according to the word of Moses
  simplified_phrase: they did what Moses commanded
  preserved_meaning: They obeyed Moses’ spoken instruction.
  reasoning_layer_used: Lexical decisions for וַיַּעֲשׂוּ and כִּדְבַר מֹשֶׁה
  rationale: The active wording states their obedient response in ordinary English.
