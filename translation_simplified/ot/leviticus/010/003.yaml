translation:
  language: en
  text: Then Moses told Aaron, “Yahweh said, ‘Among those who come near me, I will show myself holy,[a] and I will be glorified[b] before all the people.’” Aaron was silent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will be treated as holy by those who come near me.” The Hebrew can refer either to God showing his holiness or to those approaching him recognizing it.
    reason: alternative_reading
  - marker: b
    text: Or, “I will be honored.”
    reason: lexical_alternative
