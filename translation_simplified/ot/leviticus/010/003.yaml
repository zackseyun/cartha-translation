  preserved_meaning: Moses directly addresses Aaron with Yahweh’s declaration.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: “Told” reads naturally before a quoted explanation addressed to Aaron.
- pob_phrase: And Aaron was silent
