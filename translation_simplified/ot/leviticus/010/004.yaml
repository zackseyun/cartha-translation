  text: Then Moses called Mishael and Elzaphan, the sons of Uzziel, who was Aaron’s uncle. He said to them, “Come near. Carry the bodies of your brothers[a] away from the front of the sanctuary and take them outside the camp.”
  philosophy: optimal-equivalence
