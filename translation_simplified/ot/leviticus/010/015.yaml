translation:
  language: en
  text: They must bring the thigh given as a contribution and the breast of the wave offering, along with the food offerings made by burning the fat portions, to present as a wave offering before Yahweh.[a] These portions will belong to you and your sons as a permanent rule, just as Yahweh commanded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A wave offering was ritually presented before Yahweh.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the thigh of the contribution
  simplified_phrase: the thigh given as a contribution
  preserved_meaning: The thigh is the dedicated portion contributed for priestly use.
  reasoning_layer_used: Lexical decisions for שׁוֹק and תְּרוּמָה
  rationale: The recast wording clearly shows how the thigh functions as a contribution.
- pob_phrase: along with the food offerings of the fat portions
  simplified_phrase: along with the food offerings made by burning the fat portions
  preserved_meaning: The priestly portions accompany offerings in which the sacrificial fat portions are burned to God.
  reasoning_layer_used: Lexical decision for עַל אִשֵּׁי הַחֲלָבִים and grounding review
  rationale: This wording keeps “food offerings” while making their connection with the burning of the fat portions clear.
- pob_phrase: and it shall be for you and for your sons with you as a permanent statute
  simplified_phrase: These portions will belong to you and your sons as a permanent rule
  preserved_meaning: The priest and his sons have an enduring prescribed right to these portions.
  reasoning_layer_used: Lexical decisions for וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ and לְחָק עוֹלָם
  rationale: An explicit subject and direct ownership language replace the dense legal construction.
interpretive_expansions:
- pob_phrase: it shall be for you and for your sons with you
  rendering: These portions will belong to you and your sons
  claim: The clause grants the priestly family entitlement to the thigh and breast.
  evidence:
  - The POB lexical rationale says the phrase expresses priestly entitlement to these portions.
  confidence: high
  alternatives_preserved:
  - will be for you and your sons
translation_notes:
  risk_flags:
  - risk: Readers may imagine ordinary hand-waving rather than a sacrificial presentation.
    mitigation: The cultural footnote identifies the waving as a ritual presentation before Yahweh.
  - risk: The compact phrase “to present as a wave offering” leaves the precise grammatical scope unstated.
    mitigation: This preserves the source and POB construction rather than explicitly naming the thigh and breast as the repeated objects.
