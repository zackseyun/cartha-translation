translation:
  language: en
  text: Moses said to Aaron and to his sons Eleazar and Ithamar, “Do not show mourning by letting your hair hang loose[a] or by tearing your clothes. Otherwise, you will die, and Yahweh will become angry with the whole community.[b] But your brothers—the whole people of Israel—shall weep over the burning that Yahweh has kindled.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a mourning sign involving loose or unkempt hair; it has also been translated “uncover your heads.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not name the one who will become angry; the context points to Yahweh.
    reason: source_note
simplification_decisions:
- pob_phrase: Do not let your heads hang loose, and do not tear your garments
  simplified_phrase: Do not show mourning by letting your hair hang loose or by tearing your clothes
  preserved_meaning: Both prohibited mourning signs remain distinct.
  reasoning_layer_used: POB lexical decisions for פרע and פרם
  rationale: This explains the unfamiliar head image while retaining loose hair and torn clothing.
- pob_phrase: so that you do not die and he become angry with all the congregation
  simplified_phrase: Otherwise, you will die, and Yahweh will become angry with the whole community
  preserved_meaning: Disobedience brings the stated consequences of death and divine anger against the community.
  reasoning_layer_used: POB lexical and theological decisions for מות, קצף, and עדה
  rationale: A direct warning clarifies the consequence without weakening it as a mere possibility.
- pob_phrase: your brothers, the whole house of Israel
  simplified_phrase: your brothers—the whole people of Israel
  preserved_meaning: The brothers are identified collectively as Israel.
  reasoning_layer_used: POB lexical decisions for אחיכם and כל בית ישראל
  rationale: The dash clarifies the apposition, while “whole people” plainly conveys the national sense.
interpretive_expansions:
- pob_phrase: Do not let your heads hang loose, and do not tear your garments
  rendering: Do not show mourning by letting your hair hang loose or by tearing your clothes
  claim: Both actions are signs of mourning.
  evidence:
  - The POB lexical rationales identify loose hair and torn garments as mourning gestures.
  - The immediate context concerns Israel’s response to the deaths of Nadab and Abihu.
  confidence: high
  alternatives_preserved:
  - Do not uncover your heads.
  - Do not leave your hair unkempt.
- pob_phrase: he become angry
  rendering: Yahweh will become angry
  claim: Yahweh is the implied subject of the singular Hebrew verb.
  evidence:
  - The POB theological decision identifies Yahweh as the implied subject.
  - The immediate context presents Yahweh as the one carrying out judgment.
  confidence: high
  alternatives_preserved:
  - he will become angry
  - anger will come upon the whole community
translation_notes:
  risk_flags:
  - risk: Naming Yahweh makes the implicit Hebrew subject explicit.
    mitigation: A footnote notes that Hebrew leaves the subject unnamed.
  - risk: “Show mourning” could sound broader than the two specified actions.
    mitigation: The text immediately identifies both concrete mourning signs.
