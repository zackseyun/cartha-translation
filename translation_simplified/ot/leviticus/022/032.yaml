simplification_decisions:
- pob_phrase: shall not profane my holy name
  simplified_phrase: do not treat my holy name as ordinary
  preserved_meaning: God forbids treating his holy name as common rather than holy.
  reasoning_layer_used: POB lexical decision for תְחַלְּלוּ
  rationale: The wording explains the cultic meaning of “profane” in common English.
- pob_phrase: I will be sanctified among
  simplified_phrase: I will be treated as holy among
  preserved_meaning: God is to be regarded as holy within Israel.
  reasoning_layer_used: POB lexical decision and footnote for וְנִקְדַּשְׁתִּי
  rationale: This uses a documented alternative while making “sanctified” immediately clear.
- pob_phrase: who sanctifies you
  simplified_phrase: who makes you holy
  preserved_meaning: Yahweh continually acts to set his people apart as holy.
  reasoning_layer_used: POB lexical decision for מְקַדִּשְׁכֶם
  rationale: The documented dynamic alternative preserves the holiness theme without technical vocabulary.
