translation:
  language: en
  text: Do not treat my holy name as ordinary. I will be treated as holy among the sons of Israel.[a] I am Yahweh, who makes you holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” is the Hebrew expression for the whole people of Israel.
