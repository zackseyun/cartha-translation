translation:
  language: en
  text: No man descended from Aaron who has a skin disease[a] or a bodily discharge may eat any of the sacred offerings until he becomes ritually clean. The same restriction applies if he touches anything made unclean because of a dead person,[b] or if he has an emission of semen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “leprous.” The Hebrew refers broadly to a ritually defiling skin condition, not necessarily modern leprosy.
    reason: lexical_alternative
  - marker: b
    text: This may instead mean “any person made unclean by a dead body.” The Hebrew expression concerns impurity connected with a corpse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Any man from the offspring of Aaron
  simplified_phrase: No man descended from Aaron
  preserved_meaning: The prohibition concerns male descendants of Aaron.
  reasoning_layer_used: Lexical and theological decisions on lineage and gender
  rationale: “Descended from Aaron” expresses the genealogy naturally while retaining the male priestly subject.
- pob_phrase: shall not eat from the holy things
  simplified_phrase: may eat any of the sacred offerings
  preserved_meaning: A ritually unclean priest is prohibited from eating consecrated priestly food.
  reasoning_layer_used: Lexical decision for בַּקֳּדָשִׁים and the eating context
  rationale: “Sacred offerings” clearly identifies the holy things as consecrated food portions.
- pob_phrase: And whoever touches ... or a man from whom an emission of semen comes out
  simplified_phrase: The same restriction applies if he touches ... or if he has an emission of semen
  preserved_meaning: These are additional impurity conditions that disqualify the same Aaronic man from eating sacred food.
  reasoning_layer_used: Hebrew list syntax, lexical decisions, and theological decision on the legal subject
  rationale: Conditional clauses keep the later cases tied to the Aaronic male subject without repeating the full prohibition.
interpretive_expansions:
- pob_phrase: until he becomes clean
  rendering: until he becomes ritually clean
  claim: The cleanness concerns ceremonial eligibility, not medical recovery or moral purity.
  evidence:
  - The theological decision identifies priestly eligibility and ritual cleanness as the verse’s framework.
  - The listed bodily conditions restrict access to sacred food.
  confidence: high
  alternatives_preserved:
