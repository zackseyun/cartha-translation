translation:
  language: en
  text: 'Speak to Aaron, his sons, and all the Israelites. Tell them: If any man from the house of Israel or from among the resident foreigners living in Israel[a] presents an offering to Yahweh as a burnt offering—in connection with any vow or as a freewill offering—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A resident foreigner was a non-Israelite living among Israel under its communal order.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Speak to Aaron and to his sons and to all the sons of Israel, and say to them
  simplified_phrase: Speak to Aaron, his sons, and all the Israelites. Tell them
  preserved_meaning: The command addresses Aaron, his priestly sons, and all Israel.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The familiar term “Israelites” clarifies the Hebrew kinship idiom, and two sentences make the command easier to follow.
- pob_phrase: or from the sojourners in Israel
  simplified_phrase: or from among the resident foreigners living in Israel
  preserved_meaning: The law includes non-Israelites residing within Israel’s community.
  reasoning_layer_used: POB lexical decision for הַגֵּר בְּיִשְׂרָאֵל
  rationale: “Resident foreigners” makes the legal and social status clearer than “sojourners.”
- pob_phrase: who presents his offering ... which they present to Yahweh as a burnt offering
  simplified_phrase: presents an offering to Yahweh as a burnt offering
  preserved_meaning: The worshiper brings the offering to Yahweh as the specified kind of sacrifice.
  reasoning_layer_used: POB lexical and theological decisions for the offering, divine name, and burnt offering
  rationale: Removing repetition makes the action direct while retaining its recipient and sacrificial category.
