  simplified_phrase: Tell Aaron and his sons
  preserved_meaning: God commands Moses to deliver this instruction to Aaron and his sons.
  reasoning_layer_used: lexical decision for דַּבֵּר
  rationale: “Tell” expresses the directive naturally in modern English.
- pob_phrase: the holy things of the sons of Israel
  simplified_phrase: the holy things that the people of Israel set apart for me as holy
  preserved_meaning: These are sacred things belonging to or presented by Israel and consecrated to God.
  reasoning_layer_used: lexical decisions and footnotes b–c
  rationale: The wording explains the formal national expression and connects the holy things with their consecration.
- pob_phrase: not profane my holy name
  simplified_phrase: do not treat my holy name as unholy
  preserved_meaning: The priests must not violate the holiness of God’s name through misuse of sacred things.
  reasoning_layer_used: lexical decision for יְחַלְּלוּ and theological rationale
  rationale: The plain-language phrase preserves the contrast between holy and profane.
