translation:
  language: en
  text: 'From the peace offering, he must present these parts as an offering burned for Yahweh: its fat, including the whole fatty tail,[a] cut off close to the backbone; the fat covering the internal organs; and all the fat on the internal organs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means the sheep’s whole broad, fatty tail.
    reason: cultural_note
simplification_decisions:
- pob_phrase: an offering made by fire to Yahweh
  simplified_phrase: an offering burned for Yahweh
  preserved_meaning: The offering is presented to Yahweh on the altar by fire.
  reasoning_layer_used: Lexical decision for אִשֶּׁה and theological decision for יְהוָה
  rationale: The direct wording retains both the ritual use of fire and the divine name.
- pob_phrase: the whole fat tail, which he shall remove close to the backbone
  simplified_phrase: the whole fatty tail, cut off close to the backbone
  preserved_meaning: The entire fatty tail is removed at the specified anatomical point.
  reasoning_layer_used: Lexical decisions for הָאַלְיָה תְמִימָה, לְעֻמַּת הֶעָצֶה, and יְסִירֶנָּה
  rationale: The shorter wording keeps both the whole tail and its removal point.
- pob_phrase: the fat that covers the entrails, and all the fat that is on the entrails
  simplified_phrase: the fat covering the internal organs; and all the fat on the internal organs
  preserved_meaning: The text distinguishes fat covering the organs from other fat on them.
  reasoning_layer_used: Lexical decisions for both phrases containing הַקֶּרֶב and the grounding review
  rationale: “Internal organs” is familiar English, while “on” avoids narrowing the source to attached fat.
translation_notes:
  risk_flags:
  - risk: “Burned for Yahweh” may suggest that the whole animal is burned.
    mitigation: “These parts” limits the burning to the portions listed.
  - risk: “Internal organs” is less anatomically vivid than “entrails.”
    mitigation: It clearly preserves the reference to the animal’s inner parts.
