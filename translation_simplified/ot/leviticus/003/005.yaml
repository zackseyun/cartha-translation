translation:
  language: en
  text: Aaron’s sons must burn it on the altar, on top of the burnt offering that rests on the wood over the fire. It is a food offering[a], an aroma pleasing to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “an offering made by fire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall burn it
  simplified_phrase: must burn it
  preserved_meaning: The priests are required to burn the specified portion as part of the ritual.
  reasoning_layer_used: Lexical decision for וְהִקְטִירוּ and its procedural force
  rationale: “Must” states the required ritual action more directly than formal “shall.”
- pob_phrase: that is on the wood that is on the fire
  simplified_phrase: that rests on the wood over the fire
  preserved_meaning: The burnt offering is positioned on the altar wood above the fire.
  reasoning_layer_used: Lexical decision for the repeated עַל clauses
  rationale: The recast clause preserves the altar arrangement without the difficult repetition.
- pob_phrase: a pleasing aroma to Yahweh
  simplified_phrase: an aroma pleasing to Yahweh
  preserved_meaning: The offering’s aroma is acceptable and pleasing to Yahweh.
  reasoning_layer_used: Lexical decision for רֵיחַ נִיחֹחַ and theological decision for יְהוָה
  rationale: The natural word order keeps both the sacrificial image and the divine name.
translation_notes:
  risk_flags:
  - risk: “Food offering” may sound as though Yahweh literally eats.
    mitigation: The term is retained as POB’s chosen cultic category, while the footnote gives the fire-offering alternative.
