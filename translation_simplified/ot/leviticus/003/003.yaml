translation:
  language: en
  text: From the peace offering, he must present to Yahweh as a food offering[a] the fat covering the inner organs and all the fat attached to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering by fire” or “a fire offering.”
