  rationale: The shorter phrase removes ritual redundancy without changing the offering category.
- pob_phrase: he shall present
  simplified_phrase: he must present
  preserved_meaning: The priest is required to formally offer these portions to God.
  reasoning_layer_used: POB lexical decision for וְהִקְרִיב
  rationale: “Must” expresses the command naturally in modern English while “present” retains the ritual act.
- pob_phrase: the entrails ... all the fat that is on the entrails
  simplified_phrase: the inner organs ... all the fat attached to them
  preserved_meaning: Both the fat covering the organs and the other fat joined to them are included.
