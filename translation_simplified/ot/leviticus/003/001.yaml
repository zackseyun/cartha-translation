translation:
  language: en
  text: If anyone brings a sacrifice as a peace offering[a] from the herd, the animal may be male or female. The animal must have no defects when it is offered before Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a sacrifice as a fellowship offering.” The Hebrew names this type of sacrifice with a term traditionally rendered “peace offering.”
    reason: lexical_alternative
