translation:
  language: en
  text: If the priest examines the affected area of the scaly outbreak[a] and sees that it does not look sunken below the skin and has no black hair in it, he must isolate the affected person for seven days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was a specific skin or scalp condition, traditionally called a “scall”; it may also be translated “itch.”
    reason: lexical_alternative
