translation:
  language: en
  text: On the seventh day, the priest must inspect the infection. If it has spread in the garment, in its lengthwise or crosswise threads, or in the leather or anything made from leather, it is a destructive, defiling condition.[a] It is unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “leprosy” covers various conditions associated with ritual impurity and can also affect garments and leather.
    reason: lexical_alternative
