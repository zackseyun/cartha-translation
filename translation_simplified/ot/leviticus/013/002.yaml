translation:
  language: en
  text: When a man has a swelling, scab, or bright spot on his skin, and it becomes a case of skin disease,[a] he must be brought to Aaron the priest or to one of Aaron’s sons who are priests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “a case of leprosy” or “a leprous disease.” The Hebrew term covers a broader category of skin disease and does not necessarily mean modern Hansen’s disease.
    reason: alternative_reading
