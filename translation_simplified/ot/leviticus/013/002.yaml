  preserved_meaning: The condition appears on the man’s bodily skin.
  reasoning_layer_used: Lexical decision for בְּעוֹר בְּשָׂרוֹ
  rationale: The shorter wording keeps the concrete physical meaning without the redundant phrase “of his body.”
- pob_phrase: an infection of skin disease
  simplified_phrase: a case of skin disease
  preserved_meaning: The mark has developed into an instance of the biblical skin-disease category.
  reasoning_layer_used: Lexical and theological decisions for לְנֶגַע צָרָעַת
  rationale: This names the disease category clearly without implying Hansen’s disease or a bacterial infection.
- pob_phrase: he shall be brought ... to one of his sons the priests
  simplified_phrase: he must be brought ... to one of Aaron’s sons who are priests
  preserved_meaning: The required procedure is to bring him to Aaron or one of his priestly sons.
  reasoning_layer_used: Lexical decisions for וְהוּבָא and אַחַד מִבָּנָיו הַכֹּהֲנִים
  rationale: “Must” states the legal requirement naturally, while “Aaron’s” removes an unclear pronoun.
