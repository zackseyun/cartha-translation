translation:
  language: en
  text: The man has a skin disease[a] and is unclean.[b] The priest must declare him unclean; the disease is on his head.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally rendered “leprous,” but this condition is not necessarily modern leprosy (Hansen’s disease).
    reason: lexical_alternative
  - marker: b
    text: Here “unclean” means ritually unclean under Israel’s worship laws.
    reason: cultural_note
