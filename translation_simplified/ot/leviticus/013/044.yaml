  reasoning_layer_used: POB lexical decision for צָרוּעַ and אִישׁ
  rationale: This avoids misleading medical specificity while retaining the male legal case.
- pob_phrase: shall surely pronounce him unclean
  simplified_phrase: must declare him unclean
  preserved_meaning: The priest is required to make an emphatic official declaration of uncleanness.
  reasoning_layer_used: POB lexical decision for טַמֵּא יְטַמְּאֶנּוּ
  rationale: “Must declare” expresses both the legal force and the priest’s diagnostic role in common English.
