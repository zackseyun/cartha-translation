- pob_phrase: Then the priest shall examine him again on the seventh day
  simplified_phrase: On the seventh day, the priest must examine the person again.
  preserved_meaning: The priest conducts the required second official inspection on the seventh day.
  reasoning_layer_used: POB lexical decisions for וְרָאָה and שֵׁנִית
  rationale: The shorter clause order is easier to follow while keeping the official examination and its timing.
- pob_phrase: the priest shall pronounce him clean; it is a scaly eruption
  simplified_phrase: the priest must pronounce him clean. It is a minor, scaly skin eruption.
  preserved_meaning: The priest gives an authoritative purity verdict because the condition is relatively minor.
  reasoning_layer_used: POB lexical and theological decisions for וְטִהֲרוֹ הַכֹּהֵן and מִסְפַּחַת
  rationale: Two sentences distinguish the priest's verdict from the identification of the skin condition.
- pob_phrase: He shall wash his clothes and be clean.
  simplified_phrase: The person must wash his clothes, and then he will be ritually clean.
  preserved_meaning: After washing his clothes, the examined person has clean ritual status.
  reasoning_layer_used: POB lexical decisions and ritual-purity theological decision
  rationale: Naming the person removes an unclear pronoun, and “then” makes the result clear.
