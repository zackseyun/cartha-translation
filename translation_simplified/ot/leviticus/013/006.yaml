translation:
  language: en
  text: On the seventh day, the priest must examine the person again. If the infection has faded and has not spread in the skin, the priest must pronounce him clean. It is a minor, scaly skin eruption. The person must wash his clothes, and then he will be ritually clean.
  philosophy: optimal-equivalence
