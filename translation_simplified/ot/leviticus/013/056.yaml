translation:
  language: en
  text: But if the priest examines it and sees that the spot has faded after washing, he must tear the affected part out of the garment, the leather, or the lengthwise or crosswise threads.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lengthwise threads are the warp; the crosswise threads are the weft, traditionally called the woof.
    reason: simplification_note
simplification_decisions:
- pob_phrase: and behold, the spot has faded
  simplified_phrase: and sees that the spot has faded
  preserved_meaning: The priest observes during his examination that the affected spot is less intense.
  reasoning_layer_used: lexical decisions for וְהִנֵּה and כֵּהָה
  rationale: Ordinary English folds the attention marker into the priest’s act of seeing without losing its emphasis.
- pob_phrase: then he shall tear it out
  simplified_phrase: he must tear the affected part out
  preserved_meaning: The priest is required to remove the affected portion rather than destroy the whole item.
  reasoning_layer_used: lexical decision for וְקָרַע אֹתוֹ
  rationale: The explicit object prevents readers from thinking the entire item must be torn apart.
- pob_phrase: the warp, or out of the woof
  simplified_phrase: the lengthwise or crosswise threads
  preserved_meaning: The rule applies specifically to either direction of threads in woven material.
  reasoning_layer_used: lexical decisions for מִן הַשְּׁתִי and מִן הָעֵרֶב
  rationale: Common descriptions replace opaque textile terms while the footnote preserves the technical names.
interpretive_expansions:
- pob_phrase: tear it out
  rendering: tear the affected part out
  claim: The object removed is the affected section of the material, not the whole item.
  evidence:
  - The POB lexical rationale explicitly identifies the object as the affected portion.
  - The listed sources from which it is removed indicate removal of a section.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Replacing “behold” may reduce the force of the Hebrew attention marker.
    mitigation: “Sees that” keeps the discovery prominent within the priest’s examination.
  - risk: Plain descriptions could obscure the precise textile categories.
    mitigation: The footnote identifies them as warp and weft or woof.
