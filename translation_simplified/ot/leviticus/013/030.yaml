  reasoning_layer_used: POB translation and priestly legal context
  rationale: “Must” expresses the legal requirement more naturally than “shall.”
- pob_phrase: behold, its appearance is deeper than the skin
  simplified_phrase: If it looks sunken below the skin
  preserved_meaning: The diagnosis depends on the area appearing depressed beneath skin level.
  reasoning_layer_used: POB lexical decision for מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  rationale: The conditional wording makes the diagnostic sequence clear while preserving the visual finding.
- pob_phrase: shall pronounce him unclean
  simplified_phrase: must pronounce the person unclean
  preserved_meaning: The priest issues a ritual verdict rather than causing uncleanness.
  reasoning_layer_used: POB lexical decision for וְטִמֵּא אֹתוֹ
  rationale: “The person” is clear modern English and keeps the verdict’s judicial force.
