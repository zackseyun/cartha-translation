translation:
  language: en
  text: The priest must examine the diseased area. If it looks sunken below the skin and has thin yellow hair in it, the priest must pronounce the person unclean. It is an itch[a], a skin disease[b] of the head or beard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “scall”; the exact medical condition is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term covers various serious skin diseases and does not necessarily mean Hansen’s disease, which is often called leprosy.
    reason: cultural_note
