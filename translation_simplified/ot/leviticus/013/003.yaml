  text: The priest must examine the diseased spot on the person’s skin. If the hair in the spot has turned white and the spot looks lower than the surrounding skin, then it is a diseased spot—a case of skin disease.[a] After examining the person, the priest must pronounce that person ritually unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “a spot of leprosy” or “a leprous infection”; the Hebrew term covers a broader category than modern leprosy.
    reason: lexical_alternative
