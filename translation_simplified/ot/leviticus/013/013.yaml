translation:
  language: en
  text: The priest must examine the person. If he sees that the skin disease[a] covers the person’s whole body and that all the affected skin has turned white, he must pronounce the person clean. The person is clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “leprosy” includes a range of skin diseases, not only modern leprosy.
    reason: lexical_alternative
