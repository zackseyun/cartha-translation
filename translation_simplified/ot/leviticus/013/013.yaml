  reasoning_layer_used: Lexical decision for וְרָאָה and procedural case-law context
  rationale: The explicit noun and shorter sentences make the procedure clear without the surrounding verses.
- pob_phrase: has covered all his flesh
  simplified_phrase: covers the person’s whole body
  preserved_meaning: The disease extends over the person’s entire bodily surface.
  reasoning_layer_used: Lexical decision for אֶת כָּל בְּשָׂרוֹ
  rationale: “Whole body” avoids suggesting that only muscle tissue is meant.
- pob_phrase: then he shall pronounce the affected person clean; all of it has turned white
  simplified_phrase: all the affected skin has turned white, he must pronounce the person clean
  preserved_meaning: Complete whitening is the observed condition that leads to the priest’s purity verdict.
