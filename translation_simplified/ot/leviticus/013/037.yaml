  preserved_meaning: The condition is being assessed from the priest's perspective during an inspection.
  reasoning_layer_used: POB lexical decision for בְּעֵינָיו and the immediate priestly context
  rationale: This replaces an opaque Hebrew idiom with ordinary English while keeping the inspection setting.
- pob_phrase: the scaly eruption has remained unchanged
  simplified_phrase: the scaly patch has not changed
  preserved_meaning: The affected area has stayed as it was rather than spreading or changing.
  reasoning_layer_used: POB lexical decisions for הַנֶּתֶק and עָמַד
  rationale: “Scaly patch” and “has not changed” make the diagnosis easier to picture without reducing it to a mere itch.
- pob_phrase: he is clean, and the priest shall pronounce him clean
  simplified_phrase: The person is clean, and the priest must pronounce him clean
  preserved_meaning: The healed person is ritually clean, and the priest gives the formal ruling rather than causing the healing.
  reasoning_layer_used: POB lexical and theological decisions for טָהוֹר הוּא and וְטִהֲרוֹ הַכֹּהֵן
  rationale: Naming “the person” removes pronoun uncertainty while preserving the priest's declarative role.
