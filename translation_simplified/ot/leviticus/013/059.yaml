translation:
  language: en
  text: This is the law about an outbreak of leprous disease[a] in a wool or linen garment, in its lengthwise or crosswise threads, or in any leather item. It tells how to declare the item ritually clean or unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term describes a broader kind of outbreak than modern leprosy and can also affect garments and leather.
    reason: source_note
