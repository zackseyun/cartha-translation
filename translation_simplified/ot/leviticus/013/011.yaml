translation:
  language: en
  text: This is a chronic skin disease on his body.[a] The priest must pronounce him unclean. The priest must not isolate him, because he is unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a long-standing skin disease.” The Hebrew term includes more conditions than modern leprosy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a chronic skin disease in the skin of his body
  simplified_phrase: a chronic skin disease on his body
  preserved_meaning: The condition is an established, persistent disease located on the person’s skin.
  reasoning_layer_used: POB lexical decisions for צָרַעַת, נוֹשֶׁנֶת, and בְּעוֹר בְּשָׂרוֹ
  rationale: This removes awkward repetition while keeping the disease explicitly at skin level.
- pob_phrase: the priest shall pronounce him unclean
  simplified_phrase: The priest must pronounce him unclean.
  preserved_meaning: The priest officially declares the person’s ritual status rather than causing it.
  reasoning_layer_used: POB lexical and theological decisions for וְטִמְּאוֹ and טמא
  rationale: “Must” states the legal instruction plainly, while “pronounce” preserves the priest’s official role.
- pob_phrase: he shall not isolate him, for he is unclean
  simplified_phrase: The priest must not isolate him, because he is unclean.
  preserved_meaning: The priest need not isolate the person for observation because his unclean status is already clear.
  reasoning_layer_used: POB lexical decision for לֹא יַסְגִּרֶנּוּ and causal reading of כִּי
  rationale: Repeating “the priest” removes pronoun ambiguity, and “because” gives the cause in ordinary English.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “unclean” for moral guilt or poor hygiene.
    mitigation: The established term is retained because it denotes ritual-legal status here.
