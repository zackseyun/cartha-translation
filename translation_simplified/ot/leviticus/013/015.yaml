  reasoning_layer_used: POB lexical decision for הַבָּשָׂר הַחַי
  rationale: “Tissue” makes the physical image clearer while “raw” preserves its force.
- pob_phrase: he shall pronounce him unclean
  simplified_phrase: he must officially declare the person unclean
  preserved_meaning: The priest issues a required purity ruling rather than causing uncleanness.
  reasoning_layer_used: POB lexical rationale and footnote b
  rationale: The revision clarifies both the legal force and who receives the ruling.
- pob_phrase: it is a skin disease
  simplified_phrase: it is a skin disease
  preserved_meaning: The condition remains broader than modern Hansen’s disease.
  reasoning_layer_used: POB lexical and theological decisions for צָרַעַת
