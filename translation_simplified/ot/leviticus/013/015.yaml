translation:
  language: en
  text: When the priest sees exposed, raw tissue,[a] he must officially declare the person unclean. The raw tissue is unclean; it is a skin disease.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “living flesh,” traditionally rendered “raw flesh.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term covers various skin conditions and does not specifically mean modern leprosy.
    reason: lexical_alternative
