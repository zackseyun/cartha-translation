translation:
  language: en
  text: For as long as he has the disease, he is unclean.[a] Yes, he is unclean. He must live alone, outside the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unclean” describes his status under the law of Leviticus; it does not necessarily mean that he is morally guilty.
    reason: cultural_note
