  preserved_meaning: His unclean status lasts for the whole time the diagnosed condition remains.
  reasoning_layer_used: POB lexical decision for הַנֶּגַע and immediate legal context
  rationale: The rewrite uses ordinary English while keeping the condition and its duration clear.
- pob_phrase: He shall be unclean. He is unclean.
