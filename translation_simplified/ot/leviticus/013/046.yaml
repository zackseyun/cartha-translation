  reasoning_layer_used: POB lexical and theological decisions for יִטְמָא and טָמֵא הוּא
  rationale: “Yes” makes the Hebrew repetition sound natural without weakening its emphasis.
- pob_phrase: He shall live alone; his dwelling shall be outside the camp.
  simplified_phrase: He must live alone, outside the camp.
  preserved_meaning: The law requires him to reside apart from the community beyond the camp.
