translation:
  language: en
  text: On the seventh day, the priest must examine the person. If the infection has indeed spread in the skin, the priest must declare the person unclean. The infection is a case of skin disease.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated “leprosy.” The Hebrew term includes serious skin conditions beyond modern leprosy (Hansen’s disease).
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the priest shall examine him
  simplified_phrase: the priest must examine the person
  preserved_meaning: The priest is required to inspect the affected person.
  reasoning_layer_used: Lexical decision for וְרָאָהוּ and the priestly diagnostic context
  rationale: “Must” states the legal requirement naturally, while “the person” avoids unclear pronoun reference.
- pob_phrase: the priest shall pronounce him unclean
  simplified_phrase: the priest must declare the person unclean
  preserved_meaning: The priest gives an official ritual-purity verdict rather than causing uncleanness.
  reasoning_layer_used: Lexical decision for וְטִמֵּא ... אֹתוֹ
  rationale: “Declare” is more familiar than “pronounce” and retains the official nature of the verdict.
- pob_phrase: it is an infection of skin disease
  simplified_phrase: The infection is a case of skin disease
  preserved_meaning: The spreading condition is identified under the law as the Hebrew category traditionally called leprosy.
  reasoning_layer_used: Lexical and theological decisions for נֶגַע צָרַעַת
  rationale: The recast sentence removes an awkward noun chain without narrowing the condition to Hansen’s disease.
