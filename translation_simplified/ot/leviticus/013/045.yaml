translation:
  language: en
  text: The person with this skin disease must wear torn clothes and leave their hair unkempt. They must cover the area around their upper lip and cry out, “Unclean! Unclean!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “unclean” describes the person’s ritual and public status, not necessarily moral guilt.
    reason: simplification_note
