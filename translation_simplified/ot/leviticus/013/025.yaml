translation:
  language: en
  text: The priest must examine the spot. If he sees that the hair in the bright spot has turned white and that the spot looks sunken below the surrounding skin, then a skin disease[a] has broken out in the burn scar. The priest must pronounce the person unclean. This is a skin-disease lesion.
  philosophy: optimal-equivalence
  footnotes:
