translation:
  language: en
  text: If a greenish or reddish spot is found on a garment, on leather, in the lengthwise or crosswise threads of woven fabric, or on any leather item, it is a diseased spot of the kind called “skin disease.”[a] It must be shown to the priest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “leprosy.” The Hebrew term describes a broader ritual and physical disease category that can affect people, fabrics, and leather; it does not refer only to modern leprosy.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the warp or in the woof
  simplified_phrase: in the lengthwise or crosswise threads of woven fabric
  preserved_meaning: The two directions of threads in woven fabric remain distinct.
  reasoning_layer_used: POB lexical decisions for שְׁתִי and עֵרֶב
  rationale: Familiar descriptions replace specialized weaving terms.
- pob_phrase: in any article of leather
  simplified_phrase: on any leather item
  preserved_meaning: The phrase still includes any object made of leather.
  reasoning_layer_used: POB lexical decision for כְּלִי עוֹר
  rationale: “Leather item” is more familiar than “article of leather.”
- pob_phrase: it is a diseased spot of skin disease
  simplified_phrase: it is a diseased spot of the kind called “skin disease”
  preserved_meaning: The spot belongs to the broad Levitical category rather than a single modern disease.
  reasoning_layer_used: POB lexical and theological decisions for נֶגַע צָרַעַת
  rationale: “Of the kind” preserves the category-level meaning without awkward repetition.
translation_notes:
  risk_flags:
  - risk: “Skin disease” may sound unusual when applied to fabric or leather.
    mitigation: The footnote explains that the Hebrew category also applies to fabrics and leather.
