translation:
  language: en
  text: But if the infection appears again on the garment—whether on its lengthwise or crosswise threads—or on any leather item, it is spreading. You must burn the infected item in the fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “infection” means a contaminated spot or condition, not necessarily a medically diagnosed infection.
    reason: simplification_note
