  rationale: The wording explains unfamiliar weaving terms directly in the text.
- pob_phrase: it is a spreading outbreak
  simplified_phrase: it is spreading
  preserved_meaning: The recurring contamination is actively extending through the material.
  reasoning_layer_used: POB lexical decision for פֹּרַחַת
  rationale: The shorter clause preserves the outbreak’s active spread without technical phrasing.
- pob_phrase: you shall burn in the fire whatever has the infection in it
  simplified_phrase: You must burn the infected item in the fire
  preserved_meaning: The entire object containing the affected area must be destroyed by fire.
  reasoning_layer_used: POB lexical decisions for בָּאֵשׁ תִּשְׂרְפֶנּוּ and אֵת אֲשֶׁר בּוֹ
