translation:
  language: en
  text: He must burn any infected item, whether it is a garment, the lengthwise or crosswise threads of wool or linen, or any leather item. The infection is a destructive skin-disease condition,[a] so the item must be burned in the fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “leprosy” describes a broader condition that can affect people, garments, and houses.
    reason: cultural_note
