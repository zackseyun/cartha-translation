  reasoning_layer_used: Lexical decision for וְשָׂרַף
  rationale: “Must” states the legal requirement in ordinary modern English.
- pob_phrase: the warp or the woof
  simplified_phrase: the lengthwise or crosswise threads
  preserved_meaning: Both distinct sets of woven threads remain named.
  reasoning_layer_used: Lexical decisions for הַשְּׁתִי and הָעֵרֶב
  rationale: The thread directions explain the technical weaving terms directly.
- pob_phrase: the garment ... or any article of leather in which the infection is
  simplified_phrase: any infected item, whether it is a garment ... or any leather item
  preserved_meaning: The infection applies to every listed textile or leather object.
  reasoning_layer_used: Lexical decisions and immediate clause context
  rationale: Placing the shared condition first makes the list easier to follow without narrowing it.
