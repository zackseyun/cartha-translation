translation:
  language: en
  text: After the affected area has been washed, the priest must inspect it. If it still looks the same[a] and has not spread, the item is unclean. You must burn it in the fire. It has a corrosive spot, whether it is on one surface or the other.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “if its color has not changed.” The Hebrew refers to its visible appearance and may specifically mean its color.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording is difficult; it likely refers to one side or surface of the material as opposed to the other.
    reason: lexical_alternative
