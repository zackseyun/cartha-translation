  rationale: The reordered clause reads naturally, and “affected” avoids implying a specific modern disease.
- pob_phrase: if the diseased area has not changed its appearance and the diseased area has not spread
  simplified_phrase: If it still looks the same and has not spread
  preserved_meaning: The affected area remains visibly unchanged and has not extended.
  reasoning_layer_used: POB lexical decisions for לֹא הָפַךְ ... אֶת עֵינוֹ and לֹא פָשָׂה
  rationale: A pronoun removes repetition while keeping both diagnostic findings distinct.
- pob_phrase: it is a corrosive spot, whether on its worn side or on its bare side
  simplified_phrase: It has a corrosive spot, whether it is on one surface or the other.
  preserved_meaning: The destructive deterioration applies regardless of which surface bears it.
  reasoning_layer_used: POB lexical decision for פְּחֶתֶת and footnote c on the difficult final phrase
  rationale: The corrosive image remains, while the uncertain surface terms are not presented as definite labels.
