translation:
  language: en
  text: But if the priest examines the bright spot and finds no white hair in it, and if the spot is not sunken below the skin but has faded, the priest must isolate the person for seven days.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and behold, there is no white hair in the bright spot
  simplified_phrase: and finds no white hair in it
  preserved_meaning: The priest's examination reveals that the bright spot has no white hair.
  reasoning_layer_used: The lexical decisions identify “behold” as an observational marker and “white hair” as the diagnostic sign.
  rationale: “Finds” expresses the inspection result in natural modern English.
- pob_phrase: it is not deeper than the skin
  simplified_phrase: the spot is not sunken below the skin
  preserved_meaning: The spot does not appear depressed below skin level.
  reasoning_layer_used: The lexical rationale explains the criterion as not appearing sunken below the skin.
  rationale: “Not sunken below” makes the visible condition easier to picture.
- pob_phrase: the priest shall isolate him seven days
  simplified_phrase: the priest must isolate the person for seven days
  preserved_meaning: The priest is required to separate the examined person for a seven-day period of observation.
  reasoning_layer_used: The lexical decision defines the action as isolation or confinement for observation.
  rationale: “Must” states the requirement clearly, and “the person” identifies who is isolated.
