translation:
  language: en
  text: But if the bright white spot is on the person’s skin, does not appear deeper than the surrounding skin, and the hair in the spot has not turned white, the priest must isolate the person for seven days so the spot can be observed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew speaks of isolating the affected spot or case; this means keeping the person apart temporarily for observation.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the bright spot is white in the skin of his flesh
  simplified_phrase: the bright white spot is on the person’s skin
  preserved_meaning: The visible skin mark is bright and white.
  reasoning_layer_used: Lexical decisions for בַּהֶרֶת, לְבָנָה, and בְּעוֹר בְּשָׂרוֹ
  rationale: This replaces the formal anatomical phrase with ordinary English while keeping the spot’s brightness, color, and location.
- pob_phrase: its appearance is not deeper than the skin
  simplified_phrase: does not appear deeper than the surrounding skin
  preserved_meaning: The priest judges the spot’s visual depth relative to the nearby skin.
  reasoning_layer_used: Lexical rationale for וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  rationale: Adding “surrounding” makes the point of comparison clear without changing the diagnostic criterion.
- pob_phrase: then the priest shall isolate the affected area for seven days
  simplified_phrase: the priest must isolate the person for seven days so the spot can be observed
  preserved_meaning: The case is temporarily separated for a seven-day period of observation.
  reasoning_layer_used: Lexical decisions and footnotes for וְהִסְגִּיר and אֶת־הַנֶּגַע
  rationale: The procedure is stated directly because English cannot naturally describe a skin spot itself as being isolated.
interpretive_expansions:
- pob_phrase: shall isolate the affected area
  rendering: must isolate the person for seven days so the spot can be observed
  claim: The temporary isolation concerns the person and allows the priest to observe the affected spot.
  evidence:
  - The POB footnote says the case is placed under temporary isolation for observation.
  - The lexical rationale describes temporary separation for observation.
  confidence: high
  alternatives_preserved:
  - isolate the affected case
  - quarantine the person
