translation:
  language: en
  text: Then the priest must have the item with the infection washed. He must isolate it for another seven days.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall command them to wash
  simplified_phrase: must have ... washed
  preserved_meaning: The priest orders unnamed people to carry out the washing.
  reasoning_layer_used: lexical decision for וְכִבְּסוּ
  rationale: The passive wording avoids inventing who washes the item.
- pob_phrase: the thing in which the infection is
  simplified_phrase: the item with the infection
  preserved_meaning: The wording remains broad while identifying the affected object under inspection.
  reasoning_layer_used: lexical decision for אֵת אֲשֶׁר בּוֹ הַנָּגַע
  rationale: “Item” is clearer than “thing” and still covers garments, leather, and woven articles.
- pob_phrase: quarantine it for seven days a second time
  simplified_phrase: isolate it for another seven days
  preserved_meaning: The item is confined again for a second seven-day inspection period.
  reasoning_layer_used: lexical decisions for וְהִסְגִּירוֹ and שֵׁנִית
  rationale: “Isolate” fits an object naturally, while “another” clearly marks repetition.
translation_notes:
  risk_flags:
