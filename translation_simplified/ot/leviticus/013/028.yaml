translation:
  language: en
  text: But if the bright spot has stayed where it was, has not spread on the skin, and has faded, then it is a swelling caused by the burn. The priest must declare the person clean, because it is a scar from the burn.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: remains in its place
  simplified_phrase: has stayed where it was
  preserved_meaning: The bright spot is stationary rather than spreading.
  reasoning_layer_used: POB lexical decisions for תַּחְתֶּיהָ and תַעֲמֹד
  rationale: The rewrite expresses the Hebrew idiom in ordinary observational language.
- pob_phrase: it is the swelling from the burn
  simplified_phrase: then it is a swelling caused by the burn
  preserved_meaning: The swelling results from the burn.
  reasoning_layer_used: POB lexical decisions for שְׂאֵת and הַמִּכְוָה
  rationale: The article makes the sentence natural, while “caused by” clearly states the relationship.
- pob_phrase: the priest shall pronounce him clean
  simplified_phrase: The priest must declare the person clean
  preserved_meaning: The priest officially judges the person clean rather than physically cleansing them.
  reasoning_layer_used: POB lexical decision for וְטִהֲרוֹ
  rationale: “Declare” clearly presents the priest’s diagnostic role in modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “clean” to mean physically washed rather than officially cleared.
    mitigation: The verb “declare” preserves the priestly judgment and avoids suggesting washing.
