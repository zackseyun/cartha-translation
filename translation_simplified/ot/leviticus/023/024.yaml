translation:
  language: en
  text: 'Tell the sons of Israel: On the first day of the seventh month, the day will be a solemn rest for you, a memorial of trumpet blasts,[a] and a holy assembly.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a memorial of loud blasts”; the Hebrew can mean a raised signal sound, including shouting or blasts from a horn or trumpet.
    reason: lexical_alternative
