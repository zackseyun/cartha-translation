  reasoning_layer_used: POB lexical decision for בְּנֵי יִשְׂרָאֵל
  rationale: “Tell” removes a formal reporting formula while retaining the command and the familial title.
- pob_phrase: there shall be for you a solemn rest
  simplified_phrase: the day will be a solemn rest for you
  preserved_meaning: The appointed day requires a specially observed cessation from ordinary work.
  reasoning_layer_used: POB lexical decision for שַׁבָּתוֹן
  rationale: Naming “the day” makes the sentence natural without weakening the solemn rest.
- pob_phrase: a holy convocation
