translation:
  language: en
  text: For seven days, you must present a food offering to Yahweh.[a] On the seventh day, you must gather for a sacred assembly. Do not do your regular work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall present
  simplified_phrase: you must present
  preserved_meaning: The people are commanded to bring the prescribed offering.
  reasoning_layer_used: POB lexical decision for וְהִקְרַבְתֶּם
  rationale: “Must” states the command in direct modern English.
- pob_phrase: there shall be a holy convocation
  simplified_phrase: you must gather for a sacred assembly
  preserved_meaning: The seventh day requires an officially summoned sacred gathering.
  reasoning_layer_used: POB lexical decision for מִקְרָא קֹדֶשׁ
  rationale: The active wording makes the required gathering immediately clear.
- pob_phrase: you shall do no laborious work
  simplified_phrase: Do not do your regular work
  preserved_meaning: Ordinary occupational labor is forbidden, not every possible activity.
  reasoning_layer_used: POB lexical decision for כָּל מְלֶאכֶת עֲבֹדָה
  rationale: “Regular work” avoids both archaic wording and an overly broad ban on all activity.
