translation:
  language: en
  text: From the places where you live, bring two loaves as an offering that will be presented by waving.[a] Use two-tenths of an ephah of fine flour to make them,[b] and bake them with leaven. They are firstfruits to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This kind of offering is called a “wave offering.”
    reason: simplification_note
  - marker: b
    text: An ephah was an ancient dry measure.
    reason: cultural_note
