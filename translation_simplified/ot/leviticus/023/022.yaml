translation:
  language: en
  text: When you harvest the crops from your land, do not harvest all the crops at the edges[a] of your field. Do not pick up the scattered leftovers from the harvest. Leave them for the poor and for the foreigners who live among you.[b] I am Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “corners.” The Hebrew word can mean an edge, side, or corner.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term, often translated “sojourners,” refers to non-Israelites living among Israel under the protection of its laws.
    reason: lexical_alternative
