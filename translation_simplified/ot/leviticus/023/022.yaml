  simplified_phrase: do not harvest all the crops at the edges of your field
  preserved_meaning: Some of the crop at the field’s boundary must remain unharvested.
  reasoning_layer_used: POB lexical decision for לֹא תְכַלֶּה and פְּאַת שָׂדְךָ
  rationale: The rewrite states the required action directly while retaining the field-edge image.
- pob_phrase: the gleanings of your harvest
  simplified_phrase: the scattered leftovers from the harvest
