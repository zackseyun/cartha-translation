  text: You must not eat bread, roasted grain, or fresh grain until that very day—until you have brought the offering to your God. This is a permanent law for every generation, wherever you live.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall not eat
  simplified_phrase: you must not eat
  preserved_meaning: The words remain a binding legal prohibition.
  reasoning_layer_used: POB lexical decision for לֹא תֹאכְלוּ
  rationale: “Must not” states the prohibition clearly in modern English.
- pob_phrase: until this very day, until you have brought the offering of your God
  simplified_phrase: until that very day—until you have brought the offering to your God
  preserved_meaning: The emphasized day and the bringing of the offering remain distinct, coordinated limits.
  reasoning_layer_used: POB lexical decisions for עַד עֶצֶם הַיּוֹם הַזֶּה, עַד הֲבִיאֲכֶם, and קָרְבַּן אֱלֹהֵיכֶם
  rationale: The dash makes the two-part temporal statement clear without merging its ideas.
- pob_phrase: a permanent statute throughout your generations in all your dwelling places
  simplified_phrase: a permanent law for every generation, wherever you live
  preserved_meaning: The law has enduring force across successive generations and every place of residence.
  reasoning_layer_used: POB lexical and theological decisions for חֻקַּת עוֹלָם, לְדֹרֹתֵיכֶם, and בְּכֹל מֹשְׁבֹתֵיכֶם
  rationale: Common wording replaces formal expressions without narrowing their scope.
translation_notes:
