translation:
  language: en
  text: If anyone does any work on that very day, I will destroy that person, removing them from among their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will cut that person off from among their people.” The Hebrew verb means “destroy” or “cause to perish.” In this expression, other words describe the person’s removal from among their people in judgment.
    reason: alternative_reading
