translation:
  language: en
  text: On the first day, you must take for yourselves fruit from majestic trees,[a] palm branches, branches from leafy trees, and willows from beside a stream. Then rejoice in the presence of Yahweh your God for seven days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “fruit from splendid or beautiful trees.” Later Jewish tradition identifies this as citron fruit, called etrog.
    reason: alternative_reading
