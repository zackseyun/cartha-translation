translation:
  language: en
  text: The priest must present the bread made from the first part of the harvest and the two lambs together before Yahweh by waving them as an offering.[a] These offerings will be holy to Yahweh and will belong to the priest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may say “over the bread” and “over the two lambs,” though it likely means that the offerings are presented together.
    reason: lexical_alternative
