translation:
  language: en
  text: On that very day, you must announce a holy assembly. You must not do your regular work.[a] This is a permanent law wherever you live, for all generations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to ordinary labor, not every possible activity.
