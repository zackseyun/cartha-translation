  preserved_meaning: The people must formally announce a sacred gathering.
  reasoning_layer_used: POB lexical decisions for קרא and מִקְרָא קֹדֶשׁ
  rationale: Common words preserve the sense of an officially announced sacred gathering.
- pob_phrase: do no laborious work
  simplified_phrase: must not do your regular work
  preserved_meaning: The prohibition concerns ordinary labor rather than every possible action.
  reasoning_layer_used: POB lexical and theological decisions for כָּל מְלֶאכֶת עֲבֹדָה
  rationale: Natural wording states the limited scope of the work ban.
- pob_phrase: a permanent statute throughout your dwellings for your generations
  simplified_phrase: a permanent law wherever you live, for all generations
  preserved_meaning: The law remains binding in every Israelite settlement across successive generations.
  reasoning_layer_used: POB lexical decisions for חֻקַּת עוֹלָם, בְּכָל מוֹשְׁבֹתֵיכֶם, and לְדֹרֹתֵיכֶם
  rationale: The legal formula becomes direct modern English without relocating “for you” into this clause.
