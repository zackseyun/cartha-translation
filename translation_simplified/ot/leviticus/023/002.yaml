translation:
  language: en
  text: 'Speak to the sons of Israel[a] and tell them: “You must announce Yahweh’s appointed times[b] as sacred gatherings. These are my appointed times.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the Hebrew covenant name for the people of Israel as a whole.
    reason: lexical_alternative
  - marker: b
    text: These appointed times include sacred occasions generally, not only festivals or feast days.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Speak to the sons of Israel and say to them
  simplified_phrase: Speak to the sons of Israel and tell them
  preserved_meaning: Moses is directly commanded to address Israel’s covenant people.
  reasoning_layer_used: POB lexical decisions for דַּבֵּר and וְאָמַרְתָּ אֲלֵהֶם
  rationale: “Tell them” removes repetitive formal wording while keeping the direct command.
- pob_phrase: which you shall proclaim as holy convocations
  simplified_phrase: You must announce ... as sacred gatherings
  preserved_meaning: The appointed times must be formally announced as consecrated assemblies.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר תִּקְרְאוּ אֹתָם and מִקְרָאֵי קֹדֶשׁ
  rationale: “Announce” and “sacred gatherings” express the same public and holy character in common English.
- pob_phrase: The appointed times of Yahweh ... these are my appointed times
  simplified_phrase: Yahweh’s appointed times ... These are my appointed times
  preserved_meaning: The sacred times are designated by and belong to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions for מוֹעֲדֵי יְהוָה and מוֹעֲדָי
  rationale: The shorter possessive form keeps both Yahweh’s name and his ownership explicit.
