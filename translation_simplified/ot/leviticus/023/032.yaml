translation:
  language: en
  text: This must be a Sabbath of complete rest for you. You must humble yourselves.[a] Starting on the evening of the ninth day of the month, keep this Sabbath from that evening until the next evening.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “afflict yourselves” and may include self-denial; this penitential practice was traditionally associated with fasting.
    reason: lexical_alternative
  - marker: b
    text: Israel counted this observance from one evening to the next.
    reason: cultural_note
