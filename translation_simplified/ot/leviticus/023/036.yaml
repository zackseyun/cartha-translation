translation:
  language: en
  text: For seven days, present a food offering[a] to Yahweh. On the eighth day, come together for a sacred gathering and present a food offering to Yahweh. This is a solemn assembly. Do not do your regular work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering presented by fire.”
    reason: lexical_alternative
