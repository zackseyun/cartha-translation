  preserved_meaning: The people must attend an officially summoned holy gathering.
  reasoning_layer_used: The lexical decision defines the phrase as an officially summoned sacred gathering.
  rationale: The rewrite makes the required action clear without losing the gathering’s sacred character.
- pob_phrase: you shall do no ordinary work
  simplified_phrase: Do not do your regular work
  preserved_meaning: Normal occupational labor is prohibited, not every possible activity.
  reasoning_layer_used: The lexical rationale distinguishes regular labor from all activity whatsoever.
  rationale: “Regular work” states the practical restriction in common English.
