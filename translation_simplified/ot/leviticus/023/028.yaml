translation:
  language: en
  text: You must not do any work on this very day, because it is a Day of Atonement.[a] It is the day for making atonement for you before Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a day of atonements.” The festival is commonly called the “Day of Atonement” in English.
    reason: lexical_alternative
