  preserved_meaning: The command strictly prohibits every kind of work.
  reasoning_layer_used: Lexical decision for מְלָאכָה and legal use of תַעֲשׂוּ
  rationale: “Must not” states the legal force more naturally in modern English.
- pob_phrase: for it is a Day of Atonement, to make atonement for you
  simplified_phrase: because it is a Day of Atonement. It is the day for making atonement for you
  preserved_meaning: The day’s atoning purpose is the reason for the work prohibition.
  reasoning_layer_used: Lexical and theological decisions for כִּי, כִּפֻּרִים, and לְכַפֵּר
  rationale: Two sentences make the reason and purpose easier to follow without defining atonement too narrowly.
