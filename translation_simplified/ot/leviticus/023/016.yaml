translation:
  language: en
  text: Count fifty days. The count runs up to the day after the seventh Sabbath.[a] Then bring a new grain offering to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the day after the seventh week.” The Hebrew says “the day after the seventh Sabbath,” and interpreters differ on how this count fits the calendar.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You shall count fifty days, up to the day after the seventh Sabbath
  simplified_phrase: Count fifty days. The count runs up to the day after the seventh Sabbath.
  preserved_meaning: The people must count fifty days to the stated endpoint without replacing “Sabbath” with “week.”
  reasoning_layer_used: POB lexical and theological decisions on תִּסְפְּרוּ and הַשַּׁבָּת הַשְּׁבִיעִת
  rationale: Two short sentences make the command and its endpoint easier to follow.
- pob_phrase: then you shall present a new grain offering to Yahweh
  simplified_phrase: Then bring a new grain offering to Yahweh.
  preserved_meaning: After the count, the people must bring the specified offering to Yahweh.
  reasoning_layer_used: POB lexical decisions on וְהִקְרַבְתֶּם, מִנְחָה, חֲדָשָׁה, and לַיהוָה
  rationale: “Bring” is common English, while “to Yahweh” clearly identifies the recipient.
