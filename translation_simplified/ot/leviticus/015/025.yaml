translation:
  language: en
  text: If a woman has a flow of blood for many days outside her time of menstrual impurity, or if the bleeding continues beyond that time, she will be ritually unclean for as long as the bleeding lasts, just as she is during her menstrual impurity.
  philosophy: optimal-equivalence
