  rationale: “Outside her time” states the timing contrast more directly.
- pob_phrase: if she has a discharge beyond her menstrual impurity
  simplified_phrase: if the bleeding continues beyond that time
  preserved_meaning: The abnormal bleeding extends past the normal menstrual period.
  reasoning_layer_used: Lexical decision for עַל נִדָּתָהּ
  rationale: “Continues beyond” makes the extension in time immediately clear.
- pob_phrase: all the days of her unclean discharge she shall be unclean
  simplified_phrase: she will be ritually unclean for as long as the bleeding lasts
  preserved_meaning: Her unclean status lasts throughout the abnormal flow.
  reasoning_layer_used: Lexical and theological purity decisions
  rationale: The duration is recast in ordinary English while retaining ritual uncleanness.
