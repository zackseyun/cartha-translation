  simplified_phrase: he must get ... for himself
  preserved_meaning: The man is required to acquire the birds personally.
  reasoning_layer_used: The lexical decision identifies a legal instruction and retains the personal dative.
  rationale: “Must get” states the required action more naturally than “shall take.”
- pob_phrase: and he shall come before Yahweh ... and give them
  simplified_phrase: Then he must come before Yahweh ... and give the birds
  preserved_meaning: The actions follow in sequence, and the birds are handed to the priest.
  reasoning_layer_used: The lexical decisions preserve the legal sequence, divine name, and direct transfer.
  rationale: A second sentence and “then” make the procedure easier to follow.
