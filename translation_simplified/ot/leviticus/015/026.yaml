translation:
  language: en
  text: Every bed she lies on while the discharge continues will be ritually unclean, just like a bed she lies on during menstruation. Every object she sits on will also be ritually unclean, just like an object she sits on during menstruation.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: during all the days of her discharge
  simplified_phrase: while the discharge continues
  preserved_meaning: The rule applies for the entire duration of the abnormal discharge.
  reasoning_layer_used: lexical decision for כָּל יְמֵי זוֹבָהּ
  rationale: The simpler time clause preserves both the duration and the medical sense.
- pob_phrase: shall be to her like the bed of her menstruation
  simplified_phrase: will be ritually unclean, just like a bed she lies on during menstruation
  preserved_meaning: The bed has the same ritual status as one used during menstruation.
  reasoning_layer_used: lexical and theological decisions for נִדָּה and impurity language
  rationale: The recast comparison states the legal status directly without suggesting moral guilt.
- pob_phrase: every vessel on which she sits
  simplified_phrase: every object she sits on
  preserved_meaning: The rule covers any article used for sitting, not merely a container.
  reasoning_layer_used: lexical decision and POB footnote for כְּלִי
  rationale: Object communicates the Hebrew term's broad scope more clearly than vessel.
interpretive_expansions:
- pob_phrase: unclean / uncleanness
  rendering: ritually unclean
  claim: The uncleanness is a ceremonial status under Israel's purity law, not moral guilt.
  evidence:
  - The POB theological decision explicitly identifies the status as ritual uncleanness.
  - The immediate context is Levitical purity legislation concerning bodily discharge.
  confidence: high
  alternatives_preserved:
  - unclean
  - impure
translation_notes:
  risk_flags:
  - risk: Modern readers may associate uncleanness with dirtiness or personal sin.
    mitigation: The word ritually identifies the legal and ceremonial domain.
