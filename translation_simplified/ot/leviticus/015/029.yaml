- pob_phrase: and bring them
  simplified_phrase: She must bring the birds
  preserved_meaning: The same woman is required to bring both sacrificial birds.
  reasoning_layer_used: POB lexical decision for וְהֵבִיאָה אֹתָם
  rationale: A new sentence clarifies the command, and “the birds” makes the pronoun’s referent explicit.
- pob_phrase: at the entrance of the tent of meeting
  simplified_phrase: at the entrance of the tent of meeting
  preserved_meaning: The priest receives the birds at the designated sanctuary entrance.
