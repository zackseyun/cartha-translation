  rationale: “Must” states the legal requirement clearly for modern readers.
- pob_phrase: and he shall be unclean until the evening
  simplified_phrase: He will be unclean until evening.
  preserved_meaning: His unclean status lasts through the stated time limit without implying moral guilt.
  reasoning_layer_used: Lexical and theological decisions concerning ritual impurity
  rationale: A separate sentence makes the resulting status and its duration easier to follow.
