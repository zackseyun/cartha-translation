simplification_decisions:
- pob_phrase: Whoever sits on the object on which the man with the discharge sat
  simplified_phrase: Anyone who sits on something the man with the discharge sat on
  preserved_meaning: The rule applies generally to a person who sits on any item previously sat on by the affected man.
  reasoning_layer_used: Lexical decisions for וְהַיֹּשֵׁב, הַכְּלִי, and the relative clause
  rationale: “Something” preserves the broad sense of the Hebrew term in more natural English.
- pob_phrase: shall wash his clothes and bathe in water
  simplified_phrase: must wash his clothes and bathe in water
  preserved_meaning: 'Both required washings remain distinct: his clothing must be washed and his body bathed.'
