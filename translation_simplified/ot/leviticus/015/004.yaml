simplification_decisions:
- pob_phrase: Every bed on which the man with the discharge lies shall be unclean
  simplified_phrase: Every bed the man with the discharge lies on will be unclean
  preserved_meaning: Anything serving as his bed acquires the stated ritual impurity when he lies on it.
