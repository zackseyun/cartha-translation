translation:
  language: en
  text: Tell the sons of Israel:[a] When any man has a discharge from his body, that discharge is unclean.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; the Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Here “unclean” refers to ritual uncleanness, not necessarily moral wrongdoing.
    reason: cultural_note
