simplification_decisions:
- pob_phrase: Whoever touches the flesh of the man with the discharge
  simplified_phrase: Anyone who touches the body of the man who has the discharge
  preserved_meaning: The rule applies generally to contact with the affected man’s physical body.
  reasoning_layer_used: POB lexical decisions for וְהַנֹּגֵעַ, בִּבְשַׂר, and הַזָּב
  rationale: “Body” makes the physical-contact rule immediately clear while the footnote preserves the Hebrew image of flesh.
- pob_phrase: shall wash his clothes and bathe in water
  simplified_phrase: must wash their clothes and bathe in water
  preserved_meaning: Washing both the clothing and the body is required.
  reasoning_layer_used: POB lexical decisions for יְכַבֵּס בְּגָדָיו and וְרָחַץ בַּמַּיִם
  rationale: “Must” states the legal requirement naturally, and singular “their” avoids awkward generic masculine wording.
- pob_phrase: and he shall be unclean until the evening
  simplified_phrase: That person will remain ritually unclean until evening
  preserved_meaning: The contact causes a temporary state of ritual impurity lasting until evening.
  reasoning_layer_used: POB theological decision on impurity and lexical decision for עַד הָעָרֶב
  rationale: A new sentence clarifies both the affected person and the duration of the impurity.
