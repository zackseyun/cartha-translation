translation:
  language: en
  text: Anyone who touches the body of the man who has the discharge must wash their clothes and bathe in water. That person will remain ritually unclean until evening.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the flesh of the man with the discharge.”
