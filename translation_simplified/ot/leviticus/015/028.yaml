  simplified_phrase: if her discharge stops
  preserved_meaning: The bodily discharge has ceased, beginning the required seven-day period.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: This states the intended transition in ordinary English without suggesting washing or moral cleansing.
- pob_phrase: then she shall count seven days for herself, and after that she shall be clean
  simplified_phrase: she must count seven days for herself. After that, she will be ritually clean.
  preserved_meaning: She is required to count her own seven-day period before attaining clean ritual status.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences clarify the procedure while preserving its legal force and sequence.
