translation:
  language: en
  text: But if her discharge stops[a], she must count seven days for herself. After that, she will be ritually clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew uses the same word family here and for “clean” at the end: first the discharge ends, and then her ritual status becomes clean.'
    reason: lexical_alternative
