- pob_phrase: everyone who touches any object on which she sits
  simplified_phrase: Anyone who touches any object she sits on
  preserved_meaning: The rule applies to every person who touches an item used as her seat.
  reasoning_layer_used: POB lexical decisions for וְכָל, הַנֹּגֵעַ, בְּכָל כְּלִי, and אֲשֶׁר תֵּשֵׁב עָלָיו
