translation:
  language: en
  text: In this way, he will make atonement[a] for the sanctuary because of the ritual uncleannesses of the sons of Israel[b], because of their transgressions, and for all their sins. He will do the same for the tent of meeting, which dwells among them in the midst of their uncleannesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “make atonement” includes cleansing the sanctuary from the effects of impurity and sin.
    reason: simplification_note
  - marker: b
    text: That is, the Israelites as a people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus he shall make atonement for the sanctuary because of the uncleannesses
  simplified_phrase: In this way, he will make atonement for the sanctuary because of the ritual uncleannesses
  preserved_meaning: The required rite addresses the sanctuary because of Israel’s many ritual impurities.
  reasoning_layer_used: Lexical and theological decisions on כפר and מִטֻּמְאֹת
  rationale: “Ritual” clarifies the kind of uncleanness, while the plural preserves the Hebrew emphasis.
- pob_phrase: because of their transgressions, for all their sins
  simplified_phrase: because of their transgressions, and for all their sins
  preserved_meaning: The atonement concerns both transgressions and the full range of Israel’s sins.
  reasoning_layer_used: Lexical decisions on פשע and חטאות
  rationale: The clearer coordination keeps transgressions and sins as distinct categories.
- pob_phrase: and so he shall do for the tent of meeting that dwells with them
  simplified_phrase: He will do the same for the tent of meeting, which dwells among them
  preserved_meaning: The corresponding rite must also be performed for the sacred tent located among Israel.
  reasoning_layer_used: Lexical decisions on וְכֵן יַעֲשֶׂה and הַשֹּׁכֵן אִתָּם
  rationale: A new sentence clarifies the parallel action while preserving the dwelling image.
