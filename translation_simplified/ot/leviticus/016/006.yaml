translation:
  language: en
  text: Aaron must present the bull as the sin offering for himself.[a] He must make atonement for himself and for his household.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can emphasize ritual cleansing in some contexts.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall present the bull of the sin offering that is for himself
  simplified_phrase: must present the bull as the sin offering for himself
  preserved_meaning: The bull is Aaron’s designated offering, and he presents it before God without implying that the sacrifice is already complete.
  reasoning_layer_used: Lexical decisions for וְהִקְרִיב, הַחַטָּאת, and אֲשֶׁר לוֹ
  rationale: “Must” gives the instruction plainly, while “as” clarifies the bull’s ritual purpose.
- pob_phrase: and he shall make atonement for himself and for his household
  simplified_phrase: He must make atonement for himself and for his household.
  preserved_meaning: Aaron acts on behalf of both himself and his family or household.
  reasoning_layer_used: Lexical and theological decisions for וְכִפֶּר, בַּעֲדוֹ, and בֵּיתוֹ
  rationale: A new sentence makes the second required action easier to follow without weakening its theological force.
translation_notes:
  risk_flags:
  - risk: “Make atonement” may be unfamiliar to new readers.
