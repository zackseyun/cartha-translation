translation:
  language: en
  text: He must wash his body with water in a holy place.[a] Then he must put on his garments, come out, and offer his own burnt offering and the people’s burnt offering. He will make atonement for himself and for the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means a place set apart as holy, not necessarily the inner sanctuary called the Holy Place.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He shall wash his body with water in a holy place
  simplified_phrase: He must wash his body with water in a holy place
  preserved_meaning: The washing is a required step in the ritual procedure.
  reasoning_layer_used: POB lexical decision for וְרָחַץ
  rationale: “Must” expresses the prescribed action more naturally than legal-sounding “shall.”
- pob_phrase: put on his garments, come out, and offer
  simplified_phrase: Then he must put on his garments, come out, and offer
  preserved_meaning: The priest performs these actions in sequence after washing.
  reasoning_layer_used: Source clause order and POB lexical decisions
  rationale: A new sentence and “then” make the ritual sequence easier to follow.
- pob_phrase: his burnt offering and the burnt offering of the people
  simplified_phrase: his own burnt offering and the people’s burnt offering
  preserved_meaning: The priest offers one sacrifice for himself and another for the people.
  reasoning_layer_used: POB lexical decisions for עֹלָתוֹ and עֹלַת הָעָם
  rationale: The possessive forms clarify whose offerings they are without changing the sacrifice named.
