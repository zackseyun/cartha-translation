translation:
  language: en
  text: He must take some of the bull’s blood and sprinkle it with his finger on the front of the mercy seat, toward the east.[a] Then he must sprinkle some of the blood with his finger seven times in front of the mercy seat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “atonement cover.” This was the cover of the ark, the place associated with atonement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he shall take
  simplified_phrase: He must take
  preserved_meaning: This remains a required ritual step rather than a past event.
  reasoning_layer_used: POB lexical decision for וְלָקַח
  rationale: “Must” expresses the procedural requirement in common modern English.
- pob_phrase: on the front of the mercy seat, eastward
  simplified_phrase: on the front of the mercy seat, toward the east
  preserved_meaning: The first blood application is made on the cover in the eastward direction.
  reasoning_layer_used: POB lexical decisions for עַל פְּנֵי הַכַּפֹּרֶת and קֵדְמָה
  rationale: “Toward the east” clearly preserves the directional force without implying a fixed east-facing front.
- pob_phrase: and before the mercy seat he shall sprinkle some of the blood with his finger seven times
  simplified_phrase: Then he must sprinkle some of the blood with his finger seven times in front of the mercy seat
  preserved_meaning: This is a second required application performed seven times in front of, not on, the cover.
  reasoning_layer_used: POB lexical decisions for וְלִפְנֵי הַכַּפֹּרֶת and יַזֶּה שֶׁבַע פְּעָמִים
  rationale: Ordinary clause order makes the separate location and seven repetitions easy to follow.
translation_notes:
  risk_flags:
  - risk: “Mercy seat” may sound like a chair to an unfamiliar reader.
    mitigation: The footnote identifies it as the ark’s cover and gives “atonement cover” as an alternative.
  - risk: Readers may miss that the two sprinklings occur at different locations.
    mitigation: The text contrasts “on” the mercy seat with “in front of” it.
