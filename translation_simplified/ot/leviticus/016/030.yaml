simplification_decisions:
- pob_phrase: atonement shall be made
  simplified_phrase: atonement will be made
  preserved_meaning: The verse promises that the prescribed ritual atonement will take place without naming its agent.
  reasoning_layer_used: Lexical decision for יְכַפֵּר and doctrine realignment
  rationale: “Will” is more natural modern English while retaining the passive and the cultic term “atonement.”
- pob_phrase: to cleanse you; from all your sins
  simplified_phrase: to cleanse you from all your sins
  preserved_meaning: Atonement removes the people’s sins and makes them ritually clean.
  reasoning_layer_used: Lexical decisions for לְטַהֵר אֶתְכֶם and מִכֹּל חַטֹּאתֵיכֶם
  rationale: Removing the semicolon makes the relationship between cleansing and sins immediately clear.
- pob_phrase: before Yahweh you shall be clean
  simplified_phrase: You will be clean before Yahweh.
  preserved_meaning: The resulting state is cleanness in Yahweh’s presence.
  reasoning_layer_used: Lexical decisions for לִפְנֵי יְהוָה and תִּטְהָרוּ plus the divine-name doctrine
  rationale: A separate sentence and ordinary word order clarify the result while preserving Yahweh’s covenant name.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “clean” as physical hygiene rather than ritual and spiritual purity from sin.
    mitigation: The phrase “from all your sins” keeps the intended religious sense clear.
  - risk: The passive wording may conceal the Hebrew verb’s singular but unstated subject.
    mitigation: Footnote a preserves the possible active rendering without choosing an unnamed agent.
