translation:
  language: en
  text: You must observe this Sabbath by resting completely. You must humble yourselves.[a] This is a permanent law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deny yourselves” or “afflict yourselves”; this was traditionally understood to include fasting and other self-denial.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It is a Sabbath of complete rest for you
  simplified_phrase: You must observe this Sabbath by resting completely
  preserved_meaning: The day is the Torah’s sacred Sabbath and requires complete rest.
  reasoning_layer_used: Lexical decisions for שַׁבַּת, שַׁבָּתוֹן, and הִיא לָכֶם
  rationale: The active sentence states the required observance clearly while retaining “Sabbath” and the intensified rest.
- pob_phrase: you shall humble yourselves
  simplified_phrase: You must humble yourselves
  preserved_meaning: The community is commanded to practice penitential self-denial without limiting the command to fasting.
  reasoning_layer_used: Lexical and theological decisions for וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  rationale: “Must” is natural modern legal English, while the footnote preserves the broader and more formal alternatives.
- pob_phrase: a permanent statute
  simplified_phrase: a permanent law
  preserved_meaning: The command has enduring legal force.
  reasoning_layer_used: Lexical decision for חֻקַּת עוֹלָם
  rationale: “Law” communicates the legal requirement more directly than the technical word “statute.”
translation_notes:
  risk_flags:
  - risk: “Observe” is implicit rather than separately stated in the Hebrew clause.
    mitigation: It only recasts the Sabbath designation and complete-rest requirement as natural English instruction.
  - risk: Modern readers may understand “humble yourselves” only as an attitude.
    mitigation: The footnote identifies self-denial and the traditional inclusion of fasting without narrowing the main text.
