translation:
  language: en
  text: Then he must go out to the altar before Yahweh and make atonement for it.[a] He must take some of the bull’s blood and some of the goat’s blood and put it on the altar’s horns on every side.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purify it”; in this priestly ritual, the Hebrew term for making atonement can include purification.
    reason: lexical_alternative
  - marker: b
    text: The altar’s “horns” were projections at its corners.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Then he shall go out
  simplified_phrase: Then he must go out
  preserved_meaning: The priest is required to perform the next action in the ritual sequence.
  reasoning_layer_used: Lexical decision for וְיָצָא
  rationale: “Must” expresses prescribed action more naturally than “shall” in modern English.
- pob_phrase: and put it on the horns of the altar all around
  simplified_phrase: and put it on the altar’s horns on every side
  preserved_meaning: The blood is placed on the horns belonging to the altar around all its sides.
  reasoning_layer_used: Lexical decision for וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב and grounding review
  rationale: The possessive wording clearly links the horns to the altar while preserving the all-around scope.
translation_notes:
  risk_flags:
  - risk: “Atonement” may be unfamiliar to new readers.
    mitigation: The term is retained for its theological weight, with a footnote noting its purification sense.
  - risk: Modern readers may misunderstand the altar’s “horns.”
    mitigation: A brief cultural note identifies them as corner projections without removing the source image.
