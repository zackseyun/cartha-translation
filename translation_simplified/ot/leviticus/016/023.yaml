translation:
  language: en
  text: Then Aaron must go into the tent of meeting. He must take off the linen garments he wore when he entered the holy place[a] and leave them there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sanctuary.” In the wider Day of Atonement context, some understand this as “the Most Holy Place.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Then Aaron shall come into the tent of meeting
  simplified_phrase: Then Aaron must go into the tent of meeting
  preserved_meaning: Aaron is instructed to proceed into the sanctuary structure at this point in the ritual.
  reasoning_layer_used: Lexical decision for וּבָא and ritual sequence
  rationale: “Must go into” clearly expresses the required next action in modern English.
- pob_phrase: the linen garments that he put on when he went into the holy place
  simplified_phrase: the linen garments he wore when he entered the holy place
  preserved_meaning: These are the linen garments Aaron used for entering the sacred area.
  reasoning_layer_used: Lexical decisions for בִּגְדֵי הַבָּד, אֲשֶׁר לָבַשׁ, and בְּבֹאוֹ
  rationale: The relative clause is shortened without losing the garments’ material or ritual use.
- pob_phrase: and he shall leave them there
  simplified_phrase: and leave them there
  preserved_meaning: Aaron must keep the linen garments at that location after taking them off.
  reasoning_layer_used: Lexical decision for וְהִנִּיחָם שָׁם
  rationale: The shared command verb avoids repetition while retaining the instruction.
translation_notes:
  risk_flags:
  - risk: “The holy place” may be understood as a specific outer chamber rather than a general sacred area.
    mitigation: The footnote preserves “the sanctuary” and “the Most Holy Place” as possible understandings without settling the ambiguity.
