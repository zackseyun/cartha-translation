translation:
  language: en
  text: The bull and the goat were used for sin offerings, and their blood was brought into the sanctuary to make atonement. He must take the animals outside the camp.[a] Then they must burn the animals’ hides, flesh, and dung in the fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew changes from “he must take” to “they must burn,” probably distinguishing the one who takes the animals outside the camp from the people who burn them.
    reason: cultural_note
