  preserved_meaning: Each animal retains its separate designation as a sin offering.
  reasoning_layer_used: Lexical decisions for פַּר הַחַטָּאת and שְׂעִיר הַחַטָּאת
  rationale: The plural “sin offerings” preserves the repeated ritual designation without cumbersome repetition.
- pob_phrase: he shall bring out to outside the camp
  simplified_phrase: He must take the animals outside the camp
  preserved_meaning: The command moves both animal carcasses beyond the camp boundary.
  reasoning_layer_used: Lexical decisions for יוֹצִיא and אֶל־מִחוּץ לַמַּחֲנֶה
  rationale: The objects and destination are stated directly in natural English.
- pob_phrase: and they shall burn their hides, their flesh, and their dung in the fire
  simplified_phrase: Then they must burn the animals’ hides, flesh, and dung in the fire
  preserved_meaning: The plural group burns every listed part of the animals.
  reasoning_layer_used: Theological decision on the singular-to-plural shift and lexical decisions for the carcass terms
  rationale: A new sentence clarifies the action while preserving the shift from “he” to “they.”
