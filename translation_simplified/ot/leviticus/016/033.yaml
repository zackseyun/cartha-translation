  reasoning_layer_used: POB lexical decision for כפר and the immediate ritual context
  rationale: “In this way” and “will” express the connection and action in natural modern English.
- pob_phrase: for the Holy Sanctuary, and for the Tent of Meeting, and for the altar
  simplified_phrase: for the Holy Sanctuary, the Tent of Meeting, and the altar
  preserved_meaning: All three sacred places or objects receive the same atoning action.
  reasoning_layer_used: POB theological decision on consistent atonement language
  rationale: A compact list removes cumbersome repetition without changing the shared verb.
- pob_phrase: for all the people of the assembly
  simplified_phrase: for everyone in the assembled community
  preserved_meaning: The atonement covers all members of the gathered covenant community.
  reasoning_layer_used: POB lexical decision for כָּל עַם הַקָּהָל
  rationale: The new wording makes the corporate sense clear without the opaque phrase “people of the assembly.”
