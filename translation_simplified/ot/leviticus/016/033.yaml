translation:
  language: en
  text: In this way, he will make atonement[a] for the Holy Sanctuary, the Tent of Meeting, and the altar. He will also make atonement for the priests and for everyone in the assembled community.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make expiation”; here making atonement includes removing ritual impurity.
    reason: lexical_alternative
