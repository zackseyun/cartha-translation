translation:
  language: en
  text: But the goat chosen by lot for Azazel must be presented alive before Yahweh.[a] Atonement is to be made over it,[b] and it is to be sent away into the wilderness to Azazel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for the scapegoat.” The meaning of the Hebrew term “Azazel” is debated; it may be a name or may refer to removal.
    reason: alternative_reading
  - marker: b
    text: Or “atonement is to be made for it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the goat on which the lot for Azazel fell
  simplified_phrase: the goat chosen by lot for Azazel
  preserved_meaning: The goat was selected by casting lots and assigned to Azazel.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  rationale: The rewrite states the selection plainly without changing how it occurred.
- pob_phrase: shall be presented alive before Yahweh
  simplified_phrase: must be presented alive before Yahweh
  preserved_meaning: The living goat is brought into Yahweh’s presence for the ritual.
  reasoning_layer_used: POB lexical decisions for יָעֳמַד חַי and לִפְנֵי יְהוָה
  rationale: “Must” expresses the ritual command in direct modern English.
- pob_phrase: to make atonement over it, to send it away
  simplified_phrase: Atonement is to be made over it, and it is to be sent away
  preserved_meaning: Both the atonement rite and the goat’s removal remain distinct purposes.
  reasoning_layer_used: POB theological decision for לְכַפֵּר עָלָיו and lexical decision for לְשַׁלַּח אֹתוֹ
  rationale: A second sentence makes the two ritual actions easier to follow.
