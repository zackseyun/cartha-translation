- pob_phrase: Aaron your brother
  simplified_phrase: your brother Aaron
  preserved_meaning: Aaron is identified as Moses’ brother.
  reasoning_layer_used: POB lexical decision
  rationale: This word order is more natural in modern English.
- pob_phrase: at just any time into the Holy Place, inside the veil
  simplified_phrase: enter the Holy Place behind the veil, before the atonement cover on the ark, whenever he wants
  preserved_meaning: Aaron is forbidden unrestricted entry into the inner sanctuary before the ark’s cover.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording keeps the location and approach together as one prohibited entry.
- pob_phrase: so that he may not die
  simplified_phrase: or he will die
  preserved_meaning: Death is the consequence of unauthorized entry.
  reasoning_layer_used: POB lexical decision
  rationale: The direct warning is easier to understand.
