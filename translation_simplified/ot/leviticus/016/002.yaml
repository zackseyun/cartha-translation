translation:
  language: en
  text: Yahweh said to Moses, “Tell your brother Aaron that he must not enter the Holy Place behind the veil, before the atonement cover[a] on the ark, whenever he wants, or he will die. For I will appear in the cloud above the atonement cover.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called the “mercy seat.”
    reason: lexical_alternative
