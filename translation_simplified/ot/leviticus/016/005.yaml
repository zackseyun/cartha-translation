translation:
  language: en
  text: He must take from the community of Israel two male goats for a sin offering[a] and one ram for a burnt offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a purification offering.” This offering deals with sin and ritual impurity.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the congregation of the sons of Israel
  simplified_phrase: the community of Israel
  preserved_meaning: The animals come from Israel’s covenant community as a whole.
  reasoning_layer_used: POB lexical decisions and the lexical alternative “community”
  rationale: This removes an unfamiliar literal expression while preserving its corporate reference to Israel.
- pob_phrase: he shall take
  simplified_phrase: he must take
  preserved_meaning: The action is a required ritual instruction.
  reasoning_layer_used: POB lexical decision for יִקַּח
  rationale: “Must” states the prescriptive force in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: “The community of Israel” does not preserve the Hebrew wording “the sons of Israel” explicitly.
    mitigation: It preserves the recognized corporate meaning and avoids suggesting that only male Israelites are included.
