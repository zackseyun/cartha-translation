translation:
  language: en
  text: Aaron must place both hands on the head of the live goat. Over the goat, he must confess all the iniquities of the sons of Israel, all their transgressions, and all their sins.[a] He must put all these on the goat’s head. Then he must send the goat away into the wilderness with a man appointed for the task.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” means the people of Israel; the Hebrew expression is literally “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew description of the man is difficult and may emphasize that he was ready, designated, or suited for this task.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Aaron shall lay both his hands on the head of the live goat
  simplified_phrase: Aaron must place both hands on the head of the live goat.
  preserved_meaning: Aaron performs the required ritual action with both hands on the living goat.
  reasoning_layer_used: Lexical decisions for וְסָמַךְ, שְׁתֵּי יָדוֹ, and הַשָּׂעִיר הַחַי.
  rationale: “Must place” states the required action directly without implying added pressure.
- pob_phrase: all the iniquities of the sons of Israel, and all their transgressions, all their sins
  simplified_phrase: all the iniquities of the sons of Israel, all their transgressions, and all their sins
  preserved_meaning: The repeated “all” and three distinct terms emphasize the full range of Israel’s guilt.
  reasoning_layer_used: Theological decisions on the threefold sin terminology and the filial expression.
  rationale: The clear modern list preserves both the three terms and their repeated comprehensive emphasis.
- pob_phrase: send it away into the wilderness by the hand of a man appointed for the task
  simplified_phrase: send the goat away into the wilderness with a man appointed for the task
  preserved_meaning: An appointed man serves as the agent who takes the goat into the wilderness.
  reasoning_layer_used: Lexical decisions for וְשִׁלַּח, בְּיַד אִישׁ עִתִּי, and הַמִּדְבָּרָה.
  rationale: “With a man” clearly expresses agency without suggesting custodial care.
translation_notes:
  risk_flags:
  - risk: “Iniquities” may be unfamiliar to some readers.
    mitigation: It remains because the audit distinguishes it from “transgressions” and “sins.”
  - risk: The exact nuance of the Hebrew description of the man is uncertain.
    mitigation: The footnote preserves the possibilities of readiness, designation, and suitability.
