translation:
  language: en
  text: 'This will be a permanent law for you: On the tenth day of the seventh month, you must humble yourselves[a] and do no work. This applies both to native-born people and to foreigners living among you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “afflict yourselves.” This was traditionally understood to include fasting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a permanent statute
  simplified_phrase: a permanent law
  preserved_meaning: The command remains an enduring obligation within the covenant.
  reasoning_layer_used: POB lexical decision for לְחֻקַּת עוֹלָם
  rationale: “Law” communicates the legal force more clearly than “statute.”
- pob_phrase: in the seventh month, on the tenth day of the month
  simplified_phrase: On the tenth day of the seventh month
  preserved_meaning: The command is dated to the same day in Israel’s calendar.
  reasoning_layer_used: POB lexical decisions for the calendar expressions
  rationale: Reordering the date produces natural English without changing it.
- pob_phrase: whether the native-born or the sojourner who sojourns among you
  simplified_phrase: This applies both to native-born people and to foreigners living among you
  preserved_meaning: Both native community members and resident outsiders are bound by the command.
  reasoning_layer_used: POB lexical decisions for הָאֶזְרָח and הַגֵּר
  rationale: The new sentence removes the archaic repetition while preserving both groups.
translation_notes:
  risk_flags:
  - risk: “Foreigners” may not by itself convey the settled status of the Hebrew גֵּר.
    mitigation: “Living among you” preserves that these are resident outsiders.
  - risk: Modern readers may take “humble yourselves” as only an inward attitude.
    mitigation: The footnote preserves the stronger image and notes its traditional connection with fasting.
