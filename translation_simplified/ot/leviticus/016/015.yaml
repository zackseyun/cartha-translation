translation:
  language: en
  text: Then he must slaughter the goat that is the people's sin offering. He must take its blood behind the veil and use it as he used the bull's blood, sprinkling it on the atonement cover[a] and in front of it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “mercy seat.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the goat of the sin offering that is for the people
  simplified_phrase: the goat that is the people's sin offering
  preserved_meaning: The goat is the sacrificial animal offered for the people’s sin offering.
  reasoning_layer_used: Lexical decisions for שְׂעִיר הַחַטָּאת and אֲשֶׁר לָעָם
  rationale: The possessive form makes the relationship clear without losing the distinct ritual role.
- pob_phrase: bring its blood inside the veil
  simplified_phrase: take its blood behind the veil
  preserved_meaning: The blood is carried into the inner area beyond the sanctuary curtain.
  reasoning_layer_used: Lexical decision for אֶל מִבֵּית לַפָּרֹכֶת
  rationale: “Behind the veil” states the intended location in ordinary spatial language.
- pob_phrase: do with its blood as he did with the blood of the bull, and sprinkle it
  simplified_phrase: use it as he used the bull's blood, sprinkling it
  preserved_meaning: He performs the same sprinkling ritual with the goat’s blood as with the bull’s blood.
  reasoning_layer_used: Lexical decisions for וְעָשָׂה אֶת־דָּמוֹ and וְהִזָּה אֹתוֹ
  rationale: The recast removes the elliptical wording while keeping the repeated ritual action explicit.
