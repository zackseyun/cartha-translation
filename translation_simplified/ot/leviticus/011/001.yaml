simplification_decisions:
- pob_phrase: And Yahweh spoke to Moses and to Aaron
  simplified_phrase: Yahweh spoke to Moses and Aaron
  preserved_meaning: Yahweh addresses both Moses and Aaron as a new narrative event begins.
  reasoning_layer_used: Lexical decisions for וַיְדַבֵּר, יְהוָה, and וְאֶל
  rationale: Omitting the opening conjunction and repeated preposition gives natural English while preserving the speaker and both addressees.
- pob_phrase: saying to them
  simplified_phrase: saying to them
  preserved_meaning: The speech that follows is directed to both Moses and Aaron.
  reasoning_layer_used: Lexical decisions for לֵאמֹר and אֲלֵהֶם
  rationale: Keeping one continuous speech formula avoids suggesting two separate acts of speaking.
translation_notes:
  risk_flags:
