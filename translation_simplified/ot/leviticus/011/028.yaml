translation:
  language: en
  text: Anyone who carries the carcass of any of these animals must wash their clothes and will be unclean until evening.[a] These animals are unclean for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “their carcasses.”
