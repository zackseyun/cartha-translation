simplification_decisions:
- pob_phrase: Whoever carries their carcass
  simplified_phrase: Anyone who carries the carcass of any of these animals
  preserved_meaning: The law applies generally to a person who carries the carcass of an animal under discussion.
  reasoning_layer_used: Lexical decision and POB footnote on נִבְלָתָם
  rationale: The recasting removes the awkward plural possessive while preserving the distributive sense and documented alternative.
- pob_phrase: shall wash his clothes and be unclean
  simplified_phrase: must wash their clothes and will be unclean
  preserved_meaning: Washing is required, and carrying the carcass results in ritual uncleanness.
  reasoning_layer_used: Lexical decisions for יְכַבֵּס בְּגָדָיו and וְטָמֵא
  rationale: Modern modal verbs and a gender-inclusive pronoun make the legal sequence easier to read.
- pob_phrase: They are unclean for you
  simplified_phrase: These animals are unclean for you
  preserved_meaning: The animals being discussed have an unclean ritual status for the Israelites.
  reasoning_layer_used: Lexical decision for טְמֵאִים הֵמָּה לָכֶם
  rationale: Naming the animals removes an unclear pronoun reference without adding a new judgment.
