translation:
  language: en
  text: You must regard every swarming creature with wings that moves on four legs as detestable.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “walks on four”; the next verses make an exception for certain insects with legs for hopping.
    reason: cultural_note
  - marker: b
    text: Here “detestable” refers to what Israel was forbidden to eat under these ritual food laws.
    reason: simplification_note
