  reasoning_layer_used: POB lexical decisions for שֶׁרֶץ and הָעוֹף
  rationale: The reordered phrase is easier to understand while preserving the broad category.
- pob_phrase: that walks on four feet
  simplified_phrase: that moves on four legs
  preserved_meaning: The phrase describes the creature’s usual way of moving on four legs.
  reasoning_layer_used: POB lexical decision and cultural note for הַהֹלֵךְ עַל אַרְבַּע
  rationale: “Moves” avoids an awkward picture of insects walking on humanlike feet.
- pob_phrase: is detestable to you
  simplified_phrase: You must regard … as detestable
  preserved_meaning: Israel is required to treat these creatures as ritually detestable.
  reasoning_layer_used: POB lexical decisions for שֶׁקֶץ and לָכֶם
  rationale: The active wording makes the legal force and Israel’s required response clear.
