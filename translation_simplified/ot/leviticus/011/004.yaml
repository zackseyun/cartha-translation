translation:
  language: en
  text: 'But you must not eat animals that have only one of these traits: chewing the cud or having a divided hoof. The camel chews the cud, but it does not have a divided hoof. It is unclean for you.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “unclean” means that Israel was not permitted to eat it under the dietary laws.
    reason: cultural_note
