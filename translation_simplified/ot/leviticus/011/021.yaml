  simplified_phrase: among the flying creatures that swarm
  preserved_meaning: The permitted class remains flying creatures characterized by swarming.
  reasoning_layer_used: POB lexical decision for מִכֹּל שֶׁרֶץ הָעוֹף
  rationale: The reordered phrase is easier to understand while keeping the broad zoological category.
- pob_phrase: those that have jointed legs above their feet to hop on the ground with them
  simplified_phrase: those that have jointed legs above their feet, which they use to hop on the ground
  preserved_meaning: The special legs are anatomically distinct and serve for hopping.
  reasoning_layer_used: POB lexical decisions for כְרָעַיִם, מִמַּעַל לְרַגְלָיו, לְנַתֵּר, and בָּהֵן
  rationale: An explicit relative clause makes the legs’ function clear without weakening the anatomical image.
