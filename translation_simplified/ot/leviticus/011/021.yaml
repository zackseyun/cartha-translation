translation:
  language: en
  text: Yet among the flying creatures that swarm and move on all fours, you may eat those that have[a] jointed legs[b] above their feet, which they use to hop on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The written Hebrew says “do not have legs,” but the traditional reading, the context, and ancient versions support “have legs.”
    reason: textual_variant
  - marker: b
    text: Or “leaping legs”; this refers to the specialized hind legs used for hopping.
    reason: lexical_alternative
