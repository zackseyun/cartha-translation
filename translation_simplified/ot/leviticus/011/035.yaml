translation:
  language: en
  text: Anything that any part of their carcass falls on will become unclean.[a] If it is an oven or a cooking hearth, it must be broken apart. Such cooking structures are unclean, and you must regard them as unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “unclean” means ritually unclean under Israel’s purity laws, not morally evil.
    reason: simplification_note
simplification_decisions:
- pob_phrase: anything on which any part of their carcass falls shall become unclean
  simplified_phrase: Anything that any part of their carcass falls on will become unclean
  preserved_meaning: Contact with any part of the dead creature makes the object unclean.
  reasoning_layer_used: Lexical decisions for יִפֹּל, נִּבְלָתָם, and עָלָיו יִטְמָא
  rationale: The legal condition is recast in ordinary English without weakening the resulting impurity.
- pob_phrase: Whether oven or hearth, it must be broken down
  simplified_phrase: If it is an oven or a cooking hearth, it must be broken apart
  preserved_meaning: A contaminated cooking installation must be destroyed.
  reasoning_layer_used: Lexical decisions for תַּנּוּר, כִירַיִם, and יֻתָּץ
  rationale: “Cooking hearth” identifies the object’s use, while “broken apart” clearly describes its required destruction.
- pob_phrase: they are unclean, and they shall be unclean for you
  simplified_phrase: Such cooking structures are unclean, and you must regard them as unclean
  preserved_meaning: The structures are unclean and Israel must treat them accordingly.
  reasoning_layer_used: Lexical decision for וּטְמֵאִים יִהְיוּ לָכֶם
  rationale: The repeated pronoun is replaced with its clear referent, and “for you” is expressed as Israel’s obligation.
