translation:
  language: en
  text: Tell the children of Israel:[a] “Of all the animals that live on land, these are the ones you may eat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of Israel,” meaning the descendants of Israel as a people.
