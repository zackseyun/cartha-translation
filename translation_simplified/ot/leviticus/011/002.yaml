- pob_phrase: Speak to the sons of Israel, saying
  simplified_phrase: Tell the children of Israel
  preserved_meaning: Moses and Aaron are commanded to address Israel collectively while retaining the family relationship in the name.
  reasoning_layer_used: POB lexical decisions for דַּבְּרוּ, בְּנֵי יִשְׂרָאֵל, and לֵאמֹר
  rationale: “Tell” naturally introduces the quotation, and “children” preserves the familial expression without implying only males.
- pob_phrase: These are the living creatures that you may eat from among all the animals
  simplified_phrase: Of all the animals ... these are the ones you may eat
  preserved_meaning: The law permits Israel to select certain animals for food from the larger group.
  reasoning_layer_used: POB lexical decisions for זֹאת, הַחַיָּה, אֲשֶׁר תֹּאכְלוּ, and מִכָּל
  rationale: The reordered sentence makes the selection and permission immediately clear while preserving the collective plural sense.
- pob_phrase: that are on the earth
  simplified_phrase: that live on land
  preserved_meaning: The verse introduces land creatures, distinct from the aquatic creatures discussed later.
  reasoning_layer_used: POB lexical decision and footnote for אֲשֶׁר עַל הָאָרֶץ
  rationale: “Live on land” states the creature category more naturally than the potentially global phrase “on the earth.”
