- pob_phrase: Anything that goes on its belly, and anything that goes on four feet, even every creature with many feet
  simplified_phrase: any that crawl on their bellies, walk on four feet, or have many feet
  preserved_meaning: The prohibition includes each listed mode of movement and number of feet.
  reasoning_layer_used: POB lexical decisions for the three creature categories
  rationale: A coordinated list makes the categories easier to understand without merging them.
- pob_phrase: you shall not eat them, for they are detestable
