translation:
  language: en
  text: Anyone who eats any part of its carcass must wash his clothes and will be unclean until evening.[a] Anyone who carries its carcass must also wash his clothes and will be unclean until evening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “unclean” refers to uncleanness under Israel’s ritual purity laws.
    reason: cultural_note
