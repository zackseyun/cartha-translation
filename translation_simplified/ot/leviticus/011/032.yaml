translation:
  language: en
  text: If the dead body of any of these creatures falls on an object, the object will become unclean. This includes any wooden object, garment, animal skin, sackcloth, or any object used for work. Put the object into water.[a] It will remain unclean until evening; then it will be clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Immerse the object in water.” The Hebrew literally says “bring it into the water.”
    reason: lexical_alternative
