translation:
  language: en
  text: For Yahweh is restoring Jacob’s majesty to be like Israel’s majesty, though plunderers have stripped them bare and ruined their vine branches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Is restoring” may also be translated “has restored” or “will restore”; the Hebrew can describe a future act as certain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the majesty of Jacob like the majesty of Israel
  simplified_phrase: Jacob’s majesty to be like Israel’s majesty
  preserved_meaning: Yahweh restores Jacob’s positive dignity in comparison with Israel’s majesty.
  reasoning_layer_used: Lexical and theological decisions on גְּאוֹן and comparative כְּ.
  rationale: The recast comparison is easier to follow without adding recurrence or implying sinful pride.
- pob_phrase: plunderers have plundered them
  simplified_phrase: plunderers have stripped them bare
  preserved_meaning: Ravagers have thoroughly despoiled Jacob and Israel.
  reasoning_layer_used: Lexical decision on בְקָקוּם ... בֹּקְקִים.
  rationale: The concrete idiom conveys the intensive force without awkward repetition.
- pob_phrase: ruined their vine branches
  simplified_phrase: ruined their vine branches
  preserved_meaning: The devastation includes the destruction of their vine shoots.
  reasoning_layer_used: Lexical decisions on זְמוֹרָה and שׁחת.
  rationale: The wording retains the source-language vine image.
translation_notes:
