translation:
  language: en
  text: “Look! I am against you,” declares Yahweh of Armies. “I will burn your chariots in smoke[a]. The sword will devour your young lions[b]. I will destroy the prey you have taken from the earth, and your messengers’ voices will never be heard again.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “burn your chariots into smoke”; the Hebrew may describe either the manner of burning or its result.
    reason: lexical_alternative
  - marker: b
    text: “Young lions” continues Nineveh’s lion imagery and likely represents its warriors or rulers.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Behold, I am against you
  simplified_phrase: Look! I am against you
  preserved_meaning: Yahweh solemnly commands attention as he confronts Nineveh.
  reasoning_layer_used: POB lexical decision for הִנְנִי אֵלַיִךְ
  rationale: “Look!” is a permitted modern equivalent that retains the warning’s force.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh of Armies
  preserved_meaning: Yahweh speaks as ruler of assembled heavenly and earthly forces.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה צְבָאוֹת
  rationale: “Armies” explains the older word “hosts” while retaining Yahweh’s name and title.
- pob_phrase: I will cut off your prey from the earth
  simplified_phrase: I will destroy the prey you have taken from the earth
  preserved_meaning: Yahweh will decisively eliminate the gains of Nineveh’s predatory violence.
  reasoning_layer_used: POB lexical decisions for וְהִכְרַתִּי and מֵאֶרֶץ טַרְפֵּךְ
  rationale: “Destroy” preserves the judgment’s force, while “you have taken” clarifies how the prey became Nineveh’s.
interpretive_expansions:
- pob_phrase: your prey
  rendering: the prey you have taken from the earth
  claim: The prey is what Nineveh seized through its predatory violence.
  evidence:
  - The possessive “your prey” identifies the prey with Nineveh.
  - The surrounding lion imagery portrays Nineveh as a predator.
  confidence: high
  alternatives_preserved:
  - your prey
  - your plunder
- pob_phrase: your young lions
  rendering: your young lions[b]
  claim: The young lions likely represent Nineveh’s warriors or rulers.
  evidence:
  - Nahum’s surrounding lion imagery applies the metaphor to Nineveh.
  - The POB cultural note identifies warriors or rulers as the likely referent.
  confidence: moderate
  alternatives_preserved:
  - Literal young lions remain in the main text.
translation_notes:
  risk_flags:
  - risk: “Yahweh of Armies” is less traditional than “Yahweh of hosts.”
    mitigation: It retains the divine name and expresses the title in common English.
  - risk: “In smoke” may suggest only the manner rather than the result of burning.
    mitigation: Footnote [a] preserves the possible meaning “into smoke.”
