  simplified_phrase: has advanced directly against you
  preserved_meaning: The attacker has moved forward to confront the city.
  reasoning_layer_used: Lexical decisions for עָלָה and עַל פָּנַיִךְ
  rationale: The smoother wording states the idiom’s military sense without weakening its direct threat.
- pob_phrase: strengthen your loins
  simplified_phrase: brace yourself for action
  preserved_meaning: The defenders must prepare themselves resolutely for battle.
  reasoning_layer_used: Lexical decision for חַזֵּק מָתְנַיִם
  rationale: The main text gives the idiom’s natural meaning while a footnote preserves its bodily image.
- pob_phrase: muster your strength greatly
  simplified_phrase: gather all your strength
  preserved_meaning: The defenders are urgently commanded to summon their full strength.
  reasoning_layer_used: Lexical decisions for אַמֵּץ כֹּחַ and מְאֹד
  rationale: “All” expresses the Hebrew intensifier in clear, forceful English.
