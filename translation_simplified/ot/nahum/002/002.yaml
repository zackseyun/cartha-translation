translation:
  language: en
  text: A scatterer[a] has advanced directly against you. Guard the fortress[b]! Watch the road! Brace yourself for action[c]! Gather all your strength!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a shatterer”; the Hebrew can describe one who scatters or smashes.
    reason: lexical_alternative
  - marker: b
    text: Or “the stronghold”; the Hebrew may refer more broadly to a fortified or besieged position.
    reason: lexical_alternative
  - marker: c
    text: Literally “strengthen your loins,” a bodily image for preparing firmly for action.
    reason: simplification_note
