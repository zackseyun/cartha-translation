translation:
  language: en
  text: Look! Your troops[a] are women among you. The gates of your land are wide open to your enemies. Fire has burned up your gate-bars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your people.” In this military setting, the Hebrew likely refers to Nineveh’s defenders.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, your troops are women in your midst
  simplified_phrase: Look! Your troops are women among you.
  preserved_meaning: The emphatic warning and the literal gendered military taunt remain intact.
  reasoning_layer_used: Lexical and theological decisions on הִנֵּה, עַמֵּךְ, נָשִׁים, and בקרבך.
  rationale: A separate exclamation and “among you” make the statement easier to grasp without softening it.
- pob_phrase: the gates of your land stand wide open to your enemies
  simplified_phrase: The gates of your land are wide open to your enemies.
  preserved_meaning: The gates are completely open and leave the land exposed to attack.
  reasoning_layer_used: Lexical decision on the emphatic construction פתוח נפתחו.
  rationale: Removing “stand” gives natural English while “wide open” keeps the Hebrew emphasis.
- pob_phrase: fire has consumed your bars
  simplified_phrase: Fire has burned up your gate-bars.
  preserved_meaning: Fire has destroyed the bars securing the city gates.
  reasoning_layer_used: Lexical decisions on אכלה אש and בריחיך.
  rationale: “Burned up” is common language, and “gate-bars” makes the object immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear the reference to women apart from its ancient military-taunt setting.
    mitigation: The wording retains the source image without adding “weak” or endorsing the taunt.
  - risk: Rendering עַמֵּךְ as “troops” narrows the usual sense “people.”
    mitigation: The military context supports “troops,” while the footnote preserves the broader alternative.
