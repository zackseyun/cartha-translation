translation:
  language: en
  text: King of Assyria, your shepherds—your leaders—are asleep. Your nobles lie down, inactive.[a] Your people are scattered across the mountains,[b] and no one is there to gather them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verb can also mean “dwell” or “rest,” but here it likely continues the picture of leaders lying inactive.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “scattered” is difficult, but the next line supports this meaning.
    reason: textual_variant
