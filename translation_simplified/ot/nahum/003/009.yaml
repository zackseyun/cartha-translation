translation:
  language: en
  text: Cush was her source of strength, and Egypt’s support had no limit. Put and the Libyans were among your helpers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew shifts from “her” to “your” within this verse; some translations use “your” in both places.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Cush was her strength
  simplified_phrase: Cush was her source of strength
  preserved_meaning: Cush supplied the strength belonging to the feminine referent, Thebes.
  reasoning_layer_used: Lexical decision for עָצְמָהּ and immediate context
  rationale: “Source of strength” makes Cush’s supporting role clear while preserving “her.”
- pob_phrase: and Egypt without end
  simplified_phrase: and Egypt’s support had no limit
  preserved_meaning: Egypt provided support of immeasurable extent.
  reasoning_layer_used: Lexical decisions for וּמִצְרַיִם and וְאֵין קֵצֶה, with immediate alliance context
  rationale: “Support” clarifies the ellipsis without narrowly defining it as Egypt’s strength.
- pob_phrase: Put and the Libyans were among your helpers
  simplified_phrase: Put and the Libyans were among your helpers
  preserved_meaning: These peoples belonged to the forces supporting the city.
  reasoning_layer_used: Lexical decisions for פּוּט, לוּבִים, and בְּעֶזְרָתֵךְ
  rationale: The POB wording is already clear and preserves the direct address.
interpretive_expansions:
- pob_phrase: and Egypt without end
  rendering: and Egypt’s support had no limit
  claim: The limitless extent concerns Egypt’s support for the city.
  evidence:
  - The verse lists nations that strengthened or helped the city.
  - POB defines “without end” as immeasurable extent.
  confidence: high
  alternatives_preserved:
  - and Egypt without end
  - and Egypt’s resources had no limit
