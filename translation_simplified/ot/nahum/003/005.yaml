translation:
  language: en
  text: “Look! I am against you,” declares Yahweh of hosts. “I will pull your skirts up over your face[a]. I will expose your nakedness to the nations and your shame to the kingdoms.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This image of lifting a woman’s skirts describes public exposure and humiliation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, I am against you
  simplified_phrase: Look! I am against you
  preserved_meaning: The opening still commands attention and solemnly announces God’s hostility toward Nineveh.
  reasoning_layer_used: Lexical decisions for הִנְנִי and אֵלַיִךְ
  rationale: “Look!” gives the prophetic announcement direct force in common English.
- pob_phrase: I will uncover your skirts over your face
  simplified_phrase: I will pull your skirts up over your face
  preserved_meaning: The vivid image of forced exposure and public humiliation remains intact.
  reasoning_layer_used: Lexical decisions for וְגִלֵּיתִי, שׁוּלַיִךְ, and עַל פָּנַיִךְ
  rationale: “Pull up” makes the garment’s movement immediately understandable.
- pob_phrase: I will show the nations your nakedness
  simplified_phrase: I will expose your nakedness to the nations
  preserved_meaning: God will make Nineveh’s disgrace publicly visible before other nations.
  reasoning_layer_used: Lexical decisions for וְהַרְאֵיתִי, גוֹיִם, and מַעְרֵךְ
  rationale: “Expose to” states the same action in natural modern English.
