translation:
  language: en
  text: This is because of the prostitute’s many acts of prostitution. She is alluring and skilled in sorcery. She sells nations by means of her prostitution and clans by means of her sorcery.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Clans are extended family groups.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the many prostitutions of the prostitute
  simplified_phrase: the prostitute’s many acts of prostitution
  preserved_meaning: The repeated wording and sexualized metaphor still portray abundant seductive and faithless dealings.
  reasoning_layer_used: lexical decisions and theological decision
  rationale: The recast phrase is easier to follow without narrowing the prophetic metaphor.
- pob_phrase: charming in grace, mistress of sorceries
  simplified_phrase: alluring and skilled in sorcery
  preserved_meaning: Her seductive attractiveness and defining association with sorcery remain distinct.
  reasoning_layer_used: lexical decisions
  rationale: Common wording replaces two opaque expressions while avoiding a focus on physical beauty alone.
- pob_phrase: who sells nations by her prostitutions and clans by her sorceries
  simplified_phrase: She sells nations by means of her prostitution and clans by means of her sorcery
  preserved_meaning: The commercial exploitation image and the instrumental force of both means are retained.
  reasoning_layer_used: lexical decisions and applied revisions
  rationale: A separate sentence and “by means of” make the relationship between action and means immediately clear.
translation_notes:
  risk_flags:
  - risk: “Skilled in sorcery” may stress expertise more than the Hebrew phrase’s broader sense of possessing or being characterized by sorcery.
    mitigation: The wording follows a documented lexical alternative and keeps sorcery as her defining trait.
