translation:
  language: en
  text: Your guards[a] are like locusts, and your scribes[b] are like swarms of locusts resting on the walls on a cold day. When the sun rises, they fly away, and no one knows where they have gone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew term may instead mean “crowned ones,” “princes,” or “consecrated ones.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may also refer to officers or military commanders.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your scribes like swarms of locusts, settling on the walls
  simplified_phrase: your scribes are like swarms of locusts resting on the walls
  preserved_meaning: The scribes are compared to masses of locusts temporarily resting on a protective structure.
  reasoning_layer_used: POB lexical decisions for כְּגֹב גֹבָי, הַחוֹנִים, and בַּגְּדֵרוֹת
  rationale: Adding “are” clarifies the comparison, while “resting” naturally preserves the locusts’ temporary settlement.
- pob_phrase: The sun rises, and they fly away
  simplified_phrase: When the sun rises, they fly away
  preserved_meaning: The locust-like guards and scribes depart as the sun rises.
  reasoning_layer_used: POB lexical decisions for שֶׁמֶשׁ זָרְחָה and וְנוֹדַד
  rationale: The temporal clause makes the sequence easy to follow without adding a stronger contrast.
- pob_phrase: no one knows where they are
  simplified_phrase: no one knows where they have gone
  preserved_meaning: Their whereabouts are unknown after they leave.
  reasoning_layer_used: POB lexical decision for וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  rationale: This natural wording connects their unknown location to their departure.
