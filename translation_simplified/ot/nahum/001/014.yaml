translation:
  language: en
  text: 'Yahweh has issued this command concerning you:


    “Your name will no longer be sown—that is, carried on.[a] From the temple of your gods, I will cut off carved idols and cast-metal idols.[b] I will prepare your grave, because you are contemptible.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The image probably means that your family line or dynasty will not continue.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says more literally, “the house of your gods.”
    reason: source_note
  - marker: c
    text: The last word can also mean “vile” or “insignificant.”
    reason: lexical_alternative
