  rationale: “Issued this command” states the completed divine decree in natural English.
- pob_phrase: From the house of your gods I will cut off carved image and cast image
  simplified_phrase: From the temple of your gods, I will cut off carved idols and cast-metal idols
  preserved_meaning: Yahweh will remove both kinds of worship images from the addressee’s sanctuary.
  reasoning_layer_used: Lexical decisions for מִבֵּית אֱלֹהֶיךָ, אַכְרִית, פֶסֶל, and מַסֵּכָה
  rationale: “Temple,” “idols,” and “cast-metal” clarify the setting and objects without adding another action or distributive scope.
- pob_phrase: I will make your grave
