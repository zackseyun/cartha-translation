translation:
  language: en
  text: But with an overwhelming flood, he will completely destroy her place.[a] Darkness will pursue his enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “her place,” likely personifying Nineveh; it may also be translated “its place.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he will make a complete end of her place
  simplified_phrase: he will completely destroy her place
  preserved_meaning: The destruction of the city’s place will be total.
  reasoning_layer_used: Lexical decision for כָּלָה and theological decision on the feminine suffix
  rationale: The direct verb “destroy” clearly expresses the full end while retaining “her” from the Hebrew.
- pob_phrase: and darkness will pursue his enemies
  simplified_phrase: Darkness will pursue his enemies.
  preserved_meaning: The LORD’s enemies remain under the threatening pursuit of darkness.
  reasoning_layer_used: Lexical decisions for יְרַדֵּף and חֹשֶׁךְ
  rationale: A separate sentence makes the image easier to grasp without explaining away the darkness.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know who “her” refers to.
    mitigation: The footnote identifies the likely personified city while preserving the alternate rendering.
  - risk: “Darkness” may be read only as literal lack of light.
    mitigation: The concrete prophetic image is retained because the POB deliberately leaves its judgment overtones implicit.
