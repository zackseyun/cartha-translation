translation:
  language: en
  text: The mountains quake before him, and the hills melt away. The earth rises up in his presence—the world and everyone who lives in it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that the earth heaves or is upheaved; literally, it rises “before his face.”
