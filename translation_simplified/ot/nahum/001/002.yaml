translation:
  language: en
  text: Yahweh is a jealous God[a] who takes vengeance. Yahweh takes vengeance and is full of wrath. He takes vengeance on those who oppose him and stores up wrath for his enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “jealous” means that Yahweh rightly demands his people's exclusive loyalty; it can also be translated “zealous.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a jealous and avenging God
  simplified_phrase: a jealous God who takes vengeance
  preserved_meaning: Yahweh's covenant jealousy and active vengeance remain distinct and forceful.
  reasoning_layer_used: POB lexical and theological decisions for קַנּוֹא and נֹקֵם
  rationale: The relative clause is easier to understand than the participial adjective “avenging.”
- pob_phrase: his adversaries
  simplified_phrase: those who oppose him
  preserved_meaning: The phrase still identifies people who stand against Yahweh as the targets of vengeance.
  reasoning_layer_used: POB lexical decision for לְצָרָיו
  rationale: Common words replace the less familiar term “adversaries” without weakening its hostile sense.
- pob_phrase: he keeps wrath for his enemies
  simplified_phrase: stores up wrath for his enemies
  preserved_meaning: Yahweh retains wrath in reserve for his enemies.
  reasoning_layer_used: POB lexical decisions for וְנוֹטֵר and לְאֹיְבָיו
  rationale: “Stores up” makes the image of wrath kept in reserve immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake divine jealousy for petty envy.
    mitigation: The footnote explains its covenantal sense while retaining the source-driven term.
  - risk: “Stores up wrath” could sound more specific about timing than “keeps wrath.”
    mitigation: The wording follows POB's documented alternative “reserves wrath” and preserves the retained-wrath image.
