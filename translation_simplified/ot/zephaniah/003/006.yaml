translation:
  language: en
  text: I have cut off nations. Their corner towers[a] lie in ruins. I have left their streets empty, with no one passing through. Their cities are devastated. Not a man remains; no one lives there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “corners,” possibly meaning corner fortifications or towers.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression “not a man” describes complete depopulation.
    reason: lexical_alternative
