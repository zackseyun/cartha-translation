translation:
  language: en
  text: From beyond the rivers of Cush,[a] my worshipers[b]—the daughter of my scattered people[c]—will bring my offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cush was an ancient region south of Egypt and was not identical to modern Ethiopia.
    reason: cultural_note
  - marker: b
    text: Or “those who pray to me”; the Hebrew describes people who pray or plead and therefore worship.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says “the daughter of my scattered ones”; this compact poetic title may describe the worshipers or refer to a distinct group.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: my dispersed ones
  simplified_phrase: my scattered people
  preserved_meaning: They are people scattered from one another who belong to the speaker, without identifying who scattered them.
  reasoning_layer_used: POB lexical decision for פוּצַי
  rationale: “Scattered people” is more familiar than “dispersed ones” while preserving the documented ambiguity.
- pob_phrase: my worshipers, the daughter of my dispersed ones
  simplified_phrase: my worshipers—the daughter of my scattered people—
  preserved_meaning: The daughter image remains while its uncertain relationship to the worshipers is not explained as settled.
  reasoning_layer_used: POB theological decision on compressed syntax and poetic collective imagery
  rationale: Keeping the image in the text avoids turning a possible interpretation into a definite claim.
