translation:
  language: en
  text: On that day, you will no longer be put to shame because of all the rebellious things you did against me.[a] Then I will remove from among you those who celebrate with arrogant pride.[b] You will never again act proudly on my holy mountain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will no longer be ashamed.”
    reason: lexical_alternative
  - marker: b
    text: Or “your proudly exultant ones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all your deeds by which you rebelled against me
  simplified_phrase: all the rebellious things you did against me
  preserved_meaning: The deeds were real acts of rebellion against God.
  reasoning_layer_used: lexical and theological decisions
  rationale: The simpler wording keeps both the people's guilt and the relational force of rebellion.
- pob_phrase: those who exult in your pride
  simplified_phrase: those who celebrate with arrogant pride
  preserved_meaning: God removes people marked by joyful arrogance.
  reasoning_layer_used: lexical decision
  rationale: “Celebrate” makes exultant rejoicing clear while “arrogant pride” preserves its negative sense.
- pob_phrase: you will no longer be haughty
  simplified_phrase: You will never again act proudly
  preserved_meaning: Arrogant conduct on God's holy mountain will cease.
  reasoning_layer_used: lexical decision
  rationale: The common phrase “act proudly” clearly expresses the moral sense rather than physical height.
translation_notes:
  risk_flags:
  - risk: “Put to shame” may be read as denying the people's former guilt.
    mitigation: The clause about their rebellious acts preserves guilt, while the promise concerns restored freedom from disgrace.
  - risk: The singular “you” may sound individual rather than communal.
    mitigation: “From among you” keeps the reference anchored in the restored community.
