translation:
  language: en
  text: '“So wait for me,” declares Yahweh, “until the day I rise to give testimony.[a] My judgment is this: I will gather the nations and assemble the kingdoms. I will pour out my indignation on them—all my burning anger. The fire of my jealousy[b] will consume the whole earth.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean “until the day I rise for prey.”
    reason: alternative_reading
  - marker: b
    text: “Jealousy” may also be translated “zeal.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore wait for me ... for the day when I rise up as a witness
  simplified_phrase: So wait for me ... until the day I rise to give testimony
  preserved_meaning: Yahweh commands the hearers to wait for his future judicial action as a witness.
  reasoning_layer_used: Lexical and theological decisions on לְעַד
  rationale: “Give testimony” makes the chosen witness sense natural while the footnote preserves the ambiguity.
- pob_phrase: for my judgment is to gather nations, to assemble kingdoms
  simplified_phrase: 'My judgment is this: I will gather the nations and assemble the kingdoms'
  preserved_meaning: Yahweh’s judicial decision is to bring nations and kingdoms together for judgment.
  reasoning_layer_used: Lexical decision on מִשְׁפָּטִי and clause structure
  rationale: A direct statement replaces the dense infinitive construction without weakening its judicial force.
- pob_phrase: for in the fire of my jealousy all the earth will be consumed
  simplified_phrase: The fire of my jealousy will consume the whole earth
  preserved_meaning: Yahweh’s jealous anger is pictured as a fire consuming the entire earth.
  reasoning_layer_used: Lexical decisions on קִנְאָה, fire imagery, and הָאָרֶץ
  rationale: The active sentence is easier to read and preserves both the fire image and universal scope.
