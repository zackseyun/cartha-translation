translation:
  language: en
  text: Behold, at that time I will act against all who oppress you. I will save those who are lame and gather those who were driven away. I will make them praised and renowned in every land where they were put to shame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult final Hebrew phrase may more literally read “in their shame”; “where they were put to shame” follows the restoration context.
    reason: textual_variant
simplification_decisions:
- pob_phrase: I will deal with all your oppressors
  simplified_phrase: I will act against all who oppress you
  preserved_meaning: God announces decisive action against the people’s oppressors without specifying the form of judgment.
  reasoning_layer_used: Lexical decision for עֹשֶׂה with מְעַנַּיִךְ.
  rationale: The active wording makes the judicial sense immediately clear.
- pob_phrase: the lame ... the outcast
  simplified_phrase: those who are lame ... those who were driven away
  preserved_meaning: God restores people marked by weakness and forced displacement.
  reasoning_layer_used: Lexical and theological decisions for הַצֹּלֵעָה and הַנִּדָּחָה.
  rationale: The plural wording clarifies the collective community while preserving both concrete images.
- pob_phrase: make them a praise and a name
  simplified_phrase: make them praised and renowned
  preserved_meaning: God will reverse their shame by giving them public honor and a respected reputation.
  reasoning_layer_used: Lexical decisions for לִתְהִלָּה and וּלְשֵׁם.
  rationale: This states the Hebrew reputation idiom in natural modern English.
translation_notes:
  risk_flags:
