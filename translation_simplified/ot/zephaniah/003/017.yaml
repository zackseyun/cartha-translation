simplification_decisions:
- pob_phrase: is in your midst
  simplified_phrase: is among you
  preserved_meaning: Yahweh is present within the community of his people.
  reasoning_layer_used: Lexical decision for בקרבך
  rationale: “Among you” states the same community-centered presence in familiar English.
- pob_phrase: a mighty one who saves
  simplified_phrase: He is mighty and saves.
  preserved_meaning: Yahweh is powerful and acts to save.
  reasoning_layer_used: Lexical decisions for גבור and יושיע
  rationale: Two direct verbs replace the less familiar nominal expression without adding warrior imagery.
- pob_phrase: he will exult over you with singing
  simplified_phrase: He will celebrate over you with singing.
  preserved_meaning: Yahweh expresses exuberant joy over his people through song.
  reasoning_layer_used: Lexical decisions for יגיל and ברנה
  rationale: “Celebrate” makes the heightened joy clear while preserving the image of singing.
