  reasoning_layer_used: POB lexical decision for וּבָעֵת קַבְּצִי אֶתְכֶם
  rationale: Combining the repeated time phrase eases reading while keeping bringing and gathering distinct.
- pob_phrase: make you a name and a praise
  simplified_phrase: make you renowned and praised
  preserved_meaning: Yahweh will grant his restored people public honor and recognition.
  reasoning_layer_used: POB lexical decision for אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  rationale: The adjectives clearly convey the idiom while preserving both renown and praise.
- pob_phrase: before your eyes
  simplified_phrase: before your own eyes
  preserved_meaning: The people themselves will openly witness Yahweh's restoration.
  reasoning_layer_used: POB lexical decision for לְעֵינֵיכֶם
  rationale: Adding “own” clarifies the vivid image without weakening it.
