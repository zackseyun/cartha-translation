translation:
  language: en
  text: At that time I will bring you in and gather you together. I will make you renowned and praised among all the peoples of the earth when I restore your fortunes[a] before your own eyes, says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “restore your captivity” or “bring back your captives”; the Hebrew expression refers broadly to recovery from exile or disaster.
    reason: lexical_alternative
