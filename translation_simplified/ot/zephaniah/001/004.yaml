translation:
  language: en
  text: “I will stretch out my hand against Judah and everyone who lives in Jerusalem. From this place I will cut off every trace of Baal. I will erase the very name of the idolatrous priests,[a] along with the priests.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Idolatrous priests” refers to pagan or religiously compromised priests, a group distinguished here from the ordinary priests.
