- pob_phrase: inhabitants of the Mortar
  simplified_phrase: you who live in the Mortar
  preserved_meaning: The prophet directly addresses the residents of a Jerusalem district called the Mortar.
  reasoning_layer_used: Lexical decision for יֹשְׁבֵי and הַמַּכְתֵּשׁ
  rationale: The direct wording is easier while retaining the place-name and its concrete image.
- pob_phrase: all the merchant people
  simplified_phrase: all the merchants
  preserved_meaning: The judged group is the district’s commercial class.
  reasoning_layer_used: Lexical decision for כָּל עַם כְּנַעַן
  rationale: “Merchants” clearly expresses the preferred commercial sense of “Canaan.”
- pob_phrase: all who weigh out silver
  simplified_phrase: Everyone who weighs out silver in trade
  preserved_meaning: Those who conduct commerce by weighing silver will be removed in judgment.
  reasoning_layer_used: Lexical decision for כָּל נְטִילֵי כָסֶף
  rationale: The wording keeps the weighing image and makes its commercial setting clear.
