translation:
  language: en
  text: Wail, you who live in the Mortar[a], because all the merchants[b] are destroyed. Everyone who weighs out silver in trade is cut off.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Maktesh, literally “mortar,” was likely the name of a market district in Jerusalem.
    reason: cultural_note
  - marker: b
    text: Or “all the people of Canaan”; here “Canaan” most likely means merchants.
    reason: lexical_alternative
