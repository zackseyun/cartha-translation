translation:
  language: en
  text: “I will sweep away humanity and the animals. I will sweep away the birds of the sky, the fish of the sea, and the things that cause stumbling[a], along with the wicked. I will wipe humanity from the face of the ground,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stumbling blocks.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: man and beast
  simplified_phrase: humanity and the animals
  preserved_meaning: All humanity and the broad category of animals are included in the judgment.
  reasoning_layer_used: POB lexical decisions and footnote for אָדָם and בְהֵמָה
  rationale: “Humanity” makes the collective sense clear, and “animals” is more familiar than “beast.”
- pob_phrase: the birds of the heavens
  simplified_phrase: the birds of the sky
  preserved_meaning: The birds remain part of the land-air-sea sequence of creatures.
  reasoning_layer_used: POB lexical alternative for עוֹף הַשָּׁמַיִם
  rationale: “Sky” is the documented alternative and is clearer in everyday English.
- pob_phrase: the stumbling blocks with the wicked; I will cut off man
  simplified_phrase: the things that cause stumbling, along with the wicked; I will wipe humanity
  preserved_meaning: The causes of stumbling and the wicked are both judged, and humanity is forcefully removed.
  reasoning_layer_used: POB lexical decisions for הַמַּכְשֵׁלוֹת, אֶת הָרְשָׁעִים, and וְהִכְרַתִּי
  rationale: The wording clarifies the compressed syntax without defining the stumbling as a specific kind of sin.
