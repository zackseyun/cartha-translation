translation:
  language: en
  text: “When the day comes for Yahweh’s sacrifice,[a] I will punish the officials, the king’s sons, and everyone who dresses in the clothing of foreign peoples.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sacrifice of Yahweh.” The phrase may also picture Yahweh preparing a sacrificial feast as an act of judgment (see Zephaniah 1:7).
    reason: lexical_alternative
  - marker: b
    text: This clothing may represent adopting foreign customs or loyalties, not merely wearing fabric made elsewhere.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And on the day of Yahweh’s sacrifice
  simplified_phrase: When the day comes for Yahweh’s sacrifice
  preserved_meaning: A future time is described through the image of Yahweh’s sacrifice.
  reasoning_layer_used: POB lexical decisions for וְהָיָה, בְּיוֹם, and זֶבַח יְהוָה
  rationale: The wording states the future setting naturally without resolving the sacrifice image.
- pob_phrase: all who wear foreign clothing
  simplified_phrase: everyone who dresses in the clothing of foreign peoples
  preserved_meaning: The judgment includes people wearing garments associated with foreigners.
  reasoning_layer_used: POB lexical decision and cultural note for מַלְבּוּשׁ נָכְרִי
  rationale: This avoids suggesting that only the fabric’s place of manufacture matters.
