translation:
  language: en
  text: Yahweh declares, “On that day, a cry will be heard from the Fish Gate, a wail from the Second Quarter,[a] and a tremendous crash[b] from the hills.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Second Quarter was probably a district of Jerusalem; its Hebrew name is Mishneh.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “great destruction” or “great breaking.”
    reason: lexical_alternative
