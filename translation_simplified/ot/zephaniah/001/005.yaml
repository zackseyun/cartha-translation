simplification_decisions:
- pob_phrase: the host of heaven
  simplified_phrase: the array of heavenly powers
  preserved_meaning: The worshipers bow to the celestial array regarded as divine powers.
  reasoning_layer_used: lexical decision for לִצְבָא הַשָּׁמַיִם
  rationale: This keeps the image of an ordered heavenly array without the obscure word “host.”
- pob_phrase: who swear by Yahweh and swear by Milcom
  simplified_phrase: take oaths by Yahweh while also taking oaths by Milcom
  preserved_meaning: They invoke both Yahweh and Milcom in oath-taking.
  reasoning_layer_used: lexical and theological decisions on oath-taking and syncretism
  rationale: “Take oaths” makes the older sense of “swear” immediately clear.
interpretive_expansions:
- pob_phrase: swear by Yahweh and swear by Milcom
  rendering: take oaths by Yahweh while also taking oaths by Milcom
  claim: The same worshipers combine allegiance to Yahweh with allegiance to Milcom.
  evidence:
  - The repeated oath language joins Yahweh and Milcom in a single description.
  - The theological rationale identifies the practice as syncretistic oath-taking.
  confidence: high
  alternatives_preserved:
  - The Hebrew name may be read as “their king” or connected with Molech.
translation_notes:
  risk_flags:
