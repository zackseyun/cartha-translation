translation:
  language: en
  text: Be silent in the presence of the Lord GOD, because the day of Yahweh is near. Yahweh has prepared a sacrifice and has set apart those he has invited.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his guests,” “those he has summoned,” or “those he has called.” The context likely points to those Yahweh has summoned for the sacrificial judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: before the Lord GOD
  simplified_phrase: in the presence of the Lord GOD
  preserved_meaning: The people must remain silent in God's presence.
  reasoning_layer_used: Lexical decision for מִפְּנֵי
  rationale: The fuller phrase makes the relational sense of “before” immediately clear.
- pob_phrase: for the day of Yahweh is near
  simplified_phrase: because the day of Yahweh is near
  preserved_meaning: The approaching day of divine judgment is the reason for silence.
  reasoning_layer_used: Lexical decisions for כִּי and יוֹם יְהוָה
  rationale: “Because” states the explanatory connection more plainly than “for.”
- pob_phrase: he has consecrated his invited ones
  simplified_phrase: has set apart those he has invited
  preserved_meaning: Yahweh has designated the invited people for the sacrificial event.
  reasoning_layer_used: Lexical decisions for הִקְדִּישׁ and קְרֻאָיו
  rationale: “Set apart” communicates the cultic action without the less familiar verb “consecrated.”
translation_notes:
  risk_flags:
  - risk: Readers may assume the invited people are ordinary banquet guests.
    mitigation: The footnote preserves other lexical possibilities and notes the judgment setting.
  - risk: Simplifying “consecrated” could weaken the sacred sacrificial register.
    mitigation: “Set apart” remains tied to the explicitly retained sacrifice image.
