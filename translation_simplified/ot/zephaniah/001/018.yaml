translation:
  language: en
  text: Neither their silver nor their gold can rescue them on the day of Yahweh’s wrath. The fire of his jealousy[b] will consume the whole earth.[a] He will bring all who live on earth to a complete and sudden end.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the whole land”; “earth” reflects the sweeping judgment language here.
    reason: alternative_reading
  - marker: b
    text: Or “the fire of his zeal”; “jealousy” emphasizes Yahweh’s exclusive covenant claim.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression is difficult and may also mean “a complete and terrifying end.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will be able to deliver them
  simplified_phrase: can rescue them
  preserved_meaning: Their wealth is powerless to save them from judgment.
  reasoning_layer_used: lexical decision for יוּכַל לְהַצִּילָם
  rationale: “Can rescue” states the same inability in direct modern English.
- pob_phrase: and in the fire of his jealousy all the earth will be consumed
  simplified_phrase: The fire of his jealousy will consume the whole earth.
  preserved_meaning: Yahweh’s covenant jealousy is pictured as a fire consuming the earth.
  reasoning_layer_used: lexical and theological decisions for קִנְאָה and הָאָרֶץ
  rationale: The active sentence is easier to read while preserving the fire image and universal scope.
- pob_phrase: he will make a complete, indeed sudden, end of all the inhabitants of the earth
  simplified_phrase: He will bring all who live on earth to a complete and sudden end.
  preserved_meaning: The judgment reaches every earthly inhabitant and is total and abrupt.
  reasoning_layer_used: lexical decisions for כָּלָה, נִבְהָלָה, and יֹשְׁבֵי הָאָרֶץ
  rationale: “All who live on earth” replaces the formal noun “inhabitants” without reducing the judgment’s force.
translation_notes:
  risk_flags:
  - risk: “Earth” may be read universally although the Hebrew can mean Judah’s land.
    mitigation: Footnote a preserves the regional alternative while retaining POB’s chosen scope.
  - risk: “Sudden” represents one interpretation of a difficult Hebrew expression.
    mitigation: Footnote c records the important alternative “terrifying.”
