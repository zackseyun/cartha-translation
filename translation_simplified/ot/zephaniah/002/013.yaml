translation:
  language: en
  text: He will stretch out his hand against the north and destroy Assyria. He will turn Nineveh into a dry wasteland, like the wilderness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like the desert.” The Hebrew word can refer to a wilderness or a desert-like wasteland.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he will stretch out his hand against the north and destroy Assyria
  simplified_phrase: He will stretch out his hand against the north and destroy Assyria.
  preserved_meaning: God’s concrete action of judgment against the northern power remains intact.
  reasoning_layer_used: Lexical and theological decisions on וְיֵט יָדוֹ and עַל צָפוֹן
  rationale: A separate sentence makes the judgment easier to follow while preserving the hand image.
- pob_phrase: he will make Nineveh a desolation
  simplified_phrase: He will turn Nineveh into a dry wasteland
  preserved_meaning: Nineveh will be devastated and left in parched, uninhabited conditions.
  reasoning_layer_used: Lexical decisions on וְיָשֵׂם, לִשְׁמָמָה, and צִיָּה
  rationale: “Turn into a dry wasteland” expresses the result in ordinary modern English.
- pob_phrase: dry like the wilderness
  simplified_phrase: like the wilderness
  preserved_meaning: The comparison portrays Nineveh as barren and uninhabited.
  reasoning_layer_used: Lexical decision on כַּמִּדְבָּר
  rationale: The dryness is moved into “dry wasteland” so the comparison reads naturally without losing the image.
