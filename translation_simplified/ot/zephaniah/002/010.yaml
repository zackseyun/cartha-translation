simplification_decisions:
- pob_phrase: This will be their lot in return for their pride
  simplified_phrase: This is what they will receive for their pride
  preserved_meaning: The announced judgment is the consequence of their pride.
  reasoning_layer_used: Lexical decisions for זֹאת, לָהֶם, תַּחַת, and גְּאוֹנָם
  rationale: The new wording expresses recompense without the less familiar idiom “their lot.”
- pob_phrase: they taunted
  simplified_phrase: they mocked
  preserved_meaning: They treated Yahweh’s people with hostile scorn.
  reasoning_layer_used: Lexical decision for חֵרְפוּ
  rationale: “Mocked” is common English and remains within the documented lexical alternatives.
- pob_phrase: magnified themselves against
  simplified_phrase: made themselves great over them
  preserved_meaning: They arrogantly exalted themselves over Yahweh’s people.
  reasoning_layer_used: Lexical decision for וַיַּגְדִּילוּ עַל and latest revision pass
  rationale: This keeps the Hebrew image of making oneself great while making the relationship clear.
translation_notes:
  risk_flags:
  - risk: “Made themselves great” may sound positive when read apart from the context.
    mitigation: “For their pride” and “over them” clearly mark the action as arrogant self-exaltation.
