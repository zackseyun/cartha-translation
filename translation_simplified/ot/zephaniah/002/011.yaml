translation:
  language: en
  text: Yahweh will be terrifying to them, because he will make all the gods of the earth waste away.[a] People from all the distant coastlands of the nations will bow down to him, each from their own place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will starve all the gods of the earth.” The Hebrew image is of making them lean and emaciated.
    reason: lexical_alternative
  - marker: b
    text: “Coastlands” may also be translated “islands” and refers broadly to distant maritime lands and peoples.
    reason: lexical_alternative
