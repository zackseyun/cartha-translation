translation:
  language: en
  text: This is the proud, celebrating city that lived in safety. She said to herself, “I am, and there is no one besides me.” How she has become a devastated ruin,[a] a place where wild animals lie down! Everyone who passes by will hiss[b] at her and wave a hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also describe a place whose devastation fills people with horror.
    reason: lexical_alternative
  - marker: b
    text: Or “whistle”; the sound may express astonishment or ridicule.
    reason: lexical_alternative
