translation:
  language: en
  text: The coastland will belong to the remnant of Judah. They will use it as pasture. In the evening they will lie down in the houses of Ashkelon, because Yahweh their God will care for them[a] and restore their fortunes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “attend to them” or “visit them”; here it refers to Yahweh acting for their good.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “bring back their captives,” but the Hebrew expression often refers more broadly to restoring a people’s former condition.
    reason: alternative_reading
