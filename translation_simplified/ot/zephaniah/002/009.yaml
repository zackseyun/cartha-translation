translation:
  language: en
  text: 'Therefore, Yahweh of hosts, the God of Israel, declares: “As surely as I live, Moab will become like Sodom, and the Ammonites like Gomorrah. Their land will be overgrown with weeds,[a] become a salt pit, and remain desolate forever. The remnant of my people will plunder them, and those who remain of my nation will inherit them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult; it may more formally mean “a possession of nettles.”
    reason: lexical_alternative
