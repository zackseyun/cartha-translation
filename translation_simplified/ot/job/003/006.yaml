translation:
  language: en
  text: That night—let darkness seize it. Let it not rejoice[a] among the days of the year. Let it not be counted among the months.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “let it not be joined to the days of the year.” The Hebrew verb is rare, and its meaning here is uncertain.
    reason: lexical_alternative
