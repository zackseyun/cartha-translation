translation:
  language: en
  text: As for that night, let darkness seize it. Let it not rejoice[a] among the days of the year or be counted among the months.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “let it not be joined to the days of the year.” The Hebrew verb is rare, and its meaning here is debated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let it not enter into the number of the months
  simplified_phrase: or be counted among the months
  preserved_meaning: The night is excluded from the calendar while the source's counting image remains.
  reasoning_layer_used: POB lexical decision for בְּמִסְפַּר יְרָחִים and אַל יָבֹא
  rationale: “Be counted among” expresses inclusion in a reckoning more naturally than “enter into the number.”
- pob_phrase: let it not rejoice among the days of the year; let it not enter
  simplified_phrase: Let it not rejoice among the days of the year or be counted
  preserved_meaning: The two parallel wishes both call for the night's exclusion from the yearly cycle.
  reasoning_layer_used: POB translation and lexical rationales
  rationale: Joining the parallel clauses with “or” makes the sentence easier to follow without merging their distinct images.
