simplification_decisions:
- pob_phrase: For now I would have lain down and been quiet
  simplified_phrase: For by now I would have lain down and been quiet.
  preserved_meaning: Job describes the completed quiet repose he would already have experienced if he had died at birth.
  reasoning_layer_used: Lexical decisions for עַתָּה, שָׁכַבְתִּי, and וְאֶשְׁקֹט
  rationale: “By now” clarifies the present result of the past counterfactual while keeping lying down and being quiet distinct.
- pob_phrase: I would have slept—then I would have been at rest
  simplified_phrase: I would have slept; then I would have been at rest.
  preserved_meaning: The poetic sequence moves from sleep to rest without explicitly defining death.
  reasoning_layer_used: Theological decision on death imagery and lexical decisions for יָשַׁנְתִּי and יָנוּחַ לִי
  rationale: Two direct clauses preserve the images and their sequence in clear English.
translation_notes:
  risk_flags:
  - risk: Readers may understand “slept” as ordinary sleep rather than poetic death imagery.
    mitigation: The wording preserves the intentional image and theological tension retained by the POB.
