- pob_phrase: and the night that said
  simplified_phrase: and may the night that announced
  preserved_meaning: The night is personified as proclaiming the conception and is also cursed.
  reasoning_layer_used: POB lexical decision for אָמַר and Hebrew poetic parallelism
  rationale: “Announced” clarifies the personification, while repeating “may” makes the parallel curse easy to follow.
- pob_phrase: “A male child has been conceived.”
  simplified_phrase: “A male child has been conceived,” perish too.
  preserved_meaning: The conception is complete, the child is male, and the night of conception shares the day’s fate.
