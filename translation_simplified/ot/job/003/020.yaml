translation:
  language: en
  text: Why is light given to those who suffer, and life to those whose souls are bitter?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Why does he give light to those who suffer, and life to those whose souls are bitter?” The Hebrew does not name the giver, though the context likely points to God.
    reason: alternative_reading
  - marker: b
    text: “Light” is a poetic image for continuing to live.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to the troubled
  simplified_phrase: to those who suffer
  preserved_meaning: The people in view are experiencing painful misery, not ordinary work or worry.
  reasoning_layer_used: Lexical decision for לְעָמֵל and Job’s lament context
  rationale: The verbal phrase communicates misery more directly in common English.
- pob_phrase: the bitter in soul
  simplified_phrase: those whose souls are bitter
  preserved_meaning: Deep bitterness affects their inner selves.
  reasoning_layer_used: Lexical decision for לְמָרֵי נָפֶשׁ
  rationale: The natural clause keeps both the bitterness and the important word “souls.”
- pob_phrase: is light given
  simplified_phrase: is light given
  preserved_meaning: Continued existence is pictured as light, while the giver remains unnamed.
  reasoning_layer_used: Lexical and theological decisions for יִתֵּן and אוֹר
  rationale: This wording is already clear and preserves the verse’s image and tension.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “light” only as physical illumination.
    mitigation: Footnote b explains the poetic image without removing it from the text.
  - risk: The passive wording may obscure that God is likely the implied giver.
    mitigation: Footnote a presents the active alternative while preserving the Hebrew ambiguity.
