  simplified_phrase: Why is light given ...? Why is life given ...?
  preserved_meaning: Both parts ask why suffering people continue to receive life.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Splitting the parallel lines into two questions makes the lament easier to follow without resolving its tension.
- pob_phrase: to one in misery
  simplified_phrase: to those in misery
  preserved_meaning: The recipients are people undergoing severe distress.
  reasoning_layer_used: POB lexical decision for לְעָמֵל
  rationale: The plural creates natural English parallelism with the second line while keeping the same general reference.
- pob_phrase: those bitter in soul
  simplified_phrase: those who are bitter deep within
  preserved_meaning: Their bitterness affects their inner selves, not merely their outward mood.
  reasoning_layer_used: POB lexical rationale for לְמָרֵי נָפֶשׁ
  rationale: “Deep within” communicates the Hebrew idiom in common English while preserving its emotional depth.
