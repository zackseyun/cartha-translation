translation:
  language: en
  text: How much less will God answer when you say that you cannot see him? Yet your case is before him, so wait for him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew verb is difficult. It is commonly understood as “wait for him,” but it can also mean “writhe,” “whirl,” or “tremble.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: How much less when you say, “You do not see him.”
  simplified_phrase: How much less will God answer when you say that you cannot see him?
  preserved_meaning: Elihu argues that Job's claim not to perceive God gives him even less reason to expect an answer.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: Supplying “will God answer” completes the comparison from the previous verse, while indirect speech makes Job's complaint natural in English.
- pob_phrase: Your case is before him
  simplified_phrase: Yet your case is before him
  preserved_meaning: God still has Job's legal cause before him for judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Yet” clearly marks the contrast between God's hiddenness and his awareness of Job's case.
interpretive_expansions:
- pob_phrase: How much less when
  rendering: How much less will God answer when
  claim: The comparison carries forward the idea of God answering from the preceding context.
  evidence:
  - The POB lexical rationale explicitly describes the argument as whether God will answer.
  - Job 35:13 supplies the comparison on which “how much less” depends.
  confidence: high
  alternatives_preserved:
  - How much less when
translation_notes:
  risk_flags:
  - risk: “Cannot see” may sound like physical inability rather than God's present hiddenness.
    mitigation: The surrounding reference to Job's case and waiting for God keeps the intended relational setting.
  - risk: The rare final Hebrew verb may not mean “wait.”
    mitigation: The footnote preserves its concrete alternative senses and the uncertainty.
