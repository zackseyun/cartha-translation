translation:
  language: en
  text: For you say, “What good does it do you? What do I gain by doing right rather than by sinning?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is brief and may also be rendered, “What do I gain more than from my sin?” The question compares the benefit of doing right with that of sinning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: What benefit is it to you?
  simplified_phrase: What good does it do you?
  preserved_meaning: The question still asks what benefit or advantage results, without identifying what “it” refers to.
  reasoning_layer_used: Lexical decision for יִסְכָּן לָךְ and theological decision to preserve ambiguity
  rationale: The common expression is easier to understand while keeping the second-person address and its unclear referent.
- pob_phrase: What do I gain more than by sinning?
  simplified_phrase: What do I gain by doing right rather than by sinning?
  preserved_meaning: Elihu presents Job as comparing the personal benefit of righteousness with that of sinning.
  reasoning_layer_used: Lexical rationale for comparative מִן and POB footnote
  rationale: Stating both sides makes the Hebrew’s compressed comparison clear without making sin the source of gain.
interpretive_expansions:
- pob_phrase: more than by sinning
  rendering: by doing right rather than by sinning
  claim: The unstated contrasting course is righteous conduct.
  evidence:
  - The POB footnote says the question compares gain from righteousness with gain from sinning.
  - The preceding context concerns Job’s claim of righteousness.
  confidence: high
  alternatives_preserved:
  - What do I gain more than from my sin?
translation_notes:
  risk_flags:
  - risk: Readers may assume that “you” clearly refers to God or to Job, though the POB leaves its referent unresolved.
    mitigation: The text retains the bare pronoun and does not name its referent.
