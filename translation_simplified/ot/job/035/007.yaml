translation:
  language: en
  text: If you do what is right, what do you give him[a]? What does he receive from your hand?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” refers to God. Elihu’s point is that human righteousness adds nothing to God.
    reason: cross_reference
simplification_decisions:
- pob_phrase: If you are righteous
  simplified_phrase: If you do what is right
  preserved_meaning: The condition concerns a person being morally right or righteous.
  reasoning_layer_used: Lexical decision for צָדַקְתָּ and the immediate context of Job 35:6–8.
  rationale: The wording explains “righteous” in ordinary English without weakening its moral force.
- pob_phrase: what do you give to him?
  simplified_phrase: what do you give him?
  preserved_meaning: The question asks what benefit a righteous person gives to God.
  reasoning_layer_used: Lexical decision for לוֹ and English indirect-object syntax.
  rationale: Removing “to” makes the question more natural while preserving the same relation.
- pob_phrase: what does he take from your hand?
  simplified_phrase: What does he receive from your hand?
  preserved_meaning: God gains nothing from what a righteous person possesses or does.
  reasoning_layer_used: Lexical alternative for יִקָּח and the preserved hand image.
  rationale: “Receive” makes the intended sense clearer while keeping the concrete image of the hand.
translation_notes:
  risk_flags:
  - risk: Replacing “righteous” with “do what is right” may sound more behavioral than the Hebrew state of being righteous.
    mitigation: The conditional wording and footnote retain the verse’s moral and theological point.
  - risk: The pronoun “him” may be unclear when the verse is read alone.
    mitigation: The anchored footnote identifies God while the main text preserves the Hebrew pronoun.
