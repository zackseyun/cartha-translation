simplification_decisions:
- pob_phrase: Will your empty talk make men keep silent
  simplified_phrase: Will your empty talk silence people?
  preserved_meaning: Zophar asks whether Job’s speech can cause people to remain silent.
  reasoning_layer_used: Lexical decisions for בַּדֶּיךָ, מְתִים, and יַחֲרִישׁו.
  rationale: “Silence people” expresses the causative force in direct, natural English.
- pob_phrase: when you mock, will no one shame you?
  simplified_phrase: When you mock, will no one put you to shame?
  preserved_meaning: Zophar asks whether Job’s mockery will go unanswered by a shaming response.
  reasoning_layer_used: Lexical decisions for וַתִּלְעַג and מַכְלִם.
  rationale: “Put you to shame” clearly preserves the Hebrew expression’s interpersonal force.
