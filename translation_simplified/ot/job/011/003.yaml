translation:
  language: en
  text: Will your empty talk[a] make people stay silent? When you mock, will no one put you to shame?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Empty talk” may also mean boasts or babbling; the Hebrew can describe idle, boastful, or false speech.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Will your empty talk silence people
  simplified_phrase: Will your empty talk make people stay silent?
  preserved_meaning: Zophar directly asks whether Job’s speech will cause others to remain silent.
  reasoning_layer_used: Hebrew lexical decision and poetic context
  rationale: The expanded causative is easier to understand without shifting the question to Job’s private belief.
- pob_phrase: will no one shame you?
  simplified_phrase: will no one put you to shame?
  preserved_meaning: Zophar asks whether Job’s mocking will go unanswered by disgrace.
  reasoning_layer_used: Hebrew lexical decision
  rationale: “Put you to shame” is natural modern English and retains the interpersonal force.
translation_notes:
  risk_flags:
