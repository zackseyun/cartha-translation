translation:
  language: en
  text: If God passes by, shuts someone in, and calls people together,[a] who can make him turn back?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “gathers” or “convenes,” perhaps in a court setting.
    reason: lexical_alternative
  - marker: b
    text: Or, “who can reverse what he has done?”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: calls an assembly
  simplified_phrase: calls people together
  preserved_meaning: God causes people to gather, possibly for judgment.
  reasoning_layer_used: Lexical decision for וְיַקְהִיל and footnote b
  rationale: The clearer phrase preserves the act of convening without requiring readers to infer who assembles.
- pob_phrase: can turn him back
  simplified_phrase: can make him turn back
  preserved_meaning: No one can hinder or reverse God's action.
  reasoning_layer_used: Lexical and theological decisions for יְשִׁיבֶנּוּ
  rationale: The recast wording is more natural while retaining the source image of making someone return.
interpretive_expansions:
- pob_phrase: he
  rendering: God
  claim: God is the subject of the actions in this verse.
  evidence:
