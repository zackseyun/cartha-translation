  text: But an empty-headed man will become wise only when a wild donkey’s colt is born a man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'This is likely an ironic comparison: such a man becoming wise is as impossible as a wild donkey’s colt being born human.'
