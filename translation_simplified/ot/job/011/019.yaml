translation:
  language: en
  text: You will lie down, and no one will frighten you. Many people will seek your favor.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: none will make you afraid
  simplified_phrase: no one will frighten you
  preserved_meaning: No person will cause Job to feel fear.
  reasoning_layer_used: The lexical decision for מַחֲרִיד identifies someone who causes fear.
  rationale: The active wording is shorter and more natural while keeping the same cause of fear.
- pob_phrase: many will entreat your favor
  simplified_phrase: Many people will seek your favor
  preserved_meaning: A large number of people will appeal to Job for favorable regard.
  reasoning_layer_used: The lexical decision for חִלּוּ פָנֶיךָ selects the idiomatic meaning “seek your favor.”
  rationale: “Seek your favor” clearly expresses the Hebrew idiom without the uncommon verb “entreat.”
- pob_phrase: You will lie down ...; many
  simplified_phrase: You will lie down ... . Many people
  preserved_meaning: Secure rest and the response of many remain distinct poetic statements.
  reasoning_layer_used: The POB translation and lexical decisions preserve both clauses separately.
  rationale: Two sentences make the parallel ideas easier to follow.
translation_notes:
  risk_flags:
  - risk: “Lie down” could be mistaken for merely going to sleep.
    mitigation: The following statement that no one will frighten him preserves the sense of secure rest.
