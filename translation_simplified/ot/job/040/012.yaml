  preserved_meaning: The proud person is to be forcibly reduced from a position of pride.
  reasoning_layer_used: POB lexical decision for הַכְנִיעֵהוּ
  rationale: “Bring them low” makes the pride-and-humiliation contrast clear without suggesting gentle correction.
- pob_phrase: tread down the wicked
