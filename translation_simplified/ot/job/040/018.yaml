  rationale: The added “like” makes the poetic comparison immediately clear while retaining the channel image.
- pob_phrase: his bones are like bars of iron
  simplified_phrase: they are like bars of iron
  preserved_meaning: The second line repeats the bones’ rigid metallic strength.
  reasoning_layer_used: POB lexical decisions and Hebrew parallelism
  rationale: The pronoun removes awkward repetition without merging the two metal images.
- pob_phrase: like castings of iron
