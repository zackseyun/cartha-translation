simplification_decisions:
- pob_phrase: Would you even annul my justice?
  simplified_phrase: Would you really overturn my justice?
  preserved_meaning: God challenges Job for trying to invalidate his just rule or judgment.
  reasoning_layer_used: Lexical decisions for הַאַף and תָּפֵר, with the theological choice to retain judicial language.
  rationale: “Really overturn” conveys the shocked emphasis and invalidating force in familiar English.
- pob_phrase: Would you condemn me so that you may be justified?
  simplified_phrase: Would you declare me guilty so that you could be in the right?
  preserved_meaning: Job cannot establish that he is right by pronouncing God guilty.
  reasoning_layer_used: Lexical decisions for רשע and צדק and the forensic theological rationale.
  rationale: The paired phrases preserve the courtroom contrast without adding an unstated person who declares Job right.
translation_notes:
  risk_flags:
  - risk: “Overturn” may sound less formal than “annul.”
    mitigation: The judicial context and the object “my justice” preserve the sense of invalidation.
