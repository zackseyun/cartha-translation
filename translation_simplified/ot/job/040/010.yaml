  simplified_phrase: dress yourself in majesty and greatness
  preserved_meaning: Job is challenged to take on the elevated grandeur that belongs to God.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Dress yourself” and “greatness” make the regal clothing image clear without implying sinful pride.
- pob_phrase: clothe yourself with splendor and honor
