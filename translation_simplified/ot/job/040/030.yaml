translation:
  language: en
  text: Will traders negotiate a deal for him? Will they divide him up among the merchants?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Will companions feast on him?” The first Hebrew clause is difficult and may not refer to trade.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word is “Canaanites,” but here it likely means “merchants.”
    reason: lexical_alternative
