translation:
  language: en
  text: Will someone argue with the Almighty and correct him? Let the one who disputes with God answer this.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Will the one who finds fault with the Almighty instruct or reprove him?” The Hebrew uses both dispute and correction language.
    reason: lexical_alternative
  - marker: b
    text: Or “answer him.” The Hebrew may refer either to the matter just raised or directly to God.
    reason: lexical_alternative
