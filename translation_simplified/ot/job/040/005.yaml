simplification_decisions:
- pob_phrase: I have spoken once ... twice
  simplified_phrase: I have spoken once ... I have spoken twice
  preserved_meaning: Job refers to his prior speech through the Hebrew once-and-twice parallel.
  reasoning_layer_used: POB lexical decisions for אַחַת, דִּבַּרְתִּי, and וּשְׁתַּיִם
  rationale: Repeating “I have spoken” makes the compressed parallel clear without reducing it to a simple count.
- pob_phrase: and I will not answer
  simplified_phrase: and I will not answer
  preserved_meaning: Job resolves not to reply when the LORD calls on him to answer.
  reasoning_layer_used: POB lexical decision for וְלֹא אֶעֱנֶה and immediate context
  rationale: Keeping “answer” preserves the response dimension that “say no more” alone would lose.
- pob_phrase: and I will add nothing more
  simplified_phrase: and I will say no more
  preserved_meaning: Job resolves not to continue speaking.
  reasoning_layer_used: POB lexical decision and footnote for וְלֹא אוֹסִיף
  rationale: The direct wording clearly expresses what Job will not continue doing.
