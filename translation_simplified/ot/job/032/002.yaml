translation:
  language: en
  text: Then Elihu burned with anger against Job. Elihu was the son of Barakel, a Buzite from the family of Ram. His anger burned because Job claimed that he himself was in the right rather than God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because Job considered himself more righteous than God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Then Elihu son of Barakel the Buzite, from the family of Ram, burned with anger against Job
  simplified_phrase: Then Elihu burned with anger against Job. Elihu was the son of Barakel, a Buzite from the family of Ram.
  preserved_meaning: Elihu’s identity, ancestry, and anger toward Job are all retained.
  reasoning_layer_used: POB lexical decisions and target-style sentence restructuring
  rationale: Splitting the long introduction makes Elihu’s action clear before giving his ancestry.
- pob_phrase: he justified himself
  simplified_phrase: Job claimed that he himself was in the right
  preserved_meaning: Job presented himself as the party who was right.
  reasoning_layer_used: POB lexical and theological decisions on צַדְּקוֹ נַפְשׁוֹ
  rationale: Common wording conveys the forensic sense of self-justification without using a technical term.
- pob_phrase: his anger burned because
  simplified_phrase: His anger burned because
  preserved_meaning: The repeated Hebrew image emphasizes Elihu’s intense anger and its cause.
  reasoning_layer_used: POB lexical decision on חָרָה אַפּוֹ
  rationale: The burning image and deliberate repetition remain because both carry emphasis.
translation_notes:
  risk_flags:
  - risk: “In the right” may sound less formally forensic than “justified.”
    mitigation: “Claimed” preserves the sense that Job was presenting a case for himself.
  - risk: The difficult comparison with God could be read more strongly as moral superiority.
    mitigation: The main text keeps “rather than God,” while the stronger reading remains in the footnote.
