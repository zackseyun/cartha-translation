translation:
  language: en
  text: Then Elihu son of Barakel the Buzite answered, “I am young, and you are much older. So I held back, afraid to tell you what I know.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: answered and said
  simplified_phrase: answered
  preserved_meaning: Elihu begins his response in the dialogue.
  reasoning_layer_used: POB lexical decisions for וַיַּעַן and וַיֹּאמַר
  rationale: English does not need both speech verbs in this introduction.
- pob_phrase: I am young in days, and you are aged
  simplified_phrase: I am young, and you are much older
  preserved_meaning: Elihu contrasts his youth with the advanced age of his hearers.
  reasoning_layer_used: POB lexical decisions and cultural note for צָעִיר אֲנִי לְיָמִים and יְשִׁישִׁים
  rationale: The Hebrew age idiom is expressed in immediate, natural English.
- pob_phrase: therefore I was timid and afraid to declare my knowledge to you
  simplified_phrase: So I held back, afraid to tell you what I know
  preserved_meaning: Their greater age made Elihu hesitate fearfully before sharing his understanding.
