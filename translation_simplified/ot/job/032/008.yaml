translation:
  language: en
  text: But there is a spirit within a human being,[a] and the breath of the Almighty gives people understanding.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Surely there is a spirit within a person, and the breath of the Almighty gives that person understanding.” Hebrew shifts from one human being to people in general.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in man
  simplified_phrase: within a human being
  preserved_meaning: The spirit exists within mortal humanity.
  reasoning_layer_used: lexical decision for בֶאֱנוֹשׁ and theological decision on representative humanity
  rationale: “Human being” communicates the generic sense of “man” more clearly to modern readers.
- pob_phrase: gives them understanding
  simplified_phrase: gives people understanding
  preserved_meaning: The Almighty enables human beings to understand.
  reasoning_layer_used: lexical decision for תְּבִינֵם and theological decision on the number shift
  rationale: “People” makes the plural pronoun’s general human referent clear without changing its number.
interpretive_expansions:
- pob_phrase: them
  rendering: people
  claim: The plural object refers generally to human beings.
  evidence:
  - The POB theological rationale identifies the plural as people in general.
  - The Hebrew shifts from singular “human being” to a plural object.
  confidence: high
  alternatives_preserved:
  - that person
