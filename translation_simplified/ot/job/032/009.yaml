- pob_phrase: nor the old who understand justice
  simplified_phrase: and old age does not guarantee that people understand justice
  preserved_meaning: Age by itself does not ensure moral and judicial understanding.
  reasoning_layer_used: POB lexical decisions for וּזְקֵנִים, יָבִינוּ, and מִשְׁפָּט
