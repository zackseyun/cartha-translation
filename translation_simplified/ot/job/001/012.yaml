translation:
  language: en
  text: Yahweh said to the Accuser,[a] “Look, everything Job owns is in your hand. But you must not lay a hand on Job himself.” Then the Accuser left Yahweh’s presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Satan” or “the adversary.” The Hebrew uses a title for this figure.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all that he has
  simplified_phrase: everything Job owns
  preserved_meaning: The Accuser receives authority over all of Job’s possessions.
  reasoning_layer_used: Lexical decision for כָל אֲשֶׁר לוֹ and immediate context
  rationale: Naming Job clarifies the pronoun without changing its referent.
- pob_phrase: is in your hand
  simplified_phrase: is in your hand
  preserved_meaning: Job’s possessions are placed under the Accuser’s power.
  reasoning_layer_used: Lexical decision for בְּיָדֶךָ and grounding review
  rationale: The singular wording preserves the repeated hand image and its sense of control.
- pob_phrase: only against him do not stretch out your hand
  simplified_phrase: But you must not lay a hand on Job himself
  preserved_meaning: The Accuser may act against Job’s possessions but not Job personally.
  reasoning_layer_used: Lexical decisions for רַק, אֵלָיו, and אַל תִּשְׁלַח יָדֶךָ
  rationale: This natural prohibition keeps the hand image and clearly states the limit.
interpretive_expansions:
- pob_phrase: he ... him
  rendering: Job ... Job himself
  claim: Both pronouns refer to Job, and the prohibition distinguishes Job personally from his possessions.
  evidence:
  - The immediate context identifies Job as the person under discussion.
  - The clause contrasts everything Job owns with action against Job himself.
  confidence: high
  alternatives_preserved:
  - he ... him
translation_notes:
  risk_flags:
  - risk: “The Accuser” could be mistaken for a personal name rather than a title.
    mitigation: The footnote gives title-based alternatives and notes the Hebrew usage.
