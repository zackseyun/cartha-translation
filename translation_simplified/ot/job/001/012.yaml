translation:
  language: en
  text: Yahweh said to the Accuser[a], “Look, everything he owns is in your hand, but you must not lay a hand on him.” Then the Accuser left Yahweh’s presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Satan” or “the adversary.” The Hebrew presents this as a title or role.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all that he has is in your hand
  simplified_phrase: everything he owns is in your hand
  preserved_meaning: All Job’s possessions are under the Accuser’s control.
  reasoning_layer_used: POB lexical decisions for כָל אֲשֶׁר לוֹ and בְּיָדֶךָ
  rationale: This clarifies what Job has while preserving the singular hand image.
- pob_phrase: only against him do not stretch out your hand
  simplified_phrase: but you must not lay a hand on him
  preserved_meaning: The Accuser may target Job’s possessions but may not harm Job himself.
  reasoning_layer_used: POB lexical decisions for רַק, אֵלָיו, and אַל תִּשְׁלַח יָדֶךָ
  rationale: This familiar idiom preserves the prohibition and repeated hand image.
- pob_phrase: went out from the presence of Yahweh
  simplified_phrase: left Yahweh’s presence
  preserved_meaning: The Accuser departed from the heavenly court before Yahweh.
  reasoning_layer_used: POB lexical decision for וַיֵּצֵא and מֵעִם פְּנֵי יְהוָה
  rationale: The shorter wording expresses the same departure naturally.
translation_notes:
  risk_flags:
  - risk: “Lay a hand on him” could be read as forbidding mere touch rather than harm.
    mitigation: The contrast with authority over Job’s possessions makes hostile action clear.
