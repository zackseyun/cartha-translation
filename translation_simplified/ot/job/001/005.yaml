translation:
  language: en
  text: Whenever a round of feasting ended, Job would send for his children and consecrate them, setting them apart as holy before God. Early the next morning, he would offer one burnt offering for each of them. Job thought, “Perhaps my sons have sinned and cursed God in their hearts.” Job did this regularly.
