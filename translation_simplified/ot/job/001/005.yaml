  preserved_meaning: The customary action followed each completed cycle of family feasts.
  reasoning_layer_used: POB translation and source clause
  rationale: The rewrite expresses the recurring feast cycle in ordinary English.
- pob_phrase: send and consecrate them
  simplified_phrase: send for his children and consecrate them, setting them apart as holy before God
  preserved_meaning: Job summoned his children and consecrated them.
  reasoning_layer_used: Immediate context and POB wording
  rationale: The added gloss explains the retained biblical term without specifying an unsupported ritual.
- pob_phrase: Thus Job would do all the time
  simplified_phrase: Job did this regularly
  preserved_meaning: This was Job’s continuing customary practice.
  reasoning_layer_used: POB translation and applied revision
  rationale: Regularly gives the natural English sense of repeated practice.
