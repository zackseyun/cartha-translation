translation:
  language: en
  text: Job’s sons regularly held feasts, each in his own home on his own day.[a] They sent invitations to their three sisters to come and eat and drink with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “on his day.” This may mean each son’s appointed day or possibly his birthday.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: His sons would go and hold a feast
  simplified_phrase: Job’s sons regularly held feasts
  preserved_meaning: The sons repeatedly held celebratory meals.
  reasoning_layer_used: Lexical decision for וְהָלְכוּ and וְעָשׂוּ מִשְׁתֶּה
  rationale: “Regularly” expresses the customary past action more directly for modern readers.
- pob_phrase: they would send and invite
  simplified_phrase: They sent invitations
  preserved_meaning: The brothers sent a message inviting their sisters.
  reasoning_layer_used: Lexical decision for וְשָׁלְחוּ וְקָרְאוּ
  rationale: The natural phrase preserves both sending and inviting without awkward repetition.
- pob_phrase: to eat and drink with them
  simplified_phrase: to come and eat and drink with them
  preserved_meaning: The sisters were invited to participate in the feast with their brothers.
  reasoning_layer_used: Lexical decisions for לֶאֱכֹל וְלִשְׁתּוֹת and עִמָּהֶם
  rationale: “Come” makes the invitation to shared participation clear without changing its content.
