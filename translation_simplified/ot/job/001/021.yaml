translation:
  language: en
  text: He said, “I came from my mother’s womb naked, and I will return there naked.[a] Yahweh[b] gave, and Yahweh has taken away. May Yahweh’s name be blessed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “there” but does not specify whether this means the womb figuratively, the earth or grave, or the state of having nothing.
    reason: alternative_reading
  - marker: b
    text: Yahweh is God’s personal name, written YHWH in Hebrew and traditionally rendered “the LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: Naked I came out from my mother’s womb
  simplified_phrase: I came from my mother’s womb naked
  preserved_meaning: Job entered life unclothed and possessing nothing.
  reasoning_layer_used: POB lexical decisions for עָרֹם and מִבֶּטֶן אִמִּי
  rationale: Ordinary English word order makes the birth image easier to grasp.
- pob_phrase: and naked I will return there
  simplified_phrase: and I will return there naked
  preserved_meaning: Job will leave life as empty-handed as he entered it, while the destination remains unstated.
  reasoning_layer_used: POB theological decision on שָׁמָה
  rationale: The recast clause reads naturally without resolving what “there” means.
- pob_phrase: May the name of Yahweh be blessed
  simplified_phrase: May Yahweh’s name be blessed
  preserved_meaning: Job calls for blessing to be directed toward Yahweh’s name.
  reasoning_layer_used: POB lexical decisions for שֵׁם יְהוָה and מְבֹרָךְ
  rationale: The possessive form is clearer while retaining the biblical concepts of name and blessing.
