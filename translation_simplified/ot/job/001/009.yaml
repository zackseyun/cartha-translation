translation:
  language: en
  text: Then the Accuser[a] replied to Yahweh, “Does Job fear God for nothing?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “the Satan” or “the adversary.” Here the expression is a title describing his role as the Accuser.'
    reason: alternative_reading
  - marker: b
    text: Or “without cause” or “for no reason.” The Accuser is asking whether Job fears God without gaining anything from it.
    reason: lexical_alternative
