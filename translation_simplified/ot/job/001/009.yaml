  preserved_meaning: The expression remains a role-based title rather than a personal name.
  reasoning_layer_used: POB lexical and theological decisions for הַשָּׂטָן
  rationale: The title is retained because it conveys the judicial and oppositional role in this scene.
- pob_phrase: for nothing
