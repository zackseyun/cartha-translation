translation:
  language: en
  text: Then the Adversary[a] replied to Yahweh, “Does Job fear God without getting anything in return?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Satan.” The Hebrew uses a title meaning “the adversary,” rather than clearly presenting a personal name here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew can also mean “for no reason” or “without cause.” The question is whether Job fears God apart from the benefits he receives.
    reason: lexical_alternative
