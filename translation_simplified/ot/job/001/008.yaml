translation:
  language: en
  text: Yahweh said to the Accuser[a], “Have you paid close attention to my servant Job?[b] No one else on earth is like him. He is a man of integrity who lives rightly, fears God, and turns away from evil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a title meaning “the Accuser,” rather than clearly using “Satan” as a personal name here.
    reason: lexical_alternative
  - marker: b
    text: Literally, “Have you set your heart on my servant Job?”
    reason: source_note
simplification_decisions:
- pob_phrase: Have you set your heart on my servant Job?
  simplified_phrase: Have you paid close attention to my servant Job?
  preserved_meaning: The Accuser has deliberately directed his attention toward Job.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: The common English idiom states the intended action while the footnote preserves the Hebrew heart image.
- pob_phrase: For there is none like him on the earth
  simplified_phrase: No one else on earth is like him.
  preserved_meaning: Job is unmatched in character throughout the earth.
  reasoning_layer_used: POB lexical decision
  rationale: A direct sentence removes the formal clause order without narrowing the universal scope.
- pob_phrase: a blameless and upright man
  simplified_phrase: a man of integrity who lives rightly
  preserved_meaning: Job has moral wholeness and upright conduct, not sinless perfection.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording makes both qualities clear while avoiding the mistaken idea that Job is absolutely sinless.
translation_notes:
  risk_flags:
  - risk: Replacing the heart idiom in the main text could weaken its source-language imagery.
    mitigation: A source note gives the literal image exactly.
  - risk: “Man of integrity who lives rightly” is less terminologically traditional than “blameless and upright.”
    mitigation: The rendering preserves both distinct moral qualities and the POB rejection of sinless perfection.
