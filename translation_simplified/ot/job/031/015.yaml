  language: en
  text: Did not the one who made me in the womb also make him? Did he not form both of us alike in the womb?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “in one womb.” This poetic expression points to their shared human origin, not necessarily the same mother. The Hebrew may also mean, “Did not one form us in the womb?”
