translation:
  language: en
  text: If I have relied on gold and said to pure gold, “You are what keeps me safe,”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: made gold my confidence
  simplified_phrase: relied on gold
  preserved_meaning: Job conditionally denies placing his trust in wealth.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The common phrase “relied on” clearly expresses misplaced confidence without adding doctrine.
- pob_phrase: fine gold
  simplified_phrase: pure gold
  preserved_meaning: The second term refers specifically to refined gold.
  reasoning_layer_used: Lexical decision for כֶּתֶם
  rationale: “Pure gold” makes the distinction from ordinary gold immediately clear.
- pob_phrase: You are my security
  simplified_phrase: You are what keeps me safe
  preserved_meaning: Gold is addressed as the thing trusted to provide safety.
  reasoning_layer_used: Lexical decision for מִבְטַחִי
  rationale: The verbal wording explains “security” in natural everyday English.
translation_notes:
  risk_flags:
  - risk: “Relied on” is less formally distinct from the later idea of security than POB’s “confidence.”
    mitigation: The second clause separately retains the specific idea of being kept safe.
