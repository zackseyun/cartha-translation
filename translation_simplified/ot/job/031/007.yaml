simplification_decisions:
- pob_phrase: my step has turned aside from the way
  simplified_phrase: I have strayed from the way
  preserved_meaning: Job pictures moral failure as leaving the proper path.
  reasoning_layer_used: Lexical and theological decisions on אַשֻּׁרִי and “the way”
  rationale: The personal verb is easier to read while preserving the path metaphor.
- pob_phrase: my heart has followed my eyes
  simplified_phrase: my heart has followed what my eyes saw
  preserved_meaning: Job’s inner desires may have pursued what he saw.
  reasoning_layer_used: Lexical and theological decisions on heart and eyes
  rationale: This clarifies the relationship without making the eyes active guides.
- pob_phrase: any stain has clung to my hands
  simplified_phrase: any stain has stuck to my hands
  preserved_meaning: Moral taint may have attached to Job’s actions.
  reasoning_layer_used: Lexical decisions on דבק and מֻאוּם
  rationale: “Stuck” is more familiar than “clung” and keeps the attachment image.
interpretive_expansions:
- pob_phrase: my heart has followed my eyes
  rendering: my heart has followed what my eyes saw
  claim: The heart pursued the objects of sight rather than being physically led by the eyes.
  evidence:
  - The Hebrew presents the heart as following after the eyes.
  - The POB lexical alternative is “my heart has pursued what my eyes saw.”
  - Job 31:1 connects sight with inward desire.
  confidence: high
  alternatives_preserved:
  - my heart has followed my eyes
translation_notes:
  risk_flags:
  - risk: Changing “my step” to “I” reduces one part of the walking image.
    mitigation: “Strayed from the way” preserves the central path metaphor.
  - risk: “Stain” could be understood as physical dirt.
    mitigation: The integrity-oath context and the image of stained hands indicate moral taint.
