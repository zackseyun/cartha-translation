simplification_decisions:
- pob_phrase: covered my transgressions
  simplified_phrase: covered up my offenses
  preserved_meaning: Job speaks of concealing acts of moral wrongdoing.
  reasoning_layer_used: lexical decisions for כִּסִּיתִי and פְּשָׁעַי
  rationale: “Covered up” preserves the covering image, while “offenses” clearly conveys moral violations.
- pob_phrase: like a man
  simplified_phrase: as people do
  preserved_meaning: The main text retains the generic human reading of אָדָם.
  reasoning_layer_used: theological decision on כְאָדָם
  rationale: The plural wording is natural and avoids an unnecessarily male-specific expression.
- pob_phrase: hiding my iniquity in my bosom
  simplified_phrase: hiding my sin within myself
  preserved_meaning: Job describes keeping his moral wrong concealed within himself.
  reasoning_layer_used: lexical decisions for לִטְמוֹן, בְּחֻבִּי, and עֲוֺנִי
  rationale: This explains the unfamiliar bosom idiom without adding an unsupported sense of depth.
