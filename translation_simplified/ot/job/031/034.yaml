  reasoning_layer_used: POB lexical decision for וּבוּז מִשְׁפָּחוֹת
  rationale: “Scorn” is clearer than “contempt,” while “clans” preserves the ancient social grouping.
- pob_phrase: so that I kept silent
  simplified_phrase: So I kept quiet
  preserved_meaning: Fear caused Job to remain silent rather than act publicly.
  reasoning_layer_used: POB lexical decision for וָאֶדֹּם
  rationale: A new sentence makes the result easier to follow without weakening the sustained silence.
