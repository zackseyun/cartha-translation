translation:
  language: en
  text: For from my youth he raised me with a father’s care,[a] and ever since my mother’s womb I have guided her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; it may instead mean, “I raised him like a father.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew likely refers first to the fatherless person and then to the widow in the previous verse.
    reason: cross_reference
