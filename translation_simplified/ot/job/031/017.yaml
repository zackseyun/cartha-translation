  rationale: This replaces the uncommon “morsel” while preserving its concrete, modest sense.
- pob_phrase: the fatherless
  simplified_phrase: a fatherless child
  preserved_meaning: The person is vulnerable because they have lost their father.
  reasoning_layer_used: Lexical decision for יָתוֹם
