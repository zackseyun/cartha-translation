- pob_phrase: Oh, that I had someone to hear me!
  simplified_phrase: If only someone would hear my case!
  preserved_meaning: Job longs for someone to hear his formal appeal.
  reasoning_layer_used: Lexical decision and forensic context
  rationale: “If only” states the wish naturally, while “my case” clarifies the legal setting.
- pob_phrase: Here is my signature
  simplified_phrase: Here is my signature on my defense
  preserved_meaning: Job presents the mark that attests his declaration.
  reasoning_layer_used: Lexical rationale and forensic context
  rationale: Retaining “Here is” preserves the present act of showing his signature.
- pob_phrase: write out the indictment
  simplified_phrase: state the charges against me in writing
  preserved_meaning: Job demands a written statement of his accuser’s allegations.
  reasoning_layer_used: Lexical decision on סֵפֶר and forensic imagery
  rationale: The wording explains “indictment” in direct, familiar legal language.
