translation:
  language: en
  text: If only someone would hear my case! Here is my signature on my defense.[a] Let the Almighty answer me, and let my accuser state the charges against me in writing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “my mark” or “my sign,” referring to Job’s signature attesting his declaration.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may be read more literally, “and a document the man of my dispute wrote.”
    reason: alternative_reading
