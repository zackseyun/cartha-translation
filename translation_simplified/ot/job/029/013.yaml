simplification_decisions:
- pob_phrase: the perishing man
  simplified_phrase: someone who was perishing
  preserved_meaning: The person was perishing or ruined, without specifying death, poverty, or destruction.
  reasoning_layer_used: POB lexical decision and footnote for אֹבֵד
  rationale: This natural wording preserves the person’s ongoing desperate condition without implying only future or financial ruin.
- pob_phrase: came upon me
  simplified_phrase: came upon me
  preserved_meaning: Job pictures the person’s blessing as coming onto him.
  reasoning_layer_used: POB lexical decisions for עָלַי and תָּבֹא
  rationale: The wording preserves the source image and remains easy to understand.
- pob_phrase: I made the widow’s heart sing for joy
  simplified_phrase: I made the widow’s heart sing for joy
  preserved_meaning: Job caused the widow to rejoice deeply.
  reasoning_layer_used: POB lexical decisions for לֵב, אַלְמָנָה, and אַרְנִן
  rationale: The vivid image is clear and retains the verb’s causative force.
