  rationale: “Rescued” makes the active help clearer, while “poor people” sounds natural in modern English.
- pob_phrase: the fatherless who had no helper
  simplified_phrase: those who had no father and no one to help them
  preserved_meaning: These socially vulnerable people lacked both a father and anyone able to assist them.
