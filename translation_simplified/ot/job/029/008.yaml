translation:
  language: en
  text: When young men saw me, they drew back,[a] and old men rose and remained standing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hid themselves”; here the Hebrew likely describes respectfully moving out of Job’s way.
