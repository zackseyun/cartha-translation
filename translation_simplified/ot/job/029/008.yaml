- pob_phrase: The young men saw me and withdrew
  simplified_phrase: When young men saw me, they drew back
  preserved_meaning: The young men moved away deferentially when they saw Job.
  reasoning_layer_used: POB lexical decisions and footnote
  rationale: “Drew back” gives the likely social sense while the footnote preserves the Hebrew image of hiding.
- pob_phrase: the aged
  simplified_phrase: old men
  preserved_meaning: The group consisted of men advanced in age, not necessarily office-holding elders.
  reasoning_layer_used: POB lexical decision for וִישִׁישִׁים
  rationale: “Old men” is clearer than “the aged” and avoids implying an official position.
- pob_phrase: rose and stood
