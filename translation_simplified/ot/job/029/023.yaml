    mitigation: Job 29:21–22 and the POB rationale directly support it, while “for me” remains in the first sentence.
  - risk: “Eagerly” could sound stronger than the simple verb “waited.”
    mitigation: The lexical rationale and rain comparison support expectant intensity without implying emotional longing.
