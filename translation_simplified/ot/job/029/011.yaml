  preserved_meaning: Anyone who heard of Job responded positively to him.
  reasoning_layer_used: POB lexical decision and Hebrew generic body-part imagery
  rationale: The generic “ear” is recast as the people who heard while retaining the contrast between hearing and seeing.
- pob_phrase: when an eye saw
  simplified_phrase: those who saw me
  preserved_meaning: People who personally saw Job served as witnesses concerning him.
  reasoning_layer_used: POB lexical decision and Hebrew parallelism
  rationale: The generic “eye” becomes natural English without merging sight with hearing.
- pob_phrase: it testified about me
  simplified_phrase: gave favorable testimony about me
  preserved_meaning: What eyewitnesses said about Job was approving rather than merely neutral.
  reasoning_layer_used: POB footnote, applied revision, and immediate parallel
  rationale: “About me” avoids implying legal advocacy, while “favorable” makes the contextual tone clear.
