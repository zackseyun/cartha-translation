translation:
  language: en
  text: For those who heard about me called me blessed, and those who saw me testified in my favor.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when an ear heard
  simplified_phrase: those who heard about me
  preserved_meaning: The generic ear refers to people who heard of Job, without claiming that everyone did.
  reasoning_layer_used: POB lexical decisions for אֹזֶן and שָׁמְעָה
  rationale: Naming the hearers removes unnatural personification while preserving the hearing image.
- pob_phrase: when an eye saw
  simplified_phrase: those who saw me
  preserved_meaning: The generic eye refers to people who observed Job, without adding a universal claim.
  reasoning_layer_used: POB lexical decisions for וְעַיִן and רָאֲתָה
  rationale: Naming the observers makes the parallel clear in natural English.
- pob_phrase: it testified for me
  simplified_phrase: testified in my favor
  preserved_meaning: Those who saw Job gave favorable testimony about him.
  reasoning_layer_used: POB lexical decision for וַתְּעִידֵנִי
  rationale: “In my favor” clearly conveys the positive direction of the testimony.
interpretive_expansions:
- pob_phrase: heard ... saw
  rendering: heard about me ... saw me
  claim: Job is the implied object of both hearing and seeing.
  evidence:
  - The POB rationale identifies the hearers as people who heard of Job.
  - The parallel statements describe favorable responses to Job.
  confidence: high
  alternatives_preserved:
  - heard
  - saw
translation_notes:
  risk_flags:
