translation:
  language: en
  text: 'Job’s three friends heard about all the trouble that had come upon him. Each traveled from where he lived: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite. They planned together to go to him, share his grief, and comfort him.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Share his grief” can also be translated “mourn with him” or “show him sympathy.”
    reason: lexical_alternative
