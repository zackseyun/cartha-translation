translation:
  language: en
  text: 'When Job’s three friends heard about all the trouble that had come into his life, each traveled from his own region: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite. They agreed to come to Job to show him sympathy and comfort him.'
