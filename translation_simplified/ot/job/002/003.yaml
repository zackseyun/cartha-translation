translation:
  language: en
  text: Then Yahweh said to the Accuser[a], “Have you paid close attention to my servant Job?[b] No one else on earth is like him. He is blameless and upright. He fears God and turns away from evil. He still holds firmly to his integrity, even though you incited me against him to swallow him up[c] for nothing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “the Accuser”; traditionally “Satan.”
    reason: alternative_reading
  - marker: b
    text: Literally, “Have you set your heart on my servant Job?”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew image means to overwhelm and ruin him; it may also be translated “destroy him.” “For nothing” can also mean “without cause” and echoes Job 1:9.
    reason: lexical_alternative
