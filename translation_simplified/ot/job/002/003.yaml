  text: Then Yahweh said to the Accuser[b], “Have you set your heart on my servant Job[a]? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity, though you incited me against him to swallow him up[c] for nothing[d].”
  footnotes:
  - marker: a
    text: Or “Have you considered my servant Job?” Literally, “Have you set your heart on my servant Job?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew הַשָּׂטָן, “the Accuser”; traditionally “Satan.”
    reason: alternative_reading
  - marker: c
    text: Or “to destroy him” or “to ruin him.” The Hebrew uses the image of swallowing him up.
    reason: lexical_alternative
  - marker: d
    text: “For nothing” may also mean “without cause,” and likely echoes Job 1:9, where the Accuser asks whether Job fears God “for nothing.”
    reason: cross_reference
