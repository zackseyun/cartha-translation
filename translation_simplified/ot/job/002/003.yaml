  simplified_phrase: Have you paid close attention to my servant Job?
  preserved_meaning: Yahweh asks whether the Accuser has closely considered Job.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The main text gives the idiom’s clear sense while a note preserves its heart image.
- pob_phrase: For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil.
  simplified_phrase: No one else on earth is like him. He is blameless and upright. He fears God and turns away from evil.
  preserved_meaning: Job is uniquely marked by integrity, upright conduct, reverence for God, and rejection of evil.
  reasoning_layer_used: POB lexical decisions for Job’s fourfold description
  rationale: Short sentences clarify each distinct part of Yahweh’s description without merging them.
- pob_phrase: He still holds fast his integrity, though you incited me against him to swallow him up for nothing.
  simplified_phrase: He still holds firmly to his integrity, even though you incited me against him to swallow him up for nothing.
  preserved_meaning: Job remains steadfast despite the Accuser provoking Yahweh to bring overwhelming ruin on him without cause or gain.
  reasoning_layer_used: POB lexical and theological decisions on divine agency, swallowing, and חִנָּם
  rationale: Common connectors clarify the contrast while retaining the direct divine agency, forceful image, and literary echo.
