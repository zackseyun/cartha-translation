translation:
  language: en
  text: Then Yahweh said to the Accuser,[a] “Have you given your full attention to my servant Job?[b] There is no one else like him on earth. He is blameless and does what is right. He fears God and turns away from evil. He still holds firmly to his integrity, even though you incited me against him to swallow him up for nothing.”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “the Accuser”; traditionally “Satan.”
    reason: alternative_reading
  - marker: b
    text: Literally, “Have you set your heart on my servant Job?”
    reason: lexical_alternative
  - marker: c
    text: “Swallow him up” is a vivid Hebrew image meaning to destroy or ruin him.
    reason: lexical_alternative
  - marker: d
    text: “For nothing” may also mean “without cause” and echoes the Accuser’s words in Job 1:9.
    reason: cross_reference
