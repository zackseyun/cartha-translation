  preserved_meaning: Yahweh asks whether the Accuser has closely considered Job.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The natural wording states the idiom’s force while a footnote preserves its heart image.
- pob_phrase: there is no one like him on the earth
  simplified_phrase: There is no one else like him on earth.
  preserved_meaning: Job is uniquely exemplary within the scene’s worldwide scope.
  reasoning_layer_used: POB lexical decision for אֵין כָּמֹהוּ בָּאָרֶץ
  rationale: The shorter sentence keeps the cosmic scope and makes the comparison explicit.
- pob_phrase: a blameless and upright man, one who fears God and turns away from evil
  simplified_phrase: He is blameless and does what is right. He fears God and turns away from evil.
  preserved_meaning: Job has integrity, lives rightly, reveres God, and rejects evil.
  reasoning_layer_used: POB lexical decisions for תָּם, יָשָׁר, יְרֵא, and סָר
  rationale: Two direct sentences preserve each distinct trait without a dense descriptive chain.
