translation:
  language: en
  text: Once again, there was a day when the sons of God[a] appeared before Yahweh. The Adversary[b] also came among them and appeared before Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of God”; this may mean heavenly beings or members of the divine council.
    reason: lexical_alternative
  - marker: b
    text: Or “Satan.” Here the Hebrew most likely uses the expression as a title meaning “the adversary” or “the accuser.”
    reason: alternative_reading
