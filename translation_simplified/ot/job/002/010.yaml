translation:
  language: en
  text: But Job answered her, “You are speaking like a woman with no moral sense. Should we accept good things from God but refuse to accept hardship[a]?” In all this, Job did not sin with his lips—he said nothing sinful.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “adversity”; traditionally, “evil.” Here the Hebrew refers to harmful circumstances, not moral evil.
    reason: lexical_alternative
