    mitigation: The objects “bones and flesh” and the testing context retain its harmful force without replacing the source image.
  - risk: Rendering the Hebrew euphemism as “curse” hides its literal wording.
    mitigation: The footnote preserves the literal “bless” and explains the contextual meaning.
