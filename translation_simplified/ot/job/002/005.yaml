simplification_decisions:
- pob_phrase: stretch out your hand, please
  simplified_phrase: please reach out your hand
  preserved_meaning: Satan asks God to act directly against Job.
  reasoning_layer_used: Lexical decision for שְׁלַח נָא and יָדְךָ
  rationale: Natural English word order keeps both the request and the hand image.
- pob_phrase: his bone and his flesh
  simplified_phrase: his bones and flesh
  preserved_meaning: The attack is directed against Job’s physical body without reducing the concrete image to “body.”
  reasoning_layer_used: Lexical decision for אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  rationale: The English plural sounds natural while preserving the Hebrew images of bone and flesh.
- pob_phrase: one continuous sentence
  simplified_phrase: two sentences
  preserved_meaning: Satan first proposes the test and then confidently predicts Job’s response.
  reasoning_layer_used: POB syntax and lexical decision for אִם לֹא
  rationale: The sentence break makes the proposal and prediction easier to follow.
translation_notes:
  risk_flags:
