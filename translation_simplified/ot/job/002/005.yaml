translation:
  language: en
  text: But please reach out your hand and touch his bones and flesh. He will surely curse you to your face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “bless you,” but here it is a reverent substitute for “curse you.”
