  preserved_meaning: The singular man is characterized by strength or power.
  reasoning_layer_used: POB lexical decision for זְרוֹעַ
  rationale: “Powerful” clearly conveys the idiom “man of arm” while retaining the singular form.
- pob_phrase: the land belonged to
