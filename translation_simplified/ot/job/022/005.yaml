translation:
  language: en
  text: Isn't your wickedness[a] great? Is there no end to your sins?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “your evil.” The Hebrew can mean “your calamity” elsewhere, but here its parallel with “your sins” points to moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is not your evil abundant
  simplified_phrase: Isn't your wickedness great
  preserved_meaning: Eliphaz accuses Job of extensive moral evil in a rhetorical question.
  reasoning_layer_used: Lexical and theological decisions on רָעָתְךָ and רַבָּה.
  rationale: “Wickedness” makes the moral sense clear, while “great” is more natural than “abundant.”
- pob_phrase: and there is no end to your iniquities?
  simplified_phrase: Is there no end to your sins?
  preserved_meaning: Eliphaz accuses Job of offenses so numerous that they seem limitless.
  reasoning_layer_used: Lexical decisions on וְאֵין, קֵץ, and לַעֲוֺנֹתֶיךָ.
  rationale: A separate question and the common word “sins” make the accusation immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Wickedness” is narrower than the POB’s “evil.”
    mitigation: The footnote preserves the broader literal wording and explains why the moral sense controls.
  - risk: “Sins” does not explicitly convey the possible guilt nuance of עָוֹן.
    mitigation: The context emphasizes Job’s alleged moral offenses, and POB lists “sins” as an acceptable rendering.
