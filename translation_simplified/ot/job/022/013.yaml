translation:
  language: en
  text: Yet you say, “What does God know? How can he judge[a] when thick darkness[b] stands in the way?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “How does he judge?” The Hebrew can refer either to ability or to present action here.
    reason: alternative_reading
  - marker: b
