simplification_decisions:
- pob_phrase: decree a matter
  simplified_phrase: make a firm decision
  preserved_meaning: A resolved pronouncement is made without implying royal authority.
  reasoning_layer_used: lexical decisions for תִגְזַר and אֹמֶר
  rationale: The wording keeps the firmness of “decree” in natural modern English.
- pob_phrase: it will be established for you
  simplified_phrase: it will take effect for you
  preserved_meaning: The decision will become effective on the speaker’s behalf.
  reasoning_layer_used: lexical decision for יָקָם לָךְ
  rationale: “Take effect” states the result more plainly without making it an absolute guarantee.
- pob_phrase: light will shine on your ways
  simplified_phrase: Light will shine on the paths you take
  preserved_meaning: The poetic image presents one’s course of life as illuminated paths.
  reasoning_layer_used: lexical decisions for דְּרָכֶיךָ and נָגַהּ אֹור
  rationale: The recasting keeps the light-and-path image while making “ways” immediately clear.
