  text: Then the Almighty will be your gold[a] and your finest silver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Then the Almighty will be your treasure, and you will have abundant silver.” The Hebrew may describe God as your true treasure or may emphasize wealth supplied by God.
