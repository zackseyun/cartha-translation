  preserved_meaning: The person must remove moral wrong and not allow it near the household.
  reasoning_layer_used: POB lexical decisions on רחק and עַוְלָה
  rationale: “Keep wrongdoing far from” expresses the causative image more naturally than “put unrighteousness far from.”
- pob_phrase: your tent
