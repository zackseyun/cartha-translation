translation:
  language: en
  text: He rescues even someone who is not innocent.[a] That person will be rescued because your hands are clean.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He rescues the innocent person.” The Hebrew line is difficult and can be understood in different ways.
    reason: alternative_reading
  - marker: b
    text: Clean hands are an image of innocence and moral purity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He delivers even one who is not innocent
  simplified_phrase: He rescues even someone who is not innocent
  preserved_meaning: God’s deliverance extends even to a person who lacks innocence.
  reasoning_layer_used: Lexical and theological decisions on יְמַלֵּט, אִי, and נָקִי
  rationale: “Rescues” and “someone” make the difficult line more immediate without changing the chosen reading.
- pob_phrase: and he will be delivered
  simplified_phrase: That person will be rescued
  preserved_meaning: The person just mentioned is the one who receives deliverance.
  reasoning_layer_used: Lexical decision on וְנִמְלַט and contextual parallelism
  rationale: The repeated noun phrase removes an unclear pronoun while preserving the passive rescue.
- pob_phrase: through the cleanness of your hands
  simplified_phrase: because your hands are clean
  preserved_meaning: The rescue occurs through the addressee’s innocence or moral purity.
  reasoning_layer_used: Lexical decisions on בְּבֹר and כַּפֶּיךָ
  rationale: The natural causal wording retains the Hebrew image of clean hands.
interpretive_expansions:
- pob_phrase: he will be delivered
  rendering: That person will be rescued
  claim: The second line refers back to the person who is not innocent.
  evidence:
  - The two forms of the same rescue verb create a close parallel between the lines.
  - The POB theological rationale identifies the non-innocent person as the one delivered through Job’s purity.
  confidence: high
translation_notes:
  risk_flags:
