simplification_decisions:
- pob_phrase: took pledges
  simplified_phrase: took your brothers’ property as security for a debt
  preserved_meaning: Job is accused of taking collateral from others.
  reasoning_layer_used: Lexical decision for תַחְבֹּל and its HALOT rationale.
  rationale: This explains the unfamiliar financial sense of “pledges” in ordinary English.
- pob_phrase: for no reason
  simplified_phrase: For no good reason
  preserved_meaning: The seizure was unjustified, not merely unpaid.
  reasoning_layer_used: Lexical decision for חִנָּם.
  rationale: “No good reason” clearly preserves the accusation’s moral force.
- pob_phrase: stripped the clothing from the naked
  simplified_phrase: stripped the clothes from people who had too little clothing
  preserved_meaning: Job is accused of depriving people who were already poorly clothed.
  reasoning_layer_used: Lexical decisions for עֲרוּמִּים and תַּפְשִׁיט.
  rationale: The wording avoids a physical paradox while preserving the severe image of deprivation.
