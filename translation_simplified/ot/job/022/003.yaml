  reasoning_layer_used: Lexical decision
  rationale: A second direct question makes the parallel easier to follow.
- pob_phrase: you make your ways blameless
  simplified_phrase: you make the way you live blameless
  preserved_meaning: The phrase still describes making one’s conduct morally blameless.
  reasoning_layer_used: Lexical phrase decision
  rationale: The wording explains that “ways” refers to how a person lives.
