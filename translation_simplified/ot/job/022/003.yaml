translation:
  language: en
  text: Does it give the Almighty any pleasure when you are righteous? Does he gain anything when you make your conduct blameless?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Is it any pleasure to the Almighty
  simplified_phrase: Does it give the Almighty any pleasure
  preserved_meaning: The rhetorical question asks whether human righteousness gives God pleasure or benefit.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The active question is easier to follow while preserving Eliphaz’s rhetorical force.
- pob_phrase: or any gain
  simplified_phrase: Does he gain anything
  preserved_meaning: The economic image of profit or advantage to God remains explicit.
  reasoning_layer_used: POB lexical decision for בֶּצַע
  rationale: A separate question makes the parallel argument clearer.
- pob_phrase: you make your ways blameless
  simplified_phrase: you make your conduct blameless
  preserved_meaning: The phrase still describes making one’s manner of life morally blameless.
  reasoning_layer_used: POB lexical decisions for תמם and דֶּרֶךְ
  rationale: Conduct states the metaphorical meaning of ways in common English.
translation_notes:
  risk_flags:
  - risk: The first question could be read as a universal denial that God delights in righteousness.
    mitigation: The wording preserves Eliphaz’s claim without extending it beyond his argument.
