  preserved_meaning: The gold is placed in the dust rather than treated as treasure.
  reasoning_layer_used: POB lexical decision and theological context
  rationale: “Put” is common English and does not overstate the manner of placing the gold.
- pob_phrase: and the gold of Ophir among the rocks
  simplified_phrase: and put the gold of Ophir among the rocks
  preserved_meaning: The same command applies even to prized gold from Ophir.
  reasoning_layer_used: POB lexical decision and poetic parallel
  rationale: Repeating “put” makes the parallel clause immediately clear.
- pob_phrase: rocks of the streambeds
