- pob_phrase: Can one who hates justice govern?
  simplified_phrase: Can anyone who hates justice rule?
  preserved_meaning: A person opposed to justice cannot rightly exercise authority.
  reasoning_layer_used: Lexical decision for יַחֲבֹשׁ and the rhetorical force of הַאַף
  rationale: “Anyone” and “rule” make the rhetorical question more natural without weakening it.
- pob_phrase: the righteous and mighty One
  simplified_phrase: the One who is righteous and mighty
  preserved_meaning: Both descriptions apply to the same divine referent.
  reasoning_layer_used: Source audit and theological decision on צַדִּיק כַּבִּיר
  rationale: The relative clause clearly shows that “righteous” and “mighty” both describe one person.
