  preserved_meaning: A person opposed to justice cannot rightly exercise authority.
  reasoning_layer_used: Lexical decisions for הַאַף, מִשְׁפָּט, and יַחֲבֹשׁ
  rationale: “How could” makes the emphatic rhetorical question clear, while “rule” preserves the contextual sense of governing.
- pob_phrase: will you condemn
  simplified_phrase: will you declare ... guilty
  preserved_meaning: The hearer is challenged not to pronounce the righteous ruler wicked.
  reasoning_layer_used: Lexical decision for תַּרְשִׁיעַ
  rationale: “Declare guilty” states the courtroom meaning of “condemn” in everyday English.
