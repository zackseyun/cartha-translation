  rationale: This states the same moral relationship in common English.
- pob_phrase: he makes him find according to a man's way
  simplified_phrase: he makes him experience what corresponds to the way he has lived
  preserved_meaning: God causes the man to encounter what matches his manner of life.
  reasoning_layer_used: Lexical decisions for יַמְצִאֶנּוּ and אֹרַח
