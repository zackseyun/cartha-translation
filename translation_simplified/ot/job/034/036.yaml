translation:
  language: en
  text: My father,[a] let Job be tested thoroughly, because his answers associate him with wicked men.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “O my father”; the Hebrew literally says “my father,” probably as a direct address.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean that Job answers with or among wicked men, or that he answers like them.
    reason: alternative_reading
