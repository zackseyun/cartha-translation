  language: en
  text: He shatters powerful people without needing an investigation, then replaces them with others.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “without inquiry” or “without searching”; no prolonged examination is needed before God acts.
