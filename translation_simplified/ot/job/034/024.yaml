simplification_decisions:
- pob_phrase: the mighty
  simplified_phrase: powerful people
  preserved_meaning: The verse refers to socially or politically powerful persons.
  reasoning_layer_used: Lexical decision for כַּבִּירִים
  rationale: “Powerful people” is immediately clear without narrowing the group to rulers.
- pob_phrase: without investigation
  simplified_phrase: without needing an investigation
  preserved_meaning: God requires no prolonged inquiry before acting against them.
  reasoning_layer_used: POB footnote and lexical rationale for לֹא חֵקֶר
  rationale: Adding “needing” makes the intended relation to investigation natural in English.
- pob_phrase: sets others in their place
  simplified_phrase: replaces them with others
  preserved_meaning: God removes the powerful and establishes other people instead of them.
  reasoning_layer_used: Lexical decisions for וַיַּעֲמֵד and תַּחְתָּם
  rationale: The direct wording avoids the misleading modern idiom “puts them in their place.”
interpretive_expansions:
- pob_phrase: without investigation
  rendering: without needing an investigation
  claim: The phrase means that God does not require a prolonged examination before acting.
  evidence:
