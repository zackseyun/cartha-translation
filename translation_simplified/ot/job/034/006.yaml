translation:
  language: en
  text: Should I lie about my right to justice?[a] My wound cannot be healed,[b] even though I have committed no transgression.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Against my right I am counted a liar,” if the first clause is a statement rather than a rhetorical question.
    reason: alternative_reading
  - marker: b
    text: Literally, “my arrow is incurable”; the arrow is likely an image for the wound or suffering inflicted on him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: concerning my right
  simplified_phrase: about my right to justice
  preserved_meaning: Job speaks of his rightful legal and moral claim.
  reasoning_layer_used: Lexical decision for מִשְׁפָּטִי and immediate context
  rationale: The added words clarify the legal sense of “right.”
- pob_phrase: My wound is incurable
  simplified_phrase: My wound cannot be healed
  preserved_meaning: Job describes his affliction as beyond cure.
  reasoning_layer_used: Lexical decisions for אָנ֖וּשׁ and חִצִּי
  rationale: The verbal wording is more natural while retaining the wound’s severity.
- pob_phrase: though there is no transgression
  simplified_phrase: even though I have committed no transgression
  preserved_meaning: Job protests that his severe suffering is not due to any transgression he committed.
  reasoning_layer_used: Theological decision and self-defense context
  rationale: The personal wording makes Job’s protest clear without naming an unstated object.
interpretive_expansions:
- pob_phrase: there is no transgression
  rendering: I have committed no transgression
  claim: The absent transgression refers to Job’s own conduct.
  evidence:
  - The theological rationale identifies the line as Job’s protest of undeserved suffering.
  - Job’s self-defense context presents this as his claim of innocence.
  confidence: high
  alternatives_preserved:
  - there is no transgression
  - I have done no wrong
