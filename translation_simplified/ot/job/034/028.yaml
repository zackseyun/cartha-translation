translation:
  language: en
  text: They caused the cry of the poor to come before God,[a] and he hears the cry of those who are afflicted.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to come upon him” or “to come against him”; the Hebrew allows more than one meaning here, and “him” may refer to the oppressor rather than God.
    reason: lexical_alternative
  - marker: b
    text: The two Hebrew terms overlap but are not identical; the second can also mean “the needy” or “the oppressed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so as to bring before him
  simplified_phrase: They caused ... to come before God
  preserved_meaning: Their conduct results in the poor people’s cry reaching God’s attention.
  reasoning_layer_used: Lexical and theological decisions with immediate context
  rationale: The direct clause clarifies the causative result and the contextually supported referent.
- pob_phrase: the cry of the afflicted
  simplified_phrase: the cry of those who are afflicted
  preserved_meaning: God hears socially vulnerable people in their distress without merging them with the poor.
  reasoning_layer_used: Lexical decision and grounding review
  rationale: This remains plain English while retaining the term’s social scope.
interpretive_expansions:
- pob_phrase: before him ... he hears
  rendering: before God ... he hears
  claim: God is the one before whom the cry comes and the one who hears it.
  evidence:
