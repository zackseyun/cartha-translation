translation:
  language: en
  text: He has already sinned, and now he adds rebellion to it. Here among us, he claps his hands[a] and piles up words against God[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “strikes his hands together.” This gesture may express scorn, defiance, or mockery.
    reason: lexical_alternative
  - marker: b
    text: Or “to God.” The Hebrew can indicate direction, but the accusing context supports “against God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For he adds rebellion to his sin
  simplified_phrase: He has already sinned, and now he adds rebellion to it
  preserved_meaning: Job is accused of adding defiant rebellion to an existing sin.
  reasoning_layer_used: Lexical decisions for יֹסִיף, עַל חַטָּאתוֹ, and פֶשַׁע
  rationale: The sentence states the sequence directly while retaining the distinction between sin and rebellion.
- pob_phrase: among us
  simplified_phrase: Here among us
  preserved_meaning: The gesture occurs in the presence of Elihu and the other listeners.
  reasoning_layer_used: Lexical decision for בֵּינֵינוּ
  rationale: “Here” makes the immediate social setting natural without changing who is present.
- pob_phrase: he multiplies his words against God
  simplified_phrase: he piles up words against God
  preserved_meaning: He keeps adding many words in opposition to God.
  reasoning_layer_used: Lexical and theological decisions for וְיֶרֶב and לָאֵל
  rationale: “Piles up” is common English that preserves the vivid image of accumulating speech.
