simplification_decisions:
- pob_phrase: heaps up silver like dust
  simplified_phrase: piles up silver as plentiful as dust
  preserved_meaning: He accumulates an enormous amount of silver, pictured through dust.
  reasoning_layer_used: Lexical decisions for יִצְבֹּר and כֶּעָפָר
