translation:
  language: en
  text: What hope does a godless person[a] have when God cuts him off[b] and takes away his life?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a hypocrite.” The Hebrew can describe someone who is godless, irreverent, or hypocritical.
    reason: lexical_alternative
  - marker: b
    text: This clause is difficult. It may instead mean “when he gains” or “though he has gained.”
    reason: alternative_reading
  - marker: c
    text: Or “draws out his life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the godless
  simplified_phrase: a godless person
  preserved_meaning: The person is irreverent or ungodly, not necessarily only outwardly hypocritical.
  reasoning_layer_used: POB lexical decision for חָנֵף
  rationale: The added noun makes the description sound natural in common English.
- pob_phrase: For what is the hope of
  simplified_phrase: What hope does ... have
  preserved_meaning: The rhetorical question denies any lasting hope when death comes.
  reasoning_layer_used: POB translation and immediate context
  rationale: Ordinary question structure is easier to understand without changing the force.
