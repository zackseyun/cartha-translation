  text: From where he is, he claps his hands at him and hisses at him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whistles at him.” The Hebrew word can mean either whistling or hissing; “hisses” fits the hostile tone here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify who acts here. The subject could be God, other people, or an impersonal force.
    reason: alternative_reading
