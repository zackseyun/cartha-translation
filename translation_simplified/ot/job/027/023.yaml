translation:
  language: en
  text: From where he is, he claps his hands at him and hisses at him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whistles at him.” The Hebrew word can mean either hissing or whistling; “hisses” fits the hostile tone here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not say who acts here. It could refer to God, other people, or an impersonal force.
    reason: alternative_reading
