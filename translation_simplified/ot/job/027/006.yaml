translation:
  language: en
  text: I hold firmly to my righteousness[a] and will not give it up. My heart does not accuse me for any day of my life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my integrity.” Here “righteousness” refers to Job’s claim that he has done what is right.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase is difficult and may also mean “for even one of my days” or “throughout all my days.”
    reason: alternative_reading
