translation:
  language: en
  text: Look, every one of you has seen this. Why, then, do you make yourselves so empty and futile?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew emphatically joins related words for emptiness or futility; it may also mean, “Why, then, do you act so vainly?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all of you have seen it
  simplified_phrase: every one of you has seen this
  preserved_meaning: Each listener has directly observed the reality Job is describing.
  reasoning_layer_used: Lexical decisions for אַתֶּם כֻּלְּכֶם and חֲזִיתֶם
  rationale: “Every one of you” clearly conveys the emphatic and comprehensive address.
- pob_phrase: why then do you become vain?
  simplified_phrase: Why, then, do you make yourselves so empty and futile?
  preserved_meaning: Job rebukes them for becoming empty or futile despite what they have seen.
  reasoning_layer_used: Lexical decisions for הֶבֶל and תֶּהְבָּלוּ and the POB footnote
  rationale: This replaces opaque “vain” without limiting the rebuke to thought, speech, or conduct.
interpretive_expansions:
- pob_phrase: do you become vain
  rendering: do you make yourselves so empty and futile
  claim: Here “vain” refers to emptiness or futility rather than personal conceit.
  evidence:
  - The POB lexical rationale defines the shared Hebrew root in terms of emptiness, vapor, and futility.
  - The POB footnote gives “act vainly” as an alternative without narrowing the domain.
  confidence: high
  alternatives_preserved:
