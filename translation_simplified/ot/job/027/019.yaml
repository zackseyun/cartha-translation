translation:
  language: en
  text: The rich person lies down still wealthy, but he will not be gathered.[a] He opens his eyes, and he is gone.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The brief Hebrew wording may mean that he will not be gathered to his ancestors for burial, or more generally that he will not be gathered after death.
    reason: alternative_reading
  - marker: b
    text: Literally, “he is not,” meaning that he is gone or no longer alive.
    reason: lexical_alternative
