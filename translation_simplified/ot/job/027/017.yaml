  preserved_meaning: A righteous man will wear the clothes prepared by the wicked man.
  reasoning_layer_used: POB footnote b and lexical decisions for צַדִּיק and יִלְבָּשׁ
  rationale: The plural pronoun naturally refers back to the explicitly named clothes.
- pob_phrase: will divide the silver
  simplified_phrase: will divide up the silver
  preserved_meaning: The innocent will apportion the wicked man's accumulated silver.
  reasoning_layer_used: Lexical decision for יַחֲלֹק
  rationale: “Divide up” is common English that preserves the act of apportioning.
