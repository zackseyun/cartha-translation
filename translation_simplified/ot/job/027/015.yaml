translation:
  language: en
  text: Death will claim those who outlive him, and they will be buried.[a] His widows will not weep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Those who outlive him will be buried while death is all around them.” The Hebrew phrase is compressed and can describe either death as their fate or burial amid death.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those who survive him will be buried by death
  simplified_phrase: Death will claim those who outlive him, and they will be buried
  preserved_meaning: His remaining survivors will die and be buried, with death presented as their stark fate.
  reasoning_layer_used: POB lexical decisions for שָׂרִידוֹ, בַּמָּוֶת, and יִקָּבֵרוּ
  rationale: The recast sentence makes the compressed Hebrew image understandable without reducing it to burial location alone.
interpretive_expansions:
- pob_phrase: buried by death
  rendering: Death will claim them, and they will be buried
  claim: The phrase presents death as the fate or agency attending their burial.
  evidence:
  - The POB lexical rationale says בַּמָּוֶת can express circumstance or agency-like means.
  - The POB main reading chooses “by death” rather than merely “in death.”
  confidence: moderate
  alternatives_preserved:
  - Burial amid death remains in the footnote.
translation_notes:
  risk_flags:
  - risk: “Death will claim” personifies death more explicitly than the POB wording.
    mitigation: The wording preserves the POB rationale’s agency-like force, while the footnote retains the circumstantial alternative.
  - risk: The plural phrase “his widows” may sound unusual to modern readers.
    mitigation: It is retained because the POB lexical decision identifies the women as belonging to the singular man’s household.
