translation:
  language: en
  text: I absolutely refuse to declare that you are right.[a] As long as I live, I will not cast off my integrity.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justify you” or “pronounce you to be in the right.”
