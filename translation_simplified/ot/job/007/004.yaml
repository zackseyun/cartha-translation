translation:
  language: en
  text: When I lie down,[a] I say, “When will I get up?” But the evening drags on, and I am overwhelmed by restless tossing until dawn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “If I lie down.” Here the Hebrew most likely describes what happens repeatedly.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can mean “twilight”; here it most likely means the morning twilight, or dawn.
    reason: lexical_alternative
