translation:
  language: en
  text: I have sinned. What can I do that would affect you, Watcher of humanity?[*] Why have you made me your target? This has made me a burden to myself.[†]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '*'
    text: “Watcher” can suggest either guarding humanity or closely observing it.
    reason: lexical_alternative
  - marker: †
    text: Some ancient versions read “a burden to you.”
    reason: alternative_reading
