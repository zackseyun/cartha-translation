  preserved_meaning: Job names a serious, willful offense rather than a mere mistake.
  reasoning_layer_used: POB lexical decision for פִשְׁעִי
  rationale: “Rebellion” is a documented alternative that makes the moral force immediately clear.
- pob_phrase: my iniquity
  simplified_phrase: my wrongdoing
  preserved_meaning: Job refers to his moral wrong while keeping it distinct from rebellion.
  reasoning_layer_used: POB lexical and theological decisions for עֲוֺנִי
  rationale: “Wrongdoing” uses one documented sense without combining it with the narrower idea of guilt.
- pob_phrase: you will seek me diligently
  simplified_phrase: You will search earnestly for me
  preserved_meaning: God will make an intent effort to find Job after he is gone.
  reasoning_layer_used: POB lexical decision for וְשִׁחֲרְתַּנִי
  rationale: “Search earnestly” expresses diligent seeking in familiar English.
