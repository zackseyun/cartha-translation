translation:
  language: en
  text: Take seven bulls and seven rams for yourselves. Go to my servant Job and offer them as a burnt offering on your own behalf. My servant Job will pray for you, and I will accept him as the one who prays for you. Then I will not deal with you according to your folly.[a] You have not spoken rightly about me,[b] as my servant Job has.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do a disgraceful thing to you.” The Hebrew can refer to folly or outrageous disgrace.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “spoken rightly to me.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Take for yourselves seven bulls and seven rams, and go to my servant Job, and offer up a burnt offering for yourselves.
  simplified_phrase: Take seven bulls and seven rams for yourselves. Go to my servant Job and offer them as a burnt offering on your own behalf.
  preserved_meaning: They must obtain the animals and present the prescribed sacrifice for themselves.
  reasoning_layer_used: Lexical decisions for the animals, burnt offering, and benefactive phrase.
  rationale: Two short sentences clarify the commands and identify the animals being offered.
- pob_phrase: for I will accept him
  simplified_phrase: I will accept him as the one who prays for you
  preserved_meaning: God accepts Job in his role as intercessor for the friends.
  reasoning_layer_used: Theological decision on Job’s mediation.
  rationale: The role phrase clearly connects God’s acceptance with Job’s prayer.
- pob_phrase: so that I may not deal with you disgracefully
  simplified_phrase: Then I will not deal with you according to your folly
  preserved_meaning: God will withhold the threatened response connected with their culpable folly.
  reasoning_layer_used: Lexical and theological decisions on נְבָלָה.
  rationale: This avoids attributing disgraceful conduct to God without adding a deserved-punishment claim.
interpretive_expansions:
- pob_phrase: for I will accept him
  rendering: I will accept him as the one who prays for you
  claim: Job is accepted specifically in his intercessory role.
  evidence:
  - The preceding command says that Job will pray for them.
  - The theological decision identifies Job’s prayer as the means by which judgment is withheld.
  confidence: high
  alternatives_preserved:
  - God shows personal favor to Job.
translation_notes:
  risk_flags:
  - risk: “According to your folly” selects one sense of a difficult Hebrew phrase.
    mitigation: Footnote a preserves the significant disgrace-related alternative.
  - risk: “About me” resolves wording that may instead mean “to me.”
    mitigation: Footnote b preserves the source ambiguity.
