base_translation:
  language: en
  edition: POB
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
  footnotes:
  - marker: a
    text: Literally, 'for only his face I will lift up,' a Hebrew idiom meaning 'I will accept him' or 'show favor to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that I may not do with you a disgraceful thing.' The Hebrew noun can denote folly or outrageous disgrace.
    reason: lexical_alternative
  - marker: c
    text: Or 'you have not spoken rightly to me.' The Hebrew may be understood as 'to me' or, by sense in context, 'about me.'
    reason: alternative_reading
