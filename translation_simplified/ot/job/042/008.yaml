  edition: POB
  yaml_path: translation/ot/job/042/008.yaml
  text: Now take for yourselves seven bulls and seven rams, and go to my servant Job and offer up a burnt offering for yourselves. My servant Job will pray for you, for I will accept him[a], so that I may not deal with you according to your folly.[b] For you have not spoken rightly about me[c], as my servant Job has.
  footnotes:
  - marker: a
    text: Literally, 'for only his face I will lift up,' a Hebrew idiom meaning 'I will accept him' or 'show favor to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that I may not do with you a disgraceful thing.' The Hebrew noun can denote folly or outrageous disgrace.
    reason: lexical_alternative
  - marker: c
    text: Or 'you have not spoken rightly to me.' The Hebrew may be understood as 'to me' or, by sense in context, 'about me.'
    reason: alternative_reading
