translation:
  language: en
  text: Now get seven bulls and seven rams for yourselves. Go to my servant Job and offer them as a sacrifice that is completely burned for your sake. My servant Job will pray for you. I will accept Job, so that I may not treat you as your foolishness deserves.[a] You have not spoken rightly about me, as my servant Job has.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “so that I may not do a disgraceful thing to you.” The Hebrew expression can refer to folly or outrageous disgrace.
    reason: lexical_alternative
  - marker: b
    text: Or “You have not spoken rightly to me.” The Hebrew can mean “to me” or, in this context, “about me.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: take for yourselves
  simplified_phrase: get ... for yourselves
  preserved_meaning: They must obtain the specified animals for their own required offering.
  reasoning_layer_used: Lexical decision for קְחוּ לָכֶם
  rationale: “Get” gives the command in natural English while retaining who must obtain the animals.
- pob_phrase: offer up a burnt offering for yourselves
  simplified_phrase: offer them as a sacrifice that is completely burned for your sake
  preserved_meaning: The animals are presented as a whole burnt sacrifice on the friends’ behalf.
  reasoning_layer_used: Lexical decisions for וְהַעֲלִיתֶם עוֹלָה and בַּעַדְכֶם
  rationale: This explains the unfamiliar ritual term while preserving the image of complete burning.
- pob_phrase: deal with you according to your folly
  simplified_phrase: treat you as your foolishness deserves
  preserved_meaning: God will withhold the judgment warranted by their culpable folly.
  reasoning_layer_used: Theological decision on נְבָלָה
  rationale: This makes the judicial sense clear without suggesting that God would act disgracefully.
translation_notes:
