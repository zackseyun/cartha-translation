translation:
  language: en
  text: After Yahweh had said these things to Job, he said to Eliphaz from Teman, “My anger burns against you and your two friends, because you have not spoken rightly about me,[a] as my servant Job has.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spoken to me what is right.” The Hebrew literally says “to me,” but the context likely means “about me.”
    reason: lexical_alternative
