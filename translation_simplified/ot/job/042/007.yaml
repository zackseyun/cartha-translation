  reasoning_layer_used: Lexical decisions for וַיְהִי אַחַר and דִּבֶּר preserve the narrative sequence.
  rationale: The direct time clause removes a cumbersome narrative formula without changing the order of events.
- pob_phrase: Eliphaz the Temanite
  simplified_phrase: Eliphaz from Teman
  preserved_meaning: Eliphaz is identified by his connection to Teman.
  reasoning_layer_used: The lexical decision lists “Eliphaz from Teman” as an allowed alternative.
  rationale: Naming the place directly is clearer than the unfamiliar gentilic title.
- pob_phrase: against you and against your two friends
  simplified_phrase: against you and your two friends
  preserved_meaning: Yahweh’s burning anger is directed at Eliphaz and both companions.
  reasoning_layer_used: The lexical decision permits omitting the repeated “against.”
  rationale: One “against” naturally governs both objects in modern English.
