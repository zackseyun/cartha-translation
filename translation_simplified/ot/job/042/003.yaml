translation:
  language: en
  text: “Who is this who hides counsel without understanding?”[a] So I spoke, but I did not understand. These matters were too wonderful for me to grasp; I did not know them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Who is this who darkens counsel without knowledge?” The Hebrew here says “hides,” unlike Job 38:2.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “wonders beyond me.”
    reason: lexical_alternative
