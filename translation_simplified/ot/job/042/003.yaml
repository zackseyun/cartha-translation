translation:
  language: en
  text: “Who is this who hides a purpose without knowledge?”[a] So I spoke, but I did not understand the wonders beyond me—things I did not know.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Who is this who darkens counsel without knowledge?” The Hebrew here says “hides,” unlike Job 38:2.
    reason: lexical_alternative
