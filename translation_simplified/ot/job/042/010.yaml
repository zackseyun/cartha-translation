translation:
  language: en
  text: Yahweh restored Job’s situation[a] when Job prayed for his friends. He also gave Job twice as much as he had before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew idiom means that Yahweh reversed Job’s condition; it does not necessarily refer to release from captivity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: restored Job’s fortunes
  simplified_phrase: restored Job’s situation
  preserved_meaning: Yahweh reversed Job’s overall condition, including his circumstances and possessions.
  reasoning_layer_used: POB lexical decision for שָׁב אֶת שבית and grounding review
  rationale: “Situation” keeps the restoration broad and avoids narrowing it to health or money.
- pob_phrase: and Yahweh gave Job twice as much as he had before
  simplified_phrase: He also gave Job twice as much as he had before
  preserved_meaning: Yahweh gave Job double what he formerly had.
  reasoning_layer_used: POB lexical decisions for אֶת כָּל אֲשֶׁר לְאִיּוֹב and לְמִשְׁנֶה
  rationale: A new sentence and pronoun make Yahweh’s two actions easier to follow.
