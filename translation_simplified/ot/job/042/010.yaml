translation:
  language: en
  text: When Job prayed for his friends, Yahweh restored his fortunes.[a] Yahweh gave him twice as much as he had before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew links Job’s restoration with his prayer in time, but does not explicitly say that his prayer caused it.
    reason: source_note
simplification_decisions:
- pob_phrase: And Yahweh restored Job’s fortunes when he prayed for his friends
  simplified_phrase: When Job prayed for his friends, Yahweh restored his fortunes.
  preserved_meaning: Job’s intercession and Yahweh’s reversal of his condition remain closely linked in time.
  reasoning_layer_used: Lexical and theological decisions on בְּהִתְפַּלְלוֹ and שָׁב אֶת שבית.
  rationale: Putting the time clause first makes the sequence easier to follow without making prayer the cause.
- pob_phrase: and Yahweh gave Job twice as much as he had before
  simplified_phrase: Yahweh gave him twice as much as he had before.
  preserved_meaning: Yahweh doubled what Job had previously possessed.
  reasoning_layer_used: Lexical decisions on אֶת כָּל אֲשֶׁר לְאִיּוֹב and לְמִשְׁנֶה.
  rationale: A separate sentence and pronoun reduce repetition while keeping the full amount clear.
translation_notes:
  risk_flags:
