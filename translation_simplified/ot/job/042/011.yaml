translation:
  language: en
  text: Then all Job’s brothers and sisters, together with everyone who had known him in earlier days, came to him. They shared a meal with him in his home. They showed him sympathy and comforted him for all the calamity Yahweh had brought upon him. Each of them gave him one ancient piece of money[a] and one gold ring.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew qesitah, an ancient piece or unit of value whose exact equivalent is unknown.
    reason: cultural_note
  - marker: b
    text: The Hebrew word may refer to a ring worn in the nose or ear.
    reason: lexical_alternative
