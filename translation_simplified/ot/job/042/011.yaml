translation:
  language: en
  text: Then all his brothers and sisters, and everyone who had known him before, came to him. They shared a meal with him in his house. They showed him sympathy and comforted him for all the calamity Yahweh had brought upon him. Each person gave him one ancient piece of value[a] and one gold ring.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew qesitah, an ancient item or unit of value whose exact equivalent is uncertain.
    reason: cultural_note
  - marker: b
    text: The Hebrew word may mean a ring worn in the nose or ear.
    reason: lexical_alternative
