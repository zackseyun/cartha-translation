  preserved_meaning: Job draws this conclusion from his encounter with God.
  reasoning_layer_used: Lexical decision for עַל כֵּן
  rationale: The fuller phrase makes the cause-and-result connection immediately clear.
- pob_phrase: I despise myself, and I repent
  simplified_phrase: I despise myself. I repent
  preserved_meaning: Job responds with both self-abasement and repentance.
  reasoning_layer_used: Lexical and theological decisions for אֶמְאַס and וְנִחַמְתִּי
  rationale: Two short sentences clarify the distinct responses without weakening either one.
