translation:
  language: en
  text: Because of this, I despise myself.[a] I repent in dust and ashes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Because of this, I recant, and I relent concerning dust and ashes.” The concise Hebrew does not state what Job rejects, and the next verb can also mean “relent” or “be comforted.”
    reason: alternative_reading
  - marker: b
    text: Dust and ashes express mourning, humility, and human mortality.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Therefore
