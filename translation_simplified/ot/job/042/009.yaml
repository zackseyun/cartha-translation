  text: Then Eliphaz of Teman, Bildad of Shuah, and Zophar of Naamah went and did what Yahweh had told them to do. Yahweh accepted Job.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Yahweh lifted up Job’s face,” a Hebrew expression meaning that he accepted Job or showed him favor.
    reason: lexical_alternative
