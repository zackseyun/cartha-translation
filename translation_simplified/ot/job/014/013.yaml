  rationale: This avoids the misleading modern sense that the anger returns.
- pob_phrase: appoint a time for me
  simplified_phrase: set a fixed time for me
  preserved_meaning: Job asks God to establish a definite future term before remembering him.
  reasoning_layer_used: POB lexical decisions for תָּשִׁית לִי חֹק and חֹק
  rationale: “Fixed time” clearly conveys the contextual time sense while the note retains the boundary sense.
