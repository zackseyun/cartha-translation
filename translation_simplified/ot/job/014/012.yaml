translation:
  language: en
  text: So a man lies down and does not rise. As long as the heavens remain,[a] those who lie down will not wake or be roused from their sleep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “until the heavens are no more,” pointing to an effectively unreachable end.
    reason: lexical_alternative
  - marker: b
    text: Lying down and sleeping are images of death here.
    reason: cultural_note
simplification_decisions:
- pob_phrase: So a man lies down and does not rise; until
  simplified_phrase: So a man lies down and does not rise. As long as
  preserved_meaning: A man remains unable to rise throughout the stated cosmic time span.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Two sentences make the poetic sequence easier to follow.
- pob_phrase: until the heavens are no more
  simplified_phrase: As long as the heavens remain
  preserved_meaning: The non-awakening lasts to an effectively unreachable cosmic endpoint.
  reasoning_layer_used: Lexical decision for עַד בִּלְתִּי שָׁמַיִם
  rationale: The positive time expression is clearer while retaining the same horizon.
- pob_phrase: they will not awake
  simplified_phrase: those who lie down will not wake
  preserved_meaning: The plural refers generally to people pictured as lying down in death.
  reasoning_layer_used: Lexical decisions for שָׁכַב and לֹא יָקִיצוּ
  rationale: Repeating the image clarifies the shift from one representative man to many.
translation_notes:
  risk_flags:
  - risk: Readers may take lying down and sleep as ordinary rest.
    mitigation: Footnote b identifies the death imagery without replacing it in the text.
  - risk: “As long as the heavens remain” may seem less visibly hyperbolic than the Hebrew wording.
    mitigation: Footnote a preserves the literal cosmic endpoint and its force.
