translation:
  language: en
  text: So when a man lies down, he does not rise. The dead will not wake or be roused from their sleep[b] until the heavens are gone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until the heavens cease to be.” This describes an endpoint beyond human reach.
    reason: lexical_alternative
  - marker: b
    text: Sleep is an image for death here; the verse does not settle what happens beyond this poetic horizon.
    reason: cultural_note
simplification_decisions:
- pob_phrase: So a man lies down and does not rise; until the heavens are no more
  simplified_phrase: So when a man lies down, he does not rise. ... until the heavens are gone.
  preserved_meaning: A man's lying down in death leads to no rising within the described cosmic horizon.
  reasoning_layer_used: POB lexical decisions and clause structure
  rationale: Two sentences and ordinary wording make the poetic comparison easier to follow.
- pob_phrase: they will not awake
  simplified_phrase: The dead will not wake
  preserved_meaning: The plural refers generally to those who have died, not only to the representative man.
  reasoning_layer_used: Hebrew plural verb and POB lexical rationale
  rationale: Naming the plural referent prevents an unclear shift from “a man” to “they.”
- pob_phrase: or be roused from their sleep
  simplified_phrase: or be roused from their sleep
  preserved_meaning: The second awakening expression intensifies the death-as-sleep image.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The distinct passive image is retained because combining it with “wake” would weaken the Hebrew parallel.
interpretive_expansions:
- pob_phrase: they
  rendering: The dead
  claim: The plural subject refers to dead people generally.
  evidence:
  - The Hebrew shifts from the singular “man” to plural verbs.
  - The surrounding images of lying down, rising, waking, and sleep describe death.
  confidence: high
  alternatives_preserved:
  - they
  - those who lie down
translation_notes:
  risk_flags:
  - risk: “Until” could be read as promising that the dead awaken once the heavens are gone.
    mitigation: Footnote a explains that the Hebrew presents an effectively unreachable endpoint without defining what follows.
  - risk: “The dead” could make the sleep metaphor sound like a doctrinal conclusion about resurrection or annihilation.
    mitigation: The main text preserves lying down, rising, waking, and sleep, while footnote b leaves the theological horizon unresolved.
