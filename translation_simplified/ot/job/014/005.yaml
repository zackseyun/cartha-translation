translation:
  language: en
  text: Since the length of his life is already decided,[a] you know how many months he has. You have set the boundary of his life, and he cannot go beyond it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “If the length of his life is already decided.” In context, “Since” more likely introduces the basis for Job’s appeal.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also be rendered “his limit” or “his decree”; it refers to a fixed boundary.
    reason: lexical_alternative
