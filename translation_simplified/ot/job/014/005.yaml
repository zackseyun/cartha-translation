  preserved_meaning: A person’s lifespan has been fixed by God.
  reasoning_layer_used: Lexical decision for חֲרוּצִים and theological decision on divine determination
  rationale: The wording explains the lifespan idiom while retaining the strong claim that it is fixed.
- pob_phrase: the number of his months is with you
  simplified_phrase: you know how many months he has
  preserved_meaning: God possesses knowledge of the full number of a person’s months.
  reasoning_layer_used: Lexical decision for אִתָּךְ
  rationale: The natural wording expresses the contextual implication of the count being with God.
- pob_phrase: you have set his limit, and he cannot pass it
  simplified_phrase: You have set the boundary of his life, and he cannot go beyond it
  preserved_meaning: God establishes a fixed lifespan that a person cannot exceed.
  reasoning_layer_used: Lexical decisions for חֻקּוֹ, עָשִׂיתָ, and וְלֹא יַעֲבוֹר
  rationale: The concrete boundary image is made explicit and the meaning of passing it is stated naturally.
