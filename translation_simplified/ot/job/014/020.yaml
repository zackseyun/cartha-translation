  preserved_meaning: The man departs from life or the human scene.
  reasoning_layer_used: Lexical rationale for וַיַּהֲלֹךְ and the POB footnote
  rationale: “He is gone” is clear while the footnote preserves the broader departure language.
- pob_phrase: you alter his face
