translation:
  language: en
  text: If a man dies, will he come back to life? I would wait through my entire time of hard service until my change[a] comes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “renewal.” The Hebrew word means a change or replacement, but its precise meaning here is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will he live again?
  simplified_phrase: will he come back to life?
  preserved_meaning: Job asks whether life can follow death without asserting that it will.
  reasoning_layer_used: Lexical decision and theological decision
  rationale: The clearer idiom preserves both the question and its unresolved tension.
- pob_phrase: All the days of my hard service I would wait
  simplified_phrase: I would wait through my entire time of hard service
  preserved_meaning: Job would wait throughout the whole burdensome period assigned to him.
  reasoning_layer_used: Lexical decision for כָּל יְמֵי צְבָאִי
  rationale: Ordinary English clause order makes the duration easier to understand.
translation_notes:
  risk_flags:
  - risk: “Come back to life” may sound more explicitly resurrection-focused than the Hebrew verb alone.
    mitigation: The question remains unresolved, and “my change” retains the verse’s documented ambiguity.
  - risk: Modern readers may not know what kind of change Job expects.
    mitigation: The footnote preserves “renewal” while stating that the precise sense is uncertain.
