translation:
  language: en
  text: You would put my offense in a bag and seal it shut. Then you would cover over[a] my wrongdoing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may mean “plaster over,” “sew up,” or “fasten over.”
    reason: lexical_alternative
  - marker: b
    text: The image is of God keeping Job’s wrongdoing secured for judgment, not forgiving it.
    reason: simplification_note
