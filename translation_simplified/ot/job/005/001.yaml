simplification_decisions:
- pob_phrase: Call now—is there anyone who will answer you?
  simplified_phrase: Call now! Is there anyone who will answer you?
  preserved_meaning: Eliphaz urgently challenges Job to find someone who will respond.
  reasoning_layer_used: Lexical decisions for קְרָא, נָא, and הֲיֵשׁ עוֹנֶךָ.
  rationale: Two sentences make the challenge easier to follow without weakening its rhetorical force.
- pob_phrase: And to which of the holy ones will you turn?
  simplified_phrase: Which of the holy ones will you turn to for help?
  preserved_meaning: Job is challenged to identify a holy being to whom he can appeal.
  reasoning_layer_used: Lexical decision for תִּפְנֶה and the theological decision on מִקְּדֹשִׁים.
  rationale: Natural word order and “for help” clarify the implied appeal while retaining the image of turning.
interpretive_expansions:
- pob_phrase: will you turn
  rendering: will you turn to for help
  claim: The turning is an appeal for help rather than merely a change of direction.
