translation:
  language: en
  text: During famine, he will redeem[a] you from death. In war, he will rescue you from the power of the sword.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “redeem” means to release or rescue from danger; it may also be translated “ransom.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In famine
  simplified_phrase: During famine
  preserved_meaning: Famine is the disaster during which God acts.
  reasoning_layer_used: Lexical decision for בְּרָעָב
  rationale: “During” makes the circumstance clearer in ordinary English.
- pob_phrase: and in war from the power of the sword
  simplified_phrase: In war, he will rescue you from the power of the sword.
  preserved_meaning: The implied act of redemption continues in the second parallel line.
  reasoning_layer_used: Hebrew parallel structure and lexical decisions for מִידֵי חָרֶב
  rationale: A complete second sentence makes the Hebrew ellipsis immediately understandable.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “redeem” as referring only to spiritual salvation.
    mitigation: The footnote defines its immediate sense as release or rescue from danger.
  - risk: Using “rescue” in the second sentence may appear to weaken the repeated redemption idea.
    mitigation: The first sentence retains “redeem,” while “rescue” clearly expresses its implied continuation.
