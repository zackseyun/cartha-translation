  text: He catches wise people in their own cunning, and the plans of crooked people are quickly brought to an end.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the wise
  simplified_phrase: wise people
  preserved_meaning: People regarded as wise are themselves caught.
  reasoning_layer_used: POB lexical decision
  rationale: “Wise people” is more natural for common readers while retaining the irony.
- pob_phrase: in their craftiness
  simplified_phrase: in their own cunning
  preserved_meaning: Their deceptive cleverness becomes the means by which they are caught.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Cunning” keeps the negative quality distinct from the plans in the next clause.
- pob_phrase: the counsel of the twisted is rushed headlong
  simplified_phrase: the plans of crooked people are quickly brought to an end
  preserved_meaning: The devious plans are abruptly prevented from continuing.
  reasoning_layer_used: POB lexical alternatives, moral characterization, and immediate context
  rationale: This wording clearly expresses the rapid failure without adding an unsupported driving force.
