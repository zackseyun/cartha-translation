translation:
  language: en
  text: Hungry people eat his harvest. They take it even from among the thorns, and thirsty people greedily long for their wealth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of the final clause is difficult. It may instead mean, “A snare swallows up their wealth.”
