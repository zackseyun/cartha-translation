simplification_decisions:
- pob_phrase: The hungry eat his harvest
  simplified_phrase: Hungry people eat his harvest
  preserved_meaning: Hungry outsiders consume the harvested produce that belongs to him.
  reasoning_layer_used: Lexical decision for רָעֵב and קְצִירוֹ
  rationale: The concrete noun “people” makes the substantival adjective immediately clear without changing its generic sense.
- pob_phrase: and take it even from among the thorns
  simplified_phrase: They take it even from among the thorns
  preserved_meaning: They seize the harvest despite its location or protection among thorns.
  reasoning_layer_used: Lexical decision for וְאֶל מִצִּנִּים יִקָּחֵהוּ
  rationale: A new sentence supplies an explicit subject while retaining the vivid thorn image and emphatic “even.”
- pob_phrase: the thirsty pant after their wealth
  simplified_phrase: thirsty people greedily long for their wealth
  preserved_meaning: Those pictured as thirsty intensely desire the household’s resources.
  reasoning_layer_used: Lexical decisions for וְשָׁאַף, צַמִּים, and חֵילָם
  rationale: “Greedily long for” states the force of the difficult panting metaphor in natural modern English.
interpretive_expansions:
- pob_phrase: pant after
  rendering: greedily long for
  claim: The panting image describes intense, grasping desire for wealth.
  evidence:
  - The POB lexical rationale identifies greedy desire as the metaphor’s force.
  - The object “their wealth” makes eager acquisition the relevant domain.
  confidence: high
  alternatives_preserved:
  - pant after
  - snatch at
  - swallow up
