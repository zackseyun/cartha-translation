translation:
  language: en
  text: Hungry people eat his harvest and take it even from among the thorns. Thirsty people pant for their wealth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “A snare swallows up their wealth.” The Hebrew final clause is difficult; the main text reads “the thirsty,” parallel to “the hungry.”
