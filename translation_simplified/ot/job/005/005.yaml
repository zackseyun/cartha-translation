  preserved_meaning: People who are hungry consume the harvested produce that belonged to him.
  reasoning_layer_used: POB lexical decision for רָעֵב and קְצִירוֹ
  rationale: The explicit noun “people” makes the substantival adjective immediately clear.
- pob_phrase: and the thirsty pant after their wealth
  simplified_phrase: Thirsty people pant for their wealth
  preserved_meaning: The thirsty eagerly desire their possessions while the source metaphor remains intact.
  reasoning_layer_used: POB lexical decisions for וְשָׁאַף, צַמִּים, and חֵילָם
  rationale: “Pant for” is more natural modern English than “pant after” without weakening the image.
