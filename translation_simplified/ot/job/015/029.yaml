  simplified_phrase: will not grow rich
  preserved_meaning: He will fail to gain wealth.
  reasoning_layer_used: POB lexical decision for יֶעְשַׁר
  rationale: “Grow rich” expresses the same change of condition in natural English.
- pob_phrase: his wealth will not endure
  simplified_phrase: His wealth will not last
  preserved_meaning: His wealth will not remain secure.
  reasoning_layer_used: POB lexical decision for יָקוּם with חֵילוֹ
  rationale: “Will not last” clearly conveys the idiomatic sense of failing to endure.
- pob_phrase: his produce will not bend down to the earth
  simplified_phrase: his produce will not bend down to the ground
  preserved_meaning: What he produces will not bend downward, whether as abundant produce or in the broader disputed sense.
  reasoning_layer_used: POB lexical decisions for יִטֶּה and מִנְלָם, with POB footnotes
  rationale: “Ground” is more natural than “earth” while the verb remains broad enough to preserve the ambiguity.
