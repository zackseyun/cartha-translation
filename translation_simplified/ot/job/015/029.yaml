translation:
  language: en
  text: He will not grow rich. His wealth will not last, and his produce[a] will not bend down to the ground.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is rare and uncertain; it may instead mean his possessions, gain, or abundance.
    reason: lexical_alternative
  - marker: b
    text: The image may describe produce drooping under abundance; others understand it as possessions not spreading over the land.
    reason: alternative_reading
