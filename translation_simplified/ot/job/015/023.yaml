translation:
  language: en
  text: He roams around looking for bread and asks, “Where is it?” He knows that a day of darkness is about to come upon him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: wanders about for bread
  simplified_phrase: roams around looking for bread
  preserved_meaning: He is restlessly searching for something to eat.
  reasoning_layer_used: Lexical decisions for נֹדֵד and לַלֶּחֶם
  rationale: The wording makes the purpose of his roaming immediately clear while retaining the concrete image of bread.
- pob_phrase: saying, ‘Where is it?’
  simplified_phrase: and asks, “Where is it?”
  preserved_meaning: He voices his desperate search for bread.
  reasoning_layer_used: Lexical decision for אַיֵּה
  rationale: “Asks” is more natural here than the generic speech verb “saying.”
- pob_phrase: is ready at hand for him
  simplified_phrase: is about to come upon him
  preserved_meaning: The threatening day is near and will affect him personally.
  reasoning_layer_used: Lexical decisions for נָכוֹן and בידו
  rationale: This replaces an opaque idiom with ordinary English that preserves readiness and imminence.
interpretive_expansions:
- pob_phrase: for bread
  rendering: looking for bread
  claim: Bread is the object of his ongoing search.
  evidence:
  - The preposition with “bread” states the purpose of his restless roaming.
  - The following question “Where is it?” confirms that he is searching for bread.
  confidence: high
  alternatives_preserved:
