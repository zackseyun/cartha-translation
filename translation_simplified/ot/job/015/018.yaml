translation:
  language: en
  text: what wise men make known and do not hide from their fathers—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can relate “hide” and “their fathers” in several ways: “what their fathers did not hide,” “what the wise men did not hide from their fathers,” or “what the wise men received from their fathers and did not hide.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: what wise men declare
  simplified_phrase: what wise men make known
  preserved_meaning: Wise men communicate the teaching to others.
  reasoning_layer_used: lexical decision for יַגִּידוּ
  rationale: “Make known” expresses the verb’s meaning in more familiar English.
- pob_phrase: and have not hidden
  simplified_phrase: and do not hide
  preserved_meaning: The wise men do not conceal what they make known.
  reasoning_layer_used: lexical decisions for וְלֹא and כִחֲדוּ
  rationale: The simple present is clearer while retaining the proverbial sense and the separate idea of concealment.
- pob_phrase: from their fathers
  simplified_phrase: from their fathers
  preserved_meaning: The wording preserves the unresolved relationship between hiding and the fathers.
  reasoning_layer_used: theological decision on מֵאֲבוֹתָם
  rationale: Retaining the phrase avoids making inherited transmission the verse’s only asserted meaning.
