translation:
  language: en
  text: Have you listened in God’s council[a]? Have you kept wisdom all to yourself?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s secret counsel.” The Hebrew word can refer to a confidential council, an intimate circle, or a secret deliberation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the council of God
  simplified_phrase: God’s council
  preserved_meaning: God’s confidential deliberative assembly remains the controlling image.
  reasoning_layer_used: lexical and theological decisions on סוֹד
  rationale: The possessive form is more natural while preserving the heavenly council imagery.
- pob_phrase: and restricted wisdom to yourself
  simplified_phrase: Have you kept wisdom all to yourself?
  preserved_meaning: Eliphaz mockingly asks whether Job has made wisdom his exclusive possession.
  reasoning_layer_used: lexical decisions on תִגְרַע and אֵלֶיךָ
  rationale: The common expression states the same accusation without the awkward verb “restricted.”
- pob_phrase: Have you listened ... and restricted
  simplified_phrase: Have you listened ...? Have you kept ...?
  preserved_meaning: Both linked rhetorical accusations remain distinct.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Two short questions make the parallel challenge easier to follow.
