translation:
  language: en
  text: He will not escape the darkness. A flame will wither his young branch, and he will be swept away by the breath from his mouth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His mouth” may mean either the wicked man’s mouth or God’s mouth; the Hebrew does not clearly identify a new subject.
