simplification_decisions:
- pob_phrase: He will not escape from darkness
  simplified_phrase: He will not escape the darkness
  preserved_meaning: The wicked person cannot get free from darkness or calamity.
  reasoning_layer_used: POB lexical decision and applied source revision
  rationale: Removing “from” makes the clause more natural without changing its force.
- pob_phrase: a flame will dry up his shoot
  simplified_phrase: A flame will wither his young branch
  preserved_meaning: Scorching destruction is pictured as a flame withering a plant’s single new growth.
  reasoning_layer_used: POB lexical decision for יֹנַקְתּוֹ and תְּיַבֵּשׁ שַׁלְהָבֶת
  rationale: “Young branch” clarifies the plant image, while “wither” naturally describes the flame’s effect.
- pob_phrase: by the breath of his mouth
  simplified_phrase: by the breath from his mouth
  preserved_meaning: A force pictured as breath coming from a mouth sweeps the wicked person away.
  reasoning_layer_used: POB lexical and theological decisions for בְּרוּחַ פִּיו
  rationale: “From” states the physical relation plainly while leaving the owner of the mouth ambiguous.
