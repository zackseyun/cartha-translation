translation:
  language: en
  text: I myself will see him for myself. My own eyes will see him—not someone else.[a] Deep within me, I am worn out.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “not a stranger.” The meaning may be that Job himself, rather than someone else, will see him.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says, “My kidneys fail within my bosom,” using the kidneys as an image for the inner self and deepest emotions.
    reason: cultural_note
simplification_decisions:
- pob_phrase: whom I myself will see for myself
  simplified_phrase: I myself will see him for myself
  preserved_meaning: Job emphatically expects to see the person mentioned in the previous verse for himself.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: Using “him” makes the carried-over personal object clear in a stand-alone verse.
- pob_phrase: and my eyes will see, and not another
  simplified_phrase: My own eyes will see him—not someone else
  preserved_meaning: Job himself, rather than another person, will have this sight.
  reasoning_layer_used: lexical decision for וְלֹא זָר
  rationale: The recast sentence expresses the emphatic contrast in natural English.
- pob_phrase: My kidneys fail within my bosom
  simplified_phrase: Deep within me, I am worn out
  preserved_meaning: Job's deepest inner self is profoundly depleted.
  reasoning_layer_used: lexical rationale and cultural note
  rationale: The main text conveys inward depletion without choosing among anguish, yearning, or collapse.
interpretive_expansions:
- pob_phrase: My kidneys fail within my bosom
  rendering: Deep within me, I am worn out
  claim: The bodily image refers to profound depletion in Job's inner self rather than literal kidney failure.
  evidence:
  - The POB cultural note identifies the kidneys as the inner self or deepest emotions.
  - The lexical rationale says the verb expresses wasting away or being spent.
  confidence: high
  alternatives_preserved:
  - inward collapse
  - anguish
  - yearning
translation_notes:
  risk_flags:
  - risk: The plain rendering removes the Hebrew images of kidneys and bosom from the main text.
    mitigation: Footnote b preserves both images and explains their emotional sense.
  - risk: Readers may infer a specific doctrine about when or how Job will see him.
    mitigation: The text does not specify resurrection, earthly vindication, death, or a spiritual vision.
