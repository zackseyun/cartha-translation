translation:
  language: en
  text: I myself will see him—yes, for myself. My own eyes will see him, not someone else.[a] My heart yearns within me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “not a stranger” or “not another.” The Hebrew stresses that Job himself will see him.
    reason: lexical_alternative
  - marker: b
    text: Literally “my kidneys are consumed within my bosom,” a Hebrew image for intense feelings deep within a person.
    reason: cultural_note
