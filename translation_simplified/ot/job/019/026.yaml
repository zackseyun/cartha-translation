translation:
  language: en
  text: And even after my skin is destroyed,[a] I will still see God—from my flesh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; a more literal rendering is “after they have struck off my skin, this.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “in my flesh” or “without my flesh.”
    reason: alternative_reading
