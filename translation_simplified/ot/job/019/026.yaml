translation:
  language: en
  text: And even after my skin is destroyed,[a] I will see God from my flesh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; a more literal rendering is “after they have struck off my skin, this.”
    reason: lexical_alternative
  - marker: b
    text: Or “in my flesh”; alternatively, “without my flesh.” The Hebrew phrase can be understood in more than one way.
    reason: alternative_reading
