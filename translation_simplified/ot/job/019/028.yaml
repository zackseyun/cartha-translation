  text: If you say, “How can we keep pursuing him, since the root of this matter lies in me?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. The last words may instead mean “the root of the matter lies in him,” and “pursuing” may have the stronger sense “persecuting.”
