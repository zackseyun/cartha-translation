  simplified_phrase: How can we keep pursuing him
  preserved_meaning: The speakers consider continuing their hostile pursuit of Job.
  reasoning_layer_used: lexical decision for נרדף and immediate context
  rationale: “Keep pursuing” makes the ongoing hostility natural in modern English while retaining the pursuit image.
- pob_phrase: the root of the matter is found in me
  simplified_phrase: the root of this matter lies in me
  preserved_meaning: The underlying basis of the case is located in the speaker.
  reasoning_layer_used: lexical decisions for שֹׁרֶשׁ, דָּבָר, נִמְצָא, and בִי
  rationale: “Lies in me” clarifies location without removing the Hebrew root metaphor.
