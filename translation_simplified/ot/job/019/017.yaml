translation:
  language: en
  text: My breath disgusts my wife, and even my own family finds me loathsome.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean, “My plea is to the sons of my body,” or, “I beg the sons of my body for favor.”
