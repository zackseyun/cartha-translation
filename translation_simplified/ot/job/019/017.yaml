simplification_decisions:
- pob_phrase: My breath is repulsive to my wife
  simplified_phrase: My breath disgusts my wife
  preserved_meaning: Job’s wife reacts to his breath with strong revulsion.
  reasoning_layer_used: Lexical decisions for רוּחִי and זָרָה
  rationale: The active wording expresses the same bodily and relational revulsion more directly.
- pob_phrase: I am loathsome to the sons of my own body
  simplified_phrase: even my own family finds me loathsome
  preserved_meaning: Job is repulsive to people joined to him by close blood kinship.
  reasoning_layer_used: Lexical decisions for וְחַנֹּתִי, לִבְנֵי, and בִטְנִי, with the POB cultural note
  rationale: “Family” avoids limiting the ambiguous kinship expression to biological sons.
translation_notes:
  risk_flags:
