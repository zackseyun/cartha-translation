translation:
  language: en
  text: May they be carved into the rock forever with an iron engraving tool and lead![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lead may have been used with the iron tool, perhaps to fill the carved letters so they could be seen, but the text does not say exactly how it was used.
