translation:
  language: en
  text: Why do you keep pursuing me as God does?[a] Will you never get enough of feeding on my flesh?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as a god does.”
    reason: alternative_reading
  - marker: b
    text: Job uses the image of feeding on his flesh to describe their relentless hostility.
    reason: simplification_note
simplification_decisions:
- pob_phrase: pursue me like God
  simplified_phrase: keep pursuing me as God does
  preserved_meaning: Job compares his companions’ continuing hostile pursuit to God’s severe pursuit or judgment.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Keep pursuing” retains the verb’s broad force while making the relentless action clear.
- pob_phrase: are not satisfied with my flesh
  simplified_phrase: Will you never get enough of feeding on my flesh?
  preserved_meaning: Their hostility is pictured as an insatiable attack upon Job’s very flesh.
  reasoning_layer_used: lexical decision and POB footnote b
  rationale: The question explains the consuming image while preserving the concrete word “flesh.”
interpretive_expansions:
- pob_phrase: are not satisfied with my flesh
  rendering: Will you never get enough of feeding on my flesh?
  claim: The companions’ relentless hostility is depicted through the image of feeding on Job’s flesh.
  evidence:
  - POB footnote b identifies consuming or preying on Job’s flesh as the likely sense.
  - The lexical rationale connects being satisfied with what one feeds on.
  confidence: high
  alternatives_preserved:
  - being satisfied with my flesh
  - preying on my flesh
translation_notes:
  risk_flags:
