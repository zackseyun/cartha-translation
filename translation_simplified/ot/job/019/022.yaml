translation:
  language: en
  text: Why do you keep pursuing me as God does?[a] Why can’t you get enough of my flesh?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as a god does”; the Hebrew most likely refers to God here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew pictures Job’s companions as predators consuming his flesh.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pursue me like God
  simplified_phrase: keep pursuing me as God does
  preserved_meaning: Job compares his companions’ continuing hostile pursuit to God’s pursuit or judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Pursuing” preserves the verb’s broad force without turning it into a physical hunt.
- pob_phrase: and never get enough of my flesh
  simplified_phrase: Why can’t you get enough of my flesh?
  preserved_meaning: Job pictures his companions’ hostility as an insatiable attack on his flesh.
  reasoning_layer_used: POB lexical decision and source audit
  rationale: A separate direct question makes the vivid flesh image easy to follow.
interpretive_expansions:
- pob_phrase: like God
  rendering: as God does
  claim: The comparison concerns the companions pursuing Job in a way comparable to God’s pursuit or judgment.
  evidence:
  - The POB theological rationale identifies divine pursuit or judgment as the comparison.
  confidence: high
  alternatives_preserved:
  - as a god does
translation_notes:
  risk_flags:
  - risk: “As God does” could be read as endorsing Job’s accusation rather than reporting it.
    mitigation: The question clearly presents Job’s own protest to his companions.
  - risk: “Get enough of my flesh” may be mistaken for literal cannibalism.
    mitigation: Footnote b identifies it as a predatory image for their hostile treatment.
