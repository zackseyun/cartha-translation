simplification_decisions:
- pob_phrase: Have pity on me, have pity on me
  simplified_phrase: Have pity on me! Have pity on me
  preserved_meaning: The repeated plea keeps Job’s emotional urgency and appeal for compassion.
  reasoning_layer_used: POB lexical decisions for חָנֻּנִי and its repetition
  rationale: The exclamation point makes the repeated plea easier to hear without changing its force.
- pob_phrase: you my friends
  simplified_phrase: my friends
  preserved_meaning: Job directly appeals to those who should show him sympathy.
  reasoning_layer_used: POB lexical decision for רֵעַי
  rationale: Ordinary English direct address does not need the awkward word “you.”
- pob_phrase: for the hand of God has struck me
  simplified_phrase: because the hand of God has struck me
  preserved_meaning: Job gives God’s harmful action as the reason for his plea while retaining the hand image.
  reasoning_layer_used: POB lexical and theological decisions for כִּי, יַד אֱלוֹהַּ, and נָגְעָה בִּי
  rationale: “Because” states the connection more plainly while preserving divine agency and the vivid metaphor.
