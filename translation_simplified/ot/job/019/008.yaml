translation:
  language: en
  text: He[a] has built a wall across my way, so I cannot get through. He has laid darkness over my paths.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name the subject here. From the context, Job is speaking about God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has walled up my way
  simplified_phrase: has built a wall across my way
  preserved_meaning: Job pictures his course as physically blocked by a wall.
  reasoning_layer_used: Lexical decision for גָדַר and אָרְחִי
  rationale: The wording makes the concrete obstruction immediately clear without reducing it to merely “blocked.”
- pob_phrase: so that I cannot pass
  simplified_phrase: so I cannot get through
  preserved_meaning: The wall prevents Job from continuing along his way.
  reasoning_layer_used: Lexical decision for וְלֹא אֶעֱבוֹר
  rationale: “Get through” states the result naturally in common English.
- pob_phrase: has set darkness upon my paths
  simplified_phrase: has laid darkness over my paths
  preserved_meaning: Darkness is pictured as being placed over Job’s possible routes.
  reasoning_layer_used: Lexical decision for חֹשֶׁךְ יָשִׂים and the retained poetic image
  rationale: “Laid darkness over” preserves the source image in clearer English.
translation_notes:
  risk_flags:
  - risk: Readers may not know whom “he” refers to.
    mitigation: The footnote identifies God as the contextual referent while preserving the Hebrew verse’s implicit subject.
