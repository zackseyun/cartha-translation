translation:
  language: en
  text: He[a] has walled off my way, so I cannot get through. He has laid darkness over my paths.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew leaves the subject unstated. In context, Job is speaking about God, though this verse says only “he.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has walled up my way
  simplified_phrase: has walled off my way
  preserved_meaning: Job’s course is obstructed by a wall-like barrier.
  reasoning_layer_used: Lexical decisions for גָדַר and אָרְחִי
  rationale: “Walled off” keeps the concrete image while sounding natural in modern English.
- pob_phrase: so that I cannot pass
  simplified_phrase: so I cannot get through
  preserved_meaning: The barrier prevents Job from continuing.
  reasoning_layer_used: Lexical decision for וְלֹא אֶעֱבוֹר
  rationale: “Get through” expresses the result in ordinary modern English.
- pob_phrase: has set darkness upon my paths
  simplified_phrase: has laid darkness over my paths
  preserved_meaning: Darkness is pictured as being placed across Job’s routes.
  reasoning_layer_used: Lexical decisions for חֹשֶׁךְ and יָשִׂים
  rationale: “Laid over” naturally preserves the image of darkness placed upon the paths.
translation_notes:
  risk_flags:
  - risk: Readers may assume the verse explicitly names God as the subject.
    mitigation: The text retains “he,” and the footnote identifies God only as the contextual referent.
