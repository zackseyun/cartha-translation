translation:
  language: en
  text: Look! I shout, “Violence!”[a] but no answer comes. I cry for help, but I receive no justice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Wrong!” or “Outrage!” The Hebrew word can describe violence, wrongdoing, or a complaint against a terrible wrong.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew has a legal sense: Job receives no just decision or remedy.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I cry out, “Violence!”
  simplified_phrase: I shout, “Violence!”
  preserved_meaning: Job loudly and urgently reports a violent wrong.
  reasoning_layer_used: Lexical decision for אֶצְעַק and חָמָס
  rationale: “Shout” makes the volume and urgency immediately clear while retaining Job’s legal cry of “Violence!”
- pob_phrase: I am not answered
  simplified_phrase: no answer comes
  preserved_meaning: Job’s urgent complaint receives no response.
  reasoning_layer_used: Lexical decision for אֵעָנֶה
  rationale: The active English expression is easier to read without changing the unanswered-cry image.
- pob_phrase: there is no justice
  simplified_phrase: I receive no justice
  preserved_meaning: Job finds no just hearing, decision, or remedy.
  reasoning_layer_used: Lexical and theological decisions for מִשְׁפָּט
  rationale: The personal wording clarifies how the absence of justice affects Job without softening his accusation.
translation_notes:
  risk_flags:
  - risk: “Violence” may sound limited to physical assault.
    mitigation: Footnote a preserves the broader senses of wrongdoing and outraged complaint.
  - risk: “I receive no justice” could be read more broadly than a legal complaint.
    mitigation: Footnote b states the word’s legal sense while preserving Job’s protest.
