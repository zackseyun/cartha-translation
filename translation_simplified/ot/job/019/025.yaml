translation:
  language: en
  text: But I know that my Redeemer[a] lives. Afterward, he will rise over the dust.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my Vindicator.” The Hebrew term can mean a redeemer, defender, or one who upholds a family member’s cause.
    reason: lexical_alternative
  - marker: b
    text: Or “At the last he will stand upon the earth,” or “As the last one he will stand over the dust.” The Hebrew clause is difficult and has several possible meanings.
    reason: alternative_reading
  - marker: c
    text: “Dust” may refer to mortality, the grave, or the earth; the Hebrew literally says “dust.”
    reason: cultural_note
