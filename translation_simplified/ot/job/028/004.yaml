  preserved_meaning: A worker forcefully opens the earth for mining.
  reasoning_layer_used: POB lexical decisions and chapter context
  rationale: Naming the miner clarifies the implied subject while preserving the mining image.
- pob_phrase: forgotten by the foot
  simplified_phrase: Forgotten by those walking above
  preserved_meaning: The miners are beyond the notice of ordinary foot traffic.
  reasoning_layer_used: POB footnote b and lexical rationale
  rationale: The compressed body-part image becomes a clear picture of people walking overhead.
- pob_phrase: far from men
  simplified_phrase: far from other people
  preserved_meaning: The miners work apart from human society.
  reasoning_layer_used: POB lexical decision for מאנוש and grounding review
  rationale: Other people conveys social separation without implying distance from every individual.
