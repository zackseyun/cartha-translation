translation:
  language: en
  text: He cuts open a mine shaft far from where people live.[a] The miners are beyond the notice of people passing on foot. Hanging far from other people, they sway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean, “He breaks open a channel away from a sojourner.” “Mine shaft” follows the chapter’s mining context.
    reason: alternative_reading
  - marker: b
    text: The word translated “hanging” may instead mean “being lowered” or “dangling.”
    reason: lexical_alternative
