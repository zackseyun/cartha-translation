translation:
  language: en
  text: A miner cuts open a shaft far from where people live.[a] Forgotten by those walking above, the miners hang far from other people and sway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead describe breaking open a channel or torrent bed away from a traveler.
    reason: alternative_reading
  - marker: b
    text: The miners may be pictured as being lowered or dangling, likely on ropes.
    reason: lexical_alternative
