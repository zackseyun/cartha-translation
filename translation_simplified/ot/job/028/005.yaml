translation:
  language: en
  text: Bread comes from the earth, but below its surface, the earth is turned over as if by fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “but its underside is overturned like fire.” The brief Hebrew comparison may describe how the earth is overturned or what lies beneath its food-producing surface.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: As for the earth, bread comes from it
  simplified_phrase: Bread comes from the earth
  preserved_meaning: The earth produces the grain from which bread comes.
  reasoning_layer_used: POB lexical decisions for אֶרֶץ, לָחֶם, and יֵצֵא לָחֶם
  rationale: The direct sentence order is easier to read while retaining the concrete image of bread coming from the earth.
- pob_phrase: but beneath it is overturned
  simplified_phrase: but below its surface, the earth is turned over
  preserved_meaning: Mining disturbs and overturns the earth beneath its productive surface.
  reasoning_layer_used: POB lexical rationale for וְתַחְתֶּיהָ and נֶהְפַּךְ, supported by chapter context
  rationale: Naming the earth again removes the unclear implied subject without changing the mining image.
- pob_phrase: as by fire
  simplified_phrase: as if by fire
  preserved_meaning: The overturning is compared to the effects or manner of fire without naming fire as the actual agent.
  reasoning_layer_used: POB ambiguity revision and lexical decision for כְּמוֹ אֵשׁ
  rationale: “As if by fire” makes the comparison natural while preserving its uncertainty.
interpretive_expansions:
- pob_phrase: beneath it
  rendering: below its surface
  claim: The verse contrasts the food-producing surface with the subterranean earth disturbed by mining.
  evidence:
  - The POB lexical rationale explicitly identifies a surface-versus-subterranean contrast.
  - Job 28 describes the extraction of resources from beneath the earth.
  confidence: high
  alternatives_preserved:
  - beneath it
  - underneath it
translation_notes:
  risk_flags:
  - risk: Readers may take fire as the actual agent of the overturning.
    mitigation: The wording “as if” and the footnote preserve the Hebrew as a comparison rather than a firm causal claim.
  - risk: The compressed Hebrew may compare the underside itself to fire rather than the manner of overturning.
    mitigation: The footnote retains this alternative reading.
