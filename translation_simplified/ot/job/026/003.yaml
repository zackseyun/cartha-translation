translation:
  language: en
  text: How well you have advised someone with no wisdom! You have made so much sound wisdom known![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can also be read as a question: “What advice have you given to someone with no wisdom, and what sound wisdom have you made known?” Job is speaking ironically.'
