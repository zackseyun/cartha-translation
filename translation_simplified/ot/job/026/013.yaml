translation:
  language: en
  text: His breath makes the heavens beautiful; his hand pierces the fleeing serpent.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his Spirit” or “his wind.” The Hebrew word can mean breath, wind, or spirit.
    reason: lexical_alternative
