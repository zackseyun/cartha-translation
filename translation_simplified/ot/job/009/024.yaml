translation:
  language: en
  text: The earth has been placed in the hands of the wicked.[a] He covers the faces of its judges.[b] If not, then who is it?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The land has been placed in the hands of a wicked man.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify who “he” is; it could be God, the wicked ruler, or someone else. “Covers the faces” may picture the judges being obscured or unable to see clearly.
    reason: alternative_reading
