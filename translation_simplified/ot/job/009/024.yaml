- pob_phrase: is given into the hand of
  simplified_phrase: is handed over to
  preserved_meaning: The earth is delivered into the power of the wicked while retaining an echo of the hand image.
  reasoning_layer_used: Lexical decisions for נִתְּנָה and בְיַד
  rationale: “Handed over” expresses the Hebrew power idiom in natural modern English.
- pob_phrase: If not, then who is it?
  simplified_phrase: If he is not doing this, then who is?
  preserved_meaning: The question challenges the hearer to identify the unnamed actor without deciding who he is.
  reasoning_layer_used: Lexical and theological decisions for אִם לֹא אֵפוֹא מִי הוּא
  rationale: The recast question clearly connects to the preceding action while preserving the actor’s identity as unresolved.
