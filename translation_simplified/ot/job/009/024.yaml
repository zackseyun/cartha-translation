translation:
  language: en
  text: The earth is handed over to the wicked.[a] He covers the faces of its judges.[b] If he is not doing this, then who is?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The land is handed over to a wicked man.” The Hebrew can refer to either the earth or a land, and to either the wicked generally or one wicked man.
    reason: lexical_alternative
  - marker: b
    text: Hebrew does not identify who “he” is. It may refer to God, the wicked ruler, or an unnamed actor.
    reason: alternative_reading
