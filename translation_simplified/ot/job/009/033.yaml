translation:
  language: en
  text: There is no one to judge between us,[a] no one who could lay his hand on us both.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mediate between us.” The Hebrew describes someone who decides or intervenes between two sides in a dispute.
    reason: lexical_alternative
  - marker: b
    text: Laying a hand on both sides pictures exercising authority over them.
    reason: simplification_note
simplification_decisions:
- pob_phrase: There is no arbiter between us
  simplified_phrase: There is no one to judge between us
  preserved_meaning: No third party exists to decide the dispute between Job and God.
  reasoning_layer_used: Lexical decision for מוֹכִיחַ and the theological decision to preserve the legal setting.
  rationale: The wording explains the uncommon term “arbiter” without importing a later theological conclusion.
- pob_phrase: who might lay his hand on us both
  simplified_phrase: no one who could lay his hand on us both
  preserved_meaning: The absent judge would have authority relating equally to both parties.
  reasoning_layer_used: Lexical decisions for יָשֵׁת, יָדוֹ, and עַל שְׁנֵינוּ.
  rationale: Repeating “no one” clarifies the sentence while preserving the concrete hand image and hypothetical force.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “lay his hand on” as physical aggression.
    mitigation: A brief footnote identifies the hand as an image of authority.
