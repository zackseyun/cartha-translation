  preserved_meaning: Job considers his blamelessness without claiming sinless perfection.
  reasoning_layer_used: Lexical decision for תָּם and the verse’s concessive sense
  rationale: “Even if” makes the concession clear in modern English.
- pob_phrase: it would prove me crooked
  simplified_phrase: my own mouth would show me as crooked
  preserved_meaning: Job’s speech would portray him as morally crooked even if he were blameless.
  reasoning_layer_used: Lexical and theological decisions for וַיַּעְקְשֵׁנִי
  rationale: Repeating the subject removes pronoun ambiguity while preserving the crooked image.
