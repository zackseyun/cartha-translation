translation:
  language: en
  text: If disaster lashes out and kills without warning, he mocks the innocent in their despair.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in their testing.” The rare Hebrew word may refer to testing or to melting away, collapse, and despair.
    reason: lexical_alternative
  - marker: b
    text: In context, “he” most likely refers to God, though the Hebrew does not name the subject explicitly.
    reason: source_note
simplification_decisions:
- pob_phrase: a scourge kills suddenly
  simplified_phrase: disaster lashes out and kills without warning
  preserved_meaning: A destructive calamity strikes like a whip and causes sudden death.
  reasoning_layer_used: POB lexical decisions for שׁוֹט, יָמִית, and פִּתְאֹם
  rationale: This replaces the uncommon noun “scourge” while preserving its lash image and broader sense of calamity.
- pob_phrase: the despair of the innocent
  simplified_phrase: the innocent in their despair
  preserved_meaning: Innocent people undergo the collapse or despair that is mocked.
  reasoning_layer_used: POB lexical decision and footnote for לְמַסַּת
  rationale: The recast phrase is natural English while the note retains the disputed sense “testing.”
- pob_phrase: he mocks
  simplified_phrase: he mocks
  preserved_meaning: The accusation remains sharp, and its unnamed masculine subject remains formally ambiguous.
  reasoning_layer_used: POB theological decision on the subject of יִלְעָג
  rationale: Keeping “he” avoids explicitly inserting God or personifying the disaster.
translation_notes:
  risk_flags:
