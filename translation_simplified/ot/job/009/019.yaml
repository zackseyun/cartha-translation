  rationale: “About” expresses the same comparison in everyday English.
- pob_phrase: behold, he is mighty
  simplified_phrase: look—he is mighty
  preserved_meaning: The attention-drawing force and God's overwhelming power remain intact.
  reasoning_layer_used: Lexical decisions for הִנֵּה and אַמִּיץ
  rationale: “Look” keeps the rhetorical emphasis without the archaic “behold.”
- pob_phrase: who can summon him?
  simplified_phrase: who can summon him to court?
  preserved_meaning: No one can compel God to answer Job's legal case.
  reasoning_layer_used: Lexical and theological decisions on יוֹעִידֵנִי and courtroom imagery
  rationale: Naming the court setting makes the intended legal sense immediately clear.
