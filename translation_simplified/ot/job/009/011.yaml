translation:
  language: en
  text: Look! He passes by me, but I do not see him. He moves on, but I am not aware of him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I do not understand him”; the Hebrew can refer to either discernment or understanding.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, he passes by me, and I do not see him
  simplified_phrase: Look! He passes by me, but I do not see him.
  preserved_meaning: Job vividly says that God passes near him without being seen.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The exclamation and contrast clarify the emphatic parallel without explicitly naming God.
- pob_phrase: he moves on, and I do not perceive him
  simplified_phrase: He moves on, but I am not aware of him.
  preserved_meaning: God continues past Job while remaining beyond Job’s discernment.
  reasoning_layer_used: POB lexical decision for אָבִין לוֹ and immediate context
  rationale: “Not aware of him” is natural English and avoids suggesting mere inattention.
translation_notes:
  risk_flags:
  - risk: “Not aware of him” does not fully express the Hebrew word’s possible sense of understanding.
    mitigation: The footnote preserves “I do not understand him” as a lexical alternative.
