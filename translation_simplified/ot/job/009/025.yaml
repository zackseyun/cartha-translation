- pob_phrase: My days are swifter than a runner
  simplified_phrase: My days race past faster than a runner
  preserved_meaning: Job’s days pass with greater speed than a runner.
  reasoning_layer_used: The lexical decisions identify speed as the sense of קַלוּ and retain the runner comparison.
  rationale: The active wording makes the rapid movement immediately clear.
- pob_phrase: they do not see good
  simplified_phrase: without seeing anything good
  preserved_meaning: Job’s passing days contain no experience of good, broadly understood.
  reasoning_layer_used: The lexical decision keeps “good” broad while allowing prosperity or well-being as possible senses.
  rationale: The smoother clause preserves both the personification and the breadth of “good.”
