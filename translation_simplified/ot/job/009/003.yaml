simplification_decisions:
- pob_phrase: If one wished to contend with him
  simplified_phrase: Suppose someone wanted to argue a case with him
  preserved_meaning: A person hypothetically tries to challenge him in a dispute with legal overtones.
  reasoning_layer_used: Lexical decision for ריב and immediate context
  rationale: “Argue a case” makes the legal-dispute sense of “contend” clear in common English.
- pob_phrase: he could not answer him
  simplified_phrase: They could not answer him
  preserved_meaning: The human challenger is unable to respond to the other party, understood from context as God.
  reasoning_layer_used: Theological decision on pronoun referents
  rationale: Singular “they” avoids the stiff generic “he” without inserting “God” into the text.
- pob_phrase: once in a thousand
  simplified_phrase: even once in a thousand
  preserved_meaning: The hyperbole stresses the extreme inability to give an adequate answer.
  reasoning_layer_used: Audited idiom revision
  rationale: “Even” highlights the disproportion while preserving the audited idiom.
