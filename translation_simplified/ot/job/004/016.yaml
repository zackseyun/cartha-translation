translation:
  language: en
  text: 'It stopped and stood there, but I could not tell what it looked like.[a] A shape was in front of me. There was silence,[b] and I heard a voice:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what he looked like.” The Hebrew has a masculine singular suffix, but the figure is unidentified.
    reason: lexical_alternative
  - marker: b
    text: Or “stillness.” The Hebrew can mean silence or hushed quiet.
    reason: lexical_alternative
