simplification_decisions:
- pob_phrase: It stood still
  simplified_phrase: It stood motionless
  preserved_meaning: The unidentified figure halted and remained still.
  reasoning_layer_used: Lexical decision for יַעֲמֹד
  rationale: “Motionless” makes the figure’s stillness immediately clear.
- pob_phrase: I could not recognize its appearance
  simplified_phrase: I could not make out what it looked like
  preserved_meaning: The speaker saw the figure but could not identify its visible appearance.
  reasoning_layer_used: Lexical decisions for וְלֹא אַכִּיר and מַרְאֵהוּ
  rationale: The natural phrase avoids implying that the speaker had seen it before and preserves its unidentified nature.
- pob_phrase: a form was before my eyes
  simplified_phrase: A shape was in front of me
  preserved_meaning: An indistinct visible form remained directly before the speaker.
  reasoning_layer_used: Lexical decisions for תְּמוּנָה and לְנֶגֶד עֵינַי
  rationale: “Shape” and “in front of me” express the visual scene in common English.
translation_notes:
  risk_flags:
  - risk: “Motionless” may emphasize lack of movement more than the basic verb “stood.”
    mitigation: The visionary sequence and POB rationale support the sense that the figure stood still.
  - risk: “Shape” may sound less personal than the masculine Hebrew suffix.
    mitigation: The apparition remains unidentified, and the neutral wording preserves that ambiguity.
