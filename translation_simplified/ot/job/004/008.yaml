translation:
  language: en
  text: From what I have seen, those who plow evil[a] and sow trouble[b] reap what they sow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wickedness.” The Hebrew word can mean moral evil or the trouble that results from it.
    reason: lexical_alternative
  - marker: b
    text: Or “misery” or “harm.”
    reason: lexical_alternative
