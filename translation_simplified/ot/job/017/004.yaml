translation:
  language: en
  text: For you have kept their hearts from understanding,[a] so you will not lift them up.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “hearts” means their inner capacity to think and discern, not only their emotions.
    reason: lexical_alternative
  - marker: b
    text: “Lift them up” may also mean “let them triumph.”
    reason: lexical_alternative
