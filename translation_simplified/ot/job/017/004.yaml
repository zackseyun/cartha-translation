  simplified_phrase: you have kept their hearts from understanding
  preserved_meaning: God has withheld understanding from their inner faculty of thought and will.
  reasoning_layer_used: POB lexical decisions for לִבָּם, צָפַנְתָּ, and מִשָּׂכֶל
  rationale: “Kept” and the natural English plural make the clause easier to read while retaining the Hebrew heart image.
- pob_phrase: therefore you will not exalt them
  simplified_phrase: so you will not lift them up
  preserved_meaning: God will not elevate them or grant them triumph.
  reasoning_layer_used: POB lexical decision for עַל כֵּן and לֹא תְרֹמֵם
  rationale: “So” clarifies the consequence, while “lift them up” preserves the source image in common English.
