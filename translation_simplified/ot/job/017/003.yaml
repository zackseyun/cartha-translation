translation:
  language: en
  text: Please, guarantee me before yourself.[a] Who else would shake hands with me to guarantee me?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses unusual legal language. Job asks God to provide security for him, though precisely how that security is “with” God remains unclear.
    reason: simplification_note
  - marker: b
    text: Shaking hands here means formally entering an agreement to guarantee someone.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Lay down, please, a pledge for me
  simplified_phrase: Please, guarantee me
  preserved_meaning: Job asks God to provide legal security on his behalf.
  reasoning_layer_used: POB lexical decision for עָרְבֵנִי
  rationale: The verb “guarantee” expresses the legal request in familiar English.
- pob_phrase: with yourself
  simplified_phrase: before yourself
  preserved_meaning: Job directs the unusual reflexive appeal to God without adding a separate act of holding the pledge.
  reasoning_layer_used: POB lexical rationale for עִמָּךְ and grounding review
  rationale: “Before yourself” keeps the relation to God while the note preserves its difficulty.
- pob_phrase: who else is there who would strike hands with me?
  simplified_phrase: Who else would shake hands with me to guarantee me?
  preserved_meaning: No other guarantor is available to enter the agreement with Job.
  reasoning_layer_used: POB lexical decisions for מִי הוּא and יִתָּקֵעַ
  rationale: The wording retains the hand gesture and directly explains its legal purpose.
interpretive_expansions:
- pob_phrase: strike hands with me
  rendering: shake hands with me to guarantee me
  claim: The hand gesture formally seals a guarantee agreement.
  evidence:
