translation:
  language: en
  text: People who plunder and destroy live undisturbed in their tents. Those who provoke God live securely—people who carry their god in their hands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew clause is difficult. Another possible rendering is “those into whose hand God brings.”
