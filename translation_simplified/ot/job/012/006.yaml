simplification_decisions:
- pob_phrase: The tents of destroyers are at ease
  simplified_phrase: People who plunder and destroy live undisturbed in their tents
  preserved_meaning: Violent despoilers enjoy quiet, undisturbed lives while the concrete image of tents remains.
  reasoning_layer_used: lexical decisions for יִשְׁלָיוּ, אֹהָלִים, and לְשֹׁדְדִים
  rationale: The recast clause explains “destroyers” and makes the poetic statement immediately clear.
- pob_phrase: those who provoke God are secure
  simplified_phrase: Those who provoke God live securely
  preserved_meaning: People who anger God nevertheless enjoy safety.
  reasoning_layer_used: lexical decisions for וּבַטֻּחוֹת and לְמַרְגִּיזֵי אֵל
  rationale: Adding “live” turns the compressed predicate into natural English without weakening its irony.
- pob_phrase: those who carry their god in their hand
  simplified_phrase: people who carry their god in their hands
  preserved_meaning: The wicked are pictured as holding the object of their trust or power.
  reasoning_layer_used: final source audit and theological decision on אֱלוֹהַּ
  rationale: The wording preserves the concrete hand-held-god image and the lowercase ironic sense.
translation_notes:
  risk_flags:
