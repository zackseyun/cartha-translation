simplification_decisions:
- pob_phrase: the leaders of the people of the land
  simplified_phrase: those who lead the people of the land
  preserved_meaning: The people’s rulers lose their ability to understand and judge well.
  reasoning_layer_used: POB lexical decision for רָאשֵׁי and contextual sense of לֵב
  rationale: The verbal wording makes the leadership role immediately clear without restoring the literal idiom “heads.”
- pob_phrase: and makes them wander in a trackless waste
  simplified_phrase: He makes them wander through a wasteland where there is no road
  preserved_meaning: God causes the disoriented leaders to wander in a desolate place with no path.
  reasoning_layer_used: POB lexical decisions for ויתעם, בְּתֹהוּ, and לֹא דָרֶךְ
  rationale: A second sentence and an explicit no-road clause preserve the image in more familiar language.
