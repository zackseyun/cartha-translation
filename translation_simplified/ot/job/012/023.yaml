simplification_decisions:
- pob_phrase: He makes nations great, and he destroys them
  simplified_phrase: He makes nations great, then destroys them
  preserved_meaning: God causes nations to become great and can afterward destroy them.
  reasoning_layer_used: lexical decision for מַשְׂגִּיא and reversal parallelism
  rationale: The direct wording avoids adding an unsupported image of nations rising.
- pob_phrase: he enlarges nations
  simplified_phrase: He makes nations larger
  preserved_meaning: God expands nations without implying that he scatters them.
  reasoning_layer_used: lexical decision for שֹׁטֵחַ
  rationale: This plain wording clearly communicates enlargement while allowing territory or influence.
- pob_phrase: and he destroys them; ... and he leads them away
  simplified_phrase: then destroys them. ... then leads them away
  preserved_meaning: God controls both national expansion and its reversal.
  reasoning_layer_used: theological decision on national movement
  rationale: Short sentences and “then” make the likely reversal pattern easy to follow.
interpretive_expansions:
- pob_phrase: and he destroys them; ... and he leads them away
  rendering: then destroys them. ... then leads them away
  claim: The actions are presented as expansion followed by reversal.
  evidence:
  - The POB theological rationale identifies likely reversal parallelism in context.
  confidence: moderate
  alternatives_preserved:
  - Expansion followed by guidance
translation_notes:
  risk_flags:
  - risk: “Then” states sequence more explicitly than the Hebrew conjunctions alone.
    mitigation: The POB contextual rationale supports this reading, and the footnote preserves the guidance alternative.
  - risk: “Makes nations larger” may suggest territorial growth more readily than broader influence.
    mitigation: The wording does not specify the kind of enlargement and remains broad enough to include influence.
