translation:
  language: en
  text: He makes nations great, then destroys them. He makes nations larger, then leads them away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He enlarges nations and guides them.” The Hebrew may describe expansion followed by guidance rather than reversal.
