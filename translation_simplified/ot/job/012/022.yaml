simplification_decisions:
- pob_phrase: reveals deep things out of darkness
  simplified_phrase: uncovers things hidden deep in darkness
  preserved_meaning: God makes deeply concealed things known.
  reasoning_layer_used: The lexical decisions allow both “uncovers” and the hidden sense of “deep things.”
  rationale: The new wording makes the image immediately understandable while retaining depth, concealment, and disclosure.
- pob_phrase: brings the shadow of death to light
  simplified_phrase: brings the shadow of death into the light
  preserved_meaning: God exposes even what lies under deathlike darkness.
  reasoning_layer_used: The lexical rationale says the movement is effectively into the light, while the theological decision retains “shadow of death.”
  rationale: Adding “the” makes the movement from darkness into light clearer without resolving the key ambiguity.
