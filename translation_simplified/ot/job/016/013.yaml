translation:
  language: en
  text: His archers surround me.[a] He tears open my kidneys[b] and shows me no mercy. He pours my gall out on the ground.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his great ones” or “his chiefs”; the Hebrew is difficult, but “archers” fits the attack imagery.
    reason: alternative_reading
  - marker: b
    text: The Hebrew names the kidneys, representing both inner organs and the innermost self.
    reason: cultural_note
  - marker: c
    text: Or “my bile”; the bodily meaning best fits this violent scene, though some understand “my bitterness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he splits open my kidneys
  simplified_phrase: He tears open my kidneys
  preserved_meaning: Job describes violent bodily rending through concrete anatomical imagery.
  reasoning_layer_used: Lexical and theological decisions on bodily imagery
  rationale: “Tears open” is immediate English without implying that the kidneys are torn into pieces.
- pob_phrase: does not spare
  simplified_phrase: shows me no mercy
  preserved_meaning: The attacker acts without pity or restraint.
  reasoning_layer_used: Lexical decision for לֹא יַחְמוֹל
  rationale: This common expression clearly states the attacker's lack of mercy.
- pob_phrase: he pours out my gall on the ground
  simplified_phrase: He pours my gall out on the ground
  preserved_meaning: The attacker deliberately empties Job's bile onto the ground.
  reasoning_layer_used: Lexical decisions for יִשְׁפֹּךְ and מְרֵרָתִי
  rationale: The natural word order keeps the deliberate pouring and vivid bodily image.
translation_notes:
  risk_flags:
