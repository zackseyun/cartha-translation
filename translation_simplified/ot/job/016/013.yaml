translation:
  language: en
  text: His archers close in around me.[a] Without mercy, he tears open my kidneys[b] and spills my gall[c] onto the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his great ones” or “his chiefs.” The Hebrew is difficult, but “archers” fits the attack imagery.
    reason: alternative_reading
  - marker: b
    text: The Hebrew literally names the kidneys, which can also represent a person’s innermost self.
    reason: cultural_note
  - marker: c
    text: Or “my bile”; some understand it figuratively as “my bitterness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: His archers surround me
  simplified_phrase: His archers close in around me
  preserved_meaning: Job is encircled by hostile attackers pictured as God’s archers.
  reasoning_layer_used: Lexical decision for יָסֹבּוּ and רַבָּיו
  rationale: “Close in around me” makes the threatening movement immediately clear.
- pob_phrase: he splits open my kidneys and does not spare
  simplified_phrase: Without mercy, he tears open my kidneys
  preserved_meaning: The attacker violently rends Job’s inner organs without pity.
  reasoning_layer_used: Lexical and theological decisions for יְפַלַּח, כִּלְיוֹתַי, and לֹא יַחְמוֹל
  rationale: The recast clause is natural English while retaining the visceral bodily image.
- pob_phrase: he pours out my gall on the ground
  simplified_phrase: spills my gall onto the ground
  preserved_meaning: Job’s gall is violently emptied onto the earth.
  reasoning_layer_used: Lexical decisions for יִשְׁפֹּךְ and מְרֵרָתִי
  rationale: “Spills” expresses the same physical image more directly in this violent context.
translation_notes:
  risk_flags:
