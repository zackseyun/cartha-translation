translation:
  language: en
  text: Earth, do not cover my blood.[a][c] Do not let my cry[b] find a place to rest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my bloodshed”; the Hebrew literally says “my blood” but may imply blood unjustly shed.
    reason: lexical_alternative
  - marker: b
    text: Or “my outcry”; this cry of distress may also be an appeal for justice.
    reason: lexical_alternative
  - marker: c
    text: Compare Genesis 4:10, where blood cries out from the ground for justice.
    reason: cross_reference
simplification_decisions:
- pob_phrase: O earth
  simplified_phrase: Earth
  preserved_meaning: Job directly addresses the earth in a solemn poetic appeal.
  reasoning_layer_used: Lexical decision for אֶרֶץ
  rationale: Removing “O” makes the address more natural in modern English without changing its force.
- pob_phrase: and let there be no resting place for my cry
  simplified_phrase: Do not let my cry find a place to rest
  preserved_meaning: Job asks that his cry not be stilled, settled, or hidden from notice.
  reasoning_layer_used: Applied revision and lexical decisions for יְהִי, מָקוֹם, and זעקתי
  rationale: The active wording clearly expresses the same poetic image in ordinary English.
translation_notes:
  risk_flags:
  - risk: “A place to rest” could sound comforting rather than like the silencing of Job’s appeal.
    mitigation: The negative command and the footnote on “cry” preserve the sense that his appeal must continue to be heard.
