    text: “Aha!” expresses the horse’s eager excitement and readiness for battle.
    reason: cultural_note
  - marker: b
    text: This may also be rendered “the roar of commanders and the shouting”; “thunder” is an image for loud battle noise.
    reason: lexical_alternative
