simplification_decisions:
- pob_phrase: Is it by your understanding that the hawk soars
  simplified_phrase: Is it your understanding that makes the hawk soar
  preserved_meaning: God asks whether the hawk’s flight happens by means of Job’s understanding.
  reasoning_layer_used: The lexical decision identifies Job’s understanding as the proposed means of the action.
  rationale: The active wording makes the rhetorical question easier to grasp without changing its force.
- pob_phrase: soars, spreading its wings
  simplified_phrase: soar and spread its wings
  preserved_meaning: The hawk both soars and extends its wings in flight.
  reasoning_layer_used: The lexical decisions preserve soaring and wing-spreading as distinct actions.
  rationale: Two coordinated verbs are clearer than the participial construction.
