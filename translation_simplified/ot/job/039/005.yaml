  text: Who set the wild donkey free? Who untied the wild donkey’s restraints?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word in the second question may refer to a particular kind of wild donkey. Some translations use “onager,” another name for a wild donkey.
