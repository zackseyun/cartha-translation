  rationale: “Set free” expresses the same action more directly.
- pob_phrase: the bonds of the swift donkey
  simplified_phrase: the wild donkey’s restraints
  preserved_meaning: The animal is pictured as freed from what would bind it.
  reasoning_layer_used: Lexical decisions for מֹסְרוֹת and עָרוֹד, qualified by the revision review.
  rationale: The possessive is easier to follow, and “wild” avoids presenting uncertain speed as certain.
