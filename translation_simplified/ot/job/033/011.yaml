translation:
  language: en
  text: He confines my feet in a restraining block; he watches[a] every path I take.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “guards.” The Hebrew can describe either watching or guarding, but here the context points to hostile scrutiny, not protection.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: puts my feet in the stocks
  simplified_phrase: confines my feet in a restraining block
  preserved_meaning: God places Job’s feet in a device that prevents him from moving freely.
  reasoning_layer_used: Lexical decision for בַּסַּד and its punitive confinement image.
  rationale: The wording explains the unfamiliar stocks image without removing the physical restraint.
- pob_phrase: all my paths
  simplified_phrase: every path I take
  preserved_meaning: God closely observes Job’s entire course of conduct.
  reasoning_layer_used: Lexical decision for אָרְחֹתַי and contextual scrutiny.
  rationale: The natural English phrase keeps the path metaphor while making Job’s movement through life clear.
translation_notes:
  risk_flags:
  - risk: “Confines” states the effect of being put in the restraining block more directly than the Hebrew verb “puts.”
    mitigation: The named restraint and punitive context make confinement inherent in the image.
  - risk: “Watches” might still be read as protective care.
    mitigation: The footnote preserves the ambiguity and identifies hostile scrutiny as the contextual reading.
