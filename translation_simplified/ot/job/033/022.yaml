translation:
  language: en
  text: His soul comes close to the pit,[a] and his life comes close to those who bring death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the grave” or “destruction.”
    reason: lexical_alternative
  - marker: b
    text: Or “the dead” or “the powers of death”; the Hebrew expression is difficult.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: His soul draws near to the pit
  simplified_phrase: His soul comes close to the pit
  preserved_meaning: The person is approaching death, pictured as a pit.
  reasoning_layer_used: POB lexical decisions for וַתִּקְרַב, לַשַּׁחַת, and נַפְשׁוֹ
  rationale: “Comes close” is more familiar English while “pit” keeps the concrete image.
- pob_phrase: and his life to those who bring death
  simplified_phrase: and his life comes close to those who bring death
  preserved_meaning: His life is approaching death-bringing agents or powers.
  reasoning_layer_used: POB lexical decision for לַמְמִתִים and poetic parallelism
  rationale: Repeating the verb makes the second poetic line immediately clear without resolving its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Soul” may be read as a technical immaterial part of a person.
    mitigation: The parallel phrase “his life” keeps the wording poetic rather than defining human nature.
  - risk: “Those who bring death” may sound limited to human killers.
    mitigation: Footnote b preserves the possible senses of the dead or the powers of death.
