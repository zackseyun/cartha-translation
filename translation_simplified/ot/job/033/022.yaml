translation:
  language: en
  text: His soul comes close to the pit,[a] and his life draws near to those who bring death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the grave” or “destruction.”
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew expression may also mean “the dead” or refer to the realm or powers of death.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: His soul draws near to the pit
  simplified_phrase: His soul comes close to the pit
  preserved_meaning: The person approaches death, pictured as a pit.
  reasoning_layer_used: Lexical decision for וַתִּקְרַב and לַשַּׁחַת
  rationale: “Comes close” is more familiar while “pit” preserves the concrete image.
- pob_phrase: and his life to those who bring death
  simplified_phrase: and his life draws near to those who bring death
  preserved_meaning: His life approaches death-bringing agents or powers.
  reasoning_layer_used: Lexical decision for לַמְמִתִים
  rationale: Repeating the verb makes the poetic parallel clear in ordinary English.
- pob_phrase: His soul ... and his life
  simplified_phrase: His soul ... and his life
  preserved_meaning: The parallel terms remain distinct without defining separate parts of a person.
  reasoning_layer_used: Theological decision on poetic anthropology
  rationale: Retaining both terms preserves the verse’s nuance without imposing strict dualism.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “soul” as a technical immaterial component.
    mitigation: The parallel phrase “his life” keeps the wording poetic rather than doctrinally precise.
  - risk: “Those who bring death” may sound exclusively like human killers.
    mitigation: Footnote b preserves readings involving the dead or the powers of death.
