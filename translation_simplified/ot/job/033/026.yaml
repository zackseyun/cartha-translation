  text: He earnestly prays to God, and God accepts him. He sees God’s face[a] and shouts for joy. Then God restores his righteousness—his right standing—to him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “his face”; the context most naturally identifies it as God’s face.
    reason: source_note
  - marker: b
    text: “Righteousness” may also mean his vindication, but the wording does not specify how God restores it.
    reason: lexical_alternative
