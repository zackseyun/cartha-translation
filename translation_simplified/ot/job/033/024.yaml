translation:
  language: en
  text: Then he shows him favor and says, “Rescue him from going down to the pit[a]. I have found a ransom[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The pit” may also refer to the grave or destruction, not merely a hole in the ground.
    reason: lexical_alternative
  - marker: b
    text: Or “a price of atonement”; the Hebrew refers to a payment that secures someone’s release.
    reason: lexical_alternative
