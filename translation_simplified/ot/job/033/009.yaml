translation:
  language: en
  text: “I am pure and have done nothing wrong. I am clean, and there is no guilt in me.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there is no wrongdoing in me”; the Hebrew word can refer to either iniquity or guilt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: without transgression
  simplified_phrase: have done nothing wrong
  preserved_meaning: The speaker emphatically claims to have committed no moral offense.
  reasoning_layer_used: Lexical decision for בְּלִי פָשַׁע and theological decision on the degree of Job’s claim
  rationale: Common wording preserves the direct claim without narrowing transgression to covenant rebellion.
- pob_phrase: there is no iniquity in me
  simplified_phrase: there is no guilt in me
  preserved_meaning: The speaker denies that guilt or wrongdoing belongs to him.
  reasoning_layer_used: Lexical decisions for עָוֺן and לִי
  rationale: “Guilt” is a documented sense and is clearer to modern readers than “iniquity.”
- pob_phrase: I am pure … I am clean
  simplified_phrase: I am pure … I am clean
  preserved_meaning: The paired images make an emphatic claim of moral purity and freedom from guilt.
  reasoning_layer_used: Lexical decisions for זַךְ and חַף
  rationale: Both plain English images are retained so the verse’s repetition and moral force remain distinct.
translation_notes:
  risk_flags:
  - risk: “Done nothing wrong” may sound broader than the moral-legal term “transgression.”
    mitigation: The surrounding claims of purity, cleanness, and guilt keep the statement in its moral context.
