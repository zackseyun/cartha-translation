  reasoning_layer_used: Lexical decisions for הֲשִׁיבֵנִי and דַּבֵּר
  rationale: Two short sentences make the invitation easier to follow without merging the commands.
- pob_phrase: for I desire to justify you
  simplified_phrase: because I want to show that you are in the right
  preserved_meaning: Elihu says he wants to find and demonstrate that Job is right if Job can answer.
