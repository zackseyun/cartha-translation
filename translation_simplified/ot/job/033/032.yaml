simplification_decisions:
- pob_phrase: If you have something to say
  simplified_phrase: If you have a reply
  preserved_meaning: Elihu invites Job to respond to what he has said.
  reasoning_layer_used: Lexical decision for יֵשׁ מִלִּין and immediate speech context
  rationale: “A reply” states the conversational sense more directly.
- pob_phrase: answer me; speak, for
  simplified_phrase: answer me. Speak, because
  preserved_meaning: Both direct commands and the reason for them remain distinct.
  reasoning_layer_used: Hebrew clause structure and lexical decisions for הֲשִׁיבֵנִי, דַּבֵּר, and כִּי
  rationale: Two short sentences make the invitation easier to follow.
- pob_phrase: declare you right
  simplified_phrase: declare that you are right
  preserved_meaning: Elihu wants to recognize Job as being in the right.
  reasoning_layer_used: POB lexical and theological decisions for צַדְּקֶךָ
  rationale: Adding “that” gives the expression natural modern syntax without doctrinal overtones.
translation_notes:
  risk_flags:
