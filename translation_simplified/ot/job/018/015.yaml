translation:
  language: en
  text: Sulfur settles in the tent that is no longer his;[a] it is scattered over his home.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may instead mean that something no longer his occupies his tent, or that nothing belonging to him remains there.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In his tent dwells no longer his
  simplified_phrase: Sulfur settles in the tent that is no longer his
  preserved_meaning: Sulfur occupies the wicked man’s former tent as a sign of judgment and dispossession.
  reasoning_layer_used: lexical and theological decisions
  rationale: Naming sulfur first makes the difficult clause clear while retaining the chosen dispossession reading.
- pob_phrase: over his dwelling
  simplified_phrase: over his home
  preserved_meaning: Sulfur is strewn over the place where he lived.
  reasoning_layer_used: lexical decision for נָוֵהוּ
  rationale: “Home” is clearer than “dwelling” and preserves the ruined-home image.
interpretive_expansions:
