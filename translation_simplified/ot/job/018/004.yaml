simplification_decisions:
- pob_phrase: You who tear yourself apart in your anger—
  simplified_phrase: You tear yourself apart in anger.
  preserved_meaning: Bildad directly rebukes Job for anger that harms him like a beast tearing prey.
  reasoning_layer_used: Lexical decisions for טֹרֵף, נַפְשׁוֹ, and בְּאַפּוֹ
  rationale: A complete short sentence keeps the violent image while making the rebuke immediate.
- pob_phrase: shall the earth be abandoned for your sake
  simplified_phrase: Should the earth be abandoned just for you
  preserved_meaning: Bildad asks whether the world’s order should change because of Job.
  reasoning_layer_used: Theological decision on referent and rhetorical force
  rationale: “Just for you” expresses the personal force of the rhetorical question in common English.
