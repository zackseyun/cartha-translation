  rationale: The plural wording is more natural while preserving the loss of successive generations.
- pob_phrase: and no survivor where he lived
  simplified_phrase: No one remains where he lived.
  preserved_meaning: Nobody is left in his former place of residence.
  reasoning_layer_used: POB lexical decisions
  rationale: A short independent sentence expresses “survivor” in direct common English.
