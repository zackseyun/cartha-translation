  text: His bull breeds successfully.[a] His cow gives birth and does not miscarry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may also mean “does not cast off” or “does not make barren.” Here it means that the bull’s breeding succeeds.
