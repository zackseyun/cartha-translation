translation:
  language: en
  text: Does God hold back a man’s punishment and save it for his sons? Let God punish the man himself, so that he knows it firsthand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean “wrongdoing,” “trouble,” or the punishment that wrongdoing brings; here the context favors “punishment.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: store up a man's punishment for his sons
  simplified_phrase: hold back a man’s punishment and save it for his sons
  preserved_meaning: God reserves the offender’s punishment for his sons instead of bringing it on him.
  reasoning_layer_used: lexical and theological decisions
  rationale: The two common verbs clarify the image of punishment being reserved for later.
- pob_phrase: Let him repay it to the man himself
  simplified_phrase: Let God punish the man himself
  preserved_meaning: God should bring the punishment on the offender rather than on his sons.
  reasoning_layer_used: lexical decision and source audit
  rationale: Naming God and saying “punish” avoids making “repay” sound like compensation.
interpretive_expansions:
- pob_phrase: so that he may know it
  rendering: so that he knows it firsthand
  claim: The man personally experiences the punishment rather than merely hearing about it.
  evidence:
  - The lexical rationale says “know” here includes experiencing the punishment.
  - The contrast with his sons points to the offender facing it himself.
  confidence: high
  alternatives_preserved:
  - so that he may know it
  - so that he may feel it
translation_notes:
  risk_flags:
  - risk: “Punish” does not retain the exact repayment wording.
    mitigation: It clearly preserves punishment as what God brings on the offender himself.
