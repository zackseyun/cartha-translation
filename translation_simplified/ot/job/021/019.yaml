translation:
  language: en
  text: Does God store up a man’s punishment[c] for his sons?[b] Let God punish the man himself, so that he experiences it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also read as a statement rather than a question, but the context favors Job challenging this idea.
    reason: alternative_reading
  - marker: b
    text: “Sons” may refer more broadly to a man’s descendants.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may mean iniquity, trouble, or the punishment resulting from wrongdoing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: God stores up his iniquity for his sons?
  simplified_phrase: Does God store up a man’s punishment for his sons?
  preserved_meaning: Job challenges the idea that God reserves a wicked man’s consequences for his sons.
  reasoning_layer_used: lexical decision for אוֹנוֹ and theological discourse decision
  rationale: “Punishment” clearly expresses the contextual sense without suggesting that guilt is transferred.
- pob_phrase: Let him repay it to the man himself
  simplified_phrase: Let God punish the man himself
  preserved_meaning: Job calls for the guilty man, rather than his sons, to receive the consequence.
  reasoning_layer_used: lexical decisions for יְשַׁלֵּם and אֵלָיו
  rationale: Naming God and using “punish” prevents “repay the man” from sounding like a reward.
- pob_phrase: so that he may know it
  simplified_phrase: so that he experiences it
  preserved_meaning: The man personally knows the punishment by undergoing it.
  reasoning_layer_used: lexical rationale for וְיֵדָע
  rationale: “Experiences it” states the contextual force of personally knowing the consequence.
interpretive_expansions:
- pob_phrase: so that he may know it
  rendering: so that he experiences it
  claim: Knowing here includes personally undergoing the punishment.
  evidence:
  - The lexical rationale says the man should experience and know the repayment.
  - The contrast requires the man himself, not his sons, to receive it.
  confidence: high
  alternatives_preserved:
  - so that he may know it
  - so that he may feel it
translation_notes:
  risk_flags:
  - risk: “Punishment” selects the contextual consequence sense from a Hebrew term with a broader range.
    mitigation: Footnote [c] preserves the principal lexical alternatives.
  - risk: The rhetorical question is contextually favored but not grammatically required.
    mitigation: Footnote [a] preserves the possible statement reading.
