  preserved_meaning: The concrete lamp image and its reference to those who do evil remain intact.
  reasoning_layer_used: POB lexical decision for נֵר and רְשָׁעִים
  rationale: The fuller noun phrase is easier for a new reader than the substantive “the wicked.”
- pob_phrase: does their disaster come upon them
  simplified_phrase: does disaster overtake them
  preserved_meaning: Calamity is pictured as arriving and catching up with them.
  reasoning_layer_used: POB lexical decision for אֵיד and clause-level rationale
  rationale: “Overtake” expresses the image in more natural modern English.
- pob_phrase: does he apportion pains in his anger
  simplified_phrase: does he deal out pain in his anger
  preserved_meaning: He distributes painful affliction as an act of anger.
  reasoning_layer_used: POB lexical decisions for חֲבָלִים, יְחַלֵּק, and בְּאַפּוֹ
  rationale: “Deal out” replaces the uncommon “apportion” while retaining the distribution image.
