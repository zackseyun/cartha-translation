translation:
  language: en
  text: How often is the lamp of wicked people put out?[a][b] How often does disaster overtake them? How often does he give them a share of suffering in his anger?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The question challenges the claim that the wicked are regularly judged this way.
    reason: source_note
  - marker: b
    text: The lamp is an image of a person’s life, prosperity, or continuing good fortune.
    reason: cultural_note
  - marker: c
    text: The Hebrew word translated “suffering” can also mean sorrows, pains, or birth pangs.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: People characterized by wickedness remain the subject.
  reasoning_layer_used: POB lexical decision for רְשָׁעִים
  rationale: The fuller phrase is immediately clear to readers unfamiliar with biblical shorthand.
- pob_phrase: and does their disaster come upon them?
  simplified_phrase: How often does disaster overtake them?
  preserved_meaning: Job questions how regularly calamity reaches wicked people.
  reasoning_layer_used: POB lexical rationale for כַּמָּה and אֵיד
  rationale: A separate question makes the shared emphasis on frequency easier to follow.
- pob_phrase: Does he apportion sorrows in his anger?
  simplified_phrase: How often does he give them a share of suffering in his anger?
  preserved_meaning: He assigns painful affliction as judgment while angry.
  reasoning_layer_used: POB lexical decisions for חֲבָלִים, יְחַלֵּק, and בְּאַפּוֹ
  rationale: “Give them a share” preserves the distribution image without the uncommon verb “apportion.”
interpretive_expansions:
