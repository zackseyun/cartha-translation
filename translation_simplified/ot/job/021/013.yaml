translation:
  language: en
  text: They live out their days in prosperity, then in an instant they go down to Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it may also be translated “the grave” or “death.”
