simplification_decisions:
- pob_phrase: They spend their days in prosperity
  simplified_phrase: They live out their days in prosperity
  preserved_meaning: Their lifetime passes in well-being and material ease.
  reasoning_layer_used: Lexical decisions for יבלו, בַטּוֹב, and יְמֵיהֶם
  rationale: “Live out their days” states the temporal sense in more immediate English.
- pob_phrase: and in a moment
  simplified_phrase: then in an instant
  preserved_meaning: Their prosperous lifetime contrasts with a sudden descent to death.
  reasoning_layer_used: Lexical decision for וּבְרֶגַע and immediate contrast
  rationale: “Then in an instant” makes the sequence and sharp contrast easy to grasp.
- pob_phrase: they go down to Sheol
  simplified_phrase: they go down to Sheol
  preserved_meaning: The downward image and the broad Hebrew concept of the destination of the dead remain intact.
  reasoning_layer_used: Lexical and theological decisions for שְׁאוֹל and יֵחָתּוּ
  rationale: The phrase is retained because replacing Sheol with a narrower term would resolve its openness.
