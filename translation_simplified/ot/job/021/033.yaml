translation:
  language: en
  text: The valley’s lumps of earth are sweet to him.[a] All people follow after him, while those ahead of him are too many to count.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This burial image describes the earth of the grave as pleasant or restful to him; “valley” may also mean a ravine or streambed.
    reason: simplification_note
  - marker: b
    text: This may picture a funeral procession or the countless people who die before and after him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The clods of the valley
  simplified_phrase: The valley’s lumps of earth
  preserved_meaning: The concrete image of burial earth remains.
  reasoning_layer_used: Lexical decision for רִגְבֵי נָחַל
  rationale: Common words replace the less familiar “clods” without removing the grave-earth image.
- pob_phrase: all mankind
  simplified_phrase: All people
  preserved_meaning: The phrase still refers collectively to humanity, not only to men.
  reasoning_layer_used: Lexical decision for כָּל אָדָם
  rationale: “All people” expresses the generic human sense in familiar English.
- pob_phrase: those before him are without number
  simplified_phrase: those ahead of him are too many to count
  preserved_meaning: An innumerable multitude precedes him spatially or in death.
  reasoning_layer_used: Lexical decisions for וּלְפָנָיו and אֵין מִסְפָּר
  rationale: The idiom becomes immediately clear while retaining the procession and mortality possibilities.
