translation:
  language: en
  text: You clothed me in skin and flesh, and wove me together[a] with bones and tendons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “covered me with bones and tendons.” The Hebrew verb can mean weaving together, covering, or enclosing.
