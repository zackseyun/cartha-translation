translation:
  language: en
  text: Is it good for you to oppress me, to despise what your own hands have made, and to shine with favor on the plans of the wicked?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “show favor to the plans of the wicked.” The Hebrew literally says “shine upon.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that you oppress
  simplified_phrase: to oppress me
  preserved_meaning: Job directly accuses God of oppression.
  reasoning_layer_used: Immediate context and theological decision
  rationale: Naming Job as the implied object makes the accusation natural in English without softening it.
- pob_phrase: the work of your hands
  simplified_phrase: what your own hands have made
  preserved_meaning: Job describes himself as the product of God's creative work.
  reasoning_layer_used: Lexical decision
  rationale: The wording explains the handwork image in ordinary English while retaining it.
- pob_phrase: shine upon the counsel of the wicked
  simplified_phrase: shine with favor on the plans of the wicked
  preserved_meaning: God is challenged for appearing to favor what wicked people plan.
  reasoning_layer_used: Lexical decision and footnote
  rationale: The revision preserves the shining image while making its likely favorable sense clear.
