translation:
  language: en
  text: You made me like clay—please remember that.[a] Will you turn me back to dust?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “like clay,” not explicitly “from clay,” though it recalls the creation of humanity from the earth.
    reason: lexical_alternative
  - marker: b
    text: 'The last sentence may also be read as a statement: “You will turn me back to dust.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Remember, please, that you made me like clay
  simplified_phrase: You made me like clay—please remember that
  preserved_meaning: Job appeals directly to God to remember that God made him like clay.
  reasoning_layer_used: Lexical decisions for זְכָר, נָא, כַחֹמֶר, and עֲשִׂיתָנִי
  rationale: Reordering the appeal makes it easier to follow while retaining its prayerful force and clay image.
- pob_phrase: will you return me to dust?
  simplified_phrase: Will you turn me back to dust?
  preserved_meaning: Job protests that God may bring him back to the dust of death.
  reasoning_layer_used: Lexical decision for תְּשִׁיבֵנִי and the theological decision on interrogative force
  rationale: “Turn me back” expresses caused return in natural English without weakening the rhetorical question.
