  reasoning_layer_used: Lexical decisions for וְתֶרֶב, כַּעַשְׂךָ, and עִמָּדִי.
  rationale: Adding “keep” expresses the continuing action while preserving God as the actor.
- pob_phrase: relays and an army are against me
