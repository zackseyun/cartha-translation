translation:
  language: en
  text: a gloomy land, like deep darkness—a land of the shadow of death[a], where nothing is in order and even its light is like deep darkness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deep shadow”; the Hebrew can refer specifically to death’s shadow or more generally to very deep darkness.
    reason: lexical_alternative
