translation:
  language: en
  text: You know that I am not wicked,[a] yet no one can rescue me from your hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I am not guilty.” Job denies belonging among the wicked; he is not claiming to be completely sinless.
    reason: lexical_alternative
  - marker: b
    text: God’s “hand” means his power or control.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Though you know that I am not wicked
  simplified_phrase: You know that I am not wicked, yet
  preserved_meaning: God knows Job is not among the wicked, despite how he is treating him.
  reasoning_layer_used: Hebrew idiom and immediate context
  rationale: Moving the contrast to “yet” makes the complaint easier to follow without weakening it.
- pob_phrase: deliver me
  simplified_phrase: rescue me
  preserved_meaning: No one can free Job from God’s control.
  reasoning_layer_used: Lexical decision for מַצִּיל
  rationale: “Rescue” is more familiar English while retaining the supplied object “me.”
translation_notes:
  risk_flags:
  - risk: “Not wicked” could be mistaken for a claim of absolute sinlessness.
    mitigation: Footnote a preserves the POB’s narrower theological claim.
  - risk: “From your hand” may be read only as a physical image.
    mitigation: Footnote b explains that the image refers to God’s power or control.
