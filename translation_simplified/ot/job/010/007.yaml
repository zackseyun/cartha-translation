translation:
  language: en
  text: You know that I am not wicked. Yet no one can rescue me from your hand.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “not guilty.” Job denies being a wicked man, not that he has ever sinned.
    reason: lexical_alternative
  - marker: b
    text: “From your hand” means from your power or control.
    reason: cultural_note
