  preserved_meaning: God’s sight is contrasted with embodied human sight while the concrete flesh image remains.
  reasoning_layer_used: Lexical and theological decisions on בָשָׂר and anthropomorphic language
  rationale: The recast question makes the unusual image immediately understandable without explaining it away.
- pob_phrase: do you see as a man sees?
