simplification_decisions:
- pob_phrase: Do you have eyes of flesh
  simplified_phrase: Are your eyes made of flesh
  preserved_meaning: The question retains the concrete image of embodied, human sight.
  reasoning_layer_used: Lexical decision for בָשָׂר and the anthropomorphic theological decision
  rationale: “Made of flesh” makes the unusual image easier to grasp without replacing it with an abstract explanation.
- pob_phrase: do you see as a man sees
  simplified_phrase: do you see the way a man does
  preserved_meaning: God’s perception is contrasted with the limited way a human sees.
  reasoning_layer_used: Lexical decisions for כִּרְאֹות, אֱנוֹשׁ, and תִּרְאֶה
  rationale: The recast comparison is natural modern English while retaining the generic singular “man.”
