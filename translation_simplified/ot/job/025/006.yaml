  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common wording clarifies both human referents while the footnote preserves the Hebrew idiom.
- pob_phrase: who is a maggot, and ... who is a worm
  simplified_phrase: who is a maggot, and ... who is a worm
  preserved_meaning: The distinct images form two balanced descriptions of humanity's lowliness and frailty.
  reasoning_layer_used: POB lexical decisions
  rationale: Keeping both clauses preserves the parallel structure and the force of each image.
