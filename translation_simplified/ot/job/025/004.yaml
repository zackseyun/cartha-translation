translation:
  language: en
  text: So how can a human being be righteous before God?[a] How can anyone born of woman be pure?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “with God,” referring here to a person’s standing before him.
    reason: lexical_alternative
  - marker: b
