  reasoning_layer_used: Lexical and theological decisions on generic human language
  rationale: “A human being” is immediately clear to modern readers while keeping the generic sense.
- pob_phrase: And how can one born of woman
  simplified_phrase: How can anyone born of woman
  preserved_meaning: Every mortal human is included in the rhetorical question.
  reasoning_layer_used: Lexical decision for יְלוּד אִשָּׁה
  rationale: “Anyone” clarifies the inclusive force while preserving the source-language image.
