translation:
  language: en
  text: They are driven out from among the people.[b] People shout after them as they would after a thief.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify who is shouting. It may also be understood, “They shout against them as against a thief.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase may instead refer to a ravine, valley, or gorge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: driven out from the midst
  simplified_phrase: driven out from among the people
  preserved_meaning: They are forcibly excluded from human society.
  reasoning_layer_used: POB displayed text, lexical alternatives, and immediate context
  rationale: “From among the people” makes the likely social sense of “the midst” clear without importing a definite landform.
- pob_phrase: they shout after them as after a thief
  simplified_phrase: People shout after them as they would after a thief
  preserved_meaning: Hostile shouts pursue the outcasts just as people would pursue a thief.
  reasoning_layer_used: POB lexical decisions for יָרִיעוּ, עָלֵימוֹ, and כַּגַּנָּב
  rationale: The recast wording clearly distinguishes the outcasts from the unidentified shouters.
interpretive_expansions:
- pob_phrase: from the midst
  rendering: from among the people
  claim: The expulsion is from human society rather than securely from a particular landform.
  evidence:
  - The displayed POB text chooses “the midst.”
  - The hostile shouting in the same verse supports social exclusion.
  confidence: moderate
  alternatives_preserved:
  - from a ravine
  - from a valley or gorge
- pob_phrase: they shout
  rendering: People shout
  claim: The shouters are unidentified people distinct from those being expelled.
  evidence:
  - The Hebrew verb leaves its subject unstated.
  - The phrase “after them” distinguishes the targets from the shouters.
  - The POB lexical audit permits the indefinite subject “people.”
  confidence: moderate
  alternatives_preserved:
  - They shout against them.
  - A shout is raised against them.
translation_notes:
  risk_flags:
  - risk: “Among the people” makes the likely social setting explicit although the Hebrew can denote a landform.
    mitigation: Footnote b preserves the ravine, valley, and gorge alternatives.
  - risk: Supplying “People” resolves an unstated Hebrew subject.
    mitigation: Footnote a states that the subject is unidentified and preserves an alternative construction.
