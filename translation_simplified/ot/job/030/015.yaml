translation:
  language: en
  text: Terrors have turned against me. They chase my honorable standing like the wind,[a] and my salvation[b] disappears like a cloud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my dignity,” “my nobility,” or “my prosperity.” The Hebrew refers to an honored or exalted condition.
    reason: lexical_alternative
  - marker: b
    text: Or “my deliverance” or “my well-being.” Here “salvation” can refer broadly to rescue or welfare.
    reason: lexical_alternative
