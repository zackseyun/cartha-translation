  preserved_meaning: God acts against Job with great strength, pictured through his hand.
  reasoning_layer_used: Lexical and theological decisions for בְּעֹצֶם יָדְךָ
  rationale: The shorter wording is natural while preserving the concrete image of God’s hand.
- pob_phrase: you oppose me
  simplified_phrase: you oppose me
  preserved_meaning: Job accuses God of acting against him with hostility.
  reasoning_layer_used: POB main-text decision and lexical range for תִשְׂטְמֵנִי
  rationale: “Oppose” preserves hostile action without adding the extended pursuit implied by “persecute.”
