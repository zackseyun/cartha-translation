translation:
  language: en
  text: So my lyre[a] now plays music of mourning, and my pipe[b] joins the sound of people weeping.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “harp”; the Hebrew names an ancient stringed instrument.
