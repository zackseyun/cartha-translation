- pob_phrase: my lyre has become mourning
  simplified_phrase: my lyre now plays music of mourning
  preserved_meaning: Job’s music has been transformed into an expression of grief.
  reasoning_layer_used: The lexical decisions identify a resultant state and preserve the contrast between music and mourning.
  rationale: The rewrite states plainly how the instrument expresses Job’s changed condition.
- pob_phrase: my pipe the sound of those who weep
  simplified_phrase: my pipe joins the sound of people weeping
  preserved_meaning: The pipe is now associated with and accompanies weeping.
  reasoning_layer_used: The lexical rationale says the construction can express accompaniment or association.
  rationale: “Joins” makes the compressed poetic clause understandable without specifying the instrument’s exact form.
