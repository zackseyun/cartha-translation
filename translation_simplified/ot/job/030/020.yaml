simplification_decisions:
- pob_phrase: you do not answer me
  simplified_phrase: you give me no answer
  preserved_meaning: Job directly complains that God does not respond.
  reasoning_layer_used: Lexical decision for תַעֲנֵנִי and the theological decision on unanswered prayer.
  rationale: This is natural English without implying that God refuses to save.
- pob_phrase: you only look at me
  simplified_phrase: you do nothing but look at me
  preserved_meaning: God observes Job without answering or intervening.
  reasoning_layer_used: Lexical rationale for וַתִּתְבֹּנֶן and the preserved theological tension.
  rationale: The fuller phrase makes the audited contrast expressed by “only” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Do nothing but” may sound stronger than the Hebrew verb by itself.
    mitigation: It preserves the POB’s audited “only” without adding that God ignores Job or refuses to save.
  - risk: The main text favors the POB’s vivid present-time reading.
    mitigation: The footnote preserves the possible past-time sense and attentive-looking nuance.
