translation:
  language: en
  text: I cry to you, but you give me no answer. I stand, and you do nothing but look at me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can also be understood in past time: “I stood, and you looked closely at me.”'
