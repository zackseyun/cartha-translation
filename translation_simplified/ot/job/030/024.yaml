translation:
  language: en
  text: Yet does anyone amid the ruins reach out a hand or cry for help in disaster?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of this verse is very uncertain. It may instead refer to someone striking a ruined person who is crying for help in disaster; other meanings are also possible.
