simplification_decisions:
- pob_phrase: does not one
  simplified_phrase: does anyone
  preserved_meaning: The question keeps an indefinite person as its subject without turning it into a universal negative.
  reasoning_layer_used: Independent grounding review and final source audit
  rationale: The modern question form avoids resolving the verse’s uncertain rhetorical force.
- pob_phrase: amid ruins
  simplified_phrase: amid the ruins
  preserved_meaning: The concrete image of devastation remains without specifying a particular ruin heap.
  reasoning_layer_used: Lexical decision for בְּעִי and independent grounding review
  rationale: The added article makes the visual setting clearer and less abstract.
- pob_phrase: stretch out a hand
  simplified_phrase: reach out a hand
  preserved_meaning: The image of extending a hand remains while its precise purpose stays open.
  reasoning_layer_used: Lexical decision for יִשְׁלַח יָד and final source audit
  rationale: “Reach out” is natural modern English and preserves the physical gesture.
