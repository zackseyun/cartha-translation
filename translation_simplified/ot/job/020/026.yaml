translation:
  language: en
  text: Total darkness is reserved for his treasures. A fire that no one has fanned will consume him. It will harm whatever is left in his tent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last sentence may instead mean, “It will harm the survivor in his tent.”
