translation:
  language: en
  text: All darkness is stored up for his hidden treasures.[a] A fire no one has fanned will consume him. It will feed on whatever remains in his tent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “All darkness is stored up for him.” The Hebrew may refer either to disaster reserved for him or to darkness awaiting his hidden stores.
    reason: alternative_reading
  - marker: b
    text: Or “It will harm the survivor in his tent” or “consume the remnant in his tent.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All darkness is hidden up for his treasures
  simplified_phrase: All darkness is stored up for his hidden treasures
  preserved_meaning: Darkness remains an image of calamity reserved in connection with what he has stored away.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: “Stored up” clearly expresses future reservation, while “hidden treasures” preserves the difficult wordplay.
- pob_phrase: a fire not blown
  simplified_phrase: A fire no one has fanned
  preserved_meaning: The fire needs no human blowing or tending.
  reasoning_layer_used: POB lexical decision for לֹא נֻפָּח
  rationale: “No one has fanned” makes the ancient fire image natural without explicitly assigning its source.
- pob_phrase: what remains in his tent
  simplified_phrase: whatever remains in his tent
  preserved_meaning: The fire destroys what is left in his household or dwelling without specifying whether people or property are meant.
  reasoning_layer_used: POB lexical decisions for שָׂרִיד and בְּאָהֳלוֹ
  rationale: “Whatever” reads naturally while retaining the deliberately broad reference and the tent image.
translation_notes:
  risk_flags:
  - risk: “Hidden treasures” may suggest valuables more narrowly than the difficult Hebrew requires.
    mitigation: Footnote a preserves the broader reading that calamity is stored up for him.
  - risk: “Whatever remains” favors an impersonal remnant over a surviving person.
    mitigation: Footnote b records the personal and remnant alternatives.
