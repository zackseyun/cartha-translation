simplification_decisions:
- pob_phrase: is stored up for his treasures
  simplified_phrase: is reserved for his treasures
  preserved_meaning: Darkness is being kept for his treasures, without saying who stored the treasures.
  reasoning_layer_used: POB lexical decision and source audit
  rationale: “Reserved” clearly expresses future judgment while preserving the difficult relation to his treasures.
- pob_phrase: a fire not fanned
  simplified_phrase: a fire that no one has fanned
  preserved_meaning: The destructive fire burns without anyone supplying it by blowing.
  reasoning_layer_used: POB lexical rationale
  rationale: The full clause is more natural than the compressed passive wording.
- pob_phrase: what remains in his tent
  simplified_phrase: whatever is left in his tent
  preserved_meaning: The fire harms the remaining person, household, or property without deciding which is meant.
  reasoning_layer_used: POB source audit and alternative reading
  rationale: “Whatever is left” is plain English and keeps the object broad.
