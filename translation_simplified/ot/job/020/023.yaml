  preserved_meaning: God directs his fierce judgment against the wicked man through the image of a storm.
  reasoning_layer_used: Theological subject decision and lexical rain image
  rationale: Two sentences clarify the subject while preserving the distinct sending and raining actions.
- pob_phrase: as his food
