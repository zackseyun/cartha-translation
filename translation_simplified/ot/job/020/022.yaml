  preserved_meaning: His distress begins when his success and plenty are fullest.
  reasoning_layer_used: POB lexical decisions for בִּמְלֹאות and שִׂפְקוֹ
  rationale: This uses documented alternatives to express the timing naturally.
- pob_phrase: distress will come upon him
  simplified_phrase: distress will close in on him
  preserved_meaning: He will be overtaken by constricting trouble.
  reasoning_layer_used: POB lexical decision for יֵצֶר לוֹ
  rationale: “Close in” clearly preserves the Hebrew image of constriction.
- pob_phrase: every hand of the miserable
  simplified_phrase: every hand of those in misery
  preserved_meaning: All suffering people represented by their hostile hands will oppose him.
  reasoning_layer_used: POB lexical decisions for יַד and עָמֵל
  rationale: The rewrite explains “miserable” without removing the vivid hand image.
