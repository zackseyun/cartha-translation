translation:
  language: en
  text: At the height of his prosperity,[a] distress will close in on him; every hand of those in misery will come against him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “When he has all he needs, he will be in distress.”
    reason: lexical_alternative
  - marker: b
    text: “Those in misery” may also mean “the afflicted” or “the toilers.”
    reason: lexical_alternative
