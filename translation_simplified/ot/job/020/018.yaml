translation:
  language: en
  text: He gives back what he worked to gain and does not swallow it down. He does not rejoice in the wealth he gained through exchange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compact Hebrew may also mean, “He returns what his labor produced and does not consume it; according to the wealth received in exchange, he does not rejoice.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: what he labored for
  simplified_phrase: what he worked to gain
  preserved_meaning: He returns the economic result of his labor.
  reasoning_layer_used: lexical decision for יָגָע
  rationale: The wording clearly distinguishes what he gained from the work itself.
- pob_phrase: does not swallow it down
  simplified_phrase: does not swallow it down
  preserved_meaning: He does not consume or keep what he gained.
  reasoning_layer_used: lexical decision for וְלֹא יִבְלָע
  rationale: The vivid swallowing image and the Hebrew’s simple negation are both retained.
- pob_phrase: according to the wealth of his exchange, he does not rejoice
  simplified_phrase: He does not rejoice in the wealth he gained through exchange
  preserved_meaning: The wealth acquired through exchange brings him no joy.
  reasoning_layer_used: lexical decisions for כְּחֵיל, תְּמוּרָתוֹ, and וְלֹא יַעֲלֹס
  rationale: The main idea is stated naturally while the compact Hebrew construction remains noted.
