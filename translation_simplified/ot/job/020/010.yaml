translation:
  language: en
  text: His sons will seek the goodwill of the poor,[a] and he will give back his wealth with his own hands.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seek to appease the poor”; the Hebrew may refer to placating people who were wronged.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean his possessions or strength, though “wealth” best fits this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will seek the favor of the poor
  simplified_phrase: will seek the goodwill of the poor
  preserved_meaning: His sons will seek acceptance from the poor, likely because the poor were wronged.
  reasoning_layer_used: POB lexical decision for יְרַצּוּ and its contextual rationale
  rationale: “Seek the goodwill” keeps the relational sense without adding uncertainty about the outcome.
- pob_phrase: and his own hands will give back his wealth
  simplified_phrase: and he will give back his wealth with his own hands
  preserved_meaning: The man himself will restore his wealth rather than leaving restitution only to his sons.
  reasoning_layer_used: POB lexical decisions for יָדָיו, תָּשֵׁבְנָה, and אוֹנוֹ
  rationale: The natural English clause retains the emphatic image of repayment with his own hands.
translation_notes:
  risk_flags:
  - risk: “Goodwill” may sound less corrective than “appease.”
    mitigation: Footnote [a] preserves the stronger sense of placating people who were wronged.
  - risk: “Wealth” narrows a Hebrew noun that can also mean possessions or strength.
    mitigation: Footnote [b] preserves the wider lexical range while retaining the best contextual meaning.
