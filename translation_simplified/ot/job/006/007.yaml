translation:
  language: en
  text: I refuse even to touch them. They are like sickening food to me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may also mean, “My appetite refuses to touch them; they are like diseased food to me,” or, “they are like food that makes me sick.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My soul refuses to touch them
  simplified_phrase: I refuse even to touch them
  preserved_meaning: Job himself strongly rejects contact with the repulsive things.
  reasoning_layer_used: POB lexical decisions for נַפְשִׁי and לִנְגּוֹעַ
  rationale: First-person wording reads naturally without narrowing nephesh to either soul or appetite.
- pob_phrase: they are like the sickness of my food
  simplified_phrase: They are like sickening food to me
  preserved_meaning: The food image conveys Job’s revulsion while retaining its association with sickness.
  reasoning_layer_used: POB lexical decisions for כִּדְוֵי and לַחְמִי, plus POB footnote b
  rationale: “Sickening food” is understandable but does not make disease intrinsic to the food.
translation_notes:
  risk_flags:
  - risk: “Sickening food” may suggest revulsion more strongly than other possible relations between sickness and food.
    mitigation: The footnote preserves the main alternatives and identifies the Hebrew as difficult.
