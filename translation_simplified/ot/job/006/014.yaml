  text: A person in despair should receive kindness from a friend, even if that person abandons the fear of the Almighty.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may also mean, “A friend who withholds kindness from someone in despair abandons the fear of the Almighty.”
