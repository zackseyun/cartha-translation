translation:
  language: en
  text: Someone in despair should receive kindness[b] from their friend, even if they abandon the fear of the Almighty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “A friend who withholds kindness from someone in despair abandons the fear of the Almighty.” The Hebrew wording is compressed and can also be understood this way.
    reason: alternative_reading
  - marker: b
    text: Here “kindness” can also mean loyal love, mercy, or faithfulness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Kindness from his friend is due to one who is despairing
  simplified_phrase: Someone in despair should receive kindness from their friend
  preserved_meaning: A despairing person is owed compassionate support from their own friend.
  reasoning_layer_used: POB lexical decisions and chosen theological reading
  rationale: The recast uses ordinary English while preserving both what is due and the specific friendship.
- pob_phrase: one who is despairing
  simplified_phrase: someone in despair
  preserved_meaning: The person is inwardly collapsing under suffering.
  reasoning_layer_used: Lexical decision for לַמָּס
  rationale: The shorter phrase naturally conveys the source image of emotional collapse.
- pob_phrase: even if he forsakes the fear of the Almighty
  simplified_phrase: even if they abandon the fear of the Almighty
  preserved_meaning: Kindness remains due even when the sufferer forsakes reverence toward God.
  reasoning_layer_used: Lexical and theological decisions for יַעֲזֹב and יִרְאַת שַׁדַּי
  rationale: The present-form “abandon” avoids implying a completed act while retaining the biblical theological phrase.
