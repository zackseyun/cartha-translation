  preserved_meaning: Job accuses his friends of treating a vulnerable person as an object to be disposed of by lot.
  reasoning_layer_used: POB lexical decision for תַּפִּילוּ and יָתוֹם
  rationale: “Draw lots” states the ancient action more clearly while retaining the source image.
- pob_phrase: bargain over your friend
  simplified_phrase: haggle over your friend
  preserved_meaning: Job accuses his companions of treating a friend as an object of gain.
  reasoning_layer_used: POB lexical decision for תִכְרוּ and רֵיעֲכֶם
  rationale: “Haggle” is common English for ruthless bargaining without resolving the difficult verb further.
