translation:
  language: en
  text: You would even draw lots over a fatherless person,[a] and haggle over your friend.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “draw a lot for a fatherless person.” The Hebrew expression is literally “make fall upon the fatherless.”
    reason: lexical_alternative
  - marker: b
