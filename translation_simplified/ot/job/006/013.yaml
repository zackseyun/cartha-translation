simplification_decisions:
- pob_phrase: Is my help not within me
  simplified_phrase: Do I have no help within me?
  preserved_meaning: Job asks rhetorically whether his inner resources are gone.
  reasoning_layer_used: Lexical decisions for הַאִם, אֵין, עֶזְרָתִי, and בִי
  rationale: The recast question makes the negative lament natural without implying self-generated help.
- pob_phrase: sound wisdom
  simplified_phrase: practical wisdom
  preserved_meaning: The phrase means effective insight or competence rather than abstract knowledge.
  reasoning_layer_used: Lexical decision and footnote for תֻשִׁיָּה
  rationale: Practical wisdom clearly conveys the documented wisdom sense.
translation_notes:
  risk_flags:
  - risk: The first question could be mistaken for an affirmation that Job still has help.
    mitigation: The negative question clearly presents Job's lament that his inner resources are gone.
  - risk: Practical wisdom does not express the full range of competence and resourcefulness in תֻשִׁיָּה.
    mitigation: It retains the POB's primary wisdom sense in familiar English.
