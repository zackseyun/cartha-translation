- pob_phrase: Do you intend to reprove words
  simplified_phrase: Do you mean to find fault with words
  preserved_meaning: Job asks whether his friends intend to judge his words adversely.
  reasoning_layer_used: POB lexical decision for הַלְהוֹכַח and תַּחְשֹׁבוּ
  rationale: “Find fault with” expresses adversarial evaluation in more familiar English than “reprove.”
- pob_phrase: a despairing man’s words
  simplified_phrase: a man’s words ... when he is in despair
  preserved_meaning: The words come from a person who has lost hope.
  reasoning_layer_used: POB lexical decision for נֹאָשׁ
  rationale: The clause states the man’s condition directly instead of using the less common adjective “despairing.”
- pob_phrase: treat ... words as wind
  simplified_phrase: dismiss ... words as wind
  preserved_meaning: The friends regard his words as fleeting or empty while the wind image remains intact.
  reasoning_layer_used: POB lexical decision and source audit for וּלְרוּחַ אִמְרֵי נֹאָשׁ
  rationale: “Dismiss” makes the implied treatment clear without removing the Hebrew image.
