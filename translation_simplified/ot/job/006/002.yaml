  rationale: “If only” states the lament naturally, while “anguish” makes Job’s inner pain immediately clear.
- pob_phrase: my calamity lifted together in the balances
  simplified_phrase: my calamity could be put on the scales and fully weighed together
  preserved_meaning: Job wants his outward disaster weighed together with his inward anguish.
  reasoning_layer_used: POB lexical decisions for וְהַוָּתִי, בְּמֹאזְנַיִם, יִשְׂאוּ, and יָחַד
