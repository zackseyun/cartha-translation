translation:
  language: en
  text: Am I saying anything unjust? Can I not recognize calamities?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what is perverse” or “what brings ruin.” The Hebrew can refer either to calamities and destructive evils or to morally twisted things.
    reason: lexical_alternative
  - marker: b
    text: Literally, “Does my palate not discern calamities?” The palate serves as an image of the ability to distinguish and evaluate.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Is there injustice on my tongue?
  simplified_phrase: Am I saying anything unjust?
  preserved_meaning: Job asks rhetorically whether his speech contains moral wrong.
  reasoning_layer_used: POB lexical decisions for בִּלְשׁוֹנִי and עַוְלָה
  rationale: The tongue metaphor is stated directly as speech for immediate clarity.
- pob_phrase: Does my palate not discern calamities?
  simplified_phrase: Can I not recognize calamities?
  preserved_meaning: Job claims that he can identify calamities accurately.
  reasoning_layer_used: POB lexical decisions for חִכִּי, לֹא יָבִין, and הַוּוֹת
  rationale: “Recognize” conveys discernment without implying that Job literally tastes calamities.
translation_notes:
  risk_flags:
  - risk: The Hebrew term rendered “calamities” may instead describe perverse or ruinous things.
    mitigation: Footnote a preserves the lexical alternatives.
  - risk: Replacing “palate” in the main text could obscure the source-language image.
    mitigation: Footnote b preserves and briefly explains the literal image.
