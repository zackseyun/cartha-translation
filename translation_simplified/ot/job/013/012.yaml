  rationale: “Wise sayings” expresses “maxims” in familiar English while retaining the wisdom context.
- pob_phrase: your defenses are defenses of clay
  simplified_phrase: your defenses are made of clay
  preserved_meaning: Their defenses are pictured as weak and fragile while the clay image remains intact.
  reasoning_layer_used: POB lexical decisions for גַּבֵּיכֶם and חֹמֶר
