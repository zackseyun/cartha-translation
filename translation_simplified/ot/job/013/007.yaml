simplification_decisions:
- pob_phrase: speak injustice for God
  simplified_phrase: speak unjustly in God’s defense
  preserved_meaning: Job accuses his friends of speaking unjustly while defending God.
  reasoning_layer_used: Lexical and theological decisions on הֲלְאֵל and עַוְלָה.
  rationale: This states the favored contextual sense in natural English.
- pob_phrase: deceit for him
  simplified_phrase: speak deceitfully on his behalf
  preserved_meaning: The second charge remains specifically about deceptive speech offered in support of God.
  reasoning_layer_used: Hebrew parallel structure and lexical decisions on וְלוֹ and רְמִיָּה.
  rationale: Repeating “speak” prevents the charge from expanding to deceptive conduct generally.
interpretive_expansions:
