  text: Will you speak unjustly in God’s defense[a] and speak deceitfully on his behalf?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “to God” and “to him,” but the context favors speaking in God’s defense.
