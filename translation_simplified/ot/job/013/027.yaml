  preserved_meaning: Job’s feet are held in a restraining device.
  reasoning_layer_used: Lexical decision for בַּסַּד and the immediate prison image.
  rationale: “Lock” makes the restraining function of the stocks clear.
- pob_phrase: you watch all my paths
  simplified_phrase: you watch every path I take
  preserved_meaning: God closely watches all Job’s movements and ways.
  reasoning_layer_used: Lexical decisions for וְתִשְׁמוֹר and כָּל אָרְחוֹתַי.
  rationale: The added verb expresses the path image in natural English.
- pob_phrase: you mark out the soles of my feet
  simplified_phrase: You mark the soles of my feet
  preserved_meaning: Job pictures his feet as closely marked under confinement and surveillance.
  reasoning_layer_used: Lexical rationale for תִּתְחַקֶּה and the POB footnote.
  rationale: “Mark” remains clear without choosing between marking the feet and tracing their boundary.
