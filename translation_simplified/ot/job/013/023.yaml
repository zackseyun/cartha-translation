  reasoning_layer_used: POB lexical decision and source audit for כַּמָּה לִי עֲוֺנוֹת וְחַטָּאוֹת
  rationale: “Am I guilty of” makes the moral sense of having wrongs natural in modern English.
- pob_phrase: Show me my transgression and my sin.
