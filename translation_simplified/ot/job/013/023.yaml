simplification_decisions:
- pob_phrase: How many are my iniquities and sins?
  simplified_phrase: How many wrongs and sins are mine?
  preserved_meaning: Job asks about the number of his morally blameworthy wrongs and sins without limiting them to acts alone.
  reasoning_layer_used: The lexical decisions favor a quantitative question and note that “iniquities” may include guilt.
  rationale: “Wrongs” is clearer than “iniquities,” while “are mine” preserves the broader possessive sense.
- pob_phrase: Make my transgression and my sin known to me
  simplified_phrase: Show me my transgression and my sin
  preserved_meaning: Job asks for his transgression and sin to be made known to him.
  reasoning_layer_used: The lexical audit lists “show me” as a valid rendering of the causative verb.
  rationale: “Show me” is direct modern English and avoids adding a request for definitions.
translation_notes:
  risk_flags:
  - risk: “Wrongs” may sound less weighty than “iniquities.”
    mitigation: Its pairing with “sins” preserves the clear moral sense.
