  preserved_meaning: Job asks God to identify both his willful wrongdoing and his sin.
  reasoning_layer_used: POB lexical decisions for פִּשְׁעִי and וְחַטָּאתִי
  rationale: Retaining “transgression” preserves its stronger moral force and distinction from “sin.”
