  preserved_meaning: Job is asked whether his voice can command the rain clouds.
  reasoning_layer_used: Lexical decision for קוֹלֶךָ and chapter context
  rationale: “Call out” expresses raising one’s voice in ordinary English without losing the act of addressing the clouds.
- pob_phrase: an abundance of water
  simplified_phrase: a downpour
  preserved_meaning: A very large amount of rain falls from the clouds.
  reasoning_layer_used: Lexical decision for וְשִׁפְעַת מַיִם
  rationale: “Downpour” gives modern readers the intended weather image while retaining the force of abundant water.
