simplification_decisions:
- pob_phrase: the ordinances of the heavens
  simplified_phrase: the fixed laws of the heavens
  preserved_meaning: The heavens have an established order set by God.
  reasoning_layer_used: Lexical decision for חֻקּוֹת and theological decision on cosmic order
  rationale: “Fixed laws” makes the established cosmic order clearer than “ordinances.”
- pob_phrase: establish their rule on the earth
  simplified_phrase: put their rule into effect on the earth
  preserved_meaning: The question asks whether Job can cause heaven’s governing order to operate on earth.
  reasoning_layer_used: Lexical decisions for תָּשִׂים and מִשְׁטָרוֹ
  rationale: “Put into effect” expresses establishing authority in common English.
translation_notes:
  risk_flags:
  - risk: “Fixed laws” could be read as modern scientific laws alone.
    mitigation: The second question retains the broader image of heavenly rule over the earth.
  - risk: The plural “their” does not reflect the Hebrew singular suffix exactly.
    mitigation: The footnote preserves “its” and explains the likely collective reference.
