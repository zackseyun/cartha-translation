translation:
  language: en
  text: Do you know the fixed laws of the heavens? Can you put their rule into effect on the earth?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “its rule” or “its authority.” The Hebrew says “its,” probably referring to the heavens as a whole.
