translation:
  language: en
  text: Along what path is light divided,[a][b] or the east wind scattered over the earth?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may ask either where the path is or how light is divided.
    reason: lexical_alternative
  - marker: b
    text: The word translated “light” may refer here to lightning.
    reason: lexical_alternative
simplification_decisions:
