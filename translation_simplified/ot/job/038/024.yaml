  reasoning_layer_used: Lexical decisions for הַדֶּרֶךְ and יֵחָלֶק, confirmed by the final source audit.
  rationale: The passive wording avoids making the path the agent and uses common English for distribution.
- pob_phrase: or the east wind scattered over the earth
  simplified_phrase: or where the east wind is scattered across the earth
  preserved_meaning: The question asks where the east wind is dispersed throughout the earth.
  reasoning_layer_used: Lexical decisions for יָפֵץ, קָדִים, and עֲלֵי אָרֶץ.
  rationale: Repeating “where” makes the parallel question clear while preserving the wind image and cosmic scope.
