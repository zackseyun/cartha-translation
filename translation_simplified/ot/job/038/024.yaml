  reasoning_layer_used: POB lexical decisions for אֵי זֶה and הַדֶּרֶךְ
  rationale: “Along what path” is clearer modern English than “by what way” without removing the path image.
- pob_phrase: over the earth
  simplified_phrase: over the earth
  preserved_meaning: The east wind is scattered over the earth’s surface within the speech’s cosmic scope.
  reasoning_layer_used: POB lexical decision for עֲלֵי אָרֶץ
  rationale: The POB wording is already clear and avoids the less precise movement implied by “across.”
