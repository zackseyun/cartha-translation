translation:
  language: en
  text: For all of them, deep darkness is like morning, because they are familiar with its terrors.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compact Hebrew may instead mean, “For morning is like deep darkness to them all.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew expression translated “deep darkness” can also mean “the shadow of death,” but here the emphasis is probably on darkness and gloom.
    reason: lexical_alternative
