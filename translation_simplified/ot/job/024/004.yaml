simplification_decisions:
- pob_phrase: They turn the needy off the road
  simplified_phrase: They force needy people off the road
  preserved_meaning: Oppressors cause vulnerable people to move away from the road or way.
  reasoning_layer_used: POB lexical decisions for יַטּוּ, אֶבְיוֹנִים, and מִדָּרֶךְ
  rationale: “Force” plainly conveys the causative oppression while keeping the road image.
- pob_phrase: together the poor of the land hide themselves
  simplified_phrase: The poor of the land all go into hiding
  preserved_meaning: The poor as a whole withdraw into hiding under pressure.
  reasoning_layer_used: POB lexical decisions for יַחַד, חֻבְּאוּ, and עֲנִיֵּי אָרֶץ
  rationale: “All go into hiding” shows collective withdrawal without implying that they hide in one place.
translation_notes:
  risk_flags:
  - risk: “Road” may sound exclusively literal although the Hebrew can also mean “way.”
    mitigation: Footnote a preserves the broader lexical alternative.
  - risk: “Go into hiding” may soften the passive nuance of being driven into concealment.
    mitigation: The coercive first clause keeps the surrounding pressure explicit.
