simplification_decisions:
- pob_phrase: They are among those who rebel
  simplified_phrase: They are people who rebel
  preserved_meaning: They belong to the class of people characterized by active rebellion.
  reasoning_layer_used: POB lexical decision on הָיוּ בְּמֹרְדֵי
  rationale: The direct wording makes the class description easier to grasp without weakening the active rebellion.
- pob_phrase: nor do they remain in its paths
  simplified_phrase: or continue along its paths
  preserved_meaning: They do not keep to the course associated with the light.
  reasoning_layer_used: POB lexical decisions on יָשְׁבוּ and נְתִיבֹתָיו
  rationale: “Continue along” expresses remaining on a path in natural modern English while keeping the path image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “light” as only literal or only moral.
    mitigation: The main text keeps the POB’s unqualified image so its literal and moral overtones remain open.
  - risk: Changing “among those” to “people who” slightly compresses the explicit class-inclusion construction.
    mitigation: The rendering still identifies them as members of the group defined by rebellion against light.
