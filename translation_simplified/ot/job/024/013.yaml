translation:
  language: en
  text: These people are rebels against the light.[a] They do not recognize the ways of the light, and they do not keep to its paths.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “These people were rebels against the light.” The Hebrew may refer to the past, but it likely describes an ongoing kind of person here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: These are among those who rebel against the light
  simplified_phrase: These people are rebels against the light
  preserved_meaning: They belong to the class of people who actively rebel against the light.
  reasoning_layer_used: POB lexical decisions for הֵמָּה, הָיוּ, and בְּמֹרְדֵי
  rationale: The shorter wording makes the identified group clear while retaining active rebellion.
- pob_phrase: they do not recognize its ways
  simplified_phrase: They do not recognize the ways of the light
  preserved_meaning: They fail to perceive or acknowledge the ways associated with the light.
  reasoning_layer_used: POB lexical and theological decisions for לֹא הִכִּירוּ and דְרָכָיו
  rationale: Repeating “the light” removes an unclear pronoun without personalizing it.
- pob_phrase: they do not stay in its paths
  simplified_phrase: they do not keep to its paths
  preserved_meaning: They do not remain within the paths belonging to the light.
  reasoning_layer_used: POB lexical decisions for יָשְׁבוּ and נְתִיבֹתָיו
  rationale: “Keep to” naturally expresses remaining on a path while preserving the path image.
