  preserved_meaning: The Almighty controls whether particular times are held in reserve.
  reasoning_layer_used: POB lexical decisions for נִצְפְּנוּ and עִתִּים
  rationale: The active wording and “set aside” express the reserve image in more natural English.
- pob_phrase: and why do those who know him not see his days?
  simplified_phrase: Why do those who know him not see his days?
  preserved_meaning: Those who know God do not witness the days associated with him.
  reasoning_layer_used: POB theological decision on יָמָיו
  rationale: A separate question is easier to read while preserving the poetic ambiguity of “his days.”
