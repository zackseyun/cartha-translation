translation:
  language: en
  text: Why has the Almighty not set aside appointed times?[a] Why do those who know him not see his days?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can say simply “times”: “Why are times not stored up by the Almighty?”'
