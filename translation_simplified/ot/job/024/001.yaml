translation:
  language: en
  text: Why does the Almighty not keep times in reserve? Why do people who know him not see his days?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His days” likely means the days when God acts, especially in judgment, but the Hebrew leaves the phrase open.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Why are times not kept by the Almighty
  simplified_phrase: Why does the Almighty not keep times in reserve
  preserved_meaning: The times remain under the Almighty’s control and are kept or reserved by him.
  reasoning_layer_used: Lexical decision for נִצְפְּנוּ and POB footnote a
  rationale: The active wording is easier to follow, while “in reserve” conveys the documented sense of keeping for an appointed occasion.
- pob_phrase: those who know him
  simplified_phrase: people who know him
  preserved_meaning: The phrase refers to people who know God relationally.
  reasoning_layer_used: Lexical decision for וְיֹדְעָיו
  rationale: “People” makes the expression more immediate without changing its relational meaning.
interpretive_expansions:
- pob_phrase: times not kept
  rendering: not keep times in reserve
  claim: The times are being reserved rather than merely possessed or remembered.
  evidence:
  - The lexical rationale gives “hide, store up, treasure” and identifies reserved determination as the contextual sense.
  - POB footnote a explicitly offers “appointed times” and “reserved.”
  confidence: moderate
  alternatives_preserved:
  - kept
  - kept hidden
  - appointed times
translation_notes:
  risk_flags:
