simplification_decisions:
- pob_phrase: drags away the mighty by his power
  simplified_phrase: uses his power to drag powerful people away
  preserved_meaning: The oppressor forcibly carries off people who themselves have power.
  reasoning_layer_used: POB lexical decisions for וּמָשַׁךְ, אַבִּירִים, and בְּכֹחוֹ
  rationale: The wording uses ordinary English while retaining the forceful image of dragging away.
- pob_phrase: he rises up
  simplified_phrase: He rises
  preserved_meaning: He arises or stands, while the precise purpose remains unstated.
  reasoning_layer_used: POB lexical decision for יָקוּם
  rationale: Removing “up” makes the phrase more natural without resolving its open nuance.
- pob_phrase: he has no assurance of life
  simplified_phrase: he cannot be sure he will remain alive
  preserved_meaning: He lacks confidence that his life will continue.
  reasoning_layer_used: POB final text, lexical decision, and uncertainty footnote
  rationale: The concrete wording explains “assurance of life” in common English.
