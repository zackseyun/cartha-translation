translation:
  language: en
  text: Yet he uses his power to drag away powerful people. He rises up,[a] but he cannot be sure that he will stay alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew subject in the last clause is unclear. It may mean, “he does not trust in life,” or, “When he rises up, no one is sure of life.”
    reason: alternative_reading
