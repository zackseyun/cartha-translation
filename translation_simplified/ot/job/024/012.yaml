translation:
  language: en
  text: The dying[a] groan from the city, and the soul of those who have been killed cries out for help. Yet God does not treat this as wrong.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “People groan in the city.” The Hebrew word may mean “the dying” or “people.”
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew may also mean “God does not regard it as folly” or “God does not lay blame.”
    reason: alternative_reading
