  preserved_meaning: He does not continue to preserve the lives of wicked people.
  reasoning_layer_used: Lexical and theological decisions on יְחַיֶּה and רָשָׁע
  rationale: The wording is more natural while avoiding any suggestion of resurrection.
- pob_phrase: the afflicted
  simplified_phrase: those who suffer
  preserved_meaning: God grants justice to people experiencing affliction or oppression.
  reasoning_layer_used: Lexical decision on עֲנִיִּים
  rationale: The common phrase stays broad rather than limiting the group to the economically poor.
translation_notes:
  risk_flags:
