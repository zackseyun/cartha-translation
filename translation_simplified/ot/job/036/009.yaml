  preserved_meaning: God identifies their wrongdoing as proud self-exaltation.
  reasoning_layer_used: POB syntax for כִּי and lexical-theological decisions for יִתְגַּבָּרוּ
  rationale: A separate sentence preserves the final clause as the content God makes known.
