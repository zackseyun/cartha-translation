translation:
  language: en
  text: He never takes his eyes off those who do what is right. He seats them with kings on thrones forever,[a] and they are raised to honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He seats kings on thrones forever.” The Hebrew is compact and may refer directly to the kings rather than to those who do what is right.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He does not withdraw his eyes from the righteous
  simplified_phrase: He never takes his eyes off those who do what is right
  preserved_meaning: God continually watches over the righteous, while the concrete image of his eyes remains.
  reasoning_layer_used: Lexical and theological decisions on יִגְרַע, עֵינָיו, and מִצַּדִּיק
  rationale: The familiar expression “never takes his eyes off” makes the Hebrew image immediately clear.
- pob_phrase: but with kings on the throne he seats them forever
  simplified_phrase: He seats them with kings on thrones forever
  preserved_meaning: God gives the righteous an enduring place of royal honor alongside kings.
  reasoning_layer_used: Lexical decision and theological decision on the royal clause
  rationale: A new sentence and ordinary word order clarify the compressed clause without adding enthronement.
- pob_phrase: and they are exalted
  simplified_phrase: and they are raised to honor
  preserved_meaning: They are elevated to high status without specifying the ambiguous verbal voice more narrowly.
  reasoning_layer_used: Lexical decision on וַיִּגְבָּהוּ
  rationale: “Raised to honor” explains exaltation in common English while retaining its upward movement.
interpretive_expansions:
- pob_phrase: they are exalted
  rendering: they are raised to honor
  claim: Their elevation concerns honored or high status.
  evidence:
  - The POB lexical rationale identifies being raised to high status as the clause’s sense.
  - The royal setting in the preceding clause supports an elevation in status.
  confidence: high
  alternatives_preserved:
  - they rise high
  - they are exalted
translation_notes:
  risk_flags:
  - risk: The compact Hebrew may refer to kings, not the righteous, as those seated forever.
    mitigation: The footnote preserves this principal alternative reading.
