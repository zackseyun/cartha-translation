translation:
  language: en
  text: He rescues those who suffer through their suffering,[a] and through oppression he opens their ears so they will listen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rescues the poor while they are suffering.” The Hebrew can refer to affliction or poverty, and may describe either the means or the setting of rescue.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the afflicted
  simplified_phrase: those who suffer
  preserved_meaning: The people are afflicted or oppressed, not merely economically poor.
  reasoning_layer_used: lexical decision for עָנִי
  rationale: The verbal phrase is immediately clear while preserving the broader sense of affliction.
- pob_phrase: by their affliction
  simplified_phrase: through their suffering
  preserved_meaning: God uses suffering as the means of rescue, while the footnote preserves the circumstantial alternative.
  reasoning_layer_used: lexical and theological decisions for בְעָנְיוֹ
  rationale: “Through” expresses instrumentality more naturally than the repeated “by.”
- pob_phrase: opens their ears by oppression
  simplified_phrase: through oppression he opens their ears so they will listen
  preserved_meaning: Oppression serves as the means by which God makes people receptive to instruction.
  reasoning_layer_used: lexical decisions for וְיִגֶל, בַּלַּחַץ, and אָזְנָם
  rationale: The wording retains the Hebrew ear image and explains its idiomatic force.
