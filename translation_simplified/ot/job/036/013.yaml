translation:
  language: en
  text: But people who are godless at heart[a] harbor anger inside themselves. They do not cry for help when he binds them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Godless at heart” may also be translated “hypocritical at heart” or “impious at heart.”
    reason: lexical_alternative
  - marker: b
    text: Or “because he binds them.” The Hebrew can express either time or cause here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the godless in heart
  simplified_phrase: people who are godless at heart
  preserved_meaning: Their inward character is irreverent toward God.
  reasoning_layer_used: Lexical decision for חַנְפֵי לֵב
  rationale: This wording is natural English while retaining both godlessness and inward disposition.
- pob_phrase: store up anger
  simplified_phrase: harbor anger inside themselves
  preserved_meaning: They actively retain anger within themselves.
  reasoning_layer_used: Lexical decision for יָשִׂימוּ אָף and grounding review
  rationale: “Harbor” preserves their culpable inward retention of anger rather than suggesting passive buildup.
- pob_phrase: they do not cry for help when he binds them
  simplified_phrase: They do not cry for help when he binds them
  preserved_meaning: They do not seek help while undergoing the restraint or affliction he brings.
  reasoning_layer_used: Lexical and theological decisions for לֹא יְשַׁוְּעוּ, כִּי, and אֲסָרָם
  rationale: The wording preserves the temporal reading, the contextual pronoun, and the act of seeking help.
