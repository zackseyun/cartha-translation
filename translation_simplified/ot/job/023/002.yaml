translation:
  language: en
  text: Even today, my complaint is defiant.[a] My hand is weighed down by my groaning.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my complaint is bitter.” The Hebrew more commonly suggests rebellion or defiance.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally speaks of “my hand”; the expression is uncertain, and some read “his hand.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: my complaint is rebellious
  simplified_phrase: my complaint is defiant
  preserved_meaning: Job describes his complaint as bordering on rebellion rather than merely as bitter.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Defiant” expresses the sharp force in more natural English.
- pob_phrase: my hand is heavy because of my groaning
  simplified_phrase: My hand is weighed down by my groaning
  preserved_meaning: The bodily image of Job’s hand under the weight of his groaning remains intact.
  reasoning_layer_used: lexical decision and source text
  rationale: The passive image is easier to follow while retaining the Hebrew wording.
