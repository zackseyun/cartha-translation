simplification_decisions:
- pob_phrase: Oh, that I knew where I might find him
  simplified_phrase: If only I knew where to find him
  preserved_meaning: Job strongly longs to know where he can find God.
  reasoning_layer_used: Lexical decisions for מִי יִתֵּן, יָדַעְתִּי, and וְאֶמְצָאֵהוּ
  rationale: “If only” expresses the wish naturally, while “where to find him” makes its object clear.
- pob_phrase: that I might come to his place
  simplified_phrase: so I could go to his place
  preserved_meaning: Job longs for the possibility of reaching God's place.
  reasoning_layer_used: Lexical decisions for אָבוֹא, עַד, and תְּכוּנָתוֹ
  rationale: “Could go” keeps the continuing wish and avoids making Job's action a definite result.
translation_notes:
  risk_flags:
  - risk: “So” presents reaching God's place as the purpose or result of finding him.
    mitigation: The POB lexical rationale explicitly supports this relationship within the continuing wish.
