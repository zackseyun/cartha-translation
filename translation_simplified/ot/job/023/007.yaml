- pob_phrase: an upright man could reason with him
  simplified_phrase: an upright person could present his case to him
  preserved_meaning: A person of integrity could make a formal argument before God.
  reasoning_layer_used: Lexical decision for יָשָׁר and forensic sense of נוֹכָח
  rationale: “Present his case” makes the courtroom setting clear without making the language technical.
- pob_phrase: I would be delivered forever
  simplified_phrase: I would be freed forever
  preserved_meaning: Job expects lasting release from adverse judgment.
  reasoning_layer_used: Lexical decisions for וַאֲפַלְּטָה and לָנֶצַח
  rationale: “Freed” is common English that preserves enduring deliverance without claiming formal acquittal.
