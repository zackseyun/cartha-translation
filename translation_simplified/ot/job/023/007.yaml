simplification_decisions:
- pob_phrase: an upright man
  simplified_phrase: an upright person
  preserved_meaning: The person has moral integrity and is not merely being described as honest in speech.
  reasoning_layer_used: POB lexical decision for יָשָׁר
  rationale: “Upright person” is natural modern English while preserving the ethical meaning.
- pob_phrase: could reason with him
  simplified_phrase: could present a case before him
  preserved_meaning: The upright person could formally argue his position in the imagined court-like encounter.
  reasoning_layer_used: POB lexical decision for נוֹכָח and its listed alternative
  rationale: “Present a case” makes the legal setting immediately clear without becoming technical.
- pob_phrase: would be delivered forever
  simplified_phrase: would be freed forever
  preserved_meaning: Job expects lasting release from adverse judgment rather than a narrowly stated acquittal.
  reasoning_layer_used: POB lexical decisions for וַאֲפַלְּטָה and לָנֶצַח
  rationale: “Freed forever” expresses enduring release in common English.
translation_notes:
  risk_flags:
  - risk: “Present a case” emphasizes the forensic sense over the broader wording “reason with.”
    mitigation: The POB lexical audit explicitly lists this rendering and identifies the context as court-like.
  - risk: Modern readers may assume that “my judge” refers only and explicitly to God.
    mitigation: The main text keeps the ambiguous role, and the footnote preserves “the one judging me.”
