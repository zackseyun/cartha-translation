  language: en
  text: When he is at work on the left, I cannot find him. He turns to the right[a], but I cannot see him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more literally, “he covers himself on the right,” suggesting that he hides himself there.
