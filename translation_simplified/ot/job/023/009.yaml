translation:
  language: en
  text: When he is at work on the left, I cannot take hold of him. He covers himself on the right,[a] and I cannot see him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Left” and “right” may also correspond to north and south.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I cannot lay hold of him
  simplified_phrase: I cannot take hold of him
  preserved_meaning: Job cannot grasp or encounter God, while the Hebrew’s concrete grasping image remains.
  reasoning_layer_used: Lexical decision for אָחַז and the source audit
  rationale: “Take hold of” is more familiar modern English than “lay hold of.”
- pob_phrase: On the left, when he is at work
  simplified_phrase: When he is at work on the left
  preserved_meaning: God is active in the place Job searches, yet Job cannot reach him.
  reasoning_layer_used: Lexical decisions for שְׂמֹאול and בַּעֲשֹׂתוֹ
  rationale: Ordinary English clause order makes the scene easier to follow.
- pob_phrase: he covers himself on the right, and I cannot see him
  simplified_phrase: He covers himself on the right, and I cannot see him
  preserved_meaning: The covering image explains Job’s inability to see God without replacing it with an inferred movement.
  reasoning_layer_used: Lexical decision for יַעְטֹף and wisdom-source audit
  rationale: A new sentence reduces complexity while retaining the Hebrew image.
translation_notes:
  risk_flags:
  - risk: “Covers himself” may sound like literal clothing to a modern reader.
    mitigation: The wording is retained because the Hebrew covering image is central to Job’s failed search.
  - risk: Readers may not recognize that left and right can suggest north and south.
    mitigation: The footnote preserves the directional possibility without replacing the poetic pair.
