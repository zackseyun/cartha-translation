  preserved_meaning: God is active on one side of Job’s search.
  reasoning_layer_used: lexical decision for בַּעֲשֹׂתוֹ and the left-right poetic contrast
  rationale: Ordinary English clause order makes the scene easier to follow.
- pob_phrase: I do not perceive him
  simplified_phrase: I cannot find him
  preserved_meaning: Job cannot apprehend or locate God despite searching for him.
  reasoning_layer_used: lexical decision for אָחַז and Job 23:8–10 context
  rationale: “Find” expresses the contextual sense more plainly than “perceive.”
- pob_phrase: and I do not see him
  simplified_phrase: but I cannot see him
  preserved_meaning: God remains beyond Job’s sight even when Job searches the other side.
  reasoning_layer_used: lexical decision for אֶרְאֶה and Hebrew parallelism
  rationale: “But” clearly marks the failed result while preserving the separate image of sight.
