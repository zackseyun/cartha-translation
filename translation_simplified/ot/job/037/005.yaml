simplification_decisions:
- pob_phrase: God thunders wondrously with his voice
  simplified_phrase: God thunders with his voice in a marvelous way
  preserved_meaning: God’s voice produces thunder in a way that inspires wonder.
  reasoning_layer_used: Lexical decision for יַרְעֵם, בְּקוֹלוֹ, and נִפְלָאוֹת
  rationale: The adverb is unpacked into a familiar phrase while keeping the thunder, voice, and wonder image.
- pob_phrase: he does great things that we do not know
  simplified_phrase: He does great things that we do not know
  preserved_meaning: God performs great works that remain unknown to people.
  reasoning_layer_used: Theological decision on the scope of human ignorance
  rationale: A new sentence eases reading without strengthening “do not know” into “cannot comprehend.”
translation_notes:
  risk_flags:
  - risk: “Marvelous” may be heard only as praise rather than as wonder at divine power.
    mitigation: The thunder image and lexical-alternative footnote preserve the stronger sense of wonder.
  - risk: The final clause can also suggest things beyond human knowledge.
    mitigation: Footnote b preserves that reading without making the main text stronger than the Hebrew verb.
