translation:
  language: en
  text: For this reason, people fear him. He does not regard anyone who has understanding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “he does not see any who are wise of heart.” The Hebrew verb can mean “see” or “regard.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore men fear him
  simplified_phrase: For this reason, people fear him
  preserved_meaning: Human beings respond to God’s greatness with fear and reverence.
  reasoning_layer_used: Lexical decisions for לָכֵן, יְרֵאוּהוּ, and אֲנָשִׁים
  rationale: This keeps the inference and the weight of “fear” while clearly referring to people in general.
- pob_phrase: he does not regard
  simplified_phrase: He does not regard
  preserved_meaning: God does not give regard to those characterized by human wisdom.
  reasoning_layer_used: Lexical and theological decisions for לֹא יִרְאֶה
  rationale: Retaining “regard” avoids narrowing the chosen sense to approval or favor.
- pob_phrase: any who are wise of heart
  simplified_phrase: anyone who has understanding
  preserved_meaning: The Hebrew idiom describes a person characterized by inner wisdom or understanding.
  reasoning_layer_used: Lexical decision for חַכְמֵי לֵב
  rationale: A single common term explains the idiom without turning it into two separate qualities.
translation_notes:
  risk_flags:
  - risk: “Regard” is less common than “notice” but preserves the POB’s deliberately broad contextual sense.
    mitigation: The footnote retains the literal “see” and identifies both lexical possibilities.
  - risk: “Has understanding” does not preserve the Hebrew heart-image in the main text.
    mitigation: The footnote gives the literal phrase “wise of heart.”
