translation:
  language: en
  text: Can you join him in spreading out[a] the skies[b]—hard as a mirror cast from metal?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also suggest beating or hammering metal thin.
    reason: lexical_alternative
  - marker: b
