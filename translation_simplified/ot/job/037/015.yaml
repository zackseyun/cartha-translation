translation:
  language: en
  text: Do you know when God puts something on them and makes the light of his cloud shine?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when God sets them in place.” The Hebrew does not state exactly what God places on them, and the context does not make clear what “them” refers to.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: lays his charge upon them
  simplified_phrase: puts something on them
  preserved_meaning: God places something unspecified on an unspecified group or set of things.
  reasoning_layer_used: Source audit and theological decision on the implicit object and referent
  rationale: Plain wording preserves both parts of the Hebrew ambiguity without recasting the action as divine direction.
- pob_phrase: makes the light of his cloud shine
  simplified_phrase: makes the light of his cloud shine
  preserved_meaning: God causes the light associated with his cloud to appear or shine.
  reasoning_layer_used: Lexical decisions for וְהוֹפִיעַ, אוֹר, and עֲנָנוֹ
  rationale: This clear clause retains the distinction between the light and the singular cloud.
