translation:
  language: en
  text: Do you know how God puts these things on them,[a] and makes the light of his cloud shine?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not state exactly what God puts or what “them” refers to; the surrounding verses concern clouds and other weather.
    reason: source_note
  - marker: b
    text: Or “makes the brightness of his cloud flash.”
    reason: lexical_alternative
