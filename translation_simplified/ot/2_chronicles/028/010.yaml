translation:
  language: en
  text: And now you say you will subdue the people of Judah and Jerusalem and make them your male and female slaves. But are you yourselves not also guilty before Yahweh your God?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: subdue the people of Judah and Jerusalem as male and female slaves for yourselves
  simplified_phrase: subdue the people of Judah and Jerusalem and make them your male and female slaves
  preserved_meaning: They intend to bring the captives under their control and keep both men and women as slaves.
  reasoning_layer_used: POB lexical and theological decisions on לִכְבֹּשׁ, לַעֲבָדִים וְלִשְׁפָחוֹת, and לָכֶם
  rationale: The rewrite separates the coercive act from the resulting slave status in natural English.
- pob_phrase: But do not you yourselves also have guilt before Yahweh your God?
  simplified_phrase: But are you yourselves not also guilty before Yahweh your God?
  preserved_meaning: The hearers are also culpable in Yahweh's sight.
  reasoning_layer_used: POB lexical decision on עִמָּכֶם אֲשָׁמוֹת and theological decision on Yahweh
  rationale: Using “guilty” makes the compressed rhetorical question immediately understandable.
translation_notes:
