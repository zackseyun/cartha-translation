translation:
  language: en
  text: Ahaz was twenty years old when he became king. He ruled in Jerusalem for sixteen years. Unlike his ancestor David,[a] he did not do what was right in Yahweh’s eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew calls David his “father,” using the word for a royal ancestor.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and he reigned sixteen years in Jerusalem
  simplified_phrase: He ruled in Jerusalem for sixteen years.
  preserved_meaning: Ahaz exercised kingship from Jerusalem for sixteen years.
  reasoning_layer_used: Lexical decisions for מָלַךְ and בִּירוּשָׁלִָם
  rationale: “Ruled” makes the regnal statement immediately clear without reducing kingship to a title.
- pob_phrase: He did not do what was right in the eyes of Yahweh, as David his father had done.
  simplified_phrase: Unlike his ancestor David, he did not do what was right in Yahweh’s eyes.
  preserved_meaning: Yahweh judged Ahaz’s conduct negatively in contrast with David’s conduct.
  reasoning_layer_used: Lexical decision for כְּדָוִיד אָבִיו and the POB cultural note
  rationale: The contrast is reordered for easier reading, while the divine-evaluation image remains.
interpretive_expansions:
- pob_phrase: David his father
  rendering: his ancestor David
  claim: David was Ahaz’s dynastic ancestor, not his immediate father.
  evidence:
