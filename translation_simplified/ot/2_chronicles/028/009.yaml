translation:
  language: en
  text: A prophet of the LORD named Oded was there. He went out to meet the army coming to Samaria and said, “Listen! The LORD, the God of your ancestors, was angry with Judah, so he handed them over to you. But you killed them in a rage so great that it has reached heaven.”
