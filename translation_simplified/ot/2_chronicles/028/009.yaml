simplification_decisions:
- pob_phrase: There was a prophet of the LORD there, whose name was Oded
  simplified_phrase: A prophet of the LORD named Oded was there
  preserved_meaning: Oded was present there as a prophet of the LORD.
  reasoning_layer_used: POB translation and discourse-marker revision
  rationale: The direct wording removes a formal relative clause without changing the setting.
- pob_phrase: he went out before the army that came to Samaria
  simplified_phrase: He went out to meet the army coming to Samaria
  preserved_meaning: Oded approached the army as it came to Samaria.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “To meet” makes the encounter natural, while “to Samaria” avoids implying entry into the city.
- pob_phrase: he gave them into your hand
  simplified_phrase: he handed them over to you
  preserved_meaning: The LORD placed Judah under the army’s power.
  reasoning_layer_used: POB source-driven rendering
  rationale: This common military expression preserves the LORD’s agency and Judah’s defeat.
interpretive_expansions:
- pob_phrase: in a rage that has reached up to heaven
  rendering: in a rage so great that it has reached heaven
  claim: The heaven-reaching image describes the extreme greatness of their rage.
  evidence:
  - The POB directly connects the rage with reaching heaven.
  - The grounding review approves “so great” as explaining rather than replacing the image.
  confidence: high
  alternatives_preserved:
  - The image may also imply that the offense has come before God.
translation_notes:
  risk_flags:
