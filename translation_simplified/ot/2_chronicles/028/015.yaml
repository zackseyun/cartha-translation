translation:
  language: en
  text: Then the men who had been specifically named for this task stepped forward and took responsibility for the captives. They used clothes from the plunder to dress everyone who had no clothes. They dressed them, put sandals on them, gave them food and drink, and applied oil to them. They put everyone who was weak on donkeys and led them to Jericho, the city of palm trees. There they brought them to their brothers[a]. Then they returned to Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” may mean their kin or their fellow Israelites.
    reason: lexical_alternative
