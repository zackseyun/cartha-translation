- pob_phrase: gave him into the hand of
  simplified_phrase: handed him over to
  preserved_meaning: Yahweh placed him under the foreign king’s power.
  reasoning_layer_used: lexical and theological decisions
  rationale: The common idiom keeps both divine agency and the sense of transferred control.
- pob_phrase: took from him a great number of captives
  simplified_phrase: took many captives from him
  preserved_meaning: A large number of people were taken captive.
  reasoning_layer_used: lexical decision
  rationale: The shorter wording expresses the same concrete result naturally.
- pob_phrase: struck him with a great blow
  simplified_phrase: dealt him a devastating blow
  preserved_meaning: The king of Israel inflicted a severe military blow while the source image remains intact.
  reasoning_layer_used: lexical decision and martial context
  rationale: “Devastating” makes the severity of the blow clear without reducing the image to “defeat.”
interpretive_expansions:
