translation:
  language: en
  text: Therefore, Yahweh his God handed him over to the king of Aram.[a] The Arameans struck him, took many captives from him, and brought them to Damascus. He was also handed over to the king of Israel, who dealt him a devastating blow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is also called Syria.
    reason: lexical_alternative
