  preserved_meaning: Ahaz was buried within Jerusalem rather than in the royal tombs.
  reasoning_layer_used: POB lexical rationale for בָעִיר בִּירוּשָׁלִָם
  rationale: The smoother phrase keeps both the city setting and Jerusalem’s name.
