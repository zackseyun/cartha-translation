translation:
  language: en
  text: Ahaz died. They buried him in the city of Jerusalem because they did not bring him into the tombs of the kings of Israel.[a] His son Hezekiah became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the kings of Israel.” Since Ahaz was king of Judah, this may refer to the royal tombs of the kings descended from David; some expect “the kings of Judah.”
    reason: alternative_reading
