translation:
  language: en
  text: In a single day, Pekah son of Remaliah killed 120,000 men in Judah. All of them were brave fighting men. This happened because[a] they had forsaken Yahweh, the God of their fathers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when they had forsaken Yahweh.”
