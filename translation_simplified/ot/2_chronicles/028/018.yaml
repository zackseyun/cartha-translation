translation:
  language: en
  text: The Philistines also raided towns in the lowlands and the Negeb region of Judah. They captured Beth-shemesh, Aijalon, Gederoth, Soko[a] and its villages, Timnah and its villages, and Gimzo and its villages. Then they settled there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also spelled “Soco.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the cities of the lowland and the Negeb of Judah
  simplified_phrase: towns in the lowlands and the Negeb region of Judah
  preserved_meaning: The raids struck settlements in Judah’s western lowland and Negeb areas.
  reasoning_layer_used: POB lexical decision for בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  rationale: “Towns” and “region” make the geography easier to understand while retaining Negeb as a place name.
- pob_phrase: And the Philistines had raided ... and they captured
  simplified_phrase: The Philistines also raided ... They captured
  preserved_meaning: The raids provide the setting for the listed conquests.
  reasoning_layer_used: POB lexical decisions for וּפְלִשְׁתִּים and פָּשְׁטוּ
  rationale: Two direct sentences replace the dense narrative chain without weakening the military action.
- pob_phrase: and they settled there
  simplified_phrase: Then they settled there
  preserved_meaning: After taking the towns, the Philistines occupied them and took up residence.
  reasoning_layer_used: POB lexical decision for וַיֵּשְׁבוּ שָׁם
  rationale: “Then” clearly marks settlement as the result following conquest.
