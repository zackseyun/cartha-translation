translation:
  language: en
  text: Yahweh brought Judah low because of Ahaz, king of Israel.[a] Ahaz had caused disorder in Judah,[b] and he had been utterly unfaithful to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls Ahaz “king of Israel,” though he was king of Judah; this wording is retained rather than harmonized.
    reason: alternative_reading
  - marker: b
    text: Or “Ahaz had acted recklessly in Judah” or “Ahaz had cast off restraint in Judah.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: humbled Judah
  simplified_phrase: brought Judah low
  preserved_meaning: Yahweh caused Judah to be reduced in status and condition.
  reasoning_layer_used: lexical decision for הִכְנִיעַ
  rationale: “Brought low” states the causative judgment in familiar English.
- pob_phrase: had cast off restraint in Judah
  simplified_phrase: had caused disorder in Judah
  preserved_meaning: Ahaz brought about moral and social disorder within Judah.
  reasoning_layer_used: lexical decisions for הִפְרִיעַ and בִּיהוּדָה
  rationale: This preserves the causative sense without specifying affected people or geographic extent.
- pob_phrase: had acted very unfaithfully
  simplified_phrase: had been utterly unfaithful
  preserved_meaning: Ahaz committed intensified covenantal treachery against Yahweh.
  reasoning_layer_used: lexical decision for וּמָעוֹל מַעַל
  rationale: “Utterly” naturally preserves the Hebrew intensification.
translation_notes:
  risk_flags:
