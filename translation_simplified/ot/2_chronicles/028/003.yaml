translation:
  language: en
  text: He also burned incense in the Valley of Ben-hinnom. He burned his sons in the fire[a], following the detestable practices of the nations Yahweh had driven out before the people of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he made his sons pass through the fire.” The Hebrew more directly says, “he burned his sons in the fire.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and he burned his sons in the fire
  simplified_phrase: He burned his sons in the fire
  preserved_meaning: The explicit severity of the act and the reference to his sons remain unchanged.
  reasoning_layer_used: Theological decision on child sacrifice
  rationale: A new sentence makes the statement clearer without softening it.
- pob_phrase: according to the abominations of
  simplified_phrase: following the detestable practices of
  preserved_meaning: His actions copied practices strongly condemned as abhorrent.
  reasoning_layer_used: Lexical decision for כְּתוֹעֲבוֹת
  rationale: The wording states the practical sense of the phrase in common English.
- pob_phrase: before the sons of Israel
  simplified_phrase: before the people of Israel
  preserved_meaning: Yahweh expelled the nations ahead of Israel.
  reasoning_layer_used: Lexical decision for מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  rationale: “The people of Israel” is the natural modern name for the group.
