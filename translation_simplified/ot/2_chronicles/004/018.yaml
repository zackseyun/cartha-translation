  reasoning_layer_used: The lexical decisions identify “vessels” as a broad term for temple items and the abundance phrase as expressing quantity.
  rationale: “Objects” and “such great numbers” communicate the same ideas in more familiar English.
- pob_phrase: for the weight of the bronze could not be determined
  simplified_phrase: that the total weight of the bronze could not be calculated
  preserved_meaning: The bronze was so abundant that its weight was not worked out.
