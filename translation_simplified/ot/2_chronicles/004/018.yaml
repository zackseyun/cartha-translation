translation:
  language: en
  text: Solomon made all these objects in such great numbers that the total weight of the bronze could not be calculated.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “could not be determined.” The Hebrew verb can mean “searched out” or “ascertained”; here the bronze was too abundant for its weight to be calculated.
    reason: lexical_alternative
