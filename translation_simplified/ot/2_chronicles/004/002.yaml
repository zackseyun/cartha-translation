translation:
  language: en
  text: He made the Sea, the large temple basin, from cast metal.[a] It was round and measured ten cubits (about 15 feet or 4.5 meters) across from brim to brim. It was five cubits (about 7½ feet or 2.3 meters) high. A measuring line thirty cubits (about 45 feet or 13.5 meters) long went all the way around it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew name for this large basin is “the Sea”; it may also be called “the molten Sea.”
    reason: lexical_alternative
  - marker: b
    text: Cubit lengths varied, so the modern measurements are approximate.
    reason: cultural_note
