translation:
  language: en
  text: the lampstands and their lamps, all made of pure gold; the lamps were to burn as prescribed in front of the inner sanctuary.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The inner sanctuary was the temple’s innermost room, also called the Most Holy Place.
