simplification_decisions:
- pob_phrase: to burn according to the ordinance
  simplified_phrase: the lamps were to burn as prescribed
  preserved_meaning: The lamps alone were to burn according to the required temple procedure.
  reasoning_layer_used: POB lexical decisions for לְבַעֲרָם and כַּמִּשְׁפָּט
  rationale: A separate clause clearly identifies the lamps as what burned and states the requirement in modern English.
- pob_phrase: before the inner sanctuary
  simplified_phrase: in front of the inner sanctuary
  preserved_meaning: The lampstands and lamps were located before the temple’s inner room.
  reasoning_layer_used: POB lexical decision for לִפְנֵי הַדְּבִיר
  rationale: “In front of” makes the spatial meaning of “before” immediately clear without implying orientation.
- pob_phrase: of pure gold
  simplified_phrase: all made of pure gold
  preserved_meaning: Both the lampstands and their lamps were fashioned from high-quality purified gold.
  reasoning_layer_used: POB lexical decision for זָהָב סָגוּר
  rationale: “All made of” clearly applies the material description to both listed furnishings.
