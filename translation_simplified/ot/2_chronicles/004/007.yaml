translation:
  language: en
  text: He made ten gold lampstands according to the required design.[a] He placed them inside the temple building,[b] five on the right and five on the left.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean according to the prescribed rule or pattern.
    reason: lexical_alternative
  - marker: b
    text: This means the temple building itself, possibly its main hall or sanctuary, rather than the whole temple complex.
    reason: lexical_alternative
  - marker: c
    text: Depending on the temple's orientation, the right and left may correspond to the south and north sides.
    reason: cultural_note
