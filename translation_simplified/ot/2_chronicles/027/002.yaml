  text: He did what was right in Yahweh’s eyes, following his father Uzziah’s example in everything. But unlike Uzziah, he did not enter Yahweh’s temple.[a] Even so, the people continued to act corruptly.
  philosophy: optimal-equivalence
  footnotes:
