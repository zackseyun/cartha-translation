translation:
  language: en
  text: He fought against the king of the Ammonites and defeated them. That year the Ammonites gave him as tribute 100 large weights of silver, 10,000 large measures of wheat, and the same amount of barley.[a] They paid him the same tribute in each of the next two years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew units are 100 talents of silver and 10,000 cors each of wheat and barley.
    reason: cultural_note
