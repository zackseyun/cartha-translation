translation:
  language: en
  text: When Asa heard these words and the prophecy of Oded the prophet,[a] he took courage. He removed the detestable objects used to worship other gods from the entire territory of Judah and Benjamin and from the cities he had captured in the hill country of Ephraim. He also renewed Yahweh’s altar in front of the entrance hall of Yahweh’s temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew reads “the prophecy of Oded the prophet.” Some interpreters connect this wording with Azariah son of Oded in the surrounding passage.
    reason: textual_variant
