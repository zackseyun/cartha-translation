simplification_decisions:
- pob_phrase: entered into the covenant
  simplified_phrase: committed themselves by covenant
  preserved_meaning: They formally bound themselves to the covenantal commitment made by the assembly.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote
  rationale: This makes the covenantal act clear without suggesting physical movement.
- pob_phrase: with all their heart and with all their soul
  simplified_phrase: with all their heart and with all their being
  preserved_meaning: They were to seek Yahweh with undivided inward devotion and their whole selves.
  reasoning_layer_used: POB lexical decisions for לֵבָב and נֶפֶשׁ
  rationale: “Being” clearly conveys whole-person devotion while preserving both terms and the repeated “all.”
interpretive_expansions:
