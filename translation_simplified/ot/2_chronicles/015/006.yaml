simplification_decisions:
- pob_phrase: Nation was crushed by nation, and city by city
  simplified_phrase: One nation was crushed by another, and one city by another
  preserved_meaning: Nations and cities suffered violent devastation through hostile conflict.
  reasoning_layer_used: Lexical decisions for וְכֻתְּתוּ, גוֹי בְּגוֹי, and וְעִיר בְּעִיר
  rationale: Adding “one” and “another” clarifies the terse pairs while retaining the source’s passive viewpoint.
- pob_phrase: for God troubled them
  simplified_phrase: because God threw them into confusion
  preserved_meaning: God actively caused their turmoil and confusion rather than merely allowing it.
  reasoning_layer_used: Lexical decision for הֲמָמָם and theological decision on divine agency
  rationale: This wording states the source-supported sense of confusion directly and preserves God’s active agency.
- pob_phrase: with every kind of distress
  simplified_phrase: with every kind of trouble
  preserved_meaning: Every kind of affliction accompanied or contributed to the confusion.
  reasoning_layer_used: Lexical decision for בְּכָל צָרָה
  rationale: “Trouble” is common English, while “with” preserves the possible instrumental or circumstantial force.
translation_notes:
  risk_flags:
