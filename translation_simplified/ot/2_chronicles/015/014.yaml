translation:
  language: en
  text: They swore an oath to Yahweh loudly, with shouts and the sound of trumpets and horns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “horns” is “shofars.” These were different from the trumpets mentioned just before.
