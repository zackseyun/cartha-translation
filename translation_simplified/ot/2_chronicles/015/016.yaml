translation:
  language: en
  text: King Asa even removed his mother Maacah from her position as queen mother because she had made a repulsive image for Asherah.[a] He cut down her repulsive image, crushed it, and burned it in the Kidron Valley.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asherah may refer to the goddess or to a sacred object associated with her.
    reason: cultural_note
