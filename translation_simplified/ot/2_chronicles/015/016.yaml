  preserved_meaning: Asa destroyed the cult object through three distinct actions.
  reasoning_layer_used: POB lexical decisions for וַיִּכְרֹת, וַיָּדֶק, and וַיִּשְׂרֹף
  rationale: The wording remains clear and keeps each action in the destruction sequence.
