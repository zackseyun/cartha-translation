  simplified_phrase: King Asa even removed his mother Maacah from her position as queen mother
  preserved_meaning: Asa's reform extended even to removing his own mother from her royal status.
  reasoning_layer_used: POB lexical decisions for וְגַם, הֱסִירָהּ, and גְּבִירָה
  rationale: Ordinary English word order identifies the actor clearly while retaining the emphatic “even.”
- pob_phrase: a dreadful image for Asherah
  simplified_phrase: a repulsive image for Asherah
  preserved_meaning: Maacah made an offensive cult object associated with Asherah without specifying its exact form.
  reasoning_layer_used: POB lexical and theological decisions for מִפְלָצֶת and אֲשֵׁרָה
  rationale: “Repulsive image” conveys revulsion while preserving the documented uncertainty about the object.
- pob_phrase: cut down her dreadful image, crushed it, and burned it
