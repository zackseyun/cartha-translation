translation:
  language: en
  text: The whole assembly of Judah rejoiced. The priests and Levites rejoiced with them, as did everyone who had come from Israel, the resident foreigners[a] who had come from the land of Israel, and those who lived in Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “sojourners”; the Hebrew refers to non-native residents living among Israel.
    reason: lexical_alternative
