  text: Do not be like your fathers and brothers. They were unfaithful to Yahweh, the God of their fathers, and he made them a shocking sight of devastation,[a] as you can see.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also describe an object of horror or astonishment—the appalling sight caused by the devastation.
