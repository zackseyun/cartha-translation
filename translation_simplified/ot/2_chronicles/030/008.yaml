  text: Do not stubbornly stiffen your necks as your ancestors did. Give your hand to the LORD in submission,[a] and come to his sanctuary, which he has set apart as holy forever. Serve the LORD your God, so that his burning anger may turn away from you.
  philosophy: optimal-equivalence
