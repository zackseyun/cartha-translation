  language: en
  text: So they decided to send an official announcement throughout Israel, from Beersheba to Dan. The people were to come to Jerusalem to celebrate the Passover for Yahweh, the God of Israel. For they had not celebrated it in large numbers as Scripture directs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may instead mean that not many had celebrated the Passover in the prescribed way.
    reason: alternative_reading
