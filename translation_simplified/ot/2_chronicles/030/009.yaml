translation:
  language: en
  text: When you return to Yahweh, your brothers and sons will be treated with compassion by their captors, and they will return to this land. Yahweh your God is gracious and compassionate. He will not turn his face away from you if you return to him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will find compassion before their captors
  simplified_phrase: will be treated with compassion by their captors
  preserved_meaning: Those who took them captive will show them compassion.
  reasoning_layer_used: Lexical decision for לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  rationale: The passive wording replaces an unfamiliar idiom while preserving the captors as the source of compassion.
- pob_phrase: For Yahweh your God is gracious and compassionate, and he will not turn his face away
  simplified_phrase: Yahweh your God is gracious and compassionate. He will not turn his face away
  preserved_meaning: God's gracious character grounds the promise that he will not reject those who return.
  reasoning_layer_used: Lexical and theological decisions on divine mercy and the face image
  rationale: Two sentences ease reading while keeping the source-language image of God's face.
- pob_phrase: your brothers and your sons
  simplified_phrase: your brothers and sons
  preserved_meaning: The masculine family terms in the Hebrew remain explicit.
  reasoning_layer_used: Gendered-family-term theological decision
  rationale: Removing the repeated possessive makes the phrase natural without neutralizing its wording.
translation_notes:
  risk_flags:
  - risk: Readers may take “return” as physical movement rather than renewed covenant loyalty.
    mitigation: Repeating “return to Yahweh” and “return to him” preserves the relational repentance language.
  - risk: The face image may be unfamiliar to some readers.
    mitigation: The image remains because it conveys Yahweh's personal acceptance rather than mere assistance.
