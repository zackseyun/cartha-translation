translation:
  language: en
  text: So the king’s couriers carried letters authorized by the king and his officials throughout Israel and Judah. As the king commanded, they announced, “People of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel.[a] Return so that he may return to the remnant left to you—the people who escaped from the grasp of the kings of Assyria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “Israel,” not the more familiar “Jacob.”
    reason: source_note
