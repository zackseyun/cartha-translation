- pob_phrase: went with the letters from the hand of the king and his officials
  simplified_phrase: carried letters authorized by the king and his officials
  preserved_meaning: The couriers carried official letters issued with direct royal authorization.
  reasoning_layer_used: POB lexical decision for מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  rationale: The royal idiom is unpacked because “from the hand of” is less natural here.
- pob_phrase: according to the command of the king, saying
  simplified_phrase: As the king commanded, they announced
  preserved_meaning: The couriers delivered the message under the king’s command.
  reasoning_layer_used: POB lexical decision for וּכְמִצְוַת הַמֶּלֶךְ
  rationale: An active sentence makes the couriers’ role immediately clear.
- pob_phrase: Sons of Israel ... the remnant that has escaped and remains to you from the hand of the kings of Assyria
  simplified_phrase: People of Israel ... the remnant left to you—the people who escaped from the grasp of the kings of Assyria
  preserved_meaning: The whole Israelite community is addressed, and a surviving remnant remains after escaping Assyrian power.
  reasoning_layer_used: Immediate context and POB lexical decisions for בְּנֵי יִשְׂרָאֵל, הַפְּלֵיטָה, הַנִּשְׁאֶרֶת לָכֶם, and מִכַּף
  rationale: The collective address and apposition clarify the people meant while “grasp” preserves the hand image.
