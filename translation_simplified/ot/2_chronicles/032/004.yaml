translation:
  language: en
  text: Many people came together. They blocked all the springs and the flowing stream that ran through the land. They said, “Why should the kings of Assyria[a] come and find plenty of water?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “kings of Assyria,” probably referring to Assyria’s royal power or dynasty; some translations use the singular “king of Assyria” in this historical setting.
