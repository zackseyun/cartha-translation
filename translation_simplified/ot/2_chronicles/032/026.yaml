translation:
  language: en
  text: Hezekiah and the people of Jerusalem humbled themselves because of the pride in Hezekiah’s heart. So Yahweh’s wrath did not come upon them during Hezekiah’s lifetime.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Hezekiah humbled himself for the pride of his heart, he and the inhabitants of Jerusalem
  simplified_phrase: Hezekiah and the people of Jerusalem humbled themselves because of the pride in Hezekiah’s heart
  preserved_meaning: Hezekiah and Jerusalem’s people humbled themselves in response to Hezekiah’s inner pride.
  reasoning_layer_used: POB lexical decisions and Hebrew syntax
  rationale: The rewrite makes the shared action and causal sense clear without shifting Hezekiah’s pride to everyone.
- pob_phrase: the inhabitants of Jerusalem
  simplified_phrase: the people of Jerusalem
  preserved_meaning: Those living in Jerusalem joined Hezekiah in humbling themselves.
  reasoning_layer_used: POB lexical decision for יֹשְׁבֵי יְרוּשָׁלָם
  rationale: “People” is more natural for common readers than the formal civic term “inhabitants.”
- pob_phrase: in the days of Hezekiah
  simplified_phrase: during Hezekiah’s lifetime
  preserved_meaning: The judgment did not occur while Hezekiah was alive.
  reasoning_layer_used: POB lexical decision for בִּימֵי יְחִזְקִיָּהוּ
  rationale: The approved alternative states the time period in ordinary modern English.
