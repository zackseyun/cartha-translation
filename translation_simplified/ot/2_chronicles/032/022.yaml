translation:
  language: en
  text: So Yahweh saved Hezekiah and the people of Jerusalem from the power of Sennacherib king of Assyria and from every other hostile power.[a] He guided them on every side.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “from the hand of all” without stating who or what “all” includes.
    reason: lexical_alternative
  - marker: b
    text: Or, “He led them all around”; the words may also imply that he kept them secure on every side.
    reason: alternative_reading
