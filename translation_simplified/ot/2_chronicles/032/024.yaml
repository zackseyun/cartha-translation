    mitigation: “So sick that” preserves the illness’s life-threatening severity.
  - risk: “Sign” may not by itself convey the wondrous or portentous aspect of מוֹפֵת.
    mitigation: The footnote preserves “wonder” and “portent” as lexical alternatives.
