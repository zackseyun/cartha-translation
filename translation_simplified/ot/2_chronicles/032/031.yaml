translation:
  language: en
  text: God also left Hezekiah when Babylon’s rulers sent official representatives to him to investigate the sign[a] that had happened in the land. God did this to test him and to know everything that was in his heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wonder” or “portent.”
    reason: lexical_alternative
  - marker: b
    text: Some understand “to know” here as “to reveal” or “to expose” what was in his heart.
    reason: alternative_reading
