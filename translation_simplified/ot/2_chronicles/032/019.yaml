translation:
  language: en
  text: They spoke against the God of Jerusalem just as they spoke against the gods of the nations of the earth, gods made by human hands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as against the gods
  simplified_phrase: just as they spoke against the gods
  preserved_meaning: Their hostile speech treated Jerusalem’s God in the same way as the pagan gods.
  reasoning_layer_used: lexical and theological decisions on אֶל and כְּעַל
  rationale: Repeating “spoke against” makes the comparison clear in natural English.
- pob_phrase: the gods of the peoples of the earth
  simplified_phrase: the gods of the nations of the earth
  preserved_meaning: The phrase refers broadly to the gods worshiped by the world’s peoples.
  reasoning_layer_used: lexical decision on אֱלֹהֵי עַמֵּי הָאָרֶץ
  rationale: “Nations” is a documented alternative and is easier for modern readers.
- pob_phrase: the work of human hands
  simplified_phrase: gods made by human hands
  preserved_meaning: The pagan gods were manufactured idols, unlike the living God of Jerusalem.
  reasoning_layer_used: lexical decision on מַעֲשֵׂה יְדֵי הָאָדָם
  rationale: Attaching the phrase directly to the pagan gods clarifies its referent while preserving the image.
