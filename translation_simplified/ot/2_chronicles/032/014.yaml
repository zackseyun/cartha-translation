translation:
  language: en
  text: Of all the gods of the nations my forefathers devoted to destruction, which one was able to rescue his people from my hand? Why, then, should your God be able to rescue you from my hand?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devoted to destruction” means set apart to be destroyed; it can also be translated “put under the ban.”
    reason: lexical_alternative
