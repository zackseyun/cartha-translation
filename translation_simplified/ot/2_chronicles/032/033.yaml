translation:
  language: en
  text: Hezekiah slept with his fathers—that is, he died. They buried him in the upper area of the tombs of the sons of David.[a] At his death, all Judah and the people of Jerusalem honored him. His son Manasseh became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means the tombs of David’s descendants, the royal line that came from him.
    reason: lexical_alternative
