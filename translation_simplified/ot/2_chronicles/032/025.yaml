translation:
  language: en
  text: But Hezekiah did not respond appropriately to the good done to him, because his heart was proud. Therefore wrath came upon him, Judah, and Jerusalem.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: did not repay according to the benefit done to him
  simplified_phrase: did not respond appropriately to the good done to him
  preserved_meaning: Hezekiah failed to respond as he should to the good he received, without limiting that response to verbal thanks.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This makes the broad Hebrew expression clear without suggesting repayment of a debt.
- pob_phrase: therefore wrath came upon him and upon Judah and Jerusalem
  simplified_phrase: Therefore wrath came upon him, Judah, and Jerusalem
  preserved_meaning: Wrath followed Hezekiah's pride and affected him, Judah, and Jerusalem.
  reasoning_layer_used: POB lexical decision and source syntax
  rationale: The shorter wording preserves the consequence and leaves the source of wrath unstated.
translation_notes:
  risk_flags:
  - risk: Readers may interpret the appropriate response only as giving thanks.
    mitigation: The broad wording does not specify any single act.
  - risk: Readers may expect the wrath to be explicitly identified as the LORD's.
    mitigation: The wording preserves the verse's implicit agent.
