translation:
  language: en
  text: Be strong and brave. Do not be afraid or lose heart when you face the king of Assyria and all the many people with him.[a] There are more with us than with him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean the large army with him.
    reason: lexical_alternative
  - marker: b
    text: Literally, “with us is more than with him”; the comparison is explained in the next verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Be strong and courageous
  simplified_phrase: Be strong and brave
  preserved_meaning: Both commands call the people to strength and courage.
  reasoning_layer_used: POB lexical decisions for חזק and אמץ
  rationale: “Brave” expresses courage in familiar English.
- pob_phrase: Do not fear or be dismayed before
  simplified_phrase: Do not be afraid or lose heart when you face
  preserved_meaning: They must not give way to fear or discouragement in the enemy’s presence.
  reasoning_layer_used: POB lexical decisions for ירא, חתת, and מִפְּנֵי
  rationale: This wording makes both emotions and the confrontation immediately clear.
- pob_phrase: all the multitude that is with him
  simplified_phrase: all the many people with him
  preserved_meaning: This includes the whole large group accompanying the Assyrian king without limiting it only to soldiers.
  reasoning_layer_used: POB lexical decision for הָמוֹן and source כָּל
  rationale: “Many people” is plainer than “multitude,” while “all” preserves the source’s scope.
translation_notes:
  risk_flags:
  - risk: “Many people” may not immediately identify the group as troops.
    mitigation: Footnote a preserves the word’s possible military sense.
  - risk: The final comparison could be mistaken for the singular claim “greater is he.”
    mitigation: The plural wording and footnote b preserve POB’s quantitative reading.
