translation:
  language: en
  text: After these events, in which Hezekiah had acted faithfully,[a] Sennacherib king of Assyria invaded Judah. He set up camp against the fortified cities, planning to break into them and take them for himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “after these events and these faithful deeds.”
    reason: lexical_alternative
