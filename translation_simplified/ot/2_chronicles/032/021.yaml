  rationale: The possessive form expresses the same relationship more naturally.
- pob_phrase: with shame on his face
  simplified_phrase: with his face covered in shame
  preserved_meaning: He returned visibly disgraced while the image of shame on his face remains.
  reasoning_layer_used: source payload and POB translation
  rationale: The wording makes the image natural without reducing it to abstract disgrace.
- pob_phrase: struck him down there with the sword
  simplified_phrase: killed him there with the sword
  preserved_meaning: His attackers caused his death by the sword.
  reasoning_layer_used: source payload and POB translation
  rationale: The direct wording clarifies the fatal result while preserving the singular weapon expression.
