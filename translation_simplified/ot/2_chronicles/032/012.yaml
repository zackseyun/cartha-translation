translation:
  language: en
  text: Wasn’t it Hezekiah himself who removed his places of worship on the hills and his altars, and told the people of Judah and Jerusalem, “You must bow down before one altar and burn incense on it”?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You must worship before a single altar and make offerings go up in smoke on it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: his high places
  simplified_phrase: his places of worship on the hills
  preserved_meaning: The sites were elevated local places of worship that the Assyrian speaker portrayed as belonging to Judah’s God.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This replaces specialized religious vocabulary while preserving the sites’ worship function and the speaker’s possessive rhetoric.
- pob_phrase: and said to Judah and Jerusalem, saying
  simplified_phrase: and told the people of Judah and Jerusalem
  preserved_meaning: Hezekiah addressed the inhabitants of both Judah and Jerusalem.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: The repeated speech formula becomes natural English without removing either audience.
- pob_phrase: you shall bow down
  simplified_phrase: you must bow down
  preserved_meaning: Hezekiah issued a command involving physical submission in worship.
  reasoning_layer_used: POB lexical decision
  rationale: “Must” clearly marks the command while “bow down” preserves the physical image.
interpretive_expansions:
