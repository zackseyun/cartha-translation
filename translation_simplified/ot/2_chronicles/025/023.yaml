translation:
  language: en
  text: Joash king of Israel captured Amaziah king of Judah at Beth-shemesh. Amaziah was the son of Joash and the grandson of Jehoahaz. Joash took him to Jerusalem and tore down a section of the city wall about 600 feet (180 meters) long, from the Ephraim Gate to the Corner Gate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the gate that turns” or “the gate that faces.” “Corner Gate” is the likely name based on the parallel account in 2 Kings 14:13.
    reason: lexical_alternative
