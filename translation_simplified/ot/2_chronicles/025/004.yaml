translation:
  language: en
  text: 'But he did not put their sons to death. He did this because the Law in the Book of Moses records Yahweh’s command: “Fathers must not be put to death for what their sons have done, and sons must not be put to death for what their fathers have done. Each man is to be put to death only for his own sin.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Fathers shall not die for sons, and sons shall not die for fathers.” Here “die for” is a legal expression meaning “be put to death for.”
    reason: lexical_alternative
