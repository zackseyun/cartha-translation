simplification_decisions:
- pob_phrase: They carried him
  simplified_phrase: They carried his body
  preserved_meaning: They transported the dead king for burial.
  reasoning_layer_used: Lexical rationale and immediate burial context
  rationale: Naming his body prevents readers from thinking he was carried alive.
- pob_phrase: with his fathers
  simplified_phrase: with his ancestors
  preserved_meaning: He was buried with his forefathers in his familial and dynastic line.
  reasoning_layer_used: POB lexical decision on the conventional burial formula
  rationale: “Ancestors” clearly expresses the idiom without broadening it to other older relatives.
- pob_phrase: in the city of Judah
  simplified_phrase: in the city of Judah
  preserved_meaning: The burial location follows the Masoretic wording rather than a harmonized reading.
  reasoning_layer_used: POB theological decision and source-text primacy
  rationale: The unusual wording remains because the source explicitly names the city of Judah.
