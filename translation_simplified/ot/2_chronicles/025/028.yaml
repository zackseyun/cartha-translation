translation:
  language: en
  text: They carried his body on horses[a] and buried him with his ancestors in the city of Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “on the horses” and does not specify a cart or bier.
