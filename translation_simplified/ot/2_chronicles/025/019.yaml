translation:
  language: en
  text: You said, “Look, you defeated Edom! Your victory has made your heart swell with pride, and you boast.[a]” Now stay home. Why stir up a conflict that will bring disaster, causing you and Judah to fall together?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that your heart exalted you for glory or made you proud because of honor; the expression describes self-exaltation after victory.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your heart has lifted you up to boast
  simplified_phrase: Your victory has made your heart swell with pride, and you boast
  preserved_meaning: Victory led to proud self-exaltation and boasting while retaining the heart image.
  reasoning_layer_used: lexical decision and footnote
  rationale: The familiar swelling-heart image makes the pride clear without removing the Hebrew metaphor.
- pob_phrase: Why should you provoke disaster
  simplified_phrase: Why stir up a conflict that will bring disaster
  preserved_meaning: The king is warned not to provoke a confrontation that would end in calamity.
  reasoning_layer_used: lexical decisions for תתגרה and ברעה
  rationale: Naming the conflict separately from its result clarifies the warning.
- pob_phrase: so that you fall—you and Judah with you
  simplified_phrase: causing you and Judah to fall together
  preserved_meaning: Pursuing the conflict could bring down both the king and Judah.
  reasoning_layer_used: lexical decision and clause-level rationale
  rationale: Keeping the consequence inside the question preserves it as a warning rather than a certain prediction.
interpretive_expansions:
- pob_phrase: you have struck Edom, and your heart has lifted you up
  rendering: Your victory has made your heart swell with pride
  claim: The defeat of Edom is the victory that produced the king's pride.
  evidence:
  - The preceding clause states that the king defeated Edom.
  - The POB rationale identifies self-exaltation after victory.
  confidence: high
  alternatives_preserved:
