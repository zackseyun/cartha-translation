  risk_flags:
  - risk: “Swell with pride” reshapes the literal upward-motion image.
    mitigation: It retains both the heart image and the sense of proud elevation.
  - risk: The idiom may emphasize glory or honor rather than boasting alone.
    mitigation: The footnote preserves those lexical alternatives.
