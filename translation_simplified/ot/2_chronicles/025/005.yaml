translation:
  language: en
  text: Then Amaziah gathered the men of Judah. He organized the men from all Judah and Benjamin by their ancestral family groups, placing them under commanders of groups of a thousand and a hundred. He counted those who were twenty years old or older and found 300,000 able-bodied men[a] fit for military service and able to use spears and shields.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “young men,” but here it likely describes selected, able-bodied fighting men.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appointed them by fathers’ houses
  simplified_phrase: organized the men ... by their ancestral family groups
  preserved_meaning: Amaziah arranged the men according to their paternal clan divisions.
  reasoning_layer_used: POB lexical decision for לְבֵית אָבוֹת
  rationale: “Ancestral family groups” makes the social structure clearer than “fathers’ houses.”
- pob_phrase: under commanders of thousands and commanders of hundreds
  simplified_phrase: under commanders of groups of a thousand and a hundred
  preserved_meaning: The troops were placed in a ranked military command structure.
  reasoning_layer_used: POB lexical decision for לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  rationale: Naming the groups clarifies what the numbers describe.
- pob_phrase: He mustered them from twenty years old and upward
  simplified_phrase: He counted those who were twenty years old or older
  preserved_meaning: Amaziah conducted a military count using age twenty as the threshold.
  reasoning_layer_used: POB lexical decisions for וַיִּפְקְדֵם and the age formula
  rationale: “Counted” and “or older” replace formal military and age wording with common English.
