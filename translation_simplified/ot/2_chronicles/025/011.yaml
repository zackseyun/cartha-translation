  preserved_meaning: Amaziah actively made himself strong for what followed.
  reasoning_layer_used: POB lexical decision for הִתְחַזַּק
  rationale: The common expression keeps the Hebrew verb’s reflexive sense without limiting it to courage alone.
- pob_phrase: led his people, and went to the Valley of Salt
  simplified_phrase: led his people to the Valley of Salt
  preserved_meaning: Amaziah brought his people with him to the named location.
  reasoning_layer_used: POB lexical decisions for וַיִּנְהַג and גֵּיא הַמֶּלַח
  rationale: Combining the movement clauses gives natural English without adding military tactics.
- pob_phrase: the sons of Seir
  simplified_phrase: people of Seir
  preserved_meaning: The casualties belonged to the ethnic or genealogical group associated with Seir.
  reasoning_layer_used: POB lexical decision and footnote for בְּנֵי שֵׂעִיר
  rationale: The main text states the idiom’s clear meaning, while the footnote preserves its literal form.
