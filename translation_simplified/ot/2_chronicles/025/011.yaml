translation:
  language: en
  text: Then Amaziah gathered his strength and led his people to the Valley of Salt. There he struck down ten thousand people of Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of Seir,” an expression meaning the people or descendants of Seir.
    reason: lexical_alternative
