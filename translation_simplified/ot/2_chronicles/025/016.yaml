translation:
  language: en
  text: While the prophet was speaking to him, the king said, “Did we appoint you as the king’s adviser? Stop! Why should they[a] strike you down?” So the prophet stopped and said, “I know that God has decided to destroy you, because you have done this and have not listened to my advice.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify who “they” are, but the king is probably threatening punishment by people acting at his command.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened, as he was speaking to him, that the king said
  simplified_phrase: While the prophet was speaking to him, the king said
  preserved_meaning: The king interrupts the prophet while he is speaking.
  reasoning_layer_used: Source syntax and the revision identifying the king as speaker
  rationale: The time clause removes an unnecessary narrative formula and clearly identifies both speakers.
- pob_phrase: Have we made you the king’s adviser?
  simplified_phrase: Did we appoint you as the king’s adviser?
  preserved_meaning: The king rebukes the prophet for acting as an adviser without royal appointment.
  reasoning_layer_used: Lexical decisions for נְתַנּוּךָ and הַלְיוֹעֵץ
  rationale: “Appoint” clearly describes placing someone in an official advisory role.
- pob_phrase: God has determined to destroy you ... not listened to my counsel
  simplified_phrase: God has decided to destroy you ... not listened to my advice
  preserved_meaning: God’s destructive judgment is settled because the king acted wrongly and ignored the prophet.
  reasoning_layer_used: Lexical and theological decisions for יָעַץ and עֵצָה
  rationale: “Decided” and “advice” use familiar words while preserving the settled judgment and counsel theme.
translation_notes:
  risk_flags:
  - risk: “Decided” may sound less formal than “determined.”
    mitigation: It still presents God’s judgment as a settled intention without softening it.
  - risk: Modern readers may not know who “they” are.
    mitigation: The footnote keeps the agents unidentified while explaining the likely royal-command context.
