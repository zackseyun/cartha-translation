translation:
  language: en
  text: Then Yahweh’s anger burned against Amaziah, and he sent a prophet to him. The prophet said, “Why have you turned to that people’s gods?[a] They did not save their own people from your grasp.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “consulted” or “inquired of.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and he sent a prophet to him, who said to him
  simplified_phrase: and he sent a prophet to him. The prophet said
  preserved_meaning: Yahweh sent the prophet who delivered the rebuke.
  reasoning_layer_used: source syntax and POB translation
  rationale: Splitting the sentence makes the speaker clear and the rebuke easier to follow.
- pob_phrase: sought the gods of the people
  simplified_phrase: turned to that people’s gods
  preserved_meaning: Amaziah sought religious help or guidance from the defeated people’s gods.
  reasoning_layer_used: POB lexical decision for דָרַשְׁתָּ
  rationale: “Turned to” is natural English while remaining broad enough to include seeking or consulting.
- pob_phrase: did not deliver their people from your hand
  simplified_phrase: did not save their own people from your grasp
  preserved_meaning: Those gods failed to rescue their people from Amaziah’s power.
  reasoning_layer_used: POB lexical decisions for הִצִּילוּ, עַמָּם, and מִיָּדֶךָ
  rationale: “From your grasp” keeps the concrete image of control while making the military meaning clear.
translation_notes:
