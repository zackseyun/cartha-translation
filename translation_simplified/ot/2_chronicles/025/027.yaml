- pob_phrase: turned away from following Yahweh
  simplified_phrase: stopped following Yahweh
  preserved_meaning: Amaziah ceased his covenantal allegiance to Yahweh.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Stopped following” states the Hebrew idiom plainly while preserving its sense of apostasy.
- pob_phrase: they conspired against him
  simplified_phrase: they plotted against him
  preserved_meaning: They formed a deliberate conspiracy against Amaziah.
  reasoning_layer_used: lexical decision
  rationale: “Plotted” is common English and retains the deliberate hostile action.
- pob_phrase: and he fled to Lachish; but they sent after him to Lachish
  simplified_phrase: Amaziah fled to Lachish, but they sent men after him
  preserved_meaning: His enemies dispatched agents to pursue him after his escape.
  reasoning_layer_used: lexical decision and narrative context
  rationale: The sentence break and repeated name clarify the sequence without changing it.
interpretive_expansions:
- pob_phrase: they sent after him
  rendering: they sent men after him
  claim: The conspirators dispatched agents to go after Amaziah.
  evidence:
