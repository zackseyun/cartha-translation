translation:
  language: en
  text: The men of Judah captured ten thousand people alive. They brought the prisoners to the top of a cliff and threw them over the edge. Every one of them was dashed to pieces.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Judah
  simplified_phrase: the men of Judah
  preserved_meaning: The people from Judah carried out the military action.
  reasoning_layer_used: source idiom and narrative context
  rationale: “Men of Judah” expresses the group naturally without the opaque literal idiom “sons of Judah.”
- pob_phrase: captured ten thousand alive
  simplified_phrase: captured ten thousand people alive ... the prisoners
  preserved_meaning: Ten thousand people were taken alive as captives.
  reasoning_layer_used: POB lexical decisions for שָׁבוּ and חַיִּים
  rationale: Naming them as prisoners clarifies their status while preserving that they were captured alive.
- pob_phrase: threw them down from the top of the cliff, and all of them were dashed to pieces
  simplified_phrase: threw them over the edge. Every one of them was dashed to pieces
  preserved_meaning: They were thrown from the cliff, and the entire group was violently broken apart.
  reasoning_layer_used: POB lexical decisions for וַיַּשְׁלִיכוּם, וְכֻלָּם, and נִבְקָעוּ
  rationale: Two direct sentences remove repetition while retaining the motion, totality, and violence.
translation_notes:
  risk_flags:
