translation:
  language: en
  text: After seeking advice, Amaziah king of Judah sent word to Joash king of Israel, the son of Jehoahaz and grandson of Jehu. Amaziah said, “Come, let us face each other.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “let us meet face to face.” This Hebrew expression likely challenges Joash to a direct confrontation.
    reason: lexical_alternative
