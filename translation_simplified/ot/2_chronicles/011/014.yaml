translation:
  language: en
  text: The Levites left behind their pasturelands and property and moved to Judah and Jerusalem. They did this because Jeroboam and his sons had rejected them and barred them from serving Yahweh as priests.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: left their pasturelands and their possessions
  simplified_phrase: left behind their pasturelands and property
  preserved_meaning: They departed from both the grazing lands and the landed holdings that belonged to them.
  reasoning_layer_used: POB lexical decisions for מִגְרְשֵׁיהֶם and אֲחֻזָּתָם
  rationale: “Left behind” makes the cost of their departure clear, while “property” naturally conveys their holdings.
- pob_phrase: went to Judah and Jerusalem
  simplified_phrase: moved to Judah and Jerusalem
  preserved_meaning: They relocated toward Judah and Jerusalem.
  reasoning_layer_used: POB lexical decision for וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  rationale: “Moved to” clearly expresses relocation rather than a temporary trip.
- pob_phrase: had rejected them from serving as priests to Yahweh
  simplified_phrase: had rejected them and barred them from serving Yahweh as priests
  preserved_meaning: Jeroboam and his sons personally rejected the Levites and excluded them from priestly service to Yahweh.
  reasoning_layer_used: POB lexical decisions for הִזְנִיחָם and מִכַּהֵן, with the theological decision for יהוה
  rationale: “Barred” plainly conveys the institutional exclusion while retaining the force of “rejected.”
translation_notes:
  risk_flags:
  - risk: “Moved” may suggest permanent relocation more explicitly than “went.”
    mitigation: The departure from their lands and property strongly supports relocation in this context.
