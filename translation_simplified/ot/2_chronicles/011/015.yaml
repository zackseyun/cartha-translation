  preserved_meaning: He personally established priests to serve his worship system.
  reasoning_layer_used: Lexical decision for וַיַּעֲמֶד and לּוֹ
  rationale: The simpler possessive wording preserves both appointment to office and action in his own interest.
- pob_phrase: the high places
  simplified_phrase: the high-place shrines
  preserved_meaning: These were unauthorized worship sites traditionally called high places.
  reasoning_layer_used: Lexical decision for לַבָּמוֹת
  rationale: Adding “shrines” makes the cultic meaning clear without losing the established biblical term.
- pob_phrase: the calves that he had made
  simplified_phrase: the calf idols he had made
  preserved_meaning: The calves were manufactured images used in his worship system.
  reasoning_layer_used: Lexical rationale and immediate cultic context
  rationale: Calling them idols prevents readers from mistaking them for living animals.
