translation:
  language: en
  text: He appointed his own priests for the high-place shrines, the goat-demons,[a] and the calf idols he had made.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “satyrs” or “goats”; here it probably refers to goat-like beings connected with forbidden worship.
    reason: lexical_alternative
