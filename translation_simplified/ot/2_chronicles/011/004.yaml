translation:
  language: en
  text: 'This is what Yahweh says: “Do not march out, and do not fight against your brothers, your fellow Israelites. Each of you, go home, because I am the one who brought this about.” They listened to what Yahweh said and turned back instead of marching against Jeroboam.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words introduce an authoritative message from Yahweh.
  reasoning_layer_used: Lexical decision for the prophetic messenger formula
  rationale: The permitted alternative is clearer in common English while retaining the formula’s authority.
- pob_phrase: You must not go up or fight
  simplified_phrase: Do not march out, and do not fight
  preserved_meaning: Yahweh forbids both the military advance and the battle itself.
  reasoning_layer_used: Lexical decisions for עלה and לחם
  rationale: “March out” makes the military sense of “go up” clear without merging the two prohibitions.
- pob_phrase: Return, each man to his house
  simplified_phrase: Each of you, go home
  preserved_meaning: Every man in the addressed force is ordered to return home.
  reasoning_layer_used: Lexical decision for the distributive phrase
  rationale: The direct command expresses the same distributive force in natural modern English.
interpretive_expansions:
- pob_phrase: your brothers
  rendering: your brothers, your fellow Israelites
  claim: The people they intended to fight were fellow members of Israel.
  evidence:
  - The POB cultural note says “brothers” emphasizes that the opponents are fellow Israelites.
  confidence: high
  alternatives_preserved:
  - your brothers
- pob_phrase: this thing has come from me
  rendering: I am the one who brought this about
  claim: Yahweh attributes the present political situation to his agency.
  evidence:
  - The Hebrew clause explicitly presents the matter as coming from Yahweh.
  - The POB theological decision preserves divine causation without expanding it into a broader doctrine.
  confidence: high
  alternatives_preserved:
  - this matter is from me
