translation:
  language: en
  text: Rehoboam married Mahalath.[a] She was the daughter of Jerimoth, a son of David, and Abihail, a daughter of Eliab and granddaughter of Jesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew genealogy is compressed and difficult. It most likely gives Mahalath’s family line through both Jerimoth and Abihail; some understand Abihail differently or, less likely, as another wife.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: took as wife
  simplified_phrase: married
  preserved_meaning: Rehoboam entered into marriage with Mahalath.
  reasoning_layer_used: POB lexical decision
  rationale: “Married” expresses the Hebrew marital idiom in ordinary English.
- pob_phrase: Mahalath the daughter of Jerimoth son of David, and Abihail the daughter of Eliab son of Jesse
  simplified_phrase: She was the daughter of Jerimoth, a son of David, and Abihail, a daughter of Eliab and granddaughter of Jesse
  preserved_meaning: Mahalath is identified through the family lines of Jerimoth and Abihail.
  reasoning_layer_used: POB theological decision
  rationale: A separate sentence makes the compressed genealogy easier to follow.
- pob_phrase: Eliab son of Jesse
  simplified_phrase: Eliab and granddaughter of Jesse
  preserved_meaning: Abihail was Eliab’s daughter, so Mahalath stood one generation below Eliab and two below Jesse.
  reasoning_layer_used: POB genealogy and lexical decisions
  rationale: “Granddaughter” states the same family relationship more directly.
interpretive_expansions:
- pob_phrase: and Abihail the daughter of Eliab son of Jesse
  rendering: and Abihail, a daughter of Eliab and granddaughter of Jesse
  claim: Abihail belongs to Mahalath’s genealogy rather than being introduced as a second wife.
  evidence:
  - The verse introduces a singular wife.
  - The POB theological decision identifies Mahalath through both paternal and maternal ancestry.
  - Chronicles often compresses genealogical relationships.
  confidence: moderate
  alternatives_preserved:
  - Abihail may be understood differently within the family notice.
  - Abihail may less likely be a second wife.
