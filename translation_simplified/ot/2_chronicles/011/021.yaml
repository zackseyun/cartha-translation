translation:
  language: en
  text: Rehoboam loved Maacah, the daughter of Absalom,[a] more than all his other wives and concubines.[b] His household included eighteen wives and sixty concubines in all. He fathered twenty-eight sons and sixty daughters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “a descendant of Absalom.” In genealogies, the Hebrew word for “daughter” can sometimes have this broader meaning.
    reason: alternative_reading
  - marker: b
    text: Concubines were recognized partners who had a lower status than wives.
    reason: cultural_note
simplification_decisions:
- pob_phrase: more than all his wives and his concubines
  simplified_phrase: more than all his other wives and concubines
  preserved_meaning: Maacah received greater love than every other wife or concubine.
  reasoning_layer_used: Lexical decisions for מִכָּל and פִּילַגְשִׁים, supported by the immediate context.
  rationale: “Other” makes the comparison clear while keeping wives and concubines distinct.
- pob_phrase: for he had taken eighteen wives and sixty concubines
  simplified_phrase: His household included eighteen wives and sixty concubines in all.
  preserved_meaning: The large number of wives and concubines supplies background for Rehoboam’s special love for Maacah.
  reasoning_layer_used: Discourse decision for כִּי and lexical decision for נָשִׁים ... נָשָׂא.
  rationale: A linked sentence preserves the explanatory background without the formal conjunction “for.”
- pob_phrase: and he fathered twenty-eight sons and sixty daughters
  simplified_phrase: He fathered twenty-eight sons and sixty daughters.
  preserved_meaning: Rehoboam was the father of the stated numbers of sons and daughters.
  reasoning_layer_used: Lexical decisions for וַיּוֹלֶד and the numbered child terms.
  rationale: A short sentence keeps the exact family counts easy to follow.
interpretive_expansions:
- pob_phrase: his wives and his concubines
  rendering: his other wives and concubines
  claim: Maacah belonged to the group being compared, so the remaining women are called “other.”
  evidence:
  - The comparison sets Maacah against Rehoboam’s wives and concubines.
  - The preceding context identifies Maacah as one of Rehoboam’s wives.
  confidence: high
  alternatives_preserved:
  - more than all his wives and concubines
translation_notes:
  risk_flags:
  - risk: “Daughter of Absalom” may mean a later female descendant rather than an immediate daughter.
    mitigation: The main text retains the Hebrew wording, while footnote [a] preserves the broader possibility.
  - risk: Modern readers may not know the historical status of a concubine.
    mitigation: Footnote [b] explains the distinction without replacing the source term.
