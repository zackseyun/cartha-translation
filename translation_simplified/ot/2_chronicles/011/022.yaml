translation:
  language: en
  text: Rehoboam appointed Abijah son of Maacah as the chief leader among his brothers.[a] He did this because he intended to make Abijah king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “chief leader over his brothers”; the Hebrew describes Abijah’s leading position in relation to them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appointed Abijah son of Maacah as chief among his brothers
  simplified_phrase: appointed Abijah son of Maacah as the chief leader among his brothers
  preserved_meaning: Rehoboam formally designated Abijah for the leading governing role in relation to his brothers.
  reasoning_layer_used: The lexical decisions for וַיַּעֲמֵד, לָרֹאשׁ, לְנָגִיד, and בְּאֶחָיו establish formal appointment, leadership, and familial precedence.
  rationale: “Chief leader” makes the ruling role clear without reducing it to honorary rank.
- pob_phrase: for he intended to make him king
  simplified_phrase: He did this because he intended to make Abijah king.
  preserved_meaning: Rehoboam’s plan to make Abijah king explains the appointment.
  reasoning_layer_used: The lexical decisions for כִּי and לְהַמְלִיכוֹ establish reason and royal intent.
  rationale: A separate sentence clarifies the reason and names Abijah instead of using an uncertain pronoun.
