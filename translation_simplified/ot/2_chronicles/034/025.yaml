  simplified_phrase: they have abandoned me
  preserved_meaning: They rejected their covenant God.
  reasoning_layer_used: POB lexical decision for עֲזָבוּנִי
  rationale: “Abandoned” is common English and retains the gravity of their rejection.
- pob_phrase: by all the works of their hands
  simplified_phrase: by everything they have made and done
  preserved_meaning: Their handmade idols and related actions provoked God.
  reasoning_layer_used: POB lexical rationale and cultural footnote b
  rationale: This explains the idiom while keeping the people as those who provoke God.
- pob_phrase: will not be quenched
  simplified_phrase: my wrath will not be put out
  preserved_meaning: God’s judgment is pictured as a fire that cannot be extinguished.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Repeating “my wrath” removes pronoun ambiguity while preserving the fire image.
