  text: Because they have abandoned me and burned incense to other gods[a], they have provoked me to anger by everything they have made and done. So I will pour out my wrath on this place, and my wrath will not be put out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “foreign gods.” The Hebrew more literally says “other gods.”
