translation:
  language: en
  text: Then the king stood in his appointed place and made the covenant before Yahweh. He promised to follow Yahweh and to obey his commandments, covenant requirements, and prescribed laws with all his heart and soul. He would carry out the terms of the covenant written in this book.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient document may have been a scroll.
    reason: lexical_alternative
