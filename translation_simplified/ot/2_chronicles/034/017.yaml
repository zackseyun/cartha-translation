translation:
  language: en
  text: They have poured out the silver found in Yahweh’s temple and handed it over to the supervisors and the people doing the work.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Poured out” may mean that they emptied out or disbursed the silver, not that they melted it down.
