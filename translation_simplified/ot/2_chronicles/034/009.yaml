translation:
  language: en
  text: Then they went to Hilkiah the high priest and handed over the money brought to the house of God. The Levites who served as doorkeepers[a] had collected it from Manasseh and Ephraim, from all the remnant of Israel, from all Judah and Benjamin, and from the people living in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “keepers of the threshold”; this means the temple doorkeepers or gatekeepers.
    reason: lexical_alternative
