  rationale: This makes the practical sense of the inquiry immediately clear.
- pob_phrase: the remnant in Israel and in Judah
  simplified_phrase: the remnant, those still left in Israel and Judah
  preserved_meaning: The command includes the remaining people of Israel and Judah.
  reasoning_layer_used: lexical decision for הַנִּשְׁאָר
  rationale: The brief explanation clarifies “remnant” without removing its covenant-historical force.
- pob_phrase: concerning the words of the book
