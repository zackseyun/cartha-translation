translation:
  language: en
  text: Go and seek guidance from Yahweh for me and for the remnant, those still left in Israel and Judah. Ask him about what is written in the book[a] that was found. Yahweh’s great wrath has been poured out on us because our fathers[b] did not keep Yahweh’s word by doing everything written in this book.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “scroll.” The Hebrew word can mean either a book or a scroll.
    reason: lexical_alternative
  - marker: b
    text: Or “ancestors.” The Hebrew is literally “fathers.”
    reason: lexical_alternative
