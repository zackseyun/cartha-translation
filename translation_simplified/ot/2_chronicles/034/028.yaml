translation_notes:
  risk_flags:
  - risk: “In peace” could be mistaken for a promise of a nonviolent death.
    mitigation: The footnote preserves the POB reading that the following clause explains the promised peace.
  - risk: “Buried” does not reproduce the Hebrew passive gathering image or plural “graves.”
    mitigation: The first clause preserves the gathering image, while natural English conveys the separate burial clause without implying multiple graves.
