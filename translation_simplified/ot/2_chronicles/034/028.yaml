translation:
  language: en
  text: “Listen, I am about to gather you to your ancestors in death. You will be buried in peace.[a] Your own eyes will not see all the disaster I am bringing on this place and its people.” Then the messengers returned and reported this to the king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “in peace” means at least that Josiah would not live to see the coming disaster; it does not necessarily mean that he would die without violence.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Behold, I am about to gather you to your fathers
  simplified_phrase: Listen, I am about to gather you to your ancestors in death
  preserved_meaning: The urgent divine declaration retains the image of joining one’s ancestors at death.
  reasoning_layer_used: lexical decisions and POB footnote a
  rationale: The wording makes the Hebrew death idiom immediately understandable.
- pob_phrase: you will be gathered to your graves in peace
  simplified_phrase: You will be buried in peace
  preserved_meaning: Josiah will go to burial in peace without merging this clause with the ancestors image.
  reasoning_layer_used: lexical and theological decisions
  rationale: Natural singular wording avoids the misleading English plural while keeping burial and peace distinct.
- pob_phrase: And they brought back word to the king
  simplified_phrase: Then the messengers returned and reported this to the king
  preserved_meaning: Those sent to inquire returned with the message for the king.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The report idiom is expressed directly in ordinary English.
