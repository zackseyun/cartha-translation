translation:
  language: en
  text: 'Then Hilkiah and the others whom the king had sent went to Huldah the prophetess. She was the wife of Shallum, who was in charge of the garments.[a] Shallum was the son of Tokhath and the grandson of Hasrah. Huldah lived in Jerusalem’s Second Quarter.[b] They said this to her:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “keeper of the wardrobe.” The Hebrew literally says “keeper of the garments.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew name is Mishneh, likely a district of Jerusalem traditionally called the “Second Quarter.”
    reason: cultural_note
