translation:
  language: en
  text: “Your heart was tender and ready to listen. When you heard God’s message of judgment against this place and its people, you humbled yourself before him. You humbled yourself before me, tore your clothes,[a] and wept in my presence. Because you did this, I have heard you,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tearing one’s clothes was a sign of deep grief or mourning.
    reason: cultural_note
