    text: Or “sun-pillars.” The Hebrew term is uncertain and may refer to sacred pillars linked to sun worship.
    reason: lexical_alternative
  - marker: b
    text: Or “Asherah poles.” The term can refer to sacred objects associated with Asherah.
    reason: lexical_alternative
