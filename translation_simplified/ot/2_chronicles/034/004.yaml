  text: While Josiah was there, they tore down the altars of the Baals. He cut down the incense altars[a] that stood above them. He shattered the Asherim[b], the carved images, and the metal images, then crushed them into small pieces. He scattered the pieces over the graves of those who had sacrificed to them.
  philosophy: optimal-equivalence
