translation:
  language: en
  text: In the eighth year of his reign, while he was still young, he began to seek the God of David his father.[a] In the twelfth year of his reign, he began to cleanse Judah and Jerusalem by removing the shrines on the high places, the Asherah symbols,[b] the carved images, and the metal images.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” means ancestor and reflects the Bible’s royal family language.
    reason: lexical_alternative
  - marker: b
    text: These may have been wooden poles or trees associated with the goddess Asherah.
    reason: lexical_alternative
