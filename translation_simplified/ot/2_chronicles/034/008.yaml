  preserved_meaning: The officials were commissioned so that Yahweh’s temple would be restored, without implying that they personally did the building work.
  reasoning_layer_used: POB lexical and theological decisions plus grounding review
  rationale: The commission is clear while the house image and divine name remain intact.
