translation:
  language: en
  text: Josiah removed all the detestable things from every territory belonging to the sons of Israel. He made everyone in Israel serve Yahweh their God. As long as Josiah lived, the people did not turn away from following Yahweh, the God of their fathers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The God of their fathers” means the covenant God worshiped by their forefathers.
    reason: cultural_note
