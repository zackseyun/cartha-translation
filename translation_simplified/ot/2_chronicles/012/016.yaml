translation:
  language: en
  text: Rehoboam slept with his ancestors in death[a] and was buried in the City of David. His son Abijah became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a customary royal expression for dying and joining one’s ancestral line.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: slept with his fathers
  simplified_phrase: slept with his ancestors in death
  preserved_meaning: Rehoboam died and joined his ancestral line, while the Hebrew sleep image remains.
  reasoning_layer_used: POB lexical decisions and footnote
  rationale: “Ancestors” is clearer today, and “in death” prevents misunderstanding without removing the royal formula.
- pob_phrase: Abijah his son reigned in his place
  simplified_phrase: His son Abijah became king in his place
  preserved_meaning: Abijah succeeded his father as king.
  reasoning_layer_used: POB lexical decision for וַיִּמְלֹךְ and תַּחְתָּיו
  rationale: “Became king” states the succession more naturally for a common reader.
interpretive_expansions:
