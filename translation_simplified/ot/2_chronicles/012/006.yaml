translation:
  language: en
  text: Then Israel’s leaders[a] and the king humbled themselves. They said, “Yahweh is righteous.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “Israel’s leaders.” In this setting, some understand this to mean the leaders of Judah under Rehoboam.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the leaders of Israel and the king
  simplified_phrase: Israel’s leaders and the king
  preserved_meaning: The ruling leaders remain distinct from the king, and the name Israel is retained.
  reasoning_layer_used: Lexical and theological decisions on שָׂרֵי יִשְׂרָאֵל
  rationale: The possessive form is more direct while preserving the source wording “Israel.”
- pob_phrase: humbled themselves and said
  simplified_phrase: humbled themselves. They said
  preserved_meaning: Their submission to the rebuke is followed by their confession about Yahweh.
  reasoning_layer_used: Lexical decision on וַיִּכָּנְעוּ and narrative syntax
  rationale: Two sentences make the sequence easier to follow without separating the actions.
translation_notes:
  risk_flags:
  - risk: Readers may expect “Judah’s leaders” because the king is Rehoboam.
    mitigation: The text keeps “Israel,” and the footnote preserves the contextual alternative without harmonizing it.
