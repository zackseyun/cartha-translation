translation:
  language: en
  text: King Rehoboam strengthened his rule in Jerusalem and reigned. He was forty-one years old when he began to reign, and he ruled in Jerusalem for seventeen years. Yahweh had chosen Jerusalem from among all the tribes of Israel as the city where he would put his name. Rehoboam’s mother was Naamah, an Ammonite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Naamah the Ammonite.”
    reason: simplification_note
