  rationale: “Attacked” makes the military force of the Hebrew idiom immediately clear.
- pob_phrase: the treasuries of the house of Yahweh and the treasuries of the king’s house
  simplified_phrase: the treasures from Yahweh’s temple and from the royal palace
  preserved_meaning: Shishak seized the valuables kept in the temple and palace.
