translation:
  language: en
  text: God said to Solomon, “Because this desire was in your heart, you did not ask for wealth, possessions, or honor. You did not ask for the lives of those who hate you or for a long life.[a] Instead, you asked for wisdom and knowledge for yourself so that you could judge my people, over whom I have made you king,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “many days.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because this was in your heart
  simplified_phrase: Because this desire was in your heart
  preserved_meaning: Solomon’s inward intention is the reason for God’s response.
  reasoning_layer_used: POB lexical decision for הָיְתָה זֹאת עִם לְבָבֶךָ and immediate context
  rationale: “Desire” identifies what was in Solomon’s heart while preserving the heart image.
- pob_phrase: or for the life of those who hate you, nor did you ask for many days
  simplified_phrase: You did not ask for the lives of those who hate you or for a long life
  preserved_meaning: Solomon did not request his enemies’ deaths or a longer lifespan.
  reasoning_layer_used: POB lexical decisions for נֶפֶשׁ שֹׂנְאֶיךָ and יָמִים רַבִּים
  rationale: The wording states both rejected requests in direct, natural English.
- pob_phrase: but asked for wisdom and knowledge for yourself, that you might judge my people over whom I have made you king
  simplified_phrase: Instead, you asked for wisdom and knowledge for yourself so that you could judge my people, over whom I have made you king
  preserved_meaning: Solomon requested both gifts to fulfill his royal duty of judging God’s people.
  reasoning_layer_used: POB lexical decisions for חָכְמָה, מַדָּע, לְךָ, אֲשֶׁר תִּשְׁפּוֹט, and הִמְלַכְתִּיךָ עָלָיו
  rationale: The shorter contrast and purpose clause clarify the relationship between the request and Solomon’s duty.
