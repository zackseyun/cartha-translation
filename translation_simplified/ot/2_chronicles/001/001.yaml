translation:
  language: en
  text: Solomon son of David grew strong in his rule over the kingdom.[a] Yahweh his God was with him and made him very great.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “strengthened himself over his kingdom” or “became established over his kingdom.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the divine name YHWH, traditionally rendered “the LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: strengthened himself over his kingdom
  simplified_phrase: grew strong in his rule over the kingdom
  preserved_meaning: Solomon became strong while exercising authority over his kingdom.
  reasoning_layer_used: Lexical decision for וַיִּתְחַזֵּק and עַל מַלְכוּתוֹ
  rationale: The wording uses natural English while retaining Solomon’s agency and royal authority.
- pob_phrase: made him exceedingly great
  simplified_phrase: made him very great
  preserved_meaning: Yahweh actively raised Solomon to an exceptional level of greatness.
  reasoning_layer_used: Lexical decisions for וַיְגַדְּלֵהוּ and לְמָעְלָה
  rationale: “Very” expresses the intensive force more plainly than “exceedingly.”
