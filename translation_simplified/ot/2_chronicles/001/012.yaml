translation:
  language: en
  text: You have been given wisdom and knowledge. I will also give you wealth, possessions, and honor unlike anything any king before you has had or any king after you will have.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Wisdom and knowledge are given to you
  simplified_phrase: You have been given wisdom and knowledge
  preserved_meaning: Wisdom and knowledge have been granted to Solomon.
  reasoning_layer_used: Lexical decision for נָתוּן לָךְ
  rationale: Subject-first wording is more natural while preserving the passive grant.
- pob_phrase: riches and possessions and honor
  simplified_phrase: wealth, possessions, and honor
  preserved_meaning: God promises material wealth, property, and royal honor as distinct gifts.
  reasoning_layer_used: Lexical decisions for עֹשֶׁר, נְכָסִים, and כָבוֹד
  rationale: “Wealth” is more familiar than “riches,” and the three gifts remain distinct.
- pob_phrase: such as no kings before you have had, and none after you will have the like
  simplified_phrase: unlike anything any king before you has had or any king after you will have
  preserved_meaning: The whole set of named gifts will be unmatched among earlier and later kings.
  reasoning_layer_used: Lexical rationale for אֲשֶׁר לֹא הָיָה כֵן and the theological scope decision
  rationale: “Unlike anything” preserves the unmatched comparison without implying a separate quantitative ranking for each gift.
translation_notes:
  risk_flags:
  - risk: “Unlike anything” could be read broadly beyond the named gifts.
    mitigation: Its placement directly after the list confines the comparison to wisdom, knowledge, wealth, possessions, and honor.
