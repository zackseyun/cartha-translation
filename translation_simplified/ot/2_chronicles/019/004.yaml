translation:
  language: en
  text: Jehoshaphat lived in Jerusalem.[a] He again traveled among the people, all the way from Beersheba to the hill country of Ephraim, and brought them back to Yahweh,[b] the God of their fathers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “returned to Jerusalem and went out among the people again.” The Hebrew repeats the idea of returning, probably showing that Jehoshaphat resumed this work.
    reason: lexical_alternative
  - marker: b
    text: Some translations render the divine name YHWH as “the LORD.”
    reason: alternative_reading
