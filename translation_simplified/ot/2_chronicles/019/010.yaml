translation:
  language: en
  text: Whenever a dispute from your brothers who live in their cities comes before you—whether it concerns one kind of bloodshed or another,[a] or differences about law and commandment, statutes and judgments—you must warn them so that they do not incur guilt before Yahweh. Otherwise, his wrath will come upon you and your brothers. Do this, and you will not incur guilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “between blood and blood”; the expression likely refers to different cases involving bloodshed or homicide.
    reason: lexical_alternative
