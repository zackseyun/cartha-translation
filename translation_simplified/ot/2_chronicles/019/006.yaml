  text: He said to the judges, “Pay careful attention to what you are doing. You are not judging on behalf of man,[a] but on behalf of Yahweh, and he is with you as you judge.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” means humankind in contrast with Yahweh.
    reason: lexical_alternative
