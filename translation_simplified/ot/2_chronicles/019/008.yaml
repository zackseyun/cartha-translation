translation:
  language: en
  text: In Jerusalem, Jehoshaphat also appointed some Levites and priests, along with some leaders of Israel’s ancestral families. They were to handle judgments belonging to Yahweh[a] and settle disputes. Then they returned to Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean cases governed by Yahweh’s law or judgments made under his authority.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “they returned to Jerusalem.” Some understand it as “they lived in Jerusalem” because “returned” seems abrupt here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the heads of the fathers’ houses of Israel
  simplified_phrase: leaders of Israel’s ancestral families
  preserved_meaning: These were leaders of Israel’s extended family groups.
  reasoning_layer_used: POB lexical decision for רָאשֵׁי הָאָבוֹת
  rationale: “Ancestral families” makes the social structure clear without reducing it to immediate households.
- pob_phrase: for the judgment of Yahweh
  simplified_phrase: to handle judgments belonging to Yahweh
  preserved_meaning: Their judicial work concerned judgments associated with Yahweh.
  reasoning_layer_used: POB lexical and theological decisions for לְמִשְׁפַּט יְהוָה
  rationale: The wording clarifies their task while leaving Yahweh’s exact relation to the judgments open.
- pob_phrase: and for disputes
  simplified_phrase: and settle disputes
  preserved_meaning: They were appointed to deal with contested legal matters.
  reasoning_layer_used: POB lexical decision for וְלָרִיב
  rationale: The verbal form states the officials’ purpose in ordinary English.
