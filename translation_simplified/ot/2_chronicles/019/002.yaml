translation:
  language: en
  text: Jehu son of Hanani, the seer,[a] went out to meet King Jehoshaphat. He said, “Should you help wicked people and love those who hate Yahweh? Because of this, Yahweh’s wrath is upon you; it comes from his presence.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer was a person who received revelations from God; it was a specific prophetic title.
    reason: cultural_note
