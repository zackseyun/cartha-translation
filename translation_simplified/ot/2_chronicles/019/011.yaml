  language: en
  text: 'Pay attention: Amariah the chief priest[a] will be in charge of you in every matter concerning Yahweh. Zebadiah son of Ishmael, the ruler over the house of Judah, will be in charge of every matter concerning the king. The Levites will serve you as officers. Be strong and carry out your duty. May Yahweh be with those who do good.[b]'
