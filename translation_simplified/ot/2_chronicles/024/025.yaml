- pob_phrase: When they departed from him—for they left him with many diseases—
  simplified_phrase: After the Arameans left Joash, leaving him suffering from many illnesses,
  preserved_meaning: The withdrawing Arameans left Joash severely ill with multiple ailments.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: Names replace unclear pronouns, while “many illnesses” preserves the Hebrew plural.
- pob_phrase: because of the blood of the sons of Jehoiada the priest
  simplified_phrase: because of the blood that had been shed—the blood of the sons of Jehoiada the priest
  preserved_meaning: The conspiracy was motivated by bloodshed involving Jehoiada’s sons.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The wording explains the bloodshed while retaining the Hebrew blood image and plural reading.
- pob_phrase: they did not bury him in the tombs of the kings
  simplified_phrase: but not in the royal tombs
  preserved_meaning: Joash was excluded from the burial place of the kings.
  reasoning_layer_used: Lexical decision
  rationale: “Royal tombs” states the same contrast in shorter, more natural English.
