translation:
  language: en
  text: After the Arameans left Joash, leaving him suffering from many illnesses, his servants plotted against him because of the blood that had been shed—the blood of the sons of Jehoiada the priest.[a] They killed Joash in his bed, and he died. He was buried in the city of David, but not in the royal tombs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the sons of Jehoiada the priest.” In context, this may refer specifically to his son Zechariah (24:20–22).
    reason: alternative_reading
