translation:
  language: en
  text: For the sons of Athaliah—the wicked woman—had broken into God’s temple. They had also used all the sacred objects from Yahweh’s temple in worship of the Baals.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can mean “made,” but here it likely means that they used or appropriated the sacred objects for Baal worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Athaliah, that wicked woman, and her sons
  simplified_phrase: the sons of Athaliah—the wicked woman—
  preserved_meaning: Athaliah is condemned as wicked, while her sons are correctly identified as the people who violated the temple.
  reasoning_layer_used: Hebrew syntax and the POB lexical decision for הַמִּרְשַׁעַת
  rationale: The recast wording removes the false impression that Athaliah joined her sons in the action.
- pob_phrase: the house of God / the house of Yahweh
  simplified_phrase: God’s temple / Yahweh’s temple
  preserved_meaning: Both phrases name the temple, and Yahweh’s revealed name remains explicit.
  reasoning_layer_used: POB lexical and theological decisions for בֵּית הָאֱלֹהִים and יְהוָה
  rationale: “Temple” immediately identifies the building while repetition preserves the link between both expressions.
- pob_phrase: all the holy things
  simplified_phrase: all the sacred objects
  preserved_meaning: The sons misused consecrated items belonging to Yahweh’s temple.
  reasoning_layer_used: POB lexical decision for כָּל קָדְשֵׁי
  rationale: “Sacred objects” clearly shows that the phrase refers to consecrated temple items.
interpretive_expansions:
- pob_phrase: made all the holy things ... for the Baals
  rendering: used all the sacred objects ... in worship of the Baals
  claim: Athaliah’s sons appropriated Yahweh’s sacred objects for Baal worship.
  evidence:
  - The POB lexical rationale says עשה plus ל can describe employing objects for another purpose.
  - The immediate context concerns sacred objects redirected to the Baals.
  confidence: moderate
  alternatives_preserved:
  - made the sacred objects for the Baals
  - devoted the sacred objects to the Baals
translation_notes:
  risk_flags:
  - risk: “Used ... in worship” is more specific than the broad Hebrew verb “made.”
    mitigation: The footnote preserves the literal alternative and presents the contextual sense as likely.
  - risk: The em-dash construction could still require careful reading to identify Athaliah as the wicked woman.
    mitigation: Placing the epithet directly after her name keeps its reference clear without making her an actor.
