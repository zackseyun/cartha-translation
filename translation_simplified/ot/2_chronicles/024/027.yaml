translation:
  language: en
  text: Details about his sons, the many oracles against him,[a] and the establishing of the house of God are written in the interpretive record connected with the Book of the Kings.[b] His son Amaziah became king after him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult. It may instead refer to a great burden, many pronouncements, or heavy tribute imposed on him.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term is “Midrash,” probably an interpretive record, exposition, or commentary.
    reason: cultural_note
