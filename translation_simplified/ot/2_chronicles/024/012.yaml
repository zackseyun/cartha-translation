  preserved_meaning: Different kinds of skilled workers were hired to restore Yahweh’s temple.
  reasoning_layer_used: POB lexical decisions for חֹצְבִים, חָרָשִׁים, and לְחַדֵּשׁ.
  rationale: “Other skilled workers” makes the broad craft term clear while keeping stonecutters distinct.
- pob_phrase: craftsmen in iron and bronze to strengthen the house of Yahweh
