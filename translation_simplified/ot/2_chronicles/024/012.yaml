  preserved_meaning: Metalworkers were hired for structural strengthening, not merely general repair.
  reasoning_layer_used: POB lexical decisions for metalworkers, נְחֹשֶׁת, and לְחַזֵּק.
  rationale: The wording keeps both metals and preserves the distinct purpose of strengthening.
