translation:
  language: en
  text: The king and Jehoiada gave the money to those carrying out the work on Yahweh’s house, the temple. They hired stonecutters and other skilled workers to restore the temple, along with workers in iron and bronze to strengthen it.
  philosophy: optimal-equivalence
