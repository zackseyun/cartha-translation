translation:
  language: en
  text: 'When they had finished, they brought the remaining silver to the king and Jehoiada. It was used to make equipment for Yahweh’s temple: items used in temple ministry and for presenting offerings,[a] along with bowls and other articles of gold and silver. Throughout Jehoiada’s lifetime, they continued to offer burnt offerings regularly in Yahweh’s temple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “for offering up” but does not name what was offered.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with it he made articles for the house of Yahweh
  simplified_phrase: It was used to make equipment for Yahweh’s temple
  preserved_meaning: The remaining silver funded implements for Yahweh’s place of worship without identifying a particular craftsman.
  reasoning_layer_used: Lexical decisions for וַיַּעֲשֵׂהוּ, כֵלִים, and לְבֵית יְהוָה
  rationale: The passive wording avoids over-identifying the singular subject while “temple” and “equipment” clarify the setting and objects.
- pob_phrase: articles for ministry and for offering up
  simplified_phrase: items used in temple ministry and for presenting offerings
  preserved_meaning: The equipment supported both temple service and the act of offering.
  reasoning_layer_used: Lexical decisions for כְּלֵי שָׁרֵת and וְהַעֲלוֹת
  rationale: The wording explains the cultic uses while the footnote preserves the Hebrew clause’s unstated object.
- pob_phrase: they were offering burnt offerings ... continually all the days of Jehoiada
  simplified_phrase: Throughout Jehoiada’s lifetime, they continued to offer burnt offerings regularly
  preserved_meaning: Burnt offerings remained an ongoing customary practice while Jehoiada lived.
  reasoning_layer_used: Theological decision on durative aspect and lexical decisions for תָּמִיד and כֹּל יְמֵי יְהוֹיָדָע
  rationale: Natural time language and “continued ... regularly” preserve the sustained practice.
