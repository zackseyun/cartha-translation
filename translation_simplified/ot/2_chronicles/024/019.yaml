translation:
  language: en
  text: Yet he sent prophets among the people to bring them back to Yahweh. The prophets gave solemn testimony against them,[a] but the people refused to listen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “solemnly warned them.” The Hebrew expression can include both warning and testimony against someone.
    reason: lexical_alternative
