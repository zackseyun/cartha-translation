translation:
  language: en
  text: The men who plotted together against him were Zabad and Jehozabad. Zabad was the son of Shimeath, an Ammonite woman, and Jehozabad was the son of Shimrith, a Moabite woman.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And these were the men who conspired against him
  simplified_phrase: The men who plotted together against him were Zabad and Jehozabad
  preserved_meaning: Zabad and Jehozabad joined in a plot against him.
  reasoning_layer_used: POB lexical decision for הַמִּתְקַשְּׁרִים and עָלָיו
  rationale: “Plotted together” explains the less familiar word “conspired” while preserving the coordinated action against him.
- pob_phrase: Zabad son of Shimeath ... and Jehozabad son of Shimrith
  simplified_phrase: Zabad was the son of Shimeath ... and Jehozabad was the son of Shimrith
  preserved_meaning: The verse identifies each conspirator through his mother.
  reasoning_layer_used: POB lexical decisions for בֶּן and the personal names
  rationale: A second sentence with full verbs makes the family identifications easier to follow.
translation_notes:
  risk_flags:
  - risk: “Plotted” alone could fail to express a conspiracy involving joint action.
    mitigation: The added word “together” preserves the source verb’s sense of forming a conspiracy.
