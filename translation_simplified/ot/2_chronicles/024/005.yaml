translation:
  language: en
  text: He called the priests and Levites together and told them, “Go to the cities of Judah. Each year, collect silver[a] from all Israel to repair the house of your God.[b] Do this quickly.” But the Levites did not act quickly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Silver was used as money.
    reason: cultural_note
  - marker: b
    text: The house of your God is the temple.
    reason: simplification_note
simplification_decisions:
- pob_phrase: So he gathered the priests and the Levites and said to them
  simplified_phrase: He called the priests and Levites together and told them
  preserved_meaning: He assembled both temple-service groups and addressed them.
  reasoning_layer_used: POB lexical decisions for וַיִּקְבֹּץ and the two named groups
  rationale: The rewrite uses ordinary speech while keeping the priests and Levites distinct.
- pob_phrase: collect silver from all Israel to repair the house of your God year by year
  simplified_phrase: Each year, collect silver from all Israel to repair the house of your God
  preserved_meaning: The collection was to recur annually and fund repairs to God's house.
  reasoning_layer_used: POB lexical and theological decisions on silver, repair, God's house, annual recurrence, and all Israel
  rationale: Moving “each year” forward makes the schedule clear without narrowing “all Israel.”
- pob_phrase: and you must act quickly in this matter
  simplified_phrase: Do this quickly
  preserved_meaning: The command carries urgency and refers to the assigned collection and repair work.
  reasoning_layer_used: POB lexical decision on וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  rationale: The shorter command preserves the urgency and has a clear antecedent.
translation_notes:
