translation:
  language: en
  text: Then the king summoned Jehoiada, the chief, and asked him, “Why haven’t you ordered the Levites to collect from Judah and Jerusalem the tax that Moses, the servant of the LORD, required from the assembly of Israel for the Tent of the Testimony?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: called Jehoiada the chief and said to him
  simplified_phrase: summoned Jehoiada, the chief, and asked him
  preserved_meaning: The king called Jehoiada to account with a direct question.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The natural wording preserves both Jehoiada’s title and the king’s direct question.
- pob_phrase: required the Levites to bring from Judah and from Jerusalem the tax
  simplified_phrase: ordered the Levites to collect from Judah and Jerusalem the tax
  preserved_meaning: Jehoiada was expected to direct the Levites to gather the tax in both places.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Collect” makes the Levites’ tax-gathering duty clear without changing the POB choice “tax.”
- pob_phrase: for the tent of the testimony
  simplified_phrase: for the Tent of the Testimony
  preserved_meaning: The tax was intended for Israel’s sacred tent identified by this biblical title.
  reasoning_layer_used: POB translation and source image
  rationale: Retaining the title preserves the sacred-tent image while capitalization identifies it as a name.
interpretive_expansions:
- pob_phrase: the tax of Moses the servant of the LORD and of the assembly of Israel
  rendering: the tax that Moses, the servant of the LORD, required from the assembly of Israel
  claim: Moses imposed the tax, and Israel’s assembly was obligated to provide it.
  evidence:
  - The immediate continuation in 2 Chronicles 24:9 describes this as the levy Moses imposed on Israel in the wilderness.
  - The king’s question presents the tax as an obligation the Levites should collect.
  confidence: high
  alternatives_preserved:
  - the tax of Moses and of the assembly of Israel
translation_notes:
  risk_flags:
  - risk: The compact POB possessive is resolved by identifying Moses as the one who imposed the tax and Israel’s assembly as those who owed it.
    mitigation: The immediate context in 2 Chronicles 24:9 directly supports this relationship.
