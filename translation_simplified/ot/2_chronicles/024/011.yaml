translation:
  language: en
  text: Whenever the Levites brought the collection chest to be handled under the king’s supervision, and it contained a large amount of money, the king’s scribe and the chief priest’s officer came and emptied it. Then they carried the chest back to its place. They did this day after day and collected a great deal of money.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the chest was brought by the Levites to the king’s oversight
  simplified_phrase: the Levites brought the collection chest to be handled under the king’s supervision
  preserved_meaning: The Levites transported the offering container under royal oversight.
  reasoning_layer_used: POB lexical decisions for הָאָרוֹן, פְּקֻדַּת הַמֶּלֶךְ, and בְּיַד הַלְוִיִּם
  rationale: The active wording makes the action and administrative setting easier to follow.
- pob_phrase: when they saw that the money was abundant
  simplified_phrase: it contained a large amount of money
  preserved_meaning: The chest was emptied when much money had accumulated.
  reasoning_layer_used: POB lexical decision for רַב הַכֶּסֶף and immediate context
  rationale: This removes an unclear pronoun without changing the condition for emptying the chest.
- pob_phrase: Thus they did day by day, and they gathered money in abundance
  simplified_phrase: They did this day after day and collected a great deal of money
  preserved_meaning: The process was repeated regularly and produced a large collection.
  reasoning_layer_used: POB lexical decisions for לְיוֹם בְּיוֹם and וַיַּאַסְפוּ כֶסֶף לָרֹב
  rationale: Common phrasing preserves both repeated action and the large result.
interpretive_expansions:
