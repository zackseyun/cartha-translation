translation:
  language: en
  text: 'Then the Spirit of God clothed Zechariah, the son of Jehoiada the priest, with power.[a] Zechariah stood above the people and said, “This is what God says: ‘Why are you breaking Yahweh’s commandments? Because of this, you will not prosper. You have abandoned Yahweh, so he has also abandoned you.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “clothed Zechariah”; the expression means that the Spirit came upon and empowered him.
    reason: simplification_note
