translation:
  language: en
  text: Jehoiada arranged two marriages for Joash.[a] Joash fathered sons and daughters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Less likely, the Hebrew may mean that Jehoiada himself married two wives and fathered sons and daughters.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: took for him two wives
  simplified_phrase: arranged two marriages for Joash
  preserved_meaning: Jehoiada secured two wives for Joash rather than marrying them himself.
  reasoning_layer_used: lexical decisions and broader narrative context
  rationale: This replaces an opaque Hebrew marriage idiom with natural English.
- pob_phrase: he fathered sons and daughters
  simplified_phrase: Joash fathered sons and daughters
  preserved_meaning: Joash became the father of both male and female children.
  reasoning_layer_used: theological decision on the verb's understood subject
  rationale: Naming Joash prevents readers from mistaking Jehoiada for the father.
interpretive_expansions:
- pob_phrase: for him ... he fathered
  rendering: for Joash ... Joash fathered
  claim: Both the beneficiary of the marriages and the father of the children are Joash.
  evidence:
  - The broader narrative centers on Joash.
  - The Hebrew pronoun meaning “for him” indicates that Jehoiada acted for another man.
  - The POB theological decision identifies Joash as the understood referent.
  confidence: high
  alternatives_preserved:
  - Jehoiada may instead be the subject throughout the verse, as noted in the footnote.
translation_notes:
  risk_flags:
  - risk: Making Joash explicit reduces the grammatical ambiguity of the Hebrew.
    mitigation: The less likely Jehoiada reading is preserved in a footnote.
