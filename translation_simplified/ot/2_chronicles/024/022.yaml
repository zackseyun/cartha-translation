translation:
  language: en
  text: Yet King Joash did not remember the kindness Jehoiada had shown him, though Jehoiada had been like a father to him. Joash killed Jehoiada’s son. As the son was dying, he said, “May Yahweh see this and call Joash to account.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jehoiada his father
  simplified_phrase: Jehoiada ... had been like a father to him
  preserved_meaning: Jehoiada served as Joash’s fatherly protector rather than being his biological father.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The comparison makes the honorific family language immediately understandable.
- pob_phrase: and he killed his son
  simplified_phrase: Joash killed Jehoiada’s son
  preserved_meaning: Joash caused the death of Jehoiada’s son.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: Repeating the names removes unclear pronoun references.
- pob_phrase: May Yahweh see and require it
  simplified_phrase: May Yahweh see this and call Joash to account
  preserved_meaning: The dying son appeals for Yahweh to observe the injustice and judicially reckon with Joash.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Call to account” clearly expresses divine reckoning without limiting the appeal to vengeance.
interpretive_expansions:
- pob_phrase: his father
  rendering: had been like a father to him
  claim: Jehoiada’s fatherhood describes his fatherly role toward Joash, not biological paternity.
  evidence:
  - The POB cultural note identifies Jehoiada’s fatherly role as the likely sense.
  - The POB lexical rationale describes him as Joash’s protector and benefactor.
  confidence: high
  alternatives_preserved:
  - his father
  - his fatherly protector
- pob_phrase: require it
  rendering: call Joash to account
  claim: The appeal asks Yahweh to hold Joash accountable for the killing.
  evidence:
  - The POB lexical decision says the verb can express judicial accountability.
  - The immediate context identifies Joash as the killer.
  confidence: high
  alternatives_preserved:
  - seek out the wrongdoing
  - avenge the killing
