translation:
  language: en
  text: Throughout Judah and Jerusalem, they announced that the people must bring to Yahweh the required contribution Moses, the servant of God, had required from Israel in the wilderness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “the levy” or “the tax”; it refers to a contribution the people were required to give.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they made a proclamation in Judah and Jerusalem
  simplified_phrase: Throughout Judah and Jerusalem, they announced
  preserved_meaning: An official public announcement was made in both places.
  reasoning_layer_used: POB lexical decision for וַיִּתְּנוּ קוֹל
  rationale: “Announced” expresses the public call in familiar English.
- pob_phrase: the levy
  simplified_phrase: the required contribution
  preserved_meaning: The contribution was an assessed obligation, not merely a voluntary gift.
  reasoning_layer_used: POB lexical decision for מַשְׂאַת
  rationale: This explains the uncommon term “levy” without suggesting a modern tax system.
- pob_phrase: the levy of Moses the servant of God for Israel in the wilderness
  simplified_phrase: the required contribution Moses, the servant of God, had required from Israel in the wilderness
  preserved_meaning: The obligation was connected with Moses, imposed on Israel, and dated to the wilderness period.
  reasoning_layer_used: POB lexical decisions for מֹשֶׁה עֶבֶד הָאֱלֹהִים and עַל יִשְׂרָאֵל
  rationale: The recast clause preserves Moses’ title and clearly conveys the assessed obligation upon Israel.
interpretive_expansions:
- pob_phrase: the levy of Moses ... on Israel
  rendering: the required contribution Moses ... had required from Israel
  claim: Moses’ command required Israel to provide this contribution.
  evidence:
