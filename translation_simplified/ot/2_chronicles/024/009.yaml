  - The lexical audit explains עַל יִשְׂרָאֵל as an obligation imposed upon Israel.
  confidence: high
  alternatives_preserved:
  - the levy of Moses laid on Israel
  - the contribution associated with Moses
translation_notes:
  risk_flags:
  - risk: The finite wording “had required” makes the compact relationship between Moses and the contribution explicit.
    mitigation: The wording follows the POB rationale while preserving the contribution’s imposed character.
