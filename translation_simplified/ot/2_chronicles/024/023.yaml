  text: At the turn of the year,[a] the army of Aram[b] marched against him. They entered Judah and Jerusalem, killed all the leaders of the people from among the people, and sent all the plunder they had taken to the king of Damascus.
  philosophy: optimal-equivalence
  footnotes:
