  preserved_meaning: The idol was placed in God’s house, the place addressed by the following declaration.
  reasoning_layer_used: POB lexical decisions and sentence syntax
  rationale: Two sentences remove the difficult relative clause without changing its connection.
- pob_phrase: which I have chosen out of all the tribes of Israel
