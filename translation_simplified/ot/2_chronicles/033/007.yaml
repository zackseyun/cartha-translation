translation:
  language: en
  text: He put the carved image—the idol he had made—inside God’s house.[a] God had said to David and his son Solomon, “In this house and in Jerusalem, which I have chosen from all the tribes of Israel, I will put my name forever.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses two closely related terms for the idol statue; it may also be translated “the carved image of the idol.”
    reason: lexical_alternative
