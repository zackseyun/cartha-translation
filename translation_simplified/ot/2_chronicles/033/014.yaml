  text: After this, he built a very high outer wall for the City of David. It ran west of Gihon in the valley, continued as far as the entrance to the Fish Gate, and went around Ophel.[a] He also stationed military commanders in every fortified city in Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ophel was a raised area in Jerusalem. The Hebrew may emphasize that the wall encircled it.
    reason: cultural_note
