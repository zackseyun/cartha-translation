translation:
  language: en
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom.[a] He practiced omen-reading, divination, and sorcery. He also dealt with mediums and spiritists—people associated with consulting the dead or spirits. He kept doing more and more of what was evil in Yahweh’s sight, provoking him to anger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression refers to sacrificing his sons in the fire.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: practiced soothsaying and divination and sorcery
  simplified_phrase: practiced omen-reading, divination, and sorcery
  preserved_meaning: The three distinct occult practices remain separate.
  reasoning_layer_used: POB lexical decisions for עונן, נחשׁ, and כשף
  rationale: “Omen-reading” explains “soothsaying” without merging it with divination.
- pob_phrase: dealt with mediums and spiritists
  simplified_phrase: dealt with mediums and spiritists—people associated with consulting the dead or spirits
  preserved_meaning: Both practitioner labels remain distinct while their shared context is explained.
  reasoning_layer_used: POB lexical rationale and cultural footnote
  rationale: The collective explanation avoids assigning either label exclusively to the dead or to spirits.
- pob_phrase: He multiplied doing what was evil
  simplified_phrase: He kept doing more and more of what was evil
  preserved_meaning: His evil was repeated and abundant rather than a single act.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: The natural wording preserves the deliberate excess emphasized by the Hebrew construction.
interpretive_expansions:
- pob_phrase: made his sons pass through the fire
  rendering: This Hebrew expression refers to sacrificing his sons in the fire.
  claim: The fire-passage idiom describes a child-sacrifice rite.
  evidence:
  - The POB lexical decision identifies this as an established child-sacrifice idiom.
  - The POB theological decision keeps the explicit interpretation outside the main text.
  confidence: high
  alternatives_preserved:
  - The main text retains the literal fire-passage image.
- pob_phrase: mediums and spiritists
  rendering: people associated with consulting the dead or spirits
  claim: Both kinds of practitioners were associated with attempts to consult the dead or spirits.
  evidence:
  - The POB cultural note connects both terms collectively with consulting the dead or spirits.
  - The POB lexical rationale places both terms in a necromantic context.
  confidence: high
  alternatives_preserved:
  - Both practitioner labels remain in the main text.
  - “Dealt with” leaves his precise involvement open.
translation_notes:
  risk_flags:
  - risk: Readers may not recognize that passing through the fire implies child sacrifice.
    mitigation: The main text preserves the Hebrew image, and footnote a explains its ritual meaning.
  - risk: The collective explanation could be mistaken for a precise definition of each practitioner label.
    mitigation: Both labels are retained, and the explanation applies to them collectively.
