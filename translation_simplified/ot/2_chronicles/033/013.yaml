translation:
  language: en
  text: Manasseh prayed to God. God was moved by his plea and heard his request for mercy. He brought Manasseh back to Jerusalem and restored him as king. Then Manasseh knew that Yahweh is God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: He prayed to him, and he was moved by his entreaty
  simplified_phrase: Manasseh prayed to God. God was moved by his plea
  preserved_meaning: Manasseh addressed God in prayer, and God responded favorably to his earnest plea.
  reasoning_layer_used: Lexical decisions and immediate narrative context
  rationale: Naming both participants removes unclear pronouns while preserving God's personal response.
- pob_phrase: heard his supplication
  simplified_phrase: heard his request for mercy
  preserved_meaning: God favorably heard Manasseh's earnest plea for mercy or favor.
  reasoning_layer_used: Lexical decision for תְּחִנָּתוֹ and grounding review
  rationale: This keeps the affirmative force of “heard” and explains the purpose of the supplication without implying an audible cry.
- pob_phrase: brought him back to Jerusalem to his kingdom
  simplified_phrase: brought Manasseh back to Jerusalem and restored him as king
  preserved_meaning: God returned Manasseh to Jerusalem and restored his royal rule.
  reasoning_layer_used: Lexical decision for לְמַלְכוּתוֹ and its rationale
  rationale: The wording clearly expresses restoration to kingship rather than the opaque phrase “to his kingdom.”
interpretive_expansions:
- pob_phrase: He prayed to him ... he was moved
  rendering: Manasseh prayed to God. God was moved
  claim: Manasseh prayed, and God received and responded to his prayer.
  evidence:
  - The POB lexical rationale identifies God as the subject of the response.
  - The narrative context identifies Manasseh as the one who prayed.
  confidence: high
- pob_phrase: to his kingdom
  rendering: restored him as king
  claim: Manasseh's return included restoration to royal rule.
  evidence:
  - The POB lexical rationale identifies the phrase as restoration to his royal reign.
  confidence: high
  alternatives_preserved:
  - restored him to his kingship
translation_notes:
  risk_flags:
  - risk: “Was moved” could be understood as describing emotion alone.
    mitigation: The following acts of hearing and restoration show that God responded favorably.
