translation:
  language: en
  text: For he rebuilt the high places—elevated sites used for worship—that his father Hezekiah had torn down. He set up altars for the Baals[a] and made Asherah poles.[b] He bowed down before all the stars and other heavenly bodies and served them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Baals” refers to the various local forms or images of Baal.
    reason: cultural_note
  - marker: b
    text: Asherah poles were sacred objects associated with the goddess Asherah; the Hebrew may also be translated “Asherahs.”
    reason: lexical_alternative
