translation:
  language: en
  text: So Yahweh sent the Assyrian king’s army commanders against them. They captured Manasseh with hooks,[a] put him in bronze chains, and took him to Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with a hook.” The Hebrew word can mean hooks or thorns and may refer more generally to a restraint used on a captive.
    reason: lexical_alternative
