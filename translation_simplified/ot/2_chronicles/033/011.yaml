  preserved_meaning: Yahweh directly caused Assyria’s commanders to attack them.
  reasoning_layer_used: Lexical and theological decisions on divine agency
  rationale: “Sent” states the causative action clearly without reducing it to mere permission.
- pob_phrase: bound him with bronze chains
  simplified_phrase: put him in bronze chains
  preserved_meaning: The captors restrained Manasseh with bronze restraints.
  reasoning_layer_used: Lexical decision for וַיַּאַסְרֻהוּ and בַּנְחֻשְׁתַּיִם
  rationale: The new wording is more natural while retaining both the restraint and its bronze material.
