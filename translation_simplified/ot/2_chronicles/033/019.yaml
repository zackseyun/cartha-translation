translation:
  language: en
  text: His prayer and the answer he received, all his sins and unfaithfulness, and the places where he built worship shrines and set up Asherah objects[a] and carved images before he humbled himself—all this is written in the records of the seers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Asherah poles.” The Hebrew term refers to objects associated with the worship of Asherah, but their exact form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “in the words of Hozai.” The Hebrew may refer to a person named Hozai rather than to seers.
    reason: alternative_reading
