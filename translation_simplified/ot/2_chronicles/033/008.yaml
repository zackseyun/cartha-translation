translation:
  language: en
  text: I will no longer remove Israel[a] from the land I appointed for your ancestors, but only if they carefully obey everything I commanded them—the whole law, the statutes, and the legal decisions I gave through Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “remove the foot of Israel,” an image of removing Israel’s presence from the land.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: remove the foot of Israel from upon the land
  simplified_phrase: remove Israel from the land
  preserved_meaning: God speaks of ending Israel’s presence in the land.
  reasoning_layer_used: Lexical decision for רֶגֶל יִשְׂרָאֵל, with the source image retained in a footnote.
  rationale: The main text explains the idiom while the footnote preserves its concrete image.
- pob_phrase: the land that I appointed for your fathers
  simplified_phrase: the land I appointed for your ancestors
  preserved_meaning: God designated the land for Israel’s forefathers.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר הֶעֱמַדְתִּי and לַאֲבֹתֵיכֶם.
  rationale: “Ancestors” communicates the familial and historical reference more clearly.
- pob_phrase: if only they are careful to do all that I commanded them, according to all the law and the statutes and the judgments given through Moses
  simplified_phrase: but only if they carefully obey everything I commanded them—the whole law, the statutes, and the legal decisions I gave through Moses
  preserved_meaning: Israel must carefully obey every category of divine instruction mediated through Moses as a real condition for remaining in the land.
  reasoning_layer_used: Lexical legal-list decisions and the theological decision on conditional permanence.
  rationale: The appositional list clarifies the content of obedience, and “legal decisions” makes “judgments” understandable.
translation_notes:
  risk_flags:
  - risk: Replacing “the foot of Israel” could hide the source image.
    mitigation: The anchored footnote preserves and explains the image.
  - risk: “Legal decisions” is less formally close than “judgments.”
    mitigation: It retains the juridical sense and remains distinct from law and statutes.
