translation:
  language: en
  text: The rest of Jehoiakim’s acts, the detestable things he did, and what was discovered against him[a] are recorded in the Book of the Kings of Israel and Judah. His son Jehoiachin became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what was discovered concerning him.” The Hebrew may refer generally to matters found out about Jehoiakim, though the context favors a negative sense.
    reason: lexical_alternative
