translation:
  language: en
  text: The king of Egypt removed him as king in Jerusalem. He also required the land to pay a penalty of one hundred talents of silver and one talent of gold.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the king took him away.
    reason: alternative_reading
  - marker: b
    text: A talent was a large ancient unit of weight.
    reason: cultural_note
