translation:
  language: en
  text: All the leaders of the priests and the people also committed more and more acts of unfaithfulness toward God. They followed all the detestable practices of the nations and defiled Yahweh’s temple,[a] which he had set apart as holy in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the personal name represented by YHWH in the Hebrew text.
    reason: source_note
simplification_decisions:
- pob_phrase: increased in unfaithfulness
  simplified_phrase: committed more and more acts of unfaithfulness
  preserved_meaning: Their repeated actions greatly increased their covenant disloyalty.
  reasoning_layer_used: Lexical and theological decisions on מָעַל
  rationale: This natural wording preserves both the intensifying expression and the idea of unfaithful action.
- pob_phrase: according to all the abominations of the nations
  simplified_phrase: followed all the detestable practices of the nations
  preserved_meaning: Their conduct conformed to the nations’ morally and religiously abhorrent practices.
  reasoning_layer_used: Lexical decision on כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  rationale: “Detestable practices” makes the concrete conduct clear while retaining its strong moral weight.
- pob_phrase: the house of Yahweh, which he had consecrated
  simplified_phrase: Yahweh’s temple, which he had set apart as holy
  preserved_meaning: They defiled the Jerusalem sanctuary that Yahweh had dedicated as holy.
  reasoning_layer_used: Lexical decisions on בֵּית יְהוָה and הִקְדִּישׁ
  rationale: The wording explains both “house” and “consecrated” in common English.
interpretive_expansions:
- pob_phrase: unfaithfulness
  rendering: unfaithfulness toward God
  claim: The violated loyalty was directed toward God.
  evidence:
