translation:
  language: en
  text: 'This is what Cyrus king of Persia says: “Yahweh, the God of heaven, has given me all the kingdoms of the earth. He has commanded me to build a house for him[b] in Jerusalem, in Judah. Anyone among you who belongs to his people—may Yahweh his God be with him, and let him go up to Jerusalem.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “Yahweh his God is with him,” though a blessing fits the context better.
    reason: alternative_reading
  - marker: b
    text: Here “house” refers to the temple, while preserving the Hebrew image of God’s house.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Thus says Cyrus king of Persia
  simplified_phrase: This is what Cyrus king of Persia says
  preserved_meaning: Introduces Cyrus’s royal proclamation.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר
  rationale: The common English formula keeps the proclamation’s formal force.
- pob_phrase: he has charged me
  simplified_phrase: He has commanded me
  preserved_meaning: Yahweh authoritatively assigned Cyrus the building task.
  reasoning_layer_used: Lexical alternatives for פָקַד
  rationale: “Commanded” states the authoritative assignment more plainly.
- pob_phrase: Whoever is among you of all his people
  simplified_phrase: Anyone among you who belongs to his people
  preserved_meaning: Every member of Yahweh’s people present may respond.
  reasoning_layer_used: POB footnote and lexical rationale for מִי בָכֶם מִכָּל עַמּוֹ
  rationale: The rewrite makes the compressed membership phrase natural in English.
interpretive_expansions:
- pob_phrase: let him go up
  rendering: let him go up to Jerusalem
  claim: The destination of the ascent is Jerusalem.
  evidence:
  - The immediate context names Jerusalem as the place where the house will be built.
  - The POB cultural note identifies Jerusalem as the implied destination.
  confidence: high
  alternatives_preserved:
  - let him go up
translation_notes:
  risk_flags:
