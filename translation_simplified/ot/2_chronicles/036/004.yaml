  preserved_meaning: The Egyptian king installed Eliakim, Jehoahaz’s brother, as ruler.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: “Appointed as king” clearly expresses the causative force, while naming Jehoahaz resolves the pronoun.
- pob_phrase: changed his name to Jehoiakim
