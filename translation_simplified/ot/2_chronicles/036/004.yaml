  text: King Neco of Egypt[a] appointed Jehoahaz’s brother Eliakim as king over Judah and Jerusalem. He renamed Eliakim Jehoiakim. Then Neco took Jehoahaz away and brought him to Egypt.
  philosophy: optimal-equivalence
