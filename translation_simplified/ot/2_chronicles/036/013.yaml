simplification_decisions:
- pob_phrase: who had made him swear by God
  simplified_phrase: even though the king had made him swear an oath by God
  preserved_meaning: Nebuchadnezzar administered a solemn oath invoking God, which made the rebellion especially serious.
  reasoning_layer_used: Lexical decision for אֲשֶׁר הִשְׁבִּיעוֹ בֵאלֹהִים and its documented alternative.
  rationale: Naming the oath and repeating “the king” makes the relationship and contrast immediately clear.
- pob_phrase: he stiffened his neck and hardened his heart
  simplified_phrase: 'He remained stubborn: he stiffened his neck and hardened his heart'
  preserved_meaning: His refusal was deliberate and deeply obstinate, expressed through both biblical images.
  reasoning_layer_used: Lexical decisions for וַיֶּקֶשׁ אֶת עָרְפּוֹ and וַיְאַמֵּץ אֶת לְבָבוֹ.
  rationale: A brief explanation clarifies the images without removing either one.
- pob_phrase: from turning to Yahweh
  simplified_phrase: refusing to turn to Yahweh
  preserved_meaning: His hardened resolve prevented repentance and return to Yahweh.
  reasoning_layer_used: Lexical decision for מִשּׁוּב and the revision record preserving resistance to turning.
  rationale: “Refusing” states the intended resistance in natural English.
interpretive_expansions:
- pob_phrase: from turning to Yahweh
  rendering: refusing to turn to Yahweh
  claim: The phrase describes a deliberate refusal to repent and return to Yahweh.
  evidence:
  - The lexical rationale says the construction expresses prevention or separation in a context of refusing to repent.
  - The preceding neck and heart images describe obstinate resistance.
  confidence: high
  alternatives_preserved:
  - from turning to Yahweh
  - against turning to Yahweh
