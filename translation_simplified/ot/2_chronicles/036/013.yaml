translation:
  language: en
  text: 'He also rebelled against King Nebuchadnezzar, even though the king had made him swear an oath by God.[a] He remained stubborn: he stiffened his neck and hardened his heart, refusing to turn to Yahweh, the God of Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “had bound him by an oath before God.”
