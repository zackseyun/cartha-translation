translation:
  language: en
  text: When the year came around, King Nebuchadnezzar sent for Jehoiachin and had him taken to Babylon. He also had the precious objects from Yahweh’s temple taken there. Then he made Jehoiachin’s relative Zedekiah king over Judah and Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls Zedekiah Jehoiachin’s “brother,” using a broad family term; Zedekiah was his uncle.
    reason: cultural_note
