translation:
  language: en
  text: He took to Babylon all the objects from God’s temple, large and small. He also took the treasures from Yahweh’s temple and the treasures belonging to the king and his officials. He took everything.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the vessels of the house of God
  simplified_phrase: all the objects from God’s temple
  preserved_meaning: The full range of temple items was taken.
  reasoning_layer_used: POB lexical decisions for כְּלֵי and בֵּית הָאֱלֹהִים
  rationale: “Objects” is broader and clearer than “vessels,” while “temple” explains the biblical house idiom.
- pob_phrase: great and small
  simplified_phrase: large and small
  preserved_meaning: Items of every size or importance are included.
  reasoning_layer_used: POB lexical decision for הַגְּדֹלִים וְהַקְּטַנִּים
  rationale: “Large and small” makes the inventory sense immediately clear.
- pob_phrase: all this he brought to Babylon
  simplified_phrase: He took everything.
  preserved_meaning: The implied subject removed the entire listed collection to Babylon.
  reasoning_layer_used: POB lexical decisions for הַכֹּל and הֵבִיא
  rationale: Short clauses identify the action early and preserve the final emphasis on total removal.
