translation:
  language: en
  text: Jehoiachin became king when he was eight years old.[a] He ruled in Jerusalem for three months and ten days. He did what was evil in Yahweh’s sight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 Kings 24:8 says that he was eighteen years old, not eight.
    reason: textual_variant
