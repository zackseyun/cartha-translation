  simplified_phrase: became king when he was eight years old
  preserved_meaning: Jehoiachin was eight at his accession.
  reasoning_layer_used: Lexical decision for בְּמָלְכוֹ and theological decision on the age variant
  rationale: “Became king” states the regnal formula in familiar English while retaining the source text’s age.
- pob_phrase: he reigned three months and ten days in Jerusalem
  simplified_phrase: He ruled in Jerusalem for three months and ten days.
  preserved_meaning: His reign in Jerusalem lasted three months and ten days.
  reasoning_layer_used: Lexical decisions for מָלַךְ, the duration, and בִּירוּשָׁלָם
  rationale: “Ruled” and “for” make the duration immediately clear.
- pob_phrase: He did what was evil in the sight of Yahweh
  simplified_phrase: He did what was evil in Yahweh’s sight.
  preserved_meaning: Yahweh judged Jehoiachin’s conduct to be evil.
