  text: So God brought the king of the Chaldeans[a] against them. The king killed their young men with the sword inside their temple. He showed no compassion to young men or young unmarried women[b], to the old or the very old. God handed them all over to the king’s power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the king of the Babylonians; the Hebrew says “Chaldeans.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew specifically says “virgins,” meaning young unmarried women.
    reason: lexical_alternative
