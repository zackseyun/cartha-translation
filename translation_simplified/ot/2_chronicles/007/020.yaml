translation:
  language: en
  text: Then I will uproot them from my land, which I gave them. I will cast this house[a], which I set apart as holy for my name, out of my sight. I will make it a saying people repeat in mockery and an object of scorn among all peoples.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “house” means the temple.
    reason: simplification_note
  - marker: b
    text: The Hebrew can also be rendered “a proverb and a byword” or “a taunt and a byword.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this house that I have consecrated for my name
  simplified_phrase: this house, which I set apart as holy for my name
  preserved_meaning: God designated the temple as holy in connection with his name.
  reasoning_layer_used: Lexical and theological decisions on temple terminology and consecration.
  rationale: This explains “consecrated” while retaining “house” and the key phrase “for my name.”
- pob_phrase: a proverb and a byword
  simplified_phrase: a saying people repeat in mockery and an object of scorn
  preserved_meaning: The rejected house will become publicly known through derisive sayings and disgrace.
  reasoning_layer_used: Lexical decisions for מָשָׁל and שְׁנִינָה.
  rationale: This replaces opaque terms without assigning the sayings an unsupported warning function.
- pob_phrase: then I will uproot them from my land that I have given them
  simplified_phrase: Then I will uproot them from my land, which I gave them.
  preserved_meaning: God will forcibly remove the people from the land he granted them.
  reasoning_layer_used: Lexical decisions for נתשׁ, אדמה, and the relative clause.
  rationale: The shorter sentence keeps the uprooting image, divine ownership, and prior gift.
interpretive_expansions:
- pob_phrase: a proverb and a byword
  rendering: a saying people repeat in mockery and an object of scorn
  claim: The house will become the subject of repeated derisive speech and public disgrace.
  evidence:
  - The lexical audit allows “taunt” for both terms and identifies שְׁנִינָה as a derisive saying or object of mockery.
  - The immediate context presents other peoples observing and discussing the house’s ruin.
  confidence: high
  alternatives_preserved:
  - a proverb and a byword
  - a taunt and a byword
translation_notes:
  risk_flags:
  - risk: The phrase “repeat in mockery” states the derisive force more directly than “proverb.”
    mitigation: The paired Hebrew term supplies the scornful sense, and footnote b preserves the more literal alternatives.
  - risk: Readers may not recognize “this house” as the temple.
    mitigation: Footnote a identifies the referent while preserving the POB’s chosen theological wording.
