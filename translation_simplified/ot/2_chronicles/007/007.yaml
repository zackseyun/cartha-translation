translation:
  language: en
  text: Then Solomon set apart as holy the central part of the courtyard in front of Yahweh’s temple. He offered the burnt offerings there, along with the fat portions of the peace offerings, because the bronze altar he had made was too small to hold everything being offered—the burnt offering, the grain offering, and the fat portions.
