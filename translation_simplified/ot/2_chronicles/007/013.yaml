translation:
  language: en
  text: When I close the heavens so that no rain falls, or command locusts to devour the land, or send an epidemic among my people,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may also be translated, “If I close the heavens.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shut up the heavens so that there is no rain
  simplified_phrase: close the heavens so that no rain falls
  preserved_meaning: God withholds rain while the concrete image of closing the heavens remains.
  reasoning_layer_used: lexical decisions for אֶעֱצֹר and וְלֹא יִהְיֶה מָטָר
  rationale: “Close” and “rain falls” make the biblical image immediately understandable.
- pob_phrase: command the locust
  simplified_phrase: command locusts
  preserved_meaning: God orders a destructive locust swarm to consume the land.
  reasoning_layer_used: lexical decision for אֲצַוֶּה עַל חָגָב
  rationale: The plural clearly expresses the Hebrew singular collective in natural English.
- pob_phrase: send pestilence among my people
  simplified_phrase: send an epidemic among my people
  preserved_meaning: God sends widespread disease as covenant judgment within his people.
  reasoning_layer_used: lexical decisions for דֶּבֶר and בְּעַמִּי
  rationale: “Epidemic” replaces the unfamiliar word “pestilence” without weakening divine agency.
translation_notes:
  risk_flags:
  - risk: “When” may sound more certain than the Hebrew conditional opening.
    mitigation: The footnote preserves the possible rendering “If.”
  - risk: “Epidemic” is more modern in tone than “pestilence.”
    mitigation: It retains the specific sense of widespread disease and the verse’s gravity.
