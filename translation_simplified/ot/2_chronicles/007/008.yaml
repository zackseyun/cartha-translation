translation:
  language: en
  text: At that time, Solomon celebrated the festival for seven days with all Israel. It was a very large gathering, with people from Lebo-hamath[a] to the Brook of Egypt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the entrance of Hamath.” The Hebrew may refer either to a place named Lebo-hamath or to this boundary area.
    reason: alternative_reading
  - marker: b
    text: Or “the Wadi of Egypt,” a streambed that may hold water only in certain seasons.
    reason: lexical_alternative
