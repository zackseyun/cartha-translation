translation:
  language: en
  text: They will say, “This happened because they abandoned Yahweh, the God of their ancestors, who brought them out of Egypt. They embraced other gods,[a] bowed down to them, and served them. That is why he has brought all this disaster on them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “took hold of other gods,” expressing deliberate attachment to them.
    reason: lexical_alternative
