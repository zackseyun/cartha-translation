    mitigation: “They were to give thanks” states the worship purpose without making the instruments themselves the explicit means.
  - risk: The compressed Hebrew may refer to a Davidic composition rather than agency alone.
    mitigation: The main text follows the POB’s likely agency sense while the audit preserves the composition alternative.
