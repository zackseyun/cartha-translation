translation:
  language: en
  text: 'The priests stood at their assigned posts, and the Levites stood with the instruments King David had made for Yahweh’s song.[a] They were to give thanks to Yahweh: “For his steadfast love endures forever.” David offered this praise through the Levites. Across from the Levites, the priests blew trumpets, while all Israel stood.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean instruments dedicated to Yahweh or instruments used for Yahweh’s song.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were standing at their posts
  simplified_phrase: stood at their assigned posts
  preserved_meaning: The priests occupied their ordered places of service.
  reasoning_layer_used: Lexical decision for מִשְׁמְרוֹתָם
  rationale: “Assigned” clarifies that these were designated service positions.
- pob_phrase: the instruments for the song of Yahweh, which David the king had made
  simplified_phrase: the instruments King David had made for Yahweh’s song
  preserved_meaning: David made the instruments for worship music specifically connected with Yahweh.
  reasoning_layer_used: Lexical decision and doctrine realignment for בִּכְלֵי שִׁיר יְהוָה
  rationale: The reordered clause is natural while keeping the song anchored to Yahweh.
- pob_phrase: when David offered praise by their hand
  simplified_phrase: David offered this praise through the Levites
  preserved_meaning: The Levites rendered the praise as David’s agents.
  reasoning_layer_used: Lexical rationale and alternative-reading note for בְּהַלֵּל דָּוִיד בְּיָדָם
  rationale: The direct wording preserves the likely agency sense without the opaque hand idiom.
interpretive_expansions:
- pob_phrase: when David offered praise by their hand
  rendering: David offered this praise through the Levites.
  claim: The Levites acted as the agents through whom David’s praise was rendered.
  evidence:
  - The POB rationale identifies the Levites’ agency as the likely sense of the compressed Hebrew.
  - The POB footnote offers “when David praised through them” as an alternative rendering.
  confidence: moderate
  alternatives_preserved:
  - The Levites performed a composition by David.
  - The Levites offered praise on David’s behalf.
translation_notes:
  risk_flags:
