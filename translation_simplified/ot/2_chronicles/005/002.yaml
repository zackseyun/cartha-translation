translation:
  language: en
  text: Then Solomon called the elders of Israel to gather in Jerusalem, along with all the heads of the tribes and the leaders of the fathers’ houses[a] of the sons of Israel. They were to bring up the ark of Yahweh’s covenant from the city of David—that is, Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fathers’ houses” were ancestral households organized through the paternal line.
    reason: cultural_note
simplification_decisions:
- pob_phrase: assembled the elders of Israel ... at Jerusalem
  simplified_phrase: called the elders of Israel to gather in Jerusalem
  preserved_meaning: Solomon caused Israel’s elders and other leaders to assemble in Jerusalem.
  reasoning_layer_used: The lexical decision identifies the verb as causing an assembly and permits “gathered together.”
  rationale: The active wording makes Solomon’s action and the gathering easier to understand.
- pob_phrase: the ark of the covenant of Yahweh
  simplified_phrase: the ark of Yahweh’s covenant
  preserved_meaning: The ark remains directly connected with Yahweh and his covenant.
  reasoning_layer_used: The lexical rationale permits the possessive form while requiring the divine name Yahweh.
  rationale: The possessive form is more natural English without weakening the covenantal meaning.
- pob_phrase: to bring up ... from the city of David, that is Zion
  simplified_phrase: They were to bring up ... from the city of David—that is, Zion
  preserved_meaning: The leaders gathered for the purpose of moving the ark upward from the place identified as Zion.
  reasoning_layer_used: The lexical decisions preserve the directional force of “bring up” and the appositional identification of Zion.
  rationale: A new sentence clarifies the purpose of the gathering while retaining the geographical wording.
translation_notes:
  risk_flags:
  - risk: “Fathers’ houses” may be unfamiliar to modern readers.
    mitigation: The term is retained to preserve Israel’s paternal kinship structure and explained in a brief footnote.
