translation:
  language: en
  text: King Solomon and the entire assembly of Israel that had gathered before him[a] were sacrificing so many sheep[b] and cattle in front of the ark that the animals could not be counted or numbered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the assembly gathered with Solomon.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term can include small livestock such as sheep and goats.
    reason: lexical_alternative
