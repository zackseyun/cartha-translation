translation:
  language: en
  text: 'The trumpeters and singers joined as one. Together, with trumpets, cymbals, and other musical instruments, they raised a single sound as they praised and thanked Yahweh: “He is good; his steadfast love[a] endures forever.” Then the temple—the house of Yahweh—was filled with a cloud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” means God’s loyal, enduring covenant love; it is also translated “mercy” or “lovingkindness.”
    reason: lexical_alternative
