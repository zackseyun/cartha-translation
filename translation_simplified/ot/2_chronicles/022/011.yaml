translation:
  language: en
  text: But Jehoshabeath, the king’s daughter, took Joash son of Ahaziah and secretly stole him away from the other royal sons who were being put to death.[a] She placed Joash and his nurse in a bedroom and hid him from Athaliah. Jehoshabeath was King Jehoram’s daughter, the wife of Jehoiada the priest, and Ahaziah’s sister. As a result, Athaliah did not kill Joash.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the royal sons who were about to be put to death.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “she did not kill him”; “she” most likely refers to Athaliah.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: took Joash son of Ahaziah and stole him away from among the king’s sons
  simplified_phrase: took Joash son of Ahaziah and secretly stole him away from the other royal sons
  preserved_meaning: Jehoshabeath removed Joash secretly while preserving the source image of stealing him away.
  reasoning_layer_used: POB lexical decisions for וַתִּקַּח and וַתִּגְנֹב אֹתוֹ
  rationale: “Secretly” clarifies the clandestine action without replacing the force of “stole.”
- pob_phrase: she put him and his nurse in the bedroom
  simplified_phrase: She placed Joash and his nurse in a bedroom
  preserved_meaning: Jehoshabeath concealed both the child and the woman nursing him in a sleeping room.
  reasoning_layer_used: POB lexical decisions for מֵינִקְתּוֹ and בַּחֲדַר הַמִּטּוֹת
  rationale: Repeating Joash’s name removes an unclear pronoun while keeping the historical details.
- pob_phrase: Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest
  simplified_phrase: Jehoshabeath was King Jehoram’s daughter, the wife of Jehoiada the priest, and Ahaziah’s sister
  preserved_meaning: The verse identifies her royal, marital, and family relationships.
  reasoning_layer_used: Source payload and POB lexical decision for כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  rationale: A separate sentence makes the relationships easy to follow and restores the source clause recorded in the audit.
interpretive_expansions:
- pob_phrase: and she did not put him to death
  rendering: As a result, Athaliah did not kill Joash
  claim: Athaliah is the implied subject, and Joash’s concealment prevented his death.
  evidence:
  - The immediate clause says Jehoshabeath hid Joash from Athaliah.
  - The POB theological decision identifies Athaliah as the most natural subject.
  confidence: moderate
  alternatives_preserved:
