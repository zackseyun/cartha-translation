translation:
  language: en
  text: Ahaziah was forty-two years old when he became king.[a] He ruled in Jerusalem for one year. His mother was Athaliah,[b] the daughter of Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text says “forty-two years old,” but the parallel account in 2 Kings 8:26 says “twenty-two years old.” Some therefore see a textual problem or understand the number in another way.
    reason: textual_variant
  - marker: b
    text: Or “descendant of Omri.” In Hebrew, “daughter” can sometimes mean a later female descendant.
    reason: lexical_alternative
