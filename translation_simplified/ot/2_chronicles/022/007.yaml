translation:
  language: en
  text: Ahaziah’s visit to Joram became the occasion for his downfall, which was from God. When he arrived, he went out with Jehoram toward Jehu son of Nimshi.[a] Yahweh had anointed Jehu to cut off Ahab’s family.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joram and Jehoram are two forms of the same king’s name. The Hebrew says they went “to Jehu,” though the context may mean “against Jehu” or “to meet Jehu.”
    reason: lexical_alternative
