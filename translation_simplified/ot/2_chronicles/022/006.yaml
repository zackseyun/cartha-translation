simplification_decisions:
- pob_phrase: because of the wounds that they had inflicted on him
  simplified_phrase: from the wounds he had received
  preserved_meaning: His battle wounds were the reason he returned to recover.
  reasoning_layer_used: Lexical rationale for כִּי הַמַּכִּים and אֲשֶׁר הִכֻּהוּ
  rationale: The shorter wording preserves both the injuries and their causal role.
- pob_phrase: went down to see
  simplified_phrase: went down to visit
  preserved_meaning: Azariah traveled to be with the sick king while retaining the directional sense of the journey.
  reasoning_layer_used: Lexical decisions for יָרַד and לִרְאוֹת
  rationale: “Visit” makes the contextual meaning clear while “down” preserves the Hebrew direction.
- pob_phrase: So he returned
  simplified_phrase: So Jehoram returned
  preserved_meaning: The wounded king returned to Jezreel to recover.
  reasoning_layer_used: Immediate narrative context and lexical decision for וַיָּשָׁב
  rationale: Naming Jehoram removes an unclear pronoun for readers entering at this verse.
interpretive_expansions:
- pob_phrase: So he returned
  rendering: So Jehoram returned
  claim: The opening pronoun refers to Jehoram son of Ahab.
  evidence:
  - The same wounded and sick king is named later in the verse as Jehoram son of Ahab.
  confidence: high
- pob_phrase: to see Jehoram
  rendering: to visit Jehoram
  claim: Seeing Jehoram here means making a personal visit to him.
  evidence:
  - The POB lexical rationale says the verb denotes a visit in this context.
  - Jehoram’s sickness explains the journey.
  confidence: high
  alternatives_preserved:
  - The underlying verb literally means “to see.”
