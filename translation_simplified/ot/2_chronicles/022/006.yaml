translation:
  language: en
  text: So Jehoram returned to Jezreel to recover from the wounds he had received at Ramah while fighting Hazael king of Aram. Azariah son of Jehoram, king of Judah, went down to visit Jehoram son of Ahab in Jezreel because he was sick.[a]
  philosophy: optimal-equivalence
