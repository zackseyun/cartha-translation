translation:
  language: en
  text: The people of Jerusalem made Jehoram’s youngest son, Ahaziah, king in his place. They did this because the raiding band that entered the camp with the Arabs[a] had killed all of Jehoram’s older sons. So Ahaziah, son of King Jehoram of Judah, became king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the raiding band that came among the Arabs into the camp.” The Hebrew phrase can be understood in either way.
    reason: lexical_alternative
