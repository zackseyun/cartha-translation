- pob_phrase: the inhabitants of Jerusalem
  simplified_phrase: the people of Jerusalem
  preserved_meaning: The residents of Jerusalem installed Ahaziah as king.
  reasoning_layer_used: POB lexical decision for יוֹשְׁבֵי יְרוּשָׁלִַם
  rationale: “People” is more familiar than “inhabitants” while keeping the same group in view.
- pob_phrase: made Ahaziah, his youngest son, king in his place
  simplified_phrase: made Jehoram’s youngest son, Ahaziah, king in his place
  preserved_meaning: Ahaziah was Jehoram’s youngest son and succeeded him as king.
  reasoning_layer_used: POB lexical decisions for בְנוֹ הַקָּטֹן and תַּחְתָּיו
  rationale: Naming Jehoram removes unclear pronouns without changing the royal succession.
- pob_phrase: because the raiding band that came with the Arabs into the camp had killed all the older sons
  simplified_phrase: They did this because the raiding band that entered the camp with the Arabs had killed all of Jehoram’s older sons
  preserved_meaning: The raid left Ahaziah as the surviving son available to succeed Jehoram.
  reasoning_layer_used: POB lexical decisions for הַגְּדוּד, הַבָּא בָעַרְבִים, לַמַּחֲנֶה, and כָל הָרִאשֹׁנִים
  rationale: A separate sentence and explicit names make the cause clear while retaining the raid and camp imagery.
