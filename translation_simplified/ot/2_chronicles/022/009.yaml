translation:
  language: en
  text: Jehu searched for Ahaziah. His men found him hiding in Samaria, captured him, and brought him to Jehu. They put him to death. Then they buried him because they said, “He is a descendant of Jehoshaphat, who sought Yahweh with all his heart.” Ahaziah’s royal family could not hold on to the kingdom.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he sought Ahaziah, and they captured him
  simplified_phrase: Jehu searched for Ahaziah. His men found him ... captured him
  preserved_meaning: Jehu directed the search, while men under his authority carried out the capture.
  reasoning_layer_used: Lexical rationale and narrative context
  rationale: Naming the contextual agents makes the shift from singular to plural understandable.
- pob_phrase: He is the son of Jehoshaphat
  simplified_phrase: He is a descendant of Jehoshaphat
  preserved_meaning: Ahaziah belonged to Jehoshaphat’s family line.
  reasoning_layer_used: Source wording and immediate genealogical context
  rationale: Descendant avoids implying that Ahaziah was Jehoshaphat’s immediate son.
- pob_phrase: the house of Ahaziah had no power to retain the kingdom
  simplified_phrase: Ahaziah’s royal family could not hold on to the kingdom
  preserved_meaning: Ahaziah’s dynasty lacked the capacity to maintain royal rule.
  reasoning_layer_used: Lexical and theological decisions
  rationale: Royal family and hold on express the audited dynastic meaning in common English.
interpretive_expansions:
- pob_phrase: he sought Ahaziah, and they captured him
  rendering: Jehu searched for Ahaziah. His men found him ... captured him
  claim: Jehu was responsible for the search, and forces under him captured Ahaziah.
  evidence:
  - The POB rationale identifies Jehu or forces acting under his authority as the contextual subject.
  - The Hebrew shifts from a singular search verb to a plural capture verb.
  confidence: high
  alternatives_preserved:
  - Jehu’s forces may be understood collectively throughout the search.
- pob_phrase: son of Jehoshaphat; house of Ahaziah
  rendering: descendant of Jehoshaphat; Ahaziah’s royal family
  claim: The family language concerns descent from Jehoshaphat and Ahaziah’s dynasty.
  evidence:
  - The immediate genealogy identifies Ahaziah as Jehoshaphat’s grandson.
  - The POB audit explicitly identifies Ahaziah’s house as his dynasty.
  confidence: high
  alternatives_preserved:
  - Son may function as broader descent language.
  - Ahaziah’s dynasty is an equivalent rendering of royal family.
translation_notes:
  risk_flags:
  - risk: “His men” identifies the plural agents more specifically than the Hebrew does.
    mitigation: The wording follows the POB rationale that the agents acted under Jehu’s authority.
  - risk: “Royal family” replaces the source image of a dynastic house.
    mitigation: It preserves the audited collective sense without making a claim about every individual.
