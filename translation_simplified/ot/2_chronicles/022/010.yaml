translation:
  language: en
  text: Athaliah,[a] Ahaziah’s mother, saw that her son was dead. She took action and destroyed all the descendants in Judah’s royal line.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb here is difficult and literally reads “spoke,” but the context and the parallel account in 2 Kings 11:1 support “destroyed.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: the mother of Ahaziah
  simplified_phrase: Ahaziah’s mother
  preserved_meaning: Athaliah is identified by her relationship to Ahaziah.
  reasoning_layer_used: POB lexical decision for אֵם אֲחַזְיָהוּ
  rationale: The possessive form is shorter and more natural in modern English.
- pob_phrase: she arose and destroyed
  simplified_phrase: She took action and destroyed
  preserved_meaning: Athaliah responded decisively by destroying the royal line.
  reasoning_layer_used: POB lexical decisions for וַתָּקָם and וַתְּדַבֵּר
  rationale: “Took action” preserves the decisive force of “arose” without suggesting that she merely stood up.
- pob_phrase: all the royal offspring of the house of Judah
  simplified_phrase: all the descendants in Judah’s royal line
  preserved_meaning: Her targets belonged to Judah’s ruling dynasty.
  reasoning_layer_used: POB lexical decisions for זֶרַע הַמַּמְלָכָה and לְבֵית יְהוּדָה
  rationale: “Royal line” makes the dynastic relationship clear without the opaque phrase “house of Judah.”
translation_notes:
  risk_flags:
