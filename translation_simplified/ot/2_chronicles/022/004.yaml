translation:
  language: en
  text: He did what was evil in Yahweh’s sight, just as Ahab’s family had done. After his father died, members of that family were his advisers, and their advice led to his destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “they advised him in order to destroy him.” The Hebrew may describe either the result of their advice or its purpose.
    reason: lexical_alternative
