translation:
  language: en
  text: Worthless men—sons of Belial[a]—gathered around him and proved stronger than Rehoboam son of Solomon. At that time, Rehoboam was young, lacked courage, and had not made himself strong enough to resist them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression may also mean “scoundrels” or “worthless men.”
    reason: lexical_alternative
