- pob_phrase: when Rehoboam was young and fainthearted
  simplified_phrase: At that time, Rehoboam was young, lacked courage
  preserved_meaning: Rehoboam's youth and lack of resolve left him vulnerable.
  reasoning_layer_used: POB lexical decision for נַעַר and רַךְ לֵבָב
  rationale: A new sentence and common wording make the political weakness easier to understand.
- pob_phrase: had not strengthened himself against them
  simplified_phrase: had not made himself strong enough to resist them
  preserved_meaning: Rehoboam had not developed the strength or resolve needed to oppose them.
  reasoning_layer_used: POB lexical decision for לֹא הִתְחַזַּק לִפְנֵיהֶם
  rationale: The wording explains the Hebrew idiom while preserving its image of becoming strong.
- pob_phrase: worthless men, sons of Belial
  simplified_phrase: Worthless men—sons of Belial[a]
  preserved_meaning: The men are condemned as morally worthless while the ambiguous Hebrew expression remains visible.
  reasoning_layer_used: POB theological decision on בְּנֵי בְלִיַּעַל
  rationale: The retained phrase protects the ambiguity, and the footnote gives its plain idiomatic sense.
