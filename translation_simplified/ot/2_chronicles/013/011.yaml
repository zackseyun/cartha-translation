translation:
  language: en
  text: Every morning and every evening, we offer burnt offerings to Yahweh and burn fragrant incense. We arrange the bread[a] on the ceremonially pure table, and every evening we light the lamps of the golden lampstand. We carry out the duties Yahweh our God has given us, but you have abandoned him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also called “the showbread” or “the bread of the Presence”; the Hebrew describes bread arranged in order.
    reason: lexical_alternative
