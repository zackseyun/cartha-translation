translation:
  language: en
  text: Did you not drive out Yahweh’s priests—the sons of Aaron—and the Levites, and then appoint your own priests as the peoples of other lands do? Anyone who brings a young bull and seven rams to be ordained[a] becomes a priest of what are not gods.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “to fill his hand,” a technical expression for ordination as a priest.
    reason: lexical_alternative
  - marker: b
    text: Or “for non-gods” or “of false gods”; the Hebrew denies that they are truly gods.
    reason: alternative_reading
