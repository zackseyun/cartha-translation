  reasoning_layer_used: Lexical decision for מָלַךְ
  rationale: The approved alternative “was king” is easier for readers unfamiliar with regnal language.
- pob_phrase: And there was war between Abijah and Jeroboam
  simplified_phrase: Abijah and Jeroboam were at war with each other
  preserved_meaning: The two rulers were in mutual armed conflict.
  reasoning_layer_used: Lexical decisions for וּמִלְחָמָה הָיְתָה and בֵּין ... וּבֵין
  rationale: The direct English construction preserves the simple statement without adding when the war began or how long it lasted.
