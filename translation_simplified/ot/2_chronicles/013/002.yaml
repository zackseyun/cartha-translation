translation:
  language: en
  text: He was king in Jerusalem for three years. His mother was Micaiah,[a] daughter of Uriel from Gibeah. Abijah and Jeroboam were at war with each other.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the parallel account, 1 Kings 15:2 calls Abijah’s mother Maacah. The two accounts may use different names or ways of describing family relationships, since “daughter” can also mean a female descendant.
    reason: alternative_reading
