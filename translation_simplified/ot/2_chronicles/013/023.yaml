translation:
  language: en
  text: Abijah died,[a] and they buried him in the City of David. His son Asa reigned in his place. During Asa’s reign, the land had rest for ten years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says that Abijah “slept with his fathers,” a customary image for dying and joining his ancestors.
    reason: simplification_note
