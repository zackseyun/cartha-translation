- pob_phrase: slept with his fathers
  simplified_phrase: died
  preserved_meaning: Abijah died and joined his deceased ancestors, while the Hebrew sleep image is retained in a note.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׁכַּב and עִם אֲבֹתָיו
  rationale: Plainly stating his death avoids an awkward hybrid while the note preserves the source image.
- pob_phrase: In his days
  simplified_phrase: During Asa’s reign
  preserved_meaning: The ten years of rest occurred while Asa was king.
  reasoning_layer_used: POB lexical decision for בְּיָמָיו and immediate succession context
  rationale: The succession context makes clear that “his days” refers to Asa’s reign.
- pob_phrase: the land had rest for ten years
  simplified_phrase: the land had rest for ten years
  preserved_meaning: The land remained free from disturbance for a ten-year period.
  reasoning_layer_used: POB lexical decisions for שָׁקְטָה and עֶשֶׂר שָׁנִים
  rationale: The direct wording avoids personifying the land and preserves the exact duration.
