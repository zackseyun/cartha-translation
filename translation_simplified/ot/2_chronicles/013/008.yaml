translation:
  language: en
  text: Now you claim that you are strong enough to stand against the kingdom of Yahweh, ruled through David’s descendants. You make this claim because there are so many of you and because you have the golden calves that Jeroboam made for you as gods.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the kingdom of Yahweh in the hand of the sons of David
  simplified_phrase: the kingdom of Yahweh, ruled through David’s descendants
  preserved_meaning: The kingdom belongs to Yahweh but is administered through David’s royal line.
  reasoning_layer_used: lexical and theological decisions
  rationale: This explains the Hebrew hand idiom without collapsing Yahweh’s rule into Davidic rule.
- pob_phrase: you are a great multitude
  simplified_phrase: there are so many of you
  preserved_meaning: Their claim rests partly on numerical superiority.
  reasoning_layer_used: lexical decision and immediate military context
  rationale: The common wording preserves the emphasis on their large numbers.
- pob_phrase: have with you the golden calves
  simplified_phrase: you have the golden calves
  preserved_meaning: Jeroboam’s calf idols accompany and support their opposition.
  reasoning_layer_used: lexical decision
  rationale: The shorter construction states the same possession naturally.
translation_notes:
  risk_flags:
  - risk: “Ruled through” makes the administrative force of the Hebrew hand idiom explicit.
    mitigation: It preserves both Yahweh’s ownership of the kingdom and David’s continuing royal line.
