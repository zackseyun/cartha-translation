  text: Eden, Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah served under his authority.[a] In the priests’ cities, they faithfully distributed shares to their brothers in the priestly community, according to the divisions, whether great or small.
  philosophy: optimal-equivalence
