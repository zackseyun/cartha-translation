translation:
  language: en
  text: When all this was over, all the Israelites who had attended the feast went to the towns of Judah. They smashed the sacred pillars, cut down the objects associated with Asherah,[a] and demolished the places of worship known as high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh. They continued until all these things were completely destroyed. Then all the sons of Israel went back to their own towns, each man to his own property.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to Asherah poles or trees used as objects of worship.
    reason: lexical_alternative
