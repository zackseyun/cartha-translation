  text: In everything he undertook—serving at God’s temple and obeying the law[a] and the commandment—he sought his God with all his heart, carried it out, and prospered.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “instruction.”
    reason: lexical_alternative
  - marker: b
    text: Or “inquired of his God.”
    reason: lexical_alternative
  - marker: c
    text: Or “succeeded.”
    reason: lexical_alternative
