translation:
  language: en
  text: Hezekiah organized the priests and Levites into their assigned groups and gave each man his own duties. Their work included burnt offerings and peace offerings, carrying out sacred service, and giving thanks and praise at the gates of Yahweh’s camps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the camps of Yahweh”; some understand this as referring to the temple courts.
    reason: cultural_note
simplification_decisions:
- pob_phrase: appointed the divisions of the priests and the Levites according to their divisions
  simplified_phrase: organized the priests and Levites into their assigned groups
  preserved_meaning: Hezekiah officially arranged them within their established service groups.
  reasoning_layer_used: lexical decisions for וַיַּעֲמֵד and מַחְלְקוֹת
  rationale: This removes repetitive administrative wording while retaining the formal organization.
- pob_phrase: each man according to his service, both the priests and the Levites
  simplified_phrase: gave each man his own duties
  preserved_meaning: Every male priest and Levite received his particular temple assignment.
  reasoning_layer_used: lexical and theological decisions for אִישׁ כְּפִי עֲבֹדָתוֹ
  rationale: The wording keeps the distributive masculine reference but states the assignment naturally.
- pob_phrase: to minister and to give thanks and to praise
  simplified_phrase: carrying out sacred service, and giving thanks and praise
  preserved_meaning: Their duties included distinct acts of temple service, thanksgiving, and praise.
  reasoning_layer_used: lexical decisions for לְשָׁרֵת, וּלְהוֹדוֹת, and וּלְהַלֵּל
  rationale: “Sacred service” makes the worship setting clear without merging thanksgiving and praise.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “Yahweh’s camps” for military camps.
    mitigation: The footnote preserves the source image while noting its likely temple setting.
