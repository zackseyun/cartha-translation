translation:
  language: en
  text: Azariah, the chief priest from Zadok’s family, answered him, “Ever since they began bringing the sacred contributions into Yahweh’s temple, we have eaten all we need and still have plenty left over. Yahweh has blessed his people, and this huge amount is still left.”
