  rationale: The active wording turns the verse fragment into clear English without losing the record-keeping sense.
- pob_phrase: for all the assembly
  simplified_phrase: throughout the whole assembly
  preserved_meaning: The enrollment covered the entire community in view.
  reasoning_layer_used: Lexical decision for לְכָל קָהָל
  rationale: “Throughout” makes the scope clearer than the ambiguous English phrase “for all.”
- pob_phrase: in their faithfulness they consecrated themselves as holy
  simplified_phrase: they were faithful in setting themselves apart as holy
  preserved_meaning: They reliably devoted themselves to the holiness required for sacred duties.
  reasoning_layer_used: Lexical and theological decisions for בֶאֱמוּנָתָם and יִתְקַדְּשׁוּ קֹדֶשׁ
