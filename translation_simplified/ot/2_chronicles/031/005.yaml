translation:
  language: en
  text: 'When the matter became widely known, the sons of Israel[a] brought large amounts of the first portions of their produce set apart for God: grain, new wine, oil, honey,[b] and all the produce of the fields. They also brought their tithe—a tenth of everything—in great abundance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” refers here to the people of Israel as a whole.
    reason: lexical_alternative
  - marker: b
    text: Here “honey” may include a sweet syrup, such as date syrup.
    reason: cultural_note
