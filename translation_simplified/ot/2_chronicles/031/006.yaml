  language: en
  text: The people of Israel and Judah who lived in Judah’s cities also brought one tenth of the cattle and sheep. They also brought one tenth of the holy gifts[a] dedicated to Yahweh their God. They put everything into many heaps, heap upon heap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “holy things” or “consecrated things”; the Hebrew refers to items set apart for God.
    reason: lexical_alternative
