- pob_phrase: they struck down all the cities
  simplified_phrase: They struck people down in every city
  preserved_meaning: The army violently defeated people throughout the surrounding cities.
  reasoning_layer_used: POB lexical decision for וַיַּכּוּ and its military context
  rationale: This clarifies that the cities stand for people while retaining the violent force of “struck down.”
- pob_phrase: the terror of Yahweh was upon them
  simplified_phrase: the terror of Yahweh was on the people there
  preserved_meaning: Overwhelming terror associated with Yahweh rested on the cities’ people.
  reasoning_layer_used: POB lexical and theological decisions for פַחַד יְהוָה and יְהוָה
  rationale: This uses natural English without adding a prior completed event and keeps Yahweh’s name.
- pob_phrase: for there was much spoil in them
  simplified_phrase: because there was a great amount of spoil in them
  preserved_meaning: They plundered the cities because the cities contained abundant goods from war.
  reasoning_layer_used: POB lexical decisions for בִּזָּה רַבָּה and בָהֶם plus the causal כִּי
  rationale: This states the causal link clearly and expresses the quantity in common English.
