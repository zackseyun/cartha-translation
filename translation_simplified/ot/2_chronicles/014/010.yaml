translation:
  language: en
  text: 'Asa cried out to Yahweh his God: “Yahweh, no one but you can help, whether people are many or have no strength.[a] Help us, Yahweh our God! We depend on you, and we have come in your name against this vast army. Yahweh our God, you are our God. Do not let man prevail against you.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “No one but you can help between the mighty and the powerless.” The Hebrew may emphasize either numbers or strength.
    reason: alternative_reading
  - marker: b
    text: Or, “Do not let mortal man withstand you.”
    reason: lexical_alternative
