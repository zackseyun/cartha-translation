  preserved_meaning: Zerah moved toward them for battle.
  reasoning_layer_used: POB lexical decision for וַיֵּצֵא and immediate military context
  rationale: “Marched out” clearly conveys hostile military movement in modern English.
- pob_phrase: with an army of a thousand thousands and three hundred chariots
  simplified_phrase: with an army of a thousand thousands and three hundred chariots
  preserved_meaning: The text directly reports an immense army while leaving the number’s precise force open.
  reasoning_layer_used: POB lexical decision and footnote for אֶלֶף אֲלָפִים
  rationale: The direct numerical report is retained, while the footnote explains its possible meanings.
- pob_phrase: and he came as far as Mareshah
  simplified_phrase: He advanced as far as Mareshah.
  preserved_meaning: Zerah’s military movement reached Mareshah.
  reasoning_layer_used: POB lexical decision for וַיָּבֹא עַד מָרֵשָׁה
  rationale: A new sentence and “advanced” clarify the movement while retaining “as far as.”
