translation:
  language: en
  text: Zerah the Cushite[b] marched out against them with an army of a thousand thousands[a] and three hundred chariots. He advanced as far as Mareshah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one million.” The Hebrew literally says “a thousand thousands,” which may be an exact number or a conventional expression for an enormous army.
    reason: lexical_alternative
  - marker: b
    text: “Cushite” is the Hebrew term for a person from Cush; it is traditionally translated “Ethiopian.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came out against them
