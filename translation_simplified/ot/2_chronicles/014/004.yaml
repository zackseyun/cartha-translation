  language: en
  text: He removed the high places used for worship and the incense altars[a] from every city in Judah. The kingdom was at peace under his rule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “sun pillars.” The Hebrew term refers to objects used in worship and may sometimes be connected with worship of the sun.
