translation:
  language: en
  text: Asa had an army of 300,000 men from Judah, armed with large shields and spears. He also had 280,000 men from Benjamin, carrying shields and using bows. All of them were strong and courageous fighting men.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: an army of three hundred thousand from Judah bearing large shields and spears
  simplified_phrase: an army of 300,000 men from Judah, armed with large shields and spears
  preserved_meaning: The troops came from Judah and were equipped with the larger kind of shield and with spears.
  reasoning_layer_used: POB lexical decisions for חַיִל, מִיהוּדָה, and נֹשֵׂא צִנָּה וָרֹמַח
  rationale: “Armed with” states the military equipment more directly than “bearing.”
- pob_phrase: from Benjamin two hundred eighty thousand bearing shields and drawing bows
  simplified_phrase: He also had 280,000 men from Benjamin, carrying shields and using bows
  preserved_meaning: The Benjaminite troops carried shields and served as bowmen.
  reasoning_layer_used: POB lexical decisions for נֹשְׂאֵי מָגֵן and וְדֹרְכֵי קֶשֶׁת
  rationale: “Using bows” makes the bow idiom immediately clear without using the opaque literal image.
- pob_phrase: mighty men of valor
  simplified_phrase: strong and courageous fighting men
  preserved_meaning: These were male soldiers marked by fighting strength and courage.
  reasoning_layer_used: POB lexical and theological decisions for גִּבּוֹרֵי חָיִל
  rationale: The stock military expression is unpacked while retaining its male reference and full force.
