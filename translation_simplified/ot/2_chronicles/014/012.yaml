translation:
  language: en
  text: Asa and those with him chased them as far as Gerar. So many Cushites[a] were struck down that none survived, for they were shattered before Yahweh and before his army[b]. Then they carried away a vast amount of plunder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Ethiopians.” The Hebrew refers to the people of Cush.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can mean “camp” or “army”; “his” may refer to Asa’s force, though some understand it as Yahweh’s host.
    reason: alternative_reading
