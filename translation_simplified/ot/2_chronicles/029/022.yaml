translation:
  language: en
  text: They slaughtered the cattle.[a] The priests collected the blood and splashed it against the altar.[b] Next they slaughtered the rams and splashed their blood against the altar. Then they slaughtered the lambs and splashed their blood against the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a collective term for cattle; it may refer specifically to bulls in this sacrificial setting.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew describes a forceful ritual application of blood, not a light sprinkling.
    reason: lexical_alternative
