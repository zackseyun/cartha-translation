translation:
  language: en
  text: Then Hezekiah gave the command to offer up the burnt offering on the altar. When the burnt offering began, the song of Yahweh[a] also began, accompanied by trumpets and the musical instruments of David king of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the song to Yahweh.” The Hebrew literally says “the song of Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hezekiah commanded to offer up
  simplified_phrase: Hezekiah gave the command to offer up
  preserved_meaning: Hezekiah issued a directive while the sacrifice retained its upward-offering sense.
  reasoning_layer_used: Applied revisions and lexical decisions for וַיֹּאמֶר and לְהַעֲלוֹת.
  rationale: This removes the awkward construction without weakening the command or the sacrificial image.
- pob_phrase: at the time the burnt offering began
  simplified_phrase: When the burnt offering began
  preserved_meaning: The offering and worship began together.
  reasoning_layer_used: Lexical decision for וּבְעֵת and the repeated הֵחֵל.
  rationale: The shorter clause is natural English while retaining the repeated “began.”
- pob_phrase: with the trumpets and by means of the instruments
  simplified_phrase: accompanied by trumpets and the musical instruments
  preserved_meaning: Trumpets and Davidic instruments supplied the music for the worship.
  reasoning_layer_used: Lexical decisions for הַחֲצֹצְרוֹת, וְעַל יְדֵי, and כְּלֵי דָּוִיד.
  rationale: This states the musical relationship clearly without adding an instrument type.
translation_notes:
  risk_flags:
  - risk: “Song of Yahweh” may sound as though Yahweh is the singer or owner.
    mitigation: The footnote preserves the contextually likely alternative “song to Yahweh” without resolving the Hebrew ambiguity.
  - risk: The Hebrew does not name who carried out Hezekiah’s command.
    mitigation: The wording keeps the agents unstated rather than supplying priests or Levites.
