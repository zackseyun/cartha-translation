translation:
  language: en
  text: He said to them, “Levites, listen to me. Now set yourselves apart as holy, and set apart the temple of Yahweh, the God of your fathers, as holy. Remove from the holy place whatever defiles it.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “the uncleanness,” “the impurity,” or “the filth”; it refers to what defiles the sanctuary.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: consecrate yourselves, and consecrate the house of Yahweh
  simplified_phrase: set yourselves apart as holy, and set apart the temple of Yahweh ... as holy
  preserved_meaning: The Levites and the temple must both be consecrated, with the repeated holiness language retained.
  reasoning_layer_used: Lexical decisions for both forms of קדשׁ and for בֵּית יְהוָה
  rationale: The wording explains consecration while preserving the two distinct commands and their repetition.
- pob_phrase: the house of Yahweh
  simplified_phrase: the temple of Yahweh
  preserved_meaning: Yahweh’s house is the temple in this cleansing context.
  reasoning_layer_used: Lexical alternative and immediate temple context
  rationale: “Temple” gives modern readers the intended place without changing the reference.
- pob_phrase: remove the uncleanness from the holy place
  simplified_phrase: Remove from the holy place whatever defiles it
  preserved_meaning: All defiling impurity is to be taken out of the sacred area.
  reasoning_layer_used: Lexical decisions for הַנִּדָּה and מִן הַקֹּדֶשׁ
  rationale: The concrete action is clearer while the footnote preserves the Hebrew term’s range.
