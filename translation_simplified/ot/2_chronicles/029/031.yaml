translation:
  language: en
  text: Then Hezekiah responded, “Now you have dedicated yourselves to Yahweh for sacred service. Come near and bring sacrifices and thank offerings to Yahweh’s house, the temple.” So the gathered people brought sacrifices and thank offerings, and everyone whose heart was willing brought burnt offerings.
