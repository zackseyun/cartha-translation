translation:
  language: en
  text: There were also many burnt offerings, together with the fat portions from the peace offerings[a] and the drink offerings that accompanied the burnt offerings. In this way, the worship in Yahweh’s temple was put back in proper order.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offerings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the burnt offerings were also in abundance
  simplified_phrase: There were also many burnt offerings
  preserved_meaning: A large number of burnt offerings were presented.
  reasoning_layer_used: Lexical decision for לָרֹב and collective עֹלָה
  rationale: Common wording replaces the abstract phrase “in abundance.”
- pob_phrase: with the fat of the peace offerings and the drink offerings for the burnt offerings
  simplified_phrase: together with the fat portions from the peace offerings and the drink offerings that accompanied the burnt offerings
  preserved_meaning: The sacrifices included designated fat portions and associated liquid offerings.
  reasoning_layer_used: Lexical decisions for בְּחֶלְבֵי, הַשְּׁלָמִים, וּבַנְּסָכִים, and לָעֹלָה
  rationale: The wording clarifies that sacrificial fat portions and poured-out offerings accompanied the burnt offerings.
- pob_phrase: the service of the house of Yahweh was established
  simplified_phrase: the worship in Yahweh’s temple was put back in proper order
  preserved_meaning: Yahweh’s temple service was restored to an ordered state.
  reasoning_layer_used: Lexical rationale for וַתִּכּוֹן and עֲבוֹדַת בֵּית יְהוָה plus immediate context
  rationale: The result is stated plainly while retaining Yahweh’s covenant name.
