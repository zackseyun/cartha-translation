translation:
  language: en
  text: Then they went in to King Hezekiah and reported, “We have cleansed the entire temple of Yahweh, the altar for burnt offerings and all its equipment, and the table for bread arranged in rows[a] and all its equipment.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called “the table of showbread.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: said
  simplified_phrase: reported
  preserved_meaning: They formally told the king that the cleansing was complete.
  reasoning_layer_used: immediate narrative context
  rationale: “Reported” makes the purpose of their statement clear.
- pob_phrase: all the house of Yahweh
  simplified_phrase: the entire temple of Yahweh
  preserved_meaning: The whole sanctuary belonging to Yahweh was cleansed.
  reasoning_layer_used: POB lexical alternatives and theological decision
  rationale: “Temple” clarifies the biblical image while retaining Yahweh’s name.
- pob_phrase: utensils
  simplified_phrase: equipment
  preserved_meaning: All implements used with the altar and table were cleansed.
  reasoning_layer_used: POB lexical rationale
  rationale: “Equipment” naturally covers the vessels and implements used in worship.
interpretive_expansions:
- pob_phrase: the table of the rows
  rendering: the table for bread arranged in rows
  claim: The rows on the table were rows of sacred bread.
  evidence:
  - The POB footnote identifies it as the table for bread arranged before Yahweh.
  - The lexical rationale says the table was associated with bread set out in rows.
  confidence: high
  alternatives_preserved:
  - the table of showbread
translation_notes:
  risk_flags:
  - risk: “Temple” does not retain the literal Hebrew image “house of Yahweh.”
    mitigation: It clearly identifies the same sanctuary and retains the name Yahweh.
  - risk: “Equipment” may sound broader than sanctuary vessels and implements.
    mitigation: Its association with the altar and table limits it to their worship implements.
