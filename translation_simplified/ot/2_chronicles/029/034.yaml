translation:
  language: en
  text: There were too few priests to skin all the animals for the burnt offerings. So their brothers, the Levites,[a] strengthened them by helping with the work until it was finished and the priests had made themselves ready for sacred service. The Levites were more sincere than the priests in consecrating themselves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” refers to the Levites as fellow temple servants, not necessarily close relatives.
    reason: cultural_note
