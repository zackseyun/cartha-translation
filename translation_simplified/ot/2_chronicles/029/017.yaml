translation:
  language: en
  text: They began preparing Yahweh’s temple for holy use on the first day of the first month. On the eighth day of the month, they reached the front porch of Yahweh’s temple. Then they consecrated Yahweh’s temple over eight days, finishing on the sixteenth day of the first month.
