translation:
  language: en
  text: Hezekiah assigned the Levites their places in Yahweh’s temple, with cymbals, harps, and lyres, in accordance with the command connected with David, Gad the king’s seer,[a] and Nathan the prophet. This command came from Yahweh through his prophets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seer” translates a Hebrew title different from “prophet,” though the roles were closely related.
    reason: lexical_alternative
