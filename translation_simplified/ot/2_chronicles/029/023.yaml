translation:
  language: en
  text: Then they brought the goats for the sin offering in front of the king and the gathered people. Hands were then laid on the goats.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify who laid hands on the goats. It may mean the king and the gathered people, perhaps acting through representatives, or it may mean the priests.
    reason: alternative_reading
