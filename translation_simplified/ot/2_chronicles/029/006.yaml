  rationale: “Ancestors” is inclusive modern English, while “unfaithful” keeps the covenantal force.
- pob_phrase: did what was evil in the eyes of Yahweh our God
  simplified_phrase: did what Yahweh our God saw as evil
  preserved_meaning: Yahweh judged their actions to be objectively evil.
  reasoning_layer_used: POB lexical decisions for הָרַע and בְּעֵינֵי יְהוָה
  rationale: The Hebrew sight image is recast as natural English without weakening Yahweh’s judgment.
- pob_phrase: the dwelling place of Yahweh
  simplified_phrase: Yahweh’s temple, his dwelling place
  preserved_meaning: The temple is identified as the place where Yahweh dwells.
  reasoning_layer_used: POB theological decision for מִשְׁכָּן in its temple-period context
  rationale: Naming the temple prevents confusion with the wilderness tabernacle while retaining the dwelling concept.
