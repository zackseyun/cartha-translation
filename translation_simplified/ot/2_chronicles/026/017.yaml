translation:
  language: en
  text: Azariah the priest followed him in, accompanied by eighty priests of Yahweh. They were courageous men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression may also mean “strong men” or “men of valor.”
