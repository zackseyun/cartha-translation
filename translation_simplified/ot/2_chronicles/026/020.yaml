translation:
  language: en
  text: Azariah the chief priest and all the other priests turned toward Uzziah. They saw that a serious skin disease had broken out on his forehead.[a] They quickly got him out of there,[b] and he himself hurried to leave because Yahweh had struck him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term describes a serious skin affliction under Israel’s priestly laws; it does not necessarily mean modern leprosy.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “they drove him out of there,” emphasizing forceful removal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and behold, he was leprous on his forehead
  simplified_phrase: They saw that a serious skin disease had broken out on his forehead
  preserved_meaning: The priests suddenly recognized the visible skin affliction on Uzziah’s forehead.
  reasoning_layer_used: POB lexical decision and cultural footnote on מְצֹרָע
  rationale: This avoids equating the ancient impurity term directly with modern Hansen’s disease.
- pob_phrase: they hurried him out of there
  simplified_phrase: They quickly got him out of there
  preserved_meaning: The priests urgently removed Uzziah from the sanctuary area.
  reasoning_layer_used: POB lexical decision on וַיַּבְהִלֻהוּ
  rationale: The wording is natural English while retaining urgency and leaving the degree of force open.
- pob_phrase: he himself also hastened to go out
  simplified_phrase: he himself hurried to leave
  preserved_meaning: Uzziah personally joined in the urgent departure.
  reasoning_layer_used: POB lexical decisions on וְגַם הוּא and נִדְחַף לָצֵאת
  rationale: The shorter wording keeps both personal emphasis and haste.
