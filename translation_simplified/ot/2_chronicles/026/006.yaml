translation:
  language: en
  text: 'He went out and fought the Philistines. He broke through the wall around each of three cities: Gath, Jabneh, and Ashdod. Then he built cities in the area of Ashdod[a] and among the Philistines.'
  philosophy: optimal-equivalence
  footnotes:
