translation:
  language: en
  text: They confronted King Uzziah and said, “Uzziah, you have no right to burn incense to the LORD. Only the priests, the sons of Aaron who have been set apart for this work, may burn incense. Leave the sanctuary! You have been unfaithful to God, and the LORD God will not honor you for this.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They stood against King Uzziah
  simplified_phrase: They confronted King Uzziah
  preserved_meaning: The priests actively opposed the king.
  reasoning_layer_used: Lexical decision for וַיַּעַמְדוּ עַל
  rationale: “Confronted” makes the idiom’s adversarial force immediately clear.
- pob_phrase: It is not for you ... but for the priests
  simplified_phrase: you have no right ... Only the priests ... may
  preserved_meaning: Offering incense was reserved for the consecrated Aaronic priests.
  reasoning_layer_used: Lexical and theological decisions on priestly exclusivity
  rationale: The direct wording clearly states the restricted priestly right without making it bureaucratic.
- pob_phrase: who are consecrated to burn incense
  simplified_phrase: who have been set apart for this work
  preserved_meaning: The priests were specially appointed for sacred incense service.
  reasoning_layer_used: Lexical decision for הַמְקֻדָּשִׁים
  rationale: “Set apart” explains the less familiar religious term “consecrated.”
interpretive_expansions:
- pob_phrase: you have acted unfaithfully
  rendering: You have been unfaithful to God
  claim: Uzziah’s unfaithfulness was a sacred breach against God, not merely a procedural error.
  evidence:
  - The cultic context concerns violating the LORD’s order for incense worship.
  - The POB lexical rationale says מָעַל carries covenantal and sacrilegious force here.
  confidence: high
  alternatives_preserved:
  - You have acted unfaithfully.
  - You have committed a sacred offense.
- pob_phrase: it will not be for your honor from Yahweh God
  rendering: the LORD God will not honor you for this
  claim: God would not grant Uzziah honor for this action.
  evidence:
  - The POB lexical decision identifies the LORD God as the source of true honor.
  - The POB rationale explains the elliptical clause as saying this action would not result in honor from God.
  confidence: high
  alternatives_preserved:
  - This will not bring you honor from the LORD God.
  - This will bring you no honor from the LORD God.
translation_notes:
  risk_flags:
  - risk: “You have no right” states the implied rightful-prerogative sense more directly than the Hebrew idiom.
    mitigation: The POB lexical decision explicitly identifies authorization and rightful prerogative as the construction’s meaning.
  - risk: “The LORD God will not honor you” could sound broader than the immediate offense.
    mitigation: “For this” confines the statement to Uzziah’s unlawful incense offering.
