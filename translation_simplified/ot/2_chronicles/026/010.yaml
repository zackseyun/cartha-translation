translation:
  language: en
  text: He built towers in the wilderness and cut many water-storage pits out of the rock because he had large herds. He had farmers and vineyard workers in the lowland, on the plain, in the hills, and in the fertile countryside[a] because he loved the soil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in Carmel,” if the Hebrew refers to the place rather than fertile countryside.
    reason: alternative_reading
