translation:
  language: en
  text: Uzziah became angry. He was holding an incense burner, intending to burn incense. While he was angry with the priests, a skin disease[a] suddenly broke out on his forehead in their sight. This happened inside Yahweh’s temple, beside the altar of incense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “leprosy” can refer more broadly to a serious or defiling skin disease, not necessarily modern leprosy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with a censer in his hand to burn incense
  simplified_phrase: He was holding an incense burner, intending to burn incense.
  preserved_meaning: Uzziah held the ritual vessel for the purpose of burning incense.
  reasoning_layer_used: Lexical decisions for מִקְטֶרֶת and the purpose infinitive לְהַקְטִיר.
  rationale: “Incense burner” explains “censer,” while “intending” preserves the purpose of his action.
- pob_phrase: leprosy broke out on his forehead before the priests
  simplified_phrase: a skin disease suddenly broke out on his forehead in their sight
  preserved_meaning: The serious skin affliction appeared abruptly and visibly before the priests.
  reasoning_layer_used: Lexical and theological decisions for צָרַעַת, זָרְחָה, and לִפְנֵי הַכֹּהֲנִים.
  rationale: The wording avoids a false modern diagnosis while clearly conveying the sudden visible outbreak.
- pob_phrase: in the house of Yahweh, beside the altar of incense
  simplified_phrase: inside Yahweh’s temple, beside the altar of incense
  preserved_meaning: The event occurred in Yahweh’s sanctuary near the incense altar.
  reasoning_layer_used: Lexical decisions for בְּבֵית יְהוָה and מֵעַל לְמִזְבַּח הַקְּטֹרֶת.
  rationale: “Temple” makes the intended meaning of “house” immediately clear.
