translation:
  language: en
  text: In Jerusalem, he made devices designed by skilled craftsmen. They were placed on the towers and corners of the fortifications to shoot arrows and hurl large stones. His fame spread far and wide because he received extraordinary help until he became strong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verse does not say who helped him, though the surrounding context suggests that God did.
    reason: alternative_reading
