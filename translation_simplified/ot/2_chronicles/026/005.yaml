translation:
  language: en
  text: He kept seeking God during Zechariah’s lifetime. Zechariah understood visions of God.[a] As long as he sought Yahweh, God gave him success.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult. It may instead mean that Zechariah understood the fear of God, or that he taught others to fear God.
    reason: alternative_reading
