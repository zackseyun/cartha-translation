translation:
  language: en
  text: King Uzziah remained leprous[a] until he died. He lived in a separate house because he was cut off from Yahweh’s house—the temple. His son Jotham took charge of the royal household and administered justice among the people of the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The biblical term covers a range of serious skin diseases and does not necessarily mean modern clinical leprosy.
    reason: cultural_note
