- pob_phrase: until the day of his death
  simplified_phrase: until he died
  preserved_meaning: Uzziah’s condition continued for the rest of his life.
  reasoning_layer_used: POB narrative rendering
  rationale: The shorter clause states the same duration in ordinary English.
- pob_phrase: was over the king’s house
  simplified_phrase: took charge of the royal household
  preserved_meaning: Jotham assumed administrative oversight of the king’s household.
  reasoning_layer_used: POB lexical decision for עַל בֵּית הַמֶּלֶךְ
  rationale: This replaces the Hebrew idiom with its clear administrative sense.
- pob_phrase: judging the people of the land
  simplified_phrase: administered justice among the people of the land
  preserved_meaning: Jotham exercised judicial authority for the people.
  reasoning_layer_used: POB lexical decision for שׁוֹפֵט
  rationale: This avoids the misleading impression that Jotham merely condemned people.
