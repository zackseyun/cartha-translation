translation:
  language: en
  text: Uzziah slept in death with his fathers. They buried him with his fathers in the burial field belonging to the kings, because they said, “He was a leper.”[a] Then his son Jotham reigned in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may refer to a skin disease broader than modern leprosy.
    reason: lexical_alternative
