translation:
  language: en
  text: Yahweh God, do not reject your anointed one.[a] Remember the steadfast love you showed David, your servant.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “do not turn away the face of your anointed one”; here the anointed one is the king, though the wording can also carry messianic resonance.
    reason: simplification_note
  - marker: b
    text: This may also be rendered “remember your covenant faithfulness to David” or “remember the mercies shown to David.”
    reason: lexical_alternative
