  preserved_meaning: God is asked not to refuse or dismiss his chosen royal representative.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The clearer idiomatic meaning is placed in the text while the Hebrew face image is retained in a footnote.
- pob_phrase: the steadfast love shown to David your servant
  simplified_phrase: the steadfast love you showed David, your servant
  preserved_meaning: The prayer appeals to God’s loyal, covenantal love toward David.
  reasoning_layer_used: POB lexical and theological decisions on חַסְדֵי
  rationale: An active clause makes God’s role and David’s status easier to understand.
