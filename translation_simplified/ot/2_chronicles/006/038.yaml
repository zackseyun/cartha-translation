translation:
  language: en
  text: and while they are captives in the land where they were taken captive, they return to you[a] with all their heart and soul and pray toward their land, which you gave to their ancestors, toward the city you have chosen, and toward the house—the temple—I built for your name,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “turn back to you”; in this context, returning to God includes repentance.
    reason: lexical_alternative
