  preserved_meaning: They pray from the foreign land where they are held as captives.
  reasoning_layer_used: POB lexical decisions for בְּאֶרֶץ שִׁבְיָם and אֲשֶׁר שָׁבוּ אֹתָם
  rationale: The recast removes the abstract phrase while retaining the explicit captivity setting.
- pob_phrase: with all their heart and with all their soul
  simplified_phrase: with all their heart and soul
  preserved_meaning: They return to God with complete inner devotion and their whole being.
  reasoning_layer_used: POB lexical decisions for בְּכָל לִבָּם and וּבְכָל נַפְשָׁם
  rationale: The familiar combined expression is shorter while preserving both source ideas.
- pob_phrase: the house that I have built for your name
  simplified_phrase: the house—the temple—I built for your name
  preserved_meaning: Solomon refers to the temple as the house dedicated to God’s name.
  reasoning_layer_used: POB lexical decision for בַּיִת and its stated temple referent
  rationale: The apposition explains “house” while retaining its theological image.
