translation:
  language: en
  text: But will God truly make his home with man[a] on earth? Look—even heaven and the highest heaven cannot hold you. This house I have built certainly cannot!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” represents all humanity.
