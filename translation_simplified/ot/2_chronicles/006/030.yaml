translation:
  language: en
  text: Then may you hear from heaven, your dwelling place. Forgive, and give each man what all his ways deserve, for you know his heart. You alone know the hearts of the sons of man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of man” means all human beings; the Hebrew expression is representative and may also be translated “humankind” or “the children of humanity.”
    reason: lexical_alternative
