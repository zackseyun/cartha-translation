translation:
  language: en
  text: 'Then hear from heaven and act. Judge your servants: make the wicked person bear the consequences of his own conduct—bring his deeds back on his own head. Declare the righteous person to be in the right, and give him what is due according to his righteousness.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: judge your servants, repaying the wicked
  simplified_phrase: 'Judge your servants: make the wicked person bear the consequences'
  preserved_meaning: God acts as judge and repays the wicked for his conduct.
  reasoning_layer_used: Lexical and theological decisions on forensic judgment and requital
  rationale: The colon makes the two judicial outcomes easier to follow.
- pob_phrase: bringing his way upon his own head
  simplified_phrase: bring his deeds back on his own head
  preserved_meaning: The offender's own conduct returns upon him in judgment.
  reasoning_layer_used: Lexical rationale and cultural note on the Hebrew idiom
  rationale: “Deeds back” clarifies “way” while preserving the force of the head image.
- pob_phrase: vindicating the righteous by giving to him according to his righteousness
  simplified_phrase: Declare the righteous person to be in the right, and give him what is due according to his righteousness
  preserved_meaning: God judicially recognizes the righteous person as right and treats him accordingly.
  reasoning_layer_used: Lexical and theological decisions on the forensic sense of הצדיק
  rationale: The plain wording explains “vindicating” without importing later doctrinal associations.
interpretive_expansions:
- pob_phrase: repaying the wicked
  rendering: make the wicked person bear the consequences of his own conduct
  claim: Repayment means that the wicked person's conduct returns upon him in judgment.
  evidence:
  - The lexical rationale identifies שוב as judicial requital.
  - The following head idiom portrays consequences returning to the offender.
  confidence: high
  alternatives_preserved:
  - repaying the wicked
- pob_phrase: vindicating the righteous
  rendering: Declare the righteous person to be in the right
  claim: Vindication here is a forensic declaration or treatment of someone as being in the right.
  evidence:
  - The lexical decision identifies הצדיק as a courtroom term.
  - The paired outcomes for the wicked and righteous establish a judicial setting.
  confidence: high
  alternatives_preserved:
  - vindicating the righteous
  - justifying the righteous
translation_notes:
  risk_flags:
