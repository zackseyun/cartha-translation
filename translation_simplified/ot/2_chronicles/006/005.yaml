  text: Ever since I brought my people out of Egypt, I have not chosen a city from any of Israel’s tribes as the place to build a house[a] for my name to be there. Nor have I chosen a man to rule over my people Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “House” means the temple, but the Hebrew text uses the word “house.”
    reason: simplification_note
