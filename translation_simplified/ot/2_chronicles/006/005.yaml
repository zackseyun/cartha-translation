  preserved_meaning: God’s statement covers the whole period from the exodus to the present moment in the verse.
  reasoning_layer_used: Lexical decision for the temporal expression and Hebrew perfects
  rationale: “Ever since” expresses the continuing time frame in natural modern English.
- pob_phrase: to build a house for my name to be there
  simplified_phrase: as the place to build a house for my name to be there
  preserved_meaning: God had not selected a city for the sanctuary associated with his name.
  reasoning_layer_used: Lexical and theological decisions on “house” and divine name-presence
  rationale: The added phrase clarifies the city’s role while retaining the text’s covenantal wording.
- pob_phrase: nor have I chosen a man to be ruler over my people Israel
  simplified_phrase: Nor have I chosen a man to rule over my people Israel.
  preserved_meaning: God had not selected an individual male ruler over Israel.
  reasoning_layer_used: Lexical and theological decisions on אִישׁ and נָגִיד
  rationale: The verb “rule” is more direct while preserving male reference and governing authority.
