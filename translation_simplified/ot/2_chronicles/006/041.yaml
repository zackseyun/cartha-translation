translation:
  language: en
  text: Now rise, Yahweh God, to your resting place, together with the ark of your strength. May your priests, Yahweh God, wear salvation like clothing. May your faithful people rejoice in what is good.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rejoice in your goodness.” The Hebrew does not explicitly say “your.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you and the ark of your strength
  simplified_phrase: together with the ark of your strength
  preserved_meaning: Yahweh and the ark are both included in the call to the resting place.
  reasoning_layer_used: lexical decision and temple context
  rationale: “Together with” makes the relationship clear without weakening the ark’s association with divine strength.
- pob_phrase: be clothed with salvation
  simplified_phrase: wear salvation like clothing
  preserved_meaning: Salvation is pictured as clothing worn by the priests.
  reasoning_layer_used: lexical decision
  rationale: The concrete comparison explains the biblical image while preserving its full force.
- pob_phrase: your faithful ones
  simplified_phrase: your faithful people
  preserved_meaning: These are people marked by covenant faithfulness and loyalty.
  reasoning_layer_used: lexical decision
  rationale: “Faithful people” is more natural common English and avoids later overtones of “saints.”
translation_notes:
  risk_flags:
  - risk: “What is good” may be understood broadly rather than specifically as Yahweh’s goodness.
    mitigation: The footnote preserves the plausible God-centered reading without adding a possessive absent from the Hebrew.
  - risk: “Ark of your strength” remains an unfamiliar biblical expression.
    mitigation: The phrase is retained because replacing it could weaken the source-language image linking the ark with Yahweh’s strength.
