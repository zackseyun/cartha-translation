translation:
  language: en
  text: May your eyes remain open toward this temple day and night[a]—the place where you said you would put your name.[b] Hear the prayer your servant prays toward this place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your eyes remain open” pictures God’s constant, watchful attention.
    reason: lexical_alternative
  - marker: b
    text: “Put your name” means that God chose to associate himself with this place, not that he was contained there.
    reason: cultural_note
