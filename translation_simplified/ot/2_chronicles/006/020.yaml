  simplified_phrase: May your eyes remain open toward this temple day and night
  preserved_meaning: Solomon asks for God’s continual watchful attention toward the temple.
  reasoning_layer_used: Lexical and theological decisions on the open-eyes image and the day-and-night expression.
  rationale: The direct request is easier to follow while preserving the concrete image.
- pob_phrase: toward the place where you said you would put your name
  simplified_phrase: the place where you said you would put your name
  preserved_meaning: The temple is the place God chose to associate with his name.
  reasoning_layer_used: The temple-theology decision retaining the key name idiom.
  rationale: The dash avoids awkward repetition without weakening the temple idiom.
- pob_phrase: to hear the prayer that your servant prays toward this place
  simplified_phrase: Hear the prayer your servant prays toward this place
  preserved_meaning: Solomon asks God to hear the prayer directed toward the temple.
  reasoning_layer_used: Lexical decisions for hear, prayer, servant, and directional toward.
  rationale: The direct request removes a dense clause while keeping prayer as the object heard.
