simplification_decisions:
- pob_phrase: in the land where they were taken captive ... in the land of their captivity
  simplified_phrase: there in the land where they are held captive
  preserved_meaning: They recognize their wrong and pray while still captive in a foreign land.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Combining the repeated location makes the sentence easier to follow without removing the exile setting.
- pob_phrase: we have acted perversely
  simplified_phrase: We have done what is twisted
  preserved_meaning: They confess conduct that is morally crooked or distorted.
  reasoning_layer_used: POB lexical decision for הֶעֱוִינוּ
  rationale: “Twisted” is more familiar than “perversely” and preserves the source image of crooked behavior.
- pob_phrase: and turn back and plead with you
  simplified_phrase: turn back, and plead with you
  preserved_meaning: Their change of direction and their urgent appeal to God remain distinct actions.
  reasoning_layer_used: POB theological and lexical decisions
  rationale: The wording stays simple while retaining “turn back” rather than narrowing it to “repent.”
