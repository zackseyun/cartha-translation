translation:
  language: en
  text: When they sin against you—as everyone does—and you are angry with them, you hand them over to an enemy, and their captors take them away as prisoners to a land near or far,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for there is no one who does not sin
  simplified_phrase: as everyone does
  preserved_meaning: Every human being sins.
  reasoning_layer_used: Lexical and theological decisions on generic אָדָם
  rationale: The positive wording states the same universal truth more directly.
- pob_phrase: their captors carry them away
  simplified_phrase: their captors take them away as prisoners
  preserved_meaning: The enemy removes them from their land and holds them captive.
  reasoning_layer_used: Lexical decision on וְשָׁבוּם שׁוֹבֵיהֶם
  rationale: Adding “as prisoners” makes the captivity clear in common English.
- pob_phrase: to a land far or near
  simplified_phrase: to a land near or far
  preserved_meaning: The place of captivity may be nearby or distant.
  reasoning_layer_used: Lexical decision on אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  rationale: The reordered pair sounds natural while keeping the full contrast.
translation_notes:
  risk_flags:
  - risk: “As everyone does” does not preserve the representative singular form of אָדָם.
    mitigation: It preserves the POB’s controlling meaning that the statement applies to all humanity.
