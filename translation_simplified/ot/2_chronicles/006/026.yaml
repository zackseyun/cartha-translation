translation:
  language: en
  text: When the heavens are shut up and no rain falls because they have sinned against you, and they pray toward this place, acknowledge your name, and turn away from their sin when you humble them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when you afflict them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and there is no rain
  simplified_phrase: and no rain falls
  preserved_meaning: The closed heavens result in drought.
  reasoning_layer_used: POB lexical decision for וְלֹא יִהְיֶה מָטָר
  rationale: This expresses the same result in more natural English.
- pob_phrase: and confess your name
  simplified_phrase: acknowledge your name
  preserved_meaning: They openly recognize God and his revealed character.
  reasoning_layer_used: POB translation and lexical range for וְהוֹדוּ אֶת שְׁמֶךָ
  rationale: This avoids suggesting that they admit wrongdoing by God’s name.
- pob_phrase: and turn from their sin
  simplified_phrase: and turn away from their sin
  preserved_meaning: They abandon the sin they committed.
  reasoning_layer_used: POB lexical decision for מֵחַטָּאתָם יְשׁוּבוּן
  rationale: This makes the repentance image immediately clear.
translation_notes:
  risk_flags:
  - risk: “Acknowledge” is broader than the POB wording “confess.”
    mitigation: It preserves recognition of God’s name without selecting the separately documented thanksgiving sense.
  - risk: The final verb was previously read as “answer,” but its Piel form supports “humble” or “afflict.”
    mitigation: The main text uses “humble,” and the footnote preserves “afflict” as the lexical alternative.
