translation:
  language: en
  text: If there is famine in the land or a plague; if crops are damaged by blight, mildew, locusts, or caterpillars[a]; if enemies besiege any city in the land[b]; or if any other plague or sickness comes—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word refers to a crop-devouring insect, possibly another kind of locust; the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally “in the land of his gates”; gates represent the fortified cities or towns of the land.
    reason: cultural_note
