  preserved_meaning: These are agricultural disasters that harm crops.
  reasoning_layer_used: Lexical decisions for שִׁדָּפוֹן, יֵרָקוֹן, אַרְבֶּה, and חָסִיל
  rationale: Naming the affected crops clarifies the list without implying total destruction.
- pob_phrase: if his enemies besiege him in the land of his gates
  simplified_phrase: if enemies besiege any city in the land
  preserved_meaning: Enemy forces surround cities or towns within the land.
  reasoning_layer_used: Lexical decisions for כִּי יָצַר לוֹ אֹיְבָיו and בְּאֶרֶץ שְׁעָרָיו
  rationale: The main text gives the meaning of the gate image while the note preserves it.
- pob_phrase: whatever plague and whatever sickness there may be
  simplified_phrase: if any other plague or sickness comes
  preserved_meaning: The prayer includes every kind of severe affliction and disease.
  reasoning_layer_used: Lexical decisions for כָּל נֶגַע and כָל מַחֲלָה
  rationale: Natural clause structure preserves the broad scope of both terms.
