translation:
  language: en
  text: Yahweh has fulfilled the word he spoke. I have succeeded my father David and now sit on Israel’s throne, just as Yahweh said. I have built the temple as a house for the name of Yahweh, the God of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A house for the name of Yahweh” means that the temple was dedicated to Yahweh and associated with his name. It does not mean that the temple could contain him.
    reason: simplification_note
