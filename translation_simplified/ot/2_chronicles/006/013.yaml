    text: The Hebrew word usually means “basin” or “laver,” but here it describes a raised structure Solomon could stand on.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: five cubits long, five cubits wide, and three cubits high; approximately 2.3 by 2.3 by 1.4 meters.'
    reason: cultural_note
