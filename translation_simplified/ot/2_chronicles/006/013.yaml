  text: Solomon had made a bronze platform[a] and placed it in the middle of the Temple courtyard. It was about seven and a half feet long, seven and a half feet wide, and four and a half feet high.[b] He stood on it. Then, before the whole assembly of Israel, he knelt and spread out his hands toward heaven.
