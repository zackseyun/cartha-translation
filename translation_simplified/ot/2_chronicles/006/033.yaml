  text: Then hear from heaven, your dwelling place, and do everything the foreigner asks of you, so that all the peoples of the earth may know your name and fear you, as your people Israel do. May they also know that this house I have built bears your name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “your name is called upon this house.”
    reason: lexical_alternative
