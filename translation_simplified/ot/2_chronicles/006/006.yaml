translation:
  language: en
  text: But I have chosen[a] Jerusalem as the place where my name is to be[b]. I have also chosen David to have authority over my people Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I chose.” The Hebrew can describe a past choice; “have chosen” emphasizes that the choice still stands.
    reason: lexical_alternative
  - marker: b
    text: “My name” is a temple expression pointing to God’s presence, reputation, and covenant claim while preserving the Hebrew image.
    reason: source_note
simplification_decisions:
- pob_phrase: Jerusalem for my name to be there
  simplified_phrase: Jerusalem as the place where my name is to be
  preserved_meaning: God designated Jerusalem as the location for his name without imposing a future-only sense.
  reasoning_layer_used: Lexical and theological decisions on לִהְיוֹת, שְׁמִי, and שָׁם
  rationale: This recasts the purpose clause naturally while retaining “my name” and its designated location.
- pob_phrase: David to be over my people Israel
  simplified_phrase: David to have authority over my people Israel
  preserved_meaning: David was chosen for authority over God’s covenant people.
  reasoning_layer_used: Lexical and theological decisions on עַל and עַמִּי יִשְׂרָאֵל
  rationale: “Have authority over” clarifies the relationship without adding the title “king.”
interpretive_expansions:
- pob_phrase: Jerusalem for my name to be there
  rendering: Jerusalem as the place where my name is to be
  claim: Jerusalem is explicitly identified as the designated location for God’s name.
  evidence:
  - The infinitive לִהְיוֹת expresses purpose or result.
  - The adverb שָׁם explicitly marks location.
  confidence: high
  alternatives_preserved:
  - so that my name would be there
  - for my name to be there
- pob_phrase: to be over my people Israel
  rendering: to have authority over my people Israel
  claim: Being “over” Israel denotes authority without specifying a royal title.
  evidence:
  - The POB lexical decision states that עַל marks authority.
  - The POB theological decision avoids adding “king” or “rule.”
  confidence: high
  alternatives_preserved:
  - to be over my people Israel
translation_notes:
  risk_flags:
  - risk: “My name” may remain unfamiliar to readers.
    mitigation: Footnote [b] explains the temple expression while the main text preserves the Hebrew image.
  - risk: “Is to be” may sound formal to some readers.
    mitigation: The wording clearly expresses divine designation without introducing a future-only meaning.
