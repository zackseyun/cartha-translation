translation:
  language: en
  text: He said, “Yahweh, God of Israel, there is no God like you anywhere in heaven or on earth. You keep your covenant and show steadfast love[a] to your servants, who live in your presence with all their heart.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “show covenant faithfulness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he said
  simplified_phrase: He said
  preserved_meaning: The words continue the narrative and introduce the prayer.
  reasoning_layer_used: Lexical decision for וַיֹּאמַר
  rationale: Dropping “And” gives natural modern English without changing the narrative function.
- pob_phrase: there is no God like you in heaven or on earth
  simplified_phrase: there is no God like you anywhere in heaven or on earth
  preserved_meaning: Yahweh is incomparable throughout heaven and earth.
  reasoning_layer_used: Lexical decision for בַּשָּׁמַיִם וּבָאָרֶץ
  rationale: “Anywhere” makes the expression’s total scope immediately clear.
- pob_phrase: keeping the covenant and the steadfast love for your servants who walk before you with all their heart
  simplified_phrase: You keep your covenant and show steadfast love to your servants, who live in your presence with all their heart
  preserved_meaning: Yahweh faithfully maintains his covenant and love toward servants who live before him with wholehearted devotion.
  reasoning_layer_used: Lexical decisions for שֹׁמֵר, הַחֶסֶד, and הַהֹלְכִים לְפָנֶיךָ
  rationale: Two direct clauses and a clear idiom make the meaning easier to follow.
