  confidence: high
  alternatives_preserved:
  - who walk before you
  - who live before you
  - who walk in your presence
translation_notes:
  risk_flags:
  - risk: Replacing “walk before you” removes the walking metaphor.
    mitigation: “Live in your presence” preserves the audit-supported meaning without adding the unsupported idea of following.
