translation:
  language: en
  text: If your people Israel are defeated by an enemy because they have sinned against you, but then they turn back to you, give thanks to your name,[a] and pray in this house, pleading for your favor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “confess your name” or “praise your name.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: are struck down before an enemy
  simplified_phrase: are defeated by an enemy
  preserved_meaning: Israel suffers defeat under an enemy's power in battle.
  reasoning_layer_used: Lexical decision for יִנָּגֵף and לִפְנֵי אוֹיֵב
  rationale: The clearer military wording preserves the result and passive force of the Hebrew idiom.
- pob_phrase: and they turn back and give thanks
  simplified_phrase: but then they turn back to you, give thanks
  preserved_meaning: After sin and defeat, Israel returns toward God and acknowledges his name.
  reasoning_layer_used: Theological decision for וְשָׁבוּ and lexical decision for וְהוֹדוּ
  rationale: The contrast and shorter clause sequence make the covenant return easier to follow without reducing it to the technical term “repent.”
- pob_phrase: pray and plead for favor before you in this house
  simplified_phrase: pray in this house, pleading for your favor
  preserved_meaning: Israel addresses God from the temple and earnestly seeks his gracious favor.
  reasoning_layer_used: Lexical decisions for וְהִתְפַּלְלוּ, וְהִתְחַנְּנוּ, לְפָנֶיךָ, and בַּבַּיִת הַזֶּה
  rationale: Ordinary English clause order removes the repeated prayer orientation while retaining the place and request.
interpretive_expansions:
- pob_phrase: they turn back
  rendering: they turn back to you
  claim: Their return is directed toward God in covenant restoration.
  evidence:
  - The verse addresses God and says Israel has sinned against him.
  - The POB theological rationale identifies covenant restoration while preserving the broader return image.
  confidence: high
