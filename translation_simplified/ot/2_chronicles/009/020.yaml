translation:
  language: en
  text: All King Solomon’s cups and other drinking containers were made of gold. All the items in the House of the Forest of Lebanon[a] were made of pure gold. Silver was considered to have no value during Solomon’s time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The House of the Forest of Lebanon was a royal building. Or, “the palace of the Forest of Lebanon.”
    reason: lexical_alternative
