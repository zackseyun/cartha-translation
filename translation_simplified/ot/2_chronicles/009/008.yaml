translation:
  language: en
  text: Blessed be Yahweh your God! He delighted in you and placed you on his throne to rule as king on his behalf. Because your God loved Israel and intended to establish them forever,[a] he made you their king so that you would govern with justice and righteousness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also connect “to establish them forever” directly with God’s making Solomon king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: set you on his throne as king for Yahweh your God
  simplified_phrase: placed you on his throne to rule as king on his behalf
  preserved_meaning: Solomon rules on God's throne as God's representative.
  reasoning_layer_used: lexical and theological decisions on throne and kingship
  rationale: “On his behalf” makes the representative role clear while retaining God’s throne.
- pob_phrase: he made you king over them
  simplified_phrase: he made you their king
  preserved_meaning: God appointed Solomon to rule Israel.
  reasoning_layer_used: lexical decision on royal appointment
  rationale: The possessive form is shorter and natural without weakening the appointment.
- pob_phrase: to administer justice and righteousness
  simplified_phrase: so that you would govern with justice and righteousness
  preserved_meaning: The king must rule through just judgment and right order.
  reasoning_layer_used: lexical and theological decisions on the royal formula
  rationale: “Govern with” explains the royal task while preserving both key nouns.
