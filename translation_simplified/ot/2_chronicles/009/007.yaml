  reasoning_layer_used: POB cultural note and lexical rationale for הָעֹמְדִים לְפָנֶיךָ and תָּמִיד
  rationale: The court expression is stated directly, and “regularly” avoids implying unbroken physical presence.
- pob_phrase: and hear your wisdom
