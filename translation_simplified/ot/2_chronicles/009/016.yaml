translation:
  language: en
  text: He also made three hundred shields. Each shield had three hundred shekels’ weight of gold hammered thin and applied to it.[a] The king placed the shields in the royal building called the House of the Forest of Lebanon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “three hundred gold” without naming the unit; “shekels” is supplied from the parallel in 1 Kings 10:17.
    reason: source_note
  - marker: b
    text: The House of the Forest of Lebanon was the name of a royal building. Or, “the palace of the Forest of Lebanon.”
    reason: lexical_alternative
