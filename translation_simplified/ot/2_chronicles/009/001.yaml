  text: The queen of Sheba heard of Solomon’s fame. She came to Jerusalem to test him with riddles. A very large group traveled with her, along with camels carrying spices, a great amount of gold, and precious stones. When she came to Solomon, she spoke with him about everything that was on her mind.
