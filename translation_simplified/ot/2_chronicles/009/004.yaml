translation:
  language: en
  text: She saw the food served at his table, the seating arrangement for his officials, how his royal attendants stood ready to serve and how they were dressed, his cupbearers and their clothing, and the stairway he used to go up to the house of Yahweh.[a] She was so astonished that she was left breathless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, following the parallel in 1 Kings 10:5, “the burnt offering he offered at the house of Yahweh.” The Hebrew here most naturally refers to a stairway or ascent.
    reason: alternative_reading
