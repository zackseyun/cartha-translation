translation:
  language: en
  text: Then she gave the king an enormous amount of gold—120 talents—along with a great quantity of spices and precious stones. Never before had there been spices like those the queen of Sheba gave King Solomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Never again were there spices like those the queen of Sheba gave King Solomon.” The Hebrew may refer to the time before her gift or, more broadly, to Israel’s later memory of it.
    reason: lexical_alternative
