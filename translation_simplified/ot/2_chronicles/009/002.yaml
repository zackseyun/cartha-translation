translation:
  language: en
  text: Solomon answered every question she asked.[a] Nothing she raised remained hidden from his understanding; he explained it all to her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “all her words” or “all the matters she raised.”
    reason: lexical_alternative
