translation:
  language: en
  text: 'Then Jehoram received a letter from the prophet Elijah. It said, “This is what Yahweh, the God of your ancestor David, says: Because you have not followed the way of life of your father Jehoshaphat or of King Asa of Judah,”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then a letter came to him from Elijah the prophet, saying
  simplified_phrase: Then Jehoram received a letter from the prophet Elijah. It said
  preserved_meaning: A written message from Elijah reached Jehoram and introduced the quotation.
  reasoning_layer_used: POB lexical decisions and narrative context
  rationale: Two direct sentences replace the awkward participial introduction.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The formal prophetic message is presented as Yahweh’s own declaration.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The approved modern formula retains Yahweh’s personal name and prophetic authority.
- pob_phrase: you have not walked in the ways of
  simplified_phrase: you have not followed the way of life of
  preserved_meaning: Jehoram failed to follow the conduct modeled by his faithful predecessors.
  reasoning_layer_used: POB lexical rationale for the walking metaphor
  rationale: The wording explains the conduct metaphor while preserving its path-of-life image.
interpretive_expansions:
- pob_phrase: David your father
  rendering: your ancestor David
  claim: Father refers here to David as Jehoram’s dynastic ancestor, not his immediate parent.
  evidence:
  - The POB lexical rationale identifies the phrase as dynastic ancestry in this context.
  confidence: high
  alternatives_preserved:
  - the God of David your father
  - the God of your father David
translation_notes:
  risk_flags:
  - risk: Replacing “father” with “ancestor” for David makes the dynastic sense explicit.
    mitigation: The immediate father-son wording for Jehoshaphat remains unchanged.
