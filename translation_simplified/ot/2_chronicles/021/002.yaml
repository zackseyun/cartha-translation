translation:
  language: en
  text: 'He had these brothers, who were also sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu,[a] Michael, and Shephatiah. All of them were sons of Jehoshaphat, king of Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew spells this name differently from the first Azariah, so it is written here as “Azariahu.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “king of Israel.” Jehoshaphat is usually identified as king of Judah, but Chronicles may use “Israel” here in a broader sense for the covenant people.
    reason: source_note
