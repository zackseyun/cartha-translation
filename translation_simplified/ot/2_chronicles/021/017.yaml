translation:
  language: en
  text: They marched against Judah and broke into the land. They carried away all the property they found in the king’s palace, along with his sons and wives. No son was left to him except Jehoahaz,[a] his youngest son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jehoahaz is probably the same person called Ahaziah elsewhere (compare 2 Kings 8:24–26; 2 Chronicles 22:1).
    reason: alternative_reading
simplification_decisions:
- pob_phrase: They came up against Judah and invaded it
  simplified_phrase: They marched against Judah and broke into the land
  preserved_meaning: The enemies advanced against Judah and forced their way into the land.
  reasoning_layer_used: Lexical decisions for וַיַּעֲלוּ בִיהוּדָה and וַיִּבְקָעוּהָ
  rationale: Ordinary military wording preserves both the hostile advance and the breach image.
- pob_phrase: all the possessions found in the king’s house
  simplified_phrase: all the property they found in the king’s palace
  preserved_meaning: The invaders removed all the movable property present in the royal residence.
  reasoning_layer_used: Lexical decisions for כָּל הָרְכוּשׁ and הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  rationale: “Property” and “palace” make the plunder and royal setting immediately clear.
- pob_phrase: so that no son was left to him except Jehoahaz, the youngest of his sons
  simplified_phrase: No son was left to him except Jehoahaz, his youngest son
  preserved_meaning: After the raid, Jehoahaz alone was left to the king among his sons.
  reasoning_layer_used: Lexical and theological decisions for וְלֹא נִשְׁאַר לוֹ בֵּן, כִּי אִם, יְהוֹאָחָז, and קְטֹן בָּנָיו
  rationale: The recast sentence retains the relational phrase and the Masoretic name while stating the exception plainly.
translation_notes:
  risk_flags:
