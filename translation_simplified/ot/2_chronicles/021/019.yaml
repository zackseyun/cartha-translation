translation:
  language: en
  text: His sickness lasted two years. At the end of that time, his internal organs[a] came out of his body because of the sickness, and he died from severe diseases. His people did not honor him with the funeral burning[b] they had held for his ancestors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his intestines”; the Hebrew refers to his inward organs.
    reason: lexical_alternative
  - marker: b
    text: This was likely a ceremony involving the burning of spices or other funeral honors, not the cremation of his body.
    reason: cultural_note
