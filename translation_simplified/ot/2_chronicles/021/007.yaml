- pob_phrase: the house of David
  simplified_phrase: the house of David—David’s royal family line
  preserved_meaning: The biblical expression refers to David’s royal dynasty while retaining the source image of a house.
  reasoning_layer_used: POB lexical decision on בֵּית דָּוִיד
  rationale: The short explanation makes the dynastic idiom immediately clear.
- pob_phrase: and as he had said that he would give to him and to his sons
  simplified_phrase: just as he had said that he would give David and his sons
  preserved_meaning: Yahweh’s prior word remains connected to his decision not to destroy David’s house.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: Naming David resolves the pronouns without breaking the sentence’s logical connection.
- pob_phrase: a lamp for all days
  simplified_phrase: a lamp for all days—a picture of their continuing royal line
  preserved_meaning: The lamp remains as the source metaphor for the enduring Davidic dynasty.
  reasoning_layer_used: POB theological decision on נִיר
  rationale: The image is retained and briefly explained without asserting both lineage and rule as separate meanings.
