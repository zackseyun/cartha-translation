translation:
  language: en
  text: Yet Yahweh was not willing to destroy the house of David—David’s royal family line—because of the covenant he had made with David, just as he had said that he would give David and his sons a lamp for all days—a picture of their continuing royal line.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “for all the days”; this can also be understood as “forever.”
    reason: lexical_alternative
