translation:
  language: en
  text: But you have followed the ways of Israel’s kings. You have led Judah and the people of Jerusalem into sexual immorality,[a] just as Ahab’s dynasty did. You have also killed your own brothers—members of your father’s household—who were better than you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “made Judah and the people of Jerusalem play the prostitute,” a prophetic image for unfaithfulness to God, often through idolatry.
    reason: lexical_alternative
