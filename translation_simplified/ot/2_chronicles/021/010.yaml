translation:
  language: en
  text: So Edom rebelled against Judah’s rule and broke free. It has remained outside Judah’s control to this day.[a] At that time Libnah also rebelled against Jehoram’s rule and broke free, because Jehoram had forsaken Yahweh, the God of his ancestors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says Edom rebelled “from under the hand of Judah,” an image of escaping Judah’s power.
    reason: cultural_note
  - marker: b
    text: The final clause may explain all these troubles or, more narrowly, Libnah’s rebellion.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: rebelled from under the hand of Judah
  simplified_phrase: rebelled against Judah’s rule and broke free
  preserved_meaning: Edom revolted politically and escaped Judah’s control.
  reasoning_layer_used: lexical decision and cultural note
  rationale: The wording explains the Hebrew idiom while retaining the force of rebellion.
- pob_phrase: Libnah also rebelled from under his hand
  simplified_phrase: Libnah also rebelled against Jehoram’s rule and broke free
  preserved_meaning: Libnah likewise revolted and escaped Jehoram’s authority.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming Jehoram makes the pronoun and political relationship clear.
- pob_phrase: the God of his fathers
  simplified_phrase: the God of his ancestors
  preserved_meaning: Yahweh was the covenant God worshiped by Jehoram’s forefathers.
  reasoning_layer_used: lexical decision
  rationale: “Ancestors” communicates the family-line meaning in common English.
interpretive_expansions:
- pob_phrase: his hand ... he had forsaken
  rendering: Jehoram’s rule ... Jehoram had forsaken
  claim: Both pronouns refer to Jehoram.
  evidence:
  - The POB theological rationale identifies the singular subject as Jehoram.
  - The political setting concerns territories escaping Jehoram’s rule.
  confidence: high
