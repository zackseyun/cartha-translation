translation:
  language: en
  text: If disaster strikes us—sword, judgment, plague, or famine—we will stand before this house, your temple, and before you, because your name is in this house.[a] In our distress we will cry out to you, and you will hear us and save us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “your name is upon this house”; that is, this house bears your name.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If disaster comes upon us
  simplified_phrase: If disaster strikes us
  preserved_meaning: A harmful calamity may come upon the people.
  reasoning_layer_used: Lexical decision for רָעָה
  rationale: “Strikes us” expresses the arrival of disaster in direct modern English.
- pob_phrase: pestilence
  simplified_phrase: plague
  preserved_meaning: The disaster may take the form of widespread epidemic disease.
  reasoning_layer_used: Lexical decision for דֶבֶר
  rationale: “Plague” is more familiar while retaining the covenant-disaster sense.
- pob_phrase: and we will cry out to you from our distress
  simplified_phrase: In our distress we will cry out to you
  preserved_meaning: Their urgent appeal to God arises from their affliction.
  reasoning_layer_used: Lexical decisions for וְנִזְעַק and מִצָּרָתֵנוּ
  rationale: The reordered clause is natural English and keeps the prayer urgent.
