translation:
  language: en
  text: They came to Yahweh’s house in Jerusalem with harps[a], lyres, and trumpets.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of ancient stringed instrument is uncertain; it may have been more like a lute.
    reason: lexical_alternative
  - marker: b
    text: Yahweh’s house means the temple; the Hebrew expression literally says “the house of Yahweh.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: And they came to Jerusalem ... to the house of Yahweh
  simplified_phrase: They came to Yahweh’s house in Jerusalem
  preserved_meaning: One movement brings them to the worship destination located in Jerusalem.
  reasoning_layer_used: Hebrew syntax and POB lexical decisions for וַיָּבֹאוּ and בֵּית יְהוָה
  rationale: Reordering the destinations avoids adding a second action while making the location clear.
- pob_phrase: with harps and lyres and trumpets
  simplified_phrase: with harps, lyres, and trumpets
  preserved_meaning: All three distinct kinds of instruments remain in the list.
  reasoning_layer_used: POB lexical decisions for the three instrument terms
  rationale: Modern list punctuation improves readability without merging the instruments.
- pob_phrase: the house of Yahweh
  simplified_phrase: Yahweh’s house
  preserved_meaning: The Hebrew house image and the personal divine name are both retained.
  reasoning_layer_used: POB lexical and theological decisions for בֵּית יְהוָה
  rationale: The possessive form is natural English, and the note identifies the house as the temple.
