translation:
  language: en
  text: When they began to sing and praise, Yahweh set ambushes[a] against the Ammonites, the Moabites, and the people from Mount Seir, who were coming to attack Judah. The invaders were struck down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “set ambushers” or “set men in ambush.” The Hebrew can refer to the people lying in ambush or to the ambush itself.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And at the time they began with singing and praise
  simplified_phrase: When they began to sing and praise
  preserved_meaning: Their worship marked the time when Yahweh acted.
  reasoning_layer_used: Lexical decisions for וּבְעֵת, הֵחֵלּוּ, and בְרִנָּה וּתְהִלָּה
  rationale: A direct time clause and active verbs make the opening natural without changing its sequence.
- pob_phrase: the Ammonites, Moab, and Mount Seir
  simplified_phrase: the Ammonites, the Moabites, and the people from Mount Seir
  preserved_meaning: The same three enemy groups are identified.
  reasoning_layer_used: Lexical decision for בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  rationale: People-based wording prevents readers from mistaking the place names for land being ambushed.
- pob_phrase: and they were struck down
  simplified_phrase: The invaders were struck down
  preserved_meaning: The hostile coalition suffered the sudden defeat.
  reasoning_layer_used: Lexical decision for וַיִּנָּגֵפוּ and immediate military context
  rationale: Naming the pronoun’s referent removes confusion while retaining the forceful passive image.
interpretive_expansions:
- pob_phrase: who were coming against Judah
  rendering: who were coming to attack Judah
  claim: Their movement toward Judah was a hostile invasion.
  evidence:
  - The POB lexical rationale says the invasion context makes the hostile sense explicit.
  - The immediate verse describes military action against these groups.
  confidence: high
  alternatives_preserved:
  - who were coming against Judah
  - who were coming to Judah
translation_notes:
  risk_flags:
  - risk: “Ambushes” may suggest ordinary human troops even though the Hebrew does not specify the agents.
    mitigation: The footnote preserves the lexical ambiguity between ambushes and ambushers.
