translation:
  language: en
  text: Then they came and told Jehoshaphat, “A huge force is coming to attack you from across the sea, from Aram.[a] They are now at Hazazon-tamar, also called En-gedi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is the Hebrew place-name often rendered “Syria.”
    reason: lexical_alternative
