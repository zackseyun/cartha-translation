translation:
  language: en
  text: They got up early in the morning and went to the wilderness of Tekoa. As they were setting out, Jehoshaphat stood and said, “Listen to me, people of Judah and people of Jerusalem! Believe in Yahweh your God, and you will stand firm.[a] Believe in his prophets, and you will succeed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses related words for “believe” and “stand firm,” creating a wordplay.
    reason: source_note
