  preserved_meaning: They rose early that morning.
  reasoning_layer_used: Lexical decisions for וַיַּשְׁכִּימוּ and בַבֹּקֶר
  rationale: “Got up” is more common than “rose” without adding a sequence not stated in Hebrew.
- pob_phrase: Judah and inhabitants of Jerusalem
  simplified_phrase: people of Judah and people of Jerusalem
  preserved_meaning: Jehoshaphat addresses Judah and Jerusalem’s residents as distinct groups.
  reasoning_layer_used: Lexical decisions for יְהוּדָה and וְיֹשְׁבֵי יְרוּשָׁלַם
  rationale: The repeated “people of” is clear while preserving the two-part address.
- pob_phrase: you will be established
  simplified_phrase: you will stand firm
  preserved_meaning: Reliance on Yahweh will give the people firmness in the coming crisis.
  reasoning_layer_used: Lexical and theological decisions on אמן
  rationale: “Stand firm” clearly preserves the Hebrew firmness image and is a documented POB alternative.
