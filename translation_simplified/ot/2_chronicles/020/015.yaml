- pob_phrase: all Judah and inhabitants of Jerusalem
  simplified_phrase: all you people of Judah, residents of Jerusalem
  preserved_meaning: Everyone from Judah and those living in Jerusalem are directly addressed.
  reasoning_layer_used: POB lexical decisions
  rationale: The wording makes the collective address natural and replaces formal “inhabitants” with “residents.”
- pob_phrase: Thus says Yahweh to you
  simplified_phrase: This is what Yahweh says to you
  preserved_meaning: The statement remains a prophetic message spoken with Yahweh’s authority.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The standard prophetic formula is expressed in ordinary modern English while retaining Yahweh’s name.
- pob_phrase: Do not fear, and do not be dismayed
  simplified_phrase: Do not be afraid, and do not lose heart
  preserved_meaning: Yahweh forbids both fear and the collapse of courage.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: Two separate commands preserve the Hebrew distinction and additive force.
interpretive_expansions:
- pob_phrase: this great multitude
  rendering: this vast army
  claim: The multitude is the hostile military force confronting Judah.
  evidence:
