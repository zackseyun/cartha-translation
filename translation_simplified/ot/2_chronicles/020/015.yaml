translation:
  language: en
  text: 'He said, “All you people of Judah, residents of Jerusalem, and King Jehoshaphat, listen! This is what Yahweh says to you: ‘Do not be afraid, and do not lose heart because of this vast army. The battle does not belong to you; it belongs to God.’”'
