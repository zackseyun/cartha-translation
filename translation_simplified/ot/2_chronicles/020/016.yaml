translation:
  language: en
  text: Tomorrow, go down and confront them. Look! They are coming up the slope of Ziz. You will find them at the end of the ravine,[a] before the wilderness of Jeruel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean a ravine, valley, or seasonal watercourse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: go down against them
  simplified_phrase: go down and confront them
  preserved_meaning: They must move downward to oppose the approaching army.
  reasoning_layer_used: Lexical decision for רְדוּ עֲלֵיהֶם in its military context.
  rationale: “Confront them” clearly preserves the phrase’s hostile force in plain English.
- pob_phrase: by the ascent of Ziz
  simplified_phrase: up the slope of Ziz
  preserved_meaning: The enemy is approaching by an uphill route associated with Ziz.
  reasoning_layer_used: Lexical decision that מַעֲלֶה denotes an ascent or uphill approach.
  rationale: “Up the slope” keeps the topographical image in familiar language.
- pob_phrase: at the end of the wadi, before the wilderness of Jeruel
  simplified_phrase: at the end of the ravine, before the wilderness of Jeruel
  preserved_meaning: They will encounter the army where the land feature ends in front of the wilderness.
  reasoning_layer_used: Lexical decisions for נחל, סוף, and פני.
  rationale: “Ravine” is more familiar than “wadi,” while the footnote preserves its wider geographic range.
translation_notes:
  risk_flags:
  - risk: “Ravine” may suggest steeper terrain than the Hebrew term requires.
    mitigation: The footnote includes the alternatives “valley” and “seasonal watercourse.”
