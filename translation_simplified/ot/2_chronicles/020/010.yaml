translation:
  language: en
  text: And now, look at the people of Ammon and Moab and the people from Mount Seir! You did not allow Israel to invade them when Israel came out of Egypt. Instead, Israel turned away from them and did not destroy them—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And now, behold
  simplified_phrase: And now, look at
  preserved_meaning: The prayer draws God's attention to the present threat.
  reasoning_layer_used: lexical decision for הִנֵּה
  rationale: “Look at” keeps the Hebrew emphasis in familiar English.
- pob_phrase: the people of Ammon and Moab and Mount Seir
  simplified_phrase: the people of Ammon and Moab and the people from Mount Seir
  preserved_meaning: The wording identifies the hostile peoples while retaining Mount Seir as a place name.
  reasoning_layer_used: POB lexical rationale and lexical alternative
  rationale: Adding “the people from” prevents readers from mistaking Mount Seir itself for a people.
- pob_phrase: whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them
  simplified_phrase: You did not allow Israel to invade them when Israel came out of Egypt. Instead, Israel turned away from them
  preserved_meaning: God prohibited a military incursion, and Israel avoided these peoples during the journey from Egypt.
  reasoning_layer_used: lexical and theological decisions with immediate narrative context
  rationale: “Invade,” repeated “Israel,” and “Instead” clarify the action, pronouns, and logical connection.
interpretive_expansions:
- pob_phrase: enter against
  rendering: invade
  claim: The prohibited entry was military action against these peoples.
  evidence:
  - The POB lexical rationale identifies the phrase as permission for military incursion.
  - Israel's not destroying them confirms the warfare setting.
  confidence: high
  alternatives_preserved:
  - attack
  - enter against
- pob_phrase: Mount Seir
  rendering: the people from Mount Seir
  claim: The prayer concerns people associated with the region of Mount Seir, not the mountain itself acting as a people.
  evidence:
  - The POB footnote offers “those of Mount Seir” as an alternative.
  - The POB lexical rationale says the coordinated phrase names hostile groups and territory.
  confidence: high
  alternatives_preserved:
  - those of Mount Seir
  - Mount Seir
translation_notes:
  risk_flags:
  - risk: “The people from Mount Seir” makes an implied group explicit.
    mitigation: The clarification follows the POB footnote while preserving Mount Seir as the geographic name.
  - risk: “Instead” expresses the clause relation less literally than “for.”
    mitigation: It preserves the explanatory contrast between God's prohibition and Israel's restraint.
