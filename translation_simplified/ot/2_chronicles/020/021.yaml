translation:
  language: en
  text: After consulting with the people, he appointed singers to sing to Yahweh and praise the beauty of holiness.[a] They went out ahead of the advance troops and said, “Give thanks to Yahweh, for his steadfast love[b] endures forever.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the splendor of holiness” or “holy splendor.”
    reason: lexical_alternative
  - marker: b
    text: This means his faithful covenant love and may also be translated “mercy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he appointed singers to Yahweh, who praised
  simplified_phrase: he appointed singers to sing to Yahweh and praise
  preserved_meaning: The singers were appointed to direct their worship and praise to Yahweh.
  reasoning_layer_used: POB lexical decisions for מְשֹׁרֲרִים, לַיהוָה, and וּמְהַלְלִים
  rationale: The infinitives replace an awkward relative clause while keeping singing and praising distinct.
- pob_phrase: the splendor of holiness
  simplified_phrase: the beauty of holiness
  preserved_meaning: Holiness is pictured as beautiful or splendid without resolving the Hebrew phrase too narrowly.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote for לְהַדְרַת קֹדֶשׁ
  rationale: “Beauty” is more familiar than “splendor,” while the footnote preserves the alternatives.
- pob_phrase: before the vanguard
  simplified_phrase: ahead of the advance troops
  preserved_meaning: The singers went in front of the armed force leading the army.
  reasoning_layer_used: POB lexical decision for לִפְנֵי הֶחָלוּץ
  rationale: “Advance troops” communicates the military role more clearly than “vanguard.”
translation_notes:
  risk_flags:
  - risk: “Beauty of holiness” may suggest an abstract quality rather than holy splendor connected with God or worship.
    mitigation: The footnote retains both POB alternatives and leaves the relationship open.
