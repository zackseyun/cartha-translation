translation:
  language: en
  text: Jahaziel was the son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah. He was a Levite from among the descendants of Asaph. While he was among the gathered people, the Spirit of Yahweh came upon him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite
  simplified_phrase: Jahaziel was the son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah. He was a Levite
  preserved_meaning: The full named lineage and Jahaziel's identity as a Levite remain intact.
  reasoning_layer_used: POB lexical decisions on the repeated genealogy and “the Levite”
  rationale: Two sentences make the long identification easier to follow without shortening the genealogy.
- pob_phrase: from the sons of Asaph
  simplified_phrase: from among the descendants of Asaph
  preserved_meaning: Jahaziel belonged to Asaph's corporate family line.
  reasoning_layer_used: POB lexical rationale identifying clan or guild affiliation
  rationale: “Descendants” makes the lineage sense of “sons” clear to modern readers.
- pob_phrase: in the midst of the assembly
  simplified_phrase: while he was among the gathered people
  preserved_meaning: The Spirit came upon Jahaziel as he was present within the public gathering.
  reasoning_layer_used: POB lexical rationale on the spatial force and public gathered context
  rationale: The revised wording replaces formal church language with a direct description of the scene.
translation_notes:
  risk_flags:
  - risk: Recasting “sons of Asaph” as “descendants of Asaph” may sound purely genealogical rather than corporate.
    mitigation: “From among” preserves Jahaziel's membership in the identified group.
