  text: 'Then Eliezer son of Dodavahu, from Mareshah, spoke this prophecy against Jehoshaphat: “Because you joined with Ahaziah, Yahweh has ruined your shipbuilding project.” So the ships were wrecked and could not sail to Tarshish.'
