translation:
  language: en
  text: You will not have to fight this battle. Take your positions and stand firm. Watch Yahweh bring salvation to you,[a] people of Judah and Jerusalem. Do not be afraid or lose heart. Tomorrow, go out to face them. Yahweh is with you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deliverance.” Here salvation includes rescue in battle but can have a broader meaning.
    reason: lexical_alternative
  - marker: b
    text: Or “Yahweh will be with you.” The Hebrew does not state whether “is” or “will be” is intended.
    reason: lexical_alternative
