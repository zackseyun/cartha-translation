translation:
  language: en
  text: Then the Ammonites and Moabites attacked the people of Mount Seir. They devoted them to destruction[a] and wiped them out. When they had finished destroying the people of Seir, they helped destroy one another.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “put them under the ban,” meaning that they were set apart for destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rose up against the inhabitants of Mount Seir
  simplified_phrase: attacked the people of Mount Seir
  preserved_meaning: The Ammonites and Moabites took hostile military action against Seir’s population.
  reasoning_layer_used: Lexical decision for וַיַּעַמְדוּ and יֹשְׁבֵי הַר שֵׂעִיר
  rationale: “Attacked the people” states the military sense in direct, common English.
- pob_phrase: to devote them to destruction and to wipe them out
  simplified_phrase: They devoted them to destruction and wiped them out.
  preserved_meaning: Both the charged ban language and the further destruction verb remain distinct.
  reasoning_layer_used: Lexical and theological decisions for לְהַחֲרִים and וּלְהַשְׁמִיד
  rationale: A separate sentence makes the severe two-part action easier to follow without weakening it.
- pob_phrase: they helped each other to destroy one another
  simplified_phrase: they helped destroy one another
  preserved_meaning: Their mutual action resulted in reciprocal destruction.
  reasoning_layer_used: Lexical decisions for עָזְרוּ אִישׁ בְּרֵעֵהוּ and לְמַשְׁחִית
  rationale: Removing the redundant “each other” keeps the reciprocal meaning through “one another.”
interpretive_expansions:
- pob_phrase: when they had finished with the inhabitants of Seir
  rendering: When they had finished destroying the people of Seir
  claim: What they finished was the destruction of Seir’s people.
  evidence:
  - The preceding verbs explicitly describe devoting them to destruction and wiping them out.
  - The narrative sequence then moves to the allies destroying one another.
  confidence: high
