translation:
  language: en
  text: After that, the Levites prepared food for themselves and for the priests,[a] because the priests, who were descendants of Aaron, were busy offering the burnt offering and the fat portions until night. So the Levites prepared food for themselves and for the priests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “for them,” but the context strongly suggests that the Levites prepared their own food as well as food for the priests.
    reason: lexical_alternative
