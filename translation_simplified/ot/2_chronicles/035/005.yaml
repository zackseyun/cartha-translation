translation:
  language: en
  text: Take your places in the holy place. Arrange yourselves according to the divisions of the ancestral families of your brothers—the sons of the people[a]—and according to the family divisions of the Levites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means the non-Levitical Israelites, in contrast to the Levites.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And stand in the holy place according to the divisions
  simplified_phrase: Take your places in the holy place. Arrange yourselves according to the divisions
  preserved_meaning: The Levites must position themselves in the sacred area in organized groups.
  reasoning_layer_used: Lexical decisions for וְעִמְדוּ, בַּקֹּדֶשׁ, and לִפְלֻגּוֹת
  rationale: Two direct sentences make the command and its organizational structure easier to follow.
- pob_phrase: the fathers’ houses of your brothers
  simplified_phrase: the ancestral families of your brothers
  preserved_meaning: The divisions are based on the paternal ancestral households of their fellow Israelites.
  reasoning_layer_used: Lexical decisions for בֵּית הָאָבוֹת and לַאֲחֵיכֶם
  rationale: “Ancestral families” clearly expresses the historical household units while retaining the kinship language.
- pob_phrase: the division of a father’s house for the Levites
  simplified_phrase: the family divisions of the Levites
  preserved_meaning: The Levites also have distinct divisions based on their ancestral households.
  reasoning_layer_used: Lexical decisions for וַחֲלֻקַּת, בֵּית אָב, and לַלְוִיִּם
  rationale: This wording preserves both the organizational divisions and the family basis that the earlier draft merged.
translation_notes:
  risk_flags:
  - risk: Readers may take “sons of the people” to mean all Israelites rather than the non-Levitical Israelites.
    mitigation: The footnote explains the contextual distinction while retaining the POB’s kinship wording.
  - risk: “Ancestral families” is less formally tied to the paternal-house image than “fathers’ houses.”
    mitigation: The phrase preserves ancestry and family structure in readily understood English.
