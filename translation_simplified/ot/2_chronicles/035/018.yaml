translation:
  language: en
  text: No Passover like this one had been celebrated in Israel since the time of Samuel the prophet. None of Israel’s kings had celebrated a Passover like the one Josiah celebrated together with the priests, the Levites, all the people of Judah, the Israelites who were present, and the people living in Jerusalem.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: had been kept
  simplified_phrase: had been celebrated
  preserved_meaning: Israel had not observed a comparable Passover during that period.
  reasoning_layer_used: lexical decision for עשה with פסח
  rationale: “Celebrated” clearly expresses observing the Passover rather than making it.
- pob_phrase: since the days of Samuel the prophet
  simplified_phrase: since the time of Samuel the prophet
  preserved_meaning: Samuel’s era remains the starting point of the comparison.
  reasoning_layer_used: lexical decision for מימי
  rationale: “Since the time of” is more immediate modern English.
- pob_phrase: Israel that was present, and the inhabitants of Jerusalem
  simplified_phrase: the Israelites who were present, and the people living in Jerusalem
  preserved_meaning: The wording identifies participating Israelites and Jerusalem residents.
  reasoning_layer_used: POB lexical alternatives and footnote b
  rationale: Collective and formal expressions are recast as clear references to people.
translation_notes:
  risk_flags:
  - risk: The comparison may be read as denying every other significant Passover after Samuel.
    mitigation: The text preserves POB’s comparison without adding an absolute or harmonizing explanation.
