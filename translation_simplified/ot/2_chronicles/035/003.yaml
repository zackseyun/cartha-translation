translation:
  language: en
  text: He told the Levites who taught all Israel[a] and were set apart for Yahweh, “Place the holy ark in the temple built by Solomon son of David, king of Israel. You no longer need to carry it on your shoulders. Now serve Yahweh your God and his people Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the Levites had understanding or had been instructed.
    reason: lexical_alternative
