translation:
  language: en
  text: Jeremiah mourned for Josiah with a lament. To this day, all the singers, both men and women, speak of Josiah in their laments. These laments were established as a regular custom in Israel. Indeed, they are recorded in the Laments.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “recorded among the lament songs,” if this refers to laments in general rather than to a specific collection called the Laments.
    reason: alternative_reading
