  text: His officials also made voluntary contributions for the people,[a] the priests, and the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of God’s temple, gave the priests 2,600 animals for the Passover offerings and 300 cattle.
  philosophy: optimal-equivalence
