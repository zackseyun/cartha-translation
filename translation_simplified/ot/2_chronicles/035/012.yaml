translation:
  language: en
  text: They removed the burnt offerings and gave them to the sons of the people[a] according to their ancestral family groups, for presentation to Yahweh as written in the Book of Moses. They did the same with the cattle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of the people” means the general Israelite population, in contrast to the priests and Levites.
    reason: lexical_alternative
