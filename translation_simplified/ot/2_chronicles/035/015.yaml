translation:
  language: en
  text: The singers from Asaph’s family stood in their assigned places, as David, Asaph, Heman, and Jeduthun—the king’s seer—had commanded. The gatekeepers stood at each gate. They did not need to leave their duties,[a] because their brothers among the Levites made preparations for them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They were not to leave their duties.” The wording may have this stronger sense, though the next clause favors “did not need to leave.”
    reason: alternative_reading
