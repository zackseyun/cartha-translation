translation:
  language: en
  text: The wings of the cherubim measured twenty cubits (about 30 feet) from end to end. One wing was five cubits (about 7½ feet) long and reached the temple wall. The other wing was the same length and reached the wing of the other cherub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Reached” may mean that the wings actually touched the wall and each other.
    reason: lexical_alternative
