translation:
  language: en
  text: The entrance hall at the front of the Temple was about 30 feet long,[a] matching the Temple’s width. It was about 180 feet high,[b] and Solomon covered its inside with pure gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew measurement is twenty cubits, about 30 feet or 9 meters.
    reason: simplification_note
  - marker: b
    text: The Hebrew text gives the height as 120 cubits, about 180 feet or 55 meters. Some interpreters suspect a textual difficulty, but this translation follows the preserved Masoretic Text.
    reason: textual_variant
