translation:
  language: en
  text: He made two pillars in front of the temple. Together they measured 35 cubits (about 52 feet or 16 meters) in length,[a] and the ornamental top on each pillar was 5 cubits (about 7½ feet or 2.3 meters).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “35 cubits long.” First Kings 7:15 says each pillar was 18 cubits high, so Chronicles may give their combined measurement, or the text may contain a copying difficulty.
    reason: cross_reference
