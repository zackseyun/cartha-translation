translation:
  language: en
  text: His mother was from among the women of Dan,[a] and his father was a man from Tyre. He is skilled in working with gold, silver, bronze, iron, stone, wood, fine linen, and fabrics dyed purple, blue, and crimson.[b] He can make every kind of engraving and devise every kind of design assigned to him. He can work alongside your skilled men and the skilled men of my lord David, your father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means that his mother was from the tribe of Dan.
    reason: cultural_note
  - marker: b
    text: Or “scarlet” instead of “crimson.”
    reason: lexical_alternative
