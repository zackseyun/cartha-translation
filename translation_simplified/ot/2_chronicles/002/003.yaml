translation:
  language: en
  text: See, I am building a house for the name of Yahweh my God.[a] I will set it apart as holy for him, so that fragrant incense may be burned before him, the bread may be regularly arranged,[b] and burnt offerings may be offered every morning and evening, on Sabbaths, at new moons, and at the appointed feasts of Yahweh our God. Israel must continue these offerings forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple. “For the name of Yahweh” means that it is dedicated to Yahweh.
    reason: simplification_note
  - marker: b
    text: Traditionally, “the continual showbread” or “the bread set out continually.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, I am building a house for the name of Yahweh my God
  simplified_phrase: See, I am building a house for the name of Yahweh my God
  preserved_meaning: The opening calls attention to Solomon’s declaration and retains the significant phrase “house for the name.”
  reasoning_layer_used: Lexical and theological decisions for הִנֵּה, בַּיִת, לְשֵׁם, and יְהוָה
  rationale: “See” is readily understood, while the note identifies the house and explains its dedication without defining broader associations.
- pob_phrase: to consecrate it to him
  simplified_phrase: I will set it apart as holy for him
  preserved_meaning: Solomon will dedicate the house exclusively to God as sacred.
  reasoning_layer_used: Lexical decision for לְהַקְדִּישׁ לוֹ
  rationale: The plain wording explains “consecrate” while preserving its holiness.
- pob_phrase: to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings
  simplified_phrase: so that fragrant incense may be burned before him, the bread may be regularly arranged, and burnt offerings may be offered
  preserved_meaning: The house is intended for three distinct, continuing acts of worship.
  reasoning_layer_used: Lexical and theological decisions for קְטֹרֶת סַמִּים, מַעֲרֶכֶת תָּמִיד, and עֹלוֹת
  rationale: Parallel clauses clarify the list while preserving each ritual act and the arranged-bread image.
interpretive_expansions:
- pob_phrase: This is forever for Israel
  rendering: Israel must continue these offerings forever
  claim: The closing clause states Israel’s enduring obligation to maintain the listed offerings.
  evidence:
  - The lexical rationale identifies the clause as an enduring obligation.
  - The preceding list supplies “these offerings” as the referent.
  confidence: high
  alternatives_preserved:
  - This is forever for Israel.
  - This is an ordinance for Israel forever.
translation_notes:
  risk_flags:
  - risk: “For the name” may remain unfamiliar to new readers.
    mitigation: The note explains dedication to Yahweh without settling broader theological associations.
  - risk: The passive ritual clauses do not identify who performs the acts.
    mitigation: This preserves the verse’s focus because it does not name the performers.
