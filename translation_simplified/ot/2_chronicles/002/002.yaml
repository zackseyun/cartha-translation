- pob_phrase: sent to Huram king of Tyre, saying
  simplified_phrase: sent this message to Huram king of Tyre
  preserved_meaning: Solomon communicated these words to Huram.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁלַח and לֵאמֹר
  rationale: “Sent this message” is clearer modern English than “sent to ... saying.”
- pob_phrase: As you dealt with David my father and sent him cedars
  simplified_phrase: Just as you dealt with my father David and sent him cedars
  preserved_meaning: Solomon recalls both Huram’s treatment of David and his provision of cedars.
  reasoning_layer_used: Lexical decisions for כַּאֲשֶׁר, עָשִׂיתָ עִם דָּוִיד אָבִי, and וַתִּשְׁלַח לוֹ אֲרָזִים
  rationale: This keeps both coordinated ideas while using natural English name order.
- pob_phrase: to build himself a house to dwell in, so do with me
  simplified_phrase: so he could build a house for himself to live in, do the same for me
  preserved_meaning: The cedars served David’s residence, and Solomon asks Huram for comparable treatment.
