translation:
  language: en
  text: Then Solomon sent this message to Huram king of Tyre:[a] “Just as you dealt with my father David and sent him cedars so he could build a house for himself to live in, do the same for me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huram is the Hebrew form used here; in Kings his name is usually written Hiram.
    reason: alternative_reading
