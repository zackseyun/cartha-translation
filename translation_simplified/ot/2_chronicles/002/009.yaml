  text: 'Now take note: I have provided your servants—the woodcutters who cut down the trees—with 20,000 ancient dry measures of crushed wheat,[a] 20,000 ancient dry measures of barley,[b] 20,000 ancient liquid measures of wine,[c] and 20,000 ancient liquid measures of oil.'
