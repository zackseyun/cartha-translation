translation:
  language: en
  text: The Levites must completely surround the king, each one holding his weapons. Anyone who enters the house[a] must be put to death. Stay beside the king whenever he enters or leaves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the house” may refer to the temple, as it often does in Chronicles.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall surround the king on every side
  simplified_phrase: must completely surround the king
  preserved_meaning: The Levites are directed to encircle the king fully.
  reasoning_layer_used: Lexical decision for וְהִקִּיפוּ and סָבִיב
  rationale: “Must completely surround” expresses both the command and full encirclement in direct modern English.
- pob_phrase: each man with his weapons in his hand
  simplified_phrase: each one holding his weapons
  preserved_meaning: Every Levite is to be armed for the king’s protection.
  reasoning_layer_used: Lexical decision for אִישׁ וְכֵלָיו בְּיָדוֹ
  rationale: The participial wording removes an awkward body-part expression without weakening the armed setting.
- pob_phrase: Be with the king when he comes in and when he goes out
  simplified_phrase: Stay beside the king whenever he enters or leaves
  preserved_meaning: The guards must remain with the king throughout his movements.
  reasoning_layer_used: Lexical decisions for וִהְיוּ אֶת הַמֶּלֶךְ and בְּבֹאוֹ וּבְצֵאתוֹ
  rationale: “Stay beside” makes the required continuing accompaniment clear while preserving both movements.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “the house” as an ordinary residence.
    mitigation: The footnote preserves the contextual possibility that it means the temple.
