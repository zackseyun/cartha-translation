translation:
  language: en
  text: Then Jehoiada made a covenant with all the people and the king so that they would be Yahweh’s people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: made a covenant between himself, all the people, and the king
  simplified_phrase: made a covenant with all the people and the king
  preserved_meaning: Jehoiada, all the people, and the king remain the covenant’s three parties.
  reasoning_layer_used: lexical and theological decisions on the covenant parties
  rationale: Using “with” expresses the relationship naturally without changing who took part.
- pob_phrase: that they should be Yahweh’s people
  simplified_phrase: so that they would be Yahweh’s people
  preserved_meaning: The covenant’s purpose was their belonging to Yahweh as his people.
  reasoning_layer_used: lexical decision on the purpose clause and applied revision
  rationale: “So that” states the covenant’s purpose in direct modern English.
translation_notes:
  risk_flags:
  - risk: The simpler preposition “with” could make Jehoiada seem less clearly included as a covenant party.
    mitigation: The subject “Jehoiada” and the named partners still present all three parties in the same covenant.
