translation:
  language: en
  text: The whole assembly made a covenant with the king at God’s temple. Then Jehoiada[a] said to them, “Look! The king’s son will reign, just as the LORD said about David’s descendants.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “he”; the context identifies the speaker as Jehoiada.
    reason: source_note
simplification_decisions:
- pob_phrase: all the assembly
  simplified_phrase: the whole assembly
  preserved_meaning: Everyone belonging to the gathered assembly is included.
  reasoning_layer_used: POB base text and source wording
  rationale: “Whole assembly” expresses the total group in natural English.
- pob_phrase: in the house of God
  simplified_phrase: at God’s temple
  preserved_meaning: The covenant was made at the sacred temple in Jerusalem.
  reasoning_layer_used: historical context and POB base text
  rationale: “God’s temple” makes the biblical place-name clear to modern readers.
- pob_phrase: concerning the sons of David
  simplified_phrase: about David’s descendants
  preserved_meaning: The LORD’s declaration concerned the continuing royal line descended from David.
  reasoning_layer_used: source-language kinship expression and immediate context
  rationale: “Descendants” conveys the dynastic sense of “sons” without suggesting only David’s immediate children.
interpretive_expansions:
- pob_phrase: he said to them
  rendering: Jehoiada said to them
  claim: The unnamed male speaker is Jehoiada.
  evidence:
  - The surrounding narrative presents Jehoiada as the leader addressing the assembly.
  - The speaker refers to the child as “the king’s son,” making the child king an unlikely speaker.
  confidence: high
  alternatives_preserved:
  - The Hebrew leaves the subject as “he.”
translation_notes:
  risk_flags:
  - risk: Naming Jehoiada resolves a pronoun that is implicit in the Hebrew.
    mitigation: A source note preserves the Hebrew form while the main text follows the clear narrative context.
