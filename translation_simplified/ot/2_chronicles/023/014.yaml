translation:
  language: en
  text: Then Jehoiada the priest brought out the army officers who commanded units of a hundred men. He told them, “Take her out between the ranks[a], and execute with the sword anyone who follows her.” The priest had already ordered, “Do not execute her in Yahweh’s temple.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may mean “to the outside of the rows.” It probably describes taking Athaliah through or between arranged ranks.
    reason: lexical_alternative
