  preserved_meaning: The Levites and the Judean people fully obeyed Jehoiada's command.
  reasoning_layer_used: POB lexical decisions for וְכָל יְהוּדָה and כְּכֹל אֲשֶׁר צִוָּה
  rationale: This makes the collective sense of Judah and the full obedience clear.
- pob_phrase: those coming in on the Sabbath together with those going out on the Sabbath
  simplified_phrase: both those coming on duty for the Sabbath and those going off duty
  preserved_meaning: Both the incoming and outgoing Sabbath service shifts were present.
  reasoning_layer_used: POB lexical decisions for בָּאֵי הַשַּׁבָּת and יוֹצְאֵי הַשַּׁבָּת
  rationale: “On duty” clearly identifies a scheduled change of service personnel.
- pob_phrase: had not dismissed the divisions
  simplified_phrase: had not dismissed the service groups
  preserved_meaning: Jehoiada had not released the organized priestly and Levitical groups from duty.
  reasoning_layer_used: POB lexical decision and footnote for הַמַּחְלְקוֹת
  rationale: “Service groups” is clearer than “divisions” while preserving the organized-group sense.
