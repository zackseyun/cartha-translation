translation:
  language: en
  text: She looked, and there was the king, standing by his pillar at the entrance. The officials and the trumpets[a] were beside him. All the people of the land were celebrating and blowing trumpets, and the singers with musical instruments were leading the praise.[b] Then Athaliah tore her clothes and cried out, “Conspiracy! Conspiracy!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the trumpets,” possibly using the instruments to mean the trumpeters.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that the singers were directing the praise.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And she looked, and behold
  simplified_phrase: She looked, and there was
  preserved_meaning: Athaliah suddenly sees the vivid scene before her.
  reasoning_layer_used: Lexical decisions for וַתֵּרֶא וְהִנֵּה
  rationale: The wording preserves the attention-directing force without the archaic “behold.”
- pob_phrase: the singers with the instruments of song were leading the praise
  simplified_phrase: the singers with musical instruments were leading the praise
  preserved_meaning: The singers and instruments guided the public praise without implying ownership of the instruments.
  reasoning_layer_used: Lexical decisions for בִּכְלֵי הַשִּׁיר and וּמוֹדִיעִים לְהַלֵּל
  rationale: “Musical instruments” clearly expresses the source phrase without adding a possessive.
- pob_phrase: said, “Conspiracy! Conspiracy!”
  simplified_phrase: cried out, “Conspiracy! Conspiracy!”
  preserved_meaning: Athaliah raises an alarm about a conspiracy.
  reasoning_layer_used: Immediate narrative context
  rationale: “Cried out” naturally conveys the force of her repeated alarm.
interpretive_expansions:
