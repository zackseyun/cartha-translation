translation:
  language: en
  text: Only the priests and the Levites serving there may enter Yahweh’s temple. They may enter because they are holy—set apart for this sacred service. All the people must carry out the duty Yahweh has assigned them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “keep watch for Yahweh” or “follow Yahweh’s appointed order.”
    reason: lexical_alternative
