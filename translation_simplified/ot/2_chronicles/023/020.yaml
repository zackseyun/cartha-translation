translation:
  language: en
  text: Then he took with him the commanders over groups of a hundred, the nobles, the leaders of the people, and the whole populace.[a] He led the king down from Yahweh’s temple. They entered the royal palace through the upper gate and seated the king on the royal throne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “all the people of the land,” an expression for the populace as a public body.
    reason: cultural_note
