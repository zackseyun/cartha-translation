translation:
  language: en
  text: Jehoiada put the priests, the Levites,[a] in charge of Yahweh’s house. David had assigned them duties there. They were to offer burnt offerings[b] to Yahweh as written in the Law of Moses, with rejoicing and song, following David’s directions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the Levitical priests” or “the priests and the Levites.”
    reason: alternative_reading
  - marker: b
    text: A burnt offering was a sacrifice burned completely on the altar.
    reason: cultural_note
