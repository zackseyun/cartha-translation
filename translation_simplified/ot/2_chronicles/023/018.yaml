  preserved_meaning: Jehoiada entrusted responsibility for Yahweh’s house to them.
  reasoning_layer_used: Lexical decisions for פקדות and ביד
  rationale: The common administrative phrase replaces an opaque Hebrew idiom without losing its force.
- pob_phrase: whom David had assigned over the house of Yahweh
  simplified_phrase: David had assigned them duties there
  preserved_meaning: David had previously given these personnel responsibilities in Yahweh’s house.
