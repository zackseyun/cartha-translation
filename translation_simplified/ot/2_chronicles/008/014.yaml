translation:
  language: en
  text: 'Following the arrangement laid down by his father David,[a] he organized the priests into groups for their temple service. He assigned the Levites their duties: to offer praise and to minister before the priests, doing what was required each day. He also organized the gatekeepers into groups for each gate. This was the commandment of David, the man of God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his ancestor.” Hebrew can use “father” for a forefather or royal predecessor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to the ordinance of David his father
  simplified_phrase: Following the arrangement laid down by his father David
  preserved_meaning: David’s prescribed order governed these appointments.
  reasoning_layer_used: Lexical decision for כְּמִשְׁפַּט and theological decision on “father.”
  rationale: “Arrangement laid down” explains the formal rule while retaining “father.”
- pob_phrase: he appointed the divisions of the priests for their service, and the Levites for their duties
  simplified_phrase: he organized the priests into groups for their temple service. He assigned the Levites their duties
  preserved_meaning: The priests and Levites were placed into organized roles.
  reasoning_layer_used: Lexical decisions for וַיַּעֲמֵד, מַחְלְקוֹת, עֲבֹדָתָם, and מִשְׁמְרוֹתָם.
  rationale: Two direct sentences make the administrative assignments easier to follow.
- pob_phrase: the gatekeepers in their divisions for each gate
  simplified_phrase: organized the gatekeepers into groups for each gate
  preserved_meaning: A separate organized group of gatekeepers served at each individual gate.
  reasoning_layer_used: Lexical decisions for הַשּׁוֹעֲרִים, מַחְלְקוֹת, and לְשַׁעַר וָשָׁעַר.
  rationale: Linking each group to a gate preserves the distributive assignment.
interpretive_expansions:
- pob_phrase: for their service
  rendering: for their temple service
  claim: The priests’ service was their work in the temple.
  evidence:
  - The immediate passage organizes priests, Levites, and gatekeepers for sacred duties.
  - The POB lexical rationale identifies the phrase as cultic temple work.
  confidence: high
  alternatives_preserved:
  - service
translation_notes:
  risk_flags:
  - risk: “Before the priests” may describe either location or service in relation to them.
    mitigation: The wording is retained without choosing between the spatial and relational senses.
  - risk: Modern readers may assume “father” means only an immediate parent.
    mitigation: The main text preserves POB’s choice, while the footnote gives the broader Hebrew usage.
