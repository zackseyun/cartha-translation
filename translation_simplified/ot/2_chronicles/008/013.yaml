translation:
  language: en
  text: 'He offered the sacrifices required for each day, as Moses commanded. He did this on the Sabbaths and at the new moon observances, as well as at the three appointed feasts each year: the Feast of Unleavened Bread, the Feast of Weeks,[a] and the Feast of Booths.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Feast of Weeks was later called Pentecost in Greek.
    reason: cross_reference
  - marker: b
    text: Booths were temporary shelters; this feast is also called the Feast of Tabernacles.
    reason: cultural_note
