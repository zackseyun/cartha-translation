translation:
  language: en
  text: Micaiah said, “If you do return safely, then Yahweh has not spoken through me.” He added, “Listen, all you peoples!”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If you indeed return in peace
  simplified_phrase: If you do return safely
  preserved_meaning: The condition remains emphatic and refers to returning unharmed.
  reasoning_layer_used: Lexical decision for אִם שׁוֹב תָּשׁוּב and בְּשָׁלוֹם
  rationale: “Do return safely” expresses the Hebrew emphasis and intended sense in common English.
- pob_phrase: Yahweh has not spoken by me
  simplified_phrase: Yahweh has not spoken through me
  preserved_meaning: Micaiah says his prophecy would not be from Yahweh if the king returned safely.
  reasoning_layer_used: POB lexical alternative for לֹא דִבֶּר יְהוָה בִּי
  rationale: “Through me” makes the instrumental meaning immediately clear.
- pob_phrase: Then he said, “Hear, all you peoples!”
  simplified_phrase: He added, “Listen, all you peoples!”
  preserved_meaning: Micaiah solemnly calls the broader peoples to pay attention.
  reasoning_layer_used: Lexical and theological decisions for שִׁמְעוּ and עַמִּים כֻּלָּם
  rationale: “Listen” and “he added” clarify the command and continuing speaker while retaining plural “peoples.”
