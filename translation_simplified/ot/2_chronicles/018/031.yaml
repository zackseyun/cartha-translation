translation:
  language: en
  text: When the chariot commanders saw Jehoshaphat, they said, “That is the king of Israel!” They turned toward him to attack him. But Jehoshaphat cried out, and Yahweh helped him. God drew the commanders away from him.
  philosophy: optimal-equivalence
