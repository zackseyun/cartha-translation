translation:
  language: en
  text: But a man shot an arrow at random, and it hit the king of Israel in a gap between his scale armor and breastplate.[a] The king told his chariot driver, “Turn the chariot around and take me away from the battle, because I am wounded.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact Hebrew armor terms are uncertain, but the arrow struck a gap between parts of the king’s armor.
    reason: cultural_note
simplification_decisions:
- pob_phrase: drew his bow at random
  simplified_phrase: shot an arrow at random
  preserved_meaning: The archer fired without aiming at the king in particular.
  reasoning_layer_used: POB lexical decision for לְתֻמּוֹ
  rationale: This states the familiar action directly while retaining the untargeted nature of the shot.
- pob_phrase: between the scale armor and the breastplate
  simplified_phrase: in a gap between his scale armor and breastplate
  preserved_meaning: The arrow found a vulnerable opening between two armor components.
  reasoning_layer_used: POB lexical rationale and cultural footnote
  rationale: Adding “gap” makes the physical situation immediately clear without resolving the uncertain armor terms.
- pob_phrase: Turn your hand and take me out of the camp
  simplified_phrase: Turn the chariot around and take me away from the battle
  preserved_meaning: The king orders the driver to maneuver the chariot out of the fighting.
  reasoning_layer_used: POB lexical decisions for הֲפֹךְ יָדֶיךָ and מִן הַמַּחֲנֶה
  rationale: The likely meaning of the Hebrew idiom and the military sense of “camp” are expressed in ordinary English.
