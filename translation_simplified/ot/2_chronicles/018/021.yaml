translation:
  language: en
  text: He said, “I will go out and become a lying spirit, putting false words in the mouths of all Ahab’s prophets.” The LORD answered, “You will entice Ahab,[a] and you will succeed. Go out and do it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deceive Ahab.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a lying spirit in the mouth of all his prophets
  simplified_phrase: a lying spirit, putting false words in the mouths of all Ahab’s prophets
  preserved_meaning: The spirit will cause all the prophets to speak lies while the Hebrew mouth image remains visible.
  reasoning_layer_used: Lexical decision for לְרוּחַ שֶׁקֶר and בְּפִי
  rationale: The recast wording explains the image without weakening its deceptive force.
- pob_phrase: And he said
  simplified_phrase: The LORD answered
  preserved_meaning: God responds to and authorizes the spirit’s proposal within the vision.
  reasoning_layer_used: Theological decision on divine permission or commission
  rationale: Naming the speaker clarifies the dialogue while preserving its theological tension.
- pob_phrase: Go out and do so
  simplified_phrase: Go out and do it
  preserved_meaning: The spirit is commanded to carry out the proposed mission.
  reasoning_layer_used: Lexical decisions for צֵא and וַעֲשֵׂה כֵן
  rationale: “Do it” is more natural common English while retaining the direct command.
interpretive_expansions:
