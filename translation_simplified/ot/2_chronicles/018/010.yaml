translation:
  language: en
  text: 'Then Zedekiah son of Chenaanah made iron horns for himself. He said, “This is what Yahweh says: ‘With these horns you will gore[a] Aram[b] until its people are finished off.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures the thrusting attack of a horned animal; it can also be translated “push.”
    reason: lexical_alternative
  - marker: b
    text: Aram can also be rendered “the Arameans” or, less precisely, “Syria.”
    reason: lexical_alternative
