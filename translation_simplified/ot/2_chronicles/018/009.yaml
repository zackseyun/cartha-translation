  text: The king of Israel and Jehoshaphat, king of Judah, were sitting there, each on his own throne and dressed in robes. They were at the place where grain was threshed, by the entrance to Samaria’s gate.[a] All the prophets were prophesying in front of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This place is literally called a “threshing floor.”
