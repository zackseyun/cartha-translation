simplification_decisions:
- pob_phrase: the king of Israel
  simplified_phrase: Israel’s king
  preserved_meaning: The speaker remains the king who rules Israel.
  reasoning_layer_used: POB lexical decision for מֶלֶךְ יִשְׂרָאֵל
  rationale: The possessive form is shorter and natural in modern narrative.
- pob_phrase: Did I not tell you that he would not prophesy
  simplified_phrase: Didn’t I tell you that he would not prophesy
  preserved_meaning: The rhetorical question still links the earlier warning directly to what the prophet would say.
  reasoning_layer_used: POB lexical decisions for הֲלֹא and לֹא יִתְנַבֵּא
  rationale: The contraction is natural while “that” preserves the future-in-the-past relationship.
- pob_phrase: good concerning me
  simplified_phrase: anything good about me
  preserved_meaning: The king complains that the prophet gives him no positive message.
  reasoning_layer_used: POB lexical decisions for טוֹב and עָלַי
  rationale: Common wording makes the substantival sense of “good” immediately clear.
translation_notes:
  risk_flags:
  - risk: Readers may understand “evil” as moral wickedness rather than a disastrous prediction.
    mitigation: The footnote gives “disaster” as the contextual alternative while the text retains the Hebrew contrast.
