translation:
  language: en
  text: The king of Israel called together four hundred men who were prophets. He asked them, “Should we go fight at Ramoth-gilead, or should I hold back?” They answered, “Go up. God will hand it over to the king.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the king” without identifying him more specifically.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gathered the prophets, four hundred men
  simplified_phrase: called together four hundred men who were prophets
  preserved_meaning: The king assembled four hundred male prophets.
  reasoning_layer_used: Lexical decisions for וַיִּקְבֹּץ, הַנְּבִאִים, and אַרְבַּע מֵאוֹת אִישׁ
  rationale: The recast sentence is easier to follow while retaining the source’s explicit “men.”
- pob_phrase: Should we go to Ramoth-gilead for battle, or should I refrain?
  simplified_phrase: Should we go fight at Ramoth-gilead, or should I hold back?
  preserved_meaning: The king asks whether they should enter battle while preserving the shift from “we” to “I.”
  reasoning_layer_used: Lexical decisions for הֲנֵלֵךְ, לַמִּלְחָמָה, and אִם אֶחְדָּל
  rationale: Common verbs replace formal wording without harmonizing the change in grammatical person.
- pob_phrase: God will give it into the hand of the king
  simplified_phrase: God will hand it over to the king
  preserved_meaning: God will place the implied city or victory under the king’s power.
  reasoning_layer_used: Lexical decision for בְּיַד הַמֶּלֶךְ and theological decision on the king’s referent
  rationale: “Hand it over” makes the Hebrew control idiom natural while leaving “the king” unspecified.
translation_notes:
  risk_flags:
  - risk: Readers may not know which king the prophets mean.
    mitigation: The main text preserves the Hebrew ambiguity, and the footnote identifies it.
