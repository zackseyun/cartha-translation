translation:
  language: en
  text: Then King Rehoboam sent Hadoram,[a] the official in charge of forced labor. But the Israelites pelted Hadoram with stones, and he died. King Rehoboam then mustered his strength, got into his chariot, and fled to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel account in 1 Kings 12:18 calls him Adoram.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who was over the forced labor
  simplified_phrase: the official in charge of forced labor
  preserved_meaning: Hadoram supervised imposed labor service.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר עַל הַמַּס
  rationale: “Official in charge” makes Hadoram’s role immediately clear.
- pob_phrase: the sons of Israel stoned him with stones
  simplified_phrase: the Israelites pelted Hadoram with stones
  preserved_meaning: The people of Israel attacked him by throwing stones.
  reasoning_layer_used: POB lexical decisions for בְנֵי יִשְׂרָאֵל and וַיִּרְגְּמוּ בוֹ אֶבֶן
  rationale: This replaces the national idiom while preserving the source’s concrete stones.
- pob_phrase: strengthened himself to get up into the chariot to flee
  simplified_phrase: mustered his strength, got into his chariot, and fled
  preserved_meaning: Rehoboam fortified himself for his urgent escape by chariot.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision for הִתְאַמֵּץ
  rationale: The wording is natural but does not replace self-fortification with mere haste.
translation_notes:
  risk_flags:
  - risk: “Mustered his strength” may suggest mainly physical effort.
    mitigation: It retains the audited self-fortifying sense without claiming that the verb means only speed.
