translation:
  language: en
  text: Then he asked them, “What do you advise? How should we answer these people who said to me, ‘Make the yoke your father put on us lighter’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The yoke is an image for the heavy burden of forced labor or oppressive rule.
