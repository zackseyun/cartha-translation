simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: Then he asked them
  preserved_meaning: Rehoboam turns to this group to seek their advice.
  reasoning_layer_used: The narrative and lexical decisions identify the speech as a request for counsel.
  rationale: Combining the speech introduction with the question produces natural English.
- pob_phrase: What do you advise, so that we may answer this people
  simplified_phrase: What do you advise? How should we answer these people
  preserved_meaning: He asks for counsel about the reply they should give.
  reasoning_layer_used: The lexical decisions preserve both seeking advice and returning an answer.
  rationale: Two direct questions make the purpose relationship easier to follow.
- pob_phrase: Lighten the yoke that your father put on us
  simplified_phrase: Make the yoke your father put on us lighter
  preserved_meaning: The people ask for relief from the burden imposed by Solomon.
  reasoning_layer_used: The lexical rationale requires retaining the yoke image while conveying an imposed burden.
  rationale: The recast wording is clearer while preserving the source-language image.
