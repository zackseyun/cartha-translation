  preserved_meaning: Rehoboam sought counsel from the senior leaders.
  reasoning_layer_used: Lexical decision for וַיִּוָּעַץ
  rationale: The expanded wording makes the meaning of “consulted” immediately clear.
- pob_phrase: who had stood before Solomon his father
  simplified_phrase: who had served his father Solomon
  preserved_meaning: The elders had attended Solomon in an official capacity.
  reasoning_layer_used: Lexical decision and POB footnote for עֹמְדִים לִפְנֵי
  rationale: The main text states the idiom’s likely sense, while the footnote preserves its image.
- pob_phrase: How do you advise me to answer this people?
  simplified_phrase: How should I answer these people?
  preserved_meaning: Rehoboam asks the elders what reply he should give the people.
  reasoning_layer_used: Lexical decisions for נוֹעָצִים, לְהָשִׁיב, and לָעָם הַזֶּה
  rationale: The simpler question avoids awkward English without changing the request for counsel.
