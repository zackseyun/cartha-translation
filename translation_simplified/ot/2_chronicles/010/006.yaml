translation:
  language: en
  text: King Rehoboam asked for advice from the elders who had served his father Solomon[a] during Solomon’s lifetime. He asked, “How should I answer these people?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “stood before his father Solomon,” an expression that can describe attending or serving a king in an official role.
    reason: source_note
