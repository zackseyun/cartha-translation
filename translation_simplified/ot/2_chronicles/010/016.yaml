translation:
  language: en
  text: 'Because the king did not listen to them, all Israel answered him:


    “What share do we have in David?

    We have no inheritance in the son of Jesse!

    Each man of Israel, go home![a]

    David, now take care of your own royal house!”


    So all Israel went home.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “to your tents,” an expression telling the people to return to their own homes.
    reason: lexical_alternative
