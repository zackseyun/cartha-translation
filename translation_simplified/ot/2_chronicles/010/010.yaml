translation:
  language: en
  text: The young men who had grown up with him told him, “Say this to the people who said to you, ‘Your father made our yoke heavy; make it lighter on us.’ Tell them, ‘My little finger[a] is thicker than my father’s waist[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “my littleness,” an expression understood here as “my little finger.”
    reason: lexical_alternative
  - marker: b
    text: Or “my father’s loins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spoke to him, saying
  simplified_phrase: told him
  preserved_meaning: The young men directly gave Rehoboam words to say.
  reasoning_layer_used: source syntax and POB context
  rationale: The shorter wording removes a redundant speech formula without changing who spoke.
- pob_phrase: This is what you shall say ... Thus you shall say to them
  simplified_phrase: Say this ... Tell them
  preserved_meaning: Both directives tell Rehoboam exactly how to answer the people.
  reasoning_layer_used: POB lexical decision for כֹּה תֹאמַר
  rationale: Common imperatives preserve the directive force and clarify the nested quotation.
- pob_phrase: Your father made our yoke heavy, but you make it lighter for us
  simplified_phrase: Your father made our yoke heavy; make it lighter on us
  preserved_meaning: The father made their existing yoke burdensome, and they ask Rehoboam to lighten it.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision
  rationale: This keeps the yoke image, the action of making it heavy, and its weight upon the people.
translation_notes:
  risk_flags:
