translation:
  language: en
  text: When Jeroboam son of Nebat heard about this,[a] he returned from Egypt. He had fled there from King Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say exactly what Jeroboam heard; the context supplies it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: heard it
  simplified_phrase: heard about this
  preserved_meaning: Jeroboam heard of the events described by the surrounding context.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “About this” sounds natural while preserving the Hebrew’s unstated object.
- pob_phrase: for he was in Egypt, where he had fled from before King Solomon
  simplified_phrase: He had fled there from King Solomon.
  preserved_meaning: Jeroboam was in Egypt because he had fled from Solomon.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  rationale: A separate sentence removes the awkward parenthesis and literal idiom without losing the reason he was in Egypt.
