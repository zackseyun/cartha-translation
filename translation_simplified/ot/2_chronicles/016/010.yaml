  text: Asa became angry with the seer[a] and had him imprisoned[b], because Asa was in a rage with him over this. At that time, Asa also brutally oppressed some of the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer was an older title for a prophet.
    reason: cultural_note
  - marker: b
    text: The Hebrew may refer more specifically to a place of confinement involving stocks or other restraints.
    reason: lexical_alternative
