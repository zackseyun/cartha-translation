translation:
  language: en
  text: In the thirty-ninth year of his reign, Asa developed a disease in his feet, and it became very severe. Even while he was ill, he did not seek Yahweh. Instead, he turned to physicians.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: became diseased in his feet
  simplified_phrase: developed a disease in his feet
  preserved_meaning: Asa became afflicted with a disease located in his feet.
  reasoning_layer_used: lexical decision for וַיֶּחֱלֶא and בְּרַגְלָיו
  rationale: The new wording is more natural while retaining the illness and its location.
- pob_phrase: his disease became very severe
  simplified_phrase: and it became very severe
  preserved_meaning: The disease progressed to an extreme degree.
  reasoning_layer_used: lexical decision for עַד לְמַעְלָה
  rationale: The pronoun avoids awkward repetition without weakening the severity.
- pob_phrase: Yet even in his disease he did not seek Yahweh, but the physicians
  simplified_phrase: Even while he was ill, he did not seek Yahweh. Instead, he turned to physicians.
  preserved_meaning: Asa sought physicians rather than Yahweh during his illness.
  reasoning_layer_used: lexical and theological decisions for דָרַשׁ and כִּי בָּרֹפְאִים
  rationale: Two direct sentences make the contrast clear while preserving Yahweh’s personal name.
interpretive_expansions:
- pob_phrase: but the physicians
  rendering: Instead, he turned to physicians.
  claim: The elliptical Hebrew means that Asa sought or relied on physicians in contrast to seeking Yahweh.
  evidence:
  - The Hebrew clause contrasts Yahweh with the physicians as the objects of Asa’s seeking.
  - The POB lexical rationale identifies the clause as elliptical and describes turning to physicians.
  confidence: high
  alternatives_preserved:
  - inquired of physicians
  - sought help from physicians
translation_notes:
  risk_flags:
  - risk: Readers may wrongly conclude that the verse condemns all medical care.
    mitigation: The wording reports Asa’s exclusive contrast between seeking Yahweh and turning to physicians without declaring physicians illegitimate.
