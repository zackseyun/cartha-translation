translation:
  language: en
  text: They buried him in the tomb he had cut out for himself in the City of David. They laid his body on a funeral bed filled with spices and fragrant ointments skillfully blended by perfumers. They also honored him with a very large ceremonial burning.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was likely a funeral burning of spices or other fragrant materials, not the burning of his body.
    reason: cultural_note
simplification_decisions:
- pob_phrase: laid him on the bier
  simplified_phrase: laid his body on a funeral bed
  preserved_meaning: His body was placed on a prepared resting place for burial.
  reasoning_layer_used: Lexical decision for בַּמִּשְׁכָּב and its burial context.
  rationale: “Funeral bed” explains the uncommon word “bier” while retaining the image of lying down.
- pob_phrase: various blended ointments prepared by a perfumer’s craft
  simplified_phrase: fragrant ointments skillfully blended by perfumers
  preserved_meaning: The aromatic mixtures were prepared with specialized skill.
  reasoning_layer_used: Lexical decisions for וּזְנִים, מְרֻקָּחִים, and בְּמִרְקַחַת מַעֲשֶׂה.
  rationale: The rewrite directly describes the ointments and the skilled work of perfumers.
- pob_phrase: they made a very great burning for him
  simplified_phrase: they also honored him with a very large ceremonial burning
  preserved_meaning: A major funeral burning was performed in Asa’s honor without specifying exactly what was burned.
  reasoning_layer_used: Theological decision on the funerary burning and the grounding review.
  rationale: Keeping “burning” preserves the deliberate uncertainty while making its honorific purpose clear.
interpretive_expansions:
- pob_phrase: a very great burning for him
  rendering: honored him with a very large ceremonial burning
  claim: The burning was a funeral honor rather than a statement that Asa’s body was cremated.
  evidence:
  - The verse says Asa was buried before it describes the burning.
  - The POB theological decision identifies the act as a ceremonial burning in Asa’s honor.
  confidence: high
  alternatives_preserved:
  - The exact materials burned remain uncertain.
  - A general funeral burning remains possible.
translation_notes:
  risk_flags:
  - risk: “Ceremonial” makes the honorific funeral setting more explicit than the Hebrew idiom.
    mitigation: The burial context and POB theological decision support this clarification.
  - risk: “Tomb” renders a Hebrew plural that may suggest a royal burial complex.
    mitigation: The singular follows the POB main text and the individual burial context.
