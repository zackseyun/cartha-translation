translation:
  language: en
  text: For Yahweh’s eyes range across the whole earth to strengthen those whose hearts are fully devoted to him.[a] You have acted foolishly in this matter. From now on, you will face wars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to show himself strong for those whose hearts are blameless toward him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: throughout all the earth
  simplified_phrase: across the whole earth
  preserved_meaning: Yahweh’s searching attention extends everywhere.
  reasoning_layer_used: lexical decision and theological decision on the universal scope of הָאָרֶץ
  rationale: “Across the whole earth” states the universal scope in more natural English.
- pob_phrase: those whose heart is wholly toward him
  simplified_phrase: those whose hearts are fully devoted to him
  preserved_meaning: The heart describes undivided covenant loyalty rather than sinless perfection.
  reasoning_layer_used: lexical and theological decisions on לְבָבָם שָׁלֵם אֵלָיו
  rationale: “Fully devoted” makes wholehearted allegiance immediately understandable.
- pob_phrase: you will have wars
  simplified_phrase: you will face wars
  preserved_meaning: Asa will experience continuing military conflict from that time onward.
  reasoning_layer_used: lexical decision on יֵשׁ עִמְּךָ מִלְחָמוֹת
  rationale: “Face wars” is ordinary modern English while retaining the judgment of future conflict.
translation_notes:
  risk_flags:
  - risk: “Fully devoted” could be read as claiming moral perfection.
    mitigation: The wording emphasizes allegiance, while the footnote preserves the documented lexical alternative.
