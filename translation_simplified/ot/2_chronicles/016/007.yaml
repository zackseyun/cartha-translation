translation:
  language: en
  text: At that time, Hanani the seer[a] came to King Asa of Judah. He said, “You relied on the king of Aram[b], but you did not rely on Yahweh your God. Because of this, the king of Aram’s army has escaped from your hand.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer was a person who received and delivered messages from God, much like a prophet.
    reason: cultural_note
  - marker: b
    text: Aram is also known as Syria.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hanani the seer came to Asa king of Judah and said to him
  simplified_phrase: Hanani the seer came to King Asa of Judah. He said
  preserved_meaning: Hanani approached Judah’s king and delivered the message.
  reasoning_layer_used: POB lexical decisions and narrative syntax
  rationale: Two sentences make the introduction easier to follow while retaining Hanani’s title.
- pob_phrase: Because you relied ... and did not rely
  simplified_phrase: You relied ... but you did not rely
  preserved_meaning: Asa trusted Aram’s king rather than Yahweh.
  reasoning_layer_used: POB lexical decision for שׁען
  rationale: The direct contrast is clearer while preserving the repeated verb “rely.”
- pob_phrase: therefore the army of the king of Aram
  simplified_phrase: Because of this, the king of Aram’s army
  preserved_meaning: The army’s escape was the consequence of Asa’s misplaced reliance.
  reasoning_layer_used: POB lexical decisions for עַל כֵּן and חֵיל
  rationale: Common phrasing and a possessive form make the consequence easier to read.
translation_notes:
  risk_flags:
  - risk: “Seer” may be unfamiliar to modern readers.
    mitigation: The term is retained for precision and briefly explained in a footnote.
  - risk: “Escaped from your hand” is less ordinary than “escaped your control.”
    mitigation: The wording remains understandable and preserves the Hebrew image of lost control.
