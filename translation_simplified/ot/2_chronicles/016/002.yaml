translation:
  language: en
  text: 'Then Asa brought out silver and gold from the treasuries of Yahweh’s temple and the royal palace. He sent them to Ben-hadad, king of Aram,[a] who lived in Damascus, with this message:'
  philosophy: optimal-equivalence
  footnotes:
