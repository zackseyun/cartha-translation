  simplified_phrase: Yahweh’s temple
  preserved_meaning: The wealth came from the sanctuary dedicated to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Temple” clarifies the contextual meaning of “house” while retaining Yahweh’s covenant name.
- pob_phrase: the king’s house
  simplified_phrase: the royal palace
  preserved_meaning: The wealth also came from the king’s official residence and treasury.
  reasoning_layer_used: POB lexical decision
  rationale: “Royal palace” gives the ordinary English meaning intended here.
- pob_phrase: and sent them ... saying
  simplified_phrase: 'He sent them ... with this message:'
  preserved_meaning: Asa sent both the silver and gold to Ben-hadad before the direct speech that follows.
  reasoning_layer_used: POB lexical decisions and immediate narrative context
  rationale: A new sentence and message formula clarify the action while preserving the plural valuables.
