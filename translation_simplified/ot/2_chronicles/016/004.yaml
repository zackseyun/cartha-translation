translation:
  language: en
  text: Ben-hadad agreed to King Asa’s request. He sent his army commanders against the cities of Israel, and they attacked Ijon, Dan, Abel-maim,[a] and all the supply cities of Naphtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text here reads “Abel-maim”; some identify it with Abel-beth-maacah, the name found in parallel passages.
    reason: alternative_reading
