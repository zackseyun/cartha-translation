translation:
  language: en
  text: Asa died and joined his ancestors. He died in the forty-first year of his reign.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “slept with his fathers,” a customary expression for death and burial among one’s ancestors.
    reason: cultural_note
simplification_decisions:
- pob_phrase: slept with his fathers
  simplified_phrase: died and joined his ancestors
  preserved_meaning: The wording makes the death idiom clear while retaining Asa’s connection with his ancestors.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: This avoids the unnatural phrase “slept in death” while the footnote preserves the Hebrew sleep image.
- pob_phrase: and died
  simplified_phrase: He died
  preserved_meaning: The Hebrew’s separate explicit statement that Asa died remains intact.
  reasoning_layer_used: POB lexical decision for וַיָּמָת
  rationale: A new sentence clearly preserves the source’s two-part statement.
interpretive_expansions:
- pob_phrase: slept with his fathers
  rendering: died and joined his ancestors
  claim: The customary expression refers to Asa’s death and association with his deceased ancestors.
  evidence:
  - The POB cultural note identifies the phrase as an expression for death and burial among one’s ancestors.
  - The following Hebrew verb explicitly states that Asa died.
  confidence: high
  alternatives_preserved:
