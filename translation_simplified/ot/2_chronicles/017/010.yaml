translation:
  language: en
  text: Dread of Yahweh came over all the kingdoms in the lands surrounding Judah,[a] and they did not go to war against Jehoshaphat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dread of Yahweh” may also mean “terror sent by Yahweh”; here it likely refers to fear that Yahweh caused.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the fear of Yahweh came upon
  simplified_phrase: Dread of Yahweh came over
  preserved_meaning: A fear associated with or sent by Yahweh overtook the neighboring kingdoms.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Dread” makes the military sense clear while the footnote preserves the Hebrew phrase’s ambiguity.
- pob_phrase: all the kingdoms of the lands that were around Judah
  simplified_phrase: all the kingdoms in the lands surrounding Judah
  preserved_meaning: Every neighboring kingdom around Judah was affected.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The shorter clause keeps both “kingdoms” and “lands” while stating their location naturally.
- pob_phrase: did not make war against
  simplified_phrase: did not go to war against
  preserved_meaning: The kingdoms did not begin military action against Jehoshaphat.
  reasoning_layer_used: lexical decision
  rationale: “Go to war” is common modern English for the same military action.
translation_notes:
  risk_flags:
