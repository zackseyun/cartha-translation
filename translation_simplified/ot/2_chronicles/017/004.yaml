translation:
  language: en
  text: But he sought the God of his father. He lived by God's commandments,[a] not by the practices of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “walked in his commandments,” a Hebrew picture of living by them.
    reason: simplification_note
  - marker: b
    text: “Israel” here likely refers to the northern kingdom, in contrast with Judah.
    reason: cultural_note
simplification_decisions:
- pob_phrase: walked in his commandments
  simplified_phrase: lived by God's commandments
  preserved_meaning: His whole way of life followed God's commands.
  reasoning_layer_used: POB lexical decisions for וּבְמִצְוֺתָיו and הָלָךְ
  rationale: The main text explains the biblical walking metaphor, while the footnote preserves its wording.
- pob_phrase: according to the deeds of Israel
  simplified_phrase: by the practices of Israel
  preserved_meaning: He did not pattern his conduct after Israel.
  reasoning_layer_used: POB lexical decision for כְּמַעֲשֵׂה
  rationale: “Practices” expresses repeated conduct more clearly than “deeds.”
- pob_phrase: but he sought ... and walked ... and not
  simplified_phrase: But he sought ... . He lived ... not
  preserved_meaning: Jehoshaphat is contrasted with Israel because he sought God and obeyed him.
  reasoning_layer_used: POB lexical decision for כִּי and optimal-equivalence philosophy
  rationale: Two sentences make the contrast and actions easier to follow.
translation_notes:
  risk_flags:
  - risk: Replacing “walked” in the main text could hide the Hebrew way-of-life image.
    mitigation: A footnote retains the literal metaphor and briefly explains it.
  - risk: Modern readers may assume “Israel” means the entire covenant people.
    mitigation: A cultural note gives the likely northern-kingdom referent without changing the main text.
