translation:
  language: en
  text: 'These were their military divisions,[a] organized by ancestral families. For Judah, the commanders of units of a thousand were: Adnah the commander, with 300,000 mighty warriors.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to their count, their enrollment, or the divisions formed when the troops were mustered.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their mustered divisions by their fathers’ houses
  simplified_phrase: their military divisions, organized by ancestral families
  preserved_meaning: The troops were mustered and organized according to clan-based family groups.
  reasoning_layer_used: POB lexical decisions for פְקֻדָּתָם and לְבֵית אֲבוֹתֵיהֶם
  rationale: This replaces administrative and genealogical wording with a clear description of the same organization.
- pob_phrase: the commanders of thousands
  simplified_phrase: the commanders of units of a thousand
  preserved_meaning: These officers commanded military units reckoned by thousands.
  reasoning_layer_used: POB lexical decision for שָׂרֵי אֲלָפִים
  rationale: Adding “units” prevents the phrase from sounding like the commanders themselves numbered in the thousands.
- pob_phrase: mighty men of valor
  simplified_phrase: mighty warriors
  preserved_meaning: Adnah had proven, formidable fighting men under his command.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי חַיִל
  rationale: The common military term “warriors” conveys the idiom directly without its archaic wording.
