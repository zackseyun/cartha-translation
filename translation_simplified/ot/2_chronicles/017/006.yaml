    mitigation: The plural “ways” commonly concerns conduct, while “in” avoids implying a separate temporal event.
  - risk: “Asherah poles” may suggest a more exact physical form than the Hebrew requires.
    mitigation: The footnote preserves the broader renderings “Asherim” and “sacred poles.”
