  language: en
  text: His heart grew bold in following Yahweh’s ways. He also removed from Judah the worship sites called high places and the Asherah poles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “Asherim” or “sacred poles”; these were objects associated with Asherah worship.
