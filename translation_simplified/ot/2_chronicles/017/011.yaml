  language: en
  text: Some of the Philistines[a] kept bringing Jehoshaphat tribute and silver by the load. The Arabians also kept bringing him flocks—7,700 rams and 7,700 male goats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Tribute came from the Philistines”; the Hebrew may indicate the source rather than “some of” the people.
