translation:
  language: en
  text: Yahweh made Jehoshaphat’s rule over the kingdom secure. All the people of Judah brought him tribute,[a] and he had great wealth and great honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “gift,” “present,” or “offering,” but the royal setting favors “tribute.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: established the kingdom in his hand
  simplified_phrase: made Jehoshaphat’s rule over the kingdom secure
  preserved_meaning: Yahweh firmly secured the kingdom under Jehoshaphat’s control.
  reasoning_layer_used: Lexical decisions for “established,” “kingdom,” and “in his hand.”
  rationale: This states the political meaning plainly while preserving the image’s force of secure control.
- pob_phrase: all Judah gave tribute to Jehoshaphat
  simplified_phrase: All the people of Judah brought him tribute
  preserved_meaning: The whole people of Judah presented tribute to Jehoshaphat.
  reasoning_layer_used: Lexical decisions for collective “all Judah” and royal-context “tribute.”
  rationale: This identifies Judah as its people while retaining the comprehensive force of “all.”
- pob_phrase: riches and honor in abundance
  simplified_phrase: great wealth and great honor
  preserved_meaning: Jehoshaphat possessed abundant material wealth and public esteem.
  reasoning_layer_used: Lexical decisions for “riches,” “honor,” and “in abundance.”
  rationale: Repeating “great” clearly applies the abundance to both wealth and honor.
