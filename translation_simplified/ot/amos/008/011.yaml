translation:
  language: en
  text: “Look! The days are coming,” declares the Lord Yahweh, “when I will send a famine over the land. It will not be hunger for bread or thirst for water. Instead, what the people will lack is hearing the words of Yahweh.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Behold, days are coming
  simplified_phrase: Look! The days are coming
  preserved_meaning: The opening still commands attention and solemnly announces a future event.
  reasoning_layer_used: POB lexical decisions for הִנֵּה and יָמִים בָּאִים
  rationale: “Look!” is a documented modern alternative that preserves the prophetic force.
- pob_phrase: declares the Lord GOD
  simplified_phrase: declares the Lord Yahweh
  preserved_meaning: The title “Lord” and the covenant name Yahweh are both preserved.
  reasoning_layer_used: POB theological decision for rendering יְהוָה
  rationale: “Lord Yahweh” renders the divine name consistently while avoiding “Lord LORD.”
- pob_phrase: not a famine for bread, nor a thirst for water, but for hearing
  simplified_phrase: It will not be hunger for bread or thirst for water. Instead, what the people will lack is hearing
  preserved_meaning: The verse denies physical deprivation and identifies the famine as deprivation of hearing God’s words.
  reasoning_layer_used: POB lexical and theological decisions on the nature of the famine
  rationale: Two shorter sentences make the contrast clear while preserving the famine image.
interpretive_expansions:
- pob_phrase: but for hearing the words of Yahweh
  rendering: Instead, what the people will lack is hearing the words of Yahweh
  claim: The famine consists in people being deprived of hearing Yahweh’s messages.
  evidence:
  - The verse contrasts bread and water with hearing Yahweh’s words.
  - The POB theological rationale identifies deprivation of hearing as the true famine.
  confidence: high
  alternatives_preserved:
  - to hear the words of Yahweh
  - a famine for hearing the words of Yahweh
translation_notes:
  risk_flags:
  - risk: “What the people will lack” makes the implied recipients explicit.
    mitigation: The land setting and the POB deprivation rationale support this bounded clarification.
