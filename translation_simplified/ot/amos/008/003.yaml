translation:
  language: en
  text: “On that day, the palace songs[a] will turn into cries of grief,” declares the Lord Yahweh. “There will be many corpses. People will throw them out everywhere. Silence!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the temple songs.” The Hebrew word can mean either “palace” or “temple.”
    reason: alternative_reading
  - marker: b
    text: Or “Hush!” or “Be silent!” This sharp command likely expresses shock or dread.
    reason: lexical_alternative
