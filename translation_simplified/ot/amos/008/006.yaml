translation:
  language: en
  text: to buy poor people for silver, and needy people for the price of a pair of sandals, and to sell even the sweepings left from the grain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the grain refuse” or “the fallen grain”; the Hebrew refers to inferior grain remnants sold as merchandise.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the poor
  simplified_phrase: poor people
  preserved_meaning: People who are poor or socially weak are being treated as property.
  reasoning_layer_used: Lexical decision for דַּלִּים and immediate exploitation context
  rationale: Adding “people” makes the human object unmistakable in natural English.
- pob_phrase: for a pair of sandals
  simplified_phrase: for the price of a pair of sandals
  preserved_meaning: The needy are exploited for a contemptibly small payment.
  reasoning_layer_used: Lexical rationale for בַּעֲבוּר נַעֲלָיִם
  rationale: “For the price of” clearly states the commercial sense of the phrase.
- pob_phrase: the sweepings of the grain
  simplified_phrase: even the sweepings left from the grain
  preserved_meaning: The merchants dishonestly sell inferior grain remnants.
  reasoning_layer_used: Lexical decision for וּמַפַּל בַּר
  rationale: “Left from” explains the concrete image, while “even” highlights the merchants’ corruption.
