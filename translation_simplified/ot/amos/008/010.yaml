translation:
  language: en
  text: I will turn your festivals into mourning and all your songs into songs of mourning. I will bring sackcloth[a] around every waist and baldness on every head. I will make it like mourning for an only son,[b] and make its end like a bitter day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth was rough clothing worn as a sign of mourning.
    reason: cultural_note
  - marker: b
    text: Hebrew says “an only one,” commonly understood here as an only son.
    reason: lexical_alternative
