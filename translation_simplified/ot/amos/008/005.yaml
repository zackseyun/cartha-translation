  text: saying, “When will the New Moon festival[a] be over so we can sell grain? When will the Sabbath end so we can put wheat up for sale? We will make the grain measure smaller and the payment weight heavier, and bend the scales so they give false weights.”
  philosophy: optimal-equivalence
