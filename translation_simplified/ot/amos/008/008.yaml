translation:
  language: en
  text: Because of this, will the land not tremble? Will everyone living there not mourn? The whole land will rise like the Nile, be swept along, and sink like Egypt’s Nile.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the earth.” The Hebrew word can mean either, but the judged territory is meant here.
    reason: lexical_alternative
  - marker: b
    text: The Nile’s yearly rise and fall pictures an overwhelming upheaval.
    reason: cultural_note
