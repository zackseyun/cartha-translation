translation:
  language: en
  text: 'Those who swear by Samaria’s guilty worship[a] make these vows: “As surely as the god you worship at Dan lives,”[b] and, “As surely as the way of Beer-sheba lives.”[c] They will fall and never rise again.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the guilt of Samaria”; this may also mean “the sin of Samaria,” and some understand it as the name of an idol or deity.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also be rendered, “As your god, Dan, lives” or “As your god of Dan lives.”
    reason: lexical_alternative
  - marker: c
    text: “The way of Beer-sheba” may mean the pilgrimage route to Beer-sheba or the worship practiced there.
    reason: alternative_reading
