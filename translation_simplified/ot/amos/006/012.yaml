translation:
  language: en
  text: Do horses run on solid rock? Does anyone plow there with oxen? Yet you have turned justice into poison and the fruit of doing right into bitter wormwood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wormwood is a plant known for its bitter taste; here it pictures moral corruption and its bitter results.
    reason: cultural_note
