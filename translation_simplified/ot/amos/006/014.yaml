translation:
  language: en
  text: “Look! I am raising up a nation against you, people of Israel,” declares Yahweh, God of Armies. “They will oppress you all the way from Lebo-hamath[a] to the stream of the Arabah.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the entrance of Hamath.” The Hebrew may name a place or describe the boundary near Hamath.
    reason: alternative_reading
  - marker: b
    text: Or “the brook of the Arabah.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: behold, I am raising up
  simplified_phrase: Look! I am raising up
  preserved_meaning: Yahweh calls for attention and announces his own action against Israel.
  reasoning_layer_used: Lexical decisions for הִנְנִי and מֵקִים
  rationale: “Look!” gives the prophetic announcement immediate force in common English.
- pob_phrase: O house of Israel
  simplified_phrase: people of Israel
  preserved_meaning: The whole community of Israel is directly addressed.
  reasoning_layer_used: Lexical decision for בֵּית יִשְׂרָאֵל
  rationale: “People of Israel” makes the corporate address clear without the archaic vocative.
- pob_phrase: the God of hosts; the Wadi of the Arabah
  simplified_phrase: God of Armies; the stream of the Arabah
  preserved_meaning: Yahweh commands mighty forces, and the southern boundary is identified by its watercourse.
  reasoning_layer_used: Lexical decisions for אֱלֹהֵי הַצְּבָאוֹת and נַחַל הָעֲרָבָה
  rationale: These familiar words clarify both expressions while preserving the watercourse’s relationship to the Arabah.
translation_notes:
  risk_flags:
  - risk: “God of Armies” may be heard as referring only to earthly armies.
    mitigation: The unrestricted plural leaves the title’s military and cosmic scope open.
  - risk: “Stream” is less geographically precise than “wadi.”
    mitigation: It preserves the watercourse sense in familiar English, while the footnote gives “brook” as an alternative.
