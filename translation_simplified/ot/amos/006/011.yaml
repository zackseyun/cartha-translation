simplification_decisions:
- pob_phrase: For behold
  simplified_phrase: For look!
  preserved_meaning: The words connect this judgment to what came before and call vivid attention to it.
  reasoning_layer_used: POB lexical decisions for כִּי and הִנֵּה
  rationale: “Look!” gives modern readers the attention-commanding force of “behold.”
- pob_phrase: Yahweh commands
  simplified_phrase: Yahweh gives the command
  preserved_meaning: Yahweh authoritatively orders the coming judgment.
  reasoning_layer_used: POB lexical decision for מְצַוֶּה
  rationale: The fuller phrase sounds natural while retaining the force of a divine decree.
- pob_phrase: will be struck into fragments
  simplified_phrase: will be smashed into fragments
  preserved_meaning: The house receives a violent, divinely ordered blow that breaks it apart.
  reasoning_layer_used: POB lexical decision for וְהִכָּה and רְסִיסִים
  rationale: “Smashed” clearly expresses the violent breaking implied by the resulting fragments.
