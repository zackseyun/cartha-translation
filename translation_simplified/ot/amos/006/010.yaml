translation:
  language: en
  text: Then his uncle[a]—the one who burns his body[b]—will carry him out and remove the bones from the house. He will ask the person in the farthest part of the house, “Is anyone else there with you?” The person will answer, “No one.” Then he will say, “Hush! We must not mention the name of Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “close male relative.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew specifically speaks of burning, perhaps as part of disposing of bodies during this judgment.
    reason: cultural_note
  - marker: c
    text: The terse Hebrew may also mean, “Hush! Do not mention the name of Yahweh.”
    reason: alternative_reading
