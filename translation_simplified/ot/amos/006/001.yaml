translation:
  language: en
  text: Woe to those who live at ease in Zion and those who feel safe on the mountain of Samaria! They are the prominent men[a] of the foremost nation among the nations,[b] and the people of Israel come to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “those designated” or “those named.”
    reason: lexical_alternative
  - marker: b
    text: Or “the first of the nations” or “the chief of the nations.”
    reason: lexical_alternative
