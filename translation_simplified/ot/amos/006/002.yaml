translation:
  language: en
  text: Go across to Calneh[b] and look at it. From there, go to the great city of Hamath. Then go down to Gath, a city of the Philistines. Are they better than these kingdoms?[a] Or is their territory larger than yours?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Are you better than these kingdoms?” The Hebrew does not state who is being compared, so it may refer either to the named kingdoms or to the people being addressed.
    reason: alternative_reading
  - marker: b
    text: Calneh was a city, but its exact location is uncertain.
    reason: cultural_note
