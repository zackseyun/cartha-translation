translation:
  language: en
  text: 'Therefore, this is what the Lord Yahweh says: “An enemy will surround the land. He will strip away your power, and your fortified palaces will be looted.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: thus says the Lord GOD
  simplified_phrase: this is what the Lord Yahweh says
  preserved_meaning: God directly announces the judgment, and his covenant name remains explicit.
  reasoning_layer_used: POB theological decision for אֲדֹנָי יְהוִה
  rationale: The common formula is clear, while “Yahweh” follows the stated doctrinal rationale.
- pob_phrase: he shall bring down your strength from you
  simplified_phrase: He will strip away your power
  preserved_meaning: The enemy will forcibly remove Israel’s national might.
  reasoning_layer_used: POB lexical decisions for וְהוֹרִד and מִמֵּךְ עֻזֵּךְ
  rationale: This wording naturally conveys both humiliation and the loss of power.
- pob_phrase: your citadels shall be plundered
  simplified_phrase: your fortified palaces will be looted
  preserved_meaning: Invaders will rob elite residences that also function as strongholds.
  reasoning_layer_used: POB lexical decisions for אַרְמְנוֹתָיִךְ and וְנָבֹזּוּ
  rationale: “Fortified palaces” preserves both senses, and “looted” is familiar modern English.
translation_notes:
  risk_flags:
  - risk: “Enemy” may sound more specific than the POB’s “adversary.”
    mitigation: The Hebrew denotes a singular hostile attacker but leaves that attacker unnamed.
  - risk: “Fortified palaces” combines two possible senses of the Hebrew noun.
    mitigation: The POB rationale says the term carries both elite-residence and defensive-security connotations here.
