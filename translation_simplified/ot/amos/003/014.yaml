translation:
  language: en
  text: For when I punish Israel for his acts of rebellion, I will also punish the altars at Bethel. The horns of the altar[a] will be cut off and fall to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The horns were horn-shaped projections at the altar’s corners, connected with its sacred and ritual use.
    reason: cultural_note
simplification_decisions:
- pob_phrase: on the day when I punish
  simplified_phrase: when I punish
  preserved_meaning: God identifies the time of judgment without changing its force.
  reasoning_layer_used: lexical decision for בְּיוֹם and פָּקְדִי
  rationale: The shorter temporal clause is natural English and retains the clear sense of punishment.
- pob_phrase: for his transgressions
  simplified_phrase: for his acts of rebellion
  preserved_meaning: Israel is punished for covenantal rebellion against rightful authority.
  reasoning_layer_used: lexical and theological decisions for פִשְׁעֵי and the singular pronoun
  rationale: The phrase explains the biblical term while preserving its moral and personal force.
- pob_phrase: the altars of Bethel
  simplified_phrase: the altars at Bethel
  preserved_meaning: God’s judgment also falls on the cultic altars located in Bethel.
  reasoning_layer_used: lexical decision for מִזְבְּחוֹת בֵּית אֵל
  rationale: Using “at” makes the place relationship immediately clear without changing the referent.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “his” as referring to an individual rather than the nation Israel.
    mitigation: The singular pronoun is retained to preserve the POB’s personal, covenantal portrayal of Israel.
  - risk: The altar’s “horns” may be unfamiliar to readers.
    mitigation: A brief cultural footnote explains the literal feature while preserving the source image.
