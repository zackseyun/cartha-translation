translation:
  language: en
  text: “Among all the families on earth, you are the only people I have known as my own.[a] That is why I will punish you for all the wrongs you have done.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “known,” referring here to a unique covenant relationship; it can also be translated “chosen” or “acknowledged.”
    reason: lexical_alternative
  - marker: b
