translation:
  language: en
  text: Sons of Israel,[a] hear this message. Yahweh has spoken it against you—the whole family that I brought up from Egypt:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated “children of Israel” or “people of Israel”; “sons” preserves the Hebrew family language.
    reason: lexical_alternative
  - marker: b
    text: “Brought up from Egypt” is the Hebrew image for the exodus, when God brought Israel out of Egypt.
    reason: source_note
