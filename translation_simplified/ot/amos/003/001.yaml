  preserved_meaning: Israel is addressed with the Hebrew masculine familial covenant designation.
  reasoning_layer_used: Theological decision on בְּנֵי יִשְׂרָאֵל
  rationale: The main text keeps the audited term, while the note supplies common alternatives.
- pob_phrase: against the whole family that I brought up from the land of Egypt
