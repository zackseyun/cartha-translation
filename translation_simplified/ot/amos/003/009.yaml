translation:
  language: en
  text: 'Proclaim this to the fortified palaces of Ashdod and those in the land of Egypt: “Gather on the mountains of Samaria. Look at the widespread turmoil within the city and the oppressed people there.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be understood as “acts of oppression,” but it most naturally refers to oppressed people here.
    reason: alternative_reading
