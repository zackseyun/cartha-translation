  preserved_meaning: A trumpet sounds as a public alarm within the city.
  reasoning_layer_used: Lexical decision for יִתָּקַע שׁוֹפָר
  rationale: The active wording is more natural while retaining the trumpet’s warning function.
- pob_phrase: If disaster happens in a city
  simplified_phrase: When disaster strikes a city
  preserved_meaning: A harmful calamity or judgment comes upon the city.
  reasoning_layer_used: Lexical and theological decisions for רָעָה
  rationale: “Strikes” expresses the arrival of disaster clearly without suggesting moral evil.
- pob_phrase: has not Yahweh done it?
  simplified_phrase: hasn’t the LORD brought it about?
  preserved_meaning: The LORD is directly responsible for bringing the disaster as judgment.
  reasoning_layer_used: Divine-agency theological decision and lexical decision for עָשָׂה
  rationale: “Brought it about” makes the agency clear without softening the text’s claim.
