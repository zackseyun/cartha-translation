translation:
  language: en
  text: Then I said, “Lord GOD,[a] please stop! How can Jacob remain standing?[b] For he is small.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “Lord YHWH”; “Lord GOD” expresses both parts of this divine title without saying “Lord LORD.”'
    reason: lexical_alternative
  - marker: b
    text: The terse Hebrew may also mean, “Who will raise Jacob up?”
    reason: alternative_reading
