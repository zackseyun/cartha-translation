  preserved_meaning: God calls for fire as the means of judicial action.
  reasoning_layer_used: POB lexical decisions for קֹרֵא, לָרִב, and בָּאֵשׁ
  rationale: The recast clause makes the action and purpose immediately clear while retaining its judicial force.
- pob_phrase: the great deep
  simplified_phrase: the vast deep waters
  preserved_meaning: The fire consumes the immense deep waters in the vision.
  reasoning_layer_used: POB lexical decision for תְּהוֹם רַבָּה
  rationale: Adding “waters” explains the biblical image without turning it into a speculative abyss.
- pob_phrase: it consumed ... and was consuming
  simplified_phrase: The fire consumed ... and was consuming
  preserved_meaning: The fire is the agent, and the second act remains in progress.
  reasoning_layer_used: POB lexical decisions for וַתֹּאכַל and וְאָכְלָה
  rationale: Naming the fire removes an unclear pronoun while preserving the unfolding action.
