translation:
  language: en
  text: Then Amaziah said to Amos, “Seer,[a] go! Flee to the land of Judah. Eat bread there,[b] and prophesy there.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer is a person who receives visions.
    reason: simplification_note
  - marker: b
    text: “Eat bread there” likely means “earn your living there” or “make your living there.”
    reason: lexical_alternative
