  preserved_meaning: Amaziah urgently commands Amos to leave for Judah.
  reasoning_layer_used: Lexical decisions for לֵךְ and בְּרַח לְךָ
  rationale: Two short commands make the urgency clear without weakening the personal force.
- pob_phrase: Seer
