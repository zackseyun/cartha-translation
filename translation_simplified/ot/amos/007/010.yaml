translation:
  language: en
  text: 'Then Amaziah, the priest of Bethel, sent this message to Jeroboam king of Israel: “Amos has conspired against you among the people of Israel. The land cannot endure everything he says.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sent word to Jeroboam king of Israel, saying
  simplified_phrase: 'sent this message to Jeroboam king of Israel:'
  preserved_meaning: Amaziah communicated the accusation directly to the king.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁלַח and messenger formula לֵאמֹר
  rationale: “Sent this message” naturally introduces the direct quotation without adding new content.
- pob_phrase: in the midst of the house of Israel
  simplified_phrase: among the people of Israel
  preserved_meaning: Amos was accused of working from within Israel’s own community.
  reasoning_layer_used: POB lexical decisions for בְּקֶרֶב and בֵּית יִשְׂרָאֵל
  rationale: The wording makes the corporate national expression clear while preserving the sense of activity within Israel.
- pob_phrase: the land is not able to bear all his words
  simplified_phrase: The land cannot endure everything he says
  preserved_meaning: Amaziah claims that Amos’s message is more than the country can tolerate.
  reasoning_layer_used: POB lexical decisions for הָאָרֶץ, לְהָכִיל, and כָּל דְּבָרָיו
  rationale: “Cannot endure” states the Hebrew capacity-and-tolerance image in direct modern English.
translation_notes:
  risk_flags:
  - risk: Readers could mistake Amaziah’s charge as the narrator’s judgment that Amos was truly conspiring.
    mitigation: The accusation remains inside Amaziah’s quoted message, preserving it as his hostile claim.
