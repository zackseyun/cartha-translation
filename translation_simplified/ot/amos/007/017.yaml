translation:
  language: en
  text: 'So this is what Yahweh says:


    “Your wife will prostitute herself in the city. Your sons and daughters will be killed by the sword. Your land will be measured out with a line and divided up.[a] You yourself will die on unclean land.[b] Israel will certainly go into exile away from its land.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Conquerors used a measuring line when dividing captured land.
    reason: cultural_note
  - marker: b
    text: This probably means foreign land, viewed as unclean from Israel’s covenant perspective.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Therefore, this is what Yahweh says
  simplified_phrase: So this is what Yahweh says
  preserved_meaning: The judgment follows from Amaziah’s opposition and remains Yahweh’s formal declaration.
  reasoning_layer_used: Lexical decision for לָכֵן and the prophetic messenger formula
  rationale: “So” expresses the consequence in more common English.
- pob_phrase: your sons and your daughters will fall by the sword
  simplified_phrase: Your sons and daughters will be killed by the sword
  preserved_meaning: Both sons and daughters will die violently in judgment.
  reasoning_layer_used: Lexical decisions for the gendered pair and sword idiom
  rationale: The wording explains the potentially opaque war idiom.
- pob_phrase: your land will be divided by measuring line
  simplified_phrase: Your land will be measured out with a line and divided up
  preserved_meaning: Conquerors will measure and apportion Amaziah’s land.
  reasoning_layer_used: Lexical decisions for בַּחֶבֶל and תְּחֻלָּק
  rationale: The recast clause clearly preserves both the measuring image and the division.
translation_notes:
  risk_flags:
  - risk: “Unclean land” may sound as though the soil itself is physically dirty.
    mitigation: The footnote cautiously identifies the likely covenantal reference to foreign land.
  - risk: “Will prostitute herself” does not specify whether coercion is involved.
    mitigation: The draft retains POB’s wording without adding an unsupported cause.
