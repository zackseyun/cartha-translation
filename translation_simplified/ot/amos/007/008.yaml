translation:
  language: en
  text: 'Yahweh asked me, “Amos, what do you see?”


    I answered, “A plumb line—a weighted line used to check whether something is straight.”[a]


    Then the Lord said, “Look, I am setting this plumb line among my people Israel. I will not pass by them again.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer to tin, lead, a plummet, or a plumb line; here it most likely means the measuring tool.
    reason: lexical_alternative
  - marker: b
    text: “I will not pass by them again” means that God will no longer spare them or overlook their sin.
    reason: alternative_reading
