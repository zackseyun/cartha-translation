  reasoning_layer_used: POB lexical decision for בָּמוֹת and theological decision on Isaac
  rationale: This makes the sites’ religious function clear while retaining the source text’s name “Isaac.”
- pob_phrase: will be made desolate ... will be laid waste
  simplified_phrase: will be devastated ... will be reduced to ruins
  preserved_meaning: Both clauses announce severe devastation as divine judgment.
  reasoning_layer_used: POB lexical decisions for וְנָשַׁמּוּ and יֶחֱרָבוּ
  rationale: This clear wording preserves the destructive force and parallel judgment imagery.
- pob_phrase: the house of Jeroboam
  simplified_phrase: Jeroboam’s royal house
  preserved_meaning: God opposes Jeroboam’s ruling family and dynastic line.
  reasoning_layer_used: POB lexical decision for בֵּית יָרָבְעָם
  rationale: “Royal house” clarifies the familial and dynastic idiom without suggesting a building.
