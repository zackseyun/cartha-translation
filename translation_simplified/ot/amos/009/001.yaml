translation:
  language: en
  text: 'I saw the Lord standing beside the altar,[a] and he said:


    “Strike the top of the structure,[b] so that its thresholds shake. Shatter its pieces over the heads of everyone there. I will kill with the sword anyone who survives. None who run away will get away, and none who escape will be rescued.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “standing on the altar.” The Hebrew may indicate standing on, at, or beside it.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew names the capital, the architectural feature at the top of the structure.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Strike the capital
  simplified_phrase: Strike the top of the structure
  preserved_meaning: The blow targets the upper architectural feature.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: This explains the unfamiliar architectural term without weakening the command.
- pob_phrase: shatter them on the heads of all of them
  simplified_phrase: Shatter its pieces over the heads of everyone there
  preserved_meaning: The shattered structural elements come down on all the people beneath them.
  reasoning_layer_used: POB lexical decision for וּבְצַעַם and footnote c
  rationale: The plural object is clarified as pieces rather than changed into the whole structure.
- pob_phrase: not one who flees among them will get away
  simplified_phrase: None who run away will get away
  preserved_meaning: Flight will not enable anyone to escape judgment.
  reasoning_layer_used: POB lexical decision for לֹא יָנוּס לָהֶם נָס
  rationale: The emphatic denial is recast in direct common English.
interpretive_expansions:
- pob_phrase: their survivors
  rendering: anyone who survives
  claim: These are people left alive after the structural destruction.
  evidence:
  - The preceding command describes shattered pieces falling on everyone present.
  - The POB rationale identifies them as survivors of the initial destruction.
  confidence: high
  alternatives_preserved:
  - their remnant
translation_notes:
  risk_flags:
  - risk: “Top of the structure” is broader than the architectural term “capital.”
    mitigation: Footnote b retains the precise term and identifies its location.
  - risk: The Hebrew may picture the Lord standing on rather than beside the altar.
    mitigation: Footnote a preserves the spatial ambiguity.
