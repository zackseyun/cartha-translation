translation:
  language: en
  text: so that they may take possession of the remnant of Edom and all the nations I have claimed as my own,” declares Yahweh,[a] who will do this.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “all the nations over whom my name is called,” a Hebrew expression meaning that they belong to Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek form quoted in Acts 15:17 differs notably: “so that the rest of mankind may seek the Lord, and all the nations upon whom my name has been called.”'
    reason: textual_variant
