translation:
  language: en
  text: “Look! The days are coming,” declares Yahweh, “when the one plowing will catch up with the one still harvesting, and the one treading grapes will catch up with the one already sowing seed. The mountains will drip with sweet wine, and all the hills will overflow.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Behold, days are coming
  simplified_phrase: Look! The days are coming
  preserved_meaning: The prophetic announcement calls for attention and points to a future time.
  reasoning_layer_used: POB lexical decisions for הִנֵּה and יָמִים בָּאִים
  rationale: “Look!” gives the prophetic attention-getter immediate force in common English.
- pob_phrase: the plowman will overtake the reaper
  simplified_phrase: the one plowing will catch up with the one still harvesting
  preserved_meaning: The next season’s work begins before the abundant harvest has ended.
  reasoning_layer_used: POB lexical rationale and cultural footnote c
  rationale: Active wording replaces older farming titles while keeping the overlap of seasons clear.
- pob_phrase: the mountains will drip sweet wine, and all the hills will melt
  simplified_phrase: The mountains will drip with sweet wine, and all the hills will overflow
  preserved_meaning: The landscape is pictured as overflowing with extraordinary agricultural abundance.
  reasoning_layer_used: POB lexical decisions for וְהִטִּיפוּ, עָסִיס, and תִּתְמוֹגַגְנָה
  rationale: “Overflow” preserves the positive force of the melting image without suggesting destruction.
interpretive_expansions:
- pob_phrase: will overtake ... the one who sows the seed
  rendering: will catch up with the one still harvesting ... the one already sowing seed
  claim: “Still” and “already” make the overlap of agricultural seasons explicit.
  evidence:
  - POB footnote c says one season’s work begins before the previous season has ended.
  - The lexical rationale for וְנִגַּשׁ identifies compressed harvest cycles.
  confidence: high
  alternatives_preserved:
  - Literal agricultural abundance
  - Broader poetic restoration imagery
- pob_phrase: all the hills will melt
  rendering: all the hills will overflow
  claim: The hills’ melting describes overflowing fertility rather than destruction.
  evidence:
  - The POB lexical rationale identifies overflowing fertility as the metaphor’s contextual force.
  - The surrounding clauses portray extraordinary agricultural abundance.
  confidence: high
  alternatives_preserved:
  - The underlying Hebrew image is literally one of melting or dissolving.
translation_notes:
  risk_flags:
  - risk: “Overflow” makes the contextual meaning clearer but does not directly retain the Hebrew melting image.
    mitigation: The audit records the literal image and the POB rationale supporting the contextual rendering.
