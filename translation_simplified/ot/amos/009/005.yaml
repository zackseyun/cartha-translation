  preserved_meaning: The entire earth moves like the Nile as it rises and sinks.
  reasoning_layer_used: POB lexical decisions for כֻּלָּהּ, יְאֹר, and וְשָׁקְעָה
  rationale: The sentence avoids repetition while preserving both movements and the Nile image.
