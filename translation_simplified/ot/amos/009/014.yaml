translation:
  language: en
  text: I will restore the well-being of my people Israel.[a] They will rebuild the ruined cities and live in them. They will plant vineyards and drink the wine they produce. They will make gardens and eat the fruit they grow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “I will bring back the captives of my people Israel.” The Hebrew expression can refer both to return from captivity and to a broader recovery from distress.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: restore the fortunes of my people Israel
  simplified_phrase: restore the well-being of my people Israel
  preserved_meaning: God will reverse Israel’s distress and renew the people’s overall condition.
  reasoning_layer_used: lexical and theological decisions on the Hebrew restoration formula
  rationale: “Well-being” explains the broad restoration without narrowing it to financial prosperity.
- pob_phrase: rebuild ruined cities and inhabit them
  simplified_phrase: rebuild the ruined cities and live in them
  preserved_meaning: The people will restore their devastated cities and settle in them again.
  reasoning_layer_used: lexical decisions for rebuilding, ruined cities, and dwelling
  rationale: “Live in them” is clearer common English than “inhabit them.”
- pob_phrase: drink their wine ... eat their fruit
  simplified_phrase: drink the wine they produce ... eat the fruit they grow
  preserved_meaning: The people will enjoy the produce of the vineyards and gardens they establish.
  reasoning_layer_used: lexical decisions on the suffix references and agricultural context
  rationale: The wording makes the agricultural references immediately clear.
