translation:
  language: en
  text: And if they go as captives under the power of their enemies, even there I will command the sword, and it will kill them. I will keep my eyes fixed on them for harm, not for good.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “disaster.” Here “harm” means calamity brought as judgment, not moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: go into captivity before their enemies
  simplified_phrase: go as captives under the power of their enemies
  preserved_meaning: They enter captivity and come under enemy control.
  reasoning_layer_used: POB lexical decisions for בַשְּׁבִי and לִפְנֵי אֹיְבֵיהֶם
  rationale: This makes the enemy-control idiom clear without adding an unsupported direction of travel.
- pob_phrase: from there I will command the sword, and it will kill them
  simplified_phrase: even there I will command the sword, and it will kill them
  preserved_meaning: Captivity cannot place them beyond God's judgment, and the sword remains his commanded agent.
  reasoning_layer_used: POB lexical rationale for מִשָּׁם and אֲצַוֶּה אֶת־הַחֶרֶב
  rationale: “Even there” clarifies the contrast while preserving the vivid personification of the sword.
- pob_phrase: I will set my eyes on them for harm and not for good
  simplified_phrase: I will keep my eyes fixed on them for harm, not for good
  preserved_meaning: God directs his attention toward them for harmful judgment rather than good.
  reasoning_layer_used: POB lexical and theological decisions for עֵינִי and רָעָה
  rationale: The wording explains the eye image while retaining the source's contrast without adding purpose language.
