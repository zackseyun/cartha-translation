translation:
  language: en
  text: Even if they dig down into Sheol[a], my hand will take them from there. Even if they climb up to the heavens, I will bring them down from there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol means the realm of the dead; it can also be translated “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Though they dig into Sheol
  simplified_phrase: Even if they dig down into Sheol
  preserved_meaning: No attempt to escape into the realm of the dead can succeed.
  reasoning_layer_used: Lexical and theological decisions on יַחְתְּרוּ, שְׁאוֹל, and the concessive clauses.
  rationale: “Even if” states the concession naturally, while “dig down” keeps the concrete downward escape image.
- pob_phrase: from there my hand will take them
  simplified_phrase: my hand will take them from there
  preserved_meaning: God's reach and power extend even into Sheol.
  reasoning_layer_used: Lexical decision on יָדִי and תִּקָּחֵם.
  rationale: The reordered phrase reads naturally without removing the vivid image of God's hand.
- pob_phrase: and though they climb up to the heavens
  simplified_phrase: Even if they climb up to the heavens
  preserved_meaning: No attempt to escape to the highest cosmic realm can succeed.
  reasoning_layer_used: Lexical decisions on יַעֲלוּ, הַשָּׁמַיִם, and אִם ... וְאִם.
  rationale: A new sentence makes the parallel easier to follow while retaining “the heavens.”
translation_notes:
  risk_flags:
  - risk: Modern readers may not know the term “Sheol.”
    mitigation: The anchored footnote explains it without narrowing the main text to only the grave.
