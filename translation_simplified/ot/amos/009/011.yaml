translation:
  language: en
  text: In that day I will raise up David’s fallen shelter.[a] I will wall up its broken places, raise up its ruins, and rebuild it as in the days of old.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “David’s fallen booth.” This fragile shelter is a picture of David’s fallen royal house or dynasty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the fallen shelter of David
  simplified_phrase: David’s fallen shelter
  preserved_meaning: The collapsed shelter image still points to David’s humbled royal house.
  reasoning_layer_used: Lexical and theological decisions on סֻכַּת דָּוִיד
  rationale: The possessive form is more natural, while the footnote explains the metaphor without replacing it.
- pob_phrase: wall up its breaches
  simplified_phrase: wall up its broken places
  preserved_meaning: God will close the damaged openings in the fallen structure.
  reasoning_layer_used: Lexical decisions on וְגָדַרְתִּי and פִּרְצֵיהֶן
  rationale: “Broken places” clarifies the architectural damage while preserving the wall-building image.
- pob_phrase: as in the days of old
  simplified_phrase: as in the days of old
  preserved_meaning: The rebuilding is compared with former or ancient days, not abstract eternity.
  reasoning_layer_used: Lexical decision on כִּימֵי עוֹלָם and grounding review
  rationale: Retaining the temporal comparison avoids specifying the shelter’s former condition beyond the text.
translation_notes:
  risk_flags:
  - risk: Readers may understand David’s shelter as only a literal building.
    mitigation: The footnote identifies its metaphorical royal significance while retaining the fragile-shelter image.
