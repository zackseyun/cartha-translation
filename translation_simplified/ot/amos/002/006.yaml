translation:
  language: en
  text: 'This is what Yahweh says:


    “Because Israel has committed transgression after transgression—three, even four—I will not cancel the punishment.[a] They sell righteous people for silver and needy people for a pair of sandals.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “I will not turn it back,” leaving what “it” refers to unstated; it likely means the announced punishment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: Yahweh introduces his authoritative prophetic message.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר יְהוָה.
  rationale: The common formula is clearer in ordinary English without weakening its authority.
- pob_phrase: For three transgressions of Israel, and for four
  simplified_phrase: Because Israel has committed transgression after transgression—three, even four
  preserved_meaning: Israel's repeated covenant-breaking has brought judgment.
  reasoning_layer_used: Lexical rationale for the numerical escalation and פֶּשַׁע.
  rationale: The wording explains repetition while retaining the escalating numbers without adding a temporal sequence.
- pob_phrase: the righteous for silver, and the needy for a pair of sandals
  simplified_phrase: righteous people for silver and needy people for a pair of sandals
  preserved_meaning: They sell those who are righteous or in the right and those in need for degradingly little.
  reasoning_layer_used: Lexical decisions for צַדִּיק, אֶבְיוֹן, silver, and sandals.
  rationale: Using “people” makes the groups concrete while preserving silver and the sandals image.
interpretive_expansions:
- pob_phrase: For three transgressions of Israel, and for four
  rendering: Because Israel has committed transgression after transgression—three, even four
  claim: The numerical escalation presents Israel's transgressions as repeated and mounting rather than merely listing four offenses.
  evidence:
  - The POB rationale identifies this as Amos's idiomatic numerical escalation formula.
  - The POB retains “transgressions” for its covenantal and moral force.
  confidence: high
  alternatives_preserved:
  - For three transgressions of Israel, and for four
translation_notes:
  risk_flags:
