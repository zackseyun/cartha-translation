    mitigation: The footnote preserves the Hebrew ellipsis and qualifies punishment as the likely referent.
  - risk: “Transgression after transgression” interprets the numerical formula as repeated rebellion.
    mitigation: The main text retains the source's escalating “three, even four” wording.
