translation:
  language: en
  text: Yet I destroyed the Amorite before them.[a] He was as tall as cedars and as strong as oaks. I destroyed his fruit above and his roots below.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Amorite” is singular in Hebrew but refers collectively to the Amorite people.
    reason: lexical_alternative
  - marker: b
    text: The fruit and roots continue the tree picture and show complete destruction from top to bottom.
    reason: cultural_note
simplification_decisions:
- pob_phrase: whose height was like the height of cedars
  simplified_phrase: He was as tall as cedars
  preserved_meaning: The Amorite is compared to the great height of cedar trees.
  reasoning_layer_used: POB lexical decision
  rationale: The shorter comparison keeps the cedar image without the repeated word “height.”
- pob_phrase: and he was strong like the oaks
  simplified_phrase: and as strong as oaks
  preserved_meaning: The Amorite's strength is compared to the strength of oak trees.
  reasoning_layer_used: POB lexical decision
  rationale: Parallel wording makes the two tree comparisons easier to follow.
- pob_phrase: his roots beneath
  simplified_phrase: his roots below
  preserved_meaning: The lower part of the tree image is destroyed along with its fruit above.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Below” is more common English while preserving the top-to-bottom image.
translation_notes:
  risk_flags:
  - risk: Modern readers may think “the Amorite” means one man.
    mitigation: Footnote a explains that the singular personifies the whole Amorite people.
  - risk: Readers may take the fruit and roots only as literal tree parts.
    mitigation: Footnote b explains that the image portrays complete destruction.
