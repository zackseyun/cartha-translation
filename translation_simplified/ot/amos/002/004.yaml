translation:
  language: en
  text: 'Thus says Yahweh:


    “For three rebellions of Judah,

    and for four,

    I will not turn it back.[a]

    They have rejected Yahweh’s law[b]

    and have not obeyed his commands.

    Their lies have led them astray—[c]

    the same lies their ancestors followed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will not revoke it,” referring to the announced judgment or punishment.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh’s law” may also be translated “Yahweh’s instruction.”
    reason: lexical_alternative
  - marker: c
    text: “Their lies” may refer more specifically to false gods or idols—deceptive objects of worship that their ancestors followed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: three transgressions of Judah
  simplified_phrase: three rebellions of Judah
  preserved_meaning: Judah has committed serious covenant offenses against Yahweh.
  reasoning_layer_used: POB lexical decision for פִּשְׁעֵי
  rationale: “Rebellions” is an approved alternative that clearly conveys deliberate covenant wrongdoing.
- pob_phrase: have not kept his statutes
  simplified_phrase: have not obeyed his commands
  preserved_meaning: Judah failed to obey Yahweh’s covenant requirements.
  reasoning_layer_used: POB lexical decisions for חֻקָּיו and שָׁמָרוּ
  rationale: This expresses the legal phrase in familiar English without weakening its force.
- pob_phrase: after which their fathers walked
  simplified_phrase: the same lies their ancestors followed
  preserved_meaning: Their ancestors followed the same lies that misled Judah.
  reasoning_layer_used: POB lexical rationale for אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  rationale: The revision makes the direct link to “lies” clear while naturally expressing the “walk after” idiom.
translation_notes:
  risk_flags:
  - risk: “I will not turn it back” leaves its object unstated and may seem unclear.
    mitigation: The text preserves the source ambiguity, while footnote a gives the likely reference to judgment.
  - risk: Readers may take “their lies” to mean only spoken dishonesty.
    mitigation: Footnote c notes the possible reference to false gods or idols without narrowing the main text.
