translation:
  language: en
  text: So I will send fire against Moab, and it will burn up the fortified palaces of Kerioth.[a] Moab will die in the uproar, with shouting and the blast of a trumpet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kerioth may instead mean “the cities,” but it is more likely the name of a place here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: send fire upon Moab
  simplified_phrase: send fire against Moab
  preserved_meaning: God directly sends destructive fire as judgment on Moab.
  reasoning_layer_used: Lexical decision for בְּמוֹאָב and prophetic judgment context
  rationale: “Against” expresses hostile direction more naturally in modern English.
- pob_phrase: consume the citadels of Kerioth
  simplified_phrase: burn up the fortified palaces of Kerioth
  preserved_meaning: The fire destroys Kerioth’s elite fortified buildings.
  reasoning_layer_used: Lexical decisions for וְאָכְלָה and אַרְמְנוֹת
  rationale: The wording explains both the fire image and the defensive-palatial sense of “citadels.”
- pob_phrase: amid the sound of a trumpet
  simplified_phrase: with the blast of a trumpet
  preserved_meaning: Moab falls while a war trumpet is loudly sounding.
  reasoning_layer_used: Lexical decision for בְּקוֹל שׁוֹפָר
  rationale: “Blast” clearly conveys the trumpet’s forceful sound without adding commentary.
translation_notes:
  risk_flags:
  - risk: “Fortified palaces” may sound less conventional than “citadels.”
    mitigation: It preserves both the defensive and elite-building senses documented in the lexical rationale.
  - risk: Readers may take Kerioth only as a place-name despite the source ambiguity.
    mitigation: The footnote preserves the possible reading “the cities.”
