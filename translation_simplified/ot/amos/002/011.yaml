translation:
  language: en
  text: From among your sons, I raised up prophets. From among your young men, I raised up Nazirites.[a] Sons of Israel,[b] isn’t that true? declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nazirites were people specially set apart for God under a Nazirite vow.
    reason: cultural_note
  - marker: b
    text: The Hebrew literally says “sons of Israel,” a covenant address to the nation.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And I raised up some of your sons to be prophets
  simplified_phrase: From among your sons, I raised up prophets.
  preserved_meaning: Yahweh appointed prophets from within Israel’s own sons.
  reasoning_layer_used: Lexical decision for וָאָקִים and the partitive מִבְּנֵיכֶם
  rationale: The recast sentence keeps the “raised up” image while making the partitive relationship immediate.
- pob_phrase: and some of your young men to be Nazirites
  simplified_phrase: From among your young men, I raised up Nazirites.
  preserved_meaning: Yahweh also raised Nazirites from Israel’s young men.
  reasoning_layer_used: Lexical and theological decisions for בַּחוּר and נָזִיר
  rationale: A separate sentence clarifies the parallel action while retaining the specific term “Nazirites.”
- pob_phrase: Is this not so, O sons of Israel?
  simplified_phrase: Sons of Israel, isn’t that true?
  preserved_meaning: Yahweh directly calls Israel to affirm what he did among them.
  reasoning_layer_used: Lexical decision for the rhetorical question and theological decision on the covenant address
  rationale: Natural question order replaces the formal “O” without weakening the expected agreement.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what Nazirites were.
    mitigation: A brief cultural footnote explains their consecrated status without replacing the technical term.
  - risk: “Sons of Israel” may sound limited to individual males.
    mitigation: A note identifies it as the retained covenant address to the nation.
