translation:
  language: en
  text: Come to Bethel and rebel. Come to Gilgal and rebel even more. Bring your sacrifices every morning and your one-tenth offerings every three days[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the third day” or “after three days.”
