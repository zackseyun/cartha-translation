simplification_decisions:
- pob_phrase: and transgress
  simplified_phrase: and rebel
  preserved_meaning: The worshipers’ actions are serious covenant rebellion.
  reasoning_layer_used: POB lexical decision
  rationale: “Rebel” is common English and retains the force of the source verb without adding an unstated object.
- pob_phrase: and multiply transgression
  simplified_phrase: and rebel even more
  preserved_meaning: Going to Gilgal increases their rebellion rather than correcting it.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This clearly expresses intensification while preserving the ironic command.
- pob_phrase: your tithes
  simplified_phrase: your one-tenth offerings
  preserved_meaning: These are religious offerings consisting of a tenth.
  reasoning_layer_used: POB lexical decision
  rationale: This explains an unfamiliar ritual term in the main text.
translation_notes:
  risk_flags:
