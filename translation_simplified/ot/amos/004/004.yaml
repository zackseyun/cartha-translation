    mitigation: The direct commands remain paired with rebellion so the contextual irony is preserved without commentary.
  - risk: The timing of the one-tenth offerings is genuinely ambiguous.
    mitigation: The POB main reading stays in the text, and the alternatives remain in the footnote.
