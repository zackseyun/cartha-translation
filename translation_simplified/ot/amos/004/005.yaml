  simplified_phrase: Proclaim voluntary offerings—announce them publicly!
  preserved_meaning: The Israelites are commanded to publicize offerings given voluntarily.
  reasoning_layer_used: POB lexical decisions for נְדָבוֹת and הַשְׁמִיעוּ
  rationale: “Voluntary” is clearer than “freewill,” while both commands remain distinct.
- pob_phrase: For this is what you have loved
  simplified_phrase: This is what you have loved to do
  preserved_meaning: The commanded practices reflect Israel’s settled desire.
  reasoning_layer_used: POB lexical rationale for כִּי כֵן אֲהַבְתֶּם
  rationale: Adding “to do” makes the accusation natural without weakening its force.
- pob_phrase: O sons of Israel
