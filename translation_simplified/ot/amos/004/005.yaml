  preserved_meaning: The prophet directly addresses the sons of Israel.
  reasoning_layer_used: POB gender-accurate lexical policy for בְּנֵי יִשְׂרָאֵל
  rationale: Removing archaic “O” clarifies the address without neutralizing it.
