translation:
  language: en
  text: Burn a thank offering from leavened bread.[a] Proclaim voluntary offerings—announce them publicly! This is what you have loved to do, sons of Israel, declares the Lord GOD.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew links leavened material with the thank offering; it may also be translated “with leaven” or “of leavened bread.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title is “Lord Yahweh”; GOD represents the divine name Yahweh.
    reason: source_note
