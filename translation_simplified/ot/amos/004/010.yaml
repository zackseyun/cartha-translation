translation:
  language: en
  text: I sent a plague among you, like the judgment on Egypt.[a] I killed your young men with the sword while your horses were captured.[b] I made the stench from your camps rise into your nostrils. Yet you did not return to me, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as Egypt was struck”; this points to God’s judgments on Egypt, not a road to Egypt.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the captivity of your horses” and describes their loss in military defeat.
    reason: lexical_alternative
