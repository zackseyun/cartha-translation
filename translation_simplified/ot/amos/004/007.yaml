- pob_phrase: when there were still three months until the harvest
  simplified_phrase: when the harvest was still three months away
  preserved_meaning: The drought came during the crucial months before harvest.
  reasoning_layer_used: POB lexical decision for בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  rationale: The revised wording states the same time relationship in more natural English.
- pob_phrase: I caused it to rain on one city, but on another city I did not cause it to rain
  simplified_phrase: I made it rain on one city, but I did not make it rain on another
  preserved_meaning: God directly determined where rain fell and where it did not.
  reasoning_layer_used: POB theological decision on divine agency
  rationale: “Made it rain” is clearer while preserving the causative verbs and deliberate contrast.
- pob_phrase: the field on which it did not rain dried up
  simplified_phrase: another field received none and dried up
  preserved_meaning: The field without rain became dry as a result.
  reasoning_layer_used: POB lexical decisions for תַמְטִיר and תִּיבָשׁ
  rationale: The shorter clause avoids an awkward relative construction without weakening the result.
