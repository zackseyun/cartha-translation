translation:
  language: en
  text: For look—he forms the mountains and creates the wind.[a] He reveals a man’s own thoughts to him.[b][c] He turns dawn into darkness and treads on the heights of the earth. His name is Yahweh, the God of heaven’s armies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “creates the spirit”; the Hebrew word can mean wind, breath, or spirit.
    reason: lexical_alternative
  - marker: b
    text: “A man” represents humankind here.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may also refer to what a person is thinking or meditating on.
    reason: lexical_alternative
