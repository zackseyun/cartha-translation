- pob_phrase: as God overthrew Sodom and Gomorrah
  simplified_phrase: just as God overthrew Sodom and Gomorrah
  preserved_meaning: God’s judgment is compared with his overthrow of Sodom and Gomorrah.
  reasoning_layer_used: POB lexical decision for כְּמַהְפֵּכַת אֱלֹהִים
  rationale: “Just as” makes the comparison immediately clear.
- pob_phrase: like a brand snatched from the burning
  simplified_phrase: like a burning piece of wood snatched from the flames
  preserved_meaning: The survivors are pictured as wood pulled from a destructive fire.
  reasoning_layer_used: POB lexical decisions for כְּאוּד, מֻצָּל, and מִשְּׂרֵפָה
  rationale: The concrete wording explains “brand” while preserving the fire image.
- pob_phrase: yet you did not return to me
  simplified_phrase: Yet you did not return to me
  preserved_meaning: The people still failed to turn back to Yahweh in covenant repentance.
  reasoning_layer_used: POB theological decision for שׁוב
  rationale: This clear wording preserves the full prophetic call to return.
