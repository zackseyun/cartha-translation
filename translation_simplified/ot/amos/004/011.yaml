translation:
  language: en
  text: I overthrew some of you,[a] just as God overthrew Sodom and Gomorrah. You became like a burning piece of wood snatched from the flames. Yet you did not return to me, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated simply “among you,” without explicitly saying “some.”
    reason: lexical_alternative
