translation:
  language: en
  text: Listen to this message, you cows of Bashan,[a] who are on Samaria’s hill! You oppress the poor and crush those in need. You tell your masters,[b] “Bring, so we can drink!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bashan was a fertile region famous for well-fed cattle. The prophet uses this image as a biting insult against wealthy, self-indulgent women who oppress others.
    reason: cultural_note
  - marker: b
    text: Or “husbands.” The Hebrew word can mean masters, lords, or husbands in this context.
    reason: alternative_reading
