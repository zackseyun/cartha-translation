  preserved_meaning: God draws a conclusion from the preceding judgments and announces what he will do to Israel.
  reasoning_layer_used: lexical decisions for לָכֵן and כֹּה
  rationale: The direct address and ordinary word order replace the formal “thus” without weakening the prophetic transition.
- pob_phrase: because I will do this to you, prepare to meet your God, Israel
  simplified_phrase: Because I will do this to you, prepare to meet your God.
  preserved_meaning: God’s coming action is the reason Israel must prepare for the encounter.
