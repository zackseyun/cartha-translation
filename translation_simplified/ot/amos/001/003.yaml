    mitigation: The footnote identifies the implied object as Yahweh’s judgment without inserting it into the main text.
  - risk: The three-and-four formula may sound like a literal count to some readers.
    mitigation: The numerical escalation is retained because it is a deliberate recurring feature of Amos’s oracles.
