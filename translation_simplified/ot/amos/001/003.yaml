translation:
  language: en
  text: 'This is what Yahweh says:


    “For three acts of rebellion by Damascus—even for four—I will not take it back.[a] They crushed the people of Gilead as grain is crushed under iron threshing sledges.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, Yahweh will not reverse his judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The standard prophetic announcement remains direct and authoritative.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר יְהוָה and theological decision on the divine name
  rationale: The common formula is clearer in modern English while retaining Yahweh’s covenant name.
- pob_phrase: For three transgressions of Damascus, and for four
  simplified_phrase: For three acts of rebellion by Damascus—even for four
  preserved_meaning: The Hebrew numerical escalation and the sense of deliberate offense are both retained.
  reasoning_layer_used: Lexical decision for עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  rationale: “Acts of rebellion” is more immediately understandable than “transgressions” without reducing the offenses to generic sins.
- pob_phrase: they threshed Gilead with threshing sledges of iron
  simplified_phrase: They crushed the people of Gilead as grain is crushed under iron threshing sledges
  preserved_meaning: The agricultural image still portrays Damascus’s brutal treatment of Gilead.
  reasoning_layer_used: Lexical decisions for דּוּשָׁם, בַּחֲרֻצוֹת הַבַּרְזֶל, and אֶת הַגִּלְעָד
  rationale: The recast comparison explains the unfamiliar image while preserving its force and iron implement.
