translation:
  language: en
  text: This is the message Amos saw in a vision concerning Israel.[a] Amos was one of the sheep breeders from Tekoa. He received this message during the reigns of Uzziah king of Judah and Jeroboam son of Joash, king of Israel, two years before the earthquake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against Israel.” The Hebrew can have either sense here.
