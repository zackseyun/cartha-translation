- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: Yahweh introduces his authoritative message.
  reasoning_layer_used: POB lexical decision for the divine name
  rationale: The wording is natural English while retaining Yahweh and the prophetic formula.
- pob_phrase: three transgressions of Gaza
  simplified_phrase: three acts of wrongdoing by Gaza
  preserved_meaning: Gaza is guilty of serious moral offenses, not merely political revolt.
  reasoning_layer_used: POB lexical rationale for פִּשְׁעֵי
  rationale: Wrongdoing is broadly understandable and avoids narrowing the offense to political rebellion.
- pob_phrase: I will not revoke its punishment
  simplified_phrase: I will not cancel its punishment
  preserved_meaning: Yahweh will not withdraw the announced judgment against Gaza.
  reasoning_layer_used: POB theological decision on the implied object
  rationale: Cancel uses common English while preserving the finality of the judgment formula.
