translation:
  language: en
  text: 'This is what Yahweh says: “For three acts of wrongdoing by Gaza, and for four,[a] I will not cancel its punishment, because they carried away an entire population into exile in order to hand them over to Edom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This increasing number emphasizes Gaza’s overflowing guilt rather than merely counting four offenses.
    reason: source_note
