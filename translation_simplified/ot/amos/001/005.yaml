translation:
  language: en
  text: “I will break the bar that secures the gate of Damascus. I will destroy those who live in the Valley of Aven[a] and the ruler who holds the scepter in Beth-eden[b]. The people of Aram will go into exile to Kir,” says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name Aven may echo a Hebrew word meaning “wickedness” or “trouble.”
    reason: lexical_alternative
  - marker: b
    text: Beth-eden can mean “house of Eden” and may refer to the place historically known as Bit-Adini.
    reason: alternative_reading
