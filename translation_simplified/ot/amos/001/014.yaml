  text: I will set fire to Rabbah’s wall, and the fire will destroy her strongholds. This destruction will come amid a battle cry[a] on the day of war and a storm on the day of tempest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also refer to a loud alarm or a trumpet blast.
    reason: lexical_alternative
  - marker: b
    text: The storm may also suggest the LORD coming as a warrior to judge, while still describing wartime destruction.
    reason: cross_reference
