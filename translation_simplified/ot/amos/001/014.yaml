- pob_phrase: I will kindle a fire in the wall of Rabbah
  simplified_phrase: I will set fire to Rabbah’s wall
  preserved_meaning: The speaker causes literal fire to burn Rabbah’s city wall as an act of judgment.
  reasoning_layer_used: Lexical decisions for וְהִצַּתִּי, אֵשׁ, and בְּחוֹמַת רַבָּה
  rationale: The direct wording replaces the less common “kindle” without changing the causative image.
- pob_phrase: it will consume her citadels
  simplified_phrase: the fire will destroy her strongholds
  preserved_meaning: The fire destroys Rabbah’s prominent fortified structures while the city remains personified as feminine.
  reasoning_layer_used: Lexical decision for אַרְמְנוֹתֶיהָ and theological decision on the feminine suffix
  rationale: “Strongholds” is a documented alternative that is clearer than “citadels” and keeps “her.”
- pob_phrase: with a battle cry on the day of war, with a storm on the day of tempest
  simplified_phrase: This destruction will come amid a battle cry on the day of war and a storm on the day of tempest
  preserved_meaning: The military destruction is accompanied by both martial uproar and storm imagery.
  reasoning_layer_used: Lexical decisions for בִּתְרוּעָה, בְּיוֹם מִלְחָמָה, בְּסַעַר, and בְּיוֹם סוּפָה
  rationale: A new sentence makes the parallel images easier to follow without resolving their relationship.
