translation:
  language: en
  text: 'This is what Yahweh says: “Tyre has committed three crimes—indeed, four.[a] I will not cancel its punishment, because its people handed over a whole community of exiles to Edom and disregarded a brotherly covenant.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Three crimes—indeed, four” is a poetic way of emphasizing Tyre’s repeated wrongdoing.
    reason: simplification_note
