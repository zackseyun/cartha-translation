translation:
  language: en
  text: Seek Yahweh, and you will live. Otherwise, he will burst out like fire inside the house of Joseph and burn it up. Bethel will have no one to put out the fire.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fire will burst out”; Hebrew leaves the subject unstated, though Yahweh is most likely meant.
    reason: alternative_reading
  - marker: b
    text: The “house of Joseph” means the northern kingdom of Israel, and Bethel was one of its major worship centers.
    reason: cultural_note
simplification_decisions:
- pob_phrase: lest he break out like fire
  simplified_phrase: Otherwise, he will burst out like fire
  preserved_meaning: The warning portrays Yahweh’s judgment as fire suddenly breaking out if the people refuse to seek him.
  reasoning_layer_used: Lexical and theological decisions on פֶּן and יִצְלַח
  rationale: “Otherwise” and “will burst out” state the warned consequence clearly without weakening it to a possibility.
- pob_phrase: and it consume
  simplified_phrase: and burn it up
  preserved_meaning: The fire consumes the house of Joseph.
  reasoning_layer_used: Lexical decision on וְאָכְלָה
  rationale: “Burn it up” supplies the implied object while preserving the fire image.
- pob_phrase: with no one to quench it for Bethel
  simplified_phrase: Bethel will have no one to put out the fire
  preserved_meaning: No one will be available to extinguish the judgment connected with Bethel.
  reasoning_layer_used: Lexical and theological decisions on וְאֵין מְכַבֶּה לְבֵית אֵל
  rationale: The new sentence makes the difficult construction understandable while retaining Bethel as a place name.
