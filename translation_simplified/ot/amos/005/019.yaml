translation:
  language: en
  text: It will be like a man fleeing from a lion, only to meet a bear[a]. He goes into a house and rests his hand against the wall, but a snake[b] bites him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the bear encounters him or falls upon him.
    reason: lexical_alternative
  - marker: b
    text: Or “serpent.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It will be as when a man flees from before the lion
  simplified_phrase: It will be like a man fleeing from a lion
  preserved_meaning: The comparison still portrays a man urgently escaping a lion.
  reasoning_layer_used: POB lexical decisions for כַּאֲשֶׁר, יָנוּס, and מִפְּנֵי
  rationale: Natural English removes the opaque phrase “from before” without weakening the danger.
- pob_phrase: and the bear meets him; then he enters the house
  simplified_phrase: only to meet a bear. He goes into a house
  preserved_meaning: One danger immediately replaces another before the man seeks safety indoors.
  reasoning_layer_used: POB lexical decisions for וּפְגָעוֹ and וּבָא הַבַּיִת
  rationale: Two short sentences make the rapid sequence easier to follow.
- pob_phrase: leans his hand on the wall
  simplified_phrase: rests his hand against the wall
  preserved_meaning: The man places his hand on the wall in apparent safety before the final danger.
  reasoning_layer_used: POB lexical decisions for וְסָמַךְ יָדוֹ and עַל הַקִּיר
  rationale: “Rests” and “against” describe the concrete action in ordinary English.
