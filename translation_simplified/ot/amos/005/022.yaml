translation:
  language: en
  text: For even if you offer me burnt offerings and grain offerings, I will not accept them. I will not look with favor on the peace offerings[a] from your fattened animals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offerings.” This was a sacrifice connected with well-being and shared fellowship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: offer up to me burnt offerings and your grain offerings
  simplified_phrase: offer me burnt offerings and grain offerings
  preserved_meaning: The offerings remain distinct kinds of sacrifices presented to God.
  reasoning_layer_used: Lexical and theological decisions on sacrificial categories
  rationale: Removing “up” makes the clause more natural without generalizing the sacrifices.
- pob_phrase: I will not accept them; and I will not look upon
  simplified_phrase: I will not accept them. I will not look with favor on
  preserved_meaning: God refuses both acceptance and favorable regard.
  reasoning_layer_used: Lexical decisions for רצה and נבט
  rationale: Two sentences clarify the parallel refusals while keeping the visual image of looking.
- pob_phrase: the peace offerings of your fattened animals
  simplified_phrase: the peace offerings from your fattened animals
  preserved_meaning: The specific sacrifice and the specially fed livestock remain explicit.
  reasoning_layer_used: Lexical decisions for שֶׁלֶם and מְרִיאֵיכֶם
  rationale: “From” states the relationship in ordinary modern English.
