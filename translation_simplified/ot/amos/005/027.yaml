translation:
  language: en
  text: “So I will send you away as exiles beyond Damascus,” says Yahweh. “The God of hosts[a] is his name.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means assembled forces or armies; the Hebrew does not specify whether they are earthly or heavenly.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Therefore I will send you into exile
  simplified_phrase: So I will send you away as exiles
  preserved_meaning: Yahweh will cause the people to leave their land in exile as judgment.
  reasoning_layer_used: POB lexical decision for the Hiphil of גלה and contextual conjunction
  rationale: The rewrite explains exile as being sent away while preserving the verb’s causative force.
- pob_phrase: whose name is the God of hosts
  simplified_phrase: The God of hosts is his name
  preserved_meaning: The divine title is explicitly identified as Yahweh’s name.
  reasoning_layer_used: POB lexical and theological decisions for שְׁמוֹ and אֱלֹהֵי צְבָאוֹת
  rationale: A separate sentence makes the Hebrew name clause easier to follow without narrowing “hosts” to one kind of army.
