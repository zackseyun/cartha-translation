translation:
  language: en
  text: Seek what is good, not what is evil, so that you may live. Then Yahweh, the God of armies, will be with you, as you have said he is.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “as you say he is.” The title “God of armies” may include both heavenly and earthly armies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Seek good and not evil
  simplified_phrase: Seek what is good, not what is evil
  preserved_meaning: The command keeps the sharp moral contrast between good and evil.
  reasoning_layer_used: POB lexical decisions for טוֹב and וְאַל רָע
  rationale: Adding “what is” makes the paired objects sound natural in common English.
- pob_phrase: and so Yahweh ... will be with you
  simplified_phrase: Then Yahweh ... will be with you
  preserved_meaning: Yahweh’s presence remains a consequence of seeking good rather than an unconditional claim.
  reasoning_layer_used: POB theological decision on contingent divine presence
  rationale: A new sentence with “Then” makes the consequence immediately clear.
- pob_phrase: the God of hosts
  simplified_phrase: the God of armies
  preserved_meaning: The divine title retains its military image and broad possible reference.
  reasoning_layer_used: POB lexical decision for אֱלֹהֵי צְבָאוֹת
  rationale: “Armies” communicates the older word “hosts” to modern readers.
interpretive_expansions:
- pob_phrase: as you have said
  rendering: as you have said he is
  claim: Israel had claimed that Yahweh was with them.
  evidence:
  - The POB rationale identifies the clause as referring to their prior claim of Yahweh’s presence.
  - The preceding words explicitly say that Yahweh will be with them.
  confidence: high
  alternatives_preserved:
  - as you say he is
translation_notes:
  risk_flags:
  - risk: “God of armies” may be heard as referring only to earthly forces.
    mitigation: The footnote preserves the possible heavenly and earthly scope.
