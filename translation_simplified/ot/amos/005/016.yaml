translation:
  language: en
  text: 'Therefore, this is what Yahweh, the God of hosts, the Lord, says: “There will be wailing in every public square. In every street people will cry, ‘Alas! Alas!’[a] They will call farmers to mourn and people who know how to lament to wail.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Woe! Woe!”; this is a cry of grief.
    reason: lexical_alternative
  - marker: b
    text: Literally “those who know lamentation,” probably people skilled in leading public mourning.
    reason: cultural_note
