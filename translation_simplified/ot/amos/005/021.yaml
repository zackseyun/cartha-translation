simplification_decisions:
- pob_phrase: I hate, I reject your festivals
  simplified_phrase: I hate and reject your festivals
  preserved_meaning: God both abhors the festivals and refuses to accept them.
  reasoning_layer_used: Lexical decisions for שָׂנֵאתִי and מָאַסְתִּי
  rationale: Adding “and” makes the two actions and their shared object immediately clear.
- pob_phrase: your solemn assemblies
  simplified_phrase: your religious gatherings
  preserved_meaning: These are formal gatherings for worship without implying God's approval.
  reasoning_layer_used: Lexical decision for בְּעַצְּרֹתֵיכֶם and grounding review
  rationale: “Religious gatherings” clearly conveys the cultic setting while avoiding an added suggestion of holiness.
- pob_phrase: I hate, I reject your festivals, and I will not delight in your solemn assemblies
  simplified_phrase: I hate and reject your festivals. I will take no delight in your religious gatherings.
  preserved_meaning: The declaration moves from hatred and rejection to refusal to take pleasure in their worship.
  reasoning_layer_used: Source syntax and theological decision on divine acceptance
  rationale: Two sentences make the progression easier to follow without weakening its force.
translation_notes:
  risk_flags:
