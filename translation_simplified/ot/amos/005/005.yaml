translation:
  language: en
  text: But do not go looking for God at Bethel. Do not enter Gilgal or cross over to Beersheba. Gilgal will certainly go into exile, and Bethel will be reduced to nothing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “Bethel will become Beth-aven.” This wordplay changes Bethel (“house of God”) into a name suggesting nothingness, wickedness, or disaster.
    reason: lexical_alternative
