  reasoning_layer_used: Lexical rationale and immediate context
  rationale: This makes the religious sense of “seek” clear while preserving its connection with seeking God.
- pob_phrase: Gilgal will surely go into exile
  simplified_phrase: Gilgal will certainly go into exile
  preserved_meaning: Gilgal’s exile is emphatically certain.
  reasoning_layer_used: Hebrew verbal intensification
  rationale: “Certainly” expresses the emphasis of the repeated Hebrew verb in common English.
- pob_phrase: Bethel will become nothingness
  simplified_phrase: Bethel will be reduced to nothing
  preserved_meaning: Bethel will collapse into emptiness and worthlessness under judgment.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The active expression is easier to understand without choosing among the word’s debated moral and disastrous senses.
