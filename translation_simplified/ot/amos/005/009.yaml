  preserved_meaning: The strong are abruptly overcome by destructive ruin.
  reasoning_layer_used: Lexical decisions for הַמַּבְלִיג, שֹׁד, and עָז.
  rationale: The direct clause replaces the dense participial expression while retaining suddenness and destruction.
- pob_phrase: so that destruction comes upon the fortress
  simplified_phrase: and destruction comes upon the fortress
  preserved_meaning: Destruction strikes a fortified stronghold as its target.
  reasoning_layer_used: Lexical decisions for וְשֹׁד, עַל, מִבְצָר, and יָבֹוא.
  rationale: The wording preserves the hostile force and military image while simplifying the connection.
