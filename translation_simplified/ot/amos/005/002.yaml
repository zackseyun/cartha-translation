translation:
  language: en
  text: Virgin Israel[a] has fallen. She will not rise again. She has been abandoned on her own land, with no one to raise her up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Virgin Israel” is a poetic name for the nation, not a statement about literal sexual status.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Fallen, virgin Israel will not rise again
  simplified_phrase: Virgin Israel has fallen. She will not rise again.
  preserved_meaning: Israel’s fall is decisive, while the prophetic title remains intact.
  reasoning_layer_used: Lexical and theological decisions on נָפְלָה, לֹא תוֹסִיף קוּם, and בְּתוּלַת יִשְׂרָאֵל.
  rationale: Two direct sentences clarify the lament without weakening its finality.
- pob_phrase: abandoned on her own land
  simplified_phrase: She has been abandoned on her own land
  preserved_meaning: The personified nation lies helpless on the land that belongs to her.
  reasoning_layer_used: Lexical decisions on נִטְּשָׁה and עַל אַדְמָתָהּ.
  rationale: A complete sentence is clearer while “on” preserves the spatial image of her fall.
- pob_phrase: she has no one to raise her up
  simplified_phrase: with no one to raise her up
  preserved_meaning: No rescuer or restorer is available, and the echo of “rise” remains.
  reasoning_layer_used: Lexical decision on אֵין מְקִימָהּ and the קום wordplay.
  rationale: The attached phrase keeps both her helplessness and the repeated rising image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “virgin Israel” as a literal description.
    mitigation: The footnote identifies it as a poetic name for the nation.
