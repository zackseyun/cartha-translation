translation:
  language: en
  text: Hate evil and love good. Establish justice at the city gate, where public cases are judged. Perhaps Yahweh, the God of hosts,[a] will show grace to the remnant of Joseph.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “God of hosts” is a divine title; “hosts” broadly refers to assembled forces and is not limited to human armies or heavenly beings.
    reason: source_note
  - marker: b
    text: “The remnant of Joseph” means the people of the northern kingdom who remain after judgment.
    reason: cross_reference
