translation:
  language: en
  text: But you, Bethlehem Ephrathah, are too small to be counted among the clans of Judah. Yet from you, one will come out for me and rule in Israel. His goings forth reach back to ancient times, to the days of eternity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “His origins are in ancient times, in days long ago.” The Hebrew may also point more strongly to existence from everlasting.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: too small to be among the clans of Judah
  simplified_phrase: too small to be counted among the clans of Judah
  preserved_meaning: Bethlehem is insignificant within Judah’s clan structure.
  reasoning_layer_used: lexical decision for צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  rationale: “Counted among” makes the social and administrative comparison easier to understand.
- pob_phrase: from you one will come out for me to be ruler in Israel
  simplified_phrase: from you, one will come out for me and rule in Israel
  preserved_meaning: God will bring a ruler for Israel out of Bethlehem.
  reasoning_layer_used: lexical decisions for מִמְּךָ לִי יֵצֵא and לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  rationale: The sentence uses ordinary coordination while retaining “come out,” “for me,” and “in Israel.”
- pob_phrase: whose goings forth are from of old, from the days of eternity
  simplified_phrase: His goings forth reach back to ancient times, to the days of eternity
  preserved_meaning: The ruler’s goings forth belong to remote antiquity, with possible eternal force.
  reasoning_layer_used: lexical and theological decisions for מוֹצָאֹתָיו מִקֶּדֶם מִימֵי עוֹלָם
  rationale: “Reach back” removes archaic syntax without replacing the guarded image of “goings forth.”
translation_notes:
  risk_flags:
  - risk: “Days of eternity” may sound like an explicit claim of eternal preexistence.
    mitigation: The footnote preserves the Hebrew range from ancient origin to existence from everlasting.
  - risk: “Goings forth” remains less familiar than “origins.”
    mitigation: The wording keeps the source image, while the footnote gives the clearer lexical alternative.
