translation:
  language: en
  text: He will be peace. When Assyria[a] invades our land and treads in our fortified strongholds,[b] then we will appoint seven shepherds and eight leaders from among men[c] to oppose him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Assyrian.” The Hebrew may refer either to Assyria or to the Assyrian invader.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean “palaces.”
    reason: lexical_alternative
  - marker: c
    text: “Seven … and eight” is a Hebrew expression for an ample or sufficient number.
    reason: cultural_note
simplification_decisions:
- pob_phrase: comes into our land and treads in our citadels
  simplified_phrase: invades our land and treads in our fortified strongholds
  preserved_meaning: Assyria enters as an enemy and treads in the land’s defended places.
  reasoning_layer_used: Lexical decisions for בְאַרְצֵנוּ, יִדְרֹךְ, and בְאַרְמְנֹתֵינוּ
  rationale: “Invades” clarifies the military setting, while “treads in” preserves the restrained source image and location.
- pob_phrase: raise up against him
  simplified_phrase: appoint ... to oppose him
  preserved_meaning: Leaders will be established to resist the invader.
  reasoning_layer_used: Lexical decisions for וַהֲקֵמֹנוּ and עָלָיו
  rationale: “Appoint” gives the contextual sense of raising leaders in natural English.
- pob_phrase: eight princes of men
  simplified_phrase: eight leaders from among men
  preserved_meaning: Eight human chiefs or rulers will be appointed.
  reasoning_layer_used: Lexical decision for נְסִיכֵי אָדָם
  rationale: “Leaders from among men” replaces the formal construction while retaining its human reference.
