  preserved_meaning: Yahweh will decisively eliminate the community’s horses from within it.
  reasoning_layer_used: Lexical decisions for וְהִכְרַתִּי and מִקִּרְבֶּךָ
  rationale: The added plain verb explains the concrete “cut off” image while retaining its force.
- pob_phrase: and I will destroy your chariots
  simplified_phrase: I will destroy your chariots
  preserved_meaning: Yahweh will destroy the people’s military chariots.
  reasoning_layer_used: Lexical and theological decisions for וְהַאֲבַדְתִּי and מַרְכְּבֹתֶיךָ
  rationale: A new sentence makes the second divine action easier to follow without interpreting its purpose.
