translation:
  language: en
  text: The remnant of Jacob will be among many peoples like dew from Yahweh, like showers on the grass that do not wait for anyone or hold back for people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verbs can also mean hoping or waiting. The final line may describe the remnant more broadly as not depending on human support.
    reason: alternative_reading
