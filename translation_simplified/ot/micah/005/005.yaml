  preserved_meaning: The shepherd image remains while its contextual sense of conquest and rule is made clear.
  reasoning_layer_used: Lexical decision for וְרָעוּ
  rationale: The context and sword imagery give shepherding the force of subduing rule.
- pob_phrase: the land of Nimrod
