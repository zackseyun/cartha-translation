translation:
  language: en
  text: Like shepherds, they will take control of the land of Assyria with the sword, and Nimrod’s land at its entrances.[a] He will rescue us from Assyria[b] when Assyria invades our land and marches through our territory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at its gates”; the Hebrew literally says “at its entrances.”
    reason: lexical_alternative
  - marker: b
    text: Or “from the Assyrian”; the Hebrew can personify Assyria as the invading enemy.
    reason: alternative_reading
