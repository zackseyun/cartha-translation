translation:
  language: en
  text: So he will give them up until the woman in labor gives birth.[a] Then the rest of his brothers will return to the people of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify this woman; she may represent Zion or Judah, be the promised ruler’s mother, or refer to another figure.
    reason: alternative_reading
  - marker: b
    text: The Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
