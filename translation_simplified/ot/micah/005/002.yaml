  rationale: “So” expresses the same logical connection in more natural common English.
- pob_phrase: until the time when she who is in labor has given birth
  simplified_phrase: until the woman in labor gives birth
  preserved_meaning: Their surrender lasts until the birth, while the woman remains unidentified.
  reasoning_layer_used: Lexical decisions for עַד עֵת, יוֹלֵדָה, and יָלָדָה; theological decision on identity
  rationale: The shorter clause states the same time limit without the formal participial wording.
- pob_phrase: the sons of Israel
