translation:
  language: en
  text: All this is because of Jacob’s rebellion and the sins of the people of Israel. Which city is at the heart of Jacob’s rebellion? Samaria. And which city is at the heart of Judah’s worship at the high places?[a] Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “High places” were elevated worship sites, often used for unauthorized or idolatrous worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Jacob’s transgression
  simplified_phrase: Jacob’s rebellion
  preserved_meaning: Jacob’s serious covenant offense against God remains in view.
  reasoning_layer_used: POB lexical decision for פשע
  rationale: “Rebellion” is a listed lexical alternative and is clearer in common English.
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The expression still refers to Israel as a covenant nation.
  reasoning_layer_used: POB lexical rationale for בֵּית יִשְׂרָאֵל
  rationale: “The people of Israel” communicates the national group without the less familiar house idiom.
- pob_phrase: What is ...? Is it not ...?
  simplified_phrase: Which city is at the heart of ...?
  preserved_meaning: The questions still identify each capital as the representative center of corruption.
  reasoning_layer_used: POB theological decision on metonymic identification
  rationale: A direct city question makes the rhetorical identification understandable on first reading.
interpretive_expansions:
- pob_phrase: Samaria ... Jerusalem
  rendering: at the heart of ...
  claim: The capitals are representative centers of the people’s rebellion and corrupt worship.
  evidence:
  - The POB theological decision identifies the cities as centers or sources of corruption.
  - Each rhetorical question is answered with a capital city.
  confidence: high
  alternatives_preserved:
  - The cities may also be understood as embodying the offenses themselves.
- pob_phrase: the high places of Judah
  rendering: Judah’s worship at the high places
  claim: The high places are worship sites rather than merely elevated locations.
  evidence:
  - The POB lexical rationale defines בָּמוֹת as elevated worship sites.
  - The POB cultural note associates them with unauthorized or idolatrous worship.
  confidence: high
  alternatives_preserved:
  - The wording retains the concrete image “high places.”
translation_notes:
  risk_flags:
  - risk: “At the heart of” may sound more exclusively causal than the Hebrew metonymy requires.
    mitigation: The phrase allows both representative-center and source senses without calling either city the only cause.
  - risk: Replacing “house of Israel” removes the household image and some formal parallelism.
    mitigation: “The people of Israel” preserves the intended covenantal-national referent in clearer English.
