  text: I will still bring a possessor against you, people of Mareshah.[a] The glory of Israel[b] will come as far as Adullam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean “an heir,” “one who takes possession,” or “a conqueror,” and it likely plays on the name Mareshah.
