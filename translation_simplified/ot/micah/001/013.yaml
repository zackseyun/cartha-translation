translation:
  language: en
  text: People of Lachish, harness your swift horses to your chariots. Lachish was the starting point of sin for Daughter Zion,[a] because Israel’s acts of rebellion were found among you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” is a poetic name for Zion, or Jerusalem. “Starting point” may also mean that Lachish was the first cause of its sin.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Harness the chariot to the swift horse, inhabitant of Lachish
  simplified_phrase: People of Lachish, harness your swift horses to your chariots
  preserved_meaning: The people of Lachish are commanded to prepare their fast chariots.
  reasoning_layer_used: Lexical decisions for רתם, מרכבה, רכש, and יושבת לכיש
  rationale: The plural wording makes the representative singular and city address natural in modern English while preserving the chariot image.
- pob_phrase: she was the beginning of sin to daughter Zion
  simplified_phrase: Lachish was the starting point of sin for Daughter Zion
  preserved_meaning: Lachish was an originating point of sin affecting Zion.
  reasoning_layer_used: Theological decision on ראשית חטאת
  rationale: “Starting point” clearly expresses origin without specifying how the sin spread.
- pob_phrase: the transgressions of Israel
  simplified_phrase: Israel’s acts of rebellion
  preserved_meaning: Israel’s wrongdoing was willful revolt, not merely accidental failure.
  reasoning_layer_used: Lexical decision for פשעי ישראל
  rationale: “Acts of rebellion” is more immediately understandable while retaining the Hebrew word’s force.
