translation:
  language: en
  text: Do not report it in Gath. Do not weep in Acco.[a] In Beth-leaphrah,[b] roll in the dust.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean “Do not weep at all.” The main text follows a common reading that treats Acco as a place-name wordplay.
    reason: alternative_reading
  - marker: b
    text: Beth-leaphrah probably sounds like “house of dust,” creating a wordplay with “dust.”
    reason: cultural_note
  - marker: c
    text: The consonantal Hebrew reads “I have rolled in the dust,” but the context supports the command used in the main text.
    reason: textual_variant
