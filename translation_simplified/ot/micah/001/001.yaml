translation:
  language: en
  text: This is the word of Yahweh that came to Micah, a man from Moresheth, during the reigns of Jotham, Ahaz, and Hezekiah, kings of Judah. Micah saw this message in a vision concerning[a] Samaria and Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against Samaria and Jerusalem.” The Hebrew can refer either to the subject of the vision or to those it is directed against.
    reason: lexical_alternative
