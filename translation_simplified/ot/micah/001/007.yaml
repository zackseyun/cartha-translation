translation:
  language: en
  text: All her carved images will be smashed. All the wages she earned as a prostitute will be burned in the fire. I will turn all her idols into ruins. She gathered these things from a prostitute’s wages, and they will return to a prostitute’s wages.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The prostitute’s wages picture wealth gained through unfaithfulness to God and idol worship.
    reason: cultural_note
  - marker: b
    text: Or “they will become a prostitute’s wages again.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all her prostitute’s wages
  simplified_phrase: all the wages she earned as a prostitute
  preserved_meaning: Samaria is personified as a prostitute receiving payment.
  reasoning_layer_used: lexical and theological decisions
  rationale: The rewrite makes the relationship between the wages and the personified city clear.
- pob_phrase: all her idols I will make desolate
  simplified_phrase: I will turn all her idols into ruins
  preserved_meaning: God actively brings every idol associated with her to devastation.
  reasoning_layer_used: lexical decision for אָשִׂים שְׁמָמָה
  rationale: The active wording preserves God’s judgment while stating its result concretely.
- pob_phrase: she gathered them
  simplified_phrase: She gathered these things
  preserved_meaning: The object remains broadly identified as the wealth or items just mentioned.
  reasoning_layer_used: lexical decision for קִבָּצָה and review evidence
  rationale: “These things” clarifies the reference without specifying more than the source does.
translation_notes:
  risk_flags:
  - risk: Readers may take the prostitution language only as literal sex work.
    mitigation: Footnote a explains its metaphorical connection to idolatrous unfaithfulness.
  - risk: The final Hebrew clause allows more than one understanding of how the wages return.
    mitigation: Footnote b preserves the documented alternative reading.
