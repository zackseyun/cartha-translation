translation:
  language: en
  text: All peoples, listen! Earth and all that is in it, pay attention! Let the Lord Yahweh testify against you[a] from his holy temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “testify among you,” though the context most likely means “against you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Hear, all you peoples
  simplified_phrase: All peoples, listen!
  preserved_meaning: Every people group is directly summoned to hear attentively.
  reasoning_layer_used: POB lexical decisions for שִׁמְעוּ and עַמִּים כֻּלָּם
  rationale: Natural word order keeps the command direct and forceful.
- pob_phrase: O earth, and all that fills it
  simplified_phrase: Earth and all that is in it
  preserved_meaning: The summons includes the whole earth and everything it contains.
  reasoning_layer_used: POB lexical and theological decisions on אֶרֶץ וּמְלֹאָהּ
  rationale: This makes the fullness expression clear without restricting it to human inhabitants.
- pob_phrase: let the Lord GOD be a witness against you
  simplified_phrase: Let the Lord Yahweh testify against you
  preserved_meaning: The Lord bearing the covenant name Yahweh gives judicial testimony against those addressed.
  reasoning_layer_used: POB lexical decisions on וִיהִי, בָּכֶם, and לְעֵד, with the updated theological policy for יְהוָה
  rationale: The verbal form clarifies the courtroom image, while “Yahweh” follows the stated divine-name policy.
translation_notes:
  risk_flags:
  - risk: “Against you” resolves a preposition that can also mean “among you.”
    mitigation: The main text follows the likely judicial sense, and the footnote preserves the alternative.
