translation:
  language: en
  text: Because of this, I will grieve and wail. I will walk around stripped and naked.[a] I will cry out like the jackals and mourn like the ostriches.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will walk around barefoot and naked.” The Hebrew word translated “stripped” is difficult and may describe going barefoot as a sign of mourning and humiliation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “the daughters of the ostrich,” a poetic expression for ostriches or female ostriches.
    reason: lexical_alternative
