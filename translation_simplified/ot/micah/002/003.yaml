translation:
  language: en
  text: 'So this is what Yahweh says: “Look, I am planning disaster against this family group.[a] You will not be able to pull your necks out from under this yoke. You will not walk proudly with your heads held high, because it will be a time of disaster.”'
  philosophy: optimal-equivalence
  footnotes:
