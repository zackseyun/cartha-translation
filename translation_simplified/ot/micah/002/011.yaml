translation:
  language: en
  text: If a man went around speaking empty words—nothing but wind and lies—and said, “I will preach[a] to you about wine and strong drink,” he would be just the preacher for this people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same Hebrew verb appears in both clauses and can also be translated “prophesy” and “prophet”; here it is used with biting irony.
    reason: lexical_alternative
