translation:
  language: en
  text: You drive the women[a] of my people from their comfortable homes. You take my splendor[b] away from their young children forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wives.” The Hebrew can mean women generally or wives specifically.
    reason: lexical_alternative
  - marker: b
    text: Or “my glory.” The Hebrew word can also mean majesty or honor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the women of my people
  simplified_phrase: the women of my people
  preserved_meaning: The broader group of vulnerable women remains the main reading, while the possible meaning “wives” is preserved in a footnote.
  reasoning_layer_used: POB lexical decision for נְשֵׁי עַמִּי
  rationale: The wording is already clear, and changing it could wrongly limit the accusation to married women.
- pob_phrase: from their delightful houses
  simplified_phrase: from their comfortable homes
  preserved_meaning: The women are forcibly removed from places of domestic comfort and security.
  reasoning_layer_used: POB lexical rationale for מִבֵּית תַּעֲנֻגֶיהָ
  rationale: “Comfortable homes” expresses the phrase naturally without the awkward sound of “delightful houses.”
- pob_phrase: from their children you take away my splendor forever
  simplified_phrase: You take my splendor away from their young children forever
  preserved_meaning: The oppressors permanently deprive small children of what the LORD calls his splendor.
  reasoning_layer_used: POB lexical decisions for עֹלָלֶיהָ, תִּקְחוּ, and הֲדָרִי, with the theological decision to retain divine first-person speech
  rationale: A new sentence and ordinary word order make the accusation clear while preserving its theological tension.
translation_notes:
  risk_flags:
  - risk: “Comfortable” may sound mainly economic rather than also suggesting a pleasant and secure home.
    mitigation: “Homes” preserves the domestic setting, and the forced expulsion supplies the loss-of-security context.
  - risk: Readers may not know whether “my splendor” means the LORD’s own majesty or dignity he gave the children.
    mitigation: The main text retains the deliberate ambiguity, and the footnote gives only lexical alternatives.
