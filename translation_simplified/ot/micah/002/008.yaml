translation:
  language: en
  text: But lately my people have risen up like an enemy. You strip the outer robes from the clothing of travelers who pass by in safety—those returning from war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “those who shrink from war” or “those turned away from battle.” The Hebrew phrase is difficult and may refer to peaceful noncombatants rather than people returning from war.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But lately my people have risen up as an enemy
  simplified_phrase: But lately my people have risen up like an enemy
  preserved_meaning: God’s people have recently taken a hostile stance without being identified as enemies in essence.
  reasoning_layer_used: lexical decision for לְאוֹיֵב and latest doctrine-realignment revision
  rationale: “Like an enemy” clearly expresses hostile conduct without implying a complete change of identity.
- pob_phrase: from off the garment you strip the robe
  simplified_phrase: You strip the outer robes from the clothing
  preserved_meaning: The people violently remove an outer garment from another person’s clothes.
  reasoning_layer_used: lexical decisions for שַׂלְמָה, אֶדֶר, and תַּפְשִׁטוּן
  rationale: The recast clause keeps both clothing terms and the vivid stripping image in natural English.
- pob_phrase: those who pass by securely
  simplified_phrase: travelers who pass by in safety
  preserved_meaning: People traveling without immediate fear are being robbed.
  reasoning_layer_used: lexical decisions for מֵעֹבְרִים and בֶּטַח
  rationale: “Travelers” identifies the passersby, while “in safety” retains their secure state.
translation_notes:
  risk_flags:
