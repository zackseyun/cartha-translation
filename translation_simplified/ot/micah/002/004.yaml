translation:
  language: en
  text: 'On that day, someone will taunt you and wail this sorrowful lament: “We are completely ruined! He transfers the land allotted to my people. How he takes it away from me! He parcels out our fields to the one who turns away[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may also mean “to a rebel” or, less likely, “to the captor” or “to one who turns back.”
    reason: alternative_reading
