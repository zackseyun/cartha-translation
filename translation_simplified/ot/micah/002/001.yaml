translation:
  language: en
  text: Woe to those who lie in bed planning wickedness and working out evil schemes! At first light they carry them out, because the power to do so is in their hands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because their hand is their god,” portraying their own power as the god they trust.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: devise wickedness and work out evil on their beds
  simplified_phrase: lie in bed planning wickedness and working out evil schemes
  preserved_meaning: They deliberately develop evil plans during the night.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The wording keeps the nighttime image and the deliberate movement from planning toward action.
- pob_phrase: At the light of morning they do it
  simplified_phrase: At first light they carry them out
  preserved_meaning: They put their nighttime plans into action as soon as morning comes.
  reasoning_layer_used: POB lexical decisions
  rationale: “At first light” preserves the vivid timing, while “carry them out” clearly identifies the action.
- pob_phrase: because it is in the power of their hand
  simplified_phrase: because the power to do so is in their hands
  preserved_meaning: They act because they possess the ability and control needed to accomplish their plans.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The natural English idiom keeps both the chosen meaning of power and the source-language hand image.
