translation:
  language: en
  text: The one who breaks through[a][b] has gone up ahead of them. They have broken through, passed through the gate, and gone out through it. Their king goes ahead of them, and the LORD is at their head.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the breaker,” meaning one who breaks through an obstacle and opens the way.
    reason: lexical_alternative
  - marker: b
    text: This figure may be a military leader, their king, or the LORD himself; the Hebrew does not make the identity explicit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has gone up before them
  simplified_phrase: has gone up ahead of them
  preserved_meaning: The figure moves upward in front of the people to open the way.
  reasoning_layer_used: Lexical decisions for עָלָה and לִפְנֵיהֶם
  rationale: “Up ahead” keeps both the upward movement and the leading position in natural English.
- pob_phrase: they have broken through and passed through the gate, and gone out by it
  simplified_phrase: They have broken through, passed through the gate, and gone out through it.
  preserved_meaning: The breakthrough remains distinct from their movement through and out by the gate.
  reasoning_layer_used: Lexical decisions for פָּרְצוּ, וַיַּעֲבֹרוּ, שַׁעַר, and וַיֵּצְאוּ בוֹ
  rationale: The comma avoids making the gate the unstated object of “broken through,” while “through it” clarifies the exit route.
- pob_phrase: Their king passes on before them, and Yahweh is at their head.
  simplified_phrase: Their king goes ahead of them, and the LORD is at their head.
  preserved_meaning: Their king leads before them, while the LORD remains distinctly pictured in the leading position.
  reasoning_layer_used: Lexical and theological decisions for מַלְכָּם, לִפְנֵיהֶם, וַיהוָה, and בְּרֹאשָׁם
  rationale: Common wording clarifies the procession without merging the king with the LORD or flattening the head metaphor.
translation_notes:
  risk_flags:
  - risk: “Gone up ahead” may sound less idiomatic than simply “gone ahead.”
    mitigation: The fuller wording preserves the source’s upward movement as well as the leading position.
  - risk: Readers may assume the one who breaks through is distinct from both the king and the LORD.
    mitigation: Footnote b preserves the Hebrew ambiguity about the figure’s identity.
