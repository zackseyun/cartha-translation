translation:
  language: en
  text: They covet other people’s fields and seize them. They take houses away. They oppress a man and his house, and a man and his inheritance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Inheritance” refers especially to land handed down through a family.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They covet fields
  simplified_phrase: They covet other people’s fields
  preserved_meaning: Their desire is wrongful because the fields belong to others.
  reasoning_layer_used: Lexical rationale for חָמְדוּ
  rationale: The added words make the moral force of “covet” immediately clear.
- pob_phrase: and houses and take them away
  simplified_phrase: They take houses away.
  preserved_meaning: They remove houses from those who possess them.
  reasoning_layer_used: Lexical decisions for בָתִּים and נָשָׂאוּ
  rationale: A separate sentence removes the difficult elliptical structure.
- pob_phrase: they oppress a man and his house, a man and his inheritance
  simplified_phrase: They oppress a man and his house, and a man and his inheritance.
  preserved_meaning: The accusation covers representative male victims together with their houses and inherited property.
  reasoning_layer_used: Lexical decision for עָשְׁקוּ and gender-accurate theological decision
  rationale: Keeping “oppress” over both clauses preserves this action as distinct from the earlier taking.
interpretive_expansions:
- pob_phrase: fields
  rendering: other people’s fields
  claim: The coveted fields belong to others rather than to the coveters.
  evidence:
  - The lexical rationale defines חָמְדוּ as wrongful desire for what belongs to another.
  - The following seizure shows that the fields are not rightfully theirs.
  confidence: high
translation_notes:
  risk_flags:
  - risk: The phrase “oppress a man and his house” remains unusual in modern English.
    mitigation: It preserves the POB’s broad accusation without changing oppression into taking.
  - risk: Modern readers may understand “inheritance” as money or possessions generally.
    mitigation: The footnote identifies inherited family land while retaining the broader term.
