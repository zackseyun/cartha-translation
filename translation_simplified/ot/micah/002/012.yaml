translation:
  language: en
  text: I will certainly gather all of you, Jacob. I will bring together Israel’s remnant. I will place them all together like the sheep of Bozrah,[a] like a flock in the middle of its pasture. They will be noisy because of the people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like sheep in a fold.” The Hebrew may name Bozrah or evoke a sheepfold.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression is difficult; it may mean that they will be noisy with people or crowded with people.
    reason: alternative_reading
