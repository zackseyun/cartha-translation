translation:
  language: en
  text: Her leaders take bribes when they judge cases. Her priests teach for payment, and her prophets practice divination[a] for silver.[b] Yet they lean on Yahweh for support and say, “Isn’t Yahweh among us? No disaster will come upon us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Divination means seeking hidden knowledge through supernatural signs or rituals.
    reason: cultural_note
  - marker: b
    text: Silver was used as money.
    reason: cultural_note
