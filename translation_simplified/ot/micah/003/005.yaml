translation:
  language: en
  text: 'This is what Yahweh says about the prophets who lead my people astray: When they have food in their mouths, they proclaim, “Peace!” But if anyone gives them no food or payment, they use sacred language to prepare an attack against that person.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says they “bite with their teeth” and “consecrate war.” These images show that the prophets shape their messages by what they receive and treat their attack as a sacred cause.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Thus says Yahweh concerning
  simplified_phrase: This is what Yahweh says about
  preserved_meaning: Yahweh introduces an oracle about the corrupt prophets.
  reasoning_layer_used: POB lexical decisions for Yahweh and עַל
  rationale: Natural introductory wording preserves the prophetic declaration and its subject.
- pob_phrase: who bite with their teeth and cry, “Peace,”
  simplified_phrase: When they have food in their mouths, they proclaim, “Peace!”
  preserved_meaning: The prophets announce well-being when they are fed or paid.
  reasoning_layer_used: POB footnote and lexical rationale for the biting image
  rationale: The main text states the economic contrast clearly while the footnote preserves the concrete image.
- pob_phrase: against anyone who does not put something into their mouths, they consecrate war
  simplified_phrase: if anyone gives them no food or payment, they use sacred language to prepare an attack against that person
  preserved_meaning: The prophets respond with religiously framed hostility when someone gives them nothing.
  reasoning_layer_used: POB lexical and theological decisions on the mouth idiom and consecrating war
  rationale: Clear wording explains both the expected gift and the corrupt use of sacred language without calling the attack holy.
