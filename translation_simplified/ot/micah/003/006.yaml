  preserved_meaning: The prophets will be deprived of revelatory visions under coming judgment.
  reasoning_layer_used: lexical and theological decisions
  rationale: The active image of night falling makes the coming loss of revelation easier to grasp.
- pob_phrase: and darkness for you, without divination
  simplified_phrase: Darkness will cover you, leaving you without divination
  preserved_meaning: The darkness image remains distinct and marks the loss of access to divination.
  reasoning_layer_used: lexical decisions
  rationale: A complete sentence clarifies the poetic parallel without merging its two ideas.
- pob_phrase: the sun will go down on the prophets, and the day will grow dark over them
  simplified_phrase: The sun will go down on the prophets, and the day will grow dark over them
  preserved_meaning: Sunset and darkened daylight portray judgment ending the prophets' claimed illumination.
  reasoning_layer_used: lexical and theological decisions
  rationale: The vivid source images are already clear and therefore remain intact.
