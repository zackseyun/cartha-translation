translation:
  language: en
  text: Therefore, night will fall on you, leaving you without any vision. Darkness will cover you, leaving you without divination.[a] The sun will go down on the prophets, and the day will grow dark over them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Divination means seeking supernatural knowledge or guidance through signs and omens.
    reason: cultural_note
