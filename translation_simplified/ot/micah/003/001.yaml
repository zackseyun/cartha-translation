translation:
  language: en
  text: And I said, “Listen now, leaders[a] of Jacob and rulers of the house of Israel! Isn’t it your duty to know what justice[b] requires?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “heads,” using a picture of the leaders as the head of the people.
    reason: simplification_note
  - marker: b
    text: Or “judgment.” The Hebrew word can mean legal judgment, justice, or what is right.
    reason: lexical_alternative
