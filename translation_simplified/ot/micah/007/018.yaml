translation:
  language: en
  text: Who is a God like you? You forgive wrongdoing and pass over rebellion for the remnant of your people—your own inheritance. You do not hold on to your anger forever, because you delight in steadfast love.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” can also be translated “mercy” or “covenant love.”
