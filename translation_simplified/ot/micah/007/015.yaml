simplification_decisions:
- pob_phrase: As in the days when you came out
  simplified_phrase: just as when you came out
  preserved_meaning: The present promise is compared with the time of the exodus.
  reasoning_layer_used: POB lexical decision for כִּימֵי and צֵאתְךָ
  rationale: The shorter time clause preserves the comparison in more natural English.
- pob_phrase: from the land of Egypt
  simplified_phrase: of Egypt
  preserved_meaning: Israel's departure from Egypt remains the historical reference.
  reasoning_layer_used: POB lexical decision for מֵאֶרֶץ מִצְרַיִם
  rationale: The usual English expression communicates the same place without the formal phrase “the land of.”
- pob_phrase: wondrous things
  simplified_phrase: wonders
  preserved_meaning: God promises extraordinary acts that evoke wonder without limiting them to miracles.
  reasoning_layer_used: POB lexical decision for נִפְלָאוֹת
  rationale: “Wonders” is concise, familiar, and retains the exodus imagery.
