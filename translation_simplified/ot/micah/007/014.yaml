- pob_phrase: Shepherd your people with your staff, the flock of your inheritance
  simplified_phrase: Shepherd your people with your staff—your flock, your inheritance.
  preserved_meaning: God’s people are his covenant inheritance and are pictured as the flock under his care.
  reasoning_layer_used: POB lexical and theological decisions for רְעֵה, בְשִׁבְטֶךָ, and צֹאן נַחֲלָתֶךָ
  rationale: The shorter apposition keeps the shepherd image, pastoral staff, and inheritance language clear.
- pob_phrase: dwelling alone in a forest in the midst of Carmel
  simplified_phrase: They live alone in a forest in the heart of Carmel.
  preserved_meaning: The flock is pictured as living in isolation amid Carmel’s forested setting.
  reasoning_layer_used: POB lexical decisions for שֹׁכְנִי לְבָדָד, יַעַר, and בְּתוֹךְ כַּרְמֶל
  rationale: A complete sentence and “in the heart of” make the setting easier to follow without resolving Carmel’s ambiguity.
- pob_phrase: as in days of old
