translation:
  language: en
  text: Shepherd your people with your staff—your flock, your inheritance. They live alone in a forest in the heart of Carmel.[a] Let them graze in Bashan and Gilead as they did long ago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the midst of pastureland” or “in fertile land.” The Hebrew name Carmel can also mean fruitful land.
    reason: lexical_alternative
