translation:
  language: en
  text: The nations will see and be ashamed of all their power.[a] They will put their hands over their mouths,[b] and their ears will become deaf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “be put to shame because of all their power.” The Hebrew leaves the exact relationship between their shame and power open.
    reason: lexical_alternative
  - marker: b
    text: Putting a hand over the mouth is a gesture of silence, astonishment, or submission.
    reason: cultural_note
  - marker: c
    text: Or “their ears will be stopped” or “their ears will grow dull.”
    reason: lexical_alternative
