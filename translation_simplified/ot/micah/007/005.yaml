translation:
  language: en
  text: Do not trust a neighbor.[a] Do not rely on a close companion. Guard your words even from the woman lying in your arms.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “friend.”
    reason: lexical_alternative
  - marker: b
    text: This describes the most intimate companion, likely one’s wife.
    reason: cultural_note
  - marker: c
    text: Hebrew pictures careful control of speech as guarding “the doors of your mouth.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: do not put confidence in a close companion
  simplified_phrase: Do not rely on a close companion
  preserved_meaning: The warning concerns depending on a trusted personal associate.
  reasoning_layer_used: Lexical decisions for תִּבְטְחוּ and אַלּוּף
  rationale: “Rely on” expresses personal dependence in common English while preserving the closer relationship.
- pob_phrase: From the woman who lies in your bosom
  simplified_phrase: even from the woman lying in your arms
  preserved_meaning: The warning extends even to the most intimate domestic relationship.
  reasoning_layer_used: Lexical decisions for מִשֹּׁכֶבֶת חֵיקֶךָ and חֵיק
  rationale: “Even from” preserves separation, while “in your arms” makes the intimate image clear.
- pob_phrase: guard the doors of your mouth
  simplified_phrase: Guard your words
  preserved_meaning: The command requires careful control of what one says without demanding complete silence.
  reasoning_layer_used: Lexical decisions for שְׁמֹר and פִּתְחֵי פִיךָ
  rationale: The main text states the meaning plainly, and the footnote retains the Hebrew door image.
interpretive_expansions:
- pob_phrase: From the woman who lies in your bosom, guard the doors of your mouth
  rendering: Guard your words even from the woman lying in your arms.
  claim: One must withhold or carefully control speech even toward the most intimate companion.
  evidence:
  - The prefixed מִן indicates source or separation in the POB lexical rationale.
  - The embrace image marks exceptional personal intimacy.
  - The mouth-door metaphor depicts active control of speech.
  confidence: high
  alternatives_preserved:
  - The woman may be one’s wife without being explicitly identified as such.
  - “Bosom” and “embrace” remain lexical alternatives to “arms.”
translation_notes:
  risk_flags:
  - risk: “Guard your words” does not retain the mouth-door image in the main text.
    mitigation: Footnote c preserves and explains the source-language image.
  - risk: Readers may assume the woman is certainly the speaker’s wife.
    mitigation: The main text keeps “woman,” while footnote b presents “wife” only as likely.
