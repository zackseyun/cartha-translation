    text: Or, “dishonors his father.” The Hebrew describes treating someone shamefully or with contempt.
    reason: lexical_alternative
  - marker: b
    text: Literally, “the men of his house.” This expression can also refer more broadly to members of his household.
    reason: lexical_alternative
