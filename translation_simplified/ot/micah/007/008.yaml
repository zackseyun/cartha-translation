simplification_decisions:
- pob_phrase: Do not rejoice over me, my enemy
  simplified_phrase: My enemy, do not rejoice over me.
  preserved_meaning: The speaker directly forbids the enemy to celebrate over him.
  reasoning_layer_used: Lexical decisions for תִּשְׂמְחִי, אֹיַבְתִּי, and לִי
  rationale: Moving the address first creates a direct sentence without changing the object of the enemy’s joy.
- pob_phrase: though I have fallen, I will rise
  simplified_phrase: Though I have fallen, I will rise.
  preserved_meaning: The speaker confidently expects restoration despite his fall.
  reasoning_layer_used: Poetic use of the Hebrew perfect and POB footnote b
  rationale: The clear fall-and-rise contrast retains the concessive force and avoids adding “again.”
- pob_phrase: Yahweh will be a light to me
  simplified_phrase: Yahweh will be my light
  preserved_meaning: Yahweh himself will provide light for the speaker in darkness.
  reasoning_layer_used: Lexical and theological decisions for יְהוָה, אוֹר, and לִי
  rationale: The possessive form is natural English while preserving the divine name and light image.
translation_notes:
  risk_flags:
  - risk: “I will rise” could be understood only as physical movement.
    mitigation: The paired images of falling, darkness, and light preserve the broader poetic sense of restoration.
