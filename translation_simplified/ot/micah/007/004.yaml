translation:
  language: en
  text: Even the best of them is like a thornbush. Even the upright person is worse than a thorn hedge. The day your watchmen warned you about has come—the day of your punishment.[a] Now there will be confusion among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the day of your visitation.” The Hebrew term can refer to visitation, oversight, or punishment; here it points to judgment.
    reason: lexical_alternative
