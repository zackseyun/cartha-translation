translation:
  language: en
  text: They will lick the dust like a snake. Like creatures that crawl on the ground, they will come trembling out of their strongholds. They will turn toward Yahweh our God in dread, and they will be afraid because of you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “they will fear you” or “they will stand in awe of you,” though the context emphasizes dread.
    reason: lexical_alternative
