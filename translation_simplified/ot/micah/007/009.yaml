translation:
  language: en
  text: I have sinned against Yahweh, so I will bear his anger until he takes up my case and gives me justice. He will bring me out into the light, and I will see his righteousness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his justice.” The Hebrew word can mean both righteousness and justice, especially when someone is vindicated in court.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will bear the indignation of Yahweh, because I have sinned against him
  simplified_phrase: I have sinned against Yahweh, so I will bear his anger
  preserved_meaning: The speaker accepts Yahweh’s deserved anger because of his own sin.
  reasoning_layer_used: Lexical decisions for זַעַף יְהוָה and כִּי חָטָאתִי לוֹ; theological decision on the divine name
  rationale: Reordering cause before consequence makes the relationship immediately clear.
- pob_phrase: until he pleads my case and executes justice for me
  simplified_phrase: until he takes up my case and gives me justice
  preserved_meaning: Yahweh will act as the speaker’s advocate and bring about favorable judicial vindication.
  reasoning_layer_used: Lexical decisions for יָרִיב רִיבִי and וְעָשָׂה מִשְׁפָּטִי
  rationale: The simpler verbs retain both the legal setting and the favorable outcome.
- pob_phrase: He will bring me out to the light; I will look upon his righteousness
  simplified_phrase: He will bring me out into the light, and I will see his righteousness
  preserved_meaning: Yahweh will lead the speaker from affliction into open vindication, where his righteous action becomes evident.
  reasoning_layer_used: Lexical decisions for יוֹצִיאֵנִי לָאוֹר, אֶרְאֶה, and בְּצִדְקָתוֹ
  rationale: Natural syntax preserves the movement from darkness to light and the key term “righteousness.”
