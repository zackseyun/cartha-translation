translation:
  language: en
  text: God has already told you, O man,[a] what is good. What does Yahweh require from you? Do what is just. Love steadfast love—love that remains loyal.[b] And walk humbly with your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O man” addresses one human hearer as a representative of humanity.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also mean mercy, kindness, or covenant loyalty.
    reason: lexical_alternative
