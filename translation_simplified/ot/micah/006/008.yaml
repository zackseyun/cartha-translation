  preserved_meaning: The question introduces the ethical conduct Yahweh expects.
  reasoning_layer_used: Lexical decisions for דּוֹרֵשׁ מִמְּךָ and כִּי אִם
  rationale: A direct question followed by three commands is easier to follow than the dense exceptive construction.
- pob_phrase: to do justice, and to love steadfast love, and to walk humbly
  simplified_phrase: Do what is just. Love steadfast love—love that remains loyal. And walk humbly
  preserved_meaning: The three distinct requirements remain active justice, devotion to loyal love, and humble life with God.
  reasoning_layer_used: Lexical and theological decisions for מִשְׁפָּט, חֶסֶד, and הַצְנֵעַ לֶכֶת
  rationale: Short sentences clarify the triad without merging its commands or weakening its covenant language.
