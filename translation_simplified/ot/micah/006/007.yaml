translation:
  language: en
  text: Will Yahweh be pleased with thousands of rams or with tens of thousands of streams of oil? Should I give my firstborn for my rebellion, my own child for my sin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last phrase may also be translated “as a sin offering for my life,” though “my sin” better matches “my rebellion.”
    reason: alternative_reading
