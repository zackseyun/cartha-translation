translation:
  language: en
  text: You will eat, but you will not be satisfied. You will remain empty inside.[a] You will move away, but you will rescue nothing. Whatever you do rescue, I will hand over to destruction by the sword.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; this may instead mean that humiliation or a sinking weakness will remain within you.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and your emptiness will remain within you
  simplified_phrase: You will remain empty inside.
  preserved_meaning: The judgment includes continuing inner emptiness or hunger.
  reasoning_layer_used: POB lexical and theological decisions on the difficult Hebrew clause
  rationale: A separate sentence makes the chosen reading immediate while the footnote preserves its ambiguity.
- pob_phrase: you will not rescue anything
  simplified_phrase: you will rescue nothing
  preserved_meaning: The attempt to save people or possessions will fail.
  reasoning_layer_used: POB lexical decision for תַפְלִיט
  rationale: The shorter wording keeps the implicit object broad and repeats “rescue.”
- pob_phrase: what you do rescue I will give to the sword
  simplified_phrase: Whatever you do rescue, I will hand over to destruction by the sword.
  preserved_meaning: God will consign even the rescued remainder to violent loss.
  reasoning_layer_used: POB lexical decisions for אֶתֵּן and לַחֶרֶב
  rationale: “Hand over” clarifies divine agency, while “destruction by the sword” explains and preserves the prophetic image.
