  reasoning_layer_used: Lexical decisions for דרך and סוך
  rationale: “Press” and “rub oil on your body” clearly describe the ancient actions without claiming they possess no oil.
- pob_phrase: you will tread out new wine, but you will not drink wine
  simplified_phrase: You will press grapes to make new wine, but you will not drink wine
  preserved_meaning: They will produce wine but be denied its enjoyment.
