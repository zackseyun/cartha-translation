  preserved_meaning: The accused people continue to observe Omri’s royal rules.
  reasoning_layer_used: Lexical decisions for וְיִשְׁתַּמֵּר and חֻקּוֹת
  rationale: The active wording makes the accusation direct while retaining the sense of observing formal rules.
- pob_phrase: all the works of the house of Ahab
  simplified_phrase: all the practices of Ahab’s dynasty
  preserved_meaning: The people follow the conduct associated with Ahab’s ruling house.
  reasoning_layer_used: Lexical decision for מַעֲשֵׂה בֵית אַחְאָב
  rationale: “Practices” conveys repeated conduct, and “dynasty” clearly expresses the royal house.
- pob_phrase: you walk in their counsels
