translation:
  language: en
  text: You keep Omri’s laws and follow all the practices of Ahab’s dynasty. You live by their plans. Therefore I will make you a ruin and your inhabitants something people hiss at in scorn. You will bear the reproach of my people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase may also mean “the disgrace of my people” or “the reproach against my people.”
    reason: alternative_reading
