translation:
  language: en
  text: 'Listen now to what Yahweh says: “Stand up and plead your case before the mountains.[a] Let the hills hear your voice.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew could also mean “argue with the mountains” or “bring a case against the mountains,” but here the mountains likely serve as witnesses.
