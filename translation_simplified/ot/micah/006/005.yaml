  text: My people, please remember what Balak, the king of Moab, planned and what Balaam son of Beor answered him. Remember what happened from Shittim to Gilgal,[a] so that you may know Yahweh’s righteous acts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shittim and Gilgal mark Israel’s journey from the plains of Moab into the promised land.
    reason: cultural_note
  - marker: b
    text: “Yahweh’s righteous acts” can also be translated “Yahweh’s saving acts”; the phrase includes his just and faithful deeds for his people.
    reason: lexical_alternative
