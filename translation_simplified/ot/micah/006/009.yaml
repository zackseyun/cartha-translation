  simplified_phrase: The LORD’s voice cries out
  preserved_meaning: The LORD urgently addresses the city.
  reasoning_layer_used: POB base translation and grounding review
  rationale: The natural word order preserves the force of “cries out.”
- pob_phrase: sound wisdom fears your name
  simplified_phrase: It is wise to fear the LORD’s name
  preserved_meaning: True wisdom includes reverent fear of the LORD’s name.
  reasoning_layer_used: POB base translation, doctrine-realignment revision, and grounding review
  rationale: The impersonal wording clarifies the pronoun without turning wisdom into a group of people.
- pob_phrase: hear the rod and him who appointed it
  simplified_phrase: Pay attention to the rod and to the one who appointed it
  preserved_meaning: The city must heed both the coming discipline and its appointing authority.
  reasoning_layer_used: POB base translation and source image
  rationale: “Pay attention” makes the command clear while retaining the rod image and unresolved agent.
