translation:
  language: en
  text: Mountains, listen to Yahweh’s case! You enduring foundations of the earth, listen as well. Yahweh has a case against his people, and he will argue his case against Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Hear, O mountains
  simplified_phrase: Mountains, listen
  preserved_meaning: The mountains are directly summoned as witnesses.
  reasoning_layer_used: The lexical decision identifies a prophetic summons addressed to creation.
  rationale: “Listen” and direct address sound natural while preserving the command.
- pob_phrase: and you enduring foundations of the earth
  simplified_phrase: You enduring foundations of the earth, listen as well
  preserved_meaning: The earth’s firm, long-standing foundations join the mountains as witnesses.
  reasoning_layer_used: The lexical decisions preserve both endurance and the cosmic foundation image.
  rationale: Repeating the command makes the second address immediately clear.
- pob_phrase: he will contend with Israel
  simplified_phrase: he will argue his case against Israel
  preserved_meaning: Yahweh enters into legal dispute with his covenant people.
  reasoning_layer_used: The lexical rationale gives “plead his case” and legal contention as the intended sense.
  rationale: The wording makes the judicial action clear without using the uncommon verb “contend.”
