translation:
  language: en
  text: In the days to come[a], the mountain of Yahweh’s house will be firmly established as the greatest of the mountains.[b] It will be raised above the hills, and peoples will stream to it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the latter days” or “in the last days”; this prophetic phrase points to a future climactic time.
    reason: alternative_reading
  - marker: b
    text: The mountain’s greatness may involve its height, its place of honor, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the latter days
  simplified_phrase: in the days to come
  preserved_meaning: The prophecy refers to a future period without defining a particular end-times framework.
  reasoning_layer_used: Lexical and theological decisions on the prophetic expression
  rationale: The common phrase is easier to understand, while the footnote preserves its climactic force and alternatives.
- pob_phrase: the mountain of the house of Yahweh
  simplified_phrase: the mountain of Yahweh’s house
  preserved_meaning: The mountain is associated with Yahweh’s temple or house.
  reasoning_layer_used: Lexical decision for the Hebrew construct chain
  rationale: The possessive form expresses the same relationship in natural English.
- pob_phrase: established as the chief of the mountains
  simplified_phrase: firmly established as the greatest of the mountains
  preserved_meaning: The mountain will be secure and preeminent without limiting its exaltation to only height or honor.
  reasoning_layer_used: Lexical and theological decisions on the mountain’s exaltation
  rationale: The wording makes firmness and supremacy clear while the footnote protects the imagery’s ambiguity.
translation_notes:
  risk_flags:
  - risk: “Greatest” may sound purely honorific rather than spatial.
    mitigation: The next sentence retains the image of being raised above the hills, and footnote b preserves both senses.
  - risk: “In the days to come” may sound less climactic than the prophetic formula.
    mitigation: Footnote a identifies its future climactic force and records the traditional alternatives.
