translation:
  language: en
  text: “In that day,” Yahweh declares, “I will gather those who limp. I will bring together those who were driven away, even those I have afflicted.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the lame
  simplified_phrase: those who limp
  preserved_meaning: It keeps the concrete image of people characterized by lameness or limping.
  reasoning_layer_used: POB lexical decision for הַצֹּלֵעָה
  rationale: The verbal wording is clearer and more natural for modern readers.
- pob_phrase: I will assemble the outcast
  simplified_phrase: I will bring together those who were driven away
  preserved_meaning: It preserves both the promised regathering and the passive force of being driven away.
  reasoning_layer_used: POB lexical decisions for וְהַנִּדָּחָה and אֲקַבֵּצָה
  rationale: This replaces an abstract label with a direct description of what happened to them.
- pob_phrase: even those whom I have afflicted
  simplified_phrase: even those I have afflicted
  preserved_meaning: It retains Yahweh’s explicit agency in their prior suffering.
  reasoning_layer_used: POB theological decision on divine agency
  rationale: Removing “whom” simplifies the clause without softening its theological tension.
