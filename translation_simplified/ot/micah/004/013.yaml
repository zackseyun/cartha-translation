translation:
  language: en
  text: Rise, Daughter Zion, and thresh like an ox trampling grain. I will make your horn as strong as iron and your hooves as hard as bronze. Then you will crush many peoples. I will devote their unjust gain to Yahweh and their wealth to the Lord of all the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devote” can include placing something under God’s ban for destruction.
    reason: lexical_alternative
