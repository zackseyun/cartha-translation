translation:
  language: en
  text: He will judge between many peoples[a] and settle disputes for powerful nations far away. They will hammer their swords into plow blades and their spears into pruning tools. No nation will raise a sword against another nation, and they will no longer train for war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name who “he” is in this verse; the context points to the LORD’s rule from Zion without making the subject explicit here.
    reason: source_note
simplification_decisions:
- pob_phrase: will arbitrate for strong nations far away
  simplified_phrase: settle disputes for powerful nations far away
  preserved_meaning: He will decide conflicts involving mighty and distant nations.
  reasoning_layer_used: Lexical decision for וְהוֹכִיחַ and לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  rationale: “Settle disputes” makes the judicial sense clear without narrowing it to rebuke.
- pob_phrase: beat their swords into plowshares and their spears into pruning hooks
  simplified_phrase: hammer their swords into plow blades and their spears into pruning tools
  preserved_meaning: Weapons of war will be reshaped into tools for peaceful agriculture.
  reasoning_layer_used: Lexical decisions for וְכִתְּתוּ, לְאִתִּים, and לְמַזְמֵרוֹת
  rationale: The wording keeps the physical transformation image while replacing less familiar tool names.
- pob_phrase: nor will they learn war anymore
  simplified_phrase: and they will no longer train for war
  preserved_meaning: People will cease preparing and developing skills for warfare.
  reasoning_layer_used: Lexical decision for וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  rationale: “Train for war” expresses the documented sense in ordinary modern English.
translation_notes:
