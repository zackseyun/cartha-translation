translation:
  language: en
  text: Daughter Zion,[a] twist in pain and groan like a woman giving birth, because now you will leave the city and live out in the field. You will go all the way to Babylon. There you will be rescued. There Yahweh will redeem you from the hand of your enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” pictures Zion, or Jerusalem, as a woman.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Writhe and groan
  simplified_phrase: twist in pain and groan
  preserved_meaning: The wording retains both the bodily anguish and the sound of pain in the childbirth image.
  reasoning_layer_used: POB lexical decisions for חולי and וגחי
  rationale: “Twist in pain” makes the physical action of “writhe” immediately clear.
- pob_phrase: dwell in the field
  simplified_phrase: live out in the field
  preserved_meaning: Zion will stay outside the protection of the city.
  reasoning_layer_used: POB lexical decision for ושכנת בשדה
  rationale: “Live out in” is more natural modern English than “dwell in.”
- pob_phrase: go as far as Babylon
  simplified_phrase: go all the way to Babylon
  preserved_meaning: Babylon is the distant destination Zion will reach.
  reasoning_layer_used: POB lexical decision for ובאת עד בבל
  rationale: “All the way to” clearly conveys the extent of the journey.
translation_notes:
  risk_flags:
