translation:
  language: en
  text: Now many nations have gathered against you. They say, “Let her be defiled![a] Let our own eyes watch Zion!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her” refers to Zion, or Jerusalem. “Defiled” can also mean polluted or profaned.
    reason: lexical_alternative
  - marker: b
    text: More literally, “let our eyes look on Zion.” The nations say this with hostile pleasure, wanting to see Zion disgraced.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And now many nations have gathered against you, saying
  simplified_phrase: Now many nations have gathered against you. They say
  preserved_meaning: Many hostile nations have assembled against Zion and voice their desire.
  reasoning_layer_used: POB lexical decisions for the temporal shift, gathering, opposition, and speech
  rationale: Two short sentences make the scene and quotation easier to follow.
- pob_phrase: Let her be defiled
  simplified_phrase: Let her be defiled!
  preserved_meaning: The nations wish for Zion to become morally or ritually polluted.
  reasoning_layer_used: POB lexical and theological decisions for תֶּחֱנָף and its feminine referent
  rationale: The forceful term and the shift from “you” to “her” are retained and explained.
- pob_phrase: let our eyes look on Zion
  simplified_phrase: Let our own eyes watch Zion!
  preserved_meaning: The nations themselves want to look upon Zion with hostile pleasure.
  reasoning_layer_used: POB lexical decisions for וְתַחַז, בְּצִיּוֹן, and עֵינֵינוּ
  rationale: “Watch” is natural English, while “our own eyes” preserves the vivid body-part image.
