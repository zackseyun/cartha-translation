translation:
  language: en
  text: Many nations will come and say, “Come, let us go up to Yahweh’s mountain, to the house of the God of Jacob, so that he may teach us his ways and we may walk in his paths.” For Torah[a] will go out from Zion, and Yahweh’s word from Jerusalem.
