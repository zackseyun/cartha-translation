  reasoning_layer_used: Lexical decisions for וְהָלְכוּ and גּוֹיִם רַבִּים
  rationale: Dropping the opening “And” gives the verse a natural beginning without changing the pilgrimage.
- pob_phrase: the mountain of Yahweh
