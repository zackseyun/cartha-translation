  preserved_meaning: The nations ascend the mountain associated with Yahweh.
  reasoning_layer_used: Lexical and theological decisions for הַר יְהוָה
  rationale: The possessive form is easier to read while preserving the mountain image and divine name.
- pob_phrase: that he may teach us his ways and that we may walk in his paths
  simplified_phrase: so that he may teach us his ways and we may walk in his paths
  preserved_meaning: The nations go up seeking God’s instruction so their conduct may follow his paths.
