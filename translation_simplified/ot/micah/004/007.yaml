translation:
  language: en
  text: I will make the one who limps into a surviving remnant, and the one driven away into a strong nation.[a] Yahweh will reign over them on Mount Zion from now and forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These singular figures represent Zion’s afflicted people, including those driven into exile.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the lame
  simplified_phrase: the one who limps
  preserved_meaning: The physical image of lameness and the singular personification are both retained.
  reasoning_layer_used: lexical and theological decisions
  rationale: This wording is clearer than using “lame” as a collective noun.
- pob_phrase: a remnant
  simplified_phrase: a surviving remnant
  preserved_meaning: God will preserve a people who remain after judgment.
  reasoning_layer_used: lexical rationale
  rationale: “Surviving” briefly explains the prophetic term without replacing it.
- pob_phrase: the outcast
  simplified_phrase: the one driven away
  preserved_meaning: The figure represents someone forcibly removed in the exile context.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: This avoids unrelated modern connotations of “outcast” and restores the source-driven choice.
interpretive_expansions:
