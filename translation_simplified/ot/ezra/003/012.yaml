translation:
  language: en
  text: But many of the priests, Levites, and leaders of ancestral families were old men who had seen the first house—the earlier temple. When they saw the foundation of this house being laid, they wept loudly. At the same time, many raised their voices in joyful shouts.
  philosophy: optimal-equivalence
