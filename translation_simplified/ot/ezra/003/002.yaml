translation:
  language: en
  text: Then Jeshua son of Jozadak and his brothers, the priests,[a] took action together with Zerubbabel son of Shealtiel and his brothers. They built the altar of the God of Israel so they could offer burnt offerings[b] on it, as written in the Law of Moses, the man of God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may also mean male relatives or associates; here they are identified as priests.
    reason: lexical_alternative
  - marker: b
    text: Burnt offerings were sacrifices consumed by fire on the altar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: arose with his brothers the priests, and Zerubbabel son of Shealtiel with his brothers
  simplified_phrase: his brothers, the priests, took action together with Zerubbabel son of Shealtiel and his brothers
  preserved_meaning: Jeshua and both groups began decisive action together.
  reasoning_layer_used: The lexical rationale for וַיָּקָם and the contextual identification of Jeshua’s brothers as priests.
  rationale: “Took action together” conveys decisive shared action rather than mere physical standing.
- pob_phrase: to offer burnt offerings on it
  simplified_phrase: so they could offer burnt offerings on it
  preserved_meaning: The altar was built for presenting burnt offerings.
  reasoning_layer_used: The lexical rationale for לְהַעֲלוֹת עָלָיו עֹלוֹת.
  rationale: The ordinary purpose clause retains both the sacrifice and its altar setting.
- pob_phrase: to offer burnt offerings on it, as it is written in the Law of Moses
  simplified_phrase: offer burnt offerings on it, as written in the Law of Moses
  preserved_meaning: Their burnt offerings followed the written Mosaic prescription.
  reasoning_layer_used: The source syntax and lexical-theological decisions for כַּכָּתוּב and תּוֹרָה.
  rationale: Keeping the phrases together prevents the written prescription from appearing to govern the whole project.
translation_notes:
  risk_flags:
  - risk: “Took action” does not preserve the visible image of rising.
    mitigation: It preserves the audited contextual force of beginning decisive action.
  - risk: Modern readers may not know what burnt offerings were.
    mitigation: Footnote b briefly explains that they were sacrifices consumed by fire.
