translation:
  language: en
  text: Beginning on the first day of the seventh month, they offered burnt offerings[b] to Yahweh. They did this even though[a] the foundation of Yahweh’s temple had not yet been laid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “and” or “but”; in context, the sacrifices began before the temple foundation was laid.
    reason: lexical_alternative
  - marker: b
    text: A burnt offering was a sacrifice burned on the altar in worship to God.
    reason: cultural_note
