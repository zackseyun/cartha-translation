translation:
  language: en
  text: So they gave money to the stonecutters and skilled workers. They also gave food, drink, and oil to the people of Sidon and Tyre so they could bring cedar timber from Lebanon to the port of Joppa.[a] They did this under the authorization Cyrus king of Persia had given them.
  philosophy: optimal-equivalence
  footnotes:
