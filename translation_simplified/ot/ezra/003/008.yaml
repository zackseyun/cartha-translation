  text: In the second month of the second year after they arrived at the house of God in Jerusalem, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, along with the rest of their brothers—the priests and Levites—and everyone who had returned to Jerusalem from captivity,[a] began and appointed Levites who were twenty years old or older to oversee the work on the house of Yahweh.
