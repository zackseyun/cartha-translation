simplification_decisions:
- pob_phrase: Jeshua, his sons and his brothers, and Kadmiel and his sons
  simplified_phrase: Jeshua and his sons and brothers, Kadmiel and his sons
  preserved_meaning: The two family groups are parallel participants in the same action.
  reasoning_layer_used: Lexical decisions on the coordinated family groups
  rationale: The revised list avoids implying that one family joined the other.
- pob_phrase: stood together as one to oversee
  simplified_phrase: stood together as one. These Levites supervised
  preserved_meaning: The Levites acted in unity as supervisors.
  reasoning_layer_used: Lexical decisions for עמד, כאחד, and נצח
  rationale: Two sentences preserve the standing image and make the supervisory role easy to follow.
- pob_phrase: those doing the work in the house of God
  simplified_phrase: those doing the work in the house of God
  preserved_meaning: The verse locates the work at the temple without specifying its exact object.
  reasoning_layer_used: Lexical decisions for עֹשֵׂה הַמְּלָאכָה and בְּבֵית הָאֱלֹהִים
  rationale: Keeping the location avoids narrowing the phrase to work performed on the building itself.
