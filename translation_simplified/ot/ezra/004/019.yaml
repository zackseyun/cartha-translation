translation:
  language: en
  text: I ordered a search, and they found that since ancient times this city has risen up against kings.[a] Rebellion and acts of sedition have taken place there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic can also suggest that the city “exalted itself against kings,” but here it means rising against their rule.
    reason: lexical_alternative
