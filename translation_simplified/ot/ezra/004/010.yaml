translation:
  language: en
  text: This letter was also from other peoples whom the great and noble Osnappar[a] had deported and resettled in the city of Samaria and elsewhere in the province called Beyond the River.[b] And now:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Osnappar is often identified as the Assyrian king Ashurbanipal, but the Aramaic text uses the name Osnappar.
    reason: cross_reference
  - marker: b
    text: Beyond the River was the Persian name for the province west of the Euphrates River.
    reason: cultural_note
  - marker: c
    text: The Aramaic uses a letter-writing formula that may also be translated “and so forth” or “at such a time.”
    reason: lexical_alternative
