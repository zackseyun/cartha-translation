translation:
  language: en
  text: Then Rehum the commander, Shimshai the scribe, and the rest of their associates—the judges,[a] the officials,[b] the Tarpelites, the Persians, the people from Erech, the Babylonians, and the people of Susa (that is, the Elamites)—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Dinaites.” The Aramaic word may refer either to judges or to an ethnic group; the official context favors “judges.”
    reason: alternative_reading
  - marker: b
    text: Or “the Apharsathchites.” The difficult Aramaic word may name a people group, but here it is understood as an administrative title.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the Erechites
  simplified_phrase: the people from Erech
  preserved_meaning: It identifies the group by its origin in Erech.
  reasoning_layer_used: lexical alternative for ארכוי
  rationale: The place-based wording avoids an unfamiliar ethnic label.
- pob_phrase: the men of Susa
  simplified_phrase: the people of Susa
  preserved_meaning: It refers to the inhabitants of Susa, identified here as Elamites.
  reasoning_layer_used: lexical decision for שׁוּשַׁנְכָיֵא
  rationale: “People of Susa” is natural and does not imply that only males are meant.
