translation:
  language: en
  text: Then they went to Zerubbabel and the leaders of the ancestral families. They said, “Let us join you in building. We seek[a] your God just as you do, and we have been offering sacrifices to him[b] since the time of Esar-haddon king of Assyria, who brought us up here.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “seek” can also mean “worship” or “inquire of” in a religious setting.
    reason: lexical_alternative
  - marker: b
    text: The written Hebrew says “not offering sacrifices,” but many understand this as a scribal form or idiom meaning “offering sacrifices to him.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: the heads of the fathers’ houses
  simplified_phrase: the leaders of the ancestral families
  preserved_meaning: These were leaders of kinship groups descended from earlier generations.
  reasoning_layer_used: POB lexical decision
  rationale: This replaces an unfamiliar biblical idiom while retaining the ancestral family structure.
- pob_phrase: Let us build with you
  simplified_phrase: Let us join you in building
  preserved_meaning: They proposed participating alongside Zerubbabel’s community in the building work.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: This keeps the reciprocal proposal without suggesting a subordinate helping role.
- pob_phrase: for like you we seek your God
  simplified_phrase: We seek your God just as you do
  preserved_meaning: They claimed the same religious pursuit as their hearers without confirming its sincerity.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Ordinary clause order clarifies the comparison while preserving the narrative tension.
translation_notes:
  risk_flags:
