translation:
  language: en
  text: But Zerubbabel, Jeshua, and the other family leaders of Israel told them, “You cannot join us in building the temple[a] for our God. We alone[b] will build it for Yahweh, the God of Israel, just as King Cyrus of Persia commanded us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “house,” referring here to the temple.
    reason: cultural_note
  - marker: b
    text: More literally, “we together”; in context, this means the Judean community without the offered partners.
    reason: lexical_alternative
