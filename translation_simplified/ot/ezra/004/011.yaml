translation:
  language: en
  text: 'Here is a copy of the letter they sent to King Artaxerxes:


    “Your servants, the men of the province called Beyond the River.[a] And now—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beyond the River” was the Persian name for the province west of the Euphrates River; the phrase may also be rendered “from Beyond the River.”
    reason: cultural_note
  - marker: b
    text: “And now” is a formal letter-writing expression, and the letter continues in the next verse.
    reason: simplification_note
