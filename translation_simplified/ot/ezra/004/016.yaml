translation:
  language: en
  text: 'We inform the king: If this city is rebuilt and its walls are finished, then, because of this, you will have no possession in the province called Beyond the River.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic word for “possession” can also mean “share” or, in this context, possibly “revenue.”
    reason: lexical_alternative
  - marker: b
    text: Beyond the River was the official Persian name for the province west of the Euphrates River.
    reason: cultural_note
simplification_decisions:
- pob_phrase: We make known to the king that
  simplified_phrase: 'We inform the king:'
  preserved_meaning: The writers formally notify the king of what follows.
  reasoning_layer_used: POB lexical decision for מְהוֹדְעִין
  rationale: “Inform” and a colon make the official report immediately clear.
- pob_phrase: its walls are completed
  simplified_phrase: its walls are finished
  preserved_meaning: The city’s fortifications are brought to completion.
  reasoning_layer_used: POB lexical decision for יִשְׁתַּכְלְלוּן
  rationale: “Finished” is familiar construction language with the same force.
- pob_phrase: then because of this you will have no possession in the province Beyond the River
  simplified_phrase: then, because of this, you will have no possession in the province called Beyond the River
  preserved_meaning: The rebuilding would cause the king to lose his political stake in the named province.
  reasoning_layer_used: POB lexical decisions, cultural note, and latest doctrine realignment
  rationale: The wording restores the explicit causal link and identifies the unfamiliar provincial title.
translation_notes:
  risk_flags:
