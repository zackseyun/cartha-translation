  preserved_meaning: Yahweh’s empowering presence gave Ezra courage.
  reasoning_layer_used: POB lexical rationale and theological decision
  rationale: The shorter wording retains the divine-hand image and the personal name Yahweh.
- pob_phrase: and I gathered leading men from Israel to go up with me
