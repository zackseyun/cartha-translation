translation:
  language: en
  text: Ezra, appoint court officials and judges in keeping with the wisdom of your God that is in your hand.[a] They are to judge all the people in the region called Beyond the River, west of the Euphrates—all who know the laws of your God. Teach those laws to anyone who does not know them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In your hand” may refer to wisdom Ezra possesses or to authority entrusted to him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: magistrates and judges
  simplified_phrase: court officials and judges
  preserved_meaning: Two distinct kinds of legal officers are appointed.
  reasoning_layer_used: Lexical decision for שָׁפְטִין וְדַיָּנִין.
  rationale: “Court officials” is clearer than “magistrates” while preserving the legal doublet.
- pob_phrase: who may judge
  simplified_phrase: They are to judge
  preserved_meaning: Judging the people is the appointed officials’ function.
  reasoning_layer_used: Lexical decision for דִּי לֶהֱוֺן דאנין.
  rationale: A direct sentence states their assigned duty more naturally.
- pob_phrase: and those who do not know them, you shall teach
  simplified_phrase: Teach those laws to anyone who does not know them
  preserved_meaning: Ezra must make God’s laws known to those unfamiliar with them.
  reasoning_layer_used: Lexical decisions for וְדִי לָא יָדַע and תְּהוֹדְעוּן.
  rationale: Naming “those laws” makes the object of teaching immediately clear.
