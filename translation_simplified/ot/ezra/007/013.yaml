translation:
  language: en
  text: I decree that anyone in my kingdom may go with you to Jerusalem if they are from the people of Israel, are one of their priests,[a] or are a Levite, and freely choose to go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic may instead mean “his priests,” but the context favors Israel’s priests.
    reason: alternative_reading
