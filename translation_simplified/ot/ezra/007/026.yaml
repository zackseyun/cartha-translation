translation:
  language: en
  text: Anyone who does not obey the law of your God and the law of the king must be punished without delay. The penalty may be death, banishment,[a] having their property taken away, or imprisonment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Aramaic term may also mean “expulsion” or, more literally, “uprooting” from one’s place or community.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let judgment be executed on him promptly
  simplified_phrase: must be punished without delay
  preserved_meaning: The offender is to receive judicial punishment promptly.
  reasoning_layer_used: lexical decision for אָסְפַּרְנָא and the judicial phrase
  rationale: The active wording makes the legal command easier to understand while retaining its force and urgency.
- pob_phrase: whether for death, or for banishment, or for confiscation of goods, or for imprisonment
  simplified_phrase: The penalty may be death, banishment, having their property taken away, or imprisonment
  preserved_meaning: The decree lists four possible judicial penalties.
  reasoning_layer_used: lexical decisions for the penalty terms
  rationale: A separate sentence and concrete wording make the list clear without merging its distinct penalties.
- pob_phrase: the law of your God and the law of the king
  simplified_phrase: the law of your God and the law of the king
  preserved_meaning: Divine law and royal law remain coordinated authorities in the decree.
  reasoning_layer_used: theological decision on coordinated legal authorities
  rationale: This phrase is retained because simplifying it could wrongly subordinate one law to the other.
translation_notes:
  risk_flags:
  - risk: “Banishment” may overstate the precise sense of the rare Aramaic term.
    mitigation: The footnote preserves “expulsion” and literal “uprooting” as alternatives.
  - risk: “Having their property taken away” could sound less formally judicial than “confiscation.”
    mitigation: Its placement in the explicit penalty list preserves the state-imposed legal sense.
