translation:
  language: en
  text: because the king and his seven counselors have sent you to look into matters in Judah and Jerusalem according to the law of your God that you have.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “sent from before the king,” a court expression showing that the assignment comes from the royal presence.
    reason: lexical_alternative
  - marker: b
    text: Literally, the law “that is in your hand,” meaning it is in your possession or entrusted to you.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you are sent from before the king and his seven counselors
  simplified_phrase: the king and his seven counselors have sent you
  preserved_meaning: Ezra's assignment comes from the king and his seven royal advisers.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: Active wording is easier to follow, while the footnote preserves the formal court idiom.
- pob_phrase: to inquire concerning Judah and Jerusalem
  simplified_phrase: to look into matters in Judah and Jerusalem
  preserved_meaning: Ezra is to examine the condition or conduct of Judah and Jerusalem.
  reasoning_layer_used: POB lexical decisions for לְבַקָּרָא and עַל
  rationale: This makes the administrative inquiry clear without narrowing its subject.
- pob_phrase: the law of your God that is in your hand
  simplified_phrase: the law of your God that you have
  preserved_meaning: God's law is in Ezra's possession or entrusted to him.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: Clear possession language avoids altering the singular hand idiom, which the footnote retains.
translation_notes:
  risk_flags:
  - risk: Active wording may soften the source's emphasis on commission from the royal presence.
    mitigation: Footnote a retains and explains the Aramaic court expression.
  - risk: “That you have” may sound like simple ownership rather than entrusted custody.
    mitigation: Footnote b preserves the singular image and both warranted senses.
