translation:
  language: en
  text: He was Abishua’s son.[a] Abishua was Phinehas’s son, Phinehas was Eleazar’s son, and Eleazar was Aaron’s son. Aaron was the chief priest.[b]
  philosophy: optimal-equivalence
  footnotes:
