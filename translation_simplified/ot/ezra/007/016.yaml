  reasoning_layer_used: lexical decisions for הִתְנַדָּבוּת and מִתְנַדְּבִין
  rationale: The rewrite avoids repetition while retaining both the voluntary gift and willing action.
- pob_phrase: for the house of their God that is in Jerusalem
  simplified_phrase: for the temple of their God in Jerusalem
