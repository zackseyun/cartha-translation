simplification_decisions:
- pob_phrase: And from the temple servants ... there were 220 temple servants
  simplified_phrase: There were also 220 temple servants from the group
  preserved_meaning: The group included exactly 220 members of the recognized temple-servant class.
  reasoning_layer_used: POB translation and lexical decision for נְתִינִים
  rationale: The new sentence removes repetition while retaining the group’s identity and exact number.
- pob_phrase: to the service of the Levites
  simplified_phrase: to help with the Levites’ work
  preserved_meaning: The temple servants were assigned to support the Levites in their service.
  reasoning_layer_used: POB lexical rationale for לַעֲבֹדַת הַלְוִיִּם
  rationale: Common wording makes the work relationship clear without defining its hierarchy.
- pob_phrase: were designated by name
  simplified_phrase: were identified by name
  preserved_meaning: Each servant was formally and individually named.
  reasoning_layer_used: POB lexical decision for נִקְּבוּ בְשֵׁמוֹת
  rationale: “Identified” is more familiar while the footnote preserves the possible sense of registration.
