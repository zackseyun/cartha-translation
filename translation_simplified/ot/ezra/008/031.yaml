translation:
  language: en
  text: Then, on the twelfth day of the first month, we left the Ahava River and began our journey to Jerusalem. The hand of our God was upon us, protecting us. He rescued us from the enemy’s hand and from an ambusher[a] along the way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from ambush” or “from someone lying in wait.”
    reason: lexical_alternative
