translation:
  language: en
  text: I was ashamed to ask the king to send troops and horsemen to protect us from enemies during our journey, because we had told him, “The hand of our God brings good to everyone who seeks him,[a] but his strength and his anger are against everyone who forsakes him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The hand of our God” is a Hebrew expression for God actively using his power and showing favor.
    reason: cultural_note
