translation:
  language: en
  text: I sent them to Iddo, the leader at Casiphia, and gave them a message to deliver. They were to ask Iddo and his brothers, the temple servants[a] there, to bring us people to serve[b] in the house of our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These temple servants were a recognized group also known as the Nethinim.
    reason: lexical_alternative
  - marker: b
    text: This refers to people who served at the temple, not necessarily holders of a formal religious office.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And I sent them to Iddo, the chief at the place Casiphia
  simplified_phrase: I sent them to Iddo, the leader at Casiphia
  preserved_meaning: Iddo was the person in charge at Casiphia and the destination of the envoys.
  reasoning_layer_used: POB lexical decisions for אִדּוֹ הָרֹאשׁ and בְּכָסִפְיָא הַמָּקוֹם
  rationale: “Leader” is common English, and omitting “the place” makes the location natural.
- pob_phrase: I put in their mouths words to speak
  simplified_phrase: gave them a message to deliver
  preserved_meaning: Ezra supplied the envoys with what they were to say.
  reasoning_layer_used: POB lexical rationale for וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  rationale: The Hebrew image is recast as its clear idiomatic meaning while retaining the commissioned message.
- pob_phrase: to bring us ministers for the house of our God
  simplified_phrase: to bring us people to serve in the house of our God
  preserved_meaning: Ezra requested additional personnel who would perform service in God’s house.
  reasoning_layer_used: POB lexical and theological decisions for מְשָׁרְתִים
  rationale: “People to serve” avoids the modern clergy sense of “ministers” without suggesting mere ability.
translation_notes:
  risk_flags:
  - risk: “Brothers” may mean relatives or close associates.
    mitigation: The text retains the POB wording without resolving the relationship.
  - risk: Plain wording for the requested workers could blur their distinction from the temple servants.
    mitigation: The recognized class remains “temple servants,” while the requested personnel are described separately as people brought to serve.
