  text: On the fourth day, the silver, gold, and temple vessels were weighed in the house of our God and entrusted to Meremoth son of Uriah, the priest. Eleazar son of Phinehas was with him, along with the Levites Jozabad son of Jeshua and Noadiah son of Binnui.
