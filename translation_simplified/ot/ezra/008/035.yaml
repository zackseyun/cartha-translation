translation:
  language: en
  text: 'The people who had returned from captivity offered burnt offerings[a] to the God of Israel: twelve bulls on behalf of all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering. All of it was a burnt offering to Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A burnt offering was a sacrifice offered wholly to God by fire.
    reason: cultural_note
  - marker: b
    text: The Hebrew says that all of it was a burnt offering, even though it has just identified the goats as a sin offering.
    reason: source_note
