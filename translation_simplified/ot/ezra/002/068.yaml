translation:
  language: en
  text: When some leaders of the fathers’ houses arrived at Yahweh’s house in Jerusalem, they willingly gave gifts so that God’s house could be set up on its foundation.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “fathers’ house” was an Israelite family or clan group descended through a male ancestor.
    reason: cultural_note
  - marker: b
    text: Or, “established in its place” or “on its site.”
    reason: alternative_reading
