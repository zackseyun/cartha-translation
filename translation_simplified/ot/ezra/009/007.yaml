translation:
  language: en
  text: From the time of our ancestors until today, we have been deeply guilty. Because of our iniquities, we, our kings, and our priests have been handed over to the power of kings from other lands, resulting in the sword, captivity, plunder, and public disgrace[a]—as is the case today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “shame of face,” meaning open shame or humiliation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: From the days of our fathers until this day, we have been in great guilt
  simplified_phrase: From the time of our ancestors until today, we have been deeply guilty
  preserved_meaning: The community’s serious guilt has continued from earlier generations to the present.
  reasoning_layer_used: POB lexical decisions for מִימֵי אֲבֹתֵינוּ, אַשְׁמָה, and עַד הַיּוֹם הַזֶּה
  rationale: This uses common time language while retaining guilt rather than mere shame.
- pob_phrase: have been given into the hand of the kings of the lands
  simplified_phrase: have been handed over to the power of kings from other lands
  preserved_meaning: The people and their leaders came under the control of foreign rulers.
  reasoning_layer_used: POB lexical decisions for נִתַּנּוּ, בְּיַד, and מַלְכֵי הָאֲרָצוֹת
  rationale: This explains the Hebrew power idiom directly.
- pob_phrase: to the sword, to captivity, to plunder, and to shame of face, as it is this day
  simplified_phrase: resulting in the sword, captivity, plunder, and public disgrace—as is the case today
  preserved_meaning: Being handed over brought distinct forms of judgment whose resulting condition remained evident in Ezra’s day.
  reasoning_layer_used: POB lexical decisions for the four judgment terms and כְּהַיּוֹם הַזֶּה
  rationale: The list remains attached to the handing over without claiming that every calamity was still occurring.
interpretive_expansions:
- pob_phrase: shame of face
  rendering: public disgrace
  claim: The phrase describes open humiliation, not only an inward feeling.
  evidence:
  - The POB lexical rationale says the Hebrew phrase denotes public disgrace.
  - The POB footnote gives “open shame” and “humiliation” as alternatives.
  confidence: high
  alternatives_preserved:
  - The literal image “shame of face” is preserved in the footnote.
translation_notes:
  risk_flags:
  - risk: “Resulting in” states the relationship between the handing over and the judgment list more explicitly than the POB syntax.
