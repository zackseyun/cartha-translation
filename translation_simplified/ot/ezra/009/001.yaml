translation:
  language: en
  text: After all this was finished, the officials came to me and said, “The people of Israel, the priests, and the Levites have not kept themselves separate from the peoples living in these lands. They follow the same abominations—the same detestable practices—as the Canaanites, Hittites, Perizzites, Jebusites, Ammonites, Moabites, Egyptians, and Amorites.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When these things were finished, the officials approached me, saying
  simplified_phrase: After all this was finished, the officials came to me and said
  preserved_meaning: The officials brought their report after the preceding events were completed.
  reasoning_layer_used: Lexical decisions for וּכְכַלּוֹת אֵלֶּה, נִגְּשׁוּ אֵלַי, and לֵאמֹר
  rationale: Natural narrative wording replaces a formal reporting structure.
- pob_phrase: The people of Israel, and the priests and the Levites
  simplified_phrase: The people of Israel, the priests, and the Levites
  preserved_meaning: All three coordinated groups are included in the accusation.
  reasoning_layer_used: Theological decision on the scope of the accusation
  rationale: A direct three-part list preserves the groups as coordinated rather than making two subsets of the first.
- pob_phrase: from the peoples of the lands, according to their abominations
  simplified_phrase: from the peoples living in these lands. They follow the same abominations—the same detestable practices—as
  preserved_meaning: The Israelites failed to remain separate and conformed to the other peoples’ strongly condemned practices.
  reasoning_layer_used: Lexical and theological decisions for מֵעַמֵּי הָאֲרָצוֹת and כְּתוֹעֲבֹתֵיהֶם
  rationale: Two sentences distinguish failure to separate from conformity while retaining the force of “abominations.”
interpretive_expansions:
- pob_phrase: according to their abominations
  rendering: They follow the same abominations—the same detestable practices—as
  claim: The accusation includes conformity to the other peoples’ strongly condemned practices.
  evidence:
  - The prefixed כ can express comparison or conformity.
  - The POB lexical rationale lists “following their abominations” as an alternative.
  confidence: high
  alternatives_preserved:
  - The exact practices are not specified.
  - The wording does not restrict the charge only to religious practices.
translation_notes:
  risk_flags:
  - risk: The ethnic list may sound as though every individual in each group practiced these abominations.
    mitigation: The wording retains the source’s group-level accusation without extending it to every individual.
