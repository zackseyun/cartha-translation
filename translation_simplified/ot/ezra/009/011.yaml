translation:
  language: en
  text: 'You gave this command through your servants the prophets: “The land you are entering to take possession of is impure because of the impurity of the peoples of those lands. Their detestable practices have filled it from end to end with uncleanness.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: which you commanded by the hand of your servants the prophets, saying
  simplified_phrase: You gave this command through your servants the prophets
  preserved_meaning: God gave the command through the prophets as his appointed servants.
  reasoning_layer_used: POB lexical decisions for בְּיַד, עֲבָדֶיךָ, and הַנְּבִיאִים
  rationale: The rewrite removes the Hebrew agency idiom while preserving prophetic mediation.
- pob_phrase: The land that you are entering to possess is a land of impurity
  simplified_phrase: The land you are entering to take possession of is impure
  preserved_meaning: The land is characterized by defilement as Israel enters to possess it.
  reasoning_layer_used: POB lexical and theological decisions for לְרִשְׁתָּהּ and אֶרֶץ נִדָּה
  rationale: The adjective and common verbal phrase make the statement direct without narrowing impurity to one category.
- pob_phrase: because of their abominations with which they have filled it
  simplified_phrase: Their detestable practices have filled it
  preserved_meaning: The peoples' deeply offensive practices have permeated the land.
  reasoning_layer_used: POB lexical decision for בְּתוֹעֲבֹתֵיהֶם and מִלְאוּהָ
  rationale: “Detestable practices” explains the strong biblical term in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Detestable practices” is more explanatory and less traditional than “abominations.”
    mitigation: It follows the documented lexical alternative and keeps the term's strong moral-religious force.
  - risk: “Through” does not retain the literal image “by the hand of.”
    mitigation: It clearly preserves the idiom's agency and the prophets' mediating role.
