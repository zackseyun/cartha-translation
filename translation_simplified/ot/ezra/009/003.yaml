simplification_decisions:
- pob_phrase: As soon as I heard this matter
  simplified_phrase: As soon as I heard about this matter
  preserved_meaning: Ezra reacted immediately after hearing about the reported situation.
  reasoning_layer_used: POB lexical decision for וּכְשָׁמְעִי and הַדָּבָר הַזֶּה
  rationale: Adding “about” makes the English natural without reducing the matter to mere speech.
- pob_phrase: I tore my garment and my robe
  simplified_phrase: I tore my clothes and my robe
  preserved_meaning: Ezra tore both his general clothing and his outer robe as an act of grief or horror.
  reasoning_layer_used: POB lexical decisions and cultural footnote
  rationale: “Clothes” is more immediately understandable than the singular “garment,” while “robe” preserves the distinct outer garment.
- pob_phrase: pulled out some of the hair of my head and my beard, and sat appalled
  simplified_phrase: I pulled out some hair from my head and beard, then sat there, appalled
  preserved_meaning: Ezra forcibly removed only part of his hair and then sat stunned by horror.
