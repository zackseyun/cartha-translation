translation:
  language: en
  text: Then everyone who trembled at the words of the God of Israel because of the exiles’ unfaithfulness came and gathered with me. I remained seated there, horrified, until the evening offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “evening offering” was the regular offering made at the temple in the evening; the Hebrew term often refers specifically to a grain offering.
    reason: cultural_note
