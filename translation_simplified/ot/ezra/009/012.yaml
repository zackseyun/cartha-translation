translation:
  language: en
  text: So now, do not let your daughters marry their sons, or let your sons marry their daughters. Never work for their peace or prosperity, so that you may grow strong, eat the good things of the land, and leave it to your sons as an inheritance forever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: give your daughters to their sons ... take their daughters for your sons
  simplified_phrase: let your daughters marry their sons ... let your sons marry their daughters
  preserved_meaning: The command prohibits intermarriage between the two groups.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Direct marriage language makes both Hebrew idioms immediately clear without weakening the prohibition.
- pob_phrase: Never seek their peace or their prosperity
  simplified_phrase: Never work for their peace or prosperity
  preserved_meaning: They must not actively pursue the other peoples’ peace or well-being.
  reasoning_layer_used: POB lexical decision for תִדְרְשׁוּ
  rationale: “Work for” clearly expresses the documented sense of active concern for their welfare.
- pob_phrase: eat the good of the land
  simplified_phrase: eat the good things of the land
  preserved_meaning: They may partake of the land’s bounty while the concrete eating image remains.
  reasoning_layer_used: POB lexical decision for וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  rationale: Adding “things” makes the Hebrew image natural in common English without flattening it to “enjoy.”
