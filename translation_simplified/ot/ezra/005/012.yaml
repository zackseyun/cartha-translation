  reasoning_layer_used: POB lexical and theological decision on יְהַב הִמּוֹ בְּיַד
  rationale: The natural English idiom keeps God's direct role in the judgment.
- pob_phrase: carried the people away to Babylon
  simplified_phrase: took the people away into exile in Babylon
  preserved_meaning: Nebuchadnezzar forcibly removed the people to live as exiles in Babylon.
  reasoning_layer_used: POB lexical decision and footnote for וְעַמָּה הַגְלִי
