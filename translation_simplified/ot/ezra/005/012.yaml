translation:
  language: en
  text: So, because our ancestors made the God of heaven angry, he handed them over to Nebuchadnezzar the Chaldean, king of Babylon. Nebuchadnezzar destroyed this house[a] and took the people away into exile in Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “This house” means the temple.
    reason: cultural_note
