  simplified_phrase: So, because our ancestors made the God of heaven angry
  preserved_meaning: The ancestors caused God's anger, leading to judgment.
  reasoning_layer_used: POB lexical decisions for לָהֵן, אֲבָהֳתַנָא, and הַרְגִּזוּ
  rationale: Common wording preserves the causal force and solemn reality of divine anger.
- pob_phrase: he gave them into the hand of
