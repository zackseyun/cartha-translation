translation:
  language: en
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak set to work building the house of God in Jerusalem.[a] The prophets of God were with them, helping them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the temple of God; the Aramaic literally says “the house of God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: arose and began to build
  simplified_phrase: set to work building
  preserved_meaning: They took action and began the building work.
  reasoning_layer_used: Lexical decisions for קָמוּ, וְשָׁרִיו, and לְמִבְנֵא
  rationale: The idiom makes their decisive start clear in natural English.
- pob_phrase: the house of God that is in Jerusalem
  simplified_phrase: the house of God in Jerusalem
  preserved_meaning: God’s house is identified by its location in Jerusalem.
  reasoning_layer_used: Lexical and theological decision for בֵּית אֱלָהָא
  rationale: The shorter phrase retains the source image while removing an unnecessary relative clause.
- pob_phrase: and with them were the prophets of God, supporting them
  simplified_phrase: The prophets of God were with them, helping them.
  preserved_meaning: God’s prophets accompanied the builders and actively supported them.
  reasoning_layer_used: Lexical decisions for וְעִמְּהוֹן and מְסָעֲדִין לְהוֹן
  rationale: A separate sentence and the accepted alternative “helping” make the action easier to follow.
