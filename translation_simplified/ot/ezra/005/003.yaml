translation:
  language: en
  text: At that time, Tattenai, governor of the province called Beyond the River,[a] came to them with Shethar-bozenai and their associates. They asked, “Who gave the official order for you to build this house—the temple—and finish this structure?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beyond the River” was the Persian name for the region west of the Euphrates River.
    reason: cultural_note
  - marker: b
    text: The word translated “structure” may refer to the temple’s building work, wall, or framework.
    reason: lexical_alternative
