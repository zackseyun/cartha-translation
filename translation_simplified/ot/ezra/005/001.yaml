  preserved_meaning: The prophecy was directed to Jews in the paired locations of Judah and Jerusalem.
  reasoning_layer_used: Lexical decision for דִּי בִיהוּד וּבִירוּשְׁלֶם
  rationale: The shorter wording retains both locations without implying permanent residence.
- pob_phrase: in the name of the God of Israel who was over them
  simplified_phrase: They spoke in the name of the God of Israel, who has authority over them
  preserved_meaning: The prophets spoke under God’s authority, and God remains over the Jews in authority and oversight.
  reasoning_layer_used: Lexical and theological decisions for בְּשֻׁם and עֲלֵיהוֹן
  rationale: A separate sentence clarifies the two authority relationships without making God’s authority sound past-limited.
