  text: The prophets Haggai and Zechariah son of Iddo prophesied to the Jews[a] in Judah and Jerusalem. They spoke in the name of the God of Israel, who has authority over them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” The term may refer to the Jewish people or, more specifically, to the people of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or “by the authority of the God of Israel.”
    reason: lexical_alternative
