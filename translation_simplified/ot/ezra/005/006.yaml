  preserved_meaning: The verse introduces a documentary copy and names its senders and recipient.
  reasoning_layer_used: POB translation and lexical decisions for “copy,” “letter,” and “sent”
  rationale: “Here is” introduces the copied letter in natural modern English.
- pob_phrase: the governor of Beyond the River
