  preserved_meaning: Beyond the River is the formal name of Tattenai’s administrative region.
  reasoning_layer_used: POB lexical rationale for עֲבַר נַהֲרָה
  rationale: “Province called” keeps the formal name while preventing a geographic misunderstanding.
- pob_phrase: his associates, the officials who were in Beyond the River
