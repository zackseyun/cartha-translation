translation:
  language: en
  text: Here is a copy of the letter that Tattenai, governor of the province called Beyond the River,[a] Shethar-bozenai, and his associates—the officials in that province—sent to King Darius.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beyond the River was the Persian name for the province west of the Euphrates River.
    reason: cultural_note
  - marker: b
    text: Or “the Afarsachites,” if the term names a people or administrative group rather than officials.
    reason: alternative_reading
