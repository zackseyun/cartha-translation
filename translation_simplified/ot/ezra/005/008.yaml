  language: en
  text: The king should know that we went to the province of Judah, to the house of the great God. It is being built with huge stones[a], and timber is being set into the walls. They are doing this work diligently[b], and it is making good progress through their efforts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great stones”; the Aramaic refers generally to very large building stones.
    reason: lexical_alternative
  - marker: b
    text: Or “carefully,” or possibly “rapidly”; the Aramaic clearly indicates that the work was proceeding effectively.
    reason: lexical_alternative
