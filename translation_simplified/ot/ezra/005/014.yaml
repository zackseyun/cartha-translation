  text: Also, Nebuchadnezzar had taken the gold and silver vessels used in the house of God from the temple in Jerusalem and brought them to the temple in Babylon. King Cyrus then removed them from the temple in Babylon and gave them to a man named Sheshbazzar, whom he had appointed governor.
