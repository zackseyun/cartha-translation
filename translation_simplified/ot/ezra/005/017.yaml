translation:
  language: en
  text: Now, if the king approves, please have the royal records kept in the treasury in Babylon searched to find out whether King Cyrus issued a decree to rebuild[a] this house of God in Jerusalem. Then let the king send us his decision about this matter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic can also be translated “build”; “rebuild” reflects the restoration context.
    reason: lexical_alternative
