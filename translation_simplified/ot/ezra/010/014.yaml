translation:
  language: en
  text: Please let our leaders act on behalf of the whole assembly. Everyone in our cities who has taken foreign wives[a] should come at scheduled times, accompanied by the elders and judges of his city. This process should continue until the burning anger of our God over this matter is turned away from us.
  philosophy: optimal-equivalence
  footnotes:
