    mitigation: The main text follows the more natural plural syntax, while footnote a preserves the POB reading.
  - risk: “Returned exiles” does not reproduce the literal male-marked phrase “sons of the exile.”
    mitigation: It uses POB’s accepted alternative and preserves the corporate historical reference.
