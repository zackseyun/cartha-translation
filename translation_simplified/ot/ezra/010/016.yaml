translation:
  language: en
  text: So the returned exiles did this. Ezra the priest and men who were heads of ancestral families, each identified by name and family, set themselves apart.[a] On the first day of the tenth month, they sat down to investigate the matter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Ezra the priest set apart the men.” The Hebrew may describe Ezra and the men separating themselves or Ezra appointing the men.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the sons of the exile
  simplified_phrase: the returned exiles
  preserved_meaning: The phrase identifies the community that had returned from exile.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: This accepted alternative states the corporate historical meaning directly.
- pob_phrase: men, heads of fathers’ houses according to their fathers’ houses, all of them by name
  simplified_phrase: men who were heads of ancestral families, each identified by name and family
  preserved_meaning: The men were named leaders identified by their paternal clans.
  reasoning_layer_used: POB lexical decisions for family heads, fathers’ houses, and names
  rationale: The wording explains the social structure without implying that someone actively grouped the men.
- pob_phrase: they sat down ... to investigate the matter
  simplified_phrase: they sat down to investigate the matter
  preserved_meaning: They convened to conduct the inquiry while retaining the physical image of sitting.
  reasoning_layer_used: POB lexical decisions for וַיֵּשְׁבוּ and לְדַרְיוֹשׁ הַדָּבָר
  rationale: The plain wording preserves both the concrete action and its administrative purpose.
translation_notes:
  risk_flags:
