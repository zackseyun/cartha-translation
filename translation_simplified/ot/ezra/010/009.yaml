translation:
  language: en
  text: Within the three-day deadline, all the men of Judah and Benjamin[a] gathered in Jerusalem. It was the twentieth day of the ninth month. Everyone there sat in the open plaza at the house of God.[b] They were trembling because of this matter and because of the heavy rain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is masculine and probably refers to the male members or representatives who had been summoned.
    reason: lexical_alternative
  - marker: b
    text: This was a broad open area at the temple, not necessarily an inner courtyard.
    reason: cultural_note
