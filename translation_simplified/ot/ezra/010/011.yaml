translation:
  language: en
  text: Now give thanks to the LORD,[a] the God of your fathers, and do what pleases him. Separate yourselves from the peoples living in the land and from the foreign women.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make confession to the LORD.” The Hebrew expression can have either sense here.
    reason: alternative_reading
  - marker: b
    text: Or “foreign wives.” The Hebrew says “foreign women,” though the wider context concerns marriages.
    reason: lexical_alternative
