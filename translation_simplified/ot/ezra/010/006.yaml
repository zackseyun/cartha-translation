  reasoning_layer_used: Lexical decision for מִלִּפְנֵי and theological decision for בֵּית הָאֱלֹהִים
  rationale: The wording explains the Hebrew spatial expression while retaining “house of God.”
- pob_phrase: the chamber of Jehohanan
