translation:
  language: en
  text: So now, let us make a covenant with our God to send away all the women and the children born to them. We will follow the counsel of my lord and of those who tremble at the command of our God. Let this be done according to the law.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: what has been born from them
  simplified_phrase: the children born to them
  preserved_meaning: The women's offspring are to be sent away with them.
  reasoning_layer_used: source text and POB base translation
  rationale: The concrete term “children” makes the collective expression immediately clear.
- pob_phrase: according to the counsel of my lord and of those who tremble
  simplified_phrase: We will follow the counsel of my lord and of those who tremble
  preserved_meaning: The action is to follow the counsel given by my lord and the God-fearing community.
  reasoning_layer_used: POB base translation and applied revision
  rationale: A separate sentence clarifies the dense clause while retaining the deliberately chosen title “my lord.”
- pob_phrase: and let it be done according to the law
  simplified_phrase: Let this be done according to the law
  preserved_meaning: The proposed action must conform to the law.
  reasoning_layer_used: POB base translation
  rationale: Naming the proposal as “this” gives the closing command a clear reference.
interpretive_expansions:
- pob_phrase: what has been born from them
  rendering: the children born to them
  claim: The expression refers to the women's offspring.
  evidence:
  - The source describes what was born from the women.
  - The POB connects this group directly with the women being sent away.
  confidence: high
