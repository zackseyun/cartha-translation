  reasoning_layer_used: Lexical decisions for בִּמְלֶאכֶת, בֵּית הָאֱלֹהִים, and אֱלֹהֵי יִשְׂרָאֵל
  rationale: This wording preserves the broad temple work rather than limiting it to construction.
