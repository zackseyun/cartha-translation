translation:
  language: en
  text: They joyfully celebrated the Feast of Unleavened Bread for seven days because Yahweh had given them joy. He had turned the heart of the king of Assyria[a] toward them so that the king would give them strength for the work of the house of the God of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text calls him “the king of Assyria,” although the ruler at this time was Persian. This older title may refer to his rule over territory that had belonged to the Assyrian Empire.
    reason: cultural_note
