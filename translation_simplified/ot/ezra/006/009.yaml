translation:
  language: en
  text: 'Provide all that is needed, as instructed by the priests in Jerusalem: young bulls, rams, and lambs for burnt offerings to the God of heaven, along with wheat, salt, wine, and oil. Give the priests these supplies every day without fail.'
  philosophy: optimal-equivalence
