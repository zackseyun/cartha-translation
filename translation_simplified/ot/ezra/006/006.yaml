translation:
  language: en
  text: Now, Tattenai, governor of the province called Beyond the River,[a] and Shethar-bozenai, together with your associates—the Persian officials in that province[b]—stay far away from there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beyond the River” was the Persian name for the province west of the Euphrates River.
    reason: cultural_note
  - marker: b
    text: The term translated “Persian officials” may instead be written as “Apharsachites.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: governor of the province Beyond the River
  simplified_phrase: governor of the province called Beyond the River
  preserved_meaning: Beyond the River remains the official Persian name of the province.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: Adding “called” helps readers recognize an administrative name rather than a general location.
- pob_phrase: your associates, the officials of Persia who are in Beyond the River
  simplified_phrase: your associates—the Persian officials in that province
  preserved_meaning: The associates are identified as Persian officials located in Beyond the River.
  reasoning_layer_used: POB lexical decisions and latest revision pass
  rationale: The dash and “that province” remove repetition while keeping the restored administrative meaning.
- pob_phrase: keep far away from there
  simplified_phrase: stay far away from there
  preserved_meaning: The king firmly commands the officials not to approach or interfere there.
  reasoning_layer_used: POB lexical decision
  rationale: “Stay far away” expresses the same prohibition in direct, natural English.
