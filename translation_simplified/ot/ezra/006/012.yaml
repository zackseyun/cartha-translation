translation:
  language: en
  text: May the God who has caused his name to dwell there[a] overthrow any king or people who stretches out a hand to change this decree or destroy this house of God in Jerusalem. I, Darius, have issued this decree. Let it be carried out promptly and carefully.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means that God chose the temple as the place specially associated with his name; it does not mean that he is confined there.
    reason: simplification_note
