  reasoning_layer_used: Lexical decision and immediate administrative context
  rationale: “Change” is plainer than “alter,” while “this decree” makes the reference clear.
- pob_phrase: let it be done with all diligence
  simplified_phrase: Let it be carried out promptly and carefully
  preserved_meaning: Darius commands both quick and thorough compliance.
  reasoning_layer_used: Lexical rationale for אָסְפַּרְנָא
  rationale: The two common adverbs clearly express the documented force of diligence.
- pob_phrase: this house of God that is in Jerusalem
