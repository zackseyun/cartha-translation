translation:
  language: en
  text: Then King Darius issued an order. They searched the archive building in Babylon, where treasures were stored.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic may also be understood as “a search was made,” without identifying who conducted it.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: issued a decree
  simplified_phrase: issued an order
  preserved_meaning: King Darius formally commanded that the search be conducted.
  reasoning_layer_used: POB lexical decision for שָׂם טְעֵם
  rationale: “Order” is more familiar than “decree” while retaining the force of a royal command.
- pob_phrase: in the house of the archives
  simplified_phrase: the archive building
  preserved_meaning: They searched an official building where records were kept.
  reasoning_layer_used: POB lexical rationale for בְּבֵית סִפְרַיָּא
  rationale: “Archive building” clearly expresses the administrative sense of the literal “house of the books/documents.”
- pob_phrase: where the treasures were stored, there in Babylon
  simplified_phrase: in Babylon, where treasures were stored
  preserved_meaning: The archive building was in Babylon and also served as a place of storage.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: The location and storage detail are retained in a more natural clause order.
