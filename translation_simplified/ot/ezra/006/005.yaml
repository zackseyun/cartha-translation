  text: Also return the gold and silver objects belonging to the house of God. Nebuchadnezzar had removed them from the temple in Jerusalem and taken them to Babylon. Bring each one back to its proper place in the Jerusalem temple, and put them in the house of God.[a]
  philosophy: optimal-equivalence
  footnotes:
