translation:
  language: en
  text: The Jewish elders continued building, and the work went well through the prophetic messages of Haggai the prophet and Zechariah son of Iddo. They finished the work by the decree of the God of Israel and by the decrees of the Persian kings Cyrus, Darius, and Artaxerxes.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the elders of the Jews were building and prospering
  simplified_phrase: The Jewish elders continued building, and the work went well
  preserved_meaning: The community leaders kept building successfully.
  reasoning_layer_used: Lexical decisions for the elders, ongoing building, and prospering
  rationale: This recasts the participles in natural English while preserving ongoing action and success.
- pob_phrase: through the prophecy of Haggai the prophet and Zechariah son of Iddo
  simplified_phrase: through the prophetic messages of Haggai the prophet and Zechariah son of Iddo
  preserved_meaning: The prophets' ministry was the means through which the work advanced.
  reasoning_layer_used: Lexical decision for בִּנְבוּאַת
  rationale: “Prophetic messages” makes the prophets' spoken ministry easier to understand.
- pob_phrase: by the decree of Cyrus and Darius and Artaxerxes king of Persia
  simplified_phrase: by the decrees of the Persian kings Cyrus, Darius, and Artaxerxes
  preserved_meaning: The named Persian rulers officially authorized the work.
  reasoning_layer_used: Lexical decisions for מִן טַעַם and מֶלֶךְ פָּרָס
  rationale: The reordered phrase clearly identifies all three rulers and their decrees.
translation_notes:
  risk_flags:
  - risk: Calling all three named rulers “Persian kings” makes the title's scope more explicit than the source's singular form.
    mitigation: The POB rationale identifies them collectively as Persian kings and says the English list may carry that sense.
  - risk: “The work went well” may sound less connected to divine favor than “prospering.”
    mitigation: The sentence retains the prophets' messages as the means of the builders' success.
