translation:
  language: en
  text: 'In the first year of King Cyrus’s reign, he issued this decree: “The house of God in Jerusalem must be rebuilt as the place where sacrifices are offered. Its foundations must be laid.[a] It is to be about 90 feet (27 meters) high and 90 feet wide.[b]”'
  philosophy: optimal-equivalence
  footnotes:
