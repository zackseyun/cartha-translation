    text: Or, “its foundations must be retained” or “raised up.” The Aramaic phrase is difficult; “must be laid” best fits the building context.
    reason: lexical_alternative
  - marker: b
    text: 'Aramaic: sixty cubits high and sixty cubits wide.'
    reason: cultural_note
