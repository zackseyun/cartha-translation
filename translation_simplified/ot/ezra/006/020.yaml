translation:
  language: en
  text: The priests and Levites had purified themselves together, and all of them were ceremonially clean. They slaughtered the Passover lamb for everyone in the community that had returned from exile, for their brothers, the priests, and for themselves.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as one; all of them were clean
  simplified_phrase: together, and all of them were ceremonially clean
  preserved_meaning: The priests and Levites purified themselves in unity, and every one of them met the ritual requirement.
  reasoning_layer_used: POB applied revision and immediate Passover context
  rationale: “Together” clearly conveys the unity protected by “as one,” while “ceremonially” identifies the kind of cleanness.
- pob_phrase: all the sons of the exile
  simplified_phrase: everyone in the community that had returned from exile
  preserved_meaning: The whole returned exile community received the Passover sacrifice, not only those who personally made the journey.
  reasoning_layer_used: POB base text and immediate historical context
  rationale: The community wording preserves the group designation without limiting it to direct returnees.
- pob_phrase: their brothers the priests
  simplified_phrase: their brothers, the priests
  preserved_meaning: The priests remain a distinct group related as brothers to the priests and Levites preparing the sacrifice.
  reasoning_layer_used: POB base text and source syntax
  rationale: The appositive wording preserves both the family image and the distinction between priests and Levites.
interpretive_expansions:
- pob_phrase: clean
  rendering: ceremonially clean
  claim: Their cleanness concerned ritual readiness for Passover rather than ordinary hygiene.
  evidence:
  - The preceding phrase says they had purified themselves.
  - The immediate setting is preparation for the Passover sacrifice.
  confidence: high
  alternatives_preserved:
  - ritually clean
translation_notes:
  risk_flags:
  - risk: “Brothers” may be read as biological siblings.
    mitigation: The appositive “the priests” signals a communal relationship while preserving the source image.
