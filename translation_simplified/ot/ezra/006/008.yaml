translation:
  language: en
  text: 'I now decree what you must do for these Jewish elders as they rebuild the house of God: Promptly pay them the full cost of the work from the king’s resources in the province Beyond the River,[a] so that the work does not stop.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beyond the River” was the Persian administrative name for the region west of the Euphrates.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And by me a decree is issued concerning what you are to do with these elders of the Jews
  simplified_phrase: I now decree what you must do for these Jewish elders
  preserved_meaning: The king issues an official directive concerning the Jewish leaders.
  reasoning_layer_used: POB lexical decisions for שִׂים טְעֵם, לְמָא דִי תַעַבְדוּן, and שָׂבֵי יְהוּדָיֵא
  rationale: The active form makes the royal command direct and easy to follow.
- pob_phrase: the full expense is to be paid promptly to these men from the king’s goods
  simplified_phrase: Promptly pay them the full cost of the work from the king’s resources
  preserved_meaning: The elders must promptly receive complete funding for the rebuilding from royal assets.
  reasoning_layer_used: POB lexical decisions for נִכְסֵי מַלְכָּא, אָסְפַּרְנָא, נִפְקְתָא, and תֶּהֱוֵא מִתְיַהֲבָא
  rationale: Naming the cost of the work prevents it from sounding like the elders’ personal expenses.
- pob_phrase: so that the work may not cease
  simplified_phrase: so that the work does not stop
  preserved_meaning: The funding is intended to prevent interruption of the rebuilding.
  reasoning_layer_used: POB lexical decision for דִּי לָא לְבַטָּלָא
  rationale: “Does not stop” expresses the same purpose in ordinary English.
interpretive_expansions:
- pob_phrase: the full expense
  rendering: the full cost of the work
  claim: The expense is the cost of the temple-rebuilding project, not the elders’ personal expenses.
  evidence:
