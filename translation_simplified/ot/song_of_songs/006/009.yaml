translation:
  language: en
  text: There is only one—my dove, my flawless one.[a] She is her mother’s one and only, the favorite of the woman who gave birth to her.[b] Young women saw her and called her blessed. Queens and concubines praised her too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my perfect one”; the Hebrew describes her as complete, whole, or without fault.
    reason: lexical_alternative
  - marker: b
    text: Literally, “pure” or “clear”; here it describes her as her mother’s choice or favorite.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My dove, my flawless one, is the only one
  simplified_phrase: There is only one—my dove, my flawless one
  preserved_meaning: She alone holds this unique place while the dove image and praise remain intact.
  reasoning_layer_used: POB lexical decisions for יוֹנָתִי, תַמָּתִי, and אַחַת הִיא
  rationale: The new sentence states her exclusiveness in a more direct poetic form.
- pob_phrase: she is her mother's only one
  simplified_phrase: She is her mother’s one and only
  preserved_meaning: She has a singular and cherished status in relation to her mother.
  reasoning_layer_used: POB source audit for אַחַת הִיא לְאִמָּהּ
  rationale: The familiar phrase “one and only” makes the repeated emphasis natural in English.
- pob_phrase: queens and concubines also praised her
  simplified_phrase: Queens and concubines praised her too
  preserved_meaning: Both courtly groups join the young women in honoring her.
  reasoning_layer_used: POB lexical decisions for מְלָכוֹת, פִילַגְשִׁים, and וַיְהַלְלוּהָ
  rationale: Moving “also” to “too” gives the clause a simpler modern flow.
translation_notes:
  risk_flags:
  - risk: “One and only” could be read as proving that her mother had no other children.
    mitigation: The wording follows POB’s singularity decision without adding a claim about the family’s full makeup.
  - risk: “Favorite” expresses the relational sense of a Hebrew word whose literal range includes “pure” or “clear.”
    mitigation: Footnote b preserves the lexical alternative and its contextual basis.
