translation:
  language: en
  text: 'There is only one: my dove, my flawless one.[a] She is her mother’s only one, pure in the eyes of the one who gave birth to her.[b] Young women saw her and called her blessed.[c] Queens and concubines praised her too.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my perfect one”; the word describes completeness or blameless beauty.
    reason: lexical_alternative
  - marker: b
    text: “Pure” may also mean “choice” or “radiant.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says “daughters,” a poetic term that can refer to young women.
    reason: cultural_note
