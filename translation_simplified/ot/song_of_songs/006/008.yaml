translation:
  language: en
  text: There are sixty queens and eighty secondary wives,[a] and more young women than anyone can count.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is traditionally translated “concubines,” women recognized as royal partners but with lower status than queens or wives.
    reason: simplification_note
  - marker: b
    text: Or “maidens”; possibly “virgins.” The Hebrew broadly means young women and does not necessarily mean virgins.
    reason: lexical_alternative
