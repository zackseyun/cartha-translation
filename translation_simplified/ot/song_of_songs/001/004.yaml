translation:
  language: en
  text: Draw me along after you; let us run! The king has brought me into his private rooms. We will rejoice and be glad in you. We will celebrate your love more than wine.[a] They are right to love you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “remember,” “recount,” or “praise” your love more than wine.
    reason: lexical_alternative
  - marker: b
    text: Or “The upright love you.” The Hebrew can describe either the rightness of their love or the upright people as those who love you.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Draw me after you
  simplified_phrase: Draw me along after you
  preserved_meaning: The speaker asks the beloved to draw her after him while retaining the image of attraction.
  reasoning_layer_used: Lexical decisions for מָשְׁכֵנִי and אַחֲרֶיךָ
  rationale: “Along after you” makes the direction of the poetic image easier to follow.
- pob_phrase: his chambers
  simplified_phrase: his private rooms
  preserved_meaning: The king brings the speaker into his intimate inner rooms.
  reasoning_layer_used: Lexical decision for חֲדָרָיו
  rationale: “Private rooms” conveys the intimate setting without the uncommon word “chambers.”
- pob_phrase: Rightly do they love you
  simplified_phrase: They are right to love you
  preserved_meaning: Their love for the beloved is fitting and well founded.
  reasoning_layer_used: Lexical decision for מֵישָׁרִים
  rationale: The direct sentence removes the poetic inversion while preserving the preferred adverbial reading.
translation_notes:
  risk_flags:
  - risk: “Private rooms” is less poetic than “chambers.”
    mitigation: The wording preserves both the inner setting and its intimate character.
  - risk: The main text may obscure the alternate reading “The upright love you.”
    mitigation: Footnote [b] preserves the documented Hebrew ambiguity.
