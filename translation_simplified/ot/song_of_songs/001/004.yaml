  rationale: This keeps the image of being drawn while making “after you” immediately clear.
- pob_phrase: his chambers
  simplified_phrase: his inner rooms
  preserved_meaning: The king has brought the speaker into rooms farther inside his residence.
  reasoning_layer_used: Lexical decision for חֲדָרָיו
  rationale: “Inner rooms” is common English without losing the intimate setting.
- pob_phrase: we will extol your love
