  text: Do not stare at me because my skin is dark; the sun has scorched me.[a] My mother’s sons[b] were angry with me. They made me guard the vineyards, but I have not guarded my own vineyard.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered, “because I am black”; here it describes her sun-darkened appearance.
    reason: lexical_alternative
  - marker: b
    text: That is, her brothers; the Hebrew specifically says “sons of my mother.”
    reason: simplification_note
  - marker: c
    text: “My own vineyard” is probably a metaphor, but the Hebrew does not identify exactly what it represents.
    reason: cultural_note
