simplification_decisions:
- pob_phrase: because I am dark, because the sun has scorched me
  simplified_phrase: because I am dark. The sun has scorched me.
  preserved_meaning: Her darkened appearance results from harsh exposure to the sun.
  reasoning_layer_used: Lexical decisions for שְׁחַרְחֹרֶת and שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  rationale: Two short sentences make the cause clear without weakening the image of scorching.
- pob_phrase: they made me keeper of the vineyards
  simplified_phrase: made me guard the vineyards
  preserved_meaning: Her mother’s sons imposed vineyard-guarding work on her.
  reasoning_layer_used: Lexical decision for שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  rationale: The verb phrase is more natural than the occupational noun “keeper.”
- pob_phrase: my own vineyard I have not kept
  simplified_phrase: Yet I have not guarded my own vineyard
  preserved_meaning: She contrasts guarding other vineyards with neglecting her own, while leaving the metaphor open.
  reasoning_layer_used: Lexical decision for לֹא נָטָרְתִּי and theological decision on the vineyard metaphor
  rationale: “Guarded” clarifies the repeated action, while “my own vineyard” preserves the poetic ambiguity.
