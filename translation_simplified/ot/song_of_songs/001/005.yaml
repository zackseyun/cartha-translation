translation:
  language: en
  text: Daughters of Jerusalem, my skin is dark, but I am lovely.[a] I am like the tents of Kedar,[b] like the curtains of Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “My skin is dark and I am lovely.” The Hebrew says “and,” though the context likely implies a contrast.
    reason: alternative_reading
  - marker: b
    text: Kedar was associated with dark-colored nomadic tents.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I am dark
  simplified_phrase: my skin is dark
  preserved_meaning: The woman describes her dark outward coloration without specifying ethnicity.
  reasoning_layer_used: Lexical decision and immediate context
  rationale: Naming her skin prevents readers from taking “dark” as an emotion or mood.
- pob_phrase: I am dark, yet lovely, daughters of Jerusalem
  simplified_phrase: Daughters of Jerusalem, my skin is dark, but I am lovely.
  preserved_meaning: She directly addresses Jerusalem’s women while contrasting her dark appearance with her loveliness.
  reasoning_layer_used: POB theological decision and English readability
  rationale: Moving the address first and using “but” makes the sentence easier to follow.
- pob_phrase: like the tents of Kedar, like the curtains of Solomon
  simplified_phrase: I am like the tents of Kedar, like the curtains of Solomon.
  preserved_meaning: Both distinct poetic comparisons remain without assigning each one a fixed quality.
  reasoning_layer_used: Source syntax and grounding review
  rationale: A new sentence clarifies the comparison while preserving the repeated “like” structure.
