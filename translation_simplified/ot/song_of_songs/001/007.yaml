translation:
  language: en
  text: 'Tell me, you whom my soul loves: Where do you feed your flock? Where do you settle it down to rest at noon? Why should I be like a woman who veils herself[a] beside the flocks of your companions?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like a woman who wanders.” The Hebrew may describe either veiling herself or wandering as she searches for her beloved.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: where you pasture your flock
  simplified_phrase: Where do you feed your flock?
  preserved_meaning: She asks where he provides pasture for his flock.
  reasoning_layer_used: The lexical decision identifies the verb as pasturing, tending, or shepherding in this context.
  rationale: “Feed your flock” makes the shepherding action immediately clear.
- pob_phrase: where you make it lie down at noon
  simplified_phrase: Where do you settle it down to rest at noon?
  preserved_meaning: He actively causes the flock to settle and rest at midday.
  reasoning_layer_used: The lexical decision requires preservation of the Hebrew verb’s causative force.
  rationale: “Settle it down to rest” is natural English and clearly expresses active causation.
- pob_phrase: like one who veils herself
  simplified_phrase: like a woman who veils herself
  preserved_meaning: The speaker pictures herself as a veiled woman near the other shepherds’ flocks.
  reasoning_layer_used: The lexical decision favors the strong traditional sense while retaining the contextual alternative in a note.
  rationale: Naming her as a woman clarifies the feminine wording without removing the ambiguity.
translation_notes:
  risk_flags:
  - risk: The expression translated “veils herself” may instead imply wandering in search of the beloved.
    mitigation: The main text keeps POB’s preferred sense, while the footnote preserves the alternative.
