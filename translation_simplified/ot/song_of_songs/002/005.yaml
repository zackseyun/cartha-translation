translation:
  language: en
  text: Give me strength with raisin cakes; revive me with apples,[a] because I am sick with love.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word traditionally translated “apples” may mean another kind of fragrant fruit; the exact fruit is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Sustain me
  simplified_phrase: Give me strength
  preserved_meaning: She asks others to support her in her weakness.
  reasoning_layer_used: The lexical decision allows “Strengthen me” and identifies physical or emotional weakness in context.
  rationale: The direct request is easier to understand than the literary verb “sustain.”
- pob_phrase: refresh me
  simplified_phrase: revive me
  preserved_meaning: She asks for food to restore her.
  reasoning_layer_used: The lexical decision lists “revive me” and emphasizes the verb’s restorative sense.
  rationale: “Revive me” makes the parallel request for renewed strength more immediate.
- pob_phrase: for I am sick with love
  simplified_phrase: because I am sick with love
  preserved_meaning: Her overwhelming love is the reason for both requests.
  reasoning_layer_used: The lexical decision says the conjunction introduces the reason for the commands.
  rationale: “Because” states the connection more plainly while retaining the love-sickness metaphor.
translation_notes:
  risk_flags:
  - risk: “Revive me” may sound stronger than the POB wording “refresh me.”
    mitigation: It is a documented lexical alternative and remains within the stated restorative sense.
  - risk: Modern readers may assume the fruit was certainly a modern apple.
    mitigation: The footnote preserves the documented botanical uncertainty.
