translation:
  language: en
  text: Solomon owned a vineyard at Baal-hamon. He put it in the care of keepers.[a] Each man was expected to bring a thousand pieces of silver for the vineyard’s fruit.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gave the vineyard to the keepers”; here “gave” likely means assigning it to them to manage.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “from its fruit” or “with his fruit.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says “a thousand silver” without naming a specific unit.
    reason: cultural_note
