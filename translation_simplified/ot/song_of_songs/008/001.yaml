translation:
  language: en
  text: If only you were like a brother to me, one who nursed at my mother’s breasts![a] If I met you outside, I would kiss you, and no one would look down on me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A brother nursed by the same mother could receive public affection without bringing her social shame.
    reason: cultural_note
