  text: Who is this woman coming up from the wilderness,[a] leaning on the man she loves? Under the apple tree I awakened you.[b][c] There your mother went into labor with you; there the woman who gave birth to you went into labor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to a desert or any uncultivated wilderness.
    reason: lexical_alternative
  - marker: b
    text: Or “I aroused you”; in this love poem, the Hebrew may mean more than simply waking someone.
    reason: alternative_reading
  - marker: c
    text: At “I awakened you,” the Hebrew moves from describing her to addressing “you.” The speaker likely changes, but the Hebrew does not identify the speakers explicitly.
    reason: alternative_reading
