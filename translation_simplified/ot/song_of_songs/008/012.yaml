translation:
  language: en
  text: My own vineyard is before me.[a] Solomon, the thousand is yours,[b] and two hundred goes to those who guard its fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Is before me” may also mean “is in my keeping” or “is under my control.”
    reason: lexical_alternative
  - marker: b
    text: In context, “the thousand” refers to the thousand pieces of silver in the previous verse, though Hebrew here says only “the thousand.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My vineyard, my very own
  simplified_phrase: My own vineyard
  preserved_meaning: The vineyard image and the emphatic claim of personal possession remain intact.
  reasoning_layer_used: POB lexical decisions for כַּרְמִי and שֶׁלִּי
  rationale: Combining the repeated wording into “my own” makes the emphasis natural in modern English.
- pob_phrase: The thousand is for you, Solomon
  simplified_phrase: Solomon, the thousand is yours
  preserved_meaning: The stated amount is assigned directly to Solomon without adding an unstated currency term.
  reasoning_layer_used: POB lexical decisions for הָאֶלֶף and לְךָ שְׁלֹמֹה
  rationale: Moving the name first and using “is yours” makes the address easier to follow.
- pob_phrase: two hundred for those who keep its fruit
  simplified_phrase: two hundred goes to those who guard its fruit
  preserved_meaning: The additional amount is allotted to those who watch over the vineyard’s fruit.
  reasoning_layer_used: POB lexical decisions for וּמָאתַיִם, לְנֹטְרִים, and אֶת־פִּרְיוֹ
  rationale: Adding “goes to” completes the thought clearly, while “guard” expresses the workers’ role.
translation_notes:
