translation:
  language: en
  text: Even great waters cannot put out love; rivers cannot wash it away. If a man offered all his household wealth in exchange for love, he would be completely despised.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “people would surely despise him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Many waters cannot quench love
  simplified_phrase: Even great waters cannot put out love
  preserved_meaning: Overwhelming waters cannot extinguish love, which the context pictures as a flame.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: “Great waters” preserves the overwhelming-water image, while “put out” makes the fire contrast clear.
- pob_phrase: nor can rivers sweep it away
  simplified_phrase: rivers cannot wash it away
  preserved_meaning: Powerful flowing waters cannot overwhelm or destroy love.
  reasoning_layer_used: POB lexical decision for לֹא יִשְׁטְפוּהָ
  rationale: “Wash it away” is common English and retains the destructive force of the water.
- pob_phrase: all the wealth of his house
  simplified_phrase: all his household wealth
  preserved_meaning: The hypothetical man offers the entire wealth of his household or estate.
  reasoning_layer_used: POB lexical decision for כָּל הוֹן בֵּיתוֹ
  rationale: “Household wealth” is concise and keeps both the wealth and estate limits of the Hebrew.
interpretive_expansions:
- pob_phrase: for love
  rendering: in exchange for love
  claim: The man is imagined as offering his wealth to obtain love.
  evidence:
