translation:
  language: en
  text: Even many waters cannot put out love. Rivers cannot sweep it away. If a man offered all his household’s wealth in exchange for love, he would be treated with utter contempt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “people would utterly despise him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Many waters cannot quench love
  simplified_phrase: Even many waters cannot put out love
  preserved_meaning: Many overwhelming waters cannot extinguish love as though it were a flame.
  reasoning_layer_used: POB lexical decision and the flame imagery of Song of Songs 8:6
  rationale: “Put out” makes the fire image immediately clear while retaining “many waters.”
- pob_phrase: all the wealth of his house
  simplified_phrase: all his household’s wealth
  preserved_meaning: The offer includes the man’s entire household wealth or estate.
  reasoning_layer_used: POB lexical rationale for כָּל הוֹן בֵּיתוֹ
  rationale: “Household’s wealth” clarifies “house” without broadening wealth to every possession.
- pob_phrase: he would be utterly despised
  simplified_phrase: he would be treated with utter contempt
  preserved_meaning: The response would be emphatic and complete scorn.
  reasoning_layer_used: POB lexical rationale for the Hebrew intensive construction
  rationale: The wording expresses the force of the contempt in familiar English.
interpretive_expansions:
- pob_phrase: for love
  rendering: in exchange for love
  claim: The man is imagined as trying to obtain love by offering wealth.
  evidence:
  - The POB lexical rationale identifies the preposition as transactional.
  - The conditional clause presents wealth as the offered price.
  confidence: high
  alternatives_preserved:
  - for love
  - for the sake of love
translation_notes:
  risk_flags:
  - risk: “Put out” is less elevated than “quench.”
    mitigation: It clearly preserves the poetic image of waters extinguishing flame-like love.
  - risk: “In exchange for love” states the transactional sense more explicitly than POB’s main wording.
    mitigation: It follows the POB lexical rationale without suggesting that love can actually be bought.
