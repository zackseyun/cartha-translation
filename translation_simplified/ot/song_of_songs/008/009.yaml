  text: If she is a wall, we will build a silver fortification on her. But if she is a door, we will close her in with a cedar plank.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that they will guard or barricade her with a cedar plank.
    reason: lexical_alternative
