  text: You have captured my heart, my sister[a], my bride. You have captured my heart with just one glance from your eyes, with just one jewel on your necklace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My sister” is an affectionate expression of intimacy, not a claim that she is his biological sister.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “with one ornament from your neck” or “with one ornament on your necklace.”
    reason: lexical_alternative
