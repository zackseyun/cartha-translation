translation:
  language: en
  text: Bride, your lips drip with honey from the comb.[a] Honey and milk are under your tongue. Your clothes have a fragrance like Lebanon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a specific word for honey from the comb, distinct from the general word for “honey” in the next sentence.
    reason: lexical_alternative
  - marker: b
    text: Lebanon was celebrated for its cedar forests and fresh mountain air.
    reason: cultural_note
