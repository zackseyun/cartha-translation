  preserved_meaning: Her lips are pictured as flowing with the sweetness of comb honey.
  reasoning_layer_used: The lexical decision distinguishes נֹפֶת from the general word for honey later in the verse.
  rationale: The added prepositions make the image natural in modern English without losing the specific honey term.
- pob_phrase: the fragrance of your garments is like the fragrance of Lebanon
  simplified_phrase: Your clothes have a fragrance like Lebanon
  preserved_meaning: Her clothing has a pleasant scent compared with Lebanon.
  reasoning_layer_used: The lexical decisions permit “clothes” and require preserving Lebanon’s geographic-poetic image.
  rationale: The shorter sentence removes repetition while keeping the comparison and pleasant scent.
