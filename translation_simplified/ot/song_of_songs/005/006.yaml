translation:
  language: en
  text: I opened the door for my beloved, but he had turned away and was gone.[a] When he spoke, I felt faint.[b] I searched for him, but I did not find him. I called to him, but he did not answer me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he had slipped away and passed on.” The Hebrew uses two verbs to emphasize that he left.
    reason: lexical_alternative
  - marker: b
    text: Literally, “My soul went out when he spoke.” The Hebrew may also mean, “My soul failed when he spoke” or “I was beside myself when he spoke.”
    reason: lexical_alternative
