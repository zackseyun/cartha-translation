translation:
  language: en
  text: I was asleep, but my heart was awake. I heard the sound of my beloved knocking.[a] “Open the door for me, my sister,[b] my darling, my dove, my blameless one.[c] For my head is drenched with dew, and my hair is wet with the drops of the night.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I heard the voice of my beloved.” The Hebrew word can mean either “sound” or “voice.”
    reason: lexical_alternative
  - marker: b
    text: Here “my sister” is a term of endearment.
    reason: cultural_note
  - marker: c
    text: Or “my perfect one” or “my undefiled one.” The Hebrew describes completeness, innocence, or purity.
    reason: lexical_alternative
