translation:
  language: en
  text: Women of Zion, go out and look at King Solomon wearing the crown[a] his mother placed on him on his wedding day—the day of his heart’s joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wreath” or “garland”; the Hebrew word may refer to a festive wedding wreath.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O daughters of Zion
  simplified_phrase: Women of Zion
  preserved_meaning: The women of Zion are directly addressed.
  reasoning_layer_used: POB lexical decision for בְּנוֹת צִיּוֹן
  rationale: “Women of Zion” conveys the group address without the archaic vocative “O.”
- pob_phrase: at King Solomon, with the crown with which his mother crowned him
  simplified_phrase: at King Solomon wearing the crown his mother placed on him
  preserved_meaning: The women are called to see Solomon with the particular crown his mother put on him.
  reasoning_layer_used: POB lexical decisions for בָּעֲטָרָה and שֶׁעִטְּרָה לוֹ אִמּוֹ
  rationale: This wording makes the scene clear without suggesting that his mother crowned him habitually.
- pob_phrase: on the day of his wedding, on the day of the joy of his heart
  simplified_phrase: on his wedding day—the day of his heart’s joy
  preserved_meaning: His wedding day is also identified as the day of his deep personal joy.
  reasoning_layer_used: POB lexical decisions for בְּיוֹם חֲתֻנָּתוֹ and שִׂמְחַת לִבּוֹ
  rationale: The shorter wording preserves both the parallel timing and the poetic heart image.
translation_notes:
  risk_flags:
