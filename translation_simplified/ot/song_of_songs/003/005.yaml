translation:
  language: en
  text: I solemnly put you under oath, daughters of Jerusalem, by the gazelles or the does of the field:[b] Do not stir up or awaken love until love desires to awaken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “until it pleases”; the Hebrew may also be understood personally as “until she pleases” or “until he pleases.”
    reason: alternative_reading
