  text: Daughters of Jerusalem, I place you under a solemn oath by the gazelles or the female deer of the field:[a] Do not stir up or awaken love until love itself desires to awaken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names gazelles and female deer and may also contain a poetic wordplay on “hosts.”
    reason: cultural_note
  - marker: b
