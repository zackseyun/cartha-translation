translation:
  language: en
  text: I will get up now and search through the city, through its marketplaces and streets. I will search for the one my soul loves. I searched for him, but I did not find him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will rise now and go about the city
  simplified_phrase: I will get up now and search through the city
  preserved_meaning: The speaker resolves to rise immediately and move through the city in search of her beloved.
  reasoning_layer_used: Lexical decisions for אָקוּמָה, נָא, and וַאֲסוֹבְבָה
  rationale: “Get up” and “search through” express the resolve and purposeful movement in ordinary English.
- pob_phrase: in the marketplaces and in the streets
  simplified_phrase: through its marketplaces and streets
  preserved_meaning: Her search extends across the city's public commercial areas and streets.
  reasoning_layer_used: Lexical decisions for בַּשְּׁוָקִים and וּבָרְחֹבוֹת
  rationale: “Through” connects these public places naturally to her movement across the city.
- pob_phrase: I will seek the one my soul loves. I sought him
  simplified_phrase: I will search for the one my soul loves. I searched for him
  preserved_meaning: The beloved remains the object of both her intended and completed search, while the refrain retains “soul.”
  reasoning_layer_used: Lexical decisions for אֲבַקְשָׁה, אֵת שֶׁאָהֲבָה נַפְשִׁי, and בִּקַּשְׁתִּיו
  rationale: “Search for” is clearer for common readers and preserves the poem's repeated verb.
translation_notes:
  risk_flags:
  - risk: “Get up” may sound less elevated than the poetic “rise.”
    mitigation: The wording preserves the physical action and immediate resolve without sounding archaic.
