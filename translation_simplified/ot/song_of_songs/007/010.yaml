translation:
  language: en
  text: Your mouth is like the finest wine.[a] It goes down smoothly for my beloved and glides over the lips of those who sleep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your palate”; the Hebrew word more specifically refers to the roof of the mouth or to taste.
    reason: lexical_alternative
  - marker: b
    text: Or “causes the lips of those who sleep to speak”; the rare Hebrew verb may describe either gentle movement over the lips or the wine’s effect on them.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And your mouth is like the best wine
  simplified_phrase: Your mouth is like the finest wine.
  preserved_meaning: Her mouth is compared to wine of the highest quality.
  reasoning_layer_used: POB lexical decisions for חִכֵּךְ and כְּיֵין הַטּוֹב
  rationale: “Finest wine” keeps the superlative force in natural poetic English.
- pob_phrase: going down smoothly for my beloved
  simplified_phrase: It goes down smoothly for my beloved
  preserved_meaning: The wine-like pleasure moves easily as her beloved enjoys it.
  reasoning_layer_used: POB lexical decisions for הוֹלֵךְ, לְדוֹדִי, and לְמֵישָׁרִים
  rationale: A new sentence makes the movement image easier to follow without changing its direction or smoothness.
- pob_phrase: the lips of sleepers
  simplified_phrase: the lips of those who sleep
  preserved_meaning: The poetic image still concerns lips moving while their owners sleep.
  reasoning_layer_used: POB lexical decision for שִׂפְתֵי יְשֵׁנִים
  rationale: “Those who sleep” is clearer than the less common noun “sleepers.”
