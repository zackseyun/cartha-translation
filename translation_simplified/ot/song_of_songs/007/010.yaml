  text: Your mouth[a] is like the very best wine. It flows smoothly to my beloved, moving the lips of those who sleep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More specifically, “your palate,” used here for the mouth.
