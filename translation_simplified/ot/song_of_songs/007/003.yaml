translation:
  language: en
  text: Your navel[a] is like a round bowl—may it never be empty of blended wine.[b] Your belly is like a mound of wheat, with lilies all around it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “your vulva.” The Hebrew term for this body part is debated; “navel” is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: This was wine blended with other ingredients, perhaps water or spices.
    reason: cultural_note
