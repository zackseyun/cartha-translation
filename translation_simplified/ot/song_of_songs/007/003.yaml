  text: Your navel[a] is like a rounded bowl; may it never be without mixed wine.[b] Your belly[c] is like a mound of wheat surrounded by lilies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead refer to the vulva; its meaning in this erotic poem is debated.
    reason: lexical_alternative
