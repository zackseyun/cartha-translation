translation:
  language: en
  text: Return, return, Shulammite! Return, return, so that we may look at you. Why are you looking at the Shulammite as though you were watching the dance of Mahanaim?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean, “What do you see in the Shulammite?—something like the dance of Mahanaim.”
    reason: alternative_reading
  - marker: b
    text: Mahanaim is probably a place name; the name may mean “two camps.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: Return, return, O Shulammite
  simplified_phrase: Return, return, Shulammite!
  preserved_meaning: The repeated summons and the ambiguous designation Shulammite remain intact.
  reasoning_layer_used: POB lexical decisions for שׁוּבִי and הַשּׁוּלַמִּית
  rationale: Removing the archaic vocative “O” makes the direct call natural without changing its force.
- pob_phrase: that we may look at you
  simplified_phrase: so that we may look at you
  preserved_meaning: The looking remains the purpose of the repeated command.
  reasoning_layer_used: POB lexical decision for וְנֶחֱזֶה בָּךְ
  rationale: “So that” expresses the purpose relationship more immediately in common English.
- pob_phrase: as at the dance of Mahanaim
  simplified_phrase: as though you were watching the dance of Mahanaim
  preserved_meaning: The comparison with viewing the dance remains explicit, and Mahanaim stays a place name.
  reasoning_layer_used: POB lexical decisions for כִּמְחֹלַת and הַמַּחֲנָיִם
  rationale: Supplying “watching” completes the comparison clearly without defining the unknown dance.
translation_notes:
  risk_flags:
  - risk: The final Hebrew question can be construed with “what” rather than “why.”
    mitigation: Footnote a preserves the important alternative reading.
  - risk: Modern readers may not recognize Mahanaim as a place name.
    mitigation: Footnote b identifies it and notes the possible meaning of its name.
