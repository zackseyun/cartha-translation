translation:
  language: en
  text: Then the women who lived nearby gave the child his name. They said, “A son has been born to Naomi!”[a] They named him Obed. Obed was the father of Jesse, and Jesse was the father of David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The women mean that Naomi’s family line has been restored through Ruth’s child, not that Naomi is the child’s biological mother.
    reason: lexical_alternative
