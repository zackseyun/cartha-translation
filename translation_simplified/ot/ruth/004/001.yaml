translation:
  language: en
  text: Boaz had gone up to the town gate[a] and was sitting there. Just then, the kinsman-redeemer[b] Boaz had mentioned was coming by. Boaz said, “Come over and sit here, Mr. So-and-so.”[c] The man came over and sat down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The town gate was a public place where legal and community matters were decided.
    reason: cultural_note
  - marker: b
    text: A kinsman-redeemer was a close male relative who could act in legal matters such as redeeming family property.
    reason: cultural_note
  - marker: c
    text: 'Hebrew: “Peloni Almoni,” an expression like “Mr. So-and-so” that deliberately leaves the man unnamed.'
    reason: lexical_alternative
