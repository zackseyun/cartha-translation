translation:
  language: en
  text: He will restore your life and care for you in your old age. For your daughter-in-law, who loves you, has given birth to him—she is better to you than seven sons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seven sons represented a full and ideal family blessing; Ruth is worth even more to Naomi.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he will be to you a restorer of life
  simplified_phrase: He will restore your life
  preserved_meaning: The child will bring restoration to Naomi's life.
  reasoning_layer_used: Lexical decision for לְמֵשִׁיב נֶפֶשׁ and theological decision to render נֶפֶשׁ as life.
  rationale: Active wording makes the Hebrew image easier to understand without changing its concrete sense.
- pob_phrase: a sustainer of your old age
  simplified_phrase: care for you in your old age
  preserved_meaning: The child will support Naomi as she grows old.
  reasoning_layer_used: Lexical decisions for וּלְכַלְכֵּל and אֶת שֵׂיבָתֵךְ.
  rationale: The verb “care for” is clearer than the abstract noun “sustainer.”
- pob_phrase: has borne him
  simplified_phrase: has given birth to him
  preserved_meaning: Ruth has delivered the child just mentioned.
  reasoning_layer_used: Lexical decision for יְלָדַתּוּ.
  rationale: The common phrase “given birth” is immediately clear while keeping the child as the referent.
translation_notes:
  risk_flags:
  - risk: “Restore your life” could be mistaken for literal resurrection.
    mitigation: The family context and promise of care indicate renewed life and well-being.
