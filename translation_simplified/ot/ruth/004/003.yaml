  text: Then he told the family redeemer[a], “Naomi has returned from the countryside of Moab. She is selling[b] the parcel of land that belonged to our relative Elimelech.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A family redeemer was a close relative responsible for protecting the family’s property and interests.
    reason: cultural_note
  - marker: b
    text: Or “has sold”; the Hebrew can describe a completed sale, but the legal discussion presents it as a current matter.
    reason: alternative_reading
