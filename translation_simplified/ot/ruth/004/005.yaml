translation:
  language: en
  text: Then Boaz said, “When you acquire the field from Naomi, you must also take Ruth the Moabite, the dead man’s wife, as your wife.[a] This will preserve the dead man’s family line and its claim to his inherited property.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text literally reads “I acquired” or “I have acquired,” but many understand the context to mean “you also acquire.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: On the day you acquire the field from the hand of Naomi
  simplified_phrase: When you acquire the field from Naomi
  preserved_meaning: The field legally passes from Naomi to the nearer redeemer.
  reasoning_layer_used: POB lexical decisions for בְּיוֹם and מִיַּד נָעֳמִי
  rationale: “When” and “from Naomi” express the legal transfer without opaque Hebrew idioms.
- pob_phrase: you also acquire Ruth the Moabite, the wife of the dead man
  simplified_phrase: you must also take Ruth the Moabite, the dead man’s wife, as your wife
  preserved_meaning: Redeeming the field includes accepting the marriage-related responsibility toward Ruth.
  reasoning_layer_used: POB lexical and theological decisions on the difficult Ruth clause
  rationale: This makes the obligation clear without presenting Ruth as property.
- pob_phrase: to raise up the name of the dead on his inheritance
  simplified_phrase: This will preserve the dead man’s family line and its claim to his inherited property
  preserved_meaning: The redemption preserves the dead man’s family line and its connection to his hereditary holding.
  reasoning_layer_used: POB cultural note and lexical decisions on לְהָקִים שֵׁם and עַל נַחֲלָתוֹ
  rationale: The wording plainly explains both the family-line and inheritance dimensions of the idiom.
interpretive_expansions:
- pob_phrase: you also acquire Ruth the Moabite
  rendering: you must also take Ruth the Moabite ... as your wife
  claim: The acquisition requires the redeemer to accept a marriage-related responsibility toward Ruth.
  evidence:
  - The POB rationale says acquiring the field entails taking Ruth in levirate-like responsibility.
  - The immediate narrative presents this obligation to the nearer redeemer.
  confidence: high
  alternatives_preserved:
  - The Hebrew first-person reading remains in the footnote.
- pob_phrase: raise up the name of the dead on his inheritance
  rendering: preserve the dead man’s family line and its claim to his inherited property
  claim: The action preserves both the deceased man’s family line and its connection to his hereditary property.
  evidence:
  - The POB cultural note identifies the family line and property claim.
  - The POB lexical rationale says the idiom perpetuates his line and standing.
  confidence: high
  alternatives_preserved:
  - The continuing-name idiom is explained rather than treated as literal resurrection.
translation_notes:
  risk_flags:
