translation:
  language: en
  text: Then the women said to Naomi, “Blessed be Yahweh! Today he has not left you without a family redeemer.[a][b] May his name be known and honored throughout Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A family redeemer was a close relative who acted to protect the family and restore its future.
    reason: cultural_note
  - marker: b
    text: The redeemer may be the newborn child, though Boaz’s work as redeemer also remains in view.
    reason: alternative_reading
