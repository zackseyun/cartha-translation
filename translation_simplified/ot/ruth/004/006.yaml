translation:
  language: en
  text: Then the family redeemer[a] said, “I cannot redeem it for myself, because I might put my own inheritance at risk. You redeem it instead, using my right of redemption,[b] because I cannot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was the nearer relative who had the first right and duty to redeem the family property; he is traditionally called the “kinsman-redeemer.”
    reason: cultural_note
  - marker: b
    text: More literally, “my redemption”; here it means his legal right and duty to redeem the property and marry Ruth within the family line.
    reason: lexical_alternative
