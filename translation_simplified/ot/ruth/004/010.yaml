translation:
  language: en
  text: I have also acquired Ruth the Moabite, Mahlon’s wife, to be my wife.[a] I am doing this to raise up the dead man’s name—that is, to preserve his family line and keep his name connected to his inheritance—so that his name may not be cut off from among his brothers or from the town gate, where legal matters are publicly witnessed and settled. You are witnesses today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “bought.” The Hebrew describes acquiring someone or something through a legal transaction.
    reason: lexical_alternative
