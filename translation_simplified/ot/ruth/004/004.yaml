translation:
  language: en
  text: 'So I thought I should let you know: “Acquire the property in the presence of those seated here and the elders of my people. If you will redeem it,[a] then redeem it. But if he will not redeem it,[b] tell me, so that I will know. No one has priority over you to redeem it, and I am next after you.” He answered, “I will redeem it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “redeem” means exercising a family right to acquire property.
    reason: cultural_note
  - marker: b
    text: The Hebrew reads “if he will not redeem it”; in context, some understand it as “if you will not redeem it.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: So I thought I should inform you, saying
  simplified_phrase: So I thought I should let you know
  preserved_meaning: Boaz intentionally brings the matter to the man’s attention.
  reasoning_layer_used: lexical decision for אֶגְלֶה אָזְנְךָ
  rationale: “Let you know” expresses the Hebrew idiom in natural English.
- pob_phrase: Buy it
  simplified_phrase: Acquire the property
  preserved_meaning: The man is invited to obtain the property through the redemption process.
  reasoning_layer_used: lexical decision for קְנֵה and doctrine realignment
  rationale: “Acquire” preserves the broader legal sense, while “property” identifies the object.
- pob_phrase: there is no one besides you to redeem it, and I am after you
  simplified_phrase: No one has priority over you to redeem it, and I am next after you
  preserved_meaning: The nearer man comes first in the legal order, with Boaz immediately after him.
  reasoning_layer_used: lexical rationale for וְאָנֹכִי אַחֲרֶיךָ and grounding review
  rationale: The wording clarifies priority without implying that Boaz lacks a redemption right.
