translation:
  language: en
  text: Then all the people at the town gate and the elders said, “We are witnesses. May Yahweh make the woman entering your household like Rachel and Leah, who together built up the family of Israel. May you prosper[a] in Ephrathah and make a name for yourself in Bethlehem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “act valiantly” or “show your worth”; the expression can include strength, wealth, and successful achievement.
