  reasoning_layer_used: POB lexical decision on לַזְּקֵנִים וְכָל הָעָם
  rationale: Adding “there” makes the scene natural in English without changing who was addressed.
- pob_phrase: from the hand of Naomi
  simplified_phrase: from Naomi
  preserved_meaning: The property was transferred from Naomi’s possession or control.
  reasoning_layer_used: POB cultural note and lexical decision on מִיַּד נָעֳמִי
  rationale: The opaque Hebrew idiom is replaced with its clear contextual meaning.
- pob_phrase: all that belonged to
  simplified_phrase: everything that belonged to
  preserved_meaning: Boaz acquired the full estate associated with each named person.
  reasoning_layer_used: POB lexical decisions on the two possession clauses
  rationale: “Everything” is more conversational while preserving the repeated scope of the transfer.
