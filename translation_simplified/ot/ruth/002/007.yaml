translation:
  language: en
  text: She said, “Please let me pick up the leftover grain and gather it from among the bundles of stalks behind the harvesters.” She came this morning and has stayed until now. She has spent only a little time sitting in the work shelter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of this final clause is difficult. It may mean, “She has rested in the shelter only a little,” and the word rendered “work shelter” literally means “house.”
    reason: alternative_reading
