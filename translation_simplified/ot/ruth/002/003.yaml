  text: So she went out to the field. When she arrived, she gathered grain left behind by the harvesters. As it happened,[a] she came to a part of the field that belonged to Boaz, who was from Elimelech’s family.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes apparent chance from a human viewpoint, while the wider story also invites readers to see God’s providence at work.
