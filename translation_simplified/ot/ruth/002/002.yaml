translation:
  language: en
  text: Ruth the Moabite said to Naomi, “Please let me go to the field and gather heads of grain left behind by the harvesters.[a] I will follow behind a man who shows me favor.” Naomi answered, “Go, my daughter.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gathering grain left behind after the harvest was called gleaning.
    reason: cultural_note
