translation:
  language: en
  text: Naomi said to her daughter-in-law, “May Yahweh bless him! Yahweh has not stopped showing kindness to the living or the dead.”[a] Then she added, “This man is a close relative of ours. He is one of the relatives with a recognized right or duty to help family members or reclaim family property.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that Boaz has not stopped showing kindness to the living and the dead.
    reason: alternative_reading
  - marker: b
    text: Such a relative is sometimes called a “kinsman-redeemer.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: Blessed be he by Yahweh
  simplified_phrase: May Yahweh bless him!
  preserved_meaning: Naomi asks Yahweh to bless Boaz.
  reasoning_layer_used: POB lexical decision for the Hebrew blessing formula
  rationale: The active blessing wish is clearer in ordinary English.
- pob_phrase: whose kindness has not forsaken the living or the dead
  simplified_phrase: Yahweh has not stopped showing kindness to the living or the dead
  preserved_meaning: Yahweh continues his kindness toward both the living and the dead.
  reasoning_layer_used: POB theological decision and lexical alternatives for חַסְדּוֹ and לֹא עָזַב
  rationale: A new sentence clarifies the chosen referent and replaces an opaque expression.
- pob_phrase: he is one of our redeemers
  simplified_phrase: He is one of the relatives with a recognized right or duty to help family members or reclaim family property
  preserved_meaning: Boaz is among the close relatives who hold family-redemption rights or duties.
  reasoning_layer_used: POB lexical rationale for מִגֹּאֲלֵנוּ and grounding review
  rationale: The wording explains the legal role without claiming that Boaz will take a particular action.
interpretive_expansions:
- pob_phrase: whose kindness
  rendering: Yahweh has not stopped showing kindness
  claim: The kindness is identified as Yahweh’s kindness.
  evidence:
