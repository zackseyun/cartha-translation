  - Yahweh is the nearer antecedent in the blessing formula.
  confidence: moderate
  alternatives_preserved:
  - The kindness may refer to Boaz.
- pob_phrase: one of our redeemers
  rendering: one of the relatives with a recognized right or duty to help family members or reclaim family property
  claim: The redeemer was a relative with recognized family-legal rights or duties concerning relatives or property.
  evidence:
  - The POB lexical rationale defines the role in terms of Israelite kinship law.
  - The POB footnote includes family members and property within the role’s scope.
  confidence: high
  alternatives_preserved:
  - kinsman-redeemer
  - redeemer
