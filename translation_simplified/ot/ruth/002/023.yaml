translation:
  language: en
  text: So Ruth stayed close to Boaz’s female workers and gleaned, gathering grain left behind after the harvesters.[a] She continued until both the barley and wheat harvests were over. She lived with her mother-in-law.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that Ruth “clung to” Boaz’s female workers, emphasizing her close association with them.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb may also be translated “stayed” or “remained with.”
    reason: lexical_alternative
