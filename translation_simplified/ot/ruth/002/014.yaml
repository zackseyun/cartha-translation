translation:
  language: en
  text: When it was time to eat, Boaz said to her, “Come over here. Have some bread, and dip a piece of it in the sour wine.”[a] She sat beside the harvest workers, and Boaz handed her some roasted grain. She ate until she was full and still had some food left over.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “vinegar,” but it likely refers here to a sour wine drink used by workers.
    reason: lexical_alternative
