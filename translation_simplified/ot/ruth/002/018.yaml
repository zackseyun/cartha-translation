translation:
  language: en
  text: Ruth picked up the grain and carried it into the city. Her mother-in-law saw what she had gleaned. Then Ruth took out the food she had saved after eating her fill and gave it to her.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: She picked it up and went into the city
  simplified_phrase: Ruth picked up the grain and carried it into the city
  preserved_meaning: Ruth physically lifted and transported the grain she had gleaned.
  reasoning_layer_used: The lexical decision for וַתִּשָּׂא includes both lifting and carrying in this context.
  rationale: Naming Ruth and the grain removes unclear pronouns while preserving the physical action.
- pob_phrase: what she had gleaned
  simplified_phrase: what she had gleaned
  preserved_meaning: Ruth gathered leftover crop behind the harvesters.
  reasoning_layer_used: The lexical audit identifies gleaning as a key agricultural and legal term in Ruth.
  rationale: The term “gleaned” is retained because a general word like “gathered” would lose the specific practice.
- pob_phrase: what she had left over after she was satisfied
  simplified_phrase: the food she had saved after eating her fill
  preserved_meaning: Ruth brought Naomi the portion remaining after Ruth had eaten enough.
  reasoning_layer_used: The lexical decisions identify the remainder as food saved from Ruth’s meal and allow “after she had eaten her fill.”
  rationale: The concrete wording makes the action and sequence immediately clear.
