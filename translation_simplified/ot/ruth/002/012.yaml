translation:
  language: en
  text: May Yahweh repay you for what you have done. May you receive a full reward[a] from Yahweh, the God of Israel. You have come to seek refuge under his wings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May your wages be complete.” The Hebrew can mean either wages or reward.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: repay your work
  simplified_phrase: repay you for what you have done
  preserved_meaning: Yahweh is asked to recompense Ruth for her loyal actions.
  reasoning_layer_used: Lexical decision for פָּעֳלֵךְ and immediate context
  rationale: The rewrite makes the object of repayment natural and clear in modern English.
- pob_phrase: may your reward be full from Yahweh
  simplified_phrase: may you receive a full reward from Yahweh
  preserved_meaning: The blessing asks that complete recompense come from Yahweh.
  reasoning_layer_used: Lexical decisions for מַשְׂכֻּרְתֵּךְ, שְׁלֵמָה, and מֵעִם
  rationale: An active receiving clause is easier to understand than the abstract original structure.
- pob_phrase: under whose wings you have come to seek refuge
  simplified_phrase: You have come to seek refuge under his wings
  preserved_meaning: Ruth has sought Yahweh’s protection, pictured as shelter beneath wings.
  reasoning_layer_used: Lexical decisions for לַחֲסוֹת and תַּחַת כְּנָפָיו
  rationale: A separate sentence removes difficult relative-clause syntax while keeping the protective image.
translation_notes:
  risk_flags:
  - risk: Splitting the relative clause may make its link to Yahweh less explicit.
    mitigation: The immediately preceding sentence names Yahweh as the God of Israel, so “his” remains clear.
