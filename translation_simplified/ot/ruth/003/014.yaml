translation:
  language: en
  text: She lay at his feet until morning. She got up before it was light enough for people to recognize one another. He said,[a] “Do not let anyone know that the woman came to the threshing floor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The speaker is most likely Boaz, though the Hebrew says only, “He said.”
    reason: alternative_reading
