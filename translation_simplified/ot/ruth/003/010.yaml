simplification_decisions:
- pob_phrase: You have made this last kindness greater than the first
  simplified_phrase: You have shown even greater kindness now than before
  preserved_meaning: Boaz compares Ruth’s recent act of loyal kindness with her earlier kindness.
  reasoning_layer_used: Lexical and theological decisions for הֵיטַבְתְּ, חֶסֶד, and the temporal comparison
  rationale: This states the comparison naturally without making the recent kindness sound ongoing.
- pob_phrase: by not going after the young men
  simplified_phrase: by not pursuing any of the young men
  preserved_meaning: Not seeking a young man as a marriage choice is how Ruth showed greater kindness.
  reasoning_layer_used: Lexical decision for לְבִלְתִּי לֶכֶת אַחֲרֵי and narrative context
  rationale: “By” preserves the explanatory link, while “pursuing” clarifies the relational sense.
