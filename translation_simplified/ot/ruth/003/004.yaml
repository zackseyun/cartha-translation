translation:
  language: en
  text: When he lies down, watch where he goes to sleep. Then go there, uncover his feet[a], and lie down[b]. He will tell you what to do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean the area around his feet or the lower part of where he is lying, not only his feet.
    reason: lexical_alternative
  - marker: b
    text: The written Hebrew says “and I lie down,” but the traditional reading and the context say “and you lie down.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: note the place where he lies
  simplified_phrase: watch where he goes to sleep
  preserved_meaning: Ruth must observe and identify Boaz’s sleeping place.
  reasoning_layer_used: Lexical decisions for וְיָדַעַתְּ and אֲשֶׁר יִשְׁכַּב שָׁם
  rationale: The wording turns a formal instruction into direct, natural English.
- pob_phrase: Then go
  simplified_phrase: Then go there
  preserved_meaning: Ruth is to move to the sleeping place she has identified.
  reasoning_layer_used: Lexical decisions for וּבָאת and אֶת־הַמָּקוֹם
  rationale: “There” clearly links the movement to the place just mentioned.
- pob_phrase: what you should do
  simplified_phrase: what to do
  preserved_meaning: Boaz will give Ruth the next instruction.
  reasoning_layer_used: Lexical decision for אֵת אֲשֶׁר תַּעֲשִׂין
  rationale: The shorter form keeps the directive force without sounding formal.
