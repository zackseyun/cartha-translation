translation:
  language: en
  text: He asked, “Who are you?” She answered, “I am Ruth, your servant. Cover your servant with your wing,[a] because you are a redeemer.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Cover your servant with the corner of your garment.” The Hebrew may intentionally suggest both protection and a marriage claim.
    reason: lexical_alternative
  - marker: b
    text: Here a redeemer is a close relative with a recognized duty to act on behalf of a family member.
    reason: simplification_note
