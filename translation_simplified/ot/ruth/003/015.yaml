translation:
  language: en
  text: Then he said, “Hold out the cloak you are wearing.” She held it out, and he measured out six measures of barley[a] into it. He placed the load on her. Then he went into the city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “six barley” without naming the unit of measure.
    reason: lexical_alternative
  - marker: b
    text: Some ancient versions read, “Then she went into the city.” The Masoretic Text reads, “Then he went into the city.”
    reason: textual_variant
