simplification_decisions:
- pob_phrase: And now, it is true that
  simplified_phrase: Now, it is true that
  preserved_meaning: Boaz introduces and affirms his next point.
  reasoning_layer_used: Lexical decisions for וְעַתָּה and כִּי אָמְנָם
  rationale: Dropping “And” gives a more natural transition without weakening the affirmation.
- pob_phrase: I am a redeemer
  simplified_phrase: I am a redeemer for the family
  preserved_meaning: Boaz has recognized family redemption responsibilities.
  reasoning_layer_used: Lexical and theological decisions for גֹאֵל
  rationale: The added phrase prevents readers from mistaking this for abstract spiritual redemption.
- pob_phrase: yet there is also a redeemer closer than I
  simplified_phrase: But there is another redeemer who is more closely related than I am
  preserved_meaning: Another family redeemer has a prior claim because of closer kinship.
  reasoning_layer_used: Lexical decisions for וְגַם and קָרוֹב מִמֶּנִּי
  rationale: The rewrite states the family relationship clearly and divides the contrast into a new sentence.
