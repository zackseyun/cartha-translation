translation:
  language: en
  text: Wash yourself, rub oil on your body, and put on your cloak. Then go down to the threshing floor.[a][b] Do not let the man notice you until he has finished eating and drinking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A threshing floor was a place where grain was separated from its stalks and husks.
    reason: cultural_note
  - marker: b
    text: The Hebrew consonantal form for “go down” is unusual, but the context supports reading it as Naomi’s instruction to Ruth.
    reason: textual_variant
simplification_decisions:
- pob_phrase: anoint yourself
  simplified_phrase: rub oil on your body
  preserved_meaning: Ruth is to apply oil or ointment to herself.
  reasoning_layer_used: POB lexical decision for וָסַכְתְּ
  rationale: The concrete wording avoids suggesting a religious ceremony while preserving the action.
- pob_phrase: Do not make yourself known to the man
  simplified_phrase: Do not let the man notice you
  preserved_meaning: Ruth must remain unnoticed by the specific man until the stated time.
  reasoning_layer_used: POB lexical decisions for אַל תִּוָּדְעִי and לָאִישׁ
  rationale: This recasts the Hebrew idiom in natural English without naming Boaz.
- pob_phrase: threshing floor
