translation:
  language: en
  text: When Ruth came to Naomi, her mother-in-law, Naomi asked, “Who are you, my daughter?”[a] Then Ruth told her everything the man had done for her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “How did it go, my daughter?” The question may be about the outcome of Ruth’s meeting or whether her status had changed.
    reason: alternative_reading
