translation:
  language: en
  text: But Ruth said, “Do not press me to leave you or to turn back from following you. Wherever you go, I will go. Wherever you spend the night, I will spend the night. Your people will be my people, and your God will be my God.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew leaves out the verb in both final clauses. They may also be translated, “Your people are my people, and your God is my God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to leave you, to turn back from following after you
  simplified_phrase: to leave you or to turn back from following you
  preserved_meaning: Ruth refuses both leaving Naomi and turning back instead of continuing with her.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The idiom is stated in natural English without losing Ruth’s commitment to follow Naomi.
- pob_phrase: where you go, I will go; and where you lodge, I will lodge
  simplified_phrase: Wherever you go, I will go. Wherever you spend the night, I will spend the night.
  preserved_meaning: Ruth promises to share Naomi’s destination and overnight lodging.
  reasoning_layer_used: POB lexical decision and footnote c
  rationale: Two short sentences preserve the parallelism while clarifying the less familiar word “lodge.”
- pob_phrase: Your people will be my people, and your God my God
  simplified_phrase: Your people will be my people, and your God will be my God.
  preserved_meaning: Ruth pledges herself to Naomi’s people and to Naomi’s God.
  reasoning_layer_used: POB footnote d and lexical and theological decisions
  rationale: Supplying “will be” makes the vow complete in modern English while the footnote preserves the Hebrew ambiguity.
interpretive_expansions:
- pob_phrase: where you lodge, I will lodge
  rendering: Wherever you spend the night, I will spend the night.
  claim: The lodging refers to staying somewhere overnight.
  evidence:
  - The POB lexical decision says the Hebrew verb often refers to lodging or spending the night.
  - POB footnote c expressly offers this wording.
  confidence: high
  alternatives_preserved:
  - wherever you lodge, I will lodge
  - wherever you stay, I will stay
translation_notes:
  risk_flags:
  - risk: Using “will be” in both final clauses selects the future sense of the Hebrew verbless clauses.
    mitigation: The vow context supports this permitted reading, and the footnote preserves the present-tense alternative.
