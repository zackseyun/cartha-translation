translation:
  language: en
  text: My life was full when I left, but Yahweh has brought me back empty. So why do you call me Naomi?[a] Yahweh has testified against me, and the Almighty has brought disaster on me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naomi means “pleasant.”
    reason: source_note
  - marker: b
    text: Or “has done me harm.” The Hebrew refers to calamity or adversity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I went away full
  simplified_phrase: My life was full when I left
  preserved_meaning: Naomi contrasts her former fullness with her present emptiness.
  reasoning_layer_used: Lexical decision and immediate narrative context
  rationale: This keeps the full-empty image while making the metaphor easier to grasp.
- pob_phrase: Why do you call me Naomi
  simplified_phrase: So why do you call me Naomi?
  preserved_meaning: Naomi challenges the use of her name in light of her suffering.
  reasoning_layer_used: Lexical decision and name rationale
  rationale: “So” makes the connection to her full-empty contrast clear without explaining the name in the text.
- pob_phrase: the Almighty has brought calamity on me
  simplified_phrase: the Almighty has brought disaster on me
  preserved_meaning: Naomi directly attributes her adversity to the Almighty without accusing God of moral evil.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Disaster” is more familiar than “calamity” while retaining the strong divine agency.
interpretive_expansions:
- pob_phrase: I went away full
  rendering: My life was full when I left
  claim: “Full” describes Naomi’s former overall condition rather than physical fullness.
  evidence:
  - The verse contrasts her former fullness with returning empty.
  - The surrounding story recounts the loss of her husband and sons.
  - The POB rationale treats “full” as Naomi’s former state.
  confidence: high
  alternatives_preserved:
  - I left full
  - I left with much
translation_notes:
  risk_flags:
  - risk: “My life” makes the domain of “full” more explicit than the Hebrew wording.
    mitigation: The full-empty contrast and surrounding account strongly support this broad life-context sense.
  - risk: “Testified against me” may sound narrowly legal to some readers.
    mitigation: It preserves the POB’s chosen forensic sense and remains distinct from the following statement about disaster.
