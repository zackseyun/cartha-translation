translation:
  language: en
  text: Turn back, my daughters. Go on, because I am too old to have a husband. Even if I said, “There is still hope for me,” and even if I had a husband tonight and gave birth to sons—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Turn back, my daughters; go on
  simplified_phrase: Turn back, my daughters. Go on
  preserved_meaning: Naomi affectionately urges both women to turn back and continue without her.
  reasoning_layer_used: Lexical decisions for שֹׁבְנָה, בְנֹתַי, and לֵכְנָה
  rationale: Two short sentences make the paired commands easier to follow.
- pob_phrase: too old to belong to a husband
  simplified_phrase: too old to have a husband
  preserved_meaning: Naomi considers herself beyond any realistic prospect of remarriage.
  reasoning_layer_used: Lexical decision for מִהְיוֹת לְאִישׁ and its recorded alternative
  rationale: “Have a husband” expresses the relational idiom in ordinary modern English.
- pob_phrase: were with a husband tonight and even bore sons
  simplified_phrase: had a husband tonight and gave birth to sons
  preserved_meaning: Naomi imagines the unlikely conditions of immediately having a husband and bearing male heirs.
  reasoning_layer_used: Lexical decisions for גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ and וְגַם יָלַדְתִּי בָנִים
  rationale: The wording makes the hypothetical sequence clear while retaining “tonight” and “sons.”
