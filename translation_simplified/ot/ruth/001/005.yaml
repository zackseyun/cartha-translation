translation:
  language: en
  text: Then Mahlon and Chilion died too. The woman was now without her two children[a] and her husband.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “two sons.” The Hebrew uses a broader word for children or offspring.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then both of them also died, Mahlon and Chilion
  simplified_phrase: Then Mahlon and Chilion died too.
  preserved_meaning: Both named sons died in addition to the earlier family loss.
  reasoning_layer_used: Lexical decisions for וַיָּמ֥וּתוּ, גַם, and שְׁנֵיהֶם
  rationale: Naming the sons first and using “too” makes the sequence natural while retaining the added loss.
- pob_phrase: the woman was left without her two children and without her husband
  simplified_phrase: The woman was now without her two children and her husband.
  preserved_meaning: The woman survived after losing both children and her husband.
  reasoning_layer_used: Lexical decisions for וַתִּשָּׁאֵר and the repeated separation preposition
  rationale: “Was now without” states her resulting deprivation in direct modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “children” means young children, though Mahlon and Chilion were adults.
    mitigation: The footnote preserves “sons” as the contextual lexical alternative.
