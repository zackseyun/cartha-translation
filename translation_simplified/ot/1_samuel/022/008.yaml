translation:
  language: en
  text: All of you have conspired against me! No one informs me when my son makes a covenant with the son of Jesse.[a] None of you grieves for me or informs me that my son has stirred up my servant against me to ambush me, as is happening today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The son of Jesse” refers to David; Saul avoids using David’s name.
    reason: cultural_note
simplification_decisions:
- pob_phrase: For all of you have conspired against me
  simplified_phrase: All of you have conspired against me!
  preserved_meaning: Saul accuses the whole group of plotting treasonously against him.
  reasoning_layer_used: Lexical decision for קְשַׁרְתֶּם and immediate speech context.
  rationale: The exclamation and direct opening make Saul’s hostile accusation easier to follow.
- pob_phrase: none of you is grieved for me
  simplified_phrase: None of you grieves for me
  preserved_meaning: Saul claims that none of them feels sympathetic distress for him.
  reasoning_layer_used: Lexical decision for חֹלֶה ... עָלַי and doctrine-realignment revision.
  rationale: The active wording is simpler while retaining grief rather than reducing it to regret.
- pob_phrase: to lie in wait, as at this day
  simplified_phrase: to ambush me, as is happening today
  preserved_meaning: Saul alleges that David is presently positioned to attack him by ambush.
  reasoning_layer_used: Lexical decisions for לְאֹרֵב and כַּיּוֹם הַזֶּה.
  rationale: “Ambush me” states the same hostile image in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: “Ambush me” makes the implied target of “lie in wait” explicit.
    mitigation: The surrounding phrase “against me” clearly identifies Saul as the target.
  - risk: The footnote identifies the son of Jesse as David.
    mitigation: The identification is explicit in the POB cultural note and does not replace Saul’s distancing title in the text.
