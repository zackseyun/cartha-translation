translation:
  language: en
  text: Was today the first time I asked God for guidance on his behalf? Certainly not! The king must not charge me, his servant, or anyone in my whole family with wrongdoing. I knew nothing about any of this, whether small or great.
  philosophy: optimal-equivalence
