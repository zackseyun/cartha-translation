  rationale: The modern reply preserves the force of his strong denial.
- pob_phrase: impute anything to his servant or to all my father’s house
  simplified_phrase: charge me, his servant, or anyone in my whole family with wrongdoing
  preserved_meaning: Ahimelech asks the king not to hold him or his extended family guilty in the matter.
  reasoning_layer_used: lexical decisions for אַל יָשֵׂם, בְּעַבְדּוֹ, and בְּכָל בֵּית אָבִי
  rationale: The recasting makes the forensic plea and the family's full scope clear.
