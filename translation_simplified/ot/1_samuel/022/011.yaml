translation:
  language: en
  text: Then the king sent for Ahimelech son of Ahitub, the priest, along with his whole clan—the priests at Nob. They all came to the king.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sent to summon
  simplified_phrase: sent for
  preserved_meaning: The king officially ordered Ahimelech and the others to appear.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁלַח and לִקְרֹא
  rationale: “Sent for” expresses the royal summons in natural common English.
- pob_phrase: all his father's house
  simplified_phrase: his whole clan
  preserved_meaning: The summons included Ahimelech's wider paternal family group, not only his immediate family.
  reasoning_layer_used: POB lexical rationale and cultural footnote
  rationale: “Whole clan” makes the Hebrew household idiom immediately understandable.
- pob_phrase: and they all came to the king
  simplified_phrase: They all came to the king.
  preserved_meaning: Every person summoned responded and came.
  reasoning_layer_used: POB lexical decision for וַיָּבֹאוּ כֻלָּם
  rationale: A separate sentence keeps the emphasis clear and removes the long clause chain.
