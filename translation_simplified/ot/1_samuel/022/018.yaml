  text: “Turn and strike down the priests,” the king told Doeg.[a] Doeg the Edomite turned and struck them down. That day he put eighty-five men to death. Each man wore a linen priestly garment called an ephod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “attack the priests” or “fall upon the priests.” The Hebrew verb describes a violent assault; the following sentence makes clear that Doeg killed them.
    reason: lexical_alternative
