  reasoning_layer_used: The lexical decision identifies movement away from the previous place.
  rationale: “Left that place” is more immediate in modern English.
- pob_phrase: all his father’s household
  simplified_phrase: everyone in his father’s household
  preserved_meaning: The whole family group belonging to David’s father is included.
  reasoning_layer_used: The lexical decision explains that “household” means the family unit.
  rationale: “Everyone in” makes the full scope explicit.
- pob_phrase: they went down there to him
  simplified_phrase: they went down to him at the cave
  preserved_meaning: They traveled downward to David at his stated location.
  reasoning_layer_used: The lexical decisions preserve the downward direction and movement toward David.
  rationale: Restating the cave avoids the awkward phrase “there to him.”
