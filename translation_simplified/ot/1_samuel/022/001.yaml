  text: David left that place and escaped[a] to the cave of Adullam. When his brothers and everyone in his father’s household heard, they went down to him at the cave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “fled.” The Hebrew can describe either escape or flight.
