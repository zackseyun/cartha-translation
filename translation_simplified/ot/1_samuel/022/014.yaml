  text: Ahimelech answered the king, “Who among all your servants is as faithful as David? He is the king’s son-in-law, has access to your council,[a] and is honored in your household.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “at your bidding” or “one who obeys your command.”
