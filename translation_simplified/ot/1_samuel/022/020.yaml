translation:
  language: en
  text: But one son of Ahimelech escaped. His name was Abiathar. Ahimelech was the son of Ahitub, and Abiathar fled after David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he fled to David.” The Hebrew says “after David,” which may mean that he went to join him.
    reason: lexical_alternative
