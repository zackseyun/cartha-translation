  preserved_meaning: Abiathar was Ahimelech’s son, and Ahimelech was Ahitub’s son.
  reasoning_layer_used: Lexical decisions for בֵּן אֶחָד and לַאֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  rationale: Separating the genealogy clarifies the two generations without implying that Ahimelech had multiple sons.
- pob_phrase: escaped, and his name was Abiathar, and he fled
