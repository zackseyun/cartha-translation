  preserved_meaning: Saul received news that David and his men were no longer hidden.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The documented alternative is clearer in ordinary English without making their exact location explicit.
- pob_phrase: on the height
  simplified_phrase: on the hill
  preserved_meaning: Saul was sitting at an elevated location.
  reasoning_layer_used: POB lexical decision for בָּרָמָה
  rationale: “Hill” expresses the preferred common-noun reading more naturally while the footnote preserves “Ramah.”
- pob_phrase: with his spear in his hand
  simplified_phrase: He held his spear in his hand
  preserved_meaning: The scene retains Saul’s martial posture and the spear image.
  reasoning_layer_used: POB lexical decision for וַחֲנִיתוֹ בְיָדוֹ
  rationale: A complete active sentence is easier to follow than the attached descriptive phrase.
