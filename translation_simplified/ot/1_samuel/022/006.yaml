translation:
  language: en
  text: Saul heard that David and the men with him had been discovered.[a] At that time, Saul was sitting at Gibeah under the tamarisk tree on the hill.[b] He held his spear in his hand, and all his servants stood around him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had become known.” The Hebrew can mean that their whereabouts were no longer hidden.
    reason: lexical_alternative
  - marker: b
    text: Or “at Ramah,” if the Hebrew refers to the place named Ramah rather than to a hill.
    reason: alternative_reading
