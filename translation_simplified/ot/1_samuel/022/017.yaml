translation:
  language: en
  text: Then the king said to the royal runners[a] standing around him, “Turn toward the priests of Yahweh and kill them! They too are on David’s side,[b] because they knew he was fleeing but did not tell me.” But the king’s servants refused to raise a hand against the priests of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “runners,” a royal term that could refer to guards or couriers.
    reason: cultural_note
  - marker: b
    text: 'Hebrew: “their hand also is with David,” an idiom meaning that they support or side with him.'
    reason: lexical_alternative
