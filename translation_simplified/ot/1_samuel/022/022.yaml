  preserved_meaning: David refers to what he knew on a specific past day.
  reasoning_layer_used: POB lexical decision for בַּיּוֹם הַהוּא
  rationale: The reordered phrase sounds natural while keeping the same time reference.
- pob_phrase: he would surely tell Saul
  simplified_phrase: he would certainly tell Saul
  preserved_meaning: The wording retains the Hebrew emphasis that Doeg would indeed tell Saul.
  reasoning_layer_used: POB lexical decision for the emphatic infinitive absolute
  rationale: “Certainly” expresses the emphasis in common English.
- pob_phrase: all the lives of your father’s house
