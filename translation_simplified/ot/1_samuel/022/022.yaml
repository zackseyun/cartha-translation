  preserved_meaning: David accepts responsibility for each life lost from Abiathar’s family household.
  reasoning_layer_used: POB lexical decisions for נֶפֶשׁ and בֵּית אָבִיךָ plus footnote c
  rationale: This makes the massacre explicit without implying that the surviving Abiathar also died.
