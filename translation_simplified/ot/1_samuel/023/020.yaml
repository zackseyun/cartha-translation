simplification_decisions:
- pob_phrase: according to all the desire of your soul
  simplified_phrase: as your heart desires
  preserved_meaning: The king may act in full accord with his strong inner desire.
  reasoning_layer_used: POB lexical decision and footnote for אַוַּת נַפְשְׁךָ
  rationale: The POB footnote supports “heart” as a clear English form of the Hebrew idiom.
- pob_phrase: come down ... to come down
  simplified_phrase: come down ... do come
  preserved_meaning: The repeated wording strongly urges the king to come down.
  reasoning_layer_used: POB lexical decision for לָרֶדֶת רֵד
  rationale: “Do come” conveys the force of the Hebrew repetition in natural English.
- pob_phrase: it is for us to hand him over into the king’s hand
  simplified_phrase: Our part is to hand him over to you
  preserved_meaning: The speakers identify delivering the man into the king’s power as their assigned role.
  reasoning_layer_used: POB lexical decisions for וְלָנוּ, הַסְגִּירוֹ, and בְּיַד הַמֶּלֶךְ
  rationale: This keeps their responsibility distinct from an unqualified future promise while making the transfer of power clear.
