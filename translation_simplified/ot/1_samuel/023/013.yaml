translation:
  language: en
  text: Then David rose and left Keilah with his men, about six hundred in all. They kept moving from place to place, going wherever they could. When Saul was told that David had escaped from Keilah, he stopped setting out to pursue him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says more generally “stopped going out”; in context, this likely refers to Saul’s pursuit of David.
    reason: simplification_note
