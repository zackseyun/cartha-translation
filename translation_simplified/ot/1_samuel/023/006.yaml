translation:
  language: en
  text: When Abiathar, the son of Ahimelech, fled to David at Keilah, he came down carrying an ephod.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an ephod came down in his hand,” following the Hebrew word order more literally.
    reason: lexical_alternative
  - marker: b
    text: An ephod was a sacred priestly item; the Hebrew does not specify its exact form here.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he came down with an ephod in his hand
  simplified_phrase: he came down carrying an ephod
  preserved_meaning: Abiathar descended while personally carrying the ephod.
  reasoning_layer_used: Lexical decisions for יָרַד and בְּיָדוֹ
  rationale: “Carrying” expresses the concrete possession image in more natural modern English.
- pob_phrase: Abiathar son of Ahimelech
  simplified_phrase: Abiathar, the son of Ahimelech
  preserved_meaning: Abiathar is identified by his father, Ahimelech.
  reasoning_layer_used: Lexical decision for בֶּן אֲחִימֶלֶךְ
  rationale: Adding the article and commas makes the family identification easier to read.
