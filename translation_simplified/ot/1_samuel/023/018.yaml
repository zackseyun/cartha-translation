translation:
  language: en
  text: The two of them made a covenant before Yahweh.[a] David stayed in the woods,[b] and Jonathan went home.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “cut a covenant.”
    reason: lexical_alternative
  - marker: b
    text: Or “in Horesh”; the Hebrew may refer either to a place named Horesh or to a wooded area.
    reason: alternative_reading
