translation:
  language: en
  text: Then David said, “Yahweh,[a] God of Israel, I am your servant. I have heard for certain that Saul is making plans to come to Keilah and destroy the city because of me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text uses YHWH, God’s personal name, traditionally rendered “the LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: your servant has surely heard
  simplified_phrase: I am your servant. I have heard for certain
  preserved_meaning: David respectfully calls himself God’s servant and strongly affirms what he has heard.
  reasoning_layer_used: POB lexical decision for עַבְדְּךָ and שָׁמֹעַ שָׁמַע
  rationale: Two direct first-person sentences make David’s self-reference and the Hebrew emphasis immediately clear.
- pob_phrase: Saul is seeking to come to Keilah
  simplified_phrase: Saul is making plans to come to Keilah
  preserved_meaning: Saul presently intends to come to Keilah without implying that he will succeed.
  reasoning_layer_used: POB lexical decision for מְבַקֵּשׁ and לָבוֹא אֶל קְעִילָה
  rationale: “Making plans” expresses ongoing intention in more natural modern English.
