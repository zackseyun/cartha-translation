translation:
  language: en
  text: They set out for Ziph ahead of Saul. Meanwhile, David and his men were in the Maon wilderness, in the Arabah region, south[a] of the Jeshimon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “to the right of”; in this geographical setting, that means “south.”
    reason: lexical_alternative
  - marker: b
    text: “Jeshimon” is probably a place name, though the word can also mean “wasteland” or “desert.”
    reason: lexical_alternative
