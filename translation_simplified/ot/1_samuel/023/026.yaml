translation:
  language: en
  text: Saul was moving along one side of the mountain, while David and his men were on the other side. David was hurrying away from Saul, but Saul and his men were closing in on them to capture them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “were surrounding David and his men to capture them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Saul was going on one side of the mountain
  simplified_phrase: Saul was moving along one side of the mountain
  preserved_meaning: Saul’s movement continued along his side of the mountain.
  reasoning_layer_used: Lexical decision for וַיֵּלֶךְ and its approved alternative
  rationale: “Moving along” expresses the ongoing movement more naturally than “going on.”
- pob_phrase: David was hurrying to go away from Saul
  simplified_phrase: David was hurrying away from Saul
  preserved_meaning: David was urgently moving away from Saul without implying panic.
  reasoning_layer_used: Lexical decisions for נֶחְפָּז and לָלֶכֶת מִפְּנֵי שָׁאוּל
  rationale: Removing “to go” makes the clause natural while retaining urgent departure rather than the stronger idea of escape.
- pob_phrase: closing in on David and his men to capture them
  simplified_phrase: closing in on them to capture them
  preserved_meaning: Saul’s forces were drawing around David’s group in order to capture them.
  reasoning_layer_used: Lexical decisions for עֹטְרִים and לְתָפְשָׂם
  rationale: The pronoun avoids needless repetition while preserving the tactical movement and purpose.
translation_notes:
  risk_flags:
  - risk: “Hurrying away” could be heard as slightly more direct than the Hebrew’s literal “hurrying to go away.”
    mitigation: The wording keeps POB’s restrained “away” sense and does not use the stronger “flee” or “escape.”
