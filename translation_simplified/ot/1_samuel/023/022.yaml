  text: Please go and make more preparations. Find out where he is[a] and identify who has seen him there, for I am told,[b] “He is very cunning.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “where his foot is,” an idiom for his whereabouts or movements.
    reason: lexical_alternative
  - marker: b
    text: Or, “for he said to me”; Hebrew does not name the subject of “said.”
    reason: alternative_reading
  - marker: c
    text: Hebrew repeats the word for cunning in a related form to add emphasis.
    reason: source_note
