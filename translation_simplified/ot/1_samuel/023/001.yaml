translation:
  language: en
  text: Then people told David, “The Philistines are attacking Keilah,[a] and they are raiding the threshing floors.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are fighting in or at Keilah.” The Hebrew says “in,” but the context suggests that the city is under attack.
    reason: lexical_alternative
