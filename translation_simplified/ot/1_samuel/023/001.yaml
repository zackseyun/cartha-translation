- pob_phrase: Then they told David, saying
  simplified_phrase: Then people told David
  preserved_meaning: An unspecified group brought David the next report.
  reasoning_layer_used: Lexical decisions for וַיַּגִּדוּ and לֵאמֹר
  rationale: “People” clarifies the plural subject, while direct quotation makes “saying” unnecessary.
- pob_phrase: Look, the Philistines are fighting against Keilah
  simplified_phrase: The Philistines are attacking Keilah
  preserved_meaning: Keilah is under Philistine attack.
  reasoning_layer_used: Lexical decisions for הִנֵּה, נִלְחָמִים, and בִּקְעִילָה
  rationale: The direct warning naturally conveys urgency, and “attacking” expresses the likely military sense.
- pob_phrase: they are plundering the threshing floors
  simplified_phrase: they are raiding the threshing floors
  preserved_meaning: The Philistines are pillaging the named agricultural sites without limiting what they seize.
  reasoning_layer_used: Lexical decisions for שֹׁסִים and הַגֳּרָנוֹת
  rationale: “Raiding” is familiar wording that preserves the threshing floors as the grammatical object.
