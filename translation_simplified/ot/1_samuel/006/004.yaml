translation:
  language: en
  text: They asked, “What guilt offering should we send back to him to make amends?” The answer was, “Make five gold models of tumors[a] and five gold models of mice—one for each Philistine ruler—because one plague has struck all of them and your rulers.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word probably means swellings caused by the plague; some translate it more specifically as “hemorrhoids.”
    reason: lexical_alternative
