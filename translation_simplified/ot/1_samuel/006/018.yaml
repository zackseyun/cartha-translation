translation:
  language: en
  text: There was one golden mouse for every Philistine city under the five rulers. This included everything from fortified cities to unwalled villages, as far as the great stone where they set down the ark of Yahweh. That stone remains to this day in the field of Joshua of Beth-shemesh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “as far as Great Abel,” if the Hebrew refers to a place rather than a large stone.
    reason: alternative_reading
