translation:
  language: en
  text: They said, “If you send the ark of the God of Israel back, do not send it back without a gift. You must give him a guilt offering.[a] Then you will be healed, and you will find out why his hand has not turned away from you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a reparation offering”; traditionally, “a trespass offering.”
    reason: lexical_alternative
  - marker: b
    text: God’s “hand” is an image of his power at work in judgment.
    reason: cultural_note
