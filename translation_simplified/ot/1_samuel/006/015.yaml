translation:
  language: en
  text: The Levites took down the ark of Yahweh[a] and the box with it, which held the gold objects. They placed both on the large stone. That day, the men of Beth-shemesh presented burnt offerings and offered sacrifices to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the divine name represented by the Hebrew letters YHWH, traditionally rendered “the LORD.”
    reason: source_note
