translation:
  language: en
  text: The cows went straight along the road toward Beth-shemesh. They kept going along that one road, mooing as they went, and did not turn right or left. The Philistine lords[a] followed them as far as the border of Beth-shemesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Philistine lords were the recognized rulers of the Philistine cities.
    reason: cultural_note
simplification_decisions:
- pob_phrase: on the road toward Beth-shemesh, along one highway
  simplified_phrase: along the road toward Beth-shemesh. They kept going along that one road
  preserved_meaning: The cows continued toward Beth-shemesh on one fixed route.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: This avoids the modern expressway sense of “highway” while retaining the single-route and continuing-motion emphasis.
- pob_phrase: lowing as they went
  simplified_phrase: mooing as they went
  preserved_meaning: The cows continued making their natural cattle sound while traveling.
  reasoning_layer_used: POB lexical decision for וְגָעוֹ
  rationale: “Mooing” clearly conveys the meaning of the less familiar word “lowing.”
- pob_phrase: did not turn aside to the right or to the left
  simplified_phrase: did not turn right or left
  preserved_meaning: The cows did not deviate from their course.
  reasoning_layer_used: POB lexical decision for וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  rationale: The shorter wording preserves the image of taking neither possible turn.
translation_notes:
  risk_flags:
  - risk: “Mooing” is less elevated than “lowing.”
    mitigation: It is the clearest common English term for the same cattle sound.
  - risk: “Road” does not express the possible raised-road nuance of the Hebrew term.
    mitigation: The central emphasis on one fixed route is stated directly.
