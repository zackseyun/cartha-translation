translation:
  language: en
  text: So the people of Israel got rid of the Baals and the Ashtaroths. They served Yahweh alone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They worshiped Yahweh alone.” The Hebrew verb can mean both service and worship when God is the object.
