  text: Then the men of Israel left Mizpah. They chased the Philistines and struck them down[a] as far as a place below Beth-car.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “defeated them.”
    reason: lexical_alternative
  - marker: b
    text: Beth-car was apparently above the place where the pursuit ended.
    reason: cultural_note
