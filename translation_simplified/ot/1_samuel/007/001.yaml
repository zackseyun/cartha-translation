  reasoning_layer_used: Lexical decisions for וַיָּבֹאוּ, וַיַּעֲלוּ, and אֶל בֵּית אֲבִינָדָב
  rationale: Shorter wording removes repetition while retaining both upward movement and entry into the house.
- pob_phrase: Eleazar his son
  simplified_phrase: Abinadab’s son Eleazar
  preserved_meaning: Eleazar is identified as Abinadab’s son.
  reasoning_layer_used: Lexical rationale for וְאֶת אֶלְעָזָר בְּנוֹ
  rationale: Naming Abinadab makes the pronoun’s contextual reference clear.
- pob_phrase: consecrated ... to keep
  simplified_phrase: set apart ... for the sacred duty of guarding
  preserved_meaning: Eleazar was appointed to sacred service as guardian of the ark.
  reasoning_layer_used: Lexical decisions for קִדְּשׁוּ and לִשְׁמֹר
  rationale: Common wording explains consecration while preserving its sacred force and custodial role.
