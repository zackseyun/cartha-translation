translation:
  language: en
  text: Then the men of Kiriath-jearim came. They carried the ark of Yahweh[b] up the hill and brought it into Abinadab’s house.[a] They set apart Abinadab’s son Eleazar for the sacred duty of guarding the ark of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “at Gibeah,” if the Hebrew is a place name rather than “the hill.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew text uses the divine name YHWH, rendered here as “Yahweh.”
    reason: source_note
