translation:
  language: en
  text: The people gathered at Mizpah. They drew water and poured it out before Yahweh.[a] That day they fasted and said, “We have sinned against Yahweh.” Samuel served as judge over the people of Israel at Mizpah.
  philosophy: optimal-equivalence
  footnotes:
