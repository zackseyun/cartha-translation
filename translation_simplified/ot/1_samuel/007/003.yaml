translation:
  language: en
  text: Then Samuel said to the whole community of Israel, “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths[a] from among you. Set your hearts firmly on Yahweh and serve him alone, and he will rescue you from the power of the Philistines.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ashtaroths” probably refers to forms, images, or other cultic expressions associated with the goddess Ashtoreth, also called Astarte.
    reason: cultural_note
