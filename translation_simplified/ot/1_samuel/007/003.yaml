  preserved_meaning: Samuel addressed Israel as one covenant community.
  reasoning_layer_used: POB lexical decision on כָּל בֵּית יִשְׂרָאֵל
  rationale: “Whole community” makes the corporate sense clear without the unfamiliar household idiom.
- pob_phrase: direct your heart to Yahweh
  simplified_phrase: Set your hearts firmly on Yahweh
  preserved_meaning: Israel must intentionally and steadfastly orient its loyalty toward Yahweh.
  reasoning_layer_used: POB lexical decision on וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  rationale: This expresses both deliberate direction and the firmness conveyed by the Hebrew verb.
- pob_phrase: he will deliver you from the hand of the Philistines
  simplified_phrase: he will rescue you from the power of the Philistines
  preserved_meaning: Yahweh will free Israel from Philistine control.
  reasoning_layer_used: POB lexical decision and footnote on מִיַּד פְּלִשְׁתִּים
  rationale: “Power” makes the Hebrew hand idiom immediately understandable.
