simplification_decisions:
- pob_phrase: From the day the ark remained at Kiriath-jearim, the days became many, and they were twenty years
  simplified_phrase: The ark remained at Kiriath-jearim. Twenty years passed
  preserved_meaning: A period of twenty years passed after the ark came to remain there.
  reasoning_layer_used: Lexical decisions for שֶׁבֶת and וַיִּרְבּוּ הַיָּמִים
  rationale: Two direct sentences replace the difficult Hebrew clause order without making twenty years the ark’s total stay.
- pob_phrase: all the house of Israel
  simplified_phrase: the whole house of Israel
  preserved_meaning: Israel is presented as the entire covenant people.
  reasoning_layer_used: Lexical decision for כָּל בֵּית יִשְׂרָאֵל
  rationale: “Whole” is natural English while preserving the covenant expression “house of Israel.”
- pob_phrase: lamented after Yahweh
  simplified_phrase: mourned for Yahweh
  preserved_meaning: Israel’s grief was directed toward Yahweh, with the idiom’s precise force left open.
  reasoning_layer_used: Lexical and theological decisions for וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  rationale: The clear main wording avoids asserting a definite act of repentance, while the footnote preserves other possible senses.
interpretive_expansions:
- pob_phrase: lamented after Yahweh
  rendering: mourned for Yahweh
  claim: Israel’s mourning was oriented toward Yahweh.
  evidence:
  - The POB footnote says the idiom may express grief and turning toward Yahweh.
  - The theological decision describes lamenting directed toward Yahweh without asserting full repentance.
  confidence: moderate
  alternatives_preserved:
  - longed for Yahweh
  - mourned toward Yahweh
translation_notes:
  risk_flags:
  - risk: “Mourned for Yahweh” may sound as though Yahweh had died or was lost.
    mitigation: The footnote gives the intended alternatives of longing for or mourning toward Yahweh.
  - risk: The sequence may imply that Israel began mourning at one exact moment after twenty years.
    mitigation: The wording follows the verse’s narrative sequence without stating how long the mourning lasted.
