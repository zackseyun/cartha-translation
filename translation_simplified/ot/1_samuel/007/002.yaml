translation:
  language: en
  text: The ark remained at Kiriath-jearim. Twenty years passed, and the whole house of Israel mourned for Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Israel “longed for Yahweh” or “mourned toward Yahweh.”
