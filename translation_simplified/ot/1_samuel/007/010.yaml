translation:
  language: en
  text: While Samuel was presenting the burnt offering, the Philistines moved in to attack Israel. But that day Yahweh thundered against the Philistines with a great sound.[a] He threw them into confusion, and they were defeated by Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “with mighty thunder” or “with a great noise.” The Hebrew literally says “with a great sound.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as Samuel was offering up the burnt offering
  simplified_phrase: While Samuel was presenting the burnt offering
  preserved_meaning: Samuel was still carrying out the sacrifice when the Philistines advanced.
  reasoning_layer_used: Lexical decision for מַעֲלֶה and narrative participle
  rationale: “Presenting” expresses the sacrificial action in ordinary English while preserving its ongoing sense.
- pob_phrase: the Philistines drew near for battle against Israel
  simplified_phrase: the Philistines moved in to attack Israel
  preserved_meaning: The Philistines approached Israel with hostile military intent.
  reasoning_layer_used: Lexical decisions for נִגְּשׁוּ, לַמִּלְחָמָה, and בְּיִשְׂרָאֵל
  rationale: The new wording makes the military movement and hostile purpose immediately clear.
- pob_phrase: they were defeated before Israel
  simplified_phrase: they were defeated by Israel
  preserved_meaning: The Philistines suffered defeat at Israel’s hands.
  reasoning_layer_used: Lexical decisions for וַיִּנָּגְפוּ and לִפְנֵי יִשְׂרָאֵל
  rationale: “By Israel” communicates the Hebrew battle idiom more naturally to modern readers.
translation_notes:
  risk_flags:
  - risk: “Moved in to attack” states the purpose of the Philistines’ approach more directly than “drew near for battle.”
    mitigation: The immediate military context and the POB lexical decisions explicitly establish hostile intent.
