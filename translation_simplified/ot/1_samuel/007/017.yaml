simplification_decisions:
- pob_phrase: for his house was there
  simplified_phrase: return home to Ramah
  preserved_meaning: Ramah was the place where he lived and to which he regularly returned.
  reasoning_layer_used: lexical decision for בֵּיתוֹ and immediate context
  rationale: The reason clause is folded into the natural phrase “return home” without losing Ramah as his base.
- pob_phrase: there he judged Israel
  simplified_phrase: There he served as Israel’s judge
  preserved_meaning: He carried out his established governing and judicial role over Israel at Ramah.
  reasoning_layer_used: lexical decision for שָׁפַט אֶת־יִשְׂרָאֵל
  rationale: “Served as Israel’s judge” avoids suggesting only a single courtroom decision.
- pob_phrase: and there he judged Israel. He built there an altar
  simplified_phrase: There he served as Israel’s judge and built an altar
  preserved_meaning: Both his judging work and altar-building took place at Ramah.
  reasoning_layer_used: source repetition of שָׁם and POB clause structure
  rationale: Combining the actions removes repetition while keeping Ramah as the location of both.
