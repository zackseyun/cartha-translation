translation:
  language: en
  text: Do not turn away to follow worthless things.[a] They cannot help you or rescue you, because they are worthless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “empty things” or “vain things” and may refer especially to idols.
    reason: lexical_alternative
