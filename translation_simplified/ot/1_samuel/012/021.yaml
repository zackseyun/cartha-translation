  preserved_meaning: The image of leaving the right path to pursue another allegiance remains intact.
  reasoning_layer_used: Lexical decisions for תָּסוּרוּ and אַחֲרֵי
  rationale: Ordinary English makes the direction and pursuit easier to understand.
- pob_phrase: cannot profit or deliver
  simplified_phrase: cannot help you or rescue you
  preserved_meaning: These things can provide neither benefit nor deliverance.
  reasoning_layer_used: Lexical decisions for לֹא יוֹעִילוּ and לֹא יַצִּילוּ
  rationale: “Help” and “rescue” are clearer while keeping the two distinct failures.
- pob_phrase: for they are worthless
  simplified_phrase: because they are worthless
  preserved_meaning: The repeated judgment explains why these objects cannot help or rescue.
  reasoning_layer_used: Lexical decision for תֹהוּ and source repetition
  rationale: “Because” states the logical connection in familiar English.
