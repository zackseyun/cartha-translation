translation:
  language: en
  text: If you fear Yahweh, serve him, listen to his voice,[a] and do not rebel against what he commands, then both you and the king who rules over you will follow Yahweh your God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Listening to Yahweh’s voice includes obeying him.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says that the people and king will “be after” Yahweh; here this means remaining loyal to him and following him.
    reason: alternative_reading
