  preserved_meaning: They must not defy what Yahweh commands.
  reasoning_layer_used: lexical decision for אֶת־פִּי יְהוָה
  rationale: This naturally expresses the Hebrew idiom without changing its singular form into a plural noun.
- pob_phrase: the king who reigns over you
  simplified_phrase: the king who rules over you
  preserved_meaning: The condition applies to Israel’s reigning king as well as the people.
  reasoning_layer_used: lexical decision for אֲשֶׁר מָלַךְ עֲלֵיכֶם
  rationale: “Rules over you” is familiar modern English for the king’s ongoing authority.
