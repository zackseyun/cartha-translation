translation:
  language: en
  text: Samuel said to them, “Yahweh is a witness against you[a], and so is the king he has anointed. They are witnesses today that you have found nothing in my possession.” They replied[b], “He is witness.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh is witness among you.” In this context, he stands as a witness in the case concerning them.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is singular, but the context indicates a collective reply.
    reason: textual_variant
