translation:
  language: en
  text: When you saw Nahash, king of the Ammonites, coming to attack you, you told me, “No! A king must rule over us”—even though the LORD your God was your king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the LORD your God is your king.” Hebrew does not explicitly state whether this is past or present.
    reason: alternative_reading
