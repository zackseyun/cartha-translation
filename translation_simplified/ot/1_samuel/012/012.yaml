  preserved_meaning: Nahash was advancing against Israel as an enemy.
  reasoning_layer_used: POB lexical decision for בָּא עֲלֵיכֶם
  rationale: “Attack” makes the military sense of “coming against” immediately clear.
- pob_phrase: No, but a king shall reign over us
  simplified_phrase: No! A king must rule over us
  preserved_meaning: The people emphatically insisted that they be ruled by a human king.
  reasoning_layer_used: POB lexical decisions for לֹא כִּי and מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  rationale: The shorter wording preserves both the rejection and the forceful demand.
- pob_phrase: though the LORD your God was your king
