translation:
  language: en
  text: “Isn’t today during the wheat harvest? I will call out to Yahweh, and he will send thunder and rain, so that you may know and see how great your wickedness was in Yahweh’s sight when you asked for a king for yourselves.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Is it not wheat harvest today?
  simplified_phrase: Isn’t today during the wheat harvest?
  preserved_meaning: The rhetorical question expects agreement and points to the present harvest season.
  reasoning_layer_used: POB lexical decisions for הֲלֹא, קְצִיר חִטִּים, and הַיּוֹם
  rationale: The recast question is natural English while preserving its rhetorical force.
- pob_phrase: I will call to Yahweh
  simplified_phrase: I will call out to Yahweh
  preserved_meaning: Samuel will appeal directly to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions for אֶקְרָא אֶל יְהוָה
  rationale: “Call out to” is clear modern English and retains Yahweh’s covenant name.
- pob_phrase: your wickedness is great, which you have done in the sight of Yahweh by asking for yourselves a king
  simplified_phrase: how great your wickedness was in Yahweh’s sight when you asked for a king for yourselves
  preserved_meaning: Their request for a king was serious moral evil before Yahweh.
  reasoning_layer_used: POB lexical decisions for רָעַתְכֶם רַבָּה, בְּעֵינֵי יְהוָה, and לִשְׁאֹל לָכֶם מֶלֶךְ
  rationale: The wording keeps the judgment first and then identifies the request that occasioned it.
translation_notes:
  risk_flags:
  - risk: “When you asked” may sound merely temporal rather than identifying the request as their wrongdoing.
    mitigation: The immediate wording directly connects their great wickedness with asking for a king.
