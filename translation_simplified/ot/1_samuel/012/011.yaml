translation:
  language: en
  text: Yahweh sent Jerubbaal[a], Bedan[b], Jephthah, and Samuel. He rescued you from the grasp of the enemies surrounding you, and you lived in safety.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jerubbaal is another name for Gideon (see Judges 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: The Hebrew text reads “Bedan,” but his identity is uncertain; some interpreters understand the name as Barak or, less commonly, Abdon.
    reason: alternative_reading
