translation:
  language: en
  text: I am here before you. Testify against me in the presence of Yahweh and his anointed king. Have I taken anyone’s ox or donkey? Have I oppressed anyone? Have I mistreated[a] anyone? Have I accepted a bribe[b] from anyone and then closed my eyes to wrongdoing because of it? If I have, I will repay you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult and may refer more broadly to harshly mistreating or abusing someone.
    reason: lexical_alternative
  - marker: b
    text: The word can also mean “ransom” or “payment,” but here it describes a corrupt payment that leads someone to ignore wrongdoing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Here I am; testify against me before Yahweh
  simplified_phrase: I am here before you. Testify against me in the presence of Yahweh
  preserved_meaning: Samuel publicly presents himself for testimony and judgment without specifying his posture.
  reasoning_layer_used: Lexical decisions for הִנְנִי, עֲנוּ בִי, and נֶגֶד
  rationale: Two direct sentences clarify the public legal challenge.
- pob_phrase: whose ox have I taken, or whose donkey have I taken?
  simplified_phrase: Have I taken anyone’s ox or donkey?
  preserved_meaning: Samuel asks whether he has taken another person’s valuable livestock.
  reasoning_layer_used: Repeated accusation formula in the lexical audit
  rationale: The combined question removes repetition without weakening the charge.
- pob_phrase: that I should hide my eyes with it?
  simplified_phrase: and then closed my eyes to wrongdoing because of it?
  preserved_meaning: A corrupt payment would cause Samuel to ignore wrongdoing.
  reasoning_layer_used: Lexical rationales for אַעְלִים עֵינַי בּוֹ and כֹּפֶר
  rationale: The wording preserves the eye image while explaining the idiom.
interpretive_expansions:
- pob_phrase: his anointed
  rendering: his anointed king
  claim: The anointed person here is the reigning king.
  evidence:
  - The theological audit identifies the immediate referent as Yahweh’s anointed king.
  - The historical context distinguishes this title from a direct later messianic reference.
  confidence: high
  alternatives_preserved:
  - his anointed
- pob_phrase: I will restore it to you
  rendering: If I have, I will repay you.
  claim: Samuel promises restitution if any accusation is proved.
  evidence:
  - The lexical rationale describes restitution if a charge is proven.
  - The preceding questions supply the implied condition without limiting repayment to property.
  confidence: high
  alternatives_preserved:
  - I will restore it to you
translation_notes:
  risk_flags:
  - risk: “Mistreated” does not retain the possible concrete force of crushing.
    mitigation: Footnote [a] notes the verb’s difficulty and possible sense of harsh abuse.
  - risk: “Repay” may suggest money alone.
    mitigation: The conditional statement leaves the form of restitution open rather than limiting it to seized property.
