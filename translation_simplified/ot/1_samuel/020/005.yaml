translation:
  language: en
  text: David said to Jonathan, “Look, tomorrow is the new moon observance,[a] and I am expected to sit and eat with the king. But let me leave so I can hide in the field until the third evening.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The new moon began each month and was often observed with a special meal.
    reason: cultural_note
  - marker: b
    text: Or “until the evening of the third day.” The Hebrew phrase is abbreviated and can be understood either way.
    reason: lexical_alternative
