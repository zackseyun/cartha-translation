translation:
  language: en
  text: When the boy arrived, David got up from beside the mound.[a] He fell facedown on the ground and bowed three times. Then David and Jonathan kissed each other and wept together. David wept more.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and literally refers to the south or Negeb; many understand it as the mound or stone near David’s hiding place.
    reason: alternative_reading
  - marker: b
    text: This can mean that David wept more than Jonathan did, or that his weeping became more intense.
    reason: lexical_alternative
