translation:
  language: en
  text: Keep showing your steadfast love[a] to my family forever. Do not cut it off, even when Yahweh cuts off every man among David’s enemies from the face of the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “covenant loyalty” or “loyal love”; this means faithful love within a covenant relationship.
    reason: lexical_alternative
