translation:
  language: en
  text: Jonathan said, “No—do not think that! If I knew for certain that my father was firmly set on harming you,[a] wouldn’t I tell you?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the harm had been fixed” or “the evil was complete”; Saul’s harmful intent had become settled or fully formed.
    reason: lexical_alternative
