translation:
  language: en
  text: But David again made a solemn oath. He said, “Your father certainly knows that you regard me favorably, and he has said, ‘Jonathan must not know this, because it would grieve him.’ But as surely as the LORD lives and as surely as you are alive, I am only one step away from death.”
