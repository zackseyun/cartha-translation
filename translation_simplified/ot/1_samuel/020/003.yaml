  reasoning_layer_used: POB base text and source oath formula
  rationale: Two sentences clarify the solemn action without weakening it.
- pob_phrase: I have found favor in your eyes
  simplified_phrase: you regard me favorably
  preserved_meaning: David has Jonathan’s favorable regard and acceptance.
  reasoning_layer_used: POB base text and grounding review
  rationale: This removes an unfamiliar idiom while preserving its broad relational meaning.
- pob_phrase: as the LORD lives, and as your soul lives
  simplified_phrase: as surely as the LORD lives and as surely as you are alive
  preserved_meaning: David swears by the living LORD and Jonathan’s own life.
  reasoning_layer_used: POB base text and source oath formula
  rationale: The modern wording makes the oath’s force immediately clear.
