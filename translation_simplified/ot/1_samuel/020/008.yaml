translation:
  language: en
  text: So show kindness to me, your servant,[a] because you brought me with you into a covenant before Yahweh. But if I am guilty, put me to death yourself. Why should you take me to your father?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This kindness includes loyal faithfulness within a covenant relationship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: show kindness to your servant
  simplified_phrase: show kindness to me, your servant
  preserved_meaning: David asks Jonathan for kindness while respectfully calling himself Jonathan’s servant.
  reasoning_layer_used: POB lexical decisions on עַל עבדך and עבדך
  rationale: Using “me” clarifies the direct plea while retaining David’s respectful title.
- pob_phrase: you have brought your servant into the covenant of Yahweh with yourself
  simplified_phrase: you brought me with you into a covenant before Yahweh
  preserved_meaning: Jonathan brought David into a covenant shared by them under Yahweh’s witness and authority.
  reasoning_layer_used: POB lexical decisions on בברית יהוה and הבאת את עבדך עמך
  rationale: The new word order clearly makes David and Jonathan the covenant partners while retaining Yahweh’s personal name.
- pob_phrase: if there is guilt in me
  simplified_phrase: if I am guilty
  preserved_meaning: David allows for judgment if he is actually culpable.
  reasoning_layer_used: POB lexical decision on ואם יש בי עון
  rationale: The direct clause expresses the same condition in ordinary English.
interpretive_expansions:
