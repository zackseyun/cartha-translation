translation_notes:
  risk_flags:
  - risk: “Before Yahweh” makes the covenantal witness more explicit than the POB main text.
    mitigation: The clarification follows the POB rationale and prevents readers from mistaking Yahweh for one of the two covenant partners.
  - risk: Modern readers may take “servant” as a literal statement of enslavement.
