  text: Then Saul’s anger blazed against Jonathan. He said, “You son of a twisted, rebellious woman![a] Don’t I know that you have chosen Jesse’s son?[b] This will bring shame on you and disgrace on your mother!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You son of perversity and rebellion!” The Hebrew insult is difficult and highly idiomatic.
    reason: lexical_alternative
  - marker: b
    text: This may also be expressed, “you are siding with Jesse’s son.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says, “the shame of your mother’s nakedness,” a severe expression of family disgrace.
    reason: cultural_note
