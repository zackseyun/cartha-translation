translation:
  language: en
  text: Then David fled from Naioth in Ramah.[a] He went to Jonathan and asked, “What have I done? What am I guilty of? What sin have I committed in your father’s eyes that he is trying to take my life?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Naioth at Ramah.” Naioth is probably the name of a place associated with Ramah.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came before Jonathan and said
  simplified_phrase: went to Jonathan and asked
  preserved_meaning: David entered Jonathan’s presence and questioned him.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא and לִפְנֵי יְהוֹנָתָן
  rationale: This recasts the formal expression as ordinary narrative English.
- pob_phrase: What is my guilt
  simplified_phrase: What am I guilty of?
  preserved_meaning: David asks what wrongdoing could make him culpable.
  reasoning_layer_used: Lexical decision for עֲוֺנִי
  rationale: The natural question retains the distinct idea of guilt.
- pob_phrase: what is my sin before your father, that he is seeking my life?
  simplified_phrase: What sin have I committed in your father’s eyes that he is trying to take my life?
  preserved_meaning: David asks what supposed sin could account for Saul’s attempt to kill him.
  reasoning_layer_used: Lexical decisions for חַטָּאתִי, לִפְנֵי אָבִיךָ, כִּי, and מְבַקֵּשׁ אֶת־נַפְשִׁי
  rationale: The wording clarifies both Saul’s viewpoint and the link between the alleged sin and his pursuit.
interpretive_expansions:
- pob_phrase: he is seeking my life
  rendering: he is trying to take my life
  claim: Saul is attempting to kill David.
  evidence:
  - The lexical rationale identifies the Hebrew phrase as an idiom for trying to kill someone.
  - The connector ties Saul’s action to David’s question about his alleged offense.
  confidence: high
  alternatives_preserved:
  - The life-taking image remains instead of being reduced to “kill me.”
translation_notes:
  risk_flags:
  - risk: “In your father’s eyes” may emphasize Saul’s judgment more than the broader phrase “before your father.”
    mitigation: The wording uses the documented sense “in his sight” without claiming David actually sinned.
