translation:
  language: en
  text: Jonathan said to David, “As surely as Yahweh, the God of Israel, lives, I will find out how my father feels about you by this time tomorrow or by the third day.[a] If his attitude toward you is favorable, I will certainly send word and tell you.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew timing is compressed and may mean “about this time tomorrow, on the third day.”
    reason: alternative_reading
  - marker: b
    text: Hebrew literally says, “uncover your ear,” an image for telling or revealing something.
    reason: lexical_alternative
