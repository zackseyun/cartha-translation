translation:
  language: en
  text: He said, “Please let me go. My family is holding a sacrifice in the city, and my brother himself has ordered me. If you look on me with favor, please let me slip away[a] and see my brothers.[b]” That is why he has not come to the king’s table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “escape” or “get away.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” may include other close male relatives in David’s family group.
    reason: cultural_note
