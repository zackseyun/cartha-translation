translation:
  language: en
  text: Then I will send the young man and tell him, “Go find the arrows.” If I clearly call out to him, “Look, the arrows landed on this side of you. Pick them up and come back,” then it means you are safe and there is no danger—as surely as Yahweh lives.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And look, I will send the young man, saying
  simplified_phrase: Then I will send the young man and tell him
  preserved_meaning: Jonathan introduces the next step of his signal plan and gives the attendant an instruction.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: “Then” gives the sequence naturally without the awkward attention marker.
- pob_phrase: the arrows are on this side of you; take them and come
  simplified_phrase: the arrows landed on this side of you. Pick them up and come back
  preserved_meaning: The arrows fall short of the young man, who must retrieve them and return to Jonathan.
  reasoning_layer_used: POB lexical rationale for the directional phrase and motion verbs
  rationale: The wording makes the arrows’ location and the young man’s actions immediately clear.
- pob_phrase: as Yahweh lives
  simplified_phrase: as surely as Yahweh lives
  preserved_meaning: Jonathan seals his assurance with an oath invoking Yahweh’s life.
  reasoning_layer_used: POB cultural note and theological decision
  rationale: “As surely as” identifies the phrase as a solemn assurance while retaining Yahweh’s name.
interpretive_expansions:
- pob_phrase: then there is peace for you and no danger
  rendering: then it means you are safe and there is no danger
  claim: Jonathan’s words to the young man function as a signal assuring David of safety.
  evidence:
  - The immediate context presents the arrow instructions as Jonathan’s signal to David.
  - The POB lexical rationale says “peace” here refers to David’s safety and well-being.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Landed on this side of you” makes the arrows’ completed flight explicit.
    mitigation: The POB footnote and lexical rationale state that the arrows have fallen short rather than beyond the attendant.
