translation:
  language: en
  text: As soon as you enter the city, you will find him before he goes up to the high place—an elevated place of worship—to eat. The people will not eat until he arrives, because he is the one who pronounces the blessing over the sacrifice. Then the invited guests will eat. So go up now. You will find him today.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at this time,” emphasizing that they will find him without delay.
    reason: lexical_alternative
