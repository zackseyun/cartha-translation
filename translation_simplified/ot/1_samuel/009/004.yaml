translation:
  language: en
  text: Saul traveled with his servant through the hill country of Ephraim and the region of Shalishah, but they did not find the donkeys. They continued through the region of Shaalim, but the donkeys were not there. Then Saul traveled through the land of Benjamin, but they still did not find them.
