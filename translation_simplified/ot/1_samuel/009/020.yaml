  preserved_meaning: Saul’s donkeys had been missing since three days earlier.
  reasoning_layer_used: Lexical decisions for הָאֹבְדוֹת and the Hebrew time expression
  rationale: This uses ordinary English without suggesting that Saul caused their loss.
- pob_phrase: do not set your heart on them
  simplified_phrase: do not let them weigh on your heart
  preserved_meaning: Saul should no longer be troubled or preoccupied about the donkeys.
  reasoning_layer_used: Lexical decision for אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  rationale: This keeps the heart image while making the concern clear.
- pob_phrase: for all your father’s house
