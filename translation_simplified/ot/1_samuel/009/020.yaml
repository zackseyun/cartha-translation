translation:
  language: en
  text: As for your donkeys that went missing three days ago, do not let them weigh on your heart. They have been found. And all Israel’s desire—is it not for you and your whole father’s household?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “And to whom belongs everything desirable in Israel?”
    reason: lexical_alternative
  - marker: b
    text: “Father’s household” means the wider household or clan, not only the immediate family.
    reason: cultural_note
simplification_decisions:
