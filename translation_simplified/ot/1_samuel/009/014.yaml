  text: They went up to the city. Just as they were entering it,[a] there was Samuel, coming out to meet them on his way up to the high place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while they were inside the city.” The Hebrew says “in the midst of the city.”
    reason: lexical_alternative
  - marker: b
    text: A “high place” was a recognized place of worship in Israel at that time.
    reason: cultural_note
