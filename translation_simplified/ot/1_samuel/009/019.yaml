translation:
  language: en
  text: Samuel replied to Saul, “I am the seer.[a] Go up ahead of me to the high place, the worship site. All of you, eat with me today.[b] In the morning I will send you on your way, and I will tell you everything that is in your heart.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seer” was an older name for a prophet; see 1 Samuel 9:9.
    reason: cultural_note
  - marker: b
    text: The Hebrew verb “eat” is plural, likely including Saul’s servant.
    reason: source_note
