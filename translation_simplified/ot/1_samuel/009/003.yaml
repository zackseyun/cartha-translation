  text: The donkeys[a] owned by Saul’s father, Kish, were lost. Kish said to his son Saul, “Please take one of the young men[b] with you. Get up and go look for the donkeys.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew specifically says “female donkeys,” but their sex is not important here.
    reason: lexical_alternative
  - marker: b
    text: Or “servants” or “attendants.”
    reason: lexical_alternative
