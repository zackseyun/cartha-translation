translation:
  language: en
  text: The cook brought the animal’s leg portion and what was on it[a], then placed it before Saul. He said, “Here is the portion kept for you. Eat it. It was kept for you for this appointed time, ever since I said, ‘I have invited the people.’” So Saul ate with Samuel that day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “thigh,” and it does not identify what accompanied the leg portion.
    reason: lexical_alternative
