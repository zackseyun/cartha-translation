translation:
  language: en
  text: They got up early. As dawn was breaking, Samuel called to Saul on the roof,[a] “Get up, and I will send you on your way.” Saul got up, and the two of them—Saul and Samuel—went outside.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The house had a flat roof that could be used as living space.
    reason: cultural_note
