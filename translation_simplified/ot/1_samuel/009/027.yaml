translation:
  language: en
  text: As they walked down toward the edge of the city, Samuel said to Saul, “Tell the young man[a] to go ahead of us.” The young man went ahead. Then Samuel said, “You stay here for a moment, and I will tell you the word of God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean “servant” or “attendant.”
    reason: lexical_alternative
