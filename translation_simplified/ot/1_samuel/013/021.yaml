translation:
  language: en
  text: The charge for sharpening plow blades, digging tools, three-pronged forks, and axes, and for putting ox goads in working order, was a small payment called a pim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pim was probably worth about two-thirds of a shekel.
    reason: cultural_note
  - marker: b
    text: The Hebrew is difficult and may refer to the sharpening itself rather than the charge for it.
    reason: alternative_reading
