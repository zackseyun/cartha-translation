translation:
  language: en
  text: So Saul said, “Bring me the burnt offering and the peace offerings.[a]” Then Saul offered the burnt offering.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offerings.” These offerings were associated with peace, well-being, and shared fellowship.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew most naturally means that Saul himself offered it, though it could mean that he had it presented.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Bring near to me
  simplified_phrase: Bring me
  preserved_meaning: Saul commands that the sacrificial offerings be brought to him for presentation.
  reasoning_layer_used: Lexical decision for הַגִּשׁוּ אֵלַי
  rationale: Ordinary English conveys the command clearly while the named offerings retain the sacrificial setting.
- pob_phrase: And he offered up
  simplified_phrase: Then Saul offered
  preserved_meaning: Saul is the direct subject who performs the sacrificial action.
  reasoning_layer_used: Theological decision on subject and action
  rationale: Naming Saul removes pronoun confusion and “then” clearly marks the next action.
translation_notes:
  risk_flags:
