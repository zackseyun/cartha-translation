translation:
  language: en
  text: Saul selected 3,000 Israelite men for his own force. Two thousand served with Saul at Michmash and in the hill country of Bethel,[a] while 1,000 served with Jonathan at Gibeah in Benjamin. Saul sent everyone else away, each man to his own tent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “on the hill of Bethel,” referring to a specific elevated area near Bethel.
    reason: lexical_alternative
  - marker: b
    text: “Each man to his own tent” was a common way to say that the men were dismissed to their own dwellings.
    reason: cultural_note
