translation:
  language: en
  text: Jonathan struck down the Philistine garrison at Geba,[a] and the Philistines heard what had happened. Then Saul sounded a ram’s horn throughout the land to announce, “Let the Hebrews hear!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may instead mean the Philistine prefect or governor, but “garrison” best fits the battle setting.
    reason: lexical_alternative
