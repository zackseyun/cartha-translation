translation:
  language: en
  text: May your good judgment be blessed, and may you be blessed as well! Today you stopped me from taking part in bloodshed[a] and from taking revenge by my own hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also suggest becoming guilty of bloodshed.
    reason: lexical_alternative
  - marker: b
    text: Literally, “from saving myself by my own hand.” Here it refers to securing justice for himself through revenge.
    reason: lexical_alternative
