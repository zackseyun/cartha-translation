translation:
  language: en
  text: And now I have heard that your sheep are being sheared. When your shepherds were with us, we did not mistreat them,[a] and none of their belongings went missing the whole time they were in Carmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “we did not shame them”; here it includes not harming or abusing them.
    reason: lexical_alternative
