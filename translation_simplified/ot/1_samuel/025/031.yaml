translation:
  language: en
  text: Then you will have no grief or troubled conscience, my lord, because you will not have shed blood without cause or taken revenge into your own hands. And when Yahweh has done good for you, my lord, remember your servant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “your maidservant,” Abigail’s humble way of referring to herself.
    reason: lexical_alternative
