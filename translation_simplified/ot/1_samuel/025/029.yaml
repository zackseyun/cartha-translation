translation:
  language: en
  text: Even though a man has risen up to chase you and take your life, your life, my lord, will be kept safe with Yahweh your God—securely tied in the bundle of the living.[a] But he will hurl your enemies’ lives away from the pouch of a sling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures something securely tied in a bundle for safekeeping.
    reason: simplification_note
simplification_decisions:
- pob_phrase: to pursue you and to seek your life
  simplified_phrase: to chase you and take your life
  preserved_meaning: A male adversary is actively pursuing David with lethal intent.
  reasoning_layer_used: POB lexical decisions for רדף and נֶפֶשׁ
  rationale: The common wording states the hostile pursuit and lethal aim without adding a hunting nuance.
- pob_phrase: the life of my lord shall be bound in the bundle of the living with Yahweh your God
  simplified_phrase: your life, my lord, will be kept safe with Yahweh your God—securely tied in the bundle of the living
  preserved_meaning: David’s life will remain securely preserved with Yahweh.
  reasoning_layer_used: POB lexical and theological decisions on the bundle metaphor
  rationale: The reordered wording explains the image while retaining the bundle and respectful address.
- pob_phrase: the lives of your enemies he shall sling out from the hollow of the sling
  simplified_phrase: he will hurl your enemies’ lives away from the pouch of a sling
  preserved_meaning: God will violently remove David’s enemies in contrast with David’s safekeeping.
  reasoning_layer_used: POB lexical decision for קלע and theological contrast
  rationale: Pouch is clearer than hollow while preserving the concrete sling image without naming a projectile.
interpretive_expansions:
- pob_phrase: bound in the bundle of the living
  rendering: kept safe ... securely tied in the bundle of the living
  claim: The bundle image signifies secure preservation.
  evidence:
  - The POB rationale identifies the metaphor as secure safekeeping.
  - The immediate contrast is with enemies being hurled away.
  confidence: high
  alternatives_preserved:
  - The wording does not define the image as eternal life.
- pob_phrase: sling out from the hollow of the sling
  rendering: hurl ... away from the pouch of a sling
  claim: The enemies’ lives are pictured as being violently slung away.
  evidence:
  - The Hebrew verb specifically denotes slinging.
  - The sling’s hollow refers to its pouch.
  confidence: high
  alternatives_preserved:
  - No particular projectile is specified.
  - The action remains metaphorical rather than a literal execution method.
translation_notes:
