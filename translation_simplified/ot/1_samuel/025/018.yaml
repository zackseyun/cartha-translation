  text: Abigail acted quickly. She took 200 loaves of bread, two wineskins of wine, five sheep already prepared as food, five measures of roasted grain,[a] 100 clusters of raisins, and 200 fig cakes. She loaded all these provisions onto the donkeys.
  philosophy: optimal-equivalence
