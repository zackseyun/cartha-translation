  text: My lord, as surely as Yahweh lives and as surely as you live, Yahweh has kept you from becoming guilty of shedding blood and from taking revenge by your own hand.[a] So may your enemies and those who intend to harm you be like Nabal.[b]
  philosophy: optimal-equivalence
  footnotes:
