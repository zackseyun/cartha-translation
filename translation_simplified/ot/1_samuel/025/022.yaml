translation:
  language: en
  text: May God bring punishment, and worse, on David’s enemies[a] if by morning I leave even one male[b] alive among all who belong to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some interpreters think “David’s enemies” is a scribal euphemism for “David” or “me,” since this kind of oath normally calls punishment on the speaker.
    reason: textual_variant
  - marker: b
    text: The Hebrew uses a crude expression, “one who urinates against a wall,” meaning a male.
    reason: lexical_alternative
