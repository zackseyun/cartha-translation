translation:
  language: en
  text: When Yahweh has done everything good he said he would do for you, my lord,[a] and has appointed you ruler over Israel,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has done all the good he promised you.” The Hebrew refers to the good Yahweh spoke concerning David.
    reason: lexical_alternative
  - marker: b
    text: Or “has commissioned you to lead Israel.” The verb can mean “command,” but here it likely refers to appointment as ruler.
    reason: alternative_reading
