  simplified_phrase: everything good he said he would do for you
  preserved_meaning: Yahweh will bring about the good he spoke concerning David.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The rewrite states the future sense in ordinary English without turning “spoke” into an unqualified promise term.
- pob_phrase: for my lord
  simplified_phrase: for you, my lord
  preserved_meaning: Abigail addresses David directly and respectfully.
  reasoning_layer_used: POB lexical decision for לַאדֹנִי
  rationale: Moving the respectful address beside “you” makes the relationship clear.
