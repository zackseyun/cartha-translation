translation:
  language: en
  text: When Abigail saw David, she quickly got off the donkey. She fell facedown before him and bowed to the ground.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: she hurried and got down from the donkey
  simplified_phrase: she quickly got off the donkey
  preserved_meaning: Abigail acted urgently and descended from the animal she was riding.
  reasoning_layer_used: POB lexical decisions for וַתְּמַהֵר and וַתֵּרֶד מֵעַל הַחֲמוֹר
  rationale: “Quickly got off” is more natural common English while retaining both urgency and movement.
- pob_phrase: fell before David on her face
  simplified_phrase: fell facedown before him
  preserved_meaning: Abigail placed herself face to the ground in submission before David.
  reasoning_layer_used: POB lexical decisions for וַתִּפֹּל לְאַפֵּי דָוִד and עַל פָּנֶיהָ
  rationale: “Facedown” makes the physical posture immediately clear without adding “at his feet.”
- pob_phrase: and bowed to the ground
  simplified_phrase: and bowed to the ground
  preserved_meaning: Her gesture expressed deep human homage rather than necessarily divine worship.
  reasoning_layer_used: POB theological decision on שׁחה in a human encounter
  rationale: The wording is already clear and avoids the misleading theological sense of “worshiped.”
translation_notes:
  risk_flags:
  - risk: The two gestures may sound repetitive to a modern reader.
    mitigation: Both are retained because the Hebrew presents falling facedown and bowing as distinct actions.
