translation:
  language: en
  text: Achish replied to David, “As far as I am concerned, you are good—like an angel of God.[a] But the Philistine commanders have said, ‘He must not march with us into battle.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like a messenger of God.” The Hebrew word can mean either “angel” or “messenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: answered and said to David
  simplified_phrase: replied to David
  preserved_meaning: Achish responds directly to David.
  reasoning_layer_used: The lexical decisions identify both verbs as a standard introduction to a reply.
  rationale: The single natural verb avoids a repetitive Hebrew dialogue formula.
- pob_phrase: you are good in my eyes
  simplified_phrase: As far as I am concerned, you are good
  preserved_meaning: Achish personally judges David favorably without defining the exact quality more narrowly.
  reasoning_layer_used: The lexical rationale says the idiom expresses Achish’s broad assessment of loyalty and favor.
  rationale: The modern idiom makes the personal viewpoint immediately clear.
- pob_phrase: He must not go up with us into battle
  simplified_phrase: He must not march with us into battle
  preserved_meaning: The commanders prohibit David from joining their military campaign.
  reasoning_layer_used: The lexical rationale preserves both the force of the prohibition and the campaign movement pictured by the Hebrew verb.
  rationale: “March” keeps the military movement image more clearly than the opaque phrase “go up.”
