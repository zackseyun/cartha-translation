translation:
  language: en
  text: David and his men got up early. That morning they left to return to Philistine territory. The Philistines moved up to Jezreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “marched up to Jezreel”; “up” reflects the Hebrew way of describing movement to a place and may also suggest a military advance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So David rose early, he and his men
  simplified_phrase: David and his men got up early
  preserved_meaning: David and his fighting company began the day early.
  reasoning_layer_used: The lexical decision identifies “got up early” as a natural equivalent and “men” as David’s company.
  rationale: The reordered sentence uses ordinary English while keeping the temporal emphasis and the identity of the group.
- pob_phrase: to leave in the morning and return to the land of the Philistines
  simplified_phrase: That morning they left to return to Philistine territory
  preserved_meaning: They set out from the camp that morning in order to go back into Philistine-controlled land.
  reasoning_layer_used: The lexical decisions protect both the departure sense of “leave” and the purpose expressed by “return.”
  rationale: A separate sentence clarifies the time, action, and destination without repeating awkward infinitive clauses.
- pob_phrase: the Philistines went up to Jezreel
  simplified_phrase: The Philistines moved up to Jezreel
  preserved_meaning: The Philistines proceeded to Jezreel, with the Hebrew upward-movement image retained.
  reasoning_layer_used: The lexical decision preserves “up” while recognizing possible topographical or military force.
  rationale: “Moved up” is clearer modern narrative English, and the footnote preserves the possible military nuance.
