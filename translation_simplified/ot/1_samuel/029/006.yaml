translation:
  language: en
  text: Then Achish called David and said, “As surely as Yahweh lives, you are upright. Your conduct with me in the camp has pleased me. I have found no wrongdoing in you from the day you came to me until today. But the Philistine rulers do not consider you acceptable.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your going out and your coming in with me in the camp is good in my sight
  simplified_phrase: Your conduct with me in the camp has pleased me
  preserved_meaning: Achish approves of David’s activities and behavior with him in the military camp.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: The documented idiomatic alternative communicates the same approval in ordinary English.
- pob_phrase: I have not found any evil in you
  simplified_phrase: I have found no wrongdoing in you
  preserved_meaning: Achish says he has found nothing blameworthy in David.
  reasoning_layer_used: POB lexical decision for לֹא מָצָאתִי בְךָ רָעָה
  rationale: “Wrongdoing” preserves the moral and judicial force without the awkward phrase “evil in you.”
- pob_phrase: the lords of the Philistines
  simplified_phrase: the Philistine rulers
  preserved_meaning: The distinctive title refers to the leading authorities of the Philistines.
  reasoning_layer_used: POB lexical decision for סְרָנִים
  rationale: “Rulers” makes the officials’ role immediately clear to modern readers.
interpretive_expansions:
- pob_phrase: you are not good
  rendering: do not consider you acceptable
  claim: The Philistine rulers reject David’s participation rather than judge that he has no moral goodness.
  evidence:
  - The POB lexical decision identifies “not acceptable” as the contextual sense.
  - The phrase “in the eyes of” marks this as the rulers’ evaluation.
  confidence: high
  alternatives_preserved:
  - you are not good
  - you are not pleasing
translation_notes:
  risk_flags:
