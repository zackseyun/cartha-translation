translation:
  language: en
  text: The Philistines brought all their camps together at Aphek.[a] Meanwhile, Israel was camped beside the spring in Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “all their forces” or “all their armies”; more literally, it says “all their camps.”
    reason: lexical_alternative
