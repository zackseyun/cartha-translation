- pob_phrase: gathered all their camps
  simplified_phrase: brought all their camps together
  preserved_meaning: The Philistines assembled all their military encampments or divisions.
  reasoning_layer_used: Lexical decision for וַיִּקְבְּצוּ and כָּל מַחֲנֵיהֶם
  rationale: The recast makes clear that the separate camps were assembled without replacing the Hebrew image.
- pob_phrase: while Israel was encamped
  simplified_phrase: Meanwhile, Israel was camped
  preserved_meaning: Israel was stationed nearby at the same time.
  reasoning_layer_used: Lexical decision for וְיִשְׂרָאֵל and חֹנִים
  rationale: A new sentence and “Meanwhile” preserve the simultaneous scene while easing the syntax.
- pob_phrase: by the spring that is in Jezreel
  simplified_phrase: beside the spring in Jezreel
  preserved_meaning: Israel was located near the water source in Jezreel.
  reasoning_layer_used: Lexical decisions for בַּעַיִן and אֲשֶׁר בְּיִזְרְעֶאל
  rationale: The shorter location phrase retains both the spring and its place in Jezreel.
