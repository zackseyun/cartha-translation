  preserved_meaning: They feared he would become their opponent once the battle began.
  reasoning_layer_used: POB lexical and theological decisions on שָׂטָן
  rationale: The verbal wording avoids confusion with Satan while preserving the threat of betrayal.
- pob_phrase: with what could this man reconcile himself to his lord?
  simplified_phrase: How could he regain his lord’s favor?
  preserved_meaning: David might make himself acceptable to his superior again.
  reasoning_layer_used: POB lexical decision on יִתְרַצֶּה and its stated alternative
  rationale: “Regain favor” states the practical sense in common English without losing the political relationship.
- pob_phrase: Would it not be with the heads of those men?
  simplified_phrase: Would it not be by taking the heads of our own men?
  preserved_meaning: David could win favor by killing Philistine soldiers and delivering evidence of their deaths.
  reasoning_layer_used: POB lexical rationale and immediate battle context
  rationale: The revision keeps the graphic image while making the implied action and referent easier to follow.
