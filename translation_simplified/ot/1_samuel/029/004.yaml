translation:
  language: en
  text: But the Philistine commanders were angry with him. They said, “Send the man back to the place where you assigned him. Do not let him go down with us into battle, or he may turn against us during the fighting. How could he regain his lord’s favor? Would it not be by taking the heads of our own men?”
  philosophy: optimal-equivalence
