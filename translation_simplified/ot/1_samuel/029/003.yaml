translation:
  language: en
  text: Then the Philistine commanders asked, “Why are these Hebrews here?” Achish answered, “Is this not David, the servant of Saul king of Israel? He has been with me for a long time now. From the day he defected to me[a] until this very day, I have found nothing against him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “fell to me,” an expression meaning that he came over or defected.
    reason: lexical_alternative
