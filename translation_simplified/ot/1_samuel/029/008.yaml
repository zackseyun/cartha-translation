translation:
  language: en
  text: David said to Achish, “But what have I done wrong? What fault have you found in your servant since I entered your service? Why should I not go and fight the enemies of my lord the king?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: David’s words may refer straightforwardly to Achish, but they may also be deliberately ambiguous about whom he means by “my lord the king.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: what have I done? And what have you found against your servant
  simplified_phrase: what have I done wrong? What fault have you found in your servant
  preserved_meaning: David protests that Achish has found no wrongdoing that would justify excluding him.
  reasoning_layer_used: lexical decisions for כִּי מֶה עָשִׂיתִי and וּמַה מָּצָאתָ בְעַבְדְּךָ
  rationale: “Wrong” and “fault” state the accusatory sense in ordinary English.
- pob_phrase: from the day I entered your service until this day
  simplified_phrase: since I entered your service
  preserved_meaning: The question covers David’s entire period of service to Achish.
  reasoning_layer_used: lexical decision for מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  rationale: “Since” compresses the time span without changing its extent.
- pob_phrase: that I should not go and fight
  simplified_phrase: Why should I not go and fight
  preserved_meaning: David questions why he is being kept from joining the battle.
  reasoning_layer_used: lexical decision for כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  rationale: A direct question makes the complaint easier to follow.
translation_notes:
