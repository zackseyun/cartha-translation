translation:
  language: en
  text: '“Isn’t this David, the one they sang about back and forth as they danced:


    ‘Saul has struck down his thousands,

    and David his tens of thousands[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “myriads.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is this not David
  simplified_phrase: Isn’t this David
  preserved_meaning: The question expects the hearers to recognize David.
  reasoning_layer_used: POB lexical decision for הֲלוֹא and זֶה דָוִד
  rationale: The contraction makes the rhetorical question sound natural without weakening it.
- pob_phrase: of whom they sang to one another in the dances
  simplified_phrase: the one they sang about back and forth as they danced
  preserved_meaning: The dancers sang a responsive song about David.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר, יַעֲנוּ לוֹ, and בַּמְּחֹלוֹת
  rationale: The new wording makes the antiphonal singing and dancing immediately clear.
- pob_phrase: his ten thousands
  simplified_phrase: his tens of thousands
  preserved_meaning: David is praised for defeating far more enemies than Saul.
  reasoning_layer_used: POB lexical decision for בְּרִבְבֹתָיו
  rationale: “Tens of thousands” is the natural modern form while retaining the numeric contrast.
translation_notes:
  risk_flags:
  - risk: “Back and forth” may sound less formal than the POB idiom.
    mitigation: It clearly preserves the documented sense of responsive singing.
  - risk: “Tens of thousands” may be heard as an exact count.
    mitigation: The footnote preserves the broader lexical possibility “myriads.”
