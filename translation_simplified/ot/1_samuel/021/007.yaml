translation:
  language: en
  text: So the priest gave him holy bread, because no other bread was there. It was the bread of the Presence[a], which had been removed from before Yahweh so that hot bread could be put there that same day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called “showbread”; literally, “the bread of the Presence.”
