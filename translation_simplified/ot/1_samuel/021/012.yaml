translation:
  language: en
  text: 'Achish’s servants said to him, “Isn’t this David, the king of the land? Isn’t he the one they sang about as they danced[a]: ‘Saul has struck down his thousands, and David his tens of thousands’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that they answered one another in song as they danced.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is this not David, the king of the land?
  simplified_phrase: Isn’t this David, the king of the land?
  preserved_meaning: The servants ask a rhetorical question that expects agreement while leaving David’s title unresolved.
  reasoning_layer_used: lexical and theological decisions
  rationale: The contraction sounds natural while preserving the question and the narrative tension.
- pob_phrase: the one of whom they sang in the dances
  simplified_phrase: the one they sang about as they danced
  preserved_meaning: David was the subject of a song performed during dancing.
  reasoning_layer_used: lexical decisions for לָזֶה, יַעֲנוּ, and בַמְּחֹלוֹת
  rationale: Ordinary clause order makes the song-and-dance setting clear.
- pob_phrase: his ten thousands
  simplified_phrase: his tens of thousands
  preserved_meaning: The song credits David with a far greater battle tally than Saul.
  reasoning_layer_used: lexical decision for ברבבתו
  rationale: “Tens of thousands” is clearer modern English and remains within the documented lexical range.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “king of the land” as David’s settled official title.
    mitigation: The wording remains inside the servants’ quoted perception and does not resolve the narrative tension.
