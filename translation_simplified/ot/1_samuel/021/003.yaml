translation:
  language: en
  text: David said to Ahimelech the priest, “The king gave me an assignment and told me, ‘No one must know anything about the assignment I am sending you to carry out and have ordered you to complete.’ I have told the young men to go to a certain place.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “to such-and-such a place,” meaning an unspecified or undisclosed location.
    reason: lexical_alternative
