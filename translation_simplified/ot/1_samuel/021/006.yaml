translation:
  language: en
  text: David answered the priest, “We have had no sexual relations with women since I set out, as on the previous days. The young men’s vessels are holy,[a] even though this is an ordinary journey. So how much more will the vessel be made holy today!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vessels” may mean the young men’s equipment or, as a figure of speech, their bodies.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of this sentence is difficult; it may mean that although the journey is ordinary, the vessel or gear will be holy today.
    reason: alternative_reading
