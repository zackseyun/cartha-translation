translation:
  language: en
  text: 'The priest said, “Here is the sword of Goliath the Philistine, whom you struck down in the Valley of Elah. It is wrapped in a cloak behind the ephod.[a] If you want it, take it. It is the only sword here.”


    David said, “No other sword compares with it. Give it to me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was a sacred garment worn by a priest.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold
  simplified_phrase: Here is the sword of Goliath the Philistine, whom you struck down in the Valley of Elah.
  preserved_meaning: The priest draws attention to Goliath’s sword and recalls David’s victory over him.
  reasoning_layer_used: Lexical decisions for הִנֵּה, חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי, and הִכִּיתָ
  rationale: “Here is” preserves the attention-directing force of “behold” in natural modern English.
- pob_phrase: If you will take that for yourself, take it
  simplified_phrase: If you want it, take it.
  preserved_meaning: The priest gives David permission to take the sword.
  reasoning_layer_used: Lexical decision for אִם אֹתָהּ תִּקַּח לְךָ קָח
  rationale: The simpler condition expresses the same voluntary offer without the stiff clause structure.
- pob_phrase: there is no other here except it ... There is none like it
  simplified_phrase: It is the only sword here ... No other sword compares with it.
  preserved_meaning: This is the sole available sword, and David regards it as unmatched.
  reasoning_layer_used: Lexical decisions for כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה and אֵין כָּמוֹהָ
  rationale: Naming the sword directly clarifies both feminine references while keeping availability and excellence distinct.
translation_notes:
