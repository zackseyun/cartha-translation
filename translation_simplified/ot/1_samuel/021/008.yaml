translation:
  language: en
  text: One of Saul’s servants was there that day, detained before Yahweh.[a] His name was Doeg the Edomite, and he was in charge of Saul’s shepherds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “restrained” or “kept back”; it does not say why Doeg was detained.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A man of Saul’s servants
  simplified_phrase: One of Saul’s servants
  preserved_meaning: Doeg was an individual member of Saul’s royal servants.
  reasoning_layer_used: lexical decision for מֵעַבְדֵי שָׁאוּל
  rationale: The partitive relationship is clearer in ordinary English as “one of.”
- pob_phrase: his name was Doeg the Edomite, the chief of Saul’s shepherds
  simplified_phrase: His name was Doeg the Edomite, and he was in charge of Saul’s shepherds
  preserved_meaning: Doeg held authority over Saul’s shepherds.
  reasoning_layer_used: lexical decision for אַבִּיר הָרֹעִים
  rationale: A separate clause explains his role more naturally than the title “chief.”
- pob_phrase: detained before Yahweh
  simplified_phrase: detained before Yahweh
  preserved_meaning: Doeg was held back in relation to Yahweh for an unspecified reason.
  reasoning_layer_used: theological decision preserving ambiguity
  rationale: The phrase is retained because clearer alternatives could wrongly specify why he was held.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what being detained before Yahweh involved.
    mitigation: The footnote preserves the Hebrew alternatives and states that the reason is unspecified.
