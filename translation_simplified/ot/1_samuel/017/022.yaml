translation:
  language: en
  text: David left the supplies with the person in charge of them. Then he ran to the battle line. When he arrived, he asked his brothers how they were.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the keeper of the supplies
  simplified_phrase: the person in charge of them
  preserved_meaning: David entrusted the supplies to the person responsible for watching over them.
  reasoning_layer_used: POB lexical decision for עַל יַד שֹׁמֵר הַכֵּלִים
  rationale: This removes repetition while preserving the keeper's custodial role.
- pob_phrase: So David left the supplies ... and ran to the battle line
  simplified_phrase: David left the supplies ... Then he ran to the battle line.
  preserved_meaning: David first left what he was carrying in safe hands and then ran to the troops' formation.
  reasoning_layer_used: POB lexical decisions and narrative sequence
  rationale: Two short sentences make the action sequence easier to follow.
- pob_phrase: asked his brothers how they were
  simplified_phrase: asked his brothers how they were
  preserved_meaning: David inquired about his brothers' well-being rather than merely greeting them.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  rationale: The natural English idiom is already clear and accurately conveys the Hebrew expression.
translation_notes:
  risk_flags:
  - risk: “Battle line” could be read as a geographic boundary rather than an arranged formation of troops.
    mitigation: The immediate military context and David's running toward it keep the intended sense clear.
