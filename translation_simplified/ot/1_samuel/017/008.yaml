  text: He stood and shouted to Israel’s battle lines, “Why have you come out and lined up for battle? Am I not the Philistine champion, and are you not Saul’s servants?[a] Choose one man and have him come down to me.”
  philosophy: optimal-equivalence
  footnotes:
