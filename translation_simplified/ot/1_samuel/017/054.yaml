translation:
  language: en
  text: David took the Philistine’s head and brought it to Jerusalem.[a] He put the Philistine’s weapons[b] in his own tent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jerusalem was not yet fully under Israelite control at this point in the story; the Hebrew directly says David brought the head there.
    reason: cultural_note
  - marker: b
    text: The Hebrew term is broad and may include armor and other military equipment as well as weapons.
    reason: lexical_alternative
