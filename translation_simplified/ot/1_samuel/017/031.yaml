  simplified_phrase: When people heard what David had said
  preserved_meaning: David’s spoken words became known to others.
  reasoning_layer_used: The lexical decision allows an active rendering of the hearing verb while retaining the speech context.
  rationale: The active clause is easier to understand than the abstract passive wording.
- pob_phrase: they reported them before Saul
  simplified_phrase: they reported it to Saul
  preserved_meaning: The people relayed what David had said directly to Saul.
  reasoning_layer_used: The lexical rationale says “before Saul” can idiomatically mean “to Saul.”
  rationale: The common English idiom makes the direction of the report immediately clear.
- pob_phrase: he sent for him
  simplified_phrase: Saul had David brought to him
  preserved_meaning: Saul caused David to be brought into his presence.
  reasoning_layer_used: The chosen lexical rendering and latest revision record preserve the likely court-setting sense of וַיִּקָּחֵהוּ.
  rationale: Naming both men removes unclear pronouns and states the controlling source-driven meaning.
