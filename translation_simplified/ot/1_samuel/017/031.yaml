translation:
  language: en
  text: When people heard what David had said, they reported it to Saul. Then Saul had David brought to him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “he took him.” Here the Hebrew likely means that Saul had David brought before him.
