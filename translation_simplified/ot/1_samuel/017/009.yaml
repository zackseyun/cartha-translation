  preserved_meaning: He challenges one opponent to personal combat.
  reasoning_layer_used: Lexical decision for יכל and לְהִלָּחֵם אִתִּי
  rationale: The shorter wording expresses ability and mutual combat in natural English.
- pob_phrase: if I prevail against him
  simplified_phrase: if I overpower him
  preserved_meaning: The speaker claims he may overcome his opponent in combat.
  reasoning_layer_used: Lexical decision for אֲנִי אוּכַל לוֹ
  rationale: “Overpower” makes the combat sense of prevailing immediately clear.
- pob_phrase: then we will be your slaves / then you will be our slaves
  simplified_phrase: we will become your slaves / you will become our slaves
  preserved_meaning: The defeated people will enter bonded service under the victors.
  reasoning_layer_used: Lexical decisions and regression fix for עֲבָדִים
  rationale: “Become” clarifies the resulting change in status while retaining “slaves.”
