translation:
  language: en
  text: Then a champion[a] named Goliath came out from the Philistine camps. He was from Gath and stood about 9 feet 9 inches tall (about 3 meters).[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally means “a man of the space between,” probably a warrior who fought as his army’s representative between the battle lines.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: six cubits and a span; the exact modern measurement depends on the length of the cubit used.'
    reason: cultural_note
