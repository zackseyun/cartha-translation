  preserved_meaning: Yahweh's ownership of the battle explains why weapons are not what saves.
  reasoning_layer_used: POB lexical decision that the second כִּי is causal and explanatory
  rationale: “Because” makes the verse's reason relationship immediately clear.
- pob_phrase: he will give you into our hand
