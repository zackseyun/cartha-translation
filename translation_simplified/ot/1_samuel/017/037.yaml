translation:
  language: en
  text: David said, “Yahweh delivered me from the paws of the lion and the bear. He will also deliver me from the grasp of this Philistine.” Saul replied, “Go. May Yahweh be with you.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh will be with you.” The Hebrew may express either a blessing or a statement about what will happen.
    reason: alternative_reading
