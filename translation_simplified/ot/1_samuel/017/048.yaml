translation:
  language: en
  text: When the Philistine got up and came closer to meet David, David hurried toward the battle line,[a] running to meet him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “toward the ranks.” The Hebrew can refer to a battle line or battle formation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rose and came and drew near
  simplified_phrase: got up and came closer
  preserved_meaning: The Philistine rises and moves nearer to David.
  reasoning_layer_used: POB lexical decisions for קָם, וַיֵּלֶךְ, and וַיִּקְרַב
  rationale: The simpler wording preserves both getting up and approaching without a stiff chain of verbs.
- pob_phrase: David hurried and ran toward the battle line
  simplified_phrase: David hurried toward the battle line, running
  preserved_meaning: David moves quickly by running toward the place of engagement.
  reasoning_layer_used: POB lexical decisions for וַיְמַהֵר, וַיָּרָץ, and הַמַּעֲרָכָה
  rationale: The participial wording keeps both David’s haste and his running in natural English.
- pob_phrase: to meet the Philistine
  simplified_phrase: to meet him
  preserved_meaning: David runs directly to encounter the Philistine.
  reasoning_layer_used: POB lexical decision for לִקְרַאת
  rationale: The pronoun avoids heavy repetition while leaving its referent clear.
translation_notes:
  risk_flags:
  - risk: Combining “came” and “drew near” may reduce the Hebrew narrative’s step-by-step movement.
    mitigation: “Came closer” still clearly expresses the Philistine’s movement toward David.
