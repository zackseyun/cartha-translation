translation:
  language: en
  text: David ran to the Philistine and stood over him.[a] He took the Philistine’s own sword, pulled it from its sheath, and killed him. Then David used the sword to cut off his head. When the Philistines saw that their champion was dead, they ran away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stood beside him.” The Hebrew can mean taking a position over or near the fallen Philistine.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then David ran and stood over the Philistine
  simplified_phrase: David ran to the Philistine and stood over him
  preserved_meaning: David quickly approached the fallen Philistine and took his position over him.
  reasoning_layer_used: POB lexical decision for וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  rationale: The recast wording makes David’s movement easier to follow while retaining the preferred spatial meaning.
- pob_phrase: took his sword, drew it from its sheath
  simplified_phrase: took the Philistine’s own sword, pulled it from its sheath
  preserved_meaning: David took Goliath’s sword and removed it from its sheath.
  reasoning_layer_used: POB lexical decisions for חַרְבּוֹ and וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  rationale: Naming the owner removes an unclear pronoun, and “pulled” is more immediately understandable than “drew.”
- pob_phrase: When the Philistines saw that their champion was dead, they fled
  simplified_phrase: When the Philistines saw that their champion was dead, they ran away
  preserved_meaning: Goliath’s death caused the Philistine forces to flee.
  reasoning_layer_used: POB lexical decisions for גִּבּוֹרָם and וַיָּנֻסוּ
  rationale: “Ran away” gives the plain military sense of “fled” while preserving Goliath’s representative role as champion.
