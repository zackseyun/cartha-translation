translation:
  language: en
  text: Eliab, David’s oldest brother, heard David talking to the men. Eliab’s anger burned against him. He said, “Why did you come down here? Who did you leave those few sheep with in the wilderness? I know your arrogance[a] and the evil in your heart.[b] You came down to see the battle.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pride,” “presumption,” or “insolence.”
    reason: lexical_alternative
  - marker: b
    text: Or “the wickedness of your heart.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Eliab his oldest brother heard him speaking to the men
  simplified_phrase: Eliab, David’s oldest brother, heard David talking to the men
  preserved_meaning: Eliab heard David while David was speaking to the men.
  reasoning_layer_used: POB lexical decision for בְּדַבְּרוֹ and immediate context
  rationale: Names replace unclear pronouns, while “talking to” preserves the direction of David’s speech.
- pob_phrase: with whom have you left those few sheep
  simplified_phrase: Who did you leave those few sheep with
  preserved_meaning: Eliab asks who is now caring for David’s small flock.
  reasoning_layer_used: POB lexical decisions for נטשׁ and מְעַט הַצֹּאן
  rationale: The question uses ordinary English while keeping Eliab’s dismissive “few sheep.”
- pob_phrase: your presumption and the evil of your heart
  simplified_phrase: your arrogance and the evil in your heart
  preserved_meaning: Eliab accuses David of overbold pride and inner moral evil.
  reasoning_layer_used: POB lexical decisions for זְדוֹנְךָ and רֹעַ לְבָבֶךָ
  rationale: The wording makes Eliab’s accusation immediately understandable without weakening it.
translation_notes:
  risk_flags:
  - risk: “Arrogance” expresses one shade of a term that can also mean presumption or insolence.
    mitigation: Footnote a preserves the important lexical alternatives.
