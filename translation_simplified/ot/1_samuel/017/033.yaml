simplification_decisions:
- pob_phrase: You are not able to go against this Philistine to fight with him
  simplified_phrase: You cannot go against this Philistine and fight him
  preserved_meaning: Saul says David is unable, not merely forbidden, to face the Philistine in combat.
  reasoning_layer_used: POB lexical decisions for לֹא תוּכַל, לָלֶכֶת אֶל, and לְהִלָּחֵם עִמּוֹ
  rationale: The shorter wording uses natural English while retaining the military sense and force of inability.
- pob_phrase: because you are a youth
  simplified_phrase: You are a young man
  preserved_meaning: Saul contrasts David's youth with his opponent's lifelong combat experience.
  reasoning_layer_used: POB lexical decision for נַעַר and its documented alternatives
  rationale: “Young man” is clearer today, while the footnote preserves the Hebrew word's age-range ambiguity.
- pob_phrase: he has been a man of war from his youth
  simplified_phrase: he has been a warrior since he was young
  preserved_meaning: The Philistine has been an experienced fighting man from an early age.
  reasoning_layer_used: POB lexical decisions for אִישׁ מִלְחָמָה and מִנְּעֻרָיו
  rationale: “Warrior” communicates the martial expression directly, and “since he was young” makes the duration plain.
