translation:
  language: en
  text: Saul said to David, “You cannot go against this Philistine and fight him. You are a young man,[a] but he has been a warrior since he was young.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “youth” or, in some contexts, “boy.”
