translation:
  language: en
  text: He took his staff in his hand and picked out five smooth stones for himself from the streambed.[a] He put them in his shepherd’s pouch. With his sling in his hand, he approached the Philistine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer to a ravine or a seasonal watercourse.
    reason: lexical_alternative
