  preserved_meaning: David deliberately selected the stones for his own use.
  reasoning_layer_used: POB lexical decision for וַיִּבְחַר לוֹ
  rationale: “Picked out” is common English while retaining deliberate personal selection.
- pob_phrase: from the wadi
