  preserved_meaning: David attempted to move while wearing the unfamiliar equipment.
  reasoning_layer_used: POB lexical decision for וַיֹּאֶל לָלֶכֶת
  rationale: “Tried to walk” clearly conveys attempted movement without adding that he moved around.
- pob_phrase: he had not tested them
  simplified_phrase: he had never tried using this equipment
  preserved_meaning: David had not tested the military equipment through use.
  reasoning_layer_used: POB lexical decisions for נסה and the implicit plural object
  rationale: This expresses practical testing in common English while identifying the implied equipment.
- pob_phrase: removed them from himself
  simplified_phrase: took it off
  preserved_meaning: David removed the armor and related equipment he was wearing.
  reasoning_layer_used: POB lexical decision for וַיְסִרֵם ... מֵעָלָיו
  rationale: This ordinary English expression clearly describes removing worn equipment.
