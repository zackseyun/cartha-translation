translation:
  language: en
  text: Today Yahweh will hand you over into my power. I will strike you down and remove your head. Today I will give the dead bodies from the Philistine camp to the birds of the sky and the wild animals of the earth. Then all the earth will know that there is a God for Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “that there is a God in Israel.” The Hebrew literally says “for Israel,” which may show God’s relationship with Israel or his action on Israel’s behalf.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will deliver you into my hand
  simplified_phrase: will hand you over into my power
  preserved_meaning: Yahweh will give Goliath over to David’s power.
  reasoning_layer_used: lexical decision for יְסַגֶּרְךָ and בְּיָדִי
  rationale: The wording explains the hand idiom while retaining its image in “hand you over.”
- pob_phrase: the corpses of the Philistine camp
  simplified_phrase: the dead bodies from the Philistine camp
  preserved_meaning: The slain members of the Philistine force will be exposed to scavengers.
  reasoning_layer_used: lexical decisions for פֶּגֶר and מַחֲנֵה פְלִשְׁתִּים
  rationale: “Dead bodies” is more familiar than “corpses,” and “from” prevents readers from picturing the camp itself as a corpse.
- pob_phrase: so that all the earth may know
  simplified_phrase: Then all the earth will know
  preserved_meaning: David’s victory is intended to make Israel’s God known everywhere.
  reasoning_layer_used: lexical decision for וְיֵדְעוּ כָּל הָאָרֶץ
  rationale: A new sentence states the intended result in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Into my power” explains rather than literally reproduces the singular-hand idiom.
    mitigation: The phrase “hand you over” preserves the hand image and the footnote is unnecessary for ordinary readers.
  - risk: “There is a God for Israel” may sound unusual or be read too narrowly.
    mitigation: The main text preserves the audited covenantal wording, while the footnote gives the plausible alternative “in Israel.”
