translation:
  language: en
  text: The Philistines were standing on the mountain[a] on one side, and the Israelites were standing on the mountain on the other side. The valley[b] lay between them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean either “mountain” or “hill” in both places.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may also mean a steep-sided ravine.
    reason: lexical_alternative
