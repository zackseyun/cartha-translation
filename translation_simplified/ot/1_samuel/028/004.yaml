translation:
  language: en
  text: The Philistines gathered together and came to Shunem, where they set up camp. Saul gathered all Israel, and they set up camp at Gilboa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This could also be translated “on Gilboa” or “at Mount Gilboa”; the name refers to the Gilboa highlands.
    reason: lexical_alternative
