translation:
  language: en
  text: Yahweh has acted for himself,[a] exactly as he said through me. Yahweh has torn the kingdom out of your hand and given it to your neighbor David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew reads “for himself”; many translations read “to you” or “for you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has done for himself
  simplified_phrase: has acted for himself
  preserved_meaning: Yahweh carried out his own declared purpose, while retaining the Masoretic Text’s difficult pronoun.
  reasoning_layer_used: theological decision and lexical decision for וַיַּעַשׂ ... לוֹ
  rationale: “Acted” is clearer than the vague “done” without changing the chosen reading.
- pob_phrase: just as he spoke by my hand
  simplified_phrase: exactly as he said through me
  preserved_meaning: Samuel was the human messenger through whom Yahweh spoke.
  reasoning_layer_used: lexical decision for כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  rationale: The approved alternative removes an opaque Hebrew agency idiom.
- pob_phrase: has torn the kingdom out of your hand and given it to your neighbor, to David
  simplified_phrase: has torn the kingdom out of your hand and given it to your neighbor David
  preserved_meaning: Yahweh removed Saul’s royal rule from his control and transferred it to David.
  reasoning_layer_used: lexical decisions for וַיִּקְרַע, מִיָּדֶךָ, לְרֵעֲךָ, and לְדָוִד
  rationale: The smoother apposition keeps the tearing and hand images intact.
translation_notes:
  risk_flags:
  - risk: “For himself” remains unusual and its precise force is uncertain.
    mitigation: The main text preserves the chosen Masoretic reading, and the footnote records the common alternative.
  - risk: Modern readers may take “neighbor” to mean only someone living nearby.
    mitigation: Naming David immediately identifies the intended person.
