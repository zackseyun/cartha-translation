translation:
  language: en
  text: Then Saul said to his servants, “Find me a woman who is a medium.[a] I will go to her and seek an answer through her.” His servants replied, “There is a woman who is a medium at En-dor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A medium was someone people consulted in an attempt to communicate with the dead.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Find for me a woman who is a medium
  simplified_phrase: Find me a woman who is a medium
  preserved_meaning: Saul orders his servants to locate a female medium for him.
  reasoning_layer_used: POB translation and applied revision
  rationale: Removing “for” makes the command natural without changing Saul’s request.
- pob_phrase: so that I may go to her and inquire through her
  simplified_phrase: I will go to her and seek an answer through her
  preserved_meaning: Saul intends to use the woman as the means of making his inquiry.
  reasoning_layer_used: POB translation and doctrine-realignment revision
  rationale: The wording explains “inquire” while retaining the important sense of acting through her.
- pob_phrase: And his servants said to him, “Look, there is”
  simplified_phrase: His servants replied, “There is”
  preserved_meaning: The servants answer Saul by identifying a medium’s location.
  reasoning_layer_used: POB translation
  rationale: A direct reply sounds natural in modern English without losing the servants’ response.
