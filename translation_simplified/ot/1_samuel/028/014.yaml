simplification_decisions:
- pob_phrase: What is his appearance?
  simplified_phrase: What does he look like?
  preserved_meaning: Saul asks for a visible description so he can identify the figure.
  reasoning_layer_used: Lexical decision for תָּאֳרוֹ
  rationale: The common question expresses the same request more naturally.
- pob_phrase: Then Saul knew that it was Samuel
  simplified_phrase: Then Saul recognized that it was Samuel
  preserved_meaning: Saul identifies the figure from the woman’s description.
  reasoning_layer_used: Lexical rationale for וַיֵּדַע
  rationale: “Recognized” makes the contextual sense of “knew” immediately clear.
- pob_phrase: he bowed with his face to the ground and prostrated himself
  simplified_phrase: He bowed with his face to the ground and bowed down
  preserved_meaning: Saul performs two emphatic acts of deep obeisance.
  reasoning_layer_used: Lexical and theological decisions for וַיִּקֹּד and וַיִּשְׁתָּחוּ
  rationale: “Bowed down” is plain English and avoids specifying either lying down or worship.
