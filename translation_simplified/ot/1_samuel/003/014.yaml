translation:
  language: en
  text: 'Therefore I have sworn this concerning Eli’s family: no sacrifice or offering will ever remove their guilt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “offering” can refer specifically to a grain offering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the house of Eli
  simplified_phrase: Eli’s family
  preserved_meaning: The oath concerns Eli’s household and descendants, not a building.
  reasoning_layer_used: POB lexical decision on בֵּית עֵלִי
  rationale: “Family” makes the Hebrew household expression immediately clear.
- pob_phrase: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering
  simplified_phrase: no sacrifice or offering will ever remove their guilt
  preserved_meaning: Sacrificial means can never remove the culpability of Eli’s family.
  reasoning_layer_used: POB lexical and theological decisions on יִתְכַּפֵּר, עָוֹן, and the judgment
  rationale: The active wording explains atonement plainly while limiting the judgment to sacrifice and offering.
- pob_phrase: I have sworn to the house of Eli
  simplified_phrase: I have sworn this concerning Eli’s family
  preserved_meaning: God’s completed oath remains solemn and binding against Eli’s household.
  reasoning_layer_used: POB lexical decisions on נִשְׁבַּעְתִּי and לְבֵית עֵלִי
  rationale: “Concerning” states the oath’s target naturally without weakening its force.
translation_notes:
  risk_flags:
  - risk: “Remove their guilt” may sound less explicitly sacrificial than “be atoned for.”
    mitigation: Keeping “sacrifice or offering” preserves the verse’s atonement setting.
  - risk: The permanent wording could be mistaken for a broader denial of all divine mercy.
    mitigation: The sentence restricts the claim to what sacrifice or offering can accomplish.
