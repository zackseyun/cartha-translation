  text: Samuel had not yet come to know Yahweh[a] personally,[b] and Yahweh had not yet revealed his word to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the Hebrew name YHWH, traditionally rendered “the LORD.”
