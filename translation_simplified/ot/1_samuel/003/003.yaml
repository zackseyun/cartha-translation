translation:
  language: en
  text: The lamp of God was still burning. Samuel was lying down in Yahweh’s temple.[a] The ark of God was there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sanctuary.” This was Yahweh’s dwelling place at Shiloh, before Solomon’s temple was built.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: had not yet gone out
  simplified_phrase: was still burning
  preserved_meaning: The sanctuary lamp remained lit at that time.
  reasoning_layer_used: Lexical decision for טֶרֶם יִכְבֶּה
  rationale: The positive wording states the same timing more directly.
- pob_phrase: where the ark of God was
  simplified_phrase: The ark of God was there.
  preserved_meaning: The ark was in the same place where Samuel lay.
  reasoning_layer_used: Lexical decision for אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  rationale: A separate sentence makes the location clear without changing it.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “temple” for Solomon’s later building.
    mitigation: The footnote identifies the setting as Yahweh’s sanctuary at Shiloh.
  - risk: Splitting the location clause could weaken its link to Yahweh’s temple.
    mitigation: “There” directly points back to the temple in the preceding sentence.
