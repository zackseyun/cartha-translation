  rationale: “Have told” expresses the prior declaration in ordinary English.
- pob_phrase: for the iniquity that he knew
  simplified_phrase: because of the sin he knew about
  preserved_meaning: Eli is accountable for serious wrongdoing he knew about.
  reasoning_layer_used: Lexical decisions for בַּעֲוֺן and יָדַע
  rationale: This wording makes the connection between the sin and Eli’s knowledge clear.
- pob_phrase: his sons were cursing themselves
  simplified_phrase: his sons were bringing a curse on themselves
  preserved_meaning: The text follows the Masoretic reflexive-like reading rather than the ancient alternative.
