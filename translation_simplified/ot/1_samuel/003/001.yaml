translation:
  language: en
  text: The boy Samuel was serving Yahweh in Eli’s presence. In those days, messages from Yahweh were rare, and visions were not common.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “vision was not breaking forth”; that is, visions were not occurring openly or often.
    reason: lexical_alternative
