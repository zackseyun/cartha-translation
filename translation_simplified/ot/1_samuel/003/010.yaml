translation:
  language: en
  text: Then Yahweh came and stood there. He called just as he had before, “Samuel! Samuel!” Samuel answered, “Speak, because your servant is listening.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then Yahweh came and stood there, and called as at the other times
  simplified_phrase: Then Yahweh came and stood there. He called just as he had before
  preserved_meaning: Yahweh personally came, stood in that place, and called Samuel in the same way as earlier.
  reasoning_layer_used: Lexical decisions and theological decision on anthropomorphic description
  rationale: Two short sentences clarify the sequence while retaining the vivid wording about Yahweh’s presence.
- pob_phrase: Samuel, Samuel!
  simplified_phrase: Samuel! Samuel!
  preserved_meaning: The repeated name remains an emphatic personal summons.
  reasoning_layer_used: Lexical decision on the repeated proper name
  rationale: Separate exclamation marks make the repeated call natural and forceful in modern dialogue.
- pob_phrase: And Samuel said, “Speak, for your servant is listening.”
  simplified_phrase: Samuel answered, “Speak, because your servant is listening.”
  preserved_meaning: Samuel responds humbly that he is ready to listen.
  reasoning_layer_used: Lexical decisions on כִּי, שֹׁמֵעַ, and עַבְדֶּךָ
  rationale: “Answered” shows the response clearly, and “because” gives the reason in common English.
translation_notes:
  risk_flags:
