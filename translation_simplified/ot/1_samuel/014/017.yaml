translation:
  language: en
  text: Then Saul said to the people with him, “Please count everyone and find out who has left us.” They counted the group and discovered that Jonathan and his armor-bearer[a] were missing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An armor-bearer was a military attendant who carried a warrior’s weapons.
    reason: cultural_note
