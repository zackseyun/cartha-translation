translation:
  language: en
  text: Trembling with fear spread through the camp, the open country, and all the people. Even the garrison and the raiding party trembled. Then the ground itself shook, and the trembling came from God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “an overwhelming trembling” or “a divine terror.” The Hebrew may point either to God as the source or to the trembling’s great intensity.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: there was trembling in the camp, in the field, and among all the people
  simplified_phrase: Trembling with fear spread through the camp, the open country, and all the people
  preserved_meaning: Fearful trembling affected the whole camp, surrounding area, and people.
  reasoning_layer_used: Lexical decisions for חֲרָדָה and בַשָּׂדֶה
  rationale: The active wording and “open country” make the fear and its extent easier to understand.
- pob_phrase: the garrison and the raiding party also trembled
  simplified_phrase: Even the garrison and the raiding party trembled
  preserved_meaning: The stationed force and marauding unit were also seized by fear.
  reasoning_layer_used: Lexical decisions for הַמַּצָּב, הַמַּשְׁחִית, and גַּם הֵמָּה
  rationale: “Even” conveys the Hebrew emphasis while retaining the audited military terms.
- pob_phrase: And the earth quaked, so that it became a trembling from God
  simplified_phrase: Then the ground itself shook, and the trembling came from God
  preserved_meaning: A physical quake intensified the terror, which the main reading attributes to God.
  reasoning_layer_used: Lexical decision for וַתִּרְגַּז הָאָרֶץ and theological decision for לְחֶרְדַּת אֱלֹהִים
  rationale: The revision states POB’s chosen source reading in clear English without losing the quake image.
