translation:
  language: en
  text: Ahijah son of Ahitub, brother of Ichabod, son of Phinehas, son of Eli, served as Yahweh’s priest at Shiloh. Ahijah was carrying a priestly object called an ephod.[a] The people did not know that Jonathan had left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “carrying” or “bearing” an ephod; it may mean that he was wearing it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: priest of Yahweh at Shiloh, was carrying an ephod
  simplified_phrase: served as Yahweh’s priest at Shiloh. Ahijah was carrying a priestly object called an ephod
  preserved_meaning: Ahijah held a priestly role at Shiloh and bore the ephod.
  reasoning_layer_used: POB lexical decisions and source context
  rationale: Two sentences separate Ahijah’s role from the object he bore, and repeating his name keeps the subject clear.
- pob_phrase: an ephod
  simplified_phrase: a priestly object called an ephod
  preserved_meaning: The ephod remains named and associated with priestly service without being defined strictly as a garment.
  reasoning_layer_used: POB lexical rationale
  rationale: The brief explanation makes the unfamiliar term understandable while preserving uncertainty about its form.
- pob_phrase: Jonathan had gone
  simplified_phrase: Jonathan had left
  preserved_meaning: Jonathan departed before the people knew about it.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Had left” expresses the same sequence in more natural English.
interpretive_expansions:
- pob_phrase: an ephod
  rendering: a priestly object called an ephod
  claim: The ephod was an object associated with priestly service.
  evidence:
  - The POB lexical rationale describes the ephod as a priestly garment or object.
  - The immediate context identifies Ahijah as Yahweh’s priest.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the possibility that Ahijah was wearing it.
  - “Object” does not restrict the ephod to a garment.
