  preserved_meaning: Jonathan scaled the steep approach using his hands and feet while his military attendant followed.
  reasoning_layer_used: POB lexical decisions for וַיַּעַל, עַל יָדָיו וְעַל רַגְלָיו, נֹשֵׂא כֵלָיו, and אַחֲרָיו
  rationale: The role is explained without adding the unsupported label “soldier,” while the vivid climbing image remains.
- pob_phrase: They fell before Jonathan
