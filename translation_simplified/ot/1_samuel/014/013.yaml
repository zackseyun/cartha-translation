translation:
  language: en
  text: Jonathan climbed up on his hands and feet, and his armor-bearer—the one carrying his weapons—followed behind him. They fell in defeat before Jonathan, and his armor-bearer kept killing them as he followed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “was killing them as he followed.” The Hebrew may describe ongoing rather than repeated action.
    reason: lexical_alternative
