translation:
  language: en
  text: But Jonathan had not heard that his father had put the people under oath. He reached out with the staff in his hand and dipped its tip into the honeycomb.[a] Then he tasted the honey. His eyes brightened—he was refreshed and alert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is literally “forest” or “thicket of honey” and probably means a honeycomb or dense mass of honey.
    reason: lexical_alternative
