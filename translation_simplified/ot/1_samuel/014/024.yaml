translation:
  language: en
  text: 'The men of Israel were in great distress that day. Saul made the people swear: “A curse on anyone who eats food[a] before evening, before I have taken revenge on my enemies!” So not one of them tasted any food.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is literally “bread” in both places, but here it means food in general.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were hard-pressed
  simplified_phrase: were in great distress
  preserved_meaning: The Israelites were suffering under severe pressure that day.
  reasoning_layer_used: lexical decision for נִגַּשׂ
  rationale: “In great distress” states the contextual sense more plainly.
- pob_phrase: put the people under an oath
  simplified_phrase: made the people swear
  preserved_meaning: Saul coercively imposed an oath backed by a curse.
  reasoning_layer_used: lexical decision for וַיֹּאֶל
  rationale: The active wording is easier to understand while retaining Saul’s coercion.
- pob_phrase: Cursed is the man who eats food
  simplified_phrase: A curse on anyone who eats food
  preserved_meaning: The declaration places a curse on every person who violates the ban.
  reasoning_layer_used: lexical decisions for אָרוּר הָאִישׁ and יֹאכַל לֶחֶם
  rationale: “Anyone” naturally expresses the singular generic statement without weakening the curse.
translation_notes:
  risk_flags:
  - risk: “Made the people swear” may suggest that each person verbally took the oath.
    mitigation: The curse speech and coercive verb preserve the sense that Saul imposed the oath on them.
