translation:
  language: en
  text: One day Jonathan, Saul’s son, said to the young man carrying his armor, “Come. Let’s cross over to the Philistine military outpost[a] on the other side[b].” Jonathan did not tell his father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Philistine garrison.” The Hebrew can mean a military post or the force stationed there.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “on the other side,” probably referring to the pass described in the following verses.
    reason: cultural_note
