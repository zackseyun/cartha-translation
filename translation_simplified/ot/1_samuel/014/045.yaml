translation:
  language: en
  text: But the people said to Saul, “Should Jonathan die? He brought about this great deliverance in Israel! Absolutely not! As Yahweh lives, not a single hair of his head will fall to the ground, because he has worked with God today.” So the people secured Jonathan’s release,[a] and he did not die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also be translated “redeemed” or “ransomed”; it describes securing Jonathan’s release from the sentence against him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Should Jonathan die, who has brought about this great deliverance in Israel?
  simplified_phrase: Should Jonathan die? He brought about this great deliverance in Israel!
  preserved_meaning: The people indignantly protest Jonathan’s death because of the great deliverance he brought about.
  reasoning_layer_used: Lexical decision for the rhetorical question and immediate syntax.
  rationale: Two direct sentences make the protest easier to follow without weakening it.
- pob_phrase: Far from it!
  simplified_phrase: Absolutely not!
  preserved_meaning: The people strongly reject the idea that Jonathan should die.
  reasoning_layer_used: Lexical decision for חָלִילָה.
  rationale: The modern expression preserves the force of the Hebrew repudiation.
- pob_phrase: the people redeemed Jonathan
  simplified_phrase: the people secured Jonathan’s release
  preserved_meaning: The people freed Jonathan from the claim or sentence that threatened his life.
  reasoning_layer_used: Lexical decision for פדה and its legal-deliverance nuance.
  rationale: The wording explains the action plainly while the footnote retains the redemption language.
translation_notes:
