    text: Or, “outpost.”
    reason: lexical_alternative
  - marker: b
    text: An armor-bearer was a man who carried a warrior’s weapons and equipment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: answered Jonathan and his armor-bearer and said
  simplified_phrase: replied to Jonathan and his armor-bearer
  preserved_meaning: The men responded directly to Jonathan and his companion.
  reasoning_layer_used: applied revision and Hebrew narrative syntax
  rationale: “Replied” removes the redundant English wording without losing the response.
- pob_phrase: Come up after me
  simplified_phrase: Follow me up
  preserved_meaning: The armor-bearer is to follow Jonathan as they climb.
  reasoning_layer_used: lexical decision for עֲלֵה אַחֲרַי
  rationale: The new order states both following and upward movement naturally.
- pob_phrase: has given them into the hand of Israel
  simplified_phrase: has handed them over to Israel
  preserved_meaning: Yahweh has placed the enemy under Israel’s power in battle.
  reasoning_layer_used: lexical decision for נתן and Hebrew hand idiom
  rationale: “Handed them over” makes the battle idiom clear while retaining its hand image.
translation_notes:
  risk_flags:
