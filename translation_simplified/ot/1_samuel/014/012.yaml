translation:
  language: en
  text: The men in the garrison[a] replied to Jonathan and his armor-bearer,[b] “Come up here to us, and we will tell you something.” Jonathan told his armor-bearer, “Follow me up, because Yahweh has handed them over to Israel.”
  philosophy: optimal-equivalence
  footnotes:
