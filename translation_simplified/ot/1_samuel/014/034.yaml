translation:
  language: en
  text: Saul said, “Spread out among the people and tell them, ‘Everyone must bring me his own ox and his own sheep. Slaughter the animals here, and then eat them. In this way you will not sin against Yahweh by eating meat while its blood is still in it.’” So that night everyone brought his own ox[a], and they slaughtered the animals there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “each man his ox in his hand.” This may mean that each person personally brought his ox, or that he led it by hand.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Each man must bring me his ox and each man his sheep
  simplified_phrase: Everyone must bring me his own ox and his own sheep
  preserved_meaning: The command distributes both kinds of animal to each person without turning them into alternatives.
  reasoning_layer_used: POB lexical decision on repeated אִישׁ and waw coordination
  rationale: The repetition becomes natural English while the coordinated ox-and-sheep wording remains.
- pob_phrase: you must slaughter them here and eat
  simplified_phrase: Slaughter the animals here, and then eat them
  preserved_meaning: The animals were to be slaughtered at that place before they were eaten.
  reasoning_layer_used: POB lexical decisions for שׁחט, בָּזֶה, and the sequential command
  rationale: Naming the animals and adding “then” makes the required sequence clear.
- pob_phrase: each man his ox in his hand that night
  simplified_phrase: that night everyone brought his own ox[a]
  preserved_meaning: Each person brought his own ox that night, while the manner of bringing it remains uncertain.
  reasoning_layer_used: POB lexical decision and footnote for בְיָדוֹ
  rationale: The main text avoids asserting one disputed image, and the footnote preserves both readings.
