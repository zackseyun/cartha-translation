  preserved_meaning: The plundering is to continue until daylight appears.
  reasoning_layer_used: POB lexical decision for עַד אוֹר הַבֹּקֶר
  rationale: The shorter phrase keeps the source image of morning light.
- pob_phrase: Do whatever seems good in your eyes
