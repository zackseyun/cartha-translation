translation:
  language: en
  text: 'Then Saul said, “Let us go down during the night and pursue the Philistines. Let us plunder them until morning light and not leave a single man among them.”


    They replied, “Do whatever you think is best.”


    But the priest said, “Let us approach God here.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Approaching God here likely means seeking his guidance, though the Hebrew does not specify the act.
    reason: lexical_alternative
