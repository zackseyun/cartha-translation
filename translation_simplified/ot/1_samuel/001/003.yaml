translation:
  language: en
  text: Every year, that man went up from his city to Shiloh to worship and offer sacrifices to Yahweh of Armies.[a] Eli’s two sons, Hophni and Phinehas, served there as priests of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more traditionally, “the LORD of Hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: used to go up from his city year after year
  simplified_phrase: Every year, that man went up from his city
  preserved_meaning: Elkanah repeatedly made this journey each year, and the upward pilgrimage image remains.
  reasoning_layer_used: Lexical decisions for וְעָלָה and מִיָּמִים יָמִימָה
  rationale: Moving “every year” forward makes the habitual action immediately clear.
- pob_phrase: to worship and to sacrifice
  simplified_phrase: to worship and offer sacrifices
  preserved_meaning: The journey had the two distinct purposes of worship and sacrificial offering.
  reasoning_layer_used: Lexical decisions for לְהִשְׁתַּחֲוֺת and וְלִזְבֹּחַ
  rationale: “Offer sacrifices” states the ritual action more naturally without merging it with worship.
- pob_phrase: the two sons of Eli, Hophni and Phinehas, were there as priests of Yahweh
  simplified_phrase: Eli’s two sons, Hophni and Phinehas, served there as priests of Yahweh
  preserved_meaning: Both named sons held the priestly office at Shiloh in service to Yahweh.
  reasoning_layer_used: Lexical decisions for שְׁנֵי בְנֵי עֵלִי, וְשָׁם, and כֹּהֲנִים לַיהוָה
  rationale: The possessive form and active verb produce a shorter, more natural sentence.
