translation:
  language: en
  text: But Hannah did not go up to the sanctuary. She told her husband, “I will not bring the boy until he is weaned. Then I will bring him so that he may appear before Yahweh[a] and stay there in his service for the rest of his life.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Another possible reading, reflected in some textual traditions, is: “Then I will appear before Yahweh, and he will stay there for the rest of his life.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: did not go up
  simplified_phrase: did not go up to the sanctuary
  preserved_meaning: Hannah did not make the journey to the sanctuary at Shiloh.
  reasoning_layer_used: POB lexical rationale and narrative context
  rationale: Naming the destination clarifies the biblical travel expression while retaining “go up.”
- pob_phrase: Not until the boy is weaned will I bring him
  simplified_phrase: I will not bring the boy until he is weaned. Then I will bring him
  preserved_meaning: Hannah postpones bringing Samuel until after he is weaned.
  reasoning_layer_used: POB lexical decision and applied revisions
  rationale: Two direct sentences preserve the force of “not until” in more natural English.
- pob_phrase: stay there forever
  simplified_phrase: stay there in his service for the rest of his life
  preserved_meaning: Samuel will be permanently dedicated to Yahweh’s sanctuary service throughout his life.
  reasoning_layer_used: POB cultural note and lexical rationale
  rationale: The wording states the intended lifelong duration instead of suggesting endless earthly residence.
