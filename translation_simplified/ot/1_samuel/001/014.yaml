translation:
  language: en
  text: Then Eli said to her, “How long will you be drunk?[a] Put your wine away.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “How long will you become drunk?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Eli said to her
  simplified_phrase: Then Eli said to her
  preserved_meaning: Eli now speaks directly to Hannah as the narrative moves forward.
  reasoning_layer_used: The lexical decision permits “Then” as a natural narrative transition.
  rationale: “Then” makes the sequence clear in ordinary English.
- pob_phrase: How long will you be drunk?
  simplified_phrase: How long will you be drunk?
  preserved_meaning: Eli accuses Hannah of drunkenness without settling whether the verb describes becoming drunk or remaining drunk.
  reasoning_layer_used: The POB text and lexical footnote preserve both possible senses of the Hebrew verb.
  rationale: The simpler stative wording avoids making repeated voluntary drinking definitive.
- pob_phrase: Put away your wine from you
  simplified_phrase: Put your wine away
  preserved_meaning: Eli commands her to remove the wine from herself, whether from her presence or its apparent influence.
  reasoning_layer_used: The lexical rationale allows removal from her person or presence without requiring disposal.
  rationale: This is natural English and does not imply permanently discarding the wine.
translation_notes:
  risk_flags:
  - risk: “Put your wine away” does not reproduce the literal image “from upon you.”
    mitigation: It preserves the command to remove the wine without choosing between physical presence and influence.
