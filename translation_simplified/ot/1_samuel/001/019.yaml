  preserved_meaning: The Hebrew modestly refers to marital sexual relations.
  reasoning_layer_used: Theological decision on the sexual euphemism
  rationale: The main text keeps the source image and register, while the footnote makes its meaning clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “knew” to mean ordinary acquaintance.
    mitigation: A footnote immediately explains the Hebrew marital euphemism.
  - risk: Modern readers may think Yahweh had previously forgotten Hannah.
    mitigation: A footnote explains that divine remembrance implies faithful and effective regard without stating the later outcome.
