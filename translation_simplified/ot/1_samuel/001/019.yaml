translation:
  language: en
  text: Early in the morning, they got up and bowed down before Yahweh. Then they went back home to Ramah. Elkanah knew Hannah, his wife,[a] and Yahweh remembered her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “knew” is a Hebrew way of saying that a husband and wife had sexual relations.
    reason: lexical_alternative
  - marker: b
    text: Here “remembered” means more than recalling her; Yahweh turned toward her with faithful concern that would lead to action.
    reason: simplification_note
simplification_decisions:
- pob_phrase: They rose early in the morning
  simplified_phrase: Early in the morning, they got up
  preserved_meaning: They began the day early.
  reasoning_layer_used: Lexical decision for וַיַּשְׁכִּמוּ and בַבֹּקֶר
  rationale: “Got up” is more common than “rose” while retaining the emphasis on early morning.
- pob_phrase: Then they returned and came to their house at Ramah
  simplified_phrase: Then they went back home to Ramah
  preserved_meaning: They returned to their home in Ramah.
  reasoning_layer_used: Lexical decisions for וַיָּשֻׁבוּ and וַיָּבֹאוּ אֶל בֵּיתָם הָרָמָתָה
  rationale: The shorter wording removes redundant movement language without changing their destination.
- pob_phrase: Elkanah knew Hannah his wife
