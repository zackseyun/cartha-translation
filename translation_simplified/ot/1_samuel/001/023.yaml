translation:
  language: en
  text: Elqanah, her husband, said to her, “Do what you think is best. Stay until you have weaned him. But may Yahweh establish his word.”[a] So she stayed and nursed her son until she had weaned him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Establish” may also mean “confirm” or “fulfill.” “His word” may refer either to Yahweh’s promise or to the matter just spoken about.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do what seems good in your eyes
  simplified_phrase: Do what you think is best
  preserved_meaning: Elqanah tells Hannah to act according to her own judgment.
  reasoning_layer_used: Lexical decision for the Hebrew idiom
  rationale: Natural English communicates the idiom without its unfamiliar image.
- pob_phrase: only may Yahweh establish his word
  simplified_phrase: But may Yahweh establish his word
  preserved_meaning: Elqanah qualifies his permission with a wish or prayer concerning Yahweh’s word.
  reasoning_layer_used: Lexical decisions for אַךְ and יָקֵם
  rationale: “But” marks the qualification, while “may” preserves the prayer-like force.
- pob_phrase: the woman stayed and nursed her son until she had weaned him
  simplified_phrase: she stayed and nursed her son until she had weaned him
  preserved_meaning: Hannah remained with her son, nursed him, and personally weaned him.
  reasoning_layer_used: Lexical decisions for הָאִשָּׁה, וַתֵּינֶק, and גָּמְלָהּ
  rationale: The pronoun improves flow while the active clause retains Hannah’s explicit agency.
translation_notes:
  risk_flags:
  - risk: Readers may assume “his word” refers only to a specific divine promise.
    mitigation: The footnote preserves the documented ambiguity about its reference.
