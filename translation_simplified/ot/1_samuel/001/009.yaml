translation:
  language: en
  text: After they finished eating and drinking in Shiloh, Hannah got up. Eli the priest was sitting on a seat beside the doorpost of Yahweh’s temple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh’s sanctuary.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After they had eaten in Shiloh, and after they had drunk
  simplified_phrase: After they finished eating and drinking in Shiloh
  preserved_meaning: The family meal had ended before Hannah acted, and both eating and drinking remain explicit.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Combining the parallel time clauses makes the sequence easier to follow without changing their likely collective subject.
- pob_phrase: Hannah rose
  simplified_phrase: Hannah got up
  preserved_meaning: Hannah rose from her place to act.
  reasoning_layer_used: POB lexical decision for וַתָּקָם
  rationale: “Got up” is common modern English and is already documented as a valid lexical alternative.
- pob_phrase: by the doorpost of the temple of Yahweh
  simplified_phrase: beside the doorpost of Yahweh’s temple
  preserved_meaning: Eli was positioned near the entrance post of the sacred building belonging to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The possessive form and “beside” make the location natural in English while retaining “temple” and the divine name.
translation_notes:
  risk_flags:
  - risk: “Temple” may suggest the later Jerusalem temple rather than the shrine at Shiloh.
    mitigation: The footnote preserves “sanctuary” as the documented lexical alternative.
  - risk: Combining the two temporal clauses may reduce their formal parallelism.
    mitigation: Both eating and drinking remain distinct actions completed before Hannah got up.
