  preserved_meaning: Hannah asks Yahweh to attend to her distress while calling herself his female servant.
  reasoning_layer_used: POB lexical decisions for affliction and female servant
  rationale: The abstract phrase becomes a direct statement of suffering without narrowing its cause.
- pob_phrase: all the days of his life
  simplified_phrase: for his whole life
  preserved_meaning: The child will belong to Yahweh for his entire lifetime.
  reasoning_layer_used: POB lexical decision for כָּל יְמֵי חַיָּיו
  rationale: The duration remains total but is stated in ordinary English.
- pob_phrase: no razor shall come upon his head
  simplified_phrase: No razor will ever touch his head
  preserved_meaning: Her vow includes a lifelong prohibition against cutting his hair with a razor.
  reasoning_layer_used: POB lexical and theological decisions on the razor restriction
