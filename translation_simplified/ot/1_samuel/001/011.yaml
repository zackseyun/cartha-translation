translation:
  language: en
  text: 'She made this vow: “Yahweh of Heaven’s Armies, if you will truly see how I, your female servant, am suffering, remember me and do not forget me, and give me a male child, then I will give him to Yahweh for his whole life. No razor will ever touch his head.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This hair restriction echoes the special consecration associated with a Nazirite vow, though the verse does not call him a Nazirite.
    reason: cultural_note
