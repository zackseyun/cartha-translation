translation:
  language: en
  text: Then Hannah’s husband, Elkanah, asked her, “Hannah, why are you crying? Why aren’t you eating? Why is your heart troubled?[a] Am I not worth more to you than ten sons?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Why is your heart sad?” The Hebrew literally says, “Why is your heart bad?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Elkanah her husband said to her
  simplified_phrase: Then Hannah’s husband, Elkanah, asked her
  preserved_meaning: Elkanah, identified as Hannah’s husband, speaks next in the narrative.
  reasoning_layer_used: POB lexical decisions for וַיֹּאמֶר and אֶלְקָנָה אִישָׁהּ
  rationale: The reordered identification and “asked” introduce the questions in natural English.
- pob_phrase: why are you weeping? And why do you not eat?
  simplified_phrase: why are you crying? Why aren’t you eating?
  preserved_meaning: Elkanah asks about Hannah’s ongoing tears and present refusal to eat.
  reasoning_layer_used: POB lexical decisions for תִבְכִּי, לֹא תֹאכְלִי, and repeated לָמֶה
  rationale: Common progressive wording keeps the two repeated questions clear and distinct.
- pob_phrase: Am I not better to you than ten sons?
  simplified_phrase: Am I not worth more to you than ten sons?
  preserved_meaning: Elkanah claims that his value to Hannah exceeds that of many sons.
  reasoning_layer_used: POB lexical decision for טוֹב לָךְ and theological decision for בָּנִים
  rationale: “Worth more to you” states the personal comparison naturally while retaining “sons.”
translation_notes:
  risk_flags:
  - risk: “Worth more” could sound economic to some readers.
    mitigation: “To you” and the family context indicate personal rather than monetary value.
