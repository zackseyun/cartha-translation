translation:
  language: en
  text: David asked him, “Will you lead me down to this raiding party?[a]” The man replied, “Swear to me by God that you will not kill me or hand me over to my master. Then I will lead you down to them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “band” or “troop”; the Hebrew means a group that goes out to raid.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: David said to him
  simplified_phrase: David asked him
  preserved_meaning: David directly asks the man to guide him.
  reasoning_layer_used: Immediate syntax and context
  rationale: “Asked” naturally introduces the question that follows.
- pob_phrase: hand me over into the hand of my master
  simplified_phrase: hand me over to my master
  preserved_meaning: The man fears being returned to his master’s power.
  reasoning_layer_used: POB lexical decision for תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  rationale: The English phrase “hand me over” already conveys transfer into another person’s control.
- pob_phrase: and I will lead you down to this raiding party
  simplified_phrase: Then I will lead you down to them
  preserved_meaning: He promises to guide David to the same raiding party if David takes the oath.
  reasoning_layer_used: Immediate discourse context and repeated Hiphil of ירד
  rationale: “Then” clarifies the condition, while “them” avoids an unnecessary repeated phrase.
translation_notes:
  risk_flags:
  - risk: Replacing “into the hand of” may reduce the visible Hebrew image of power and control.
    mitigation: The idiom “hand me over” retains the sense of being transferred into the master’s power.
