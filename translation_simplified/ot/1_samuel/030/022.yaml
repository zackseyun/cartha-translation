translation:
  language: en
  text: Then all the wicked and worthless men who had gone with David said, “They did not go with me, so we will not share any of the plunder we recovered with them. Each man may take only his wife and children and leave.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “with me,” although the speakers speak as a group.
    reason: source_note
simplification_decisions:
- pob_phrase: every wicked and worthless man from among the men who had gone with David answered and said
  simplified_phrase: all the wicked and worthless men who had gone with David said
  preserved_meaning: The speakers are the morally condemned members of David’s company.
  reasoning_layer_used: POB lexical decisions for the partitive phrase and for ra‘ and beliyyaal
  rationale: The shorter sentence removes a redundant speech formula while retaining both negative descriptions.
- pob_phrase: we will not give them any of the spoil that we recovered
  simplified_phrase: we will not share any of the plunder we recovered with them
  preserved_meaning: The men refuse to give the others any portion of the recovered war goods.
  reasoning_layer_used: POB lexical decisions for shalal and the recovered goods
  rationale: “Share the plunder” states the distribution dispute in familiar modern English.
- pob_phrase: except that each man may take his wife and his children and lead them away and go
  simplified_phrase: Each man may take only his wife and children and leave
  preserved_meaning: Their sole concession is that each man may depart with his recovered family.
  reasoning_layer_used: POB lexical decisions for the exclusive idiom, family terms, and both departure verbs
  rationale: “Only” preserves the strict exception, while “take … and leave” naturally compresses the two departure verbs.
