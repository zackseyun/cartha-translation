  reasoning_layer_used: POB lexical decision for וַיָּבֹא
  rationale: “After” and “arrived” make the narrative sequence immediately clear.
- pob_phrase: he sent some of the plunder to the elders of Judah, his friends
  simplified_phrase: he sent part of the plunder to the elders of Judah, who were his friends
  preserved_meaning: David sent only a portion to Judah’s elders, whom the text identifies as his friends.
  reasoning_layer_used: POB lexical decisions for וַיְשַׁלַּח מֵהַשָּׁלָל, לְזִקְנֵי יְהוּדָה, and לְרֵעֵהוּ
  rationale: “Part” clarifies the portion, while “who were” clearly links the elders with his friends.
- pob_phrase: saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh”
  simplified_phrase: He told them, “Here is a gift for you from the plunder taken from Yahweh’s enemies”
  preserved_meaning: David gives captured enemy goods while identifying the defeated people as Yahweh’s enemies.
  reasoning_layer_used: POB lexical and theological decisions for בְּרָכָה, שָׁלָל, and יְהוָה
  rationale: A separate speech sentence is easier to follow, and the wording avoids adding an unsupported first-person subject.
