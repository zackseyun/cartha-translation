translation:
  language: en
  text: After David arrived in Ziklag, he sent part of the plunder to the elders of Judah, who were his friends. He told them, “Here is a gift[a] for you from the plunder taken from Yahweh’s enemies.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a blessing for you.” The Hebrew word means “blessing” but here refers to a material gift.
    reason: lexical_alternative
