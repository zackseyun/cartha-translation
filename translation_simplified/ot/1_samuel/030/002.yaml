translation:
  language: en
  text: They took all the women in the city captive.[a] They did not kill anyone. They led the captives away and continued on their journey.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “from small to great,” an idiom emphasizing the whole group of women, whether the distinction concerns age, status, or something else.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the women who were in it, from small to great
  simplified_phrase: all the women in the city captive
  preserved_meaning: The women throughout the stated group were taken captive without exception.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר בָּהּ and מִקָּטֹן וְעַד גָּדוֹל
  rationale: Naming the city and saying “all” clarifies both the referent and the idiom’s inclusive force.
- pob_phrase: led them away
  simplified_phrase: led the captives away
  preserved_meaning: The women were forcibly taken away as captives.
  reasoning_layer_used: Lexical decision for וַיִּנְהֲגוּ
  rationale: Repeating “the captives” removes an unclear pronoun.
- pob_phrase: went on their way
  simplified_phrase: continued on their journey
  preserved_meaning: The captors departed and continued on their course.
  reasoning_layer_used: Lexical decision for וַיֵּלְכוּ לְדַרְכָּם
  rationale: This expresses the Hebrew idiom in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: Rendering “from small to great” as “all” could hide whether the distinction concerns age or status.
    mitigation: The footnote preserves the idiom’s range while limiting its inclusive force to the women in view.
