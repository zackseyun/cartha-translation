  simplified_phrase: who had been too exhausted to keep following him
  preserved_meaning: The men were unable to continue accompanying David because they were exhausted.
  reasoning_layer_used: POB lexical decision for פִּגְּרוּ and מִלֶּכֶת אַחֲרֵי דָוִד
  rationale: “Keep following him” expresses continued travel in natural English.
- pob_phrase: and whom they had left at the Brook Besor
  simplified_phrase: His group had left them at the Brook Besor
  preserved_meaning: David’s party left the exhausted men at the brook while the others continued.
  reasoning_layer_used: POB lexical decision for וַיֹּשִׁיבֻם
  rationale: A separate sentence removes the difficult relative clause and clarifies the pronouns.
- pob_phrase: David approached the people and asked them how they were
  simplified_phrase: David approached them and asked how they were
  preserved_meaning: David drew near and then inquired about their well-being.
  reasoning_layer_used: POB lexical decisions for וַיִּגַּשׁ and וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  rationale: The wording stays natural while preserving approaching and asking as distinct actions.
