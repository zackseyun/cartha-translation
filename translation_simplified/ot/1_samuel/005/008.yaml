translation:
  language: en
  text: So they sent for all the Philistine lords and brought them together. They asked, “What should we do with the ark of the God of Israel?” They said, “Move the ark of the God of Israel to Gath.” So they moved it to Gath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb emphasizes moving the ark from place to place; it can also be translated “made the ark go around to Gath.”
    reason: lexical_alternative
