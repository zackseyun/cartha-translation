translation:
  language: en
  text: So they called together all the Philistine rulers and said, “Send away the ark of the God of Israel. Let it return to its place, so that it may not kill me and my people.” The whole city was in a deadly panic. God’s hand was very heavy there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God’s heavy hand is an image of his powerful judgment.
    reason: simplification_note
simplification_decisions:
- pob_phrase: sent and gathered all the lords of the Philistines
  simplified_phrase: called together all the Philistine rulers
  preserved_meaning: They summoned all the recognized Philistine authorities.
  reasoning_layer_used: Lexical decision for סַרְנֵי and immediate context
  rationale: “Called together” states the action naturally, while “rulers” clearly conveys their political rank.
- pob_phrase: and let it return to its place
  simplified_phrase: Let it return to its place
  preserved_meaning: They wanted the ark sent back to its proper location.
  reasoning_layer_used: Lexical decision for וְיָשֹׁב לִמְקֹמוֹ
  rationale: A separate sentence makes the command easier to follow without changing its force.
- pob_phrase: For there was a deadly panic throughout the whole city
  simplified_phrase: The whole city was in a deadly panic
  preserved_meaning: Lethal terror and turmoil affected the entire city.
  reasoning_layer_used: Lexical decisions for מְהוּמַת מָוֶת and בְּכָל הָעִיר
  rationale: The recast sentence expresses the citywide crisis directly without adding a process of spreading.
translation_notes:
  risk_flags:
  - risk: The plural speakers are followed by the singular phrase “me and my people.”
    mitigation: The singular is retained because the Hebrew likely presents a representative ruler speaking.
  - risk: Modern readers may not understand the image of God’s heavy hand.
    mitigation: The main text preserves the biblical metaphor, and the footnote explains it as powerful judgment.
