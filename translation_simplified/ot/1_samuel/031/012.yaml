translation:
  language: en
  text: Then all the brave fighting men set out and traveled through the night. They took Saul’s body and the bodies of his sons from the wall of Beth-shan. They went to Jabesh[a] and burned the bodies there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is Jabesh-gilead.
    reason: cross_reference
