  reasoning_layer_used: Lexical decisions for שְׁלֹף, דקר, and פֶּן
  rationale: Common wording and two sentences make the command and warning immediately clear.
- pob_phrase: was not willing, because he was very afraid
  simplified_phrase: refused because he was very afraid
  preserved_meaning: Fear caused the armor-bearer to reject Saul’s command.
  reasoning_layer_used: Lexical decisions for וְלֹא אָבָה and כִּי יָרֵא מְאֹד
  rationale: “Refused” is concise, while “very afraid” preserves the source’s calibrated degree of fear.
