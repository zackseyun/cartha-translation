translation:
  language: en
  text: Saul said to his armor-bearer, “Pull out your sword and run me through with it. Otherwise, these uncircumcised men[a] will come, run me through, and abuse me.[b]” But his armor-bearer refused because he was very afraid. So Saul took the sword and fell on it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uncircumcised men” is a contemptuous covenant-related description; the Philistines are in view here.
    reason: cultural_note
  - marker: b
    text: Or “make sport of me,” “mistreat me,” or “deal shamefully with me”; the exact kind of abuse is not stated.
    reason: lexical_alternative
