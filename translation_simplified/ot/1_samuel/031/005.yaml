translation:
  language: en
  text: When the man who carried Saul’s armor saw that Saul was dead[a], he too fell on his own sword and died with Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had died.” The Hebrew can describe Saul as dead or present his death as the completed event that led to the armor-bearer’s action.
    reason: lexical_alternative
