translation:
  language: en
  text: Saul sent messengers to capture David. When they saw a group of prophets prophesying, with Samuel standing over them,[a] the Spirit of God came upon Saul’s messengers, and they too prophesied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “standing among them”; the Hebrew may also suggest that Samuel held a leading role.
    reason: lexical_alternative
