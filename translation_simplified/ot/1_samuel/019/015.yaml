translation:
  language: en
  text: Then Saul sent his messengers to check on David. He ordered them, “Carry him to me in the bed[a], so I can put him to death.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the bed” or “with the bed.” The Hebrew can be understood in more than one way, but Saul probably meant for David to be carried while he lay there.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent the messengers to see David
  simplified_phrase: sent his messengers to check on David
  preserved_meaning: Saul dispatched his men to verify David’s presence or condition.
  reasoning_layer_used: The lexical rationale notes that “to see” likely means to check on or verify David.
  rationale: “Check on” makes the contextual sense clear in ordinary English.
- pob_phrase: saying
  simplified_phrase: He ordered them
  preserved_meaning: Saul introduced a direct royal command to the messengers.
  reasoning_layer_used: The lexical alternatives include “with orders” and “telling them.”
  rationale: A separate sentence makes the command easier to follow.
- pob_phrase: Bring him up to me in the bed
  simplified_phrase: Carry him to me in the bed
  preserved_meaning: Saul wanted David transported into his presence while still lying in the bed.
  reasoning_layer_used: The lexical rationale permits “carry ... up” and retains the bed-transport image.
  rationale: “Carry” avoids suggesting that a bedridden David should walk.
