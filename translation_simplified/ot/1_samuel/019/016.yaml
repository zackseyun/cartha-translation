translation:
  language: en
  text: When the messengers came in, they found the teraphim[a] lying in the bed, with a goat-hair quilt[b] at its head.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A teraphim was a household image used in worship, often understood as a household idol.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word translated “quilt” may refer more generally to a woven covering.
    reason: lexical_alternative
