translation:
  language: en
  text: Then an evil spirit from Yahweh came upon Saul.[a] Saul was sitting in his house with his spear in his hand, while David was playing the lyre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a harmful spirit from Yahweh”; the Hebrew can mean evil, harmful, or distressing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says only that David was “playing with his hand”; the surrounding context identifies the instrument as a lyre.
    reason: source_note
