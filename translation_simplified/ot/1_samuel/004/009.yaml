translation:
  language: en
  text: Be strong, Philistines! Show yourselves to be men,[a] or you will become servants to the Hebrews, just as they have been servants to you. Show yourselves to be men, and fight!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is a gendered call to show courage in battle; it can also be translated “act like men.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Be strong and be men, O Philistines
  simplified_phrase: Be strong, Philistines! Show yourselves to be men
  preserved_meaning: The warriors are directly called to strength and manly courage.
  reasoning_layer_used: POB lexical and theological decisions on הִתְחַזְּקוּ and לַאֲנָשִׁים
  rationale: Two direct commands make the battle speech clearer while preserving its gendered force.
- pob_phrase: lest you become slaves to the Hebrews
  simplified_phrase: or you will become slaves to the Hebrews
  preserved_meaning: Defeat would bring forced subjection to the Hebrews.
  reasoning_layer_used: POB lexical decision on פֶּן and military use of עבד
  rationale: The common warning form “or you will” replaces the less familiar “lest.”
- pob_phrase: as they have been to you
  simplified_phrase: just as they have been slaves to you
  preserved_meaning: The Hebrews had previously lived under Philistine subjection.
  reasoning_layer_used: POB lexical decision and supplied fuller alternative for כַּאֲשֶׁר עָבְדוּ לָכֶם
  rationale: Repeating “slaves” makes the comparison immediately clear.
