  language: en
  text: When the people came to the camp, Israel’s elders said, “Why has Yahweh struck us down today in our battle with the Philistines? Let us bring the ark of Yahweh’s covenant here from Shiloh, so that it[a] may come among us and save us from the grasp of our enemies.”
