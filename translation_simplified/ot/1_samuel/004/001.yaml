translation:
  language: en
  text: Samuel’s word reached all Israel.[a] Then the Israelites went out to meet the Philistines in battle. The Israelites camped at Ebenezer,[b] while the Philistines camped at Aphek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The report about Samuel reached all Israel.” In context, the Hebrew most likely refers to Samuel’s prophetic word.
    reason: alternative_reading
  - marker: b
    text: Ebenezer means “stone of help”; here it is the name of a place.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the word of Samuel came to all Israel
  simplified_phrase: Samuel’s word reached all Israel
  preserved_meaning: Samuel’s prophetic word became known throughout the whole people of Israel.
  reasoning_layer_used: POB lexical and theological decisions on דְבַר שְׁמוּאֵל
  rationale: The active wording is easier to understand while retaining “word” and its prophetic connection.
- pob_phrase: Israel went out
  simplified_phrase: the Israelites went out
  preserved_meaning: The people of Israel moved out for a military encounter.
  reasoning_layer_used: POB lexical decision on וַיֵּצֵא יִשְׂרָאֵל
  rationale: Naming the people as “the Israelites” prevents readers from mistaking Israel for an individual.
- pob_phrase: and they camped at Ebenezer
  simplified_phrase: The Israelites camped at Ebenezer
  preserved_meaning: Israel’s forces camped at the place named Ebenezer.
  reasoning_layer_used: POB lexical decisions on וַיַּחֲנוּ and עַל הָאֶבֶן הָעֵזֶר
  rationale: Repeating the subject removes an unclear pronoun without changing the military setting.
