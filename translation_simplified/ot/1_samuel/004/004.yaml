translation:
  language: en
  text: So the people sent for the covenant ark at Shiloh and carried it from there. It was the ark of the covenant of Yahweh of hosts,[a] who is enthroned above the cherubim.[b] Eli’s two sons, Hophni and Phinehas, were there with God’s covenant ark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and can include the armies of heaven.
    reason: simplification_note
  - marker: b
    text: Or “is enthroned between the cherubim.”
    reason: alternative_reading
