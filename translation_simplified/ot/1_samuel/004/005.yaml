translation:
  language: en
  text: When the sacred chest of Yahweh’s covenant entered the camp, all Israel let out a mighty shout that made the earth resound.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the earth shook.” The Hebrew may describe either the tremendous noise or the ground trembling.
    reason: lexical_alternative
