- pob_phrase: were afraid
  simplified_phrase: became afraid
  preserved_meaning: Their fear arose as an immediate reaction.
  reasoning_layer_used: lexical decision for וַיִּרְאוּ
  rationale: “Became afraid” clearly presents their immediate change of emotion.
- pob_phrase: Woe to us!
  simplified_phrase: This is terrible for us!
  preserved_meaning: They cry out in grave distress without declaring their destruction certain.
  reasoning_layer_used: lexical decision for א֣וֹי לָנוּ and grounding review
  rationale: The wording communicates calamity without overstating the lament.
- pob_phrase: For nothing like this has happened before.
  simplified_phrase: Nothing like this has ever happened before.
  preserved_meaning: They regard the event as unprecedented.
  reasoning_layer_used: lexical decisions for לֹא הָיְתָה כָּזֹאת and אֶתְמוֹל שִׁלְשֹׁם
  rationale: “Ever” expresses the Hebrew idiom’s time sense in natural English.
