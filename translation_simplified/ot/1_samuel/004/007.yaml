translation:
  language: en
  text: The Philistines became afraid because they said, “God[a] has come into the camp!” Then they cried, “This is terrible for us! Nothing like this has ever happened before.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a god has come into the camp,” or possibly, “gods have come into the camp.” The Hebrew noun has a plural form, but its verb is singular, supporting “God” in the main text.
