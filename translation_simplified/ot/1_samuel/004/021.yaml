translation:
  language: en
  text: She named the boy Ichabod.[a] She said, “The glory has left Israel.” She gave him this name because the ark of God had been captured and because her father-in-law and her husband had died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name Ichabod may mean “no glory” or “where is the glory?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying, “The glory has departed from Israel,”
  simplified_phrase: She said, “The glory has left Israel.”
  preserved_meaning: Israel’s glory is now gone, without defining whether this is God’s presence, Israel’s honor, or both.
  reasoning_layer_used: lexical and theological decisions
  rationale: A separate sentence and the common verb “left” make the statement easier to grasp while preserving its ambiguity.
- pob_phrase: because the ark of God had been taken
  simplified_phrase: because the ark of God had been captured
  preserved_meaning: The enemy had seized the ark of God.
  reasoning_layer_used: lexical decision and narrative context
  rationale: “Captured” clearly expresses what “taken” means in this battle account.
- pob_phrase: and because of her father-in-law and her husband
  simplified_phrase: and because her father-in-law and her husband had died
  preserved_meaning: Their deaths were also grounds for giving the boy this name.
  reasoning_layer_used: immediate narrative context
  rationale: Naming their fate directly removes an opaque causal phrase.
interpretive_expansions:
- pob_phrase: because of her father-in-law and her husband
  rendering: because her father-in-law and her husband had died
  claim: The phrase refers to the deaths of Eli and Phinehas.
  evidence:
  - The preceding narrative reports that both men died before the child was named.
  confidence: high
