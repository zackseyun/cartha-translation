translation:
  language: en
  text: The messenger replied, “Israel has fled from the Philistines. There has been a terrible slaughter among the people.[a] Your two sons, Hophni and Phinehas, are dead. And the ark of God has been taken.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the people have suffered a terrible defeat.” The Hebrew can refer to a severe blow, plague, or slaughter; the battle context favors “slaughter.”
    reason: lexical_alternative
  - marker: b
    text: Or, “the ark of God has been captured.”
    reason: lexical_alternative
