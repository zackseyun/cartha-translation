translation:
  language: en
  text: But the people refused to listen to Samuel[a]. They said, “No! We will have a king over us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “listen to” also carries the sense of heeding or obeying Samuel.
