translation:
  language: en
  text: We want a king so that we too can be like all the other nations.[a] Our king will judge us,[b] march at our head, and fight our battles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Then we too will be like all the nations.” The Hebrew can describe either their purpose or the expected result.
    reason: lexical_alternative
  - marker: b
    text: Here “judge” also includes governing and administering justice.
    reason: lexical_alternative
