- pob_phrase: encamped against Jabesh-gilead
  simplified_phrase: set up camp against Jabesh-gilead
  preserved_meaning: Nahash established a military camp against the town without necessarily beginning a siege.
  reasoning_layer_used: POB lexical decision for וַיִּחַן עַל
  rationale: “Set up camp” expresses the military action in more familiar English without strengthening it to “laid siege.”
- pob_phrase: said to Nahash
  simplified_phrase: said to him
  preserved_meaning: The men addressed Nahash directly.
  reasoning_layer_used: Immediate narrative context
  rationale: The pronoun avoids needless repetition because Nahash is the only possible referent.
- pob_phrase: Make a covenant with us
  simplified_phrase: Make a covenant with us
  preserved_meaning: They asked Nahash to enter a binding covenant with them.
  reasoning_layer_used: POB lexical decision for כְּרָת לָנוּ בְרִית
  rationale: The key biblical term “covenant” is retained, while the footnote preserves the Hebrew image “cut a covenant.”
