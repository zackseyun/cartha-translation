translation:
  language: en
  text: Then the people said to Samuel, “Who said, ‘Will Saul rule as king over us?’[a] Hand those men over, and we will put them to death.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Saul will rule as king over us.” The Hebrew may be a question or, less likely here, a statement.
