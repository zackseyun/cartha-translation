simplification_decisions:
- pob_phrase: Who is it that said
  simplified_phrase: Who said
  preserved_meaning: The people demand that those who opposed Saul be identified.
  reasoning_layer_used: Lexical decision for מִי הָאֹמֵר
  rationale: The shorter question is natural English and keeps the demand for identification.
- pob_phrase: Shall Saul reign over us?
  simplified_phrase: Will Saul rule as king over us?
  preserved_meaning: The earlier speakers questioned Saul’s royal authority over them.
  reasoning_layer_used: Lexical decision for שָׁאוּל יִמְלֹךְ עָלֵינוּ
  rationale: “Rule as king” explains the royal sense of “reign” in common language.
- pob_phrase: Hand over the men
  simplified_phrase: Hand those men over
  preserved_meaning: The people demand that the identified dissenters be surrendered for judgment.
  reasoning_layer_used: Lexical decisions for תְּנוּ and הָאֲנָשִׁים
  rationale: “Those men” clearly points back to the men whose identity they are demanding.
