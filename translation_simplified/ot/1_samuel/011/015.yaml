  text: Then all the people went to Gilgal. There, in Yahweh’s presence, they made Saul king. They also sacrificed peace offerings before Yahweh.[a] Saul and all the men of Israel celebrated there with great joy.
  philosophy: optimal-equivalence
  footnotes:
