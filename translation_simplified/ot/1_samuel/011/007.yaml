translation:
  language: en
  text: Then he took a pair of oxen, cut them into pieces, and sent the pieces throughout Israel through messengers, saying, “This is what will happen to the oxen of anyone who does not come out to follow Saul and Samuel.” Then dread from Yahweh fell on the people, and they came out together as one man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fear of Yahweh fell on the people.” The wording most likely describes dread sent by Yahweh that moved them to act.
    reason: alternative_reading
