translation:
  language: en
  text: Then Saul said to David, “Look, here is my older daughter Merab. I will give her to you as your wife. But you must serve me as a brave warrior and fight the LORD’s battles.” Saul was thinking, “I will not attack David myself. Instead, I want the Philistines to attack him.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: my older daughter Merab—I will give her to you as a wife
  simplified_phrase: here is my older daughter Merab. I will give her to you as your wife
  preserved_meaning: Saul offers his older daughter Merab to David in marriage.
  reasoning_layer_used: POB translation and source clause structure
  rationale: Two sentences make Saul’s offer easier to follow without changing it.
- pob_phrase: be a valiant man for me
  simplified_phrase: serve me as a brave warrior
  preserved_meaning: Saul requires David to show military courage in his service.
  reasoning_layer_used: POB wording and immediate military context
  rationale: “Brave warrior” clearly expresses the military sense of “valiant man.”
- pob_phrase: Let not my hand be against him, but let the hand of the Philistines be against him
  simplified_phrase: I will not attack David myself. Instead, I want the Philistines to attack him.
  preserved_meaning: Saul wants the Philistines, rather than himself, to act violently against David.
  reasoning_layer_used: POB contrast and immediate narrative context
  rationale: Direct wording preserves the contrast without implying that Saul controls the Philistines.
interpretive_expansions:
- pob_phrase: For Saul said
  rendering: Saul was thinking
  claim: The quotation reveals Saul’s private plan rather than words spoken to David.
  evidence:
  - The hostile thought contrasts Saul’s action with what he wants the Philistines to do.
  - The preceding speech to David ends before this plan is disclosed.
  confidence: high
  alternatives_preserved:
  - Saul said to himself
translation_notes:
  risk_flags:
  - risk: Replacing the repeated “hand” image with “attack” removes the source-language metaphor.
    mitigation: The direct contrast preserves the image’s force by identifying who Saul wants to act against David.
