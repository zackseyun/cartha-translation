translation:
  language: en
  text: The next day, an evil spirit from God rushed upon Saul.[a] He raved inside the house[b] while David played music with his hand, as he did each day. Saul was holding a spear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a harmful spirit from God”; the Hebrew literally says “an evil spirit of God.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean “prophesied” or “was in a prophetic frenzy,” but here it describes disturbed, uncontrolled behavior.
    reason: alternative_reading
