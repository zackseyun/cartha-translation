translation:
  language: en
  text: David went on every mission Saul gave him and acted wisely.[a] So Saul put him in command of the fighting men. This pleased all the people and Saul’s servants.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that David succeeded or prospered.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean they approved of David himself, his appointment, or the whole situation.
    reason: alternative_reading
