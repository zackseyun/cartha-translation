translation:
  language: en
  text: Then Saul said, “Tell David, ‘The king does not want the usual marriage payment.[a] Instead, he asks only for the foreskins of one hundred Philistines, so that the king may be avenged on his enemies.’” Saul planned for the Philistines to bring David down.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This marriage payment, often called a bride-price, was customarily given by the groom or his family to the bride’s family.
    reason: cultural_note
  - marker: b
    text: “Bring David down” likely means cause his death, but the Hebrew is less explicit.
    reason: lexical_alternative
