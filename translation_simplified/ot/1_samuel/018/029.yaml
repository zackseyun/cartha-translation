translation:
  language: en
  text: Saul’s fear of David grew even stronger, and he remained David’s enemy from then on.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Saul remained David’s enemy all his days.” The Hebrew may emphasize continual hostility rather than strictly the rest of Saul’s life.
