translation:
  language: en
  text: 'Saul gave his servants this order: “Talk to David privately[a] and tell him, ‘The king is pleased with you, and all his servants love you. So now become the king’s son-in-law.[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “secretly” or “quietly.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “be related to the king by marriage” or “become allied with the king by marriage.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: commanded his servants
  simplified_phrase: gave his servants this order
  preserved_meaning: Saul authoritatively directed his servants.
  reasoning_layer_used: Lexical decision for וַיְצַו
  rationale: The rewrite makes the directive natural while retaining its commanding force.
- pob_phrase: Speak to David privately, saying
  simplified_phrase: Talk to David privately and tell him
  preserved_meaning: The servants must privately deliver Saul’s message to David.
  reasoning_layer_used: Lexical decisions for דַּבְּרוּ and בַּלָּט
  rationale: Ordinary English removes the awkward speech formula without changing the action.
- pob_phrase: the king delights in you
  simplified_phrase: the king is pleased with you
  preserved_meaning: The king views David with favor and pleasure.
  reasoning_layer_used: Lexical decision for חָפֵץ בְּךָ
  rationale: A documented lexical alternative avoids a possible romantic sense of “delights in you.”
translation_notes:
  risk_flags:
