  rationale: Adding “the people of” makes the collective place names immediately clear.
- pob_phrase: went out and came in before them
  simplified_phrase: led them out and brought them back
  preserved_meaning: David’s visible public leadership, especially in military action, is expressed without losing the idiom’s movement image.
  reasoning_layer_used: POB lexical decisions for יוֹצֵא וָ/בָא and לִ/פְנֵי/הֶם, confirmed by the immediate narrative context
  rationale: The idiomatic rendering communicates why the people loved David more clearly than a literal spatial description.
