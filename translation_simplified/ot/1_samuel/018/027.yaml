translation:
  language: en
  text: David and his men set out and struck down two hundred Philistine men. David brought their foreskins to the king, and the full number was counted out before him.[a] This allowed David to become the king’s son-in-law. So Saul gave his daughter Michal to David as his wife.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean that they presented the full number to the king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So David arose and went, he and his men
  simplified_phrase: David and his men set out
  preserved_meaning: David began decisive action together with his men.
  reasoning_layer_used: POB lexical decision for וַיָּקָם and the explicit pronoun
  rationale: “Set out” expresses the start of decisive action in natural modern English.
- pob_phrase: they counted them out in full to the king
  simplified_phrase: the full number was counted out before him
  preserved_meaning: The complete tally was verified in the king’s presence.
  reasoning_layer_used: POB lexical decision and footnote for וַיְמַלְאוּם
  rationale: The passive wording avoids an unclear “they” while retaining the documented counting sense.
- pob_phrase: so that he might become the king’s son-in-law
  simplified_phrase: This allowed David to become the king’s son-in-law
  preserved_meaning: Meeting the required tally enabled the marriage into Saul’s family.
  reasoning_layer_used: POB lexical decision for לְהִתְחַתֵּן בַּמֶּלֶךְ
  rationale: A separate sentence makes the purpose and result easier to follow.
