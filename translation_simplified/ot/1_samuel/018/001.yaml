translation:
  language: en
  text: After David finished speaking to Saul, Jonathan’s soul became bound to David’s soul. Jonathan loved David as he loved his own soul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew repeats “soul” three times, emphasizing the depth of Jonathan’s bond with David.
    reason: source_note
