- pob_phrase: And it happened, when he had finished speaking to Saul
  simplified_phrase: After David finished speaking to Saul
  preserved_meaning: David’s speech to Saul ended before Jonathan’s bond with him is described.
  reasoning_layer_used: lexical decision and narrative context
  rationale: The simpler time clause removes an unnecessary narrative formula and makes the speaker explicit.
- pob_phrase: Jonathan’s soul was bound to David’s soul
  simplified_phrase: Jonathan’s soul became bound to David’s soul
  preserved_meaning: Jonathan formed a strong inner attachment to David while the Hebrew binding image remains intact.
  reasoning_layer_used: lexical decision for נֶפֶשׁ and נִקְשְׁרָה
  rationale: “Became bound” presents the event naturally without weakening the metaphor or repeated “soul.”
- pob_phrase: and Jonathan loved him as his own soul
  simplified_phrase: Jonathan loved David as he loved his own soul
  preserved_meaning: Jonathan loved David with the same depth of concern he had for his own being.
  reasoning_layer_used: lexical and theological decisions
  rationale: Repeating the names and verb clarifies the comparison without defining the love as romantic or merely political.
