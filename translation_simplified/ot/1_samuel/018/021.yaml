translation:
  language: en
  text: Then Saul said, “I will give her to him in marriage so that she may become a trap for him and the Philistines may use their power against him.” So Saul told David, “Through my second daughter,[a] you can become my son-in-law today.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “For the second time, you can become my son-in-law today.” The Hebrew may refer either to Saul’s second daughter or to David’s second opportunity to marry into Saul’s family.
    reason: alternative_reading
