translation:
  language: en
  text: Achish trusted David. He said, “David has made himself hated by his own people in Israel.[a] So he will be my servant forever.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “made himself stink,” an image for making himself detestable to his people.
    reason: simplification_note
  - marker: b
    text: “Servant” may also be translated “slave.” Here Achish expects David to remain in lasting service and dependence on him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Achish trusted David, saying
  simplified_phrase: Achish trusted David. He said
  preserved_meaning: Achish placed confidence in David and stated his reasoning.
  reasoning_layer_used: The lexical decisions retain “trusted” and use “said” as the quotation marker.
  rationale: Two short sentences make the opening easier to follow.
- pob_phrase: He has surely made himself stink among his people in Israel
  simplified_phrase: David has made himself hated by his own people in Israel
  preserved_meaning: Achish believed David had made the Israelites detest him.
  reasoning_layer_used: The lexical rationale identifies “stink” as an intensified idiom for becoming detestable.
  rationale: The main text states the social meaning while the footnote preserves the Hebrew image.
- pob_phrase: so he will be my servant forever
  simplified_phrase: So he will be my servant forever
  preserved_meaning: Achish expected David to remain permanently dependent on him in service.
  reasoning_layer_used: The lexical rationale favors vassal-like service while retaining “slave” as a possible sense.
  rationale: Keeping “my servant” preserves Achish’s claim of lasting dependence.
