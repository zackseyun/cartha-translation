translation:
  language: en
  text: Then Achish said, “Where did you raid today?”[a] David said, “I raided the Negev region of Judah, the Negev region of the Jerahmeelites, and the Negev region of the Kenites.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is unusual and literally resembles “Did you not raid today?” but the context indicates a question about where David raided.
    reason: textual_variant
  - marker: b
    text: '“Negev” can also mean “south” or “southern region”: “the southern region of Judah, the southern region of the Jerahmeelites, and the southern region of the Kenites.”'
    reason: lexical_alternative
