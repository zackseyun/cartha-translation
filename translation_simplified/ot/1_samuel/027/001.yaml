translation:
  language: en
  text: David thought to himself, “Now I will die at Saul’s hand.[a] The best thing I can do is escape to the land of the Philistines. Then Saul will give up searching for me anywhere in Israel, and I will escape his grasp.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Now I will perish one day at Saul’s hand.” The Hebrew can also carry the vivid sense “be swept away.”
    reason: lexical_alternative
