  reasoning_layer_used: POB lexical decision for אֶל־לִבּוֹ
  rationale: The natural English idiom makes David’s inward reflection immediately clear.
- pob_phrase: There is nothing better for me than that I should surely escape
  simplified_phrase: The best thing I can do is escape
  preserved_meaning: David regards escape as his best available course.
  reasoning_layer_used: POB lexical decisions for אֵין לִי טוֹב כִּי and הִמָּלֵט אִמָּלֵט
  rationale: The direct wording removes a dense clause while retaining its emphatic comparison.
- pob_phrase: seeking me any longer in all the territory of Israel ... escape from his hand
