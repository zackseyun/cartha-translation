  preserved_meaning: Saul will stop pursuing David across Israel, leaving David beyond Saul’s power.
  reasoning_layer_used: POB lexical decisions for גְּבוּל and מִיָּדוֹ
  rationale: “Anywhere” clarifies the territorial extent, while “grasp” preserves the image of Saul’s power.
