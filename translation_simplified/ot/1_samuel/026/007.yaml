translation:
  language: en
  text: That night, David and Abishai reached Saul’s troops. There was Saul, lying asleep inside the camp.[a] His spear was stuck in the ground at his head, and Abner and the troops were lying around him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “inside the circle”—the Hebrew probably refers to the camp’s circular formation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came to the troops by night
  simplified_phrase: That night, David and Abishai reached Saul’s troops
  preserved_meaning: David and Abishai arrived at Saul’s military force during the night.
  reasoning_layer_used: The lexical decisions identify the group as Saul’s troops and the phrase as marking the time of arrival.
  rationale: Putting the time first makes the sequence easier to follow.
- pob_phrase: and behold, Saul was lying asleep within the encampment
  simplified_phrase: There was Saul, lying asleep inside the camp
  preserved_meaning: The wording vividly presents Saul lying down asleep in the protected camp area.
  reasoning_layer_used: The lexical decisions preserve the sudden discovery, Saul’s posture and state, and the camp setting.
  rationale: “There was Saul” naturally conveys the vivid discovery without the unfamiliar “behold.”
- pob_phrase: with his spear stuck in the ground at his head, and Abner and the troops were lying around him
  simplified_phrase: His spear was stuck in the ground at his head, and Abner and the troops were lying around him
  preserved_meaning: The spear stood near Saul’s head, while Abner and the troops lay in positions around him.
  reasoning_layer_used: The lexical decisions establish the spear’s location and the surrounding spatial arrangement without explicitly calling the others asleep.
  rationale: A separate sentence reduces the clause load while preserving the source’s limited description.
translation_notes:
  risk_flags:
  - risk: “There was Saul” is less formally marked than “behold.”
    mitigation: The phrase still presents Saul as the vivid sight David and Abishai encounter.
  - risk: Readers may infer that Abner and the troops were asleep, though this verse only says they were lying down.
    mitigation: The main text retains “were lying around him” rather than making their sleep explicit.
