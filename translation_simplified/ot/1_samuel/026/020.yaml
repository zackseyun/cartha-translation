translation:
  language: en
  text: So now, do not let my blood fall to the ground far from Yahweh’s presence. For the king of Israel has set out to search for just one flea, like a hunter pursuing a partridge in the mountains.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not let my blood fall to the ground away from the presence of Yahweh
  simplified_phrase: do not let my blood fall to the ground far from Yahweh’s presence
  preserved_meaning: David pleads not to be violently killed while separated from Yahweh’s presence.
  reasoning_layer_used: lexical decisions for דָּמִי, אַל יִפֹּל ... אַרצה, and מִנֶּגֶד פְּנֵי יְהוָה
  rationale: The wording keeps the blood-on-the-ground image and removes the unsupported location marker “here.”
- pob_phrase: has come out to seek a single flea
  simplified_phrase: has set out to search for just one flea
  preserved_meaning: The king has undertaken a pursuit of someone David portrays as insignificant.
  reasoning_layer_used: lexical decisions for יָצָא, לְבַקֵּשׁ, and פַּרְעֹשׁ אֶחָד
  rationale: “Set out to search” is natural English, while “just one flea” retains David’s self-deprecating emphasis.
- pob_phrase: as one hunts a partridge in the mountains
  simplified_phrase: like a hunter pursuing a partridge in the mountains
  preserved_meaning: David compares Saul’s pursuit to a mountain hunt for a partridge.
  reasoning_layer_used: lexical decisions for הַקֹּרֵא and יִרְדֹּף ... בֶּהָרִים
  rationale: Naming the hunter makes the comparison clear while preserving the mountain-hunting image.
translation_notes:
  risk_flags:
