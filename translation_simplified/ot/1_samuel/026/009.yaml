translation:
  language: en
  text: But David said to Abishai, “Do not kill him, for who can raise a hand against Yahweh’s anointed king[a] and remain free of guilt?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “anointed” is from the same word family as “Messiah.” Here it refers to Saul, whom Yahweh anointed as king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not destroy him
  simplified_phrase: Do not kill him
  preserved_meaning: David forbids Abishai from taking Saul’s life.
  reasoning_layer_used: Lexical decision and immediate narrative context
  rationale: The proposed action is a lethal strike, so “kill” makes the command immediately clear.
- pob_phrase: stretch out his hand against
  simplified_phrase: raise a hand against
  preserved_meaning: The expression still pictures taking violent action against Saul.
  reasoning_layer_used: Lexical decision on the Hebrew idiom
  rationale: This familiar English expression preserves both the hand image and the threat of violence.
- pob_phrase: remain guiltless
  simplified_phrase: remain free of guilt
  preserved_meaning: Anyone who attacks Yahweh’s anointed king incurs moral liability.
  reasoning_layer_used: Lexical decision for וְנִקָּה
  rationale: “Free of guilt” states the same idea in more common English.
