translation:
  language: en
  text: Then David crossed to the other side and stood on top of the mountain, far away. A great distance separated him from Saul’s camp.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: crossed over to the other side
  simplified_phrase: crossed to the other side
  preserved_meaning: David moved from one side to the opposite side.
  reasoning_layer_used: The lexical decisions for וַיַּעֲבֹר and הָעֵבֶר preserve the directional movement.
  rationale: Removing “over” avoids repetition without weakening the sense of crossing.
- pob_phrase: stood on the top of the mountain at a distance
  simplified_phrase: stood on top of the mountain, far away
  preserved_meaning: David stood on the mountain with substantial distance between himself and the camp.
  reasoning_layer_used: The lexical decisions for עַל רֹאשׁ הָהָר and מֵרָחֹק support the location and remoteness.
  rationale: The shorter wording makes David’s location easier to picture.
- pob_phrase: there was a great space between them
  simplified_phrase: A great distance separated him from Saul’s camp
  preserved_meaning: A substantial physical distance lay between David and the others.
  reasoning_layer_used: The lexical decisions for רַב הַמָּקוֹם and בֵּינֵיהֶם identify substantial separation between David and the camp.
  rationale: Naming the distance directly avoids suggesting merely a broad area.
interpretive_expansions:
- pob_phrase: between them
  rendering: separated him from Saul’s camp
  claim: The plural reference points to David on one side and Saul’s camp on the other.
  evidence:
  - The immediate narrative places David opposite Saul and the men in his camp.
  - The POB rationale identifies Saul’s camp as the other side of the separation.
  confidence: high
  alternatives_preserved:
  - between David and the others
translation_notes:
  risk_flags:
