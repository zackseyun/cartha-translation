translation:
  language: en
  text: He said, “My lord, why are you pursuing his servant like this?[a] What have I done? What evil am I guilty of, intending to do, or able to do?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “his servant,” though many translations use “your servant” to make the direct address smoother.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally says, “What evil is in my hand?”—an image for guilt, intent, or power to cause harm.
    reason: cultural_note
