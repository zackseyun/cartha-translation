  preserved_meaning: Only the contemptible and valueless things were destroyed.
  reasoning_layer_used: POB lexical decisions for נְמִבְזָה and נָמֵס
  rationale: The descriptive wording avoids naming an evaluator whom the Hebrew does not explicitly identify.
