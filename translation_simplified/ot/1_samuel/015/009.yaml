translation:
  language: en
  text: But Saul and the people spared Agag. They also kept the best sheep and cattle, the second-born animals,[a] the rams, and everything else that was good. They refused to devote them to destruction.[b] But they devoted everything that was despised and worthless to destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term translated “second-born animals” is difficult and uncertain; it has traditionally been translated “fatlings.”
    reason: lexical_alternative
  - marker: b
    text: “Devote to destruction” means to place something under a ban requiring its destruction.
    reason: lexical_alternative
