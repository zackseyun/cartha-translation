  preserved_meaning: Samuel directly addressed Saul.
  reasoning_layer_used: POB lexical decision for וַיֹּאמֶר and אֶל
  rationale: “Told Saul” is natural modern speech-reporting language in this context.
- pob_phrase: as king over his people, over Israel
  simplified_phrase: as king over Israel, his people
  preserved_meaning: Yahweh appointed Saul to rule Israel, who are Yahweh’s people.
  reasoning_layer_used: POB lexical decisions for לְמֶלֶךְ, עַל עַמּוֹ, and עַל יִשְׂרָאֵל
  rationale: The apposition identifies Israel as Yahweh’s people without the awkward repeated phrase.
- pob_phrase: So now, listen to the words of Yahweh
  simplified_phrase: Now listen to Yahweh’s words
  preserved_meaning: Samuel moves from Saul’s commissioning to a solemn call to heed Yahweh.
