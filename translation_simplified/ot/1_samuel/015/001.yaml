translation:
  language: en
  text: Then Samuel told Saul, “Yahweh sent me to anoint you as king over Israel, his people. Now listen to Yahweh’s words.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression calls Saul not merely to hear, but also to heed what Yahweh says.
