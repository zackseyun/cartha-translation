translation:
  language: en
  text: Saul said, “The people brought these animals from the Amalekites. They spared the best sheep and cattle so they could sacrifice them to Yahweh your God. But we devoted the rest to destruction.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “we utterly destroyed the rest.” The Hebrew term means setting something apart for destruction under divine judgment.
    reason: lexical_alternative
