    mitigation: The narrative context and POB rationale identify Samuel’s words as spoken instructions.
  - risk: The main text does not retain the Hebrew image of listening to the people’s voice.
    mitigation: Footnote a preserves the image and explains its contrast with Yahweh’s command.
