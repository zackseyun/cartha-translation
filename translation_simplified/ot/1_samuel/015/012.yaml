translation:
  language: en
  text: Early in the morning, Samuel got up to meet Saul. Samuel was told, “Saul came to Carmel. Look, he has set up a monument for himself.[a] Then he turned, continued on, and went down to Gilgal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is literally “a hand for himself,” an idiom here meaning a monument.
    reason: lexical_alternative
