translation:
  language: en
  text: Saul said to Samuel, “But I did obey Yahweh. I followed the path Yahweh sent me on. I brought Agag, the king of Amalek, and I devoted Amalek to destruction.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated “I completely destroyed Amalek” or “I put Amalek under the ban.” The Hebrew describes setting something apart for destruction.
    reason: lexical_alternative
