translation:
  language: en
  text: Samuel said, “Though you once saw yourself as small and unimportant,[a] were you not the head of Israel’s tribes? And Yahweh anointed you as king over Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Even if you once saw yourself as small and unimportant.” The Hebrew allows either nuance; both recall Saul’s former low view of himself.
    reason: lexical_alternative
