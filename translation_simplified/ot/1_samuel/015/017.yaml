- pob_phrase: small in your own eyes
  simplified_phrase: saw yourself as small and unimportant
  preserved_meaning: Saul once regarded himself as insignificant while the image of smallness remains.
  reasoning_layer_used: POB lexical decisions for קָטֹן and בְּעֵינֶיךָ
  rationale: The wording explains the Hebrew idiom without losing its concrete image.
- pob_phrase: the head of the tribes of Israel
  simplified_phrase: the head of Israel’s tribes
  preserved_meaning: Saul held the leading position over Israel’s tribes.
  reasoning_layer_used: POB lexical decision for רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  rationale: The shorter possessive form is natural English and retains the head metaphor.
- pob_phrase: anointed you king over Israel
  simplified_phrase: anointed you as king over Israel
  preserved_meaning: Yahweh installed Saul through the theologically significant act of anointing.
  reasoning_layer_used: POB lexical and theological decisions for וַיִּמְשָׁחֲךָ and יְהוָה
  rationale: Adding “as” clarifies the result while preserving anointing and the divine name.
