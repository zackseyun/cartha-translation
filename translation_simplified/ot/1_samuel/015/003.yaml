translation:
  language: en
  text: Now go and attack Amalek,[a] and devote everything that belongs to that people to destruction.[b] Do not spare any of them. Put to death every man and woman, every child and nursing infant, and every ox, sheep, camel, and donkey.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amalek” refers here to the Amalekite people as a whole.
    reason: simplification_note
  - marker: b
    text: The Hebrew means to devote something irrevocably to destruction under divine judgment; it may also be translated “utterly destroy” or “put under the ban.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: strike Amalek
  simplified_phrase: attack Amalek
  preserved_meaning: The command directs Saul to take military action against Amalek.
  reasoning_layer_used: The lexical decision lists “attack” as an allowed equivalent for the Hebrew verb.
  rationale: “Attack” communicates the warfare setting more immediately than “strike.”
- pob_phrase: all that belongs to him ... Do not spare him
  simplified_phrase: everything that belongs to that people ... Do not spare any of them
  preserved_meaning: The singular “Amalek” represents the entire Amalekite people and all they possess.
  reasoning_layer_used: The POB footnote and corporate-singular rationale identify Amalek as a collective entity.
  rationale: Plural wording prevents readers from mistaking Amalek for one individual.
- pob_phrase: from man to woman, from child to nursing infant, from ox to sheep, from camel to donkey
  simplified_phrase: every man and woman, every child and nursing infant, and every ox, sheep, camel, and donkey
  preserved_meaning: The command includes every named human and animal category without exception.
  reasoning_layer_used: The lexical decisions explain the pairings as distributive expressions of totality.
  rationale: Repeating “every” makes the list's complete scope clear in natural English.
interpretive_expansions:
- pob_phrase: Amalek ... him
  rendering: Amalek ... that people ... them
  claim: Amalek is the collective name for the Amalekite people in this command.
  evidence:
  - The POB footnote says the singular refers to the Amalekite people as a corporate entity.
  - The lexical rationale states that Amalek denotes the people or polity in context.
  confidence: high
  alternatives_preserved:
  - Amalek ... him
  - the Amalekites ... them
translation_notes:
  risk_flags:
  - risk: Changing the corporate singular pronouns to plural reduces the Hebrew form's visibility.
    mitigation: The name “Amalek” remains in the text, and the footnote explains its collective use.
  - risk: “Devote to destruction” may remain unfamiliar to some readers.
    mitigation: The footnote briefly explains its irrevocable judgment sense and gives recognized alternatives.
