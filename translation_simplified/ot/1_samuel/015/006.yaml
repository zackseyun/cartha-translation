translation:
  language: en
  text: Then Saul said to the Kenite, “Go now. Turn away and go down from among the Amalekites, so that I do not sweep you away with them. For you showed loyal kindness to all the sons of Israel[a] when they came up from Egypt.” So the Kenite moved away from the Amalekites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All the sons of Israel” is a national expression for the people of Israel.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Go, turn aside, go down from among the Amalekites
  simplified_phrase: Go now. Turn away and go down from among the Amalekites
  preserved_meaning: The Kenite must separate from the Amalekites and make the concrete downward movement.
  reasoning_layer_used: Lexical decisions for הלך, סור, ירד, and מִתּוֹךְ
  rationale: Two direct sentences preserve the successive commands without awkward repetition.
- pob_phrase: lest I sweep you away with them
  simplified_phrase: so that I do not sweep you away with them
  preserved_meaning: Saul warns that the Kenite could be removed with the Amalekites in judgment.
  reasoning_layer_used: Lexical decision for פֶּן אֹסִפְךָ עִמּוֹ
  rationale: The modern clause keeps both the warning and the forceful image.
- pob_phrase: showed kindness
  simplified_phrase: showed loyal kindness
  preserved_meaning: The Kenite showed faithful and morally weighty benevolence toward Israel.
  reasoning_layer_used: Lexical and theological decisions for חֶסֶד
  rationale: “Loyal kindness” retains the relational depth of the Hebrew in clear English.
interpretive_expansions:
- pob_phrase: kindness
  rendering: loyal kindness
  claim: The kindness included faithful loyalty toward Israel rather than mere niceness.
  evidence:
  - The POB lexical rationale describes חֶסֶד as loyal, faithful benevolence.
  - Saul grounds the Kenite’s protection in this past conduct toward Israel.
  confidence: high
  alternatives_preserved:
