translation:
  language: en
  text: 'This is what Yahweh, Commander of all armies,[a] says: “I have taken note[b] of what Amalek did to Israel—how Amalek opposed the Israelites along the way when they came up out of Egypt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew title is traditionally rendered “Yahweh of hosts” and can include both heavenly and earthly forces.
    reason: source_note
  - marker: b
    text: The Hebrew can also mean “remembered” or “attended to with judgment,” but the punishment itself follows in the next verse.
    reason: lexical_alternative
