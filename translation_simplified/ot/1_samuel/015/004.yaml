  reasoning_layer_used: The lexical decision identifies the verb as an idiom for summoning people.
  rationale: This expresses the summons in familiar English.
- pob_phrase: mustered them
  simplified_phrase: counted the troops
  preserved_meaning: Saul took account of those gathered for war.
  reasoning_layer_used: The lexical decision gives the military sense as mustering or reviewing troops.
  rationale: The reported totals make the counting aspect clear.
- pob_phrase: ten thousand men of Judah
  simplified_phrase: 10,000 men of Judah
  preserved_meaning: These soldiers belonged to the tribe of Judah.
  reasoning_layer_used: The lexical decision identifies a collective tribal designation.
  rationale: Keeping “of Judah” avoids a merely geographic meaning.
