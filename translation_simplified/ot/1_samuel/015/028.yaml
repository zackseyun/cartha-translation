translation:
  language: en
  text: Samuel said to him, “Today Yahweh has torn the kingdom of Israel away from you. He has given it to another person—your neighbor[a]—who is better than you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “neighbor” can mean a companion or fellow, not only someone who lives nearby.
    reason: lexical_alternative
