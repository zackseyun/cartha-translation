translation:
  language: en
  text: 'Samuel said, “Does the LORD take as much pleasure in burnt offerings and sacrifices as in obedience to what he says? Look: Obeying him is better than offering a sacrifice, and listening to him is better than offering the fat of rams.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: delight in
  simplified_phrase: take as much pleasure in
  preserved_meaning: The LORD values obedience above ritual offerings.
  reasoning_layer_used: POB translation and source comparison
  rationale: The common phrase makes the comparison easier to follow without weakening it.
- pob_phrase: obeying the voice of the LORD
  simplified_phrase: obedience to what he says
  preserved_meaning: Obedience means responding to the LORD’s spoken command.
  reasoning_layer_used: POB translation and Hebrew voice image
  rationale: The wording clarifies the idiom while the next clause retains the image of listening to him.
- pob_phrase: to obey is better than sacrifice
  simplified_phrase: Obeying him is better than offering a sacrifice
  preserved_meaning: Actual obedience is superior to performing the sacrificial act.
  reasoning_layer_used: POB translation and immediate parallelism
  rationale: Adding the direct object and action makes the contrast immediately clear.
interpretive_expansions:
- pob_phrase: the fat of rams
  rendering: offering the fat of rams
  claim: The fat is being presented as a sacrificial offering.
  evidence:
  - The phrase stands parallel to offering a sacrifice in the same sentence.
  - The immediate context contrasts obedience with sacrificial worship.
  confidence: high
  alternatives_preserved:
  - the fat of rams
translation_notes:
  risk_flags:
