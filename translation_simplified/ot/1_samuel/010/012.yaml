translation:
  language: en
  text: 'Then a local man replied, “And who is their father?”[a] That is why this became a proverb: “Is Saul also among the prophets?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “And who is his father?” Some translations understand the question as referring specifically to Saul, but the Masoretic Text reads “their father.”
