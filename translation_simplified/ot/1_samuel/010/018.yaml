translation:
  language: en
  text: 'He said to the sons of Israel[a], “This is what Yahweh, the God of Israel, says: I brought Israel up out of Egypt. I rescued you from the grip of the Egyptians and from the grip of all the kingdoms that were oppressing you.”'
