simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The solemn messenger formula introduces Yahweh’s own declaration.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The common English formula is clear without weakening its declarative force.
- pob_phrase: I brought Israel up from Egypt
  simplified_phrase: I brought Israel up out of Egypt
  preserved_meaning: Yahweh brought the nation of Israel up from Egypt in the exodus.
  reasoning_layer_used: POB lexical decision for הֶעֱלֵיתִי
  rationale: “Up out of” makes the movement natural while retaining the exodus image.
- pob_phrase: I delivered you from the hand of the Egyptians and from the hand of all the kingdoms
  simplified_phrase: I rescued you from the grip of the Egyptians and from the grip of all the kingdoms
  preserved_meaning: Yahweh freed Israel from the hostile control of the Egyptians and all the oppressive kingdoms.
  reasoning_layer_used: POB lexical decisions for וָאַצִּיל, מִיַּד, and כָּל הַמַּמְלָכוֹת
  rationale: “Rescued” and repeated “grip” clarify hostile control while preserving the repeated bodily image and plural kingdoms.
