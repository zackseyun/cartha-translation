translation:
  language: en
  text: Saul answered his uncle, “He told us clearly that the donkeys had been found.” But Saul did not tell him what Samuel had said about his becoming king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “about the kingdom.” The Hebrew most likely refers to Saul becoming king.
    reason: alternative_reading
