translation:
  language: en
  text: Go down to Gilgal ahead of me. Look, I am coming down to you to offer burnt offerings and sacrifice peace offerings.[a] Wait seven days, until I come to you and tell you what to do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also called “fellowship offerings” or “offerings of well-being”; these sacrifices were associated with peace, wholeness, and shared fellowship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall go down before me to Gilgal
  simplified_phrase: Go down to Gilgal ahead of me
  preserved_meaning: Saul is directed to go down to Gilgal in advance of Samuel.
  reasoning_layer_used: lexical decision for וְיָרַדְתָּ and לְפָנַי
  rationale: A direct command and “ahead of me” express the instructional sequence in ordinary English.
- pob_phrase: And behold, I am coming down to you
  simplified_phrase: Look, I am coming down to you
  preserved_meaning: Samuel draws attention to his intended descent to meet Saul.
  reasoning_layer_used: lexical decision for וְהִנֵּה and יֹרֵד
  rationale: “Look” keeps the attention-marking force without the archaic sound of “behold.”
- pob_phrase: make known to you what you shall do
  simplified_phrase: tell you what to do
  preserved_meaning: Samuel will give Saul the instructions he must follow.
  reasoning_layer_used: lexical decisions for וְהוֹדַעְתִּי לְךָ and אֵת אֲשֶׁר תַּעֲשֶׂה
  rationale: The simpler wording naturally communicates that Samuel will cause Saul to know his required action.
translation_notes:
  risk_flags:
