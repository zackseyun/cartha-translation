translation:
  language: en
  text: But some worthless men said, “How can this man save us?” They despised him and brought him no gift. But Saul remained silent and did not respond.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Saul acted as though he were deaf.” The Hebrew can describe deliberate silence when someone is insulted.
    reason: lexical_alternative
