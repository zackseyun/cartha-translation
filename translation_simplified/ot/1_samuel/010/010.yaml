translation:
  language: en
  text: When they reached the hill,[a] a group of prophets suddenly came to meet him. The Spirit of God rushed upon him, and he prophesied among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Gibeah.” The Hebrew may refer either to a place named Gibeah or to the hill.
