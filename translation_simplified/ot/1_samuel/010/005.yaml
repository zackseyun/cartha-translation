translation:
  language: en
  text: After that, you will come to Gibeath-ha-Elohim,[a] where there is a Philistine garrison.[b] When you enter the city, you will meet a group of prophets coming down from the hilltop place of worship.[d] Harps, tambourines, flutes, and lyres will be played in front of them,[c] and they will be prophesying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the hill of God” or “Gibeah of God.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew may refer to a Philistine outpost or to Philistine officials, though the context favors a garrison.
    reason: alternative_reading
  - marker: c
    text: The exact ancient instruments are uncertain; “harp” may be “lute,” and “flute” may be “pipe.”
    reason: lexical_alternative
  - marker: d
    text: The traditional term is “high place,” meaning a local place of worship.
    reason: simplification_note
