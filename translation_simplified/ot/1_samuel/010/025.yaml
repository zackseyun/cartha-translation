translation:
  language: en
  text: Samuel explained to the people the rights and duties that came with kingship.[a] He wrote these rights and duties in the book and placed it before Yahweh. Then Samuel dismissed the people, sending each man to his own house.
  philosophy: optimal-equivalence
  footnotes:
