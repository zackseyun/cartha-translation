- pob_phrase: poured it on his head and kissed him
  simplified_phrase: poured the oil on Saul’s head. He kissed Saul
  preserved_meaning: Samuel pours the oil on Saul and then kisses him as in the anointing scene.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Repeating the names and dividing the actions into two sentences removes unclear pronouns and a long clause.
- pob_phrase: anointed you as ruler over
  simplified_phrase: anointed you to rule over
  preserved_meaning: Yahweh appoints Saul to govern without yet calling him king.
  reasoning_layer_used: POB lexical and theological decisions on נָגִיד
  rationale: Using the verb “rule” makes the appointment easier to understand while preserving the office’s governing force.
- pob_phrase: his inheritance
  simplified_phrase: his people, who are his inheritance
  preserved_meaning: Israel belongs to Yahweh as his covenant inheritance.
  reasoning_layer_used: POB lexical rationale for נַחֲלָה
  rationale: The added wording identifies the inheritance as Yahweh’s people while retaining the biblical image.
