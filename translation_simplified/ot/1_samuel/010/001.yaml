translation:
  language: en
  text: Then Samuel took the flask of oil and poured the oil on Saul’s head. He kissed Saul and said, “Has not Yahweh anointed you to rule[a] over his people, who are his inheritance?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also be translated “leader” or “prince.” It describes someone appointed to govern but is not exactly the same as the later title “king.”
    reason: lexical_alternative
