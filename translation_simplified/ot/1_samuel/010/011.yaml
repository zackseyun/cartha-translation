simplification_decisions:
- pob_phrase: And it happened that all who had known him formerly saw
  simplified_phrase: Everyone who had known Saul before saw him
  preserved_meaning: People familiar with Saul recognized the contrast between his past and present behavior.
  reasoning_layer_used: POB lexical decision for the Hebrew time idiom
  rationale: “Before” conveys the idiom naturally, while naming Saul makes the reference clear.
- pob_phrase: saw, and behold
  simplified_phrase: saw him, and to their surprise
  preserved_meaning: The witnesses noticed Saul’s unexpected behavior with vivid surprise.
  reasoning_layer_used: POB lexical rationale for וְהִנֵּה
  rationale: “To their surprise” makes the force of “behold” immediately understandable.
- pob_phrase: So the people said, each man to his neighbor
  simplified_phrase: Then the people said, each man to his neighbor
  preserved_meaning: The surrounding people responded collectively by speaking to one another.
  reasoning_layer_used: POB lexical decisions for הָעָם and אִישׁ אֶל רֵעֵהוּ
  rationale: The wording retains both the collective group and the masculine distributive expression.
interpretive_expansions:
- pob_phrase: and behold
  rendering: and to their surprise
  claim: Those who knew Saul found his prophetic activity unexpected.
