translation:
  language: en
  text: Saul also went home to Gibeah. Brave warriors[a] went with him—men whose hearts God had touched.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “capable men” or “men of valor.”
    reason: lexical_alternative
  - marker: b
    text: This Hebrew image means that God moved their inner disposition.
    reason: simplification_note
