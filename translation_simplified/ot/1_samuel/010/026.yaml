  preserved_meaning: Saul returned to his own home in Gibeah.
  reasoning_layer_used: Lexical decision for הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  rationale: The shorter wording preserves both the personal destination and the place name.
- pob_phrase: and with him went the valiant men
  simplified_phrase: Brave warriors went with him
  preserved_meaning: A group of courageous, capable fighting men accompanied Saul.
  reasoning_layer_used: Lexical decision for הַחַיִל and narrative syntax
  rationale: Ordinary English word order and familiar terms make the action immediately clear.
- pob_phrase: whose hearts God had touched
  simplified_phrase: men whose hearts God had touched
  preserved_meaning: God influenced their inner disposition without specifying how.
  reasoning_layer_used: Lexical and theological decisions for אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  rationale: The concrete heart-touching image remains, while the footnote explains its broader sense.
