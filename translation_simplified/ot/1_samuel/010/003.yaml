translation:
  language: en
  text: From there, continue on until you reach the oak of Tabor.[a] Three men will meet you there on their way up to God at Bethel.[b] One will be carrying three young goats, another three loaves of bread, and the third a wineskin filled with wine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to an oak, a terebinth, or another large tree.
    reason: lexical_alternative
  - marker: b
    text: This likely means they were traveling to a worship site at Bethel, though the Hebrew does not explicitly mention worship.
    reason: cultural_note
