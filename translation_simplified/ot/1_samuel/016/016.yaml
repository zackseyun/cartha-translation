translation:
  language: en
  text: Our lord, please tell us, your servants, to find a man who knows how to play the lyre. When an evil spirit from God comes upon you,[a] he will play the lyre with his hand, and it will be well for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a harmful spirit from God.” The Hebrew can describe the spirit as evil or emphasize its harmful effect.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Please let our lord say to your servants before you that they should seek out a man
  simplified_phrase: Our lord, please tell us, your servants, to find a man
  preserved_meaning: Saul’s attendants respectfully ask him to authorize their search for a suitable musician.
  reasoning_layer_used: Lexical decisions for the polite request, court title, attendants, and intentional search.
  rationale: Direct address removes the difficult courtly structure while retaining its respectful request.
- pob_phrase: when an evil spirit from God is upon you
  simplified_phrase: When an evil spirit from God comes upon you
  preserved_meaning: The spirit is attributed to God and oppressively comes upon Saul.
  reasoning_layer_used: Lexical and theological decisions for רוּחַ אֱלֹהִים רָעָה and עָלֶיךָ.
  rationale: “Comes upon you” states the circumstance naturally without resolving the theological tension.
- pob_phrase: he will play with his hand
  simplified_phrase: he will play the lyre with his hand
  preserved_meaning: The musician will use his hand to play the named instrument.
  reasoning_layer_used: Lexical decisions for כִּנּוֹר and וְנִגֵּן בְּיָדוֹ.
  rationale: Repeating “the lyre” makes the object clear while preserving the concrete hand image.
translation_notes:
  risk_flags:
  - risk: “Evil spirit from God” may be misunderstood as saying that God himself is morally evil.
    mitigation: The text preserves the POB’s theological tension, and the footnote gives the important “harmful” alternative.
  - risk: Direct address makes the deferential third-person court idiom less visible.
    mitigation: “Our lord” and “your servants” preserve the hierarchy and respectful tone.
