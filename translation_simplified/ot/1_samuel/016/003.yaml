translation:
  language: en
  text: Invite Jesse to the sacrifice. I will let you know what you are to do. You are to anoint for me the one I tell you to anoint.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will make known to you what you shall do
  simplified_phrase: I will let you know what you are to do
  preserved_meaning: God will inform Samuel of the action he is to take.
  reasoning_layer_used: Lexical decision for אוֹדִיעֲךָ and its instructional context
  rationale: The common expression “let you know” preserves the causative sense without formal wording.
- pob_phrase: and you shall anoint for me
  simplified_phrase: You are to anoint for me
  preserved_meaning: Samuel is directed to perform the consecrating act on God’s behalf.
  reasoning_layer_used: Lexical and theological decisions for וּמָשַׁחְתָּ לִי
  rationale: This wording makes the instruction clear while retaining the key term “anoint.”
- pob_phrase: the one whom I tell you
  simplified_phrase: the one I tell you to anoint
  preserved_meaning: God will specify which person Samuel must anoint.
  reasoning_layer_used: Lexical rationale for אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  rationale: Repeating “to anoint” removes an awkward English construction without changing the identified action.
translation_notes:
