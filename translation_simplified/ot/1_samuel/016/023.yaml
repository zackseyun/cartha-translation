  language: en
  text: Whenever the spirit of God[b] came upon Saul, David would take the lyre[a] and play it. Then Saul would find relief and feel better, and the harmful spirit[c] would leave him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lyre was an ancient stringed instrument, somewhat like a harp.
    reason: cultural_note
  - marker: b
    text: The Hebrew here says “the spirit of God,” while the end of the verse says “the harmful spirit.”
    reason: source_note
  - marker: c
    text: Or “the evil spirit”; the Hebrew may emphasize the harm and distress the spirit caused Saul.
    reason: lexical_alternative
