translation:
  language: en
  text: Then one of the young men replied, “Look, I have seen one of the sons of Jesse, who is from Bethlehem. His son is a skillful musician, brave and capable, a warrior, wise in what he says, and handsome. Yahweh is with him.”
  philosophy: optimal-equivalence
