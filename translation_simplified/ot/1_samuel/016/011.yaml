translation:
  language: en
  text: Samuel asked Jesse, “Are these all your young men?” Jesse answered, “The youngest is still left. Look—he is shepherding the flock.” Samuel told Jesse, “Send for him and bring him here. We will not sit down[a] until he arrives.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean they would not take their places or begin the meal or formal gathering.
    reason: lexical_alternative
