translation:
  language: en
  text: Yahweh said to Samuel, “How long will you keep grieving over Saul? I have rejected him as king over Israel. Fill your horn with oil and go. I am sending you to Jesse of Bethlehem, because I have provided for myself a king from among his sons.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “seen,” an expression that here may mean that Yahweh has selected or provided the king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How long will you grieve over Saul, since I have rejected him from being king over Israel?
  simplified_phrase: How long will you keep grieving over Saul? I have rejected him as king over Israel.
  preserved_meaning: Samuel’s continuing grief is challenged because Yahweh has removed Saul from kingship.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences clarify the logic while limiting the rejection to Saul’s royal office.
- pob_phrase: Jesse the Bethlehemite
  simplified_phrase: Jesse of Bethlehem
  preserved_meaning: Jesse is identified by his connection to Bethlehem.
  reasoning_layer_used: POB lexical decision for יִשַׁי בֵּית הַלַּחְמִי
  rationale: The modern place-based expression replaces an unfamiliar gentilic.
- pob_phrase: a king among his sons
  simplified_phrase: a king from among his sons
  preserved_meaning: The future king is one of Jesse’s sons.
  reasoning_layer_used: POB lexical decision for בְּבָנָיו
  rationale: “From among” makes the selection within the family immediately clear.
translation_notes:
  risk_flags:
  - risk: “Rejected him as king” could be misread as rejection of Saul in every respect.
    mitigation: The words “as king over Israel” explicitly restrict the statement to kingship.
  - risk: Modern readers may not recognize the horn as an oil container.
    mitigation: The concrete source-language image is retained rather than replaced with a generic vessel.
