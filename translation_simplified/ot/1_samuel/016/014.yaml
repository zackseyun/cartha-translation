  rationale: “Had left” states the same withdrawal in more familiar English.
- pob_phrase: The Spirit of Yahweh had departed from Saul, and an evil spirit from Yahweh terrified him.
  simplified_phrase: The Spirit of the LORD had left Saul. An evil spirit from the LORD terrified him.
