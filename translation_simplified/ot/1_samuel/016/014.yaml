  text: The Spirit of the LORD had left Saul. An evil spirit[a] from the LORD terrified him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a harmful spirit” or “a distressing spirit.” The Hebrew word can describe something evil or something that causes harm or distress.
