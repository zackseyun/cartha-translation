translation:
  language: en
  text: When Jesse and his sons came in, Samuel saw Eliab and said, “Surely this is the man Yahweh has chosen as king, here before Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is literally “Yahweh’s anointed.” The word is later used for “Messiah,” but here it means the man Samuel assumes Yahweh has chosen as king.
    reason: lexical_alternative
