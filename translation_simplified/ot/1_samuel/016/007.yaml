translation:
  language: en
  text: But Yahweh said to Samuel, “Do not focus on his appearance or how tall he is, because I have rejected him. Yahweh does not see as people see. People see what is visible to their eyes, but Yahweh sees the heart.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “heart” means the inner center of a person’s thoughts, will, and character.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Do not look at his appearance or at the height of his stature
  simplified_phrase: Do not focus on his appearance or how tall he is
  preserved_meaning: Samuel must not fix his attention on outward appearance and physical height.
  reasoning_layer_used: POB lexical decisions for תַּבֵּט and גְּבֹהַּ קוֹמָתוֹ
  rationale: The wording makes the prohibition and reference to tallness natural in modern English.
- pob_phrase: For not as man sees does God see
  simplified_phrase: Yahweh does not see as people see
  preserved_meaning: Divine perception differs from human perception.
  reasoning_layer_used: POB lexical and theological decisions on the elliptical Hebrew contrast
  rationale: The sentence supplies the contextual comparison directly and avoids inverted syntax.
- pob_phrase: man sees what is before the eyes
  simplified_phrase: People see what is visible to their eyes
  preserved_meaning: Human beings ordinarily perceive outwardly visible things.
  reasoning_layer_used: POB lexical decisions for הָאָדָם and לַעֵינַיִם
  rationale: “People” clearly conveys generic humanity while retaining the Hebrew image of the eyes.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “heart” as emotions alone.
    mitigation: The footnote preserves its broader Hebrew sense of thought, will, and character.
