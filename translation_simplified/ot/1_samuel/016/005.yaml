translation:
  language: en
  text: He answered, “I come in peace. I have come to offer a sacrifice to Yahweh. Set yourselves apart as holy, and come with me to the sacrifice.” Then Samuel set Jesse and his sons apart as holy and invited them to take part in the sacrifice.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Peace.
  simplified_phrase: I come in peace.
  preserved_meaning: Samuel assures the elders that he has peaceful intentions.
  reasoning_layer_used: POB lexical decision for שָׁלוֹם and the context of verse 4
  rationale: The full sentence makes the Hebrew assurance immediately clear while retaining the image of peace.
- pob_phrase: Consecrate yourselves
  simplified_phrase: Set yourselves apart as holy
  preserved_meaning: They must prepare themselves for holy participation in the sacrifice.
  reasoning_layer_used: POB lexical rationale for הִתְקַדְּשׁוּ
  rationale: This replaces an unfamiliar ritual term without reducing consecration to cleansing alone.
- pob_phrase: he consecrated Jesse and his sons and invited them to the sacrifice
  simplified_phrase: Samuel set Jesse and his sons apart as holy and invited them to take part in the sacrifice
  preserved_meaning: Samuel ritually prepared Jesse and his sons and included them in the sacrificial event.
  reasoning_layer_used: POB lexical decisions for וַיְקַדֵּשׁ and וַיִּקְרָא לָהֶם לַזָּבַח
  rationale: Naming Samuel removes an unclear pronoun, while plain wording explains their consecration and invitation.
interpretive_expansions:
- pob_phrase: Peace.
  rendering: I come in peace.
  claim: Samuel is assuring the elders that his arrival is not hostile.
  evidence:
  - The question in verse 4 concerns whether Samuel has come peacefully.
  - The POB footnote identifies the word as an assurance of peaceful intent.
  confidence: high
  alternatives_preserved:
  - All is well.
  - In peace.
- pob_phrase: invited them to the sacrifice
  rendering: invited them to take part in the sacrifice
  claim: The invitation includes Jesse and his sons as participants in the sacrificial event.
  evidence:
  - Samuel first consecrates them for the occasion.
  - The POB lexical rationale describes their inclusion in the sacrificial meal or rite.
  confidence: high
  alternatives_preserved:
  - invited them to the sacrifice
translation_notes:
  risk_flags:
  - risk: “Set apart as holy” could be mistaken for moral transformation rather than ritual preparation.
    mitigation: The immediate references to the sacrifice keep the phrase within its ceremonial setting.
  - risk: “Take part” states the purpose of the invitation more directly than the Hebrew wording.
    mitigation: Samuel’s prior consecration of them and the POB rationale strongly support participation.
