  preserved_meaning: Samuel used a horn as the container for the anointing oil.
  reasoning_layer_used: lexical decision for קֶרֶן הַשֶּׁמֶן
  rationale: The rewrite clarifies the container relationship while keeping the concrete horn image.
- pob_phrase: in the midst of his brothers
  simplified_phrase: among his brothers
  preserved_meaning: David was anointed in the presence of his male siblings.
  reasoning_layer_used: lexical and theological decisions for בְּקֶרֶב אֶחָיו
  rationale: “Among” is more natural English without making broader claims about public recognition.
- pob_phrase: from that day onward; rose and went
  simplified_phrase: from that day on; got up and went
  preserved_meaning: The Spirit’s empowering presence continued, and Samuel then departed for Ramah.
  reasoning_layer_used: lexical decisions for מֵהַיּוֹם הַהוּא וָמָעְלָה and וַיָּקָם
  rationale: These common expressions preserve the duration and narrative sequence.
