translation:
  language: en
  text: Then Samuel took the oil-filled horn and anointed David among his brothers. From that day on, the Spirit of Yahweh[a] rushed upon David.[b] Then Samuel got up and went to Ramah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the spirit of Yahweh.” Hebrew does not distinguish uppercase and lowercase letters.
    reason: alternative_reading
  - marker: b
    text: Or “came powerfully upon David.” The Hebrew describes the Spirit coming with force to empower him.
    reason: lexical_alternative
