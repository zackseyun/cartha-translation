translation:
  language: en
  text: Then David’s men said to him, “Look! This is the day Yahweh spoke of when he said, ‘Look, I am giving your enemy into your hand. You may do to him whatever you think is best.’” David got up and secretly cut off the corner of Saul’s robe.
