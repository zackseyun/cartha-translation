simplification_decisions:
- pob_phrase: the day of which Yahweh said to you
  simplified_phrase: the day Yahweh spoke of
  preserved_meaning: The men identify this moment as the day Yahweh had spoken about.
  reasoning_layer_used: theological decision and immediate narrative context
  rationale: The claim remains within the men’s speech and is not endorsed by the narrator.
- pob_phrase: as seems good in your eyes
  simplified_phrase: whatever you think is best
  preserved_meaning: David may act according to his own judgment about what is best.
  reasoning_layer_used: lexical decision and immediate narrative context
  rationale: This keeps the idiom subjective without implying that the proposed action is morally right.
- pob_phrase: David arose
  simplified_phrase: David got up
  preserved_meaning: David rises in order to act.
  reasoning_layer_used: lexical decision
  rationale: “Got up” is clear, natural modern narrative English.
translation_notes:
