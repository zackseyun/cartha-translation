translation:
  language: en
  text: 'My father,[a] look! Yes, look at the corner of your robe in my hand. I cut it off, but I did not kill you. See this and understand: my hand is free from evil and rebellion, and I have not sinned against you. Yet you are hunting me down to take my life.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: David calls Saul “my father” as a respectful, family-like form of address.
    reason: cultural_note
simplification_decisions:
- pob_phrase: see—yes, see
  simplified_phrase: look! Yes, look
  preserved_meaning: The repeated command remains urgent and emphatic.
  reasoning_layer_used: lexical decision on רְאֵה גַּם רְאֵה
  rationale: Common wording and punctuation make David’s insistence immediately clear.
- pob_phrase: For when I cut off the corner of your robe, I did not kill you
  simplified_phrase: I cut it off, but I did not kill you
  preserved_meaning: David contrasts taking part of Saul’s robe with sparing Saul’s life.
  reasoning_layer_used: lexical decisions on כִּי בְּכָרְתִי and וְלֹא הֲרַגְתִּיךָ
  rationale: Two direct clauses express the same explanation and contrast more naturally.
- pob_phrase: there is no evil or rebellion in my hand
  simplified_phrase: my hand is free from evil and rebellion
  preserved_meaning: David denies both wrongdoing and rebellion while retaining the hand image of agency.
  reasoning_layer_used: lexical and theological decisions on אֵין בְּיָדִי רָעָה וָפֶשַׁע
  rationale: The recast image is understandable English without losing the political force of “rebellion.”
translation_notes:
  risk_flags:
  - risk: “My father” may sound like a claim that Saul is David’s biological father.
    mitigation: A brief cultural note identifies it as David’s respectful form of address.
  - risk: “Rebellion” narrows a term that can also mean transgression.
    mitigation: The rendering follows the controlling theological decision while retaining “evil” for the broader moral denial.
