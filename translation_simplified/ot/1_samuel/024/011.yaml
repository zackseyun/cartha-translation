translation:
  language: en
  text: 'See for yourself: today in the cave, Yahweh gave me power over you. Someone said that I should kill you,[a] but I spared you.[b] I said, “I will not raise my hand against my lord, because he is the king Yahweh has anointed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name the speaker; it may mean “he said” or “it was said” that David should kill Saul.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean “I had pity on you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, this day your own eyes have seen
  simplified_phrase: 'See for yourself: today'
  preserved_meaning: Saul personally witnessed what David is pointing out.
  reasoning_layer_used: Lexical decisions on הִנֵּה and רָאוּ עֵינֶיךָ
  rationale: “See for yourself” naturally preserves the emphatic eyewitness force.
- pob_phrase: gave you today into my hand
  simplified_phrase: gave me power over you
  preserved_meaning: Yahweh placed Saul under David’s control.
  reasoning_layer_used: Lexical decision on נְתָנְךָ ... בְּיָדִי
  rationale: This explains the hand idiom while retaining Yahweh’s agency.
- pob_phrase: stretch out my hand against my lord
  simplified_phrase: raise my hand against my lord
  preserved_meaning: David refused to take hostile action against Saul, his superior.
  reasoning_layer_used: Lexical decisions on לֹא אֶשְׁלַח יָדִי and בַּאדֹנִי
  rationale: “Raise my hand against” is a familiar English image for hostile action.
