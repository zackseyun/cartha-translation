translation:
  language: en
  text: David held his men back by what he said and would not let them rise up against Saul.[a] Then Saul left the cave and went on his way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “David sharply rebuked his men.” The Hebrew verb is rare and may be stronger than “held back.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: restrained his men with words
  simplified_phrase: held his men back by what he said
  preserved_meaning: David used speech to prevent his men from acting against Saul.
  reasoning_layer_used: POB lexical decisions for וַיְשַׁסַּע and בַּדְּבָרִים
  rationale: The rewrite makes the means and result immediately clear while retaining the verb’s uncertainty in the footnote.
- pob_phrase: did not allow them to rise up against Saul
  simplified_phrase: would not let them rise up against Saul
  preserved_meaning: David refused to permit hostile action against Saul.
  reasoning_layer_used: POB lexical decisions for וְלֹא נְתָנָם and לָקוּם אֶל־שָׁאוּל
  rationale: “Would not let” is common English, while “rise up against” preserves the Hebrew image.
- pob_phrase: Saul rose from the cave and went on his way
  simplified_phrase: Saul left the cave and went on his way
  preserved_meaning: Saul departed from the cave and continued his journey.
  reasoning_layer_used: POB lexical decisions for קָם מֵהַמְּעָרָה and וַיֵּלֶךְ בַּדָּרֶךְ
  rationale: “Left the cave” states the narrative movement naturally without changing Saul’s action.
