- pob_phrase: Far be it from me, because of Yahweh
  simplified_phrase: Out of reverence for Yahweh, I would never
  preserved_meaning: David strongly rejects the act because of his regard for Yahweh.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: This states the idiom’s force and its Yahweh-grounded reason in natural English.
- pob_phrase: do this thing to my lord
  simplified_phrase: do this to my lord
  preserved_meaning: David refuses the contemplated action against Saul while speaking of him respectfully.
  reasoning_layer_used: POB lexical decisions for הַדָּבָר הַזֶּה and לַאדֹנִי
  rationale: Removing “thing” makes the clause direct without changing its reference.
- pob_phrase: to stretch out my hand against him
