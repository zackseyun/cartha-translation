  preserved_meaning: David refuses violent action against Saul while retaining the hand image.
  reasoning_layer_used: POB lexical decision for לִשְׁלֹחַ יָדִי בּוֹ
  rationale: The added verb makes the hostile force of the Hebrew hand idiom immediately clear.
