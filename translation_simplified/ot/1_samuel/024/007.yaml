translation:
  language: en
  text: He told his men, “Out of reverence for Yahweh, I would never do this to my lord, Yahweh’s anointed.[a] I would never raise my hand to attack him, because he is Yahweh’s anointed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh’s anointed” means the king Yahweh had set apart for this role.
    reason: simplification_note
