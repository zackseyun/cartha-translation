translation:
  language: en
  text: Then David said to Saul, “Why do you pay attention to a man[a] who says, ‘Look, David is trying to harm you’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “human words,” but its singular form likely points to an accuser.
    reason: lexical_alternative
