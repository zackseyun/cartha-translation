  preserved_meaning: Eli will witness trouble associated with the dwelling place without specifying its exact relation.
  reasoning_layer_used: lexical and theological decisions on צַר מָעוֹן
  rationale: “Connected with” keeps the difficult Hebrew relation open while making the clause readable.
- pob_phrase: in all the good that he does for Israel
  simplified_phrase: even while God does good for Israel
  preserved_meaning: The trouble occurs amid God's beneficial action toward Israel.
  reasoning_layer_used: lexical decision on בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  rationale: Natural clause order clarifies the contrast and names the contextually implied subject.
- pob_phrase: there will not be an old man in your house all the days
  simplified_phrase: Throughout the days to come, no man in your family will live to old age
  preserved_meaning: The continuing judgment prevents men in Eli's family line from reaching old age.
  reasoning_layer_used: lexical decisions on זָקֵן, בְּבֵיתְךָ, and כָּל הַיָּמִים
  rationale: The family-line meaning and continuing future duration are stated in natural English.
