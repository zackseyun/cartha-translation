translation:
  language: en
  text: You will see trouble connected with the dwelling place,[a] even while God does good for Israel. Throughout the days to come, no man in your family will live to old age.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may instead mean “an adversary in the dwelling place” or “distress at the sanctuary.”
    reason: alternative_reading
