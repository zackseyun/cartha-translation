translation:
  language: en
  text: Was it not I who chose him from all the tribes of Israel to be my priest—to go up to my altar, burn incense, and wear an ephod[a] in my presence? I also gave your father’s family line all the food offerings[b] of the sons of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was a sacred garment associated with priestly service.
    reason: cultural_note
  - marker: b
    text: More literally, “all the offerings made by fire.”
    reason: lexical_alternative
