- pob_phrase: No, my sons; for
  simplified_phrase: No, my sons!
  preserved_meaning: Eli sharply rebukes his sons before explaining why.
  reasoning_layer_used: POB lexical decisions for אַל and כִּי
  rationale: An exclamation and a new sentence make the rebuke natural without weakening it.
- pob_phrase: the report that I hear is not good
