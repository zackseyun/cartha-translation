  preserved_meaning: Eli condemns the continuing reports about his sons’ conduct.
  reasoning_layer_used: POB lexical decisions for הַשְּׁמֻעָה and אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  rationale: This removes the stiff relative clause and conveys the participle’s possible ongoing force.
- pob_phrase: You are making Yahweh’s people transgress
  simplified_phrase: You are causing Yahweh’s people to sin
  preserved_meaning: The sons’ conduct leads God’s people to violate covenant faithfulness.
  reasoning_layer_used: POB lexical and theological decisions for מַעֲבִרִים עַם יְהוָה
  rationale: “Sin” communicates “transgress” clearly while retaining the controlling interpretation.
