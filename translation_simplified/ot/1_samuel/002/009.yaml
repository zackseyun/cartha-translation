translation:
  language: en
  text: He guards the steps of his faithful ones,[a] but the wicked are silenced in darkness.[b] For no man prevails through strength alone.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew textual tradition may also be read as “his faithful one,” but the plural fits the poetic contrast and collective sense.
    reason: textual_variant
  - marker: b
    text: Or “are stilled” or “are cut off”; the Hebrew verb can refer to being silent or being brought to stillness.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew uses the singular word “man” here in a general sense.
    reason: lexical_alternative
