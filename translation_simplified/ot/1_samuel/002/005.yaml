translation:
  language: en
  text: Those who once had plenty now hire themselves out for bread, but those who were hungry no longer go hungry. Even the woman who could not bear children has given birth to seven sons[a], while the woman who had many sons has grown weak and withered away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seven” may be literal, or it may poetically express complete fruitfulness.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Those who were full
  simplified_phrase: Those who once had plenty
  preserved_meaning: People who formerly enjoyed abundance are now in need.
  reasoning_layer_used: POB lexical decision for שְׂבֵעִים and the reversal motif
  rationale: “Had plenty” clearly expresses former abundance without suggesting only a full stomach.
- pob_phrase: the barren woman has borne seven
  simplified_phrase: the woman who could not bear children has given birth to seven sons
  preserved_meaning: A previously childless woman experiences extraordinary fruitfulness.
  reasoning_layer_used: POB lexical decisions for עֲקָרָה and יָלְדָה שִׁבְעָה, with the retained sons note
  rationale: The wording replaces a difficult traditional term and an archaic birth expression with ordinary English.
- pob_phrase: has withered away
  simplified_phrase: has grown weak and withered away
  preserved_meaning: The formerly fruitful woman has declined in strength and well-being.
  reasoning_layer_used: POB lexical decision for אֻמְלָלָה
  rationale: “Grown weak” clarifies the decline while preserving the poetic image of withering.
