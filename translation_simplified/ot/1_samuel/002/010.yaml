  confidence: high
  alternatives_preserved:
  - the ends of the earth
  - the farthest parts of the earth
- pob_phrase: lift up the horn
  rendering: raise high the horn, with the image explained in the footnote
  claim: The raised horn portrays exalted strength and honor without limiting the image to victory alone.
  evidence:
  - The lexical rationale gives strength, dignity, and victorious power as overlapping senses.
  confidence: high
  alternatives_preserved:
  - lift up the horn
  - raise up the strength
translation_notes:
  risk_flags:
  - risk: “Anointed one” may leave the term’s canonical messianic significance unclear.
    mitigation: The footnote gives “his Messiah” and explains the title’s connection to the anointed king.
  - risk: Modern readers may not understand the raised-horn image.
    mitigation: The footnote identifies it broadly as an image of strength and honor.
