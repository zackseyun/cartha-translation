translation:
  language: en
  text: Those who fight against Yahweh will be shattered. He will thunder against them from heaven. Yahweh will judge the whole earth, even its farthest reaches. He will give strength to his king and raise high the horn of his anointed one.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “his Messiah.” The Hebrew term refers to Yahweh’s anointed king and is the source of the title “Messiah.” The “horn” is an image of strength and honor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yahweh’s adversaries
  simplified_phrase: Those who fight against Yahweh
  preserved_meaning: Those who oppose Yahweh are the ones who will be defeated.
  reasoning_layer_used: Lexical decision for מְרִיבוֹ עָלָיו
  rationale: The verbal wording makes “adversaries” immediately clear without weakening the hostility.
- pob_phrase: the ends of the earth
  simplified_phrase: the whole earth, even its farthest reaches
  preserved_meaning: Yahweh’s judgment extends everywhere, including the remotest places.
  reasoning_layer_used: Lexical decision for אַפְסֵי אָרֶץ
  rationale: The wording explains the idiom while preserving its worldwide scope.
- pob_phrase: lift up the horn of his anointed
  simplified_phrase: raise high the horn of his anointed one
  preserved_meaning: Yahweh will exalt the strength and honor of his anointed king.
  reasoning_layer_used: Lexical and theological decisions for קֶרֶן and מְשִׁיחוֹ
  rationale: The text retains the horn image and immediate royal sense while the footnote preserves its messianic significance.
interpretive_expansions:
- pob_phrase: the ends of the earth
  rendering: the whole earth, even its farthest reaches
  claim: The phrase expresses the worldwide reach of Yahweh’s judgment.
  evidence:
