- pob_phrase: to seat them with nobles and make them inherit a seat of honor
  simplified_phrase: He seats them among nobles and gives them a seat of honor as their inheritance.
  preserved_meaning: The lowly receive honored status as a lasting gift.
  reasoning_layer_used: Lexical and theological decisions for נְדִיבִים, כִסֵּא כָבוֹד, and יַנְחִלֵם.
  rationale: A new sentence clarifies the social reversal and preserves the inheritance motif.
- pob_phrase: the pillars of the earth belong to Yahweh, and on them he has set the world
  simplified_phrase: the earth’s pillars belong to the LORD, and he set the world on them
  preserved_meaning: The LORD owns the world’s supports and established the world upon them.
  reasoning_layer_used: Theological decision on cosmological imagery and lexical decision for the divine name.
  rationale: The shorter clause order is easier to follow without flattening the poetic image.
