simplification_decisions:
- pob_phrase: He raises the poor from the dust; he lifts the needy from the ash heap
  simplified_phrase: He lifts the poor out of the dust and raises the needy from the ash heap.
  preserved_meaning: The LORD raises people from poverty, need, and humiliation.
  reasoning_layer_used: Lexical decisions for מֵעָפָר, דָּל, מֵאַשְׁפֹּת, and אֶבְיוֹן.
