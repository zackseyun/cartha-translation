translation:
  language: en
  text: 'Therefore Yahweh, the God of Israel, declares: “I truly said that your family line and your father’s family line would always walk before me, living and serving in my presence. But now I, Yahweh, declare: That will no longer be so! I will honor those who honor me, but those who despise me will be treated as insignificant.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be dishonored” or “will be treated as of little account.” The Hebrew contrasts being made light with being honored.
    reason: lexical_alternative
