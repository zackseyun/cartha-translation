  text: I will appoint for myself a faithful priest. He will do what my heart and soul desire. I will build an enduring household for him. He will live in the presence of my anointed one all his days.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My anointed one” may also be rendered “my king” or “my Messiah.” In this historical setting, it most naturally refers to the LORD’s anointed ruler.
    reason: alternative_reading
