translation:
  language: en
  text: Why do all of you treat my sacrifices and offerings with contempt[a], which I commanded for the dwelling place[b]? Why do you honor your sons more than me, making yourselves fat from the first portion of every offering of Israel, my people?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has the vivid image of contemptuously kicking at what God commanded.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean “for my dwelling” or “in my dwelling,” referring to the sanctuary.
    reason: alternative_reading
  - marker: c
    text: “First portion” may also mean the choicest or best portion.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: scorn my sacrifice and my offering
  simplified_phrase: treat my sacrifices and offerings with contempt
  preserved_meaning: God rebukes contemptuous rejection of the sacrifices and offerings he commanded.
  reasoning_layer_used: Lexical decisions for תִבְעֲטוּ, זִבְחִי, and מִנְחָתִי.
  rationale: Common wording states the rebuke clearly while the note preserves the Hebrew kicking image.
- pob_phrase: Why do you scorn ... and honor your sons above me
  simplified_phrase: Why do all of you ...? Why do you honor your sons more than me
  preserved_meaning: The rebuke begins with a plural address and then focuses on Eli personally.
  reasoning_layer_used: Theological decision on the shift from plural to singular.
  rationale: Two questions make the change in addressee and the moral contrast easy to follow.
- pob_phrase: fattening yourselves from the first of every offering of Israel
  simplified_phrase: making yourselves fat from the first portion of every offering of Israel
  preserved_meaning: Eli and his sons grew well-fed from portions taken from Israel’s offerings.
  reasoning_layer_used: Lexical decisions for לְהַבְרִיאֲכֶם, מֵרֵאשִׁית, and כָּל מִנְחַת יִשְׂרָאֵל.
  rationale: The wording keeps the concrete image and clarifies that a portion of each offering is meant.
