translation:
  language: en
  text: Look, the time is coming when I will cut off your strength and the strength of your ancestral family.[a] No man in your family will live to old age.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “your arm and the arm of your father’s house.” In Hebrew, the arm is an image of strength or power.
