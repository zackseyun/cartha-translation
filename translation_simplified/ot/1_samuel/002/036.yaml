  text: Everyone who remains in your family will come and bow down before him to get a small piece of silver[a] and a loaf of bread. Each one will say, “Please give me a place in the priestly service[b], so that I may eat a piece of bread.”
  philosophy: optimal-equivalence
  footnotes:
