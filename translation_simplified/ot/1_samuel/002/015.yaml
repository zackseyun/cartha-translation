  text: Before they had even burned the fat from the sacrifice, the priest’s servant[a] would come to the man making the offering and say, “Give the priest meat to roast. He will not take boiled meat from you—only raw meat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean a young man, servant, or attendant; here it likely means someone serving the priest.
    reason: lexical_alternative
