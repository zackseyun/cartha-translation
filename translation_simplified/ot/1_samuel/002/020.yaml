translation:
  language: en
  text: Eli would bless Elkanah and his wife. He would say, “May Yahweh give you more children through this woman in place of the child she asked Yahweh for and then gave to him.” Then they would return home.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses related words for asking and for what was asked or lent, echoing how Hannah asked for Samuel and then gave him to Yahweh.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is grammatically masculine, but the story identifies Hannah as the one who asked Yahweh for the child.
    reason: alternative_reading
