translation:
  language: en
  text: But I will not remove all your male descendants from serving at my altar. I will leave some of them there to make your eyes fail with sorrow and your soul grieve. Yet all the descendants of your family will die as men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will die in the prime of life.” The Hebrew literally says “will die as men.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I will not cut off every man of yours from beside my altar
  simplified_phrase: I will not remove all your male descendants from serving at my altar
  preserved_meaning: God will not immediately remove Eli’s entire male line from proximity to altar service.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording makes the partial removal and family relationship clear without losing the remnant under judgment.
- pob_phrase: to make your eyes fail and your soul grieve
  simplified_phrase: to make your eyes fail with sorrow and your soul grieve
  preserved_meaning: The survivors will cause prolonged anguish while preserving the Hebrew images of failing eyes and a grieving soul.
  reasoning_layer_used: lexical decisions
  rationale: Adding “with sorrow” explains the bodily image without replacing it.
- pob_phrase: all the increase of your house
  simplified_phrase: all the descendants of your family
  preserved_meaning: The multiplying members of Eli’s family line are under judgment.
  reasoning_layer_used: lexical decision
  rationale: Common family language replaces an opaque metaphor while retaining its referent.
interpretive_expansions:
- pob_phrase: from beside my altar
  rendering: from serving at my altar
  claim: The altar language concerns continued priestly proximity or service.
  evidence:
