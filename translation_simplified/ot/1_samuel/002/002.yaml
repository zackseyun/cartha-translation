translation:
  language: en
  text: No one is holy like Yahweh, for there is no God besides you. There is no rock like our God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: There is none holy like Yahweh
  simplified_phrase: No one is holy like Yahweh
  preserved_meaning: Yahweh is incomparable in holiness.
  reasoning_layer_used: Lexical decisions for אֵין, קָדוֹשׁ, and כַּיהוָה
  rationale: Direct subject-first wording is clearer while preserving holiness, comparison, and the divine name.
- pob_phrase: for there is none besides you
  simplified_phrase: for there is no God besides you
  preserved_meaning: Yahweh alone is God, which grounds the claim that none is holy like him.
  reasoning_layer_used: Lexical decision for בִּלְתֶּךָ, the כִּי rationale, and immediate poetic parallelism
  rationale: Naming God prevents readers from mistaking the line as a denial that other persons exist and retains the explanatory link.
- pob_phrase: and there is no rock like our God
  simplified_phrase: There is no rock like our God.
  preserved_meaning: No source of strength, stability, and protection compares with our God.
  reasoning_layer_used: Lexical decisions for צוּר and כֵּאלֹהֵינוּ
  rationale: A separate sentence eases reading while retaining the concrete rock image and repeated negative.
interpretive_expansions:
- pob_phrase: there is none besides you
  rendering: there is no God besides you
  claim: The excluded comparison concerns any other deity, not all other persons.
  evidence:
  - The clause stands between claims that none is holy like Yahweh and no rock is like our God.
  - The prayer directly addresses Yahweh and confesses his exclusive divine uniqueness.
  confidence: high
  alternatives_preserved:
  - there is none besides you
  - there is none apart from you
translation_notes:
  risk_flags:
  - risk: Making “God” explicit narrows the formally indefinite “none.”
    mitigation: The surrounding parallel lines clearly establish divine uniqueness as the intended domain.
  - risk: Modern readers may not immediately understand “rock” as an image of strength, stability, and protection.
    mitigation: The main text retains the Hebrew image rather than reducing it to a single meaning.
