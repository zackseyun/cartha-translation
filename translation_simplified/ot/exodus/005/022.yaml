translation:
  language: en
  text: Then Moses went back to Yahweh and said, “Lord, why have you brought suffering on these people? So why did you send me?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: returned to Yahweh
  simplified_phrase: went back to Yahweh
  preserved_meaning: Moses returned to address Yahweh after Pharaoh’s response.
  reasoning_layer_used: Lexical decision for וַיָּשָׁב
  rationale: “Went back” expresses the same movement in more natural everyday English.
- pob_phrase: brought harm on this people
  simplified_phrase: brought suffering on these people
  preserved_meaning: Moses accuses God of causing Israel’s present distress, not of committing moral evil.
  reasoning_layer_used: Lexical decision and doctrine realignment for הֲרֵעֹתָה
  rationale: “Brought suffering” makes the concrete effect of the harm immediately understandable.
- pob_phrase: Why then did you send me?
  simplified_phrase: So why did you send me?
  preserved_meaning: Moses emphatically questions his mission in light of the harm that followed.
  reasoning_layer_used: Lexical decision and POB footnote for לָמָּה זֶּה
  rationale: “So why” naturally conveys the idiom’s emphatic connection to the preceding complaint.
translation_notes:
  risk_flags:
  - risk: “Brought suffering” may sound like a broader theological claim about God causing all suffering.
    mitigation: The wording remains limited to Moses’ complaint about this people in this situation.
