  preserved_meaning: The workers must keep producing bricks despite receiving no straw.
  reasoning_layer_used: Lexical decision for אֹמְרִים לָנוּ עֲשׂוּ and immediate context
  rationale: The passive wording clarifies the demand without naming speakers the verse leaves unnamed.
- pob_phrase: And behold
  simplified_phrase: Look—
  preserved_meaning: The speaker urgently points Pharaoh to the obvious injustice.
  reasoning_layer_used: Lexical decision for וְהִנֵּה
  rationale: “Look” preserves the emphatic appeal in natural modern English.
- pob_phrase: but the fault is with your own people
  simplified_phrase: but your own people are to blame
  preserved_meaning: Pharaoh’s people, not the Israelite workers, bear responsibility.
  reasoning_layer_used: Lexical decision for וְחָטָאת עַמֶּךָ and grounding review
  rationale: “But” preserves the contrast without adding a specifically concessive relationship.
