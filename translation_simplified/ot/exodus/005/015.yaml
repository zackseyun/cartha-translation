translation:
  language: en
  text: Then the Israelite officers[a] came to Pharaoh and cried out, “Why are you doing this to your servants?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “officers of the sons of Israel.” These were Israelites serving as labor administrators under Egyptian authority.
    reason: simplification_note
  - marker: b
    text: “Servants” may also be translated “slaves”; here they use deferential language when speaking to Pharaoh.
    reason: lexical_alternative
