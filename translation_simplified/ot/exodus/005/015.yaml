  preserved_meaning: The officers belonged to the people of Israel.
  reasoning_layer_used: POB lexical decision and listed alternative for בְּנֵי יִשְׂרָאֵל
  rationale: The ethnic adjective is immediately clear while the literal family expression remains in a note.
- pob_phrase: saying
  simplified_phrase: omitted after “cried out”
  preserved_meaning: Their outcry directly introduces the quoted plea.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: English does not need a second speech introducer before the quotation.
- pob_phrase: Why do you do this to your servants?
  simplified_phrase: Why are you doing this to your servants?
  preserved_meaning: They urgently challenge Pharaoh’s present oppressive treatment of them.
  reasoning_layer_used: POB lexical decision for תַעֲשֶׂה כֹה and applied revision
  rationale: The progressive form sounds natural and keeps the approved wording “do this to.”
