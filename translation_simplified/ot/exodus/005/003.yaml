translation:
  language: en
  text: They said,[a] “The God of the Hebrews has met with us. Please let us make a three-day journey into the wilderness so that we can sacrifice to Yahweh our God. Otherwise, he may strike us with plague or with the sword.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “has called us.” The Hebrew can mean that God met with them or summoned them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: go a journey of three days
  simplified_phrase: make a three-day journey
  preserved_meaning: They request permission to travel the distance associated with three days.
  reasoning_layer_used: lexical decision for דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  rationale: The shorter phrase expresses the Hebrew travel idiom in natural English.
- pob_phrase: so that we may sacrifice
  simplified_phrase: so that we can sacrifice
  preserved_meaning: The journey’s purpose is to offer sacrifices to Yahweh.
  reasoning_layer_used: lexical decision and doctrine realignment for וְנִזְבְּחָה
  rationale: “Can” makes the requested purpose easier to follow without reducing sacrifice to a general act of worship.
- pob_phrase: lest he strike us
  simplified_phrase: Otherwise, he may strike us
  preserved_meaning: Failure to sacrifice could bring punitive judgment from God.
  reasoning_layer_used: lexical decisions for פֶּן and יִפְגָּעֵנוּ
  rationale: A new sentence replaces the less familiar “lest” while retaining the warning and “strike” language.
translation_notes:
  risk_flags:
  - risk: “Otherwise” may sound more categorical than the compact Hebrew warning particle.
    mitigation: “May strike us” preserves the warning as a threatened possibility rather than a certain outcome.
