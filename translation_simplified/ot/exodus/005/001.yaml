translation:
  language: en
  text: 'After this, Moses and Aaron entered Pharaoh’s presence and told him, “This is what Yahweh, the God of Israel, says: ‘Let my people go, so they can celebrate a festival for me in the wilderness.’”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: went in and said to Pharaoh
  simplified_phrase: entered Pharaoh’s presence and told him
  preserved_meaning: Moses and Aaron appeared before Pharaoh and delivered a message to him.
  reasoning_layer_used: Lexical rationale for בָּאוּ and the immediate narrative context
  rationale: This makes the implied royal audience clear in ordinary English.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The message carries Yahweh’s direct authority.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר and theological decision for יְהוָה
  rationale: The modern formula remains formal and keeps the divine name Yahweh.
- pob_phrase: hold a feast to me
  simplified_phrase: celebrate a festival for me
  preserved_meaning: Israel is to observe a religious festival honoring Yahweh.
  reasoning_layer_used: Lexical rationale for וְיָחֹגּוּ לִי
  rationale: “Celebrate a festival” is clearer while preserving the specific festal act.
