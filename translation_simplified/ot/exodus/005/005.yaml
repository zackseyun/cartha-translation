translation:
  language: en
  text: Pharaoh said, “Look, the people in the land are now many, and you are making them stop working under their burdens.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you are making them stop their labor.” The Hebrew verb means to cause someone to stop or rest.
