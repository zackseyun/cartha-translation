simplification_decisions:
- pob_phrase: the people of the land are now many
  simplified_phrase: the people in the land are now many
  preserved_meaning: Pharaoh points to the identified laboring people as a large group now present in the land.
  reasoning_layer_used: POB lexical decisions for עַם הָאָרֶץ, רַבִּים, and עַתָּה
  rationale: This keeps the definite group reference while using a more natural English phrase.
- pob_phrase: you are making them rest from their burdens
  simplified_phrase: you are making them stop working under their burdens
  preserved_meaning: Moses and Aaron are causing the people to cease from their imposed labor burdens.
  reasoning_layer_used: POB lexical decisions for וְהִשְׁבַּתֶּם and מִסִּבְלֹתָם, supported by Exodus 5:4–5
  rationale: This states the labor setting plainly while preserving the causative force and burden image.
interpretive_expansions:
- pob_phrase: rest from their burdens
  rendering: stop working under their burdens
  claim: The burdens are imposed labor from which Moses and Aaron are causing the people to cease.
  evidence:
