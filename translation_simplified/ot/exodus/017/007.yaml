- pob_phrase: because of the quarreling of the sons of Israel
  simplified_phrase: because the sons of Israel quarreled
  preserved_meaning: The people's dispute was one reason for the place names.
  reasoning_layer_used: The lexical decision says the construction gives the reason and that the noun denotes quarreling.
  rationale: A direct verb is easier to understand than the abstract phrase “because of the quarreling.”
- pob_phrase: because they tested Yahweh, saying
  simplified_phrase: tested Yahweh by saying
  preserved_meaning: Their question was the way they put Yahweh to the test.
  reasoning_layer_used: The lexical decisions preserve Yahweh as the object of testing and introduce the content of their challenge.
  rationale: “By saying” clearly connects their spoken challenge with their testing of Yahweh.
