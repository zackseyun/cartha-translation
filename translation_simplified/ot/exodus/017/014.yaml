translation:
  language: en
  text: Then Yahweh said to Moses, “Write this in the book so it will be remembered, and make sure Joshua hears it. I will certainly erase the memory of Amalek from under heaven.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Write this as a memorial in the book
  simplified_phrase: Write this in the book so it will be remembered
  preserved_meaning: Moses must make a written record that preserves the event in memory.
  reasoning_layer_used: POB lexical decisions for זֹאת זִכָּרוֹן and בַּסֵּפֶר
  rationale: The memorial purpose is stated directly while “the book” is retained.
- pob_phrase: put it in Joshua’s hearing
  simplified_phrase: make sure Joshua hears it
  preserved_meaning: Joshua must be caused to hear the message, without specifying how it is delivered.
  reasoning_layer_used: POB lexical decision and alternatives for וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  rationale: This makes the idiom clear without narrowing it to reading aloud.
- pob_phrase: I will surely blot out the remembrance of Amalek
  simplified_phrase: I will certainly erase the memory of Amalek
  preserved_meaning: Yahweh emphatically promises to remove Amalek from remembrance.
  reasoning_layer_used: POB lexical decisions for מָחֹה אֶמְחֶה and זֵכֶר עֲמָלֵק
  rationale: “Certainly” retains the emphasis, and “erase” preserves the removal image.
translation_notes:
  risk_flags:
  - risk: Changing “blot out” to “erase” may soften the ancient image.
    mitigation: “Erase” still presents remembrance as something deliberately removed.
  - risk: The formal memorial/remembrance wordplay is recast.
    mitigation: “Remembered” and “memory” preserve the deliberate contrast in common English.
