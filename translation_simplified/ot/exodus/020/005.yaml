translation:
  language: en
  text: Do not bow down before them or serve them.[a] For I am Yahweh your God, a jealous God. I visit the iniquity of fathers on their children, to the third and fourth generation of those who hate me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worship them.” Here “serve” includes religious service offered to idols.
    reason: lexical_alternative
  - marker: b
    text: “Visit the iniquity” is a Hebrew expression for God actively dealing with wrongdoing; compare Deuteronomy 24:16 and Ezekiel 18 on individual responsibility.
    reason: cross_reference
simplification_decisions:
- pob_phrase: You shall not bow down to them or serve them
  simplified_phrase: Do not bow down before them or serve them
  preserved_meaning: Both the physical act of reverence and religious service remain prohibited.
  reasoning_layer_used: Lexical decisions for תִשְׁתַּחֲוֶה and תָעָבְדֵם
  rationale: The direct command is clearer while keeping the two actions distinct.
- pob_phrase: for I, Yahweh your God, am a jealous God
  simplified_phrase: For I am Yahweh your God, a jealous God
  preserved_meaning: Yahweh claims Israel’s exclusive covenant devotion.
  reasoning_layer_used: Divine-name and theological decisions
  rationale: The natural word order retains Yahweh’s name and the covenant force of “jealous.”
- pob_phrase: visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me
  simplified_phrase: I visit the iniquity of fathers on their children, to the third and fourth generation of those who hate me
  preserved_meaning: God actively deals with fathers’ wrongdoing across generations without specifying the exact mechanism.
  reasoning_layer_used: Lexical and theological decisions on intergenerational judgment
  rationale: “To” keeps the generational scope readable without the over-specific force of “through.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “jealous” as selfish envy.
    mitigation: The term remains because the context concerns Yahweh’s rightful claim to exclusive covenant devotion.
  - risk: The intergenerational warning may be read as automatic inherited guilt.
    mitigation: The Hebrew idiom and cross-references preserve the POB’s deliberate theological restraint.
