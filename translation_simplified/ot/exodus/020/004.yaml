translation:
  language: en
  text: You must not make for yourself a carved image or any representation of anything in the heavens above, on the earth below, or in the waters under the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'This describes creation in ancient spatial terms: the heavens above, the earth below, and the waters under the earth.'
    reason: cultural_note
simplification_decisions:
- pob_phrase: You shall not make
  simplified_phrase: You must not make
  preserved_meaning: The wording remains a direct and binding prohibition.
  reasoning_layer_used: Lexical decision for תַעֲשֶׂה with לֹא
  rationale: “Must not” communicates the command's legal force in familiar modern English.
- pob_phrase: or any likeness of what is
  simplified_phrase: or any representation of anything
  preserved_meaning: The command includes forms or likenesses drawn from the created order.
  reasoning_layer_used: Lexical decision for וְכָל תְּמוּנָה
  rationale: “Representation” makes the scope clearer without interpreting the object as an idol.
- pob_phrase: on the earth beneath
  simplified_phrase: on the earth below
  preserved_meaning: The earth remains the middle realm in the verse's vertical picture of creation.
  reasoning_layer_used: Lexical decision and cultural note for וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  rationale: “Below” is more common than “beneath” while preserving the spatial contrast.
translation_notes:
  risk_flags:
  - risk: “Representation” may sound like an explicit ban on every kind of visual art.
    mitigation: The text does not add either “for worship” or “all art,” preserving the POB's theological tension and immediate context.
