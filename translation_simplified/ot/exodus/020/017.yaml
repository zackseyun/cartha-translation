translation:
  language: en
  text: Do not wrongfully desire your neighbor’s house[a] for yourself. Do not wrongfully desire your neighbor’s wife, his male slave, his female slave, his ox, his donkey, or anything else that belongs to your neighbor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “household,” but “house” fits best because the members of the household are listed separately.
    reason: lexical_alternative
