translation:
  language: en
  text: This is because Yahweh made the heavens, the earth, the sea, and everything in them in six days. Then he rested[a] on the seventh day. That is why Yahweh blessed the Sabbath day and made it holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ceased from work.” The Hebrew verb can describe resting or ceasing and does not imply that Yahweh became tired.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For in six days Yahweh made the heavens and the earth, the sea, and all that is in them
  simplified_phrase: This is because Yahweh made the heavens, the earth, the sea, and everything in them in six days.
  preserved_meaning: Yahweh’s six-day work of creation gives the reason for the Sabbath command.
  reasoning_layer_used: Lexical decisions for כִּי, שֵׁשֶׁת יָמִים, and כָּל אֲשֶׁר בָּם
  rationale: The sentence uses ordinary word order while keeping the explanatory connection and complete scope of creation.
- pob_phrase: and he rested on the seventh day
  simplified_phrase: Then he rested on the seventh day.
  preserved_meaning: Yahweh rested after completing his creative work.
  reasoning_layer_used: Lexical and theological decisions for וַיָּנַח
  rationale: A separate sentence makes the sequence clear while retaining “rested” and its documented alternative.
- pob_phrase: Therefore
  simplified_phrase: That is why
  preserved_meaning: The blessing and holiness of the Sabbath follow from Yahweh’s creation pattern.
  reasoning_layer_used: Lexical decision for עַל כֵּן
  rationale: The common phrase clearly expresses the same conclusion as “Therefore.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand Yahweh’s rest as recovery from fatigue.
    mitigation: The footnote preserves “ceased from work” and states that the wording does not imply tiredness.
