- pob_phrase: a Sabbath to Yahweh your God
  simplified_phrase: a Sabbath set apart for Yahweh your God
  preserved_meaning: The seventh day is dedicated to Yahweh while the biblical term “Sabbath” remains intact.
  reasoning_layer_used: Lexical rationale for לַיהוָה and the updated theological decision for יהוה.
  rationale: “Set apart for” makes the day’s dedication clear in ordinary English.
- pob_phrase: you shall not do any work—you, or your son, or your daughter, your male slave, or your female slave, or your livestock
  simplified_phrase: You must not do any work on that day. This command applies to you, your son or daughter, your male or female slave, your livestock
  preserved_meaning: The prohibition remains comprehensive and explicitly includes every listed household member and the livestock.
  reasoning_layer_used: Lexical decisions for the legal command, work, enumeration, slaves, and livestock.
  rationale: Two sentences make the command and its full scope easier to follow.
- pob_phrase: the sojourner within your gates
  simplified_phrase: any resident foreigner living in your towns
  preserved_meaning: Non-native residents living under Israel’s local community order are included.
  reasoning_layer_used: Lexical decisions for גֵר and the gate idiom.
  rationale: The clearer alternatives explain both the person’s status and where the person lives.
