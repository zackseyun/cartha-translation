translation:
  language: en
  text: But the seventh day is a Sabbath set apart for Yahweh your God.[a] You must not do any work on that day. This command applies to you, your son or daughter, your male or female slave, your livestock, and any resident foreigner living in your towns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And the seventh day.” “But” emphasizes the contrast with the six workdays in the previous verse.
    reason: lexical_alternative
