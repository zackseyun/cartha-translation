translation:
  language: en
  text: They said to Moses, “You speak with us, and we will listen.[a] But do not let God speak with us, or we may die.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “we will hear.” The Hebrew can mean listening attentively or responding obediently.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they said to Moses
  simplified_phrase: They said to Moses
  preserved_meaning: The people address Moses as the narrative continues.
  reasoning_layer_used: Lexical decision for וַיֹּאמְרוּ
  rationale: Dropping initial “And” makes the sentence more natural without changing the narrative sequence.
- pob_phrase: but let not God speak with us
  simplified_phrase: But do not let God speak with us
  preserved_meaning: The people urgently ask that God not address them directly.
  reasoning_layer_used: Lexical decision for וְאַל יְדַבֵּר and theological decision for אֱלֹהִים
  rationale: The modern prohibition keeps both the contrast and singular reference to God.
- pob_phrase: lest we die
  simplified_phrase: or we may die
  preserved_meaning: Death is the consequence the people fear.
  reasoning_layer_used: Lexical decisions for פֶּן and נָמוּת
  rationale: The common phrase states the feared result without the less familiar word “lest.”
translation_notes:
  risk_flags:
  - risk: “May die” can sound less direct than POB’s “we die.”
    mitigation: The wording still clearly presents death as the feared consequence rather than a certain outcome.
