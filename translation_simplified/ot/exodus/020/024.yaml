  language: en
  text: Make an altar for me out of earth. On it, sacrifice your burnt offerings and peace offerings from your flocks and herds. Wherever I cause my name to be remembered,[a] I will come to you and bless you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “where I proclaim my name” or “where I record my name”; the Hebrew allows these related meanings without specifying only one.
