  reasoning_layer_used: Lexical decision for וְזָבַחְתָּ עָלָיו.
  rationale: The shorter command removes formal legal syntax while keeping the altar in view.
- pob_phrase: In every place where I cause my name to be remembered
  simplified_phrase: Wherever I cause my name to be remembered
  preserved_meaning: God designates each place where his name is memorialized without specifying the mechanism.
  reasoning_layer_used: Theological decision preserving the causative force and interpretive tension of אַזְכִּיר.
  rationale: “Wherever” expresses the distributive sense more naturally without narrowing the ambiguity.
