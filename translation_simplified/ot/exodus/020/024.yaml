  simplified_phrase: Make an altar for me out of earth
  preserved_meaning: God commands an altar made from earth and dedicated to him.
  reasoning_layer_used: Lexical decision for מִזְבַּח אֲדָמָה and legal force of תַּעֲשֶׂה לִּי.
  rationale: A direct command and “out of earth” are clearer in modern English.
- pob_phrase: and on it you shall sacrifice
  simplified_phrase: On it, sacrifice
