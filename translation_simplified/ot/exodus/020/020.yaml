translation:
  language: en
  text: Moses said to the people, “Do not fear.[a] God has come to test you, so that the fear of him will stay with you, so that you will not sin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The same Hebrew root describes both kinds of fear: panic is forbidden, but proper fear of God is meant to remain; this can also mean reverence for him.'
    reason: lexical_alternative
