  preserved_meaning: The command still uses the concrete image of carrying Yahweh’s name.
  reasoning_layer_used: Lexical decision for נשא and theological decision on the command’s scope
  rationale: “Carry” is more familiar than “bear” without reducing the command to spoken misuse.
- pob_phrase: for Yahweh will not leave unpunished the one who bears his name falsely
  simplified_phrase: Yahweh will not let anyone who carries his name that way go unpunished
  preserved_meaning: Yahweh will punish every person who violates this command.
  reasoning_layer_used: Lexical decisions for נקה and אֲשֶׁר
  rationale: The new sentence and ordinary word order make the warning easier to follow.
interpretive_expansions:
