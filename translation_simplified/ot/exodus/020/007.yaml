translation:
  language: en
  text: Do not carry the name of Yahweh your God in a false or empty way.[a] Yahweh will not let anyone who carries his name that way go unpunished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditional English says, “Do not take the name of the LORD your God in vain.” Carrying Yahweh’s name can include false oaths, empty appeals to him, or falsely representing him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall not bear the name
