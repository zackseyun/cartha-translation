translation:
  language: en
  text: For my angel[a] will go ahead of you and bring you to the Amorites, Hittites, Perizzites, Canaanites, Hivites, and Jebusites. Then I will wipe those peoples out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger.” The Hebrew word can mean a human or heavenly messenger; here the context supports “angel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will go before you
  simplified_phrase: will go ahead of you
  preserved_meaning: God’s angel will precede and guide Israel.
  reasoning_layer_used: POB lexical decision for לְפָנֶיךָ
  rationale: “Ahead of you” states the guiding movement in ordinary modern English.
- pob_phrase: and bring you to the Amorites ... and the Jebusites
  simplified_phrase: and bring you to the Amorites ... and Jebusites
  preserved_meaning: The angel will bring Israel into contact with the six named peoples.
  reasoning_layer_used: POB lexical decisions for וֶהֱבִיאֲךָ, אֶל, and the people names
  rationale: The list remains intact while repeated articles are removed for smoother English.
- pob_phrase: and I will wipe them out
  simplified_phrase: Then I will wipe those peoples out
  preserved_meaning: God promises to destroy the listed peoples collectively.
  reasoning_layer_used: POB lexical and theological decisions for וְהִכְחַדְתִּיו
  rationale: “Those peoples” makes the collective object clear, and a new sentence eases the long structure.
translation_notes:
  risk_flags:
  - risk: “Angel” could be read as identifying the figure more precisely than the Hebrew does.
    mitigation: The footnote preserves “messenger” as the lexical alternative without resolving the figure’s identity.
  - risk: “Those peoples” makes the collective reference explicit despite the Hebrew singular suffix.
    mitigation: The wording follows the POB decision that the suffix refers collectively to all six groups.
