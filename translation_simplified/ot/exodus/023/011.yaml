translation:
  language: en
  text: But in the seventh year, let the land rest and leave it uncultivated, so that the poor among your people may eat from it. The wild animals may eat what they leave. Do the same with your vineyard and your olive grove.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let it rest and leave it alone
  simplified_phrase: let the land rest and leave it uncultivated
  preserved_meaning: The land is released from normal cultivation during the seventh year.
  reasoning_layer_used: POB lexical decisions for תִּשְׁמְטֶנָּה and וּנְטַשְׁתָּהּ
  rationale: Naming the land and its uncultivated state makes the agricultural command immediately clear.
- pob_phrase: the poor of your people may eat
  simplified_phrase: the poor among your people may eat from it
  preserved_meaning: Needy members of the community may eat from the resting land.
  reasoning_layer_used: POB lexical decision for אֶבְיֹנֵי עַמֶּךָ and immediate context
  rationale: “Among” and “from it” clarify the people and the source of the food.
- pob_phrase: You shall do the same with
  simplified_phrase: Do the same with
  preserved_meaning: The same binding instruction applies to vineyards and olive groves.
  reasoning_layer_used: POB lexical decision for כֵּן תַּעֲשֶׂה
  rationale: A direct imperative is clearer while retaining the command’s force.
interpretive_expansions:
- pob_phrase: leave it alone
  rendering: leave it uncultivated
  claim: The command requires ceasing normal cultivation rather than permanently abandoning the land.
  evidence:
  - The POB footnote says the verbs emphasize leaving the land uncultivated in the seventh year.
  - The lexical rationale rejects wording that could imply permanent abandonment.
  confidence: high
  alternatives_preserved:
  - let it lie fallow
  - leave it alone
translation_notes:
  risk_flags:
  - risk: “Uncultivated” could be read as excluding all access to the land.
    mitigation: The following clause explicitly allows the poor and wild animals to eat from it.
