translation:
  language: en
  text: I will send my terror[a] ahead of you. I will throw all the people you encounter into confusion, and I will make all your enemies turn their backs and flee from you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my dread” or “my fear.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the people among whom you come
  simplified_phrase: all the people you encounter
  preserved_meaning: God will act against the populations Israel comes among.
  reasoning_layer_used: lexical decision for אֲשֶׁר תָּבֹא בָהֶם
  rationale: “Encounter” expresses coming among these people in natural modern English.
- pob_phrase: I will make all your enemies turn their backs to you
  simplified_phrase: I will make all your enemies turn their backs and flee from you
  preserved_meaning: God will cause Israel’s enemies to retreat.
  reasoning_layer_used: lexical decision for וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  rationale: The wording keeps the Hebrew image while making its meaning immediately clear.
- pob_phrase: I will send my terror ahead of you, and I will throw
  simplified_phrase: I will send my terror ahead of you. I will throw
  preserved_meaning: God directly causes both the terror and the confusion.
  reasoning_layer_used: theological decision on divine agency
  rationale: Two sentences improve readability without weakening God’s direct action.
interpretive_expansions:
- pob_phrase: turn their backs to you
  rendering: turn their backs and flee from you
  claim: Turning their backs describes retreat in flight.
  evidence:
  - The POB lexical rationale identifies this Hebrew idiom as causing enemies to retreat.
  - The POB footnote explains that the enemies turn and flee before Israel.
  confidence: high
  alternatives_preserved:
  - turn their backs to you
translation_notes:
  risk_flags:
  - risk: “My terror” could be mistaken for fear felt by God rather than dread sent by God.
    mitigation: The verb “send” and the lexical-alternative footnote clarify that the terror comes from God.
