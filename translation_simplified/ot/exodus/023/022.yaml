translation:
  language: en
  text: But if you listen carefully to his voice and obey him, and do everything I say,[a] I will be an enemy to your enemies and oppose those who oppose you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording shifts from “his voice” to “I say,” closely linking the messenger with the LORD while keeping them grammatically distinct.
    reason: source_note
simplification_decisions:
- pob_phrase: carefully obey his voice
  simplified_phrase: listen carefully to his voice and obey him
  preserved_meaning: The wording retains both attentive hearing and responsive obedience while preserving the image of the messenger’s voice.
  reasoning_layer_used: lexical decision for שָׁמֹעַ תִּשְׁמַע בְּקֹלוֹ
  rationale: The expanded wording makes the Hebrew idea clear without weakening its emphasis.
- pob_phrase: do all that I speak
  simplified_phrase: do everything I say
  preserved_meaning: The command still covers all of the LORD’s speech and preserves the shift to first person.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Everything I say” is ordinary English and keeps the deliberate pronoun shift.
- pob_phrase: an adversary to your adversaries
  simplified_phrase: oppose those who oppose you
  preserved_meaning: The LORD promises active hostility toward those who act against Israel.
  reasoning_layer_used: lexical decisions for וְצַרְתִּי and צֹרְרֶיךָ
  rationale: The repeated verb preserves the Hebrew wordplay more clearly than the uncommon noun “adversary.”
translation_notes:
  risk_flags:
  - risk: Adding “obey him” could appear to distinguish obedience from listening more sharply than the Hebrew does.
    mitigation: The POB lexical rationale already identifies the hearing as obedient hearing.
  - risk: Readers may try to resolve the shift from “his” to “I” into a single speaker.
    mitigation: The footnote preserves the POB’s documented theological tension without explaining it away.
