translation:
  language: en
  text: Stay far away from falsehood.[a] Do not kill innocent people or those who are in the right, because I will not declare the wicked to be righteous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may include a lie, false testimony, a false charge, or a deceptive legal case.
    reason: lexical_alternative
  - marker: b
    text: Or “I will not acquit the guilty.”
    reason: lexical_alternative
