- pob_phrase: Keep far from a false matter
  simplified_phrase: Stay far away from falsehood
  preserved_meaning: The command requires active separation from lies and deceptive legal matters.
  reasoning_layer_used: POB lexical decisions for מִ/דְּבַר שֶׁקֶר and תִּרְחָק
  rationale: “Falsehood” is clearer than “a false matter” while the footnote preserves its broad scope.
- pob_phrase: the innocent and the righteous
  simplified_phrase: innocent people or those who are in the right
  preserved_meaning: The wording protects both the innocent and those judged to be in the right without merging the two descriptions.
  reasoning_layer_used: POB lexical decisions for וְ/נָקִי and וְ/צַדִּיק plus the grounding review
  rationale: “Or” naturally keeps the coordinated groups distinct under the negative command.
- pob_phrase: I will not justify the wicked
  simplified_phrase: I will not declare the wicked to be righteous
  preserved_meaning: God will not issue a righteous verdict for wicked people.
  reasoning_layer_used: POB theological decision on the forensic sense of לֹא אַצְדִּיק
  rationale: “Declare righteous” explains the legal sense of “justify” and retains the righteousness word link.
