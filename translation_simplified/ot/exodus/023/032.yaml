simplification_decisions:
- pob_phrase: You shall make no covenant
  simplified_phrase: Do not make a covenant
  preserved_meaning: The wording remains a direct prohibition against entering a covenant.
  reasoning_layer_used: POB lexical and theological decisions on לֹא and כרת ברית
  rationale: A direct “Do not” command is clearer modern English than legal-style “You shall make no.”
- pob_phrase: covenant
  simplified_phrase: covenant[a]
  preserved_meaning: The binding relational and religious force of ברית is retained.
  reasoning_layer_used: POB lexical decision on בְּרִית
  rationale: The key biblical term is kept and briefly defined rather than reduced to “agreement.”
- pob_phrase: or with their gods
  simplified_phrase: or with their gods.[b]
  preserved_meaning: Both the people and their gods remain separately forbidden covenant partners.
  reasoning_layer_used: POB lexical and theological decisions on וְלֵאלֹהֵיהֶם
  rationale: “Or” clearly conveys the neither-nor force while the formal “and” is preserved in a note.
