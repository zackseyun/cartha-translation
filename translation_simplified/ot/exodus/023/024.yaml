translation:
  language: en
  text: Do not bow down to their gods or serve them. Do not follow their worship practices. Instead, completely tear down the objects used in their worship and shatter their sacred stone pillars.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do according to their deeds
  simplified_phrase: follow their worship practices
  preserved_meaning: Israel must not imitate the nations’ religious practices.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The clearer wording states the contextual sense rather than preserving an opaque idiom.
- pob_phrase: you shall surely tear them down
  simplified_phrase: completely tear down the objects used in their worship
  preserved_meaning: The intensified command requires total destruction of the nations’ cultic objects.
  reasoning_layer_used: lexical and theological decisions
  rationale: This identifies the tangible referent without suggesting that the deities themselves can literally be destroyed.
- pob_phrase: surely shatter their pillars
  simplified_phrase: shatter their sacred stone pillars
  preserved_meaning: The command targets standing stone monuments associated with worship.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: Adding “sacred stone” makes the kind and purpose of the pillars immediately clear.
