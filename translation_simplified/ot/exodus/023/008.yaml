translation:
  language: en
  text: Do not accept a bribe. A bribe blinds those who see clearly[a] and twists the words of the righteous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those with sound judgment.” The Hebrew uses the image of people who can see clearly.
    reason: lexical_alternative
  - marker: b
    text: In a legal setting, “the words of the righteous” may mean the statements or case of those who are in the right.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall not take a bribe
  simplified_phrase: Do not accept a bribe.
  preserved_meaning: The command prohibits receiving a corrupting payment.
  reasoning_layer_used: Lexical decision for לֹא תִקָּח and שֹׁחַד
  rationale: A direct command with “accept” is clearer modern legal English.
- pob_phrase: for a bribe blinds the clear-sighted
  simplified_phrase: A bribe blinds those who see clearly
  preserved_meaning: A bribe corrupts the judgment of people who normally perceive matters soundly.
  reasoning_layer_used: Lexical decision for יְעַוֵּר and פִּקְחִים
  rationale: The wording keeps the Hebrew sight image while replacing the uncommon label “clear-sighted.”
- pob_phrase: twists the words of the righteous
  simplified_phrase: twists the words of the righteous
  preserved_meaning: Bribery distorts righteous people’s words, statements, or legal case.
  reasoning_layer_used: Lexical decisions for וִיסַלֵּף, דִּבְרֵי, and צַדִּיקִים
  rationale: The phrase is retained because it preserves both moral and legal senses.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand blindness only physically.
    mitigation: Footnote a explains that the sight image refers to sound judgment.
  - risk: “The righteous” may obscure the possible legal sense of those in the right.
    mitigation: Footnote b preserves the judicial alternative without narrowing the main text.
