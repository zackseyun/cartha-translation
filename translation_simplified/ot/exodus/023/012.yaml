translation:
  language: en
  text: Do your work for six days, but stop working on the seventh day so that your ox and donkey may rest, and your female servant’s son and the resident foreigner may be refreshed.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall cease
  simplified_phrase: stop working
  preserved_meaning: The command requires work to cease on the seventh day.
  reasoning_layer_used: Lexical decision for שׁבת and theological decision on Sabbath cessation
  rationale: “Stop working” gives the core sense of cessation in familiar English.
- pob_phrase: so that your ox and your donkey may rest, and ... may be refreshed
  simplified_phrase: so that your ox and donkey may rest, and ... may be refreshed
  preserved_meaning: The purpose of stopping work is rest and refreshment for animals and dependent people.
  reasoning_layer_used: Lexical decisions for לְמַעַן, נוח, and נפשׁ
  rationale: The purpose construction preserves why seventh-day work must stop.
- pob_phrase: the son of your female servant and the sojourner
  simplified_phrase: your female servant’s son and the resident foreigner
  preserved_meaning: The command includes a servant’s dependent son and an outsider residing among Israel.
  reasoning_layer_used: Lexical and theological decisions for בֶּן אֲמָתְךָ and גר
  rationale: The documented alternatives clarify both social categories without merging them.
translation_notes:
  risk_flags:
  - risk: “Resident foreigner” may not convey every legal aspect of the Hebrew social category.
    mitigation: “Resident” preserves that this outsider lives within the community.
