translation:
  language: en
  text: Serve Yahweh your God. He will bless your food and water, and I will remove sickness from among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall serve Yahweh your God
  simplified_phrase: Serve Yahweh your God.
  preserved_meaning: This remains a covenant command to serve Yahweh, not merely an invitation to worship.
  reasoning_layer_used: Lexical and theological decisions for וַעֲבַדְתֶּם and יְהוָה
  rationale: The direct command is clearer modern English while retaining the divine name and the broad sense of service.
- pob_phrase: your bread and your water
  simplified_phrase: your food and water
  preserved_meaning: God promises to bless Israel's basic provisions.
  reasoning_layer_used: Lexical decision for לַחְמְךָ and POB lexical footnote
  rationale: Food expresses the documented broader sense of bread and pairs naturally with water.
- pob_phrase: from your midst
  simplified_phrase: from among you
  preserved_meaning: The promise concerns sickness within the covenant community.
  reasoning_layer_used: Lexical and theological decisions for מִקִּרְבֶּךָ and collective address
  rationale: Among you is common English and avoids suggesting only an illness inside one person's body.
