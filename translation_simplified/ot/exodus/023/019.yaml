translation:
  language: en
  text: Bring the first portion of the earliest produce from your ground to the house of Yahweh your God.[a] Do not boil a young goat in its mother’s milk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “house” means the sanctuary, not necessarily a later temple building.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The first of the firstfruits of your ground
  simplified_phrase: the first portion of the earliest produce from your ground
  preserved_meaning: The earliest part of the cultivated produce is to be given to God.
  reasoning_layer_used: Lexical decisions for רֵאשִׁית, בִּכּוּרֵי, and אֲדָמָה
  rationale: This explains the traditional term “firstfruits” while keeping both the first portion and agricultural setting.
- pob_phrase: you shall bring into the house of Yahweh your God
  simplified_phrase: Bring ... to the house of Yahweh your God
  preserved_meaning: The law directly commands delivery of the offering to Yahweh’s sanctuary.
  reasoning_layer_used: Lexical decision for תָּבִיא and sanctuary rationale for בֵּית יְהוָה
  rationale: The imperative is clearer modern legal English and retains the command’s full force.
- pob_phrase: You shall not boil a young goat in its mother’s milk
  simplified_phrase: Do not boil a young goat in its mother’s milk
  preserved_meaning: The specific act of boiling the animal in its own mother’s milk remains prohibited.
  reasoning_layer_used: Lexical and theological decisions for לֹא תְבַשֵּׁל and גְּדִי
  rationale: A direct prohibition is more natural while preserving the literal image without explaining its uncertain purpose.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “house” for a private dwelling or only a later temple.
    mitigation: The footnote identifies it as the sanctuary while preserving the source image.
  - risk: Readers may expect an explanation for the young-goat prohibition.
    mitigation: The wording leaves its purpose unresolved because the Hebrew text does not state one.
