translation:
  language: en
  text: Observe the Feast of Unleavened Bread. For seven days, eat bread made without anything that makes it rise, as I commanded you. Observe the feast at the appointed time in the month of Abib,[a] because that was the month when you left Egypt. No one may appear before me empty-handed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib is the Hebrew name of the month specified for this feast.
    reason: cultural_note
  - marker: b
    text: The Hebrew shifts here from addressing one person to using a plural verb; it may also be rendered, “They must not appear before me empty-handed.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You shall keep the Feast of Unleavened Bread
  simplified_phrase: Observe the Feast of Unleavened Bread
  preserved_meaning: Israel is commanded to carry out this formal feast.
  reasoning_layer_used: Lexical decision for תִּשְׁמֹר in a legal and worship context
  rationale: “Observe” states the required practice more clearly than “keep” for modern readers.
- pob_phrase: for in it you came out from Egypt
  simplified_phrase: because that was the month when you left Egypt
  preserved_meaning: The feast occurs in the month of Israel’s departure from Egypt.
  reasoning_layer_used: Lexical rationale identifying בוֹ with the month just mentioned
  rationale: Naming the month directly removes an unclear pronoun without changing its reference.
- pob_phrase: no one shall appear before me empty-handed
  simplified_phrase: No one may appear before me empty-handed
  preserved_meaning: Those coming into God’s presence must not come without a gift or offering.
  reasoning_layer_used: Lexical and theological decisions for the appearance idiom and רֵיקָם
  rationale: “May” expresses the prohibition naturally while retaining the source image of empty hands.
