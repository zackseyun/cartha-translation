translation:
  language: en
  text: Yahweh has given Bezalel, Oholiab, and every skilled man[a] the wisdom and understanding to know how to do all the work for the sanctuary’s service. They are to carry out all this work just as Yahweh commanded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “every wise-hearted man,” an expression for a skilled worker.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in whom Yahweh has put wisdom and understanding
  simplified_phrase: Yahweh has given Bezalel, Oholiab, and every skilled man the wisdom and understanding
  preserved_meaning: Yahweh is the source of their wisdom and understanding.
  reasoning_layer_used: POB lexical decision on the plural collective expression
  rationale: The active sentence clearly identifies both the giver and all the recipients.
- pob_phrase: shall do according to all that Yahweh has commanded
  simplified_phrase: They are to carry out all this work just as Yahweh commanded
  preserved_meaning: The workers must follow Yahweh’s instructions in all the work.
  reasoning_layer_used: POB lexical decision on directive force and conformity
  rationale: “Are to carry out” expresses the directive naturally without archaic wording.
- pob_phrase: all the work for the service of the sanctuary
  simplified_phrase: all the work for the sanctuary’s service
  preserved_meaning: The work concerns service in the holy sanctuary.
  reasoning_layer_used: POB lexical decision on sanctuary service
  rationale: The possessive form shortens the phrase without collapsing work and service.
translation_notes:
  risk_flags:
  - risk: Restructuring the verse into two sentences may make the command sound separate from Yahweh’s gift of skill.
    mitigation: The repeated phrase “all this work” directly connects the command to the preceding sentence.
