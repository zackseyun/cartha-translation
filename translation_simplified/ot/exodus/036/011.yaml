translation:
  language: en
  text: He made loops of blue yarn along the edge of the first curtain at the end of the first joined set.[a] He did the same along the edge of the outermost curtain in the second joined set.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “at the joining,” referring to where the curtains were joined.
    reason: lexical_alternative
