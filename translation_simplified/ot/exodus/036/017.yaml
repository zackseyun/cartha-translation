  text: He made fifty loops along the edge of the outer curtain in the first set.[a] He also made fifty loops along the edge of the curtain in the second set.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “in the joined section”; it refers to a set of curtains joined together.
