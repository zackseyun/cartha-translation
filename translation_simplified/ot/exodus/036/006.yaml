translation:
  language: en
  text: 'Then Moses gave the command, and they sent this announcement through the camp: “No man or woman is to do any more work to provide an offering for the sanctuary.” So the people were stopped from bringing any more contributions.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Moses commanded
  simplified_phrase: Moses gave the command
  preserved_meaning: Moses issued an authoritative order.
  reasoning_layer_used: POB lexical decision for וַיְצַו
  rationale: This keeps the authority of Moses’s directive in natural English.
- pob_phrase: they sent a proclamation through the camp
  simplified_phrase: they sent this announcement through the camp
  preserved_meaning: They circulated the public message among the camp.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision for וַיַּעֲבִירוּ קוֹל
  rationale: “Sent” preserves the causative image while “announcement” is easier to understand.
- pob_phrase: do any more work for the contribution of the sanctuary
  simplified_phrase: do any more work to provide an offering for the sanctuary
  preserved_meaning: The command stopped all further work connected with supplying the sacred offering.
  reasoning_layer_used: POB lexical decisions for מְלָאכָה and לִתְרוּמַת הַקֹּדֶשׁ
  rationale: This retains the broad word “work” while making its purpose clear.
translation_notes:
  risk_flags:
  - risk: “To provide” states the purpose of the work more directly than the POB wording.
    mitigation: The immediate context and POB rationale connect the work with supplying the sanctuary offering.
  - risk: “Stopped” is less formal than “restrained.”
    mitigation: The passive wording still shows that the people were prevented from bringing more.
