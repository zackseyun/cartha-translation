translation:
  language: en
  text: The Nile will swarm with frogs. They will come up out of the river and get into your house and bedroom, and onto your bed. They will also get into the houses of your servants, spread among your people, and get into your ovens and kneading bowls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “kneading troughs.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and they will come up and enter your house, your bedroom, and your bed
  simplified_phrase: They will come up out of the river and get into your house and bedroom, and onto your bed.
  preserved_meaning: The frogs move from the Nile into Pharaoh’s private rooms and onto his bed.
  reasoning_layer_used: Lexical decisions for וְעָלוּ, וּבָאוּ, and וְעַל מִטָּתֶךָ.
  rationale: The new sentence clarifies the movement while preserving the distinct location on the bed.
- pob_phrase: the houses of your servants and your people
  simplified_phrase: the houses of your servants, spread among your people
  preserved_meaning: The plague extends from Pharaoh’s home to his servants and the wider population.
  reasoning_layer_used: Lexical decisions for בְּבֵית עֲבָדֶיךָ and וּבְעַמֶּךָ.
  rationale: “Spread among your people” avoids implying that the frogs enter the people themselves.
- pob_phrase: and your ovens and your kneading bowls
  simplified_phrase: and get into your ovens and kneading bowls
  preserved_meaning: The frogs invade vessels and spaces used to prepare food.
  reasoning_layer_used: Lexical decisions for וּבְתַנּוּרֶיךָ and וּבְמִשְׁאֲרוֹתֶיךָ.
  rationale: Repeating “get into” clearly connects the frogs’ movement to the final locations.
interpretive_expansions:
- pob_phrase: will come up
  rendering: will come up out of the river
  claim: The frogs emerge from the Nile before entering inhabited spaces.
  evidence:
  - The preceding clause places the frogs in the Nile.
  - The lexical rationale describes movement from the Nile to land and houses.
  confidence: high
  alternatives_preserved:
  - will come up
translation_notes:
  risk_flags:
  - risk: “Spread among your people” makes the distributive movement more explicit than POB.
    mitigation: The wording remains bounded by the source phrase and its lexical rationale.
