translation:
  language: en
  text: But Pharaoh will not listen to you. Then I will lay my hand on Egypt and bring my people—the sons of Israel—out of Egypt in their organized groups.[a] I will do this through great acts of judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “my hosts” or “my armies” and pictures the people as ordered companies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bring out my hosts—my people
  simplified_phrase: bring my people ... out of Egypt in their organized groups
  preserved_meaning: God will bring Israel out as his people arranged in ordered companies.
  reasoning_layer_used: Lexical and theological decisions on צִבְאֹתַי
  rationale: This makes the corporate image understandable without implying a purely military force.
- pob_phrase: my people, the sons of Israel
  simplified_phrase: my people—the sons of Israel
  preserved_meaning: The sons of Israel identifies the people whom God calls his own.
  reasoning_layer_used: Lexical and theological decisions on עַמִּי בְנֵי יִשְׂרָאֵל
  rationale: The integrated phrase preserves the apposition without leaving an abrupt fragment.
- pob_phrase: with great judgments
  simplified_phrase: through great acts of judgment
  preserved_meaning: God will execute multiple powerful judicial acts against Egypt.
  reasoning_layer_used: Lexical decision on בִּשְׁפָטִים גְּדֹלִים
  rationale: “Acts of judgment” clearly presents the judgments as events God performs.
