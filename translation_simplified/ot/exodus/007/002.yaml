translation:
  language: en
  text: You must speak everything I command you. Your brother Aaron must speak to Pharaoh, so that Pharaoh may send the sons of Israel[a] out of his land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites,” traditionally “the children of Israel.” The Hebrew says “the sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall speak all that I command you
  simplified_phrase: You must speak everything I command you
  preserved_meaning: Moses is directed to communicate all that God commands him.
  reasoning_layer_used: Lexical decision for תְדַבֵּר and אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  rationale: “Must” gives the directive force clearly, while “everything” expresses the comprehensive command.
- pob_phrase: and Aaron your brother shall speak to Pharaoh
  simplified_phrase: Your brother Aaron must speak to Pharaoh
  preserved_meaning: Aaron is directed to speak to Pharaoh.
  reasoning_layer_used: Lexical decisions for אַהֲרֹן אָחִיךָ and יְדַבֵּר אֶל פַּרְעֹה
  rationale: A new sentence and ordinary English name order make the parallel instructions easier to follow.
- pob_phrase: out from his land
  simplified_phrase: out of his land
  preserved_meaning: The sons of Israel are to leave the land ruled by Pharaoh.
  reasoning_layer_used: Lexical decision for מֵאַרְצוֹ
  rationale: “Out of” naturally preserves the Hebrew sense of movement away from the land.
interpretive_expansions:
- pob_phrase: that he may send
  rendering: so that Pharaoh may send
  claim: The one expected to send the sons of Israel away is Pharaoh.
  evidence:
  - Pharaoh is the immediately preceding singular male referent.
  - The POB lexical rationale treats their departure as the intended result of Aaron’s speech to Pharaoh.
  confidence: high
  alternatives_preserved:
  - The wording “may send” does not guarantee that Pharaoh will comply.
translation_notes:
  risk_flags:
