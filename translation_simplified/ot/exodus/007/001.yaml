translation:
  language: en
  text: 'Then Yahweh said to Moses, “Understand this: I have made you like God to Pharaoh,[a] and your brother Aaron will be your prophet.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I have made you God to Pharaoh.” Moses represents God’s authority before Pharaoh; he does not become divine.
    reason: lexical_alternative
