translation:
  language: en
  text: But Pharaoh’s heart became hard, and he did not listen to Moses and Aaron, just as Yahweh had said.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say here who caused Pharaoh’s heart to become hard.
