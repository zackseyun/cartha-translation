simplification_decisions:
- pob_phrase: Pharaoh's heart was hardened
  simplified_phrase: Pharaoh’s heart became hard
  preserved_meaning: Pharaoh’s inner will became firm and unresponsive without naming who caused it.
  reasoning_layer_used: Lexical and theological decisions on וַיֶּחֱזַק and agency
  rationale: The active wording is easier to understand while preserving the Hebrew heart image and its unstated agency.
- pob_phrase: he did not listen to them
  simplified_phrase: he did not listen to Moses and Aaron
  preserved_meaning: Pharaoh rejected what Moses and Aaron told him.
  reasoning_layer_used: Immediate narrative context and lexical decision on שָׁמַע אֲלֵהֶם
  rationale: Naming the speakers removes an unclear pronoun without changing its referents.
- pob_phrase: just as Yahweh had spoken
  simplified_phrase: just as Yahweh had said
  preserved_meaning: The event happened in accordance with Yahweh’s earlier words.
  reasoning_layer_used: Lexical decision on כַּאֲשֶׁר דִּבֶּר and divine-name policy
  rationale: “Had said” is common English and still marks Yahweh’s prior declaration.
