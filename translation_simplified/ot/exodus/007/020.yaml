translation:
  language: en
  text: Moses and Aaron did exactly what Yahweh had commanded. Then he[a] raised the staff and struck the water of the Nile in full view of Pharaoh and his servants. All the water in the Nile turned to blood.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “he,” probably referring to Aaron, but does not name him here.
    reason: source_note
simplification_decisions:
- pob_phrase: did so, just as Yahweh had commanded
  simplified_phrase: did exactly what Yahweh had commanded
  preserved_meaning: Moses and Aaron fully obeyed Yahweh’s earlier command.
  reasoning_layer_used: Lexical decision for וַיַּעֲשׂוּ כֵן and כַּאֲשֶׁר צִוָּה
  rationale: The rewrite combines two overlapping phrases into direct modern English without weakening their obedience.
- pob_phrase: before Pharaoh's eyes and before the eyes of his servants
  simplified_phrase: in full view of Pharaoh and his servants
  preserved_meaning: The act happened openly where Pharaoh and his servants could see it.
  reasoning_layer_used: Lexical decision for לְעֵינֵי ... וּלְעֵינֵי
  rationale: The common idiom keeps the Hebrew emphasis on public visibility without awkward repetition.
- pob_phrase: all the water that was in the Nile was turned to blood
  simplified_phrase: All the water in the Nile turned to blood
  preserved_meaning: The Nile’s water underwent the stated transformation into blood.
  reasoning_layer_used: Lexical decisions for וַיֵּהָפְכוּ and לְדָם
  rationale: The active English construction states the same result more simply and naturally.
