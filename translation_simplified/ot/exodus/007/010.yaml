translation:
  language: en
  text: Moses and Aaron went to Pharaoh and did exactly what Yahweh had commanded. In front of Pharaoh and his servants, Aaron threw down his staff, and it turned into a serpent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean a dragon-like creature or a large reptile; here it most likely means a serpent.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: went in to Pharaoh, and they did so, just as Yahweh had commanded
  simplified_phrase: went to Pharaoh and did exactly what Yahweh had commanded
  preserved_meaning: Moses and Aaron entered Pharaoh’s presence and obeyed Yahweh’s prior command precisely.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא, וַיַּעֲשׂוּ כֵן, and כַּאֲשֶׁר צִוָּה
  rationale: The rewrite removes an awkward repeated clause while retaining the movement and exact obedience.
- pob_phrase: before Pharaoh and before his servants
  simplified_phrase: In front of Pharaoh and his servants
  preserved_meaning: Aaron performed the sign openly in the presence of both Pharaoh and his servants.
  reasoning_layer_used: Lexical decision for לִפְנֵי ... וְלִפְנֵי
  rationale: “In front of” is clearer in modern English while keeping the sign public before both groups.
- pob_phrase: it became a serpent
  simplified_phrase: it turned into a serpent
  preserved_meaning: Aaron’s staff changed into the creature identified here as a serpent.
  reasoning_layer_used: Lexical and theological decisions for וַיְהִי לְתַנִּין
  rationale: “Turned into” states the transformation naturally without weakening the broader lexical note.
