translation:
  language: en
  text: Then Yahweh said to Moses, “Tell Aaron, ‘Take your staff and stretch out your hand over all the waters of Egypt—its rivers, Nile canals, ponds, and every other gathered body of water. All these waters will become blood. Blood will be throughout Egypt, even in wooden and stone containers.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says more literally, “in the wood and in the stone,” probably referring to containers made from those materials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Say to Aaron
  simplified_phrase: Tell Aaron
  preserved_meaning: Moses must relay Yahweh’s command to Aaron.
  reasoning_layer_used: Lexical decision for אֱמֹר
  rationale: “Tell Aaron” states the command in ordinary English.
- pob_phrase: over every collection of their waters
  simplified_phrase: every other gathered body of water
  preserved_meaning: The command includes every gathered body of water in Egypt.
  reasoning_layer_used: Lexical decision for כָּל מִקְוֵה מֵימֵיהֶם
  rationale: This preserves both the gathered-water sense and the comprehensive scope.
- pob_phrase: that they may become blood. And there will be blood throughout all the land of Egypt
  simplified_phrase: All these waters will become blood. Blood will be throughout Egypt
  preserved_meaning: Every category of Egyptian water listed will become blood across the whole land.
  reasoning_layer_used: Lexical decisions for וְיִהְיוּ דָם and וְהָיָה דָם
  rationale: Two direct sentences keep the listed waters as the subject and preserve the nationwide result.
translation_notes:
  risk_flags:
  - risk: “Wooden and stone containers” makes the Hebrew metonymy explicit.
