translation:
  language: en
  text: 'Tell him, “Yahweh, the God of the Hebrews, has sent me to tell you: Let my people go so they can serve me in the wilderness.[a] But look—you still have not listened.”'
  philosophy: optimal-equivalence
  footnotes:
