translation:
  language: en
  text: But I will harden Pharaoh’s heart.[a] I will also perform many signs and wonders in Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make Pharaoh’s heart hard” or “make Pharaoh’s heart stubborn.” The Hebrew presents God as directly causing the hardening.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and I will multiply my signs and my wonders
  simplified_phrase: I will also perform many signs and wonders
  preserved_meaning: God will cause many miraculous signs and wonders to occur.
  reasoning_layer_used: POB lexical decisions for וְהִרְבֵּיתִי, אֹתֹתַי, and מוֹפְתַי
  rationale: This replaces the less natural phrase “multiply signs” while keeping both signs and wonders distinct.
- pob_phrase: in the land of Egypt
  simplified_phrase: in Egypt
  preserved_meaning: The signs and wonders will take place in Egypt.
  reasoning_layer_used: POB lexical alternative for בְּאֶרֶץ מִצְרָיִם
  rationale: Modern English normally uses the country name alone when “land” adds no needed distinction.
- pob_phrase: But I will harden Pharaoh’s heart, and I will multiply
  simplified_phrase: But I will harden Pharaoh’s heart. I will also perform
  preserved_meaning: God’s hardening of Pharaoh and his many signs and wonders remain linked future actions.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Two sentences make the sequence easier to follow without weakening the contrast or connection.
interpretive_expansions:
- pob_phrase: multiply my signs and my wonders
  rendering: perform many signs and wonders
  claim: The signs and wonders are acts God will bring about, not objects he will merely increase.
  evidence:
  - The objects “signs” and “wonders” denote divine acts in this context.
  - The POB rationale says “multiply” means “make many” here.
  confidence: high
  alternatives_preserved:
  - multiply my signs and wonders
  - make my signs and wonders many
