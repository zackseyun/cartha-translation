translation:
  language: en
  text: He hurled Pharaoh’s chariots and army into the sea. Pharaoh’s best officers were sunk in the Sea of Reeds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called the “Red Sea.” The Hebrew says “Sea of Reeds.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Pharaoh’s chariots and his army he cast into the sea
  simplified_phrase: He hurled Pharaoh’s chariots and army into the sea
  preserved_meaning: God forcefully threw Pharaoh’s military power into the sea.
  reasoning_layer_used: Lexical decisions for יָרָה and וְחֵילוֹ
  rationale: The reordered sentence is natural English, while “hurled” keeps the verb’s force.
- pob_phrase: the choicest of his officers
  simplified_phrase: Pharaoh’s best officers
  preserved_meaning: The selected elite among Pharaoh’s military officers are in view.
  reasoning_layer_used: Lexical decisions for וּמִבְחַר and שָׁלִשָׁיו
  rationale: “Best” is clearer than “choicest,” and repeating Pharaoh removes pronoun confusion.
- pob_phrase: were sunk in the Sea of Reeds
  simplified_phrase: were sunk in the Sea of Reeds
  preserved_meaning: The officers were submerged by divine judgment in the sea named by the Hebrew text.
  reasoning_layer_used: Lexical and theological decisions for טֻבְּעוּ and יַם סוּף
  rationale: This wording retains both the passive sinking image and the source-driven place-name.
translation_notes:
  risk_flags:
  - risk: Some readers may not recognize the Sea of Reeds as the traditionally named Red Sea.
    mitigation: The footnote gives the traditional name without replacing the Hebrew-based rendering.
