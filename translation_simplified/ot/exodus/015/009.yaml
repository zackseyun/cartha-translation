translation:
  language: en
  text: The enemy said, “I will chase them and catch them. I will divide up the plunder. I will have my fill of them.[a] I will draw my sword. My hand will dispossess them.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “my soul will be filled with them,” meaning that the enemy’s hostile desire will be satisfied.
    reason: lexical_alternative
  - marker: b
    text: The final words may also mean, “my hand will destroy them” or “drive them out.”
    reason: lexical_alternative
