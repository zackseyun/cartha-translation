translation:
  language: en
  text: With your steadfast love, you led the people you redeemed.[a] With your strength, you guided them to your holy dwelling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this people you redeemed.”
    reason: lexical_alternative
  - marker: b
    text: “Your holy dwelling” means the place of God’s holy presence; it may refer to Sinai, the promised land, or Zion and the temple.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In your steadfast love you have led
  simplified_phrase: With your steadfast love, you led
  preserved_meaning: God’s faithful covenant love accompanied and shaped his act of leading.
  reasoning_layer_used: Lexical decision for בְחַסְדְּךָ and נָחִיתָ
  rationale: “With” and the simple past make the line easier to read without weakening steadfast love.
- pob_phrase: the people whom you redeemed
  simplified_phrase: the people you redeemed
  preserved_meaning: God rescued his covenant people through his redeeming action.
  reasoning_layer_used: Lexical decisions for עַם זוּ and גָּאָלְתָּ
  rationale: Removing “whom” gives natural modern English while retaining the key term “redeemed.”
- pob_phrase: in your strength you have guided them
  simplified_phrase: With your strength, you guided them
  preserved_meaning: God used his power to guide his people with care.
  reasoning_layer_used: Lexical decisions for בְעָזְּךָ and נֵהַלְתָּ
  rationale: A new sentence and simple past clarify the parallel action while keeping “guided” distinct from “led.”
translation_notes:
  risk_flags:
  - risk: Readers may assume “holy dwelling” names one specific location.
    mitigation: The footnote preserves the POB’s deliberate ambiguity among Sinai, the promised land, and Zion or the temple.
