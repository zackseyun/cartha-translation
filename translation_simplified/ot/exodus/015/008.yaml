translation:
  language: en
  text: At the blast from your nostrils, the waters piled up. The flowing waters stood like a heap. The deep waters thickened in the heart of the sea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thickened” may also be translated “congealed” or “froze.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: At the blast of your nostrils
  simplified_phrase: At the blast from your nostrils
  preserved_meaning: God’s forceful breath is pictured through vivid bodily imagery.
  reasoning_layer_used: Lexical and theological decisions on רוּחַ and אַפֶּיךָ.
  rationale: “From” makes the direction of the blast clearer without weakening the poetic image.
- pob_phrase: the depths congealed
  simplified_phrase: The deep waters thickened
  preserved_meaning: The waters in the sea’s depths became thick or congealed.
  reasoning_layer_used: Lexical decisions on קָפְאוּ and תְהֹמֹת.
  rationale: “Deep waters thickened” uses familiar words while avoiding a claim that the sea literally froze.
- pob_phrase: in the heart of the sea
  simplified_phrase: in the heart of the sea
  preserved_meaning: The event occurred in the midst of the sea while retaining the Hebrew heart image.
  reasoning_layer_used: Lexical decision on בְּלֶב יָם.
  rationale: The concrete metaphor remains understandable and preserves the poetry better than replacing it with “middle.”
translation_notes:
  risk_flags:
