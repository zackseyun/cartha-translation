translation:
  language: en
  text: He said, “If you listen carefully to the voice of Yahweh your God, do what is right in his eyes, pay close attention to his commandments, and follow all his laws, I will not bring on you any of the diseases I brought on Egypt. For I am Yahweh, your healer.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh, who heals you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: diligently listen
  simplified_phrase: listen carefully
  preserved_meaning: The wording retains both listening and the intensified call for close attention.
  reasoning_layer_used: lexical decision for שָׁמוֹעַ תִּשְׁמַע
  rationale: “Listen carefully” expresses the intensification in familiar English.
- pob_phrase: give ear to his commandments
  simplified_phrase: pay close attention to his commandments
  preserved_meaning: The distinct command to attend closely to God’s commandments remains explicit.
  reasoning_layer_used: lexical decision for וְהַאֲזַנְתָּ
  rationale: The modern phrase replaces an opaque English idiom without weakening its force.
- pob_phrase: keep all his statutes
  simplified_phrase: follow all his laws
  preserved_meaning: Israel is still required to observe every fixed covenantal requirement.
  reasoning_layer_used: lexical decisions for וְשָׁמַרְתָּ and כָּל חֻקָּיו
  rationale: “Follow all his laws” is clearer to readers unfamiliar with legal-biblical terminology.
translation_notes:
  risk_flags:
  - risk: Readers may treat the promise as a universal guarantee of individual healing.
    mitigation: The conditional wording and explicit comparison with Egypt preserve its covenantal setting.
  - risk: “Laws” is broader than the technical term “statutes.”
    mitigation: The words “all” and “follow” preserve the scope and required observance of the fixed commands.
