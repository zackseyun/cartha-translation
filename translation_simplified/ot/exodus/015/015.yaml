translation:
  language: en
  text: Then Edom’s chiefs were terrified. Trembling seized Moab’s leaders. All the people living in Canaan melted with fear.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the chiefs of Edom were terrified
  simplified_phrase: Edom’s chiefs were terrified
  preserved_meaning: Edom’s clan authorities became deeply afraid.
  reasoning_layer_used: The lexical decision identifies אַלּוּפֵי as chiefs without implying royalty.
  rationale: The possessive form is shorter and more natural while retaining the leadership sense.
- pob_phrase: trembling seized the leaders of Moab
  simplified_phrase: Trembling seized Moab’s leaders
  preserved_meaning: Fear physically gripped Moab’s prominent men.
  reasoning_layer_used: The lexical decisions preserve both the leaders and the vivid personification of trembling.
  rationale: A separate sentence makes the poetic image easier to follow without weakening it.
- pob_phrase: all the inhabitants of Canaan
  simplified_phrase: All the people living in Canaan
  preserved_meaning: Everyone dwelling in Canaan is included.
  reasoning_layer_used: The lexical decision treats the participial phrase as the whole resident population.
  rationale: “People living in” is more familiar than “inhabitants” for common readers.
interpretive_expansions:
- pob_phrase: melted away
  rendering: melted with fear
  claim: The melting image describes the people losing courage because of fear.
  evidence:
  - The lexical rationale identifies this as a fear-context metaphor for losing courage.
  - The surrounding clauses describe terror and trembling.
  confidence: high
  alternatives_preserved:
  - melted away
  - lost heart
translation_notes:
  risk_flags:
  - risk: “Melted with fear” could be mistaken for literal melting.
    mitigation: The added phrase “with fear” clearly marks the image as a response of terror.
