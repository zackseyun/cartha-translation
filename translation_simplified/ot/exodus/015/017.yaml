translation:
  language: en
  text: You will bring them in and plant them securely on the mountain that belongs to you.[a] Yahweh, you made that place for your dwelling—the sanctuary, Lord, that your hands set firmly in place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the mountain of your inheritance”; this may mean the land God gives his people or, more specifically, the mountain of his sanctuary.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses both God’s personal name, rendered “Yahweh,” and the title “Lord.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: on the mountain of your inheritance
  simplified_phrase: on the mountain that belongs to you
  preserved_meaning: The mountain is Yahweh’s possession, while its precise geographic scope remains open.
  reasoning_layer_used: lexical and theological decisions
  rationale: Clear ownership language avoids an opaque phrase without limiting the mountain to Canaan or Zion.
- pob_phrase: the place, Yahweh, that you made for your dwelling
  simplified_phrase: Yahweh, you made that place for your dwelling
  preserved_meaning: Yahweh made the place to be the site of his dwelling.
  reasoning_layer_used: lexical decisions for מָכוֹן לְשִׁבְתְּךָ and פָּעַלְתָּ
  rationale: The direct clause eases the sentence while preserving purpose rather than merely describing occupancy.
- pob_phrase: that your hands established
  simplified_phrase: that your hands set firmly in place
  preserved_meaning: God founded the sanctuary securely through the poetic image of his hands.
  reasoning_layer_used: lexical decision for כּוֹנְנוּ יָדֶיךָ
  rationale: Common wording explains “established” while retaining the source image without added emphasis.
