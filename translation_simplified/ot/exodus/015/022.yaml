translation:
  language: en
  text: Then Moses led the people of Israel away from the Sea of Reeds.[a] They entered the wilderness of Shur and traveled there for three days, but found no water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called the Red Sea; the Hebrew says “Sea of Reeds.”
    reason: lexical_alternative
