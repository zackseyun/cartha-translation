  preserved_meaning: Moses caused the Israelites to leave their previous location.
  reasoning_layer_used: POB lexical decision for וַיַּסַּע
  rationale: “The people of Israel” makes the collective name clear while preserving Moses’ leadership.
- pob_phrase: they went out into the wilderness of Shur
  simplified_phrase: They entered the wilderness of Shur
  preserved_meaning: The Israelites moved from the sea region into Shur’s wilderness.
  reasoning_layer_used: POB lexical decisions for וַיֵּצְאוּ and מִדְבַּר שׁוּר
  rationale: “Entered” expresses the same movement in more direct modern English.
- pob_phrase: They went three days in the wilderness and found no water
  simplified_phrase: traveled there for three days, but found no water
  preserved_meaning: They spent three days journeying in the wilderness without locating water.
  reasoning_layer_used: POB lexical decisions for שְׁלֹשֶׁת יָמִים, בַּמִּדְבָּר, and לֹא מָצְאוּ מָיִם
  rationale: The duration and lack of water are recast in ordinary English without adding a destination.
