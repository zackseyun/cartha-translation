  reasoning_layer_used: POB lexical decisions for הַנְּבִיאָה and אֲחוֹת אַהֲרֹן
  rationale: The relative clause explains the less familiar title “prophetess” in ordinary English.
- pob_phrase: all the women went out after her
  simplified_phrase: All the women followed her out
