translation:
  language: en
  text: Then Miriam, who was a prophet and Aaron’s sister, took a tambourine in her hand. All the women followed her out with tambourines, dancing as they went.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with dances.” The Hebrew can refer either to dancing as an activity or to dances as events.
    reason: lexical_alternative
