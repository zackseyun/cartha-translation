translation:
  language: en
  text: Terror and dread will fall on them. Your mighty arm will make them as still as stone[a] until your people pass by, Yahweh—until this people you acquired as your own[b] pass by.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also suggest that they will be silent or unable to move.
    reason: lexical_alternative
  - marker: b
    text: “Acquired” may also be translated “purchased”; it describes Yahweh making this people his own.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by the greatness of your arm they will be still as a stone
  simplified_phrase: Your mighty arm will make them as still as stone
  preserved_meaning: Yahweh’s powerful action leaves the nations stunned and motionless.
  reasoning_layer_used: Lexical decisions for בִּגְדֹל זְרוֹעֲךָ, יִדְּמוּ, and כָּאָבֶן
  rationale: The rewrite uses ordinary clause order while retaining the arm and stone images.
- pob_phrase: until your people pass by, O Yahweh, until this people whom you acquired pass by
  simplified_phrase: until your people pass by, Yahweh—until this people you acquired as your own pass by
  preserved_meaning: Israel belongs to Yahweh and proceeds while the nations remain still.
  reasoning_layer_used: Lexical and theological decisions for יְהוָה, עַמְּךָ, עַד יַעֲבֹר, and קָנִיתָ
  rationale: The dash makes the poetic repetition easier to follow without merging its two lines.
interpretive_expansions:
- pob_phrase: whom you acquired
  rendering: you acquired as your own
  claim: Acquiring the people means bringing them into Yahweh’s possession without specifying the means as redemption.
  evidence:
  - The POB lexical rationale says קָנִיתָ can carry covenantal possession language.
  - The theological decision identifies Israel as the people Yahweh made his own.
  confidence: high
  alternatives_preserved:
  - purchased
