  text: In your great majesty, you bring down those who rise against you. You send out your burning anger, and it consumes them like dry stalks left after harvest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “like stubble,” meaning the dry stalks left after harvest.
    reason: simplification_note
