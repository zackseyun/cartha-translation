translation:
  language: en
  text: I have come down to rescue Israel from Egypt’s grip and bring him[a] up out of that land to a good, spacious land. It is a land flowing with milk and honey, where the Canaanites, Hittites, Amorites, Perizzites, Hivites, and Jebusites live.
