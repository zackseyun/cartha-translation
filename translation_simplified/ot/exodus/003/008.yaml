simplification_decisions:
- pob_phrase: deliver him from the hand of Egypt
  simplified_phrase: rescue Israel from Egypt’s grip
  preserved_meaning: God will free Israel from Egypt’s oppressive control while retaining the hand-based image in “grip.”
  reasoning_layer_used: lexical decision and collective-singular rationale
  rationale: Naming Israel clarifies the pronoun’s referent, and “grip” makes the idiom immediately understandable.
- pob_phrase: a good and broad land
  simplified_phrase: a good, spacious land
  preserved_meaning: The promised land is good and has ample room, in contrast to confinement in Egypt.
  reasoning_layer_used: documented lexical alternative
  rationale: “Spacious” expresses the intended breadth more naturally for modern readers.
- pob_phrase: to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite, and the Jebusite
  simplified_phrase: where the Canaanites, Hittites, Amorites, Perizzites, Hivites, and Jebusites live
  preserved_meaning: These peoples inhabit the place to which God will bring Israel.
  reasoning_layer_used: lexical rationale for collective ethnonyms
  rationale: Plural people names and a direct clause are clearer than formal singular ethnonyms.
