translation:
  language: en
  text: They will listen to what you say. Then you and the elders of Israel will go to the king of Egypt and tell him, “Yahweh, the God of the Hebrews, has met with us.[a] Now please allow us to take a three-day journey into the wilderness, so we can offer sacrifices to Yahweh our God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has encountered us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: listen to your voice
  simplified_phrase: listen to what you say
  preserved_meaning: The elders will hear Moses’ message and respond favorably without implying explicit obedience.
  reasoning_layer_used: POB lexical decision for וְשָׁמְעוּ לְקֹלֶךָ
  rationale: This uses ordinary English while preserving the Hebrew image of hearing spoken words.
- pob_phrase: you and the elders of Israel will go ... and say to him
  simplified_phrase: you and the elders of Israel will go ... and tell him
  preserved_meaning: Moses and Israel’s elders will jointly deliver God’s message to Egypt’s king.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Dividing the long sentence and using “tell him” makes the action easier to follow.
- pob_phrase: a journey of three days into the wilderness, so that we may sacrifice
  simplified_phrase: a three-day journey into the wilderness, so we can offer sacrifices
  preserved_meaning: They politely request permission to travel into the wilderness for the purpose of sacrificing to Yahweh.
  reasoning_layer_used: POB lexical decisions for דֶּרֶךְ שְׁלֹשֶׁת יָמִים and וְנִזְבְּחָה
  rationale: The recast wording expresses the travel and its purpose in familiar English.
