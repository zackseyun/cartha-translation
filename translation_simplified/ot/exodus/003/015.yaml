    text: “Sons of Israel” is the Hebrew kinship expression for Israel’s descendants.
    reason: cultural_note
  - marker: b
    text: The Hebrew divine name is YHWH, represented here as “Yahweh”; it is also rendered “Jehovah.”
    reason: lexical_alternative
