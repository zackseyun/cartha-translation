translation:
  language: en
  text: Go and bring Israel’s elders[a] together. Tell them, “Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me. He said, ‘I have certainly paid close attention to you and to how you have been treated in Egypt.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The elders were Israel’s community leaders.
    reason: cultural_note
  - marker: b
    text: Or, “I have surely visited you”; the Hebrew means decisive attention that leads to action.
    reason: lexical_alternative
