  preserved_meaning: The items are made of precious metal, but their exact type is not specified.
  reasoning_layer_used: POB lexical decisions for כְּלֵי כֶסֶף and וּכְלֵי זָהָב
  rationale: “Objects” is clearer than “articles” while remaining broad.
- pob_phrase: from the woman staying in her house
  simplified_phrase: the woman staying in her home
  preserved_meaning: The instruction identifies the woman residing in the household without specifying why she is there.
  reasoning_layer_used: POB lexical decision for וּמִגָּרַת בֵּיתָהּ
  rationale: This keeps the specified resident woman while using natural modern wording.
- pob_phrase: and you shall put them on your sons and on your daughters; and
  simplified_phrase: You must put these things on your sons and daughters. In this way
  preserved_meaning: The goods are put on both sons and daughters, leading to Egypt being plundered.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences clarify the command and its result.
