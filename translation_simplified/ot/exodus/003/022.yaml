translation:
  language: en
  text: Each woman must ask[a] her neighbor and the woman staying in her home for silver objects, gold objects, and clothing. You must put these things on your sons and daughters. In this way you will plunder Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “request”; the Hebrew does not mean that the women will borrow these things and later return them.
    reason: lexical_alternative
