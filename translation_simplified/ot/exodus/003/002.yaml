translation:
  language: en
  text: Then the angel[a] of Yahweh appeared to him in a flame of fire from inside the bush. He looked and saw that the bush was burning, but it was not burning up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger.” The Hebrew word can mean either “angel” or “messenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from the midst of the bush
  simplified_phrase: from inside the bush
  preserved_meaning: The flame came from within the bush.
  reasoning_layer_used: POB lexical decision for מִתּוֹךְ הַסְּנֶה
  rationale: “From inside” expresses the same spatial image in common English.
- pob_phrase: He looked, and behold
  simplified_phrase: He looked and saw that
  preserved_meaning: Moses directed his attention to the remarkable sight that followed.
  reasoning_layer_used: POB lexical decisions for וַיַּרְא and וְהִנֵּה
  rationale: The recast removes an unfamiliar discourse marker while retaining the sequence of looking and seeing.
- pob_phrase: was burning with fire, but the bush was not consumed
  simplified_phrase: was burning, but it was not burning up
  preserved_meaning: The bush remained intact even while it continued to burn.
  reasoning_layer_used: POB lexical decisions for בֹּעֵר בָּאֵשׁ and אֵינֶנּוּ אֻכָּל
  rationale: “Not burning up” states the central paradox more plainly without weakening it.
