translation:
  language: en
  text: He stayed there with Yahweh for forty days and forty nights. During that time, he ate no bread and drank no water. He wrote[a] the covenant words on the tablets—the ten words.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh wrote,” since elsewhere the writing on the tablets is attributed to Yahweh (see Exodus 34:1; Deuteronomy 10:4).
    reason: alternative_reading
  - marker: b
    text: Traditionally called “the Ten Commandments”; the Hebrew says “the ten words.”
    reason: lexical_alternative
