translation:
  language: en
  text: When Aaron and all the sons of Israel saw Moses, they saw that the skin of his face was shining.[a] They were afraid to come near him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb can mean “shone” or “sent out rays.” It was also historically translated “was horned,” but the context points to radiance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: behold, the skin of his face was radiant
  simplified_phrase: they saw that the skin of his face was shining
  preserved_meaning: Moses’ facial skin visibly gave off radiance, drawing sudden attention.
  reasoning_layer_used: Lexical decision for וְהִנֵּה and קָרַן
  rationale: The new wording expresses the surprising sight in direct modern English while preserving the radiance.
- pob_phrase: all the sons of Israel
  simplified_phrase: all the sons of Israel
  preserved_meaning: The masculine familial designation for the Israelite group remains explicit.
  reasoning_layer_used: Theological decision on בְּנֵי יִשְׂרָאֵל
  rationale: The phrase is retained because POB deliberately chose it over the smoother “Israelites.”
- pob_phrase: they were afraid to come near him
  simplified_phrase: They were afraid to come near him.
  preserved_meaning: Their fear made them shrink back from approaching Moses.
  reasoning_layer_used: Lexical decisions for וַיִּירְאוּ and מִגֶּשֶׁת אֵלָיו
  rationale: A separate sentence makes the people’s fearful response immediately clear.
translation_notes:
  risk_flags:
  - risk: “Shining” may sound less intense than “radiant.”
    mitigation: The concrete reference to the skin of Moses’ face and the footnote preserve the visible emission of light.
