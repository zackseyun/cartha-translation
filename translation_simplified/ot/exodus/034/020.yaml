translation:
  language: en
  text: You must redeem a donkey’s firstborn by offering a lamb[a] in its place. If you do not redeem it, you must break its neck. You must also redeem every firstborn among your sons. No one may appear before me empty-handed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean a sheep, a goat, or more broadly an animal from the flock.
    reason: lexical_alternative
