  preserved_meaning: Moses responded without delay.
  reasoning_layer_used: Lexical decision for וַיְמַהֵר and its narrative emphasis on haste
  rationale: “Immediately” expresses Moses’ prompt response in familiar English.
- pob_phrase: bowed down to the ground
  simplified_phrase: bowed low to the ground
  preserved_meaning: Moses physically lowered himself toward the ground.
  reasoning_layer_used: Lexical decisions for וַיִּקֹּד and אַרְצָה
  rationale: “Bowed low” makes the depth and direction of the gesture easy to picture.
- pob_phrase: and worshiped
  simplified_phrase: and worshiped
  preserved_meaning: The second action is Moses’ reverent response to the LORD, not merely another bodily motion.
  reasoning_layer_used: Theological decision for וַיִּשְׁתָּחוּ
  rationale: The key theological term is retained so the two related actions remain distinct.
