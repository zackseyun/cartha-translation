translation:
  language: en
  text: But Moses called out to them. Aaron and all the leaders of the community came back to him, and Moses spoke to them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Moses called to them
  simplified_phrase: Moses called out to them
  preserved_meaning: Moses addressed those who had been afraid to come near.
  reasoning_layer_used: Lexical decision for וַיִּקְרָא and immediate narrative context
  rationale: “Called out” is more natural here and does not imply the stronger authority of “summoned.”
- pob_phrase: the leaders of the congregation
  simplified_phrase: the leaders of the community
  preserved_meaning: These were the recognized leaders of Israel’s covenant community.
  reasoning_layer_used: Lexical decisions for הַנְּשִׂאִים and בָּעֵדָה
  rationale: “Community” is immediately understandable while retaining the corporate sense.
- pob_phrase: returned to him
  simplified_phrase: came back to him
  preserved_meaning: Aaron and the leaders approached Moses again after drawing back.
  reasoning_layer_used: Lexical decision for וַיָּשֻׁבוּ אֵלָיו
  rationale: “Came back” expresses the same movement in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Community” may express the assembled-group nuance less strongly than “congregation.”
    mitigation: The phrase “all the leaders of the community” preserves the organized corporate setting.
