  rationale: This makes the public setting clear in natural English.
- pob_phrase: wonders such as have not been created in all the earth or among any of the nations
  simplified_phrase: wonders unlike any ever created anywhere on earth or among any nation
  preserved_meaning: The LORD promises unprecedented wonders while retaining the image of creation.
  reasoning_layer_used: POB source-driven wording
  rationale: The shorter comparison preserves the wonders’ worldwide uniqueness.
- pob_phrase: all the people in whose midst you are
  simplified_phrase: all the people among whom you are
  preserved_meaning: The peoples among whom Moses and Israel are present will witness the LORD’s work.
  reasoning_layer_used: POB translation, source text, and grounding review
  rationale: “Among whom you are” preserves the relational setting without the ambiguity of “around you.”
