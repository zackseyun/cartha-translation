translation:
  language: en
  text: He keeps his steadfast love for thousands,[a] and he forgives wrongdoing, rebellion, and sin. Yet he certainly does not leave the guilty unpunished. He brings the consequences of fathers’ wrongdoing upon their children and grandchildren,[b][c] down to the third and fourth generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for a thousand generations.” The Hebrew says simply “for thousands.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “fathers,” referring here to generational descent.
    reason: cultural_note
  - marker: c
    text: The Hebrew verb translated “brings the consequences” can also be rendered “visits” and does not specify the exact form those consequences take.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: forgiving iniquity and transgression and sin
  simplified_phrase: he forgives wrongdoing, rebellion, and sin
  preserved_meaning: God forgives three distinct forms of human evil.
  reasoning_layer_used: POB lexical decisions for עָוֺן, פֶשַׁע, and חַטָּאָה
  rationale: Common words clarify the three-part expression without collapsing it.
- pob_phrase: but he will by no means leave unpunished
  simplified_phrase: Yet he certainly does not leave the guilty unpunished
  preserved_meaning: God’s forgiveness remains joined to his emphatic refusal to acquit the guilty.
  reasoning_layer_used: POB lexical and theological decisions on וְנַקֵּה לֹא יְנַקֶּה
  rationale: The implied judicial object makes the clause natural without shifting punishment to wrongdoing itself.
- pob_phrase: visiting the iniquity of fathers on children and on children’s children, to the third and to the fourth generation
  simplified_phrase: He brings the consequences of fathers’ wrongdoing upon their children and grandchildren, down to the third and fourth generation
  preserved_meaning: God addresses fathers’ wrongdoing with consequences extending through later generations.
  reasoning_layer_used: POB lexical decisions for פֹּקֵד and the generational phrases
  rationale: The opaque idiom and repetitive family sequence are recast in ordinary English.
interpretive_expansions:
- pob_phrase: leave unpunished
  rendering: leave the guilty unpunished
  claim: The judicial expression implies guilty people as its object.
  evidence:
  - The POB lexical rationale identifies “the guilty” as the implied object.
  - The POB theological decision preserves the tension between forgiveness and justice.
  confidence: high
  alternatives_preserved:
  - by no means clear the guilty
  - certainly not acquit
- pob_phrase: visiting the iniquity of fathers
  rendering: brings the consequences of fathers’ wrongdoing
  claim: In this judgment context, God attends to ancestral wrongdoing in a way that brings consequences.
  evidence:
  - The POB lexical rationale lists “bringing consequences for” as an available rendering.
  - The following generations define the reach of the visitation.
  confidence: moderate
  alternatives_preserved:
  - visiting the iniquity of fathers
  - attending to the wrongdoing of fathers
