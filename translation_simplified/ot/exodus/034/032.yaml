simplification_decisions:
- pob_phrase: Afterward all the sons of Israel came near
  simplified_phrase: After that, all the sons of Israel[a] came closer.
  preserved_meaning: The whole nation approached after the previous event.
  reasoning_layer_used: Lexical decisions for sequence, national designation, and concrete movement.
  rationale: The shorter sentence makes the sequence and movement easy to follow.
- pob_phrase: and he commanded them all that
  simplified_phrase: Then Moses gave them every command
  preserved_meaning: Moses authoritatively delivered the full content to the people as commands.
  reasoning_layer_used: The lexical decision for וַיְצַוֵּם preserves its authoritative force.
  rationale: Naming Moses clarifies the subject without adding a command to obey.
- pob_phrase: Yahweh had spoken with him on Mount Sinai
  simplified_phrase: Yahweh had spoken with him about on Mount Sinai
  preserved_meaning: The commands came from Yahweh’s earlier speech with Moses on Mount Sinai.
