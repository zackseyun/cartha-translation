translation:
  language: en
  text: No one may go up with you. In fact, no one may be seen anywhere on the mountain.[a] Even the flocks and herds must not graze in front of that mountain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “no one may appear anywhere on the mountain.” The Hebrew can mean either “be seen” or “appear.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: no man shall go up with you
  simplified_phrase: No one may go up with you
  preserved_meaning: The prohibition applies to every human being other than Moses.
  reasoning_layer_used: POB lexical decision for אִישׁ and its generic force
  rationale: “No one may” states the generic prohibition in clear modern English.
- pob_phrase: and indeed no man shall be seen
  simplified_phrase: In fact, no one may be seen
  preserved_meaning: The second prohibition strengthens the first and forbids anyone from being visible there.
  reasoning_layer_used: POB lexical decisions for וְגַם and אַל יֵרָא
  rationale: “In fact” keeps the emphatic force while a new sentence makes the command easier to follow.
- pob_phrase: the flock and the herd
  simplified_phrase: the flocks and herds
  preserved_meaning: Both smaller and larger livestock are included.
  reasoning_layer_used: POB lexical decision for הַצֹּאן וְהַבָּקָר
  rationale: The natural English plurals preserve the two classes of livestock.
