translation:
  language: en
  text: Observe the Feast of Unleavened Bread. At the appointed time in the month of Abib,[a] eat bread made without yeast for seven days, as I commanded you, because you came out of Egypt in that month.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib was the early spring month associated with Israel’s departure from Egypt.
    reason: cultural_note
simplification_decisions:
- pob_phrase: You shall keep the Feast of Unleavened Bread
  simplified_phrase: Observe the Feast of Unleavened Bread
  preserved_meaning: Israel must carry out the sacred covenant festival.
  reasoning_layer_used: Lexical and theological decisions on covenantal festival terminology
  rationale: “Observe” makes the required religious practice clearer while retaining the formal festival title.
- pob_phrase: you shall eat unleavened bread
  simplified_phrase: eat bread made without yeast
  preserved_meaning: The people must eat bread prepared without leaven during the festival.
  reasoning_layer_used: Lexical decision for מַצּוֹת
  rationale: The plain description explains “unleavened” without weakening the command.
- pob_phrase: for in the month of Abib you came out from Egypt
  simplified_phrase: because you came out of Egypt in that month
  preserved_meaning: The exodus during Abib is the reason for the observance.
  reasoning_layer_used: Lexical decisions for כִּי and יָצָאתָ מִמִּצְרָיִם
  rationale: “Because” states the explanatory link directly, and “out of Egypt” is natural modern English.
translation_notes:
  risk_flags:
  - risk: “Yeast” is a common simplification of the broader ancient idea of leaven.
    mitigation: The wording preserves the practical distinction of bread made without a leavening agent.
