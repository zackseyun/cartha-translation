  reasoning_layer_used: POB lexical and theological decisions for זנה and אַחֲרֵי אֱלֹהֵיהֶן
  rationale: “By following” explains the Hebrew idiom without removing its forceful prostitution image.
- pob_phrase: make your sons prostitute themselves after their gods
  simplified_phrase: lead your sons to prostitute themselves by following those gods
