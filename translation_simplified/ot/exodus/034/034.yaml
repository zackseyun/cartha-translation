translation:
  language: en
  text: But whenever Moses entered Yahweh’s presence to speak with him, he took off the veil and kept it off until he came out. Then he told the sons of Israel[a] everything he had been commanded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites, or the people of Israel; the Hebrew expression is literally “sons of Israel.”
    reason: lexical_alternative
