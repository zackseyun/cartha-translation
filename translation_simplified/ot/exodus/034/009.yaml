translation:
  language: en
  text: He said, “Lord, if I have found favor in your eyes, please go among us. Even though the people are stiff-necked—stubborn and unwilling to yield—please forgive our iniquity and our sin. Take us as your own people, your inheritance.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Claim us as your possession.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: please let the Lord go in our midst
  simplified_phrase: please go among us
  preserved_meaning: Moses asks the Lord himself to remain present as the people travel.
  reasoning_layer_used: lexical decision for יֵלֶךְ נָא ... בְּקִרְבֵּנוּ and direct-address context
  rationale: Direct second-person wording makes the prayer natural while “among us” preserves the image of presence within the people.
- pob_phrase: though it is a stiff-necked people
  simplified_phrase: Even though the people are stiff-necked—stubborn and unwilling to yield
  preserved_meaning: Israel is obstinate, yet Moses still asks the Lord to accompany and forgive them.
  reasoning_layer_used: latest revision pass and lexical decision for קְשֵׁה עֹרֶף
  rationale: The concessive force and neck image remain, with a brief explanation for new readers.
- pob_phrase: take us as your inheritance
  simplified_phrase: Take us as your own people, your inheritance
  preserved_meaning: Moses asks God to claim Israel as the people who belong to him.
  reasoning_layer_used: theological and lexical decisions for וּנְחַלְתָּנוּ
  rationale: “Your own people” clarifies covenant belonging without removing the inheritance language.
interpretive_expansions:
- pob_phrase: stiff-necked
  rendering: stiff-necked—stubborn and unwilling to yield
  claim: The physical image describes persistent obstinacy.
  evidence:
  - The POB lexical decision identifies the phrase as a Hebrew metaphor for obstinacy.
  - The listed alternative is “stubborn.”
  confidence: high
  alternatives_preserved:
  - stiff-necked
- pob_phrase: take us as your inheritance
  rendering: Take us as your own people, your inheritance
  claim: The inheritance is Israel as God's covenant people who belong to him.
  evidence:
  - The POB theological rationale identifies covenant belonging rather than territorial inheritance.
  - The POB lexical rationale describes Israel as God's allotted possession.
  confidence: high
  alternatives_preserved:
  - Claim us as your possession.
translation_notes:
  risk_flags:
  - risk: Readers may take “stiff-necked” as a physical condition.
    mitigation: The inline gloss identifies it as stubborn refusal to yield.
  - risk: “Inheritance” may suggest that God receives property after a death.
    mitigation: “Your own people” and the footnote clarify the covenant-possession sense.
