    mitigation: Footnote c preserves “when he spoke with him” as an alternative.
  - risk: The pronoun “him” may be unclear to readers entering at this verse.
    mitigation: Footnote b identifies the contextual referent as the LORD without changing the Hebrew pronoun in the text.
