translation:
  language: en
  text: When Moses came down from Mount Sinai, he carried the two tablets of the testimony in his hand. As he came down the mountain, Moses did not know that the skin of his face was shining[a] because he had spoken with him.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “sent out rays.” The traditional rendering “was horned” is less likely in this context.
    reason: lexical_alternative
  - marker: b
    text: “Him” refers to the LORD.
    reason: alternative_reading
  - marker: c
    text: The last phrase may also be translated, “when he spoke with him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And it happened, when Moses came down
  simplified_phrase: When Moses came down
  preserved_meaning: The verse opens a new scene as Moses descends.
  reasoning_layer_used: Lexical decision for וַיְהִי and the temporal construction
  rationale: The direct time clause gives the same narrative setting without a heavy opening formula.
- pob_phrase: with the two tablets of the testimony in Moses' hand
  simplified_phrase: he carried the two tablets of the testimony in his hand
  preserved_meaning: Moses physically had the covenant testimony tablets with him.
  reasoning_layer_used: Lexical decisions for שְׁנֵי לֻחֹת הָעֵדֻת and בְּיַד מֹשֶׁה
  rationale: A separate active sentence is easier to follow while retaining “testimony” and the concrete image of his hand.
- pob_phrase: the skin of his face shone
  simplified_phrase: the skin of his face was shining
  preserved_meaning: Visible radiance came from the skin of Moses’ face.
  reasoning_layer_used: Lexical and theological decisions for קָרַן and עוֹר פָּנָיו
  rationale: The progressive wording fits the ongoing condition while preserving both the radiance and the explicit reference to skin.
translation_notes:
  risk_flags:
