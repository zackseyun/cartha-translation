translation:
  language: en
  text: When Moses’s father-in-law saw everything Moses was doing for the people, he asked, “What is this work you are doing for the people? Why are you sitting alone while everyone stands before you from morning until evening?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all that he was doing
  simplified_phrase: everything Moses was doing
  preserved_meaning: The wording still covers the full range of Moses’s ongoing activity.
  reasoning_layer_used: Lexical decision for אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה.
  rationale: Naming Moses removes an unclear pronoun without changing the action.
- pob_phrase: What is this thing that you are doing for the people?
  simplified_phrase: What is this work you are doing for the people?
  preserved_meaning: Jethro first questions the activity Moses is carrying out on the people’s behalf.
  reasoning_layer_used: Lexical decisions for מָה הַדָּבָר הַזֶּה and לָעָם.
  rationale: “Work” makes the Hebrew idiom understandable while preserving the question “what.”
- pob_phrase: Why do you sit alone, while all the people stand before you
  simplified_phrase: Why are you sitting alone while everyone stands before you
  preserved_meaning: The second question separately challenges Moses’s solitary role as the people wait before him.
  reasoning_layer_used: Lexical decisions for אַתָּה יוֹשֵׁב לְבַדֶּךָ and וְכָל הָעָם נִצָּב עָלֶיךָ.
  rationale: Natural wording preserves both the two-question progression and the physical scene.
