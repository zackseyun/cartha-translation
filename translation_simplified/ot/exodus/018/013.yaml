translation:
  language: en
  text: The next day, Moses took his seat to decide the people’s cases. The people stood waiting before him[a] from morning until evening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stood around Moses.” The Hebrew expression describes the people gathered there awaiting his decisions.
    reason: lexical_alternative
