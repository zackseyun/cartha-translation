translation:
  language: en
  text: He also took her two sons. One was named Gershom, because Moses said, “I have been a foreigner[a] in a land not my own.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a temporary resident” or “an outsider.”
