  text: When they have a dispute, they bring it to me.[a] I judge between a man and his neighbor,[b] and I inform them about God's statutes and laws.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “it comes to me”; the sense is that the dispute is brought before Moses.
