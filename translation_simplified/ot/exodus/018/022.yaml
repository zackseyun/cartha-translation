translation:
  language: en
  text: Let them judge the people at all times. They must bring every major case to you, but they are to decide every minor case themselves. Make your load lighter, and they will carry the burden with you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: every great matter ... every small matter
  simplified_phrase: every major case ... every minor case
  preserved_meaning: The contrast between more serious and less serious matters brought for judgment remains intact.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: Using “case” makes the judicial setting immediately clear.
- pob_phrase: they themselves shall judge
  simplified_phrase: they are to decide ... themselves
  preserved_meaning: The appointed judges, rather than Moses, must handle the minor cases.
  reasoning_layer_used: POB lexical decision for יִשְׁפְּטוּ הֵם
  rationale: “Decide” is natural English for resolving a case while “themselves” keeps the Hebrew emphasis.
- pob_phrase: make it lighter for yourself
  simplified_phrase: make your load lighter
  preserved_meaning: Moses is commanded to reduce the weight of his judicial work.
  reasoning_layer_used: POB lexical decision and doctrine realignment for וְהָקֵל מֵעָלֶיךָ
  rationale: Naming the implied load clarifies the image without changing the imperative into a prediction.
