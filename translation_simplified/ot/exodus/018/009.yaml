translation:
  language: en
  text: Jethro rejoiced over all the good Yahweh had done for Israel. Yahweh had rescued them from Egypt’s power.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was glad about all the good.” The Hebrew verb can mean gladness or rejoicing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says “from the hand of Egypt,” meaning from Egypt’s power.
    reason: source_note
