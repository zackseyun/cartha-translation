translation:
  language: en
  text: Now I know that Yahweh is greater than all the gods. In the very situation where they acted arrogantly against Israel, Yahweh showed that he was above them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of the last clause is difficult. It may instead mean, “because of the very thing in which they acted proudly against them.”
    reason: alternative_reading
