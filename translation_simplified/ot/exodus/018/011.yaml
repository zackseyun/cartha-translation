- pob_phrase: because in the matter in which
  simplified_phrase: In the very situation where
  preserved_meaning: The same event displayed both the oppressors’ arrogance and Yahweh’s superiority.
  reasoning_layer_used: lexical decision for בַדָּבָר and theological decision on the final clause
  rationale: “Situation” makes the event-based sense of “matter” immediately clear.
- pob_phrase: he was above them
  simplified_phrase: Yahweh showed that he was above them
  preserved_meaning: Yahweh’s superiority over the arrogant oppressors was demonstrated by what happened.
  reasoning_layer_used: theological rationale for the difficult final clause
  rationale: Repeating “Yahweh” clarifies the subject without weakening the image of being above them.
- pob_phrase: Now I know that Yahweh is greater than all the gods, because
  simplified_phrase: Now I know that Yahweh is greater than all the gods. In
  preserved_meaning: Jethro’s conclusion rests on Yahweh’s demonstrated superiority.
  reasoning_layer_used: lexical decisions for עַתָּה, יָדַעְתִּי, גָדוֹל, and כִּי
  rationale: Two sentences make the confession and its evidence easier to follow.
