  text: Then Jethro, Moses’ father-in-law, took a burnt offering and sacrifices for God. Aaron and all Israel’s elders came to share a meal[a] with him in God’s presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “to eat bread”; here the phrase means to share a meal.
    reason: lexical_alternative
