- pob_phrase: When men struggle together
  simplified_phrase: When men fight
  preserved_meaning: The men are engaged in a physical conflict.
  reasoning_layer_used: Lexical decision for יִנָּצוּ
  rationale: “Fight” states the physical conflict in common English.
- pob_phrase: he shall surely be fined
  simplified_phrase: the offender must pay a fine
  preserved_meaning: The responsible man is certainly subject to a financial penalty.
  reasoning_layer_used: Lexical decision for עָנוֹשׁ יֵעָנֵשׁ
  rationale: “Must pay a fine” clearly preserves both the required penalty and its financial nature.
- pob_phrase: as the woman's husband imposes on him, and he shall pay according to the judges
  simplified_phrase: He must pay what the woman’s husband demands, as the judges decide
  preserved_meaning: The husband sets a demanded penalty within a formal judicial process.
  reasoning_layer_used: Lexical decisions for כַּאֲשֶׁר יָשִׁית עָלָיו and בִּפְלִלִים
  rationale: The new wording makes the roles of the husband and judges easier to follow.
interpretive_expansions:
- pob_phrase: he shall surely be fined
  rendering: the offender must pay a fine
  claim: The singular “he” is the man held responsible for striking the woman.
  evidence:
