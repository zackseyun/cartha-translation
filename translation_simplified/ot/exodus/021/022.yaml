translation:
  language: en
  text: When men fight and strike a pregnant woman, causing her children to come out,[a] but no serious injury results,[b] the offender must pay a fine. He must pay what the woman’s husband demands, as the judges decide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “her children come out.” This may describe a premature birth, but some interpret it as a miscarriage.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not specify whether the serious injury concerns the woman, the child, or either one.
    reason: alternative_reading
