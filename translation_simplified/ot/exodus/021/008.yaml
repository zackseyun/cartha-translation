translation:
  language: en
  text: If her master is not pleased with her and has not chosen her for himself,[a] he must allow someone to pay for her release. He has no right to sell her to a foreign people, because he has acted deceitfully toward her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; it may instead mean, “who has chosen—or betrothed—her for himself.”
    reason: textual_variant
  - marker: b
    text: Or, “because he has acted treacherously toward her.”
    reason: lexical_alternative
