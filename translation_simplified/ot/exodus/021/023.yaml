translation:
  language: en
  text: But if harm occurs, you must give life for life.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean serious injury or death; it does not specify here who is harmed or whether the harm is fatal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if there is harm
  simplified_phrase: if harm occurs
  preserved_meaning: The kind, severity, and recipient of the harm remain unspecified.
  reasoning_layer_used: Lexical and theological decisions on אָסוֹן and יִהְיֶה
  rationale: “Occurs” is concise, natural English without adding emphasis.
- pob_phrase: then you shall give
  simplified_phrase: you must give
  preserved_meaning: The clause remains a binding legal requirement, not a monetary payment.
  reasoning_layer_used: Lexical decision on וְנָתַתָּה
  rationale: “Must” makes the legal force clear while retaining “give.”
translation_notes:
  risk_flags:
