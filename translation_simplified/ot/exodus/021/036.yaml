translation:
  language: en
  text: Or suppose it was already known that an ox had a habit of goring, and its owner did not keep it confined. The owner must pay in full by replacing the dead ox with another ox, and then the dead animal will belong to him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew describes the ox as goring “from yesterday and the day before,” an idiom meaning it had shown this behavior before.
    reason: cultural_note
