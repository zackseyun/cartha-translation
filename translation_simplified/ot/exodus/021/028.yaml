translation:
  language: en
  text: If an ox gores a man or a woman and the victim dies, the ox must be stoned to death. No one may eat its meat. But the ox’s owner is free from penalty in this case.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a broad legal term that can also mean “is innocent” or “is not liable.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and he dies
  simplified_phrase: and the victim dies
  preserved_meaning: The person gored by the ox dies, whether the victim is a man or a woman.
  reasoning_layer_used: lexical decision for וָמֵת
  rationale: Naming the victim removes an unclear masculine pronoun without collapsing the explicit reference to both sexes.
- pob_phrase: shall surely be stoned
  simplified_phrase: must be stoned to death
  preserved_meaning: The ox is emphatically required to be executed by stoning.
  reasoning_layer_used: lexical decision for סָקוֹל יִסָּקֵל
  rationale: “Must” and “to death” express the command’s legal force and emphatic Hebrew construction in ordinary English.
- pob_phrase: its flesh shall not be eaten; but the owner of the ox is clear
  simplified_phrase: No one may eat its meat. But the ox’s owner is free from penalty in this case.
  preserved_meaning: The animal may not be eaten, while its owner bears no penalty in this basic case.
  reasoning_layer_used: lexical and theological decisions for בְּשָׂרוֹ and נָקִי
  rationale: The active wording and legal explanation make both rules clear while keeping the owner’s exemption broad.
translation_notes:
  risk_flags:
  - risk: “Free from penalty” could be read as defining the exact kind of exemption.
