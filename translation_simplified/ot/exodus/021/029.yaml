translation:
  language: en
  text: But suppose an ox was known for goring before. Its owner had been warned but failed to restrain it. If the ox then kills a man or a woman, the ox must be stoned, and its owner must also be put to death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: was accustomed to gore from yesterday and the day before
  simplified_phrase: was known for goring before
  preserved_meaning: The ox had an established history of goring, not merely one prior incident.
  reasoning_layer_used: POB lexical decision and cultural note on נַגָּח and מִתְּמֹל שִׁלְשֹׁם
  rationale: This replaces the opaque Hebrew time idiom with its documented legal sense.
- pob_phrase: did not keep it in
  simplified_phrase: failed to restrain it
  preserved_meaning: The warned owner did not confine or control the dangerous ox.
  reasoning_layer_used: POB lexical decision on וְלֹא יִשְׁמְרֶנּוּ
  rationale: “Restrain” states the practical duty more clearly in modern English.
- pob_phrase: shall be stoned ... shall be put to death
  simplified_phrase: must be stoned ... must also be put to death
  preserved_meaning: Both clauses prescribe legal penalties, and the owner's penalty is judicial execution.
  reasoning_layer_used: POB lexical and theological decisions on יִסָּקֵל and יוּמָת
  rationale: “Must” gives the case law direct, understandable legal force.
translation_notes:
  risk_flags:
  - risk: Replacing the literal prior-days idiom may reduce the Hebrew law's historical flavor.
