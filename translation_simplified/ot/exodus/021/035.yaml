translation:
  language: en
  text: If one person's ox strikes a neighbor's ox and the neighbor's ox dies, the two owners must sell the live ox and split the money from the sale. They must also divide the dead ox between them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ox may strike by goring or by another forceful blow.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one man's ox strikes his neighbor's ox and it dies
  simplified_phrase: one person's ox strikes a neighbor's ox and the neighbor's ox dies
  preserved_meaning: One ox delivers a fatal blow to an ox belonging to another person.
  reasoning_layer_used: POB lexical decisions for שׁוֹר אִישׁ, יִגֹּף, שׁוֹר רֵעֵהוּ, and וָמֵת
  rationale: Repeating “the neighbor's ox” removes an unclear pronoun without narrowing how the ox struck.
- pob_phrase: they shall sell the live ox and divide its price
  simplified_phrase: the two owners must sell the live ox and split the money from the sale
  preserved_meaning: The owners are required to sell the surviving ox and share its sale proceeds.
  reasoning_layer_used: POB lexical decisions for וּמָכְרוּ and וְחָצוּ אֶת כַּסְפּוֹ
  rationale: “Money from the sale” explains “price,” while “must” clearly expresses the required legal procedure.
- pob_phrase: they shall also divide the dead one
  simplified_phrase: They must also divide the dead ox between them
  preserved_meaning: The dead animal itself is shared as well as the proceeds from the live one.
  reasoning_layer_used: POB lexical decision for וְגַם אֶת הַמֵּת יֶחֱצוּן
  rationale: Naming the dead ox and adding “between them” makes the division immediately clear.
