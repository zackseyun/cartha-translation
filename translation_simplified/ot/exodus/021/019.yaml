- pob_phrase: have him thoroughly healed
  rendering: make sure he fully recovers
  claim: The striker is responsible for the injured man's complete recovery rather than personally serving as healer.
  evidence:
  - The POB lexical rationale reads the emphatic Hebrew expression as responsibility for care until recovery.
  confidence: high
  alternatives_preserved:
