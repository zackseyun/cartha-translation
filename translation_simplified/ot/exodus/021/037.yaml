  preserved_meaning: The higher repayment applies when the thief disposes of the animal by slaughter or sale.
  reasoning_layer_used: POB lexical decisions and immediate legal context
  rationale: “Then” makes the sequence clear without changing the condition.
- pob_phrase: for the ox ... for the sheep
