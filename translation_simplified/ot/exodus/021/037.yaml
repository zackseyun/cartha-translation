translation:
  language: en
  text: If a man steals an ox or a sheep[a] and then slaughters or sells it, he must pay back five cattle for the stolen ox and four sheep for the stolen sheep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to a sheep or a goat; “sheep” best fits the wording of this verse.
    reason: lexical_alternative
