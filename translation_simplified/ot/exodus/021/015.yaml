simplification_decisions:
- pob_phrase: Whoever strikes
  simplified_phrase: Anyone who hits
  preserved_meaning: The law concerns a person who physically strikes a parent.
  reasoning_layer_used: POB lexical decision for מַכֵּה
  rationale: “Hits” states the physical act in more familiar English without intensifying it to beating or attacking.
- pob_phrase: his father or his mother
  simplified_phrase: their father or mother
  preserved_meaning: Father and mother remain separately named, and striking either one is in view.
  reasoning_layer_used: POB lexical decisions for אָבִיו, אִמּוֹ, and the conjunction
  rationale: Singular “their” is natural modern English, while “or” preserves the law’s intended scope.
- pob_phrase: shall surely be put to death
  simplified_phrase: must be put to death
  preserved_meaning: The verse imposes a definite judicial death penalty rather than merely predicting death.
  reasoning_layer_used: POB theological decision on the legal penalty formula
  rationale: “Must” clearly expresses the required penalty, and the passive wording retains its judicial force.
translation_notes:
  risk_flags:
  - risk: “Hits” may sound less formal than “strikes.”
