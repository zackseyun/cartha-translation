    reason: alternative_reading
simplification_decisions:
- pob_phrase: the glory of Yahweh settled on Mount Sinai
  simplified_phrase: The glory of Yahweh came to rest on Mount Sinai
  preserved_meaning: Yahweh’s manifest glory took up a settled presence on the mountain.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁכֹּן and כְּבוֹד יְהוָה.
  rationale: “Came to rest” clearly conveys movement into a settled presence.
- pob_phrase: the cloud covered it
  simplified_phrase: The cloud covered the mountain
  preserved_meaning: The known cloud covered Mount Sinai, the preferred referent of the Hebrew suffix.
  reasoning_layer_used: Lexical and theological decisions on וַיְכַסֵּהוּ and הֶעָנָן.
  rationale: Naming the mountain removes an unclear pronoun while the footnote preserves the alternative.
- pob_phrase: from the midst of the cloud
  simplified_phrase: from inside the cloud
  preserved_meaning: Yahweh’s call came from the cloud’s interior.
  reasoning_layer_used: Lexical decision for מִתּוֹךְ הֶעָנָן.
  rationale: “Inside” preserves the spatial image in ordinary English.
