- pob_phrase: And the appearance of the glory of Yahweh was like
  simplified_phrase: Yahweh’s glory ... It looked like
  preserved_meaning: Yahweh’s visible glory is compared to fire, not identified as fire.
  reasoning_layer_used: Lexical decisions for מַרְאֵה and כְּאֵשׁ
  rationale: Two direct sentences make the visual comparison easier to follow.
- pob_phrase: in the sight of the sons of Israel
  simplified_phrase: The sons of Israel could see
  preserved_meaning: The sight was openly visible to the sons of Israel.
  reasoning_layer_used: Lexical decision for לְעֵינֵי and theological decision for בְּנֵי יִשְׂרָאֵל
  rationale: The Hebrew visual idiom becomes a natural active clause while the covenantal designation remains intact.
