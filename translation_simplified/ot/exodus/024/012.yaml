translation:
  language: en
  text: Then Yahweh said to Moses, “Come up the mountain to me and stay there. I will give you the stone tablets, the law, and the commandment[a], which I have written to teach the people.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the instruction and the commandment.” Here the Hebrew word translated “law” can also mean “instruction” or “teaching.”
    reason: lexical_alternative
  - marker: b
    text: “The law and the commandment” may be additional instruction given with the tablets, or they may describe what is written on the tablets.
    reason: alternative_reading
