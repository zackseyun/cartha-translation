translation:
  language: en
  text: Hang the veil from four acacia-wood pillars covered with gold. The pillars must have gold hooks and stand on four silver bases.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “four silver sockets.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall hang it
  simplified_phrase: Hang the veil
  preserved_meaning: The command is to hang the veil mentioned in the previous verse.
  reasoning_layer_used: Lexical decision for וְנָתַתָּה and the antecedent of אֹתָהּ.
  rationale: Naming the veil removes an unclear pronoun while preserving the commanded action.
- pob_phrase: four pillars of acacia wood overlaid with gold
  simplified_phrase: four acacia-wood pillars covered with gold
  preserved_meaning: The four supports are made of acacia wood and have a gold overlay.
  reasoning_layer_used: Lexical decisions for עַמּוּדֵי שִׁטִּים and מְצֻפִּים זָהָב.
  rationale: “Covered with gold” communicates the material construction more plainly than “overlaid.”
- pob_phrase: their hooks being of gold, on four silver bases
  simplified_phrase: The pillars must have gold hooks and stand on four silver bases
  preserved_meaning: Each pillar has gold hooks and is supported by a silver base.
  reasoning_layer_used: Lexical decisions for וָוֵיהֶם and אַדְנֵי כָסֶף.
  rationale: A separate sentence makes the hooks and supports easier to picture.
translation_notes:
  risk_flags:
  - risk: “Covered with gold” could suggest solid gold rather than an applied layer.
    mitigation: The wording still identifies acacia wood as the pillar material, making the gold a covering.
