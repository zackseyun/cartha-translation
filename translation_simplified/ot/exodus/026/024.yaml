translation:
  language: en
  text: The two boards must be paired at the bottom. At the top, the pair must be structurally complete up to the one ring.[a] Both corner boards must be made this way, one for each of the two corners.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “up to the single ring,” possibly the ring that joins the boards at the top.
    reason: lexical_alternative
