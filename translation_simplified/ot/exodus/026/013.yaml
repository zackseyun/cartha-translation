translation:
  language: en
  text: The tent curtains will have one extra cubit of length on each side.[a] This extra material will hang down over both sides of the tabernacle to cover it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit is an ancient unit of length.
    reason: cultural_note
  - marker: b
    text: The tabernacle was the sacred dwelling structure beneath the tent covering.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the extra cubit on this side and the extra cubit on that side
  simplified_phrase: one extra cubit of length on each side
  preserved_meaning: Each of the two opposite sides has one cubit of surplus curtain length.
  reasoning_layer_used: Lexical decisions for הָאַמָּה and מִזֶּה ... מִזֶּה
  rationale: “On each side” states the repeated two-sided measurement more directly.
- pob_phrase: from the surplus in the length of the tent curtains
  simplified_phrase: The tent curtains will have one extra cubit of length
  preserved_meaning: The extra material comes from the curtains being longer than the structure.
  reasoning_layer_used: Lexical decisions for בָּעֹדֵף, אֹרֶךְ, and יְרִיעֹת הָאֹהֶל
  rationale: The surplus is recast as extra curtain length in ordinary construction language.
- pob_phrase: shall hang over the sides of the tabernacle on this side and on that side, to cover it
  simplified_phrase: This extra material will hang down over both sides of the tabernacle to cover it
  preserved_meaning: The surplus curtain material overhangs the two sides for the purpose of covering the tabernacle.
  reasoning_layer_used: Lexical decisions for יִהְיֶה סָרוּחַ, צִדֵּי הַמִּשְׁכָּן, and לְכַסֹּתוֹ
  rationale: A second sentence clarifies what hangs down and why.
