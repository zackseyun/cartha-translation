translation:
  language: en
  text: Make an entrance curtain[a] for the tent from blue, purple, and scarlet yarn and fine twisted linen. It must be embroidered by an embroiderer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This curtain covers the tent entrance. It may also be called a screen or veil and is distinct from the inner veil in this chapter.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall make a screen for the entrance of the tent
  simplified_phrase: Make an entrance curtain for the tent
  preserved_meaning: This remains a command to make a hanging that covers the tent entrance.
  reasoning_layer_used: The lexical decisions for וְעָשִׂיתָ, מָסָךְ, and לְפֶתַח הָאֹהֶל.
  rationale: The direct command and “entrance curtain” avoid suggesting a rigid screen.
- pob_phrase: of blue and purple and scarlet yarn, and fine twisted linen
  simplified_phrase: from blue, purple, and scarlet yarn and fine twisted linen
  preserved_meaning: All specified textile materials, colors, and qualities remain distinct.
  reasoning_layer_used: The audited lexical decisions for the color terms and שֵׁשׁ מָשְׁזָר.
  rationale: “From” naturally introduces the materials used to make the curtain.
- pob_phrase: the work of an embroiderer
  simplified_phrase: It must be embroidered by an embroiderer
  preserved_meaning: The curtain requires the decorative textile work of an embroiderer.
  reasoning_layer_used: The lexical rationale for מַעֲשֵׂה רֹקֵם.
  rationale: A separate active clause makes the craftsmanship requirement easy to understand without adding “skilled.”
