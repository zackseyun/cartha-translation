translation:
  language: en
  text: Mount Sinai was completely covered in smoke because Yahweh had come down on it in fire. Smoke rose from the mountain like smoke from a furnace,[a] and the whole mountain shook violently.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like smoke from a kiln.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was all in smoke
  simplified_phrase: was completely covered in smoke
  preserved_meaning: The entire mountain was enveloped in smoke.
  reasoning_layer_used: lexical decision for עָשַׁן כֻּלּוֹ
  rationale: “Completely covered” states the smoke-filled image in more natural English.
- pob_phrase: had descended on it
  simplified_phrase: had come down on it
  preserved_meaning: Yahweh moved downward onto Mount Sinai.
  reasoning_layer_used: lexical and theological decisions for יָרַד and יְהוָה
  rationale: “Come down” is more familiar while keeping Yahweh’s personal name and the direction of movement.
- pob_phrase: the whole mountain trembled greatly
  simplified_phrase: the whole mountain shook violently
  preserved_meaning: The entire mountain underwent intense physical shaking.
  reasoning_layer_used: lexical decisions for וַיֶּחֱרַד and מְאֹד
  rationale: “Shook violently” expresses the intensity more directly for common readers.
translation_notes:
  risk_flags:
  - risk: “Covered in smoke” may sound less stative than “was all in smoke.”
    mitigation: “Completely” preserves the source emphasis that smoke enveloped the whole mountain.
