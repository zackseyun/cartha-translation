  preserved_meaning: God directs Moses to deliver these exact words.
  reasoning_layer_used: Lexical decision for תְּדַבֵּר
  rationale: “Must speak” expresses the directive clearly without weakening its solemn force.
- pob_phrase: the sons of Israel
  simplified_phrase: the sons of Israel
  preserved_meaning: The filial, masculine Hebrew expression is retained while referring corporately to Israel.
