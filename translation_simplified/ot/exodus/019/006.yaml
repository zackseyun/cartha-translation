translation:
  language: en
  text: You will belong to me as a kingdom of priests[a] and a holy nation. These are the words you must speak to the sons of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a priestly kingdom.” The Hebrew may mean a kingdom made up of priests or a kingdom with a priestly character.
    reason: lexical_alternative
  - marker: b
    text: “The sons of Israel” is the Hebrew expression for the whole people of Israel, not only the men.
    reason: cultural_note
