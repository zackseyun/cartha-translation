translation:
  language: en
  text: So now, if you truly listen to my voice and keep my covenant, you will be my treasured possession from among all peoples, because the whole earth belongs to me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And now
  simplified_phrase: So now
  preserved_meaning: The command follows from what God has just said.
  reasoning_layer_used: POB lexical decision for וְעַתָּה
  rationale: “So now” makes the connection to the preceding context clear in natural English.
- pob_phrase: if you will indeed listen to my voice
  simplified_phrase: if you truly listen to my voice
  preserved_meaning: God calls for attentive, obedient listening while retaining the Hebrew image of hearing his voice.
  reasoning_layer_used: POB lexical and theological decisions for שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  rationale: “Truly listen” expresses the Hebrew emphasis without replacing listening with abstract obedience.
- pob_phrase: out of all the peoples, for all the earth is mine
  simplified_phrase: from among all peoples, because the whole earth belongs to me
  preserved_meaning: Israel is specially selected without denying that God owns every nation and the whole earth.
  reasoning_layer_used: POB lexical and theological decisions for מִכָּל הָעַמִּים and לִי כָּל הָאָרֶץ
  rationale: “From among” clarifies selection, and “belongs to me” states divine ownership plainly.
translation_notes:
  risk_flags:
