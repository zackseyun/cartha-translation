translation:
  language: en
  text: When morning came on the third day, there was thunder[a] and lightning. A thick cloud was on the mountain, and a trumpet blast[b] was very loud. Everyone in the camp trembled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “sounds” or “voices,” but with lightning it most likely means thunder.
    reason: lexical_alternative
  - marker: b
    text: Or, “the sound of a ram’s horn.” The Hebrew shofar is a horn trumpet, traditionally made from an animal horn.
    reason: lexical_alternative
