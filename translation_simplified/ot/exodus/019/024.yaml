translation:
  language: en
  text: Yahweh said to him, “Go down. Then come back up with Aaron. But the priests and the people must not break through[a] to come up to Yahweh, or Yahweh will break out against them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew uses related images: the people must not force their way through, or Yahweh will burst out against them in judgment.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Go down, and come up—you and Aaron with you
  simplified_phrase: Go down. Then come back up with Aaron.
  preserved_meaning: The man addressed must descend first and later ascend with Aaron accompanying him.
  reasoning_layer_used: lexical decisions for לֶךְ רֵד, וְעָלִיתָ, and אַתָּה וְאַהֲרֹן עִמָּךְ
  rationale: Two short sentences make the sequence and Aaron’s accompaniment immediately clear.
- pob_phrase: lest he break out against them
  simplified_phrase: or Yahweh will break out against them
  preserved_meaning: Their forbidden approach would bring sudden divine judgment.
  reasoning_layer_used: lexical decision for פֶּן יִפְרָץ בָּם and divine-name policy
  rationale: Naming Yahweh removes an unclear pronoun while preserving the vivid judgment image.
