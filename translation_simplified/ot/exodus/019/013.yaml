translation:
  language: en
  text: No one must touch the offender directly[a]. He must be put to death by stoning or by being shot[b]. Whether animal or man, he must not be allowed to live. When the ram’s horn sounds a long blast[c], the people may go up on the mountain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “touch it directly”; the Hebrew pronoun may refer more generally to what has become forbidden through contact.
    reason: alternative_reading
  - marker: b
    text: Or “pierced”; the Hebrew likely refers here to being shot with arrows.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew describes the prolonged sounding of a ram’s horn.
    reason: cultural_note
