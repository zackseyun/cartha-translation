translation:
  language: en
  text: Yahweh said to Moses, “Look, I am coming to you in a thick cloud so that the people will hear me speaking with you and will also always trust you.[a]” Then Moses reported to Yahweh what the people had said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will also always believe in you.” The Hebrew describes enduring confidence in Moses as God’s spokesman.
    reason: lexical_alternative
