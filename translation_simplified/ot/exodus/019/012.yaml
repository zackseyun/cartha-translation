translation:
  language: en
  text: You must set a boundary around the mountain for the people. Tell them, “Be careful not to go up the mountain or touch its edge. Anyone who touches the mountain must certainly be put to death.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “must certainly die.” The wording here points to execution, as the next verse explains.
    reason: lexical_alternative
