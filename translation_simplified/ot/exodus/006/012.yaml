translation:
  language: en
  text: But Moses said to Yahweh, “The Israelites have not listened to me. So how will Pharaoh listen to me? I have uncircumcised lips[a]—my speech is hindered or inadequate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the vivid image “uncircumcised lips” without specifying exactly how Moses’ speech was hindered or inadequate; compare Exodus 4:10.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spoke before Yahweh, saying
  simplified_phrase: said to Yahweh
  preserved_meaning: Moses directly addresses Yahweh with an objection.
  reasoning_layer_used: The lexical alternatives allow “to Yahweh,” and ordinary English does not need a separate speech-introduction clause.
  rationale: This recasts a formal Hebrew speech formula as natural English.
- pob_phrase: the sons of Israel
  simplified_phrase: the Israelites
  preserved_meaning: The phrase refers collectively to Israel’s covenant people.
  reasoning_layer_used: The POB footnote and lexical alternatives explicitly permit “the Israelites.”
  rationale: The familiar group name is immediately clear to modern readers.
- pob_phrase: since I am uncircumcised in lips
  simplified_phrase: I have uncircumcised lips—my speech is hindered or inadequate
  preserved_meaning: Moses describes his speech as impeded or unfit while leaving the exact problem uncertain.
  reasoning_layer_used: The lexical and theological decisions require preserving both the Hebrew image and its unresolved nuance.
  rationale: The metaphor is retained and then explained without assigning Moses a specific condition.
