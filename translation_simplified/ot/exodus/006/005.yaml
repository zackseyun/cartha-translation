translation:
  language: en
  text: I too have heard the people of Israel groaning as the Egyptians force them to work as slaves. And I have remembered my covenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “remembered” does not mean that God had forgotten. It means that he is turning toward his covenant in action.
    reason: cultural_note
