translation:
  language: en
  text: I appeared to Abraham, Isaac, and Jacob as God Almighty.[a] But I was not known to them by my name, Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew El Shaddai, traditionally translated “God Almighty.”
    reason: lexical_alternative
  - marker: b
    text: This may mean, “I did not make myself known to them by my name Yahweh.” It may refer to the name’s full covenant meaning rather than to whether they had heard the name itself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I appeared to Abraham, to Isaac, and to Jacob as God Almighty
  simplified_phrase: I appeared to Abraham, Isaac, and Jacob as God Almighty.
  preserved_meaning: God appeared to each of the three patriarchs under the title God Almighty.
  reasoning_layer_used: POB lexical decisions for וָאֵרָא, repeated אֶל, and בְּאֵל שַׁדָּי
  rationale: Removing the opening conjunction and repeated prepositions gives natural English without changing who saw God or how he identified himself.
- pob_phrase: but by my name, Yahweh, I was not known to them
  simplified_phrase: But I was not known to them by my name, Yahweh.
  preserved_meaning: The patriarchs did not know God by the name Yahweh in the sense intended here.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה and לֹא נוֹדַעְתִּי לָהֶם
  rationale: Ordinary English word order improves clarity while preserving the Hebrew clause’s unresolved meaning.
