translation:
  language: en
  text: Then Yahweh said to Moses, “Now you will see what I will do to Pharaoh. Because of a strong hand,[a] he will let the Israelites go, and because of a strong hand, he will drive them out of his land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated phrase may also mean “under compulsion.” It likely points to the overwhelming force of God’s power, but the Hebrew does not explicitly identify whose strong hand it is.
    reason: lexical_alternative
