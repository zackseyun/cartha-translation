translation:
  language: en
  text: Eleazar, Aaron’s son, took a wife from among Putiel’s daughters.[a] She gave birth to Eleazar’s son, Phinehas. These are the leaders of the ancestral households of the Levite clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that he married a woman from Putiel’s family, without saying she was his direct daughter.
    reason: lexical_alternative
