  reasoning_layer_used: POB lexical decisions and genealogy context
  rationale: The possessive form is more natural while preserving the family relationship.
- pob_phrase: and she bore him Phinehas
  simplified_phrase: She gave birth to Eleazar’s son, Phinehas.
  preserved_meaning: Eleazar’s wife gave birth to Phinehas, who is identified as Eleazar’s son.
  reasoning_layer_used: POB lexical decision on וַתֵּלֶד לוֹ אֶת־פִּינְחָס and grounding review
  rationale: The wording uses common English while retaining both parental relationships marked in the Hebrew.
- pob_phrase: the heads of the fathers’ houses of the Levites by their clans
