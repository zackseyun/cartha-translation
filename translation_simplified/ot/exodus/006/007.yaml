translation:
  language: en
  text: I will take you as my own people, and I will be your God. Then you will know that I am Yahweh your God, who brought you out from under the burdens Egypt forced on you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “who brings you out,” presenting Yahweh as the one who delivers his people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: take you to be my people
  simplified_phrase: take you as my own people
  preserved_meaning: God takes Israel into a covenant relationship as the people who belong to him.
  reasoning_layer_used: Lexical decision for לִי לְעָם and the covenant-formula theological decision.
  rationale: “As my own people” makes the relationship and belonging clear in natural English.
- pob_phrase: and you will know
  simplified_phrase: Then you will know
  preserved_meaning: Israel will recognize Yahweh as their God through his promised deliverance.
  reasoning_layer_used: Lexical decision for וִידַעְתֶּם and immediate promise context.
  rationale: “Then” clearly shows the result without changing the sequence of the promise.
- pob_phrase: from under the burdens of Egypt
  simplified_phrase: from under the burdens Egypt forced on you
  preserved_meaning: Yahweh delivers Israel from Egypt’s oppressive burden while retaining the image of being under a load.
  reasoning_layer_used: Lexical decisions for מִתַּחַת and סִבְלֹת.
  rationale: The recast wording explains Egypt’s role while preserving the Hebrew burden image.
interpretive_expansions:
- pob_phrase: the burdens of Egypt
  rendering: the burdens Egypt forced on you
  claim: Egypt imposed the oppressive burdens on Israel.
  evidence:
