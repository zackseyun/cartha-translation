translation:
  language: en
  text: So tell the sons of Israel[a], ‘I am Yahweh. I will bring you out from under Egypt’s burdens and rescue you from their slavery. I will redeem you with an outstretched arm and with great acts of judgment.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites, the covenant people descended from Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore say to
  simplified_phrase: So tell
  preserved_meaning: God directs Moses to give Israel a message based on what he has just said.
  reasoning_layer_used: Lexical decision for לָכֵן and immediate context
  rationale: “So tell” expresses the same logical transition in ordinary English.
- pob_phrase: I will deliver you from their slavery
  simplified_phrase: I will rescue you from their slavery
  preserved_meaning: Yahweh will free Israel from Egypt’s oppressive servitude.
  reasoning_layer_used: Lexical and theological decisions for נצל and עֲבֹדָה
  rationale: “Rescue” is clearer than “deliver” while “slavery” keeps the severity of their condition.
- pob_phrase: with great judgments
  simplified_phrase: with great acts of judgment
  preserved_meaning: Yahweh will redeem Israel through powerful judicial actions against Egypt.
  reasoning_layer_used: Lexical decision for שְׁפָטִים גְּדֹלִים
  rationale: Adding “acts of” makes the phrase understandable as actions rather than opinions.
translation_notes:
  risk_flags:
