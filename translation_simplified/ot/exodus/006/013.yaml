translation:
  language: en
  text: Then Yahweh spoke to Moses and Aaron. He commanded them regarding the sons of Israel and Pharaoh, the king of Egypt:[a] they must bring the sons of Israel[b] out of the land of Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He gave them commands for the sons of Israel and for Pharaoh, the king of Egypt.” The Hebrew may identify them as recipients, though the context more likely means the command concerned them.
    reason: alternative_reading
  - marker: b
    text: “The sons of Israel” means the Israelites, the people descended from Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Yahweh spoke to Moses and to Aaron, and he commanded them
  simplified_phrase: Then Yahweh spoke to Moses and Aaron. He commanded them
  preserved_meaning: Yahweh next addressed both men and gave them an authoritative command.
  reasoning_layer_used: POB lexical decisions for the narrative sequence, divine name, addressees, and command verb
  rationale: Two sentences make the sequence easier to follow without weakening the command.
- pob_phrase: concerning the sons of Israel and concerning Pharaoh king of Egypt
  simplified_phrase: regarding the sons of Israel and Pharaoh, the king of Egypt
  preserved_meaning: The command given to Moses and Aaron concerned both Israel and Pharaoh.
  reasoning_layer_used: POB lexical rationale and alternative-reading footnote for אֶל
  rationale: “Regarding” is natural English while the footnote preserves the possible recipient reading.
- pob_phrase: to bring the sons of Israel out from the land of Egypt
  simplified_phrase: they must bring the sons of Israel out of the land of Egypt
  preserved_meaning: Moses and Aaron were commanded to bring Israel out from Egypt’s land.
  reasoning_layer_used: POB lexical decisions for וַיְצַוֵּם, לְהוֹצִיא, and מֵאֶרֶץ מִצְרָיִם
  rationale: Naming the implied subject and using “must” clarifies the command’s force.
