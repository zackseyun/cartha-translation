  reasoning_layer_used: POB lexical decisions for וַתֵּרֶד, לִרְחֹץ, and עַל הַיְאֹר
  rationale: Ordinary English places the destination before the purpose.
- pob_phrase: along the bank of the Nile
  simplified_phrase: along the riverbank
  preserved_meaning: The young women were walking beside the Nile.
  reasoning_layer_used: POB lexical decision for עַל יַד הַיְאֹר
  rationale: The Nile is already named, so “riverbank” avoids needless repetition.
- pob_phrase: in the midst of the reeds
