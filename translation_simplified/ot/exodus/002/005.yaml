translation:
  language: en
  text: Then Pharaoh’s daughter went down to the Nile to bathe. Her young women were walking along the riverbank. She saw the basket among the reeds, sent her female servant to get it, and then took the basket.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “basket” is also used for Noah’s “ark” in Genesis 6–9.
    reason: cross_reference
  - marker: b
    text: Hebrew “her female servant”; traditionally, some understand this as “her arm.”
    reason: alternative_reading
