translation:
  language: en
  text: But when she could no longer keep him hidden, she took a papyrus basket for him.[a] She coated it with bitumen and pitch to keep water out, put the child inside, and placed the basket among the reeds at the edge of the Nile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also be translated “ark.” It is the same word used for Noah’s ark, echoing deliverance through water.
    reason: lexical_alternative
