translation:
  language: en
  text: During that time, after Moses had grown up, he went out among his brothers.[a] He saw the burdens they were carrying. He also saw an Egyptian man striking a Hebrew man—one of his own brothers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” means Moses’ fellow Hebrews, described with family language.
    reason: lexical_alternative
