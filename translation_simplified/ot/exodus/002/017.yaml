translation:
  language: en
  text: Then some shepherds came and chased the women away. But Moses stepped in and rescued them. Then he gave water to their flock.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the shepherds came and drove them away
  simplified_phrase: some shepherds came and chased the women away
  preserved_meaning: The shepherds acted forcefully against the women at the watering place.
  reasoning_layer_used: The lexical decisions identify the actors as shepherds, the action as hostile expulsion, and the pronoun as referring to the women.
  rationale: Naming the women clarifies the pronoun, while “chased away” keeps the hostile force.
- pob_phrase: Moses stood up and saved them
  simplified_phrase: Moses stepped in and rescued them
  preserved_meaning: Moses took decisive action to deliver the women from the shepherds' harassment.
  reasoning_layer_used: The lexical rationale for קום stresses decisive response, and the Hifil of ישׁע requires rescue rather than mere help.
  rationale: “Stepped in” naturally expresses decisive intervention, and “rescued” preserves the strong sense of deliverance.
- pob_phrase: watered their flock
  simplified_phrase: gave water to their flock
  preserved_meaning: Moses provided water for the household's small livestock.
  reasoning_layer_used: The lexical decisions support “gave water to” for שקה and retain the collective “flock” for צאן.
  rationale: The fuller phrase is immediately clear to readers unfamiliar with “watered” as a livestock verb.
interpretive_expansions:
- pob_phrase: them
  rendering: the women
  claim: The people driven away and rescued were the women already present in the scene.
  evidence:
