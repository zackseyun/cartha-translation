translation:
  language: en
  text: But he said, “Who put you in charge of us as ruler and judge? Are you saying that you will kill me, just as you killed the Egyptian?”[a] Moses became afraid and said, “So people know what happened!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do you mean to kill me as you killed the Egyptian?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who made you a ruler and a judge over us?
  simplified_phrase: Who put you in charge of us as ruler and judge?
  preserved_meaning: The man challenges Moses’ authority to rule and judge them.
  reasoning_layer_used: Lexical decisions for שָׂמְךָ, שַׂר, וְשֹׁפֵט, and עָלֵינוּ
  rationale: “Put you in charge” expresses appointed authority in common English while retaining both roles.
- pob_phrase: Are you saying, ‘Will you kill me as you killed the Egyptian?’
  simplified_phrase: Are you saying that you will kill me, just as you killed the Egyptian?
  preserved_meaning: The man asks whether Moses is threatening to kill him as he killed the Egyptian.
  reasoning_layer_used: Lexical decision for הַלְהָרְגֵנִי אַתָּה אֹמֵר
  rationale: The direct question removes awkward nested quotation without changing the chosen verbal force.
- pob_phrase: Surely the matter has become known.
  simplified_phrase: So people know what happened!
  preserved_meaning: Moses realizes that his killing of the Egyptian has become known.
  reasoning_layer_used: Lexical decisions for אָכֵן and נוֹדַע הַדָּבָר with immediate context
  rationale: The plain wording makes Moses’ fearful realization immediately understandable.
interpretive_expansions:
- pob_phrase: the matter has become known
  rendering: people know what happened
  claim: The unspecified matter is the killing of the Egyptian, and it has become known to others.
  evidence:
  - The preceding question explicitly mentions Moses killing the Egyptian.
  - The Niphal form indicates that the matter has come to light.
  confidence: high
  alternatives_preserved:
  - the matter has become known
translation_notes:
  risk_flags:
  - risk: “What happened” is less explicit than naming the killing again.
    mitigation: The immediately preceding words identify the event as Moses killing the Egyptian.
