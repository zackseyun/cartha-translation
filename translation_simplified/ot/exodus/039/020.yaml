  reasoning_layer_used: Lexical decisions for מִלְמַטָּה and מִמּוּל פָּנָיו
  rationale: Combining the spatial phrases makes the location easier to picture.
- pob_phrase: opposite its joining
  simplified_phrase: aligned with the place where the ephod was joined
  preserved_meaning: The rings corresponded in position to the ephod’s uncertain joining point.
  reasoning_layer_used: POB translation and lexical decisions for לְעֻמַּת and מֶחְבַּרְתּוֹ
  rationale: This explains the alignment without specifying which garment parts were joined.
- pob_phrase: above the skillfully woven band of the ephod
