translation:
  language: en
  text: They made two gold rings and put them on the lower front of the ephod’s[a] two shoulder pieces. The rings were aligned with the place where the ephod was joined,[b] above its skillfully woven band.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ephod was a special garment worn by the high priest.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean its seam or attachment point.
    reason: lexical_alternative
