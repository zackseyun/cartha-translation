  text: They used blue, purple, and scarlet yarn to make finely woven garments[a] for service in the sanctuary. They also made the holy garments for Aaron, just as Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “garments for service.” The Hebrew expression may refer either to the garments’ purpose or to their fine workmanship.
