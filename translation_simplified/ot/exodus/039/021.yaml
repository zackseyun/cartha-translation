translation:
  language: en
  text: They used a cord of blue to fasten the rings of the breastpiece to the rings of the ephod.[a] This kept the breastpiece on the ephod’s skillfully woven band and prevented it from coming loose from its place on the ephod. They did this just as Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ephod was a special priestly garment to which the breastpiece was attached.
    reason: cultural_note
