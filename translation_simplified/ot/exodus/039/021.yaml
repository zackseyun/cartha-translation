- pob_phrase: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue
  simplified_phrase: They used a cord of blue to fasten the rings of the breastpiece to the rings of the ephod
  preserved_meaning: The blue cord secured the breastpiece’s rings to the ephod’s rings.
  reasoning_layer_used: Lexical decisions for וַיִּרְכְּסוּ and the two sets of rings
  rationale: The sentence now states the means and attachment in a more direct order.
- pob_phrase: so that it would be on the skillfully woven band of the ephod
  simplified_phrase: This kept the breastpiece on the ephod’s skillfully woven band
  preserved_meaning: The fastening held the breastpiece in position on the decorated woven band.
  reasoning_layer_used: Lexical decision for חֵשֶׁב הָאֵפֹד
  rationale: A separate sentence makes the purpose of the fastening easier to follow.
- pob_phrase: would not come loose from on the ephod
