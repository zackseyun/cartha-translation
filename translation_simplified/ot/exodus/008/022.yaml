translation:
  language: en
  text: But Moses answered, “That would not be right. What we would sacrifice to Yahweh our God is detestable to the Egyptians.[a] If we sacrifice it in plain sight of them, won’t they stone us?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the abomination of the Egyptians”; in context, this likely means what the Egyptians regarded as detestable.
