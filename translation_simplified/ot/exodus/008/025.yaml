translation:
  language: en
  text: Moses said, “I am leaving you. I will plead with Yahweh, and tomorrow the swarm[a] will leave Pharaoh, his servants, and his people. But Pharaoh must not continue his mockery by refusing to let the people go to sacrifice to Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer specifically to flies or other swarming creatures, but its exact meaning is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, I am going out from you
  simplified_phrase: I am leaving you
  preserved_meaning: Moses announces that he is departing from Pharaoh’s presence.
  reasoning_layer_used: Lexical decisions for הִנֵּה and יוֹצֵא מֵעִמָּךְ
  rationale: The announcement itself carries the attention forward, while “leaving” expresses the departure naturally without adding a time reference.
- pob_phrase: the swarm will depart from Pharaoh, from his servants, and from his people
  simplified_phrase: the swarm will leave Pharaoh, his servants, and his people
  preserved_meaning: The plague will withdraw from Pharaoh, his servants, and his people.
  reasoning_layer_used: Lexical decisions for וְסָר and the repeated מִן phrases
  rationale: “Leave” is clearer than “depart,” and the full scope remains explicit.
- pob_phrase: let Pharaoh not continue to mock by not letting the people go
  simplified_phrase: Pharaoh must not continue his mockery by refusing to let the people go
  preserved_meaning: Moses warns Pharaoh not to repeat his contemptuous deception by refusing release again.
  reasoning_layer_used: Lexical decisions for אַל יֹסֵף ... הָתֵל and לְבִלְתִּי שַׁלַּח
  rationale: The direct warning and Pharaoh’s repeated refusal are clearer in natural modern syntax.
translation_notes:
  risk_flags:
