translation:
  language: en
  text: Then Yahweh told Moses, “Tell Aaron, ‘Stretch out your hand, holding your staff, over the rivers, canals,[a] and pools. Bring the frogs up over the land of Egypt.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Nile channels.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Yahweh said to Moses, “Say to Aaron
  simplified_phrase: Then Yahweh told Moses, “Tell Aaron
  preserved_meaning: Yahweh commands Moses to relay an instruction to Aaron.
  reasoning_layer_used: Lexical decisions for וַיֹּאמֶר and אֱמֹר
  rationale: “Told” and “tell” make the two-stage command natural in modern English.
- pob_phrase: Stretch out your hand with your staff
  simplified_phrase: Stretch out your hand, holding your staff
  preserved_meaning: Aaron must extend his hand while using the staff.
  reasoning_layer_used: Lexical decisions for נְטֵה, יָדְךָ, and בְּמַטֶּךָ
  rationale: “Holding your staff” clearly shows how the hand and staff belong to the same gesture.
- pob_phrase: over the rivers, over the canals, and over the pools
  simplified_phrase: over the rivers, canals, and pools
  preserved_meaning: The command covers three distinct kinds of Egyptian waterways.
  reasoning_layer_used: Lexical decisions for הַנְּהָרֹת, הַיְאֹרִים, and הָאֲגַמִּים
  rationale: Removing repeated “over” improves flow without merging the three water terms.
translation_notes:
  risk_flags:
