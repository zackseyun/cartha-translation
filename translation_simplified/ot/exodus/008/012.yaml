translation:
  language: en
  text: Then Yahweh said to Moses, “Tell Aaron, ‘Stretch out your staff and strike the dust on the ground. The dust will turn into gnats[a] everywhere in Egypt.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “lice.” The Hebrew word refers to small biting or irritating insects, but the exact kind is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Say to Aaron
  simplified_phrase: Tell Aaron
  preserved_meaning: Moses must give Aaron Yahweh’s command.
  reasoning_layer_used: Lexical decision for אֱמֹר and immediate speech context
  rationale: “Tell Aaron” makes the command to relay the message more direct in modern English.
- pob_phrase: the dust of the earth
  simplified_phrase: the dust on the ground
  preserved_meaning: Aaron must strike the fine earth or dust itself.
  reasoning_layer_used: Lexical decision for עֲפַר הָאָרֶץ
  rationale: This keeps the concrete dust image while avoiding an elevated expression.
- pob_phrase: and it will become gnats throughout all the land of Egypt
  simplified_phrase: The dust will turn into gnats everywhere in Egypt
  preserved_meaning: The dust is transformed into tiny pests across the whole country.
  reasoning_layer_used: Lexical decisions for וְהָיָה, לְכִנִּם, and בְּכָל אֶרֶץ מִצְרַיִם
  rationale: Naming the dust removes an unclear pronoun, and “everywhere” states the plague’s full extent plainly.
translation_notes:
  risk_flags:
  - risk: “Gnats” may suggest more certainty about the insect species than the Hebrew allows.
    mitigation: The footnote preserves “lice” and states that the exact kind is uncertain.
