translation:
  language: en
  text: But on that day I will set the land of Goshen apart. My people live there, and no swarm[a] will be there. I will do this so that you will know that I am Yahweh in the midst of this land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean swarms or a swarm of insects; the exact kind is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “in the midst of the earth,” though the context most likely refers to Egypt.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the land of Goshen, where my people dwell
  simplified_phrase: the land of Goshen apart. My people live there
  preserved_meaning: Goshen is the region where God's people reside and which he will treat differently.
  reasoning_layer_used: lexical decision for אֶרֶץ גֹּשֶׁן and עַמִּי עֹמֵד עָלֶיהָ
  rationale: The sentence is divided, and “dwell” becomes the more familiar “live.”
- pob_phrase: in order that you may know
  simplified_phrase: I will do this so that you will know
  preserved_meaning: God's distinction between Goshen and Egypt has the stated purpose of making Pharaoh recognize Yahweh.
  reasoning_layer_used: lexical decision for לְמַעַן תֵּדַע
  rationale: A direct purpose clause replaces the formal phrase while retaining its force.
- pob_phrase: in the midst of the land
  simplified_phrase: in the midst of this land
  preserved_meaning: Yahweh is present and active within the land in which these events occur.
  reasoning_layer_used: lexical and theological decisions for בְּקֶרֶב הָאָרֶץ
  rationale: “This” makes the contextual land easier to identify without erasing the Hebrew spatial image.
