translation:
  language: en
  text: For if you do not let my people go, I am about to send the swarm[a] upon you, your servants, and your people, and into your houses. The swarm will fill the houses throughout Egypt and cover the ground[b] where the Egyptians are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word probably refers to a swarm, traditionally understood as flies.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can mean “ground” or “land.”
    reason: lexical_alternative
