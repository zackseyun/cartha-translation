- pob_phrase: behold, I am sending
  simplified_phrase: I am about to send
  preserved_meaning: The warning announces an action that is both imminent and certain.
  reasoning_layer_used: POB lexical decision for הִנְנִי מַשְׁלִיחַ
  rationale: The new wording preserves the solemn urgency without the less familiar “behold.”
- pob_phrase: The houses of Egypt will be filled with the swarm
  simplified_phrase: The swarm will fill the houses throughout Egypt
  preserved_meaning: The swarm will invade Egyptian homes extensively.
  reasoning_layer_used: POB lexical decision for וּמָלְאוּ בָּתֵּי מִצְרַיִם
  rationale: An active sentence makes the result easier to picture while retaining its scope.
- pob_phrase: and also the ground on which they are
  simplified_phrase: and cover the ground where the Egyptians are
  preserved_meaning: The swarm will spread over the physical ground occupied by the Egyptians.
  reasoning_layer_used: POB lexical decisions for וְגַם הָאֲדָמָה and אֲשֶׁר הֵם עָלֶיהָ
  rationale: “Cover” expresses how a swarm affects the ground more naturally than the compressed Hebrew clause.
