  text: Moses said to Pharaoh, “You may have the honor of choosing the time.[a] When should I plead for you, for your servants, and for your people, so that the frogs are cut off from you and your houses? They will remain only in the Nile.”
  philosophy: optimal-equivalence
  footnotes:
