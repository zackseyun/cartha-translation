translation:
  language: en
  text: Then Pharaoh sent for Moses and Aaron. He said, “Plead with Yahweh to take the frogs away from me and my people. I will let the people go so they can offer sacrifices to Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will let the people go, and they may offer sacrifices to Yahweh.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: called for Moses and Aaron and said
  simplified_phrase: sent for Moses and Aaron. He said
  preserved_meaning: Pharaoh summoned Moses and Aaron and then addressed them.
  reasoning_layer_used: lexical decision for וַיִּקְרָא and target-style sentence division
  rationale: “Sent for” is common English, and two sentences make the action easier to follow.
- pob_phrase: Pray to Yahweh, that he may remove the frogs
  simplified_phrase: Plead with Yahweh to take the frogs away
  preserved_meaning: Pharaoh urgently asks them to seek Yahweh’s removal of the frogs.
  reasoning_layer_used: lexical decisions for הַעְתִּירוּ and וְיָסֵר
  rationale: “Plead” preserves the urgent force, while “take away” is more natural than “remove” here.
- pob_phrase: so that they may sacrifice to Yahweh
  simplified_phrase: so they can offer sacrifices to Yahweh
  preserved_meaning: Pharaoh promises release for the purpose of Israel’s sacrificial worship.
  reasoning_layer_used: theological decision on the purpose/result clause
  rationale: The wording states the likely purpose relationship in ordinary English without changing the sacrificial meaning.
