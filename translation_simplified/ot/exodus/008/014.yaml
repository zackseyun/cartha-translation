simplification_decisions:
- pob_phrase: did the same by their secret arts to bring out the gnats
  simplified_phrase: also tried to produce gnats by their secret arts
  preserved_meaning: The magicians attempted to reproduce the plague through hidden magical practices.
  reasoning_layer_used: POB lexical decisions for הַחַרְטֻמִּים, בְּלָטֵיהֶם, and לְהוֹצִיא
  rationale: This makes the unsuccessful attempt clear while preserving the means they used.
- pob_phrase: but they were not able
  simplified_phrase: but they could not
  preserved_meaning: The magicians lacked the ability to produce the insects.
  reasoning_layer_used: POB lexical decision for וְלֹא יָכֹלוּ
  rationale: The shorter wording expresses the same inability in natural English.
- pob_phrase: the gnats were on man and on beast
  simplified_phrase: The gnats were on people and animals
  preserved_meaning: The insects were on humanity and animals as collective groups.
  reasoning_layer_used: POB lexical and theological decisions for בָּאָדָם and וּבַבְּהֵמָה
  rationale: Common collective nouns avoid suggesting one male person and one animal.
