simplification_decisions:
- pob_phrase: Rise early in the morning and station yourself before Pharaoh
  simplified_phrase: Get up early in the morning and stand before Pharaoh
  preserved_meaning: Moses must go early and take his place in Pharaoh’s presence.
  reasoning_layer_used: POB translation and source payload
  rationale: Common verbs replace formal wording without weakening either command.
- pob_phrase: Look, he is going out to the water
  simplified_phrase: He will be going out to the water
  preserved_meaning: The LORD directs Moses to meet Pharaoh when he goes to the water.
  reasoning_layer_used: POB translation and source payload
  rationale: The statement naturally alerts Moses to Pharaoh’s expected movement without adding a separate command.
- pob_phrase: Thus says the LORD
  simplified_phrase: This is what the LORD says
  preserved_meaning: Moses delivers the LORD’s authoritative message.
  reasoning_layer_used: POB translation
  rationale: The formal messenger formula is expressed in direct modern English.
