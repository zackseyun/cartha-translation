simplification_decisions:
- pob_phrase: You shall make on its hem
  simplified_phrase: Make ... all around the hem of the robe
  preserved_meaning: The command concerns decorations made around the robe’s lower edge.
  reasoning_layer_used: Lexical decisions for וְעָשִׂיתָ and שׁוּלָיו, with the immediate garment context
  rationale: A direct command and an explicit reference to the robe make the instruction easier to follow.
- pob_phrase: with bells of gold between them all around
  simplified_phrase: with gold bells between them all around
  preserved_meaning: The same command requires making gold bells between the pomegranates around the whole hem.
  reasoning_layer_used: Lexical decisions for וּפַעֲמֹנֵי זָהָב, בְּתוֹכָם, and סָבִיב
  rationale: Keeping the bells under the single command preserves both their manufacture and their placement.
translation_notes:
  risk_flags:
