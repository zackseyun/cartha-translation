translation:
  language: en
  text: Aaron and his sons must wear these garments when they enter the tent of meeting or approach the altar to serve in the holy place. Otherwise, they will incur guilt and die. This requirement will remain in force for Aaron and his descendants after him.
  philosophy: optimal-equivalence
