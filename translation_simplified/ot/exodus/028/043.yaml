  simplified_phrase: Aaron and his sons must wear these garments
  preserved_meaning: The prescribed garments are mandatory for Aaron and his sons during sacred service.
  reasoning_layer_used: POB lexical decisions for וְהָיוּ and עַל
  rationale: Active wording identifies the garments and clearly states that the priests must wear them.
- pob_phrase: so that they may not bear guilt and die
  simplified_phrase: Otherwise, they will incur guilt and die
  preserved_meaning: Failure to wear the garments exposes the priests to real guilt and death.
  reasoning_layer_used: POB lexical and theological decisions for וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ
  rationale: “Incur guilt” explains legal liability without weakening the death penalty.
- pob_phrase: It shall be a permanent statute for him and for his offspring after him
  simplified_phrase: This requirement will remain in force for Aaron and his descendants after him
  preserved_meaning: The binding rule continues from Aaron to later generations of his family.
  reasoning_layer_used: POB lexical decisions for חֻקַּת עוֹלָם and זַרְעוֹ
  rationale: Common legal wording preserves both the rule’s permanence and its generational scope.
