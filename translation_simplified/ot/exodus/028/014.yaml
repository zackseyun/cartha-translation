simplification_decisions:
- pob_phrase: And make two chains of pure gold
  simplified_phrase: Make two pure gold chains
  preserved_meaning: Moses is instructed to make two chains from pure gold.
  reasoning_layer_used: POB lexical decisions for שְׁתֵּי, שַׁרְשְׁרֹת, זָהָב טָהוֹר, and תַּעֲשֶׂה אֹתָם
  rationale: The shorter word order clearly preserves the command, number, object, and material.
- pob_phrase: braided like cords
  simplified_phrase: braided like cords
  preserved_meaning: The gold chains must have braided, cord-like workmanship.
  reasoning_layer_used: POB lexical decisions for מִגְבָּלֹת and מַעֲשֵׂה עֲבֹת
  rationale: This keeps the cord image and avoids implying merely visual imitation.
- pob_phrase: put the braided chains on the settings
  simplified_phrase: Attach the braided chains to the settings
  preserved_meaning: The chains are to be fastened to the garment's gold mountings.
  reasoning_layer_used: POB lexical decision for עַל הַמִּשְׁבְּצֹת and its contextual rationale
  rationale: “Attach” expresses the practical action naturally in the garment context.
