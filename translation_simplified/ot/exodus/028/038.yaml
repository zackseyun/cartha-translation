translation:
  language: en
  text: It must be on Aaron’s forehead. Aaron will bear the guilt connected with all the holy gifts that the Israelites set apart for God.[a] It must always be on his forehead, so that they may be accepted before Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew idiom may also be translated “bear responsibility for the guilt”; the verse does not say here exactly how that guilt is dealt with.
    reason: lexical_alternative
  - marker: b
    text: Or “to bring them favor”; the people’s acceptance is connected with their gifts, though the wording may also focus on the gifts.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: It shall be on Aaron’s forehead
  simplified_phrase: It must be on Aaron’s forehead
  preserved_meaning: The sacred object is required to remain in its specified position on Aaron’s forehead.
  reasoning_layer_used: POB lexical decision on מֵצַח and immediate context
  rationale: “Must be on” states the required placement plainly without suggesting a restful posture.
- pob_phrase: bear the iniquity of the holy things ... for all the gifts of their holy things
  simplified_phrase: bear the guilt connected with all the holy gifts
  preserved_meaning: Aaron bears guilt or liability associated with the full range of Israel’s sacred offerings.
  reasoning_layer_used: POB lexical and theological decisions on נָשָׂא עֲוֺן and לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  rationale: The plural wording preserves the scope and gift-language while clarifying the difficult Hebrew relationship.
- pob_phrase: the sons of Israel consecrate
  simplified_phrase: the Israelites set apart for God
  preserved_meaning: The people of Israel dedicate these gifts as holy to God.
  reasoning_layer_used: POB lexical decisions on בְּנֵי יִשְׂרָאֵל and יַקְדִּישׁוּ
  rationale: This expresses the corporate referent and explains consecration in common English.
interpretive_expansions:
- pob_phrase: the iniquity of the holy things
  rendering: the guilt connected with all the holy gifts
  claim: The guilt is associated with the sacred offerings rather than wrongdoing committed by objects.
  evidence:
  - The POB lexical rationale identifies guilt or liability associated with holy offerings.
  - The POB theological decision connects the phrase with defects or impurity involving the offerings.
  confidence: high
  alternatives_preserved:
  - Aaron directly removes the guilt.
  - Aaron symbolically carries the memory of Israel’s sins.
translation_notes:
  risk_flags:
  - risk: “All the holy gifts” smooths a syntactically difficult Hebrew relationship between gifts and holy things.
    mitigation: The wording retains the plural gift-language, sacred category, and full scope.
  - risk: “They” may seem to refer only to the people.
    mitigation: Footnote b preserves the connection between the people’s acceptance and their gifts.
