  preserved_meaning: The names are to be inscribed into both stones.
  reasoning_layer_used: Lexical decision for תְּפַתַּח and immediate inscription context
  rationale: Ordinary English places the names before the surface on which they are engraved.
- pob_phrase: you shall make them enclosed in settings of gold
  simplified_phrase: Then mount the stones in gold settings
