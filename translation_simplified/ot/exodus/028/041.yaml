translation:
  language: en
  text: Dress your brother Aaron and his sons. Anoint them, ordain them[a], and set them apart as holy. They will serve me as priests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “fill their hands,” an idiom for formally installing them as priests.
