simplification_decisions:
- pob_phrase: You shall clothe Aaron your brother and his sons with him
  simplified_phrase: Dress your brother Aaron and his sons.
  preserved_meaning: Moses is to put the priestly clothing on Aaron and his sons.
  reasoning_layer_used: The lexical decision identifies the verb as causing them to be clothed in the garments described in context.
  rationale: “Dress” states the action naturally, and a separate sentence removes the dense clause structure.
- pob_phrase: and you shall anoint them and ordain them and consecrate them
  simplified_phrase: Anoint them, ordain them, and set them apart as holy.
  preserved_meaning: All three distinct acts of priestly installation remain present.
  reasoning_layer_used: The lexical and theological decisions preserve anointing, formal ordination, and holy consecration as separate ideas.
  rationale: The command form is clearer, while “set them apart as holy” explains the less familiar word “consecrate.”
- pob_phrase: and they shall serve as priests to me
  simplified_phrase: They will serve me as priests.
  preserved_meaning: Their appointed role is priestly service rendered to God.
  reasoning_layer_used: The lexical decision treats the verb as functioning or serving as a priest and preserves the relation to God.
  rationale: A new sentence makes the result of the installation easy to follow.
interpretive_expansions:
- pob_phrase: consecrate them
