translation:
  language: en
  text: 'They must make the following garments: a breastpiece, an ephod,[a] a robe, a tunic woven with a pattern, a turban, and a sash. They must make these holy garments for your brother Aaron and his sons, so that Aaron may serve me as priest.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was a distinctive priestly garment with no exact English equivalent.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And these are the garments that they shall make
  simplified_phrase: They must make the following garments
  preserved_meaning: The sentence remains a divine instruction introducing the required priestly clothing.
  reasoning_layer_used: Lexical decision for יַעֲשׂוּ and immediate command context
  rationale: “Must make” expresses the directive naturally without the formal “shall.”
- pob_phrase: a checkered tunic
  simplified_phrase: a tunic woven with a pattern
  preserved_meaning: The tunic is made with worked or patterned weaving without claiming a certain checker design.
  reasoning_layer_used: Lexical decision for כְתֹנֶת תַּשְׁבֵּץ
  rationale: The description makes the textile feature clear while preserving uncertainty about the exact pattern.
- pob_phrase: for him to serve as priest to me
