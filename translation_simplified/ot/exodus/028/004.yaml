  preserved_meaning: Aaron’s priestly service to God remains the purpose of the holy garments.
  reasoning_layer_used: Lexical decisions for לְכַהֲנוֹ and לִי
  rationale: Naming Aaron removes an unclear pronoun and recasts the purpose clause in ordinary English.
