translation:
  language: en
  text: The skillfully woven band on his ephod[a] must be made with the same workmanship and as part of the ephod itself. It must be made of gold, blue, purple, and scarlet yarn, and fine twisted linen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was a special priestly garment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the skillfully woven band of his ephod, which is on it
  simplified_phrase: the skillfully woven band on his ephod
  preserved_meaning: The woven band is located on the ephod.
  reasoning_layer_used: The lexical decision identifies the ephod as the most natural antecedent of “on it.”
  rationale: The shorter wording removes a confusing relative clause without implying that the band was separately attached.
- pob_phrase: shall be like its workmanship, of one piece with it
  simplified_phrase: must be made with the same workmanship and as part of the ephod itself
  preserved_meaning: The band must match the ephod’s workmanship and be made integrally with it.
  reasoning_layer_used: The lexical decisions for כְּמַעֲשֵׂהוּ and מִמֶּנּוּ יִהְיֶה preserve both matching workmanship and integral construction.
  rationale: The two requirements are stated directly so readers do not miss either one.
- pob_phrase: gold, blue, and purple, and scarlet yarn, and fine twisted linen
  simplified_phrase: gold, blue, purple, and scarlet yarn, and fine twisted linen
  preserved_meaning: The band uses the listed precious and dyed textile materials.
  reasoning_layer_used: The lexical decisions retain every material and preserve “fine twisted linen.”
  rationale: The list is lightly regularized for natural English while keeping all its elements.
translation_notes:
