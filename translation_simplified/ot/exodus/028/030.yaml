translation:
  language: en
  text: Put the Urim and Thummim[a] into the breastpiece of judgment.[b] They will be on Aaron’s heart when he goes in before Yahweh. Aaron will continually carry on his heart the judgment concerning the sons of Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Urim and Thummim were sacred objects used in priestly judgment, but their exact form and operation are unknown.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “the breastpiece for decision” or “the breastpiece of justice.”
    reason: alternative_reading
  - marker: c
    text: “The sons of Israel” is the Hebrew covenant name for the people of Israel.
    reason: lexical_alternative
