translation:
  language: en
  text: Aaron must wear the robe when he serves. The sound of its bells must be heard when he enters the Holy Place before Yahweh and when he comes out, so that he may not die.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: It shall be on Aaron when he ministers
  simplified_phrase: Aaron must wear the robe when he serves
  preserved_meaning: Aaron is required to wear the robe while carrying out his priestly service.
  reasoning_layer_used: Lexical decisions for וְהָיָה, עַל אַהֲרֹן, and לְשָׁרֵת
  rationale: The active wording states the clothing requirement in direct, natural English.
- pob_phrase: and its sound shall be heard
  simplified_phrase: The sound of its bells must be heard
  preserved_meaning: The bells attached to the robe are to ring audibly.
  reasoning_layer_used: Immediate context in verses 33–34 and the theological decision on the sound's referent
  rationale: Naming the bells removes an unclear pronoun while preserving the intended sound.
- pob_phrase: when he goes into the Holy Place before Yahweh and when he comes out
  simplified_phrase: when he enters the Holy Place before Yahweh and when he comes out
  preserved_meaning: The bells are heard both as Aaron enters Yahweh's sacred presence and as he exits.
  reasoning_layer_used: Lexical decisions for בְּבֹאוֹ, אֶל הַקֹּדֶשׁ, לִפְנֵי יְהוָה, and וּבְצֵאתוֹ
  rationale: “Enters” expresses the movement more directly while retaining the designated sacred place and divine name.
interpretive_expansions:
- pob_phrase: its sound
  rendering: The sound of its bells
  claim: The audible sound comes from the bells on Aaron's robe.
  evidence:
  - Verses 33–34 immediately describe bells attached to the robe's hem.
  - The POB lexical and theological decisions identify the robe's bells as the suffix's most natural referent.
  confidence: high
