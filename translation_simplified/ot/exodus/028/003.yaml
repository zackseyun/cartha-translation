- pob_phrase: you shall speak to all the wise of heart
  simplified_phrase: Speak to all those with wise and skillful hearts
  preserved_meaning: God directs Moses to address people whose inner understanding includes practical skill.
  reasoning_layer_used: POB lexical decision and lexical footnote on חַכְמֵי לֵב
  rationale: The direct command is natural English, while “hearts” preserves the Hebrew image.
- pob_phrase: and they shall make Aaron’s garments
  simplified_phrase: They must make Aaron’s garments
  preserved_meaning: The garment makers receive a directive rather than a prediction.
  reasoning_layer_used: POB lexical decision on וְעָשׂוּ
  rationale: “Must” clearly conveys the directive force in common English.
- pob_phrase: to consecrate him, for him to serve me as priest
  simplified_phrase: to consecrate him so that he may serve me as priest
  preserved_meaning: Aaron is consecrated for the purpose of serving God as priest.
  reasoning_layer_used: POB lexical decisions and applied revision on the consecutive purpose clauses
  rationale: “So that” makes the purpose relationship clear without merging consecration and priestly service.
