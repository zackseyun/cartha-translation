translation:
  language: en
  text: Speak to all those with wise and skillful hearts—those whom I have filled with a spirit of wisdom. They must make Aaron’s garments to consecrate him so that he may serve me as priest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Spirit of wisdom.” The Hebrew does not specify whether this means the Spirit or a God-given disposition of wisdom.
    reason: alternative_reading
