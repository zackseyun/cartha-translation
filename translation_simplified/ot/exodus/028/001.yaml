translation:
  language: en
  text: Now bring your brother Aaron near to you, together with his sons, from among the sons of Israel.[a] They are to serve as priests for me. Aaron’s sons are Nadab, Abihu, Eleazar, and Ithamar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” means the Israelites, the people of Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you, bring near to yourself
  simplified_phrase: Now bring ... near to you
  preserved_meaning: God directly commands Moses to bring Aaron into his presence.
  reasoning_layer_used: Lexical decisions for וְאַתָּה, הַקְרֵב, and אֵלֶיךָ
  rationale: The wording keeps the emphatic transition and concrete image while using natural command syntax.
- pob_phrase: and his sons with him
  simplified_phrase: together with his sons
  preserved_meaning: Aaron and his sons are summoned as one group.
  reasoning_layer_used: Lexical decision for בָּנָיו אִתּוֹ
  rationale: “Together with” clearly preserves the Hebrew accompaniment marker.
- pob_phrase: 'to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons'
  simplified_phrase: They are to serve as priests for me. Aaron’s sons are Nadab, Abihu, Eleazar, and Ithamar.
  preserved_meaning: Aaron and his four named sons are appointed to priestly service for God.
  reasoning_layer_used: Lexical decisions for לְכַהֲנוֹ לִי and בְּנֵי אַהֲרֹן
  rationale: Two short sentences clarify both the purpose and the identity of Aaron’s sons.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “sons of Israel” as referring only to Israel’s immediate sons.
    mitigation: The footnote explains that it is the covenant designation for the Israelites.
  - risk: “Bring near” may sound merely physical rather than connected with priestly consecration.
    mitigation: The following sentence states the priestly purpose without equating the command with the entire ordination process.
