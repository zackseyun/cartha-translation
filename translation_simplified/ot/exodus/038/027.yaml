translation:
  language: en
  text: The silver weighed one hundred talents.[a] It was used to cast the bases for the sanctuary and for the veil.[b] There were one hundred bases in all, with one talent of silver used for each base.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was a large ancient unit of weight.
    reason: cultural_note
  - marker: b
    text: The veil was the inner curtain separating the holy place from the most holy place.
    reason: cultural_note
