translation:
  language: en
  text: These are the official records of the tabernacle[a]—the tabernacle of the testimony.[b] At Moses’ command, the Levites prepared these records under the direction of Ithamar, son of Aaron the priest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The tabernacle was Israel’s portable sanctuary.
    reason: cultural_note
  - marker: b
    text: “The testimony” likely refers especially to the covenant tablets kept in the ark.
    reason: cultural_note
simplification_decisions:
- pob_phrase: These are the records of the tabernacle
  simplified_phrase: These are the official records of the tabernacle
  preserved_meaning: The records are an organized accounting of the tabernacle materials.
  reasoning_layer_used: POB lexical decision for פְקוּדֵי and footnote a
  rationale: “Official” conveys the administrative reckoning behind the Hebrew term.
- pob_phrase: as they were recorded at the command of Moses, by the service of the Levites
  simplified_phrase: At Moses’ command, the Levites prepared these records
  preserved_meaning: Moses authorized the accounting, and the Levites carried it out.
  reasoning_layer_used: POB lexical decisions for פֻּקַּד, עַל פִּי מֹשֶׁה, and עֲבֹדַת הַלְוִיִּם
  rationale: The active sentence makes the authority and agency easier to follow.
- pob_phrase: under the direction of Ithamar son of Aaron the priest
  simplified_phrase: under the direction of Ithamar, son of Aaron the priest
  preserved_meaning: Ithamar supervised the Levites’ work and is identified by his priestly family.
  reasoning_layer_used: POB lexical decision for בְּיַד אִיתָמָר
  rationale: The clear supervisory wording is retained while punctuation improves readability.
interpretive_expansions:
