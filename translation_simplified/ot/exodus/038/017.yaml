translation:
  language: en
  text: The pillars stood on bronze bases. Their hooks and bands[a] were silver, and their tops were covered with silver. Every pillar around the courtyard was fitted with silver bands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact form of these silver fittings is uncertain; older translations call them “fillets.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: The bases for the pillars were bronze
  simplified_phrase: The pillars stood on bronze bases
  preserved_meaning: Bronze bases supported the courtyard pillars.
  reasoning_layer_used: The lexical decision identifies אֲדָנִים as supporting bases or sockets.
  rationale: The active wording makes the structural relationship immediately clear.
- pob_phrase: the overlay of their tops was silver
  simplified_phrase: their tops were covered with silver
  preserved_meaning: A layer of silver covered the upper parts of the pillars.
  reasoning_layer_used: The lexical decisions define צִפּוּי as a metal covering and רָאשֵׁיהֶם as the pillar tops.
  rationale: The concrete verb “covered” is clearer than the architectural noun “overlay.”
- pob_phrase: all the pillars of the courtyard were banded with silver
  simplified_phrase: Every pillar around the courtyard was fitted with silver bands
  preserved_meaning: Silver band-like fittings were attached to every courtyard pillar.
  reasoning_layer_used: The lexical rationale preserves the connection between חֲשׁוּקֵיהֶם and מְחֻשָּׁקִים without specifying the exact feature.
  rationale: “Fitted with silver bands” explains the uncommon expression “banded with silver.”
translation_notes:
  risk_flags:
  - risk: “Bands” may suggest a more precisely known shape than the Hebrew supports.
    mitigation: The footnote states that the exact form of the silver fittings is uncertain.
