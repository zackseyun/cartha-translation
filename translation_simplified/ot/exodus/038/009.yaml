  reasoning_layer_used: POB lexical decision for נֶגֶב תֵּימָנָה
  rationale: The direct location phrase preserves the directional fullness without suggesting that the side itself has an orientation.
- pob_phrase: the hangings of the courtyard
  simplified_phrase: curtains
  preserved_meaning: The fabric panels forming the courtyard boundary remain in view.
  reasoning_layer_used: POB lexical alternative for קַלְעֵי הֶחָצֵר
  rationale: “Curtains” is a familiar POB-approved alternative.
- pob_phrase: a hundred cubits long
  simplified_phrase: They stretched about 150 feet (46 meters)
  preserved_meaning: The curtains’ approximate total length is retained in familiar units.
  reasoning_layer_used: POB measurement decision for מֵאָה בָּאַמָּה
  rationale: Modern units make the ancient measurement immediately understandable.
