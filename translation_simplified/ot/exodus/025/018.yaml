  preserved_meaning: The cherubim must be formed by hammering the gold.
  reasoning_layer_used: POB lexical decision for מִקְשָׁה and retained verbal repetition
  rationale: The concrete action explains the metalworking phrase while preserving the repeated command.
- pob_phrase: the mercy seat
