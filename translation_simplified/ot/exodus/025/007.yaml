  preserved_meaning: The stones were intended to be mounted in the priestly items.
  reasoning_layer_used: POB lexical decision for אַבְנֵי מִלֻּאִים
  rationale: The direct wording is easier to understand while leaving the exact mounting process unspecified.
- pob_phrase: for the ephod and for the breastpiece
  simplified_phrase: in the ephod and breastpiece
  preserved_meaning: The stones were intended for settings in both priestly items.
  reasoning_layer_used: POB lexical decisions for לָאֵפֹד and וְלַחֹשֶׁן
  rationale: “In” clearly expresses where the stones would be set while retaining both distinct items.
