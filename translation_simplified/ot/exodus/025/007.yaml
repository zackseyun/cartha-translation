translation:
  language: en
  text: onyx stones[a], and stones to be set in the ephod and breastpiece[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of precious stone is uncertain; “onyx” is the traditional name.
    reason: lexical_alternative
  - marker: b
    text: The ephod was a special priestly garment, and the breastpiece was worn on the chest. These stones were to be mounted in them.
