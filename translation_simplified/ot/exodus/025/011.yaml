translation:
  language: en
  text: Cover it inside and outside with pure gold, and make a decorative gold border all around it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it
  simplified_phrase: Cover it inside and outside with pure gold
  preserved_meaning: The object must receive a layer of pure gold on both its interior and exterior surfaces.
  reasoning_layer_used: POB lexical decisions for צפה, זָהָב טָהוֹר, מִבַּיִת, and וּמִחוּץ
  rationale: The shorter wording removes repetition while keeping the metal-layer sense and both surfaces.
- pob_phrase: a gold molding
  simplified_phrase: a decorative gold border
  preserved_meaning: The gold feature is a crafted ornamental edging, not a royal headpiece.
  reasoning_layer_used: POB lexical decision and footnote for זֵר
  rationale: “Decorative gold border” is easier to picture than “molding” and retains the ornamental edging.
- pob_phrase: and you shall make on it ... all around
  simplified_phrase: and make ... all around it
  preserved_meaning: The border is attached to the object and encircles it on every side.
  reasoning_layer_used: POB lexical decisions for וְעָשִׂיתָ עָלָיו and סָבִיב
  rationale: Natural word order preserves both placement on the object and complete encirclement.
translation_notes:
  risk_flags:
  - risk: “Cover” could be read as hiding the object rather than plating it with metal.
    mitigation: The phrase “with pure gold” and the construction context make the metal-layer meaning clear.
