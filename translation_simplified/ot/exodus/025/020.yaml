translation:
  language: en
  text: The cherubim must have their wings spread upward, overshadowing the mercy seat[a] with their wings. They must face each other, with their faces turned toward the mercy seat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “atonement cover.” The mercy seat was the gold cover of the ark.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall spread out their wings upward
  simplified_phrase: must have their wings spread upward
  preserved_meaning: The cherubim are to be shown with wings extended in an upward direction.
  reasoning_layer_used: Lexical decisions for וְהָיוּ, פֹּרְשֵׂי כְנָפַיִם, and לְמַעְלָה
  rationale: “Must have” clearly expresses the required posture in these construction instructions.
- pob_phrase: their faces shall be one toward another
  simplified_phrase: They must face each other
  preserved_meaning: Each cherub is oriented toward the other.
  reasoning_layer_used: Lexical decision for וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  rationale: The common reciprocal phrase preserves the distributive meaning without the difficult idiom.
- pob_phrase: the faces of the cherubim shall be toward the mercy seat
  simplified_phrase: with their faces turned toward the mercy seat
  preserved_meaning: The cherubim’s faces are also directed toward the ark’s cover.
  reasoning_layer_used: Lexical decision for אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  rationale: The recast clause retains the concrete image while avoiding repeated formal syntax.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake the “mercy seat” for a chair.
    mitigation: The footnote identifies it as the ark’s gold cover and preserves “atonement cover” as an alternative.
