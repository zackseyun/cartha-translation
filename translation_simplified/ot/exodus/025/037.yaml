translation:
  language: en
  text: Make seven lamps for the lampstand. He[a] shall set them in place[b] so that they shine in front of it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “He” probably refers to the priest who takes care of the lampstand, though this verse does not name him.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “light them”; the verb can refer to raising, placing, or lighting the lamps.
    reason: lexical_alternative
