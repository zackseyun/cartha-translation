- pob_phrase: about all that I will command you for the sons of Israel
  simplified_phrase: about everything I command you for the sons of Israel
  preserved_meaning: Moses will receive all the commands directed to Israel.
  reasoning_layer_used: Latest revision and lexical decisions for כָּל and אֶל בְּנֵי יִשְׂרָאֵל
  rationale: “Everything” is common English and retains the comprehensive force of “all.”
