translation:
  language: en
  text: At the entrance to the courtyard, there must be a screen about 30 feet (9 meters) long.[a] It must be made of blue, purple, and scarlet yarn and finely twisted linen, with embroidered work. It must be supported by its four pillars and their four bases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “twenty cubits.”
    reason: source_note
simplification_decisions:
- pob_phrase: And for the gate of the courtyard there shall be
  simplified_phrase: At the entrance to the courtyard, there must be
  preserved_meaning: The screen is required at the courtyard gateway.
  reasoning_layer_used: The lexical decisions permit “entrance” for the gate and retain the courtyard setting.
  rationale: This replaces the formal construction with direct architectural English.
- pob_phrase: of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer
  simplified_phrase: made of blue, purple, and scarlet yarn and finely twisted linen, with embroidered work
  preserved_meaning: All the listed textiles are materials for the screen, and the screen includes skilled embroidered work.
  reasoning_layer_used: The lexical decisions distinguish the listed materials from the following craft description.
  rationale: This clarifies the construction without reducing the colored materials to embroidery on linen.
- pob_phrase: with their four pillars and their four bases
  simplified_phrase: supported by its four pillars and their four bases
  preserved_meaning: The screen arrangement has four supporting pillars, each associated with the four bases.
  reasoning_layer_used: The lexical rationale identifies the pillars as supports, while the revision record protects the possessive relationships.
  rationale: The support function is made explicit while both sets remain tied to the screen arrangement.
