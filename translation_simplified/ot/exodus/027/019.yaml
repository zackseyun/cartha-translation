translation:
  language: en
  text: All the equipment used for the tabernacle’s service must be made of bronze.[a] This also includes all the pegs for the tabernacle and its courtyard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “copper”; the Hebrew word can refer broadly to copper-based metal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All the utensils of the tabernacle for all its service
  simplified_phrase: All the equipment used for the tabernacle’s service
  preserved_meaning: Every implement used in the tabernacle’s work is included.
  reasoning_layer_used: POB lexical decisions for כְּלֵי and בְּכֹל עֲבֹדָתוֹ
  rationale: “Equipment used for” is clearer than the broad but potentially domestic-sounding “utensils for.”
- pob_phrase: and all its pegs, and all the pegs of the courtyard
  simplified_phrase: This also includes all the pegs for the tabernacle and its courtyard
  preserved_meaning: Both the tabernacle pegs and the courtyard pegs are included.
  reasoning_layer_used: POB lexical decisions for יְתֵדֹתָיו and יִתְדֹת הֶחָצֵר
  rationale: A separate sentence makes the two sets of pegs easier to identify.
- pob_phrase: shall be bronze
  simplified_phrase: must be made of bronze
  preserved_meaning: Bronze is the required material for every listed item.
  reasoning_layer_used: POB lexical decision for נְחֹשֶׁת
  rationale: “Made of bronze” states the material requirement in ordinary English.
