translation:
  language: en
  text: Make the tabernacle courtyard. For its south side, facing south, hang panels of finely twisted linen. The panels along this side must extend 100 cubits—about 150 feet (46 meters).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact length of a cubit varied, so the modern measurement is approximate.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the court of the tabernacle
  simplified_phrase: the tabernacle courtyard
  preserved_meaning: The open, enclosed area belonging to the sacred tent remains distinct from the tabernacle itself.
  reasoning_layer_used: POB lexical decision for חֲצַר
  rationale: “Courtyard” is clearer to modern readers than the sanctuary term “court.”
- pob_phrase: hangings for the court
  simplified_phrase: hang panels
  preserved_meaning: The linen fabric forms the courtyard boundary.
  reasoning_layer_used: POB footnote and lexical rationale for קְלָעִים
  rationale: “Panels” communicates the architectural function more clearly than “hangings.”
- pob_phrase: a hundred cubits long for one side
  simplified_phrase: The panels along this side must extend 100 cubits—about 150 feet (46 meters)
  preserved_meaning: The specified length remains attached to the linen panels along the south side.
  reasoning_layer_used: POB lexical decisions for מֵאָה בָאַמָּה and לַפֵּאָה הָאֶחָת
  rationale: The ancient unit is retained and its approximate modern equivalent is supplied for clarity.
interpretive_expansions:
- pob_phrase: hangings
  rendering: panels
  claim: The fabric pieces serve as boundary panels rather than interior curtains.
  evidence:
  - The POB footnote says the fabric panels form the court boundary.
  - The POB lexical rationale identifies their perimeter function.
  confidence: high
  alternatives_preserved:
  - curtains
  - hangings
- pob_phrase: a hundred cubits
  rendering: 100 cubits—about 150 feet (46 meters)
  claim: The ancient measurement is approximately equivalent to the stated modern length.
  evidence:
  - The Hebrew and POB explicitly specify 100 cubits.
  - A commonly used estimate of 18 inches per cubit yields this conversion.
  confidence: moderate
  alternatives_preserved:
  - The exact cubit length varied.
translation_notes:
  risk_flags:
  - risk: “Panels” may sound more rigid than the linen fabric actually was.
    mitigation: The phrase “finely twisted linen” keeps their fabric character clear.
  - risk: The modern length may imply more precision than the ancient unit permits.
    mitigation: “About” and the footnote mark the conversion as approximate.
