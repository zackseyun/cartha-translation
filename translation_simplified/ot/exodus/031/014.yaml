translation:
  language: en
  text: You must observe the Sabbath, because it is set apart as holy for you. Anyone who treats it as unholy will surely be put to death, because whoever does work on it will be cut off from their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cut off from their people” is a legal expression; this verse does not specify how the judgment is carried out.
    reason: simplification_note
simplification_decisions:
- pob_phrase: You shall keep the Sabbath
  simplified_phrase: You must observe the Sabbath
  preserved_meaning: The command requires Israel to keep the Sabbath.
  reasoning_layer_used: Lexical decision for וּשְׁמַרְתֶּם
  rationale: “Must observe” states the legal force in familiar modern English.
- pob_phrase: Whoever profanes it
  simplified_phrase: Anyone who treats it as unholy
  preserved_meaning: The offender dishonors the Sabbath’s holy status.
  reasoning_layer_used: Lexical decision for מְחַלְלֶיהָ
  rationale: The wording explains “profanes” without weakening the offense.
- pob_phrase: that person shall be cut off from among his people
  simplified_phrase: will be cut off from their people
  preserved_meaning: The offender is cut off from the community, though the means of judgment remains unspecified.
  reasoning_layer_used: Lexical and theological decisions for וְנִכְרְתָה, הַנֶּפֶשׁ הַהִוא, and מִקֶּרֶב עַמֶּיהָ
  rationale: The shorter wording uses natural singular “their” while preserving the legal idiom and its ambiguity.
