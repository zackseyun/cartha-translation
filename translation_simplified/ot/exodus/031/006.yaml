translation:
  language: en
  text: 'Now look: I myself have appointed Oholiab son of Ahisamach, from the tribe of Dan, to work alongside Bezalel. I have also put wisdom in the hearts of all the skilled workers,[a] so that they may make everything I have commanded you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls them “wise of heart”; here wisdom includes God-given skill for the work.
    reason: cultural_note
