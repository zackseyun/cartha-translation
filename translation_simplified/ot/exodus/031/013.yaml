translation:
  language: en
  text: Now you must tell the sons of Israel,[b] “Be sure to observe my Sabbaths.[a] This Sabbath observance is a sign between me and you in every generation, so that you may know that I am Yahweh, who makes you holy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “Only” or “Nevertheless, observe my Sabbaths.”
    reason: lexical_alternative
  - marker: b
    text: “Sons of Israel” is the Hebrew covenant name for the people of Israel as a whole.
    reason: source_note
