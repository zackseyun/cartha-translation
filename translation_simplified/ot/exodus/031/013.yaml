- pob_phrase: throughout your generations ... Yahweh who sanctifies you
  simplified_phrase: in every generation ... Yahweh, who makes you holy
  preserved_meaning: The sign continues across Israel’s generations, and Yahweh is the one who sets them apart as holy.
  reasoning_layer_used: POB lexical and theological decisions for לְדֹרֹתֵיכֶם, יְהוָה, and מְקַדִּשְׁכֶם
  rationale: Common wording replaces an idiom and a technical term without changing Yahweh’s identity or action.
