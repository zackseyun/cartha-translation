translation:
  language: en
  text: Then Yahweh said to Moses, “I will bring one more plague on Pharaoh and Egypt. After that, Pharaoh will send you away from here—and when he does, he will surely drive you completely out of here.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: One more plague I will bring upon Pharaoh and upon Egypt
  simplified_phrase: I will bring one more plague on Pharaoh and Egypt
  preserved_meaning: Yahweh will bring one additional plague as judgment on both Pharaoh and Egypt.
  reasoning_layer_used: POB lexical decisions for עוֹד, נֶגַע, אָבִיא, and עַל
  rationale: Ordinary English word order and “on” make the prediction easier to read without changing its target.
- pob_phrase: After that he will send you away from here
  simplified_phrase: After that, Pharaoh will send you away from here
  preserved_meaning: Following the final plague, Pharaoh will send the Israelites away from Egypt.
  reasoning_layer_used: Immediate context and POB lexical decision for יְשַׁלַּח אֶתְכֶם מִזֶּה
  rationale: Naming Pharaoh removes an unclear pronoun while preserving its contextual referent.
- pob_phrase: When he sends you away, he will surely drive you out completely from here
  simplified_phrase: and when he does, he will surely drive you completely out of here
  preserved_meaning: Pharaoh’s sending will amount to a certain, forceful, and total expulsion from Egypt.
  reasoning_layer_used: POB lexical decisions for כְּשַׁלְּחוֹ, כָּלָה, גָּרֵשׁ יְגָרֵשׁ, and מִזֶּה
  rationale: The recast clause avoids repetition while retaining both “surely” and “completely” as distinct emphases.
interpretive_expansions:
- pob_phrase: he will send you away
  rendering: Pharaoh will send you away
  claim: The pronoun refers to Pharaoh.
  evidence:
