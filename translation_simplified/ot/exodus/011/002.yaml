translation:
  language: en
  text: Speak now so the people can hear you. Each man is to ask[a] his neighbor, and each woman is to ask her neighbor, for objects of silver and objects of gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “borrow.” The Hebrew verb means “ask” or “request” but does not say whether the items were to be returned.
    reason: lexical_alternative
