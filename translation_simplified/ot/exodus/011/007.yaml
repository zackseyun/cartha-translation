translation:
  language: en
  text: But not even a dog will bark at any person or animal among the Israelites.[a] This will happen so that you may know that Yahweh makes a distinction between Egypt and Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “sharpen its tongue,” a vivid Hebrew expression for a dog barking or growling.
    reason: source_note
