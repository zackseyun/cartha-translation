translation:
  language: en
  text: Yahweh caused the Egyptians to look favorably on the people. Moses himself was also regarded as a very great man in Egypt, both by Pharaoh’s officials[a] and by the people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “Pharaoh’s servants,” referring here to his royal officials.
    reason: cultural_note
  - marker: b
    text: This likely means the broader population of Egypt, in contrast to Pharaoh’s officials.
    reason: cultural_note
simplification_decisions:
- pob_phrase: gave the people favor in the sight of the Egyptians
  simplified_phrase: caused the Egyptians to look favorably on the people
  preserved_meaning: Yahweh gave the people favorable regard among the Egyptians.
  reasoning_layer_used: Lexical decisions for וַיִּתֵּן, חֵן, and בְּעֵינֵי מִצְרַיִם
  rationale: The active wording makes the Hebrew social idiom immediately understandable.
- pob_phrase: the man Moses
  simplified_phrase: Moses himself
  preserved_meaning: The Hebrew gives Moses marked emphasis and dignity.
  reasoning_layer_used: Lexical decision for הָאִישׁ מֹשֶׁה
  rationale: “Moses himself” preserves the emphasis without the unnatural phrase “the man Moses.”
- pob_phrase: Pharaoh’s servants
  simplified_phrase: Pharaoh’s officials
  preserved_meaning: These were people serving Pharaoh in his royal administration.
  reasoning_layer_used: POB footnote c and lexical decision for עַבְדֵי פַרְעֹה
  rationale: “Officials” prevents modern readers from mistaking court servants for domestic workers.
