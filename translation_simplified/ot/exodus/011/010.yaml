translation:
  language: en
  text: Moses and Aaron performed all these miraculous signs before Pharaoh.[a] Yahweh hardened Pharaoh’s heart,[b] and Pharaoh would not let the sons of Israel leave his land.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all these wonders.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also be rendered “strengthened Pharaoh’s heart” or “made Pharaoh’s heart firm.”
    reason: lexical_alternative
  - marker: c
    text: “The sons of Israel” refers to the people descended from Israel as a whole.
    reason: simplification_note
simplification_decisions:
- pob_phrase: did all these signs
  simplified_phrase: performed all these miraculous signs
  preserved_meaning: Moses and Aaron carried out acts that displayed divine power before Pharaoh.
  reasoning_layer_used: Lexical decision for עָשׂוּ and כָּל הַמֹּפְתִים הָאֵלֶּה
  rationale: “Performed” reads naturally with signs, while “miraculous” makes their character clear.
- pob_phrase: and he did not let
  simplified_phrase: and Pharaoh would not let
  preserved_meaning: Pharaoh remained the one who refused Israel permission to depart.
  reasoning_layer_used: Immediate narrative context and lexical decision for שִׁלַּח
  rationale: Repeating Pharaoh’s name removes an unclear pronoun without changing its referent.
- pob_phrase: go out from his land
  simplified_phrase: leave his land
  preserved_meaning: Pharaoh refused to release Israel from his territory.
  reasoning_layer_used: Lexical decisions for שִׁלַּח and מֵאַרְצוֹ
  rationale: “Leave” expresses the same departure in ordinary modern English.
