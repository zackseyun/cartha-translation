translation:
  language: en
  text: The whole community of Israel left Elim and came to the wilderness of Sin,[a] between Elim and Sinai. This was on the fifteenth day of the second month after they left Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sin” is the name of a place here, not the word for moral wrongdoing.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They set out from Elim, and the whole congregation of the sons of Israel came
  simplified_phrase: The whole community of Israel left Elim and came
  preserved_meaning: The entire nation broke camp at Elim and traveled onward.
  reasoning_layer_used: POB lexical decisions for וַיִּסְעוּ and כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  rationale: “Community of Israel” clearly includes the whole people, while “left” naturally expresses setting out from Elim.
- pob_phrase: the wilderness of Sin, which is between Elim and Sinai
  simplified_phrase: the wilderness of Sin, between Elim and Sinai
  preserved_meaning: The named wilderness is geographically located between Elim and Sinai.
  reasoning_layer_used: POB lexical decisions for מִדְבַּר סִין and the location clause
  rationale: The shorter location phrase keeps the geography without an unnecessary relative clause.
- pob_phrase: on the fifteenth day of the second month after they had gone out from the land of Egypt
  simplified_phrase: This was on the fifteenth day of the second month after they left Egypt.
  preserved_meaning: The journey is dated from Israel’s departure from Egypt.
  reasoning_layer_used: POB lexical decisions for the date and exodus reference point
  rationale: A separate sentence makes the date easier to follow while preserving Egypt as the chronological anchor.
