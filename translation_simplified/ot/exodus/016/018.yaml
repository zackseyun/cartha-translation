translation:
  language: en
  text: When they measured what they had gathered using the omer measure[a], those who had gathered much had nothing left over, and those who had gathered little had enough. Each person had gathered as much as he could eat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An omer was a unit used to measure dry goods.
    reason: cultural_note
simplification_decisions:
- pob_phrase: measured it by the omer
  simplified_phrase: measured what they had gathered using the omer measure
  preserved_meaning: They measured the gathered food according to the dry-measure unit called an omer.
  reasoning_layer_used: POB lexical decision for בָעֹמֶר
  rationale: The wording explains the omer's function while retaining the concrete biblical unit.
- pob_phrase: the one who gathered little had no lack
  simplified_phrase: those who had gathered little had enough
  preserved_meaning: Those who gathered a smaller amount were not left short of what they needed.
  reasoning_layer_used: POB lexical decisions for הַמַּמְעִיט and הֶחְסִיר
  rationale: “Had enough” expresses the lack-of-deficiency contrast in ordinary English.
- pob_phrase: each one gathered according to what he could eat
  simplified_phrase: Each person had gathered as much as he could eat
  preserved_meaning: The amount gathered corresponded to each individual's capacity to eat.
  reasoning_layer_used: POB lexical and theological decisions for אִישׁ and לְפִי אָכְלוֹ
  rationale: The recast sentence preserves the distributive singular while making the amount relationship immediate.
translation_notes:
  risk_flags:
  - risk: The singular pronoun “he” could be mistaken as referring only to males.
    mitigation: “Each person” signals the POB's intended distributive reference to every individual.
