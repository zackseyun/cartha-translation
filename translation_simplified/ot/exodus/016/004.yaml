translation:
  language: en
  text: Then Yahweh said to Moses, “Look, I am raining bread down from heaven for you.[a] Each day the people are to go out and gather the amount they need for that day. In this way I will test them to see whether they will walk in my law or not.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will rain bread down from heaven for you.”
    reason: lexical_alternative
  - marker: b
    text: Or “walk according to my instruction or not.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Behold, I am raining bread from heaven for you
  simplified_phrase: Look, I am raining bread down from heaven for you
  preserved_meaning: Yahweh announces the vivid and imminent provision of bread from heaven.
  reasoning_layer_used: Lexical decisions for הִנְנִי and מַמְטִיר
  rationale: “Look” is a natural attention-getter, while “raining bread down” preserves the source image.
- pob_phrase: the people shall go out and gather a day's portion each day
  simplified_phrase: Each day the people are to go out and gather the amount they need for that day
  preserved_meaning: The people must gather each day only that day’s needed amount.
  reasoning_layer_used: Lexical decision and POB footnote for דְּבַר יוֹם בְּיוֹמוֹ
  rationale: The idiom is restated as a clear daily instruction.
- pob_phrase: so that I may test them, whether they will walk in my law or not
  simplified_phrase: In this way I will test them to see whether they will walk in my law or not
  preserved_meaning: The daily command tests whether Israel will conduct itself according to Yahweh’s law.
  reasoning_layer_used: Lexical and theological decisions for אֲנַסֶּנּוּ, הֲיֵלֵךְ, and בְּתוֹרָתִי
  rationale: The sentence makes the test’s connection to the command clear without replacing the walking metaphor.
