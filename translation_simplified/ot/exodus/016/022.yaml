translation:
  language: en
  text: On the sixth day, they gathered twice as much bread—two measures[a] for each person. All the community’s leaders came and told Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Each measure was an omer, an ancient Israelite unit for measuring dry goods.
    reason: cultural_note
