translation:
  language: en
  text: When the layer of dew had lifted, look! There was a fine, flaky substance[a] on the surface of the wilderness, as fine as frost on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word translated “flaky” is uncertain and may describe the substance’s texture or appearance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: had gone up
  simplified_phrase: had lifted
  preserved_meaning: The dew moved upward and disappeared without explicitly interpreting the process as evaporation.
  reasoning_layer_used: POB lexical decision for וַתַּעַל
  rationale: “Had lifted” preserves the Hebrew image in natural English.
- pob_phrase: behold, on the surface of the wilderness was
  simplified_phrase: look! There was ... on the surface of the wilderness
  preserved_meaning: The wording draws sudden attention to the substance while making only a spatial claim about its location.
  reasoning_layer_used: POB lexical decisions for וְהִנֵּה and עַל פְּנֵי הַמִּדְבָּר
  rationale: The exclamation keeps the vividness, and the locative clause avoids implying complete coverage.
- pob_phrase: a fine, flaky thing
  simplified_phrase: a fine, flaky substance
  preserved_meaning: An unidentified material had a fine, flake-like texture or appearance.
  reasoning_layer_used: POB lexical decision for מְחֻסְפָּס
  rationale: “Substance” is clearer than “thing” without identifying the material beyond the Hebrew.
