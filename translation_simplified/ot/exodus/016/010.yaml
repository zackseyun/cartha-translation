simplification_decisions:
- pob_phrase: And it happened, as Aaron spoke
  simplified_phrase: While Aaron was speaking
  preserved_meaning: Aaron’s speech and the people’s turning happened at the same time.
  reasoning_layer_used: Lexical rationale for כְּדַבֵּר and the narrative function of וַיְהִי.
  rationale: The time clause preserves the overlap without a heavy narrative opening.
- pob_phrase: the whole congregation of the sons of Israel
  simplified_phrase: the whole community of Israelites,[a]
  preserved_meaning: The phrase refers to the entire gathered Israelite community, while the footnote preserves the literal wording.
  reasoning_layer_used: Lexical alternatives, immediate context, and the theological decision for בְּנֵי יִשְׂרָאֵל.
  rationale: This avoids suggesting that only men were present and makes the collective meaning clear.
- pob_phrase: and behold, the glory of Yahweh appeared
  simplified_phrase: Look! Yahweh’s glory appeared
  preserved_meaning: The wording urgently directs attention to the visible manifestation of Yahweh’s glory.
  reasoning_layer_used: Lexical rationales for וְהִנֵּה, כְּבוֹד יְהוָה, and נִרְאָה.
  rationale: A brief exclamation and natural possessive retain the solemn attention-getting force.
translation_notes:
  risk_flags:
  - risk: “Israelites” does not preserve the Hebrew expression’s literal filial form in the main text.
    mitigation: The footnote gives the literal wording “the sons of Israel.”
