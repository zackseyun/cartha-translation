translation:
  language: en
  text: While Aaron was speaking to the whole community of Israelites,[a] they turned toward the wilderness. Look! Yahweh’s glory appeared in the cloud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the sons of Israel.”
