simplification_decisions:
- pob_phrase: And the whole congregation
  simplified_phrase: the entire community
  preserved_meaning: The gathered people of Israel are presented as a corporate whole.
  reasoning_layer_used: POB lexical decisions for כָּל and עֲדַת
  rationale: “Entire community” expresses the collective totality in more familiar English.
- pob_phrase: against Moses and against Aaron
  simplified_phrase: against Moses and Aaron
  preserved_meaning: Both Moses and Aaron are the targets of the people's hostile complaint.
  reasoning_layer_used: POB lexical decision for עַל
  rationale: One shared “against” is natural English and keeps the adversative force toward both leaders.
- pob_phrase: in the wilderness
  simplified_phrase: In the wilderness
  preserved_meaning: The complaint takes place in uncultivated wilderness land, not necessarily a sandy desert.
  reasoning_layer_used: POB lexical decision for בַּמִּדְבָּר
  rationale: Moving the setting first clarifies the scene without changing its meaning.
