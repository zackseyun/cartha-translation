translation:
  language: en
  text: The sons of Israel[a] said to them, “If only we had died by Yahweh’s hand in Egypt! There we sat beside pots of meat and ate bread until we were full. For you have brought us out into this wilderness to starve this whole assembly to death.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of Israel,” a covenant name for the Israelites as a people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: when we sat by the pots of meat, when we ate bread to the full
  simplified_phrase: There we sat beside pots of meat and ate bread until we were full
  preserved_meaning: They remembered sitting near meat-filled cooking pots and eating bread to fullness in Egypt.
  reasoning_layer_used: Lexical decisions for the two parallel temporal clauses
  rationale: The rewrite keeps the concrete meat-pot image and states satiety in everyday English.
- pob_phrase: For you have brought us out into this wilderness
  simplified_phrase: For you have brought us out into this wilderness
  preserved_meaning: They give the reason for their complaint and accuse their leaders of taking them from Egypt into the wilderness.
  reasoning_layer_used: Lexical decisions for כִּי, הוֹצֵאתֶם, and הַמִּדְבָּר הַזֶּה
  rationale: Retaining “For” and “brought us out” preserves both the explanation and the exodus movement.
- pob_phrase: to kill this whole assembly with hunger
  simplified_phrase: to starve this whole assembly to death
  preserved_meaning: They claim that the journey was intended to make the entire assembly die from hunger.
  reasoning_layer_used: Lexical decisions for לְהָמִית and בָּרָעָב
  rationale: The familiar phrase “starve to death” clearly joins the threatened death with its stated cause.
translation_notes:
  risk_flags:
  - risk: “Sons of Israel” may sound as though only men are included.
    mitigation: The footnote explains that this covenant name refers to the Israelites as a people.
