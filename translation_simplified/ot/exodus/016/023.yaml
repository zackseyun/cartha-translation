translation:
  language: en
  text: 'He said to them, “This is what Yahweh has said: Tomorrow will be a special day of rest, a holy Sabbath for Yahweh. Do your baking and boiling now. Set aside everything left over, and keep it for yourselves until morning.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Tomorrow is a solemn rest
  simplified_phrase: Tomorrow will be a special day of rest
  preserved_meaning: Tomorrow is set apart for an especially significant cessation from work.
  reasoning_layer_used: Lexical decision for שַׁבָּתוֹן
  rationale: “Special day of rest” makes the marked nature of the rest clear in common English.
- pob_phrase: What you will bake, bake; and what you will boil, boil
  simplified_phrase: Do your baking and boiling now
  preserved_meaning: They must complete both kinds of food preparation before the Sabbath.
  reasoning_layer_used: Lexical decisions and immediate Sabbath context
  rationale: The direct command preserves both activities without the unnatural repeated verbs.
- pob_phrase: all that is left over, set aside for yourselves to be kept until the morning
  simplified_phrase: Set aside everything left over, and keep it for yourselves until morning
  preserved_meaning: They are to reserve the remaining food for their own use through the night.
  reasoning_layer_used: Lexical decisions for הַנִּיחוּ לָכֶם, לְמִשְׁמֶרֶת, and עַד הַבֹּקֶר
