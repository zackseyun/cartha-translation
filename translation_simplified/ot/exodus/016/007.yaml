translation:
  language: en
  text: In the morning you will see Yahweh’s glory,[a] because he has heard you grumbling against him. Who are we? Why are you grumbling against us?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when he hears you grumbling against Yahweh.” The Hebrew can indicate either time or cause.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the glory of Yahweh
  simplified_phrase: Yahweh’s glory
  preserved_meaning: Yahweh’s manifest splendor and presence remain the object the people will see.
  reasoning_layer_used: lexical decision for כְּבוֹד יְהוָה
  rationale: The possessive form is more direct while retaining the key theological term “glory.”
- pob_phrase: he has heard your grumblings against Yahweh
  simplified_phrase: he has heard you grumbling against him
  preserved_meaning: Yahweh has heard the people’s repeated, rebellious complaints directed against him.
  reasoning_layer_used: lexical decisions for בְּשָׁמְעוֹ, תְּלֻנֹּתֵיכֶם, and עַל יְהוָה
  rationale: A verbal clause sounds more natural while preserving the causal reading and negative force.
- pob_phrase: And what are we, that you grumble against us?
  simplified_phrase: Who are we? Why are you grumbling against us?
  preserved_meaning: Moses and Aaron rhetorically stress their insignificance and challenge complaints directed at them.
  reasoning_layer_used: lexical decisions for וְנַחְנוּ מָה, כִּי, תלונו, and עָלֵינוּ
  rationale: Two short questions make the rhetorical contrast clear without weakening it.
translation_notes:
  risk_flags:
  - risk: Using “him” removes the second occurrence of Yahweh’s name.
    mitigation: The antecedent is explicit in the same sentence, and the first occurrence retains the divine name.
  - risk: Splitting the final rhetorical question may make its two parts seem more independent.
    mitigation: The questions remain adjacent and preserve the contrast between Yahweh and his servants.
