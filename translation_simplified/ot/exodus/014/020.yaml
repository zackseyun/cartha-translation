translation:
  language: en
  text: It moved between Egypt’s camp and Israel’s camp. There was the cloud and the darkness, yet it lit up the night.[a] The two camps did not come near each other all night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “There was the cloud and darkness, but it gave light by night.” The Hebrew is brief, and ancient versions differ on how the darkness and light relate to the two camps.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And it came between the camp of Egypt and the camp of Israel
  simplified_phrase: It moved between Egypt’s camp and Israel’s camp.
  preserved_meaning: The divine presence changed position and stood between the two camps.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: “Moved” makes the narrative motion clear while the pronoun “it” preserves the uncertain referent.
- pob_phrase: and there was the cloud and the darkness, yet it lit up the night
  simplified_phrase: There was the cloud and the darkness, yet it lit up the night.
  preserved_meaning: Cloud and darkness are juxtaposed with light during the night.
  reasoning_layer_used: Lexical decisions and alternative-reading footnote
  rationale: A separate sentence makes the contrast easier to follow without resolving the Hebrew’s terseness.
- pob_phrase: the one did not come near the other all night
  simplified_phrase: The two camps did not come near each other all night.
  preserved_meaning: Neither camp approached the other during the entire night.
  reasoning_layer_used: Lexical decision for the Hebrew reciprocal idiom
  rationale: Naming the camps removes an opaque pronoun pair while retaining mutual separation.
translation_notes:
  risk_flags:
  - risk: Readers may not know whether “it” refers to the angel of God or the pillar of cloud.
    mitigation: The impersonal pronoun is retained to preserve the POB’s documented ambiguity.
  - risk: The Hebrew relationship among cloud, darkness, and light is uncertain.
    mitigation: The main POB reading is retained and the alternative remains in a footnote.
