simplification_decisions:
- pob_phrase: pursued and went in after them
  simplified_phrase: chased them and went ... behind them
  preserved_meaning: The Egyptians both pursued the Israelites and entered the same sea passage after them.
  reasoning_layer_used: Lexical decisions for וַיִּרְדְּפוּ, וַיָּבֹאוּ, and אַחֲרֵיהֶם
  rationale: The coordinated verbs preserve both actions while using familiar language.
- pob_phrase: into the midst of the sea
  simplified_phrase: into the middle of the sea
  preserved_meaning: They advanced into the sea’s interior rather than merely reaching its edge.
  reasoning_layer_used: Lexical decision for אֶל תּוֹךְ הַיָּם
  rationale: “Middle” is clearer than “midst” and keeps the source image.
- pob_phrase: —all Pharaoh’s horses, his chariots, and his horsemen
  simplified_phrase: —all of Pharaoh’s horses, chariots, and horsemen
  preserved_meaning: The list identifies the whole Egyptian force that entered in pursuit.
  reasoning_layer_used: Lexical decisions for כֹּל, סוּס פַּרְעֹה, רִכְבּוֹ, and וּפָרָשָׁיו
  rationale: The dash preserves the list as a specification of the pursuing force rather than an accompanying group.
