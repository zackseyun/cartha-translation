  reasoning_layer_used: Lexical decisions for the compressed military inventory and וְחֵילוֹ
  rationale: A separate sentence preserves the inventory and keeps “all” tied to the horses and chariots.
- pob_phrase: by Pi-hahiroth, before Baal-zephon
  simplified_phrase: near Pi-hahiroth and opposite Baal-zephon
  preserved_meaning: The verse locates the camp in relation to both named landmarks.
