  text: The Egyptians pursued the Israelites and caught up with them while they were camped beside the sea, near Pi-hahiroth and opposite Baal-zephon. All Pharaoh’s horses and chariots, his horsemen, and his army were there.
  philosophy: optimal-equivalence
