  reasoning_layer_used: Lexical decisions for וַיַּשִּׂיגוּ, חֹנִים, and עַל הַיָּם
  rationale: Common wording makes the pursuit and Israel’s situation immediately clear.
- pob_phrase: all Pharaoh’s horses and chariots, his horsemen, and his army
  simplified_phrase: All Pharaoh’s horses and chariots, his horsemen, and his army were there
