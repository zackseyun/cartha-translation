simplification_decisions:
- pob_phrase: Was it because there were no graves in Egypt that you took us away to die in the wilderness?
  simplified_phrase: Were there no graves in Egypt? Is that why you took us away to die in the wilderness?
  preserved_meaning: The people sarcastically accuse Moses of taking them from Egypt only to die in the wilderness.
  reasoning_layer_used: POB lexical decision for הֲמִבְּלִי אֵין and לְקַחְתָּנוּ
  rationale: Splitting the long rhetorical question makes its sarcasm and accusation easier to follow.
- pob_phrase: What is this you have done to us
