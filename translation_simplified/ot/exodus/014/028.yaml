translation:
  language: en
  text: The waters flowed back and covered the chariots and horsemen—all of Pharaoh’s army that had followed the Israelites into the sea. Not one of them was left.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the waters returned
  simplified_phrase: The waters flowed back
  preserved_meaning: The divided sea returned to its former place over the Egyptians.
  reasoning_layer_used: lexical decision for וַיָּשֻׁבוּ
  rationale: “Flowed back” makes the movement of the returning water immediately clear.
- pob_phrase: all the army of Pharaoh
  simplified_phrase: all of Pharaoh’s army
  preserved_meaning: The statement includes the whole Egyptian force that entered the sea in pursuit.
  reasoning_layer_used: lexical and theological decisions for לְכֹל חֵיל פַּרְעֹה
  rationale: The possessive form is more natural while the following clause still limits the scope.
- pob_phrase: not one of them remained
  simplified_phrase: Not one of them was left
  preserved_meaning: None of the pursuing force in the sea remained.
  reasoning_layer_used: lexical decision for לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  rationale: “Was left” expresses the emphatic totality in common English.
interpretive_expansions:
- pob_phrase: after them
  rendering: after the Israelites
  claim: The pursuing army followed the Israelites into the sea.
  evidence:
  - The immediate narrative identifies the Israelites as the people pursued.
  - The POB lexical rationale explicitly identifies “them” as the Israelites.
  confidence: high
