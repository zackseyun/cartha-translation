translation:
  language: en
  text: But the sons of Israel[a] walked through the sea on dry ground. The waters were a wall[b] for them on both sides—on their right and on their left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites.
    reason: simplification_note
  - marker: b
    text: Some understand this as “like a wall,” but the Hebrew directly says “a wall.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walked on dry ground through the midst of the sea
  simplified_phrase: walked through the sea on dry ground
  preserved_meaning: They traveled on foot through the sea while its bed was dry.
  reasoning_layer_used: Lexical decisions for הָלְכוּ, בַיַּבָּשָׁה, and בְּתוֹךְ הַיָּם
  rationale: Natural English word order removes the difficult phrase “through the midst” without losing the scene.
- pob_phrase: and the waters were a wall to them
  simplified_phrase: The waters were a wall for them on both sides
  preserved_meaning: The waters stood as a wall beside the people rather than merely resembling one.
  reasoning_layer_used: Lexical and theological decision for חֹמָה
  rationale: A new sentence clarifies the image while retaining the Hebrew’s direct statement “a wall.”
- pob_phrase: on their right and on their left
  simplified_phrase: on both sides—on their right and on their left
  preserved_meaning: The water bordered them on each side.
  reasoning_layer_used: Lexical decisions for מִימִינָם and וּמִשְּׂמֹאלָם
  rationale: “On both sides” gives immediate orientation while the original right-left balance remains explicit.
