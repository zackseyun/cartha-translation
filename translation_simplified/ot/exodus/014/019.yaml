translation:
  language: en
  text: Then the angel of God,[a] who had been leading Israel’s camp, moved from the front and went behind them. The pillar of cloud also moved from in front of them and stood behind them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the messenger of God.” The Hebrew word can mean either “angel” or “messenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who had been going before the camp of Israel
  simplified_phrase: who had been leading Israel’s camp
  preserved_meaning: The angel had been moving ahead of Israel’s camp as its divine guide.
  reasoning_layer_used: Lexical rationale and immediate narrative context
  rationale: “Leading” makes the angel’s forward movement and guiding role clear in ordinary English.
- pob_phrase: moved and went behind them
  simplified_phrase: moved from the front and went behind them
  preserved_meaning: The angel changed position from ahead of Israel to their rear.
  reasoning_layer_used: Lexical decisions for וַיִּסַּע and מֵאַחֲרֵיהֶם
  rationale: Adding the starting position clarifies the spatial shift already stated in the verse.
- pob_phrase: the pillar of cloud moved from before them
  simplified_phrase: The pillar of cloud also moved from in front of them
  preserved_meaning: The visible cloud pillar changed from a position ahead of Israel to one behind them.
  reasoning_layer_used: Lexical decisions for עַמּוּד הֶעָנָן and מִפְּנֵיהֶם
  rationale: “In front of” replaces the less familiar spatial use of “before,” while “also” shows the parallel movement.
