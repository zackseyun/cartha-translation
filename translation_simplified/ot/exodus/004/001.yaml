- pob_phrase: But behold
  simplified_phrase: But
  preserved_meaning: Moses introduces an objection to what God has told him.
  reasoning_layer_used: Lexical decision for וְהֵן and immediate context
  rationale: “But” clearly introduces the objection without the archaic word “behold.”
- pob_phrase: they will not listen to my voice
  simplified_phrase: listen to me
  preserved_meaning: Moses fears the people will not heed what he says.
  reasoning_layer_used: POB footnote and lexical decision for וְלֹא יִשְׁמְעוּ בְּקֹלִי
  rationale: The POB audit supports this natural idiom without overstating the sense as obedience.
translation_notes:
