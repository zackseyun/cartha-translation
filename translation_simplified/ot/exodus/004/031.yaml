translation:
  language: en
  text: The people believed. When they heard that Yahweh had come to care for[a] the sons of Israel and had seen their suffering, they bowed down and worshiped.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “had visited” and can also mean “had attended to” or “had taken notice of,” with the sense that Yahweh was acting for them.
    reason: lexical_alternative
