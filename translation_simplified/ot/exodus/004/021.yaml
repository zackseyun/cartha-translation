translation:
  language: en
  text: Then Yahweh told Moses, “When you return to Egypt, make sure you perform before Pharaoh all the wonders[a] I have put in your hand. I have given you the power to do them. But I will harden his heart[b], and he will not let the people go.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “signs” or “miracles”; the word describes extraordinary acts that display God’s power.
    reason: lexical_alternative
  - marker: b
    text: Or “strengthen his heart” or “make his heart firm”; here it means confirming Pharaoh in his stubborn refusal.
    reason: lexical_alternative
