translation:
  language: en
  text: Then Yahweh said to Moses again, “Please put your hand inside the fold of your robe.” Moses put his hand there. When he took it out, look—his hand had a skin disease and was white like snow.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term describes the condition called tsaraath in the Old Testament; it may not be the disease now known as leprosy or Hansen’s disease.
    reason: lexical_alternative
