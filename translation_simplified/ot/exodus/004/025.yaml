translation:
  language: en
  text: Then Zipporah took a sharp flint stone and cut off her son’s foreskin. She touched his feet with it[a] and said, “Surely you are a bridegroom of blood to me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “his feet.” “Feet” may be a way of referring to the genitals, and “his” may refer either to Moses or to her son.
    reason: lexical_alternative
