translation:
  language: en
  text: If they do not believe you and do not listen to what the first sign tells them, they will believe what the later sign tells them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “last sign,” but “later sign” does not imply that no other sign will follow.
    reason: lexical_alternative
