  text: 'Then Moses said to Yahweh, “Please, Lord, I was not good at speaking before, and I still am not, even since you began speaking to your servant. I have difficulty speaking: my mouth is heavy, and my tongue is heavy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures Moses as “heavy of mouth and heavy of tongue”; it does not say whether he lacked eloquence or had a speech impediment.
    reason: lexical_alternative
