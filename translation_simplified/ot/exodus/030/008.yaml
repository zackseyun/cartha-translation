  preserved_meaning: Aaron readies the lamps for their prescribed burning without limiting the action to lighting them.
  reasoning_layer_used: POB lexical decision for וּבְהַעֲלֹת
  rationale: “Prepares” states the ritual action in familiar English while retaining its broad sense.
- pob_phrase: he shall burn it, a regular incense
  simplified_phrase: he must burn incense before Yahweh. This must be done regularly
  preserved_meaning: Aaron is required to burn incense as a recurring prescribed offering before Yahweh.
  reasoning_layer_used: POB lexical decisions for יַקְטִירֶנָּה, קְטֹרֶת, תָּמִיד, and לִפְנֵי יְהוָה
  rationale: Two sentences remove the unclear pronoun and awkward noun phrase while keeping the command and its regularity distinct.
- pob_phrase: throughout your generations
  simplified_phrase: throughout your generations
  preserved_meaning: The ordinance continues among Israel’s successive generations.
  reasoning_layer_used: POB lexical decision for לְדֹרֹתֵיכֶם and grounding review
  rationale: Retaining “your” preserves the covenant community addressed by the command.
