translation:
  language: en
  text: When Aaron prepares the lamps at twilight[a], he must burn incense before Yahweh. This must be done regularly[b] throughout your generations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “between the evenings,” referring to the twilight or evening period.
    reason: lexical_alternative
  - marker: b
    text: Or “continually”; this means the offering must be repeated as prescribed, not burned without interruption.
    reason: lexical_alternative
