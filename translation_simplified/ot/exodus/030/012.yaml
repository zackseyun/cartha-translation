translation:
  language: en
  text: When you take a census of the sons of Israel, each man who is counted must give Yahweh a ransom for his life. Then no plague will strike them when you count them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: according to those numbered among them
  simplified_phrase: each man who is counted
  preserved_meaning: The payment is required from every man included in the census.
  reasoning_layer_used: The lexical decision identifies the phrase as enrollment or numbering in a census.
  rationale: The wording is recast around the person counted instead of using an awkward administrative phrase.
- pob_phrase: then each man shall give to Yahweh
  simplified_phrase: each man who is counted must give Yahweh
  preserved_meaning: Every counted man is individually required to make the payment to Yahweh.
  reasoning_layer_used: The lexical and theological decisions preserve the distributive masculine wording and the divine name Yahweh.
  rationale: “Must give” states the legal requirement in clear modern English.
- pob_phrase: so that there will be no plague among them
  simplified_phrase: Then no plague will strike them
  preserved_meaning: The ransom payment prevents the warned plague from coming upon the people.
  reasoning_layer_used: The lexical rationale treats the clause as the intended result and the plague as divine judgment.
  rationale: The active wording makes the result easier to understand while retaining the force of the warning.
translation_notes:
  risk_flags:
  - risk: “Sons of Israel” may sound less natural than “Israelites” to modern readers.
    mitigation: It is retained because the POB theological decision requires the source’s masculine familial expression.
