translation:
  language: en
  text: You must collect the atonement money from the sons of Israel and use it to support the work at the tent of meeting. This money will be a memorial for them in Yahweh’s presence. In this way, it will make atonement for your lives.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: take the atonement money from the sons of Israel and give it for the service of the tent of meeting
  simplified_phrase: collect the atonement money from the sons of Israel and use it to support the work at the tent of meeting
  preserved_meaning: The census payment is collected and allocated to the sanctuary’s work.
  reasoning_layer_used: POB lexical decisions for כֶּסֶף הַכִּפֻּרִים and עַל עֲבֹדַת אֹהֶל מוֹעֵד
  rationale: “Collect” and “use it to support” make the payment and its purpose clear in ordinary English.
- pob_phrase: it shall be for the sons of Israel as a memorial before Yahweh
  simplified_phrase: This money will be a memorial for them in Yahweh’s presence
  preserved_meaning: The money serves as an enduring reminder concerning Israel before Yahweh.
  reasoning_layer_used: POB lexical decision for וְהָיָה ... לְזִכָּרוֹן and contextual sense of לִפְנֵי יְהוָה
  rationale: Naming the money again clarifies the referent, while “in Yahweh’s presence” explains the cultic expression.
- pob_phrase: to make atonement for your lives
  simplified_phrase: In this way, it will make atonement for your lives
  preserved_meaning: The payment has the stated atoning function for the Israelites’ lives.
  reasoning_layer_used: POB lexical decisions for לְכַפֵּר and עַל נַפְשֹׁתֵיכֶם
  rationale: A separate linked sentence eases the syntax without weakening the key concept of atonement.
translation_notes:
  risk_flags:
  - risk: Readers may take “sons of Israel” as excluding women rather than naming the covenant people corporately.
    mitigation: The wording retains the POB theological decision and does not add a narrower meaning.
  - risk: Splitting the verse could make the memorial and atoning functions seem unrelated.
    mitigation: “In this way” explicitly keeps the final purpose connected to the money and its memorial role.
