- pob_phrase: grind some of it very fine
  simplified_phrase: grind some of the incense into a very fine powder
  preserved_meaning: Only part of the incense is to be pulverized to a very fine consistency.
  reasoning_layer_used: Lexical decisions for וְשָׁחַקְתָּ, מִמֶּנָּה, and הָדֵק
  rationale: The wording identifies the object and states the intended result in ordinary English.
- pob_phrase: and put some of it
  simplified_phrase: Put some of it
  preserved_meaning: A portion of the prepared incense is to be placed at the appointed location.
  reasoning_layer_used: Lexical decision for וְנָתַתָּה and sentence-level readability
  rationale: A new sentence makes the second ritual command easier to follow.
- pob_phrase: It shall be most holy for you
  simplified_phrase: This incense is to be most holy for you
  preserved_meaning: The incense has the highest degree of holiness in relation to the people addressed.
  reasoning_layer_used: Holiness-superlative theological decision and lexical decision for תִּהְיֶה לָכֶם
  rationale: The revision clarifies the referent and preserves a declaration of sacred status rather than recasting it as a direct obligation.
