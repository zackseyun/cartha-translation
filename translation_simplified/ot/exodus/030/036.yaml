translation:
  language: en
  text: Grind some of the incense into a very fine powder. Put some of it before the testimony[a] in the tent of meeting, where I will meet with you. This incense is to be most holy for you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The testimony” is the covenant testimony associated with the ark.
    reason: cultural_note
  - marker: b
    text: More literally, “holy of holies,” a Hebrew way of saying “most holy.”
    reason: lexical_alternative
