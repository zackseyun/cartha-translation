translation:
  language: en
  text: On this altar, do not burn any incense that is not authorized.[a] Do not offer on it any sacrifice that is burned whole or any grain offering. Do not pour any drink offering on it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “strange incense” or “foreign incense,” but here it means incense that was not permitted for this altar.
    reason: lexical_alternative
