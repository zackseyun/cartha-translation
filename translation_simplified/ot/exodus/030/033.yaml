translation:
  language: en
  text: Anyone who makes oil with the same blend as the sacred anointing oil, or puts any of that sacred oil on someone not authorized to receive it, must be cut off from their people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cut off from their people” is a covenant penalty, but this verse does not say exactly how it is carried out.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Whoever compounds any like it
  simplified_phrase: Anyone who makes oil with the same blend as the sacred anointing oil
  preserved_meaning: The prohibition covers making oil with the same composition as the sacred anointing oil.
  reasoning_layer_used: Lexical decisions for יִרְקַח and כָּמֹהוּ in the immediate context
  rationale: This replaces technical wording and clearly identifies the oil being copied.
- pob_phrase: puts any of it on a stranger
  simplified_phrase: puts any of that sacred oil on someone not authorized to receive it
  preserved_meaning: The offense is applying the sacred oil to someone who lacks authorization, not to an ethnic foreigner as such.
  reasoning_layer_used: Lexical and theological decisions for וַאֲשֶׁר יִתֵּן מִמֶּנּוּ and עַל זָר
  rationale: Naming the sacred oil removes the pronoun ambiguity while clarifying the holiness restriction.
- pob_phrase: shall be cut off from his people
  simplified_phrase: must be cut off from their people
  preserved_meaning: The verse requires severe removal from the covenant community without specifying how it occurs.
  reasoning_layer_used: Theological decision for וְנִכְרַת מֵעַמָּיו
  rationale: The source image remains, while singular “their” naturally matches the generic subject.
interpretive_expansions:
- pob_phrase: any like it; any of it
  rendering: oil with the same blend as the sacred anointing oil; any of that sacred oil
  claim: Both references concern the sacred anointing oil described just before this verse, with the first forbidding imitation and the second unauthorized application.
  evidence:
  - The immediate context describes the sacred anointing oil and its composition.
  - The POB lexical rationales identify the oil as the contextual referent.
  confidence: high
  alternatives_preserved:
  - oil according to the same formula
  - oil like it
translation_notes:
  risk_flags:
  - risk: “Cut off” may be understood as one specific form of punishment.
    mitigation: The footnote says the verse does not specify how the covenant penalty is carried out.
