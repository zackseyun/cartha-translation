translation:
  language: en
  text: The rich must not pay more, and the poor must not pay less. Each must give the same amount—half a shekel—as a contribution to Yahweh, to make atonement for your lives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for yourselves”; the Hebrew word refers here to the lives or persons being counted, not only to the soul.
    reason: lexical_alternative
