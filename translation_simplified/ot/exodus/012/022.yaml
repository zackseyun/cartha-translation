translation:
  language: en
  text: Take a bunch of hyssop and dip it in the blood in the basin.[a] Then touch the top of the doorway and its two doorposts with some of that blood. No one among you must go out through the entrance of his house until morning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “threshold.” The Hebrew word can have either meaning, but “basin” fits the blood being in it and the hyssop being dipped into it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall take
  simplified_phrase: Take
  preserved_meaning: The wording remains a direct command.
  reasoning_layer_used: source syntax and POB translation
  rationale: The shorter imperative expresses the same command in ordinary English.
- pob_phrase: the lintel and the two doorposts
  simplified_phrase: the top of the doorway and its two doorposts
  preserved_meaning: The blood touches the upper and both side parts of the doorway.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Top of the doorway” explains the unfamiliar architectural term “lintel.”
- pob_phrase: none of you shall go out from the entrance of his house
  simplified_phrase: No one among you must go out through the entrance of his house
  preserved_meaning: Each person is forbidden to leave his house before morning.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The revision clarifies the prohibition while retaining the distributive “his house.”
