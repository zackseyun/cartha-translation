translation:
  language: en
  text: The blood on the houses where you are staying will be a sign for you. When I see the blood, I will pass over you[a]. When I strike the land of Egypt, no plague will come among you to cause destruction.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pass over you” may also mean “spare you” or “protect you.”
    reason: lexical_alternative
  - marker: b
    text: Or, “no plague will come among you for the destroyer,” taking “destroyer” as a substantive.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the blood shall be a sign for you on the houses where you are
  simplified_phrase: The blood on the houses where you are staying will be a sign for you
  preserved_meaning: The blood on the Israelites’ houses serves as a sign on their behalf.
  reasoning_layer_used: Lexical decisions for “the blood,” “for you,” “a sign,” and “where you are.”
  rationale: Reordering makes the relationship between the blood, houses, and sign clear.
- pob_phrase: When I see the blood, I will pass over you
  simplified_phrase: When I see the blood, I will pass over you
  preserved_meaning: God will pass over the occupants when he sees the blood.
  reasoning_layer_used: The theological decision preserves the Passover verb and its debated nuance.
  rationale: Keeping “pass over” protects the key biblical connection while the footnote gives its possible effects.
- pob_phrase: no plague will be among you to destroy, when I strike the land of Egypt
  simplified_phrase: When I strike the land of Egypt, no plague will come among you to cause destruction
  preserved_meaning: The plague striking Egypt will not enter Israel’s midst with destructive effect.
  reasoning_layer_used: The lexical and theological decisions read “to destroy” verbally without requiring a personal agent.
  rationale: Reordering the clauses and adding “come” produces natural English without changing the promise.
