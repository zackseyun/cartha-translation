translation:
  language: en
  text: For seven days, no leaven[a] may be found in your homes. Anyone who eats anything made with leaven must be cut off from the community of Israel,[b] whether that person is a resident foreigner or a native of the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leaven is a substance, such as yeast or sourdough starter, that makes dough rise.
    reason: simplification_note
  - marker: b
    text: The Hebrew expression “cut off” may refer to exclusion, death, or divine judgment; its exact meaning here is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: no leaven is to be found in your houses
  simplified_phrase: no leaven may be found in your homes
  preserved_meaning: Leavening agent must not be present in Israelite dwellings during the seven days.
  reasoning_layer_used: lexical decisions for שְׂאֹר, לֹא יִמָּצֵא, and בְּבָתֵּיכֶם
  rationale: “May be found” states the prohibition naturally, while the note explains the retained ritual term.
- pob_phrase: anything leavened
  simplified_phrase: anything made with leaven
  preserved_meaning: The ban covers all food prepared with leaven, not only bread.
  reasoning_layer_used: lexical decision for מַחְמֶצֶת
  rationale: The expanded wording makes the category immediately understandable without narrowing it.
- pob_phrase: the congregation of Israel, whether a sojourner or a native of the land
  simplified_phrase: the community of Israel, whether that person is a resident foreigner or a native of the land
  preserved_meaning: The covenant penalty applies equally to non-native residents and native Israelites.
  reasoning_layer_used: lexical decisions for עֵדָה, גֵּר, and אֶזְרַח הָאָרֶץ
  rationale: “Community” and “resident foreigner” replace unfamiliar biblical terms while preserving the legal distinctions.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “cut off” means only expulsion.
    mitigation: The footnote preserves the documented possibilities of exclusion, death, or divine judgment.
