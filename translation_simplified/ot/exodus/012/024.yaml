  preserved_meaning: The observance is a fixed covenantal requirement, not merely a custom.
  reasoning_layer_used: Lexical decision for לְחָק
  rationale: “Law” preserves the binding force of “statute” in more familiar language.
- pob_phrase: for you and for your sons forever
  simplified_phrase: You and your sons ... forever
  preserved_meaning: The obligation continues for the addressed people and their sons without an stated endpoint.
  reasoning_layer_used: Lexical and theological decisions for לְךָ וּלְבָנֶיךָ and עַד עוֹלָם
  rationale: Making both groups the subject removes awkward wording while retaining “sons” and “forever.”
