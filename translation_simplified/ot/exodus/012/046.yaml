translation:
  language: en
  text: Eat it in one house.[a] Do not carry any of its meat outside the house, and do not break any of its bones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “within one household.” The Hebrew can refer either to the house itself or to the household gathered there.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It shall be eaten in one house
  simplified_phrase: Eat it in one house
  preserved_meaning: The Passover animal must be eaten within a single house.
  reasoning_layer_used: POB lexical decision for יֵאָכֵל and בְּבַיִת אֶחָד
  rationale: The direct command is easier to read while retaining the binding instruction.
- pob_phrase: you shall not take any of the meat outside the house
  simplified_phrase: Do not carry any of its meat outside the house
  preserved_meaning: None of the animal’s meat may be removed from the house.
  reasoning_layer_used: POB lexical decisions for לֹא תוֹצִיא, מִן הַבָּשָׂר, and חוּצָה
  rationale: “Carry” clearly expresses physically moving the meat outdoors.
- pob_phrase: you shall not break a bone of it
  simplified_phrase: do not break any of its bones
  preserved_meaning: No bone of the Passover animal may be broken.
  reasoning_layer_used: POB lexical and theological decisions for וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  rationale: The plural wording naturally conveys the Hebrew collective sense without naming the animal more specifically.
