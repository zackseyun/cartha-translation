translation:
  language: en
  text: If a foreigner lives among you and wants to celebrate the Passover in honor of Yahweh,[a] every male in his household must be circumcised. Then he may take part. For this observance, he will be treated like someone born in the land. But no uncircumcised person may eat the Passover meal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the divine name often represented in English by “the LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: a sojourner resides with you
  simplified_phrase: a foreigner lives among you
  preserved_meaning: A non-native is living as part of the community, not merely visiting.
  reasoning_layer_used: Lexical decision for גֵּר and יָגוּר אִתְּךָ
  rationale: Common words replace the unfamiliar legal term while retaining settled residence.
- pob_phrase: keeps the Passover to Yahweh
  simplified_phrase: wants to celebrate the Passover in honor of Yahweh
  preserved_meaning: The foreigner intends to observe the Passover as an act dedicated to Yahweh.
  reasoning_layer_used: Lexical decisions for וְעָשָׂה פֶסַח and לַיהוָה
  rationale: “Celebrate” and “in honor of” clearly express ritual observance and dedication.
- pob_phrase: then he may come near to keep it
  simplified_phrase: Then he may take part
  preserved_meaning: After the circumcision requirement is met, he is permitted to participate.
  reasoning_layer_used: Lexical decision for וְאָז יִקְרַב and theological participation decision
  rationale: The direct wording prevents readers from mistaking authorized participation for physical movement.
interpretive_expansions:
- pob_phrase: he shall be like a native of the land
  rendering: For this observance, he will be treated like someone born in the land.
  claim: The comparison concerns his standing for Passover participation rather than an unlimited change of social status.
  evidence:
  - The immediate context regulates eligibility to observe and eat the Passover.
  - The POB theological decision limits the comparison to this observance.
  confidence: high
  alternatives_preserved:
  - The wording does not define his status in other areas of Israelite law.
- pob_phrase: may eat of it
  rendering: may eat the Passover meal
  claim: The pronoun refers to eating the Passover observance or meal.
  evidence:
  - Passover is the stated rite throughout the verse.
  - The POB lexical rationale identifies the clause as permitted participation in the meal.
  confidence: high
  alternatives_preserved:
  - The wording does not specify a particular part of the meal.
translation_notes:
  risk_flags:
  - risk: “Household” may sound narrower than the Hebrew phrase for every male belonging to him.
    mitigation: The term is used in its broad family-and-dependent sense and retains the requirement for every male.
  - risk: “In honor of” is less formally directional than “to Yahweh.”
    mitigation: It preserves that the observance is dedicated to Yahweh without suggesting physical direction.
