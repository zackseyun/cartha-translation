  simplified_phrase: I will strike every firstborn there, among both people and animals
  preserved_meaning: Every firstborn throughout Egypt is included, human and animal alike.
  reasoning_layer_used: POB lexical decisions for כָּל בְּכוֹר and מֵאָדָם וְעַד בְּהֵמָה
  rationale: The clearer wording preserves the full human-to-animal range without adding that the firstborn were male.
- pob_phrase: against all the gods of Egypt I will execute judgments
  simplified_phrase: I will also bring judgment on all the gods of Egypt
  preserved_meaning: Yahweh directs judicial action against Egypt's gods.
  reasoning_layer_used: POB lexical and theological decisions for אֱלֹהֵי מִצְרַיִם and אֶעֱשֶׂה שְׁפָטִים
  rationale: “Bring judgment on” expresses the judicial force in more familiar English while retaining the gods as its targets.
- pob_phrase: For I will pass through the land of Egypt on this night
