translation:
  language: en
  text: For on this night I will pass through[a] the land of Egypt. I will strike every firstborn there, among both people and animals. I will also bring judgment on all the gods of Egypt. I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means going through the land, not passing over it to spare it.
    reason: lexical_alternative
