  preserved_meaning: Yahweh will move through Egypt during that specific night.
  reasoning_layer_used: POB lexical decisions for וְעָבַרְתִּי and בַּלַּיְלָה הַזֶּה
  rationale: The reordered clause reads naturally while the footnote guards against confusing “pass through” with sparing.
