- pob_phrase: shall be for you as a memorial
  simplified_phrase: will be a day of remembrance for you
  preserved_meaning: The day is to keep the event in Israel’s memory.
  reasoning_layer_used: Lexical decision for לְזִכָּרוֹן
  rationale: “Day of remembrance” makes the commemorative purpose clearer than the formal noun “memorial.”
- pob_phrase: throughout your generations
  simplified_phrase: for every generation to come
  preserved_meaning: The observance continues among successive generations of Israel.
  reasoning_layer_used: Lexical decision for לְדֹרֹתֵיכֶם
  rationale: The new wording expresses the Hebrew idiom in ordinary modern English.
- pob_phrase: a permanent statute
  simplified_phrase: a permanent command
  preserved_meaning: The festival is an enduring covenant requirement rather than a temporary practice.
  reasoning_layer_used: Lexical and theological decisions for חֻקַּת עוֹלָם
  rationale: “Command” communicates the binding legal force more readily than “statute.”
