  simplified_phrase: the blood on the top and the two sides of a doorway
  preserved_meaning: The blood marks the upper and side pieces of the doorframe.
  reasoning_layer_used: POB lexical decisions for הַמַּשְׁקוֹף and שְׁתֵּי הַמְּזוּזוֹת
  rationale: Common architectural wording replaces terms unfamiliar to many readers.
- pob_phrase: will not allow the destroyer to enter
  simplified_phrase: will not let the destroyer enter
  preserved_meaning: Yahweh restrains the distinct but unidentified agent of destruction.
  reasoning_layer_used: POB lexical and theological decisions on הַמַּשְׁחִית
  rationale: The shorter wording is natural while preserving the distinction between Yahweh and the destroyer.
- pob_phrase: Yahweh will pass over the doorway
  simplified_phrase: Yahweh will pass over that entrance
  preserved_meaning: The key Passover verb and Yahweh’s protective action remain intact.
  reasoning_layer_used: POB lexical and theological decisions on וּפָסַח
  rationale: “Pass over” is retained for its narrative importance, while “that entrance” clarifies the reference.
