translation:
  language: en
  text: Yahweh will pass through Egypt to strike it. When he sees the blood on the top and the two sides of a doorway, Yahweh will pass over that entrance.[a] He will not let the destroyer[b] enter your houses to strike you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb may also carry the sense “spare” or “protect,” but it is the verb associated with Passover.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify the destroyer; some understand this as an angelic agent of judgment.
    reason: alternative_reading
