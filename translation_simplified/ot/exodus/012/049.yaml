translation:
  language: en
  text: The same law applies to native members of the community and to foreigners living among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: One law shall be for
  simplified_phrase: The same law applies to
  preserved_meaning: A single legal standard governs both groups.
  reasoning_layer_used: Lexical decisions for תּוֹרָה, אַחַת, and יִהְיֶה
  rationale: This turns the formal legal wording into direct modern English while preserving its binding force.
- pob_phrase: the native
  simplified_phrase: native members of the community
  preserved_meaning: The law applies to indigenous members of Israel's community.
  reasoning_layer_used: Lexical decision for אֶזְרָח
  rationale: Adding “members of the community” clarifies that “native” describes people, not a place.
- pob_phrase: the sojourner who sojourns among you
  simplified_phrase: foreigners living among you
  preserved_meaning: The law also applies to non-native residents under the community's legal order.
  reasoning_layer_used: Lexical decisions for גֵּר, הַגָּר, and בְּתוֹכְכֶם
  rationale: This replaces the unfamiliar repeated term “sojourner” with clear language for a resident foreigner.
translation_notes:
  risk_flags:
  - risk: “Foreigners” alone could include visitors rather than residents.
    mitigation: The phrase “living among you” preserves the resident sense of גֵּר.
