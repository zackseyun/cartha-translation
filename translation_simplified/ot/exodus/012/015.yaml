translation:
  language: en
  text: For seven days you must eat bread made without leaven.[a] On the first day, remove all leaven from your homes. Anyone who eats anything leavened from the first day through the seventh day must be cut off from Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leaven is a fermenting agent that makes dough rise.
    reason: cultural_note
  - marker: b
    text: “Cut off” may mean expelled from the community, put to death, or removed by divine judgment; the verse does not specify which.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you shall eat unleavened bread
  simplified_phrase: you must eat bread made without leaven
  preserved_meaning: They are commanded to eat bread prepared without a fermenting agent.
  reasoning_layer_used: Lexical decision for מַצּוֹת
  rationale: The descriptive wording explains “unleavened” while preserving the ritual requirement.
- pob_phrase: But on the first day you shall remove leaven from your houses
  simplified_phrase: On the first day, remove all leaven from your homes
  preserved_meaning: Leaven must cease to be present in their dwellings on the first day.
  reasoning_layer_used: Lexical decisions for אַךְ, תַּשְׁבִּיתוּ, and שְּׂאֹר
  rationale: A direct command is easier to read, and “all” conveys complete removal without changing the scope.
- pob_phrase: that person shall be cut off from Israel
  simplified_phrase: must be cut off from Israel
  preserved_meaning: The offender faces the covenantal sanction expressed by the Hebrew legal idiom.
  reasoning_layer_used: Lexical and theological decisions for וְנִכְרְתָה
  rationale: The legal image remains in the text because its exact outcome is uncertain.
