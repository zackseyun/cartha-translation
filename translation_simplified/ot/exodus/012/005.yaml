translation:
  language: en
  text: Your Passover lamb must be a one-year-old male with no defect. You shall choose it from either the sheep or the goats.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “lamb” can mean a young sheep or a young goat.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall be without blemish
  simplified_phrase: must be ... with no defect
  preserved_meaning: The animal is required to be free from physical defect for sacrifice.
  reasoning_layer_used: Lexical decision for תָמִים and its sacrificial context
  rationale: Common wording preserves both the requirement and the sacrificial qualification.
- pob_phrase: a male a year old
  simplified_phrase: a one-year-old male
  preserved_meaning: The selected animal must be male and a year old.
  reasoning_layer_used: Lexical decisions for זָכָר and בֶּן שָׁנָה
  rationale: Natural English combines the age and sex qualifications without changing them.
- pob_phrase: you shall take it from the sheep or from the goats
  simplified_phrase: You shall choose it from either the sheep or the goats
  preserved_meaning: The animal must be selected from one of the two permitted groups.
  reasoning_layer_used: Lexical decisions for תִּקָּחוּ and the disjunctive source categories
  rationale: “Choose” makes the selection instruction clear, while “either” highlights the permitted alternatives.
