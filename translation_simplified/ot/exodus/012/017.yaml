  preserved_meaning: The words still command faithful ritual observance.
  reasoning_layer_used: The lexical decision identifies “observe” as a valid ritual-context rendering of the repeated Hebrew verb.
  rationale: “Must observe” states the obligation more naturally in modern English.
- pob_phrase: your hosts
  simplified_phrase: your organized companies
  preserved_meaning: Israel is pictured as an ordered body leaving Egypt.
  reasoning_layer_used: The lexical rationale preserves the military-organizational nuance of the Hebrew noun.
  rationale: “Organized companies” makes the older term “hosts” immediately understandable.
- pob_phrase: throughout your generations as a permanent statute
  simplified_phrase: in every generation as a permanent command
  preserved_meaning: The observance remains binding on successive generations.
  reasoning_layer_used: The lexical and theological decisions define the phrase as an enduring covenantal prescription.
  rationale: “Permanent command” replaces legal and covenantal wording that many modern readers may find opaque.
