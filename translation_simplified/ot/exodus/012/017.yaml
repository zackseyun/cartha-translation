translation:
  language: en
  text: You must observe the Feast of Unleavened Bread,[a] because on this very day I brought your organized companies out of the land of Egypt. You must observe this day in every generation as a permanent command.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can refer either to the unleavened bread itself or to the festival centered on it.
    reason: lexical_alternative
