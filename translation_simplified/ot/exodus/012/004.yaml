  simplified_phrase: if a household does not have enough people for one lamb
  preserved_meaning: The household has too few people for one Passover animal.
  reasoning_layer_used: POB lexical decision for יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  rationale: This states plainly that the household is too small because it has too few people.
- pob_phrase: he and his nearest neighbor shall take one
  simplified_phrase: it must join with its nearest neighbor and get one together
  preserved_meaning: The household and the closest neighboring household must obtain one animal jointly.
  reasoning_layer_used: POB lexical rationale for וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  rationale: The household subject avoids an unclear masculine pronoun while preserving the joint action.
- pob_phrase: according to the number of persons; each man according to what he can eat, you shall count for the lamb
  simplified_phrase: Count the people who will share it, allowing for how much each person can eat
  preserved_meaning: The count must account for both the participants and how much each can eat.
  reasoning_layer_used: POB lexical decisions for בְּמִכְסַת נְפָשֹׁת, אִישׁ, לְפִי אָכְלוֹ, and תָּכֹסּוּ עַל־הַשֶּׂה
  rationale: The direct command clarifies the accounting sense and avoids implying that only males are counted.
