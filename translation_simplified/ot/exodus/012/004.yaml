translation:
  language: en
  text: If a household does not have enough people for one lamb,[a] it must join with its nearest neighbor and get one together. Count the people who will share it, allowing for how much each person can eat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to an animal from the sheep or the goats.
    reason: lexical_alternative
