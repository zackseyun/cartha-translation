translation:
  language: en
  text: The Israelites did as Moses had told them. They asked the Egyptians for silver and gold objects and for clothing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew means “asked” or “requested,” not necessarily “borrowed.”
    reason: lexical_alternative
