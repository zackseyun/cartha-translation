translation:
  language: en
  text: And when the 430 years had ended, on that very day, all the organized groups belonging to Yahweh[a] left the land of Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “armies.” The Hebrew word refers to organized groups and can also mean armies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at the end of four hundred and thirty years
  simplified_phrase: when the 430 years had ended
  preserved_meaning: The full period of 430 years was completed.
  reasoning_layer_used: POB lexical decisions for מִקֵּץ and the Hebrew number phrase
  rationale: The time clause states the completed period in direct, natural English.
- pob_phrase: all the hosts of Yahweh
  simplified_phrase: all the organized groups belonging to Yahweh
  preserved_meaning: All Israel’s ordered divisions belonged to Yahweh and departed together.
  reasoning_layer_used: POB lexical and theological decisions for צִבְאוֹת יְהוָה
  rationale: “Organized groups” conveys ordered bodies of people without suggesting businesses or only combat troops.
- pob_phrase: went out from the land of Egypt
  simplified_phrase: left the land of Egypt
  preserved_meaning: They departed from Egypt as a land and nation.
  reasoning_layer_used: POB lexical decisions for יָצְאוּ and מֵאֶרֶץ מִצְרָיִם
  rationale: “Left” is ordinary English and retains the explicit reference to the land of Egypt.
