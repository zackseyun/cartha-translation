  preserved_meaning: The bitterness image still describes the Israelites’ whole experience of life.
  reasoning_layer_used: Lexical decision for וַיְמָרְרוּ and immediate context
  rationale: Naming both groups makes the pronouns clear without changing who acted or suffered.
- pob_phrase: with hard labor in mortar and bricks and in every kind of field work
  simplified_phrase: by forcing them to do hard labor in mortar and bricks and in every kind of field work
  preserved_meaning: The compulsory labor included mortar and brick work as well as every kind of field work.
  reasoning_layer_used: Lexical decisions for the labor, building, and field-work phrases
  rationale: Ordinary clause order clearly connects their bitter lives to the labor forced on them.
- pob_phrase: all their labor that they imposed on them with harshness
  simplified_phrase: They treated them harshly in all the work they forced them to do
  preserved_meaning: Every part of the imposed labor involved severe oppression.
