translation:
  language: en
  text: The Egyptians made the Israelites’ lives bitter by forcing them to do hard labor in mortar and bricks and in every kind of field work. They treated them harshly in all the work they forced them to do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ruthlessly.” The Hebrew describes severe, crushing oppression.
    reason: lexical_alternative
