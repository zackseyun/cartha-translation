translation:
  language: en
  text: A new king[a] rose to power over Egypt. He did not know[b] Yosef.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “another king.” The Hebrew literally says “new,” but it may imply a different dynasty or government.
    reason: lexical_alternative
  - marker: b
    text: Or “did not acknowledge.” This may mean that he did not recognize Yosef’s importance, not simply that he had never heard of him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: arose over Egypt
  simplified_phrase: rose to power over Egypt
  preserved_meaning: The king began ruling Egypt, while the image of rising and his authority over the land remain.
  reasoning_layer_used: Lexical decisions for וַיָּקָם and עַל מִצְרַיִם
  rationale: The familiar phrase “rose to power” makes the political sense immediately clear.
- pob_phrase: who did not know Yosef
  simplified_phrase: He did not know Yosef
  preserved_meaning: The text leaves open whether the king lacked knowledge of Yosef or refused to recognize his importance.
  reasoning_layer_used: Theological decision on the ambiguity of אֲשֶׁר לֹא יָדַע
  rationale: A separate sentence is easier to read without resolving the Hebrew ambiguity.
interpretive_expansions:
