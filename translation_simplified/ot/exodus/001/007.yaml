  reasoning_layer_used: POB lexical decision for וּבְנֵי יִשְׂרָאֵל
  rationale: “Descendants” makes the national family expression immediately clear to modern readers.
- pob_phrase: were fruitful and swarmed and multiplied and became exceedingly strong
  simplified_phrase: were fruitful. They swarmed and multiplied, and they grew extremely strong
  preserved_meaning: All four ideas remain distinct, including the blessing language and swarming image.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Shorter sentences clarify the rapid sequence without weakening its force.
- pob_phrase: became exceedingly strong
  simplified_phrase: grew extremely strong
  preserved_meaning: The people increased greatly in strength, likely including strength through numbers.
  reasoning_layer_used: POB lexical decision for וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  rationale: “Grew extremely strong” uses more familiar wording while retaining the doubled emphasis.
