translation:
  language: en
  text: But[a] Israel’s descendants were fruitful. They swarmed[b] and multiplied, and they grew extremely strong. The land was filled with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And.” “But” highlights the contrast with the death of Joseph’s generation.
    reason: alternative_reading
  - marker: b
    text: The Hebrew pictures the people increasing in teeming, swarming numbers.
    reason: lexical_alternative
