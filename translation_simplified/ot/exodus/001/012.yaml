  reasoning_layer_used: POB lexical and theological alternatives
  rationale: “Israelites” gives modern readers the intended collective sense without obscuring who is included.
- pob_phrase: the more they multiplied and the more they spread out, so that they dreaded
  simplified_phrase: the more the Israelites multiplied and spread out. So the Egyptians dreaded them
