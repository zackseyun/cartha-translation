translation:
  language: en
  text: 'Then Pharaoh gave this order to all his people: “You must throw every newborn boy into the Nile, but let every newborn girl live.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: commanded all his people, saying
  simplified_phrase: gave this order to all his people
  preserved_meaning: Pharaoh issued a binding command to the Egyptians under his authority.
  reasoning_layer_used: POB lexical decisions for וַיְצַו, לְכָל עַמּוֹ, and לֵאמֹר
  rationale: This recasts the formal quotation formula as natural modern English without weakening the royal command.
- pob_phrase: Every son who is born
  simplified_phrase: every newborn boy
  preserved_meaning: The decree targets every newly born male child.
  reasoning_layer_used: POB lexical alternatives for כָּל הַבֵּן and הַיִּלּוֹד
  rationale: “Newborn boy” is immediately clear while retaining the decree’s scope and starkness.
- pob_phrase: but every daughter you must let live
  simplified_phrase: but let every newborn girl live
  preserved_meaning: Female infants are contrasted with male infants and are not to be killed.
  reasoning_layer_used: POB lexical decisions for וְכָל הַבַּת and תְּחַיּוּן
  rationale: The shorter command preserves both the contrast and the instruction to allow the girls to live.
