translation:
  language: en
  text: He made the lampstand from pure gold, hammering it into shape as one complete piece. Its base, shaft, cups, buds[a], and blossoms were all formed from that same piece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “knobs.” These were raised decorations in the lampstand’s plant-like design.
    reason: lexical_alternative
