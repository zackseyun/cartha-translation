translation:
  language: en
  text: He overlaid both the inside and the outside with pure gold. Then he made a gold border[a] all around it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “gold molding” or “gold rim”; it describes decorative edging around the object.
    reason: lexical_alternative
