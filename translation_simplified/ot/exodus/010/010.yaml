translation:
  language: en
  text: He told them, “May Yahweh be with you—if I ever let you and your little ones go![a] Watch out, because evil is before you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “May Yahweh be with you when I let you and your little ones go,” probably said sarcastically.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may mean that disaster awaits them or that they have evil in mind.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: He told them
  preserved_meaning: He addressed Moses and Aaron directly.
  reasoning_layer_used: source syntax and immediate context
  rationale: The simpler opening preserves the same speech introduction.
- pob_phrase: if I ever send you and your little ones out
  simplified_phrase: if I ever let you and your little ones go
  preserved_meaning: Pharaoh sarcastically speaks of releasing them and their young children.
  reasoning_layer_used: lexical decision for שׁלח and טַף
  rationale: “Let go” is the natural modern expression for release while “little ones” keeps the narrower sense.
- pob_phrase: See, for evil is before your faces
  simplified_phrase: Watch out, because evil is before you
  preserved_meaning: Pharaoh gives a threatening warning without resolving what the evil refers to.
  reasoning_layer_used: lexical and theological ambiguity decisions
  rationale: “Watch out” makes the warning clear while the footnote preserves both possible meanings.
translation_notes:
  risk_flags:
  - risk: The sarcastic force could be missed as a sincere blessing.
    mitigation: “If I ever” and footnote a retain the hostile irony.
  - risk: Modern readers may take “evil is before you” in only one sense.
    mitigation: Footnote b states both documented interpretations without choosing between them.
