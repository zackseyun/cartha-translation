translation:
  language: en
  text: 'Moses and Aaron went to Pharaoh and told him, “This is what Yahweh, the God of the Hebrews, says: ‘How long will you keep refusing to humble yourself before me?[a] Let my people go so they can serve me.[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “submit to me.” The Hebrew can mean being humbled or humbling oneself before God.
    reason: lexical_alternative
  - marker: b
    text: Or “worship me.” Here, serving Yahweh includes worship.
    reason: lexical_alternative
