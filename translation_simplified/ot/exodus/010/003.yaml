  rationale: The simpler wording removes an awkward English court expression without changing the action.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: Moses and Aaron introduce Yahweh’s authoritative message.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The common English formula preserves the prophetic messenger force.
- pob_phrase: How long will you refuse
