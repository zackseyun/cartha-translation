translation:
  language: en
  text: Our livestock will go with us too. Not a single hoof will be left behind, because we must take some of them to serve Yahweh our God.[a] We do not yet know what we must use to serve Yahweh until we arrive there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “serve” can also mean “worship” in this context.
    reason: lexical_alternative
