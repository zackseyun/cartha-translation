translation:
  language: en
  text: But Yahweh hardened Pharaoh’s heart.[a] Pharaoh was unwilling to let the Israelites go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “made Pharaoh’s heart firm or strong,” but here it describes his hardened resolve.
    reason: lexical_alternative
