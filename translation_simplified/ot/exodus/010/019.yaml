translation:
  language: en
  text: Then Yahweh changed the wind, bringing a very strong wind from the sea.[a] It swept the locusts away and drove them into the Sea of Reeds.[b] Not a single locust was left anywhere in Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this setting, the Hebrew expression “wind from the sea” likely means a west wind.
    reason: lexical_alternative
  - marker: b
    text: The Sea of Reeds is traditionally called the Red Sea.
    reason: alternative_reading
