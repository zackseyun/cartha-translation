  preserved_meaning: The wind forcibly removed the locust swarm and sent it into the sea.
  reasoning_layer_used: lexical decisions for נשא and תקע
  rationale: “Swept away” clearly expresses how a strong wind carried off the locusts.
- pob_phrase: in all the territory of Egypt
