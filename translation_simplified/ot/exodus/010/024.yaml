translation:
  language: en
  text: Then Pharaoh called Moses and said, “Go and serve Yahweh. But leave your livestock behind. Even your children may go with you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: called to Moses
  simplified_phrase: called Moses
  preserved_meaning: Pharaoh called for Moses before speaking to him.
  reasoning_layer_used: Lexical decision for וַיִּקְרָא אֶל מֹשֶׁה.
  rationale: The shorter wording is natural English and keeps the narrative sense.
- pob_phrase: Only let your flocks and your herds remain behind
  simplified_phrase: But leave your livestock behind
  preserved_meaning: Pharaoh permitted the people to go but required their animals to stay behind.
  reasoning_layer_used: Lexical decisions for רַק, צֹאן, בָּקָר, and יֻצָּג.
  rationale: “Livestock” clearly covers both collectives without turning them into an exhaustive list.
- pob_phrase: your little ones
  simplified_phrase: your children
  preserved_meaning: The young members of the Israelite households could accompany them.
  reasoning_layer_used: Lexical decision for טַף.
  rationale: “Children” is the clearest common-English equivalent in this context.
translation_notes:
  risk_flags:
  - risk: “Livestock” combines the source’s separate categories of flocks and herds.
    mitigation: The combined term preserves Pharaoh’s demand that the people leave all their animals behind.
