translation:
  language: en
  text: Then Pharaoh’s servants said to him, “How much longer will this man be a trap for us? Send the men away so they can serve Yahweh their God. Do you still not realize that Egypt is ruined?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: How long will this man be a snare to us?
  simplified_phrase: How much longer will this man be a trap for us?
  preserved_meaning: Moses is pictured as a trap bringing continuing disaster on Pharaoh’s court and Egypt.
  reasoning_layer_used: Lexical decision for עַד מָתַי and לְמוֹקֵשׁ
  rationale: “How much longer” sharpens the impatient rebuke, while “trap” preserves the Hebrew image in common English.
- pob_phrase: Send the men away so that they may serve Yahweh their God.
  simplified_phrase: Send the men away so they can serve Yahweh their God.
  preserved_meaning: Pharaoh is urged to release the specifically named men for service to Yahweh.
  reasoning_layer_used: Lexical and theological decisions for הָאֲנָשִׁים, וְיַעַבְדוּ, and יְהוָה
  rationale: “So they can” states the purpose naturally while retaining “the men,” “serve,” and the divine name Yahweh.
- pob_phrase: Do you not yet know that Egypt is ruined?
  simplified_phrase: Do you still not realize that Egypt is ruined?
  preserved_meaning: The servants rebuke Pharaoh for failing to recognize Egypt’s existing devastation.
  reasoning_layer_used: Lexical decisions for הֲטֶרֶם תֵּדַע and אָבְדָה
  rationale: “Still not realize” makes the rebuke immediately clear without strengthening Egypt’s ruin into total destruction.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “the men” includes all the Israelites.
    mitigation: The wording retains the source’s specifically masculine plural rather than broadening it to “the people.”
