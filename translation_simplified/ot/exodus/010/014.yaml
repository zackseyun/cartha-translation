translation:
  language: en
  text: The locusts came up over all Egypt and settled everywhere in the country. The swarm was extremely severe.[a] There had never been a locust swarm like it, and there never would be another.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “very heavy,” describing how severe the locust invasion was.
    reason: lexical_alternative
