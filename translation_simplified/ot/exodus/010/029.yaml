simplification_decisions:
- pob_phrase: And Moses said
  simplified_phrase: Moses replied
  preserved_meaning: Moses speaks in direct response to Pharaoh.
  reasoning_layer_used: The narrative context and lexical alternatives allow a natural response verb.
  rationale: “Replied” makes the exchange clear without changing who speaks or why.
- pob_phrase: I will not again see your face
  simplified_phrase: I will never see your face again
  preserved_meaning: Moses says that seeing Pharaoh face-to-face will not happen again.
  reasoning_layer_used: The lexical decision identifies לֹא אֹסִף עוֹד as an idiom meaning “never again.”
  rationale: Natural English places “again” at the end and expresses the Hebrew idiom with “never.”
translation_notes:
  risk_flags:
  - risk: “As you have said” can express either agreement or acceptance of Pharaoh’s declared outcome.
    mitigation: The footnote preserves the stronger “So be it” alternative without resolving the ambiguity.
  - risk: “Never” may sound more emphatic than the POB main line’s “not again.”
    mitigation: The wording follows the audited lexical decision that treats the Hebrew construction as a “never again” idiom.
