translation:
  language: en
  text: Then Yahweh said to Moses, “Go into Pharaoh’s presence, because I have hardened his heart and the hearts of his servants.[a] I have done this so that I may place these signs of mine among them.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “I have made heavy his heart.” This means that Yahweh made Pharaoh and his servants unresponsive.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says, “in his midst.” This may refer to Pharaoh himself or to Pharaoh together with his servants and court.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Go in to Pharaoh
  simplified_phrase: Go into Pharaoh’s presence
  preserved_meaning: Moses is commanded to enter Pharaoh’s presence for another confrontation.
  reasoning_layer_used: POB lexical decision for בֹּא אֶל־פַּרְעֹה
  rationale: This makes the directional expression natural without flattening it to merely going toward Pharaoh.
- pob_phrase: his heart and the heart of his servants
  simplified_phrase: his heart and the hearts of his servants
  preserved_meaning: Yahweh directly hardens both Pharaoh and his servants in their inner will and response.
  reasoning_layer_used: POB lexical and theological decisions for לֵב and divine hardening
  rationale: The plural “hearts” is clearer English while preserving the direct attribution to Yahweh.
- pob_phrase: so that I may place these signs of mine among them
  simplified_phrase: I have done this so that I may place these signs of mine among them
  preserved_meaning: The hardening serves Yahweh’s stated purpose of placing his signs among Pharaoh’s circle.
  reasoning_layer_used: POB purpose-clause and sign-language decisions
  rationale: A new sentence makes the purpose relationship easier to follow without changing it.
translation_notes:
  risk_flags:
  - risk: “Into Pharaoh’s presence” is less formally literal than “go in to Pharaoh.”
    mitigation: It preserves the POB rationale that Moses must enter Pharaoh’s presence, not merely travel toward him.
  - risk: The referent of “among them” remains uncertain.
    mitigation: The footnote preserves both Pharaoh alone and Pharaoh with his court as possible senses.
