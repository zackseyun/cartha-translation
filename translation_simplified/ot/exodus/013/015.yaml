translation:
  language: en
  text: Pharaoh stubbornly refused to let us go. So Yahweh killed every firstborn in Egypt, both human and animal. That is why I sacrifice to Yahweh every male animal that is the first to come from its mother’s womb. But I redeem every firstborn son of mine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To redeem a firstborn son means to secure his release through the required substitute or payment.
    reason: simplification_note
