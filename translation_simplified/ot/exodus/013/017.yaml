  preserved_meaning: God did not take them on the route that crossed Philistine territory.
  reasoning_layer_used: POB lexical decision for דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  rationale: “Road through” makes the geographic route clear in ordinary English.
- pob_phrase: Lest the people change their minds when they see war
  simplified_phrase: If the people see war, they may change their minds
  preserved_meaning: God anticipated that seeing armed conflict might cause the people to reverse course.
  reasoning_layer_used: POB lexical decisions for פֶּן, יִנָּחֵם, and בִּרְאֹתָם מִלְחָמָה
