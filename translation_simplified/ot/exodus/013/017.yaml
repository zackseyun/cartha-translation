translation:
  language: en
  text: When Pharaoh let the people go, God did not lead them along the road through the land of the Philistines, even though that road was shorter.[a] God said, “If the people see war, they may change their minds[b] and return to Egypt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “because it was near.”
    reason: lexical_alternative
  - marker: b
    text: Or “regret it” or “relent.”
    reason: lexical_alternative
