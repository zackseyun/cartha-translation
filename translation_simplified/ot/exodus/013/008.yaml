translation:
  language: en
  text: On that day, tell your son, “This is why Yahweh acted for me when I came out of Egypt.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “I do this because of what Yahweh did for me when I came out of Egypt.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall tell your son on that day, saying
  simplified_phrase: On that day, tell your son
  preserved_meaning: A parent is commanded to tell his son at the appointed time.
  reasoning_layer_used: Lexical decisions for וְהִגַּדְתָּ, לְבִנְךָ, בַּיּוֹם הַהוּא, and לֵאמֹר
  rationale: A direct command removes the formal speech-introduction structure without losing its function.
- pob_phrase: It is because of this that
  simplified_phrase: This is why
  preserved_meaning: The statement presents “this” as the reason or basis for Yahweh’s action.
  reasoning_layer_used: Lexical decision for בַּעֲבוּר זֶה and POB footnote
  rationale: The shorter wording expresses the same causal link while the footnote preserves the alternate connection.
- pob_phrase: Yahweh acted for me when I came out of Egypt
  simplified_phrase: Yahweh acted for me when I came out of Egypt
  preserved_meaning: Yahweh intervened personally for the speaker during the exodus from Egypt.
  reasoning_layer_used: Lexical and theological decisions for עָשָׂה יְהוָה לִי and יְהוָה
  rationale: This wording is already clear and retains both the divine name and the broad sense of Yahweh’s action.
