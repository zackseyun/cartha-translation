translation:
  language: en
  text: 'Moses took Joseph’s bones with him. Joseph had made the sons of Israel swear a solemn oath: “God will surely act on your behalf,[a] and you must carry my bones up from here with you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “God will surely visit you.” This Hebrew expression means that God will decisively intervene for his people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because Joseph had made the sons of Israel solemnly swear, saying
  simplified_phrase: Joseph had made the sons of Israel swear a solemn oath
  preserved_meaning: Joseph required Israel’s sons to bind themselves emphatically by an oath.
  reasoning_layer_used: Lexical decision for הַשְׁבֵּעַ הִשְׁבִּיעַ and theological decision for בְּנֵי יִשְׂרָאֵל
  rationale: A new sentence and direct oath wording make the clause easier to follow while retaining its force and familial language.
- pob_phrase: God will surely attend to you
  simplified_phrase: God will surely act on your behalf
  preserved_meaning: God will certainly intervene for his people without specifying exactly how.
  reasoning_layer_used: Lexical and theological decisions for פָּקֹד יִפְקֹד
  rationale: “Act on your behalf” makes the promised intervention clearer than the potentially vague “attend to.”
- pob_phrase: you shall bring up my bones from here with you
  simplified_phrase: you must carry my bones up from here with you
  preserved_meaning: The oath obligates them to take Joseph’s literal bones with them when leaving Egypt.
  reasoning_layer_used: Lexical decisions for וְהַעֲלִיתֶם, עַצְמֹתַי, מִזֶּה, and אִתְּכֶם
  rationale: “Must carry” clearly expresses the obligation while “up” preserves the Hebrew direction.
