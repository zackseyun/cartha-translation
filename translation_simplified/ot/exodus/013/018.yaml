translation:
  language: en
  text: So God led the people on a roundabout route through the wilderness to the Sea of Reeds.[a] The sons of Israel left Egypt ready for battle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also traditionally called the Red Sea; the Hebrew name literally means “Sea of Reeds.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew word is uncertain; it may mean armed, equipped for battle, arranged for battle, or traveling in ordered ranks.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: led the people around by the way of the wilderness
  simplified_phrase: led the people on a roundabout route through the wilderness
  preserved_meaning: God deliberately led the people by an indirect wilderness route.
  reasoning_layer_used: Lexical decision for וַיַּסֵּב and דֶּרֶךְ הַמִּדְבָּר
  rationale: “Roundabout route” makes the indirect path clear in natural English.
- pob_phrase: went up from the land of Egypt
  simplified_phrase: left Egypt
  preserved_meaning: The sons of Israel departed from Egypt.
  reasoning_layer_used: Lexical decisions for עָלוּ and מֵאֶרֶץ מִצְרַיִם
  rationale: “Left Egypt” states the narrative action without an opaque directional idiom.
- pob_phrase: armed
  simplified_phrase: ready for battle
  preserved_meaning: The departing Israelites had some form of martial preparedness or order.
  reasoning_layer_used: Lexical decision and footnote for וַחֲמֻשִׁים
  rationale: “Ready for battle” avoids implying that the uncertain term must refer only to weapons.
translation_notes:
  risk_flags:
