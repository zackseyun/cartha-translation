  preserved_meaning: The command requires redemption rather than merely predicting it.
  reasoning_layer_used: POB lexical decision for תִּפְדֶּה
  rationale: “Must” makes the legal force clear in modern English while retaining “redeem.”
- pob_phrase: if you do not redeem it
  simplified_phrase: if you do not redeem the donkey
  preserved_meaning: The donkey is the animal whose neck must be broken if it is not redeemed.
  reasoning_layer_used: Immediate context and POB syntax
  rationale: Repeating “the donkey” removes an unclear pronoun without changing the command.
- pob_phrase: every firstborn of man among your sons
  simplified_phrase: every firstborn son
  preserved_meaning: Every firstborn human male child in the household must be redeemed.
  reasoning_layer_used: POB lexical and theological decisions for אָדָם and בְּבָנֶיךָ
  rationale: “Firstborn son” expresses the human-and-male reference directly in ordinary English.
