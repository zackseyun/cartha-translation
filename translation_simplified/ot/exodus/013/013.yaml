translation:
  language: en
  text: You must redeem every firstborn donkey with a lamb[a] in its place. If you do not redeem the donkey, you must break its neck. You must also redeem every firstborn son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer to a sheep or a goat; “lamb” fits this context.
    reason: lexical_alternative
