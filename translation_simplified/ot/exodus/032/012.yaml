translation:
  language: en
  text: Why should the Egyptians say, “He brought them out with evil intentions. He wanted to kill them in the mountains and wipe them off the face of the earth”? Turn away from your burning anger. Relent, and do not bring this threatened harm on your people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Relent” uses human-relational language for Moses’ plea that God turn from the threatened disaster.
    reason: simplification_note
simplification_decisions:
- pob_phrase: He brought them out with evil intent, to kill them
  simplified_phrase: He brought them out with evil intentions. He wanted to kill them
  preserved_meaning: The Egyptians would accuse God of bringing Israel out for a malicious purpose.
  reasoning_layer_used: Lexical decision for בְּרָעָה and the purpose infinitive
  rationale: Two direct sentences make the alleged motive and intended action easier to follow.
- pob_phrase: Turn from your burning anger
  simplified_phrase: Turn away from your burning anger
  preserved_meaning: Moses asks God to turn from his fierce course of anger.
  reasoning_layer_used: Lexical decisions for שׁוּב and מֵחֲרוֹן אַפֶּךָ
  rationale: “Turn away” is natural English while preserving the heat image of anger.
- pob_phrase: relent concerning the harm intended for your people
  simplified_phrase: Relent, and do not bring this threatened harm on your people
  preserved_meaning: Moses asks God to turn from the announced destructive action against Israel.
  reasoning_layer_used: Theological decisions for וְהִנָּחֵם and עַל הָרָעָה
  rationale: The recast clause explains “relent” without implying moral evil or error in God.
interpretive_expansions:
- pob_phrase: the harm intended for your people
  rendering: this threatened harm on your people
  claim: The harm is the destruction God has announced against Israel.
  evidence:
  - The immediate plea concerns God’s threatened judgment on his people.
  - The POB rationale identifies הָרָעָה as threatened calamity rather than moral evil.
  confidence: high
  alternatives_preserved:
  - disaster
  - calamity
translation_notes:
  risk_flags:
  - risk: “Do not bring” states the practical force of “relent concerning” more directly than the POB.
    mitigation: “Relent” remains, and “threatened” limits the wording to the announced judgment.
  - risk: Readers could take “relent” as implying that God had morally erred.
    mitigation: The footnote identifies this as human-relational language in Moses’ plea.
