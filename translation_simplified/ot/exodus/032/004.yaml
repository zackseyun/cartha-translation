translation:
  language: en
  text: He took the gold they handed him. Using an engraving tool[a], he shaped it into a calf cast from metal. Then they said[b], “These are your gods[c], Israel, who brought you up from the land of Egypt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of tool is uncertain; it may have been a stylus or chisel.
    reason: lexical_alternative
  - marker: b
    text: Some textual traditions read “he said.”
    reason: textual_variant
  - marker: c
    text: Hebrew has the plural “These are your gods”; it is also traditionally rendered “This is your god.”
    reason: alternative_reading
