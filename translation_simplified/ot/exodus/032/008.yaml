translation:
  language: en
  text: They have quickly left the way I commanded them to follow. They made a calf-shaped image for themselves by casting metal. They bowed down to it, offered sacrifices to it, and said, “These are your gods, Israel, who brought you up from the land of Egypt.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “This is your god, Israel.” The Hebrew literally says “These are your gods,” even though only one calf is in view.
    reason: alternative_reading
