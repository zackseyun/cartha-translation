  preserved_meaning: They abandoned the commanded course of obedience.
  reasoning_layer_used: Lexical decision for סָרוּ and הַדֶּרֶךְ
  rationale: “Left the way” keeps the path image while making the command’s relation to it clear.
- pob_phrase: a cast image of a calf
  simplified_phrase: a calf-shaped image ... by casting metal
  preserved_meaning: They manufactured a metal idol in the form of a calf for themselves.
  reasoning_layer_used: Lexical decision for עֵגֶל מַסֵּכָה and applied revisions
  rationale: The recast wording explains both the calf’s shape and the manufacturing process.
- pob_phrase: sacrificed to it
