translation:
  language: en
  text: Remember your servants Abraham, Isaac, and Israel.[a] You swore by yourself and told them, “I will make your offspring as numerous as the stars in the sky. I will give your offspring all this land I have spoken of, and they will inherit it forever.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel here is the patriarch Jacob’s covenant name; the Hebrew text reads “Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Abraham, Isaac, and Israel, your servants, to whom you swore by yourself and said to them
  simplified_phrase: your servants Abraham, Isaac, and Israel. You swore by yourself and told them
  preserved_meaning: The patriarchs remain God’s servants, and God’s self-attesting oath remains explicit.
  reasoning_layer_used: POB lexical and theological decisions on “your servants,” “Israel,” and “by yourself”
  rationale: Two direct sentences replace the dense relative clause without weakening the covenant appeal.
- pob_phrase: I will multiply your offspring like the stars of the heavens
  simplified_phrase: I will make your offspring as numerous as the stars in the sky
  preserved_meaning: God promises offspring too numerous to count, pictured by the stars.
  reasoning_layer_used: POB lexical decisions on רבה, זרע, and the star comparison
  rationale: Common wording makes the comparison immediately clear while preserving its image.
- pob_phrase: all this land that I have spoken of I will give to your offspring
  simplified_phrase: I will give your offspring all this land I have spoken of
  preserved_meaning: The land already identified by God is promised to the patriarchs’ offspring.
  reasoning_layer_used: Latest doctrine-realignment revision preserving the two Hebrew clauses
  rationale: Natural English word order improves readability without fusing what God spoke of with the act of giving.
translation_notes:
  risk_flags:
