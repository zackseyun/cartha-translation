translation:
  language: en
  text: Yahweh told Moses, “Whoever has sinned against me is the one I will erase from my book.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My book” may mean God's record of those under his care; some understand it more specifically as “the book of life.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And Yahweh said to Moses
  simplified_phrase: Yahweh told Moses
  preserved_meaning: Yahweh directly spoke these words to Moses as the narrative continued.
  reasoning_layer_used: Lexical decision for וַיֹּאמֶר and אֶל מֹשֶׁה
  rationale: “Told Moses” expresses the same speech event in smoother modern English.
- pob_phrase: I will blot him out of my book
  simplified_phrase: I will erase from my book
  preserved_meaning: Yahweh will remove the sinner from the divine record, pictured as erasing an entry.
  reasoning_layer_used: Lexical decisions for אֶמְחֶנּוּ and מִסִּפְרִי
  rationale: “Erase” makes the removal image immediately clear while retaining the metaphor of a book.
- pob_phrase: Whoever has sinned against me, I will blot him out
  simplified_phrase: Whoever has sinned against me is the one I will erase
  preserved_meaning: The person removed is the one personally guilty of sin against Yahweh.
  reasoning_layer_used: Lexical decisions for מִי אֲשֶׁר, חָטָא לִי, and the masculine singular suffix
  rationale: The recast sentence clarifies the link between personal guilt and removal without changing its force.
translation_notes:
  risk_flags:
  - risk: “Erase” may sound less traditional than “blot out.”
    mitigation: It is a documented lexical alternative and preserves the same written-record image.
  - risk: Readers may assume “my book” can only mean eternal salvation.
    mitigation: The footnote preserves the POB's broader range of possible meanings.
