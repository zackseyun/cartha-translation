translation:
  language: en
  text: The people saw that Moses was taking a long time to come down the mountain. So they gathered around Aaron and said, “Get up and make gods[a] for us that will go ahead of us. As for this Moses—the man who brought us out of Egypt—we do not know what has happened to him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a god for us that will go ahead of us.” The Hebrew noun and verb are plural, though the story soon focuses on one calf image.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When the people saw that Moses was taking a long time to come down from the mountain, the people gathered around Aaron
  simplified_phrase: The people saw that Moses was taking a long time to come down the mountain. So they gathered around Aaron
  preserved_meaning: The people reacted to what they saw as Moses’ long delay by assembling around Aaron.
  reasoning_layer_used: POB lexical decisions for בֹשֵׁשׁ, לָרֶדֶת, and וַיִּקָּהֵל ... עַל אַהֲרֹן
  rationale: Two sentences clarify the sequence while retaining the people’s perception and their pressure on Aaron.
- pob_phrase: gods for us that will go before us
  simplified_phrase: gods for us that will go ahead of us
  preserved_meaning: The requested gods are to travel in front of the people as their leaders.
  reasoning_layer_used: POB lexical and theological decisions for אֱלֹהִים and אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  rationale: The relative clause clearly makes the gods the subject while “go ahead” expresses the image naturally.
- pob_phrase: this Moses, the man who brought us up from the land of Egypt
  simplified_phrase: As for this Moses—the man who brought us out of Egypt
  preserved_meaning: The people refer dismissively to Moses as the man responsible for their departure from Egypt.
  reasoning_layer_used: POB lexical decisions for הָאִישׁ, הֶעֱלָנוּ, and מֵאֶרֶץ מִצְרַיִם
  rationale: The recast wording keeps their dismissive tone and states the exodus idiom in natural English.
translation_notes:
  risk_flags:
  - risk: Readers may expect a singular noun because the narrative later describes one calf.
    mitigation: The main text follows the plural Hebrew grammar, while the footnote preserves the singular alternative.
  - risk: “Brought us out” does not reproduce the Hebrew upward-motion wording literally.
    mitigation: It preserves the established exodus meaning in clear modern English.
