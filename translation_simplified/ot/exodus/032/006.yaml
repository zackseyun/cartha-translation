translation:
  language: en
  text: Early the next morning, they offered sacrifices that were completely burned and brought peace offerings.[a] Then the people sat down to eat and drink, and got up to celebrate wildly.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peace offerings were sacrifices associated with fellowship and a shared meal.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also mean “to play” or “to celebrate,” but here it suggests disorderly festivity.
    reason: lexical_alternative
