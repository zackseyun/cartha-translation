  language: en
  text: 'And he said to them, “This is what Yahweh, the God of Israel, says: Each man must strap his sword to his side. Go back and forth through the whole camp, from gate to gate. Each man must kill his brother, each man must kill his companion, and each man must kill his neighbor.[a]”'
