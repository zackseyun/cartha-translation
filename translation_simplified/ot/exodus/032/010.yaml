simplification_decisions:
- pob_phrase: Now leave me alone, so that my anger may burn against them and I may consume them
  simplified_phrase: Now leave me alone, so that my anger may burn against them and I may destroy them.
  preserved_meaning: God commands Moses to leave him alone so that his burning anger may bring the people to an end.
  reasoning_layer_used: POB syntax rationale and lexical decisions for וְיִחַר אַפִּי and וַאֲכַלֵּם
  rationale: “So that” preserves the purpose/result link, while “destroy” prevents “consume” from being mistaken for eating.
- pob_phrase: and I will make you into a great nation
  simplified_phrase: I will make you into a great nation.
  preserved_meaning: God promises to make Moses into a great people-group, retaining the covenantal echo.
  reasoning_layer_used: POB lexical decision for לְגוֹי גָּדוֹל
  rationale: A separate sentence makes the promise easier to follow without changing its relationship to the announced judgment.
