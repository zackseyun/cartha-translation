translation:
  language: en
  text: Moses stood at the camp gate and said, “Everyone who is on Yahweh’s side, come to me!” All the sons of Levi came and gathered with him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “sons of Levi” were the male members of the tribe of Levi, also called Levites.
    reason: cultural_note
simplification_decisions:
- pob_phrase: at the gate of the camp
  simplified_phrase: at the camp gate
  preserved_meaning: Moses stood at the camp’s gateway.
  reasoning_layer_used: POB lexical decision for בְּשַׁעַר הַמַּחֲנֶה
  rationale: The shorter wording remains natural while preserving the concrete gate image.
- pob_phrase: Whoever is for Yahweh
  simplified_phrase: Everyone who is on Yahweh’s side
  preserved_meaning: Moses called for those loyal to Yahweh to identify themselves.
  reasoning_layer_used: POB lexical decision for מִי לַיהוָה and theological decision for יְהוָה
  rationale: The familiar expression makes the allegiance sense clear while retaining Yahweh’s personal name.
- pob_phrase: gathered to him
  simplified_phrase: came and gathered with him
  preserved_meaning: The sons of Levi moved toward Moses and assembled with him.
  reasoning_layer_used: POB lexical decisions for וַיֵּאָסְפוּ and אֵלָיו
  rationale: Adding “came” expresses the movement already conveyed by “to him” in ordinary English.
