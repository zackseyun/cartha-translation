simplification_decisions:
- pob_phrase: And it happened on the next day that Moses said to the people
  simplified_phrase: The next day, Moses said to the people
  preserved_meaning: The next event occurs one day later, when Moses addresses the people.
  reasoning_layer_used: POB lexical decisions for וַיְהִי, מִמָּחֳרָת, and וַיֹּאמֶר
  rationale: The shorter opening preserves the narrative sequence without an awkward introductory clause.
- pob_phrase: You have sinned a great sin
  simplified_phrase: You have committed a very serious sin
  preserved_meaning: Moses strongly condemns the people's completed act as grave sin.
  reasoning_layer_used: POB lexical decision and footnote for חֲטָאתֶם חֲטָאָה גְדֹלָה
  rationale: Common wording conveys the Hebrew intensification, while the footnote preserves its repeated wording.
- pob_phrase: And now I will go up to Yahweh; perhaps I can make atonement for your sin
  simplified_phrase: Now I will go up to Yahweh. Perhaps I can make atonement for your sin.
  preserved_meaning: Moses intends to approach Yahweh on the mountain but remains uncertain whether he can make atonement.
  reasoning_layer_used: POB lexical and theological decisions for אֶעֱלֶה, יְהוָה, אוּלַי, and אֲכַפְּרָה
  rationale: Two sentences make Moses' plan and uncertainty easier to follow without resolving the tension.
