  simplified_phrase: This portion will belong to Aaron and his sons as a permanent rule for the Israelites
  preserved_meaning: The designated portion belongs to Aaron and his sons by an enduring requirement for Israel.
  reasoning_layer_used: POB lexical decisions for וְהָיָה and לְחָק עוֹלָם
  rationale: The rewrite identifies the implied portion and clearly keeps Israel subject to the rule.
- pob_phrase: for it is a contribution; it shall be a contribution from the Israelites
