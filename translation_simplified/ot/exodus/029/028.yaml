  preserved_meaning: The portion is classified as a contribution that Israel is required to provide.
  reasoning_layer_used: POB lexical decisions for תְרוּמָה and מֵאֵת בְּנֵי יִשְׂרָאֵל
  rationale: Two direct sentences preserve the repetition while making Israel’s role explicit.
- pob_phrase: from the sacrifices of their peace offerings, their contribution to Yahweh
  simplified_phrase: from the sacrifices of their peace offerings as their contribution to the LORD
  preserved_meaning: Israel provides the portion from peace-offering sacrifices and presents it to the LORD.
  reasoning_layer_used: POB lexical and theological decisions for שְׁלָמִים and YHWH
  rationale: The direct wording clarifies both the source and recipient of the contribution.
