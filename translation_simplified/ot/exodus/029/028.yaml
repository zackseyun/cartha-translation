translation:
  language: en
  text: This portion will belong to Aaron and his sons as a permanent rule for the Israelites. It is a contribution. The Israelites must give it from the sacrifices of their peace offerings[a] as their contribution to the LORD.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also called “fellowship offerings” or “offerings of well-being.” The Hebrew term includes the ideas of wholeness and restored relationship.
    reason: lexical_alternative
