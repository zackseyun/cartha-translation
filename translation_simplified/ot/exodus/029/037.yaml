translation:
  language: en
  text: For seven days, carry out the atonement rites for the altar and set it apart as holy. Then the altar will be most holy. Anything or anyone that touches it will become holy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean, “Only someone or something holy may touch the altar.”
    reason: alternative_reading
