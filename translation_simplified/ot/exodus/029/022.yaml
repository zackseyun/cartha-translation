translation:
  language: en
  text: 'Take these parts from the ram: its fat, its fat tail, the fat covering its internal organs, the lobe of its liver, both kidneys with the fat on them, and the right thigh. This is the ram for ordination.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the ram for consecration” or “the ram for installation.” This ram is used in the ceremony that installs the priests in their office.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall take from the ram
  simplified_phrase: Take these parts from the ram
  preserved_meaning: The wording remains a direct instruction to remove the listed portions from the ram.
  reasoning_layer_used: The lexical decision treats the Hebrew verb as a directive within a sequence of ritual instructions.
  rationale: A direct command is clearer in modern procedural English.
- pob_phrase: the fat that covers the entrails
  simplified_phrase: the fat covering its internal organs
  preserved_meaning: This is the layer of fat over the ram’s inner organs.
  reasoning_layer_used: The lexical alternatives identify the entrails as the internal organs.
  rationale: “Internal organs” is more immediately understandable than “entrails.”
- pob_phrase: for it is a ram of ordination
  simplified_phrase: This is the ram for ordination
  preserved_meaning: The ram is designated for the rite that installs the priests into office.
  reasoning_layer_used: The lexical and theological decisions retain “ordination” as the controlling ritual term.
  rationale: A separate sentence makes the ram’s purpose easier to grasp.
