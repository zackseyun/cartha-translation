translation:
  language: en
  text: Then slaughter the ram. Take some of its blood and put it on Aaron’s right earlobe,[a] on the right earlobes of his sons, on their right thumbs, and on their right big toes. Then throw the blood against every side of the altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer more generally to the tip of the ear, though “earlobe” is most likely here.
    reason: lexical_alternative
  - marker: b
    text: Or “dash the blood against every side of the altar.” The action is forceful, not a gentle sprinkling.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then you shall slaughter the ram, and take some of its blood
  simplified_phrase: Then slaughter the ram. Take some of its blood
  preserved_meaning: The ram is sacrificed before part of its blood is used in the ritual.
  reasoning_layer_used: Hebrew procedural sequence and lexical decisions
  rationale: Two direct sentences make the ordered instructions easier to follow.
- pob_phrase: the lobe of Aaron’s right ear ... the lobe of the right ear of his sons
  simplified_phrase: Aaron’s right earlobe ... the right earlobes of his sons
  preserved_meaning: Blood is applied to the specified part of each person’s right ear.
  reasoning_layer_used: POB lexical decision for תְּנוּךְ אֹזֶן
  rationale: “Earlobe” is the natural modern form, while the footnote preserves the lexical uncertainty.
- pob_phrase: throw the blood against the altar all around
  simplified_phrase: throw the blood against every side of the altar
  preserved_meaning: Blood is forcefully applied around the altar rather than gently sprinkled.
  reasoning_layer_used: POB lexical decisions for זָרַק and סָבִיב
  rationale: “Every side” makes the scope of “all around” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Every side” could be read as a geometric claim about the altar.
    mitigation: It is used idiomatically to preserve the Hebrew distributive sense of applying blood all around it.
