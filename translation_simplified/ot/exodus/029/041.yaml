translation:
  language: en
  text: Offer the second lamb at twilight.[a] Offer it with the same grain offering and drink offering as in the morning. This sacrifice will be a food offering to Yahweh, with a pleasing aroma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally means “between the evenings,” referring to late afternoon or twilight.
    reason: lexical_alternative
  - marker: b
    text: “Food offering” may also be translated “offering by fire.”
    reason: lexical_alternative
