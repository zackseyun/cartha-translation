translation:
  language: en
  text: Put all of them in one basket. Then bring them forward in the basket, together with the bull and the two rams.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bring forward” translates the standard sacrificial expression “bring near”; it does not yet specify the act of offering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall put them into one basket
  simplified_phrase: Put all of them in one basket
  preserved_meaning: The bread items from the previous verse are placed together in a single basket.
  reasoning_layer_used: POB lexical decisions for וְנָתַתָּ, אוֹתָם, and עַל סַל אֶחָד
  rationale: A direct command is clearer than the formal wording “you shall.”
- pob_phrase: you shall bring them near in the basket
  simplified_phrase: Then bring them forward in the basket
  preserved_meaning: The bread items themselves are brought forward while still contained in the basket.
  reasoning_layer_used: POB lexical decisions for וְהִקְרַבְתָּ and בַּסָּל
  rationale: This keeps the items as the object while expressing the ritual movement naturally.
- pob_phrase: along with the bull and the two rams
  simplified_phrase: together with the bull and the two rams
  preserved_meaning: The animals are also brought forward with the basketed bread.
  reasoning_layer_used: POB lexical decision for וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  rationale: “Together with” states the coordinated action in common English.
