  text: This burnt offering must be presented regularly, generation after generation, at the entrance to the tent of meeting before Yahweh. There I will meet with you in order to speak to you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, “meet with you” addresses a group, while “speak to you” addresses one person, likely Moses.
    reason: source_note
