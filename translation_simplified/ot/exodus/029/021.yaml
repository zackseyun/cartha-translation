translation:
  language: en
  text: Then take some of the blood on the altar and some of the anointing oil. Sprinkle them on Aaron, his garments, his sons who are with him, and their garments. Aaron and his garments, together with his sons and their garments, will be holy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be consecrated.” The Hebrew literally says “will be holy,” describing their status after this ritual.
    reason: lexical_alternative
