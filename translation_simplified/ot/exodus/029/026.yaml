translation:
  language: en
  text: Take the breast of the ram being used to ordain Aaron as priest.[a] Wave it before Yahweh as a wave offering. It will then be your assigned share.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “consecrate Aaron as priest.” The Hebrew term refers to installing him in the priestly office.
    reason: lexical_alternative
