translation:
  language: en
  text: 'Then take the garments and dress Aaron in them: the tunic, the robe worn under the ephod, the ephod[a], and the breastpiece.[b] Skillfully fasten the ephod on him with its woven band.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ephod was a special priestly garment with no exact English equivalent.
    reason: cultural_note
  - marker: b
    text: Traditionally “breastplate”; the Hebrew refers to an ornamental chest piece rather than armor.
    reason: lexical_alternative
  - marker: c
    text: The rare Hebrew verb may also mean to gird him with the ephod.
    reason: lexical_alternative
