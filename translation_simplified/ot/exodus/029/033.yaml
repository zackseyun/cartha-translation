translation:
  language: en
  text: The priests must eat the food through which atonement was made for them, to ordain them[a] and set them apart as holy. Anyone outside the authorized priestly group must not eat it, because it is holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally means “fill their hand,” an idiom for installing priests in their office.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They shall eat those things
  simplified_phrase: The priests must eat the food
  preserved_meaning: The priests being ordained are required to eat the sacrificial portions mentioned in the preceding context.
  reasoning_layer_used: POB lexical decisions and immediate ritual context
  rationale: “Food” names the portions naturally, while “must” preserves the command’s force.
- pob_phrase: to ordain them and to consecrate them
  simplified_phrase: to ordain them and set them apart as holy
  preserved_meaning: The atonement serves their priestly installation and consecration without making eating itself the consecrating act.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording explains “consecrate” while preserving ordination as a distinct idea.
- pob_phrase: but an outsider shall not eat them
  simplified_phrase: Anyone outside the authorized priestly group must not eat it
  preserved_meaning: Anyone unauthorized to participate in the priestly rite is forbidden to eat the holy food.
  reasoning_layer_used: POB lexical decision and cultural footnote
  rationale: This prevents “outsider” from being mistaken for an ethnic foreigner.
