translation:
  language: en
  text: Each day, offer a bull as a sin offering[a] to make atonement. As you make atonement for the altar, purify it. Anoint it with oil and set it apart as holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a purification offering.” The Hebrew term can refer to an offering that purifies from sin or ritual impurity.
