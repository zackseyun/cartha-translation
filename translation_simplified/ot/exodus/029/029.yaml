translation:
  language: en
  text: Aaron’s holy garments will pass to his sons after him. They will wear the garments when they are anointed and when each son’s hand is filled to install him as a priest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His hand is filled” is a Hebrew ritual expression for installing someone as a priest.
    reason: lexical_alternative
