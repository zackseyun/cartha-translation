translation:
  language: en
  text: Set apart as holy the breast of the wave offering and the thigh of the contribution offering—the breast that was waved and the thigh that was raised. Take them from the ram used for ordination, from the portion belonging to Aaron and from the portion belonging to his sons.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall consecrate
  simplified_phrase: Set apart as holy
  preserved_meaning: The portions are designated as holy for sacred use.
  reasoning_layer_used: Lexical decision for קִדַּשְׁתָּ
  rationale: This explains “consecrate” while preserving its sacred force.
- pob_phrase: which was waved and which was raised
  simplified_phrase: the breast that was waved and the thigh that was raised
  preserved_meaning: The breast remains linked to waving and the thigh to raising.
  reasoning_layer_used: Theological decision on sacrificial terminology
  rationale: Naming each portion again prevents the two ritual actions from being merged.
- pob_phrase: from the ram of ordination, from what was Aaron's and from what was his sons'
  simplified_phrase: Take them from the ram used for ordination, from the portion belonging to Aaron and from the portion belonging to his sons
  preserved_meaning: The selected parts come from the ordination ram and retain the distinct allocations to Aaron and his sons.
  reasoning_layer_used: Lexical decisions for אֵיל הַמִּלֻּאִים and מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  rationale: A direct command clarifies the repeated “from” construction while preserving its distributive sense.
translation_notes:
  risk_flags:
  - risk: Readers may not know the full rituals behind wave and contribution offerings.
    mitigation: The text retains both offering names and explicitly links each portion to its distinct ritual action.
