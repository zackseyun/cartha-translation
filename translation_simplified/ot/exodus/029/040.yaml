translation:
  language: en
  text: With the first lamb,[b] offer one-tenth of an ephah of fine flour mixed with one-quarter of a hin of oil made from beaten olives. Also offer one-quarter of a hin of wine as a drink offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah and a hin were ancient measures; the Hebrew specifies one-tenth of an ephah of flour and one-quarter of a hin each of oil and wine.
    reason: cultural_note
  - marker: b
    text: The Hebrew says “the one lamb,” which could mean “one lamb”; in context, it likely points to the first of the two daily lambs.
    reason: alternative_reading
