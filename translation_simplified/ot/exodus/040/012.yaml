- pob_phrase: bring Aaron and his sons near
  simplified_phrase: have Aaron and his sons come forward
  preserved_meaning: Moses is to cause Aaron and his sons to approach the sacred tent.
  reasoning_layer_used: The lexical decision for the Hiphil of קרב preserves both causation and ritual approach.
  rationale: “Have ... come forward” expresses the command naturally while retaining the sense of bringing them near.
- pob_phrase: and wash them with water
  simplified_phrase: Wash them with water.
  preserved_meaning: Aaron and his sons are all to be washed, using water.
  reasoning_layer_used: The lexical decisions retain רחץ as “wash,” אֹתָם as referring to the whole group, and ב as instrumental.
  rationale: A separate sentence makes the second command easier to follow without merging it with the first.
