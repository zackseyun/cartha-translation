translation:
  language: en
  text: Then he put the testimony inside the ark.[a] He put the carrying poles in place on the ark. Finally, he placed the mercy seat, the ark’s sacred cover, on top.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The testimony” is the Hebrew term for what was placed in the ark, likely the stone tablets.
    reason: lexical_alternative
  - marker: b
    text: The mercy seat may also be called “the atonement cover.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: took the testimony and put it into the ark
  simplified_phrase: put the testimony inside the ark
  preserved_meaning: He physically placed the covenant testimony within the ark.
  reasoning_layer_used: Lexical decision for וַיִּתֵּן ... אֶל and theological decision on the testimony
  rationale: The shorter wording keeps the physical action without identifying the testimony more narrowly than the Hebrew does.
- pob_phrase: set the poles on the ark
  simplified_phrase: put the carrying poles in place on the ark
  preserved_meaning: He positioned the poles used to carry the ark.
  reasoning_layer_used: Lexical decision for הַבַּדִּים and וַיָּשֶׂם ... עַל
  rationale: The added function makes “poles” immediately understandable while preserving their placement.
- pob_phrase: placed the mercy seat on the ark above
  simplified_phrase: placed the mercy seat, the ark’s sacred cover, on top
  preserved_meaning: He placed the specific sacred cover on the upper side of the ark.
  reasoning_layer_used: Lexical and theological decisions for הַכַּפֹּרֶת and מִלְמָעְלָה
  rationale: The appositive explains the retained theological term, and “on top” states the spatial relation naturally.
