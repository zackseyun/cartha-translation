  preserved_meaning: God directly commands Moses to erect the structure.
  reasoning_layer_used: Lexical decision for תָּקִים
  rationale: A direct English command is clearer and keeps the force of the Hebrew instruction.
- pob_phrase: the tabernacle, the tent of meeting
  simplified_phrase: the tabernacle—the sacred tent of meeting
  preserved_meaning: Both expressions identify the same portable sanctuary from complementary angles.
  reasoning_layer_used: Theological decision on the relationship between מִשְׁכַּן and אֹהֶל מוֹעֵד
  rationale: The dash makes the apposition clear while retaining both established sanctuary terms.
