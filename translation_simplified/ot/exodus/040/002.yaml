translation:
  language: en
  text: On the first day of the first month, set up the tabernacle—the sacred tent of meeting.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the tabernacle of the tent of meeting.” The Hebrew can express the relationship between these two sanctuary terms in either way.
    reason: alternative_reading
