translation:
  language: en
  text: Place the golden altar used for incense in front of the ark of the testimony.[a] Then put the screen in place at the entrance to the tabernacle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the ark of the testimony”; traditionally, “the ark of the covenant.”
    reason: alternative_reading
  - marker: b
    text: Here “screen” means a hanging that covered the entrance.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And you shall place
  simplified_phrase: Place
  preserved_meaning: God commands Moses to position the altar.
  reasoning_layer_used: POB lexical decision for וְנָתַתָּה
  rationale: A direct command is clearer than the formal future construction.
- pob_phrase: the golden altar for incense
  simplified_phrase: the golden altar used for incense
  preserved_meaning: The altar is designated for incense.
  reasoning_layer_used: POB lexical rationale for לִקְטֹרֶת
  rationale: “Used for” makes the altar’s function immediately clear.
- pob_phrase: and you shall set the screen for the entrance of the tabernacle
  simplified_phrase: Then put the screen in place at the entrance to the tabernacle
  preserved_meaning: Moses must position the entrance screen at the tabernacle.
  reasoning_layer_used: POB lexical decisions for וְשַׂמְתָּ, מָסַךְ, and הַפֶּתַח
  rationale: The new clause uses ordinary word order while keeping “screen” distinct from the inner veil.
translation_notes:
  risk_flags:
  - risk: “Ark of the testimony” may be unfamiliar to readers who expect “ark of the covenant.”
    mitigation: The source-precise title remains in the text, with the traditional title in a footnote.
  - risk: Modern readers may mistake “screen” for a rigid partition.
    mitigation: A footnote identifies it as an entrance hanging.
