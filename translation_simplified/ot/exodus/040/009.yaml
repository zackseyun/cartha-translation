translation:
  language: en
  text: Then take the anointing oil and use it to anoint the tabernacle and everything in it. Set the tabernacle and all its furnishings apart as holy. Then the tabernacle will be holy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: anoint the tabernacle and all that is in it
  simplified_phrase: use it to anoint the tabernacle and everything in it
  preserved_meaning: The oil is applied to the entire sanctuary and its contents for sacred designation.
  reasoning_layer_used: POB lexical decisions for משׁח and כָּל אֲשֶׁר בּוֹ
  rationale: Adding “use it” makes the oil’s role clear while preserving the command to anoint.
- pob_phrase: you shall consecrate it
  simplified_phrase: Set the tabernacle ... apart as holy
  preserved_meaning: The tabernacle is dedicated to sacred use.
  reasoning_layer_used: POB lexical and theological decisions for קדשׁ
  rationale: The plain phrase explains the less familiar cultic term “consecrate.”
- pob_phrase: and it shall be holy
  simplified_phrase: Then the tabernacle will be holy
  preserved_meaning: Consecration results in the tabernacle’s holy status without implying “most holy.”
  reasoning_layer_used: POB theological decision on קֹדֶשׁ
  rationale: Naming the tabernacle removes an unclear pronoun while retaining the stated result.
