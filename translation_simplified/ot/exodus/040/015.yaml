translation:
  language: en
  text: Anoint them just as you anointed their father, so they may serve me as priests. Their anointing will give them an everlasting priesthood throughout their generations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a perpetual priesthood.” Here “everlasting” describes enduring continuity from generation to generation within the covenant.
    reason: lexical_alternative
