translation:
  language: en
  text: Put the ark of the testimony[a] there. Then use the inner curtain[b] to screen off the ark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some English translations say “ark of the covenant,” but the Hebrew here says “ark of the testimony.”
