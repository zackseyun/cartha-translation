simplification_decisions:
- pob_phrase: Then I will remove my hand
  simplified_phrase: Then I will take my hand away.
  preserved_meaning: God withdraws the hand that covered Moses.
  reasoning_layer_used: Lexical decision for וַהֲסִרֹתִי and the anthropomorphic-language decision.
  rationale: “Take my hand away” is natural English and keeps the concrete image.
- pob_phrase: and you will see my back
  simplified_phrase: You will see my back
  preserved_meaning: Moses will see God’s back or rearward aspect.
  reasoning_layer_used: Lexical decision for אֲחֹרַי and its documented alternative.
  rationale: A new sentence makes the sequence easier to follow without resolving the image.
- pob_phrase: but my face shall not be seen
  simplified_phrase: but my face will not be seen
  preserved_meaning: God’s face remains unseen in contrast to his back.
  reasoning_layer_used: Lexical decision identifying לֹא יֵרָאוּ as a passive future.
  rationale: “Will” is clearer modern English while preserving the passive statement.
translation_notes:
  risk_flags:
