simplification_decisions:
- pob_phrase: And whenever Moses went out to the tent
  simplified_phrase: Whenever Moses went out to the tent
  preserved_meaning: Moses repeatedly went out to the tent.
  reasoning_layer_used: The lexical decision for וְהָיָה identifies a customary, repeated circumstance.
  rationale: Dropping the opening “And” makes the sentence begin naturally without changing its repeated-time setting.
- pob_phrase: all the people would rise and stand, each man at the entrance of his tent
  simplified_phrase: all the people got up. Each man stood at the entrance of his own tent
  preserved_meaning: On each occasion, every man rose and remained standing at his tent entrance.
  reasoning_layer_used: The lexical decisions preserve the customary actions and the distributive masculine אִישׁ.
  rationale: Two short sentences clarify the sequence while retaining both getting up and standing.
- pob_phrase: they would watch after Moses until he entered the tent
  simplified_phrase: watched Moses until he entered the tent
  preserved_meaning: They followed Moses with their eyes until he went inside.
  reasoning_layer_used: The lexical rationale explains that the Hebrew idiom describes watching Moses as he moved away, not pursuing him.
  rationale: Removing the awkward English phrase “watch after” expresses the documented idiomatic sense directly.
