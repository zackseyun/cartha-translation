translation:
  language: en
  text: 'Then Yahweh[a] said to Moses, “Go up from here. You and the people you brought up from Egypt must go to the land that I swore to give to Abraham, Isaac, and Jacob: ‘I will give this land to your offspring[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “YHWH”; traditionally rendered “the LORD.”'
    reason: alternative_reading
  - marker: b
    text: Or “descendants.” The Hebrew word is singular in form but can refer collectively to many descendants.
    reason: lexical_alternative
