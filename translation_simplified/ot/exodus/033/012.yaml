translation:
  language: en
  text: Then Moses said to Yahweh, “Look, you tell me, ‘Lead this people on,’ but you have not told me who you will send with me. Yet you have said, ‘I know you by name,[a] and you have also found favor in my sight.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “I know you by name” expresses personal knowledge and favor.
    reason: cultural_note
simplification_decisions:
- pob_phrase: See, you are saying to me
  simplified_phrase: Look, you tell me
  preserved_meaning: Moses directly calls Yahweh’s attention to what he has commanded.
  reasoning_layer_used: Lexical decision for רְאֵה and contrastive clause analysis
  rationale: The rewrite keeps the appeal direct while using ordinary speech.
- pob_phrase: Bring up this people
  simplified_phrase: Lead this people on
  preserved_meaning: Moses is commanded to lead the people onward on their journey.
  reasoning_layer_used: Lexical decision for הַעַל and immediate Exodus journey context
  rationale: “Lead” preserves Moses’ assigned role, while “on” conveys continued movement.
- pob_phrase: you have not made known to me whom you will send with me
  simplified_phrase: you have not told me who you will send with me
  preserved_meaning: Yahweh has not identified the person who will accompany Moses.
  reasoning_layer_used: Lexical decisions for הוֹדַעְתַּנִי and אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  rationale: “Told me” and “who” convey the same meaning in common English.
translation_notes:
  risk_flags:
  - risk: “Lead this people on” expresses the journey context more directly than “bring up.”
    mitigation: It retains both Moses’ leadership role and the command’s directional force without naming a destination.
