simplification_decisions:
- pob_phrase: And whenever Moses entered the tent
  simplified_phrase: Whenever Moses went into the tent
  preserved_meaning: Moses repeatedly entered the previously identified tent.
  reasoning_layer_used: Lexical decisions for וְהָיָה and כְּבֹא
  rationale: The time clause conveys repeated action without the unnecessary opening “And.”
- pob_phrase: would descend and stand at the entrance of the tent
  simplified_phrase: would come down and stand at the tent’s entrance
  preserved_meaning: The pillar of cloud repeatedly descended and took its place at the opening.
  reasoning_layer_used: Lexical decisions for יֵרֵד, וְעָמַד, and פֶּתַח הָאֹהֶל
  rationale: Common wording preserves both the downward movement and the location.
- pob_phrase: and he would speak with Moses
  simplified_phrase: Then the LORD would speak with Moses
  preserved_meaning: The contextually identified LORD repeatedly spoke personally with Moses.
  reasoning_layer_used: POB footnote and theological decision on the implicit subject of וְדִבֶּר
  rationale: Naming the LORD prevents readers from mistaking the cloud pillar for the speaker.
