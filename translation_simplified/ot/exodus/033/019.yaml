- pob_phrase: make all my goodness pass before you
  simplified_phrase: make all my goodness pass in front of you
  preserved_meaning: God causes his goodness to pass visibly before Moses.
  reasoning_layer_used: Lexical decision for אַעֲבִיר and עַל־פָּנֶיךָ
  rationale: “In front of you” makes the spatial image immediately clear while retaining the causative action.
- pob_phrase: proclaim the name of Yahweh before you
  simplified_phrase: proclaim my name, Yahweh, there before you
  preserved_meaning: God declares his personal name and reveals his character in Moses’ presence.
  reasoning_layer_used: Lexical decisions for קרא בשם, יְהוָה, and לְפָנֶיךָ
  rationale: The apposition identifies Yahweh as God’s proclaimed name without replacing it with a title.
- pob_phrase: to whom I will be gracious ... to whom I will show mercy
  simplified_phrase: to those I will be gracious to ... to those I will show mercy to
  preserved_meaning: God freely grants grace and mercy, with emphatic repetition left intact.
  reasoning_layer_used: Lexical and theological decisions on the repeated grace and mercy formulas
  rationale: Common relative wording improves readability without resolving the statement’s theological tension.
