translation:
  language: en
  text: How, then, will it be clear that you favor me and your people? Is it not by going with us and thus setting me and your people apart[a] from every other people on earth?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “making me and your people distinct.” The Hebrew describes being marked out as extraordinary or separate from others.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will it be known that I have found favor in your sight
  simplified_phrase: will it be clear that you favor me
  preserved_meaning: God regards Moses favorably, and his presence makes that favor evident.
  reasoning_layer_used: lexical decision for the Hebrew favor idiom
  rationale: The direct wording expresses the Hebrew relational idiom in natural modern English.
- pob_phrase: by your going with us, so that I and your people are distinguished
  simplified_phrase: by going with us and thus setting me and your people apart
  preserved_meaning: God’s presence is what makes Moses and Israel distinct from other peoples.
  reasoning_layer_used: lexical and theological decisions on Israel’s distinctiveness
  rationale: The result word “thus” keeps God’s presence as the cause of their distinction.
- pob_phrase: every people who are on the face of the earth
  simplified_phrase: every other people on earth
  preserved_meaning: The comparison includes all peoples throughout the world.
  reasoning_layer_used: lexical decisions for the collective noun and Hebrew earth idiom
  rationale: This removes an unfamiliar idiom while retaining the global comparison.
translation_notes:
  risk_flags:
  - risk: “Setting apart” may sound like mere physical separation.
