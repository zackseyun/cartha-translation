  preserved_meaning: Moses customarily returned to Israel’s camp after speaking with Yahweh.
  reasoning_layer_used: Lexical decision for וְשָׁב and narrative context
  rationale: Naming Moses removes an unclear pronoun while retaining the repeated action.
- pob_phrase: his attendant
  simplified_phrase: his assistant
  preserved_meaning: Joshua served Moses in a supporting role.
  reasoning_layer_used: Lexical decision for וּמְשָׁרְתּוֹ
  rationale: “Assistant” communicates the role more readily without suggesting domestic servitude.
- pob_phrase: would not depart from the midst of the tent
  simplified_phrase: would stay inside the tent of meeting
  preserved_meaning: Joshua customarily remained within the tent when Moses returned to camp.
  reasoning_layer_used: Lexical decisions for לֹא יָמִישׁ and מִתּוֹךְ הָאֹהֶל
  rationale: The positive wording and ordinary location phrase express the same action more naturally.
