translation:
  language: en
  text: Yahweh would speak with Moses face to face,[a] as a man speaks with his friend. Afterward, Moses would return to the camp. But his assistant, Joshua son of Nun, a young man, would stay inside the tent of meeting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “directly” or “personally.” “Face to face” describes an unusually direct encounter.
    reason: lexical_alternative
