translation:
  language: en
  text: Yahweh said to Moses, “Tell the Israelites, ‘You are a stiff-necked people—stubborn and rebellious. If I went up among you, even for a single moment, I would consume you. Now take off the ornaments you are wearing. Then I will know what I should do with you.’”
