translation:
  language: en
  text: As my glory passes by, I will place you in a hollow in the rock.[a] I will cover you with my hand until I have gone past.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the hollow in the rock.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when my glory passes by
  simplified_phrase: As my glory passes by
  preserved_meaning: God’s manifested glory passes by during the actions that follow.
  reasoning_layer_used: Lexical decision for וְהָיָה and בַּעֲבֹר
  rationale: “As” states the temporal relationship naturally without adding a separate event.
- pob_phrase: in a cleft of the rock
  simplified_phrase: in a hollow in the rock
  preserved_meaning: God places Moses within a recessed opening in the rock.
  reasoning_layer_used: Lexical decision for בְּנִקְרַת הַצּוּר
  rationale: “Hollow” makes the rocky recess easier to picture while the footnote preserves the article ambiguity.
- pob_phrase: and I will cover you with my hand until I have passed by
  simplified_phrase: I will cover you with my hand until I have gone past
  preserved_meaning: God covers Moses with his hand through the end of his passing.
  reasoning_layer_used: Lexical decisions for וְשַׂכֹּתִי, כַפִּי, and עַד עָבְרִי; theological decision on anthropomorphic language
  rationale: A separate sentence and “gone past” clarify the sequence while retaining the concrete hand image.
translation_notes:
  risk_flags:
  - risk: “Hollow” may suggest a rounded cavity more than a cleft or fissure.
    mitigation: The wording still describes a recess in the rock without adding shape or size.
  - risk: “My hand” could be read as a claim that God has a physical body.
    mitigation: The source’s bodily image is retained without explaining it as literal anatomy.
