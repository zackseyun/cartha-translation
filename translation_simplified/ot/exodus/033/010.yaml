translation:
  language: en
  text: When all the people saw the pillar of cloud standing at the entrance to the tent, they stood up. Each man worshiped[a] at the entrance to his own tent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bowed down” or “prostrated himself”; the Hebrew describes a bodily act of reverence that serves here as worship.
    reason: lexical_alternative
