  simplified_phrase: they stood up
  preserved_meaning: The whole group rose to their feet in response to seeing the cloud.
  reasoning_layer_used: POB lexical decision for וְקָם
  rationale: “Stood up” is clearer everyday English than “rose” while retaining the physical action.
- pob_phrase: and worshiped, each man at the entrance of his tent
  simplified_phrase: Each man worshiped at the entrance to his own tent.
  preserved_meaning: Every man worshiped from the entrance of his particular tent.
  reasoning_layer_used: POB lexical and theological decisions for וְהִשְׁתַּחֲווּ, אִישׁ, and פֶּתַח אָהֳלוֹ
  rationale: A separate sentence makes the distributive scene easier to grasp without weakening the religious force.
