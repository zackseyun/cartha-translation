  preserved_meaning: They must not eat an animal carcass torn in the open field.
  reasoning_layer_used: lexical decisions
  rationale: “Meat from an animal” makes the food regulation immediately clear without naming the unstated agent.
- pob_phrase: you shall throw it to the dogs
  simplified_phrase: Throw it to the dogs
