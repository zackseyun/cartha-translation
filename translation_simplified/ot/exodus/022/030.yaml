translation:
  language: en
  text: You must be holy men who belong to me. Do not eat meat from an animal that has been torn in the field.[a] Throw it to the dogs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not state what tore the animal; it may mean torn by wild animals.
