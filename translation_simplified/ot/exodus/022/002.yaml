translation:
  language: en
  text: But if the sun has risen on the thief,[a] whoever kills him is guilty of bloodshed. The thief must make full restitution. If he has no means to pay, he must be sold into service to pay for his theft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means the killing happens after sunrise, in daylight; some understand the daylight language more broadly as indicating that the danger was clear.
    reason: alternative_reading
