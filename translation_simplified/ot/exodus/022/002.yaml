- pob_phrase: there is bloodguilt for him
  simplified_phrase: whoever kills him is guilty of bloodshed
  preserved_meaning: Killing the thief after sunrise makes the killer liable for bloodshed.
  reasoning_layer_used: POB theological decision and footnote b
  rationale: The rewrite identifies the liable person and states the legal meaning in ordinary English.
- pob_phrase: He must surely make restitution
  simplified_phrase: The thief must make full restitution
  preserved_meaning: The thief has an emphatic obligation to provide the legally required compensation.
  reasoning_layer_used: POB lexical decision for שַׁלֵּם יְשַׁלֵּם and grounding review
  rationale: Full restitution preserves the emphatic legal duty without narrowing it to returning only what was stolen.
- pob_phrase: then he shall be sold for his theft
  simplified_phrase: he must be sold into service to pay for his theft
  preserved_meaning: Sale into servitude serves as the debt remedy when the thief cannot pay.
  reasoning_layer_used: POB lexical decision and cultural footnote c
  rationale: The wording explains the kind and purpose of the sale.
