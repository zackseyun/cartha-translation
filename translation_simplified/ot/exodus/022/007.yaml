translation:
  language: en
  text: If the thief is not found,[a] the person in charge of the house must come before God. It must then be determined whether he has not wrongfully taken or used his neighbor’s property.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “before the judges.” The Hebrew says “before God,” but here it may refer to judges acting under God’s authority.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the owner of the house
  simplified_phrase: the person in charge of the house
  preserved_meaning: This identifies the person responsible for the house and entrusted property without requiring ownership of the dwelling.
  reasoning_layer_used: Lexical decision on בַּעַל הַבַּיִת and independent grounding review
  rationale: The broader phrase avoids making the custodian necessarily a homeowner.
- pob_phrase: shall come near to God
  simplified_phrase: must come before God
  preserved_meaning: The responsible person must appear in the legal proceeding before God.
  reasoning_layer_used: Lexical and theological decisions on וְנִקְרַב and אֶל הָאֱלֹהִים
  rationale: “Come before” makes the legal setting clear while retaining God as the main reading.
- pob_phrase: to determine whether he has not laid his hand on
  simplified_phrase: It must then be determined whether he has not wrongfully taken or used
  preserved_meaning: The proceeding determines whether the custodian did not improperly appropriate or misuse the entrusted property.
  reasoning_layer_used: Lexical decision on אִם לֹא שָׁלַח יָדוֹ and independent grounding review
  rationale: The wording preserves the essential negation and explains the Hebrew hand idiom directly.
interpretive_expansions:
- pob_phrase: laid his hand on
  rendering: wrongfully taken or used
  claim: The idiom concerns improper appropriation or misuse rather than physical touching.
  evidence:
  - The POB lexical rationale defines the idiom as wrongful appropriation or misuse.
  - The immediate context concerns entrusted money or goods.
  confidence: high
  alternatives_preserved:
  - The wording does not limit the act to theft alone.
translation_notes:
  risk_flags:
  - risk: “Before God” may describe appearing before judges who act under divine authority.
    mitigation: The main text retains the direct reference to God, while the footnote preserves the judicial alternative.
  - risk: Replacing the hand image with its meaning removes a concrete Hebrew idiom.
    mitigation: 'The clearer wording preserves both possible acts identified by the POB rationale: wrongful taking and misuse.'
