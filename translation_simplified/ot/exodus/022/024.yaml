translation:
  language: en
  text: If[a] you lend money to one of my people, a poor man among you, do not pressure him to repay you. Do not charge him interest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When.” Hebrew law often uses “if” when stating what must be done in a particular case.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to my people, to the poor among you
  simplified_phrase: to one of my people, a poor man among you
  preserved_meaning: The borrower is an individual poor man within God’s covenant people and the hearers’ community.
  reasoning_layer_used: Lexical and theological decisions on עַמִּי, הֶעָנִי, and עִמָּךְ
  rationale: The wording identifies the relationships clearly while retaining the source’s masculine singular reference.
- pob_phrase: you shall not be like a creditor to him
  simplified_phrase: do not pressure him to repay you
  preserved_meaning: The lender must not act as a creditor who presses the poor borrower for payment.
  reasoning_layer_used: Lexical rationale for כְּנֹשֶׁה
  rationale: The concrete action is clearer than the potentially broad modern label “creditor.”
- pob_phrase: you shall not impose interest on him
  simplified_phrase: Do not charge him interest
  preserved_meaning: No interest may be added to this loan.
  reasoning_layer_used: Lexical decisions for תְשִׂימוּן and נֶשֶׁךְ
  rationale: “Charge interest” is the ordinary modern expression for the same prohibition.
interpretive_expansions:
- pob_phrase: be like a creditor to him
  rendering: pressure him to repay you
  claim: The prohibited creditor-like conduct is pressing the poor borrower for repayment.
  evidence:
