translation_notes:
  risk_flags:
  - risk: “Seduces” may be mistaken for forcible assault.
    mitigation: The wording retains POB’s seduction reading without adding force not stated in this law.
  - risk: “To take her as his wife” could be read as guaranteeing marriage.
    mitigation: The purpose construction and next verse leave room for the marriage to be refused.
