translation:
  language: en
  text: If a man seduces a virgin who is not engaged to be married and has sexual relations with her, he must pay the required marriage payment to take her as his wife.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called the bride-price, this was a payment made by the groom or his family in connection with marriage.
    reason: cultural_note
simplification_decisions:
- pob_phrase: who is not betrothed
  simplified_phrase: who is not engaged to be married
  preserved_meaning: She has not been formally pledged in marriage.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר לֹא אֹרָשָׂה
  rationale: The modern phrase explains her marital status without using the less familiar term “betrothed.”
- pob_phrase: he must surely pay the bride-price
  simplified_phrase: he must pay the required marriage payment
  preserved_meaning: The man is firmly obligated to make the payment associated with marriage.
  reasoning_layer_used: POB lexical decision for מָהֹר יִמְהָרֶנָּה
  rationale: “Required” preserves the firm obligation, while the footnote identifies the historical payment.
- pob_phrase: for her to be his wife
  simplified_phrase: to take her as his wife
  preserved_meaning: The payment is directed toward marriage but does not itself guarantee that the marriage occurs.
  reasoning_layer_used: POB lexical decision for לּוֹ לְאִשָּׁה and the immediate legal context
  rationale: The purpose wording avoids implying that payment automatically brings about the marriage.
interpretive_expansions:
- pob_phrase: lies with her
  rendering: has sexual relations with her
  claim: The Hebrew idiom refers to sexual intercourse.
  evidence:
