translation:
  language: en
  text: If a man allows his animal to graze in a field or vineyard[a] and lets it loose so that it grazes in someone else’s field, he must repay the loss from the best of his own field and vineyard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also mean “burns,” but the mention of letting an animal loose strongly supports “allows his animal to graze” here.
    reason: lexical_alternative
