translation:
  language: en
  text: If its owner is there with it, the borrower does not have to repay the owner. If the animal or item was hired, the hire payment covers the loss.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “If he is a hired worker, it came for his wages.” The terse Hebrew can refer either to the hired animal or item, as in the main text, or to a hired worker.
    reason: alternative_reading
