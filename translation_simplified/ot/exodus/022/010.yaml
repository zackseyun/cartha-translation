translation:
  language: en
  text: The two of them must settle the matter by an oath of Yahweh. The person entrusted with the property must swear that he did not take or tamper with his neighbor’s property.[a] The owner must accept the oath, and that person will not have to pay compensation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew pictures him as “putting his hand to” the property, an idiom for taking or tampering with it.
    reason: cultural_note
