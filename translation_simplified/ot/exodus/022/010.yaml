  preserved_meaning: The dispute is resolved through a formal oath invoking Yahweh.
  reasoning_layer_used: POB lexical decisions and legal context
  rationale: This recasts the formal clause as a clear legal procedure while retaining Yahweh’s name.
- pob_phrase: put his hand to his neighbor’s property
  simplified_phrase: take or tamper with his neighbor’s property
  preserved_meaning: He swears that he did not appropriate or misuse the property.
  reasoning_layer_used: POB lexical rationale for שָׁלַח יָדוֹ
  rationale: The main text explains the idiom, while the footnote preserves its Hebrew image.
- pob_phrase: he shall not make restitution
  simplified_phrase: that person will not have to pay compensation
  preserved_meaning: The oath frees the entrusted person from compensatory payment.
  reasoning_layer_used: POB lexical rationale for יְשַׁלֵּם
  rationale: Common legal wording replaces the less familiar term “restitution.”
