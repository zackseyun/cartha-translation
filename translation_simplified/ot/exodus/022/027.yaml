translation:
  language: en
  text: You must not speak of God with contempt or curse a ruler among your people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “judges” instead of “God”; the Hebrew word can refer to human authorities in some contexts, though “God” best fits the parallel here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You shall not revile God
  simplified_phrase: You must not speak of God with contempt
  preserved_meaning: The prohibition concerns abusive, dishonoring speech about God without equating it with the second clause’s direct verb “curse.”
  reasoning_layer_used: POB lexical decision for תְקַלֵּל
  rationale: The clearer phrase unpacks the uncommon word “revile” while preserving its force and the distinction between the two Hebrew verbs.
- pob_phrase: nor curse a ruler among your people
  simplified_phrase: or curse a ruler among your people
  preserved_meaning: The command still forbids cursing a recognized leader within the community.
  reasoning_layer_used: POB lexical decisions for נָשִׂיא, בְעַמְּךָ, and תָאֹר
  rationale: Modern coordination replaces “nor” with “or” while retaining the established terms and relationship.
translation_notes:
  risk_flags:
  - risk: Replacing “revile” with a phrase may sound slightly broader than a single speech verb.
    mitigation: “Speak of God with contempt” keeps both the verbal action and the dishonoring force identified in the POB rationale.
  - risk: Readers may not know that “God” has a historically important alternative reading.
    mitigation: The footnote preserves “judges” without displacing the POB’s controlling reading.
