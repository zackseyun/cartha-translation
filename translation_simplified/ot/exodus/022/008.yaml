translation:
  language: en
  text: Whenever there is a dispute about wrongdoing involving an ox, a donkey, a sheep[a], a piece of clothing, or any lost property, and someone says, “This is the one,” both sides must bring their case before God.[b] Whoever God declares guilty must repay the other person twice as much.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean a sheep or a goat.
    reason: lexical_alternative
  - marker: b
    text: Or “before the judges” or “before the court”; the Hebrew can refer to God or to human judges acting under his authority.
    reason: alternative_reading
