  rationale: “Dispute” makes the contested legal setting immediately clear without specifying the offense.
- pob_phrase: the case of both parties shall come before God
  simplified_phrase: both sides must bring their case before God
  preserved_meaning: Both parties must present the legal matter before God.
  reasoning_layer_used: Lexical and theological decisions for אֱלֹהִים
  rationale: The active wording is easier to follow while retaining “God” as the controlling reading.
- pob_phrase: shall pay double to his neighbor
