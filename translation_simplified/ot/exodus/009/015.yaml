translation:
  language: en
  text: For I could already have stretched out my hand and struck you and your people with a deadly disease. Then you would have been wiped from the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew forms can be read more formally as past actions, but the context strongly supports what God could have done rather than what had already happened.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For by now I could have
  simplified_phrase: For I could already have
  preserved_meaning: God describes an action that could have happened before this point.
  reasoning_layer_used: Lexical and theological decisions on the counterfactual sequence
  rationale: “Already” expresses the time and unrealized possibility in common English.
- pob_phrase: with pestilence
  simplified_phrase: with a deadly disease
  preserved_meaning: God could have afflicted Pharaoh and his people with a lethal outbreak.
  reasoning_layer_used: Lexical decision for בַּדָּבֶר
  rationale: “Deadly disease” makes the older term “pestilence” immediately understandable.
- pob_phrase: and you would have been cut off from the earth
  simplified_phrase: Then you would have been wiped from the earth
  preserved_meaning: The judgment would have completely removed Pharaoh and his people from the earth.
  reasoning_layer_used: Lexical decision for וַתִּכָּחֵד מִן־הָאָרֶץ
  rationale: A separate result sentence clearly communicates the severity and consequence.
translation_notes:
  risk_flags:
  - risk: “Wiped from the earth” may sound more idiomatic than the source image of being cut off.
    mitigation: It retains the source’s force of complete eradication and its broad reference to the earth.
