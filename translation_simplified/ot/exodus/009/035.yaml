translation:
  language: en
  text: So Pharaoh’s heart was hardened.[a] He did not let the sons of Israel go,[b] just as Yahweh had said through Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Pharaoh’s heart grew hard.” The Hebrew does not specify here who caused the hardening.
    reason: alternative_reading
  - marker: b
    text: The “sons of Israel” means the Israelites, traditionally called the “children of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So Pharaoh’s heart was hardened, and he did not let
  simplified_phrase: So Pharaoh’s heart was hardened. He did not let
  preserved_meaning: Pharaoh’s hardened heart and his refusal remain distinct but connected events.
  reasoning_layer_used: POB translation and theological decision
  rationale: Splitting the sentence makes the sequence easier to follow without assigning a cause for the hardening.
- pob_phrase: had spoken
  simplified_phrase: had said
  preserved_meaning: Yahweh had previously delivered this message through Moses.
  reasoning_layer_used: POB lexical decision for דִּבֶּר
  rationale: “Had said” is more conversationally clear while preserving prior divine speech.
translation_notes:
  risk_flags:
  - risk: Readers may assume the passive wording identifies who hardened Pharaoh’s heart.
    mitigation: The footnote states that this verse leaves the cause unspecified.
  - risk: “Sons of Israel” may sound as though it refers only to males.
    mitigation: The footnote explains that it names the Israelites collectively.
