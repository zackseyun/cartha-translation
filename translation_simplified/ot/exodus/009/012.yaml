translation:
  language: en
  text: But Yahweh hardened Pharaoh’s heart[a]. Pharaoh did not listen to Moses and Aaron, just as Yahweh had told Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “made Pharaoh’s heart firm” or “strengthened Pharaoh’s heart.” Here it describes his stubborn resistance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But Yahweh hardened Pharaoh's heart, and he did not listen to them
  simplified_phrase: But Yahweh hardened Pharaoh’s heart. Pharaoh did not listen to Moses and Aaron
  preserved_meaning: Yahweh directly hardened Pharaoh’s heart, and Pharaoh did not listen to Moses and Aaron.
  reasoning_layer_used: Lexical and theological decisions on divine agency, “heart,” and the contextual referent of “them”
  rationale: The sentence break and explicit names remove pronoun confusion without adding a refusal nuance.
- pob_phrase: just as Yahweh had spoken to Moses
  simplified_phrase: just as Yahweh had told Moses
  preserved_meaning: The event happened as Yahweh had previously said to Moses.
  reasoning_layer_used: Lexical decision for the fulfillment clause
  rationale: “Had told” is common English and preserves the reference to Yahweh’s earlier words.
interpretive_expansions:
- pob_phrase: he did not listen to them
  rendering: Pharaoh did not listen to Moses and Aaron
  claim: The pronouns refer to Pharaoh and to Moses and Aaron.
  evidence:
  - The immediate narrative context identifies Moses and Aaron as those addressing Pharaoh.
  confidence: high
  alternatives_preserved:
  - Pharaoh did not listen to them
translation_notes:
  risk_flags:
