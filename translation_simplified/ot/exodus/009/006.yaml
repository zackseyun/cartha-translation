translation:
  language: en
  text: The next day, Yahweh did this. All Egypt’s livestock died, but not one animal belonging to the sons of Israel[a] died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites as a people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And Yahweh did this thing the next day
  simplified_phrase: The next day, Yahweh did this
  preserved_meaning: Yahweh brought about the announced event on the following day.
  reasoning_layer_used: POB lexical decision for מִמָּחֳרָת and וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  rationale: Moving the time phrase first and dropping the redundant word “thing” makes the sentence more natural.
- pob_phrase: all the livestock of Egypt
  simplified_phrase: all Egypt’s livestock
  preserved_meaning: Every animal included in Egypt’s livestock is said to have died.
  reasoning_layer_used: POB lexical decision for כֹּל מִקְנֵה מִצְרַיִם
  rationale: The possessive form is simpler while retaining the broad term “livestock.”
- pob_phrase: but from the livestock of the sons of Israel, not one died
  simplified_phrase: but not one animal belonging to the sons of Israel died
  preserved_meaning: No single animal among Israel’s livestock died.
  reasoning_layer_used: POB lexical and theological decisions for בְנֵי יִשְׂרָאֵל and לֹא מֵת אֶחָד
  rationale: The recast clause clarifies what “one” refers to while retaining “sons of Israel.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “sons of Israel” to mean only male Israelites.
    mitigation: The footnote explains that the Hebrew expression refers corporately to the Israelites.
