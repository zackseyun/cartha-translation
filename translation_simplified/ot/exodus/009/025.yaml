simplification_decisions:
- pob_phrase: throughout all the land of Egypt
  simplified_phrase: Throughout Egypt
  preserved_meaning: The hail spread across the whole territory of Egypt.
  reasoning_layer_used: Lexical rationale for בְּכָל אֶרֶץ מִצְרַיִם
  rationale: The shorter wording preserves the plague’s nationwide extent.
- pob_phrase: everything that was in the field
  simplified_phrase: everything in the fields
  preserved_meaning: Everything exposed in the agricultural fields was struck.
  reasoning_layer_used: Lexical rationale for אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  rationale: The plural “fields” is natural English and keeps the agricultural setting.
- pob_phrase: every plant of the field ... every tree of the field
  simplified_phrase: every plant in the fields ... every tree there
  preserved_meaning: All plants and trees in the fields were struck by the hail.
  reasoning_layer_used: Lexical decisions for עֵשֶׂב הַשָּׂדֶה, עֵץ הַשָּׂדֶה, and שִׁבֵּר
  rationale: “There” avoids stiff repetition while still explicitly locating the trees in the fields.
