translation:
  language: en
  text: 'Then Yahweh said to Moses, “Get up early in the morning. Go and stand before Pharaoh and tell him, ‘This is what Yahweh, the God of the Hebrews, says: Let my people go so that they may serve me.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worship me.” The Hebrew word includes worship but also has the broader meaning of serving God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Rise early in the morning and present yourself before Pharaoh
  simplified_phrase: Get up early in the morning. Go and stand before Pharaoh
  preserved_meaning: Moses must go early and take his place in Pharaoh’s presence.
  reasoning_layer_used: Lexical decisions for הַשְׁכֵּם and וְהִתְיַצֵּב לִפְנֵי
  rationale: Two direct sentences replace the formal courtly wording without weakening the command.
- pob_phrase: and say to him, ‘Thus says Yahweh
  simplified_phrase: and tell him, ‘This is what Yahweh ... says
  preserved_meaning: Moses delivers Yahweh’s authoritative message to Pharaoh.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר
  rationale: The standard messenger formula is expressed in familiar modern English.
- pob_phrase: so that they may serve me
  simplified_phrase: so that they may serve me
  preserved_meaning: Israel is to be released for the broad purpose of serving Yahweh, including worship.
  reasoning_layer_used: Lexical and theological decisions for וְיַעַבְדֻנִי
  rationale: The key term “serve” is retained because “worship” alone would narrow its meaning.
translation_notes:
  risk_flags:
  - risk: “Stand before” may sound less formal than “present yourself before.”
    mitigation: The wording still preserves Moses taking his place directly in Pharaoh’s presence.
