  reasoning_layer_used: Lexical decision for הַיָּרֵא and partitive מֵעַבְדֵי פַרְעֹה
  rationale: The plural form avoids an awkward singular construction while preserving the subset meaning.
- pob_phrase: hurried his servants and his livestock
  simplified_phrase: quickly brought their servants and livestock
  preserved_meaning: They urgently moved their household workers and animals indoors.
  reasoning_layer_used: Lexical decisions for הֵנִיס, עֲבָדָיו, and מִקְנֵהוּ
  rationale: “Quickly brought” clearly expresses the urgent caused movement without suggesting panic.
