translation:
  language: en
  text: For this time, I am sending all my plagues against your heart,[a] against your court officials, and against your people. I am doing this so that you may know that no one in all the earth[b] is like me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to your heart.” The plagues are aimed at Pharaoh himself, at the core of his being.
    reason: lexical_alternative
  - marker: b
    text: Or “in all the land.” Here “earth” expresses the LORD’s unmatched uniqueness everywhere.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For this time I am sending
  simplified_phrase: For this time, I am sending
  preserved_meaning: This action comes on the present occasion and explains the preceding warning.
  reasoning_layer_used: Lexical decisions for כִּי and בַּפַּעַם הַזֹּאת
  rationale: Keeping “For” preserves the verse’s connection to the preceding statement.
- pob_phrase: your servants
  simplified_phrase: your court officials
  preserved_meaning: The plagues also target those who serve Pharaoh in his royal court.
  reasoning_layer_used: Lexical rationale for וּבַעֲבָדֶיךָ
  rationale: “Court officials” gives the intended social setting without suggesting enslaved laborers.
- pob_phrase: so that you may know that there is none like me
  simplified_phrase: I am doing this so that you may know that no one ... is like me
  preserved_meaning: The plagues are intended to reveal the LORD’s absolute incomparability.
  reasoning_layer_used: Purpose-clause and theological decisions
  rationale: A new sentence makes the purpose easier to follow while preserving the claim.
interpretive_expansions:
- pob_phrase: against your heart
  rendering: against your heart
  claim: The plagues are directed at Pharaoh himself, at the core of his being.
  evidence:
  - The Hebrew explicitly preserves the image of Pharaoh’s heart.
  - The POB rationale links the phrase to Pharaoh’s core self and hardened heart.
  confidence: high
  alternatives_preserved:
  - to your heart
  - against you personally
