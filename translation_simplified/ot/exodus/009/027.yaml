    mitigation: The repetition preserves the two source verbs that the POB audit deliberately distinguishes.
  - risk: “Are wicked” may sound broader than guilt on this occasion.
    mitigation: “This time” supplies the immediate setting, and footnote b preserves the contextual alternatives.
