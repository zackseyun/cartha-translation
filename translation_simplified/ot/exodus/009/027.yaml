translation:
  language: en
  text: Then Pharaoh sent for Moses and Aaron and summoned them. He said to them, “This time, I have sinned. Yahweh is in the right,[a] and both I and my people are wicked.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh is righteous.”
    reason: lexical_alternative
  - marker: b
    text: Or, “Both I and my people are in the wrong” or “are guilty.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent and called for Moses and Aaron
  simplified_phrase: sent for Moses and Aaron and summoned them
  preserved_meaning: Pharaoh first sent for Moses and Aaron and then called them before him.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁלַח and וַיִּקְרָא לְ
  rationale: The wording keeps both actions while expressing the sequence in natural English.
- pob_phrase: and said to them
  simplified_phrase: He said to them
  preserved_meaning: Pharaoh directly addresses Moses and Aaron.
  reasoning_layer_used: English discourse clarity
  rationale: A new sentence makes the speaker and his confession easier to follow.
- pob_phrase: I and my people are the wicked ones
  simplified_phrase: both I and my people are wicked
  preserved_meaning: Pharaoh includes himself and his people in a morally serious admission of guilt.
  reasoning_layer_used: Lexical rationale for הָרְשָׁעִים
  rationale: The adjective keeps the moral force without the awkward phrase “the wicked ones.”
translation_notes:
  risk_flags:
