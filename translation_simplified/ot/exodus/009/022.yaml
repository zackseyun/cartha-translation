  reasoning_layer_used: POB lexical decision for בְּכָל אֶרֶץ מִצְרַיִם
  rationale: “The whole land” is natural common English and retains the comprehensive scope.
- pob_phrase: on man and on beast
  simplified_phrase: over the people, the livestock
  preserved_meaning: Human beings generally and domesticated animals are both exposed to the hail.
  reasoning_layer_used: POB lexical and theological decisions for הָאָדָם and הַבְּהֵמָה
  rationale: “People” clarifies the generic human sense, and “livestock” conveys the contextual domestic-animal sense.
- pob_phrase: every plant of the field in the land of Egypt
