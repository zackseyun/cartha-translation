translation:
  language: en
  text: Pray to Yahweh.[a] God’s thunder and hail have gone on long enough. Then I will let you go, and you will not have to stay any longer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “voices of God and hail”; here “voices” means thunder.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for there has been enough of God's thunder and hail
  simplified_phrase: God’s thunder and hail have gone on long enough
  preserved_meaning: Pharaoh pleads for the divinely caused storm to end because it has continued enough.
  reasoning_layer_used: Lexical decision for וְרַב מִהְיֹת and contextual decision for קֹלֹת אֱלֹהִים
  rationale: The recast sentence expresses the Hebrew sufficiency idiom in natural English while retaining divine agency.
- pob_phrase: Then I will let you go, and you will stay no longer
  simplified_phrase: Then I will let you go, and you will not have to stay any longer
  preserved_meaning: Pharaoh promises to release the Israelites so they need not remain in Egypt.
  reasoning_layer_used: Lexical decisions for וַאֲשַׁלְּחָה אֶתְכֶם and וְלֹא תֹסִפוּן לַעֲמֹד
  rationale: The wording makes the promise clear without preserving the opaque Hebrew idiom “not add to stand.”
