translation:
  language: en
  text: Everyone who offered silver or bronze brought it as a contribution for Yahweh. Everyone who had acacia wood available for any work involved in the service brought it too.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: offered a contribution of silver or bronze brought Yahweh’s contribution
  simplified_phrase: offered silver or bronze brought it as a contribution for Yahweh
  preserved_meaning: The metal was voluntarily presented as an offering designated for Yahweh.
  reasoning_layer_used: POB lexical decisions for תְּרוּמָה and תְּרוּמַת יְהוָה
  rationale: The recast removes repetition while keeping the contribution’s sacred recipient clear.
- pob_phrase: everyone with whom acacia wood was found
  simplified_phrase: everyone who had acacia wood available
  preserved_meaning: People who possessed usable acacia wood brought it.
  reasoning_layer_used: POB lexical decision and idiom footnote for וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  rationale: The Hebrew possession idiom is expressed directly in ordinary English.
- pob_phrase: for any work of the service
  simplified_phrase: for any work involved in the service
  preserved_meaning: The wood could be used for any portion of the required service work.
  reasoning_layer_used: POB lexical decision for לְכָל מְלֶאכֶת הָעֲבֹדָה
  rationale: This wording preserves both work and service without the awkward noun chain.
translation_notes:
  risk_flags:
  - risk: “For Yahweh” is less possessive than the POB phrase “Yahweh’s contribution.”
    mitigation: The wording still identifies the contribution as designated for Yahweh, which the POB rationale gives as the intended sense.
