translation:
  language: en
  text: God filled Bezalel with the Spirit of God.[a] He also gave him wisdom, understanding, knowledge, and skill for every kind of craft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the spirit of God” or “a divine spirit”; here the phrase most likely means God’s own empowering Spirit.
    reason: alternative_reading
  - marker: b
    text: Or “ability for every kind of skilled work.”
    reason: lexical_alternative
