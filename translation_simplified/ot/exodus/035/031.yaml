- pob_phrase: and he filled him
  simplified_phrase: God filled Bezalel
  preserved_meaning: God is the one who fills Bezalel.
  reasoning_layer_used: Immediate context and lexical decision
  rationale: Naming both people makes the verse clear when read by itself.
- pob_phrase: with wisdom, with understanding, and with knowledge
  simplified_phrase: He also gave him wisdom, understanding, knowledge
  preserved_meaning: These are distinct abilities God gives Bezalel.
  reasoning_layer_used: Lexical decisions
  rationale: A second sentence removes the repetitive structure without merging the three gifts.
- pob_phrase: with every kind of craftsmanship
  simplified_phrase: skill for every kind of craft
  preserved_meaning: God equips Bezalel for all the specialized work required.
  reasoning_layer_used: Lexical rationale and immediate context
