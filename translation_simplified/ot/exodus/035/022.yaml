    text: The Hebrew may mean that the men came together with the women or in addition to them.
    reason: alternative_reading
  - marker: b
    text: The exact kinds of jewelry named in Hebrew are uncertain; they may include clasps, nose-rings, pendants, or armlets.
    reason: lexical_alternative
  - marker: c
    text: A wave offering was ritually lifted or moved as it was presented to God.
    reason: cultural_note
