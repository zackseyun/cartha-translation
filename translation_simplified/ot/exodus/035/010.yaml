  preserved_meaning: The skilled workers must make the full set of commanded items.
  reasoning_layer_used: POB lexical decisions for אֵת כָּל אֲשֶׁר and צִוָּה יְהוָה
  rationale: “Everything” is easier to read without reducing the command’s scope.
