  preserved_meaning: The words function as an instruction, not merely a prediction.
  reasoning_layer_used: POB lexical decision for יָבֹאוּ
  rationale: “Is to come” expresses the directive force in clear contemporary English.
- pob_phrase: all that Yahweh has commanded
