translation:
  language: en
  text: Every skilled person among you is to come and make everything Yahweh has commanded:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “wise of heart,” an expression for someone skilled in craftsmanship.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses a masculine singular expression with distributive force; it can also be rendered “every skilled man among you.”
    reason: alternative_reading
