translation:
  language: en
  text: For six days, work is permitted. But the seventh day must be holy for you—a Sabbath of complete rest dedicated to Yahweh.[a] Anyone who works on that day shall surely be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “for Yahweh” or “belonging to Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Work may be done for six days
  simplified_phrase: For six days, work is permitted
  preserved_meaning: Work is allowed during the first six days, expressed without naming a specific worker.
  reasoning_layer_used: Lexical decision for תֵּעָשֶׂה and temporal cross-check
  rationale: This recasts the passive legal instruction in direct modern English without turning it into a command to work.
- pob_phrase: there shall be for you a holy Sabbath, a complete rest
  simplified_phrase: the seventh day must be holy for you—a Sabbath of complete rest
  preserved_meaning: The seventh day is consecrated and requires full cessation from work.
  reasoning_layer_used: Lexical decisions for קֹדֶשׁ and שַׁבַּת שַׁבָּתוֹן
  rationale: The dash clearly explains what the holy seventh day is while retaining the intensified Sabbath-rest image.
- pob_phrase: Whoever does work on it
  simplified_phrase: Anyone who works on that day
  preserved_meaning: The penalty applies universally to anyone doing work on the Sabbath.
  reasoning_layer_used: Lexical decisions for כָּל הָעֹשֶׂה and בּוֹ
  rationale: The explicit reference to “that day” removes an unclear pronoun while preserving the general legal case.
interpretive_expansions:
- pob_phrase: to Yahweh
  rendering: dedicated to Yahweh
  claim: The Sabbath is oriented or devoted to Yahweh.
  evidence:
