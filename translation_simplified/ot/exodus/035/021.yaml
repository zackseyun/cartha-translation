translation:
  language: en
  text: Everyone whose heart prompted them came, and everyone whose spirit made them willing brought a contribution for Yahweh. They gave it for the work of the tent of meeting, for all its service, and for the priests’ sacred garments.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “Yahweh’s contribution,” meaning a contribution dedicated to him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: everyone came whose heart stirred him
  simplified_phrase: Everyone whose heart prompted them came
  preserved_meaning: Each person responded to an inward prompting of the heart.
  reasoning_layer_used: POB lexical decision for the Hebrew heart idiom
  rationale: “Prompted” expresses the inward movement naturally while preserving the heart image.
- pob_phrase: everyone whose spirit moved him willingly brought
  simplified_phrase: everyone whose spirit made them willing brought
  preserved_meaning: The donors’ own spirits moved them to give voluntarily.
  reasoning_layer_used: POB lexical decision for נָדְבָה רוּחוֹ
  rationale: The separate clause preserves voluntary willingness without requiring both descriptions of every donor.
- pob_phrase: the holy garments
  simplified_phrase: the priests’ sacred garments
  preserved_meaning: The gifts supplied the consecrated garments used by the priests.
  reasoning_layer_used: POB lexical rationale for וּלְבִגְדֵי הַקֹּדֶשׁ
  rationale: Naming the priests makes the purpose of these sacred garments immediately clear.
