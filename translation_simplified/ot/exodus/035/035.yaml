translation:
  language: en
  text: He has filled their hearts with wisdom and skill for every kind of craft. They can engrave,[a] design, embroider with blue, purple, and scarlet yarn and fine linen, and weave. They can make every kind of crafted work and create artistic designs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also refer more broadly to a skilled craft worker.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats related words here to emphasize their ability to devise designs.
    reason: simplification_note
