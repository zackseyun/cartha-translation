  language: en
  text: He could cut stones to be set in place, carve wood, and create every kind of skillfully designed work.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “every kind of artistic work.” The Hebrew describes work done with skill, planning, and design.
