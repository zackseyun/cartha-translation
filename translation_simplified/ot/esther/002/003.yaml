translation:
  language: en
  text: Let the king appoint officials throughout all the provinces of his kingdom. Let them gather all the beautiful young virgins and bring them to the women’s quarters[a] in the citadel of Susa, placing them in the custody of Hegai, the king’s eunuch who is in charge of the women. Let the women be given cosmetics.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the house of the women”; this refers to the royal women’s quarters, or harem.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that beauty treatments were to be provided for them.
    reason: lexical_alternative
