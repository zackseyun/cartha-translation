translation:
  language: en
  text: The young woman pleased him and won his favor. He quickly gave her the beauty treatments and provisions assigned to her. He also gave her seven suitable young women from the king’s palace to serve her. Then he moved her and her attendants to the best place in the women’s quarters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The women’s quarters are often understood as the royal harem.
    reason: cultural_note
