translation:
  language: en
  text: Each woman went in to the king in the evening.[a] The next morning, she returned to the second women’s quarters, under the care of Shaashgaz, the king’s eunuch who was in charge of the concubines. She would not go in to the king again unless he took pleasure in her and summoned her by name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Went in to the king” means entering his private presence or rooms; in this setting, the phrase implies sexual access without stating it directly.
    reason: cultural_note
