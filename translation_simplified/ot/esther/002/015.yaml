translation:
  language: en
  text: When it was Esther’s turn to go to the king, she asked only for what Hegai advised. Hegai was the king’s eunuch in charge of the women. Esther was the daughter of Abihail, Mordecai’s uncle, and Mordecai had taken her into his care as his own daughter. Everyone who saw Esther looked on her with favor.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When Esther’s turn came—the daughter of Abihail, the uncle of Mordecai, who had taken her as his own daughter—to go in to the king
  simplified_phrase: When it was Esther’s turn to go to the king ... Esther was the daughter of Abihail, Mordecai’s uncle, and Mordecai had taken her into his care as his own daughter.
  preserved_meaning: Esther’s family relationship, Mordecai’s parental care, and her appointed turn before the king remain distinct.
  reasoning_layer_used: POB lexical decisions for תֹּר, דֹּד, לָקַח לוֹ לְבַת, and לָבוֹא אֶל־הַמֶּלֶךְ
  rationale: The long interruption is moved into a separate sentence so the relationships are immediately clear.
- pob_phrase: she asked for nothing except what Hegai ... advised
  simplified_phrase: she asked only for what Hegai advised
  preserved_meaning: Esther requested no items beyond those Hegai recommended.
  reasoning_layer_used: POB lexical decisions for לֹא בִקְשָׁה דָּבָר and כִּי אִם אֵת אֲשֶׁר יֹאמַר
  rationale: The positive “only” construction states the same limit more directly.
- pob_phrase: keeper of the women ... gaining favor in the eyes of all who saw her
  simplified_phrase: in charge of the women ... Everyone who saw Esther looked on her with favor
  preserved_meaning: Hegai supervised the women, and Esther received favor from all who saw her.
  reasoning_layer_used: POB lexical decisions for שֹׁמֵר הַנָּשִׁים, נֹשֵׂאת חֵן, בְּעֵינֵי, and כָּל רֹאֶיהָ
  rationale: Common English replaces two biblical idioms without weakening their meaning.
