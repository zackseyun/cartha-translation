translation:
  language: en
  text: Mordecai was raising Hadassah, also called Esther. She was the daughter of Mordecai’s uncle, and she had no father or mother. The young woman had a beautiful figure and an attractive appearance. When her parents died, Mordecai took her in as his own daughter.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: He was bringing up Hadassah—that is, Esther—the daughter of his uncle
  simplified_phrase: Mordecai was raising Hadassah, also called Esther. She was the daughter of Mordecai’s uncle
  preserved_meaning: Mordecai cared for the woman known by both names, who was his uncle’s daughter.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Naming Mordecai and splitting the clause removes ambiguity about the family relationship.
- pob_phrase: beautiful in form and attractive in appearance
  simplified_phrase: had a beautiful figure and an attractive appearance
  preserved_meaning: The two-part description distinguishes her bodily form from her overall appearance.
  reasoning_layer_used: POB lexical decisions
  rationale: “Beautiful figure” states the physical description naturally without merging the two ideas.
- pob_phrase: when her father and her mother died, Mordecai took her as his own daughter
  simplified_phrase: When her parents died, Mordecai took her in as his own daughter
  preserved_meaning: After both parents died, Mordecai received and treated Esther as his own daughter.
  reasoning_layer_used: POB lexical decisions
  rationale: “Parents” avoids repetition, while the full phrase does not imply formal legal adoption.
translation_notes:
  risk_flags:
  - risk: “Took her in” alone could suggest only temporary shelter.
    mitigation: “As his own daughter” preserves Mordecai’s lasting parental role.
