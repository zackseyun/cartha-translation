translation:
  language: en
  text: News of the queen’s refusal will spread among all the women, causing them to look down on their husbands. They will say, “King Ahasuerus said, ‘Bring Queen Vashti before me,’ but she did not come.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the queen’s matter will go out to all women
  simplified_phrase: News of the queen’s refusal will spread among all the women
  preserved_meaning: The matter of Vashti’s failure to appear will become widely known among the women.
  reasoning_layer_used: POB translation and immediate quoted context
  rationale: “News” and “spread” naturally express public circulation, while the quotation identifies the matter as her refusal.
- pob_phrase: causing them to despise their husbands in their eyes
  simplified_phrase: causing them to look down on their husbands
  preserved_meaning: The women will regard their husbands with contempt.
  reasoning_layer_used: POB translation
  rationale: The common expression “look down on” conveys contempt without the awkward phrase “in their eyes.”
- pob_phrase: said to bring Queen Vashti before him
  simplified_phrase: said, ‘Bring Queen Vashti before me’
  preserved_meaning: The king gave a directive that Vashti be brought into his presence.
  reasoning_layer_used: POB translation, immediate narrative context, and grounding review
  rationale: Direct speech makes the directive clear without replacing POB’s verb “said” with the stronger “commanded.”
