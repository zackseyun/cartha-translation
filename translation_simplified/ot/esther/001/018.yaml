translation:
  language: en
  text: Today, the noblewomen of Persia and Media who have heard the report about the queen[a] will say the same thing to all the king’s officials. There will be enough contempt and anger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean what the queen said or the report about what she did.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the queen’s word
  simplified_phrase: the report about the queen
  preserved_meaning: The phrase still refers broadly to what the women heard concerning the queen.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: “Report” is clearer, while the footnote preserves the Hebrew phrase’s ambiguity.
- pob_phrase: will say the same to all the king’s officials
  simplified_phrase: will say the same thing to all the king’s officials
  preserved_meaning: The women are predicted to repeat the queen’s defiant response to the officials.
  reasoning_layer_used: POB translation and predictive context
  rationale: Adding “thing” makes the comparison clear without restricting it to tone or manner.
- pob_phrase: there will be enough contempt and wrath
  simplified_phrase: There will be enough contempt and anger
  preserved_meaning: The result will be ample contempt and strong anger.
  reasoning_layer_used: POB lexical decisions for וּכְדַי, בִּזָּיוֹן, and קָצֶף
  rationale: “Anger” is more familiar than “wrath,” while “enough” avoids overstating the Hebrew.
translation_notes:
  risk_flags:
  - risk: “Report about the queen” may be understood only as news about her actions.
    mitigation: The footnote preserves the possibility that the phrase means what she said.
