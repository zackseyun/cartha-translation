translation:
  language: en
  text: On the seventh day, the wine had made the king cheerful.[a] He told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar, and Karkas—the seven eunuchs[b] who attended King Ahasuerus—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says the king’s heart was glad because of wine; it does not explicitly say he was drunk.
    reason: lexical_alternative
  - marker: b
    text: The word usually means “eunuchs,” though it can sometimes refer more broadly to royal officials.
    reason: lexical_alternative
