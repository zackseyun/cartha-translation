  preserved_meaning: Memucan spoke while the king and his officials were present.
  reasoning_layer_used: lexical decision for לִפְנֵי
  rationale: The wording uses common English while preserving the court setting.
- pob_phrase: has done wrong not against the king alone, but against
  simplified_phrase: has wronged not only the king, but also
  preserved_meaning: Memucan claims Vashti’s wrongdoing affected others besides the king.
  reasoning_layer_used: lexical decisions for עָוְתָה and the contrastive כִּי
  rationale: The familiar not-only-but-also pattern makes the contrast immediately clear.
- pob_phrase: who are in all the provinces
  simplified_phrase: throughout every province
  preserved_meaning: The officials and peoples are spread across the whole empire.
  reasoning_layer_used: lexical decision for אֲשֶׁר בְּכָל מְדִינוֹת
  rationale: The shorter phrase naturally expresses empire-wide scope.
