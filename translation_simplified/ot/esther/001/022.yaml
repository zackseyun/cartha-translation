translation:
  language: en
  text: The king sent letters throughout all his provinces. They were written in the script of each province and the language of each people. The letters ordered every man[a] to rule in his own household and to speak the language of his own people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “every husband.” The Hebrew says “every man,” but the decree concerns authority within marriage and the household.
    reason: lexical_alternative
  - marker: b
    text: The final words may refer specifically to the man speaking his people’s language or more broadly to his linguistic identity shaping the household.
    reason: alternative_reading
