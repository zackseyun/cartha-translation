translation:
  language: en
  text: These were the days when the Jews gained relief from their enemies. In that month, their sorrow had been turned to joy and their mourning to a day of celebration.[a] They were to observe these as days of feasting and joy, sending portions, each man to his neighbor, and giving gifts to the poor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a good day”; here it means a festive day of celebration.
    reason: lexical_alternative
  - marker: b
    text: The “portions” were probably portions of food given as festival gifts.
    reason: cultural_note
