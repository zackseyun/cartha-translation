translation:
  language: en
  text: So the Jews who live in rural, unwalled towns celebrate the fourteenth day of the month of Adar as a joyful holiday with feasting. Each man also sends portions[a] to his neighbor.
  philosophy: optimal-equivalence
  footnotes:
