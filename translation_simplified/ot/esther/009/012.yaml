translation:
  language: en
  text: Then the king said to Queen Esther, “In Susa’s fortified citadel, the Jews have killed and destroyed five hundred men, along with Haman’s ten sons. What, then, have they done in the rest of the king’s provinces?[a] What do you ask for? It will be granted to you. What else do you request? It will be done.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “What have they done in the rest of the king’s provinces?” The word “then” expresses the inference implied by the report from Susa.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In Susa the citadel
  simplified_phrase: In Susa’s fortified citadel
  preserved_meaning: The killings took place in Susa’s fortified royal complex.
  reasoning_layer_used: POB lexical decision for בְּשׁוּשַׁן הַבִּירָה
  rationale: The possessive wording is natural, while “fortified citadel” preserves the specific place and its defensive character.
- pob_phrase: along with the ten sons of Haman
  simplified_phrase: along with Haman’s ten sons
  preserved_meaning: Haman’s ten sons are additional victims in the report.
  reasoning_layer_used: POB lexical decision for וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  rationale: The possessive form is shorter and more natural without losing the additive force.
- pob_phrase: what is your petition? ... what is your further request?
  simplified_phrase: What do you ask for? ... What else do you request?
  preserved_meaning: The king invites Esther to make a request and then an additional request.
  reasoning_layer_used: POB lexical decisions for שְּׁאֵלָתֵךְ, בַּקָּשָׁתֵךְ, and עוֹד
  rationale: Two plain questions preserve the progression without adding unsupported temporal emphasis.
translation_notes:
  risk_flags:
  - risk: “What, then” interprets the question as an inference from the events in Susa.
    mitigation: The footnote preserves the simpler possible reading without “then.”
  - risk: Replacing “petition” reduces some of the royal court register.
    mitigation: The king’s promise to grant the request keeps the formal audience setting clear.
