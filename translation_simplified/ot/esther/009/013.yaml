translation:
  language: en
  text: Esther said, “If it pleases the king, allow the Jews in Susa to act tomorrow as today’s decree permits. Also, have Haman’s ten sons hanged on the gallows.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “hung on the tree” or “impaled on the stake.” The Hebrew literally refers to wood or a tree, meaning the wooden execution structure in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let it be granted to the Jews who are in Susa
  simplified_phrase: allow the Jews in Susa
  preserved_meaning: Esther asks the king to give the Jews in Susa official permission.
  reasoning_layer_used: Lexical decision for יִנָּתֵן and the beneficiary phrase
  rationale: The active wording expresses the same royal authorization more directly.
- pob_phrase: to do tomorrow also according to today’s decree
  simplified_phrase: to act tomorrow as today’s decree permits
  preserved_meaning: The Jews may act for another day under the authority of the existing decree.
  reasoning_layer_used: Lexical decisions for גַּם מָחָר, לַעֲשׂוֹת, and דָּת
  rationale: This keeps their action broad and presents the decree as its governing authorization.
- pob_phrase: and let Haman’s ten sons be hanged on the gallows
  simplified_phrase: Also, have Haman’s ten sons hanged on the gallows
  preserved_meaning: Esther separately asks the king to order their hanging on the execution structure.
  reasoning_layer_used: Lexical decision for יִתְלוּ עַל־הָעֵץ
  rationale: A separate sentence distinguishes the second request without weakening it.
translation_notes:
  risk_flags:
