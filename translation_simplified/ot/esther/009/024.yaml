translation:
  language: en
  text: For Haman son of Hammedatha the Agagite was the enemy of all the Jews. He had plotted to destroy them all. He cast Pur[a]—that is, the lot—to throw them into confusion and destroy them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pur is a Persian word meaning “lot.” The name Purim comes from this word.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the enemy of all the Jews, had plotted against the Jews to destroy them
  simplified_phrase: was the enemy of all the Jews. He had plotted to destroy them all.
  preserved_meaning: Haman was hostile toward the whole Jewish people and planned their destruction.
  reasoning_layer_used: POB lexical decisions for צֹרֵר, כָּל הַיְּהוּדִים, and חָשַׁב עַל
  rationale: Two short sentences make the scope and hostile intent easier to follow.
- pob_phrase: had cast Pur—that is, the lot
  simplified_phrase: cast Pur—that is, the lot
  preserved_meaning: Haman used the object called Pur to determine the time for his plan.
  reasoning_layer_used: POB lexical decision and cultural note for וְהִפִּיל פּוּר and הוּא הַגּוֹרָל
  rationale: The foreign term remains for its link to Purim, while the immediate explanation makes it clear.
- pob_phrase: to throw them into confusion and to destroy them
  simplified_phrase: to throw them into confusion and destroy them
  preserved_meaning: The lot served Haman’s purpose of overwhelming the Jews and bringing about their destruction.
  reasoning_layer_used: POB lexical decisions for לְהֻמָּם and וּלְאַבְּדָם, confirmed by the latest revision summary
  rationale: Removing the second “to” smooths the English without merging the two hostile aims.
