translation:
  language: en
  text: Mordecai wrote all this down.[a] Then he sent letters to all the Jews throughout the provinces of King Ahasuerus, both those nearby and those far away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wrote these words.” The Hebrew may refer to the events just described or to the words written about them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: wrote these things
  simplified_phrase: wrote all this down
  preserved_meaning: Mordecai recorded the preceding matters in writing without limiting the phrase only to events or only to words.
  reasoning_layer_used: POB lexical decision for הַדְּבָרִים הָאֵלֶּה
  rationale: The natural phrase “all this” keeps the Hebrew expression broad while the footnote preserves its ambiguity.
- pob_phrase: who were in all the provinces
  simplified_phrase: throughout the provinces
  preserved_meaning: The Jews were spread across every province of the king’s realm.
  reasoning_layer_used: POB lexical decision for בְּכָל מְדִינוֹת
  rationale: “Throughout” expresses empire-wide distribution more directly in modern English.
- pob_phrase: both near and far
  simplified_phrase: both those nearby and those far away
  preserved_meaning: The letters went to Jews at every distance across the empire.
  reasoning_layer_used: POB lexical decision for הַקְּרוֹבִים וְהָרְחוֹקִים
  rationale: Naming “those” makes clear that the paired terms describe the Jewish recipients.
