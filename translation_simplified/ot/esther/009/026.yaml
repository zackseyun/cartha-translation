translation:
  language: en
  text: That is why they called these days Purim,[a] from the word Pur. So, because of everything written in this letter, what they had seen in this matter, and what had happened to them—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pur means “lot”; Purim is the name of the festival.
    reason: lexical_alternative
