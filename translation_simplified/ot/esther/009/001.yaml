  simplified_phrase: In the twelfth month, the month of Adar, on its thirteenth day
  preserved_meaning: The date remains the thirteenth day of Adar, the twelfth month.
  reasoning_layer_used: POB lexical decisions for the date and appositional identification
  rationale: The shorter wording identifies the month and date without the awkward phrase “day of it.”
- pob_phrase: when the king’s word and his decree were to be carried out, on the day when
  simplified_phrase: the king’s word and decree were to be carried out. ... on that day
  preserved_meaning: That day was the appointed time to implement both the king’s directive and its formal decree.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  rationale: Two sentences make the timing easier to follow while retaining the distinction between “word” and “decree.”
- pob_phrase: 'the opposite happened: the Jews themselves ruled over those who hated them'
  simplified_phrase: 'But the opposite happened: the Jews themselves ruled over those who hated them'
  preserved_meaning: The enemies’ expected domination was dramatically reversed, with emphatic focus on the Jews.
  reasoning_layer_used: POB lexical decisions for וְנַהֲפוֹךְ הוּא, הֵמָּה, and בְּשֹׂנְאֵיהֶם
  rationale: “But” clearly marks the reversal while preserving the emphatic “themselves” and the verbal force of hatred.
