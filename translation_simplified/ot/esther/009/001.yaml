translation:
  language: en
  text: In the twelfth month, the month of Adar, on its thirteenth day, the king’s word and decree were to be carried out. The enemies of the Jews had hoped to rule over them on that day. But the opposite happened:[a] the Jews themselves ruled over those who hated them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the situation was reversed” or “it was turned around.”
    reason: lexical_alternative
