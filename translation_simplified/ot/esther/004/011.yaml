translation:
  language: en
  text: '“All the king’s servants and all the people throughout his provinces know the law: any man or woman who enters the king’s inner court without being summoned must be put to death. The only exception is someone to whom the king extends the golden scepter; that person will live. But I have not been summoned to appear before the king for thirty days now.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the people of the king’s provinces
  simplified_phrase: all the people throughout his provinces
  preserved_meaning: The law is publicly known across the king’s empire, not only among court servants.
  reasoning_layer_used: lexical decision for וְעַם מְדִינוֹת הַמֶּלֶךְ
  rationale: “Throughout” makes the provinces’ broad geographic scope immediately clear.
- pob_phrase: 'there is one law for him: to be put to death'
  simplified_phrase: 'the law: ... must be put to death'
  preserved_meaning: A fixed legal penalty of execution applies to every unauthorized entrant.
  reasoning_layer_used: lexical decisions for אַחַת דָּתוֹ and לְהָמִית
  rationale: The recast sentence states the fixed penalty in direct modern English.
- pob_phrase: these thirty days
  simplified_phrase: for thirty days now
  preserved_meaning: Esther has not received a summons during the preceding thirty-day period.
  reasoning_layer_used: lexical decision for זֶה שְׁלוֹשִׁים יוֹם
  rationale: The idiomatic wording clearly marks a period continuing to the present.
translation_notes:
  risk_flags:
  - risk: “The law” is less formally literal than the Hebrew image of “one law.”
    mitigation: “The only exception” preserves the sense of one fixed rule with a sole escape.
