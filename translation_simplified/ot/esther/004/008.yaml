translation:
  language: en
  text: He also gave him a copy of the decree issued in Susa that ordered their destruction. He was to show it to Esther, tell her about it, and instruct her to enter the king’s presence. She was to earnestly ask for his favor and petition him concerning her people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a copy of the written decree that had been issued in Susa for their destruction
  simplified_phrase: a copy of the decree issued in Susa that ordered their destruction
  preserved_meaning: The official document called for their destruction.
  reasoning_layer_used: POB lexical decisions for פַּתְשֶׁגֶן כְּתָב, הַדָּת, נִתַּן, and לְהַשְׁמִידָם
  rationale: This removes redundant wording while retaining the decree’s official and lethal force.
- pob_phrase: to show Esther and tell her, and to instruct her to go in to the king
  simplified_phrase: He was to show it to Esther, tell her about it, and instruct her to enter the king’s presence.
  preserved_meaning: The messenger must present the decree, report it, and convey Mordecai’s direction that Esther enter the royal presence.
  reasoning_layer_used: POB lexical decisions, doctrine-realignment revision, and immediate context in Esther 4:11
  rationale: The new sentence clarifies the actions while preserving the consequential court-access sense.
- pob_phrase: to implore his favor and seek from before him concerning her people
  simplified_phrase: She was to earnestly ask for his favor and petition him concerning her people.
  preserved_meaning: Esther must urgently seek royal favor regarding her people while before the king.
  reasoning_layer_used: POB lexical decisions, cultural note, and latest revision
  rationale: Plain court language replaces the opaque idiom while retaining earnest supplication and the documented ambiguity of “concerning.”
translation_notes:
  risk_flags:
  - risk: “Petition him” states the function of the courtly phrase more directly than its source-language image.
    mitigation: “Enter the king’s presence” preserves the setting of a formal request made before the king.
  - risk: “Concerning her people” may sound less explicitly advocative than “on behalf of her people.”
    mitigation: This preserves the POB’s documented ambiguity rather than resolving it.
