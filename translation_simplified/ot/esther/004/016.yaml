translation:
  language: en
  text: Go, gather all the Jews in Susa, and tell them to fast for me. Do not eat or drink for three days, night or day. The young women with me and I will fast in the same way. Then I will go to the king, even though this is against the law. And if I die, I die.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “When I die, I die.” The Hebrew is brief and emphatic, showing Esther’s acceptance of the risk.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the Jews who are found in Susa, and fast for me
  simplified_phrase: all the Jews in Susa, and tell them to fast for me
  preserved_meaning: Every Jew present in Susa is to join the fast for Esther.
  reasoning_layer_used: POB lexical decisions for הַנִּמְצְאִים and וְצוּמוּ עָלַי
  rationale: The approved wording removes an unnatural phrase while keeping the Jews as those commanded to fast.
- pob_phrase: I and my young women also will fast in the same way
  simplified_phrase: The young women with me and I will fast in the same way
  preserved_meaning: Esther and the women accompanying her will observe the same fast.
  reasoning_layer_used: POB lexical decisions for נַעֲרֹתַי and אָצוּם כֵּן
  rationale: Natural word order and “with me” clarify the relationship without assigning a formal court rank.
- pob_phrase: though it is not according to the law
  simplified_phrase: even though this is against the law
  preserved_meaning: Esther will approach the king despite the action being unlawful.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר לֹא כַדָּת
  rationale: The approved alternative states the legal danger in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Tell them to fast” makes Mordecai’s role explicit beyond the compressed Hebrew coordination.
    mitigation: The narrative setting requires Mordecai to relay Esther’s plural command to the gathered Jews.
  - risk: “If I die” is narrower than the traditional “if I perish.”
    mitigation: The immediate context concerns mortal danger, and the repeated wording preserves Esther’s emphatic resolve.
