translation:
  language: en
  text: In every province reached by the king’s proclamation and decree, the Jews mourned deeply. They fasted, wept, and wailed. Sackcloth and ashes were spread out for many.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth was rough cloth used in mourning. The Hebrew may mean that sackcloth and ashes were spread out for many or that many people used them.
    reason: lexical_alternative
