translation:
  language: en
  text: For if you remain silent now, relief and rescue for the Jews will come from somewhere else. But you and your father’s family will perish. And who knows whether you have come to your royal position for a time like this?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: keep silent at this time
  simplified_phrase: remain silent now
  preserved_meaning: Esther would refuse to act during the present crisis.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: “Now” expresses the crisis timing more directly.
- pob_phrase: relief and deliverance will arise for the Jews from another place
  simplified_phrase: relief and rescue for the Jews will come from somewhere else
  preserved_meaning: The Jews will receive both respite and rescue from an unspecified source.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording is natural while keeping the source of help deliberately unnamed.
- pob_phrase: you and your father's house ... attained royalty
  simplified_phrase: you and your father’s family ... come to your royal position
  preserved_meaning: Esther’s paternal family is threatened, and her royal status may fit this crisis.
  reasoning_layer_used: Hebrew kinship and royal-office lexical decisions
  rationale: The clearer phrases preserve both the family line and Esther’s royal office.
