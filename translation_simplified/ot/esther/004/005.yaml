translation:
  language: en
  text: Then Esther summoned Hathach,[a] one of the king’s eunuchs whom the king had assigned to serve her. She ordered him to find out what was happening with Mordecai and why.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one of the king’s court officials.” The Hebrew word may refer specifically to a eunuch or more generally to a royal official.
    reason: lexical_alternative
