translation:
  language: en
  text: 'Couriers carried letters to every one of the king’s provinces. The letters ordered that all the Jews—young men and old men, children and women—be destroyed, killed, and annihilated on a single day: the thirteenth day of the twelfth month, the month of Adar. Their goods were also to be taken as plunder.'
  philosophy: optimal-equivalence
