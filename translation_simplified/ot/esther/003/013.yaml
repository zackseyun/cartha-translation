  preserved_meaning: Couriers delivered the letters throughout the king’s provinces.
  reasoning_layer_used: POB lexical decisions for בְּיַד הָרָצִים and אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  rationale: Active wording replaces the opaque hand idiom while preserving the couriers’ role.
- pob_phrase: to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women
  simplified_phrase: all the Jews—young men and old men, children and women—be destroyed, killed, and annihilated
  preserved_meaning: The decree targeted the entire Jewish population with total destruction.
  reasoning_layer_used: POB lexical decisions for לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד, מִנַּעַר וְעַד זָקֵן, and טַף וְנָשִׁים
  rationale: The parallel list clearly names every group while retaining the deliberate threefold violence.
- pob_phrase: and to plunder their spoil
