  preserved_meaning: The decree authorized the seizure of Jewish property as plunder.
  reasoning_layer_used: POB lexical decision for וּשְׁלָלָם לָבוֹז
  rationale: Goods makes the object of the sanctioned looting clear while preserving the plunder image.
