  text: In the twelfth year of King Ahasuerus, during the first month, Nisan, Pur—that is, the lot—was cast in Haman’s presence. The lot-casting went through the days and months until it reached the twelfth month, Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “from day to day and from month to month, twelve, that is, the month of Adar.” The wording indicates that the lot-casting moved through the calendar until the twelfth month.
    reason: lexical_alternative
