translation:
  language: en
  text: Then the king said to Haman, “The silver[a] is yours, and so are the people. Do with them whatever you think best.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The money.” The Hebrew word can mean silver itself or money made from it.
    reason: lexical_alternative
