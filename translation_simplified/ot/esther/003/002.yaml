translation:
  language: en
  text: All the king’s court servants at the king’s gate regularly bowed low before Haman and showed him honor,[a] because the king had ordered that Haman be honored in this way.[b] But Mordecai refused to bow down or show him honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also describe prostrating oneself; when directed to God, the same word can mean worship.
    reason: lexical_alternative
  - marker: b
    text: Or “because the king had given this command to him,” though the command most likely concerned the honor due to Haman.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all the king’s servants who were at the king’s gate
  simplified_phrase: all the king’s court servants at the king’s gate
  preserved_meaning: The group is royal court personnel located at the administrative gate.
  reasoning_layer_used: POB lexical decisions for עַבְדֵי and בְּשַׁעַר הַמֶּלֶךְ
  rationale: “Court servants” keeps the bounded royal setting without implying domestic or bonded service.
- pob_phrase: were bowing down and paying homage to Haman
  simplified_phrase: regularly bowed low before Haman and showed him honor
  preserved_meaning: They customarily performed a physical act of submission and honored Haman.
  reasoning_layer_used: POB lexical and theological decisions for כֹּרְעִים and וּמִשְׁתַּחֲוִים
  rationale: The wording preserves both the bodily gesture and courtly honor without asserting worship.
- pob_phrase: would not bow down or pay homage
  simplified_phrase: refused to bow down or show him honor
  preserved_meaning: Mordecai deliberately and characteristically withheld both forms of submission.
  reasoning_layer_used: POB lexical decision for לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  rationale: “Refused” clearly expresses the deliberate force of “would not.”
interpretive_expansions:
- pob_phrase: the king had so commanded concerning him
  rendering: the king had ordered that Haman be honored in this way
  claim: The royal command concerned the honor others were to give Haman.
  evidence:
  - The POB pronoun rationale identifies Haman as the most natural referent.
  - The surrounding actions show what the commanded honor involved.
  confidence: high
  alternatives_preserved:
  - The king had given this command to him.
translation_notes:
  risk_flags:
  - risk: “Showed him honor” may understate the physical force of prostration.
    mitigation: “Bowed low” retains the bodily image, and footnote [a] gives the stronger alternative.
  - risk: The pronoun in the command clause can refer to the person who received the command.
    mitigation: Footnote [b] preserves that less likely reading.
