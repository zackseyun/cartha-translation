translation:
  language: en
  text: Day after day, they spoke to Mordecai, but he refused to listen. So they told Haman. They wanted to see whether Mordecai’s words would stand.[a] This was because Mordecai had told them that he was a Jew.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean whether Mordecai’s explanation would hold up or whether he would maintain his stand under pressure.
    reason: lexical_alternative
