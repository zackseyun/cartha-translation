translation:
  language: en
  text: Then Haman said to King Ahasuerus, “One particular people is scattered and separate among the other peoples throughout all the provinces of your kingdom. Their laws are unlike the laws of any other people, and they do not obey the king’s laws. So it is not in the king’s interest to allow them to remain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to leave them alone” or “to tolerate them.” The Hebrew can mean allowing them to remain undisturbed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There is a certain people
  simplified_phrase: One particular people
  preserved_meaning: Haman points vaguely but deliberately to a single ethnic group.
  reasoning_layer_used: POB lexical decision for יֶשְׁנוֹ עַם אֶחָד
  rationale: “One particular people” expresses the insinuating introduction in more natural English.
- pob_phrase: Their laws are different from those of every other people
  simplified_phrase: Their laws are unlike the laws of any other people
  preserved_meaning: Haman claims that this people’s laws differ from every other group’s laws.
  reasoning_layer_used: POB lexical decision for שֹׁנוֹת מִכָּל עָם
  rationale: Repeating “laws” makes the comparison immediately clear.
- pob_phrase: they do not keep the king’s laws
  simplified_phrase: they do not obey the king’s laws
  preserved_meaning: Haman accuses the people of failing to follow royal law.
  reasoning_layer_used: POB lexical decision for אֵינָם עֹשִׂים
  rationale: “Obey” communicates legal compliance more directly to modern readers.
translation_notes:
  risk_flags:
  - risk: “Separate” could be mistaken for internal division or deliberate isolation.
    mitigation: The wording keeps it paired with “scattered” and places the people among other ethnic groups.
  - risk: “Allow them to remain” does not display the full range of the Hebrew verb.
    mitigation: The footnote preserves the alternatives “leave them alone” and “tolerate them.”
