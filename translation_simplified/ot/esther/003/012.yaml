translation:
  language: en
  text: On the thirteenth day of the first month, the king’s scribes were summoned. The decree was written exactly as Haman commanded. It was addressed to the king’s regional rulers,[a] the governors over each province, and the officials of each people. It was written for every province in its own writing system and for every people in its own language. The decree was written in the name of King Ahasuerus and sealed with the king’s signet ring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The original title is “satraps,” Persian regional rulers distinct from the governors listed next.
    reason: cultural_note
