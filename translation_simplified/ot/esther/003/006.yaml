- pob_phrase: it seemed contemptible in his eyes to lay a hand on Mordecai alone
  simplified_phrase: Haman thought attacking Mordecai alone was beneath him
  preserved_meaning: Haman disdainfully regarded Mordecai alone as too limited a target for violence.
  reasoning_layer_used: lexical decisions for וַיִּבֶז בְּעֵינָיו, לִשְׁלֹחַ יָד בְּ, and לְבַדּוֹ
  rationale: The rewrite uses a natural English judgment and makes the threatened violence clear.
- pob_phrase: because they had told him what people Mordecai belonged to
  simplified_phrase: because he had been told which people Mordecai belonged to
  preserved_meaning: Haman broadened his target after learning Mordecai’s ethnic identity.
  reasoning_layer_used: lexical decision for כִּי הִגִּידוּ לוֹ and אֶת עַם מָרְדֳּכָי
  rationale: The passive wording is smoother while leaving the unnamed informants unspecified.
- pob_phrase: Haman sought to destroy
  simplified_phrase: Haman set out to destroy
  preserved_meaning: Haman formed a purposeful plan for the Jews’ destruction without implying that he succeeded.
