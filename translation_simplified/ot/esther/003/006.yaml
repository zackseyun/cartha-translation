translation:
  language: en
  text: But Haman thought attacking Mordecai alone was beneath him, because he had been told which people Mordecai belonged to. So Haman set out to destroy all the Jews throughout the whole kingdom of Ahasuerus—Mordecai’s people.
  philosophy: optimal-equivalence
