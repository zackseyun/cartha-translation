translation:
  language: en
  text: The king got up from the wine banquet in a rage and went into the palace garden. Haman stayed behind to beg Queen Esther to spare his life, because he realized that the king had decided to bring disaster on him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: rose in his wrath
  simplified_phrase: got up ... in a rage
  preserved_meaning: The king rose abruptly in intense anger.
  reasoning_layer_used: lexical decision for בַּחֲמָתוֹ
  rationale: “In a rage” expresses the force of wrath in familiar English.
- pob_phrase: remained to beg Queen Esther for his life
  simplified_phrase: stayed behind to beg Queen Esther to spare his life
  preserved_meaning: Haman remained after the king left and desperately pleaded not to be killed.
  reasoning_layer_used: lexical decisions for עָמַד and לְבַקֵּשׁ עַל נַפְשׁוֹ
  rationale: The wording makes the contrast and the life-or-death plea immediately clear.
- pob_phrase: the evil against him had been determined by the king
  simplified_phrase: the king had decided to bring disaster on him
  preserved_meaning: The king’s adverse judgment against Haman was settled.
  reasoning_layer_used: lexical decisions for כִּי כָלְתָה, הָרָעָה, and מֵאֵת הַמֶּלֶךְ
  rationale: The active sentence clearly conveys both impending calamity and the king’s fixed decision.
