translation:
  language: en
  text: For my people and I have been sold to be destroyed, killed, and wiped out. But if we had been sold into slavery, men and women alike, I would have said nothing. But this enemy is not worth the harm to the king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the king’s loss.” The Hebrew may refer to harm, injury, or financial loss.
    reason: lexical_alternative
