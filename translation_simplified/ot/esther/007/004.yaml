  simplified_phrase: my people and I have been sold
  preserved_meaning: Esther identifies herself with her threatened people while retaining the commercial image.
  reasoning_layer_used: POB lexical decisions for נִמְכַּרְנוּ and עַמִּי
  rationale: Natural English order makes Esther’s identification clear.
- pob_phrase: to be destroyed, to be killed, and to perish
  simplified_phrase: to be destroyed, killed, and wiped out
  preserved_meaning: The three verbs still emphasize killing and complete loss.
  reasoning_layer_used: POB lexical decision for לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  rationale: Concise parallel wording preserves the force of the threefold expression.
- pob_phrase: as male slaves and female slaves, I would have kept silent
  simplified_phrase: into slavery, men and women alike, I would have said nothing
  preserved_meaning: The hypothetical includes forced servitude for both sexes and Esther’s counterfactual silence.
  reasoning_layer_used: POB lexical decisions for לַעֲבָדִים וְלִשְׁפָחוֹת and הֶחֱרַשְׁתִּי
  rationale: Common wording retains both groups without the unsupported word “only.”
