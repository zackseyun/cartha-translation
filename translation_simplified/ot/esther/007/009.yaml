translation:
  language: en
  text: 'Then Harbonah, one of the eunuchs who served the king, said, “Also, look! At Haman’s house stands the gallows he made for Mordecai, who had spoken in the king’s favor. It is about seventy-five feet high.[a]”


    The king said, “Hang him on it.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “fifty cubits,” about twenty-three meters.
    reason: cultural_note
  - marker: b
    text: The ancient execution may have involved hanging or impalement on a wooden structure.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one of the eunuchs before the king
  simplified_phrase: one of the eunuchs who served the king
  preserved_meaning: Harbonah was a eunuch attending the royal court.
  reasoning_layer_used: Lexical decision for לִפְנֵי הַמֶּלֶךְ and its court setting.
  rationale: This explains the court relationship in natural English.
- pob_phrase: Also, behold ... who spoke good for the king
  simplified_phrase: Also, look! ... who had spoken in the king’s favor
  preserved_meaning: Harbonah adds a decisive fact about Mordecai’s beneficial action toward the king.
  reasoning_layer_used: Lexical decisions for גַּם הִנֵּה and דִּבֶּר טוֹב עַל הַמֶּלֶךְ.
  rationale: This preserves the additive emphasis while replacing two awkward expressions.
- pob_phrase: fifty cubits high
  simplified_phrase: about seventy-five feet high
  preserved_meaning: The gallows was extraordinarily high.
  reasoning_layer_used: The lexical decision documents this modern equivalent.
  rationale: A familiar measure makes the height immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Gallows” may suggest a later-style scaffold more specifically than the Hebrew does.
    mitigation: Footnote b preserves the broader possibility of hanging or impalement on wood.
  - risk: Converting cubits gives an approximate rather than exact modern height.
    mitigation: The text says “about,” and footnote a retains the Hebrew measurement.
