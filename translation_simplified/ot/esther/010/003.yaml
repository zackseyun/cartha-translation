  text: For Mordecai the Jew was second only to King Ahasuerus. He was prominent among the Jews and had the approval of a great number of his fellow Jews.[a] He worked for the good of his people and spoke words of peace and well-being to all his descendants.[b]
  philosophy: optimal-equivalence
  footnotes:
