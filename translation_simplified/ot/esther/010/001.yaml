translation:
  language: en
  text: King Ahasuerus required people throughout the land and the islands of the sea to pay tribute.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “coastlands” rather than “islands of the sea.”
    reason: lexical_alternative
  - marker: b
    text: Tribute was a payment demanded by a ruler; the Hebrew may also mean “tax,” “levy,” or, in some contexts, forced labor.
    reason: simplification_note
simplification_decisions:
- pob_phrase: imposed tribute on
  simplified_phrase: required people ... to pay tribute
  preserved_meaning: The king compelled those under his rule to provide an imperial payment.
  reasoning_layer_used: POB lexical decision for וַיָּשֶׂם מַס עַל
  rationale: This wording explains the taxation idiom while retaining the imperial force of “tribute.”
- pob_phrase: the land and the islands of the sea
  simplified_phrase: throughout the land and the islands of the sea
  preserved_meaning: The demand extended across mainland and maritime territories.
  reasoning_layer_used: POB lexical decisions for הָאָרֶץ וְאִיֵּי הַיָּם
  rationale: “Throughout” makes the territories the levy’s scope while preserving the geographic image.
interpretive_expansions:
- pob_phrase: imposed tribute on the land and the islands of the sea
  rendering: required people throughout the land and the islands of the sea to pay tribute
