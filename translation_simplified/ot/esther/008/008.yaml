translation:
  language: en
  text: But you may write a document concerning the Jews in whatever way you think best. Write it in the king’s name and seal it with his signet ring.[a] A document written in the king’s name and sealed with his signet ring cannot be revoked.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A signet ring was used to stamp the king’s official seal on a document.
    reason: cultural_note
