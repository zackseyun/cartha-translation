translation:
  language: en
  text: The king authorized the Jews in every single city to gather together and stand up for their lives. They could destroy, kill, and wipe out every armed force from any people or province that might attack them,[a] including children and women,[b] and take their possessions as plunder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “that was hostile to them.”
    reason: lexical_alternative
  - marker: b
    text: The decree explicitly includes children and women within the enemy group described.
    reason: cultural_note
simplification_decisions:
- pob_phrase: granted the Jews ... to assemble
  simplified_phrase: authorized the Jews ... to gather together
  preserved_meaning: The king gave the Jews legal permission to gather in every city.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר נָתַן and לְהִקָּהֵל
  rationale: “Authorized” makes the royal legal action clear, while “gather together” is more familiar than “assemble.”
- pob_phrase: to stand for their lives
  simplified_phrase: stand up for their lives
  preserved_meaning: The Jews were permitted to act in defense of their lives.
  reasoning_layer_used: Lexical and theological decisions for וְלַעֲמֹד עַל נַפְשָׁם
  rationale: Adding “up” makes the image natural in English without replacing it with a flat explanation.
- pob_phrase: to annihilate ... and to plunder their spoil
  simplified_phrase: wipe out ... and take their possessions as plunder
  preserved_meaning: The decree authorized complete lethal destruction and seizure of the enemy group’s goods.
  reasoning_layer_used: Lexical decisions for לְאַבֵּד and וּשְׁלָלָם לָבוֹז
  rationale: The wording replaces difficult terms while keeping both the severity and the distinct act of plunder.
translation_notes:
  risk_flags:
  - risk: “Wipe out” may sound less formal than “annihilate.”
    mitigation: The full three-verb sequence preserves the decree’s cumulative violent force.
  - risk: Readers may assume the reference to children and women is a later explanation.
    mitigation: The main text and footnote state that the decree itself includes them in the targeted group.
