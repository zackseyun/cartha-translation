  preserved_meaning: The date remains the twenty-third day of Sivan, the third month.
  reasoning_layer_used: POB lexical decision and applied revision
  rationale: The reordered date follows natural English while retaining every time detail.
- pob_phrase: the satraps, the governors, and the officials of the provinces
  simplified_phrase: the regional rulers, governors, and officials
  preserved_meaning: The decree addresses the same three groups of imperial administrators.
  reasoning_layer_used: POB lexical decisions and cultural context
  rationale: The unfamiliar title is explained in common language and retained in a note.
- pob_phrase: one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language
  simplified_phrase: all 127 provinces ... for each province in its own script and for each people in its own language
  preserved_meaning: The decree covers every province and uses the appropriate scripts and languages.
  reasoning_layer_used: POB lexical decisions
  rationale: The shorter wording preserves the empire-wide scope and the script-language distinction.
