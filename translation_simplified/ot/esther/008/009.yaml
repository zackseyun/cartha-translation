translation:
  language: en
  text: At that time, on the twenty-third day of the third month, the month of Sivan, the king’s scribes were summoned. A decree was written exactly as Mordecai commanded. It was written to the Jews and to the regional rulers,[a] governors, and officials of all 127 provinces from India to Cush.[b] It was written for each province in its own script and for each people in its own language. It was also written for the Jews in their own script and language.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Persian title for these regional rulers was “satraps.”
    reason: cultural_note
  - marker: b
    text: Cush was an ancient region south of Egypt, sometimes translated “Ethiopia.”
    reason: lexical_alternative
