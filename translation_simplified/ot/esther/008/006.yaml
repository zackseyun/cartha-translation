translation:
  language: en
  text: For how could I endure watching disaster strike my people? How could I endure watching my own kin be destroyed?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my people by birth” or “my relatives.” The Hebrew can refer broadly to one’s people or kin, not only to a birthplace.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bear to see
  simplified_phrase: endure watching
  preserved_meaning: Esther cannot bear being forced to witness the threatened calamity.
  reasoning_layer_used: Lexical decision for אוּכַל and וְרָאִיתִי
  rationale: The wording makes the emotional force natural without reducing it to mere ability.
- pob_phrase: the disaster that will come upon my people
  simplified_phrase: disaster strike my people
  preserved_meaning: A future calamity threatens Esther’s people.
  reasoning_layer_used: Lexical decisions for בָּרָעָה and אֲשֶׁר יִמְצָא
  rationale: “Strike” expresses the Hebrew idiom in direct modern English.
- pob_phrase: the destruction of my kindred
  simplified_phrase: my own kin be destroyed
  preserved_meaning: Esther faces the destruction of those connected to her by birth.
  reasoning_layer_used: Lexical decisions for בְּאָבְדַן and מוֹלַדְתִּי
  rationale: The active wording is easier to grasp while “kin” keeps the familial and ethnic scope.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “kin” to mean only immediate relatives.
    mitigation: The footnote preserves the broader sense of Esther’s people by birth.
