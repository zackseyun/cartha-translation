translation:
  language: en
  text: Then King Ahasuerus said to Queen Esther and Mordecai the Jew, “See, I have given Haman’s estate to Esther. Haman was hanged on the gallows[a] because he raised his hand against the Jews.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “on the tree,” referring here to Haman’s wooden execution structure.
    reason: lexical_alternative
