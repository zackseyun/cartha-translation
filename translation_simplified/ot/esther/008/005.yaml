translation:
  language: en
  text: She said, “If the king approves, if I have found favor with him, if he considers this request right, and if he is pleased with me, let it be put in writing that the letters devised by Haman son of Hammedatha the Agagite are canceled.[a] He wrote them to destroy the Jews throughout all the king’s provinces.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “reversed”; the Hebrew can mean turning back or revoking an official document.
    reason: lexical_alternative
