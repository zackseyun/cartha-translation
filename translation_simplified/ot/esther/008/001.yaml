translation:
  language: en
  text: That same day, King Ahasuerus gave Queen Esther Haman’s estate. Haman had been the enemy of the Jews. Mordecai came before the king because Esther had told the king how he was related to her.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the house of Haman
  simplified_phrase: Haman’s estate
  preserved_meaning: The king transferred Haman’s household property to Esther without asserting that it included every possession.
  reasoning_layer_used: source wording and immediate context
  rationale: “Estate” conveys more than a residence while avoiding the unsupported totality of “all.”
- pob_phrase: Mordecai came before the king
  simplified_phrase: Mordecai came before the king
  preserved_meaning: Mordecai actively entered the king’s presence for a royal audience.
  reasoning_layer_used: source wording and grounding review
  rationale: The active wording avoids implying that unnamed attendants brought him in.
- pob_phrase: what he was to her
  simplified_phrase: how he was related to her
  preserved_meaning: Esther disclosed her relationship with Mordecai.
  reasoning_layer_used: source wording and immediate context
  rationale: The Hebrew relational idiom is expressed in natural modern English.
interpretive_expansions:
- pob_phrase: the house of Haman
  rendering: Haman’s estate
  claim: Haman’s “house” denotes his household property rather than only his residence.
  evidence:
  - The king transfers it to Esther after Haman’s downfall.
  confidence: high
  alternatives_preserved:
  - Haman’s household property
translation_notes:
  risk_flags:
  - risk: “Estate” interprets the broader sense of “house.”
    mitigation: The immediate context supports household property, while the wording avoids claiming total ownership.
