translation:
  language: en
  text: Then Mordecai returned to the king’s gate. But Haman hurried[a] home in grief, with his head covered.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was driven home,” preserving the passive force of the Hebrew verb.
    reason: lexical_alternative
  - marker: b
    text: Covering the head was a sign of grief, shame, or humiliation.
    reason: cultural_note
