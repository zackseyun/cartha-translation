translation:
  language: en
  text: They found a written record that said Mordecai had reported about Bigthana and Teresh,[a] two of the king’s eunuchs[b] who served as entrance guards. The record said that these men had sought to harm King Ahasuerus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this verse the Hebrew form of the name is Bigthana; elsewhere it appears as Bigthan.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term may also mean royal court officials more broadly.
    reason: lexical_alternative
