translation:
  language: en
  text: Zeresh, Haman’s wife, and all his friends said to him, “Have a gallows built fifty cubits—about 75 feet (23 meters)—high.[a] In the morning, tell the king to have Mordecai hanged on it.[b] Then go joyfully with the king to the banquet.” Haman liked the plan, and he made the gallows.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to a gallows, wooden stake, or pole; its exact form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that Mordecai was to be impaled or suspended on the wooden structure.
    reason: alternative_reading
