translation:
  language: en
  text: On the third day, Esther dressed in her royal robes. She stood in the inner courtyard of the king’s palace, facing the palace building. Inside, the king was sitting on his royal throne, facing its entrance.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: put on her royal robes and stood
  simplified_phrase: dressed in her royal robes. She stood
  preserved_meaning: Esther put on royal clothing before taking her place in the court.
  reasoning_layer_used: POB lexical decision for וַתִּלְבַּשׁ ... מַלְכוּת
  rationale: Two sentences make the sequence easier to follow.
- pob_phrase: opposite the king’s house
  simplified_phrase: facing the palace building
  preserved_meaning: Esther stood across from and oriented toward the king’s palace building.
  reasoning_layer_used: POB lexical decisions for נֹכַח and בֵּית
  rationale: This wording clarifies the spatial arrangement of the palace court.
- pob_phrase: while the king was sitting on his royal throne in the royal house, opposite the entrance of the house
  simplified_phrase: Inside, the king was sitting on his royal throne, facing its entrance
  preserved_meaning: The king was already seated inside the royal building, with his throne oriented toward its entrance.
  reasoning_layer_used: POB lexical decisions for וְהַמֶּלֶךְ יֹשֵׁב, בְּבֵית הַמַּלְכוּת, and נֹכַח פֶּתַח הַבָּיִת
  rationale: “Was sitting” preserves simultaneity while the shorter wording removes opaque repetition.
translation_notes:
  risk_flags:
  - risk: “Palace building” interprets Hebrew “house” as a building within the palace complex.
    mitigation: This follows the POB rationale that “house” denotes the palace in this court setting.
  - risk: “Inside” compresses the distinct phrase “in the royal house.”
    mitigation: The wording retains the king’s indoor location and orientation toward the entrance.
