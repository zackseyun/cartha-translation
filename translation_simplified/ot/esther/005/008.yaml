translation:
  language: en
  text: If the king looks favorably on me, and if he is pleased to grant my petition and fulfill my request, may the king and Haman come to the banquet I will prepare for them. Tomorrow I will do as the king has said.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means that Esther will respond to the king by making her petition known, but the Hebrew leaves the wording open.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If I have found favor in the eyes of the king
  simplified_phrase: If the king looks favorably on me
  preserved_meaning: Esther respectfully appeals to the king’s favorable regard while retaining the image of sight.
  reasoning_layer_used: POB lexical decision for מָצָאתִי חֵן בְּעֵינֵי
  rationale: The active wording is easier to understand while preserving the courtly idiom and its image.
- pob_phrase: and if it pleases the king to grant my petition and fulfill my request
  simplified_phrase: and if he is pleased to grant my petition and fulfill my request
  preserved_meaning: Esther deferentially asks the king to approve and carry out what she seeks.
  reasoning_layer_used: POB lexical decisions for עַל הַמֶּלֶךְ טוֹב and the paired request terms
  rationale: Using “he” reduces repetition while keeping the two distinct request expressions.
- pob_phrase: I will do according to the king’s word
  simplified_phrase: I will do as the king has said
  preserved_meaning: Esther promises to respond to the king’s stated desire without specifying exactly how.
  reasoning_layer_used: POB lexical decision for וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  rationale: The natural English wording retains the source phrase’s deliberate openness.
translation_notes:
  risk_flags:
