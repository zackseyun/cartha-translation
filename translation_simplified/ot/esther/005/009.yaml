translation:
  language: en
  text: Haman left that day happy and in high spirits. But when Haman saw Mordecai at the king’s gate and saw that Mordecai did not stand up or tremble before him,[a] Haman was filled with rage against Mordecai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “show fear before him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: joyful and glad of heart
  simplified_phrase: happy and in high spirits
  preserved_meaning: Haman left in an intensely cheerful, elated mood.
  reasoning_layer_used: POB lexical decision for שָׂמֵחַ וְטוֹב לֵב
  rationale: This common idiom naturally conveys the paired expression’s emotional intensity.
- pob_phrase: he did not rise
  simplified_phrase: Mordecai did not stand up
  preserved_meaning: Mordecai withheld the expected gesture of deference.
  reasoning_layer_used: POB lexical decision for וְלֹא קָם
  rationale: “Stand up” makes the social gesture clear in modern English.
- pob_phrase: when Haman saw Mordecai ... and that he did not rise
  simplified_phrase: when Haman saw Mordecai ... and saw that Mordecai did not stand up
  preserved_meaning: Mordecai’s refusal to show deference was part of what Haman observed.
  reasoning_layer_used: POB syntax and independent grounding review
  rationale: Repeating “saw” preserves the observed relationship and avoids implying a later action.
translation_notes:
  risk_flags:
  - risk: “Tremble” may sound only physical rather than expressing fearful deference.
    mitigation: The footnote preserves the documented alternative “show fear before him.”
