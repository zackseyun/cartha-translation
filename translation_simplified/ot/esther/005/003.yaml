translation:
  language: en
  text: Then the king asked her, “What is it, Queen Esther? What do you want to ask for? It will be given to you—even up to half the kingdom.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Up to half the kingdom” was a customary royal way of making a generous promise, not necessarily a literal offer to divide the kingdom.
    reason: cultural_note
