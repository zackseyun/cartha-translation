translation:
  language: en
  text: At the wine banquet, the king said to Esther, “What are you asking for? I will grant it. What is your request? Even if you ask for up to half the kingdom, your request will be fulfilled.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What is your petition? It will be granted to you.
  simplified_phrase: What are you asking for? I will grant it.
  preserved_meaning: The king asks what Esther wants and assures her that he will grant it.
  reasoning_layer_used: Lexical decisions for שְּׁאֵלָתֵךְ and וְיִנָּתֵן לָךְ
  rationale: Common wording replaces formal court language while preserving the royal assurance.
- pob_phrase: Even up to half the kingdom, it will be done.
  simplified_phrase: Even if you ask for up to half the kingdom, your request will be fulfilled.
  preserved_meaning: The king offers to fulfill Esther’s request even if it reaches the stated extraordinary limit.
  reasoning_layer_used: Lexical decisions for עַד חֲצִי הַמַּלְכוּת and וְתֵעָשׂ
  rationale: Naming Esther’s request removes ambiguous pronouns while retaining “the kingdom” without adding “my.”
interpretive_expansions:
- pob_phrase: It will be granted to you.
  rendering: I will grant it.
  claim: The king identifies himself as the one who will authorize the request.
  evidence:
  - The king speaks the assurance directly to Esther.
  - The POB rationale identifies the clause as a royal assurance.
  confidence: high
  alternatives_preserved:
  - It will be granted to you.
  - It will be given to you.
- pob_phrase: Even up to half the kingdom, it will be done.
  rendering: Even if you ask for up to half the kingdom, your request will be fulfilled.
  claim: The stated limit describes the possible extent of Esther’s request.
  evidence:
  - The phrase follows the king’s question about Esther’s request.
  - The POB rationale describes the formula as the extent of his willingness to fulfill it.
  confidence: high
  alternatives_preserved:
  - Even up to half the kingdom, it will be done.
translation_notes:
  risk_flags:
