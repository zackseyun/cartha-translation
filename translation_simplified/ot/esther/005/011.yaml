translation:
  language: en
  text: Haman told them about his magnificent wealth and his many sons. He also told them everything the king had done to make him important and how the king had raised him above the king’s officials and servants.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the glory of his wealth
  simplified_phrase: his magnificent wealth
  preserved_meaning: His riches carried impressive splendor and status.
  reasoning_layer_used: Lexical decision for כְּבוֹד עָשְׁרוֹ and footnote a.
  rationale: “Magnificent wealth” conveys the impressive display of his riches in ordinary English.
- pob_phrase: the multitude of his sons
  simplified_phrase: his many sons
  preserved_meaning: Haman spoke specifically of having numerous sons.
  reasoning_layer_used: Lexical decision for רֹב בָּנָיו and footnote b.
  rationale: “Many sons” keeps both the abundance and the male reference.
- pob_phrase: all that the king had done to make him great, and how he had exalted him above
  simplified_phrase: everything the king had done to make him important and how the king had raised him above
  preserved_meaning: The king made Haman prominent and separately gave him superior court rank.
  reasoning_layer_used: Lexical decisions for גִּדְּלוֹ and נִשְּׂאוֹ עַל.
  rationale: The wording clarifies Haman’s prominence while preserving the two coordinated ideas.
interpretive_expansions:
- pob_phrase: make him great
  rendering: make him important
  claim: In this court setting, greatness includes prominence, honor, and elevated status.
  evidence:
  - The lexical rationale gives the senses “make great,” “promote,” and “elevate.”
  - The next clause places Haman above the king’s officials and servants.
  confidence: high
  alternatives_preserved:
  - make him great
  - promote him
translation_notes:
  risk_flags:
  - risk: “Important” does not express every possible nuance of “great.”
    mitigation: The separate clause about being raised above royal personnel preserves Haman’s elevated rank.
