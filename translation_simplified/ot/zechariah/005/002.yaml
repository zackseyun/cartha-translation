translation:
  language: en
  text: He asked me, “What do you see?” I answered, “I see a flying scroll. It is twenty cubits[a] long and ten cubits wide.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was an ancient unit based roughly on the distance from the elbow to the fingertips. Twenty cubits was about 30 feet (9 meters).
    reason: cultural_note
