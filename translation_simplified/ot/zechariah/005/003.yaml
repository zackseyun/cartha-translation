translation:
  language: en
  text: Then he said to me, “This curse is going out across the whole land.[a] Everyone who steals will be removed as punishment, just as the writing on one side of the scroll says. Everyone who swears falsely will also be removed as punishment, just as the writing on the other side says.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole earth.” The Hebrew word can mean either “land” or “earth.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: goes out over the face of the whole land
  simplified_phrase: is going out across the whole land
  preserved_meaning: The curse continues to spread throughout the land.
  reasoning_layer_used: lexical decision for הַיּוֹצֵאת and theological decision on the scope of הָאָרֶץ
  rationale: “Across” expresses the spatial image in natural modern English while retaining “land.”
- pob_phrase: will be purged away
  simplified_phrase: will be removed as punishment
  preserved_meaning: The curse judicially removes the offender rather than declaring the offender innocent.
  reasoning_layer_used: lexical and theological decisions for נִקָּה
  rationale: The clearer wording preserves the punitive force without using the opaque phrase “purged away.”
- pob_phrase: according to what is written on this side of it … on that side of it
  simplified_phrase: just as the writing on one side of the scroll says … on the other side says
  preserved_meaning: Each offense is condemned by writing on a different side of the flying scroll.
  reasoning_layer_used: lexical decisions for מִזֶּה ... כָּמוֹהָ and the restored revision
  rationale: Naming the scroll and contrasting its two sides makes the elliptical references easy to follow.
interpretive_expansions:
- pob_phrase: will be purged away
  rendering: will be removed as punishment
  claim: The removal is a judicial penalty imposed by the curse.
  evidence:
  - The immediate context presents a curse directed against offenders.
  - The POB theological decision rejects an acquittal sense for נִקָּה.
  confidence: high
  alternatives_preserved:
  - will be cleared away
  - will be cut off
translation_notes:
  risk_flags:
  - risk: “Land” may be read too narrowly because the Hebrew can also mean “earth.”
    mitigation: The footnote preserves the broader alternative.
  - risk: “Removed as punishment” does not specify the form of removal.
    mitigation: The wording preserves the judgment while avoiding an unsupported description of its exact outcome.
