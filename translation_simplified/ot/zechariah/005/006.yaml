- pob_phrase: And I said ... And he said ... And he said
  simplified_phrase: I asked ... He answered ... Then he said
  preserved_meaning: The speaker asks a question, and the other figure gives two statements in sequence.
  reasoning_layer_used: POB translation and immediate discourse
  rationale: Ordinary dialogue verbs clarify the exchange without changing who speaks.
- pob_phrase: the basket that is going out
  simplified_phrase: the basket moving out
  preserved_meaning: The visionary basket is proceeding outward.
  reasoning_layer_used: Lexical decision for הַיּוֹצֵאת
  rationale: “Moving out” makes the basket’s motion natural and clear in English.
- pob_phrase: This is their appearance in all the land
  simplified_phrase: This is what they look like throughout the land
  preserved_meaning: The main text understands the difficult Hebrew “their eye” as their visible appearance.
  reasoning_layer_used: Lexical and theological decisions for עֵינָם and בְּכָל הָאָרֶץ
  rationale: The clause becomes understandable while retaining “land” and the chosen appearance reading.
