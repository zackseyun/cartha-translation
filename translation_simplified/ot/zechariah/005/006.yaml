translation:
  language: en
  text: I asked, “What is it?” He answered, “This is the basket[a] moving out.” Then he said, “This is what they look like throughout the land.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “ephah,” a dry measure that can also mean the measuring basket itself.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says “This is their eye”; some understand this as “their appearance,” while others read or interpret it as “their iniquity throughout the land.”
    reason: alternative_reading
