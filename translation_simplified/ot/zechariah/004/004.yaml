- pob_phrase: What are these, my lord?
  simplified_phrase: My lord, what are these?
  preserved_meaning: Zechariah respectfully asks the angel to identify what he sees.
  reasoning_layer_used: Lexical and theological decisions for מָה אֵלֶּה and אֲדֹנִי
  rationale: Moving the respectful address to the front makes the question flow naturally without changing its referent.
