translation:
  language: en
  text: Who has despised the time of small things? These seven will rejoice when they see the plumb stone—the weight used to check that a wall is straight—in Zerubbabel’s hand.[a] These seven are the eyes of Yahweh, ranging throughout the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “tin stone”; traditionally it has been translated “plummet.”
    reason: lexical_alternative
