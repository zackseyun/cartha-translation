translation:
  language: en
  text: With his own hands, Zerubbabel laid the foundation of this house,[a] and with his own hands he will finish it. Then you will know that Yahweh of Armies[b] has sent me to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “This house” refers to the temple.
    reason: cultural_note
  - marker: b
    text: Traditionally, “Yahweh of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The hands of Zerubbabel laid
  simplified_phrase: With his own hands, Zerubbabel laid
  preserved_meaning: Zerubbabel personally began the work, while the Hebrew image of his hands remains.
  reasoning_layer_used: Lexical decision for יְדֵי and its emphasis on personal agency.
  rationale: The recast sounds natural while preserving the repeated hands image.
- pob_phrase: and his hands will complete it
  simplified_phrase: and with his own hands he will finish it
  preserved_meaning: The same person who began the temple will bring the work to completion.
  reasoning_layer_used: Lexical decisions for וְיָדָיו and תְּבַצַּעְנָה.
  rationale: “Finish” is common English, and repeating “with his own hands” keeps the source emphasis.
translation_notes:
  risk_flags:
  - risk: “With his own hands” could be taken to mean Zerubbabel worked without anyone else's help.
    mitigation: The wording preserves the Hebrew agency image without explicitly claiming that he worked alone.
