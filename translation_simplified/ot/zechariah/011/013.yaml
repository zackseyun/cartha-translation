translation:
  language: en
  text: Then Yahweh said to me, “Throw the money to the potter—the ‘magnificent’ price they decided I was worth.” So I took the thirty pieces of silver and threw them into Yahweh’s temple, to the potter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text says “potter” in both places. Some suggest “treasury” because the context is difficult, but that is not the Hebrew reading.
    reason: alternative_reading
