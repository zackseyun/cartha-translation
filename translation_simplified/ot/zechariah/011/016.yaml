translation:
  language: en
  text: Look, I am raising up a shepherd in the land. He will not care for the sheep that are perishing, search for those that stray[a], heal those that are broken, or provide for those still able to stand[b]. Instead, he will eat the flesh of the fat sheep and tear the hooves off them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the young one.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is literally “the one standing” and may refer to a healthy sheep.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For behold
  simplified_phrase: Look
  preserved_meaning: The speaker calls attention to what God is about to declare.
  reasoning_layer_used: POB translation and source discourse marker
  rationale: “Look” gives the attention-getting force in common English.
- pob_phrase: will not attend to the perishing
  simplified_phrase: will not care for the sheep that are perishing
  preserved_meaning: The shepherd neglects flock members who are disappearing or dying.
  reasoning_layer_used: POB lexical decision for יִפְקֹד and הַנִּכְחָדוֹת
  rationale: “Care for” is clearer than “attend to” while “perishing” keeps the broad danger.
- pob_phrase: will not sustain the healthy
  simplified_phrase: will not provide for those still able to stand
  preserved_meaning: The shepherd refuses to support even the sheep that remain standing.
  reasoning_layer_used: POB footnote and lexical rationale for הַנִּצָּבָה and יְכַלְכֵּל
  rationale: The wording explains the standing image without reducing support to feeding alone.
interpretive_expansions:
- pob_phrase: the perishing ... the straying ... the broken
  rendering: the sheep that are perishing ... those that stray ... those that are broken
  claim: These neglected figures are members of the flock within the shepherd image.
  evidence:
  - The verse repeatedly describes a shepherd and ends with flesh and hooves.
  confidence: high
  alternatives_preserved:
  - The language may also portray vulnerable people under a leader.
- pob_phrase: the healthy
  rendering: those still able to stand
  claim: The expression pictures sheep that remain on their feet, without requiring complete health.
  evidence:
  - The Hebrew participle literally denotes “the one standing.”
  - The POB lexical rationale describes a sheep still able to stand and remain viable.
  confidence: moderate
  alternatives_preserved:
  - the healthy sheep
  - the one standing firm
translation_notes:
  risk_flags:
  - risk: The Hebrew rendered “those that stray” can instead refer to a young one.
    mitigation: Footnote [a] preserves the lexical alternative.
  - risk: “Still able to stand” may suggest weakness more explicitly than the Hebrew requires.
    mitigation: Footnote [b] preserves the possible sense “healthy sheep.”
