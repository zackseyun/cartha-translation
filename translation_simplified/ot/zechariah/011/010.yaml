translation:
  language: en
  text: Then I took my staff called Favor and cut it in two. I did this to break the covenant I had made with all the peoples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all the nations.” The Hebrew word can mean peoples or nations.
    reason: lexical_alternative
