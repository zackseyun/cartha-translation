translation:
  language: en
  text: “I will no longer show compassion to the people living in the land,” declares Yahweh. “See, I am handing the people over, each man into the hands of his neighbor and his king. They will crush the land, and I will not rescue it from their hands.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “land” can also mean “earth,” but the immediate context favors a particular land.
    reason: alternative_reading
  - marker: b
    text: The final Hebrew clause does not explicitly say what will not be rescued; “the land” is supplied from the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the inhabitants of the land
  simplified_phrase: the people living in the land
  preserved_meaning: The judgment concerns those dwelling in the particular land in view.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Common wording replaces the formal noun “inhabitants” without broadening “land” to “earth.”
- pob_phrase: Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king
  simplified_phrase: See, I am handing the people over, each man into the hands of his neighbor and his king
  preserved_meaning: Yahweh gives each man into the power of both nearby people and political authority.
  reasoning_layer_used: lexical and theological decisions
  rationale: The sentence is recast naturally while retaining the hand image and masculine distributive wording.
- pob_phrase: I will not deliver it from their hand
  simplified_phrase: I will not rescue it from their hands
  preserved_meaning: Yahweh will not save the land from those who crush it.
  reasoning_layer_used: lexical decision and contextual object supply
  rationale: “Rescue” is clearer than “deliver,” and “hands” echoes the earlier image of hostile power.
translation_notes:
  risk_flags:
  - risk: Readers may take “land” universally or locally.
    mitigation: The main text follows the contextually preferred local sense, while footnote a preserves “earth.”
  - risk: The object of “rescue” is unstated in Hebrew.
    mitigation: The main text retains POB’s contextual “it,” while footnote b marks the ambiguity.
