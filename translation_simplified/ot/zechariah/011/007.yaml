- pob_phrase: I shepherded the flock doomed to slaughter
  simplified_phrase: I cared for the flock that was doomed to be slaughtered
  preserved_meaning: The speaker tends the flock while it remains destined for slaughter.
  reasoning_layer_used: POB translation and source shepherding context
  rationale: The opening uses common wording while the final clause preserves the explicit shepherding image.
- pob_phrase: namely the afflicted of the flock
  simplified_phrase: that is, the suffering sheep of the flock
  preserved_meaning: The doomed flock is identified as the suffering members of the flock.
  reasoning_layer_used: Applied revision preserving the identifying force of “namely”
  rationale: “That is” clearly preserves identification rather than presenting a result or inference.
- pob_phrase: two staffs
  simplified_phrase: two shepherd’s staffs
  preserved_meaning: The two named staffs are implements used in the speaker’s shepherd role.
  reasoning_layer_used: Immediate shepherding context
  rationale: Adding “shepherd’s” makes the concrete image clear without changing its meaning.
