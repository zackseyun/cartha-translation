translation:
  language: en
  text: So I cared for the flock that was doomed to be slaughtered—that is, the suffering sheep of the flock. I took two shepherd’s staffs for myself and named one Favor and the other Union. Then I shepherded the flock.
  philosophy: optimal-equivalence
