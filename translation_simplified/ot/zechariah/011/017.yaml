translation:
  language: en
  text: Woe to the worthless shepherd[a] who deserts the flock! A sword is against his arm and his right eye. His arm will wither completely, and his right eye will grow utterly dim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the idol shepherd.” The Hebrew term can mean worthless, empty, or idol-like.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who abandons the flock
  simplified_phrase: who deserts the flock
  preserved_meaning: The shepherd is defined by forsaking those under his care.
  reasoning_layer_used: POB lexical decision for עֹזְבִי הַצֹּאן
  rationale: “Deserts” expresses the shepherd’s grave failure in direct, common English.
- pob_phrase: A sword is against his arm and against his right eye
  simplified_phrase: A sword is against his arm and his right eye
  preserved_meaning: The sword is declared against both the shepherd’s arm and right eye as judgment.
  reasoning_layer_used: POB lexical rationale for the verbless judgment declaration
  rationale: Removing the repeated preposition makes the line smoother while retaining its oracular ambiguity.
- pob_phrase: His arm will completely wither, and his right eye will be utterly dimmed
  simplified_phrase: His arm will wither completely, and his right eye will grow utterly dim
  preserved_meaning: Both injuries remain emphatic, while the eye’s dimness is not overstated as total blindness.
  reasoning_layer_used: POB lexical decisions for the two intensified Hebrew constructions
  rationale: Natural verb order and “grow dim” make the injuries easier to understand without weakening them.
translation_notes:
