simplification_decisions:
- pob_phrase: the plague with which Yahweh will strike
  simplified_phrase: the plague Yahweh will use to strike
  preserved_meaning: Yahweh actively brings the plague as judgment.
  reasoning_layer_used: Lexical decision for הַמַּגֵּפָה and יִגֹּף
  rationale: The active wording replaces a difficult construction without narrowing the plague's cause or mechanism.
- pob_phrase: while he is standing on his feet, his flesh will rot away
  simplified_phrase: Their flesh will rot away as they stand on their feet
  preserved_meaning: Each person is overtaken by bodily decay while upright.
  reasoning_layer_used: Lexical decision for וְהוּא עֹמֵד עַל־רַגְלָיו
  rationale: Natural English plurals clarify the distributive reference while preserving the shocking immediacy.
- pob_phrase: his eyes ... his tongue ... his mouth
  simplified_phrase: Their eyes ... their tongues ... their mouths
  preserved_meaning: The judgment affects the flesh, eyes, and tongue of those who attack Jerusalem.
  reasoning_layer_used: Lexical decisions for the bodily terms and pronominal mismatch
  rationale: Plural agreement makes the sequence easy to follow without weakening its concrete imagery.
