translation:
  language: en
  text: All the land from Geba to Rimmon, south of Jerusalem, will become a level plain.[a] Jerusalem, however, will be raised high and remain in its place, extending from the Benjamin Gate to the site of the First Gate and on to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will become like the Arabah,” the broad valley region south of Jerusalem.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All the land will be turned into a plain, from Geba to Rimmon south of Jerusalem
  simplified_phrase: All the land from Geba to Rimmon, south of Jerusalem, will become a level plain
  preserved_meaning: The regional terrain will be transformed into flat land.
  reasoning_layer_used: Lexical and theological decisions on יִסּוֹב, כָּל הָאָרֶץ, and כָּעֲרָבָה
  rationale: Putting the locations first shows that “all the land” means the named region, not the whole earth.
- pob_phrase: But Jerusalem will be raised up and will remain in its place
  simplified_phrase: Jerusalem, however, will be raised high and remain in its place
  preserved_meaning: Jerusalem will stay in its established location while rising above the flattened land.
  reasoning_layer_used: Lexical decisions on וְרָאֲמָה and וְיָשְׁבָה תַחְתֶּיהָ
  rationale: “Raised high” clearly conveys the contrast in elevation while retaining the passive sense.
- pob_phrase: the place of the First Gate
  simplified_phrase: the site of the First Gate
  preserved_meaning: The phrase points to the gate’s location, perhaps where it once stood.
  reasoning_layer_used: Lexical decision on מְקוֹם שַׁעַר הָרִאשׁוֹן
  rationale: “Site” expresses a known location more directly than “the place of.”
