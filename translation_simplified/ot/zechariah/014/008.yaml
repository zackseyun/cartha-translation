translation:
  language: en
  text: On that day, living waters[a] will flow from Jerusalem. Half will flow to the eastern sea[b], and half to the western sea[c]. The flow will continue through both summer and winter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Living waters” can mean fresh, flowing, or life-giving water.
    reason: lexical_alternative
  - marker: b
    text: The eastern sea is traditionally identified as the Dead Sea.
    reason: cultural_note
  - marker: c
    text: The western sea is traditionally identified as the Mediterranean Sea.
    reason: cultural_note
simplification_decisions:
- pob_phrase: half of them to the eastern sea and half of them to the western sea
  simplified_phrase: Half will flow to the eastern sea, and half to the western sea.
  preserved_meaning: The waters divide equally and flow in opposite directions.
  reasoning_layer_used: POB lexical decisions for חֶצְיָם and the two directional sea names
  rationale: Repeating “will flow” makes the movement clear without changing the geography.
- pob_phrase: it will be so in summer as well as in winter
  simplified_phrase: The flow will continue through both summer and winter.
  preserved_meaning: The water flows continuously throughout the year.
  reasoning_layer_used: POB lexical rationale for בַּקַּיִץ וּבָחֹרֶף and יִהְיֶה
  rationale: Naming the continuing flow makes the terse Hebrew conclusion natural in English.
- pob_phrase: And on that day living waters will flow out from Jerusalem
  simplified_phrase: On that day, living waters will flow from Jerusalem.
  preserved_meaning: The prophetic event begins with water flowing from Jerusalem.
  reasoning_layer_used: POB lexical decisions for the future formula and יֵצְאוּ
  rationale: Removing the opening “And” and unnecessary “out” gives a direct modern sentence.
