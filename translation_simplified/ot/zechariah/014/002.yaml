translation:
  language: en
  text: I will gather all the nations to attack Jerusalem. They will capture the city, plunder its homes, and rape its women. Half the city’s people will be taken into exile. But the rest of the people will not be removed from the city.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that the rest of the people will not be exterminated.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: against Jerusalem for battle
  simplified_phrase: to attack Jerusalem
  preserved_meaning: The nations are gathered for hostile military action against Jerusalem.
  reasoning_layer_used: Lexical decision for אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  rationale: The simpler verb “attack” expresses the same military purpose in direct English.
- pob_phrase: the houses plundered
  simplified_phrase: plunder its homes
  preserved_meaning: The attackers violently seize property from Jerusalem’s dwellings.
  reasoning_layer_used: Lexical decision for וְנָשַׁסּוּ הַבָּתִּים
  rationale: “Homes” makes the human impact clearer while “plunder” retains the wartime violence.
- pob_phrase: will not be cut off from the city
  simplified_phrase: will not be removed from the city
  preserved_meaning: The remaining people are not entirely driven away from Jerusalem.
  reasoning_layer_used: Lexical and theological decisions for לֹא יִכָּרֵת מִן הָעִיר
  rationale: The preferred removal sense is stated plainly while the possible destruction sense remains footnoted.
interpretive_expansions:
- pob_phrase: half of the city will go out into exile
  rendering: Half the city’s people will be taken into exile
  claim: “The city” refers collectively to half of Jerusalem’s inhabitants.
  evidence:
  - The following clause contrasts this half with “the rest of the people.”
  - Exile applies directly to people rather than buildings.
  confidence: high
  alternatives_preserved:
  - Half of the city will go into exile.
translation_notes:
  risk_flags:
  - risk: Rendering “cut off” as “removed” could hide the possible sense “exterminated.”
    mitigation: A footnote preserves the stronger alternative meaning.
  - risk: The direct word “rape” is graphic.
    mitigation: It preserves the deliberately blunt Hebrew and does not minimize the atrocity.
