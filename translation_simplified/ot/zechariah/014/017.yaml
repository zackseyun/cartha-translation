  reasoning_layer_used: Lexical decision on “families” and theological decision on the worldwide scope of “the earth.”
  rationale: “Family group” avoids suggesting only an individual household while keeping the source category.
- pob_phrase: there will be no rain on them
  simplified_phrase: no rain will fall on them
  preserved_meaning: Groups that do not come to worship will receive no rain.
  reasoning_layer_used: Lexical decision identifying the clause as covenantal judgment.
  rationale: The active wording expresses the same judgment in more natural English.
