translation:
  language: en
  text: You will flee through the valley in my mountains, because the valley will extend all the way to Azal. You will flee just as you fled from the earthquake when Uzziah was king of Judah. Then Yahweh my God will come, and all the holy ones[a] will come with him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy ones” may refer to heavenly attendants; some understand them as saints or angels.
    reason: lexical_alternative
  - marker: b
    text: Another reading has “with you.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: flee by the valley of my mountains
  simplified_phrase: flee through the valley in my mountains
  preserved_meaning: The people escape by way of the valley associated with God’s mountains.
  reasoning_layer_used: Lexical decisions for גֵּיא and הָרַי
  rationale: Ordinary route language clarifies the action while retaining “my mountains.”
- pob_phrase: the valley of the mountains will reach to Azal
  simplified_phrase: the valley will extend all the way to Azal
  preserved_meaning: The valley reaches as far as the place named Azal.
  reasoning_layer_used: Lexical decision for יַגִּיעַ
  rationale: “Extend all the way” makes the valley’s spatial reach immediately clear.
- pob_phrase: as you fled from before the earthquake in the days of Uzziah king of Judah
  simplified_phrase: just as you fled from the earthquake when Uzziah was king of Judah
  preserved_meaning: Their future flight is compared with flight from the earthquake during Uzziah’s reign.
  reasoning_layer_used: Lexical decisions for כַאֲשֶׁר נַסְתֶּם and מִפְּנֵי הָרַעַשׁ
  rationale: Natural English replaces the Hebrew idiom and simplifies the historical time phrase.
