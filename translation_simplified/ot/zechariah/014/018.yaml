translation:
  language: en
  text: If the family of Egypt does not go up and come to Jerusalem to celebrate the Feast of Booths,[a] then the plague will not come upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the feast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This feast is traditionally called the Feast of Tabernacles.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says the plague “will not come upon them,” a difficult statement in context; many understand Egypt to be struck by a plague because it relies less directly on rain than other nations do.
    reason: alternative_reading
