translation:
  language: en
  text: Judah too will fight at Jerusalem.[a] Then the wealth of all the surrounding nations will be gathered—huge amounts of gold, silver, and clothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judah too will fight against Jerusalem.” The Hebrew normally means “at” or “in,” but the surrounding context may suggest “against.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And Judah also will fight at Jerusalem
  simplified_phrase: Judah too will fight at Jerusalem
  preserved_meaning: Judah joins the fighting at Jerusalem, while the footnote retains the alternative sense.
  reasoning_layer_used: Lexical and theological decisions on בִּירוּשָׁלִָם
  rationale: “Too” states the additive force naturally while keeping the preferred locative reading.
- pob_phrase: the wealth of all the surrounding nations will be gathered
  simplified_phrase: Then the wealth of all the surrounding nations will be gathered
  preserved_meaning: The material riches of the nations around Jerusalem will be collected.
  reasoning_layer_used: Lexical decisions on חֵיל, סָבִיב, and וְאֻסַּף
  rationale: “Then” makes the prophetic sequence clear while “surrounding” preserves the spatial sense.
- pob_phrase: gold and silver and garments, in very great abundance
  simplified_phrase: huge amounts of gold, silver, and clothing
  preserved_meaning: The gathered valuables include an exceptionally large quantity of all three items.
  reasoning_layer_used: Lexical decisions on the inventory and לָרֹב מְאֹד
  rationale: The natural English list preserves the strong emphasis on quantity.
