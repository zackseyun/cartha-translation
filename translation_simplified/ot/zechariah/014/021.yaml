  text: Every cooking pot throughout Jerusalem and Judah will be holy to Yahweh of hosts. Everyone who offers a sacrifice will come, take pots from among them, and boil in them. On that day, there will no longer be a Canaanite[a] in the temple of Yahweh of hosts.
  philosophy: optimal-equivalence
  footnotes:
