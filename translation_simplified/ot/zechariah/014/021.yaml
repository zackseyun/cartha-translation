simplification_decisions:
- pob_phrase: every pot in Jerusalem and in Judah
  simplified_phrase: Every cooking pot throughout Jerusalem and Judah
  preserved_meaning: All such vessels across Jerusalem and Judah will be set apart to Yahweh.
  reasoning_layer_used: Lexical decision for סִיר and immediate context
  rationale: “Cooking pot” makes the vessel’s purpose clear from the following action of boiling.
- pob_phrase: all who sacrifice will come and take from them
  simplified_phrase: Everyone who offers a sacrifice will come, take pots from among them
  preserved_meaning: The worshipers take pots from among the holy vessels without specifying one pot per person.
  reasoning_layer_used: Lexical decisions for הַזֹּבְחִים and מֵהֶם
  rationale: The wording identifies the worshipers and the pronoun’s referent while preserving the source plurals.
- pob_phrase: the house of Yahweh of hosts
  simplified_phrase: the temple of Yahweh of hosts
  preserved_meaning: The final clause concerns Yahweh’s temple.
  reasoning_layer_used: Lexical rationale for בְּבֵית יְהוָה צְבָאוֹת
  rationale: “Temple” explains the biblical house idiom for readers unfamiliar with it.
