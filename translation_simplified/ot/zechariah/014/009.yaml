translation:
  language: en
  text: Yahweh will rule as king over the whole earth. On that day, Yahweh will be one[a], and his name will also be one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word “one” can also mean “alone” or “unique.”
    reason: lexical_alternative
  - marker: b
    text: This may also mean “his name alone” or “his name unique.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Yahweh will be king over all the earth
  simplified_phrase: Yahweh will rule as king over the whole earth
  preserved_meaning: Yahweh will exercise royal authority over the entire world.
  reasoning_layer_used: Lexical decisions for לְמֶלֶךְ and עַל כָּל הָאָרֶץ
  rationale: “Rule as king” makes the royal function immediately clear without changing its global scope.
- pob_phrase: and his name one
  simplified_phrase: and his name will also be one
  preserved_meaning: Yahweh’s name shares the same emphatic oneness, exclusivity, or uniqueness.
  reasoning_layer_used: Lexical and theological decisions for וּשְׁמוֹ אֶחָד
  rationale: Adding “will also be” supplies natural English grammar while preserving the Hebrew parallel and ambiguity.
translation_notes:
  risk_flags:
