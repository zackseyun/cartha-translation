translation:
  language: en
  text: “On that day,” declares Yahweh of hosts, “I will cut off the names of the idols from the land. The names of these idols will never be remembered again. I will also remove the prophets[a] and the unclean spirit[b] from the land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the prophets” refers in context to illegitimate prophets connected with idolatry and uncleanness.
    reason: cultural_note
  - marker: b
    text: Or “the spirit of uncleanness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall happen in that day, declares Yahweh of hosts, that I will
  simplified_phrase: “On that day,” declares Yahweh of hosts, “I will
  preserved_meaning: The prophetic formula introduces what Yahweh will do at that future time.
  reasoning_layer_used: Lexical decisions for וְהָיָה, בַיּוֹם הַהוּא, and נְאֻם יְהוָה צְבָאוֹת
  rationale: Direct speech removes the heavy introductory clause while retaining the prophetic setting and declaration.
- pob_phrase: and they shall be remembered no more
  simplified_phrase: The names of these idols will never be remembered again.
  preserved_meaning: The idols’ names will disappear from memory.
  reasoning_layer_used: Lexical decision for וְלֹא יִזָּכְרוּ עוֹד and grounding review
  rationale: Repeating the noun removes pronoun ambiguity and keeps the Hebrew referent explicit.
- pob_phrase: And also I will remove from the land the prophets and the unclean spirit
  simplified_phrase: I will also remove the prophets and the unclean spirit from the land.
  preserved_meaning: Yahweh will additionally purge both the prophets in view and the unclean spirit from the land.
  reasoning_layer_used: Lexical and theological decisions for וְגַם, הַנְּבִיאִים, רוּחַ הַטֻּמְאָה, and אַעֲבִיר
  rationale: Natural English word order clearly states the additional act without changing either object.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that every prophet is condemned.
    mitigation: Footnote a identifies the contextual referent without adding “false” to the main text.
  - risk: “Unclean spirit” may sound more specifically personal than the Hebrew requires.
    mitigation: Footnote b preserves the more abstract lexical alternative.
