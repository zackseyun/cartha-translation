translation:
  language: en
  text: If a man continues to prophesy,[a] his own father and mother will say to him, “You must die, because you have spoken lies in Yahweh’s name.” Then the father and mother who gave him life will pierce him through while he is prophesying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “prophesies again.” The Hebrew can refer either to continued or renewed action.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it will happen that if a man still prophesies
  simplified_phrase: If a man continues to prophesy
  preserved_meaning: The prophecy describes the future possibility that someone persists in prophetic activity.
  reasoning_layer_used: Lexical decisions for וְהָיָה, כִּי, and עוֹד
  rationale: The direct conditional removes a cumbersome introduction while retaining continuation and contingency.
- pob_phrase: You shall not live
  simplified_phrase: You must die
  preserved_meaning: The parents pronounce a grave sentence of death rather than merely predicting an outcome.
  reasoning_layer_used: Lexical rationale for לֹא תִחְיֶה and theological decision on severity
  rationale: The common expression states the judicial force clearly without softening it.
- pob_phrase: his father and his mother who bore him will pierce him through when he prophesies
  simplified_phrase: the father and mother who gave him life will pierce him through while he is prophesying
  preserved_meaning: His own parents carry out violent judgment during his prophetic activity.
  reasoning_layer_used: Lexical decisions for יֹלְדָיו, וּדְקָרֻהוּ, and בְּהִנָּבְאוֹ
  rationale: The wording clarifies the parental image and timing while preserving the weapon-like piercing.
translation_notes:
  risk_flags:
  - risk: “You must die” could be mistaken for a general moral statement rather than a judicial sentence.
    mitigation: The parents’ direct accusation and immediate action preserve the sentence-and-judgment context.
  - risk: “Continues to prophesy” favors continuation over the possible sense “prophesies again.”
    mitigation: The footnote preserves the documented lexical alternative.
