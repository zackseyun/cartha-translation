translation:
  language: en
  text: 'The LORD of Armies[b] declares:

    “Sword, wake up and come against my shepherd,

    the man who is my companion.[a]

    Strike the shepherd, and the sheep will scatter.

    Then I will turn my hand against the little ones.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the man who is my associate,” or possibly “the man who is my equal.” The Hebrew describes someone closely associated with another.
    reason: lexical_alternative
  - marker: b
    text: Or “the LORD of Hosts.”
    reason: lexical_alternative
  - marker: c
    text: Or “I will turn my hand toward the little ones.” The expression may mean acting against them or dealing with them again more generally.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Awake, O sword, against my shepherd
  simplified_phrase: Sword, wake up and come against my shepherd
  preserved_meaning: The sword is directly summoned to act against the LORD’s shepherd.
  reasoning_layer_used: Lexical decisions for חֶרֶב and עוּרִי
  rationale: The wording keeps the vivid personification while using natural modern English.
- pob_phrase: declares the LORD of Armies
  simplified_phrase: 'The LORD of Armies declares:'
  preserved_meaning: The LORD is identified as the speaker of the entire declaration.
  reasoning_layer_used: Lexical decision for נְאֻם יְהוָה צְבָאוֹת
  rationale: Moving the speech formula to the beginning makes the speaker immediately clear.
- pob_phrase: the sheep will be scattered
  simplified_phrase: the sheep will scatter
  preserved_meaning: The sheep disperse as a result of the shepherd being struck.
  reasoning_layer_used: Lexical decisions for וּתְפוּצֶיןָ and הַצֹּאן
  rationale: The natural intransitive form states the same result more directly.
translation_notes:
  risk_flags:
  - risk: “Companion” could be read more weakly or strongly than the Hebrew relationship term warrants.
    mitigation: Footnote [a] preserves the documented lexical range without forcing a metaphysical claim.
  - risk: “Against” may overstate an idiom that can more generally mean turning the hand toward someone.
    mitigation: Footnote [c] preserves the broader alternative while retaining the contextually favored adverse sense.
