translation:
  language: en
  text: “I will bring the surviving third through the fire. I will refine them as silver is refined and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’[a] and he will say, ‘Yahweh is my God.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The singular words “he” and “him” represent the surviving people as one group; in smoother English, “They are my people.”
    reason: alternative_reading
