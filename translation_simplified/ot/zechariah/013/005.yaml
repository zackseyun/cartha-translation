translation:
  language: en
  text: And he will say, “I am not a prophet. I am a man who works the ground, because a man acquired me in my youth.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a man bought me in my youth” or “a man has possessed me since my youth.” The Hebrew can refer to acquiring, buying, or possessing.
    reason: lexical_alternative
