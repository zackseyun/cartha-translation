  text: If someone asks him, “What are these wounds on your chest?[a]” he will answer, “I was wounded in the house of those who love me.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “between your hands,” probably meaning the chest or torso between the arms.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean close companions, loved ones, or intimate associates.
    reason: lexical_alternative
  - marker: c
    text: Some Christians connect these wounds with the Messiah’s suffering, but the verse does not explicitly make that connection.
    reason: alternative_reading
