translation:
  language: en
  text: On that day, a fountain will be opened for David’s royal family and the people living in Jerusalem, to cleanse them from sin[a] and impurity.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand the Hebrew word as “sin offering,” though cleansing from sin fits the context better.
    reason: lexical_alternative
  - marker: b
    text: Or “ritual uncleanness”; the Hebrew may refer to a specific kind of impurity or to ritual impurity more broadly.
    reason: lexical_alternative
