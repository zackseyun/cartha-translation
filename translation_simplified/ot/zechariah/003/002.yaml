translation:
  language: en
  text: Yahweh said to the Accuser[a], “May Yahweh rebuke you, Accuser! Yes, may Yahweh, who has chosen Jerusalem, rebuke you! Isn’t this one a piece of wood snatched from the fire?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Satan.” The Hebrew uses the title “the Accuser.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew image may also be expressed as “a firebrand rescued from the fire.”
    reason: lexical_alternative
