  preserved_meaning: The person is pictured as nearly consumed but narrowly rescued.
  reasoning_layer_used: Lexical decisions for אוּד and מֻצָּל מֵאֵשׁ
  rationale: “Piece of wood” explains the uncommon sense of “brand” without adding that it is still burning.
