translation:
  language: en
  text: “I will remove the war chariots from Ephraim and the war horses from Jerusalem. The battle bows will also be removed. The king will proclaim peace to the nations. His rule will extend from sea to sea and from the River[a] to the ends of the earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The River” likely refers to the Euphrates.
    reason: cultural_note
simplification_decisions:
- pob_phrase: cut off the chariot from Ephraim and the horse from Jerusalem
  simplified_phrase: remove the war chariots from Ephraim and the war horses from Jerusalem
  preserved_meaning: God will eliminate the military forces represented by chariots and horses.
  reasoning_layer_used: lexical decisions and geographic parallelism
  rationale: Plural forms make the Hebrew collective singulars clear without losing either military image.
- pob_phrase: the battle bow will be cut off
  simplified_phrase: The battle bows will also be removed
  preserved_meaning: Weapons used in war will be eliminated.
  reasoning_layer_used: lexical decision for נִכְרְתָה and קֶשֶׁת מִלְחָמָה
  rationale: “Removed” gives the sense of “cut off” in direct modern English while retaining the bow image.
- pob_phrase: his dominion will be from sea to sea
  simplified_phrase: His rule will extend from sea to sea
  preserved_meaning: The king’s reign will have an intentionally expansive scope.
  reasoning_layer_used: lexical and theological decisions on royal rule
  rationale: “Will extend” makes the geographic description of his rule natural and immediately clear.
interpretive_expansions:
- pob_phrase: he will speak peace
  rendering: The king will proclaim peace
  claim: The third-person subject is the coming king introduced in the preceding verse.
  evidence:
  - The immediate context introduces a king in Zechariah 9:9.
  - The POB theological decision identifies the pronoun’s referent as that king.
  confidence: high
  alternatives_preserved:
  - An impersonal rendering such as “peace will be proclaimed” remains possible but is not preferred.
- pob_phrase: the chariot ... and the horse
  rendering: the war chariots ... and the war horses
  claim: The chariots and horses are military forces in parallel with the battle bows.
  evidence:
  - The following clause explicitly names the battle bow.
  - The POB lexical decisions recognize collective force in both singular nouns.
  confidence: high
  alternatives_preserved:
  - The singular images “the chariot” and “the horse” are reflected by the specific plural nouns.
translation_notes:
  risk_flags:
  - risk: Replacing repeated “cut off” with “remove” reduces the Hebrew root repetition.
    mitigation: Both clauses still clearly state the complete elimination of the named instruments of war.
  - risk: Naming “the king” makes the pronoun’s contextual referent explicit.
    mitigation: The preceding verse and the POB theological decision strongly support this identification without adding later doctrinal detail.
