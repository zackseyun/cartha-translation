translation:
  language: en
  text: Then Yahweh will appear over them. His arrow will fly out like a flash of lightning. The Lord GOD will sound the trumpet[a] and advance in storm winds of the south.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This trumpet was a ram’s horn used to signal battle or mark a ceremony.
    reason: cultural_note
  - marker: b
    text: Or “in storm winds of Teman.” Teman may be a place-name or may mean “the south.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: his arrow will go out like lightning
  simplified_phrase: His arrow will fly out like a flash of lightning
  preserved_meaning: God’s arrow is launched with the sudden, brilliant force of lightning.
  reasoning_layer_used: lexical decisions for וְיָצָא and כַבָּרָק
  rationale: “Fly out” clarifies the arrow’s movement while preserving the lightning image.
- pob_phrase: will sound the trumpet and march
  simplified_phrase: will sound the trumpet and advance
  preserved_meaning: The Lord GOD gives the battle signal and moves forward as a divine warrior.
  reasoning_layer_used: lexical decisions for יִתְקָע and וְהָלַךְ
  rationale: “Advance” expresses the martial movement in common modern English.
- pob_phrase: in the whirlwinds of the south
  simplified_phrase: in storm winds of the south
  preserved_meaning: The Lord advances amid powerful storm winds associated with the south.
  reasoning_layer_used: lexical decisions for בְּסַעֲרוֹת and תֵּימָן
  rationale: “Storm winds” is clearer than “whirlwinds” while “in” and “of” avoid overdefining the relationship.
translation_notes:
  risk_flags:
  - risk: Readers may take “over them” to refer to God’s enemies rather than his people.
    mitigation: The spatial wording is retained because the Hebrew leaves the referent unstated.
  - risk: “The south” may represent the place-name Teman rather than a direction.
    mitigation: The footnote preserves Teman as a live alternative without changing the clause’s syntax.
