translation:
  language: en
  text: Celebrate with great joy, daughter Zion! Shout in triumph, daughter Jerusalem! Look! Your king is coming to you. He is righteous and victorious.[a] He is humble[b] and rides on a donkey—a colt, the foal of a female donkey.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “righteous and saved,” or “righteous and having salvation.” The Hebrew can describe one whom God has delivered and given victory.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word may also mean “lowly,” “poor,” or “afflicted.”
    reason: lexical_alternative
  - marker: c
    text: 'The poetic wording probably describes the same animal in two ways: a donkey, a young colt.'
    reason: cultural_note
simplification_decisions:
