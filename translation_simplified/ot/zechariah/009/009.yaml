- pob_phrase: righteous and victorious is he, humble and riding
  simplified_phrase: He is righteous and victorious. He is humble and rides
  preserved_meaning: The king is righteous, victorious, humble, and arrives riding a donkey.
  reasoning_layer_used: POB syntax and theological decisions
  rationale: Direct sentences replace the inverted description without changing its claims.
- pob_phrase: on a colt, the foal of a she-donkey
