  preserved_meaning: The mount is a young donkey born to a female donkey.
  reasoning_layer_used: Lexical decision for עַיִר בֶּן אֲתֹנוֹת
  rationale: “Female donkey” replaces the unfamiliar “she-donkey” while retaining the source image.
