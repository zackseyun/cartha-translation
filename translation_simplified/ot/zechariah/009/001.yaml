translation:
  language: en
  text: 'A prophetic message: Yahweh’s word is against the land of Hadrach[a], and Damascus is where it comes to rest.[b] For the eyes of man and of all the tribes of Israel are turned toward Yahweh.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “concerning the land of Hadrach.”
    reason: alternative_reading
  - marker: b
    text: Or “Damascus is his resting place”; the Hebrew does not clearly identify whose resting place it is.
    reason: lexical_alternative
  - marker: c
    text: “Man” refers to humanity; the compressed Hebrew may instead mean that Yahweh has his eye on humanity and all Israel’s tribes.
    reason: alternative_reading
