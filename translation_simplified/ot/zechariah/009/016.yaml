translation:
  language: en
  text: On that day, Yahweh their God will save them as his own flock, his people. For they will sparkle over his land like jewels set in a crown.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that they will be lifted up and prominently displayed over his land.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase behind “jewels set in a crown” can also mean “stones of a crown” or, less likely, “consecrated stones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as the flock of his people
  simplified_phrase: as his own flock, his people
  preserved_meaning: The saved people are compared to a flock that belongs to Yahweh.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast removes an unnatural phrase while keeping both the flock image and covenant relationship.
- pob_phrase: the stones of a crown
  simplified_phrase: jewels set in a crown
  preserved_meaning: The people are pictured as precious crown-stones displayed in splendor.
  reasoning_layer_used: lexical decision and footnote b
  rationale: “Jewels set in a crown” makes the poetic image immediately understandable without flattening it.
- pob_phrase: for they will sparkle like ... over his land
  simplified_phrase: For they will sparkle over his land like ...
  preserved_meaning: Their visible splendor over Yahweh’s land explains the preceding promise.
  reasoning_layer_used: lexical decisions for כִּי, מִתְנוֹסְסוֹת, and עַל אַדְמָתוֹ
  rationale: A separate sentence and ordinary word order clarify the image while retaining its explanatory link.
