  preserved_meaning: The Lord will deprive the personified city of what she possesses without specifying the exact means.
  reasoning_layer_used: POB lexical decision for יוֹרִשֶׁנָּה
  rationale: This wording makes the judgment clear while avoiding a narrow claim about conquest or exile.
- pob_phrase: strike her wealth into the sea
  simplified_phrase: cast her wealth into the sea
  preserved_meaning: Tyre’s riches and resources will be forcefully overthrown into the sea.
  reasoning_layer_used: POB lexical decisions for וְהִכָּה, בַּיָּם, and חֵילָהּ
