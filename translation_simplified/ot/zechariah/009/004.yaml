  preserved_meaning: The words still introduce a solemn prophetic announcement and direct attention to the Lord’s coming action.
  reasoning_layer_used: POB lexical decision for הִנֵּה
  rationale: The expanded phrase communicates the force of “Behold” in familiar modern English.
- pob_phrase: will dispossess her
