  text: Ashkelon will see what has happened and be afraid. Gaza will writhe in great anguish, and Ekron too will be in anguish because her hope has ended in shame.[a] A king will perish from Gaza,[b] and no one will live in Ashkelon.
  philosophy: optimal-equivalence
  footnotes:
