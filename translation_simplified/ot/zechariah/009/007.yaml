translation:
  language: en
  text: I will remove the blood from his mouth and the detestable things from between his teeth.[a] Then he too will remain for our God.[b] He will be like one of Judah’s clan leaders, and Ekron will be like the Jebusite.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The blood and detestable things likely refer to blood and forbidden or unclean food associated with pagan worship.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also be translated, “Then he too will be a remnant for our God” or “will be left for our God.”
    reason: lexical_alternative
  - marker: c
    text: The Jebusites were absorbed into Jerusalem, so this comparison likely points to Ekron being included within Judah rather than remaining a hostile power.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Then he too will be a remnant for our God
  simplified_phrase: Then he too will remain for our God
  preserved_meaning: The former enemy will survive in a new relationship to Israel’s God.
  reasoning_layer_used: lexical alternatives and theological decision on incorporation
  rationale: “Remain” avoids implying membership in a defined remnant group, while the note preserves the prophetic remnant sense.
- pob_phrase: he will be like a clan leader in Judah
  simplified_phrase: He will be like one of Judah’s clan leaders
  preserved_meaning: He will have standing comparable to a recognized leader within Judah.
  reasoning_layer_used: lexical decision for אַלּוּף
  rationale: “One of Judah’s” makes the social comparison natural in English without changing its force.
- pob_phrase: Ekron will be like the Jebusite
  simplified_phrase: Ekron will be like the Jebusite
  preserved_meaning: Ekron is compared with the Jebusite in its relation to Judah.
  reasoning_layer_used: lexical rationale and cross-reference note
  rationale: The compact singular comparison is retained because pluralizing it or adding “become” would go beyond the source.
translation_notes:
  risk_flags:
