translation:
  language: en
  text: I will set up camp at my house[a] and stand guard. I will keep hostile forces from moving back and forth, and no oppressor will overrun them again. For now I have seen with my own eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My house” may mean the temple specifically or, more broadly, God’s people and all that belongs to him. “Them” refers to those under God’s protection without defining the scope more narrowly.
    reason: simplification_note
simplification_decisions:
- pob_phrase: encamp at my house as a guard
  simplified_phrase: set up camp at my house and stand guard
  preserved_meaning: God takes a protective military position at what belongs to him.
  reasoning_layer_used: Lexical decisions for וְחָנִיתִי and מִצָּבָה
  rationale: The rewrite preserves both the camp and guard images in familiar English.
- pob_phrase: so that none may pass to and fro
  simplified_phrase: I will keep hostile forces from moving back and forth
  preserved_meaning: God prevents threatening movement through the protected territory in either direction.
  reasoning_layer_used: Lexical decision for מֵעֹבֵר וּמִשָּׁב and POB footnote b
  rationale: The contextually implied threat is stated clearly while the audit records the inference.
- pob_phrase: no oppressor will pass over them again
  simplified_phrase: no oppressor will overrun them again
  preserved_meaning: No oppressor will again invade and dominate those under God's protection.
  reasoning_layer_used: Lexical decisions for עבר and נֹגֵשׂ plus the theological decision on the open referent
  rationale: “Overrun” conveys military force, while “them” avoids narrowing the protected group.
interpretive_expansions:
- pob_phrase: none may pass to and fro
  rendering: hostile forces
  claim: Those moving in either direction are presented as a threat rather than ordinary travelers.
  evidence:
