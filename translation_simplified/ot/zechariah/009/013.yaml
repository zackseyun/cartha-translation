translation:
  language: en
  text: For I have bent Judah, making it my bow, and I have filled the bow with Ephraim. Zion, I will rouse your sons against the sons of Greece,[a] and I will make you like a warrior’s sword.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew name is “Javan,” a traditional name for the Greek peoples and their world.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I have bent Judah as my bow; I have filled it with Ephraim
  simplified_phrase: I have bent Judah, making it my bow, and I have filled the bow with Ephraim
  preserved_meaning: Judah is God’s bow, while Ephraim fills out the same weapon image.
  reasoning_layer_used: Lexical decisions for דָרַכְתִּי and מִלֵּאתִי
  rationale: The recast clause clarifies the metaphor and names the implied bow without deciding that Ephraim is specifically the arrow.
- pob_phrase: I will stir up your sons, Zion, against your sons, Greece
  simplified_phrase: Zion, I will rouse your sons against the sons of Greece
  preserved_meaning: God will mobilize Zion’s sons against the Greek peoples.
  reasoning_layer_used: Lexical and theological decisions for Zion, יָוָן, and וְעוֹרַרְתִּי
  rationale: Reordering the address makes the opposing groups easier to follow while retaining the martial sons image and the rendering “Greece.”
translation_notes:
  risk_flags:
  - risk: “Filled the bow” remains an unusual image in English.
    mitigation: The wording preserves the source ambiguity instead of identifying Ephraim confidently as an arrow.
  - risk: “The sons of Greece” makes Greece’s personification less direct than the Hebrew vocative.
    mitigation: The text retains “sons” and the opposition between personified Zion and Greece.
