translation:
  language: en
  text: 'Come back to the stronghold, you prisoners of hope.[a] Even today I announce: I will restore twice as much to you.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Prisoners of hope” may describe people who remain bound to or sustained by hope even while captive.
    reason: lexical_alternative
  - marker: b
    text: Or “I will restore a double portion to you” or “I will repay you double.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Return to the stronghold
  simplified_phrase: Come back to the stronghold
  preserved_meaning: The people are commanded to return, with both physical and covenantal resonance left open.
  reasoning_layer_used: Lexical decision for שׁוּבוּ and לְבִצָּרוֹן
  rationale: “Come back” is more conversationally clear while “stronghold” preserves the fortified-place image.
- pob_phrase: even today I declare
  simplified_phrase: Even today I announce
  preserved_meaning: God makes an emphatic declaration in the present.
  reasoning_layer_used: Lexical decisions for גַּם הַיּוֹם and מַגִּיד
  rationale: “Announce” is plain English and retains the immediacy and public force of the declaration.
- pob_phrase: I will restore double to you
  simplified_phrase: I will restore twice as much to you
  preserved_meaning: God promises a twofold restoration rather than merely returning what was lost.
  reasoning_layer_used: Lexical decisions for מִשְׁנֶה and אָשִׁיב לָךְ
  rationale: “Twice as much” makes the amount immediately understandable without making the restoration transactional.
translation_notes:
  risk_flags:
  - risk: Readers may take “prisoners of hope” as literal imprisonment by hope.
    mitigation: The footnote explains the metaphor without replacing its striking image.
  - risk: English “you” does not show whether Zion or the prisoners are addressed collectively.
    mitigation: The main text retains the unexpanded direct address and does not resolve the ambiguity.
