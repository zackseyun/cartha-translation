- pob_phrase: there was no wage for man, and no wage for beast
  simplified_phrase: work done by man or beast brought no pay
  preserved_meaning: Human and animal labor yielded no wages.
  reasoning_layer_used: POB lexical decisions on שְׂכַר, הָאָדָם, and הַבְּהֵמָה
  rationale: The recast sentence makes the labor contrast natural without losing the representative use of “man.”
- pob_phrase: for the one going out and the one coming in there was no peace
  simplified_phrase: There was no peace or safety for anyone going out or coming in
  preserved_meaning: Ordinary movement was insecure and lacked well-being.
  reasoning_layer_used: POB lexical decision and footnote on שָׁלוֹם
  rationale: Adding “safety” communicates the contextual range of shalom in plain English.
- pob_phrase: because of the adversary
  simplified_phrase: because of the enemy
  preserved_meaning: A hostile foe caused the insecurity.
  reasoning_layer_used: POB lexical decision on מִן הַצָּר
  rationale: “Enemy” is the clearest documented alternative for a common reader.
