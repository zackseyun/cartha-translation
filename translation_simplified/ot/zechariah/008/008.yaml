  rationale: “Make their home there” expresses settled residence in natural English after “into Jerusalem” establishes the location.
- pob_phrase: I will bring them, and they will dwell in the midst of Jerusalem
  simplified_phrase: I will bring them into Jerusalem, and they will make their home there
  preserved_meaning: God will bring the people into the city, where they will reside.
  reasoning_layer_used: Source syntax and restoration-context lexical rationale
  rationale: The destination is attached to “bring” for clarity without adding the unexpressed word “back.”
- pob_phrase: and they will be my people, and I will be their God
