simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of Armies says
  preserved_meaning: The prophetic formula and Yahweh’s personal name and military title remain intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording is recast in ordinary English, and the opaque “hosts” is clarified as “Armies.”
- pob_phrase: Yet peoples shall come
  simplified_phrase: Peoples will still come
  preserved_meaning: More ethnic groups are promised to come in the future.
  reasoning_layer_used: POB lexical decisions for עֹד, יָבֹאוּ, and עַמִּים
  rationale: “Will still come” expresses the continuing future promise in natural modern English.
- pob_phrase: and the inhabitants of many cities
  simplified_phrase: along with residents of many cities
  preserved_meaning: People living in numerous cities are included among those who will come.
  reasoning_layer_used: POB lexical decisions for וְיֹשְׁבֵי and עָרִים רַבּוֹת
  rationale: “Residents” and “along with” make the relationship clear without changing the groups named.
translation_notes:
  risk_flags:
  - risk: “Armies” may sound limited to human forces.
    mitigation: Capitalization and its place in Yahweh’s title preserve the broader divine designation without overexplaining it.
