translation:
  language: en
  text: Many peoples and powerful nations will come to Jerusalem. There they will seek Yahweh of Hosts[a] and ask him to show them favor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and preserves Yahweh’s military and cosmic title.
    reason: source_note
  - marker: b
    text: The Hebrew literally speaks of entreating “the face of Yahweh,” an idiom for seeking his favor or presence.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: many peoples and mighty nations
  simplified_phrase: many peoples and powerful nations
  preserved_meaning: The verse distinguishes multiple peoples from politically strong nations.
  reasoning_layer_used: POB lexical decisions for עַמִּים and גּוֹיִם עֲצוּמִים
  rationale: “Powerful” is more immediately familiar than “mighty” while retaining the sense of strength.
- pob_phrase: will come to seek Yahweh of hosts in Jerusalem
  simplified_phrase: will come to Jerusalem. There they will seek Yahweh of Hosts
  preserved_meaning: The peoples will make a future pilgrimage to Jerusalem in order to seek Yahweh.
  reasoning_layer_used: POB syntax, lexical decisions, and theological title decision
  rationale: Two sentences clarify the destination and purpose without weakening the prophetic future or changing the divine title.
- pob_phrase: to entreat the favor of Yahweh
  simplified_phrase: ask him to show them favor
  preserved_meaning: They will humbly appeal to Yahweh for his favorable presence and response.
  reasoning_layer_used: POB lexical rationale for חלה את־פני
  rationale: The direct request is natural English, while the footnote preserves the Hebrew image of Yahweh’s face.
translation_notes:
  risk_flags:
