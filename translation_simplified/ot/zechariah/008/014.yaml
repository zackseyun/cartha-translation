simplification_decisions:
- pob_phrase: For thus says Yahweh of Armies
  simplified_phrase: For this is what Yahweh of Armies says
  preserved_meaning: The prophetic formula introduces Yahweh’s own declaration.
  reasoning_layer_used: POB lexical decision for כִּי כֹה אָמַר and the divine title
  rationale: The modern formula is clearer while retaining Yahweh’s name and title.
- pob_phrase: I purposed to do harm to you
  simplified_phrase: I decided to bring harm on you
  preserved_meaning: Yahweh deliberately resolved to bring judgment upon them.
  reasoning_layer_used: POB lexical and theological decisions for זָמַמְתִּי and לְהָרַע לָכֶם
  rationale: “Decided” is clearer than “purposed,” while “bring harm” avoids suggesting moral evil by God.
- pob_phrase: your fathers provoked me to wrath
  simplified_phrase: your fathers provoked me to anger
  preserved_meaning: Their fathers caused Yahweh’s anger.
  reasoning_layer_used: POB lexical decisions for בְּהַקְצִיף and אֲבֹתֵיכֶם
  rationale: “Anger” is immediately understandable and avoids adding an unsupported degree of intensity.
translation_notes:
  risk_flags:
  - risk: “Bring harm” could be mistaken for morally evil action.
    mitigation: The wording follows POB’s covenant-judgment sense and avoids saying that God did evil.
  - risk: The comparison remains incomplete because it continues in verse 15.
    mitigation: The final comma preserves the connection without importing the next verse.
