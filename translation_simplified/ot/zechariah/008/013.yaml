  reasoning_layer_used: Lexical decisions for וְהָיָה, כַּאֲשֶׁר, and הֱיִיתֶם
  rationale: Removing the formal opening and adding “once” makes the time contrast clear.
- pob_phrase: O house of Judah and house of Israel
  simplified_phrase: People of Judah and Israel
  preserved_meaning: Judah and Israel remain addressed as corporate covenant peoples.
  reasoning_layer_used: Theological decision on corporate identity
  rationale: Naming the peoples directly avoids an unclear architectural image while preserving the corporate address.
- pob_phrase: Do not fear; let your hands be strong
  simplified_phrase: Do not be afraid. Let your hands be strong—take courage and act with resolve.
  preserved_meaning: The command calls for courage and determined action while retaining the Hebrew image of strong hands.
