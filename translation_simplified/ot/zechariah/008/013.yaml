translation:
  language: en
  text: People of Judah and Israel, just as you once were a curse among the nations,[a] I will save you, and you will be a blessing. Do not be afraid. Let your hands be strong—take courage and act with resolve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the nations regarded them as cursed or used their name when pronouncing curses.
    reason: lexical_alternative
