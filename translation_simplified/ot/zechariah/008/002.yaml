translation:
  language: en
  text: 'Yahweh of hosts[a] says: “I am fiercely jealous[b] for Zion. I am jealous for her with great wrath.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and can include both heavenly and earthly forces.
    reason: simplification_note
  - marker: b
    text: Or “fiercely zealous.” Here jealousy expresses Yahweh’s passionate covenant commitment to Zion.
    reason: lexical_alternative
