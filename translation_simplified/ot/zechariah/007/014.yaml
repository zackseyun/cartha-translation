translation:
  language: en
  text: “I scattered them with the force of a storm among nations they had never known. The land they left behind became desolate; no one passed through it or returned. So they turned the pleasant land into a wasteland.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: scattered them with a storm wind
  simplified_phrase: scattered them with the force of a storm
  preserved_meaning: God forcefully drove the people into exile, with the Hebrew storm image intact.
  reasoning_layer_used: POB lexical decision for וְאֵסָעֲרֵם and theological decision on divine agency
  rationale: The new wording keeps the violent storm image without sounding like a literal weather report.
- pob_phrase: the land was left desolate behind them
  simplified_phrase: The land they left behind became desolate
  preserved_meaning: After the people were removed, the land lay ruined in their wake.
  reasoning_layer_used: POB lexical decisions for וְהָאָרֶץ נָשַׁמָּה and אַחֲרֵיהֶם
  rationale: The clause is recast in ordinary English while retaining the resulting desolation.
- pob_phrase: thus they made the pleasant land a desolation
  simplified_phrase: So they turned the pleasant land into a wasteland
  preserved_meaning: The people remain responsible for bringing ruin upon a desirable land.
  reasoning_layer_used: POB lexical decisions for וַיָּשִׂימוּ, אֶרֶץ חֶמְדָּה, and לְשַׁמָּה
  rationale: The concrete contrast between a pleasant land and its devastated state becomes immediately clear.
