translation:
  language: en
  text: Aren’t these the words Yahweh proclaimed through the earlier prophets when Jerusalem was inhabited and secure, when the towns around it were inhabited, and when people also lived in the Negev and Judah’s western foothills?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew name for Judah’s western foothill region is “the Shephelah.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: by the former prophets
  simplified_phrase: through the earlier prophets
  preserved_meaning: Yahweh used prophets from an earlier time to proclaim his words.
  reasoning_layer_used: POB lexical decision for בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  rationale: “Through” clarifies agency, while “earlier” avoids suggesting a biblical book division.
- pob_phrase: when Jerusalem was inhabited and at ease, with her surrounding cities
  simplified_phrase: when Jerusalem was inhabited and secure, when the towns around it were inhabited
  preserved_meaning: Jerusalem was populated and undisturbed, while the nearby towns were populated.
  reasoning_layer_used: POB lexical decisions for יְרוּשָׁלִַם יֹשֶׁבֶת, שְׁלֵוָה, and עָרֶיהָ סְבִיבֹתֶיהָ
  rationale: Separate clauses keep security tied to Jerusalem while expressing the towns’ inhabited state clearly.
- pob_phrase: the Negev and the Shephelah were inhabited
  simplified_phrase: people also lived in the Negev and Judah’s western foothills
  preserved_meaning: Both named regions had settled populations.
  reasoning_layer_used: POB lexical decisions and cultural note for the regional names
  rationale: Active wording is easier to understand, and the unfamiliar Shephelah is identified geographically.
interpretive_expansions:
- pob_phrase: the Shephelah
  rendering: Judah’s western foothills
  claim: The Shephelah is the western lowland and foothill region of Judah.
  evidence:
  - The POB cultural note defines the Shephelah as Judah’s western lowland and foothill region.
  - The POB lexical rationale identifies it as a recognized geographic region.
  confidence: high
  alternatives_preserved:
  - the Shephelah
translation_notes:
  risk_flags:
  - risk: “Secure” may sound narrower than the Hebrew sense of being at ease.
    mitigation: It preserves the central idea of quiet, undisturbed safety without asserting prosperity.
  - risk: Replacing “Shephelah” in the main text could obscure the regional name.
    mitigation: The footnote retains the Hebrew name and identifies the region.
