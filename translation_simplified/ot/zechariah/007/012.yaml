translation:
  language: en
  text: They hardened their hearts until they were like an extremely hard stone[a], so they would not listen to the law and the words that Yahweh of Armies had sent by his Spirit through the earlier prophets. So great wrath came from Yahweh of Armies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to an extremely hard substance, traditionally called adamant and possibly flint.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: made their hearts like diamond-hard stone
  simplified_phrase: hardened their hearts until they were like an extremely hard stone
  preserved_meaning: They deliberately made their inner disposition extremely resistant to God.
  reasoning_layer_used: POB lexical decisions for לֵב, שׂוּם, and שָׁמִיר
  rationale: The familiar heart-hardening expression clarifies the action while preserving the stone image and extreme hardness.
- pob_phrase: so as not to hear
  simplified_phrase: so they would not listen
  preserved_meaning: They refused to heed both God's law and his prophetic words.
  reasoning_layer_used: POB lexical decision for מִשְּׁמוֹעַ and source coordination
  rationale: “Listen” conveys responsive hearing, while “and” retains both objects of their refusal.
- pob_phrase: the former prophets
  simplified_phrase: the earlier prophets
  preserved_meaning: These were prophets from an earlier time in Israel's history.
  reasoning_layer_used: POB lexical decision for הַנְּבִיאִים הָרִאשֹׁנִים
  rationale: “Earlier” avoids suggesting a technical canonical title.
translation_notes:
  risk_flags:
  - risk: The exact substance denoted by the Hebrew term is uncertain.
    mitigation: The text states only its extreme hardness, and the footnote preserves the traditional lexical alternatives.
