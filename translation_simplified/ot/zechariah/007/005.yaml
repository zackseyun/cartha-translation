  reasoning_layer_used: lexical decisions for עַם הָאָרֶץ, הַכֹּהֲנִים, and אֱמֹר ... לֵאמֹר
  rationale: “Tell” naturally combines the repeated Hebrew speech formula without losing the command.
- pob_phrase: in the fifth month and in the seventh
