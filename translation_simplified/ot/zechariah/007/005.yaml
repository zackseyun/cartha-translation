translation:
  language: en
  text: 'Tell all the people living in the land and the priests: “During these seventy years, when you fasted and mourned in the fifth and seventh months, was it really for me that you fasted?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Was it for me—really for me—that you fasted?” The Hebrew strongly emphasizes “for me.”
    reason: lexical_alternative
