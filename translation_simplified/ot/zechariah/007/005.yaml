  preserved_meaning: The fasting and mourning occurred in both named calendar months.
  reasoning_layer_used: lexical decision for בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  rationale: Placing “months” after both ordinals makes the calendar reference concise and clear.
- pob_phrase: for these seventy years
