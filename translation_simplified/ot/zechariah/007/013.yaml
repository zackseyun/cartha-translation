- pob_phrase: And just as he called and they would not listen
  simplified_phrase: I called to them, but they refused to listen
  preserved_meaning: Yahweh summoned the people, and they stubbornly refused to heed him.
  reasoning_layer_used: Lexical decisions for קָרָא and וְלֹא שָׁמֵעוּ, with the immediate speaker context
  rationale: Direct speech and explicit objects make the refusal clear without weakening it.
- pob_phrase: so they will call and I will not listen
  simplified_phrase: In the same way, they will call to me, but I will not listen to them
  preserved_meaning: Their future unanswered call corresponds to their refusal to answer Yahweh.
  reasoning_layer_used: Lexical decisions for כֵּן, יִקְרְאוּ, and וְלֹא אֶשְׁמָע
  rationale: The fuller comparison clearly presents the reciprocal judgment and preserves the repeated call-listen pattern.
- pob_phrase: Yahweh of Armies
