translation:
  language: en
  text: 'Do not follow the example of your fathers.[a] The earlier prophets proclaimed this message to them: “This is what Yahweh of hosts[b] says: Please turn away from your evil ways and evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your ancestors.” The Hebrew literally says “your fathers” and refers to earlier generations.
    reason: lexical_alternative
  - marker: b
    text: “Hosts” refers to armies and forces, including heavenly ones.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Do not be like your fathers
  simplified_phrase: Do not follow the example of your fathers
  preserved_meaning: The people must not repeat the conduct of earlier generations.
  reasoning_layer_used: POB lexical and theological decisions on כַאֲבֹתֵיכֶם
  rationale: This makes the warning about conduct clear while retaining “fathers.”
- pob_phrase: to whom the former prophets proclaimed, saying
  simplified_phrase: The earlier prophets proclaimed this message to them
  preserved_meaning: Prophets from an earlier time formally announced Yahweh’s message to the fathers.
  reasoning_layer_used: POB lexical decisions on קָרְאוּ אֲלֵיהֶם and הַנְּבִיאִים הָרִאשֹׁנִים
  rationale: A separate active sentence removes the dense relative clause without weakening the announcement.
- pob_phrase: Turn back, please, from your evil ways and your evil deeds
  simplified_phrase: Please turn away from your evil ways and evil deeds
  preserved_meaning: Yahweh appeals for them to turn from both evil conduct and evil actions.
  reasoning_layer_used: POB lexical decisions on שׁוּבוּ נָא, דַּרְכֵיכֶם, and מַעֲלִילֵיכֶם
  rationale: Natural word order preserves the appeal and the image of turning from evil.
interpretive_expansions:
- pob_phrase: Yahweh of hosts
  rendering: Yahweh of hosts[b]
  claim: The title presents Yahweh in relation to armies and forces, including heavenly ones.
  evidence:
  - The POB lexical rationale says צבאות broadly encompasses heavenly armies and forces.
  confidence: high
  alternatives_preserved:
  - The broad traditional title “Yahweh of hosts” remains in the main text.
translation_notes:
  risk_flags:
  - risk: “Follow the example” makes the behavioral comparison more explicit than “be like.”
    mitigation: The immediate command to turn from evil confirms that conduct is the point of comparison.
  - risk: Modern readers may misunderstand “hosts” as people receiving guests.
    mitigation: Footnote [b] explains the military sense without narrowing the title to heavenly forces.
