  reasoning_layer_used: Lexical and theological decisions for הַמַּלְאָךְ and הַדֹּבֵר בִּי
  rationale: “Replied” removes repetition while retaining the angel’s direct response.
- pob_phrase: what these are
  simplified_phrase: what they are
  preserved_meaning: The angel promises to identify the figures the prophet has asked about.
  reasoning_layer_used: Lexical decision for מָה הֵמָּה אֵלֶּה
  rationale: “They” naturally refers back to “these” without changing the referent.
