  preserved_meaning: The date is counted from Darius’s years as ruler.
  reasoning_layer_used: POB lexical rationale for the regnal-year expression
  rationale: Adding “reign” prevents readers from mistaking this for Darius’s age.
- pob_phrase: the word of Yahweh came to
  simplified_phrase: Yahweh gave this message to
  preserved_meaning: The prophetic message came from Yahweh to Zechariah.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This wording makes the prophetic revelation clear while retaining Yahweh’s personal name.
- pob_phrase: saying,
  simplified_phrase: ':'
  preserved_meaning: The verse introduces the divine speech that follows.
  reasoning_layer_used: POB lexical rationale for the speech introduction
  rationale: A colon naturally signals that the message follows.
