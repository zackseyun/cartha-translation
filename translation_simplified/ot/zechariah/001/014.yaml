translation:
  language: en
  text: 'The angel who was speaking with me said, “Make this announcement: ‘This is what Yahweh of hosts says: I am deeply jealous[a] for Jerusalem and for Zion.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I have great zeal for Jerusalem and for Zion.” The Hebrew repeats the same root to emphasize the intensity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Proclaim, saying
  simplified_phrase: Make this announcement
  preserved_meaning: The angel commands a public prophetic proclamation.
  reasoning_layer_used: Lexical decision for קְרָא לֵאמֹר
  rationale: This removes a redundant speech formula while retaining its public heralding force.
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of hosts says
  preserved_meaning: The formal prophetic formula introduces Yahweh’s own message while leaving the scope of “hosts” open.
  reasoning_layer_used: Lexical and theological decisions for כֹּה אָמַר and יְהוָה צְבָאוֹת
  rationale: The sentence becomes natural English without narrowing the title to heavenly armies.
- pob_phrase: I am exceedingly jealous
  simplified_phrase: I am deeply jealous
  preserved_meaning: Yahweh expresses intense covenant jealousy for Jerusalem and Zion.
  reasoning_layer_used: Lexical and theological decisions for קנא and קִנְאָה גְדוֹלָה
  rationale: “Deeply” conveys strong intensity naturally while preserving the challenging word “jealous.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand divine jealousy as petty envy.
    mitigation: The footnote preserves “zeal” as an alternative while the main text retains the theological tension.
  - risk: The retained title “Yahweh of hosts” may be unfamiliar to common readers.
    mitigation: It remains because replacing it with “Heaven’s Armies” would narrow the title beyond the source evidence.
