translation:
  language: en
  text: 'Proclaim once more: “This is what Yahweh of hosts says: My cities will once again overflow[a] with prosperity. Yahweh will again comfort Zion and again choose Jerusalem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spread out because of good things” or “abound with good things.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Call out again, saying
  simplified_phrase: Proclaim once more
  preserved_meaning: The messenger must publicly announce the message again.
  reasoning_layer_used: Lexical decisions for עוֹד, קְרָא, and לֵאמֹר
  rationale: “Proclaim” naturally combines the public call and its introduction.
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of hosts says
  preserved_meaning: The prophetic formula identifies Yahweh as the source of the message.
  reasoning_layer_used: Lexical and theological decisions for כֹּה אָמַר and יְהוָה צְבָאוֹת
  rationale: The familiar title remains, while the formula is recast in everyday English.
- pob_phrase: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem
  simplified_phrase: My cities will once again overflow with prosperity. Yahweh will again comfort Zion and again choose Jerusalem.
  preserved_meaning: Yahweh promises renewed abundance, comfort, and covenantal choice after judgment.
  reasoning_layer_used: Lexical and theological decisions for עוֹד, תְּפוּצֶינָה, מִטּוֹב, וְנִחַם, and וּבָחַר
  rationale: Splitting the long sentence makes the three restoration promises easier to follow.
translation_notes:
  risk_flags:
  - risk: “Overflow” is metaphorical and the Hebrew can also suggest expansion or abundance.
    mitigation: The lexical-alternative footnote preserves the documented range without weakening the main reading.
