translation:
  language: en
  text: But didn’t my words and decrees, which I commanded my servants the prophets to announce,[a] catch up with your ancestors? Then they turned back[b] and said, “Yahweh of Armies[c] has done to us just what he planned, in keeping with how we lived and what we did.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “which I commanded my servants the prophets”; the prophets were commissioned to deliver God’s message.
    reason: simplification_note
  - marker: b
    text: Or “Then they repented.” The Hebrew can mean either turning back or repenting in this context.
    reason: alternative_reading
  - marker: c
    text: 'Traditional rendering: “the LORD of Hosts.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my words and my statutes
  simplified_phrase: my words and decrees
  preserved_meaning: God’s spoken messages and his authoritative commands remain distinct.
  reasoning_layer_used: POB lexical decision for חֻקַּי
  rationale: “Decrees” is clearer than “statutes” while retaining the sense of enacted commands.
- pob_phrase: overtake your fathers
  simplified_phrase: catch up with your ancestors
  preserved_meaning: God’s warnings and judgments pursued the earlier generation until they experienced them.
  reasoning_layer_used: POB lexical decisions for הִשִּׂיגוּ and contextual English usage
  rationale: “Catch up with” preserves the pursuit image in more familiar English.
- pob_phrase: according to our ways and according to our deeds
  simplified_phrase: in keeping with how we lived and what we did
  preserved_meaning: God dealt with them according to both their conduct and their actions.
  reasoning_layer_used: POB lexical decisions for כִּדְרָכֵינוּ and וּכְמַעֲלָלֵינוּ
  rationale: The wording explains the moral sense of “ways” without merging it with “deeds.”
interpretive_expansions:
- pob_phrase: which I commanded my servants the prophets
  rendering: which I commanded my servants the prophets to announce
  claim: God commissioned the prophets to communicate these words and decrees.
  evidence:
  - The immediate context concerns God’s words reaching the ancestors through the prophets.
  - The POB rationale identifies prophetic delivery as the contextual sense.
  confidence: high
  alternatives_preserved:
  - which I commanded my servants the prophets
  - which I commanded through my servants the prophets
translation_notes:
  risk_flags:
  - risk: “Turned back” may be read as physical movement rather than possible repentance.
    mitigation: The footnote preserves “repented” without overstating the theological claim.
  - risk: Adding “to announce” makes the prophets’ implied role explicit.
    mitigation: The literal construction remains in the footnote and the expansion is documented.
