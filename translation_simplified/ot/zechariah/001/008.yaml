  text: During the night I saw a man riding a red horse! He was standing among myrtle trees in a ravine.[a] Behind him were red, reddish-brown,[b] and white horses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “in the depths” or “in a hollow”; it describes a low-lying place.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew horse color is uncertain; it may mean “sorrel,” “dappled,” or “speckled.”
    reason: lexical_alternative
