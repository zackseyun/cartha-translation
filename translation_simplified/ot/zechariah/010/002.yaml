translation:
  language: en
  text: The household idols[a] speak evil. Diviners see false visions; they tell empty dreams and offer comfort that is no help. So the people wander like sheep. They suffer because they have no shepherd.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is “teraphim,” referring to household cult objects or idols.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the diviners see lies
  simplified_phrase: Diviners see false visions
  preserved_meaning: The diviners receive deceptive revelations rather than truth.
  reasoning_layer_used: Lexical decision on חָזוּ שֶׁקֶר.
  rationale: “False visions” makes the visionary language clear.
- pob_phrase: give worthless comfort
  simplified_phrase: offer comfort that is no help
  preserved_meaning: Their reassurance is empty and ineffective.
  reasoning_layer_used: Lexical decision on הֶבֶל יְנַחֵמוּן.
  rationale: This wording explains why the comfort is worthless.
- pob_phrase: Therefore they wander like sheep; they are afflicted
  simplified_phrase: So the people wander like sheep. They suffer
  preserved_meaning: False guidance leaves the people wandering and afflicted.
  reasoning_layer_used: Lexical decisions on עַל־כֵּן, נָסְעוּ כְמוֹ צֹאן, and יַעֲנוּ.
  rationale: Two short sentences clarify the consequence while preserving the sheep image.
interpretive_expansions:
- pob_phrase: they wander like sheep
  rendering: the people wander like sheep
  claim: The pronoun refers to the people misled by false religious guidance.
  evidence:
  - The sheep-and-shepherd image distinguishes the people from their absent leader.
  - The immediate context presents false guidance as the cause of their wandering.
  confidence: high
  alternatives_preserved:
  - The Hebrew identifies the group only as “they.”
translation_notes:
  risk_flags:
  - risk: “Suffer” is broader than the possible sense “are oppressed.”
    mitigation: It preserves the POB’s chosen broad sense of affliction without excluding oppression.
