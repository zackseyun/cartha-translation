  reasoning_layer_used: Lexical decisions for וְהֹבִישׁוּ and כֹּל מְצוּלוֹת יְאֹר
  rationale: The active wording is easier to follow, and “every” preserves the Hebrew’s comprehensive force.
- pob_phrase: the scepter of Egypt will depart
