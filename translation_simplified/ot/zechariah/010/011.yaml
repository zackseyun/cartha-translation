translation:
  language: en
  text: He will pass through the sea of distress[a] and strike its waves. He will dry up every deep part of the Nile. Assyria’s pride will be brought down, and Egypt’s scepter—its ruling power—will disappear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “a sea of distress” or “the troubled sea”; the compact Hebrew may echo Israel’s deliverance through the sea.
    reason: lexical_alternative
