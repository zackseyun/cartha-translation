translation:
  language: en
  text: “I will make them strong in Yahweh. They will walk in his name,” declares Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Walking “in his name” can include living under his authority and in loyalty to who he has revealed himself to be.
