translation:
  language: en
  text: I will make the house of Judah[a] strong, and I will save the house of Joseph.[b] Because I have shown them compassion, I will restore them.[c] They will be as though I had not rejected them. For I am Yahweh their God, and I will answer them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The house of Judah” means the people descended from Judah, viewed as one people.
    reason: cultural_note
  - marker: b
    text: “The house of Joseph” means Joseph’s descendants, especially the northern tribes.
    reason: cultural_note
  - marker: c
    text: Or “bring them back.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will strengthen the house of Judah
  simplified_phrase: I will make the house of Judah strong
  preserved_meaning: Yahweh will cause Judah’s people to become strong.
  reasoning_layer_used: The lexical decision preserves the causative force of גבר and the corporate expression “house of Judah.”
  rationale: The active wording is easier to understand while keeping the same promise.
- pob_phrase: I will restore them, because I have had compassion on them
  simplified_phrase: Because I have shown them compassion, I will restore them
  preserved_meaning: God’s compassion is the reason for his promised restoration.
  reasoning_layer_used: The lexical decisions preserve both רחם as compassion and שוב as restoration.
  rationale: Putting the reason first makes the relationship clear on the first read.
- pob_phrase: for I am Yahweh their God, and I will answer them
  simplified_phrase: For I am Yahweh their God, and I will answer them
  preserved_meaning: Yahweh’s identity as their God grounds his promise to answer them.
  reasoning_layer_used: The theological decision requires “Yahweh,” while the source and POB preserve the causal connector and “answer.”
  rationale: Keeping “For” makes the source’s explicit reason clear.
translation_notes:
  risk_flags:
  - risk: “House” may sound like a building to modern readers.
    mitigation: Footnotes explain that each house is a people descended from its named ancestor.
  - risk: “Restore” can obscure the possible spatial sense of returning.
    mitigation: A lexical footnote preserves “bring them back” as an alternative.
