translation:
  language: en
  text: “My anger burns against the shepherds, and I will punish the male goats.[a] For Yahweh of Armies has cared for his flock, the people of Judah, and he will make them like his majestic horse in battle.”
  philosophy: optimal-equivalence
  footnotes:
