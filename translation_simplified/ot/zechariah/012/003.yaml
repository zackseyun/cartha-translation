translation:
  language: en
  text: On that day, I will make Jerusalem a heavy stone for all peoples. Everyone who tries to lift it will badly injure themselves.[a] And all the nations of the earth will gather against Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “will surely be cut or gashed,” emphasizing severe injury.
    reason: lexical_alternative
  - marker: b
    text: Or “all the nations of the land.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And on that day
  simplified_phrase: On that day
  preserved_meaning: The prophetic event remains tied to the stated future day.
  reasoning_layer_used: POB lexical decision for וְהָיָה בַיּוֹם הַהוּא
  rationale: Dropping the opening “And” gives a more natural verse opening without changing the time reference.
- pob_phrase: All who lift it will surely injure themselves
  simplified_phrase: Everyone who tries to lift it will badly injure themselves
  preserved_meaning: Those who attempt to move the heavy stone suffer severe harm.
  reasoning_layer_used: POB lexical decisions for כָּל עֹמְסֶיהָ and שָׂרוֹט יִשָּׂרֵטוּ
  rationale: “Tries to lift” makes the attempted action clear, while “badly” retains the Hebrew intensification.
- pob_phrase: will gather against her
  simplified_phrase: will gather against Jerusalem
  preserved_meaning: The nations assemble in hostility toward Jerusalem.
  reasoning_layer_used: POB lexical decision for וְנֶאֶסְפוּ עָלֶיהָ
  rationale: Repeating the place name avoids an unclear pronoun while preserving the hostile gathering.
