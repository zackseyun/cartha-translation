  text: See,[a] I am about to make Jerusalem a cup that causes all the surrounding peoples to stagger. This will also come against Judah during the siege against Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may more literally describe a basin or threshold that causes reeling, but a cup best fits the judgment image here.
    reason: lexical_alternative
