- pob_phrase: the house of David and the inhabitants of Jerusalem
  simplified_phrase: David’s family and the people of Jerusalem
  preserved_meaning: The promise concerns David’s household and Jerusalem’s population.
  reasoning_layer_used: source wording and lexical decision on the collective expression
  rationale: Common relational terms replace two formal biblical expressions.
- pob_phrase: they will look to me, the one whom they pierced
  simplified_phrase: They will look to me, the one they pierced.
  preserved_meaning: Their attention turns toward the speaker, identified as the pierced one.
  reasoning_layer_used: lexical decision for וְהִבִּיטוּ אֵלַי and אֲשֶׁר דָּקָרוּ
  rationale: A separate sentence and direct relative clause make the statement easier to follow.
- pob_phrase: as one mourns ... as one weeps bitterly
  simplified_phrase: as people mourn ... as people weep bitterly
  preserved_meaning: The loss is compared to intense grief for an only son and a firstborn.
  reasoning_layer_used: lexical decisions for mourning, only son, bitter grief, and firstborn
  rationale: Natural plural comparisons remove the stiff repeated wording without weakening the grief.
