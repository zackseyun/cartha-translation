translation:
  language: en
  text: I will pour out on David’s family and the people of Jerusalem a spirit marked by grace and pleas for mercy.[a] They will look to me, the one they pierced. They will mourn for him as people mourn for an only son, and they will weep bitterly for him as people weep bitterly for a firstborn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a spirit of grace and supplication.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from “me” to “him”; this wording preserves that tension.
    reason: alternative_reading
