translation:
  language: en
  text: “On that day,” Yahweh declares, “I will strike all the horses and their riders. The horses will panic, and the riders will go mad. But I will keep a watchful eye on the house of Judah. I will strike every horse of the foreign peoples blind.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will strike every horse with panic, and its rider with madness
  simplified_phrase: I will strike all the horses and their riders. The horses will panic, and the riders will go mad.
  preserved_meaning: Yahweh afflicts every horse with panic and every rider with madness.
  reasoning_layer_used: POB lexical decisions for strike, panic, rider, and madness
  rationale: Two direct sentences clarify who suffers each judgment while preserving the force of striking.
- pob_phrase: over the house of Judah I will keep my eyes open
  simplified_phrase: I will keep a watchful eye on the house of Judah
  preserved_meaning: Yahweh gives Judah attentive and favorable regard in contrast to the enemy forces.
  reasoning_layer_used: POB lexical and theological decisions on the Hebrew eye idiom
  rationale: The familiar English image keeps the eye metaphor while making attentive regard immediately clear.
- pob_phrase: I will strike every horse of the peoples with blindness
  simplified_phrase: I will strike every horse of the foreign peoples blind
  preserved_meaning: Yahweh blinds the horses belonging to the peoples arrayed against Judah.
  reasoning_layer_used: POB lexical decision and immediate military context
  rationale: “Strike blind” is natural English and retains both the striking image and the judgment of blindness.
