translation:
  language: en
  text: This oracle is the word of Yahweh concerning Israel.[a] It is the declaration of Yahweh, who stretches out the heavens, lays the earth’s foundation, and forms a man’s spirit within him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the word of Yahweh against Israel.” The Hebrew can mean “concerning” or “against.”
    reason: alternative_reading
  - marker: b
    text: Or “forms the human spirit within a person.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: An oracle, the word of Yahweh concerning Israel
  simplified_phrase: This oracle is the word of Yahweh concerning Israel
  preserved_meaning: The oracle is identified as Yahweh’s revealed word about Israel.
  reasoning_layer_used: POB lexical decisions for מַשָּׂא, דְבַר יְהוָה, and עַל
  rationale: A complete sentence makes the prophetic heading easier to understand without weakening its solemn force.
- pob_phrase: lays the foundation of the earth
  simplified_phrase: lays the earth’s foundation
  preserved_meaning: Yahweh is portrayed as establishing the earth like a builder laying a foundation.
  reasoning_layer_used: POB lexical decision for וְיֹסֵד אָרֶץ
  rationale: The shorter possessive form keeps the creation image in natural English.
- pob_phrase: forms the spirit of man within him
  simplified_phrase: forms a man’s spirit within him
  preserved_meaning: Yahweh shapes the inner spirit of each representative human being.
  reasoning_layer_used: POB lexical and theological decisions for רוּחַ אָדָם and בְּקִרְבּוֹ
  rationale: The possessive wording clarifies whose spirit is formed while retaining the singular generic “man.”
