translation:
  language: en
  text: On that day I will make Judah’s clans[a] like a pot of burning coals among firewood, and like a blazing torch among bundles of grain. They will burn up all the surrounding peoples, on the right and on the left. Jerusalem will once again remain in her own place—in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judah’s leaders” or “Judah’s chiefs.”
    reason: lexical_alternative
