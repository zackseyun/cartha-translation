translation:
  language: en
  text: Yahweh will first save the communities of Judah, pictured as tents.[a] He will do this so that David’s royal house and the people of Jerusalem will not receive greater honor than Judah as a whole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “tents of Judah” likely refers to Judah’s outlying settlements, in contrast with the royal house and Jerusalem.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the tents of Judah
  simplified_phrase: the communities of Judah, pictured as tents
  preserved_meaning: The concrete tent image represents Judah’s communities outside the royal and urban center.
  reasoning_layer_used: lexical decision and theological decision
  rationale: This preserves the image without implying that all the people literally lived in tents.
- pob_phrase: the glory ... may not be magnified over Judah
  simplified_phrase: will not receive greater honor than Judah as a whole
  preserved_meaning: The royal house and Jerusalem are not to gain superior honor over Judah broadly.
  reasoning_layer_used: lexical decision and theological decision
  rationale: The comparison is clear without implying that Jerusalem and David’s house are outside Judah.
- pob_phrase: so that
  simplified_phrase: He will do this so that
  preserved_meaning: Yahweh’s purpose in saving Judah first remains explicit.
  reasoning_layer_used: lexical decision
  rationale: A new sentence makes the purpose relationship easier to follow.
interpretive_expansions:
- pob_phrase: the house of David
  rendering: David’s royal house
  claim: The phrase refers to David’s dynasty or ruling house, not merely a household.
  evidence:
  - The POB lexical rationale identifies it as the Davidic dynasty or royal house.
  confidence: high
  alternatives_preserved:
  - David’s house
- pob_phrase: over Judah
  rendering: than Judah as a whole
  claim: Judah broadly is the comparison group for the honor of the royal and urban centers.
  evidence:
  - The purpose clause contrasts David’s house and Jerusalem with the tents of Judah.
  - The POB theological rationale identifies Judah at large as the comparison group.
  confidence: high
  alternatives_preserved:
  - above Judah
  - over Judah
translation_notes:
  risk_flags:
