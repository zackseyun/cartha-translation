translation:
  language: en
  text: On that day Yahweh will shield the people living in Jerusalem. On that day, anyone among them who stumbles will be like David. The house of David will be like God,[a] like the angel of Yahweh before them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like divine beings” or “like gods.” The Hebrew word can have these meanings, though “like God” is more likely here.
    reason: alternative_reading
