translation:
  language: en
  text: Take the silver and gold and make crowns[a] from them. Then place the crowns on the head of Joshua son of Jehozadak, the high priest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “crowns” in the plural. Some understand these as one crown made of several parts and translate “crown.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Take silver and gold, make crowns
  simplified_phrase: Take the silver and gold and make crowns from them
  preserved_meaning: The specified metals are to be used to make plural crowns.
  reasoning_layer_used: Lexical decisions for כֶסֶף וְזָהָב and עֲטָרוֹת
  rationale: Adding “from them” makes the relationship between the materials and crowns immediately clear.
- pob_phrase: and set them on the head of
  simplified_phrase: Then place the crowns on the head of
  preserved_meaning: The crowns are physically placed on Joshua’s head.
  reasoning_layer_used: Lexical decision for וְשַׂמְתָּ and theological decision on plural עֲטָרוֹת
  rationale: A new sentence and an explicit noun remove pronoun ambiguity while preserving the plural.
