translation:
  language: en
  text: Then he called out to me, “See! Those going to the land of the north have brought my Spirit to rest there.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have given rest to my spirit”; this may also mean that God’s anger or judgment has been quieted in the north.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: called out to me and spoke to me, saying
  simplified_phrase: called out to me
  preserved_meaning: He addressed the prophet audibly and urgently before giving the message.
  reasoning_layer_used: The lexical decision identifies a loud call, while the following speech formula can be compressed in natural English.
  rationale: Removing the repeated speech formula makes the introduction direct without losing the act of speaking.
- pob_phrase: those going out to the land of the north
  simplified_phrase: those going to the land of the north
  preserved_meaning: The vision’s agents are moving toward the northern land.
  reasoning_layer_used: The lexical decision treats the participle as ongoing action directed northward.
  rationale: “Going to” expresses the movement more naturally for common readers.
- pob_phrase: have set my Spirit at rest in the land of the north
  simplified_phrase: have brought my Spirit to rest there
  preserved_meaning: Their mission has caused God’s Spirit or disposition to become settled in the northern land.
  reasoning_layer_used: The lexical and theological decisions preserve the causative sense, the divine Spirit, and the unresolved nuance of quieted judgment.
  rationale: “Brought ... to rest” is clearer English, and “there” avoids a heavy repetition while keeping the location.
translation_notes:
  risk_flags:
  - risk: “There” removes the Hebrew repetition of “the land of the north.”
    mitigation: The same location appears immediately before it, so the geographical emphasis remains clear.
  - risk: Readers may not understand how God’s Spirit is brought to rest.
    mitigation: The anchored footnote preserves the possible sense of quieted anger or judgment without forcing it into the text.
