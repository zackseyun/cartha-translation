translation:
  language: en
  text: Yes, he will build Yahweh’s temple. He will bear royal majesty and sit on his throne to rule. He will also serve as a priest on his throne,[a] and there will be peaceful counsel[c] between the two of them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there will be a priest on his throne”; this reading distinguishes the priest from the ruler.
    reason: alternative_reading
  - marker: b
    text: “The two of them” may mean the royal and priestly roles, or two distinct figures such as ruler and priest.
    reason: alternative_reading
  - marker: c
    text: This may also be rendered “counsel for peace” or “a plan for peace.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the temple of Yahweh
  simplified_phrase: Yahweh’s temple
  preserved_meaning: The building is Yahweh’s sanctuary.
  reasoning_layer_used: Lexical decision for הֵיכַל יְהוָה and the divine-name policy.
  rationale: The possessive form is shorter and more natural without changing the reference.
- pob_phrase: he will sit and rule on his throne
  simplified_phrase: sit on his throne to rule
  preserved_meaning: He is enthroned and exercises royal authority.
  reasoning_layer_used: Lexical rationale for וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ.
  rationale: The purpose clause conveys the same royal action in ordinary English.
- pob_phrase: he will be a priest on his throne
  simplified_phrase: he will also serve as a priest on his throne
  preserved_meaning: The same singular figure has a priestly role while enthroned.
  reasoning_layer_used: Lexical and theological decisions on the singular subject.
  rationale: “Serve as” clarifies the role while retaining the striking priest-and-throne image.
interpretive_expansions:
- pob_phrase: bear majesty
  rendering: bear royal majesty
  claim: The majesty is the dignity of a king.
  evidence:
