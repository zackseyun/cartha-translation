  - bear splendor
- pob_phrase: the counsel of peace
  rendering: peaceful counsel
  claim: The counsel is characterized by peace without excluding a purpose or plan for peace.
  evidence:
  - The lexical rationale allows both deliberative and purposive senses.
  - The POB alternatives include “peaceful counsel” and “a plan of peace.”
  confidence: moderate
  alternatives_preserved:
  - counsel for peace
  - a plan for peace
translation_notes:
