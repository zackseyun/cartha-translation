translation:
  language: en
  text: 'Then I asked, “What have these come to do?”


    He answered, “Those horns scattered Judah, leaving no man able to lift up his head. These have come to terrify those horns and throw down the horns of the nations—the nations that lifted up a horn against the land of Judah and scattered her.”[a]'
  philosophy: optimal-equivalence
  footnotes:
