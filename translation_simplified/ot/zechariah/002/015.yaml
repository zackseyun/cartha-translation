translation:
  language: en
  text: In that day, many nations will join themselves to the LORD, and they will be my people. I will live in your midst. And you will know that the LORD of Armies[a] has sent me[b] to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the LORD of hosts.”
    reason: lexical_alternative
  - marker: b
    text: The text does not explicitly identify the speaker who says “me.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And many nations will join themselves to Yahweh in that day
  simplified_phrase: In that day, many nations will join themselves to the LORD
  preserved_meaning: Many nations will voluntarily join the LORD in allegiance at the promised time.
  reasoning_layer_used: Lexical decisions for וְנִלְווּ, בַּיּוֹם הַהוּא, and the divine name
  rationale: The reordered clause reads naturally while retaining the audited joining language and divine title.
- pob_phrase: And I will dwell in your midst
  simplified_phrase: I will live in your midst
  preserved_meaning: The speaker will reside within the singular addressee, Zion or Jerusalem.
  reasoning_layer_used: Lexical decision for וְשָׁכַנְתִּי בְתוֹכֵךְ
  rationale: “Live” is clearer than “dwell,” while “in your midst” preserves the singular address.
- pob_phrase: and you will know
  simplified_phrase: And you will know
  preserved_meaning: The addressee will recognize that the LORD of Armies sent the unidentified speaker.
  reasoning_layer_used: Recognition formula and speaker-identity theological decision
  rationale: Keeping “And” avoids adding a temporal or result relationship not explicit in the source.
translation_notes:
  risk_flags:
  - risk: Readers may assume that the identity of “me” is settled.
    mitigation: The footnote states that the text leaves the speaker unidentified.
  - risk: “Join themselves” may sound unusual in modern English.
    mitigation: The reflexive wording preserves the voluntary allegiance established by the lexical audit.
