simplification_decisions:
- pob_phrase: For behold, I am about to
  simplified_phrase: For look—I am about to
  preserved_meaning: The wording still calls for attention and announces imminent action.
  reasoning_layer_used: Lexical decision for הִנְנִי
  rationale: “Look” is clearer modern English than “behold,” while the dash gives the announcement natural force.
- pob_phrase: wave my hand over them, and they will become
  simplified_phrase: wave my hand over them. They will become
  preserved_meaning: The concrete hand-waving image and its resulting judgment remain distinct.
  reasoning_layer_used: Lexical decisions for מֵנִיף אֶת־יָדִי עֲלֵיהֶם and וְהָיוּ
  rationale: Splitting the clauses makes the sequence easier to follow without weakening the image.
- pob_phrase: plunder for their own slaves
  simplified_phrase: plunder in the hands of their own slaves
  preserved_meaning: Those once enslaved will possess the spoil in a striking reversal of power.
  reasoning_layer_used: Lexical decisions for שָׁלָל and לְעַבְדֵיהֶם
  rationale: “In the hands of” makes possession clear while retaining both “plunder” and “slaves.”
