translation:
  language: en
  text: “Daughter Zion, sing for joy and rejoice! Look, I am coming, and I will dwell among you,” declares Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” is a poetic way of speaking of Zion, or Jerusalem, as a woman.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Sing for joy and rejoice, daughter Zion
  simplified_phrase: Daughter Zion, sing for joy and rejoice!
  preserved_meaning: Zion is personified as a daughter and commanded to celebrate joyfully.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: Moving the person addressed to the front makes the call easier to follow while preserving the poetic image.
- pob_phrase: for behold, I am coming
  simplified_phrase: Look, I am coming
  preserved_meaning: Yahweh solemnly draws attention to his imminent coming.
  reasoning_layer_used: POB lexical decision for הִנְנִי and בָא
  rationale: “Look” gives the attention-marking force of “behold” in common modern English.
- pob_phrase: I will dwell in your midst
  simplified_phrase: I will dwell among you
  preserved_meaning: Yahweh promises his continuing presence among Zion’s people.
  reasoning_layer_used: POB lexical and theological decisions for וְשָׁכַנְתִּי and בְתוֹכֵךְ
  rationale: “Among you” is clearer than “in your midst,” while “dwell” retains the covenant-presence theme.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “Daughter Zion” for a particular individual.
