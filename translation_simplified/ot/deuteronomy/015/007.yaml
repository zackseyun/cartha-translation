translation:
  language: en
  text: If one of your brothers[a] is poor in any of your towns[b] in the land Yahweh your God is giving you, do not harden your heart toward your poor brother or close your hand to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” means a fellow member of Israel’s covenant community.
    reason: cultural_note
  - marker: b
    text: Literally, “within one of your gates”; the gates represent the town they served.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If there is a poor man among you, one of your brothers
  simplified_phrase: If one of your brothers is poor
  preserved_meaning: The law concerns a poor male member of the covenant community.
  reasoning_layer_used: Lexical and theological decisions on אֶבְיוֹן and covenant kinship language
  rationale: The shorter clause removes repetition while retaining poverty and brotherhood.
- pob_phrase: within one of your gates
  simplified_phrase: in any of your towns
  preserved_meaning: The poor brother may live in any Israelite settlement.
  reasoning_layer_used: Lexical decision recognizing “gates” as a reference to towns
  rationale: The town-level meaning is placed in the text while the Hebrew image remains in a note.
- pob_phrase: you shall not harden your heart or shut your hand against your poor brother
  simplified_phrase: do not harden your heart toward your poor brother or close your hand to him
  preserved_meaning: Israel must reject both inward hardness and the refusal to give practical help.
  reasoning_layer_used: Lexical decisions on the heart and hand idioms
  rationale: Natural prepositions clarify both images without merging them.
