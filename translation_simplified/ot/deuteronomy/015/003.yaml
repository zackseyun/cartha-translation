simplification_decisions:
- pob_phrase: press a foreigner for payment
  simplified_phrase: demand payment from a foreigner
  preserved_meaning: The creditor may require a foreigner to repay a debt.
  reasoning_layer_used: Lexical decision for תִּגֹּשׂ
  rationale: “Demand payment” states the debt-collection action in direct modern English.
- pob_phrase: whatever of yours is with your brother
  simplified_phrase: any claim you have against your brother
  preserved_meaning: The command covers whatever debt claim the creditor holds against a covenant brother.
  reasoning_layer_used: Lexical decision for וַאֲשֶׁר יִהְיֶה לְךָ and immediate debt context
  rationale: “Any claim” makes the legal relationship clear without narrowing its scope.
- pob_phrase: your hand shall release
  simplified_phrase: you must let go of
  preserved_meaning: The creditor must relinquish the claim in the year of release.
  reasoning_layer_used: Lexical decision for תַּשְׁמֵט יָדֶךָ
  rationale: “Let go” preserves the release image while explaining the required action.
interpretive_expansions:
