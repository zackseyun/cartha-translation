translation:
  language: en
  text: You may demand payment from a foreigner. But you must let go of any claim you have against your brother.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your brother” means a fellow member of the Israelite covenant community.
