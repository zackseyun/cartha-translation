translation:
  language: en
  text: You must set apart as holy for Yahweh your God every firstborn male born in your herds and flocks. Do not use a firstborn ox for work. Do not shear a firstborn animal from your flock.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall consecrate to Yahweh your God
  simplified_phrase: You must set apart as holy for Yahweh your God
  preserved_meaning: The animal is placed under a binding command and reserved as holy for Yahweh.
  reasoning_layer_used: Lexical decision for תַּקְדִּישׁ and theological decision for יהוה
  rationale: “Set apart as holy” explains consecration plainly while retaining its sacred force.
- pob_phrase: You shall not work with the firstborn of your ox
  simplified_phrase: Do not use a firstborn ox for work
  preserved_meaning: The firstborn bovine must not be used for labor.
  reasoning_layer_used: Lexical decisions for עבד and שׁוֹר
  rationale: The active wording directly states the prohibited use.
- pob_phrase: nor shear the firstborn of your flock
  simplified_phrase: Do not shear a firstborn animal from your flock
  preserved_meaning: A firstborn flock animal must not be shorn.
  reasoning_layer_used: Lexical decisions for גזז and צאן
  rationale: The separate sentence is clear without narrowing the flock to sheep.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “ox” narrowly as a mature castrated animal.
    mitigation: The term remains because POB chose it for the bovine associated with farm labor.
