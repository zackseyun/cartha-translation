translation:
  language: en
  text: 'Be careful not to let this wicked thought enter your heart: “The seventh year, when debts are released, is almost here.” Do not look at your poor brother[b] with an evil eye[a] and refuse to give him anything. He may then cry out to Yahweh against you, and you will be guilty of sin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An “evil eye” is a Hebrew image for being stingy or resentful toward someone in need.
    reason: lexical_alternative
  - marker: b
    text: “Brother” means a fellow member of the covenant community, not necessarily a biological brother.
    reason: cultural_note
