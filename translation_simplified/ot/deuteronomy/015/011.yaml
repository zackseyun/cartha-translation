translation:
  language: en
  text: 'Poor people will never disappear from the land. So I command you: “You must open your hand generously to your brother,[a] to the afflicted, and to the poor in your land.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a fellow Israelite and uses the language of covenant kinship.
    reason: lexical_alternative
  - marker: b
    text: “The afflicted” can also mean those who are poor or lowly.
    reason: lexical_alternative
