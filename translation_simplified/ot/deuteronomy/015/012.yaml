simplification_decisions:
- pob_phrase: If your brother, a Hebrew man or a Hebrew woman
  simplified_phrase: If your brother—a Hebrew man or woman—
  preserved_meaning: The law concerns a fellow covenant member and explicitly includes both men and women.
  reasoning_layer_used: POB lexical decisions on אָחִיךָ and הָעִבְרִי ... הָעִבְרִיָּה
  rationale: The dashes present the male and female alternatives directly while preserving “brother” as covenant-family language.
- pob_phrase: then in the seventh year you shall
  simplified_phrase: then in the seventh year you must
  preserved_meaning: Release is required after six years of service.
  reasoning_layer_used: POB lexical decision on וּבַשָּׁנָה הַשְּׁבִיעִת
  rationale: “Must” states the legal obligation in clear modern English.
- pob_phrase: send him out free from you
  simplified_phrase: send him away free from your service
  preserved_meaning: The person must be sent away with free status and no longer remain in the owner’s service.
  reasoning_layer_used: POB lexical decisions on תְּשַׁלְּחֶנּוּ, חָפְשִׁי, and מֵעִמָּךְ
  rationale: This keeps the sending image while making the legal release from service explicit.
interpretive_expansions:
