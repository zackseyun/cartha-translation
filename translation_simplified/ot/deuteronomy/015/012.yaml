translation:
  language: en
  text: If your brother—a Hebrew man or woman—is sold to you and serves you for six years, then in the seventh year you must send him away free from your service.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses “him” generically here; the command applies to either a Hebrew man or woman.
