translation:
  language: en
  text: You may eat it in your towns. Both ritually unclean and ritually clean people may eat it, as they may eat gazelle or deer.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: within your gates
  simplified_phrase: in your towns
  preserved_meaning: The eating may take place in the people’s local communities rather than at the sanctuary.
  reasoning_layer_used: POB lexical decision and cultural footnote
  rationale: The idiom is stated directly for readers unfamiliar with towns organized around their gates.
- pob_phrase: the unclean and the clean alike
  simplified_phrase: Both ritually unclean and ritually clean people
  preserved_meaning: People of either ritual status are equally permitted to eat.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: Adding “ritually” prevents readers from mistaking ceremonial status for moral character.
- pob_phrase: as the gazelle and the deer
  simplified_phrase: as they may eat gazelle or deer
  preserved_meaning: The meat may be eaten under the same ordinary permissions as wild game.
  reasoning_layer_used: POB lexical rationale for the animal comparison
  rationale: The comparison is recast as a natural English clause without removing either animal.
interpretive_expansions:
- pob_phrase: the unclean and the clean
  rendering: ritually unclean and ritually clean people
  claim: The contrast concerns ritual status, not moral goodness or evil.
  evidence:
