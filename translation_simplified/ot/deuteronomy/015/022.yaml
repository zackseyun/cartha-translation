- pob_phrase: as the gazelle and the deer
  rendering: as they may eat gazelle or deer
  claim: The comparison concerns permission to eat these animals as ordinary wild game.
  evidence:
  - The POB lexical rationale says the comparison is to wild game eaten without sacrificial restrictions.
  - The immediate sentence applies the same permission to people of either ritual status.
  confidence: high
  alternatives_preserved:
