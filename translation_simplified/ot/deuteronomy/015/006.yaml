translation:
  language: en
  text: Yahweh your God has blessed you, just as he promised you.[a] Therefore, you will give loans to many nations, but you will not take out loans. You will rule over many nations, but they will not rule over you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “just as he spoke to you.” Here God’s words refer to his promise.
    reason: lexical_alternative
