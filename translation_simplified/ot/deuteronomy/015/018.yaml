translation:
  language: en
  text: Do not consider it a hardship to let him go free, because his six years of service were worth twice the wages of a hired worker.[a] Yahweh your God will bless you in everything you do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He has served you for six years for double the wages of a hired worker.” The Hebrew compares the value of his service with hired labor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It shall not seem hard to you when you send him away free from you
  simplified_phrase: Do not consider it a hardship to let him go free
  preserved_meaning: The release must not be regarded as difficult, burdensome, or costly.
  reasoning_layer_used: Lexical decisions for יִקְשֶׁה בְעֵינֶיךָ and בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי
  rationale: “Hardship” preserves both the evaluative force and the practical burden implied by the idiom.
- pob_phrase: because for six years he has served you for double the wages of a hired worker
  simplified_phrase: because his six years of service were worth twice the wages of a hired worker
  preserved_meaning: His six years of labor had twice the value represented by a hired worker’s wages.
  reasoning_layer_used: Lexical rationale and POB footnote for מִשְׁנֶה שְׂכַר שָׂכִיר
  rationale: The wording prevents readers from assuming that the bonded worker was paid double wages.
