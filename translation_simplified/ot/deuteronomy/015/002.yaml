translation:
  language: en
  text: 'This is the rule for releasing debts: Every creditor must release the debt his neighbor owes him. He must not demand payment from his neighbor or his brother,[a] because a debt release in honor of Yahweh has been proclaimed.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a fellow member of Israel’s covenant community.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this is the matter of the release
  simplified_phrase: This is the rule for releasing debts
  preserved_meaning: The verse introduces the required cancellation of debt claims.
  reasoning_layer_used: Lexical decisions for דְּבַר and שְׁמִטָּה in the sabbatical-year context.
  rationale: “Rule” and “releasing debts” express the legal meaning in familiar English.
- pob_phrase: release what his hand has lent to his neighbor
  simplified_phrase: release the debt his neighbor owes him
  preserved_meaning: Every creditor must give up his claim against the borrower.
  reasoning_layer_used: Lexical decisions for בַּעַל מַשֵּׁה יָדוֹ, מַשֵּׁה, and יַשֶּׁה.
  rationale: The wording removes the opaque hand idiom and clearly states who owes whom.
- pob_phrase: shall not press his neighbor or his brother
  simplified_phrase: must not demand payment from his neighbor or his brother
  preserved_meaning: The creditor may not pursue repayment from a member of the covenant community.
  reasoning_layer_used: Lexical decision for לֹא יִגֹּשׂ and the theological decision retaining “brother.”
  rationale: “Demand payment” identifies the pressure while preserving both social terms.
