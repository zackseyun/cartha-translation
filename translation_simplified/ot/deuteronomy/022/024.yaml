translation:
  language: en
  text: Take both of them out to that city’s gate,[a] and stone them to death. The young woman must die because she did not cry out for help in the city. The man must die because he violated his neighbor’s wife.[b] In this way you must purge the evil from among you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The city gate was the customary public place for legal proceedings and judgment.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “humiliated” or “afflicted,” but here it refers to sexual violation.
    reason: lexical_alternative
