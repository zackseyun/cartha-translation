translation:
  language: en
  text: Then the man who had sexual relations with her must pay her father fifty standard weights of silver.[a] She must become his wife because he violated her.[b] He may never divorce her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew unit is the shekel, a standard measure of weight used for silver.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also be translated “humbled” or “debased,” but here it refers to sexual violation.
    reason: lexical_alternative
