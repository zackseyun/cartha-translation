translation:
  language: en
  text: If you happen to find a bird’s nest along your way, whether in a tree or on the ground, with young birds or eggs and the mother sitting on them, do not take the mother together with them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: happens to be before you on the way
  simplified_phrase: happen to find ... along your way
  preserved_meaning: The nest is encountered by chance while traveling, not deliberately sought out.
  reasoning_layer_used: POB lexical decisions for יִקָּרֵא, לְפָנֶיךָ, and בַּדֶּרֶךְ
  rationale: The active wording is more natural while retaining the chance encounter.
- pob_phrase: with young ones or eggs, and the mother is sitting on the young ones or on the eggs
  simplified_phrase: with young birds or eggs and the mother sitting on them
  preserved_meaning: The mother is positioned on whichever the nest contains, young birds or eggs.
  reasoning_layer_used: POB lexical decisions for אֶפְרֹחִים, בֵיצִים, and רֹבֶצֶת
  rationale: The pronoun avoids repetition while keeping both alternatives clear.
- pob_phrase: you shall not take the mother along with the young
  simplified_phrase: do not take the mother together with them
  preserved_meaning: The prohibition applies to taking the mother with either the young birds or the eggs.
  reasoning_layer_used: POB lexical decision for הָאֵם עַל הַבָּנִים and its footnote
  rationale: The plural pronoun clearly refers back to both young birds and eggs.
