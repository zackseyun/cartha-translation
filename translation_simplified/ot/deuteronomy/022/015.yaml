translation:
  language: en
  text: Then the young woman’s father and mother must present evidence of her virginity to the city elders at the city gate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the young woman’s virginities,” an idiom for physical tokens offered as evidence of virginity.
    reason: lexical_alternative
