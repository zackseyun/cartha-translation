  text: But if your brother[a] is not nearby and you do not know who the owner is, bring it into your home. Keep it with you until your brother comes looking for it. Then return it to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a fellow member of Israel’s covenant community, not only a biological brother.
    reason: cultural_note
