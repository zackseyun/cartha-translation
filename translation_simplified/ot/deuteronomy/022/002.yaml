  preserved_meaning: The finder must retain the lost property until its owner seeks it.
  reasoning_layer_used: POB lexical decision for וְהָיָה עִמְּךָ
  rationale: The direct command makes the continuing duty clear.
- pob_phrase: until your brother seeks it; then you shall restore it to him
