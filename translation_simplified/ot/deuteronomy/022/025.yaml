translation:
  language: en
  text: But if a man finds a young woman who is pledged to be married out in an open field, then seizes her[a] and has sexual relations with her, only that man must be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “overpowers her.” The Hebrew says “seizes her,” and the surrounding law shows that the act is forced.
    reason: lexical_alternative
