translation:
  language: en
  text: A woman must not wear a man’s clothing or gear,[a] and a man must not put on a woman’s clothing. Everyone who does these things is detestable to Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term in the first command is broader than the specific word for “clothing” in the second command and may include other gear or equipment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a man's article
  simplified_phrase: a man’s clothing or gear
  preserved_meaning: The first command covers more than clothing alone without defining the term’s exact limits.
  reasoning_layer_used: POB lexical and theological decisions on כְלִי גֶבֶר
  rationale: This wording replaces the unclear word “article” while preserving the Hebrew term’s breadth and male association.
- pob_phrase: shall not wear / shall not put on
  simplified_phrase: must not wear / must not put on
  preserved_meaning: Both clauses remain direct prohibitions with distinct wording.
  reasoning_layer_used: POB lexical decisions on עַל אִשָּׁה and יִלְבַּשׁ
  rationale: “Must not” expresses both commands naturally in modern English without weakening them.
- pob_phrase: is an abomination to Yahweh your God
  simplified_phrase: is detestable to Yahweh your God
  preserved_meaning: Everyone who practices these acts remains strongly condemned before God.
  reasoning_layer_used: POB lexical decision on תוֹעֲבַת יְהוָה
  rationale: “Detestable” communicates the strong covenantal condemnation in familiar English.
translation_notes:
