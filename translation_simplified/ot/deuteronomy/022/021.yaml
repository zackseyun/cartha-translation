translation:
  language: en
  text: Then they must bring the young woman to the entrance of her father's house. The men of her city must throw stones at her until she dies. She has committed a shameful outrage in Israel by prostituting herself in her father's house.[a] In this way you must remove the evil from among you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “prostituting herself” can refer more broadly to committing illicit sexual acts, not necessarily to selling sex.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall stone her with stones, and she shall die
  simplified_phrase: must throw stones at her until she dies
  preserved_meaning: The city's men execute her by stoning, and the sentence results in death.
  reasoning_layer_used: Lexical decision for וּסְקָלוּהָ ... בָּאֲבָנִים
  rationale: The concrete action is clearer than the legal verb while preserving the source image.
- pob_phrase: because she has committed an outrageous act
  simplified_phrase: She has committed a shameful outrage
  preserved_meaning: Her act is presented as a shocking moral and communal offense.
  reasoning_layer_used: Lexical decision for נְבָלָה
  rationale: “Shameful outrage” conveys the term's moral force in direct modern English.
- pob_phrase: So you shall purge the evil from your midst
  simplified_phrase: In this way you must remove the evil from among you
  preserved_meaning: The commanded judgment removes the evil from the covenant community.
  reasoning_layer_used: Lexical decision for וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  rationale: The recurring legal formula is expressed without the less familiar word “purge.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “prostituting herself” to mean only commercial sex.
    mitigation: The footnote preserves the broader possible sense of illicit sexual conduct.
