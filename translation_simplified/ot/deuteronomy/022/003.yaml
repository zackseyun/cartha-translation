translation:
  language: en
  text: Do the same when you find your brother’s donkey, his cloak, or anything else of his that has gone missing. You must not ignore it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “You may not hide yourself,” meaning that you must not pretend not to notice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And so you shall do with his donkey, and so you shall do with his cloak, and so you shall do
  simplified_phrase: Do the same when you find your brother’s donkey, his cloak, or
  preserved_meaning: The same duty applies separately to the donkey, the cloak, and every other lost item.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The repeated legal formula is compressed into a clear list without merging or omitting its examples.
- pob_phrase: with any lost thing of your brother that is lost from him and you find it
  simplified_phrase: anything else of his that has gone missing
  preserved_meaning: The command covers any item belonging to the brother that goes missing and is found by the addressee.
  reasoning_layer_used: POB lexical decisions
  rationale: The wording avoids implying that the owner caused the loss while expressing possession naturally.
- pob_phrase: you may not ignore it
  simplified_phrase: You must not ignore it
  preserved_meaning: Ignoring the found item is prohibited, not merely discouraged.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Must not” states the legal prohibition more directly in modern English.
translation_notes:
  risk_flags:
  - risk: Compressing the repeated clauses reduces some of the Hebrew legal cadence.
    mitigation: The three categories remain explicit, and “Do the same” preserves the connection to the preceding command.
  - risk: Modern readers may understand “brother” only as a biological sibling.
    mitigation: The source-driven covenant kinship term is retained rather than generalized.
