translation:
  language: en
  text: They must fine him one hundred shekels of silver[b] and give the silver to the young woman’s father, because he has given an Israelite virgin a bad name. She must remain his wife, and he may never send her away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this marriage law, “send her away” can mean “divorce her.”
    reason: lexical_alternative
  - marker: b
    text: A shekel was a standard unit of weight used for silver.
    reason: cultural_note
simplification_decisions:
- pob_phrase: they shall fine him one hundred shekels of silver and give them
  simplified_phrase: They must fine him one hundred shekels of silver and give the silver
  preserved_meaning: The authorities must impose the stated monetary penalty and transfer it to her father.
  reasoning_layer_used: Lexical decisions for וְעָנְשׁוּ and מֵאָה כֶסֶף
  rationale: “Must” makes the legal requirement clear, and repeating “silver” removes an unclear pronoun.
- pob_phrase: brought a bad name upon a virgin of Israel
  simplified_phrase: given an Israelite virgin a bad name
  preserved_meaning: He has damaged the reputation of a virgin within Israel’s covenant community.
  reasoning_layer_used: Lexical decision for כִּי הוֹצִיא שֵׁם רָע עַל בְּתוּלַת יִשְׂרָאֵל
  rationale: The rewrite uses natural word order while preserving the source image of a bad name.
- pob_phrase: And she shall be his wife; he may not send her away all his days
  simplified_phrase: She must remain his wife, and he may never send her away
  preserved_meaning: The marriage must continue, and he is forbidden to dismiss her for the rest of his life.
  reasoning_layer_used: Lexical and theological decisions for וְלוֹ תִהְיֶה לְאִשָּׁה, לְשַׁלְּחָהּ, and כָּל יָמָיו
  rationale: The sentence states the lifelong legal consequence directly while retaining the Hebrew dismissal image.
