translation:
  language: en
  text: But if the man does not want to marry his brother’s widow, she must go to the elders at the town gate and say, “My brother-in-law refuses to keep his brother’s name and family line alive in Israel. He is not willing to do his duty as a brother-in-law by marrying me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: does not want to take his brother’s widow
  simplified_phrase: does not want to marry his brother’s widow
  preserved_meaning: The man refuses the marriage required by this family duty.
  reasoning_layer_used: Lexical decision for לָקַחַת and the levirate-marriage context
  rationale: “Marry” states the intended legal relationship more clearly than “take.”
- pob_phrase: shall go up to the gate, to the elders
  simplified_phrase: must go to the elders at the town gate
  preserved_meaning: The widow must bring her complaint to the recognized local authorities.
  reasoning_layer_used: Lexical decisions for וְעָלְתָה ... הַשַּׁעְרָה and הַזְּקֵנִים
  rationale: The reordered wording makes the civic setting clear in natural English.
- pob_phrase: raise up a name for his brother in Israel
  simplified_phrase: keep his brother’s name and family line alive in Israel
  preserved_meaning: The duty preserves the deceased brother’s family line and standing in Israel.
  reasoning_layer_used: Lexical rationale for לְהָקִים ... שֵׁם and POB footnote
  rationale: The wording explains the idiom while retaining its image of keeping the brother’s name alive.
interpretive_expansions:
- pob_phrase: to take his brother’s widow
  rendering: to marry his brother’s widow
  claim: “Take” refers here to entering the required marriage.
  evidence:
  - The lexical decision recognizes that לָקַחַת can imply marriage in this context.
  - The technical brother-in-law duty in the verse is fulfilled by marrying the widow.
  confidence: high
  alternatives_preserved:
  - take his brother’s widow
- pob_phrase: raise up a name for his brother
  rendering: keep his brother’s name and family line alive
  claim: The idiom concerns preserving the deceased brother’s family line and standing.
  evidence:
  - The POB lexical rationale explicitly identifies the family line and standing as the idiom’s meaning.
  confidence: high
  alternatives_preserved:
  - raise up a name
  - establish a name
