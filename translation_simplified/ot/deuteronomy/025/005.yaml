translation:
  language: en
  text: If brothers live together and one of them dies without a son,[a] the wife he leaves behind must not marry a man outside the family. Her husband’s brother must marry her, have marital relations with her, and fulfill his duty as her husband’s brother.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew specifically says “son”; some understand the law more broadly as “child.”
    reason: lexical_alternative
  - marker: b
    text: This family duty is traditionally called levirate marriage.
    reason: cultural_note
