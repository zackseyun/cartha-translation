translation:
  language: en
  text: Then his brother’s widow must approach him in the presence of the elders. She must take the sandal off his foot, spit in his face,[a] and declare, “This is what will be done to the man who refuses to build up his brother’s house by continuing his family line.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “spit in front of him.” Some interpreters understand the Hebrew as describing spitting before the man rather than directly in his face.
    reason: lexical_alternative
