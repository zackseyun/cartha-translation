translation:
  language: en
  text: When Yahweh your God gives them over to you and you strike them down, you must completely devote them to destruction.[a] Make no covenant with them and show them no favor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes putting them under the ban—devoting them totally to destruction.
    reason: simplification_note
  - marker: b
    text: Or, “show them no mercy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gives them over to you before you
  simplified_phrase: gives them over to you
  preserved_meaning: Yahweh places them under Israel’s power for conquest.
  reasoning_layer_used: Lexical decisions for וּנְתָנָם and לְפָנֶיךָ
  rationale: The shorter wording conveys the military handover without the awkward phrase “before you.”
- pob_phrase: you shall utterly devote them to destruction
  simplified_phrase: you must completely devote them to destruction
  preserved_meaning: They must be wholly placed under ḥerem, not merely defeated in ordinary warfare.
  reasoning_layer_used: Lexical and theological decisions for חרם
  rationale: “Completely devote” preserves both the intensified command and its consecratory force.
- pob_phrase: You shall make no covenant with them and show them no favor
  simplified_phrase: Make no covenant with them and show them no favor
  preserved_meaning: The formal relational ban and the refusal of favor remain distinct commands.
  reasoning_layer_used: Lexical decisions for כרת ברית and חנן
  rationale: Direct imperatives simplify the sentence without weakening either prohibition.
translation_notes:
  risk_flags:
  - risk: “Devote them to destruction” may still be unfamiliar to some readers.
    mitigation: Footnote a explains the Hebrew ban while retaining its theological force.
  - risk: “Favor” may not convey the contextual overlap with mercy to every reader.
    mitigation: Footnote b preserves “show them no mercy” as a plausible alternative.
