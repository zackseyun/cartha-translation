translation:
  language: en
  text: You saw with your own eyes the great trials[a], signs, and wonders. You saw how Yahweh your God brought you out with his mighty hand and outstretched arm. He will do the same to all the peoples[b] you are afraid of.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great testings.” The Hebrew can refer to severe tests or trials.
    reason: lexical_alternative
  - marker: b
    text: Or “nations.” “Peoples” more closely reflects the Hebrew.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the great trials that your eyes saw, and the signs, and the wonders
  simplified_phrase: You saw with your own eyes the great trials, signs, and wonders.
  preserved_meaning: Israel personally witnessed the severe trials and extraordinary signs in Egypt.
  reasoning_layer_used: POB lexical decisions for הַמַּסֹּת הַגְּדֹלֹת, רָאוּ עֵינֶיךָ, הָאֹתֹת, and הַמֹּפְתִים
  rationale: The direct sentence preserves the eyewitness emphasis while removing the dense list structure.
- pob_phrase: the mighty hand, and the outstretched arm by which Yahweh your God brought you out
  simplified_phrase: You saw how Yahweh your God brought you out with his mighty hand and outstretched arm.
  preserved_meaning: Yahweh powerfully delivered Israel, pictured through the hand and arm images.
  reasoning_layer_used: POB lexical and theological decisions for the divine name and deliverance metaphors
  rationale: The recast clause makes the deliverance clear without weakening either source image.
- pob_phrase: so Yahweh your God will do to all the peoples of whom you are afraid
  simplified_phrase: He will do the same to all the peoples you are afraid of.
  preserved_meaning: Yahweh will act against the feared peoples as he acted in Egypt.
  reasoning_layer_used: POB lexical decision for כֵּן יַעֲשֶׂה and immediate context
  rationale: “Do the same” states the comparison naturally, and the pronoun avoids needless repetition.
