translation:
  language: en
  text: For he will cause your son to stop following me, and they will serve other gods.[a] Then Yahweh’s anger will burn against you, and he will quickly destroy you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “and he will serve other gods.” The Hebrew shifts from singular “your son” to plural “they,” possibly broadening the warning to his family line or community.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: turn your son away from following me
  simplified_phrase: cause your son to stop following me
  preserved_meaning: A foreign spouse causes the Israelite son to cease following Yahweh.
  reasoning_layer_used: Lexical decision for יָסִיר and מֵאַחֲרַי
  rationale: The rewrite states the causation and the Hebrew idiom in direct modern English.
- pob_phrase: and they will serve other gods; then
  simplified_phrase: and they will serve other gods. Then
  preserved_meaning: Turning away leads to serving other gods and then to judgment.
  reasoning_layer_used: Lexical and theological decisions on the number shift and sequence
  rationale: A sentence break clarifies the consequence without smoothing the singular-to-plural shift.
- pob_phrase: the anger of Yahweh will burn against you
  simplified_phrase: Yahweh’s anger will burn against you
  preserved_meaning: Yahweh’s personal anger is vividly pictured as burning against Israel.
  reasoning_layer_used: Lexical and theological decisions for וְחָרָה אַף יְהוָה
  rationale: The possessive form is easier to read while preserving the divine name and burning image.
translation_notes:
  risk_flags:
  - risk: Modern readers may find the shift from singular “your son” to plural “they” abrupt.
    mitigation: The footnote preserves the narrower singular reading and explains the possible broader scope.
  - risk: The pronoun “he” depends on the intermarriage context in the preceding verse.
    mitigation: It remains unchanged so the translation does not over-resolve its contextual referent.
