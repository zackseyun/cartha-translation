translation:
  language: en
  text: 'But this is what you must do to them: Tear down their altars, smash their sacred stone pillars, cut down their Asherah poles,[a] and burn their carved images in the fire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
