  reasoning_layer_used: Lexical decision for תַעֲשׂוּ לָהֶם and theological decision on command force
  rationale: “Must” expresses the directive force in familiar modern English.
- pob_phrase: shatter their pillars
  simplified_phrase: smash their sacred stone pillars
  preserved_meaning: The objects are cultic standing stones that must be forcefully broken.
  reasoning_layer_used: Lexical decisions for מַצֵּבֹתָם and תְּשַׁבֵּרוּ
  rationale: The added description helps readers picture the pillars and keeps the force of “shatter.”
- pob_phrase: burn their carved images with fire
  simplified_phrase: burn their carved images in the fire
  preserved_meaning: The carved cult images are to be destroyed by fire.
  reasoning_layer_used: Lexical decisions for פְסִילֵיהֶם and תִּשְׂרְפוּן בָּאֵשׁ
  rationale: The recast wording keeps the explicit fire image while sounding natural.
