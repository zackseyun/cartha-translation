translation:
  language: en
  text: Yahweh will take away all your sickness. He will not bring on you any of the harmful diseases of Egypt that you have known.[a] Instead, he will bring them on all who hate you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean diseases that you experienced.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: remove from you all sickness
  simplified_phrase: take away all your sickness
  preserved_meaning: Yahweh will cause sickness to depart from Israel.
  reasoning_layer_used: Lexical decision for וְהֵסִיר and מִמְּךָ
  rationale: “Take away” expresses the removal image in more natural English.
- pob_phrase: the evil diseases of Egypt
  simplified_phrase: the harmful diseases of Egypt
  preserved_meaning: The diseases are described as bad, harmful, or grievous.
  reasoning_layer_used: Lexical decision for מַדְוֵי מִצְרַיִם הָרָעִים
  rationale: “Harmful” avoids suggesting moral evil while retaining the Hebrew adjective’s force.
- pob_phrase: will he put on you; instead, he will put them on
  simplified_phrase: He will not bring on you ... Instead, he will bring them on
  preserved_meaning: Yahweh will withhold these diseases from Israel and impose them on those who hate Israel.
  reasoning_layer_used: Lexical decisions for לֹא יְשִׂימָם בָּךְ and וּנְתָנָם
  rationale: The reordered clauses and “bring on” make the contrast clear in ordinary English.
translation_notes:
  risk_flags:
  - risk: Readers may treat this covenant promise as unconditional immunity from illness for every believer.
    mitigation: The text remains addressed to Israel in its covenant setting and adds no universal claim.
