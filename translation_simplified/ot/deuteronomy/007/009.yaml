translation:
  language: en
  text: So know this:[a] Yahweh your God is God. He is the faithful God. He keeps his covenant and continues to show steadfast love to those who love him and those who keep his commandments, through a thousand generations.[b]
  philosophy: optimal-equivalence
  footnotes:
