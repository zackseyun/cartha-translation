translation:
  language: en
  text: You must consume all the peoples Yahweh your God is giving to you—that is, completely defeat them. Do not pity them or spare them. Do not serve their gods, because serving those gods would trap you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer more broadly to the whole idolatrous situation as what would trap you.
    reason: alternative_reading
