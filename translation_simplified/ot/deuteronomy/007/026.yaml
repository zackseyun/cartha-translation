    mitigation: The command’s strong language and explicit reference to God’s judgment preserve its theological seriousness.
  - risk: “Completely reject” is broader than the emotional verb “abhor.”
    mitigation: The preceding phrase preserves revulsion, while the second phrase keeps the distinct demand for total repudiation.
