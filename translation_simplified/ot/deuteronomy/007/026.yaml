translation:
  language: en
  text: Do not bring any detestable thing into your home. If you do, you will become set apart for destruction[a] just as it is. Treat it as utterly disgusting and completely reject it, because it is set apart for destruction under God’s judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “placed under the ban”; traditionally, “accursed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bring an abomination into your house
  simplified_phrase: bring any detestable thing into your home
  preserved_meaning: The prohibited object remains something morally and ritually detestable in the domestic sphere.
  reasoning_layer_used: POB lexical decisions for תּוֹעֵבָה and בֵּיתֶךָ
  rationale: Common words replace the difficult term “abomination” while preserving its strong negative force.
- pob_phrase: or you will become devoted to destruction like it
  simplified_phrase: If you do, you will become set apart for destruction just as it is
  preserved_meaning: Bringing the object home makes the person liable to the same destruction as the object.
  reasoning_layer_used: POB lexical and theological decision for חֵרֶם
  rationale: A direct conditional sentence makes the consequence easier to follow without weakening it.
- pob_phrase: You shall utterly detest it and utterly abhor it
  simplified_phrase: Treat it as utterly disgusting and completely reject it
  preserved_meaning: The two intensified commands require both strong revulsion and total rejection.
  reasoning_layer_used: POB lexical decisions for both Hebrew intensive constructions
  rationale: Concrete verbs express both commands in clear English and retain their full intensity.
interpretive_expansions:
- pob_phrase: for it is devoted to destruction
  rendering: because it is set apart for destruction under God’s judgment
  claim: The object’s destruction results from divine judgment, not merely human hostility.
  evidence:
  - The POB footnote defines the term as destruction under divine judgment.
  - The theological decision identifies this as a covenant-judgment context.
  confidence: high
  alternatives_preserved:
