translation:
  language: en
  text: When Yahweh your God brings you into the land you are about to enter and possess, he will drive out seven nations ahead of you. They are the Hittites, Girgashites, Amorites, Canaanites, Perizzites, Hivites, and Jebusites—nations larger and stronger than you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “more numerous and stronger than you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the land that you are entering to possess
  simplified_phrase: the land you are about to enter and possess
  preserved_meaning: Israel will soon enter the promised territory and take possession of it.
  reasoning_layer_used: POB lexical decisions for הָאָרֶץ, אֲשֶׁר אַתָּה בָא שָׁמָּה, and לְרִשְׁתָּהּ
  rationale: The new wording makes the imminent entry and possession clear in ordinary English.
- pob_phrase: many nations—the Hittites ... seven nations
  simplified_phrase: seven nations ahead of you. They are the Hittites ...
  preserved_meaning: Yahweh will remove the seven named peoples as Israel advances.
  reasoning_layer_used: POB lexical decisions for וְנָשַׁל, גּוֹיִם רַבִּים, and שִׁבְעָה גוֹיִם
  rationale: Splitting the long clause lets readers identify the seven nations without losing the list.
- pob_phrase: greater and mightier than you
  simplified_phrase: larger and stronger than you
  preserved_meaning: The nations surpass Israel in size or number and in strength.
  reasoning_layer_used: POB lexical decision for רַבִּים וַעֲצוּמִים
  rationale: “Larger and stronger” states the comparison in familiar modern language while the footnote preserves the numerical alternative.
