translation:
  language: en
  text: 'He will love you, bless you, and make you numerous. He will bless the fruit of your womb—your children—and the fruit of your soil: your grain, new wine, and oil. He will also bless the young of your herds and flocks. All this will happen in the land he swore to your fathers[a] that he would give you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ancestors.” The Hebrew reads “fathers.”
    reason: lexical_alternative
