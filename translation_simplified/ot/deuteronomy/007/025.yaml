    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall burn the carved images of their gods with fire
  simplified_phrase: Burn the carved images of their gods
  preserved_meaning: The command still requires destroying the carved divine images by burning them.
  reasoning_layer_used: Lexical decisions for פְּסִילֵי and תִּשְׂרְפוּן בָּאֵשׁ
  rationale: The direct command is clearer, and “burn” already identifies fire as the means.
- pob_phrase: You shall not covet
  simplified_phrase: Do not desire
  preserved_meaning: Israel must not want the precious metal attached to the images.
  reasoning_layer_used: Lexical decision for לֹא תַחְמֹד
  rationale: “Desire” states the prohibition in more familiar English.
- pob_phrase: lest you be ensnared by it
  simplified_phrase: Otherwise, you may be trapped by it
  preserved_meaning: The forbidden object or idolatrous complex may bring the hearer into danger like a snare.
  reasoning_layer_used: Lexical decision for פֶּן תִּוָּקֵשׁ בּוֹ and the final-pronoun theological decision
  rationale: The wording preserves the passive warning and broad pronoun while the note retains the snare image.
translation_notes:
  risk_flags:
