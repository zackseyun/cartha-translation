translation:
  language: en
  text: Burn the carved images of their gods. Do not desire the silver or gold on them or take it for yourself. Otherwise, you may be trapped by it.[a] It is detestable to Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
