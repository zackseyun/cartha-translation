translation:
  language: en
  text: Therefore, obey the commandment, the statutes, and the legal rulings that I am commanding you today. Put them into practice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also begin, “And obey”; here it points back to the preceding verses as the reason for obedience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So you shall keep
  simplified_phrase: Therefore, obey
  preserved_meaning: The preceding verses lead to a call for covenant obedience.
  reasoning_layer_used: Lexical decision for וְשָׁמַרְתָּ and footnote a
  rationale: “Therefore, obey” clearly expresses both the inference and the legal sense of “keep.”
- pob_phrase: the judgments
  simplified_phrase: the legal rulings
  preserved_meaning: This remains a distinct category of prescribed legal decisions alongside statutes.
  reasoning_layer_used: Lexical and theological decisions for הַמִּשְׁפָּטִים
  rationale: “Legal rulings” clarifies the formal sense without merging the covenant-law terms.
- pob_phrase: to do them
  simplified_phrase: Put them into practice
  preserved_meaning: God requires the people to carry out these commands concretely.
  reasoning_layer_used: Lexical decision for לַעֲשׂוֹתָם
  rationale: A short sentence preserves the force of active obedience in natural English.
translation_notes:
  risk_flags:
  - risk: “Obey” and “put them into practice” may sound repetitive.
    mitigation: The repetition preserves the distinction between keeping the laws and carrying them out.
