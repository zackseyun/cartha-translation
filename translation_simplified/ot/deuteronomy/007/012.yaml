translation:
  language: en
  text: If you listen to these rulings, keep them, and carry them out, Yahweh your God will keep for you the covenant and steadfast love that he swore to your fathers with an oath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” means loyal, enduring love within a covenant relationship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And because you listen
  simplified_phrase: If you listen
  preserved_meaning: Israel’s response is the condition leading to the stated consequence.
  reasoning_layer_used: POB lexical decision for וְהָיָה עֵקֶב
  rationale: The conditional form communicates the documented causal relationship in natural English.
- pob_phrase: these judgments, and keep and do them
  simplified_phrase: these rulings, keep them, and carry them out
  preserved_meaning: The legal sense remains, and both guarding the rulings and putting them into practice stay distinct.
  reasoning_layer_used: POB lexical decisions for הַמִּשְׁפָּטִים and וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  rationale: “Rulings” and “carry them out” make the commands immediately understandable without merging them.
- pob_phrase: that he swore to your fathers
  simplified_phrase: that he swore to your fathers with an oath
  preserved_meaning: Yahweh made a solemn sworn commitment to the patriarchal fathers.
  reasoning_layer_used: POB lexical and theological decisions for אֲשֶׁר נִשְׁבַּע and לַאֲבֹתֶיךָ
  rationale: “With an oath” clarifies the force of “swore” while retaining the historical masculine reference.
