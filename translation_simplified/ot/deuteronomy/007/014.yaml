translation:
  language: en
  text: You will be more blessed than all other peoples.[a] No man or woman among you will be unable to have children, and none of your livestock will be unable to reproduce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blessed above all peoples.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: blessed above all peoples
  simplified_phrase: more blessed than all other peoples
  preserved_meaning: Israel’s blessed status is compared with that of every other people.
  reasoning_layer_used: POB lexical decision and footnote on מִכָּל הָעַמִּים
  rationale: This wording makes the comparison directly modify “blessed” while retaining POB’s recognized alternative.
- pob_phrase: a barren man or woman
  simplified_phrase: No man or woman among you will be unable to have children
  preserved_meaning: Both male and female infertility are explicitly included.
  reasoning_layer_used: POB lexical and theological decisions on עָקָר וַעֲקָרָה
  rationale: The plain description explains “barren” while preserving the Hebrew male-female pairing.
- pob_phrase: or among your livestock
  simplified_phrase: and none of your livestock will be unable to reproduce
  preserved_meaning: The promised fertility also extends to domesticated animals.
  reasoning_layer_used: POB lexical decision on וּבִבְהֶמְתֶּךָ and immediate clause parallelism
  rationale: Repeating the fertility idea makes the compressed Hebrew clause clear in English.
translation_notes:
  risk_flags:
  - risk: “More blessed” may be heard mainly as a difference in the amount of blessing.
    mitigation: The wording clearly compares blessed status, and the footnote preserves POB’s “above all peoples.”
