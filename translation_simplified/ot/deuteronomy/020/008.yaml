translation:
  language: en
  text: Then the officers must continue speaking to the people. They must say, “Is any man afraid and lacking courage? Let him leave and go back home, so that he does not make his brothers[a] lose courage as he has.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” means his fellow Israelite soldiers.
    reason: cultural_note
