translation:
  language: en
  text: Is any man engaged to a woman but not yet married to her? Let him leave and return home. Otherwise, he may die in battle, and another man may marry her.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And who is the man who has become engaged to a woman
  simplified_phrase: Is any man engaged to a woman
  preserved_meaning: The proclamation identifies the next man who is exempt from battle.
  reasoning_layer_used: POB lexical decision for וּמִי הָאִישׁ and אֵרַשׂ
  rationale: A direct question is more natural while preserving the formal engagement and military context.
- pob_phrase: Let him go and return to his house
  simplified_phrase: Let him leave and return home
  preserved_meaning: The man is directed to leave the troops and go back home.
  reasoning_layer_used: POB lexical decisions for יֵלֵךְ וְיָשֹׁב and לְבֵיתוֹ
  rationale: “Leave” and “home” express the directive in ordinary modern English.
- pob_phrase: lest he die in the battle
  simplified_phrase: Otherwise, he may die in battle
  preserved_meaning: The exemption prevents the possibility of his death in the present fighting.
  reasoning_layer_used: POB lexical decisions for פֶּן and יָמוּת בַּמִּלְחָמָה
  rationale: A separate warning sentence replaces the less familiar word “lest.”
interpretive_expansions:
- pob_phrase: has not taken her ... another man take her
  rendering: not yet married to her ... another man may marry her
  claim: In both clauses, “take” refers to completing marriage rather than physically taking the woman.
  evidence:
  - The POB cultural note explicitly explains the first phrase as completing the marriage.
  - The POB lexical decisions identify marriage as the contextual sense in both clauses.
  confidence: high
  alternatives_preserved:
  - The engagement remains distinct from completed marriage.
translation_notes:
  risk_flags:
  - risk: Rendering both uses of “take” as “marry” removes the repeated Hebrew marriage idiom.
    mitigation: The repeated marital meaning and the contrast between engagement and completed marriage remain explicit.
