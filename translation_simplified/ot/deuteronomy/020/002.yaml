translation:
  language: en
  text: As you are about to enter battle,[a] the priest is to step forward and speak to the people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “enter the war.” The Hebrew can refer either to war generally or to a specific battle.
    reason: lexical_alternative
  - marker: b
    text: Here “the people” means the assembled Israelite fighting force.
    reason: cultural_note
