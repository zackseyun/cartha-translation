  reasoning_layer_used: POB lexical decision for שְׁמַע יִשְׂרָאֵל
  rationale: “Listen” is the documented plain-English alternative and keeps the force of the summons.
- pob_phrase: today you are drawing near to battle
  simplified_phrase: Today you are about to go into battle
  preserved_meaning: Israel is on the verge of engaging in battle.
  reasoning_layer_used: POB lexical decisions for קְרֵבִים and לַמִּלְחָמָה
  rationale: This recasts the movement image in natural English while preserving imminent approach.
- pob_phrase: Do not let your heart grow faint
  simplified_phrase: Do not lose heart
  preserved_meaning: They must not allow their inner courage to fail.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: The documented idiom is clearer while retaining the source image of the heart.
