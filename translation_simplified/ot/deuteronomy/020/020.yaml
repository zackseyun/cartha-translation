  language: en
  text: You may destroy and cut down only trees that you know do not produce food. You may use them to build siege structures[a] against the city that is fighting you, until you bring the city down.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer broadly to siege fortifications or more specifically to a siege ramp.
    reason: lexical_alternative
  - marker: b
    text: Or “until the city falls.” The Hebrew uses the image of bringing the city down in defeat.
    reason: lexical_alternative
