translation:
  language: en
  text: Is there a man who has planted a vineyard but has not yet enjoyed its fruit?[a] Let him leave and go home. Otherwise, he may die in battle, and another man may enjoy its fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More formally, “has not dedicated it” or “has not begun to use it.” This likely refers to first enjoying the vineyard’s produce after the required waiting period (see Leviticus 19:23–25).
    reason: lexical_alternative
