translation:
  language: en
  text: Then the officers must say to the people, “Is there any man who has built a new house but has not yet dedicated it?[a] Let him leave and go back to his house. Otherwise, he might die in battle, and another man would dedicate it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “formally begun using it.” The Hebrew can refer to inaugurating a new house with a dedicatory sense.
    reason: lexical_alternative
