translation:
  language: en
  text: When you surround a city and fight for a long time to capture it, do not destroy its trees by chopping at them with an axe. They provide food for you, so do not cut them down. Is a tree in the field a man who can stand against you in the siege?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may instead mean, “A man is the tree of the field,” or, “The tree of the field is food for people.”
    reason: alternative_reading
