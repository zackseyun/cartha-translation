translation:
  language: en
  text: No Ammonite or Moabite may be admitted to Yahweh’s assembly. Not even someone in the tenth generation descended from them may be admitted to Yahweh’s assembly; this exclusion lasts forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew includes both “the tenth generation” and “forever,” emphasizing that the exclusion endures.
    reason: cultural_note
