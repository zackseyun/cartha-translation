simplification_decisions:
- pob_phrase: No man with crushed testicles or a severed penis may enter
  simplified_phrase: A man whose testicles have been crushed or whose penis has been cut off may not enter
  preserved_meaning: The prohibition applies to either of the two specified injuries to male sexual organs.
