  rationale: Full relative clauses make the two physical conditions immediately clear without weakening the prohibition.
- pob_phrase: the assembly of Yahweh
  simplified_phrase: Yahweh’s assembly
  preserved_meaning: The text excludes the man from the assembly associated with Yahweh without defining its full scope.
  reasoning_layer_used: POB lexical and theological decisions for בִּקְהַל יְהוָה
  rationale: The possessive form is more natural English while preserving the key covenantal phrase and its ambiguity.
