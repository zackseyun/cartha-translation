- pob_phrase: you shall not put a sickle to your neighbor’s standing grain
  simplified_phrase: you must not cut your neighbor’s standing grain with a sickle
  preserved_meaning: Cutting the neighbor’s unharvested crop with a harvesting tool is forbidden.
