translation:
  language: en
  text: You may charge a foreigner interest on a loan, but you must not charge your brother interest.[a] Do this so that Yahweh your God may bless everything you put your hand to in the land you are entering to possess.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “your brother” means a fellow Israelite.
    reason: cultural_note
