  rationale: The contextual sense is stated directly so modern readers do not mistake this for a rule limited to siblings.
- pob_phrase: interest on money, interest on food
  simplified_phrase: charge interest when you lend money, food
  preserved_meaning: The prohibition covers interest charged on loans of money and food.
  reasoning_layer_used: POB lexical decisions for תַשִּׁיךְ, כֶּסֶף, and אֹכֶל
  rationale: The repeated legal wording becomes a natural statement about lending without narrowing the prohibition.
- pob_phrase: or interest on anything that is lent at interest
  simplified_phrase: or anything else
  preserved_meaning: The prohibition extends to every other kind of interest-bearing loan.
  reasoning_layer_used: POB lexical decisions for כָּל דָּבָר and אֲשֶׁר יִשָּׁךְ
  rationale: Within the lending clause, “anything else” clearly preserves the comprehensive final category.
