  reasoning_layer_used: lexical and theological decisions
  rationale: The natural wording retains the concrete image of Yahweh walking among his people.
- pob_phrase: to deliver you and to give your enemies before you
  simplified_phrase: to rescue you and hand your enemies over to you
  preserved_meaning: Yahweh protects Israel in battle by placing its enemies under its power.
  reasoning_layer_used: lexical decision and footnote a
  rationale: This replaces an opaque Hebrew idiom while keeping rescue and victory distinct.
- pob_phrase: anything indecent
  simplified_phrase: anything shameful or unclean
  preserved_meaning: The expression broadly covers what would defile the camp.
  reasoning_layer_used: lexical decision and footnote b
  rationale: The clearer wording preserves the broad scope rather than limiting it to nudity.
