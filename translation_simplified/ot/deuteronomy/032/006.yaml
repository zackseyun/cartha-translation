translation:
  language: en
  text: Is this how you repay Yahweh, you foolish people with no wisdom? Is he not your Father, who took you as his own?[a] He made you and set you firmly in place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “acquired you.” The Hebrew can also mean “created you” or “bought you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O foolish and unwise people
  simplified_phrase: you foolish people with no wisdom
  preserved_meaning: The rebuke retains both moral foolishness and lack of wisdom.
  reasoning_layer_used: POB lexical decision for עַם נָבָל וְלֹא חָכָם
  rationale: This removes the formal vocative while preserving both parts of the rebuke.
- pob_phrase: who acquired you
  simplified_phrase: who took you as his own
  preserved_meaning: Yahweh acquired Israel as a people belonging to him.
  reasoning_layer_used: POB theological decision for קנה
  rationale: This expresses acquisition and belonging without blurring the following statement that he made them.
- pob_phrase: established you
  simplified_phrase: set you firmly in place
  preserved_meaning: Yahweh gave the people stability and a secure standing.
  reasoning_layer_used: POB lexical decision for וַיְכֹנְנֶךָ
  rationale: The concrete wording makes the idea of firm establishment easier to understand.
interpretive_expansions:
- pob_phrase: who acquired you
  rendering: who took you as his own
  claim: Acquiring Israel means taking the people into belonging to Yahweh.
  evidence:
  - The POB rationale identifies covenantal belonging as the contextual sense.
  - The following clause separately says that Yahweh made Israel.
  confidence: high
  alternatives_preserved:
  - acquired you
  - created you
  - bought you
translation_notes:
