    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Rejoice, O nations, with his people
  simplified_phrase: Nations, rejoice with his people!
  preserved_meaning: The nations are called to celebrate together with God’s people.
  reasoning_layer_used: The POB theological decision supplies “with” as the most plausible relation in the compressed Hebrew.
  rationale: Direct address and a shorter sentence make the opening call easier to follow.
- pob_phrase: he will avenge the blood of his servants
  simplified_phrase: He will avenge the shed blood of his servants.
  preserved_meaning: God will answer the unjust killing of those who belong to him.
  reasoning_layer_used: The POB lexical decision retains both avenging and the blood image.
  rationale: Adding “shed” clarifies the familiar biblical image without removing it.
- pob_phrase: he will repay vengeance on his adversaries
  simplified_phrase: He will repay his enemies with vengeance
  preserved_meaning: God will bring just retribution upon his hostile opponents.
  reasoning_layer_used: The doctrine realignment requires both repayment and vengeance to remain distinct in the wording.
  rationale: “Enemies” is more common than “adversaries,” while “repay” and “vengeance” preserve the Hebrew forces.
