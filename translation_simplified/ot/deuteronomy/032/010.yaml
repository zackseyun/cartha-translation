  preserved_meaning: God guarded him as carefully as a person protects the vulnerable center of the eye.
  reasoning_layer_used: POB lexical decision for כְּאִישׁוֹן עֵינוֹ
  rationale: “Own” makes the comparison clear while preserving the concrete eye image.
