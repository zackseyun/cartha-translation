translation:
  language: en
  text: He found him in a barren desert, in a desolate, howling wilderness. He surrounded him and cared for him.[a] He guarded him like the pupil of his own eye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that he gave him understanding or paid close attention to him.
    reason: alternative_reading
  - marker: b
    text: Traditionally, “like the apple of his eye.”
    reason: lexical_alternative
