translation:
  language: en
  text: He said to them, “Take to heart all the words I am solemnly declaring to you today.[a] Do this so that you may command your sons[b] to carefully follow and carry out everything this law says.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “warning you today” or “calling as witness against you today.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “sons,” which can also represent the next generation more broadly.
    reason: lexical_alternative
