translation:
  language: en
  text: For Yahweh’s share is his people; Jacob is the allotted share of his inheritance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may picture Jacob as the portion marked out by a measuring line.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For Yahweh’s portion is his people
  simplified_phrase: For Yahweh’s share is his people
  preserved_meaning: Yahweh’s covenant people belong to him as his assigned portion.
  reasoning_layer_used: The lexical decisions for חֵלֶק and עַמּוֹ preserve the portion image and covenant relationship.
  rationale: “Share” is more familiar than “portion” and avoids adding emphasis absent from the source.
- pob_phrase: Jacob the share of his inheritance
  simplified_phrase: Jacob is the allotted share of his inheritance
  preserved_meaning: Jacob, referring corporately to the covenant people, is Yahweh’s allotted portion within his inheritance.
  reasoning_layer_used: The decisions for חֶבֶל and נַחֲלָתוֹ support “allotted share” and “inheritance,” while the theological decision retains “Jacob.”
  rationale: Adding “is” completes the poetic clause while making Jacob, not the inheritance itself, the allotted share.
translation_notes:
  risk_flags:
  - risk: “Allotted” may suggest that someone superior assigned Yahweh his share.
    mitigation: The wording preserves the source metaphor without identifying an allotter.
  - risk: Readers may not recognize Jacob as the people of Israel.
    mitigation: The parallel phrase “his people” supplies the corporate sense without replacing the name.
