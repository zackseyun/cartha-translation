translation:
  language: en
  text: They made me jealous with what is not a god; their worthless idols provoked me to anger. In return, I will make them jealous through those who are not a people.[a] I will provoke them to anger through a morally foolish nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “a no-people”; this deliberately parallels “what is not a god.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They made me jealous with what is not a god; they provoked me to anger with their idols
  simplified_phrase: They made me jealous with what is not a god; their worthless idols provoked me to anger
  preserved_meaning: Their worship of what is not a god aroused God's jealousy and anger.
  reasoning_layer_used: Lexical decisions for בְּלֹא אֵל, כִּעֲסוּנִי, and בְּהַבְלֵיהֶם
  rationale: The rewrite uses direct clause structure while preserving the denial, causative force, and idols' worthlessness.
- pob_phrase: So I will make them jealous with those who are not a people
  simplified_phrase: In return, I will make them jealous through those who are not a people
  preserved_meaning: God responds with a parallel judgment carried out through an unidentified people.
  reasoning_layer_used: Lexical and theological decisions for אַקְנִיאֵם and בְּלֹא עָם
  rationale: “In return” highlights the reciprocal judgment, and “through” clarifies the people's role as its instrument.
- pob_phrase: with a foolish nation
  simplified_phrase: through a morally foolish nation
  preserved_meaning: The nation's foolishness is ethical and spiritual, not merely intellectual.
  reasoning_layer_used: Lexical decision and cultural note for בְּגוֹי נָבָל
  rationale: “Morally” prevents a merely intellectual reading without narrowing the phrase to spirituality alone.
interpretive_expansions:
- pob_phrase: their idols
  rendering: their worthless idols
  claim: The idols are empty and worthless, not merely alternative objects of worship.
  evidence:
