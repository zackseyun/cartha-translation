  - POB footnote a gives “worthless things” as an alternative.
  confidence: high
  alternatives_preserved:
  - their idols
  - their vanities
- pob_phrase: a foolish nation
  rendering: a morally foolish nation
  claim: The foolishness is moral and spiritual rather than a mere lack of intelligence.
  evidence:
  - POB footnote c explicitly identifies a moral-spiritual sense.
  - The lexical rationale warns against reading נָבָל as only low intelligence.
  confidence: high
  alternatives_preserved:
  - a foolish nation
  - a senseless nation
translation_notes:
  risk_flags:
  - risk: “Those who are not a people” remains an unusual expression.
