translation:
  language: en
  text: Remember the ancient days. Think about the years gone by, generation after generation. Ask your father[a], and he will tell you. Ask your elders, and they will speak to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ancestor,” if the word is understood more broadly than one’s immediate father.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the days of old
  simplified_phrase: the ancient days
  preserved_meaning: The command points the hearer back to the distant past.
  reasoning_layer_used: Lexical decision for יְמוֹת עוֹלָם
  rationale: “Ancient days” expresses the established meaning in more familiar English.
- pob_phrase: consider the years of generation after generation
  simplified_phrase: Think about the years gone by, generation after generation
  preserved_meaning: The hearer must reflect on history across successive generations.
  reasoning_layer_used: Lexical decisions for בִּינוּ and שְׁנוֹת דּוֹר וָדֹר
  rationale: The revised wording makes the reflective command and Hebrew idiom immediately understandable.
- pob_phrase: Ask your father, and he will tell you, your elders, and they will say to you
  simplified_phrase: Ask your father, and he will tell you. Ask your elders, and they will speak to you.
  preserved_meaning: Both one’s father and community elders are presented as sources of knowledge about the past.
  reasoning_layer_used: Lexical decisions for שְׁאַל, אָבִיךָ, זְקֵנֶיךָ, וְיַגֵּדְךָ, and וְיֹאמְרוּ לָךְ
  rationale: Two short sentences clarify the parallel structure while keeping the distinct verbs for telling and speaking.
translation_notes:
  risk_flags:
  - risk: Repeating “Ask” makes the shared Hebrew imperative explicit before “your elders.”
    mitigation: The repetition only clarifies that the same command governs both father and elders.
