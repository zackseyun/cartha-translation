translation:
  language: en
  text: This is because you acted unfaithfully against me among the sons of Israel[a] at the waters of Meribath-kadesh[b], in the wilderness of Zin. There among the sons of Israel, you did not honor me as holy.
  philosophy: optimal-equivalence
  footnotes:
