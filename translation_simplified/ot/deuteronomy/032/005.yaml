simplification_decisions:
- pob_phrase: They have acted corruptly toward him
  simplified_phrase: They have acted corruptly toward him
  preserved_meaning: The people committed corrupt acts in relation to God without specifying whether the relation is simply toward him or against him.
  reasoning_layer_used: Lexical decisions for שִׁחֵת and לוֹ
  rationale: The POB wording is retained because it clearly preserves both the verbal force and the careful relational ambiguity.
- pob_phrase: they are not his children, because of their defect
  simplified_phrase: Because of their defect, they are not his children
  preserved_meaning: Their moral defect is linked to the stark denial that they are his children without implying they were formerly his children.
  reasoning_layer_used: Lexical and theological decisions for לֹא בָּנָיו and מוּמָם
  rationale: Placing the reason first makes the connection easier to follow without adding emphasis or resolving the theological tension.
- pob_phrase: They are a crooked and twisted generation
  simplified_phrase: They are a crooked and twisted generation
  preserved_meaning: The two concrete images describe distinct but related forms of moral distortion.
  reasoning_layer_used: Lexical decisions for עִקֵּשׁ and וּפְתַלְתֹּל
  rationale: The existing wording is clear and preserves both source-language images.
translation_notes:
  risk_flags:
  - risk: The first Hebrew clause allows more than one plausible grammatical reading.
    mitigation: Footnote a preserves the principal alternative and the related lexical possibilities.
  - risk: “Not his children” could be taken as a settled claim that covenant sonship was lost.
    mitigation: The text avoids “no longer” and leaves the Hebrew’s temporal and theological tension unresolved.
