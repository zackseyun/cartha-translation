translation:
  language: en
  text: The Rock—everything he does is perfect. All his ways are just. He is a faithful God; there is no wrong in him. He is righteous and upright.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his work is perfect
  simplified_phrase: everything he does is perfect
  preserved_meaning: God’s work, understood collectively as all his actions, is complete and without fault.
  reasoning_layer_used: Lexical decision for פָּעֳלוֹ
  rationale: The verbal wording makes the collective sense of “his work” immediately clear.
- pob_phrase: all his ways are justice
  simplified_phrase: All his ways are just
  preserved_meaning: Everything about God’s conduct conforms to justice.
  reasoning_layer_used: Lexical decisions for כָל־דְּרָכָיו and מִשְׁפָּט
  rationale: This keeps the biblical “ways” image while using natural English grammar.
- pob_phrase: a God of faithfulness and without injustice
  simplified_phrase: a faithful God; there is no wrong in him
  preserved_meaning: God is completely trustworthy and has no moral wrong or injustice in him.
  reasoning_layer_used: Lexical and theological decisions for אֱמוּנָה and וְאֵין עָוֶל
  rationale: The two attributes become direct, familiar statements without losing their distinct meanings.
translation_notes:
