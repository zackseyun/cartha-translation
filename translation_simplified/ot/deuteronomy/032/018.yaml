  rationale: A new sentence makes the parallel easier to read without weakening it.
- pob_phrase: the Rock who fathered you ... the God who gave you birth
  simplified_phrase: the Rock who fathered you ... the God who gave birth to you
  preserved_meaning: God remains both Israel’s Rock and the parent who brought the nation forth through paternal and maternal imagery.
