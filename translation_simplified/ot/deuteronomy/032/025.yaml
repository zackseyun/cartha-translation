translation:
  language: en
  text: Outside, the sword will leave parents childless; inside their homes, there will be terror—for young men and young unmarried women[a], nursing children and gray-haired men alike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term refers to a young unmarried woman and often implies virginity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sword will bereave
  simplified_phrase: the sword will leave parents childless
  preserved_meaning: The personified sword causes parents to lose their children.
  reasoning_layer_used: Lexical decision for תְּשַׁכֶּל
  rationale: The wording explains the uncommon verb “bereave” while retaining the sword as the agent.
- pob_phrase: in the inner rooms
  simplified_phrase: inside their homes
  preserved_meaning: Terror reaches people in private indoor spaces, in contrast with danger outside.
  reasoning_layer_used: Lexical decisions for מִחוּץ and וּמֵחֲדָרִים
  rationale: The simpler spatial contrast is immediately understandable without narrowing the outside location to a street.
- pob_phrase: both young man and virgin, nursing child together with gray-haired man
  simplified_phrase: young men and young unmarried women, nursing children and gray-haired men alike
  preserved_meaning: The judgment reaches both sexes and people from infancy through old age.
  reasoning_layer_used: Lexical decisions for בָּחוּר, בְּתוּלָה, יוֹנֵק, and אִישׁ שֵׂיבָה
  rationale: Natural list wording preserves each distinct group and the concrete images of nursing and gray hair.
