  text: When the Most High gave each nation its own land and separated the sons of man,[b] he set the borders of the peoples according to the number of the sons of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Dead Sea Scrolls and the Septuagint read “sons of God” (or “angels of God”) instead of “sons of Israel.”
