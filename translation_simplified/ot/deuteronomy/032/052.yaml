  preserved_meaning: God solemnly predicts that Moses will see the land.
  reasoning_layer_used: POB lexical decision for תִּרְאֶה
  rationale: Modern “will” communicates the stated future more naturally than “shall.”
- pob_phrase: you shall not go there, into the land
  simplified_phrase: you will not enter it
  preserved_meaning: Moses may view the land but may not cross into it.
  reasoning_layer_used: POB lexical decisions for לֹא תָבֹא and אֶל הָאָרֶץ
  rationale: “Enter it” removes repetition while preserving the denial of access.
- pob_phrase: into the land that I am giving
  simplified_phrase: it—the land I am giving
  preserved_meaning: The same land Moses sees is being given by God to Israel.
