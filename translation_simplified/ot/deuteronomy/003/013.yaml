translation:
  language: en
  text: I gave the rest of Gilead and all of Og’s kingdom of Bashan to half the tribe of Manasseh. This included the whole region of Argob—that is, all Bashan. This land was called the land of the Rephaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, traditionally, “the land of the giants.” “Rephaim” is the Hebrew name of an ancient people associated with this region.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all Bashan, the kingdom of Og
  simplified_phrase: all of Og’s kingdom of Bashan
  preserved_meaning: All the Bashan territory ruled by Og was included.
  reasoning_layer_used: Lexical decisions for כָל הַבָּשָׁן and מַמְלֶכֶת עוֹג
  rationale: The possessive form makes the political and geographic relationship immediately clear.
- pob_phrase: to the half-tribe of Manasseh
  simplified_phrase: to half the tribe of Manasseh
  preserved_meaning: The territory went to one half of Manasseh’s tribe.
  reasoning_layer_used: Lexical decision for לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  rationale: This removes a specialized tribal term without changing the allotment.
- pob_phrase: —all the region of Argob, that is, all Bashan
  simplified_phrase: This included the whole region of Argob—that is, all Bashan.
  preserved_meaning: The Argob region is identified with Bashan in the extent being described.
  reasoning_layer_used: Lexical decision for כֹּל חֶבֶל הָאַרְגֹּב and appositional reading of לְכָל הַבָּשָׁן
  rationale: A separate sentence makes the geographic explanation easier to follow.
