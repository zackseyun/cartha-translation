translation:
  language: en
  text: At that time, we took possession of this land, starting from Aroer on the Arnon Valley,[a] as well as half of Gilead’s hill country with its cities.[b] I gave this territory to the Reubenites and Gadites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Aroer by the Wadi Arnon”; the Hebrew word can mean a wadi, ravine, or valley.
    reason: lexical_alternative
  - marker: b
    text: Or “half of Mount Gilead”; here the Hebrew likely refers to Gilead’s mountainous region.
    reason: lexical_alternative
