translation:
  language: en
  text: When Yahweh has given your brothers the same rest he has given you, and they too have taken possession of the land that Yahweh your God is giving them across the Jordan,[a] then each of you may return to the land I have given you as your possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: From Moses’ location east of the Jordan, this means the land on the west side of the river.
    reason: cultural_note
simplification_decisions:
- pob_phrase: until Yahweh gives rest to your brothers as to you
  simplified_phrase: When Yahweh has given your brothers the same rest he has given you
  preserved_meaning: Their return must wait until their fellow Israelites receive the same settled security.
  reasoning_layer_used: Lexical decisions for יָנִיחַ and כָכֶם
  rationale: The recast condition is easier to follow while preserving the required sequence.
- pob_phrase: beyond the Jordan
  simplified_phrase: across the Jordan
  preserved_meaning: The land lies on the other side of the river from the speaker.
  reasoning_layer_used: Lexical decision for בְּעֵבֶר הַיַּרְדֵּן
  rationale: The common phrase is clearer, while the footnote identifies the intended side.
- pob_phrase: return to his possession that I have given you
  simplified_phrase: return to the land I have given you as your possession
  preserved_meaning: Each addressed man may return to his allotted Transjordan land.
  reasoning_layer_used: Lexical decisions for אִישׁ, לִירֻשָּׁתוֹ, and נָתַתִּי לָכֶם
  rationale: Naming the possession as land makes the allotment concrete without reducing it to ordinary property.
