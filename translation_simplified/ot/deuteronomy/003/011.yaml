translation:
  language: en
  text: Og king of Bashan was the only survivor left from the Rephaim.[a] Look at his iron bed! Is it not in Rabbah of the Ammonites? It was about thirteen and a half feet long and six feet wide.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Rephaim were an ancient people associated with great size; the name is sometimes translated “giants.”
    reason: alternative_reading
  - marker: b
    text: Hebrew says “nine cubits long and four cubits wide, by the cubit of a man,” probably meaning the ordinary cubit.
    reason: cultural_note
