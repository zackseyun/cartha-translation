translation:
  language: en
  text: Yahweh said to me, “Do not be afraid of him. I have handed him over to you, together with all his people and his land. Do to him just what you did to Sihon, king of the Amorites, who lived in Heshbon.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not fear him
  simplified_phrase: Do not be afraid of him
  preserved_meaning: Yahweh commands Moses not to fear the opposing king.
  reasoning_layer_used: POB lexical decision for אַל תִּירָא
  rationale: The common expression is clearer while retaining the command and its explicit object.
- pob_phrase: I have given him, all his people, and his land into your hand
  simplified_phrase: I have handed him over to you, together with all his people and his land
  preserved_meaning: Yahweh presents the king, his entire people, and his land as already placed under Moses’ power.
  reasoning_layer_used: POB lexical decisions for בְיָדְךָ, נָתַתִּי, and עַמּוֹ
  rationale: “Handed over” makes the transfer-of-power idiom natural without narrowing “people” to the army.
- pob_phrase: you shall do to him just as you did
  simplified_phrase: Do to him just what you did
  preserved_meaning: Moses must treat this king in the same way he treated Sihon.
  reasoning_layer_used: POB lexical decisions for וְעָשִׂיתָ לּוֹ and כַּאֲשֶׁר עָשִׂיתָ
  rationale: A direct command is easier to read and keeps the action broad rather than specifying it.
translation_notes:
  risk_flags:
  - risk: “Handed him over” may sound slightly less concrete than “into your hand.”
    mitigation: The verb “handed” preserves the source image while clearly expressing transfer of power.
