translation:
  language: en
  text: 'Jair son of Manasseh took the whole region of Argob, extending as far as the border of the Geshurites and the Maacathites. He named these places after himself: Havvoth-jair[b], in Bashan.[a] They still bear that name today.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew wording connecting Bashan with the naming is compressed and may instead be understood, “He called them after his own name: Bashan, Havvoth-jair.”'
    reason: alternative_reading
  - marker: b
    text: Havvoth-jair likely means “the villages of Jair” or “the tent-settlements of Jair.”
    reason: lexical_alternative
