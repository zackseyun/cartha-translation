translation:
  language: en
  text: Walk the whole path that Yahweh your God has commanded you to follow, so that you may live, things may go well for you, and you may live long in the land you will possess.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land you will inherit.” The Hebrew verb can mean either possess or inherit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall walk in all the way
  simplified_phrase: Walk the whole path
  preserved_meaning: Israel must follow the entire divinely prescribed path of covenant life.
  reasoning_layer_used: Lexical decisions for בְּכָל הַדֶּרֶךְ and תֵּלֵכוּ.
  rationale: The natural command preserves the Hebrew path-and-walking image.
- pob_phrase: so that you may live, and that it may go well with you, and that you may prolong your days
  simplified_phrase: so that you may live, things may go well for you, and you may live long
  preserved_meaning: Obedience is ordered toward life, well-being, and longevity in the land.
  reasoning_layer_used: Lexical decisions for לְמַעַן, וְטוֹב לָכֶם, and וְהַאֲרַכְתֶּם יָמִים.
  rationale: Natural coordination keeps the purpose-result link and distinguishes all three outcomes.
- pob_phrase: in the land that you will possess
  simplified_phrase: in the land you will possess
  preserved_meaning: Israel will receive and occupy the covenant land.
  reasoning_layer_used: Theological decision on land-possession language.
  rationale: Removing the relative pronoun improves flow without narrowing the territorial sense.
translation_notes:
  risk_flags:
  - risk: “Walk” could be mistaken for literal travel.
    mitigation: “The whole path” and “commanded you to follow” clarify the ethical metaphor.
