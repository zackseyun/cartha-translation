translation:
  language: en
  text: Yahweh spoke these words in a loud voice to your whole assembly on the mountain. He spoke from within the fire, the cloud, and the thick darkness, and he added nothing more.[a] Then he wrote the words on two stone tablets and gave them to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he did not continue speaking.” The Hebrew can mean either that he added nothing more or that he did not continue.
    reason: alternative_reading
