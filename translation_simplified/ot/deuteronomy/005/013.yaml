simplification_decisions:
- pob_phrase: Six days you shall labor
  simplified_phrase: You shall work for six days
  preserved_meaning: Ordinary work is assigned to the six days with instructional force.
  reasoning_layer_used: Lexical and theological decisions on תַּעֲבֹד
  rationale: This uses natural English word order while retaining the command-like “shall.”
- pob_phrase: and do all your work
  simplified_phrase: and do all your work
  preserved_meaning: The broad instruction covers the full range of the hearer’s work without adding a completion requirement.
  reasoning_layer_used: Lexical decisions on וְעָשִׂיתָ, כָּל, and מְלַאכְתֶּךָ
  rationale: Keeping “do” avoids narrowing the broad Hebrew verb to “finish.”
translation_notes:
  risk_flags:
  - risk: “For six days” adds an English preposition not explicit in the Hebrew.
    mitigation: The preposition naturally expresses the same six-day duration identified in the lexical reasoning.
