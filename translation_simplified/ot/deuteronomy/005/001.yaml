translation:
  language: en
  text: Moses called all Israel together and said, “Hear[a], Israel, the statutes and legal rulings[b] I am speaking to you today. Learn them, obey them, and carry them out.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “hear” means to listen attentively in a way that leads to obedience.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses two related legal terms, traditionally rendered “statutes and judgments.”
    reason: simplification_note
