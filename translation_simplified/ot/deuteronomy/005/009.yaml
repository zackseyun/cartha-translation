translation:
  language: en
  text: Do not bow down to them or serve them, because I, Yahweh your God, am a jealous God. I bring fathers’ iniquity under judgment in their children, down to the third and fourth generations among those who hate me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew judicial term can include both calling wrongdoing to account and punishing it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall not bow down to them or serve them
  simplified_phrase: Do not bow down to them or serve them
  preserved_meaning: The physical act of reverence and the distinct act of serving idols are both forbidden.
  reasoning_layer_used: POB lexical decisions for תִשְׁתַּחֲוֶה and תָעָבְדֵם
  rationale: The direct command is clearer while preserving both source actions.
- pob_phrase: visiting the iniquity of fathers on children
  simplified_phrase: I bring fathers’ iniquity under judgment in their children
  preserved_meaning: The fathers’ iniquity remains the object of Yahweh’s judicial action upon later descendants.
  reasoning_layer_used: POB lexical decision for פֹּקֵד and the grounding review
  rationale: This states the judicial sense without making the children directly answerable for their fathers’ sin.
- pob_phrase: and on the third and on the fourth generations of those who hate me
  simplified_phrase: down to the third and fourth generations among those who hate me
  preserved_meaning: The judgment reaches successive generations within the stated group who hate Yahweh.
  reasoning_layer_used: POB lexical and theological decisions on the generational idiom and לְשֹׂנְאָי
  rationale: “Among” clearly connects the final qualifier to the people within the judgment’s scope.
interpretive_expansions:
- pob_phrase: of those who hate me
  rendering: among those who hate me
  claim: The judicial statement is limited to people characterized by hatred toward Yahweh.
  evidence:
  - The POB theological decision treats the final phrase as delimiting the scope of judgment.
  - The POB lexical rationale says the phrase avoids implying automatic punishment regardless of personal stance.
  confidence: high
  alternatives_preserved:
  - The wording does not explain precisely how ancestral iniquity relates to each later generation.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake divine jealousy for insecure envy.
    mitigation: The covenant term remains because it expresses Yahweh’s exclusive claim to worship.
  - risk: The generational statement may still be taken as automatic punishment of innocent descendants.
    mitigation: “Among those who hate me” explicitly marks the group within the judgment’s scope.
