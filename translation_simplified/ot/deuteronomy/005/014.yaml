translation:
  language: en
  text: But the seventh day is a Sabbath devoted to Yahweh your God. You must not do any work on that day. Neither may your son or daughter, your male or female servant, your ox or donkey, any of your other livestock, or any resident foreigner living in your town. This is so that your male and female servants may rest just as you do.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a Sabbath to Yahweh your God
  simplified_phrase: a Sabbath devoted to Yahweh your God
  preserved_meaning: The seventh day is the sacred Sabbath dedicated to Yahweh.
  reasoning_layer_used: POB lexical decisions for שַׁבָּת and לַיהוָה
  rationale: “Devoted to” makes the dedication expressed by “to Yahweh” clear.
- pob_phrase: You shall not do any work—you, or your son, or your daughter...
  simplified_phrase: You must not do any work on that day. Neither may your son or daughter...
  preserved_meaning: The work ban applies to the whole household and everyone under its authority.
  reasoning_layer_used: POB translation and lexical decision for מְלָאכָה
  rationale: Two sentences make the command and its scope easier to follow.
- pob_phrase: the sojourner who is within your gates
  simplified_phrase: any resident foreigner living in your town
  preserved_meaning: The command includes a non-native resident of the local community.
  reasoning_layer_used: POB lexical decisions for גֵּר and בִּשְׁעָרֶיךָ
  rationale: The wording replaces unfamiliar biblical expressions with their contextual meanings.
translation_notes:
  risk_flags:
  - risk: “Devoted to” explains rather than formally reproduces the Hebrew preposition.
    mitigation: It preserves the POB rationale that the Sabbath is dedicated to Yahweh.
  - risk: “Resident foreigner” is less biblically resonant than “sojourner.”
    mitigation: It is a POB-approved alternative that clearly conveys settled non-native status.
