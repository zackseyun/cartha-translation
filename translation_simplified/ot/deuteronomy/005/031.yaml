translation:
  language: en
  text: But you, stand here with me. I will speak to you about the whole commandment,[a] the statutes, and the judgments. You must teach these things to the people so that they will obey them in the land I am giving them to possess.[b]
  philosophy: optimal-equivalence
  footnotes:
