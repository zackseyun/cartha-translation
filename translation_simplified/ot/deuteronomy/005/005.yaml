simplification_decisions:
- pob_phrase: I was standing between Yahweh and you at that time
  simplified_phrase: At that time, I was standing between Yahweh and you
  preserved_meaning: Moses occupied an ongoing mediating position between Yahweh and the people during that event.
  reasoning_layer_used: Lexical decisions for עֹמֵד and בֵּין ... וּבֵינֵיכֶם
  rationale: Moving the time phrase improves flow while “was standing” preserves the participle’s ongoing sense.
- pob_phrase: to declare to you the word of Yahweh
  simplified_phrase: to deliver Yahweh’s word to you
  preserved_meaning: Moses communicated Yahweh’s own authoritative message to the people.
  reasoning_layer_used: Lexical decisions for לְהַגִּיד and דְּבַר יְהוָה
  rationale: “Deliver” expresses Moses’ role in communicating the divine message in common English.
- pob_phrase: because you were afraid because of the fire
  simplified_phrase: because you were afraid of the fire
  preserved_meaning: The fire caused the people’s fear and helps explain Moses’ mediating role.
  reasoning_layer_used: Lexical decision for מִפְּנֵי הָאֵשׁ
  rationale: Removing the repeated “because” makes the causal idiom natural without changing its force.
