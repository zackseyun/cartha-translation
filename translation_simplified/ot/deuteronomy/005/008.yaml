translation:
  language: en
  text: You must not make for yourself a carved image[a] or any likeness of anything in the heavens above, on the earth below, or in the waters under the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an idol.” The Hebrew describes a fashioned image, often one used in idolatry.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall not make for yourself
  simplified_phrase: You must not make for yourself
  preserved_meaning: The wording remains a binding prohibition and keeps the idea of making an image for one’s own use.
  reasoning_layer_used: POB lexical decision for לֹא תַעֲשֶׂה לְךָ
  rationale: “Must not” states the command more directly in modern English.
- pob_phrase: any likeness of what is
  simplified_phrase: any likeness of anything
  preserved_meaning: The ban still covers every represented being or thing in the named realms.
  reasoning_layer_used: POB lexical decisions for כָּל תְּמוּנָה and the relative clauses
  rationale: “Anything” makes the broad scope immediately clear.
- pob_phrase: on the earth beneath
  simplified_phrase: on the earth below
  preserved_meaning: The vertical contrast between the heavens, earth, and waters remains intact.
  reasoning_layer_used: POB lexical decision for בָּאָרֶץ מִתָּחַת
  rationale: “Below” is more common modern wording than “beneath.”
