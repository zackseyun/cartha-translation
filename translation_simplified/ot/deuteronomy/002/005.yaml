translation:
  language: en
  text: Do not provoke them. I will not give you any of their land—not even enough ground to set the sole of one foot on—because I have given Mount Seir[b] to Esau as a possession.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As a possession” may also be translated “as an inheritance.”
    reason: lexical_alternative
  - marker: b
    text: “Mount Seir” may refer to the mountainous region of Seir.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Do not provoke them, for I will not give you
  simplified_phrase: Do not provoke them. I will not give you
  preserved_meaning: God forbids Israel from initiating hostility and explains why.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two sentences make the command and its divine basis easier to follow.
- pob_phrase: not even enough to set the sole of a foot on
  simplified_phrase: not even enough ground to set the sole of one foot on
  preserved_meaning: Israel will receive not even the smallest portion of Edom’s land.
  reasoning_layer_used: POB lexical decision for עַד מִדְרַךְ כַּף רָגֶל
  rationale: Adding “ground” clarifies the image while retaining the sole-of-the-foot wording.
