  language: en
  text: Get up, set out, and cross the Arnon Valley.[a] Look, I have given you control over Sihon, the Amorite king of Heshbon, and his land. Begin taking possession of his land, and go into battle against him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean the Wadi Arnon or the Arnon Brook.
    reason: lexical_alternative
