  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: “Descendants” makes the corporate meaning clearer than the literal “sons.”
- pob_phrase: did for me
  simplified_phrase: treated me
  preserved_meaning: The wording broadly refers to how Edom and Moab dealt with Moses without limiting it to one action.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Treated me” is natural English and preserves the Hebrew phrase’s documented breadth.
- pob_phrase: until I cross the Jordan
  simplified_phrase: Let me pass through your land until I cross the Jordan
  preserved_meaning: Moses requests passage through the addressed nation’s territory on his way across the Jordan.
  reasoning_layer_used: Immediate context, POB footnote, and grounding review
  rationale: Adding “your land” gives the implied request a clear object supplied by the preceding verse.
