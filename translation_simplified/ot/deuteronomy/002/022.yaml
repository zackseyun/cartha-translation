translation:
  language: en
  text: He did the same for Esau’s descendants who live in Seir. He destroyed the Horites and removed them from the land. Esau’s descendants took over their land and settled there, where their people remain to this day.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Esau
  simplified_phrase: Esau’s descendants
  preserved_meaning: The people are the family line and ethnic descendants of Esau.
  reasoning_layer_used: POB lexical alternatives and rationale
  rationale: “Descendants” makes the ancestral expression immediately clear to modern readers.
- pob_phrase: just as he did ... when he destroyed ... and they dispossessed
  simplified_phrase: He did the same.... He destroyed.... Esau’s descendants took over....
  preserved_meaning: God acted for Esau’s descendants, who then occupied the Horites’ territory.
  reasoning_layer_used: POB theological decision and clause-level syntax
  rationale: Short sentences and repeated subjects clarify who performs each action.
- pob_phrase: settled in their place to this day
  simplified_phrase: settled there, where their people remain to this day
  preserved_meaning: Esau’s people continued to occupy the Horites’ former territory.
  reasoning_layer_used: POB lexical decision and temporal expression
  rationale: The wording avoids suggesting that the original settlers themselves were still alive.
interpretive_expansions:
- pob_phrase: from before them
  rendering: removed them from the land
  claim: The Hebrew idiom refers to removing the Horites from the territory occupied by Esau’s descendants.
  evidence:
  - The POB footnote explains the idiom as removal from their presence or territory.
  - The following clauses describe taking possession and settling in the Horites’ place.
  confidence: high
  alternatives_preserved:
  - removed them from their presence
- pob_phrase: they dispossessed them
  rendering: Esau’s descendants took over their land
  claim: Dispossessing the Horites means taking possession of the land they had occupied.
  evidence:
  - The POB lexical rationale identifies conquest and possession as the sense of the verb.
  - The POB footnote says Esau’s descendants occupied the Horites’ land.
  confidence: high
  alternatives_preserved:
  - drove them out and took their land
translation_notes:
  risk_flags:
  - risk: “Descendants” does not retain the literal familial wording “sons of Esau.”
    mitigation: It preserves direct descent from Esau while preventing readers from mistaking the group for his immediate sons.
  - risk: “Their people remain” makes the collective continuity more explicit than the Hebrew wording.
    mitigation: It preserves “to this day” without implying that the original individuals were still living.
