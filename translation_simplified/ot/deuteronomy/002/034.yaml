translation:
  language: en
  text: At that time, we captured all his cities. We devoted every inhabited city to complete destruction[a], including the men, women, and little children. We left no survivors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the special term ḥerem, traditionally expressed as “put under the ban.”
    reason: lexical_alternative
