    mitigation: The immediate context identifies the descendants of Lot in Moab as the people who replaced the Emim.
  - risk: “Clear the way” states the effect of the Hebrew removal idiom more directly.
    mitigation: The wording follows the POB lexical rationale without adding a separate event.
