translation:
  language: en
  text: They were a great and numerous people, as tall as the Anakim. Yahweh destroyed them to clear the way for the Moabites. The Moabites drove them out, took their land, and settled in their place.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a people great, numerous, and tall like the Anakim
  simplified_phrase: They were a great and numerous people, as tall as the Anakim
  preserved_meaning: The people were great, large in number, and physically tall like the Anakim.
  reasoning_layer_used: POB lexical decisions for עַם, גָּדוֹל, רַב, רָם, and כָּעֲנָקִים
  rationale: The fragment becomes a natural sentence while preserving all three descriptions.
- pob_phrase: they dispossessed them
  simplified_phrase: The Moabites drove them out, took their land
  preserved_meaning: The Moabites expelled the former inhabitants and took possession of their land.
  reasoning_layer_used: POB lexical decision for וַיִּירָשֻׁם and immediate context
  rationale: The legal-sounding verb is unpacked into clear actions without losing either expulsion or possession.
- pob_phrase: lived in their place
  simplified_phrase: settled in their place
  preserved_meaning: The Moabites replaced the former inhabitants in the land.
  reasoning_layer_used: POB lexical decision for וַיֵּשְׁבוּ תַחְתָּם
  rationale: “Settled” naturally conveys lasting replacement occupancy.
interpretive_expansions:
- pob_phrase: Yahweh destroyed them from before them
  rendering: Yahweh destroyed them to clear the way for the Moabites
  claim: Yahweh removed the former inhabitants so the Moabites could occupy the land.
  evidence:
  - The POB rationale says the idiom conveys clearing the land before the succeeding people.
  - Deuteronomy 2:9–11 identifies the succeeding people as the Moabites, the descendants of Lot.
  confidence: high
  alternatives_preserved:
  - Yahweh removed them from before the Moabites
- pob_phrase: they dispossessed them
  rendering: The Moabites drove them out, took their land
  claim: Dispossession includes expelling the inhabitants and taking possession of their land.
  evidence:
  - The POB lexical rationale explicitly includes both expulsion and possession.
  confidence: high
  alternatives_preserved:
  - The Moabites dispossessed them
translation_notes:
  risk_flags:
