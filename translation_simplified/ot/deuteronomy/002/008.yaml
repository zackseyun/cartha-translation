  simplified_phrase: traveled on past our brothers
  preserved_meaning: Israel continued its journey past the people related to them through Esau.
  reasoning_layer_used: Lexical decisions for וַנַּעֲבֹר and מֵאֵת, with the theological decision on kinship language
  rationale: “Traveled on past” makes the movement clear while retaining the important word “brothers.”
- pob_phrase: away from the way of the Arabah, from Elath and from Ezion-geber
  simplified_phrase: left the Arabah road, which runs from Elath and Ezion-geber
  preserved_meaning: The named places remain connected with the Arabah route Israel left.
  reasoning_layer_used: Lexical decision for מִדֶּרֶךְ הָעֲרָבָה and the source syntax linking the place-names
  rationale: The relative clause preserves the places’ connection to the road instead of treating them as separate objects.
- pob_phrase: passed by the way of the wilderness of Moab
  simplified_phrase: traveled along the road through the wilderness of Moab
  preserved_meaning: They journeyed on a route through Moab’s wilderness.
  reasoning_layer_used: Lexical decision for וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  rationale: Ordinary travel language makes the Hebrew road idiom immediately understandable.
