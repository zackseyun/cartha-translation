translation:
  language: en
  text: So we traveled on past our brothers, the sons of Esau,[a] who live in Seir. We left the Arabah road, which runs from Elath and Ezion-geber.[b] Then we turned and traveled along the road through the wilderness of Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls the descendants of Esau “our brothers,” emphasizing their kinship with Israel.
    reason: simplification_note
  - marker: b
    text: The Arabah is the rift-valley region south of the Dead Sea.
    reason: cultural_note
