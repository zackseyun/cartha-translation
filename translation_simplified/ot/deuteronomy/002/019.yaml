translation:
  language: en
  text: When you come near Ammon’s descendants,[a] do not harass them or provoke them to war. I will not give you any part of their land to possess, because I have given that land to Lot’s descendants as their possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the sons of Ammon”; later in the verse, “the sons of Lot.”
    reason: source_note
simplification_decisions:
- pob_phrase: come opposite the sons of Ammon
  simplified_phrase: come near Ammon’s descendants
  preserved_meaning: Israel approaches Ammon’s people without implying entry into their land.
  reasoning_layer_used: Lexical decisions for מוּל and בְּנֵי עַמּוֹן
  rationale: “Come near” is natural English, while “descendants” keeps the family relationship explicit.
- pob_phrase: do not harass them or provoke them
  simplified_phrase: do not harass them or provoke them to war
  preserved_meaning: Israel must neither pressure Ammon’s people nor initiate hostile conflict with them.
  reasoning_layer_used: Lexical decision for וְאַל תִּתְגָּר בָּם and immediate military context
  rationale: “To war” prevents “provoke” from sounding like ordinary irritation and preserves the audited hostile sense.
- pob_phrase: any of the land of the sons of Ammon as a possession
  simplified_phrase: any part of their land to possess
  preserved_meaning: God will give Israel no portion of Ammonite territory as a settled holding.
  reasoning_layer_used: Lexical decisions for מִן and יְרֻשָּׁה
  rationale: The shorter wording preserves both the no-portion force and possession of the land.
interpretive_expansions:
- pob_phrase: the sons of Ammon / the sons of Lot
  rendering: Ammon’s descendants / Lot’s descendants
  claim: The kinship expressions identify the peoples descended from Ammon and Lot.
  evidence:
  - The POB theological rationale says these expressions emphasize familial descent.
  - The POB lists “the descendants of Lot” as a viable explanatory rendering.
  confidence: high
  alternatives_preserved:
  - The literal phrases “sons of Ammon” and “sons of Lot” remain in the footnote.
- pob_phrase: provoke them
  rendering: provoke them to war
  claim: The prohibited provocation is the initiation of hostile conflict.
  evidence:
  - The POB lexical audit identifies the sense as stirring up strife or engaging in hostilities.
  - The land-taking context is military rather than interpersonal.
  confidence: high
  alternatives_preserved:
  - engage them in hostilities
  - stir up conflict with them
translation_notes:
  risk_flags:
  - risk: “Descendants” explains rather than reproduces the concrete Hebrew image “sons.”
    mitigation: The footnote preserves the literal kinship wording.
  - risk: “Come near” is less spatially exact than “come opposite.”
    mitigation: It is a POB lexical alternative and does not imply entry into the territory.
