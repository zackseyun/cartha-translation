translation:
  language: en
  text: Today I will begin to make peoples throughout the world dread and fear you.[a] They will hear the report about you,[b] and because of you they will tremble and writhe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “put the dread and fear of you on the face of the peoples under all the heavens.”
    reason: simplification_note
  - marker: b
    text: Or “hear news of you” or “hear of your fame.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew describes intense anguish, like the writhing of a woman in labor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: put the dread and fear of you on the face of the peoples
  simplified_phrase: make peoples ... dread and fear you
  preserved_meaning: God will cause other peoples to feel both dread and fear because of Israel.
  reasoning_layer_used: POB lexical decisions for פַּחְדְּךָ, וְיִרְאָתְךָ, and עַל פְּנֵי הָעַמִּים
  rationale: The active wording is easier to understand, while a footnote preserves the Hebrew face image.
- pob_phrase: under all the heavens
  simplified_phrase: throughout the world
  preserved_meaning: The fear will spread among peoples everywhere under heaven.
  reasoning_layer_used: POB lexical rationale for תַּחַת כָּל הַשָּׁמָיִם
  rationale: The common English phrase states the idiom’s worldwide scope directly.
- pob_phrase: who will hear the report about you and will tremble and writhe because of you
  simplified_phrase: They will hear the report about you, and because of you they will tremble and writhe.
  preserved_meaning: What peoples hear about Israel will lead them to shake and suffer intense bodily distress.
  reasoning_layer_used: POB lexical decisions for שִׁמְעֲךָ, וְרָגְזוּ, וְחָלוּ, and מִפָּנֶיךָ
  rationale: A new sentence and ordinary clause order make the sequence clear without weakening the bodily image.
translation_notes:
  risk_flags:
