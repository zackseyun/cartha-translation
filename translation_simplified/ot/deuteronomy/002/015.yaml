simplification_decisions:
- pob_phrase: Moreover, the hand of Yahweh was against them
  simplified_phrase: Yahweh’s hand was also against them
  preserved_meaning: Yahweh actively used his power against them in judgment.
  reasoning_layer_used: Lexical and theological decisions for וְגַם, יַד יְהוָה, and בָם
  rationale: This keeps the hand image and divine name while using a natural connection.
- pob_phrase: to throw them into confusion from the midst of the camp
  simplified_phrase: throwing them into confusion from among the camp
  preserved_meaning: Yahweh caused panic or disarray among those within the camp.
  reasoning_layer_used: Lexical decisions for לְהֻמָּם and מִקֶּרֶב הַמַּחֲנֶה, constrained by the grounding review
  rationale: This avoids inventing a separate act of removal while retaining the camp phrase.
- pob_phrase: until they were finished off
  simplified_phrase: until they had all perished
  preserved_meaning: The judged group eventually came to a complete end through death.
  reasoning_layer_used: Lexical decision for עַד תֻּמָּם and the immediate context of Deuteronomy 2:14–16
  rationale: “Perished” plainly expresses the contextual outcome without the casual tone of “finished off.”
interpretive_expansions:
- pob_phrase: until they were finished off
  rendering: until they had all perished
  claim: The group’s complete end refers in context to their death.
  evidence:
  - Deuteronomy 2:14–16 says the fighting men died until that generation was gone.
  - The POB lists “until they perished” as a lexical alternative.
  confidence: high
  alternatives_preserved:
  - until they had all come to an end
translation_notes:
