translation:
  language: en
  text: Yahweh’s hand was also against them, throwing them into confusion from among the camp until they had all perished.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be understood as “until they had all come to an end.”
