translation:
  language: en
  text: Do not favor anyone when deciding a case. Give the same hearing to people of low and high standing. Do not let any man intimidate you, because judgment belongs to God. If a case is too difficult for you, bring it to me, and I will hear it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: show partiality in judgment
  simplified_phrase: favor anyone when deciding a case
  preserved_meaning: Judges must not show favoritism in judicial decisions.
  reasoning_layer_used: POB lexical decisions for תַכִּירוּ פָנִים and בַּמִּשְׁפָּט
  rationale: The wording turns an abstract legal phrase into a direct command about deciding cases.
- pob_phrase: hear the small and the great alike
  simplified_phrase: Give the same hearing to people of low and high standing
  preserved_meaning: People of lower and higher social status must receive equal treatment in court.
  reasoning_layer_used: POB lexical decisions for כַּקָּטֹן כַּגָּדֹל and תִּשְׁמָעוּן
  rationale: The rewrite makes both the courtroom sense of “hear” and the social contrast immediately clear.
- pob_phrase: the matter that is too difficult for you
  simplified_phrase: a case is too difficult for you
  preserved_meaning: Judges must refer cases they cannot resolve to Moses.
  reasoning_layer_used: POB lexical decisions for הַדָּבָר and אֲשֶׁר יִקְשֶׁה מִכֶּם
  rationale: “Case” identifies the legal setting more plainly than the broad word “matter.”
