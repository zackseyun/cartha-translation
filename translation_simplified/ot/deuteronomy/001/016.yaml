translation:
  language: en
  text: 'At that time I commanded your judges: “Listen carefully when your brothers[a] have disputes. Give a righteous judgment[b] in every case, whether it is between a man and his brother or between a man and a resident foreigner who lives in his community.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” is covenant-community language for fellow Israelites.
    reason: simplification_note
  - marker: b
    text: Or “Give a just judgment.” The Hebrew word includes both righteousness and justice here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear the cases between your brothers
  simplified_phrase: Listen carefully when your brothers have disputes
  preserved_meaning: The judges must give attentive legal hearings to disputes within Israel.
  reasoning_layer_used: POB lexical rationale and listed alternative for שָׁמֹעַ בֵּין אֲחֵיכֶם
  rationale: This recasts the legal command in clear modern English without prescribing a specific hearing procedure.
- pob_phrase: judge righteously
  simplified_phrase: Give a righteous judgment in every case
  preserved_meaning: Every judicial decision must reflect both moral righteousness and justice.
  reasoning_layer_used: POB lexical and theological decisions for צֶדֶק
  rationale: The noun phrase is easier to follow while retaining the POB’s chosen righteousness language.
- pob_phrase: the resident foreigner with him
  simplified_phrase: a resident foreigner who lives in his community
  preserved_meaning: The foreigner is a settled non-Israelite associated with the man’s community and under its law.
  reasoning_layer_used: POB lexical rationale for גֵּרוֹ
  rationale: The wording preserves the singular association without suggesting that the foreigner shares the man’s home.
interpretive_expansions:
- pob_phrase: Hear the cases between your brothers
  rendering: Listen carefully when your brothers[a] have disputes
  claim: The command requires attentive judicial hearing, and “brothers” refers to fellow Israelites.
  evidence:
  - The POB rationale defines שׁמע here as attentive legal hearing.
  - The POB theological decision identifies the brothers as the Israelite covenant community.
  confidence: high
  alternatives_preserved:
  - Hear the cases between your brothers
  - Hear disputes among your brothers
- pob_phrase: the resident foreigner with him
  rendering: a resident foreigner who lives in his community
  claim: This is a settled non-native resident connected with the man’s community rather than a temporary visitor.
  evidence:
  - The POB lexical rationale defines גֵּר as a non-native resident living among Israel.
  - The singular suffix supports retaining an association with the man.
  confidence: high
  alternatives_preserved:
  - the resident foreigner with him
  - the foreigner residing with him
translation_notes:
  risk_flags:
  - risk: “Brothers” may sound limited to biological male siblings.
    mitigation: Footnote [a] explains its representative covenant-community sense.
  - risk: “His community” interprets the Hebrew “with him” as communal association rather than physical proximity.
    mitigation: This follows the POB rationale while preserving the source’s singular connection.
