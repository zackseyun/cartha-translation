simplification_decisions:
- pob_phrase: So I spoke to you
  simplified_phrase: So I told you this
  preserved_meaning: Moses communicated the message described in the preceding context.
  reasoning_layer_used: Lexical decision for וָאֲדַבֵּר and narrative context
  rationale: “Told you this” makes the connection to Moses’ preceding words clear without changing his action.
- pob_phrase: you rebelled against the mouth of Yahweh
  simplified_phrase: You rebelled against Yahweh’s command
  preserved_meaning: The people defied what Yahweh had commanded them.
  reasoning_layer_used: Lexical decision for אֶת פִּי יְהוָה and theological decision for the divine name
  rationale: “Command” explains the Hebrew idiom while retaining Yahweh’s personal name.
- pob_phrase: acted presumptuously
  simplified_phrase: acted arrogantly
  preserved_meaning: The people acted with proud and insolent disregard for Yahweh’s warning.
  reasoning_layer_used: Lexical decision for וַתָּזִדוּ
  rationale: “Arrogantly” is more familiar English and preserves the verb’s moral force.
