translation:
  language: en
  text: 'In the land of Moab, beyond the Jordan,[a] Moses began explaining this law.[b] He said:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated “across the Jordan” or “on the other side of the Jordan.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “instruction,” but “law” fits the covenant setting here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Beyond the Jordan, in the land of Moab
