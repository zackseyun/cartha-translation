  preserved_meaning: Moses was in Moab, in the region across the Jordan from the stated viewpoint.
  reasoning_layer_used: POB lexical decisions and geographic footnote
  rationale: Putting the familiar place name first makes the location easier to follow without resolving the relative viewpoint.
- pob_phrase: began to explain
  simplified_phrase: began explaining
  preserved_meaning: Moses commenced making the law clear.
  reasoning_layer_used: POB lexical decision for הוֹאִיל and בֵּאֵר
  rationale: The natural English construction keeps both the beginning and the explaining of the action.
- pob_phrase: 'saying:'
  simplified_phrase: 'He said:'
  preserved_meaning: The verse introduces the speech that follows.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: A short independent sentence is clearer than the formal speech-introduction participle.
