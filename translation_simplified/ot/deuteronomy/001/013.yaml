simplification_decisions:
- pob_phrase: wise, discerning
  simplified_phrase: wise, have good judgment
  preserved_meaning: The men must have both wisdom and perceptive judgment.
  reasoning_layer_used: POB lexical decisions for חֲכָמִים and וּנְבֹנִים
  rationale: “Have good judgment” makes the leadership quality clearer than “discerning.”
- pob_phrase: well-known men from your tribes
  simplified_phrase: men from your tribes who are known in their tribes
  preserved_meaning: The candidates must be recognized within their tribal communities.
  reasoning_layer_used: POB lexical decisions for וִידֻעִים and לְשִׁבְטֵיכֶם
  rationale: The wording identifies the tribes, rather than Israel generally, as the setting of their reputation.
- pob_phrase: appoint them as your heads
  simplified_phrase: appoint them as your leaders
  preserved_meaning: Moses will formally install the selected men in authority over the people.
  reasoning_layer_used: POB lexical decisions for וַאֲשִׂימֵם and בְּרָאשֵׁיכֶם
  rationale: “Leaders” states the metaphor’s meaning while the footnote preserves its image.
