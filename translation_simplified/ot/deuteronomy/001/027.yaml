translation:
  language: en
  text: You grumbled in your tents. You said, “Yahweh hates us. That is why he brought us out of the land of Egypt—to hand us over to the Amorites and destroy us.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you grumbled in your tents and said
  simplified_phrase: You grumbled in your tents. You said
  preserved_meaning: The people complained privately in their wilderness tents and voiced their accusation.
  reasoning_layer_used: POB lexical decisions for וַתֵּרָגְנוּ and בְאָהֳלֵיכֶם
  rationale: Two short sentences make the opening easier to follow while preserving the concrete setting and negative tone.
- pob_phrase: Because Yahweh hates us
  simplified_phrase: Yahweh hates us. That is why
  preserved_meaning: The Israelites accused Yahweh of acting from hatred toward them.
  reasoning_layer_used: POB lexical and theological decisions for בְּשִׂנְאַת יְהוָה and יְהוָה
  rationale: The causal accusation is recast in direct, natural speech while retaining the divine name Yahweh.
- pob_phrase: to give us into the hand of the Amorites
  simplified_phrase: to hand us over to the Amorites
  preserved_meaning: They claimed Yahweh intended to place them under the Amorites’ power.
  reasoning_layer_used: POB lexical decision and footnote b for לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  rationale: The documented idiomatic alternative communicates surrender into enemy power more clearly.
translation_notes:
  risk_flags:
  - risk: Breaking “Because Yahweh hates us” into two sentences may sound more emphatic than the POB syntax.
    mitigation: “That is why” immediately preserves the original causal link and marks the words as the people’s accusation.
