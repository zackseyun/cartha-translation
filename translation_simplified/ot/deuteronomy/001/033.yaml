translation:
  language: en
  text: The LORD your God went ahead of you on your journey to find a place for you to camp. He went in the fire at night to show you which way to go, and in the cloud by day.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who went before you on the way
  simplified_phrase: The LORD your God went ahead of you on your journey
  preserved_meaning: The LORD traveled in front of the people as their guide through the wilderness.
  reasoning_layer_used: The preceding context, theological decision, and lexical decisions for לִפְנֵיכֶם and בַּדֶּרֶךְ
  rationale: Naming the contextually certain subject removes the fragment, while “ahead” and “journey” clarify his guiding role.
- pob_phrase: to search out a place for you to camp
  simplified_phrase: to find a place for you to camp
  preserved_meaning: The LORD sought a suitable campsite for the people.
  reasoning_layer_used: Lexical decisions for לָתוּר, מָקוֹם, and לַחֲנֹתְכֶם
  rationale: “Find” naturally states the purpose of the search without the dated phrase “search out.”
- pob_phrase: in fire by night to show you the way in which you should go, and in the cloud by day
  simplified_phrase: He went in the fire at night to show you which way to go, and in the cloud by day
  preserved_meaning: The LORD used the fire at night and the cloud by day to direct the people's route.
  reasoning_layer_used: Lexical decisions for בָּאֵשׁ לַיְלָה, לַרְאֹתְכֶם, the route clause, and וּבֶעָנָן יוֹמָם
  rationale: A new sentence and “which way to go” make the guidance clear while preserving both wilderness images.
interpretive_expansions:
