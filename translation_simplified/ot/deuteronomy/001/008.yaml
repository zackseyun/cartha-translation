translation:
  language: en
  text: Look! I have placed the land before you. Go in and take possession of it. This is the land Yahweh swore to give to your fathers—Abraham, Isaac, and Jacob—and to their offspring after them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: See, I have set the land before you.
  simplified_phrase: Look! I have placed the land before you.
  preserved_meaning: God emphatically directs their attention to the land now set before them.
  reasoning_layer_used: POB lexical decisions for רְאֵה and נָתַתִּי לִפְנֵיכֶם
  rationale: “Look!” is an approved modern alternative, and “placed” keeps the source image clear.
- pob_phrase: Go in and take possession of the land
  simplified_phrase: Go in and take possession of it.
  preserved_meaning: The people are commanded to enter the land and actively claim it.
  reasoning_layer_used: POB lexical decisions for בֹּאוּ and וּרְשׁוּ
  rationale: Using “it” avoids needless repetition without weakening either command.
- pob_phrase: the land that Yahweh swore to your fathers—to Abraham, to Isaac, and to Jacob—to give to them and to their offspring after them
  simplified_phrase: This is the land Yahweh swore to give to your fathers—Abraham, Isaac, and Jacob—and to their offspring after them.
  preserved_meaning: Yahweh’s sworn promise includes the named fathers and their later offspring.
  reasoning_layer_used: POB theological decisions and lexical rationale for לַאֲבֹתֵיכֶם and זַרְעָם
  rationale: A new sentence untangles the oath clause while retaining Yahweh, the named fathers, and their offspring.
translation_notes:
  risk_flags:
  - risk: Splitting the relative clause could make the promised land seem like a new topic.
    mitigation: “This is the land” explicitly reconnects the oath to the land already mentioned.
