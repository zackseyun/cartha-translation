translation:
  language: en
  text: These are the words Moses spoke to all Israel across the Jordan[a], in the wilderness. He spoke them in the Arabah[b], opposite Suph[c], between Paran, Tophel, Laban, Hazeroth, and Dizahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “beyond the Jordan” or “on the other side of the Jordan,” depending on the geographic viewpoint.
    reason: lexical_alternative
  - marker: b
    text: The Arabah is the rift valley or plain in this region.
    reason: cultural_note
  - marker: c
    text: Suph may be a place-name; some connect it with the Reed Sea, but the Hebrew text does not include the word “sea.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: These are the words that Moses spoke
  simplified_phrase: These are the words Moses spoke
  preserved_meaning: The verse introduces Moses’ spoken message.
  reasoning_layer_used: POB lexical decision for אֵלֶּה הַדְּבָרִים and אֲשֶׁר דִּבֶּר
  rationale: Removing the optional relative pronoun makes the opening more direct without changing its formal sense.
- pob_phrase: beyond the Jordan
  simplified_phrase: across the Jordan
  preserved_meaning: Moses spoke from the region on the other side of the Jordan.
  reasoning_layer_used: POB lexical alternatives and footnote a
  rationale: “Across” is common English, while the footnote preserves the viewpoint ambiguity.
- pob_phrase: in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth, and Dizahab
  simplified_phrase: in the wilderness. He spoke them in the Arabah, opposite Suph, between Paran, Tophel, Laban, Hazeroth, and Dizahab
  preserved_meaning: All named locations identify the setting of Moses’ speech.
  reasoning_layer_used: POB lexical decisions for the geographic terms and latest POB text
  rationale: Dividing the long location chain into two sentences improves readability while retaining every place-name.
