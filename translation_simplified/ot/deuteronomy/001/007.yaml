translation:
  language: en
  text: 'Turn and set out. Go to the hill country of the Amorites and all the surrounding regions: the Arabah, the hill country, the lowlands,[a] the Negev, and the seacoast. Go to the land of the Canaanites and Lebanon, as far as the great river, the Euphrates.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Shephelah,” the name of the western lowland and foothill region.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Turn and set out for yourselves, and go
  simplified_phrase: Turn and set out. Go
  preserved_meaning: Israel is commanded to change direction, depart, and travel onward.
  reasoning_layer_used: Lexical decisions for פְּנוּ, וּסְעוּ לָכֶם, and וּבֹאוּ
  rationale: The idiomatic “for yourselves” is omitted because it adds no reflexive emphasis here.
- pob_phrase: to all their neighbors
  simplified_phrase: all the surrounding regions
  preserved_meaning: The command includes the territories adjacent to the Amorite hill country.
  reasoning_layer_used: Lexical decision for שְׁכֵנָיו
  rationale: This wording avoids unclear personification while retaining the geographic relationship.
- pob_phrase: on the coast of the sea
  simplified_phrase: the seacoast
  preserved_meaning: The destination includes the coastal region.
  reasoning_layer_used: Lexical decision for וּבְחוֹף הַיָּם
  rationale: “Seacoast” expresses the same geographic image in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: “Surrounding regions” favors a territorial reading over neighboring peoples.
    mitigation: The POB rationale explicitly allows adjacent peoples or regions in this geographic list.
