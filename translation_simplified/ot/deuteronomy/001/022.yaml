translation:
  language: en
  text: Then all of you came to me and said, “Let us send men ahead of us to explore the land for us and report back to us about the route we should follow as we go up into the land,[a] and about the cities we will enter.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
