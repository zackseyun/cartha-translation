translation:
  language: en
  text: Look! Yahweh your God has placed the land before you. Go up and take possession of it, just as Yahweh, the God of your fathers,[a] told you. Do not be afraid or lose courage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God of your ancestors.” The Hebrew says “your fathers,” a covenant expression preserved in the text.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: See
  simplified_phrase: Look!
  preserved_meaning: Moses directly calls Israel's attention to what Yahweh has done.
  reasoning_layer_used: Lexical decision for רְאֵה as an attention-getting imperative.
  rationale: “Look!” makes the attention-getting force immediately clear.
- pob_phrase: has set the land before you
  simplified_phrase: has placed the land before you
  preserved_meaning: Yahweh has made the land available for Israel to enter.
  reasoning_layer_used: Lexical decision for נָתַן ... לְפָנֶיךָ.
  rationale: “Placed” is more familiar while retaining the image of the land set before Israel.
- pob_phrase: Do not fear or be dismayed
  simplified_phrase: Do not be afraid or lose courage
  preserved_meaning: Israel must neither fear nor become inwardly broken or discouraged.
  reasoning_layer_used: Lexical decisions for אַל תִּירָא and וְאַל תֵּחָת.
  rationale: The wording uses common English while keeping the two distinct commands.
translation_notes:
  risk_flags:
  - risk: “Lose courage” expresses the effect of being dismayed more directly than the POB wording.
    mitigation: It preserves the distinct force of becoming discouraged without merging it with fear.
