translation:
  language: en
  text: And if you carefully listen to my commandments that I am commanding you today[a]—to love Yahweh your God and to serve him with all your heart and with all your soul[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression emphasizes listening carefully and responding obediently.
    reason: lexical_alternative
  - marker: b
    text: “Soul” can also mean your whole life or your whole being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you indeed listen to my commandments
  simplified_phrase: you carefully listen to my commandments
  preserved_meaning: Listening remains emphatic and includes an obedient response without replacing the Hebrew image with “obey.”
  reasoning_layer_used: Lexical and theological decisions for שָׁמֹעַ תִּשְׁמְעוּ
  rationale: “Carefully listen” expresses the emphasis in clear modern English, while the footnote preserves the obedient nuance.
- pob_phrase: that I am commanding you today
  simplified_phrase: that I am commanding you today
  preserved_meaning: The speaker’s authority, ownership of the commandments, and present act of commanding Israel remain explicit.
  reasoning_layer_used: Lexical decisions for אֶל מִצְוֺתַי and אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  rationale: Retaining the wording avoids weakening the covenant command or dropping “my.”
- pob_phrase: to love Yahweh your God and to serve him
  simplified_phrase: to love Yahweh your God and to serve him
  preserved_meaning: Love and devoted service remain distinct purposes of the commanded response.
  reasoning_layer_used: Lexical decisions for לְאַהֲבָה and וּלְעָבְדוֹ
  rationale: The infinitives preserve the audited purpose-and-result relationship more clearly than participles.
translation_notes:
  risk_flags:
  - risk: The verse ends before the conditional sentence is completed in verse 14.
    mitigation: The final dash preserves the open sentence and signals that the result follows.
  - risk: Modern readers may understand “listen” as hearing without obeying.
    mitigation: “Carefully” and footnote a preserve the contextually obedient force.
