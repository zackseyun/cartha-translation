translation:
  language: en
  text: For the land you are entering to possess is not like Egypt, the land you came out of. In Egypt, you sowed your seed[a] and watered it with your foot,[b] as you would water a vegetable garden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “you would sow your seed,” describing the usual way farming was done in Egypt.
    reason: lexical_alternative
  - marker: b
    text: “With your foot” probably refers either to operating irrigation equipment by foot or to using a foot to guide water through channels.
    reason: cultural_note
