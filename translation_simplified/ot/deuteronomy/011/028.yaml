  text: The curse will come if you do not listen to the commandments of Yahweh your God and turn away from the way I command you to follow today, to go after other gods you have not known.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Listen to” can also mean “obey” here; it describes hearing that leads to obedience.
    reason: lexical_alternative
