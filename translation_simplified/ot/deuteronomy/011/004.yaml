  preserved_meaning: God caused the sea’s waters to overwhelm the pursuing army.
  reasoning_layer_used: Lexical decision for הֵצִיף
  rationale: Natural English retains both divine causation and the flooding image.
- pob_phrase: Yahweh destroyed them to this day
