translation:
  language: en
  text: Therefore,[a] love Yahweh your God. Throughout your life, do what he requires and obey his statutes, his judgments,[b] and his commandments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And.” The Hebrew connection may simply continue the thought rather than state a conclusion.
    reason: alternative_reading
  - marker: b
    text: Or “ordinances.”
    reason: lexical_alternative
