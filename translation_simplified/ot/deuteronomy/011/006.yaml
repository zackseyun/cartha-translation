translation:
  language: en
  text: and what he did to Dathan and Abiram, the sons of Eliab, who was Reuben’s son. In the midst of all Israel, the earth opened its mouth and swallowed them, along with their households,[a] their tents, and every living thing that belonged to or accompanied them.[b]
  philosophy: optimal-equivalence
  footnotes:
