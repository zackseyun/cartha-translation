translation:
  language: en
  text: Yahweh your God will bring you into the land you are about to enter and take possession of. When he does, you must assign the blessing to Mount Gerizim and the curse to Mount Ebal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “set/give.” This may mean pronouncing the blessing and curse there; the surrounding passage explains the ceremony.
