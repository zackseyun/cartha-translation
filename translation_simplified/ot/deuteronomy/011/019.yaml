translation:
  language: en
  text: Teach them to your children[a] by talking about them when you sit at home, when you walk along the road, when you lie down, and when you get up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your sons.” The Hebrew term can refer to one’s children generally.
    reason: lexical_alternative
