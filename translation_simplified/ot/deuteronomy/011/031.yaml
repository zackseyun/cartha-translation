  preserved_meaning: Crossing the Jordan leads to entering the land in order to take possession of it.
  reasoning_layer_used: POB lexical decisions for לָבֹא and לָרֶשֶׁת
  rationale: “Enter” states the movement naturally while retaining the distinct act of taking possession.
- pob_phrase: and you will take possession of it and live in it
  simplified_phrase: You will take possession of it and live there.
  preserved_meaning: Israel will possess the land and make its home there.
  reasoning_layer_used: POB lexical decisions for וִירִשְׁתֶּם אֹתָהּ and וִישַׁבְתֶּם בָּהּ
