simplification_decisions:
- pob_phrase: Be careful lest your heart be deceived
  simplified_phrase: Be careful, or your heart may be deceived.
  preserved_meaning: The wording keeps the solemn warning that inner deception could follow if Israel does not remain watchful.
  reasoning_layer_used: Lexical decision for פֶּן and the theological reading of the warning
  rationale: Replacing “lest” with an ordinary warning construction makes the danger immediately clear.
- pob_phrase: and you turn aside and serve other gods and bow down to them
  simplified_phrase: Then you may turn away, serve other gods, and bow down to them.
  preserved_meaning: The sequence still moves from deception to departure, religious service, and the concrete act of bowing.
  reasoning_layer_used: Lexical decisions for סור, עבד, and השתחוה, together with the theological progression
  rationale: A new sentence clarifies the progression while keeping each distinct act.
translation_notes:
  risk_flags:
  - risk: “Then” may sound more mechanically sequential than the Hebrew conjunctions.
    mitigation: The preceding “may” keeps the statement as a warning rather than an inevitable outcome.
