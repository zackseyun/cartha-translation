  preserved_meaning: The chosen place remains associated with both Yahweh’s name and the dwelling motif.
  reasoning_layer_used: Lexical and theological decisions preserving the compact name-and-dwelling language
  rationale: The wording keeps the documented ambiguity rather than making Yahweh the certain subject of “dwell.”
- pob_phrase: and there you shall go
