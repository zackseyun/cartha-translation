  preserved_meaning: Yahweh chooses the future worship site within Israel’s tribal lands, and Israel must seek it out.
  reasoning_layer_used: Lexical decisions for כִּי אִם, יִבְחַר, מִכָּל שִׁבְטֵיכֶם, and תִדְרְשׁוּ
