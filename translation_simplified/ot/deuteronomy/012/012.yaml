translation:
  language: en
  text: Rejoice in the presence of Yahweh your God. This includes you, your sons and daughters, your male and female slaves, and the Levite who lives in your community.[a] Include him because he has no land allotment or inheritance among you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “who is within your gates,” meaning within your town or community.
    reason: lexical_alternative
