  reasoning_layer_used: Lexical decisions for וּשְׂמַחְתֶּם and לִפְנֵי יְהוָה
  rationale: The direct command and clear idiom are easier for modern readers.
- pob_phrase: you and your sons and your daughters, and your male slaves and your female slaves
