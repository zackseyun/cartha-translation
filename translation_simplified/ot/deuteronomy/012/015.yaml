translation:
  language: en
  text: But whenever you want to eat meat, you may slaughter an animal and eat it in any of your towns, according to the blessing Yahweh your God has given you. Both those who are ceremonially unclean and those who are clean may eat it, just as they may eat gazelle or deer.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: whenever your soul desires
  simplified_phrase: whenever you want to eat meat
  preserved_meaning: The permission applies whenever someone desires meat.
  reasoning_layer_used: POB lexical decision for בְּכָל אַוַּת נַפְשְׁךָ
  rationale: The Hebrew idiom is expressed naturally while its object is supplied from the immediate context.
- pob_phrase: you may slaughter and eat meat
  simplified_phrase: you may slaughter an animal and eat it
  preserved_meaning: The verse permits butchering an animal for food and eating its meat.
  reasoning_layer_used: POB lexical decisions for תִּזְבַּח and וְאָכַלְתָּ בָשָׂר
  rationale: Naming the animal makes the act of slaughter immediately clear.
- pob_phrase: within all your gates
  simplified_phrase: in any of your towns
  preserved_meaning: Animals may be slaughtered and eaten in the people's local settlements.
  reasoning_layer_used: POB lexical decision and cultural footnote for בְּכָל שְׁעָרֶיךָ
  rationale: The Hebrew civic idiom is translated directly into its intended meaning.
interpretive_expansions:
