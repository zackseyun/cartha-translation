  simplified_phrase: you must eat it in the presence of Yahweh your God
  preserved_meaning: The sacred portion must be eaten as an act of worship in Yahweh's presence.
  reasoning_layer_used: lexical decisions for תֹּאכְלֶנּוּ and לִפְנֵי
  rationale: “Must” gives the instruction clear force, while “in the presence of” explains “before.”
- pob_phrase: the Levite who is within your gates
