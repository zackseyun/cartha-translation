translation:
  language: en
  text: Instead, you must eat it in the presence of Yahweh your God, at the place Yahweh your God will choose. Eat it there with your son and daughter, your male and female servants, and the Levite who lives in your community. Rejoice before Yahweh your God in everything you undertake.
