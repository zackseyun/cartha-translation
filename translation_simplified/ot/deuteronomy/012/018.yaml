  preserved_meaning: The instruction includes the Levite belonging to the worshiper's local area.
  reasoning_layer_used: lexical rationale and cultural note for בִּשְׁעָרֶיךָ
  rationale: The civic idiom is expressed directly for readers unfamiliar with ancient city gates.
- pob_phrase: in all to which you put your hand
