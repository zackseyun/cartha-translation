translation:
  language: en
  text: If the place where Yahweh your God chooses to put his name is too far away, you may slaughter animals from the herds and flocks Yahweh has given you, as I have commanded you. You may eat them in your own towns to your heart’s desire.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the place that Yahweh your God chooses to put his name there
  simplified_phrase: the place where Yahweh your God chooses to put his name
  preserved_meaning: Yahweh chooses the central place associated with his name.
  reasoning_layer_used: POB lexical decision for לָשׂוּם שְׁמוֹ שָׁם
  rationale: Using “where” removes awkward repetition while keeping the sanctuary formula.
- pob_phrase: within your gates
  simplified_phrase: in your own towns
  preserved_meaning: The animals may be eaten locally rather than only at the central sanctuary.
  reasoning_layer_used: POB lexical alternative for בִּשְׁעָרֶיךָ
  rationale: “Towns” states the Hebrew metonym in ordinary English.
- pob_phrase: according to all the desire of your soul
  simplified_phrase: to your heart’s desire
  preserved_meaning: They may eat according to their personal appetite or desire.
  reasoning_layer_used: POB lexical alternatives for בְּכֹל אַוַּת נַפְשֶׁךָ
  rationale: The familiar idiom preserves the inner-person image without the unnatural phrase “desire of your soul.”
