translation:
  language: en
  text: 'He said this about Asher:


    “Asher is the most blessed of the sons.[a]

    May his brothers look on him with favor,[b]

    and may he dip his foot in oil.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Asher is blessed above the sons”; the Hebrew can express either a comparison or a superlative.
    reason: lexical_alternative
  - marker: b
    text: “His brothers” likely means the other tribes of Israel.
    reason: cultural_note
  - marker: c
    text: Dipping his foot in oil likely pictures abundance or prosperity, but the precise meaning is uncertain.
    reason: lexical_alternative
