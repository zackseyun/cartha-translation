translation:
  language: en
  text: The God of old is a safe home for you,[a] and his everlasting arms are beneath you. He drove the enemy out ahead of you and commanded, “Destroy!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The eternal God is your refuge.” The main text more directly preserves the Hebrew description, “The God of old.”
