simplification_decisions:
- pob_phrase: is a dwelling place
  simplified_phrase: is a safe home for you
  preserved_meaning: God is pictured as the sheltering place where his people may live securely.
  reasoning_layer_used: POB lexical decision for מְעֹנָה and its contextual sheltering sense
  rationale: “Safe home” keeps the dwelling image while making its protective force clear.
- pob_phrase: underneath are everlasting arms
  simplified_phrase: his everlasting arms are beneath you
  preserved_meaning: God's enduring strength supports his people from below.
  reasoning_layer_used: POB lexical decisions for וּמִתַּחַת and זְרֹעֹת עוֹלָם
  rationale: Adding the clear possessive and object makes the poetic image easier to follow.
- pob_phrase: He drove out the enemy before you, and said
  simplified_phrase: He drove the enemy out ahead of you and commanded
  preserved_meaning: God expelled the enemy in advance of Israel and ordered its destruction.
  reasoning_layer_used: POB lexical decisions for וַיְגָרֶשׁ, מִפָּנֶיךָ, and וַיֹּאמֶר
  rationale: Ordinary clause order and “commanded” clarify the military action and imperative.
