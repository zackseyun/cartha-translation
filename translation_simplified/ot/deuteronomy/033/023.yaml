translation:
  language: en
  text: 'About Naphtali he said:


    “Naphtali, you are richly favored

    and full of Yahweh’s blessing.

    Take possession of the sea[a] and the south.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the west.” The Hebrew word for “sea” can also refer to the west.
    reason: lexical_alternative
