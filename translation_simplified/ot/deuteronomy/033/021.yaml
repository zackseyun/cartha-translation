translation:
  language: en
  text: Gad chose the best land for himself, because the ruler’s share of land had been set aside there.[a] He came with the leaders of the people. Together with Israel, he did what was right according to Yahweh and carried out Yahweh’s judgments.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the lawgiver’s share of land had been set aside there.” The Hebrew word can mean “ruler” or “lawgiver,” and some understand it as a reference to Moses.
    reason: alternative_reading
  - marker: b
    text: The phrase translated “did what was right according to Yahweh” may also mean that he carried out “Yahweh’s justice” or “Yahweh’s righteous acts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the portion of the ruler was reserved
  simplified_phrase: the ruler’s share of land had been set aside
  preserved_meaning: A share of land connected with a ruler had been reserved there.
  reasoning_layer_used: Lexical decisions for חֶלְקַת, מְחֹקֵק, and סָפוּן
  rationale: Common wording clarifies the territorial allotment while retaining “ruler.”
- pob_phrase: the heads of the people
  simplified_phrase: the leaders of the people
  preserved_meaning: He came with the people’s recognized leaders.
  reasoning_layer_used: Lexical decision for רָאשֵׁי עָם
  rationale: “Leaders” gives the Hebrew image’s meaning in ordinary English.
- pob_phrase: he carried out the righteousness of Yahweh, and his judgments with Israel
  simplified_phrase: Together with Israel, he did what was right according to Yahweh and carried out Yahweh’s judgments
  preserved_meaning: Gad acted with Israel according to Yahweh’s righteous standard and judicial decisions.
  reasoning_layer_used: Lexical decisions for צִדְקַת יְהוָה, וּמִשְׁפָּטָיו, and עִם יִשְׂרָאֵל
  rationale: Reordering the clause and naming Yahweh as the source of the judgments removes ambiguity.
interpretive_expansions:
- pob_phrase: He chose
  rendering: Gad chose
  claim: The unnamed subject is Gad.
  evidence:
