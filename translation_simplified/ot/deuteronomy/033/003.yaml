translation:
  language: en
  text: He truly loves the peoples. All his holy ones are in your hand. They sit at your feet,[a] and each one receives your words.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is uncertain; it may instead mean “are gathered,” “crouch,” or “are struck down.”
    reason: alternative_reading
  - marker: b
    text: The rare Hebrew expression may also mean “takes up from your words” or “bears your sayings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Indeed, he loves the peoples
  simplified_phrase: He truly loves the peoples
  preserved_meaning: The opening still strongly affirms his continuing love for the peoples.
  reasoning_layer_used: Lexical decisions for אַף and חֹבֵב
  rationale: Placing the emphasis in “truly” gives the affirmation a more natural English form.
- pob_phrase: all his holy ones are in your hand, and they sit down at your feet
  simplified_phrase: All his holy ones are in your hand. They sit at your feet
  preserved_meaning: The holy ones remain under the care or power of the one addressed and positioned at his feet.
  reasoning_layer_used: Lexical decisions for בְּיָדֶךָ, תֻּכּוּ, and לְרַגְלֶךָ
  rationale: Two short sentences clarify the poetic scene while the footnote preserves uncertainty about the verb.
- pob_phrase: each receives your words
  simplified_phrase: each one receives your words
  preserved_meaning: Every holy one receives the words of the one addressed without implying comprehension or inward assimilation.
  reasoning_layer_used: Lexical decisions for יִשָּׂא and מִדַּבְּרֹתֶיךָ
  rationale: Adding “one” makes the individual scope clear while retaining the POB’s warranted sense.
