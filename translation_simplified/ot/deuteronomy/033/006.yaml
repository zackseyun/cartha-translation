simplification_decisions:
- pob_phrase: May Reuben live and not die
  simplified_phrase: May Reuben’s tribe live and not die out
  preserved_meaning: The blessing asks for Reuben’s continued existence as a tribe.
  reasoning_layer_used: The tribal-blessing context and theological rationale identify Reuben as the tribe.
  rationale: The wording makes the collective sense clear to readers unfamiliar with tribal names.
- pob_phrase: may his men be few
  simplified_phrase: may its people be few in number
  preserved_meaning: The blessing realistically allows for Reuben to survive with a small population.
  reasoning_layer_used: The lexical decisions understand מְתָיו as tribal people and מִסְפָּר as few or countable.
  rationale: “People” and “few in number” are clearer than the potentially military-sounding “his men.”
