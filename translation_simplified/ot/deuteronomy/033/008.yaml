translation:
  language: en
  text: 'About Levi he said:


    “Your Thummim and Urim[a] belong to your faithful one.[b]

    You tested him at Massah,

    and you contended with him at the waters of Meribah.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Thummim and Urim were priestly objects whose exact form and use are uncertain.
    reason: cultural_note
  - marker: b
    text: Or “your godly man” or “your loyal one”; the Hebrew describes someone marked by covenant faithfulness.
    reason: lexical_alternative
  - marker: c
    text: Massah means “testing,” and Meribah is associated with quarreling or contention; see Exodus 17:1–7 and Numbers 20:1–13.
    reason: cross_reference
