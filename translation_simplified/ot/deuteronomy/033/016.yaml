translation:
  language: en
  text: May Joseph receive the earth’s finest gifts and all it contains, along with the favor of the One who dwelt in the burning bush. May these blessings rest on Joseph’s head, on the crown of the head of the one set apart from his brothers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “the prince among his brothers” or “the consecrated one among his brothers.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with the choicest things of the earth and its fullness
  simplified_phrase: the earth’s finest gifts and all it contains
  preserved_meaning: The blessing includes the earth’s best produce and its full abundance.
  reasoning_layer_used: Lexical decisions for מֶגֶד, אֶרֶץ, and מְלֹאָהּ
  rationale: This wording explains the biblical idiom “its fullness” in common English.
- pob_phrase: may it come on the head of Joseph
  simplified_phrase: May these blessings rest on Joseph’s head
  preserved_meaning: The combined bounty and divine favor are invoked upon Joseph as a blessing.
  reasoning_layer_used: Lexical decision for תָּבֹואתָה and the blessing context
  rationale: Naming the collective blessings clarifies the pronoun without weakening the blessing force.
- pob_phrase: on the crown of the head of the one set apart from his brothers
  simplified_phrase: on the crown of the head of the one set apart from his brothers
  preserved_meaning: The anatomical crown image and Joseph’s distinction from his brothers remain intact.
  reasoning_layer_used: Lexical decisions for קָדְקֹד and נְזִיר אֶחָיו
  rationale: Retaining “of the head” prevents “crown” from sounding like a royal object.
