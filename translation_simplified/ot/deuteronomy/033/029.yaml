translation:
  language: en
  text: How blessed you are, Israel! Who is like you, a people saved by Yahweh? He is the shield who protects and helps you, and the sword of your majesty. Your enemies will cringe before you,[a] and you will trample their heights.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Your enemies will submit deceitfully to you”; the Hebrew may describe forced or insincere submission.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may refer to their heights or strongholds; some understand it as “their backs.”
    reason: lexical_alternative
