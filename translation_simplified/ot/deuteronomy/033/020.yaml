translation:
  language: en
  text: 'About Gad he said: “Blessed is the one who gives Gad more room.[a] Gad lives like a lioness[b] and tears off an arm and even the scalp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “May the one who gives Gad more room be blessed.” The one may be God, but the Hebrew does not say so explicitly.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word may also be translated “lion” and describes a powerful lion.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And of Gad he said
  simplified_phrase: About Gad he said
  preserved_meaning: This introduces the blessing spoken concerning the tribe of Gad.
  reasoning_layer_used: POB lexical decision for וּלְגָד
  rationale: “About Gad” is clearer modern English for the introductory formula.
- pob_phrase: he who enlarges Gad
  simplified_phrase: the one who gives Gad more room
  preserved_meaning: Someone causes Gad to have greater space without being explicitly identified.
  reasoning_layer_used: POB lexical and theological decisions for מַרְחִיב
  rationale: This explains “enlarges” while preserving the unnamed subject.
- pob_phrase: He dwells like a lioness, and tears off arm, even scalp
  simplified_phrase: Gad lives like a lioness and tears off an arm and even the scalp
  preserved_meaning: Gad is pictured as settled and powerful, tearing both arm and scalp like a predator.
  reasoning_layer_used: POB lexical decisions for שָׁכֵן, וְטָרַף, זְרוֹעַ, אַף, and קָדְקֹד
  rationale: Naming Gad clarifies the subject, and “and even” clearly marks the scalp as a second object.
translation_notes:
  risk_flags:
  - risk: “Gives Gad more room” may be heard generally rather than as territorial expansion.
    mitigation: The phrase preserves the image of making space without narrowing it to one explanation.
  - risk: Readers may assume the unnamed giver is certainly God.
    mitigation: Footnote a preserves the possible divine referent and the Hebrew ambiguity.
