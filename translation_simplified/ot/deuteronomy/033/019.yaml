translation:
  language: en
  text: They will call peoples to the mountain.[a] There they will offer sacrifices that are right before God. They will draw from the seas’ abundance[b] and from treasures hidden in the sand.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “summon peoples to a mountain.” The Hebrew does not identify the mountain.
    reason: alternative_reading
  - marker: b
    text: Hebrew pictures them sucking nourishment from the seas—that is, gaining sustenance or wealth from them.
    reason: lexical_alternative
  - marker: c
    text: This may mean hidden resources found along the seashore or in sandy regions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there they will sacrifice righteous sacrifices
  simplified_phrase: There they will offer sacrifices that are right before God
  preserved_meaning: The sacrifices are cultically acceptable and morally right without importing later doctrine.
  reasoning_layer_used: lexical and theological decisions
  rationale: The rewrite removes the repeated word “sacrifice” while explaining what “righteous” means here.
- pob_phrase: the abundance of the seas
  simplified_phrase: the seas’ abundance
  preserved_meaning: The seas provide plentiful sustenance, resources, or wealth without specifying only one kind.
  reasoning_layer_used: lexical decision
  rationale: The shorter possessive form keeps the broad meaning of the sea’s bounty.
- pob_phrase: the hidden treasures of the sand
  simplified_phrase: treasures hidden in the sand
  preserved_meaning: The poetic phrase points to concealed or stored resources associated with sand or shore.
  reasoning_layer_used: lexical decision and footnote
  rationale: Ordinary clause order makes the image immediately understandable without identifying the treasures.
interpretive_expansions:
- pob_phrase: righteous sacrifices
  rendering: sacrifices that are right before God
  claim: The sacrifices are fitting and acceptable in covenant worship.
  evidence:
  - The POB lexical rationale defines them as fitting or right before God.
  - The theological decision identifies them as cultically acceptable or right sacrifices.
  confidence: high
  alternatives_preserved:
  - sacrifices offered in righteousness
  - victorious or just sacrifices
