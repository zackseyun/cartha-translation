translation:
  language: en
  text: Joshua son of Nun was filled with the spirit of wisdom.[a] This was because Moses had laid his hands on him. The sons of Israel[b] listened to Joshua. They did what Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean a spirit of wisdom generally or divine empowerment more specifically.
    reason: alternative_reading
  - marker: b
    text: This can also be translated “the Israelites” or “the children of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was full of the spirit of wisdom
  simplified_phrase: was filled with the spirit of wisdom
  preserved_meaning: Joshua possessed a wisdom-giving spiritual endowment without identifying it explicitly as the Holy Spirit.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The documented alternative reads more naturally while lowercase “spirit” preserves the ambiguity.
- pob_phrase: because Moses had laid his hands on him
  simplified_phrase: This was because Moses had laid his hands on him.
  preserved_meaning: Joshua’s endowment is connected with Moses’ formal laying on of hands.
  reasoning_layer_used: POB lexical decision
  rationale: A separate sentence makes the relationship easier to follow without weakening the ritual image.
- pob_phrase: listened to him and did as Yahweh had commanded Moses
  simplified_phrase: listened to Joshua. They did what Yahweh had commanded Moses.
  preserved_meaning: Israel both heeded Joshua and acted according to Yahweh’s command through Moses.
  reasoning_layer_used: POB lexical decisions
  rationale: Naming Joshua and dividing the actions clarify the sequence while keeping both ideas distinct.
translation_notes:
  risk_flags:
  - risk: “Was filled” may sound more specifically like a divine action than “was full.”
    mitigation: Lowercase “spirit” and the footnote preserve the broader possible reading.
  - risk: “Sons of Israel” may be mistaken as referring only to literal male children.
    mitigation: The footnote gives the collective alternatives while retaining the POB’s covenant-family wording.
