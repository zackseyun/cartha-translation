translation:
  language: en
  text: 'Then Moses left the plains of Moab and went up Mount Nebo to the top of Pisgah, across from Jericho. There Yahweh showed him the whole land: Gilead as far as Dan.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: went up from the plains of Moab to Mount Nebo
  simplified_phrase: left the plains of Moab and went up Mount Nebo
  preserved_meaning: Moses moved from the Moabite plains to a higher place on Mount Nebo.
  reasoning_layer_used: POB lexical decisions for וַיַּעַל and מֵעַרְבֹת מוֹאָב
  rationale: Splitting the movement into leaving and going up makes the route easier to follow.
- pob_phrase: which is opposite Jericho
  simplified_phrase: across from Jericho
  preserved_meaning: Pisgah is geographically facing Jericho.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  rationale: “Across from” is more natural common English for the same geographic relation.
- pob_phrase: And Yahweh showed him all the land
  simplified_phrase: There Yahweh showed him the whole land
  preserved_meaning: Yahweh enabled Moses to see the covenant land from that location.
  reasoning_layer_used: POB lexical and theological decisions for וַיַּרְאֵהוּ יְהוָה and כָּל הָאָרֶץ
  rationale: “There” links the action to the summit, while “whole” clearly refers to the land in view.
