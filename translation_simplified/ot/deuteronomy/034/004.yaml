translation:
  language: en
  text: Yahweh said to him, “This is the land I promised under oath to Abraham, Isaac, and Jacob. I said, ‘I will give it to your offspring.’[a] I have let you see it with your own eyes, but you will not cross over into it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seed.” The Hebrew word is singular in form but has a collective sense.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the land that I swore to Abraham, to Isaac, and to Jacob, saying
  simplified_phrase: the land I promised under oath to Abraham, Isaac, and Jacob. I said
  preserved_meaning: Yahweh made a solemn oath and then stated its content.
  reasoning_layer_used: The lexical decisions for נִשְׁבַּעְתִּי and לֵאמֹר preserve the oath and introduce its words.
  rationale: “Promised under oath” explains “swore,” and two sentences make the nested quotation easier to follow.
- pob_phrase: I have let you see it
  simplified_phrase: I have let you see it
  preserved_meaning: Yahweh actively enabled Moses to see the land.
  reasoning_layer_used: The lexical decision for the causative form הֶרְאִיתִיךָ controls the wording.
  rationale: “Let you see” is clear while avoiding the weaker sense of mere permission.
- pob_phrase: you will not cross over there
  simplified_phrase: you will not cross over into it
  preserved_meaning: Moses will not cross into the promised land.
  reasoning_layer_used: The lexical decision for וְשָׁמָּה לֹא תַעֲבֹר preserves the spatial crossing image.
  rationale: “Into it” identifies the destination clearly without flattening “cross over” to “enter.”
translation_notes:
  risk_flags:
  - risk: “Offspring” may sound like one individual to some readers.
    mitigation: The footnote states that the singular Hebrew word has a collective sense.
