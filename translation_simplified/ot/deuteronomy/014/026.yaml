translation:
  language: en
  text: 'Spend the money on whatever you have an appetite for: cattle, sheep, goats, wine, strong drink,[a] or anything else your appetite asks for. Eat there in the presence of Yahweh your God, and rejoice—you and your household.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Strong drink” means an intoxicating drink other than wine.
    reason: cultural_note
simplification_decisions:
- pob_phrase: spend the silver
  simplified_phrase: spend the money
  preserved_meaning: The silver is money used to buy provisions for the celebration.
  reasoning_layer_used: POB lexical decision for הַכֶּסֶף and its footnote
  rationale: “Money” gives modern readers the intended commercial meaning immediately.
- pob_phrase: sheep
  simplified_phrase: sheep, goats
  preserved_meaning: The Hebrew collective term covers the small livestock from which festival provisions may be bought.
  reasoning_layer_used: POB lexical decision for צֹאן and grounding review
  rationale: Naming both animals prevents readers from wrongly excluding goats.
- pob_phrase: before Yahweh your God
  simplified_phrase: in the presence of Yahweh your God
  preserved_meaning: The meal takes place at the chosen worship location before God.
  reasoning_layer_used: POB lexical alternative for לִפְנֵי and theological decision for יְהוָה
  rationale: “In the presence of” makes the covenantal phrase clear while preserving Yahweh’s name.
interpretive_expansions:
- pob_phrase: sheep
  rendering: sheep, goats
  claim: The livestock category includes both sheep and goats.
  evidence:
  - The POB lexical audit says צֹאן can include sheep and goats collectively.
  - The festival setting does not limit the category to sheep.
  confidence: high
  alternatives_preserved:
  - small livestock
  - flock animals
translation_notes:
  risk_flags:
  - risk: “Money” removes the Hebrew image of silver used as currency.
    mitigation: The POB footnote and lexical rationale explicitly identify the silver as money here.
  - risk: Modern readers may understand “strong drink” as unusually high-proof liquor.
    mitigation: The footnote defines it broadly as an intoxicating beverage other than wine.
