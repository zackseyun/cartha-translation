translation:
  language: en
  text: And if the place Yahweh your God will choose to put his name is so far from you that the journey is too long for you to carry your tithe there, when Yahweh your God blesses you,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because Yahweh your God blesses you.” The sentence continues in verse 25.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the journey is too long for you ... because the place ... is too far from you
  simplified_phrase: the place ... is so far from you that the journey is too long
  preserved_meaning: The distance to the chosen place makes transporting the tithe unmanageable.
  reasoning_layer_used: POB lexical decisions and immediate syntax
  rationale: Reordering the cause and result makes the condition easier to follow.
- pob_phrase: you are not able to carry it
  simplified_phrase: you cannot carry your tithe there
  preserved_meaning: The worshiper cannot physically transport the tithe produce to the chosen place.
  reasoning_layer_used: Immediate context and POB lexical rationale
  rationale: Naming the tithe removes an unclear pronoun without changing its referent.
- pob_phrase: the place that Yahweh your God will choose to put his name there
  simplified_phrase: the place Yahweh your God will choose to put his name
  preserved_meaning: Yahweh will designate the central place of worship associated with his name.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Removing the repeated “there” gives natural English while retaining the covenant image.
interpretive_expansions:
- pob_phrase: carry it
  rendering: carry your tithe there
  claim: The object being carried is the tithe produce described in the preceding verses.
  evidence:
