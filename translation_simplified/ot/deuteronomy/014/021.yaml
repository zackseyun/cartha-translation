  preserved_meaning: The ban concerns an animal carcass not slaughtered as Israel’s law permitted.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The fuller wording makes the legal sense of “carcass” immediately clear.
- pob_phrase: the sojourner who is within your gates
  simplified_phrase: a resident foreigner living in one of your towns
  preserved_meaning: The person is a non-Israelite resident within Israel’s community, distinct from the foreigner in the next clause.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: Modern social and geographic terms replace two unfamiliar biblical expressions.
- pob_phrase: You shall not boil a young goat in its mother's milk
  simplified_phrase: Do not boil a young goat in its mother’s milk
  preserved_meaning: The specific prohibition and its concrete mother-and-young image remain intact.
  reasoning_layer_used: POB lexical decisions
  rationale: A direct command is clearer while preserving the precise action and image.
