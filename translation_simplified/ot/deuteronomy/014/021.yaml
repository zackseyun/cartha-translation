translation:
  language: en
  text: Do not eat any animal that died without being slaughtered in the permitted way. You may give it to a resident foreigner living in one of your towns, and that person may eat it. Or you may sell it to a foreigner. You are a holy people who belong to Yahweh your God. Do not boil a young goat in its mother’s milk.
  philosophy: optimal-equivalence
