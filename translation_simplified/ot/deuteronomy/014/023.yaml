translation:
  language: en
  text: You must eat in the presence of Yahweh your God, at the place he will choose for his name to dwell.[a] There you must eat the tenth part of your grain, new wine, and oil, along with the firstborn animals from your herds and flocks. Do this so that you will learn to fear Yahweh your God throughout your life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “to cause his name to dwell there” or “to set his name there.”
    reason: lexical_alternative
  - marker: b
    text: Here “fear” includes reverence and obedient awe.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And you shall eat before Yahweh your God
  simplified_phrase: You must eat in the presence of Yahweh your God
  preserved_meaning: The wording remains a covenant command to eat in Yahweh’s presence.
  reasoning_layer_used: POB lexical decision for וְאָכַלְתָּ and לִפְנֵי
  rationale: “Must” makes the legal force clear, while “in the presence of” explains “before.”
- pob_phrase: the tithe of your grain, your new wine, and your oil
  simplified_phrase: the tenth part of your grain, new wine, and oil
  preserved_meaning: The required tenth of each named agricultural product remains in view.
  reasoning_layer_used: POB lexical decision for מַעְשַׂר and the agricultural terms
  rationale: “Tenth part” explains the less familiar religious term “tithe.”
- pob_phrase: all your days
  simplified_phrase: throughout your life
  preserved_meaning: The command aims at lifelong fear of Yahweh.
  reasoning_layer_used: POB lexical decision for כָּל הַיָּמִים
  rationale: The common English phrase states the idiom’s lifelong duration directly.
interpretive_expansions:
- pob_phrase: to fear Yahweh your God
  rendering: to fear Yahweh your God throughout your life.[b]
  claim: In this covenant setting, fear includes reverence and obedient awe.
  evidence:
  - The POB lexical rationale explicitly identifies reverence and obedient awe within the covenant sense.
  - The verse presents this fear as the lifelong lesson produced by faithful worship.
  confidence: high
