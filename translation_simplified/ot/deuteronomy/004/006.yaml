translation:
  language: en
  text: So obey these laws and put them into practice. This will show the other peoples your wisdom and understanding. When they hear all these laws,[a] they will say, “Surely[b] this great nation is a wise and understanding people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew legal term is traditionally translated “statutes” and can also mean “decrees” or “ordinances.”
    reason: lexical_alternative
  - marker: b
    text: 'Or “Only.” Here the Hebrew word most likely expresses emphasis: “Surely.”'
    reason: lexical_alternative
