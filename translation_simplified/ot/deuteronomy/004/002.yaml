simplification_decisions:
- pob_phrase: You shall not add to
  simplified_phrase: Do not add anything to
  preserved_meaning: The command forbids supplementing what Moses is commanding.
  reasoning_layer_used: The lexical decision for תֹסִפוּ עַל requires the meaning “add to.”
  rationale: The direct command is clearer in modern English than “shall not.”
- pob_phrase: nor shall you take away from it
  simplified_phrase: and do not leave anything out
  preserved_meaning: The command forbids removing any part of the commanded word.
  reasoning_layer_used: The lexical decision for תִגְרְעוּ מִמֶּנּוּ permits the natural sense “diminish it.”
  rationale: “Leave anything out” clearly expresses reducing the commanded content.
- pob_phrase: so that you may keep
  simplified_phrase: Do this so that you may keep
  preserved_meaning: Not adding or removing serves the purpose of obeying Yahweh’s commandments.
  reasoning_layer_used: The lexical rationale identifies לִשְׁמֹר as expressing purpose or result.
  rationale: A new sentence makes the purpose relationship easier to follow.
