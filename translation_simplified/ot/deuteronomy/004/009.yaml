translation:
  language: en
  text: Only be on your guard and watch yourself very closely. Do not forget what you saw with your own eyes, and do not let it leave your heart[a] for as long as you live. Tell your children and grandchildren about it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, the heart is the center of a person’s memory, understanding, and will.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Only guard yourself carefully, and keep your soul very carefully
  simplified_phrase: Only be on your guard and watch yourself very closely
  preserved_meaning: The repeated commands strongly call for vigilant care over one’s whole self.
  reasoning_layer_used: Lexical and theological decisions on הִשָּׁמֶר and נֶפֶשׁ
  rationale: This avoids suggesting an immaterial soul while retaining the emphatic repetition.
- pob_phrase: lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life
  simplified_phrase: Do not forget what you saw with your own eyes, and do not let it leave your heart for as long as you live
  preserved_meaning: Israel must retain lifelong memory of events personally witnessed.
  reasoning_layer_used: Lexical decisions on eyewitness language, heart, and lifelong duration
  rationale: Direct commands and ordinary clause order make the warning easier to follow without removing the heart image.
- pob_phrase: Make them known to your children and to your children's children
  simplified_phrase: Tell your children and grandchildren about it
  preserved_meaning: The witnessed events must be passed on across generations.
  reasoning_layer_used: Lexical and theological decisions on ידע and representative offspring
  rationale: Natural family language replaces the formal causative and the repeated kinship phrase.
translation_notes:
  risk_flags:
  - risk: “Tell” may sound slightly less formal than “make known.”
    mitigation: “Tell … about it” still expresses causing the next generations to know the witnessed events.
  - risk: Singular “it” compresses the plural “things.”
    mitigation: The pronoun refers collectively to everything the people saw and does not narrow the command.
