translation:
  language: en
  text: Yahweh was angry with me because of what you said.[a] He swore that I would not cross the Jordan or enter the good land that Yahweh your God is giving you as your inheritance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says literally, “because of your words,” and may also mean “because of you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because of you
  simplified_phrase: because of what you said
  preserved_meaning: Moses connects Yahweh’s anger with the people’s words without settling broader questions of blame.
  reasoning_layer_used: lexical and theological decisions
  rationale: This gives the Hebrew reference to “your words” clear, natural expression.
- pob_phrase: and he swore that I would not cross the Jordan and that I would not enter
  simplified_phrase: He swore that I would not cross the Jordan or enter
  preserved_meaning: Yahweh’s oath excludes Moses both from crossing the river and entering the land.
  reasoning_layer_used: lexical decisions
  rationale: A new sentence and shared verb phrase make the two exclusions easier to follow.
- pob_phrase: as an inheritance
  simplified_phrase: as your inheritance
  preserved_meaning: The land is Yahweh’s covenant gift and Israel’s allotted possession.
  reasoning_layer_used: lexical decision
  rationale: Adding the already stated recipient makes the relationship immediately clear.
translation_notes:
  risk_flags:
