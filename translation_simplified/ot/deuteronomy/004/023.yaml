simplification_decisions:
- pob_phrase: Watch yourselves, lest you forget
  simplified_phrase: Be careful! Do not forget
  preserved_meaning: The wording keeps the urgent warning against forgetting.
  reasoning_layer_used: The lexical decisions identify the opening phrase as an idiomatic warning and פֶּן as introducing what must be avoided.
  rationale: A direct warning is clearer than the less familiar construction with “lest.”
- pob_phrase: and make for yourselves a carved image
  simplified_phrase: and do not make for yourselves a carved image
  preserved_meaning: The text still forbids self-directed idol making while preserving the concrete carved-image language.
  reasoning_layer_used: The lexical and theological decisions establish that image-making is prohibited in this context.
  rationale: Repeating “do not” makes the second forbidden action immediately clear.
