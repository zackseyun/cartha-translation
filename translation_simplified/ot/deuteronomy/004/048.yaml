translation:
  language: en
  text: from Aroer, at the edge of the Arnon Valley,[a] all the way to Mount Sion—that is, Mount Hermon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Arnon Valley may also be called the Arnon Wadi; it is a ravine or stream valley that does not necessarily hold water year-round.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew name Sion here is identified as Mount Hermon; it is distinct from the better-known Zion.
    reason: source_note
