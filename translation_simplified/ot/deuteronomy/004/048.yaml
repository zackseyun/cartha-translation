  preserved_meaning: Aroer stands at the edge of the Arnon ravine or stream valley.
  reasoning_layer_used: Lexical decisions for עַל שְׂפַת and נַחַל אַרְנֹן.
  rationale: The wording avoids implying a constantly flowing river.
- pob_phrase: as far as Mount Sion
  simplified_phrase: all the way to Mount Sion
  preserved_meaning: Mount Sion marks the endpoint of the territorial range.
  reasoning_layer_used: Lexical decision for וְעַד.
  rationale: “All the way to” expresses the endpoint in familiar English.
- pob_phrase: Mount Sion (that is, Hermon)
  simplified_phrase: Mount Sion—that is, Mount Hermon
  preserved_meaning: Sion and Hermon name the same mountain here.
  reasoning_layer_used: Lexical decisions for הוּא and חֶרְמוֹן.
  rationale: Repeating “Mount” makes the identification immediately clear.
