translation:
  language: en
  text: Be careful when you look up at the sky and see the sun, the moon, and the stars—the whole array of heaven. Do not be led astray into bowing down to them and serving them. Yahweh your God has assigned these heavenly bodies to all the peoples everywhere under heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “allotted” or “apportioned.” The wording does not say that Yahweh approved worshiping them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And beware lest you lift up your eyes to heaven
  simplified_phrase: Be careful when you look up at the sky
  preserved_meaning: The reader is warned about the danger that can follow from looking at the heavens.
  reasoning_layer_used: Lexical decision for the warning construction and upward-looking idiom.
  rationale: The rewrite uses ordinary English while keeping the warning and sequence of thought.
- pob_phrase: all the host of heaven
  simplified_phrase: the whole array of heaven
  preserved_meaning: The phrase gathers the sun, moon, and stars into the full heavenly display.
  reasoning_layer_used: Lexical decision that host refers here to the array of celestial bodies.
  rationale: “Array” preserves the collective image without suggesting only angels to a modern reader.
- pob_phrase: which Yahweh your God has allotted to all the peoples under all the heavens
  simplified_phrase: Yahweh your God has assigned these heavenly bodies to all the peoples everywhere under heaven
  preserved_meaning: Yahweh apportioned the celestial bodies among all peoples without approving their worship.
  reasoning_layer_used: Lexical and theological decisions on allotment and the idiom under all the heavens.
  rationale: The wording makes the referent and worldwide scope clear while leaving the allotment's precise sense open.
