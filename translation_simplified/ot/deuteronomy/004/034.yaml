translation:
  language: en
  text: Has any god ever attempted to take a nation for himself from inside another nation, using trials, signs and wonders, war, a mighty hand, an outstretched arm, and great terrifying acts?[a] Yet that is exactly what Yahweh your God did for you in Egypt, before your own eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “great terrors” or “great awe-inspiring deeds.”
    reason: lexical_alternative
