  preserved_meaning: God extracted one people from within another political nation.
  reasoning_layer_used: POB lexical decision for גּוֹי מִקֶּרֶב גּוֹי
  rationale: “From inside” makes the extraction image immediately clear.
- pob_phrase: by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm
  simplified_phrase: using trials, signs and wonders, war, a mighty hand, an outstretched arm
  preserved_meaning: Each means and each Exodus image remains distinct.
  reasoning_layer_used: POB lexical decisions for the repeated instrumental בְּ phrases
  rationale: One introductory word removes repetitive connectors without collapsing the list.
- pob_phrase: according to all that Yahweh your God did for you
  simplified_phrase: Yet that is exactly what Yahweh your God did for you
  preserved_meaning: Yahweh’s acts in Egypt fully answer the rhetorical question.
  reasoning_layer_used: POB lexical rationale for כְּכֹל אֲשֶׁר עָשָׂה
  rationale: The recast expresses the comparison and contrast in ordinary English.
