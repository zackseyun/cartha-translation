translation:
  language: en
  text: When you are in trouble and all these things happen to you, in the days to come[a] you will return to Yahweh your God and listen to his voice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “in the latter days,” which can mean a future time without necessarily referring to a specific end-times period.
    reason: alternative_reading
  - marker: b
    text: “Listen to his voice” also means to heed or obey him.
    reason: lexical_alternative
