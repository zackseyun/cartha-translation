translation:
  language: en
  text: But from there, you will search for Yahweh your God. You will find him if you seek him with all your heart and all your soul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “soul” refers to the whole living self; it may also be translated “life” or “being.”
    reason: lexical_alternative
