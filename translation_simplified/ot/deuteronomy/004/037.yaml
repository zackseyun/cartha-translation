    text: The Hebrew can also be translated “his offspring after him,” using singular forms for the fathers as a group.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “by his face”; here it means that God himself was present to deliver Israel.
    reason: lexical_alternative
