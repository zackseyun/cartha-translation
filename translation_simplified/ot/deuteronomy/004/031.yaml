translation:
  language: en
  text: For Yahweh your God is compassionate. He will not abandon you or destroy you, and he will not forget the covenant he swore to your fathers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “your fathers” means Israel’s covenant forefathers.
