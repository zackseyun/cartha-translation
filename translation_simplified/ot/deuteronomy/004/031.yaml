simplification_decisions:
- pob_phrase: Yahweh your God is a compassionate God
  simplified_phrase: Yahweh your God is compassionate
  preserved_meaning: Compassion remains a defining quality of Yahweh in his covenant relationship with Israel.
  reasoning_layer_used: Lexical decision for אֵל רַחוּם
  rationale: The adjective states the same truth more naturally without repeating “God.”
- pob_phrase: he will not abandon you or destroy you or forget
  simplified_phrase: He will not abandon you or destroy you, and he will not forget
  preserved_meaning: All three assurances remain distinct, including the important image that God does not forget.
  reasoning_layer_used: Lexical decisions for רפה, שׁחת, and שׁכח
  rationale: A new sentence and clearer coordination make the three promises easier to follow.
- pob_phrase: the covenant of your fathers that he swore to them
  simplified_phrase: the covenant he swore to your fathers
  preserved_meaning: The covenant is the solemn oath Yahweh made to Israel’s fathers.
  reasoning_layer_used: Lexical and theological decisions for אֲבֹתֶיךָ and נשבע
  rationale: Reordering removes an awkward relative clause while retaining “fathers” and the oath language.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “your fathers” to mean the immediate parents of the audience.
    mitigation: The footnote identifies them as Israel’s covenant forefathers.
