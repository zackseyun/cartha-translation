translation:
  language: en
  text: Now, Israel, listen to the laws and legal rulings I am teaching you, and carry them out. Do this so that you may live, enter the land, and take possession of it—the land Yahweh,[a] the God of your fathers, is giving you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” represents the Hebrew divine name YHWH, traditionally rendered “the LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: the statutes and the judgments
  simplified_phrase: the laws and legal rulings
  preserved_meaning: The two distinct kinds of covenant commands remain distinct, including the judicial sense of “judgments.”
  reasoning_layer_used: POB lexical decisions for חֻקִּים and מִשְׁפָּטִים
  rationale: Common legal wording replaces terms that many modern readers may find unclear.
- pob_phrase: that I am teaching you to do
  simplified_phrase: I am teaching you, and carry them out
  preserved_meaning: Moses is presently teaching Israel commands that they must put into practice.
  reasoning_layer_used: POB lexical decisions for מְלַמֵּד and לַעֲשׂוֹת
  rationale: A direct command makes the relationship between learning and action easier to follow.
- pob_phrase: so that you may live and go in and take possession of the land
  simplified_phrase: Do this so that you may live, enter the land, and take possession of it
  preserved_meaning: Carrying out the commands is linked to life, entry into the land, and possession of it.
  reasoning_layer_used: POB lexical decisions for לְמַעַן תִּחְיוּ, וּבָאתֶם, and וִירִשְׁתֶּם
  rationale: The long purpose sequence is recast as a new sentence without changing its covenantal force.
translation_notes:
  risk_flags:
  - risk: “Laws” can sound broader than the specific Hebrew category “statutes.”
    mitigation: Pairing it with “legal rulings” preserves the source text’s two-part legal distinction.
