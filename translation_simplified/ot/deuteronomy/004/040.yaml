  reasoning_layer_used: POB lexical decisions for וְשָׁמַרְתָּ, חֻקָּיו, and מִצְוֺתָיו
  rationale: “Obey” and “laws” make the covenant duty clear while keeping the two source terms distinct.
- pob_phrase: so that it may go well with you and with your children after you
