translation:
  language: en
  text: 'Ask about the ancient days before your time, going all the way back to the day when God created man[a] on the earth. Ask from one end of the heavens to the other: Has anything as great as this ever happened? Has anyone ever heard of anything like it?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “humankind”; here the Hebrew word for “man” can represent humanity as a whole.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the former days that were before you
  simplified_phrase: the ancient days before your time
  preserved_meaning: The hearer is told to consider the distant past that preceded them.
  reasoning_layer_used: Lexical decision for לְיָמִים רִאשֹׁנִים and אֲשֶׁר הָיוּ לְפָנֶיךָ
  rationale: “Ancient days before your time” states the temporal sense in ordinary English.
- pob_phrase: from the day when God created man on the earth
  simplified_phrase: going all the way back to the day when God created man on the earth
  preserved_meaning: Creation marks the starting point of the historical survey.
  reasoning_layer_used: Lexical decision for לְמִן הַיּוֹם אֲשֶׁר בָּרָא and theological decision for אָדָם
  rationale: “Going all the way back” makes the historical range easy to follow while retaining “man.”
- pob_phrase: has anything happened like this great thing, or has anything been heard like it?
  simplified_phrase: Has anything as great as this ever happened? Has anyone ever heard of anything like it?
  preserved_meaning: The two rhetorical questions stress that the great event is without known parallel.
  reasoning_layer_used: Lexical decisions for הֲנִהְיָה, כַּדָּבָר הַגָּדוֹל הַזֶּה, and הֲנִשְׁמַע כָּמֹהוּ
  rationale: Two direct questions clarify the contrast between an event happening and one being heard of.
interpretive_expansions:
- pob_phrase: has anything happened ... or has anything been heard
  rendering: Has anything ... ever happened? Has anyone ever heard ...?
  claim: The questions cover all of history within the stated survey.
  evidence:
  - The verse begins its survey at creation and extends it across the heavens.
  - The POB rationale says the question asks whether such an event has ever occurred.
  confidence: high
