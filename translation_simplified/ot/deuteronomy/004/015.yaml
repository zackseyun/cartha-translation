translation:
  language: en
  text: So be extremely careful, because when Yahweh spoke to you at Horeb from within the fire, you did not see any form.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “likeness” or “image.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: watch yourselves very carefully
  simplified_phrase: be extremely careful
  preserved_meaning: The command strongly warns the people to guard their conduct.
  reasoning_layer_used: Lexical decisions for וְנִשְׁמַרְתֶּם, מְאֹד, and לְנַפְשֹׁתֵיכֶם
  rationale: The direct warning states the Hebrew reflexive idiom naturally without introducing a separate reference to souls.
- pob_phrase: since you saw no form on the day Yahweh spoke to you
  simplified_phrase: because when Yahweh spoke to you ... you did not see any form
  preserved_meaning: Their seeing no visible form is the reason for the warning.
  reasoning_layer_used: Lexical decision for כִּי and theological decision on תְּמוּנָה
  rationale: Ordinary clause order makes the causal link easier to follow while retaining “form.”
- pob_phrase: from the midst of the fire
  simplified_phrase: from within the fire
  preserved_meaning: Yahweh’s voice came from inside the fire.
  reasoning_layer_used: Lexical decision for מִתּוֹךְ הָאֵשׁ
  rationale: “From within” preserves the vivid spatial image in more common English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “form” to mean a document rather than a visible representation.
    mitigation: The footnote supplies “likeness” and “image” as contextual alternatives.
