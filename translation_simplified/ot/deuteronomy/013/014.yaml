translation:
  language: en
  text: Some corrupt men[a] have gone out from among you and led the people of their city astray. They said, “Let us go and serve other gods”—gods you have not known.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “sons of worthlessness”; traditionally, “sons of Belial.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Certain worthless men
  simplified_phrase: Some corrupt men
  preserved_meaning: The men are morally corrupt and lawless, not people without human value.
  reasoning_layer_used: POB lexical and theological decisions on בְּנֵי בְלִיַּעַל
  rationale: “Corrupt” communicates the Hebrew idiom clearly without importing Belial as a personal name.
- pob_phrase: the inhabitants of their city
  simplified_phrase: the people of their city
  preserved_meaning: The men misled those living in their own city.
  reasoning_layer_used: POB lexical decision on יֹשְׁבֵי עִירָם
  rationale: “The people” is more common English than “the inhabitants.”
- pob_phrase: saying, ‘Let us go and serve other gods,’ which you have not known
  simplified_phrase: They said, “Let us go and serve other gods”—gods you have not known.
  preserved_meaning: Their direct appeal was to abandon covenant faithfulness and serve unfamiliar gods.
  reasoning_layer_used: POB lexical decisions on לֵאמֹר, נֵלְכָה וְנַעַבְדָה, and אֲשֶׁר לֹא יְדַעְתֶּם
  rationale: A new sentence and repeated “gods” remove the tangled relative clause while retaining “serve” and “known.”
