translation:
  language: en
  text: But that prophet or dreamer of dreams must be put to death. He has spoken in rebellion against Yahweh your God, who brought you out of Egypt and redeemed you from the house of slavery. He spoke to drive you away from the way Yahweh your God commanded you to walk. So you must remove the evil from among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shall be put to death, because he has spoken rebellion against
  simplified_phrase: must be put to death. He has spoken in rebellion against
  preserved_meaning: The sentence still commands judicial execution for speech that rejects covenant loyalty to Yahweh.
  reasoning_layer_used: Lexical decisions for יוּמָת and דִבֶּר סָרָה
  rationale: Two direct sentences clarify the judgment and make the charge natural in English.
- pob_phrase: to drive you from the way in which Yahweh your God commanded you to walk
  simplified_phrase: He spoke to drive you away from the way Yahweh your God commanded you to walk
  preserved_meaning: The prophet's speech was aimed at driving Israel from Yahweh's commanded way.
  reasoning_layer_used: Lexical decisions for לְהַדִּיחֲךָ, מִן הַדֶּרֶךְ, and the walking metaphor
  rationale: A separate sentence preserves the full purpose clause without weakening it to an attempt.
- pob_phrase: So you shall purge the evil from your midst
  simplified_phrase: So you must remove the evil from among you
  preserved_meaning: The commanded judgment decisively removes the covenant evil from the community.
  reasoning_layer_used: Lexical decision for וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  rationale: Common legal wording replaces “purge” while keeping the direct command and result.
translation_notes:
  risk_flags:
  - risk: Splitting the long sentence may loosen the connection between the offense and its purpose.
    mitigation: Repeating “He spoke” directly joins the rebellious speech to its aim.
