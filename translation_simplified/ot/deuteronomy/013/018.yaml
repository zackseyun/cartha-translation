  simplified_phrase: Do not keep anything that has been devoted to destruction. Let none of it cling to your hand.
  preserved_meaning: The total ban on retaining devoted property remains explicit, while the concrete image of clinging to the hand is preserved.
  reasoning_layer_used: POB lexical decisions for יִדְבַּק, בְּיָדְךָ, מְאוּמָה, and הַחֵרֶם
