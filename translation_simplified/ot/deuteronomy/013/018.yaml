- pob_phrase: the fierceness of his anger
  simplified_phrase: his fierce anger
  preserved_meaning: Yahweh's intense personal anger remains fully expressed.
  reasoning_layer_used: POB lexical and theological decisions on חֲרוֹן אַפּוֹ
  rationale: The adjective form is clearer and less formal while retaining the force of divine wrath.
- pob_phrase: multiply you
  simplified_phrase: make you numerous
  preserved_meaning: Yahweh's covenant promise to increase Israel is retained.
  reasoning_layer_used: POB lexical decision on וְהִרְבֶּךָ
  rationale: The clearer phrase communicates population increase while preserving the patriarchal promise.
