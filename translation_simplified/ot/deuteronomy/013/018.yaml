translation:
  language: en
  text: Do not keep anything that has been devoted to destruction. Let none of it cling to your hand. Do this so that Yahweh may turn from his fierce anger, show you mercy, have compassion on you, and make you numerous, just as he swore to your fathers.
  philosophy: optimal-equivalence
