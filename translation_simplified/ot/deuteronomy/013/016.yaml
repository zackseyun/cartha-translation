translation:
  language: en
  text: You must strike down everyone living in that city with the edge of the sword. Devote the city to destruction, along with everything in it, including its livestock, with the edge of the sword.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew means to devote something irrevocably to destruction; traditionally, “put it under the ban.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall surely strike the inhabitants of that city
  simplified_phrase: You must strike down everyone living in that city
  preserved_meaning: The wording keeps the emphatic command and its lethal force.
  reasoning_layer_used: Lexical decision for הַכֵּה תַכֶּה and the immediate sword context
  rationale: “Must strike down” states the force more clearly than “shall surely strike.”
- pob_phrase: devoting it to destruction, along with all that is in it and its livestock
  simplified_phrase: Devote the city to destruction, along with everything in it, including its livestock
  preserved_meaning: The city, its contents, and its domestic animals all remain within the command’s scope.
  reasoning_layer_used: Lexical and theological decisions for חרם and the scope clauses
  rationale: Naming the city clarifies the pronoun while preserving the sacral destruction language.
- pob_phrase: with the edge of the sword ... with the edge of the sword
  simplified_phrase: with the edge of the sword ... with the edge of the sword
  preserved_meaning: The repeated sword image emphasizes both the means and the full scope of destruction.
  reasoning_layer_used: Repeated lexical decision for לְפִי חָרֶב
  rationale: Keeping the same phrase twice avoids an unclear pronoun and preserves the Hebrew repetition.
translation_notes:
  risk_flags:
  - risk: “Devote the city to destruction” may be unfamiliar to some readers.
    mitigation: The footnote explains its irrevocable sense and gives the traditional alternative.
