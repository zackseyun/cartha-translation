translation:
  language: en
  text: Do not follow what that prophet says or what the person who has dreams says. Yahweh your God is testing you. He is doing this to know whether you love Yahweh your God with all your heart and all your soul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Soul” can also mean your life, self, or whole being; “soul” keeps Deuteronomy’s important covenant wording.
    reason: lexical_alternative
