translation:
  language: en
  text: If your own brother—your mother’s son—or your son, your daughter, the wife you hold close, or a friend who is as dear to you as your own life, secretly tries to lure you, saying, “Let us go and serve other gods”—gods that neither you nor your fathers have known—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your brother, the son of your mother
  simplified_phrase: your own brother—your mother’s son
  preserved_meaning: The wording still emphasizes the especially close bond of a brother who shares the same mother.
  reasoning_layer_used: Lexical and theological decisions on intimate kinship
  rationale: The dash makes the Hebrew apposition easier to understand without removing it.
- pob_phrase: the wife of your embrace, or your friend who is like your own soul
  simplified_phrase: the wife you hold close, or a friend who is as dear to you as your own life
  preserved_meaning: Both phrases retain the intimate embrace and the comparison to one’s own life.
  reasoning_layer_used: Lexical and theological decisions on relational imagery
  rationale: The images are recast in natural English while preserving their emotional force.
- pob_phrase: secretly entices you
  simplified_phrase: secretly tries to lure you
  preserved_meaning: The person privately attempts to draw the hearer into serving other gods.
  reasoning_layer_used: Lexical decisions for יְסִיתְךָ and בַּסֵּתֶר
  rationale: “Tries to lure” is clear common English within the documented lexical range.
translation_notes:
  risk_flags:
  - risk: “As dear to you as your own life” states the relational force of the Hebrew soul image more directly.
    mitigation: The comparison with one’s own life remains instead of being reduced to “close friend.”
