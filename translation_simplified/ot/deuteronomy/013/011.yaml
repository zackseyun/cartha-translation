translation:
  language: en
  text: You must stone him to death because he tried to drive you away from Yahweh your God. Yahweh brought you out of Egypt, out of the place where you were slaves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “out of the house of slavery,” a covenant expression recalling Israel’s deliverance from Egypt.
    reason: cultural_note
simplification_decisions:
- pob_phrase: You shall stone him with stones, and he shall die
  simplified_phrase: You must stone him to death
  preserved_meaning: The judicial command, its means, and its fatal outcome remain explicit.
  reasoning_layer_used: Lexical decisions for וּסְקַלְתּוֹ, בָאֲבָנִים, and וָמֵת
  rationale: The shorter wording states the same action and result in natural modern English.
- pob_phrase: because he sought to drive you away
  simplified_phrase: because he tried to drive you away
  preserved_meaning: His deliberate attempt to cause covenant disloyalty remains the reason for the sentence.
  reasoning_layer_used: Lexical and theological decisions for בִקֵּשׁ and לְהַדִּיחֲךָ
  rationale: “Tried” makes the intended sense of “sought” immediately clear without weakening “drive away.”
- pob_phrase: out of the house of slavery
  simplified_phrase: out of the place where you were slaves
  preserved_meaning: Egypt is identified as the place from which Yahweh freed enslaved Israel.
  reasoning_layer_used: Lexical decision and cultural note for מִבֵּית עֲבָדִים
  rationale: The main text explains the Hebrew image plainly while the footnote preserves the covenant formula.
translation_notes:
  risk_flags:
  - risk: Combining the stoning command and death clause may obscure their separate Hebrew sequence.
    mitigation: “Stone him to death” still states both the means of execution and its required outcome.
