translation:
  language: en
  text: Gather everything taken from the city in the middle of its public square. Then burn the city and everything taken from it, consuming it all as an offering to Yahweh your God.[a] It must remain a mound of ruins forever and never be rebuilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “burn the city and everything taken from it completely for Yahweh your God.”
    reason: lexical_alternative
