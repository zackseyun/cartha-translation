simplification_decisions:
- pob_phrase: For you must surely put him to death
  simplified_phrase: For you must put him to death.
  preserved_meaning: The wording remains a strong legal command connected to the preceding verse.
  reasoning_layer_used: Lexical and theological decisions on כִּי and הָרֹג תַּהַרְגֶנּוּ
  rationale: “Must” expresses the emphatic obligation without the awkward phrase “must surely.”
- pob_phrase: your hand shall be first against him to put him to death, and afterward the hand of all the people
  simplified_phrase: Your hand must be the first against him to put him to death, and then all the people must take part.
  preserved_meaning: The addressed person acts first in the execution, followed by the community’s participation.
  reasoning_layer_used: Lexical decisions on יָדְךָ, בָרִאשׁוֹנָה, וְיַד כָּל הָעָם, and בָּאַחֲרֹנָה
  rationale: The revision keeps the hand image and clearly states that the people participate in carrying out the sentence.
translation_notes:
  risk_flags:
  - risk: “Take part” does not repeat the Hebrew image of the people’s collective hand.
    mitigation: The retained first reference to “your hand” preserves the image, while the context clearly identifies the people’s participation in the execution.
