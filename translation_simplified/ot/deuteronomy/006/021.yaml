translation:
  language: en
  text: Then tell your son, “We were Pharaoh’s slaves in Egypt. Yahweh brought us out of Egypt with his strong hand.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Strong hand” is a Hebrew image for Yahweh’s powerful act of rescue.
    reason: simplification_note
simplification_decisions:
- pob_phrase: then you shall say to your son
  simplified_phrase: Then tell your son
  preserved_meaning: The parent is directed to give his son this answer in the sequence begun in the previous verse.
  reasoning_layer_used: Lexical decision for וְאָמַרְתָּ and immediate context
  rationale: The direct command “tell” is clearer modern English than “you shall say” while keeping the instructional force.
- pob_phrase: We were slaves to Pharaoh in Egypt
  simplified_phrase: We were Pharaoh’s slaves in Egypt
  preserved_meaning: The Israelites lived in oppressive bondage under Pharaoh in Egypt.
  reasoning_layer_used: Lexical and theological decisions for עֲבָדִים and לְפַרְעֹה
  rationale: The possessive form expresses Pharaoh’s control more naturally without weakening “slaves.”
- pob_phrase: and Yahweh brought us out from Egypt with a strong hand
  simplified_phrase: Yahweh brought us out of Egypt with his strong hand
  preserved_meaning: Yahweh personally delivered Israel from Egypt through powerful action.
  reasoning_layer_used: Lexical decisions for יְהוָה, וַיּוֹצִיאֵנוּ, and בְּיָד חֲזָקָה
  rationale: A new sentence clarifies the rescue while retaining Yahweh’s name and the strong-hand image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “strong hand” only as a physical description.
    mitigation: The footnote briefly explains that the image refers to Yahweh’s powerful rescue.
