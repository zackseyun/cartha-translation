translation:
  language: en
  text: Fear Yahweh your God.[a] Serve him, and take your oaths by his name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This fear includes reverence and awe, not merely terror.
    reason: lexical_alternative
  - marker: b
    text: That is, when making a solemn promise, call on Yahweh as the witness to it.
    reason: simplification_note
simplification_decisions:
- pob_phrase: You shall fear Yahweh your God
  simplified_phrase: Fear Yahweh your God
  preserved_meaning: The command retains the full force of reverential fear before Yahweh.
  reasoning_layer_used: POB lexical and theological decisions on תִּירָא
  rationale: The direct command is clearer while keeping “fear” rather than narrowing it to respect.
- pob_phrase: and him you shall serve
  simplified_phrase: Serve him
  preserved_meaning: Israel is commanded to give Yahweh practical, worshipful service.
  reasoning_layer_used: POB lexical and theological decisions on תַעֲבֹד
  rationale: Ordinary English word order removes the Hebrew-style emphasis without weakening the command.
- pob_phrase: and by his name you shall swear
  simplified_phrase: and take your oaths by his name
  preserved_meaning: Solemn promises are to invoke Yahweh’s name as their authority and witness.
  reasoning_layer_used: POB lexical decisions on וּבִשְׁמוֹ and תִּשָּׁבֵעַ
  rationale: “Take your oaths” makes the intended sense of “swear” immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear” as terror alone.
    mitigation: Footnote a preserves the Hebrew sense of reverential fear and awe.
  - risk: “Take your oaths” might sound like a command to make oaths frequently.
    mitigation: Footnote b identifies the phrase as guidance for making a solemn promise.
