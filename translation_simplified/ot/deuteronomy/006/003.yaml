translation:
  language: en
  text: Israel, listen, and be careful to do what God commands. Then things may go well for you, and you may become very numerous in a land flowing with milk and honey, just as Yahweh, the God of your fathers,[a] has told you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the God of your ancestors.” The Hebrew says “your fathers.”
    reason: lexical_alternative
  - marker: b
    text: Or, “just as Yahweh, the God of your fathers, promised you—a land flowing with milk and honey.” The Hebrew wording is compressed.
    reason: alternative_reading
