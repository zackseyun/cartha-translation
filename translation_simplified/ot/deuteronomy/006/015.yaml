  preserved_meaning: The threatened judgment entails complete destruction and removal.
  reasoning_layer_used: POB footnote and lexical rationale for מֵעַל פְּנֵי הָאֲדָמָה
  rationale: The Hebrew idiom’s force is expressed directly for readers unfamiliar with it.
