translation:
  language: en
  text: For Yahweh your God is among you, and he is a jealous God.[a] If you worship other gods, Yahweh your God’s anger may burn against you, and he may destroy you, removing you completely from the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a zealous God.” This means that Yahweh alone claims his people’s worship.
    reason: lexical_alternative
