- pob_phrase: Yahweh your God in your midst is a jealous God
  simplified_phrase: Yahweh your God is among you, and he is a jealous God
  preserved_meaning: Yahweh is present among his people and claims their exclusive loyalty.
  reasoning_layer_used: POB lexical and theological decisions on בְּקִרְבֶּךָ and אֵל קַנָּא
  rationale: The recast sentence states God’s presence and jealousy in natural modern English.
- pob_phrase: lest the anger of Yahweh your God burn against you
  simplified_phrase: If you worship other gods, Yahweh your God’s anger may burn against you
  preserved_meaning: Rival worship brings the threatened possibility of Yahweh’s burning anger.
  reasoning_layer_used: Immediate context and POB lexical decisions on פֶּן and יֶחֱרֶה אַף
  rationale: The conditional names the preceding offense while “may” retains the warning rather than making an unqualified prediction.
- pob_phrase: destroy you from the face of the earth
