translation:
  language: en
  text: Teach them carefully and repeatedly to your sons.[a][b] Speak about them when you sit at home, when you travel along the road, when you lie down, and when you get up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb pictures sharpening and here means teaching with repetition and care.
    reason: lexical_alternative
  - marker: b
    text: Hebrew specifically says “sons,” though the instruction applies more broadly within the household.
    reason: lexical_alternative
