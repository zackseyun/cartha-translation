translation:
  language: en
  text: And if Yahweh your God expands your territory, just as he swore to your fathers,[a] and gives you all the land he promised your fathers,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ancestors” in both places. The Hebrew literally says “fathers” and refers to Israel’s patriarchal forefathers.
    reason: lexical_alternative
