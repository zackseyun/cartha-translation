- pob_phrase: enlarges your territory
  simplified_phrase: expands your territory
  preserved_meaning: Yahweh increases the land held by Israel.
  reasoning_layer_used: POB lexical decision for יַרְחִיב and גְּבֻלְךָ
  rationale: “Expands” is common English for increasing a territory.
- pob_phrase: as he swore
  simplified_phrase: just as he swore
  preserved_meaning: The expansion fulfills Yahweh’s oath to Israel’s fathers.
  reasoning_layer_used: POB lexical decision for כַּאֲשֶׁר נִשְׁבַּע
  rationale: “Just as” makes the connection to the oath immediately clear.
- pob_phrase: all the land that he promised to give to your fathers
  simplified_phrase: all the land he promised your fathers
  preserved_meaning: Yahweh gives Israel the whole land promised to its patriarchal forefathers.
  reasoning_layer_used: POB lexical decisions for כָּל הָאָרֶץ and אֲשֶׁר דִּבֶּר לָתֵת
  rationale: The shorter wording removes unnecessary English words without weakening the promise.
