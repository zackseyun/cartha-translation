  text: Otherwise, the avenger of blood—the dead person’s relative responsible for avenging the death—may pursue the person who caused the death because his anger burns hot, catch up with him because the road is long, and strike him dead. Yet the person who caused the death was not legally subject to death, because he had not previously hated the person he killed.
