translation:
  language: en
  text: If a malicious witness comes forward and accuses a man of wrongdoing,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a false witness.” The Hebrew describes a witness acting wrongfully or maliciously.
    reason: lexical_alternative
  - marker: b
    text: The word translated “wrongdoing” can also mean “rebellion” or “apostasy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rises up against a man
  simplified_phrase: comes forward ... against a man
  preserved_meaning: The witness appears and takes a stand against the accused man.
  reasoning_layer_used: The lexical decision explains that the Hebrew verb refers to appearing or taking a stand as a witness.
  rationale: “Comes forward” expresses the legal action more naturally while retaining the image of presenting oneself.
- pob_phrase: to testify against him of wrongdoing
  simplified_phrase: accuses a man of wrongdoing
  preserved_meaning: The witness gives hostile testimony alleging that the man committed a wrong.
  reasoning_layer_used: The lexical decisions identify the action as legal testimony directed against the man.
  rationale: “Accuses” makes the function of the hostile testimony immediately clear.
