translation:
  language: en
  text: Then the elders of his city must send for him and take him from there. They must hand him over to the avenger of blood,[a] and he must die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was the person legally responsible for avenging a killing; the Hebrew term can also be translated “blood avenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall send and take him from there
  simplified_phrase: must send for him and take him from there
  preserved_meaning: The elders are legally required to arrange his removal from that place.
  reasoning_layer_used: The lexical decisions give the verbs legal force while leaving the agents unnamed.
  rationale: “Send for him” makes the retrieval clear without adding men not named in the Hebrew.
- pob_phrase: hand him over to the avenger of blood
  simplified_phrase: They must hand him over to the avenger of blood
  preserved_meaning: The elders transfer him into the power of the person legally responsible for avenging the killing.
  reasoning_layer_used: The lexical decisions preserve both the custody-transfer idiom and the technical legal title.
  rationale: A new sentence clarifies the action while the footnote explains the unfamiliar title.
- pob_phrase: and he shall die
  simplified_phrase: and he must die
  preserved_meaning: Death is the prescribed legal outcome after he is handed over.
  reasoning_layer_used: The lexical rationale identifies the clause as a terse statement of legal outcome.
  rationale: “Must die” expresses the legal outcome in clearer modern English.
translation_notes:
  risk_flags:
  - risk: “Avenger of blood” may sound like an unauthorized vigilante.
    mitigation: The footnote identifies it as a legally responsible role.
