translation:
  language: en
  text: A single witness’s testimony cannot establish a case against a man[a] for any wrongdoing or sin he commits. A case can be established only by the testimony of two or three witnesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “a man,” using the masculine singular in a representative legal sense; the law applies generally to a person accused.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A single witness shall not stand against a man
  simplified_phrase: A single witness’s testimony cannot establish a case against a man
  preserved_meaning: One person’s testimony is not legally sufficient to establish a case against the accused.
  reasoning_layer_used: POB lexical decisions for עֵד אֶחָד and the legal sense of יָקוּם
  rationale: Naming the testimony and the case makes the legal rule immediately clear.
- pob_phrase: for any iniquity or for any sin, in connection with any sin that he commits
  simplified_phrase: for any wrongdoing or sin he commits
  preserved_meaning: The rule covers every kind of wrongdoing or sin charged against him.
  reasoning_layer_used: POB lexical alternatives for עָוֺן and its rationale for the repeated sin phrase
  rationale: “Wrongdoing” replaces an archaic term while the two categories and comprehensive scope remain.
- pob_phrase: on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand
  simplified_phrase: A case can be established only by the testimony of two or three witnesses
  preserved_meaning: A legal case requires testimony from at least two witnesses.
  reasoning_layer_used: POB footnote c and lexical decisions for יָקוּם, דָּבָר, and עַל פִּי
  rationale: “Be established” clearly expresses the supported legal sense of “stand.”
interpretive_expansions:
