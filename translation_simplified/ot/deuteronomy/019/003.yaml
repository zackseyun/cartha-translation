translation:
  language: en
  text: Prepare the roads to the cities of refuge. Divide the land that Yahweh your God is giving you as an inheritance into three regions, so that anyone who kills someone may flee to one of those cities.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term includes someone who kills accidentally; it does not necessarily mean a murderer.
    reason: lexical_alternative
