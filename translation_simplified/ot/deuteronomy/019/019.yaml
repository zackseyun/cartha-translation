translation:
  language: en
  text: Then you must do to the false witness exactly what he intended to do to his brother.[a] In this way, you must remove the evil from among you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his fellow Israelite.” The Hebrew says “his brother,” meaning another member of the covenant community here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall do to him just as
  simplified_phrase: you must do to the false witness exactly what
  preserved_meaning: The community must impose the same penalty the false witness meant to bring on another.
  reasoning_layer_used: Lexical decisions and immediate legal context
  rationale: “Must” makes the legal command clear, while “exactly” preserves the measure-for-measure force.
- pob_phrase: So you shall purge the evil from your midst
  simplified_phrase: In this way, you must remove the evil from among you
  preserved_meaning: Carrying out this judgment removes evil from within the covenant community.
  reasoning_layer_used: Lexical decision for וּבִעַרְתָּ and מִקִּרְבֶּךָ
  rationale: Common wording replaces the formal idiom without suggesting literal burning or weakening its moral force.
