translation:
  language: en
  text: Do not spare him out of pity.[a] You must remove from Israel the guilt of shedding innocent blood. Then it will go well with you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “Your eye shall not pity him,” using the eye as an image for compassion. “Do not spare him” is another possible rendering.
    reason: lexical_alternative
  - marker: b
    text: In verses 11–12, this command concerns the lawful judgment of a deliberate murderer, not private revenge.
    reason: cross_reference
