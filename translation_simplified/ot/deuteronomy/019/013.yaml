  rationale: The main text uses natural English, while the note accurately preserves the Hebrew eye image and alternate rendering.
- pob_phrase: you shall purge the innocent blood from Israel
  simplified_phrase: You must remove from Israel the guilt of shedding innocent blood
  preserved_meaning: Israel must be cleared of the communal bloodguilt caused by innocent bloodshed.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: The legal meaning of the difficult blood idiom is stated plainly without weakening its force.
- pob_phrase: and it shall go well with you
