  preserved_meaning: The phrase refers to an accused person subject to capital punishment, not someone already dead.
  reasoning_layer_used: POB theological decision on הַמֵּת
  rationale: This makes the elliptical legal phrase understandable without calling the person already condemned.
- pob_phrase: two witnesses or three witnesses
  simplified_phrase: two or three witnesses
  preserved_meaning: Execution requires testimony from at least two witnesses.
  reasoning_layer_used: POB lexical decision on שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  rationale: English does not need to repeat “witnesses” after both numbers.
- pob_phrase: he shall not be put to death on the testimony of one witness
  simplified_phrase: No one must be put to death on the testimony of a single witness
  preserved_meaning: One witness is legally insufficient for imposing capital punishment.
  reasoning_layer_used: POB lexical decisions on לֹא יוּמַת and עֵד אֶחָד
  rationale: The recast sentence states the prohibition directly and avoids an unclear pronoun.
