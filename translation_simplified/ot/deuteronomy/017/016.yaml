translation:
  language: en
  text: But he must not acquire many horses for himself. He must not bring the people back to Egypt to acquire more horses, because Yahweh has told you, “You must never go back that way again.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: must not multiply horses for himself
  simplified_phrase: must not acquire many horses for himself
  preserved_meaning: The king may not build up a large supply of horses for his own power.
  reasoning_layer_used: POB lexical decision for יַרְבֶּה לּוֹ סוּסִים
  rationale: The documented alternative “acquire many horses” states the prohibition in ordinary English.
- pob_phrase: nor cause the people to return to Egypt in order to multiply horses
  simplified_phrase: He must not bring the people back to Egypt to acquire more horses
  preserved_meaning: The king may not cause the people to return to Egypt for the purpose of increasing horses.
  reasoning_layer_used: POB lexical decisions for the causative שׁוב and purpose clause
  rationale: “Bring back” keeps the causative meaning while making the sentence easier to follow.
- pob_phrase: You must never return again by this way
  simplified_phrase: You must never go back that way again
  preserved_meaning: Yahweh emphatically forbids another return along the route to Egypt.
  reasoning_layer_used: POB lexical decision for the יסף idiom and בַּדֶּרֶךְ הַזֶּה
  rationale: “Go back that way” expresses the Hebrew route image in natural modern English.
