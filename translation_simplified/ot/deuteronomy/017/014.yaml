translation:
  language: en
  text: When you enter the land Yahweh your God is giving you, and you take possession of it and settle there, you will say, “I will appoint a king over me, like all the nations around me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: come into the land
  simplified_phrase: enter the land
  preserved_meaning: Israel enters the land Yahweh is giving them.
  reasoning_layer_used: Lexical decision for תָבֹא
  rationale: “Enter” is the approved alternative and is more direct in modern English.
- pob_phrase: take possession of it and live in it
  simplified_phrase: take possession of it and settle there
  preserved_meaning: The people will occupy the land and establish their residence there.
  reasoning_layer_used: Lexical decisions for וִירִשְׁתָּהּ and וְיָשַׁבְתָּה בָּהּ
  rationale: “Settle there” clearly describes established residence without awkward repetition.
- pob_phrase: set a king over myself
  simplified_phrase: appoint a king over me
  preserved_meaning: The people will place a king in authority over themselves.
  reasoning_layer_used: Documented lexical alternative for אָשִׂימָה עָלַי מֶלֶךְ
  rationale: “Appoint” naturally expresses placing a king in authority while “over me” preserves his rule.
translation_notes:
  risk_flags:
  - risk: “Appoint” is less concrete than the Hebrew image of setting a king over oneself.
    mitigation: The phrase “over me” preserves the king’s authority over the speaker.
