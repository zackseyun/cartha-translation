translation:
  language: en
  text: so that he does not become proud and consider himself above his brothers.[a] He must not turn away from the commandment, either to the right or to the left, so that he and his sons may reign for many years among Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his fellow Israelites.” The Hebrew says “his brothers,” using the language of covenant family.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: his heart may not be lifted up above his brothers
  simplified_phrase: he does not become proud and consider himself above his brothers
  preserved_meaning: The king must not regard himself as superior to his covenant kin.
  reasoning_layer_used: Lexical and theological decisions on lifted heart and brothers
  rationale: This explains the pride image while retaining elevation above his brothers.
- pob_phrase: he may not turn aside from the commandment to the right or to the left
  simplified_phrase: He must not turn away from the commandment, either to the right or to the left
  preserved_meaning: The king must not depart from the commandment in either direction.
  reasoning_layer_used: Lexical decisions on turn aside, commandment, and right or left
  rationale: A direct sentence makes the command clear while preserving its directional image.
- pob_phrase: in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel
  simplified_phrase: so that he and his sons may reign for many years among Israel
  preserved_meaning: Humble obedience is linked to a long royal tenure for the king and his sons within Israel.
  reasoning_layer_used: Lexical and theological decisions on purpose, royal tenure, sons, and Israel
  rationale: Natural English preserves both the purpose link and the dynastic promise.
