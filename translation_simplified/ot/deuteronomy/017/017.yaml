translation:
  language: en
  text: He must not take many wives for himself, or his heart may turn away.[a] He must not accumulate excessive amounts of silver and gold for himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He must not take many wives for himself, and his heart must not turn away.” The Hebrew may state a separate command rather than a warning about the result.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: shall not multiply wives for himself
  simplified_phrase: must not take many wives for himself
  preserved_meaning: The king is forbidden to acquire an excessive number of wives.
  reasoning_layer_used: Lexical decision for יַרְבֶּה and נָשִׁים
  rationale: “Take many wives” expresses excessive royal marriage in ordinary English.
- pob_phrase: lest his heart turn away
  simplified_phrase: or his heart may turn away
  preserved_meaning: Many wives may divert the king’s inner will and affections.
  reasoning_layer_used: Theological decision on the warning clause
  rationale: The wording keeps the heart image and the likely result without naming an unstated object.
- pob_phrase: shall not greatly multiply silver and gold for himself
  simplified_phrase: must not accumulate excessive amounts of silver and gold for himself
  preserved_meaning: The king is forbidden to amass silver and gold in excess.
  reasoning_layer_used: Lexical decisions for יַרְבֶּה, כֶּסֶף וְזָהָב, and מְאֹד
  rationale: “Accumulate excessive amounts” makes the prohibition clear while retaining the concrete metals.
translation_notes:
  risk_flags:
  - risk: The Hebrew may make the heart clause a separate prohibition rather than a result.
    mitigation: Footnote a preserves the coordinate reading.
