translation:
  language: en
  text: He must keep it with him and read it[a] throughout his life. In this way he will learn to fear Yahweh his God[b], to follow every word of this law and these statutes, and to put them into practice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “read from it.” The Hebrew literally says “read in it.”
    reason: lexical_alternative
  - marker: b
    text: Or “to revere Yahweh his God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be with him
  simplified_phrase: He must keep it with him
  preserved_meaning: The king is to maintain continual possession of and access to the copy of the law.
  reasoning_layer_used: POB lexical decision for וְהָיְתָה עִמּוֹ and immediate context
  rationale: The active wording makes the continuing duty clear without repeating the previous verse’s noun.
- pob_phrase: and he shall read in it all the days of his life
  simplified_phrase: and read it throughout his life
  preserved_meaning: He is to read the written copy continually for his entire life.
  reasoning_layer_used: POB lexical decisions for וְקָרָא בוֹ and כָּל יְמֵי חַיָּיו
  rationale: The smoother English keeps the lifelong scope while the footnote preserves the Hebrew construction.
- pob_phrase: to keep all the words of this law and these statutes, to do them
  simplified_phrase: to follow every word of this law and these statutes, and to put them into practice
  preserved_meaning: He must observe the whole law and actively carry out its requirements.
  reasoning_layer_used: POB lexical decisions for לִשְׁמֹר and לַעֲשֹׂתָם
  rationale: Common verbs clarify both faithful observance and actual obedience without collapsing them.
translation_notes:
