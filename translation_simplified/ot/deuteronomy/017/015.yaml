translation:
  language: en
  text: You must appoint as king over you the man Yahweh your God chooses. You must appoint the king from among your brothers.[a] You must not appoint a foreign man—someone who is not your brother.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” means fellow members of Israel—people from among your own nation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall surely set over yourself
  simplified_phrase: You must appoint as king over you
  preserved_meaning: The wording keeps the emphatic command that Israel must place a king in authority over itself.
  reasoning_layer_used: Lexical decision for שׂוֹם תָּשִׂים and עָלֶיךָ
  rationale: “Must appoint” expresses the legal force more naturally than “shall surely set.”
- pob_phrase: From among your brothers you shall set a king over yourself
  simplified_phrase: You must appoint the king from among your brothers
  preserved_meaning: The king must come from within Israel, expressed through the source text’s kinship language.
  reasoning_layer_used: Lexical and theological decisions for מִקֶּרֶב אַחֶיךָ
  rationale: The sentence uses ordinary word order while retaining “brothers” and its covenant meaning.
- pob_phrase: you may not put over yourself a foreigner, one who is not your brother
  simplified_phrase: You must not appoint a foreign man—someone who is not your brother
  preserved_meaning: Israel is forbidden to appoint a non-Israelite man as king.
  reasoning_layer_used: Lexical decisions for לֹא תוּכַל לָתֵת, אִישׁ נָכְרִי, and אֲשֶׁר לֹא אָחִיךָ הוּא
  rationale: “Must not appoint” states the prohibition clearly, while the dash preserves the explanatory kinship clause.
