  simplified_phrase: acts in deliberate defiance by refusing to obey
  preserved_meaning: The offense is a willful rejection of lawful authority, not an accidental failure.
  reasoning_layer_used: POB lexical decisions and footnotes a–b
  rationale: The clearer wording directly expresses the deliberate, defiant force documented by POB.
- pob_phrase: the priest who stands there to minister before Yahweh your God
  simplified_phrase: the priest who serves there before Yahweh your God
  preserved_meaning: The priest carries out his official sanctuary service in Yahweh’s presence.
  reasoning_layer_used: POB lexical decision for הָעֹמֵד לְשָׁרֶת שָׁם
  rationale: “Serves there” makes the priest’s official role clear without losing the location or sacred setting.
- pob_phrase: that man shall die. So you shall purge the evil from Israel
  simplified_phrase: must die. In this way, you must purge the evil from Israel
  preserved_meaning: Death is the required legal penalty by which evil is purged from the covenant community.
  reasoning_layer_used: POB lexical decisions for וּמֵת and וּבִעַרְתָּ
  rationale: “Must” states the legal requirement plainly while retaining the covenant formula “purge the evil.”
