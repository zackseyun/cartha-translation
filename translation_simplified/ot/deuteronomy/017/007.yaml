translation:
  language: en
  text: The witnesses must be the first to put him to death. After that, all the people must take part in putting him to death.[a] In this way, you must remove the evil from your community.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew speaks of “the hand” of the witnesses and of all the people, a legal expression for their responsibility in carrying out the sentence.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The hand of the witnesses shall be first against him to put him to death
  simplified_phrase: The witnesses must be the first to put him to death
  preserved_meaning: The legal witnesses must begin carrying out the death sentence.
  reasoning_layer_used: POB lexical decisions for יַד, הָעֵדִים, בּוֹ, בָרִאשֹׁנָה, and לַהֲמִיתוֹ
  rationale: This explains the legal hand idiom while preserving the witnesses’ first responsibility.
- pob_phrase: and afterward the hand of all the people
  simplified_phrase: After that, all the people must take part in putting him to death
  preserved_meaning: The wider covenant community joins in carrying out the death sentence after the witnesses begin.
  reasoning_layer_used: POB lexical decisions for וְיַד כָּל הָעָם and בָּאַחֲרֹנָה, with the POB cultural note
  rationale: Naming the action prevents the people’s required role from sounding vague.
- pob_phrase: purge the evil from your midst
  simplified_phrase: remove the evil from your community
  preserved_meaning: Just judgment removes evil as a corrupting presence from the covenant community.
  reasoning_layer_used: POB lexical and theological decisions for וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  rationale: Common wording preserves the judicial-community meaning without narrowing evil to the offender.
