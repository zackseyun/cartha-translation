translation:
  language: en
  text: If a disputed case in your town court is too difficult for you to decide—whether it concerns one case of bloodshed or another, one legal claim or another, or one kind of injury or another[a]—you must set out and go up to the place Yahweh your God will choose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also refer to different kinds of affliction or plague.
    reason: lexical_alternative
