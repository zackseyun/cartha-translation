translation:
  language: en
  text: and goes and serves other gods, bowing down to them or to the sun, the moon, or the whole array of heaven[a]—which I have not commanded.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The traditional phrase is “the whole host of heaven.” It can mean the array of heavenly bodies and may also suggest heavenly beings.
    reason: lexical_alternative
  - marker: b
    text: “Which I have not commanded” may refer specifically to the array of heaven or more broadly to all the worship just described.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: goes and serves other gods and bows down to them
  simplified_phrase: goes and serves other gods, bowing down to them
  preserved_meaning: The person both serves other gods and physically bows before them.
  reasoning_layer_used: POB lexical decisions for וַיֵּלֶךְ, וַיַּעֲבֹד, and וַיִּשְׁתַּחוּ
  rationale: The recast clause reads naturally while keeping service and bowing distinct.
- pob_phrase: all the host of heaven
  simplified_phrase: the whole array of heaven
  preserved_meaning: The phrase refers collectively to what is in heaven without deciding whether only heavenly bodies are meant.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: “Array” is clearer for modern readers, while the note preserves the phrase’s possible range.
- pob_phrase: or to the sun or to the moon or to all
  simplified_phrase: or to the sun, the moon, or the whole
  preserved_meaning: The sun, moon, and heavenly array remain separate possible objects of worship.
  reasoning_layer_used: POB lexical decision for the disjunctive list
  rationale: A standard English list removes repetition without merging the distinct objects.
