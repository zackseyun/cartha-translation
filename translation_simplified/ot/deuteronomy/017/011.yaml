translation:
  language: en
  text: You must follow the instruction they give you and carry out the judgment they announce. Do not turn aside from the ruling they declare to you, either to the right or to the left.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the word,” which here may also mean “the matter” or “the ruling.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: According to the instruction that they give you ... you shall do
  simplified_phrase: You must follow the instruction they give you
  preserved_meaning: Their authoritative instruction must be obeyed.
  reasoning_layer_used: Lexical decision for torah and the obligation expressed by the verb
  rationale: The direct command is clearer while preserving “instruction” rather than narrowing it to codified law.
- pob_phrase: according to the judgment that they tell you, you shall do
  simplified_phrase: carry out the judgment they announce
  preserved_meaning: The judicial decision in the case must be put into effect.
  reasoning_layer_used: Lexical decision for mishpat and theological scope decision
  rationale: “Carry out” states the required action naturally without implying authority beyond the ruling at hand.
- pob_phrase: you shall not turn aside from the word that they declare to you, to the right or to the left
  simplified_phrase: Do not turn aside from the ruling they declare to you, either to the right or to the left
  preserved_meaning: They must not deviate in any direction from the authoritative pronouncement.
  reasoning_layer_used: Lexical decisions for dabar, declare, and the directional idiom
  rationale: “Ruling” clarifies the legal sense while retaining the source-language image of turning right or left.
translation_notes:
  risk_flags:
  - risk: “Ruling” selects the contextual legal sense of the broader Hebrew word dabar.
    mitigation: The footnote preserves the literal “word” and the alternative “matter.”
  - risk: The verse could be misread as granting unlimited authority to later institutions.
    mitigation: The wording limits obedience to the instruction and judgment being declared in this case.
