translation:
  language: en
  text: He will set you high above all the nations he has made. As a result, you will be praised, have a renowned name, and display beauty.[a] You will be a holy people belonging to the LORD your God, just as he has spoken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “beauty” can also mean “splendor” or “glory.”
    reason: lexical_alternative
  - marker: b
    text: Or “just as he promised”; the Hebrew literally says “just as he has spoken.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and to set you high above all the nations that he has made
  simplified_phrase: He will set you high above all the nations he has made.
  preserved_meaning: The LORD will elevate Israel above the other nations he made.
  reasoning_layer_used: POB lexical decisions and immediate covenant context
  rationale: The dependent infinitive becomes a direct sentence while retaining the image of elevated placement.
- pob_phrase: for praise and for name and for beauty
  simplified_phrase: As a result, you will be praised, have a renowned name, and display beauty.
  preserved_meaning: Israel’s elevation results in praise, reputation, and beauty or splendor.
  reasoning_layer_used: POB lexical decisions, footnotes, and grounding review
  rationale: The result is stated clearly without presenting the three qualities as items God directly gives.
- pob_phrase: and for you to be a holy people to the LORD your God
  simplified_phrase: You will be a holy people belonging to the LORD your God
  preserved_meaning: Israel is set apart as the LORD’s own people.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence clarifies holiness and the phrase’s relational force.
interpretive_expansions:
