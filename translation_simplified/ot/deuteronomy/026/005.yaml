translation:
  language: en
  text: Then you must respond by saying before Yahweh your God, “My father was a wandering Aramean.[a] He went down to Egypt and lived there as a foreigner. His family was only a small group, but there his descendants became a great and powerful nation with many people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “My father was a perishing Aramean.” The Hebrew can mean either “wandering” or “perishing.”
    reason: alternative_reading
