simplification_decisions:
- pob_phrase: some of the firstfruits of all the fruit of the ground
  simplified_phrase: some of the first produce from all the produce of the ground
  preserved_meaning: The offering comes from the first portion of the full range of agricultural produce.
  reasoning_layer_used: lexical decisions for מֵרֵאשִׁית and כָּל פְּרִי הָאֲדָמָה
  rationale: “Produce” makes clear that the command includes more than orchard fruit.
- pob_phrase: that you bring in from your land
  simplified_phrase: that you bring in from your land
  preserved_meaning: The wording retains the broad motion of bringing produce in rather than specifying harvesting.
  reasoning_layer_used: lexical decision for אֲשֶׁר תָּבִיא מֵאַרְצְךָ and grounding review
  rationale: Retaining “bring in” avoids narrowing the Hebrew to gathering or harvesting.
- pob_phrase: and put it in a basket, and go to the place
  simplified_phrase: Put it in a basket. Then go to the place
  preserved_meaning: The two commands remain distinct and sequential.
  reasoning_layer_used: lexical decisions for וְשַׂמְתָּ and וְהָלַכְתָּ
  rationale: Short sentences make the required sequence easier to follow.
