translation:
  language: en
  text: I did not eat any of it while I was mourning. I did not remove[a] any of it while I was ritually unclean, and I did not give any of it for the dead.[b] I obeyed what Yahweh my God said. I did everything you commanded me.
  philosophy: optimal-equivalence
