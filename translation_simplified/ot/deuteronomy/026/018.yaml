simplification_decisions:
- pob_phrase: And Yahweh has declared today that you are to be his treasured people
  simplified_phrase: Today Yahweh has declared you to be his treasured people
  preserved_meaning: Yahweh formally declares Israel’s treasured covenant status in the present moment.
  reasoning_layer_used: Lexical and theological decisions on הֶאֱמִירְךָ, הַיּוֹם, and לְעַם סְגֻלָּה.
  rationale: Moving “today” forward and shortening the clause makes the declaration easier to grasp without weakening its covenant force.
- pob_phrase: and that you are to keep all his commandments
  simplified_phrase: You are to keep all his commandments.
  preserved_meaning: Israel remains obligated to obey every command Yahweh has given.
  reasoning_layer_used: Lexical decisions on וְלִשְׁמֹר and כָּל מִצְוֺתָיו.
  rationale: A separate sentence makes the obligation clear while preserving it as a distinct part of the declaration.
translation_notes:
