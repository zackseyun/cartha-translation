translation:
  language: en
  text: In the third year—the year of the tithe—when you have finished setting aside the full tithe from all your produce, give it to the Levite, the foreigner living among you, the fatherless, and the widow. They will eat in your towns[a] and have enough.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “within your gates.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: finished tithing all the tithe of your produce
  simplified_phrase: finished setting aside the full tithe from all your produce
  preserved_meaning: The entire required tenth of the agricultural produce is set apart.
  reasoning_layer_used: Lexical decisions for לַעְשֵׂר, מַעְשַׂר, and תְּבוּאָתְךָ
  rationale: This removes the awkward repetition while retaining the tithe as a specific portion.
- pob_phrase: the sojourner
  simplified_phrase: the foreigner living among you
  preserved_meaning: The beneficiary is a non-native resident within Israel’s community.
  reasoning_layer_used: Lexical decision for לַגֵּר and the theological decision on named vulnerable groups
  rationale: This explains an unfamiliar term without replacing the concrete social category.
- pob_phrase: within your gates and be satisfied
