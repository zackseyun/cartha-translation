  text: When you enter the land that Yahweh your God is giving you as your inheritance, and when you have taken possession of it and are living there,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: come into the land
  simplified_phrase: enter the land
  preserved_meaning: Israel goes into the land rather than merely approaching it.
  reasoning_layer_used: Lexical decisions for תָבֹוא and אֶל הָאָרֶץ
  rationale: “Enter” expresses movement into the land directly.
- pob_phrase: giving you as an inheritance
  simplified_phrase: giving you as your inheritance
  preserved_meaning: The land remains Yahweh’s covenant gift and Israel’s allotted inheritance.
  reasoning_layer_used: Lexical decision for נַחֲלָה and theological decision on the land gift
  rationale: “Your” clarifies whose inheritance the land will be.
- pob_phrase: and you take possession of it and live in it
  simplified_phrase: and when you have taken possession of it and are living there
  preserved_meaning: Taking possession and living in the land remain future circumstances, not new commands.
  reasoning_layer_used: Theological decision preserving the Hebrew sequence under the temporal introduction
  rationale: Repeating “when” prevents the two actions from sounding imperative.
translation_notes:
