translation:
  language: en
  text: She will even be hostile toward her afterbirth that comes out from between her legs[a] and toward the children she gives birth to, because she will secretly eat them when she has nothing at all. This will happen during the siege and distress your enemy inflicts on you inside your towns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “placenta.” The Hebrew word refers to the afterbirth from childbirth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and toward her afterbirth ... and toward her children
  simplified_phrase: She will even be hostile toward her afterbirth ... and toward the children
  preserved_meaning: Her hostile disposition extends to both the afterbirth and her own children.
  reasoning_layer_used: POB syntax and immediate context
  rationale: The fragmentary construction becomes a complete sentence while retaining the repeated direction of her hostility.
- pob_phrase: in the lack of everything
  simplified_phrase: when she has nothing at all
  preserved_meaning: The siege has reduced her to total deprivation.
  reasoning_layer_used: POB lexical decision for בְּחֹסֶר כֹּל
  rationale: Common wording conveys complete scarcity directly.
- pob_phrase: within your gates
  simplified_phrase: inside your towns
  preserved_meaning: The enemy oppresses the people within their besieged communities.
  reasoning_layer_used: POB cultural footnote and lexical rationale
  rationale: “Towns” communicates the idiom without suggesting only the gate structure.
interpretive_expansions:
- pob_phrase: and toward
  rendering: be hostile toward
  claim: The construction describes a hostile or begrudging disposition toward the afterbirth and children.
  evidence:
  - The repeated “toward” construction governs both objects.
  - The following clause says she will secretly eat them.
  confidence: high
  alternatives_preserved:
  - begrudge
  - look with hostility toward
translation_notes:
  risk_flags:
  - risk: The graphic childbirth image and cannibalism may disturb readers.
    mitigation: Both remain direct because they are central to the curse’s force.
  - risk: “Be hostile toward” makes the contextual attitude explicit.
    mitigation: The wording avoids implying a separate act of betrayal and records the expansion.
