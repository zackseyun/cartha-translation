translation:
  language: en
  text: Yahweh will make you very prosperous. He will give you an abundance of the fruit of your womb, the fruit of your livestock, and the fruit of your soil[a], in the land he swore to your ancestors that he would give you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated image of “fruit” refers to children, young livestock, and crops.
    reason: simplification_note
simplification_decisions:
- pob_phrase: make you abound in prosperity
  simplified_phrase: make you very prosperous
  preserved_meaning: Yahweh causes his people to enjoy beneficial abundance.
  reasoning_layer_used: lexical decision for וְהוֹתִרְךָ לְטוֹבָה
  rationale: The simpler verb phrase preserves both divine causation and material well-being.
- pob_phrase: in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground
  simplified_phrase: an abundance of the fruit of your womb, the fruit of your livestock, and the fruit of your soil
  preserved_meaning: The blessing includes human, animal, and agricultural fruitfulness.
  reasoning_layer_used: lexical and theological decisions on the threefold fruit image
  rationale: The repeated image remains intact, while “soil” makes cultivated ground easier to understand.
- pob_phrase: on the land that Yahweh swore to your fathers to give you
  simplified_phrase: in the land he swore to your ancestors that he would give you
  preserved_meaning: The blessings will occur in the land promised by oath to the present generation through its forefathers.
  reasoning_layer_used: lexical decision for the ancestral oath clause
  rationale: Ordinary clause order and “ancestors” clarify the relationship without changing the promise.
