translation:
  language: en
  text: Then all the peoples of the earth will see that you bear Yahweh’s name, showing that you belong to him.[a] They will fear you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “that you are called by Yahweh’s name.” The Hebrew pictures Yahweh’s name as being called upon or over Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the name of Yahweh is called upon you
  simplified_phrase: you bear Yahweh’s name
  preserved_meaning: Israel is publicly identified by Yahweh’s name as belonging to him.
  reasoning_layer_used: The lexical and theological decisions identify covenant belonging while retaining the naming image.
  rationale: “Bear Yahweh’s name” communicates lasting public identification rather than a one-time utterance.
- pob_phrase: and they will fear you
  simplified_phrase: They will fear you.
  preserved_meaning: The peoples will respond to Israel with fear because Yahweh’s favor and authority are evident.
  reasoning_layer_used: The lexical decision preserves the broad force of reverential dread.
  rationale: A separate sentence improves clarity without narrowing the meaning of “fear.”
interpretive_expansions:
- pob_phrase: the name of Yahweh is called upon you
  rendering: showing that you belong to him
  claim: The idiom publicly identifies Israel as Yahweh’s people.
  evidence:
  - The lexical rationale says the idiom marks belonging or identification.
  - The theological rationale says Israel is publicly marked as belonging to Yahweh.
  confidence: high
  alternatives_preserved:
  - you are called by Yahweh’s name
  - Yahweh’s name is proclaimed over you
translation_notes:
  risk_flags:
  - risk: “Bear Yahweh’s name” interprets rather than literally reproduces the Hebrew passive idiom.
    mitigation: The footnote preserves the more literal image and an accepted alternative.
