translation:
  language: en
  text: Do not turn away from anything I am commanding you today. Do not stray to the right or the left, going after other gods and serving them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worshiping them.” Here, serving other gods means giving them religious allegiance and worship.
    reason: lexical_alternative
