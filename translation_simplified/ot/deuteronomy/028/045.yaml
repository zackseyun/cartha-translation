translation:
  language: en
  text: All these curses will come upon you. They will pursue you and overtake you until you are destroyed. This will happen because you did not listen to the voice of Yahweh your God—that is, you did not keep the commandments and statutes he commanded you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And all these curses will come upon you and pursue you and overtake you, until you are destroyed
  simplified_phrase: All these curses will come upon you. They will pursue you and overtake you until you are destroyed.
  preserved_meaning: The curses are pictured as pursuing and catching the people until they are destroyed.
  reasoning_layer_used: POB lexical decisions for וּבָאוּ, וּרְדָפוּךָ, וְהִשִּׂיגוּךָ, and עַד הִשָּׁמְדָךְ
  rationale: Dividing the warning into two sentences clarifies its escalating pursuit image.
- pob_phrase: because
  simplified_phrase: This will happen because
  preserved_meaning: Failure to listen is the stated reason for the judgment.
  reasoning_layer_used: Immediate syntax and POB rendering of כִּי
  rationale: The explicit subject clearly connects the reason to the preceding warning.
- pob_phrase: to keep his commandments and his statutes that he commanded you
  simplified_phrase: that is, you did not keep the commandments and statutes he commanded you
  preserved_meaning: Listening to Yahweh requires obeying both kinds of requirements that he directly commanded.
  reasoning_layer_used: POB theological decision on שָׁמַע בְּקוֹל and lexical decisions for מִצְוֺתָיו, חֻקֹּתָיו, and אֲשֶׁר צִוָּךְ
  rationale: The explanatory clause makes the link to obedience natural while retaining Yahweh’s direct command.
interpretive_expansions:
- pob_phrase: did not listen to the voice of Yahweh your God, to keep
  rendering: did not listen to the voice of Yahweh your God—that is, you did not keep
  claim: Listening to Yahweh’s voice here means responding obediently by keeping his requirements.
  evidence:
  - The Hebrew idiom שׁמע בקול commonly carries the sense of obeying.
  - The following infinitive identifies keeping the requirements as the practical content of listening.
  - The POB theological rationale explicitly preserves both the auditory image and its obedient sense.
  confidence: high
  alternatives_preserved:
  - did not listen to the voice ... by keeping
  - did not obey
translation_notes:
  risk_flags:
  - risk: “That is” states the link between listening and obedience more explicitly than the POB wording.
    mitigation: The immediate clause and POB reasoning directly identify keeping the commands as the content of listening.
  - risk: “Commandments” and “statutes” may sound formal to some readers.
    mitigation: Both terms remain because they preserve the verse’s distinct covenant-law categories.
