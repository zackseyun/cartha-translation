translation:
  language: en
  text: Yahweh will establish you as his own holy people, just as he swore to you. He will do this if[a] you obey the commandments of Yahweh your God and walk in his ways.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because you obey the commandments of Yahweh your God and walk in his ways.” The Hebrew can express cause, but the context favors “if.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will establish you for himself as a holy people
  simplified_phrase: will establish you as his own holy people
  preserved_meaning: Yahweh gives Israel the covenant status of a holy people who belong to him.
  reasoning_layer_used: Lexical decisions for יְקִימְךָ, לּוֹ, and לְעַם קָדוֹשׁ
  rationale: “His own” makes Israel’s belonging to Yahweh clear while “establish” preserves the covenantal sense.
- pob_phrase: just as he swore to you
  simplified_phrase: just as he swore to you
  preserved_meaning: Yahweh’s promise rests on his earlier oath to Israel.
  reasoning_layer_used: Lexical decision for כַּאֲשֶׁר נִשְׁבַּע לָךְ
  rationale: The relational object “to you” is retained because it is explicit in the Hebrew.
- pob_phrase: if you keep the commandments
  simplified_phrase: He will do this if you obey the commandments
  preserved_meaning: Israel’s establishment is presented as conditional upon covenant obedience.
  reasoning_layer_used: Theological decision on the conditional blessing clause
  rationale: A new sentence clarifies the condition, and “obey” explains what keeping commandments means here.
translation_notes:
  risk_flags:
  - risk: “Establish” may remain somewhat formal for common readers.
    mitigation: “As his own holy people” immediately clarifies the covenant status being established.
  - risk: The Hebrew conjunction may be causal rather than conditional.
    mitigation: The main text follows the contextually favored “if,” and the footnote gives the complete causal alternative.
