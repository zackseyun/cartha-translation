translation:
  language: en
  text: Yahweh will also bring on you every sickness and every affliction[a] not recorded in this book of the law, until you are destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “plague”; the Hebrew word can refer to a blow, plague, or other striking calamity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that is not written in the book of this law
  simplified_phrase: not recorded in this book of the law
  preserved_meaning: These judgments include those not named in the covenant document.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר לֹא כָתוּב בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  rationale: “Not recorded” is clearer modern English, while “this book of the law” preserves the demonstrative and document sense.
- pob_phrase: Yahweh will bring upon you
  simplified_phrase: Yahweh will also bring on you
  preserved_meaning: Yahweh imposes these additional judgments on the people.
  reasoning_layer_used: POB lexical and theological decisions for גַּם, יַעְלֵם, יְהוָה, and עָלֶיךָ
  rationale: The reordered clause uses ordinary English while retaining Yahweh’s agency and the additive force of “also.”
translation_notes:
  risk_flags:
  - risk: “This book of the law” shifts the POB phrase “the book of this law.”
    mitigation: It preserves the demonstrative and covenant-document meaning in more natural English.
