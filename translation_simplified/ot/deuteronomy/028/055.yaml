translation:
  language: en
  text: He will refuse to share with any of them the flesh of his sons that he is eating, because he has nothing left. This will happen when your enemy besieges every one of your towns and causes you terrible distress.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “within all your gates,” using the gates to refer to the towns where the people live.
    reason: cultural_note
simplification_decisions:
- pob_phrase: so that he will not give to any of them any of the flesh
  simplified_phrase: He will refuse to share with any of them the flesh
  preserved_meaning: He withholds the flesh from every family member mentioned in the preceding context.
  reasoning_layer_used: POB lexical decisions for מִתֵּת and לְאַחַד מֵהֶם
  rationale: “Refuse to share” states the withholding naturally while preserving its force.
- pob_phrase: in the siege and in the distress with which your enemy will oppress you
  simplified_phrase: when your enemy besieges ... and causes you terrible distress
  preserved_meaning: The enemy subjects the people to both siege and severe hardship.
  reasoning_layer_used: POB lexical decisions for בְּמָצוֹר, וּבְמָצוֹק, and יָצִיק
  rationale: The verbal form makes the enemy’s hostile action easier to follow.
- pob_phrase: within all your gates
  simplified_phrase: every one of your towns
  preserved_meaning: The suffering reaches all the people’s inhabited settlements.
  reasoning_layer_used: POB lexical alternative and cultural note for בְּכָל שְׁעָרֶיךָ
  rationale: “Towns” communicates the Hebrew metonym clearly, while the footnote preserves the gate image.
