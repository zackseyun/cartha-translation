translation:
  language: en
  text: Yahweh will hand you over to your enemies, and they will defeat you. You will march out against them on one road, but you will flee from them on seven roads. You will become an object of horror[a] to every kingdom on earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a horror” or “a terror.” The Hebrew can describe something that causes horror or dread.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will give you over as defeated before your enemies
  simplified_phrase: will hand you over to your enemies, and they will defeat you
  preserved_meaning: Yahweh gives Israel over to military defeat by its enemies.
  reasoning_layer_used: Lexical decisions for יִתֶּנְךָ and נִגָּף.
  rationale: The action and its result are stated separately in ordinary English.
- pob_phrase: go out against them by one way ... by seven ways you will flee
  simplified_phrase: march out against them on one road ... flee from them on seven roads
  preserved_meaning: A united military advance ends in a scattered retreat.
  reasoning_layer_used: Lexical decisions for דרך, יצא, and נוס.
  rationale: “March” clarifies the battle setting while preserving the one-road and seven-road image.
- pob_phrase: become a horror to all the kingdoms of the earth
  simplified_phrase: become an object of horror to every kingdom on earth
  preserved_meaning: Israel will become a cause of horror or dread among kingdoms throughout the earth.
  reasoning_layer_used: Lexical and theological decisions for זַעֲוָה.
  rationale: “An object of horror” preserves the broad public-dread sense without limiting it to a visual sight.
translation_notes:
  risk_flags:
  - risk: Readers may understand the seven roads as only a literal count rather than complete scattering.
    mitigation: The concrete contrast is retained because the POB intentionally leaves its idiomatic force implicit.
