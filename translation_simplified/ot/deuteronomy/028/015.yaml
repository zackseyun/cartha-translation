translation:
  language: en
  text: But if you do not listen to Yahweh your God[a] by following all his commandments and laws[b] that I am commanding you today, then all these curses will come upon you and overtake you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, listening to Yahweh includes obeying him.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “laws” is often rendered “statutes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: listen to the voice of Yahweh your God
  simplified_phrase: listen to Yahweh your God
  preserved_meaning: Listening means receiving Yahweh’s words with obedient attention.
  reasoning_layer_used: POB lexical and theological decisions on obedient hearing
  rationale: Removing “the voice of” makes the idiom natural while the footnote preserves its obedient sense.
- pob_phrase: to keep and to do all his commandments and his statutes
  simplified_phrase: by following all his commandments and laws
  preserved_meaning: Following the commands explains how obedient listening is put into action, while both legal categories remain.
  reasoning_layer_used: POB lexical decisions on the paired infinitives and statutes
  rationale: “By following” clearly links listening with active obedience in common English.
- pob_phrase: that I am commanding you today
  simplified_phrase: that I am commanding you today
  preserved_meaning: Moses is authoritatively issuing these requirements at that moment.
  reasoning_layer_used: POB lexical decision on the command verb and its present force
  rationale: The explicit command language remains because “giving” would weaken the source’s force.
