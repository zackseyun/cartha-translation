translation:
  language: en
  text: You will become something horrifying—a proverb and a taunt—among all the peoples where Yahweh drives you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “something that astonishes people.” The Hebrew describes something so appalling that it causes horror or astonishment. The verb translated “drives” can also mean “leads,” but “drives” expresses the forced exile in this curse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an object of horror
  simplified_phrase: something horrifying
  preserved_meaning: Israel will become something so appalling that people react with horror or astonishment.
  reasoning_layer_used: POB lexical decision for לְשַׁמָּה
  rationale: This common wording avoids wrongly limiting the reaction to something people see.
- pob_phrase: an object of horror, a proverb, and a taunt among all the peoples
  simplified_phrase: something horrifying—a proverb and a taunt—among all the peoples
  preserved_meaning: All three results describe what Israel will become among the peoples.
  reasoning_layer_used: Hebrew coordination and POB clause structure
  rationale: Keeping the three descriptions together preserves the shared scope of “among all the peoples.”
- pob_phrase: where Yahweh will drive you
  simplified_phrase: where Yahweh drives you
  preserved_meaning: Yahweh will forcibly remove Israel into exile among other peoples.
  reasoning_layer_used: POB lexical and theological decisions for יְנַהֶגְךָ and יְהוָה
  rationale: The shorter English future construction remains clear and preserves both forced exile and the divine name.
translation_notes:
  risk_flags:
  - risk: Modern readers may not immediately understand becoming “a proverb.”
    mitigation: Its pairing with “a taunt” makes clear that Israel's fate will become a subject of public derision.
