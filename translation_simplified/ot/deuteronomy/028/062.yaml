translation:
  language: en
  text: Only a few of you will be left, even though you had become as numerous as the stars in the sky, because you did not listen to the voice of Yahweh your God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “listen to the voice” also carries the sense of obeying.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you will be left few in number
  simplified_phrase: Only a few of you will be left
  preserved_meaning: The people will be reduced to a very small remnant after judgment.
  reasoning_layer_used: Lexical decision for וְנִשְׁאַרְתֶּם and בִּמְתֵי מְעָט
  rationale: This natural word order preserves both the resulting remnant and its numerical smallness.
- pob_phrase: though you had become as numerous as the stars of the heavens
  simplified_phrase: even though you had become as numerous as the stars in the sky
  preserved_meaning: Israel’s former great number is contrasted with the few who will remain.
  reasoning_layer_used: Lexical decisions for תַּחַת אֲשֶׁר, הֱיִיתֶם, and כְּכוֹכְבֵי הַשָּׁמַיִם
  rationale: “Even though” sharpens the contrast, while “stars in the sky” keeps the covenant image in common English.
- pob_phrase: because you did not listen to the voice of Yahweh your God
  simplified_phrase: because you did not listen to the voice of Yahweh your God
  preserved_meaning: The judgment follows Israel’s failure to heed Yahweh in the covenant relationship.
  reasoning_layer_used: Lexical and theological decisions for שׁמע בְּקוֹל and יְהוָה
  rationale: The wording is retained because it preserves both the voice image and Yahweh’s personal covenant name.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “listen” as hearing without obeying.
    mitigation: The footnote states the covenant expression’s implication of obedience.
