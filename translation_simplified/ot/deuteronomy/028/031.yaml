translation:
  language: en
  text: Your ox will be slaughtered right in front of you, but you will not eat any of it. Your donkey will be seized right in front of you and never returned. Your flock will be handed over to your enemies, and no one will save you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: before your eyes
  simplified_phrase: right in front of you
  preserved_meaning: The slaughter happens openly in the owner's presence, intensifying the humiliation.
  reasoning_layer_used: POB lexical decision for לְעֵינֶיךָ
  rationale: The common expression keeps the source image while making it immediately clear.
- pob_phrase: seized from before you and will not be returned to you
  simplified_phrase: seized right in front of you and never returned
  preserved_meaning: The donkey is forcibly taken in the owner's presence and is not restored.
  reasoning_layer_used: POB lexical decisions for גָּזוּל, מִלְּפָנֶיךָ, and יָשׁוּב לָךְ
  rationale: The shorter wording removes an awkward phrase without weakening the violent dispossession.
- pob_phrase: will be given to your enemies
  simplified_phrase: will be handed over to your enemies
  preserved_meaning: The flock passes helplessly into enemy control.
  reasoning_layer_used: POB lexical decisions for נְתֻנוֹת and לְאֹיְבֶיךָ
  rationale: “Handed over” expresses the ominous transfer more naturally in modern English.
translation_notes:
  risk_flags:
  - risk: “Never returned” is slightly more emphatic than the formally future phrase “will not be returned.”
    mitigation: In this curse statement, it naturally conveys the same permanent loss without adding a new event.
