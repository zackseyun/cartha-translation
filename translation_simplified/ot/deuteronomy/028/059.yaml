translation:
  language: en
  text: Then Yahweh will bring extraordinary plagues on you and your descendants—great plagues that will last—and severe, lasting sicknesses.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: make your plagues and the plagues of your offspring extraordinary
  simplified_phrase: bring extraordinary plagues on you and your descendants
  preserved_meaning: Yahweh will inflict exceptionally severe covenant judgments on both the people and their descendants.
  reasoning_layer_used: Lexical decisions for פלא, מכה, and זרע, together with the covenant-curse context.
  rationale: The active wording is easier to follow while preserving the judgment's source, targets, and exceptional force.
- pob_phrase: great and lasting plagues
  simplified_phrase: great plagues that will last
  preserved_meaning: The plagues will be great in magnitude and persistent in duration.
  reasoning_layer_used: The lexical decision for נֶאֱמָנוֹת as lasting.
  rationale: Turning the stacked adjectives into a short clause makes the duration immediately clear.
- pob_phrase: offspring
  simplified_phrase: descendants
  preserved_meaning: The collective term refers to later generations descended from the hearers.
  reasoning_layer_used: The lexical decision for זַרְעֶךָ, which lists descendants as an acceptable equivalent.
  rationale: Descendants is more direct for modern readers in this multigenerational warning.
translation_notes:
  risk_flags:
  - risk: “Bring” is less formally close to the Hebrew expression “make extraordinary.”
    mitigation: The word “extraordinary” remains and still describes the exceptional severity of Yahweh's plagues.
