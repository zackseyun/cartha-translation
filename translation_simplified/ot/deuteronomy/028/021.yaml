translation:
  language: en
  text: Yahweh will bring a plague[a] on you that will not go away until he has wiped you out[b] from the land you are about to enter and take as your own.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pestilence,” meaning a deadly epidemic disease sent as judgment.
    reason: lexical_alternative
  - marker: b
    text: Or “until it has wiped you out,” with the plague as the subject.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make the plague cling to you
  simplified_phrase: bring a plague on you that will not go away
  preserved_meaning: Yahweh causes a deadly affliction to fasten itself to the people and remain.
  reasoning_layer_used: Lexical decision for יַדְבֵּק and theological decision for הַדָּבֶר.
  rationale: This explains the clinging image in natural English while preserving the plague’s persistence.
- pob_phrase: wiped you out from the land
  simplified_phrase: wiped you out from the land
  preserved_meaning: Yahweh destroys the people and removes them from the land.
  reasoning_layer_used: Lexical decisions for עַד כַּלֹּתוֹ אֹתְךָ and מֵעַל הָאֲדָמָה.
  rationale: Keeping “from the land” avoids the misleading implication that the land itself is emptied.
- pob_phrase: the land that you are entering to possess
  simplified_phrase: the land you are about to enter and take as your own
  preserved_meaning: The people will soon enter the land and take possession of it.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר אַתָּה בָא שָׁמָּה and לְרִשְׁתָּהּ.
  rationale: This makes imminent entry and possession clear to a new reader.
translation_notes:
  risk_flags:
  - risk: “Will not go away” replaces the concrete image of the plague clinging.
    mitigation: The wording preserves the image’s force by presenting the plague as persistently attached.
  - risk: The main text makes Yahweh the subject of “wiped you out.”
    mitigation: Footnote b preserves the documented alternative in which the plague is the subject.
