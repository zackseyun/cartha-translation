  preserved_meaning: Yahweh appoints the promised blessing to come upon the people, including where they store their goods.
  reasoning_layer_used: POB lexical decisions for יְצַו, אִתְּךָ, and בַּאֲסָמֶיךָ
  rationale: “To come on you” clarifies the command-blessing idiom while retaining the personal recipient and the storehouses.
- pob_phrase: in all the work of your hand
  simplified_phrase: in everything you do
  preserved_meaning: The blessing covers all the people's work and undertakings.
  reasoning_layer_used: POB lexical decision and idiom footnote for מִשְׁלַח יָדֶךָ
  rationale: The common wording directly expresses the documented meaning of the Hebrew hand idiom.
