translation:
  language: en
  text: Your sons and daughters will be given to another people. You will watch it happen, and your eyes will grow weak from longing for them all day long. But you will be powerless to do anything.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Your sons and your daughters
  simplified_phrase: Your sons and daughters
  preserved_meaning: Both male and female children remain explicitly named.
  reasoning_layer_used: POB lexical decision for בָּנֶיךָ וּבְנֹתֶיךָ
  rationale: Removing the repeated possessive makes the wording more natural without making it generic.
- pob_phrase: while your eyes look on and fail with longing for them
  simplified_phrase: You will watch it happen, and your eyes will grow weak from longing for them
  preserved_meaning: The parents helplessly witness the loss and are worn down by longing.
  reasoning_layer_used: POB lexical decisions for וְעֵינֶיךָ רֹאוֹת and וְכָלוֹת אֲלֵיהֶם
  rationale: Two direct clauses clarify the event while preserving the image of failing eyes.
- pob_phrase: but your hand will be powerless
  simplified_phrase: But you will be powerless to do anything
  preserved_meaning: They will be unable to act despite witnessing their children's loss.
  reasoning_layer_used: POB lexical and theological decisions for וְאֵין לְאֵל יָדֶךָ
  rationale: Stating the idiom's meaning directly avoids suggesting that power is physically located in the hand.
interpretive_expansions:
- pob_phrase: while your eyes look on
  rendering: You will watch it happen
  claim: The parents personally witness their children being given to another people.
  evidence:
