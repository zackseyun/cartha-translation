translation:
  language: en
  text: A people you have never known will eat the produce of your land and everything your work has produced. You will be oppressed and crushed without relief all your days.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the fruit of your land
  simplified_phrase: the produce of your land
  preserved_meaning: The agricultural yield of the people's cultivated land will be taken and eaten.
  reasoning_layer_used: POB lexical decision for פְּרִי and its listed alternative
  rationale: “Produce” makes the agricultural sense immediately clear while preserving the concrete image.
- pob_phrase: all your labor
  simplified_phrase: everything your work has produced
  preserved_meaning: The foreign people will consume what the people's labor has yielded.
  reasoning_layer_used: POB lexical decision for יְגִיעֲךָ
  rationale: The recasting clarifies what can be eaten without changing labor into a different source idea.
- pob_phrase: you will be only oppressed and crushed all your days
  simplified_phrase: You will be oppressed and crushed without relief all your days
  preserved_meaning: Their oppression and crushing suffering will be continual and unrelieved.
  reasoning_layer_used: POB lexical decisions for רַק, עָשׁוּק, רָצוּץ, and כָּל הַיָּמִים
  rationale: “Without relief” expresses the force of “only” in natural English while retaining both passive images.
