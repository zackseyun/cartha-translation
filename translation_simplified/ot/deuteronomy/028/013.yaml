translation:
  language: en
  text: Yahweh will make you the head, not the tail. You will be above, never beneath, if you listen to[a] the commandments of Yahweh your God that I am commanding you today, keep them, and carry them out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “obey.” Here, “listen to” means hearing in a way that leads to obedience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Yahweh will make you the head and not the tail
  simplified_phrase: Yahweh will make you the head, not the tail.
  preserved_meaning: Yahweh will give Israel prominence rather than low status while retaining the Hebrew image.
  reasoning_layer_used: Lexical decisions for ראשׁ and זנב
  rationale: A separate sentence makes the vivid contrast easier to grasp.
- pob_phrase: you will be only above, and you will not be beneath
  simplified_phrase: You will be above, never beneath
  preserved_meaning: Israel’s elevated status is emphatically contrasted with being below.
  reasoning_layer_used: Lexical decisions for רק, למעלה, and למטה
  rationale: “Never beneath” conveys the emphasis naturally while preserving the spatial image.
- pob_phrase: to keep and to do them
  simplified_phrase: keep them, and carry them out
  preserved_meaning: The commandments must be observed and put into practice.
  reasoning_layer_used: Lexical decision for לשמר ולעשות
  rationale: “Carry them out” makes the practical force of “do them” clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “listen to” as merely hearing.
    mitigation: The footnote and following actions preserve its covenant sense of obedient hearing.
  - risk: “Above” and “beneath” could suggest physical location.
    mitigation: The head-and-tail parallel signals that the language describes status.
