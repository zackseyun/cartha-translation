translation:
  language: en
  text: Just as Yahweh rejoiced to do good to you and make you numerous, so Yahweh will rejoice to destroy you and wipe you out. You will be torn away from the land you are entering to possess.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it shall be that, just as
  simplified_phrase: Just as
  preserved_meaning: The verse still introduces a future consequence through a direct comparison.
  reasoning_layer_used: Lexical decision for וְהָיָה and כַּאֲשֶׁר
  rationale: The shorter opening expresses the same comparison without a formal introductory formula.
- pob_phrase: to do you good and to multiply you
  simplified_phrase: to do good to you and make you numerous
  preserved_meaning: Yahweh blessed Israel and increased its population.
  reasoning_layer_used: Lexical decisions for לְהֵיטִיב אֶתְכֶם and וּלְהַרְבּוֹת אֶתְכֶם
  rationale: “Make you numerous” makes the covenantal sense of “multiply” immediately clear.
- pob_phrase: you will be torn away from upon the land that you are entering there to possess it
  simplified_phrase: You will be torn away from the land you are entering to possess
  preserved_meaning: Israel will be forcibly removed from the land it is about to take as its possession.
  reasoning_layer_used: Lexical decisions for וְנִסַּחְתֶּם, מֵעַל הָאֲדָמָה, and לְרִשְׁתָּהּ
  rationale: The revision removes awkward directional wording while retaining the violent image of being torn away.
translation_notes:
  risk_flags:
  - risk: Modern readers may find Yahweh’s rejoicing in judgment theologically disturbing.
    mitigation: The wording preserves the deliberate parallel between rejoicing in blessing and rejoicing in judgment without explanation or softening.
  - risk: Removing “from upon” slightly reduces the Hebrew preposition’s intensity.
    mitigation: “Torn away” retains the forceful removal image in natural English.
