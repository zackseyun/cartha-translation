translation:
  language: en
  text: Yahweh will take you back to Egypt on ships, by the route I spoke of when I told you, “You will never see it again.” There you will offer yourselves to your enemies for sale as male and female servants,[a] but no one will buy you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will be sold there to your enemies as male and female slaves”; the Hebrew may mean either offering yourselves for sale or more generally entering slavery.
    reason: lexical_alternative
