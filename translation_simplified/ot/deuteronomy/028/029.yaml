  preserved_meaning: The person's endeavors and broader course of life will fail to prosper.
  reasoning_layer_used: lexical decisions for תַצְלִיחַ and אֶת דְּרָכֶיךָ
  rationale: This states the audited contextual sense of the opaque phrase “in your ways.”
- pob_phrase: you will be only oppressed and robbed all the days
