  preserved_meaning: Oppression and robbery will be the person's continuing, overriding condition.
  reasoning_layer_used: lexical decisions for אַךְ, עָשׁוּק, גָזוּל, and כָּל הַיָּמִים
  rationale: “Nothing but” preserves the restrictive force of “only,” while “day after day” conveys ongoing duration.
