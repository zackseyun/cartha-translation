simplification_decisions:
- pob_phrase: The foreigner who is among you
  simplified_phrase: The foreigner living among you
  preserved_meaning: The person is a non-native resident within Israel’s community.
  reasoning_layer_used: POB lexical decision for הַגֵּר and אֲשֶׁר בְּקִרְבְּךָ
  rationale: The participial wording is more direct while retaining the foreigner’s resident status.
- pob_phrase: and you will go down lower and lower
  simplified_phrase: while you fall lower and lower
  preserved_meaning: Israel’s decline contrasts with the foreigner’s continuing rise.
  reasoning_layer_used: POB lexical and theological decisions for תֵרֵד and the status reversal
  rationale: “While” makes the contrast easy to follow, and “fall” naturally conveys decline.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “foreigner” to mean someone outside the community.
    mitigation: The words “living among you” and footnote define the person as a non-native resident.
