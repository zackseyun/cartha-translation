translation:
  language: en
  text: The foreigner living among you[a] will rise higher and higher above you, while you fall lower and lower.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sojourner” or “resident alien”; the Hebrew refers to a non-native living among Israel.
