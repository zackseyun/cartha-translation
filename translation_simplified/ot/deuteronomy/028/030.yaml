translation:
  language: en
  text: You will become engaged to your future wife, but another man will have sex with her.[a] You will build a house, but you will not live in it. You will plant a vineyard, but you will not get to begin eating its fruit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a blunt sexual term but does not by itself specify whether force is involved.
    reason: lexical_alternative
  - marker: b
    text: This refers to beginning the ordinary use of a vineyard’s fruit after its first years.
    reason: cultural_note
simplification_decisions:
- pob_phrase: become engaged to a wife
  simplified_phrase: become engaged to your future wife
  preserved_meaning: The woman is the man’s intended wife, not merely any woman.
  reasoning_layer_used: POB lexical decision for תְאָרֵשׂ and אִשָּׁה
  rationale: “Future wife” makes the marital setting natural in modern English.
- pob_phrase: another man will lie with her
  simplified_phrase: another man will have sex with her
  preserved_meaning: Another man will engage in the sexual act with the woman.
  reasoning_layer_used: POB lexical decision for ישגלנה
  rationale: The direct wording preserves the Hebrew term’s bluntness without adding force.
- pob_phrase: will not begin to use its fruit
  simplified_phrase: will not get to begin eating its fruit
  preserved_meaning: The planter will be denied the vineyard’s first ordinary consumption.
  reasoning_layer_used: POB lexical rationale for תְחַלְּלֶּנּוּ
  rationale: The new wording explains the vineyard idiom in ordinary language.
interpretive_expansions:
- pob_phrase: will not begin to use its fruit
  rendering: will not get to begin eating its fruit
  claim: The curse denies the planter the opportunity to begin ordinary consumption of the vineyard’s fruit.
  evidence:
  - The POB lexical rationale identifies the verb as beginning ordinary use of produce.
  - Leviticus 19:23–25 supplies the likely background for when vineyard fruit became available for ordinary use.
  confidence: high
  alternatives_preserved:
  - will not begin to use its fruit
  - will not make its fruit common
