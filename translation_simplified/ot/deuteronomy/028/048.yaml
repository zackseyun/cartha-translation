  preserved_meaning: The service is imposed labor under hostile powers, not worship.
  reasoning_layer_used: lexical decision for וְעָבַדְתָּ
  rationale: The wording makes the coercion clear while keeping the curse's predictive force.
- pob_phrase: in hunger and in thirst and in nakedness and in lack of everything
  simplified_phrase: You will be hungry and thirsty, without clothes, and lacking everything
  preserved_meaning: The people will suffer a mounting series of severe deprivations.
  reasoning_layer_used: lexical decisions for the four deprivation terms
  rationale: A direct English sentence replaces the repeated abstract phrases without weakening the list.
- pob_phrase: he will put an iron yoke on your neck
  simplified_phrase: Yahweh will put an iron yoke on your neck
  preserved_meaning: Yahweh imposes harsh subjugation as covenant judgment.
  reasoning_layer_used: theological decision on the subject of וְנָתַן
  rationale: Repeating Yahweh's name makes the chosen subject clear while preserving the yoke image.
