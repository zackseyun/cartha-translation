translation:
  language: en
  text: You will be forced to serve the enemies Yahweh sends against you. You will be hungry and thirsty, without clothes, and lacking everything. Yahweh will put an iron yoke on your neck until he destroys you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew could also mean that the enemy will put the iron yoke on you and destroy you.
    reason: alternative_reading
