translation:
  language: en
  text: He will lay siege to every one of your towns[a] throughout your land. The siege will continue until the high, fortified walls you trust in come down. He will lay siege to every one of your towns throughout the land Yahweh your God has given you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “gates,” used here for the towns within those gates.
    reason: source_note
simplification_decisions:
- pob_phrase: he will besiege you in all your gates
  simplified_phrase: He will lay siege to every one of your towns
  preserved_meaning: The enemy will surround and attack every gated settlement.
  reasoning_layer_used: The lexical decision identifies a military siege and recognizes that “gates” stands for town-settlements.
  rationale: “Towns” prevents readers from mistaking the targets for individual entrances.
- pob_phrase: until your high and fortified walls, in which you trust, come down
  simplified_phrase: The siege will continue until the high, fortified walls you trust in come down.
  preserved_meaning: The trusted defenses will eventually collapse under the continuing siege.
  reasoning_layer_used: The lexical decisions preserve both wall descriptions, Israel’s reliance on them, and the image of coming down.
  rationale: A separate sentence makes the duration and outcome easy to follow.
- pob_phrase: throughout all your land
  simplified_phrase: throughout your land / throughout the land Yahweh your God has given you
  preserved_meaning: The siege will extend across the whole God-given land.
  reasoning_layer_used: The lexical rationale gives the phrase a distributive, total scope.
  rationale: The repeated wording preserves the verse’s emphasis on the siege’s full reach.
interpretive_expansions:
- pob_phrase: all your gates
  rendering: every one of your towns
  claim: The gates represent the town-settlements being besieged.
  evidence:
  - The POB lexical rationale identifies “gates” as a Deuteronomic metonym for city-settlements.
  - The references to siege and fortified walls establish the settlement context.
  confidence: high
  alternatives_preserved:
  - Literally, “gates,” as stated in the footnote.
- pob_phrase: until ... come down
  rendering: The siege will continue until ... come down.
  claim: The siege persists up to the collapse of the walls.
  evidence:
  - The Hebrew construction עַד רֶדֶת marks the endpoint of the siege.
  confidence: high
  alternatives_preserved:
  - until the walls fall
  - until the walls come down
translation_notes:
  risk_flags:
