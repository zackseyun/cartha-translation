translation:
  language: en
  text: Three times each year, every male among you must come before Yahweh your God at the place he will choose. They must come for the Feast of Unleavened Bread, the Feast of Weeks, and the Feast of Booths.[a] No one may come before Yahweh empty-handed; each must bring the required gift.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Feast of Booths is also traditionally called the Feast of Tabernacles.
    reason: alternative_reading
