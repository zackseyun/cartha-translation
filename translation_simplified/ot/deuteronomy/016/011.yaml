translation:
  language: en
  text: You must rejoice in the presence of Yahweh your God at the place Yahweh your God will choose for his name to dwell. Rejoice together with your son and daughter, your male and female slaves, the Levite living in your town, and the resident foreigner, the orphan, and the widow among you.
