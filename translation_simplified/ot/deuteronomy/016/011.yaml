- pob_phrase: And you shall rejoice before Yahweh your God
  simplified_phrase: You must rejoice in the presence of Yahweh your God
  preserved_meaning: The people are commanded to rejoice in Yahweh's presence.
  reasoning_layer_used: POB lexical decisions for וְשָׂמַחְתָּ and לִפְנֵי
  rationale: “Must” states the command naturally, while “in the presence of” makes “before” immediately clear.
- pob_phrase: you, your son, your daughter, your male slave, your female slave
  simplified_phrase: Rejoice together with your son and daughter, your male and female slaves
  preserved_meaning: The addressee must include all listed household members in the rejoicing.
  reasoning_layer_used: POB lexical decisions and household-dependent theological decision
  rationale: A second sentence makes the shared celebration clear while retaining the source-driven term “slaves.”
- pob_phrase: the Levite who is within your gates, and the sojourner, the fatherless
  simplified_phrase: the Levite living in your town, and the resident foreigner, the orphan
  preserved_meaning: The local Levite, non-native resident, and parentless person are included.
  reasoning_layer_used: POB lexical alternatives and contextual rationale
  rationale: Approved familiar terms replace biblical idioms without changing the social groups.
