  rationale: “Must” expresses the command more clearly than legal “shall.”
- pob_phrase: from the flock and the herd
  simplified_phrase: using animals from flocks and herds
  preserved_meaning: The offerings come from both broad livestock categories without specifying ownership or species.
  reasoning_layer_used: Lexical decision for צֹאן וּבָקָר and theological scope decision
  rationale: The wording makes the implied source relationship clear without adding a possessive.
- pob_phrase: at the place that Yahweh will choose to make his name dwell there
  simplified_phrase: Offer it at the place Yahweh will choose to make his name dwell.
  preserved_meaning: Yahweh chooses the worship site and causes his covenant name to dwell there.
  reasoning_layer_used: Lexical decision for לְשַׁכֵּן שְׁמוֹ שָׁם
