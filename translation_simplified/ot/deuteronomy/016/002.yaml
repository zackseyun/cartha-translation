  text: You must sacrifice the Passover offering to Yahweh your God,[a] using animals from flocks and herds. Offer it at the place Yahweh will choose to make his name dwell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Passover offering” may include not only the Passover animal itself but also other festival sacrifices offered during Passover and the Festival of Unleavened Bread.
    reason: alternative_reading
