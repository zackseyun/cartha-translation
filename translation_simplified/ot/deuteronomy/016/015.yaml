translation:
  language: en
  text: For seven days, hold a festival in honor of Yahweh your God at the place Yahweh will choose. Do this because Yahweh your God will bless you in all your produce and in all the work of your hands. As a result, you will be full of joy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will surely rejoice” or “you will be only joyful.” The Hebrew emphasizes complete, unspoiled joy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall celebrate a feast to Yahweh your God
  simplified_phrase: hold a festival in honor of Yahweh your God
  preserved_meaning: The celebration is a religious festival dedicated to Yahweh.
  reasoning_layer_used: Lexical decisions for תָּחֹג and לַיהוָה
  rationale: This makes both the festival and its dedication clear.
- pob_phrase: because Yahweh your God will bless you in all your produce and in all the work of your hands
  simplified_phrase: Do this because Yahweh your God will bless you in all your produce and in all the work of your hands.
  preserved_meaning: Yahweh blesses the person in connection with their produce and labor.
  reasoning_layer_used: Lexical decisions for כִּי, יְבָרֶכְךָ, תְּבוּאָתְךָ, and מַעֲשֵׂה יָדֶיךָ
  rationale: A separate sentence clarifies the reason while retaining the addressee as the one blessed.
- pob_phrase: and you shall be altogether joyful
  simplified_phrase: As a result, you will be full of joy
  preserved_meaning: Yahweh’s blessing results in complete joy.
  reasoning_layer_used: Theological decision for וְהָיִיתָ אַךְ שָׂמֵחַ
  rationale: Natural wording preserves the result and the emphatic fullness of joy.
