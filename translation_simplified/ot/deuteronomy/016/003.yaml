  text: Do not eat leavened bread with the Passover sacrifice. Eat unleavened bread with it for seven days—the bread of affliction[a]—because you left Egypt in haste. Do this so that throughout your life you remember the day you left Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the bread of poverty” or “the bread of misery.” The phrase recalls the hardship connected with the exodus.
    reason: lexical_alternative
