translation:
  language: en
  text: For seven days, no leaven may be found anywhere in your territory. None of the meat you sacrifice in the evening on the first day may be left overnight until morning.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “On the first day” may refer specifically to the Passover sacrifice at the festival’s opening, but the Hebrew does not explicitly say “Passover lamb.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: No leaven is to be seen with you within all your territory
  simplified_phrase: no leaven may be found anywhere in your territory
  preserved_meaning: Leaven is prohibited throughout the whole territory.
  reasoning_layer_used: Lexical decisions for יֵרָאֶה and בְּכָל גְּבֻלְךָ
  rationale: “May be found anywhere” expresses the passive prohibition and its full territorial scope naturally.
- pob_phrase: none of the flesh that you sacrifice
  simplified_phrase: none of the meat you sacrifice
  preserved_meaning: None of the sacrificial meat may remain until morning.
  reasoning_layer_used: Lexical decision for מִן הַבָּשָׂר
  rationale: “Meat” gives the ordinary contextual meaning of “flesh” without losing its sacrificial reference.
- pob_phrase: shall remain overnight until morning
  simplified_phrase: may be left overnight until morning
  preserved_meaning: The sacrificed meat must not be kept through the night until morning.
  reasoning_layer_used: Lexical decision for יָלִין
  rationale: “May be left overnight” states the prohibition in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Meat” has less sacrificial register than the Hebrew “flesh.”
    mitigation: The clause “you sacrifice” keeps the ritual setting explicit.
  - risk: Readers may assume “the first day” can only mean the Passover lamb.
    mitigation: The footnote preserves the broader possible reference to opening-day festival sacrifices.
