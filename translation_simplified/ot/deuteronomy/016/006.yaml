- pob_phrase: but only at the place that Yahweh your God will choose ... there you shall sacrifice
  simplified_phrase: You must offer ... only at the place Yahweh your God will choose
  preserved_meaning: Yahweh restricts the Passover sacrifice to his chosen place.
  reasoning_layer_used: The lexical decision for כִּי אִם establishes a strong restriction.
  rationale: The direct sentence order makes the restriction immediately clear.
- pob_phrase: there you shall sacrifice the Passover
  simplified_phrase: You must offer the Passover sacrifice
  preserved_meaning: The Passover here is the ritual offering, not merely the festival.
  reasoning_layer_used: The lexical decisions identify זבח as sacrificial action and הַפֶּסַח as the offering.
  rationale: Naming the sacrifice prevents readers from mistaking Passover for the whole observance.
- pob_phrase: at the appointed time of your departure from Egypt
  simplified_phrase: the appointed time when you left Egypt
  preserved_meaning: The required time corresponds to Israel’s departure from Egypt.
  reasoning_layer_used: The lexical rationale links the appointed time to Israel’s coming out of Egypt.
  rationale: A finite clause is more natural than the abstract noun “departure.”
