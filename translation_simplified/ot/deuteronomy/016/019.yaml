translation:
  language: en
  text: Do not make an unjust ruling. Do not favor one person over another, and do not accept a bribe. A bribe blinds the eyes of wise people and twists the words of those who are in the right.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that a bribe distorts the case of those who are in the right.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You shall not pervert justice
  simplified_phrase: Do not make an unjust ruling
  preserved_meaning: Judges must not turn legal judgment away from what is right.
  reasoning_layer_used: POB lexical decision for תַטֶּה מִשְׁפָּט
  rationale: The concrete wording makes the judicial command immediately clear.
- pob_phrase: you shall not show partiality
  simplified_phrase: Do not favor one person over another
  preserved_meaning: A judge must not treat people differently out of favoritism.
  reasoning_layer_used: POB lexical decision for תַכִּיר פָּנִים
  rationale: The rewrite directly states the meaning of the Hebrew idiom.
- pob_phrase: the wise ... the righteous
  simplified_phrase: wise people ... those who are in the right
  preserved_meaning: Bribery corrupts wise persons and harms people whose words or case are right.
  reasoning_layer_used: POB lexical decisions for חֲכָמִים and צַדִּיקִים
  rationale: These phrases use common English without narrowing the terms to men or merely to the innocent.
translation_notes:
  risk_flags:
  - risk: “Those who are in the right” may sound mainly legal rather than also moral.
    mitigation: The courtroom context supports the wording, while the note preserves the legal ambiguity.
  - risk: “Make an unjust ruling” states the result rather than retaining the image of bending justice.
    mitigation: It preserves the POB’s forensic force in language readily understood by modern readers.
