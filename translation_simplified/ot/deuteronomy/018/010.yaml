translation:
  language: en
  text: No one among you may make their son or daughter pass through the fire[a], practice divination, tell fortunes, read omens, or use sorcery.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “make his son or his daughter pass through the fire.” This may mean burning or offering the child in a fire ritual.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: There must not be found among you anyone who
  simplified_phrase: No one among you may
  preserved_meaning: The practice is forbidden within the covenant community.
  reasoning_layer_used: Lexical decision for יִמָּצֵא בְךָ
  rationale: A direct prohibition is clearer than the passive legal wording.
- pob_phrase: interprets omens
  simplified_phrase: read omens
  preserved_meaning: The person seeks guidance by interpreting signs.
  reasoning_layer_used: Lexical decision for מְנַחֵשׁ
  rationale: “Read omens” is common English while remaining distinct from general divination.
- pob_phrase: practices sorcery
  simplified_phrase: use sorcery
  preserved_meaning: The prohibition covers engaging in magical arts.
  reasoning_layer_used: Lexical decision for מְכַשֵּׁף
  rationale: The shorter verb phrase makes the list easier to follow.
