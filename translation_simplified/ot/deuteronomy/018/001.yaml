translation:
  language: en
  text: The Levitical priests—the whole tribe of Levi—will receive no share of land or inherited property along with the rest of Israel. They will eat Yahweh’s food offerings[a] and his inheritance.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Yahweh’s offerings by fire.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “his inheritance.” This may mean Levi’s inheritance, using singular wording for the tribe as a whole (compare Deuteronomy 18:2), or Yahweh’s inheritance.
    reason: source_note
simplification_decisions:
- pob_phrase: shall have no portion or inheritance with Israel
  simplified_phrase: will receive no share of land or inherited property along with the rest of Israel
  preserved_meaning: Levi receives no territorial or property allotment like Israel’s other tribes.
  reasoning_layer_used: lexical decisions for חֵלֶק וְנַחֲלָה and עִם יִשְׂרָאֵל
  rationale: Concrete wording explains the legal inheritance terms.
- pob_phrase: the food offerings of Yahweh
  simplified_phrase: Yahweh’s food offerings
  preserved_meaning: The Levites receive food from sacrifices presented to Yahweh.
  reasoning_layer_used: lexical decision for אִשֵּׁי יְהוָה and theological decision for יְהוָה
  rationale: The possessive form is shorter and keeps the sacrificial setting.
- pob_phrase: that is, his inheritance
  simplified_phrase: and his inheritance
  preserved_meaning: The singular possessive remains open to either Levi or Yahweh as its referent.
  reasoning_layer_used: source conjunction, lexical alternatives for וְנַחֲלָתוֹ, and grounding review
  rationale: The coordinated wording preserves the documented ambiguity instead of resolving it.
interpretive_expansions:
- pob_phrase: portion or inheritance with Israel
  rendering: share of land or inherited property along with the rest of Israel
  claim: The denied inheritance is a territorial or property allotment among Israel’s tribes.
  evidence:
  - The lexical rationale identifies allotted territorial and property rights.
  - The phrase “with Israel” denotes possession shared with the other tribes.
  confidence: high
  alternatives_preserved:
  - portion or inheritance
  - share or inheritance
translation_notes:
  risk_flags:
