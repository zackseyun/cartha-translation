translation:
  language: en
  text: If a Levite leaves any town in Israel where he has been living[a] and goes, longing with all his heart, to the place Yahweh will choose,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can describe someone residing without a permanent landholding.
