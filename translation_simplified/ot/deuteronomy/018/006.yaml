simplification_decisions:
- pob_phrase: comes from one of your gates out of all Israel
  simplified_phrase: leaves any town in Israel
  preserved_meaning: The Levite may come from any Israelite town.
  reasoning_layer_used: lexical decision and cultural note
  rationale: “Town” states the civic meaning of the Hebrew image “gate” in ordinary English.
- pob_phrase: where he is residing
  simplified_phrase: where he has been living
  preserved_meaning: The town is the Levite’s current place of residence.
  reasoning_layer_used: lexical decision
  rationale: The common phrase “has been living” replaces formal wording while the footnote preserves the sojourner nuance.
- pob_phrase: comes with all the desire of his soul
  simplified_phrase: goes, longing with all his heart
  preserved_meaning: He freely goes there with deep personal desire.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: This wording keeps both the movement and the full inward longing in natural English.
