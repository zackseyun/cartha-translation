  rationale: The clearer verbal phrase keeps the specialized ministerial sense rather than reducing it to general service.
- pob_phrase: his brothers the Levites
  simplified_phrase: his brothers—the other Levites
  preserved_meaning: The masculine kinship term refers specifically to his fellow Levites.
  reasoning_layer_used: Lexical and theological decisions for אֶחָיו and הַלְוִיִּם
  rationale: The dash makes the appositional explanation immediately clear while retaining “brothers.”
