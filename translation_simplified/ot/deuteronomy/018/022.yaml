translation:
  language: en
  text: When the prophet speaks in Yahweh’s name, but what he says does not happen or come true, then Yahweh did not speak that message. The prophet spoke it arrogantly and without Yahweh’s authority. Do not be afraid of him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the matter does not happen or come about
  simplified_phrase: what he says does not happen or come true
  preserved_meaning: The prophetic message fails to become the event it foretold.
  reasoning_layer_used: Lexical decision for דָּבָר and the paired verbs
  rationale: This wording makes the message-event connection clear while retaining the twofold expression of nonfulfillment.
- pob_phrase: that is the matter that Yahweh has not spoken
  simplified_phrase: then Yahweh did not speak that message
  preserved_meaning: A failed prediction is identified as a message not spoken by Yahweh.
  reasoning_layer_used: Theological decision on the objective prophetic test
  rationale: The conclusion is recast in direct modern English without broadening the test beyond this verse.
- pob_phrase: The prophet has spoken it presumptuously; you shall not fear him
  simplified_phrase: The prophet spoke it arrogantly and without Yahweh’s authority. Do not be afraid of him.
  preserved_meaning: The prophet spoke with willful arrogance and lacked divine authorization, so the hearer must not be intimidated.
  reasoning_layer_used: Lexical decisions for בְּזָדוֹן and לֹא תָגוּר מִמֶּנּוּ
  rationale: The uncommon adverb is unpacked, and the legal prohibition becomes a clear direct command.
interpretive_expansions:
- pob_phrase: presumptuously
  rendering: arrogantly and without Yahweh’s authority
  claim: The prophet’s presumption consists of willfully speaking under divine authority that Yahweh did not grant.
  evidence:
  - The POB lexical rationale defines the term as arrogant, willful presumption.
  - Speaking “in Yahweh’s name” is a claim to divine authority.
  - The preceding clause says Yahweh did not speak the message.
  confidence: high
  alternatives_preserved:
  - arrogantly
  - with presumption
  - insolently
translation_notes:
  risk_flags:
  - risk: “Message” emphasizes the spoken sense of דָּבָר more than its event sense.
    mitigation: The phrase “does not happen or come true” preserves the same term’s connection to the foretold event.
