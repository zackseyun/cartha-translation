translation:
  language: en
  text: 'This is the share the priests are entitled to receive from anyone who offers a sacrifice, whether the animal is an ox or a sheep: each person must give the priest the shoulder, both cheeks, and the stomach.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew emphasizes the act of sacrifice by repeating the same root: literally, “those who sacrifice a sacrifice.”'
    reason: source_note
