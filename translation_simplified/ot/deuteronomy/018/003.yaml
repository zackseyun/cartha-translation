- pob_phrase: whether an ox or a sheep
  simplified_phrase: whether the animal is an ox or a sheep
  preserved_meaning: The requirement applies to either named kind of sacrificial animal.
  reasoning_layer_used: POB lexical decision for אִם שׁוֹר אִם שֶׂה
  rationale: Adding “the animal” makes the connection to the sacrifice immediately clear.
- pob_phrase: he shall give to the priest the shoulder, the two cheeks, and the stomach
  simplified_phrase: each person must give the priest the shoulder, both cheeks, and the stomach
  preserved_meaning: Every individual sacrificer is required to give these portions to the priest.
