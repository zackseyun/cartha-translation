translation:
  language: en
  text: But any prophet who willfully takes it upon himself to speak in my name a message I did not command him to give, or who speaks in the name of other gods—that prophet shall die.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “must die.” The Hebrew states the legal death sentence in a brief form.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the prophet who presumptuously speaks a word
  simplified_phrase: any prophet who willfully takes it upon himself to speak ... a message
  preserved_meaning: The prophet deliberately oversteps his authority by claiming to deliver a divine message.
  reasoning_layer_used: POB lexical decision for יָזִיד and לְדַבֵּר דָּבָר
  rationale: The wording replaces an uncommon adverb and opaque idiom while retaining deliberate presumption.
- pob_phrase: that I have not commanded him to speak
  simplified_phrase: I did not command him to give
  preserved_meaning: The message lacks God's authorization.
  reasoning_layer_used: POB lexical rationale for the divine command clause
  rationale: “Give a message” is natural English for delivering prophetic speech.
- pob_phrase: that prophet shall die
  simplified_phrase: that prophet shall die
  preserved_meaning: The verse declares a legal death sentence without specifying its mechanism.
  reasoning_layer_used: POB theological decision on the penalty formula
  rationale: The judicial wording is retained because the audit warns against adding an explicit causative meaning.
translation_notes:
  risk_flags:
  - risk: “Takes it upon himself” could sound less arrogant than the Hebrew verb.
