translation:
  language: en
  text: Yahweh your God will raise up for you a prophet like me from among your own people.[a][b] You must listen to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “from your brothers,” meaning fellow Israelites generally.'
    reason: lexical_alternative
  - marker: b
    text: The New Testament later applies this verse to the Messiah, but the Hebrew here simply says “a prophet like me.”
    reason: cross_reference
simplification_decisions:
- pob_phrase: from among you, from your brothers
  simplified_phrase: from among your own people
  preserved_meaning: The prophet will come from within Israel rather than from outside it.
  reasoning_layer_used: POB lexical decisions on מִקִּרְבְּךָ and מֵאַחֶיךָ
  rationale: The communal wording avoids suggesting Moses’ biological brothers while the footnote preserves the Hebrew kinship term.
- pob_phrase: you must listen to him
  simplified_phrase: You must listen to him.
  preserved_meaning: Israel is commanded to heed the prophet without expanding “listen” into “obey.”
  reasoning_layer_used: POB lexical decision on תִּשְׁמָעוּן
  rationale: A separate sentence makes the command direct and easy to follow.
interpretive_expansions:
- pob_phrase: from among you, from your brothers
  rendering: from among your own people
  claim: The paired origin phrases identify the prophet as coming from the people of Israel.
  evidence:
  - The POB lexical reasoning says both expressions refer to someone arising from within Israel.
  confidence: high
  alternatives_preserved:
  - The footnote retains the literal wording “from your brothers.”
translation_notes:
  risk_flags:
  - risk: “Your own people” does not display the Hebrew masculine kinship term in the main text.
    mitigation: Footnote [a] preserves the literal wording and explains its communal sense.
  - risk: Readers may assume the verse explicitly identifies the prophet as the Messiah.
    mitigation: Footnote [b] distinguishes the later New Testament application from the Hebrew wording.
