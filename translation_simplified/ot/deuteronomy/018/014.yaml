translation:
  language: en
  text: For the nations you are driving out listen to people who read omens and to people who practice divination. But as for you, Yahweh your God has not allowed you to do this.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says that Yahweh has not “given” this to Israel, leaving the object unstated.
    reason: lexical_alternative
