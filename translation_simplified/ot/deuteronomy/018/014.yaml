  simplified_phrase: the nations you are driving out
  preserved_meaning: Israel is removing the previous inhabitants as it takes possession of their land.
  reasoning_layer_used: POB lexical decision for ירשׁ
  rationale: “Driving out” is a familiar POB-listed alternative that retains the force of dispossession.
- pob_phrase: soothsayers and diviners
  simplified_phrase: people who read omens and to people who practice divination
  preserved_meaning: The nations seek guidance from two distinct kinds of occult practitioners.
  reasoning_layer_used: POB lexical decisions for מְעֹנְנִים and קֹסְמִים
  rationale: Parallel wording explains both unfamiliar titles without merging the two groups.
- pob_phrase: but as for you
  simplified_phrase: But as for you
  preserved_meaning: Israel’s way is explicitly contrasted with the practices of the nations.
  reasoning_layer_used: POB lexical decision for וְאַתָּה לֹא כֵן
  rationale: Retaining the phrase preserves the emphatic contrast identified in the audit.
