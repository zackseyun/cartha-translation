translation:
  language: en
  text: He will have no inheritance—no allotted share of the land—among his brothers.[a] Yahweh himself is his inheritance, just as Yahweh told him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” means his fellow Israelites, especially the other tribes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: no inheritance among his brothers
  simplified_phrase: no inheritance—no allotted share of the land—among his brothers
  preserved_meaning: The Levite receives no hereditary land allotment among the other Israelite tribes.
  reasoning_layer_used: Lexical decision for נַחֲלָה and its Deuteronomic land-allotment context
  rationale: “Allotted share” clarifies the legal land sense without denying every possible landholding.
- pob_phrase: Yahweh is his inheritance
  simplified_phrase: Yahweh himself is his inheritance
  preserved_meaning: Yahweh personally stands as the Levite’s inheritance.
  reasoning_layer_used: Lexical decision for emphatic הוּא and theological decision to preserve the covenant metaphor
  rationale: “Himself” conveys the Hebrew emphasis while preserving the metaphor.
- pob_phrase: as he spoke to him
  simplified_phrase: just as Yahweh told him
  preserved_meaning: This arrangement agrees with what Yahweh previously said to the Levite.
  reasoning_layer_used: Lexical decision for דִּבֶּר and immediate grammatical context
  rationale: “Told” is natural English, and naming Yahweh clarifies the implied subject.
interpretive_expansions:
- pob_phrase: no inheritance
  rendering: no inheritance—no allotted share of the land
  claim: The first “inheritance” means a hereditary allotment in Israel’s land.
  evidence:
  - The lexical audit identifies an allotted inheritance in a Deuteronomic land-allotment context.
  - The contrast with the other tribes supports a territorial allotment.
  confidence: high
  alternatives_preserved:
  - “Inheritance” remains in both clauses.
  - The second clause’s covenant metaphor remains unexplained.
- pob_phrase: as he spoke to him
  rendering: just as Yahweh told him
  claim: Yahweh is the implied subject of the final verb.
  evidence:
  - Yahweh is the stated subject of the preceding clause.
  - The POB reasoning identifies the speech as divine.
  confidence: high
  alternatives_preserved:
  - “Told” is not strengthened to “promised.”
translation_notes:
  risk_flags:
  - risk: The land clarification could imply that Levites could never hold any land.
    mitigation: “Allotted share” limits the statement to Israel’s tribal land inheritance.
  - risk: Readers may take “brothers” to mean biological siblings.
    mitigation: The footnote identifies them as fellow Israelites, especially the other tribes.
