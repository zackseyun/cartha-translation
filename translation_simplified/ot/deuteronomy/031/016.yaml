translation:
  language: en
  text: Yahweh said to Moses, “You will soon lie down in death with your ancestors. Afterward, these people will rise up and prostitute themselves by following the foreign gods of the land they are entering.[a] They will abandon me and break the covenant I made with them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Prostitute themselves” is a picture of the people betraying Yahweh by worshiping other gods.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, you are about to lie down with your fathers
  simplified_phrase: You will soon lie down in death with your ancestors
  preserved_meaning: Moses will soon die and join those who died before him, while the Hebrew image of lying down remains.
  reasoning_layer_used: POB lexical decision on הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  rationale: “Soon” and “ancestors” make the solemn death idiom immediately understandable.
- pob_phrase: Then this people will rise up and prostitute themselves after the foreign gods
  simplified_phrase: Afterward, these people will rise up and prostitute themselves by following the foreign gods
  preserved_meaning: After Moses dies, Israel will turn to foreign gods in severe covenant unfaithfulness.
  reasoning_layer_used: POB lexical and theological decisions on וְקָם, וְזָנָה, and אַחֲרֵי אֱלֹהֵי נֵכַר
  rationale: The wording keeps the sexual metaphor but explains that it refers to following other gods.
- pob_phrase: They will forsake me
  simplified_phrase: They will abandon me
  preserved_meaning: The people will leave Yahweh in covenant disloyalty.
  reasoning_layer_used: POB lexical decision on וַעֲזָבַנִי
  rationale: “Abandon” is common English and retains the force of deliberate desertion.
interpretive_expansions:
- pob_phrase: lie down with your fathers
  rendering: lie down in death with your ancestors
  claim: The act of lying down refers to Moses’ approaching death.
  evidence:
  - The POB lexical rationale identifies the wording as a Hebrew idiom of death.
  - The immediate prediction concerns what the people will do after Moses is gone.
  confidence: high
  alternatives_preserved:
  - The concrete image of lying down remains.
- pob_phrase: prostitute themselves after the foreign gods
  rendering: prostitute themselves by following the foreign gods
  claim: The prostitution image describes turning to foreign gods in idolatrous covenant betrayal.
  evidence:
  - The POB theological decision identifies the sexual language as a covenant metaphor for idolatry.
  - The next clause describes forsaking Yahweh and breaking his covenant.
  confidence: high
  alternatives_preserved:
  - The severe sexual metaphor is retained rather than reduced to generic unfaithfulness.
translation_notes:
  risk_flags:
  - risk: “In death” explains an image that the Hebrew leaves idiomatic.
    mitigation: The wording retains “lie down” and only supplies the meaning established by the POB rationale.
  - risk: “Prostitute themselves” may be mistaken for literal sexual commerce.
    mitigation: “By following the foreign gods” and the footnote clearly mark it as a metaphor for idolatry.
