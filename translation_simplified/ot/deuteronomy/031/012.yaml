translation:
  language: en
  text: Gather all the people together—the men, the women, the little children, and the resident foreigner living in your towns—so that they may hear and learn, fear Yahweh your God,[a] and carefully obey every word of this law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “revere Yahweh your God.” Here “fear” includes reverence and obedient awe.
    reason: lexical_alternative
