translation:
  language: en
  text: Be strong and courageous. Do not be afraid of them or terrified by them. Yahweh your God himself goes with you. He will not fail to support you or abandon you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not fear or be terrified because of them
  simplified_phrase: Do not be afraid of them or terrified by them
  preserved_meaning: The people must resist both fear and the stronger terror they feel in the presence of their enemies.
  reasoning_layer_used: POB lexical decisions for ירא, ערץ, and מִפְּנֵיהֶם
  rationale: This uses ordinary English, preserves the rise from fear to terror, and avoids making the enemies direct agents of emotion.
- pob_phrase: Yahweh your God is the one who goes with you
  simplified_phrase: Yahweh your God himself goes with you
  preserved_meaning: Yahweh is emphatically identified as personally accompanying his people.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Himself” preserves the Hebrew emphasis in natural English.
- pob_phrase: he will not fail you or forsake you
  simplified_phrase: He will not fail to support you or abandon you
  preserved_meaning: Yahweh will neither withdraw his support nor leave his people.
  reasoning_layer_used: POB lexical decision and twofold-assurance theological decision
  rationale: This explains “fail” and replaces “forsake” with familiar wording while keeping the assurances distinct.
interpretive_expansions:
- pob_phrase: he will not fail you
  rendering: He will not fail to support you
  claim: Yahweh will continue to uphold and help his people.
  evidence:
  - The POB lexical rationale describes the underlying image as not relaxing one’s hold.
  - POB footnote b says Yahweh will not fail to uphold them.
  confidence: high
  alternatives_preserved:
  - he will not let go of you
  - he will not drop you
