translation:
  language: en
  text: 'Then Moses called Joshua and spoke to him in front of all Israel: “Be strong and courageous, because you will enter the land with this people.[a] Yahweh swore to give this land to their fathers, and you will give it to the people as their inheritance.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you will bring this people into the land.” The Hebrew can mean either that Joshua will enter with them or that he will lead them in.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: said to him in the sight of all Israel
  simplified_phrase: spoke to him in front of all Israel
  preserved_meaning: Moses addressed Joshua publicly before the whole nation.
  reasoning_layer_used: lexical decision for לְעֵינֵי כָל יִשְׂרָאֵל
  rationale: “In front of” expresses the visible public setting in familiar English.
- pob_phrase: you will go with this people into the land
  simplified_phrase: you will enter the land with this people
  preserved_meaning: Joshua will enter alongside the people without resolving the wording as leadership causation.
  reasoning_layer_used: lexical and theological decision for תָּבוֹא אֶת הָעָם הַזֶּה
  rationale: The new clause order is more natural while retaining the chosen “with” reading.
- pob_phrase: the land that Yahweh swore to their fathers to give them, and you will give it to them as an inheritance
  simplified_phrase: Yahweh swore to give this land to their fathers, and you will give it to the people as their inheritance
  preserved_meaning: Yahweh’s oath to the fathers and Joshua’s role in granting the land as an inheritance remain distinct.
  reasoning_layer_used: lexical decisions for נִשְׁבַּע, אֲבֹתָם, and תַּנְחִילֶנָּה
  rationale: Two direct clauses replace a dense relative construction without losing the covenantal inheritance language.
translation_notes:
  risk_flags:
  - risk: “Enter the land with this people” may still be read as implying that Joshua leads them in.
    mitigation: The footnote preserves the documented alternative without changing the main source-driven reading.
