translation:
  language: en
  text: Yahweh himself goes ahead of you and will be with you. He will not fail you[a] or abandon you. Do not be afraid or discouraged.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He will not let you go.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yahweh himself is the one going before you. He himself will be with you
  simplified_phrase: Yahweh himself goes ahead of you and will be with you
  preserved_meaning: Yahweh personally precedes the hearer and remains present with him.
  reasoning_layer_used: Lexical decisions for הוּא, הַהֹלֵךְ, לְפָנֶיךָ, and יִהְיֶה עִמָּךְ
  rationale: The combined sentence removes the heavy emphatic construction while keeping Yahweh’s personal action and presence.
- pob_phrase: forsake you
  simplified_phrase: abandon you
  preserved_meaning: Yahweh will not leave the hearer behind.
  reasoning_layer_used: Lexical decision for יַעַזְבֶךָּ
  rationale: “Abandon” expresses the covenantal reassurance in more familiar English without merging it with “fail.”
- pob_phrase: Do not fear or be dismayed
  simplified_phrase: Do not be afraid or discouraged
  preserved_meaning: The hearer must not give way either to fear or to a loss of courage.
  reasoning_layer_used: Lexical decisions for לֹא תִירָא and תֵחָת
  rationale: The wording uses common English while preserving two distinct responses to danger.
translation_notes:
  risk_flags:
  - risk: “Discouraged” can sound less intense than the source sense of being dismayed or intimidated.
    mitigation: The paired command “Do not be afraid” retains the verse’s serious setting and force.
