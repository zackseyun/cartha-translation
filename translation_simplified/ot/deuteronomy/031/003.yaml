  text: Yahweh your God himself will cross over ahead of you.[a] He will destroy these nations in your path, and you will take possession of their land by driving them out. Joshua himself will cross over ahead of you, just as Yahweh has said.
  philosophy: optimal-equivalence
  footnotes:
