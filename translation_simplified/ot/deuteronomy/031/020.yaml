  text: For when I bring Israel into the land I swore to give his fathers—a land flowing with milk and honey—he will eat, have his fill, and grow fat. Then he will turn to other gods and serve them, and they will treat me with contempt and break my covenant.[a]
  philosophy: optimal-equivalence
