translation:
  language: en
  text: When all the people of Israel come before Yahweh your God at the place he will choose,[a] you must read this law aloud to them all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “to see the face of Yahweh your God,” an expression meaning to appear in his presence.
