simplification_decisions:
- pob_phrase: all Israel
  simplified_phrase: all the people of Israel
  preserved_meaning: Israel is the covenant people considered as a whole.
  reasoning_layer_used: POB lexical decision for כָל יִשְׂרָאֵל
  rationale: Adding “the people of” makes the collective expression immediately clear.
- pob_phrase: comes to appear before Yahweh your God
  simplified_phrase: come before Yahweh your God
  preserved_meaning: The people enter Yahweh’s presence for worship.
  reasoning_layer_used: POB lexical decision and footnote for לֵרָאוֹת אֶת פְּנֵי
  rationale: The shorter English expression conveys the idiom without suggesting that they see God’s face.
- pob_phrase: you shall read this law before all Israel in their hearing
  simplified_phrase: you must read this law aloud to them all
  preserved_meaning: The law is to be publicly read so the whole people can hear it.
  reasoning_layer_used: POB lexical decisions for תִּקְרָא, נֶגֶד כָּל יִשְׂרָאֵל, and בְּאָזְנֵיהֶם
  rationale: “Read aloud to them all” states the public and audible action in ordinary English.
