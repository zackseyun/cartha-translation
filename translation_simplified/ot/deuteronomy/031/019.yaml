  text: And now, write this song for yourselves. Teach it to the sons of Israel[a], and put it in their mouths so they can recite it. Do this so that the song will serve as a witness for me against the sons of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression can also be translated “the Israelites” and refers to the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or “among the sons of Israel”; the context favors “against.”
    reason: alternative_reading
