translation:
  language: en
  text: 'Moses gave them this command: “At the end of every seven years,[a] at the appointed time in the year of release,[b] during the Feast of Booths,[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the end of seven years”; the context indicates a cycle that repeats every seven years.
    reason: lexical_alternative
  - marker: b
    text: The “year of release” was the seventh year, traditionally called the sabbatical year.
    reason: cultural_note
  - marker: c
    text: Traditionally called the “Feast of Tabernacles.”
    reason: lexical_alternative
