translation:
  language: en
  text: I know that after I die, you will certainly become corrupt and leave the path I commanded you to follow.[a] In the days to come,[b] disaster will come upon you because you will do what Yahweh sees as evil, provoking him to anger by what you do with your hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “you will certainly act corruptly” or “corrupt yourselves.”
    reason: lexical_alternative
  - marker: b
    text: Or “in the latter days”; the phrase points to the future and may carry an end-times sense in some contexts.
    reason: lexical_alternative
