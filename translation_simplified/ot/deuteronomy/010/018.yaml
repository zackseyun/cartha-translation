translation:
  language: en
  text: He ensures that orphans[a] and widows receive justice. He loves foreigners who live among the Israelites and gives them food and clothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew specifically refers to those without a father.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: executes justice for the fatherless and the widow
  simplified_phrase: ensures that orphans and widows receive justice
  preserved_meaning: God actively secures the justice due to these vulnerable people.
  reasoning_layer_used: Lexical decisions for עֹשֶה, מִשְׁפַּט, and יָתוֹם
  rationale: This makes the judicial action clear while the footnote preserves the precise Hebrew category.
- pob_phrase: the sojourner
  simplified_phrase: foreigners who live among the Israelites
  preserved_meaning: They are non-native residents, not passing travelers.
  reasoning_layer_used: Lexical decision and POB footnote for גֵּר
  rationale: The descriptive phrase replaces an unfamiliar term without broadening it to all foreigners.
- pob_phrase: giving him food and clothing
  simplified_phrase: gives them food and clothing
  preserved_meaning: God shows his love through concrete provision of basic necessities.
  reasoning_layer_used: Lexical and theological decisions on provision
  rationale: A finite verb and plural pronoun make the action easier to follow.
interpretive_expansions:
