simplification_decisions:
- pob_phrase: Arise, go before the people for the journey
  simplified_phrase: Get up and set out ahead of the people
  preserved_meaning: Moses is commanded to begin the journey in front of the people.
  reasoning_layer_used: Lexical decisions for קוּם, לֵךְ, לְמַסַּע, and לִפְנֵי הָעָם
  rationale: Natural travel language retains both the command to depart and Moses’ place ahead of the people.
- pob_phrase: so that they may go in and take possession of
  simplified_phrase: so they can enter and take possession of
  preserved_meaning: The people are to move into the land and actively occupy it.
  reasoning_layer_used: Lexical decisions for וְיָבֹאוּ and וְיִרְשׁוּ
  rationale: “Enter” makes the movement clear while “take possession” preserves the second verb’s active force.
- pob_phrase: the land that I swore to their fathers to give to them
  simplified_phrase: the land I swore to their forefathers that I would give them
  preserved_meaning: Yahweh made an oath to Israel’s historically specific fathers that he would give them the land.
  reasoning_layer_used: Lexical and theological decisions for נִשְׁבַּעְתִּי and לַאֲבֹתָם, with POB footnote c
  rationale: The revised clause clearly distinguishes those who received the oath from the land promised in it.
