translation:
  language: en
  text: That is why the tribe of Levi has no share or inherited land among the other tribes of Israel. Yahweh himself is Levi’s inheritance, just as Yahweh your God said to Levi.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore Levi has no portion or inheritance with his brothers
  simplified_phrase: That is why the tribe of Levi has no share or inherited land among the other tribes of Israel
  preserved_meaning: Levi receives no territorial allotment alongside Israel’s other tribes.
  reasoning_layer_used: lexical decisions and cultural note
  rationale: The wording makes the representative tribal sense and land context immediately clear.
- pob_phrase: Yahweh is his inheritance
  simplified_phrase: Yahweh himself is Levi’s inheritance
  preserved_meaning: Levi’s inheritance is Yahweh rather than inherited land.
  reasoning_layer_used: lexical and theological decisions
  rationale: The repeated inheritance image and the personal divine name remain intact.
- pob_phrase: just as Yahweh your God spoke to him
  simplified_phrase: just as Yahweh your God said to Levi
  preserved_meaning: This arrangement accords with what Yahweh said to Levi.
  reasoning_layer_used: lexical decision
  rationale: “Said” is idiomatic, and naming Levi removes an unclear pronoun.
