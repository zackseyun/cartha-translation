  text: 'And now, Israel, what does Yahweh your God require of you? Only this: fear Yahweh your God,[a] walk in all his ways, love him, and serve Yahweh your God with all your heart and all your soul.[b]'
  philosophy: optimal-equivalence
  footnotes:
