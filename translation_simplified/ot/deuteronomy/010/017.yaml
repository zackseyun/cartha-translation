  preserved_meaning: God’s greatness and power evoke deep reverence and fear.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote
  rationale: The clause explains “awesome” in its biblical sense rather than its weakened modern sense.
- pob_phrase: who shows no partiality and takes no bribe
  simplified_phrase: He shows no favoritism and accepts no bribe.
  preserved_meaning: God judges without favoring anyone and cannot be influenced by payment.
  reasoning_layer_used: POB lexical decisions for the Hebrew idiom and legal language
  rationale: “Favoritism” and “accepts” are more familiar while keeping the judicial force.
- pob_phrase: For Yahweh your God is God of gods and Lord of lords
  simplified_phrase: For Yahweh your God is God of gods and Lord of lords.
  preserved_meaning: Yahweh is Israel’s God and is supreme over every god and lord.
  reasoning_layer_used: POB theological decisions on the divine name and title sequence
  rationale: The key supremacy formula and the personal name Yahweh remain unchanged.
