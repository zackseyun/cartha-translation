translation:
  language: en
  text: I remained on the mountain for forty days and forty nights, just as I had the first time. Yahweh listened to me[a] on that occasion too, and Yahweh was not willing to destroy you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “heard me.” The Hebrew can mean hearing someone and responding favorably.
    reason: lexical_alternative
