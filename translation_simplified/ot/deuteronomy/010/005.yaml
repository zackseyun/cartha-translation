translation:
  language: en
  text: Then I turned around and came down from the mountain. I put the tablets inside the ark I had made. They are there,[a] just as Yahweh commanded me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “they were there”; the wording may also mean that they remained there until Moses spoke these words.'
