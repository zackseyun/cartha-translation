simplification_decisions:
- pob_phrase: Then I turned and came down from the mountain
  simplified_phrase: Then I turned around and came down from the mountain
  preserved_meaning: Moses turned and descended from the mountain as the next action in the narrative.
  reasoning_layer_used: Lexical decisions for וָאֵפֶן and וָאֵרֵד מִן הָהָר
  rationale: “Turned around” expresses the change of direction in ordinary English while preserving the descent.
- pob_phrase: I put the tablets in the ark that I had made
  simplified_phrase: I put the tablets inside the ark I had made
  preserved_meaning: Moses placed the tablets within the ark he had already made.
  reasoning_layer_used: Lexical decisions for וָאָשִׂם, בָּאָרוֹן, and אֲשֶׁר עָשִׂיתִי
  rationale: “Inside” makes the implied placement into the ark immediately clear.
- pob_phrase: and they are there, just as Yahweh commanded me
  simplified_phrase: They are there, just as Yahweh commanded me
  preserved_meaning: The tablets were located in the ark in accordance with Yahweh’s command.
  reasoning_layer_used: Lexical decision for וַיִּהְיוּ שָׁם and theological decision for יְהוָה
  rationale: A separate sentence improves readability while preserving the deliberate present-perspective wording and Yahweh’s name.
