  preserved_meaning: The phrase still identifies Israel’s genealogical and national descendants.
  reasoning_layer_used: POB lexical decision for וּ/בְנֵי יִשְׂרָאֵל
  rationale: “Descendants” makes the Hebrew family expression clear without reducing it to a mere nationality label.
- pob_phrase: journeyed
  simplified_phrase: moved on
  preserved_meaning: Israel broke camp and continued along the wilderness route.
  reasoning_layer_used: POB lexical decision for נָסְעוּ
  rationale: “Moved on” naturally conveys departure and continued travel.
- pob_phrase: There Aaron died, and there he was buried; and Eleazar his son served as priest in his place.
  simplified_phrase: Aaron died there and was buried there. His son Eleazar served as priest in his place.
  preserved_meaning: Aaron died and was buried at that location, and Eleazar succeeded him in priestly service.
  reasoning_layer_used: POB lexical decisions for שָׁם, וַיִּקָּבֵר, וַיְכַהֵן, and תַּחְתָּיו
  rationale: Two short sentences preserve the repeated location, passive burial, priestly service, and succession.
