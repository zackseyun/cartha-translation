translation:
  language: en
  text: So listen to the voice of Yahweh your God, and carry out his commandments and laws that I am commanding you today.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “obey the voice of Yahweh your God.” This is an alternative for the first clause; the Hebrew expression “listen to the voice” often includes obeying what is heard.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do his commandments and his statutes
  simplified_phrase: carry out his commandments and laws
  preserved_meaning: Israel must put both Yahweh’s commandments and binding statutes into practice.
  reasoning_layer_used: POB lexical decisions for וְעָשִׂיתָ, מִצְוֺתָיו, and חֻקָּיו
  rationale: “Carry out” clarifies the required action, while “laws” is a familiar legal term for readers.
- pob_phrase: that I am commanding you today
  simplified_phrase: that I am commanding you today
  preserved_meaning: Moses is actively issuing these requirements at the present covenant moment.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר אָנֹכִי מְצַוְּךָ and הַיּוֹם
  rationale: Retaining “commanding” preserves both Moses’ explicit speech-act and its immediacy.
translation_notes:
  risk_flags:
  - risk: “Laws” is broader than the distinct legal term “statutes.”
    mitigation: The paired wording “commandments and laws” preserves two categories of Yahweh’s requirements.
  - risk: Modern readers may understand “listen” as hearing without obeying.
    mitigation: The footnote explains the idiom’s obedient force, while “carry out” reinforces it.
