translation:
  language: en
  text: Build the altar of Yahweh your God with whole stones.[a] Offer burnt offerings[b] to Yahweh your God on that altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “unhewn stones.” The Hebrew says “whole stones,” while the previous verse says that no iron tool may be used on them.
    reason: lexical_alternative
  - marker: b
    text: A burnt offering was an offering burned up on the altar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: You shall build the altar of Yahweh your God
  simplified_phrase: Build the altar of Yahweh your God
  preserved_meaning: The words remain a direct covenant command.
  reasoning_layer_used: The lexical decision identifies the Hebrew imperfect as directive in this legal context.
  rationale: A direct imperative is clearer modern English without weakening the command.
- pob_phrase: and you shall offer burnt offerings on it
  simplified_phrase: Offer burnt offerings ... on that altar
  preserved_meaning: The burnt offerings are to be presented on the altar just commanded.
  reasoning_layer_used: The lexical rationale supports the sacrificial sense of “offer,” and the immediate context identifies the altar.
  rationale: A new sentence and an explicit noun make the command and its reference easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “whole stones” to mean only stones that are not broken.
    mitigation: The footnote preserves “unhewn stones” and connects it to the ban on iron tools.
