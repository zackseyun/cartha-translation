translation:
  language: en
  text: The man[b] who makes a carved image or a cast image[a] and secretly sets it up is under a curse. This image, made by a craftsman’s hands, is an abomination to Yahweh. Then all the people must respond, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a molten image”; the Hebrew refers to an image formed by casting, often in metal.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the man,” using the masculine singular as a representative legal formula.
    reason: lexical_alternative
