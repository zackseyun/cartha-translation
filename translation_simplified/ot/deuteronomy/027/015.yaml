  simplified_phrase: The man who makes ... and secretly sets it up is under a curse
  preserved_meaning: The maker and secret installer of the image comes under the covenant curse.
  reasoning_layer_used: Lexical decisions for אָרוּר, הָאִישׁ, וְשָׂם, and בַּסָּתֶר
  rationale: The sentence is reordered into natural English while retaining the legal force and representative masculine form.
- pob_phrase: an abomination to Yahweh, the work of the hands of a craftsman
  simplified_phrase: This image, made by a craftsman’s hands, is an abomination to Yahweh
  preserved_meaning: The human-made image is abhorrent to Yahweh.
  reasoning_layer_used: Lexical decisions for תּוֹעֲבַת יְהוָה and מַעֲשֵׂה יְדֵי חָרָשׁ
  rationale: A separate sentence makes the condemnation and human manufacture easier to follow.
- pob_phrase: all the people shall answer and say
