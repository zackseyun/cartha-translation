translation:
  language: en
  text: Anyone who does not uphold[a] the words of this law by obeying them is cursed. Then all the people must say, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uphold” can also mean “confirm” or “establish.” Here it means maintaining the law’s authority through obedience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Cursed is the one who
  simplified_phrase: Anyone who ... is cursed
  preserved_meaning: The covenant curse applies to every person who meets the stated condition.
  reasoning_layer_used: Lexical decision for אֲשֶׁר and covenant-curse syntax
  rationale: Ordinary English places the person and condition before the declaration of the curse.
- pob_phrase: by doing them
  simplified_phrase: by obeying them
  preserved_meaning: Upholding the law requires putting its words into practice.
  reasoning_layer_used: Lexical and theological decisions for לַעֲשׂוֹת אֹתָם
  rationale: “Obeying” states the intended kind of doing clearly without merging it with “uphold.”
- pob_phrase: all the people shall say
  simplified_phrase: all the people must say
  preserved_meaning: The whole assembly is directed to give the prescribed response.
  reasoning_layer_used: Lexical decision for וְאָמַר כָּל הָעָם
  rationale: “Must say” makes the directive force clear in common English.
translation_notes:
  risk_flags:
  - risk: “Must say” may sound more explicitly obligatory than the traditional “shall say.”
    mitigation: The wording preserves the directive force identified for the covenant ceremony.
