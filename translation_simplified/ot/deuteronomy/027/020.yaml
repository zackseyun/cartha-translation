    text: “Uncovered his father’s covering” is a Hebrew sexual euphemism. Here it presents sexual relations with his father’s wife as a violation of his father’s marital and sexual sphere; compare “uncovering nakedness” in Leviticus 18:8 and 20:11.
    reason: simplification_note
