  text: Anyone who has sexual relations with his father’s wife[a] is cursed, because he has uncovered his father’s covering.[b] Then all the people are to say, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: His father’s wife may be his stepmother, but the Hebrew does not specify that relationship.
    reason: lexical_alternative
