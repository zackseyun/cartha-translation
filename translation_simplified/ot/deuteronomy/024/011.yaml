translation:
  language: en
  text: You must stand outside. The man you are lending to[a] must bring the item he is giving as security out to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the man who owes you.” The Hebrew can emphasize either your lending or his debt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall stand outside, and
  simplified_phrase: You must stand outside.
  preserved_meaning: The creditor is commanded to remain outside the debtor’s house.
  reasoning_layer_used: Lexical decision for בַּחוּץ and תַּעֲמֹד
  rationale: A separate sentence makes the concrete legal command easier to follow.
- pob_phrase: the man to whom you are making the loan
  simplified_phrase: The man you are lending to
  preserved_meaning: The wording presents the addressee as the creditor and the man as the debtor.
  reasoning_layer_used: Lexical decision for אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  rationale: The shorter wording expresses the same creditor-debtor relationship in common English.
- pob_phrase: the pledge
  simplified_phrase: the item he is giving as security
  preserved_meaning: The debtor brings an item that secures the loan.
  reasoning_layer_used: Lexical decision for הָעֲבוֹט
  rationale: Explaining the legal term prevents readers from mistaking “pledge” for a promise.
