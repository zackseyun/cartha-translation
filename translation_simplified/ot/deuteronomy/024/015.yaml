translation:
  language: en
  text: Pay him his wages that same day. Do not let the sun go down before you pay him, because he is poor and his life depends on that pay.[a] Otherwise, he may cry out to Yahweh against you, and you will be guilty of sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures the worker lifting or carrying his life toward his wages, expressing his urgent dependence on them.
    reason: lexical_alternative
