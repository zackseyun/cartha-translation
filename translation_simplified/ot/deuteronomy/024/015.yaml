- pob_phrase: You shall give him his wages on his day
  simplified_phrase: Pay him his wages that same day
  preserved_meaning: The worker must receive his earned pay on the day it is due.
  reasoning_layer_used: POB lexical decision and rationale for בְּיוֹמוֹ
  rationale: This makes the immediate payment requirement clear in ordinary English.
- pob_phrase: the sun shall not go down on it
  simplified_phrase: Do not let the sun go down before you pay him
  preserved_meaning: Payment must be made before sunset.
  reasoning_layer_used: POB lexical rationale for וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  rationale: This identifies what must happen before sunset while retaining the source image.
- pob_phrase: it becomes sin in you
  simplified_phrase: you will be guilty of sin
  preserved_meaning: Failure to pay makes the employer morally responsible for sin.
  reasoning_layer_used: POB lexical decision and review finding for וְהָיָה בְךָ חֵטְא
  rationale: This directly assigns the moral consequence to the employer without an unclear pronoun.
