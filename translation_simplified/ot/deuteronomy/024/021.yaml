translation:
  language: en
  text: When you harvest the grapes in your vineyard, do not make a second pass to collect what remains. Leave it for the foreigners living among you, those without fathers, and widows.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall not go over it again after yourself
  simplified_phrase: do not make a second pass to collect what remains
  preserved_meaning: The vineyard owner must not return after the first harvest to take the grapes left behind.
  reasoning_layer_used: POB lexical decision for לֹא תְעוֹלֵל and אַחֲרֶיךָ
  rationale: This states the agricultural action plainly without the potentially confusing word “glean.”
- pob_phrase: the sojourner
  simplified_phrase: the foreigners living among you
  preserved_meaning: The beneficiaries include non-native residents who live within Israel.
  reasoning_layer_used: POB lexical decision and cultural footnote for לַגֵּר
  rationale: This replaces an unfamiliar traditional term while retaining its resident status.
- pob_phrase: the fatherless, and the widow
  simplified_phrase: those without fathers, and widows
  preserved_meaning: The remaining grapes are reserved for socially vulnerable people who lack customary family support.
  reasoning_layer_used: POB lexical decisions for לַיָּתוֹם and וְלָאַלְמָנָה
  rationale: Natural wording clarifies “fatherless” while preserving it as distinct from widowhood.
interpretive_expansions:
- pob_phrase: it shall be for
  rendering: Leave it for
  claim: The owner must leave the remaining grapes available for the named groups.
  evidence:
