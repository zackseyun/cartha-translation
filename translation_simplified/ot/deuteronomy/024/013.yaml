translation:
  language: en
  text: You must return his cloak—the security you took for the loan—by sunset. Then he can sleep in it and bless you. This will count as righteousness for you before Yahweh your God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You must surely return the pledge to him at sunset
  simplified_phrase: You must return his cloak—the security you took for the loan—by sunset
  preserved_meaning: The command remains emphatic, and the pledged item is identified as the cloak securing the loan.
  reasoning_layer_used: Lexical decisions for הָשֵׁב תָּשִׁיב, הַעֲבוֹט, and בְּשַׂלְמָתוֹ
  rationale: “Must” keeps the command's force while the added explanation makes “pledge” immediately clear.
- pob_phrase: so that he may lie down in his cloak and bless you
  simplified_phrase: Then he can sleep in it and bless you
  preserved_meaning: Returning the cloak enables its owner to use it at night and respond with blessing.
  reasoning_layer_used: Lexical decisions for וְשָׁכַב, בְּשַׂלְמָתוֹ, and וּבֵרֲכֶךָּ
  rationale: The result is recast in ordinary English without losing either sleeping or blessing.
- pob_phrase: it will be righteousness for you before Yahweh your God
  simplified_phrase: This will count as righteousness for you before Yahweh your God
  preserved_meaning: God regards obedience to this command as righteous conduct.
  reasoning_layer_used: Lexical decision for וּלְךָ תִּהְיֶה צְדָקָה and theological decision for Yahweh
  rationale: “Count as” clarifies the relation while retaining the biblical term “righteousness.”
