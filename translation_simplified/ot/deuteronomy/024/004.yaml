translation:
  language: en
  text: Her first husband, who sent her away, must not marry her again after she has been defiled.[a] That would be an abomination before Yahweh. You must not bring sin on the land Yahweh your God is giving you as an inheritance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “after she has become unclean” or “after she has been made impure.” The Hebrew does not specify the exact nature of the defilement.
    reason: lexical_alternative
