- pob_phrase: may not take her again to be his wife
  simplified_phrase: must not marry her again
  preserved_meaning: The first husband is forbidden to remarry her.
  reasoning_layer_used: Lexical decision on לָשׁוּב לְקַחְתָּהּ and the marital context
  rationale: The clearer modern wording states the same legal prohibition.
- pob_phrase: for that is an abomination before Yahweh
  simplified_phrase: That would be an abomination before Yahweh.
  preserved_meaning: The forbidden remarriage is detestable in Yahweh’s presence.
  reasoning_layer_used: Lexical decision on תוֹעֵבָה and theological decision on יְהוָה
  rationale: A separate sentence clarifies the reference while retaining the strong covenant term and divine name.
- pob_phrase: you shall not bring sin upon the land
  simplified_phrase: You must not bring sin on the land
  preserved_meaning: Israel must not make the inherited land bear guilt through this act.
  reasoning_layer_used: Lexical decision on וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  rationale: Modern legal wording and a common preposition make the command easier to read without weakening it.
