translation:
  language: en
  text: When a man has just married, he must not go out with the army or be assigned any other public duty. For one year, he must be exempt from these obligations for his household,[a] and he must bring joy to his wife.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he must remain exempt at home for one year.” The Hebrew may emphasize either his household or his remaining at home.
    reason: lexical_alternative
