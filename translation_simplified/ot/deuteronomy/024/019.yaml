translation:
  language: en
  text: When you are cutting the grain in your field and accidentally leave behind a bundle of cut grain, do not go back to get it. Leave it for the foreigner living among you,[a] the fatherless child, and the widow, so that Yahweh your God may bless you in all the work of your hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term means a non-native resident living among Israel; it may also be translated “sojourner” or “resident alien.”
    reason: lexical_alternative
