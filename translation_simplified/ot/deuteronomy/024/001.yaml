translation:
  language: en
  text: If a man marries a woman and she does not please him because he finds something indecent[a] about her, and if he writes her a divorce certificate, places it in her hand, and sends her away from his home,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is deliberately broad and may also mean “something shameful” or “a matter of indecency.”
    reason: lexical_alternative
