translation:
  language: en
  text: Fathers must not be put to death because of their sons,[a] and sons must not be put to death because of their fathers. Each man may be put to death only for his own sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons,” though the principle also applies to children more broadly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall not be put to death for
  simplified_phrase: must not be put to death because of
  preserved_meaning: A family member's offense cannot be the basis for another family member's execution.
  reasoning_layer_used: Lexical decision for עַל and theological decision on capital punishment
  rationale: “Because of” makes the basis of punishment clearer while retaining the judicial scope.
- pob_phrase: each man shall be put to death for his own sin
  simplified_phrase: each man may be put to death only for his own sin
  preserved_meaning: Capital punishment is limited to the condemned man's own offense.
  reasoning_layer_used: Theological decision on individual liability
  rationale: “May” and “only” prevent the sentence from sounding like every sin requires execution.
interpretive_expansions:
- pob_phrase: for his own sin
  rendering: only for his own sin
  claim: The contrast excludes execution for another family member's offense.
  evidence:
  - The two preceding clauses forbid transferring capital liability between fathers and sons.
  - The POB rationale identifies individual liability as the verse's controlling principle.
  confidence: high
  alternatives_preserved:
  - for his own sin
translation_notes:
  risk_flags:
  - risk: “May be put to death” could sound like broad permission rather than a limit on judicial liability.
    mitigation: The word “only” and the two prohibitions make the restrictive legal sense clear.
