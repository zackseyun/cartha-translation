translation:
  language: en
  text: When there is an outbreak of skin disease,[a] pay very close attention and do everything the Levitical priests instruct you to do. Be careful to follow their instructions, just as I commanded them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated “leprosy.” The Hebrew term covers a broader range of skin conditions and does not refer only to modern Hansen’s disease.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Be careful in the case of an outbreak of skin disease
  simplified_phrase: When there is an outbreak of skin disease, pay very close attention
  preserved_meaning: The warning applies whenever such a skin condition appears and retains the emphatic call for care.
  reasoning_layer_used: Lexical decisions for הִשָּׁמֶר and לִשְׁמֹר מְאֹד
  rationale: The conditional wording and direct command are easier to follow than the POB clause structure.
- pob_phrase: to observe very carefully and to do according to all that the Levitical priests instruct you
  simplified_phrase: pay very close attention and do everything the Levitical priests instruct you to do
  preserved_meaning: The people must both attend carefully to the priests’ guidance and carry it out fully.
  reasoning_layer_used: Lexical decisions for לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת and כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  rationale: Ordinary verbs preserve the Hebrew emphasis on attentive obedience and action.
- pob_phrase: as I have commanded them, so you shall be careful to do
  simplified_phrase: Be careful to follow their instructions, just as I commanded them
  preserved_meaning: The people must follow the priests, whom Moses had commanded concerning these instructions.
  reasoning_layer_used: Lexical decision for כַּאֲשֶׁר צִוִּיתִם and applied revisions
  rationale: A separate sentence removes the dense comparison while keeping Moses’ prior command to the priests.
