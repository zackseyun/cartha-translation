    mitigation: The footnote preserves the broader Hebrew sense and warns against identifying it only with Hansen’s disease.
  - risk: The pronoun “them” could momentarily seem to refer to the instructions rather than the priests.
    mitigation: The immediately preceding named subject, “the Levitical priests,” supplies the intended plural personal antecedent.
