  simplified_phrase: You are not ... because you are righteous or because your heart is upright
  preserved_meaning: Israel's possession is not based on its moral righteousness or inner integrity.
  reasoning_layer_used: Lexical decisions for בְצִדְקָתְךָ and וּבְיֹשֶׁר לְבָבְךָ
  rationale: The recast uses direct clauses while preserving both distinct grounds that are denied.
- pob_phrase: you are going in to possess their land
  simplified_phrase: You are ... entering their land and taking possession of it
  preserved_meaning: Israel is about to enter the land for the purpose of possessing it.
  reasoning_layer_used: Lexical decision for בָא לָרֶשֶׁת
  rationale: The two coordinated actions make the movement and purpose immediately clear.
- pob_phrase: and in order to confirm the word that Yahweh swore to your fathers
  simplified_phrase: and to keep the promise he swore to your fathers
  preserved_meaning: Yahweh acts faithfully to fulfill his pledged word to the patriarchs.
  reasoning_layer_used: Lexical decisions for וּלְמַעַן הָקִים, הַדָּבָר אֲשֶׁר נִשְׁבַּע, and לַאֲבֹתֶיךָ
