translation:
  language: en
  text: You are not entering their land and taking possession of it because you are righteous or because your heart is upright. Instead, Yahweh your God is driving these nations out before you[a] because of their wickedness and to keep the promise he swore to your fathers—Abraham, Isaac, and Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is taking their land away from them before you.”
    reason: lexical_alternative
