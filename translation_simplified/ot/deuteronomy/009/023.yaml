translation:
  language: en
  text: When Yahweh sent you from Kadesh-barnea, he said, “Go up and take possession of the land I have given you.” But you rebelled against the command of Yahweh your God. You did not believe[a] him or listen to his voice.[b]
  philosophy: optimal-equivalence
  footnotes:
