translation:
  language: en
  text: Listen, Israel! Today you are crossing the Jordan to enter and take possession of the land by driving out nations larger and stronger than you.[a] Their cities are large and fortified as high as the heavens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses one verb that here includes both taking possession and dispossessing the nations already there.
    reason: simplification_note
  - marker: b
    text: “As high as the heavens” is a vivid way of describing extremely high fortifications.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Hear, Israel
  simplified_phrase: Listen, Israel!
  preserved_meaning: Israel receives a direct, solemn summons to pay attention.
  reasoning_layer_used: POB lexical decision for שְׁמַע
  rationale: “Listen” is an approved alternative that is immediately clear in modern English.
- pob_phrase: to go in to dispossess nations greater and mightier than you
  simplified_phrase: to enter and take possession of the land by driving out nations larger and stronger than you
  preserved_meaning: Israel will enter the land and possess it by displacing nations superior in size and strength.
  reasoning_layer_used: POB lexical decisions for לָבֹא, לָרֶשֶׁת, and גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  rationale: The wording clearly states both the possession and displacement included in the conquest verb.
- pob_phrase: with cities great and fortified up to the heavens
  simplified_phrase: Their cities are large and fortified as high as the heavens.
  preserved_meaning: The nations have large cities whose fortifications are portrayed as extraordinarily high.
  reasoning_layer_used: POB theological decision on hyperbolic fortifications
  rationale: A separate sentence identifies whose cities they are while preserving the biblical image.
interpretive_expansions:
- pob_phrase: to go in to dispossess nations
  rendering: to enter and take possession of the land by driving out nations
  claim: Crossing the Jordan leads to possessing the land through dispossessing its nations.
  evidence:
  - The POB rationale says ירשׁ here means taking possession by dispossessing prior occupants.
  - Crossing the Jordan and going in contextually identify entry into the land.
  confidence: high
  alternatives_preserved:
  - dispossess nations
  - take possession of
translation_notes:
  risk_flags:
