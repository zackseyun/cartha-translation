translation:
  language: en
  text: When Yahweh your God drives these nations out ahead of you, do not say in your heart, “Yahweh has brought me into this land to possess it because I am righteous.” Instead, Yahweh is driving them out ahead of you because of their wickedness.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because of my righteousness
  simplified_phrase: because I am righteous
  preserved_meaning: Israel must not claim that its own moral merit earned the land.
  reasoning_layer_used: POB lexical and theological decisions on בְּצִדְקָתִי
  rationale: The adjective is easier in ordinary English while preserving the key concept of righteousness.
- pob_phrase: from before you / before you
  simplified_phrase: out ahead of you
  preserved_meaning: Yahweh removes the nations occupying the land in Israel's path.
  reasoning_layer_used: POB lexical decision on מִלְּפָנֶיךָ and מִפָּנֶיךָ
  rationale: This replaces an unnatural spatial idiom with clear modern wording.
- pob_phrase: while because of the wickedness of these nations Yahweh is dispossessing them
  simplified_phrase: Instead, Yahweh is driving them out ... because of their wickedness
  preserved_meaning: The nations' wickedness, not Israel's righteousness, explains their removal.
  reasoning_layer_used: POB contrastive-waw rationale and lexical decisions on רִשְׁעָה and מוֹרִישָׁם
  rationale: A new sentence makes the contrast clear and replaces the technical word “dispossessing.”
interpretive_expansions:
- pob_phrase: drives them out
  rendering: drives these nations out
  claim: The initial pronoun refers to the nations named later in the verse.
  evidence:
  - The following clause explicitly identifies those being removed as “these nations.”
  confidence: high
translation_notes:
