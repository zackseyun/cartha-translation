simplification_decisions:
- pob_phrase: So I prayed to Yahweh and said
  simplified_phrase: 'So I prayed to Yahweh:'
  preserved_meaning: Moses addressed the following prayer to Yahweh.
  reasoning_layer_used: POB lexical decision for the narrative verbs
  rationale: A colon naturally introduces the prayer without repeating the speech formula.
- pob_phrase: your people and your inheritance
  simplified_phrase: your people, who are your inheritance
  preserved_meaning: Israel is Yahweh’s people and also belongs to him as his allotted people.
  reasoning_layer_used: POB lexical rationale for נַחֲלָה
  rationale: The relative clause makes clear that both descriptions refer to the same people.
- pob_phrase: whom you redeemed by your greatness, whom you brought out of Egypt
  simplified_phrase: You redeemed them by your greatness and brought them out of Egypt
  preserved_meaning: Yahweh redeemed this people by his greatness and brought them out of Egypt.
  reasoning_layer_used: POB lexical decisions for פדה, גֹּדֶל, and the exodus formula
  rationale: A new sentence and a pronoun make the two acts easier to follow without merging them.
translation_notes:
  risk_flags:
  - risk: “Inheritance” may suggest property received after someone’s death.
    mitigation: The clause identifies the inheritance as Yahweh’s people while preserving the covenant concept.
  - risk: “Strong hand” may be understood as a literal body reference.
    mitigation: The source image remains because it vividly expresses Yahweh’s power in the exodus.
