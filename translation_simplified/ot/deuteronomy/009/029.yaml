translation:
  language: en
  text: But they are your people, and they are your inheritance.[a] You brought them out by your great power and your outstretched arm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also begin, “And they are your people.” “But” brings out the contrast in Moses’ plea.
    reason: lexical_alternative
  - marker: b
    text: “Outstretched arm” is a biblical image of the LORD acting powerfully to deliver his people.
    reason: cross_reference
simplification_decisions:
- pob_phrase: your people and your inheritance
  simplified_phrase: your people, and they are your inheritance
  preserved_meaning: Israel is both the LORD’s covenant people and his inheritance.
  reasoning_layer_used: lexical and theological decisions on עַמְּךָ and נַחֲלָתֶךָ
  rationale: Repeating “they are” makes the two related claims easier to follow without weakening “inheritance.”
- pob_phrase: whom you brought out
  simplified_phrase: You brought them out
  preserved_meaning: The LORD delivered these same people in the exodus.
  reasoning_layer_used: lexical decision on הוֹצֵאתָ
  rationale: A new sentence removes the dense relative clause while preserving the exodus action.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “inheritance” only in the sense of property received after a death.
    mitigation: The wording is retained because it carries the covenant meaning established by the POB reasoning.
  - risk: “Outstretched arm” may sound physically literal to some readers.
    mitigation: The footnote identifies it as a biblical image of powerful deliverance.
