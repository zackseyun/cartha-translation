translation:
  language: en
  text: 'So know this today: Yahweh your God is crossing over ahead of you. He is a consuming fire. He will destroy them and bring them down before you. You will take their land from them and quickly wipe them out, just as Yahweh told you.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: is the one crossing over before you, a consuming fire
  simplified_phrase: is crossing over ahead of you. He is a consuming fire.
  preserved_meaning: Yahweh personally goes ahead of Israel, and his holy presence brings destructive judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences preserve both the crossing image and the consuming-fire image.
- pob_phrase: he will subdue them before you
  simplified_phrase: bring them down before you
  preserved_meaning: Yahweh will defeat the nations in Israel's presence.
  reasoning_layer_used: POB lexical decision for יַכְנִיעֵם
  rationale: The clearer phrase keeps the military sense rather than suggesting inward humility.
- pob_phrase: you will dispossess them and make them perish quickly
  simplified_phrase: You will take their land from them and quickly wipe them out
  preserved_meaning: Israel will remove the nations from their territory and cause their rapid destruction.
  reasoning_layer_used: POB lexical decisions for וְהוֹרַשְׁתָּם, וְהַאֲבַדְתָּם, and מַהֵר
  rationale: Common wording explains the territorial action while retaining the distinct destructive action.
translation_notes:
  risk_flags:
  - risk: “Wipe them out” may sound especially severe to modern readers.
    mitigation: It is an audited POB lexical alternative and retains the causative force of the Hebrew.
