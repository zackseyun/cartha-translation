translation:
  language: en
  text: Then I threw myself down before Yahweh, just as I had done before. For forty days and forty nights, I ate no bread and drank no water. I did this because of all the sin you had committed by doing what was evil in Yahweh’s sight and provoking him to anger.
  philosophy: optimal-equivalence
