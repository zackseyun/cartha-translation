translation:
  language: en
  text: Leave me alone, so I can destroy them and erase their name from the earth.[a] Then I will make you into a nation stronger and more numerous than they are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “from under the heavens,” meaning removal from the earth and from human existence and memory.
    reason: cultural_note
simplification_decisions:
- pob_phrase: so that I may destroy them and blot out their name
  simplified_phrase: so I can destroy them and erase their name
  preserved_meaning: God directly declares his intent to destroy the people and remove their name.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Erase” keeps the image of removing a written name while using more familiar English.
- pob_phrase: from under the heavens
  simplified_phrase: from the earth
  preserved_meaning: Their existence and remembrance among humanity would be removed.
  reasoning_layer_used: POB cultural footnote and lexical rationale
  rationale: The main text states the idiom’s intended sense, while the footnote preserves its Hebrew form.
- pob_phrase: mightier and more numerous
  simplified_phrase: stronger and more numerous
  preserved_meaning: The promised nation would surpass Israel in both power and population.
  reasoning_layer_used: POB lexical decisions for עָצוּם and וָרָב
  rationale: “Stronger” is more common than “mightier” and keeps the comparison of power.
interpretive_expansions:
