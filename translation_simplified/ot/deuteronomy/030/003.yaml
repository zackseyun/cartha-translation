translation:
  language: en
  text: Then Yahweh your God will restore your well-being and show you compassion. He will gather you back from all the peoples among whom he scattered you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “He will return and gather you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: restore your fortunes
  simplified_phrase: restore your well-being
  preserved_meaning: Yahweh will reverse their distress and restore their condition.
  reasoning_layer_used: POB lexical and theological decisions on the Hebrew restoration idiom
  rationale: “Well-being” avoids suggesting only money or possessions.
- pob_phrase: have compassion on you
  simplified_phrase: show you compassion
  preserved_meaning: Yahweh will act toward them with compassionate mercy.
  reasoning_layer_used: POB lexical decision for וְרִחֲמֶךָ
  rationale: The active wording is direct and natural in modern English.
- pob_phrase: gather you again from all the peoples where
  simplified_phrase: gather you back from all the peoples among whom
  preserved_meaning: Yahweh will regather his people from those among whom they were scattered.
  reasoning_layer_used: POB lexical decisions for וְשָׁב, וְקִבֶּצְךָ, and מִכָּל הָעַמִּים
  rationale: “Gather you back” clearly expresses restored return while retaining “peoples.”
