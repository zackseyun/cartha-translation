  simplified_phrase: and you will take possession of it
  preserved_meaning: Israel will actively come to possess the land.
  reasoning_layer_used: POB lexical decision for וִירִשְׁתָּהּ
  rationale: The fuller phrase is more natural here and preserves the active covenantal occupation sense.
- pob_phrase: and he will prosper you and multiply you more than your fathers
  simplified_phrase: He will prosper you and make you more numerous than your fathers.
  preserved_meaning: Yahweh will bless Israel and increase its population beyond that of its fathers.
  reasoning_layer_used: POB lexical decisions for וְהֵיטִבְךָ, וְהִרְבְּךָ, and מֵאֲבֹתֶיךָ
  rationale: A new sentence and common wording make the two blessings easier to understand.
