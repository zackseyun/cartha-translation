translation:
  language: en
  text: Yahweh your God will bring you into the land your fathers possessed,[a] and you will take possession of it. He will prosper you[b] and make you more numerous than your fathers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “inherited” or “took possession of.”
    reason: lexical_alternative
  - marker: b
    text: Or “do good to you.”
    reason: lexical_alternative
