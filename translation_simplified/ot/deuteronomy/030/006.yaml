translation:
  language: en
  text: Yahweh your God will circumcise your heart and the hearts of your descendants,[a] transforming both you and them inwardly, so that you may love Yahweh your God with all your heart and all your soul, and so that you may live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “circumcise your heart” is a covenant image for God transforming you inwardly and leading you to wholehearted devotion.
    reason: cultural_note
