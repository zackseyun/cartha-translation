translation:
  language: en
  text: When he hears the words of this oath[a], he tells himself that he is blessed and says, “I will have peace, even though I stubbornly follow my own heart.” The result will be that the well-watered are swept away along with the thirsty.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this curse.” The Hebrew can refer to an oath that carries a curse.
    reason: alternative_reading
  - marker: b
    text: This difficult image may refer to watered land and dry land being destroyed together—that is, everything being destroyed alike.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he blesses himself in his heart
  simplified_phrase: he tells himself that he is blessed
  preserved_meaning: He inwardly declares a blessing upon himself.
  reasoning_layer_used: Lexical decision for וְהִתְבָּרֵךְ בִּלְבָבוֹ
  rationale: This expresses the reflexive inward blessing in ordinary English.
- pob_phrase: though I walk in the stubbornness of my heart
  simplified_phrase: even though I stubbornly follow my own heart
  preserved_meaning: He continues in stubborn self-direction despite hearing the oath.
  reasoning_layer_used: Lexical decision for שְׁרִרוּת לִבִּי
  rationale: This clarifies the heart idiom without weakening its stubbornness.
- pob_phrase: so as to sweep away the well-watered with the thirsty
  simplified_phrase: The result will be that the well-watered are swept away along with the thirsty
  preserved_meaning: The presumption leads to destruction while the difficult contrast remains unresolved.
  reasoning_layer_used: Lexical decision for לְמַעַן and theological decision on הָרָוָה אֶת־הַצְּמֵאָה
  rationale: The result wording avoids assigning destructive intent to the offender while preserving the image.
