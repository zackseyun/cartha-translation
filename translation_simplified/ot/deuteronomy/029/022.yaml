  language: en
  text: The whole land is covered with sulfur and salt; it is a burned-out wasteland. No seed is planted there, nothing sprouts, and no grass grows. It is like the destruction of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and wrath.
