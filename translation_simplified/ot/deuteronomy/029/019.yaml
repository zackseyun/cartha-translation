translation:
  language: en
  text: Yahweh will refuse to forgive him, because then Yahweh’s anger and jealousy will burn against that man. Every curse[a] written in this book will settle on him, and Yahweh will blot his name out from the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “curse” means a curse invoked as part of the covenant oath.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will not be willing to forgive him
  simplified_phrase: will refuse to forgive him
  preserved_meaning: Yahweh is unwilling, not unable, to forgive him.
  reasoning_layer_used: Lexical decision for יֹאבֶה
  rationale: “Refuse” states the volitional force in direct modern English.
- pob_phrase: for then the anger of Yahweh and his jealousy will burn against that man
  simplified_phrase: because then Yahweh’s anger and jealousy will burn against that man
  preserved_meaning: The wording retains both the explanatory connection and the ensuing judgment against the individual offender.
  reasoning_layer_used: Lexical decision for כִּי אָז and theological decisions on judgment imagery and gender
  rationale: “Because then” preserves the causal and temporal force while easing the sentence.
- pob_phrase: will blot out his name from under heaven
  simplified_phrase: will blot his name out from the earth
  preserved_meaning: Yahweh will erase the man’s name from earthly existence and remembrance.
  reasoning_layer_used: Lexical decisions for וּמָחָה אֶת שְׁמוֹ and מִתַּחַת הַשָּׁמָיִם
  rationale: “From the earth” makes the stock Hebrew expression immediately understandable.
translation_notes:
  risk_flags:
  - risk: “From the earth” replaces the literal spatial expression “from under heaven.”
    mitigation: The lexical audit identifies removal from the earth as the expression’s contextual meaning.
