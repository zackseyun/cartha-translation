  text: Moses called all Israel together and said, “You have seen with your own eyes everything Yahweh did in the land of Egypt to Pharaoh, all his servants, and his whole land.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against Pharaoh, all his servants, and his whole land.” The Hebrew can emphasize that Yahweh’s acts brought judgment on them.
