translation:
  language: en
  text: They went and served other gods and bowed down to them—gods they had never known and that God had not assigned to them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “gods that had not been assigned to them.” The Hebrew leaves the subject unstated, but it most likely refers to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gods whom they had not known
  simplified_phrase: gods they had never known
  preserved_meaning: These gods had no previous relational or covenantal connection with Israel.
  reasoning_layer_used: lexical decision for ידע
  rationale: The simpler wording remains relational rather than describing mere lack of information.
- pob_phrase: whom he had not allotted to them
  simplified_phrase: that God had not assigned to them
  preserved_meaning: God had not given these gods any authorized place among Israel.
  reasoning_layer_used: lexical and theological decisions for חלק and its implicit subject
  rationale: “Assigned” is clearer than “allotted,” while “God” identifies the likely unstated subject.
- pob_phrase: served other gods and bowed down to them
  simplified_phrase: served other gods and bowed down to them
  preserved_meaning: Israel both served the gods and physically expressed worship by bowing.
  reasoning_layer_used: lexical decisions for עבד and שׁחה
  rationale: Both actions remain distinct because replacing them with one word would erase the Hebrew image.
interpretive_expansions:
- pob_phrase: he had not allotted to them
  rendering: God had not assigned to them
  claim: The unstated singular subject is God.
  evidence:
  - The Hebrew verb is singular and has no expressed subject.
  - The POB theological decision identifies God as the most natural subject in context.
  confidence: high
  alternatives_preserved:
  - The gods had not been assigned to them.
translation_notes:
  risk_flags:
  - risk: Naming God in the main text could appear to remove the Hebrew subject ambiguity.
    mitigation: The footnote preserves the possible subjectless passive-style reading.
  - risk: Modern readers may take “known” as mere awareness rather than covenantal relationship.
    mitigation: “Never known” preserves the POB wording without adding commentary to the verse.
