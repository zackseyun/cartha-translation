translation:
  language: en
  text: He makes this covenant not only with everyone standing here with us today before Yahweh our God, but also with everyone who is not here with us today.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Those not present may include absent Israelites, future generations, or both.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: but with whoever
  simplified_phrase: He makes this covenant not only with everyone
  preserved_meaning: The covenant includes the people named here rather than being limited to the group addressed in the previous verse.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Restating the governing action makes the dependent clause clear, while “not only” preserves the inclusive contrast.
- pob_phrase: whoever is standing here with us today
  simplified_phrase: everyone standing here with us today
  preserved_meaning: The concrete posture and physical presence of the assembled people remain explicit.
  reasoning_layer_used: lexical decisions for עֹמֵד and פֹּה עִמָּנוּ
  rationale: “Everyone” is more natural here than the distributive singular “whoever.”
- pob_phrase: and with whoever is not here with us today
  simplified_phrase: but also with everyone who is not here with us today
  preserved_meaning: The wording includes absent persons without deciding whether they are contemporaries, future generations, or both.
  reasoning_layer_used: theological decision on covenant scope
  rationale: The broad wording preserves the source text’s intentional openness.
interpretive_expansions:
- pob_phrase: but with whoever
  rendering: He makes this covenant not only with everyone
  claim: The covenant-making action and the first half of the inclusive contrast are supplied from the previous verse.
  evidence:
  - The POB rationale carries “with” forward from the preceding covenant formula.
  - The preceding negation “not with you alone” establishes an inclusive contrast.
  confidence: high
  alternatives_preserved:
  - but also with everyone
translation_notes:
  risk_flags:
  - risk: The words “He makes this covenant not only” restate context not repeated in this verse.
    mitigation: They restore the governing action and inclusive contrast from the immediately preceding covenant formula.
