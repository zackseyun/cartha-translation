translation:
  language: en
  text: The things that are hidden belong to the LORD our God. But the things that have been revealed belong to us and our children forever, so that we may obey everything this law says.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “This law” may also be translated “this instruction”; it means the covenant teaching Moses gave Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The hidden things
  simplified_phrase: The things that are hidden
  preserved_meaning: Some matters remain concealed from human knowledge.
  reasoning_layer_used: Lexical decision for הַנִּסְתָּרֹת
  rationale: The full clause is easier for common readers while keeping the image of hidden matters.
- pob_phrase: so that we may do all the words of this law
  simplified_phrase: so that we may obey everything this law says
  preserved_meaning: God revealed the specific covenant commands so Israel would carry them out.
  reasoning_layer_used: Lexical decisions for לַעֲשׂוֹת and כָּל דִּבְרֵי הַתּוֹרָה
  rationale: “Obey everything this law says” clearly expresses acting on all its words.
- pob_phrase: The hidden things belong ... but the revealed things belong
  simplified_phrase: The things that are hidden belong ... But the things that have been revealed belong
  preserved_meaning: The contrast remains between what belongs to God alone and what was disclosed to Israel.
  reasoning_layer_used: Theological decision on the scope of revelation
  rationale: Two sentences make the contrast easier to follow without defining either category more narrowly.
translation_notes:
  risk_flags:
  - risk: “Obey” is more direct than the source image of doing the law’s words.
    mitigation: “Everything this law says” preserves the emphasis on all the specific covenant words.
