translation:
  language: en
  text: This is so that you may enter Yahweh your God’s covenant and come under his oath.[a] Yahweh your God is making this covenant with you today.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “oath” can also mean an oath that includes covenant curses or penalties.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “cutting,” an ancient expression for making a covenant.
    reason: cultural_note
