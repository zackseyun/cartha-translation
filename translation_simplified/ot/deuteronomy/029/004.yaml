translation:
  language: en
  text: I led you in the wilderness for forty years. The clothes you wore did not wear out, and neither did the sandal on your foot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew changes from plural “you” to singular “your” in the last clause, perhaps addressing Israel as one people or each person individually.
    reason: lexical_alternative
