translation:
  language: en
  text: Instead, the father must acknowledge the firstborn, the son of the unloved wife.[a] He must give him twice the share of everything he owns, because this son is the first expression of his father's strength. The right of the firstborn belongs to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “the hated wife,” but here it likely means the wife who is loved less.
    reason: lexical_alternative
