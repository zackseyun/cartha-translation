  reasoning_layer_used: Lexical decision for יַכִּיר and contextual decision for the first כִּי
  rationale: “Instead” shows the contrast, and “must acknowledge” conveys the legal requirement.
- pob_phrase: by giving him a double portion of all that is found to belong to him
  simplified_phrase: He must give him twice the share of everything he owns
  preserved_meaning: The firstborn must receive two inheritance shares from the father's property.
  reasoning_layer_used: Lexical decisions for פִּי שְׁנַיִם and בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  rationale: This states the inheritance rule in ordinary English.
- pob_phrase: the firstfruits of his vigor
