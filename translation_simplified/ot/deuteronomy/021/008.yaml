translation:
  language: en
  text: Yahweh, make atonement for your people Israel, whom you redeemed. Do not let the guilt of shedding innocent blood remain among them. Then their bloodguilt will be atoned for.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the blood will be atoned for them.” Here “the blood” means liability for the bloodshed.
    reason: lexical_alternative
