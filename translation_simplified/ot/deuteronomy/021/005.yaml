translation:
  language: en
  text: The priests, who are descendants of Levi, must come forward. Yahweh your God has chosen them to serve him as priests and to pronounce blessings in Yahweh’s name. Their word will settle every dispute and every case involving injury.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean a blow, an assault, or an affliction; here it probably refers broadly to bodily harm.
    reason: lexical_alternative
