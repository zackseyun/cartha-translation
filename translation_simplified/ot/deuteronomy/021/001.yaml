translation:
  language: en
  text: If a man who has been killed is found lying in an open field in the land Yahweh your God is giving you to possess,[a] and no one knows who struck him,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a person who has been killed.” The Hebrew says “man,” though the law’s principle concerns an unidentified killing generally.
    reason: lexical_alternative
