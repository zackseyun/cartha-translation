translation:
  language: en
  text: But if you do not want her, you must let her go wherever she wishes. You must never sell her for money or treat her like something to be bought and sold, because you have humiliated her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because you have violated her.” The Hebrew may refer to humiliation, affliction, or sexual violation in this context.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: if it happens that you do not delight in her
  simplified_phrase: if you do not want her
  preserved_meaning: The man no longer takes pleasure in or desires the woman.
  reasoning_layer_used: POB lexical decision for לֹא חָפַצְתָּ בָּהּ
  rationale: “Want her” expresses the personal desire plainly without adding a sexual meaning.
- pob_phrase: you shall let her go where she wishes
  simplified_phrase: you must let her go wherever she wishes
  preserved_meaning: She must be released and allowed to decide where to go.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording makes both her freedom and personal agency immediately clear.
- pob_phrase: You must not treat her as merchandise
  simplified_phrase: or treat her like something to be bought and sold
  preserved_meaning: He may not turn her into an object of commercial exploitation.
  reasoning_layer_used: POB lexical decision for לֹא תִתְעַמֵּר בָּהּ
  rationale: The concrete wording explains “merchandise” while preserving the economic-objectifying force.
