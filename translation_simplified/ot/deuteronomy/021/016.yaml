translation:
  language: en
  text: When a man assigns his property to his sons as an inheritance, he must not give firstborn status to the loved wife’s son instead of the hated wife’s son,[a] who is the firstborn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew contrasts “loved” and “hated.” In this family-law context, “hated” may mean unloved or less loved rather than actively detested.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: on the day he gives his sons as an inheritance what belongs to him
  simplified_phrase: When a man assigns his property to his sons as an inheritance
  preserved_meaning: The man causes his sons to inherit the property that belongs to him.
  reasoning_layer_used: Lexical decisions for הַנְחִילוֹ and אֵת אֲשֶׁר יִהְיֶה לוֹ
  rationale: “Assigns” clearly describes the inheritance act without implying that the man has died.
- pob_phrase: he may not treat ... as firstborn
  simplified_phrase: he must not give firstborn status to
  preserved_meaning: The law forbids granting another son the legal standing and rights of the firstborn.
  reasoning_layer_used: Lexical decisions for לֹא יוּכַל and לְבַכֵּר
  rationale: This wording makes the prohibition and legal status clear.
- pob_phrase: over the son of the hated wife
  simplified_phrase: instead of the hated wife’s son
  preserved_meaning: The loved wife’s son may not displace the actual firstborn son.
  reasoning_layer_used: Lexical decision for עַל פְּנֵי and theological decision on the relational contrast
  rationale: “Instead of” clearly expresses the forbidden preference while retaining “hated.”
