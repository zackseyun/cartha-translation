translation:
  language: en
  text: Do not leave his corpse hanging on the tree overnight. You must bury him that same day, because a hanged man is under God's curse.[a] Do not defile the land Yahweh your God is giving you as an inheritance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the hanged man is cursed by God”; alternatively, “hanging is an affront to God.” The brief Hebrew phrase can be understood in more than one way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: His corpse shall not remain all night on the tree
  simplified_phrase: Do not leave his corpse hanging on the tree overnight
  preserved_meaning: The dead body must not remain displayed on the tree through the night.
  reasoning_layer_used: Lexical decisions for תָלִין, נִבְלָתוֹ, and עַל הָעֵץ
  rationale: The direct command and “overnight” express the prohibition in ordinary English while retaining “corpse” and “tree.”
- pob_phrase: you shall surely bury him that same day
  simplified_phrase: You must bury him that same day
  preserved_meaning: Burial before nightfall is an emphatic requirement.
  reasoning_layer_used: Lexical decision for קָבוֹר תִּקְבְּרֶנּוּ and בַּיּוֹם הַהוּא
  rationale: “Must” naturally carries the Hebrew command's emphatic force.
- pob_phrase: and you shall not defile your land that Yahweh your God is giving you as an inheritance
  simplified_phrase: Do not defile the land Yahweh your God is giving you as an inheritance
  preserved_meaning: Israel must not contaminate the covenant land granted by Yahweh.
  reasoning_layer_used: Lexical decisions for תְטַמֵּא, אַדְמָתְךָ, יְהוָה, and נַחֲלָה
  rationale: The shorter sentence keeps the purity language, divine name, and inherited-land concept intact.
translation_notes:
