translation:
  language: en
  text: He humbled you and let you go hungry. Then he fed you the food called manna, which neither you nor your ancestors had ever known. He did this to teach you that man[a] does not live by bread alone. Instead, man lives by every word that comes from the mouth of Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Man” here means humanity in general, not males only.
    reason: cultural_note
  - marker: b
    text: Or, “by everything that comes from the mouth of Yahweh.” The Hebrew expression is broader than “word” alone.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he humbled you and let you hunger and fed you
  simplified_phrase: He humbled you and let you go hungry. Then he fed you
  preserved_meaning: Yahweh both allowed Israel's hunger and provided food as part of his humbling work.
  reasoning_layer_used: Lexical decisions for וַיְעַנְּךָ, וַיַּרְעִבֶךָ, and וַיַּאֲכִלְךָ
  rationale: Two short sentences make the sequence clear while preserving divine agency.
- pob_phrase: which you had not known, nor had your fathers known
  simplified_phrase: which neither you nor your ancestors had ever known
  preserved_meaning: The manna was unfamiliar to both that generation and earlier generations.
  reasoning_layer_used: Lexical rationale for אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  rationale: “Neither” removes the awkward clause order, and “ancestors” makes the generational sense immediate.
- pob_phrase: so that he might make you know
  simplified_phrase: He did this to teach you
  preserved_meaning: Yahweh used the wilderness experience to bring Israel to understanding.
  reasoning_layer_used: Lexical rationale for לְמַעַן הוֹדִעֲךָ
  rationale: “Teach you” naturally expresses the stated pedagogical force.
