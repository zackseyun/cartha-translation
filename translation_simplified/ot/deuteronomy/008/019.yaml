  reasoning_layer_used: POB lexical decision for וְהָיָה אִם and שָׁכֹחַ תִּשְׁכַּח
  rationale: “But if you do forget” sounds natural while still stressing the warning.
- pob_phrase: go after other gods
  simplified_phrase: follow other gods
  preserved_meaning: It describes giving allegiance to other gods while retaining the idea of going after them.
  reasoning_layer_used: POB lexical decision for וְהָלַכְתָּ אַחֲרֵי
  rationale: “Follow” communicates the idiom more directly to modern readers.
- pob_phrase: that you will surely perish
  simplified_phrase: you will certainly perish
  preserved_meaning: The outcome remains an emphatically certain warning of perishing.
  reasoning_layer_used: POB lexical decision for כִּי אָבֹד תֹּאבֵדוּן
  rationale: A colon makes the testimony’s content clear, and “certainly” expresses the Hebrew emphasis naturally.
