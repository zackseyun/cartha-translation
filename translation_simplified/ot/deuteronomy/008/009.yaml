translation:
  language: en
  text: a land where you will not eat bread in poverty and where you will lack nothing; a land whose stones are iron and from whose hills you will dig out copper.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean copper or bronze. Copper is used here because it is extracted from the earth, while bronze is an alloy.
    reason: lexical_alternative
