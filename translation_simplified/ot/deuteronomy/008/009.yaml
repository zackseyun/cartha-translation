- pob_phrase: in which you will not eat bread in poverty
  simplified_phrase: where you will not eat bread in poverty
  preserved_meaning: They will eat bread without living under conditions of deprivation.
  reasoning_layer_used: Lexical decisions for בְמִסְכֵּנֻת and לֶחֶם
  rationale: This natural clause keeps both the concrete bread and the direct promise that it will not be eaten in poverty.
- pob_phrase: whose stones are iron
  simplified_phrase: whose stones are iron
  preserved_meaning: The land has iron-bearing stone, expressed through the Hebrew image.
  reasoning_layer_used: Lexical decision for אֲבָנֶיהָ בַרְזֶל
  rationale: The vivid image is retained because an explanatory replacement would weaken the source wording.
- pob_phrase: from whose hills you will quarry copper
  simplified_phrase: from whose hills you will dig out copper
  preserved_meaning: The people will extract copper from the land's hills.
  reasoning_layer_used: Lexical decisions for תַּחְצֹב and נְחֹשֶׁת
  rationale: “Dig out” clearly conveys extraction in more familiar language than “quarry.”
