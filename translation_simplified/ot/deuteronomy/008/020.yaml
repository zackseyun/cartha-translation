translation:
  language: en
  text: Just as Yahweh is destroying the nations ahead of you, you too will perish, because you did not listen to the voice of Yahweh your God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “listen to the voice” here includes obeying.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Like the nations that Yahweh is destroying before you, so you will perish
  simplified_phrase: Just as Yahweh is destroying the nations ahead of you, you too will perish
  preserved_meaning: Israel will share the nations’ fate if it rejects Yahweh.
  reasoning_layer_used: Lexical decisions for כַּגּוֹיִם, מַאֲבִיד, מִפְּנֵיכֶם, כֵּן, and תֹאבֵדוּן.
  rationale: The recast comparison is easier to follow while retaining the matching destruction language.
- pob_phrase: did not listen to the voice of
  simplified_phrase: did not listen to the voice of
  preserved_meaning: The Hebrew idiom involves both hearing Yahweh and obeying him.
  reasoning_layer_used: Lexical and theological decisions for שׁמע בקול.
  rationale: The covenant image of listening to Yahweh’s voice remains, while the footnote explains its obedient force.
translation_notes:
