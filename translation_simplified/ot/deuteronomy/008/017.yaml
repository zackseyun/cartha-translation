- pob_phrase: My power and the strength of my hand have gotten me this wealth
  simplified_phrase: I gained this wealth by my own power and the strength of my hand
  preserved_meaning: The speaker wrongly credits personal ability for gaining material wealth.
  reasoning_layer_used: Lexical decisions for עָשָׂה לִי and הַחַיִל, plus the covenant-warning rationale
  rationale: Recasting the abilities as the means of gaining wealth makes the claim natural without changing its meaning.
- pob_phrase: the strength of my hand
  simplified_phrase: the strength of my hand
  preserved_meaning: The concrete hand image expresses personal force or ability.
  reasoning_layer_used: Lexical rationale for וְעֹצֶם יָדִי
  rationale: The image is retained because replacing it entirely with an abstraction would weaken the Hebrew wording.
