simplification_decisions:
- pob_phrase: and you say in your heart
  simplified_phrase: You may say to yourself
  preserved_meaning: The warning concerns inward, self-directed thought.
  reasoning_layer_used: Lexical rationale for וְאָמַרְתָּ and בִּלְבָבֶךָ
