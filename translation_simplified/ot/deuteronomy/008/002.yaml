translation:
  language: en
  text: Remember the whole journey Yahweh your God led you on through the wilderness for forty years. He did this to humble you and test you, and to know what was in your heart—whether you would keep his commandments or not.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to reveal what was in your heart.” The Hebrew literally says “to know,” as in the main text.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall remember all the way
  simplified_phrase: Remember the whole journey
  preserved_meaning: Israel is commanded to recall the entire course of the wilderness experience.
  reasoning_layer_used: Lexical decision for וְזָכַרְתָּ and כָּל הַדֶּרֶךְ
  rationale: A direct command and “whole journey” are clearer in modern English.
- pob_phrase: has led you these forty years in the wilderness
  simplified_phrase: led you on through the wilderness for forty years
  preserved_meaning: Yahweh guided Israel throughout the forty-year wilderness period.
  reasoning_layer_used: Lexical decisions for הֹלִיכֲךָ, זֶה אַרְבָּעִים שָׁנָה, and בַּמִּדְבָּר
  rationale: The revised order states the journey and its duration naturally.
- pob_phrase: in order to humble you, to test you, to know
  simplified_phrase: He did this to humble you and test you, and to know
  preserved_meaning: The wilderness journey served the stated purposes of humbling, testing, and knowing Israel’s heart.
  reasoning_layer_used: Lexical and theological decisions for לְמַעַן, עַנֹּתְךָ, לְנַסֹּתְךָ, and לָדַעַת
  rationale: A new sentence clarifies that Yahweh’s leading had these purposes without resolving “to know.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “to know” as denying God’s prior knowledge.
    mitigation: The main text preserves the Hebrew tension, while the footnote gives the documented alternative “to reveal.”
