translation:
  language: en
  text: Carefully obey every command I am giving you today, so that you may live, grow numerous, and enter and possess[b] the land Yahweh promised to your fathers with an oath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your fathers” means Israel’s forefathers, especially the patriarchs.
    reason: lexical_alternative
  - marker: b
    text: Or “inherit”; the Hebrew can refer to inheriting or taking possession.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: carefully keep every commandment
  simplified_phrase: carefully obey every command
  preserved_meaning: Israel must attentively carry out all that is commanded.
  reasoning_layer_used: Lexical decisions for תִּשְׁמְרוּן and לַעֲשׂוֹת
  rationale: “Obey” states in common English the action already included in POB’s “keep.”
- pob_phrase: live and multiply
  simplified_phrase: live, grow numerous
  preserved_meaning: Obedience is linked with Israel’s survival and increase in population.
  reasoning_layer_used: Lexical decision for וּרְבִיתֶם
  rationale: “Grow numerous” makes the population sense of “multiply” immediately clear.
- pob_phrase: the land that Yahweh swore to your fathers
  simplified_phrase: the land Yahweh promised to your fathers with an oath
  preserved_meaning: Yahweh bound himself by oath concerning the land promised to Israel’s fathers.
  reasoning_layer_used: Lexical decision for נִשְׁבַּע and theological decisions on Yahweh and fathers
  rationale: The wording explains “swore” while retaining the covenant oath, divine name, and masculine kinship term.
translation_notes:
  risk_flags:
