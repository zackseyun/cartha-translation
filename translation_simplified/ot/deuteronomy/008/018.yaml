translation:
  language: en
  text: But remember Yahweh your God. He is the one who gives you the power to gain wealth.[a] He does this so that he may establish the covenant he swore to your fathers,[b] as you can see today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “produce wealth,” or more broadly, “achieve success.”
    reason: lexical_alternative
  - marker: b
    text: “Your fathers” refers specifically to Israel’s covenant ancestors, the patriarchs.
    reason: cultural_note
