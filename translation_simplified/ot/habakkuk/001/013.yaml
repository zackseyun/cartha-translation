translation:
  language: en
  text: Your eyes are too pure to watch evil, and you cannot look at wrongdoing. Why, then, do you watch those who act treacherously? Why do you remain silent when a wicked person swallows up someone more righteous than he is?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: look on evil ... gaze at wrongdoing
  simplified_phrase: watch evil ... look at wrongdoing
  preserved_meaning: God's purity is morally incompatible with evil, without implying that he is unaware of it.
  reasoning_layer_used: lexical and theological decisions
  rationale: Common verbs clarify the poetic contrast while preserving its rhetorical tension.
- pob_phrase: the treacherous
  simplified_phrase: those who act treacherously
  preserved_meaning: The people in view behave faithlessly and deceitfully.
  reasoning_layer_used: lexical decision for בּוֹגְדִים
  rationale: Expanding the adjective makes the moral charge immediately understandable.
- pob_phrase: the wicked swallows up one more righteous than he
  simplified_phrase: a wicked person swallows up someone more righteous than he is
  preserved_meaning: The predatory image and the comparison in relative righteousness both remain intact.
  reasoning_layer_used: lexical decisions for בְּבַלַּע, רָשָׁע, and צַדִּיק מִמֶּנּוּ
  rationale: Natural English identifies both people clearly without suggesting absolute innocence.
translation_notes:
  risk_flags:
  - risk: “Watch” could be mistaken for detached observation rather than the verse's poetic language of looking upon evil.
    mitigation: The parallel wording and question about silence preserve the prophet's complaint about apparent non-intervention.
