  text: 'Then he rushes past like the wind[b] and moves on. He becomes guilty: he treats his own strength as his god.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he becomes guilty, crediting this strength to his god,” or “his strength belongs to his god.” The Hebrew is brief and can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word can mean “wind” or “spirit”; here it describes swift, forceful movement like the wind.
    reason: lexical_alternative
