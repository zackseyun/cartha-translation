translation:
  language: en
  text: So he worships his net by offering sacrifices to it, and he burns incense to his dragnet. He does this because they give him a rich share and plenty of food.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “his share is fat, and his food is rich.” Hebrew uses fatness as a picture of abundance and prosperity.
    reason: lexical_alternative
