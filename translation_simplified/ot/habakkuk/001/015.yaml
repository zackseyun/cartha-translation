translation:
  language: en
  text: He pulls all of them up with a hook. He drags one of them away with his net and gathers him in with his dragnet.[a] So he rejoices and celebrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts from all the captured prey as a group to one individual and uses two different words for fishing nets.
    reason: source_note
