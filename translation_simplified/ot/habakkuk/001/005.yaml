translation:
  language: en
  text: Look among the nations[a] and pay close attention. Be astonished—be utterly amazed! In your lifetime, I am doing a work[b] that you would not believe even if someone told you about it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Look at the nations.”
    reason: lexical_alternative
  - marker: b
    text: Or, “a work is being done.” The context supports understanding the LORD as the one doing it.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Look among the nations and see
  simplified_phrase: Look among the nations and pay close attention
  preserved_meaning: The hearers are summoned both to look and to observe carefully.
  reasoning_layer_used: Lexical decision for רְאוּ and וְהַבִּיטוּ
  rationale: “Pay close attention” makes the second command’s focused looking clear without awkward repetition.
- pob_phrase: be astonished, be astounded
  simplified_phrase: Be astonished—be utterly amazed!
  preserved_meaning: The repeated Hebrew command strongly intensifies the expected amazement.
  reasoning_layer_used: Theological decision on the emphatic astonishment commands
  rationale: The paired wording and “utterly” preserve the Hebrew emphasis in natural English.
- pob_phrase: in your days
  simplified_phrase: In your lifetime
  preserved_meaning: The work will happen during the time of those being addressed.
  reasoning_layer_used: Lexical decision for בִּימֵיכֶם
  rationale: “In your lifetime” communicates the temporal immediacy more directly to modern readers.
interpretive_expansions:
- pob_phrase: if it were told
  rendering: even if someone told you about it
  claim: A report of the coming work would still seem unbelievable.
  evidence:
  - The POB lexical rationale identifies the clause as conditional and stresses the unbelievability of a mere report.
  - The passive Hebrew verb allows an unspecified person as the teller.
  confidence: high
  alternatives_preserved:
  - if it were told
  - though it were recounted
translation_notes:
  risk_flags:
  - risk: “In your lifetime” is less formally literal than “in your days.”
    mitigation: The POB lexical decision explicitly lists it as an equivalent expressing temporal immediacy.
  - risk: Supplying “I” identifies the LORD as the implicit subject.
    mitigation: The footnote preserves the passive alternative while the main text follows the POB contextual decision.
