translation:
  language: en
  text: The vision will be fulfilled at the appointed time. It rushes toward its fulfillment[a] and will not prove false. If it delays, wait for it.[b] It will certainly come; it will not be late.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may picture the vision panting toward the end or speaking of the end.
    reason: lexical_alternative
  - marker: b
    text: Or “wait for him.” The Hebrew most naturally refers to the vision here, though Hebrews 10:37 applies the words personally.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the vision is still for the appointed time
  simplified_phrase: The vision will be fulfilled at the appointed time
  preserved_meaning: The vision awaits the fixed time for its fulfillment.
  reasoning_layer_used: Lexical decision for לַמּוֹעֵד and immediate context
  rationale: The rewrite makes the vision’s relation to the appointed time immediately clear.
- pob_phrase: it hastens toward the end
  simplified_phrase: It rushes toward its fulfillment
  preserved_meaning: The vision moves urgently toward its destined completion.
  reasoning_layer_used: Lexical decisions for וְיָפֵחַ and לַקֵּץ
  rationale: “Rushes” keeps the motion image while “fulfillment” clarifies the intended end.
- pob_phrase: If it delays, wait for it, for it will surely come
  simplified_phrase: If it delays, wait for it. It will certainly come
  preserved_meaning: The apparent delay calls for patient waiting without weakening the certainty of fulfillment.
  reasoning_layer_used: Lexical decisions for אִם יִתְמַהְמָהּ and כִּי בֹא יָבֹא
  rationale: The active verb preserves the personification, and “certainly” conveys the Hebrew emphasis.
