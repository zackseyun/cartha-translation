translation:
  language: en
  text: Woe to anyone who tells a piece of wood, “Wake up!” and commands a silent stone, “Get up!” Can this idol teach? Look at it. Gold and silver cover it, but there is no breath at all inside it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “breath” can also mean “wind” or “spirit.” Here it stresses that the idol has no life in it.
    reason: lexical_alternative
