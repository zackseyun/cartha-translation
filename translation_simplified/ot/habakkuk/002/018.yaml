translation:
  language: en
  text: What good is an idol? Its maker carved it. It is a cast image that teaches lies. The one who formed it trusts in it, making idols that cannot speak.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What profit is an idol when its maker has carved it
  simplified_phrase: What good is an idol? Its maker carved it.
  preserved_meaning: The rhetorical question denies any benefit from an idol and points to its human origin.
  reasoning_layer_used: Lexical decisions for מָה הוֹעִיל and כִּי פְסָלוֹ יֹצְרוֹ
  rationale: Two short sentences make the question and its explanatory reason easier to follow.
- pob_phrase: a cast image and a teacher of lies
  simplified_phrase: It is a cast image that teaches lies.
  preserved_meaning: The idol is personified as misleading its worshipers.
  reasoning_layer_used: Lexical and theological decisions for וּמוֹרֶה שָּׁקֶר
  rationale: A direct clause makes the metaphor clear while preserving its force.
- pob_phrase: mute idols
  simplified_phrase: idols that cannot speak
  preserved_meaning: The handmade idols are unable to speak.
  reasoning_layer_used: Lexical decision for אִלְּמִים
  rationale: The explanatory phrase is more immediately understandable than “mute.”
translation_notes:
  risk_flags:
  - risk: “Teaches lies” could be mistaken for literal speech by the idol.
    mitigation: The closing phrase “cannot speak” preserves the personification and its irony.
