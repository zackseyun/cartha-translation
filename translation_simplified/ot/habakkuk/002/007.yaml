translation:
  language: en
  text: Won’t the people you owe[a] suddenly rise up? Won’t those who make you tremble wake up? Then they will take you as plunder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “those who bite you” and may suggest both attacking enemies and creditors demanding payment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your creditors
  simplified_phrase: the people you owe
  preserved_meaning: These are people with a claim for payment against the plunderer.
  reasoning_layer_used: POB lexical decision for נֹשְׁכֶיךָ
  rationale: The wording explains the economic relationship without requiring knowledge of “creditors.”
- pob_phrase: Will not your creditors suddenly rise, and those who make you tremble awake?
  simplified_phrase: Won’t the people you owe suddenly rise up? Won’t those who make you tremble wake up?
  preserved_meaning: Both groups suddenly become active against the plunderer in a rhetorical question expecting yes.
  reasoning_layer_used: POB syntax and lexical rationales for הֲלוֹא, יָקוּמוּ, and וְיִקְצוּ
  rationale: Two short questions make the poetic parallel easy to follow while retaining its force.
- pob_phrase: you will become plunder for them
  simplified_phrase: they will take you as plunder
  preserved_meaning: The former plunderer will himself be seized as spoil.
  reasoning_layer_used: POB lexical decisions for וְהָיִיתָ, לִמְשִׁסּוֹת, and לָמוֹ
  rationale: The active wording states the reversal in more natural English.
translation_notes:
  risk_flags:
  - risk: “The people you owe” does not itself preserve the Hebrew image of biting.
    mitigation: The footnote retains the image and its possible double meaning.
