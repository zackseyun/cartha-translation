translation:
  language: en
  text: Moreover, wine betrays.[a] The arrogant man does not stay at rest.[b] He makes his appetite as wide as Sheol, the realm of the dead. Like death, he is never satisfied. He gathers all the nations for himself and collects all the peoples for himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wine is treacherous” or “wine deceives.” The brief Hebrew line is difficult and may also point to the conqueror’s drunken arrogance.
    reason: lexical_alternative
  - marker: b
    text: Or “does not stay at home” or “does not remain.” The Hebrew verb is difficult and suggests restless instability here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an arrogant man does not remain at rest
  simplified_phrase: The arrogant man does not stay at rest
  preserved_meaning: The arrogant man is restlessly unsettled, without implying that he is unable to rest.
  reasoning_layer_used: POB lexical decision for וְלֹא יִנְוֶה and grounding review
  rationale: This keeps the descriptive negation while using a more natural phrase.
- pob_phrase: He enlarges his appetite like Sheol
  simplified_phrase: He makes his appetite as wide as Sheol, the realm of the dead
  preserved_meaning: His voracious desire expands like the insatiable realm of the dead.
  reasoning_layer_used: POB lexical and theological decisions for הִרְחִיב, נַפְשׁוֹ, and שְׁאוֹל
  rationale: The wording preserves the widening image and briefly explains Sheol.
- pob_phrase: He gathers to himself all the nations and collects to himself all the peoples
  simplified_phrase: He gathers all the nations for himself and collects all the peoples for himself
  preserved_meaning: He acquisitively brings every nation and people under his control.
  reasoning_layer_used: POB lexical decisions for אֵלָיו and the nations/peoples parallel
  rationale: “For himself” makes the acquisitive force clear while preserving both parallel clauses.
