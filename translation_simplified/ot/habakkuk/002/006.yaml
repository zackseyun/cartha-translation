  preserved_meaning: The people openly ridicule the oppressor through pointed, puzzling sayings.
  reasoning_layer_used: Lexical decisions for מָשָׁל, מְלִיצָה, and חִידוֹת
  rationale: The active wording is easier to follow while retaining the formal taunt and riddle imagery.
- pob_phrase: heaps up what is not his
