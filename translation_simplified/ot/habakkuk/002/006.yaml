translation:
  language: en
  text: Won’t all of them mock him with taunts and riddles? They will say, “Woe to the one who piles up what belongs to others—how long can this go on?—and weighs himself down with goods taken as security for debts!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “weighs himself down with thick clay.” The rare Hebrew term may be wordplay linking debt with a heavy burden.
    reason: lexical_alternative
