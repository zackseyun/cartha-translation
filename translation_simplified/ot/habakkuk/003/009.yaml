translation:
  language: en
  text: Your bow is uncovered. The rods are sworn by a spoken command.[a] Selah.[b] You split the earth open with rivers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may instead mean “oaths to the tribes were spoken,” or something similar; the word translated “rods” can also mean “tribes.”
    reason: alternative_reading
  - marker: b
    text: Selah is an untranslated poetic or musical term whose precise meaning is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: Your bow is laid bare
  simplified_phrase: Your bow is uncovered
  preserved_meaning: God’s bow is exposed and ready for use.
  reasoning_layer_used: Lexical decisions for עֶרְיָה and תֵעוֹר
  rationale: “Is uncovered” states the martial image in direct, familiar English.
- pob_phrase: the rods are sworn by command
  simplified_phrase: The rods are sworn by a spoken command
  preserved_meaning: The disputed line retains the linked ideas of rods, oath, and authoritative speech.
  reasoning_layer_used: Theological decision on שְׁבֻעוֹת מַטּוֹת אֹמֶר
  rationale: “Spoken” clarifies the command while leaving the uncertain relationship among the terms unresolved.
- pob_phrase: You split the earth with rivers
  simplified_phrase: You split the earth open with rivers
  preserved_meaning: God forcefully cleaves the earth by means of rivers.
  reasoning_layer_used: Lexical decisions for נְהָרוֹת, תְּבַקַּע, and אָרֶץ
  rationale: “Open” makes the force of “split” immediately clear.
