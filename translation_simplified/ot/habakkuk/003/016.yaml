translation:
  language: en
  text: I heard, and deep inside I trembled. At the sound, my lips quivered. Rot enters my bones, and I tremble where I stand. I wait quietly[a] for the day of distress, when the people who will invade us come against us.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I rest for the day of distress.” The Hebrew can mean “rest” or “be quiet,” but here it describes quiet waiting for approaching trouble.
    reason: alternative_reading
  - marker: b
    text: Or “the people who attack us” or “the raiding people.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my inward parts trembled
  simplified_phrase: deep inside I trembled
  preserved_meaning: The prophet experiences a visceral, bodily reaction of fear.
  reasoning_layer_used: Lexical decision for בטן as the inner or visceral center.
  rationale: “Deep inside” communicates the bodily reaction more naturally than “inward parts.”
- pob_phrase: and beneath me I tremble
  simplified_phrase: and I tremble where I stand
  preserved_meaning: The prophet shakes with such fear that his stance is unsteady.
  reasoning_layer_used: Lexical rationale for תחתַי as instability beneath the prophet.
  rationale: The recast clause makes the image understandable without removing his physical trembling.
- pob_phrase: for the coming up of the people who will invade us
  simplified_phrase: when the people who will invade us come against us
  preserved_meaning: An invading people are advancing to attack the prophet’s community.
  reasoning_layer_used: Lexical decisions for עלה as an advancing force and גדד as invading or raiding.
  rationale: “Come against us” states the military movement in common English.
interpretive_expansions:
- pob_phrase: beneath me
  rendering: where I stand
  claim: The phrase refers to the prophet’s unstable stance as he trembles.
  evidence:
