translation:
  language: en
  text: Yahweh, I have heard what has been told about you, and I stand in awe.[a] Yahweh, bring your work to life again during these years; during these years, make it known. When you are angry, remember to show mercy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “I am afraid” and includes reverent fear as well as awe.
    reason: lexical_alternative
  - marker: b
    text: The phrase translated “When you are angry” may also mean “in turmoil” or “in rage.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the report of you
  simplified_phrase: what has been told about you
  preserved_meaning: Habakkuk has heard an account concerning Yahweh, not merely heard of his reputation.
  reasoning_layer_used: POB lexical decision for שִׁמְעֲךָ
  rationale: The rewrite expresses the report in ordinary English without reducing it to fame.
- pob_phrase: revive your work
  simplified_phrase: bring your work to life again
  preserved_meaning: The prophet asks Yahweh to renew his mighty work while retaining the Hebrew life-giving image.
  reasoning_layer_used: POB lexical and theological decisions for חַיֵּהוּ
  rationale: The fuller phrase makes “revive” immediately understandable and preserves its concrete image.
- pob_phrase: in the midst of the years
  simplified_phrase: during these years
  preserved_meaning: The prayer asks for Yahweh to act within the period in view without identifying a precise time.
  reasoning_layer_used: POB lexical alternatives for בְּקֶרֶב שָׁנִים
  rationale: This removes an opaque idiom while preserving the repeated time reference.
interpretive_expansions:
- pob_phrase: in wrath
  rendering: When you are angry
  claim: The wrath is understood as Yahweh’s anger within the direct prayer.
  evidence:
  - The clause directly addresses Yahweh and asks him to remember mercy.
  - The POB lexical decision identifies divine anger as the likely contextual sense.
  confidence: high
  alternatives_preserved:
  - in turmoil
  - in rage
- pob_phrase: remember mercy
  rendering: remember to show mercy
  claim: Remembering mercy means acting compassionately, not merely recalling the idea of mercy.
  evidence:
  - The Hebrew form for mercy is verbal.
  - The POB footnote gives “remember to have mercy” as an equivalent.
  confidence: high
  alternatives_preserved:
  - remember compassion
