  reasoning_layer_used: Lexical decision for כִּחֵשׁ מַעֲשֵׂה זַיִת
  rationale: “Olive crop” makes the agricultural idiom immediately clear.
- pob_phrase: the flock is cut off from the fold
  simplified_phrase: the flock is gone from its pen
  preserved_meaning: No flock remains in its enclosure.
  reasoning_layer_used: Lexical decisions for גָּזַר, צֹאן, and מִכְלָה
