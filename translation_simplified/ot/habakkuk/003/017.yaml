translation:
  language: en
  text: Though the fig tree does not bloom[a] and the vines bear no fruit, though the olive crop fails and the fields grow no food, though the flock is gone from its pen and there are no cattle in the stalls,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “For the fig tree does not bloom.” The Hebrew can mean “for” or “though,” but “though” fits the declaration of joy in the next verse.
    reason: alternative_reading
