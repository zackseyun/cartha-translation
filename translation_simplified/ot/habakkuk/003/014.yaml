translation:
  language: en
  text: You used the enemy’s own staffs to pierce the head of his warriors.[a] They rushed out like a storm to scatter me, rejoicing like someone ready to devour the poor in secret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the head of his villages” or “the head of his hordes”; the Hebrew term is difficult and may refer more generally to the enemy’s bands or leaders.
    reason: alternative_reading
