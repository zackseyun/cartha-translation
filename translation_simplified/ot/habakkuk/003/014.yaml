- pob_phrase: You pierced the head of his warriors with his own staffs
  simplified_phrase: You used the enemy’s own staffs to pierce the head of his warriors
  preserved_meaning: God defeats the enemy through his own implements while the image of piercing the head remains intact.
  reasoning_layer_used: Lexical decisions for נָקַבְתָּ, בְמַטָּיו, רֹאשׁ, and פְּרָזָיו
  rationale: Reordering the clause and naming the enemy makes the instrument and its owner easier to follow.
- pob_phrase: they stormed out to scatter me
  simplified_phrase: They rushed out like a storm to scatter me
  preserved_meaning: The attackers move violently and tempestuously with the aim of dispersing the speaker.
  reasoning_layer_used: Lexical decisions for יִסְעֲרוּ and לַהֲפִיצֵנִי
  rationale: The simile keeps the storm image while using familiar wording for rapid movement.
- pob_phrase: their exultation like one about to devour the poor in secret
  simplified_phrase: rejoicing like someone ready to devour the poor in secret
  preserved_meaning: The attackers take eager, predatory joy in secretly destroying vulnerable people.
  reasoning_layer_used: Lexical decisions for עֲלִיצוּתָם, כְּמוֹ לֶאֱכֹל, עָנִי, and בַּמִּסְתָּר
  rationale: A verbal clause replaces the abstract noun while preserving their jubilant and predatory attitude.
