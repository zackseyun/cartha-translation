simplification_decisions:
- pob_phrase: stood in their lofty place
  simplified_phrase: stood still in their high place
  preserved_meaning: The sun and moon remained fixed in an elevated place.
  reasoning_layer_used: Lexical decisions for עָמַד and זְבֻלָה
  rationale: “Stood still” clarifies their fixed position, and “high place” replaces the less familiar “lofty place.”
- pob_phrase: at the light of your arrows they went, at the brightness of the flash of your spear
  simplified_phrase: At the light of your arrows they moved, at the bright flash of your spear
  preserved_meaning: Movement occurs amid the light of God’s arrows and the flashing brightness of his spear, while its subject remains compressed.
  reasoning_layer_used: Lexical decisions for יְהַלֵּכוּ, נֹגַהּ, and בְּרַק, plus the theological decision on subject ambiguity
  rationale: “Moved” is clearer than “went,” and “bright flash” expresses the layered brightness naturally without naming the moving subject.
