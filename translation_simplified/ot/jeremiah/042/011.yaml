translation:
  language: en
  text: Do not be afraid of the king of Babylon, the one you fear. Do not be afraid of him, declares Yahweh, because I am with you to save you and deliver you from his hand.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not fear the king of Babylon, before whom you are afraid
  simplified_phrase: Do not be afraid of the king of Babylon, the one you fear
  preserved_meaning: The people already fear Babylon’s king, but Yahweh commands them not to continue fearing him.
  reasoning_layer_used: Lexical decisions and applied revisions on ירא and the מִן + פָּנִים idiom
  rationale: Natural English removes the awkward facial idiom while preserving the repeated language of fear.
- pob_phrase: for I am with you
  simplified_phrase: because I am with you
  preserved_meaning: Yahweh’s presence is the reason they need not fear.
  reasoning_layer_used: Lexical decision for כִּי אִתְּכֶם אָנִי
  rationale: Because states the logical connection directly for a modern reader.
- pob_phrase: to save you and to deliver you from his hand
  simplified_phrase: to save you and deliver you from his hand
  preserved_meaning: Yahweh promises both saving action and release from the king’s power.
  reasoning_layer_used: Lexical decisions for ישׁע, נצל, and the hand metaphor
  rationale: The wording is streamlined without merging the two verbs or removing the biblical image of his hand.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “from his hand” only literally.
    mitigation: The familiar image is retained because the context clearly points to rescue from the king’s power.
