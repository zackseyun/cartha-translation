translation:
  language: en
  text: 'This is what Yahweh of Hosts[b], the God of Israel, says: “I poured out my anger and wrath on the people of Jerusalem. In the same way, I will pour out my wrath on you when you enter Egypt. People will use you as an example when they call down curses.[a] You will become a horror, a curse, and a public disgrace, and you will never see this place again.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “you will become an oath” or “an object of cursing.”
    reason: lexical_alternative
  - marker: b
    text: “Hosts” means armies and can include both heavenly and earthly forces.
    reason: simplification_note
