translation_notes:
  risk_flags:
  - risk: “Everything Yahweh says” could be read more broadly than Yahweh’s specific answer.
    mitigation: The words “in answer to you” limit it to the response they requested.
  - risk: Replacing “according to your words” removes the Hebrew wording image.
    mitigation: “Just as you asked” preserves its contextual force, and the final “single word” retains the message imagery.
