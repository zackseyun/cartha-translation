translation:
  language: en
  text: They did not say, “Where is Yahweh? He brought us up out of Egypt and led us through the wilderness—through a land of desert plain and pit, a land of drought and deep darkness,[a] a land where no one traveled and no one lived.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the shadow of death.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who brought us up from the land of Egypt, who led us
  simplified_phrase: He brought us up out of Egypt and led us
  preserved_meaning: Yahweh delivered Israel from Egypt and guided them through the wilderness.
  reasoning_layer_used: POB lexical decisions for עלה and הלך
  rationale: A direct sentence is easier to follow while preserving the Exodus image of being brought up.
- pob_phrase: through a land of desert plain and pit
  simplified_phrase: through a land of desert plain and pit
  preserved_meaning: The singular terrain images portray the wilderness as barren and dangerous.
  reasoning_layer_used: POB lexical decisions for ערבה and שוחה
  rationale: The concrete singular images remain because making them plural would needlessly alter the source.
- pob_phrase: through a land where no man passed through and no human dwelt
  simplified_phrase: a land where no one traveled and no one lived
  preserved_meaning: The land was untraveled and uninhabited by human beings.
  reasoning_layer_used: POB lexical decisions for עבר and ישב
  rationale: Common verbs convey the desolation without archaic wording.
translation_notes:
  risk_flags:
  - risk: Using “no one” removes the formal distinction between אִישׁ and אָדָם.
    mitigation: The two parallel claims about human travel and habitation remain distinct.
