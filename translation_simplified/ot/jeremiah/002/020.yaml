translation:
  language: en
  text: Long ago, I broke the yoke that held you in slavery and tore off your bonds. But you said, “I refuse to serve.” Indeed, on every high hill and under every green tree[a], you lay sprawled out[b] like a prostitute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were places commonly associated with idol worship.
    reason: cultural_note
  - marker: b
    text: The Hebrew word is difficult and may instead mean “bent down.”
    reason: lexical_alternative
