translation:
  language: en
  text: The priests did not ask, “Where is Yahweh?” Those responsible for the law[a] did not know me. The shepherds—the people’s leaders—rebelled against me. The prophets prophesied by Baal[b] and followed things that did them no good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “those who handle the law.”
    reason: simplification_note
  - marker: b
    text: Or “prophesied in the name of Baal.”
    reason: alternative_reading
