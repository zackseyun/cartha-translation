  preserved_meaning: The priests failed to seek Yahweh.
  reasoning_layer_used: source syntax and lexical rationale
  rationale: Because the quoted words form a question, “ask” makes their force immediately clear.
- pob_phrase: Those who handle the law
  simplified_phrase: Those responsible for the law
  preserved_meaning: The accusation concerns leaders entrusted with Yahweh’s law.
  reasoning_layer_used: lexical decision and footnote
  rationale: The role is stated plainly while the footnote preserves the Hebrew handling image.
- pob_phrase: went after things that do not profit
  simplified_phrase: followed things that did them no good
  preserved_meaning: They pursued things that brought no benefit.
  reasoning_layer_used: lexical and theological decisions
  rationale: This states the lack of benefit naturally without identifying the things explicitly as idols.
