  preserved_meaning: Judah’s gods are idols of human manufacture, not the LORD.
  reasoning_layer_used: lexical and theological decisions
  rationale: The shorter clause keeps both the idols’ identity and the force of “for yourself.”
- pob_phrase: Let them arise, if they can save you in the time of your trouble
  simplified_phrase: Let them rise up and save you when disaster comes—if they can!
  preserved_meaning: God sarcastically challenges the idols to act and rescue Judah from calamity.
  reasoning_layer_used: lexical decisions and source syntax
  rationale: The recast sentence preserves the rising image while making the rhetorical challenge immediately clear.
- pob_phrase: For your gods, Judah, are as many as your cities
  simplified_phrase: Judah, you have as many gods as you have cities
  preserved_meaning: Judah’s idols correspond in number to its cities.
  reasoning_layer_used: lexical decisions and latest revision
  rationale: Direct address and ordinary word order make the numerical comparison easier to grasp.
