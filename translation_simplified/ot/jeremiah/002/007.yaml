    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to eat its fruit and its goodness
  simplified_phrase: to eat its fruit and enjoy its good things
  preserved_meaning: God gave Israel both the land’s fruit and its broader benefits.
  reasoning_layer_used: lexical decision for פְּרִי and טוּב
  rationale: “Enjoy its good things” expresses the broad gift more naturally than “eat its goodness.”
- pob_phrase: when you came in
  simplified_phrase: after you entered it
  preserved_meaning: Israel’s defilement followed its entrance into the land.
  reasoning_layer_used: lexical decision for וַתָּבֹאוּ
  rationale: The revised clause makes the sequence and its object immediately clear.
- pob_phrase: made my inheritance an abomination
  simplified_phrase: turned my inheritance into something detestable
  preserved_meaning: Israel made God’s covenant possession morally and religiously abhorrent.
  reasoning_layer_used: lexical decisions for נַחֲלָתִי and תוֹעֵבָה
  rationale: The wording keeps the severe judgment while replacing the less familiar noun “abomination.”
interpretive_expansions:
- pob_phrase: its goodness
  rendering: enjoy its good things
  claim: The land’s goodness refers broadly to the benefits God provided through it.
  evidence:
