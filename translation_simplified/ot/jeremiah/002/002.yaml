translation:
  language: en
  text: 'Go and proclaim this message for Jerusalem to hear: “This is what Yahweh says: I remember your faithful love when you were young, the love you showed as my bride.[a] You followed me through the wilderness, through a land where no crops had been planted.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The bridal image describes Israel’s early devotion to Yahweh; the Hebrew may refer to betrothal or to the early days of marriage.
    reason: lexical_alternative
