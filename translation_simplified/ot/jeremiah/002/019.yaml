translation:
  language: en
  text: Your own evil will discipline you, and your repeated acts of turning away from me will expose your guilt. Know and see that it is evil and bitter for you to abandon Yahweh your God, and that you have no reverent fear of me, declares the Lord GOD of Armies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the Lord GOD of hosts,” a title presenting God as commander of heavenly armies.
    reason: cultural_note
simplification_decisions:
- pob_phrase: your apostasies will reprove you
  simplified_phrase: your repeated acts of turning away from me will expose your guilt
  preserved_meaning: Judah’s repeated covenant unfaithfulness serves as evidence of her guilt.
  reasoning_layer_used: Lexical and theological decisions on מְשֻׁבוֹתַיִךְ and תּוֹכִחֻךְ.
  rationale: This explains the uncommon terms while preserving covenantal defection and exposed guilt.
- pob_phrase: So know and see that
  simplified_phrase: Know and see that
  preserved_meaning: Both understanding and perceptive recognition are commanded.
  reasoning_layer_used: Lexical decision on וּדְעִי וּרְאִי and the grounding review.
  rationale: The two commands remain distinct and govern both truths that follow.
- pob_phrase: my fear is not in you ... the Lord GOD of hosts
  simplified_phrase: you have no reverent fear of me ... the Lord GOD of Armies
  preserved_meaning: Reverence toward God is absent, and the divine title retains its martial force.
  reasoning_layer_used: Theological decision on וְלֹא פַחְדָּתִי אֵלַיִךְ and lexical decision on צְבָאוֹת.
  rationale: The approved verbal alternative clarifies fear, while Armies makes the title understandable.
interpretive_expansions:
- pob_phrase: your apostasies
  rendering: your repeated acts of turning away from me
  claim: The turning away is specifically from Yahweh and is expressed in the plural.
  evidence:
  - The source noun denotes covenantal turning away or faithlessness.
  - The following clause identifies the offense as abandoning Yahweh.
  - The Hebrew noun is plural.
  confidence: high
  alternatives_preserved:
  - your apostasies
  - your backslidings
  - your turnings away
translation_notes:
  risk_flags:
  - risk: Turning away may sound less decisively covenantal than apostasy.
    mitigation: From me and the reference to abandoning Yahweh preserve the covenant focus.
  - risk: Armies could be understood as referring only to human forces.
    mitigation: The footnote identifies the traditional title and its heavenly scope.
