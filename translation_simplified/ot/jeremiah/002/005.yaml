translation:
  language: en
  text: 'This is what Yahweh says: “What wrong[a] did your fathers find in me that they went so far away from me? They pursued what is empty[b], and they themselves became empty.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “What injustice did your fathers find in me?”
    reason: alternative_reading
  - marker: b
    text: “What is empty” likely includes idols, but the Hebrew term is broader and describes what is worthless and insubstantial.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The standard prophetic formula introduces Yahweh’s own message.
  reasoning_layer_used: lexical and theological decisions
  rationale: The modern formula keeps the divine name and prophetic authority.
- pob_phrase: went far from me
  simplified_phrase: went so far away from me
  preserved_meaning: Their departure pictures deep covenant estrangement from Yahweh.
  reasoning_layer_used: lexical rationale
  rationale: “Away” makes the spatial image immediately clear without removing it.
- pob_phrase: went after vanity, and became vain
  simplified_phrase: pursued what is empty, and they themselves became empty
  preserved_meaning: By pursuing empty objects, the fathers became empty like them.
  reasoning_layer_used: lexical decisions and source-root wordplay
  rationale: Repeating “empty” preserves the Hebrew wordplay while avoiding the misleading modern sense of conceit.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “empty” only as an emotional state.
    mitigation: The footnote explains its sense of worthlessness and insubstantiality.
  - risk: “Fathers” may sound limited to immediate parents.
    mitigation: It is retained because the POB identifies earlier covenant generations with the explicit masculine term.
