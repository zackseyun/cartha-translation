simplification_decisions:
- pob_phrase: two evils
  simplified_phrase: two evil things
  preserved_meaning: The people's two actions remain morally evil, not merely mistaken.
  reasoning_layer_used: Lexical decision for שְׁתַּיִם רָעוֹת
  rationale: Adding “things” makes the phrase natural without weakening its moral force.
- pob_phrase: they have forsaken me
  simplified_phrase: they have abandoned me
  preserved_meaning: The people have gravely and relationally rejected God.
  reasoning_layer_used: Lexical decision for אֹתִי עָזְבוּ
  rationale: “Abandoned” is more familiar than “forsaken” while retaining the relational gravity.
- pob_phrase: cisterns—broken cisterns
  simplified_phrase: cisterns for themselves—broken water-storage pits
  preserved_meaning: They made man-made reservoirs for their own use, but those reservoirs were useless.
  reasoning_layer_used: Lexical decisions for בֹּארוֹת and בֹּארֹת נִשְׁבָּרִים
  rationale: The brief gloss explains an unfamiliar object while preserving the repeated broken-cistern image.
