translation:
  language: en
  text: 'For my people have done two evil things: they have abandoned me, the fountain of living waters,[a] and dug cisterns for themselves—broken water-storage pits that cannot hold water.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
