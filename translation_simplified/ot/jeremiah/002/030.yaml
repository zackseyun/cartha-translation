translation:
  language: en
  text: I struck your sons,[a] but it did no good. They refused to accept correction.[b] Your sword devoured your prophets like a lion that destroys.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “children”; the Hebrew word is literally “sons.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “discipline” or “instruction.”
    reason: lexical_alternative
