  preserved_meaning: The people did not receive God’s corrective discipline.
  reasoning_layer_used: Lexical decisions for מוּסָר and לֹא לָקָחוּ
  rationale: “Refused to accept” expresses the contextual force of their rejection in natural English.
- pob_phrase: like a destroying lion
