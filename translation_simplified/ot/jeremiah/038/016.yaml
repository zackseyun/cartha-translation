translation:
  language: en
  text: 'Then King Zedekiah secretly made this oath to Jeremiah: “As surely as Yahweh lives—the one who created our lives[a]—I will not kill you or hand you over to these men who are trying to take your life.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says, “who made this life for us”; it may also be translated, “who gave us this life.”
    reason: lexical_alternative
