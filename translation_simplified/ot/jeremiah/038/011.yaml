translation:
  language: en
  text: Ebed-melech took the men with him into the king’s house. They went to an area below the storeroom, where he gathered worn-out rags and worn-out clothes.[a] Then he lowered them by ropes to Jeremiah in the cistern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “clothes” is rare and may refer more generally to old pieces of cloth.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “pit,” but here it refers to a cistern used to hold Jeremiah.
    reason: lexical_alternative
