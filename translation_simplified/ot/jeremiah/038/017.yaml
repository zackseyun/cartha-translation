translation:
  language: en
  text: 'Then Jeremiah said to Zedekiah, “Yahweh, the God of hosts[a] and the God of Israel, says: ‘If you truly go out and surrender to the king of Babylon’s officials, your life will be spared. This city will not be set on fire, and you and your household will live.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The title “God of hosts” can also be expressed as “God of armies.”
    reason: lexical_alternative
