  preserved_meaning: Zedekiah must actually yield himself to Babylon’s leaders.
  reasoning_layer_used: Source construction, immediate context, and POB lexical rationale
  rationale: “Truly” keeps the Hebrew emphasis, while “surrender” makes the action understandable.
- pob_phrase: this city will not be burned with fire
