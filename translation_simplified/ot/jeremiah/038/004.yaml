    text: Or 'the soldiers' for 'the men of war.'
    reason: lexical_alternative
  - marker: c
    text: Or 'seeking peace' instead of 'seeking the welfare'; Hebrew shalom can include peace, well-being, and prosperity.
    reason: lexical_alternative
