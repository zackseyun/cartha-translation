translation:
  language: en
  text: Then the officials said to the king, “Please have this man put to death. By saying such things, he is making the soldiers who are left in this city lose courage,[a] and he is discouraging all the people. This man is not working for the well-being of these people, but for their harm.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “weakening the hands of,” an image for discouraging or demoralizing people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Please let this man be put to death
  simplified_phrase: Please have this man put to death
  preserved_meaning: The officials politely frame their demand for Jeremiah’s execution as a request to the king.
  reasoning_layer_used: POB lexical decision for יּוּמַת נָא
  rationale: The active request is easier to follow while retaining both the petition and judicial sense.
- pob_phrase: weakening the hands of the men of war who remain in this city, and the hands of all the people
  simplified_phrase: making the soldiers who are left in this city lose courage, and ... discouraging all the people
  preserved_meaning: Jeremiah’s words are accused of demoralizing the remaining fighters and the wider population.
  reasoning_layer_used: POB lexical decisions for מְרַפֵּא אֶת יְדֵי, אַנְשֵׁי הַמִּלְחָמָה, and וְאֵת יְדֵי כָל הָעָם
  rationale: The idiom is stated plainly in the text, while the Hebrew hand image is retained in a note.
- pob_phrase: is not seeking the welfare of this people, but their harm
  simplified_phrase: is not working for the well-being of these people, but for their harm
  preserved_meaning: The officials accuse Jeremiah of acting against the people’s good.
  reasoning_layer_used: POB lexical decisions for דֹרֵשׁ לְשָׁלוֹם and כִּי אִם לְרָעָה
  rationale: “Working for their well-being” makes the accusation natural without narrowing shalom to peace alone.
