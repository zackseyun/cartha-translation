translation:
  language: en
  text: Then King Zedekiah sent for the prophet Jeremiah and had him brought to meet him at the third entrance of Yahweh’s temple. The king said to Jeremiah, “I want to ask you something. Do not hide anything from me.”
  philosophy: optimal-equivalence
