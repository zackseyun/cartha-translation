  preserved_meaning: Jeremiah must be raised and removed from the cistern.
  reasoning_layer_used: Lexical decisions for וְהַעֲלִיתָ and מִן הַבּוֹר
  rationale: “Up out of” clearly preserves both the upward movement and the rescue.
