translation:
  language: en
  text: Then the king ordered Ebed-melech the Cushite[a], “Take thirty men from here with you. Bring Jeremiah the prophet up out of the cistern[b] before he dies.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Cushite was a person from Cush, a region south of Egypt; older translations may say “Ethiopian.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “pit”; here it refers to a water-storage cistern.
    reason: lexical_alternative
