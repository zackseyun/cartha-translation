translation:
  language: en
  text: 'Look! All the women still in the palace of the king of Judah are being brought out to the king of Babylon’s officials. They are saying:


    “The men on your side[a]

    have misled you and overcome you.

    Your feet have sunk into the mud,

    and those men have turned back.”'
  philosophy: optimal-equivalence
  footnotes:
