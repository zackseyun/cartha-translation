translation:
  language: en
  text: My lord the king, these men have done evil in everything they did to Jeremiah the prophet. They threw him into the cistern[a], and he will die there because of the famine. There is no bread left in the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pit.” The Hebrew word can mean a pit, dungeon, or cistern; “cistern” best fits this setting.
    reason: lexical_alternative
