  preserved_meaning: The men’s entire treatment of Jeremiah was evil, especially throwing him into the cistern.
  reasoning_layer_used: POB lexical decisions and immediate narrative context
  rationale: Two direct sentences replace the dense relative clause without weakening its moral force.
- pob_phrase: for there is no bread left in the city
  simplified_phrase: There is no bread left in the city.
