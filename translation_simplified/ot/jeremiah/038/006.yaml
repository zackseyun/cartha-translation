translation:
  language: en
  text: They took Jeremiah and threw him into the cistern belonging to Malkijah, the king’s son. The cistern was in the courtyard where prisoners were held under guard.[a] They lowered Jeremiah into it with ropes. It had no water in it, only mud, and Jeremiah sank into the mud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the prison courtyard”; the Hebrew refers to a guarded detention area.
    reason: lexical_alternative
