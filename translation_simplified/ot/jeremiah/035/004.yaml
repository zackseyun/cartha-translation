translation:
  language: en
  text: So I brought them into Yahweh’s temple, into the room of the sons of Hanan.[a] Hanan was the son of Igdaliah and a man of God. This room was next to the officials’ room. The officials’ room was above the room of Maaseiah son of Shallum, the doorkeeper.[b]
  philosophy: optimal-equivalence
  footnotes:
