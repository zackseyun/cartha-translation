translation:
  language: en
  text: I sent all my servants, the prophets, to you again and again. They said, “Please turn back, each man from his evil way. Change your deeds for the better, and do not follow other gods or serve them. Then live in the land I gave to you and to your fathers.” But you paid no attention and did not listen to me.
