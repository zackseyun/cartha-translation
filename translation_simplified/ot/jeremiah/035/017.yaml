translation:
  language: en
  text: 'Therefore, this is what Yahweh, the God of hosts[a] and the God of Israel, says: “I am bringing on Judah and everyone living in Jerusalem every disaster[b] I said would come upon them. I am doing this because I spoke to them, but they did not listen; I called to them, but they did not answer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies or assembled forces.
    reason: simplification_note
  - marker: b
    text: Or “calamity.” Here the word refers to God’s announced judgment, not moral evil.
    reason: lexical_alternative
