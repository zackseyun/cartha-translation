  text: But when King Nebuchadnezzar of Babylon invaded the land of Judah, we said, “Come, let us go to Jerusalem to escape the Babylonian army[a] and the army of Aram.[b]” So we settled in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
