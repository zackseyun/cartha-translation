translation:
  language: en
  text: I will weep and wail over the mountains, and I will raise a lament over the wilderness pastures. They have been burned up,[a] and no one passes through them. No sound of livestock is heard. The birds of the sky and the land animals have fled; they are gone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “laid waste.” The Hebrew may refer broadly to devastation, though it likely retains the image of burning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Over the mountains I will lift up weeping and wailing
  simplified_phrase: I will weep and wail over the mountains
  preserved_meaning: The speaker openly expresses intense grief over the mountains.
  reasoning_layer_used: Lexical decisions for אֶשָּׂא, בְכִי, and נֶהִי
  rationale: The verbs make the mourning action direct while preserving both weeping and wailing.
- pob_phrase: the pastures of the wilderness
  simplified_phrase: the wilderness pastures
  preserved_meaning: The grazing lands in the wilderness are the object of lament.
  reasoning_layer_used: Lexical decision for נְאוֹת מִדְבָּר
  rationale: The shorter phrase keeps the pasture setting and its link to livestock.
- pob_phrase: From the birds of the heavens to the beasts
  simplified_phrase: The birds of the sky and the land animals
  preserved_meaning: Both flying creatures and terrestrial animals have disappeared.
  reasoning_layer_used: Lexical decisions for מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה and נָדְדוּ הָלָכוּ
  rationale: Common terms clarify the full range of animals without implying only wild beasts.
