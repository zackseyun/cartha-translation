translation:
  language: en
  text: Yahweh said, “This is because they abandoned my law,[a] which I set before them. They did not listen to my voice[b] or live by my law.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my instruction.” Here “law” emphasizes its covenant authority.
    reason: lexical_alternative
  - marker: b
    text: Or “obey my voice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because they have forsaken my law that I set before them
  simplified_phrase: This is because they abandoned my law, which I set before them.
  preserved_meaning: Abandoning Yahweh’s covenant law is the reason given for the judgment.
  reasoning_layer_used: Lexical and theological decisions on עַל, עזב, and תּוֹרָה
  rationale: “Abandoned” is clearer than “forsaken” while retaining the seriousness of covenant rejection.
- pob_phrase: have not listened to my voice or walked in it
  simplified_phrase: They did not listen to my voice or live by my law.
  preserved_meaning: They neither heeded Yahweh nor conducted their lives according to his law.
  reasoning_layer_used: Lexical decisions on שׁמע and הלך ב, with doctrine realignment
  rationale: This keeps the listening image and expresses the walking idiom in clear English without introducing a separate “way.”
- pob_phrase: one extended causal clause
  simplified_phrase: two short sentences
  preserved_meaning: Both failures remain part of Yahweh’s stated reason for judgment.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Two sentences make the causal statement easier to follow without merging its ideas.
