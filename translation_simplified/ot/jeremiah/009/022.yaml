simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words introduce an authoritative prophetic declaration from Yahweh.
  reasoning_layer_used: Lexical decision for כֹּה and theological decision for יְהוָה
  rationale: The alternative “This is what” makes the prophetic formula immediately clear while retaining Yahweh’s covenant name.
- pob_phrase: Let not ... boast in
  simplified_phrase: must not boast about
  preserved_meaning: Yahweh forbids each person from taking pride in a human advantage.
  reasoning_layer_used: Lexical decision for אַל יִתְהַלֵּל and the בְּ phrases
  rationale: Direct prohibitions and “boast about” are more natural in modern English.
- pob_phrase: the mighty man boast in his might; ... the rich man boast in his riches
  simplified_phrase: A powerful man ... boast about his power. A rich man ... boast about his wealth.
  preserved_meaning: Human power and wealth remain distinct grounds in which people must not boast.
  reasoning_layer_used: Lexical decisions for הַגִּבּוֹר, בִּגְבוּרָתוֹ, עָשִׁיר, and בְּעָשְׁרוֹ
  rationale: Common words replace elevated phrasing while preserving the representative masculine singular and three-part parallel.
translation_notes:
  risk_flags:
  - risk: “Powerful man” may suggest social authority more than physical strength or general might.
    mitigation: The paired word “power” preserves the broad human capability intended by the POB lexical rationale.
