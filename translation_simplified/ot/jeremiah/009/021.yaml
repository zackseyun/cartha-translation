translation:
  language: en
  text: 'Speak this message: This is what Yahweh says: “The corpse of man[a] will fall like dung out in the field, like a bundle of cut grain left behind by the reaper, with no one to gather it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” refers to humanity in general.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'Speak: Thus says Yahweh'
  simplified_phrase: 'Speak this message: This is what Yahweh says'
  preserved_meaning: Yahweh commands the prophet to announce his message.
  reasoning_layer_used: Lexical decisions for דַּבֵּר, כֹּה, and נְאֻם יְהוָה
  rationale: The fuller formula is clearer in modern English while retaining the command and prophetic introduction.
- pob_phrase: on the face of the field
  simplified_phrase: out in the field
  preserved_meaning: The corpse lies exposed and unburied in the field.
  reasoning_layer_used: Lexical rationale for עַל פְּנֵי הַשָּׂדֶה
  rationale: The common phrase conveys the intended location and exposure without the opaque Hebrew idiom.
- pob_phrase: like a sheaf behind the reaper
  simplified_phrase: like a bundle of cut grain left behind by the reaper
  preserved_meaning: The corpse is compared to harvested grain abandoned after cutting.
  reasoning_layer_used: Lexical decisions for עָמִיר and מֵאַחֲרֵי הַקֹּצֵר
  rationale: The concrete description explains “sheaf” and makes the abandonment in the harvest image immediately clear.
translation_notes:
