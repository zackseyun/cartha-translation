  preserved_meaning: God will cause the city to become heaps of ruined material.
  reasoning_layer_used: Lexical decision for לְגַלִּים and theological decision on divine agency
  rationale: This keeps both the rubble image and God's direct action in clearer English.
- pob_phrase: a haunt of jackals
  simplified_phrase: a home for jackals
  preserved_meaning: Wild jackals will inhabit the abandoned city.
  reasoning_layer_used: Lexical decisions for מְעוֹן and תַּנִּים
  rationale: “Home” plainly communicates the dwelling-place image without weakening the desolation.
- pob_phrase: a desolation, without inhabitant
  simplified_phrase: desolate, with no one living there
  preserved_meaning: Judah's cities will be devastated and entirely uninhabited.
  reasoning_layer_used: Lexical decisions for שְׁמָמָה and מִבְּלִי יוֹשֵׁב
  rationale: The adjective and ordinary clause replace formal nouns with direct modern wording.
