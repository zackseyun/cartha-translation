translation:
  language: en
  text: against Egypt, Judah, Edom, the sons of Ammon, Moab, and all who live in the wilderness and cut off the corners of their hair.[a] For all the nations are uncircumcised, and all the people of Israel are uncircumcised in heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This probably refers to a distinctive hairstyle worn by desert peoples; it may also be translated, “all who clip the corners of their hair.”
    reason: lexical_alternative
  - marker: b
    text: “Uncircumcised in heart” describes inward rebellion against God despite bearing the outward covenant sign.
    reason: simplification_note
simplification_decisions:
- pob_phrase: against Egypt, and against Judah, and against Edom
  simplified_phrase: against Egypt, Judah, Edom
  preserved_meaning: Each nation remains an object of the judgment announced in the previous verse.
  reasoning_layer_used: Lexical decision for עַל and immediate judgment context
  rationale: A single “against” naturally governs the whole list without weakening its judicial force.
- pob_phrase: all those with the corners of their hair cut off, who dwell in the wilderness
  simplified_phrase: all who live in the wilderness and cut off the corners of their hair
  preserved_meaning: The concrete hairstyle and its association with wilderness peoples are both retained.
  reasoning_layer_used: Lexical decisions for כָּל קְצוּצֵי פֵאָה and הַיֹּשְׁבִים בַּמִּדְבָּר
  rationale: Ordinary verb order makes the description easier to understand without settling its uncertain ethnographic details.
- pob_phrase: all the house of Israel
  simplified_phrase: all the people of Israel
  preserved_meaning: The phrase still refers collectively to the entire nation of Israel.
  reasoning_layer_used: Lexical decision for כָל בֵּית יִשְׂרָאֵל
  rationale: “All the people” expresses the Hebrew collective idiom in common English.
interpretive_expansions:
- pob_phrase: uncircumcised in heart
  rendering: 'Footnote: “describes inward rebellion against God despite bearing the outward covenant sign”'
  claim: The bodily covenant image is applied to Israel’s inward rebellion in contrast with outward circumcision.
  evidence:
  - The POB theological rationale identifies covenantal circumcision as a metaphor for inward rebellion.
  - The contrast joins physically uncircumcised nations with Israel’s uncircumcised heart.
  confidence: high
  alternatives_preserved:
  - spiritually uncircumcised
  - hard-hearted
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand “uncircumcised in heart.”
    mitigation: The metaphor remains in the text, while footnote [b] briefly explains its covenantal force.
  - risk: The hairstyle phrase may sound more ethnographically certain than the Hebrew allows.
    mitigation: Footnote [a] marks the identification as probable and preserves the lexical alternative.
