translation:
  language: en
  text: If only I had a place for travelers to stay in the wilderness! Then I would leave my people and go away from them, because they are all adulterers[a]—a gathering of traitors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this prophetic context, “adulterers” can also evoke unfaithfulness toward God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Oh, that I had a travelers' lodging place
  simplified_phrase: If only I had a place for travelers to stay
  preserved_meaning: The speaker longs for a temporary shelter used by travelers.
  reasoning_layer_used: POB lexical decisions for מִי יִתְּנֵנִי and מְלוֹן אֹרְחִים
  rationale: The rewrite makes both the wish and the shelter image immediately clear.
- pob_phrase: so that I might leave my people and go away from them
  simplified_phrase: Then I would leave my people and go away from them
  preserved_meaning: Having the shelter would let the speaker separate from his people.
  reasoning_layer_used: POB lexical decisions for the cohortative verbs
  rationale: The conditional sequence sounds more natural in common English.
- pob_phrase: For all of them are adulterers, an assembly of traitors
  simplified_phrase: because they are all adulterers—a gathering of traitors
  preserved_meaning: Their adultery and collective treachery explain the wish to leave.
  reasoning_layer_used: POB lexical and theological decisions for מְנָאֲפִים, עֲצֶרֶת, and בֹּגְדִים
  rationale: The wording retains the concrete accusation and the forceful collective charge.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “adulterers” only as sexual misconduct.
    mitigation: The footnote cautiously notes its possible covenant-unfaithfulness resonance.
