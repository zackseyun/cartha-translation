translation:
  language: en
  text: 'For cries of grief are heard from Zion: “How devastated we are![a] We are utterly ashamed because we have left the land,[b] because they have torn down our homes.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “How we have been plundered!” The Hebrew can refer to general ruin or to being stripped by an enemy.
    reason: lexical_alternative
  - marker: b
    text: Or “because we have abandoned the land.” The lament most likely describes leaving under judgment.
    reason: lexical_alternative
  - marker: c
    text: “Homes” translates a broader word meaning dwelling places or habitations.
    reason: simplification_note
