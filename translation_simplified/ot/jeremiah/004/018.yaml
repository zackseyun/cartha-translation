translation:
  language: en
  text: The way you have lived and what you have done have brought these things on you. This is your evil[a]—how bitter it is! It has reached your heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your calamity” or “your disaster.” The Hebrew can mean either moral evil or the disaster that results from it; here “evil” emphasizes your guilt.
    reason: lexical_alternative
