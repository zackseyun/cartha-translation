  text: At the sound of the horseman and the archer,[a] every city empties as its people flee. They hide in the thickets[b] and climb among the rocks. Every city is abandoned, and no man lives in any of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Because of the sound of the horseman and the archer.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word is uncertain and can mean “clouds,” but here it probably refers to dense cover where people could hide.
    reason: lexical_alternative
