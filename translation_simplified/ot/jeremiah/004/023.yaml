translation:
  language: en
  text: I looked at the earth, and there it was—formless and empty.[a] I looked at the heavens, and they had no light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase echoes Genesis 1:2 and is also traditionally translated “without form and void” or “waste and void.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and behold, it was formless and empty
  simplified_phrase: and there it was—formless and empty
  preserved_meaning: The wording keeps both the vision’s immediacy and the image of creation undone.
  reasoning_layer_used: Lexical decision for וְהִנֵּה and theological decision on the Genesis 1:2 echo.
  rationale: “There it was” is more natural modern English than “behold” without weakening the sudden sight.
- pob_phrase: and at the heavens, and they had no light
  simplified_phrase: I looked at the heavens, and they had no light
  preserved_meaning: Jeremiah observes that the heavens themselves are without light.
  reasoning_layer_used: Lexical decisions for רָאִיתִי, הַשָּׁמַיִם, and וְאֵין אוֹרָם.
  rationale: Repeating “I looked” supplies the implied verb and removes the awkward English clause.
translation_notes:
  risk_flags:
  - risk: “Earth” may sound exclusively global rather than also allowing the oracle’s historical focus on Judah.
    mitigation: The earth-heavens pairing and Genesis echo justify the cosmic wording while the wider context retains the historical setting.
