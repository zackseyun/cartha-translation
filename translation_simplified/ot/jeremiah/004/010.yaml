translation:
  language: en
  text: Then I said, “Ah, Lord Yahweh! You have surely greatly deceived this people and Jerusalem by telling them, ‘You will have peace and safety.’ But the sword has reached the point of death for them.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says the sword has reached “to the soul,” an expression that may also be rendered “to the life” or “to the throat.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying, ‘You will have peace,’
  simplified_phrase: by telling them, ‘You will have peace and safety.’
  preserved_meaning: God is accused of assuring the people of well-being and security.
  reasoning_layer_used: Lexical decision for שָׁלוֹם and immediate context
  rationale: “By telling them” clarifies the means of deception, and “peace and safety” conveys the contextual breadth of shalom.
- pob_phrase: while the sword has reached to the soul
  simplified_phrase: But the sword has reached the point of death for them.
  preserved_meaning: The sword has reached their very lives with mortal force without necessarily stating that death is complete.
  reasoning_layer_used: Lexical decisions for נגע and נֶפֶשׁ, with the POB footnote
  rationale: The wording preserves the sword image and explains the Hebrew expression without implying completed deaths.
- pob_phrase: surely you have greatly deceived
  simplified_phrase: You have surely greatly deceived
  preserved_meaning: Jeremiah directly and emphatically accuses God of deceiving the people.
  reasoning_layer_used: Theological decision and doctrine realignment
  rationale: The accusation and its emphasis remain unsoftened despite the theological tension.
interpretive_expansions:
- pob_phrase: You will have peace
  rendering: You will have peace and safety
  claim: Peace here includes security and well-being, not only the absence of conflict.
  evidence:
  - The POB lexical rationale explicitly identifies well-being and security as the contextual sense of שָׁלוֹם.
  - The contrast with the sword makes physical security prominent.
  confidence: high
  alternatives_preserved:
  - You will have peace
  - Peace will be yours
- pob_phrase: the sword has reached to the soul
  rendering: the sword has reached the point of death for them
  claim: The expression depicts the sword reaching their lives with mortal force.
  evidence:
  - The POB lexical rationale says נֶפֶשׁ likely refers to life itself here.
  - The POB footnote describes the sword as reaching the point of death.
  confidence: high
  alternatives_preserved:
  - to the soul
  - to the life
  - to the throat
translation_notes:
  risk_flags:
  - risk: “Peace and safety” makes the range of shalom more explicit than the POB main text.
    mitigation: The expansion is directly supported by the POB lexical rationale and the sword contrast.
  - risk: “The point of death” interprets the ambiguous image “to the soul.”
    mitigation: The footnote preserves the source image and the viable “life” and “throat” alternatives.
