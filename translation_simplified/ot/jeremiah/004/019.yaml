translation:
  language: en
  text: My insides, my insides! I writhe in pain! O walls of my heart![a] My heart pounds within me. I cannot keep silent, for you, my soul, have heard the trumpet sound and the battle cry.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the walls of my heart,” a vivid picture of anguish deep within the speaker.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “my soul has heard.”
    reason: lexical_alternative
