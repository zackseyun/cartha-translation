translation:
  language: en
  text: Disaster upon disaster is announced, because the whole land is devastated.[a] Suddenly my tents are devastated; my tent curtains are devastated in a moment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole earth.” The Hebrew word can mean either “land” or “earth,” but here the context points to the land under judgment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is proclaimed, for
  simplified_phrase: is announced, because
  preserved_meaning: The public announcement reports disaster because the whole land has been devastated.
  reasoning_layer_used: POB lexical decisions for נִקְרָא and כִּי
  rationale: “Announced” and “because” state the connection in common English.
- pob_phrase: Disaster upon disaster
  simplified_phrase: Disaster upon disaster
  preserved_meaning: Calamities are piling one upon another without requiring a strictly temporal sequence.
  reasoning_layer_used: POB lexical decisions for שֶׁבֶר and עַל
  rationale: The source image is retained because “after another” would make the relationship too strictly temporal.
- pob_phrase: my curtains in a moment
  simplified_phrase: my tent curtains are devastated in a moment
  preserved_meaning: The tent coverings share in the same sudden devastation as the tents.
  reasoning_layer_used: POB lexical decisions for שֻׁדְּדוּ, רֶגַע, and יְרִיעֹתַי plus the cultural note
  rationale: “Tent curtains” clarifies the dwelling image while repeating “devastated” as the Hebrew does.
interpretive_expansions:
- pob_phrase: my curtains
  rendering: my tent curtains
  claim: The curtains are coverings belonging to the tents just mentioned.
  evidence:
  - The POB cultural note identifies them as tent-curtains.
  - The parallel phrase “my tents” supplies the dwelling context.
  confidence: high
  alternatives_preserved:
  - my curtains
  - my hangings
translation_notes:
  risk_flags:
  - risk: “Upon” is less common in everyday English.
    mitigation: It remains readily understandable and preserves the image of disasters piling together.
  - risk: “Land” may understate possible broader overtones.
    mitigation: The footnote preserves “the whole earth” as an alternative.
