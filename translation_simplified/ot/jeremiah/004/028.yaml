translation:
  language: en
  text: Because of this, the earth[a] will mourn, and the heavens above will grow dark. For I have spoken and made my decision. I have not relented, and I will not turn back from it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land.” The Hebrew can mean either, but its pairing with “the heavens above” favors “the earth” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I have spoken, I have purposed
  simplified_phrase: I have spoken and made my decision
  preserved_meaning: God has declared his settled intention.
  reasoning_layer_used: Lexical decision for זַמֹּתִי and its stated alternatives
  rationale: “Made my decision” expresses deliberate resolve in familiar English.
- pob_phrase: and I have not relented, nor will I turn back from it
  simplified_phrase: I have not relented, and I will not turn back from it
  preserved_meaning: God will not withdraw from the judgment he has announced.
  reasoning_layer_used: Lexical and theological decisions for נִחַמְתִּי and שׁוב
  rationale: The shorter coordination keeps both the refusal to relent and the turning-back image.
translation_notes:
  risk_flags:
  - risk: “Earth” may sound broader than the judgment centered on Judah.
    mitigation: The footnote preserves “land,” while the main text follows the cosmic heaven-and-earth parallel.
