- pob_phrase: my people are foolish; they do not know me
  simplified_phrase: my people are fools who do not know me
  preserved_meaning: God’s own people remain morally foolish because they lack relational knowledge of him.
  reasoning_layer_used: POB lexical and theological decisions on אֱוִיל, עַמִּי, and knowing God
  rationale: The relative clause creates natural English while retaining both covenant identity and moral folly.
- pob_phrase: They are foolish children, and they have no understanding
  simplified_phrase: They are children without good sense or understanding
  preserved_meaning: The whole people are characterized by folly and lack of discernment.
  reasoning_layer_used: POB lexical decisions and gender-rendering decision for בָּנִים
  rationale: The coordinated wording removes repetition without merging good sense and understanding.
- pob_phrase: They are wise to do evil
