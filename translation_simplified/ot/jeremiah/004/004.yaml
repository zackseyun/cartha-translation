translation:
  language: en
  text: Men of Judah and residents of Jerusalem, circumcise yourselves for Yahweh. Cut away the foreskins of your hearts.[a] Otherwise, my wrath will break out like fire and burn, and no one will be able to put it out, because your deeds are evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This bodily image calls for inward covenant loyalty and repentance.
    reason: cultural_note
