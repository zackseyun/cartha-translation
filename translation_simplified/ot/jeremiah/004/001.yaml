translation:
  language: en
  text: “Israel, if you return,” declares Yahweh, “you should return to me.[a] If you remove your detestable things[b] from my presence and do not wander about,[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “If you return, Israel, you will return to me,” preserving the repeated Hebrew verb more formally.
    reason: alternative_reading
  - marker: b
    text: “Detestable things” refers especially to abhorrent objects of idol worship.
    reason: lexical_alternative
  - marker: c
    text: Or, “do not waver” or “do not stray”; the Hebrew can describe wandering or instability.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If you return, O Israel, declares Yahweh, to me you should return
  simplified_phrase: “Israel, if you return,” declares Yahweh, “you should return to me.”
  preserved_meaning: Both calls to return remain, with the second directing Israel specifically to Yahweh.
  reasoning_layer_used: Theological decision on the repeated שוב clauses
  rationale: The new clause order is natural English while retaining the Hebrew repetition and exhortation.
- pob_phrase: if you remove your detestable things from before me
  simplified_phrase: If you remove your detestable things from my presence
  preserved_meaning: The second condition requires Israel to remove abhorrent objects from Yahweh’s personal presence.
  reasoning_layer_used: Lexical decisions for אִם, שִׁקּוּצֶיךָ, and מִפָּנַי
  rationale: The wording restores the conditional structure and expresses the spatial-relational image clearly.
- pob_phrase: and do not wander about
  simplified_phrase: and do not wander about
  preserved_meaning: Israel must not continue wandering, straying, or wavering.
  reasoning_layer_used: Lexical decision for וְלֹא תָנוּד
  rationale: Retaining the broader wording avoids making movement away from Yahweh more explicit than the Hebrew does.
translation_notes:
