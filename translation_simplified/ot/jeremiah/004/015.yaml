translation:
  language: en
  text: For a voice is announcing from Dan and proclaiming disaster[a] from the hill country of Ephraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “calamity” or “trouble.” The Hebrew word can mean “wickedness” in other contexts, but here it refers to the approaching disaster.
    reason: lexical_alternative
