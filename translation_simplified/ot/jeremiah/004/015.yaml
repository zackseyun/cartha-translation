  preserved_meaning: A vivid, ongoing report is being made publicly.
  reasoning_layer_used: Lexical decision for קוֹל and מַגִּיד, reinforced by the doctrine-realignment revision.
  rationale: “Announcing” is more familiar than “declaring” while retaining the participial immediacy.
- pob_phrase: proclaiming disaster
  simplified_phrase: proclaiming disaster
  preserved_meaning: The voice publicly warns of approaching military ruin.
  reasoning_layer_used: Lexical decisions for וּמַשְׁמִיעַ and אָוֶן.
  rationale: The wording remains clear and preserves both the public announcement and judgment context.
- pob_phrase: from the hill country of Ephraim
