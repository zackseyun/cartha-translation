translation:
  language: en
  text: And you, devastated one,[a] what will you do? Even if you dress in scarlet, put on gold jewelry, and make your eyes look larger with dark makeup,[b] all your efforts to make yourself beautiful are useless. Your lovers despise you and seek to kill you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew addresses a woman, probably portraying Jerusalem or Zion as devastated; it may also be translated “plundered one” or “destroyed one.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew describes accentuating the eyes with pukh, a dark cosmetic also called kohl.
    reason: cultural_note
simplification_decisions:
- pob_phrase: though you dress in scarlet, though you adorn yourself with ornaments of gold
  simplified_phrase: Even if you dress in scarlet, put on gold jewelry
  preserved_meaning: Costly clothing and jewelry cannot avert the coming crisis.
  reasoning_layer_used: POB lexical decisions for שָׁנִי and תַעְדִּי עֲדִי זָהָב
  rationale: Common wording keeps both acts of adornment while making the concessive force clear.
- pob_phrase: though you enlarge your eyes with paint
  simplified_phrase: and make your eyes look larger with dark makeup
  preserved_meaning: She uses dark eye cosmetic to make her eyes appear larger.
  reasoning_layer_used: POB lexical decisions for תִקְרְעִי בַפּוּךְ עֵינַיִךְ and פּוּךְ
  rationale: The cosmetic idiom is stated directly so readers do not imagine physical injury.
- pob_phrase: you beautify yourself in vain. Your lovers despise you; they seek your life.
  simplified_phrase: all your efforts to make yourself beautiful are useless. Your lovers despise you and seek to kill you.
  preserved_meaning: Her beautification is futile because her lovers hold her in contempt and intend her death.
  reasoning_layer_used: POB lexical decisions for לַשָּׁוְא, תִּתְיַפִּי, מָאֲסוּ בָךְ עֹגְבִים, and נַפְשֵׁךְ יְבַקֵּשׁוּ
  rationale: Plain English preserves both the contempt of her lovers and their lethal intent.
interpretive_expansions:
- pob_phrase: they seek your life
  rendering: seek to kill you
  claim: Seeking her life means intending to take her life.
  evidence:
  - The POB lexical rationale identifies this as a common Hebrew expression for seeking to take someone’s life.
  confidence: high
  alternatives_preserved:
  - seek your life
translation_notes:
  risk_flags:
  - risk: “Dark makeup” is broader than the ancient cosmetic pukh or kohl.
    mitigation: The cultural note preserves the specific ancient term.
  - risk: The woman addressed is not explicitly identified as Jerusalem or Zion in this verse.
    mitigation: The main text leaves her unnamed, and the note presents that identification only as probable.
