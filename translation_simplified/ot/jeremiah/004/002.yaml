  preserved_meaning: The nations will make the same ambiguous referent the basis of their boasting.
  reasoning_layer_used: POB lexical decision for יִתְהַלָּלוּ and theological decision on the pronoun
  rationale: The natural word order retains both the boasting image and the ambiguous pronoun.
