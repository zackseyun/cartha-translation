  preserved_meaning: The oath must be genuine and accompanied by just, upright conduct.
  reasoning_layer_used: POB lexical decisions for אֱמֶת, מִשְׁפָּט, and צְדָקָה
  rationale: The recast uses natural English while preserving all three ethical qualities.
- pob_phrase: nations will bless themselves in him
  simplified_phrase: the nations will find blessing for themselves in him
  preserved_meaning: The nations themselves receive benefit associated with the unnamed male referent.
  reasoning_layer_used: POB lexical decisions for וְהִתְבָּרְכוּ and בּוֹ
  rationale: “Find blessing for themselves” explains the reflexive sense without adding intentional pursuit.
- pob_phrase: in him they will boast
