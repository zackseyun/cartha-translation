translation:
  language: en
  text: If you swear, “As Yahweh lives,” truthfully, with justice and righteousness, then the nations will find blessing for themselves in him[a], and they will boast in him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the nations will be blessed in him”; the Hebrew may have this passive-like sense.
    reason: lexical_alternative
  - marker: b
    text: “Him” may refer to restored Israel or Judah, though some understand it to refer to Yahweh.
    reason: alternative_reading
