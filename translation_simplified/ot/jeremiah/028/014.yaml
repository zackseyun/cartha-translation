  preserved_meaning: The words introduce Yahweh’s direct declaration.
  reasoning_layer_used: POB translation and target-style guidance
  rationale: The common English formula is clearer without changing the speaker or force.
- pob_phrase: an iron yoke on the necks of all these nations, to serve
  simplified_phrase: an iron yoke around the necks of all these nations, making them serve
  preserved_meaning: The nations are placed under harsh subjection to Babylon.
  reasoning_layer_used: Lexical decision for עֹל בַּרְזֶל and theological decision on divine sovereignty
  rationale: The rewrite keeps the physical yoke image while making its political effect explicit.
- pob_phrase: the beasts of the field
  simplified_phrase: the wild animals
  preserved_meaning: Animal life is included in what Yahweh grants Nebuchadnezzar.
  reasoning_layer_used: Lexical alternatives for חַיַּת הַשָּׂדֶה
  rationale: “Wild animals” expresses the biblical idiom in ordinary modern English.
