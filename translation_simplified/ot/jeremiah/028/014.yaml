translation:
  language: en
  text: 'For this is what Yahweh of hosts[a], the God of Israel, says: “I have placed an iron yoke around the necks of all these nations, making them serve King Nebuchadnezzar of Babylon. They will serve him. I have also put the wild animals under his control.”'
  philosophy: optimal-equivalence
  footnotes:
