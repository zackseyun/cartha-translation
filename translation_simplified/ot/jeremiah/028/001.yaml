translation:
  language: en
  text: During that year, at the beginning of the reign of Zedekiah king of Judah—in the fourth year, in the fifth month[a]—Hananiah son of Azzur, the prophet from Gibeon, spoke to me in Yahweh’s house. In full view of the priests and all the people, he said,
  philosophy: optimal-equivalence
  footnotes:
