  preserved_meaning: Hananiah presents the message as a declaration from Yahweh.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה and יְהוָה
  rationale: The standard prophetic formula is expressed in familiar English while retaining Yahweh’s name.
- pob_phrase: from upon the neck of all the nations
