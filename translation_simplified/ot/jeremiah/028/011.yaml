translation:
  language: en
  text: 'Hananiah spoke where all the people could see him: “This is what Yahweh says: ‘In this same way[a], within two years I will break the yoke of Nebuchadnezzar king of Babylon off the necks of all the nations.’” Then Jeremiah the prophet went on his way.'
