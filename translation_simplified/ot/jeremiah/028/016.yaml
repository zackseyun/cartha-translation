- pob_phrase: because you have spoken rebellion against Yahweh
  simplified_phrase: because what you have said is rebellion against Yahweh
  preserved_meaning: Hananiah’s speech itself constitutes rebellion against Yahweh.
  reasoning_layer_used: Lexical decision for סָרָה and דִבַּרְתָּ אֶל יְהוָה
  rationale: The recast clause makes the unusual Hebrew expression immediately understandable without weakening “rebellion.”
- pob_phrase: I am sending you away from the face of the earth. This year you will die
  simplified_phrase: I am sending you away from the face of the earth. You will die this year
  preserved_meaning: Yahweh sentences Hananiah to imminent death while retaining the Hebrew image of removal from the earth.
  reasoning_layer_used: Theological decision on the removal idiom
  rationale: Natural word order lets the second sentence clearly explain the image as death.
