translation:
  language: en
  text: “But you, my servant Jacob, do not be afraid,” declares Yahweh. “Israel, do not lose heart. For I am indeed saving you[a] from far away, and your descendants from the land where they are held captive. Jacob will return and live undisturbed and secure. No one will make him afraid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will save you”; the Hebrew can describe action as already underway or certain to happen.
    reason: lexical_alternative
