translation:
  language: en
  text: “Look, the days are coming when I will restore the well-being of my people Israel and Judah,” declares the LORD. “I will bring them back to the land I gave their ancestors, and they will take possession of it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: restore the fortunes of my people
  simplified_phrase: restore the well-being of my people
  preserved_meaning: The LORD will reverse his people's hardship and restore their condition.
  reasoning_layer_used: POB controlling translation and immediate restoration context
  rationale: “Well-being” communicates the broad restoration more clearly than the idiom “fortunes.”
- pob_phrase: the land that I gave to their fathers
  simplified_phrase: the land I gave their ancestors
  preserved_meaning: The land was previously given by the LORD to Israel and Judah's forebears.
  reasoning_layer_used: POB controlling translation
  rationale: “Ancestors” conveys the intended family lineage in ordinary modern English.
- pob_phrase: and they will possess it
  simplified_phrase: and they will take possession of it
  preserved_meaning: The returned people will occupy the land as their own.
  reasoning_layer_used: POB controlling translation and immediate clause context
  rationale: The verbal phrase makes the future act of possessing the land easier to understand.
translation_notes:
  risk_flags:
  - risk: “Well-being” may sound narrower than the restoration idiom's full reversal of circumstances.
    mitigation: The following promise to return the people to their land supplies the broader restoration context.
