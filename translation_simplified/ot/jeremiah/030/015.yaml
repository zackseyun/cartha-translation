translation:
  language: en
  text: Why do you cry out over your injury?[a] Your pain cannot be healed.[b] Because your wrongdoing is great and your sins are many, I have done these things to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wound.” The Hebrew word can refer to a break, fracture, or wound.
    reason: lexical_alternative
  - marker: b
    text: Or “Your pain is desperate and severe.” The Hebrew can describe something grievously sick or beyond healing.
    reason: lexical_alternative
