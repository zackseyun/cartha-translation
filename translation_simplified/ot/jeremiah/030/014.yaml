translation:
  language: en
  text: All your lovers have forgotten you.[a] Not one of them looks for you. For I have struck you with an enemy’s blow and disciplined you harshly,[b] because your wrongdoing is so great and your sins are so many.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lovers” may include foreign allies whom Judah pursued like illicit lovers.
    reason: lexical_alternative
  - marker: b
    text: Or “disciplined you cruelly,” “corrected you harshly,” or “chastised you cruelly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they do not seek you
  simplified_phrase: Not one of them looks for you
  preserved_meaning: None of Judah’s former lovers or allies comes seeking her.
  reasoning_layer_used: Lexical decision for יִדְרֹשׁוּ
  rationale: This makes “seek” immediately clear without strengthening it to “abandon.”
- pob_phrase: I have struck you with the wound of an enemy, with cruel discipline
  simplified_phrase: I have struck you with an enemy’s blow and disciplined you harshly
  preserved_meaning: God inflicts judgment as severe as an enemy’s blow while the discipline remains harsh.
  reasoning_layer_used: Lexical decisions for מַכַּת אוֹיֵב, הִכִּיתִיךְ, and מוּסַר אַכְזָרִי; theological decision on divine agency
  rationale: The active wording is natural while preserving the enemy-blow image and God’s agency.
- pob_phrase: because of the greatness of your iniquity; your sins are numerous
  simplified_phrase: because your wrongdoing is so great and your sins are so many
  preserved_meaning: Judah’s great moral evil and many sins are the stated reason for judgment.
  reasoning_layer_used: Lexical decisions for עַל רֹב עֲוֺנֵךְ and עָצְמוּ חַטֹּאתַיִךְ
  rationale: Common wording retains both the moral weight and abundance of sin.
translation_notes:
  risk_flags:
  - risk: “Enemy’s blow” may be understood as a literal blow delivered by a human enemy.
    mitigation: The clause explicitly retains God as the one striking while preserving the source construction.
  - risk: “Disciplined you harshly” softens the lexical force of “cruel.”
    mitigation: The footnote preserves “disciplined you cruelly” as a lexical alternative.
