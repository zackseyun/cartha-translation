translation:
  language: en
  text: Yahweh’s burning anger will not turn back until he has acted and carried out the plans of his heart. In days to come[a], you will understand this.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “In the latter days” or “In the last days.” The Hebrew points to the future fulfillment of God’s purposes without specifying exactly when.
