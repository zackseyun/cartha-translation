translation:
  language: en
  text: No one is there to speak in your defense concerning your wound.[a] There is no healing for you—no remedy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “No one is there to judge your case concerning your wound.” The Hebrew legal image may refer to either defending or deciding a case.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word translated “remedy” may refer more concretely to a bandage or new flesh growing over a wound.
    reason: lexical_alternative
