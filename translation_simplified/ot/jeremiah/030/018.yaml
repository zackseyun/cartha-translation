translation:
  language: en
  text: 'This is what Yahweh says:


    “Look! I am restoring the well-being of Jacob’s tents,[a] and I will have compassion on his homes. The city will be rebuilt on its mound, and the palace will stand in its proper place.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “I am bringing Jacob’s people back from captivity.” It can describe either return from captivity or a broader restoration.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: 'Thus says Yahweh: Behold, I am'
  simplified_phrase: 'This is what Yahweh says: “Look! I am'
  preserved_meaning: Yahweh solemnly and emphatically announces his own action.
  reasoning_layer_used: POB lexical decisions for יְהוָה and הִנְנִי
  rationale: Common wording replaces the formal formula while “Look!” keeps its emphasis.
- pob_phrase: restoring the fortunes of the tents of Jacob
  simplified_phrase: restoring the well-being of Jacob’s tents
  preserved_meaning: Yahweh will broadly reverse Jacob’s distress while retaining the tent image.
  reasoning_layer_used: POB lexical and theological decisions for שָׁב שְׁבוּת and אָהֳלֵי יַעֲקֹב
  rationale: “Well-being” clarifies broad restoration without limiting it to release from captivity.
- pob_phrase: his dwellings
  simplified_phrase: his homes
  preserved_meaning: Yahweh has compassion on the places where Jacob’s people live.
  reasoning_layer_used: POB lexical decision for מִשְׁכְּנֹתָיו
  rationale: “Homes” is more familiar while preserving the habitation image.
translation_notes:
  risk_flags:
  - risk: “Well-being” may sound narrower than the full reversal conveyed by restoring fortunes.
    mitigation: The restoration verb and the rebuilt city and palace retain the broader theme.
  - risk: Readers may understand “Jacob’s tents” as only literal shelters.
    mitigation: The footnote identifies Jacob’s people and preserves the captivity-related alternative.
