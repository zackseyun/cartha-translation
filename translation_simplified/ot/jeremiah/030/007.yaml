  preserved_meaning: Jacob will undergo a period of severe trouble.
  reasoning_layer_used: Lexical and theological decisions for צָרָה and Jacob
  rationale: The future wording is natural while retaining Jacob rather than replacing the name with an interpretation.
- pob_phrase: yet he will be saved out of it
  simplified_phrase: yet he will be saved from it
  preserved_meaning: Jacob will be rescued from the distress.
  reasoning_layer_used: Lexical and theological decisions for יִוָּשֵׁעַ and וּמִמֶּנָּה
  rationale: Natural English preserves the biblical salvation term and identifies the distress as what he is saved from.
