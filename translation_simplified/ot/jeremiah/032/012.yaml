- pob_phrase: gave the deed of purchase
  simplified_phrase: handed the deed of purchase
  preserved_meaning: Jeremiah transferred the purchase document to Baruch.
  reasoning_layer_used: POB lexical decisions for וָאֶתֵּן and סֵפֶר הַמִּקְנָה
  rationale: “Handed” clearly describes giving a physical legal document while retaining its purchase-specific name.
- pob_phrase: in the sight of ... in the sight of ... in the sight of
  simplified_phrase: I did this in full view of
  preserved_meaning: The transfer took place publicly before all the people named.
  reasoning_layer_used: POB lexical rationale for לְעֵינֵי
  rationale: The new sentence preserves the repeated formula’s public legal force without its cumbersome repetition.
- pob_phrase: Baruch son of Neriah, son of Mahseiah
  simplified_phrase: Baruch, son of Neriah and grandson of Mahseiah
  preserved_meaning: Baruch is identified through his father Neriah and grandfather Mahseiah.
  reasoning_layer_used: POB lexical decision for the consecutive genealogy
  rationale: The explicit relationships prevent readers from mistaking Mahseiah for another son of Baruch.
