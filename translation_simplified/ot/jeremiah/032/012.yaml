translation:
  language: en
  text: Then I handed the deed of purchase to Baruch, son of Neriah and grandson of Mahseiah. I did this in full view of Hanamel my uncle,[a] the witnesses who wrote their names on the deed, and all the Judeans sitting in the court of the guard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elsewhere in this chapter, Hanamel is identified as Jeremiah’s cousin, the son of his uncle.
    reason: cross_reference
