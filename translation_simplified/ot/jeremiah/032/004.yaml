  reasoning_layer_used: Lexical decisions for הִנָּתֹן יִנָּתֵן and בְּיַד
  rationale: “Certainly” preserves the Hebrew emphasis, while “handed over” makes the passive action clear.
- pob_phrase: he will speak mouth to mouth with him, and his eyes will see his eyes
  simplified_phrase: The two kings will speak directly, mouth to mouth, and Zedekiah’s eyes will meet the other king’s eyes
  preserved_meaning: Zedekiah and Babylon’s king will have a direct personal encounter.
  reasoning_layer_used: Lexical decisions for the mouth and eye expressions
  rationale: The wording identifies both participants and preserves the source’s vivid body-part images.
