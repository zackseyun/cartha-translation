translation:
  language: en
  text: Zedekiah king of Judah will not escape the grasp of the Chaldeans.[a] He will certainly be handed over into the hands of the king of Babylon. The two kings will speak directly, mouth to mouth,[b] and Zedekiah’s eyes will meet the other king’s eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Chaldeans were the people who ruled Babylon at this time.
    reason: cultural_note
  - marker: b
    text: “Mouth to mouth” pictures a direct personal encounter.
    reason: simplification_note
