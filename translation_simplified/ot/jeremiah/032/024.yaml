translation:
  language: en
  text: Look! The siege ramps have reached the city to capture it. The city has been handed over to the Chaldeans[a], who are attacking it, because of the sword, famine, and plague. What you said has happened. Look! You can see it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Chaldeans were the Babylonian forces.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the siege ramps have come up against the city
  simplified_phrase: The siege ramps have reached the city
  preserved_meaning: The attackers’ earthworks have advanced to the city for the assault.
  reasoning_layer_used: Lexical decision for הַסֹּלְלוֹת and בָּאוּ ... הָעִיר
  rationale: “Reached” states the military advance in direct modern English.
- pob_phrase: has been given into the hand of
  simplified_phrase: has been handed over to
  preserved_meaning: The city has been delivered into the Chaldeans’ power.
  reasoning_layer_used: Lexical decision for נִתְּנָה בְּיַד
  rationale: The common English idiom clearly conveys transfer of power.
- pob_phrase: What you spoke has happened, and look, you see it
  simplified_phrase: What you said has happened. Look! You can see it.
  preserved_meaning: God’s prior word has been fulfilled before his own observation.
  reasoning_layer_used: Theological decision on divine speech fulfillment and lexical decision for וְהִנְּךָ רֹאֶה
  rationale: Short sentences preserve both fulfillment and vivid direct observation.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize the Chaldeans as Babylonian forces.
    mitigation: An anchored cultural footnote supplies the historical identification while retaining the Hebrew ethnonym.
