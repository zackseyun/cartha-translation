translation_notes:
  risk_flags:
  - risk: “Formally confirmed” is less verbally close to the Hebrew legal formula “witness witnesses.”
    mitigation: The wording retains both formal attestation and the role of witnesses.
  - risk: “Restore their fortunes” does not by itself make the return from exile explicit.
    mitigation: The footnote preserves the exile and captivity alternatives without narrowing the main text.
