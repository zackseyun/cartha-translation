translation:
  language: en
  text: 'Fields will be bought with silver. The property deed will be written in a scroll, sealed, and formally confirmed by witnesses. This will happen in the land of Benjamin, around Jerusalem, and in the cities of Judah: in the hill country, the lowland, and the southern region called the Negeb. For I will restore their fortunes,[a] declares Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “I will bring back their exiles” or “I will restore their captivity”; the promise includes return from exile and broader restoration.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: deeds will be written in a scroll and sealed and witnessed by witnesses
  simplified_phrase: The property deed will be written in a scroll, sealed, and formally confirmed by witnesses.
  preserved_meaning: The legal document for the field purchase will be recorded, sealed, and formally validated by witnesses.
  reasoning_layer_used: POB lexical decisions for סֵפֶר and וְהָעֵד עֵדִים
  rationale: “Property deed” clarifies the transaction, while “formally confirmed” removes awkward repetition without weakening its legal force.
- pob_phrase: in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb
  simplified_phrase: 'in the cities of Judah: in the hill country, the lowland, and the southern region called the Negeb'
  preserved_meaning: Property transactions will resume throughout Judah’s named geographic regions.
  reasoning_layer_used: POB lexical decisions for הָהָר, הַשְּׁפֵלָה, and הַנֶּגֶב
  rationale: The colon reduces repetition, and the geographic label explains the unfamiliar name “Negeb.”
- pob_phrase: for I will restore their fortunes
  simplified_phrase: For I will restore their fortunes
  preserved_meaning: Yahweh promises comprehensive restoration that includes but is not limited to return from exile.
  reasoning_layer_used: POB theological decision for שְׁבוּת
  rationale: This idiom is retained because wording limited to returning exiles would narrow the promise.
