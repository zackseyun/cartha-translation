translation:
  language: en
  text: 'This was because King Zedekiah of Judah had put him under guard. Zedekiah asked him, “Why are you prophesying, ‘This is what Yahweh says: See, I am handing this city over to the king of Babylon, and he will capture it’?”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because Zedekiah king of Judah had confined him
  simplified_phrase: This was because King Zedekiah of Judah had put him under guard.
  preserved_meaning: Zedekiah had already placed the prophet in custody, which explains the situation in the previous verse.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר and כְּלָאוֹ
  rationale: A complete sentence and the familiar phrase “under guard” make the connection and custodial setting immediately clear.
- pob_phrase: saying, “Why do you prophesy, saying
  simplified_phrase: Zedekiah asked him, “Why are you prophesying
  preserved_meaning: The king directly challenges the prophet for delivering this prophecy.
  reasoning_layer_used: POB lexical decisions for לֵאמֹר, מַדּוּעַ, and נִבָּא
  rationale: Replacing the repeated “saying” with ordinary quoted-speech structure removes awkwardness without merging the question and prophecy.
- pob_phrase: 'Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon'
  simplified_phrase: 'This is what Yahweh says: See, I am handing this city over to the king of Babylon'
  preserved_meaning: Yahweh solemnly declares that he is placing the city under Babylon’s power.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה אָמַר יְהוָה, הִנְנִי, נֹתֵן, and בְּיַד
  rationale: The wording uses common English while “handing over” preserves the source image of transfer into another’s hand.
translation_notes:
  risk_flags:
