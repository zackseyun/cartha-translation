translation:
  language: en
  text: 'For this is what Yahweh of hosts[a], the God of Israel, says: Houses, fields, and vineyards will once again be bought[b] in this land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh of hosts” presents Yahweh as commander of the forces of heaven and earth.
    reason: simplification_note
  - marker: b
    text: Or, “People will once again buy houses, fields, and vineyards in this land.” The Hebrew form can be understood this way, though the passive wording is more likely here.
    reason: lexical_alternative
