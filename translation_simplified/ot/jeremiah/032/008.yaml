translation:
  language: en
  text: Then Hanamel, my uncle’s son, came to me in the court of the guard, where I was being held, just as Yahweh had said. He told me, “Please buy my field at Anathoth, in the land of Benjamin. You have the family right to inherit it, and the right to redeem it is yours.[a] Buy it for yourself.” Then I knew that this was what Yahweh had said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer to a close relative’s legal right or responsibility to recover family property.
    reason: lexical_alternative
