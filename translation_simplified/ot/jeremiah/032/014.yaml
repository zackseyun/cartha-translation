translation:
  language: en
  text: 'This is what Yahweh of hosts[a], the God of Israel, says: “Take these documents—the deed of purchase, both its sealed copy and its open copy[b]—and put them in a clay container so they will be preserved for a long time.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and presents Yahweh as commander of heavenly and earthly forces.
    reason: lexical_alternative
  - marker: b
    text: That is, the unsealed copy, in contrast to the sealed copy.
    reason: alternative_reading
