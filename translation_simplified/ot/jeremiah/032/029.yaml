  text: The Chaldeans[a] who are attacking this city will come. They will set the city on fire and burn it, including the houses where people burned incense to Baal on the rooftops and poured out drink offerings to other gods. People did these things to provoke me to anger.
  philosophy: optimal-equivalence
  footnotes:
