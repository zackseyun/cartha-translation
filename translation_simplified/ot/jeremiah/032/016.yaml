simplification_decisions:
- pob_phrase: After I had given
  simplified_phrase: After I gave
  preserved_meaning: Jeremiah gave the deed before he prayed.
  reasoning_layer_used: Lexical decision for אַחֲרֵי and תִתִּי
  rationale: The word “after” already makes the sequence clear, so the simpler past tense is sufficient.
- pob_phrase: the deed of purchase
  simplified_phrase: the purchase deed
  preserved_meaning: The item was the legal document recording the purchase.
  reasoning_layer_used: Lexical decision for סֵפֶר הַמִּקְנָה
  rationale: “Purchase deed” is shorter and more natural while retaining the legal-document sense.
- pob_phrase: I prayed to Yahweh, saying,
  simplified_phrase: 'I prayed to Yahweh:'
  preserved_meaning: The prayer’s words begin in the next verse.
  reasoning_layer_used: Lexical decision for וָאֶתְפַּלֵּל and לֵאמֹר; theological decision for יְהוָה
  rationale: A colon clearly introduces the prayer without the awkward phrase “prayed, saying.”
translation_notes:
  risk_flags:
  - risk: Replacing the past perfect could seem to weaken the time sequence.
    mitigation: The opening word “After” still explicitly marks the deed’s transfer as earlier.
  - risk: Readers may be unfamiliar with the name Yahweh.
    mitigation: The footnote identifies the Hebrew form and its traditional English rendering.
