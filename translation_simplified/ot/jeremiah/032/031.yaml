translation:
  language: en
  text: For this city has provoked my anger and wrath from the day they built it until this very day. As a result, I will remove it from before my face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “remove it from my presence.”
