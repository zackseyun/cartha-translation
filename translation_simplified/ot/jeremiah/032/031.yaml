  rationale: The active wording expresses the documented Hebrew idiom in natural English.
- pob_phrase: from the day they built it even to this day
  simplified_phrase: from the day they built it until this very day
  preserved_meaning: The city’s provocation has continued from its founding to the present.
  reasoning_layer_used: POB lexical decisions for the starting point and continuing duration
  rationale: The revised time phrase is easier to read while retaining its emphatic span.
- pob_phrase: so that I should remove it from before my face
  simplified_phrase: As a result, I will remove it from before my face
  preserved_meaning: The city’s long provocation results in God removing it from before him.
  reasoning_layer_used: POB lexical and theological decisions for לַהֲסִירָהּ and מֵעַל פָּנַי
  rationale: Two sentences clarify the consequence while preserving God’s agency and the bodily image.
