translation:
  language: en
  text: You make wise plans and do mighty deeds. Your eyes are open to every way the sons of man live.[a] You give each man according to how he lives and according to the fruit his deeds produce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression “sons of man” refers collectively to all human beings.
    reason: lexical_alternative
