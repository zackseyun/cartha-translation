  preserved_meaning: God sees every course of human conduct.
  reasoning_layer_used: POB lexical and theological decisions on divine eyes and human ways
  rationale: The bodily image remains while “ways” is explained as ways of living.
- pob_phrase: according to his ways and according to the fruit of his deeds
