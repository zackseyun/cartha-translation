translation:
  language: en
  text: You show steadfast love to thousands.[a] You also repay the iniquity of fathers into the laps of their children after them. You are the great and mighty God; your name is Yahweh of Armies.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to thousands of generations.” The Hebrew says simply “to thousands.”
    reason: lexical_alternative
  - marker: b
    text: Or “Yahweh of hosts,” traditionally “the LORD of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: showing steadfast love to thousands
  simplified_phrase: You show steadfast love to thousands
  preserved_meaning: God continually displays loyal, covenant love to thousands.
  reasoning_layer_used: Lexical decisions for עֹשֶׂה and חֶסֶד
  rationale: A direct subject and finite verb make the continuing description easier to follow.
- pob_phrase: repaying the iniquity of fathers into the lap of their children after them
  simplified_phrase: You also repay the iniquity of fathers into the laps of their children after them
  preserved_meaning: God’s recompense has an intergenerational dimension, while iniquity, guilt, and consequence remain unresolved.
  reasoning_layer_used: Lexical decisions for וּמְשַׁלֵּם, עֲוֺן, and אֶל חֵיק; theological decision on intergenerational recompense
  rationale: The direct wording preserves both the lap image and the deliberate ambiguity without adding a separate act of placement.
- pob_phrase: the great, mighty God, Yahweh of Armies, is his name
  simplified_phrase: You are the great and mighty God; your name is Yahweh of Armies
  preserved_meaning: The prayer identifies God by his greatness, might, personal name, and sovereign military title.
  reasoning_layer_used: Lexical decisions for the divine descriptions, name, and title
  rationale: Two direct clauses clarify the dense ending while retaining every divine description.
translation_notes:
  risk_flags:
  - risk: The expression about repaying iniquity into children’s laps remains difficult and may suggest several kinds of intergenerational consequence.
    mitigation: The wording preserves the source ambiguity rather than choosing guilt, punishment, or social consequences.
  - risk: “Armies” may be understood as only human forces.
    mitigation: The retained divine title preserves the broad scriptural image of forces under Yahweh’s command.
