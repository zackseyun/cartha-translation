translation:
  language: en
  text: Then Yohanan son of Kareah and all the army commanders with him took along all the surviving people. Yohanan had rescued them from Ishmael son of Nethaniah and brought them back from Gibeon. Ishmael had taken them from Mizpah after striking down Gedaliah son of Ahikam. They included the men, including the fighting men, the women, the little children, and the court officials.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “eunuchs”; the Hebrew word can refer either to eunuchs or to royal officials.
    reason: lexical_alternative
