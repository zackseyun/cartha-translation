translation:
  language: en
  text: In the seventh month, Ishmael came with ten men to Gedaliah son of Ahikam at Mizpah. Ishmael was the son of Nethaniah, who was the son of Elishama. He belonged to the royal line and was one of the king’s chief officers.[a] There in Mizpah, they ate bread together.[b]
  philosophy: optimal-equivalence
  footnotes:
