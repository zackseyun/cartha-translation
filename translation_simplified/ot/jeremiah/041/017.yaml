translation:
  language: en
  text: So they went to Geruth Chimham[a][b], near Bethlehem, and stayed there. They intended to continue into Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Chimham’s lodging place.” The Hebrew probably gives a place-name, but it may describe a lodging place connected with Chimham.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew spelling is irregular here, but the context supports “Chimham,” a name also found in 2 Samuel 19:37–40.
    reason: textual_variant
