translation:
  language: en
  text: Then Ishmael son of Nethaniah and the ten men with him attacked Gedaliah with swords and killed him. Gedaliah was the son of Ahikam and grandson of Shaphan, and the king of Babylon had appointed him to govern the land.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: rose up with the ten men who were with him
  simplified_phrase: and the ten men with him attacked
  preserved_meaning: Ishmael and his known group began hostile action together.
  reasoning_layer_used: The lexical rationale says “rose up” initiates hostile action, and the following lethal assault defines that action.
  rationale: Stating “attacked” directly makes the hostile narrative force immediately clear.
- pob_phrase: Gedaliah son of Ahikam, son of Shaphan
  simplified_phrase: Gedaliah was the son of Ahikam and grandson of Shaphan
  preserved_meaning: The full family line identifying Gedaliah remains intact.
  reasoning_layer_used: The patronymic-chain decision requires preserving both generations for identification.
  rationale: Using “grandson” clarifies the relationship without dropping Shaphan.
- pob_phrase: whom the king of Babylon had appointed over the land
  simplified_phrase: the king of Babylon had appointed him to govern the land
  preserved_meaning: Gedaliah held governing authority by appointment from Babylon’s king.
  reasoning_layer_used: The lexical decision treats “over the land” as jurisdiction rather than location.
  rationale: “To govern” explains the administrative meaning of being appointed over the land.
interpretive_expansions:
- pob_phrase: with the sword
  rendering: with swords
  claim: The attackers used bladed weapons in the assault.
  evidence:
  - The lexical rationale says singular “sword” is an English idiom for death by bladed weaponry.
  - The plural attackers make ordinary English “with swords” natural without changing the means of attack.
  confidence: high
  alternatives_preserved:
  - with the sword
  - by the sword
translation_notes:
  risk_flags:
  - risk: Changing singular “sword” to plural “swords” makes the collective weapon image more concrete than the Hebrew form.
    mitigation: The rendering retains the same bladed-weapon means and does not specify how many swords were used.
