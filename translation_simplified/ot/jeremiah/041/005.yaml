translation:
  language: en
  text: Then eighty men arrived from Shechem, Shiloh, and Samaria. They had shaved their beards, torn their clothes, and gashed themselves as signs of mourning. In their hands they carried grain offerings and frankincense to bring to the house of Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
