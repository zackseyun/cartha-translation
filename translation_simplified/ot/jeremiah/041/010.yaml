translation:
  language: en
  text: Then Ishmael captured the whole remnant of the people at Mizpah—the king’s daughters and everyone else who remained there. Nebuzaradan, captain of the guard, had entrusted them to the care of Gedaliah son of Ahikam. Ishmael son of Nethaniah took them away as captives and set out with them to cross over to the Ammonites.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: took captive all the remnant of the people who were in Mizpah
  simplified_phrase: captured the whole remnant of the people at Mizpah
  preserved_meaning: Ishmael violently seized the entire surviving group while retaining Jeremiah’s remnant theme.
  reasoning_layer_used: POB lexical decisions for שׁבה and שְׁאֵרִית הָעָם
  rationale: The active verb and shorter location phrase make the seizure easier to grasp.
- pob_phrase: all the people who were left in Mizpah
  simplified_phrase: everyone else who remained there
  preserved_meaning: The phrase includes all remaining people in Mizpah in addition to the king’s daughters.
  reasoning_layer_used: POB lexical decision for הַנִּשְׁאָרִים and immediate syntax
  rationale: This avoids repeating the place name while keeping the group inclusive.
- pob_phrase: whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam
  simplified_phrase: Nebuzaradan, captain of the guard, had entrusted them to the care of Gedaliah son of Ahikam
  preserved_meaning: Nebuzaradan had placed the captives under Gedaliah’s oversight.
  reasoning_layer_used: POB lexical decisions for הִפְקִיד and רַב טַבָּחִים
  rationale: A separate sentence and the words “to the care of” clarify the oversight relationship.
translation_notes:
  risk_flags:
  - risk: “Captured” could weaken the repeated captivity emphasis in the Hebrew.
    mitigation: The final sentence explicitly says Ishmael took them away as captives.
