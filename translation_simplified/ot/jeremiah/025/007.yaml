translation:
  language: en
  text: “Yet you did not listen to me,” declares Yahweh. “And so[b] you provoked me to anger by what you did with your own hands,[a] to your own harm.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the work of your hands”; this can include deeds, and in Jeremiah it often refers to idols or idolatrous works.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew can express either purpose or result: “in order to” or “with the result that.”'
    reason: source_note
