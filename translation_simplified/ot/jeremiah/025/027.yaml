  text: 'You are to tell them, “This is what Yahweh of hosts,[a] the God of Israel, says: Drink until you are drunk. Vomit and fall down. Do not get up, because of the sword I am sending among you.”'
  philosophy: optimal-equivalence
  footnotes:
