translation:
  language: en
  text: Like a young lion, he has left his den. Their land has become a wasteland because of the oppressor’s[a] burning anger and because of his[b] burning anger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of the burning anger of the dove.” The Hebrew written form can be read that way, but the context strongly favors “the oppressor.”
    reason: alternative_reading
  - marker: b
    text: “His” likely refers to the LORD in the surrounding context, though it may refer to the oppressor.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Like a young lion, he has left his den, for
  simplified_phrase: Like a young lion, he has left his den.
  preserved_meaning: The LORD is pictured as a young lion leaving its dwelling to bring judgment.
  reasoning_layer_used: Theological decision and lexical decisions for כַּכְּפִיר and סֻכּוֹ
  rationale: A sentence break clarifies the lion image without identifying its subject more explicitly than POB does.
- pob_phrase: their land has become a desolation
  simplified_phrase: Their land has become a wasteland
  preserved_meaning: The land has been reduced to a devastated condition.
  reasoning_layer_used: Lexical decision for הָיְתָה אַרְצָם לְשַׁמָּה
  rationale: “Wasteland” expresses the resulting devastation in familiar English.
- pob_phrase: because of the burning anger of the oppressor, and because of his burning anger
  simplified_phrase: because of the oppressor’s burning anger and because of his burning anger
  preserved_meaning: Two parallel causes are retained, along with the Hebrew image of anger as burning.
  reasoning_layer_used: Lexical decisions for מִפְּנֵי, חֲרוֹן, הַיּוֹנָה, and חֲרוֹן אַפּוֹ
  rationale: The possessive form is easier to read while preserving the parallel phrases and pronoun ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume the final “his” must refer to the oppressor.
    mitigation: Footnote b preserves the likely reference to the LORD and the alternative reading.
  - risk: The repeated phrase “burning anger” may sound redundant in English.
    mitigation: The repetition remains because it preserves the source’s parallel force and heat image.
