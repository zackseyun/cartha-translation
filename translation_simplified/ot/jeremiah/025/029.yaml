translation:
  language: en
  text: “Look! I am beginning to bring harm on the city that bears my name.[a] Will you really go unpunished? You will not go unpunished. I am calling for a sword against everyone who lives on the earth,[b]” declares Yahweh of hosts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the city that is called by my name.” The Hebrew pictures God’s name as called over the city, marking it as his.
    reason: lexical_alternative
  - marker: b
    text: Or “everyone who lives in the land.” The Hebrew word can mean either “earth” or “land.”
    reason: alternative_reading
