translation:
  language: en
  text: On that day, those Yahweh has slain will lie from one end of the earth to the other.[a] No one will mourn for them, gather up their bodies, or bury them. They will become dung on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the slain of Yahweh.” The Hebrew can also say “from one end of the land to the other,” but the wider context favors “earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the slain of Yahweh
  simplified_phrase: those Yahweh has slain
  preserved_meaning: Yahweh is directly presented as the agent of the killing in judgment.
  reasoning_layer_used: lexical decision, immediate context, and grounding review
  rationale: The active wording makes the agency clear without weakening the verse’s judicial force.
- pob_phrase: will be from one end of the earth even to the other end of the earth
  simplified_phrase: will lie from one end of the earth to the other
  preserved_meaning: The dead will extend across the earth in the aftermath of judgment.
  reasoning_layer_used: lexical decision and oracle context
  rationale: “Will lie” naturally describes bodies spread across the ground while preserving the worldwide scope.
- pob_phrase: or gathered
  simplified_phrase: gather up their bodies
  preserved_meaning: The corpses will not be collected for burial.
  reasoning_layer_used: lexical decision and burial sequence
  rationale: Naming the bodies makes the battlefield meaning of “gathered” immediately clear.
interpretive_expansions:
- pob_phrase: the slain of Yahweh
  rendering: those Yahweh has slain
  claim: Yahweh is the agent responsible for the deaths in this judgment.
  evidence:
  - The Hebrew construct naturally permits direct agency.
  - Jeremiah 25:31–33 portrays Yahweh judging the nations and giving the wicked to the sword.
  confidence: high
  alternatives_preserved:
  - the slain of Yahweh
- pob_phrase: or gathered
  rendering: gather up their bodies
  claim: Those not gathered are the corpses of the slain.
  evidence:
  - The sequence proceeds from mourning to collecting the dead and burying them.
  - The POB lexical rationale identifies corpses gathered after battle or disaster.
  confidence: high
  alternatives_preserved:
  - collected
  - taken away
translation_notes:
  risk_flags:
  - risk: “Will lie” is supplied to describe the location of the slain rather than directly matching a separate Hebrew verb.
    mitigation: The wording expresses the verse’s stated distribution of unburied bodies without adding a new event.
  - risk: “Become dung” may sound like literal transformation.
    mitigation: The surrounding references to unburied bodies make the image one of decay and degradation.
