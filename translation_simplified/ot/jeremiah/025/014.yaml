translation:
  language: en
  text: For many nations and powerful kings will force even the Babylonians to serve them.[a] I will repay the Babylonians according to what they have done and according to the deeds of their own hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and more literally says that many nations and great kings “have served, or served themselves with, them.” In context, it most likely means that Babylon will be forced to serve others.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: many nations and great kings will make even them serve
  simplified_phrase: many nations and powerful kings will force even the Babylonians to serve them
  preserved_meaning: Powerful nations and rulers will reverse Babylon’s domination by forcing it into service.
  reasoning_layer_used: Lexical and theological decisions on עָבְדוּ בָם, גַּם הֵמָּה, and the referent of “them”
  rationale: Naming the Babylonians clarifies the pronoun, while “force” makes the imposed service clear.
- pob_phrase: according to their work
  simplified_phrase: according to what they have done
  preserved_meaning: God’s repayment will correspond to Babylon’s actions.
  reasoning_layer_used: Lexical decision on כְּפָעֳלָם and grounding review
  rationale: The wording is natural English and retains the judicial measure expressed by “according to.”
- pob_phrase: according to the work of their hands
  simplified_phrase: according to the deeds of their own hands
  preserved_meaning: Babylon will be repaid in keeping with its concrete actions.
  reasoning_layer_used: Lexical decision on וּכְמַעֲשֵׂה יְדֵיהֶם and grounding review
  rationale: The rewrite preserves both the repeated standard of repayment and the Hebrew hand image.
interpretive_expansions:
