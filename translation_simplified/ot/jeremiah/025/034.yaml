translation:
  language: en
  text: Wail and cry out, you shepherds! Roll in the dust, you lords of the flock! The time for your slaughter has come, and so has your scattering.[a] You will fall like a precious jar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; it may refer to the time when they will be scattered, or more literally to their “dispersions” having come.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: for the days of your slaughter are fulfilled
  simplified_phrase: The time for your slaughter has come
  preserved_meaning: Their appointed period of judgment has reached its fullness.
  reasoning_layer_used: lexical rationale
  rationale: This recasts the formal time expression in direct modern English while keeping “slaughter.”
- pob_phrase: and your dispersions have come
  simplified_phrase: and so has your scattering
  preserved_meaning: Their scattering or dispersion has arrived as part of the judgment.
  reasoning_layer_used: lexical decision and ambiguity footnote
  rationale: The singular verbal noun is easier to understand, while the note preserves the difficult Hebrew construction.
- pob_phrase: like a precious vessel
  simplified_phrase: like a precious jar
  preserved_meaning: They will fall like a valued but breakable object.
  reasoning_layer_used: lexical alternatives and rationale
  rationale: “Jar” gives common readers a concrete picture without removing the simile.
translation_notes:
  risk_flags:
  - risk: “Scattering” may sound more definite than the difficult Hebrew permits.
    mitigation: The footnote preserves the more literal wording and marks the uncertainty.
  - risk: “Jar” narrows the broader word “vessel.”
    mitigation: It follows the documented lexical alternative and preserves the valued, breakable-object image.
