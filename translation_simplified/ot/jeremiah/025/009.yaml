translation:
  language: en
  text: “Look,” declares Yahweh, “I am about to summon all the northern clans, together with my servant Nebuchadnezzar king of Babylon.[a] I will bring them against this land, its people, and all the nations around it. I will devote them to destruction.[b] I will make them a horrifying sight, something people hiss at in scorn, and permanent ruins.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My servant” means that Yahweh will use Nebuchadnezzar to carry out his purpose, not necessarily that Nebuchadnezzar faithfully worships him.
    reason: cultural_note
  - marker: b
    text: The Hebrew describes placing people or things under a ban that devotes them to destruction; it can also be translated “utterly destroy them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am sending for and taking all the clans of the north
  simplified_phrase: I am about to summon all the northern clans
  preserved_meaning: Yahweh is gathering northern peoples for imminent and certain action.
  reasoning_layer_used: The lexical rationale identifies an idiom of summoning and imminent prophetic action.
  rationale: “Summon” expresses the combined action in natural English.
- pob_phrase: against this land and against its inhabitants and against all these surrounding nations
  simplified_phrase: against this land, its people, and all the nations around it
  preserved_meaning: The attack targets the land, those living there, and neighboring nations.
  reasoning_layer_used: The lexical decisions support hostile movement against three distinct targets.
  rationale: The shorter list removes repetition without merging its targets.
- pob_phrase: make them a horror, a hissing, and everlasting ruins
  simplified_phrase: make them a horrifying sight, something people hiss at in scorn, and permanent ruins
  preserved_meaning: Their devastation will horrify observers, draw derision, and remain permanently.
  reasoning_layer_used: The lexical rationales identify horror, derisive hissing, and enduring judgment.
  rationale: The wording explains the reactions while preserving the perpetual force.
interpretive_expansions:
- pob_phrase: I am sending for and taking
  rendering: I am about to summon
  claim: The announced gathering is imminent and certain.
  evidence:
  - The POB lexical rationale says the prophetic forms convey imminent, certain action.
  - The context presents Yahweh’s declared plan of judgment.
  confidence: high
  alternatives_preserved:
  - I am summoning
  - I will summon
- pob_phrase: a hissing
  rendering: something people hiss at in scorn
  claim: The hissing is the derisive response of onlookers.
  evidence:
  - The POB lexical rationale identifies a derisive reaction by onlookers.
  confidence: high
  alternatives_preserved:
  - an object of hissing
  - something people scoff at
translation_notes:
  risk_flags:
  - risk: Readers may take “my servant” as approval of Nebuchadnezzar’s faith or character.
    mitigation: Footnote a limits the title to his role as Yahweh’s instrument here.
  - risk: “Devote them to destruction” may be unclear to readers unfamiliar with the ban concept.
    mitigation: Footnote b explains the concept and gives the lexical alternative.
