translation:
  language: en
  text: and all the mixed population,[a] all the kings of Uz, and all the kings of the Philistine land—those of Ashkelon, Gaza, and Ekron, along with what remained of Ashdod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the mixed multitude”; this may mean a population of mixed foreign backgrounds rather than one ethnic group.
    reason: lexical_alternative
  - marker: b
    text: This may mean the surviving people of Ashdod or whatever was left of the city-state.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the mixed people
  simplified_phrase: all the mixed population
  preserved_meaning: The phrase refers broadly to a mixed population rather than one certain ethnic group.
  reasoning_layer_used: POB lexical decision for הָעֶרֶב
  rationale: “Mixed population” makes the collective sense clearer in ordinary English.
- pob_phrase: all the kings of the land of Uz
  simplified_phrase: all the kings of Uz
  preserved_meaning: These are the rulers associated with the geographical land of Uz.
  reasoning_layer_used: POB lexical decision for מַלְכֵי אֶרֶץ הָעוּץ
  rationale: Dropping “the land of” removes unnecessary repetition without changing the location.
- pob_phrase: the remnant of Ashdod
  simplified_phrase: what remained of Ashdod
  preserved_meaning: The wording leaves open whether the remainder was the population or the city-state.
  reasoning_layer_used: POB lexical decision for שְׁאֵרִית אַשְׁדּוֹד
  rationale: The clearer phrase preserves the judgment image and its documented ambiguity.
