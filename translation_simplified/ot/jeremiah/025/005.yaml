  preserved_meaning: Yahweh’s ancient gift of the covenant land extends into the future.
  reasoning_layer_used: POB lexical rationale, cultural note, and divine-name decision
  rationale: The rewrite uses natural English while preserving Yahweh’s name, settled life in the land, and the full time span.
