    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to serve them and to bow down to them
  simplified_phrase: Do not serve them or bow down to them.
  preserved_meaning: Serving other gods and physically bowing before them remain distinct forbidden acts.
  reasoning_layer_used: POB lexical decisions for עבד and השתחוה
  rationale: A separate sentence and natural English coordination make both commands easier to follow.
- pob_phrase: by the work of your hands
  simplified_phrase: by worshiping what you have made with your own hands
  preserved_meaning: Human-made objects provoke God when treated as gods, while the image of human hands making them remains.
  reasoning_layer_used: POB lexical rationale and immediate idolatry context
  rationale: The wording explains the idiom without removing its concrete image.
- pob_phrase: and I will do you no harm
  simplified_phrase: Then I will do you no harm.
  preserved_meaning: God assures the people that obedience will avert the threatened harm or disaster.
  reasoning_layer_used: POB theological decision on implied consequence
  rationale: “Then” makes the contextual consequence clear without turning it into an explicit purpose clause.
