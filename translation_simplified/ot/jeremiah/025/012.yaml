translation:
  language: en
  text: When the seventy years are over, I will punish the king of Babylon and that nation for their wrongdoing, along with the land of the Chaldeans. I will make that land desolate forever. This is what Yahweh declares.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when seventy years are completed
  simplified_phrase: when the seventy years are over
  preserved_meaning: The judgment comes after the full seventy-year period has ended.
  reasoning_layer_used: lexical decision for כִמְלֹאות
  rationale: “Are over” expresses the same temporal point in more familiar English.
- pob_phrase: oracle of Yahweh
  simplified_phrase: This is what Yahweh declares
  preserved_meaning: The words are formally identified as Yahweh’s prophetic declaration.
  reasoning_layer_used: lexical and theological decisions for נְאֻם יְהוָה
  rationale: The functional alternative is clearer while retaining Yahweh’s covenant name.
- pob_phrase: I will make it an everlasting desolation
  simplified_phrase: I will make that land desolate forever
  preserved_meaning: Yahweh will reduce the land of the Chaldeans to enduring ruin.
  reasoning_layer_used: lexical and theological decisions for אֹתוֹ and לְשִׁמְמוֹת עוֹלָם
  rationale: Naming “that land” clarifies the chosen pronoun referent without weakening the judgment.
