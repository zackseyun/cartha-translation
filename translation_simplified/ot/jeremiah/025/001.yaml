translation:
  language: en
  text: In the fourth year of Jehoiakim son of Josiah, king of Judah, the word came to Yirmeyahu concerning all the people of Judah.[a] This was the first year of Nebuchadnezzar, king of Babylon.
  philosophy: optimal-equivalence
  footnotes:
