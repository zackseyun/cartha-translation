  text: At that time, the king of Babylon’s army was attacking Jerusalem and the cities of Judah that had not yet fallen, including Lachish and Azekah.[a] These two were the only fortified cities left in Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “namely, Lachish and Azekah.” The Hebrew may identify them as the specific remaining cities still under attack.
    reason: lexical_alternative
