  reasoning_layer_used: POB lexical decision for אֲבוֹתֶיךָ and its appositional phrase
  rationale: “Ancestors” and “ruled before you” express the royal relationship in natural English.
- pob_phrase: they will lament for you, saying
  simplified_phrase: People will mourn for you and cry
