translation:
  language: en
  text: You will die in peace. Spices will be burned in your honor[a], just as they were for your ancestors—the kings who ruled before you. People will mourn for you and cry, “Alas, lord!” I myself have spoken this word, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was a royal funeral honor involving spices or other aromatics, not the burning of the body.
    reason: cultural_note
