translation:
  language: en
  text: 'Therefore, this is what Yahweh says: “Each man among you should have proclaimed liberty for his brother and his neighbor, but you did not listen to me. So now I am proclaiming liberty for you,” declares Yahweh. “I will release you to the sword, plague, and famine. I will make you an object of horror to all the kingdoms of the earth.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You have not listened to me, to proclaim liberty, each man to his brother and each man to his neighbor
  simplified_phrase: Each man among you should have proclaimed liberty for his brother and his neighbor, but you did not listen to me
  preserved_meaning: Each man was responsible to free his brother and neighbor, but the people refused to heed Yahweh.
  reasoning_layer_used: Lexical and theological decisions on שׁמע and the gendered distributive phrase
  rationale: Reordering the clause makes the required action and disobedience clear while retaining its male distributive force.
- pob_phrase: Behold, I am proclaiming liberty for you
  simplified_phrase: So now I am proclaiming liberty for you
  preserved_meaning: Yahweh solemnly announces an imminent ironic reversal of their refused liberty.
  reasoning_layer_used: Lexical decision on הִנְנִי and theological decision on repeated liberty
  rationale: “So now” clearly marks the solemn consequence without the archaic “behold.”
- pob_phrase: to the sword, to the pestilence, and to the famine
  simplified_phrase: I will release you to the sword, plague, and famine
  preserved_meaning: Yahweh hands the people over to three forms of covenant judgment.
  reasoning_layer_used: Lexical rationale and POB cultural footnote on the ironic release
  rationale: The active clause explains the jarring image, and “plague” is clearer than “pestilence.”
interpretive_expansions:
- pob_phrase: I am proclaiming liberty for you … to the sword, to the pestilence, and to the famine
  rendering: I am proclaiming liberty for you … I will release you to the sword, plague, and famine
  claim: The announced liberty means being handed over to destructive judgment rather than being freed from danger.
  evidence:
  - The same Hebrew term for liberty is deliberately repeated in both announcements.
  - The POB rationale identifies the second announcement as release over to covenant curses.
  - The named sword, plague, and famine define the judgment in the immediate clause.
  confidence: high
  alternatives_preserved:
  - The repeated word “liberty” remains in both halves of the verse.
translation_notes:
  risk_flags:
  - risk: Adding “I will release you” makes the verse’s irony more explicit than the Hebrew syntax does.
    mitigation: The explanation follows the POB footnote and rationale while preserving “liberty” in both announcements.
