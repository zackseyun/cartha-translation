translation:
  language: en
  text: At the end of seven years,[a] each of you must release his Hebrew brother[b] who has been sold to you[c] and has served you for six years. You must send him away as a free man. But your ancestors did not listen to me or turn their ears toward me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “After seven years.”
    reason: lexical_alternative
  - marker: b
    text: Or “his fellow Hebrew” or “his Hebrew kinsman.”
    reason: lexical_alternative
  - marker: c
    text: Or “who sells himself to you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: each of you shall send away
  simplified_phrase: each of you must release
  preserved_meaning: Every person addressed is required to let the bonded servant go.
  reasoning_layer_used: Lexical decision for תְּשַׁלְּחוּ and distributive אִישׁ
  rationale: “Must release” states the legal command in clear modern English.
- pob_phrase: you shall send him away free from you
  simplified_phrase: You must send him away as a free man
  preserved_meaning: The servant must leave the master’s authority with free legal status.
  reasoning_layer_used: Lexical and theological decisions for וְשִׁלַּחְתּוֹ חָפְשִׁי
  rationale: The wording keeps the repeated sending image while making the result of freedom clear.
- pob_phrase: your fathers did not listen to me or incline their ear
  simplified_phrase: your ancestors did not listen to me or turn their ears toward me
  preserved_meaning: Earlier generations refused to pay attention to God and heed him.
  reasoning_layer_used: Lexical decisions for אֲבוֹתֵיכֶם and the auditory idiom וְלֹא הִטּוּ אֶת אָזְנָם
  rationale: “Ancestors” avoids a misleading reference to immediate fathers, and “turn their ears” preserves the image naturally.
translation_notes:
  risk_flags:
