  preserved_meaning: The men violated a binding covenant with God.
  reasoning_layer_used: POB lexical decision for הָעֹבְרִים אֶת־בְּרִיתִי
  rationale: “Broke” expresses the legal and moral violation in common English.
- pob_phrase: did not uphold the words of the covenant
  simplified_phrase: did not keep its terms
  preserved_meaning: They failed to carry out the covenant’s requirements.
  reasoning_layer_used: POB lexical decision for הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית and footnote b
  rationale: “Keep its terms” makes the covenant language immediately clear.
- pob_phrase: that they made before me, the calf that they cut in two and passed between its pieces
  simplified_phrase: the covenant they made before me, involving the calf they cut in two and passed between its pieces
  preserved_meaning: The divided-calf ritual is linked to the covenant made before God without fully resolving the compressed syntax.
  reasoning_layer_used: POB theological decision, cultural footnote c, and independent grounding review
  rationale: “Involving” clarifies the ritual connection while preserving its possible judgment significance.
