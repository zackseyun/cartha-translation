translation:
  language: en
  text: And I will hand over the men who broke my covenant and did not keep its terms—the covenant they made before me, involving the calf they cut in two and passed between its pieces.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Passing between the animal’s pieces was a solemn covenant ceremony that called down judgment on anyone who broke the covenant; compare Genesis 15:9–17. The Hebrew also uses related wording for “broke” and “passed.”
    reason: cultural_note
