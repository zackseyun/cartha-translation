translation:
  language: en
  text: 'Yahweh, the God of Israel, says: “Tell the king of Judah, who sent you to ask me for an answer: ‘Pharaoh’s army set out to help you, but it has now returned to Egypt.’”'
  philosophy: optimal-equivalence
simplification_decisions:
