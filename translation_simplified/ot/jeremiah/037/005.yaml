translation:
  language: en
  text: Pharaoh’s army had marched out of Egypt. When the Chaldeans[a], who had Jerusalem under siege, heard the news about this army, they pulled back from Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Chaldeans were the Babylonians.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: had come out from Egypt
  simplified_phrase: had marched out of Egypt
  preserved_meaning: Pharaoh’s military force left Egypt before the Chaldeans responded.
  reasoning_layer_used: lexical decision for יָצָא מִמִּצְרַיִם
  rationale: “Marched out” makes the army’s military movement clear in natural English.
- pob_phrase: who were besieging Jerusalem
  simplified_phrase: who had Jerusalem under siege
  preserved_meaning: The Chaldeans were continuing a military siege of the city.
  reasoning_layer_used: lexical decision for הַצָּרִים עַל יְרוּשָׁלַם
  rationale: The familiar phrase “under siege” explains the action without weakening it.
- pob_phrase: they withdrew from Jerusalem
  simplified_phrase: they pulled back from Jerusalem
  preserved_meaning: The besieging army moved away from its position against Jerusalem.
  reasoning_layer_used: lexical decision for וַיֵּעָלוּ מֵעַל יְרוּשָׁלָם
  rationale: “Pulled back” plainly expresses the military withdrawal carried by the Hebrew idiom.
