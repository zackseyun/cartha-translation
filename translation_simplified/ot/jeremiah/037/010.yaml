translation:
  language: en
  text: For even if you struck down the entire Chaldean army[a] fighting against you, and only wounded men[b] were left, each in his tent, they would still get up and set this city on fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Babylonian army.” The Hebrew says “Chaldean,” a common name for Babylonian forces in Jeremiah.
    reason: lexical_alternative
  - marker: b
    text: Literally “men who had been pierced” or “run through.”
    reason: lexical_alternative
