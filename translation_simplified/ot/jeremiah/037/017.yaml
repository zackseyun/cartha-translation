translation:
  language: en
  text: 'Then King Zedekiah sent for Jeremiah and had him brought to his house. There the king questioned him in private: “Is there any word from Yahweh?” Jeremiah answered, “There is.” Then he said, “You will be handed over[a] to the king of Babylon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “given into the hand of,” meaning placed under his power.
    reason: lexical_alternative
