translation:
  language: en
  text: Jerusalem will bring me joyful renown, praise, and glory before all the nations of the earth. They will hear about all the good I am doing for her people. They will fear and tremble in awe because of all the good and all the peace[a] I am bringing to her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “peace” also includes prosperity, well-being, and wholeness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: she will be to me a name of joy, a praise and a glory
  simplified_phrase: Jerusalem will bring me joyful renown, praise, and glory
  preserved_meaning: Jerusalem's restoration will give God joyful public renown, praise, and glory.
  reasoning_layer_used: lexical decisions and contextual feminine personification
  rationale: Naming Jerusalem clarifies the feminine referent, while “renown” explains the Hebrew name image.
- pob_phrase: all the good that I am doing for them
  simplified_phrase: all the good I am doing for her people
  preserved_meaning: God is doing concrete good for the people represented by Jerusalem.
  reasoning_layer_used: immediate restoration context and pronoun contrast
  rationale: The explicit wording identifies the otherwise unclear plural recipients without changing the contextual referent.
- pob_phrase: they will fear and tremble
  simplified_phrase: They will fear and tremble in awe
  preserved_meaning: The nations retain genuine fear and trembling while reacting with astonished awe to God's blessing.
  reasoning_layer_used: theological decision on the nations' reaction
  rationale: Keeping “fear and tremble” preserves the source force, while “in awe” signals the context without reducing fear to hostility.
interpretive_expansions:
- pob_phrase: all the good that I am doing for them
  rendering: all the good I am doing for her people
  claim: The plural pronoun refers to Jerusalem's restored people rather than to the nations.
  evidence:
  - The surrounding restoration context concerns the people of Judah and Jerusalem.
  - The verse pairs good done for the plural group with peace brought to the singular personified city.
  confidence: high
  alternatives_preserved:
  - all the good I am doing for them
- pob_phrase: fear and tremble
  rendering: fear and tremble in awe
  claim: The nations' genuine fear and trembling includes astonished awe at God's abundant blessing.
  evidence:
  - The stated cause is the good and peace God brings to Jerusalem.
  - The POB theological decision identifies awed fear while preserving the verbs' fearful force.
  confidence: high
  alternatives_preserved:
  - fear and tremble
  - fear and quake
translation_notes:
  risk_flags:
  - risk: Rendering “name” as “renown” makes the Hebrew image less concrete.
    mitigation: The wording preserves its idiomatic sense of joyful public reputation.
  - risk: Naming “her people” resolves the plural pronoun's implicit referent.
    mitigation: The restoration context and contrast with the singular city strongly support this clarification.
