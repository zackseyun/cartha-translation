translation:
  language: en
  text: 'This is what Yahweh says: Yahweh made it; Yahweh formed it to make it firm—Yahweh is his name.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew could also mean “who does it”; it does not identify what “it” refers to.
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal divine name represented by YHWH in Hebrew.
    reason: source_note
