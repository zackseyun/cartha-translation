  preserved_meaning: The wording introduces Yahweh’s prophetic declaration.
  reasoning_layer_used: Lexical decisions for כֹּה and אָמַר
  rationale: The common formula is clearer than the elevated word “Thus.”
- pob_phrase: who made it, Yahweh who formed it to establish it
  simplified_phrase: Yahweh made it; Yahweh formed it to make it firm
  preserved_meaning: Yahweh made and intentionally formed the unidentified thing for firmness.
  reasoning_layer_used: Lexical decisions for עֹשָׂהּ, יוֹצֵר אוֹתָהּ, and לַהֲכִינָהּ
  rationale: Parallel clauses preserve the linked actions and state their purpose plainly.
- pob_phrase: Yahweh is his name
  simplified_phrase: Yahweh is his name
  preserved_meaning: The solemn declaration identifies God by his personal covenant name.
  reasoning_layer_used: Theological decision for יְהוָה and lexical decision for שְׁמוֹ
  rationale: Retaining this clause preserves the required divine name and solemn ending.
