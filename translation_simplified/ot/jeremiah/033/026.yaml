translation:
  language: en
  text: then I would also reject the descendants of Jacob and of my servant David. I would not choose rulers from David’s line to rule the descendants of Abraham, Isaac, and Jacob. For I will restore their well-being[a] and have compassion on them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to bringing the exiles home or more broadly to restoring their fortunes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the offspring of Jacob and of David my servant
  simplified_phrase: the descendants of Jacob and of my servant David
  preserved_meaning: Both Jacob’s family line and David’s family line remain the objects of the hypothetical rejection.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Descendants” and reordered wording make the two family lines immediately clear.
- pob_phrase: not taking from his offspring rulers over the offspring
  simplified_phrase: I would not choose rulers from David’s line to rule the descendants
  preserved_meaning: God would cease selecting rulers from David’s family to govern Israel.
  reasoning_layer_used: POB lexical decision and referent adjudication
  rationale: A direct sentence replaces the difficult infinitive construction without losing the Davidic promise.
- pob_phrase: restore their fortunes
  simplified_phrase: restore their well-being
  preserved_meaning: God promises a broad reversal of his people’s troubled condition.
  reasoning_layer_used: POB idiom rationale and lexical footnote
  rationale: “Well-being” avoids suggesting only financial prosperity, while the footnote preserves the exile-specific sense.
interpretive_expansions:
- pob_phrase: from his offspring
  rendering: from David’s line
  claim: The pronoun refers to David’s descendants.
  evidence:
  - David is the nearest singular antecedent.
  - The surrounding context concerns rulers from David’s covenant line.
  confidence: high
  alternatives_preserved:
  - The pronoun could be taken as referring to Jacob’s line collectively.
translation_notes:
