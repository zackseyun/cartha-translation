  preserved_meaning: God’s covenant with day and night and his setting of creation’s fixed order remain distinct, parallel grounds.
  reasoning_layer_used: Lexical decisions for אִם לֹא, בְרִיתִי, חֻקּוֹת, and לֹא שַׂמְתִּי, plus the grounding review
