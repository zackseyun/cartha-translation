translation:
  language: en
  text: Just as the multitude in heaven[a] cannot be counted and the sand of the sea cannot be measured, I will make the descendants of David my servant and the Levites who carry out sacred service for me just as numerous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression refers to the heavenly multitude and often includes the stars.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the host of heaven
  simplified_phrase: the multitude in heaven[a]
  preserved_meaning: It retains the image of an innumerable heavenly company without limiting it to the stars alone.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: “Multitude” makes the Hebrew idiom understandable while the note preserves its range.
- pob_phrase: so I will multiply the offspring
  simplified_phrase: I will make the descendants ... just as numerous
  preserved_meaning: God promises a vast increase corresponding to the two immeasurable images.
  reasoning_layer_used: POB lexical decisions for כֵּן אַרְבֶּה and זֶרַע דָּוִד
  rationale: The comparison is recast in ordinary English, and “descendants” clearly expresses collective offspring.
- pob_phrase: the Levites who minister to me
  simplified_phrase: the Levites who carry out sacred service for me
  preserved_meaning: The Levites are identified by their continuing priestly or worship-related service to God.
  reasoning_layer_used: POB lexical decision for מְשָׁרְתֵי אֹתִי
  rationale: “Sacred service” clarifies the specialized sense of “minister” without narrowing it to one task.
