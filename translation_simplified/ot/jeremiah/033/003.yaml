translation:
  language: en
  text: Call on me, and I will answer you. I will tell you great and hidden things[a] that you did not know before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “inaccessible things” or “fortified things”—matters beyond ordinary access.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Call to me
  simplified_phrase: Call on me
  preserved_meaning: God directly commands the hearer to address him.
  reasoning_layer_used: Lexical decision for קְרָא אֵלַי
  rationale: “Call on me” is the natural English expression for addressing God.
- pob_phrase: and I will answer you, and I will tell you
  simplified_phrase: and I will answer you. I will tell you
  preserved_meaning: God promises both to respond and to reveal what is unknown.
  reasoning_layer_used: Lexical decisions and clause structure
  rationale: Two sentences make the paired promises easier to follow without merging them.
- pob_phrase: that you have not known
  simplified_phrase: that you did not know before
  preserved_meaning: The hearer had no previous knowledge of these things.
  reasoning_layer_used: Lexical rationale for לֹא יְדַעְתָּם
  rationale: “Did not know before” states the past-to-present sense in ordinary English.
translation_notes:
  risk_flags:
