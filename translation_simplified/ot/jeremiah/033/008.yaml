simplification_decisions:
- pob_phrase: all their guilt by which they have sinned against me
  simplified_phrase: all the guilt of sinning against me
  preserved_meaning: Their guilt comes from sins committed against God.
  reasoning_layer_used: Lexical decision for עָוֹן and חטא with ל
  rationale: The shorter phrase removes an awkward relative clause while keeping guilt and sin against God distinct.
- pob_phrase: all their guilty deeds by which they have sinned against me and by which they have rebelled against me
  simplified_phrase: all their guilty deeds—all the ways they have sinned and rebelled against me
  preserved_meaning: God forgives their many culpable offenses, described as both sin and rebellion.
  reasoning_layer_used: Theological decision on overlapping sin vocabulary
  rationale: The dash clarifies the relationship while preserving the layered terms guilty deeds, sinned, and rebelled.
- pob_phrase: And I will cleanse them ... and I will forgive
  simplified_phrase: I will cleanse them ... I will forgive
  preserved_meaning: God promises both cleansing from guilt and forgiveness of offenses.
  reasoning_layer_used: Lexical decisions for טהר and סלח
  rationale: Two short sentences make the two divine actions easier to follow without merging them.
translation_notes:
  risk_flags:
  - risk: Readers may treat guilt, sin, and rebellion as interchangeable.
    mitigation: The wording retains all three expressions to preserve the Hebrew verse's layered description of offense.
