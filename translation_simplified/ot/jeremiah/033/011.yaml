translation:
  language: en
  text: There will be sounds of joy and gladness—the sounds of bridegrooms and brides—and the voices of people saying, “Give thanks to Yahweh of hosts, for Yahweh is good, and his steadfast love endures forever.” People will also bring thank offerings into Yahweh’s temple. “For I will restore the land’s fortunes to what they were before,” says Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will restore the captivity of the land.” The Hebrew expression can refer to the return of captives or, more broadly, to restoration.
    reason: alternative_reading
