translation:
  language: en
  text: 'This is what Yahweh says: “Look! I am stirring up a destroying wind[b] against Babylon and against the people who live in Leb-kamai.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leb-kamai is probably a coded name for Chaldea, the land of Babylon. It could also mean “the heart of my adversaries.”
    reason: alternative_reading
  - marker: b
    text: Or “a destroying spirit”; the Hebrew word can mean “wind,” “spirit,” or “breath.”
    reason: lexical_alternative
