  text: 'This is what Yahweh of hosts[a] says: Babylon’s wide wall[b] will be completely demolished, and its high gates will be burned. Peoples labor for nothing, and nations wear themselves out only to feed the fire.'
  philosophy: optimal-equivalence
  footnotes:
