translation:
  language: en
  text: 'This is what Yahweh of hosts, the God of Israel, says: “The daughter of Babylon is like a threshing floor when it is trampled.[a] In just a little while, her harvest time will come.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when someone tramples her”; the Hebrew does not identify who does the trampling.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For thus says
  simplified_phrase: This is what ... says
  preserved_meaning: Introduces Yahweh’s authoritative declaration.
  reasoning_layer_used: POB translation and target-style guidance
  rationale: The common English formula is clearer without weakening the prophetic announcement.
- pob_phrase: at the time it is trodden
  simplified_phrase: when it is trampled
  preserved_meaning: Keeps the threshing-floor action and Babylon’s treatment within the image.
  reasoning_layer_used: POB lexical decision for עֵת הִדְרִיכָהּ
  rationale: “Trampled” is more familiar than “trodden” and retains the force of the agricultural image.
- pob_phrase: yet a little while, and the time of harvest will come for her
  simplified_phrase: In just a little while, her harvest time will come
  preserved_meaning: Babylon’s appointed harvest is imminent.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter sentence expresses imminence naturally while preserving the harvest metaphor.
