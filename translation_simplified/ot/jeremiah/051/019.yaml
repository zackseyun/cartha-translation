translation:
  language: en
  text: The God who is Jacob’s Portion[a] is nothing like these idols. He formed everything, and Israel is the people who belong to him as his inheritance.[b] His name is Yahweh of Armies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jacob’s Portion” means that God is Jacob’s allotted share; the Hebrew can also mean “the portion belonging to Jacob.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “the tribe of his inheritance”; Israel is the implied referent, as in the parallel passage in Jeremiah 10:16.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Not like these is the Portion of Jacob
  simplified_phrase: The God who is Jacob’s Portion is nothing like these idols
  preserved_meaning: Yahweh, Jacob’s allotted share, stands in contrast to the surrounding idols.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The rewrite identifies the divine title and its comparison while retaining “Portion.”
- pob_phrase: the one who formed everything
  simplified_phrase: He formed everything
  preserved_meaning: Yahweh created all things, unlike handmade idols.
  reasoning_layer_used: lexical decision
  rationale: The shorter sentence preserves the creator contrast without the heavy relative clause.
- pob_phrase: Israel is the tribe of his inheritance
  simplified_phrase: Israel is the people who belong to him as his inheritance
  preserved_meaning: Israel is Yahweh’s own covenant people and inheritance.
  reasoning_layer_used: lexical and theological decisions
  rationale: “People” makes the collective sense of “tribe” clear while keeping the inheritance image.
