translation:
  language: en
  text: Babylon too must fall because it killed Israelites, just as people throughout the earth have been killed because of Babylon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Babylon too has fallen, you slain Israelites.” The Hebrew wording of the first clause is compressed and can be understood in more than one way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Babylon also must fall for the slain of Israel
  simplified_phrase: Babylon too must fall because it killed Israelites
  preserved_meaning: Babylon faces judgment for the Israelites killed through its violence.
  reasoning_layer_used: POB lexical decisions and prophetic judgment context
  rationale: The active wording makes Babylon’s accountability clear while preserving the judgment expressed by “must fall.”
- pob_phrase: the slain of all the earth have fallen for Babylon
  simplified_phrase: people throughout the earth have been killed because of Babylon
  preserved_meaning: People across the earth have died through Babylon’s violence.
  reasoning_layer_used: POB lexical decisions on חַלְלֵי and לְבָבֶל and the theological decision on אָרֶץ
  rationale: “Have been killed” preserves the explicit death sense, while “throughout the earth” retains the worldwide scope.
