translation:
  language: en
  text: For Israel and Judah are not like a widow abandoned by her husband. Their God, Yahweh of Armies,[a] has not abandoned them, even though their land is full of guilt against the Holy One of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the LORD of Hosts.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “full of guilt before the Holy One of Israel.”
    reason: lexical_alternative
