translation:
  language: en
  text: “I will punish Bel[a] in Babylon. I will take out of his mouth what he has swallowed. Nations will no longer stream to him. Even Babylon’s wall has fallen.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bel was the Babylonian god being judged here.
    reason: cultural_note
  - marker: b
    text: Or “Babylon’s wall will fall.” The Hebrew describes this future fall as already accomplished because it is certain.
    reason: alternative_reading
