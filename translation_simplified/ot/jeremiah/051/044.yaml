  preserved_meaning: God will judge Bel and force him to surrender what he devoured.
  reasoning_layer_used: Lexical decisions for פקד, הוציא, בלע, and מפיו
  rationale: Two short sentences clarify the action while retaining the swallowing and mouth image.
- pob_phrase: nations will no longer stream to him
  simplified_phrase: Nations will no longer stream to him.
  preserved_meaning: Peoples will stop moving toward Bel like a flowing stream.
  reasoning_layer_used: Lexical and theological decisions for ינהרו and the pronoun referent
  rationale: The vivid stream image and its reference to Bel remain unchanged.
- pob_phrase: Even the wall of Babylon has fallen
