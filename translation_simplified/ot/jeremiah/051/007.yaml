  preserved_meaning: Babylon remains Yahweh’s instrument and the source of the earth’s metaphorical drunkenness.
  reasoning_layer_used: Lexical decisions for בְיַד יְהוָה and מְשַׁכֶּרֶת, supported by the theological decision on the intoxication metaphor.
  rationale: Two short sentences clarify who makes the earth drunk while preserving the cup image.
- pob_phrase: therefore the nations have gone mad
  simplified_phrase: so they went mad
  preserved_meaning: The nations’ madness remains the result of drinking Babylon’s wine.
  reasoning_layer_used: Lexical decisions for עַל כֵּן and יִתְהֹלְלוּ.
  rationale: “So” and the pronoun express the same causal link in ordinary English.
