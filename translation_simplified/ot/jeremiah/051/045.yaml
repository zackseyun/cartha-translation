simplification_decisions:
- pob_phrase: Come out from her midst
  simplified_phrase: Come out of her
  preserved_meaning: The people are urgently commanded to leave Babylon while the city remains personified as “her.”
  reasoning_layer_used: Lexical decision for מִתּוֹכָהּ and immediate context
  rationale: “Out of her” is natural English and keeps the source image.
- pob_phrase: and let each man save his life
  simplified_phrase: Each man must save his life
  preserved_meaning: The command applies individually and concerns preserving one’s physical life.
  reasoning_layer_used: Lexical decisions for וּמַלְּטוּ, אִישׁ, and נַפְשׁוֹ
  rationale: “Must” states the force of the command more directly than “let.”
- pob_phrase: the burning anger of Yahweh
  simplified_phrase: Yahweh’s burning anger
  preserved_meaning: Yahweh is personally named, and his anger retains the source image of burning heat.
  reasoning_layer_used: Lexical and theological decisions for מֵחֲרוֹן אַף and יְהוָה
  rationale: The possessive form is shorter and easier without weakening the image.
