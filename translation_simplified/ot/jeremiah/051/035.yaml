  text: “May Babylon be held accountable for the violence done to me and the harm to my flesh,” says the woman who lives in Zion.[a] “May the people of Chaldea be held accountable for shedding my blood,” says Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zion is pictured here as a woman speaking about what she has suffered.
    reason: source_note
