translation:
  language: en
  text: Raise a battle signal against the walls of Babylon! Reinforce the guard. Post watchmen. Prepare the ambushes.[a] For Yahweh has planned and carried out what he declared against the people living in Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “prepare the ambushers”; the Hebrew may mean either the people lying in wait or their ambush positions.
    reason: lexical_alternative
