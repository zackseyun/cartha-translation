translation:
  language: en
  text: Raise a signal banner in the land, and sound the trumpet among the nations. Set nations apart for war against her.[a] Call the kingdoms of Ararat, Minni, and Ashkenaz to attack her. Appoint a military officer against her.[b] Bring the horses forward like bristling locusts.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording for “set apart” may imply preparing the nations for sacred warfare.
    reason: cultural_note
  - marker: b
    text: The Hebrew uses a rare term for an official or military officer; “marshal,” “commander,” and “recruiting officer” are also possible.
    reason: lexical_alternative
  - marker: c
    text: The rare Hebrew image may also be translated “hairy locusts” or “rough locusts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Raise a banner in the land; blow a trumpet among the nations
  simplified_phrase: Raise a signal banner in the land, and sound the trumpet among the nations
  preserved_meaning: Public military signals summon the nations.
  reasoning_layer_used: POB lexical decisions for נֵס and שׁוֹפָר
  rationale: “Signal banner” clarifies the banner’s function, while “sound” is natural with a trumpet.
- pob_phrase: Consecrate nations against her; summon against her the kingdoms
  simplified_phrase: Set nations apart for war against her. Call the kingdoms ... to attack her.
  preserved_meaning: The nations are designated and summoned as forces against her.
  reasoning_layer_used: POB lexical decisions for קדשׁ and the causative form of שמע
  rationale: The rewrite explains the warfare sense of “consecrate” and the military force of “summon.”
- pob_phrase: Appoint a marshal against her; bring up horses like bristling locusts
  simplified_phrase: Appoint a military officer against her. Bring the horses forward like bristling locusts.
  preserved_meaning: A military official is appointed against her, and the horses advance in a vivid locust-like image.
  reasoning_layer_used: POB lexical decisions for טִפְסָר, עלה, and יֶלֶק סָמָר
  rationale: Common wording clarifies the commands without over-specifying the rare office or removing the locust image.
