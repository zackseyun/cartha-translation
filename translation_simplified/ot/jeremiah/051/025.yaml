translation:
  language: en
  text: “Look! I am against you, destroying mountain,” says Yahweh, “you who destroy the whole earth.[a] I will stretch out my hand against you. I will roll you down from the rocky heights and turn you into a burned mountain.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole land.” The Hebrew word can mean either “land” or “earth.”
    reason: lexical_alternative
  - marker: b
    text: Or “a mountain in flames” or “a mountain left burned.” The Hebrew may emphasize either the burning or its result.
    reason: lexical_alternative
