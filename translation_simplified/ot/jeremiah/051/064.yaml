translation:
  language: en
  text: Then say, “Just as this scroll sank, Babylon will sink and never rise again because of the disaster I am bringing on her. Her people will grow weary.”[a] The words of Jeremiah end here.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “they,” likely referring to Babylon’s people; the verb can also mean “be exhausted” or “faint.”
    reason: lexical_alternative
