translation:
  language: en
  text: Every man becomes senseless and has no knowledge. Every metalworker is put to shame by his idol, because his cast image is a lie. There is no breath[a] in these idols.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “spirit.” The Hebrew word can mean “breath,” “wind,” or “spirit”; “breath” emphasizes that the idols are lifeless.
    reason: lexical_alternative
