translation:
  language: en
  text: You who have escaped the sword, keep moving—do not stop. From far away, remember Yahweh, and let Jerusalem come to mind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally pictures Jerusalem rising upon the heart. It means to remember Jerusalem and remain concerned for it.
    reason: simplification_note
