translation:
  language: en
  text: “Even if Babylon climbs to the heavens and makes her high fortress secure, I will send destroyers[a] against her,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “plunderers.” The Hebrew word can refer to those who devastate by destroying or plundering.
