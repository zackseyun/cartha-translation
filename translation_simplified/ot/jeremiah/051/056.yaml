  preserved_meaning: A destroyer is advancing against Babylon in military judgment.
  reasoning_layer_used: Lexical decision and immediate battle context
  rationale: The direct wording removes the difficult repeated apposition while keeping Babylon as the emphatic target.
- pob_phrase: a God of recompense
  simplified_phrase: a God who repays what is due
  preserved_meaning: Yahweh responds with morally fitting repayment.
  reasoning_layer_used: Lexical and theological decisions on אֵל גְּמֻלוֹת
  rationale: The clause explains the uncommon word “recompense” without reducing judgment to emotional revenge.
- pob_phrase: he will surely repay
  simplified_phrase: He will surely repay
  preserved_meaning: The Hebrew strongly emphasizes the certainty of Yahweh’s repayment.
  reasoning_layer_used: Lexical decision on the Hebrew intensive construction
  rationale: A separate sentence makes the emphatic conclusion easier to follow.
