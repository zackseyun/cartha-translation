translation:
  language: en
  text: A destroyer[a] has come to attack Babylon. Her warriors have been captured, and their bows are shattered. Yahweh is a God who repays what is due.[b] He will surely repay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a plunderer” or “the devastator.”
    reason: lexical_alternative
  - marker: b
    text: Or “a God of vengeance.” The Hebrew emphasizes just repayment.
    reason: alternative_reading
