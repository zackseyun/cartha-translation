translation:
  language: en
  text: The sea has risen against Babylon.[a] She is covered by the roar of its many waves.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sea pictures the overwhelming force coming against Babylon.
    reason: cultural_note
  - marker: b
    text: Or, “She is covered by the multitude or tumult of its waves.” The Hebrew word can refer to a great mass, a roar, or tumult.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has come up against Babylon
  simplified_phrase: has risen against Babylon
  preserved_meaning: The sea rises in a hostile advance against Babylon.
  reasoning_layer_used: The lexical decisions for עָלָה and עַל support “risen” and the hostile sense “against.”
  rationale: “Has risen against” makes the threatening movement immediately clear.
- pob_phrase: she is covered with the multitude of its waves
  simplified_phrase: She is covered by the roar of its many waves
  preserved_meaning: Babylon is overwhelmed by the great mass and tumult of the sea’s waves.
  reasoning_layer_used: The POB text, lexical rationale, and footnote preserve both abundance and auditory tumult in הֲמוֹן.
  rationale: “Roar” and “many” retain the word’s live senses without recasting the waves as successive.
interpretive_expansions:
- pob_phrase: the multitude of its waves
  rendering: the roar of its many waves
  claim: The wording explicitly conveys both the waves’ abundance and their loud tumult.
  evidence:
  - The POB main text chooses the abundance sense “multitude.”
  - The lexical rationale prefers the auditory sense “roar” with waves.
  - The POB footnote preserves both noise and multitude as live senses.
  confidence: moderate
  alternatives_preserved:
  - the multitude of its waves
  - the tumult of its waves
translation_notes:
  risk_flags:
  - risk: Using both “roar” and “many” may appear to expand one Hebrew word.
    mitigation: The paired wording represents its documented auditory and abundance senses, while footnote b preserves alternatives.
  - risk: Readers may understand the sea as literal water.
    mitigation: Footnote a identifies the metaphor without removing it from the verse.
