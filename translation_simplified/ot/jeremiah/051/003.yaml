translation:
  language: en
  text: Do not let the archer ready his bow[a] or advance in his armor. Do not spare her young men; devote her entire army to destruction.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew opening is difficult and repetitive; it may also mean “string his bow.”
    reason: alternative_reading
  - marker: b
    text: “Devote to destruction” refers to placing people or things under the ban of divine judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bend his bow
  simplified_phrase: ready his bow
  preserved_meaning: The archer is forbidden to prepare his bow for battle.
  reasoning_layer_used: POB lexical decision on the bow idiom
  rationale: “Ready” clearly covers bending or stringing the bow without hiding the textual difficulty.
- pob_phrase: rise up in his armor
  simplified_phrase: advance in his armor
  preserved_meaning: The armed man is forbidden to rise or move forward for battle.
  reasoning_layer_used: POB lexical rationale for יִתְעַל
  rationale: “Advance” uses the military sense already allowed by the POB rationale.
- pob_phrase: all her army
  simplified_phrase: her entire army
  preserved_meaning: The command includes all of her military forces.
  reasoning_layer_used: POB lexical decision on כָּל צְבָאָהּ
  rationale: “Entire” expresses the full scope in more natural English.
translation_notes:
  risk_flags:
