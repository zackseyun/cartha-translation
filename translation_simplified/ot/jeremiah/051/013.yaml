translation:
  language: en
  text: Babylon, you live beside many waters[a] and are rich in treasures. But your end has come; your greed has reached its limit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “upon many waters.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “the cubit of your unjust gain,” an image of its fixed measure or limit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You who dwell by many waters
  simplified_phrase: Babylon, you live beside many waters
  preserved_meaning: Babylon is addressed directly as a city situated among many waterways.
  reasoning_layer_used: Lexical decision and personified-addressee theological decision
  rationale: The wording identifies the addressee and replaces the formal participial phrase with natural English.
- pob_phrase: rich in treasures
  simplified_phrase: are rich in treasures
  preserved_meaning: Babylon possesses abundant wealth.
  reasoning_layer_used: POB lexical decision for רַבַּת אֹצָרוֹת
  rationale: The added verb completes the sentence without weakening the POB choice “rich.”
- pob_phrase: the measure of your greed
  simplified_phrase: your greed has reached its limit
  preserved_meaning: Babylon’s greedy, unjust accumulation has reached its appointed boundary.
  reasoning_layer_used: POB lexical decisions for אַמַּת and בִּצְעֵךְ
  rationale: The obscure measure phrase becomes a direct statement while retaining its moral force and limit imagery.
