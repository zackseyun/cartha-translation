translation:
  language: en
  text: Nebuchadnezzar, king of Babylon, has devoured me; he has crushed me. He has set me aside like an empty jar. He has swallowed me like a sea monster,[a] filled his belly with my finest things, and cast me out.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean a great serpent or dragon-like creature; the swallowing image favors “sea monster.”
    reason: lexical_alternative
  - marker: b
    text: The speaker is Zion, or Jerusalem, pictured as a woman describing what Babylon has done to her.
    reason: cultural_note
simplification_decisions:
- pob_phrase: has devoured me; he has crushed me
  simplified_phrase: has devoured me; he has crushed me
  preserved_meaning: The two successive images of violent destruction remain separate and in order.
  reasoning_layer_used: POB lexical decisions for אכל and המם; grounding review
  rationale: Separate clauses preserve the poetic buildup and make each accusation clear.
- pob_phrase: has set me down like an empty vessel
  simplified_phrase: has set me aside like an empty jar
  preserved_meaning: Jerusalem is pictured as an emptied container that has been put aside.
  reasoning_layer_used: POB lexical rationale and doctrine-realignment revision
  rationale: “Jar” clarifies the container image, while “set aside” avoids overstating the action.
- pob_phrase: with my delicacies
  simplified_phrase: with my finest things
  preserved_meaning: The conqueror fills himself with Jerusalem’s valued possessions.
  reasoning_layer_used: POB lexical decision for מעדני
  rationale: “Finest things” uses an approved broader sense and avoids suggesting food alone.
translation_notes:
