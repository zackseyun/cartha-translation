simplification_decisions:
- pob_phrase: He made the earth by his power
  simplified_phrase: By his power, he made the earth.
  preserved_meaning: God used his power to create the earth.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The reordered phrase and shorter sentence make the means and act immediately clear while keeping the past-tense creation reading.
- pob_phrase: he established the world by his wisdom
  simplified_phrase: By his wisdom, he set the world firmly in place.
  preserved_meaning: God used wisdom to establish the ordered world securely.
  reasoning_layer_used: POB lexical rationale for מֵכִין and תֵּבֵל
  rationale: “Set firmly in place” expresses the stabilizing sense of “established” in more concrete English.
- pob_phrase: and by his understanding he stretched out the heavens
  simplified_phrase: By his understanding, he stretched out the heavens.
  preserved_meaning: God used understanding to extend the heavens.
  reasoning_layer_used: POB lexical decisions for תְבוּנָה and נָטָה
  rationale: The separate sentence keeps understanding distinct from wisdom and preserves the source image of stretching.
