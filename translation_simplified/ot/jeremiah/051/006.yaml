translation:
  language: en
  text: Flee from within Babylon! Each man must save his own life. Do not be destroyed with her because of her sin.[a] This is the time of Yahweh’s vengeance. He is repaying her as she deserves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “Do not share in her guilt.” It can refer either to sharing Babylon’s sin or to being destroyed in the judgment her sin brings.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Flee from the midst of Babylon, and let each man save his life
  simplified_phrase: Flee from within Babylon! Each man must save his own life.
  preserved_meaning: The urgent commands to leave Babylon and escape alive remain distinct.
  reasoning_layer_used: POB lexical decisions for נֻסוּ, מִתּוֹךְ בָּבֶל, and וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  rationale: Two direct sentences make the urgent commands easier to grasp.
- pob_phrase: Do not be cut off in her iniquity
  simplified_phrase: Do not be destroyed with her because of her sin
  preserved_meaning: The warning concerns destruction connected with Babylon’s sin and judgment.
  reasoning_layer_used: POB lexical rationale, applied revision, and footnote ambiguity
  rationale: “Be destroyed” clarifies the passive judgment sense while the footnote preserves the Hebrew ambiguity.
- pob_phrase: he is repaying her what she deserves
  simplified_phrase: He is repaying her as she deserves
  preserved_meaning: Yahweh is bringing just repayment upon Babylon.
  reasoning_layer_used: POB lexical decisions for גְּמוּל and מְשַׁלֵּם לָהּ
  rationale: The shorter wording keeps both the repayment image and the justice of the punishment.
