  language: en
  text: Babylon’s warriors have stopped fighting. They remain inside their fortresses. Their strength is gone; they have become like women.[a] Her homes have been set on fire, and the bars of her gates are broken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
