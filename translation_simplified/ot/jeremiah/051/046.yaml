translation:
  language: en
  text: Do not lose heart or be afraid of reports heard in the land.[a] In one year a report will come, and in the next year another report. There will be violence in the land, ruler against ruler.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “reports” can also mean “rumors” or “news,” whether confirmed or not.
    reason: lexical_alternative
  - marker: b
    text: Or “ruler over ruler”; this may describe conflict between rulers or rapid changes of rule.
    reason: alternative_reading
