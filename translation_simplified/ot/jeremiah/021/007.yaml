translation:
  language: en
  text: “After that,” Yahweh declares, “I will hand over King Zedekiah of Judah, his servants, the people, and everyone left in this city who survived the plague, the sword, and the famine. I will put them into the hands of King Nebuchadnezzar[a] of Babylon, their enemies, and those seeking to kill them. Nebuchadnezzar will strike them down with the edge of the sword. He will not spare them or show them pity or compassion.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew form here is “Nebuchadrezzar,” traditionally written “Nebuchadnezzar” in English.
    reason: lexical_alternative
