translation:
  language: en
  text: Whoever stays in this city will die by the sword, famine, or plague. But whoever goes out and defects to the Chaldeans[a] who are besieging you will live. He will carry away his life like plunder—it will be all he escapes with.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Chaldeans were the Babylonian forces.
    reason: cultural_note
