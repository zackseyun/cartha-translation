  preserved_meaning: Each person who remains in the besieged city faces the stated outcome.
  reasoning_layer_used: Lexical decision for הַיֹּשֵׁב
  rationale: “Whoever” naturally expresses the participle’s representative force.
- pob_phrase: by the sword, by famine, and by pestilence
  simplified_phrase: by the sword, famine, or plague
  preserved_meaning: Death will come through warfare, starvation, or deadly disease.
  reasoning_layer_used: Lexical decision for the Jeremiah judgment triad
  rationale: “Plague” is more familiar than “pestilence,” while “sword” preserves the concrete image.
- pob_phrase: the Chaldeans who are besieging you
  simplified_phrase: the Chaldeans[a] who are besieging you
  preserved_meaning: The named enemy force is surrounding and blockading the city.
  reasoning_layer_used: Lexical decisions for הַכַּשְׂדִּים and הַצָּרִים עֲלֵיכֶם
  rationale: The source ethnonym remains in the text, and the note identifies it for modern readers.
