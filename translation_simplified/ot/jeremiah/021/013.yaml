translation:
  language: en
  text: Yahweh declares, “Look! I am against you, city in the valley, rock of the plain. Your people say, ‘Who can come down against us?[a] Who can enter our homes?[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult; it may mean “descend against us,” but the point is that the city believes no attacker can reach it.
    reason: lexical_alternative
  - marker: b
    text: Literally “dwellings”; the word may suggest secure homes or strongholds.
    reason: lexical_alternative
