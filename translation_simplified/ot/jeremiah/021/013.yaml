  preserved_meaning: The attackers are imagined entering the places where the people live.
  reasoning_layer_used: POB lexical decision for בִּמְעוֹנוֹתֵינוּ
  rationale: “Homes” is clearer in common English, while the footnote preserves the possible defensive nuance.
