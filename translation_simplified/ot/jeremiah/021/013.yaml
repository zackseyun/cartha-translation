  preserved_meaning: The words introduce a solemn divine announcement of judgment.
  reasoning_layer_used: POB lexical decision for הִנְנִי
  rationale: “Look!” gives modern readers the force of the prophetic summons.
- pob_phrase: O inhabitant of the valley, O rock of the plain
  simplified_phrase: city in the valley, rock of the plain
  preserved_meaning: Yahweh addresses the personified city while retaining both geographical images.
  reasoning_layer_used: POB lexical and theological decisions on יֹשֶׁבֶת and צוּר
  rationale: Naming the city directly clarifies the personification without weakening the rock image.
- pob_phrase: enter into our dwellings
