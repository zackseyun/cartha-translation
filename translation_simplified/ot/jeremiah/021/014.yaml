translation:
  language: en
  text: “I will punish you according to the fruit your deeds have produced,” declares Yahweh. “I will start a fire in her forest[a], and the fire will consume everything around her.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her forest” is likely a poetic image for Jerusalem or her royal or palace complex. It may also picture a thicket of buildings or defenses.
    reason: cultural_note
