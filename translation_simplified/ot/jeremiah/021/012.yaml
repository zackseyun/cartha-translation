translation:
  language: en
  text: 'House of David, this is what Yahweh says: In the morning[a], give fair judgments. Rescue the person who has been robbed from the oppressor’s power. Otherwise, my wrath will break out like fire and burn, and no one will be able to put it out, because of their evil deeds.'
