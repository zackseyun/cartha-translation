translation:
  language: en
  text: 'Yahweh says: “Cursed is the man[a] who puts his trust in man and depends on mortal flesh[b] for strength. His heart turns away from Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses masculine singular words in a representative sense.
    reason: cultural_note
  - marker: b
    text: “Flesh” points to the weakness and mortality of human beings.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: Yahweh says
  preserved_meaning: Yahweh is the speaker who delivers the prophetic warning.
  reasoning_layer_used: Lexical decision for the prophetic messenger formula and divine name
  rationale: The simpler formula keeps Yahweh’s personal name and direct authority.
- pob_phrase: makes flesh his strength
  simplified_phrase: depends on mortal flesh for strength
  preserved_meaning: The man relies on frail human power rather than Yahweh.
  reasoning_layer_used: Lexical and theological decisions for בָּשָׂר and זְרֹעוֹ
  rationale: This wording explains the strength idiom while retaining the concrete image of flesh.
- pob_phrase: whose heart turns away from Yahweh
  simplified_phrase: His heart turns away from Yahweh
  preserved_meaning: Misplaced human trust reflects an inner turning away from Yahweh.
  reasoning_layer_used: Lexical decision for לִבּוֹ and clause structure
  rationale: A separate sentence makes the spiritual consequence easier to follow.
interpretive_expansions:
- pob_phrase: flesh
  rendering: mortal flesh
  claim: Here “flesh” emphasizes human frailty and mortality, not sinful nature.
  evidence:
  - The POB lexical rationale identifies mortal human frailty as the sense.
  - The immediate contrast is between human reliance and reliance on Yahweh.
  confidence: high
  alternatives_preserved:
  - human flesh
  - mere flesh
translation_notes:
  risk_flags:
  - risk: Adding “mortal” makes the frailty implied by “flesh” explicit.
    mitigation: The source image “flesh” remains in the main text and the POB rationale directly supports the clarification.
  - risk: Modern readers may understand “man” as excluding women.
    mitigation: The footnote explains that the Hebrew masculine singular is representative.
