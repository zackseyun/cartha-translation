translation:
  language: en
  text: But I did not hurry away from following you as a shepherd. I did not long for the day of disaster.[a] You know that. Everything I said was spoken in your presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes this as a grievous or “sick” day, meaning a day of disaster or judgment.
    reason: lexical_alternative
