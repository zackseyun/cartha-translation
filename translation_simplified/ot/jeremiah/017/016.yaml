  preserved_meaning: Jeremiah remained in his shepherd-like role while following the LORD.
  reasoning_layer_used: lexical and theological decisions
  rationale: The new order is natural English while retaining both the shepherd image and following God.
- pob_phrase: I did not desire
  simplified_phrase: I did not long for
  preserved_meaning: Jeremiah denies wishing for the coming disaster.
  reasoning_layer_used: lexical decision
  rationale: “Long for” clearly expresses the source verb’s sense of desire.
- pob_phrase: What came from my lips was before your face
  simplified_phrase: Everything I said was spoken in your presence
  preserved_meaning: Jeremiah’s spoken words were fully before God.
  reasoning_layer_used: lexical decisions
  rationale: The wording explains the Hebrew images in direct, ordinary English.
