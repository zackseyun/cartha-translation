translation:
  language: en
  text: You yourself will let go of the land I gave you as your inheritance. I will make you serve your enemies in a land you have never known. For you all[a] have kindled a fire in my anger, and it will burn forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts here from singular “you” to plural “you all,” addressing the people collectively.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “forever” can also describe an indefinitely long or enduring time.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let go of your inheritance that I gave you
  simplified_phrase: let go of the land I gave you as your inheritance
  preserved_meaning: Judah must relinquish its God-given land while the image of letting go remains.
  reasoning_layer_used: POB lexical decisions for שׁמט and נחלה
  rationale: Reordering the phrase makes the territorial inheritance clear without replacing the source image.
- pob_phrase: in a land that you have not known
  simplified_phrase: in a land you have never known
  preserved_meaning: Judah will serve its enemies in an unfamiliar foreign land.
  reasoning_layer_used: POB lexical decision for ידע
  rationale: “Never known” expresses unfamiliarity in direct modern English.
- pob_phrase: for you have kindled a fire in my anger—it will burn forever
  simplified_phrase: For you all have kindled a fire in my anger, and it will burn forever.
  preserved_meaning: The people provoked God's enduring anger, portrayed as a fire they kindled.
  reasoning_layer_used: POB theological decisions on plural address and עַד עוֹלָם
  rationale: “You all” marks the plural accusation without adding distributive force.
interpretive_expansions:
- pob_phrase: your inheritance
  rendering: the land I gave you as your inheritance
  claim: The inheritance here is Judah's God-given land.
  evidence:
  - The POB lexical rationale identifies נחלה as the hereditary land given by God.
  - The next clause contrasts it with an unfamiliar land of enemy service.
  confidence: high
  alternatives_preserved:
  - inheritance
  - heritage or allotted possession
- pob_phrase: you have kindled
  rendering: you all have kindled
  claim: The accusation shifts from Judah in the singular to the people collectively.
  evidence:
  - The Hebrew verb changes from second-person singular to second-person plural.
  - The POB theological decision requires preserving this rhetorical shift.
  confidence: high
  alternatives_preserved:
  - Judah personified in the preceding singular address
translation_notes:
  risk_flags:
  - risk: Calling the inheritance “the land” narrows a term that can also mean heritage or allotted possession.
    mitigation: The text retains “inheritance,” and the exile context supports the territorial sense.
  - risk: “Forever” may sound strictly endless although עוֹלָם can denote enduring or indefinite duration.
    mitigation: The main text follows the POB decision, while footnote b preserves the lexical range.
