translation:
  language: en
  text: 'This is what Yahweh said to me: “Go and stand at the gate of the people,[a] where the kings of Judah enter and leave. Stand also at every gate of Jerusalem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the gate of the sons of the people.” This may have been the name of a specific gate, often called the People’s Gate.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus Yahweh said to me
  simplified_phrase: This is what Yahweh said to me
  preserved_meaning: The wording still introduces a divine message addressed to Jeremiah.
  reasoning_layer_used: Lexical decision for כֹּה and theological decision for יְהוָה.
  rationale: The fuller speech formula is easier for modern readers while retaining Yahweh’s covenant name.
- pob_phrase: by which the kings of Judah enter and by which they go out
  simplified_phrase: where the kings of Judah enter and leave
  preserved_meaning: The gate remains the route used by Judah’s kings in both directions.
  reasoning_layer_used: Lexical decision for the repeated relative clauses.
  rationale: “Where” and “leave” express the same movement in ordinary English.
- pob_phrase: and in all the gates of Jerusalem
  simplified_phrase: Stand also at every gate of Jerusalem
  preserved_meaning: Yahweh’s command extends from the named gate to all Jerusalem’s gates.
  reasoning_layer_used: Lexical rationale for וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם and immediate syntax.
  rationale: Repeating “stand” makes the implied command clear and avoids an awkward sentence ending.
