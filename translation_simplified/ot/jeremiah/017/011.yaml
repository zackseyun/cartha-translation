translation:
  language: en
  text: A person who gains wealth unjustly is like a partridge that gathers chicks it did not hatch.[a] In midlife, that wealth will leave him, and in the end he will be a fool.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a partridge that sits on eggs it did not lay.” The bird’s exact behavior is uncertain, but the point is that what is not rightfully gained will not remain.
    reason: lexical_alternative
