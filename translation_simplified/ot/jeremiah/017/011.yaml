  preserved_meaning: Unjust wealth is compared to a bird possessing young that are not its own.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The sentence is reordered and “brood” becomes the more familiar “chicks” without settling the uncertain bird behavior.
