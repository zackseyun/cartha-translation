- pob_phrase: And it shall be, if you truly listen to me, declares Yahweh
  simplified_phrase: Yahweh declares, “If you truly listen to me”
  preserved_meaning: Yahweh introduces an emphatic condition requiring attentive, obedient hearing.
  reasoning_layer_used: POB lexical and theological decisions on שׁמע and יהוה
  rationale: Putting the speaker first removes the difficult opening formula while retaining the condition and divine name.
- pob_phrase: by not bringing a load through the gates of this city
  simplified_phrase: by not carrying a load through this city’s gates
  preserved_meaning: The people must not transport a carried load through the city gates.
  reasoning_layer_used: POB lexical decisions on מַשָּׂא and the gate phrase
  rationale: “Carrying” expresses the physical action in direct, natural English.
- pob_phrase: and by keeping the Sabbath day holy, by not doing any work on it
  simplified_phrase: and by keeping the Sabbath day holy and doing no work on it
  preserved_meaning: The people must treat the Sabbath as holy and refrain from all work.
