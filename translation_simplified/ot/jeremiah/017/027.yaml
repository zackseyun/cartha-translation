translation:
  language: en
  text: But if you do not listen to me—if you do not keep the Sabbath day holy, but carry loads into Jerusalem through its gates on that day—then I will start a fire at its gates. The fire will burn up Jerusalem’s palaces and will not go out.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem
  simplified_phrase: if you do not keep the Sabbath day holy, but carry loads into Jerusalem through its gates
  preserved_meaning: Listening to God requires keeping the Sabbath holy and not transporting loads into the city.
  reasoning_layer_used: POB lexical decisions and conditional judgment structure
  rationale: The direct condition preserves both Sabbath requirements in a clearer contrast.
- pob_phrase: then I will kindle a fire in its gates
  simplified_phrase: then I will start a fire at its gates
  preserved_meaning: God will cause a destructive fire at Jerusalem’s gates as judgment.
  reasoning_layer_used: POB lexical decisions for וְהִצַּתִּי אֵשׁ and בִּשְׁעָרֶיהָ
  rationale: “Start” replaces “kindle,” while “at” preserves the gates as the fire’s location.
- pob_phrase: it will consume the palaces of Jerusalem, and it will not be quenched
  simplified_phrase: The fire will burn up Jerusalem’s palaces and will not go out
  preserved_meaning: The fire will destroy the palaces and will not be extinguished.
  reasoning_layer_used: POB lexical decisions for וְאָכְלָה and וְלֹא תִכְבֶּה
  rationale: Naming the fire clarifies the referent, and ordinary wording retains the solemn judgment.
