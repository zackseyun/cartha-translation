  text: I, Yahweh, search the heart and test the kidneys (an image for a person’s deepest thoughts and affections).[a] I give each man[b] according to how he lives, according to the fruit of his deeds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses “kidneys” for a person’s deepest thoughts and affections.
    reason: cultural_note
  - marker: b
    text: “Each man” has representative force and includes each person.
    reason: lexical_alternative
