translation:
  language: en
  text: He will be like a shrub in the desert.[a][c] He will not see good when it comes.[b] He will live in parched places in the wilderness, in a salt land where no one lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact desert plant named by the Hebrew is uncertain; it may be a juniper, tamarisk, or barren bush.
    reason: lexical_alternative
  - marker: b
    text: This may also mean that he will not perceive when prosperity comes.
    reason: lexical_alternative
  - marker: c
    text: This could refer specifically to the region called the Arabah.
    reason: alternative_reading
