translation:
  language: en
  text: Judah’s sin is written with an iron engraving tool. A diamond point has carved it into the tablet of Judah’s heart and onto the raised horns at the corners of your altars.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “diamond” refers to an extremely hard engraving material, but its exact identity is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with an iron stylus
  simplified_phrase: with an iron engraving tool
  preserved_meaning: The tool is made of iron and is used to cut an inscription.
  reasoning_layer_used: Lexical decision for עֵט and בַּרְזֶל
  rationale: “Engraving tool” explains the less familiar word “stylus” while preserving the iron inscription image.
- pob_phrase: on the tablet of their heart
  simplified_phrase: into the tablet of Judah’s heart
  preserved_meaning: Judah’s sin is deeply inscribed within the people collectively.
  reasoning_layer_used: Lexical decision for לוח לבם and immediate referent
  rationale: Naming Judah makes the collective singular “heart” clear without dropping the tablet metaphor.
- pob_phrase: on the horns of your altars
  simplified_phrase: onto the raised horns at the corners of your altars
  preserved_meaning: The inscription appears on the horn-shaped projections of the audience’s altars.
  reasoning_layer_used: Lexical decision for קַרְנוֹת and theological decision on pronoun shift
  rationale: The added physical description clarifies “horns,” while “your” preserves the sudden direct address.
interpretive_expansions:
- pob_phrase: horns of your altars
  rendering: raised horns at the corners of your altars
  claim: The altar horns are raised projections located at its corners.
  evidence:
  - The POB lexical alternatives identify the horns as projections or corners.
  - The POB rationale identifies them as a standard feature of Israelite altars.
  confidence: high
  alternatives_preserved:
  - horns
  - projections
  - corners
