translation:
  language: en
  text: He will be like a tree planted beside water. It sends its roots out beside a stream. It is not afraid when the heat comes, and its leaves stay fresh and green. Even in a year of drought, it does not worry or stop bearing fruit.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a tree planted by water, that sends out its roots by a stream
  simplified_phrase: a tree planted beside water. It sends its roots out beside a stream.
  preserved_meaning: The tree is deliberately established near water and extends its roots along the water source.
  reasoning_layer_used: POB lexical decisions for שָׁתוּל, עַל מַיִם, יוּבַל, and יְשַׁלַּח שָׁרָשָׁיו
  rationale: Two short sentences make the image easier to follow without weakening it.
- pob_phrase: its leaf remains green
  simplified_phrase: its leaves stay fresh and green
  preserved_meaning: The foliage continues to flourish despite the heat.
  reasoning_layer_used: POB lexical decision for עָלֵהוּ רַעֲנָן
  rationale: “Fresh and green” preserves both main senses of the Hebrew adjective in common English.
- pob_phrase: it is not anxious, and it does not cease from bearing fruit
  simplified_phrase: it does not worry or stop bearing fruit
  preserved_meaning: Drought neither causes anxious concern nor interrupts the tree’s fruitfulness.
  reasoning_layer_used: POB lexical decisions for לֹא יִדְאָג and לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  rationale: Common verbs replace formal phrasing while keeping the two distinct effects.
translation_notes:
  risk_flags:
  - risk: Changing singular “leaf” to plural “leaves” slightly reduces formal correspondence.
    mitigation: The plural is natural English collective wording and preserves the foliage image.
