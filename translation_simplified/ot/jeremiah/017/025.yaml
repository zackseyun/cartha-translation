translation:
  language: en
  text: Then kings who sit on David’s throne will enter through the gates of this city, riding in chariots and on horses. Their officials, the men of Judah[a], and the inhabitants of Jerusalem will enter with them. This city will remain inhabited forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the people of Judah.” The Hebrew literally says “man of Judah,” used collectively.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: kings and officials will enter through the gates of this city, sitting on the throne of David, riding in chariots and on horses
  simplified_phrase: kings who sit on David’s throne will enter through the gates of this city, riding in chariots and on horses
  preserved_meaning: The Davidic kings enter the city and are the ones described as riding.
  reasoning_layer_used: Lexical and theological decisions on David’s throne and the riding phrase
  rationale: The relative clause clarifies royal status while keeping the Davidic image and the riders distinct.
- pob_phrase: they and their officials, the men of Judah and the inhabitants of Jerusalem
  simplified_phrase: Their officials, the men of Judah, and the inhabitants of Jerusalem will enter with them
  preserved_meaning: The officials and wider population join the kings in entering the city.
  reasoning_layer_used: Lexical decisions on the resumptive pronoun and participant groups
  rationale: A separate sentence prevents the wider group from being mistaken for the riders.
- pob_phrase: and this city will be inhabited forever
  simplified_phrase: This city will remain inhabited forever
  preserved_meaning: Jerusalem will continue as an inhabited city without end.
  reasoning_layer_used: Lexical decisions on יָשְׁבָה and לְעוֹלָם
  rationale: “Remain inhabited” plainly expresses continued settlement while preserving “forever.”
translation_notes:
  risk_flags:
  - risk: Separating the participant list into a new sentence may lessen the Hebrew’s flowing, resumptive structure.
    mitigation: The new sentence explicitly keeps every group within the same entry procession.
