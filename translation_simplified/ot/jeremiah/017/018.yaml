translation:
  language: en
  text: Let those who chase me be disgraced, but do not let me be disgraced. Let them be overcome with dismay, but do not let me be overcome with dismay. Bring a day of disaster on them. Shatter them with double destruction.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: my pursuers
  simplified_phrase: those who chase me
  preserved_meaning: The concrete image of enemies actively pursuing Jeremiah remains.
  reasoning_layer_used: POB lexical decision for רֹדְפַי
  rationale: The verbal wording is easier to picture without narrowing the sense to religious persecution.
- pob_phrase: let them be dismayed, but let me not be dismayed
  simplified_phrase: Let them be overcome with dismay, but do not let me be overcome with dismay
  preserved_meaning: Jeremiah asks that his enemies, rather than he, suffer emotional collapse.
  reasoning_layer_used: POB lexical decision for יֵחַתּוּ / אֵחַתָּה and grounding review
  rationale: Repeating “with dismay” preserves the matching Hebrew verb and prevents a suggestion of military defeat.
- pob_phrase: Bring upon them a day of disaster
  simplified_phrase: Bring a day of disaster on them
  preserved_meaning: The direct prayer asks God to send a time of judgment and ruin.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Modern word order clarifies the petition without softening its severity.
translation_notes:
  risk_flags:
  - risk: “Double destruction” is unusual in modern English.
    mitigation: It is retained because the Hebrew explicitly intensifies the breaking as double.
