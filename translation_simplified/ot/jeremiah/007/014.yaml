translation:
  language: en
  text: So I will do to the house that bears my name[a]—the house you trust in—just what I did to Shiloh.[b] I will do the same to the place I gave you and your fathers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression means that the house belongs to the LORD and is identified with him.
    reason: lexical_alternative
  - marker: b
    text: Shiloh was an earlier place of worship that God judged; see 1 Samuel 4 and Jeremiah 7:12.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the house that is called by my name
  simplified_phrase: the house that bears my name
  preserved_meaning: The house belongs to and is identified with the LORD.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Bears my name” expresses the Hebrew covenantal idiom in natural English.
- pob_phrase: and to the place that I gave to you and to your fathers, just as I did to Shiloh
  simplified_phrase: just what I did to Shiloh. I will do the same to the place I gave you and your fathers
  preserved_meaning: God will judge both the house and the broader place as he judged Shiloh.
  reasoning_layer_used: POB theological decision on house/place distinction
  rationale: Two sentences clarify the scope while keeping “house” and “place” distinct.
- pob_phrase: in which you trust
  simplified_phrase: the house you trust in
  preserved_meaning: The people continue to rely on the house for security.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  rationale: The revised clause uses ordinary English without weakening their ongoing reliance.
translation_notes:
  risk_flags:
  - risk: Splitting the sentence could make the judgments on the house and place seem unrelated.
    mitigation: “I will do the same” explicitly links both objects to the judgment on Shiloh.
