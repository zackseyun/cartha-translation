simplification_decisions:
- pob_phrase: And I will cast you out from before me
  simplified_phrase: I will cast you out of my sight.
  preserved_meaning: God forcefully rejects and removes the people from before him in judgment.
  reasoning_layer_used: POB lexical and theological decisions on מֵעַל פָּנַי
  rationale: “Out of my sight” states the Hebrew judgment idiom in clear modern English.
- pob_phrase: just as I cast out
  simplified_phrase: I did the same
  preserved_meaning: Judah’s coming judgment is compared directly with Ephraim’s earlier judgment.
  reasoning_layer_used: POB lexical decision on כַּאֲשֶׁר and repeated שׁלך
  rationale: A second sentence makes the comparison easy to follow without weakening it.
- pob_phrase: all the offspring of Ephraim
  simplified_phrase: all the descendants of Ephraim
  preserved_meaning: The phrase identifies the collective people descended from Ephraim.
  reasoning_layer_used: POB lexical decision on זֶרַע and theological decision to retain Ephraim
  rationale: “Descendants” is more familiar than “offspring” while keeping Ephraim’s name.
