translation:
  language: en
  text: 'This is what Yahweh of Hosts,[a] the God of Israel, says: “Change your way of life and your actions so they are good. Then I will allow you to keep living in this place.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” refers broadly to armies, especially the armies of heaven, and expresses Yahweh’s sovereign power.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also mean “I will cause you to live in this place.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says
  simplified_phrase: This is what ... says
  preserved_meaning: It retains the standard formula introducing Yahweh’s prophetic message.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The ordinary English formula is easier to understand while preserving prophetic authority.
- pob_phrase: Make your ways and your deeds good
  simplified_phrase: Change your way of life and your actions so they are good
  preserved_meaning: It calls for active reform in both overall conduct and concrete deeds.
  reasoning_layer_used: POB lexical decisions for הֵיטִיבוּ, דַרְכֵיכֶם, and מַעַלְלֵיכֶם
  rationale: The rewrite explains the “ways” metaphor without merging it with individual actions.
- pob_phrase: I will let you dwell in this place
  simplified_phrase: I will allow you to keep living in this place
  preserved_meaning: Yahweh permits their continued residence while “this place” remains deliberately broad.
  reasoning_layer_used: POB lexical and theological decisions for וַאֲשַׁכְּנָה אֶתְכֶם and בַּמָּקוֹם הַזֶּה
  rationale: Modern wording clarifies permitted continuance without narrowing the place to the temple, Jerusalem, or the land.
interpretive_expansions:
- pob_phrase: dwell
  rendering: keep living
  claim: The promise concerns continued residence rather than merely moving into the place.
  evidence:
  - The POB rationale identifies continued residence as the covenant-context sense.
  - The documented alternative “let you remain” supports continuance.
  confidence: high
  alternatives_preserved:
  - cause you to live
  - allow you to remain
