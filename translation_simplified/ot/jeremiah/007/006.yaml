- pob_phrase: oppress the foreigner, the fatherless, and the widow
  simplified_phrase: oppress foreigners living among you, children without fathers, or widows
  preserved_meaning: The command names the same three vulnerable social groups and broadly forbids oppressing them.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording explains the foreigner's resident status and the meaning of “fatherless” without narrowing “oppress.”
- pob_phrase: do not shed innocent blood in this place
  simplified_phrase: Do not shed innocent blood in this place.
  preserved_meaning: The command forbids unjust killing while retaining the Hebrew blood image and the specified place.
  reasoning_layer_used: POB lexical decisions for דָם נָקִי, תִּשְׁפְּכוּ, and בַּמָּקוֹם הַזֶּה
  rationale: This familiar expression remains clear and preserves the image's legal and moral force.
- pob_phrase: do not go after other gods to your own harm
  simplified_phrase: Do not go after other gods; that will bring harm on you.
  preserved_meaning: Going after other gods is forbidden and brings harm to the hearers themselves.
  reasoning_layer_used: POB lexical decisions for אַחֲרֵי ... לֹא תֵלְכוּ and לְרַע לָכֶם
  rationale: Separating the command from its consequence makes both clear without adding exclusivity.
