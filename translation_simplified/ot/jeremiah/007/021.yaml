translation:
  language: en
  text: 'This is what Yahweh of Armies, Israel’s God, says: “Add your burnt offerings[b] to your sacrifices.[a] Then eat the meat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “peace offerings”; the Hebrew may refer specifically to sacrifices from which the worshiper ate.
    reason: alternative_reading
  - marker: b
    text: A burnt offering was normally burned entirely on the altar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts, the God of Israel
  simplified_phrase: This is what Yahweh of Armies, Israel’s God, says
  preserved_meaning: The prophetic formula, divine name, broad military title, and identification with Israel remain intact.
  reasoning_layer_used: lexical and theological decisions
  rationale: Natural syntax and “Armies” make the title easier for modern readers to understand.
- pob_phrase: Add your burnt offerings to your sacrifices
  simplified_phrase: Add your burnt offerings to your sacrifices
  preserved_meaning: The direct command and the deliberate distinction between the offerings are preserved.
  reasoning_layer_used: lexical and theological decisions on סְפוּ and זִבְחֵיכֶם
  rationale: Keeping the broad term avoids adding an action or resolving the documented ambiguity.
- pob_phrase: and eat the flesh
  simplified_phrase: Then eat the meat
  preserved_meaning: The people are told to consume the sacrificial animal meat.
  reasoning_layer_used: lexical decision for בָשָׂר
  rationale: “Meat” is clear modern English, while “Then” naturally connects the commands.
