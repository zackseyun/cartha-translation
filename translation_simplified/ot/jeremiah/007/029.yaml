translation:
  language: en
  text: Cut off your hair—the sign that you were set apart—and throw it away.[a] Cry out in mourning on the bare hilltops, because Yahweh has rejected and abandoned the generation under his wrath.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “your crown,” but the commands to cut it off and throw it away favor hair that represented consecration.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says literally, “the generation of his wrath.”
    reason: source_note
