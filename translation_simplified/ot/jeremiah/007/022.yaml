translation:
  language: en
  text: For when I brought your ancestors out of Egypt, I did not speak to them or command them about burnt offerings and sacrifices.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This forceful denial contrasts ritual sacrifice with obedience; it does not necessarily mean that God never gave sacrificial laws.
    reason: cross_reference
