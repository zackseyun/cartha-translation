  preserved_meaning: The command is anchored to God's act of bringing Israel's forefathers out of Egypt.
  reasoning_layer_used: Lexical decision for the exodus time clause
  rationale: “When” expresses the event naturally without narrowing it to one calendar day.
- pob_phrase: your fathers
  simplified_phrase: your ancestors
  preserved_meaning: The people addressed are the earlier generations of Israel.
  reasoning_layer_used: Documented lexical alternative
  rationale: “Ancestors” prevents readers from mistaking the phrase for their immediate parents.
- pob_phrase: concerning burnt offering and sacrifice
  simplified_phrase: about burnt offerings and sacrifices
