translation:
  language: en
  text: But you must not pray for these people. Do not cry out or offer a prayer for them. Do not plead with me for them, because I am not listening to you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because I will not hear you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But as for you
  simplified_phrase: But you
  preserved_meaning: God directly contrasts Jeremiah with the people and addresses him personally.
  reasoning_layer_used: Lexical decision for וְאַתָּה
  rationale: The shorter wording keeps the contrast while sounding natural in modern English.
- pob_phrase: do not lift up a cry or prayer on their behalf
  simplified_phrase: Do not cry out or offer a prayer for them
  preserved_meaning: Jeremiah must bring neither an urgent cry nor a prayer to God for the people.
  reasoning_layer_used: Lexical decisions for נשא, רִנָּה, תְּפִלָּה, and בַעֲדָם
  rationale: The rewrite preserves both forms of appeal without the less familiar idiom “lift up.”
- pob_phrase: do not intercede with me
  simplified_phrase: Do not plead with me for them
  preserved_meaning: Jeremiah must not urgently appeal to God on the people’s behalf.
  reasoning_layer_used: Lexical and theological decisions for וְאַל תִּפְגַּע בִּי
  rationale: “Plead with me for them” explains intercession in common English while retaining its urgency.
translation_notes:
  risk_flags:
  - risk: “Plead” could be read as a general personal request rather than intercession.
    mitigation: The words “for them” preserve the representative sense.
  - risk: The present wording may obscure the Hebrew’s possible future sense.
    mitigation: The footnote preserves “I will not hear you” as an alternative.
