translation:
  language: en
  text: 'This is what Yahweh of Armies, the God of Israel, says about Ahab son of Kolaiah and Zedekiah son of Maaseiah: “They keep prophesying lies to you in my name. Look, I am handing them over to Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of Armies ... says
  preserved_meaning: The prophetic formula and Yahweh’s sovereign warrior title remain intact.
  reasoning_layer_used: POB lexical decisions for כֹּה אָמַר, יְהוָה, and צְבָאוֹת
  rationale: Direct English makes the formula and the meaning of “hosts” easier to understand.
- pob_phrase: who are prophesying a lie to you in my name
  simplified_phrase: They keep prophesying lies to you in my name.
  preserved_meaning: Their false prophecy is ongoing and falsely claims Yahweh’s authority.
  reasoning_layer_used: POB lexical decisions for הַנִּבְּאִים, שָׁקֶר, and בִּשְׁמִי
  rationale: A separate sentence clearly presents both their continuing action and false claim of authority.
- pob_phrase: Behold, I am giving them into the hand of Nebuchadnezzar
  simplified_phrase: Look, I am handing them over to Nebuchadnezzar
  preserved_meaning: Yahweh solemnly announces that he is placing them under Nebuchadnezzar’s power.
  reasoning_layer_used: POB lexical decisions for הִנְנִי and נֹתֵן אֹתָם בְּיַד
  rationale: “Look” retains the emphatic announcement, while “handing them over” naturally expresses the transfer of power.
translation_notes:
  risk_flags:
  - risk: “Strike them down” may be understood as explicitly meaning death.
    mitigation: The wording follows POB’s deliberately less specific judgment language rather than saying “kill them.”
