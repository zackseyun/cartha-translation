  rationale: The active English form is easier to understand and keeps the image of finding Yahweh.
- pob_phrase: I will restore your fortunes
  simplified_phrase: I will restore your well-being
  preserved_meaning: Yahweh will reverse the people's condition of exile and distress.
  reasoning_layer_used: POB lexical and theological decisions for the restoration idiom
  rationale: “Well-being” communicates broad restoration without limiting the promise to money or literal captives.
