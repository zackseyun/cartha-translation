translation:
  language: en
  text: “I will let you find me,” declares Yahweh. “I will restore your well-being[a] and gather you from every nation and every place where I drove you,” declares Yahweh. “I will bring you back to the place from which I sent you into exile.”
  philosophy: optimal-equivalence
  footnotes:
