translation:
  language: en
  text: All the people of Judah living in exile in Babylon will use their fate as a curse. They will say, “May Yahweh make you like Zedekiah and Ahab, whom the king of Babylon roasted in the fire.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “burned in the fire.” “Roasted” preserves the Hebrew verb’s vivid force.
    reason: lexical_alternative
