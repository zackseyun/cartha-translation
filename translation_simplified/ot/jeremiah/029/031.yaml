translation:
  language: en
  text: Send word to all the exiles. Say, “This is what Yahweh says about Shemaiah the Nehelamite:[a] Because Shemaiah has prophesied to you even though I did not send him, and has led you to trust a lie,”
  philosophy: optimal-equivalence
  footnotes:
