    text: “Nehelamite” may instead mean “dreamer”; its exact meaning is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Send to all the exiles, saying
  simplified_phrase: Send word to all the exiles. Say
  preserved_meaning: Jeremiah must communicate the following message to the entire exiled community.
  reasoning_layer_used: The lexical decisions identify an epistolary command and allow “Send word” and “and say.”
  rationale: Two direct sentences make the command easier to follow.
- pob_phrase: Thus says Yahweh concerning
  simplified_phrase: This is what Yahweh says about
  preserved_meaning: The message is Yahweh’s authoritative statement about Shemaiah.
  reasoning_layer_used: The messenger-formula and אֶל lexical decisions support this natural wording.
  rationale: The common English formula preserves both divine authority and the oracle’s subject.
- pob_phrase: has made you trust in a lie
  simplified_phrase: has led you to trust a lie
  preserved_meaning: Shemaiah caused the exiles to place confidence in falsehood.
  reasoning_layer_used: The Hiphil lexical decision requires a causative sense.
  rationale: “Led you to trust” states the causation naturally without weakening the charge.
