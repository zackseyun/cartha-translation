translation:
  language: en
  text: For this is what Yahweh says about the king who sits on David’s throne and all the people living in this city—your brothers[a] who did not go with you into exile—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your kinsmen”; the Hebrew says “your brothers,” but here it may refer broadly to fellow Judeans.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For thus says Yahweh
  simplified_phrase: For this is what Yahweh says
  preserved_meaning: The wording still introduces Yahweh’s prophetic declaration and connects it to the preceding statement.
  reasoning_layer_used: Lexical decision for כִּי and כֹה אָמַר
  rationale: The modern formula is easier to understand than the traditional “thus says.”
- pob_phrase: concerning the king ... and concerning all the people
  simplified_phrase: about the king ... and all the people
  preserved_meaning: Yahweh’s declaration concerns both the king and the whole population named here.
  reasoning_layer_used: Lexical decisions for אֶל and וְאֶל כָּל הָעָם
  rationale: One plain “about” naturally governs both coordinated groups.
- pob_phrase: who did not go out with you into exile
  simplified_phrase: who did not go with you into exile
  preserved_meaning: These fellow Judeans did not leave Jerusalem with the people sent into exile.
  reasoning_layer_used: Lexical decisions for יָצְאוּ אִתְּכֶם and בַּגּוֹלָה
  rationale: Removing the redundant English particle keeps the historical movement into exile clear.
