translation:
  language: en
  text: This is because they have done an outrageous thing in Israel. They have committed adultery with the wives of other men in their community. They claimed to speak in my name, but their message was a lie that I did not command them to speak. I myself know, and I am a witness, declares Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because they have committed an outrageous act in Israel
  simplified_phrase: This is because they have done an outrageous thing in Israel.
  preserved_meaning: Their morally shocking conduct is the reason for the judgment stated before this verse.
  reasoning_layer_used: POB lexical decisions for יַעַן אֲשֶׁר and עָשׂוּ נְבָלָה
  rationale: A separate sentence keeps the causal link while making the accusation easier to follow.
- pob_phrase: with their neighbors’ wives
  simplified_phrase: with the wives of other men in their community
  preserved_meaning: They committed adultery with the wives of fellow community members.
  reasoning_layer_used: POB lexical rationale for אֶת נְשֵׁי רֵעֵיהֶם
  rationale: This avoids limiting “neighbors” to people who lived nearby.
- pob_phrase: And I am the one who knows and is a witness
  simplified_phrase: I myself know, and I am a witness
  preserved_meaning: Yahweh emphatically identifies himself as knowing the offense and being its witness.
  reasoning_layer_used: POB lexical decision and documented alternative for וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  rationale: The direct wording preserves the emphasis and courtroom force without an awkward relative clause.
interpretive_expansions:
- pob_phrase: have spoken in my name a lie that I did not command them
  rendering: They claimed to speak in my name, but their message was a lie that I did not command them to speak
  claim: Speaking in Yahweh’s name means claiming his authority for a false message he did not authorize.
  evidence:
  - The POB lexical rationale says “in my name” denotes claimed divine authorization or representation.
  - The immediate clause denies that Yahweh commanded the message.
  confidence: high
  alternatives_preserved:
  - spoken in my name a lie that I did not command them
