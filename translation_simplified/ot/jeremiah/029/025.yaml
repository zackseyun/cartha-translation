translation:
  language: en
  text: 'This is what Yahweh of Armies, the God of Israel, says: “Because you have sent letters in your own name[a] to everyone in Jerusalem, to the priest Zephaniah son of Maaseiah, and to all the priests, and in those letters you said,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means that you acted on your own authority rather than Yahweh’s.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of Armies ... says
  preserved_meaning: The prophetic formula, divine name, and broad military title remain intact.
  reasoning_layer_used: Lexical decisions for כֹּה אָמַר, יְהוָה, and צְבָאוֹת
  rationale: Common syntax and the documented alternative “Armies” make the title easier to understand.
- pob_phrase: Zephaniah son of Maaseiah the priest
  simplified_phrase: the priest Zephaniah son of Maaseiah
  preserved_meaning: Zephaniah remains identified by his father and priestly office.
  reasoning_layer_used: Lexical decision for צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  rationale: Moving the title before the name makes clear that Zephaniah is the priest.
- pob_phrase: and to all the priests, saying
  simplified_phrase: and to all the priests, and in those letters you said
  preserved_meaning: All the priests are addressed, and the next verse gives the letters’ words.
  reasoning_layer_used: Lexical decisions for כָּל הַכֹּהֲנִים and לֵאמֹר
  rationale: The recast wording clearly connects the coming quotation with the letters.
interpretive_expansions:
- pob_phrase: saying
  rendering: and in those letters you said
  claim: The words introduced in the next verse are the contents of the letters.
  evidence:
  - The clause follows the statement that letters were sent and introduces their quoted message.
  confidence: high
  alternatives_preserved:
  - saying
translation_notes:
  risk_flags:
  - risk: “Armies” may be understood as referring only to human forces.
    mitigation: The title remains broad and does not identify the armies as exclusively human or heavenly.
  - risk: “Your own name” may sound like a mere signature.
    mitigation: The footnote explains the likely contrast between Shemaiah’s authority and Yahweh’s.
