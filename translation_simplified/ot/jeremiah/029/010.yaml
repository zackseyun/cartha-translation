translation:
  language: en
  text: 'For this is what Yahweh says: “When the seventy years connected with Babylon are complete,[a] I will turn my attention to you. I will carry out my good promise to you and bring you back to this place.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not specify whether these years refer to Babylon’s rule or to the exiles’ time there.
    reason: alternative_reading
