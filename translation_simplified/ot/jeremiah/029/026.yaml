translation:
  language: en
  text: Yahweh has made you priest in place of Jehoiada the priest. You are to serve as an overseer in the house of Yahweh, with authority over every man who is mad and acts as a prophet. You should put any such man in the stocks and in an iron restraint for his neck.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of iron neck restraint is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: to be overseers in the house of Yahweh over every man
  simplified_phrase: You are to serve as an overseer in the house of Yahweh, with authority over every man
  preserved_meaning: His supervisory office is located in the temple and gives him jurisdiction over the men described.
  reasoning_layer_used: POB lexical decisions for לִהְיוֹת פְּקִדִים, בֵּית יְהוָה, and לְכָל אִישׁ
  rationale: The recast distinguishes the place of service from the people under his authority.
- pob_phrase: every man who is mad and acts as a prophet
  simplified_phrase: every man who is mad and acts as a prophet
  preserved_meaning: The wording preserves both the masculine scope and the speaker's hostile characterization.
  reasoning_layer_used: POB lexical and theological decisions for אִישׁ, מְשֻׁגָּע, and מִתְנַבֵּא
  rationale: Retaining the phrase avoids turning the speaker's accusation into a neutral endorsement.
- pob_phrase: put him into the stocks and the neck iron
  simplified_phrase: put any such man in the stocks and in an iron restraint for his neck
  preserved_meaning: Each man described is to be confined in stocks and an uncertain iron device involving the neck.
  reasoning_layer_used: POB lexical decisions and cultural note for הַמַּהְפֶּכֶת and הַצִּינֹק
  rationale: The concrete description is understandable without claiming an exact device type.
interpretive_expansions:
- pob_phrase: the neck iron
  rendering: an iron restraint for his neck
  claim: The object is an iron restraining device used at the neck.
  evidence:
  - The POB lexical rationale identifies it as an iron restraint, probably for the neck.
  confidence: moderate
  alternatives_preserved:
