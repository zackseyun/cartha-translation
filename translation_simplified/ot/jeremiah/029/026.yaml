translation_notes:
  risk_flags:
  - risk: Using singular “an overseer” does not display the Hebrew plural noun.
    mitigation: The singular fits the one addressee while preserving the supervisory function.
  - risk: “Acts as a prophet” may sound like the translator's judgment about genuine prophecy.
    mitigation: The wording retains the POB's hostile speaker perspective without calling the man a false prophet.
