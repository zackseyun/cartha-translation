  text: “This judgment came because they did not listen to my words,” declares Yahweh. “Again and again,[a] I sent my servants the prophets to bring my words to them. But you did not listen,” declares Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew pictures Yahweh “rising early and sending” the prophets, emphasizing his eager, repeated action.
    reason: source_note
  - marker: b
    text: Hebrew shifts from “they did not listen” to “you did not listen,” directly confronting the hearers.
    reason: alternative_reading
