translation:
  language: en
  text: 'So this is what Yahweh says: “Look! I am about to punish Shemaiah the Nehelamite[a] and his descendants. None of his male descendants will remain among this people, and he will not see the good I am doing for my people,” declares Yahweh, “because he has spoken words of rebellion against Yahweh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nehelamite” may mean “dreamer,” but its exact meaning here is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “rebellion” may also mean “apostasy” or “revolt.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'Therefore thus says Yahweh: Behold'
  simplified_phrase: 'So this is what Yahweh says: “Look!”'
  preserved_meaning: The judgment follows the preceding message and opens with a forceful call for attention.
  reasoning_layer_used: Lexical decisions for לָכֵן, כֹּה אָמַר יְהוָה, and הִנְנִי
  rationale: Natural prophetic wording retains both consequence and the Hebrew expression’s pointing force.
- pob_phrase: He will not have a man dwelling among this people
  simplified_phrase: None of his male descendants will remain among this people
  preserved_meaning: Shemaiah will have no surviving male representative within the community.
  reasoning_layer_used: Lexical rationale for אִישׁ יֹשֵׁב and the immediate reference to his offspring
  rationale: The Hebrew idiom is stated directly while preserving its masculine family sense.
- pob_phrase: because he has spoken rebellion against Yahweh
  simplified_phrase: because he has spoken words of rebellion against Yahweh
  preserved_meaning: Shemaiah’s speech expressed or promoted revolt against Yahweh.
  reasoning_layer_used: Lexical decision for סָרָה דִבֶּר עַל יְהוָה
  rationale: “Words of” makes the construction natural without narrowing rebellion to one specific form.
interpretive_expansions:
- pob_phrase: He will not have a man dwelling among this people
  rendering: None of his male descendants will remain among this people
  claim: The man in view is a male descendant representing Shemaiah’s posterity.
  evidence:
