  preserved_meaning: The recipients included elders who remained within the deported community.
  reasoning_layer_used: POB lexical rationale for יֶתֶר זִקְנֵי הַגּוֹלָה
  rationale: “Among” clearly expresses the elders’ relationship to the exiled community.
- pob_phrase: whom Nebuchadnezzar had carried away
