translation:
  language: en
  text: Jeremiah the prophet sent this letter from Jerusalem to the remaining elders among the exiles,[a] as well as to the priests, the prophets, and all the people Nebuchadnezzar had deported from Jerusalem to Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the rest of the elders of the exile.”
    reason: lexical_alternative
