translation:
  language: en
  text: “For I know what I have planned for you,” declares Yahweh. “My plans are for peace,[a] not harm.[b] I intend to give you a future and hope.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “peace” also includes wholeness and well-being.
    reason: lexical_alternative
  - marker: b
    text: Or “not disaster” or “not calamity.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the plans that I have for you
  simplified_phrase: what I have planned for you
  preserved_meaning: Yahweh knows his purposeful intentions toward the exiles.
  reasoning_layer_used: The lexical decisions identify both the noun and related verb as purposeful planning.
  rationale: The verbal form is easier to understand while preserving the Hebrew word link.
- pob_phrase: plans for peace and not for harm
  simplified_phrase: My plans are for peace, not harm
  preserved_meaning: Yahweh’s plans aim at peace rather than injury or disaster.
  reasoning_layer_used: The lexical and theological decisions retain “peace” and contrast it with non-moral harm.
  rationale: A new sentence makes the contrast direct without narrowing either term.
- pob_phrase: to give you a future and a hope
  simplified_phrase: I intend to give you a future and hope
  preserved_meaning: Giving the exiles a hopeful future is the purpose of Yahweh’s plans.
  reasoning_layer_used: The lexical decision identifies the infinitive as expressing purpose.
  rationale: Stating the purpose with “I intend” avoids an unclear trailing infinitive.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “peace” only as the absence of conflict.
    mitigation: The footnote preserves the broader sense of wholeness and well-being.
