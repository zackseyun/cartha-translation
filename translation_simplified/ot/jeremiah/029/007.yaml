translation:
  language: en
  text: Work for the well-being of the city where I sent you into exile, and pray to Yahweh for it. For its well-being will be your well-being too.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same Hebrew word can also mean “peace” or “welfare” and is repeated for both the city and the exiles.
    reason: lexical_alternative
