  preserved_meaning: The command calls for active effort toward the city’s overall flourishing.
  reasoning_layer_used: POB lexical decisions for דִרְשׁוּ and שְׁלוֹם
  rationale: “Work for” makes the active command clear, while “well-being” conveys the broad sense of shalom.
- pob_phrase: pray to Yahweh on its behalf
  simplified_phrase: pray to Yahweh for it
  preserved_meaning: The exiles must pray in favor of the city.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter wording is natural English and retains both the prayer command and the divine name.
- pob_phrase: in its welfare you will have welfare
  simplified_phrase: its well-being will be your well-being too
  preserved_meaning: The exiles’ well-being is bound up with the city’s well-being.
  reasoning_layer_used: POB lexical decision for repeated שְׁלוֹם and grounding review
  rationale: The revision preserves the repeated term and reciprocal connection without implying a temporal sequence.
