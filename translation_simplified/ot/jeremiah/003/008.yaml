translation:
  language: en
  text: I saw that Israel had turned away and committed adultery in all these ways. That was why I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah was not afraid. She too went and prostituted herself.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: backsliding Israel
  simplified_phrase: Israel had turned away
  preserved_meaning: Israel's apostasy is pictured as turning away.
  reasoning_layer_used: POB lexical decision for מְשֻׁבָה יִשְׂרָאֵל
  rationale: The verb phrase makes the turning image clear without the less familiar term “backsliding.”
- pob_phrase: And I saw that because ... I had sent her away
  simplified_phrase: I saw that ... That was why I had sent her away
  preserved_meaning: Israel's adultery is the reason God sent her away.
  reasoning_layer_used: POB lexical decisions for כִּי and עַל כָּל אֹדוֹת אֲשֶׁר
  rationale: Two sentences clarify the compressed relationship between what God saw and why he acted.
- pob_phrase: did not fear
  simplified_phrase: was not afraid
  preserved_meaning: Judah felt no fear in response to Israel's judgment.
  reasoning_layer_used: POB lexical decision for וְלֹא יָרְאָה
  rationale: The common English expression retains the moral force of Judah's lack of fear.
translation_notes:
  risk_flags:
  - risk: “Turned away” may sound less like a fixed prophetic label than “backsliding.”
    mitigation: The wording preserves the source term's turning image and keeps Israel's adultery explicit.
  - risk: Modern readers may take the sexual language only literally.
    mitigation: The full sequence of adultery, divorce, and prostitution preserves the controlling covenant-marriage metaphor.
