translation:
  language: en
  text: “Come back, you faithless children,” declares Yahweh. “I am your master.[a] I will take one of you from a city and two from a clan and bring you to Zion.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I am your husband,” or “I have married you.” The Hebrew verb can refer both to authority and to marriage.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Return, O faithless children
  simplified_phrase: Come back, you faithless children
  preserved_meaning: Yahweh calls his covenant people to turn back to him after their faithlessness.
  reasoning_layer_used: Lexical decision for שׁוּבוּ and immediate covenant context
  rationale: “Come back” expresses the relational and directional image in familiar English.
- pob_phrase: and I will take you, one from a city and two from a clan
  simplified_phrase: I will take one of you from a city and two from a clan
  preserved_meaning: Yahweh will select and gather people from scattered cities and clans.
  reasoning_layer_used: Lexical decisions for לקח and the distributive numerical phrase
  rationale: “One of you” makes the English grammar clear without adding “each.”
- pob_phrase: and I will bring you to Zion
  simplified_phrase: and bring you to Zion
  preserved_meaning: Yahweh himself will restore the gathered people to Zion.
  reasoning_layer_used: Lexical decision for ביא and retained theological place-name
  rationale: Removing the repeated subject keeps the sentence natural while preserving Yahweh as the agent.
translation_notes:
  risk_flags:
  - risk: “Master” alone could conceal the Hebrew verb’s marital sense.
    mitigation: The footnote preserves both major marital alternatives.
  - risk: The numerical phrase may be understood as explicitly meaning “each” city and clan.
    mitigation: The text retains the unmarked wording and does not insert “each.”
