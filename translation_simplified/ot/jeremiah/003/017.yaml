translation:
  language: en
  text: At that time, people will call Jerusalem “Yahweh’s throne.”[a] All the nations will gather there, in Jerusalem,[b] to honor Yahweh’s name.[c] They will no longer follow their stubborn, evil hearts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This image presents Jerusalem as the place of Yahweh’s royal rule without defining how this will be fulfilled.
    reason: cultural_note
  - marker: b
    text: The Hebrew verb is difficult and may also mean “be gathered there” or “stream there.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew more literally says “for the name of Yahweh” and can indicate movement in honor of his name.
    reason: source_note
simplification_decisions:
- pob_phrase: they will call Jerusalem ‘the throne of Yahweh’
  simplified_phrase: people will call Jerusalem “Yahweh’s throne”
  preserved_meaning: Jerusalem is identified with Yahweh’s royal throne while the active wording and throne image remain.
  reasoning_layer_used: lexical and theological decisions
  rationale: The possessive form is easier to read without deciding whether the throne image is literal or symbolic.
- pob_phrase: all the nations will gather to it, to Jerusalem
  simplified_phrase: All the nations will gather there, in Jerusalem
  preserved_meaning: The nations assemble toward Jerusalem without specifying pilgrimage, conversion, or political submission.
  reasoning_layer_used: lexical and theological decisions
  rationale: “There, in Jerusalem” makes the destination natural in English while retaining the repeated place-name.
- pob_phrase: walk after the stubbornness of their evil heart
  simplified_phrase: follow their stubborn, evil hearts
  preserved_meaning: The nations will stop letting inward stubbornness and evil direct their course.
  reasoning_layer_used: lexical decision
  rationale: “Follow” expresses the Hebrew idiom plainly while preserving the moral force of stubborn and evil hearts.
interpretive_expansions:
- pob_phrase: for the name of Yahweh
  rendering: to honor Yahweh’s name
  claim: The nations gather in Jerusalem with their movement directed toward honoring Yahweh’s name.
  evidence:
  - The lexical rationale says the phrase indicates orientation toward or honor for Yahweh’s name.
  - The immediate context links the nations’ gathering with Jerusalem as Yahweh’s throne.
  confidence: moderate
  alternatives_preserved:
  - for the name of Yahweh
  - because of the name of Yahweh
  - to the name of Yahweh
translation_notes:
  risk_flags:
  - risk: “To honor” may sound narrower than the Hebrew phrase, which can also express orientation or cause.
    mitigation: Footnote c preserves the more literal wording and its broader sense.
  - risk: Plural “hearts” replaces the Hebrew collective singular “heart.”
    mitigation: The plural is normal English and preserves the reference to the inward moral will of all the nations.
