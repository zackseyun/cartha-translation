  preserved_meaning: Their shame and disgrace result from the shared guilt of the speakers and their fathers.
  reasoning_layer_used: Lexical decisions for כִּי, חָטָאנוּ, and אֲנַחְנוּ וַאֲבוֹתֵינוּ
