  preserved_meaning: God calls for an honest confession of moral guilt.
  reasoning_layer_used: Lexical decisions for דְּעִי and עֲוֺנֵךְ
  rationale: “Admit” expresses the confessional force in familiar language.
- pob_phrase: scattered your ways among strangers
  simplified_phrase: spread your ways toward strangers
  preserved_meaning: The people directed their conduct widely toward strangers while the image remains open.
  reasoning_layer_used: Lexical and theological decisions for וַתְּפַזְּרִי, דְּרָכַיִךְ, and לַזָּרִים
  rationale: “Spread” clarifies the scattering image while retaining “ways” and the direction toward strangers.
- pob_phrase: you have not obeyed my voice
  simplified_phrase: You have not obeyed me
  preserved_meaning: The people refused to heed Yahweh’s commands.
  reasoning_layer_used: Lexical decision for וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  rationale: Direct English preserves the force of refusing to listen and obey.
