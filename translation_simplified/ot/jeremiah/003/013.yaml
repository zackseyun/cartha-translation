translation:
  language: en
  text: 'Only admit your guilt: you have rebelled against Yahweh your God. You have spread your ways toward strangers[a] under every green tree.[b] You have not obeyed me, declares Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “strangers”; within the adultery image, this may also point to strange gods.
    reason: alternative_reading
  - marker: b
    text: “Under every green tree” commonly refers to places where illicit worship took place.
    reason: cultural_note
