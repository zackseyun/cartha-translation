translation:
  language: en
  text: Lift your eyes toward the bare hilltops and look. Is there anywhere no one has lain with you?[a] You sat beside the roads waiting for them, like an Arab in the wilderness.[b] You have polluted the land through your prostitution and wickedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a blunt sexual expression as a picture of covenant unfaithfulness.
    reason: source_note
  - marker: b
    text: This likely pictures someone lying in wait along desert routes; the point is deliberate pursuit, not ethnicity.
    reason: cultural_note
