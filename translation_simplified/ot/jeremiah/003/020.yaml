translation:
  language: en
  text: The LORD declares, “House of Israel, you have surely betrayed me, just as a woman betrays her companion.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “just as a wife betrays her husband.” The Hebrew uses the broader words “woman” and “companion,” though the surrounding passage uses marriage imagery.
    reason: alternative_reading
