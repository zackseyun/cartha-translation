  preserved_meaning: Israel is expected to remain faithful and continue following God.
  reasoning_layer_used: Lexical decision on וּמֵאַחֲרַי לֹא תשובו
  rationale: “Never” expresses the negative future naturally while preserving the turning-and-following image.
