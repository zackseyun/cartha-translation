translation:
  language: en
  text: When you have become numerous and fruitful in the land in those days, declares Yahweh, they will no longer say, “The ark of Yahweh’s covenant.” It will not come to mind. They will not remember it or miss it,[a] and no replacement ark will be made.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “attend to it” or “seek it out.” Here it likely means that people will no longer feel its absence or need it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be, when you have multiplied and been fruitful
  simplified_phrase: When you have become numerous and fruitful
  preserved_meaning: The people will increase in number and be fruitful in the promised future.
  reasoning_layer_used: Lexical decisions for וְהָיָה, תִרְבּוּ, and וּפְרִיתֶם
  rationale: The natural English opening retains both increase and fruitfulness.
- pob_phrase: they will no longer say, ‘The ark of the covenant of Yahweh’
  simplified_phrase: they will no longer say, “The ark of Yahweh’s covenant”
  preserved_meaning: People will stop using this quoted designation for the ark.
  reasoning_layer_used: Lexical decision for לֹא יֹאמְרוּ עוֹד and the ark construct phrase
  rationale: Keeping “say” and the quotation avoids broadening the claim to all discussion of the ark.
- pob_phrase: nor will it be made again
  simplified_phrase: and no replacement ark will be made
  preserved_meaning: The people will not construct another ark to replace it.
  reasoning_layer_used: Lexical decision for וְלֹא יֵעָשֶׂה עוֹד
  rationale: Naming the implied replacement makes the passive clause immediately clear.
interpretive_expansions:
- pob_phrase: nor will it be made again
  rendering: and no replacement ark will be made
  claim: The implicit object is an ark made to replace the former one.
  evidence:
  - The preceding clauses all refer to the ark.
  - The POB rationale identifies the ark as the implied subject.
  confidence: high
  alternatives_preserved:
  - nor will another one be made
