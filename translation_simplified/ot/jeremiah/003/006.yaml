  preserved_meaning: The LORD spoke to Jeremiah while Josiah was king.
  reasoning_layer_used: source text and POB base translation
  rationale: The modern phrase states the historical setting more directly.
- pob_phrase: She went up on every high hill and under every green tree
  simplified_phrase: She went to every high hill and under every leafy tree.
  preserved_meaning: Israel repeatedly visited the elevated and tree-shaded places associated with her unfaithfulness.
  reasoning_layer_used: source text and POB base translation
  rationale: The shorter sentence and familiar wording make the locations easier to picture.
- pob_phrase: there she prostituted herself
  simplified_phrase: There she worshiped other gods, as if she were prostituting herself.
  preserved_meaning: Israel’s idolatry is portrayed through the source image of prostitution.
  reasoning_layer_used: POB base translation, applied revision, and immediate context
  rationale: The wording explains the metaphor while preserving its force.
