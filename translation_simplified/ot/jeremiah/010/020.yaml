translation:
  language: en
  text: My tent has been destroyed, and all my ropes have been torn loose. My sons[a] have left me; they are gone. No one remains to pitch my tent again and raise its curtains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My sons” may mean literal children or may picture the people or inhabitants who have departed.
    reason: cultural_note
simplification_decisions:
- pob_phrase: all my ropes are torn away
  simplified_phrase: all my ropes have been torn loose
  preserved_meaning: The tent ropes have been forcibly detached.
  reasoning_layer_used: Lexical decision for נִתָּקוּ and the tent image
  rationale: “Torn loose” makes the damaged-tent picture easier to visualize.
- pob_phrase: My sons have gone from me, and they are no more
  simplified_phrase: My sons have left me; they are gone
  preserved_meaning: The sons have departed and are now absent without specifying death.
  reasoning_layer_used: Lexical decisions for יְצָאֻנִי and וְאֵינָם
  rationale: Two direct clauses express the loss naturally while preserving its ambiguity.
- pob_phrase: stretch out my tent again and set up my curtains
  simplified_phrase: pitch my tent again and raise its curtains
  preserved_meaning: Both actions are coordinated parts of erecting the ruined tent and its coverings.
  reasoning_layer_used: Lexical decisions for נֹטֶה, יְרִיעוֹתַי, and וּמֵקִים
  rationale: Ordinary tent-building language clarifies both coordinated restoration actions.
translation_notes:
  risk_flags:
  - risk: “My sons” may be mistaken as referring only to the speaker’s literal children.
    mitigation: The footnote preserves the possible figurative reference to the departed people or inhabitants.
