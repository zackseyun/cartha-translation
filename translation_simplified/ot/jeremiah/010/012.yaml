translation:
  language: en
  text: He made the earth through his power.[a] Through his wisdom he set the world firmly in place, and through his understanding he stretched out the heavens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He makes the earth through his power”; the Hebrew can describe either his creative act or his continuing work.
    reason: lexical_alternative
