translation:
  language: en
  text: How terrible for me because I am broken![a] My wound is severe. But I said, “Surely this is my sickness, and I must bear it.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “How terrible for me because of my injury.” The Hebrew image can refer to a fracture, injury, or wider ruin.
    reason: lexical_alternative
  - marker: b
    text: The last words may also be translated, “and I will bear it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Woe is me because of my brokenness
  simplified_phrase: How terrible for me because I am broken!
  preserved_meaning: The speaker cries out because of devastating harm while retaining the image of being broken.
  reasoning_layer_used: POB lexical decisions for אוי and שבר
  rationale: The wording makes the lament direct without intensifying it into total destruction.
- pob_phrase: my wound is grievous
  simplified_phrase: My wound is severe.
  preserved_meaning: The wound is serious without claiming that it is incurable.
  reasoning_layer_used: POB lexical decisions for נַחְלָה and מַכָּתִי
  rationale: “Severe” is clear modern English and preserves the POB’s restraint.
translation_notes:
  risk_flags:
  - risk: “Broken” may be heard only emotionally rather than as injury or wider ruin.
    mitigation: Footnote a preserves the physical-injury sense and the image’s broader range.
  - risk: “Must bear it” may emphasize necessity rather than future resolve.
    mitigation: Footnote b preserves the alternative “I will bear it.”
