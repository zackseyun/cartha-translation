translation:
  language: en
  text: For the shepherds[a] have lost all sense and do not seek Yahweh. So they fail to act wisely,[b] and their whole flock is scattered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The shepherds are a picture of the people’s leaders.
    reason: cultural_note
  - marker: b
    text: The Hebrew can also mean that they have failed to prosper; it links wise action with success.
    reason: lexical_alternative
