  reasoning_layer_used: Lexical decision for נִבְעֲרוּ
  rationale: The natural idiom keeps the prophetic rebuke without sounding childish.
- pob_phrase: and they have not sought Yahweh; therefore
  simplified_phrase: and do not seek Yahweh. So
  preserved_meaning: Their failure to seek Yahweh causes the result that follows.
  reasoning_layer_used: Lexical decisions for דָרַשׁ and עַל־כֵּן
  rationale: Two short sentences make the cause-and-result relationship immediate.
- pob_phrase: all their flock is scattered
  simplified_phrase: their whole flock is scattered
  preserved_meaning: Everyone entrusted to the shepherds’ care is dispersed.
  reasoning_layer_used: Lexical decisions for מַרְעִיתָם and נָפוֹצָה
  rationale: “Whole flock” is more natural while preserving the shepherd image and total scope.
