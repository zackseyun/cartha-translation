simplification_decisions:
- pob_phrase: For thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words introduce a direct declaration from Yahweh.
  reasoning_layer_used: POB translation and divine-name lexical decision
  rationale: The common English formula keeps Yahweh as the speaker without the archaic “thus.”
- pob_phrase: Behold, I am slinging out the inhabitants of the land at this time
  simplified_phrase: Look! This time I am slinging the people out of the land
  preserved_meaning: Yahweh emphatically announces the forceful expulsion of the land’s people on this occasion.
  reasoning_layer_used: Lexical decisions for הִנְנִי, קוֹלֵעַ, יוֹשְׁבֵי הָאָרֶץ, and בַּפַּעַם הַזֹּאת
  rationale: The rewrite uses familiar wording while retaining the vivid sling image and the contextual scope of the land.
- pob_phrase: I will press them hard so that they may be found
  simplified_phrase: I will press them hard so that they may be found
  preserved_meaning: Yahweh will subject them to severe constricting distress, while the purpose clause remains unresolved.
  reasoning_layer_used: Lexical and theological decisions for וַהֲצֵרוֹתִי and לְמַעַן יִמְצָאוּ
  rationale: These words remain because simpler paraphrases would weaken the pressure image or falsely settle the difficult final clause.
