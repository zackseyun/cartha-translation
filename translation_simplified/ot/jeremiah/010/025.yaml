  rationale: “Family groups” makes the social-unit meaning of “clans” immediately clear.
- pob_phrase: for they have devoured Jacob, they have devoured him and consumed him
  simplified_phrase: They have devoured Jacob—devoured him and consumed him completely.
  preserved_meaning: The violent image, repetition, and escalating destruction remain intact.
