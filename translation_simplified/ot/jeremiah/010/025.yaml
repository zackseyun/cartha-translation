translation:
  language: en
  text: Pour out your wrath on the nations that do not know you and on the family groups that do not call on your name. They have devoured Jacob—devoured him and consumed him completely. They have left his pasture desolate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his home” or “his dwelling place.”
