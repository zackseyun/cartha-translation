translation:
  language: en
  text: When he speaks, waters roar in the heavens. He makes clouds rise from the ends of the earth. He makes lightning for the rain and brings the wind out of his storehouses.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: At the sound of his voice, there is a roar of waters in the heavens
  simplified_phrase: When he speaks, waters roar in the heavens
  preserved_meaning: God's voice personally causes the heavenly waters to roar.
  reasoning_layer_used: Lexical decisions for לְקוֹל, תִּתּוֹ, and הֲמוֹן מַיִם; theological decision on divine agency
  rationale: The active clause states the compressed Hebrew idiom in direct, natural English.
- pob_phrase: and he makes clouds rise from the ends of the earth
  simplified_phrase: He makes clouds rise from the ends of the earth
  preserved_meaning: God causes storm clouds to rise from the world's farthest reaches.
  reasoning_layer_used: Lexical decisions for וַיַּעֲלֶה, נְשִׂאִים, and מִקְצֵה אֶרֶץ
  rationale: A new sentence makes the weather sequence easier to follow without weakening God's agency.
- pob_phrase: he makes lightning for the rain, and brings out the wind from his storehouses
  simplified_phrase: He makes lightning for the rain and brings the wind out of his storehouses
  preserved_meaning: God actively governs lightning, rain, and wind while the source image of storehouses remains intact.
  reasoning_layer_used: Lexical decisions for בְּרָקִים לַמָּטָר עָשָׂה, וַיּוֹצֵא רוּחַ, and מֵאֹצְרֹתָיו
  rationale: The wording stays simple while preserving the Hebrew's uncertain lightning-rain relation and concrete storehouse image.
translation_notes:
  risk_flags:
  - risk: “When he speaks” is less formally tied to the audible phrase “the sound of his voice.”
    mitigation: It preserves the audited idiomatic sense and the personal force of divine speech.
  - risk: Modern readers may take the storehouses as literal buildings.
    mitigation: The image is retained because it portrays God's control of the wind and is central to the source wording.
