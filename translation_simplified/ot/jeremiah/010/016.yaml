translation:
  language: en
  text: Jacob’s portion—his God—is nothing like these idols. He formed everything, and Israel is his inheritance, the tribe that belongs to him. His name is Yahweh of hosts.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and may include both heavenly and earthly forces.
    reason: simplification_note
  - marker: b
    text: The Hebrew word translated “tribe” can also mean “rod” or “scepter.”
    reason: alternative_reading
