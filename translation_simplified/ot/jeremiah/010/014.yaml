translation:
  language: en
  text: Every person is senseless and lacks knowledge. Every metalworker is disgraced by the idol he makes, because the idol he casts is a lie. There is no breath[a] in these idols—they are not alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “breath” can also mean “spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Every man is stupid, without knowledge
  simplified_phrase: Every person is senseless and lacks knowledge
  preserved_meaning: The charge applies distributively to humanity in the idolatry context and describes profound ignorance.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Every person” makes the generic sense clear, while “senseless” preserves the force without sounding casually insulting.
- pob_phrase: every metalworker is put to shame by his idol
  simplified_phrase: Every metalworker is disgraced by the idol he makes
  preserved_meaning: The craftsman is exposed to shame by his own manufactured idol.
  reasoning_layer_used: Lexical decision for הֹבִישׁ and מִפָּסֶל
  rationale: “Disgraced” and “the idol he makes” state the relationship in direct modern English.
- pob_phrase: for his cast image is a lie, and there is no breath in them
  simplified_phrase: because the idol he casts is a lie. There is no breath in these idols—they are not alive.
  preserved_meaning: Cast idols are fraudulent and lifeless objects.
  reasoning_layer_used: Lexical decisions for שֶׁקֶר, נִסְכּוֹ, and רוּחַ
  rationale: Two sentences clarify the shift from one image to idols collectively while retaining the concrete image of breath.
interpretive_expansions:
- pob_phrase: his idol
  rendering: the idol he makes
  claim: The idol is the metalworker’s own product.
  evidence:
  - The possessive relation and artisan context identify the idol as his work.
  confidence: high
- pob_phrase: there is no breath in them
  rendering: There is no breath in these idols—they are not alive.
  claim: The absence of breath means that the idols are lifeless.
  evidence:
  - The POB lexical rationale explicitly identifies absence of life as the point.
  confidence: high
  alternatives_preserved:
  - spirit
