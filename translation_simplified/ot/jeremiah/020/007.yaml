translation:
  language: en
  text: Yahweh, you persuaded me, and I gave in. You were too strong for me, and you won. I have become a laughingstock all day long; everyone mocks me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first sentence may also be translated, “Yahweh, you deceived me, and I was deceived.” The Hebrew can mean persuade, entice, or deceive, and Jeremiah’s lament is deliberately forceful.
    reason: alternative_reading
