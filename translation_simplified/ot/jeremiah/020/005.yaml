translation:
  language: en
  text: I will hand over to their enemies all the wealth of this city—all it has gained, all its precious possessions, and all the treasures of Judah’s kings. They will plunder these things, take them, and bring them to Babylon.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: give ... into the hand of their enemies
  simplified_phrase: hand over to their enemies
  preserved_meaning: God will place the city’s wealth under enemy control.
  reasoning_layer_used: POB lexical decision for בְּיַד
  rationale: The common English idiom states the same transfer of control clearly.
- pob_phrase: all its gains
  simplified_phrase: all it has gained
  preserved_meaning: The accumulated results of the city’s labor will be surrendered as spoil.
  reasoning_layer_used: POB lexical decision for יְגִיעָהּ and doctrine realignment
  rationale: The verbal form makes “gains” easier to understand without changing it to the rejected “produce.”
- pob_phrase: all its precious things
  simplified_phrase: all its precious possessions
  preserved_meaning: The city’s costly and valuable objects are included.
  reasoning_layer_used: POB lexical decision for יְקָרָהּ
  rationale: “Possessions” makes the concrete confiscable sense clear without over-specifying the items.
translation_notes:
  risk_flags:
  - risk: “Their enemies” may have a slightly unclear antecedent in English.
    mitigation: Keeping the pronoun preserves the POB’s deliberate refusal to over-resolve whether it points specifically to Judah’s kings or more broadly to the city.
  - risk: “All it has gained” foregrounds the fruit of labor rather than labor itself.
    mitigation: This follows the POB’s controlling contextual decision that accumulated gains are being taken as spoil.
