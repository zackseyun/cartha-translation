translation:
  language: en
  text: But Yahweh is with me like a mighty warrior. So those who persecute me will stumble and fail. They will be completely put to shame because they have acted foolishly.[a] Their disgrace will last forever and will never be forgotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because they have not understood” or “because they have not acted with insight.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: therefore my persecutors will stumble and will not prevail
  simplified_phrase: So those who persecute me will stumble and fail
  preserved_meaning: Yahweh’s presence ensures that Jeremiah’s hostile opponents will not succeed.
  reasoning_layer_used: Lexical decisions for עַל כֵּן, רֹדְפַי, יִכָּשְׁלוּ, and יֻכָלוּ
  rationale: The rewrite uses ordinary clause order while preserving the stumbling image and the opponents’ failure.
- pob_phrase: They will be utterly ashamed, because they have not acted wisely
  simplified_phrase: They will be completely put to shame because they have acted foolishly
  preserved_meaning: Their unwise conduct results in severe public shame.
  reasoning_layer_used: Lexical decisions for בֹּשׁו מְאֹד and לֹא הִשְׂכִּילוּ
  rationale: The positive opposite “acted foolishly” makes the causal meaning immediate without removing the lexical alternatives.
- pob_phrase: their everlasting disgrace will not be forgotten
  simplified_phrase: Their disgrace will last forever and will never be forgotten
  preserved_meaning: Their disgrace is enduring and remains in memory.
  reasoning_layer_used: Lexical decisions for כְּלִמַּת עוֹלָם and לֹא תִשָּׁכֵחַ
  rationale: Splitting duration from remembrance makes both source ideas easier to grasp.
