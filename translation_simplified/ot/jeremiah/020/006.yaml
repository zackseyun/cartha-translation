translation:
  language: en
  text: You, Pashhur, and everyone who lives in your house will be taken away as captives. You will go to Babylon. There you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “to whom you prophesied lies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will go into captivity
  simplified_phrase: will be taken away as captives
  preserved_meaning: They will be forcibly taken captive, not merely relocated.
  reasoning_layer_used: POB lexical decision for תֵּלְכוּ בַּשֶּׁבִי
  rationale: The concrete wording makes captivity immediately understandable while preserving its force.
- pob_phrase: and you will come to Babylon
  simplified_phrase: You will go to Babylon.
  preserved_meaning: Pashhur will be taken to Babylon as the destination of his captivity.
  reasoning_layer_used: POB lexical alternatives and immediate context
  rationale: “Go to Babylon” is natural from the hearer's viewpoint and remains an approved lexical alternative.
- pob_phrase: and there you will die, and there you will be buried
  simplified_phrase: There you will die, and there you will be buried
  preserved_meaning: Babylon is emphatically the place of both Pashhur's death and burial.
  reasoning_layer_used: POB lexical decision for the repeated שָׁם
  rationale: A new sentence eases the structure while retaining the emphatic repetition of “there.”
translation_notes:
  risk_flags:
  - risk: “Taken away as captives” states the forced removal more directly than the POB idiom.
    mitigation: The lexical rationale says the Hebrew emphasizes being taken captive rather than mere relocation.
  - risk: “Go to Babylon” does not formally preserve the Hebrew verb “come.”
    mitigation: POB lists this as an acceptable alternative, and it is clearer in ordinary English.
