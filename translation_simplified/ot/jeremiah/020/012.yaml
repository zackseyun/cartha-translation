translation:
  language: en
  text: But you, Yahweh of Armies, test righteous people. You see the kidneys and the heart.[a] Let me see you take vengeance on them, because I have revealed my case to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The kidneys and the heart picture a person’s deepest thoughts, motives, and affections.
    reason: cultural_note
simplification_decisions:
- pob_phrase: who test the righteous, who see the kidneys and the heart
  simplified_phrase: test righteous people. You see the kidneys and the heart.
  preserved_meaning: Yahweh continually examines righteous people and sees their deepest inner life.
  reasoning_layer_used: Lexical decisions and theological decision on anthropological imagery
  rationale: Two direct sentences clarify the parallel actions while retaining the Hebrew body image.
- pob_phrase: let me see your vengeance on them
  simplified_phrase: Let me see you take vengeance on them
  preserved_meaning: Jeremiah asks to witness Yahweh’s vengeance against his opponents.
  reasoning_layer_used: Lexical decision for נִקְמָתְךָ
  rationale: The verbal wording is more natural while preserving the force of vengeance.
- pob_phrase: for to you I have revealed my case
  simplified_phrase: because I have revealed my case to you
  preserved_meaning: Jeremiah has disclosed his legal case to Yahweh as the basis of his request.
  reasoning_layer_used: Lexical decisions for כִּי, גִּלִּיתִי, אֵלֶיךָ, and רִיבִי
  rationale: The ordinary clause order stays direct and avoids adding a spatial nuance.
