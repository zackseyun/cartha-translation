  preserved_meaning: Yahweh's completed act of saving is the stated reason for praising him.
  reasoning_layer_used: Lexical decisions for כִּי and הִצִּיל
  rationale: “Because” states the causal link plainly, and “rescued” is common modern English.
- pob_phrase: the life of the poor
  simplified_phrase: a poor person's life
  preserved_meaning: The endangered life of a needy person is in view, not specifically an immaterial soul.
  reasoning_layer_used: Lexical and theological decisions for נֶפֶשׁ and אֶבְיוֹן
  rationale: The representative singular is expressed in natural modern English while retaining “life.”
- pob_phrase: from the hand of evildoers
  simplified_phrase: from the grip of evildoers
  preserved_meaning: Yahweh frees the poor person from the hostile control of people who do evil.
  reasoning_layer_used: Lexical decision for מִיַּד
  rationale: “Grip” makes hostile control clear while preserving a physical image.
