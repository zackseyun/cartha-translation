translation:
  language: en
  text: I hear many people whispering, “Terror on every side!” They say, “Report him,[a] and we will report him!” All the men who were on friendly terms with me are watching for me to stumble.[b] They say, “Perhaps he will be deceived, and we will overcome him. Then we will take our vengeance on him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Denounce him!” The Hebrew word means “tell,” “report,” or “declare,” but here it may refer to a hostile accusation.
    reason: lexical_alternative
  - marker: b
    text: Literally “watching my limp” or “watching my side”; the image suggests watching for weakness, a misstep, or a fall.
    reason: lexical_alternative
