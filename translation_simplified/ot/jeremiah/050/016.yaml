translation:
  language: en
  text: Remove from Babylon all who plant seed and all who reap the harvest with a sickle. Because of the oppressor’s sword,[a] each man will return to his own people and flee to his own land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sword of the oppressing one.” Some understand the Hebrew as “the cruel sword,” or, less likely, “the sword of the dove.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Cut off from Babylon the sower
  simplified_phrase: Remove from Babylon all who plant seed
  preserved_meaning: The command calls for those who sow in Babylon to be eliminated or removed.
  reasoning_layer_used: Lexical decision for כרת and זוֹרֵעַ
  rationale: “Remove” and “all who plant seed” make the command and occupation immediately clear without specifying the means.
- pob_phrase: the one who handles the sickle at the time of harvest
  simplified_phrase: all who reap the harvest with a sickle
  preserved_meaning: Harvest workers using sickles are also to be removed from Babylon.
  reasoning_layer_used: Lexical decisions for תֹפֵשׂ מַגָּל and בְּעֵת קָצִיר
  rationale: The active wording explains what handling a sickle at harvest means.
- pob_phrase: will turn to his own people
  simplified_phrase: will return to his own people
  preserved_meaning: Each man will turn back toward his people in retreat.
  reasoning_layer_used: Lexical decision for יִפְנוּ
  rationale: “Return” expresses the contextual direction of the turning in natural English.
