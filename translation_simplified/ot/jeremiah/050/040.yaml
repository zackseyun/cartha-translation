translation:
  language: en
  text: “Just as God overthrew Sodom, Gomorrah, and the towns around them,” declares Yahweh, “no man will live there, and no son of man will make his home in her.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “son of man” means a human being.
    reason: lexical_alternative
