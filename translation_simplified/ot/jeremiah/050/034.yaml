translation:
  language: en
  text: Their Redeemer is strong.[a] His name is Yahweh of Armies. He will certainly plead their case, to bring rest to the earth[b] and turmoil to the people who live in Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redeemer was someone who rescued or defended another person, often as a relative with a duty to help.
    reason: simplification_note
  - marker: b
    text: The Hebrew may also mean “the land.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Their Redeemer is strong; Yahweh of Armies is his name
  simplified_phrase: Their Redeemer is strong. His name is Yahweh of Armies.
  preserved_meaning: Their powerful rescuer and defender is Yahweh, the God who commands armies.
  reasoning_layer_used: POB lexical decisions for גֹּאֲלָם, חָזָק, and the divine title
  rationale: Two short sentences make the titles easier to follow while preserving their force.
- pob_phrase: He will surely plead their case
  simplified_phrase: He will certainly plead their case
  preserved_meaning: Yahweh will emphatically and actively contend for them in a legal dispute.
  reasoning_layer_used: POB lexical rationale for רִיב יָרִיב אֶת רִיבָם and grounding review
  rationale: “Plead their case” keeps the active legal image, while “certainly” carries the Hebrew emphasis.
- pob_phrase: give rest to the earth and bring unrest to the inhabitants of Babylon
  simplified_phrase: bring rest to the earth and turmoil to the people who live in Babylon
  preserved_meaning: His action will relieve the earth while disturbing Babylon’s population.
  reasoning_layer_used: POB lexical decisions and theological decision on הָאָרֶץ
  rationale: Common wording clarifies Babylon’s inhabitants and sharpens the contrast between rest and turmoil.
