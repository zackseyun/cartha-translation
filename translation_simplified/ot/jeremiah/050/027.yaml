translation:
  language: en
  text: Kill all her bulls![a] Let them go down to be slaughtered. Woe to them! Their day has come—the time when they will be punished.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bulls” is a prophetic image for Babylon’s powerful men.
    reason: simplification_note
  - marker: b
    text: Or “the time when they will be called to account.” The Hebrew term can also be translated “visitation,” but here it refers to punishment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Slay all her bulls
  simplified_phrase: Kill all her bulls
  preserved_meaning: The attackers are commanded to kill those pictured as Babylon’s bulls.
  reasoning_layer_used: Lexical decision for חִרְבוּ and פָּרֶיהָ
  rationale: “Kill” is more familiar than “slay,” while the source’s bull image remains intact.
- pob_phrase: let them go down to the slaughter
  simplified_phrase: Let them go down to be slaughtered
  preserved_meaning: The bulls are sent downward toward violent death.
  reasoning_layer_used: Lexical decision for יֵרְדוּ לַטָּבַח
  rationale: The infinitive wording is easier to follow and preserves both the downward movement and slaughter.
- pob_phrase: the time of their punishment
  simplified_phrase: the time when they will be punished
  preserved_meaning: Their appointed time of punitive judgment has arrived.
  reasoning_layer_used: Lexical and theological decisions for פְּקֻדָּה
  rationale: A verbal clause states the same judgment in more natural common English.
translation_notes:
  risk_flags:
