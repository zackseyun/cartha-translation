translation:
  language: en
  text: Because of Yahweh’s wrath, no one will live in Babylon. The whole city will become a wasteland. Everyone who passes by will be appalled and will hiss[a] at all her wounds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whistle”; the Hebrew can describe either sound, probably as an expression of scorn at Babylon’s ruin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it will not be inhabited
  simplified_phrase: no one will live in Babylon
  preserved_meaning: Babylon will have no inhabitants because of Yahweh’s judgment.
  reasoning_layer_used: Lexical decision for לֹא תֵשֵׁב and the immediate context.
  rationale: The active wording is easier to understand while preserving the city’s total loss of inhabitants.
- pob_phrase: will become a complete desolation
  simplified_phrase: The whole city will become a wasteland
  preserved_meaning: Babylon’s devastation will be total rather than partial.
  reasoning_layer_used: Lexical decisions for שְׁמָמָה and כֻּלָּהּ.
  rationale: “Whole city” carries the intensifier, while “wasteland” makes the result concrete.
- pob_phrase: Everyone who passes by Babylon
  simplified_phrase: Everyone who passes by
  preserved_meaning: People passing the ruined city will react to what happened to Babylon.
  reasoning_layer_used: Immediate context and the lexical decision for the passing-by idiom.
  rationale: The previous sentence names Babylon, so repeating the name is unnecessary.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize hissing as a response of scorn.
    mitigation: The footnote preserves the alternate sound and explains its likely force.
  - risk: “Her wounds” personifies Babylon and may sound unusual.
    mitigation: The image is retained because it vividly presents the city’s devastation as inflicted wounds.
