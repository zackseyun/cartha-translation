translation:
  language: en
  text: So listen to Yahweh’s plan against Babylon and to the thoughts he has formed against the land of the Chaldeans. Surely the smallest of the flock will drag them away.[a] Surely he will make their pasture desolate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “smallest of the flock” may refer to the weakest or least significant of Babylon’s attackers.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “pasture” can also mean “home” or “dwelling place.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore hear the counsel of Yahweh that he has planned against Babylon
  simplified_phrase: So listen to Yahweh’s plan against Babylon
  preserved_meaning: The prophetic summons directs the audience to Yahweh’s deliberate plan of judgment.
  reasoning_layer_used: Lexical decisions for לָכֵן, שִׁמְעוּ, and עֲצַת יְהוָה
  rationale: The shorter wording expresses attentive listening and deliberate purpose in ordinary English.
- pob_phrase: his thoughts that he has devised
  simplified_phrase: the thoughts he has formed
  preserved_meaning: Yahweh has deliberately shaped his intentions against the land.
  reasoning_layer_used: Doctrine realignment and lexical decisions for מַחְשְׁבוֹתָיו and חָשַׁב
  rationale: “Thoughts” remains distinct from “plan,” while “formed” is clearer than “devised.”
- pob_phrase: the little ones of the flock
  simplified_phrase: the smallest of the flock
  preserved_meaning: The flock image remains while indicating low status or weakness without identifying the attackers explicitly.
  reasoning_layer_used: Theological decision to preserve the metaphor and lexical alternative for צְעִירֵי הַצֹּאן
  rationale: “Smallest” makes the likely comparative sense clearer without flattening the metaphor.
