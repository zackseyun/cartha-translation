translation:
  language: en
  text: Look! Like a lion, he comes out of the Jordan thickets and advances on a secure pasture. In an instant I will make them flee from it, and I will appoint whoever is chosen over it. Who is like me? Who can summon me to account?[a] What shepherd can stand against me?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who can appoint a time for me?” The Hebrew may refer to summoning someone or setting a time to meet.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he comes up from the thicket of the Jordan against a secure pasture
  simplified_phrase: he comes out of the Jordan thickets and advances on a secure pasture
  preserved_meaning: The lion emerges from the Jordan’s dense growth and moves threateningly toward protected grazing land.
  reasoning_layer_used: Lexical decisions for יַעֲלֶה, מִגְּאוֹן הַיַּרְדֵּן, and אֶל נְוֵה אֵיתָן
  rationale: Ordinary motion verbs make the vivid lion image immediately understandable.
- pob_phrase: for in an instant I will make them run from it
  simplified_phrase: In an instant I will make them flee from it
  preserved_meaning: God will suddenly force the occupants away from the pasture.
  reasoning_layer_used: Lexical decisions for כִּי אַרְגִּעָה, ארוצם, and מֵעָלֶיהָ
  rationale: “Flee” clearly expresses compelled running without weakening the sudden action.
- pob_phrase: What shepherd can stand before me?
  simplified_phrase: What shepherd can stand against me?
  preserved_meaning: No ruler pictured as a shepherd can successfully withstand God.
  reasoning_layer_used: Lexical rationale for וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  rationale: “Stand against” communicates the idiom’s force while retaining the shepherd image.
