translation:
  language: en
  text: Your mother[a] will be completely ashamed. The one who gave birth to you will be disgraced. Look, she will be last among the nations[b]—a wilderness, a dry land, and a desert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mother” is a poetic picture of Babylon as the mother of its people.
    reason: simplification_note
  - marker: b
    text: Or “the least of the nations”; the Hebrew can describe Babylon’s final, reduced status.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Your mother will be utterly ashamed; she who gave birth to you will be disgraced.
  simplified_phrase: Your mother will be completely ashamed. The one who gave birth to you will be disgraced.
  preserved_meaning: Babylon’s future shame is expressed through the repeated maternal image and two distinct shame terms.
  reasoning_layer_used: Lexical and theological decisions on the maternal metaphor, prophetic perfects, and shame verbs.
  rationale: Two short sentences make the poetic parallel clear without removing either statement.
- pob_phrase: Behold, she will be the last of the nations
  simplified_phrase: Look, she will be last among the nations
  preserved_meaning: The reader is called to notice Babylon’s future reduced status among other nations.
  reasoning_layer_used: Lexical decisions for הִנֵּה and אַחֲרִית גּוֹיִם.
  rationale: “Look” and “among” express the announcement in direct, natural English.
- pob_phrase: a wilderness, a dry land, and a desert
  simplified_phrase: a wilderness, a dry land, and a desert
  preserved_meaning: The three-part picture presents Babylon as utterly desolate and arid.
  reasoning_layer_used: Lexical decisions distinguishing מִדְבָּר, צִיָּה, and עֲרָבָה.
  rationale: The concrete three-part image is already clear and must not be compressed.
translation_notes:
  risk_flags:
  - risk: Modern readers may not realize that “mother” refers poetically to Babylon.
    mitigation: A brief footnote explains the referent while preserving the metaphor in the text.
  - risk: “Last” may be read only as sequence rather than reduced rank or condition.
    mitigation: The lexical alternative and reduced-status sense are retained in a footnote.
