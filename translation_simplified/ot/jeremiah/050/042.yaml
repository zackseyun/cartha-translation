- pob_phrase: They seize bow and javelin
  simplified_phrase: They take up bows and javelins
  preserved_meaning: The invading soldiers grasp their weapons in readiness.
  reasoning_layer_used: Lexical decisions for קֶשֶׁת, כִידֹן, and יַחֲזִיקוּ
  rationale: Natural English plurals clarify that the whole invading force carries these weapons.
- pob_phrase: Their sound roars like the sea
  simplified_phrase: The sound they make roars like the sea
  preserved_meaning: The army's noise is compared to the roar of the sea.
  reasoning_layer_used: Lexical decision for קוֹלָם and כַיָּם יֶהֱמֶה
  rationale: The fuller clause makes the source of the sound immediately clear while retaining the sea image.
- pob_phrase: arrayed like a man for battle against you
  simplified_phrase: prepared like a man going into battle against you
  preserved_meaning: The mounted force is organized and ready to attack Babylon, with the masculine singular simile retained.
  reasoning_layer_used: Lexical and theological decisions for עָרוּךְ כְּאִישׁ לַמִּלְחָמָה
  rationale: “Prepared” and “going into battle” explain the military posture without replacing the documented simile.
