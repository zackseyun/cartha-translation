translation:
  language: en
  text: They take up bows and javelins. They are cruel and will show no mercy. The sound they make roars like the sea. They ride horses, prepared like a man[a] going into battle against you, daughter Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like one man,” emphasizing that the army moves together as one force.
    reason: lexical_alternative
