  preserved_meaning: Chaldea will be turned into something its conquerors seize and carry off.
  reasoning_layer_used: Lexical decision for לְשָׁלָל
  rationale: “Loot” is common English that preserves the military-plunder image.
- pob_phrase: all who plunder her
  simplified_phrase: Everyone who plunders the land
  preserved_meaning: Every attacker who loots Chaldea is included.
  reasoning_layer_used: Lexical decision for כַשְׂדִּים and its feminine suffix
  rationale: “The land” clearly identifies Chaldea as the object of the plundering.
- pob_phrase: will have their fill
  simplified_phrase: will have their fill
  preserved_meaning: The plunderers will gain enough loot to be fully satisfied.
  reasoning_layer_used: Lexical decision for יִשְׂבָּעוּ and grounding review
  rationale: The retained fullness idiom is clear and avoids implying they obtain everything they desire.
