translation:
  language: en
  text: Therefore, desert creatures will live there with hyenas[a], and ostriches[b] will make their home in her[c]. She will remain without human inhabitants forever. No one will live in her for generation after generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer to hyenas, jackals, or other howling creatures of the ruins.
    reason: lexical_alternative
  - marker: b
    text: Literally, “daughters of the ostrich,” an expression meaning ostriches. Older English versions sometimes translate it as “owls.”
    reason: lexical_alternative
  - marker: c
    text: Babylon is spoken of as a woman, so the verse refers to the city as “her.”
    reason: cultural_note
