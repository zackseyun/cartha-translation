translation:
  language: en
  text: The arrogant one will stumble and fall,[a] and no one will help him back up. I will set his cities on fire,[b] and the fire will consume everything around him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pride” or “insolence.” Here the Hebrew presents Babylon’s arrogance as a person who falls.
    reason: lexical_alternative
  - marker: b
    text: Babylon is pictured as a man, so the Hebrew says “his cities.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: with no one to raise him up
  simplified_phrase: and no one will help him back up
  preserved_meaning: No one will cause the fallen figure to rise again.
  reasoning_layer_used: Lexical decision for מֵקִים
  rationale: “Help him back up” makes the falling image immediately clear without turning it into political restoration.
- pob_phrase: I will kindle a fire in his cities
  simplified_phrase: I will set his cities on fire
  preserved_meaning: God will ignite a destructive fire in Babylon’s cities.
  reasoning_layer_used: Lexical decisions for הִצַּתִּי אֵשׁ and בְּעָרָיו
  rationale: The direct English expression preserves both the fire image and Babylon’s masculine personification.
- pob_phrase: it will consume all around him
  simplified_phrase: the fire will consume everything around him
  preserved_meaning: The fire will destroy the entirety of what surrounds the personified Babylon.
  reasoning_layer_used: Lexical decisions for וְאָכְלָה and כָּל סְבִיבֹתָיו
  rationale: Naming the fire and saying “everything” removes unclear pronoun reference while retaining the total scope.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize that “the arrogant one” and “him” refer to personified Babylon.
    mitigation: Footnotes explain both the lexical ambiguity and the masculine personification.
