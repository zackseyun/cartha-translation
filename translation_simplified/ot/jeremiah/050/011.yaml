translation:
  language: en
  text: Though[a] you rejoice and celebrate, you who plunder my inheritance,[b] though you romp like a young cow treading grain and neigh like stallions,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “Because,” but “Though” fits the taunt leading into the judgment that follows.
    reason: lexical_alternative
  - marker: b
    text: “My inheritance” refers to the people and/or land that belong to the LORD; it may also be translated “my heritage.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you exult
  simplified_phrase: you celebrate
  preserved_meaning: The second verb still expresses open, exuberant joy alongside rejoicing.
  reasoning_layer_used: lexical decision for תעלזי
  rationale: “Celebrate” is more familiar than “exult” while keeping the intensified joy.
- pob_phrase: you frolic like a threshing heifer
  simplified_phrase: you romp like a young cow treading grain
  preserved_meaning: The mocking image of lively, unrestrained movement during threshing remains intact.
  reasoning_layer_used: lexical decisions for תפושי and כְּעֶגְלָה דָשָׁה
  rationale: The expanded agricultural action makes the ancient image understandable at first reading.
- pob_phrase: plunderers of my inheritance
  simplified_phrase: you who plunder my inheritance
  preserved_meaning: Babylon is still directly accused of despoiling what belongs covenantally to God.
  reasoning_layer_used: lexical and theological decisions for שֹׁסֵי נַחֲלָתִי and the addressee
  rationale: A direct relative clause is easier to follow than the compressed vocative.
