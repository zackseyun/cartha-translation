  text: A sword is coming against Babylon’s diviners,[a] and they will become fools. A sword is coming against her warriors, and they will be terrified.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diviners claimed to predict the future; the Hebrew can also mean “liars” or “deceivers.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “they will be shattered” or “broken down.”
    reason: lexical_alternative
