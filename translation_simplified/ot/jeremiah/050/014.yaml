translation:
  language: en
  text: All you who bend the bow, take your battle positions all around Babylon. Shoot at her. Do not hold back a single arrow, because she has sinned against Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Draw up against Babylon all around
  simplified_phrase: take your battle positions all around Babylon
  preserved_meaning: The attacking forces are ordered to form battle lines that encircle Babylon.
  reasoning_layer_used: The lexical decision identifies a military command to take battle positions and preserves the encirclement expressed by “all around.”
  rationale: This replaces the less familiar military phrase “draw up” with an immediately clear command.
- pob_phrase: do not spare an arrow
  simplified_phrase: Do not hold back a single arrow
  preserved_meaning: The archers must not conserve their arrows or refrain from the attack.
  reasoning_layer_used: The lexical rationale explains that the singular arrow has a collective force and means not to conserve ammunition.
  rationale: “A single arrow” makes the emphatic force natural in modern English.
- pob_phrase: for she has sinned against Yahweh
  simplified_phrase: because she has sinned against Yahweh
  preserved_meaning: Babylon’s sin against Yahweh is the reason given for her judgment.
  reasoning_layer_used: The theological decisions retain Yahweh’s covenant name and identify him as the one against whom Babylon sinned.
  rationale: “Because” states the causal connection more plainly than “for.”
