translation:
  language: en
  text: So her young men will fall in her streets. On that day, all her warriors will be silenced.[a] This is what Yahweh declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will perish.” The Hebrew can describe being silenced or being stilled in death.
