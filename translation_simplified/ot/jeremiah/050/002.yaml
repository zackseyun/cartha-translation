translation:
  language: en
  text: Announce this among the nations! Make it known! Raise a banner. Proclaim the news; do not hide it. Say, “Babylon has been captured. Bel has been put to shame. Merodach[a] has been shattered.[b] Her images have been put to shame, and her idols[c] have been shattered.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merodach is the Hebrew form of the Babylonian god more commonly known as Marduk.
    reason: cultural_note
  - marker: b
    text: The Hebrew word rendered “shattered” here and at the end may also mean “dismayed.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term for “idols” is strongly contemptuous, suggesting something filthy or repulsive.
    reason: lexical_alternative
