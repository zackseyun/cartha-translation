  preserved_meaning: The message must be publicly announced to foreign nations.
  reasoning_layer_used: Lexical decisions for נגד, גּוֹיִם, and שמע
  rationale: Common verbs preserve the international, public-announcement force.
- pob_phrase: Proclaim; do not hide it
  simplified_phrase: Proclaim the news; do not hide it
  preserved_meaning: The report must be spread openly rather than suppressed.
  reasoning_layer_used: Lexical decision for כחד and immediate context
  rationale: “The news” supplies the clear contextual object without changing the command.
- pob_phrase: Babylon is captured
