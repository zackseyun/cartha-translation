translation:
  language: en
  text: “In those days, at that time,” declares the LORD, “when people search for Israel’s guilt, they will find none. When they look for Judah’s sins, none will be found, because I will forgive those I leave as a remnant.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the guilt of Israel will be sought, but there will be none
  simplified_phrase: when people search for Israel’s guilt, they will find none
  preserved_meaning: Israel’s guilt will no longer be found because the LORD forgives it.
  reasoning_layer_used: POB translation and applied revision
  rationale: Active wording clarifies the search while retaining POB’s chosen term “guilt.”
- pob_phrase: the sins of Judah, but they will not be found
  simplified_phrase: When they look for Judah’s sins, none will be found
  preserved_meaning: Judah’s sins will be sought but will not be found.
  reasoning_layer_used: POB translation and source parallelism
  rationale: A complete parallel sentence makes the thought easier to follow.
- pob_phrase: those whom I leave as a remnant
  simplified_phrase: those I leave as a remnant
  preserved_meaning: The LORD forgives the people whom he leaves as a remnant.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording removes an unnecessary relative pronoun without changing the LORD’s stated action.
translation_notes:
  risk_flags:
  - risk: “Find none” could imply that Israel and Judah never sinned.
    mitigation: The forgiveness clause explains why their guilt and sins cannot be found.
