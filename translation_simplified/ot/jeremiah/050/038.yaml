    text: The Hebrew word translated “sword” can also mean “drought,” perhaps deliberately suggesting both kinds of judgment.
    reason: alternative_reading
  - marker: b
    text: “Terrifying things” may refer specifically to dreadful idols.
    reason: lexical_alternative
