simplification_decisions:
- pob_phrase: the strongholds
  simplified_phrase: the fortresses
  preserved_meaning: The fortified military places have fallen to the enemy.
  reasoning_layer_used: The lexical decision identifies fortified places without linking them specifically to Kerioth.
  rationale: “Fortresses” gives common readers a more concrete military image.
- pob_phrase: the heart of Moab’s warriors will be
  simplified_phrase: Moab’s warriors will be as terrified
  preserved_meaning: The warriors will lose their courage and experience intense fear.
  reasoning_layer_used: The lexical rationale says “heart” denotes inner disposition, courage, or resolve here.
  rationale: The implied emotion is stated directly in ordinary English.
- pob_phrase: like the heart of a woman in labor
  simplified_phrase: as terrified as a woman in labor
  preserved_meaning: The labor image portrays the warriors’ intense fear and distress.
  reasoning_layer_used: The lexical rationale identifies labor as a simile of intense fear and distress.
  rationale: The sentence keeps the forceful labor image while clarifying the comparison.
