translation:
  language: en
  text: Kerioth[a] has been captured, and the fortresses have been seized. On that day, Moab’s warriors will be as terrified as a woman in labor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “The cities have been captured,” if the Hebrew is understood as a common noun rather than the place name Kerioth.
