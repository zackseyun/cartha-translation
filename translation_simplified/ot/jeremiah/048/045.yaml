  text: In Heshbon’s shadow, the fleeing people stand with no strength left, for a fire has come out from Heshbon and a flame from the midst of Sihon.[a] It has devoured Moab’s edge[b] and the tops of the heads of the people of uproar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sihon” may refer to the city or realm once associated with him.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “Moab’s corner,” a poetic image for its edge or border.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: “the sons of tumult,” also translated “the noisy ones” or “the sons of uproar.”'
    reason: lexical_alternative
