translation:
  language: en
  text: Joy and gladness have been gathered up and taken away from the orchard land[a] and from the land of Moab. I have stopped wine from coming from the winepresses. No one will tread grapes with a joyful shout. There will be shouting, but it will not be the joyful shout of harvest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to fertile, cultivated land, not Mount Carmel.
    reason: lexical_alternative
