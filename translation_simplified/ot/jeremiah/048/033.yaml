  rationale: The added wording prevents readers from mistaking the phrase for collecting joy.
- pob_phrase: I have made wine cease from the winepresses
  simplified_phrase: I have stopped wine from coming from the winepresses
  preserved_meaning: The divine speaker brings wine production at the presses to an end.
  reasoning_layer_used: Lexical and theological decisions for הִשְׁבַּתִּי.
  rationale: Ordinary English replaces the difficult causative construction while retaining the divine first person.
- pob_phrase: No one will tread with a shout; the shout is no shout
  simplified_phrase: No one will tread grapes with a joyful shout. There will be shouting, but it will not be the joyful shout of harvest.
