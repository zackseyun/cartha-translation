translation:
  language: en
  text: 'So take notice: the days are coming, declares Yahweh, when I will send people who pour out wine[a] to Moab. They will pour him out like wine, empty his containers, and smash their jars.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is rare and may mean “tilters” or “decanters”; some understand it as “wanderers,” but the surrounding wine imagery supports people who pour out wine.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text says “their jars,” though some interpreters expect “his jars,” referring to Moab.
    reason: textual_variant
