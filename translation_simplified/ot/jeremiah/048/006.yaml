translation:
  language: en
  text: Run away! Escape with your lives! Be like a juniper shrub in the wilderness.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Be like Aroer in the wilderness.” The Hebrew may name either a place or a desert shrub, though the comparison favors the shrub here.
    reason: alternative_reading
  - marker: b
    text: The exact desert shrub is uncertain; it may have been a juniper or tamarisk.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Flee!
  simplified_phrase: Run away!
  preserved_meaning: The urgent command to leave immediately is preserved.
  reasoning_layer_used: Lexical decision for נֻסוּ
  rationale: “Run away” is more immediately clear to a common reader than “flee.”
- pob_phrase: Escape with your lives
  simplified_phrase: Escape with your lives!
  preserved_meaning: The command concerns surviving the coming danger, not saving the soul in a spiritual sense.
  reasoning_layer_used: Lexical decisions for מַלְּטוּ and נַפְשְׁכֶם
  rationale: The wording remains natural while preserving the survival sense of “your lives.”
- pob_phrase: be like a juniper
  simplified_phrase: Be like a juniper shrub
  preserved_meaning: The desert-plant image remains the main reading without claiming certainty about the species.
  reasoning_layer_used: Lexical decision and footnotes for כַּעֲרוֹעֵר
  rationale: Adding “shrub” helps readers recognize that “juniper” refers to a wilderness plant.
translation_notes:
  risk_flags:
