  text: Anyone who flees from the terror will fall into a pit. Anyone who gets out of the pit will be caught in a snare. For I will bring upon Moab the year when its people will be punished.[a] This is what Yahweh declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also refer to a time of visitation or reckoning.
    reason: lexical_alternative
