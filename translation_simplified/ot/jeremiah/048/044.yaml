  simplified_phrase: Anyone who flees from the terror
  preserved_meaning: The warning applies generically to every person who tries to flee.
  reasoning_layer_used: The lexical decision identifies the participle as a generic reference to any fleeing person.
  rationale: “Anyone” expresses the generic sense in natural modern English.
- pob_phrase: he who comes up from the pit
  simplified_phrase: Anyone who gets out of the pit
  preserved_meaning: A person who emerges from the pit still faces another trap.
  reasoning_layer_used: The lexical rationale preserves upward escape without specifying how it happens.
  rationale: “Gets out” makes the action clear without adding climbing as the method.
- pob_phrase: for I will bring upon her, upon Moab
  simplified_phrase: For I will bring upon Moab
  preserved_meaning: Yahweh will bring the announced judgment directly upon Moab.
  reasoning_layer_used: The lexical rationale identifies Moab as the referent and target of judgment.
  rationale: Naming Moab once removes an awkward apposition without changing the target.
