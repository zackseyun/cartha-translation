  text: Moab will be disgraced because it relied on Chemosh,[a] just as the house of Israel was disgraced because it relied on the shrine at Bethel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be ashamed of Chemosh.” The sense is that trusting Chemosh will end in disgrace.
    reason: lexical_alternative
