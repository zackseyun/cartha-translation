translation:
  language: en
  text: I weep for you with the weeping of Jazer,[a] vine of Sibmah. Your branches crossed the sea and reached as far as the sea of Jazer.[b] The destroyer has swept down on your summer fruit and your grape harvest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I weep for you even more than Jazer does.”
    reason: lexical_alternative
  - marker: b
    text: Jazer was inland, so this may be poetic exaggeration; some instead read, “they reached as far as Jazer.”
    reason: textual_variant
