- pob_phrase: With the weeping of Jazer I weep for you
  simplified_phrase: I weep for you with the weeping of Jazer
  preserved_meaning: The speaker’s lament is linked to Jazer’s weeping without resolving whether the relationship is association or comparison.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The reordered clause is easier to follow while preserving the deliberate ambiguity.
- pob_phrase: vine of Sibmah; your branches crossed the sea; they reached as far as the sea of Jazer
  simplified_phrase: vine of Sibmah. Your branches crossed the sea and reached as far as the sea of Jazer.
  preserved_meaning: Sibmah remains pictured as a vine whose branches spread beyond normal bounds.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The new sentence clarifies the image while retaining the difficult Masoretic geography.
- pob_phrase: Upon your summer fruit and upon your grape harvest the destroyer has fallen
  simplified_phrase: The destroyer has swept down on your summer fruit and your grape harvest.
  preserved_meaning: Sudden devastation descends upon both the fruit and the grape harvest.
  reasoning_layer_used: POB lexical decisions for קֵיץ, בָּצִיר, שֹׁדֵד, and נָפָל
  rationale: Natural word order and “swept down” preserve the calamity’s vivid downward force.
