translation:
  language: en
  text: Because you trusted in what you had done or made[a] and in your stored-up wealth, you too will be captured. Chemosh[b] will go into exile together with his priests and officials.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your works” or “your deeds.”
    reason: lexical_alternative
  - marker: b
    text: Chemosh was the national god of Moab.
    reason: cultural_note
simplification_decisions:
- pob_phrase: your works
  simplified_phrase: what you had done or made
  preserved_meaning: The wording includes both Moab’s actions and what it produced.
  reasoning_layer_used: Lexical decision for בְּמַעֲשַׂיִךְ and grounding review
  rationale: This removes the narrower success implied by “accomplished” while expressing the Hebrew term’s breadth plainly.
- pob_phrase: your treasures
  simplified_phrase: your stored-up wealth
  preserved_meaning: Moab trusted in its accumulated material resources.
  reasoning_layer_used: Lexical decision for וּבְאֹצְרוֹתַיִךְ
  rationale: This makes accumulated treasure clear without suggesting merely prized objects.
- pob_phrase: and Chemosh will go out into exile, his priests and his officials together
  simplified_phrase: Chemosh will go into exile together with his priests and officials
  preserved_meaning: The personified Moabite god, his priests, and his officials will all be deported together.
  reasoning_layer_used: Theological decision on Chemosh and lexical decisions for exile, priests, officials, and together
  rationale: The new sentence order is easier to follow while preserving the image of their joint exile.
interpretive_expansions:
- pob_phrase: your treasures
  rendering: your stored-up wealth
  claim: The treasures are accumulated material resources in which Moab trusted.
  evidence:
  - The lexical rationale identifies accumulated wealth or resources as the object of trust.
  - The parallel with Moab’s works presents this wealth as a source of confidence.
  confidence: high
  alternatives_preserved:
  - treasures
  - storehouses
translation_notes:
  risk_flags:
  - risk: “What you had done or made” spells out two senses of a single broad Hebrew term.
    mitigation: Footnote a retains the compact alternatives “works” and “deeds.”
