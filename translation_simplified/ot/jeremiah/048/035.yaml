  preserved_meaning: This remains Yahweh’s solemn prophetic declaration.
  reasoning_layer_used: POB lexical decision for נְאֻם יְהוָה and theological decision for the divine name
  rationale: The verbal formula is clearer in ordinary English while retaining Yahweh’s personal name.
- pob_phrase: the high place
  simplified_phrase: a high-place shrine
  preserved_meaning: The place is a site where worshipers ascend to perform cultic worship.
  reasoning_layer_used: POB lexical decisions for מַעֲלֶה and בָמָה
  rationale: Adding “shrine” makes the worship setting understandable while preserving the high-place image.
- pob_phrase: the one who goes up
  simplified_phrase: the person who goes up
  preserved_meaning: The singular worshiper remains representative rather than becoming an abstract practice.
  reasoning_layer_used: POB theological decision on the scope of what is ended
  rationale: “The person” is natural modern English and keeps the source-driven singular form.
