translation:
  language: en
  text: “I will put an end in Moab to the person who goes up to a high-place shrine and burns incense to his god,” declares Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will put an end to high-place worship in Moab.” The Hebrew speaks of one worshiper, who may represent such worshipers generally.
    reason: alternative_reading
