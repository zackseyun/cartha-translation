translation:
  language: en
  text: 'Concerning Moab[a]: This is what Yahweh of Armies, the God of Israel, says: “Woe to Nebo, for it has been devastated! Kiriathaim has been captured and disgraced. The stronghold[b] has been disgraced and shattered.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Against Moab.”
    reason: alternative_reading
  - marker: b
    text: Or “Misgab,” if this is a place name rather than “the stronghold.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of Armies ... says
  preserved_meaning: Yahweh speaks as sovereign over heavenly and earthly forces.
  reasoning_layer_used: POB lexical decision for צְבָאוֹת
  rationale: “Armies” makes the biblical title clearer than the older word “hosts.”
- pob_phrase: Kiriathaim is put to shame; it is captured
  simplified_phrase: Kiriathaim has been captured and disgraced
  preserved_meaning: The city is militarily taken and brought to public shame.
  reasoning_layer_used: POB lexical decisions for הֹבִישָׁה and נִלְכְּדָה
  rationale: The reordered verbs express the same two results in natural English.
- pob_phrase: The stronghold is put to shame and shattered
  simplified_phrase: The stronghold has been disgraced and shattered
  preserved_meaning: The fortified place is brought to shame and broken by judgment.
  reasoning_layer_used: POB lexical and theological decisions for הַמִּשְׂגָּב and וָחָתָּה
  rationale: “Disgraced” plainly conveys imposed shame while retaining the forceful image “shattered.”
translation_notes:
  risk_flags:
  - risk: “Armies” may be heard as referring only to human forces.
    mitigation: The established divine title and context retain Yahweh’s broader sovereignty.
  - risk: “The stronghold” may instead be the place name “Misgab.”
    mitigation: Footnote [b] preserves the documented alternative.
