translation:
  language: en
  text: Baldness has overtaken Gaza. Ashkelon has been silenced,[a] all that remains of their valley.[b] How long will you keep gashing yourself?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has been cut off” or “has perished.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the remnant of their valley”; some ancient versions and interpreters read “the remnant of the Anakim.”
    reason: alternative_reading
  - marker: c
    text: People in the ancient Near East sometimes cut themselves as an act of mourning.
    reason: cultural_note
