  text: Micah from Moresheth was prophesying during the reign of Hezekiah, king of Judah. He told all the people of Judah, “This is what Yahweh of Armies says:[a] Zion will be plowed as a field. Jerusalem will become ruins, and the temple mount will become wooded heights.”
