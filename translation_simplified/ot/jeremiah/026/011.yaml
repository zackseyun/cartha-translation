simplification_decisions:
- pob_phrase: said to the officials and to all the people, saying
  simplified_phrase: told the officials and all the people
  preserved_meaning: The priests and prophets publicly addressed both the officials and the people.
  reasoning_layer_used: POB translation and source syntax
  rationale: The repeated speech formula is compressed into natural English without removing either audience.
- pob_phrase: A sentence of death is for this man
  simplified_phrase: This man should receive a death sentence
  preserved_meaning: They call for the man to receive a death sentence without saying that a verdict has already been issued or that he morally deserves it.
  reasoning_layer_used: POB translation, applied doctrine-realignment revision, and immediate narrative context
  rationale: The wording presents their capital accusation as a proposed judgment rather than a completed sentence.
- pob_phrase: just as you have heard with your own ears
  simplified_phrase: as you heard with your own ears
  preserved_meaning: The listeners themselves directly heard the prophecy used as the charge.
  reasoning_layer_used: POB translation and source imagery
  rationale: The shorter wording retains the emphatic image of hearing with one’s own ears.
