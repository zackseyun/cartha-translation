translation:
  language: en
  text: Then I will make this house share Shiloh’s fate.[a] I will make this city a curse among all the nations of the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shiloh was an earlier place of worship that fell under God’s judgment and was left in ruins.
    reason: cultural_note
  - marker: b
    text: Or, “I will make this city an example that all the nations of the earth use when cursing.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make this house like Shiloh
  simplified_phrase: make this house share Shiloh’s fate
  preserved_meaning: The Lord’s house will suffer the same judgment as the earlier sanctuary at Shiloh.
  reasoning_layer_used: Lexical decision and cultural note for כְּשִׁלֹה
  rationale: This natural comparison keeps both “house” and the force of the Shiloh allusion.
- pob_phrase: and I will make this city
  simplified_phrase: I will make this city
  preserved_meaning: God remains the one who brings judgment on the city.
  reasoning_layer_used: Lexical decision for אֶתֵּן
  rationale: A new sentence makes the two judgments easier to follow without weakening divine agency.
- pob_phrase: a curse to all the nations of the earth
  simplified_phrase: a curse among all the nations of the earth
  preserved_meaning: The city will become associated with cursing throughout the nations of the world.
  reasoning_layer_used: Lexical and theological decisions for אֶתֵּן לִקְלָלָה and לְכֹל גּוֹיֵי הָאָרֶץ
  rationale: “Among” expresses the worldwide relation while the footnote preserves the idiom’s fuller possible sense.
translation_notes:
  risk_flags:
