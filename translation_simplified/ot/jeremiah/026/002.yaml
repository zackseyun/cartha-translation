translation:
  language: en
  text: 'This is what Yahweh says: “Stand in the courtyard of Yahweh’s house. Speak to the people[a] who come there from every city in Judah to worship. Tell them every word I have commanded you to speak to them. Do not leave out a single word.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Speak to all the cities of Judah,” or “Speak against all the cities of Judah.” The Hebrew may refer directly to the cities rather than to the people coming from them.
    reason: lexical_alternative
