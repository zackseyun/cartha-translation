translation:
  language: en
  text: So now, set right the way you live and the things you do. Listen to the voice of Yahweh your God and obey him. Then Yahweh will relent from the disaster he announced against you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: make your ways and your deeds good
  simplified_phrase: set right the way you live and the things you do
  preserved_meaning: They must correct both their overall conduct and their actions.
  reasoning_layer_used: POB lexical decisions for דַרְכֵיכֶם and מַעַלְלֵיכֶם
  rationale: This replaces an awkward causative phrase while preserving both ways and deeds.
- pob_phrase: listen to the voice of Yahweh your God
  simplified_phrase: Listen to the voice of Yahweh your God and obey him
  preserved_meaning: They must hear Yahweh's command and act on it.
  reasoning_layer_used: POB lexical decision and footnote for וְשִׁמְעוּ בְּקוֹל
  rationale: This keeps the voice image while making the Hebrew idiom clear.
- pob_phrase: the disaster that he has spoken against you
  simplified_phrase: the disaster he announced against you
  preserved_meaning: The disaster is Yahweh's declared judgment against the people.
  reasoning_layer_used: POB lexical decisions for אֶל הָרָעָה and דִּבֶּר עֲלֵיכֶם
  rationale: Announced expresses a threatened judgment more naturally than spoken.
interpretive_expansions:
- pob_phrase: listen to the voice
  rendering: Listen to the voice ... and obey him
  claim: Listening here includes obedience.
  evidence:
  - The POB footnote identifies obedience as the force of the Hebrew idiom.
  - The surrounding commands call for changed conduct.
  confidence: high
  alternatives_preserved:
  - listen to the voice
- pob_phrase: and Yahweh will relent
  rendering: Then Yahweh will relent
  claim: Yahweh's relenting is presented as the result of their changed conduct and obedience.
  evidence:
  - The promise directly follows the paired commands.
  - The POB theological rationale describes a conditional reversal of judgment.
  confidence: high
  alternatives_preserved:
  - and Yahweh will relent
translation_notes:
  risk_flags:
  - risk: Set right is less formally causative than make good.
    mitigation: The wording retains the moral correction of both conduct and deeds.
  - risk: Divine relenting may be mistaken for admitting moral fault.
    mitigation: Relent from the disaster preserves reversal of judgment without saying Yahweh repents of evil.
