translation:
  language: en
  text: When King Jehoiakim, all his warriors, and all the officials heard what Uriah had said, the king tried to have him put to death. But when Uriah heard about this, he became afraid and fled to Egypt.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: heard his words
  simplified_phrase: heard what Uriah had said
  preserved_meaning: The king and his court heard Uriah’s prophetic speech.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: Naming Uriah makes the pronoun clear without changing its referent.
- pob_phrase: sought to put him to death
  simplified_phrase: tried to have him put to death
  preserved_meaning: The king intended and attempted to arrange Uriah’s death.
  reasoning_layer_used: POB lexical rationale for בקשׁ plus infinitive
  rationale: The simpler wording preserves the king’s agency and lethal intent.
- pob_phrase: he was afraid and fled and went to Egypt
  simplified_phrase: he became afraid and fled to Egypt
  preserved_meaning: Uriah responded in fear by fleeing to Egypt.
  reasoning_layer_used: POB lexical decisions and English narrative style
  rationale: Combining the movement clauses avoids repetition while keeping the urgent flight and destination.
interpretive_expansions:
