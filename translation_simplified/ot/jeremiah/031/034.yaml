    text: Yahweh is the divine name YHWH.
    reason: source_note
simplification_decisions:
- pob_phrase: each man his neighbor and each man his brother
  simplified_phrase: No one ... his neighbor or his brother
  preserved_meaning: No man in the covenant community will need to teach either his neighbor or his brother.
  reasoning_layer_used: POB lexical and theological decisions on masculine distributive language
  rationale: The universal negative expresses the distributive scope clearly without turning the phrase into two individuals.
- pob_phrase: for they will all know me
  simplified_phrase: because they will all know me
  preserved_meaning: Everyone's knowledge of Yahweh is the reason this teaching will no longer be needed.
  reasoning_layer_used: POB syntax and theological decision on covenant knowledge
  rationale: “Because” makes the stated causal connection immediately clear.
- pob_phrase: their iniquity
  simplified_phrase: their wrongdoing
  preserved_meaning: Yahweh will forgive their moral offense against him.
  reasoning_layer_used: POB lexical decision for עֲוֺנָם
  rationale: The documented alternative “wrongdoing” is clearer to common readers than “iniquity.”
translation_notes:
  risk_flags:
  - risk: “No one” neutralizes the source's grammatically masculine distributive form.
    mitigation: The singular masculine pronouns preserve its representative male wording and distributive relationships.
  - risk: “Wrongdoing” is less weighty and technical than “iniquity.”
    mitigation: The parallel phrase “their sin” retains the verse's moral and theological gravity.
