translation:
  language: en
  text: “No one will any longer teach his neighbor or his brother, saying, ‘Know Yahweh,’ because they will all know me, from the least of them to the greatest,” declares Yahweh.[a] “For I will forgive their wrongdoing and remember their sin no more.”
  philosophy: optimal-equivalence
  footnotes:
