  preserved_meaning: Israel will join a public, communal celebration.
  reasoning_layer_used: POB lexical decisions for במחול and מְשַׂחֲקִים
  rationale: The verbal wording makes the same festive scene easier to understand.
translation_notes:
  risk_flags:
