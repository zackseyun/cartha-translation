    mitigation: The vocative “O” marks poetic address, and footnote b explains the restoration metaphor.
  - risk: “Take up” makes preparation for celebration explicit rather than retaining the exact adornment wording.
    mitigation: The tambourine image remains, and the immediate dancing context supports festive preparation.
