translation:
  language: en
  text: Once again I will build you, and you will be built,[a] O virgin Israel.[b] Once again you will take up your tambourines and go out dancing with those who celebrate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “you will be rebuilt.” The Hebrew repeats the same word root: “I will build you, and you will be built.”'
    reason: lexical_alternative
  - marker: b
    text: “Virgin Israel” pictures Israel restored to youthful purity and joy; it does not refer to literal virginity.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Again I will build you, and you will be built
  simplified_phrase: Once again I will build you, and you will be built
  preserved_meaning: God will restore Israel, while the repeated build wording remains intact.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: “Once again” clearly expresses renewed action while preserving the Hebrew wordplay.
- pob_phrase: you will adorn yourself with your tambourines
  simplified_phrase: you will take up your tambourines
  preserved_meaning: Israel will prepare with tambourines for joyful celebration.
  reasoning_layer_used: POB lexical decision for תַּעְדִּי and immediate festive context
  rationale: “Take up” is natural English and avoids suggesting that tambourines are clothing.
- pob_phrase: go out in the dance of those who celebrate
