translation:
  language: en
  text: The whole valley of corpses and ashes, together with all the terraces[a] extending as far as the Kidron Valley and the corner of the Horse Gate on the east, will be holy to Yahweh. This entire area will never again be uprooted or torn down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew term may instead mean “fields” or “slopes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and the whole valley of the corpses and the ashes, and all the terraces
  simplified_phrase: The whole valley of corpses and ashes, together with all the terraces
  preserved_meaning: The valley and terraces are both included in the area being described.
  reasoning_layer_used: POB syntax and scope decision
  rationale: “Together with” makes the joined geographical scope easier to follow.
- pob_phrase: as far as the corner of the Horse Gate toward the east
  simplified_phrase: as far as the corner of the Horse Gate on the east
  preserved_meaning: The Horse Gate corner marks the eastern extent of the area.
  reasoning_layer_used: POB lexical decisions
  rationale: “On the east” states the direction in ordinary English.
- pob_phrase: It shall not be uprooted or overthrown again forever.
  simplified_phrase: This entire area will never again be uprooted or torn down.
  preserved_meaning: The whole consecrated area will remain permanently secure from destruction.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The explicit subject and “never again” clarify the scope and permanent negation.
