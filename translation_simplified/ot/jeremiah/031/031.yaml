  preserved_meaning: Yahweh announces a future period that is approaching.
  reasoning_layer_used: POB lexical rationale for יָמִים בָּאִים
  rationale: “The time is coming” makes the prophetic idiom natural without weakening its forward-looking force.
- pob_phrase: when I will make
