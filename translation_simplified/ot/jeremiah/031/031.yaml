translation:
  language: en
  text: “Pay attention! The time is coming,” Yahweh declares. “I will make a new covenant[a] with the house of Israel[b] and the house of Judah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a renewed covenant.” The Hebrew most naturally means “new,” though some interpreters understand it as “renewed” to emphasize continuity.
    reason: lexical_alternative
  - marker: b
    text: Here “house” refers to the whole covenant people identified with Israel; the same applies to Judah.
    reason: simplification_note
