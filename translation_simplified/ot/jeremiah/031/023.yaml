  text: 'This is what Yahweh, ruler of heaven’s and earth’s armies, the God of Israel, says: “When I restore their fortunes,[a] people will once again say in the land of Judah and its cities, ‘May Yahweh bless you, home of righteousness, holy mountain.’”'
