translation:
  language: en
  text: “Just as I carefully watched over them to uproot, tear down, overthrow, destroy, and bring harm,[a] so I will carefully watch over them to build and plant,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bring disaster.” The Hebrew can refer to harm or calamity brought as judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be that, just as I watched over them
  simplified_phrase: Just as I carefully watched over them
  preserved_meaning: God’s past judgment is directly compared with his future restoration.
  reasoning_layer_used: POB lexical decisions and prophetic context
  rationale: The simpler opening keeps the forward-looking comparison without the formal introductory formula.
- pob_phrase: to uproot and to tear down and to overthrow and to destroy and to bring harm
  simplified_phrase: to uproot, tear down, overthrow, destroy, and bring harm
  preserved_meaning: The full cumulative sequence of distinct acts of judgment remains intact.
  reasoning_layer_used: POB lexical decisions
  rationale: Removing repeated “to” makes the list easier to read without collapsing its images.
- pob_phrase: declares Yahweh
  simplified_phrase: declares Yahweh
  preserved_meaning: The prophetic formula and God’s covenant name are retained.
  reasoning_layer_used: POB theological decision
  rationale: The wording preserves the source-driven divine-name choice and the statement’s gravity.
