translation:
  language: en
  text: 'For Yahweh declares, “When those days have passed, I will make this covenant with the house of Israel[a]: I will put my law[b] within them and write it on their hearts. I will be their God, and they will be my people.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The house of Israel” means the people of Israel as a covenant community.
    reason: simplification_note
  - marker: b
    text: Or “my instruction.” The Hebrew word can mean either “law” or “instruction.”
    reason: lexical_alternative
