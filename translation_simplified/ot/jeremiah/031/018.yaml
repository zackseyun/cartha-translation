translation:
  language: en
  text: I have certainly heard Ephraim grieving.[a] He says, “You disciplined me, and I was disciplined like a calf that had never been trained. Restore me, and I will return to you,[b] because you are Yahweh my God.”
  philosophy: optimal-equivalence
  footnotes:
