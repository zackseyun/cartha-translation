translation:
  language: en
  text: 'How long will you keep wavering, faithless daughter? For Yahweh has created something new in the land: a woman will surround a man.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final statement is difficult and much debated. It may picture a woman courting a man, the weak overcoming the strong, or restored Israel returning to Yahweh.
