translation:
  language: en
  text: It will not be like the covenant I made with their fathers when I took them by the hand and brought them out of Egypt. They themselves broke my covenant, even though I was their husband.[a] This is what Yahweh declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “even though I was lord over them” or “even though I ruled over them.” The Hebrew can express either marriage or rule; Hebrews 8:9 reflects the sense of rule.
    reason: alternative_reading
