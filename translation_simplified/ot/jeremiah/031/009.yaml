translation:
  language: en
  text: They will come weeping, and with pleas for mercy I will lead them.[a] I will guide them to streams of water and along a straight path where they will not stumble. For I have become a father to Israel,[b] and Ephraim is my firstborn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They will come weeping; with their pleas for mercy, I will lead them.”
    reason: lexical_alternative
  - marker: b
    text: Or “For I am a father to Israel.” The Hebrew can emphasize a present covenant relationship.
    reason: alternative_reading
  - marker: c
    text: “Firstborn” describes Ephraim’s honored status and inheritance rights.
    reason: cultural_note
