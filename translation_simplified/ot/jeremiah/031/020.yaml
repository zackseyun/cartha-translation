translation:
  language: en
  text: Is Ephraim my precious son, a child who brings me delight? Whenever I speak against him,[a] I still remember him without fail. So deep within, I yearn for him.[b] I will certainly have compassion on him, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “speak of him” or “speak concerning him.” The context supports “against him” as a reference to words of judgment.
    reason: alternative_reading
  - marker: b
    text: Literally “my inward parts are stirred for him,” a Hebrew image of deep compassion.
    reason: lexical_alternative
