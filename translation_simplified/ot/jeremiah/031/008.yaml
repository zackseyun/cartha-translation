translation:
  language: en
  text: See, I am bringing them from the land of the north. I will gather them from the farthest parts of the earth.[a] Among them will be people who are blind, people who have difficulty walking, pregnant women, and women in labor. All together, a great assembly will return here.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the farthest parts of the land.” The Hebrew word can mean either “earth” or “land” here.
    reason: lexical_alternative
