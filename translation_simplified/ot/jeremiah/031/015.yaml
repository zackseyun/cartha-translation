translation:
  language: en
  text: 'This is what Yahweh says: “A voice is heard in Ramah[a]. Rachel is mourning and weeping bitterly for her children. She refuses to be comforted because they are no more.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ramah was a town in Benjamin’s territory. Rachel is pictured as the mother of the people, mourning her descendants.
    reason: cultural_note
  - marker: b
    text: Or “because he is no more.” Hebrew uses a singular form in this expression, though the context speaks collectively of Rachel’s children.
    reason: lexical_alternative
