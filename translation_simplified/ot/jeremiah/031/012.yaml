translation:
  language: en
  text: 'They will come to Zion’s high place and shout for joy. They will stream toward the good things Yahweh provides: grain, new wine, fresh oil, and the young animals of their flocks and herds. Their lives will be like a well-watered garden, and they will never again waste away from grief.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: on the height of Zion
  simplified_phrase: to Zion’s high place
  preserved_meaning: The people come to elevated Zion as the place of joyful worship.
  reasoning_layer_used: lexical decision for בִמְרוֹם צִיּוֹן
  rationale: The wording makes the location and direction natural in English without making the singular height plural.
- pob_phrase: stream to the goodness of Yahweh
  simplified_phrase: stream toward the good things Yahweh provides
  preserved_meaning: Yahweh is the source of the abundant blessings toward which the people flow.
  reasoning_layer_used: lexical rationale and POB footnote a
  rationale: This keeps the flowing image while making the material sense of “goodness” immediately clear.
- pob_phrase: the young of the flock and the herd
  simplified_phrase: the young animals of their flocks and herds
  preserved_meaning: The blessing includes the offspring of sheep, goats, and cattle rather than livestock only in general.
  reasoning_layer_used: lexical decision for בְּנֵי צֹאן וּבָקָר
  rationale: Adding “animals” removes an awkward expression while retaining the offspring nuance.
interpretive_expansions:
- pob_phrase: waste away
  rendering: waste away from grief
  claim: Their wasting away is caused by sorrow rather than simple physical decline.
  evidence:
  - The lexical rationale says דָּאַב conveys wasting away from grief.
  - POB footnote d preserves “sorrow no more” as an alternative.
  confidence: high
  alternatives_preserved:
  - sorrow no more
  - languish no longer
translation_notes:
  risk_flags:
  - risk: “Good things Yahweh provides” may sound narrower than Yahweh’s goodness as a divine quality.
    mitigation: The wording still names Yahweh as the source and follows the contextual list of his bounty.
