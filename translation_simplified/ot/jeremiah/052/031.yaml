translation:
  language: en
  text: In the thirty-seventh year that Jehoiachin king of Judah was in exile, on the twenty-fifth day of the twelfth month, King Evil-merodach of Babylon[a] lifted up Jehoiachin’s head—showing him favor—and brought him out of prison. This was the first year of Evil-merodach’s reign.
