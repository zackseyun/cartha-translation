translation:
  language: en
  text: In the ninth year of his reign, on the tenth day of the tenth month, King Nebuchadnezzar of Babylon came with his entire army to attack Jerusalem. They set up camp there and built a siege wall all around the city.
  philosophy: optimal-equivalence
