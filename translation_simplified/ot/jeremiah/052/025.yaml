translation:
  language: en
  text: 'He also took these people from the city: one court official[a] who was in charge of the soldiers; seven men from the king’s court who had direct access to him and were found in the city; the army commander’s secretary, who called the people of the country into military service; and sixty men from the people of the country who were found in the city.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean “eunuch” or, more broadly, “court official”; this rendering describes the man’s official role without ruling out the other sense.
    reason: lexical_alternative
