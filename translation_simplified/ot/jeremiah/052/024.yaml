  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second-ranking priest[b], and the three guards who kept watch at the threshold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the high priest.” The Hebrew title literally means “the chief priest.”
    reason: lexical_alternative
  - marker: b
