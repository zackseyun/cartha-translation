translation:
  language: en
  text: On the tenth day of the fifth month, in the nineteenth year of the reign of King Nebuchadnezzar of Babylon, Nebuzaradan came to Jerusalem. He was captain of the guard[a] and served in the presence of the king of Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “chief of the executioners” or “chief butcher”; this was probably the title of a high royal official in charge of the guard.
    reason: lexical_alternative
