  text: The king of Babylon gave him a regular allowance—a portion for each day—for the rest of his life, until the day he died.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his allowance, a continual allowance, was given to him from the king of Babylon
  simplified_phrase: The king of Babylon gave him a regular allowance
  preserved_meaning: The allowance came from the king and was provided on an ongoing basis.
