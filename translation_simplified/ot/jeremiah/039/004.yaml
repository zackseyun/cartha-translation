translation:
  language: en
  text: When King Zedekiah of Judah and all the soldiers saw the Babylonian forces, they fled. They left the city at night, following the route by the king’s garden and passing through the gate between the two walls. Then he headed toward the Arabah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew shifts here from “they” to “he”; some translations use “they” throughout.
    reason: textual_variant
  - marker: b
    text: The Arabah is a geographic region; the Hebrew term may also be translated “the plain” or “the Jordan Valley.”
    reason: lexical_alternative
