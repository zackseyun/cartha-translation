translation:
  language: en
  text: The Chaldeans[a] set fire to the king’s house[b] and the people’s homes. They also tore down Jerusalem’s walls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Chaldeans were the Babylonian forces.
    reason: cultural_note
  - marker: b
    text: The king’s house may also be translated “the palace.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: burned ... with fire
  simplified_phrase: set fire to
  preserved_meaning: The Chaldeans deliberately burned the buildings.
  reasoning_layer_used: The lexical decisions identify fire as the means and allow “set on fire” as an alternative.
  rationale: This removes English redundancy while preserving the action and its means.
- pob_phrase: the houses of the people
  simplified_phrase: the people’s homes
  preserved_meaning: The dwellings belonging to Jerusalem’s population were burned.
  reasoning_layer_used: The lexical rationale treats the singular Hebrew expression distributively as multiple dwellings.
  rationale: “Homes” makes the reference to ordinary dwellings immediately clear.
- pob_phrase: and they tore down the walls of Jerusalem
  simplified_phrase: They also tore down Jerusalem’s walls.
  preserved_meaning: The same forces destroyed the city’s defensive walls.
  reasoning_layer_used: The lexical decision preserves the vivid structural action of נָתָצוּ as “tore down.”
  rationale: A new sentence makes the second act of destruction easier to follow.
