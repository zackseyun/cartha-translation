translation:
  language: en
  text: Then all the king of Babylon’s officials entered the city and took their seats in the Middle Gate.[a] They included Nergal-sharezer, Samgar-nebu, Sarsechim the Rab-saris,[b][c] and Nergal-sharezer the Rab-mag,[d] along with all the other officials of the king of Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the Middle Gate.” The Hebrew can mean either “in” or “at” here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew sequence of names and titles here is difficult. Some divide it differently, taking “Samgar” as a title or “Sarsechim” as an office rather than a personal name.
    reason: alternative_reading
  - marker: c
    text: Rab-saris was a Babylonian title, perhaps meaning “chief eunuch” or “chief court official.”
    reason: cultural_note
  - marker: d
    text: Rab-mag was a Babylonian title, perhaps for a chief magus or another high-ranking ritual official.
    reason: cultural_note
