translation:
  language: en
  text: Nebuzaradan, commander of the royal guard, Nebushazban, the chief court officer,[a] Nergal-sharezer, the chief magus,[b] and all the leading officials of the king of Babylon sent word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This title may also mean “chief eunuch.”
    reason: lexical_alternative
  - marker: b
    text: “Chief magus” was a Babylonian court title, traditionally left untranslated as “Rab-mag.”
    reason: cultural_note
