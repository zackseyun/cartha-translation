  preserved_meaning: Nebuzaradan commanded the king’s guard.
  reasoning_layer_used: POB lexical decision for רַב טַבָּחִים
  rationale: “Commander” states his leadership role directly, while “royal” identifies the guard’s setting.
- pob_phrase: chief officer
  simplified_phrase: chief court officer
  preserved_meaning: Nebushazban held a high-ranking office in the Babylonian court.
  reasoning_layer_used: POB lexical decision for רַב סָרִיס
  rationale: “Court” clarifies the setting without claiming that he was a eunuch.
- pob_phrase: all the chief officials of the king of Babylon
  simplified_phrase: all the leading officials of the king of Babylon
  preserved_meaning: The king of Babylon’s high-ranking officials joined in the action.
  reasoning_layer_used: POB lexical decision for וְכֹל רַבֵּי מֶלֶךְ בָּבֶל and grounding review
  rationale: “Leading” avoids repeated “chief,” while omitting unsupported “other.”
