translation:
  language: en
  text: You are provoking me to anger by what you do with your hands and by burning incense to other gods in Egypt, where you are going to live as foreigners. In this way, you will cut yourselves off[a] and become a curse[b] and a disgrace among all the nations of the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “destroy yourselves” or “be cut off.”
    reason: alternative_reading
  - marker: b
    text: “A curse” may mean a people whose name is used when pronouncing a curse.
    reason: lexical_alternative
