translation:
  language: en
  text: 'A few who survive the sword will return from Egypt to Judah. The whole remnant of Judah—the people who went to Egypt to live there as foreigners—will know whose word will stand: mine or theirs.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “whose word will come to pass: mine or theirs.”'
    reason: lexical_alternative
