  preserved_meaning: Only a small number will escape violent judgment.
  reasoning_layer_used: POB lexical decision for וּפְלִיטֵי חֶרֶב and מְתֵי מִסְפָּר
  rationale: The active clause is easier to read while preserving the sword image.
- pob_phrase: all the remnant of Judah who came
  simplified_phrase: the whole remnant of Judah—the people who went
  preserved_meaning: The statement concerns all the remaining Judeans who relocated to Egypt.
  reasoning_layer_used: POB lexical decisions for כָּל שְׁאֵרִית יְהוּדָה and הַבָּאִים
  rationale: The apposition explains who the remnant is, and “went” gives natural narrative perspective.
- pob_phrase: to sojourn there
  simplified_phrase: to live there as foreigners
  preserved_meaning: They resided in Egypt as people from another land.
  reasoning_layer_used: POB lexical decision for לָגוּר שָׁם
