translation:
  language: en
  text: I will take the remnant of Judah who have set their faces toward Egypt, determined to enter that land and live there as foreigners. All of them will come to an end in Egypt. They will fall by the sword and by famine. From the least to the greatest, they will come to an end. They will die by the sword and by famine. They will become an oath involving a curse,[a] an object of horror, a curse, and a disgrace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also refer to a curse-formula.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who have set their faces to enter the land of Egypt
  simplified_phrase: who have set their faces toward Egypt, determined to enter that land
  preserved_meaning: The wording retains both the concrete image and their firm resolve to enter Egypt.
  reasoning_layer_used: POB lexical decision for שָׂמוּ פְנֵיהֶם
  rationale: The clarifier explains the prophetic image without replacing it.
- pob_phrase: to sojourn there
  simplified_phrase: live there as foreigners
  preserved_meaning: They intended to reside in Egypt as outsiders.
  reasoning_layer_used: POB lexical decision for לָגוּר שָׁם
  rationale: This replaces an unfamiliar term while preserving the foreign-resident sense.
- pob_phrase: an oath, a horror, a curse, and a reproach
  simplified_phrase: an oath involving a curse, an object of horror, a curse, and a disgrace
  preserved_meaning: The four distinct results of judgment remain, including the distinction between oath and curse.
  reasoning_layer_used: POB lexical and theological decisions for אָלָה, שַׁמָּה, קְלָלָה, and חֶרְפָּה
  rationale: The wording clarifies difficult terms without adding the unsupported idea that their fate is an example.
