translation:
  language: en
  text: No survivor or escapee from the remnant of Judah who are going to reside in Egypt as temporary residents will return to live in the land of Judah. They long with their whole being to go back and live there, but they will not return, except for those who escape.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who are coming to sojourn there in the land of Egypt
  simplified_phrase: who are going to reside in Egypt as temporary residents
  preserved_meaning: The Judeans are going to live in Egypt with the status of temporary residents.
  reasoning_layer_used: POB lexical decision for הַבָּאִים לָגוּר שָׁם and doctrine-realignment revision
  rationale: This explains “sojourn” without implying a fixed length of stay and retains the ongoing perspective.
- pob_phrase: there will be no fugitive or survivor ... to return
  simplified_phrase: No survivor or escapee ... will return
  preserved_meaning: The judgment denies that any survivor or escaped person from this group will return to Judah.
  reasoning_layer_used: POB lexical decisions for פָּלִיט and שָׂרִיד
  rationale: Keeping both terms as nouns preserves their grammatical and logical role.
- pob_phrase: to which they are lifting up their soul to return and dwell there
  simplified_phrase: They long with their whole being to go back and live there
  preserved_meaning: Their deep desire is to return and settle in Judah.
  reasoning_layer_used: POB footnote and lexical decisions for the Hebrew idiom, נֶפֶשׁ, and לָשׁוּב לָשֶׁבֶת שָׁם
  rationale: A separate sentence clearly expresses the idiom’s force while preserving wholehearted longing.
interpretive_expansions:
- pob_phrase: lifting up their soul
  rendering: long with their whole being
  claim: The idiom describes a deep, wholehearted desire to return.
  evidence:
