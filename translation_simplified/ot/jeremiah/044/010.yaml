translation:
  language: en
  text: Even now, they have not been humbled.[a] They have not feared me or lived by my law and statutes, which I set before you and your fathers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “crushed” or “made contrite”; the Hebrew does not explicitly say “repented.”
    reason: lexical_alternative
  - marker: b
    text: “Your fathers” means the earlier generations; it may also be translated “your ancestors.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to this day
  simplified_phrase: Even now
  preserved_meaning: Their refusal has continued up to the present time.
  reasoning_layer_used: POB lexical decision for עַד הַיּוֹם הַזֶּה
  rationale: This natural idiom preserves the continuing force.
- pob_phrase: have not walked in my law and in my statutes
  simplified_phrase: have not ... lived by my law and statutes
  preserved_meaning: They have not conducted their lives according to God's covenant commands.
  reasoning_layer_used: POB lexical decisions for הָלְכוּ, בְּתוֹרָתִי, and וּבְחֻקֹּתַי
  rationale: “Lived by” makes the walking metaphor's meaning clear while retaining the past-to-present indictment.
- pob_phrase: that I set before you and before your fathers
  simplified_phrase: which I set before you and your fathers
  preserved_meaning: God presented the same obligations to the hearers and their earlier generations.
  reasoning_layer_used: POB lexical decisions and doctrine realignment for the second-person suffixes
  rationale: Dropping the repeated preposition smooths the sentence without changing the direct address.
interpretive_expansions:
- pob_phrase: they have not feared
  rendering: They have not feared me
  claim: God is the implied object of covenantal fear.
  evidence:
