translation:
  language: en
  text: You offered incense and sinned against Yahweh. You did not listen to Yahweh’s voice or follow the path set by his law, statutes, and covenant requirements. That is why this disaster came upon you, as you can see today.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because you burned incense and sinned against Yahweh
  simplified_phrase: You offered incense and sinned against Yahweh.
  preserved_meaning: The people’s incense offering was an act of sin against Yahweh.
  reasoning_layer_used: POB lexical decision for קִטַּרְתֶּם and theological decision for יהוה
  rationale: “Offered incense” clearly conveys the ritual act while retaining Yahweh’s personal name.
- pob_phrase: did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies
  simplified_phrase: You did not listen to Yahweh’s voice or follow the path set by his law, statutes, and covenant requirements.
  preserved_meaning: They neither heeded Yahweh nor lived according to his distinct covenant directives.
  reasoning_layer_used: POB lexical decisions for שׁמע, הלך, תורה, חֻקִּים, and עֵדוֹת
  rationale: The wording preserves the voice and walking images while making the covenantal list easier to understand.
- pob_phrase: therefore this disaster has come upon you, as it is this day
  simplified_phrase: That is why this disaster came upon you, as you can see today.
  preserved_meaning: Their disobedience caused the present, observable calamity.
  reasoning_layer_used: POB lexical decisions for עַל כֵּן, רָעָה, and כַּיּוֹם הַזֶּה
  rationale: The result is stated in direct modern English without changing disaster into moral evil.
