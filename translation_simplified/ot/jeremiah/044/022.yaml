translation:
  language: en
  text: Yahweh could no longer endure it because your deeds were evil and you committed detestable practices. So your land became ruined, desolate, and cursed, with no one living there, as it is today.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: could no longer bear it
  simplified_phrase: could no longer endure it
  preserved_meaning: Yahweh’s continued forbearance had reached its limit.
  reasoning_layer_used: POB lexical decision for יוּכַל ... לָשֵׂאת
  rationale: “Endure” states the idiomatic meaning more directly than “bear.”
- pob_phrase: the evil of your deeds, because of the abominations that you committed
  simplified_phrase: because your deeds were evil and you committed detestable practices
  preserved_meaning: Their deeds were evil and included practices gravely offensive to Yahweh.
  reasoning_layer_used: POB lexical decisions for רֹעַ מַעַלְלֵיכֶם and הַתּוֹעֵבוֹת
  rationale: Two direct clauses express both accusations in clear modern English.
- pob_phrase: your land became a ruin, a desolation, and a curse, without inhabitant
  simplified_phrase: your land became ruined, desolate, and cursed, with no one living there
  preserved_meaning: The land suffered devastation, curse, and depopulation because of their sins.
  reasoning_layer_used: POB lexical decisions for לְחָרְבָּה, וּלְשַׁמָּה, וְלִקְלָלָה, and מֵאֵין יוֹשֵׁב
  rationale: Adjectives and a plain clause make the threefold judgment and empty land immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Detestable practices” may not carry all the traditional covenantal weight of “abominations.”
    mitigation: It retains strong moral offense and follows a documented POB alternative.
  - risk: “Cursed” may obscure the possible sense of becoming an object used in curse formulas.
    mitigation: It preserves the main POB choice without turning the lexical alternative into a firm claim.
