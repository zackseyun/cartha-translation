translation:
  language: en
  text: 'This is what Yahweh says: “Look! I am handing Pharaoh Hophra, king of Egypt, over to his enemies and to those who want to kill him. I will do this just as I handed Zedekiah, king of Judah, over to Nebuchadnezzar[a], king of Babylon. Nebuchadnezzar was Zedekiah’s enemy and wanted to kill him.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “Nebuchadrezzar”; conventionally rendered “Nebuchadnezzar” in English.'
    reason: lexical_alternative
