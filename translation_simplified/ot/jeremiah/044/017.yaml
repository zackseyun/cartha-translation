translation:
  language: en
  text: 'But we will certainly do everything we have said we would do: burn incense to the Queen of Heaven and pour out drink offerings to her, just as we, our ancestors, our kings, and our officials did in the cities of Judah and the streets of Jerusalem. At that time we had plenty of bread, prospered, and suffered no disaster.'
