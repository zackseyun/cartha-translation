translation:
  language: en
  text: 'This is what the LORD of hosts, the God of Israel, says: “You and your wives made your vows with your mouths and carried them out with your hands. You said, ‘We will certainly carry out the vows we made—to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ So go ahead—confirm your vows and carry them out.”'
