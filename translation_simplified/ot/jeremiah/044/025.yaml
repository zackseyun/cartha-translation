  reasoning_layer_used: POB translation and applied revision
  rationale: The prophetic formula is put into natural modern English while retaining the divine title.
- pob_phrase: spoken with your mouths and fulfilled it with your hands
  simplified_phrase: made your vows with your mouths and carried them out with your hands
  preserved_meaning: Their actions fulfilled the vows they had spoken.
  reasoning_layer_used: POB translation, Hebrew source image, and grounding review
  rationale: The plural vows and the vivid contrast between mouths and hands are both preserved.
- pob_phrase: confirm your vows and carry out your vows
  simplified_phrase: confirm your vows and carry them out
  preserved_meaning: They are emphatically told both to uphold their vows and to perform them.
  reasoning_layer_used: POB translation and applied revision
  rationale: A pronoun avoids awkward repetition without merging the two commands.
