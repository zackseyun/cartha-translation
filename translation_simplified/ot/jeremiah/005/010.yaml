translation:
  language: en
  text: Go up through her rows of vines[a] and destroy, but do not destroy everything. Cut away her branches[b], because they do not belong to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Climb onto her walls and destroy.” The Hebrew term is difficult and may describe walls rather than rows of vines.
    reason: alternative_reading
  - marker: b
    text: Or “shoots” or “tendrils.” The Hebrew may continue the vineyard picture.
    reason: lexical_alternative
