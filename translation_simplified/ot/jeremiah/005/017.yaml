translation:
  language: en
  text: It[a] will consume[b] your harvest and bread. They will consume your sons and daughters. They will consume your flocks and herds. They will consume your vines and fig trees. With the sword, it will destroy the fortified cities you trust in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses singular verbs for the first and final actions and plural verbs for the middle actions, presenting the invading nation both as one force and as many attackers.
    reason: alternative_reading
  - marker: b
    text: Or “devour”; Hebrew uses the same verb throughout this list.
    reason: lexical_alternative
