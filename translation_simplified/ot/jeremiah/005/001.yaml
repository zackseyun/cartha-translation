translation:
  language: en
  text: Go all through the streets of Jerusalem. Please look carefully and find out what is there. Search her public squares. See whether you can find even one man[a] who acts with justice and seeks faithfulness.[b] Then I will forgive her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “a man,” emphasizing that not even one such person could be found.
    reason: lexical_alternative
  - marker: b
    text: Or “truth.” The Hebrew word can mean faithfulness, reliability, or truthfulness.
    reason: lexical_alternative
