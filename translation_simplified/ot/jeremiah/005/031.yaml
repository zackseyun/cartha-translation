translation:
  language: en
  text: The prophets give false prophecies, and the priests rule under their authority.[a] My people love things this way. But what will you do when all this comes to an end?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew phrase may also mean “the priests rule at their direction” or “the priests rule by their hands.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean “when her end comes,” perhaps referring to the land or the city.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The prophets prophesy falsely
  simplified_phrase: The prophets give false prophecies
  preserved_meaning: The prophets present deceptive messages as prophecy.
  reasoning_layer_used: POB lexical decision for נִבְּאוּ בַשֶּׁקֶר
  rationale: The rewrite avoids the less familiar verb “prophesy” while retaining the accusation of false prophecy.
- pob_phrase: the priests rule by their authority
  simplified_phrase: the priests rule under their authority
  preserved_meaning: The priests exercise power in dependence on the prophets’ authority.
  reasoning_layer_used: POB lexical rationale for עַל יְדֵיהֶם
  rationale: “Under” makes the relationship between the priests and prophets easier to grasp.
- pob_phrase: my people love it so ... when its end comes
  simplified_phrase: My people love things this way ... when all this comes to an end
  preserved_meaning: The people approve of the corrupt state of affairs but will face its outcome.
  reasoning_layer_used: POB lexical and theological decisions for כֵן and לְאַחֲרִיתָהּ
  rationale: The concrete wording gives the pronouns clear reference without naming an uncertain feminine antecedent.
