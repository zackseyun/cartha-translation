translation:
  language: en
  text: They have grown fat and sleek. They have gone beyond all bounds in evil.[a] They do not give the fatherless justice, so that they may prosper.[b] They do not uphold the rights of the poor.
  philosophy: optimal-equivalence
  footnotes:
