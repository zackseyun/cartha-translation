translation:
  language: en
  text: Therefore, a lion from the forest strikes them down. A wolf from the desert plains[a] devastates them. A leopard lies in wait near their cities. Anyone who goes out of their cities will be torn apart, because their acts of rebellion are many and their apostasies[b] have intensified.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wolf of the evenings.” The Hebrew expression most naturally refers here to desert or steppe regions.
    reason: lexical_alternative
  - marker: b
    text: Apostasies are repeated turnings away from faithfulness to God; traditionally, “backslidings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a wolf of the deserts devastates them
  simplified_phrase: A wolf from the desert plains devastates them
  preserved_meaning: The wolf comes from arid steppe regions and brings violent destruction.
  reasoning_layer_used: POB lexical decisions for זְאֵב עֲרָבוֹת and יְשָׁדְדֵם
  rationale: “From the desert plains” makes the location natural without adopting the alternative “evenings.”
- pob_phrase: a leopard keeps watch over their cities
  simplified_phrase: A leopard lies in wait near their cities
  preserved_meaning: The leopard watches the cities as a hostile predator.
  reasoning_layer_used: POB lexical decision for שֹׁקֵד עַל and immediate predator context
  rationale: “Lies in wait near” makes the hostile watch clear without adding a separate claim about an attack.
- pob_phrase: their transgressions are many; their apostasies have grown strong
  simplified_phrase: their acts of rebellion are many and their apostasies have intensified
  preserved_meaning: Their numerous offenses are rebellions, and their repeated covenant unfaithfulness has become entrenched.
  reasoning_layer_used: POB lexical and theological decisions for פִּשְׁעֵיהֶם, משבותיהם, and עָצְמוּ
  rationale: The wording clarifies both the rebellious force and the increasing strength of their unfaithfulness.
