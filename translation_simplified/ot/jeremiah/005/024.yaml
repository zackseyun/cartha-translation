  simplified_phrase: They did not say in their hearts
  preserved_meaning: The people did not inwardly acknowledge what they should do.
  reasoning_layer_used: POB lexical decision for בִלְבָבָם
  rationale: The natural English plural preserves the Hebrew heart image without the awkward collective singular.
- pob_phrase: Let us now fear
  simplified_phrase: We should now fear
  preserved_meaning: The speakers urge themselves to respond to God with fear.
  reasoning_layer_used: POB lexical decision for נִירָא נָא
  rationale: A direct self-exhortation communicates the cohortative naturally while retaining its urgency.
- pob_phrase: who gives rain in its season, both the early rain and the latter rain, who keeps for us
  simplified_phrase: He gives rain at the right time—both the early rain and the later rain—and preserves ... for us
  preserved_meaning: Yahweh continually provides both seasonal rains and maintains the harvest period.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: Two direct clauses clarify God's ongoing actions while keeping the seasonal order and harvest provision distinct.
