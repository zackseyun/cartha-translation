translation:
  language: en
  text: They did not say in their hearts, “We should now fear Yahweh our God. He gives rain at the right time—both the early rain and the later rain[a]—and preserves the appointed weeks of harvest for us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the autumn rain and the spring rain.”
    reason: lexical_alternative
simplification_decisions:
