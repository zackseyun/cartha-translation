translation:
  language: en
  text: “Pay attention, Israel! I am bringing a nation from far away to attack you,” declares Yahweh. “It is a mighty nation,[a] an ancient nation.[b] You do not know its language or understand what its people say.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “a strong nation” or “an enduring nation.”
    reason: lexical_alternative
  - marker: b
    text: Or “a nation from long ago.”
    reason: lexical_alternative
