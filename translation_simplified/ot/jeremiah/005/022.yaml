translation:
  language: en
  text: '“Do you not fear me?” Yahweh declares. “Do you not tremble in my presence? I am the one who set the sand as the sea’s boundary and made this a permanent decree: the sea cannot cross it. Its waves may surge, but they cannot overcome the boundary. They may roar, but they cannot cross it.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do you not tremble before me, he who set
  simplified_phrase: Do you not tremble in my presence? I am the one who set
  preserved_meaning: The speaker calls for reverent fear and emphatically identifies himself as the one who restrained the sea.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: Two direct sentences replace the difficult third-person apposition while preserving its emphasis.
- pob_phrase: an everlasting decree that it cannot cross
  simplified_phrase: 'made this a permanent decree: the sea cannot cross it'
  preserved_meaning: God established an enduring command that prevents the sea from passing its boundary.
  reasoning_layer_used: POB lexical decisions for חָק עוֹלָם and וְלֹא יַעַבְרֶנְהוּ
  rationale: Naming the sea removes pronoun ambiguity without weakening the decree’s permanence.
- pob_phrase: Though its waves toss, they cannot prevail
  simplified_phrase: Its waves may surge, but they cannot overcome the boundary
  preserved_meaning: Even violently moving waves cannot defeat the limit God established.
  reasoning_layer_used: POB lexical decisions for וַיִּתְגָּעֲשׁוּ and וְלֹא יוּכָלוּ
  rationale: Common wording states what the waves cannot prevail against while retaining the forceful image.
