translation:
  language: en
  text: 'Therefore, this is what Yahweh, God of armies,[a] says:


    “Because all of you are speaking these words,[b] look: I am making my words in your mouth[c] a fire. This people will be the wood, and the fire will consume them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Armies” may refer to earthly or heavenly forces; the Hebrew does not specify.
    reason: cultural_note
  - marker: b
    text: Or “Because all of you have spoken these words.”
    reason: lexical_alternative
  - marker: c
    text: Here “your” is singular and likely refers to Jeremiah, though a collective sense is possible.
    reason: source_note
simplification_decisions:
- pob_phrase: thus says Yahweh, the God of hosts
  simplified_phrase: this is what Yahweh, God of armies, says
  preserved_meaning: Yahweh speaks with authority as the God who commands hosts.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This makes the prophetic formula and the force of “hosts” easier to understand.
- pob_phrase: Because you speak this word
  simplified_phrase: Because all of you are speaking these words
  preserved_meaning: The group’s words are contrasted with Yahweh’s effective words.
  reasoning_layer_used: POB lexical decision and independent grounding review
  rationale: “Words” preserves the deliberate link with “my words,” while “all of you” shows the plural address.
- pob_phrase: behold, I am making my words in your mouth fire, and this people wood, and it will consume them
  simplified_phrase: 'look: I am making my words in your mouth a fire. This people will be the wood, and the fire will consume them'
  preserved_meaning: God’s words through the prophet become consuming fire, and the people are pictured as wood.
  reasoning_layer_used: POB lexical decisions and source-language metaphor
  rationale: Shorter clauses clarify the image without removing its mouth, fire, wood, or consuming action.
interpretive_expansions:
- pob_phrase: you speak this word
  rendering: all of you are speaking these words
  claim: The causal clause addresses multiple speakers and refers to the words they are saying.
  evidence:
  - The Hebrew form translated “you speak” is second-person plural.
  - The POB reasoning contrasts this plural address with the later singular “your.”
  - The immediate context supplies the group’s dismissive words about the prophets.
  confidence: high
  alternatives_preserved:
  - Because all of you have spoken these words.
translation_notes:
  risk_flags:
