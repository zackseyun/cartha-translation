translation:
  language: en
  text: 'When the people ask, “Why has Yahweh our God done all this to us?” you must answer them: “You abandoned me and served foreign gods in your own land. In the same way, you will serve foreign people in a land that is not yours.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when you say ... then you shall say to them
  simplified_phrase: When the people ask ... you must answer them
  preserved_meaning: The people ask about their judgment, and the prophet is commanded to answer them.
  reasoning_layer_used: Source grammar and POB lexical rationale
  rationale: Naming the two parties makes the Hebrew shift from plural to singular understandable in English.
- pob_phrase: you have forsaken me
  simplified_phrase: You abandoned me
  preserved_meaning: The people rejected Yahweh and broke covenant faithfulness.
  reasoning_layer_used: POB lexical decision
  rationale: “Abandoned” is common English while retaining the force of deliberate desertion.
- pob_phrase: Just as ... so
  simplified_phrase: In the same way
  preserved_meaning: Their service to foreign rulers corresponds to their service of foreign gods.
  reasoning_layer_used: POB lexical and rhetorical decisions
  rationale: The shorter transition preserves the judgment’s deliberate comparison.
interpretive_expansions:
- pob_phrase: when you say ... you shall say to them
  rendering: When the people ask ... you must answer them
  claim: The first “you” refers to the people, while the commanded “you” refers to the prophet.
  evidence:
  - The Hebrew changes from a plural speaker to a singular addressee who answers “them.”
  - The POB rationale identifies the second clause as an instruction to the prophet.
  confidence: high
translation_notes:
