translation:
  language: en
  text: But I said, “Surely these are just poor people. They are foolish because they do not know how Yahweh wants them to live or what their God establishes as right.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the judgment of their God” or “the ordinance of their God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: these are only the poor
  simplified_phrase: these are just poor people
  preserved_meaning: Jeremiah provisionally identifies them as members of the poor social group.
  reasoning_layer_used: Lexical decisions for אַךְ, דַּלִּים, and הֵם, with the immediate contrast in Jeremiah 5:5
  rationale: This wording clearly identifies a social group rather than making poverty their only characteristic.
- pob_phrase: the way of Yahweh
  simplified_phrase: how Yahweh wants them to live
  preserved_meaning: They do not understand Yahweh’s will and covenantal path for life.
  reasoning_layer_used: Lexical rationale for דֶּרֶךְ יְהוָה
  rationale: The path image is recast as the way of life Yahweh wills so its meaning is immediately clear.
- pob_phrase: the justice of their God
  simplified_phrase: what their God establishes as right
  preserved_meaning: They do not know God’s just order, judgments, and requirements.
  reasoning_layer_used: Lexical rationale and footnote for מִשְׁפַּט אֱלֹהֵיהֶם
  rationale: This preserves the broad idea of God’s standard of right without reducing it to individual commands.
interpretive_expansions:
- pob_phrase: the way of Yahweh
  rendering: how Yahweh wants them to live
  claim: Yahweh’s way is the manner of life he wills for his people.
  evidence:
