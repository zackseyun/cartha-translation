translation:
  language: en
  text: Yahweh, don’t your eyes look for faithfulness? You struck them, but they felt no pain.[a] You devastated them, yet they refused to accept your correction. They made their faces harder than rock and refused to return to you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they did not weaken,” “they did not become sick,” or “they did not writhe.”
    reason: lexical_alternative
  - marker: b
    text: Or “they refused to repent.” The Hebrew says “return,” a prophetic image for turning back to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: are not your eyes on faithfulness?
  simplified_phrase: don’t your eyes look for faithfulness?
  preserved_meaning: Yahweh directs his attention toward covenant faithfulness.
  reasoning_layer_used: lexical decision for עֵינֶיךָ and הֲלוֹא לֶאֱמוּנָה
  rationale: The rewrite keeps the concrete image of God’s eyes while making the idiom natural.
- pob_phrase: you consumed them
  simplified_phrase: You devastated them
  preserved_meaning: God brought severe judgment upon them without necessarily annihilating them.
  reasoning_layer_used: lexical decision for כִּלִּיתָם
  rationale: “Devastated” clearly conveys consuming judgment without implying that no one survived.
- pob_phrase: they refused to accept discipline
  simplified_phrase: they refused to accept your correction
  preserved_meaning: They rejected God’s judgment as both punishment and instruction.
  reasoning_layer_used: lexical decision for מֵאֲנוּ קַחַת מוּסָר
  rationale: “Correction” is more immediately understandable while retaining discipline’s reforming purpose.
interpretive_expansions:
- pob_phrase: they refused to return
  rendering: they refused to return to you
  claim: The return in view is a turning back to Yahweh.
  evidence:
  - Yahweh is directly addressed throughout the verse.
  - The theological decision identifies “return” as covenantal turning back to the LORD.
  confidence: high
  alternatives_preserved:
  - repent
translation_notes:
  risk_flags:
  - risk: “Devastated” does not retain the exact metaphor of consuming.
    mitigation: It preserves the source’s force of severe, potentially ruinous judgment without suggesting total annihilation.
  - risk: The Hebrew behind “felt no pain” can also describe weakness, sickness, or writhing.
    mitigation: The main text follows the POB rendering, and the lexical range is preserved in footnote a.
