translation:
  language: en
  text: But if that nation I spoke against turns away from its evil, then I will relent[a] and not bring on it the disaster I had planned.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “change my mind.” Here “relent” means withdrawing the announced judgment.
    reason: alternative_reading
