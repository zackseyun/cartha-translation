simplification_decisions:
- pob_phrase: concerning a nation and concerning a kingdom
  simplified_phrase: about a nation or kingdom
  preserved_meaning: The pronouncement may concern either kind of political entity.
  reasoning_layer_used: Lexical decisions for עַל, גּוֹי, and מַמְלָכָה.
  rationale: The shorter wording removes repetition while keeping “about” as the main reading.
- pob_phrase: to uproot and to tear down and to destroy
  simplified_phrase: declare that I will uproot it, tear it down, and destroy it
  preserved_meaning: God announces judgment through three distinct acts of destruction.
  reasoning_layer_used: Lexical decisions for לִנְתוֹשׁ, לִנְתוֹץ, and וּלְהַאֲבִיד.
  rationale: A finite clause makes the content of God’s speech immediately clear.
interpretive_expansions:
