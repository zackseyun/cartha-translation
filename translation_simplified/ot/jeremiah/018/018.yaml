translation:
  language: en
  text: Then they said, “Come, let us plot against Jeremiah. After all, instruction from the priest, advice from the wise man, and a word from the prophet will not disappear. Come, let us use our tongues to strike him[a] and ignore everything he says.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, attack him through slander or accusation.
    reason: lexical_alternative
