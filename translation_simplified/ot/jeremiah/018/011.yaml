translation:
  language: en
  text: 'So now, say to the men of Judah and the residents of Jerusalem, “This is what Yahweh says: Look! I am shaping disaster against you[a] and making plans against you. Every man among you, please turn back from his own evil way. Make your ways and your deeds good.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Shaping” continues the picture of a potter in the surrounding passage; it may also be translated “forming calamity.”
    reason: lexical_alternative
