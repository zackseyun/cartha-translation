  preserved_meaning: The words introduce a command based on the preceding potter image.
  reasoning_layer_used: Lexical decision for וְעַתָּה and ordinary English syntax
  rationale: “So now” keeps both the transition and its connection to what came before.
- pob_phrase: inhabitants of Jerusalem
  simplified_phrase: residents of Jerusalem
  preserved_meaning: The message is addressed to those living in Jerusalem.
  reasoning_layer_used: Lexical decision for יֹשְׁבֵי יְרוּשָׁלַם
  rationale: “Residents” is the common modern equivalent of “inhabitants.”
- pob_phrase: each man from his evil way
  simplified_phrase: Every man among you ... from his own evil way
  preserved_meaning: The community is addressed man by man, and each hearer must abandon his evil conduct.
  reasoning_layer_used: Lexical and theological decisions on distributive masculine language
  rationale: The wording preserves the masculine form and each man’s personal responsibility.
