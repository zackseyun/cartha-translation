translation:
  language: en
  text: Therefore, hand their children over to famine and surrender them to the power of the sword. Let their wives lose their children and become widows. Let their men die, and let their young men be struck down by the sword in battle.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: give their children over to famine, and hand them over to the power of the sword
  simplified_phrase: hand their children over to famine and surrender them to the power of the sword
  preserved_meaning: The children are handed over to starvation and violent death under the sword's power.
  reasoning_layer_used: Lexical decisions for תֵּן ... לָרָעָב, וְהַגִּרֵם, and עַל יְדֵי חֶרֶב
  rationale: The recast avoids repetitive wording while retaining judicial surrender and the sword image.
- pob_phrase: Let their wives become bereaved and widowed
  simplified_phrase: Let their wives lose their children and become widows
  preserved_meaning: The wives suffer the loss of their children and husbands.
  reasoning_layer_used: Lexical decisions for שַׁכֻּלוֹת and וְאַלְמָנוֹת
  rationale: Naming the two losses is clearer than using the less familiar terms “bereaved” and “widowed.”
- pob_phrase: let their men be slain by death
  simplified_phrase: Let their men die
  preserved_meaning: The adult men suffer fatal destruction without specifying how they die.
  reasoning_layer_used: Lexical rationale for הֲרֻגֵי מָוֶת and independent grounding review
  rationale: This natural wording preserves the fatal result without implying execution or another specific means.
