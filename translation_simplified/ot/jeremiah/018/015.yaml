translation:
  language: en
  text: For my people have forgotten me. They burn incense to what is empty and worthless.[a] They have been made to stumble in their ways, leaving the ancient paths to walk on side roads—on a road that is not prepared.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “to vanity,” “to what is false,” or “to idols,” referring here to worthless worship.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead be rendered, “They caused them to stumble”; the agent is not stated clearly.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they burn incense to emptiness
  simplified_phrase: they burn incense to what is empty and worthless
  preserved_meaning: Their worship is directed toward something empty, false, and without value.
  reasoning_layer_used: Lexical and theological decisions for לַשָּׁוְא
  rationale: This explains the image without narrowing it to idols.
- pob_phrase: They have stumbled in their ways, in the ancient paths
  simplified_phrase: They have been made to stumble in their ways, leaving the ancient paths
  preserved_meaning: The people were caused to stumble and depart from the long-established way.
  reasoning_layer_used: Lexical decision for וַיַּכְשִׁלוּם and the Jeremiah 6:16 cross-reference
  rationale: The passive preserves the causative force without inventing an agent.
- pob_phrase: to walk on side roads, on a road not built up
  simplified_phrase: to walk on side roads—on a road that is not prepared
  preserved_meaning: They walk on an improper, unprepared route instead of the established path.
  reasoning_layer_used: Lexical decisions for נְתִיבוֹת and דֶּרֶךְ לֹא סְלוּלָה
  rationale: This keeps the road image while replacing awkward construction language.
