  simplified_phrase: every plan they have made to kill me
  preserved_meaning: Their counsel is a deliberate plot aimed at Jeremiah’s death.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The direct wording makes the murderous purpose clear in ordinary English.
- pob_phrase: their iniquity ... their sin from before you
  simplified_phrase: their wrongdoing ... their sin from your sight
  preserved_meaning: The two moral terms remain distinct, and their sin still stands before God.
  reasoning_layer_used: POB lexical decisions for עֲוֺנָם, חַטָּאתָם, and מִלְּפָנֶיךָ
  rationale: Common wording clarifies the judicial image without merging wrongdoing and sin.
- pob_phrase: Let them be made to stumble before you; in the time of your anger
  simplified_phrase: Make them stumble before you. When the time of your anger comes
  preserved_meaning: Jeremiah asks God to bring about their fall and act when his anger is expressed.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: Two direct sentences preserve the causative image and the prayer’s severity.
