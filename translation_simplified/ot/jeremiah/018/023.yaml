translation:
  language: en
  text: But you, Yahweh, know every plan they have made to kill me. Do not cover over[a] their wrongdoing, and do not blot out their sin from your sight. Make them stumble before you. When the time of your anger comes, act against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image may also be translated “forgive their wrongdoing.”
    reason: lexical_alternative
