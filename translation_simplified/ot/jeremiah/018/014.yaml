translation:
  language: en
  text: Does Lebanon’s snow ever leave the rock out in the open country?[a] Or are cold, flowing waters from afar ever uprooted?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may also mean “the field rock” or “the crag of the countryside.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “foreign” or “strange waters,” probably meaning water flowing from a distant source.
    reason: lexical_alternative
