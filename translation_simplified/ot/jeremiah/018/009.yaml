simplification_decisions:
- pob_phrase: concerning a nation and concerning a kingdom
  simplified_phrase: about a nation and a kingdom
  preserved_meaning: God speaks with reference to both the nation and the kingdom.
  reasoning_layer_used: Lexical decisions for עַל, גּוֹי, and מַמְלָכָה
  rationale: “About” is clearer common English and does not imply hostility.
- pob_phrase: to build and to plant
  simplified_phrase: saying that I will build and plant them
  preserved_meaning: God announces constructive action using both the building and planting images.
  reasoning_layer_used: Lexical decisions for בנה and נטע and the immediate context
  rationale: The recast clarifies the announced action while preserving both images and both named referents.
- pob_phrase: I may speak
  simplified_phrase: I may speak
  preserved_meaning: This remains a contingent prophetic scenario rather than a flat declaration.
  reasoning_layer_used: Theological decision on divine conditionality
  rationale: “May” preserves the conditional framework of Jeremiah 18:7–10.
interpretive_expansions:
- pob_phrase: to build and to plant
  rendering: saying that I will build and plant them
  claim: The infinitives describe what God may announce that he will do to the nation and kingdom.
  evidence:
  - The first-person verb identifies God as the speaker.
  - Jeremiah 18:7–10 concerns God's announced actions toward nations.
  - The POB rationale identifies the nation or kingdom as the implied object of “plant.”
  confidence: high
  alternatives_preserved:
  - to build and to plant
