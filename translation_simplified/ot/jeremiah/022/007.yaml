translation:
  language: en
  text: I will set apart destroyers to come against you.[a] Each will have weapons. They will cut down your finest cedars and throw them into the fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “consecrate destroyers,” meaning that God designates them for this work of judgment.
    reason: lexical_alternative
