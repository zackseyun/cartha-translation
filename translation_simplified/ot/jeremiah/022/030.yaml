translation:
  language: en
  text: 'Yahweh says: “Record this man as childless.[a] He will not succeed in his lifetime. No descendant of his will successfully sit on David’s throne and rule Judah again.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “childless” means that none of his descendants will successfully reign as king on David’s throne in Judah, not that he will have no biological children.
    reason: lexical_alternative
