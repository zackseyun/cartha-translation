  preserved_meaning: He is to be officially reckoned as having no successful royal heir.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Record” conveys the administrative force while retaining the key term “childless.”
- pob_phrase: a man who will not prosper in his days; for none of his offspring will prosper to sit on the throne of David and rule again in Judah
  simplified_phrase: He will not succeed in his lifetime. No descendant of his will successfully sit on David’s throne and rule Judah again.
