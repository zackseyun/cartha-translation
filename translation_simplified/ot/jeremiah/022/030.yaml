  reasoning_layer_used: POB lexical decisions and theological decision on Davidic kingship
  rationale: Two direct sentences and adverbial “successfully” make the linked royal judgment clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “childless” as denying biological descendants.
    mitigation: The footnote explains its dynastic meaning and its scope across all descendants.
  - risk: “Successfully sit” could be read as referring only to gaining the throne.
    mitigation: The linked phrase “and rule Judah again” makes successful reign the intended sense.
