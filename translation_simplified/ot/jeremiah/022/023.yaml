translation:
  language: en
  text: You live in Lebanon[a] and make your nest among the cedars. How you will groan[b] when pain comes upon you—the pain of a woman in labor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lebanon and its cedars likely picture the royal palace built with cedar from Lebanon and the rulers’ lofty sense of security.
    reason: cultural_note
  - marker: b
    text: Or, “how you will be pitied.” The Hebrew verb is difficult, but “groan” fits the surrounding image of labor pains.
    reason: lexical_alternative
