translation:
  language: en
  text: 'This is what Yahweh says about the royal house of Judah[a]: “To me, you are like Gilead, like the summit of Lebanon. Yet I will surely make you a wilderness—cities left empty.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew “house of the king of Judah” may refer to the king’s palace, dynasty, or wider royal establishment.
    reason: lexical_alternative
  - marker: b
    text: The final Hebrew phrase may also be understood as cities becoming uninhabited as a result of judgment.
    reason: lexical_alternative
