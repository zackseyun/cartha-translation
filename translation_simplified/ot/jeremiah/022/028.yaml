translation:
  language: en
  text: Is this man Coniah[b] like a despised, shattered pot[a], or like a jar no one wants? Why were he and his descendants hurled away and thrown into a land they had never known?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may instead mean “a despised, shattered idol or image,” but the nearby reference to a vessel favors the pottery image.
    reason: lexical_alternative
  - marker: b
    text: Coniah is a shortened form of the name Jeconiah, the king mentioned in Jeremiah 24:1 and 27:20.
    reason: cross_reference
simplification_decisions:
- pob_phrase: a despised, broken vessel, or a vessel in which there is no delight
  simplified_phrase: like a despised, shattered pot, or like a jar no one wants
  preserved_meaning: Coniah is compared to broken pottery and an unwanted container.
  reasoning_layer_used: Lexical decisions for הָעֶצֶב, נָפוּץ, and כְּלִי אֵין חֵפֶץ בּוֹ
  rationale: Concrete pottery terms and ordinary wording make the image clear while preserving its rejection and shame.
- pob_phrase: he and his offspring
  simplified_phrase: he and his descendants
  preserved_meaning: The judgment includes Coniah and his family line.
  reasoning_layer_used: Lexical decision for הוּא וְזַרְעוֹ
  rationale: “Descendants” is clearer in this royal family context than “offspring.”
- pob_phrase: have been hurled out and cast into a land that they did not know
  simplified_phrase: were hurled away and thrown into a land they had never known
  preserved_meaning: They were forcibly expelled to an unfamiliar foreign land.
  reasoning_layer_used: Lexical decisions for הוּטֲלוּ, וְהֻשְׁלְכוּ, and אֲשֶׁר לֹא יָדָעוּ
  rationale: The rewrite keeps both forceful verbs while using natural English for exile to an unfamiliar land.
