translation:
  language: en
  text: When you were prosperous[a], I spoke to you. But you said, “I will not listen.” You have been this way since your youth, because you have not listened to my voice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “living in ease” or “secure.” The Hebrew word can include all these ideas.
    reason: lexical_alternative
  - marker: b
    text: Here “listen” also includes the sense of obeying.
    reason: lexical_alternative
