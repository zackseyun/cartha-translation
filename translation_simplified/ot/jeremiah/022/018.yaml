  reasoning_layer_used: Lexical decisions for לָכֵן, כֹּה אָמַר יְהוָה, and אֶל
  rationale: Ordinary English preserves the conclusion, prophetic formula, divine name, and subject.
- pob_phrase: They will not lament for him
  simplified_phrase: They will not mourn for him with funeral cries
  preserved_meaning: The unspecified group will give Jehoiakim no formal funeral lament.
  reasoning_layer_used: Lexical decision for לֹא יִסְפְּדוּ לוֹ and grounding review
  rationale: “Mourn” is familiar, while “funeral cries” preserves the verb’s formal sense and “they” avoids a universal claim.
- pob_phrase: Alas
