translation:
  language: en
  text: 'So this is what Yahweh says about Jehoiakim son of Josiah, king of Judah: “They will not mourn for him with funeral cries, ‘Oh, my brother!’ or ‘Oh, sister!’ They will not mourn for him with the cries, ‘Oh, lord!’[a] or ‘Oh, his majesty!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “lord” is a title for a ruler or superior, not the divine name.
    reason: lexical_alternative
