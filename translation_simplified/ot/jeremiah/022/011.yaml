- pob_phrase: For thus says Yahweh concerning
  simplified_phrase: For this is what Yahweh says about
  preserved_meaning: The words introduce Yahweh’s message about Shallum while connecting it to the preceding statement.
  reasoning_layer_used: POB lexical decision for כִּי כֹה אָמַר and אֶל
  rationale: The common phrasing preserves both the explanatory “For” and the prophetic formula.
- pob_phrase: who reigned in place of Josiah his father
  simplified_phrase: He ruled in place of his father Josiah.
  preserved_meaning: Shallum succeeded his father as Judah’s ruler.
  reasoning_layer_used: POB lexical decision for הַמֹּלֵךְ תַּחַת and אָבִיו
  rationale: A separate sentence removes the dense relative clause without weakening the royal succession.
- pob_phrase: 'who went out from this place: He shall never return there again'
  simplified_phrase: He left this place and will never return to it.
  preserved_meaning: Shallum departed from the place in view and would permanently fail to return.
  reasoning_layer_used: POB lexical decisions for יָצָא and לֹא יָשׁוּב שָׁם עוֹד
  rationale: “Left” and “return to it” make the movement and destination immediately clear.
