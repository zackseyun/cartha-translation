translation:
  language: en
  text: Yahweh declares, “As surely as I live, even if you, Coniah[a] son of Jehoiakim, king of Judah, were a signet ring on my right hand,[b] I would tear you off even from there.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coniah is also called Jeconiah elsewhere.
    reason: alternative_reading
  - marker: b
    text: A signet ring carried a royal seal and represented authority, honor, and value.
    reason: cultural_note
simplification_decisions:
- pob_phrase: As I live, declares Yahweh
  simplified_phrase: Yahweh declares, “As surely as I live
  preserved_meaning: Yahweh solemnly swears by his own life.
  reasoning_layer_used: Lexical decision for חַי אָנִי and theological decision for יהוה
  rationale: The reordered formula and “surely” make the solemn oath clear.
- pob_phrase: even if Coniah son of Jehoiakim, king of Judah, were
  simplified_phrase: even if you, Coniah son of Jehoiakim, king of Judah, were
  preserved_meaning: Yahweh directly addresses Coniah while retaining the POB attachment of the royal title.
  reasoning_layer_used: Source grammar and name-form decision for כָּנְיָהוּ
  rationale: Adding “you” clarifies the direct address without reassigning the title.
- pob_phrase: even from there I would tear you off
  simplified_phrase: I would tear you off even from there
  preserved_meaning: Yahweh would forcefully remove Coniah even from that honored position.
  reasoning_layer_used: Lexical decisions for מִשָּׁם and אֶתְּקֶנְךָּ
  rationale: Natural English order preserves the emphasis and forceful image.
