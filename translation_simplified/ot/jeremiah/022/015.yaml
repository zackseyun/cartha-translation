translation:
  language: en
  text: Do you prove you are king by trying to outdo others with cedar buildings?[a] Did not your father eat and drink while also practicing justice and righteousness? That is why things went well for him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew expression may also mean “vie for cedar” or “be eager about cedar”; it probably refers to rivalry displayed through luxurious cedar construction.
    reason: lexical_alternative
  - marker: b
    text: “Justice and righteousness” may also be translated “justice and what is right.”
    reason: alternative_reading
