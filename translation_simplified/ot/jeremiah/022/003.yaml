  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
  footnotes:
  - marker: a
    text: Or 'Do what is just and right.' The Hebrew uses two terms, 'justice' and 'righteousness,' which together express faithful public and moral conduct.
    reason: lexical_alternative
  - marker: b
    text: '''Resident foreigner'' translates a term for a non-native living among Israel, often socially vulnerable; traditionally ''sojourner.'''
    reason: cultural_note
  - marker: c
    text: Or 'Do not wrong or do violence to' the resident foreigner, the fatherless, and the widow.
    reason: alternative_reading
