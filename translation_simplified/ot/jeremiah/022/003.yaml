translation:
  language: en
  text: 'This is what Yahweh says: Uphold justice and do what is right. Rescue anyone who has been robbed from the oppressor’s grip. Do not oppress or commit violence against foreigners living among you, the fatherless, or widows. Do not spill innocent blood in this place.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do justice and righteousness
  simplified_phrase: Uphold justice and do what is right
  preserved_meaning: The two commands still require just public conduct and moral uprightness.
  reasoning_layer_used: Lexical and theological decisions on מִשְׁפָּט וּצְדָקָה
  rationale: This explains righteousness while keeping it distinct from justice.
- pob_phrase: deliver the robbed person from the hand of the oppressor
  simplified_phrase: Rescue anyone who has been robbed from the oppressor’s grip
  preserved_meaning: The command requires active intervention for a victim under an oppressor’s control.
  reasoning_layer_used: Lexical decisions on וְהַצִּילוּ, גָזוּל, and מִיַּד עָשׁוֹק
  rationale: “Grip” preserves the hand image as a familiar picture of controlling power.
- pob_phrase: Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence
  simplified_phrase: Do not oppress or commit violence against foreigners living among you, the fatherless, or widows
  preserved_meaning: Both distinct prohibitions directly protect all three vulnerable groups.
  reasoning_layer_used: Lexical and theological decisions on גֵר, אַל תֹּנוּ, and אַל תַּחְמֹסוּ, confirmed by the grounding review
  rationale: The shared object is stated clearly without merging oppression and violence.
translation_notes:
  risk_flags:
  - risk: Replacing “righteousness” with “what is right” makes the biblical term less visible.
    mitigation: The wording retains moral uprightness as a separate command alongside justice.
