translation:
  language: en
  text: 'This is what Yahweh says: “Go and buy a clay flask made by a potter.[a] Take with you some elders from among the people and some elders from among the priests.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term describes a shaped clay vessel, probably with a narrow neck; “jar” or “bottle” are also possible.
    reason: lexical_alternative
