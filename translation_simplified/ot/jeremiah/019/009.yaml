simplification_decisions:
- pob_phrase: the flesh of their sons and the flesh of their daughters
  simplified_phrase: the flesh of their sons and daughters
  preserved_meaning: Both sons and daughters remain explicitly named, and “flesh” preserves the horror of the judgment.
  reasoning_layer_used: POB lexical decisions for בְּשַׂר, בְּנֵיהֶם, and בְּנֹתֵיהֶם
