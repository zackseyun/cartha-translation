translation:
  language: en
  text: The houses of Jerusalem and the houses of Judah’s kings will become like Topheth, an unclean place. This includes every house where people burned incense on the rooftop to all the heavenly bodies and poured out drinks as offerings to other gods.
  philosophy: optimal-equivalence
