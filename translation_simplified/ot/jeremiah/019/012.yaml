translation:
  language: en
  text: “I will do the same to this place and to the people who live here,” declares Yahweh. “I will make this city like Topheth.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Topheth was a place in the Valley of Ben Hinnom associated with child sacrifice, defilement, and judgment. The comparison means that Jerusalem will become a place of horror and uncleanness.
    reason: cultural_note
