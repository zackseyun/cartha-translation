- pob_phrase: So I will do to this place
  simplified_phrase: I will do the same to this place
  preserved_meaning: Yahweh will carry out here what the preceding sign and message announced.
  reasoning_layer_used: Lexical decision for כֵּן and immediate context
  rationale: “The same” makes the connection to the preceding judgment clear without specifying more than the text does.
- pob_phrase: and to its inhabitants
  simplified_phrase: and to the people who live here
  preserved_meaning: The announced action affects the residents as well as the place.
  reasoning_layer_used: Lexical decision for וּלְיֹשְׁבָיו
  rationale: The common phrase replaces the formal word “inhabitants” while preserving its reference.
- pob_phrase: making this city like Topheth
  simplified_phrase: I will make this city like Topheth
  preserved_meaning: Yahweh will cause Jerusalem to become comparable to Topheth.
  reasoning_layer_used: Lexical decisions for וְלָתֵת and כְּתֹפֶת
  rationale: A new finite sentence makes the result clear while retaining the comparison.
