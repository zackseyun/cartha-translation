translation:
  language: en
  text: They have built places of worship for Baal[a] so they can burn their sons in the fire as burnt offerings to Baal. I did not command this or speak of it. Such a thing did not arise in my heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “high places,” sites used for worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the high places of Baal
  simplified_phrase: places of worship for Baal
  preserved_meaning: They built sites for the worship of Baal.
  reasoning_layer_used: The lexical decision identifies “high places” as an established term for idolatrous worship sites.
  rationale: The main text explains the unfamiliar ritual term, while the footnote preserves its Hebrew image.
- pob_phrase: to burn their sons in the fire as burnt offerings to Baal
  simplified_phrase: so they can burn their sons in the fire as burnt offerings to Baal
  preserved_meaning: The sites were built for sacrificing their sons by fire to Baal.
  reasoning_layer_used: The lexical decisions retain “sons,” “in the fire,” and the technical sacrificial meaning of “burnt offerings.”
  rationale: The purpose clause is recast in ordinary English without weakening the horror or sacrificial meaning.
- pob_phrase: something I did not command or speak, nor did it arise in my heart
  simplified_phrase: I did not command this or speak of it. Such a thing did not arise in my heart.
  preserved_meaning: God neither authorized nor voiced this practice, and it was wholly foreign to his heart.
  reasoning_layer_used: The lexical and theological decisions preserve both “speak of” and the anthropomorphic heart expression.
  rationale: Two short sentences clarify the denial while retaining the source-language image of something arising in God's heart.
