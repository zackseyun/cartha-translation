translation:
  language: en
  text: Tell them, “This is what Yahweh of hosts says:[a] I will break this people and this city in the same way someone breaks a potter’s vessel. It can never be repaired. People will bury the dead in Topheth because there will be nowhere else to bury them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and refers broadly to the forces under Yahweh’s command.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And you shall say to them
  simplified_phrase: Tell them
  preserved_meaning: Jeremiah is commanded to deliver this message to the people with him.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct command is clearer than the formal future construction.
- pob_phrase: as one breaks a potter’s vessel, which cannot be repaired again
  simplified_phrase: in the same way someone breaks a potter’s vessel. It can never be repaired.
  preserved_meaning: The enacted breaking pictures irreversible judgment on the people and city.
  reasoning_layer_used: POB lexical decisions for כָּכָה, אֶשְׁבֹּר, and לֹא יוּכַל לְהֵרָפֵה עוֹד
  rationale: Two sentences preserve the pottery image and make its irreversible result immediately clear.
- pob_phrase: because there is no place else to bury
  simplified_phrase: because there will be nowhere else to bury them
  preserved_meaning: Burial in Topheth results from the lack of any other burial space.
  reasoning_layer_used: POB lexical decision for מֵאֵין מָקוֹם לִקְבּוֹר
  rationale: The recast clause states the same cause in ordinary English.
interpretive_expansions:
- pob_phrase: they will bury
  rendering: People will bury the dead
  claim: The unstated object of the burial is the dead.
  evidence:
