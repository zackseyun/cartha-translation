translation:
  language: en
  text: In this place, I will make the plan of Judah and Jerusalem fail. I will make their people fall by the sword before their enemies, at the hands of those who are seeking to take their lives. I will give their dead bodies as food to the birds of the sky and the animals of the earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will frustrate the plan of Judah and Jerusalem
  simplified_phrase: I will make the plan of Judah and Jerusalem fail
  preserved_meaning: God will render their plan ineffective.
  reasoning_layer_used: Lexical decision for וּבַקֹּתִי and עֲצַת
  rationale: The wording states the same action in more familiar English.
- pob_phrase: by the hand of those who seek their life
  simplified_phrase: at the hands of those who are seeking to take their lives
  preserved_meaning: Their pursuers intend to kill them and will carry out the judgment.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The common idiom clarifies the threat while retaining the image of seeking their lives.
- pob_phrase: their corpses as food to the birds of the heavens and to the beasts of the earth
  simplified_phrase: their dead bodies as food to the birds of the sky and the animals of the earth
  preserved_meaning: Their bodies will remain dishonorably exposed for birds and land animals to eat.
  reasoning_layer_used: Lexical decisions for נִבְלָתָם, עוֹף הַשָּׁמַיִם, and בְהֵמַת הָאָרֶץ
  rationale: Common terms make the grim result immediately understandable without weakening it.
interpretive_expansions:
- pob_phrase: I will make them fall
  rendering: I will make their people fall
  claim: The pronoun refers to the people represented by Judah and Jerusalem, not to the locations themselves.
  evidence:
  - The people are the ones who can fall by the sword and leave dead bodies.
  confidence: high
- pob_phrase: those who seek their life
  rendering: those who are seeking to take their lives
  claim: Seeking their lives means pursuing them with the intent to kill.
  evidence:
  - POB footnote b explicitly explains the Hebrew idiom this way.
  confidence: high
