translation:
  language: en
  text: They plan to make my people forget my name by telling their dreams, each man to his neighbor. In the same way, their fathers forgot my name because of Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for Baal” or “through Baal.” The Hebrew indicates that devotion to Baal led them to forget the LORD’s name.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who plan to make my people forget my name
  simplified_phrase: They plan to make my people forget my name
  preserved_meaning: The false prophets deliberately seek to cause God’s people to forget his covenantal name.
  reasoning_layer_used: Lexical decisions for הַחֹשְׁבִים, לְהַשְׁכִּיחַ, and שְׁמִי
  rationale: An independent clause is easier to read while retaining deliberate intent, causation, and literal name language.
- pob_phrase: by their dreams that they tell, each man to his neighbor
  simplified_phrase: by telling their dreams, each man to his neighbor
  preserved_meaning: Their reported dreams are the means used to spread forgetfulness from person to person.
  reasoning_layer_used: Lexical decisions for בַּחֲלֹמוֹתָם, יְסַפְּרוּ, and אִישׁ לְרֵעֵהוּ
  rationale: The active verbal form removes an awkward relative clause without merging the dreams with the act of telling.
- pob_phrase: just as their fathers forgot my name because of Baal
  simplified_phrase: In the same way, their fathers forgot my name because of Baal
  preserved_meaning: The present scheme repeats the ancestors’ earlier apostasy associated with Baal.
  reasoning_layer_used: Lexical decision for כַּאֲשֶׁר and theological decision on covenantal name language
  rationale: A new sentence makes the historical comparison clear while preserving both “fathers” and “my name.”
translation_notes:
  risk_flags:
  - risk: “Because of Baal” may sound more narrowly causal than the Hebrew association allows.
    mitigation: The footnote preserves the alternatives “for Baal” and “through Baal.”
