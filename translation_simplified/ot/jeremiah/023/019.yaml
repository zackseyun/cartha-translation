translation:
  language: en
  text: Look! Yahweh’s storm has swept out in wrath.[a] The violent storm is whirling, and it will whirl down on the heads of the wicked.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew speaks of this future judgment as already in motion because it is certain.
    reason: simplification_note
  - marker: b
    text: Or “it will crash down on the heads of the wicked.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the storm of Yahweh has gone out in wrath
  simplified_phrase: Yahweh’s storm has swept out in wrath
  preserved_meaning: Yahweh’s storm of judgment is pictured as already moving forward in his wrath.
  reasoning_layer_used: Lexical and theological decisions on the divine name, wrath, and prophetic perfect.
  rationale: “Swept out” makes the storm’s movement natural while retaining the completed prophetic force.
- pob_phrase: a whirling tempest
  simplified_phrase: The violent storm is whirling
  preserved_meaning: The storm twists with intense and destructive motion.
  reasoning_layer_used: Lexical decisions for וְסַעַר and מִתְחוֹלֵל.
  rationale: A direct clause replaces the less familiar word “tempest” without weakening the image.
- pob_phrase: it will whirl down on the head of the wicked
  simplified_phrase: it will whirl down on the heads of the wicked
  preserved_meaning: The storm will descend violently upon wicked people in judgment.
  reasoning_layer_used: Lexical decisions for יָחוּל and the Hebrew collective idiom.
  rationale: Plural “heads” expresses the Hebrew collective naturally while preserving the bodily image.
