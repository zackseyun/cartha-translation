translation:
  language: en
  text: “Look, I am against those who proclaim lying dreams as prophecy,” declares Yahweh. “They tell these dreams and lead my people astray with their lies and recklessness.[a] I did not send them or command them. They are no help at all to this people,” declares Yahweh.
