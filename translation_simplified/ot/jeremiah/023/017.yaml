simplification_decisions:
- pob_phrase: They keep saying to
  simplified_phrase: They repeatedly tell
  preserved_meaning: The false prophets give the same assurance again and again.
  reasoning_layer_used: Lexical decision for אֹמְרִים אָמוֹר
  rationale: “Repeatedly tell” naturally expresses the phrase’s ongoing, emphatic force.
- pob_phrase: walks in the stubbornness of his own heart
  simplified_phrase: keeps living according to their own stubborn heart
  preserved_meaning: Each person habitually lives according to their own obstinate will.
  reasoning_layer_used: Lexical decisions for וְכֹל הֹלֵךְ and בִּשְׁרִרוּת לִבּוֹ
  rationale: “Living according to” explains the ethical walking image without adding a new path image.
- pob_phrase: No disaster will come upon you
  simplified_phrase: No disaster will come to you
  preserved_meaning: They falsely promise that no calamity will reach the hearers.
  reasoning_layer_used: Lexical decision for לֹא תָבוֹא עֲלֵיכֶם רָעָה
  rationale: “Come to you” is ordinary English and retains the image of approaching disaster.
