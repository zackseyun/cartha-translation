translation:
  language: en
  text: 'They repeatedly tell those who despise me,[a] “Yahweh has spoken: You will have peace.” They also tell everyone who keeps living according to their own stubborn heart, “No disaster will come to you.”'
  philosophy: optimal-equivalence
  footnotes:
