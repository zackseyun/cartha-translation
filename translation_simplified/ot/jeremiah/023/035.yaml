translation:
  language: en
  text: Each man should say to his neighbor and to his brother, “What answer has Yahweh given? What has Yahweh said?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus each man shall say
  simplified_phrase: Each man should say
  preserved_meaning: The wording still directs every man how to speak.
  reasoning_layer_used: Lexical decisions for כֹּה, תֹאמְרוּ, and אִישׁ
  rationale: The direct wording replaces the formal “thus” and “shall” while retaining the command and distributive masculine form.
- pob_phrase: What has Yahweh answered?
  simplified_phrase: What answer has Yahweh given?
  preserved_meaning: The question asks what response Yahweh has provided.
  reasoning_layer_used: Lexical decision for עָנָה
  rationale: The noun-based English expression is easier to understand than the awkward literal wording.
- pob_phrase: What has Yahweh spoken?
  simplified_phrase: What has Yahweh said?
  preserved_meaning: The second question still asks about Yahweh’s speech.
  reasoning_layer_used: Lexical decision for דִּבֶּר
  rationale: “Said” is the listed plain-language alternative and preserves the distinct second question.
translation_notes:
  risk_flags:
  - risk: “Brother” may be understood only as a biological relative.
    mitigation: It is retained because the source and POB deliberately preserve the masculine kinship term.
