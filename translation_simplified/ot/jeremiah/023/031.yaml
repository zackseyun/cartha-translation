  reasoning_layer_used: Lexical alternatives for הַלֹּקְחִים and וַיִּנְאֲמוּ, supported by the POB footnote
  rationale: “Use” avoids suggesting that the prophets physically grip their tongues.
- pob_phrase: declares Yahweh
