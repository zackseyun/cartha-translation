translation:
  language: en
  text: “Look, I am against the prophets,” declares Yahweh, “who use their own tongues and proclaim, ‘A declaration!’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “who use their tongues and say, ‘Oracle!’” The wording is terse and likely mocks their attempt to make their own words sound authoritative.
