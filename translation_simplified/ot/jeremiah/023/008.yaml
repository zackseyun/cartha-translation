translation:
  language: en
  text: Instead, they will swear, “As Yahweh lives, who brought Israel’s descendants up and brought them in from the northern land and from every land where I had driven them.” Then they will live on their own soil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: but, ‘As Yahweh lives’
  simplified_phrase: Instead, they will swear, “As Yahweh lives”
  preserved_meaning: The new oath replaces the former oath formula while retaining its solemn force.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Instead” and “will swear” make the corrective oath structure clear in ordinary English.
- pob_phrase: the offspring of the house of Israel
  simplified_phrase: Israel’s descendants
  preserved_meaning: The phrase still refers collectively to the people descended from Israel.
  reasoning_layer_used: POB lexical decision for זֶרַע בֵּית יִשְׂרָאֵל
  rationale: “Israel’s descendants” avoids the less familiar phrase “offspring of the house.”
- pob_phrase: who brought up and who brought in ... and they shall dwell
  simplified_phrase: who brought ... up and brought them in ... Then they will live
  preserved_meaning: Yahweh both delivers the people from dispersion and restores them to their homeland.
  reasoning_layer_used: POB theological decision on exodus and return imagery
  rationale: The paired restoration actions remain distinct, and the result is stated in a shorter sentence.
interpretive_expansions:
- pob_phrase: but, ‘As Yahweh lives’
  rendering: Instead, they will swear, “As Yahweh lives”
  claim: The quoted words are a replacement oath spoken by the people.
  evidence:
