  - But rather, “As Yahweh lives”
translation_notes:
  risk_flags:
  - risk: The shift from “Yahweh” to “I” inside the quotation may surprise readers.
    mitigation: The wording retains the POB and Hebrew pronoun shift rather than silently smoothing it.
  - risk: Readers could attach “from the northern land” only to the nearest verb.
    mitigation: Keeping both restoration verbs together before both source locations preserves their shared scope.
