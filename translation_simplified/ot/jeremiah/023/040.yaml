translation:
  language: en
  text: I will bring everlasting public shame and disgrace on you, and it will never be forgotten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shame and disgrace that will continue indefinitely.” The Hebrew word translated “everlasting” can refer to enduring or indefinite perpetuity, depending on the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: put on you everlasting reproach and everlasting disgrace
  simplified_phrase: bring everlasting public shame and disgrace on you
  preserved_meaning: God will impose enduring public dishonor and disgrace on the addressees.
  reasoning_layer_used: Lexical decisions for נתן, חרפה, כלמות, and עולם, together with the judgment-oracle context.
  rationale: “Bring ... on you” states the idiom naturally, while “public shame” conveys the social force of “reproach.”
- pob_phrase: which will not be forgotten
  simplified_phrase: and it will never be forgotten
  preserved_meaning: The imposed shame and disgrace will remain in memory.
  reasoning_layer_used: The lexical decision identifies the Hebrew verb as passive and the preceding pair as collective.
  rationale: A new coordinated clause is easier to follow than the relative clause.
interpretive_expansions:
- pob_phrase: reproach
  rendering: public shame
  claim: The reproach involves shame experienced before others, not merely an inward feeling.
  evidence:
  - The POB lexical rationale defines חֶרְפָּה as reproach, scorn, or public shame.
  confidence: high
  alternatives_preserved:
  - reproach
  - scorn
translation_notes:
  risk_flags:
  - risk: Using one “everlasting” for both nouns may seem to reduce the Hebrew repetition.
    mitigation: Its scope naturally covers both “public shame” and “disgrace,” preserving the duration of each.
  - risk: “Everlasting” may be understood as strict metaphysical eternity.
    mitigation: The anchored footnote preserves the POB's contextual alternative of indefinite perpetuity.
