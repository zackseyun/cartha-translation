translation:
  language: en
  text: 'Therefore, take notice: I will surely lift you up[a] and cast you away from my sight, along with the city I gave to you and your ancestors.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will utterly forget you.” The Hebrew is difficult; it may also mean “I will surely carry you away.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore, behold
  simplified_phrase: Therefore, take notice
  preserved_meaning: The consequence is introduced with a solemn call for attention.
  reasoning_layer_used: Lexical decisions for לָכֵן and הִנְנִי
  rationale: “Take notice” communicates the prophetic force of “behold” in common English.
- pob_phrase: you and the city that I gave to you and to your fathers
  simplified_phrase: along with the city I gave to you and your ancestors
  preserved_meaning: God’s judgment includes the people and the covenantally given city.
  reasoning_layer_used: Lexical decision for אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  rationale: “Ancestors” is clearer than the older collective use of “fathers.”
- pob_phrase: from before my face
  simplified_phrase: from my sight
  preserved_meaning: They are expelled from God’s personal presence.
  reasoning_layer_used: Lexical decision for מֵעַל פָּנַי
  rationale: “From my sight” keeps the bodily image while sounding natural today.
translation_notes:
  risk_flags:
  - risk: “Lift you up” could sound like exaltation when read alone.
    mitigation: The immediate words “cast you away” preserve its forceful, ironic sense.
  - risk: The difficult Hebrew may mean “utterly forget” rather than “surely lift.”
    mitigation: The main text follows the POB reading, and the alternatives remain in a footnote.
