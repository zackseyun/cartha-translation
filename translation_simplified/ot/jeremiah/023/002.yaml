translation:
  language: en
  text: 'Therefore, this is what Yahweh, the God of Israel, says about[a] the shepherds who tend my people: “You have scattered my flock and driven them away. You have not taken care of them. Now I am about to take care of you by punishing you for your evil deeds,” declares Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against”; the Hebrew can introduce a message directed against the shepherds.
    reason: lexical_alternative
