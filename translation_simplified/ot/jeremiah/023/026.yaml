  preserved_meaning: Their deceptive prophecy originates in their own inner thought and will.
  reasoning_layer_used: POB lexical and theological decisions for תַּרְמִת לִבָּם
  rationale: The relative clause clarifies the source of the deceit while preserving the heart image.
