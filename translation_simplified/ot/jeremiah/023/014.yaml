  text: 'Among the prophets of Jerusalem I have seen something appalling: they commit adultery and walk a path of lies. They encourage evildoers, so that not one man[a] turns back from his evil. To me, all of them are like Sodom, and the people of Jerusalem are like Gomorrah.'
