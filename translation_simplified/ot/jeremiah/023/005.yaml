translation:
  language: en
  text: “A time is coming,” Yahweh declares, “when I will bring forth a righteous Branch[a] from David’s line. He will reign as king, rule wisely,[b] and uphold justice and righteousness in the land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image can also be translated “shoot” or “sprout” and refers to a descendant from David’s royal line.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “rule successfully,” since it may include both wise action and the success that follows.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, days are coming
  simplified_phrase: A time is coming
  preserved_meaning: Yahweh announces a future, divinely appointed time.
  reasoning_layer_used: Lexical rationale for the prophetic formula
  rationale: The simpler phrase keeps the solemn future announcement without the less familiar “Behold.”
- pob_phrase: I will raise up for David
  simplified_phrase: I will bring forth ... from David’s line
  preserved_meaning: Yahweh will provide a royal descendant connected to David.
  reasoning_layer_used: Lexical rationale for וַהֲקִמֹתִי and לְדָוִד
  rationale: The wording makes the dynastic relationship clear while retaining Yahweh as the one who brings the king forth.
- pob_phrase: he will do justice and righteousness in the land
  simplified_phrase: uphold justice and righteousness in the land
  preserved_meaning: The king will govern according to justice and moral rightness.
  reasoning_layer_used: Lexical rationale for מִשְׁפָּט and צְדָקָה
  rationale: “Uphold” is natural English for royal governance and keeps the two distinct source ideas.
interpretive_expansions:
