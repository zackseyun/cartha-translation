translation:
  language: en
  text: For who has stood in Yahweh’s council[a] and seen and heard his word? Who has listened carefully to my word and heard it?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “in Yahweh’s secret or intimate counsel.” Here it refers to the divine council where Yahweh’s plans are made known.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that he should see and hear his word
  simplified_phrase: and seen and heard his word
  preserved_meaning: Standing in Yahweh’s council gives a prophet access to his revealed word.
  reasoning_layer_used: lexical decision for וְיֵרֶא and וְיִשְׁמַע
  rationale: The coordinated verbs make the rhetorical question easier to follow without losing the paired acts of seeing and hearing.
- pob_phrase: has paid attention to my word
  simplified_phrase: has listened carefully to my word
  preserved_meaning: The question concerns attentive listening, not merely noticing sound.
  reasoning_layer_used: lexical decision for הִקְשִׁיב
  rationale: “Listened carefully” expresses active attention in familiar modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “council” only as an earthly governing body.
    mitigation: The footnote identifies it as Yahweh’s divine council while preserving the lexical alternatives.
