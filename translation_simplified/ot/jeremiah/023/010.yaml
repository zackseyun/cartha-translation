translation:
  language: en
  text: The land is full of people who commit adultery. Because of the curse,[a] the land mourns, and the wilderness pastures have dried up. The path they follow is evil, and their strength is not right.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of the oath”; the Hebrew can refer to an oath that invokes a curse.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is terse and may also be rendered “their might is not upright” or “their might is not so.”
    reason: lexical_alternative
