translation:
  language: en
  text: Therefore, their own path will be like slippery places in the dark. They will be driven forward and fall there. “I will bring disaster on them when their year of punishment comes,” declares Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their year of visitation,” meaning the time when God comes to judge or call them to account.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their way will be to them like slippery places in the darkness
  simplified_phrase: their own path will be like slippery places in the dark
  preserved_meaning: Their course turns against them and is as treacherous as slippery ground in darkness.
  reasoning_layer_used: POB lexical decisions for way, slippery places, and darkness
  rationale: This keeps the comparison and its two distinct danger images in natural English.
- pob_phrase: they will be driven along and fall in it
  simplified_phrase: They will be driven forward and fall there
  preserved_meaning: An outside force drives them onward until they fall in that dangerous setting.
  reasoning_layer_used: POB lexical decisions for יִדַּחוּ and וְנָפְלוּ בָהּ
  rationale: “Forward” clarifies the motion without adding an unsupported downward direction.
- pob_phrase: in the year of their punishment
  simplified_phrase: when their year of punishment comes
  preserved_meaning: A determined time of divine judgment will arrive for them.
  reasoning_layer_used: POB lexical decision for שְׁנַת פְּקֻדָּתָם
  rationale: The temporal clause is easier to understand while retaining “year” and “punishment.”
