translation:
  language: en
  text: 'So this is what Yahweh of Armies says about the prophets: “Look! I will feed them wormwood[a] and make them drink poisoned water,[b] because ungodliness has spread from the prophets of Jerusalem throughout the land.”'
  philosophy: optimal-equivalence
  footnotes:
