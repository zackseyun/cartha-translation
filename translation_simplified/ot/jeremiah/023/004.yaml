translation:
  language: en
  text: I will raise up shepherds over them who will care for them as shepherds care for a flock. They will no longer be afraid or discouraged, and not one of them will be missing.[a] This is what Yahweh declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “none will be lacking” or “none will be lost”; the likely sense is that no one in the flock will be missing or unaccounted for.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shepherds who will shepherd them
  simplified_phrase: shepherds over them who will care for them as shepherds care for a flock
  preserved_meaning: God will appoint leaders who faithfully tend his people while the shepherd image remains explicit.
  reasoning_layer_used: lexical and theological decisions on shepherd imagery
  rationale: The explanation makes the repeated shepherd wording natural without removing the metaphor.
- pob_phrase: they will no longer fear, nor be dismayed
  simplified_phrase: They will no longer be afraid or discouraged
  preserved_meaning: The people will be free from both fear and the broader distress caused by harmful leadership.
  reasoning_layer_used: lexical decisions for ירא and חתת plus grounding review
  rationale: “Discouraged” is accessible and preserves a broader sense than intensified terror.
- pob_phrase: declares Yahweh
  simplified_phrase: This is what Yahweh declares
  preserved_meaning: The statement remains Yahweh’s authoritative prophetic declaration.
  reasoning_layer_used: lexical decision for the prophetic formula and divine name
  rationale: A complete sentence makes the closing formula easier to read while retaining Yahweh’s name.
