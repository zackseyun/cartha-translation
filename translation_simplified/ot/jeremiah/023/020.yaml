simplification_decisions:
- pob_phrase: until he has done it, and until he has established
  simplified_phrase: until he has acted and carried out
  preserved_meaning: Yahweh’s judgment continues until his intended action is completed.
  reasoning_layer_used: Lexical decisions for עַד עֲשֹׂתוֹ and וְעַד הֲקִימוֹ
  rationale: The rewrite removes the vague “done it” and the abstract “established” without specifying an unstated action.
- pob_phrase: the purposes of his heart
  simplified_phrase: the purposes of his heart
  preserved_meaning: Yahweh’s deliberate intentions arise from his will and are brought into effect.
  reasoning_layer_used: Lexical decision for מְזִמּוֹת לִבּוֹ
  rationale: The biblical heart image is retained because it expresses intention and will.
translation_notes:
  risk_flags:
  - risk: “Latter days” may sound like a fully defined end-times period.
