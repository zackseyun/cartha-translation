translation:
  language: en
  text: But do not use the phrase “the burden of Yahweh” anymore. For what each man says will become his own burden,[a] and you have twisted the words of the living God—Yahweh of Armies, our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “burden” can also mean a prophetic message; Jeremiah uses both senses here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall no longer mention
  simplified_phrase: do not use the phrase ... anymore
  preserved_meaning: The people are forbidden to keep using this prophetic expression.
  reasoning_layer_used: Lexical decisions for תִזְכְּרוּ and עוֹד.
  rationale: The command is recast in direct, natural English.
- pob_phrase: each man's own word will become his burden
  simplified_phrase: what each man says will become his own burden
  preserved_meaning: Each speaker's own words will turn back on him as a burden.
  reasoning_layer_used: Lexical and theological decisions for the wordplay on מַשָּׂא.
  rationale: The compressed clause is unpacked while repeating “burden” to preserve the wordplay.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh of Armies
  preserved_meaning: Yahweh is named as commander over vast forces.
  reasoning_layer_used: Lexical decision for יְהוָה צְבָאוֹת.
  rationale: “Armies” makes the title's concrete image clearer than “hosts.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “burden” only as a heavy load.
    mitigation: The footnote explains its additional sense of a prophetic message.
