  text: A prophet who has a dream may tell the dream. But anyone who has my word must speak my word faithfully.[a] What do straw and grain have in common? declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “speak my word truthfully” or “speak my true word.” The Hebrew may describe either how the word is spoken or the truth of the word itself.
