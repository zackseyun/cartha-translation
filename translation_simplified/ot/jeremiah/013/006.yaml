translation:
  language: en
  text: After a long time, Yahweh said to me, “Get up and go to Perath.[a] Retrieve the waistband[b] I commanded you to hide there.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perath may refer to the Euphrates.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word may also mean a loincloth, belt, or sash.
    reason: lexical_alternative
  - marker: c
    text: Or “bury there”; the Hebrew word can mean hiding something by burying it.
    reason: lexical_alternative
