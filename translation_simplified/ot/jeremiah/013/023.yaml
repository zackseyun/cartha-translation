  rationale: Repeating the verb makes the shortened clause immediately clear.
- pob_phrase: Then you also can do good
  simplified_phrase: In the same way, you ... cannot do good
  preserved_meaning: Judah's entrenched evil is compared with physical traits that cannot be changed.
  reasoning_layer_used: Theological decision on moral inability through rhetorical analogy
  rationale: The explicit comparison preserves the irony while preventing readers from mistaking it for a claim of ability.
