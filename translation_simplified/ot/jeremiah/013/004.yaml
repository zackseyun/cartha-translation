translation:
  language: en
  text: Take the waistband you bought—the one you are wearing. Get up, go to Perath,[a] and hide it there in a crack in the rock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perath is traditionally identified with the Euphrates, so many translations say “the Euphrates” here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: which is on your waist
  simplified_phrase: the one you are wearing
  preserved_meaning: The waistband is currently being worn on Jeremiah’s body.
  reasoning_layer_used: Lexical decision for עַל מָתְנֶיךָ and immediate context
  rationale: The new wording removes redundant waist language while keeping the garment’s location clear.
- pob_phrase: arise, go to Perath
  simplified_phrase: Get up, go to Perath
  preserved_meaning: Jeremiah is urgently commanded to rise and travel to the named place.
  reasoning_layer_used: Lexical decisions for וְקוּם and פְּרָתָה
  rationale: “Get up” is more natural modern English, while “Perath” preserves the chosen place name.
- pob_phrase: in a crevice of the rock
  simplified_phrase: in a crack in the rock
  preserved_meaning: Jeremiah must conceal the waistband inside a fissure in the rock.
  reasoning_layer_used: Lexical decisions for נְקִיק and הַסָּלַע
  rationale: “Crack” is immediately understandable and is a documented lexical alternative.
translation_notes:
  risk_flags:
  - risk: Readers may assume that Perath is certainly the Euphrates.
    mitigation: The footnote preserves the traditional identification without resolving the debated location.
