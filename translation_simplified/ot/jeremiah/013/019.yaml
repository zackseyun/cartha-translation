translation:
  language: en
  text: The cities of the Negev[a] have been closed off, and there is no one to open them. All Judah has been carried away into exile—completely carried away.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the cities of the south.” The Negev is the southern region of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or possibly “carried away into exile in peace,” though the context more likely emphasizes complete exile.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: are shut up
  simplified_phrase: have been closed off
  preserved_meaning: The cities remain inaccessible after being blocked or closed.
  reasoning_layer_used: Lexical decision for סֻגְּרוּ and the military-disaster context
  rationale: “Closed off” states the image in natural modern English without weakening it.
- pob_phrase: with no one to open them
  simplified_phrase: and there is no one to open them
  preserved_meaning: No one is present to reverse the cities’ closure.
  reasoning_layer_used: Lexical decision for וְאֵין פֹּתֵחַ
  rationale: A full clause is easier to follow while retaining the original image.
- pob_phrase: wholly carried away into exile
  simplified_phrase: completely carried away
  preserved_meaning: The repeated wording stresses that Judah’s forced exile is total.
  reasoning_layer_used: Lexical and theological decisions for הָגְלָת שְׁלוֹמִים
  rationale: “Completely” is more common than “wholly,” and the repetition preserves the emphasis.
