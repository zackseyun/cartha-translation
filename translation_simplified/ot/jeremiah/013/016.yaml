translation:
  language: en
  text: Give the LORD your God the glory due to him before he brings darkness. Do this before your feet stumble on the mountains in the fading light. You will hope for light, but he will make that light deep darkness[a]; he will turn it into gloom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more traditionally, “the shadow of death.” The Hebrew can mean deathly darkness or very deep darkness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Give glory to Yahweh your God
  simplified_phrase: Give the LORD your God the glory due to him
  preserved_meaning: The people are commanded to honor their covenant God as he deserves.
  reasoning_layer_used: Lexical decision for the idiom “give glory” and the divine-name doctrine
  rationale: The wording explains the idiom while following the audited choice to render the divine name as “the LORD.”
- pob_phrase: before your feet stumble on the mountains at twilight
  simplified_phrase: before your feet stumble on the mountains in the fading light
  preserved_meaning: The mountain path becomes dangerous as daylight fails.
  reasoning_layer_used: Lexical decision for הָרֵי נָשֶׁף
  rationale: “Fading light” makes the danger of twilight immediate without removing the mountain image.
- pob_phrase: he will make it deep darkness; he will turn it into gloom
  simplified_phrase: he will make that light deep darkness; he will turn it into gloom
  preserved_meaning: God will transform the hoped-for light into oppressive darkness as judgment.
  reasoning_layer_used: Lexical and theological decisions on divine agency
  rationale: Naming “that light” clarifies the pronoun while preserving both divine actions.
