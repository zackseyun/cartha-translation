translation:
  language: en
  text: “Just as a waistband clings to a man’s waist, I made all the people of Israel and all the people of Judah cling to me,” declares Yahweh, “so that they would be my people—for renown, praise, and glory. But they did not listen to me.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Did not listen” can also mean “did not obey.”
    reason: lexical_alternative
