translation:
  language: en
  text: Yahweh declares, “I will smash them against one another—even a man against his own brother, and fathers together with their sons. I will not spare them, pity them, or show them compassion. I will not hold back from destroying them.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: man against his brother, fathers and sons together
  simplified_phrase: even a man against his own brother, and fathers together with their sons
  preserved_meaning: The judgment violently sets close male family members against one another.
  reasoning_layer_used: lexical and theological decisions on gendered kinship language
  rationale: The recast wording keeps the named family bonds while making the relationship easier to follow.
- pob_phrase: I will not spare, nor will I pity, nor will I have compassion
  simplified_phrase: I will not spare them, pity them, or show them compassion
  preserved_meaning: Yahweh emphatically denies three closely related forms of restraint or mercy.
  reasoning_layer_used: lexical decisions for חמל, חוס, and רחם
  rationale: A direct object and a compact list make the three distinct terms natural in English.
- pob_phrase: from destroying them
  simplified_phrase: I will not hold back from destroying them
  preserved_meaning: Pity or compassion will not cause Yahweh to refrain from the announced destruction.
  reasoning_layer_used: lexical rationale for מֵהַשְׁחִיתָם and applied revisions
  rationale: The added verb states the withholding sense of the Hebrew construction in ordinary English.
interpretive_expansions:
- pob_phrase: from destroying them
  rendering: I will not hold back from destroying them
  claim: The final phrase means that Yahweh will not refrain from carrying out destruction.
  evidence:
  - The POB lexical rationale identifies the construction as withholding from an action.
  - The judgment context links the three denials of mercy with the destruction that follows.
  confidence: high
  alternatives_preserved:
  - so as not to destroy them
translation_notes:
  risk_flags:
  - risk: Splitting the final clause into a separate sentence may make it sound like a fourth item in the threefold denial.
    mitigation: The preceding sentence retains all three mercy terms, while the final sentence clearly expresses their result.
