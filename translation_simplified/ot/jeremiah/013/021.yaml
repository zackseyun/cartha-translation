translation:
  language: en
  text: What will you say when he puts the very people you trained in charge of you?[a][b] Labor pains will grip you like a woman giving birth, will they not?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “when he visits or punishes you,” but here it most likely refers to placing rulers over Judah.
    reason: lexical_alternative
  - marker: b
    text: The word translated “people” can describe chiefs or close companions—those Judah had cultivated who now rule over her.
    reason: lexical_alternative
