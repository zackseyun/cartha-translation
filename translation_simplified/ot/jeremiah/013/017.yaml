- pob_phrase: if you will not listen
  simplified_phrase: if you do not listen
  preserved_meaning: The people fail to hear and heed the prophetic warning.
  reasoning_layer_used: Lexical decision for תִשְׁמָעוּהָ and its footnote
  rationale: The simpler verb form keeps both the auditory sense and implied obedience.
- pob_phrase: my eyes will weep bitterly and run down with tears
  simplified_phrase: I will weep bitterly, with tears streaming from my eyes
  preserved_meaning: The prophet’s intense weeping is pictured through flowing tears.
  reasoning_layer_used: Lexical decisions for וְדָמֹעַ תִּדְמַע and וְתֵרַד עֵינִי דִּמְעָה
  rationale: Natural clause order preserves both the intensification and the vivid tear image.
- pob_phrase: the flock of Yahweh has been taken captive
  simplified_phrase: Yahweh’s flock has been taken captive
  preserved_meaning: Yahweh’s people are pictured as his flock being carried into captivity.
  reasoning_layer_used: Lexical decisions for נִשְׁבָּה, עֵדֶר יְהוָה, and יְהוָה
  rationale: The possessive form is clearer while retaining the divine name, flock image, and precise fate.
