translation:
  language: en
  text: But if you do not listen,[a] my soul will weep in secret because of pride. I will weep bitterly, with tears streaming from my eyes, because Yahweh’s flock has been taken captive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Listen” here also carries the sense of heeding or obeying the warning.
    reason: lexical_alternative
