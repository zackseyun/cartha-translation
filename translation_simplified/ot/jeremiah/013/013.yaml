  preserved_meaning: The judgment includes Judah’s rulers, religious leaders, prophets, and Jerusalem’s whole population.
  reasoning_layer_used: Lexical decisions on יֹשְׁבֵי and the Davidic throne phrase
  rationale: “Everyone” and “rule” make the population list and royal image immediately understandable.
