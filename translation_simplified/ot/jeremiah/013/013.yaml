translation:
  language: en
  text: 'Then say to them, “This is what Yahweh says: Look, I am about to fill everyone in this land with drunkenness—the kings who rule on David’s throne,[a] the priests, the prophets, and everyone in Jerusalem.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These are the kings who succeeded David in his royal line.
    reason: cultural_note
  - marker: b
    text: “Drunkenness” may picture the disorientation of Yahweh’s judgment. The concrete image also connects with the surrounding wineskin imagery.
    reason: lexical_alternative
