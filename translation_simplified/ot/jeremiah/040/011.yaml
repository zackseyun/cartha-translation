translation:
  language: en
  text: 'All the Judeans in Moab, among the Ammonites, in Edom, and in all the other lands also heard the news: the king of Babylon had left some of Judah’s people alive—a remnant[a]—and had put Gedaliah son of Ahikam, son of Shaphan, in charge of them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had left survivors for Judah.” “Remnant” refers to those left alive after a disaster.
    reason: lexical_alternative
