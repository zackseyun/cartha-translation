translation:
  language: en
  text: Then the captain of the guard[a] took Jeremiah and said to him, “Yahweh your God declared that this disaster[b] would come upon this place.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew title literally refers to the chief of the slaughterers or executioners, but it was used for the captain of the guard.
    reason: cultural_note
  - marker: b
    text: Or “calamity”; the Hebrew word can also mean evil or harm, but here it refers to the judgment on Jerusalem.
    reason: lexical_alternative
