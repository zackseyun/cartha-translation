translation:
  language: en
  text: 'This is the word that came to Jeremiah from Yahweh after Nebuzaradan,[a] captain of the guard, released him from Ramah. Nebuzaradan had taken Jeremiah while he was in chains among all the exiles from Jerusalem and Judah who were being taken to Babylon:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “chief of the executioners”; the Hebrew title refers to a royal guard official who may also have overseen executions.
    reason: lexical_alternative
