translation:
  language: en
  text: 'Now look: today I have freed you from the chains binding your hands. If you think it is good to come with me to Babylon, come, and I will look after you. But if coming with me seems like a bad choice to you, do not come. The whole land is open to you. Go wherever you think it is good and right to go.'
  philosophy: optimal-equivalence
