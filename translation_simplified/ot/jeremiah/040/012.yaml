translation:
  language: en
  text: Then all the Judeans[a] came back from every place where they had been driven. They returned to Judah and went to Gedaliah at Mizpah. There they gathered a very large amount of wine and summer fruit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all the Jews.” Here the term refers historically to the people of Judah.
    reason: lexical_alternative
  - marker: b
    text: “Summer fruit” means seasonal produce gathered in late summer or at harvest time.
    reason: cultural_note
simplification_decisions:
- pob_phrase: returned from all the places where they had been driven
  simplified_phrase: came back from every place where they had been driven
  preserved_meaning: The displaced Judeans physically returned from the places to which they had been forced away.
  reasoning_layer_used: The lexical decisions for שוב and נדח preserve both return and forced displacement.
  rationale: “Came back” is common English while retaining the direction and force of the movement.
- pob_phrase: they came to the land of Judah, to Gedaliah at Mizpah
  simplified_phrase: They returned to Judah and went to Gedaliah at Mizpah.
  preserved_meaning: They entered Judah and made their way to Gedaliah, who was at Mizpah.
  reasoning_layer_used: The lexical decisions identify Judah as the destination and Mizpah as Gedaliah’s location.
  rationale: A separate sentence and ordinary movement verbs make the destinations easy to follow.
- pob_phrase: gathered a very great abundance of wine and summer fruit
  simplified_phrase: gathered a very large amount of wine and summer fruit
  preserved_meaning: They collected both wine and seasonal fruit in an emphatically large quantity.
  reasoning_layer_used: The lexical decisions preserve both gathered products and the intensified quantity applying to them.
  rationale: Placing the quantity before both products keeps its full scope clear in modern English.
translation_notes:
  risk_flags:
  - risk: “Summer fruit” may sound narrower than the seasonal produce intended.
    mitigation: The cultural footnote explains its harvest-time sense.
