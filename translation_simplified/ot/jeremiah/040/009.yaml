translation:
  language: en
  text: Gedaliah, son of Ahikam and grandson of Shaphan, swore an oath to them and their men. He said, “Do not be afraid of serving the Chaldeans.[a] Keep living in the land and serve the king of Babylon. Then things will go well for you.”
  philosophy: optimal-equivalence
