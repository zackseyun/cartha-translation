translation:
  language: en
  text: 'The following men came to Gedaliah at Mizpah, along with their men: Ishmael son of Nethaniah; Johanan and Jonathan, sons of Kareah; Seraiah son of Tanhumeth; the sons of Ephai,[a] a man from Netophah; and Jezaniah,[b] whose father was from Maacah.'
  philosophy: optimal-equivalence
  footnotes:
