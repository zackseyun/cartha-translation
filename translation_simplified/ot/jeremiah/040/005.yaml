  preserved_meaning: Gedaliah’s relationship to both Ahikam and Shaphan remains clear.
  reasoning_layer_used: POB lexical decision on filial relations
  rationale: “Grandson” makes the two-generation family line immediately understandable.
- pob_phrase: whom the king of Babylon has appointed over the cities of Judah, and live with him among the people
  simplified_phrase: The king of Babylon has put him in charge of the cities of Judah. Live with him among the people.
  preserved_meaning: Gedaliah received administrative authority from Babylon, and Jeremiah could settle with him.
  reasoning_layer_used: POB lexical decisions for הִפְקִיד and וְשֵׁב
  rationale: Two direct sentences replace a dense relative clause without changing its meaning.
- pob_phrase: gave him provisions and a gift
