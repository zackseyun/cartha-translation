translation:
  language: en
  text: But since Jeremiah still had not gone back,[a] the captain said to him, “Go back to Gedaliah son of Ahikam and grandson of Shaphan. The king of Babylon has put him in charge of the cities of Judah. Live with him among the people, or go wherever it seems right in your eyes.” Then the captain of the guard gave Jeremiah food supplies and a gift and sent him away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew at the beginning is difficult and may also mean, “While he had not yet returned, ‘Return to Gedaliah…’”
    reason: alternative_reading
