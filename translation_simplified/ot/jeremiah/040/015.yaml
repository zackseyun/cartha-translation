- pob_phrase: said privately to Gedaliah at Mizpah, saying
  simplified_phrase: spoke privately with Gedaliah at Mizpah. He said
  preserved_meaning: Johanan secretly addressed Gedaliah at Mizpah and introduced his proposal.
  reasoning_layer_used: POB lexical decisions for בַסֵּתֶר and בַמִּצְפָּה
  rationale: The repeated speech wording becomes two natural English sentences while the private setting remains clear.
- pob_phrase: all the Judahites who are gathered to you
  simplified_phrase: all the people of Judah who have gathered around you
  preserved_meaning: The Judean community had assembled under Gedaliah’s leadership.
  reasoning_layer_used: POB lexical decisions for כָּל יְהוּדָה and הַנִּקְבָּצִים אֵלֶיךָ
  rationale: The clearer phrase avoids the unfamiliar label “Judahites” and expresses their present allegiance naturally.
- pob_phrase: the remnant of Judah would perish
  simplified_phrase: Judah’s surviving remnant will perish
  preserved_meaning: The community left after Judah’s catastrophe would be ruined.
  reasoning_layer_used: POB lexical decisions for שְׁאֵרִית יְהוּדָה and וְאָבְדָה
  rationale: Adding “surviving” explains the biblical term “remnant” without removing it.
