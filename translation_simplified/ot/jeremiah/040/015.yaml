translation:
  language: en
  text: Then Johanan son of Kareah spoke privately with Gedaliah at Mizpah. He said, “Please let me go and strike down Ishmael son of Nethaniah. No one will know. Why should he take your life? If he does, all the people of Judah who have gathered around you will be scattered, and Judah’s surviving remnant will perish.”
  philosophy: optimal-equivalence
