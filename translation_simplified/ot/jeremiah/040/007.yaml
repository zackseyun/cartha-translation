translation:
  language: en
  text: When all the military commanders in the open country and their men heard that the king of Babylon had put Gedaliah son of Ahikam in charge of the land, and that he had placed under Gedaliah’s care men, women, children, and some of the poorest people in the land, from among those who had not been exiled to Babylon,
