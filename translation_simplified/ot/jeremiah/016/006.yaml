  reasoning_layer_used: Lexical decision on גְדֹלִים וּקְטַנִּים
  rationale: “Alike” clearly conveys that both groups share the same fate.
- pob_phrase: cut himself, or make himself bald
  simplified_phrase: cut themselves or shave their heads bald
  preserved_meaning: Both concrete physical acts of mourning remain explicit.
  reasoning_layer_used: Lexical and theological decisions on mourning customs
  rationale: Singular “they” is natural modern English, and “shave their heads bald” clearly describes the second act.
