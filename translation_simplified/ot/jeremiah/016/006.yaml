translation:
  language: en
  text: Great and small alike will die in this land. They will not be buried, and no one will mourn[a] for them. No one will cut themselves or shave their heads bald for them as signs of mourning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “No one will lament for them.”
    reason: lexical_alternative
