simplification_decisions:
- pob_phrase: thus says Yahweh
  simplified_phrase: this is what Yahweh says
  preserved_meaning: The wording still introduces Yahweh’s authoritative prophetic message.
  reasoning_layer_used: lexical decision for כֹה אָמַר יְהוָה and theological decision for the divine name
  rationale: The prophetic formula is recast in natural English while retaining Yahweh.
- pob_phrase: concerning
  simplified_phrase: about
  preserved_meaning: Each named group remains the topic of the coming oracle.
  reasoning_layer_used: lexical decision for עַל
  rationale: “About” expresses the topical sense more directly.
- pob_phrase: their mothers who bear them, and their fathers who father them
  simplified_phrase: their mothers who give birth to them, and their fathers—the men who fathered them
  preserved_meaning: Both parents are identified by their distinct roles in bringing the children into the world.
  reasoning_layer_used: lexical decisions for הַיֹּלְדוֹת אוֹתָם and הַמּוֹלִדִים אוֹתָם
  rationale: The wording makes childbirth and biological fatherhood clear without using archaic “beget.”
translation_notes:
  risk_flags:
