translation:
  language: en
  text: “Look,” declares Yahweh, “I am sending many fishermen to catch them. After that, I will send many hunters[a] to hunt them from every mountain and hill and from every crevice in the rocks.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The fishermen and hunters picture agents who seek out and seize people wherever they hide. The verse does not identify these agents or settle whether their work is punishment or restoration.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I am sending for many fishermen ... and they will catch them
  simplified_phrase: I am sending many fishermen to catch them
  preserved_meaning: Yahweh is dispatching many agents pictured as fishermen to seize the people.
  reasoning_layer_used: Lexical decisions for שֹׁלֵחַ, לְדוגים רַבִּים, and וְדִיגוּם
  rationale: The purpose clause states the same action more directly while keeping the fishing image.
- pob_phrase: and after that I will send for many hunters
  simplified_phrase: After that, I will send many hunters
  preserved_meaning: A second group of agents follows the first in sequence.
  reasoning_layer_used: Lexical decision for וְאַחֲרֵי כֵן and אֶשְׁלַח
  rationale: A new sentence makes the sequence easier to follow.
- pob_phrase: the clefts of the rocks
  simplified_phrase: the crevices in the rocks
  preserved_meaning: Even rocky hiding places lie within the hunters’ reach.
  reasoning_layer_used: Lexical decision for נְקִיקֵי הַסְּלָעִים
  rationale: “Crevices” is common modern wording that preserves the concrete rock image.
translation_notes:
  risk_flags:
  - risk: Turning the fishermen and hunters into explicit invaders or gatherers would resolve an ambiguity the POB preserves.
    mitigation: The main text retains the images and the unspecified object “them,” while the footnote states the uncertainty.
  - risk: Changing “sending for” to “sending” may sound more like dispatching than summoning.
    mitigation: The POB lexical rationale allows dispatching agents, and the surrounding actions show they are sent on a task.
