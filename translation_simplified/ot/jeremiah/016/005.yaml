translation:
  language: en
  text: 'This is what Yahweh says: “Do not enter a home where people have gathered to mourn.[a] Do not join in their lament or offer them sympathy. I have taken away my peace[b] from this people—my steadfast love and compassion. This is Yahweh’s declaration.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean “a house of feasting,” but the references to lament and sympathy favor a mourning gathering here.
    reason: lexical_alternative
  - marker: b
    text: Here “peace” includes well-being, wholeness, and welfare, not only the absence of conflict.
    reason: lexical_alternative
