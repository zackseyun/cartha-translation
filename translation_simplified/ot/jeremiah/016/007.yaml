translation:
  language: en
  text: No one will break and share bread with people who are mourning, to comfort them after a death. No one will give them a cup of comfort[a] when their father or mother dies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely refers to a customary drink offered to comfort someone who was mourning.
