  reasoning_layer_used: POB lexical decision and cultural note for כּוֹס תַּנְחוּמִים
  rationale: “Comfort” is more familiar than “consolation” and preserves the expression as a cup.
- pob_phrase: to comfort him ... give them ... for his father or for his mother
