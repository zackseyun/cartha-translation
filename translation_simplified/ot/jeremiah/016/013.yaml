translation:
  language: en
  text: So I will throw you out of this land and into a land that neither you nor your fathers have known.[a] There you will serve other gods day and night,[b] because I will show you no favor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your ancestors.” Hebrew says “your fathers.”
    reason: lexical_alternative
  - marker: b
    text: “Serve” can include worship but does not specify whether this service is willing or forced.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: cast you out from this land onto a land
  simplified_phrase: throw you out of this land and into a land
  preserved_meaning: God will forcefully expel them from their land to another land.
  reasoning_layer_used: Lexical decision for וְהֵטַלְתִּי and the directional prepositions
  rationale: “Throw you out” keeps the forceful image while making the movement natural in English.
- pob_phrase: and there you will serve other gods day and night
  simplified_phrase: There you will serve other gods day and night
  preserved_meaning: In exile they will continually serve other gods.
  reasoning_layer_used: Lexical and theological decisions for עבד and יוֹמָם וָלַיְלָה
  rationale: A new sentence eases the structure without resolving whether the service is willing or coerced.
- pob_phrase: for I will show you no favor
  simplified_phrase: because I will show you no favor
  preserved_meaning: Their exile and service occur under God's withdrawal of favor.
  reasoning_layer_used: Lexical decision for חֲנִינָה and contextual reading of אֲשֶׁר
  rationale: “Because” states the accepted causal sense in more familiar English.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “serve other gods” only as voluntary worship.
    mitigation: The footnote preserves the broader sense, including possible coerced service.
