translation:
  language: en
  text: They will die from deadly diseases. No one will mourn them or bury them. They will become dung on the open ground. Sword and famine will destroy them, and their dead bodies will become food for the birds of the sky and the animals of the earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They will not be mourned or buried.
  simplified_phrase: No one will mourn them or bury them.
  preserved_meaning: They will receive neither mourning rites nor burial.
  reasoning_layer_used: POB lexical decisions for לֹא יִסָּפְדוּ and וְלֹא יִקָּבֵרוּ
  rationale: The active wording is easier to understand while preserving the denied funeral treatment.
- pob_phrase: They will be consumed by the sword and by famine.
  simplified_phrase: Sword and famine will destroy them.
  preserved_meaning: Violence and starvation will completely bring them to an end.
  reasoning_layer_used: POB lexical decision for וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  rationale: The direct clause clarifies the agents while retaining the sword image and severity.
- pob_phrase: their carcasses will become food for the birds of the heavens and for the beasts of the earth
  simplified_phrase: their dead bodies will become food for the birds of the sky and the animals of the earth
  preserved_meaning: Their exposed remains will be eaten by birds and land animals.
  reasoning_layer_used: POB lexical decisions for נִבְלָתָם, עוֹף הַשָּׁמַיִם, and בְהֱמַת הָאָרֶץ
  rationale: Common terms replace elevated or potentially confusing words without changing the scavenger scene.
translation_notes:
  risk_flags:
  - risk: “Dead bodies” is less degrading in tone than “carcasses.”
    mitigation: The dung image and the bodies becoming animal food preserve the verse’s stark humiliation.
