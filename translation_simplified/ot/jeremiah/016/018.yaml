translation:
  language: en
  text: First, I will repay them twice over for their wrongdoing and their sin, because they have made my land unclean with the carcasses of their detestable idols[a]. They have filled the land that is my inheritance with things I detest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the carcasses of their detestable things”; in Jeremiah, the Hebrew term often refers to idols.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: repay double their iniquity and their sin
  simplified_phrase: repay them twice over for their wrongdoing and their sin
  preserved_meaning: God will impose a double repayment for both culpable wrongdoing and sin.
  reasoning_layer_used: POB lexical decisions for וְשִׁלַּמְתִּי, מִשְׁנֵה, עֲוֺנָם, and וְחַטָּאתָם
  rationale: The wording makes the object and cause of repayment explicit while keeping the two moral terms distinct.
- pob_phrase: defiled my land
  simplified_phrase: made my land unclean
  preserved_meaning: Their idolatry polluted God's land in a ritual and moral sense.
  reasoning_layer_used: POB lexical decision for חַלְּלָם אֶת־אַרְצִי
  rationale: “Made unclean” communicates defilement in common English without weakening the pollution image.
- pob_phrase: filled my inheritance with their abominations
  simplified_phrase: filled the land that is my inheritance with things I detest
  preserved_meaning: They filled God's covenantal land-possession with abhorrent objects or practices.
  reasoning_layer_used: POB lexical decisions for וְתוֹעֲבוֹתֵיהֶם and מָלְאוּ אֶת־נַחֲלָתִי
  rationale: The revision explains both “inheritance” and “abominations” while retaining the covenant term.
translation_notes:
