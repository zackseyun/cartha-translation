translation:
  language: en
  text: Yahweh, you are my strength, my fortress, and the place I run to for safety when trouble comes. Nations will come to you from the farthest parts of the earth. They will say, “Surely our fathers inherited only lies—worthless things[a] that are of no use.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean “vanity” or “emptiness” and may imply futile idols here.
    reason: lexical_alternative
