translation:
  language: en
  text: Does my inheritance seem to me like a speckled bird of prey?[a] Are birds of prey surrounding her? Go and gather all the wild animals; bring them to devour her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a speckled hyena.” The Hebrew word usually means a bird of prey, but some interpreters understand it as a hyena here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is my inheritance to me
  simplified_phrase: Does my inheritance seem to me
  preserved_meaning: The speaker asks how his inheritance appears to him while leaving its exact referent open.
  reasoning_layer_used: Lexical and theological decisions on נַחֲלָתִי and לִי
  rationale: The natural question preserves the personal viewpoint and the deliberate ambiguity of “my inheritance.”
- pob_phrase: Are the birds of prey against her all around?
  simplified_phrase: Are birds of prey surrounding her?
  preserved_meaning: Hostile predatory birds encircle the inheritance pictured as a marked bird.
  reasoning_layer_used: Lexical decision on הַעַיִט סָבִיב עָלֶיהָ
  rationale: “Surrounding” expresses the encircling threat without adding an unsupported contrast.
- pob_phrase: all the beasts of the field
  simplified_phrase: all the wild animals
  preserved_meaning: Every kind of wild animal is summoned as a predator.
  reasoning_layer_used: Lexical decision on כָּל חַיַּת הַשָּׂדֶה
  rationale: “Wild animals” makes the biblical expression immediately understandable.
interpretive_expansions:
- pob_phrase: bring them to devour
  rendering: bring them to devour her
  claim: The summoned wild animals are to devour the inheritance portrayed as female.
  evidence:
  - The preceding clause refers to the inheritance with the feminine pronoun “her.”
  - The command summons predators for the purpose of eating.
  confidence: high
