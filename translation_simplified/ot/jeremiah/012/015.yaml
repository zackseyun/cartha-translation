translation:
  language: en
  text: After I uproot them, I will turn back to them and have compassion on them. I will bring each man back to his inheritance and his own land.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it will happen, after I have uprooted them, that I will return and have compassion on them
  simplified_phrase: After I uproot them, I will turn back to them and have compassion on them.
  preserved_meaning: God’s judgment comes first, followed by his renewed compassion toward the displaced peoples.
  reasoning_layer_used: Lexical decisions for וְהָיָה, נָתְשִׁי, אָשׁוּב, and וְרִחַמְתִּים.
  rationale: The direct time clause removes a heavy introduction while preserving the sequence and uprooting image.
- pob_phrase: and I will bring them back, each man to his inheritance and each man to his land
  simplified_phrase: I will bring each man back to his inheritance and his own land.
  preserved_meaning: God will return every individual among the peoples to his inherited territorial home.
  reasoning_layer_used: Lexical decisions for וַהֲשִׁבֹתִים and אִישׁ, together with the territorial-restoration theological decision.
  rationale: The repeated distributive wording is compressed without merging inheritance and land or weakening the concrete return.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “inheritance” only as money or possessions.
    mitigation: Keeping it beside “his own land” makes the territorial sense clear while preserving the covenant-land term.
