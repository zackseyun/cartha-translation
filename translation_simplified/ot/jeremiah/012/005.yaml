translation:
  language: en
  text: If racing against people on foot wears you out, how will you compete with horses? If you feel safe in a peaceful land, what will you do in the dangerous thickets along the Jordan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the pride of the Jordan” or “the swelling of the Jordan.”
    reason: alternative_reading
