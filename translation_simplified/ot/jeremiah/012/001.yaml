translation:
  language: en
  text: 'Yahweh, you are righteous when I bring my case before you.[a] Yet I want to speak with you about justice: Why does the way of the wicked lead to success? Why do all those who act so treacherously live at ease?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
