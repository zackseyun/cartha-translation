translation:
  language: en
  text: This is what Yahweh says about all my wicked neighboring nations, who encroach on the land I gave my people Israel as their inheritance:[a] “See, I am about to uproot these nations from their own lands. I will also uproot the house of Judah from among them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “touch the inheritance,” implying hostile interference with Israel’s land.
    reason: lexical_alternative
