translation:
  language: en
  text: So you must go yourself. On a day of fasting, read aloud to the people at Yahweh’s temple from the scroll where you wrote down the words I spoke—the words of Yahweh. Also read these words to all the people of Judah who come from their cities.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the scroll that you wrote from my mouth
  simplified_phrase: the scroll where you wrote down the words I spoke
  preserved_meaning: Baruch recorded Jeremiah’s spoken words in the scroll.
  reasoning_layer_used: lexical decision for אֲשֶׁר כָּתַבְתָּ מִפִּי
  rationale: This states the Hebrew idiom’s meaning in natural modern English.
- pob_phrase: in the hearing of the people in the house of Yahweh
  simplified_phrase: read aloud to the people at Yahweh’s temple
  preserved_meaning: Baruch must deliver the scroll orally to the people gathered at the temple.
  reasoning_layer_used: lexical decisions for בְּאָזְנֵי הָעָם and בֵּית יְהוָה
  rationale: The public reading and the location are clearer without the opaque hearing and house idioms.
- pob_phrase: you must also read them in the hearing of all Judah
  simplified_phrase: Also read these words to all the people of Judah
  preserved_meaning: The command extends to the people of Judah arriving from their cities.
  reasoning_layer_used: lexical decisions for וְגַם, בְּאָזְנֵי כָל יְהוּדָה, and תִּקְרָאֵם
  rationale: The wording identifies both the audience and what Baruch must read.
interpretive_expansions:
- pob_phrase: all Judah
  rendering: all the people of Judah
  claim: Judah refers collectively to its people rather than only to the territory.
  evidence:
