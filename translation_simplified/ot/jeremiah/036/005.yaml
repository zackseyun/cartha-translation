translation:
  language: en
  text: 'Then Jeremiah gave Baruch this command: “I am being kept back.[a] I cannot enter Yahweh’s house.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say exactly what was keeping Jeremiah from going there.
