  preserved_meaning: Jeremiah spoke to Baruch with directive force.
  reasoning_layer_used: The lexical decision for וַיְצַוֶּה and the speech-introducer rationale.
  rationale: This recasts the formal speech formula in natural English without weakening the command.
- pob_phrase: I am restrained
  simplified_phrase: I am being kept back
  preserved_meaning: Jeremiah was hindered for an unspecified reason.
  reasoning_layer_used: The lexical decision and footnote for עָצוּר.
  rationale: The wording is easier to understand while preserving the Hebrew ambiguity.
- pob_phrase: go into the house of Yahweh
  simplified_phrase: enter Yahweh’s house
  preserved_meaning: Jeremiah could not enter the place identified by Yahweh’s covenant name.
  reasoning_layer_used: The lexical decisions for לָבוֹא and בֵּית יְהוָה plus the updated divine-name doctrine.
  rationale: The shorter wording is natural and retains both the house image and the name Yahweh.
