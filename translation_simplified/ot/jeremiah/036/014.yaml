simplification_decisions:
- pob_phrase: sent Jehudi ... to Baruch, saying
  simplified_phrase: sent Jehudi ... to Baruch with this message
  preserved_meaning: Jehudi was the messenger sent to deliver the officials’ words to Baruch.
  reasoning_layer_used: POB lexical decision for אֶת יְהוּדִי ... אֶל בָּרוּךְ
  rationale: The rewrite makes the messenger relationship immediately clear in natural English.
- pob_phrase: the scroll from which you read in the hearing of the people
  simplified_phrase: the scroll you read aloud to the people
  preserved_meaning: Baruch publicly read from the scroll where the people could hear him.
  reasoning_layer_used: POB lexical decisions for קָרָאתָ בָּהּ and בְּאָזְנֵי הָעָם
  rationale: “Read aloud to the people” clearly expresses the public, audible reading without the formal idiom.
- pob_phrase: took the scroll in his hand and came to them
  simplified_phrase: took the scroll and carried it to them
  preserved_meaning: Baruch personally brought the scroll and obeyed the summons.
  reasoning_layer_used: POB lexical decisions for בְּיָדוֹ and וַיָּבֹא אֲלֵיהֶם
  rationale: “Carried it to them” preserves the physical action and compliance in smoother English.
translation_notes:
  risk_flags:
  - risk: Replacing the repeated “in his hand” wording may lessen the Hebrew’s verbal echo.
    mitigation: The main text preserves the image of Baruch personally carrying the scroll.
