translation:
  language: en
  text: 'Then all the officials sent Jehudi son of Nethaniah, son of Shelemiah, son of Cushi, to Baruch with this message: “Take the scroll you read aloud to the people, and come here with it.” So Baruch son of Neriah took the scroll and carried it to them.'
