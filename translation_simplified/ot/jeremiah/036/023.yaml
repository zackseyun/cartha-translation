translation:
  language: en
  text: Each time Yehudi read three or four columns, that section was cut off with the scribe’s knife and thrown into the fire in the firepot. This continued until the whole scroll had burned up.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: whenever Yehudi had read three or four columns
  simplified_phrase: Each time Yehudi read three or four columns
  preserved_meaning: Yehudi read the scroll section by section in a repeated sequence.
  reasoning_layer_used: Lexical decision for כִּקְרֹא
  rationale: “Each time” expresses the repeated action in ordinary English.
- pob_phrase: he would cut it off with the scribe’s knife and throw it
  simplified_phrase: that section was cut off with the scribe’s knife and thrown
  preserved_meaning: The portion just read was physically removed with a blade and discarded into the fire.
  reasoning_layer_used: Lexical decisions for יִקְרָעֶהָ, בְּתַעַר הַסֹּפֵר, and the applied revision
  rationale: The passive wording prevents “he” from wrongly appearing to refer to Yehudi while not adding an explicit subject absent from the Hebrew clause.
- pob_phrase: until the entire scroll was consumed in the fire that was in the brazier
  simplified_phrase: This continued until the whole scroll had burned up
  preserved_meaning: The repeated cutting and burning destroyed the complete scroll.
  reasoning_layer_used: Lexical decisions for עַד תֹּם כָּל הַמְּגִלָּה and הָאָח
  rationale: A new sentence removes repetition while preserving the process and its endpoint.
