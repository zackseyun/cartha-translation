translation:
  language: en
  text: 'About Jehoiakim king of Judah, say this: “This is what Yahweh says: You burned this scroll and said, ‘Why did you write that the king of Babylon will surely come and destroy this land, leaving it without people or animals?’”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And concerning Jehoiakim king of Judah, you shall say
  simplified_phrase: About Jehoiakim king of Judah, say this
  preserved_meaning: Yahweh directs Jeremiah to deliver a message about Jehoiakim.
  reasoning_layer_used: Lexical decisions for וְעַל and the directive force of תֹּאמַר.
  rationale: The direct instruction is clearer while retaining its force.
- pob_phrase: You have burned this scroll, saying
  simplified_phrase: You burned this scroll and said
  preserved_meaning: Jehoiakim burned the scroll and voiced his objection to its message.
  reasoning_layer_used: Lexical decision for שָׂרַפְתָּ and the immediate narrative context.
  rationale: A simple past sequence removes the awkward nested construction.
- pob_phrase: cut off from it man and beast
  simplified_phrase: leaving it without people or animals
  preserved_meaning: The invasion will devastate the land so that human and animal life cease from it.
  reasoning_layer_used: Lexical and theological decisions for וְהִשְׁבִּית מִמֶּנָּה אָדָם וּבְהֵמָה.
  rationale: The result is clear without implying that every individual is killed.
interpretive_expansions:
- pob_phrase: man and beast
  rendering: people or animals
  claim: The paired expression covers both human and animal life in a picture of comprehensive desolation.
  evidence:
  - The POB footnote identifies the phrase as a stock expression for total devastation.
  - The theological rationale says the pairing denotes comprehensive desolation.
  confidence: high
  alternatives_preserved:
  - man and beast
  - humankind and animals
  - people and animals
translation_notes:
  risk_flags:
  - risk: Replacing “man and beast” may reduce the traditional prophetic cadence.
    mitigation: “People or animals” clearly preserves both parts of the source expression.
  - risk: “Leaving it without” could be heard as describing only removal.
    mitigation: The preceding promise to destroy the land keeps the severity of the devastation clear.
