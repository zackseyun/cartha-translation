translation:
  language: en
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah, the scribe.[a] Baruch wrote on it as Jeremiah dictated,[b] recording all the words that had been in the scroll King Jehoiakim of Judah had burned in the fire. Many more words like those were also added.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A scribe was a professional writer and could also serve as an official secretary.
    reason: cultural_note
  - marker: b
    text: Literally, “from the mouth of Jeremiah.”
    reason: lexical_alternative
