translation:
  language: en
  text: Get a scroll for yourself. Write on it every word I have spoken to you about Israel, Judah, and all the nations[a], from the time I first spoke to you in the days of Josiah until today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “against Israel, Judah, and all the nations.” The Hebrew can mean either “about” or “against” in prophetic speech.
