translation:
  language: en
  text: No rain has fallen in the land, so the ground is cracked.[a] The farmers are ashamed and cover their heads.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also describe the ground as broken or dismayed, but the drought context points to cracked earth.
    reason: lexical_alternative
  - marker: b
    text: Covering the head was a sign of shame, grief, or mourning.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Because the ground is dismayed, since there has been no rain in the land
  simplified_phrase: No rain has fallen in the land, so the ground is cracked.
  preserved_meaning: The lack of rain has caused the cultivated ground to crack.
  reasoning_layer_used: The lexical decisions for חַתָּה and the two causal conjunctions.
  rationale: Putting the cause first and using “so” makes the relationship clear while preserving the drought image.
- pob_phrase: the farmers are ashamed; they cover their heads
  simplified_phrase: The farmers are ashamed and cover their heads.
  preserved_meaning: The farmers experience shame and display it through the customary head-covering gesture.
  reasoning_layer_used: The lexical decisions for בֹּשׁוּ, אִכָּרִים, and חָפוּ רֹאשָׁם.
  rationale: A direct compound sentence preserves both the emotion and the visible gesture in natural English.
translation_notes:
  risk_flags:
  - risk: “Cracked” selects the physical drought sense from a Hebrew verb that can also mean “dismayed.”
    mitigation: Footnote a preserves the lexical ambiguity while the main text follows the source-driven contextual decision.
  - risk: Modern readers may not understand why the farmers cover their heads.
    mitigation: Footnote b explains the cultural gesture without inserting one exclusive emotion into the verse.
