  preserved_meaning: The people are identified with Yahweh and stand under his covenant claim.
  reasoning_layer_used: POB lexical and theological decisions on וְשִׁמְךָ עָלֵינוּ נִקְרָא
  rationale: “Bear your name” makes the idiom understandable without limiting it to belonging alone.
- pob_phrase: do not forsake us
  simplified_phrase: Do not abandon us.
  preserved_meaning: The people plead with Yahweh not to leave them.
  reasoning_layer_used: POB lexical decision on אַל תַּנִּחֵנוּ
  rationale: “Abandon” expresses the solemn covenant plea in clear modern English.
