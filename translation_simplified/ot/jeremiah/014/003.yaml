translation:
  language: en
  text: The nobles send their servants[a] out to get water. The servants go to the water-storage pits[b], but they find them dry. They come back with empty containers, ashamed and humiliated, with their heads covered.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “their youths” or “their little ones,” but here it likely refers to lower-ranking servants.
    reason: lexical_alternative
  - marker: b
    text: These water-storage pits are cisterns; the Hebrew may also refer to pits or pools.
    reason: simplification_note
  - marker: c
    text: Covering the head was a sign of shame, mourning, or distress.
    reason: cultural_note
