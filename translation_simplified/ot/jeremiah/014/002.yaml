translation:
  language: en
  text: Judah mourns. Her gates droop in misery; they grow dark on the ground. Jerusalem’s cry of distress rises up.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be understood as picturing the gates sitting dark in mourning on the ground.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: her gates languish
  simplified_phrase: her gates droop in misery
  preserved_meaning: The gates remain the concrete image of civic life becoming feeble and miserable.
  reasoning_layer_used: POB lexical decisions for אֻמְלְלוּ and שְׁעָרֶיהָ
  rationale: “Droop in misery” makes the personified image clearer than “languish.”
- pob_phrase: they grow dark on the ground
  simplified_phrase: they grow dark on the ground
  preserved_meaning: The gates darken in an image associated with mourning and abasement on the ground.
  reasoning_layer_used: POB lexical decisions for קָדְרוּ and לָאָרֶץ
  rationale: Keeping “on the ground” avoids suggesting that darkness extends downward.
- pob_phrase: the cry of Jerusalem goes up
  simplified_phrase: Jerusalem’s cry of distress rises up
  preserved_meaning: Jerusalem’s anguished cry is pictured as moving upward.
  reasoning_layer_used: POB lexical decisions for צִוְחַת and עָלָתָה
  rationale: The wording identifies the kind of cry while retaining its upward movement.
