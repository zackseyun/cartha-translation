simplification_decisions:
- pob_phrase: We acknowledge, O Yahweh
  simplified_phrase: Yahweh, we admit
  preserved_meaning: The people openly recognize their guilt before Yahweh.
  reasoning_layer_used: Lexical decision for יָדַעְנוּ and theological decision for יְהוָה
  rationale: “Admit” expresses the confessional force in common English while retaining Yahweh’s personal name.
- pob_phrase: the iniquity of our fathers
  simplified_phrase: the wrongdoing of our fathers
  preserved_meaning: The people recognize the moral evil committed by their forefathers.
  reasoning_layer_used: Lexical decisions for עֲוֺן and אֲבוֹתֵינוּ
  rationale: “Wrongdoing” clarifies the moral sense, while “fathers” preserves the source’s gendered wording.
- pob_phrase: for we have sinned against you
  simplified_phrase: We have sinned against you, and that is why we admit our guilt.
  preserved_meaning: Their sin against Yahweh is explicitly the reason for their admission.
  reasoning_layer_used: Lexical decisions for כִּי, חָטָאנוּ, and לָךְ
  rationale: The added connective preserves the causal relationship while allowing short sentences.
interpretive_expansions:
