simplification_decisions:
- pob_phrase: And you shall say to them this word
  simplified_phrase: You must say this to them
  preserved_meaning: God directs Jeremiah to deliver the following message.
  reasoning_layer_used: Lexical decisions for וְאָמַרְתָּ אֲלֵיהֶם and אֶת־הַדָּבָר הַזֶּה.
  rationale: The direct command is clearer than the formal future construction.
- pob_phrase: Let my eyes run down with tears night and day, and let them not cease
  simplified_phrase: Let tears stream from my eyes night and day without stopping
  preserved_meaning: The speaker laments continually with flowing tears.
  reasoning_layer_used: Lexical decisions for תֵּרַדְנָה עֵינַי דִּמְעָה, לַיְלָה וְיוֹמָם, and וְאַל תִּדְמֶינָה.
  rationale: Natural clause order keeps both the flowing image and unceasing duration.
- pob_phrase: is broken with a great breaking, with a very grievous wound
  simplified_phrase: has been terribly shattered, with a very severe wound
  preserved_meaning: The personified people have suffered overwhelming ruin pictured as a grave injury.
  reasoning_layer_used: Lexical decisions for שֶׁבֶר גָּדוֹל נִשְׁבְּרָה and מַכָּה נַחְלָה מְאֹד.
  rationale: Strong wording preserves the Hebrew emphasis without adding an unsupported action.
translation_notes:
