translation:
  language: en
  text: The people these prophets are speaking to will die from famine and the sword. Their bodies will be thrown into the streets of Jerusalem, and no one will bury them or their wives, sons, and daughters. I will pour their evil out on them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their evil” may mean their wickedness or the disaster coming upon them because of it.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the people to whom they are prophesying
  simplified_phrase: the people these prophets are speaking to
  preserved_meaning: The prophets’ ongoing messages are directed to these people.
  reasoning_layer_used: lexical decision for נִבְּאִים לָהֶם
  rationale: This uses ordinary English without implying that the people receive or heed the messages.
- pob_phrase: with no one to bury them—them, their wives, their sons, and their daughters
  simplified_phrase: no one will bury them or their wives, sons, and daughters
  preserved_meaning: The people and every listed family member will remain unburied.
  reasoning_layer_used: lexical decisions for וְאֵין מְקַבֵּר and resumptive הֵמָּה
  rationale: The full scope remains while the repeated pronoun is removed for clarity.
- pob_phrase: I will pour out on them their evil
  simplified_phrase: I will pour their evil out on them
  preserved_meaning: God will pour their evil, or its resulting disaster, upon them in judgment.
  reasoning_layer_used: lexical and theological decisions for וְשָׁפַכְתִּי אֶת רָעָתָם
  rationale: Natural word order preserves both the pouring image and the Hebrew ambiguity.
