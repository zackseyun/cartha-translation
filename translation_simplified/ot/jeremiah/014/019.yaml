translation:
  language: en
  text: Have you completely rejected Judah? Do you loathe Zion?[a] Why have you struck us so that there is no healing for us? We hoped for peace, but nothing good came. We hoped for a time of healing, but instead there was terror.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The second question may also begin, “Or do you loathe Zion?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Have you utterly rejected Judah?
  simplified_phrase: Have you completely rejected Judah?
  preserved_meaning: The rejection remains total and emphatic.
  reasoning_layer_used: Lexical decision for הֲמָאֹס מָאַסְתָּ
  rationale: “Completely” expresses the Hebrew intensification in familiar English.
- pob_phrase: Does your soul loathe Zion?
  simplified_phrase: Do you loathe Zion?
  preserved_meaning: The question still directly asks whether God regards Zion with revulsion.
  reasoning_layer_used: Lexical decisions for גָּעֲלָה and נַפְשֶׁךָ
  rationale: Direct address conveys the whole-person idiom without adding a degree modifier.
- pob_phrase: We hoped for peace, but there was no good, and for a time of healing, but behold, terror.
  simplified_phrase: We hoped for peace, but nothing good came. We hoped for a time of healing, but instead there was terror.
  preserved_meaning: Both disappointed hopes remain distinct, and terror replaces expected healing.
  reasoning_layer_used: Lexical decisions for שָׁלוֹם, טוֹב, מַרְפֵּא, and בְעָתָה
  rationale: Two short sentences make the parallel contrasts immediately clear.
translation_notes:
  risk_flags:
  - risk: Replacing “your soul” makes the Hebrew whole-person image less visible.
    mitigation: The direct “you” preserves its referent without the unsupported modifier “deeply.”
  - risk: The particle before the second question may mean “or.”
    mitigation: The alternative is preserved in footnote [a].
