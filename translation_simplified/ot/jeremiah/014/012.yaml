translation:
  language: en
  text: Even when they fast, I do not listen to their cry. Even when they bring me burnt offerings and grain offerings, I do not accept those offerings. Instead, I am consuming them—bringing them to an end by the sword, famine, and plague.
  philosophy: optimal-equivalence
