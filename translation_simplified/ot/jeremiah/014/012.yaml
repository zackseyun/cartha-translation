- pob_phrase: Though they fast
  simplified_phrase: Even when they fast
  preserved_meaning: Their fasting does not change God's refusal to listen.
  reasoning_layer_used: POB lexical decision for כִּי
  rationale: “Even when” states the concessive force in more familiar English.
- pob_phrase: though they offer up burnt offering and grain offering
  simplified_phrase: Even when they bring me burnt offerings and grain offerings
  preserved_meaning: The people present both specified kinds of sacrifice to God.
  reasoning_layer_used: POB lexical decisions for יַעֲלוּ, עֹלָה, and מִנְחָה
  rationale: “Bring me” makes the sacrificial action and recipient clear without generalizing the offerings.
- pob_phrase: by pestilence I am consuming them
  simplified_phrase: I am consuming them—bringing them to an end by the sword, famine, and plague
  preserved_meaning: God's active judgment is destroying the people through the full three-part judgment formula.
  reasoning_layer_used: POB lexical decisions for דֶּבֶר and מְכַלֶּה
  rationale: The wording keeps the consuming image, explains its result, and replaces uncommon “pestilence” with “plague.”
