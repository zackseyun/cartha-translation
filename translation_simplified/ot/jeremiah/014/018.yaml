translation:
  language: en
  text: If I go out into the countryside, I see people killed by the sword. If I enter the city, I see people sick from famine. For both prophets and priests wander through the land, not knowing what to do.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that the prophets and priests travel around trading but do not understand.
    reason: lexical_alternative
  - marker: b
    text: The difficult final words may also mean, “They have gone into a land they do not know.”
    reason: alternative_reading
