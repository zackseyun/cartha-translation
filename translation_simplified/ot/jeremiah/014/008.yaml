translation:
  language: en
  text: Hope of Israel, the one who saves Israel in times of trouble, why should you be like a foreigner in the land? Why should you be like a traveler who stops to spend the night?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: O Hope of Israel, his Savior in time of distress
  simplified_phrase: Hope of Israel, the one who saves Israel in times of trouble
  preserved_meaning: God is directly addressed as Israel’s hope and Savior during crisis.
  reasoning_layer_used: lexical and theological decisions
  rationale: Repeating “Israel” clarifies the collective pronoun while preserving the direct address to God.
- pob_phrase: why should you be like a foreigner in the land, like a traveler
  simplified_phrase: why should you be like a foreigner in the land? Why should you be like a traveler
  preserved_meaning: The lament retains both images of God seeming present only as an outsider or traveler.
  reasoning_layer_used: lexical decisions and source syntax
  rationale: Two parallel questions make the paired comparisons easier to follow.
- pob_phrase: who turns aside to spend the night
  simplified_phrase: who stops to spend the night
  preserved_meaning: The traveler pauses in the land for temporary lodging.
  reasoning_layer_used: lexical rationale
  rationale: “Stops” expresses the lodging detour naturally without adding the unsupported restriction “only.”
translation_notes:
  risk_flags:
  - risk: “The one who saves Israel” is less title-like than “his Savior.”
    mitigation: Its place in the direct address still identifies God as Israel’s Savior.
