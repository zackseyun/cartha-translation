translation:
  language: en
  text: I will make them an object of horror and a disaster before all the kingdoms of the earth. In every place where I drive them away,[a] they will be a disgrace, a saying people repeat in scorn, a target of taunts, and a name people use in curses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “banish them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a horror, a calamity
  simplified_phrase: an object of horror and a disaster
  preserved_meaning: They will become a horrifying and disastrous presence among the nations.
  reasoning_layer_used: Lexical decisions for לְזַוֲעָה and לְרָעָה
  rationale: The clearer nouns preserve both distinct results of judgment without making them sound like literal events.
- pob_phrase: a reproach, a proverb, a taunt, and a curse
  simplified_phrase: a disgrace, a saying people repeat in scorn, a target of taunts, and a name people use in curses
  preserved_meaning: Their judgment will make them notorious through shame, mockery, and curse formulas.
  reasoning_layer_used: Lexical decisions and theological decision on the accumulated judgment list
  rationale: The wording explains each difficult term while preserving the force and distinct parts of the list.
- pob_phrase: in all the places where I drive them
  simplified_phrase: In every place where I drive them away
  preserved_meaning: God forcefully removes them to every place of exile.
  reasoning_layer_used: Lexical decision for אֲשֶׁר אַדִּיחֵם שָׁם
  rationale: “Drive them away” keeps the forceful exile image in ordinary English.
