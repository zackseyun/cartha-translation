translation:
  language: en
  text: 'This is what Yahweh, the God of Israel, says: “Like these good figs, I will regard the people exiled from Judah[a] as good. I sent them away from this place to Babylonia[b] for good.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the exile of Judah” or “the captivity of Judah,” but the following words refer to people whom God sent away.
    reason: alternative_reading
  - marker: b
    text: Hebrew “the land of the Chaldeans,” another name for Babylonia.
    reason: cultural_note
  - marker: c
    text: Hebrew simply says “for good.” This may mean that God will regard them favorably or that he sent them away for their good.
    reason: lexical_alternative
