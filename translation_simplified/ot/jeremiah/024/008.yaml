translation:
  language: en
  text: But the bad figs are so bad that they cannot be eaten. Yahweh says, “In the same way, I will make[a] Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those living in Egypt like those bad figs.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “give.” Here it means that Yahweh will treat them like the bad figs.
    reason: lexical_alternative
