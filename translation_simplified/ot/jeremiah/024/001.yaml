translation:
  language: en
  text: 'Yahweh showed me this: two baskets of figs had been placed in front of Yahweh’s temple. This was after King Nebuchadrezzar[a] of Babylon had taken Jeconiah son of Jehoiakim, who was king of Judah, into exile. He had also taken the officials of Judah, the craftsmen, and the smiths[b] from Jerusalem and brought them to Babylon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “Nebuchadrezzar”; many English versions use the more familiar spelling “Nebuchadnezzar.”
    reason: lexical_alternative
  - marker: b
    text: Or “metalworkers”; the Hebrew terms refer to groups of skilled workers taken into exile.
    reason: lexical_alternative
