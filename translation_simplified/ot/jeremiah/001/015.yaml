translation:
  language: en
  text: “For I am calling all the clans[a] of the northern kingdoms,” declares Yahweh. “They will come, and each ruler will set up his throne[b] at Jerusalem’s gates, against all the walls around the city and against every city of Judah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean extended family groups or families.
    reason: lexical_alternative
  - marker: b
    text: Setting up thrones pictures invading rulers taking positions of authority and judgment.
    reason: cultural_note
