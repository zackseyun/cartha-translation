  preserved_meaning: Jeremiah objects because of his youth or inexperience without fixing his exact age.
  reasoning_layer_used: POB lexical decision for נַעַר and footnote a
  rationale: The adjective is natural in common English, while the footnote preserves the Hebrew word’s range.
- pob_phrase: to all to whom I send you, you shall go
  simplified_phrase: You must go wherever I send you
  preserved_meaning: Jeremiah must accept every destination or assignment Yahweh gives him, while the person-oriented reading remains possible.
