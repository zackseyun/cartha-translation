  text: But Yahweh said to me, “Do not say, ‘I am young.’[a] You must go wherever I send you,[b] and you must say everything I command you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can refer to a youth, a young man, or a boy; here it points to Jeremiah’s youth or inexperience.
    reason: lexical_alternative
  - marker: b
