  text: See, today I have appointed you as my prophet over the nations and kingdoms.[a] You are to uproot and tear down, to destroy and demolish, and to build and plant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeremiah’s authority over nations and kingdoms is exercised by proclaiming God’s message, not by ruling them politically.
    reason: cultural_note
