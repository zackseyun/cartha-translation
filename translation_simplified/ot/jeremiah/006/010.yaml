translation:
  language: en
  text: Whom can I speak to and warn so that they may listen? Look, their ears are uncircumcised,[a] and they cannot pay attention. Look, the word of Yahweh has become something they scorn; they take no delight in it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
