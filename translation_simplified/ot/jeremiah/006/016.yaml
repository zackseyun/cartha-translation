translation:
  language: en
  text: 'Yahweh says:

    “Stop beside the roads and look around. Ask about the ancient paths:[a] ‘Which one is the good way?’ Walk on that path, and you will find rest for your souls.[b]”

    But they said, “We will not walk on it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the paths of old” or “the everlasting paths.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “souls” can also mean “selves” or “lives.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Stand by the roads and look
  simplified_phrase: Stop beside the roads and look around
  preserved_meaning: The people must pause at the roads and carefully consider their direction.
  reasoning_layer_used: POB lexical decisions for עִמְדוּ, עַל דְּרָכִים, and וּרְאוּ
  rationale: “Stop beside” makes the attentive pause natural while preserving the road image.
- pob_phrase: ask for the ancient paths, where the good way is
  simplified_phrase: 'Ask about the ancient paths: ‘Which one is the good way?’'
  preserved_meaning: They must seek the long-established path that is truly good.
  reasoning_layer_used: POB lexical decisions for לִנְתִבוֹת עוֹלָם and אֵי זֶה דֶרֶךְ הַטּוֹב
  rationale: A direct question clearly shows that they must identify the right path.
- pob_phrase: then walk in it
  simplified_phrase: Walk on that path
  preserved_meaning: They must conduct their lives according to the good way.
  reasoning_layer_used: POB lexical decision for וּלְכוּ בָהּ
  rationale: “On that path” is ordinary English and keeps the metaphor for conduct.
