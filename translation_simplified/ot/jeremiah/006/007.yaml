  text: A well keeps its water fresh.[a] In the same way, Jerusalem keeps her evil fresh. Violence and destruction are constantly heard within her. Sickness and wounds are always before me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also describe a cistern keeping its water cool or a well continually supplying water.
    reason: lexical_alternative
  - marker: b
    text: “Sickness and wounds” may be literal or may picture the city’s corrupt condition.
    reason: lexical_alternative
