translation:
  language: en
  text: They had committed an abomination. Were they ashamed of it? No. They felt no shame at all; they did not even know how to blush. So they will fall among the fallen. When I punish them,[a] they will stumble, says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when I visit them.” Here the Hebrew word refers to coming to punish them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Were they ashamed because they had done an abomination?
  simplified_phrase: They had committed an abomination. Were they ashamed of it?
  preserved_meaning: Their detestable act should have produced shame, but did not.
  reasoning_layer_used: POB lexical decisions for הֹבִישׁוּ, כִּי, תוֹעֵבָה, and עָשׂוּ
  rationale: Two short sentences make the rhetorical question and its cause easier to follow.
- pob_phrase: they were not ashamed at all
  simplified_phrase: They felt no shame at all
  preserved_meaning: The emphatic Hebrew denial means they had no sense of shame.
  reasoning_layer_used: POB lexical decision for גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  rationale: “Felt no shame” states the inner response in natural modern English.
- pob_phrase: Therefore they will fall among the fallen; at the time I punish them, they will stumble
  simplified_phrase: So they will fall among the fallen. When I punish them, they will stumble
  preserved_meaning: Their shamelessness leads to collapse under Yahweh’s judgment.
  reasoning_layer_used: POB lexical and theological decisions for לָכֵן, יִפְּלוּ בַנֹּפְלִים, פקד, and יִכָּשְׁלוּ
  rationale: Shorter sentences clarify the consequence while preserving the paired images of falling and stumbling.
