translation:
  language: en
  text: But Yahweh’s wrath fills me, and I am exhausted from holding it back. Pour it out on the child in the street and on the young men gathered together.[a] Both men and women will be taken, the old and the very old alike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may instead present Yahweh as commanding, “Pour it out,” or Jeremiah as saying that he will pour it out.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I am full of the wrath of Yahweh; I am weary of holding it in
  simplified_phrase: Yahweh’s wrath fills me, and I am exhausted from holding it back
  preserved_meaning: Jeremiah is filled with intense divine anger and can no longer contain it.
  reasoning_layer_used: Lexical decisions for מָלֵאתִי, נִלְאֵיתִי, and הָכִיל
  rationale: The active wording is easier to follow while preserving the image of pent-up wrath.
- pob_phrase: the company of young men together
  simplified_phrase: the young men gathered together
  preserved_meaning: Judgment reaches an assembled group of young men.
  reasoning_layer_used: Lexical decisions for סוֹד בַּחוּרִים and יַחְדָּו
  rationale: This replaces the formal phrase “company” while retaining both the gathering and togetherness.
- pob_phrase: both man and woman will be taken, the old man along with the very aged
  simplified_phrase: Both men and women will be taken, the old and the very old alike
  preserved_meaning: The coming judgment will seize people of both sexes and every advanced age.
  reasoning_layer_used: Lexical decisions for יִלָּכֵדוּ, אִישׁ עִם אִשָּׁה, זָקֵן, and מְלֵא יָמִים
  rationale: Natural collective plurals clarify the scope without implying marriage or an official elder.
translation_notes:
  risk_flags:
  - risk: The speaker and force of “Pour it out” are grammatically compressed and open to more than one reading.
    mitigation: The main text keeps POB’s chosen reading, while footnote [a] preserves the alternatives.
  - risk: “Taken” may sound less specific than “captured” or “seized.”
    mitigation: It is retained because POB intentionally leaves the judgment broader than military capture alone.
