translation:
  language: en
  text: 'So this is what Yahweh says: “Look! I am putting stumbling blocks in the path of this people. Fathers and sons alike will stumble over them. Neighbors and their friends will perish.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore, thus says Yahweh
  simplified_phrase: So this is what Yahweh says
  preserved_meaning: The preceding indictment leads directly to Yahweh’s judgment announcement.
  reasoning_layer_used: The lexical decision identifies an inferential conjunction and a prophetic messenger formula.
  rationale: Common English preserves both the logical connection and the prophetic authority.
- pob_phrase: Behold, I am setting stumbling blocks before this people
  simplified_phrase: Look! I am putting stumbling blocks in the path of this people
  preserved_meaning: Yahweh solemnly announces that he is placing obstacles that will cause the people to fall.
  reasoning_layer_used: The lexical decisions require attention force, imminent action, and the concrete stumbling image.
  rationale: The new wording makes the path image immediately clear without weakening the judgment.
- pob_phrase: fathers and sons together; neighbor and his friend
  simplified_phrase: Fathers and sons alike … Neighbors and their friends
  preserved_meaning: Judgment overtakes both family relationships and wider social relationships.
  reasoning_layer_used: The lexical and cultural notes preserve the distinct family and social pairings.
  rationale: Natural plural wording keeps both groups distinct while avoiding an awkward literal construction.
