simplification_decisions:
- pob_phrase: Be warned
  simplified_phrase: Accept correction
  preserved_meaning: Jerusalem must receive corrective discipline, not merely notice a warning.
  reasoning_layer_used: POB lexical decision for הִוָּסְרִי
  rationale: This clear alternative retains the Hebrew verb’s corrective force.
- pob_phrase: lest my soul turn away from you
  simplified_phrase: Otherwise, my soul will turn away from you
  preserved_meaning: God warns that he will personally and relationally withdraw from Jerusalem.
  reasoning_layer_used: POB lexical and theological decisions for פֶּן, תֵּקַע, and נַפְשִׁי
  rationale: The modern warning form preserves the vivid image of God’s soul turning away.
- pob_phrase: lest I make you a desolation, a land not inhabited
  simplified_phrase: and I will make you desolate—a land where no one lives
  preserved_meaning: The same warning includes Jerusalem’s complete devastation and loss of inhabitants.
  reasoning_layer_used: POB lexical decisions for פֶּן, שְׁמָמָה, and אֶרֶץ לֹא נוֹשָׁבָה
  rationale: Joining this clause to “Otherwise” keeps it conditional while using direct modern English.
translation_notes:
  risk_flags:
  - risk: Using one “Otherwise” for two Hebrew warning clauses may obscure the repeated פֶּן.
