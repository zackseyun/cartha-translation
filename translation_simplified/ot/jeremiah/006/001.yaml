translation:
  language: en
  text: Sons of Benjamin, take cover[a] by getting out of Jerusalem! Sound the trumpet alarm in Tekoa, and raise a warning signal over Beth-haccherem.[b] Disaster is looking down from the north, and great destruction is coming.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “flee for safety” or “gather yourselves to flee.”
    reason: lexical_alternative
  - marker: b
    text: Beth-haccherem was likely a high place used for warning signals between Jerusalem and Tekoa.
    reason: cultural_note
