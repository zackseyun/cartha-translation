translation:
  language: en
  text: The bellows pump air fiercely into the fire[a], and the fire uses up the lead. The refiner tries again and again, but it does no good. The wicked are still not separated out.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may instead mean, “The bellows are burned up, and the lead is consumed by their fire.”
    reason: textual_variant
  - marker: b
    text: This may also be translated “the evil ones are not removed” or, within the refining image, “the impurities are not drawn off.”
    reason: lexical_alternative
