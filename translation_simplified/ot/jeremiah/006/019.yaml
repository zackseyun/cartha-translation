translation:
  language: en
  text: 'Earth, hear this: I am bringing disaster on this people. This disaster is the fruit of their own thinking, because they have not listened to my words and have rejected my law.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my instruction.” The Hebrew word can mean “law” or “instruction.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'Hear, O earth: behold'
  simplified_phrase: 'Earth, hear this:'
  preserved_meaning: The earth is personified as a witness to a solemn prophetic announcement.
  reasoning_layer_used: POB lexical decisions for שִׁמְעִי, הָאָרֶץ, and הִנֵּה
  rationale: The direct address keeps the prophetic summons without the archaic “O” and “behold.”
- pob_phrase: the fruit of their thoughts
  simplified_phrase: This disaster is the fruit of their own thinking
  preserved_meaning: The coming judgment is the consequence of what the people’s thinking has produced.
  reasoning_layer_used: POB lexical decision for פְּרִי מַחְשְׁבוֹתָם
  rationale: The sentence makes the metaphor’s connection to the disaster clear while retaining the image of fruit.
- pob_phrase: they have not listened to my words, and they have rejected my law
  simplified_phrase: they have not listened to my words and have rejected my law
  preserved_meaning: The people refused attention to God’s words and repudiated his binding covenant teaching.
  reasoning_layer_used: POB lexical and theological decisions for דְּבָרַי and תוֹרָתִי
  rationale: The streamlined coordination preserves both distinct charges and the covenantal force of “law.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fruit” only in a positive sense.
    mitigation: The wording directly identifies the fruit as the disaster their thinking produced.
  - risk: “Law” may sound narrower than the full range of Hebrew torah.
    mitigation: A footnote preserves “my instruction” as the lexical alternative.
