  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
  footnotes:
  - marker: a
    text: Or “cast up a siege mound/embankment against Jerusalem.” The Hebrew literally says “pour out a siege ramp,” an idiom for building siege works.
    reason: lexical_alternative
  - marker: b
    text: Or “This is the city to be visited,” with “visited” meaning called to account in judgment.
    reason: alternative_reading
