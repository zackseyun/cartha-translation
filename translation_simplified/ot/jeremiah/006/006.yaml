translation:
  language: en
  text: 'This is what Yahweh, who commands all armies in heaven and on earth, says:


    “Cut down trees. Pile up earth to make a siege ramp against Jerusalem. This city must be punished; oppression fills every part of her.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh, who commands all armies in heaven and on earth, says
  preserved_meaning: Yahweh’s covenant name and his authority over heavenly and earthly forces remain explicit.
  reasoning_layer_used: POB lexical decision for יְהוָה צְבָאוֹת
  rationale: The title is explained in common English without narrowing the hosts to human armies.
- pob_phrase: heap up a siege ramp against Jerusalem
  simplified_phrase: Pile up earth to make a siege ramp against Jerusalem
  preserved_meaning: The attackers are ordered to build earthworks for a hostile siege of Jerusalem.
  reasoning_layer_used: POB lexical decision for וְשִׁפְכוּ ... סֹלְלָה and footnote a
  rationale: Naming the earth makes the ancient siege action easier to picture.
- pob_phrase: there is nothing but oppression within her
  simplified_phrase: oppression fills every part of her
  preserved_meaning: Oppression thoroughly characterizes the personified city.
  reasoning_layer_used: POB lexical decisions for כֻּלָּהּ עֹשֶׁק and בְּקִרְבָּהּ
  rationale: The recast sentence preserves both the totalizing force and the city’s feminine personification.
