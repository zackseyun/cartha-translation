translation:
  language: en
  text: “If any nation or kingdom refuses to serve Nebuchadnezzar king of Babylon, and refuses to put its neck under his yoke and submit to his rule, I will punish that nation,” declares Yahweh. “I will punish it with the sword, famine, and plague until I have brought it to an end by Nebuchadnezzar’s hand.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it shall be that the nation or the kingdom that will not serve him
  simplified_phrase: If any nation or kingdom refuses to serve
  preserved_meaning: The warning applies to every political realm that rejects Babylonian rule.
  reasoning_layer_used: POB lexical decision for הַגּוֹי וְהַמַּמְלָכָה and future consequence formula
  rationale: The conditional form states the future consequence more naturally without narrowing its scope.
- pob_phrase: with the sword, with famine, and with pestilence
  simplified_phrase: with the sword, famine, and plague
  preserved_meaning: Yahweh threatens the same three forms of judgment.
  reasoning_layer_used: POB lexical decision for בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  rationale: “Plague” is more familiar than “pestilence,” while the recurring judgment triad remains intact.
- pob_phrase: until I have finished them by his hand
  simplified_phrase: until I have brought it to an end by Nebuchadnezzar’s hand
  preserved_meaning: Yahweh will complete the nation’s judgment through Nebuchadnezzar without specifying a mode beyond the source.
  reasoning_layer_used: POB lexical decisions and doctrine realignment for עַד תֻּמִּי אֹתָם בְּיָדוֹ
  rationale: The wording clarifies the pronouns, preserves the hand image, and avoids the rejected over-specific “consumed.”
interpretive_expansions:
- pob_phrase: put its neck under the yoke of the king of Babylon
  rendering: put its neck under his yoke and submit to his rule
  claim: The yoke represents submission to Babylonian domination.
  evidence:
