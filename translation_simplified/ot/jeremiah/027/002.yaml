- pob_phrase: bonds and yoke-bars
  simplified_phrase: straps and bars for a yoke
  preserved_meaning: Jeremiah must make the restraining parts of a yoke.
  reasoning_layer_used: Lexical decisions for מוֹסֵרוֹת and מֹטוֹת
  rationale: This replaces uncommon terms while preserving both distinct parts of the yoke apparatus.
- pob_phrase: Make for yourself
