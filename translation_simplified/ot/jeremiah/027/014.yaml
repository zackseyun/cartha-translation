translation:
  language: en
  text: Do not listen to the prophets who keep telling you, “You will not have to serve the king of Babylon.”[a] They are prophesying a lie to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not serve the king of Babylon.” The Hebrew can express a command, but the context favors a false prediction that Judah will not have to serve Babylon.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And do not listen to the words of the prophets
  simplified_phrase: Do not listen to the prophets
  preserved_meaning: The people must not heed the known group of prophets or their message.
  reasoning_layer_used: Lexical decisions for וְאַל, תִּשְׁמְעוּ, and אֶל דִּבְרֵי
  rationale: Natural English can identify the speakers directly without losing the warning against their words.
- pob_phrase: who are saying to you
  simplified_phrase: who keep telling you
  preserved_meaning: The prophets repeatedly deliver this message to the people.
  reasoning_layer_used: Lexical decision for הָאֹמְרִים אֲלֵיכֶם לֵאמֹר
  rationale: “Keep telling” clearly conveys the ongoing or repeated speech.
- pob_phrase: You will not serve the king of Babylon
  simplified_phrase: You will not have to serve the king of Babylon
  preserved_meaning: The prophets falsely predict that Judah will escape subjection to Babylon's king.
  reasoning_layer_used: Theological decision on the false prophetic message
  rationale: “Will not have to serve” makes the predicted freedom from Babylonian rule clear while retaining the idea of service.
interpretive_expansions:
- pob_phrase: You will not serve
  rendering: You will not have to serve
  claim: The quoted words predict that Judah will escape required service to Babylon rather than forbid such service.
  evidence:
  - The immediate context concerns prophets denying Babylonian domination.
  - The POB theological decision favors a predictive reading.
  - The following clause identifies their claim as false prophecy.
  confidence: high
  alternatives_preserved:
  - Do not serve the king of Babylon.
translation_notes:
