translation:
  language: en
  text: “I did not send them,” declares Yahweh. “They are falsely claiming to speak in my name, so that I may drive you out. Then you will perish—both you and the prophets who are giving you these prophecies.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they are prophesying falsely in my name
  simplified_phrase: They are falsely claiming to speak in my name
  preserved_meaning: The prophets falsely present their messages as coming with Yahweh’s authority.
  reasoning_layer_used: Lexical decisions for נִבְּאִים, בִּשְׁמִי, and לַשָּׁקֶר
  rationale: This explains the potentially unclear phrase “prophesying in my name.”
- pob_phrase: so that I may drive you out, and you will perish
  simplified_phrase: so that I may drive you out. Then you will perish
  preserved_meaning: The purpose/result link remains open while the coming judgment is stated clearly.
  reasoning_layer_used: Lexical decisions for לְמַעַן, הַדִּיחִי, and וַאֲבַדְתֶּם
  rationale: The sentence break improves readability without reducing “so that I may” to simple causation.
- pob_phrase: you and the prophets who are prophesying to you
  simplified_phrase: both you and the prophets who are giving you these prophecies
  preserved_meaning: The hearers and the false prophets addressing them will perish together.
  reasoning_layer_used: Lexical decision for הַנְּבִאִים הַנִּבְּאִים לָכֶם
  rationale: “Both” clarifies the paired groups while preserving the prophets’ ongoing activity.
interpretive_expansions:
- pob_phrase: in my name
  rendering: claiming to speak in my name
  claim: The prophets claim their messages come from Yahweh and carry his authority.
  evidence:
