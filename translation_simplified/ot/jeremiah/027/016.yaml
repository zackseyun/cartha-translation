translation:
  language: en
  text: 'I also spoke to the priests and all the people: “This is what Yahweh says: Do not listen to your prophets. They keep telling you, ‘Look! The temple items are being brought back from Babylon now—very soon.’ What they are prophesying to you is false.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And to the priests and to all this people I spoke, saying
  simplified_phrase: I also spoke to the priests and all the people
  preserved_meaning: Jeremiah addresses both the priests and the whole people.
  reasoning_layer_used: Lexical decisions for וְאֶל ... וְאֶל and דִּבַּרְתִּי לֵאמֹר
  rationale: The sentence is recast in ordinary English while retaining both audiences and the continuing discourse.
- pob_phrase: the vessels of the house of Yahweh
  simplified_phrase: the temple items
  preserved_meaning: These are the sacred objects belonging to and used in Yahweh’s house.
  reasoning_layer_used: Lexical decision for כְלֵי בֵית יְהוָה and immediate context
  rationale: “Temple items” is clear modern English and avoids suggesting mere origin from the building.
- pob_phrase: are being brought back from Babylon now, quickly
  simplified_phrase: are being brought back from Babylon now—very soon
  preserved_meaning: The false prophets claim that the items’ return is already imminent.
  reasoning_layer_used: Lexical decision and POB footnote for עַתָּה מְהֵרָה
  rationale: The wording keeps both the present and urgent force of the Hebrew in the main text.
translation_notes:
  risk_flags:
  - risk: “Temple items” replaces the concrete traditional term “vessels.”
    mitigation: The phrase preserves their identity as objects belonging to and used in Yahweh’s house.
  - risk: “Now—very soon” is an unusual English combination.
    mitigation: The phrasing intentionally preserves both Hebrew terms that stress the false claim’s immediacy.
