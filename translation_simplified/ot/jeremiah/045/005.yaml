translation:
  language: en
  text: But what about you? Are you seeking great things for yourself? Do not seek them, because I am bringing disaster on all humanity, declares the LORD. Yet wherever you go, I will let you escape alive. Your life will be the plunder I give you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you—are you seeking great things for yourself?
  simplified_phrase: But what about you? Are you seeking great things for yourself?
  preserved_meaning: The LORD pointedly contrasts Baruch’s personal ambitions with the coming disaster.
  reasoning_layer_used: POB text and applied revision
  rationale: Two direct questions make the emphatic address easier to follow.
- pob_phrase: for behold, I am bringing disaster on all flesh
  simplified_phrase: because I am bringing disaster on all humanity
  preserved_meaning: The LORD gives widespread judgment on human beings as the reason Baruch must abandon his ambitions.
  reasoning_layer_used: Hebrew source and POB translation
  rationale: “All humanity” clearly conveys the scope of “all flesh” without sharpening the timing.
- pob_phrase: I will give you your life as plunder in every place where you go
  simplified_phrase: wherever you go, I will let you escape alive. Your life will be the plunder I give you.
  preserved_meaning: Baruch will survive wherever he goes, and his life itself is pictured as plunder.
  reasoning_layer_used: Hebrew source, POB translation, and applied revision
  rationale: The two sentences explain the promise of survival while preserving the life-as-plunder image.
interpretive_expansions:
- pob_phrase: I will give you your life as plunder
  rendering: I will let you escape alive. Your life will be the plunder I give you.
  claim: The idiom promises that Baruch will survive the coming disaster.
  evidence:
  - The POB identifies Baruch’s life as the plunder given to him.
  - The promise directly contrasts with disaster coming on all humanity.
  confidence: high
  alternatives_preserved:
  - The text does not specify a battle or how the plunder is obtained.
translation_notes:
  risk_flags:
  - risk: “All humanity” replaces the concrete biblical expression “all flesh.”
    mitigation: It preserves the human scope in immediately understandable English.
  - risk: Splitting the final promise could make survival and plunder seem like separate gifts.
    mitigation: The second sentence identifies Baruch’s preserved life itself as the plunder.
