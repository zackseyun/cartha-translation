translation:
  language: en
  text: No survivors[a] will be left among them, because I will bring disaster on the men of Anathoth in the year when I punish them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “no remnant,” meaning no surviving group will remain.'
    reason: source_note
  - marker: b
    text: The Hebrew term can also mean “visit”; here it refers to coming to punish.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: no remnant will remain for them
  simplified_phrase: No survivors will be left among them
  preserved_meaning: No surviving remainder of the condemned men will remain.
  reasoning_layer_used: POB lexical decision for שְׁאֵרִית and לֹא תִהְיֶה לָהֶם
  rationale: “Survivors” makes the judgment immediately clear while a footnote preserves the Hebrew remnant image.
- pob_phrase: for I will bring disaster
  simplified_phrase: because I will bring disaster
  preserved_meaning: God gives the coming disaster as the reason none will survive.
  reasoning_layer_used: POB lexical and theological decisions for כִּי and רָעָה
  rationale: “Because” states the logical connection plainly, while “disaster” avoids suggesting moral evil.
- pob_phrase: in the year of their punishment
  simplified_phrase: in the year when I punish them
  preserved_meaning: The punishment will come at the appointed year of judgment.
  reasoning_layer_used: POB lexical decision for שְׁנַת פְּקֻדָּתָם
  rationale: The verbal clause is easier to understand and keeps both the specific year and punitive sense.
