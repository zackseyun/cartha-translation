translation:
  language: en
  text: For I solemnly warned your fathers when I brought them up out of Egypt. From that day until today, I have risen early to warn them again and again, saying, “Listen to my voice.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Obey my voice.” The Hebrew expression can mean listening in a way that leads to obedience, especially in a covenant.
    reason: lexical_alternative
