translation:
  language: en
  text: But you, Yahweh, Lord over the armies of heaven and earth, judge justly. You examine the kidneys and the heart—the deepest thoughts and motives. Let me see you bring your vengeance on them, because I have laid my case open before you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vengeance” may also be translated “avenging” or “vindication.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O Yahweh of hosts
  simplified_phrase: Yahweh, Lord over the armies of heaven and earth
  preserved_meaning: The title presents Yahweh as sovereign over both heavenly and earthly hosts.
  reasoning_layer_used: POB lexical rationale for צְבָאוֹת and grounding review
  rationale: This explains “hosts” without limiting the title to human armies or adding an unsupported universal claim.
- pob_phrase: who test the kidneys and the heart
  simplified_phrase: You examine the kidneys and the heart—the deepest thoughts and motives
  preserved_meaning: Yahweh probes the whole inner person while the Hebrew body image remains visible.
  reasoning_layer_used: POB theological decision and cultural note
  rationale: The concrete image is retained and immediately explained for readers unfamiliar with the idiom.
- pob_phrase: to you I have revealed my case
  simplified_phrase: I have laid my case open before you
  preserved_meaning: Jeremiah has disclosed his legal cause to Yahweh and entrusted it to him.
  reasoning_layer_used: POB lexical decisions for גִּלִּיתִי and רִיבִי
  rationale: The wording preserves the uncovering image and legal sense in natural English.
