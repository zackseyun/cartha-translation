  preserved_meaning: Yahweh declared judgment directed against his people.
  reasoning_layer_used: lexical decision for דִּבֶּר עָלַיִךְ רָעָה
  rationale: “Announced” is ordinary English, while “against you” preserves the judgment’s direction.
- pob_phrase: because of the evil of the house of Israel and the house of Judah, which they have done to themselves
  simplified_phrase: The houses of Israel and Judah brought this disaster on themselves through the evil they did
  preserved_meaning: Their moral evil made them responsible for the disaster pronounced against them.
  reasoning_layer_used: latest revision and lexical rationale for אֲשֶׁר עָשׂוּ לָהֶם
  rationale: The new sentence makes the cause and self-harming result clear while distinguishing evil from disaster.
- pob_phrase: who planted you
