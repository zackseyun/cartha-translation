translation:
  language: en
  text: Yahweh of Armies, who planted you, has announced disaster against you. The houses of Israel and Judah brought this disaster on themselves through the evil they did, provoking me to anger by making offerings to Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by burning incense to Baal”; the Hebrew describes producing smoke in a ritual offering, often incense.
    reason: lexical_alternative
