  preserved_meaning: Yahweh is pictured as planting his people like the olive tree in the preceding context.
  reasoning_layer_used: immediate-context lexical decision for הַנּוֹטֵעַ אֹתָךְ
  rationale: The planting image remains because it connects directly to the preceding olive-tree image.
