- pob_phrase: Cursed is the man who does not listen
  simplified_phrase: Cursed is anyone who does not obey
  preserved_meaning: The curse applies to every person who fails to heed the covenant.
  reasoning_layer_used: POB wording, Hebrew covenant usage, and Jeremiah 11:4
  rationale: “Anyone” is clearly generic, and “obey” prevents a hearing-only misunderstanding.
interpretive_expansions:
- pob_phrase: does not listen
