- pob_phrase: did not listen or incline their ear
  simplified_phrase: did not listen or turn their ears to hear
  preserved_meaning: They refused attentive hearing, with disobedience implied.
  reasoning_layer_used: Lexical decision for שָׁמְעוּ and הִטּוּ אֶת אָזְנָם
  rationale: The wording explains the idiom while preserving its ear image.
- pob_phrase: each one walked in the stubbornness of his evil heart
  simplified_phrase: each one followed the stubbornness of their own evil heart
  preserved_meaning: Every person persisted in conduct directed by a stubborn, evil inner will.
  reasoning_layer_used: Lexical decisions for וַיֵּלְכוּ אִישׁ, בִּשְׁרִירוּת, and לִבָּם הָרָע
  rationale: “Followed” makes the conduct metaphor natural, while “each one” and “their own” retain its individual force.
- pob_phrase: all the words of this covenant, which I commanded them to do, but they did not do them
  simplified_phrase: everything stated in this covenant. I had commanded them to carry out its words, but they did not
  preserved_meaning: The covenant's full declaration came upon them because they failed to carry out its commands.
  reasoning_layer_used: Covenant-sanction theological decision and lexical decisions for דִּבְרֵי and עָשׂוּ
  rationale: Two sentences clarify the logic without narrowing the covenant's words to commands or curses alone.
