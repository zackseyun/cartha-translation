translation:
  language: en
  text: Yet they did not listen or turn their ears to hear. Instead, each one followed the stubbornness of their own evil heart. So I brought on them everything stated in this covenant.[a] I had commanded them to carry out its words, but they did not.
  philosophy: optimal-equivalence
  footnotes:
