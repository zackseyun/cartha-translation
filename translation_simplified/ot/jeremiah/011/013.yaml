translation:
  language: en
  text: 'The reason is this, Judah: your gods have become as numerous as your cities. Your people have set up as many altars to Shame[a] as Jerusalem has streets—altars for making offerings to Baal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Shame” is a contemptuous name for a pagan god, probably Baal.
    reason: lexical_alternative
  - marker: b
    text: Or “burn incense to Baal”; the Hebrew often refers to an offering that produces smoke.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For your gods, O Judah, have become as numerous as your cities
  simplified_phrase: 'The reason is this, Judah: your gods have become as numerous as your cities'
  preserved_meaning: Judah’s many gods explain the preceding judgment, and their number matches its cities.
  reasoning_layer_used: Lexical decision for כִּי and contextual rationale
  rationale: The wording states the explanatory link directly and replaces the archaic vocative “O Judah.”
- pob_phrase: as numerous as the streets of Jerusalem, you have set up altars
  simplified_phrase: Your people have set up as many altars ... as Jerusalem has streets
  preserved_meaning: Judah’s inhabitants established altars matching Jerusalem’s many streets in number.
  reasoning_layer_used: Theological decision on collective Judah and the plural verb
  rationale: “Your people” clearly conveys the shift from personified Judah to its inhabitants.
- pob_phrase: altars to Shame, altars to make offerings to Baal
  simplified_phrase: altars to Shame ...—altars for making offerings to Baal
  preserved_meaning: The altars are dedicated to “Shame” and established for making offerings to Baal.
  reasoning_layer_used: Lexical decisions for לַבֹּשֶׁת and לְקַטֵּר
  rationale: The purpose phrase preserves the deliberate parallel between “Shame” and Baal without narrowing the offerings to incense.
