translation:
  language: en
  text: They have gone back to the sins of their ancestors from long ago, who refused to listen to my words. They too have followed other gods in order to serve them. The people of Israel and Judah have broken my covenant that I made with their ancestors.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: returned to the iniquities of their first fathers
  simplified_phrase: gone back to the sins of their ancestors from long ago
  preserved_meaning: The present generation has reverted to the wrongdoing of earlier generations.
  reasoning_layer_used: Lexical decisions and covenantal-continuity decision
  rationale: This makes the ancestral link natural while retaining the moral weight of their sins.
- pob_phrase: refused to hear my words
  simplified_phrase: refused to listen to my words
  preserved_meaning: They deliberately rejected what God said without limiting the phrase to obedience alone.
  reasoning_layer_used: Lexical decision for מֵאֲנוּ לִשְׁמֹעַ אֶת דְּבָרַי
  rationale: “Listen” is natural English and still allows the contextual sense of obedient response.
- pob_phrase: they themselves have gone after other gods to serve them; The house of Israel and the house of Judah
  simplified_phrase: They too have followed other gods in order to serve them; The people of Israel and Judah
  preserved_meaning: The present people joined their ancestors in serving other gods, and both covenant communities broke God's covenant.
  reasoning_layer_used: Lexical decisions for וְהֵמָּה, הָלְכוּ אַחֲרֵי, לְעָבְדָם, and the corporate house titles
  rationale: “They too” keeps the emphasis, while “followed” and “people” clarify the allegiance and corporate idioms.
