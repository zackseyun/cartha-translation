  - The theological decision favors the land of Judah rather than the globe.
  confidence: high
  alternatives_preserved:
  - throughout the whole earth
- pob_phrase: I have not lent, nor have they lent to me
  rendering: I have not lent money or borrowed from anyone
  claim: The lending language concerns reciprocal debt relationships.
  evidence:
  - The lexical rationale identifies lending and borrowing in a debt context.
  - The POB cultural note says debt has not supplied an ordinary cause for hostility.
  confidence: high
  alternatives_preserved:
  - lent on interest
  - been a creditor or debtor
translation_notes:
  risk_flags:
