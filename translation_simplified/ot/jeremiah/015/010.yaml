translation:
  language: en
  text: How terrible for me, my mother, that you gave birth to me! I am a man in conflict and dispute with people throughout the land.[a] I have not lent money or borrowed from anyone,[b] yet every one of them curses me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “throughout the whole earth.”
    reason: alternative_reading
  - marker: b
    text: Jeremiah means that no dispute over debts has caused this hostility.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Woe to me, my mother, because you bore me
  simplified_phrase: How terrible for me, my mother, that you gave birth to me!
  preserved_meaning: Jeremiah cries out in distress and directly addresses his mother about his birth.
  reasoning_layer_used: Lexical decisions for אֽוֹי, אִמִּי, and כִּי יְלִדְתִּנִי
  rationale: The exclamation expresses the force of “woe” in familiar modern language.
- pob_phrase: a man of strife and a man of contention to all the land
  simplified_phrase: a man in conflict and dispute with people throughout the land
  preserved_meaning: Jeremiah is characterized by widespread conflict and opposition across the land.
  reasoning_layer_used: Lexical decisions for אִישׁ רִיב, וְאִישׁ מָדוֹן, and לְכָל הָאָרֶץ
  rationale: The rewrite keeps both overlapping conflict terms while making the relationship understandable.
- pob_phrase: I have not lent, nor have they lent to me
  simplified_phrase: I have not lent money or borrowed from anyone
  preserved_meaning: Jeremiah has been neither creditor nor debtor to those who oppose him.
  reasoning_layer_used: Lexical decisions and cultural note for נשה
  rationale: The reciprocal debt language is stated in ordinary financial terms.
interpretive_expansions:
- pob_phrase: to all the land
  rendering: with people throughout the land
  claim: The land represents the people opposing Jeremiah across Judah.
  evidence:
