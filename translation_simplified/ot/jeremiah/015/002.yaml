translation:
  language: en
  text: 'When they ask you, “Where should we go?” answer them, “This is what Yahweh says: Those assigned to death, to death; those assigned to the sword, to the sword; those assigned to famine, to famine; and those assigned to captivity,[a] to captivity.”'
  philosophy: optimal-equivalence
  footnotes:
