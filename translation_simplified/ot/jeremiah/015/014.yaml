translation:
  language: en
  text: I will make your enemies go into a land you have never known.[a] For a fire has been kindled in my anger, and it will burn against you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions and Jeremiah 17:4 read, “I will make you serve your enemies in a land you have never known.” The Hebrew text here reads “your enemies.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: make your enemies pass into
  simplified_phrase: make your enemies go into
  preserved_meaning: God will cause the enemies to move into the land.
  reasoning_layer_used: The lexical decision identifies the verb as causative and keeps “your enemies” as its object.
  rationale: “Go into” expresses the causative movement more clearly than “pass into.”
- pob_phrase: a land you have not known
  simplified_phrase: a land you have never known
  preserved_meaning: The land is outside the addressee’s experience.
  reasoning_layer_used: The lexical rationale treats “known” as experiential.
  rationale: “Never known” makes the experiential sense natural in modern English.
- pob_phrase: for a fire has been kindled in my anger; it will burn against you
  simplified_phrase: For a fire has been kindled in my anger, and it will burn against you.
  preserved_meaning: God’s anger is pictured as a kindled fire of judgment directed against the people.
  reasoning_layer_used: The lexical decisions require retaining the fire image, anger, and future burning.
  rationale: A new sentence and coordinating conjunction clarify the two stages of the fire image.
translation_notes:
  risk_flags:
  - risk: The main Hebrew reading is difficult and differs from some ancient witnesses and Jeremiah 17:4.
    mitigation: The main text follows the POB choice, while the alternate reading remains in a footnote.
  - risk: English “you” does not display the Hebrew shift from singular to plural address.
    mitigation: The wording preserves the POB’s deliberate refusal to regularize the pronouns.
