translation:
  language: en
  text: 'Therefore, Yahweh says:

    “If you return, I will restore you,

    and you will stand before me.

    If you separate what is precious from what is worthless,[a]

    you will speak for me as my mouth.[b]

    They will turn to you,

    but you must not turn to them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means separating worthy speech from unworthy speech, though the Hebrew image is broader.
    reason: lexical_alternative
  - marker: b
    text: Literally, “you will be as my mouth,” meaning that Jeremiah will speak for Yahweh.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If you bring out the precious from the worthless
  simplified_phrase: If you separate what is precious from what is worthless
  preserved_meaning: Jeremiah must distinguish the precious from the worthless without limiting the image only to speech.
  reasoning_layer_used: Lexical and theological decisions on יָקָר, זֹלֵל, and the preserved metaphor.
  rationale: “Separate what is” makes the contrast clear while retaining both sides of the Hebrew image.
- pob_phrase: you will be as my mouth
  simplified_phrase: you will speak for me as my mouth
  preserved_meaning: Jeremiah will speak with Yahweh’s authorization while the concrete mouth image remains.
  reasoning_layer_used: Lexical decision and footnote for כְּפִי תִהְיֶה.
  rationale: The added verb explains the idiom without replacing its vivid image.
- pob_phrase: They will turn to you, but you must not turn to them
  simplified_phrase: They will turn to you, but you must not turn to them
  preserved_meaning: Others will change toward Jeremiah, while he must not conform to them.
  reasoning_layer_used: Lexical decision on the repeated verb שׁוּב.
  rationale: The concise contrast is already clear and preserves the repeated turning language.
