translation:
  language: en
  text: Why has my pain become unending? Why is my wound incurable, refusing to heal? Will you really be like a deceptive stream[a] to me, like water that cannot be depended on?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a failing stream”—a streambed that seems to promise water but proves unreliable.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my pain become perpetual
  simplified_phrase: my pain become unending
  preserved_meaning: Jeremiah’s suffering continues without relief.
  reasoning_layer_used: Lexical decision for נֶצַח
  rationale: “Unending” expresses ongoing duration in more familiar English than “perpetual.”
- pob_phrase: my wound incurable, refusing to be healed
  simplified_phrase: my wound incurable, refusing to heal
  preserved_meaning: The wound is beyond remedy and is vividly personified as resisting healing.
  reasoning_layer_used: Lexical decisions for מַכָּתִי, אֲנוּשָׁה, and מֵאֲנָה הֵרָפֵא
  rationale: The active wording is natural English while keeping the medical image and personification.
- pob_phrase: Will you indeed be to me like a deceptive brook, like waters that are not reliable?
  simplified_phrase: Will you really be like a deceptive stream to me, like water that cannot be depended on?
  preserved_meaning: Jeremiah boldly asks whether God will prove as unreliable as a stream that fails.
  reasoning_layer_used: Lexical decisions for הָיוֹ תִהְיֶה לִי, אַכְזָב, and מַיִם לֹא נֶאֱמָנוּ, with the theological decision on lament
  rationale: Familiar wording clarifies the image without softening Jeremiah’s accusation.
translation_notes:
  risk_flags:
  - risk: The complaint may sound as though the text declares God unreliable.
    mitigation: The rhetorical question preserves Jeremiah’s bold lament without turning it into a settled claim.
  - risk: Modern readers may miss why a stream could be deceptive.
    mitigation: The footnote explains that the stream promises water but proves unreliable.
