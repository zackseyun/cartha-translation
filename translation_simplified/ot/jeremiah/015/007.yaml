translation:
  language: en
  text: At the gates of the land[a], I winnowed them with a winnowing fork, scattering them like grain. I left my people bereaved and destroyed them. They did not turn back from their ways.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the gates of the earth.” The Hebrew word can mean either “land” or “earth”; “land” here refers to Judah.
    reason: lexical_alternative
  - marker: b
    text: Or “They did not repent of their ways.” The Hebrew expression “turn back” can refer to repentance.
    reason: lexical_alternative
