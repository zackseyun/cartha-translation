  reasoning_layer_used: POB lexical decision and footnote a
  rationale: Naming the implied children makes the Hebrew idiom immediately clear.
- pob_phrase: Her sun has gone down while it was still day
  simplified_phrase: Her sun has gone down before the day is over
  preserved_meaning: Her life and hope end prematurely while preserving the sun image.
  reasoning_layer_used: POB lexical decisions and footnote c
  rationale: The recast wording makes the untimely ending easier to grasp.
- pob_phrase: the remnant of them I will give to the sword
  simplified_phrase: I will hand over the survivors to the sword
  preserved_meaning: Those still alive will be delivered to violent death in judgment.
  reasoning_layer_used: POB lexical decisions for remnant and sword
  rationale: “Survivors” and “hand over” express the judgment formula in common English.
