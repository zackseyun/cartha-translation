translation:
  language: en
  text: The woman who bore seven children[a] has withered away. She has breathed out her life. Her sun has gone down before the day is over.[b] She is ashamed and humiliated. “I will hand over the survivors to the sword before their enemies,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the mother of seven,” a picture of a woman once considered especially fruitful and blessed.
    reason: lexical_alternative
  - marker: b
    text: Her sun going down before day ends pictures a premature end.
    reason: cultural_note
