  preserved_meaning: The coming defeat is presented as the consequence of the preceding judgment.
  reasoning_layer_used: Lexical decision for לָכֵן
  rationale: “So” expresses the same conclusion in more natural common English.
- pob_phrase: all the men of war
  simplified_phrase: all her fighting men
  preserved_meaning: Every male combatant belonging to the city is included.
  reasoning_layer_used: Lexical decision for אַנְשֵׁי הַמִּלְחָמָה
  rationale: “Fighting men” makes the Hebrew military expression immediately clear.
- pob_phrase: declares Yahweh of Armies
  simplified_phrase: This is what Yahweh of Armies declares
  preserved_meaning: The prophetic statement is authenticated as Yahweh’s declaration, and his martial title remains intact.
  reasoning_layer_used: Lexical and theological decisions for נְאֻם יְהוָה צְבָאוֹת
  rationale: A separate sentence gives the declaration formula a natural English structure.
