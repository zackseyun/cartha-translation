translation:
  language: en
  text: So her young men will fall in her streets,[a] and all her fighting men will be silenced on that day.[b] This is what Yahweh of Armies declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in her public squares” or “in her open places.”
    reason: lexical_alternative
  - marker: b
    text: Or “will perish” or “will be cut off.” The Hebrew can mean being silenced, stilled, or brought to ruin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore
