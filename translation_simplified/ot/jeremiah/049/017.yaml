translation:
  language: en
  text: Edom will become a ruined land that fills people with horror. Everyone who passes by will be appalled and make a sharp whistle[a] when they see all her wounds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hiss.” The Hebrew describes a sharp sound of astonishment or mockery.
