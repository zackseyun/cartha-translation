translation:
  language: en
  text: If people came to pick your grapes, would they not leave some grapes behind? If thieves came at night, they would destroy only as much as they needed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can also be understood as a question: “Would they not steal only until they had enough?”'
