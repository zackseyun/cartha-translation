translation:
  language: en
  text: Look! Like a lion coming up from the thickets along the Jordan[a], he will attack a secure pasture. But in an instant I will drive him away from it, and I will put a chosen one in charge of it. For who is like me? Who can summon me[b]? What shepherd can stand before me?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression can also be translated “the pride” or “the majesty of the Jordan”; here it likely means the dense growth along the river.
    reason: lexical_alternative
  - marker: b
    text: This may also mean “Who can set a time for me?” or, in a legal sense, “Who can call me to account?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: like a lion he will come up from the thicket of the Jordan against a secure pasture
  simplified_phrase: Like a lion coming up from the thickets along the Jordan, he will attack a secure pasture
  preserved_meaning: The attacker advances like a lion from dense riverside growth toward a place thought secure.
  reasoning_layer_used: Lexical decisions for the lion simile, motion verb, Jordan idiom, and secure pasture
  rationale: Reordering the image and using “attack” makes the movement and threat immediately clear.
- pob_phrase: I will make him run from it
  simplified_phrase: I will drive him away from it
  preserved_meaning: The speaker will suddenly force the attacker to leave the pasture or land.
  reasoning_layer_used: Lexical decision for the causative verb אֲרִיצֶנּוּ
  rationale: “Drive him away” expresses forced departure more naturally than “make him run.”
- pob_phrase: I will appoint over it whomever is chosen
  simplified_phrase: I will put a chosen one in charge of it
  preserved_meaning: The speaker will install a selected person over the place.
  reasoning_layer_used: Lexical decision for בָחוּר and פקד
  rationale: “Put in charge” clearly communicates appointment while retaining the idea of selection.
translation_notes:
  risk_flags:
  - risk: The identity of “he” is not stated within the verse.
    mitigation: The draft preserves the pronoun rather than naming or identifying the attacker.
  - risk: The Jordan expression and the verb translated “summon” both have documented alternatives.
    mitigation: Anchored footnotes preserve both ambiguities without weakening the main reading.
