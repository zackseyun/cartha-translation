translation:
  language: en
  text: “I will shatter Elam[a] before its enemies and before those trying to kill its people. In my burning anger, I will bring disaster on them,” declares Yahweh. “I will send the sword after them until I have brought them to an end.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “terrify Elam” or “dismay Elam”; the Hebrew can describe panic as well as collapse.
    reason: lexical_alternative
