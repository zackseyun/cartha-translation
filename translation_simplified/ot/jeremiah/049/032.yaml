  text: Their camels will be taken as plunder, and their many livestock as spoils of war. I will scatter to every wind those who cut the corners of their hair.[a] I will bring disaster on them from every side, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This describes a distinctive practice of trimming the hair at its edges, perhaps at the temples.
    reason: cultural_note
