translation:
  language: en
  text: 'So listen to Yahweh’s plan against Edom and to what he intends against the people of Teman: Surely the little ones of the flock will drag them away.[a] Surely he will make their pasture desolate over them.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase may mean “the youngest of the flock” or “the least of the flock.” It may picture weak or insignificant attackers.
    reason: lexical_alternative
  - marker: b
    text: “Pasture” may also mean “dwelling place” or “fold”; the Hebrew expression “over them” is difficult.
    reason: lexical_alternative
