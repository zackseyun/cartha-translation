translation:
  language: en
  text: “So look! The days are coming,” declares Yahweh. “I will make the battle cry ring out against Rabbah of the Ammonites. It will become a deserted mound of ruins, and the towns that depend on it will be set on fire. Then Israel will take the land from those who took it from him,” says Yahweh.
