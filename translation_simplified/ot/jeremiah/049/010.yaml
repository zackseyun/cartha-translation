translation:
  language: en
  text: For I have stripped Esau bare[a] and exposed his hiding places. He will not be able to hide. His descendants, brothers, and neighbors are destroyed, and he is no more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
