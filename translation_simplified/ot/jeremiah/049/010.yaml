simplification_decisions:
- pob_phrase: I have uncovered his hiding places
  simplified_phrase: exposed his hiding places
  preserved_meaning: God has brought Esau’s places of concealment into the open.
  reasoning_layer_used: Lexical decisions for גִּלֵּיתִי and מִסְתָּרָיו
  rationale: “Exposed” clearly conveys that the hiding places have been uncovered.
- pob_phrase: he will not be able to hide himself
  simplified_phrase: He will not be able to hide.
  preserved_meaning: The coming judgment will leave Esau no way to conceal himself.
  reasoning_layer_used: Lexical decision for וְנֶחְבָּה לֹא יוּכָל and grounding review
  rationale: The direct sentence retains the forward-looking force of the announced judgment.
- pob_phrase: His offspring, his brothers, and his neighbors
  simplified_phrase: His descendants, brothers, and neighbors
  preserved_meaning: The judgment reaches Esau’s succeeding generations, related peoples, and nearby associates.
  reasoning_layer_used: Lexical decisions for זַרְעוֹ, אֶחָיו, and שְׁכֵנָיו
  rationale: “Descendants” is clearer than “offspring” for a nation while preserving each distinct group.
