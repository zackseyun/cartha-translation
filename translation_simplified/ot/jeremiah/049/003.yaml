translation:
  language: en
  text: Heshbon, wail, because Ai has been devastated! Daughters of Rabbah, cry out! Dress in rough sackcloth and mourn. Wander restlessly among the city walls, because their king[a] will go into exile along with his priests and officials.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Milcom will go into exile” (also spelled “Malcam”), if the Hebrew refers to the Ammonite god rather than to “their king.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Wail, Heshbon, for Ai is devastated!
  simplified_phrase: Heshbon, wail, because Ai has been devastated!
  preserved_meaning: Heshbon is commanded to lament Ai’s violent devastation.
  reasoning_layer_used: POB lexical decisions for הֵילִילִי and שֻׁדְּדָה
  rationale: The reordered address and “because” make the command and its reason immediately clear.
- pob_phrase: Put on sackcloth, mourn
  simplified_phrase: Dress in rough sackcloth and mourn
  preserved_meaning: The people are commanded to wear sackcloth as part of public mourning.
  reasoning_layer_used: POB lexical decision for חֲגֹרְנָה שַׂקִּים
  rationale: “Dress in rough sackcloth” helps readers picture the mourning practice without replacing its biblical term.
- pob_phrase: together with his priests and his officials
  simplified_phrase: along with his priests and officials
  preserved_meaning: The priests and civic leaders will share the king’s exile.
  reasoning_layer_used: POB lexical decisions for כֹּהֲנָיו, וְשָׂרָיו, and יַחְדָּיו
  rationale: The shorter phrasing removes repeated possession while keeping all three groups together.
