translation:
  language: en
  text: “Look! I am bringing terror upon you from every side,” declares the Lord Yahweh of Armies. “You will be driven away, each man fleeing straight ahead.[a] No one will gather the fugitives back together.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “each man before him.” The terse Hebrew may picture each person rushing ahead in panic without regard for anyone else.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, I am bringing terror upon you from all around you
  simplified_phrase: Look! I am bringing terror upon you from every side
  preserved_meaning: A solemn warning announces imminent terror encircling the people.
  reasoning_layer_used: POB lexical decisions for הִנְנִי, מֵבִיא, פַּחַד, and מִכָּל סְבִיבַיִךְ
  rationale: The short exclamation and common idiom make the warning immediate while preserving its force and surrounding-danger image.
- pob_phrase: the Lord GOD of hosts
  simplified_phrase: the Lord Yahweh of Armies
  preserved_meaning: The title identifies the sovereign God by his covenant name and his command of heavenly armies.
  reasoning_layer_used: POB theological decision for יְהוָה and lexical alternative for צְבָאוֹת
  rationale: “Yahweh” follows the doctrinal decision, while “Armies” makes the traditional but opaque “hosts” understandable.
- pob_phrase: with no one to gather the fugitive
  simplified_phrase: No one will gather the fugitives back together
  preserved_meaning: After the people are scattered, nobody will regroup those forced to flee.
  reasoning_layer_used: POB lexical decisions for וְאֵין מְקַבֵּץ and לַנֹּדֵד
  rationale: A separate sentence states the result plainly and clarifies that gathering means regrouping the scattered people.
