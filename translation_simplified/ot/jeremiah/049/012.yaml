translation:
  language: en
  text: 'This is what Yahweh says: “Take notice! Those who were not sentenced to drink from the cup[a] will certainly drink. Will you, then, escape punishment? You will not escape punishment. You will certainly drink from the cup.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The cup is a prophetic image of the judgment God gives nations to drink. The opening phrase may also mean “those for whom drinking from the cup was not their just due.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'For thus says Yahweh: Behold'
  simplified_phrase: 'This is what Yahweh says: “Take notice!”'
  preserved_meaning: Yahweh solemnly calls attention to his judgment declaration.
  reasoning_layer_used: POB lexical decision for הִנֵּה
  rationale: The direct warning preserves the force of “Behold” in common English.
- pob_phrase: and are you the one who will go unpunished?
  simplified_phrase: Will you, then, escape punishment?
  preserved_meaning: Edom is confronted with a rhetorical question denying any escape from judgment.
  reasoning_layer_used: POB lexical decisions for וְאַתָּה הוּא and נקה
  rationale: The shorter question keeps both the emphatic address and judicial sense.
- pob_phrase: for you will surely drink
  simplified_phrase: You will certainly drink from the cup.
  preserved_meaning: Edom’s judgment is emphatically certain, and the cup image remains explicit.
  reasoning_layer_used: POB lexical and theological decisions for שָׁתֹה תִּשְׁתֶּה and הַכּוֹס
  rationale: Repeating the cup makes the final image immediately clear without replacing it.
translation_notes:
  risk_flags:
