- pob_phrase: Rise up, go up against
  simplified_phrase: Rise up and march against
  preserved_meaning: The plural command is a military summons to advance against the nation.
  reasoning_layer_used: POB lexical decisions for קוּמוּ and עֲלוּ
  rationale: “March against” makes the wartime sense immediately clear.
- pob_phrase: dwelling securely
  simplified_phrase: lives in safety
  preserved_meaning: The nation is settled and believes itself secure.
  reasoning_layer_used: POB lexical decision for יוֹשֵׁב לָבֶטַח
  rationale: The common phrase “lives in safety” replaces the less familiar participial wording.
- pob_phrase: they dwell alone
  simplified_phrase: its people live alone
  preserved_meaning: The people live separately or in isolation.
  reasoning_layer_used: POB lexical decisions for בָּדָד and יִשְׁכֹּנוּ
  rationale: Naming “its people” clarifies the plural subject without resolving the nature of their isolation.
interpretive_expansions:
- pob_phrase: no doors or bars
  rendering: no defensive gates or bars
  claim: The doors and bars refer to defenses the nation lacks.
  evidence:
