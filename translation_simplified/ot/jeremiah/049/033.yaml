translation:
  language: en
  text: Hazor will become a home for jackals, a wasteland forever. No man will live there, and no son of man will stay there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “no man” and “no son of man,” meaning that no human being will live or stay there.
