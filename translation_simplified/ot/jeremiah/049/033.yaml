  rationale: “Home” expresses the dwelling-place image more plainly than “haunt.”
- pob_phrase: a desolation forever
  simplified_phrase: a wasteland forever
  preserved_meaning: Hazor will remain devastated for an enduring time.
  reasoning_layer_used: Lexical decisions for שְׁמָמָה and עַד עוֹלָם
  rationale: “Wasteland” gives modern readers a concrete picture of complete desolation.
- pob_phrase: no man will dwell there, and no son of man will sojourn in it
  simplified_phrase: No man will live there, and no son of man will stay there
  preserved_meaning: No permanent resident or temporary outsider will inhabit Hazor.
  reasoning_layer_used: Lexical and theological decisions for יֵשֵׁב, יָגוּר, אִישׁ, and בֶּן אָדָם
  rationale: “Live” and “stay” preserve the two kinds of residence while retaining the source’s masculine forms.
