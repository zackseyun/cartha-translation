simplification_decisions:
- pob_phrase: kindle a fire in the wall of Damascus
  simplified_phrase: start a fire at the wall of Damascus
  preserved_meaning: God directly causes a fire near or within Damascus’s wall without fixing its exact position.
  reasoning_layer_used: Lexical decisions for וְהִצַּתִּי and בְּחוֹמַת, with the spatial ambiguity retained in the footnote.
  rationale: “Start a fire at the wall” is plain English and does not make the wall the direct object burned.
- pob_phrase: it will consume
  simplified_phrase: it will burn up
  preserved_meaning: The fire will destroy the structures it reaches.
  reasoning_layer_used: Lexical decision for וְאָכְלָה.
  rationale: “Burn up” expresses the destructive force in familiar language.
translation_notes:
  risk_flags:
  - risk: “At the wall” may sound more precise than the Hebrew spatial phrase.
    mitigation: The footnote preserves “against” and states that the exact position is unspecified.
