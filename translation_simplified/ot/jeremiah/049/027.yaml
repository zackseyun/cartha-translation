translation:
  language: en
  text: I will start a fire at the wall of Damascus[a], and it will burn up the palaces of Ben-hadad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will start a fire against the wall of Damascus.” The Hebrew does not specify the fire’s exact position.
