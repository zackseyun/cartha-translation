  simplified_phrase: About the Ammonites
  preserved_meaning: The oracle concerns the people descended from Ammon.
  reasoning_layer_used: POB lexical decision for לִבְנֵי עַמּוֹן
  rationale: The common ethnic name is clearer than the literal family expression.
- pob_phrase: Does he have no heir?
  simplified_phrase: Is there no heir to inherit Israel’s land?
  preserved_meaning: Israel should have a rightful successor to its territory.
  reasoning_layer_used: POB lexical rationale for יוֹרֵשׁ and the verse’s inheritance logic
  rationale: Naming Israel and the land makes the inheritance argument clear.
- pob_phrase: taken possession of Gad
  simplified_phrase: taken over the land of Gad
  preserved_meaning: Milcom is portrayed as possessing Gad’s tribal territory.
  reasoning_layer_used: POB lexical decisions for יָרַשׁ and גָּד
  rationale: The wording clearly expresses territorial occupation in ordinary English.
