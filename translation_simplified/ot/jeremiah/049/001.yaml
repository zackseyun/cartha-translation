translation:
  language: en
  text: 'About the Ammonites, Yahweh says:


    “Does Israel have no sons? Is there no heir to inherit Israel’s land? Why then has Milcom[a] taken over the land of Gad, and his people settled in Gad’s cities?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can also be read “their king”: “Why has their king taken over the land of Gad?”'
    reason: alternative_reading
