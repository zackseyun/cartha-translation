translation:
  language: en
  text: They will take away their tents and flocks. They will also carry off their tent coverings, all their belongings, and their camels. Then they will shout against them,[a] “Terror on every side!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe a cry directed over them, concerning them, or against them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They will take their tents and their flocks
  simplified_phrase: They will take away their tents and flocks
  preserved_meaning: The attackers take the nomadic people's dwellings and livestock as plunder.
  reasoning_layer_used: Lexical decisions for יִקָּחוּ, אָהֳלֵיהֶם, and צֹאנָם
  rationale: “Take away” makes the hostile removal clear without narrowing the verb to “seize.”
- pob_phrase: their tent curtains and all their goods
  simplified_phrase: their tent coverings, all their belongings
  preserved_meaning: The plunder includes the panels of their tents and the full range of their possessions.
  reasoning_layer_used: Lexical decisions for יְרִיעוֹתֵיהֶם and כָּל־כְּלֵיהֶם
  rationale: “Coverings” and “belongings” are more immediately understandable in this nomadic plunder scene.
- pob_phrase: and they will cry out against them
  simplified_phrase: Then they will shout against them
  preserved_meaning: The attackers publicly direct the cry of terror toward or concerning the victims.
  reasoning_layer_used: Lexical decision and footnote for וְקָרְאוּ עֲלֵיהֶם
  rationale: “Shout” is plain English, while the footnote preserves the Hebrew preposition's range.
translation_notes:
  risk_flags:
