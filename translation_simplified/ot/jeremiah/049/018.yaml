translation:
  language: en
  text: Yahweh says, “Just as Sodom and Gomorrah and the towns around them were overthrown, no one will live there, and no human being will stay there even temporarily.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As when Sodom and Gomorrah and their neighboring towns were overthrown, says Yahweh
  simplified_phrase: Yahweh says, “Just as Sodom and Gomorrah and the towns around them were overthrown
  preserved_meaning: Yahweh compares the coming desolation to the overthrow of Sodom, Gomorrah, and nearby towns.
  reasoning_layer_used: Lexical decisions for כְּמַהְפֵּכַת and the prophetic formula, plus the theological decision for Yahweh
  rationale: The new order and “towns around them” make the comparison natural and immediate.
- pob_phrase: no man ... no son of man
  simplified_phrase: no one ... no human being
  preserved_meaning: The generic masculine expressions exclude every person from living or staying there.
  reasoning_layer_used: Lexical and theological decisions on representative anthropological language
  rationale: The idiomatic wording prevents a false messianic reading while preserving the universal human reference.
- pob_phrase: will sojourn in her
  simplified_phrase: will stay there even temporarily
  preserved_meaning: The place will have neither permanent inhabitants nor temporary residents.
  reasoning_layer_used: Lexical decisions for יָגוּר and בָּהּ
  rationale: Common wording preserves the temporary-residence sense of “sojourn” and avoids unnatural personification.
interpretive_expansions:
- pob_phrase: will sojourn
  rendering: will stay there even temporarily
  claim: The second verb rules out temporary residence as well as settled habitation.
  evidence:
  - The POB lexical rationale says יָגוּר refers to residing as a temporary settler or sojourner.
  confidence: high
  alternatives_preserved:
  - will sojourn
  - will reside
  - will stay as an alien
translation_notes:
  risk_flags:
  - risk: Using “there” does not retain the feminine personification conveyed by “in her.”
    mitigation: The place remains explicit, and ordinary English avoids suggesting that a literal woman is meant.
