  preserved_meaning: The prophetic formula and divine title remain intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The modern formula is clearer while retaining Yahweh and the image of hosts.
- pob_phrase: Is there no longer wisdom in Teman?
  simplified_phrase: Is there no wisdom left in Teman?
  preserved_meaning: The question asks whether any of Teman’s wisdom remains.
  reasoning_layer_used: POB lexical decision for הַאֵין עוֹד
  rationale: “No wisdom left” expresses cessation in ordinary English.
- pob_phrase: Has counsel perished from the prudent? Has their wisdom become corrupted?
  simplified_phrase: Has advice vanished from those who understand? Has their wisdom gone bad?
  preserved_meaning: Counsel has disappeared from discerning people, and their wisdom is pictured as spoiled.
