translation:
  language: en
  text: 'Concerning Edom:


    This is what Yahweh of hosts says:


    “Is there no wisdom left in Teman?

    Has advice vanished from those who understand?

    Has their wisdom gone bad?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gone bad” pictures their wisdom as something that has spoiled or become corrupt.
    reason: lexical_alternative
