translation:
  language: en
  text: 'Tell them, ‘This is what Yahweh of Hosts, the God of Israel, says: Listen! I am sending for Nebuchadnezzar king of Babylon, my servant, and I will bring him here. I will place his throne over these stones that I hid, and he will spread his royal canopy[a] over them.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word may mean a canopy, pavilion, royal tent, or another kind of royal covering.
    reason: lexical_alternative
