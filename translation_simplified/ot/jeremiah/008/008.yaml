translation:
  language: en
  text: How can you claim, “We are wise, and we have Yahweh’s law”? But look—the scribes’ lying pen has turned it into a lie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compact Hebrew may also mean that the scribes’ pen produced falsehood or did its work falsely.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How can you say
  simplified_phrase: How can you claim
  preserved_meaning: The speakers assert that they are wise and possess Yahweh’s law.
  reasoning_layer_used: Lexical decision for אֵיכָה and immediate context
  rationale: “Claim” makes the challenged assertion clear while keeping the indignant question.
- pob_phrase: the law of Yahweh is with us
  simplified_phrase: we have Yahweh’s law
  preserved_meaning: They present themselves as possessing Yahweh’s covenantal law.
  reasoning_layer_used: Lexical and theological decisions for תּוֹרַת יְהוָה and אִתָּנוּ
  rationale: This common wording keeps “law” and Yahweh’s personal name without the less natural phrase “is with us.”
- pob_phrase: has made it into a lie
  simplified_phrase: has turned it into a lie
  preserved_meaning: The scribes’ false handling has transformed the law into falsehood.
  reasoning_layer_used: Lexical decisions for לַשֶּׁקֶר and עָשָׂה
  rationale: “Turned” clearly expresses the protected resultative force of “into a lie.”
translation_notes:
  risk_flags:
  - risk: The compact Hebrew permits several nuances in how the scribes’ pen falsified the law.
    mitigation: The main text keeps POB’s reading, while the footnote preserves the documented alternatives.
