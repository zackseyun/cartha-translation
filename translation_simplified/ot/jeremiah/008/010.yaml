translation:
  language: en
  text: So I will give their wives to others and their fields to people who will take possession of them.[a] This is because everyone, from the least important to the greatest, is greedy for dishonest profit. Everyone, from prophet to priest, makes a practice of deceit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “inherit their fields,” but here it likely includes taking them from their former owners.
    reason: lexical_alternative
