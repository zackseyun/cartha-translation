simplification_decisions:
- pob_phrase: death will be chosen rather than life by all the remnant who remain
  simplified_phrase: All the remnant left ... will choose death rather than life
  preserved_meaning: The surviving remnant will prefer death to continued life.
  reasoning_layer_used: lexical decisions for וְנִבְחַר, מֵחַיִּים, and שְׁאֵרִית
  rationale: The active sentence states the same agency more clearly while retaining “remnant.”
- pob_phrase: in all the places where the remnant remain, where I have driven them
  simplified_phrase: wherever I have driven them
  preserved_meaning: The remnant is scattered throughout every place of divinely imposed exile.
  reasoning_layer_used: lexical rationale and POB footnote
  rationale: “Wherever” removes awkward repetition while the footnote preserves its emphasis.
- pob_phrase: declares Yahweh of hosts
  simplified_phrase: This is what Yahweh of hosts declares
  preserved_meaning: The statement is a solemn declaration from Yahweh under his retained title.
  reasoning_layer_used: theological decision on Yahweh and lexical decision on נְאֻם יהוה צבאות
  rationale: A separate sentence makes the prophetic formula easier to read without weakening it.
