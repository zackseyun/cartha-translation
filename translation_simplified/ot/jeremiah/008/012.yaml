translation:
  language: en
  text: Were they ashamed because they had done something detestable? No. They felt no shame at all; they did not even know how to blush. So they will fall with others who fall. At the time of their punishment,[a] they will stumble, says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the time when God comes to call them to account.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because they had done an abomination
  simplified_phrase: because they had done something detestable
  preserved_meaning: Their morally abhorrent act should have caused shame.
  reasoning_layer_used: Lexical decisions for כִּי and תוֹעֵבָה
  rationale: “Because” preserves the causal link, while “something detestable” makes the condemnation immediately clear.
- pob_phrase: they were not ashamed at all
  simplified_phrase: They felt no shame at all
  preserved_meaning: They completely lacked the shame their conduct warranted.
  reasoning_layer_used: Lexical decision for גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  rationale: This states their moral response plainly while retaining the emphatic denial.
- pob_phrase: they will fall among the fallen
  simplified_phrase: they will fall with others who fall
  preserved_meaning: They will share the fate of others struck down in judgment.
  reasoning_layer_used: Lexical decision for יִפְּלוּ בַנֹּפְלִים
  rationale: This clarifies the shared fate while preserving the repeated image of falling.
interpretive_expansions:
- pob_phrase: they will fall among the fallen
  rendering: they will fall with others who fall
  claim: They will share in the downfall of others under judgment.
  evidence:
  - The POB lexical rationale identifies sharing the fate of those struck down as the likely idiomatic sense.
  - The next clause places their stumbling at the time of punishment.
  confidence: high
  alternatives_preserved:
  - fall among the fallen
translation_notes:
  risk_flags:
  - risk: “Blush” might be understood only as a physical reaction.
    mitigation: The preceding statement that they felt no shame establishes its moral sense.
