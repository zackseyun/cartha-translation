translation:
  language: en
  text: From Dan comes the sound of his horses snorting. At the neighing of his powerful warhorses, the whole land[a] shakes. They come and devour the land and everything in it—the city and everyone who lives there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole earth shakes.” Here “land” fits the invasion of Judah.
    reason: lexical_alternative
