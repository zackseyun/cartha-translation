translation:
  language: en
  text: They have treated the wound of the daughter of my people[a] as if it were nothing serious. They say, “Peace, peace,” even though there is no peace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The daughter of my people” pictures my people as a wounded daughter.
    reason: simplification_note
  - marker: b
