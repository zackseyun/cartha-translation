  preserved_meaning: Jerusalem identifies the people who have turned away.
  reasoning_layer_used: POB theological decision on the syntax of Jerusalem
  rationale: The added “of” makes the apposition immediately clear in natural English.
- pob_phrase: with a perpetual turning away
  simplified_phrase: and kept on turning away
  preserved_meaning: Their departure is persistent and ongoing.
  reasoning_layer_used: POB lexical decisions for מְשֻׁבָה and נִצַּחַת
  rationale: A verbal clause expresses continued defection more plainly than the abstract phrase.
- pob_phrase: They hold fast to deceit
