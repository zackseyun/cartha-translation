translation:
  language: en
  text: The wise men are disgraced. They lose courage and are captured.[a] Look! They have rejected Yahweh’s word, so what wisdom do they really have?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “caught” or “trapped.” The Hebrew can describe being seized or caught in a trap.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: are put to shame
  simplified_phrase: are disgraced
  preserved_meaning: The wise men are publicly exposed to shame.
  reasoning_layer_used: POB lexical decision for הֹבִישׁוּ
  rationale: “Disgraced” states the public shame in more direct modern English.
- pob_phrase: they are dismayed and captured
  simplified_phrase: They lose courage and are captured
  preserved_meaning: They are broken down in courage and overtaken by judgment.
  reasoning_layer_used: POB lexical decisions for חַתּוּ and וַיִּלָּכֵדוּ
  rationale: “Lose courage” makes the sense of “dismayed” immediately clear while retaining capture as a distinct image.
- pob_phrase: so what wisdom do they have?
  simplified_phrase: so what wisdom do they really have?
  preserved_meaning: Rejecting Yahweh’s word proves that their supposed wisdom is not true wisdom.
  reasoning_layer_used: POB lexical rationale for וְחָכְמַת מֶה לָהֶם
  rationale: “Really” clarifies the rhetorical force without turning the question into a flat assertion.
translation_notes:
