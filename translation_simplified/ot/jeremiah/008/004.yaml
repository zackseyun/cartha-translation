translation:
  language: en
  text: 'You must say to them, “This is what Yahweh says: When people fall, don’t they get back up? When someone turns away, don’t they return?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “When someone turns back, don’t they return?” The Hebrew repeats the same verb (“turn/return”) for rhetorical effect.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall say to them
  simplified_phrase: You must say to them
  preserved_meaning: Yahweh directly commissions Jeremiah to deliver this message.
  reasoning_layer_used: POB lexical decision for וְאָמַרְתָּ אֲלֵיהֶם
  rationale: “Must” expresses the command more naturally than modern “shall.”
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The prophetic messenger formula and Yahweh’s personal name remain intact.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה אָמַר יְהוָה
  rationale: The common formula is immediately clear to modern readers.
- pob_phrase: Do people fall and not rise again?
  simplified_phrase: When people fall, don’t they get back up?
  preserved_meaning: The question appeals to the ordinary expectation that fallen people rise.
  reasoning_layer_used: POB lexical decisions for הֲיִפְּלוּ וְלֹא יָקוּמוּ
  rationale: The negative question and “get back up” make the rhetorical force clear.
