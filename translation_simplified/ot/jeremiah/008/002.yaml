translation:
  language: en
  text: They will spread the bones out before the sun, the moon, and the whole array of heavenly bodies. These are what the people loved and served, followed, sought, and bowed down to. The bones will not be gathered up or buried. They will become dung on the surface of the ground.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the host of the heavens
  simplified_phrase: the whole array of heavenly bodies
  preserved_meaning: The phrase still refers collectively to the celestial objects the people worshiped.
  reasoning_layer_used: POB lexical and theological decisions on צְבָא הַשָּׁמַיִם
  rationale: “Array of heavenly bodies” is clearer than “host of the heavens” without reducing the phrase to one kind of object.
- pob_phrase: which they loved and which they served and after which they walked and which they sought and to which they bowed down
  simplified_phrase: These are what the people loved and served, followed, sought, and bowed down to
  preserved_meaning: All five distinct forms of devotion remain in the prophetic indictment.
  reasoning_layer_used: POB theological decision to preserve the repeated idol-devotion verbs
  rationale: A new sentence and natural verb order make the list easier to follow while retaining every action.
- pob_phrase: They will not be gathered, and they will not be buried
  simplified_phrase: The bones will not be gathered up or buried
  preserved_meaning: The remains will be denied normal funerary treatment.
  reasoning_layer_used: Immediate context and POB lexical decisions on the burial verbs
  rationale: Naming the bones removes an unclear pronoun, and “gathered up” states the physical action plainly.
interpretive_expansions:
- pob_phrase: them / they
  rendering: the bones
  claim: The objects spread out and left unburied are the bones named in the preceding context.
  evidence:
  - Jeremiah 8:1 identifies the remains as bones brought out of the graves.
  - The POB lexical rationale says the verb refers to exposing bones or corpses.
  confidence: high
  alternatives_preserved:
  - remains
  - corpses
translation_notes:
  risk_flags:
  - risk: “Array” softens the military nuance possible in “host.”
    mitigation: It preserves the image of the heavenly bodies as a collective ordered multitude.
  - risk: Repeating “the bones” makes the prior-verse referent explicit.
    mitigation: The expansion follows the immediate context and prevents pronoun confusion when the verse is read alone.
