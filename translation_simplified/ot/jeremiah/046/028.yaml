translation:
  language: en
  text: “But do not be afraid, my servant Jacob,” declares Yahweh, “because I am with you. I will completely destroy all the nations where I drove you, but I will not completely destroy you.[a] Still, I will discipline you justly, and I will not leave you unpunished.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “make a full end of”; the Hebrew repeats this phrase to contrast the nations’ destruction with Jacob’s preservation.
    reason: source_note
  - marker: b
    text: Or “I will certainly not acquit you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not fear
  simplified_phrase: do not be afraid
  preserved_meaning: Yahweh directly commands Jacob not to live in fear.
  reasoning_layer_used: lexical decision for אַל תִּירָא
  rationale: The common phrase “do not be afraid” keeps the covenantal reassurance.
- pob_phrase: make a full end of
  simplified_phrase: completely destroy
  preserved_meaning: The nations face total destruction, while Jacob will not be annihilated.
  reasoning_layer_used: lexical and theological decisions for אֶעֱשֶׂה כָלָה
  rationale: Repeating “completely destroy” makes the contrast clear while preserving its force.
- pob_phrase: discipline you with justice
  simplified_phrase: discipline you justly
  preserved_meaning: Jacob will receive corrective discipline that is measured and fair.
  reasoning_layer_used: lexical decision for וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  rationale: The adverb gives the same meaning in more natural English.
translation_notes:
  risk_flags:
  - risk: “Completely destroy” may sound more explicit than the Hebrew image “make a full end.”
    mitigation: The source note preserves the literal image and its repeated contrast.
  - risk: “Leave you unpunished” does not display the possible courtroom sense of acquittal.
    mitigation: Footnote b retains the documented forensic alternative.
