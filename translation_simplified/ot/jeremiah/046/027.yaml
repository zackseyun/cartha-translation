translation:
  language: en
  text: But you, my servant Jacob, do not be afraid. Israel, do not lose heart. Look, I am saving you from far away, and I am saving your descendants from the land where they are held captive.[a] Jacob will return and live in peace and safety, with no one to make him afraid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated, “I will save you and your descendants”; the Hebrew presents both as one imminent or certain saving action.
    reason: lexical_alternative
  - marker: b
    text: “Jacob” and “Israel” here represent God’s covenant people.
    reason: cultural_note
simplification_decisions:
- pob_phrase: But as for you, do not fear, my servant Jacob, and do not be dismayed, Israel
  simplified_phrase: But you, my servant Jacob, do not be afraid. Israel, do not lose heart.
  preserved_meaning: The contrast, direct commands, covenant title, and parallel names remain distinct.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences make the reassurance easier to follow without weakening its force.
- pob_phrase: your offspring from the land of their captivity
  simplified_phrase: your descendants from the land where they are held captive
  preserved_meaning: The same divine saving action includes the people’s descendants in captivity.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: Concrete wording clarifies captivity while repeating the saving verb preserves the shared aspect.
- pob_phrase: be quiet and at ease
  simplified_phrase: live in peace and safety
  preserved_meaning: Jacob will enjoy settled rest and security after turmoil.
  reasoning_layer_used: POB lexical decisions
  rationale: This wording conveys calm and freedom from threat rather than mere silence.
