  rationale: “Disgrace” makes the public humiliation clearer.
- pob_phrase: for warrior has stumbled against warrior
  simplified_phrase: This is because one warrior has stumbled against another
  preserved_meaning: The warriors’ collision during the rout explains the preceding disgrace and cry.
