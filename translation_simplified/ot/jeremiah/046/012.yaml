translation:
  language: en
  text: The nations have heard of your disgrace, and your cry has filled the earth.[a] This is because one warrior has stumbled against another, and both have fallen together.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has filled the land.” The Hebrew word can mean either “earth” or “land”; “earth” fits the mention of the nations.
    reason: lexical_alternative
