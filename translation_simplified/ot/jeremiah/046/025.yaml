translation:
  language: en
  text: 'Yahweh, who commands all forces, the God of Israel, declares: “I am about to punish the god Amon of No.[a] I will also punish Pharaoh and Egypt, along with her gods and kings. I will punish Pharaoh and everyone who trusts in him.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No is the Hebrew name for the Egyptian city often identified as Thebes; the phrase may also be translated “Amon of Thebes.”
    reason: cultural_note
  - marker: b
    text: Or “everyone who trusts in Egypt.” The Hebrew pronoun most naturally refers to Pharaoh, but Egypt is also possible.
    reason: alternative_reading
