translation:
  language: en
  text: Go up to Gilead and get balm,[a] virgin daughter of Egypt. But no matter how many remedies you use,[b] they will do no good. There is no healing for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gilead was famous for medicinal balm. The command is ironic because even this renowned remedy cannot heal Egypt.
    reason: cultural_note
  - marker: b
    text: The Hebrew verb form is textually and grammatically difficult, but in context it refers to Egypt using many remedies without success.
    reason: textual_variant
