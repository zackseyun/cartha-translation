translation:
  language: en
  text: That day belongs to the Lord GOD of Armies. It is a day of vengeance, when he takes vengeance on his enemies. The sword will devour, be satisfied, and drink its fill of their blood. For the Lord GOD of Armies has a sacrifice[a] in the northern land, beside the Euphrates River.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “there is a sacrifice for the Lord GOD of Armies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: That day belongs to the Lord GOD of Armies, a day of vengeance, to avenge himself on his foes.
  simplified_phrase: That day belongs to the Lord GOD of Armies. It is a day of vengeance, when he takes vengeance on his enemies.
  preserved_meaning: The day is the Lord’s appointed time to take vengeance on his opponents.
  reasoning_layer_used: Lexical decisions for לַאדֹנָי, נְקָמָה, and צָרָיו.
  rationale: Two sentences clarify the day’s purpose, and “enemies” is more familiar than “foes.”
- pob_phrase: The sword will devour and be satisfied and drink its fill of their blood
  simplified_phrase: The sword will devour, be satisfied, and drink its fill of their blood.
  preserved_meaning: The personified sword devours, becomes satisfied, and drinks blood to the full.
  reasoning_layer_used: Lexical decisions for אָכְלָה, שָׂבְעָה, and רָוְתָה.
  rationale: A clear list preserves the three coordinated images without adding a sequence.
- pob_phrase: in the land of the north, by the Euphrates River
  simplified_phrase: in the northern land, beside the Euphrates River
  preserved_meaning: The sacrifice is located in the northern region near the Euphrates.
  reasoning_layer_used: Geographic and prepositional lexical decisions.
  rationale: “Northern land” and “beside” are direct, natural modern English.
translation_notes:
  risk_flags:
  - risk: The sacrifice metaphor may sound like an ordinary worship offering.
    mitigation: The sword and blood imagery signals that it depicts divinely judged slaughter.
  - risk: The personified sword could be mistaken for a literal agent.
    mitigation: Its devouring and drinking imagery clearly presents the violence of battle figuratively.
