  language: en
  text: “They have cut down Egypt’s forest,” declares Yahweh, “even though no one could search through all of it.[a] Her attackers outnumber locusts; they cannot be counted.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because no one could search through all of it.” The Hebrew can mean either “even though” or “because”; the main text uses “even though” because it fits the context better.
    reason: lexical_alternative
