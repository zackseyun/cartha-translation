translation:
  language: en
  text: He has caused many to stumble. They fall against one another and say, “Come, let us return to our people and to our homeland, away from the oppressor’s sword.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sword of the dove.” The Hebrew can be read literally this way, but the context points to an oppressor or violent attacker.
    reason: alternative_reading
