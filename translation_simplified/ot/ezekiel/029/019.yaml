translation:
  language: en
  text: 'Therefore, this is what the Lord Yahweh says: “Look, I am giving the land of Egypt to King Nebuchadnezzar of Babylon. He will carry away its wealth,[a] take its plunder, and seize its loot. This will be pay for his army.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “multitude” or “abundance”; here it likely refers to Egypt’s wealth and resources.
    reason: lexical_alternative
