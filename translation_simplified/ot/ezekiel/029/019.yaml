  preserved_meaning: God solemnly calls for attention as he introduces his authoritative announcement.
  reasoning_layer_used: lexical decisions, theological rationale, and grounding review
  rationale: The natural formula and “Look” preserve both the prophetic introduction and the separate announcement marker.
- pob_phrase: Nebuchadnezzar king of Babylon
