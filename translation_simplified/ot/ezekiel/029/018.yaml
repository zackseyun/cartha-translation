  simplified_phrase: King Nebuchadnezzar of Babylon made his army work very hard against Tyre
  preserved_meaning: Nebuchadnezzar caused his military forces to perform severe labor in the campaign against Tyre.
  reasoning_layer_used: Lexical decisions for הֶעֱבִיד, חֵילוֹ, עֲבֹדָה גְדֹלָה, and אֶל צֹר
  rationale: Common word order and “work very hard” make the causative military action clear.
- pob_phrase: every head was made bald and every shoulder was rubbed bare
  simplified_phrase: Their heads were worn bald, and their shoulders were rubbed bare
  preserved_meaning: The army’s severe labor left the soldiers physically abraded while retaining both concrete images.
  reasoning_layer_used: Lexical decisions for כָּל רֹאשׁ מֻקְרָח and כָּל כָּתֵף מְרוּטָה
  rationale: The pronoun identifies the soldiers while preserving the bald-head and bare-shoulder imagery.
- pob_phrase: there was no pay for him or for his army from Tyre for the labor that he had performed against it
  simplified_phrase: neither the king nor his army received any pay from Tyre for the work he had done against it
  preserved_meaning: Tyre gave no compensation to Nebuchadnezzar or his army for the work singularly attributed to him.
  reasoning_layer_used: Lexical decisions for שָׂכָר, מִצֹּר, and the concluding labor clause
  rationale: The active wording clarifies who went unpaid while retaining the concluding singular reference.
