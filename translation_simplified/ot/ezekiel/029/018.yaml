translation:
  language: en
  text: Son of man,[a] King Nebuchadnezzar of Babylon made his army work very hard against Tyre. Their heads were worn bald, and their shoulders were rubbed bare.[b] Yet neither the king nor his army received any pay from Tyre for the work he had done against it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Mortal”; “Son of man” is the common way God addresses Ezekiel.
    reason: lexical_alternative
  - marker: b
    text: This picture likely reflects the physical strain of siege work.
    reason: cultural_note
