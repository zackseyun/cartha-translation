translation:
  language: en
  text: I will put hooks in your jaws[a] and make the fish in your Nile waterways[b] cling to your scales. I will bring you up out of those waterways, and all their fish will cling to your scales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in your cheeks.” The Hebrew word can mean “jaw” or “cheek”; “jaws” fits the image of a captured river creature.
    reason: lexical_alternative
  - marker: b
    text: Or “rivers” or “canals.” In passages about Egypt, the Hebrew term refers to the Nile and its waterways.
    reason: lexical_alternative
