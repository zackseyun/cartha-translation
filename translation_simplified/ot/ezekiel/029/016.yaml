translation:
  language: en
  text: Egypt will no longer be something the house of Israel trusts for safety. Instead, whenever they turn to Egypt, it will serve as a reminder of their sin. Then they will know that I am the Lord Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a source of confidence
  simplified_phrase: something the house of Israel trusts for safety
  preserved_meaning: Egypt had been an object of Israel’s misplaced reliance for security.
  reasoning_layer_used: Lexical decision for לְמִבְטָח and theological decision on reliance upon Egypt
  rationale: This wording expresses the object-of-trust sense in familiar English.
- pob_phrase: bringing iniquity to remembrance
  simplified_phrase: it will serve as a reminder of their sin
  preserved_meaning: Turning again to Egypt recalls and exposes Israel’s culpable wrongdoing without specifying who remembers it.
  reasoning_layer_used: Lexical decisions for מַזְכִּיר עָוֺן and עָוֺן, with the grounding review
  rationale: The noun phrase clarifies the reminder idiom while preserving its unspecified recipient.
- pob_phrase: when they turn after them
  simplified_phrase: whenever they turn to Egypt
  preserved_meaning: Israel again seeks Egypt as an ally and source of support.
  reasoning_layer_used: Lexical decision for בִּפְנוֹתָם אַחֲרֵיהֶם and immediate context
  rationale: Naming Egypt removes an unclear pronoun and states the dependence idiom naturally.
