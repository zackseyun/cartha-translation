translation:
  language: en
  text: When they grabbed you with their hands, you were crushed and split all their shoulders open. When they leaned on you[a], you broke and made all their hips buckle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “relied on you.” The wording keeps the picture of people leaning on a reed for support.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also be translated “loins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When they took hold of you with their hand
  simplified_phrase: When they grabbed you with their hands
  preserved_meaning: People grasp Egypt as though it were a reed they could use for support.
  reasoning_layer_used: Lexical decision for בְּתָפְשָׂם and theological decision to preserve the reed image
  rationale: “Grabbed” is immediate modern English, while “with their hands” keeps the physical image.
- pob_phrase: you split open every shoulder for them
  simplified_phrase: split all their shoulders open
  preserved_meaning: The crushed reed injures every shoulder among those holding it.
  reasoning_layer_used: Lexical decisions for וּבָקַעְתָּ and כָּל כָּתֵף
  rationale: The clause uses natural English order while retaining the violent image and universal scope.
- pob_phrase: you made all their hips stand unsteadily
  simplified_phrase: made all their hips buckle
  preserved_meaning: When their support breaks, all their bodies become unstable at the hips.
  reasoning_layer_used: Lexical rationale for וְהַעֲמַדְתָּ and theological decision for modern “hips”
  rationale: “Hips buckle” clearly expresses bodily instability while retaining the hip image and universal scope.
