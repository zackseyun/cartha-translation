- pob_phrase: Behold, I am bringing
  simplified_phrase: I am now bringing
  preserved_meaning: God solemnly announces judgment as imminent.
  reasoning_layer_used: Lexical decisions for הִנְנִי and מֵבִיא
  rationale: “Now” conveys the vivid immediacy in ordinary English.
- pob_phrase: cut off from you man and beast
  simplified_phrase: wipe out people and animals from Egypt
  preserved_meaning: The judgment removes both human and animal life from Egypt.
  reasoning_layer_used: Lexical decisions for וְהִכְרַתִּי, מִמֵּךְ, אָדָם, and וּבְהֵמָה
