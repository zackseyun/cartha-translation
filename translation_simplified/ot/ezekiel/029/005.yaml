translation:
  language: en
  text: I will throw you into the wilderness, along with all the fish from your streams.[a] You will fall in the open field. You will not be picked up or gathered for burial. I have handed you over as food[b] for the wild animals of the land and the birds of the sky.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this Egyptian setting, “streams” may refer to the Nile and its channels.
    reason: cultural_note
  - marker: b
    text: The Hebrew describes this future judgment as already accomplished to emphasize that it is certain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will cast you into the wilderness
  simplified_phrase: I will throw you into the wilderness
  preserved_meaning: God forcibly disposes of the addressed figure in a desolate place.
  reasoning_layer_used: Lexical decision for וּנְטַשְׁתִּיךָ and directional הַמִּדְבָּרָה
  rationale: “Throw” makes the force of “cast” immediately clear while preserving movement into the wilderness.
- pob_phrase: you will not be gathered or collected
  simplified_phrase: You will not be picked up or gathered for burial
  preserved_meaning: No one will recover the fallen body, even for burial.
  reasoning_layer_used: Lexical decisions for לֹא תֵאָסֵף and וְלֹא תִקָּבֵץ
  rationale: The wording keeps both verbs while making their likely burial setting understandable.
- pob_phrase: the beasts of the earth and to the birds of the heavens
  simplified_phrase: the wild animals of the land and the birds of the sky
  preserved_meaning: The exposed body will become carrion for land animals and birds.
  reasoning_layer_used: Lexical decisions for לְחַיַּת הָאָרֶץ and וּלְעוֹף הַשָּׁמַיִם
  rationale: Common terms replace elevated biblical phrasing without weakening the carrion image.
interpretive_expansions:
- pob_phrase: you will not be gathered or collected
  rendering: You will not be picked up or gathered for burial
  claim: The two near-synonymous verbs indicate that the body will receive no recovery or burial.
  evidence:
  - The POB lexical rationale says the verbs emphasize total lack of recovery or burial.
  - The open-field setting presents the fallen body as exposed.
  - The following clause gives the body to animals and birds as food.
  confidence: high
  alternatives_preserved:
  - The verbs may refer more generally to removal or recovery.
