translation:
  language: en
  text: 'Speak this message:


    “This is what the Lord GOD says:


    ‘I am against you, Pharaoh king of Egypt! You are the great sea monster[a] lying among your Nile channels. You say, “The Nile is mine, and I made myself.”[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great dragon”; the image may also suggest a crocodile-like monster of the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or “The Nile is mine, and I made it for myself.” The Hebrew allows either boast, but the main text presents Pharaoh as claiming to have made himself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Speak and say
  simplified_phrase: Speak this message
  preserved_meaning: God commands the prophet to deliver the words that follow.
  reasoning_layer_used: source syntax and POB translation
  rationale: The repeated speech verbs become one natural English command.
- pob_phrase: Behold, I am against you
  simplified_phrase: I am against you!
  preserved_meaning: God emphatically declares his hostility toward Pharaoh.
  reasoning_layer_used: POB lexical decision for הִנְנִי עָלֶיךָ
  rationale: Direct address and punctuation preserve the force without archaic wording.
- pob_phrase: lying in the midst of his Nile channels
  simplified_phrase: lying among your Nile channels
  preserved_meaning: Pharaoh is pictured as settled within the Nile waterways he arrogantly treats as his own.
  reasoning_layer_used: source possessive suffix, immediate context, and POB lexical decisions
  rationale: Direct address makes the possessive natural while retaining the Nile-monster image.
