translation:
  language: en
  text: You must divide this land as an inheritance among yourselves and the foreigners who have settled among you and have children among you. They are to have the same standing as native-born Israelites. They are to receive inherited land alongside you among the tribes of Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: allot it as an inheritance for yourselves and for the sojourners who sojourn among you
  simplified_phrase: divide this land as an inheritance among yourselves and the foreigners who have settled among you
  preserved_meaning: Israel must include established non-native residents when distributing the inherited land.
  reasoning_layer_used: Lexical decisions for נפל with נַחֲלָה and גֵּר, supported by the land-distribution context.
  rationale: This removes repetitive legal wording while preserving an actual share in the land.
- pob_phrase: they shall be to you like a native among the sons of Israel
  simplified_phrase: They are to have the same standing as native-born Israelites
  preserved_meaning: The settled foreigners receive status comparable to native Israelites for the allotment.
  reasoning_layer_used: Lexical decision for כְּאֶזְרָח and the theological decision on the status of the גֵּר.
  rationale: Standing expresses recognized community and legal status rather than merely interpersonal treatment.
- pob_phrase: With you they shall receive an inheritance among the tribes of Israel
  simplified_phrase: They are to receive inherited land alongside you among the tribes of Israel
  preserved_meaning: The resident foreigners receive land shares together with Israel within its tribal structure.
  reasoning_layer_used: Lexical decisions for אִתְּכֶם, יִפְּלוּ בְנַחֲלָה, and בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל.
  rationale: Inherited land names the concrete inheritance, while alongside you preserves shared participation.
interpretive_expansions:
- pob_phrase: it as an inheritance / receive an inheritance
  rendering: this land as an inheritance / receive inherited land
  claim: The inheritance is a share of the land being distributed.
  evidence:
  - The immediate context concerns Ezekiel's distribution of the land.
  - The lexical rationale identifies נַחֲלָה here as inherited land allotment.
  confidence: high
  alternatives_preserved:
  - inheritance
  - allotted possession
translation_notes:
  risk_flags:
  - risk: Foreigners could suggest temporary visitors rather than established non-native residents.
    mitigation: The phrase who have settled among you and have children among you marks enduring residence and family ties.
