translation:
  language: en
  text: Then he said to me, “These waters flow out toward the eastern district and down into the Arabah.[a] They enter the sea,[b] and when they are brought into it, the sea’s waters are healed.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Arabah is the rift valley that includes the Jordan Valley and extends southward.
    reason: cultural_note
  - marker: b
    text: The difficult Hebrew wording is commonly understood to refer to the Dead Sea, the salt sea east of Judah.
    reason: alternative_reading
  - marker: c
    text: The Hebrew literally says “the waters are healed”; that is, they become fresh and wholesome.
    reason: lexical_alternative
