translation:
  language: en
  text: Then he brought me back to the entrance of the house.[a] There I saw water flowing out from beneath the threshold toward the east, because the front of the house faced east. The water flowed down from beneath the south side of the house, on its right side, south of the altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple building in Ezekiel’s vision.
    reason: lexical_alternative
  - marker: b
    text: Hebrew describes this as the “shoulder” of the house, an expression meaning the side of a structure.
    reason: lexical_alternative
