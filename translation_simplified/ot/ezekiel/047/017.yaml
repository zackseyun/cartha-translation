  preserved_meaning: The boundary reaches from the sea to Hazar-enon.
  reasoning_layer_used: The lexical decision treats the Hebrew form as a legal and topographical description.
  rationale: “Will extend” expresses the geographic relationship more naturally than “shall be.”
- pob_phrase: on the north, northward
  simplified_phrase: to the north
  preserved_meaning: The description is oriented toward the northern boundary.
  reasoning_layer_used: The lexical decision allows the concise directional wording “to the north.”
  rationale: The compressed phrase keeps the direction without the unnatural repetition.
- pob_phrase: This shall be the north side
  simplified_phrase: This will be the northern side
  preserved_meaning: The sentence summarizes the preceding description as the territory’s northern edge.
  reasoning_layer_used: The lexical rationale identifies this clause as a resumptive summary.
  rationale: “Northern side” is ordinary modern English for “north side.”
