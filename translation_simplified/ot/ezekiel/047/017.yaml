translation:
  language: en
  text: The border will extend from the sea[a] to Hazar-enon[b], at the border of Damascus, with the border of Hamath to the north. This will be the northern side.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, “the sea” is the Mediterranean Sea, though the Hebrew says only “the sea.”
    reason: cross_reference
  - marker: b
    text: Hazar-enon is also traditionally rendered “Hazar-enan.”
    reason: alternative_reading
simplification_decisions:
