translation:
  language: en
  text: The man headed east, carrying a measuring line. He measured off about 1,500 feet (460 meters)[a]. Then he led me through ankle-deep water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “1,000 cubits.” The exact length of a cubit varied, so the modern measurement is approximate.
    reason: cultural_note
