  text: On both banks of the river, all kinds of fruit trees will grow. Their leaves will not wither, and they will never stop producing fruit. Every month they will bear fresh fruit,[a] because the river’s waters flow from the sanctuary. Their fruit will be for food, and their leaves for healing.
