translation:
  language: en
  text: As they wail,[a] they will make a funeral lament for you. They will mourn over you and say, “Who is like Tyre, silenced in the middle of the sea?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult. Some readings relate it to “their sons,” but the mourning context supports “as they wail.”
    reason: textual_variant
  - marker: b
    text: Or “brought to silence in the middle of the sea.” The Hebrew can mean stilled, silenced, or laid waste.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: raise a lamentation over you in their wailing
  simplified_phrase: As they wail, they will make a funeral lament for you
  preserved_meaning: The mourners utter a formal lament for Tyre while wailing.
  reasoning_layer_used: POB lexical decisions for וְנָשְׂאוּ, בְּנִיהֶם, and קִינָה
  rationale: “Make a funeral lament” explains the mourning act without implying melody.
- pob_phrase: they will lament over you
  simplified_phrase: They will mourn over you
  preserved_meaning: They openly grieve over Tyre’s fate.
  reasoning_layer_used: POB lexical decisions for וְקוֹנְנוּ and עָלַיִךְ
  rationale: “Mourn” avoids repetition while preserving the act of lamenting over Tyre.
- pob_phrase: in the midst of the sea
  simplified_phrase: in the middle of the sea
  preserved_meaning: Tyre is pictured as silenced within its maritime setting.
  reasoning_layer_used: POB lexical decision for בְּתוֹךְ הַיָּם
  rationale: “Middle” keeps the spatial image in more familiar English.
translation_notes:
