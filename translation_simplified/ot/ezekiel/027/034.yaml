simplification_decisions:
- pob_phrase: At the time you were broken by the seas
  simplified_phrase: When the seas broke you apart
  preserved_meaning: The seas caused Tyre’s destruction at that time.
  reasoning_layer_used: Lexical decisions for עֵת, נִשְׁבֶּרֶת, and מִיַּמִּים
  rationale: The active wording is easier to follow while preserving the seas as the destructive force.
- pob_phrase: in the depths of the waters
  simplified_phrase: in the deep waters
  preserved_meaning: Tyre is pictured being destroyed far down in the waters.
  reasoning_layer_used: Lexical decision for בְּמַעֲמַקֵּי מָיִם
  rationale: The concrete depth image remains in a more natural English phrase.
- pob_phrase: all your assembly in your midst
  simplified_phrase: all those gathered within you
  preserved_meaning: The whole assembled group inside the city-ship fell.
  reasoning_layer_used: Lexical decisions for קְהָלֵךְ and בְּתוֹכֵךְ, with POB footnote b
  rationale: This replaces the opaque collective noun with clear wording without narrowing who belonged to the group.
