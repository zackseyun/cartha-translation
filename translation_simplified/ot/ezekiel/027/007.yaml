  text: Your sail was made of fine embroidered linen from Egypt and served as your banner.[a] Blue and purple cloth from the coasts of Elishah[b] formed your covering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “served as your signal” or “standard.” The Hebrew describes something visible from far away.
    reason: lexical_alternative
  - marker: b
    text: Or “from the islands of Elishah.” The Hebrew can mean islands or coastlands.
    reason: lexical_alternative
