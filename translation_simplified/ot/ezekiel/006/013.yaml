translation:
  language: en
  text: Then you will know that I am Yahweh. Their people who were killed will lie among their idols[a] and all around their altars—on every high hill, on every mountaintop, under every green tree, and under every leafy terebinth. These are the places where they offered a pleasing aroma to all their idols.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “idols” is strongly contemptuous and can be rendered “dung-idols” or “filthy idols.”
    reason: lexical_alternative
