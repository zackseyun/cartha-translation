translation:
  language: en
  text: Then, among the nations where they were taken captive, your survivors will remember me. By then I will have broken[a] their hearts, which turned away from me like prostitutes, and their eyes, which chased after their idols like prostitutes.[b][c] They will loathe themselves because of the evil they did in all their detestable practices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I was broken by their unfaithful hearts.” Some understand the Hebrew as emphasizing the LORD’s grief.
    reason: alternative_reading
  - marker: b
    text: The prostitution image describes their unfaithfulness to the LORD and their worship of idols.
    reason: cultural_note
  - marker: c
    text: The Hebrew uses a contemptuous term for idols that may mean “filthy idols.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols
  simplified_phrase: By then I will have broken their hearts, which turned away from me like prostitutes, and their eyes, which chased after their idols like prostitutes
  preserved_meaning: God breaks both their inward loyalty and their idolatrous desire while the prostitution image remains vivid.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The active reading remains primary, while clear similes replace the difficult wording “whored after.”
- pob_phrase: they will loathe themselves for the evils they committed
  simplified_phrase: They will loathe themselves because of the evil they did
  preserved_meaning: The survivors will feel revulsion toward themselves because of their wrongdoing.
  reasoning_layer_used: POB lexical decisions
  rationale: The causal relationship is stated in ordinary English without weakening self-loathing.
- pob_phrase: in all their abominations
  simplified_phrase: in all their detestable practices
  preserved_meaning: Their evil deeds occurred throughout practices that were morally and covenantally abhorrent.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: “Detestable practices” clarifies “abominations” while retaining its relationship to the evil they did.
translation_notes:
  risk_flags:
  - risk: The prostitution imagery could be mistaken for a reference only to sexual misconduct.
    mitigation: Footnote b identifies it as a metaphor for covenant unfaithfulness and idolatry.
  - risk: The Hebrew verb may describe the LORD as brokenhearted rather than acting to break their hearts.
    mitigation: The active reading controls the text, while footnote a preserves the significant alternative.
