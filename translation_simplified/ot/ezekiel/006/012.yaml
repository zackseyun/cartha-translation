translation:
  language: en
  text: Anyone far away will die from plague. Anyone nearby will fall by the sword. Anyone still alive but trapped under siege[a] will die from famine. I will fully carry out my wrath against them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “the one left and shut up”; it describes someone hemmed in during a siege.
    reason: lexical_alternative
  - marker: b
    text: Or “I will exhaust my wrath on them”; the Hebrew emphasizes bringing his wrath to its full end in judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one far away will die by pestilence
  simplified_phrase: Anyone far away will die from plague
  preserved_meaning: Distance will not protect a person from deadly disease in this judgment.
  reasoning_layer_used: Lexical decisions for הָרָחוֹק and בַּדֶּבֶר
  rationale: “Anyone” keeps the distributive sense, while “plague” is clearer than “pestilence.”
- pob_phrase: the one left and besieged
  simplified_phrase: Anyone still alive but trapped under siege
  preserved_meaning: A survivor hemmed in by siege remains exposed to famine.
  reasoning_layer_used: Lexical decisions for הַנִּשְׁאָר and הַנָּצוּר
  rationale: The wording explains the siege condition without losing the sense of someone who remains.
- pob_phrase: I will spend my wrath on them
  simplified_phrase: I will fully carry out my wrath against them
  preserved_meaning: God’s wrath will be executed completely in judgment.
  reasoning_layer_used: Lexical and theological decisions for וְכִלֵּיתִי חֲמָתִי בָּם
  rationale: “Fully carry out” makes the completion of judgment clearer than the idiom “spend.”
interpretive_expansions:
- pob_phrase: the one left and besieged
  rendering: Anyone still alive but trapped under siege
  claim: The person left is a survivor confined by siege conditions.
  evidence:
  - The participle הַנִּשְׁאָר denotes someone remaining or left over.
  - The POB rationale reads הַנָּצוּר as hemmed in under siege.
  - The following death by famine fits siege conditions.
  confidence: high
  alternatives_preserved:
  - the one left and shut up
  - the one remaining and besieged
- pob_phrase: I will spend my wrath on them
  rendering: I will fully carry out my wrath against them
  claim: God’s wrath reaches its full execution in judgment.
  evidence:
  - The Piel verb וְכִלֵּיתִי can mean finish, exhaust, or bring to an end.
  - The POB theological decision explicitly preserves fully carried-out judgment.
  confidence: high
  alternatives_preserved:
  - I will exhaust my wrath on them
  - I will spend my wrath on them
translation_notes:
  risk_flags:
  - risk: “Still alive” states the survivor sense of “the one left” more directly.
    mitigation: The Hebrew participle and POB lexical rationale support the meaning, while footnote a preserves the closer wording.
  - risk: “Fully carry out” is less concrete than the image of spending or exhausting wrath.
    mitigation: The wording retains the wrath and explicitly preserves its complete execution.
