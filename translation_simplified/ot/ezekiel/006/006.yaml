translation:
  language: en
  text: Everywhere you live, the cities will be ruined, and your high places of worship will be left desolate. This will happen so that your altars will be ruined and left desolate, your idols[a] will be broken and brought to an end, your incense altars[b] will be cut down, and your works[c] will be wiped out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a contemptuous term for idols, possibly suggesting something filthy or dung-like.
    reason: lexical_alternative
  - marker: b
    text: Or “sun pillars” or “sun-images”; the Hebrew refers to a debated kind of worship object, possibly connected with sun worship.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word can mean deeds or things people have made; here it likely includes objects made for idol worship.
    reason: lexical_alternative
