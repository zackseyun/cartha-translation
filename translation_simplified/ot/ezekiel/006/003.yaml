translation:
  language: en
  text: 'Say, “Mountains of Israel, hear the word of the Lord GOD. This is what the Lord GOD says to the mountains and hills, the ravines[a] and valleys: Look! I myself am bringing a sword against you, and I will destroy your worship sites on the heights.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “channels” or “wadis.”
    reason: lexical_alternative
  - marker: b
    text: These sites are traditionally called “high places” and were often used for idolatrous worship.
    reason: cultural_note
