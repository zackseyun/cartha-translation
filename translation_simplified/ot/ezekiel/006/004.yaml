translation:
  language: en
  text: Your altars will be laid waste, and your incense altars[b] will be smashed. I will throw down the bodies of your slain in front of your idols.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a strongly contemptuous word for idols, which could be rendered “filthy idols” or “dung-idols.”
    reason: lexical_alternative
  - marker: b
    text: Or “sun-pillars”; these were objects used in forbidden worship.
    reason: lexical_alternative
