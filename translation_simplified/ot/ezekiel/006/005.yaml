  preserved_meaning: God will put the bodies of the dead in a specific place.
  reasoning_layer_used: Lexical decisions for וְנָתַתִּי and פִּגְרֵי
  rationale: Common words preserve the concrete action and grim force.
- pob_phrase: before their idols
