translation:
  language: en
  text: Then he said to the man dressed in linen, “Go into the wheelwork[a] beneath the cherub. Fill your hands with fiery coals from among the cherubim, and scatter them over the city.” I watched as the man went in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “between the wheels.” The Hebrew may refer to the whole wheeled structure rather than one wheel.
    reason: lexical_alternative
