translation:
  language: en
  text: Then the cherub reached out his hand from among the cherubim to the fire in their midst. He lifted it and placed it in the palms of the one dressed in linen.[a] The linen-clothed figure took it and went out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Earlier in this vision, this figure is called “the man clothed in linen” (Ezekiel 10:2, 6).
    reason: cross_reference
