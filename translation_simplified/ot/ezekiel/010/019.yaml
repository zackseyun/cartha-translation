translation:
  language: en
  text: As I watched, the cherubim raised their wings and rose from the ground. As they went out, the wheels were beside them. Then it[a] came to a stop at the entrance to the eastern gate of Yahweh’s house. The glory of the God of Israel was high above them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “it stood.” This may refer to the whole throne-chariot structure rather than only to the cherubim.
    reason: alternative_reading
