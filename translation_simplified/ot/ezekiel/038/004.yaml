  preserved_meaning: God actively brings out Gog together with all his forces.
  reasoning_layer_used: Theological decision on divine agency and lexical decision for וְהוֹצֵאתִי אוֹתְךָ.
  rationale: The recast sentence is easier to follow while keeping God's forceful agency.
- pob_phrase: a great assembly
  simplified_phrase: a vast assembled force
  preserved_meaning: The army is a large gathered military body.
  reasoning_layer_used: Lexical decision for קָהָל רָב and its military context.
  rationale: This wording makes the military sense of the assembly immediately clear.
- pob_phrase: with shield and buckler
