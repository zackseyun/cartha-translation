translation:
  language: en
  text: You will say, “I will go up against a land of unwalled villages[a]. I will come against people who live in peace and safety. They all live without walls and have no bars or gates[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “open country” or “rural settlements”; the places have no defensive walls.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew more directly says “doors,” but here they are part of the settlements’ defenses.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who are at rest, who dwell securely
  simplified_phrase: people who live in peace and safety
  preserved_meaning: The inhabitants are undisturbed and living securely.
  reasoning_layer_used: Lexical decisions for הַשֹּׁקְטִים and יֹשְׁבֵי לָבֶטַח
  rationale: Common nouns and verbs replace formal participial language while keeping peace and security distinct.
- pob_phrase: all of them dwelling without walls, and having no bars or gates
  simplified_phrase: They all live without walls and have no bars or gates.
  preserved_meaning: Every inhabitant lacks the defensive structures named in the Hebrew.
  reasoning_layer_used: Applied revision on clause structure and lexical decisions for wall, bar, and doors
  rationale: A separate sentence makes their vulnerability clear without weakening the concrete defensive image.
- pob_phrase: I will go up against ... I will come against
  simplified_phrase: I will go up against ... I will come against
  preserved_meaning: Gog declares hostile movement toward the land and its people.
  reasoning_layer_used: Lexical decisions for אֶעֱלֶה and אָבוֹא
  rationale: The directional wording and hostile force remain because both are supported by the source and context.
