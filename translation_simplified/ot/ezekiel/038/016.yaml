translation:
  language: en
  text: You will advance against my people Israel and cover the land like a cloud. In the latter days, I will bring you against my land. I will do this so that the nations may know me when I show myself holy through you before their eyes, Gog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “when I sanctify myself in you before their eyes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: come up against my people Israel like a cloud to cover the land
  simplified_phrase: advance against my people Israel and cover the land like a cloud
  preserved_meaning: Gog’s hostile movement will spread over Israel as a cloud covers the land.
  reasoning_layer_used: Lexical decisions for וְעָלִיתָ and כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  rationale: “Advance against” clarifies the military movement while retaining the cloud image.
- pob_phrase: it will happen that I will bring you against my land
  simplified_phrase: I will bring you against my land
  preserved_meaning: God will cause Gog to come against the land in the latter days.
  reasoning_layer_used: Lexical decision for תִּהְיֶה and theological decision on בְּאַחֲרִית הַיָּמִים
  rationale: Removing the empty event phrase makes the sentence direct without narrowing the prophetic timeframe.
- pob_phrase: so that the nations may know me
  simplified_phrase: I will do this so that the nations may know me
  preserved_meaning: God’s purpose is to reveal himself to the nations through what he does with Gog.
  reasoning_layer_used: Lexical decision for לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  rationale: The added subject and object make the purpose link easy to follow.
translation_notes:
  risk_flags:
  - risk: “Latter days” may remain unfamiliar to some readers.
    mitigation: It is retained because the POB audit requires its open prophetic and eschatological force.
  - risk: “Show myself holy through you” could sound as though Gog displays God’s moral character.
    mitigation: The literal alternative is footnoted, while the context preserves God’s public manifestation through his action against Gog.
