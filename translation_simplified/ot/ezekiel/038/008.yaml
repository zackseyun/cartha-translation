translation:
  language: en
  text: After many days, you will be called up for military action.[a] In the latter years,[b] you will come into a land recovered from the sword of war, whose people have been gathered from many peoples. You will come onto the mountains of Israel, which had long lain desolate. But it had been brought out from among the peoples,[c] and they will all live securely.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will be visited” or “you will be summoned”; here the Hebrew most likely means being called up for action.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “in the latter years”; some translations say “in the latter days.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew uses a feminine singular “it,” which may refer to the land or represent its people.
    reason: lexical_alternative
