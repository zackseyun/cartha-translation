  text: The fish in the sea, the birds in the sky, the wild animals, every creature that crawls on the ground, and every man[a] on the face of the earth will quake because of my presence. The mountains will be thrown down, the cliffs[b] will fall, and every wall will collapse to the ground.
  philosophy: optimal-equivalence
  footnotes:
