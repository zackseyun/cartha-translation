translation:
  language: en
  text: They will attack you with troops, chariots, wagons, and forces drawn from many peoples. Armed with large shields, small shields, and helmets, they will surround you. I will put your case before them, and they will judge you according to their own judgments.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: come against you
  simplified_phrase: attack you
  preserved_meaning: The forces come against her as enemies.
  reasoning_layer_used: source payload and immediate military context
  rationale: The direct verb clearly expresses the hostile action.
- pob_phrase: with an assembly of peoples
  simplified_phrase: with forces drawn from many peoples
  preserved_meaning: A gathered force from multiple peoples joins the attack.
  reasoning_layer_used: POB translation and immediate military context
  rationale: This explains the assembly without making it a single nation.
- pob_phrase: set shield and buckler and helmet against you on every side
  simplified_phrase: Armed with large shields, small shields, and helmets, they will surround you
  preserved_meaning: Equipped soldiers encircle her with both kinds of shields and helmets.
  reasoning_layer_used: source imagery and POB wording
  rationale: It replaces “buckler” while preserving the weapons and encirclement.
interpretive_expansions:
- pob_phrase: I will set judgment before them
  rendering: I will put your case before them
  claim: God places her judicial case before the attackers without explicitly defining this as delegated authority.
  evidence:
  - The POB depicts judgment as being set before them.
  - The following clause says they will judge her.
  confidence: moderate
  alternatives_preserved:
  - I will put judgment before them
  - I will place your judgment before them
translation_notes:
  risk_flags:
  - risk: “Your case” makes the judicial setting clearer but is less concrete than the POB image of setting judgment before them.
    mitigation: The verb “put” retains the placement image, and the next clause explicitly retains judging.
  - risk: “Their own judgments” remains unusual in English but preserves a broad range of legal decisions, procedures, or verdicts.
    mitigation: The wording avoids narrowing the phrase to subjective standards.
