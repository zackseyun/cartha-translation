translation:
  language: en
  text: 'For this is what the Lord GOD says: “Bring a crowd against them, and hand them over to terror[a] and plunder.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make them objects of horror.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For thus says
  simplified_phrase: For this is what ... says
  preserved_meaning: The words introduce a direct declaration from God.
  reasoning_layer_used: POB translation and target-style guidance
  rationale: The common English formula is clearer without changing the force of the announcement.
- pob_phrase: Bring up an assembly against them
  simplified_phrase: Bring a crowd against them
  preserved_meaning: God commands that a gathered hostile group be brought against the women.
  reasoning_layer_used: Lexical decisions for הַעֲלֵה and קָהָל
  rationale: “Crowd” makes the assembled group immediately understandable while “against” supplies the hostile context.
- pob_phrase: give them over to terror and plunder
  simplified_phrase: hand them over to terror and plunder
  preserved_meaning: They are delivered into dreadful devastation and plundering.
  reasoning_layer_used: Lexical decisions for וְנָתֹן, לְזַעֲוָה, and לָבַז
  rationale: “Hand them over” expresses transfer into judgment more naturally than “give them over.”
translation_notes:
  risk_flags:
  - risk: The Hebrew word rendered “terror” may instead portray them as objects of horror.
    mitigation: The footnote preserves this important lexical alternative.
  - risk: English “them” cannot show the Hebrew shift from masculine to feminine plural forms.
    mitigation: The pronoun remains because the women are already identified by the surrounding context.
