  simplified_phrase: They also sent for men from far away.
  preserved_meaning: The two women collectively summoned distant men.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Also” keeps the accusation moving forward while the plural “they” preserves the Hebrew shift.
- pob_phrase: and behold, they came
  simplified_phrase: and sure enough, they came
  preserved_meaning: The invited men did in fact arrive, with prophetic emphasis.
  reasoning_layer_used: POB lexical decision for וְהִנֵּה בָאוּ
  rationale: “Sure enough” conveys the vivid confirming force of “behold” in common English.
- pob_phrase: to the one who had washed herself, painted her eyes, and adorned herself with jewelry
  simplified_phrase: The woman they came to had bathed, painted her eyes, and put on her jewelry.
  preserved_meaning: The singular woman prepared herself through washing, cosmetics, and jewelry.
