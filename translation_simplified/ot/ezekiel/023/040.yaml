translation:
  language: en
  text: They also sent for men from far away. A messenger had been sent to them, and sure enough, they came. The woman they came to had bathed, painted her eyes,[a] and put on her jewelry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “lined her eyes with kohl,” a dark eye cosmetic.
    reason: lexical_alternative
