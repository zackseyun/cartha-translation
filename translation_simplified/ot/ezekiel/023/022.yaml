translation:
  language: en
  text: 'Because of this, Oholibah, this is what the Lord Yahweh says: “Look, I am stirring up your lovers against you—the ones you became estranged from.[a] I will bring them against you from every side.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the ones you loathed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, Oholibah, thus says the Lord GOD
  simplified_phrase: Because of this, Oholibah, this is what the Lord Yahweh says
  preserved_meaning: God announces judgment as a consequence of the preceding charges, using his covenant name.
  reasoning_layer_used: Lexical decision for לָכֵן and updated theological decision for יהוה
  rationale: Common wording preserves the causal link and follows the stated doctrine for Yahweh.
- pob_phrase: Behold, I am stirring up
  simplified_phrase: Look, I am stirring up
  preserved_meaning: God solemnly announces that he is rousing them to hostile action.
  reasoning_layer_used: Lexical decisions for הִנְנִי and מֵעִיר
  rationale: “Look” is clear modern English while retaining the announcement’s force and hostile image.
- pob_phrase: those from whom your soul has turned away
  simplified_phrase: the ones you became estranged from
  preserved_meaning: Oholibah is now separated from her former lovers without specifying deliberate rejection.
  reasoning_layer_used: Lexical decision and footnote for נָקְעָה נַפְשֵׁךְ
  rationale: This removes the opaque body-part idiom while preserving the source’s ambiguity about agency.
translation_notes:
  risk_flags:
  - risk: “Became estranged” may understate the possible sense of revulsion.
    mitigation: The footnote preserves “loathed” as the principal lexical alternative.
  - risk: Using “Yahweh” differs from the POB surface wording “GOD.”
    mitigation: The rendering follows the audit’s updated theological decision for the divine name.
