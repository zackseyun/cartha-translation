translation:
  language: en
  text: They exposed her nakedness. They took her sons and daughters, and they killed her with the sword. She became a notorious example among women, and they carried out judgments against her.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: uncovered her nakedness
  simplified_phrase: exposed her nakedness
  preserved_meaning: The concrete image of nakedness and humiliating exposure remains intact.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Exposed” is more immediate modern English without replacing the image with abstract shame.
- pob_phrase: she became a byword among women
  simplified_phrase: she became a notorious example among women
  preserved_meaning: Her disgrace became widely known and served as a negative example.
  reasoning_layer_used: lexical decision
  rationale: This explains the unfamiliar word “byword” while preserving its negative exemplary sense.
- pob_phrase: they executed judgments on her
  simplified_phrase: they carried out judgments against her
  preserved_meaning: Their actions are presented as judicial judgments, not merely violence.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Carried out” is clearer today while retaining the important judicial noun “judgments.”
interpretive_expansions:
- pob_phrase: she became a byword among women
  rendering: she became a notorious example among women
  claim: Her reputation was disgraceful and exemplary in a negative sense.
  evidence:
