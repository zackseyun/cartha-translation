translation:
  language: en
  text: I will turn my jealousy against you, and they will treat you with fury. They will remove your nose and ears.[a] Those who survive will fall by the sword. They will take your sons and daughters, and those who remain will be consumed by fire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says “remove,” though the context may mean “cut off.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “your latter end” or “what remains of you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will set my jealousy against you
  simplified_phrase: I will turn my jealousy against you
  preserved_meaning: God directs his covenantal jealousy against the unfaithful people.
  reasoning_layer_used: Lexical and theological decisions on קִנְאָה
  rationale: “Turn” makes the directed hostility clearer while retaining the relational force of “jealousy.”
- pob_phrase: they will deal with you in wrath
  simplified_phrase: they will treat you with fury
  preserved_meaning: The hostile agents will act against them in intense anger.
  reasoning_layer_used: Lexical decision on וְעָשׂוּ אֹתָךְ בְּחֵמָה
  rationale: This uses ordinary sentence structure while preserving the severity of the judgment.
- pob_phrase: your survivors ... your remnant
  simplified_phrase: Those who survive ... those who remain
  preserved_meaning: The people left after the first devastation will face further destruction.
  reasoning_layer_used: Lexical decision on וְאַחֲרִיתֵךְ
  rationale: The concrete wording explains “remnant” without erasing the Hebrew term’s ambiguity.
translation_notes:
  risk_flags:
