translation:
  language: en
  text: My servant David[a] will be king over them, and they will all have one shepherd.[b] They will live by my judgments. They will keep my statutes and carry them out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “David” may mean David himself, a future ruler from David’s line, or the Messiah; the Hebrew does not settle the interpretation here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean, “and he will be the one shepherd for them all,” referring directly to David.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there will be one shepherd for all of them
  simplified_phrase: they will all have one shepherd
  preserved_meaning: God’s restored people will be united under one shepherd-like ruler.
  reasoning_layer_used: lexical decision for וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  rationale: The natural English wording retains both unified leadership and the shepherd image.
- pob_phrase: They will walk in my judgments
  simplified_phrase: They will live by my judgments
  preserved_meaning: Their conduct will follow God’s judgments.
  reasoning_layer_used: lexical decision for יֵלֵכוּ
  rationale: “Live by” makes the covenantal walking idiom immediately understandable.
- pob_phrase: and do them
  simplified_phrase: and carry them out
  preserved_meaning: They will put God’s statutes into action.
  reasoning_layer_used: lexical decision for וְעָשׂוּ אוֹתָם
  rationale: “Carry them out” expresses practical obedience more naturally than “do them.”
interpretive_expansions:
- pob_phrase: walk in my judgments
  rendering: live by my judgments
  claim: Walking refers to a pattern of conduct rather than physical movement.
  evidence:
  - The lexical rationale identifies הלך here as a covenantal metaphor for conduct.
  - The immediate parallel describes keeping and carrying out God’s statutes.
  confidence: high
  alternatives_preserved:
  - walk according to my judgments
  - follow my judgments
translation_notes:
  risk_flags:
