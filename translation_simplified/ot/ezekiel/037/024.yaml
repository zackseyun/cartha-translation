    mitigation: The footnote preserves the documented literal, dynastic, and messianic possibilities.
  - risk: The smoother shepherd clause could hide its possible direct reference to David.
    mitigation: The footnote gives the personal-clause alternative without resolving the Hebrew ambiguity.
