translation:
  language: en
  text: In the land, on Israel’s mountains[a], I will unite them as one nation. One king will be king over all of them. They will never again be two nations or be divided into two kingdoms.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “in the hill country of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I will make them one nation in the land, on the mountains of Israel
  simplified_phrase: In the land, on Israel’s mountains, I will unite them as one nation
  preserved_meaning: God will cause the divided people to become one nation in Israel’s land.
  reasoning_layer_used: Lexical decisions for וְעָשִׂיתִי, לְגוֹי אֶחָד, and בָּאָרֶץ
  rationale: Reordering the locations and using “unite” makes the action easier to follow while preserving divine causation.
- pob_phrase: They will no longer be two nations, and they will no longer be divided into two kingdoms
  simplified_phrase: They will never again be two nations or be divided into two kingdoms
  preserved_meaning: The national and political division will permanently end.
  reasoning_layer_used: Lexical decisions for עוֹד, גוֹיִם, and מַמְלָכוֹת
  rationale: Combining the repeated negatives avoids stiffness while “never again” retains their emphatic force.
translation_notes:
  risk_flags:
  - risk: “Unite” is less formally close to “make them one nation.”
    mitigation: The phrase “as one nation” preserves the result and the first-person subject preserves God as its cause.
