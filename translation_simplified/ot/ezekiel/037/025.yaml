translation:
  language: en
  text: They will live in the land that I gave to my servant Jacob, where your fathers[a] lived. They, their sons, and their grandsons will live there forever. David my servant[b] will be prince[c] for them forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your ancestors.” The Hebrew says “your fathers.”
    reason: lexical_alternative
  - marker: b
    text: “David” may mean the historical David restored or a future ruler from David’s line; the text does not specify.
    reason: alternative_reading
  - marker: c
    text: Or “leader” or “ruler.” The Hebrew title is “prince,” not “king.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They will dwell in the land ... where your fathers dwelt
  simplified_phrase: They will live in the land ... where your fathers lived
  preserved_meaning: The people will again inhabit the land God gave to Jacob.
  reasoning_layer_used: POB lexical decisions for ישב and the covenant land context
  rationale: “Live” is common English and preserves the promised-land setting.
- pob_phrase: they will dwell on it
  simplified_phrase: will live there
  preserved_meaning: They will remain in that same land.
  reasoning_layer_used: POB lexical decision for עַל הָאָרֶץ and applied doctrine realignment
  rationale: “There” naturally points back to the land while retaining the location.
- pob_phrase: their sons and their sons' sons
  simplified_phrase: their sons and their grandsons
  preserved_meaning: Successive male generations will share the enduring restoration.
  reasoning_layer_used: POB lexical and gender-accurate decisions
  rationale: “Grandsons” clearly expresses “sons’ sons” without neutralizing the masculine wording.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “David” can only mean the historical king.
    mitigation: Footnote b preserves the POB’s unresolved historical and future-Davidic readings.
  - risk: “Prince” may suggest a king’s son rather than a ruler.
    mitigation: Footnote c gives the permitted leadership senses while retaining Ezekiel’s distinct title.
