translation:
  language: en
  text: They will no longer make themselves unclean with their idols[a], their detestable things, or any of their acts of rebellion. I will save them from all the places where they lived and sinned[b], and I will make them clean. Then they will be my people, and I will be their God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a strongly contemptuous word for false gods.
    reason: lexical_alternative
  - marker: b
    text: Or “from all their settlements where they sinned”; this may refer more generally to places or circumstances connected with their sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: defile themselves
  simplified_phrase: make themselves unclean
  preserved_meaning: Their idolatry and rebellion bring moral and ritual uncleanness upon them.
  reasoning_layer_used: Lexical decision for יִטַמְּאוּ
  rationale: The clearer wording retains the verb’s reflexive and cleansing-related force.
- pob_phrase: any of their transgressions
  simplified_phrase: any of their acts of rebellion
  preserved_meaning: Their sins are breaches of God’s rightful authority.
  reasoning_layer_used: Lexical decision for פִּשְׁעֵיהֶם
  rationale: “Acts of rebellion” makes the covenant offense understandable without weakening it.
- pob_phrase: all their dwelling places in which they sinned
  simplified_phrase: all the places where they lived and sinned
  preserved_meaning: God rescues them from the settings associated with their sin.
  reasoning_layer_used: Lexical and theological decisions for מוֹשְׁבֹתֵיהֶם
  rationale: The natural wording preserves the Hebrew place image while the footnote keeps its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Places where they lived” may sound exclusively geographic.
    mitigation: The footnote preserves the broader possibility of circumstances connected with sin.
  - risk: “Make themselves unclean” may be heard as merely physical dirtiness.
    mitigation: The surrounding references to idols, rebellion, and God’s cleansing establish moral and ritual uncleanness.
