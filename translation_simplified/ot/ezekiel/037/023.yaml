    text: Or 'from all their settlements where they sinned'; some understand the phrase more generally as rescue from all the places or circumstances associated with their sin.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'idols' here uses a strongly contemptuous term for false gods.
    reason: lexical_alternative
