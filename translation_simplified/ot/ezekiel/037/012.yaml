  preserved_meaning: Ezekiel must respond to the preceding vision by delivering God’s prophetic message.
  reasoning_layer_used: Lexical decisions for לָכֵן, הִנָּבֵא, and וְאָמַרְתָּ אֲלֵיהֶם
  rationale: “So” and “tell them” express the logical connection and speech command in ordinary English.
- pob_phrase: 'Thus says the Lord GOD: Behold, I am opening'
  simplified_phrase: 'This is what the Lord GOD says: See, I am opening'
  preserved_meaning: The formal divine message begins with emphasis on God’s vivid, imminent action.
  reasoning_layer_used: Lexical decisions for כֹּה אָמַר, אֲדֹנָי יְהוִה, and הִנֵּה אֲנִי
