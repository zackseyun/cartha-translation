    mitigation: A footnote gives the traditional inclusive alternative “children of Israel” while preserving the POB wording.
  - risk: Modern readers may find writing on a stick unusual.
    mitigation: A footnote preserves the documented alternatives “piece of wood” and “wooden tablet.”
