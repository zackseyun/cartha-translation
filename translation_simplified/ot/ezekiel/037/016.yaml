translation:
  language: en
  text: You, son of man, are to take a stick[a] and write on it, “For Judah and the sons of Israel[b] who are joined with him.” Then take another stick and write on it, “For Joseph—the stick of Ephraim—and all the house of Israel who are joined with him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Stick” may also mean a piece of wood; some understand it as a wooden tablet.
    reason: lexical_alternative
  - marker: b
    text: Or “the children of Israel.” The Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you, son of man, take for yourself one stick
  simplified_phrase: You, son of man, are to take a stick
  preserved_meaning: God personally commands Ezekiel to take one physical piece of wood.
  reasoning_layer_used: Lexical decision for קַח לְךָ and עֵץ
  rationale: The direct command is clearer without the awkward reflexive phrase, while “stick” preserves the chosen object.
- pob_phrase: his companions
  simplified_phrase: who are joined with him
  preserved_meaning: Each inscription includes the Israelites associated with Judah or Joseph.
  reasoning_layer_used: Lexical decision for חֲבֵרָיו and theological decision on the divided kingdoms
  rationale: The clause clearly expresses association while retaining the singular “him” and the two distinct groups.
- pob_phrase: Then take one stick
  simplified_phrase: Then take another stick
  preserved_meaning: Ezekiel takes a second stick for the second inscription.
  reasoning_layer_used: Immediate sign-act context
  rationale: “Another” makes the sequence natural in English without changing the number of objects.
interpretive_expansions:
- pob_phrase: Then take one stick
  rendering: Then take another stick
  claim: The second command concerns a separate stick.
  evidence:
  - The verse gives two different inscriptions.
  - The following sign-act requires the two sticks to be joined.
  confidence: high
  alternatives_preserved:
  - Then take a second stick
  - Then take one stick
translation_notes:
