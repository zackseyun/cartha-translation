translation:
  language: en
  text: When I open your graves and bring you out of them, you will know that I am Yahweh, my people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then you will know that I am Yahweh, when I open
  simplified_phrase: When I open ... you will know that I am Yahweh
  preserved_meaning: Opening the graves leads God's people to recognize Yahweh.
  reasoning_layer_used: The lexical decision reads the opening as temporal and knowing as its future result.
  rationale: Reordering the clauses makes the sequence easier to follow.
- pob_phrase: bring you up from your graves
  simplified_phrase: bring you out of them
  preserved_meaning: Yahweh causes his people to come out of their graves.
  reasoning_layer_used: The lexical rationale allows movement out of the graves while the theological decision protects the concrete image.
  rationale: Using “out” makes the movement clear, and “them” avoids repeating “graves.”
- pob_phrase: O my people
  simplified_phrase: my people
  preserved_meaning: Yahweh directly addresses those who belong to him as his covenant people.
  reasoning_layer_used: The lexical decision identifies the phrase as direct covenantal address.
  rationale: Dropping the formal vocative “O” gives natural modern English without weakening the address.
translation_notes:
  risk_flags:
  - risk: “Bring you out” could be heard as resolving whether the vision means national restoration or bodily resurrection.
    mitigation: The concrete graves remain in the main text, preserving the POB's theological tension.
