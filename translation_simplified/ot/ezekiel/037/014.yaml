translation:
  language: en
  text: I will put my Spirit within you,[a] and you will come to life. I will bring you home and settle you in your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “Spirit” can also mean “breath” or “wind.” Ezekiel 37 intentionally draws on this range of meaning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and you will live
  simplified_phrase: and you will come to life
  preserved_meaning: God will restore the people to life without specifying the mode.
  reasoning_layer_used: The lexical decision and the chapter’s resurrection imagery.
  rationale: “Come to life” makes the immediate image clearer while retaining the broader restoration promise.
- pob_phrase: I will settle you on your own land
  simplified_phrase: I will bring you home and settle you in your own land
  preserved_meaning: God will restore Israel securely to the land that belongs to them.
  reasoning_layer_used: The land lexical decisions and the prophetic restoration context.
  rationale: “Bring you home” clarifies the return from displacement, while “settle” preserves secure placement.
- pob_phrase: I have spoken, and I have done it
  simplified_phrase: I have spoken, and I have done it
  preserved_meaning: Yahweh presents his declared word and action as certain and complete.
  reasoning_layer_used: The lexical rationale for the paired Hebrew perfect verbs.
  rationale: The POB wording is retained because changing the second verb to a future would weaken its completed and certain force.
interpretive_expansions:
- pob_phrase: I will settle you on your own land
  rendering: I will bring you home and settle you in your own land
  claim: The settlement is a return from displacement to Israel’s homeland.
  evidence:
