  preserved_meaning: God's binding relationship with his people brings peace and endures forever.
  reasoning_layer_used: Lexical and theological decisions on covenant language
  rationale: This keeps both covenant terms while expressing their connection in natural English.
- pob_phrase: place them and multiply them
  simplified_phrase: establish them and make them numerous
  preserved_meaning: God will restore the people to stability and increase their number.
  reasoning_layer_used: Lexical decisions for נתן and רבה
  rationale: “Establish” keeps the action on the people without implying a specific location.
- pob_phrase: in their midst
