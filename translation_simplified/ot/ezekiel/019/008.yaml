  text: Then nations came against him from the provinces on every side. They spread their net over him, and he was caught in their trap-pit.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: set themselves against him all around
  simplified_phrase: came against him ... on every side
  preserved_meaning: The nations moved against him in hostility and encircled him.
  reasoning_layer_used: The lexical decisions permit “came against him” and require the encircling force of “all around.”
  rationale: The wording replaces an opaque idiom while keeping the attack from every side explicit.
- pob_phrase: nations from the provinces
  simplified_phrase: nations came against him from the provinces
  preserved_meaning: Foreign national powers came from administrative regions to attack him.
  reasoning_layer_used: The lexical decisions distinguish the nations from the provinces they came from.
  rationale: The reordered sentence makes the relationship between the nations and provinces clear.
- pob_phrase: he was caught in their pit
  simplified_phrase: he was caught in their trap-pit
  preserved_meaning: He was captured in a hunting pit as part of the lion-hunt image.
  reasoning_layer_used: The lexical rationale and cultural note identify the pit as a likely hunting trap.
  rationale: “Trap-pit” explains the unfamiliar hunting image without removing it.
