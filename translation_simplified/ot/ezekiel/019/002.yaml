translation:
  language: en
  text: and say, “What was your mother? A lioness! She lay down among lions[a] and raised[b] her cubs among young lions.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among lionesses.” The Hebrew plural can refer generally to lions, though some translate it to match the feminine image.
    reason: lexical_alternative
  - marker: b
    text: Or “reared.” The Hebrew verb can suggest increase, but here it most likely means bringing up her cubs.
    reason: lexical_alternative
