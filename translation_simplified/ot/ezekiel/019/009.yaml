translation:
  language: en
  text: They put him in a cage with hooks. Then they brought him to the king of Babylon and confined him in strongholds.[a] This was so that his voice would no longer be heard on the mountains of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean fortresses, a prison, or possibly siege works; the exact kind of secure confinement is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “his roar.” The Hebrew literally says “his voice.”
    reason: lexical_alternative
