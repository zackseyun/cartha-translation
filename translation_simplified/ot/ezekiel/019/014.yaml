translation:
  language: en
  text: Fire came out from a branch among the vine’s limbs and burned up its fruit. There was no strong branch in the vine—no scepter to rule.[a] This is a lament, and it has become a lament.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew blends vine and royal imagery: “strong branch” also carries the sense of a royal rod or staff, followed by “scepter to rule.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And fire went out from a branch of its limbs; it consumed its fruit
  simplified_phrase: Fire came out from a branch among the vine’s limbs and burned up its fruit.
  preserved_meaning: Fire comes from within the vine’s own growth and destroys its fruit.
  reasoning_layer_used: Lexical decisions for וַתֵּצֵא אֵשׁ, מִמַּטֵּה, בַדֶּיהָ, and פִּרְיָהּ אָכָלָה.
  rationale: Natural clause order and “burned up” make the fire’s destructive action clear.
- pob_phrase: there was not in it a strong branch, a scepter to rule
  simplified_phrase: There was no strong branch in the vine—no scepter to rule.
  preserved_meaning: The vine lacks a strong branch that can represent royal authority.
  reasoning_layer_used: The lexical and theological decisions preserve both vine and royal imagery.
  rationale: Naming the vine clarifies the referent, while the dash connects the two images.
- pob_phrase: This is a lamentation, and it has become a lamentation.
  simplified_phrase: This is a lament, and it has become a lament.
  preserved_meaning: The poem identifies itself and its subject as a cause for mourning.
  reasoning_layer_used: Lexical decisions for קִינָה הִיא and וַתְּהִי לְקִינָה.
  rationale: “Lament” is common English and retains the solemn repetition.
