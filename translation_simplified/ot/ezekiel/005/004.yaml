- pob_phrase: throw them into the midst of the fire and burn them in the fire
  simplified_phrase: Throw them into the middle of the fire and burn them there.
  preserved_meaning: They are thrown into the fire’s interior and burned there.
  reasoning_layer_used: Lexical decisions for תּוֹךְ, שׁלך, and שׂרף
  rationale: “Middle” keeps the interior image, while “there” removes awkward repetition.
- pob_phrase: a fire will go out to all the house of Israel
  simplified_phrase: a fire will spread against the whole house of Israel
  preserved_meaning: The fire moves outward as judgment against the entire house of Israel.
  reasoning_layer_used: Lexical and theological decisions for תֵצֵא אֵשׁ and אֶל כָּל בֵּית יִשְׂרָאֵל
  rationale: “Spread against” avoids the extinction sense of “go out” and retains the hostile direction.
