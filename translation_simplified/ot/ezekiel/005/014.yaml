  text: I will make you a ruin and an object of scorn among the nations around you, visible to everyone who passes by.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a reproach
  simplified_phrase: an object of scorn
  preserved_meaning: The ruined city will be publicly despised.
  reasoning_layer_used: Documented lexical alternative for חֶרְפָּה
  rationale: The approved alternative makes the social force of “reproach” clear.
- pob_phrase: that are around you
  simplified_phrase: around you
  preserved_meaning: These are the nations surrounding the addressed city.
  reasoning_layer_used: Lexical decision for אֲשֶׁר סְבִיבוֹתָיִךְ
  rationale: Removing the relative clause makes the phrase smoother without changing its scope.
- pob_phrase: in the sight of everyone who passes by
  simplified_phrase: visible to everyone who passes by
  preserved_meaning: Every passerby will openly see the city’s ruined and scorned condition.
  reasoning_layer_used: Lexical rationale for לְעֵינֵי and כָּל עוֹבֵר
  rationale: “Visible to” preserves public visibility without implying that people pass by in order to look.
translation_notes:
  risk_flags:
  - risk: “Visible to” states the sense of the Hebrew eye idiom rather than preserving its form.
    mitigation: The wording retains both the visual element and the public nature of the judgment.
