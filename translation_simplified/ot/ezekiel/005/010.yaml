translation:
  language: en
  text: Therefore, fathers among you will eat sons, and sons will eat their fathers. I will carry out my judgments against you and scatter your entire remnant[a] to every wind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, all who remain of you after the devastation.
    reason: lexical_alternative
  - marker: b
    text: “To every wind” means in every direction.
    reason: cultural_note
simplification_decisions:
- pob_phrase: fathers will eat sons in your midst
  simplified_phrase: fathers among you will eat sons
  preserved_meaning: Fathers within the addressed community will eat sons during the judgment.
  reasoning_layer_used: Lexical decisions for אָבוֹת, יֹאכְלוּ בָנִים, and בְּתוֹכֵךְ
  rationale: “Among you” makes the location clear without adding a possessive relationship.
- pob_phrase: execute judgments on you
  simplified_phrase: carry out my judgments against you
  preserved_meaning: God will impose judicial punishment on the people.
  reasoning_layer_used: Lexical decision for וְעָשִׂיתִי בָךְ שְׁפָטִים
  rationale: “Carry out” is common English, while “judgments” retains the judicial force.
- pob_phrase: all your remnant
  simplified_phrase: your entire remnant
  preserved_meaning: Everyone left after the devastation will also be scattered.
  reasoning_layer_used: Lexical and theological decisions for כָּל שְׁאֵרִיתֵךְ
  rationale: The key term “remnant” remains, and the footnote explains it plainly.
translation_notes:
  risk_flags:
  - risk: “Remnant” may sound hopeful even though this verse announces further judgment.
    mitigation: The sentence says the remnant will be scattered, and the footnote identifies those left after devastation.
  - risk: “To every wind” may be mistaken for a literal destination.
    mitigation: The footnote explains that the image means dispersal in every direction.
