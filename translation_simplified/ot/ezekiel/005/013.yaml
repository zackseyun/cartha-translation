translation:
  language: en
  text: My anger will run its full course. I will lay my wrath on them, and I will be comforted.[a] When my wrath against them has run its full course, they will know that I, the LORD, have spoken in my jealousy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will find relief.” The Hebrew describes being comforted or appeased after judgment is completed.
    reason: lexical_alternative
  - marker: b
    text: Or “in my zeal.” Here “jealousy” emphasizes the LORD’s covenant relationship with his people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my anger will be spent
  simplified_phrase: my anger will run its full course
  preserved_meaning: God’s anger continues until his judgment is complete.
  reasoning_layer_used: POB lexical decision for וְכָלָה אַפִּי
  rationale: “Run its full course” clearly expresses the completion of anger.
- pob_phrase: I will cause my wrath to rest on them
  simplified_phrase: I will lay my wrath on them
  preserved_meaning: God directs his judicial wrath against its targets.
  reasoning_layer_used: POB lexical decisions for וַהֲנִיחוֹתִי חֲמָתִי בָּם and applied revision
  rationale: “Lay” preserves the image of placing wrath on them without opaque causative wording.
- pob_phrase: when I spend my wrath against them
  simplified_phrase: when my wrath against them has run its full course
  preserved_meaning: They recognize the LORD after his wrath has been fully carried out.
  reasoning_layer_used: POB lexical decision for בְּכַלּוֹתִי and discourse rationale for וְיָדְעוּ
  rationale: The recast clause keeps both the timing and the completion motif.
translation_notes:
  risk_flags:
