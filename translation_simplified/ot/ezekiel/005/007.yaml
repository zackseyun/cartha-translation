translation:
  language: en
  text: 'Therefore, this is what the Lord GOD says: “Because you have lived in greater disorder than the nations around you,[a] you have not lived by my laws. You have not carried out my rulings, and you have not even followed the rulings of the nations around you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may also mean “raged more,” “been more rebellious,” or possibly “been more numerous.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you have been more turbulent
  simplified_phrase: you have lived in greater disorder
  preserved_meaning: Judah’s disorder exceeded that of the surrounding nations without defining it narrowly as rebellion.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: The clearer wording preserves the chosen sense while the footnote retains the Hebrew uncertainty.
- pob_phrase: you have not walked in my statutes
  simplified_phrase: you have not lived by my laws
  preserved_meaning: The people did not order their lives according to God’s statutes.
  reasoning_layer_used: POB lexical decision
  rationale: “Lived by” clearly expresses the walking image as a pattern of conduct.
- pob_phrase: carried out my judgments ... acted according to the judgments
  simplified_phrase: carried out my rulings ... followed the rulings
  preserved_meaning: God’s standards and the nations’ standards remain distinct but lexically linked.
  reasoning_layer_used: POB lexical decisions and rhetorical rationale
  rationale: Separate clauses preserve the accumulating charges, while “rulings” is more familiar than “judgments.”
