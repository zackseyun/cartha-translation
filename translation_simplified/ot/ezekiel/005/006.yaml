translation:
  language: en
  text: She rebelled wickedly against my judgments—more than the nations did—and against my statutes—more than the lands around her. For her people rejected my judgments and did not live by my statutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “She changed my judgments into wickedness, more than the nations did.” The Hebrew verb can describe rebellion or the corrupt alteration of what God gave.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rebelled against my judgments with wickedness more than the nations
  simplified_phrase: rebelled wickedly against my judgments—more than the nations did
  preserved_meaning: Jerusalem’s wicked rebellion exceeded that of the nations.
  reasoning_layer_used: Lexical decisions for וַתֶּמֶר, לְרִשְׁעָה, and comparative מִן
  rationale: The adverb and completed comparison make the accusation natural without weakening it.
- pob_phrase: more than the lands that are around her
  simplified_phrase: more than the lands around her
  preserved_meaning: Jerusalem’s rebellion against God’s statutes exceeded that found in surrounding lands.
  reasoning_layer_used: Lexical decision for מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  rationale: The shorter wording keeps the territorial comparison without making the lands explicit actors.
- pob_phrase: they did not walk in my statutes
  simplified_phrase: did not live by my statutes
  preserved_meaning: They did not conduct their lives according to God’s statutes.
  reasoning_layer_used: Lexical rationale and POB cultural note for לֹא הָלְכוּ בָהֶם
  rationale: The direct idiomatic meaning is clearer than retaining the opaque walking metaphor.
interpretive_expansions:
- pob_phrase: they rejected my judgments
  rendering: her people rejected my judgments
  claim: The plural subject refers to the inhabitants represented by personified Jerusalem.
  evidence:
  - The preceding feminine singular portrays Jerusalem as a woman.
  - The plural verbs naturally shift from the city to its inhabitants.
  confidence: high
  alternatives_preserved:
  - they rejected my judgments
translation_notes:
  risk_flags:
