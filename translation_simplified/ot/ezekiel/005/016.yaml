translation:
  language: en
  text: When I send the deadly arrows of famine against them—arrows I send to bring destruction and to destroy you—I will bring even more famine upon you and cut off the food supply that sustains you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew pictures this as breaking “the staff of bread,” like breaking a support people depend on.
    reason: simplification_note
simplification_decisions:
- pob_phrase: which are for destruction, which I will send to destroy you
  simplified_phrase: arrows I send to bring destruction and to destroy you
  preserved_meaning: God directly sends the famine-arrows for destruction and to destroy the people.
  reasoning_layer_used: Lexical decisions for לְמַשְׁחִית and לְשַׁחֶתְכֶם; theological decision on divine agency
  rationale: The recast clause keeps God as the agent and preserves both destructive result and purpose.
- pob_phrase: then I will add famine upon you
  simplified_phrase: I will bring even more famine upon you
  preserved_meaning: God will increase the famine as judgment upon the people.
  reasoning_layer_used: Lexical decision for וְרָעָב אֹסֵף עֲלֵיכֶם
  rationale: “Even more famine” expresses the increase in ordinary English while retaining direct divine action.
- pob_phrase: break for you the staff of bread
  simplified_phrase: cut off the food supply that sustains you
  preserved_meaning: God will remove the food on which the people depend for life.
  reasoning_layer_used: Lexical decision for מַטֵּה לָחֶם and theological decision on judgment imagery
  rationale: The main text gives the idiom’s clear meaning, while the footnote preserves its staff image.
translation_notes:
  risk_flags:
  - risk: The shift from “them” to “you” may sound unexpected in English.
    mitigation: The wording retains the source’s deliberate pronoun shift rather than harmonizing it.
  - risk: Rendering the bread-staff idiom directly could hide the Hebrew image.
    mitigation: The footnote preserves the image of breaking a support people depend on.
