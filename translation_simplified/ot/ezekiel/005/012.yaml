translation:
  language: en
  text: One third of you will die in an epidemic and perish from famine in your midst. Another third will fall by the sword all around you. I will scatter the last third to every wind—in every direction—and I will draw a sword and pursue them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: die by pestilence
  simplified_phrase: die in an epidemic
  preserved_meaning: Epidemic disease will cause their deaths as part of the announced judgment.
  reasoning_layer_used: Lexical decision for דֶּבֶר
  rationale: “Epidemic” gives modern readers the precise sense of the less familiar “pestilence.”
- pob_phrase: be consumed by famine in your midst
  simplified_phrase: perish from famine in your midst
  preserved_meaning: Famine will destroy this group within the personified city.
  reasoning_layer_used: Lexical decisions for רָעָב, יִכְלוּ, and בְּתוֹכֵךְ
  rationale: “Perish” states the deadly result clearly, while “in your midst” preserves the city location.
- pob_phrase: a third ... and a third ... and a third
  simplified_phrase: One third ... Another third ... the last third
  preserved_meaning: The judgment remains divided into three equal groups.
  reasoning_layer_used: Lexical decision for the repeated fractional expression
  rationale: The sequence is easier to follow without weakening its three-part structure.
interpretive_expansions:
- pob_phrase: to every wind
  rendering: to every wind—in every direction
  claim: The wind expression means that the people will be scattered in all directions.
  evidence:
  - The lexical rationale identifies this as a Hebrew idiom for scattering in every direction.
  confidence: high
  alternatives_preserved:
  - The concrete image “to every wind” remains in the text.
- pob_phrase: I will draw out a sword after them
  rendering: I will draw a sword and pursue them
  claim: The drawn sword depicts armed pursuit of the scattered people.
  evidence:
  - The lexical rationale says that “after them” supplies the pursuit sense in the sword idiom.
  confidence: high
  alternatives_preserved:
  - The sword may also be described as being unsheathed after them.
translation_notes:
  risk_flags:
  - risk: “Epidemic” is less formally prophetic than “pestilence.”
    mitigation: It retains the specific sense of widespread deadly disease identified in the lexical rationale.
  - risk: “Pursue them” makes the sword idiom more explicit than the POB wording.
    mitigation: The POB reasoning directly identifies pursuit as the sense of “after them.”
