translation:
  language: en
  text: “Therefore, as I live,” declares the Lord Yahweh, “because you have made my sanctuary unclean with all your detestable things and abominations, I will surely diminish you.[a] My eye will not spare you, and I too will show no pity.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is terse and leaves the object unstated; the verb may mean “diminish or cut down” or “withdraw.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: surely because you have defiled my sanctuary
  simplified_phrase: because you have made my sanctuary unclean ... I will surely diminish you
  preserved_meaning: Their pollution of God's holy place is the reason for his certain judgment.
  reasoning_layer_used: Lexical decisions for the oath expression, causal conjunction, and defilement verb.
  rationale: Moving “surely” to the judgment makes the oath’s force clear in natural English.
- pob_phrase: with all your detestable things and with all your abominations
  simplified_phrase: with all your detestable things and abominations
  preserved_meaning: Both strong accusations remain distinct without assigning them exclusively to objects or conduct.
  reasoning_layer_used: The lexical audit preserves broad senses for both Hebrew nouns.
  rationale: Removing the repeated preposition lightens the sentence without narrowing either term.
- pob_phrase: my eye will not spare, and I also will show no pity
  simplified_phrase: My eye will not spare you, and I too will show no pity
  preserved_meaning: God will neither spare the people nor treat them with compassion.
  reasoning_layer_used: The lexical rationale preserves the eye image and the additive parallel declaration.
  rationale: The understood object is supplied, while “too” retains the force of “also.”
interpretive_expansions:
- pob_phrase: my eye will not spare
  rendering: My eye will not spare you
  claim: The people addressed are the understood object of God's refusal to spare.
  evidence:
  - The immediate judgment address is directed to “you.”
  - The lexical audit recognizes “I will not spare” as the idiomatic sense.
  confidence: high
  alternatives_preserved:
  - my eye will not spare
translation_notes:
