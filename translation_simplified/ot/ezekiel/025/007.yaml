translation:
  language: en
  text: 'Therefore, look: I have stretched out my hand against you. I will hand you over to the nations as plunder. I will remove you from among the peoples and wipe you out from the lands. I will completely destroy you. Then you will know that I am Yahweh.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore, behold
  simplified_phrase: Therefore, look
  preserved_meaning: The words solemnly call attention to the judgment that follows.
  reasoning_layer_used: POB lexical decisions for לָכֵן and הִנְנִי
  rationale: “Look” replaces archaic “behold” while retaining the prophetic call for attention.
- pob_phrase: I will give you as plunder to the nations
  simplified_phrase: I will hand you over to the nations as plunder
  preserved_meaning: Yahweh will deliver those addressed to foreign nations for conquest and plunder.
  reasoning_layer_used: POB lexical decision for וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  rationale: “Hand you over” clearly expresses being delivered into the conquerors’ power.
- pob_phrase: cut you off from the peoples and destroy you from the lands; I will annihilate you
  simplified_phrase: remove you from among the peoples and wipe you out from the lands. I will completely destroy you
  preserved_meaning: Yahweh will remove them from the community of peoples and lands, ending in utter destruction.
  reasoning_layer_used: POB lexical decisions for כרת, אבד, and שׁמד
  rationale: The shorter clauses clarify the cumulative removal and preserve the final intensification.
translation_notes:
  risk_flags:
  - risk: “Wipe you out” could be heard only as destruction rather than removal from territories.
    mitigation: The phrase “from the lands” preserves the source’s spatial force, while the final sentence states complete destruction separately.
