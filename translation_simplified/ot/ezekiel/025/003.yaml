translation:
  language: en
  text: 'Say to the Ammonites, “Listen to the word of the Lord Yahweh. This is what the Lord Yahweh says: Because you gloated and said, ‘Aha!’[a] when my sanctuary was treated as unholy, when the land of Israel was devastated, and when the people of Judah went into exile—”'
