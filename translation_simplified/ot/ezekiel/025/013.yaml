  preserved_meaning: God solemnly introduces his judgment against Edom.
  reasoning_layer_used: POB translation and divine-title decision
  rationale: The familiar speech formula replaces archaic clause order while retaining the POB divine title.
- pob_phrase: man and beast
  simplified_phrase: people and animals
  preserved_meaning: The judgment removes both human and animal inhabitants.
  reasoning_layer_used: POB lexical decisions for אָדָם and בְהֵמָה
  rationale: Common nouns make the human-animal contrast immediately clear.
- pob_phrase: I will make it a desolation
