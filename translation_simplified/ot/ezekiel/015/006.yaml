translation:
  language: en
  text: 'Therefore, this is what the Lord Yahweh says: “Just as I have given grapevine wood among the trees of the forest to the fire as fuel, so I have given the people of Jerusalem to the fire.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: thus says the Lord GOD
  simplified_phrase: this is what the Lord Yahweh says
  preserved_meaning: This retains the prophetic messenger formula and uses the revealed divine name.
  reasoning_layer_used: The theological decision specifies “Yahweh,” and the lexical decision permits “this is what ... says.”
  rationale: The wording is natural modern English while preserving prophetic authority.
- pob_phrase: the wood of the vine among the trees of the forest
  simplified_phrase: grapevine wood among the trees of the forest
  preserved_meaning: The concrete image sets grapevine wood among forest trees for comparison.
  reasoning_layer_used: The lexical decisions identify עֵץ as wood and בְּ as marking its place among forest trees.
  rationale: “Grapevine wood” is clearer without suggesting that it was removed from the forest.
- pob_phrase: the inhabitants of Jerusalem
  simplified_phrase: the people of Jerusalem
  preserved_meaning: The phrase still refers collectively to those living in Jerusalem.
  reasoning_layer_used: The lexical rationale permits an idiomatic rendering of the participial expression.
  rationale: “The people of Jerusalem” is more familiar to common readers.
interpretive_expansions:
- pob_phrase: so I have given the inhabitants of Jerusalem
  rendering: so I have given the people of Jerusalem to the fire
  claim: The unstated destination in the second half is supplied by the comparison with vine wood given to fire.
  evidence:
  - The first half explicitly gives the vine wood to the fire and introduces the second half with “so.”
  - The surrounding passage continues the image of Jerusalem’s people facing fire.
  confidence: high
  alternatives_preserved:
  - so I have given the people of Jerusalem
translation_notes:
  risk_flags:
  - risk: “To the fire” makes the comparison’s unstated destination explicit.
    mitigation: The parallel introduced by “so” directly supplies the fire image and avoids replacing it with abstract judgment language.
  - risk: The POB display text uses “the Lord GOD,” while its theological audit directs “Yahweh.”
    mitigation: The draft follows the explicit theological decision and retains “Lord” in the compound title.
