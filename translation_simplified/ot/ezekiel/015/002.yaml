translation:
  language: en
  text: Son of man, what makes vine wood better than any other wood—the wood of a vine branch growing among the trees of the forest?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “What is vine wood compared with any other wood?” Its wording is brief and implies a comparison.
    reason: lexical_alternative
