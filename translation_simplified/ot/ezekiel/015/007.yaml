translation:
  language: en
  text: I will set my face against them.[a] They have come out of the fire, but fire will still consume them. When I set my face against them, you will know that I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “set my face against” someone means to oppose them with determination and bring judgment on them.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They have come out from the fire, but the fire will consume them.
  simplified_phrase: They have come out of the fire, but fire will still consume them.
  preserved_meaning: Coming out of fire does not mean they have escaped the judgment of fire.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: “Still” makes the intended contrast clear without claiming that their first emergence was a successful escape.
- pob_phrase: Then you will know that I am Yahweh, when I set my face against them.
  simplified_phrase: When I set my face against them, you will know that I am Yahweh.
  preserved_meaning: Yahweh’s act of determined judgment will make his identity known.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Reordering the clauses gives natural English while keeping the same result and timing.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “set my face against them” as a literal physical action.
    mitigation: The footnote explains the image while the main text preserves its prophetic and judicial force.
