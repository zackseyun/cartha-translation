translation:
  language: en
  text: These are the measurements of the altar. They use the long cubit, which equals a standard cubit plus the width of a hand. The gutter[a] is one cubit by one cubit. A border measuring one handspan runs all around its rim. This is the base[b] of the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may refer to a gutter, trench, or part of the base; the exact feature is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may instead refer to the altar’s height or back structure.
    reason: lexical_alternative
