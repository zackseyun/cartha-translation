translation:
  language: en
  text: From the altar’s ground-level ledge[b] to the lower platform was about 3½ feet (1.05 meters). The width there was about 21 inches (53 centimeters). From the smaller platform to the larger one was about 7 feet (2.1 meters), and the width was also about 21 inches (53 centimeters).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew measurements are exactly two cubits, one cubit, four cubits, and one cubit. Ezekiel 43:13 defines the cubit used here as a cubit plus a handbreadth, so the modern equivalents are approximate.
    reason: cultural_note
  - marker: b
    text: The Hebrew expression may refer to the altar’s ground-level ledge, base, or recess.
    reason: lexical_alternative
