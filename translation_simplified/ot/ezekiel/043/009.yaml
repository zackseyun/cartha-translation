translation:
  language: en
  text: Now they must remove from my presence their prostitution[a] and the corpses of their kings.[b] Then I will dwell among them forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “prostitution” is a picture of their unfaithfulness to God, especially through idolatry.
    reason: lexical_alternative
  - marker: b
    text: This may mean the kings’ actual dead bodies or royal tombs or memorials that defiled the area near the sanctuary.
    reason: cultural_note
simplification_decisions:
- pob_phrase: let them put far from me
  simplified_phrase: they must remove from my presence
  preserved_meaning: The people are required to separate these defiling things from God’s presence.
  reasoning_layer_used: Lexical and theological decisions on יְרַחֲקוּ and מִמֶּנִּי
  rationale: “Must remove” states the exhortatory force in direct, natural English.
- pob_phrase: and I will dwell in their midst
  simplified_phrase: Then I will dwell among them
  preserved_meaning: God promises his enduring covenant presence with his people after the required removal.
  reasoning_layer_used: Lexical decisions on וְשָׁכַנְתִּי and בְתוֹכָם
  rationale: “Then” clarifies the response-and-result relationship while “dwell” retains the key covenant term.
translation_notes:
  risk_flags:
  - risk: Modern readers may initially take “prostitution” as only literal sexual conduct.
    mitigation: Footnote a identifies the prophetic metaphor without replacing it in the main text.
  - risk: The exact historical meaning of “the corpses of their kings” is uncertain.
    mitigation: The concrete wording remains in the text, and footnote b preserves the main possibilities.
