  rationale: A direct command is clearer than “you shall” while preserving the required action and sequence.
- pob_phrase: a male goat without blemish
  simplified_phrase: a male goat with no defects
  preserved_meaning: The sacrificial animal must be male and free from disqualifying physical defects.
  reasoning_layer_used: POB lexical decision for שְׂעִיר עִזִּים and תָּמִים
  rationale: “With no defects” explains the ritual requirement in common English.
- pob_phrase: and they shall purify the altar just as they purified it with the bull
  simplified_phrase: They must purify the altar, just as they purified it with the bull.
  preserved_meaning: The altar undergoes the same ritual purification previously performed with the bull.
  reasoning_layer_used: POB lexical and theological decisions for the Piel of חטא
