translation:
  language: en
  text: On the second day, present a male goat with no defects as a sin offering.[a] They must purify the altar, just as they purified it with the bull.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as a purification offering.” The Hebrew term can refer to an offering that removes ritual impurity.
    reason: lexical_alternative
