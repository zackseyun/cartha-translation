  simplified_phrase: show them the Temple’s design
  preserved_meaning: They are to be shown the structure revealed for the Temple.
  reasoning_layer_used: Lexical decision for הוֹדַע and theological decision on architectural language
  rationale: “Show” is more direct than “make known,” while “design” keeps the architectural meaning.
- pob_phrase: write it before their eyes
  simplified_phrase: Write it all down where they can see it
  preserved_meaning: The complete plan is to be recorded openly in their sight.
  reasoning_layer_used: Lexical rationale for וּכְתֹב לְעֵינֵיהֶם
  rationale: The wording explains the Hebrew image without losing its visible, public force.
- pob_phrase: keep its whole design and all its statutes and do them
  simplified_phrase: carefully follow its whole design and carry out all its statutes
  preserved_meaning: They must observe both the architectural pattern and its binding requirements.
  reasoning_layer_used: Lexical decisions for שׁמר and עשה plus the architectural-legal theological decision
  rationale: “Follow” and “carry out” make the required obedience clear while keeping design and statutes distinct.
