translation:
  language: en
  text: If they are ashamed of everything they have done, show them the Temple’s design[a] and layout—its exits and entrances, all its forms, and all its statutes and laws.[b] Write it all down where they can see it, so that they will carefully follow its whole design and carry out all its statutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew repeatedly uses a word that can mean “form” or “pattern,” emphasizing the Temple’s structural design.
    reason: lexical_alternative
  - marker: b
    text: “Laws” may also be translated “instructions.”
    reason: lexical_alternative
