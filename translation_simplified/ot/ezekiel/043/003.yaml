translation:
  language: en
  text: What I saw looked like what I had seen when I came to destroy the city.[a] These visions also looked like what I had seen beside the Kebar Canal. Then I fell on my face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when he came to destroy the city.” The Hebrew says “when I came,” perhaps describing Ezekiel’s part in the vision rather than saying that he personally destroyed the city.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the appearance of what I saw was like the appearance that I had seen
  simplified_phrase: What I saw looked like what I had seen
  preserved_meaning: The wording still stresses that the two visible experiences closely corresponded.
  reasoning_layer_used: The lexical decision for מַרְאֶה preserves the repeated visual comparison.
  rationale: The clause is recast in ordinary English rather than repeating the abstract word “appearance.”
- pob_phrase: and the visions were like the appearance that I had seen by the Kebar Canal
  simplified_phrase: These visions also looked like what I had seen beside the Kebar Canal
  preserved_meaning: The plural visions are compared with Ezekiel’s earlier experience at the Kebar Canal.
  reasoning_layer_used: The lexical decisions preserve the plural “visions” and the geographic rendering “Kebar Canal.”
  rationale: “Looked like” and “beside” make the comparison and location immediately clear.
- pob_phrase: and I fell on my face
  simplified_phrase: Then I fell on my face
  preserved_meaning: Ezekiel physically falls facedown in reverence and overwhelm.
  reasoning_layer_used: The lexical rationale requires preserving the source-language image and its biblical force.
  rationale: The concrete expression is retained, while “Then” makes the sequence natural.
