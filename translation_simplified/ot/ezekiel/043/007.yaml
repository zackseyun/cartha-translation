  preserved_meaning: This is the place appointed for God's royal presence, while the concrete image of his feet remains.
  reasoning_layer_used: POB lexical decisions for מְקוֹם כִּסְאִי and מְקוֹם כַּפּוֹת רַגְלַי
  rationale: The repeated wording is compressed without replacing “soles of my feet” with “footstool.”
- pob_phrase: where I will dwell among the children of Israel forever
  simplified_phrase: Here I will live among the children of Israel forever
  preserved_meaning: God promises his enduring presence among covenant Israel.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר אֶשְׁכָּן שָׁם, בְּתוֹךְ בְּנֵי יִשְׂרָאֵל, and לְעוֹלָם
  rationale: A new sentence and the common verb “live” make the promise easier to follow.
- pob_phrase: the house of Israel shall no longer defile my holy name, neither they nor their kings
  simplified_phrase: The people of Israel and their kings will no longer defile my holy name
  preserved_meaning: Both Israel's people and their rulers will cease defiling God's holy name.
  reasoning_layer_used: POB lexical decisions for יְטַמְּאוּ, שֵׁם קָדְשִׁי, and הֵמָּה וּמַלְכֵיהֶם
  rationale: Natural coordination replaces the formal negative construction while retaining both groups.
