translation:
  language: en
  text: He said to me, “Son of man, this is the place for my throne and for the soles of my feet. Here I will live among the children of Israel forever. The people of Israel and their kings will no longer defile my holy name by their prostitution and by the corpses of their kings at their places of idolatrous worship.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew traditionally reads “at their high places,” meaning sites of idolatrous worship; the final phrase may instead mean “by the corpses of their kings in their death.”
    reason: alternative_reading
