  preserved_meaning: The previously prescribed consecration period must end first.
  reasoning_layer_used: Lexical decision for וִיכַלּוּ and contextual decision for הַיָּמִים
  rationale: This replaces a formal passive with a natural reference to the preceding days.
- pob_phrase: from the eighth day onward
  simplified_phrase: begin offering ... on the eighth day, and they will continue from then on
  preserved_meaning: Regular sacrifices start on day eight and continue afterward.
  reasoning_layer_used: Lexical rationale for בַיּוֹם הַשְּׁמִינִי וָהָלְאָה
  rationale: This unpacks both the starting point and the ongoing action.
- pob_phrase: the priests shall offer on the altar your burnt offerings and your peace offerings
  simplified_phrase: the priests will begin offering your burnt offerings and peace offerings on the altar
  preserved_meaning: The priests perform both prescribed kinds of sacrifice on the altar.
  reasoning_layer_used: Sacrificial lexical decisions for יַעֲשׂוּ, עוֹלֹתֵיכֶם, and שַׁלְמֵיכֶם
  rationale: The clause is reordered into ordinary English while keeping both offerings distinct.
