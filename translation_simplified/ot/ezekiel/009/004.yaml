translation:
  language: en
  text: Yahweh said to him, “Go through the middle of the city, through the middle of Jerusalem, and put a mark[a] on the foreheads of the men who sigh and groan because of all the abominations being committed there.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer to taw, the name of the Hebrew letter ת, used here as a mark.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Pass through the midst of the city, through the midst of Jerusalem
  simplified_phrase: Go through the middle of the city, through the middle of Jerusalem
  preserved_meaning: The command directs movement through central Jerusalem and retains the Hebrew repetition.
  reasoning_layer_used: Lexical decisions for עֲבֹר and repeated בְּתוֹךְ
  rationale: Common wording replaces the formal phrase without implying exhaustive coverage.
- pob_phrase: over all the abominations being done in her midst
  simplified_phrase: because of all the abominations being committed there
  preserved_meaning: The men grieve over the ongoing morally detestable acts within Jerusalem.
  reasoning_layer_used: Lexical decisions for עַל, תּוֹעֵבוֹת, הַנַּעֲשׂוֹת, and בְּתוֹכָהּ
  rationale: The wording makes the cause of their grief and the location clear in natural English.
translation_notes:
  risk_flags:
  - risk: “Being committed” identifies the abominations as wrongful acts more directly than “being done.”
    mitigation: The prophetic term “abominations” already gives the actions strong moral and religious force.
  - risk: “There” does not preserve Jerusalem’s feminine personification.
    mitigation: It keeps the location clear while avoiding the unfamiliar phrase “in her midst.”
