translation:
  language: en
  text: Then he said to me, “The wickedness of the people of Israel and Judah is very, very great. The land is full of bloodshed, and the city is full of injustice.[a] They say, ‘Yahweh has forsaken the land. Yahweh does not see what is happening.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “perversion” or “twisted justice”; the Hebrew describes what is right being made crooked.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the iniquity of the house of Israel and Judah
  simplified_phrase: the wickedness of the people of Israel and Judah
  preserved_meaning: Israel and Judah are condemned together for serious moral evil.
  reasoning_layer_used: Lexical decisions for עֲוֺן and the corporate expression “house.”
  rationale: “Wickedness” and “people” state the moral and corporate sense in common English.
- pob_phrase: is exceedingly great
  simplified_phrase: is very, very great
  preserved_meaning: The wording strongly emphasizes the extent of their wickedness.
  reasoning_layer_used: Lexical decision for the doubled מְאֹד.
  rationale: Repeating “very” preserves the source’s emphatic intensification in familiar English.
- pob_phrase: the city is full of perversion
  simplified_phrase: the city is full of injustice
  preserved_meaning: The city is filled with crooked wrongdoing, including corrupted justice.
  reasoning_layer_used: Lexical and theological decisions for מֻטֶּה.
  rationale: “Injustice” is clear without restricting the charge to a technical judicial sense.
interpretive_expansions:
- pob_phrase: Yahweh does not see
  rendering: Yahweh does not see what is happening
  claim: The people deny that Yahweh observes what is occurring in the land.
  evidence:
  - The immediate context identifies bloodshed and injustice in the land and city.
  - The lexical rationale describes a denial of divine oversight or attention.
  confidence: high
  alternatives_preserved:
  - Yahweh does not see.
  - Yahweh does not look.
translation_notes:
  risk_flags:
  - risk: “Injustice” may not fully display the Hebrew image of crookedness or perversion.
    mitigation: The footnote preserves the broader image and lexical alternatives.
