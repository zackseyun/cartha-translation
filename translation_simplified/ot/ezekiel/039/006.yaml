translation:
  language: en
  text: I will send fire against Magog. I will also send fire against those who live safely in the coastlands.[a] They will know that I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the islands.” The Hebrew word can mean islands or, more broadly, lands along distant coasts.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I will send fire on Magog and on those who live securely in the coastlands
  simplified_phrase: I will send fire against Magog. I will also send fire against those who live safely in the coastlands.
  preserved_meaning: Yahweh will target both Magog and the secure inhabitants of the coastlands with fire.
  reasoning_layer_used: POB lexical decisions for בְמָגוֹג, וּבְיֹשְׁבֵי הָאִיִּים, and לָבֶטַח
  rationale: Two short sentences clarify the two targets while keeping the fire image and the inhabitants’ security.
- pob_phrase: live securely
  simplified_phrase: live safely
  preserved_meaning: The inhabitants are living in a state of security before the fire comes.
  reasoning_layer_used: POB lexical and theological decisions on לָבֶטַח
  rationale: “Live safely” is more common English and still attaches the security to the coastland inhabitants.
- pob_phrase: and they will know that I am Yahweh
  simplified_phrase: They will know that I am Yahweh.
  preserved_meaning: The judgment will result in recognition of God by his revealed personal name.
  reasoning_layer_used: POB lexical and theological decisions on וְיָדְעוּ and יְהוָה
  rationale: A separate sentence makes the result clear while retaining the name Yahweh.
translation_notes:
