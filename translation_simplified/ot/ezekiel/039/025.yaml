translation:
  language: en
  text: 'So this is what the Lord Yahweh says: “Now I will restore Jacob’s fortunes.[a] I will have compassion on all the people of Israel, and I will be jealous for my holy name.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “bring Jacob’s captives back.” The Hebrew can refer specifically to return from captivity or more broadly to restoration after disaster.
    reason: alternative_reading
  - marker: b
    text: Or, “I will be zealous for my holy name.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore thus says the Lord GOD
  simplified_phrase: So this is what the Lord Yahweh says
  preserved_meaning: God’s declaration follows from what came before, and Yahweh identifies the covenant name.
  reasoning_layer_used: POB lexical messenger formula and updated theological decision for יהוה
  rationale: Natural syntax clarifies the formula while following the governing divine-name doctrine.
- pob_phrase: the whole house of Israel
  simplified_phrase: all the people of Israel
  preserved_meaning: God’s compassion extends to Israel as a complete covenant people.
  reasoning_layer_used: POB lexical decision for כָּל בֵּית יִשְׂרָאֵל
  rationale: “People” clearly conveys the collective sense of “house” to modern readers.
- pob_phrase: and I will have compassion ... and I will be jealous
  simplified_phrase: I will have compassion ... and I will be jealous
  preserved_meaning: God promises both mercy toward Israel and jealous concern for his holy name.
  reasoning_layer_used: POB lexical and theological decisions for רחם and קנא
  rationale: A new sentence reduces clause density without merging the two divine actions.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake God’s jealousy for sinful envy.
    mitigation: Footnote b preserves “zealous” as the contextual lexical alternative.
  - risk: “Restore Jacob’s fortunes” may hide a possible reference to returning captives.
    mitigation: Footnote a preserves the captivity reading and the Hebrew ambiguity.
