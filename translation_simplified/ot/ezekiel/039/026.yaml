translation:
  language: en
  text: They will bear their shame and the burden of all the ways they were unfaithful to me.[a] This will happen while they live safely in their own land, with no one to make them afraid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They will forget their shame and all their unfaithfulness.” Some ancient versions support this sense, but the Hebrew most directly says “bear.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all their unfaithfulness by which they were unfaithful to me
  simplified_phrase: the burden of all the ways they were unfaithful to me
  preserved_meaning: Their covenant unfaithfulness remains something they must bear.
  reasoning_layer_used: POB lexical decisions for מַעֲלָם / מָעֲלוּ and וְנָשׂוּ
  rationale: The rewrite removes the difficult noun-verb repetition while retaining relational unfaithfulness and the image of bearing it.
- pob_phrase: when they dwell securely on their land
  simplified_phrase: This will happen while they live safely in their own land
  preserved_meaning: They bear their past shame during their restored, secure life in the land.
  reasoning_layer_used: POB lexical decisions for בְּשִׁבְתָּם, עַל אַדְמָתָם, and לָבֶטַח
  rationale: A new sentence makes the time relationship clear without changing it.
- pob_phrase: with no one to make them afraid
  simplified_phrase: with no one to make them afraid
  preserved_meaning: No threatening person will terrorize them.
  reasoning_layer_used: POB lexical decision for וְאֵין מַחֲרִיד
  rationale: This already uses clear common English and preserves the personal-agent nuance.
interpretive_expansions:
- pob_phrase: bear ... all their unfaithfulness
  rendering: bear ... the burden of all the ways they were unfaithful
  claim: Their former unfaithfulness remains a burden they carry during restoration.
  evidence:
  - The Hebrew verb most directly means “bear” or “carry.”
  - The POB rationale says the phrase conveys enduring the consequence or reproach.
  - The immediate context places this bearing alongside secure life in the land.
  confidence: high
  alternatives_preserved:
  - They will bear all their unfaithfulness.
  - They will forget their shame and unfaithfulness.
translation_notes:
  risk_flags:
  - risk: “Burden” could be read as specifying punishment beyond what the verse states.
    mitigation: The wording keeps “shame” and uses “burden” only to clarify the source image of bearing.
  - risk: The restoration context may tempt readers to assume Israel forgets its former shame.
    mitigation: The main text retains “bear,” and the footnote identifies “forget” only as an alternative reading.
