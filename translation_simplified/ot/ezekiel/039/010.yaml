translation:
  language: en
  text: They will not bring wood from the fields or cut wood in the forests, because they will use the weapons as fuel for their fires. They will plunder those who plundered them and loot those who looted them, declares the Lord Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: carry wood from the field, nor cut it from the forests
  simplified_phrase: bring wood from the fields or cut wood in the forests
  preserved_meaning: They will no longer obtain wood from the open land or forests.
  reasoning_layer_used: POB lexical decisions for יִשְׂאוּ עֵצִים, מִן הַשָּׂדֶה, יַחְטְבוּ, and מִן הַיְּעָרִים
  rationale: “Bring” and the repeated “wood” make the two actions immediately clear.
- pob_phrase: make fires with the weapons
  simplified_phrase: use the weapons as fuel for their fires
  preserved_meaning: The defeated invaders’ weapons will be burned instead of gathered wood.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: The clearer wording prevents readers from mistaking the weapons for tools used to start fires.
- pob_phrase: They will plunder those who plundered them and loot those who looted them
  simplified_phrase: They will plunder those who plundered them and loot those who looted them
  preserved_meaning: The former victims will take spoil from those who had taken spoil from them.
  reasoning_layer_used: POB lexical decisions for the paired Hebrew cognate constructions
  rationale: The repetition remains because it carries the verse’s forceful reversal and recompense.
interpretive_expansions:
- pob_phrase: make fires with the weapons
  rendering: use the weapons as fuel for their fires
  claim: The weapons themselves will supply fuel for the fires.
  evidence:
  - POB footnote a explicitly explains that the invaders’ weapons are used as fuel.
  - The POB lexical rationale identifies this as the meaning of the Hebrew phrase.
  confidence: high
  alternatives_preserved:
  - make fires with the weapons
  - burn the weapons in fires
