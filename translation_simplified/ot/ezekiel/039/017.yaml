  language: en
  text: 'Son of man, this is what the Lord GOD says: “Tell every kind of bird and every wild animal: ‘Gather together and come. Assemble from every direction to my sacrifice, which I am offering for you—a great sacrifice on the mountains of Israel.[a] You will eat flesh and drink blood.’”'
