translation:
  language: en
  text: 'On that day, I will give Gog a burial place in Israel: the Valley of the Travelers, east of the sea.[a] This valley will block those traveling through. They will bury Gog and his entire multitude there, and they will call it the Valley of Hamon-gog.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “in front of the sea” rather than strictly “east of the sea.”
    reason: lexical_alternative
  - marker: b
    text: Hamon-gog likely means “Gog’s multitude.”
    reason: lexical_alternative
