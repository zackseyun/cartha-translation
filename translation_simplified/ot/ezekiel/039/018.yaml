translation:
  language: en
  text: You will eat the flesh of mighty warriors and drink the blood of rulers from across the earth. In this sacrificial feast, they are pictured as rams, lambs, male goats, and bulls—all of them well-fed animals of Bashan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bashan was famous for rich pasture and well-fed livestock.
    reason: cultural_note
simplification_decisions:
- pob_phrase: You will eat the flesh of mighty men
  simplified_phrase: You will eat the flesh of mighty warriors
  preserved_meaning: The summoned guests will consume the bodies of powerful fighting men.
  reasoning_layer_used: Lexical decisions for בְּשַׂר, גִּבּוֹרִים, and תֹּאכֵלוּ
  rationale: “Mighty warriors” clearly identifies the men while preserving the direct prophetic declaration and stark flesh image.
- pob_phrase: the princes of the earth
  simplified_phrase: rulers from across the earth
  preserved_meaning: The victims include rulers from a broad international sphere.
  reasoning_layer_used: Lexical decision for נְשִׂיאֵי הָאָרֶץ
  rationale: “Rulers” is common English, while “across the earth” retains the phrase’s broad scope.
- pob_phrase: all of them fattened ones of Bashan
  simplified_phrase: all of them well-fed animals of Bashan
  preserved_meaning: All the human victims are portrayed as livestock fattened on Bashan’s rich pasture.
  reasoning_layer_used: Lexical decision for מְרִיאֵי בָשָׁן and POB footnote b
  rationale: The wording explains the opaque phrase while the preceding “pictured as” keeps it clearly metaphorical.
interpretive_expansions:
- pob_phrase: —rams, lambs, male goats, and bulls
  rendering: In this sacrificial feast, they are pictured as rams, lambs, male goats, and bulls
  claim: The animal list portrays the slain warriors and rulers as sacrificial animals rather than introducing literal livestock.
  evidence:
  - The POB theological decision identifies the list as metaphorical apposition for the human victims.
  - POB footnote a calls the animal terms sacrificial imagery for slain rulers and warriors.
  - Ezekiel 39:17–20 presents a sacrificial feast over defeated people and their forces.
  confidence: high
  alternatives_preserved:
  - The literal animal names remain in the main text.
translation_notes:
  risk_flags:
