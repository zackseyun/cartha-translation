translation:
  language: en
  text: I will make my holy name known among my people Israel. I will no longer allow my holy name to be dishonored.[a] The nations will know that I am Yahweh, the Holy One in Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I will no longer profane my holy name.” Here the Hebrew likely means that Yahweh will no longer allow his name to be dishonored.
    reason: alternative_reading
  - marker: b
    text: Or, “that I am Yahweh, holy in Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the midst of my people Israel
  simplified_phrase: among my people Israel
  preserved_meaning: Yahweh will reveal his holy name within Israel's community.
  reasoning_layer_used: lexical decision for בְּתוֹךְ
  rationale: “Among” expresses presence within the community in more natural modern English.
- pob_phrase: let my holy name be profaned
  simplified_phrase: allow my holy name to be dishonored
  preserved_meaning: Yahweh will no longer permit others to treat his revealed reputation and holiness with contempt.
  reasoning_layer_used: lexical and theological decisions for אַחֵל and שֵׁם קָדְשִׁי
  rationale: “Dishonored” makes the contextual sense of profanation immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Dishonored” may not convey every ritual or sacred nuance of “profaned.”
    mitigation: The phrase “holy name” retains the sacred context, and the footnote preserves the more literal wording.
  - risk: The Hebrew can grammatically portray Yahweh as directly profaning his name.
    mitigation: The main text follows POB's contextually preferred permissive sense while the footnote preserves the alternative.
