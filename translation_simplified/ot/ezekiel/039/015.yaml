translation:
  language: en
  text: People will keep traveling through the land. Whenever someone sees a human bone, that person will place a marker beside it until the burial workers bury the bone in the Valley of Hamon-gog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hamon-gog likely means “Gog’s multitude,” but here it is the name of a place.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who pass through the land will pass through
  simplified_phrase: People will keep traveling through the land
  preserved_meaning: People repeatedly travel across the land as part of the search.
  reasoning_layer_used: The lexical rationale identifies the Hebrew repetition as emphatic or iterative.
  rationale: “Keep traveling through” expresses the repeated activity in natural English.
- pob_phrase: when one sees a human bone, he will set up a marker beside it
  simplified_phrase: Whenever someone sees a human bone, that person will place a marker beside it
  preserved_meaning: Any traveler who finds human remains must mark the location.
  reasoning_layer_used: The lexical and theological decisions treat the singular wording and adam as generic.
  rationale: “Whenever someone” clearly states the procedure without implying that only men are involved.
- pob_phrase: until the buriers have buried it
  simplified_phrase: until the burial workers bury the bone
  preserved_meaning: Designated people later bury the discovered bone.
  reasoning_layer_used: The lexical rationale identifies the participle as the people assigned to burial work.
  rationale: “Burial workers” is clearer than the unusual word “buriers,” and repeating “bone” removes an unclear pronoun.
