translation:
  language: en
  text: Then they will know that I am Yahweh their God when I have sent them into exile among the nations and gathered them back onto their own land.[a] I will no longer leave any of them among those nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They will know that I am Yahweh their God by my sending them into exile among the nations and gathering them back onto their own land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when I exiled them among the nations
  simplified_phrase: when I have sent them into exile among the nations
  preserved_meaning: Yahweh caused his people to live in exile among foreign nations.
  reasoning_layer_used: lexical decision for בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  rationale: “Sent them into exile” explains the less familiar verb “exiled” in ordinary English.
- pob_phrase: and then gathered them onto their own land
  simplified_phrase: and gathered them back onto their own land
  preserved_meaning: Yahweh restored the exiles to the land that belonged to them.
  reasoning_layer_used: lexical decisions for וְכִנַּסְתִּים and עַל אַדְמָתָם
  rationale: “Back” makes the restoration movement clear while retaining the image of gathering them onto their land.
- pob_phrase: and I will leave none of them there any longer
  simplified_phrase: I will no longer leave any of them among those nations
  preserved_meaning: No member of the exiled people will remain in the foreign nations.
  reasoning_layer_used: theological decision on the referent of שָׁם
  rationale: A separate sentence and an explicit location remove the unclear word “there.”
