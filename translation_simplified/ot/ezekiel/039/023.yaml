translation:
  language: en
  text: The nations will know that the people of Israel went into exile because of their sin. They were unfaithful to me, so I hid my face from them and handed them over to their enemies. All of them fell by the sword.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The covenant people of Israel are the collective group that went into exile.
  reasoning_layer_used: lexical decision and immediate context
  rationale: This avoids suggesting a literal household while preserving the collective reference.
- pob_phrase: for their iniquity
  simplified_phrase: because of their sin
  preserved_meaning: Israel's morally culpable wrongdoing caused the exile.
  reasoning_layer_used: lexical decision and theological decision
  rationale: The common term “sin” preserves moral blame without splitting one Hebrew noun into two causes.
- pob_phrase: gave them into the hand of their adversaries
  simplified_phrase: handed them over to their enemies
  preserved_meaning: God gave Israel into the power of hostile opponents.
  reasoning_layer_used: lexical decision and theological decision
  rationale: This familiar expression clearly preserves both God's agency and the transfer of power.
interpretive_expansions:
- pob_phrase: the house of Israel
  rendering: the people of Israel
  claim: The expression refers collectively to Israel as a people, not to a household.
  evidence:
