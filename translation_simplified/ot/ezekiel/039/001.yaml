translation:
  language: en
  text: '“Son of man, prophesy against Gog. Say, ‘This is what the Lord Yahweh says: Look! I am against you, Gog, chief prince of Meshech and Tubal.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
