  preserved_meaning: God directly commands Ezekiel to deliver a hostile prophecy against Gog.
  reasoning_layer_used: POB lexical decisions for בֶן אָדָם, הִנָּבֵא, and עַל
  rationale: Two direct commands make the introduction easier to follow without weakening its prophetic force.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The following message comes from the Lord identified by the divine name Yahweh.
  reasoning_layer_used: POB theological decision for אֲדֹנָי יְהוִה
  rationale: Natural modern wording retains the prophetic formula and follows the updated divine-name decision.
- pob_phrase: Behold, I am against you
