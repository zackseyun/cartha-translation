translation:
  language: en
  text: Doom has come to you who live in the land.[a] The time has come, and the day is near—a time of panic, not joyful shouting on the mountains.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The turn has come upon you” or “Your destiny has come.” The Hebrew word is rare and difficult.
    reason: lexical_alternative
  - marker: b
    text: Or “tumult, not an echo on the mountains.” The difficult Hebrew may contrast panic with the joyful shouts normally heard on the mountains, perhaps at harvest.
    reason: lexical_alternative
