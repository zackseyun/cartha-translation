translation:
  language: en
  text: The king will mourn. The prince will wear the horror of devastation like clothing,[a] and the people’s hands will tremble. I will deal with them according to how they have lived, and I will judge them by their own judgments.[b] Then they will know that I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew clothing image may also be expressed, “The prince will clothe himself with desolation” or “will put on horror.”
    reason: lexical_alternative
  - marker: b
    text: This may mean that God will judge them by the standards shown in their own judicial practices.
    reason: alternative_reading
