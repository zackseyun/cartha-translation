translation:
  language: en
  text: Outside there is the sword; inside there are plague and famine. Anyone out in the field will die by the sword. Famine and plague will consume anyone in the city.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The sword is outside, and pestilence and famine are inside.
  simplified_phrase: Outside there is the sword; inside there are plague and famine.
  preserved_meaning: The contrast between dangers outside and inside remains intact, along with the judgment triad.
  reasoning_layer_used: Lexical and theological decisions on judgment triad imagery
  rationale: The reordered clauses make the spatial contrast easier to grasp without weakening the concrete images.
- pob_phrase: pestilence
  simplified_phrase: plague
  preserved_meaning: An epidemic disease serves as an agent of judgment.
  reasoning_layer_used: Lexical decision for הַדֶּבֶר
  rationale: “Plague” is the documented common-English alternative to the less familiar “pestilence.”
- pob_phrase: whoever is in the city, famine and pestilence will consume him
  simplified_phrase: Famine and plague will consume anyone in the city.
  preserved_meaning: Each person in the city faces destruction from famine and plague, which remain personified as consuming agents.
  reasoning_layer_used: Hebrew grammar and lexical decision for יֹאכֲלֶנּוּ
  rationale: Putting the agents first removes the awkward interruption while preserving the singular distributive sense and consuming metaphor.
