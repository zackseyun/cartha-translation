translation:
  language: en
  text: I will not look on you with compassion or show you pity. I will make your own way of life come back on you. Your abominations—your detestable offenses—will remain among you. Then you will know that I am Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: My eye will not spare you, nor will I have pity
  simplified_phrase: I will not look on you with compassion or show you pity
  preserved_meaning: God will neither spare Jerusalem nor respond to her with pity.
  reasoning_layer_used: Lexical decisions for תָחוֹס עֵינִי and אֶחְמֹל
  rationale: This makes the eye idiom natural while preserving its visual sense and doubled refusal of mercy.
- pob_phrase: I will bring your ways upon you
  simplified_phrase: I will make your own way of life come back on you
  preserved_meaning: Jerusalem's manner of life will return upon her in judgment.
  reasoning_layer_used: Theological decision on the recompense formula
  rationale: This explains “ways” while retaining the image of conduct returning upon the one responsible.
- pob_phrase: your abominations will be within you
  simplified_phrase: Your abominations—your detestable offenses—will remain among you
  preserved_meaning: Jerusalem's abhorrent offenses will continue to be present in her midst.
  reasoning_layer_used: Lexical decisions for וְתוֹעֲבוֹתַיִךְ and בְּתוֹכֵךְ תִּהְיֶיןָ
  rationale: The apposition explains the biblical term without limiting it to completed deeds, and “among you” clarifies the location.
interpretive_expansions:
- pob_phrase: your ways
  rendering: your own way of life
  claim: The “ways” are Jerusalem's conduct and manner of life.
  evidence:
  - The lexical rationale identifies “ways” as one's manner of life and actions.
  - The theological rationale describes her own ways as returning upon her.
  confidence: high
  alternatives_preserved:
  - your ways
  - your conduct
  - your behavior
- pob_phrase: your abominations
  rendering: your abominations—your detestable offenses
  claim: The abominations are Jerusalem's abhorrent offenses, often including idolatry.
  evidence:
  - The lexical rationale defines the term as abhorrent, especially idolatrous, offenses.
  confidence: high
  alternatives_preserved:
  - your abominations
  - your detestable deeds
  - your abhorrent acts
translation_notes:
  risk_flags:
  - risk: “Come back on you” makes the recompense image more explicit than the Hebrew verb alone.
    mitigation: The POB theological rationale identifies the formula as one's own ways returning upon oneself.
  - risk: “Remain among you” selects a natural locative sense for the terse Hebrew phrase.
    mitigation: The POB lists “in your midst” and “remain in you” as supported alternatives.
