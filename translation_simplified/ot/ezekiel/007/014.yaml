translation:
  language: en
  text: They have sounded the trumpet and completed all the preparations. Yet no one goes into battle, because my burning anger is against all her people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “all her wealth” or “all her abundance”; “her” may refer to the city or the land.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They have blown the trumpet and made everything ready
  simplified_phrase: They have sounded the trumpet and completed all the preparations
  preserved_meaning: The military signal has been given and every preparation has been made.
  reasoning_layer_used: POB lexical decisions for תָּקְעוּ and וְהָכִין הַכֹּל
  rationale: “Sounded” and “completed all the preparations” state the military scene in direct modern English.
- pob_phrase: but no one goes to battle
  simplified_phrase: Yet no one goes into battle
  preserved_meaning: Despite full preparation, nobody proceeds to fight.
  reasoning_layer_used: POB lexical decisions for וְאֵין הֹלֵךְ and לַמִּלְחָמָה
  rationale: “Yet” sharpens the contrast, while “goes into battle” is natural English.
- pob_phrase: my wrath is against all her multitude
  simplified_phrase: my burning anger is against all her people
  preserved_meaning: God’s fierce anger is directed against the whole population in view.
  reasoning_layer_used: POB lexical decisions for חֲרוֹנִי and הֲמוֹנָהּ, with the theological ambiguity note
  rationale: “Burning anger” clarifies wrath, and “people” expresses the chosen population sense without naming her referent.
