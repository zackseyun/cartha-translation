translation:
  language: en
  text: Disaster will follow disaster, and rumor after rumor[a] will spread. They will seek a vision from a prophet, but the priest’s instruction[b] will disappear, and so will the elders’ counsel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “report after report.” The Hebrew can refer to rumors or reports; here it likely means alarming news spreading among the people.
    reason: lexical_alternative
  - marker: b
    text: Or “law” or “teaching.” Here the Hebrew likely means instruction given by priests.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Disaster upon disaster will come
  simplified_phrase: Disaster will follow disaster
  preserved_meaning: One calamity comes after another in a mounting series.
  reasoning_layer_used: The lexical decisions identify a piling-up sense while retaining “disaster” as the judgment term.
  rationale: The new order is easier to read while preserving the repeated-disaster image.
- pob_phrase: rumor upon rumor will arise
  simplified_phrase: rumor after rumor will spread
  preserved_meaning: Repeated alarming reports circulate among the people.
  reasoning_layer_used: The lexical rationale favors “rumor” in a setting of panic and describes reports spreading from one person to another.
  rationale: “Will spread” makes the social movement of the rumors clear in natural English.
- pob_phrase: instruction will perish from the priest, and counsel from the elders
  simplified_phrase: the priest’s instruction will disappear, and so will the elders’ counsel
  preserved_meaning: The established sources of priestly teaching and elder guidance will fail.
  reasoning_layer_used: The theological decisions preserve the institutional leadership triad and the priestly sense of torah.
  rationale: Possessive phrases and an explicit repeated verb make the parallel loss easier to follow.
translation_notes:
  risk_flags:
  - risk: “Follow” may sound merely sequential rather than like disasters piling up.
    mitigation: Repeating “disaster” preserves the force of one calamity coming upon another.
  - risk: “Instruction” may be mistaken for general advice rather than priestly teaching.
    mitigation: The main text links it to the priest, and footnote [b] preserves the lexical range.
