translation:
  language: en
  text: Those who survive will escape and be in the mountains. There they will be like doves in the valleys,[a] all of them moaning, each one in their own guilt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ravines”; the Hebrew word can refer to valleys or steep streambeds.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can refer to a person’s wrongdoing, guilt, or the punishment that results from it.
    reason: alternative_reading
