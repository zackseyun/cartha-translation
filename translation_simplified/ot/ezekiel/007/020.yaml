translation:
  language: en
  text: They turned his beautiful ornament into a source of pride. In it[a] they made images of their abhorrent things, their detestable things. Therefore, I made it an unclean thing for them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They used it to make.” The Hebrew may refer either to where the images were made or to what they were made from.
    reason: lexical_alternative
  - marker: b
    text: “An unclean thing” carries the biblical sense of ritual and moral impurity; the Hebrew may also suggest something rejected.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: made the beauty of his ornament into pride
  simplified_phrase: turned his beautiful ornament into a source of pride
  preserved_meaning: They misused something beautiful and valuable for arrogant display.
  reasoning_layer_used: Lexical decisions for צְבִי, עֶדְיוֹ, לְגָאוֹן, and שָׂמָהוּ
  rationale: The recast phrase preserves the ornament’s beauty, its misuse, and the resulting pride.
- pob_phrase: the images of their abominations, their detestable things
  simplified_phrase: images of their abhorrent things, their detestable things
  preserved_meaning: Both distinct descriptions condemn what the images represented without identifying them more narrowly.
  reasoning_layer_used: Lexical decisions for וְצַלְמֵי תוֹעֲבֹתָם and שִׁקּוּצֵיהֶם
  rationale: Common wording replaces “abominations” while preserving the paired descriptions.
- pob_phrase: I have made it an unclean thing to them
  simplified_phrase: I made it an unclean thing for them
  preserved_meaning: God rendered the ornament ritually and morally impure to them as judgment.
  reasoning_layer_used: Lexical and theological decisions for נְתַתִּיו לָהֶם לְנִדָּה
  rationale: The predicate noun retains the declared change of status while simplifying the tense and syntax.
translation_notes:
  risk_flags:
