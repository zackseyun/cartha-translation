translation:
  language: en
  text: For a seller will not regain what he sold, even if the buyer and seller are both still alive. The vision about the whole population[a] will not be reversed, and no one will make his life secure through his own wrongdoing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against the whole population.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew of this clause is difficult; it may also be rendered, “No one whose life is in his iniquity will strengthen himself.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the seller will not return to what was sold
  simplified_phrase: a seller will not regain what he sold
  preserved_meaning: The seller will not recover the property or possession that was sold.
  reasoning_layer_used: lexical decisions and footnote a
  rationale: “Regain” states the intended commercial sense more naturally than “return to.”
- pob_phrase: the vision concerning all its multitude will not turn back
  simplified_phrase: the vision about the whole population will not be reversed
  preserved_meaning: The announced judgment on the entire population will not be withdrawn.
  reasoning_layer_used: lexical decisions and footnotes c–d
  rationale: “Population” and “reversed” make the prophetic statement clear without resolving the preposition’s ambiguity.
- pob_phrase: no one will strengthen his life in his iniquity
  simplified_phrase: no one will make his life secure through his own wrongdoing
  preserved_meaning: No person can preserve his life by sinful means.
  reasoning_layer_used: theological decision and footnote e
  rationale: The wording expresses the clause’s likely sense while retaining its connection between life, security, and sin.
interpretive_expansions:
- pob_phrase: though they are still alive
  rendering: even if the buyer and seller are both still alive
  claim: The plural refers to both parties in the sale remaining alive.
  evidence:
  - POB footnote b identifies the parties as those involved in the sale.
  - The immediate commercial context names the seller and what was sold.
  confidence: high
