  preserved_meaning: Their precious metals cannot protect them from divine judgment.
  reasoning_layer_used: lexical decision for לֹא יוּכַל לְהַצִּילָם
  rationale: “Rescue” expresses the prophetic sense in more familiar English without implying eternal salvation.
- pob_phrase: They will not satisfy their appetite, nor fill their stomachs
  simplified_phrase: Their wealth will not satisfy their hunger or fill their stomachs
  preserved_meaning: Silver and gold cannot provide the food they need.
  reasoning_layer_used: lexical decisions for נַפְשָׁם and the clause subjects
  rationale: “Hunger” makes the physical sense of “appetite” immediately clear while retaining the bodily parallel.
- pob_phrase: the stumbling block of their iniquity
  simplified_phrase: a stumbling block that led them into sin
  preserved_meaning: Their wealth became an occasion for sin and downfall.
  reasoning_layer_used: lexical decisions for מִכְשׁוֹל and עֲוֺנָם
  rationale: The clause explains the biblical stumbling image in ordinary sentence form.
