translation:
  language: en
  text: They will throw their silver into the streets, and their gold will become something unclean.[a] Their silver and gold will not be able to rescue them on the day of Yahweh’s wrath. Their wealth will not satisfy their hunger or fill their stomachs, because it became a stumbling block that led them into sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “their gold will be for impurity.” The Hebrew word can refer to menstrual uncleanness and pictures the gold as ritually repulsive.
    reason: lexical_alternative
