translation:
  language: en
  text: The time has come; the day is here. The buyer must not celebrate, and the seller must not grieve, because wrath is against all her people.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all her wealth.”
    reason: lexical_alternative
  - marker: b
    text: “Her” personifies the city, land, or community under judgment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the day has arrived
  simplified_phrase: the day is here
  preserved_meaning: The decisive day has already arrived.
  reasoning_layer_used: Lexical decision for הִגִּיעַ and immediate judgment context.
  rationale: The simpler idiom keeps the announcement immediate and emphatic.
- pob_phrase: Let not the buyer rejoice, and let not the seller mourn
  simplified_phrase: The buyer must not celebrate, and the seller must not grieve
  preserved_meaning: Neither party should respond to the transaction as they normally would.
  reasoning_layer_used: Lexical decisions for the prohibitions and paired commercial roles.
  rationale: Direct modern prohibitions replace the formal jussive wording without weakening it.
- pob_phrase: all her multitude
  simplified_phrase: all her people
  preserved_meaning: Wrath is directed against the whole population represented as feminine.
  reasoning_layer_used: Lexical and theological decisions for הֲמוֹנָהּ.
  rationale: “People” makes the collective sense clear while “her” preserves the personification.
translation_notes:
  risk_flags:
  - risk: “People” may obscure the lexical alternative “wealth.”
    mitigation: Footnote a preserves that documented alternative.
  - risk: The antecedent of “her” remains unstated and may seem unclear.
    mitigation: Footnote b explains the personification without resolving it more narrowly than POB.
