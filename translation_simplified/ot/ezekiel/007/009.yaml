translation:
  language: en
  text: I will not look on you with mercy or show you pity. I will bring your own conduct back upon you. Your abominations—your detestable things—will be among you. Then you will know that I am Yahweh, who strikes.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: My eye will not spare, nor will I show pity
  simplified_phrase: I will not look on you with mercy or show you pity
  preserved_meaning: Yahweh will neither spare them from judgment nor treat them compassionately.
  reasoning_layer_used: Lexical decisions for תָחוֹס עֵינִי and אֶחְמוֹל
  rationale: “Look on you with mercy” makes the eye idiom clear while keeping pity as a distinct parallel idea.
- pob_phrase: I will bring your ways upon you
  simplified_phrase: I will bring your own conduct back upon you
  preserved_meaning: Their behavior will come back on them as judgment.
  reasoning_layer_used: Lexical decision for כִּדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  rationale: “Conduct” explains “ways,” while “back upon you” preserves the retributive image.
- pob_phrase: your abominations will be in your midst
  simplified_phrase: Your abominations—your detestable things—will be among you
  preserved_meaning: Their abhorrent things or deeds will be present within their community.
  reasoning_layer_used: Lexical decisions for וְתוֹעֲבוֹתַיִךְ and בְּתוֹכֵךְ תִּהְיֶיןָ
  rationale: The apposition explains “abominations” without limiting them to practices, and “among you” keeps the spatial sense.
interpretive_expansions:
- pob_phrase: your abominations
  rendering: your abominations—your detestable things
  claim: “Abominations” refers broadly to things or deeds regarded as abhorrent.
  evidence:
  - The POB lexical decision gives “detestable things” as an alternative and describes practices as a frequent, not exclusive, referent.
  confidence: high
  alternatives_preserved:
  - abhorrent practices
  - idolatrous objects
translation_notes:
  risk_flags:
  - risk: “Detestable things” may sound less covenantally weighty than “abominations.”
    mitigation: The main biblical term “abominations” is retained before the explanation.
  - risk: “Who strikes” may be heard as physical violence alone.
    mitigation: The preceding sentence frames the striking as judgment brought in response to their conduct.
