simplification_decisions:
- pob_phrase: two leaves each
  simplified_phrase: each had two panels
  preserved_meaning: Each of the two doors consisted of two movable sections.
  reasoning_layer_used: Lexical decision for דְּלָתוֹת / דֶּלֶת
  rationale: “Panels” makes the architectural meaning of “leaves” immediately clear.
- pob_phrase: two turning leaves
  simplified_phrase: two panels that turned
  preserved_meaning: The door sections turned, though their exact mechanism remains uncertain.
  reasoning_layer_used: Lexical decision for מוּסַבּוֹת and POB footnote
  rationale: The clause states the turning directly without choosing between pivoting and folding.
- pob_phrase: two leaves for the one door and two leaves for the other
  simplified_phrase: two panels for one door and two for the other
  preserved_meaning: The paired construction and distributive count remain explicit.
  reasoning_layer_used: Lexical decisions for the repeated numerals and לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  rationale: The repeated count preserves the measured architectural style in natural English.
translation_notes:
