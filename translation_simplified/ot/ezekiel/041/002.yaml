translation:
  language: en
  text: The entrance was ten cubits wide.[a] On each side of the entrance was a five-cubit section of wall.[b] Then he measured the room. It was forty cubits long and twenty cubits wide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was an ancient unit of length based on the distance from the elbow to the fingertips; its exact length could vary.
    reason: cultural_note
  - marker: b
    text: Hebrew “shoulder”; here it means a section of wall beside the entrance.
    reason: lexical_alternative
