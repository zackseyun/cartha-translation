translation:
  language: en
  text: The side chambers were stacked in rows, in an arrangement described as “three and thirty.”[a] They were set into the surrounding wall structure to support them, but they were not supported by the main temple wall itself.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is uncertain. It may mean thirty-three chambers or placements, or three levels with thirty chambers on each level.
    reason: lexical_alternative
  - marker: b
    text: “Supported” may also be translated “fastened” or “held securely.”
    reason: lexical_alternative
