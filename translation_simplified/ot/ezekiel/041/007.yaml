translation:
  language: en
  text: The side chambers became wider as they continued around the temple at higher and higher levels. This was because the temple’s surrounding structure rose higher and higher all the way around it.[a] So the temple became wider toward the top. The route from the lowest story to the highest passed through the middle story.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew description of this surrounding structure is difficult and may refer to a ledge, gallery, or offset in the wall.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: went around upward and upward
  simplified_phrase: continued around the temple at higher and higher levels
  preserved_meaning: The side chambers encircled the temple while progressively rising.
  reasoning_layer_used: lexical decision for וְנָסְבָה and לְמַעְלָה לְמַעְלָה
  rationale: The rewrite keeps both the circling movement and repeated upward progression in natural English.
- pob_phrase: the structure of the temple went around upward and upward all around the temple
  simplified_phrase: the temple’s surrounding structure rose higher and higher all the way around it
  preserved_meaning: An encircling construction rose around the temple and explains the widening above.
  reasoning_layer_used: lexical decision for כִּי מוּסַב הַבַּיִת and סָבִיב סָבִיב לַבַּיִת
  rationale: The wording stays architecturally general while making the surrounding and rising arrangement clear.
- pob_phrase: one went up from the lowest story to the highest by way of the middle story
  simplified_phrase: The route from the lowest story to the highest passed through the middle story
  preserved_meaning: Movement between the lower and upper levels went through the middle level.
  reasoning_layer_used: lexical decision for the compressed final clause
  rationale: Expressing the clause as a route avoids an unspecified subject and clarifies the three-level ascent.
