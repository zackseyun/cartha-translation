  rationale: “Main hall” communicates the architectural location more clearly than the specialized term “nave.”
- pob_phrase: the jambs
  simplified_phrase: the upright supports on each side of the entrance
  preserved_meaning: The measured features are structural side elements of the entrance rather than freestanding pillars.
  reasoning_layer_used: POB lexical decision for אֵילִים
  rationale: The descriptive phrase makes the architectural feature understandable without losing its location or function.
- pob_phrase: six cubits wide on one side and six cubits wide on the other side
