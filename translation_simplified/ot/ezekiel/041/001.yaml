translation:
  language: en
  text: Then he brought me into the temple’s main hall.[a] He measured the upright supports on each side of the entrance. Each support was six cubits wide[c]—the width of the tent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to the temple building’s principal room, not the whole temple complex; it may also be translated “nave” or “sanctuary.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “tent”; in this temple vision, it may be an architectural term or may be rendered “tabernacle.”
    reason: lexical_alternative
  - marker: c
    text: A cubit was an ancient unit of length based on the distance from the elbow to the fingertips.
    reason: cultural_note
