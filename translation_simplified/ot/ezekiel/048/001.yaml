translation:
  language: en
  text: 'These are the names of the tribes: Dan will receive one portion at the far north. Its boundary will run beside the road of Hethlon to Lebo-hamath,[a] by Hazar-enan, and along the northern border of Damascus beside Hamath. Dan’s portion will extend from the east side to the sea.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lebo-hamath is traditionally understood as a place-name; the Hebrew literally means “the entrance of Hamath.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew clause is compressed and may also be translated, “It will have its side from east to sea.”
    reason: alternative_reading
