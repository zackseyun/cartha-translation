simplification_decisions:
- pob_phrase: the land that you shall assign as an inheritance to the tribes of Israel
  simplified_phrase: the land you must divide among the tribes of Israel as their inheritance
  preserved_meaning: The land is to be distributed to Israel’s tribes as their inherited possession.
  reasoning_layer_used: The lexical decisions for תַּפִּילוּ and מִנַּחֲלָה establish assignment by tribal inheritance.
  rationale: “Divide among” makes the distribution of the land immediately clear.
- pob_phrase: these are their portions
  simplified_phrase: These are their shares
  preserved_meaning: The identified allotments are the tribes’ assigned shares of land.
  reasoning_layer_used: The source syntax and lexical decision for מַחְלְקוֹתָם support a present identification of tribal shares.
  rationale: “Shares” is common English, while “are” preserves the identifying statement.
- pob_phrase: the Lord GOD
  simplified_phrase: the Lord Yahweh
  preserved_meaning: The compound title retains both the divine title and God’s covenant name.
  reasoning_layer_used: The theological decision requires יְהוָה to be rendered “Yahweh.”
  rationale: “Lord Yahweh” follows the updated divine-name policy.
translation_notes:
  risk_flags:
  - risk: “Divide” could suggest only physically separating the land rather than formally assigning it.
    mitigation: “Among the tribes,” “inheritance,” and “shares” preserve the formal allotment sense.
