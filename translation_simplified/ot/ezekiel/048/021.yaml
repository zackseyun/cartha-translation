translation:
  language: en
  text: The remaining land on both sides of the holy land contribution and the city’s property will belong to the prince. To the east, his land will extend alongside the contribution’s twenty-five thousand[a] as far as the eastern border. To the west, it will extend alongside the same twenty-five thousand as far as the western border. The prince’s land will run parallel to the other portions. The holy contribution will lie between these areas, with the temple sanctuary in its middle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “twenty-five thousand” without naming the unit; the unit is understood from the surrounding land measurements.
    reason: cultural_note
