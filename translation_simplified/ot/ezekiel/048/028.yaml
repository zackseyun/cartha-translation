translation:
  language: en
  text: Along the south side of Gad’s territory, the southern border will run from Tamar to the waters of Meribath-kadesh,[a] then to the Wadi of Egypt,[b] and on to the Great Sea—the Mediterranean Sea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This place name is also commonly written “Meribah-kadesh.”
    reason: lexical_alternative
  - marker: b
    text: A wadi is a watercourse that may be dry except during rainy seasons; it is also traditionally called “the brook of Egypt.”
    reason: cultural_note
