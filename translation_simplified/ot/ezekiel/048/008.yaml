translation:
  language: en
  text: Along Judah’s border, stretching from east to west, will be the special district[a] that you must set apart. It will measure 25,000 units[b] across and will be as long as one of the tribes’ allotted portions, stretching from east to west. The sanctuary will be in the middle of this district.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean “contribution” or “offering”; here it refers to a district specially set apart for holy use.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not repeat the unit of measurement in this verse.
    reason: source_note
