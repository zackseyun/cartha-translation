translation:
  language: en
  text: For the day is close at hand—yes, the day of Yahweh[a] is close. It will be a cloudy day. It will be a time concerning the nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The day of Yahweh” is a prophetic expression for a time when Yahweh intervenes in judgment.
    reason: cross_reference
  - marker: b
    text: The Hebrew is terse and may also be translated “a time for the nations” or “the time of the nations.”
    reason: alternative_reading
