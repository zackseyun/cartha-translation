  text: In Tahpanhes, the day will grow dark when I break the bars of Egypt’s power there. The pride she takes in her strength will come to an end in her. She herself will be covered by a cloud, and her daughter towns will go into captivity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “She” may refer to Tahpanhes or, more broadly, to Egypt pictured as a woman; “daughter towns” are dependent towns or nearby settlements.
    reason: cultural_note
