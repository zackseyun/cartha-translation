  preserved_meaning: God will directly cause Pathros to become devastated.
  reasoning_layer_used: Lexical decision for וַהֲשִׁמֹּתִי and the direct-action theological decision.
  rationale: This concrete wording preserves the coming destructive action.
- pob_phrase: I will set fire in Zoan
  simplified_phrase: set Zoan on fire
