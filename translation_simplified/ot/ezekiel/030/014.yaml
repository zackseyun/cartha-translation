  reasoning_layer_used: Lexical decisions for וְנָתַתִּי אֵשׁ and בְּצֹעַן.
  rationale: This is ordinary English for causing a place to burn.
- pob_phrase: execute judgments on No
  simplified_phrase: carry out judgment against No
  preserved_meaning: God will directly impose judicial punishment on the city.
  reasoning_layer_used: Lexical decisions for וְעָשִׂיתִי שְׁפָטִים and בְּנֹא.
  rationale: This natural phrasing retains the judicial and punitive force.
