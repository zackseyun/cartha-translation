translation:
  language: en
  text: On that day, messengers[a] will set out from my presence in ships. They will terrify Cush[b], even though its people feel safe. Its people will tremble when Egypt’s day of judgment comes. Look, it is coming!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “envoys.” The Hebrew can also mean “angels,” but here it most likely refers to human messengers carrying news of Egypt’s fall.
    reason: lexical_alternative
  - marker: b
    text: Or “Ethiopia.” The Hebrew place-name is Cush.
    reason: alternative_reading
