translation:
  language: en
  text: A sword will strike Egypt. There will be anguish[b] in Cush[a] when people fall dead in Egypt and Egypt’s wealth[c] is carried away. Its foundations will be torn down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cush was the region south of Egypt, broadly corresponding to ancient Nubia rather than modern Ethiopia.
    reason: cultural_note
  - marker: b
    text: Or “there will be trembling in Cush.” The Hebrew can express shaking, writhing, or anguish during disaster.
    reason: lexical_alternative
  - marker: c
    text: Or “multitude” or “abundance.” Here the Hebrew refers to riches carried off in conquest.
    reason: lexical_alternative
