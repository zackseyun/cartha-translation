translation:
  language: en
  text: 'Therefore, this is what the Lord GOD says: “I myself am against Pharaoh, king of Egypt. I will break both his arms—the strong arm and the broken arm—and make the sword fall from his hand.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore thus says the Lord GOD
  simplified_phrase: Therefore, this is what the Lord GOD says
  preserved_meaning: This remains the standard prophetic announcement and follows from the preceding judgment.
  reasoning_layer_used: POB lexical decision for לָכֵן and כֹּה אָמַר
  rationale: The familiar English formula is clearer than the inverted phrase “thus says.”
- pob_phrase: Behold, I am against
  simplified_phrase: I myself am against
  preserved_meaning: God emphatically declares his personal opposition to Pharaoh.
  reasoning_layer_used: POB lexical decision for הִנְנִי אֶל
  rationale: “I myself” preserves the solemn emphasis without the less familiar “Behold.”
- pob_phrase: his arms, both the strong one and the broken one
  simplified_phrase: both his arms—the strong arm and the broken arm
  preserved_meaning: God will break both arms while preserving the concrete image of Pharaoh’s power and defeat.
  reasoning_layer_used: POB lexical decision and footnote for זְרֹעֹתָיו and the feminine singular descriptors
  rationale: Repeating “arm” makes each descriptor immediately understandable.
translation_notes:
  risk_flags:
  - risk: Modern readers may take Pharaoh’s arms only as literal body parts.
    mitigation: The concrete arm-and-sword image is retained because it carries the intended picture of lost military power.
