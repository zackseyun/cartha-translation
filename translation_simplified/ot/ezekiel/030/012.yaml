translation:
  language: en
  text: I will dry up the channels of the Nile.[a] I will sell the land[b] into the power of evil men. I will use foreigners to devastate the land and everything in it. I am Yahweh; I have spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean the Nile’s canals or waterways.
    reason: lexical_alternative
  - marker: b
    text: Here “sell” is a judgment image meaning to hand the land over to hostile power.
    reason: lexical_alternative
