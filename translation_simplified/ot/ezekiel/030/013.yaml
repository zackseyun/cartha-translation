  preserved_meaning: God formally introduces his own declaration.
  reasoning_layer_used: POB translation and divine-title decision
  rationale: The common English formula keeps the solemn introduction and chosen divine title.
- pob_phrase: put an end to the images from Noph
  simplified_phrase: put an end to the images in Noph
  preserved_meaning: God will eliminate the cult images located in that city.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Using “in” clearly identifies Noph as the location of the images.
- pob_phrase: there will no longer be a prince from the land of Egypt
  simplified_phrase: Egypt will no longer have a ruler of its own
  preserved_meaning: Native Egyptian rule will cease.
  reasoning_layer_used: POB lexical rationale for נָשִׂיא and grounding review
  rationale: “Ruler” avoids the modern royal-son sense, while “of its own” preserves Egyptian origin.
