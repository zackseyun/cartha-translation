translation:
  language: en
  text: Together with them, Cush, Put, Lud, all the mixed people, Cub, and the sons from the land of the covenant will fall by the sword.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All the mixed people” may instead mean “all Arabia,” “all the mercenaries,” or “all the mixed multitude.”
    reason: lexical_alternative
  - marker: b
    text: Cub is an uncertain place-name and may also be spelled Kub.
    reason: lexical_alternative
  - marker: c
    text: This may mean “the people of the land of the covenant,” perhaps treaty allies or Judeans living in Egypt.
    reason: alternative_reading
