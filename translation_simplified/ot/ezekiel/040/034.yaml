translation:
  language: en
  text: Its entrance porch faced the outer courtyard. Palm trees[a] were on the doorposts on both sides, and eight steps led up to the porch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “palm trees”; these were probably carved palm-tree decorations.
    reason: lexical_alternative
