translation:
  language: en
  text: The distance from the front of the outer gateway[a] to the front of the entrance hall at the inner gate was fifty cubits—about 88 feet (27 meters).[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term translated “outer” is unusual and difficult here; the surrounding measurements support this meaning.
    reason: textual_variant
  - marker: b
    text: Ezekiel 40:5 uses a long cubit—a standard cubit plus a handbreadth—so fifty cubits is about 88 feet (27 meters).
    reason: cultural_note
