translation:
  language: en
  text: Then he measured the gate’s entrance hall. It measured about 12 feet (3.7 meters),[a] and its side pillars measured about 3 feet (0.9 meters).[b] The entrance hall was toward the temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “eight cubits.”
    reason: source_note
  - marker: b
    text: Hebrew “two cubits.” The architectural term translated “side pillars” may also mean jambs, pilasters, or posts.
    reason: lexical_alternative
