translation:
  language: en
  text: Outside the inner gate, in the inner court, were rooms for the singers. The rooms beside the north gate faced south. One was beside the east gate, facing north.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew description is compressed; the singer-rooms appear to have been near the north and east gates, facing in opposite directions.
    reason: alternative_reading
