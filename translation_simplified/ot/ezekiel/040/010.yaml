translation:
  language: en
  text: The east-facing gate had three guardrooms on one side and three on the other.[a] Each set of three rooms had the same measurements. The side pillars on both sides also had the same measurements.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “side rooms”; these were small rooms built into the gate structure.
    reason: lexical_alternative
  - marker: b
    text: The exact architectural term is uncertain; “jambs” or “pilasters” are also possible.
    reason: lexical_alternative
