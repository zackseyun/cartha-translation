translation:
  language: en
  text: Then he measured the gate’s entrance. It was about 17½ feet (5.3 meters) wide, and the gate itself was about 22¾ feet (6.9 meters) long.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew measurements are ten cubits wide and thirteen cubits long. These approximate conversions use the longer cubit specified for this vision in Ezekiel 40:5.
    reason: cultural_note
  - marker: b
    text: The Hebrew word for “gate” can also mean the whole gateway structure. The second measurement is literally “the length of the gate,” though some translations interpret it as the gateway’s depth or span.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'the width of the entrance of the gate: ten cubits'
  simplified_phrase: the gate’s entrance. It was about 17½ feet (5.3 meters) wide
  preserved_meaning: The entrance measured ten of the longer cubits specified in the vision.
  reasoning_layer_used: POB lexical decisions and the measurement standard in Ezekiel 40:5
  rationale: Splitting the sentence and converting the vision’s long cubits makes the width immediately understandable.
- pob_phrase: 'the length of the gate: thirteen cubits'
  simplified_phrase: the gate itself was about 22¾ feet (6.9 meters) long
  preserved_meaning: The gate structure’s stated length was thirteen cubits.
  reasoning_layer_used: POB lexical decisions for אֹרֶךְ and הַשַּׁעַר, with Ezekiel 40:5
  rationale: Modern units clarify the dimension while “long” preserves the POB choice rather than interpreting it as depth.
translation_notes:
  risk_flags:
  - risk: The precise modern value of the long cubit remains uncertain.
    mitigation: The text says “about,” and footnote a preserves the Hebrew measurements and contextual standard.
  - risk: Readers may take “gate” to mean only a door rather than the larger structure.
    mitigation: “Gate itself” distinguishes it from the entrance, and footnote b preserves the gateway alternative.
