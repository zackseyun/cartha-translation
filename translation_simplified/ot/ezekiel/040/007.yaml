translation:
  language: en
  text: Each guardroom was one measuring reed long and one measuring reed wide.[a] The space between the guardrooms was five cubits.[b] On the inner side of the gate, the threshold beside the entrance porch measured one reed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew architectural term may also mean “side room” or “chamber.”
    reason: lexical_alternative
  - marker: b
    text: Reeds and cubits were ancient units of length; a cubit was based on the length of a forearm.
    reason: cultural_note
