  rationale: The wording explains “allotted portion” without narrowing it to food or land.
- pob_phrase: gave you over to the desire of those who hate you
  simplified_phrase: handed you over to the will of those who hate you
  preserved_meaning: God subjected Jerusalem to her enemies’ hostile intent.
  reasoning_layer_used: Lexical decisions for וָאֶתְּנֵךְ and בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
