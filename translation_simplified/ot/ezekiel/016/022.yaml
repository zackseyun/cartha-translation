simplification_decisions:
- pob_phrase: in all your abominations
  simplified_phrase: as you committed all your detestable acts
  preserved_meaning: Jerusalem committed acts that were morally and religiously abhorrent.
  reasoning_layer_used: Lexical decision and opening-syntax rationale
  rationale: The supported alternative “detestable acts” is clearer, while “as you committed” naturally expresses the attendant circumstance.
- pob_phrase: your prostitutions
  simplified_phrase: acts of prostitution
  preserved_meaning: The concrete sexual metaphor for repeated covenant unfaithfulness remains intact.
  reasoning_layer_used: Lexical and theological decisions
  rationale: Adding “acts of” makes the plural accusation natural without replacing the prophetic image.
- pob_phrase: naked and bare
  simplified_phrase: naked and exposed
  preserved_meaning: The paired terms emphasize complete vulnerability.
  reasoning_layer_used: Lexical decision
  rationale: “Exposed” communicates the force of “bare” more directly to modern readers.
