translation:
  language: en
  text: So I will let my wrath against you run its course, and my jealousy[a] will turn away from you. Then I will be calm and no longer angry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “zeal.” Here “jealousy” fits the chapter’s picture of a broken marriage covenant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: satisfy my wrath against you
  simplified_phrase: let my wrath against you run its course
  preserved_meaning: God’s wrath will be fully spent and come to rest after judgment.
  reasoning_layer_used: Lexical decision for וַהֲנִחֹתִי and חֲמָתִי
  rationale: The common idiom makes the settling of wrath clear without weakening its judicial force.
- pob_phrase: my jealousy will turn away from you
  simplified_phrase: my jealousy will turn away from you
  preserved_meaning: God’s covenant jealousy will cease to focus on the unfaithful people.
  reasoning_layer_used: Lexical and theological decisions for קִנְאָתִי
  rationale: The wording stays because it preserves the chapter’s marital-covenant image.
- pob_phrase: I will be quiet
  simplified_phrase: I will be calm
  preserved_meaning: God will be at rest after his wrath and jealousy have subsided.
  reasoning_layer_used: Lexical decision for וְשָׁקַטְתִּי
  rationale: “Calm” expresses the intended rest more naturally than “quiet” in modern English.
translation_notes:
  risk_flags:
  - risk: “Run its course” could sound as though wrath is an impersonal process.
    mitigation: Keeping “my wrath against you” preserves God’s active covenant-judicial response.
