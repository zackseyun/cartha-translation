translation:
  language: en
  text: You did not remember the days of your youth. Instead, you enraged me by doing all these things. Therefore, I have brought the consequences of your conduct down on your own head, declares the Lord Yahweh. And you have not committed sexual depravity beyond all your other detestable acts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew clause is difficult. It may instead mean, “and you did not commit this sexual depravity in addition to all your detestable acts.” Others understand it to say that this sexual depravity was committed along with, or on top of, all your detestable acts.
    reason: alternative_reading
