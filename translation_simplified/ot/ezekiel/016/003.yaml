translation:
  language: en
  text: 'Say, “This is what the Lord GOD says to Jerusalem: Your origin and birth came from Canaanite land. Your father was an Amorite, and your mother was a Hittite.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says the Lord GOD to Jerusalem
  simplified_phrase: This is what the Lord GOD says to Jerusalem
  preserved_meaning: This still introduces God’s prophetic message to Jerusalem.
  reasoning_layer_used: Lexical decision for וְאָמַרְתָּ ... כֹּה אָמַר
  rationale: The common English formula is clearer while retaining the prophetic announcement.
- pob_phrase: Your origin and your birth are from the land of the Canaanite
  simplified_phrase: Your origin and birth came from Canaanite land
  preserved_meaning: Jerusalem’s figurative beginnings derive from the Canaanite people and land.
  reasoning_layer_used: Lexical decisions for מְכֹרֹתַיִךְ, מוֹלְדֹתַיִךְ, and מֵאֶרֶץ הַכְּנַעֲנִי
  rationale: “Came from” preserves provenance, while “Canaanite land” keeps the ethnic emphasis in natural English.
- pob_phrase: your mother a Hittite
  simplified_phrase: your mother was a Hittite
  preserved_meaning: The figurative genealogy identifies Jerusalem’s mother as Hittite.
  reasoning_layer_used: Lexical decision for וְאִמֵּךְ חִתִּית
  rationale: Supplying the implied verb makes the parallel statement immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake the parental language for literal genealogy.
    mitigation: The text preserves the deliberate metaphor without adding an explanation not stated in the verse.
