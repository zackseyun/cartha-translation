translation:
  language: en
  text: Then you will remember your ways—how you lived—and be ashamed when you receive your sisters, both those older and those younger than you. I will give them to you as daughters, but not because of your covenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This gift will not come from any claim or merit based on Jerusalem’s own covenant.
    reason: simplification_note
simplification_decisions:
- pob_phrase: remember your ways
  simplified_phrase: remember your ways—how you lived
  preserved_meaning: The image of one’s ways remains while its reference to conduct is clarified.
  reasoning_layer_used: lexical decision for דְּרָכַיִךְ
  rationale: The brief explanation makes the prophetic image immediately understandable.
- pob_phrase: those older than you along with those younger than you
  simplified_phrase: both those older and those younger than you
  preserved_meaning: Jerusalem receives both groups of sisters within the family allegory.
  reasoning_layer_used: lexical decision for הַגְּדֹלוֹת...הַקְּטַנּוֹת
  rationale: The paired construction is shorter and more natural in modern English.
- pob_phrase: and I will give them to you as daughters
  simplified_phrase: I will give them to you as daughters
  preserved_meaning: God incorporates the sisters under Jerusalem through the daughter metaphor.
  reasoning_layer_used: lexical decision for וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  rationale: A new sentence eases the syntax without weakening the preceding temporal link.
