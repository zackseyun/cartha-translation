translation:
  language: en
  text: Sodom, your sister, and her daughters will return to what they were before. Samaria and her daughters will also return to what they were before. And you and your daughters will return to what you were before.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughters” refers to the towns or communities connected with each city.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And your sisters, Sodom and her daughters
  simplified_phrase: Sodom, your sister, and her daughters
  preserved_meaning: Sodom remains personified as Jerusalem’s sister, and the family image is retained.
  reasoning_layer_used: Lexical decisions for אֲחוֹתַיִךְ and בְנוֹתֶיהָ
  rationale: Reordering makes the relationship clear without replacing the family metaphor.
- pob_phrase: will return to their former state
  simplified_phrase: will return to what they were before
  preserved_meaning: Each city and its communities will return to an earlier condition without explaining how.
  reasoning_layer_used: Lexical and theological decisions for שוב and קדם
  rationale: Common wording clarifies “former state” while preserving the theological tension.
- pob_phrase: one sentence with three parallel clauses
  simplified_phrase: three short parallel sentences
  preserved_meaning: The same promised reversal applies to Sodom, Samaria, and Jerusalem.
  reasoning_layer_used: Source syntax and repeated verbal pattern
  rationale: Short sentences make the repeated pattern easier to follow.
translation_notes:
  risk_flags:
  - risk: Readers may understand “daughters” as biological children.
    mitigation: The footnote identifies them as connected towns or communities.
  - risk: The wording may invite speculation about the nature of the return.
    mitigation: It does not define the mechanism or theological implications.
