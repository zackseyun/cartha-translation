translation:
  language: en
  text: I passed by you and saw you. Your time was a time for love.[b] So I spread the edge of my garment over you[a] and covered your nakedness. I pledged myself to you with an oath and entered into a covenant with you, declares the Lord GOD. Then you became mine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I spread my wing over you.” In this marriage imagery, spreading the edge of a garment expresses protection and a marital claim.
    reason: lexical_alternative
  - marker: b
    text: “Time for love” includes romantic and sexual overtones within the marriage metaphor.
    reason: lexical_alternative
