simplification_decisions:
- pob_phrase: behold, I am gathering
  simplified_phrase: I am gathering
  preserved_meaning: God solemnly announces judgment that is imminent and certain.
  reasoning_layer_used: lexical decision for הִנְנִי with the participle
  rationale: The direct present-tense announcement keeps the immediacy without the unfamiliar word “behold.”
- pob_phrase: all your lovers with whom you found pleasure
  simplified_phrase: all your lovers—the ones you took pleasure in
  preserved_meaning: Jerusalem sought pleasure in illicit partners within the chapter’s sexual metaphor.
  reasoning_layer_used: lexical and theological decisions for מְאַהֲבַיִךְ and ערב
  rationale: The rewrite uses ordinary syntax while retaining the concrete image of lovers and pleasure.
- pob_phrase: I will uncover your nakedness to them, and they will see all your nakedness
  simplified_phrase: I will expose your nakedness before them, and they will see you completely naked
  preserved_meaning: Jerusalem will be fully and publicly exposed in humiliating judgment.
  reasoning_layer_used: lexical decision and theological decision on prophetic shame imagery
  rationale: The wording clarifies the repeated image without replacing nakedness with an abstract term.
