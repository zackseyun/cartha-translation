translation:
  language: en
  text: Therefore, I am gathering all your lovers—the ones you took pleasure in—and everyone you loved, along with everyone you hated. I will bring them against you from every side. I will expose your nakedness before them,[a] and they will see you completely naked.
  philosophy: optimal-equivalence
