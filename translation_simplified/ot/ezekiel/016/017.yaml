translation:
  language: en
  text: You took the beautiful jewelry made from the gold and silver I had given you. You used it to make male images[a] for yourself, and you prostituted yourself with them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “male idols” or “images in the form of males.”
    reason: alternative_reading
  - marker: b
    text: “Prostituted yourself” is Ezekiel’s sexual metaphor for Jerusalem’s unfaithfulness to God through idolatry.
    reason: cultural_note
simplification_decisions:
- pob_phrase: your beautiful jewels from my gold and my silver, which I had given to you
  simplified_phrase: the beautiful jewelry made from the gold and silver I had given you
  preserved_meaning: The jewelry was made from precious metals that God had given Jerusalem.
  reasoning_layer_used: Lexical decisions for כְּלֵי תִפְאַרְתֵּךְ and מִזְּהָבִי וּמִכַּסְפִּי
  rationale: “Jewelry made from” states the material relationship in more natural English.
- pob_phrase: and made for yourself male images
  simplified_phrase: You used it to make male images for yourself
  preserved_meaning: Jerusalem turned God’s gifts into explicitly male figures for her own illicit use.
  reasoning_layer_used: Lexical and theological decisions for וַתַּעֲשִׂי לָךְ and צַלְמֵי זָכָר
  rationale: A new sentence and explicit object make the action easier to follow without changing “images” to “idols.”
- pob_phrase: and you prostituted yourself with them
  simplified_phrase: and you prostituted yourself with them
  preserved_meaning: The explicit sexual metaphor portrays covenant unfaithfulness through idolatry.
  reasoning_layer_used: Theological decision on the prophetic sexual metaphor
  rationale: The wording is retained because softer language would erase Ezekiel’s deliberate force.
