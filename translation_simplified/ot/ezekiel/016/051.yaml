translation:
  language: en
  text: Samaria did not sin even half as much as you did. You committed more abominations than your sisters did. Because of all your abominations, you made your sisters look righteous by comparison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “you justified your sisters”; this means that your greater wickedness made them seem righteous in comparison.
