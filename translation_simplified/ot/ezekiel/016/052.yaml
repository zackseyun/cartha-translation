translation:
  language: en
  text: You too must bear your disgrace. Because your sins were even more detestable than your sisters’ sins, you ended up pleading their case for them.[a] Compared with you, they are more righteous. So be ashamed and bear your disgrace, because you made your sisters appear righteous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “judging in favor of” or “interceding for” your sisters; Jerusalem’s worse sins vindicated them by comparison.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By your sins in which you acted more abominably than they
  simplified_phrase: Because your sins were even more detestable than your sisters’ sins
  preserved_meaning: Jerusalem’s sins were worse than those of her sisters and caused the comparison.
  reasoning_layer_used: lexical decision for הִתְעַבְּתְּ מֵהֵן and immediate context
  rationale: The recast clause removes awkward nesting while retaining the causal comparison.
- pob_phrase: pronounced judgment in favor of your sisters
  simplified_phrase: ended up pleading their case for them
  preserved_meaning: Jerusalem’s conduct ironically vindicated her sisters without implying a formal courtroom judgment.
  reasoning_layer_used: lexical decision for פִּלַּלְתְּ לַאֲחוֹתֵךְ and doctrine realignment
  rationale: This follows the audited choice “pleaded for” and makes its unintended result clear.
- pob_phrase: they have become more righteous than you
  simplified_phrase: Compared with you, they are more righteous
  preserved_meaning: The sisters are called righteous only relative to Jerusalem.
  reasoning_layer_used: theological decision on comparative righteousness
  rationale: The opening qualifier prevents an absolute claim while preserving the verse’s shocking comparison.
