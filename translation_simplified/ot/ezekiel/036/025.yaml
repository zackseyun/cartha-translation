translation:
  language: en
  text: I will sprinkle clean water on you, and you will be clean. I will cleanse you from all your impurity and from all your idols.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses Ezekiel’s contemptuous expression, literally “dung-idols.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from all your uncleannesses
  simplified_phrase: from all your impurity
  preserved_meaning: God removes every state of defilement from his people.
  reasoning_layer_used: POB lexical decision for מִכֹּל טֻמְאוֹתֵיכֶם
  rationale: The singular mass noun is natural English while “all” preserves the phrase’s full scope.
- pob_phrase: and from all your idols I will cleanse you
  simplified_phrase: I will cleanse you from all your impurity and from all your idols
  preserved_meaning: God actively cleanses the people from both impurity and idolatry.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Ordinary English word order makes God’s cleansing action immediately clear without narrowing the imagery.
translation_notes:
  risk_flags:
