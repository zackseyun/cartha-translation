translation:
  language: en
  text: 'Therefore prophesy and say, “This is what the Lord Yahweh says: Because—yes, because—they have devastated you and snapped at you[a] from every side, making you the possession of the nations that remain, and because you have become the subject of people’s talk and slander,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may also mean that they pursued you like panting predators, tried to swallow you up, or gasped after you.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The formula introduces God’s authoritative message and preserves his covenant name in the divine title.
  reasoning_layer_used: POB theological decision for אֲדֹנָי יְהוִה
  rationale: The updated doctrinal policy requires “Yahweh,” while the familiar formula remains clear.
- pob_phrase: so that you became a possession for the remnant of the nations
  simplified_phrase: making you the possession of the nations that remain
  preserved_meaning: The surrounding nations sought to take the land as their property.
  reasoning_layer_used: POB lexical decisions for לִהְיוֹתְכֶם מוֹרָשָׁה and לִשְׁאֵרִית הַגּוֹיִם
  rationale: This avoids a misleading theological sense of “remnant” and states the result directly.
- pob_phrase: you have come up on the lips of the tongue and in the slander of the people
  simplified_phrase: you have become the subject of people’s talk and slander
  preserved_meaning: The land became the subject of widespread speech and defamation.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: Natural English communicates the meaning of the opaque idiom while retaining the hostile speech.
interpretive_expansions:
- pob_phrase: you have come up on the lips of the tongue
  rendering: you have become the subject of people’s talk
  claim: People were speaking about the land.
  evidence:
