translation:
  language: en
  text: I will increase the number of people and animals living on you.[a] They will multiply and be fruitful. I will make you inhabited again, as you were in former times, and I will do more good for you than I did at first. Then you will know that I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “you” refers to the mountains and land of Israel addressed in this passage.
    reason: source_note
simplification_decisions:
- pob_phrase: multiply upon you man and beast
  simplified_phrase: increase the number of people and animals living on you
  preserved_meaning: God will cause both the human and animal populations on the land to increase.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: This keeps the human-animal pairing while clarifying the unusual phrase “upon you.”
- pob_phrase: I will settle you as in your former times
  simplified_phrase: I will make you inhabited again, as you were in former times
  preserved_meaning: God will restore the land to its former inhabited condition.
  reasoning_layer_used: lexical rationale for the causative form of ישב
  rationale: This states renewed habitation without implying that the inhabitants themselves make a return journey.
- pob_phrase: I will do better for you than at your beginnings
  simplified_phrase: I will do more good for you than I did at first
  preserved_meaning: God promises to benefit the land beyond its earlier condition.
  reasoning_layer_used: lexical decisions for וְהֵטִבֹתִי and מֵרִאשֹׁתֵיכֶם
  rationale: This keeps God as the giver of good and expresses the comparison in ordinary English.
interpretive_expansions:
- pob_phrase: upon you
  rendering: living on you
  claim: The increase takes place on the land and mountains being addressed.
  evidence:
