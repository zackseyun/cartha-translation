  preserved_meaning: The surrounding peoples left after judgment will witness the restoration.
  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: “Survive” makes the idea of being left after judgment immediately clear.
- pob_phrase: that I, Yahweh, have rebuilt
  simplified_phrase: that I am Yahweh, the one who rebuilt
  preserved_meaning: The nations will recognize Yahweh as the one responsible for the restoration.
  reasoning_layer_used: POB translation and divine-name decision
  rationale: The recast sentence is easier to follow while keeping Yahweh’s identity and action connected.
- pob_phrase: have spoken, and I will do it
  simplified_phrase: have said it, and I will do it
  preserved_meaning: Yahweh will certainly accomplish what he has announced.
  reasoning_layer_used: POB prophetic-perfect decision
  rationale: “Said” is common English and retains the force of Yahweh’s promise.
