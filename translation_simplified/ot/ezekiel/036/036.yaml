translation:
  language: en
  text: Then the nations that survive around you will know that I am Yahweh, the one who rebuilt the ruined places and planted what had been desolate. I, Yahweh, have said it, and I will do it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “have said it and done it.” The Hebrew form can describe the act as completed, but here it most likely emphasizes that Yahweh will certainly do what he has promised.
    reason: lexical_alternative
