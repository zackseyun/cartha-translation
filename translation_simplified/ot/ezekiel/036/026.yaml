translation:
  language: en
  text: I will give you a new heart. I will also put a new spirit[a] within you. I will take the heart of stone out of your flesh and replace it with a heart of flesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a renewed spirit.” This may also point ahead to God’s gift of his Spirit in the next verse.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I will give you a new heart, and I will put a new spirit within you
  simplified_phrase: I will give you a new heart. I will also put a new spirit within you.
  preserved_meaning: God gives both a new heart and a new inward spirit.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two short sentences make the paired gifts easier to follow without merging them.
- pob_phrase: I will remove the heart of stone from your flesh and give you a heart of flesh
  simplified_phrase: I will take the heart of stone out of your flesh and replace it with a heart of flesh.
  preserved_meaning: God removes the unresponsive heart and gives a different kind of heart in its place.
  reasoning_layer_used: POB lexical decisions and replacement imagery
  rationale: “Take out” and “replace” state the exchange naturally while retaining both concrete heart images.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “new spirit” for an explicit reference to the Holy Spirit.
    mitigation: Lowercase “spirit” and the footnote preserve the POB distinction while noting the possible connection.
  - risk: “Heart of flesh” may sound negative to readers familiar with other biblical uses of “flesh.”
    mitigation: The direct contrast with the removed heart of stone preserves the intended positive replacement image.
