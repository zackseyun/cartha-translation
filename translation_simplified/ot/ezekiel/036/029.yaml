translation:
  language: en
  text: I will save you from everything that defiles you.[a] I will summon the grain and make it plentiful, and I will not bring famine on you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew impurity language can refer to both moral and ritual uncleanness.
    reason: simplification_note
simplification_decisions:
- pob_phrase: from all your uncleannesses
  simplified_phrase: from everything that defiles you
  preserved_meaning: God will save the people from every form of moral and ritual defilement.
  reasoning_layer_used: Lexical and theological decisions on impurity terminology
  rationale: This wording clearly preserves defilement itself as the condition from which God saves them.
- pob_phrase: call for the grain and multiply it
  simplified_phrase: summon the grain and make it plentiful
  preserved_meaning: God commands the grain to become abundant.
  reasoning_layer_used: Lexical decisions for קרא אל and רבה
  rationale: “Summon” keeps the command image, while “make it plentiful” clearly expresses abundance.
- pob_phrase: bring famine upon you
  simplified_phrase: bring famine on you
  preserved_meaning: God promises not to impose famine on the people.
  reasoning_layer_used: Lexical decision for נתן על with רָעָב
  rationale: The natural modern expression retains both divine agency and the threat of famine.
translation_notes:
  risk_flags:
  - risk: “Everything that defiles you” may be heard as referring only to moral impurity.
    mitigation: The footnote preserves the Hebrew term’s moral and ritual range.
