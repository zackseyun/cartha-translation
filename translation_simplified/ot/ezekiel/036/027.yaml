translation:
  language: en
  text: I will put my Spirit within you and cause you to live by my established laws. You will keep my legal rulings and carry them out.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and I will cause you to walk in my statutes
  simplified_phrase: and cause you to live by my established laws
  preserved_meaning: God effectively brings about conduct that follows his prescribed requirements.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Live by” explains the conduct metaphor without adding another image, while “established laws” clarifies “statutes.”
- pob_phrase: my judgments
  simplified_phrase: my legal rulings
  preserved_meaning: God’s authoritative covenant decisions remain distinct from his established laws.
  reasoning_layer_used: lexical decision
  rationale: “Legal rulings” clearly conveys the judicial sense while preserving the distinction between the two law terms.
- pob_phrase: and do them
  simplified_phrase: and carry them out
  preserved_meaning: The people will put God’s rulings into practice, not merely acknowledge them.
  reasoning_layer_used: lexical decision
  rationale: “Carry them out” expresses actual performance in natural English.
interpretive_expansions:
- pob_phrase: walk in my statutes
  rendering: live by my established laws
  claim: Walking refers to living and behaving according to God’s prescribed requirements.
  evidence:
  - The POB lexical rationale identifies “walk” as a covenant metaphor for conduct.
  - The parallel commands to keep and carry out God’s rulings confirm that obedience is in view.
  confidence: high
  alternatives_preserved:
  - walk in my statutes
  - follow my statutes
translation_notes:
  risk_flags:
  - risk: “Established laws” is broader than the technical term “statutes.”
    mitigation: Divine ownership is retained, and the phrase remains distinct from “legal rulings.”
