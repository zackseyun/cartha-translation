translation:
  language: en
  text: Because of this, mountains of Israel, hear the word of the Lord GOD. This is what the Lord GOD says to the mountains and hills, the ravines[a] and valleys, and the desolate ruins and abandoned cities that have been plundered and mocked by the remaining nations that are all around.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “watercourses” or “channels.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “the remnant of the nations”; here this means the nations that remain.
    reason: simplification_note
