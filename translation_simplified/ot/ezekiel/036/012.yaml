translation:
  language: en
  text: I will bring my people Israel onto you.[a] They will possess you, and you will be their inheritance. You will no longer deprive them of their children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God is speaking to the land and mountains of Israel.
    reason: simplification_note
simplification_decisions:
- pob_phrase: cause people—my people Israel—to walk upon you
  simplified_phrase: bring my people Israel onto you
  preserved_meaning: God will cause Israel to come onto the land to inhabit it.
  reasoning_layer_used: Lexical decisions for וְהוֹלַכְתִּי, עֲלֵיכֶם, and אֶת עַמִּי יִשְׂרָאֵל
  rationale: “Bring onto” naturally conveys caused movement onto the land without suggesting mere passage across it.
- pob_phrase: you will be their inheritance
  simplified_phrase: you will be their inheritance
  preserved_meaning: Israel will receive the land as its covenant inheritance.
  reasoning_layer_used: Theological decision on covenant-land terminology
  rationale: “Inheritance” remains because it conveys the land’s covenant significance, not only ownership.
- pob_phrase: you will no longer bereave them
  simplified_phrase: You will no longer deprive them of their children
  preserved_meaning: The land will cease causing Israel to lose its children.
  reasoning_layer_used: Lexical decision for לְשַׁכְּלָם
  rationale: The explicit wording makes the child-related loss clear without adding a theft image.
interpretive_expansions:
- pob_phrase: bereave them
  rendering: deprive them of their children
  claim: The bereavement concerns the loss of children.
  evidence:
