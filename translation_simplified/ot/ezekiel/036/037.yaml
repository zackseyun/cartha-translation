simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord GOD says
  preserved_meaning: God solemnly introduces his own declaration while the compound divine title remains unchanged.
  reasoning_layer_used: POB lexical and theological decisions for אֲדֹנָי יְהוִה
  rationale: The common English formula is clearer without weakening the divine declaration.
- pob_phrase: Yet in this also I will let the house of Israel ask me to act for them
  simplified_phrase: I will also let the house of Israel ask me to do this for them
  preserved_meaning: God permits Israel to seek him for the restoration he has promised.
  reasoning_layer_used: POB lexical decision for עוֹד זֹאת, אִדָּרֵשׁ, and לַעֲשׂוֹת לָהֶם
  rationale: “Do this” naturally points back to the promised restoration and preserves the tension between promise and prayer.
- pob_phrase: I will multiply them like a flock of men
  simplified_phrase: I will make them as numerous as a flock of men
  preserved_meaning: God will greatly increase Israel's population while retaining the unusual flock image.
  reasoning_layer_used: POB lexical decisions for אַרְבֶּה אֹתָם and כַּצֹּאן אָדָם
  rationale: “Make them as numerous” states the comparison clearly while keeping its source-language imagery.
