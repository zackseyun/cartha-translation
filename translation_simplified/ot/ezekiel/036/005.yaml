translation:
  language: en
  text: 'Therefore, this is what the Lord GOD says: “Surely, burning with jealousy, I have spoken against the remaining nations and all Edom. They made my land their own possession, rejoicing with all their hearts and filled with contempt, so that they could plunder its pastureland.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew phrase is difficult; it may refer more broadly to dispossessing the land and taking it as plunder.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the fire of my jealousy
  simplified_phrase: burning with jealousy
  preserved_meaning: God’s covenant jealousy is pictured with the force of fire.
  reasoning_layer_used: lexical decision
  rationale: The verbal image keeps the fire metaphor in more natural English.
- pob_phrase: gave my land to themselves as a possession
  simplified_phrase: made my land their own possession
  preserved_meaning: The nations wrongfully appropriated land that God calls his own.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The recast wording makes the reflexive seizure clear without suggesting legitimate inheritance.
- pob_phrase: with wholehearted joy and with contempt of soul
  simplified_phrase: rejoicing with all their hearts and filled with contempt
  preserved_meaning: They took inward delight in their action while acting from deep scorn.
  reasoning_layer_used: lexical decisions
  rationale: Common emotional language preserves both their complete joy and inward contempt.
