- pob_phrase: I will sanctify my great name
  simplified_phrase: I will show that my great name is holy
  preserved_meaning: God will publicly demonstrate the holiness of his already holy name.
  reasoning_layer_used: lexical and theological decisions on קדשׁ
  rationale: The clearer wording avoids suggesting that God's name was previously unholy.
- pob_phrase: which has been profaned among the nations, which you have profaned among them
  simplified_phrase: You treated my name as unholy among the nations, and it has been dishonored there
  preserved_meaning: Israel treated God's name as common or unholy, and his name was dishonored among the nations.
  reasoning_layer_used: lexical decisions on הַמְחֻלָּל and אֲשֶׁר חִלַּלְתֶּם
  rationale: The rewrite explains “profaned” in common English while retaining both clauses.
- pob_phrase: before their eyes
