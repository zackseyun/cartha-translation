translation:
  language: en
  text: But if a wicked man turns back from every sin he has committed,[a] obeys all my statutes, and practices justice and righteousness, he will certainly live; he will not die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “repents.” The Hebrew describes turning away from sin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from all his sins that he has committed
  simplified_phrase: from every sin he has committed
  preserved_meaning: The man turns away from the full range of his sinful acts.
  reasoning_layer_used: Lexical decision for מִכָּל חטאתו and אֲשֶׁר עָשָׂה
  rationale: “Every sin” expresses the distributive sense in smoother English.
- pob_phrase: keeps all my statutes
  simplified_phrase: obeys all my statutes
  preserved_meaning: He lives in obedience to all God’s covenantal requirements.
  reasoning_layer_used: Lexical decision for וְשָׁמַר and חֻקּוֹתַי
  rationale: “Obeys” makes the intended action clear while retaining “statutes.”
- pob_phrase: does justice and righteousness
  simplified_phrase: practices justice and righteousness
  preserved_meaning: He actively lives according to both justice and righteousness.
  reasoning_layer_used: Lexical and doctrine-realignment decisions for מִשְׁפָּט וּצְדָקָה
  rationale: “Practices” is natural English and preserves both weighty ethical terms.
translation_notes:
  risk_flags:
  - risk: “Live” could be read as only physical survival or only eternal salvation.
    mitigation: The broad word “live” is retained without resolving Ezekiel’s life-and-death language.
  - risk: “Turns back” may sound spatial rather than moral.
    mitigation: The phrase “from every sin” and the footnote make the moral reversal clear.
