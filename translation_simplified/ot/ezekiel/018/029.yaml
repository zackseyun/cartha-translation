translation:
  language: en
  text: Yet the house of Israel says,[a] “The way the Lord acts is not just.” House of Israel, are the ways I act not just? Is it not the ways you act that are not just?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is not right” or “is not fair.” The Hebrew describes what is rightly ordered and here refers to justice in the Lord’s dealings.
    reason: lexical_alternative
