translation:
  language: en
  text: The person who sins will die. A son will not carry the guilt or punishment for his father’s sin, and a father will not carry the guilt or punishment for his son’s sin. A righteous person’s righteousness will be his own, and a wicked person’s wickedness will be his own.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The person who sins—he shall die
  simplified_phrase: The person who sins will die
  preserved_meaning: The sinner himself faces death under this judicial declaration.
  reasoning_layer_used: Lexical decision for הִיא תָמוּת and the individual-accountability context
  rationale: The direct sentence states the judicial result in natural modern English.
- pob_phrase: shall not bear the iniquity
  simplified_phrase: will not carry the guilt or punishment for ... sin
  preserved_meaning: Neither generation bears the other’s wrongdoing or its legal liability.
  reasoning_layer_used: Lexical and theological decisions for יִשָּׂא בַּעֲוֺן
  rationale: This explains the legal idiom while preserving its image of carrying a burden.
- pob_phrase: shall be upon him
  simplified_phrase: will be his own
  preserved_meaning: Each person’s righteousness or wickedness belongs to that person alone.
  reasoning_layer_used: Lexical alternative for עָלָיו תִּהְיֶה and the chapter’s accountability context
  rationale: This makes personal moral accountability clear without suggesting that righteousness is a burden.
interpretive_expansions:
- pob_phrase: bear the iniquity
  rendering: carry the guilt or punishment for ... sin
  claim: The idiom includes both guilt and liability to punishment.
  evidence:
  - The POB cultural note says the idiom can include guilt and liability.
  - The theological decision warns against reducing the phrase to punishment alone.
  confidence: high
  alternatives_preserved:
  - The expression may emphasize guilt, liability, or both.
- pob_phrase: shall be upon him
  rendering: will be his own
  claim: Each person’s moral standing is personal and is not transferred between father and son.
  evidence:
  - The POB lexical decision permits “shall belong to him.”
  - The reciprocal clauses establish individual accountability.
  confidence: high
  alternatives_preserved:
  - The phrase may retain the source image as “shall be upon him.”
translation_notes:
  risk_flags:
  - risk: “Punishment” could sound narrower than the full idea of legal liability.
    mitigation: Pairing it with “guilt” preserves both dimensions documented by POB.
  - risk: “Will be his own” makes the accountability sense more explicit than the Hebrew image.
    mitigation: The wording follows POB’s permitted “belong to him” alternative and preserves the balanced clauses.
