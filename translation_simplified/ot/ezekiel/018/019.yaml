translation:
  language: en
  text: Yet you ask, “Why doesn’t the son bear his father’s iniquity?”[a] It is because the son has done what is just and right. He has kept all my laws and carried them out. He will certainly live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression may mean bearing the father’s guilt, the punishment for his sin, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yet you say
  simplified_phrase: Yet you ask
  preserved_meaning: The people raise an objection to the principle just stated.
  reasoning_layer_used: Lexical decision for וַאֲמַרְתֶּם and discourse context
  rationale: “Ask” naturally introduces the quoted question while retaining its adversative setting.
- pob_phrase: has done justice and righteousness
  simplified_phrase: has done what is just and right
  preserved_meaning: The son’s conduct conforms to God’s standards of justice and righteousness.
  reasoning_layer_used: Lexical decision for מִשְׁפָּט וּצְדָקָה
  rationale: The adjective pair expresses both source ideas in more familiar English.
- pob_phrase: has kept all my statutes, and has done them; he shall surely live
  simplified_phrase: has kept all my laws and carried them out. He will certainly live.
  preserved_meaning: The son both observes and practices God’s commands, and God emphatically promises him life.
  reasoning_layer_used: Lexical decisions for חֻקּוֹתַי, שָׁמַר, וַיַּעֲשֶׂה אֹתָם, and חָיֹה יִחְיֶה
  rationale: Common legal wording and two short sentences preserve obedience, action, and emphatic life.
