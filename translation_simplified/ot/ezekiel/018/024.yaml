- pob_phrase: in them he shall die
  rendering: Because of them, he shall die
  claim: His unfaithfulness and sin are the grounds of the stated death judgment.
  evidence:
  - The plural pronoun refers to the unfaithfulness and sin just mentioned.
  - The POB lexical rationale recognizes the idiom’s causal sense.
  confidence: high
  alternatives_preserved:
  - in them he shall die
