translation:
  language: en
  text: But if a righteous man turns away from living rightly and does wrong—all the detestable acts[a] that a wicked man does—will he live? None of his former righteous deeds will be remembered. He has acted unfaithfully and committed sin. Because of them, he shall die.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a strong covenantal word often translated “abominations.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “in them he shall die,” referring to his unfaithfulness and sin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: turns away from his righteousness and does injustice
  simplified_phrase: turns away from living rightly and does wrong
  preserved_meaning: A previously righteous man abandons righteous conduct and practices wrongdoing.
  reasoning_layer_used: Lexical decisions for מִצִּדְקָתוֹ and וְעָשָׂה עָוֶל
  rationale: Concrete wording makes the moral reversal clear without adding an unsupported idea of beginning.
- pob_phrase: all the abominations that the wicked man does
  simplified_phrase: all the detestable acts that a wicked man does
  preserved_meaning: He practices the same severely condemned conduct as the representative wicked man.
  reasoning_layer_used: Lexical decisions for תּוֹעֵבוֹת and הָרָשָׁע
  rationale: The main text is immediately clear, while the footnote preserves the strong covenantal term.
- pob_phrase: In the treachery by which he has acted treacherously, and in the sin that he has committed—in them he shall die
  simplified_phrase: He has acted unfaithfully and committed sin. Because of them, he shall die.
  preserved_meaning: His breach of faith and sin bring the stated judgment of death.
  reasoning_layer_used: Lexical decisions for מעל, חטא, בָּם, and יָמוּת
  rationale: Two direct sentences remove opaque repetition while preserving unfaithfulness, sin, and judgment.
interpretive_expansions:
- pob_phrase: righteous deeds that he has done
  rendering: former righteous deeds
  claim: The deeds occurred before he turned away from righteous living.
  evidence:
