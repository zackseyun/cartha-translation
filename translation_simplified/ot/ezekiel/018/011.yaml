simplification_decisions:
- pob_phrase: done none of all these things
  simplified_phrase: does none of those righteous things
  preserved_meaning: He fails to follow the righteous conduct described just before this verse.
  reasoning_layer_used: immediate context and POB contrast
  rationale: This identifies what “these things” refers to without repeating the preceding list.
- pob_phrase: eaten on the mountains
  simplified_phrase: eats at the mountain shrines
  preserved_meaning: He participates in forbidden worship at elevated religious sites.
  reasoning_layer_used: source-language image and immediate context
  rationale: This keeps the mountain setting and clarifies its cultic sense without specifying sacrifice.
- pob_phrase: defiled his neighbor’s wife
  simplified_phrase: commits adultery with his neighbor’s wife
  preserved_meaning: He violates his neighbor’s marriage through sexual relations with the neighbor’s wife.
  reasoning_layer_used: POB wording and immediate legal-moral context
  rationale: The direct modern expression avoids the vague modern sense of physical contamination.
interpretive_expansions:
- pob_phrase: all these things
  rendering: those righteous things
  claim: The phrase refers to the righteous conduct described in the preceding verses.
  evidence:
  - Ezekiel 18:5–9 presents the preceding actions as the conduct of a righteous person.
  - This verse contrasts those actions with the sinful acts that follow.
  confidence: high
  alternatives_preserved:
  - those things
  - all these things
- pob_phrase: eaten on the mountains
  rendering: eats at the mountain shrines
  claim: The eating occurs in a forbidden worship setting at elevated shrines, not during an ordinary mountain meal.
  evidence:
  - The same expression in Ezekiel 18:6 stands beside idolatrous worship.
  - The mountain location evokes the chapter’s high-place worship setting without naming a sacrifice.
  confidence: high
  alternatives_preserved:
  - eats on the mountains
  - eats at the mountain shrines
translation_notes:
  risk_flags:
  - risk: “Mountain shrines” makes the cultic setting more explicit than the POB wording alone.
    mitigation: The immediate context supports this sense, while “eats” avoids the unsupported claim that the meal was sacrificial.
  - risk: “Commits adultery” replaces the source image of defiling the neighbor’s wife.
    mitigation: The wording directly preserves the marital and sexual offense while avoiding misleading modern senses of “defiled.”
