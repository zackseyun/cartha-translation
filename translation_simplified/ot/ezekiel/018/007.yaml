translation:
  language: en
  text: He does not oppress anyone. He returns to the debtor what was taken as security for a debt. He does not rob anyone. He gives his food to the hungry and provides clothing for those who lack adequate clothing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: restores the debtor’s pledge
  simplified_phrase: returns to the debtor what was taken as security for a debt
  preserved_meaning: The item held as collateral is returned to the person who owes the debt.
  reasoning_layer_used: POB lexical decision for חֲבֹלָתוֹ חוֹב יָשִׁיב
  rationale: This explains the unfamiliar financial sense of “pledge” in common English.
- pob_phrase: he does not commit robbery
  simplified_phrase: He does not rob anyone
  preserved_meaning: He does not take another person’s property by robbery.
  reasoning_layer_used: POB lexical decision for גְּזֵלָה לֹא יִגְזֹל
  rationale: The direct verb is clearer while retaining robbery rather than broadening it to theft in general.
- pob_phrase: he gives his bread to the hungry and covers the naked with a garment
  simplified_phrase: He gives his food to the hungry and provides clothing for those who lack adequate clothing
  preserved_meaning: He gives food and clothing to people who need them.
  reasoning_layer_used: POB lexical decisions for לַחְמוֹ, עֵירֹם, and יְכַסֶּה בָּגֶד
  rationale: This makes both acts clear without implying that the recipients have no clothing at all.
