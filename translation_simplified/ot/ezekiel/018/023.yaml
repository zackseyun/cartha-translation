translation:
  language: en
  text: “Do I take any pleasure at all[a] in the death of a wicked person?” declares the Lord GOD.[b] “Do I not instead take pleasure when that person turns from their ways and lives?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “delight” or “desire.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title is “the Lord GOD”; GOD represents the divine name, normally written as LORD.
    reason: source_note
