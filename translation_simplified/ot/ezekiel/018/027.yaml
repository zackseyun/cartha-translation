translation:
  language: en
  text: When a wicked man turns away from the evil he has done and acts justly and does what is right, he will preserve his life.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “he will keep himself alive.” Here the word for “self” can also mean “life” or “soul.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wickedness that he has done
  simplified_phrase: the evil he has done
  preserved_meaning: His past wicked conduct remains the object of his turning away.
  reasoning_layer_used: Lexical decision for מֵרִשְׁעָתוֹ and its relative clause
  rationale: “The evil he has done” expresses concrete wrongdoing in more familiar English.
- pob_phrase: does justice and righteousness
  simplified_phrase: acts justly and does what is right
  preserved_meaning: The two related ideas of just action and right conduct remain distinct.
  reasoning_layer_used: Lexical decisions for מִשְׁפָּט and צְדָקָה
  rationale: Verbal wording makes the ethical actions easier to understand without combining them.
- pob_phrase: he will preserve his life
  simplified_phrase: he will preserve his life
  preserved_meaning: The verse concerns life rather than only an immaterial soul.
  reasoning_layer_used: Lexical and theological decisions for נַפְשׁוֹ and יְחַיֶּה
  rationale: The wording is retained because it clearly preserves the chapter’s life-and-death emphasis.
translation_notes:
  risk_flags:
  - risk: “Does what is right” is broader than the traditional term “righteousness.”
    mitigation: Its pairing with “acts justly” preserves both ethical ideas in clear language.
