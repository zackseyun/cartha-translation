  preserved_meaning: The divine glory was visibly present there in Ezekiel’s vision.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה and שָׁם
  rationale: “There before me” conveys the sudden eyewitness focus without the unfamiliar “behold.”
- pob_phrase: like the appearance that I had seen
  simplified_phrase: like what I had seen
  preserved_meaning: The glory resembled the visible appearance Ezekiel had seen earlier.
  reasoning_layer_used: Lexical decision for כַּמַּרְאֶה and theological decision on divine manifestation
  rationale: This natural comparison preserves “like” without claiming an exact repetition.
