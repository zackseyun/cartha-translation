translation:
  language: en
  text: Then I went inside and looked. There, carved all over the wall, were images of every kind of crawling creature and detestable animal, along with all the idols of the house of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “idols” is deliberately contemptuous and can also be rendered “dung-idols” or “filthy idols.”
    reason: lexical_alternative
