  rationale: Shorter sentences clarify the agent and sequence while keeping “visions of God” open in meaning.
- pob_phrase: where the seat of the image of jealousy that provokes jealousy was
  simplified_phrase: The image of jealousy that provokes jealousy stood there in its fixed place
  preserved_meaning: The image occupied a fixed location at the north-facing inner gate and provoked jealousy.
  reasoning_layer_used: POB lexical decisions for מוֹשַׁב, סֵמֶל, הַקִּנְאָה, and הַמַּקְנֶה
  rationale: “Stood there in its fixed place” makes the location clear while preserving the jealousy wordplay.
