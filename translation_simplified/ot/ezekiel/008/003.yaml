translation:
  language: en
  text: Then he reached out with what looked like a hand[a] and took hold of me by a lock of hair. The Spirit[b] lifted me up between the earth and the heavens. In visions of God, the Spirit brought me to Jerusalem, to the entrance of the inner gate facing north. The image of jealousy that provokes jealousy stood there in its fixed place.
