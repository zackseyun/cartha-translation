translation:
  language: en
  text: Then he said to me, “Son of man, have you seen what the elders of the house of Israel are doing in the dark? Each man is in inner rooms with his own carved image.[a] For they say, ‘Yahweh does not see us. Yahweh has abandoned the land.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “in chambers filled with imagery” or “in rooms devoted to his image.”
    reason: lexical_alternative
  - marker: b
    text: “The land” probably means the land of Israel or Judah; it can also be translated “the earth.”
    reason: alternative_reading
