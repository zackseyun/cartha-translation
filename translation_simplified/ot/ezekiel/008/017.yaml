translation:
  language: en
  text: Then he said to me, “Have you seen this, son of man? Is it a small matter that the house of Judah commits these abominations here? They also fill the land with violence and again do things that provoke me. And look! They are putting the branch to their nose.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
