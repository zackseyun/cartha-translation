translation:
  language: en
  text: On the fifth day of the sixth month in the sixth year, I was sitting in my house. The elders of Judah were sitting in front of me. The hand of the Lord Yahweh[a] fell upon me there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Lord GOD”; the Hebrew combines the title “Lord” with the divine name.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “there,” referring to that place; some translations render it “then.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened in the sixth year, in the sixth month, on the fifth day of the month
  simplified_phrase: On the fifth day of the sixth month in the sixth year
  preserved_meaning: The same three-part date remains without specifying what the sixth year was counted from.
  reasoning_layer_used: POB lexical decisions and source date formula
  rationale: Reordering the date removes repetition and gives natural modern English.
- pob_phrase: as I was sitting in my house and the elders of Judah were sitting before me
  simplified_phrase: I was sitting in my house. The elders of Judah were sitting in front of me.
  preserved_meaning: Ezekiel and Judah’s recognized leaders were seated together in his house.
  reasoning_layer_used: POB lexical decisions for the participles and לְפָנַי
  rationale: Two short sentences clarify the setting while keeping both ongoing actions distinct.
- pob_phrase: the hand of the Lord GOD fell upon me there
  simplified_phrase: The hand of the Lord Yahweh fell upon me there.
  preserved_meaning: The prophetic image portrays the overpowering action of Yahweh coming upon Ezekiel at that place.
  reasoning_layer_used: POB lexical decisions and updated theological decision for יְהוָה
  rationale: The wording preserves the concrete image, the divine name, and the locative “there.”
