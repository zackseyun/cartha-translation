translation:
  language: en
  text: Then he brought me into the inner courtyard of Yahweh’s temple. There I saw about twenty-five men at the temple entrance, between the porch and the altar. Their backs were toward Yahweh’s temple, and their faces were toward the east. They were bowing down toward the east to the sun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes bowing low in worship; it may also be translated, “They were worshiping the sun.”
    reason: lexical_alternative
