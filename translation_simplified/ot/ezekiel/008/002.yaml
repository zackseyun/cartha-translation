translation:
  language: en
  text: Then I looked, and there before me was a figure that looked like fire. Below what seemed to be his waist was fire. Above his waist it looked like a bright glow, like gleaming amber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like electrum” or “like glowing metal.” The rare Hebrew word refers to a brilliantly shining substance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and behold, a form with the appearance of fire
  simplified_phrase: and there before me was a figure that looked like fire
  preserved_meaning: The figure appeared in the vision and resembled fire without being identified as fire.
  reasoning_layer_used: Lexical and theological decisions on וְהִנֵּה, דְמוּת, and appearance language
  rationale: The wording makes the scene immediate while preserving the careful comparison.
- pob_phrase: from what appeared to be his waist and downward, fire
  simplified_phrase: Below what seemed to be his waist was fire
  preserved_meaning: Fire appeared in the part of the figure below the apparent waist.
  reasoning_layer_used: Lexical decisions on מִמַּרְאֵה מָתְנָיו, וּלְמַטָּה, and אֵשׁ
  rationale: The clause is reordered naturally while retaining uncertainty about the waist.
- pob_phrase: from his waist and upward, like the appearance of brightness, like gleaming amber
  simplified_phrase: Above his waist it looked like a bright glow, like gleaming amber
  preserved_meaning: The upper part resembled radiance and a brilliantly shining substance.
  reasoning_layer_used: Lexical decisions on brightness and חַשְׁמַל, with the theological decision to preserve appearance language
  rationale: “Looked like” keeps the visionary qualification while making the layered comparison clear.
translation_notes:
  risk_flags:
  - risk: “Amber” may suggest ordinary fossil resin rather than a radiant metal-like substance.
    mitigation: The footnote preserves “electrum” and “glowing metal” as lexical alternatives.
