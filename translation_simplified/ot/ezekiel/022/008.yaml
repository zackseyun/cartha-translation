simplification_decisions:
- pob_phrase: You have despised my holy things
  simplified_phrase: You have treated the things that are holy and belong to me with contempt
  preserved_meaning: The accusation concerns sacred things belonging to God, without limiting them to the temple.
  reasoning_layer_used: Lexical and theological decisions on קָדָשַׁי and בָּזִית
  rationale: This wording preserves the concrete possessive sense and explains the force of despised.
- pob_phrase: you have profaned my Sabbaths
  simplified_phrase: you have treated my Sabbaths as if they were not holy
  preserved_meaning: They dishonored God's sacred Sabbath days by treating them as common.
  reasoning_layer_used: Lexical decisions on שַׁבְּתֹתַי and חִלָּלְתְּ
  rationale: The plain wording explains profaning while retaining the covenantal term Sabbaths.
interpretive_expansions:
- pob_phrase: profaned
  rendering: treated ... as if they were not holy
  claim: To profane something holy is to treat it as common rather than sacred.
  evidence:
