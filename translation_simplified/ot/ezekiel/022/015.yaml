simplification_decisions:
- pob_phrase: disperse you through the lands
  simplified_phrase: spread you throughout their lands
  preserved_meaning: Jerusalem’s people will be widely dispersed in exile among other nations.
  reasoning_layer_used: Lexical decisions for וְזֵרִיתִיךְ and בָּאֲרָצוֹת
  rationale: The wording keeps the second scattering image while using a more familiar verb and natural English geography.
- pob_phrase: purge your uncleanness from you
  simplified_phrase: purge you of your impurity
  preserved_meaning: God’s judgment will remove Jerusalem’s defilement without defining it as only moral or ritual.
  reasoning_layer_used: Lexical decision for טֻמְאָתֵךְ and theological decision on purification through judgment
  rationale: “Impurity” is clearer than “uncleanness,” and the recast phrase expresses removal in ordinary English.
translation_notes:
