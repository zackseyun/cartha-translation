translation:
  language: en
  text: Within the city, her prophets have formed a conspiracy. They are like a roaring lion tearing apart its prey. They devour lives,[a] take treasure and precious things, and leave many women in the city as widows.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “devour people”; the Hebrew word often means a living person or life, not only an immaterial soul.
    reason: lexical_alternative
