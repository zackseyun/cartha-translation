  preserved_meaning: The city is addressed directly, and the repeated refrain locates these sins within it.
  reasoning_layer_used: POB lexical decision and cultural note on בָךְ and בְּתוֹכֵךְ
  rationale: Naming Jerusalem makes the personified address clear while preserving the repetition.
- pob_phrase: the sojourner
  simplified_phrase: foreigners who live in your community
  preserved_meaning: The group consists of non-native residents living among Israel.
  reasoning_layer_used: POB lexical and theological decisions for לַגֵּר
  rationale: The wording explains the unfamiliar social category without reducing it to ethnicity alone.
