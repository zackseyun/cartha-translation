translation:
  language: en
  text: Her priests have violently abused my law and have treated my holy things as though they were not holy. They do not distinguish what is holy from what is ordinary, and they do not teach the difference between what is unclean and what is clean. They shut their eyes to my Sabbaths, and I am treated among them as though I were not holy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: have done violence to my law
  simplified_phrase: have violently abused my law
  preserved_meaning: The priests grievously abuse God’s law rather than merely breaking it.
  reasoning_layer_used: Lexical decision for חָמְסוּ
  rationale: This idiomatic wording retains the force of violent wrongdoing.
- pob_phrase: have profaned my holy things
  simplified_phrase: have treated my holy things as though they were not holy
  preserved_meaning: The priests dishonor things belonging to God’s sacred sphere.
  reasoning_layer_used: Lexical decisions for וַיְחַלְּלוּ and קָדָשַׁי
  rationale: The wording explains “profaned” without narrowing the broad reference.
- pob_phrase: have hidden their eyes from my Sabbaths
  simplified_phrase: shut their eyes to my Sabbaths
  preserved_meaning: The priests deliberately disregard God’s recurring Sabbath observances.
  reasoning_layer_used: Lexical decision for הֶעְלִימוּ עֵינֵיהֶם
  rationale: This familiar idiom preserves the eye image and willful neglect.
interpretive_expansions:
- pob_phrase: have not made known the difference between the unclean and the clean
  rendering: do not teach the difference between what is unclean and what is clean
  claim: The priests were responsible for teaching the community these purity distinctions.
  evidence:
  - The lexical decision identifies an instructional sense in this priestly context.
  confidence: high
  alternatives_preserved:
  - do not make known the difference
- pob_phrase: and I have been profaned among them
  rendering: and I am treated among them as though I were not holy
  claim: The passive clause concerns God being treated as non-holy within the community.
  evidence:
  - The theological decision reads the verb as passive.
  - The clause summarizes the effect of the priests’ failures on God’s holiness.
  confidence: high
  alternatives_preserved:
  - I have been profaned among them.
  - I was treated as profane among them.
