translation:
  language: en
  text: Son of man, tell her, “You are a land that has not been cleansed.[a] No rain has fallen on you in the day of wrath.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “has not been purified.”
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew expression may also mean “is without rain” or “has not been showered upon.”
