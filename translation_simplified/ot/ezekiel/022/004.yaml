translation:
  language: en
  text: Because of the blood you have shed, you have become guilty. Because of the idols[b] you made, you have become unclean. You have brought your time of judgment near and reached the end of your appointed years.[a] Therefore I have made you a disgrace among the nations and an object of mockery in every land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says, “You have brought your days near and have come to your years,” an idiom that likely points to Jerusalem’s appointed time of judgment.
    reason: lexical_alternative
  - marker: b
    text: Ezekiel uses a contemptuous Hebrew word for false gods, stronger than the neutral English word “idols.”
    reason: cultural_note
