- pob_phrase: By your blood that you have shed
  simplified_phrase: Because of the blood you have shed
  preserved_meaning: Jerusalem became guilty on account of bloodshed.
  reasoning_layer_used: Lexical decision for בְּדָמֵךְ as causal in context
  rationale: “Because of” makes the causal charge immediately clear.
- pob_phrase: a reproach to the nations
  simplified_phrase: a disgrace among the nations
  preserved_meaning: God makes Jerusalem an object of public shame before other nations.
  reasoning_layer_used: Lexical alternatives for חֶרְפָּה
  rationale: “Disgrace” is more familiar than “reproach” while retaining the judicial shame.
- pob_phrase: a mockery to all the lands
  simplified_phrase: an object of mockery in every land
  preserved_meaning: People throughout the surrounding countries will ridicule Jerusalem.
  reasoning_layer_used: Lexical decisions for קַלָּסָה and הָאֲרָצוֹת
  rationale: The recast phrase states naturally that Jerusalem becomes the target of widespread mockery.
