translation:
  language: en
  text: Silver, bronze[a], iron, lead, and tin are gathered inside a furnace. Fire is blasted onto them until they melt. In the same way, I will gather you in my anger and fury. I will put you there and melt you.[b]
  philosophy: optimal-equivalence
  footnotes:
