translation:
  language: en
  text: Ruin! Ruin! Ruin! I will bring this ruin about. This royal rule too will be no more until the one who has the right to rule comes.[a] Then I will give the rule to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “the one to whom judgment belongs” or “the one to whom it rightfully belongs.” Many interpreters understand this as referring to the Messiah.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A ruin, a ruin, a ruin—I will make it.
  simplified_phrase: Ruin! Ruin! Ruin! I will bring this ruin about.
  preserved_meaning: God emphatically announces total overthrow and says he will cause it.
  reasoning_layer_used: Lexical decisions for עַוָּה and אֲשִׂימֶנָּה.
  rationale: The exclamations preserve the threefold image while the next sentence clearly states God’s action.
- pob_phrase: This also shall not be
  simplified_phrase: This royal rule too will be no more
  preserved_meaning: The present royal order will cease to exist.
  reasoning_layer_used: Lexical rationale and immediate succession-oracle context.
  rationale: The wording names the implied royal rule and clearly preserves the clause’s sense of nonexistence.
- pob_phrase: whose right it is, and I will give it to him
  simplified_phrase: who has the right to rule comes. Then I will give the rule to him
  preserved_meaning: God will transfer rule to its rightful claimant.
  reasoning_layer_used: Lexical and theological decisions on מִשְׁפָּט and the implicit object of וּנְתַתִּיו.
  rationale: Repeating “rule” clarifies the pronouns while leaving the rightful claimant unnamed.
interpretive_expansions:
- pob_phrase: This also shall not be
  rendering: This royal rule too will be no more
  claim: The thing that will cease to exist is the present royal order.
  evidence:
  - The immediate context concerns the overturned royal state, crown, and diadem.
  - The POB lexical rationale identifies royal rule as the implied object.
  confidence: high
  alternatives_preserved:
  - This too will be no more.
  - This also shall not be.
- pob_phrase: I will give it to him
  rendering: Then I will give the rule to him
  claim: What God gives is the authority to rule.
  evidence:
  - The POB lexical rationale identifies royal rule as the implicit object.
  - The rightful-entitlement clause places the statement in a succession context.
  confidence: high
  alternatives_preserved:
  - I will give it to him.
  - I will place it on him.
translation_notes:
  risk_flags:
  - risk: “Royal rule” makes an implicit contextual object explicit.
    mitigation: The wording follows the POB lexical rationale and is documented as an interpretive expansion.
  - risk: Readers may identify the rightful ruler more specifically than the Hebrew does.
    mitigation: The main text leaves him unnamed, and the footnote presents the messianic view only as an interpretation.
