translation:
  language: en
  text: While they see false visions about you and practice divination that gives lies about you, you are to be placed on the necks of the wicked who have been killed.[a] Their day has come—the time of final punishment.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image “on the necks” is difficult; it may mean bringing you down among those already killed.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “the time of final guilt” or “the time of the iniquity of the end.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: false visions for you and divine lies for you
  simplified_phrase: false visions about you and practice divination that gives lies about you
  preserved_meaning: The diviners’ visions and divination concern the addressed figure and are false.
  reasoning_layer_used: POB lexical decisions for בַּחֲזוֹת, שָׁוְא, בִּקְסָם, and כָּזָב
  rationale: This avoids the confusing verb “divine” without making the addressed figure the recipient of spoken lies.
- pob_phrase: to place you on the necks of the slain wicked
  simplified_phrase: you are to be placed on the necks of the wicked who have been killed
  preserved_meaning: The addressed figure is placed in the difficult neck image without identifying who performs the action.
  reasoning_layer_used: POB lexical and theological decisions for לָתֵת אֹתָךְ, אֶל צַוְּארֵי, and חַלְלֵי רְשָׁעִים
  rationale: The passive wording keeps the agency unstated while unpacking “the slain wicked.”
- pob_phrase: whose day has come at the time of the punishment of the end
  simplified_phrase: Their day has come—the time of final punishment.
  preserved_meaning: Their appointed day of judgment has arrived as final punishment.
  reasoning_layer_used: POB lexical and theological decisions for אֲשֶׁר בָּא יוֹמָם and בְּעֵת עֲוֺן קֵץ
  rationale: A separate sentence makes the judgment clause easier to follow.
interpretive_expansions:
- pob_phrase: for you
  rendering: about you
  claim: The visions and divination concern the addressed figure rather than being spoken to it.
  evidence:
