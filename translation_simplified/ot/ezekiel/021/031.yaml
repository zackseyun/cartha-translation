    mitigation: The main text follows the POB meaning, while footnote b preserves the major alternatives.
  - risk: Readers may not recognize the leadership symbolism of the turban and crown.
    mitigation: Footnote a explains the likely priestly and royal associations without making the priestly sense certain.
