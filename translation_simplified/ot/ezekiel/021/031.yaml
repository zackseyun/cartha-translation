translation:
  language: en
  text: 'This is what the Lord Yahweh says: “Take away the turban[a] and remove the crown. Things will not stay as they are.[b] Raise up the lowly, and bring down the exalted.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The turban may be a priestly headdress, while the crown represents royal authority; both are symbols of established leadership.
    reason: cultural_note
  - marker: b
    text: Or, “This shall be no more,” or “Things will not be as they were.” The Hebrew is brief and emphasizes that the present order is being overturned.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The words are introduced as a direct declaration from God, using his covenant name.
  reasoning_layer_used: POB theological decision on the divine name
  rationale: The introduction uses ordinary English and follows the updated doctrine’s rendering of יהוה as Yahweh.
- pob_phrase: This will not remain the same
  simplified_phrase: Things will not stay as they are
  preserved_meaning: The present order will not continue unchanged.
  reasoning_layer_used: POB lexical and theological decisions on זֹאת לֹא זֹאת
  rationale: The terse declaration is made easier to follow without narrowing its documented ambiguity.
- pob_phrase: exalt the lowly, and humble the exalted
  simplified_phrase: Raise up the lowly, and bring down the exalted
  preserved_meaning: The command announces a complete reversal between those who are low and those who are high.
  reasoning_layer_used: POB lexical decisions on שׁפל and גבה
  rationale: Concrete up-and-down language preserves the source image in clear modern English.
translation_notes:
  risk_flags:
