  text: For there is a test.[a] What if even the scepter[b] that despises will not last? declares the Lord GOD.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is notably difficult, especially the clause about the scepter; another possible translation is, “For there is a test. What if even the despising scepter will be no more?”
