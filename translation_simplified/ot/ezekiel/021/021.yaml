simplification_decisions:
- pob_phrase: go to the right
  simplified_phrase: Move to the right
  preserved_meaning: The directional command remains direct and forceful.
  reasoning_layer_used: Lexical decision for הֵימִנִי
  rationale: “Move” states the directional command in natural English.
- pob_phrase: set yourself to the left
  simplified_phrase: take your position on the left
  preserved_meaning: The addressee is commanded to place itself toward the left.
  reasoning_layer_used: Lexical decisions for הָשִׂימִי and הַשְׂמִילִי
  rationale: This turns the awkward reflexive wording into a clear military command.
- pob_phrase: wherever your face is appointed
  simplified_phrase: wherever your face is directed
  preserved_meaning: The face image, directional sense, and unspecified passive determination remain intact.
  reasoning_layer_used: Lexical decisions and footnotes for פָּנַיִךְ and מֻעָדוֹת
  rationale: “Directed” clearly presents the direction as fixed without naming who fixed it.
