translation:
  language: en
  text: You are to mark out a road for the sword to advance against Rabbah of the Ammonites[a] and against Judah in fortified Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabbah was the chief city of the Ammonites.
    reason: cultural_note
  - marker: b
    text: Or “to Rabbah of the Ammonites and to Judah in fortified Jerusalem.” The Hebrew can express either movement toward these places or hostile advance against them.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You shall set a road
  simplified_phrase: You are to mark out a road
  preserved_meaning: Ezekiel is commanded to designate the route the invading army will take.
  reasoning_layer_used: Lexical rationale for דֶּרֶךְ and תָּשִׂים, together with the sign-act context.
  rationale: “Mark out” clearly describes the commanded action while preserving the road image.
- pob_phrase: for the sword to come
  simplified_phrase: for the sword to advance
  preserved_meaning: The sword is pictured moving in a military attack.
  reasoning_layer_used: Lexical decision for חֶרֶב and the immediate prophetic war context.
  rationale: “Advance” makes the hostile military movement clearer while retaining the sword image.
- pob_phrase: to Rabbah ... and to Judah
  simplified_phrase: against Rabbah ... and against Judah
  preserved_meaning: Rabbah and Judah in Jerusalem are parallel targets of the sword’s advance.
  reasoning_layer_used: Theological decision on the destinations and the POB lexical alternatives.
  rationale: “Against” conveys the hostility established by context, while the footnote preserves the movement-toward reading.
interpretive_expansions:
- pob_phrase: to Rabbah ... and to Judah
  rendering: against Rabbah ... and against Judah
  claim: Both places are direct targets of a hostile military advance.
  evidence:
  - The POB audit says both places are destinations or targets of the sword.
  - The immediate context is the sign-act of Babylon’s sword.
  confidence: high
  alternatives_preserved:
  - to Rabbah ... and to Judah
translation_notes:
  risk_flags:
  - risk: “Against” may appear to resolve the Hebrew’s movement-versus-hostility ambiguity.
    mitigation: Footnote b preserves the alternative wording with “to” and explains both possible forces.
  - risk: Readers may understand “the sword” only as a single weapon.
    mitigation: “Advance” signals the prophetic image of an attacking military force without replacing it.
