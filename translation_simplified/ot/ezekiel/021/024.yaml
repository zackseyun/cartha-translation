translation:
  language: en
  text: “Son of man, mark out two roads for the sword of the king of Babylon to travel. Both roads must start from the same land. Make a signpost and place it at the beginning of the road leading to the city.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to the beginning of the road or to its main junction.
    reason: alternative_reading
