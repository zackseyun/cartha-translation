  reasoning_layer_used: POB lexical decision for לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  rationale: “Travel” makes the road imagery natural while retaining the prophetic image of the sword.
- pob_phrase: both of them shall go out from one land
