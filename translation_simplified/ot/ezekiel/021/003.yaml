translation:
  language: en
  text: 'Say to the forest of the Negev[a], “Listen to the word of Yahweh. This is what the Lord GOD says: Look! I am setting a fire in you. It will burn up every green tree and every dry tree in you. The blazing flame will not go out, and it will scorch every face from south to north.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the forest of the southland.” The Hebrew may refer to the Negev region or to the south more generally.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear the word of Yahweh. Thus says the Lord GOD
  simplified_phrase: Listen to the word of Yahweh. This is what the Lord GOD says
  preserved_meaning: The forest is solemnly commanded to receive Yahweh’s prophetic message.
  reasoning_layer_used: POB lexical decisions for שְׁמַע and the divine names
  rationale: Ordinary speech makes the prophetic summons easier to understand while retaining Yahweh and the title Lord GOD.
- pob_phrase: Behold, I am kindling a fire in you
  simplified_phrase: Look! I am setting a fire in you
  preserved_meaning: God announces that he himself is beginning the destructive fire.
  reasoning_layer_used: POB lexical decisions for הִנְנִי and מַצִּית
  rationale: “Look” keeps the solemn attention signal, while “setting a fire” is more familiar than “kindling.”
- pob_phrase: it will consume in you every green tree and every dry tree. The blazing flame will not be quenched
  simplified_phrase: It will burn up every green tree and every dry tree in you. The blazing flame will not go out
  preserved_meaning: The fire will destroy all the trees, even green ones, and cannot be extinguished.
  reasoning_layer_used: POB fire-image lexical decisions and theological decision to retain the metaphor
  rationale: Familiar fire language clarifies the destruction without weakening the concrete judgment image.
translation_notes:
  risk_flags:
  - risk: “Look” is less elevated than “Behold.”
    mitigation: The exclamation and direct divine announcement preserve its force.
  - risk: “Will not go out” may sound less formal than “will not be quenched.”
    mitigation: The wording clearly preserves the unstoppable fire while improving immediate comprehension.
