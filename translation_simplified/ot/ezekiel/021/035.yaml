translation:
  language: en
  text: Return to your sheath.[a] I will judge you in the place where you were made—in the land you came from.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sword is addressed as if it were a person; the judgment falls on the people it represents.
    reason: source_note
simplification_decisions:
- pob_phrase: In the place where you were created
  simplified_phrase: in the place where you were made
  preserved_meaning: The sword will be judged where it was fashioned.
  reasoning_layer_used: Lexical decision for נִבְרֵאת and immediate sword imagery
  rationale: “Made” is clearer for a sword while preserving the Hebrew idea of being created.
- pob_phrase: in the land of your origins
  simplified_phrase: in the land you came from
  preserved_meaning: Judgment will occur in the addressee’s own land of origin.
  reasoning_layer_used: Lexical decision for בְּאֶרֶץ מְכֻרוֹתַיִךְ
  rationale: The new wording expresses “origins” in ordinary modern English.
- pob_phrase: In the place where you were created, in the land of your origins, I will judge you
  simplified_phrase: I will judge you in the place where you were made—in the land you came from
  preserved_meaning: God declares both the judgment and where it will happen.
  reasoning_layer_used: POB syntax and locative lexical decisions
  rationale: Reordering the sentence makes the judgment clear without changing its location.
translation_notes:
  risk_flags:
  - risk: Readers may take the personified sword as a literal person or miss whom it represents.
