simplification_decisions:
- pob_phrase: And I will pour out my indignation on you; with the fire of my wrath I will blow on you
  simplified_phrase: I will pour out my indignation on you. I will blow on you with the fire of my wrath.
  preserved_meaning: God’s judgment is pictured both as anger poured out and as fiery wrath blown upon them.
  reasoning_layer_used: Lexical and theological decisions for זַעַם, עֶבְרָה, and נפח
  rationale: Two sentences clarify the images while keeping the distinct terms “indignation” and “wrath.”
- pob_phrase: I will give you into the hand of
  simplified_phrase: I will hand you over to
  preserved_meaning: God will place them under the power of their attackers.
  reasoning_layer_used: Lexical decision for וּנְתַתִּיךְ בְּיַד
  rationale: The common English idiom states the same transfer of power more directly.
- pob_phrase: craftsmen of destruction
  simplified_phrase: who make destruction their craft
  preserved_meaning: The attackers are portrayed as practiced makers of ruin.
  reasoning_layer_used: Lexical decision for חָרָשֵׁי מַשְׁחִית
  rationale: This wording explains the artisan image without reducing it to a general statement about violence.
translation_notes:
  risk_flags:
  - risk: “Blow on you with the fire” may sound unusual in English.
    mitigation: The wording remains direct enough to preserve the source image of fire being stoked against them.
  - risk: “Make destruction their craft” could be read as approving their skill.
    mitigation: The surrounding judgment and the description “brutal” clearly present their work as ruinous.
