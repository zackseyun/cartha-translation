translation:
  language: en
  text: 'Son of man, proclaim this prophecy: “This is what the Lord GOD says: Say this: ‘A sword! A sword has been sharpened and polished.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “burnished.” The Hebrew describes a sword made smooth and gleaming for slaughter.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: prophesy and say
  simplified_phrase: proclaim this prophecy
  preserved_meaning: God commands Ezekiel to deliver a prophetic message.
  reasoning_layer_used: Lexical decisions for הִנָּבֵא and וְאָמַרְתָּ
  rationale: This recasts the paired command in direct, natural English without weakening its prophetic force.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord GOD says
  preserved_meaning: The message comes with the authority of the divine Lord.
  reasoning_layer_used: Theological decision on אֲדֹנָי and lexical decision on the messenger formula
  rationale: The modern formula is easier to understand while retaining the established divine title.
- pob_phrase: A sword, a sword, sharpened and also polished
  simplified_phrase: A sword! A sword has been sharpened and polished.
  preserved_meaning: The emphatically repeated sword is fully prepared for violent use.
  reasoning_layer_used: Lexical decisions for חֶרֶב חֶרֶב, הוּחַדָּה, and מְרוּטָה
  rationale: Two short exclamatory sentences preserve the repetition and make the completed preparation unmistakable.
translation_notes:
  risk_flags:
  - risk: Changing the first repeated “sword” into an exclamation may suggest stronger punctuation than the Hebrew specifies.
    mitigation: The repetition and emphatic force documented by POB remain fully present.
  - risk: Readers may take “polished” as merely decorative.
    mitigation: The footnote explains that the gleaming sword is being prepared for slaughter.
