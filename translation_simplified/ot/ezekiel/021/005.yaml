translation:
  language: en
  text: Then I said, “Oh, Lord GOD! They are saying about me,[a] ‘Isn’t he just speaking in parables?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They are saying to me.” The Hebrew can refer either to what people say about Ezekiel or to what they say to him.
    reason: alternative_reading
