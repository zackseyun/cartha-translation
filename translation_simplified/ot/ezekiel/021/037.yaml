translation:
  language: en
  text: You will become fuel for the fire. Your blood[a] will be within the land. You will be forgotten, because I, Yahweh, have spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “your bloodguilt.” The Hebrew literally says “your blood” and may imply bloodshed or bloodguilt here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You will be fuel for the fire
  simplified_phrase: You will become fuel for the fire
  preserved_meaning: The addressee is consigned to destruction by fire.
  reasoning_layer_used: Lexical decision for לָאֵשׁ לְאָכְלָה
  rationale: “Become” makes the coming judgment natural in modern English while retaining the fire-and-fuel image.
- pob_phrase: in the midst of the land
  simplified_phrase: within the land
  preserved_meaning: The blood remains publicly present inside the land.
  reasoning_layer_used: Lexical decision for בְּתוֹךְ הָאָרֶץ
  rationale: “Within” avoids the possible misunderstanding that the blood lies at the land’s exact center.
- pob_phrase: You will not be remembered
  simplified_phrase: You will be forgotten
  preserved_meaning: The addressee will pass into oblivion.
  reasoning_layer_used: Lexical decision for לֹא תִזָּכֵרִי
  rationale: The shorter passive wording states the same result in familiar English.
translation_notes:
  risk_flags:
  - risk: “Your blood” may refer to bloodguilt rather than blood alone.
    mitigation: The main text preserves the Hebrew image, and the footnote records the lexical alternative.
