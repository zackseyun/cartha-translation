translation:
  language: en
  text: Son of man, prophesy! Clap your hands[a]. Let the sword strike again, a third time[b]—the sword that leaves people slain, the sword of the great one who was slain. It closes in on them[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “strike palm to palm,” describing a prophetic gesture.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean that the sword strikes a third time or becomes threefold.
    reason: lexical_alternative
  - marker: c
    text: Or “penetrates them”; the Hebrew can describe pressing in, entering, or surrounding.
    reason: lexical_alternative
