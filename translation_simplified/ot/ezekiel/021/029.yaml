translation:
  language: en
  text: 'Therefore, this is what the Lord GOD says: Because you have exposed your transgressions, you have caused your guilt to be remembered. Your sins are visible in everything you do. Because you yourselves have been remembered, you will be seized in someone’s grasp.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew repeats forms of “remember” and ends with the image of being caught in someone’s hand.
    reason: source_note
simplification_decisions:
- pob_phrase: Because you have brought your guilt to remembrance by uncovering your transgressions
  simplified_phrase: Because you have exposed your transgressions, you have caused your guilt to be remembered
  preserved_meaning: Their transgressions are exposed, and this causes their guilt to be remembered.
  reasoning_layer_used: POB lexical decisions for זכר, גלה, and פשע
  rationale: The rewrite keeps exposure and transgressions distinct while stating the causal link plainly.
- pob_phrase: so that your sins are seen in all your deeds
  simplified_phrase: Your sins are visible in everything you do
  preserved_meaning: Their sins are evident throughout their conduct.
  reasoning_layer_used: POB lexical decisions for ראה, חטאות, and עלילות
  rationale: “Everything you do” expresses the full scope in common English.
- pob_phrase: you will be seized by the hand
  simplified_phrase: you will be seized in someone’s grasp
  preserved_meaning: They will be caught and held under judgment.
  reasoning_layer_used: POB footnote b and lexical decisions for כף and תפשׂ
  rationale: “Someone’s grasp” explains the capture idiom without identifying the unnamed captor.
interpretive_expansions:
- pob_phrase: by the hand
  rendering: in someone’s grasp
  claim: The hand image describes being caught in an unnamed captor’s grasp.
  evidence:
  - POB footnote b explains the phrase as being taken into an enemy’s grasp.
  - The lexical rationale identifies the wording as an idiom of capture.
  confidence: high
  alternatives_preserved:
  - caught in someone’s hand
  - seized by the hand
translation_notes:
  risk_flags:
  - risk: “Remembered” may imply that God had forgotten their guilt or the people.
    mitigation: The wording is retained to preserve the Hebrew repetition without asserting divine forgetfulness.
  - risk: “Someone’s grasp” makes the capture idiom clearer but leaves the agent unnamed.
    mitigation: This matches the Hebrew main text while the footnote preserves the hand image.
