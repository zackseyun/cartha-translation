  footnotes:
  - marker: a
    text: The Hebrew literally says “at the mother of the road,” meaning the place where the road branches.
    reason: lexical_alternative
  - marker: b
    text: Teraphim were cultic images used for divination; the term may also be rendered “household gods.”
    reason: cultural_note
