translation:
  language: en
  text: 'Then he told me, “The rooms on the north and south sides, across from the separate area, are holy rooms. There the priests who approach Yahweh in their service will eat the offerings counted as most holy. They will also place the most holy offerings there: the grain offering, the sin offering[a], and the guilt offering[b]. This is because the place is holy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.”
    reason: alternative_reading
  - marker: b
    text: Or “reparation offering.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The north chambers, the south chambers
  simplified_phrase: The rooms on the north and south sides
  preserved_meaning: The rooms are identified by their locations north and south of the temple area.
  reasoning_layer_used: The lexical decision allows “rooms” while preserving the directional designations.
  rationale: Common spatial wording is easier to picture than the compressed architectural phrase.
- pob_phrase: where ... shall eat ... There they shall place
  simplified_phrase: There ... will eat ... They will also place ... there
  preserved_meaning: The holy rooms are used both for eating and for placing the sacred offerings.
  reasoning_layer_used: The source syntax and lexical decisions distinguish the two required uses.
  rationale: Two direct sentences preserve both actions without the dense clause structure.
- pob_phrase: for the place is holy
  simplified_phrase: This is because the place is holy
  preserved_meaning: The holiness of the place explains why the offerings belong there.
  reasoning_layer_used: The lexical rationale identifies כִּי as giving the reason.
  rationale: The explicit connector makes the logic clear in modern English.
