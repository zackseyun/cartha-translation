    text: Or “The north entrance was in front of the long side.” The Hebrew allows several closely related descriptions of the entrance’s position.
    reason: lexical_alternative
  - marker: b
    text: A cubit was an ancient unit of length based on the length of the forearm.
    reason: cultural_note
