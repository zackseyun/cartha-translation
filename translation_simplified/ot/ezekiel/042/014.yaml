translation:
  language: en
  text: When the priests enter, they must not go from the holy place into the outer court while wearing the garments in which they serve as priests. They must leave those garments there because they are holy. Then they must put on other clothes before approaching the area for the people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is incomplete and may mean “what belongs to the people” or the area accessible to them.
    reason: alternative_reading
