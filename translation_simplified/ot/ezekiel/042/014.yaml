- pob_phrase: they shall not go out from the holy place into the outer court
  simplified_phrase: they must not go from the holy place into the outer court
  preserved_meaning: The priests are forbidden to move into the outer court before changing clothes.
  reasoning_layer_used: lexical decision and temple context
  rationale: “Must not go” states the directive naturally while retaining its force.
- pob_phrase: their garments in which they minister
  simplified_phrase: the garments in which they serve as priests
  preserved_meaning: The clothing is used specifically for priestly service.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Serve as priests” explains the cultic sense of “minister” without making it generic.
- pob_phrase: They shall put on other garments, and then approach what belongs to the people
  simplified_phrase: Then they must put on other clothes before approaching the area for the people
  preserved_meaning: They must change clothing before moving toward the sphere associated with the people.
  reasoning_layer_used: lexical rationale and documented alternative
  rationale: The recast makes the required sequence clear while the footnote preserves the Hebrew ambiguity.
