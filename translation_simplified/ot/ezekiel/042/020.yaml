translation:
  language: en
  text: He measured the area in all four directions.[a] A wall surrounded it, 500 cubits long and 500 cubits wide.[b] The wall separated the holy area from the common area.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on all four sides”; the Hebrew expression literally refers to the four winds.
    reason: lexical_alternative
  - marker: b
    text: A cubit was an ancient unit of length based on the distance from the elbow to the fingertips.
    reason: cultural_note
  - marker: c
    text: “Common” means not set apart as holy; it does not necessarily mean wicked or defiled.
    reason: lexical_alternative
simplification_decisions:
