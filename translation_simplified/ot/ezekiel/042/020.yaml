  simplified_phrase: He measured the area in all four directions
  preserved_meaning: He measured the enclosed complex in each of its four directions.
  reasoning_layer_used: Lexical decision for לְאַרְבַּע רוּחוֹת and immediate architectural context
  rationale: Naming the area avoids suggesting that only four separate wall faces were measured.
- pob_phrase: it had a wall all around
  simplified_phrase: A wall surrounded it
  preserved_meaning: A wall completely encircled the measured area.
  reasoning_layer_used: Lexical decision for חוֹמָה לוֹ סָבִיב סָבִיב
  rationale: The direct sentence clearly preserves the image of complete enclosure.
- pob_phrase: to make a separation between the holy and the common
  simplified_phrase: The wall separated the holy area from the common area
  preserved_meaning: The wall distinguished sacred space from space not set apart as holy.
  reasoning_layer_used: Lexical and theological decisions for לְהַבְדִּיל and בֵּין הַקֹּדֶשׁ לְחֹל
  rationale: Naming the wall clarifies its function while retaining the cultic contrast.
