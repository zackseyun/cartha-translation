translation:
  language: en
  text: In front of the rooms was a walkway ten cubits (about 17.5 feet or 5.3 meters) wide, leading toward the inner area.[a] There was also a passage one cubit (about 21 inches or 53 centimeters) wide.[b] The room entrances faced north.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “toward the inner” without naming the place; some translations understand this as the inner court.
    reason: alternative_reading
  - marker: b
    text: This Hebrew clause is difficult; it may mean “a passage one cubit wide,” while another reading gives one hundred cubits.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Before the chambers
  simplified_phrase: In front of the rooms
  preserved_meaning: The walkway lay directly before the rooms.
  reasoning_layer_used: The lexical alternatives permit “in front of” and “rooms” in this temple setting.
  rationale: Common building terms make the layout easier to picture.
- pob_phrase: a walkway ten cubits wide toward the inner court
  simplified_phrase: a walkway ten cubits (about 17.5 feet or 5.3 meters) wide, leading toward the inner area
  preserved_meaning: The broad walkway extended toward an inner place that the Hebrew does not name.
  reasoning_layer_used: The lexical rationale and footnote preserve the Hebrew omission after “inner.”
  rationale: The wording clarifies size and direction without assuming that the place was a court.
- pob_phrase: and a passage one cubit wide; and their entrances faced north
  simplified_phrase: There was also a passage one cubit (about 21 inches or 53 centimeters) wide. The room entrances faced north.
  preserved_meaning: A narrower passage is distinct from the walkway, and the rooms open northward.
  reasoning_layer_used: The lexical decisions distinguish the two paths and connect the entrances to the rooms.
  rationale: Two short sentences make the dimensions and orientation easier to follow.
interpretive_expansions:
- pob_phrase: ten cubits wide; one cubit wide
  rendering: ten cubits (about 17.5 feet or 5.3 meters) wide; one cubit (about 21 inches or 53 centimeters) wide
  claim: The approximate modern measurements use the longer cubit specified for Ezekiel’s vision.
  evidence:
  - Ezekiel 40:5 defines the vision’s measuring cubit as a standard cubit plus a handbreadth.
  - The original cubit measurements remain in the main text.
  confidence: moderate
  alternatives_preserved:
  - Ancient cubit estimates vary slightly.
  - The difficult second measurement may read one hundred cubits.
translation_notes:
  risk_flags:
