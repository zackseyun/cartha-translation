    mitigation: Footnote [a] preserves the possible court interpretation without adding an unstated noun.
  - risk: The one-cubit measurement comes from a difficult Hebrew clause.
    mitigation: Footnote [b] preserves the uncertainty and the one-hundred-cubit alternative.
