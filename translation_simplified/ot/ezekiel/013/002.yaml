translation:
  language: en
  text: Son of man, prophesy against Israel’s prophets who are prophesying. Say to those whose prophecies come from their own hearts, “Listen to the word of Yahweh.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the prophets of Israel who are prophesying
  simplified_phrase: Israel’s prophets who are prophesying
  preserved_meaning: They are Israel’s purported prophets and are actively delivering prophetic messages.
  reasoning_layer_used: Lexical decisions for נְבִיאֵי יִשְׂרָאֵל and הַנִּבָּאִים
  rationale: The possessive form is natural English, while “prophesying” preserves the full range of prophetic speech.
- pob_phrase: those who prophesy from their own hearts
  simplified_phrase: those whose prophecies come from their own hearts
  preserved_meaning: Their messages arise from themselves rather than from Yahweh.
  reasoning_layer_used: Lexical and theological decisions for לִנְבִיאֵי מִלִּבָּם
  rationale: This keeps the heart image while clearly identifying the source of their messages.
- pob_phrase: Hear the word of Yahweh
  simplified_phrase: Listen to the word of Yahweh
  preserved_meaning: They must receive Yahweh’s authoritative message attentively.
  reasoning_layer_used: Lexical decisions for שִׁמְעוּ, דְּבַר, and יְהוָה
  rationale: “Listen” expresses attentive hearing in common English while retaining the prophetic formula and divine name.
translation_notes:
  risk_flags:
  - risk: “Israel’s prophets” could be mistaken for Yahweh’s endorsement of them.
    mitigation: The command against them and the statement that their messages come from their own hearts preserve the intended irony.
