translation:
  language: en
  text: So I will pour out all my wrath against the wall and against those who covered it with whitewash.[a] Then I will tell you, “The wall is gone, and so are those who covered it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “covered it with weak mortar.” The Hebrew describes a superficial or inferior coating.
    reason: lexical_alternative
