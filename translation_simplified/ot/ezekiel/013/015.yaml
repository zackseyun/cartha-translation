  reasoning_layer_used: Lexical decision for וְכִלֵּיתִי and חֲמָתִי.
  rationale: The concrete wording makes the complete outpouring of divine wrath easier to grasp.
- pob_phrase: those who plastered it with whitewash
  simplified_phrase: those who covered it with whitewash
  preserved_meaning: They put a deceptive surface coating on the wall.
  reasoning_layer_used: Lexical decisions for טוח and תָּפֵל.
  rationale: “Covered” is common English while retaining the wall-and-whitewash image.
- pob_phrase: The wall is no more, and those who plastered it are no more
  simplified_phrase: The wall is gone, and so are those who covered it
  preserved_meaning: Both the wall and the people who coated it are removed by judgment.
  reasoning_layer_used: Lexical decisions for both אֵין clauses.
  rationale: The shorter parallel wording clearly preserves the solemn declaration of their disappearance.
