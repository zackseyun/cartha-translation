translation:
  language: en
  text: I will tear down the wall you covered with whitewash.[a] I will level it to the ground and expose its foundation. The wall will collapse, and you will be destroyed inside it. Then you will know that I am Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “covered with flimsy mortar.” The Hebrew describes a deceptive, superficial coating.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wall that you plastered with whitewash
  simplified_phrase: the wall you covered with whitewash
  preserved_meaning: The wall remains covered by a deceptive coating that hides its weakness.
  reasoning_layer_used: POB lexical decision for טַחְתֶּם תָּפֵל
  rationale: “Covered” is more familiar than “plastered” while preserving the whitewash image.
- pob_phrase: bring it down to the ground, so that its foundation is laid bare
  simplified_phrase: level it to the ground and expose its foundation
  preserved_meaning: The wall is demolished to ground level and its hidden foundation becomes visible.
  reasoning_layer_used: POB lexical decisions for וְהִגַּעְתִּיהוּ אֶל הָאָרֶץ and וְנִגְלָה יְסֹדוֹ
  rationale: Direct verbs make the destruction and exposure easier to picture.
- pob_phrase: It will fall, and you will perish within it
  simplified_phrase: The wall will collapse, and you will be destroyed inside it
  preserved_meaning: The wall falls and those inside it are brought to ruin without limiting the judgment to physical death.
  reasoning_layer_used: POB lexical decisions for וְנָפְלָה and וּכְלִיתֶם בְּתוֹכָהּ
  rationale: Naming the wall clarifies the reference, while “destroyed” preserves the broad judgment.
