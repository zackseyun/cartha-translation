translation:
  language: en
  text: 'Therefore, this is what the Lord GOD says: “Look! I am against your magic bands.[a] You use them to hunt people as though they were birds. I will tear the bands from your arms and set free the people you hunt like birds.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may mean cushions, bands, or amulets. Its exact meaning is uncertain, but it likely refers to ritual objects used by these false prophetesses.
    reason: lexical_alternative
