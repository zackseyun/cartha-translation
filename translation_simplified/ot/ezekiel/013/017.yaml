translation:
  language: en
  text: Now, son of man, turn toward the daughters of your people[a] and confront them. They are speaking prophecies that come from their own hearts.[b] Prophesy against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the women of your people; the Hebrew specifically says “daughters.”
    reason: lexical_alternative
  - marker: b
    text: Their messages come from themselves rather than from the LORD.
    reason: cultural_note
simplification_decisions:
- pob_phrase: set your face against
  simplified_phrase: turn toward ... and confront them
  preserved_meaning: Ezekiel must deliberately face these women in opposition.
  reasoning_layer_used: POB lexical decision on שִׂים פָּנֶיךָ אֶל
  rationale: This recasts the prophetic idiom as a clear action while retaining its movement and hostile force.
- pob_phrase: the daughters of your people who prophesy
  simplified_phrase: the daughters of your people. They are speaking prophecies
  preserved_meaning: The women are engaged in prophetic activity.
  reasoning_layer_used: POB lexical and theological decisions on בְּנוֹת עַמְּךָ and הַמִּתְנַבְּאוֹת
  rationale: Two sentences make the description easier to follow without labeling their activity falsely.
- pob_phrase: out of their own hearts
  simplified_phrase: come from their own hearts
  preserved_meaning: The prophecies originate within the women themselves.
  reasoning_layer_used: POB lexical decision on מִלִּבְּהֶן
  rationale: The new wording makes the source of the messages clearer while retaining the biblical heart image.
interpretive_expansions:
- pob_phrase: out of their own hearts
  rendering: Their messages come from themselves rather than from the LORD.
  claim: The women themselves, not the LORD, are the source of these messages.
  evidence:
  - The POB lexical rationale and footnote explicitly identify this contrast.
  confidence: high
  alternatives_preserved:
  - The main text does not add “falsely” or “pretend to prophesy.”
translation_notes:
  risk_flags:
  - risk: “Daughters” may sound as though only young girls are meant.
    mitigation: Footnote a explains that the phrase refers to the women among the people.
  - risk: “Confront” could obscure the Hebrew face image.
    mitigation: “Turn toward” retains the physical movement while “confront” preserves its oppositional force.
