translation:
  language: en
  text: They see false visions, and their divination is a lie. They say, “A declaration from Yahweh,” even though Yahweh has not sent them. Yet they expect their message to come true.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They have seen falsehood and lying divination
  simplified_phrase: They see false visions, and their divination is a lie
  preserved_meaning: Their supposed prophetic visions and divination are false and deceptive.
  reasoning_layer_used: Lexical decisions for חָזוּ, שָׁוְא, and קֶסֶם כָּזָב
  rationale: The rewrite makes the prophetic sense of seeing clear while retaining divination and its moral charge.
- pob_phrase: Declaration of Yahweh
  simplified_phrase: A declaration from Yahweh
  preserved_meaning: They falsely present their message as a solemn pronouncement authorized by Yahweh.
  reasoning_layer_used: Theological decision on נְאֻם יְהוָה and the divine name
  rationale: The wording remains a formal prophetic claim while reading naturally in its quoted setting.
- pob_phrase: they hope for the fulfillment of the word
  simplified_phrase: they expect their message to come true
  preserved_meaning: They anticipate that the prophecy they spoke will be confirmed by events.
  reasoning_layer_used: Lexical decisions for וְיִחֲלוּ and לְקַיֵּם דָּבָר
  rationale: Common wording replaces the abstract phrase without weakening their expectation of fulfillment.
