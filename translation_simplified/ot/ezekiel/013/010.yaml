translation:
  language: en
  text: This is because—yes, because—they have led my people astray. They say, “Peace,” when there is no peace. When someone builds a wall, look! They coat it with whitewash.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “untempered mortar”; the Hebrew describes a superficial coating.
    reason: lexical_alternative
