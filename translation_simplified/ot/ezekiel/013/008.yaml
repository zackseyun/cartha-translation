simplification_decisions:
- pob_phrase: Therefore thus says
  simplified_phrase: So this is what ... says
  preserved_meaning: The words introduce an authoritative divine pronouncement resulting from what came before.
  reasoning_layer_used: Lexical decision for לָכֵן and the prophetic messenger formula כֹּה אָמַר.
  rationale: The common English formula keeps both the causal link and prophetic authority.
- pob_phrase: spoken falsehood
  simplified_phrase: spoken what is false
  preserved_meaning: The prophets are guilty of deceptive speech.
  reasoning_layer_used: Lexical decision for שָׁוְא.
  rationale: The wording replaces an abstract noun with direct everyday English.
- pob_phrase: therefore behold, I am against you
  simplified_phrase: I am against you
  preserved_meaning: God announces hostile opposition as the consequence of their deception.
  reasoning_layer_used: Lexical decision for הִנְנִי אֲלֵיכֶם and the repeated causal structure.
  rationale: The because-clause makes the consequence clear while the direct threat retains its force.
interpretive_expansions:
