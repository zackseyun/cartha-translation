  - The following clauses also deny enrollment and entry.
  confidence: high
  alternatives_preserved:
  - assembly of my people
  - secret council of my people
- pob_phrase: register of the house of Israel
  rendering: Israel’s official record
  claim: The register is an official list rather than writing in general.
  evidence:
