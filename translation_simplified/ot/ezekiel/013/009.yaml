translation:
  language: en
  text: I will act against the prophets who see false visions and practice false divination. They will not be part of my people’s council.[a] They will not be listed in Israel’s official record, and they will not enter the land of Israel. Then you will know that I am the Lord Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “assembly” or “secret council.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title is “Lord Yahweh,” traditionally rendered “Lord GOD.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: my hand will be against
  simplified_phrase: I will act against
  preserved_meaning: God will actively oppose and judge these prophets.
  reasoning_layer_used: POB lexical decision on וְהָיְתָה יָדִי אֶל
  rationale: The active wording clearly conveys the force of the Hebrew idiom.
- pob_phrase: who see falsehood and who practice lying divination
  simplified_phrase: who see false visions and practice false divination
  preserved_meaning: Their claimed visions and divination are false without assigning an unstated motive.
  reasoning_layer_used: POB lexical decisions on הַחֹזִים שָׁוְא and וְהַקֹּסְמִים כָּזָב
  rationale: This keeps both prophetic activities distinct and avoids implying purpose.
- pob_phrase: written in the register of the house of Israel
  simplified_phrase: listed in Israel’s official record
  preserved_meaning: They will be excluded from Israel’s recognized written roll.
  reasoning_layer_used: POB lexical decisions on וּבִכְתָב בֵּית יִשְׂרָאֵל and לֹא יִכָּתֵבוּ
  rationale: “Official record” makes the administrative sense of “register” clear.
interpretive_expansions:
- pob_phrase: in the council of my people
  rendering: part of my people’s council
  claim: The judgment excludes these prophets from the recognized community council.
  evidence:
