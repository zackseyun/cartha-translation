  confidence: high
  alternatives_preserved:
  - record of the house of Israel
  - written roll of the house of Israel
translation_notes:
  risk_flags:
  - risk: “Council” does not convey every possible sense of the Hebrew סוד.
    mitigation: Footnote a preserves the assembly and secret-council alternatives.
  - risk: “Lord Yahweh” may be unfamiliar to readers used to “Lord GOD.”
    mitigation: Footnote b gives the traditional rendering while retaining the divine name.
