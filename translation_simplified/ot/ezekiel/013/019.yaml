translation:
  language: en
  text: You have treated me as unholy among my people for handfuls of barley and pieces of bread. By lying to my people, who listen to lies, you put to death people who should not die and keep alive people who should not live.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you have profaned me among my people
  simplified_phrase: you have treated me as unholy among my people
  preserved_meaning: Their conduct violated God's holiness in the eyes of his people.
  reasoning_layer_used: lexical decision for וַתְּחַלֶּלְנָה and אֹתִי אֶל־עַמִּי
  rationale: The wording explains the religious force of “profaned” in common English.
- pob_phrase: putting to death persons ... and keeping alive persons
  simplified_phrase: you put to death people ... and keep alive people
  preserved_meaning: Their lies reverse the proper judicial outcomes of death and life.
  reasoning_layer_used: lexical and theological decisions for נְפָשׁוֹת and the death/life clauses
  rationale: Direct verbs and “people” make the parallel easier to follow without suggesting disembodied souls.
- pob_phrase: by your lying to my people, who listen to lies
  simplified_phrase: By lying to my people, who listen to lies
  preserved_meaning: Their deception is the means by which they harm a receptive audience.
  reasoning_layer_used: lexical decisions for בְּכַזֶּבְכֶם and שֹׁמְעֵי כָזָב
  rationale: The active clause is clearer while preserving both the deception and the people's receptiveness.
translation_notes:
  risk_flags:
  - risk: “Put to death” may sound like direct physical execution rather than the effect of false prophetic verdicts.
    mitigation: The surrounding phrase “By lying” keeps the action tied to deceptive prophecy without narrowing its consequences.
  - risk: “Should not” can express either moral wrongness or an improper judicial outcome.
    mitigation: This wording deliberately preserves the POB's documented judicial-moral ambiguity.
