translation:
  language: en
  text: For her blood is within her[a]. She put it on bare rock[b]. She did not pour it onto the ground to cover it with dust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “her guilt for bloodshed,” but the Hebrew uses the concrete image of blood.
    reason: lexical_alternative
  - marker: b
    text: Blood was to be covered with earth; here it is left openly visible on bare rock.
    reason: cultural_note
simplification_decisions:
- pob_phrase: her blood is in her midst
  simplified_phrase: her blood is within her
  preserved_meaning: Jerusalem is pictured as containing the blood connected with her violence.
  reasoning_layer_used: Lexical decisions for דָמָהּ and בְּתוֹכָהּ
  rationale: “Within her” is clear modern English and retains the city image without adding a vague location.
- pob_phrase: she set it on a bare rock
  simplified_phrase: She put it on bare rock
  preserved_meaning: The blood was deliberately left on an exposed rock surface.
  reasoning_layer_used: Lexical decisions for שָׂמָתְהוּ and עַל צְחִיחַ סֶלַע
  rationale: “Put” is more common than “set” and preserves the concrete action.
- pob_phrase: She did not pour it out on the ground to cover it with dust
  simplified_phrase: She did not pour it onto the ground to cover it with dust
  preserved_meaning: She did not pour the blood where it could be covered with soil.
  reasoning_layer_used: Lexical decisions for שׁפך, הָאָרֶץ, and עָפָר
  rationale: The direct negation and purpose remain intact while “onto” reads naturally.
translation_notes:
  risk_flags:
  - risk: Readers may understand “blood” only as a physical substance and miss its link to violent guilt.
    mitigation: Footnote [a] preserves the bloodguilt alternative without replacing the concrete image.
  - risk: Modern readers may not understand why covering blood with dust matters.
    mitigation: Footnote [b] explains the practice and the significance of leaving the blood exposed.
