  text: I am Yahweh. I have spoken. The judgment I announced is coming, and I will carry it out. I will not hold back, spare you, or relent. They will judge you[a] according to how you have lived and what you have done, declares the Lord GOD.
  philosophy: optimal-equivalence
  footnotes:
