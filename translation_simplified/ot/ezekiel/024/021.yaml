  preserved_meaning: The prophetic formula introduces an imminent divine action while naming Yahweh.
  reasoning_layer_used: POB lexical decisions for the prophetic formula and הִנְנִי, plus the updated divine-name doctrine
  rationale: Natural English replaces archaic wording, and “Yahweh” follows the stated theological decision.
- pob_phrase: profane my sanctuary
  simplified_phrase: treat my sanctuary as unholy
  preserved_meaning: God will cause his sacred sanctuary to be treated as common rather than holy.
  reasoning_layer_used: POB lexical decision for מְחַלֵּל
