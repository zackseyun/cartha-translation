translation:
  language: en
  text: 'Say to the house of Israel, ‘This is what the Lord Yahweh says: I am about to treat my sanctuary as unholy—what you proudly depend on for strength, the delight of your eyes, and what your souls cherish.[a] Your sons and daughters whom you left behind will fall by the sword.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “what your soul pities or spares.”
    reason: lexical_alternative
