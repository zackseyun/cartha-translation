translation:
  language: en
  text: Then put the empty pot on the coals. Heat it until its bronze glows, so that the uncleanness inside it melts away and its corrosion[a] is completely consumed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rust” or “scum.” The word describes corrosion or foul residue on the pot, representing Jerusalem’s moral defilement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then set it empty on its coals
  simplified_phrase: Then put the empty pot on the coals
  preserved_meaning: The emptied bronze pot is placed directly over the burning coals.
  reasoning_layer_used: Lexical decisions for the pot, coals, and רֵקָה
  rationale: Naming the pot and using ordinary word order makes the action immediately clear.
- pob_phrase: so that it may become hot and its bronze may glow
  simplified_phrase: Heat it until its bronze glows
  preserved_meaning: The pot is heated intensely enough for its metal to glow.
  reasoning_layer_used: Lexical decisions for לְמַעַן תֵּחַם and וְחָרָה נְחֻשְׁתָּהּ
  rationale: A direct command and result clause express the same heating process more naturally.
- pob_phrase: its uncleanness within it may be melted, and its corrosion consumed
  simplified_phrase: the uncleanness inside it melts away and its corrosion is completely consumed
  preserved_meaning: Heat removes both the pot’s defiling residue and its metal corrosion.
  reasoning_layer_used: Lexical and theological decisions on impurity and metallurgical imagery
  rationale: Clearer clause order preserves both the physical pot image and its moral force.
translation_notes:
  risk_flags:
  - risk: Readers may understand “uncleanness” as only physical dirt.
