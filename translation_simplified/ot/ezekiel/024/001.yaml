translation:
  language: en
  text: 'In the ninth year[a], on the tenth day of the tenth month, Yahweh spoke to me:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says only “the ninth year.” Ezekiel usually dates events from King Jehoiachin’s exile.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the word of Yahweh came to me
  simplified_phrase: Yahweh spoke to me
  preserved_meaning: Yahweh communicated his word directly to Ezekiel.
  reasoning_layer_used: The lexical rationale identifies this as the standard prophetic formula for divine speech.
  rationale: The active wording is easier to understand while preserving Yahweh as the speaker.
- pob_phrase: in the tenth month, on the tenth day of the month
  simplified_phrase: on the tenth day of the tenth month
  preserved_meaning: The event occurred on day ten of month ten.
  reasoning_layer_used: The calendrical lexical decisions establish both the month and the day within it.
  rationale: Combining the repeated date phrases gives the same date more naturally.
- pob_phrase: saying,
  simplified_phrase: ':'
  preserved_meaning: The verse introduces Yahweh’s speech in the next verse.
  reasoning_layer_used: The lexical rationale says the term introduces the divine speech that follows.
  rationale: A colon naturally signals that the following words are what Yahweh said.
translation_notes:
  risk_flags:
  - risk: “Yahweh spoke” is less formally worded than the prophetic image “the word of Yahweh came.”
    mitigation: It retains divine speech, the personal name Yahweh, and the transition to the message.
