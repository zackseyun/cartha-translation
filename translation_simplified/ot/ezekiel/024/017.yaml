- pob_phrase: do not make mourning for the dead
  simplified_phrase: do not carry out the mourning rites for the dead
  preserved_meaning: Ezekiel must not perform the customary acts of mourning.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Carry out the mourning rites” makes the ritual sense clear without explaining their theology.
- pob_phrase: Bind your turban on yourself
  simplified_phrase: Wrap your turban on your head
  preserved_meaning: Ezekiel is to put on his dignified head covering rather than dress as a mourner.
  reasoning_layer_used: lexical decision for פְאֵרְךָ and חֲבוֹשׁ עָלֶיךָ
  rationale: The natural wording retains both the turban and the physical act of wrapping it.
- pob_phrase: the bread of men
  simplified_phrase: the food others bring to mourners
  preserved_meaning: Ezekiel must not eat food supplied in connection with mourning.
  reasoning_layer_used: lexical decision and immediate mourning context
  rationale: The contextual meaning replaces an opaque literal phrase while the footnote preserves it.
