translation:
  language: en
  text: Groan in silence, but do not carry out the mourning rites for the dead. Wrap your turban on your head, and put your sandals on your feet. Do not cover your mustache[a], and do not eat the food others bring to mourners.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “upper lip”; the Hebrew may refer to that area rather than specifically to facial hair.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “the bread of men,” likely meaning food provided by others for mourners.
    reason: lexical_alternative
