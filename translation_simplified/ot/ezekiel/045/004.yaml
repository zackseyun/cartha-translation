translation:
  language: en
  text: This sacred part of the land will belong to the priests who serve in the sanctuary and draw near to minister to Yahweh. It will provide a place for their homes and a holy area for the sanctuary.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compact and may mean “a consecrated area belonging to the sanctuary.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a holy portion of the land
  simplified_phrase: This sacred part of the land
  preserved_meaning: The land is a defined portion set apart as holy.
  reasoning_layer_used: lexical decision for קֹדֶשׁ and מִן הָאָרֶץ
  rationale: “Sacred part” expresses the land-allotment sense in common English.
- pob_phrase: the priests, the ministers of the sanctuary
  simplified_phrase: the priests who serve in the sanctuary
  preserved_meaning: These priests perform formal service in the sanctuary.
  reasoning_layer_used: lexical decision for מְשָׁרְתֵי הַמִּקְדָּשׁ
  rationale: The relative clause avoids the potentially misleading modern title “ministers.”
- pob_phrase: a place for houses and as a holy place for the sanctuary
  simplified_phrase: a place for their homes and a holy area for the sanctuary
  preserved_meaning: The allotment provides priestly housing and consecrated space associated with the sanctuary.
  reasoning_layer_used: lexical decisions for מָקוֹם לְבָתִּים and וּמִקְדָּשׁ לַמִּקְדָּשׁ
  rationale: “Homes” and “holy area” clarify the residential and sacred uses without specifying architecture.
