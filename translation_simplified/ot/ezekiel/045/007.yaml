translation:
  language: en
  text: The prince will receive land on both sides of the holy district and the city’s property. His land will lie alongside these areas. The western part will extend westward from the west side of these areas, and the eastern part will extend eastward from their east side. It will stretch from the western border to the eastern border, matching the length of one tribal portion.
  philosophy: optimal-equivalence
