  text: For the grain offering, he must provide about a bushel of grain for each bull and each ram, along with about a gallon of oil for each bushel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew measurements are one ephah for each animal and one hin of oil for each ephah; an ephah was about a bushel, and a hin was about a gallon.
