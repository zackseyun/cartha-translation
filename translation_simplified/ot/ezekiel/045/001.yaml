translation:
  language: en
  text: When you divide the land and assign it as an inheritance[a], set aside part of it as a contribution to Yahweh. This holy area must be about eight miles long and three miles wide.[b] The entire area within these boundaries will be holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “divide the land by lot as an inheritance.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “25,000 cubits long and 10,000 cubits wide.” Cubit lengths varied, so the modern distances are approximate.'
    reason: cultural_note
