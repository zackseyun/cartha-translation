translation:
  language: en
  text: Do the same on the seventh day of the month for anyone who sins without meaning to or who is naive or inexperienced.[a] In this way you will make atonement for the temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew may refer to two groups: a person who sins unintentionally and a naive or inexperienced person; it may also describe sin arising from naivety.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And so you shall do
  simplified_phrase: Do the same
  preserved_meaning: The command refers back to the purification rite described previously.
  reasoning_layer_used: POB lexical decisions for וְכֵן and תַּעֲשֶׂה
  rationale: The shorter wording makes the backward link clear in ordinary English.
- pob_phrase: who sins unintentionally
  simplified_phrase: who sins without meaning to
  preserved_meaning: The offense is inadvertent rather than deliberate.
  reasoning_layer_used: POB lexical decision for שֹׁגֶה
  rationale: This replaces formal legal wording with a familiar expression.
- pob_phrase: or through simplicity
  simplified_phrase: or who is naive or inexperienced
  preserved_meaning: The Hebrew may identify a naive or inexperienced person rather than merely explain a sin's cause.
  reasoning_layer_used: POB lexical decision, theological decision, and footnote for פֶּתִי
  rationale: The person-description avoids presenting naivety only as a motive or manner of sin.
translation_notes:
  risk_flags:
  - risk: The Hebrew may describe either two kinds of people or two circumstances behind an offense.
    mitigation: Footnote a preserves both live interpretations.
  - risk: Readers may assume the atonement is made directly for the people.
    mitigation: The second sentence keeps the temple as the explicit object of atonement.
