translation:
  language: en
  text: From this allotment, a square area measuring 500 cubits on each side will be set apart for the holy place.[a] Around it must be a strip of open land 50 cubits wide.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sanctuary”; the Hebrew may refer to the sacred area generally, not only the sanctuary building.
    reason: lexical_alternative
  - marker: b
    text: A cubit was an ancient measure of length, about 18 inches (45 centimeters).
    reason: cultural_note
