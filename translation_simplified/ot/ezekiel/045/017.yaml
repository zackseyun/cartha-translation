translation:
  language: en
  text: The prince is responsible for supplying the burnt offerings, grain offering, and drink offering at every feast, new-moon observance, Sabbath, and other appointed time of the house of Israel. He must provide the sin offering[a], grain offering, burnt offering, and peace offerings[b] to make atonement for the house of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also be translated “purification offering.”
    reason: lexical_alternative
  - marker: b
    text: Or “fellowship offerings” or “offerings of well-being.”
    reason: lexical_alternative
