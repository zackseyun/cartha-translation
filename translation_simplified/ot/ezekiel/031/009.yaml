    mitigation: The lexical rationale permits either an instrumental or descriptive connection.
  - risk: The pronoun “it” may obscure the Assyrian ruler represented by the tree.
    mitigation: The main text preserves the POB tree metaphor, while footnote [a] records the personal alternative.
