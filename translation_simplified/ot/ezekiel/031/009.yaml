simplification_decisions:
- pob_phrase: with its many branches
  simplified_phrase: with so many branches
  preserved_meaning: The tree's abundance of branches contributed to its beauty.
  reasoning_layer_used: The lexical rationale permits an instrumental or descriptive connection between the branches and the tree's beauty.
  rationale: “So many” expresses abundance in direct, common English without specifying how the branches came to be there.
- pob_phrase: all the trees of Eden that were in the garden of God
  simplified_phrase: all the trees of Eden in the garden of God
  preserved_meaning: The other trees belong to the Eden imagery and are located in God's garden.
  reasoning_layer_used: The lexical decision preserves both “trees of Eden” and the elevated phrase “garden of God.”
  rationale: Removing the heavy relative clause improves flow without losing the imagery or location.
translation_notes:
  risk_flags:
