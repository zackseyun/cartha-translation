translation:
  language: en
  text: At the sound of his fall, I made the nations quake when I brought him down to Sheol[a] with those who descend into the pit. In the earth beneath, all the trees of Eden were comforted[b]—the finest and best of Lebanon, all the trees that drink water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; it may also be translated “the grave” or “the underworld.”
    reason: lexical_alternative
  - marker: b
    text: Or “were consoled” or “took comfort”; the other fallen powers may find grim comfort when this great tree falls too.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with those who go down to the pit
  simplified_phrase: with those who descend into the pit
  preserved_meaning: He joins the dead who enter the pit of death.
  reasoning_layer_used: Lexical decision for אֶת יֹרְדֵי בוֹר
  rationale: “Descend into” states the downward movement more directly while preserving the pit image.
- pob_phrase: the choice and best of Lebanon
  simplified_phrase: the finest and best of Lebanon
  preserved_meaning: These are Lebanon’s most excellent trees.
  reasoning_layer_used: Lexical decision for מִבְחַר וְטוֹב לְבָנוֹן
  rationale: “Finest” replaces the formal adjective “choice” without weakening the superlative force.
- pob_phrase: and all the trees of Eden ... were comforted
  simplified_phrase: In the earth beneath, all the trees of Eden were comforted
  preserved_meaning: The trees representing fallen powers receive comfort in the realm below.
  reasoning_layer_used: Theological decision on the comfort of the trees
  rationale: The reordered sentence makes the location and main action easier to follow without resolving the image.
translation_notes:
  risk_flags:
