translation:
  language: en
  text: Who among the trees of Eden was like you in glory and greatness? Yet you will be brought down with Eden’s trees to the land of the dead below.[a] You will lie among the uncircumcised,[b] with those killed by the sword. This is what will happen to Pharaoh and all his multitude, declares the Lord Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the land below”; the phrase refers to the realm of the dead.
    reason: lexical_alternative
  - marker: b
    text: In Ezekiel’s judgment language, “uncircumcised” is a shame-laden term, especially for foreign peoples.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Whom were you like in glory and greatness among the trees of Eden?
  simplified_phrase: Who among the trees of Eden was like you in glory and greatness?
  preserved_meaning: The rhetorical question compares the ruler with the majestic trees of Eden without limiting the comparison to one tree.
  reasoning_layer_used: Lexical decisions for דָמִיתָ and עֲצֵי עֵדֶן
  rationale: The reordered question is natural English while preserving the plural comparison and tree metaphor.
- pob_phrase: you shall be brought down with the trees of Eden
  simplified_phrase: you will be brought down with Eden’s trees
  preserved_meaning: The ruler will share the trees’ imposed downfall.
  reasoning_layer_used: Lexical decision for וְהוּרַדְתָּ
  rationale: “Will” is clearer modern English and retains the passive prophetic judgment.
- pob_phrase: those slain by the sword
  simplified_phrase: those killed by the sword
  preserved_meaning: The ruler will lie with people who died violently by the sword.
  reasoning_layer_used: Lexical decision for חַלְלֵי חֶרֶב
  rationale: “Killed” is more common than “slain” and preserves the violent image.
interpretive_expansions:
- pob_phrase: the land below
  rendering: the land of the dead below
  claim: The downward land imagery refers to the realm of the dead.
  evidence:
  - The POB lexical rationale identifies the phrase as the realm of the dead.
  - The immediate context places the ruler with those killed by the sword.
  confidence: high
  alternatives_preserved:
  - the land below
  - the lower earth
  - the netherworld
- pob_phrase: This is Pharaoh and all his multitude
  rendering: This is what will happen to Pharaoh and all his multitude
  claim: The closing statement applies the preceding judgment to Pharaoh and his multitude.
  evidence:
  - The POB rationale says the clause sums up the oracle.
  - The preceding clauses predict Pharaoh’s descent and death.
  confidence: high
  alternatives_preserved:
  - This is Pharaoh and all his multitude
  - Such is Pharaoh and all his hordes
translation_notes:
  risk_flags:
  - risk: “Land of the dead” could suggest a more precise doctrinal geography than the Hebrew gives.
    mitigation: “Below” retains the spatial image, and footnote a supplies the literal wording.
  - risk: “Uncircumcised” may be mistaken for a merely physical description or a complete judgment of individual covenant status.
    mitigation: Footnote b explains its shame-laden rhetorical force without defining each person’s covenant standing.
