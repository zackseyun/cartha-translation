  rationale: “Tower high” expresses great height in clear language while keeping the tree image.
- pob_phrase: its planting place
  simplified_phrase: the ground where it was planted
  preserved_meaning: The rivers surrounded the tree’s planted location.
  reasoning_layer_used: Lexical decision for מַטָּעָהּ
  rationale: The recast phrase explains the agricultural expression in ordinary English.
- pob_phrase: it sent out its channels
  simplified_phrase: the deep sent out channels of water
  preserved_meaning: The deep extended branching watercourses to the field’s trees.
  reasoning_layer_used: Pronoun-reference decision and lexical decisions for תְּעָלֹתֶיהָ and שִׁלְחָה
  rationale: Naming the deep removes an unclear pronoun without collapsing the metaphor into its political referent.
