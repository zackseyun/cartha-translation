- pob_phrase: Foreigners, the ruthless of the nations
  simplified_phrase: Ruthless foreigners from among the nations
  preserved_meaning: The tree was cut down by violent people from foreign nations.
  reasoning_layer_used: POB lexical decisions for זָרִים and עָרִיצֵי גוֹיִם
  rationale: Reordering the phrase makes the attackers easier to identify without adding a superlative.
- pob_phrase: its boughs were broken in all the channels of the land
  simplified_phrase: Its large branches were broken in all the streambeds of the land
  preserved_meaning: The tree’s larger branches were broken throughout the land’s natural channels.
  reasoning_layer_used: POB lexical decisions for פֹארֹתָיו and אֲפִיקֵי הָאָרֶץ
  rationale: “Large branches” and “streambeds” make the landscape image immediately clear.
- pob_phrase: went down from its shade and left it
  simplified_phrase: went down from its shade and left it behind
  preserved_meaning: The peoples descended from the fallen tree’s shelter and abandoned it.
  reasoning_layer_used: POB lexical decisions for וַיֵּרְדוּ מִצִּלּוֹ and וַיִּטְּשֻׁהוּ
  rationale: “Left it behind” clarifies their departure while preserving the descent and shade images.
