translation:
  language: en
  text: Ruthless foreigners from among the nations cut it down and left it. Its branches fell on the mountains and in every valley. Its large branches were broken in all the streambeds of the land. Then all the peoples of the earth went down from its shade and left it behind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The fallen tree represents Assyria and its ruler; “it” keeps the tree image, though “him” is also possible.
    reason: alternative_reading
