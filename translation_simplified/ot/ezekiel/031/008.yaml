translation:
  language: en
  text: The cedars did not overshadow it in the garden of God.[a] The cypresses did not match its main branches, and the plane trees had no branches like its own.[b] No tree in the garden of God could match its beauty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the garden of God,” an expression that calls Eden to mind.
    reason: lexical_alternative
  - marker: b
    text: “Plane trees” is likely; traditional translations often have “chestnut trees.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: cypresses did not compare with its boughs
  simplified_phrase: The cypresses did not match its main branches
  preserved_meaning: The cypresses fell short of the tree’s larger branching structures.
  reasoning_layer_used: Lexical decisions for דָמוּ and סְעַפֹּתָיו
  rationale: “Match” and “main branches” clarify the comparison while distinguishing them from the later branches.
- pob_phrase: plane trees were not like its branches
  simplified_phrase: the plane trees had no branches like its own
  preserved_meaning: The plane trees’ branches did not resemble or equal this tree’s branches.
  reasoning_layer_used: Lexical decisions for עַרְמֹנִים and פֹארֹתָיו
  rationale: The recast clause makes the object of comparison immediately clear.
- pob_phrase: No tree in the garden of God compared with it in its beauty
  simplified_phrase: No tree in the garden of God could match its beauty
  preserved_meaning: No other tree equaled its beauty.
  reasoning_layer_used: Lexical decisions for כָּל עֵץ, דָמָה אֵלָיו, and בְּיָפְיוֹ
  rationale: The shorter wording states the climactic comparison naturally without weakening it.
