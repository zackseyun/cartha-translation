translation:
  language: en
  text: 'This is what the Lord GOD says: When he went down to Sheol,[a] I brought mourning. Because of him, I covered the deep, held back its rivers, and stopped its abundant waters. I brought darkness over Lebanon because of him, and all the trees of the field fainted because of him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; it can also be translated “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'Thus says the Lord GOD: On the day he went down to Sheol'
  simplified_phrase: 'This is what the Lord GOD says: When he went down to Sheol'
  preserved_meaning: The Lord GOD introduces a declaration about the time of his descent to the realm of the dead.
  reasoning_layer_used: POB lexical decisions on the divine title and Sheol
  rationale: The wording uses ordinary English while retaining the divine title and the source-driven term “Sheol.”
- pob_phrase: I caused mourning
  simplified_phrase: I brought mourning
  preserved_meaning: God caused mourning rather than merely mourning himself.
  reasoning_layer_used: POB lexical decision for הֶאֱבַלְתִּי
  rationale: “Brought mourning” clearly preserves the Hebrew verb’s causative force.
- pob_phrase: I restrained its rivers, and the many waters were stopped
  simplified_phrase: held back its rivers, and stopped its abundant waters
  preserved_meaning: God withheld the deep’s flowing waters and brought them to a stop.
  reasoning_layer_used: POB lexical decisions for מנע and מַיִם רַבִּים
  rationale: The active sequence is smoother English and keeps both the restraint and its result.
translation_notes:
  risk_flags:
  - risk: “I covered the deep” remains a difficult poetic image.
    mitigation: The wording is retained because the POB chose the normal sense “cover” and avoided resolving the image as mourning.
  - risk: Modern readers may mistake Sheol for later ideas of hell.
    mitigation: The footnote defines it neutrally as the realm of the dead and preserves “the grave” as an alternative.
