simplification_decisions:
- pob_phrase: Then I looked, and behold
  simplified_phrase: Then I looked. There before me was
  preserved_meaning: Ezekiel’s attention is drawn to a vivid new sight.
  reasoning_layer_used: Lexical decisions for וָאֶרְאֶה and וְהִנֵּה
  rationale: “There before me” preserves the vivid presentation without using the unfamiliar “behold.”
- pob_phrase: a hand was stretched out toward me
  simplified_phrase: a hand stretched out toward me
  preserved_meaning: An unidentified hand is extended in Ezekiel’s direction.
  reasoning_layer_used: Lexical and theological decisions for יָד, שְׁלוּחָה, and אֵלַי
  rationale: The wording keeps the passive visual image and leaves the hand’s owner unspecified.
- pob_phrase: and behold, in it was a scroll of a book
  simplified_phrase: In it was a scroll.
  preserved_meaning: A written scroll is strikingly presented in the hand.
  reasoning_layer_used: Discourse function of וְהִנֵּה and lexical decision for מְגִלַּת סֵפֶר
  rationale: A separate sentence retains the second presentation while the footnote records the literal idiom.
