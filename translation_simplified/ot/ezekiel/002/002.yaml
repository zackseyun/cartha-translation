simplification_decisions:
- pob_phrase: the Spirit entered into me when he spoke to me
  simplified_phrase: As he spoke to me, the Spirit came into me
  preserved_meaning: God’s Spirit entered Ezekiel while the divine speaker was speaking.
  reasoning_layer_used: Lexical and theological decisions on רוּחַ and בוא + ב
  rationale: The new clause order is easier to follow while preserving inward movement and the chosen divine referent.
- pob_phrase: set me on my feet
  simplified_phrase: put me on my feet
  preserved_meaning: The Spirit caused Ezekiel to stand.
  reasoning_layer_used: Lexical decision on the causative form of עמד
  rationale: “Put me on my feet” is common English and keeps the Spirit as the cause.
- pob_phrase: and I heard the one speaking to me
  simplified_phrase: Then I heard the one who was speaking to me
  preserved_meaning: After being raised, Ezekiel heard the continuing speaker.
  reasoning_layer_used: Lexical decisions on the narrative sequence and substantival participle
  rationale: “Then” clarifies the sequence, and “who was” makes the phrase natural English.
