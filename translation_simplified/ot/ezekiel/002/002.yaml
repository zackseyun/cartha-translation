translation:
  language: en
  text: As he spoke to me, the Spirit came into me and put me on my feet. Then I heard the one who was speaking to me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “a spirit came into me,” but the context favors God’s Spirit empowering Ezekiel.
