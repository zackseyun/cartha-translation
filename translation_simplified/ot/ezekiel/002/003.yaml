translation:
  language: en
  text: He said to me, “Son of man,[a] I am sending you to the people of Israel—to those rebellious nations that have rebelled against me. They and their ancestors have broken faith with me to this very day.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “human one” or “mortal.”
    reason: lexical_alternative
