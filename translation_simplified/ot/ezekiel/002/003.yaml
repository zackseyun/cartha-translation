- pob_phrase: the sons of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The commission is directed to Israel as a whole.
  reasoning_layer_used: POB lexical alternatives and target readability rules
  rationale: “The people of Israel” is immediately clear while retaining the same referent.
- pob_phrase: the rebellious nations that have rebelled against me
  simplified_phrase: those rebellious nations that have rebelled against me
  preserved_meaning: Israel is strikingly described as rebellious nations, with the repeated rebellion wording intact.
  reasoning_layer_used: POB theological decision on גּוֹיִם and lexical decisions on מרד
  rationale: “Those” connects the nations clearly to Israel without softening the accusation.
- pob_phrase: they and their fathers
  simplified_phrase: They and their ancestors
  preserved_meaning: The rebellion extends through earlier generations and the present one.
  reasoning_layer_used: Immediate context and common-English simplification
  rationale: “Ancestors” naturally expresses the multigenerational sense for modern readers.
interpretive_expansions:
