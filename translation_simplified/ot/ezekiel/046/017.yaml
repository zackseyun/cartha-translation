  text: But if the prince gives one of his servants some of the land he inherited, the servant may keep it only until the year of liberty.[a] Then the land must return to the prince. The prince’s inherited land belongs permanently only to his sons; it will be theirs.
  philosophy: optimal-equivalence
  footnotes:
