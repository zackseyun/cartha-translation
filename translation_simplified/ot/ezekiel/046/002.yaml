translation:
  language: en
  text: The prince must enter from outside through the gate’s entrance hall and stand beside its doorpost. The priests will then present his burnt offering and his peace offerings.[a] He must bow down in worship at the gate’s threshold and then leave. But the gate must remain open until evening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offerings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall enter by way of the porch of the gate from outside
  simplified_phrase: must enter from outside through the gate’s entrance hall
  preserved_meaning: The prince follows the specified route from outside through the gate’s porch or vestibule.
  reasoning_layer_used: Lexical decision for דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  rationale: “Entrance hall” makes the architectural route easier to picture than “porch of the gate.”
- pob_phrase: the priests shall offer his burnt offering and his peace offerings
  simplified_phrase: The priests will then present his burnt offering and his peace offerings
  preserved_meaning: The priests perform the prince’s two specified sacrificial offerings.
  reasoning_layer_used: Lexical decisions for עָשָׂה, עֹלָה, and שְׁלָמִים
  rationale: “Present” is plain English while retaining the distinct sacrificial terms.
- pob_phrase: the gate shall not be shut until evening
  simplified_phrase: the gate must remain open until evening
  preserved_meaning: The gate is prohibited from being closed before evening.
  reasoning_layer_used: Lexical decision for לֹא יִסָּגֵר עַד הָעָרֶב
  rationale: The positive wording states the same requirement more directly.
translation_notes:
  risk_flags:
  - risk: “Entrance hall” is broader than the architectural term “porch” or “vestibule.”
    mitigation: The wording keeps its location within the gate and preserves the route from outside.
  - risk: “Prince” may be read as royal or messianic.
    mitigation: The established title is retained without adding any claim about his identity.
