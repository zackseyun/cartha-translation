translation:
  language: en
  text: But when the prince chooses to give Yahweh an offering—either a burnt offering or peace offerings[a]—the east-facing gate must be opened for him. He must present the burnt offering and peace offerings in the same way he does on the Sabbath. Then he must leave. After he leaves, the gate must be shut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fellowship offerings.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify who opens and shuts the gate.
    reason: source_note
