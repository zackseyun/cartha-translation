translation:
  language: en
  text: When the people of the land come before Yahweh to worship at the appointed times,[a] anyone who enters through the north gate must leave through the south gate. Anyone who enters through the south gate must leave through the north gate. They must not go back through the gate where they entered. Instead, they must continue straight ahead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the appointed feasts” or “at the festivals.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: whoever enters by way of the north gate to worship shall go out by way of the south gate
  simplified_phrase: anyone who enters through the north gate must leave through the south gate
  preserved_meaning: Worshipers are required to exit through the gate opposite their entrance.
  reasoning_layer_used: Lexical decisions for gate language and the prescriptive imperfect
  rationale: Common gate wording and “must” make the binding instruction immediately clear.
- pob_phrase: He shall not return by way of the gate through which he entered
  simplified_phrase: They must not go back through the gate where they entered
  preserved_meaning: A worshiper may not retrace the entry route.
  reasoning_layer_used: Lexical decision for לֹא יָשׁוּב
  rationale: “Go back” states the movement rule more naturally than “return by way of.”
- pob_phrase: but shall go out straight ahead
  simplified_phrase: Instead, they must continue straight ahead
  preserved_meaning: The worshiper proceeds onward toward the opposite exit.
  reasoning_layer_used: Lexical rationale for כִּי נִכְחוֹ יֵצֵאוּ
  rationale: “Continue” connects the directional image to the required movement through the temple area.
