translation:
  language: en
  text: At festivals and other sacred times set in the calendar, the grain offering must be one ephah for each bull and one ephah for each ram. For the lambs, he must give as much as he can afford. For every ephah of grain, he must also provide one hin of oil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure, and a hin was an ancient liquid measure.
    reason: cultural_note
