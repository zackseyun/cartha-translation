translation:
  language: en
  text: 'This is what the Lord Yahweh says: The east-facing gate of the inner courtyard must remain closed during the six regular workdays. But it must be opened on the Sabbath and on the day of the new moon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The new-moon day was a monthly religious observance.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The prophetic announcement identifies the Lord Yahweh as the speaker.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר and updated theological decision for אֲדֹנָי יְהוִה
  rationale: The modern formula is clear, while “Yahweh” follows the updated divine-name policy.
- pob_phrase: The gate of the inner court that faces east
  simplified_phrase: The east-facing gate of the inner courtyard
  preserved_meaning: The gate belongs to the temple's inner court and faces east.
  reasoning_layer_used: Lexical decisions for שַׁעַר הֶחָצֵר הַפְּנִימִית and הַפֹּנֶה קָדִים
  rationale: The compact wording and familiar “courtyard” make the location easier to picture.
- pob_phrase: shall be shut during the six working days, but ... it shall be opened
  simplified_phrase: must remain closed during the six regular workdays. But it must be opened
  preserved_meaning: The gate stays closed on ordinary workdays and is opened on the appointed sacred days.
  reasoning_layer_used: Lexical decisions for יִהְיֶה סָגוּר, שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה, and יִפָּתֵחַ
  rationale: Two direct sentences clarify the continuing closure and required opening.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand the new moon only as an astronomical event.
    mitigation: The footnote identifies the new-moon day as a monthly religious observance.
  - risk: “Must” makes the legal force more explicit than POB's “shall.”
    mitigation: The temple-regulation context supports obligation rather than prediction.
