translation:
  language: en
  text: The grain offering brought with the ram[a] must be one ephah, a dry measure. With the lambs, he must bring a grain offering according to what he is able to give.[b] He must also bring one hin of oil, a liquid measure, for every ephah of grain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “for the ram” and “for the lambs.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “the gift of his hand,” an idiom referring to what he is able to give.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the grain offering shall be an ephah with the ram
  simplified_phrase: The grain offering brought with the ram must be one ephah, a dry measure
  preserved_meaning: The ram is accompanied by a fixed grain offering of one ephah.
  reasoning_layer_used: POB lexical decisions for מִנְחָה, אֵיפָה, and לָאַיִל
  rationale: The requirement is stated directly, and the unfamiliar unit is identified as a dry measure.
- pob_phrase: with the lambs a grain offering as much as his hand can give
  simplified_phrase: With the lambs, he must bring a grain offering according to what he is able to give
  preserved_meaning: The grain offering associated with the lambs varies according to the giver’s ability.
  reasoning_layer_used: POB lexical decision and footnote for מַתַּת יָדוֹ
  rationale: This avoids narrowing ability to finances or implying that the giver must give his maximum.
- pob_phrase: a hin of oil with each ephah
  simplified_phrase: one hin of oil, a liquid measure, for every ephah of grain
  preserved_meaning: One hin of oil corresponds to every ephah in the grain offering.
  reasoning_layer_used: POB lexical decisions for הִין and לָאֵיפָה
  rationale: The wording identifies the liquid unit and makes the distributive ratio clear.
