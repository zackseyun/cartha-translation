translation:
  language: en
  text: In the thirtieth year, on the fifth day of the fourth month, I was among the exiles beside the Kebar River.[a] The heavens were opened, and I saw visions of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls this the Kebar River, but it may have been a major canal in Babylonia.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “divine visions” or “visions from God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It happened in the thirtieth year, in the fourth month, on the fifth day of the month
  simplified_phrase: In the thirtieth year, on the fifth day of the fourth month
  preserved_meaning: The same year, month, and day are given in a more natural English date order.
  reasoning_layer_used: Lexical decisions for the Hebrew dating formula
  rationale: Combining the repeated month phrases makes the date easier to follow without changing it.
- pob_phrase: while I was among the exiles by the Kebar River
  simplified_phrase: I was among the exiles beside the Kebar River
  preserved_meaning: Ezekiel was located with the deported community near the named waterway.
  reasoning_layer_used: Lexical decisions for וַאֲנִי, בְתוֹךְ הַגּוֹלָה, and עַל נְהַר כְּבָר
  rationale: A new main clause and “beside” make the setting immediately clear.
- pob_phrase: the heavens were opened, and I saw visions of God
  simplified_phrase: The heavens were opened, and I saw visions of God
  preserved_meaning: The visionary opening of heaven and the deliberately ambiguous phrase “visions of God” remain intact.
  reasoning_layer_used: Lexical and theological decisions for נִפְתְּחוּ הַשָּׁמַיִם and מַרְאוֹת אֱלֹהִים
  rationale: A sentence break improves readability while preserving the elevated image and theological ambiguity.
