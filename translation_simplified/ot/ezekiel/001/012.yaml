translation:
  language: en
  text: Each one moved straight ahead. Wherever the spirit[a] was going, they went. They did not turn as they moved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wind”; possibly “the Spirit.” The Hebrew does not clearly identify which meaning is intended.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And each one went straight ahead
  simplified_phrase: Each one moved straight ahead
  preserved_meaning: Every living being moved directly forward in the direction it faced.
  reasoning_layer_used: POB lexical decisions for וְאִישׁ and אֶל עֵבֶר פָּנָיו
  rationale: “Moved straight ahead” expresses the directional movement in ordinary English.
- pob_phrase: Wherever the spirit was to go, they went
  simplified_phrase: Wherever the spirit was going, they went
  preserved_meaning: They moved in the direction intended by the spirit without portraying it as a separate figure they followed.
  reasoning_layer_used: POB lexical and theological decisions for הָרוּחַ and לָלֶכֶת
  rationale: The progressive wording remains natural while preserving the clause’s directional force.
- pob_phrase: they did not turn as they went
  simplified_phrase: They did not turn as they moved
  preserved_meaning: The beings did not change direction while moving.
  reasoning_layer_used: POB lexical decisions for לֹא יִסַּבּוּ and בְּלֶכְתָּן
  rationale: A separate sentence makes their unwavering movement easy to understand.
