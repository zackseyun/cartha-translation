translation:
  language: en
  text: Above the spread-out surface over their heads was something like a throne, looking like sapphire stone.[a] Above the likeness of that throne was a likeness that looked like a man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient gemstone may have been lapis lazuli rather than what is now called sapphire.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the expanse that was over their heads
  simplified_phrase: the spread-out surface over their heads
  preserved_meaning: A broad, platform-like surface was above the living creatures.
  reasoning_layer_used: Lexical decision for רָקִיעַ
  rationale: This replaces the uncommon word “expanse” while preserving the spread-out surface image.
- pob_phrase: the likeness of a throne, in appearance like sapphire stone
  simplified_phrase: something like a throne, looking like sapphire stone
  preserved_meaning: Ezekiel describes resemblance to a gemstone-like throne rather than directly identifying it.
  reasoning_layer_used: Lexical decisions for דְּמוּת, כִּסֵּא, and כְּמַרְאֵה
  rationale: The combined phrase clearly links the gemstone appearance to the throne-likeness.
- pob_phrase: above the likeness of the throne was a likeness with the appearance of a man above it
  simplified_phrase: Above the likeness of that throne was a likeness that looked like a man
  preserved_meaning: A humanlike figure appeared above the throne, without being identified as an ordinary human body.
  reasoning_layer_used: Theological decision on anthropomorphic description
  rationale: This keeps the repeated likeness language and does not add that the figure was seated.
translation_notes:
  risk_flags:
  - risk: “Spread-out surface” may sound less like a distinct visionary feature than “expanse.”
    mitigation: The wording retains the source image of a broad surface above the creatures.
  - risk: Readers may take “looked like a man” as direct bodily identification.
    mitigation: The retained word “likeness” preserves Ezekiel’s deliberate restraint.
