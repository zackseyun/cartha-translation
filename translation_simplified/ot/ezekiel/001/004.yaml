translation:
  language: en
  text: I looked, and there before me was a violent windstorm[a] coming from the north—a great cloud with fire continually flashing[c] and brightness all around it. From deep within it—from within the fire—came something that looked like glowing metal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whirlwind.” The Hebrew describes a violent windstorm but does not necessarily mean a rotating funnel.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word is uncertain; it may refer to electrum or an amber-like glow.
    reason: lexical_alternative
  - marker: c
    text: The difficult Hebrew expression may picture fire folding into itself or continually intensifying.
    reason: lexical_alternative
