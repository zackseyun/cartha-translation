  text: From what appeared to be his waist upward, I saw what looked like glowing metal,[a] with what looked like fire enclosed inside it on every side.[b] From what appeared to be his waist downward, I saw what looked like fire. Brightness surrounded him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is uncertain and may refer to amber or electrum, a bright metal alloy.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase is difficult; it may picture fire within a surrounding brightness or casing.
    reason: lexical_alternative
