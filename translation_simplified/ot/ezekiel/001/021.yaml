  text: When the living creatures moved, the wheels moved with them. When the creatures stood still, the wheels also stood still. When the creatures were lifted up from the earth, the wheels were lifted up alongside them.[b] This happened because the spirit[a] of the living creatures was in the wheels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wind” or “breath.”
    reason: lexical_alternative
  - marker: b
    text: Or “corresponding to them” or “opposite them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When they went, these went
  simplified_phrase: When the living creatures moved, the wheels moved with them
  preserved_meaning: The living creatures and wheels moved together.
  reasoning_layer_used: Lexical decision and immediate vision context
  rationale: Naming both groups removes unclear pronouns while preserving their coordinated movement.
- pob_phrase: when they stood, these stood
  simplified_phrase: When the creatures stood still, the wheels also stood still
  preserved_meaning: The wheels remained still whenever the creatures did.
  reasoning_layer_used: Lexical decision and Hebrew parallel structure
  rationale: “Stood still” clearly contrasts with movement while keeping the repeated action.
- pob_phrase: when they were lifted up from above the earth, the wheels were lifted up alongside them
  simplified_phrase: When the creatures were lifted up from the earth, the wheels were lifted up alongside them
  preserved_meaning: Both creatures and wheels were passively lifted upward from the earth in parallel.
  reasoning_layer_used: Lexical decisions for the Niphal verb and מֵעַל, plus grounding review
  rationale: The revision restores the upward passive action and repeated imagery in clear English.
