translation:
  language: en
  text: Each creature’s wings were joined to the wings of the other creatures. As the creatures moved, each one went straight ahead without turning.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Their wings were joined, each to her sister.
  simplified_phrase: Each creature’s wings were joined to the wings of the other creatures.
  preserved_meaning: The creatures’ corresponding wings were connected to one another.
  reasoning_layer_used: POB lexical decisions for חֹבְרֹת and אִשָּׁה אֶל אֲחוֹתָהּ, with immediate context
  rationale: This explains the Hebrew idiom without specifying one particular neighboring creature.
- pob_phrase: As they moved, they did not turn; each one went straight ahead.
  simplified_phrase: As the creatures moved, each one went straight ahead without turning.
  preserved_meaning: Every creature moved in the direction it faced and did not change direction.
  reasoning_layer_used: POB lexical decisions for אִישׁ, לֹא יִסַּבּוּ, and אֶל עֵבֶר פָּנָיו
  rationale: Naming the creatures removes an unclear pronoun while preserving the distributive force of “each one.”
