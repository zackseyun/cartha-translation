  preserved_meaning: Their appearance resembled human form without identifying them as human.
  reasoning_layer_used: Lexical decision for דְּמוּת אָדָם and theological restraint
  rationale: “Human-like” clearly preserves resemblance and avoids suggesting one particular man.
