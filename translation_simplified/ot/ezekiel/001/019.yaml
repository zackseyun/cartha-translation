translation:
  language: en
  text: When the living creatures[a] moved, the wheels moved alongside them. When the living creatures were lifted off the ground, the wheels were lifted up too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ezekiel later identifies these living creatures as cherubim (see Ezekiel 10:20).
    reason: cross_reference
simplification_decisions:
- pob_phrase: the wheels moved beside them
  simplified_phrase: the wheels moved alongside them
  preserved_meaning: The wheels stayed close to the living creatures as both moved together.
  reasoning_layer_used: Lexical decision for אֶצְלָם and the coordinated motion in context.
  rationale: “Alongside” makes their parallel movement immediately clear.
- pob_phrase: were lifted up from the earth
  simplified_phrase: were lifted off the ground
  preserved_meaning: The creatures rose from contact with the ground rather than merely moving across it.
  reasoning_layer_used: Lexical decision for מֵעַל הָאָרֶץ.
  rationale: “Off the ground” is clearer common English for physical departure from the earth.
- pob_phrase: the wheels were lifted up
  simplified_phrase: the wheels were lifted up too
  preserved_meaning: The wheels rose in coordination with the living creatures.
  reasoning_layer_used: Repeated Niphal forms of נשׂא and the POB rationale on coordinated motion.
  rationale: “Too” states the parallel action naturally without changing who was lifted.
translation_notes:
  risk_flags:
  - risk: “Off the ground” is slightly less formal than “from the earth.”
    mitigation: The wording preserves the concrete upward movement and remains dignified in context.
