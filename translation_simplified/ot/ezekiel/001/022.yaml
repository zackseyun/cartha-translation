simplification_decisions:
- pob_phrase: there was the likeness of an expanse
  simplified_phrase: was something resembling an expanse
  preserved_meaning: Ezekiel describes a visual resemblance rather than directly identifying what he saw.
  reasoning_layer_used: Lexical decision for וּדְמוּת and theological decision on visionary analogy
  rationale: “Something resembling” makes the analogical wording easier to understand without turning it into a direct claim.
- pob_phrase: stretched out above their heads from above
  simplified_phrase: stretched out high over them
  preserved_meaning: The expanse-like form extended overhead, with emphasis on its elevated position.
  reasoning_layer_used: Lexical decisions for נָטוּי and מִלְמָעְלָה
  rationale: The recast phrase removes awkward repetition while retaining the strong vertical image.
- pob_phrase: like the appearance of awe-inspiring ice
  simplified_phrase: Its appearance was like awe-inspiring ice
  preserved_meaning: The sight resembled ice and evoked reverential fear or awe.
  reasoning_layer_used: Lexical decisions for כְּעֵין, הַקֶּרַח, and הַנּוֹרָא
  rationale: A separate sentence clarifies the comparison while preserving its force and uncertainty.
