translation:
  language: en
  text: The brightness all around looked like a rainbow in the clouds on a rainy day. This is what the likeness of Yahweh’s glory looked like.[a] When I saw it, I fell facedown and heard a voice speaking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew carefully qualifies the vision as “the appearance of the likeness of the glory of Yahweh.”
    reason: source_note
simplification_decisions:
- pob_phrase: Like the appearance of the rainbow that is in the cloud on a day of rain, so was the appearance of the brightness all around
  simplified_phrase: The brightness all around looked like a rainbow in the clouds on a rainy day
  preserved_meaning: The surrounding brightness is compared to a rainbow seen among rain clouds.
  reasoning_layer_used: Lexical decisions for מַרְאֶה, הַקֶּשֶׁת, and נֹגַהּ
  rationale: The comparison is recast in ordinary English while keeping the rainbow and surrounding brightness.
- pob_phrase: This was the appearance of the likeness of the glory of Yahweh
  simplified_phrase: This is what the likeness of Yahweh’s glory looked like
  preserved_meaning: Ezekiel describes only the visible likeness of Yahweh’s glory, not Yahweh’s essence directly.
  reasoning_layer_used: Theological decision on the layered divine-manifestation expression
  rationale: The wording remains qualified but is easier to understand on first reading.
- pob_phrase: I fell on my face, and I heard the voice of one speaking
  simplified_phrase: I fell facedown and heard a voice speaking
  preserved_meaning: Ezekiel prostrates himself and hears an unidentified speaker.
  reasoning_layer_used: Lexical decisions for וָאֶפֹּל עַל פָּנַי and וָאֶשְׁמַע קוֹל מְדַבֵּר
  rationale: Natural English preserves both the force of prostration and the speaker’s indefiniteness.
translation_notes:
  risk_flags:
  - risk: The smoother wording may make the Hebrew’s stacked qualifications less visible.
    mitigation: The main text retains both likeness and visible appearance, and the footnote gives the full layering.
