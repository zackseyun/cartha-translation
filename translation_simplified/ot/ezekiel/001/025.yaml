  reasoning_layer_used: POB lexical decision for וַיְהִי and קוֹל
  rationale: The active wording is easier to follow while keeping “sound” rather than over-specifying a voice.
- pob_phrase: the expanse that was over their heads
  simplified_phrase: the expanse over their heads
  preserved_meaning: The expanse remained spatially above the creatures.
  reasoning_layer_used: POB lexical decisions for מֵעַל לָרָקִיעַ and אֲשֶׁר עַל רֹאשָׁם
  rationale: The shorter phrase preserves both the expanse image and its position.
- pob_phrase: when they stood still, they let down their wings
