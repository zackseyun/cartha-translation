translation:
  language: en
  text: Then a sound came from above the expanse over their heads.[a] When they stopped moving, they lowered their wings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a voice.” The Hebrew word can mean either “sound” or “voice,” but speech is not yet specified here.
    reason: lexical_alternative
