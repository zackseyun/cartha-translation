  language: en
  text: 'As I looked at the living creatures, I saw this: on the ground beside each creature was a wheel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wheel corresponding to each creature’s four faces.” The Hebrew wording is compact, so the exact relationship between the wheel and the faces is uncertain.
