simplification_decisions:
- pob_phrase: behold
  simplified_phrase: I saw this
  preserved_meaning: Ezekiel’s attention suddenly shifts to the wheel in the vision.
  reasoning_layer_used: POB lexical decision for וְהִנֵּה
  rationale: This marks the visual transition without adding that the object itself was new.
- pob_phrase: on the earth beside the living creatures
  simplified_phrase: on the ground beside each creature
  preserved_meaning: A wheel appears at ground level next to each living creature.
  reasoning_layer_used: POB lexical decisions for בָּאָרֶץ and אֵצֶל, with the distributive rationale
  rationale: “Ground” clarifies the location, while “each creature” makes the distributive relationship readable.
- pob_phrase: one wheel ... for each of their four faces
  simplified_phrase: beside each creature was a wheel
  preserved_meaning: The singular wheel is understood distributively without assigning a separate wheel to every face.
  reasoning_layer_used: POB theological decision and footnote on לְאַרְבַּעַת פָּנָיו
  rationale: The main text avoids implying four wheels per creature, and the footnote preserves the uncertain relation to the faces.
