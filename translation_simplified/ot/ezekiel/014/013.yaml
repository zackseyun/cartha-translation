translation:
  language: en
  text: Son of man, if a land sins against me by being unfaithful to me, and I stretch out my hand against it, cut off its food supply[a], send famine on it, and kill its people and animals[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “break its staff of bread,” a Hebrew image for cutting off the food supply.
    reason: lexical_alternative
  - marker: b
    text: Literally, “man and beast,” meaning the land’s human and animal inhabitants.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by acting unfaithfully
  simplified_phrase: by being unfaithful to me
  preserved_meaning: The land’s sin is a faithless breach against God, not merely general wrongdoing.
  reasoning_layer_used: Lexical and theological decisions on מַעַל
  rationale: Naming the object makes the direction of the unfaithfulness immediately clear.
- pob_phrase: break its supply of bread
  simplified_phrase: cut off its food supply
  preserved_meaning: God removes the land’s sustaining supply of food.
  reasoning_layer_used: Lexical decision on מַטֵּה לָחֶם
  rationale: The main text explains the idiom while the footnote preserves its concrete image.
- pob_phrase: cut off from it man and beast
  simplified_phrase: kill its people and animals
  preserved_meaning: The judgment decisively ends the lives of both human and animal inhabitants.
  reasoning_layer_used: Lexical decisions on כרת and אָדָם וּבְהֵמָה, with the immediate famine context
  rationale: “Kill” avoids suggesting relocation and preserves the judgment’s lethal force.
interpretive_expansions:
- pob_phrase: by acting unfaithfully
  rendering: by being unfaithful to me
  claim: The unfaithfulness is directed toward God.
  evidence:
