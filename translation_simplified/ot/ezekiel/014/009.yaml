translation:
  language: en
  text: If a prophet is deceived and gives a message, I, Yahweh, have deceived that prophet.[a] I will stretch out my hand against him and destroy him from among my people Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have enticed that prophet”; some understand this as “have allowed that prophet to be deceived.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: speaks a word
  simplified_phrase: gives a message
  preserved_meaning: The prophet delivers a prophetic utterance.
  reasoning_layer_used: POB lexical alternatives for וְדִבֶּר דָּבָר
  rationale: “Gives a message” makes the prophetic sense of “word” immediately clear.
- pob_phrase: and I will stretch out my hand against him
  simplified_phrase: I will stretch out my hand against him
  preserved_meaning: Yahweh will personally act in judgment against the prophet.
  reasoning_layer_used: POB lexical decision for וְנָטִיתִי אֶת יָדִי עָלָיו
  rationale: A new sentence eases the structure while preserving the forceful hand image.
- pob_phrase: from the midst of my people Israel
  simplified_phrase: from among my people Israel
  preserved_meaning: The prophet will be removed from within Israel’s covenant community.
  reasoning_layer_used: POB lexical decision for מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  rationale: “From among” expresses the same removal in more natural modern English.
