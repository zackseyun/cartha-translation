translation:
  language: en
  text: If I cause dangerous wild animals to move through the land, and they leave the land bereaved—stripped of its people—so that it becomes desolate and no one travels through it because of the animals,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: cause dangerous wild animals to pass through the land
  simplified_phrase: cause dangerous wild animals to move through the land
  preserved_meaning: God actively causes the animals to move across the land in judgment.
  reasoning_layer_used: Lexical and theological decisions on אַעֲבִיר and בָּאָרֶץ.
  rationale: “Move through” is more natural while retaining divine causation and movement across the land.
- pob_phrase: they bereave it
  simplified_phrase: they leave the land bereaved—stripped of its people
  preserved_meaning: The land is personified as losing its inhabitants like a parent losing children.
  reasoning_layer_used: Lexical decision on וְשִׁכְּלָתָּהּ and POB footnote b.
  rationale: The added explanation makes the bereavement image immediately understandable without removing it.
- pob_phrase: it becomes a desolation, without anyone passing through
  simplified_phrase: it becomes desolate and no one travels through it
  preserved_meaning: The land is ruined so completely that travel through it stops.
  reasoning_layer_used: Lexical decisions on וְהָיְתָה שְׁמָמָה and מִבְּלִי עוֹבֵר.
  rationale: The adjective and direct clause express the same result in ordinary English.
interpretive_expansions:
- pob_phrase: they bereave it
  rendering: they leave the land bereaved—stripped of its people
  claim: The land’s bereavement means the loss of its inhabitants.
  evidence:
  - The POB lexical rationale says the land is personified as stripped of its inhabitants.
  - POB footnote b explains the image as making the land childless.
  confidence: high
  alternatives_preserved:
  - leave the land bereaved
  - make the land childless
