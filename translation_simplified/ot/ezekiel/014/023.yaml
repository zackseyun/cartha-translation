- pob_phrase: their ways and their deeds
  simplified_phrase: how they live and what they do
  preserved_meaning: This keeps both their course of life and their concrete actions.
  reasoning_layer_used: lexical decisions for דַּרְכָּם and עֲלִילוֹתָם
  rationale: The wording explains the Hebrew idiom while preserving its two distinct ideas.
- pob_phrase: I have not done without cause all that I did
  simplified_phrase: nothing I did ... was without cause
  preserved_meaning: God’s every action toward the city had cause and was not arbitrary.
  reasoning_layer_used: lexical and theological reasoning for לֹא חִנָּם and repeated עשה
  rationale: The recast sentence preserves the emphatic totality in natural English.
- pob_phrase: declares the Lord GOD
