translation:
  language: en
  text: Even if Noah, Daniel,[a] and Job were there, as surely as I live, declares the Lord Yahweh, they would rescue neither son nor daughter. By their righteousness, they would save only their own lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew name may also be read “Danel,” possibly an ancient righteous man rather than the well-known Daniel.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: were in it
  simplified_phrase: were there
  preserved_meaning: The three righteous men are imagined as present in the land under judgment.
  reasoning_layer_used: lexical decision and surrounding context
  rationale: “There” naturally points back to the judged place.
- pob_phrase: would deliver neither son nor daughter
  simplified_phrase: would rescue neither son nor daughter
  preserved_meaning: They could not cause even a son or daughter to escape judgment.
  reasoning_layer_used: lexical decision for יַצִּילוּ
  rationale: “Rescue” makes escape from judgment clearer than “deliver.”
- pob_phrase: by their righteousness they would deliver only themselves
  simplified_phrase: By their righteousness, they would save only their own lives
  preserved_meaning: Their righteousness would spare them alone, with righteousness remaining the means rather than the agent.
  reasoning_layer_used: lexical decisions for בְצִדְקָתָם, הֵמָּה, and נַפְשָׁם
  rationale: “Their own lives” clearly refers to the men themselves rather than immaterial souls.
