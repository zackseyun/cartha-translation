  preserved_meaning: The second call for attention and the survivors' outward movement toward the hearers both remain explicit.
  reasoning_layer_used: Lexical decision for הִנָּם יֹצְאִים אֲלֵיכֶם and grounding review
  rationale: Natural wording retains both the marked emphasis and the exit movement.
- pob_phrase: you will see their way and their deeds
  simplified_phrase: you will see the way they live and what they do
  preserved_meaning: The hearers will observe both the survivors' manner of life and their actions.
  reasoning_layer_used: Lexical decisions for דַּרְכָּם and עֲלִילוֹתָם
  rationale: This clarifies the moral sense of “way” while keeping manner of life distinct from deeds.
