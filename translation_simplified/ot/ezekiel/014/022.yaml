  preserved_meaning: An emphatic turn announces that some people will survive Jerusalem's judgment.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה, נוֹתְרָה ... פְּלֵטָה, and בָּהּ
  rationale: Common wording explains “remnant” and names the city's clear antecedent.
- pob_phrase: Behold, they are coming out to you
