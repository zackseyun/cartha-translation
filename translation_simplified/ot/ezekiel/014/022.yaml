translation:
  language: en
  text: 'But look: a group of survivors will be left in Jerusalem—sons and daughters who will be brought out. Look, they are coming out to you, and you will see the way they live and what they do. Then you will be comforted about the disaster I brought on Jerusalem—all that I brought on it.'
