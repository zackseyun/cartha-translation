translation:
  language: en
  text: “If these three men were there, as surely as I live,” declares the Lord Yahweh, “they could not rescue any sons or daughters. Only the three men themselves would be rescued.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And if these three men were in its midst
  simplified_phrase: If these three men were there
  preserved_meaning: The three named men are hypothetically present in the place under judgment.
  reasoning_layer_used: Lexical decision and surrounding hypothetical pattern
  rationale: “There” replaces the less familiar idiom “in its midst” without changing its reference.
- pob_phrase: they would not deliver sons or daughters
  simplified_phrase: they could not rescue any sons or daughters
  preserved_meaning: Even these righteous men could not rescue others from the coming judgment.
  reasoning_layer_used: Lexical and theological decisions on the scope of deliverance
  rationale: “Rescue” clearly describes deliverance from judgment without implying eternal salvation.
- pob_phrase: they alone would be delivered
  simplified_phrase: Only the three men themselves would be rescued
  preserved_meaning: Deliverance would be strictly limited to the three men.
  reasoning_layer_used: Lexical decisions for לְבַדָּם and יִנָּצֵלוּ
  rationale: The fuller wording makes the exclusive contrast immediately clear.
