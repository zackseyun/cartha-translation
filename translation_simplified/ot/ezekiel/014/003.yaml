translation:
  language: en
  text: Son of man, these men have set up idols in their hearts.[a] They have put the obstacle of their sin right in front of them. Should I really allow them to ask me for guidance?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a strongly contemptuous word for idols.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have placed the stumbling block of their iniquity before their faces
  simplified_phrase: have put the obstacle of their sin right in front of them
  preserved_meaning: Their sin is an obstacle deliberately kept before them and a cause of downfall.
  reasoning_layer_used: POB lexical decisions for מִכְשׁוֹל עֲוֺנָם and נָתְנוּ נֹכַח פְּנֵיהֶם
  rationale: This uses common words while preserving the obstacle and spatial images without adding future timing.
- pob_phrase: Should I indeed let myself be consulted by them?
  simplified_phrase: Should I really allow them to ask me for guidance?
  preserved_meaning: God rhetorically questions whether he will permit them to seek prophetic direction from him.
  reasoning_layer_used: POB lexical and theological decisions for הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  rationale: The natural active wording retains the intensified question and implied refusal.
- pob_phrase: these men have set up their idols in their hearts
  simplified_phrase: these men have set up idols in their hearts
  preserved_meaning: The male elders have internally established idols as objects of allegiance.
  reasoning_layer_used: POB lexical decisions for הָאֲנָשִׁים הָאֵלֶּה, הֶעֱלוּ, and עַל לִבָּם
  rationale: The concrete wording preserves both the internal allegiance and the contextually male referents.
interpretive_expansions:
- pob_phrase: be consulted by them
  rendering: ask me for guidance
  claim: The men are seeking divine guidance through prophetic inquiry.
  evidence:
  - The POB lexical rationale identifies this as seeking an oracle from God.
  - The immediate context presents the elders coming to Ezekiel.
  confidence: high
  alternatives_preserved:
  - be inquired of by them
  - allow them to inquire of me
translation_notes:
  risk_flags:
  - risk: “Obstacle” is less visually forceful than “stumbling block.”
    mitigation: The wording retains the idea that their sin stands in their way without imposing a future result.
  - risk: Some readers may miss the negative answer implied by the rhetorical question.
    mitigation: “Should I really” preserves its intensified and disapproving force without adding an explicit “No.”
