translation:
  language: en
  text: So that the people of Israel may no longer turn away from following me or make themselves unclean through all their acts of rebellion, but may be my people, and I may be their God, declares the Lord Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: Israel is addressed as a people, not as a physical building.
  reasoning_layer_used: context and common biblical idiom
  rationale: The clearer wording prevents readers from mistaking “house” for a building.
- pob_phrase: go astray from me
  simplified_phrase: turn away from following me
  preserved_meaning: Israel must stop abandoning faithful allegiance to God.
  reasoning_layer_used: lexical decision for מֵאַחֲרַי and revision history
  rationale: This preserves the Hebrew following image in natural English.
- pob_phrase: defile themselves with all their transgressions
  simplified_phrase: make themselves unclean through all their acts of rebellion
  preserved_meaning: Their own rebellious sins bring moral and ritual impurity upon them.
  reasoning_layer_used: lexical decisions for יִטַּמְּאוּ and בְּכָל פִּשְׁעֵיהֶם
  rationale: The wording conveys both self-incurred uncleanness and deliberate rebellion.
translation_notes:
  risk_flags:
  - risk: “Make themselves unclean” may sound only ceremonial to some readers.
    mitigation: “Acts of rebellion” keeps the moral and covenantal dimension clear.
  - risk: Repeated “may” can sound less certain than the familiar covenant formula.
    mitigation: It preserves the purpose nuance governing all the coordinated clauses.
