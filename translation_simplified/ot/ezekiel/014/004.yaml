translation:
  language: en
  text: 'Therefore, speak to them. Tell them, “This is what Yahweh the Lord says: If any man of the house of Israel lifts up his idols and gives them a place in his heart, puts before himself the stumbling block of his sin, and then comes to the prophet, I, Yahweh, will answer him in keeping with his many idols.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; it may mean that Yahweh answers him “by it” or “through it” rather than “in keeping with” his idols.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: speak to them and say to them
  simplified_phrase: speak to them. Tell them
  preserved_meaning: The two commands remain distinct and emphatic.
  reasoning_layer_used: POB lexical decision on the Hebrew verbal pairing
  rationale: Two short sentences preserve the repetition in natural English.
- pob_phrase: brings up his idols into his heart
  simplified_phrase: lifts up his idols and gives them a place in his heart
  preserved_meaning: The man inwardly raises and embraces his idols.
  reasoning_layer_used: POB lexical rationale and footnote b
  rationale: The wording keeps the upward image while clarifying its inward sense.
- pob_phrase: sets the stumbling block of his iniquity before his face
  simplified_phrase: puts before himself the stumbling block of his sin
  preserved_meaning: He deliberately places before himself a stumbling block connected with his sin.
  reasoning_layer_used: POB lexical decisions on מִכְשׁוֹל עֲוֺנוֹ and נֹכַח פָּנָיו
  rationale: This preserves the concrete object without identifying the stumbling block as the sin itself.
interpretive_expansions:
- pob_phrase: brings up his idols into his heart
  rendering: lifts up his idols and gives them a place in his heart
  claim: The image describes inwardly accepting and honoring idols.
