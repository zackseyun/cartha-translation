translation:
  language: en
  text: For any man from the house of Israel, or any foreigner living in Israel, who turns away from following me, sets up his idols in his heart, and puts the sin that will make him stumble right in front of himself—if he then comes to a prophet to ask me for an answer through him, I, Yahweh, will answer that man myself.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the foreigner who sojourns in Israel
  simplified_phrase: any foreigner living in Israel
  preserved_meaning: A non-Israelite resides among Israel.
  reasoning_layer_used: POB lexical decision for הַגֵּר ... יָגוּר
  rationale: “Living” replaces the unfamiliar “sojourns” while keeping the resident-foreigner sense.
- pob_phrase: separates himself from following me
  simplified_phrase: turns away from following me
  preserved_meaning: The man abandons his allegiance to Yahweh.
  reasoning_layer_used: POB lexical decision and footnote c
  rationale: The active wording expresses the Hebrew idiom in ordinary English.
- pob_phrase: sets the stumbling block of his iniquity before his face
  simplified_phrase: puts the sin that will make him stumble right in front of himself
  preserved_meaning: He deliberately places his own sinful cause of downfall before himself.
  reasoning_layer_used: POB lexical decisions for מִכְשׁוֹל עֲוֺנוֹ and יָשִׂים נֹכַח פָּנָיו
  rationale: The wording explains the image while retaining both stumbling and deliberate placement.
interpretive_expansions:
- pob_phrase: the stumbling block of his iniquity
  rendering: the sin that will make him stumble
  claim: His sin is the cause of his moral downfall.
  evidence:
  - The POB identifies מִכְשׁוֹל as a cause of downfall.
  - The attached עֲוֺנוֹ identifies that stumbling block with his own iniquity.
  confidence: high
  alternatives_preserved:
  - the stumbling block of his iniquity
  - the obstacle of his sin
translation_notes:
  risk_flags:
  - risk: “Sets up his idols in his heart” is less literal than the upward-motion wording of the Hebrew image.
    mitigation: It retains the internal placement and elevation of idols rather than reducing the phrase to generic idolatry.
  - risk: The final Hebrew expression is compact and may also be rendered “by myself” or “in my own person.”
    mitigation: “I, Yahweh, will answer that man myself” preserves the POB’s emphatic chosen meaning without over-resolving the form.
