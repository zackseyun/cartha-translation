translation:
  language: en
  text: You must lie on your left side. Place the iniquity of the house of Israel on that side. You will bear their iniquity for as many days as you lie there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iniquity” can also mean guilt or the punishment that results from sin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you, lie on your left side
  simplified_phrase: You must lie on your left side.
  preserved_meaning: God directly commands Ezekiel to take this physical posture.
  reasoning_layer_used: POB lexical decision for שְׁכַב and צִדְּךָ הַשְּׂמָאלִי
  rationale: The separate sentence makes the command immediate and easy to follow.
- pob_phrase: place the iniquity of the house of Israel upon it
  simplified_phrase: Place the iniquity of the house of Israel on that side.
  preserved_meaning: Ezekiel's side symbolically carries Israel's iniquity.
  reasoning_layer_used: POB lexical decisions for וְשַׂמְתָּ, עֲוֺן, בֵּית יִשְׂרָאֵל, and עָלָיו
  rationale: “That side” makes the pronoun's reference clear while preserving the sign-act image.
- pob_phrase: for the number of the days that you lie on it, you shall bear their iniquity
  simplified_phrase: You will bear their iniquity for as many days as you lie there.
  preserved_meaning: The counted duration of lying down is the duration of symbolically bearing their iniquity.
  reasoning_layer_used: POB lexical decisions for מִסְפַּר הַיָּמִים אֲשֶׁר, תִּשָּׂא, and עֲוֺנָם
  rationale: Ordinary English word order clarifies the relationship between the action and its duration.
translation_notes:
