translation:
  language: en
  text: This is so they may not have enough bread or water. Each man and his brother may be appalled,[a] and they may waste away in their sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “be left desolate,” “be horrified,” or “be stunned”; it can describe either devastation or the shock it causes.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also refer to their guilt or to punishment resulting from their sin.
    reason: lexical_alternative
