translation:
  language: en
  text: Ezekiel, take an iron griddle[a] and place it between you and the city as an iron wall. Face the city. It will be under siege, and you will besiege it. This will be a sign for the house of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “iron pan” or “iron plate.” This was a metal cooking tool used here as a symbolic barrier.
    reason: lexical_alternative
