translation:
  language: en
  text: Lay siege to it. Build a siege wall[a] against it, heap up a ramp[b] against it, set up military camps against it, and place battering rams all around it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “siege tower”; the Hebrew refers to a siege structure used in attacking a city.
    reason: lexical_alternative
  - marker: b
    text: That is, an earthen embankment heaped up against the city wall.
    reason: cultural_note
simplification_decisions:
- pob_phrase: set a siege against it
  simplified_phrase: Lay siege to it
  preserved_meaning: The command begins a hostile siege of the city.
  reasoning_layer_used: The lexical decision identifies מָצוֹר as a military siege or blockade.
  rationale: “Lay siege” is the natural modern expression for the same action.
- pob_phrase: set camps against it
  simplified_phrase: set up military camps against it
  preserved_meaning: Military camps are positioned against the city without claiming that they encircle it.
  reasoning_layer_used: The lexical decision identifies מַחֲנוֹת as military camps, while the source attaches “all around” to the battering rams.
  rationale: Adding “military” clarifies the context while preserving the command’s exact relation.
- pob_phrase: place battering rams against it all around
  simplified_phrase: place battering rams all around it
  preserved_meaning: Siege weapons are stationed against the city on every side.
  reasoning_layer_used: The lexical decisions require “battering rams” and preserve the encircling force of סָבִיב.
  rationale: The reordered phrase is natural English and keeps the full encirclement image.
translation_notes:
  risk_flags:
  - risk: The exact kind of siege structure meant by “siege wall” is uncertain.
    mitigation: Footnote a preserves “siege tower” as a possible rendering.
