  preserved_meaning: The exact ancient quantity remains specified.
  reasoning_layer_used: Lexical decision for שִׁשִּׁית הַהִין
  rationale: The fraction is modernized while the source-text unit is retained.
- pob_phrase: from time to time you shall drink
