simplification_decisions:
- pob_phrase: And behold
  simplified_phrase: Look
  preserved_meaning: God solemnly calls Ezekiel’s attention to what follows.
  reasoning_layer_used: Lexical decision for וְהִנֵּה.
  rationale: “Look” preserves the attention-getting force in common English.
- pob_phrase: I have put ropes on you
  simplified_phrase: I have bound you with ropes
  preserved_meaning: God has restrained Ezekiel with ropes so that he cannot change position.
  reasoning_layer_used: Lexical decisions for נָתַתִּי, עָלֶיךָ, עֲבוֹתִים, and וְלֹא תֵהָפֵךְ.
  rationale: “Bound” clearly states the restraining function confirmed by Ezekiel’s inability to turn.
- pob_phrase: until you have completed the days of your siege
  simplified_phrase: until you have finished acting out the siege for its full number of days
  preserved_meaning: Ezekiel must continue the symbolic siege through the entire assigned period.
  reasoning_layer_used: Lexical decisions for עַד כַּלּוֹתְךָ and יְמֵי מְצוּרֶךָ, plus the theological decision on the siege’s referent.
  rationale: This natural time expression replaces the wooden phrase “finish the days” without shortening the appointed period.
