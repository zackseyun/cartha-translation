translation:
  language: en
  text: Will you still say, “I am a god,” when you face the one who kills you? You are a man, not a god, in the hands of those who desecrate you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who wound you”; the Hebrew can describe either physical harm or humiliating desecration.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: before the one who kills you
  simplified_phrase: when you face the one who kills you
  preserved_meaning: The ruler confronts the person who is about to kill him.
  reasoning_layer_used: The lexical decision treats “before” as presence or confrontation.
  rationale: “When you face” makes the deadly confrontation immediately clear.
- pob_phrase: in the hand of
  simplified_phrase: in the hands of
  preserved_meaning: The attackers have the ruler under their power.
  reasoning_layer_used: The lexical decision preserves the Hebrew hand image as an expression of control.
  rationale: The familiar English idiom keeps both the image and the sense of power.
- pob_phrase: those who profane you
  simplified_phrase: those who desecrate you
  preserved_meaning: His attackers will humiliate and treat as common the man who claimed divinity.
  reasoning_layer_used: The theological decision preserves the irony and humiliation in the Hebrew verb.
  rationale: “Desecrate” is clearer than “profane” while retaining the sacred-status irony.
translation_notes:
  risk_flags:
  - risk: “Desecrate” may sound unusual when applied to a person.
    mitigation: The context of a ruler claiming divinity supplies the intended irony.
  - risk: The Hebrew verb may also be understood as physical wounding.
    mitigation: The footnote preserves that lexical alternative without weakening the main reading.
