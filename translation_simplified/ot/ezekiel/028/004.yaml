translation:
  language: en
  text: Using your wisdom and understanding, you gained wealth for yourself[a] and stored gold and silver in your treasuries.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you gained strength or resources for yourself.” The Hebrew word can have these meanings, but the gold, silver, and treasuries here point to wealth.
    reason: lexical_alternative
