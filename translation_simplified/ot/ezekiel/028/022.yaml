translation:
  language: en
  text: 'Say, “This is what the Lord GOD says: Look, Sidon! I am against you. I will display my glory among you. They will know that I am Yahweh when I carry out acts of judgment within you and show my holiness there.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord GOD says
  preserved_meaning: The words introduce an authoritative message from the Lord GOD.
  reasoning_layer_used: POB translation and divine-title lexical decision
  rationale: The common formula is clearer while preserving the divine title and authority.
- pob_phrase: Behold, I am against you, Sidon
  simplified_phrase: Look, Sidon! I am against you.
  preserved_meaning: God solemnly announces his hostility toward Sidon.
  reasoning_layer_used: POB lexical decision for הִנְנִי עָלַיִךְ
  rationale: The documented alternative “Look” keeps the attention-commanding force in ordinary English.
- pob_phrase: when I execute judgments in her and show myself holy in her
  simplified_phrase: when I carry out acts of judgment within you and show my holiness there
  preserved_meaning: God’s judgments within Sidon publicly reveal his holiness.
  reasoning_layer_used: POB lexical and theological decisions for שְׁפָטִים and קדשׁ
  rationale: The wording clarifies the acts and location while preserving judgment and revealed holiness as distinct ideas.
interpretive_expansions:
- pob_phrase: I will be glorified in your midst
  rendering: I will display my glory among you
  claim: God’s judgment in Sidon will reveal his glory rather than merely earn human praise.
  evidence:
  - The POB lexical rationale says the Hebrew can express displaying glory through judgment.
  - The POB theological decision treats the judgment as a revelation of God’s glory.
  confidence: high
  alternatives_preserved:
  - I will gain glory among you
  - I will be honored among you
translation_notes:
  risk_flags:
  - risk: “They” has no explicit antecedent in this verse.
    mitigation: The draft retains the pronoun rather than identifying a group the POB leaves unspecified.
  - risk: Changing the city metaphor from “her” to direct-address “you” could obscure personification.
    mitigation: “Within you” preserves Sidon as the addressed city and the location of judgment.
