translation:
  language: en
  text: You were in Eden, the garden of God. You were covered with every kind of precious stone:[a] ruby, topaz, diamond, beryl, onyx, jasper, sapphire, turquoise, emerald, and gold. The craftsmanship of your tambourines and sockets was part of you. They were prepared on the day you were created.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact identity of several stones is uncertain because ancient gemstone names do not always match modern names. Possible alternatives include carnelian, chrysolite, lapis lazuli, and carbuncle.
    reason: lexical_alternative
  - marker: b
    text: Or, “The craftsmanship of your settings and mountings was part of you,” if the difficult Hebrew words describe jewelry rather than musical instruments.
    reason: alternative_reading
