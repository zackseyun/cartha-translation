translation:
  language: en
  text: Because of your many evil deeds and the injustice in your trade, you desecrated your sanctuaries.[a] So I brought fire out from within you. It consumed you, and I turned you to ashes on the earth before everyone who saw you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your holy places.” The Hebrew is plural, and the precise referent is debated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By the abundance of your iniquities
  simplified_phrase: Because of your many evil deeds
  preserved_meaning: The addressee’s numerous serious wrongs are the cause of judgment.
  reasoning_layer_used: Lexical decision for עֲוֺנֶיךָ and causal force of מֵרֹב
  rationale: This replaces uncommon “iniquities” with plain wording while retaining its moral weight and plurality.
- pob_phrase: in the unrighteousness of your trade
  simplified_phrase: and the injustice in your trade
  preserved_meaning: The commercial activity itself was marked by wrongdoing and injustice.
  reasoning_layer_used: Lexical decisions for בְּעֶוֶל and רְכֻלָּתְךָ
  rationale: The revision makes the charge easier to follow without implying a different kind of commerce.
- pob_phrase: so I brought out fire from your midst—it consumed you
  simplified_phrase: So I brought fire out from within you. It consumed you
  preserved_meaning: Fire emerges from the addressee’s midst as God’s instrument of judgment.
  reasoning_layer_used: Lexical decision and POB footnote for וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  rationale: Two short sentences clarify the sequence while preserving the force of the fire image.
