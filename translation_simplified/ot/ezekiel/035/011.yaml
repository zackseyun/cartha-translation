translation:
  language: en
  text: “Therefore, as surely as I live,” declares the Lord Yahweh, “I will deal with you in keeping with the anger and jealousy you acted on because you hated them. I will make myself known among them[a] when I judge you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will be known among them” or “I will make myself known through them.”
