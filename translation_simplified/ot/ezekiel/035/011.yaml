simplification_decisions:
- pob_phrase: as I live
  simplified_phrase: as surely as I live
  preserved_meaning: God solemnly guarantees the judgment by an oath based on his own life.
  reasoning_layer_used: lexical decision for חַי אָנִי
  rationale: Adding “surely” makes the force of the divine oath immediately clear.
- pob_phrase: according to your anger and according to your jealousy, which you acted out
  simplified_phrase: in keeping with the anger and jealousy you acted on
  preserved_meaning: God’s response corresponds to the hostile anger and jealousy expressed in action.
  reasoning_layer_used: lexical decisions for כְּאַפְּךָ, וּכְקִנְאָתְךָ, and אֲשֶׁר עָשִׂיתָה
  rationale: The recast removes repetition while retaining proportional judgment.
- pob_phrase: because of your hatred against them
  simplified_phrase: because you hated them
  preserved_meaning: The hostile actions arose from hatred directed against the people.
  reasoning_layer_used: lexical decisions for מִשִּׂנְאָתֶיךָ and בָּם
  rationale: A direct verbal clause states the same cause in natural English.
