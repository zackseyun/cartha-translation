- pob_phrase: with your mouth you magnified yourselves against me
  simplified_phrase: You boasted against me with your mouths
  preserved_meaning: They exalted themselves through hostile speech directed against God.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Boasted” makes the Hebrew idiom clear, while the footnote preserves its image of making oneself great.
- pob_phrase: multiplied your words against me
  simplified_phrase: piled up words against me
  preserved_meaning: They spoke many hostile words against God.
  reasoning_layer_used: lexical decision
  rationale: “Piled up” expresses the accumulation of words in natural English without weakening their hostile direction.
- pob_phrase: I myself have heard
  simplified_phrase: I myself have heard them
  preserved_meaning: God emphatically declares that he has heard and knows their words.
  reasoning_layer_used: lexical decision
  rationale: The pronoun “them” clearly points back to the hostile words while retaining the emphatic “I myself.”
