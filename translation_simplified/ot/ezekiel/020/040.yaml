translation:
  language: en
  text: 'This is what the Lord Yahweh declares: “On my holy mountain, the high mountain of Israel, the whole house of Israel will serve me—every one of them in the land. There I will accept them. There I will require the offerings you set apart for me, the first portion of your offerings,[a] and everything you dedicate as holy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the firstfruits of your offerings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: declares the Lord GOD
  simplified_phrase: This is what the Lord Yahweh declares
  preserved_meaning: The formula still introduces God's authoritative declaration while naming Yahweh according to the stated doctrine.
  reasoning_layer_used: POB theological decision for אֲדֹנָי יְהוִה
  rationale: Moving the formula to the beginning removes an interruption and makes the speaker immediately clear.
- pob_phrase: all the house of Israel, all of them in the land
  simplified_phrase: the whole house of Israel will serve me—every one of them in the land
  preserved_meaning: Both parts preserve the emphatic inclusion of all restored Israel.
  reasoning_layer_used: POB lexical rationale for כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  rationale: Natural word order makes the repeated total emphasis easier to follow.
- pob_phrase: your contributions and the firstfruits of your offerings, with all your holy things
  simplified_phrase: the offerings you set apart for me, the first portion of your offerings, and everything you dedicate as holy
  preserved_meaning: The wording retains offerings presented to God, their first portion, and all consecrated things as distinct ideas.
  reasoning_layer_used: POB lexical decisions for תְּרוּמֹתֵיכֶם, רֵאשִׁית מַשְׂאוֹתֵיכֶם, and בְּכָל קָדְשֵׁיכֶם
  rationale: Clear descriptions replace opaque ritual wording without merging the categories.
