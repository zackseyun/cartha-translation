translation:
  language: en
  text: I am Yahweh your God. Live by my decrees. Keep my rulings and carry them out.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: walk in my statutes
  simplified_phrase: Live by my decrees
  preserved_meaning: God commands his people to order their lives by his prescribed decrees.
  reasoning_layer_used: The lexical rationale defines “walk in” as a covenant expression for conduct ordered by God’s statutes.
  rationale: The direct wording makes the idiom immediately clear without changing its meaning.
- pob_phrase: keep my judgments
  simplified_phrase: Keep my rulings
  preserved_meaning: God commands obedience to his legal judgments or ordinances.
  reasoning_layer_used: The lexical decision preserves the juridical sense and recognizes ordinances as a viable alternative.
  rationale: “Rulings” communicates the legal sense in common English without an unsupported intensifier.
- pob_phrase: and do them
  simplified_phrase: and carry them out
  preserved_meaning: God’s rulings must be put into actual practice.
  reasoning_layer_used: The lexical rationale says the clause stresses actual performance of the commands.
  rationale: “Carry them out” clearly expresses required action.
interpretive_expansions:
- pob_phrase: walk in my statutes
  rendering: Live by my decrees
  claim: Walking means ordering one’s life according to God’s decrees.
  evidence:
  - The POB lexical rationale explicitly explains the idiom as conduct ordered by God’s statutes.
  confidence: high
  alternatives_preserved:
  - The covenantal idea of an entire life governed by God’s decrees remains.
translation_notes:
  risk_flags:
  - risk: Replacing the walking image with “live by” removes its concrete form.
