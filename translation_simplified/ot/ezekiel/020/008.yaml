translation:
  language: en
  text: But they rebelled against me and refused to listen to me. No man threw away the detestable things he had set his eyes on, and they would not abandon Egypt’s idols.[a] Then I said I would pour out my wrath on them and let my anger run its full course against them there in Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “idols” is contemptuous and portrays them as filthy or vile.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were not willing to listen to me
  simplified_phrase: refused to listen to me
  preserved_meaning: Their failure to listen was deliberate rebellion, not mere inability to hear.
  reasoning_layer_used: Lexical decision for וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  rationale: “Refused” states their deliberate unwillingness in direct, common English.
- pob_phrase: the detestable things his eyes were set on
  simplified_phrase: the detestable things he had set his eyes on
  preserved_meaning: Each person remained fixated on abhorrent objects of worship.
  reasoning_layer_used: Lexical decision and footnote for שִׁקּוּצֵי עֵינֵיהֶם
  rationale: The active idiom is easier to follow while preserving the concrete image of the eyes.
- pob_phrase: to spend my anger against them in the midst of the land of Egypt
  simplified_phrase: let my anger run its full course against them there in Egypt
  preserved_meaning: God intended to carry his judicial anger through fully while they were in Egypt.
  reasoning_layer_used: Lexical decision for לְכַלּוֹת אַפִּי and theological decision on divine judgment
  rationale: “Run its full course” clearly conveys anger fully discharged without weakening the judgment.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “No man” as excluding women.
    mitigation: The wording retains POB’s representative masculine singular, which applies distributively to every person.
  - risk: “Run its full course” may sound less concrete than the Hebrew expression.
    mitigation: The rendering preserves the audited sense of anger brought to completion and keeps “wrath” distinct from “anger.”
