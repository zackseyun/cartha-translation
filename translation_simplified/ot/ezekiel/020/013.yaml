translation:
  language: en
  text: But the house of Israel rebelled against me in the wilderness. They did not follow my laws, and they rejected my rules. If a man[a] obeys them, he will live by them.[b] They deeply dishonored my Sabbaths by treating them as ordinary. So I said that I would pour out my wrath on them there in the wilderness and put an end to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents any person who obeys God’s rules.
    reason: lexical_alternative
  - marker: b
    text: This wording echoes Leviticus 18:5.
    reason: cross_reference
simplification_decisions:
- pob_phrase: They did not walk in my statutes
  simplified_phrase: They did not follow my laws
  preserved_meaning: Israel did not live in obedience to God’s established commands.
  reasoning_layer_used: POB lexical decision for בְּחֻקּוֹתַי לֹא הָלָכוּ
  rationale: “Follow” explains the walking idiom, while “laws” makes the covenant requirements clear.
- pob_phrase: they rejected my judgments
  simplified_phrase: they rejected my rules
  preserved_meaning: Israel refused the binding requirements God had given them.
  reasoning_layer_used: POB lexical decision for מִשְׁפָּטַי
  rationale: “Rules” avoids suggesting that these judgments were merely judicial verdicts.
- pob_phrase: They greatly profaned my Sabbaths
  simplified_phrase: They deeply dishonored my Sabbaths by treating them as ordinary
  preserved_meaning: Israel seriously violated the sacred status of God’s Sabbath days.
  reasoning_layer_used: POB lexical decision for חִלֵּלוּ מְאֹד
  rationale: The wording explains profanation as treating what is sacred as ordinary without repetition.
interpretive_expansions:
- pob_phrase: does them
  rendering: obeys them
  claim: Doing God’s rules here means carrying out what they command.
  evidence:
  - The immediate contrast says Israel rejected the rules rather than practicing them.
  - The POB rationale identifies the clause as a covenant formula about conduct.
  confidence: high
  alternatives_preserved:
  - does them
translation_notes:
  risk_flags:
  - risk: “Follow” does not retain the Hebrew walking image.
    mitigation: It directly preserves the image’s covenantal sense of ordering one’s life by God’s laws.
  - risk: Modern readers may hear “a man” as excluding women.
    mitigation: Footnote a explains that the singular represents any person.
