translation:
  language: en
  text: Just as I held your ancestors to account in the wilderness of Egypt, I will hold you to account in the same way, declares the Lord Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: entered into judgment with your fathers
  simplified_phrase: held your ancestors to account
  preserved_meaning: God formally dealt with the earlier generation as judge rather than merely announcing a verdict.
  reasoning_layer_used: POB lexical decisions for נִשְׁפַּטְתִּי and אֶת אֲבוֹתֵיכֶם
  rationale: “Held to account” preserves the judicial dealing, while “ancestors” clarifies the generational sense.
- pob_phrase: in the wilderness of the land of Egypt
  simplified_phrase: in the wilderness of Egypt
  preserved_meaning: The judgment took place in the wilderness associated with Egypt and the exodus generation.
  reasoning_layer_used: POB lexical alternatives for בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  rationale: This POB-approved shorter form reads naturally without narrowing the location.
- pob_phrase: so I will enter into judgment with you
  simplified_phrase: I will hold you to account in the same way
  preserved_meaning: God will deal judicially with the present generation as he did with their ancestors.
  reasoning_layer_used: POB lexical decisions for כֵּן and אִשָּׁפֵט אִתְּכֶם
  rationale: The repeated wording preserves the parallel, and “in the same way” makes the comparison clear.
translation_notes:
  risk_flags:
