    mitigation: The phrase still presents God as judging conduct, and the exact parallel preserves the judicial force.
  - risk: “Wilderness of Egypt” compresses the fuller Hebrew phrase “wilderness of the land of Egypt.”
    mitigation: POB lists this shorter form as an alternative, and it does not specify a narrower location.
