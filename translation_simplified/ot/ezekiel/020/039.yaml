translation:
  language: en
  text: 'But you, house of Israel, this is what the Lord GOD says: Go, each man, serve his idols[a]—if afterward you will not listen to me.[b] But you must no longer treat my holy name as unholy with your offerings and your idols.'
  philosophy: optimal-equivalence
  footnotes:
