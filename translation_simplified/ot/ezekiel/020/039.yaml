simplification_decisions:
- pob_phrase: But as for you, house of Israel, thus says the Lord GOD
  simplified_phrase: But you, house of Israel, this is what the Lord GOD says
  preserved_meaning: God turns directly to Israel and introduces his words with the prophetic announcement formula.
  reasoning_layer_used: Lexical decisions for וְאַתֶּם, בֵּית יִשְׂרָאֵל, and אֲדֹנָי יְהֹוִה
  rationale: The wording is natural English without adding a command to hear.
- pob_phrase: Go, each man, serve his idols
  simplified_phrase: Go, each man, serve his idols
  preserved_meaning: The direct command retains its sharp judicial force and each man's responsibility.
  reasoning_layer_used: Lexical and theological decisions on אִישׁ and the imperatives
  rationale: Keeping the direct imperatives avoids making the statement sound like ordinary permission.
- pob_phrase: you shall no longer profane my holy name with your gifts and with your idols
  simplified_phrase: you must no longer treat my holy name as unholy with your offerings and your idols
  preserved_meaning: Israel is firmly forbidden to misuse its offerings and idols in a way that profanes God's holy name.
  reasoning_layer_used: Lexical decisions on לֹא תְחַלְּלוּ עוֹד and בְּמַתְּנוֹתֵיכֶם
  rationale: The wording explains “profane” and clarifies likely worship gifts without adding unstated actions.
