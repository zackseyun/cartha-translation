translation:
  language: en
  text: 'Therefore, say to the people of Israel, “This is what the Lord Yahweh says: Are you making yourselves unclean by following your ancestors’ ways and prostituting yourselves by chasing after their detestable things?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, “detestable things” includes idols, but the expression can refer more broadly to abominations.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: house of Israel
  simplified_phrase: people of Israel
  preserved_meaning: God addresses Israel as a whole people.
  reasoning_layer_used: POB lexical decision on the corporate designation
  rationale: “People of Israel” makes the collective address immediately clear.
- pob_phrase: in the way of your fathers
  simplified_phrase: by following your ancestors’ ways
  preserved_meaning: Israel is repeating the practices of earlier generations.
  reasoning_layer_used: POB lexical rationale for the ancestral-pattern idiom
  rationale: The rewrite states the idiom’s meaning in ordinary English.
- pob_phrase: whoring after their detestable things
  simplified_phrase: prostituting yourselves by chasing after their detestable things
  preserved_meaning: Idolatry is portrayed as deliberate covenantal prostitution.
  reasoning_layer_used: POB lexical decisions for זנה, אחרי, and שקוציהם
  rationale: The wording preserves both the forceful sexual metaphor and the image of pursuit.
translation_notes:
  risk_flags:
  - risk: “Prostituting yourselves” could be mistaken for literal sexual conduct.
    mitigation: Its connection to pursuing detestable objects and the footnote preserve the prophetic idolatry metaphor.
