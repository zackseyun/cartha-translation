translation:
  language: en
  text: But the next generation rebelled against me. They did not follow my statutes. They did not keep my judgments by putting them into practice—the judgments that, if a man obeys them, he will live by them.[a][b] They treated my Sabbaths as unholy. So I said I would pour out my wrath on them and let my anger against them run its full course in the wilderness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “if a person obeys them, that person will live by them.” Hebrew uses “man” generically for a human being.
    reason: lexical_alternative
  - marker: b
    text: This statement echoes Leviticus 18:5.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the children
  simplified_phrase: the next generation
  preserved_meaning: The rebels are the following generation of Israelites, not merely young children.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: The clearer phrase makes the generational contrast immediately understandable.
- pob_phrase: did not walk in my statutes, and they did not keep my judgments so as to do them
  simplified_phrase: did not follow my statutes. They did not keep my judgments by putting them into practice
  preserved_meaning: They neither followed God's statutes nor guarded his judgments with the purpose of obeying them.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: The rewrite preserves both keeping and doing while replacing dense covenant phrasing with natural English.
- pob_phrase: profaned my Sabbaths ... spend my anger against them
  simplified_phrase: treated my Sabbaths as unholy ... let my anger against them run its full course
  preserved_meaning: They violated what God made holy, and God intended to express his anger fully against them.
  reasoning_layer_used: POB lexical decisions
  rationale: The wording explains the sacred contrast and the full expression of anger without weakening either idea.
interpretive_expansions:
- pob_phrase: the children
  rendering: the next generation
  claim: The phrase identifies the generation descended from the previously addressed Israelites.
  evidence:
  - The POB lexical rationale says it refers collectively to Israel's next generation.
  - The surrounding generational contrast supports this identification.
  confidence: high
  alternatives_preserved:
  - the children
  - the sons
translation_notes:
  risk_flags:
  - risk: The generic word “man” may be mistaken as referring only to males.
    mitigation: Footnote [a] states the inclusive generic sense while retaining the POB's theological decision.
  - risk: “Run its full course” recasts the Hebrew idiom for bringing anger to full expression.
    mitigation: The wording retains the documented sense of complete judgment and keeps the separate “pour out” metaphor.
