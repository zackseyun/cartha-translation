  edition: POB
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
  footnotes:
