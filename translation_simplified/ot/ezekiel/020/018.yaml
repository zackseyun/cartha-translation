translation:
  language: en
  text: Then I said to their children in the wilderness, “Do not follow your fathers’ statutes. Do not obey their rulings, and do not make yourselves unclean with their idols.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term for “idols” is strongly contemptuous and can mean “filthy idols” or “dung-idols.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I said
  simplified_phrase: Then I said
  preserved_meaning: God’s speech follows the preceding events in sequence.
  reasoning_layer_used: Lexical decision for וָאֹמַר
  rationale: “Then” makes the narrative sequence immediately clear without adding a new inference.
- pob_phrase: Do not walk in the statutes of your fathers
  simplified_phrase: Do not follow your fathers’ statutes
  preserved_meaning: They must not conduct their lives according to the prior generation’s prescribed practices.
  reasoning_layer_used: Lexical decisions for חֻקֵּי, אֲבוֹתֵיכֶם, and תֵּלֵכוּ
  rationale: “Follow” expresses the Hebrew walking metaphor in natural English while retaining “fathers” and “statutes.”
- pob_phrase: do not keep their judgments, and do not defile yourselves
  simplified_phrase: Do not obey their rulings, and do not make yourselves unclean
  preserved_meaning: They must neither observe the prior generation’s rulings nor become contaminated through idolatry.
  reasoning_layer_used: Lexical decisions for מִשְׁפְּטֵיהֶם, תִּשְׁמֹרוּ, and תִּטַּמָּאוּ
  rationale: Common verbs clarify the two commands while “rulings” remains distinct from “statutes.”
translation_notes:
  risk_flags:
  - risk: “Follow” makes the Hebrew walking image less visible.
    mitigation: It preserves the image’s idiomatic force of directing one’s conduct.
  - risk: “Make yourselves unclean” may be read as merely physical dirtiness.
    mitigation: The phrase “with their idols” identifies the moral and ritual setting.
