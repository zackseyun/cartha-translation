  reasoning_layer_used: Lexical decision for עָשׂוּ with מִשְׁפָּטַי
  rationale: “Follow” expresses obedience more naturally for a common reader.
- pob_phrase: profaned my Sabbaths
  simplified_phrase: treated my Sabbaths as common
  preserved_meaning: They dishonored days God had set apart as holy.
  reasoning_layer_used: Lexical decision for חִלֵּלוּ
  rationale: This explains profaning through the biblical contrast between holy and common.
- pob_phrase: their eyes were after the idols
  simplified_phrase: desired the idols
  preserved_meaning: Their desire and allegiance were directed toward idols.
  reasoning_layer_used: Lexical decisions for אַחֲרֵי and הָיוּ עֵינֵיהֶם
  rationale: “Desired” conveys the idiom's force without implying only a visual gaze.
