translation:
  language: en
  text: 'Say to them, “This is what the Lord GOD says: When I chose Israel, I raised my hand[a] to the descendants of Jacob and made myself known to them in Egypt. I raised my hand to them and said, ‘I am Yahweh your God.’”'
  philosophy: optimal-equivalence
  footnotes:
