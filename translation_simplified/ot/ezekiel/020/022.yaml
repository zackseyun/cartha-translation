  reasoning_layer_used: POB lexical and theological decisions on divine restraint
  rationale: The added phrase explains the hand idiom, and the sentence break makes the action easier to follow.
- pob_phrase: so that it would not be profaned in the sight of the nations
  simplified_phrase: so that it would not be dishonored in front of the nations
  preserved_meaning: God protected the public honor of his name among the nations.
  reasoning_layer_used: POB lexical decision on חלל and theological decision on God's name
  rationale: “Dishonored” expresses the public-honor sense of “profaned” in common English.
- pob_phrase: before whose eyes I had brought them out
