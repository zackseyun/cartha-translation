translation:
  language: en
  text: There you will remember how you lived, all the things you did, and how you defiled yourselves through them. You will be disgusted with yourselves because of all the evil you have done.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your ways and all your deeds by which you defiled yourselves
  simplified_phrase: how you lived, all the things you did, and how you defiled yourselves through them
  preserved_meaning: Israel will recall both its sinful way of life and its specific acts as the means of self-defilement.
  reasoning_layer_used: lexical decisions for דַּרְכֵיכֶם, עֲלִילוֹתֵיכֶם, and נִטְמֵאתֶם בָּם
  rationale: The recast sentence distinguishes conduct from deeds while making their role in defilement easy to follow.
- pob_phrase: you will loathe yourselves in your own sight
  simplified_phrase: You will be disgusted with yourselves
  preserved_meaning: They will experience strong moral revulsion toward themselves because of their past evil.
  reasoning_layer_used: lexical decision for וּנְקֹטֹתֶם and theological decision on repentance
  rationale: “Be disgusted with” is common English that retains the Hebrew verb’s strong force.
translation_notes:
  risk_flags:
  - risk: “Be disgusted with yourselves” could be heard as unrestricted self-hatred.
    mitigation: The following phrase limits the disgust to their response to the evil they committed.
