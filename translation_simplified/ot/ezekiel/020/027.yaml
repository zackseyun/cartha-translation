translation:
  language: en
  text: 'So speak to the people of Israel, son of man. Tell them, “This is what the Lord Yahweh says: In this matter too, your fathers blasphemed me by their faithless betrayal of me.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore speak to the house of Israel, son of man, and say to them
  simplified_phrase: So speak to the people of Israel, son of man. Tell them
  preserved_meaning: God commands Ezekiel, addressed by his standard title, to deliver this message to covenant Israel.
  reasoning_layer_used: POB lexical decisions for לָכֵן, בֵּית יִשְׂרָאֵל, and בֶּן אָדָם
  rationale: The idiom becomes transparent and the command is divided into two short sentences.
- pob_phrase: Thus says the Lord Yahweh
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The message that follows comes with Yahweh’s authority.
  reasoning_layer_used: POB messenger-formula decision and theological decision for the divine name
  rationale: A familiar modern formula retains both divine authority and the name Yahweh.
- pob_phrase: In this also your fathers blasphemed me, by acting treacherously against me
  simplified_phrase: In this matter too, your fathers blasphemed me by their faithless betrayal of me
  preserved_meaning: Their faithless betrayal was an additional grave offense directed against God.
  reasoning_layer_used: POB lexical decisions for עוֹד זֹאת, גִּדְּפוּ, and the emphatic cognate construction with מעל
  rationale: One unified phrase avoids presenting the repeated Hebrew idea as two separate acts.
translation_notes:
  risk_flags:
  - risk: “People of Israel” does not preserve the source idiom “house of Israel” word for word.
    mitigation: It clearly expresses the idiom’s collective covenantal referent without changing the audience.
