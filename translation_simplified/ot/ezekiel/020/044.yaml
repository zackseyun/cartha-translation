translation:
  language: en
  text: Then you will know that I am Yahweh when I deal with you[a] for the honor of my name, not as your evil conduct and corrupt deeds deserve. People of Israel, this is what the Lord GOD declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “act toward you.” The Hebrew does not specify whether God’s action here is judgment, mercy, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for the sake of my name
  simplified_phrase: for the honor of my name
  preserved_meaning: God acts for the sake of his name and reputation.
  reasoning_layer_used: POB cultural note and lexical rationale
  rationale: This keeps the purpose relation while explaining what concern for God’s name means.
- pob_phrase: not according to your evil ways or according to your corrupt deeds
  simplified_phrase: not as your evil conduct and corrupt deeds deserve
  preserved_meaning: God will not treat Israel in strict accordance with its wicked behavior.
  reasoning_layer_used: POB lexical decisions for דֶּרֶךְ and עֲלִילוֹת
  rationale: Natural English retains both Israel’s pattern of conduct and its specific deeds.
- pob_phrase: O house of Israel, declares the Lord GOD
  simplified_phrase: People of Israel, this is what the Lord GOD declares
  preserved_meaning: God directly addresses Israel through the standard prophetic declaration.
  reasoning_layer_used: POB lexical rationale for the vocative and prophetic formula
  rationale: The rewrite removes the archaic address while preserving its directness and authority.
interpretive_expansions:
- pob_phrase: for the sake of my name
  rendering: for the honor of my name
  claim: God’s name here carries the honor of his reputation, which governs why he acts.
  evidence:
  - The POB cultural note identifies the phrase with the honor of God’s reputation.
  - The Hebrew purpose phrase and POB wording make God’s name the reason for his action.
  confidence: high
  alternatives_preserved:
  - for the sake of my name
- pob_phrase: not according to your evil ways or according to your corrupt deeds
  rendering: not as your evil conduct and corrupt deeds deserve
  claim: God does not give Israel the response its wicked behavior would warrant.
  evidence:
  - The POB rationale identifies Israel’s conduct as the standard against which God’s action is compared.
  - The immediate contrast sets God’s name-based action against action corresponding to Israel’s evil.
  confidence: high
  alternatives_preserved:
  - not according to your evil ways or corrupt deeds
translation_notes:
  risk_flags:
  - risk: “Deserve” makes the implied standard of corresponding treatment explicit.
    mitigation: The Hebrew comparison and POB rationale support this meaning without defining God’s action.
  - risk: “Deal with you” could sound exclusively punitive.
    mitigation: The footnote preserves the Hebrew breadth of judgment, mercy, or both.
