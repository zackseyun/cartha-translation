translation:
  language: en
  text: I will bring you out from among the peoples and gather you from the lands where you were scattered. I will do this with a strong hand and an outstretched arm, and I will pour out my wrath.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: bring you out from the peoples
  simplified_phrase: bring you out from among the peoples
  preserved_meaning: God will remove the people from the groups among whom they live.
  reasoning_layer_used: POB lexical decision for הָעַמִּים
  rationale: “From among” makes the relationship clear without replacing “peoples” with “nations.”
- pob_phrase: with a strong hand and an outstretched arm and with wrath poured out
  simplified_phrase: I will do this with a strong hand and an outstretched arm, and I will pour out my wrath
  preserved_meaning: God's decisive exodus-like action includes judgment as well as regathering.
  reasoning_layer_used: POB theological decision on exodus imagery and judgment
  rationale: The recast clause reads naturally while retaining both the bodily images and poured-out wrath.
interpretive_expansions:
- pob_phrase: with wrath poured out
  rendering: I will pour out my wrath
  claim: God is the one pouring out the wrath, and the wrath belongs to him.
  evidence:
  - The whole verse is spoken by God in the first person.
  - The POB identifies the phrase as prophetic divine anger.
  confidence: high
  alternatives_preserved:
  - The regathering still carries both restoration and judgment.
  - “Fury” remains a lexical alternative to “wrath.”
translation_notes:
  risk_flags:
  - risk: Breaking the verse into two sentences may weaken the close link between regathering and judgment.
    mitigation: “I will do this” explicitly connects the divine action and wrath to the regathering.
