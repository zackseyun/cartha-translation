translation:
  language: en
  text: '“Son of man, speak to Israel’s elders. Tell them, ‘This is what the Lord Yahweh says: Have you come to consult me? As surely as I live, I will not allow you to consult me,’ declares the Lord Yahweh.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: speak to the elders of Israel and say to them
  simplified_phrase: speak to Israel’s elders. Tell them
  preserved_meaning: Ezekiel must address Israel’s recognized leaders with God’s message.
  reasoning_layer_used: lexical decision for זִקְנֵי יִשְׂרָאֵל
  rationale: Two short sentences make the command easier to follow without merging its parts.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The words that follow are Yahweh’s authoritative prophetic message.
  reasoning_layer_used: lexical messenger formula and updated theological decision for יהוה
  rationale: The modern formula stays solemn, while “Yahweh” follows the controlling doctrinal decision.
- pob_phrase: I will not be inquired of by you
  simplified_phrase: I will not allow you to consult me
  preserved_meaning: God emphatically refuses to receive their request for divine guidance.
  reasoning_layer_used: lexical and theological decisions for אִם אִדָּרֵשׁ לָכֶם
  rationale: The active wording removes an awkward passive while preserving God’s deliberate refusal.
translation_notes:
  risk_flags:
  - risk: “Consult” could sound like seeking ordinary advice.
    mitigation: Addressing Yahweh directly in a prophetic setting signals a request for divine guidance.
