translation:
  language: en
  text: Will you judge them—will you judge them, son of man?[a] Tell them about the abominable practices of their fathers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Son of man” is God’s regular way of addressing Ezekiel here; it may also be translated “mortal” or “human one.”
    reason: lexical_alternative
  - marker: b
    text: Or “ancestors.” The Hebrew literally says “fathers.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Will you judge them? Will you judge, son of man?
  simplified_phrase: Will you judge them—will you judge them, son of man?
  preserved_meaning: The repeated judicial challenge remains emphatic and is directed to Ezekiel.
  reasoning_layer_used: Lexical decisions for both occurrences of הֲתִשְׁפֹּט and the theological decision for בֶּן אָדָם.
  rationale: Repeating “them” makes the second question natural in English without weakening the Hebrew repetition.
- pob_phrase: Make known to them the abominations of their fathers.
  simplified_phrase: Tell them about the abominable practices of their fathers.
  preserved_meaning: Ezekiel must confront them with their fathers’ morally and covenantally detestable conduct.
  reasoning_layer_used: Lexical decisions for הוֹדִיעֵם, תּוֹעֲבוֹת, and אֲבוֹתָם.
  rationale: “Tell them about” is clearer than “make known,” while “abominable practices” preserves the strong moral force.
translation_notes:
  risk_flags:
  - risk: “Practices” presents the abominations specifically as conduct.
    mitigation: The POB lexical rationale identifies “abominable practices” as a viable contextual rendering.
