translation:
  language: en
  text: When you present your gifts—when you sacrifice your sons by making them pass through the fire—you defile yourselves with all your idols to this day. So will I allow you to consult me, people of Israel? As surely as I live, declares the Lord Yahweh, I will not allow you to consult me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when you make your sons pass through the fire
  simplified_phrase: when you sacrifice your sons by making them pass through the fire
  preserved_meaning: The wording keeps the Hebrew fire image while clearly identifying the act as child sacrifice.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The POB audit identifies this expression as an idiom for child sacrifice.
- pob_phrase: And shall I be inquired of by you
  simplified_phrase: So will I allow you to consult me
  preserved_meaning: God rhetorically asks whether he will receive their request for guidance.
  reasoning_layer_used: POB lexical decision
  rationale: “Consult me” naturally expresses seeking divine guidance.
- pob_phrase: O house of Israel
  simplified_phrase: people of Israel
  preserved_meaning: God directly addresses the nation of Israel.
  reasoning_layer_used: POB lexical rationale
  rationale: This preserves the direct address without the archaic “O” or opaque “house.”
interpretive_expansions:
- pob_phrase: make your sons pass through the fire
  rendering: sacrifice your sons by making them pass through the fire
  claim: The fire ritual described here is child sacrifice in idolatrous worship.
  evidence:
