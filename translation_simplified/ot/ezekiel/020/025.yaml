translation:
  language: en
  text: What is more, I myself gave them laws that were not good[a] and rules they could not live by.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, as an interpretation, “I gave them over to laws that were not good.” This understands God’s action as judgment, not as issuing morally defective laws.
    reason: alternative_reading
  - marker: b
    text: “Live by” echoes the covenant promise that obedience to God’s laws leads to life (see Leviticus 18:5), but here that expression is reversed.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Moreover
  simplified_phrase: What is more
  preserved_meaning: The statement adds an emphatic point to the preceding argument.
  reasoning_layer_used: lexical decision for וְגַם
  rationale: The common expression keeps both the connecting and emphatic force.
- pob_phrase: statutes that were not good
  simplified_phrase: laws that were not good
  preserved_meaning: God directly says that he gave requirements described as not good.
  reasoning_layer_used: lexical and theological decisions for חֻקִּים and לֹא טוֹבִים
  rationale: “Laws” is clearer than “statutes” while leaving the theological tension unresolved.
- pob_phrase: ordinances by which they could not live
  simplified_phrase: rules they could not live by
  preserved_meaning: These rules are presented as unable to lead the people to covenantal life.
  reasoning_layer_used: lexical decision for מִשְׁפָּטִים and covenantal idiom in לֹא יִחְיוּ בָּהֶם
  rationale: Natural clause order preserves the deliberate reversal of “live by them.”
translation_notes:
  risk_flags:
  - risk: Readers may conclude that God issued morally defective covenant laws.
    mitigation: Footnote a preserves the documented judicial interpretation without weakening the main text.
  - risk: “Live by” may be understood only as practical daily conduct.
    mitigation: Footnote b identifies the covenantal life idiom and its reversal.
