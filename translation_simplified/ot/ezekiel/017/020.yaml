translation:
  language: en
  text: I will spread my net over him, and he will be caught in my trap. Then I will take him to Babylon. There I will bring him to trial[a] for his treachery in breaking faith with me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there I will enter into judgment with him”; the Hebrew describes judicial action, not only the final verdict.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he will be caught in my snare
  simplified_phrase: he will be caught in my trap
  preserved_meaning: God’s hunting image portrays the man as unable to escape capture.
  reasoning_layer_used: Lexical decision for בִּמְצוּדָתִי in parallel with “my net.”
  rationale: “Trap” is clearer than “snare” while preserving the trapping metaphor.
- pob_phrase: there I will enter into judgment with him
  simplified_phrase: There I will bring him to trial
  preserved_meaning: God will undertake judicial proceedings against him in Babylon.
  reasoning_layer_used: Lexical and theological decisions for וְנִשְׁפַּטְתִּי אִתּוֹ.
  rationale: “Bring him to trial” makes the legal action clear without reducing it to a verdict.
- pob_phrase: for his treachery by which he acted treacherously against me
  simplified_phrase: for his treachery in breaking faith with me
  preserved_meaning: His covenant betrayal is a serious offense directly against God.
  reasoning_layer_used: Lexical and theological decisions for מַעַל and מָעַל בִּי.
  rationale: “Breaking faith” explains the repeated treachery wording in natural English.
translation_notes:
  risk_flags:
