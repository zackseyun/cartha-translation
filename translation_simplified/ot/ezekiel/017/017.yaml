  preserved_meaning: A large gathered body accompanies the army.
  reasoning_layer_used: POB lexical decision for וּבְקָהָל רָב
  rationale: This makes the assembly sense clear in common English.
- pob_phrase: when they cast up a siege ramp and build a siege wall
