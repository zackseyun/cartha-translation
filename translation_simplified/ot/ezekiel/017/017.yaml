translation:
  language: en
  text: Pharaoh will not take effective action on his behalf in the war with a great army and a large gathering of people.[a] This will happen as a siege ramp is piled up and a siege wall is built to cut off many lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be expressed as “help him”; its wording more broadly refers to acting on his behalf.
    reason: lexical_alternative
