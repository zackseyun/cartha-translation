  preserved_meaning: Pharaoh will not intervene effectively for him.
  reasoning_layer_used: POB lexical decision and rationale for יַעֲשֶׂה אֹתוֹ
  rationale: This explains the Hebrew idiom without narrowing it to general help.
- pob_phrase: a large assembly
