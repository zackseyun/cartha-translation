translation:
  language: en
  text: “As surely as I live,” declares the Lord Yahweh, “he will certainly die in Babylon itself, the place of the king who made him king. He treated that king’s oath[a] with contempt and broke the covenant[b] he had made with him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean an oath that called down a curse on the person who broke it.
    reason: lexical_alternative
  - marker: b
    text: Here “covenant” may refer to a treaty between kings.
    reason: lexical_alternative
