  rationale: The clearer oath formula retains both the self-oath and its emphatic force.
- pob_phrase: in the place of the king who made him king ... in the midst of Babylon
  simplified_phrase: in Babylon itself, the place of the king who made him king
  preserved_meaning: He will die in Babylon, where the king who installed him reigns.
  reasoning_layer_used: Lexical decisions for בִּמְקוֹם, הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ, and בְּתוֹךְ בָּבֶל
  rationale: “Babylon itself” preserves the spatial emphasis without the opaque phrase “in the midst of.”
- pob_phrase: whose oath he despised and whose covenant he broke—with him
  simplified_phrase: He treated that king’s oath with contempt and broke the covenant he had made with him
  preserved_meaning: The installed king contemptuously violated his sworn agreement with the enthroning king.
  reasoning_layer_used: Lexical decisions for אָלָה, בְּרִית, and אִתּוֹ
  rationale: A separate sentence and explicit antecedent make the political betrayal easy to follow.
