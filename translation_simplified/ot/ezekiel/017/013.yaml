  text: He selected one of the royal descendants and made a covenant with him, binding him by an oath.[a] He also took away the powerful men of the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean a curse-oath—an oath that brings a curse if it is broken.
    reason: lexical_alternative
