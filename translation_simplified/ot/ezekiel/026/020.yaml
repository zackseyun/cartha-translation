translation:
  language: en
  text: Then I will bring you down to the pit with those who go down there, to the people from long ago. I will make you stay in the land below. There you will be like ruins from ancient times, among those who go down to the pit, so that no one will live in you. But I will establish beauty[a] in the land of the living.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “glory” or “splendor.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to the people of long ago
  simplified_phrase: to the people from long ago
  preserved_meaning: These are people of the remote past associated with the pit.
  reasoning_layer_used: POB lexical decision for עַם עוֹלָם
  rationale: “From long ago” is more natural modern English while retaining the time reference.
- pob_phrase: I will make you dwell in the land below, like ruins from ancient times
  simplified_phrase: I will make you stay in the land below. There you will be like ruins from ancient times
  preserved_meaning: God will cause the city to remain in the realm below with the fate of age-old ruins.
  reasoning_layer_used: POB lexical decisions for וְהוֹשַׁבְתִּיךְ, בְּאֶרֶץ תַּחְתִּיּוֹת, and כָּחֳרָבוֹת מֵעוֹלָם
  rationale: Two sentences clarify the relationship while preserving the downward realm and ruin image.
- pob_phrase: so that you will not be inhabited
  simplified_phrase: so that no one will live in you
  preserved_meaning: The city will be left without inhabitants.
  reasoning_layer_used: POB lexical decision for לְמַעַן לֹא תֵשֵׁבִי
  rationale: The active wording states the city sense directly in common English.
translation_notes:
  risk_flags:
  - risk: “Establish beauty” remains unusual because the Hebrew final clause is terse and debated.
    mitigation: The main text keeps POB’s general choice, while the footnote preserves “glory” and “splendor” as alternatives.
  - risk: “Pit” may be read as only a literal hole.
    mitigation: The repeated descent, ancient people, and contrast with the land of the living preserve its grave and underworld resonance.
