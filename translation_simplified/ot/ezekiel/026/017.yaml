translation:
  language: en
  text: 'They will raise this lament over you:


    “How you have perished!

    You who received people or supplies from the seas,[a]

    a city people praised,

    strong at sea—

    she and her inhabitants brought terror

    upon all who lived in her.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult; it may refer to people or supplies coming from maritime regions, while some understand it as describing the city’s location by the sea.
    reason: lexical_alternative
