  simplified_phrase: 'They will raise this lament over you:'
  preserved_meaning: The words that follow are the lament spoken over Tyre.
  reasoning_layer_used: Lexical decision for וְנָשְׂאוּ ... קִינָה
  rationale: The colon replaces a repetitive speech introduction while preserving the image of raising a lament.
- pob_phrase: the praised city
  simplified_phrase: a city people praised
  preserved_meaning: Tyre was a celebrated city.
  reasoning_layer_used: Lexical decision for הָעִיר הַהֻלָּלָה
  rationale: An active clause communicates the passive description in natural English.
- pob_phrase: which was strong in the sea, she and her inhabitants ... imposed their terror
  simplified_phrase: strong at sea—she and her inhabitants brought terror
  preserved_meaning: The city was powerful at sea, and the personified city together with her people caused dread.
  reasoning_layer_used: Lexical and theological decisions for חֲזָקָה בַיָּם, הִיא וְיֹשְׁבֶיהָ, and נָתְנוּ חִתִּיתָם
  rationale: The dash keeps maritime strength distinct from the following terror clause while retaining feminine personification.
