translation:
  language: en
  text: With his horses’ hooves, he will trample every one of your streets.[a] He will kill your people with the sword, and your pillars of power[b] will fall to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “every open place” or “every city square.”
    reason: lexical_alternative
  - marker: b
    text: Or “monuments of your power”; the Hebrew may refer to prominent pillars or standing monuments connected with Tyre’s power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: With the hoofs of his horses he will trample all your streets
  simplified_phrase: With his horses’ hooves, he will trample every one of your streets
  preserved_meaning: The attacker uses his horses’ hooves to trample every street in the city.
  reasoning_layer_used: POB lexical decisions for בְּפַרְסוֹת, סוּסָיו, יִרְמֹס, and כָּל חוּצוֹתָיִךְ
  rationale: The modern wording keeps the hooves as the means of trampling and avoids an unclear spatial relationship.
- pob_phrase: the pillars of your strength will come down to the ground
  simplified_phrase: your pillars of power will fall to the ground
  preserved_meaning: Tyre’s prominent pillars or monuments associated with its power will collapse.
  reasoning_layer_used: POB lexical decisions for וּמַצְּבוֹת עֻזֵּךְ, לָאָרֶץ, and תֵּרֵד
  rationale: “Pillars of power” and “fall” express the image in clear modern English without making it merely figurative.
translation_notes:
