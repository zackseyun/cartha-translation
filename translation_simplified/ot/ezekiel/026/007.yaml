  preserved_meaning: God is bringing Nebuchadnezzar and his forces against Tyre in hostile action.
  reasoning_layer_used: POB lexical decision for מֵבִיא אֶל and the immediate military context
  rationale: “To attack” makes the hostile sense clear while keeping the whole invading force under God’s action.
- pob_phrase: an assembly and a numerous people
