  preserved_meaning: This remains a solemn prophetic announcement using God’s covenant name.
  reasoning_layer_used: POB lexical decisions and the updated theological decision for יְהוָה
  rationale: The formula is recast in natural English, and “Yahweh” follows the controlling doctrine update.
- pob_phrase: I am bringing against Tyre
