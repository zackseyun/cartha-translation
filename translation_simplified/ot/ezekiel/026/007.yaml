translation:
  language: en
  text: 'For this is what the Lord Yahweh says: “See, I am bringing Nebuchadnezzar, king of Babylon, from the north to attack Tyre—a king of kings—with horses, chariots, horsemen, a gathered force, and a great many people.”'
