translation:
  language: en
  text: They will seize your riches and trade goods. They will tear down your city walls and destroy your fine houses. They will dump your stones, wooden beams, and rubble into the water.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “rubble” can also mean “dust” or “earth”; here it refers to debris from the demolished city.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: plunder your wealth and loot your merchandise
  simplified_phrase: seize your riches and trade goods
  preserved_meaning: Invaders violently take Tyre’s wealth and commercial goods.
  reasoning_layer_used: Lexical decisions for חֵילֵךְ and רְכֻלָּתֵךְ in Tyre’s commercial context.
  rationale: Common terms make the economic loss immediately clear without weakening the hostile seizure.
- pob_phrase: tear down your walls and demolish your splendid houses
  simplified_phrase: tear down your city walls and destroy your fine houses
  preserved_meaning: The attackers ruin Tyre’s fortifications and costly homes.
  reasoning_layer_used: Lexical decisions for חוֹמוֹתַיִךְ, בָתֵּי חֶמְדָּתֵךְ, and יִתֹּצוּ.
  rationale: “City walls” identifies the fortifications, while “fine houses” plainly conveys desirable buildings.
- pob_phrase: throw your stones, your timbers, and your dust into the midst of the waters
  simplified_phrase: dump your stones, wooden beams, and rubble into the water
  preserved_meaning: The city’s demolished building materials are cast into the water.
  reasoning_layer_used: Lexical decisions for אֲבָנַיִךְ, עֵצַיִךְ, עֲפָרֵךְ, and יָשִׂימוּ.
  rationale: “Dump” and “rubble” clearly present the vivid image of a ruined city being thrown into the water.
translation_notes:
  risk_flags:
  - risk: “Rubble” is more contextual than the Hebrew’s literal “dust” or “earth.”
    mitigation: The footnote preserves the literal alternatives, and the demolition context supports debris.
  - risk: “Into the water” does not reproduce the Hebrew plural “into the midst of the waters.”
    mitigation: The simpler wording preserves the motion and destination without obscuring the destruction image.
