translation:
  language: en
  text: Then all the rulers of the sea[a] will step down from their thrones. They will take off their robes and strip off their embroidered clothes. They will wear trembling like clothing[b] and sit on the ground. They will tremble moment by moment and be appalled at you.
  philosophy: optimal-equivalence
  footnotes:
