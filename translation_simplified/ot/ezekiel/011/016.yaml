translation:
  language: en
  text: 'So tell them, “This is what the Lord Yahweh says: I sent them far away among the nations and scattered them through the lands. Even so, in the lands where they had gone, I became a small sanctuary for them.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a sanctuary for a little while.” The Hebrew may refer either to a small or limited sanctuary or to a temporary sanctuary.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore say, ‘Thus says the Lord GOD
  simplified_phrase: So tell them, “This is what the Lord Yahweh says
  preserved_meaning: God commands the prophet to deliver his message while preserving the divine title and covenant name.
  reasoning_layer_used: Lexical decisions for לָכֵן, אֱמֹר, and כֹּה אָמַר, with the updated theological decision for יְהוָה
  rationale: Ordinary English clarifies the messenger formula, while “Yahweh” follows the stated doctrine.
- pob_phrase: Though I removed them far off among the nations, and though I scattered them among the lands, yet
  simplified_phrase: I sent them far away among the nations and scattered them through the lands. Even so
  preserved_meaning: God caused their exile, but their dispersion did not end his sanctuary-presence with them.
  reasoning_layer_used: Lexical decision for the concessive כִּי ... וְכִי structure and the exile verbs
  rationale: Two sentences make God's agency and the contrast easier to follow without overstating the number of lands.
- pob_phrase: yet I became for them a little sanctuary in the lands where they had gone
  simplified_phrase: Even so, in the lands where they had gone, I became a small sanctuary for them
  preserved_meaning: God himself became a limited but genuine sanctuary for the exiles in their places of exile.
  reasoning_layer_used: Lexical and theological decisions for לְמִקְדָּשׁ מְעַט and the audited temporal sequence
  rationale: Reordering the location improves clarity while preserving the sanctuary image and the chosen qualitative sense.
translation_notes:
  risk_flags:
  - risk: “Small sanctuary” may sound like a physical building.
    mitigation: “I became” identifies God himself as the sanctuary, and the note preserves the temporal alternative.
  - risk: Readers unfamiliar with “Yahweh” may not recognize it as God's covenant name.
    mitigation: Keeping “Lord” before “Yahweh” preserves the full title and supplies immediate context.
