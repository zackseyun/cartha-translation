translation:
  language: en
  text: Then you will know that I am Yahweh. You have not lived by my laws or obeyed my requirements. Instead, you have followed the customs[a] of the nations around you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “requirements.” Here the Hebrew word can refer either to rules or to the practices followed by those nations.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in whose statutes you have not walked
  simplified_phrase: You have not lived by my laws
  preserved_meaning: Israel did not order its life according to Yahweh’s covenant statutes.
  reasoning_layer_used: POB lexical decision for בְּחֻקַּי לֹא הֲלַכְתֶּם
  rationale: “Lived by” conveys the covenantal walk idiom without suggesting physical movement.
- pob_phrase: whose judgments you have not carried out
  simplified_phrase: or obeyed my requirements
  preserved_meaning: Israel failed to do what Yahweh’s legal requirements commanded.
  reasoning_layer_used: POB lexical decision for וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  rationale: “Obeyed my requirements” clearly expresses both the legal sense and the required action.
- pob_phrase: but you have acted according to the judgments of the nations that are around you
  simplified_phrase: Instead, you have followed the customs of the nations around you
  preserved_meaning: Israel rejected Yahweh’s requirements and adopted the practices of neighboring peoples.
  reasoning_layer_used: POB lexical decisions for וּכְמִשְׁפְּטֵי הַגּוֹיִם and הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  rationale: “Customs” gives the natural contextual sense, while the footnote preserves the legal alternative.
translation_notes:
  risk_flags:
  - risk: Using “customs” makes the repeated Hebrew word less visible in English.
    mitigation: The footnote preserves “requirements” as an alternative and explains the word’s range.
  - risk: Replacing “walk” with “lived by” removes the visible Hebrew metaphor.
    mitigation: “Lived by” retains its covenantal sense of directing one’s way of life.
