translation:
  language: en
  text: 'So say, “This is what the Lord Yahweh[b] says: I will gather you from the peoples[a] and bring you together from the lands where you have been scattered. I will give you the land of Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “nations.”
    reason: lexical_alternative
  - marker: b
    text: Or “the Lord GOD.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore say
  simplified_phrase: So say
  preserved_meaning: The prophet must announce the consequence of the preceding message.
  reasoning_layer_used: POB lexical decisions for לָכֵן and אֱמֹר
  rationale: “So” gives the same logical connection in common English.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The words that follow are God’s authoritative message, and Yahweh identifies the covenant name.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה אָמַר and אֲדֹנָי יְהוִה
  rationale: The formula is recast naturally while following the audited Yahweh policy.
- pob_phrase: assemble you from the lands
  simplified_phrase: bring you together from the lands
  preserved_meaning: God promises to reunite his scattered people from their places of exile.
  reasoning_layer_used: POB lexical decision for וְאָסַפְתִּי
  rationale: “Bring you together” is clearer and retains the second gathering expression.
translation_notes:
  risk_flags:
  - risk: “Peoples” may be less familiar than “nations.”
    mitigation: Footnote a preserves the documented lexical alternative.
  - risk: Some readers may expect the conventional title “Lord GOD.”
    mitigation: Footnote b preserves that documented alternative.
