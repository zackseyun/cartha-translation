translation:
  language: en
  text: I will give them one heart[a] and put a new spirit inside them.[b] I will remove the heart of stone from their flesh and give them a heart of flesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “One heart” may also mean “an undivided heart,” pointing to united loyalty.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form can be read “inside you,” but “inside them” fits the surrounding pronouns and Ezekiel 36:26.
    reason: textual_variant
simplification_decisions:
- pob_phrase: I will put a new spirit within them
  simplified_phrase: put a new spirit inside them
  preserved_meaning: God places a renewed spirit in their inner being.
  reasoning_layer_used: Lexical decision for רוּחַ חֲדָשָׁה and contextual decision for בְּקִרְבְּכֶם.
  rationale: “Inside” is more common than “within” while retaining the inner-renewal sense.
- pob_phrase: And I will give them one heart, and I will put
  simplified_phrase: I will give them one heart and put
  preserved_meaning: God promises both one heart and a new spirit without merging them.
  reasoning_layer_used: Theological decision to retain heart and spirit as distinct but related terms.
  rationale: Removing the repeated clause opening makes the sentence flow naturally without combining the two gifts.
translation_notes:
  risk_flags:
