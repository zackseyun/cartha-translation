  preserved_meaning: Pelatiah died during Ezekiel’s act of prophesying.
  reasoning_layer_used: Lexical decision for כְּהִנָּבְאִי and Hebrew narrative sequence
  rationale: The shorter temporal clause gives the same sequence in natural English.
- pob_phrase: fell on my face and cried out with a loud voice
  simplified_phrase: fell facedown and cried out loudly
  preserved_meaning: Ezekiel prostrated himself and gave an intense cry of distress.
  reasoning_layer_used: Lexical decisions for וָאֶפֹּל עַל־פָּנַי and וָאֶזְעַק קוֹל גָּדוֹל
  rationale: Natural English preserves both the physical gesture and the force of his cry.
