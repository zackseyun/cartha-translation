translation:
  language: en
  text: While I was prophesying, Pelatiah son of Benaiah died. Then I fell facedown and cried out loudly, “Oh, Lord Yahweh! Will you completely destroy the remnant of Israel?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Are you completely destroying the remnant of Israel?” The Hebrew may refer to what God is doing now or is about to do.
