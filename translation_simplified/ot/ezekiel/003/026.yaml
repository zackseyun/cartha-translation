translation:
  language: en
  text: I will make your tongue stick to the roof of your mouth. You will be unable to speak and will not serve as a man who rebukes them, because they are a rebellious house.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rebellious house” describes the people together as one household in rebellion against God.
    reason: cultural_note
simplification_decisions:
- pob_phrase: make your tongue cling to the roof of your mouth
  simplified_phrase: make your tongue stick to the roof of your mouth
  preserved_meaning: God causes Ezekiel’s tongue to adhere inside his mouth.
  reasoning_layer_used: Lexical decision for אַדְבִּיק and theological decision on imposed muteness.
  rationale: “Stick” is more familiar than “cling” while preserving the physical image and divine cause.
- pob_phrase: you will be mute
  simplified_phrase: you will be unable to speak
  preserved_meaning: Ezekiel will be divinely prevented from speaking.
  reasoning_layer_used: Lexical decision for נֶאֱלַמְתָּ and theological decision on Ezekiel’s inability to speak.
  rationale: This states the result in common English without making the silence merely metaphorical.
- pob_phrase: will not be for them a man who rebukes
  simplified_phrase: will not serve as a man who rebukes them
  preserved_meaning: Ezekiel will not function among them as a male prophet who confronts and corrects them.
  reasoning_layer_used: Lexical decisions for לֹא תִהְיֶה לָהֶם, לְאִישׁ, and מוֹכִיחַ.
  rationale: “Serve as a man” preserves the indefinite masculine role without the awkward Hebrew relational structure.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “house” to mean a building rather than the people as a corporate household.
    mitigation: The footnote explains Ezekiel’s expression while preserving “house” in the text.
