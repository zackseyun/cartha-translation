translation:
  language: en
  text: But the people of Israel will be unwilling to listen to you, because they are unwilling to listen to me. For all the people of Israel are shamelessly defiant[a] and stubborn at heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “hard of forehead,” a picture of people who are defiant and refuse to yield.
    reason: simplification_note
