  simplified_phrase: the people of Israel
  preserved_meaning: Israel is described collectively as a covenant people.
  reasoning_layer_used: POB lexical and theological decisions on the house of Israel
  rationale: “The people of Israel” makes the corporate reference clear while “all” preserves the comprehensive indictment.
- pob_phrase: will not be willing to listen
  simplified_phrase: will be unwilling to listen
  preserved_meaning: Their failure to listen is deliberate rather than an inability to hear.
  reasoning_layer_used: POB lexical decisions on אָבָה and שׁמע
  rationale: The shorter wording retains both willingness and listening.
- pob_phrase: hard of forehead and stubborn of heart
  simplified_phrase: shamelessly defiant and stubborn at heart
  preserved_meaning: The paired expressions portray open defiance and inward stubbornness.
  reasoning_layer_used: POB lexical decisions on חִזְקֵי מֵצַח and קְשֵׁי לֵב
  rationale: The main text states the idiom’s meaning clearly, while the footnote preserves its physical image.
