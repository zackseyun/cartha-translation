translation:
  language: en
  text: I have made your forehead as hard as diamond,[a] harder than flint. Do not be afraid of them. Do not be dismayed when you face them, because they are a rebellious house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as hard as adamant.” The Hebrew refers to an extremely hard stone or substance.
    reason: lexical_alternative
  - marker: b
    text: Here “house” means the people of Israel as a group.
    reason: simplification_note
