  preserved_meaning: Ezekiel must neither fear the people nor be broken down in their presence.
  reasoning_layer_used: POB lexical rationale for תירא, תחת, and מפניהם
  rationale: Two direct sentences preserve the distinct commands and clarify what “before them” means.
