translation:
  language: en
  text: But if you warn a righteous man not to sin, and he does not sin, he will certainly live because he took the warning seriously.[a] You will also have saved your own life from being held accountable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may emphasize either receiving the warning or responding to it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he will surely live
  simplified_phrase: he will certainly live
  preserved_meaning: The emphatic promise that he will live remains intact.
  reasoning_layer_used: Lexical decision for חָיוֹ יִחְיֶה.
  rationale: “Certainly” expresses the Hebrew emphasis in familiar modern English.
- pob_phrase: he took warning
  simplified_phrase: he took the warning seriously
  preserved_meaning: He received the warning with a response that kept him from sinning.
  reasoning_layer_used: Lexical decision and footnote for נִזְהָר.
  rationale: The added phrase makes the responsive sense clear without hiding the Hebrew ambiguity.
- pob_phrase: you will have delivered your life
  simplified_phrase: You will also have saved your own life from being held accountable
  preserved_meaning: The prophet preserves his life by fulfilling his duty to warn.
  reasoning_layer_used: Lexical decision for נַפְשְׁךָ and theological watchman-context decision.
  rationale: This wording prevents readers from mistaking the phrase for salvation earned by merit.
interpretive_expansions:
- pob_phrase: delivered your life
  rendering: saved your own life from being held accountable
  claim: The prophet escapes liability before God by faithfully giving the warning.
  evidence:
