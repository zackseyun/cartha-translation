translation:
  language: en
  text: Go to the exiles, the sons of your people.[a] Speak to them and tell them, “This is what the Lord Yahweh says,” whether they listen or refuse to listen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of your people” is a Hebrew kinship expression for the people who belong to Ezekiel’s own nation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally contrasts hearing with ceasing or refraining, here meaning refusing to listen.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And go, come to the exiles
  simplified_phrase: Go to the exiles
  preserved_meaning: Ezekiel is commanded to move toward the deported community.
  reasoning_layer_used: Lexical decisions for וְלֵךְ, בֹּא, and הַגּוֹלָה
  rationale: One natural movement command avoids the awkward sequence “go, come” without adding urgency or time.
- pob_phrase: and speak to them and say to them
  simplified_phrase: Speak to them and tell them
  preserved_meaning: Both speech commands remain distinct in Ezekiel’s commission.
  reasoning_layer_used: Lexical decisions for וְדִבַּרְתָּ and וְאָמַרְתָּ
  rationale: Two common English verbs preserve the Hebrew repetition naturally.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The prophetic formula identifies the title-bearing covenant God as the message’s source.
  reasoning_layer_used: Theological decision for אֲדֹנָי יְהוִה and lexical decision for כֹּה אָמַר
  rationale: The wording makes the formula clear and follows the updated policy of naming Yahweh.
interpretive_expansions:
- pob_phrase: whether they hear or whether they refuse
  rendering: whether they listen or refuse to listen
  claim: Hearing means heeding the prophetic message, while the contrasting response is refusing to heed it.
  evidence:
  - The lexical rationale identifies this as a contrast between hearing and refusing to heed.
  confidence: high
  alternatives_preserved:
  - whether they hear or whether they refuse
  - whether they hear or whether they forbear
translation_notes:
  risk_flags:
  - risk: Compressing “go, come” to “go” removes the visible two-verb movement sequence.
    mitigation: The destination phrase still clearly preserves the commanded movement toward the exiles.
  - risk: “Sons of your people” may sound male-only to modern readers.
    mitigation: The footnote explains its representative kinship sense.
