translation:
  language: en
  text: He said to me, “Son of man,[a] eat this scroll I am giving you, and fill your belly and your insides with it.” So I ate it, and in my mouth it tasted as sweet as honey.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “human one” or “mortal.” “Son of man” is Ezekiel’s repeated form of address.
    reason: lexical_alternative
