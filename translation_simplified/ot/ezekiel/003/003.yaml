- pob_phrase: feed your belly and fill your inward parts with this scroll
  simplified_phrase: eat this scroll ... and fill your belly and your insides with it
  preserved_meaning: Ezekiel is commanded both to consume the scroll and to fill his inner body with it.
  reasoning_layer_used: Lexical decisions for תַאֲכֵל, בִּטְנְךָ, וּמֵעֶיךָ, and תְמַלֵּא
  rationale: The wording keeps Ezekiel as the subject of both commands while replacing “inward parts” with common English.
- pob_phrase: it was in my mouth as sweet as honey
  simplified_phrase: in my mouth it tasted as sweet as honey
  preserved_meaning: The eaten scroll had honey-like sweetness in Ezekiel’s mouth.
  reasoning_layer_used: Lexical decisions for וַתְּהִי בְּפִי and כִּדְבַשׁ לְמָתוֹק
  rationale: “Tasted” clearly expresses the sensory experience already located in Ezekiel’s mouth.
