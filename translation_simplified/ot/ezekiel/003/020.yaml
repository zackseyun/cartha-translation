translation:
  language: en
  text: When a righteous man turns away from living rightly and commits injustice, and I put a stumbling block in front of him, he will die. Because you did not warn him, he will die in his sin. His righteous deeds will not be remembered, and I will hold you accountable for his blood.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: turns from his righteousness
  simplified_phrase: turns away from living rightly
  preserved_meaning: He abandons his previous righteous conduct, not merely a legal status.
  reasoning_layer_used: POB lexical decision for מִצִּדְקוֹ
  rationale: The verbal wording makes righteous conduct clear to a modern reader.
- pob_phrase: does injustice
  simplified_phrase: commits injustice
  preserved_meaning: He actively does serious moral wrong or injustice.
  reasoning_layer_used: POB lexical decision for וְעָשָׂה עָוֶל
  rationale: This is more natural English while retaining the term's moral and judicial weight.
- pob_phrase: I place a stumbling block before him
  simplified_phrase: I put a stumbling block in front of him
  preserved_meaning: God explicitly places what the text pictures as an occasion for stumbling.
  reasoning_layer_used: POB lexical and theological decisions for מִכְשׁוֹל
  rationale: Common wording preserves both the concrete metaphor and the tension of divine agency.
