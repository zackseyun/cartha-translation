translation:
  language: en
  text: When I tell the wicked man, “You will certainly die,” and you do not warn him or speak to warn him to turn from his wicked way so that he may live, that wicked man will die in his guilt. But I will hold you accountable for his death.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says, “I will require his blood from your hand,” a judicial image meaning that God will hold the watchman accountable for the man’s death.
    reason: simplification_note
