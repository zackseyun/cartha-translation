translation:
  language: en
  text: But if you warn a wicked man and he does not turn away from his wickedness or his wicked way of life, he will die while still bearing his guilt. But you will have saved your own life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: does not turn from
  simplified_phrase: does not turn away from
  preserved_meaning: The moral image of turning away from evil remains intact.
  reasoning_layer_used: lexical decision for שָׁב
  rationale: Adding “away” makes the direction of the turn clear in natural English.
- pob_phrase: his wicked way
  simplified_phrase: his wicked way of life
  preserved_meaning: The wicked “way” remains a metaphor for the man’s conduct.
  reasoning_layer_used: lexical decision for דֶּרֶךְ
  rationale: “Way of life” makes the conduct metaphor immediately understandable.
- pob_phrase: you will have delivered your life
  simplified_phrase: you will have saved your own life
  preserved_meaning: Ezekiel is delivered from personal accountability without implying salvation of an immaterial soul.
  reasoning_layer_used: lexical and theological decisions for נַפְשְׁךָ
  rationale: “Saved your own life” expresses the Hebrew idiom in ordinary modern English.
interpretive_expansions:
- pob_phrase: he will die in his iniquity
  rendering: he will die while still bearing his guilt
  claim: The man dies remaining in the culpable condition created by his wrongdoing.
  evidence:
  - The lexical rationale permits guilt as the culpable condition expressed by עָוֹן.
  - The theological decision requires leaving the scope of the death unspecified.
  confidence: high
  alternatives_preserved:
  - die in his iniquity
  - die in his guilt
translation_notes:
  risk_flags:
  - risk: “Saved your own life” could be mistaken for a claim about eternal salvation.
    mitigation: The wording retains “life,” and the verse makes no claim about eternal destiny.
