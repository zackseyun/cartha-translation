translation:
  language: en
  text: Then the Spirit lifted me up and took me away.[a] I went away bitter, with my spirit burning within me,[b] while Yahweh’s hand was strong upon me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a spirit lifted me up”; the Hebrew word can also mean “wind.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew may describe his spirit as burning with rage, wrath, or another intense inner turmoil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And the Spirit lifted me up and took me away
  simplified_phrase: Then the Spirit lifted me up and took me away
  preserved_meaning: The divine Spirit lifts Ezekiel and forcefully moves him from that place.
  reasoning_layer_used: Lexical and theological decisions on רוּחַ, נשׂא, and לקח
  rationale: “Then” makes the narrative sequence natural without weakening the concrete movement.
- pob_phrase: I went in bitterness
  simplified_phrase: I went away bitter
  preserved_meaning: Ezekiel departs while experiencing bitterness.
  reasoning_layer_used: Lexical decision on מַר and immediate narrative context
  rationale: The adjective “bitter” states his emotional condition in ordinary English.
- pob_phrase: in the heat of my spirit
  simplified_phrase: with my spirit burning within me
  preserved_meaning: Ezekiel’s inner spirit is intensely agitated without specifying one emotion.
  reasoning_layer_used: Lexical decisions on חֵמָה and רוּחִי
  rationale: The burning image makes the Hebrew heat metaphor understandable while preserving its emotional range.
interpretive_expansions:
- pob_phrase: in the heat of my spirit
  rendering: with my spirit burning within me
  claim: The heat describes intense agitation within Ezekiel rather than literal bodily heat.
  evidence:
  - The POB lexical rationale identifies intense inner agitation.
  - The phrase directly modifies “my spirit.”
  confidence: high
  alternatives_preserved:
  - rage
  - wrath
  - inner turmoil
translation_notes:
  risk_flags:
  - risk: Readers may assume that “burning” refers only to anger.
    mitigation: Footnote b preserves rage, wrath, and broader inner turmoil as possibilities.
  - risk: Readers may confuse the divine Spirit with Ezekiel’s own spirit.
    mitigation: Capitalization and the phrase “my spirit” keep the two referents distinct.
