simplification_decisions:
- pob_phrase: And there the hand of Yahweh was upon me
  simplified_phrase: There, Yahweh’s hand was on me.
  preserved_meaning: Yahweh’s compelling presence or power rested on the prophet.
  reasoning_layer_used: POB lexical decisions for וַתְּהִי עָלַי and יַד יְהוָה
  rationale: The possessive form and “on me” are more natural while preserving the concrete hand image.
- pob_phrase: Rise, go out to the valley
  simplified_phrase: Get up and go out to the valley
  preserved_meaning: The prophet is commanded both to stand and to go outside to the valley.
  reasoning_layer_used: POB lexical decisions for קוּם, צֵא, and הַבִּקְעָה
  rationale: “Get up” is immediate modern English, while “go out” keeps the outward movement.
- pob_phrase: and there I will speak with you
  simplified_phrase: There I will speak with you.
  preserved_meaning: Yahweh promises to address Ezekiel at that location, with the Hebrew allowing “with” or “to.”
  reasoning_layer_used: POB lexical decisions for שָׁם and אֲדַבֵּר אוֹתָךְ
  rationale: A separate sentence makes the repeated location and promise easier to follow.
