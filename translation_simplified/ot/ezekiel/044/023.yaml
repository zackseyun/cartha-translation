translation:
  language: en
  text: They must teach my people the difference between what is holy and what is common,[a] and show them how to tell what is unclean from what is clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “profane.” Here “common” means not set apart as holy, not necessarily sinful.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the holy and the common
  simplified_phrase: what is holy and what is common
  preserved_meaning: The priests must distinguish what is set apart as holy from what has ordinary, non-holy status.
  reasoning_layer_used: POB lexical and theological decisions for קֹדֶשׁ and חֹל
  rationale: The added “what is” makes the categories easier to understand without giving “common” a moral meaning.
- pob_phrase: make them know the difference
  simplified_phrase: show them how to tell
  preserved_meaning: The priests must enable the people to recognize the distinction.
  reasoning_layer_used: POB lexical decision for the causative יוֹדִעֻם and its documented alternative “cause them to discern”
  rationale: This natural phrase preserves the verb’s causative force and the people’s need to discern.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “common” as inferior or sinful.
    mitigation: The footnote defines it as ordinary rather than holy and preserves “profane” as an alternative.
  - risk: “Clean” and “unclean” may be mistaken for physical hygiene.
    mitigation: Their pairing with “holy” and “common” keeps the verse within its priestly status categories.
