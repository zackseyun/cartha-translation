translation:
  language: en
  text: Yahweh said to me, “This gate must remain shut. It must not be opened, and no man[a] may enter through it. Yahweh, the God of Israel, has entered through it, so it must remain shut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “no man” means no person; the Hebrew uses a masculine singular word with a generic meaning.
    reason: lexical_alternative
simplification_decisions:
