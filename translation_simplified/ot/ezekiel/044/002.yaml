  reasoning_layer_used: Lexical decisions for סָגוּר יִהְיֶה and לֹא יִפָּתֵחַ
  rationale: Two short sentences make the continuing closure and passive prohibition easier to follow.
- pob_phrase: and no one shall enter through it
  simplified_phrase: and no man may enter through it
  preserved_meaning: No person is permitted to pass through the gate.
  reasoning_layer_used: Theological decision for generic masculine אִישׁ
  rationale: The main text retains the source-driven masculine form while the footnote explains its generic force.
- pob_phrase: Therefore it shall remain shut
