translation:
  language: en
  text: When the priests leave the priestly area and enter the outer court where the people are, they must take off the clothes they wore while serving and leave them in the holy rooms. They must put on other clothes so that their sacred garments do not make the people holy through contact.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to passing on ritual holiness, not making the people morally holy.
    reason: simplification_note
simplification_decisions:
- pob_phrase: to the outer court, to the outer court where the people are
  simplified_phrase: leave the priestly area and enter the outer court where the people are
  preserved_meaning: The priests move from their restricted ministry area into the court accessible to the people.
  reasoning_layer_used: lexical decision and cultural note on the repeated movement phrase
  rationale: The rewrite makes the spatial movement clear without repeating an awkward phrase.
- pob_phrase: their garments in which they minister
  simplified_phrase: the clothes they wore while serving
  preserved_meaning: These are the priests’ special clothes used during temple service.
  reasoning_layer_used: lexical decisions for garments and ministering
  rationale: Common wording replaces an opaque relative clause while keeping the priestly function.
- pob_phrase: leave them in the holy chambers
  simplified_phrase: leave them in the holy rooms
  preserved_meaning: The sacred clothing remains in designated consecrated temple rooms.
  reasoning_layer_used: lexical decision for לִשְׁכֹת הַקֹּדֶשׁ
  rationale: “Rooms” is more familiar than “chambers” and retains their holy status.
interpretive_expansions:
- pob_phrase: to the outer court, to the outer court where the people are
  rendering: leave the priestly area and enter the outer court where the people are
  claim: The movement begins in a priestly area distinct from the public outer court.
  evidence:
  - The repeated Hebrew phrase emphasizes movement into the area accessible to the people.
  - The POB rationale distinguishes priestly and public space.
  confidence: high
  alternatives_preserved:
  - The Hebrew can be rendered with the repeated phrase “to the outer court.”
- pob_phrase: make the people holy with their garments
  rendering: make the people holy through contact
  claim: The sacred garments could transmit ritual holiness to the people through contact.
  evidence:
  - The POB theological decision identifies the clause as the transfer of consecrated holiness.
  - The instrumental phrase “with their garments” presents the clothing as the means.
  confidence: high
  alternatives_preserved:
  - The clause may be rendered “sanctify the people” or “consecrate the people.”
