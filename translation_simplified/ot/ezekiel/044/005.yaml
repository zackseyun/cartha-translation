translation:
  language: en
  text: Yahweh said to me, “Son of man, pay close attention. Look carefully with your eyes, and listen with your ears to everything I am telling you about all the rules for Yahweh’s house and all its instructions. Pay close attention to the entrance of the temple and to every exit of the sanctuary.”
