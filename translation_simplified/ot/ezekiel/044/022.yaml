translation:
  language: en
  text: They must not marry a widow or a divorced woman. They may marry only a virgin descended from the house of Israel, or a widow whose husband was a priest.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: take for themselves as wives
  simplified_phrase: marry
  preserved_meaning: The phrase still refers to entering a marriage, not merely taking a woman into the household.
  reasoning_layer_used: POB lexical decision for יִקְחוּ ... לְנָשִׁים
  rationale: The common verb “marry” makes the Hebrew legal idiom immediately clear.
- pob_phrase: virgins from the offspring of the house of Israel
  simplified_phrase: a virgin descended from the house of Israel
  preserved_meaning: The woman must be a virgin and belong to Israel by descent.
  reasoning_layer_used: POB lexical decisions for בְּתוּלוֹת and מִזֶּרַע בֵּית יִשְׂרָאֵל
  rationale: “Descended from” expresses the ancestry requirement more naturally than “from the offspring of.”
- pob_phrase: a widow who is the widow of a priest
  simplified_phrase: a widow whose husband was a priest
  preserved_meaning: The exception applies to a widow whose deceased husband belonged to the priesthood.
  reasoning_layer_used: POB lexical decision for וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  rationale: The revised clause states the relationship directly and avoids repeating “widow.”
