- pob_phrase: come near to me to serve as priests for me
  simplified_phrase: come near me to serve as my priests
  preserved_meaning: They are forbidden to approach God in the official role of priests.
  reasoning_layer_used: POB lexical decisions for יִגְּשׁוּ אֵלַי and לְכַהֵן לִי
  rationale: The shorter wording preserves both sacred approach and priestly service.
- pob_phrase: nor to come near any of my holy things, the most holy things
  simplified_phrase: They must not approach any of my holy things, including the most holy things
  preserved_meaning: They are denied access to sacred things, especially those classed as most holy.
  reasoning_layer_used: POB lexical and theological decisions for קָדָשַׁי and קָדְשֵׁי הַקְּדָשִׁים
  rationale: A separate sentence and “including” clarify the favored object reading while the footnote preserves the spatial alternative.
- pob_phrase: but they shall bear their shame and the abominations that they have done
  simplified_phrase: Instead, they will bear their shame and the abominations they have done
  preserved_meaning: They remain responsible for the shame and abominations arising from their past actions.
  reasoning_layer_used: POB lexical decisions for וְנָשְׂאוּ, כְּלִמָּתָם, וְתוֹעֲבוֹתָם, and אֲשֶׁר עָשׂוּ
  rationale: The sentence keeps the direct pairing of shame and abominations without adding a specific consequence nuance.
