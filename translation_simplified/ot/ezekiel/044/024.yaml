translation:
  language: en
  text: When there is a dispute, they shall take their place as judges and decide the case according to my judgments. They shall follow my laws and my statutes at all the times I appoint.[a] They shall keep my Sabbaths holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The times I appoint” may also mean “my appointed festivals” or “my set times.”
    reason: lexical_alternative
