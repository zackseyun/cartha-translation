translation:
  language: en
  text: You did not fulfill your responsibility for my holy things. Instead, you appointed others to carry out my sanctuary duties for you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in your place,” emphasizing that others performed these duties instead of you.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have not kept charge of my holy things
  simplified_phrase: did not fulfill your responsibility for my holy things
  preserved_meaning: They failed to perform their entrusted duties concerning all that belonged to God’s holy service.
  reasoning_layer_used: Lexical decisions for שׁמר, מִשְׁמֶרֶת, and קָדָשַׁי; theological decision on scope
  rationale: “Fulfill your responsibility” states the temple-duty idiom clearly while keeping “holy things” broad.
- pob_phrase: appointed others to keep charge in my sanctuary
  simplified_phrase: appointed others to carry out my sanctuary duties
  preserved_meaning: They assigned other people to perform the responsibilities God entrusted within his sanctuary.
  reasoning_layer_used: Lexical decisions for וַתְּשִׂימוּן, לְשֹׁמְרֵי, מִשְׁמַרְתִּי, and בְּמִקְדָּשִׁי
  rationale: “Carry out my sanctuary duties” removes awkward repetition without reducing the work to physical guarding.
translation_notes:
  risk_flags:
  - risk: “Holy things” may sound limited to sacred objects.
    mitigation: The phrase is retained because the POB intentionally preserves its broad reference to sacred matters, rites, and responsibilities.
  - risk: “For you” can mean either on their behalf or in their place.
    mitigation: The main text keeps the POB wording, and the footnote preserves the stronger substitutional nuance.
