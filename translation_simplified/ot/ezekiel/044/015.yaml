translation:
  language: en
  text: But the Levitical priests—the sons of Zadok[a]—faithfully carried out their duties at my sanctuary when the sons of Israel[b] went astray from me. They are the ones who will come near to me and serve me as priests. They will stand before me and offer me the fat and blood from the sacrifices, declares the Lord Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “sons of Zadok” means the male descendants of Zadok.
    reason: simplification_note
  - marker: b
    text: “Sons of Israel” refers to the people of Israel as a whole.
    reason: simplification_note
