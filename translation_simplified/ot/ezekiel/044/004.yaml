translation:
  language: en
  text: Then he brought me by way of the north gate to the front of the house.[a] I looked, and there before me, the glory of Yahweh filled Yahweh’s house. I fell facedown.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple. The Hebrew repeatedly calls it Yahweh’s house.
    reason: simplification_note
simplification_decisions:
- pob_phrase: by way of the north gate
  simplified_phrase: by way of the north gate
  preserved_meaning: The north gate marked the route, without requiring that Ezekiel passed through it.
  reasoning_layer_used: POB lexical decision and documented alternative for דֶּרֶךְ שַׁעַר הַצָּפוֹן
  rationale: Retaining the broader route expression preserves the documented ambiguity.
- pob_phrase: and I looked, and behold
  simplified_phrase: I looked, and there before me
  preserved_meaning: Ezekiel suddenly notices the solemn sight before him.
  reasoning_layer_used: POB lexical decisions for וָאֵרֶא and וְהִנֵּה
  rationale: This keeps the attention-drawing force without the unfamiliar word “behold.”
- pob_phrase: and I fell on my face
  simplified_phrase: I fell facedown
  preserved_meaning: Ezekiel physically prostrated himself in reverence.
  reasoning_layer_used: POB lexical decision for וָאֶפֹּל אֶל פָּנַי
  rationale: “Facedown” preserves the physical image in natural modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “house” to mean an ordinary home.
    mitigation: The footnote identifies the house as the temple while preserving Ezekiel’s repeated wording.
