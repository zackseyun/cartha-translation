translation:
  language: en
  text: You brought foreigners into my sanctuary and let them remain there, though they were uncircumcised in heart[b] and uncircumcised in flesh. By bringing them in, you profaned my sanctuary—my house—when you presented my food, the sacrificial fat and blood. They[a] broke my covenant, along with all your detestable acts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “they,” most likely referring to the foreigners; some understand the accusation as continuing against “you.”
    reason: alternative_reading
  - marker: b
    text: “Uncircumcised in heart” is a prophetic image for inward rebellion and spiritual uncleanness.
    reason: simplification_note
simplification_decisions:
- pob_phrase: to be in my sanctuary
  simplified_phrase: let them remain there
  preserved_meaning: The foreigners were permitted to be present within the sanctuary, not merely to enter it.
  reasoning_layer_used: Lexical decision on לִהְיוֹת בְּמִקְדָּשִׁי
  rationale: This recasts the infinitive in natural English while preserving continued presence.
- pob_phrase: to profane it—my house
  simplified_phrase: By bringing them in, you profaned my sanctuary—my house
  preserved_meaning: Bringing in the foreigners desecrated the sanctuary, restated as God's house.
  reasoning_layer_used: Theological decision on the suffix and apposition
  rationale: The wording clarifies the connection while preserving both the sanctuary referent and house image.
- pob_phrase: all your abominations
  simplified_phrase: all your detestable acts
  preserved_meaning: This offense accompanies the people's wider abhorrent conduct.
  reasoning_layer_used: Lexical decision on אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  rationale: Common wording retains the accusation's strong moral force.
