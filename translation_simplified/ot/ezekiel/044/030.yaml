translation:
  language: en
  text: The first portion of every kind of first produce, and every contribution you set apart for sacred use, shall belong to the priests. You shall also give the priest the first portion of your dough, so that a blessing will rest on your household.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the first of all the firstfruits of everything
  simplified_phrase: the first portion of every kind of first produce
  preserved_meaning: The first or chief portion of every first yield is assigned to the priests.
  reasoning_layer_used: POB lexical decisions for רֵאשִׁית and בִּכּוּרֵי
  rationale: This keeps the layered first-portion emphasis while explaining the cultic term in common English.
- pob_phrase: every contribution from all your contributions
  simplified_phrase: every contribution you set apart for sacred use
  preserved_meaning: Every dedicated sacred contribution belongs to the priests.
  reasoning_layer_used: POB lexical decision and footnote for תְּרוּמָה
  rationale: This replaces the repetitive structure with the contribution's documented sacred function.
- pob_phrase: the first of your dough
  simplified_phrase: the first portion of your dough
  preserved_meaning: The first share of the prepared dough is to be given to the priest.
  reasoning_layer_used: POB lexical decisions for רֵאשִׁית and עֲרִסוֹתֵיכֶם
  rationale: Adding “portion” clarifies that only part of the dough is required.
interpretive_expansions:
- pob_phrase: contribution
  rendering: contribution you set apart for sacred use
  claim: The contribution is dedicated for sacred use rather than being an ordinary gift.
  evidence:
  - The POB lexical rationale defines תְּרוּמָה as a portion set apart for sacred use.
  - The temple-law context assigns the contribution to the priests.
  confidence: high
  alternatives_preserved:
  - sacred contribution
  - offering
- pob_phrase: your house
  rendering: your household
  claim: The blessing rests on the giver's household, not merely on the physical building.
  evidence:
  - POB footnote c explains “house” as “household.”
  - The POB lexical rationale recognizes “household” as the implied sense.
  confidence: high
  alternatives_preserved:
  - your house
