translation:
  language: en
  text: When a shepherd is among his sheep and they have been scattered, he searches for his flock.[a] In the same way, I will search for my sheep and rescue them from every place where they were scattered on a day of clouds and thick darkness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also include the idea of carefully watching over and caring for the flock.
    reason: lexical_alternative
