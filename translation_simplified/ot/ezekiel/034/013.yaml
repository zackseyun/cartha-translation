translation:
  language: en
  text: I will bring them out from among the peoples and gather them from the lands. I will bring them into their own land. There I will feed them like a shepherd on the mountains of Israel, beside the streams,[a] and wherever people live throughout the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “by the watercourses,” “in the ravines,” or “in the channels.”
    reason: lexical_alternative
