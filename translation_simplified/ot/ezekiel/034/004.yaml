translation:
  language: en
  text: You did not make the weak strong or heal the sick. You did not bandage the broken, bring back those who strayed,[a] or search for the lost. Instead, you ruled them by force and with harshness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who had been driven away”; the Hebrew can refer to being driven off as well as straying.
    reason: lexical_alternative
  - marker: b
    text: Or “with ruthlessness”; the Hebrew describes harsh, crushing severity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: strengthened the weak
  simplified_phrase: make the weak strong
  preserved_meaning: The leaders failed to act directly to strengthen the weak sheep.
  reasoning_layer_used: Lexical decision for חִזַּקְתֶּם and the shepherd metaphor
  rationale: The direct wording is clear and preserves the force of “strengthen.”
- pob_phrase: bound up the broken
  simplified_phrase: bandage the broken
  preserved_meaning: The leaders failed to tend the injured while the image of broken sheep remains visible.
  reasoning_layer_used: Lexical decisions for לַנִּשְׁבֶּרֶת and חֲבַשְׁתֶּם
  rationale: “Bandage” makes the act of care immediately understandable without replacing “broken.”
- pob_phrase: you have not brought back the strayed, and you have not sought the lost
  simplified_phrase: bring back those who strayed, or search for the lost
  preserved_meaning: The leaders neither returned straying sheep nor looked for missing ones.
  reasoning_layer_used: Lexical decisions for נדח, שוב, אבד, and בקש
  rationale: Natural coordination keeps the two failures distinct and avoids narrowing straying to a completed past condition.
translation_notes:
  risk_flags:
  - risk: “Strayed” may suggest voluntary wandering even though the Hebrew can also indicate being driven away.
    mitigation: Footnote [a] preserves that lexical ambiguity.
  - risk: “Bandage the broken” is less traditional than “bind up the broken.”
    mitigation: The wording clarifies the medical action while retaining the source image of brokenness.
