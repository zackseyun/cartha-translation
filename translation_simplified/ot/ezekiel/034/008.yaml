  preserved_meaning: The compound title identifies Yahweh by his revealed covenant name.
  reasoning_layer_used: POB theological decision on אֲדֹנָי יְהוִה
  rationale: The updated doctrinal rule requires “Yahweh” rather than the conventional substitute “GOD.”
- pob_phrase: my flock has become plunder ... my shepherds did not seek my flock, but the shepherds fed themselves
  simplified_phrase: my flock has been taken as plunder ... My shepherds did not seek out my flock. They fed themselves
  preserved_meaning: The flock was seized while its responsible leaders pursued their own interests and neglected it.
  reasoning_layer_used: POB lexical decisions on לָבַז, דָרְשׁוּ, and רעה
  rationale: Passive wording and shorter sentences clarify the action while preserving the plunder, seeking, and feeding images.
