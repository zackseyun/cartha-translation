  preserved_meaning: God solemnly guarantees his declaration by his own life.
  reasoning_layer_used: POB lexical decisions on חַי אָנִי and אִם לֹא
  rationale: The combined wording makes the prophetic oath natural without weakening its force.
- pob_phrase: declares the Lord GOD
