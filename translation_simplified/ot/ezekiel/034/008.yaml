translation:
  language: en
  text: “As surely as I live,” declares the Lord Yahweh, “my flock has been taken as plunder[a] and has become food for every wild animal because there was no shepherd. My shepherds did not seek out my flock. They fed themselves but did not feed my flock—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has become prey.”
    reason: lexical_alternative
