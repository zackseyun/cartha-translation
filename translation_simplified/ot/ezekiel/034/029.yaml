translation:
  language: en
  text: I will establish for them a planting that will be renowned.[a] They will never again be swept away by famine in the land,[b] and they will no longer endure disgrace from the nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “a planting for a name”; the image may point to a renowned source of provision, restored abundance, or another divinely established blessing.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew phrase literally speaks of people “gathered by famine” and may mean famine’s victims or those consumed by it.
    reason: lexical_alternative
