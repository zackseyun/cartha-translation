  reasoning_layer_used: POB lexical decision for הַצֶּמֶר and תִּלְבָּשׁוּ
  rationale: This recasts the reflexive expression in ordinary English while preserving the image of self-enrichment.
- pob_phrase: the fattened sheep
  simplified_phrase: the well-fed sheep
  preserved_meaning: The leaders slaughter the healthy, choice animals of the flock.
  reasoning_layer_used: POB lexical decision for הַבְּרִיאָה
  rationale: “Well-fed” clearly expresses the Hebrew sense without suggesting a special fattening process.
- pob_phrase: but you do not shepherd the flock
  simplified_phrase: but you do not shepherd the flock
  preserved_meaning: The leaders fail to provide the full care expected of shepherds.
  reasoning_layer_used: POB theological decision on the shepherd metaphor
  rationale: The wording is retained because the chapter’s central metaphor requires the broader idea of shepherding rather than feeding alone.
