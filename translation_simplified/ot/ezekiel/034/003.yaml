translation:
  language: en
  text: You eat the fat[a] and wear clothes made from the wool. You slaughter the well-fed sheep, but you do not shepherd the flock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the milk”; the Hebrew word normally means “fat,” though some translations follow another interpretation or an ancient version.
    reason: lexical_alternative
