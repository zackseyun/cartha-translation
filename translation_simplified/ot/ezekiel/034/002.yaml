translation:
  language: en
  text: '“Son of man, prophesy against Israel’s shepherds.[a] Prophesy and tell them, ‘This is what the Lord Yahweh says: Woe to Israel’s shepherds, who care for themselves rather than for the flock! Shouldn’t shepherds care for the flock?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The shepherds represent Israel’s leaders, and the flock represents the people entrusted to them.
    reason: cultural_note
simplification_decisions:
- pob_phrase: prophesy and say to them, to the shepherds
  simplified_phrase: Prophesy and tell them
  preserved_meaning: God repeats the command and directs the message to Israel’s shepherds.
  reasoning_layer_used: Lexical decision on הִנָּבֵא and immediate context
  rationale: This removes an awkward repetition of the audience while retaining the repeated command.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The message comes with the authority of Israel’s covenant God.
  reasoning_layer_used: Updated theological decision on אֲדֹנָי יְהוִה
  rationale: Natural English follows the doctrinal choice to render the divine name as Yahweh.
- pob_phrase: who have been shepherding themselves ... Should not the shepherds shepherd the flock?
  simplified_phrase: who care for themselves rather than for the flock! Shouldn’t shepherds care for the flock?
  preserved_meaning: The shepherds serve themselves instead of fulfilling their duty toward the flock.
  reasoning_layer_used: Lexical rationales for the reflexive shepherding verb and rhetorical question
  rationale: The contrast is explicit without making the unwarranted absolute claim that they care only for themselves.
interpretive_expansions:
- pob_phrase: the shepherds of Israel
  rendering: Israel’s shepherds, with a footnote identifying the human referents
  claim: The shepherds represent Israel’s leaders, and the flock represents the people under their care.
  evidence:
  - The POB theological decision identifies the shepherds as Israel’s leaders.
  - The verse develops the shepherd-and-flock metaphor.
  confidence: high
  alternatives_preserved:
  - The main text retains “shepherds” rather than replacing it with “leaders.”
- pob_phrase: who have been shepherding themselves
  rendering: who care for themselves rather than for the flock
  claim: Their self-serving care stands in contrast to their duty to care for the flock.
  evidence:
  - The POB lexical rationale identifies self-serving leadership.
  - The rhetorical question contrasts their conduct with care for the flock.
  confidence: high
  alternatives_preserved:
  - The lexical alternative “who feed themselves” remains compatible with the metaphor.
translation_notes:
  risk_flags:
  - risk: Using “care for” reduces the repeated Hebrew shepherding wordplay.
    mitigation: The terms “shepherds” and “flock” keep the controlling pastoral image clear.
  - risk: The footnote identifies the metaphor’s human referents.
    mitigation: It follows the POB theological rationale while preserving the metaphor in the main text.
