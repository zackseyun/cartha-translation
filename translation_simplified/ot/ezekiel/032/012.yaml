translation:
  language: en
  text: I will use the swords of mighty warriors to bring down your great multitude. These warriors are all ruthless men from the nations. They will plunder Egypt’s pride,[a] and all her multitude will be destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Egypt’s majesty”; the Hebrew can refer both to pride and to grandeur.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By the swords of mighty men I will make your multitude fall
  simplified_phrase: I will use the swords of mighty warriors to bring down your great multitude
  preserved_meaning: God will cause Egypt’s collective mass to fall through armed warriors.
  reasoning_layer_used: Lexical decisions for בְּחַרְבוֹת, גִּבּוֹרִים, אַפִּיל, and הֲמוֹנֶךָ.
  rationale: The active wording keeps the sword image and causative force without limiting the multitude to civilians.
- pob_phrase: all of them the ruthless ones of the nations
  simplified_phrase: These warriors are all ruthless men from the nations
  preserved_meaning: The mighty attackers are ruthless men drawn from the nations.
  reasoning_layer_used: Lexical decision for עָרִיצֵי גוֹיִם כֻּלָּם.
  rationale: A separate sentence makes the apposition clear without identifying them specifically as political tyrants.
- pob_phrase: all her multitude
  simplified_phrase: all her multitude
  preserved_meaning: Egypt’s massed forces or populace will be destroyed.
  reasoning_layer_used: Lexical decision for כָּל הֲמוֹנָהּ and the review’s military-populous range.
  rationale: Retaining “multitude” preserves the Hebrew repetition and its broad collective sense.
