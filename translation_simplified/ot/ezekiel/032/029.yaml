translation:
  language: en
  text: Edom is there, with its kings and all its rulers. They were laid among those killed by the sword, despite their power.[a] They lie with the uncircumcised[b] and with those who descend into the pit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be rendered “with their power” or “in their power”; the context suggests that their strength could not save them.
    reason: lexical_alternative
  - marker: b
    text: “The uncircumcised” carries the ideas of being outside the covenant and suffering disgrace in death.
    reason: cultural_note
  - marker: c
    text: “The pit” is a Hebrew image for the grave or the realm of the dead.
    reason: cultural_note
