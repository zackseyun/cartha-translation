translation:
  language: en
  text: They will fall among those killed by the sword.[a] The sword is given. Drag Egypt away, and all her people with her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is terse and may also mean, “A sword is appointed” for judgment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those slain by the sword
  simplified_phrase: those killed by the sword
  preserved_meaning: They belong among the people violently killed in judgment and war.
  reasoning_layer_used: POB lexical decision for חַלְלֵי חֶרֶב
  rationale: “Killed” is more immediately understandable than “slain” while retaining the sword image.
- pob_phrase: drag her away, and all her multitude
  simplified_phrase: Drag Egypt away, and all her people with her
  preserved_meaning: Egypt is forcibly taken away together with the mass of people belonging to her.
  reasoning_layer_used: POB lexical and theological decisions for אוֹתָהּ and הֲמוֹנֶיהָ
  rationale: Naming Egypt clarifies the pronoun, while “all her people” naturally expresses the national multitude.
- pob_phrase: The sword is given; drag
  simplified_phrase: The sword is given. Drag
  preserved_meaning: The abrupt announcement of the sword is kept distinct from the command to drag Egypt away.
  reasoning_layer_used: POB theological decision on חֶרֶב נִתָּנָה
  rationale: A sentence break makes the compressed oracle easier to read without resolving its ambiguity.
interpretive_expansions:
- pob_phrase: drag her away
  rendering: Drag Egypt away
  claim: The feminine pronoun refers to Egypt personified as a woman.
  evidence:
  - The surrounding context addresses Egypt and personifies the nation.
  - The POB theological decision identifies Egypt as the pronoun’s most natural referent.
  confidence: high
  alternatives_preserved:
  - The pronoun may be read more abstractly in the difficult Hebrew construction.
translation_notes:
