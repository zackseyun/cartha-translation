translation:
  language: en
  text: I will fill many peoples with horror because of what happens to you. Their kings will shudder at what happens to you when I swing my sword before them. On the day you fall, they will tremble from moment to moment, each man fearing for his own life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will make many peoples appalled at you
  simplified_phrase: I will fill many peoples with horror because of what happens to you
  preserved_meaning: God causes many peoples to react with intense horror to Egypt’s judgment.
  reasoning_layer_used: Lexical decision for וַהֲשִׁמּוֹתִי and theological decision on divine agency
  rationale: The active wording keeps God as the cause while expressing “appalled” in common English.
- pob_phrase: when I brandish my sword before them
  simplified_phrase: when I swing my sword before them
  preserved_meaning: God vividly displays his sword as an image of coming judgment.
  reasoning_layer_used: Lexical decision for בְּעוֹפְפִי חַרְבִּי
  rationale: “Swing” makes the martial action immediately clear without removing the sword image.
- pob_phrase: on the day of your downfall
  simplified_phrase: On the day you fall
  preserved_meaning: Egypt will suffer a catastrophic fall under judgment.
  reasoning_layer_used: Lexical decision for בְּיוֹם מַפַּלְתֶּךָ
  rationale: The verb form is simpler while retaining the force of Egypt’s downfall.
interpretive_expansions:
- pob_phrase: at you / over you
  rendering: because of what happens to you / at what happens to you
  claim: The peoples and kings are horrified by Egypt’s coming judgment and fall.
  evidence:
