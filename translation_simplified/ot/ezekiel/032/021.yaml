translation:
  language: en
  text: 'The mighty warrior-chiefs[a] will speak to him from within Sheol,[b] together with his allies: “They have gone down. They now lie still in death—the uncircumcised,[c] killed by the sword.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may also mean “the strong among the warriors.”
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew name for the realm of the dead; it does not simply mean “hell.”
    reason: cultural_note
  - marker: c
    text: Here “the uncircumcised” is a disgraceful description of the fallen people killed by the sword.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The mighty among the chiefs
  simplified_phrase: The mighty warrior-chiefs
  preserved_meaning: Elite human warriors in Sheol are speaking.
  reasoning_layer_used: lexical and theological decisions
  rationale: The compound avoids a double hierarchy while retaining the chosen human-warrior sense.
- pob_phrase: with his helpers
  simplified_phrase: together with his allies
  preserved_meaning: Those associated with him in death join in the speech.
  reasoning_layer_used: lexical decision for אֶת עֹזְרָיו
  rationale: “Allies” is natural here and is a documented POB alternative.
- pob_phrase: slain by the sword
  simplified_phrase: killed by the sword
  preserved_meaning: They died violently by the sword.
  reasoning_layer_used: lexical decision for חַלְלֵי חָרֶב
  rationale: “Killed” is common English and preserves the sword image.
interpretive_expansions:
- pob_phrase: they lie still
  rendering: They now lie still in death
  claim: Their stillness is the stillness of death, not sleep or rest.
  evidence:
