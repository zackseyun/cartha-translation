translation:
  language: en
  text: 'Son of man, sing a funeral song over Pharaoh, king of Egypt. Say to him:


    “You compared yourself to a young lion among the nations,[a]

    but you were like a great monster in the seas.[b]

    You surged through your rivers,

    stirred up the waters with your feet and made them muddy,

    and fouled their rivers.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You were compared to a young lion among the nations.” The Hebrew can be understood as passive rather than reflexive.
    reason: alternative_reading
  - marker: b
    text: The Hebrew refers to a great aquatic creature and may also be translated “dragon” or “sea monster.”
    reason: lexical_alternative
  - marker: c
    text: Or “trampled their rivers.” The text does not specify whose rivers are meant by “their.”
    reason: lexical_alternative
