translation:
  language: en
  text: I will cast you onto the land and throw you down in the open field. I will make every bird of the sky settle on you, and wild animals from all over the earth will eat you until they are full.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first words may also be translated, “I will abandon you on the land.”
