  reasoning_layer_used: POB lexical decisions for שָׁם and וְכָל הֲמוֹנָהּ
  rationale: The new order is natural English, and “people” makes the collective reference immediately clear.
- pob_phrase: all of them slain, fallen by the sword, who went down
  simplified_phrase: Every one of them was slain, fallen by the sword. They went down
  preserved_meaning: The whole group died violently by the sword and descended to the realm below.
  reasoning_layer_used: POB lexical decisions and source clause structure
  rationale: Two sentences remove the dense relative clause while retaining both the violent death and descent.
- pob_phrase: who spread their terror in the land of the living; and they bore their shame
  simplified_phrase: They had spread terror in the land of the living, and they bore their shame
  preserved_meaning: Their former terror among the living is set beside their disgrace among the dead.
  reasoning_layer_used: POB lexical decisions for נָתְנוּ חִתִּיתָם and וַיִּשְׂאוּ כְלִמָּתָם
  rationale: A direct clause and simple past sequence make the contrast easier to follow.
