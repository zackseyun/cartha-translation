translation:
  language: en
  text: Elam is there, with all her people around her grave. Every one of them was slain, fallen by the sword. They went down uncircumcised[a] to the land below.[b] They had spread terror in the land of the living, and they bore their shame with those who go down to the pit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “uncircumcised” is a shame-laden term for nations outside Israel’s covenant.
    reason: cultural_note
  - marker: b
    text: Or “to the lower earth” or “to the netherworld.” The Hebrew pictures the realm of the dead as “the land of lower places.”
    reason: lexical_alternative
