  text: They do not lie in death with the mighty, the fallen from among the uncircumcised, who went down to Sheol carrying their weapons of war.[a] Their swords were placed under their heads, and their iniquities were upon their bones.[b] For the terror of the mighty was in the land of the living.[c]
