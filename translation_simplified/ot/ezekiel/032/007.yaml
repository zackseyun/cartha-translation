translation:
  language: en
  text: When I extinguish you[a], I will cover the heavens and make their stars go dark. I will hide the sun behind a cloud, and the moon will give no light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “when you are extinguished.” It pictures Pharaoh and Egypt being put out like a light.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: darken their stars
  simplified_phrase: make their stars go dark
  preserved_meaning: God causes the stars of the heavens to become dark.
  reasoning_layer_used: Lexical decision for וְהִקְדַּרְתִּי and the cosmic-judgment context.
  rationale: The simpler verbal phrase keeps the same cosmic image.
- pob_phrase: cover the sun with a cloud
  simplified_phrase: hide the sun behind a cloud
  preserved_meaning: A cloud obscures the sun as part of God's judgment.
  reasoning_layer_used: Lexical decisions for בֶּעָנָן and אֲכַסֶּנּוּ.
  rationale: The new wording makes the visible effect of covering immediately clear.
- pob_phrase: the moon will not give its light
  simplified_phrase: the moon will give no light
  preserved_meaning: The moon ceases to provide light.
  reasoning_layer_used: Lexical decision for לֹא יָאִיר אוֹרוֹ.
  rationale: The shorter clause preserves the causative sense without biblical-style wordiness.
