translation:
  language: en
  text: Son of man, wail over Egypt’s great multitude. Bring Egypt and the peoples of mighty nations down to the land beneath, among those who descend to the pit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures these peoples as “daughters of mighty nations.”
    reason: cultural_note
  - marker: b
    text: “The land beneath” and “the pit” poetically describe the realm of the dead, without specifying hell.
    reason: simplification_note
simplification_decisions:
- pob_phrase: wail over the multitude of Egypt
  simplified_phrase: wail over Egypt’s great multitude
  preserved_meaning: The command calls for funeral-like mourning over Egypt’s populous mass.
  reasoning_layer_used: Lexical decisions for נְהֵה and הֲמוֹן מִצְרַיִם
  rationale: The simpler word order retains “over” and makes Egypt’s multitude immediately clear.
- pob_phrase: bring her down
  simplified_phrase: Bring Egypt ... down
  preserved_meaning: Egypt remains the nation commanded to descend under judgment.
  reasoning_layer_used: Lexical decisions for וְהוֹרִדֵהוּ and אוֹתָהּ
  rationale: Repeating Egypt removes an unclear pronoun without changing its referent.
- pob_phrase: her and the daughters of mighty nations
  simplified_phrase: Egypt and the peoples of mighty nations
  preserved_meaning: Egypt descends together with the peoples represented by the Hebrew daughter image.
  reasoning_layer_used: POB footnote b and lexical decision for וּבְנוֹת גּוֹיִם אַדִּרִם
  rationale: The main text identifies the referents plainly while the footnote retains the source image.
interpretive_expansions:
- pob_phrase: the daughters of mighty nations
  rendering: the peoples of mighty nations
  claim: The figurative daughters represent nations or peoples rather than literal women.
  evidence:
  - POB footnote b identifies the phrase as figurative for nations or peoples.
  - The lexical rationale allows dependent peoples or personified nations.
  confidence: moderate
  alternatives_preserved:
  - dependent peoples
  - personified nations
translation_notes:
  risk_flags:
  - risk: Replacing “daughters” in the main text weakens the Hebrew personification.
    mitigation: Footnote a preserves the image explicitly.
  - risk: Readers may equate the downward imagery specifically with hell.
    mitigation: Footnote b identifies the realm of the dead without imposing that later doctrinal term.
