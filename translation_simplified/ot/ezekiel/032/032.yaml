translation:
  language: en
  text: For I made people in the land of the living fear him,[a] and he will be laid among the uncircumcised, alongside those killed by the sword—Pharaoh and his whole multitude. This is what the Lord GOD declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient witnesses read “my terror in the land of the living,” but the Hebrew text reads “his terror.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: I put his terror in the land of the living
  simplified_phrase: I made people in the land of the living fear him
  preserved_meaning: God caused Pharaoh to inspire fear among the living.
  reasoning_layer_used: Lexical decisions for נָתַתִּי and חֲתִיתוֹ
  rationale: The recast explains “his terror” without adding the unsupported idea that it spread throughout the land.
- pob_phrase: with those slain by the sword
  simplified_phrase: alongside those killed by the sword
  preserved_meaning: Pharaoh will share the place and fate of those who died by violence.
  reasoning_layer_used: Lexical decision for אֶת חַלְלֵי חֶרֶב
  rationale: “Alongside” and “killed” use common wording while preserving the sword image.
- pob_phrase: declares the Lord GOD
  simplified_phrase: This is what the Lord GOD declares
  preserved_meaning: The judgment is the Lord GOD’s authoritative prophetic declaration.
  reasoning_layer_used: Lexical and theological decision for נְאֻם אֲדֹנָי יְהוִה
  rationale: A separate sentence makes the prophetic formula easier to follow.
interpretive_expansions:
- pob_phrase: his terror
  rendering: made people in the land of the living fear him
  claim: The terror was the fear Pharaoh inspired rather than fear he felt.
  evidence:
  - The third-person suffix refers naturally to Pharaoh.
  - The POB rationale identifies this as the fear Pharaoh inspired.
  confidence: high
  alternatives_preserved:
  - my terror
translation_notes:
  risk_flags:
  - risk: The causative wording makes the effect of “put his terror” more explicit than the Hebrew form alone.
    mitigation: The POB rationale already identifies the phrase as fear Pharaoh inspired.
  - risk: Modern readers may miss the covenantal shame conveyed by “uncircumcised.”
    mitigation: The term is retained because replacing it would erase Ezekiel’s loaded covenantal language.
