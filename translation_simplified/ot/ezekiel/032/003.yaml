translation:
  language: en
  text: 'This is what the Lord GOD says: “I will spread my net over you with a large gathering of peoples, and they will haul you up in my dragnet.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that God uses the gathered peoples to spread the net; it also uses two different words for fishing nets.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord GOD says
  preserved_meaning: The prophetic declaration and compound divine title retain their force.
  reasoning_layer_used: POB translation and lexical decision for אֲדֹנָי יְהוִה
  rationale: The familiar formula is clearer while preserving the chosen divine title.
- pob_phrase: with an assembly of many peoples
  simplified_phrase: with a large gathering of peoples
  preserved_meaning: Many gathered peoples are linked to God's action, whether as its means or its setting.
  reasoning_layer_used: POB lexical decision and footnote for בִּקְהַל עַמִּים רַבִּים
  rationale: “Gathering” is common English, while “with” preserves the documented ambiguity.
- pob_phrase: and they will haul you up in my dragnet
  simplified_phrase: and they will haul you up in my dragnet
  preserved_meaning: The peoples actively pull up the captured target in God's second kind of fishing net.
  reasoning_layer_used: POB lexical decisions for וְהֶעֱלוּךָ and בְּחֶרְמִי
  rationale: The direct wording clearly links the gathered peoples to the hauling action and preserves both net images.
translation_notes:
  risk_flags:
  - risk: “With” leaves the exact role of the gathered peoples open.
    mitigation: The footnote states the possible instrumental meaning without removing the circumstantial reading.
  - risk: Readers may wonder why both “net” and “dragnet” are used.
    mitigation: The footnote explains that the Hebrew uses two distinct fishing-net terms.
