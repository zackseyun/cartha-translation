translation:
  language: en
  text: Among the slain, they prepared a burial bed for her, with all her people. Her graves surround him.[a] They were all uncircumcised and killed by the sword, because they had spread terror in the land of the living.[b] They bore their disgrace with those who descend to the pit. She was given a place among the slain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts between feminine and masculine forms, perhaps referring first to the nation and then to its representative; the final clause may also read, “He was given a place among the slain.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew literally says, “their terror was set in the land of the living.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they made a bed for her with all her multitude
  simplified_phrase: they prepared a burial bed for her, with all her people
  preserved_meaning: The nation is pictured as laid among the dead, accompanied by all her people.
  reasoning_layer_used: Lexical decision and contextual grave imagery
  rationale: “Burial bed” clarifies the funerary image, while the comma keeps the people as her accompanying multitude.
- pob_phrase: All of them are uncircumcised, slain by the sword
  simplified_phrase: They were all uncircumcised and killed by the sword
  preserved_meaning: They died violently as covenantal outsiders under judgment.
  reasoning_layer_used: Lexical and theological decisions for עֲרֵלִים and חַלְלֵי חֶרֶב
  rationale: Ordinary syntax improves clarity while retaining the significant term “uncircumcised.”
- pob_phrase: she was placed among the slain
  simplified_phrase: She was given a place among the slain
  preserved_meaning: The personified nation is assigned a place among the war dead.
  reasoning_layer_used: Lexical decision for בְּתוֹךְ חֲלָלִים נִתָּן
  rationale: “Given a place” is natural English that preserves the passive judgment.
interpretive_expansions:
- pob_phrase: made a bed
  rendering: prepared a burial bed
  claim: The bed is a grave-resting image rather than an ordinary place to sleep.
  evidence:
  - The verse repeatedly mentions graves, the slain, and descent to the pit.
  - The POB rationale identifies underworld grave-arrangement imagery.
  confidence: high
  alternatives_preserved:
  - prepared a bed among the slain
- pob_phrase: their terror was set
  rendering: they had spread terror
  claim: They had caused terror throughout the realm of the living.
  evidence:
  - The POB explicitly records “they spread their terror” as a lexical alternative.
  - The context contrasts their former terror among the living with their disgrace among the dead.
  confidence: moderate
  alternatives_preserved:
  - their terror was set in the land of the living
translation_notes:
  risk_flags:
  - risk: “Spread terror” makes the people the subject more explicitly than the Hebrew passive wording does.
    mitigation: Footnote b preserves the literal wording and its ambiguity.
  - risk: The shift from “her” to “him” may confuse readers.
    mitigation: Footnote a explains the gender shift without resolving it.
