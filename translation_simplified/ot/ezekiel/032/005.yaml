translation:
  language: en
  text: I will lay your flesh on the mountains. I will fill the valleys with your carcass.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult and may refer to Pharaoh’s corpse or, more literally, his fallen height or lofty frame.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I will put your flesh on the mountains
  simplified_phrase: I will lay your flesh on the mountains.
  preserved_meaning: God directly places Pharaoh’s exposed flesh on the mountains in judgment.
  reasoning_layer_used: Lexical decision for וְנָתַתִּי and theological decision on violent judgment imagery.
  rationale: “Lay” is natural for placing a corpse while keeping the graphic image of “flesh.”
- pob_phrase: and I will fill the valleys with your carcass
  simplified_phrase: I will fill the valleys with your carcass.
  preserved_meaning: Pharaoh’s fallen body is pictured as so vast that it fills the valleys.
  reasoning_layer_used: Lexical decisions for וּמִלֵּאתִי, הַגֵּאָיוֹת, and רָמוּתֶךָ.
  rationale: A new sentence makes the second judgment image easier to grasp without weakening it.
translation_notes:
  risk_flags:
  - risk: “Carcass” gives one contextual meaning for an unusually difficult Hebrew term.
    mitigation: The footnote preserves the corpse, height, and lofty-frame alternatives.
