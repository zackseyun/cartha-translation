translation:
  language: en
  text: For I am Yahweh. Whatever word I speak will be carried out. It will no longer be delayed. In your own days, you rebellious people, I will speak a word and carry it out, declares the Lord GOD.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the word that I speak will be done
  simplified_phrase: Whatever word I speak will be carried out
  preserved_meaning: Every pronouncement from Yahweh is certain to be accomplished.
  reasoning_layer_used: The lexical decision for the emphatic Hebrew construction controls the wording.
  rationale: “Whatever” preserves the emphasis, while “carried out” clearly connects Yahweh’s speech with fulfillment.
- pob_phrase: in your days
  simplified_phrase: In your own days
  preserved_meaning: The announced fulfillment will occur in the time of the community being addressed.
  reasoning_layer_used: The plural Hebrew phrase and immediate context indicate the hearers’ present time without narrowing it to each person’s lifespan.
  rationale: “Own” makes the time contrast clear while retaining the corporate scope of “days.”
- pob_phrase: O rebellious house
  simplified_phrase: you rebellious people
  preserved_meaning: Yahweh addresses Israel collectively as a people marked by rebellion.
  reasoning_layer_used: The lexical rationale identifies “house” as a corporate covenantal image.
  rationale: “People” communicates the collective address clearly for readers unfamiliar with the Hebrew idiom.
interpretive_expansions:
- pob_phrase: in your days
  rendering: In your own days
  claim: The word will be spoken and fulfilled in the time of the community being addressed rather than being postponed beyond it.
  evidence:
  - The plural Hebrew phrase addresses the rebellious community collectively.
  - The verse says the word will no longer be delayed.
  confidence: high
  alternatives_preserved:
  - in your days
  - in your own time
translation_notes:
  risk_flags:
  - risk: Rendering “house” as “people” removes the literal household image.
    mitigation: The collective address and Israel’s corporate identity remain clear in “you rebellious people.”
