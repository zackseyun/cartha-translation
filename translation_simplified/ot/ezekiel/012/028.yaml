translation:
  language: en
  text: 'Therefore tell them, “This is what the Lord Yahweh says: None of my words will be delayed any longer. Whatever I say will be done,” declares the Lord Yahweh.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore say to them
  simplified_phrase: Therefore tell them
  preserved_meaning: God commands Ezekiel to deliver this conclusion to the people.
  reasoning_layer_used: Lexical decision for אֱמֹר אֲלֵיהֶם
  rationale: “Tell them” is natural modern English and preserves the command to speak.
- pob_phrase: Thus says the Lord GOD
  simplified_phrase: This is what the Lord Yahweh says
  preserved_meaning: The message is presented as God’s authoritative speech, using his covenant name.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר and theological decision for אֲדֹנָי יְהוִה
  rationale: The formula becomes immediately clear while “Yahweh” follows the stated doctrine decision.
- pob_phrase: the word that I speak will be done
  simplified_phrase: Whatever I say will be done
  preserved_meaning: Every prophetic word God speaks will become reality.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר אֲדַבֵּר דָּבָר and וְיֵעָשֶׂה
  rationale: “Whatever I say” clearly conveys the generic force without weakening certain fulfillment.
translation_notes:
  risk_flags:
  - risk: “Whatever” could sound broader than the immediate prophetic context.
    mitigation: The preceding reference to God’s words keeps it focused on his declared messages.
