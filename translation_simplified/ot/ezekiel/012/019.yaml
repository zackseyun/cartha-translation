translation:
  language: en
  text: 'Say to the people of the land, “This is what the Lord Yahweh says about those living in Jerusalem, in the land of Israel: They will eat their bread anxiously and drink their water with horror.[a] This will happen so that the land is left desolate and emptied of everything that fills it, because of the violence of everyone who lives there.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in desolation” or “in dismay”; the Hebrew word can describe both devastation and the horror it causes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says the Lord GOD concerning the inhabitants of Jerusalem
  simplified_phrase: This is what the Lord Yahweh says about those living in Jerusalem
  preserved_meaning: God gives an authoritative message about Jerusalem’s residents, and both parts of the divine title remain.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Natural English replaces the formal syntax, while “Yahweh” follows the updated divine-name decision.
- pob_phrase: They will eat their bread with anxiety and drink their water with horror
  simplified_phrase: They will eat their bread anxiously and drink their water with horror
  preserved_meaning: They consume basic provisions in anxiety and appalled fear.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: The wording is natural while preserving the manner of drinking rather than treating horror as their surroundings.
- pob_phrase: so that her land may be made desolate of its fullness because of the violence of all who dwell in it
  simplified_phrase: This will happen so that the land is left desolate and emptied of everything that fills it, because of the violence of everyone who lives there
  preserved_meaning: The land loses all it contains as judgment for its inhabitants’ violence, with the purpose-result link retained.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: The difficult fullness image is unpacked without removing the explicit “so that” connection.
