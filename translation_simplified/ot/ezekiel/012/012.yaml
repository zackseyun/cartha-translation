translation:
  language: en
  text: The prince among them will put his baggage on his shoulder and leave under cover of darkness.[a] They will dig an opening through the wall and take him out through it. He will cover his face so that he will not see the land with his own eyes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “leave in the twilight.” The Hebrew can refer to darkness, gloom, or dim light, with concealment in view.
    reason: lexical_alternative
  - marker: b
    text: Or, “He will cover his face because he will not see the land with his own eyes.”
    reason: alternative_reading
