translation:
  language: en
  text: 'So tell them, “This is what the Lord Yahweh says: I will put an end to this proverb. No one in Israel will use it anymore. Instead, tell them, ‘The time is near, and every vision will be fulfilled.’”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore say to them, ‘Thus says the Lord GOD
  simplified_phrase: So tell them, “This is what the Lord Yahweh says
  preserved_meaning: God commissions Ezekiel to deliver a direct message from the Lord Yahweh.
  reasoning_layer_used: Lexical decisions for לָכֵן and אֱמֹר אֲלֵיהֶם, plus the theological decision for אֲדֹנָי יְהוִה
  rationale: Common wording clarifies the commission while preserving Yahweh as the divine name.
- pob_phrase: they will no longer use it as a proverb in Israel
  simplified_phrase: No one in Israel will use it anymore
  preserved_meaning: Israel will cease using this saying as a proverb.
  reasoning_layer_used: Lexical decision for וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  rationale: A direct active sentence states the same result more clearly.
- pob_phrase: The days have drawn near, and the fulfillment of every vision
  simplified_phrase: The time is near, and every vision will be fulfilled
  preserved_meaning: The appointed time is imminent, and the visions will come to pass.
  reasoning_layer_used: Lexical decisions for קָרְבוּ הַיָּמִים and וּדְבַר כָּל חָזוֹן
  rationale: Natural English makes the abstract fulfillment clause immediately understandable.
interpretive_expansions:
- pob_phrase: the word of every vision
  rendering: every vision will be fulfilled
  claim: The visions will actually come to pass without the delay claimed in the proverb.
  evidence:
  - The POB lexical rationale identifies actual realization as the contextual sense.
  - The preceding proverb claims that visions do not come to pass soon.
  confidence: high
  alternatives_preserved:
  - the fulfillment of every vision
  - the word of every vision
translation_notes:
  risk_flags:
  - risk: “Every vision” could sound unlimited beyond the visions disputed in this setting.
    mitigation: The wording remains within Yahweh’s message to Israel about those prophetic visions.
