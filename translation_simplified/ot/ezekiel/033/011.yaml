translation:
  language: en
  text: Tell them, “‘As surely as I live,’ declares the Lord GOD, ‘I take no pleasure in the death of a wicked man. Instead, I take pleasure in his turning from the way he has been living and in his living. Turn back! Turn back from your evil ways! Why will you die, people of Israel?’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As I live
  simplified_phrase: As surely as I live
  preserved_meaning: God solemnly guarantees the truth of his declaration by his own life.
  reasoning_layer_used: POB lexical decision for חַי אָ֣נִי
  rationale: Adding “surely” makes the oath’s force immediately clear.
- pob_phrase: that the wicked turn from his way and live
  simplified_phrase: in his turning from the way he has been living and in his living
  preserved_meaning: God favors the wicked man’s change of conduct and resulting life rather than his death.
  reasoning_layer_used: POB lexical and theological decisions for שׁוּב, דרך, and חפץ
  rationale: The recast sentence clarifies both the contrast and the conduct image.
- pob_phrase: O house of Israel
  simplified_phrase: people of Israel
  preserved_meaning: God directly addresses Israel as one covenant people.
  reasoning_layer_used: POB lexical decision for בֵּית יִשְׂרָאֵל
  rationale: The common expression communicates the corporate address without the opaque household idiom.
interpretive_expansions:
- pob_phrase: his way
  rendering: the way he has been living
  claim: The “way” is the wicked man’s pattern of conduct, not a physical road.
  evidence:
  - The POB rationale identifies “way” as a metaphor of conduct.
  - The following command calls Israel to turn from its “evil ways.”
  confidence: high
  alternatives_preserved:
  - his way
  - his path
translation_notes:
  risk_flags:
  - risk: “I take pleasure” may sound stronger than the POB’s positive contrast.
    mitigation: The wording remains bounded by the verse’s explicit contrast and avoids broader claims about divine will.
  - risk: “People of Israel” does not retain the prophetic “house” idiom.
    mitigation: It preserves the corporate covenant address in language common readers readily understand.
