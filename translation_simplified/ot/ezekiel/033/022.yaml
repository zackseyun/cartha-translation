  preserved_meaning: Yahweh acted upon Ezekiel during the evening before the messenger arrived.
  reasoning_layer_used: lexical decision and immediate narrative context
  rationale: The wording gives the time naturally without adding another event.
- pob_phrase: the fugitive
  simplified_phrase: the man who had escaped
  preserved_meaning: The arriving messenger had escaped and survived Jerusalem's fall.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: This avoids suggesting that the messenger was a criminal.
- pob_phrase: he opened my mouth until he came to me
  simplified_phrase: Yahweh opened my mouth so that I could speak by the time the man came to me
  preserved_meaning: Yahweh restored Ezekiel's speech before the escaped man's morning arrival.
  reasoning_layer_used: theological agency decision and lexical temporal alternative
  rationale: Naming both men and using the audited temporal alternative removes pronoun confusion without implying that the restored speech ended.
