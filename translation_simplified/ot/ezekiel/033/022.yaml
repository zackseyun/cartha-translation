translation:
  language: en
  text: The hand of Yahweh was upon me that evening, before the man who had escaped arrived. Yahweh opened my mouth so that I could speak by the time the man came to me in the morning. My mouth was opened, and I was no longer mute.
  philosophy: optimal-equivalence
