- pob_phrase: Wicked one, you shall surely die
  simplified_phrase: You wicked person, you will certainly die
  preserved_meaning: God directly addresses the wicked person and declares his death certain.
  reasoning_layer_used: Lexical decisions for רָשָׁע and the intensified expression מוֹת תָּמוּת.
  rationale: Common wording preserves the direct address and solemn certainty.
- pob_phrase: warn the wicked from his way
  simplified_phrase: warn him to turn away from his way of life
  preserved_meaning: The warning is meant to move him away from his course of conduct.
  reasoning_layer_used: Lexical rationale for מִדַּרְכּוֹ as warning someone away from a manner of life.
  rationale: The way image is retained and clarified without adding an unsupported description.
- pob_phrase: die in his iniquity
  simplified_phrase: die because of his own wrongdoing
  preserved_meaning: The wicked person dies for his own moral guilt, while the watchman is separately accountable for failing to warn him.
  reasoning_layer_used: Lexical decision for עָוֹן and the theological decision preserving both forms of accountability.
  rationale: Wrongdoing is clearer than iniquity while keeping personal guilt explicit.
