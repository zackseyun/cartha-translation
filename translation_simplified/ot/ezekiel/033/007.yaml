translation:
  language: en
  text: Son of man,[a] I have made you a watchman for the people of Israel. When you hear a word from my mouth, you must warn them on my behalf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “human one” or “mortal.” “Son of man” is God’s repeated way of addressing Ezekiel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you, son of man
  simplified_phrase: Son of man
  preserved_meaning: God directly addresses Ezekiel by his recurring prophetic title.
  reasoning_layer_used: Lexical and theological decisions on בֶן אָדָם
  rationale: Removing the opening connective makes the address natural while retaining its established form.
- pob_phrase: for the house of Israel
  simplified_phrase: for the people of Israel
  preserved_meaning: Ezekiel is assigned to serve Israel as their watchman.
  reasoning_layer_used: Lexical decision on לְבֵית יִשְׂרָאֵל
  rationale: “People of Israel” makes the collective meaning clear without changing the scope of his commission.
- pob_phrase: you shall warn them from me
  simplified_phrase: you must warn them on my behalf
  preserved_meaning: The warning is a binding duty and comes with God’s authority.
  reasoning_layer_used: Lexical decisions on וְהִזְהַרְתָּ and מִמֶּנִּי
  rationale: The revised wording states the obligation and divine source in natural English.
translation_notes:
  risk_flags:
  - risk: “People of Israel” does not retain the literal household image in “house of Israel.”
    mitigation: It preserves the phrase’s collective reference to Israel and avoids an opaque biblical idiom.
  - risk: “On my behalf” may emphasize authorized representation more than simple source.
    mitigation: The wording is a documented lexical alternative, while “from my mouth” still explicitly identifies God as the source.
