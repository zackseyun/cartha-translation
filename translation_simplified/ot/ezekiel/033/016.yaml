simplification_decisions:
- pob_phrase: None of the sins that he committed
  simplified_phrase: Not one of his former sins
  preserved_meaning: Each earlier sin is excluded from being held against him.
  reasoning_layer_used: POB lexical decisions for כָּל and חטאתו, with the immediate repentance context
  rationale: The shorter wording keeps the distributive force while making the prior timing clear.
- pob_phrase: he has done justice and righteousness
  simplified_phrase: He has practiced justice and righteousness.
  preserved_meaning: He has acted with sustained justice and moral uprightness.
  reasoning_layer_used: POB lexical decisions for מִשְׁפָּט, צְדָקָה, and עָשָׂה
  rationale: “Practiced” sounds natural for ethical conduct while retaining both distinct concepts.
- pob_phrase: he shall surely live
  simplified_phrase: He will surely live.
  preserved_meaning: His life is stated with emphatic certainty.
  reasoning_layer_used: POB lexical decision for חָיוֹ יִחְיֶה
  rationale: “Will” is common modern English, while “surely” preserves the Hebrew emphasis.
