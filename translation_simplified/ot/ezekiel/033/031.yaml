translation:
  language: en
  text: They come to you as people normally gather to listen, and they sit before you as my people. They listen to your words, but they do not obey them. With their mouths they turn your message into pleasing entertainment,[a] while their hearts chase after dishonest gain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew wording may refer to lustful or sensual desires, affectionate speech, or love songs; the next verse compares the prophet’s message to a beautiful song.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean profit, greed, or covetous gain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they come to you as people come
  simplified_phrase: They come to you as people normally gather to listen
  preserved_meaning: They approach in the ordinary public manner of people coming to hear.
  reasoning_layer_used: Lexical decision for כִּמְבוֹא עָם
  rationale: This avoids narrowing the comparison to crowds while making its purpose clear.
- pob_phrase: they hear your words, but they do not do them
  simplified_phrase: They listen to your words, but they do not obey them
  preserved_meaning: They hear Ezekiel’s message without acting on it.
  reasoning_layer_used: Lexical decisions for שמע and עשה
  rationale: “Obey” clearly expresses what it means to do the words in this context.
- pob_phrase: with their mouth they speak lustful things, while their heart goes after their unjust gain
  simplified_phrase: With their mouths they turn your message into pleasing entertainment, while their hearts chase after dishonest gain
  preserved_meaning: Their outward response is merely pleasing performance, while their inward desire pursues morally tainted gain.
  reasoning_layer_used: Lexical and theological decisions for עֲגָבִים, עשה, בצע, and the mouth-heart contrast
  rationale: The rendering keeps the mouth-heart contrast without presenting the disputed phrase as explicitly sexual.
