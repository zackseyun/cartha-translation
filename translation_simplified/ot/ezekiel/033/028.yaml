translation:
  language: en
  text: I will make the land completely desolate and ruined. Its pride in its own strength will come to an end.[a] Israel’s mountains will lie deserted, with no one traveling through them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the majesty of its strength,” but “pride” best fits this message of judgment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make the land a desolation and a waste
  simplified_phrase: make the land completely desolate and ruined
  preserved_meaning: God will cause the land to become thoroughly devastated.
  reasoning_layer_used: POB lexical decisions for וְנָתַתִּי, שְׁמָמָה, and וּמְשַׁמָּה
  rationale: The causative verb remains explicit while common adjectives clearly convey the paired terms for ruin.
- pob_phrase: the pride of its strength will cease
  simplified_phrase: Its pride in its own strength will come to an end
  preserved_meaning: The land’s pride based on its strength, rather than the strength itself, will cease.
  reasoning_layer_used: POB theological decision for גְּאוֹן and lexical decisions for עֻזָּהּ and וְנִשְׁבַּת
  rationale: The recast phrase keeps pride as the thing that ends and makes its relation to strength clear.
- pob_phrase: the mountains of Israel will be desolate, with no one passing through
  simplified_phrase: Israel’s mountains will lie deserted, with no one traveling through them
  preserved_meaning: The mountains will be abandoned and without travelers.
  reasoning_layer_used: POB lexical decisions for וְשָׁמְמוּ, הָרֵי יִשְׂרָאֵל, and מֵאֵין עוֹבֵר
  rationale: Natural wording makes the physical abandonment easy to picture without weakening it.
