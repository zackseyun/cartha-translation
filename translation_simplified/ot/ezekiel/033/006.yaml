- pob_phrase: and the people are not warned
  simplified_phrase: the people receive no warning
  preserved_meaning: The watchman’s failure leaves the people unwarned.
  reasoning_layer_used: POB lexical decision for וְהָעָם לֹא נִזְהָר
  rationale: The active wording makes the causal connection easier to follow.
- pob_phrase: that one is taken away in his iniquity
  simplified_phrase: that person dies in his own sin
  preserved_meaning: The person dies while remaining responsible for his own sin.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This states the fatal outcome plainly without shifting the person’s guilt to the watchman.
- pob_phrase: I will require his blood from the watchman’s hand
  simplified_phrase: I will demand that person’s blood from the watchman’s hand—I will hold the watchman accountable for the death
  preserved_meaning: God requires the watchman to answer for a death caused by his failure to warn.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The rendering keeps the Hebrew blood-and-hand image and immediately explains its legal force.
