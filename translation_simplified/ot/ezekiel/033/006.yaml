translation:
  language: en
  text: But if the watchman sees the sword coming and does not blow the trumpet, the people receive no warning.[a] If the sword then comes and takes one of their lives, that person dies in his own sin. Yet I will demand that person’s blood from the watchman’s hand—I will hold the watchman accountable for the death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the people do not take warning.” The Hebrew can express either meaning, but the main text emphasizes the watchman’s failure to warn them.
    reason: lexical_alternative
  - marker: b
    text: Demanding someone’s blood “from the watchman’s hand” is a legal image for holding the watchman accountable for the death.
    reason: cultural_note
