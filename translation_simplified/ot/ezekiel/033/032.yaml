translation:
  language: en
  text: Look, to them you are like a sensual song[a], sung with a beautiful voice and accompanied by skillful music. They listen to your words, but they do not act on them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a love song.” The Hebrew expression suggests passionate or sensual desire; the people treat the prophet’s message as appealing entertainment.
    reason: lexical_alternative
