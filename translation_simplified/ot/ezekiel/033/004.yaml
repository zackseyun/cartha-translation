  text: Then, if someone hears the trumpet blast but does not take warning, and the sword comes and kills that person, that person’s blood will be on their own head.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression means that the person is responsible for their own death.
