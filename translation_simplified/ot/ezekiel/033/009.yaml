translation:
  language: en
  text: But if you warn a wicked man to turn away from his way, and he does not turn away, he will die in his sin.[a] But you will have saved your own life.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “He will die in his sin” may also mean “he will die because of his sin.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to turn from his way, and he does not turn from his way
  simplified_phrase: to turn away from his way, and he does not turn away
  preserved_meaning: The man is warned to abandon his sinful course but does not do so.
  reasoning_layer_used: Lexical decision for מִדַּרְכּוֹ and Hebrew repetition
  rationale: The rewrite keeps the moral path image while avoiding awkward repetition.
- pob_phrase: he will die in his iniquity
  simplified_phrase: he will die in his sin
  preserved_meaning: His death remains tied to his own wrongdoing.
  reasoning_layer_used: Lexical and theological decisions for בַּעֲוֺנוֹ
  rationale: “Sin” is clearer common English, while the footnote preserves the possible causal sense.
- pob_phrase: you will have delivered your soul
  simplified_phrase: you will have saved your own life
  preserved_meaning: The watchman is free from bloodguilt and preserves his life after faithfully warning the man.
  reasoning_layer_used: Lexical and theological decisions for הִצַּלְתָּ and נַפְשְׁךָ
  rationale: “Saved your own life” avoids suggesting an immaterial soul and states the contextual sense naturally.
translation_notes:
  risk_flags:
  - risk: Readers may hear “in his sin” only as circumstance rather than cause.
    mitigation: The footnote preserves the supported causal reading.
  - risk: “Saved” may suggest broader spiritual salvation.
    mitigation: Pairing it with “your own life” anchors it in the watchman’s accountability and survival.
