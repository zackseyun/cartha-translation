translation:
  language: en
  text: As for you, son of man, your people talk about you[a] beside the walls and in the doorways of the houses. They say to one another, “Come now and hear what message is coming from Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “talk with you,” though the context more likely means they talk about Ezekiel among themselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “coming out from Yahweh,” picturing the prophetic message as proceeding from him.
    reason: source_note
simplification_decisions:
- pob_phrase: And you, son of man, the sons of your people
  simplified_phrase: As for you, son of man, your people
  preserved_meaning: Yahweh addresses Ezekiel about members of his own people.
  reasoning_layer_used: lexical decision for בֶן אָדָם and audit note for בְּנֵי עַמְּךָ
  rationale: The framing is natural English, and “your people” avoids wrongly limiting the group to men.
- pob_phrase: each one speaking with another, each man with his brother
  simplified_phrase: They say to one another
  preserved_meaning: The people are speaking among themselves about Ezekiel.
  reasoning_layer_used: lexical decisions for reciprocal conversation and brother
  rationale: The shorter wording preserves the reciprocal conversation without repeating it.
- pob_phrase: hear what the word is that comes from Yahweh
  simplified_phrase: hear what message is coming from Yahweh
  preserved_meaning: They invite one another to hear what prophetic message proceeds from Yahweh.
  reasoning_layer_used: lexical and theological decisions for דָּבָר, יצא, and יְהוָה
  rationale: “Message” clarifies prophetic “word” while retaining “what,” its divine source, and the name Yahweh.
translation_notes:
  risk_flags:
  - risk: “Your people” does not reproduce the masculine form of the Hebrew idiom.
    mitigation: The POB audit says the expression refers broadly to members of Ezekiel’s people.
  - risk: “Coming from” softens the Hebrew image of the message coming out from Yahweh.
    mitigation: Footnote b preserves the directional image and explains it briefly.
