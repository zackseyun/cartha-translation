translation:
  language: en
  text: If a wicked man returns an item taken as security for a loan, repays what he stole, and lives by the laws that give life,[a] without doing injustice, he will surely live; he will not die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the laws of life,” leaving open whether these laws are characterized by life or lead to life.
    reason: lexical_alternative
