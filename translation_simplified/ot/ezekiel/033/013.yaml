translation:
  language: en
  text: When I tell a righteous man, “You will certainly live,” but he depends on his own righteousness and does what is unjust, none of his righteous deeds will be remembered. He will die because of the injustice he has done.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “in it he will die” or “by it he will die,” referring to his injustice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When I say to the righteous man, ‘He shall surely live,’
  simplified_phrase: When I tell a righteous man, “You will certainly live,”
  preserved_meaning: God directly assures the righteous man that he will live, with the Hebrew emphasis retained.
  reasoning_layer_used: Lexical decisions for בְּאָמְרִי and חָיֹה יִחְיֶה.
  rationale: Direct address and “certainly” make the assurance natural without weakening its force.
- pob_phrase: he trusts in his righteousness
  simplified_phrase: he depends on his own righteousness
  preserved_meaning: He wrongly relies on his righteous standing or conduct.
  reasoning_layer_used: Lexical decision for בָטַח עַל צִדְקָתוֹ.
  rationale: “Depends on” clearly expresses misplaced reliance in common English.
- pob_phrase: and does injustice
  simplified_phrase: and does what is unjust
  preserved_meaning: He commits wrong without narrowing the kind of wrongdoing involved.
  reasoning_layer_used: Lexical decision for וְעָשָׂה עָוֶל.
  rationale: The verbal wording is easier to understand while preserving the repeated idea of injustice.
interpretive_expansions:
- pob_phrase: by the injustice that he has done he shall die
  rendering: He will die because of the injustice he has done.
  claim: His injustice is stated explicitly as the basis of his death.
  evidence:
  - The lexical rationale says the phrase identifies the sphere or basis of his death.
  - The documented alternatives include “because of it he shall die.”
  confidence: moderate
  alternatives_preserved:
  - in it he will die
  - by it he will die
