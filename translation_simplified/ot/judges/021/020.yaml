simplification_decisions:
- pob_phrase: And they commanded the sons of Benjamin, saying
  simplified_phrase: They gave the men of Benjamin this command
  preserved_meaning: A plural group authoritatively instructed Benjamin’s men.
  reasoning_layer_used: POB lexical decisions for וַיְצַו, אֶת בְּנֵי בִנְיָמִן, and לֵאמֹר
  rationale: This removes the Hebrew-style quotation formula while retaining the plural commanders and the force of a command.
- pob_phrase: the sons of Benjamin
  simplified_phrase: the men of Benjamin
  preserved_meaning: The command was addressed to the male members of the tribe of Benjamin.
  reasoning_layer_used: POB lexical decision for אֶת בְּנֵי בִנְיָמִן
  rationale: “Men of Benjamin” makes the kinship expression immediately clear in this narrative setting.
- pob_phrase: lie in wait in the vineyards
  simplified_phrase: hide in the vineyards and wait there
  preserved_meaning: They were to conceal themselves in the vineyards and remain ready to act.
  reasoning_layer_used: POB lexical decisions for וַאֲרַבְתֶּם and בַּכְּרָמִים
  rationale: The plain verbs unpack the ambush image without removing its concealment and waiting.
translation_notes:
  risk_flags:
  - risk: “Men of Benjamin” is less literal than the Hebrew kinship phrase “sons of Benjamin.”
    mitigation: It preserves the group identity and fits the adult male participants in the immediate context.
  - risk: “Hide and wait” may state the ambush action less sharply than “lie in wait.”
    mitigation: The two verbs preserve the image of concealed waiting without adding an unstated target or attack.
