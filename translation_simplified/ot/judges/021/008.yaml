translation:
  language: en
  text: Then they asked, “Which one of Israel’s tribes did not go up to Yahweh at Mizpah[a]?” They discovered that not a single man from Jabesh-gilead had come to the assembly in the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appear before Yahweh at Mizpah.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And they said
  simplified_phrase: Then they asked
  preserved_meaning: The words introduce their question and advance the narrative.
  reasoning_layer_used: Lexical decision for וַיֹּאמְרוּ and immediate syntax
  rationale: “Asked” states the natural force of “said” before a direct question.
- pob_phrase: And behold, not a man from Jabesh-gilead had come
  simplified_phrase: They discovered that not a single man from Jabesh-gilead had come
  preserved_meaning: The wording marks the noteworthy discovery that every man from the town was absent.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה and לֹא בָא אִישׁ
  rationale: This replaces the archaic “behold” while retaining the emphatic total absence.
- pob_phrase: to the camp, to the assembly
  simplified_phrase: to the assembly in the camp
  preserved_meaning: The destination was Israel’s gathered community at its encampment.
  reasoning_layer_used: Lexical decisions for מַחֲנֶה and קָהָל
  rationale: The recast makes the appositional destinations clear in ordinary English.
translation_notes:
  risk_flags:
  - risk: “In the camp” makes the relation between camp and assembly more explicit than the Hebrew apposition.
    mitigation: The rendering keeps both distinct source ideas without adding a new event.
