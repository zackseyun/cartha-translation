translation:
  language: en
  text: 'The sons of Israel[a] said, “Was there anyone from among all the tribes of Israel who did not come to Yahweh in the assembly?” They asked because they had made a solemn oath concerning anyone who did not come to Yahweh at Mizpah: “He must be put to death.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” means the Israelites as a people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?
  simplified_phrase: Was there anyone from among all the tribes of Israel who did not come to Yahweh in the assembly?
  preserved_meaning: The question seeks an absentee from the full body of Israel’s tribes.
  reasoning_layer_used: Lexical decisions for מִי אֲשֶׁר, לֹא עָלָה, בַקָּהָל, and אֶל יְהוָה
  rationale: The wording preserves the full tribal scope and the persons’ relation to Yahweh in the assembly.
- pob_phrase: For the great oath had been made concerning whoever
  simplified_phrase: They asked because they had made a solemn oath concerning anyone
  preserved_meaning: Their question arose from a weighty and binding oath concerning every absentee.
  reasoning_layer_used: Lexical decision for הַשְּׁבוּעָה הַגְּדוֹלָה and immediate narrative context
  rationale: The active sentence makes the cause clear, while “solemn” conveys the oath’s contextual force.
- pob_phrase: He shall surely be put to death.
  simplified_phrase: He must be put to death.
  preserved_meaning: The oath required the absentee to be judicially put to death.
  reasoning_layer_used: Lexical decision for מוֹת יוּמָת
  rationale: “Must” preserves the emphatic and judicial force in natural English.
interpretive_expansions:
- pob_phrase: For the great oath had been made concerning whoever
  rendering: They asked because they had made a solemn oath concerning anyone
  claim: The oath explains why the Israelites asked the question, and they were the ones who made it.
  evidence:
  - The conjunction introduces the oath as the reason for the preceding question.
  - The immediate context identifies Israel as the oath-making group.
  confidence: high
  alternatives_preserved:
  - For a great oath had been made concerning whoever
translation_notes:
  risk_flags:
