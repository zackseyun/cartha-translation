translation:
  language: en
  text: So the sons of Benjamin carried out the plan. Each man took as his wife one of the dancing women they had seized. Then they left and returned to their inheritance.[a] They rebuilt the cities[b] and lived in them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Their “inheritance” was the land allotted to their tribe.
    reason: cultural_note
  - marker: b
    text: Hebrew says “built”; “rebuilt” fits the earlier destruction of Benjamin’s cities.
    reason: lexical_alternative
