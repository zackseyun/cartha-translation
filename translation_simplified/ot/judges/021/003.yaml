translation:
  language: en
  text: They said, “Yahweh, God of Israel, why has this happened? Why is Israel missing one of its tribes today?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Why, O Yahweh, God of Israel
  simplified_phrase: Yahweh, God of Israel, why
  preserved_meaning: They directly address Yahweh by his covenant name and identify him as Israel’s God.
  reasoning_layer_used: Theological decision on יְהוָה and lexical decision on אֱלֹהֵי יִשְׂרָאֵל.
  rationale: Modern word order removes the archaic “O” while preserving the solemn address.
- pob_phrase: has this happened in Israel, that today
  simplified_phrase: has this happened? Why ... today?
  preserved_meaning: Their question is a lament over what has happened within Israel and its present result.
  reasoning_layer_used: Lexical decisions for הָיְתָה זֹּאת, בְּיִשְׂרָאֵל, and הַיּוֹם.
  rationale: Two short questions make the lament’s event and result easier to follow.
- pob_phrase: one tribe should be lacking from Israel
  simplified_phrase: Israel is missing one of its tribes
  preserved_meaning: One tribal unit is absent from the larger nation of Israel.
  reasoning_layer_used: Lexical decisions for לְהִפָּקֵד, מִיִּשְׂרָאֵל, and שֵׁבֶט אֶחָד.
  rationale: The corporate subject and possessive wording express the same absence in ordinary English.
translation_notes:
  risk_flags:
  - risk: Changing the result clause into a second question slightly reshapes the Hebrew syntax.
    mitigation: The two questions preserve the same lament and causal relationship without adding a new claim.
