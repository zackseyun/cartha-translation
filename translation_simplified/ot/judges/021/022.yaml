translation:
  language: en
  text: When the women’s fathers or brothers come to dispute with us,[a] we will say to them, “Please show us favor concerning the women. We did not obtain enough wives in the battle for every man. Since you did not give the women to them yourselves, you are not guilty now.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “come to complain to us” or “come to bring a case against us.”
    reason: lexical_alternative
