translation:
  language: en
  text: Watch for the daughters of Shiloh to come out and take part in the dances. When they do, come out of the vineyards. Each man must seize[a] one of them for himself as his wife, and then go to the land of Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “snatch” or “carry off”; the Hebrew word describes forceful taking.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Watch, and behold, when
  simplified_phrase: Watch for ... When they do
  preserved_meaning: The men are told to observe carefully and act when the women appear.
  reasoning_layer_used: Lexical decisions and latest revision pass
  rationale: The recast removes the formal attention marker while preserving its urgency in the command to watch.
- pob_phrase: come out to dance in the dances
  simplified_phrase: come out and take part in the dances
  preserved_meaning: The daughters of Shiloh emerge to participate in dancing.
  reasoning_layer_used: Lexical decisions for לָחוּל and בַּמְּחֹלוֹת
  rationale: This avoids repetitive English without specifying a type of dance.
- pob_phrase: seize for yourselves, each man his wife from the daughters of Shiloh
  simplified_phrase: Each man must seize one of them for himself as his wife
  preserved_meaning: Each man is instructed to take one woman forcefully for the purpose of marriage.
  reasoning_layer_used: Lexical and theological decisions on וַחֲטַפְתֶּם and אִישׁ אִשְׁתּוֹ
  rationale: The new sentence makes the one-per-man distribution and marital purpose immediately clear.
translation_notes:
  risk_flags:
