translation:
  language: en
  text: He gave the eleven hundred pieces of silver back to his mother. She said, “I had solemnly dedicated this silver of mine[a] to Yahweh for my son, to make a carved image and an image cast in metal.[b] So now I am giving the silver back to you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “from my hand,” referring to her own possession or personal agency.
    reason: cultural_note
  - marker: b
    text: Or “a molten image.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So he returned the eleven hundred pieces of silver to his mother
  simplified_phrase: He gave the eleven hundred pieces of silver back to his mother.
  preserved_meaning: He returned the full amount of silver without supplying an uncertain unit.
  reasoning_layer_used: Lexical decisions for וַיָּשֶׁב and the silver amount
  rationale: “Gave back” expresses the act naturally while keeping the restitution sense.
- pob_phrase: I had solemnly dedicated the silver to Yahweh from my hand for my son
  simplified_phrase: I had solemnly dedicated this silver of mine to Yahweh for my son
  preserved_meaning: She emphatically set apart her own silver to Yahweh for her son’s benefit.
  reasoning_layer_used: Lexical and theological decisions on dedication, the divine name, and מִיָּדִי
  rationale: “This silver of mine” clarifies the hand idiom while the footnote preserves its possible agency nuance.
- pob_phrase: to make a carved image and a cast image
  simplified_phrase: to make a carved image and an image cast in metal
  preserved_meaning: The silver was intended for two described forms of crafted image without identifying who would make them.
  reasoning_layer_used: Lexical decisions for פֶּסֶל and מַסֵּכָה, with the reviewed syntax of לִבְנִי לַעֲשׂוֹת
  rationale: The comma avoids assigning the work to the son, while “cast in metal” explains the craft term.
