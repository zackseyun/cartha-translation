translation:
  language: en
  text: He said to his mother, “The eleven hundred pieces of silver taken from you—you pronounced a curse about them,[a] and I heard it. Look, I have the silver. I took it.” His mother replied, “May Yahweh bless you, my son.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you swore an oath about them”; the Hebrew can refer to an oath or a curse, but the context favors a curse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: about which you uttered a curse and also spoke in my hearing
  simplified_phrase: you pronounced a curse about them, and I heard it
  preserved_meaning: His mother spoke a curse concerning the missing silver within his hearing.
  reasoning_layer_used: POB lexical decisions for אָלָה and the hearing idiom
  rationale: The rewrite removes the dense relative clause while retaining both the curse and his direct awareness of it.
- pob_phrase: the silver is with me
  simplified_phrase: I have the silver
  preserved_meaning: He admits that the missing silver is in his possession.
  reasoning_layer_used: POB lexical decision for הַכֶּסֶף אִתִּי
  rationale: Ordinary possession language is clearer while conveying the same fact.
- pob_phrase: Blessed be my son by Yahweh
  simplified_phrase: May Yahweh bless you, my son
  preserved_meaning: The mother invokes Yahweh’s blessing upon her son.
  reasoning_layer_used: POB blessing-formula rationale and divine-name decision
  rationale: The compact Hebrew formula becomes natural direct speech without replacing Yahweh’s personal name.
