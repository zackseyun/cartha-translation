translation:
  language: en
  text: She reached for the tent peg, and with her right hand she reached for the workman’s hammer.[a] Then she struck Sisera. She shattered his head; she smashed and pierced his temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “a worker’s mallet”; the exact kind of striking tool is uncertain.
    reason: lexical_alternative
