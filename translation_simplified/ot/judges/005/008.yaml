translation:
  language: en
  text: Israel’s people chose new gods.[a] Then war reached their city gates.[b] Could anyone find a shield or spear among forty thousand people in Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “He” or “one chose new gods”; the singular Hebrew verb is commonly understood to refer collectively to Israel’s people.
    reason: alternative_reading
  - marker: b
    text: The Hebrew is difficult and may also mean, “Then there was fighting at the gates.”
    reason: lexical_alternative
