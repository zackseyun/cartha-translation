translation:
  language: en
  text: Then those who remained came down against the nobles.[a] Yahweh’s people came down for me[b] against the mighty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Then a survivor came down to the nobles.” The Hebrew poetry is difficult and may describe coming to, for, or with them rather than against them.
    reason: alternative_reading
  - marker: b
    text: “For me” probably refers to Deborah, who is singing this song.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the remnant
  simplified_phrase: those who remained
  preserved_meaning: A surviving group came down.
  reasoning_layer_used: POB lexical decision for שָׂרִיד
  rationale: The clearer phrase preserves the collective sense of a surviving band.
- pob_phrase: the people of Yahweh
  simplified_phrase: Yahweh’s people
  preserved_meaning: The people belong to Yahweh in a covenant relationship.
  reasoning_layer_used: POB lexical and theological decisions for עָם יְהוָה
  rationale: The possessive form is more natural while keeping Yahweh’s personal name and the covenantal force.
- pob_phrase: the remnant came down against the nobles; the people of Yahweh came down for me against the mighty
  simplified_phrase: Then those who remained came down against the nobles. Yahweh’s people came down for me against the mighty.
  preserved_meaning: The two parallel movements into conflict remain distinct.
  reasoning_layer_used: POB syntactical decision and Hebrew poetic parallelism
  rationale: Two sentences make the parallel battle action easier to follow without merging its parts.
translation_notes:
  risk_flags:
  - risk: Readers may take the hostile sense of the Hebrew prepositions as certain.
    mitigation: Footnote a preserves the important non-hostile alternatives.
  - risk: The speaker identified by “for me” is not explicit in the Hebrew phrase itself.
    mitigation: Footnote b presents Deborah as probable rather than certain.
