  text: 'Sisera’s mother looked out through the lattice of the window and wailed: “Why has his chariot not come yet? Why are the hoofbeats of his chariots taking so long?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “cried out”; the Hebrew verb is rare and describes an anxious or sorrowful cry.
    reason: lexical_alternative
  - marker: b
