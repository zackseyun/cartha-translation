translation:
  language: en
  text: Kings came and fought. Then the kings of Canaan fought at Taanach, near the waters of Megiddo. They took no silver as plunder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “gain of silver” or “profit of silver,” but the battle setting favors silver taken as plunder.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Kings came; they fought.
  simplified_phrase: Kings came and fought.
  preserved_meaning: Kings arrived for battle and fought.
  reasoning_layer_used: Lexical decisions for בָּאוּ and נִלְחָמוּ.
  rationale: Joining the two short clauses makes the poetic opening flow naturally without losing either action.
- pob_phrase: by the waters of Megiddo
  simplified_phrase: near the waters of Megiddo
  preserved_meaning: The battle took place close to the waters associated with Megiddo.
  reasoning_layer_used: Lexical decision for עַל מֵי מְגִדּוֹ.
  rationale: “Near” makes the geographic relationship immediately clear.
- pob_phrase: they took no plunder of silver
  simplified_phrase: They took no silver as plunder.
  preserved_meaning: The Canaanite kings gained no silver spoil from the battle.
  reasoning_layer_used: Lexical decisions for בֶּצַע כֶּסֶף and לֹא לָקָחוּ.
  rationale: The recast wording uses ordinary English while retaining the battle-plunder sense.
