translation:
  language: en
  text: “Aren’t they finding and dividing the plunder? One womb,[a] even two wombs, for each man; plunder of dyed cloth for Sisera, plunder of dyed cloth, embroidered cloth—dyed cloth, two embroideries—for the necks of those taken as plunder.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “womb,” a brutal way of referring to women taken for sex as plunder.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew ending is difficult; it may refer to embroidered cloth for the necks of captives, especially captive women.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Are they not finding and dividing the spoil?
  simplified_phrase: Aren’t they finding and dividing the plunder?
  preserved_meaning: The rhetorical question vividly imagines goods taken in war being distributed.
  reasoning_layer_used: POB lexical decisions for הֲלֹא, יִמְצְאוּ, יְחַלְּקוּ, and שָׁלָל
  rationale: The contraction and familiar word “plunder” make the question natural without changing its force.
- pob_phrase: A womb, two wombs for each man
  simplified_phrase: One womb, even two wombs, for each man
  preserved_meaning: The shocking objectification of captive women and the numerical escalation remain explicit.
  reasoning_layer_used: POB lexical and theological decisions for רַחַם רַחֲמָתַיִם
  rationale: “One” clarifies the count while the note explains the deliberately brutal image.
- pob_phrase: spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth, two embroideries
  simplified_phrase: plunder of dyed cloth for Sisera, plunder of dyed cloth, embroidered cloth—dyed cloth, two embroideries
  preserved_meaning: Sisera’s expected share and the repeated, compressed inventory of valuable textiles remain distinct.
  reasoning_layer_used: POB lexical decisions for צְבָעִים, רִקְמָה, and צֶבַע רִקְמָתַיִם
  rationale: Readable punctuation clarifies the list without merging its separate items or imposing an uncertain relationship.
interpretive_expansions:
- pob_phrase: for the necks of the spoil
  rendering: for the necks of those taken as plunder
  claim: “Spoil” may refer here to captive people rather than only captured goods.
  evidence:
