    text: The Hebrew word translated “villagers” may also mean “people in unwalled settlements” or “rural folk”; “rulers” is less likely.
    reason: lexical_alternative
  - marker: c
    text: Town gates were public gathering places where civic affairs and judgments were handled.
    reason: cultural_note
