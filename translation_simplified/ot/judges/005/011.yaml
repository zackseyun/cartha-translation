  text: From the sound of archers among the watering places, people there tell of Yahweh’s righteous acts and the righteous acts of his villagers in Israel.[a][b] Then Yahweh’s people went down to the town gates.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening line is difficult; it may instead mean, “At the sound of archers by the watering places.”
    reason: alternative_reading
