translation:
  language: en
  text: Gilead stayed across the Jordan. Why did Dan linger near the ships?[a] Asher sat along the seashore and stayed by his harbors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean, “Why did Dan live among the ships?”
    reason: lexical_alternative
  - marker: b
    text: Or “his inlets” or “his bays.”
    reason: lexical_alternative
