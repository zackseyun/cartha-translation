  rationale: “Across” expresses the same location in more familiar modern English.
- pob_phrase: and Dan—why did he sojourn by the ships?
  simplified_phrase: Why did Dan linger near the ships?
  preserved_meaning: The song rebukes Dan for remaining with the ships rather than joining the fight.
  reasoning_layer_used: POB lexical decision for יָגוּר and doctrine-realignment revision
  rationale: The direct question is easier to follow, while “linger” retains the reproachful force.
- pob_phrase: Asher sat by the seashore and stayed by his harbors
