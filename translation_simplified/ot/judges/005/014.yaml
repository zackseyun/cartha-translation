translation:
  language: en
  text: From Ephraim came those rooted in Amalek.[a] Then came Benjamin, among his clans.[b] Commanders came down from Machir,[c] and from Zebulun came those who wielded the scribe’s staff.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “rooted against Amalek” or “rooted in the hill country of Amalek.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew is unusually terse and literally reads, “after you, Benjamin, among your peoples.” It may mean that Benjamin followed the preceding group, among his clans or kinsmen.
    reason: lexical_alternative
  - marker: c
    text: Machir was the leading clan of the tribe of Manasseh.
    reason: cultural_note
  - marker: d
    text: This rare expression may describe a staff used for mustering troops or keeping records.
    reason: lexical_alternative
