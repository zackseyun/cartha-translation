translation:
  language: en
  text: No woman is more blessed than Jael,[a] the wife of Heber the Kenite. No woman in the tent[b] is more blessed than she is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated, “Jael is blessed above women.”
    reason: lexical_alternative
  - marker: b
    text: Literally “in the tent”; this may refer to women who live in tents.
    reason: cultural_note
simplification_decisions:
