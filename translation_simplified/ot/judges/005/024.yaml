  simplified_phrase: No woman is more blessed than Jael
  preserved_meaning: Jael receives the highest poetic praise among women.
  reasoning_layer_used: The lexical decision treats the Hebrew comparison as superlative.
  rationale: A negative comparison expresses the same praise in direct modern English.
- pob_phrase: among women in the tent, most blessed is she
  simplified_phrase: No woman in the tent is more blessed than she is
  preserved_meaning: The repeated line again declares Jael the most blessed.
  reasoning_layer_used: The lexical decisions preserve both the singular “tent” and the repeated blessing.
  rationale: The recast removes the inverted word order without losing the poetic repetition.
