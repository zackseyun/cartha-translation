translation:
  language: en
  text: But his concubine[b] was unfaithful to him.[a] She left him and went to her father’s home in Bethlehem in Judah. She stayed there for four months.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “acted like a prostitute against him.” Some ancient interpreters understood this as “became angry with him” or “quarreled with him.”
    reason: alternative_reading
  - marker: b
    text: A concubine was a wife of lower social status.
    reason: cultural_note
