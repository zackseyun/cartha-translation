translation:
  language: en
  text: This happened in those days,[a] when there was no king in Israel. A man who was a Levite lived in a remote part of the hill country of Ephraim. He took a woman from Bethlehem in Judah as his concubine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “and there was no king in Israel.” The Hebrew can express this as a separate statement rather than as background for the events.
    reason: alternative_reading
  - marker: b
    text: A concubine was a woman in a recognized union whose social status was lower than that of a wife, not merely a casual partner.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And it happened in those days, when there was no king in Israel, that
  simplified_phrase: This happened in those days, when there was no king in Israel.
  preserved_meaning: The narrative opening and the refrain about Israel having no king remain intact.
  reasoning_layer_used: Lexical and theological decisions on וַיְהִי and the kingship refrain
  rationale: A separate opening sentence removes the dense introductory clause without interpreting the refrain.
- pob_phrase: a Levite man was dwelling in the remote parts of the hill country of Ephraim
  simplified_phrase: A man who was a Levite lived in a remote part of the hill country of Ephraim.
  preserved_meaning: He was a Levite man living in a geographically remote area of Ephraim.
  reasoning_layer_used: Lexical decisions on אִישׁ לֵוִי, גָּר, and בְּיַרְכְּתֵי
  rationale: Ordinary clause order and “lived” make the description easier to understand.
- pob_phrase: he took for himself a woman, a concubine
  simplified_phrase: He took a woman ... as his concubine.
  preserved_meaning: He entered a recognized union with a woman who had the social status of a concubine.
  reasoning_layer_used: Lexical decisions on וַיִּקַּח לוֹ and אִשָּׁה פִילֶגֶשׁ
  rationale: The wording states the relationship naturally while retaining her specific status.
translation_notes:
  risk_flags:
  - risk: Readers may assume the no-king refrain endorses monarchy.
    mitigation: The text presents it only as narrative context without adding an evaluation.
  - risk: Modern readers may understand “concubine” as merely a casual partner.
    mitigation: The cultural footnote identifies it as a recognized union of lower social status.
