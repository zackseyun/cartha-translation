translation:
  language: en
  text: Just then, an old man came in from working in the fields that evening. He was from the hill country of Ephraim and was staying in Gibeah.[a] The local men, however, were Benjaminites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Was staying” may also mean that he was living there as an outsider rather than merely visiting.
    reason: lexical_alternative
