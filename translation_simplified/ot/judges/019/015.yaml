translation:
  language: en
  text: So they left the road to enter Gibeah and spend the night. He went in and sat down in the city’s open square,[a] but no man took them into his house for the night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “street”; the Hebrew word can mean a broad public street or square.
    reason: lexical_alternative
