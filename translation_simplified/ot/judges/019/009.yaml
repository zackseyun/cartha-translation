translation:
  language: en
  text: Then the man got up to leave with his concubine and his young man. But his father-in-law, the young woman’s father, said to him, “Look, it is getting late, and evening is coming. Please stay the night. The day is almost over. Stay here tonight and let your heart be glad. Tomorrow you can all get up early for your journey, and you can go to your tent.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Go to your tent” may also mean “go home.”
    reason: lexical_alternative
