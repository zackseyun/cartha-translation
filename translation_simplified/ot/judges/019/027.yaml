translation:
  language: en
  text: In the morning, her master got up, opened the doors of the house, and set out to continue his journey. There at the entrance lay the woman, his concubine,[a] with her hands on the threshold.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A concubine was a woman in a recognized but lower-status marriage relationship.
    reason: cultural_note
  - marker: b
    text: Or, more literally, “She was fallen at the entrance of the house.”
    reason: lexical_alternative
