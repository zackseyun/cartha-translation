  preserved_meaning: He left the house intending to resume his travels.
  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: The rewrite replaces a repetitive Hebrew idiom with its clear contextual meaning.
- pob_phrase: and behold, the woman, his concubine, was lying at the entrance of the house
  simplified_phrase: There at the entrance lay the woman, his concubine
  preserved_meaning: The narrative suddenly draws attention to the woman lying at the doorway.
  reasoning_layer_used: POB lexical decisions for וְהִנֵּה, נֹפֶלֶת, and פֶּתַח הַבַּיִת
  rationale: “There” and the inverted word order preserve the vivid discovery without archaic “behold.”
