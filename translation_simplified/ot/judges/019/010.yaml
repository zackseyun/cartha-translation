translation:
  language: en
  text: But the man would not stay overnight. He got up, set out, and reached a point facing Jebus (that is, Jerusalem). He had two saddled donkeys with him, along with his concubine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A concubine was a woman in a recognized union with a man, but she had lower status than a wife.
    reason: cultural_note
