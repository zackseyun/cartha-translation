translation:
  language: en
  text: He said to him, “We are passing through on our way from Bethlehem in Judah to the far reaches of Ephraim’s hill country. I am from there. I went to Bethlehem in Judah, and I am going to the house of Yahweh.[a] But no man has welcomed me into his home.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I am going home” or “to my house.” The Hebrew reads “the house of Yahweh,” though that wording is unexpected here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim
  simplified_phrase: We are passing through on our way from Bethlehem in Judah to the far reaches of Ephraim’s hill country
  preserved_meaning: They are traveling through the area toward a remote part of Ephraim’s hill country.
  reasoning_layer_used: Lexical decision for עֹבְרִים and יַרְכְּתֵי הַר אֶפְרַיִם
  rationale: “On our way” makes the transit wording natural while “far reaches” keeps the sense of remoteness.
- pob_phrase: I am from there, and I went to Bethlehem in Judah
  simplified_phrase: I am from there. I went to Bethlehem in Judah
  preserved_meaning: He comes from Ephraim’s hill country and had traveled to Bethlehem.
  reasoning_layer_used: Lexical decisions for מִשָּׁם אָנֹכִי and וָאֵלֵךְ
  rationale: Two short sentences clarify his origin and previous journey without changing the Hebrew tense.
- pob_phrase: but no man is taking me into his house
  simplified_phrase: But no man has welcomed me into his home
  preserved_meaning: No male householder has given him lodging and hospitality.
  reasoning_layer_used: Lexical and theological decisions for וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  rationale: “Welcomed me into his home” states the hospitality sense in ordinary English while retaining “no man.”
translation_notes:
  risk_flags:
  - risk: “The house of Yahweh” is contextually difficult and may reflect an idiom or different reading.
    mitigation: The main text follows the Hebrew wording, while the footnote preserves the home or house alternatives.
