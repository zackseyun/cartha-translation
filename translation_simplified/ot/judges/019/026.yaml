translation:
  language: en
  text: As dawn approached,[a] the woman came and fell at the doorway of the man’s house, where her master[b] was. She remained there until daylight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “toward morning” or “before dawn”; it pictures morning beginning to turn.
    reason: lexical_alternative
  - marker: b
    text: Or “her lord.” The Hebrew describes his authority over her rather than explicitly calling him her husband.
    reason: lexical_alternative
