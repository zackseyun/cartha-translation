translation:
  language: en
  text: Then all the sons of Israel[a] came out. The whole congregation—from Dan to Beer-sheba and from the land of Gilead—gathered in unity as one man, to Yahweh at Mizpah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” refers here to the people and tribes of Israel as a whole, not only to individual men.
    reason: lexical_alternative
  - marker: b
    text: Or “gathered before Yahweh at Mizpah.” The Hebrew can describe either coming to Yahweh or gathering in his presence.
    reason: alternative_reading
