translation:
  language: en
  text: Then the men waiting in ambush quickly attacked Gibeah. They pressed forward[a] and killed everyone in the city with their swords.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the ambush drew out”; it may describe the force extending forward or pressing into the city.
    reason: lexical_alternative
