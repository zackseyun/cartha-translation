- pob_phrase: the men in ambush quickly rushed against Gibeah
  simplified_phrase: the men waiting in ambush quickly attacked Gibeah
  preserved_meaning: The concealed force made a sudden, rapid assault on Gibeah.
  reasoning_layer_used: Lexical decisions for הָאֹרֵב, הֵחִישׁוּ, and וַיִּפְשְׁטוּ אֶל
  rationale: “Waiting in ambush” and “attacked” express the military action in common English.
- pob_phrase: the ambush advanced
  simplified_phrase: They pressed forward
  preserved_meaning: The ambushing force continued moving forward into the attack.
  reasoning_layer_used: Lexical decision and footnote for וַיִּמְשֹׁךְ
  rationale: The pronoun gives the force a natural personal subject while the footnote preserves the compressed Hebrew image.
- pob_phrase: struck the whole city with the edge of the sword
  simplified_phrase: killed everyone in the city with their swords
  preserved_meaning: The sword attack killed the city’s inhabitants comprehensively.
  reasoning_layer_used: Lexical decisions for וַיַּךְ, כָּל הָעִיר, and לְפִי חָרֶב
  rationale: The wording clearly states both the lethal action and the total effect on the inhabitants.
