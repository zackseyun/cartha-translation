translation:
  language: en
  text: The Benjaminites[a] came out against Israel’s forces and were drawn away from the city. As in the earlier battles, they began striking down men of Israel along the two roads. One road went up to Bethel, and the other ran through the open country toward Gibeah. They struck down about thirty men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the sons of Benjamin.”
    reason: lexical_alternative
