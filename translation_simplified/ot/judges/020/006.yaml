  reasoning_layer_used: Lexical decision for וָאֲשַׁלְּחֶהָ and immediate context
  rationale: Naming the pieces removes a confusing pronoun without changing its referent.
- pob_phrase: throughout all the territory of Israel’s inheritance
  simplified_phrase: throughout all the land Israel had received as its inheritance
  preserved_meaning: The pieces were sent across Israel’s allotted covenant land.
  reasoning_layer_used: Lexical and theological decisions for נַחֲלַת יִשְׂרָאֵל
  rationale: The wording explains the territorial sense while retaining the covenantal idea of inheritance.
- pob_phrase: lewdness and outrage
  simplified_phrase: sexual wickedness and a disgraceful outrage
  preserved_meaning: The acts were sexually shameful and a severe violation of Israel’s communal norms.
  reasoning_layer_used: Lexical and theological decisions for זִמָּה וּנְבָלָה
  rationale: Common wording preserves both the sexual dimension and the force of communal disgrace.
