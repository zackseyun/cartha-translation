translation:
  language: en
  text: So I took hold of my concubine[a], cut her body into pieces, and sent the pieces throughout all the land Israel had received as its inheritance. I did this because they had committed sexual wickedness and a disgraceful outrage in Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A concubine was a socially recognized female partner with lower status than a full wife.
    reason: cultural_note
