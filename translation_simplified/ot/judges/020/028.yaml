translation:
  language: en
  text: At that time Phinehas, son of Eleazar and grandson of Aaron, stood before the ark[a] and asked, “Should I go out once more to fight the people of Benjamin, my fellow Israelites, or should I stop?” Yahweh answered, “Go up against them, for tomorrow I will hand Benjamin over to you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that Phinehas stood before Yahweh.
    reason: alternative_reading
