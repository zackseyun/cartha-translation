- pob_phrase: the son of Eleazar, son of Aaron
  simplified_phrase: son of Eleazar and grandson of Aaron
  preserved_meaning: Phinehas’s priestly family line through Eleazar to Aaron remains explicit.
  reasoning_layer_used: lexical decision on priestly lineage
  rationale: “Grandson” makes the three-generation relationship immediately clear.
- pob_phrase: the sons of Benjamin my brother
  simplified_phrase: the people of Benjamin, my fellow Israelites
  preserved_meaning: Phinehas identifies Benjamin as related Israelite people despite the civil war.
  reasoning_layer_used: lexical decision and cultural note on kinship
  rationale: This explains the tribal kinship while retaining Phinehas’s singular perspective.
- pob_phrase: I will give him into your hand
  simplified_phrase: I will hand Benjamin over to you
  preserved_meaning: Yahweh promises to place Benjamin under Israel’s power in battle.
  reasoning_layer_used: lexical decision on the victory idiom and collective singular
  rationale: Naming Benjamin clarifies the collective singular while preserving the handing-over image.
