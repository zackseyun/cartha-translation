translation:
  language: en
  text: They surrounded Benjamin’s forces, chased them without giving them any rest, and trampled them down as far as the area opposite Gibeah, on its east side.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “chased them from Menuchah,” if the Hebrew word is a place name.
    reason: alternative_reading
  - marker: b
    text: Or “drove them along” instead of “trampled them down.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression literally refers to “the east of the sun,” meaning eastward or on the east side.
    reason: simplification_note
