translation:
  language: en
  text: Then the sons of Israel went up and wept before Yahweh until evening. They asked Yahweh, “Should I continue[a] to approach the sons of Benjamin, my brother, for battle?” Yahweh answered, “Go up against him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Should I again approach for battle against the sons of Benjamin, my brother?” The Hebrew may refer either to continuing or repeating the attack.
    reason: lexical_alternative
