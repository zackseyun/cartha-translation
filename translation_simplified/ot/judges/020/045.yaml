translation:
  language: en
  text: The Benjaminites turned and fled toward the wilderness, heading for the rock of Rimmon. The Israelites cut down five thousand of them along the highways.[a] They pursued the survivors as far as Gidom and struck down two thousand of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “gleaned him,” using a singular pronoun for the fleeing Benjaminites as a group and picturing survivors being picked off like grain left after harvest.
    reason: lexical_alternative
