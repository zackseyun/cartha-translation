  preserved_meaning: The defeated Benjaminites changed direction and fled toward the wilderness and the rock of Rimmon.
  reasoning_layer_used: source payload, lexical decisions, and immediate narrative context
  rationale: Naming the group and recasting the destination phrase clarify the movement without implying that they turned back.
- pob_phrase: they cut down five thousand men of them on the highways
  simplified_phrase: The Israelites cut down five thousand of them along the highways
  preserved_meaning: Israel's forces killed five thousand fleeing Benjaminite men on the established routes.
  reasoning_layer_used: lexical decisions and immediate narrative context
  rationale: Naming the attackers prevents the pronouns from making it sound as though the fugitives attacked themselves.
- pob_phrase: pursued them as far as Gidom, and struck down two thousand men of them
  simplified_phrase: pursued the survivors as far as Gidom and struck down two thousand of them
  preserved_meaning: The pursuit continued to Gidom, and two thousand men from the fleeing group were killed.
  reasoning_layer_used: lexical decisions and collective-suffix footnote
  rationale: “The survivors” identifies the pursued group while preserving both the pursuit and the further deaths.
