translation:
  language: en
  text: But six hundred men turned and fled toward the wilderness,[a] heading for the rock of Rimmon. They stayed there for four months.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “into the wilderness.” The Hebrew can indicate movement toward or into that region.
    reason: lexical_alternative
