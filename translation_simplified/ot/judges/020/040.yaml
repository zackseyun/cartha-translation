  preserved_meaning: The rising pillar of smoke was the prearranged battle signal.
  reasoning_layer_used: POB lexical decisions for הַמַּשְׂאֵת and עַמּוּד עָשָׁן
  rationale: The apposition directly identifies the visible smoke as the signal.
- pob_phrase: Benjamin turned behind him
  simplified_phrase: The Benjaminites turned around and saw
  preserved_meaning: The tribe of Benjamin turned back or looked behind and discovered what was happening.
  reasoning_layer_used: POB lexical rationale for וַיִּפֶן בִּנְיָמִין אַחֲרָיו and the following discovery marker
