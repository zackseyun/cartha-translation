- pob_phrase: and behold, the whole city was going up to the heavens
  simplified_phrase: and saw that the whole city was burning, with flames and smoke rising toward the heavens
  preserved_meaning: They suddenly discovered the entire city burning as fire and smoke rose skyward.
  reasoning_layer_used: POB lexical decisions and footnote c
  rationale: The wording states the implied burning plainly while preserving the upward image.
