- pob_phrase: you will conceive and bear a son
  simplified_phrase: you will become pregnant and give birth to a son
  preserved_meaning: The woman will conceive and later deliver a male child.
  reasoning_layer_used: Lexical and theological decisions on the announcement’s temporal force
  rationale: Common wording makes both stages immediately clear while retaining the predictive sense.
- pob_phrase: wine or strong drink
  simplified_phrase: wine or any other intoxicating drink
  preserved_meaning: She must avoid wine and other alcoholic beverages.
  reasoning_layer_used: Lexical decision for שֵׁכָר
  rationale: The phrase explains the older category without limiting it to a specific beverage.
- pob_phrase: do not eat anything unclean
  simplified_phrase: do not eat any food considered unclean
  preserved_meaning: She must avoid food prohibited as ritually unclean.
  reasoning_layer_used: Lexical decision for כָּל טֻמְאָה
  rationale: Adding “food” prevents readers from taking “unclean” as ordinary dirtiness.
