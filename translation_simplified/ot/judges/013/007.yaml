translation:
  language: en
  text: For he told me, “You will become pregnant[a] and give birth to a son. From now on, do not drink wine or any other intoxicating drink, and do not eat any food considered unclean. The boy will be a Nazirite of God[b] from the womb until the day he dies.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered, “Look, you are pregnant and will give birth to a son,” though the context supports the future sense.
    reason: lexical_alternative
  - marker: b
    text: A Nazirite was a person specially set apart for God.
    reason: cultural_note
