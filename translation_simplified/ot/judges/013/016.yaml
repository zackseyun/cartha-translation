  text: The angel of Yahweh said to Manoah, “If you keep me here, I will not eat your food. But if you prepare a burnt offering,[a] offer it up to Yahweh.” Manoah did not know that he was the angel of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A burnt offering was a sacrifice completely burned for God.
