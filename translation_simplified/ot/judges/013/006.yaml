translation:
  language: en
  text: Then the woman came to her husband and said, “A man of God came to me. He looked like the angel of God,[a] and he was very fearsome.[b] I did not ask where he was from, and he did not tell me his name.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be understood as “an angel of God,” since the woman may not yet have fully identified him.
    reason: alternative_reading
  - marker: b
    text: The Hebrew describes a sight that was very fearsome, awesome, or terrifying.
    reason: lexical_alternative
