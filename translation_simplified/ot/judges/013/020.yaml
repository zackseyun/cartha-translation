translation:
  language: en
  text: As Manoah and his wife watched, the flame rose from the altar toward heaven. The angel of Yahweh[a] rose in the altar’s flame, and they fell facedown on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the messenger of Yahweh”; the Hebrew word can mean either “angel” or “messenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when the flame went up from the altar toward heaven ... while Manoah and his wife were watching
  simplified_phrase: As Manoah and his wife watched, the flame rose from the altar toward heaven.
  preserved_meaning: Manoah and his wife witnessed the flame rising heavenward from the altar.
  reasoning_layer_used: Lexical decisions for the temporal construction, upward motion, and ongoing observation.
  rationale: The reordered clause and shorter sentence make the simultaneous actions easier to follow.
- pob_phrase: the angel of Yahweh went up in the flame of the altar
  simplified_phrase: The angel of Yahweh rose in the altar’s flame
  preserved_meaning: The angel ascended within the visible flame without defining how this occurred.
  reasoning_layer_used: Lexical and theological decisions for מַלְאַךְ יְהוָה and בְּלַהַב הַמִּזְבֵּחַ.
  rationale: The wording keeps the vivid image and leaves the figure’s precise identity unresolved.
- pob_phrase: they fell on their faces to the ground
  simplified_phrase: they fell facedown on the ground
  preserved_meaning: They dropped to the ground with their faces down in fear and reverence.
  reasoning_layer_used: Lexical decision for the Hebrew posture idiom.
  rationale: “Fell facedown” expresses the same physical posture in natural modern English.
