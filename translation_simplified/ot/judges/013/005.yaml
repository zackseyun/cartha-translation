translation:
  language: en
  text: 'Listen: you are pregnant and will give birth to a son. A razor must never touch his head, because the boy will be a Nazirite of God from the womb.[a] He will begin to save[b] Israel from the hand of the Philistines.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Nazirite was a person specially set apart for God; here, his uncut hair marks that dedication from before birth.
    reason: cultural_note
  - marker: b
    text: Or “deliver.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For behold
  simplified_phrase: 'Listen:'
  preserved_meaning: The announcement still begins with a solemn call for attention.
  reasoning_layer_used: Lexical decision for הִנָּךְ
  rationale: “Listen” gives modern readers the attention-directing force of “behold.”
- pob_phrase: will bear a son
  simplified_phrase: will give birth to a son
  preserved_meaning: She will deliver the promised male child.
  reasoning_layer_used: Lexical decision for וְיֹלַדְתְּ בֵּן
  rationale: “Give birth” is clearer common English than “bear” in this sense.
- pob_phrase: No razor shall come upon his head
  simplified_phrase: A razor must never touch his head
  preserved_meaning: His hair is not to be cut with a razor.
  reasoning_layer_used: Lexical decision for מוֹרָה and לֹא יַעֲלֶה עַל רֹאשׁוֹ
  rationale: The direct prohibition is clearer while preserving the razor-and-head image.
translation_notes:
  risk_flags:
