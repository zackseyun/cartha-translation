translation:
  language: en
  text: When he saw her, he tore his clothes and said, “Alas, my daughter! You have brought me so low and become the cause of my trouble. I have opened my mouth to Yahweh,[a] and I cannot take back what I said.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, “I have made a vow to Yahweh.” The Hebrew literally says, “I have opened my mouth to Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when he saw her
  simplified_phrase: When he saw her
  preserved_meaning: The action begins when Jephthah sees his daughter.
  reasoning_layer_used: Lexical decision on the Hebrew narrative formula
  rationale: Removing the opening “And” gives natural modern narration without changing the sequence.
- pob_phrase: You have brought me very low
  simplified_phrase: You have brought me so low
  preserved_meaning: Jephthah expresses severe anguish and humiliation.
  reasoning_layer_used: Lexical and theological decisions on הַכְרֵעַ הִכְרַעְתִּנִי
  rationale: “So low” sounds more natural while keeping the statement intense without overstating blame.
- pob_phrase: I cannot turn back
  simplified_phrase: I cannot take back what I said
  preserved_meaning: Jephthah believes he cannot retract his solemn words to Yahweh.
  reasoning_layer_used: Lexical decision on וְלֹא אוּכַל לָשׁוּב and immediate vow context
  rationale: The explicit object makes the idiom immediately understandable in English.
