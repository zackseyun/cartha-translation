  preserved_meaning: The emphatic rhetorical comparison remains intact.
  reasoning_layer_used: POB lexical decision for וְעַתָּה and הֲטוֹב טוֹב אַתָּה
  rationale: “Now then” and “any better” express the challenge in natural modern English.
- pob_phrase: Did he ever contend with Israel
  simplified_phrase: Did Balak ever challenge Israel
  preserved_meaning: Balak did not press a dispute or claim against Israel.
  reasoning_layer_used: POB lexical decision for הֲרֹב רָב עִם יִשְׂרָאֵל
  rationale: “Challenge” is clearer than “contend,” while the footnote preserves the verb’s broader range.
- pob_phrase: did he ever fight against them
  simplified_phrase: did he ever go to war against them
  preserved_meaning: The second question refers specifically to armed conflict.
  reasoning_layer_used: POB lexical decision for נִלְחֹם נִלְחַם בָּם
  rationale: “Go to war” clearly distinguishes armed fighting from the preceding dispute.
