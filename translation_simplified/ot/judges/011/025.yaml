  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
  footnotes:
  - marker: a
    text: Or, 'are you any better than Balak son of Zippor, king of Moab?' The Hebrew uses an emphatic repetition ('good, good') to intensify the comparison.
