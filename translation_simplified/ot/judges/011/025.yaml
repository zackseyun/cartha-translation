translation:
  language: en
  text: Now then, are you any better than Balak son of Zippor, the king of Moab? Did Balak ever challenge Israel,[a] or did he ever go to war against them?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “dispute with” or “quarrel with.”
    reason: lexical_alternative
