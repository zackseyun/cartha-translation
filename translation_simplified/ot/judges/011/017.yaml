translation:
  language: en
  text: Then Israel sent messengers to ask the king of Edom, “Please let us travel through your land.”[a] But the king would not listen. Israel also sent messengers to the king of Moab, but he would not agree. So the Israelites stayed at Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “Please let me pass,” treating Israel as one people; the meaning here is “let us travel.”
    reason: lexical_alternative
