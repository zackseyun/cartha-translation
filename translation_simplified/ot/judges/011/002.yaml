translation:
  language: en
  text: Gilead had sons with his wife. When his wife’s sons grew up, they drove Jephthah away. They said to him, “You will receive no inheritance from our father’s household, because you are another woman’s son.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Gilead’s wife bore him sons
  simplified_phrase: Gilead had sons with his wife
  preserved_meaning: The sons were born to Gilead and his wife, in contrast to Jephthah’s different mother.
  reasoning_layer_used: POB translation and immediate context
  rationale: This replaces the formal wording “bore him” with ordinary English while keeping the family distinction.
- pob_phrase: When the sons of the wife grew up
  simplified_phrase: When his wife’s sons grew up
  preserved_meaning: The sons who later expelled Jephthah were the sons of Gilead’s wife.
  reasoning_layer_used: applied revision
  rationale: This keeps the revision’s deliberate identification of the sons while making the phrase natural in English.
- pob_phrase: You will not have an inheritance in our father’s house
  simplified_phrase: You will receive no inheritance from our father’s household
  preserved_meaning: The brothers denied Jephthah any share in the family inheritance.
  reasoning_layer_used: applied revision and POB translation
  rationale: “Receive no inheritance” states the exclusion clearly without changing the legal and family meaning.
translation_notes:
  risk_flags:
  - risk: “Household” may be understood only as the people rather than the family estate.
    mitigation: The retained word “inheritance” preserves the property and family-rights setting.
