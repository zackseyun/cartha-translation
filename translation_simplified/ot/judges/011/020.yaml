translation:
  language: en
  text: But Sihon would not let Israel pass through his territory because he did not trust them.[a] So he gathered all his people.[b] They camped at Jahaz, and Sihon fought against Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “did not believe Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “all his people,” not specifically “his army.”
    reason: source_note
simplification_decisions:
- pob_phrase: did not trust Israel to pass through his territory
  simplified_phrase: would not let Israel pass through his territory because he did not trust them
  preserved_meaning: Sihon refused Israel passage because he lacked confidence in them.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: The recast states the implied refusal in ordinary cause-and-effect English while retaining distrust as the reason.
- pob_phrase: So Sihon gathered all his people, and they camped at Jahaz
  simplified_phrase: So he gathered all his people. They camped at Jahaz
  preserved_meaning: Sihon assembled his people, who then camped at Jahaz.
  reasoning_layer_used: POB lexical decisions for וַיֶּאֱסֹף, כָּל עַמּוֹ, and וַיַּחֲנוּ
  rationale: Two short sentences make the sequence and the change from singular to plural easier to follow.
- pob_phrase: he fought against Israel
  simplified_phrase: Sihon fought against Israel
  preserved_meaning: Sihon attacked Israel as an adversary.
  reasoning_layer_used: POB translation and revision rationale for וַיִּלָּחֶם עִם
  rationale: Repeating Sihon removes pronoun ambiguity while keeping the natural adversarial sense.
