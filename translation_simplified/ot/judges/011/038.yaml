translation:
  language: en
  text: He told her, “Go.” He allowed her to leave for two months. She went into the mountains with her companions, and there she wept over her virginity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wept because of her virginity.” The verse does not say whether she mourned impending death, lifelong virginity and childlessness, or both.
    reason: lexical_alternative
