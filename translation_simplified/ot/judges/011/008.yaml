translation:
  language: en
  text: The elders of Gilead said to Jephthah, “That is why we have come back to you now. Go with us and fight the Ammonites, and you will be head over everyone who lives in Gilead.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: That is why we have now come back to you, so that you may go with us
  simplified_phrase: That is why we have come back to you now. Go with us
  preserved_meaning: Their return answers Jephthah’s objection and leads directly to their request.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: Two short sentences make the reason and request easier to follow.
- pob_phrase: fight against the Ammonites
  simplified_phrase: fight the Ammonites
  preserved_meaning: Jephthah is asked to wage battle against the people of Ammon.
  reasoning_layer_used: lexical decision for וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  rationale: English naturally allows “fight” to take the opposing people directly.
- pob_phrase: head over all the inhabitants of Gilead
  simplified_phrase: head over everyone who lives in Gilead
  preserved_meaning: Jephthah is promised broad civic and military authority over Gilead’s whole population.
  reasoning_layer_used: lexical and theological decisions on רֹאשׁ and authority scope
  rationale: “Everyone who lives” is clearer than “all the inhabitants” while retaining the headship image.
translation_notes:
  risk_flags:
  - risk: Modern readers may find the leadership sense of “head” less immediate.
    mitigation: The phrase “over everyone who lives in Gilead” clearly signals governing authority while preserving the source metaphor.
