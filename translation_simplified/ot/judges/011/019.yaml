translation:
  language: en
  text: Then Israel sent messengers to Sihon, king of the Amorites and king of Heshbon. Israel said to him, “Please let us travel through your land to my own place.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel speaks here as one people, so the Hebrew says “my own place,” though the request says “let us travel.”
    reason: source_note
