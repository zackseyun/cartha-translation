translation:
  language: en
  text: Then the Spirit of Yahweh came upon Jephthah. He traveled through Gilead and Manasseh and then through Mizpah of Gilead. From there he went on to the Ammonites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he crossed over to the Ammonites.” The Hebrew verb can mean passing through, crossing over, or moving onward, depending on the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he passed through Gilead and Manasseh
  simplified_phrase: He traveled through Gilead and Manasseh
  preserved_meaning: Jephthah moved through both territories.
  reasoning_layer_used: Lexical decision for וַיַּעֲבֹר with regional direct objects.
  rationale: “Traveled through” expresses movement across the regions in ordinary English.
- pob_phrase: He passed through Mizpah of Gilead, and from Mizpah of Gilead
  simplified_phrase: and then through Mizpah of Gilead. From there
  preserved_meaning: Jephthah went through Mizpah and departed from that place.
  reasoning_layer_used: Lexical decisions for Mizpah of Gilead and the phrase “from Mizpah of Gilead.”
  rationale: “From there” avoids heavy repetition while keeping the sequence and departure point clear.
- pob_phrase: he passed on to the Ammonites
  simplified_phrase: he went on to the Ammonites
  preserved_meaning: Jephthah continued to the Ammonites without stating that he attacked immediately.
  reasoning_layer_used: Lexical rationale for עָבַר בְּנֵי עַמּוֹן and the grounding review.
  rationale: “Went on to” preserves definite onward movement without adding an immediate attack.
