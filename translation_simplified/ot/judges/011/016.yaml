simplification_decisions:
- pob_phrase: when they came up from Egypt
  simplified_phrase: when the people of Israel came out of Egypt
  preserved_meaning: Israel departed from Egypt during the exodus.
  reasoning_layer_used: POB lexical decision for בַּעֲלוֹתָם מִמִּצְרַיִם and the collective sense of יִשְׂרָאֵל
  rationale: “Came out” states the familiar exodus movement more clearly than the conventional phrase “came up.”
- pob_phrase: Israel went through the wilderness
  simplified_phrase: the people of Israel ... traveled through the wilderness
  preserved_meaning: The nation of Israel journeyed across the wilderness region.
  reasoning_layer_used: POB lexical decisions for יִשְׂרָאֵל, וַיֵּלֶךְ, and בַּמִּדְבָּר
  rationale: “The people of Israel” makes the collective reference clear, and “traveled” naturally describes their journey.
translation_notes:
  risk_flags:
  - risk: “Came out” does not retain the literal upward movement in the Hebrew exodus idiom.
    mitigation: It preserves the intended departure from Egypt without suggesting a different route or event.
