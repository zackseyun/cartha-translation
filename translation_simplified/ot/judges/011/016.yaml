translation:
  language: en
  text: For when the people of Israel came out of Egypt, they traveled through the wilderness as far as the Red Sea[a] and came to Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Sea of Reeds.”
