translation:
  language: en
  text: When I realized that you would not rescue us, I risked my life[a] and went to fight the Ammonites. Yahweh handed them over to me. So why have you come against me today to fight me?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew pictures this as “putting my life in my hand.”
    reason: source_note
simplification_decisions:
- pob_phrase: When I saw that you were not delivering us
  simplified_phrase: When I realized that you would not rescue us
  preserved_meaning: Jephthah recognized that the addressee would not provide military rescue.
  reasoning_layer_used: The lexical decision for ראה and the military rescue sense of ישׁע, including the applied revision’s implied object “us.”
  rationale: This states the failed rescue plainly without adding how it would have happened.
- pob_phrase: I put my life in my hand
  simplified_phrase: I risked my life
  preserved_meaning: Jephthah knowingly exposed himself to mortal danger.
  reasoning_layer_used: The lexical rationale identifies the Hebrew expression as an idiom for risking one’s life.
  rationale: The main text gives the idiom’s meaning while the footnote preserves its image.
- pob_phrase: crossed over against the Ammonites, and Yahweh gave them into my hand
  simplified_phrase: went to fight the Ammonites. Yahweh handed them over to me
  preserved_meaning: Jephthah advanced against Ammon, and Yahweh gave him victory over them.
  reasoning_layer_used: The battle-context lexical decisions and the theological decision to use Yahweh.
  rationale: Two direct sentences clarify the attack and Yahweh’s decisive role.
translation_notes:
  risk_flags:
  - risk: Replacing the life-in-the-hand idiom could hide the Hebrew image.
