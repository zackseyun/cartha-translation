translation:
  language: en
  text: Then Jephthah brought together all the men of Gilead and fought against Ephraim. The Gileadites struck the Ephraimites down because the Ephraimites had said, “You Gileadites are fugitives of Ephraim, among Ephraim and among Manasseh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew accusation is difficult; it may also mean, “You are fugitives of Ephraim, O Gilead, among Ephraim and among Manasseh.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gathered all the men of Gilead
  simplified_phrase: brought together all the men of Gilead
  preserved_meaning: Jephthah mobilized Gilead’s men for battle.
  reasoning_layer_used: Lexical decision for וַיִּקְבֹּץ and כָּל אַנְשֵׁי גִלְעָד
  rationale: “Brought together” makes the act of gathering immediately clear without implying formal conscription.
- pob_phrase: fought with Ephraim
  simplified_phrase: fought against Ephraim
  preserved_meaning: Jephthah and Gilead engaged Ephraim as their enemy.
  reasoning_layer_used: Lexical decision for וַיִּלָּחֶם אֶת אֶפְרָיִם
  rationale: “Against” avoids the modern sense that they fought alongside Ephraim.
- pob_phrase: in the midst of Ephraim and in the midst of Manasseh
  simplified_phrase: among Ephraim and among Manasseh
  preserved_meaning: The taunt places Gilead in relation to both Ephraim and Manasseh.
  reasoning_layer_used: Lexical decision for בְּתוֹךְ
  rationale: “Among” is plainer English while preserving the repeated relation to both groups.
interpretive_expansions:
- pob_phrase: because they had said
  rendering: because the Ephraimites had said
  claim: The people of Ephraim were the speakers of the insult.
  evidence:
  - The immediate conflict identifies Ephraim as the group opposed to Gilead.
  - The POB theological decision describes the words as the speakers’ insult against the Gileadites.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the difficult Hebrew syntax of the accusation.
translation_notes:
  risk_flags:
  - risk: Naming the Ephraimites as the speakers makes an implicit subject explicit.
    mitigation: The immediate context supports this identification, while the footnote preserves the clause’s larger syntactic ambiguity.
  - risk: The final insult remains awkward because the Hebrew itself is difficult.
    mitigation: The main text keeps its insulting force, and the footnote gives the principal alternative reading.
