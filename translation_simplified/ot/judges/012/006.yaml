  text: Then they asked him, “Please say ‘Shibboleth.’”[a] He said, “Sibboleth,” because he could not pronounce the word with the “sh” sound. So they seized him and slaughtered him at the places where people crossed the Jordan River. At that time, 42,000 people from Ephraim died.
