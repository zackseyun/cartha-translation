translation:
  language: en
  text: They waited until they felt embarrassed.[a] But he still did not open the doors of the upstairs room. So they took the key and opened the doors. There was their master, fallen dead on the floor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until they felt ashamed.” The expression likely describes how awkward they felt after waiting so long.
    reason: lexical_alternative
