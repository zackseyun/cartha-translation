translation:
  language: en
  text: But while they waited, Ehud escaped. He went past the carved images[a] and escaped to Seirah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “idols.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: while they delayed
  simplified_phrase: while they waited
  preserved_meaning: Their hesitation gave Ehud time to escape.
  reasoning_layer_used: The lexical decision identifies the phrase as the time during which the servants delayed or lingered.
  rationale: “Waited” is more natural in this scene than “delayed.”
- pob_phrase: he passed beyond the carved images
  simplified_phrase: He went past the carved images
  preserved_meaning: Ehud moved beyond a known landmark of carved objects.
  reasoning_layer_used: The lexical decision treats the verb as travel past a landmark and retains “carved images.”
  rationale: “Went past” expresses the movement in ordinary English.
- pob_phrase: escaped while they delayed, and he passed beyond
  simplified_phrase: escaped. He went past
  preserved_meaning: The sequence remains his initial escape, movement past the landmark, and escape to Seirah.
  reasoning_layer_used: The lexical rationale preserves both occurrences of “escaped” as stages in the getaway.
  rationale: Two sentences make the action easier to follow without removing the repeated verb.
translation_notes:
  risk_flags:
  - risk: Repeating “escaped” may sound unusual in English.
    mitigation: The repetition is retained because the source marks both the getaway and the completed escape.
