translation:
  language: en
  text: Yahweh’s anger burned against Israel. He sold them into the hand—that is, the power—of Cushan-rishathaim, king of Aram-naharaim.[a] The sons of Israel[b] served Cushan-rishathaim for eight years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram-naharaim is traditionally understood as “Aram of the Two Rivers” and is also called Mesopotamia.
    reason: lexical_alternative
  - marker: b
    text: “The sons of Israel” is the literal Hebrew expression for the covenant people; many translations say “the Israelites.”
    reason: lexical_alternative
